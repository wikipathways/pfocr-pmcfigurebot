caption: '(A) Schematics of the animal experiment 5. (B) The SBP and MAP of SHR in
  all groups were measured by tail cuff. SBP were analyzed using two-way ANOVA with
  repeated measures and corrected for multiple comparisons by controlling the FDR
  with two-stage step-up method of Benjamini, Krieger and Yekutieli. N = 5 per group.
  * p < 0.05 vs. MxT+sal, # p < 0.005 vs. FxT+sal. For p-values, see Table S5. The
  MAP of SHR was measured by carotid artery catheterization. Data were analyzed using
  two-way ANOVA and corrected for multiple comparisons by controlling the FDR with
  two-stage step-up method of Benjamini, Krieger and Yekutieli. (C) Feces TMA, plasma
  and PVN TMAO levels in DHT-supplemented and gonadectomized SHR with or without DMB.
  Data were analyzed using two-way ANOVA and corrected for multiple comparisons by
  controlling the FDR with two-stage step-up method of Benjamini, Krieger and Yekutieli.
  Correlation coefficients between the MAP and the levels of TMA or PVN TMAO as performed
  by a two-tailed Pearson correlation coefficients computation, following with a linear
  regression analysis'
