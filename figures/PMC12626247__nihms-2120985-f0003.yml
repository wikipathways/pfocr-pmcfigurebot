figure_title: HPV+ TP53-WT HNSCC tumors exhibit higher gene methylation levels and
  fewer chromosomal abnormalities compared to HPV+ TP53-mutant tumors.
caption: 'HPV+ TP53-WT HNSCC tumors exhibit higher gene methylation levels and fewer
  chromosomal abnormalities compared to HPV+ TP53-mutant tumors. (A) Differential
  gene methylation is presented as log2 fold change (log2Ratio). In the volcano plot,
  significantly differentially methylated genes are highlighted in light blue. Genes
  with significantly higher methylation in TP53-WT tumors that were used for pathway
  enrichment analysis (500 genes) are outlined in red, while those with significantly
  higher methylation in TP53-mutant tumors used for pathway analysis are outlined
  in blue (23 genes). Right panels display pathway enrichment analysis of differentially
  methylated genes for each tumor type, based on the Gene Ontology Biological Process
  (GOBP) dataset. (B) Normalized methylation levels (top row) and RNA-seq read counts
  (RSEM) (bottom row) for MET, VHL, and PIK3R1 in HPV+ TP53-WT and HPV+ TP53-mutant
  HNSCC tumors. (C) Chromosomal alterations (gains and losses) across specified loci.
  The Y-axis represents the percentage of tumors with chromosomal alterations, while
  the X-axis denotes the specific genomic loci analyzed. Summary results (all loci)
  are shown to the right end of the plot (orange bars). Statistical significance is
  indicated as follows: *p < 0.05, **p < 0.005, ***p < 0.0005, ****p < 0.00005, ns
  = not significant. [Color figure can be viewed at wileyonlinelibrary.com]'
