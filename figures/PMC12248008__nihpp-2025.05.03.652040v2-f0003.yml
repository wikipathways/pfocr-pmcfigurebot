caption: Biological pathways enriched on (a) PC3, (b) PC4, and (c) PC6. All pathways
  are significant with a Benjamini-Hochberg adjusted p<0.01. The gene size represents
  the number of genes enriched in the biological pathway. Pathways are shown with
  associations to human sarcopenia (red) and control (blue) based on the directionality
  of separation for each PC. The bar plots are represented by their respective normalized
  enrichment score (NES). (SA=sarcopenia, C=control)
