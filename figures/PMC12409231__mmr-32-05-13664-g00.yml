figure_title: Molecular mechanism of PINK1/Parkin pathway-mediated mitophagy in NAFLD.
caption: Molecular mechanism of PINK1/Parkin pathway-mediated mitophagy in NAFLD.
  Mitochondrial-localized PINK1 senses depolarized mitochondria, and Parkin, an E3
  ubiquitin ligase, participates in the mitophagy process. In the context of NAFLD,
  perturbations in the PINK1/Parkin pathway impede mitophagy. This triggers a series
  of downstream events, including the activation of inflammasomes, the formation of
  apoptotic bodies and the activation of hepatic stellate cells. The subsequent morphological
  and functional changes of mitochondria and the downstream pathological consequences,
  collectively demonstrate how the dysregulation of PINK1/Parkin-mediated mitophagy
  contributes to the progression of NAFLD. This figure was created using Biorender
  software (https://app.biorender.com/). PINK1, PTEN-induced putative kinase 1; NAFLD,
  non-alcoholic fatty liver disease; mtROS, mitochondrial reactive oxygen species;
  ΔΨm, mitochondrial membrane potential; LC3-II, membrane-bound microtubule-associated
  protein 3; p62/SQSTM1, sequestosome 1; Ub, ubiquitin
