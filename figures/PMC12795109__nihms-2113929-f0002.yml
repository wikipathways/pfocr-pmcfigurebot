figure_title: Glycogen metabolism is altered in tauopathy, and glycogen breakdown
  prevents tauopathy-induced neurodegeneration in D. melanogaster
caption: a, Venn diagram showing a significant (P < 0.0001) number of proteins upregulated
  in tauR406W flies (red circle) and in control flies on AL diets (blue circle). Dots
  represent enriched pathways of overlapping proteins, including fatty-acid and glycogen
  metabolism. b, Venn diagram showing a significant (P < 0.0001) number of proteins
  downregulated in tauR406W flies (red circle) and control flies on AL diets (blue
  circle). Dots represent enriched pathways of overlapping proteins, including oxidative
  phosphorylation and glutathione metabolism. c, Schematic (generated using BioRender)
  of glycogen metabolism, with upregulated proteins marked with red upright arrows.
  d, Images show eye degeneration by overexpression of tauWT in the eye, driven by
  GMR, a constitutively active stable regulator rescued by GlyPWT overexpression.
  Either RNAi or the overexpression construct was activated by elav Gal4. In genotype
  labeling, the ‘+’ sign is used to indicate heterozygosity with wild-type allele.
  e, Quantification of the phenotypic score of flies with either RNAi knockdown or
  protein overexpression shows that GlyPWT overexpression rescues the phenotypic score
  of eye degeneration. Dots represent scores for individual fly eyes (8, 13, 9, 16,
  15, 9 and 7 fly eyes were analysed, respectively, for control, tauWT, AGBE RNAi,
  GlyP RNAi, Pgm RNAi, mito GFP, GlyPS15A and GlyPWT). f, Quantification of glycogen
  (in μg per μg protein) in tauR406W or control flies on both AL and DR diets shows
  significantly increased (P = 0.0002) glycogen in the tauR406W fly brain. The red
  bars represent flies on the AL diet, and the blue bars represent flies on the DR
  diet (75 fly heads were used; 25 fly heads for each biological replicate). g, Abundance
  of GlyP protein in control (elav-Gal4xW1118) flies on the AL diet (P = 0.0296) and
  in tauR406W flies on the AL (P = 0.0314) or DR (P = 0.001) diet compared with control
  DR flies. Arb. u., arbitrary units. h, Abundance of GlyS protein in control (elav-Gal4xW1118)
  flies on the AL diet (P < 0.0001) and in tauR406W flies on the AL (P < 0.0001) or
  DR (P = 0.0001) diet compared with control DR. i, Abundance of AGBE protein in control
  (elav-Gal4xW1118) flies on the AL diet (P = 0.0027) and in tauR406W flies on the
  AL (P < 0.0001) or DR (P = 0.0004) diet compared with control DR flies (for g–i,
  4 biological replicates with 35 fly heads). j, Quantification of glycogen levels
  in control (tauR406W expressing GlyPS15A) and overexpression of GlyPWT in tauR406W
  fly brains shows a significant (P = 0.0008) reduction in GlyPWT; tauR406W brains
  (75 fly heads were used, 25 fly heads for each biological replicate). k, The lifespan
  of GlyPWT;tauR406W (green) (n = 221) is increased compared with that of control
  GlyPS15A;tauR406W flies (red) (n = 222), and partially rescued the lifespan phenotype
  relative to elav-Gal4xW1118 control flies (n = 187). l, TUNEL staining of whole-mount
  brains of GlyPS15A;tauR406W and GlyPWT;tauR406W flies. Red dots represent TUNEL-positive
  cells reduced in the midbrain of GlyPWT;tauR406W flies. m, Quantification of TUNEL
  staining shows that the number of TUNEL-positive cells per brain area is significantly
  (P < 0.0001) reduced in GlyPWT;tauR406W flies. Dots represent TUNEL-positive cells
  from individual fly brains (n = 20 and 25). See also Supplementary Table 1, Extended
  Data Fig. 3 and Supplementary Data 1. *P < 0.05; **P < 0.01; ***P < 0.001; ****P
  < 0.0001; Fisher’s exact (a,b); one-way ANOVA with Tukey’s multiple comparison test
  (e–i); log-rank test (k); or two-tailed Student’s t-test (j,m). Data in bar graphs
  represent mean ± s.e.m
