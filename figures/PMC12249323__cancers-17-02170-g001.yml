caption: The diagram illustrates the role of SNPs in the BER and NER pathways during
  menstruation. A decrease in estrogen and progesterone levels triggers the activation
  of immune system cells, which supports regenerative processes in the endometrium,
  including tissue and blood vessel reconstruction. Antioxidant deficiency leads to
  lipid peroxidation in cell membranes and protein damage, initiating a self-perpetuating
  mechanism known as the oxidative stress cycle. DNA damage resulting from oxidative
  stress can be repaired through DNA repair pathways such as BER or NER. The efficiency
  of these repair processes is dependent on the polymorphic variants of proteins involved
  in the DNA repair systems
