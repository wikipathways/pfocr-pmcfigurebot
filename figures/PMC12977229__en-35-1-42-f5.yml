figure_title: Synergistic inhibition of the cGAS–STING pathway by RU.
caption: Synergistic inhibition of the cGAS–STING pathway by RU.521 and electroacupuncture
  alleviates POCD in aged rats. (A) Schematic diagram of the experimental timeline,
  illustrating the sequence and time points of Morris water maze training, behavioral
  testing, EA treatment, and RU.521 administration. (B, D, E) Representative swimming
  trajectories reflecting spatial learning and memory performance during the training
  phase (B) and test phase (D, E). (C) Escape latency during training showed no significant
  differences among groups (n=10 rats per group; p>0.05). (F, G) Behavioral assessments
  of escape latency and average swimming speed were performed in aged rats on postoperative
  days 3 and 5. (n=10 rats per group; *p<0.05, **p<0.01, ***p<0.001; ns, not significant)
article_title: Electroacupuncture Attenuates Neuroinflammation and Postoperative Cognitive
