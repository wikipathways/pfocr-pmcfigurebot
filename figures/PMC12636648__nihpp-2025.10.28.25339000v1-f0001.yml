caption: Ventilator waveform data travels through the Capsule Neuron in-room devices
  to a management server (Virtual Machine 1). This pathway shares infrastructure with
  the production EHR pipeline. The data are then sent to Virtual Machine 2, where
  they are aggregated and uploaded to an Azure Cloud Storage instance. This infrastructure
  is hospital-managed but not part of the production EHR pipeline. Our research server
  downloads those waveforms once daily for the Azure Cloud. EHR data is provided by
  Health Data Compass on request and linked to the waveforms using bed occupancy
