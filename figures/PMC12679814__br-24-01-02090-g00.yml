figure_title: Dysregulation of JAK/STAT signaling pathway and other cellular functions
  in schizophrenia.
caption: Dysregulation of JAK/STAT signaling pathway and other cellular functions
  in schizophrenia. The schematic diagram of the JAK/STAT signaling pathway is shown
  in the middle. The normal condition is depicted on the left, where no dysregulation
  is observed in the JAK/STAT pathway, and the cellular functions controlled by the
  JAK/STAT pathway (including inflammation, immune regulation and response, hematopoiesis,
  apoptosis, differentiation, proliferation, metabolic actions, cell cycle, and transcriptional
  and epigenetic regulation) are in homeostasis. In schizophrenia (on the right),
  upon dysregulation of the JAK/STAT and other pathways, metabolic, transcriptional
  and epigenetic dysregulation, chronic stress, depression, neurodegeneration, neuronal
  dysfunction and apoptosis, synaptic loss, inflammation and dysregulated ncRNAs are
  observed. JAK/STAT, Janus kinase/signal transducer and activator of transcription;
  ncRNA, non-coding RNAs. The figure was created using BioRender (https://BioRender.com)
