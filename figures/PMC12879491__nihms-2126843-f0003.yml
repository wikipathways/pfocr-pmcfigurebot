figure_title: Disulfidptosis-inducing strategies in cancer therapy.
caption: 'Disulfidptosis-inducing strategies in cancer therapy. (A) Glucose transport
  inhibition: pharmacological blockade of GLUTs using BAY-876 or KL-11743 suppresses
  glucose uptake and PPP flux, thereby inducing robust disulfidptosis and inhibiting
  tumor growth in KEAP1-mutant lung cancers (which exhibit constitutively active NRF2
  and aberrant expression of SLC7A11); (B) Redox system inhibition: TXNRD1 converts
  cystine to cysteine. Inhibition of TXNRD1 by Auranofin is sufficient to trigger
  disulfidptosis in cells with high SLC7A11 expression. When combined with glucose
  starvation, this approach also sensitizes cells with intermediate SLC7A11 levels
  to disulfidptotic cell death; (C) Other combination strategies: co-treatment with
  BAY-876 or KL-11743 and agents that modulate ER stress or elevate oxidative stress
  effectively promotes disulfidptosis and suppresses tumor growth; (D) Nanomaterial-based
  strategies: nanomaterial-based therapeutics targeting glucose metabolism impair
  PPP-derived NADPH generation, thereby lowering reducing capacity and driving disulfidptosis.
  Created in BioRender. GLUTs: glucose transporters; PPP: pentose phosphate pathway;
  KEAP1: kelch-like ECH-associated protein 1; SLC7A11: solute carrier family 7 member
  1; TXNRD1: Thioredoxin reductase 1; ER: endoplasmic reticulum; NADPH: reduced nicotinamide
  adenine dinucleotide phosphate'
