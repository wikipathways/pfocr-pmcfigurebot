figure_title: Phage treatment reduces extracellular UPEC and HBO inflammatory responses
  early in infection
caption: Phage HP3 was tested for its ability to remove established (A) extracellular
  bacteria and (B) intracellular bacterial reservoirs. Bulk RNA-sequencing of infected
  HBOs with or without HP3 treatment was used to quantify (C) cytokine expression
  changes and (D) to generate pathway analyses at 4- and 24-hours post-infection.
  Solid colored circles in pathway analysis represent significant results while crosshatched
  circles represent non-statistically significant findings. Principal component analyses
  of (E) HBO024 and (F) HBO041 that were untreated, treated with HP3, treated with
  UPEC alone, or with UPEC and HP3. Changes in HBO trans-epithelial electrical resistance
  (TEER) across the transwell insert at (G) 4- and (H) 24-hours post-infection and
  compared between phage and no phage groups. Lactate dehydrogenase release in apical
  urine at (I) 4 and (J) 24 hours. Box and whisker plots show median and min/max with
  points representing individual organoid transwells (A-B, G-J). Data is representative
  of 2 (A-B), 3 (C-F), or 4+ (G-J) independent experiments. Data were analyzed using
  (A-B, G-J) two-way ANOVAs with uncorrected Fisher’s LSD. Gene set enrichment analyses
  were conducted using the hallmark gene set collection from the Molecular Signatures
  Database (D). **p<0.01, ****p<0.0001
