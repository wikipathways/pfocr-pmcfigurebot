figure_title: Distinct genes, pathways and cell type proportions in scWAT between
  lower and higher BMI subjects at baseline.
caption: Distinct genes, pathways and cell type proportions in scWAT between lower
  and higher BMI subjects at baseline. A, PCA plot for baseline RNA-seq data from
  the 29 subjects included in this study. The plot is colored by lower or higher BMI.
  B, Volcano plot showing the differentially expressed genes (DEGs) between the higher
  and lower BMI groups, with the top 10 significantly up- and downregulated genes
  labeled. C, Ridge plot showing the top 15 significant pathways enriched by the up-
  and downregulated DEGs. D, Bar plots showing the inferred transcription factors
  (TFs) enriched in the up- and downregulated DEGs. TFs discussed in the text are
  in bold. E, Box plots comparing the deconvolved cell type proportions between the
  lower and higher BMI groups. The boxplot visualizes the median, the first and third
  quartiles and 1.5*inter-quartile range from the hinge. *, p<0.05; **, p<0.01; ***,
  p<0.001; ****, p<0.0001. F, Bar plots showing the number of cell-type-specific DEGs
  in the four pathway groups in higher BMI vs. lower BMI. Up- and down-regulated pathway
  groups are colored in red and blue, respectively
