figure_title: Integrated network analysis and functional validation of therapeutic
  vulnerabilities in NDNB-25-resistant cells.
caption: 'Integrated network analysis and functional validation of therapeutic vulnerabilities
  in NDNB-25-resistant cells. (A) Gene–drug-dependency interaction network incorporating
  differentially expressed genes (DEGs), gene dependencies, damaging mutations, and
  drug sensitivity data for NDNB-25-sensitive and resistant lines. Known Hsp90β interactors
  and curated drug–gene interactions from DGIdb were included to contextualize connections.
  (The visualization emphasizes global network structure and connectivity rather than
  individual node readability.) (B) Pathway enrichment of NDNB-25-resistant network.
  (C) Subnetwork derived from the broader NDNB-25 resistance network focusing on Rho
  GTPase signaling and actin cytoskeleton regulation. (D–G) ZIP synergy score surface
  plot and combination treatment bar plots for NDNB-25 and carboplatin combination
  in NDNB-25-resistant lines (D,E) and NDNB-25-sensitive lines (F,G). (H,I) ZIP synergy
  score plot and combination treatment bar plots for NCI-H23-R, an NDNB-25-acquired
  resistant cell line generated by passaging the parental line (NCI-H23) in escalating
  doses of NDNB-25. For all bar plots (panels (E,G,I)), statistical significance was
  assessed using one-way or two-way ANOVA followed by Dunnett’s multiple comparisons
  test and indicated as follows: ns = not significant (p > 0.05), p < 0.05 (*), p
  < 0.01 (**), p < 0.001 (***), p < 0.0001 (****)'
