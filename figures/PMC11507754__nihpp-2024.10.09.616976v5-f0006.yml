figure_title: 'RBFOX1 role in stress resilience and chronic stress recovery: proposed
  mechanism of action'
caption: |-
  A) In response to stressful challenges (yellow flash), BDNF expression levels increase, stimulating CRH transcription via TRKB.FL/TK+ (yellow pathway). At the same time, stress triggers also PACAP transcription (red pathway) and OTP-mediated transcription of RBFOX1 and CRH (blue pathway). PACAP stimulates CRH transcription via PAC1-short and inhibits CRH transcription via PAC1-hop. PACAP binding to PAC1-short also increases BDNF transcription (red line) and enhances TRKB.FL/TK+ activity (red line). RBFOX1 functions as a “switch” maintaining the balance between full-length/truncated TRKB isoforms (promoting TRKB mRNA stability and/or alternative splicing): during the stress recovery phase, RBFOX1 switches the balances in support of TRKB.T1/TK− isoform, decreasing CRH levels and turning off the HPA axis. B)
  RBFOX1 deletion leads to an increase in BDNF expression levels (yellow arrow and white box) and an unbalance between TRKB.FL/TK+ (increased) and TRKB.T1/TK− (decreased) isoforms. Such dysregulation ultimately leads to an increase in CRH transcription (and possible hyperactivation of the HPA axis), and increase in PAC1-hop levels as possible compensatory mechanism. Our data suggest that RBFOX1-mediated regulation of TRKB.T1/TK− mRNA stability and/or alternative splicing is necessary to promote neuroplasticity and stress resilience
article_title: rbfox1 LoF mutants show disrupted bdnf/trkb2 and crhb/nr3c2 expression
