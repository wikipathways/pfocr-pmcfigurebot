figure_title: Molecular Mechanisms of Vitamin C.
caption: 'Molecular Mechanisms of Vitamin C. This infographic integrates the main
  molecular and biochemical roles of Vitamin C (ascorbate, Asc) within mammalian cells.
  The illustration depicts: Cellular Uptake: Vitamin C enters the cell in its reduced
  form (Asc) through sodium-dependent vitamin C transporters (SVCT1/2) and in its
  oxidized form (dehydroascorbate, DHA) through glucose transporters (GLUTs). Redox
  Cycling: Inside the cell, Asc and DHA interconvert, maintaining the redox balance
  essential for cellular metabolism. Antioxidant Function: Asc scavenges reactive
  oxygen species (ROS) through non-enzymatic antioxidation, protecting cells from
  oxidative stress and supporting immune and stress responses. Enzymatic Cofactor
  Role: Ascorbate acts as a cofactor for 2-oxoglutarate-dependent dioxygenases (2OGDDs),
  enzymes that regulate collagen biosynthesis, HIF-1α degradation, and epigenetic
  modifications. Biosynthetic Pathways: Asc participates in peptide and hormone synthesis
  and supports the pentose phosphate pathway, promoting nucleotide production and
  cellular energy homeostasis. The design merges the structural, transport, and enzymatic
  mechanisms found in biochemical and physiological contexts, suitable for inclusion
  in a scientific review or didactic article'
