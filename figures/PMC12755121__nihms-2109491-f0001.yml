figure_title: ISG15 correlates with IFN signatures and is secreted into the tumor
  microenvironment
caption: (a-c) Data were derived from the GSE37991 (top) and GSE25099 (bottom) datasets.
  Representation of the ISG core score calculated using a 38-gene ISG signature (12)
  (a). Pathway enrichment analysis was conducted using GSEA to compare oral tissues
  from OSCC patients with adjacent non-tumor or normal tissues (b). Correlation analysis
  demonstrated the relationship between ISG15 expression and the ISG core score (c).
  (d) ISG15 expression correlated with ENscore estimates for infiltrated and exhausted
  CD8+ T cells in the OSCC dataset (GSE199675). (e) Enrichment of the IFNα response
  pathway was analyzed in tumor cells, T cells, and tumor-associated macrophages using
  single-cell RNA sequencing data from HNSCC (GSE103322) (39). (f) ISG15 secretion
  was measured by ELISA in human and mouse tumor cell lines (TW2.6, M1–2S), human
  fibroblast cell line (R2F), a human T cell line (MOLT-1), human PBMCs, and THP-1
  derived macrophages. stimulated with 25, 50, or 100 IU/mL recombinant IFNβ for 48
  hours. Data are representative of two independent experiments. (g) A schematic illustrates
  ex vivo chronic TCR stimulation from day 7 to day 28 with or without recombinant
  IFNβ (25, 50, or 100 IU/mL) or 50 nM recombinant ISG15 in human CBMCs. CD8+ T cell
  function and phenotype were assessed on day 28. (h) Bar graphs show the relative
  percentage of TNF+ IFNγ+ and CD107a+ IFNγ+ CD8+ T cells across treatment groups.
  Data are determined from n = 3 to 4 biological replicates. Statistical significance
  is indicated as *P < 0.05, **P < 0.01, ****P < 0.0001. Comparisons were performed
  using an unpaired t-test with Welch’s correction. Error bars indicate mean ± SD
article_title: Chronic ISG15 Exposure Accelerates CD8+ T-cell Dysfunction while Increasing
  PD-1 Blockade Sensitivity in Oral Squamous Cell Carcinoma
