figure_title: Inactivation of p38 alters the tumor immune microenvironment
caption: 'The analysis of the tumor immune landscape was performed using single cell
  RNA sequencing (scRNAseq) in female BALB/c mice implanted with 4T1-luc (control
  and p38KO) cells. At day 4, mice bearing 4T1-luc tumors were treated with vehicle
  or p38 inhibitor (30mg/kg ralimetinib) for 10 days. At day 14 post implantation,
  the tumors were harvested and live CD45+ cells were subjected to scRNAseq. (a) The
  t-SNE plots show the immune populations identified in the tumors. (b) The heatmap
  of differential gene expression in T cells from the control and p38 blockade groups.
  Cutoffs used: p<0.05 and log2FC>0.5. (c) Violin plots for differentially expressed
  genes. Comparisons were performed using t-test. (d) Pathway enrichment analysis
  for T cells comparing the vehicle group to the p38i or p38KO groups; NES, normalized
  enrichment score. (e) CD8+ T cell subtypes detected by ProjecTILs package in R.
  *, p<0.05; **, p<0.01; ***, p<0.001; ***, p<0.001; NS, non-significant)'
article_title: p38 blockade reverses the immune suppressive tumor microenvironment
  in metastatic breast cancer
