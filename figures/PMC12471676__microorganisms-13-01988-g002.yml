figure_title: Metabolic pathways involved in fatty acid and isoprenoid synthesis in
  oleaginous yeasts.
caption: 'Metabolic pathways involved in fatty acid and isoprenoid synthesis in oleaginous
  yeasts. The enzymes of the fatty acid synthase are depicted in cyan colouring. Enzymes
  involved in the biosynthesis of sterols are present in yeasts in the cytosol, the
  endoplasmic reticulum, the peroxisomes as well as the LDs, but are displayed in
  the figure exclusively in the endoplasmic reticulum. The synthesis, elongation and
  desaturation of fatty acids is more strictly compartmentalized. A straight line
  indicates an enzyme reaction. A dotted line indicates a series of enzymatic reactions
  or other steps. Proteins recruited for lipid droplet formation are mainly perilipins
  (black) and seipin (red). The figure was adapted after [48,49,50,51,52]. AACT: Acetyl-CoA
  C-acetyltransferase; AcAc-CoA: Acetoacetyl-CoA; Ac-CoA: Acetyl-CoA; ACP: Acyl carrier
  protein; AT: Acetyltransferase; DAG: Diacylglycerol; DES: Desaturase; DGAT: Diacylglycerol
  acyltransferase; DH: Dehydratase; DMAPP: Dimethylallyl pyrophosphate; ELO: Elongase;
  ER: Enoyl reductase; FAA: Fatty acyl-CoA synthetase; FAS: Fatty acid synthase; FPP:
  Farnesyl pyrophosphate; G3P: Glycerol 3-phosphate; GK: Glycerol kinase; GPAT: Glycerol-3-phosphate
  acyltransferases; HMGR: Hydroxymethylglutaryl-coenzyme A reductase; HMGS: Hydroxymethylglutaryl-CoA
  synthase; HMG-CoA: Hydroxymethylglutarate-coenzyme A; KR: Ketoacyl reductase; KS:
  Ketoacyl synthase; LPA: Lysophosphatidic acid; LPAT: Lysophosphatidyl acyltransferase;
  MPT: Malonyl/palmitoyl transferase; PA: Phosphatidic acid; PAP: Phosphatidate phosphatase;
  PPT: Phosphopantetheinyl transferase; SE: Sterol ester; SMO: Squalene monooxygenase;
  SQ: Squalene; TAG: Triacylglyceride. Created at https://BioRender.com'
