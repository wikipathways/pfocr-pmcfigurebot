caption: 'TCM modulates AS by regulating LncRNA: From Cellular Function to Lipid Metabolism.
  In the figure, solid arrows indicate activation or promotion; T-shaped arrows represent
  inhibition; dashed boxes denote key affected indicators. This figure summarizes
  the molecular network of herbal ingredients targeting lncRNAs in the core pathological
  processes of AS, divided into four modules by cell type and function. VECs: Herbal
  ingredients (icarilin, salvianolic acid A, tanshinol, curcumin, and vascular softening
  pill) protect endothelial function by targeting lncRNAs (H19, NR2F2-AS1, TUG1, and
  MIAT) to inhibit EndMT, inflammation, and apoptosis. VSMCs: Baicalin, icarilin,
  astragaloside IV, baicalein, and asparagus extract modulate VSMCs proliferation,
  migration, autophagy, and apoptosis through lncRNAs (MEG3, H19, AK021954, and NEAT1)
  and their downstream axes. Macrophages: Resveratrol, sinapic acid, artemisinin,
  and Tongmai Zhuke decoction regulate macrophage polarization, pyroptosis, and inflammation
  via lncRNA MALAT1, lncRNA-Cox2, and related signaling pathways. Lipid metabolism:
  Gypenoside, EGCG, resveratrol, fucoxanthin, Yinchenhao Decoction, and Xiangsha Liujunzi
  Decoction regulate lipid synthesis, accumulation, and cholesterol metabolism by
  targeting lncRNAs (TUG1, NONHSAT1102202, MEG3, and lncRNA-Hc) and related signaling
  pathways.Created in BioRender. Jingyue_Wei. (2026) https://app.biorender.com/illustrations/69bf1432fc59b212f6252f81
  (accessed on 10 February 2026)'
