figure_title: The ubiquitination pathway involves three sequential enzymatic steps.
caption: The ubiquitination pathway involves three sequential enzymatic steps. E1
  (ubiquitin-activating enzyme) activates ubiquitin in an ATP-dependent manner. E2
  (ubiquitin-conjugating enzyme) receives the activated ubiquitin from E1. E3 (ubiquitin
  ligase) recognizes the target substrate and facilitates the transfer of ubiquitin
  from E2 to the substrate. Polyubiquitinated proteins are targeted for proteasomal
  degradation. Deubiquitination is mediated by deubiquitinating enzymes (DUBs) that
  remove ubiquitin from substrates, allowing for ubiquitin recycling
