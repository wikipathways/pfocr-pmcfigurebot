caption: Twenty-two putative causal proteins with dry AMD identified by proteome-wide
  MR. (a) Volcano plot showed that 22 plasma proteins were associated with the dry
  AMD risk in the discovery cohort, with varying colors indicating degree of positive
  and negative correlations and the number of implicated genes. (b) Bar graphs unveiled
  the top significant GO enrichment and KEGG pathway annotation terms based on 22
  identified causal proteins. (c) The protein-protein interaction (PPI) network illustrated
  a visual representation of the intricate connections among 22 identified causal
  proteins. Each node represents an individual protein, with connecting lines signifying
  the interactions between them. (d) The PPI network diagram delineated the extensive
  interactions among core proteins significantly involved in diverse interactions
  across four pivotal pathways. Utilizing Cytoscape software, with the cytoHubba and
