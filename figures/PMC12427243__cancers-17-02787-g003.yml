figure_title: Role of DNA-PKcs in Tumor Immunogenicity.
caption: 'Role of DNA-PKcs in Tumor Immunogenicity. It modulates immune responses
  through: (1) Transcriptional regulation of immune-related factors (2) Phosphorylation-mediated
  inhibition of cGAS, thereby suppressing the cGAS/STING innate immune pathway (counteracted
  by ARIH1 through proteasomal degradation of DNA-PKcs) (3) RNF144A-dependent regulation
  of PD-L1 expression, potentially limiting immune evasion in cancer and (4) In B
  cells, DNA-PKcs is essential for immunoglobulin class switch recombination (CSR),
  and its deficiency leads to genomic instability. In T cells, DNA-PKcs modulates
  Gata3-dependent cytokine production, sustains proliferative capacity by activating
  the ZAK/mTOR signaling axis, phosphorylates CHK2 and Egr1, thereby enhancing IL-2
  expression and promoting T cell activation'
