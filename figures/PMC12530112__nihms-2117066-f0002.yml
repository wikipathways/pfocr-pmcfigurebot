figure_title: Validation of lysosomal markers identified by STRING analysis.
caption: Validation of lysosomal markers identified by STRING analysis. (A) Using
  the STRING network, we visualized protein targets that were identified as having
  significant differential expression and contributed to the lysosomal pathway enrichment.
  (B) Expression of specific proteins lysosome associated membrane protein 1 (Lamp1),
  Cathepsin-z (Ctsz) and Ras-related protein Rab35 (Rab35) by label free quantitation
  (LFQ, log2 values are shown) within our proteomic dataset, demonstrating increased
  abundance of Lamp1 and Ctsz and decreased abundance of Rab35. (C,D) Western blotting
  of mLECs exposed to 400 nM decorin for 24 h with associated loading controls and
  respective quantification; *p<0.05, and **p<0.01
