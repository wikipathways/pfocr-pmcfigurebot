figure_title: TACC3-KAT2A regulatory interactions.
caption: TACC3-KAT2A regulatory interactions. (A) TACC3-KAT2A pathway and module networks.
  (B) Paired protein abundance of TACC3 and KAT2A in HCC tumors (T) and matched adjacent
  normal tissues (NT). Data are from the NCI Proteomic Data Commons (PDC). Lines connect
  paired samples from the same patient, with red bars indicating the mean. (C) NOTCH4
  is enriched in endothelial cells. (D) Significant correlation is observed between
  TACC3 isoforms and KAT2A and NOTCH4. (E) Heatmap showing the association between
  TACC3, KAT2A, and NOTCH4 as well as ENCODE-enriched histone modifications. (F) TACC3
  and NOTCH4 expression levels in wild-type (WT) and KAT2A knockout (KO). HCC, hepatocellular
  carcinoma; HCC.NT, tumor-adjacent normal liver; HCC.T, tumor; MASLD, metabolic dysfunction-associated
  steatotic liver disease
