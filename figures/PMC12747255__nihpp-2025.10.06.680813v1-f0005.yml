figure_title: Mapping outputs and inputs and transcriptional profile of BLA neurons
  projecting to nucleus accumbens shell
caption: |-
  (a) BLA-originating excitatory (Vglut1-cre) synaptic terminals labeled in NAcSh. Scale bars: 500 μm (BLA image), 200 μm (NAcSh images). (b) Schematic of retrograde viral tracing approach for labeling NAcSh- and PL-projecting BLA neurons, with representative images of virus expression. Scale bars: 500 μm. (c) NAcSh-projecting BLA neurons originated in mostly posterior BLA whereas PL-projecting neurons tended to be localized mid-way (Mid) between the anterior and posterior limits of BLA. Minimal co-expression (Co-exp) of NAcSh- and PL-projecting BLA neurons. (d) Schematic of rabies viral tracing approach for labeling inputs to BLA→NAcSh neurons. Scale bar: 500 μm. (e) Denser input from ventral pallidum (VP), entorhinal cortex (ENT), and the paraventricular thalamus (PVT) to BLA→NAcSh versus vHPC→NAcSh (VP: t(6.01)=6.15, p<0.001; PVT: t(6.11)=2.86, p<0.05, unpaired t-tests) or vmPFC→NAcSh neurons (VP: t(6.64)=4.54, p<0.005; ENT: t(6.13)=6.13, p<0.05, unpaired t-tests). (f) Lesser input from medial septum (MS) and the nucleus of the diagonal band (NDB) to BLA→NAcSh than vHPC→NAcSh (MS: t(4.20)=3.14, p<0.05, unpaired t-test) or vmPFC→NAcSh neurons (NDB: t(8.29)=2.45, p<0.05, unpaired t-test). (g) Schematic for TRAPseq tagging of EGFP to the large ribosomal subunit (L10) in specific BLA output populations. (h) Principal Component Analysis (PCA) of differentially expressed genes (DEGs) identified across BLA projection targets using a likelihood ratio test (LRT, FDR < 0.05) shows clear separation by projection group. (i) Heatmap of z-scored expression values for DEGs confirms distinct transcriptional profiles across projection-defined groups. (j) Venn diagram illustrating overlap of DEGs identified in one-vs-all DESeq2 contrasts. The majority of DEGs are specific to a single projection pathway. (k) Volcano plot highlighting top DEGs from the NAcSh versus all comparison. (l) Gene Ontology enrichment analysis showing the top 10 enriched terms. Point size indicates –log10(adjusted p-value); the x-axis shows the odds ratio. Data mean ± SEM. *p<0.05. Analyses in e and f were unpaired t-tests with Welch correction. For full reporting of statistics, see Supplementary Table 1. Hamilton Syringe (a, b, d, g,
  doi.org/10.5281/zenodo.7679042) and Mouse Brain (a, b, d, g,
  doi.org/10.5281/zenodo.3925909) graphics adapted from scidraw.io
