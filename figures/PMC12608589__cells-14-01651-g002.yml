figure_title: Proteomic characterization of EVs.
caption: 'Proteomic characterization of EVs. (A) Venn Diagram of quantified proteins
  in the three AML EVs. (B) Proteomics analysis reveals a strong overlap of our dataset
  with Vesiclepedia, an online EV proteome repository. Only 2.54%, 4.29%, and 4.75%
  of the EV proteins were unmatched in Vesiclepedia for HL-60, OCI-AML-2, and OCI-AML-3
  EVs, respectively. (C) PANTHER Molecular Function Reclassification analysis of EV
  proteins unmatched with the Vesiclepedia repository database. (D) Bubble charts
  represent Canonical Pathways significantly modulated by EVs-HL60 proteins. Bubble
  sizes are proportional to the number of proteins that overlap that pathway. B-H
  Multiple Testing Correction p-value: display only entities that have a −Log(p-value)
  greater than 1.3. Y-axis: Pathway Categories that include each single pathway. X-axis:
  −Log(p-value)'
