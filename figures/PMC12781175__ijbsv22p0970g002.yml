figure_title: MRPS7 and MRPS23 drive nasopharyngeal carcinoma progression in vitro
  and in vivo.
caption: 'MRPS7 and MRPS23 drive nasopharyngeal carcinoma progression in vitro and
  in vivo. (A-B) CCK-8 assays indicated the effect of combined or individual knockdown
  of MRPS7 and MRPS23 on NPC cell proliferation, compared with control cells. (C-F)
  EdU assays tested the cooperative role in DNA replication, with dual knockdown MRPS7
  and MRPS23 or individual depletions in NPC. (G-H) GSEA analysis revealed the correlation
  between MRPS7 or MRPS23 and DNA replication pathway activation. (I) Representative
  images of excised tumors from nude mice bearing NPC xenografts following treatment
  with: dual MRPS7/MRPS23 knockdown, single knockdown of MRPS7 or MRPS23, scramble
  control. (J) Tumor volumetric measurements were evaluated at predetermined intervals.
  (K) Tumor xenograft weights were quantitatively analyzed at endpoint in euthanized
  mice. (L-M) Ki67 staining and its expression quantification in tumor tissue sections
  from the xenografts. (N) Quantification of lung metastasis incidence and metastatic
  nodule counts in each group. (O) Representative H&E staining images of lung tissues
  from mice injected with NPC cells expressing scramble control, single knockdown
  of MRPS7 or MRPS23, and dual MRPS7/MRPS23 knockdown. *p < 0.05, **p < 0.01, ***p
  < 0.001, and ****p < 0.0001'
article_title: Co-targeting MRPS7-23 synergistically enhances cisplatin efficacy to
