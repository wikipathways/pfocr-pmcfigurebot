figure_title: O-GlcNAcylation pathway and its association with glucose metabolism.
caption: O-GlcNAcylation pathway and its association with glucose metabolism. (A)
  UDP-GlcNAc, the GlcNAc donor molecule, is synthesized via the HBP, a metabolic branch
  stemming from glycolysis. Glycolysis is associated with other metabolic pathways,
  including the TCA cycle, OxPhos, PPP and one-carbon cycle. (B) HBP pathway integrates
  glucose, amino acid, lipid and nucleotide metabolism in the synthesis of the donor
  molecule UDP-GlcNAc. Figure constructed using BioArt (bioart.niaid.nih.gov/). UDP-GlcNAc,
  uridine diphosphate N-acetylglucosamine; HBP, hexosamine biosynthesis pathway; TCA,
  tricarboxylic acid cycle; OxPhos, oxidative phosphorylation; PPP, pentose phosphate
  pathway; OGT, O-GlcNAc transferase; OGA, O-GlcNAcase; PFK, phosphofructokinase;
  G6P, glucose-6-phosphate; F1,6P, fructose 1,6-bisphosphate; G3P, glyceraldehyde-3-phosphate;
  1,3PBG, 1,3-bisphosphoglycerate; 3PG, 3-phosphoglycerate; PEP, phosphoenolpyruvate;
  PGK, phosphoglycerate kinase; PK, pyruvate kinase; LDHA, lactate dehydrogenase A;
  PDH, pyruvate dehydrogenase; GFAT, glutamine fructose-6-phosphate amidotransferase;
  Fruc, fructose; UAP, UDP-N-acetylglucosamine pyrophosphorylase 1; Glut, glucose
  transporter; UTP, uridine triphosphate
