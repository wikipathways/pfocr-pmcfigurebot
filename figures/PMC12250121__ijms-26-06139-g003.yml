figure_title: Fedratinib inhibits multiple signaling pathways in TNBC cells.
caption: Fedratinib inhibits multiple signaling pathways in TNBC cells. MDA-MB-231
  and HS578T cells were treated with increasing concentrations of fedratinib for 24
  h. (A) STAT3 phosphorylation (Y705), (B) ERK phosphorylation (T202/Y204), (C) PI3K/AKT
  pathway proteins [p-mTOR (S2448), p-AKT (S473), and p-RPS6 (S235/236)], and (D)
  4E-BP1 levels were analyzed by Western blot, with β-actin as loading control. Representative
  blot images from three independent experiments are shown with densitometric quantification
  (mean ± SEM). * p < 0.05, ** p < 0.01, and *** p < 0.005
