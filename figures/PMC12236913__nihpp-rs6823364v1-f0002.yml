caption: Path diagram illustrates the association between PGS_CRP and externalizing
  psychopathology, which was partially mediated by mean cortical thickness change.
  The pathway demonstrates that individuals with a higher polygenic score for CRP
  tend to experience accelerated cortical thinning, which is associated with increased
  externalizing psychopathology. However, the mediation is partial (4% of total effect),
  as PRS_CRP also has a direct effect on externalizing psychopathology, indicating
  that the behavioral outcomes are not solely explained by cortical thinning
article_title: 'Polygenic score for C-reactive protein is associated with accelerated
