figure_title: Overview of the effect of tripeptide GPE on the ERK signaling pathway.
caption: Overview of the effect of tripeptide GPE on the ERK signaling pathway. Growth
  factors such as (e.g., VEGF, platelet-derived growth factor [PDGF] bind to a receptor
  tyrosine kinase (RTK) on the cell membrane, causing autophosphorylation of the receptor,
  thus creating docking sites for intracellular signaling proteins. Growth factor
  receptor-bound protein 2 (GRB2), an adaptor protein, binds to the receptor and recruits
  Son of Sevenless (SOS), a guanine nucleotide exchange factor (GEF). SOS activates
  Ras, a small guanosine triphosphatase (GTPase), by exchanging guanosine diphosphate
  (GDP) for guanosine triphosphate (GTP). This triggers the MAPK cascade, such that
  Ras-GTP activates Raf [also called MAPK kinase kinase (MAPKKK)], which in turn activates
  MEK1/2 [MAPK kinase (MAPKK)]. Activated MEK1/2 then activates ERK1/2 (MAPK). Once
  activated, ERK1/2 is transferred to the nucleus, where it phosphorylates transcription
  factors such as c-Myc and c-Fos, leading to the expression of genes responsible
  for cellular regulations such as cell proliferation, differentiation, and migration.
