caption: (A) ARCHS4 tissue expression heatmap illustrating transcriptional profiles
  of 11 genes across diverse tissues. Red blocks denote gene expression; white blocks
  indicate absence. CRYAB and BAG3 show broad tissue expression, while CASQ2, MYBPC3,
  and CSRP3 display cardiac specific patterns (atrium, ventricle, cardiac muscle).
  (B) Bar plot showing the top 10 significantly enriched pathways from the Elsevier
  Pathway Collection, ranked by −log10(p-value). The most enriched term relates to
  sarcomere disorganization and calcium overload. (C) STRING-based protein–protein
  interaction (PPI) network highlighting TTN as a central hub linking key cardiomyopathy-associated
  proteins, including MYBPC3, SCN5A, and CRYAB
