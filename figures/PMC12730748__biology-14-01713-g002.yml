caption: (a) PCA plot, where PC1 represents the first principal component, PC2 represents
  the second principal component, and the percentages indicate the explanatory power
  of these principal components for the dataset. Each point represents a sample, with
  samples from the same group depicted in the same color. Grouping is indicated in
  the legend. (b) S-plot, where the horizontal axis represents the covariance between
  principal components and metabolites, and the vertical axis represents the correlation
  coefficient between principal components and metabolites. Metabolites closer to
  the upper right and lower left corners show more significant differences, with red
  dots indicating VIP values greater than 1 and green dots indicating VIP values less
  than or equal to 1. (c) Volcano plot of DMs, where green dots indicate down-regulated
  metabolites and red dots indicate up-regulated metabolites. (d) KEGG pathway bubble
  plot of DMs, with KEGG pathway names on the vertical axis and enrichment factor
  on the horizontal axis. The size of the dots represents the number of enriched metabolites,
  and the color of the dots indicates different ranges of p-values
