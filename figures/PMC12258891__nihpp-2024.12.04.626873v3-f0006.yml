figure_title: Vulnerability states express differently actionable transcriptional
  programs
caption: (A) Dot plot showing the results of KEGG Medicus differential enrichment
  analysis performed on the top 300 differentially expressed genes for each VS. Color
  indicates the BH-adjusted p-value and circle size represents the gene ratio. (B)
  Heatmap displaying the relative activity scores of the top 25 significantly different
  regulons for each VS by SCENIC analysis. (C) Predicted sensitivities of each VS
  to targeted GDS CRISPR-mediated knockout (38 / 168 GDS genes analyzed). (D-F) Bar
  plot of enrichment results for all overlapping differentially expressed genes for
  VS1, VS2, and VS3 (respectively) among the Neftel et al. (2019), Johnson et al.
  (2020), and our in-house scRNA-seq datasets. Analysis conducted using the WikiPathways
  gene set. Color indicates BH-adjusted p-value by Fisher’s exact test with gene ratio
  plotted on the x-axis (fractional representation to the right of each bar)
