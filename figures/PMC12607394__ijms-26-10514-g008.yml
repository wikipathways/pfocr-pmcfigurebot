caption: 'Western blot showing the effects of the husk extract on the abundance of
  proteins associated with the downstream EMT pathway. (A) Representative Western
  blot image showing localization of MMP2, MMP9, N-cadherin, and GAPDH proteins in
  control (untreated cells) and treatment (husk extract) groups. The molecular weight
  (MW) of each protein is provided. (B) Quantitative analysis of protein levels following
  Western blot analysis. Data were compared using a paired t-test and are presented
  as the mean ± SD. p-values are indicated by asterisks: * p < 0.05; ** p < 0.01;
  *** p < 0.001'
