figure_title: Post-translational modifications (PTMs) integrate autophagy and signaling
  functions by directly regulating the oligomerization state of p62.
caption: Post-translational modifications (PTMs) integrate autophagy and signaling
  functions by directly regulating the oligomerization state of p62. (A) The oligomerization
  of p62 is dynamically regulated by multiple PTMs, including phosphorylation, ubiquitination,
  acetylation, and S-acylation. (B) PTMs enhance the ability of p62 to bind to ubiquitinated
  substrates, and simultaneously integrate selective autophagy, signaling pathways,
  and stress responses (such as antioxidant and antibacterial responses) by altering
  the oligomerization state
