figure_title: Molecular mechanisms and key regulators of lipid peroxidation and ferroptosis.
caption: 'Molecular mechanisms and key regulators of lipid peroxidation and ferroptosis.
  The initiation of ferroptosis is primarily driven by the accumulation of labile
  iron pools within cells, which originates from two main sources: Iron uptake mediated
  by transferrin receptor 1 and free iron release during heme metabolism catalyzed
  by heme oxygenase 1. In normal cells, free iron, polyunsaturated fatty acids, and
  ROS generate lipid hydroperoxides via the Fenton reaction. This process is predominantly
  modulated by GSH-dependent and non-GSH-dependent intracellular antioxidant systems.
  The GSH-dependent system facilitates the uptake of cystine, an essential precursor
  for reduced glutathione, through the SLC7A11/SLC3A2 isodimer, and subsequently consumes
  reduced GSH via GPX to detoxify lipid peroxides. FSP1, also known as AIFM2 or AMID,
  represents a recently identified core inhibitor of ferroptosis. It regulates the
  redox cycle of coenzyme Q10 through pathways independent of GSH and GPX4, thereby
  forming a secondary defense mechanism against lipid peroxidation. ATF4 and NRF2
  function as the core transcription factors enabling cells to respond to oxidative
  stress and metabolic imbalance. Both ATF4 and NRF2 inhibit lipid peroxidation and
  confer resistance to ferroptosis by regulating distinct target gene networks. ROS,
  reactive oxygen species; GSH, glutathione; SLC7A11, solute carrier family 7 member
  11; GPX, glutathione peroxidase; FSP1, ferroptosis suppressor protein 1; ATF4, activating
  transcription factor 4; NRF2, nuclear factor erythroid 2-related factor 2; CoQ10,
  coenzyme Q10; NADP+, nicotinamide adenine dinucleotide phosphate; PUFA, polyunsaturated
  fatty acid; MDA, malondialdehyde; 4-HNE, 4-hydroxynonenal; ARE, antioxidant response
  element'
