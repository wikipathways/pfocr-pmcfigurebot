caption: Extrinsic pathway of apoptosis and points of convergence with the mechanism
  of action of CPT. The activation of death receptors (TNFR, Fas/CD95, TRAIL) recruits
  adaptor complexes (TRADD, FADD) that activate caspases-8/10, initiating a signaling
  cascade that leads to the activation of effector caspases (3, 6, 7). Additionally,
  caspase-8 can cleave Bid, generating tBid, which activates Bax/Bak in the mitochondria
  and connects with the intrinsic pathway
