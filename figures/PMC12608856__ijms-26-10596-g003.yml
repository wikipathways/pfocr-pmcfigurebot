figure_title: Canonical pathway overlay analysis of differentially expressed proteins
  identified by quantitative proteomics in HIV-infected macrophages.
caption: Canonical pathway overlay analysis of differentially expressed proteins identified
  by quantitative proteomics in HIV-infected macrophages. Canonical pathway maps were
  generated using Ingenuity Pathway Analysis (IPA; QIAGEN Inc., Redwood City, CA,
  USA). (A) Comparison of HIV+MDM-vehicle vs. control. (B) Comparison of HIV+MDM-
  JWH-133 vs. HIV+MDM-vehicle macrophages. Networks highlight molecular interactions
  and biological pathways affected by HIV infection and CB2R agonist treatment, including
  NF-κB inhibitor epsilon (NFKBIE) signaling, GABAergic and glutamatergic receptor
  signaling, class I MHC-mediated antigen processing and presentation, and the neurotransmitter
  release cycle. Box plots next to each node display the log2 fold change (FC) values
  for individual proteins, with p-values shown below the symbols for significant results.
  The black bars labeled “1” or “2” within the fold change boxes denote the dataset
  used for the overlay, corresponding to Dataset 1 (HIV+MDM-vehicle vs. control) and
  Dataset 2 (HIV+MDM JWH-133 vs. HIV+MDM-vehicle), respectively. Orange and red nodes
  indicate upregulated proteins or pathways, while green and blue nodes represent
  downregulation relative to the comparison group
