figure_title: The Central Dogma Cycle
caption: A.Central Dogma pathway for genetic information flow in cells. DNA is replicated
  or transcribed into RNA, which is next translated into proteins. B. The proposed
  CDC for information flow in cells; 3 new steps are added to the Central Dogma completing
  the cycle. An epigenetic step is included between DNA and RNA transcription. After
  translation, protein fold producing molecular function(s). Proteins form complexes
  with other proteins, other macromolecules, and small molecules to create cell processes.
  Each emergent cell processes (purple arrows) forms a separate cycle that produce
  emergent cell processes (purple arrows). The figure was created with PowerPoint
