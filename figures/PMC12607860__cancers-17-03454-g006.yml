caption: 'Health Disparity in Breast Cancer (BRCA). Disparity at (a) gene level and
  (b) pathway level. Unique (c) AA-specific and (d) EA-specific enriched pathways.
  AA: African American; EA: European American. The Venn diagrams in (a,b) show that
  while most genes and pathways are shared between AA and EA cohorts, a subset remains
  unique to each group, reflecting sub-cohort-specific molecular features. The bar
  plots in (c,d) highlight distinct enriched pathways in AA and EA patients, suggesting
  ancestry-related biological variation'
