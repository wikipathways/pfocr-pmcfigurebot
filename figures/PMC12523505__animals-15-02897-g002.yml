caption: 'Pathway enrichment of the identified metabolites in broilers from the heat
  stress (HS) group and the 400 µg Cr/kg supplementation (EG) group. The x-axis means
  the pathway, while the y-axis represents the enrichment ratio, defined as the proportion
  of pathway-enriched metabolites to the total metabolites associated with that pathway.
  A higher enrichment rate signifies a greater degree of enrichment. The color gradient
  of the bars represents the significance of enrichment, and the dark color bars indicate
  more significant enrichment of the KEGG term. Statistical significance was determined
  based on p-values adjusted by FDR correction. Symbols denote the following: p-value
  < 0.001 is marked as ***, p-value < 0.01 is marked as **, and p-value < 0.05 is
  marked as *'
