figure_title: Ectopic Expression of Immunoglobulin Genes in Non-B Cells Reveals TNBC-Specific
  Immune Mimicry Signatures.
caption: Ectopic Expression of Immunoglobulin Genes in Non-B Cells Reveals TNBC-Specific
  Immune Mimicry Signatures. (A) Bi-volcano plot showing differentially expressed
  genes (DEGs) in plasmablasts comparing TNBC to ER+ (x-axis) and TNBC to HER2+ (y-axis).
  Genes upregulated in TNBC compared to both subtypes are highlighted in red. (B)
  Dot plot displaying enriched biological processes (GO:BP) associated with the top
  TNBC-upregulated genes in plasmablasts. Color indicates adjusted p-value; dot size
  reflects gene count per term. (C) Corresponding cnetplot visualizing the top enriched
  pathways and their associated genes in plasmablasts. Only pathways with an adjusted
  p-value (FDR) < 0.05 were retained. (D), Bi-volcano plot showing differentially
  expressed genes (DEGs) in B-Cells comparing TNBC to ER+ (x-axis) and TNBC to HER2+
  (y-axis). Genes upregulated in TNBC compared to both subtypes are highlighted in
  red. (E) GO enrichment of upregulated DEGs, and (F) cnetplot showing enriched immunoglobulin-related
  immune processes
