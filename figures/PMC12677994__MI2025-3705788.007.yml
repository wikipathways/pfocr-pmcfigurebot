figure_title: Molecular signatures and functional analyses of epithelial cell subpopulations.
caption: 'Molecular signatures and functional analyses of epithelial cell subpopulations.
  (A) Expression patterns of key marker genes across distinct epithelial cell subclusters,
  including ascending limb (AL), distal convoluted tubule/connecting tubule (DCT/CNT),
  descending limb (DL), intercalated cell (IC), mesangial cell (MC), principal cell
  (PC), and proximal tubule Cell (PTC). (B) Violin plots illustrating differences
  in cellular senescence scores, calculated using UCell with the CellAge, SenMayo,
  and Fridman senescence-related gene sets, between PTCs derived from normal and tumor
  tissues. (C) Pseudotime trajectory analysis of PTC cells, depicting state transitions
  along the differentiation trajectory and (D) state assignments (States 1–5) based
  on pseudotime progression. (E) Trends of cellular senescence scores along the pseudotime
  trajectory, including dynamic changes in CellAge_UCell, Fridman_UCell, and SenMayo_UCell
  signatures, demonstrating fluctuations in senescence levels during state transitions
  (left panel). The expression trajectories of core telomerase components and associated
  cofactors across different pseudotime-defined states are shown in the right panel.
  (F) Pie charts illustrating the proportional distribution of NHP2-positive versus
  NHP2-negative (upper) and NOP10-positive versus NOP10-negative (lower) tumor cells
  within each pseudotime-defined state (States 1–5). (G) Overall distribution of NHP2-positive
  and NHP2-negative (top) and NOP10-positive and NOP10-negative (bottom) proximal
  tubule cells. (H) Volcano plots highlighting differentially expressed genes between
  NOP10-positive and NOP10-negative and (I) NHP2-positive and NHP2-negative PTC populations.
  The x-axis denotes the percentage difference in expressing cells between the two
  groups, while the y-axis shows log-transformed fold change. Genes that are significantly
  upregulated or downregulated are labeled (p_val_adj < 0.05, avg_logFC > 0.3). (J)
  Enrichment analysis of 50 hallmark gene sets comparing NHP2-positive and NHP2-negative
  PTCs. The x-axis represents pathway log fold change, with significance levels indicated
  by p-value and RRA score gradients. Colors distinguish upregulated from downregulated
  pathways. (K) Equivalent pathway enrichment analysis for NOP10-positive and NOP10-negative
  PTCs, visualizing pathway activation or suppression along with statistical significance.
  Statistical significance is indicated as follows: ⁣∗p < 0.05, ⁣∗∗p < 0.01, ⁣∗∗∗p
  < 0.001, ⁣∗∗∗∗p < 0.0001, ns = not significant'
