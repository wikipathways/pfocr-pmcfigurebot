figure_title: NDMA induces persistent transcriptome dysregulation and an IFN response
caption: 'a, PCA of Mgmt−/− liver samples collected at days 1, 2, and 5 post-saline
  or NDMA exposure shows clear clustering separation by treatment group. RNA was extracted
  from liver tissue and analyzed by RNA-seq; n ≥ 7 per group (males and females combined).
  b, Bar graphs depict the number of differentially expressed RNA transcripts (up-
  and downregulated) in WT and Mgmt−/− liver following NDMA exposure across indicated
  timepoints. c, Venn diagrams compare overlap of significantly up- and downregulated
  genes across genotypes and timepoints. d, Pathway enrichment analysis of persistently
  up- and downregulated genes (intersected across all timepoints from panel c, red
  circles) in Mgmt−/− samples using Enrichr for MSigDB Hallmark gene sets. The top
  8 pathways are displayed, ranked by Fisher exact test p-value. Pathways involved
  in IFN response are marked with an asterisk (*). e, Volcano plots display the most
  differentially expressed genes in Mgmt−/− livers comparing NDMA vs saline treatment
  at 1 day, 5 days, and 10 weeks. Plots show –log10 p-value versus log2 fold change.
  Genes from the GSEA Hallmark p53 pathway are circled in red or black; Cyp2e1 downregulation
  is circled in blue. f,i, Bar graphs quantify the number of up- and downregulated
  genes within the pre-curated IFN (f) and DNA repair (i) gene lists, comparing NDMA
  effects between WT and Mgmt−/− across the time course. g,h, Heatmaps show expression
  profiles for curated IFN response genes (g) and DNA repair genes (h) in response
  to NDMA treatment in WT and Mgmt−/− livers at days 1, 2, and 5 post-exposure. Color
  scale reflects relative gene expression intensity. Statistical analysis: All comparisons
  use thresholds of adjusted p-value < 0.05 and absolute log2 fold change > 0.58 (b–i)'
article_title: Persistent interferon signaling and clonal expansion mark early events
  in DNA methylation damage-induced liver cancer
