figure_title: NF-κB pathway activation via downregulation of the NAS1-NR2F1 axis promotes
  cisplatin resistance.
caption: NF-κB pathway activation via downregulation of the NAS1-NR2F1 axis promotes
  cisplatin resistance. (A,B) Elevated NF-κB activity in cisplatin-resistant NSCLC
  cell lines. (A) Representative Western blot and (B) quantification showing increased
  phosphorylation of p65 (p-p65) in H226/CDDPr and PC9/CDDPr cells compared to their
  parental controls (n ≥ 3). (C,D) NF-κB activation following NAS1 knockdown. (C)
  Representative Western blot and (D) quantification of p-p65 levels in H226 and PC9
  cells transfected with control (shNC) or NAS1-targeting shRNA (shNAS1) (n ≥ 3).
  Data are presented as mean ± SEM; * p < 0.05 (two-tailed Student’s t-test). (E,F)
  NF-κB activation following NR2F1 knockdown. (E) Representative Western blot and
  (F) quantification of p-p65 levels in H226 and PC9 cells transfected with control
  (shScramble) or NR2F1-targeting shRNA (shNR2F1) (n ≥ 3). (G) Cisplatin sensitivity
  measured by dose–response curve and quantification of the corresponding IC50 values
  in cisplatin-resistant H226/CDDPr cells treated with the NF-κB inhibitor DHMEQ at
  the indicated concentrations (0, 10, 20, or 50 μg/mL) (n ≥ 3). (H) Cisplatin sensitivity
  measured by dose–response curve and quantification of the corresponding IC50 values
  in cisplatin-resistant PC9/CDDPr cells treated with the NF-κB inhibitor DHMEQ at
  the indicated concentrations (0, 10, 20, or 50 μg/mL) (n ≥ 3). The data shown in
  the figure are presented as the mean ± SEM unless otherwise indicated. p values
  were calculated using two-tailed Student’s t-test. * p < 0.05, ** p < 0.01, ***
  p < 0.001. The uncropped blots are shown in File S1
