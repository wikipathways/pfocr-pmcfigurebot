figure_title: Neuroimmune activation and spatial immune organization in prefrontal
  cortex and hippocampus following α4 blockade
caption: '(A) Spatial transcriptomic workflow. RNAscope identified SIV RNA+ regions
  in prefrontal cortex (PFC) and hippocampus (Hp), guiding region of interest (ROI)
  selection for NanoString whole-transcriptome analysis (WTA). (B) Representative
  spatial deconvolution of SIV+ PFC ROI using a scRNA-seq–derived CD45+ brain reference.
  (C) Violin plots of immune subsets in SIV+ ROIs. α4-treated animals show reduced
  Tcm cells in PFC and Hp, with increased CD8+ Tem cells and monocytes in Hp versus
  IgG-treated animals. (D) Heatmap of differentially expressed genes across SIV+ and
  SIV– PFC ROIs from α4-treated animals (P < 0.05, |log2FC| > 0.5). (E) CellChat ligand-receptor
  interactions in SIV– PFC and Hp ROIs from α4-treated animals. (F) Volcano plot of
  pathway differences in PFC comparing α4-treated and IgG-treated groups. (G) Heatmap
  of top upregulated pathways in SIV+ Hp ROIs comparing α4-treated and IgG-treated
  animals. (H–L) RNAscope detection of SIV RNA in brain parenchyma and perivascular
  regions. Representative PFC images show SIV RNA+ signal (cyan) and CD3+ T cells
  (red). Yellow arrow indicates CD3+ SIV RNA+ cell; cyan arrowheads indicate SIV RNA+
  cells near perivascular spaces. Magnified views of H and J on the left are shown
  in I and K. Scale bars: 50 μm (H, J, and L); 20 μm (I and K). (M) SIV RNA+ cells
  per cm² in PFC and Hp (mean ± SD). *P < 0.05, 2-tailed Welch’s t test'
article_title: α4 Integrin blockade impairs CD8+ T cell neuroimmune surveillance following
  SIV infection
