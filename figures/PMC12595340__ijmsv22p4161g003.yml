figure_title: ET-1 stimulated visceral HWP growth through the ERK pathway.
caption: 'ET-1 stimulated visceral HWP growth through the ERK pathway. The ERK pathway
  mediates the ET-1-stimulated expression of glucose transporter 1, SOCS3, and resistin.
  We pretreated cells with the ERK-specific inhibitor U0126 and then incubated them
  with ET-1 for 48 h. U0126 prevented the ET-1-induced increases in both the number
  and viability of HWPs (A and B). Western blot analysis indicated that U0126 prevented
  the ET-1-induced increase in ERK phosphorylation (C). All the data are expressed
  as the mean ± standard error of the mean (SEM) of three independent experiments.
  *p < 0.05 vs. the control; #p < 0.05, ET-1 vs. U0126 + ET-1'
