figure_title: The p38-MAPK pathway as a central regulator of ARG2-enriched CXCR2Hi
  MDSC in PIS.
caption: 'The p38-MAPK pathway as a central regulator of ARG2-enriched CXCR2Hi MDSC
  in PIS. (A) Gene ontology (GO) terms dominated in the CXCR2Hi MDSC, where the MAPK
  cascade was significantly enriched. (B) The transcript levels of Tlr4, Il4ra, Il13ra1,
  Cxcr2, and Interferon-stimulated genes (ISGs) upregulated upon infection. (C) LPS
  induced the upregulation of ARG2, along with activation of p38-MAPK signaling. (D)
  The pretreatment of p38 inhibitor Doramapimod impeded the upregulation of ARG2 and
  p38-MAPK pathway activity when LPS stimulation. LY: The PI3Kα, PI3Kδ, and PI3Kβ
  inhibitor LY294002. IPI: The PI3Kγ inhibitor IPI594. Dora: The p38-MAPK inhibitor
  Doramapimod. JSH: The NF-κB inhibitor JSH-23. Tofa: The JAK inhibitor Tofacitinib.
  (E) Quantitative bar graphs showed that the intervention of p38-MAPK inhibitor Dora
  significantly reduced p-p38/p38 and ARG2 protein levels compared with LPS treatment
  alone. (F and G) The half-life of ARG2 in isolated CXCR2Hi MDSC when treated with
  the DMSO/Dora and cloheximide (CHX) for indicated times. Statistical significance
  was calculated via the unpaired t-test. (H) Inhibition of the proteasome via MG132
  reversed ARG2 downregulation induced by the p38 inhibitor Dora. (I) Cellchat analysis
  revealed strong communication probabilities of Cxcl2-Cxcr2 chemotaxis between CXCR2Hi
  MDSC and itself. (J) The bar plot showed relatively increased CXCL signaling flow
  at infected status. (K) Elevated CXCL2 levels in plasma and BALF samples from PIS
  mice models, as calculated by unpaired t-test. n = 3 biologically independent mice.
  (L) LPS stimulation resulted in increased secretion of CXCL2 by CXCR2Hi MDSCs, which
  was reversed by the p38 inhibitor Doramapimod. Statistical significance was calculated
  by the Brown-Forsythe and Welch analysis of variance (ANOVA) test. (M) Proposed
  model demonstrating the p38-MAPK cascade regulated immunosuppressive function and
  migration of CXCR2Hi MDSC in K.p-relevant PIS. The illustration was created by BioRender.
  Data were presented as mean ± SD. *p < 0.05, **p < 0.01, ***p < 0.001'
