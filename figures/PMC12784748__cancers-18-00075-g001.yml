figure_title: Cluster analysis of glycolysis.
caption: Cluster analysis of glycolysis. (A) Unsupervised clustering of 30 glycolysis-related
  regulators in the DLBCL cohort. The gender, Gly cluster, and risk were used as patient
  annotations. High expression is marked in yellow, while low expression in blue.
  (B) Unsupervised clustering of glycolysis-related signaling pathway in the DLBCL
  cohort. The cluster, risk, and gender were used as patient annotations. High expression
  is marked as yellow, while low expression as blue. (C) Kaplan–Meier survival analysis
  of the four Gly modification patterns. While the unsupervised clustering was performed
  on the full cohort (n = 562), the survival analysis was restricted to the subset
  of patients with available follow-up data (n = 191). The Kaplan–Meier analysis showed
  a significant difference in overall survival among the four Gly modification patterns
  (log-rank p = 0.011). Gly cluster-D showed significantly better overall survival
  than the other three clusters
