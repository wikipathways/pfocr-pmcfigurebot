figure_title: Proposed Working Model Illustrating the Synergistic Antitumor Effects
  of Combined MMC and Quercetin Treatment in Retinoblastoma Cells.
caption: Proposed Working Model Illustrating the Synergistic Antitumor Effects of
  Combined MMC and Quercetin Treatment in Retinoblastoma Cells. A schematic model
  is presented to illustrate a conceptual framework describing the synergistic antitumor
  effects observed following combined treatment with MMC and quercetin in retinoblastoma
  cells. Based on the experimental findings generated in this study, DNA damage induced
  by MMC is linked to transcriptional responses consistent with p53-associated signaling
  pathways, accompanied by increased expression of pro-apoptotic mediators, including
  BAX and CASP3, together with suppression of the anti-apoptotic protein BCL-2, thereby
  suggesting engagement of mitochondrial apoptotic signaling. In this context, quercetin
  may enhance cellular sensitivity to MMC-induced stress, resulting in amplified p53-associated
  transcriptional responses, CDKN1A (p21)-mediated cell cycle arrest, and reinforcement
  of apoptotic signaling pathways. Elevated oxidative stress, supported by HMOX1 upregulation
  and partial attenuation of cytotoxic effects following NAC pretreatment, contributes
  to but does not fully explain the observed cytotoxicity. This schematic is intended
  to represent a data-driven working model integrating qRT-PCR, flow cytometry, ELISA,
  and in silico analyses, rather than direct experimental validation of all signaling
  interactions
