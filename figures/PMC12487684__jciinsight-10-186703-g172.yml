figure_title: Lomitapide cytotoxicity in vitro is attributed to inhibition of de novo
  cholesterol synthesis
caption: Lomitapide (2 μM) treatment has no effect on the expression of microsomal
  triglyceride transport protein (MTTP) in CTL-U251 (A and B) and TR-U251 (C and D)
  cells as confirmed by Western blot analysis after 24 and 48 hours of drug treatment.
  (E) Proposed mechanism of action of lomitapide. Lomitapide inhibits the critical
  rate-limiting step of mevalonate pathway by binding to HMGCR. While normally, cholesterol
  production acts through a negative feedback loop to control HMGCR synthesis, reduction
  in cholesterol production causes accumulation of HMGCR. (F) Targeted LC-MS results
  showing relative concentration of mevalonic acid in CTL-U251 cells treated with
  2 μM lomitapide for 72 hours (n = 3). The data is normalized to untreated control.
  Inhibition of mevalonate pathway in CTL-U251 (G and H) and TR-U251 (I and J) cells
  at 24 and 48 hours following lomitapide treatment (0 μM, 1 μM, or 2 μM) is verified
  by accumulation of HMGCR. The data are normalized to untreated control. Lomitapide
  treatment does not lead to accumulation of HMGCR in normal HEK293 cells (K). (L)
  Cholesterol uptake by CTL-U251 cells following a 72-hour incubation in serum-free
  media at various lomitapide concentrations. U-18666A represents positive uptake
  control. The data are normalized to untreated control. All data is represented as
  individual measurements with mean ± SD. Two-tailed Student’s t tests were used for
  statistical comparisons between 2 groups, 1-way ANOVA, followed by a post-hoc Tukey’s
  HSD test, was used for multiple group comparisons. *P < 0.05; **P < 0.01; ***P <
  0.001; ****P < 0.0001
