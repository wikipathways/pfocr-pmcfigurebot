figure_title: Graphical summary of the proposed mechanistic interactions triggered
  by glyphosate and glyphosate-based herbicides (GBHs) in breast cancer cells.
caption: Graphical summary of the proposed mechanistic interactions triggered by glyphosate
  and glyphosate-based herbicides (GBHs) in breast cancer cells. Glyphosate may activate
  estrogen receptor α (ERα), enhance estrogen-responsive gene transcription, and promote
  cell proliferation in hormone-dependent breast cancer models. Concurrently, GBH
  exposure can increase reactive oxygen species (ROS) levels, leading to oxidative
  stress and redox-sensitive signaling pathway activation. Elevated ROS may also induce
  DNA damage while impairing DNA repair mechanisms, thereby contributing to genomic
  instability. The crosstalk between ER activation, oxidative stress, and DNA damage
  suggests that these pathways may converge to create a cellular environment conducive
  to tumor-promoting responses. ↑ increase in the activity. ↓ decrease in the activity
