figure_title: Blocking glycogen breakdown or synthesis reduces germ cell number in
  XY gonads during sex determination
caption: (A) Reactome pathway analysis of significant upregulated (cyan) and downregulated
  (green) genes in the GPI treated gonads vs the vehicle control. (B) 3D projection
  of DDX4 (germ cell, magenta) whole mount immunostaining in male gonads cultured
  with 75 μM GPI or vehicle solution. Samples were counterstained with DAPI (blue).
  Dashed white line delineates the testicular region. Scale bars=100 μm. (C) Quantification
  of the total number of germ cells in male gonads cultured with 75 μM GPI or vehicle
  solution. Bars represent mean±s.e.m., n=6. Two-tailed t-test. **p<0.01. (D) Gene
  ontology (BP) analysis of significant upregulated (red) and downregulated (blue)
  genes in E12.5 Ppp1r3c cKO testis vs control. (E) Dot plot representation of the
  expression of all the downregulated genes in the Ppp1r3c cKO testes in different
  embryonic E12.5 testicular cell populations from the single-nucleus RNA-seq dataset.
  (F) Immunofluorescence for the Sertoli cell marker SOX9 (green) and germ cell marker
  TRA98 (magenta) in E12.5 male control and Ppp1r3c cKO gonads. Scale bars=50 μm
