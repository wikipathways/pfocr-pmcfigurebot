figure_title: Manganese-induced dsRNA upregulates interferon β transcription
caption: A) Diagram summarizing the pathway activated by manganese effects in mitochondria
  leading to IFNβ transcription. Depicted are the components targeted by inhibitors
  and the pathway agonists, poly (I:C) and ADU S100. Created with elements of Biorender.com.
  B) Interferon β promoter luciferase reporter activity measured in either HAP1 or
  HeLa cells following 24h treatment with the indicated manganese dose. For positive
  control 10μg/ml of high molecular weight poly (I:C) was added. Average ± SEM of
  3 experiments. One-way ANOVA followed by Dunnett’s multiple comparisons test. Dotted
  line marks luciferase activity in the absence of manganese. C) Interferon β promoter
  luciferase reporter activity measured in HeLa cells transfected with non-targeting
  and targeting siRNAs followed by 24h treatment with 800μM manganese or 10 μg/ml
  poly (I:C). Data are depicted as percentage of signal in scrambled sequence siRNA
  transfected cells. Average ± SEM of 3 experiments. Dotted line marks 50% reduction.
  One-way ANOVA followed by Tukey’s multiple comparisons test. Bottom panel depicts
  western blots of protein level downregulation following siRNA transfections. D)
  Top panel depicts manganese content determined by ICP-MS in HeLa cells incubated
  with 800μM manganese with and without the indicated inhibitor, identical conditions
  as employed for the bottom panel experiments. Bottom panel shows luciferase activity
  measured in HeLa cells following 24h treatment with the indicated manganese dose.
  For positive control, 10μg/ml of poly (I:C) were added. Average ± SEM of 5 experiments.
  Two-way ANOVA followed by Bonferroni’s multiple comparisons test. E) Luciferase
  activity measured in HeLa cells following 24h treatment with 800μM manganese (top
  left panel) or 10μg/ml poly(I:C) (bottom left panel) in the presence or absence
  of the Sting inhibitor H-151. Right panel shows 0.5μM H-151 inhibition of luciferase
  induction by transfection of 1μM ADU S100 Sting agonist. Average± SE. Two-way ANOVA
  followed by Bonferroni’s multiple comparisons test. Top numbers show manganese effect,
  bottom number show drug effect
