caption: 'HuMSC-Exos attenuated oxidative stress in UVB-exposed HaCaTs by activating
  the Nrf2 signaling pathway. (A, B) DCFH-DA staining and quantification of ROS levels
  in HaCaTs after different treatments (blue: Hoechst; green: ROS; scale bar: 100 μm).
  (C–G) RT-qPCR and Western blot analyses of Keap1, Nrf2 (p-Nrf2 and total Nrf2),
  and HO-1 expression, with corresponding grayscale quantification. (H, I). Western
  blot and quantification of nuclear and cytoplasmic Nrf2 protein levels. (J) Immunofluorescence
  staining showing Nrf2 localization (blue: DAPI; green: Nrf2). Scale bar: 50 μm.
  Data are presented as mean ± SD (n = 3). (ns: nonsignificant, ⁣∗: p < 0.05, ⁣∗∗:
  p < 0.01, ⁣∗∗∗: p < 0.001, ⁣∗∗∗∗: p < 0.0001)'
