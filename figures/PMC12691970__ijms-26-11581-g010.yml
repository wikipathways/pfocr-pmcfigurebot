figure_title: Pgp-mediated lysosomal transport and redox cycling of thiosemicarbazones.
caption: Pgp-mediated lysosomal transport and redox cycling of thiosemicarbazones.
  The lysosomotropic thiosemicarbazones Dp44mT and DpC are transported by Pgp from
  the cytosol into the endosomal–lysosomal pathway through endocytosis. As endosomes
  mature into lysosomes (pH 4.5–5), these complexes accumulate and undergo redox cycling
  between Cu2+ and Cu+, generating ROS such as hydroxyl radicals (•OH) and H2O2. The
  accumulation of ROS triggers LMP, leading to oxidative damage and ultimately cell
  death. Created in BioRender. Dharmasivam, M. (2025) https://app.biorender.com/68e915e070d05657446c429c
  (accessed on 11 October 2025)
