figure_title: The effect of temozolomide on the viability of glioblastoma cells is
  attenuated by inhibition of the bitter taste signalling pathway.
caption: |-
  The effect of temozolomide on the viability of glioblastoma cells is attenuated by inhibition of the bitter taste signalling pathway. (A) Immunofluorescence analysis of α-gustducin (GNAT3) expression after siRNA transfection in SNB-19 glioblastoma cells. Protein levels of siRNA GNAT3-transfected cells are decreased in comparison with non-, mock-, and siRNA scramble-transfected cells. The quantification of GNAT3 fluorescence intensity (green) was performed in different regions of interest of confocal microscopy images obtained from three independent experiments. Scale bar: 10 µm. Bar graphs represent mean ± SEM. Statistical analysis was performed by one-way ANOVA followed by Tukey’s multiple comparisons test. [N = 3 independent experiments; *** p < 0.001]. (B) Effects of TMZ on the viability of U-87MG, SNB-19, and U-373MG glioblastoma cells transfected or mock-transfected for 24 h with GNAT3 or a scramble siRNA, followed by incubation with 500 µM TMZ for 72 h, in the presence or absence of 1 mM probenecid. Bar graphs represent mean ± SEM. Statistical analysis was performed by one-way ANOVA followed by Tukey’s multiple comparisons test. [N ≥ 3 independent experiments; § versus non-transfected (§ p < 0.05 and §§§§ p < 0.0001); # versus non-transfected + TMZ (# p < 0.05, ##
  p < 0.01 and #### p < 0.0001)]
