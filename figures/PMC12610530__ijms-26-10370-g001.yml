figure_title: Insulin signaling pathway in skeletal muscle and role of ROS and redox
  sensitive systems.
caption: Insulin signaling pathway in skeletal muscle and role of ROS and redox sensitive
  systems. Insulin binds its receptor leading to activation of IRS and production
  of O2•− via NOX enzymes, which is dismutated by SOD to form H2O2 that can enter
  the cell via aquaporins. Mitochondria also produce H2O2 that participate in the
  insulin signaling cascade. PTP1B is a negative regulator of insulin, acting through
  inhibition of IRS phosphorylation. Physiological levels of H2O2 inhibit PTP1B, thereby
  augmenting insulin’s downstream actions on PI3K and MAPK. MAPK activation leads
  to cell proliferation and growth. IRS also activates PI3K which mediates many of
  insulin’s action on cellular metabolism. PI3K mediates the conversion of PIP2 to
  PIP3, which activates PDK and mTORC2 to activate Akt. H2O2 can also augment activation
  of Akt at physiological levels. Akt activates mTOR leading to increased protein
  synthesis and inhibits AS160 and GSK3 which lead to GLUT4 translocation and activation
  of glycogen synthase (GS) to promote glycogen synthesis. AS160 mediates GLUT4 translocation
  through its action on Rab8a and Rab13, which is complemented by Rac1 activation
  by PI3K. GSK3 is also involved in regulation of transcription factors like activation
  of NF-κB and Nrf2 which are involved in positive regulation of inflammatory signaling
  and anabolic metabolism, respectively. Akt activation also inhibits FOXO transcription
  factors, thereby inhibiting catabolic metabolic processes like gluconeogenesis.
  As shown, physiologic level of ROS are crucial for modulating both negative regulators
  of the insulin signaling cascade, as well as augmenting activation of key players
  like Akt and IR phosphorylation. Solid black arrows represent activation or phosphorylation;
  dashed arrows indicate conversion of molecules or processes involving translocation
  across the cell; orange arrows denote ROS/redox signaling; blue nodes represent
  key stages in insulin-dependent signaling; purple, pink, and teal nodes show transcription
  factors and respective boxes reflect the broad outcomes of this transcriptional
  regulation; dark red nodes represent negative regulators of insulin signaling
