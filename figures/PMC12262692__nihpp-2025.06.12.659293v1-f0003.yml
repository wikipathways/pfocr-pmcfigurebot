figure_title: Cell-free parasite lysate, DOXP-pathway inhibition, and loss of farnesyl-pyrophosphate
  synthase do not reduce IFNγ release from Toxoplasma-infected PBMCs
caption: '(A) PBMCs (5×105/well) were incubated for 24 hours with: HFF lysate or sonicated
  lysate from RHΔompdcΔup-infected HFFs. The lysates were passed through a 3 kDa filter.
  PMA/ionomycin (1x) was used as a positive control, while unstimulated PBMCs were
  used as a negative control. (B) PBMCs were infected for 24 hours with GlpT (Fos-sensitive)
  or GlpT R45K-R269K (Fos-resistant)-expressing parasites with or without fosmidomycin
  (100 µM), an inhibitor of the DOXP pathway. (C) PBMCs were infected with RHΔhpt
  (WT), RHΔhptΔfpps (farnesyl-pyrophosphate-synthase knockout), or the corresponding
  complemented knockout strain for 24 hours. (D) PBMCs were pre-incubated with lovastatin
  (Lova) (25 µM) and/or zoledronate (Zol) (45 µM), washed three times, and then infected
  with RHΔompdcΔup parasites for 24 hours. In all panels, IFNγ concentrations (pg/ml)
  in culture supernatants were measured by ELISA. Data represent means + SD from multiple
  donors (individual data points shown). Statistical significance was calculated using
  one-way ANOVA followed by Tukey’s multiple comparison test. Asterisks indicate levels
  of statistical significance: *p < 0.05, **p < 0.01, ***p < 0.001; ns indicates a
  non-significant difference'
article_title: The early human interferon gamma response to Toxoplasma gondii is driven
  by Vγ9Vδ2 T-cell sensing of host phosphoantigens and subsequent NK-cell activation
