caption: 'Mediation pathways linking PM2.5 exposure to metabolic biomarkers through
  the oral microbiome. The circos plot visualizes the significant mediation pathways
  identified by the high-dimensional mediation analysis. The outer ring segments represent
  the variables: PM2.5 exposure (blue), significant microbiome genera (green), and
  metabolic biomarkers (orange). Ribbons connecting the segments represent significant
  associations. The width of each ribbon is proportional to the absolute value of
  the effect size (e.g., the coefficient estimate for the PM2.5-genus association
  or the mediated effect for the genus-biomarker pathway)'
