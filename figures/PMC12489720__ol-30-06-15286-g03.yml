figure_title: Differential pathway and functional enrichment analysis.
caption: Differential pathway and functional enrichment analysis. (A) GSVA of the
  hallmark gene sets revealed significant differences in pathway activation between
  the two risk groups. (B) GO functional enrichment analysis identified significant
  enrichment for pathways related to cellular polarity and apical membrane organization
  in the high-risk group. (C) GO analysis of the low-risk group showed enrichment
  for immune response-related pathways, including immunoglobulin antigen binding.
  (D) KEGG pathway enrichment analysis identified differential activation of signaling
  pathways between the two risk groups. Pathways were categorized based on shared
  biological functions to reveal common themes across the groups. GO, Gene Ontology;
  KEGG, Kyoto Encyclopedia of Genes and Genomes; GSVA, Gene Set Variation Analysis;
  BP, biological process; CC, cellular component; MF, molecular function
