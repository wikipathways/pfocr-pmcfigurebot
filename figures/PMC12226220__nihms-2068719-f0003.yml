figure_title: Enhanced SG formation in G2-phase is determined by the specific upregulation
  of 15d-PGJ2 by cytosolic phospholipase A2
caption: 'A) Schematic of the Arachidonic Acid Pathway leading to 15d-PGJ2 production.B)
  MiaPaCa-2 cells were treated with either vehicle (Asynchronous) or Ro-3306 (G2-phase),
  and the following phospholipase inhibitors: PLC inhibitor (D609) (18 μM for 16 h);
  PLD inhibitor (FIPI) (25 nM for 16h), and the cPLA2 inhibitor Pyrrophenone (PYR)
  (18.4 μM for 16h). For the final hour of these treatments, cells were subjected
  to oxidative stress as in 1A. Quantification of SG index derived as in 1G. Data
  are mean SG index +/− SEM from at least 3 independent experiments, and individual
  average values (circles) are shown for each experiment.C) Representative immunostaining
  of the SG markers G3BP1, EIF4G and DAPI of PYR treated cells in C.D) Western blot
  of lysates from human PDAC cells (MiaPaCa-2 and HPAC) expressing the indicated Dox-inducible
  shRNAs and cPLA2 protein fused to GFP (cPLA2-GFP).E) Representative immunostaining
  of the SG markers G3BP1, EIF4G and DAPI in Asynchronous or G2-phase synchronized
  MiaPaCa-2 cells in D subjected to oxidative stress as in 1A.F) Quantification of
  SG index in cells in D-E and derived as in 1G. Data are mean SG index +/− SEM from
  at least 3 independent experiments, and individual average values (circles) shown
  for each experiment.G) 15d-PGJ2A or vehicle were added to Asynchronous and G2-phase
  MiaPaCa-2 cells in the presence or absence of the cPLA2 inhibitor cPLA2 inhibitor
  Pyrrophenone (PYR) (18.4 μM for 16h). Cells were stressed as in 1A and assessed
  for SG formation. Representative immunostaining of the SG markers G3BP1, EIF4G and
  DAPI are shown.H) Quantification of SG index in cells in 3G and derived as in 1G.
  Data are mean SG index +/− SEM from at least 3 independent experiments, and individual
  average values (circles) are shown for each experiment.I) 15d-PGJ2A or vehicle were
  added to Asynchronous and G2-phase MiaPaCa-2 cells expressing the indicated Dox-inducible
  shRNAs. Cells were stressed as in 1A and assessed for SG formation as in 1G. Data
  are mean SG index +/− SEM from at least 3 independent experiments, and individual
  average values (circles) are shown for each experiment.Scale bar, 10um. *p<0.05,
  **p<0.01, ***p<0.001, ****p<0.0001 One-Way Anova with Tukey’s posthoc test'
