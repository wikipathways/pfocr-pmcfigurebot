figure_title: Genomic features of Coprinus comatus.
caption: 'Genomic features of Coprinus comatus. Length distribution of coding sequences
  (CDSs) predicted from the assembled genome. Only CDSs ≥ 90 bp were included; bars
  indicate the number of genes in each length interval, while the line represents
  their proportion relative to the total gene set. The majority of CDSs cluster in
  the 1–2 kb range, consistent with an average length of ~1.55 kb (A). KEGG Level-3
  distribution of KO assignments derived from the C. comatus genome. Bars indicate
  the number of genes annotated to each pathway; prominent categories include ribosome,
  spliceosome, and protein processing in endoplasmic reticulum, together with broad
  metabolism (amino acids and carbohydrates) and transporter modules. Note that these
  counts report annotation coverage rather than differential or enriched activity;
  functional enrichment is assessed separately using stage-specific DEGs/DAMs (see
  Results Section 3.3 and Section 3.5). Source data: KO mapping files produced during
  genome annotation (B)'
