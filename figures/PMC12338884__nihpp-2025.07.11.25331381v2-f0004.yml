figure_title: Associations of pathways with psychiatric traits vary by cell-type and
  gene dosage
caption: (a) Schematic illustrating how gene sets were defined by intersecting pathway,
  cell type, and cortical region dimensions. Example intersections include Chromatin-ExNeu,
  Chromatin-Assoc, ExNeu-Assoc, and Chromatin-ExNeu-Assoc. (b) Full model R2 estimates
  showing the total variance in gene-set z-scores explained by main effects and interaction
  terms for each diagnosis. Models included pathway, cell type, brain region, dosage,
  and all combinations of two-way and three-way interactions. (c) R2 estimates for
  individual interaction terms, quantifying the contribution of each interaction to
  the explained variance. The pathway×celltype×dosage interaction consistently explains
  the largest proportion of variance across diagnoses, highlighting the importance
  of dosage-sensitive and cell-type-specific pathway effects (Tables S9–S10)
article_title: Psychiatric disorders converge on common pathways but diverge in cellular
  context, spatial distribution, and directionality of genetic effects
