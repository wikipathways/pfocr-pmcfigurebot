figure_title: SMK-002 bound with EGFR and inhibited EGFR/RAF/ERK signal pathway in
  BC cells
caption: (A) The chemical formula and molecular structure of SMK-002. (B) Molecular
  docking was conducted using MOE14.0 software to predict the binding site of SMK-002
  and EGFR. (C) Once T24 or J82 cells density of 70%–80% had been reached, cells were
  treated with SMK-002 for 12 h, and the protein expression level (EGFR, p-EGFR, p-c-Raf,
  p-ERK) were detected by Western blot. Data are presented as the mean ± SD of three
  independent experiments. EGFR, epidermal growth factor receptor; BC, bladder cancer;
  ns, no significant difference. *p < 0.05, **p < 0.01, ***p < 0.001, n = 3
article_title: SMK-002 inhibits the growth of bladder cancer cells and increases their
