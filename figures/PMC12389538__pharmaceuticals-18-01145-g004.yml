figure_title: Menadione induced not only necroptosis, but also apoptosis and autophagy
  in colorectal cancer cells.
caption: 'Menadione induced not only necroptosis, but also apoptosis and autophagy
  in colorectal cancer cells. (A) Flow chart of PCR Array assay and study design.
  (B,C) Differential analysis was performed and DEGs of experimental groups (MENA-3
  μM, MENA-8 μM, and TSZ) were summarized in Venn diagram (B) and histogram (C). (D,E)
  Enrichment analysis was performed on menadione groups, including KEGG pathway analysis
  (D) and GO enrichment analysis (E). The most significant KEGG pathways (Top 15)
  were summarized in (D) and the most significant GO pathways (Top 10 of BP, CC, and
  MF) were summarized in (E). (F) Representative GSEA pathways: necroptosis, apoptosis
  and autophagy. GSEA was performed based on the average log2 FC of MENA-3 μM and
  MENA-8 μM treatment groups relative to the control group, to identify pathways consistently
  regulated across both conditions. (G) Interactive analysis of necroptosis, apoptosis
  and autophagy pathways. The Sankey diagram on the left displays genes (e.g., ATG7,
  CFLAR, BCL2, and MAPK8) mapped to biological processes of necroptosis, apoptosis
  and autophagy. The bubble plot on the right indicates enrichment degree and statistical
  significance of each pathway'
