figure_title: tDCS does not induce significant changes in pathway microstructure
caption: (A) Representative image of the thresholded probabilistic tract (red) is
  overlaid on the Montreal Neurological Institute brain template (Mazziotta, 1995).
  To create this representative image, individual tracts from all participants were
  normalized, converted to binary images, and summed. These sagittal, coronal, and
  axial MRI views are displayed with orthogonal reference lines (green) indicating
  the positions of the intersecting planes. (B) No significant increase was observed
  in the fractional anisotropy(FA) along the tracts after cognitive training in both
  the anodal (paired t-test, p = 0.34) and sham (paired t-test, p = 0.17) transcranial
  direct current stimulation (tDCS) conditions
article_title: 'Effect of combined transcranial direct current stimulation and cognitive
  training on brain microstructure and network homogeneity in late-life depression:
  a pilot study'
