figure_title: Diverse modes of sexual reproduction in the pathogenic Cryptococcus
  species complex
caption: (A) The α-a sexual (center panel, shaded in light green), unisexual (left
  panel, shaded in light blue), and pseudosexual (right panel, shaded in light teal)
  reproduction modes in the human fungal pathogens Cryptococcus species are depicted.
  The α-a sexual reproduction starts with conjugation and then cell-cell fusion (i.e.
  plasmogamy) between MATα and MATa cells that form MATα/a zygotes. The zygotes then
  initiate sexual development and grow as dikaryotic hyphae with fused clamp cells
  (right branch). Eventually, the tips of the hyphae enlarge and form basidia, in
  which the two parental nuclei fuse (i.e. karyogamy) and undergo meiosis, producing
  four meiotic products that go through rounds of mitosis to produce four chains of
  basidiospores deposited onto the surface of the basidium. Alternatively, the two
  parental nuclei can fuse soon after plasmogamy, in which case the zygotes grow as
  diploid uninucleate hyphae with unfused clamp cells, and then undergo basidium formation,
  meiosis, and sporulation. Pseudosexual reproduction is similar to the dikaryotic
  α-a sexual reproduction, except that one of the two parental nuclei is lost during
  hyphal growth (e.g. due to aberrant nuclear migration at the hyphal branching sites).
  The remaining nucleus then undergo diploidization (e.g. through endoreplication),
  meiosis, and sporulation. In this case, the basidiospores from the same basidium
  all have identical nuclear genomes that are clonal to that of the parental nucleus
  in the basidium. Unisexual reproduction also mirrors α-a sexual development, except
  that in this case two cells of the same mating type fuse and undergo karyogamy (or
  a cell undergoes diploidization through endoreplication), and the resulting diploid
  zygote grows as diploid uninucleate hyphae with unfused clamp cells. It should be
  noted that unisexual reproduction also occurs in MATa cells, and in pseudosexual
  reproduction, the nucleus that is eliminated from the dikaryotic hyphae can be that
  from either the MATα or MATa parent. (B) A simplified example of signal transduction
  pathway that is involved in regulating sexual reproduction in Cryptococcus species
