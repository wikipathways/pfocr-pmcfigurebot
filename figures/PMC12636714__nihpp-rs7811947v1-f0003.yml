figure_title: The BAT metabolome shows diminished mitochondrial thermogenesis at old
  age.
caption: 'The BAT metabolome shows diminished mitochondrial thermogenesis at old age.
  (a) Proxy for cardiolipin synthesis: ratio of nascent cardiolipins (CLs) to phosphatidylglycerols
  (PGs) across tissues (dots, individual animals; black denotes young and red denotes
  old; n=16 per age). Upper panel: heat map of fold change (FC) between old and young
  mice for the nascent CLs/PG ratio with a shared diverging color scale (−2 to +2;
  blue, decrease; red, increase; white, not significant). (b) Kernel density estimates
  of fold change (old vs. young) for significantly dysregulated metabolites in BAT
  (black), VAT (red) and SAT (blue). Positive values denote upregulation; negative
  values denote down-regulation. Rug ticks mark individual metabolites. The legend
  reports kernel bandwidth (w). (c) Total peak heights of triacylglycerols (TGs) in
  BAT, SAT and VAT for young versus old groups. (d) TG species remodeling of BAT,
  SAT and VAT. Bubble plots position individual TG species by total acyl carbons (x-axis)
  and number of double bonds (y-axis). Bubble color denotes log2 fold change (old
  vs. young); bubble size denotes −log10(p). Diverging color scale: blue, decrease;
  red, increase; white, not significant). (e) Left: heat map of log2-fold changes
  (FC) between old and young mice for selected linoleic acid (LA)/arachidonic acid
  (AA)-derived oxylipins in BAT, stratified by sex (n=8 per sex). Blue, decrease;
  red, increase; * denotes p <0.05). Right: Pathway schematic summarizing age-associated
  alterations in LA/AA metabolism in BAT, highlighting decreases in 13-HpODE, 13-OxoODE,
  12,13-DiHOME, PGE2, and 6-keto-PGF1α, and an increase in 12-HETE. (f) Left: Schematic
  of hexosamine biosynthetic pathway (HBP) in BAT. Right: Normalized concentration
  (%) of HBP metabolites in young (black) and old (red) mice (n=16 per age). Statistics:
  two-sided Mann–Whitney U tests; FDR-adjusted q values reported. Abbreviations: LA,
  linoleic acid; AA, arachidonic acid; G6P, glucose-6-phosphate; F6P, fructose-6-phosphate;
  GlcN-6P, glucosamine-6-phosphate, GlcNAc, N-acetyl-glucosamine; UDP-GlcNAc, uridine-diphosphate-N-acetyl-glucosamine.
  Shared color bars are used across heat maps'
