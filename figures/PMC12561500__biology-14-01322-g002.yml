figure_title: The anthocyanin biosynthetic pathway.
caption: 'The anthocyanin biosynthetic pathway. The pathway begins with the conversion
  of phenylalanine to cinnamic acid catalyzed by phenylalanine ammonia-lyase (PAL).
  Cinnamate-4-hydroxylase (C4H) then combines with hydroxylates cinnamic acid to form
  p-coumaric acid, which is subsequently activated to 4-coumaroyl-CoA by 4-coumaroyl-CoA
  ligase (4CL). One molecule of 4-coumaroyl-CoA and three molecules of malonyl-CoA
  (from the Krebs cycle) are condensed by chalcone synthase (CHS) to produce naringenin
  chalcone. This chalcone is isomerized by chalcone isomerase (CHI) to form naringenin,
  the core flavanone structure. Naringenin is hydroxylated by flavanone 3-hydroxylase
  (F3H) to form dihydrokaempferol (DHK). From this point, the pathway diverges into
  three branches: DHK can be hydroxylated by flavonoid 3′-hydroxylase (F3′H) to yield
  dihydroquercetin (DHQ), which is then reduced by dihydroflavonol 4-reductase (DFR)
  to leucocyanidin, and finally oxidized by anthocyanidin synthase (ANS) to form cyanidin.
  Alternatively, DHK is directly reduced by DFR to leucopelargonidin and oxidized
  by ANS to yield pelargonidin. In a third branch, DHK is hydroxylated by flavonoid
  3′,5′-hydroxylase (F3′5′H) to form dihydromyricetin (DHM), which is reduced by DFR
  to leucodelphinidin and oxidized by ANS to produce delphinidin. The unstable anthocyanidins
  (cyanidin, pelargonidin, delphinidin) are glycosylated by UDP-glucose: flavonoid
  glucosyltransferase (UFGT) to form stable anthocyanins, which are the final colored
  pigments'
