figure_title: Integrated tryptophan metabolism regulates host physiology and gut microbiota.
caption: Integrated tryptophan metabolism regulates host physiology and gut microbiota.
  Dietary tryptophan can be metabolized by host and gut microorganism that could modulate
  local and distant host physiological functions, including immune homeostasis and
  barrier physiology. Tryptophan metabolism plays an important role in neurobiological
  functions, immune responses and inflammatory mechanisms. Peripheral production of
  serotonin by enterochromaffin cells is also under the influence of the gut microorganism.
  Gut microbiota-derived tryptophan metabolite serotonin has a variety of local effects.
  Tryptophan is converted by gut microorganism into AHR ligands that regulated AHR
  signaling that maintained immune homeostasis, epithelial function, resistance to
  pathogens and xenobiotics metabolism. Gut microbiota has an indirectly effect on
  central serotoninergic pathways by regulating tryptophan and tryptamine availability
article_title: Tryptophan metabolism as a target in gut microbiota, ageing and kidney
  disease
