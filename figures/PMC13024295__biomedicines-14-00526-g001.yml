figure_title: Trained immunity’s central role in immune plasticity.
caption: 'Trained immunity’s central role in immune plasticity. Initial triggering
  of the immune response by viral particles and bacteria or its components (proteins,
  sugars, etc.) functionally reprograms innate immune cells towards a more responsive
  pro-inflammatory phenotype or a tolerant anti-inflammatory profile. Mechanistically,
  trained immunity is sustained through long-term epigenetic (responsive: H3K4me3,
  H3K27ac; tolerant: H3K9me3, H3K27me3) and metabolic alterations (responsive: increased
  glycolysis and mevalonate pathway; tolerant: increased oxidative phosphorylation
  and fatty acid oxidation), which can result in altered responses upon subsequent
  exposure to a broad range of pathogens. While such reprogramming may be beneficial
  during infections, in the setting of chronic inflammatory and/or ADs, such as MS,
  RA, T1D, and SLE, it could instead accelerate inflammatory responses, enhance antigen
  presentation, and perpetuate pro-inflammatory pathways, thereby promoting disease
  onset or progression. Created with Biorender.com'
