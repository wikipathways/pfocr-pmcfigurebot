figure_title: CRISPR-driven synthetic biology toolkit for microalgal metabolic engineering.
caption: 'CRISPR-driven synthetic biology toolkit for microalgal metabolic engineering.
  This diagram illustrates a comprehensive CRISPR-based toolkit tailored for microalgal
  metabolic engineering. At the core are dead CRISPR proteins (dCas9/dCas12), serving
  as a versatile “Swiss Army Knife” with five modular capabilities: transcriptional
  control (Labels: A. Transcription, B. Promoter, C. Gene) epigenome engineering for
  stable chromatin remodeling, precision base and prime editing without double-strand
  breaks, multiplexed systems for coordinated pathway rewiring, and biosensor logic
  gates enabling autonomous dynamic control. These tools enable enhanced productivity
  and robustness in photosynthesis and stress tolerance, high-value compound synthesis
  (lipids/biofuels, carotenoids/PUFAs, proteins), and smart carbon utilization through
  optimized CO2 fixation and flux redirection. The orange box highlights the future
  integration of gRNA design, automation for high-throughput screening, and biocontainment
  strategies. The conceptual overview diagram underscores the toolkit’s multifunctionality'
