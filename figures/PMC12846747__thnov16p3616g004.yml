figure_title: PDA NPs induce a long-term elevation of ACh in the hippocampus.
caption: 'PDA NPs induce a long-term elevation of ACh in the hippocampus. (A): Schematic
  illustration of the untargeted metabolomic analysis. Mice were intraperitoneally
  injected with PBS, or 10 mg/kg/day PDA NPs (PDA) for three consecutive days (D1-D3).
  (B): Differential analysis graph showing significant metabolite differences between
  the PDA and PBS groups, measured in both positive and negative ion modes. (C): Heatmap
  displaying the changes in hippocampal metabolites in both the PBS and PDA groups.
  (D): Bar graphs (with individual data points) highlighting these metabolite changes
  (VIP > 1, p < 0.05). The red arrow indicates ACh levels. (E): KEGG pathway enrichment
  bubble diagram comparing the PBS vs. PDA groups. (F): Schematic illustration of
  the microdialysis procedure. Mice were intraperitoneally injected with PBS or 10
  mg/kg/day PDA NPs for three consecutive days (D1-D3). (G): Bar graphs (with individual
  data points) showing the concentrations of DA, NE, ACh, and tyrosine in the hippocampus
  on D4 and D9. *P < 0.05; n = 4'
