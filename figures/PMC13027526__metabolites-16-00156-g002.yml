caption: 'Schematic representation of the glycolytic pathway and relative transcript
  expression of associated genes in R. sphaeroides under autotrophic conditions. Genes
  with decreased transcript expression are shown in blue italics, genes with increased
  expression are shown in red italics, and genes not detected in the transcriptome
  analysis are shown in black italics. The abbreviations of enzymes are as follows:
  pgi, phosphoglucose isomerase; pfkB, phosphofructokinase B; cfxA, fructose-bisphosphate
  aldolase A; cfxB, fructose-bisphosphate aldolase B; fbaB, fructose-bisphosphate
  aldolase B; gapB, glyceraldehyde-3-phosphate dehydrogenase B; pgk, phosphoglycerate
  kinase; gpmI, phosphoglycerate mutase I; eno, enolase; pykA, pyruvate kinase A;
  lctB, lactate dehydrogenase B. Pathway intermediates are abbreviated as follows:
  G6P, glucose-6-phosphate; F6P, fructose-6-phosphate; F1,6P, fructose-1,6-bisphosphate;
  G3P, glyceraldehyde-3-phosphate; DHAP, dihydroxyacetone phosphate; 1,3-BPG, 1,3-bisphosphoglycerate;
  3-PG, 3-phosphoglycerate; 2-PG, 2-phosphoglycerate; PEP, phosphoenolpyruvate. Arrows
  indicate the direction of metabolic flux between intermediates'
