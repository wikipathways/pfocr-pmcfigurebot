figure_title: Molecular mechanism of necroptosis and its induction in ER-positive
  MCF-7 breast cancer cells by protein-bound polysaccharides (PBPs) from Coriolus
  versicolor.
caption: 'Molecular mechanism of necroptosis and its induction in ER-positive MCF-7
  breast cancer cells by protein-bound polysaccharides (PBPs) from Coriolus versicolor.
  Left panel: Schematic representation of the canonical necroptosis signaling pathway.
  The process is initiated via tumor necrosis factor receptor 1 (TNFR1), FAS, Toll-like
  receptors (TLR3/4), or cytosolic pattern recognition receptors (ZBP1). Activation
  of RIPK1 and RIPK3 through RIP homotypic interaction motif (RHIM)-dependent interactions
  leads to MLKL phosphorylation. Phosphorylated MLKL oligomerizes and translocates
  to the plasma membrane, culminating in membrane rupture and cell death. Right panel:
  PBPs from C. versicolor trigger necroptosis in estrogen receptor-positive (ER+)
  MCF-7 cells by stimulating the TNF/TNFR-RIPK1/RIPK3/MLKL axis independently of reactive
  oxygen species (ROS). Pharmacological inhibition of RIPK1, RIPK3, or MLKL abrogates
  this process, confirming the involvement of this specific signaling cascade'
