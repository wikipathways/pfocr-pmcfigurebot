figure_title: Schematic diagram of CRISPR-Cas12a-mediated knockout of sporulation
  genes and its metabolic decoupling effect.
caption: 'Schematic diagram of CRISPR-Cas12a-mediated knockout of sporulation genes
  and its metabolic decoupling effect. The up and down arrows represent increase or
  decrease, the bidirectional arrow represents that energy and matter can flow to
  each other through this pathway, energy is represented by a lightning symbol, if
  matter and energy cannot pass through this pathway, it is indicated by a prohibition
  symbol, a unidirectional horizontal arrow without a prohibition symbol indicates
  that matter and energy can be utilized through this pathway. This schematic illustrates
  the life cycle of spore-forming bacteria such as Bacillus licheniformis (1–8: sporulation
  stages; 9: germination stage) and the knockout of key sporulation genes using the
  CRISPR-Cas12a gene-editing system. By measuring parameters such as spore rate (%),
  cell density, production rates of acetoin and 2,3-butanediol (qp), substrate consumption
  rate (qs), and fluorescence intensity (FI), it demonstrates the decoupling effect
  between carbon metabolism (glycolysis, TCA cycle) and the sporulation development
  process following the knockout of sporulation genes'
