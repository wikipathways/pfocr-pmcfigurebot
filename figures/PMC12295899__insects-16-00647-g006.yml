figure_title: Reduced activity of the mTORC1 signaling pathway inhibits silk gland
  DNA replication and expression of cell cycle-related gene proteins.
caption: Reduced activity of the mTORC1 signaling pathway inhibits silk gland DNA
  replication and expression of cell cycle-related gene proteins. (A) Reduced activity
  of the mTORC1 signaling pathway results in reduced DNA content in silk gland of
  L4D2. Error bars indicate SEM (n = 3). (B) Reduced activity of the mTORC1 signaling
  pathway results in reduced DNA content in silk gland of L5D2. Error bars indicate
  SEM (n = 3). (C,D) Western blots depicting the level of phosphorylation of S6K and
  CyclinE after Rapamycin treatment. (E) qPCR analysis of endoreplication-related
  genes in the silk glands of L4D2 after 12 h of Rapamycin treatment. Error bars indicate
  SEM (n = 3). (F) qPCR analysis of endoreplication-related genes in the silk glands
  of L5D2 after 6 h of Rapamycin treatment. Error bars indicate SEM (n = 3). Statistically
  significant differences were assessed using Student’s t-test (ns > 0.05, * p < 0.05,
  ** p < 0.01, and *** p < 0.001)
