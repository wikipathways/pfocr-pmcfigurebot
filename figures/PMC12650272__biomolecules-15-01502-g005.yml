figure_title: STAMBP deubiquitinates ERα protein through suppressing K48-linking poly-ubiquitination
  of ERα.
caption: 'STAMBP deubiquitinates ERα protein through suppressing K48-linking poly-ubiquitination
  of ERα. (A,C) qRT-PCR analysis of ERα mRNA levels in MCF-7 and T47D cells with STAMBP
  knockdown (A) or overexpression (C) demonstrated unchanged ERα transcription. BRCA
  cells were transfected with lentiviral vectors encoding shRNA or shControl. (B,D)
  Western blot assays revealed altered ERα protein levels upon STAMBP knockdown (B)
  or overexpression (D) in MCF-7 and T47D cells. BRCA cells were transfected with
  lentiviral vectors encoding shRNA or shControl. (E) Treatment with proteasome inhibitor
  MG132 in BRCA cells rescued ERα protein reduction induced by STAMBP knockdown, suggesting
  STAMBP regulation via ubiquitin–proteasome pathway. Cells were transfected with
  lentiviral vectors encoding shRNA or shControl. Following a 24 h transfection period,
  cells were exposed to 10 μM MG132 for 6 h to inhibit proteasomal activity. (F–H)
  CHX chase assay showed decreased ERα protein half-life in STAMBP-knockdown cells.
  Cells were transfected with lentiviral vectors encoding shRNA or shControl. Cells
  were incubated with 100 μM cycloheximide for specified durations to inhibit protein
  synthesis. ERα protein expression levels were quantified using ImageJ 1.8.0 software.
  (I) Molecular docking prediction of ERα protein and STAMBP. (J) IF staining showed
  the colocalization of STAMBP and ERα in ERα-positive BRCA cells (scale bar: 50 μm).
  (K) WB and IP assays showed the combination of STAMBP and ERα protein in ERα-positive
  BRCA cells. (L,M) IP and WB assays revealed increased ERα polyubiquitination upon
  STAMBP knockdown (L) and decreased polyubiquitination upon STAMBP overexpression
  (M) in MCF-7 and T47D cells. Cells were transfected with shSTAMBP or either 2 μg
  or 4 μg of full-length Flag-STAMBP expression plasmid or corresponding control vectors.
  Twenty-four hours post-transfection, cells were treated with 10 μM MG132 for 6 h.
  Co-IP assays were subsequently conducted to assess ubiquitination levels of ERα.
  (N) K48 or K63 special polyubiquitination of ERα in HEK-293T cells was examined
  through WB and IP assays after transfecting with corresponding plasmids. Cells were
  transfected with full-length Flag-STAMBP, Myc-ERα, HA-Ub, HA-Ub-K48-only, or HA-Ub-K63-only
  plasmids. Twenty-four hours post-transfection, cells were treated with 10 μM MG132
  for 6 h. Co-IP assays were subsequently conducted to assess ubiquitination levels
  of ERα. ns = not significant, ** p < 0.01, *** p < 0.001. Original western blots
  can be found at Supplementary Materials'
