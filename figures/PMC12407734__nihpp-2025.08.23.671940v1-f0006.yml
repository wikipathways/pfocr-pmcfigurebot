figure_title: Smad7Δ/Δ LT-HSCs preferentially expand in the fetal liver and bone marrow
caption: |-
  (A) Quantification of phenotypic LT-HSCs (LSK CD48− CD150+) in FLs of E14.5 Smad7
  f/f or Smad7Δ/Δ fetuses by flow cytometry. Mean±SD, unpaired, two-tailed Student’s t-test, n=8-21 FLs and 3 independent experiments. (B) Similar frequencies of functional LT-HSCs in Smad7f/f and Smad7Δ/Δ FLs as determined by limiting dilution analysis. 5K, 20K, 40K, 120K, or 400K unsorted Smad7f/f and Smad7Δ/Δ FL cells (CD45.2+) were transplanted into lethally irradiated recipients (CD45.1+). Shown are percent negative recipients at each dose where negative was defined as <1% donor chimerism in the PB at 16 weeks. n= 38-39 recipients per genotype with 5-15 recipients per dose. (C) Percentage of colonies with biallelic (del/del), monoallelic (f/del) or no Smad7 deletion (f/f) in E14.5 and E18.5 Smad7f/f and Smad7Δ/Δ FLs, and in donor-derived LT-HSCs in the BM 16 weeks post-transplant of E14.5 FL cells. LT-HSCs were sorted from the FL or BM, plated in methylcellulose, and individual colonies were genotyped by PCR. Mean±SD, two-way ANOVA and Tukey's multiple comparison test. n=24-153 individual colonies. (D) Pathways enriched in transcripts upregulated in E18.5 Smad7Δ/Δ LT-HSCs using Reactome analysis. (E) Ribosome biogenesis scores in Smad7
  f/f or Smad7Δ/Δ LT-HSCs and LK cells were calculated based on the average expression of 322 ribosome biogenesis pathway genes using AddModuleScore in Seurat. Wilcoxon Rank Sum Test. (F) Representative histograms from OP-Puro assay of phenotypic LT-HSCs and LK cells from E18.5 FLs. LT-HSCs from the pregnant dam were used as controls. (G) Relative protein synthesis rates measured by OP-Puro incorporation. One representative experiment is shown. Mean±SD, unpaired, two-tailed Student’s t-test, n=12-15 FLs and 3 independent experiments
