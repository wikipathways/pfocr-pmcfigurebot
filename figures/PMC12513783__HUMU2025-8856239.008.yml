figure_title: Single-cell analysis of myeloid cells in ccRCC.
caption: 'Single-cell analysis of myeloid cells in ccRCC. (a) Chord diagrams show
  the cell–cell interactions between major cell types in ccRCC. (b) Dot plot showing
  major cell types'' outgoing and incoming interaction strength in ccRCC. (c) UMAP
  plot of individual myeloid cells. Each dot denotes one cell; color represents myeloid
  subtypes. (d) Comparison of the average expression of signature genes between cell
  subpopulations in tumor and normal groups. The top bar colors represent different
  cell subpopulations and sample types (tumor: red and normal: blue). Colors from
  blue to red represent the average expression from low to high. (e) Differential
  composition analysis via a beta-binomial generalized linear model between tumor
  and normal samples. (f) PCA of the myeloid cell subpopulations based on the scores
  of KEGG metabolism pathways. Dots and colors represent different cell subpopulations.
  (g) Comparison of the pathway enrichment of fatty acid oxidation and the biosynthesis
  process in the myeloid subpopulations. Statistics represent the enrichment degree;
  dot sizes represent the log-transformed q-value. FAO, fatty acid oxidation; FABP,
  fatty acid biosynthesis process. (h) Top-ranked ligands and ligand–target pairs
  are inferred to regulate the myeloid subpopulations by high-NS malignancy, according
  to NicheNet. (i) Density plots showing the myeloid subsets'' proinflammatory scores
  (A) and immunosuppression scores (B). The central mark indicates the median, and
  the bottom and top edges of the box indicate the first and third quartiles, respectively'
