caption: 'Canonical Wnt/β-Catenin Signaling: “Wnt OFF” vs. “Wnt ON”. Schematic representation
  of canonical Wnt/β-catenin signaling pathway in inactive (“Wnt OFF”) and active
  (“Wnt ON”) states. In absence of Wnt ligands (Wnt OFF), β-catenin destruction complex—composed
  of APC, Axin, CK1α, and GSK3β—phosphorylates β-catenin, leading to ubiquitination
  and proteasomal degradation, thereby preventing Wnt target gene transcription. When
  Wnt ligands are present (Wnt ON), they bind to Frizzled receptors and low-density
  lipoprotein receptor-related protein 5/6 (LRP5/6) co-receptors, activating Disheveled
  (DVL) and inhibiting the destruction complex. This results in β-catenin stabilization,
  cytoplasmic accumulation, and nuclear translocation, where it is associated with
  TCF/LEF transcription factors to activate Wnt target gene expression'
