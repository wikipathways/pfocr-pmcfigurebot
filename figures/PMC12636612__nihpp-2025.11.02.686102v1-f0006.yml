figure_title: The difference between direct and indirect pathway activity determines
  goal proximity
caption: a) For downstream neurons receiving basal ganglia output, the net input is
  roughly proportional to subtracting iSPN activity from dSPN activity. To record
  direct and indirect pathway activity in the same animal, D1-cre or A2a-cre mice
  were co-injected with a Cre-ON calcium indicator and a Cre-OFF calcium indicator
  (n = 4). b) Representative example of direct, indirect, and net lever-approach neural
  activity as the mouse approached the lever. c) Representative example of the same
  mouse’s average distance from the lever during the same time window as in (b). d)
  There was a positive correlation between the average net activity of lever approach
  neurons and distance from the lever. (R2 = 0.89, p < 0.0001). e) Representative
  example of a mouse’s direct, indirect, and net count neuron activity as the mouse
  approached the port. f) Representative example of the same mouse’s average distance
  from port during the same time window as in (e). g) There was a positive correlation
  between the average net activity of count neurons and the mice’s average horizontal
  distance from the port. (R2 = 0.90, p < 0.0001). Data represents mean ± SEM
