figure_title: Octopaminergic neurons are necessary for food-deprived ethanol preference
caption: (A) Schematic of ethanol conditioning paradigm used for food-deprivation
  experiments. Reciprocally trained vials of 30 flies are presented with three exposures
  of an unpaired odor and odor paired with an intoxicating dose of ethanol (66%, see
  methods) for 10 minutes each. There are 50-minute intervals of air exposures in
  between each pairings. ‘Food-deprived’ flies are placed on 2% agar vials prior to
  the start of training and kept on these vials until the test period, while ‘satiated’
  flies are fed yeast pellets following the acquisition period. (B) Schematic of the
  octopamine/tyramine synthesis pathway detailing the conversion of tyrosine to tyramine
  with the tyrosine decarboxylase enzyme and subsequent conversion to octopamine via
  the tyramine β hydroxylase enzyme. (C) A tyramine β hydroxylase null mutant that
  is unable to convert tyramine to octopamine does not affect ‘satiated’ ethanol preference.
  However, this mutation exhibits a significant reduction in preference when flies
  are ‘food-deprived’ relative to Canton S wild-type controls. T(29)=2.3976, p<0.05.
  (D) Thermogenetic silencing of tyramine/octopamine expressing neurons throughout
  acquisition and test periods does not affect preference when the fly is ‘satiated’
  but significantly reduces preference when the fly is ‘food-deprived’ relative to
  transgenic controls. One-way ANOVA with Tukey’s HSD method with Holm’s inference
  statistic was used to compare mean and variance across planned comparisons. F(2,38)=10.97,
  p<0.001. (E) Maximum intensity projection of MB113C-splitGAL4>20xUAS-IVS-CsChrimson-mVenus
  (green) and nc82 neuropil stain (blue) (images curated from Janelia Flylight Project
  Team; Aso et al., 2014a). Silencing MB113C-splitGAL4 using shibirets throughout
  acquisition and retrieval did not alter food-deprived ethanol preference relative
  to transgenic controls. (F) Maximum intensity projection of MB022B-splitGAL4>pJFRC200–10XUAS-IVSmyr::smGFP-HA
  (green) and nc82 neuropil stain (blue)(images curated from Janelia Flylight Project
  Team; Aso et al., 2014a). Silencing MB022B-splitGAL4 using shibirets throughout
  acquisition and retrieval did not result in food-deprived ethanol preference. (G)
  Maximum intensity projection of MB021B-splitGAL4>pJFRC200–10XUAS-IVSmyr::smGFP-HA
  (green) and nc82 neuropil stain (blue)(images curated from Janelia Flylight Project
  Team; Aso et al., 2014a). Silencing MB021B-splitGAL4 using shibirets throughout
  acquisition and retrieval did result in a significant food-deprived ethanol preference.
  One-way ANOVA with Tukey’s HSD method with Holm’s inference statistic was used to
  compare mean and variance across planned comparisons. F(2,49)=5.4586, p<0.01. (H)
  Thermogenetic inactivation of MB021B-splitGAL4 during the retrieval period results
  in a reduction of ethanol preference when compared to GAL4 controls only when flies
  are food-deprived. One-way ANOVA with Tukey’s HSD Method with Holm’s inference statistic
  was used to compare mean and variance across planned comparisons. F(2,54) = 17.8807,
  p < 0.001. Bar graphs illustrate mean +/− standard error of the mean. Raw data are
  overlaid on bar graphs. Each dot represents approximately 60 flies (30 per odor
  pairing). *p<0.05 **p<0.01 ***p<0.001
