figure_title: |-
  Persistence is independent of glutamatergic and GABAergic activity and
  dependent on the M1 receptor via an ICAN pathway
caption: |-
  (A) Left: Trace of persistent firing after exposure to CCh from a
  representative L5 RS neuron. Right: Trace from the same neuron after
  glutamatergic and GABAergic synaptic blockers APV, CNQX, and picrotoxin were
  added to the bath. Note that application of these glutamate and GABA blockers
  did not block persistent activity. (B) Top. Same as
  A but for the nonselective muscarinic
  receptor antagonist, atropine. Application of atropine completely blocked
  persistent activity, revealing its dependence on muscarinic receptors.
  Middle. Same as A but for the
  preferential M1 receptor antagonist, pirenzepine. Application of pirenzepine
  completely blocked persistent activity, highlighting the predominant role of the
  M1 receptor in supporting persistent activity. Bottom. Same as
  A but for the ICAN blocker, flufenamic
  acid. Application of flufenamic acid blocked persistent activity, showing that
  the ICAN pathway is a necessary component. (C) Summary of the percent of cells
  with persistent activity blocked by the pharmacological interventions reported
  in the previous panels. Persistent firing in dependent on M1 receptors, as well
  as the ICAN pathway
