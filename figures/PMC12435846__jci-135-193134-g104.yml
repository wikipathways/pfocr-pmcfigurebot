figure_title: Cortisol is a key regulator of ICOS-mediated IL-10 production in ILC2s
caption: (A and B) Total RNA from WT and ICOS-KO mice was extracted to perform a bulk
  transcriptomic analysis. (A) Volcano plots represent differentially expressed genes
  involved in steroid biosynthesis. (B) Biosynthetic pathway of cortisol from cholesterol
  showing intermediate metabolites and key enzymes involved in each step. Changes
  in enzyme expression are indicated as log2(fold change) values in colored boxes.
  (C) The bar graph represents the normalized counts of Cyp11a1. n = 3. (D) Representative
  histogram of protein expression of CYP11A1. Corresponding quantitation is presented
  as MFI. n = 4. (E) WT and ICOS-KO aILC2s were isolated and cultured with or without
  U18666A or statin. (F) Levels of cortisol in the culture supernatant were measured
  by ELISA. n = 3. (G) Representative histogram of protein expression of GR. Corresponding
  quantitation is presented as MFI. n = 4. (H–K) ICOS-KO aILC2s were cultured with
  or without cortisol. (I) Levels of IL-10 in the culture supernatant were measured.
  n = 4. (J and K) Representative plots of MAF (J) and NFIL3 (K) expression levels
  in each group are shown. Corresponding quantitation is presented as MFI. n = 4.
  (L–O) Sorted aILC2s from NMUR1cre (ILC2WT mice) and NMUR1creGRfl/fl mice (ILC2ΔGR
  mice) were cultured with isotype control or anti-ICOS antibody. (M) Bar graph representing
  the frequency of IL-10+ ILC2s in each group. n = 4. (N and O) Representative plots
  of MAF (N) and NFIL3 (O) expression levels in each group are shown. Corresponding
  quantitation is presented as MFI. n = 4. Data are presented as mean ± SEM and are
  representative of 4 independent experiments. Two-tailed Student’s t test was employed
  for statistical analysis; *P < 0.05, **P < 0.01, and ***P < 0.001, and ****P < 0.0001.
  Schematic images were created in Adobe Illustrator. FMO, fluorescence minus one
