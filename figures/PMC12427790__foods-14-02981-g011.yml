caption: 'Clustering heatmap of differential metabolites under N deficiency, classification
  map of differential metabolite pathways, radar map of sensory flavor characterization
  of differential metabolites, and dynamic distribution of differences in the content
  of each of the top 20 substances corresponding to upward and downward grouping of
  differential changes. (A) Clustering heatmap of differential metabolites under nitrogen
  deficiency. (B) Classification map of differential metabolite pathways. (C) Radar
  plot of sensory flavor characterization of differential metabolites. (D) Bar chart
  of the top 20 substances with differential changes in differential metabolites.
  Note: The x-axis represents the log2FC of the differential metabolites; that is,
  the logarithm to the base 2 of the fold change of the differential metabolites.
  The y-axis represents the differential metabolites. Red indicates upregulation of
  metabolite content, and green indicates downregulation of metabolite content. In
  the KEGG diagram, the y-axis represents the names of metabolic pathways, and the
  x-axis represents the number of differential metabolites annotated to the pathway
  and the proportion of this number to the total number of annotated differential
  metabolites'
