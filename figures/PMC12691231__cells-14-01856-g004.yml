figure_title: Analysis of the effects of sgRNA editing on cellular gene expression
  and associated signaling pathways.
caption: 'Analysis of the effects of sgRNA editing on cellular gene expression and
  associated signaling pathways. (A): PCA plot illustrating overall differences in
  gene expression profiles across samples and demonstrating intra-group reproducibility.
  Different colors denote distinct experimental groups, while the spatial distribution
  of data points reflects clustering patterns of gene expression profiles. (B): Volcano
  plot depicting differentially expressed genes (DEGs). The x-axis represents log2(Fold
  Change), indicating the magnitude of differential expression, while the y-axis shows
  -log10(p value), reflecting statistical significance. Upregulated, downregulated,
  and non-significant DEGs are represented by red, blue, and gray dots, respectively.
  (C): Enrichment trend plot for the PI3K-AKT signaling pathway. The upper curve illustrates
  the enrichment score distribution across the ranked gene list, while the lower curve
  displays the positions of differentially expressed genes within this pathway. (D):
  Enrichment trend plot for the MAPK signaling pathway. The upper curve indicates
  the pathway’s enrichment profile, and the lower curve shows the distribution of
  differentially expressed genes along the ranked gene list. (E): Heatmap of differentially
  expressed genes. Rows correspond to individual DEGs, and columns represent samples.
  Red and blue shades indicate high and low levels of gene expression, respectively.
  (F): Analysis of relative expression levels of differentially expressed genes associated
  with the PI3K-AKT signaling pathway(*: p < 0.05; **: p < 0.01). (G): Analysis of
  relative expression levels of differentially expressed genes associated with the
  MAPK signaling pathway (**: p < 0.01)'
