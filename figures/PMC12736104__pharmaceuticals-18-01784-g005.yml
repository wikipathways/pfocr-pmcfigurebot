figure_title: BTLA mechanisms in the tumor microenvironment.
caption: 'BTLA mechanisms in the tumor microenvironment. Schematic illustration showing
  BTLA expression on multiple immune cell types and its immunosuppressive effects.
  BTLA expressed on CD8+ TILs engages HVEM on tumor cells, leading to downstream inhibitory
  signaling. This results in reduced effector function, cytokine production, and the
  induction of an exhausted T cell phenotype, thereby limiting cytotoxic responses.
  BTLA is also expressed on Tregs, where it contributes to the stabilization and enhancement
  of their suppressive phenotype. HVEM engagement promotes increased Treg-mediated
  inhibition of local immune activity, reinforcing immune tolerance at the tumor site.
  Together, these mechanisms create a bidirectional immunosuppressive axis that facilitates
  tumor immune evasion and limits the efficacy of immunotherapy. In B cells, BTLA
  engagement reduces antibody production, proliferation, and ADCC. In NK cells, BTLA
  signaling decreases cytotoxic activity and IFN-γ production. In dendritic cells
  and macrophages, BTLA promotes tolerogenic and M2-like phenotypes by suppressing
  pro-inflammatory cytokines and enhancing immunosuppressive properties. Potential
  therapeutic strategies include BTLA blockade alone or in combination with ICIs,
  cell-specific targeting, tumor-selective delivery, modulation of the BTLA–HVEM pathway,
  or bi-specific fusion antibodies to overcome multiple layers of immune suppression.
  (Abbreviations: BTLA: B and T lymphocyte attenuator; TIL: tumor-infiltrating lymphocyte;
  HVEM: herpesvirus entry mediator; Treg: regulatory T cell; ADCC: antibody-dependent
  cell-mediated cytotoxicity; NK cell: natural killer cell; IFN-γ: interferon-gamma;
  ICIs: immune checkpoint inhibitors)'
