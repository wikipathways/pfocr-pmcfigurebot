figure_title: mTORC1 inhibition sensitizes EC cells towards ferroptosis.
caption: 'mTORC1 inhibition sensitizes EC cells towards ferroptosis. (A) ECs exhibit
  high mutation rate in the PAM pathway activating mutants. Figure is adapted from
  the cBioPortal for Cancer Genomics, data obtained from TCGA PanCancer Atlas[8–10];
  (B) Torin treatment of 8 h in EC cell lines inhibits mTORC1 and mTORC2; (C) Cell
  death curve after Torin and RSL3 treatment; (D) Cell death percentage at 24 h post
  Torin and RSL3 treatment; (E) Normalized lipid ROS intensity of EC cell lines under
  Torin and RSL3 treatment at 4 h; (F) Representative image of cell death after 24
  h of treatment with Torin and RSL3 on AN3CA and MFE296 cells; (G) CCI-779 treatment
  of 8 h in EC cell lines inhibits mTORC1; (H) Cell death at 24 h following 24 h pretreatment
  with CCI-779 and subsequent RSL3 treatment on EC cell lines; (I) Normalized lipid
  ROS intensity of EC cell lines at 4 h following 24 h pretreatment with CCI-779 and
  subsequent RSL3 treatment. Torin, 1 μM; CCI-779, 2 μM; RSL3, 50 nM; Lip-1, 2 μM.
  Data are presented as mean ± SD, n = 3 (C-E, H-I) biologically independent samples.
  Statistical analysis was performed using two-way ANOVA (D-E, H-I). In all panels
  with combination treatment, when CCI-779 was used, cells were pretreated with CCI-779
  for 24 hr before the indicated combination treatment. mTORC1: mechanistic target
  of rapamycin complex 1; EC: endometrial cancer; PAM: PI3K-Akt-mTOR; ROS: reactive
  oxygen species; ANOVA: analysis of variance; SD: standard deviation'
