figure_title: EVs from plasma of advanced prostate cancer patients overlap with cell
  line isolations
caption: a) Venn diagram showing overlap of protein cohorts between plasma EVs from
  prostate cancer patients and the EVs isolated from prostate cancer cells. b) Heatmap
  of unsupervised hierarchical clustering of 2,733 proteins that overlapped between
  plasma and cell line EVs. Three largest clusters by dendrogram are indicated on
  the right. Genes in each indicated box were put into EnrichR, with the most significant
  Hallmark pathways indicated by graph. c) Ternary plot of 2,733 proteins that were
  shared between plasma and cell line EVs. The values plotted are average protein
  level for each subtype from cell line EVs. The percentage of total signal is represented
  on the edges of the triangle, 0–100. Density of proteins within an inner triangle
  is indicated by color, scaled from 0 (fewest proteins) to 6 (most proteins). d)
  Average expression of proteins associated with prostate cancer subtype for each
  patient, represented by 36 proteins for AR+ (blue), 27 proteins for AR−/NE− (red),
  and 4 genes for AR−/NE+ (green)
