figure_title: Gut Microbiota Enhances Lung Cancer Immunotherapeutic Response via various
  Signaling Pathways.
caption: Gut Microbiota Enhances Lung Cancer Immunotherapeutic Response via various
  Signaling Pathways. Gut microbiota synergistically modulates the TIME via multiple
  core signaling cascades, thereby potentiating immunotherapeutic responses in lung
  cancer. Specifically, high-fiber diet-induced gut microbiota produces CDNs, which
  serve as natural agonists to activate the cGAS-STING pathway, promote IFNs secretion,
  recruit NK cells, reprogram macrophage polarization, enhance crosstalk between NK
  cells and DCs, and improve immune surveillance within the tumor microenvironment.
  Additionally, combined therapy with intact gut microbiota and ICIs activates the
  CD40L-CD40/NF-κB pathway, driving the phenotypic switch of macrophages from SPP1⁺
  protumoral to CD74⁺ antigen-presenting states, facilitating the expansion of effector-memory
  CD8⁺ T cells while preventing their terminal exhaustion, and constructing a γδ T
  cell-APC-CD8⁺ T cell activation loop. Furthermore, beneficial gut commensals such
  as Clostridium cateniformis downregulate the expression of PD-L2 on DCs, blocking
  the immunoinhibitory interaction between PD-L2 and RGMb to relieve T cell suppression.
  These pathways form functional crosstalk via core immune cells including macrophages
  and DCs, ultimately synergistically enhancing lung cancer immunotherapeutic response
  and breaking tumor immune tolerance. Cyclic dinucleotides, CDNs; cyclic GMP-AMP
  synthase-stimulator of interferon genes, cGAS-STING; interferon, IFN; natural killer
  cells, NK cells; dendritic cells, DCs; immune checkpoint inhibitor, ICI; nuclear
  factor kappa-light-chain-enhancer of activated B cells, NF-κB; antigen-presenting
  cell, APC; programmed death ligand 2, PD-L2; repulsive guidance molecule B, RGMb;
  tumor immune microenvironment, TIME
