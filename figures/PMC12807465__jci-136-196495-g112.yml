figure_title: UGT2B17 regulates transcription associated with mitosis and DDR
caption: (A and B) RNA-Seq analysis comparing the transcriptome between LNCaP95 and
  LN95(KO) cells (n = 2 repeats). GSEA showed top ranked signal pathways regulated
  by UGT2B17 knockout. (C) Real-time qPCR validated 8 DDR genes altered by UGT2B17
  knockout in LNCaP95 cells. (D) LNCaP, LNCaP95, and LN95(KO) cells were treated with
  increasing doses of CPT. Indicated protein markers were measured by immunoblotting.
  Densitometry of protein bands from triplicate experiments was determined by ImageJ
  and plotted. (E) LN95(KO) cells were transfected with control, UGT2B17, or UGTm
  vector and subjected to RNA-Seq analysis. GSEA tested the association between the
  gene sets altered by UGT2B17 or UGTm and the gene sets altered by UGT2B17 knockout
  in the LNCaP95 cells. (F) A heatmap shows RNA-Seq data of genes associated with
  cell mitosis and DDR in LN95(KO) cells overexpressing either UGT2B17 or UGTm. (G)
  LNCaP95, LN95(KO), and LN95(KO) cells overexpressing UGT2B17 or UGTm vector were
  used to measure the number of p-H2AX foci in 5 randomly selected high-power fields.
  (H) LNCaP95, LN95(KO), and LN95(KO) cells overexpressing UGT2B17 or UGTm were used
  to measure the apoptosis marker of cPARP. Experiments in C, D, G, and H were performed
  3 times with similar results obtained. Data are shown as the mean ± SEM. Statistical
  tests performed by 2-way ANOVA test (D), 1-way ANOVA test (G). *P < 0.05, **P <
  0.01, ***P < 0.001
article_title: Noncanonical functions of UGT2B17 promote castration-resistant prostate
