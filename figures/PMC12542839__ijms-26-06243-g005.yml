figure_title: The scheme illustrates the key metabolic modifications that have enhanced
  riboflavin production efficiency in C.
caption: 'The scheme illustrates the key metabolic modifications that have enhanced
  riboflavin production efficiency in C. famata and A. gossypii. Pathways and modifications
  are color-coded for clarity: the pentose phosphate pathway is highlighted in blue,
  alterations in glycine synthesis are shown in purple, and the de novo purine synthesis
  pathway is marked in beige. All genes written in an oval shape refer to modifications
  carried out in the yeast C. famata, while those shown in a rectangle refer to modifications
  in A. gossypii. A red marker indicates modifications intended to inhibit the pathway.
  The diagram also highlights the riboflavin biosynthetic pathway, detailing each
  step along with the corresponding genes (RIB) involved in C. famata and A. gossypii.
  This comprehensive representation allows for a clear comparison of the genetic and
  enzymatic contributions at each step of the pathway in these two species. The green
  arrow indicates activation by the product of the SEF1 gene, the structural gene
  RIB1 involved in riboflavin biosynthesis. Similarly, the SEF1 product activates
  the structural genes RIB3, RIB5, RIB6, and RIB7 but not RIB2 (S. Romanov, O. Lyzak,
  A. Sibirny, K. Dmytruk, unpublished)'
