figure_title: Mangosteen pericarp extracts attenuated DQ-induced hepatic oxidative
  stress by activating the NRF2/HO-1 pathway.
caption: 'Mangosteen pericarp extracts attenuated DQ-induced hepatic oxidative stress
  by activating the NRF2/HO-1 pathway. (A) The levels of hepatic inflammation-related
  parameters IL-6, IL-10, TNF-α, and TGF-β. (B) The relative mRNA expression of genes
  related to the inflammatory response. (C) The relative mRNA expression of the downstream
  target gene. (D,E) The representative hepatic NRF2 and HO-1 fluorescence staining
  images and quantitative results. (F,G) The representative western blot images and
  relative expression levels of NRF2 and HO-1 protein in the CON, DQ, and MQ groups.
  Representative images of fluorescence staining (20×, scale bar = 50 μm). Abbreviations:
  TNF-α, TNF-alpha; IL-6, interleukin 6; IL-10, interleukin 10; NF-κB, nuclear factor
  kappa B; NRF2, nuclear factor erythroid 2-related factor 2; HO-1, heme oxygenase-1;
  KEAP-1, Kelch-like ECH-associated protein-1; NQO1, NAD(P)H: quinone oxidoreductase-1;
  CAT, catalase; SOD-1, superoxide dismutase-1; SOD-2, superoxide dismutase-2; GST,
  glutathione S-transferase. All data are represented as the mean ± SD. n = 6 hens
  per group. * p < 0.05, ** p < 0.01, *** p < 0.001, and ns indicates an insignificant
  difference (p > 0.05)'
