figure_title: Time-of-day influence on Nuclear Proteome changes after Exercise
caption: A) Venn diagram of proteins identified from isolated nuclei in sedentary
  (n = 5), 4-hour sedentary (n = 5), and 4-hour post-exercise (n = 5) groups. B) Correlation
  and linear regression analysis of log2 fold changes comparing sedentary vs. 4-hour
  sedentary (Sed – 4-hr Sed) and sedentary vs. 4-hour post-exercise (Sed – 4-hr Ex)
  with number of proteins provided for each quadrant. Correlational (r = 0.8039, R2
  = 0.6463, P < 0.0001) and linear regression analysis (Y = 0.8223*X – 0.1220; P <
  0.001) found significant relationships between the two comparisons. Each quadrant
  from linear regression analysis is provided (C, E, G) and paired with respective
  functional cluster analysis (D, F, H, I). Functional cluster analysis displays significantly
  enriched pathways (FDR < 0.05). J-M) Heatmaps of z scored proteins with accentuated
  (J, K) or divergent (L, M) responses to time-of-day and exercise. Avg z score responses
  for Sed, 4-hour Sed, and 4-hour Ex are provided for each heatmap (right). BP = Biological
  Process; CC = Cellular Compartment; MF = Molecular Function; R = Reactome; K = Kegg
