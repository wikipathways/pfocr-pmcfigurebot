figure_title: Effects of KD on oxidative stress and mitochondrial function.
caption: 'Effects of KD on oxidative stress and mitochondrial function. KD increases
  ketone bodies (BHB, AcAc), which reduce ROS formation, activates the Nrf2/ARE signaling
  pathway, and suppresses NLRP3 inflammasome activity, thereby reducing pro-inflammatory
  cytokines (TNF-α, IL-1β, IL-6, IL-18). In parallel, KD promotes mitochondrial biogenesis,
  upregulates uncoupling proteins and enhances metabolic efficiency, while reducing
  ATP production as part of adaptive energy conservation. Abbreviations: BHB—β-hydroxybutyrate;
  AcAc—acetoacetate; ROS—reactive oxygen species; Nrf2/ARE—nuclear factor erythroid
  2-related factor 2/antioxidant response element; SOD—superoxide dismutase; NQO—NAD(P)
  H:quinone oxidoreductase; GLUT—glutathione transferase; NLRP3—NOD-like receptor
  protein 3 inflammasome; UCP—uncoupling protein; ATP—adenosine-triphosphate'
