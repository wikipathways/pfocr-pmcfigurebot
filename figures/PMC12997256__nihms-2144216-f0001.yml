figure_title: Proline acquisition pathways in ABS P. falciparum
caption: '(A) The schematic depicts the three main routes by which P. falciparum,
  directly and indirectly, obtains proline. Direct uptake (blue arrows): proline (Pro),
  arginine (Arg), and glutamine (Gln) can be imported directly from the extracellular
  environment. Hemoglobin catabolism (red arrows): these amino acids can also be acquired
  through the breakdown of hemoglobin (Hgb) within the parasite’s digestive vacuole
  (DV). Biosynthesis (green arrows): proline can be synthesized from arginine via
  ornithine (Orn) and potentially from glutamine/glutamate. Solid lines represent
  pathways experimentally demonstrated in P. falciparum or RBCs, while dotted lines
  indicate pathways confirmed in other organisms but not yet validated in P. falciparum.(B)
  Multiplexed labeling strategy with stable isotope labeled amino acids to determine
  the source of proline (Pro): mono-labeled proline will result in Pro+1, dual-labeled
  arginine will result in Pro+2, quintuple-labeled glutamine will result in Pro+5,
  and proline from hemoglobin digestion (directly or indirectly through precursors)
  will result in unlabeled proline (Pro+0).(C) Parasites were incubated with multiplexed
  isotope media for 10 h, after which metabolites were extracted and analyzed by LC-MS.
  Proline levels for the different proline species were normalized to total signal
  of all detected metabolites per sample and subsequently compared to the Dd2 parental
  line. Shown is the average and standard deviation of the fold change to Dd2 (at
  least three biological replicates). No Pro species were detected from glutamine
  metabolism (Pro+5). Statistical analysis: unpaired Student’s test between Dd2 and
  Dd2APR for each species: *p < 0.05, ***p < 0.001.See also Figure S1 for amino acid
  uptake over time and Table S1 for complete metabolomics dataset'
article_title: Disruption of P. falciparum amino acid transporter elevates intracellular
  proline and induces resistance to Prolyl-tRNA synthetase inhibitors
