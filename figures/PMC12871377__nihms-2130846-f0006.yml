figure_title: Expression differences of ortholog genes annotated for the Kyoto Encyclopedia
  of Genes and Genomes (KEGG).
caption: Expression differences of ortholog genes annotated for the Kyoto Encyclopedia
  of Genes and Genomes (KEGG). Oxidative phosphorylation (hsa00190) pathway for lab
  versus wild-cross contrasts across hypoxia treatments in the abdominal ganglion
  (n = 3 animals per group and treatment). Each node of the pathway diagram represents
  an ortholog assigned to an A. californica-annotated gene. Nodes are divided into
  six sections corresponding to treatments, from left to right, Control (normoxia),
  2 h hypoxia, 6 h hypoxia, reoxygenation, 5-day repetitive hypoxia, 6-day repetitive
  hypoxia, and recovery. Node sections are colored according to their log2fold change
  (lab vs. wild-cross). Nodes that are not colored were absent in the gene set or
  not annotated. Pathway enrichment demonstrates broad upregulation of oxidative metabolism
  in lab-cross animals across hypoxia treatments
article_title: Experience-mediated transcriptional memory correlates with hypoxia
