figure_title: The mitotic surveillance pathway is activated in DNMT1 knockout cells
caption: '(A) Quantification of relative expression of key genes in the mitotic surveillance
  pathway hESCs (blue) and hTSCs (orange) from RNAseq samples.(B) Immunofluorescence
  staining of 53BP1 in hESCs and hTSCs. Cells were stained for 53BP1 (Orange), and
  DAPI (Blue) at 20x magnification. Scale bar measures 100 μm.(C) Quantification of
  53BP1 protein signal per nuclei of imaged cells from (B). 53BP1 signal was normalized
  by H3 signal (not shown) ****: p< 0.0001(D) Brightfield pictures of hESCs and hTSCs
  exposed to 150 nM centrinone or 0.01% DMSO at 4x magnification.(E) Quantification
  of cell growth in hESCs and hTSCs when treated with DMSO or 150 nM centrinone over
  the course of 12 days. Note the tolerance of hTSCs to centrinone treatment.(F) Brightfield
  pictures of Non-Target (control), USP28−/−, TP53BP1−/− hESCs treated with DMSO or
  centrinone over the course of 4 days. Pictures taken at 4x magnification. Scale
  bar shows 750 μm.(G) Quantification of Non-Target, USP28−/−, TP53BP1−/− and TP53−/−
  hESCs treated with centrinone or DMSO over the course of four days. Red dashed line
  indicates number of cells plated. TP53−/− and corresponding control were conducted
  at a separate time and are shown as a distinct control.(H) Immunofluorescent staining
  for DNMT1 in a bulk population of TP53BP1−/− hESCs 2 to 14 days after nucleofection
  with CRISPR/Cas9 and sgRNA targeting DNMT1. Cells were stained for DNMT1 (green)
  and DAPI (blue). Pictures were taken at 20x magnification. Scale bar measures 100
  μm.(I) Percentage of Non-Target, USP28−/−, and TP53BP1−/− hESCs positive for DNMT1
  after nucleofection with CRISPR/Cas9 and sgRNA targeting DNMT1 (DNMT1 KO).(J) Single
  cell analysis of TP53, MDM2, USP28 and TP53BP1 expression levels in human embryos
  from Zygote to Epiblast and placental cells'
