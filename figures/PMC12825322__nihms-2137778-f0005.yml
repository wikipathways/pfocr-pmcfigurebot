figure_title: Gut microbiota dysbiosis–mediated mechanisms in PNDs.
caption: Gut microbiota dysbiosis–mediated mechanisms in PNDs. Anesthesia and surgery
  induce gut microbiota dysbiosis, characterized by reduced abundance of taxa such
  as Bacteroidales, Mucispirillum, and Clostridiales, and increased abundance of Ruminococcaceae
  and Escherichia-Shigella. These changes are accompanied by elevated proinflammatory
  cytokines and decreased IL-10, as well as metabolic disturbances, including reduced
  short-chain fatty acids, tryptophan, and indole-3-propionic acid, and increased
  kynurenine, valeric acid, and palmitic amide. Through immune, metabolic, and neural
  pathways, these alterations exacerbate neuroinflammation, synaptic damage, and cognitive
  impairment
