figure_title: Schematic representation of the main metabolic pathways of W.
caption: 'Schematic representation of the main metabolic pathways of W. L-W is a natural
  EAA found in human and animal tissues. Dietary L-W is absorbed by the intestinal
  mucosa and circulates in the bloodstream mainly bound and transported by ALB with
  minor values remaining in free form. Three main W pathways are identified: ❶ Quantitatively,
  the Kyn pathway is endowed with the largest representation under the control of
  several rate-limiting enzymes (indoleamine-2,3-dioxygenase, W-2,3-dioxygenase, kyn-3-monooxygenase
  and W-hydroxylase). Most Kyn derivatives may cross the BBB and control brain function,
  degeneration and apoptosis. The conversion of 3-HAA to the neurotoxic QA is implicated
  in deterioration of cognitive functioning and Alzheimer’s disease. ❷ W may be converted
  into 5-HTP and further into 5-OH-tryptamine (serotonine) that take place in both
  the gut and the brain and is stored in the platelets, being involved in vasoconstrictive
  processes and stimulation of smooth muscular cells. Functioning of serotonine is
  depending on a large set of cellular receptors operating in many organs, including
  in cerebral tissues where it may be converted to melatonin in the pineal gland,
  assuming the regulation of circadian rhythms (sleep-wakefulness and light-dark cycles).
  ❸ The intestinal flora metabolizes W to indole and derivatives, including skatole
  and tryptamine. The roles played by these derivatives is the maintenance of intestinal
  immune homeostasis and preservation of microbiota'
