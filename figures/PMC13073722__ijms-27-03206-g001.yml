caption: The figure summarizes major pathological pathways in Alzheimer’s disease
  and their related biomarkers. Amyloid-β alterations (Aβ42, Aβ42/Aβ40 ratio, BACE-1)
  contribute to plaque formation, while increased total and phosphorylated tau promote
  neurofibrillary tangles. Neuroinflammation involves activated microglia and astrocytes,
  indicated by sTREM-2, GFAP, and YKL-40. Synaptic impairment is reflected by neurogranin,
  SNAP-25, and SYT-1, and neuronal damage is marked by elevated NfL and NSE. These
  interconnected processes collectively drive neurodegeneration and cognitive decline
  in AD. The figure is adapted from [29]
