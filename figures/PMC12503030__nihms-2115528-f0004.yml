figure_title: Polarization Pathways of a Naïve Immune Cell.
caption: Polarization Pathways of a Naïve Immune Cell. This diagram highlights the
  molecule cues guiding immune cell polarization. In step 1, differentiation is initiated
  by a specific cytokine. In step 2, cytokine signaling leads to activation of lineage-defining
  transcription factors for Type 1, Type 2, and Type 3 polarization. Finally, in step
  3, each cell type can produce a unique set of effector cytokines based on the polarization
  pathway. Created in Biorender
