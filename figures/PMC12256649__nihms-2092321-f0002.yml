figure_title: Components of keratinocyte apoptosis and necroptosis in SJS/TEN.
caption: Components of keratinocyte apoptosis and necroptosis in SJS/TEN. Clonal expansion
  of LAG3+ skin-resident memory T-cells follows TCR/class 1 MHC interaction with keratinocytes.43
  CD8+ T-cells are also recruited to the epidermis, where interferon-γ is released,
  activating the JAK-STAT Pathway.58 Keratinocyte apoptosis is triggered by CD8+ T
  cells through Fas/FasL interaction, TCR/class I MHC interactions, and TNF-α release.
  Natural killer cells induce apoptosis after HLA-E and CD94/NKG2C interaction, while
  monocytes contribute by releasing annexin A1, which binds to FPR1. Targeted therapies
  include cyclosporine (CD8+ T cells), IVIG (Fas/FasL), etanercept (TNF-α), and JAK
  inhibitors (JAK-STAT pathway). Figure created with BioRender.com. Stevens-Johnson
  Syndrome/Toxic Epidermal Necrolysis; (SJS/TEN), T-cell receptor (TCR); major histocompatibility
  complex (MHC); Janus kinase-signal transducer and activator of transcription (JACK/STAT);
  tumor necrosis factor (TNF); human leukocyte antigen (HLA); formyl peptide receptor
  1 (FPR); intravenous immunoglobin (IVIG)
