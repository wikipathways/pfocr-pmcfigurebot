figure_title: Glycogen breakdown in neurons shunts glucose to the PPP and reduces
  oxidative stress
caption: a, Heatmap of metabolites with significantly (P < 0.05) altered expression,
  compared between GlyPS15A;tauR406W and GlyPWT;tauR406W flies. The green spectrum
  represents upregulated metabolites, and the red represents downregulated metabolites
  in GlyPWT;tauR406W (3 replicates, each with 30 fly heads, were used). b, Quantification
  of ribulose 5-phosphate shows its abundance is higher (P = 0.0409) in GlyPWT;tauR406W
  (green) than in control GlyPS15A;tauR406W (red) flies (3 replicates, each with 30
  fly heads, were used). c, Quantification of acetyl coA shows a reduction (P = 0.0001)
  in GlyPWT;tauR406W fly brains compared with GlyPS15A;tauR406W fly brains (3 replicates
  each with 30 fly heads were used). d, Images show ROS staining by DCFDA in the whole-mount
  brains of GlyPS15A;tauR406W, and GlyPWT;tauR406W flies, with and without 6-AN treatment.
  e, Quantification of fluorescence intensity of DCFDA staining shows a reduction
  (P < 0.0001) in GlyPWT;tauR406W flies (green) (n = 20 brains) compared with GlyPS15A;tauR406W
  (red) flies (n = 19 brains), and the effet was blocked (P < 0.0001) by 6-AN treatment
  (green hatched bar) (n = 22 brains); no such changes were observed in GlyPS15A;tauR406W
  flies with 6-AN treatment (red hatched bar) (n = 20 brains). f, The lifespan is
  extended (P = 0.003270327) in GlyPWT;tauR406W flies (green) (n = 91 flies) compared
  with that of GlyPS15A;tauR406W flies (red) (n = 95 flies); this is abrogated with
  6-AN treatment (green dashed line) (n = 98 flies). No changes were observed in GlyPS15A;tauR406W
  flies with 6-AN treatment (red dashed line) (n = 122 flies). g, Images showing TUNEL
  staining of whole-mount brains of GlyPS15A;tauR406W and GlyPWT;tauR406W flies with
  and without 6-AN treatment. Red dots represent TUNEL-positive cells. h, Quantification
  showing lower (P = 0.0399) numbers of TUNEL-positive cells in GlyPWT;tauR406W flies
  (green) (n = 26) than in GlyPS15A;tauR406W flies (red) (n = 21); the effect was
  blocked (P < 0.0001) by 6-AN treatment (green checkered bar) (n = 29). i, Schematic
  (generated using BioRender) showing that glycogen catabolism induces PPP activation
  and reduces glycolysis and the TCA cycle. Arrows represent altered pathway intermediates
  or enzyme expression. See also Extended Data Figure 4 and Supplementary Data 2 and
  3. *P < 0.05; **P < 0.01; ***P < 0.001; ****P < 0.0001 by two-tailed Student’s t-test
  (b,c); one-way ANOVA with Tukey’s multiple comparison test (e,h); or log-rank test
  (f). Data in bar graphs represent mean ± s.e.m
