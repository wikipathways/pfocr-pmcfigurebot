figure_title: GW8510 exerts a protective effect on expression of genes associated
  with muscle atrophy and development.
caption: 'GW8510 exerts a protective effect on expression of genes associated with
  muscle atrophy and development. (A) Principal component analysis score plot on C2C12
  myotubes stimulated with DEX (10 μM) or vehicle, followed by treatment with GW8510
  (2 μM) or vehicle for 24 h. (B) Overlap between genes down- and upregulated by dexamethasone
  and GW8510. (C) Heatmap of muscle atrophy and development-associated genes, including
  mitochondrial dynamics- (Fis1, Mfn1, Mfn2 and Opa1), antioxidation-related genes
  (Sod2, Sod1 and Cat), myoblast differentiation-related genes (Myf5, MyF6 and Myof),
  mitophagy-related genes (Sqstm1, Pink1, Map1lc3b, Atg12, Atg5 and Bnip4) and denervation-related
  genes (Chrna1, Gadd45a, Ncam1 and Musk). (D) Kyoto Encyclopedia of Genes and Genomes
  pathway enrichment analysis for significantly differentially expressed genes. (E)
  Validation of relative mRNA expression of muscle atrophy- and development-associated
  genes. n=3/group. ##P<0.01 vs. control; **P<0.01 vs. DEX. DEX, dexamethasone; PC,
  principal component; Fis, fission, mitochondrial 1; Mfn, mitofusin; Opa1, OPA1 mitochondrial
  dynamin like GTPase; Sod, superoxide dismutase; Cat, catalase; Myf, myogenic factor;
  Myof, myoferlin; Gadd45a, growth arrest and DNA damage inducible alpha; Ncam, neural
  cell adhesion molecule; Chma, cholinergic receptor nicotinic α; Pink, PTEN induced
  kinase; Sqstm, sequestosome; Map1lc3b, microtubule associated protein 1 light chain
  3 beta; Atg, autophagy related; Bnip, BCL2 interacting protein; Pgc, peroxisome
  proliferator-activated receptor γ, coactivator'
