figure_title: Interconnections of MTL areas in rhesus monkeys
caption: (A) Overview of representative coronal section through the temporal lobe
  at the level of the amygdala shows pathway terminations and projection neurons (white
  label) connected with medial temporal A36 (neural tracer was biotinylated dextran
  amine (BDA cocktail of 3kDA for retrograde and 10kDA for anterograde transport)
  injected in area 36. Magnified boxes (from A) (C-F) Medial A28 is connected with
  A36 via the deep layers, D, shows connections in all layers and progressively in
  the upper layers of more lateral MTL sites. (B) Quantitative analysis shows gradual
  increase of projection neurons in the upper layers (SGI) from medial to lateral
  parts of MTL. Connection data were from 5 cases with retrograde tracer injections
  in areas TE1, TS1/TE1, TS2, TPro, and A36, and were expressed as a function of the
  difference in laminar type with respect to the injection site in each case. (G)
  Projection neurons in the supragranular layers (red dots) and infragranular layers
  (brown dots) mapped in a cross section through MTL show a shift of projection neurons
  from the deep layers in A28, to both superficial and deep layers in adjacent MTL
  A36, and mostly in the upper layers of visual association area TE. The dotted line
  shows the upper part of layer V. ls, lateral sulcus; rs, rhinal sulcus. (A-F, darkfield
  photomicrographs)
