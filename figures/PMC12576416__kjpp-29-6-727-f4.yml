figure_title: PAA alleviated EMT of RTE cells through SPRY2/ERK pathway
caption: '(A) The morphology of the cells was observed through an optical microscope.
  Scale bar = 100 μm. (B) The levels of α-SMA, Vimentin, E-cadherin, collagen I, collagen
  III and Fibronectin1were detected using Western blot. (C) The levels of ZEB-1, Twist,
  Snail and Slug were detected using Western blot. (D-F) The proliferation of HK-2
  and NRK-52E cells was assessed using EdU and CCK-8 assay. Scale bar = 50 μm. (G-I)
  Transwell assay was used to assess the migration and invasion of HK-2 and NRK-52E
  cells. Scale bar = 100 μm. Data are presented as mean ± SD. PAA, Poricoic Acid A;
  EMT, epithelial-mesenchymal transition; RTE, renal tubular epithelial; SPRY2, sprouty
  RTK signaling antagonist 2; ERK, extracellular signal-regulated kinase; α-SMA, α-smooth
  muscle actin; EdU, 5-ethynyl-2-deoxyuridine; CCK-8, Cell Counting Kit-8; OD, optical
  density. *p < 0.05 vs. Control, #p < 0.05 vs. TGF-β1, &p < 0.05 vs. TGF-β1 + PAA
  + si-NC, n = 3'
