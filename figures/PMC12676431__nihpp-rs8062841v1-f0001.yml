figure_title: The molecular signatures of human and ferret cortical oRGs, E-tRGs,
  and T-tRGs
caption: (A) UMAP projection of cross-species scRNA-seq data, colored by cell cluster
  identity. CGE-IN, caudal ganglionic eminence interneuron; MGE-IN, medial ganglionic
  eminence interneuron; EC, endothelial cell; EP, ependymal cells; MG, microglia.
  (B) Enlarged region of (A) displaying RG and IPC subpopulations. (C, D) Heatmap
  showing conserved gene expression patterns across homologous cortical populations
  (oRGs, E-tRGs, T-tRGs) in human (GW22) and ferret (P3) cortices. (E) Model of cortical
  RG differentiation hierarchy showing fRGs as progenitors generating oRGs, E-tRGs,
  and T-tRGs populations during human and ferret corticogenesis. (F) Cortical oRGs
  maintain elevated ERK and PKA pathway activity, whereas E-tRGs display enhanced
  YAP signaling. T-tRGs progressively activate SHH signaling. These distinct cellular
  states are stabilized through mutual inhibition among these signaling pathways
