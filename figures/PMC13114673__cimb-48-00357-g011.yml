figure_title: Proposed mechanism of ferroptosis induction by Eno in combination with
  sorafenib in HCC cells.
caption: Proposed mechanism of ferroptosis induction by Eno in combination with sorafenib
  in HCC cells. The schematic diagram illustrates our model wherein the anti-tumor
  effects of the Eno/sorafenib combination are associated with the modulation of the
  p62/Keap1/Nrf2/HO-1 pathway. The combination treatment down-regulates p62, leading
  to the release of Keap1. The liberated Keap1 then binds and sequesters Nrf2 in the
  cytoplasm, thereby inhibiting its nuclear translocation. This results in the down-regulation
  of key antioxidant proteins, including HO-1, and a reduction in cellular antioxidant
  capacity (e.g., decreased levels of GSH and GPX4). These changes contribute to the
  accumulation of Fe2+ and lipid peroxides (LPO), ultimately triggering ferroptosis
article_title: Enocyanin Synergistically Enhances Sorafenib Sensitivity in Hepatocellular
  Carcinoma via Ferroptosis Induction Associated with p62/Keap1/Nrf2/HO-1 Pathway
  Inhibition
