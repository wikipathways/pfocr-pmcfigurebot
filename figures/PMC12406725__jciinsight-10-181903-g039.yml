figure_title: M2 macrophage–induced GSC invasion is mediated by secreted BIGH3 and
  is associated with active mTOR pathway
caption: '(A and B) GSC-268 invasion assay with 20 ng/mL rhBIGH3 (n = 30 spheres)
  showing (A) quantification and (B) representative phase images. (C and D) GSC-11
  invasion assay with 20 ng/mL rhBIGH3 (n = 33 spheres) showing (C) quantification
  and (D) representative phase images. (E and F) GSC-268 invasion assay with M2 CM
  neutralized with 10 μg/mL IgG (rabbit) or 10 μg/mL anti-BIGH3 (n = 18 spheres) showing
  (E) quantification and (F) representative phase images. (G and H) GSC-268 invasion
  assay with 10 μM mTOR activator MHY1845 (n = 24 spheres) showing (G) quantification
  and (H) representative phase images. (I and J) GSC-268 invasion assay with 20 ng/mL
  rhBIGH3 and 10 μM mTOR inhibitor temsirolimus (n = 30 spheres) showing (I) quantification
  and (J) representative phase images. (K and L) GSC-268 invasion assay with M2 CM
  and 10 μM mTOR inhibitor temsirolimus (n = 21 spheres) showing (K) quantification
  and (L) representative phase images. Spheroid invasion results were pooled across
  at least 2–3 independent replicates. Statistical significance was analyzed using
  an unpaired, 2-sided Student’s t test (A, C, and G) or a 1-way ANOVA followed by
  Tukey’s multiple-comparison test (E, J, and K). ****P < 0.0001. Scale bars: 200
  μm'
article_title: An engineered glioblastoma model yields macrophage-secreted drivers
  of invasion
