figure_title: Molecular effects of estradiol on hepatic lipid metabolism.
caption: 'Molecular effects of estradiol on hepatic lipid metabolism. In males, impaired
  estrogen signaling predisposes to liver disease. Low estrogen worsens hepatic dysfunction
  by affecting glucose metabolism, while supraphysiological estrogen levels can contribute
  to MASLD in individuals with type 2 diabetes (T2D). In females, low levels of circulating
  estrogen are associated with liver issues, including increased fat storage and disruptions
  in glucose and tricarboxylic acid (TCA) cycle pathways. Estrogen replacement therapy
  (ERT) can help restore some of these changes. Abbreviations: ERT, IDH(s), isocitrate
  dehydrogenase(s); MASH, metabolic dysfunction-associated steatohepatitis; MASLD,
  metabolic dysfunction-associated steatotic liver disease; MDH, Malate dehydrogenase;
  MetS, metabolic syndrome; LDL-C, low-density lipoprotein cholesterol; HDL-C, high-density
  lipoprotein cholesterol; PPAR-γ, peroxisome proliferator-activated receptor-γ; GLUT,
  glucose transporter; PDHE1B, pyruvate dehydrogenase E1 beta; PDHE2, pyruvate dehydrogenase
  complex subunit E2. This figure was adapted and simplified from [62]'
