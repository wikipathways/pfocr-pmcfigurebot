caption: TT-55 upregulates the Nrf2/HO-1 signaling pathway to inhibit LPS-induced
  inflammatory cytokine and ROS expression in RAW264.7 cells. (A,B) Flow cytometry
  analysis of TT-55’s effect on LPS-induced ROS in RAW264.7 cells under Nrf2 pathway
  inhibitor treatment. (C–F) TT-55 modulates LPS-induced inflammatory cytokines (IL-18,
  TNF-α, IL-1β, IL-6) in RAW264.7 cells under Nrf2 pathway inhibitor treatment, as
  assessed by ELISA. Each experiment was independently performed in triplicate at
  minimum, and all results are presented as mean ± standard deviation. * p < 0.05,
  ** p < 0.01, *** p < 0.001, and **** p < 0.0001 compared with the LPS group
