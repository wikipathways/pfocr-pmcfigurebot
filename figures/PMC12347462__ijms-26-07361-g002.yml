figure_title: FGF3 induces the repulsion of TCA growth cones by PC-PLC signaling pathway.
caption: 'FGF3 induces the repulsion of TCA growth cones by PC-PLC signaling pathway.
  (A–B’) A FGF3 bead placed 25–50 µm away from the growth cone extending from a 24
  h old thalamic explants for 3 h, with or without inhibitor (such as D609) in the
  media. (C,D) Phase micrographs of a representative growth cones in control media
  at t = 0 min (C), and after 3 h in the presence of an FGF3 gradient (D). (E,F) Trajectories
  of growth cones at t = 0 min (E), and at t = 3 h in 10 µM D609-supplemented media
  (F). (G,H) Growth cones prior to applying the FGF3 beads (t = 0 min) in control
  media (G), and growth cones 3 h after continuous exposure to FGF3 in the presence
  of 10 µM U73122 (H). (I) Differences in mean turning angles for distinct groups.
  (J) A schematic diagram showing the placement of FGF3 beads to the growth cones.
  ***: p < 0.001; asterisk: the implanation of FGF3 beads; scale bars = 25 µm'
