figure_title: Stepwise cellular transformation of GK, EPI and FIB cells under EtOH
  and “+EMT”-stimulation.
caption: Stepwise cellular transformation of GK, EPI and FIB cells under EtOH and
  “+EMT”-stimulation. From left to right, the scheme depicts progression from GK (immortalized
  parental cells) to EPI (epithelial phenotype) and FIB (fibroblastoid/mesenchymal
  phenotype). For each condition (EtOH, +EMT, EtOH + EMT), characteristic changes
  in morphology, marker expression, metabolism and cell behavior are summarized. Hallmark
  alterations across the axis include decreased E-cadherin/CDH1, increased Vimentin,
  elevated Hippo pathway proteins, higher ROS and L-lactate levels, cell-shape changes
  (rounding, dendritic processes) and increased migration and proliferation. In FIB
  EtOH Ko cells under “+EMT” conditions, features consistent with a beginning MET
  are observed. EtOH = ethanol; EMT = epithelial-to-mesenchymal transition; MET =
  mesenchymal-to-epithelial transition; ROS = reactive oxygen species; HPV = human
  papillomavirus. Created in Biorender. Steinberg, T. (2025) https://BioRender.com/sglefuz
