caption: Schematic model of the molecular cascade triggered by pds knockout. Loss
  of carotenoids leads to plastid dysfunction, ROS accumulation, and impaired retrograde
  signaling. These changes trigger nuclear gene reprogramming, with suppressed photosynthesis
  and activated stress-response pathways, ultimately resulting in the albino phenotype.
