figure_title: Prenatal arsenic exposure and gene expression changes in fetal organs
caption: 'Graphical abstract: Female C57BL/6 J mice were exposed to inorganic arsenic
  (iAs) in drinking water during pregnancy, followed by tissue collection at gestation
  day (GD) 18 from fetal liver, heart, lung, and placenta. Gene expression was assessed
  using RT-qPCR and untargeted Agilent 44 K microarray profiling, with downstream
  bioinformatics and network/pathway enrichment analyses (STRING queried and visualized
  in Cytoscape). Prenatal arsenic exposure resulted in differential mRNA expression
  across all organs, with 251 altered genes in liver, 165 in placenta, 158 in heart,
  and 41 in lung compared with controls. Altered pathways were predominantly immune-related,
  and placentas from male fetuses showed reduced expression of guanylate-binding protein
  3 (Gbp3) expression in placenta (p = 0.0237) when comparing male arsenic-exposed
  placentas to controls'
