figure_title: Differential transcriptional responses to GluD1 deletion across brain
  regions.
caption: 'Differential transcriptional responses to GluD1 deletion across brain regions.
  (A) Principal component analysis (PCA) of transcriptome shows clustering by different
  regions. Each data point represents one replicate. (B) Volcano plots show all regulated
  genes for each region. The horizontal axis refers to the threshold of statistical
  significance with the log, while the vertical axis refers to the threshold of the
  differential expressed ratio. (C) Histogram representing the number of significant
  differentially expressed genes (DEGs) in four brain regions. (D) UpSet plot of unique
  genes affected in each brain region by analyzing the degree of overlap between the
  DEGs. The number of DEGs from each brain region is represented by the histogram
  on the left (0–1885 range). A single dot indicates no overlap with any other groups.
  Dots with connecting lines indicate one or more overlaps of DEGs between brain regions.
  The number of overlapping DEGs between groups is shown above each intersection.
  Cx: cortex, Cb: cerebellum, Hi: hippocampus, St: striatum. (E–H) Kyoto Encyclopedia
  of Genes and Genomes (KEGG) pathway enrichment analysis of significant DEGs based
  on their molecular functions (MFs) in the cerebellum (E), cortex (F), hippocampus
  (G), and striatum (H)'
article_title: Deletion of Glutamate Delta 1 Receptor Leads to Heterogeneous Transcription
  and Synaptic Gene Alterations Across Brain Regions
