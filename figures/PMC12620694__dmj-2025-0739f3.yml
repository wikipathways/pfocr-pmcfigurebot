figure_title: Clinical pathway for comprehensive assessment and specialist referral.
caption: 'Clinical pathway for comprehensive assessment and specialist referral. Flowchart
  depicting the proposed clinical decision-making process. Comprehensive assessment,
  including medical history, physical examination, and laboratory tests, feeds into
  two parallel evaluation pathways: pathophysiology-based grading (insulin deficiency
  and insulin resistance) and complication-based staging (atherosclerotic cardiovascular
  disease [ASCVD], heart failure [HF], chronic kidney disease [CKD], retinopathy,
  and neuropathy). Patients with a metabolic grade ≥3 or a complication stage ≥3 are
  classified as having severe diabetes mellitus. For these patients, a secondary assessment
  determines the need for specialist referral, guided by two key factors: difficulty
  in glycemic control (hyperglycemia, catabolic features, hypoglycemia, and high glycemic
  variability) and evidence of disease progression (glycemic deterioration and complication
  progression). Significant challenges in either area warrant referral to an endocrinologist
  or diabetes specialist'
article_title: 'Defining Severe Diabetes Mellitus: A Consensus Framework for Grading
  and Staging Diabetes Based on Pathophysiology and Complications'
