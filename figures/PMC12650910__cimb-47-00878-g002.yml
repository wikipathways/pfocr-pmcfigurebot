figure_title: A schematic representation of OV transgenic signaling pathways.
caption: A schematic representation of OV transgenic signaling pathways. The interaction
  of OV transgenes is the theoretical basis for antitumor immune activation. We draw
  a schematic diagram of the most classical genes mentioned in this review and their
  correlation with each immune cell. GM-CSF could activate M1-like macrophage polarization,
  CD8+ T-cell reinvigoration, and upregulate IL-12R on DCs. S100 calcium-binding protein
  A1 (S100A1) is a key upstream regulator of the GM-CSF axis. IL12 and IL15 are important
  antitumor immune cytokines, which activate TH1 cells, NK cells, and CD8+ T cells,
  and they play an antitumor immune killing role through the IFNγ signaling pathway.
  PD-1 and CTLA4 are also commonly used transgenes that enhance the synergistic effect
  of OV in combination with ICI agents
