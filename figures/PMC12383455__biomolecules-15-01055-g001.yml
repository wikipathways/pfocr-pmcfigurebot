figure_title: Biological pathways and structures of PDVLNs.
caption: 'Biological pathways and structures of PDVLNs. Three pathways generate PDVLNs:
  (1) EXPOs merge with the PM, releasing vesicles to the cell wall. (2) MVB matures
  to form ILVs, aided by (2a) fungal infection, (2b) plant–microbe symbiosis, or (2c)
  direct fusion with the PM, releasing ILVs as PDVLNs. (3) MVBs fuse with vacuoles,
  which then fuse with the PM, releasing ILVs. Created in Biorender. Wang, Q. (2025) https://BioRender.com/wmt01v9'
