figure_title: Key surgical procedures in vestibular schwannoma resection via retrosigmoid
  approach.
caption: 'Key surgical procedures in vestibular schwannoma resection via retrosigmoid
  approach. A : Tumor exposure and intracapsular debulking using ultrasonic aspirator.
  B : Internal auditory canal unroofing with high-speed diamond drill (depth=5 mm),
  demonstrating intracanalicular tumor portion adjacent to facial and cochlear nerves.
  C : Microneurolysis of cranial nerve VII-VIII complex at brainstem interface using
  combined sharp and blunt dissection techniques (arrow indicates arachnoid plane
  preservation). D : Post-resection neurovascular anatomy demonstrating integrity
  of cochleovestibular nerve, facial nerve, and trigeminal nerve with characteristic
  nerve thinning due to tumor compression (endoscopic panoramic view). E : Intraoperative
  neuromonitoring of facial nerve function using bipolar stimulator (suction device
  at left). F : Brainstem exit zone stimulation with monopolar probe verifying functional
  continuity of facial nerve pathway'
