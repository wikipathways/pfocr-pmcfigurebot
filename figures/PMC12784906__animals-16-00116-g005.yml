caption: 'WGCNA identifying associations between blood DEGs and serum biochemical
  parameters. (A) Heatmap displaying correlation coefficients between 25 co-expression
  modules (rows) and 13 serum biochemical parameters (columns). In each cell, the
  upper value represents the correlation coefficient, and the lower value represents
  the corresponding significance level (p-value). The color gradient ranges from blue
  (negative correlation) to red (positive correlation), with intensity reflecting
  the strength of the correlation. (B) GO enrichment analysis of genes within Modules
  3 and 8. Dot size is proportional to the number of genes annotated to each GO term,
  while dot color denotes the GO category: Biological Process (BP, purple), Cellular
  Component (CC, grey), and Molecular Function (MF, blue). (C) KEGG pathway enrichment
  analysis for Modules 3 and 8. Dot size reflects the number of genes enriched in
  each pathway. Dot color indicates statistical significance, ranging from yellow
  (lower significance) to dark purple (higher significance)'
