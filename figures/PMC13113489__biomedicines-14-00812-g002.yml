figure_title: Autophagy is dynamically regulated during cortical development.
caption: 'Autophagy is dynamically regulated during cortical development. (A) Heatmap
  showing the scaled expression of 274 autophagy genes divided into five clusters
  (numbered 1 to 5). It visually represents gene expression levels across different
  developmental stages: E16 (embryonic day 16.5), P5 (postnatal day 5), and P10 (postnatal
  day 10). (B) Dot plot of Gene Ontology (GO) enriched pathway analysis in developing
  cortices, indicating the top 30 most enriched pathways. The graph highlights that
  different biological processes drive the signature of each cluster'
article_title: Combined Transcriptomic and Proteomic Profiling Uncovers Developmental
  Dynamics of Autophagy in the Cortex
