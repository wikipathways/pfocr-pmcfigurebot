figure_title: Deletion of miR147 disrupts immune signaling pathways in the intestine
caption: |-
  Total RNA was purified from isolated intestinal epithelial cells (IECs) derived from iR147fl/fl
  Villin Cre+ and Villin Cre+ mice (n = 3 per group) treated with 3% DSS for 5 days followed by 1 day of water. RNA-seq was performed and analyzed at the UT Health Science Center Cancer Genomic Core. (A) Heatmap of downregulated and upregulated genes across each group of 3 mice. (B) Volcano plot of the top 100 differentially expressed genes (DEGs), based on adjusted P value and log2(fold change), between the 2 groups. Red dots represent genes expressed at higher levels in miR147fl/fl
  Villin Cre+ mice; blue dots represent genes with higher expression levels in Villin Cre+ mice. The x axis represents log2(fold change); the y axis represents statistical significance (–log10
  Padj) for each gene, analyzed by DESeq2. The volcano plot was generated using GraphPad Prism version 10.1.1. (C) Gene ontology (GO) enrichment analysis of DEGs retrieved using DAVID (https://david.ncifcrf.gov/). The top 30 most enriched GO terms in the biological process, molecular function, and cellular component categories are presented. All adjusted statistically significant values of the terms were –10-base log transformed. (D) Bar graph showing the top genes, based on log2(fold change), related to the type I interferon pathway in the miR147-deficient intestinal epithelium, analyzed by DESeq2
