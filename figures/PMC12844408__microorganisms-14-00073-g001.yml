figure_title: Translocation pathways of gut microbiota and metabolites across the
  intestinal barrier.
caption: Translocation pathways of gut microbiota and metabolites across the intestinal
  barrier. This schematic illustrates key components of the gut–liver axis. Under
  physiological conditions, microbial metabolites (e.g., SCFAs can be selectively
  transported across the intact epithelium (represented by enterocytes and tight junctions)
  into the portal circulation, contributing to host metabolism and immune homeostasis.
  Under pathological conditions (e.g., barrier dysfunction represented by disrupted
  architecture), an increased translocation of microbes, their structural components
  (e.g., LPS), and other metabolites occurs, potentially driving systemic inflammation
  and liver disease. The figure lists representative bacterial genera and metabolites
  involved in these processes, highlighting the continuum from homeostasis to dysbiosis
