figure_title: Defects in mitochondrial biogenesis and mitochondrial dynamics
caption: '(A) Unsupervised hierarchical clustering (Euclidean) heatmap of DEGs (FDR
  < 0.05) in the Hallmark PPAR signaling pathway and MitoCarta gene sets (row-normalized
  z-score) by popRNA-Seq demonstrates downregulation in AT2I73T cells at days 3 &
  14 after tamoxifen induction (n = 4 mice per I73T time point, n = 8 WT mice). (B)
  Western blot of phosphorylated and total PGC1α (n = 3 biological replicates). (C)
  Time-dependent reduction in mtDNA copy number in AT2I73T (n = 3 mice for WT, n =
  10 mice for day 7, n = 7 mice for day 14, n = 4 mice for day 28). (D) Unsupervised
  hierarchical clustering (Euclidean) heatmap of differentially expressed mtDNA genes
  by popRNA-Seq shows decreased expression in AT2I73T cells at day 14 (n = 4 mice
  per I73T time point and n = 8 WT mice). (E) Flow cytometry analysis of mitochondrial
  membrane potential (ΔΨm) demonstrates a time-dependent reduction in tetramethylrhodamine,
  methylester, fluorescence in AT2I73T cells (n = 4–5 mice per condition). Box plots
  show the interquartile range, median (line), and minimum and maximum (whiskers).
  (F) Measurement of oxygen consumption rate (OCR) shows a time-dependent reduction
  in basal and maximal uncoupled mitochondrial respiration and spare respiratory capacity
  in AT2I73T cells (n = 4–9 mice per condition). (G) Representative transmission electron
  microscopy (TEM) images of murine AT2 cells from whole lung mounts. Scale bars:
  600 nm. (H) MitoTracker staining of murine AT2 cells after 18 hours in culture shows
  altered mitochondrial network morphology in AT2I73T versus AT2WT cells. Scale bars:
  10 nm. (I) Quantification of mitochondrial structure in AT2 cells using ImageJ (NIH)
  Mitochondrial Analyzer shows increased fragmentation, decreased branch length, and
  altered shape in AT2I73T cells (each point is an average of 1 field of view containing
  a minimum of 10 cells; cells were isolated and cultured from n = 4 mice per condition
  and 5–6 fields were quantified). (J) Western blot and densitometric quantification
  (n = 3 biological replicates) of mitochondrial dynamics proteins demonstrates altered
  regulation of dynamics and mitophagy in AT2I73T cells. All mean± SEM. *P < 0.05,
  **P < 0.005, ***P < 0.0005, ****P < 0.00005 by ordinary 1-way ANOVA'
