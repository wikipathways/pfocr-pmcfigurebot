figure_title: Sexually dimorphic expression of KDM6A in human microglia and disease-related
  changes in the microglial transcriptome during MS
caption: (A) Expression of KDM6A in microglia from women compared with microglia from
  men with MS (one-way ANOVA, **P < 0.01). (B) Numbers of differentially expressed
  genes in microglia comparing MS with healthy controls (NL). (C) GO enrichment analysis
  of up-regulated genes (FDR < 0.1 and logFC > 0.5) in microglia of women with MS
  compared with healthy women. Human brain microglial data from UCSC Cell Browser
  (https://cells.ucsc.edu/?ds=ms). (D) Heatmaps of immune effector process pathway
  genes. Arrows indicate the genes with KDM6A binding identified by mouse CUT&RUN
  (CD74, IRF8, KMT2E, LCP1, LITAF, LYST, and RPS19). Unit = z-score
article_title: Deletion of the X-chromosomal gene Kdm6a in microglia of female mice
  ameliorates neuroinflammation and restores translatome profiles
