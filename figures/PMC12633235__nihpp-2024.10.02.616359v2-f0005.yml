figure_title: Deletion of IRE in PFN2–3UTR is associated with decreased Profilin2
  levels, decreased nuclear retention of active beta-catenin, and failure to induce
  T Brachyury
caption: (a) Schematic of beta-catenin signaling pathway showing including cytoplasmic-nuclear
  transit of beta-catenin following activation leading to TCF/LEF target gene transcription
  inducing mesendodermal differentiation. (b) Schematic experimental setup for time
  course collection following addition of CHIR+Activin.(top) Immunoblot analysis of
  active beta-catenin (ABC), total beta-catenin (TBC), and Brachyury (T) protein levels
  in cytoplasmic and nuclear subcellular compartments in wild-type (bottom) and (c)
  PFN2–3UTR ΔIRE mutants over 18 hour differentiation timecourse. Scanned images of
  unprocessed blots are shown in Fig. S4. Protein levels of (d) nuclear active beta-catenin,
  (e) cytoplasmic active beta-catenin, (f) cytoplasmic total beta-catenin, and (g)
  nuclear Brachyury (T), and in wildtype (white) and PFN2–3UTR ΔIRE mutants (red)
  over 18 hour timecourse. (h) Subcellular cytoplasmic and nuclear PFN2 protein by
  ELISA in wild-type (white) and PFN2–3UTR ΔIRE mutants (red) at 6H and 18H timepoints.
  (i) Nuclear PFN2 protein by ELISA in EBD4 lysate from wild-type (white) and PFN2–3UTR
  ΔIRE mutants (red). (h-m) N=3. Error bars represent SEM. *P< 0.05, ****P<0.0001,
  unpaired two-tailed t test
