caption: Comparison of genetic alterations and mitochondrial pathways between precancerous
  conditions and cancer. (A) Chord diagram showing the relationships between mitochondrial-related
  genes (inner ring) and their associated functional alterations (outer ring). The
  connecting bands indicate the key mitochondrial mechanisms identified in precancerous
  lesions—including the Warburg effect, oxidative stress, mtDNA copy number alterations,
  and apoptosis regulation—which mirror those observed in cancer. (B) Schematic illustration
  of the four major mitochondrial mechanisms identified in precancerous lesions. Compared
  with cancer, a significant portion of mitochondrial mechanisms in precancerous diseases
  remains unexplored (gray area)
