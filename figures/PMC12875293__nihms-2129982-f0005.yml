figure_title: Immunomodulatory effects of short-chain fatty acids (SCFAs) within the
  tumor microenvironment (TME).
caption: Immunomodulatory effects of short-chain fatty acids (SCFAs) within the tumor
  microenvironment (TME). SCFAs enhance interleukin-10 (IL-10) production in T helper
  1 (Th1) cells through signal transducer and activator of transcription 3 (STAT3)-
  and mammalian target of rapamycin (mTOR)-mediated upregulation of B lymphocyte-induced
  maturation protein 1 (BLIMP1). In CD8+ T cells, butyrate and pentanoate promote
  IL-12 and IL-2 expression, respectively, via histone deacetylase (HDAC) inhibition.
  Acetate enhances CD8+ T cell responses by downregulating poliovirus receptor (PVR)/CD155
  expression in cancer cells through phosphoinositide 3-kinase (PI3K)–protein kinase
  B (AKT) pathway suppression. SCFAs also induce IL-22 expression in CD4+ T cells
  and innate lymphoid cells (ILCs) through hypoxia inducible factor 1α (HIF1α) and
  aryl hydrocarbon receptor (AhR) activation or via the STAT3–mTOR axis. Although
  butyrate enhances anti-programmed death 1 (PD1) antibody efficacy by modulating
  T cell infiltration, it might impair cytotoxic T lymphocyte-associated antigen 4
  (CTLA4) blockade responses and hinder dendritic cell maturation. Additionally, SCFAs
  contribute to tumor cell apoptosis through multiple mechanisms. Reproduced, from
  Ref. (p40)
