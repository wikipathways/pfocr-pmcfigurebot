figure_title: SnRK1 mediates SA-triggered immunity through NPR1
caption: (A and B) PR1 (A) and WRKY38 (B) expression levels in 3.5-week-old WT, npr1-2,
  sesquiα2-1 and sesquiα2-2 plants 24 h after water or 1 mM SA treatment using RT-qPCR.(C
  and D) Principal component analysis (PCA) (C) and hierarchical clustering (D) of
  gene expression from QuantSeq analysis of 3.5-week-old WT, npr1-2, sesquiα2-1, and
  sesquiα2-2 plants 24 h after treatment with water or 1 mM SA.(E and F) Venn diagrams
  comparing up-regulated (E) and down-regulated (F) differentially expressed genes
  across different genotypes.(G and H) Gene ontology (GO) term analysis of biological
  process (BP) (G) and Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway analysis
  (H) of genes up-regulated only in WT.(I) GO term analysis of BP for genes down-regulated
  only in WT.(J) Basal and SA-induced resistance in WT, sesquiα2-1, sesquiα2-2, and
  npr1-2 plants treated with mock or 1 mM SA 24 h before inoculation with Psm ES4326
  (OD600 = 0.001). Bacterial growth was determined at 3 dpi. n = 8.All data are presented
  as mean ± s.e.m. Individual columns were compared using one-way ANOVA with Tukey’s
  post-hoc (J) and the interactions were tested using two-way ANOVA (A, B, and J).
  *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001. n.s., not significant; different
  lowercase letters indicate statistical significance tested between multiple groups
  by one-way ANOVA at p < 0.05
