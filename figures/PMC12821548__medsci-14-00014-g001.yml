figure_title: Distinct immunopathological pathways leading to synovitis in seropositive
  and seronegative rheumatoid arthritis.
caption: 'Distinct immunopathological pathways leading to synovitis in seropositive
  and seronegative rheumatoid arthritis. Seropositive RA follows an adaptive-immune
  pathway initiated by PAD4-mediated citrullination and ACPA-driven osteoclastogenic
  signalling, leading to T–B cell infiltrates, tertiary lymphoid structures and adaptive
  cytokine production. Seronegative RA is dominated by an innate–stromal pathway involving
  environmental triggers, epigenetic dysregulation, myeloid-cell infiltration, fibroblast
  activation and innate cytokines. Both pathways converge on a shared synovial inflammation
  phenotype. ACPA: anti-citrullinated protein antibodies; FLS: fibroblast-like synoviocytes;
  IL: interleukin; miRNA: microRNA; PAD4: peptidylarginine deiminase 4 refs [17,18,19,20,21,22]'
