figure_title: FOXM1 promotes BUB1 expression at transcriptional level.
caption: 'FOXM1 promotes BUB1 expression at transcriptional level. (A) Venn diagram
  of overlapping genes identified by RNA-seq and FOXM1 PPI network. (B) Analysis the
  association between key gene expression and HCC patient survival. (C) The expression
  of BUB1 between HCC tissues and adjacent tissues from clinical patients analyzed
  by IHC. (D) IHC scores of BUB1 between HCC tissues and adjacent tissues from clinical
  patients. (E) Correlation analysis of BUB1 and Ki-67 IHC scores in tumor tissues
  of patients with HCC. (F) Correlation analysis of BUB1 and FOXM1 IHC scores in tumor
  tissues of patients with HCC. (G) Co-IP analysis of the interaction between FOXM1
  and BUB1 in HUH7 cells. (H) Effects of FOXM1 shRNA and BUB1 shRNA on the expression
  of FOXM1 and BUB1 analyzed by Q-PCR. (I) The expression of FOXM1 and BUB1 analyzed
  by Western blot. (J) ChIP-qPCR analysis of the binding of FOXM1 and BUB1 promoter
  in HUH7 cells. (K) The sequences at the -293 bp of the BUB1-WT promoter and the
  BUB1-Mut promoter. (L) The binding of FOXM1 and BUB1 promoter at the -293 bp sequence
  GTAAACC analyzed by dual luciferase reporter assay. (M) Q-PCR analysis of BUB1 expression
  in different HCC cells. (N) Western blot analysis of BUB1 expression in different
  HCC cells. (O) KEGG pathway enrichment analysis of top 50 targets in the PPI network
  of BUB1. (P) Venn diagram of overlapping genes identified by RNA-seq, FOXM1 PPI
  network, and BUB1 PPI network. (Q) correlation analysis of BUB1 expression and LIHC
  cell stemness in TCGA. (R) Effect of BUB1 on the inhibitory role of FOXM1 shRNA
  in the proliferation of HUH7 cells. (S) Effects of BUB1 on the inhibition of FOXM1
  shRNA in HUH7 colony formation. (T) Effects of BUB1 on the promotion of FOXM1 shRNA
  in HUH7 cell apoptosis. (U) Effects of BUB1 shRNA on HUH7 xenograft tumor volumes.
  (V) Photos of HUH7 xenograft tumors in each group. (W) Effects of BUB1 shRNA on
  HUH7 xenograft tumor weight. (X) Effects of BUB1 shRNA on Ki-67 and BUB1 expression
  in each group. Images were randomly selected from five replicates. Data from three
  independent experiments were analyzed by one-way ANOVA: *P<0.05, **P<0.01 vs. NC
  KD group, #P < 0.05, ##P < 0.01 vs. FOXM1 KD group'
