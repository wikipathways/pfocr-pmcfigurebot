figure_title: Aging disrupts cell-cell communication networks in the killifish kidney
caption: CellChat analysis was performed on single-nucleus RNA-sequencing data from
  kidneys of young and old killifish. (a) Circle plots visualize global intercellular
  communication networks in young (left) and old (right) kidneys. Each node represents
  a cell type, and each connecting line represents a significant interaction, with
  width proportional to communication strength. Cell types of interest are colored,
  and nonrenal cell types are displayed in gray. The total number of interactions
  decreases from 83 in young to 30 in old kidneys. (b) Bar graph shows relative information
  flow of individual signaling pathways in young (yellow) and old (gray) kidney cells,
  highlighting selective retention or loss of pathway activity with age. (c,e) Heat
  maps show outgoing (left) and incoming (right) signaling patterns in (c) young and
  (e) old kidneys. Pathways are sorted by signaling in young kidneys. Aging reduces
  both the diversity and magnitude of signaling activities across cell types. (d,f)
  Sankey plots illustrate dominant outgoing signaling pathways in (d) young and (f)
  old kidney cells, demonstrating diminished pathway complexity and redistribution
  of signaling roles with age. ADGRL, adhesion G protein–coupled receptor L (latrophilin);
  AGRN, agrin; ANGPTL, angiopoietin-like protein; ApoA, apolipoprotein A; CADM, cell
  adhesion molecule; CDH, cadherin; CNTN, contactin; DHEAS, dehydroepiandrosterone
  sulfate; EPHB, ephrin type-B receptor; ESAM, endothelial cell-selective adhesion
  molecule; JAM, junctional adhesion molecule; NCAM, neural cell adhesion molecule;
  ncWNT, noncanonical Wingless-related Int-1; NRXN, neurexin; PAR, protease-activated
  receptor; PDGF, platelet-derived growth factor; PECAM, platelet–endothelial cell
  adhesion molecule; PVR, poliovirus receptor; SEMA, semaphorin; VEGF, vascular endothelial
  growth factor
