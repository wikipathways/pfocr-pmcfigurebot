figure_title: Schematic of the canonical and non-canonical NF-κB pathways
caption: (Adapted from [20]). The canonical pathway (left) is induced by most physiological
  NF-κB stimuli and is represented here by TNF, and IL-1 signaling. Stimulation of
  the corresponding receptor activates the IKK complex (IKKα, IKKβ, and NEMO), leading
  to IκBα phosphorylation in an IKK-dependent manner. This triggers IκBα polyubiquitination
  and degradation, freeing RelA (p65):p50 heterodimer to translocate into nucleus
  and activate target gene expression. The non-canonical pathway (right), induced
  by selective cytokines such as CD40L and BAFF, depends on NIK-mediated activation
  of IKKα. IKKα phosphorylates p100, promoting its partial processing into p52 and
  forming transcriptionally active RelB:p52 complexes that translocate to the nucleus
  to drive target gene expression
