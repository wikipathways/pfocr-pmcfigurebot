figure_title: Upregulation of the plasminogen activator (PA) pathway and matrix metalloproteinases
  (MMPs) in cultured lymphatic endothelial cells (LECs) expressing activating KRAS
  mutations
caption: A, Human dermal (hd) LECs were infected with a lentivirus expressing the
  KRAS-G12D mutation (G12D), or an identical backbone expressing GFP as a control
  vector (GFP), and RNA-sequencing was performed. B, Human dermal (hd) LECs were infected
  with a lentivirus expressing the KRAS-G12D mutation and were treated with DMSO (Veh)
  or trametinib (Tram), a MEK inhibitor, for 16 hours, and RNA-sequencing was performed.
  A-B, Heat maps were generated to assess expression of the PA pathway and MMPs. C-F,
  Human dermal (hd) LECs were infected with a lentivirus expressing the KRAS-G12D
  mutation with a GFP (green fluorescent protein) reporter, or an identical backbone
  overexpressing WT KRAS, or an identical backbone where the KRAS was replaced by
  mCherry as a control vector (CV). C, qRT-PCR (quantitative real-time polymerase
  chain reaction) analysis of mRNA expression of the PA pathway and MMPs. All values
  are mean ± SEM of n=3. Analysis was performed with 1-way ANOVA with the Tukey multiple
  comparison test. D, Western blot analysis of uPAR (urokinase-type plasminogen activator
  receptor) and MMP-14 from protein lysates. β-actin was used as a loading control.
  E, Western blot analysis of MMP-1 and MMP-10 from conditioned media collected after
  hdLECs were incubated for 18 hours with serum-free (SF) media with added plasminogen
  (Plg). F, Gelatin zymography performed with conditioned media collected after hdLECs
  were incubated for 18 hours with serum-free (SF) media with added plasminogen (Plg)
  indicates the presence of activated MMP-2 (64 kDa) and MMP-9 (82 kDa). G, hdLECs
  carrying KRAS-G12V were cultured in 3D collagen matrices under defined serum-free
  conditions in the absence or presence of the indicated concentrations of Plg in
  μg/ml. Cultures were photographed at either 24 or 48 hours of culture to evaluate
  the extent of collagen gel contraction, a measure of collagen type I matrix degradation.
  Arrows indicate fully contracted gels, and arrowheads indicate partially contracted
  gels. H, Quantification of the number of gels that were non-contracted, fully contracted
  or partially contracted at 24 or 48 hours (n=10). I, hdLECs carrying KRAS-G12V were
  cultured in 3D collagen matrices under defined serum-free conditions in the absence
  or presence of Plg at 1.25 μg/ml. The Plg cultures were left untreated or treated
  with 1 μg/ml of the serine protease inhibitor, aprotinin, or the MMP inhibitor,
  TIMP-1 (tissue inhibitor of metalloproteinases-1) at 5 μg/ml. Cells were photographed
  and quantitated (J) for gel contraction at 72 hours (n=3). Scale bars are 500 μm
  for G and I
