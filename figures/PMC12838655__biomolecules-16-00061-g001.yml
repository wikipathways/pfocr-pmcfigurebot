caption: (a) Cutaneous melanin synthesis occurs in the skin, with epidermal melanocytes
  utilizing tyrosine pathways to deliver melanin-filled melanosomes to keratinocytes,
  with increasing levels of melanin deposited at more apical layers to maximize protection
  from UV radiation. This transferred melanin forms a protective shield around the
  keratinocytes’ nuclei to prevent DNA damage. Similarly, bulb melanocytes release
  melanosomes within the hair follicle, determining hair coloration [11]. (b) Conversely,
  melanocytes do not exist in the brain, with neuromelanin synthesized instead within
  neurons (typically catecholamine neurons of the substantia nigra or locus coeruleus)
  through dopaminergic pathways. This neuromelanin is thought to play an important
  role in iron chelation and protection from reactive oxygen species (ROS) damage.
  Dysregulation of neuromelanin function and associated neurodegeneration is considered
  crucial to the development of progressive disorders, including Parkinson’s Disease
  (PD). Created in BioRender. Hatch, K. (2025) https://BioRender.com/lx9p6qb (accessed
  on 15 November 2025)
