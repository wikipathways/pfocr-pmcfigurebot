figure_title: FBLN7 modulates the impaired profibrotic abilities of senescent cardiac
  fibroblasts through the ALK1-Smad1/5/9 pathway.
caption: 'FBLN7 modulates the impaired profibrotic abilities of senescent cardiac
  fibroblasts through the ALK1-Smad1/5/9 pathway. A-B) Representative western blot
  images displaying the levels of p-Smad2, Smad2, p-Smad1/5/9, and Smad1/5/9 proteins
  in cardiac fibroblasts with FBLN7 silencing (siFBLN7) (A), FBLN7 overexpression
  (adFBLN7) (B), and corresponding control cardiac fibroblasts (siNC or adNC) following
  treatment with D-gal or PBS. Quantifications of band intensity are presented on
  the right. C-D) Representative images illustrating the nuclear translocation of
  p-Smad1/5/9 (red) (C) and p-Smad2 (red) (D) in siFBLN7 and siNC cardiac fibroblasts
  after treatment with D-gal or PBS, labeled with Vimentin (green). E) Representative
  western blot images showing the protein levels of p-Smad2, Smad2, p-Smad1/5/9 and
  Smad1/5/9 in D-gal treated cardiac fibroblasts transfected with siNC, siFBLN7, or
  siFBLN7 plus ML347 treatment. Quantifications are displayed on the right. F) Representative
  western blot images showing the protein levels of Collagen I and III, ALK1, α-SMA
  and P21 in D-gal treated cardiac fibroblasts transfected with siNC, siFBLN7, or
  siFBLN7 plus ML347 treatment. Quantifications are displayed on the right. Error
  bars represent the standard error of the mean (SEM). Statistical significance is
  indicated as follows: *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001'
article_title: FBLN7 KO attenuates age-related cardiac fibrosis by promoting TGFBR3/ALK1/Smad1
