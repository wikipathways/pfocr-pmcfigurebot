caption: 'The impact on the pathway after establishing AURKA knockdown/overexpression
  cell lines: (A,B) Immunofluorescence assay to detect the changes in AURKA levels
  after overexpression (A) and knockdown (B) of AURKA. (C–E) Western blotting detected
  protein expression following AURKA knockdown (C, left) and overexpression (C, right).
  (D,E) demonstrate that AURKA processing markedly influences both pathway activation
  and glycolytic enzyme protein expression. Moreover, the plasmid does not have any
  impact on the subsequent experiments. (F,G) The RT-qPCR analysis measured mRNA expression
  levels following both AURKA overexpression (F) and knockdown (G). * p < 0.05, **
  p < 0.01, *** p < 0.001, **** p < 0.0001. The circles on the bar chart represent
  the sample size or the number of repetitions, while the bars represent the mean
  ± SD. n = 3 indicates three repetitions for each group'
