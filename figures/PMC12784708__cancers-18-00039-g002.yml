figure_title: Acquired resistance (A) two modes of acquired resistance.
caption: 'Acquired resistance (A) two modes of acquired resistance. (B) the mechanism
  of acquired resistance. The orange box represents internal factors within the cell,
  while the blue box shows external factors outside the cell. Acquired immune resistance
  to ICIs primarily manifests in two distinct forms: adaptive immune editing-related
  resistance and tumor-intrinsic evolution-driven resistance. In the former, tumors
  initially subjected to ICI-induced immune pressure gradually evade immune elimination
  through mechanisms such as clonal selection, downregulation of MHC-I expression,
  or impaired neoantigen presentation, ultimately developing a novel immune-tolerant
  phenotype, which is characterized by reduced neoantigen load, B2M mutations, MHC
  class I downregulation, and upregulation of immunosuppressive molecules (e.g., TIM-3,
  LAG-3). The latter form arises when tumor cells acquire novel biological properties
  via genetic mutations, signaling pathway reprogramming (e.g., JAK/STAT), or dedifferentiation,
  enabling them to sustain survival and escape immune surveillance despite immune
  attack. Created in https://BioRender.com, accessed on 21 December 2025'
