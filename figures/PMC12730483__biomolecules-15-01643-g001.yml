caption: The diagram summarizes the roles and mechanisms of calycosin in inflammatory
  diseases. Calycosin exhibits multiple pharmacological effects, including anti-inflammatory
  (by inhibiting the NF-κB pathway and NLRP3 inflammasome), antioxidant (by increasing
  antioxidant enzyme levels and eliminating ROS), anti-cancer (by inducing apoptosis
  and inhibiting EMT and cell growth), hepatoprotective (by activating FXR) and immunomodulatory
  (by balancing Treg and Th cell function). Akt—serine/threonine kinase; EMT—epithelial–mesenchymal
  transition; FXR—farnesoid X receptor; GSH—glutathione; HO-1—heme oxygenase-1; IL—interleukin;
  MAPK—mitogen-activated protein kinase; miR—microRNA; NF-κB—nuclear factor kappa-B;
  NLRP3—NOD-like receptor 3; NQO1—NAD(P)H dehydrogenase quinone 1; PI3K—phosphatidylinositol
  three kinase; ROS—reactive oxygen species; SOD—superoxide dismutase; TGF—transforming
  growth factor; Th—T helper; TLR—toll-like receptor; TNF-α—tumor necrosis factor
  α; and Treg—Regulatory T. Green downward arrows indicate reduction
