figure_title: Oxygen-dependent regulation and activation of hypoxia-inducible factor-α
  (HIF-α).
caption: 'Oxygen-dependent regulation and activation of hypoxia-inducible factor-α
  (HIF-α). In the presence of normal oxygen levels (normoxia), HIF-α is rapidly degraded
  through the action of prolyl hydroxylase domain (PHD) enzymes. However, in the hypoxic
  intestinal environment, this degradation pathway is markedly inhibited, allowing
  HIF-α to accumulate and translocate into the nucleus. There, it interacts with the
  histone acetyltransferases CBP and p300, leading to the transcriptional activation
  of a range of target genes. Source: Reproduced from Archontakis-Barakakis, P.; Mavridis,
  T.; Chlorogiannis, D.D.; Barakakis, G.; Laou, E.; Sessler, D.I.; Gkiokas, G.; Chalkias,
  A. (2025) [8]. Intestinal oxygen utilisation and cellular adaptation during intestinal
