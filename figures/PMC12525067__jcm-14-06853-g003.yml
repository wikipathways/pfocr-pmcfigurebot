figure_title: HGF/MET pathway activation according to [141].
caption: HGF/MET pathway activation according to [141]. When hepatocyte growth factor
  (HGF) binds to the MET receptor, it triggers structural alterations that promote
  receptor dimerization and mutual phosphorylation of tyrosine residues within MET’s
  kinase domain, as well as phosphorylation of tyrosines in the C-terminal region.
  These phosphorylated sites serve as anchoring points for various adaptor proteins
  and kinase effectors. Activation of MET subsequently initiates downstream signaling
  cascades, including the MAPK, PI3K/AKT, and STAT3 pathways, which are involved in
  regulating cell growth, survival, movement, and invasive behavior in a MET-dependent
  manner. The MAPK pathway is a signaling cascade that regulates cell growth and survival.
  It is triggered by receptor activation and proceeds through sequential activation
  of RAS, RAF, MEK, and ERK. The PI3K/AKT pathway controls cell survival and metabolism.
  Activation of PI3K leads to the formation of PIP3, which activates AKT, promoting
  anti-apoptotic and growth signals. The STAT3 pathway regulates gene expression.
  STAT3 is phosphorylated, dimerizes, and translocates to the nucleus to activate
  genes involved in proliferation and survival. All abbreviations employed are defined
  in the text in the Abbreviations section
