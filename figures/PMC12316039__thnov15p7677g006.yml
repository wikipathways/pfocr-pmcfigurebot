figure_title: Transcriptomic sequencing analysis of distant tumors after in situ nanovaccine
  treatment.
caption: Transcriptomic sequencing analysis of distant tumors after in situ nanovaccine
  treatment. (A) Volcano plot showing the differentially expressed genes in the AuP(+)/VNPR848
  group compared with the PBS group. (B) Venn diagram of genes co-expressed and exclusively
  expressed in the two groups. (C) Gene ontology analysis of the considerably upregulated
  and downregulated genes in the AuP(+)/VNPR848 group. (D, E) Gene set enrichment
  analysis for antigen processing and presentation (D) and T cell activation (E) signaling
  pathway after AuP(+)/VNPR848 treatment. (F, G) Heatmap of the differentially expressed
  genes related to antigen processing and presentation (F) and T cell activation (G).
  (H) Protein-protein interaction network associated with the antigen processing and
  presentation signaling pathways
