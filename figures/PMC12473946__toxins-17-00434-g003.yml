figure_title: Indolic toxins upregulate IL-8 and MCP-1 by activating the TGFβ non-canonical
  pathway of TGF-β-activated kinase 1 (TAK1).
caption: 'Indolic toxins upregulate IL-8 and MCP-1 by activating the TGFβ non-canonical
  pathway of TGF-β-activated kinase 1 (TAK1). (A) Dysregulated signaling pathways
  determined by analysis of the transcriptomic profile of endothelial cells treated
  for 24 h with indoxyl sulfate compared to control medium. Transcriptomic analyses
  were performed on RNA-Seq data previously published in the NCBI GEO database (https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE132410,
  accession number: GSE132410 accessed on 03 July 2024) by Pei et al. The z-scores
  of adjusted p-values were determined using the Progeny package. IL-8 (B) and MCP-1
  (C) mRNA expression was studied by comparative RT-qPCR after 1 h of preincubation
  with the TAK1 inhibitor 5Z-7-oxozeaenol (OXO) at 10 µM followed by 24 h of stimulation
  with 200 µM indoxyl sulfate (IS) or 50 µM IAA. Data expressed in fold change vs.
  control represent the mean ± SEM of 5 independent experiments for IS and 6 independent
  experiments for IAA. * p < 0.05. IL-8 (D) and MCP-1 (E) mRNA expression was studied
  by comparative RT-qPCR in HUVEC treated for 24 h with 50 ng/mL TGFβ1 ± 200 µM indoxyl
  sulfate (IS) or 50 µM IAA. Data are expressed in mRNA fold change vs. control and
  represent the mean ± SEM of 5 (D) or 6 (E) independent experiments. * p < 0.05,
  ** p < 0.01, *** p < 0.001'
