caption: 'Gene Set Enrichment Analysis (GSEA) and Interaction Networks of Key Genes
  in Diabetic Foot Ulcers. (A,B): Gene Set Enrichment Analysis (GSEA) illustrating
  significant enrichment of gene sets associated with key genes, highlighting pathways
  potentially involved in diabetic foot ulcer pathology. (C): Protein interaction
  network depicting multiple interaction types (e.g., physical interaction, co-expression,
  predicted interaction) among proteins related to key genes. (D): Competitive endogenous
  RNA (ceRNA) network showing interactions involving miRNA (hsa-miR-34a-5p), hub gene
  (TREM2), and related long non-coding RNAs (lncRNAs)'
