figure_title: Relating genetic and physical interactions
caption: (A) Bar charts indicating significant foldenrichment (P < 0.05, hypergeometric
  test) for gene pairs encoding physically interacting proteins (PPI), proteins within
  the same protein complex (Co-complex), proteins within the same pathway (Co-pathway)
  or co-expressed gene pairs among negative (blue) and positive (yellow) genetic interactions.
  Enrichment was measured for all gene pairs, essential gene pairs, pairs of nonessential
  genes associated with a fitness phenotype, and nonessential genes lacking a fitness
  phenotype. Grey bars indicate non-significant enrichment. Genes with roles in mitochondrial-related
  functions were excluded from this analysis. (B) Network of coherent negative (blue)
  or positive (yellow) genetic interactions among genes of the RETROMER, GARP, HOPS
  and COG protein complexes. Node color indicates members of the same protein complex.
  (C) Bar charts depicting the percentage of CORUM protein complexes whose members
  were enriched for any type of genetic interaction (grey), negative (blue) or positive
  (yellow) interactions with each other within (top) or between (bottom) protein complexes.
  Only single complexes and complex-complex pairs with at least 5 tested gene pairs
  were included in the analysis. Genes with mitochondrial-related functions were excluded
  from this analysis. (D) Distribution of complex-complex pairs with respect to between-complex
  genetic interaction purity scores (51). A score of −1 indicates that genetic interactions
  occurring between a pair of protein complexes are exclusively comprised of negative
  interactions whereas a purity score of 1 indicates pairs of complexes connected
  strictly by positive interactions. The dotted grey line indicates the random expectation
  based on purity scores generated by sampling negative/positive interaction signs
  randomly according to a binomial distribution. Genes with mitochondrial-related
  functions were excluded from the analysis
article_title: A global genetic interaction map of a human cell reveals conserved
  principles of genetic networks
