figure_title: Suppression of IL-17A+ γδ T cell is AM-dependent and linked to dampened
  NF-κB and GPR signaling.
caption: Suppression of IL-17A+ γδ T cell is AM-dependent and linked to dampened NF-κB
  and GPR signaling. (A) Schematic diagram of protocol involving treatment with intratracheal
  vancomycin (10 μg/day) treatment for 7 days, following with intranasal clodronate
  (55 μl) administration to deplete AMs and LPS (2 μg/day) stimulation to induce acute
  lung inflammation. Mice were sacrificed one day after the last treatment. (B-F)
  The phenotype of inflammatory responses was elevated. (B) Absolute numbers of AMs
  in lungs (n = 5). (C) Frequency quantification (left) and absolute numbers (right)
  of lung IL-17A+ γδ T cells (n = 5). (D) Representative flow cytometry plots of AMs
  (Gating from CD45+Ly6G-CD64+) and IL-17A+ γδ T cells (Gating from γδ T cells (CD45+CD90.2+TCRγδ+)).
  (E) mRNA expression of Il1b (left) and Il17a (right) in lung homogenates (n = 5).
  (F) Protein levels of IL-1β (left) and IL-17A (right) in BALF (n = 5). (G-J) Bulk
  RNA-seq data from AMs isolated from the BALF of PBS- or vancomycin-treated mice
  following LPS stimulation. (G) Top 20 pathways enriched in KEGG enrichment analysis.
  Barcode plots from GSEA of NF-κB (H) and GPR (I) signaling pathway. (J) Top 20 pathways
  enriched in GO-Molecular Function enrichment analysis. Data are representative of
  2 independent experiments and values are shown as mean ± SEM; p-value were calculated
  by one-way ANOVA (B, C, E, F), the Benjamini-Hochberg method (G, J) or one-sided
  Wilcoxon rank-sum test (H, I). n.s. Not significant. *p < 0.05, **p < 0.01, ***p
  < 0.001, ****p < 0.0001
