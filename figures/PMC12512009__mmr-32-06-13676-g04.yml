figure_title: CXCL8 participates in the EMT process by regulating the expression of
  SNAI2 and ZEB1.
caption: CXCL8 participates in the EMT process by regulating the expression of SNAI2
  and ZEB1. KYSE-150 cells were treated with specified concentrations of rh-CXCL8
  for 24 h, and then (A) mRNA expression of SNAI2, ZEB1, TWIST1, SNAIL, FN1, TWIST2,
  CDH2, VIMENTIN and ZEB2 was detected by RT-qPCR, and (B) protein expression of SNAI2
  and ZEB1 was detected by western blotting. (C) KYSE-150 and TE-1 cells were treated
  with specified concentrations of rh-CXCL8 for 24 h and the protein expression levels
  of EMT-related pathway genes were examined by Western blot assay. (D) KYSE-150 and
  TE-1 cells were treated with 10 ng/ml rh-CXCL8 for indicated times, and the protein
  expression of SMAD2/3 and p-SMAD2/3 was detected by Western blot assay. All data
  are expressed as mean ± SD, n=3/group. *P<0.05 vs. 0 ng/ml rh-CXCL8-treated group
  or rh-CXCL8-treated 0 h group. n.s., not significant; rh-CXCL, recombinant human
  C-X-C motif chemokine ligand; EMT, epithelial-mesenchymal transition
