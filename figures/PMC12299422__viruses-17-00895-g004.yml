caption: 'Cluster 2 characterization, assignments, and gene network analysis: (A)
  circos plot showing significant genes in Cluster 2 as per Bonferroni-adjusted p
  values and pathway assignment visualization; (B–G) networks established by genes
  assigned to each significant pathway in Cluster 2, with connectors indicating interactions
  based on activation, binding, catalysis, inhibition, and reaction. Pink nodes indicate
  genes with increased fold change (FC), and blue nodes indicate decreased FC in relation
  to average expression; (B) ribosome pathway gene interactions; (C) neurodegeneration;
  (D) metabolic pathways; (E) thermogenesis; (F) neutrophil extracellular trap formation
  pathway; (G) oxidative phosphorylation; (H) circos plot showing significant molecular
  processes in Cluster 2; (I) gene network analysis for non-pathway overlapping genes
  assigned to structural molecular activity and nucleic acid binding; (J) Clusters
  2 and 10 signature overlap, and representation of dark dots indicating HIV Gag-Pol-Env-positive
  events occurring in U1 cells, and their directional phenotypic intersect, indicating
  dominant Cluster 2 patterns; and (K) map of merged Clusters 2 and 10 unique to U1
  latent cells and their pattern suppression in response to DA'
