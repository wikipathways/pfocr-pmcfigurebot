figure_title: Characterization of DapY enzyme function
caption: 'a, Ion-count normalized multiple ion chromatograms showing new products
  of TfDapY. The five highest abundance masses in the expected isotopic envelope were
  extracted for each analyte. b, 1H-1H TOCSY correlations for amidine protons in the
  Miz spin system. c, 1H-1H TOCSY and 1H-1H NOESY correlations for assignment of Diz
  residue. d, Marfey’s analysis of Diz residue. Predicted hydrolysis products for
  Diz residue and HPLC chromatograms (340 nm) are shown. e, Full structure(s) for
  Miz- and Diz-modified peptide products of the daptide pathway. Abbreviations: Dap,
  1,2-diaminopropane; Miz, 4-methylimidazoline; Diz, 3,4-dimethylimidazoline; Mmp,
  monomethyl-1,2-propanediamine'
