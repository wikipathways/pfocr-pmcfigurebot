figure_title: Transcriptomic alterations in the appendix of the aged population.
caption: Transcriptomic alterations in the appendix of the aged population. (a) Volcano
  plot illustrating DEGs between geriatric and adult population; (b) GO enrichment
  bubble plot showing upregulation of specific gene signatures between geriatric and
  adult population for GO category Biological Processes (BPs); cellular compartment
  (CC) and molecular function (MF); (c) heatmap of specific genes related to drug
  detoxification, oxidative stress protection, and gut homeostasis upregulated in
  the geriatric population; (d) GO enrichment analysis showing downregulation of specific
  BPs in the geriatric population; (e) heatmap depicting specific ion channel genes
  downregulated in the geriatric population; (f) volcano plot for specific gene markers
  of neuronal, epithelial, and muscle cells; (g) KEGG pathway analysis of upregulated
  and downregulated processes in geriatric population; (h) heatmap illustrating the
  decreased expression of specific gene sets in the neuroactive ligand–receptor interactions
  pathway; (i) heatmap of neuroactive ligand receptors; (j) heatmap demonstrating
  the top 10 most significantly upregulated and downregulated DEGs in the geriatric
  population (FDR < 0.01). Numbers on heatmaps denote values out of legend range
