figure_title: A comprehensive depiction of the cellular mechanisms through which propofol
  attenuates microglial activation and neuroinflammation in the context of ischemic
  stroke.
caption: A comprehensive depiction of the cellular mechanisms through which propofol
  attenuates microglial activation and neuroinflammation in the context of ischemic
  stroke. Propofol exerts its neuroprotective effects via multiple molecular targets
  and signaling pathways, including the modulation of the PI3K/Akt cascade, inhibition
  of NOX, downregulation of TLR4 and Cx43, and activation of the JAK1/STAT3 pathway.
  It also regulates miRNA-mediated signaling, particularly the miR-155/SOCS1 and miR-221/222–IRF2
  axes. Additional mechanisms include the suppression of the NF-κB/HIF-1α pathways,
  reduction in EV release, attenuation of oxidative stress via decreased ROS, and
  maintenance of intracellular Ca2+ homeostasis. Created with BioRender.com (URL accessed
  on 25 April 2025)
