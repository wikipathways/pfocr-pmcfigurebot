figure_title: The TG2/LRP1 pathway allows simultaneous receptor-mediated endocytosis
  and deamidation of antigenic gluten peptides
caption: (A) Transglutaminase 2 (TG2) catalyzes deamidation of selected Gln (Q) residues
  in its substrates via a 2-step mechanism. In the first half-reaction, the thiol
  (SH) functional group of a Cys residue in the active site of TG2 forms a covalent
  thioester intermediate with the reactive Gln residue, resulting in the release of
  an ammonium (NH4+) ion. The second half-reaction involves hydrolysis of this thioester
  intermediate resulting in a net conversion of the Gln residue into a Glu (E) residue.
  Alternatively, if a suitable primary amine is available, the thioester intermediate
  can undergo aminolysis in the second half-reaction, leading to formation of an isopeptide
  bond (not shown). (B) On the surface of certain antigen-presenting cells, catalytically
  active TG2 (blue) captures gluten antigens (green) as their corresponding thioester
  intermediates (black). However, before the thioester intermediate can undergo hydrolysis,
  it is recognized by the low-density lipoprotein-related protein 1 (LRP1) receptor
  on these antigen-presenting cells. Binding to LRP1 stabilizes the transient enzyme-substrate
  complex while activating receptor-mediated endocytosis. The TG2-bound thioester
  is released and hydrolyzed in the acidic environment of endosomes, leading to endosomal
  delivery of the deamidated gluten peptide (red). Once in the lysosome, the deamidated
  gluten peptide is loaded into the antigen binding pocket of HLA-DQ2 while the TG2
  protein is degraded
article_title: A dendritic cell population responsible for transglutaminase 2–mediated
  gluten antigen presentation in celiac disease
