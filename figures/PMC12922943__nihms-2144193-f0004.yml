figure_title: Renal clearance of GS-AuNPs and GC-AuNPs.
caption: 'Renal clearance of GS-AuNPs and GC-AuNPs. (A) Continuous fluorescence imaging
  of mouse bladder for 30 min p.i. of GS-AuNPs and GC-AuNPs showing the renal clearance
  pathway. Both GS-AuNPs and GC-AuNPs were eliminated by the kidneys into the bladder.
  Ex/Em: 470/830 nm. (B) Quantification of the bladder intensity in (A). N = 4 mice
  for each group in (A) and (B). (C) Quantification of the amount of AuNPs in urine
  collected in 24 h p.i. N = 3 mice for each group. Data are presented as mean ± s.d.
  and two-sided Student̀s t test was performed at the 0.05 significance level in (B)
  and (C)'
article_title: 'pH-Responsive Self-Assembly of Renal-Clearable Nanoparticles in the
  Kidneys: One Assembly per Endosome'
