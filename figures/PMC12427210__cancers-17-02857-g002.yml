figure_title: Multi-cohort analysis of sex, survival, and age in relation to CK2α
  expression in CRC.
caption: 'Multi-cohort analysis of sex, survival, and age in relation to CK2α expression
  in CRC. In all panels, dots refer to individual patients. Clinical and proteomic
  data was sourced from either Clinical Proteomic Tumor Analysis Consortium (CPTAC)
  PanCan [22,23] colon cancer patients or colorectal cancer patients from study by
  Li et al., 2023 [24]. For CPTAC cohort, normalized CK2α protein expression (T-N)
  was compared between male and females in relation to (A) CK2α-High and CK2α-Low
  intensities and (B) survival. Light pink = Female CK2α-Low, Dark pink = Female CK2α-High,
  Light blue = Male CK2α-Low, Dark blue = Male CK2α-High. Then tumor intensity levels
  (T) were assessed for correlation with (C) age. Pink and blue lines refer to the
  respective linear regression performed with the correlation analysis. Likewise,
  CK2α levels of Li et al.’s cohort were compared based on (D) sex (Pink = Female,
  Blue = Male) and (E) age of patients. Light pink = Female < 50, Dark pink = Female
  ≥ 50, Light blue = Male < 50, Dark blue = Male ≥ 50. Protein expression was plotted
  as log of CK2α value in tumor tissue (T). (F) Both cohorts were used to find correlations
  between CK2α protein levels and estrogen receptor signaling pathway, menopause,
  and aging-related proteins. Matrix heatmap values are shown for those proteins which
  were statistically significant and correlated in same direction. Error bars represent
  mean ± SEM. Panel A shows results of statistical comparisons made with Mann–Whitney
  test. Panel B shows results of comparison of overall survival in CK2α-High males
  and CK2α-High females using log-rank Mantel–Cox test. Number of patients at risk
  is shown on x-axis below. Panels C and F show correlations determined using Spearman
  Rho (R) rank correlation method. To obtain results in panels D and E, data was log-transformed,
  and statistical comparisons were made with Student’s T-test. p-values: p < 0.05
  = *, p < 0.01 = **'
