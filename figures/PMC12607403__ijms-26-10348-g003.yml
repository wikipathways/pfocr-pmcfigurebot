figure_title: Cytoskeletal dynamics in adrenocortical carcinoma (ACC) cell invasion
  and proliferation.
caption: Cytoskeletal dynamics in adrenocortical carcinoma (ACC) cell invasion and
  proliferation. This figure schematically represents the involvement of cytoskeleton-actin
  binding proteins in ACC behaviour. The nuclear receptor steroidogenic factor 1 (SF-1),
  overexpressed in ACC, transcriptionally induces the nucleotide exchange factor VAV2.
  Once in the cytoplasm, VAV2 activates Rac1 and Cdc42, which drive lamellipodia and
  filopodia formation, respectively, promoting cell motility and invasion. In addition,
  VAV2 is associated with increased cell proliferation. The actin-binding protein
  fascin-1 (FSCN1) expression is regulated by β-catenin and is required for SF-1/VAV2-driven
  cell invasion. In more detail, FSCN1 stabilizes the protrusive structures, increasing
  invasiveness, and is associated with an increase in cell proliferation. The hypermethylation
  of the RASSF1A promoter reduces its expression and ability to stabilise microtubules
  and control mitotic spindle dynamics, resulting in a rise in cell proliferation,
  motility, and invasiveness. The expression of the actin-binding protein filamin
  A (FLNA) is downregulated in the majority of ACC. When present, FLNA binds both
  IGF1R and IR with a downregulation of the ERK pathway, reducing IGF2-mediated cell
  proliferation
