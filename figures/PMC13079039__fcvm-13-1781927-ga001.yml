figure_title: mtDNA Mutations Disrupt Mitochondrial Pathways and Drive Heart Failure
  Progression.
caption: mtDNA Mutations Disrupt Mitochondrial Pathways and Drive Heart Failure Progression.
  This illustrated summary outlines a causal framework for the progression of cardiac
  dysfunction and heart failure caused by pathogenic mitochondrial DNA (mtDNA) mutations.
  Pathogenic mitochondrial DNA mutations (e.g., point mutations or large deletions)
  impair the assembly and activity of oxidative phosphorylation (OXPHOS) complexes
  I/III, leading to defects in electron transport, reduced ATP production, and impaired
  energy supply to the heart. Simultaneously, abnormal complex formation affects the
  stability of the supercomplex, thereby disrupting the inner mitochondrial membrane
  structure and cristae. Inefficient electron transport causes electron leakage and
  excessive reactive oxygen species (ROS) generation, triggering oxidative stress
  and damaging mtDNA. Persistent respiratory chain dysfunction, decreased electron
  transport efficiency, and ROS accumulation alter mitochondrial membrane permeability,
  allowing damaged mitochondria to release mtDNA fragments into the cytoplasm. Cytoplasmic
  mitochondrial DNA functions as a danger-associated molecular pattern (DAMP), activating
  the cGAS–STING signaling pathway and downstream type I interferons and inflammatory
  responses. The combined effects of energy deficiency, oxidative stress, and innate
  immune activation promote cardiomyocyte apoptosis, adverse cardiac remodeling, and
  persistent systolic dysfunction, ultimately leading to the occurrence and development
  of heart failure. This comprehensive framework considers mitochondrial DNA mutations
  as initiating factors, which, through some mechanism, link the loss of mitochondrial
  bioenergy with inflammatory signaling and heart disease
