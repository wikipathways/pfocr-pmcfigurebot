figure_title: KAT5 functions in the same pathway as EP400 to prevent CENP-A mislocalization
caption: (A) Representative chromosome spread images showing CENP-A localization at
  centromeric and non-centromeric regions in DMSO or TH1834-treated RPE1Tet-GFP-CENP-A
  cells. Scale bars, 15 μm; insets, 1 μm.(B) Quantification of CENP-A signal intensity
  at centromeric and non-centromeric regions in DMSO- or TH1834-treated cells.(C)
  Representative chromosome spread images showing CENP-A localization at centromeric
  and non-centromeric regions in siNEG, siEP400, and/or siKAT5-transfected cells.
  Scale bars, 15 μm; insets, 1 μm.(D) Quantification of CENP-A signal intensity at
  centromeric and non-centromeric regions in conditions, as mentioned in (C). Mean
  value is depicted for each condition.(E) Immunoblot analysis of EP400 and H4K12ac
  levels in the chromatin and soluble fractions from the indicated conditions. GAPDH
  and H4 served as loading controls for soluble and chromatin fractions, respectively.(F)
  Quantification of levels of chromatin-associated H4K12ac shown in (E). H4K12ac levels
  were normalized to the pan H4 levels in each condition.Error bars represent means
  ± SD from three independent experiments; statistical significance shown in (B),
  (D), and (F) was calculated using the unpaired t test
article_title: Chromatin remodeling activity of EP400 safeguards chromosomal stability
  by preventing CENP-A mislocalization
