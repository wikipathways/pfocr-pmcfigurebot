caption: Interplay between etiology, mechanisms, diagnostic tools, and outcomes in
  liver fibrosis. HBV—hepatitis B virus; HCV—hepatitis C virus; ALD—alcohol-associated
  liver disease; MASLD—metabolic dysfunction-associated steatotic liver disease. Dark
  gray boxes indicate primary classification headers in the disease progression framework
  from cause to clinical manifestation; light gray boxes indicate subcategory items
  under each primary category and specific examples of biomarker classes. Lines connect
  subcategories to categories. The blue gradient box highlights the current focus
  on emerging therapeutic approaches that intersect with the biological and clinical
  components of the pathway. These therapies represent future interventions that can
  disrupt or modify these pathways at multiple stages
