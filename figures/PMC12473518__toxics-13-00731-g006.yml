figure_title: Implication of the MERTK signaling pathway in the responses evoked by
  cationic polyamine-based CDs in macrophages.
caption: 'Implication of the MERTK signaling pathway in the responses evoked by cationic
  polyamine-based CDs in macrophages. Cells were pre-treated or not with increasing
  concentrations of UNC5690 (0.25, 0.5, 1, and 5 µM) for 1 h and exposed or not to
  25 µg/mL of CDs for 4 h. (a) Cell viability as assessed with the MTT assay. Results
  are expressed as the percentage of viability when compared to the control cells
  (cells not exposed to CDs and to UNC5690). (b) Cell necrosis as assessed with the
  LDH assay. Results are expressed in fold change in LDH release when compared to
  the control cells. (c) IL-1β secretion in cell culture supernatants as assessed
  by ELISA. Results are means ± SEM of n = 3 experiments. Statistical differences
  were determined by ANOVA followed by the Sidak’s test. # p < 0.05, and ### p < 0.001
  when compared to control cells (white bar). * p < 0.05, ** p < 0.01, and *** p <
  0.001 when compared to the cells exposed to CDs without inhibitor pre-treatment
  (gray bar)'
