figure_title: Differentially expressed genes in roots between the early inflorescence
  stage and the grain filling stage.
caption: Differentially expressed genes in roots between the early inflorescence stage
  and the grain filling stage. (a) PCA analysis on the root at the early inflorescence
  stage (S1) and the grain filling stage (S5). Each data point represents an independent
  biological replicate. (b) Identification of DEGs expressed in root at S5 compared
  with S1. (c,d) GO enrichment analysis (c) and KEGG enrichment analysis (d) of DEGs
  in (b). The top 20 GO terms or KEGG pathways with the lowest p-values are shown.
  (e) Genes related to mineral nutrient transport that were upregulated at S5 are
  shown. (f) Differentially expressed genes related to mineral nutrient homeostasis
  are shown. Heatmaps in (e,f) were generated by using normalized Z-scores and clustered
  by the average linkage method. The red color in the heatmaps in (e,f) represents
  higher expression levels, while blue represents lower expression levels
