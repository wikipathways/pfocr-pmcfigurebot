figure_title: HMGB1 modulates BCR activation and proximal signaling
caption: '(A, D, G, and J) Confocal microscopy of HMGB1, phosphorylated CD19 (p-CD19),
  phosphorylated tyrosine (p-Y), p-BTK, and p-SHIP1 in splenic B cells stimulated
  with anti-BCR (60× objective; scale bar = 2.5 μm). (B, E, H, I, and K) Confocal
  microscopy for Pearson’s correlation coefficients between BCR and signaling molecules
  (analyzed with NIS-Elements AR 3.2). (C) KEGG pathway enrichment of differentially
  expressed genes in cKO B cells (bubble size: gene count; color: Q value). (F and
  L) Western blotting of p-CD19, p-Y, p-BTK, and p-SHIP1 in anti-BCR–stimulated B
  cells (β-actin/total protein served as loading controls). Representative confocal
  microscopy image for 3 independent experiments. Data are representative of 3 experiments.
  One-way ANOVA (B) and multiple t tests (E, H, I, and K) were used for statistical
  analysis. Data shown as mean ± SEM. *P < 0.05, **P < 0.01, ***P < 0.001'
