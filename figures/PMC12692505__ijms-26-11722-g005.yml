figure_title: Altered UPR signaling pathway in osteoblasts from dominant human OI.
caption: Altered UPR signaling pathway in osteoblasts from dominant human OI. (A)
  Western blots of PERK, IRE1α, BIP, PDI, and ERO1Lα in control osteoblasts and (A)
  osteoblasts with the G352S substitution from the type III OI patient, (B) osteoblasts
  with the G352S substitution from the type IV OI patient, (C) osteoblasts with the
  G589S substitution from the type III OI patient, and (D) osteoblasts with the G589S
  substitution from the type IV OI patient at Day 0, 7, 14, and 21 of differentiation
  followed by (E–H) quantification of corresponding protein levels normalized to GAPDH.
  GAPDH was used as a loading control. Data are presented as means ± SEM. * p < 0.05,
  ** p < 0.01
