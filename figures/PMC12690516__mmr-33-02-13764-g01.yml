figure_title: Mechanism of LXR participating in IBD.
caption: Mechanism of LXR participating in IBD. LXR activation regulates inflammation
  via two mechanisms. On one hand, the activation of LXR enhances the expression of
  intestinal epithelial cell tight junction proteins and inhibits the activation of
  intestinal epithelial cells and immune cells, such as macrophages and T cells, in
  the intestine, thus preventing the NF-κB pathway from releasing inflammatory cytokines
  and maintaining the intestinal barrier. On the other hand, the activation of LXR
  can regulate lipid metabolism and inhibit the NF-κB signaling pathway and the release
  of pro-inflammatory factors by increasing the expression of macrophage ABCA1 and
  promoting cholesterol outflow. The aforementioned findings suggest that LXR is a
  key regulator in the occurrence and development of IBD. LXR, liver X receptor; IBD,
  inflammatory bowel disease; HDL, high-density lipoprotein; RCT, reverse cholesterol
  transport; LPS, lipopolysaccharide; TLR4, Toll-like receptor 4; ABCA1, ATP-binding
  cassette transporter A1; CXCL, C-X-C motif chemokine; CCL2, C-C motif chemokine
  2
