figure_title: Endothelial to hepatic intercellular signal communication supports lineage
  differentiation in HLBO
caption: a, The heatmap showing cytokines and growth factors associated gene set derived
  from gene ontology class ‘GO_SIGNALING_RECEPTOR_BINDING’. b, The chord diagram showing
  the intercellular communication network within the HLBO and the number of significant
  ligand–receptor pairs by the thickness of their edges (P < 0.05; one-sided permutation
  test without adjustment). c, The heatmap visualizing the relative importance of
  each cell type of HLBOon the basis of the centrality score of WNT signalling pathway.
  d, The chord diagram describing significant ligand–receptor pairs involved WNT signalling
  within HLBO (P < 0.05; one-sided permutation test without adjustment). The ligand
  and receptor names that overlap with intercellular communication in fetal liver
  are highlighted. e, Whole-mount image of siRNA-treated HLBOs with immunofluorescent
  staining for GS and ASGR1. Scale bar indicates 500 μm. In the ‘+Control’, siRNAs
  of non-targeted negative controls were used. f, Quantification of the percentage
  of cells expressing GS or ASGR1 in 3D reconstructed images. Total cell numbers were
  counted by counterstaining (DAPI). Data represent the mean ± s.e.m. (n = 7 biological
  replicates; **P < 0.01; ***P < 0.001; multiple two-sided Mann–Whitney’s test with
  Holm–Sidak correction). g, Whole-mount image of siRNA-treated HLBOs with immunofluorescent
  staining for CD32b and CD31. h, Quantification of vascular density (percentage area
  of vessels) and ratio of the CD32b+/CD31+ area. Data represent the mean ± s.e.m.
  (n = 9 biological replicates; ***P < 0.001; ****P < 0.0001; multiple two-sided Mann–Whitney’s
  test with Holm–Sidak correction). i, Measurements of FVIII in HLBO supernatants.
  Data represent the mean ± s.e.m. (n = 4, +Control; n = 6, +siWNT2, biological replicates;
  **P < 0.01; two-sided Welch’s t-test)
