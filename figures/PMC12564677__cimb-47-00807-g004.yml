figure_title: Possible molecular pathways in breast cancer.
caption: Possible molecular pathways in breast cancer. Activation by the Notch ligand
  leads to the transcription of genes that promote proliferation and differentiation
  [91]. The Wnt/β-catenin pathway, the Wnt ligand, binds to FZD and LRP5/6 receptors,
  activating DVL and β-catenin, which enters the nucleus and regulates gene expression
  [92]. Activation of the EGFR pathway stimulates the AKT and MAPK pathways, leading
  to drug resistance, tumor growth, and cell survival [93]. CSPG4 stabilizes interactions
  with the basement membrane of endothelial cells, promoting metastasis [94]. TGF-β
  binds to the receptor, activating SMAD2/3 → SMAD4, which promotes invasion and metastasis
  by IHH [95]. Activation of the mTOR pathway affects cell growth, protein synthesis,
  and tumor survival [96]. Activation of the PTCH receptor by the Hedgehog ligand
  leads to the activation of transcription factors GLI1, 2, and 3, which, in turn,
  induces SNAIL and JAG (invasion-promoting) genes [97]. PARP1 participates in the
  repair of single-stranded DNA (ssDNA) breaks, which promotes the survival of cancer
  cells, especially those with BRCA mutations [98]
