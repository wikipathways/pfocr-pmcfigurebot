figure_title: Pharmacological PGC-1α Activation Protects Against Neurodegeneration
  in LINC-EPS Knockout PD Model Mice.
caption: Pharmacological PGC-1α Activation Protects Against Neurodegeneration in LINC-EPS
  Knockout PD Model Mice. Following MPTP intoxication (30 mg/kg, i.p., daily for 5
  days), mice of each genotype (LINC-EPSf/f and LINC-EPSΔDat) were subsequently randomly
  assigned to treatment groups receiving daily administrations of either saline or
  the PGC-1α agonist ZLN005 (10 mg/kg, i.p.) for a duration of 14 days. Behavioral
  and pathological analyses were performed 7 days after the last MPTP injection. (A-D)
  Open field test. Representative locomotor traces (A) and quantification of total
  distance traveled (B), average speed (C), and immobility time (D) (n = 10). (E)
  Rotarod test, showing latency to fall (n = 10). (F) Pole test, showing time to descend
  (n = 10). (G) Representative immunofluorescence images showing TH⁺ neurons (red)
  in the SNpc, with corresponding stereological quantification on the right. Nuclei
  were counterstained with DAPI (blue). Scale bar, 200 µm (n = 6). (H) Representative
  immunohistochemistry images of TH-positive fibers in the striatum, including low-magnification
  overviews and corresponding high-magnification views. The right panel displays the
  quantification of TH-immunoreactive fiber density. Scale bars, 600 µm (overview)
  and 50 µm (magnified view) (n = 6). (I) Representative immunoblots of TH, PGC-1α
  pathway proteins, and ferroptosis-related proteins in midbrain lysates. β-actin
  was used as a loading control. Quantification is shown in Figure S6. (J) Representative
  immunofluorescence images and quantification of GPX4 (red) and TH (green) co-staining
  in the SNpc. DAPI (blue) stains nuclei (n = 6). Scale bar, 20 µm. (K) Quantification
  of MDA levels in midbrain tissue (n = 3). (L) Quantification of the GSH/GSSG ratio
  in midbrain tissue (n = 3). Data are presented as mean ± SEM. Statistical significance
  was determined by one-way ANOVA with Tukey's post-hoc test. *P < 0.05, **P < 0.01,
  ***P < 0.001
