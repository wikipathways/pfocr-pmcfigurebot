caption: Inhibition of glycolysis suppresses STING signaling activation by reducing
  glycolytic ATP production. (A-B) Immunoblot analysis and corresponding quantification
  of STING, p-STING, IRF3, p-IRF3, TBK1 and p-TBK1 in mice liver tissues. (C) Double
  IF staining of F4/80 and p-STING in mice liver sections from different groups. Scale
  bar, 50 μm. (D-E) Western blot and quantification of CD86 and STING pathway proteins.
  *p < 0.05, **p < 0.01, ***p < 0.001. (F) Relative ATP content in cultured BMDMs.
  (G-H) WB analysis of STING and p-STING in BMDMs stimulated with LPS (100 ng/ml)
  in the presence of SLO and ATP for 12 hours. BMDMs were pretreated with 2-DG (5
  mM) for 12 h and subsequently treated with LPS, SLO and ATP
