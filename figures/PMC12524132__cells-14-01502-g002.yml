figure_title: The role of FABP5 and FABP7 in oligodendrocyte lipid metabolism and
  myelination.
caption: 'The role of FABP5 and FABP7 in oligodendrocyte lipid metabolism and myelination.
  This diagram illustrates the complementary functions of FABP5 and FABP7 within a
  differentiating oligodendrocyte during myelination. External lipids are taken up
  from the extracellular space. (1) FABP5 Pathway (Energy Production): FABP5 chaperones
  fatty acids (FAs) to mitochondrion, where they undergo β-oxidation. This process
  generates acetyl-CoA, which enters the TCA cycle to produce ATP (energy currency)
  and NADPH (reducing power), both essential for the high energy demands of myelin
  synthesis. (2) FABP7 Pathway (Biosynthesis and Coordination): FABP7 transports lipid
  precursors to the endoplasmic reticulum (ER) and Golgi apparatus for the synthesis
  of core myelin lipids, such as phospholipids and sphingolipids. These lipids are
  then incorporated into the growing myelin sheath. Additionally, FABP7 interacts
  with PGC-1α to promote mitochondrial biogenesis, ensuring energy supply matches
  biosynthetic demand. (3) Final Output: This coordinated action is vital for maintaining
  oligodendrocyte survival and proper myelin sheath formation around the axon'
