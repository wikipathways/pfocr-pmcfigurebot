caption: '(A) FerroOrange staining quantification, (B) DCFH-DA staining, and (C) immunoblotting
  analysis in human HCT116 sgNCOA4 (n = 3) and sgEV control cells (n = 3). Immunoblotting
  analysis of HCT116 sgNCOA4and sgEV cells treated with (D) AMPK inhibitor compound
  C or (E) CREB inhibitor KG-501. (F) Mitochondrial iron measured by MitoFerroGreen
  staining and (G) mitochondrial ROS measured by MitoSOX staining in HCT116 sgNCOA4
  and sgEV cells treated with DMSO or MCU inhibitor minocycline. (H) Immunoblotting
  analysis of HCT116 sgNCOA4 and sgEV cells treated with or without mitochondrial
  ROS inhibitor mito-Tempol. Values above blots are mean ± S.D. or means only. *p
  < 0.05, **p < 0.01, ***p < 0.001 vs. untreated sgEV; #p < 0.05, ##p < 0.01, ###p
  < 0.001 vs. untreated sgNCOA4. Unpaired Student’s t-test for A–C. Two-way ANOVA
  with Sidak’s multiple comparisons test for D–H'
