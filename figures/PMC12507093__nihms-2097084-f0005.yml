figure_title: STIM2 regulates glycolysis in CRC cells
caption: '(A) Schematics showing metabolites produced during glycolysis and the TCA
  cycle.(B) Heatmap for glycolysis pathway metabolites in parental HCT116 cells or
  STIM1 KO #01, STIM2 KO #15, or STIM DKO #22 HCT116 clones. n=3 biological replicates
  per group.(C) Extracellular acidification rate (ECAR) of parental HCT116 cells or
  STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones. n= 3 biological replicates per group.(D
  and E) Measurement of glucose consumption (D) and lactate generation (E) in parental
  HCT116 cells or STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones. n=4 biological replicates
  per group.(F and G) Representative Western blot probed for GLUT1 and GAPDH (F) and
  densitometric analysis of GLUT1 normalized to GAPDH (G) in parental HCT116 cells
  or STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones. n=3 biological replicates per
  group.(H) TCGA data obtained from UALCAN analysis portal showing GLUT1 protein levels
  in the tumor and unmatched adjacent normal tissue of CRC patients. (p<0.0271 by
  t-test considering unequal variance).(I and J) Representative Western blot for GLUT1,
  tubulin, and GAPDH (I) and densitometric analysis of GLUT1 normalized to GAPDH (J)
  in parental HCT116 cells and STIM2 KO HCT116 clones with GLUT1 silencing. n=3 biological
  replicates per group.(K) Quantification of the spheroid area in parental HCT116
  cells and STIM2 KO HCT116 clones with GLUT1 silencing compared to control. n=3 biological
  replicates per group.(L) Heatmap for citric acid cycle metabolites in parental HCT116
  cells or STIM1 KO #01, STIM2 KO #15, or STIM DKO #22 HCT116 clones. n=3 biological
  replicates per group.(M) Oxygen consumption rate (OCR) in parental HCT116 cells
  or STIM1 KO #01, STIM2 KO #15, or STIM DKO #22 HCT116 clones. n=3 biological replicates
  per group.*p<0.05, **p<0.01, and ***p<0.001 by ANOVA followed by a post hoc Tukey
  test except for paired t-test in (G), (J), and (K)'
article_title: Loss of STIM2, but not of STIM1, drives colorectal cancer metastasis
  through metabolic reprogramming and the ATF4 ER stress pathway
