figure_title: The role of wild-type IDH1 in normal (quiescent) human cells and its
  functional link to TRiC/CCT.
caption: The role of wild-type IDH1 in normal (quiescent) human cells and its functional
  link to TRiC/CCT. Under normoxic conditions, glucose is metabolized to pyruvate
  through glycolysis. Pyruvate enters mitochondria, where it is converted by pyruvate
  dehydrogenase (PDH) into acetyl-CoA, fueling the tricarboxylic acid cycle (Krebs
  Cycle) and oxidative phosphorylation for ATP production. In this context, cytosolic
  wild-type IDH1 catalyzes the NADP⁺-dependent oxidative decarboxylation of isocitrate
  to α-ketoglutarate (α-KG), generating NADPH, which is essential for redox balance
  and lipid biosynthesis. IDH1 thereby contributes to the citrate–isocitrate–α-KG
  shuttle, linking cytosolic and mitochondrial metabolism. Beyond IDH1 activity, α-KG
  can also be derived from glutamine and glutamate through glutaminolysis (dashed
  arrow shows a pathway that is less strongly activated); this α-KG feeds the mitochondrial
  TCA cycle, supporting energy production and anaplerosis. Cytosolic α-KG serves as
  a cofactor for α-KG–dependent dioxygenases, such as prolyl hydroxylases (PHDs),
  which under normoxia hydroxylate HIF-1α, promoting its recognition by the pVHL-Elongin
  B and C (EloB and EloC) complex and subsequent proteasomal degradation. TRiC/CCT
  may regulate the activity of PHD3 and may support the folding and stabilization
  of pVHL protein. Thus, IDH1 and its metabolic products (NADPH, α-KG) may indirectly
  influence TRiC/CCT-dependent proteostasis under normoxic conditions. Created in
  BioRender. Caruso Bavisotto, C. (2025) https://BioRender.com/eshcd2
