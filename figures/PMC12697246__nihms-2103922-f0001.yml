figure_title: Pseudomonas species encode an expanded Gac/Rsm pathway
caption: A) Diagram depicting PARA (left) and the different configurations of the
  Gac/Rsm pathway described in the literature (right). Note that only one RsmA homolog
  and two small RNA molecules (RsmY and RsmZ) are depicted for simplicity; the number
  of homologs of these components varies across genomes. B) Concatenated marker gene-based
  phylogeny of Pseudomonas species and representatives from other γ-proteobacterial
  lineages indicating GRP components identified for each in our analyses. Also see
  Figure S1
