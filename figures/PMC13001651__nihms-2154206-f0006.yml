figure_title: Hypoxia-activated theranostic nanoagent for tumor imaging and photoimmunotherapy.
caption: Hypoxia-activated theranostic nanoagent for tumor imaging and photoimmunotherapy.
  A multifunctional nanoplatform encapsulates a hypoxia-responsive probe and a vascular
  disrupting agent within an acid-degradable metal-organic framework (MOF). Hypoxia
  in the TME activates NIR-II fluorescence and photoacoustic imaging signals for tumor
  localization. Concurrently, the system initiates synergistic photothermal and photodynamic
  effects, triggering ICD and activating the cGAS-STING pathway to promote a robust
  anti-tumor immune response [99]. Copyright 2024, Nat Commun
