figure_title: G4451 was developed as an anti-MASH candidate via blockade of the GPR31-Gαi3
  interaction
caption: '(A) BODIPY staining and quantitative results of lipid droplets in hepatocytes
  with or without G4451 treatment. Scale bars: 30 μm. n = 3 with 8 images quantified.
  (B) Effect of G4451 on the phosphorylation of key proteins in the MAPK signaling
  pathway in hepatocytes. n = 3. (C) Enriched pathway analysis of hepatocytes with
  or without G4451 treatment. n = 3. (D) Western blotting showing the phosphorylation
  of key proteins in the MAPK signaling pathway in WT and GPR31-deficient hepatocytes
  with or without G4451 treatment. n = 3. (E) BODIPY staining of lipid droplets in
  WT and GPR31-deficient hepatocytes with or without G4451 treatment. Scale bars:
  30 μm. n = 3. (F) The molecule docking between GPR31 and G4451 complex. (G) Co-IP
  of GPR31 and biotin-G4451. n = 3. (H) Effect of G4451 on the interaction of GPR31
  and GNAI3. n = 3. (I) Co-IP of GNAI3 and GPR31 or its docking mutants GPR31(3A).
  n = 3. (J) Co-IP of biotin-G4451 and GPR31 or its docking mutants GPR31(3A). n =
  3. (K) Effect of G4451 on the interaction of GNAI3 and GPR31(3A). n = 3. (L) BODIPY
  staining of lipid droplets in GPR31-deficient hepatocytes with GPR31 overexpression,
  GPR31(3A) overexpression, or G4451 treatment. Scale bars: 30 μm. n = 3. Data are
  shown as mean ± SEM. ***P < 0.001; NS, no significance, P > 0.05'
