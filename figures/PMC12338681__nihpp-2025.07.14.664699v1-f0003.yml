figure_title: Mummichog pathway and network analysis and carbohydrate metabolite analysis
  of bronchoalveolar lavage fluid (BALF) from different stages of pneumonia.
caption: 'Mummichog pathway and network analysis and carbohydrate metabolite analysis
  of bronchoalveolar lavage fluid (BALF) from different stages of pneumonia. A-C)
  Negative mode mummichog analysis and metabolite enrichment results, and D-F) Positive
  mode mummichog analysis and metabolite enrichment results across different stages
  of pneumonia. Mummichog analysis was performed using Metaboanalyst 5.0 as described
  in methods. For the analysis, different stages of pneumonia were compared to bronchoalveolar
  lavage fluid from uninfected mice. (E: Early stage of pneumonia, M: Middle stage
  of pneumonia, S: Severe stage of pneumonia; n=7 for E, n=8 for M, and n=6 for S).
  G-K) Results of the carbohydrate metabolite analysis. G) D-glucose/gulose levels,
  H) D-glucose phosphate levels, I) N-acetyl-D-glucosamine levels, J) Uridine di-phosphate
  N-acetyl-galactosamine levels, and K) Uridine Di-phosphate-galactose metabolite
  levels from different stages of pneumonia and uninfected control group. All samples
  were normalized using total recovered volume of bronchoalveolar lavage fluid. L)
  Glucose concentration in recovered bronchoalveolar lavage fluid from different stages
  of pneumonia and uninfected control group. Significance was determined by one-way
  ANOVA, with p-values shown directly on the graph'
