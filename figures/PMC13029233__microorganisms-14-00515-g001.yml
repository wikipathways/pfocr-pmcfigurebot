figure_title: Biogenesis and post-transcriptional regulatory mechanisms of microRNAs.
caption: Biogenesis and post-transcriptional regulatory mechanisms of microRNAs. MicroRNA
  biogenesis begins in the nucleus with the transcription of primary microRNA (pri-miRNA),
  which is processed by the Drosha-DGCR8 complex to generate precursor microRNA (pre-miRNA).
  In parallel, certain intronic miRNAs can be produced through the mirtron pathway
  following splicing. Pre-miRNA is exported to the cytoplasm via the Exportin-5/Ran-GTP
  complex and further cleaved by Dicer to produce a mature miRNA duplex. The guide
  strand is incorporated into the Argonaute-containing RNA-induced silencing complex
  (RISC), where it mediates gene silencing through extensive or partial base pairing
  with target mRNAs, leading to mRNA degradation or translational repression
