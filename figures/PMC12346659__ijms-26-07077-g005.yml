figure_title: Transcription factor network and pathway enrichment analysis.
caption: Transcription factor network and pathway enrichment analysis. (a) CL4 TF
  network featuring key transcriptional regulators and their centrality in driving
  oncogenic pathways; (b) KEGG pathway enrichment for CL4, highlighting canonical
  cancer pathways such as PI3K–Akt and AMPK; (c) Gene Ontology (GO) terms associated
  with CL4, illustrating embryonic gene programs and negative regulation of cell adhesion;
  (d) CL2 TF network depicting influential regulators of immune and inflammatory signaling;
  (e) KEGG pathway enrichment in CL2, emphasizing immuno-inflammatory pathways (JAK–STAT,
  TNF, IL-17, NF-κB); (f) GO terms for CL2, underscoring immune related terms as leukocyte
  adhesion, proliferation, and migration; (g) CL3 TF network revealing hubs shaping
  both oncogenic and immune-associated processes; (h) KEGG pathway enrichment in CL3,
  showing misregulation in cancer and PI3K–Akt, and heavily influenced on inflammatory
  pathways; (i) GO terms linked to CL3, reflecting the regulation of cell adhesion,
  leukocyte proliferation, and immune effector function
