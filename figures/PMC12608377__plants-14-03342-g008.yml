figure_title: HGO mutation suppressed the effect of sscd1 mutation on gene expression
  in the GA pathway.
caption: HGO mutation suppressed the effect of sscd1 mutation on gene expression in
  the GA pathway. Relative expression of genes involved in GA biosynthesis (GA3ox1),
  catabolism (GA2ox2) and cell wall extension (EXPA1, EXPA8, EXPA9) in freshly harvested
  dry seeds and seeds imbibed for 24 h on MS medium from WT, sscd1, hgo-1, and sscd1
  hgo-1 plants. GA3ox1, GA3-oxidase 1. GA2ox2, GA2-oxidase 2. EXPA1, expansin A1.
  EXPA8, expansin A8. EXPA9, expansin A9. Data represent the mean ± SE from three
  biological replicates. Different letters indicate significant differences between
  the genotypes (one-way ANOVA with Tukey’s post hoc test, p < 0.05)
