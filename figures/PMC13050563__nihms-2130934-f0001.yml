figure_title: Mechanisms of EV biogenesis via distinct cellular pathways.
caption: Mechanisms of EV biogenesis via distinct cellular pathways. EV biogenesis
  occurs, through ESCRT-independent and ESCRT-dependent pathways, in healthy cells
  and in tumor cells; however, what differs is the quality, and quantity of output
  for healthy cells and tumor cells. For example, ILVs of the multivesicular bodies
  in healthy cells consist mainly of homeostasis microRNAs (i.e. let-7, miR-16, miR-24),
  markers CD9 and CD63, that mediate tissue homeostasis and regulate immune cells.
  Alternatively, tumor cells enrich EVs with oncogenic cargo (i.e. miR-21, miR-155,
  miR-210) and signaling proteins (e.g. phospho-STAT3 and β-catenin), that promote
  tumor development and cellular communication between tumor cells in the tumor microenvironment
  [69]. Tumor cells appear to excrete many orders of magnitude greater for EVs than
  healthy cells ones, mainly from apoptotic bodies, along with greater pro-tumorigenic
  signals. The dysregulation of EV-cargo and production demonstrates how TD-EVs have
  a significant role in reshaping the extracellular landscape for malignancy [70]
