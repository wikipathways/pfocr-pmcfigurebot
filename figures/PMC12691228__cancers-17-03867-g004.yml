figure_title: Can SARS-CoV2 infection and repeated mRNA anti-COVID-19 vaccinations
  be carcinogenic?
caption: Can SARS-CoV2 infection and repeated mRNA anti-COVID-19 vaccinations be carcinogenic?
  The SARS-CoV2 virus enters via the aerodigestive tract and exploits the Spike protein
  to infect only (mainly) the ACE2-positive cells in the lung, intestine, endothelium,
  and other distant organs including the heart, liver, and kidney. In the infected
  cell, the virus can be degraded by the autophagy–endocytic–lysosomal pathway or
  can reproduce and exit to infect neighboring cells. The anti-COVID-19 vaccine is
  made of liponanoparticles (LNP) containing the modified mRNA coding for the Spike
  protein, and possibly also fragments of the modified mRNA. The vaccine is injected
  into the deltoid muscle fibers which will expose on the membrane the S protein to
  alert the immune system. The S protein and its fragments can be released and be
  endocytosed by antigen processing cells (macrophages and dendritic cells) to trigger
  the production by activated B cells. However, the LNP may transfect the vaccine
  mRNA to any cell. In addition, the vaccine mRNA and the Spike can travel to distant
  organs within the exosomes. Both SARS-CoV2 and LNP-mRNA anti-COVID-19 vaccine affect
  cell homeostatic processes and induce immune dysfunction and tissue environment
  inflammation, all conditions that could potentially lead to the awakening of a dormant
  tumor or micrometastasis and promote cancer proliferation and invasiveness. In detail,
  the Spike protein (either viral- or vaccine-derived) can 1. lead to depletion of
  ACE2, which results in abundance of angiotensinogen 2 having mitogenic and angiogenic
  properties (while the Ang1-7 produced by ACE2 would have pro-apoptotic and anti-angiogenic
  properties); 2. cause cell–cell fusion, which results in polyploidy and abnormal
  chromosomal arrangements; 3. promote the AKT and ERK proliferation pathways and
  the SNAIL migratory pathway. In addition, the SARS-CoV2 viral infection might interfere
  with oncosuppressor pathways, disrupt the control of autophagy, induce the glycolytic
  shift, and trigger the IL-6-driven cytokine storm. On the other hand, repeated cycles
  of vaccination with the modified mRNA causes immune dysfunction, leading to IgG4-mediated
  tolerance and disruption of immune surveillance while the LNP causes inflammation.
  Inflammation (and angiogenesis) and immune suppression created a tissue microenvironment
  permissive for awakening dormant tumors and micrometastases, thus promoting cancer
  cell growth and invasiveness. (* indicates that the vaccine mRNA is modified. LNP,
  liponanoparticle)
