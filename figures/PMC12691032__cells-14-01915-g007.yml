figure_title: Pharmacological inhibition of the PI3K signalling pathway attenuates
  the neuroprotective efficacy of EV-GPCs.
caption: 'Pharmacological inhibition of the PI3K signalling pathway attenuates the
  neuroprotective efficacy of EV-GPCs. (A) Representative micrographs of cortical
  cultures stained with Hoechst 33342 (nuclei, blue) and Calcein AM (viable cells,
  green). Scale bar, 20 μm. (B) Assessment of neuronal culture viability by MTT assay.
  Data are normalised and presented as a percentage of survival relative to the untreated
  control group. Experimental conditions: glutamate (Glu, 100 μM), EV-GPCs (EV-GPCs,
  10 μg/mL), and the PI3K inhibitor AS605240 (AS605240 1 μg/mL). Statistical analysis
  was performed using the Kruskal–Wallis test followed by Dunn’s post hoc test for
  multiple comparisons. Results are presented as violin plots depicting median values
  and interquartile ranges'
