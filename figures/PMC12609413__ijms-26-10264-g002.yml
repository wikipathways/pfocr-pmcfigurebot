caption: 'The process of RNA interference in eukaryotes. The siRNA pathway constitutes
  of double-stranded RNA (dsRNA) being cleaved by the dicer enzyme into siRNA, which
  are then recognized by the Ago-RISC, where one strand is then degraded and the other
  strand guides the complex to degrade complementary mRNA sequences [45]. Abbreviations:
  dsRNA, double-stranded ribonucleic acid; mRNA, messenger ribonucleic acid; Ago2,
  Argonaute 2; RISC, RNA-induced silencing complex'
