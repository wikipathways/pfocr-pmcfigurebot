figure_title: Glioblastoma vulnerability states are spatially exclusive
caption: '(A) 10X Visium stRNA-seq data were acquired from Ravi et al. and deconvoluted
  using SCDC to identify single-cell type proportions present in each section, with
  our in-house scRNA-seq dataset as a reference. This stacked bar plot shows the deconvoluted
  cell type proportions present within each of 18 GBM tumor sections. Cell types included
  as “Non-Neoplastic” designation include: astrocytes, endothelial cells, fibroblasts,
  myeloid cells, oligodendrocytes, and T-cells. (B) Shows a spatial scatter plot of
  UKF269 where each spot is represented as a pie chart showing the proportion of cell
  types identified by deconvolution at that precise location. To the right of the
  spatial scatter-pie image are two representative images of gene set co-regulation
  analysis (GESECA), with respective enrichment scores at each spot represented as
  z-scores. (C-E) Display, in succession, select top-upregulated pathways for each
  of VS1 (C), VS2 (D), and VS3 (E), visualized by spot-level enrichment score correlations,
  GESECA z-score spatial scatter plots, and spatial scatter-pie images, from left
  to right. (C) specifically shows VS1 enrichment for Neuron Development, (D) shows
  VS2 enrichment for Regulation of Cell Population Proliferation, and (E) shows VS3
  enrichment for Microtubule Based Processes. All enrichments were performed using
  fgsea using Gene Ontology Biological Process (GOBP) enrichment set, with correlation
  analysis performed using Pearson correlation with a level of significance set to
  < 0.05'
