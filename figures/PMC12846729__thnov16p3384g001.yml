figure_title: The biological role of the cGAS-STING signaling pathway.
caption: 'The biological role of the cGAS-STING signaling pathway. A: The canonical
  STING signaling pathway. cGAS binds to cytosolic dsDNA, leading to the synthesis
  of cGAMP. cGAMP then binds and activates STING, triggering the trafficking of STING
  from ER to Golgi, where it assembles the TBK1-IRF3 and IKK complexes. TBK1-phosphorylated
  IRF3 induces type I IFNs/ISGs, while the IKK-NF-κB (RelA/p50) axis promotes proinflammatory
  cytokine transcription, thereby supporting antitumor immunity. B: The “non-canonical”
  STING signaling pathway. cGAMP additionally activates a non-canonical STING-PERK-eIF2α
  pathway, wherein STING activates the ER stress kinase PERK. PERK activation leads
  to eIF2α phosphorylation, which enables translation of specific mRNAs that encode
  ATF4. Besides, STING activation triggers the non-canonical NF-κB (RelB/p52) signaling
  pathway, which in turn prevents RelA recruitment. These non-canonical pathways are
  critical for redox reactions, amino acid metabolism, organ fibrosis, and cellular
  senescence. cGAS: cyclic GMP-AMP synthase; dsDNA: double-stranded DNA; ER: endoplasmic
  reticulum; Golgi: Golgi apparatus; IKK complex: IκB kinase complex; TBK1: TANK-binding
  kinase 1; IRF3: interferon regulatory factor 3; ISGs: IFN-stimulated genes; PERK:
  protein kinase RNA-like ER kinase; ATF4: activating transcription factor 4'
