figure_title: Representative results from dfPPI affinity capture, interactome identification,
  and bioinformatics analyses
caption: '(A) Coomassie-stained SDS-PAGE gel of proteins eluted from PU-bead affinity
  captures of epichaperome-bound interactomes from four representative human brain
  samples (PT1-PT4). Bead-bound protein assemblies were denatured by boiling in SDS
  sample buffer, resolved by SDS-PAGE, and stained to assess interactome recovery
  across molecular weights. Each sample was loaded into a separate lane, with an empty
  lane between samples to minimize cross-contamination; a faint signal occasionally
  observed in these empty lanes reflects minor sample spillover during electrophoresis.
  These gels are representative of samples submitted to the MS facility, where each
  lane was sectioned into five slices for in-gel digestion and protein identification
  by MS. (B) Principal component analysis (PCA) of identified protein intensities
  from on-bead digested epichaperome interactomes from eight representative murine
  brain samples (run in duplicate) reveals tight clustering of technical replicates
  and clear biological separation along PC1 and PC2. This confirms high technical
  reproducibility and sufficient biological variance for robust dfPPI analysis. The
  data structure demonstrates that interaction-level differences-not technical artifacts-drive
  sample separation, providing a strong foundation for downstream differential interactome
  modeling without requiring artificial normalization. (C) Coefficient of variation
  (CV) distributions for precursor ion intensities across the eight sample groups
  show consistently low variance, with median CVs ranging from 9.7% to 11.9% (indicated
  by vertical dashed lines). These low CVs highlight the reproducibility and robustness
  of the MS detection and quantification pipeline. The consistency supports the use
  of raw intensity or MS/MS values as reliable inputs for dfPPI analysis, where variance
  in interaction strength-not global protein expression-is the biological signal of
  interest. (D) Hierarchical clustering heatmap of log2-transformed protein intensity
  values across all samples (with technical duplicates shown). Samples cluster by
  biological origin rather than replicate, confirming robust capture of epichaperome-bound
  interactomes and preservation of biologically relevant variance. Broad dynamic range
  and consistent detection across proteins further support dataset quality for dfPPI
  analysis. Scale bar represents log2-transformed protein intensity values, ranging
  from 2 (blue, low abundance) to 14 (yellow, high abundance). (E) Manhattan plot
  of pathway enrichment analysis performed on differentially interacting proteins
  identified by dfPPI. Enrichment was conducted using g:Profiler, and significant
  terms are plotted by −log10(p-value), colored by annotation source: GO Molecular
  Function (GO:MF), GO Biological Process (GO:BP), GO Cellular Component (GO:CC),
  KEGG, Reactome, WikiPathways, and Human Phenotype Ontology (HP). This output represents
  the core utility of dfPPI: uncovering biologically meaningful functional pathways
  perturbed through epichaperome-driven interactome remodeling. The broad annotation
  coverage underscores the systems-level insight achievable through this approach.
  Please click here to view a larger version of this figure'
