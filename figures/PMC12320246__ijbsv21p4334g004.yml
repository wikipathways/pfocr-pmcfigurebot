figure_title: Upregulation of OLFML1 enhances the stemness characteristics of CRC
  cells.
caption: 'Upregulation of OLFML1 enhances the stemness characteristics of CRC cells.
  A The GSEA result indicates an enrichment of gene sets related to stemness-related
  signaling pathway in OLFML1 overexpression group of the CRC microarray profiles
  GSE83889. B-C The in vitro limiting dilution assay shows the effects of OLFML1 on
  the formation of CSC spheres (n = 12), likelihood ratio test. D Tumor sphere formation
  assays indicate that overexpressing of OLFML1 promotes the sphere formation of CSC
  cells. Scale bar represents 50 μm. E The number of tumorsphere in the control and
  OLFML1-overexpressing CRC cells (n = 3). F Western blot assays were performed the
  effects of OLFML1 on the expression of stem cell markers in CRC cells. G-J The number
  of CD133 + or LGR5 + cells was evaluated in the vector, and OLFML1 overexpression
  CRC cells by flow cytometry (n = 3). K Tumor sphere formation assays indicate that
  downregulation of OLFML1 decreased the sphere formation of CSC cells. Scale bar
  represents 50 μm. L The number of tumorsphere in the control and OLFML1-depressing
  CRC cells (n = 3). M Western blot assays were performed the effects of OLFML1 knockdown
  on the expression of stem cell markers in CRC cells. N Western blots assays demonstrate
  the effect of silencing OLFML1 on expression of Hedgehog pathway markers in CRC
  cells. Data information: Graphs report mean ± SD. Significance was assessed using
  2-tailed Student''s t-test. ***P< 0.001, **P< 0.01, *P< 0.05'
