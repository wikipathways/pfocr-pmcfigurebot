  hand and gaze pathway, or neither hand nor gaze pathway, so values in (C)/(E) and
  (D)/(F) do not sum to 1. Each circle represents the proportion of episodes for an
  individual dyad, the bar heights represent the group mean, and the error bars represent
  the standard error of the mean
