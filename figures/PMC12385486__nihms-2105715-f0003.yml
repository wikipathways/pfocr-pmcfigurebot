figure_title: BACH2 shapes tissue resident memory programs in CD8+ T cells in human
  gut while interferon regulatory factors (IRF) drive effector programs
caption: (A) WNN UMAP plot of distinct CD8+ T cell subsets in human gut (n = 45,475
  cells in PLWH and 6,064 cells in HIV− individuals), including CD8+ T cells from
  gut cell aliquots and CD3+ enriched aliquots. (B) Proportions of CD8+ T cell subsets
  in PLWH and HIV− individuals. (C) Mean regulation scores (signed, −log10 scale)
  across DORCs per TF for significant TF-DORC interactions determined in PLWH (top)
  and HIV− individuals (bottom) (D) WNN UMAP plot (top) and violin plots (bottom)
  of BACH2 motif accessibility in CD8+ T cells. (E) WNN UMAP plot (top) and violin
  plot (bottom) of per cell RNA module scores in gut CD8+ T cells. The module score
  was built on DORC genes that had upregulated gene expression in PLWH and were predicted
  to be activated by BACH2 (BACH2 regulation scores > 0) in PLWH CD8+ T cells. (F)
  Heatmap showing differential transcription factor binding motif accessibility between
  CD8-Trm-BACH2high, CD8-Trm-BACH2low, and Tem cells. FDR-adjusted P < 0.05, average
  Z-score difference > 0.15. (G) Heatmap indicating differentially expressed genes
  between CD8-Trm-BACH2high, CD8-Trm-BACH2low, and CD8-Tem cells. FDR-adjusted P <
  0.05, min.pct > 0.25, log2FC > 0.6. (H) Heatmap indicating differentially expressed
  surface proteins between CD8-rm -BACH2high, CD8-Trm-BACH2low, and CD8-Tem cells.
  FDR-adjusted P < 0.05, min.pct > 0.15, log2FC > 0.25. Significantly enriched negative
  regulation of immune effector process (I) and AP-1 pathway (J) were identified using
  GSEA with leading-edge genes shown. * P < 0.05, ** P < 0.01, *** P < 0.001, Wilcoxon
  rank-sum test. See also Figure S3
