figure_title: Supraphysiologic cyclical stretching stimulates production of cytokines,
  cytokine receptors, and chemokines
caption: '(A) STRING diagram of 32 genes (from top 500 differentially expressed genes
  (Padj < 1 × 10–6, absolute value log2FC > 0.48 out of 1,113 genes meeting this criteria)
  from bulk RNA-Seq annotated as genes in GO Biological Process cytokine-mediated
  signaling pathway (GO:0019221) in STRING analysis. (B) qPCR shows 12-fold more IL-6
  mRNA in loaded compared with unloaded HISMCs (mean ± SEM unloaded: 0.009601 ± 0,001695,
  loaded: 0.1195 ± 0.01191, P < 0.0001, n = 4). (C) qPCR shows 55-fold more IL11 mRNA
  in loaded compared with unloaded HISMCs (mean ± SEM unloaded: 0.02060 ± 0.002797,
  loaded: 1.136 ± 0.1585, P = 0.0004, n = 4). (D) Quantification of IL-11 IHC shows
  a small, statistically significant increase in pixel intensity in unloaded compared
  with loaded HISMCs (median [interquartile range], unloaded: 1,184 [762.6], n = 122;
  loaded: 1,012 [631.2], n = 99; P = 0.0469, Mann-Whitney). (E) Representative sum-of-slices
  Z-projections of confocal images of loaded or unloaded HISMCs stained with antibodies
  to IL11 (63× oil objective, confocal Z-stack). (F) Representative sum-of-slices
  Z-projections of confocal images of loaded or unloaded HISMCs stained with antibodies
  to phosphorylated STAT3 (PSTAT3) (63× oil objective, confocal Z-stack). PSTAT3 was
  not detected in HISMCs under either condition, but PSTAT3 was readily detectable
  in human monocyte THP-1 cell line (Supplemental Figure 2). *P < 0.05, ***P < 0.001,
  ****P < 0.0001'
article_title: Rapid cyclic stretching of cultured human visceral smooth muscle cells
  promotes a synthetic, proinflammatory phenotype
