figure_title: Intersectional gene expression in S1→SDH neurons in rats.
caption: Intersectional gene expression in S1→SDH neurons in rats. (A) Schematic diagram
  of the strategy used to selectively express genes in S1→SDH neurons. AAV2/retro-ESYN-nlsCre
  was injected into the SDH, and 1–8 days later, AAV2/5-EF1α-FLEx[acGFP] was injected
  into the contralateral S1 of Wistar rats. (B) Representative images showing GFP
  expression in S1→SDH neurons (green) in the ipsilateral and contralateral S1 cortex
  4 weeks after AAV injection into the S1. Scale bar, 1000 μm. (C) Immunostaining
  of GABA in S1→SDH neurons (GFP) in the contralateral S1 cortex. The percentage of
  GFP+ cells lacking GABA immunofluorescence was quantified (right) (n = 904 total
  GFP+ cells). Scale bars, 200 μm. (D) Schematic diagram of the axonal projection
  pathway of S1→SDH neurons (GFP, green) to the lumbar SDH. Immunostaining images
  show somas and axons of S1→SDH neurons in sections indicated by dotted lines. Arrows
  indicate the corticospinal trajectory (CST) pathway. Scale bar, 1000 μm. (E) Representative
  image of axonal fibers and terminals of S1→SDH neurons (GFP, green) in the SDH of
  the L4 segment. Lamina IIi was visualized by IB4 staining (white). Scale bar, 200
  μm
