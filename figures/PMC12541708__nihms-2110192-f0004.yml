figure_title: Administration of OSM rescues ATII cell states and induces proliferation
caption: (A to E) Mice were treated i.t. with either PBS or 1 μg of OSM daily for
  7 consecutive days. The following day, lungs were collected, and ATII cells were
  sorted for bulk RNA-seq analysis. Schematic representation of experimental design
  (A). Volcano plot for cluster 1 (OSM-independent) ATII gene signature of PBS-treated
  Osm+/+ versus PBS-treated Osm−/− mice and volcano plot of rOSM-treated Osm−/− versus
  PBS-treated Osm−/− mice (B). Volcano plot for cluster 2 (OSM-dependent) ATII gene
  signature of PBS-treated Osm+/+ versus PBS-treated Osm−/− mice and volcano plot
  of rOSM-treated Osm−/− versus PBS-treated Osm−/− mice (C). Heatmap depicting the
  expression levels of genes differentially expressed between groups (twofold differential)
  and k-means clustered by row. Rows represent genes, and columns represent samples
  (D). The resulting clusters were analyzed using MSigDB pathway enrichment in Enrichr.
  The top five enriched pathways for each cluster are displayed. The dotted line represents
  the significance threshold for the adjusted P value, set at P < 0.05 (E). [n = 2
  to 3 mice per group for (A) to (E)]. (F to H) Mice received daily i.t. administrations
  of 1 μg mouse rOSM and i.p. injections of 1 μg EdU for 3 consecutive days. Schematic
  representation of experimental design (F). Lungs were processed 24 hours after the
  final treatment, and Ki67+ ATII (G) and EdU+ ATII (H) cell proportions (left panels)
  and numbers (right panels) were determined with flow cytometry (n = 5 mice per group);
  representative of at least two independent experiments. Female mice were used for
  experiments in this figure. In (G) and (H), symbols represent individual mice, bars
  are means, and error bars indicate SD; ** P ≤0.01. Mann-Whitney U test for (G) and
  (H). TNF-alpha, tumor necrosis factor alpha, UV response Dn, ultraviolet response
  down-regulation; mTORC1, mammalian target of rapamycin complex 1; KRAS, Kristen
  rat sarcoma virus
