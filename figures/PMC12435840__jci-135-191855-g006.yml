figure_title: TBX3 regulates VLDL secretion through regulating cholesterol homeostasis
caption: (A) Western blots showing Tbx3 KO and overexpression in H2.35 cells. (B)
  Heatmaps from in vitro CUT&RUN (left) and in vivo ChIP-Seq for TBX3 binding loci.
  (C) Genomic tracks of VLDL secretion and cholesterol biosynthesis genes showing
  TBX3 binding in vitro and in vivo. (D) Gene Ontology pathway enrichment analysis
  from overlapping in vitro and in vivo TBX3 binding sites. (E) Relative secretion
  of Gaussia luciferase from Tbx3-KO and overexpression H2.35 cell lines. (F) Venn
  diagram showing the overlap of genes that are transcriptionally upregulated during
  MASLD in Tbx3-KO livers and have a TBX3 binding site in vitro and in vivo. (G) Hdlbp
  genomic tracks showing TBX3 binding in vitro and in vivo. (H) Western blot showing
  HDLBP expression in Tbx3-overexpressing H2.35 cells. (I) qPCR of Hdlbp mRNA levels
  in livers from Tbx3-KO mice fed a WD for 4 weeks. (J) Western blot showing HDLBP
  protein levels in livers from Tbx3-KO mice (top) or Tbx3-overexpressing mice (bottom)
  fed a WD for 4 weeks. (K) Western blot showing Tbx3 and Hdlbp double knockout (DKO)
  in vivo and triglyceride secretion assay from Tbx3/Hdlbp DKO mice fed a WD for 2
  weeks (sgLacZ/sgNT, n = 7; sgLacZ/sgHdlbp, n = 7; sgTbx3/sgNT, n = 7; sgTbx3/sgHdlbp,
  n = 8). (L) qPCR of cholesterol biosynthesis genes from Tbx3-KO or -WT mice fed
  a WD for 4 weeks. Significance of the difference in plasma triglycerides among all
  groups at 180 minutes after P407 injection in K was calculated using a 2-way ANOVA
  with Tukey’s post hoc test. *P < 0.05; **P < 0.01; ***P < 0.001
article_title: Somatic mutations in TBX3 promote hepatic clonal expansion by accelerating
  VLDL secretion
