figure_title: Summary of hypothesized theoretical cytoprotection framework.
caption: Summary of hypothesized theoretical cytoprotection framework. As we reviewed,
  cytoprotection as a theoretical unifying concept for arrhythmias includes the arguments
  of endothelial protection, microcirculatory stabilization, modulation of NO pathways,
  reduction in oxidative and inflammatory injury, and protection of ion transporters
  and membranes. Arrhythmias—especially in the context of ischemia, electrolyte imbalance,
  or systemic failure—fit very naturally into this model. Finally, the chain of events
  of ischemia and reperfusion → endothelial injury → microvascular collapse → Ca2+
  overload → myocyte swelling → membrane disruption → arrhythmia may be presented
  as a cascade of “loss of cytoprotection → electrophysiologic instability”. Thus,
  it is important for the search for “ideal antiarrhythmic” (beneficial effect, no
  adverse effects) that arrhythmias can be explained as an electrophysiological phenotype
  of cytotoxicity, especially microvascular and mitochondrial injury. Conventional
  and new antiarrhythmics share class I–IV ≈ partial cytoprotection/narrow range;
  late INa inhibitors, IKs enhancers, RyR2 stabilizers, gap junction modulators, and
  atrial-selective antiarrhythmics ≈ partial cytoprotection/more extended range. Still
  predominantly in preclinical models, stable gastric pentadecapeptide BPC 157, in
  the clinic, has not demonstrated adverse effects in available human trials (non-cardiac)
  to date. As a prominent cytoprotection mediator (LD1 not achieved in toxicology
  studies), it demonstrates well-matched cytoprotective–antiarrhythmic effects, BPC
  157 ≈ full cytoprotection/wide-range homeostasis
article_title: Conventional Antiarrhythmics Class I–IV, Late INa Inhibitors, IKs Enhancers,
  RyR2 Stabilizers, Gap Junction Modulators, Atrial-Selective Antiarrhythmics, and
