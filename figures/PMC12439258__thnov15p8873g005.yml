figure_title: Inhibition of CB1R enhances mitophagy via activation of the PINK1/Parkin
  pathway.
caption: 'Inhibition of CB1R enhances mitophagy via activation of the PINK1/Parkin
  pathway. (A) Schematic illustration of ANT2-mediated regulation of mPTP opening
  and its role in mitophagy. (B) STRING database prediction of protein-protein interactions
  between ANT2 and components of the PINK1/Parkin mitophagy pathway. (C) TEM images
  of sciatic nerve tissues from Cnr1-ctrl and Cnr1-cKO mice showing improved mitochondrial
  ultrastructure in the Cnr1-cKO group. Scale bar = 500 nm. (D) Representative Rhod-2
  fluorescence images of mitochondrial Ca2+ dynamics at 0, 2, 4, and 8 min in Ctrl,
  siCtrl, and siCnr1 groups. Scale bar = 10 μm. (E) Quantification of Rhod-2 fluorescence
  intensity over time. n = 3 replicates. (F) Live-cell imaging of mPTP opening using
  the Calcein-CoCl2 assay. Green fluorescence indicates mPTP state. Scale bar = 20
  μm. (G) Quantification of mPTP-positive cells. n = 8 images from 3 independent experiments.
  (H) Representative ROS fluorescence staining showing intracellular ROS levels in
  Ctrl, siCtrl, and siCnr1 groups. Scale bar = 20 μm. Quantification of ROS⁺ cells.
  n = 9 images from 3 replicates. (I) JC-1 assay of mitochondrial membrane potential
  and quantification of JC-1 aggregate/monomer ratio in the three groups. Scale bar
  = 20 μm. n = 9 images from 3 replicates. (J) Representative IF staining of LC3B
  (green, autophagy marker) and TOM20 (red, mitochondrial marker). Scale bars = 20
  μm (overview), 5 μm (zoomed region). (K) Western blot analysis of mitophagy-related
  proteins. The siCnr1 group showed increased levels of LC3B-II/I, PINK1, and Parkin,
  and decreased expression of TOM20 and p62. All data are presented as mean ± SD.
  Statistical analysis: two-way ANOVA with Bonferroni''s post hoc test (E), one-way
  ANOVA with Tukey''s post hoc test (G, H, I). **p < 0.01, ***p < 0.001, ****p < 0.0001.
  mPTP, mitochondrial permeability transition pore; TEM, transmission electron microscopy;
  ROS, reactive oxygen species; JC-1, 5,5′,6,6′-tetrachloro-1,1′,3,3′-tetraethylbenzimidazolylcarbocyanine
  iodide'
