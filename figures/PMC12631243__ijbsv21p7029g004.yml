figure_title: MitoTEMPO prevents the activation of the KEAP1/NRF2/HO-1 signaling pathway
  in atRAL-loaded 661W cells by reducing the production of mitoROS.
caption: MitoTEMPO prevents the activation of the KEAP1/NRF2/HO-1 signaling pathway
  in atRAL-loaded 661W cells by reducing the production of mitoROS. (A) Cell viability.
  661W cells were pretreated with MitoTEMPO at gradient concentrations of 40, 50 and
  60 μM for 2 h and then exposed to 5 μM atRAL for 6 h. (B) Mitochondrial superoxide
  levels were examined by MitoSOXTM Red staining (n=3). (C) The production of ROS
  was detected by CellROXTM Deep Red staining (n=3). The expression of (D) KEAP1 (n=3)
  and (E) NRF2 (n=3) were quantified by immunofluorescence. (F) The mRNA levels of
  HO-1 were analyzed by qRT-PCR (n=3). (G) Western blots and quantification of KEAP1,
  NRF2 and HO-1 (n=3). Scale bars (B-E), 10 μm. **p < 0.01 and ***p < 0.001
