figure_title: Low RBM10 expression promoted NK cell depletion through the JAK-STAT
  pathway.
caption: Low RBM10 expression promoted NK cell depletion through the JAK-STAT pathway.
  A. Western blot (WB) detection of JAK-STAT pathway-related protein expression in
  PATU-8988 and PANC-1 cells after RBM10 knockdown. B. WB detection of JAK-STAT pathway-related
  protein expression in PATU-8988 and PANC-1 cells after RBM10 knockdown and treatment
  with the JAK pathway inhibitor AZD1480. C. CCK-8 assay of PATU-8988 and PANC-1 cells
  after RBM10 knockdown and treatment with AZD1480. D. Colony formation assays of
  PATU-8988 and PANC-1 cells after RBM10 knockdown and treatment with AZD1480. E.
  Transwell assay of PATU-8988 and PANC-1 cells after RBM10 knockdown and treatment
  with AZD1480. F. The cytotoxicity of NK92MI cells against PAAD cells, detected by
  the LDH method, in co-culture after treatment with AZD1480. G-H. RT-qPCR (G) and
  WB (H) detection of PD-1 expression in NK92MI cells after AZD1480 treatment in the
  co-culture system
