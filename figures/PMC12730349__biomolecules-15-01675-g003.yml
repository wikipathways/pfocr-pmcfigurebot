figure_title: Cholesterol metabolism regulates TAM polarization.
caption: 'Cholesterol metabolism regulates TAM polarization. Figure legend: This figure
  illustrates that cholesterol availability and lipid raft integrity critically influence
  macrophage polarization within the tumor microenvironment. Cholesterol efflux mediated
  by ABCA1 leads to lipid raft depletion, thereby impairing IL-4–induced activation
  of the PI3K–STAT6 pathway and driving macrophages toward an M2-like phenotype. Blockade
  of the CSF-1R receptor results in inhibition of the PI3K–AKT–mTORC1 signaling cascade
  and a reduction in macrophage intrinsic cholesterol synthesis, thereby promoting
  M1 polarization'
