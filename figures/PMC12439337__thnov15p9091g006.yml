figure_title: VPA suppresses the sensitivity of HCC cells to disulfidptosis.
caption: 'VPA suppresses the sensitivity of HCC cells to disulfidptosis. Herein, MHCC97-H,
  Hep3B, HepG2 and BEL-7404 cells were initially subjected to treatment with VPA (2
  mM) for a duration of 24 h, followed by glucose deprivation for 8 to 12 h to induce
  disulfidptosis. The subsequent changes in cell morphology and cell death were assessed
  across each experimental group (A, Scale bar = 20 μm). A heatmap was generated to
  represent the expression of genes associated with glucose and energy metabolism
  as derived from RNA-seq data (B). Furthermore, the formation of disulfide bonds
  in cytoskeletal proteins, specifically FLNA and DREBRIN, induced by glucose starvation
  was analyzed through non-reducing western blotting (C). The expression level of
  Group III was considered as “1”. Additionally, phalloidin staining was utilized
  to examine the presence of actin filaments (F-actin) in the various groups (D, Scale
  bar = 10 μm). The transcription levels of several critical enzymes involved in glycolysis
  and the pentose phosphate pathway (PPP) were further assessed using qPCR (E-F).
  Data are expressed as mean ± SD. The P value less than 0.05 was considered statistically
  significant and the value of Cohen''s d over 0.8 represents a large effect size.
  *: P < 0.05 and Cohen''s d > 0.8 compared to Ctrl group or compared between different
  groups'
