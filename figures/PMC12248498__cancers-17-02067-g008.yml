figure_title: TOPK/IL19 signaling crosstalk between cSCC cells and fibroblasts.
caption: TOPK/IL19 signaling crosstalk between cSCC cells and fibroblasts. In cSCC
  cells, TOPK activates multiple downstream pathways, including NF-κB, PI3K, ERK,
  p38, JNK, PKA, PKC, and PKG, which converge to promote the transcription and secretion
  of IL19. TOPK also enhances the expression of NFκB and IL19 in fibroblasts. Secreted
  IL19 promotes cSCC cell growth and acts in a paracrine manner on nearby fibroblasts,
  leading to their activation, as indicated by the increased expression of αSMA and
  FAPα. These activated fibroblasts further support cancer cell growth, suggesting
  a feedforward loop that drives tumor progression through IL19-mediated communication
  between tumor cells and the surrounding stroma
article_title: TOPK Drives IL19-Mediated Crosstalk Between Cancer Cells and Fibroblasts
  to Promote Solar UV-Induced Skin Damage and Carcinogenesis
