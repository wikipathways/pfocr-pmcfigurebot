figure_title: MEK inhibition rescues osteogenic differentiation of MetΔJMD PECs
caption: (A) Schematic of the MET receptor (blue) bound by HGF (yellow) to activate
  the downstream MEK/ERK signaling cascade, resulting in the regulation of osteogenic
  differentiation of skeletal progenitor cells. Pharmacologic inhibitors of MET (capmatinib)
  and MEK (mirdametinib, selumetinib) are shown in red. (B and C) Representative Western
  blot (B) and quantification (C) of ERK pathway activation in MetΔJMD PECs treated
  with vehicle (n = 8) or mirdametinib (mirda.) (n = 8). Statistically significant
  differences were determined by t test. (D) Cell counts of PECs from control (n =
  14) and MetΔJMD (n = 14) mice. Statistically significant differences were determined
  by 1-way ANOVA with Tukey’s multiple-test correction. (E and F) Relative expression
  of the cell adhesion genes Ncad (E) and Vim (F) in control (Met+/+; n = 9–10) and
  MetΔJMD (n = 7–10) PECs treated with vehicle (Veh.) or mirdametinib. Statistically
  significant differences were determined by 1-way ANOVA with Tukey’s multiple-test
  correction. (G–I) Relative expression of the osteogenic genes Alpl (G), Ibsp (H),
  and Dmp1 (I) in MetΔJMD PECs prior to (Undiff., black) or following osteogenic differentiation
  in the presence of vehicle (Osteo.+vehicle, blue) or mirdametinib (Osteo.+mirda.,
  orange) (n = 3–8 per group). Statistically significant differences were determined
  by 1-way ANOVA with Tukey’s multiple-test correction. (J and K) Representative alizarin
  red staining (J) and quantification (K) of MetΔJMD PECs following osteogenic differentiation
  in the presence of vehicle (blue, n = 6) or mirdametinib (orange, n = 6). Statistically
  significant differences were determined by t test. RT-qPCR from cultured cells and
  other quantification data are presented as the mean ± SEM. **P < 0.01, ***P < 0.001,
  and ****P < 0.0001
