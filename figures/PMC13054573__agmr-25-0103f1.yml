figure_title: Transcriptomic analysis of gene expressions changed during aging and
  calorie restriction (CR).
caption: Transcriptomic analysis of gene expressions changed during aging and calorie
  restriction (CR). (A) Age-related differentially expressed genes (DEGs) from RNA-Seq
  data of the old vs. young and old-CR vs. old datasets from Sprague Dawley (SD) rats.
  Red dots indicate upregulated genes between the two groups, whereas blue dots represent
  downregulated genes. Gray dots represent genes with no changes between the two groups.
  The DEG criteria were |FC|>1.5 and p<0.05. Old-CR, old group under CR. (B) Top 30
  enriched Gene Ontology (biological processes) terms of the DEGs in old vs. young
  and old-CR vs. old dataset from SD rats. (C) Top 30 enriched KEGG pathway terms
  of the DEGs in old vs young and old-CR vs. old dataset from SD rats. The criterion
  for a significant term was p<0.05. Counts indicate the number of genes related to
  each term in the analysis. The fold enrichment indicates how much a particular Gene
  Ontology term or pathway is overrepresented in the list of genes compared to that
  expected by chance. The terms related to immunity/inflammation, cell cycle, and
  ECM accumulation are underlined in red. RNA-seq was conducted as a discovery screen
  using pooled samples; key findings were validated by qRT-PCR. Old-CR, old group
  under CR
