figure_title: The single Kuruka insertion in D.
caption: The single Kuruka insertion in D. erecta is located in flamenco and generates
  piRNAs. (a) A single insertion of Kuruka is found in our novel D. erecta genome
  assembly, consistent with the reference genome. The insertion is located within
  the flamenco locus. (b) We found antisense Kuruka piRNAs in the ovary (germline
  + soma) but not in the embryo (germline) of D. erecta flies. A weak ping-pong signature
  in ovarian piRNAs suggests that the germline pathway may contribute to silencing
  of Kuruka. Our data suggest that Kuruka is largely silenced by the somatic piRNA
  pathway in D. erecta
article_title: The ongoing invasion of the endogenous retrovirus Kuruka in natural
  Drosophila melanogaster populations
