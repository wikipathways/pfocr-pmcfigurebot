figure_title: Chemical inhibition of the PRC1.1 subunit USP7 reduces neuroblastoma
  viability
caption: 'A) Volcano plot showing the Pearson correlation of nearest neighbor gene
  dependency for USP7 gene dependency only in cell lines determined to have a low
  P53-pathway dependency (n=889). B) Cell viability analysis showing mean + SD relative
  growth of neuroblastoma cell lines infected with sgRNAs targeting either USP7 or
  a Chr2.2 DNA cutting control. Significance was determined by one-way ANOVA with
  Sidak’s post-hoc test on day 7. Below: Western blot analysis showing protein levels
  for USP7 in control and knockout cell lines. GAPDH is included as a loading control.
  C) Population doubling cellular viability assay showing relative growth in the presence
  of 1 μM XL177A or DMSO control. Data are shown mean + SD. Significance was determined
  by two-way ANOVA (time x treatment) with Sidak’s post-hoc test at each time point.
  D) Cell cycle analysis using propidium iodide and EdU incorporation on day 3 for
  neuroblastoma cell lines treated with either vehicle or 1 μM XL177A. Data are shown
  as mean +/− SD for three replicates. Significance was determined by one-way ANOVA
  with Sidak’s test between conditions. E) Micrographs of NB-SD cells treated for
  10 days with vehicle or 1 μM XL177A and supplemented with water or 100 ng/mL neurite
  growth factor (NGF). Red arrows indicate representative neurite extensions. F) Western
  blot showing expression of neuronal differentiaton markers in NB-SD cells treated
  for 10 days with 1 μM XL177A. G) Tumor growth curves showing mean + SD of tumor
  volume. Thirty-five mice were injected with NB-SD into the subcutaneous flank and
  23 mice enrolled and randomized into vehicle (n=11) or XL177A 75 mg / kg (n=12)
  twice daily by intraperitoneal injection for eighteen days. Significance determined
  by two-way ANOVA (time x treatment) with Sidak’s test. P values are indicated on
  days with statistical significance. H) Line plots depicting mean + SD body weights
  for mice from panel G normalized relative to baseline weight. Significance determined
  by two-way ANOVA (time x treatment) with Sidak’s test. I) Bar plot showing mean
  + SD SOX13 expression from RNA extracted from vehicle (n=9) or XL177A (n=8) treated
  tumors from panel G as determined by qPCR. Expression values were calculated relative
  to an untreated, unenrolled mouse tumor. Significance determined with Student’s
  t-test. *P ≤ 0.1, **P ≤ 0.01, ***P ≤ 0.001, ns= not significant'
article_title: Inhibition of USP7 destabilizes the noncanonical PRC1.1 complex and
  induces neuroblastoma differentiation
