caption: 'Transcriptome data analysis. (a) Venn diagram of differential metabolites
  in macadamia pericarp across developmental stages; (b) Bar plot showing the statistics
  of differentially expressed genes; (c) Venn diagram of GO enrichment analysis; (d)
  Bubble plot of GO enrichment analysis for differentially expressed genes. The GO
  categories are represented by different shapes: Cellular Component (CC) by a circle,
  Molecular Function (MF) by a triangle, and Biological Process (BP) by a square.
  The term “S2 vs. S1” signifies the GO pathways enriched by the DEGs identified from
  the comparison of stage S2 versus stage S1. The same applies to “S3 vs. S1”, “S4
  vs. S1”, and “S5 vs. S1”; (e) Venn diagram of KEGG enrichment analysis; (f) Bubble
  plot of KEGG enrichment analysis for differentially expressed genes. The term “S2
  vs. S1” signifies the GO pathways enriched by the DEGs identified from the comparison
  of stage S2 versus stage S1. The same applies to “S3 vs. S1”, “S4 vs. S1”, and “S5
  vs. S1”'
