caption: The ZNF662-NGF axis regulates the PI3K/AKT and STAT3 pathways in TNBC cells,
  and ZNF662 could increase the sensitivity of TNBC cells to EGFR inhibitor lapatinib.
  (A) After over-expression of ZNF662 in MB231 and YCCB1 cells, the protein levels
  of p-EGFR, EGFR, p-STAT3 and STAT3 were examined by Western blot. (B) Effect of
  ZNF662 re-expression on downstream signaling pathways was examined by Western blot.
  (C) Proliferation inhibition rate in ZNF662- or NGF-overexpressing cells treated
  with different concentrations of lapatinib
