figure_title: Malignant cells suppress CD8+ T cells glucose metabolism to promote
  immune evasion.
caption: Malignant cells suppress CD8+ T cells glucose metabolism to promote immune
  evasion. A. Immunohistochemical staining of CD8 in the tumor samples from murine
  TEM, with brown signals indicating positive staining. M01-M03 represent three independent
  biological replicates (n=3). B. Quantification of CD8-positive areas was performed
  in the tumor samples from murine TEM. C. The heatmap illustrates the changes in
  cell-cell interaction strength between advanced and early/mid samples as assessed
  by CellChat analysis. Cell type annotations are indicated along the axes, with colors
  representing the relative strength of interactions. D. Gene Ontology (GO) enrichment
  analysis of characteristic genes associated with advanced stage CD8+ T cells. E.
  Heatmap depicting GSVA scores of metabolism-related pathways in CD8+ T cells across
  early, mid, and advanced stages of HCC evolution. F. UMAP plot showing the reconstructed
  evolutionary trajectory of CD8+ T cells using the Slingshot algorithm. Cells from
  early, mid, and advanced stages are classified according to the single-cell TEM.
  G. UMAP plot demonstrating GSVA scores for the glycolysis pathway along the Slingshot-inferred
  trajectory of CD8+ T cells. H. OT-1 CD8+ T cells were co-cultured with OVA-Hepa1-6
  cells, while Jurkat cells were co-cultured with Huh7 cells (all at 1:1 ratio) for
  48 hours in medium containing 5.5 mM glucose. Subsequently, intracellular glucose
  levels were measured separately in CD8+ T cells (left) and Jurkat cells (right).
  I. Glycolysis-related gene expression in OT-1 CD8+ T cells was compared between
  control (isolated) and OVA-Hepa1-6 co-cultured groups (1:1 ratio in 5.5 mM glucose
  medium). All expression levels were normalized to β-actin. J. Changes in glucose
  uptake capacity in OT-1 CD8+ T cells following 48 hours of co-culture with OVA-Hepa1-6
  cells at a 1:1 ratio in the medium containing 5.5 mM glucose, measured using flow
  cytometry to detect fluorescence intensity of 2-NBDG. K and L. Following co-culture
  with OVA-Hepa1-6 cells at 1:1 or 1:10 ratios in 5.5 mM glucose medium for 48 hours,
  CD8+ T cells were analyzed for extracellular acidification rate (ECAR) using sequential
  exposure to 10 mM glucose, 1 μM oligomycin, and 50 mM 2-DG (K). Three replicate
  measurements were performed per condition. Glycolysis was calculated as ECAR increase
  post-glucose addition, while glycolytic capacity represented the difference between
  maximal ECAR (post-oligomycin) and ECAR following 2-DG inhibition (L). M and N.
  OT-1 CD8+ T cells were activated with the OVA-derived peptide SIINFEKL for five
  days. The culture medium was supplemented with either 10 mM or 20 mM of 2-DG and
  either 10 µM or 20 µM of BAY-876. Expression levels of TNF-α and IFN-γ were analyzed
  by flow cytometry, with percentages of TNF-α+ (M) and IFN-γ+ (N) cells represented
  as bar graphs. O. The upper panel shows basal death of OVA-Hepa1-6 cells cultured
  in 5.5 mM glucose medium ±10 µM WZB117 (without CD8+ T cells) as control. The lower
  panel demonstrates cytotoxic activity of activated OT-1 CD8+ T cells against OVA-Hepa1-6
  cells after 24 hours co-culture in 5.5 mM glucose medium. Data are mean ± SD. *p
  < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001, ns, non-significant by Student's
  t test (H and J) or by two-way ANOVA (B and L-N)
