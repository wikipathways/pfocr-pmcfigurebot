figure_title: |-
  In a substantial fraction of tumor and cancer cell settings, RAF is the least
  expressed EGFR-ERK pathway protein
caption: |-
  (A) Fractions of patient tumor samples from CPTAC
  pancreatic ductal adenocarcinoma (PDAC), glioblastoma multiforme (GBM), colon
  adenocarcinoma (COAD), and lung squamous cell carcinoma (LSCC) proteomics data
  with EGFR, RAS (HRAS, KRAS, NRAS), RAF (RAF1 and BRAF), MAP2K (MAP2K1/2), or
  MAPK (MAPK1/3) as the least abundantly expressed protein are shown. Proteins are
  labeled with the gene name that encodes for each protein, as reported in CPTAC
  proteomics data. (B) Fraction of cell lines from CCLE proteomics
  data that have the indicated proteins as the lowest-expressing protein is shown.
  Proteins are labeled with the gene name that encodes for each protein, as
  reported in CCLE proteomics data. (C) For CCLE cell lines where RAF
  was the least abundantly expressed protein, mean normalized expression of the
  indicated proteins was calculated, and standard errors of data are indicated by
  bars. (D) Mean-centered, variance-scaled EGFR, RAS, RAF, MAP2K, and
  MAPK expressions of cell lines from analysis in C were subjected to
  PCA. Percent variance explained by each principal component of a PCA model is
  shown. (E) A PC2 vs. PC1 biplot for the PCA described in
  D is shown. The scores of each observation (cell lines, dots)
  are colored by z-scored RAF1 expression and weights of each feature (arrows) are
  indicated. Cell lines where RAF was the least abundantly expressed pathway
  protein (blue bar in C) are labeled. (F) Average
  silhouette scores for PCA models built with different numbers of clusters are
  shown. Number of clusters used for k-means clustering followed
  by PCA in E is highlighted in red
