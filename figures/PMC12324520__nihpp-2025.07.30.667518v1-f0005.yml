figure_title: Offspring born to dams fed a LFD or HFD have significantly different
  serum metabolomes compared to offspring born to dams fed a GD.
caption: Offspring born to dams fed a LFD or HFD have significantly different serum
  metabolomes compared to offspring born to dams fed a GD. Serum from non-septic P4-P6
  offspring was pooled (3–6 offspring per sample) and analyzed using UHPLC-MS/MS performed
  by Metabolon, Inc. (A) Principal-Component Analysis (PCA) with k-means statistical
  comparison demonstrates a significant difference in serum metabolome in offspring
  of LFD and GD-fed dams. (B) Principal-Component Analysis (PCA) with k-means statistical
  comparison demonstrates a significant difference in serum metabolome in offspring
  of HFD and GD-fed dams. (C) Pathway Impact Analysis of offspring of LFD-fed dams.
  (D) Pathway Impact Analysis of offspring of HFD-fed dams. (E) Sphingolipid metabolites
  are lower in offspring of LFD-fed dams. (F) Sphingolipid metabolites are lower in
  offspring of HFD-fed dams
