figure_title: IGFBPs’ involvement in fibrotic mechanisms in fibroblasts and mesenchymal
  cells.
caption: 'IGFBPs’ involvement in fibrotic mechanisms in fibroblasts and mesenchymal
  cells. (A) Extracellular matrix regulation—IGFBP-3 and IGFBP-7 activate TGF-β receptors
  and downstream SMAD signaling, causing an increase in expression of Collagen, CTGF,
  and Tenascin C, enabling ECM deposition in fibrosis. TGF-β-induced myofibroblasts
  are involved in a self-amplifying loop of activating IGFBP-7 secretion and TGF-β
  receptors. IGFBP-5 promotes myofibroblast differentiation and fibrosis. It increases
  pro-fibrotic genes and ECM deposition. IGFBP-5’s ability to self-amplify its own
  expression adds to the fibrotic tissue microenvironment. IGFBP-4, however, blocks
  TGF-β-induced ECM production and deposition. It also reduces CTGF and CXCR4 levels.
  (B) Metabolism—IGF signaling via IGFBPs binding to IGFRs leads to downstream PI3K/AKT/mTOR,
  MEK/ERK, and JNK signaling. IGFBP-5 enables the MEK/ERK and JNK signaling that induces
  ROS production. This is also mediated by NADPH oxidase. (C) Immunomodulation and
  senescence—IGFBP-2 induces M2 polarization of macrophages, which contributes to
  a pro-inflammatory environment. Inflammatory cytokines from M2 macrophages stimulate
  myofibroblasts, which then create a pro-fibrotic condition. IGFBP-2 also inhibits
  SASP, including pro-inflammatory cytokines, chemokines, growth factors, proteases,
  and ECM components. IGFBP-6 induces myofibroblast differentiation by activating
  the sonic hedgehog pathway that, in turn, induces TLR4 signaling, whose downstream
  effects include the NF-kB pathway and activating inflammatory genes. Note: dashed
  lines represent signaling interactions. Arrows mean positive regulation and blunt
  arrows mean inhibition. ECM = extracellular matrix; CTGF = connective tissue growth
  factor; SASP = senescence-associated secretory phenotype; SMAD2/3 = Mothers Against
  Decapentaplegic Homolog 2/3; TLR4 = Toll-like receptor 4; IL = interleukins; TGF-β
  = Transforming Growth Factor 1; JNK = c-Jun NH-2 terminal kinase; MEKK = mitogen-activated
  protein kinase (MEK) kinase; ROS = reactive oxygen species'
