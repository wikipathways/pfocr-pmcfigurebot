figure_title: Extracts of Tombul and Palaz drive HCT-116 cells to apoptosis.
caption: Extracts of Tombul and Palaz drive HCT-116 cells to apoptosis. mRNA expression
  of apoptotic pathway genes indicates intrinsic apoptosis pathway as evidenced by
  increased expression of pro-apoptotic genes (Bax, Cyt-c, Apaf-1, Casp-3, Casp-7)
  while antiapototic gene expressions (Bcl-2, Bcl-xL) were decreased. Extrinsic pathway
  gene expressions (Casp-8 and FasL) remain unchanged (Left). Protein expressions
  of the HCT-116 cells treated with the extracts were screened by ELISA (Right). The
  results support mRNA expression and flow cytometry apoptosis results. * p < 0.05,
  ** p < 0.01, and *** p < 0.001 compared to the control group. "ns" refers to non-significant
