figure_title: Flow cytometry and immunohistochemistry show functional changes in platelet
  activation after RG gavage.
caption: Flow cytometry and immunohistochemistry show functional changes in platelet
  activation after RG gavage. (A) Experimental model of antibiotic pretreatment, subsequent
  gavage of RG or sham, and sample collection, (B) Assessment by PCR of stool R. gnavus
  throughout the experiment, identifying peak colonization of RG at 2 weeks after
  the last gavage in C57-BL/6 mice. Mice were pre-treated for two weeks with an antibiotic
  cocktail of enrofloxacin, ampicillin, and metronidazole. Mice were then gavaged
  with either sham or RG every other day, for a total of 5 administrations over two
  weeks. Timepoint 0 represents the end of this gavage period. (C) FITC-dextran levels
  in serum pre- and post-oral gavage of sham vs. RG gavage-treated (RG colonized)
  mice. (D) Principal component analysis of the top 25% varied genes among C57-BL/6
  mice 2 weeks and 4 weeks post-gavage with either sham or RG. PCA1 48.7%, PCA2 28.3%
  and PCA3 12.1%. (E) Gene expression 2 weeks post-gavage with genes related to platelet
  activation noted. (F) Heatmap of whole-blood RNAseq genes related to platelet activation
  in sham gavage (left) and RG colonized (right) mice. *indicates transcripts identified
  as significantly increased in murine challenge studies, as well as human whole-blood
  RNAseq studies (Figure 1,2). (G) GSEA pathway analysis of genes overexpressed in
  RG compared to sham at 2 weeks post-gavage. (H, I) P-selectin+ platelets (relative
  to CD41+ FSC low in C57-BL/6 mice (H) and Gp1b-Cre+ platelets in TdTomato-Gp1bCre
  mice (I) with or without Thrombin stimulation. Unpaired t-test
