figure_title: Metabolomic profiles in NAC1 knockdown versus control OV207 cells.
caption: 'Metabolomic profiles in NAC1 knockdown versus control OV207 cells. Truncated
  gluconeogenesis was suppressed by NAC1 KD. NAC1 knockdown suppressed truncated gluconeogenesis,
  as evidenced by significantly lower levels of phosphoenolpyruvic acid, 2-phosphoglyceric
  acid, 3-phosphoglyceric acid, and serine. The values represent means ± SD. PCK2
  catalyzes the conversion of OAA to PEP, a key step in the truncated gluconeogenesis
  pathway. Abbreviations: NAC1, nucleus accumbens-associated protein 1; KD, knockdown;
  PCK2, phosphoenolpyruvate carboxykinase 2; OAA, oxaloacetate; PEP, phosphoenolpyruvate;
  SD, standard deviation'
