figure_title: GO and KEGG pathway enrichment analysis of target proteins of Curcumae
  Longae Rhizoma and Achyranthis Bidentatae Radix.
caption: GO and KEGG pathway enrichment analysis of target proteins of Curcumae Longae
  Rhizoma and Achyranthis Bidentatae Radix. (A) GO biological process network analysis.
  Nodes represent significantly enriched biological processes, and edges indicate
  shared proteins between processes. The network was constructed using a manually
  defined significance threshold. (B) KEGG pathway enrichment analysis of the same
  target proteins. The top enriched pathways are presented based on significance,
  where node size reflects the number of involved target proteins and color intensity
  corresponds to the enrichment significance. Pathways related to inflammation, apoptosis,
  and metabolic regulation were predominantly enriched
