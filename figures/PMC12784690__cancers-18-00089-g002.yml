figure_title: FGFR Signaling Regulates Tumor Angiogenesis Through Endothelial Cell
  Activation and VEGF Crosstalk.
caption: 'FGFR Signaling Regulates Tumor Angiogenesis Through Endothelial Cell Activation
  and VEGF Crosstalk. Upper panel: Tumor-derived FGF2 (green sphere) binds to FGFR1
  (orange) and HSPG co-receptor (blue glycan chains) on endothelial cells, inducing
  receptor dimerization and autophosphorylation (marked as P). Activated FGFR1 triggers
  RAS-MAPK-ERK (red) and PI3K-AKT (blue) pathways, coordinately driving pro-angiogenic
  effects. Lower panel: FGFR-VEGF positive feedback loop amplifies angiogenic signaling.
  FGF2 (left, green sphere) activates FGFR to upregulate VEGF transcription and secretion.
  Secreted VEGF (right, red sphere) activates VEGFR, reciprocally enhancing FGF expression'
