caption: (A) DEG were categorized according to the nine main GO terms representing
  the primary mechanisms of sarcopenia. The major upregulated and downregulated genes
  are shown in bold fonts. The most potent genes indicated the red color in the table.
  (B) DEG analysis graphs were categorized into seven subcategories of GO terms related
  to the underlying mechanisms of sarcopenia. Subcategories include exosomes (RNAse
  complex), estrogen response element binding, response to estrogen, hormone-mediated
  signaling pathway, glucose metabolic process, Hippo signaling, and cellular lipid
  metabolic processes. The major upregulated and downregulated genes are shown in
  bold fonts
