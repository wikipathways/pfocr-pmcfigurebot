figure_title: Plasma proteome changes in Sterne and ΔSterne challenged animals at
  24 hours post-challenge versus T0 baseline
caption: '(A) Venn diagram showing the differentially expressed plasma proteins in
  baboons challenged with Sterne or ΔSterne anthrax. The diagram illustrates the overlap
  and unique proteins between the two groups.(B and C) Volcano plots comparing the
  differentially expressed plasma proteins in Sterne-challenged animals (B) and ΔSterne-challenged
  animals (C). Significantly upregulated proteins are highlighted in red, and downregulated
  proteins are highlighted in blue. The x-axis represents the log₂ FC in protein levels,
  and the y-axis represents the –log₁₀ adjusted p-value (indicating statistical significance).(D)
  Bubble plot illustrating the differences in IPA (Ingenuity Pathway Analysis) canonical
  pathway enrichments of differentially expressed proteins between Sterne and ΔSterne
  groups. Each bubble color represents the Z-score (indicating activation or inhibition
  of a pathway), and the size represents the –log₁₀ adjusted p-value (indicating statistical
  significance).(E–H) Heat maps displaying the differences in protein abundance between
  Sterne and ΔSterne samples for selected canonical pathways: (E) Neutrophil degranulation
  and NETs signaling; (F) HIF-1α signaling; (G) Glycolysis; (H) LXR/RXR activation.The
  heat maps show log₂ FC in protein levels, represented on a color scale from red
  (upregulated) to blue (downregulated).(I and J) Bubble plots of: (I) Upstream regulators
  predicted by IPA based on the observed protein expression levels; (J) Diseases and
  functions predicted by IPA given the observed protein expression levels in Sterne
  versus ΔSterne groups.The Z-score is calculated to predict the activation state
  of upstream regulators and diseases/functions connected to our proteomics datasets
  and to assess if the observed regulation directions are unlikely to occur by chance
  71. The bubble size represents the −log10 p-value from the t-test, indicating statistical
  significance. The p-value reflects the overlap between the number of molecules in
  our dataset associated with a regulator or disease/function and the total number
  known to be associated.(K) Heat map of differentially expressed proteins involved
  in leukocyte migration. These categories were identified in the diseases and functions
  bubble plot (J). Log₂ FC in the two groups are represented on a color scale from
  red (upregulated) to blue (downregulated), illustrating the differences in protein
  expression related to these functions'
