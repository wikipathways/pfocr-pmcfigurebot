figure_title: Effects of THC on P.
caption: Effects of THC on P.a. LPS-mediated MAPK signaling pathways. (A) After pretreatment
  with THC (0-40 µM) for 1.5 h and treatment with 0.1 µg/mL P.a. LPS for 24 h, cell
  lysates in each group were collected to analyze the proteins expression of p-JNK,
  p-ERK and p-p38 through western blotting. After pretreatment with THC (0 or 40 µM),
  SB 203580 (0 or 10 µM), U0126 (0 or 10 µM), or SP 600125 (0 or 20 µM) for 1.5 h
  and treatment with 0.1 µg/mL P.a. LPS for 24 h, the levels of (B) IL-6, (C) IP-10,
  (D) TNF-α and (E) MIP-2 were measured using ELISA kits. The relative expression
  of proteins was expressed as a percentage compared with the control group (mock).
  a-e with the same symbol means no statistical difference was observed between groups
  (p < 0.05)
