figure_title: Lnk deficiency attenuates the activation of the ATR pathway upon replication
  stress
caption: |-
  (A) Experimental design for measuring the activation of the ATR pathway upon pIpC-induced HSPC replication. (B and C) Quantification of fold change in MFI of pCHK1 (Ser345) (B) and ATRIP (C) within LSK, SLAM LSK HSC, and MPP populations in mice given PBS or pIpC. (D) Experimental design for measuring the activation of the ATR pathway within the donor HSPC population upon transplantation-induced replication. (E and F) Fold change in MFI of ATRIP (E) and pCHK1 (Ser345) (F) within donor LK, LSK, and MPP populations after 4 months of BMT. (G–I) Freshly isolated LK cells from WT, Fancd2−/− (D2), Lnk−/− (Lnk), and Fancd2−/−
  Lnk−/− (DKO) mice were treated with the indicated concentrations of HU or CPT for 2 hours in SFEM containing SCF, TPO, IL-3, and IL-6, and the cell lysates were subjected to Western blots for different antibodies. The images in I were derived from the same experiment initially shown in Figure 1H (right panel). In all relevant panels, each symbol represents an individual mouse. Bars indicate mean values, and error bars indicate SEM. P values were calculated using 1-way ANOVA; *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001
