figure_title: Effect of PHZ on CL4176 from the perspective of lipid metabolism.
caption: Effect of PHZ on CL4176 from the perspective of lipid metabolism. (A) OPLS-DA
  cluster analysis of nematodes under 200 μM PHZ treatment, and 200 times response
  permutation test (RPT, response permutation testing) of the OPLS-DA model showed
  no risk of overfitting. (B) Horizontal coordinates are log2-transformed fold change,
  and the vertical coordinate is the lipid subclass. Each dot in the graph represents
  a differential lipid, the color of the dot corresponds to a different lipid subclass,
  and the size of the dot is −log10-transformed p. (C) Each row in the graph represents
  a differential metabolite, each column represents a sample, and the colours represent
  the expression, with blue to red corresponding to low to high expression. (D) Horizontal
  coordinates are log2-converted fold change; vertical coordinates are −log10-converted
  q-value. Green is down-regulated significant differential metabolites, red is up-regulated
  significant differential metabolites; non-significant metabolites are in grey, up-regulated
  differential metabolites are 60, and down-regulated differential metabolites are
  48. Circles are for metabolites with VIP greater than or equal to 1, triangles are
  for metabolites with VIP smaller than 1, and non-significant metabolites are grey.
  (E) Metabolic pathway enrichment analysis of differential metabolites based on the
  KEGG database, enriched in unsaturated fatty acid metabolic pathway (>1000 worms
  per sample, collected from six independent experiments)
