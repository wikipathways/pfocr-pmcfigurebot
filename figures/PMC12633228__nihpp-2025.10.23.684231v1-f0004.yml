figure_title: NicheProt reveals distinct protein profiles between DC populations
caption: (A) PCA plot of the proteome collected from DCs in the norm, outside, and
  inside groups (n=3). (B) Heatmap of the top 50 most variable proteins. (C) Differential
  protein expression of DC inside versus norm groups. Proteins upregulated in the
  DC inside group are highlighted in red, while those upregulated in the DC norm group
  are shown in blue. (D) Differential protein expression of DC outside versus norm
  groups. Proteins upregulated in the DC outside group are highlighted in red, while
  those upregulated in the DC norm group are shown in blue. (E, F) Gene ontology (GO)
  enrichment pathway analysis of biological pathways differentially regulated (E)
  between DC inside and norm groups and (F) between DC outside and norm groups
