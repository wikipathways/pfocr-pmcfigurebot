figure_title: Phospho-proteomics defines the impact of TBK1 function on endo-lysosomal
  pathways
caption: '(A) Schematic of global phospho-proteome-wide profiling. Briefly, phospho-peptides
  were enriched using titanium dioxide (TiO2) before being fractionated into 50 fractions
  for subsequent mass spectrometry analysis.(B) Volcano plots representing differential
  abundance of phospho-peptides of isogenic cell lines, following normalization to
  the global-proteomics data. A total of i = 50,872 normalized phospho-peptides were
  quantified. Phospho-peptides of selective autophagy cargo receptors (SACRs; in red)
  and autophagy factors (in yellow) were decreased in abundance in TBK1 KO cells compared
  to control, and Gene Ontology analysis demonstrated enrichment for the autophagy
  pathway. No significant pathway enrichment was found in either the TBK1 E696K or
  OPTN KO lines.(C and D) Specific phospho-peptides with phosphoserine residues consistent
  with TBK1 kinase consensus sites in autophagy proteins, including several SACRs
  (C) and key regulators of autophagy and endo-lysosomal pathways (D). Statistical
  significance: *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001.(E) Heatmap representing
  a selection of phospho-peptides from autophagy factors, ALS-associated proteins,
  SACRs, and novel targets of interest.(F) Volcano plots representing the differential
  abundance of phospho-peptides normalized to the global proteomics data from TBK1
  G217R hiPSC lines SNV/WT and SNV/SNV compared to REV/WT (isogenic CRISPR-revertant
  control). A total of i = 30,810 normalized phospho-peptides were quantified. Phosphorylation
  of the SARC p62/SQSTM1 (highlighted in red) was decreased in TBK1 G217RSNV/SNV compared
  to REV/WT.(G) Quantification of selected phospho-peptides with phosphoserine residues
  consistent with TBK1 kinase consensus sites of p62/SQSTM1, OPTN, GABARAPL2, and
  RAB7A across genotypes, demonstrating a variant-dosage effect on the phosphorylation
  of specific residues of key TBK1 substrates. Data are presented as mean ± s.e.m.;
  each dot represents an independent biological replicate (n = 4). Pairwise comparisons
  among genotypes were performed using a one-way ANOVA with Tukey’s multiple comparisons
  post hoc test. Statistical significance: *p < 0.05, **p < 0.01, ***p < 0.001, ****p
  < 0.0001'
article_title: Phospho-proteome profiling in human neurons reveals targets of TBK1
  in ALS/FTD-associated autophagy networks
