figure_title: Schematic representation of the main cellular mechanisms induced by
  Altertoxins.
caption: Schematic representation of the main cellular mechanisms induced by Altertoxins.
  These compounds induce oxidative stress, mitochondrial dysfunction, and apoptosis.
  They form bulky covalent DNA adducts causing replication and transcription interference.
  ATX-II additionally acts as topoisomerase II poison, stabilizing the cleavage complex
  and inducing double-strand breaks, and activates the Nrf2-ARE pathway, leading to
  antioxidant gene induction. Dashed arrows indicate feedback or secondary amplifying
  interactions between pathways
