figure_title: Network pharmacology analysis of SSF for treating immunosuppression.
caption: 'Network pharmacology analysis of SSF for treating immunosuppression. (A)
  Screening process of potential core targets of SSF against immunosuppression. (B)
  SSF component/target/immunosuppression network. Nodes represent the following: blue:
  SSF, orange: SSF components in serum; green: overlapping targets; purple: immunosuppression
  targets. (C) Histogram of GO annotation analysis. Bar length and color indicate
  the number of targets involved in related biological processes (BP: green; CC: orange;
  MF: purple). (D) Bubble plot of the top 20 enriched KEGG pathways. Color scale represents
  −log10 (p-value), and dot size indicates gene count per term. (E) PPI network visualization
  of 137 targets (node size reflects connectivity degree). (F) Component/target/pathway
  interaction network for SSF'
