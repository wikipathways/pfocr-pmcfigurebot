figure_title: MAPK and NF-κB blockade mitigate IL-1β-driven transcriptional changes
  of key renal uptake transporters in PTECs
caption: 'Primary human PTECs were treated for 48 h (media replaced every 24 h) with
  1 ng/mL IL-1β in the absence or presence of pathway inhibitors (i.e., PD98059 [ERK,
  10 μM], SB203580 [p38MAPK, 10 μM], SP600125 [JNK, 10 μM], and PDTC [NF-κB, 30 μM]),
  either individually or as a cocktail, in both chambers of Transwells. Panels: (A)
  OAT1, (B) OAT2, (C) OAT3, (D) OCT2, (E) OAT4, and (F) OCTN1. Expression is shown
  relative to the respective IL-1β-free controls within each inhibitor condition (dotted
  line = 1), as these inhibitors alone without cytokines affected the mRNA expression
  of transporters (Supplemental Figure S7). Thus, IL-1β + inhibitor cocktail data
  are normalized to inhibitor cocktail-only controls, and IL-1β + individual inhibitor
  data are normalized to the corresponding inhibitor-only controls. Data are mean
  ± SD from three donors (each quantified in triplicate). Statistical significance
  was assessed using repeated-measures one-way ANOVA with Dunnett’s multiple comparisons
  against the corresponding IL-1β-free baselines (*p≤0.05, **p<0.01, ****p <0.0001).
  The inhibitor cocktail completely reversed IL-1β-mediated repression of OAT1–3.
  JNK blockade alone (SP600125) fully restored OAT1/3, whereas for OAT2, p38MAPK inhibition
  (SB203580) significantly blunted the effect of IL-1β. OCTN1 induction by IL-1β was
  significantly reduced by NF-κB inhibition. OCT2 effects were modest overall, with
  only p38MAPK inhibition reaching significance. OAT4 was rescued by the cocktail,
  whereas no single inhibitor reproduced the cocktail’s effect. Data for additional
  DMETs and endocytic receptors tested are shown in Supplemental Figures S7 and S9.
  Quantification of marker gene mRNA expression assessing pathway engagement by inhibitors
  is shown in Supplemental Figure S8'
