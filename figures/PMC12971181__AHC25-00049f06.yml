figure_title: Functional analysis of TCF/LEF binding motifs and signaling pathway
  effects on VCAN expression.
caption: 'Functional analysis of TCF/LEF binding motifs and signaling pathway effects
  on VCAN expression. (a, b) Electrophoretic mobility shift assays (EMSAs) demonstrated
  a block-shift phenomenon at TCF/LEF #1 with both TCF4 and LEF1 antibodies (*), confirming
  protein-DNA interaction. By contrast, binding at motifs #2 and #3 was not evident.
  (c) Quantitative PCR showing VCAN mRNA expression in fibroblasts after LiCl treatment
  (0, 10, 20 mM). No induction was observed. (d) Quantitative PCR showing VCAN mRNA
  expression after PMA treatment (0, 10, 20 nM). No significant change was detected.
  (e) Forskolin treatment (0, 10, 20 μM) induced a dose-dependent upregulation of
  VCAN expression. (f) This forskolin-induced effect was not reproduced in VCAN-Luc
  promoter reporter assays'
