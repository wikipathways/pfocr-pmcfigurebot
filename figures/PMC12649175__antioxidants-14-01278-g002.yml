figure_title: Mechanistic overview of ROS generation, redox signaling and pathological
  signal transduction leading to tissue damage and cell death in cardiovascular diseases.
caption: Mechanistic overview of ROS generation, redox signaling and pathological
  signal transduction leading to tissue damage and cell death in cardiovascular diseases.
  Mitochondria function as the major site of ROS production and as a central ROS-mediated
  signaling hub. ROS play an important role as second messengers in modulating multiple
  signaling pathways to regulate inflammation, including (1) components of the NLRP3
  inflammasome, (2) PI3K-AKT-NF-κB and (3) MAPK pathways. In doing so, ROS activate
  the expression of inflammatory genes, including IL-1β, IL-6, TNF-α, VCAM-1 and ICAM-1,
  to enhance inflammatory and immune responses, ultimately accelerating the activation
  and progression of CVDs. Conversely, oxidative activation of Nrf2 inhibits inflammation
  by crosstalk with the NLRP3-inflammasome to lessen CVD. Created in BioRender. Pervin,
  M.; de Haan, J.B. (2025) https://BioRender.com
