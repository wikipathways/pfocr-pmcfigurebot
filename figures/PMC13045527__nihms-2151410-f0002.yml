figure_title: Differentially expressed genes and biological pathways associated with
  pregnancy
caption: (A) Volcano plot showing the differentially expressed genes between V1 and
  V2. The red dots indicate those with a fold change > 1.5 and an FDR < 0.1. Genes
  with higher expression in V2 are on the right side.(B) Bar plot representing MsigDB
  hallmark pathway enrichment, showing pathways significantly upregulated in V2 (red)
  and those upregulated in V1 (blue).(C) Box plots showing estimated changes of gene
  expression from V1 (blue) to V2 (red) of representative genes from the “Inflammatory
  Response” pathway
