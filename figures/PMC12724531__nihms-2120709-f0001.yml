figure_title: Intradermal injections performed for ICG lymphography to map upper extremity
  forearm and upper arm superficial lymphatic pathways.
caption: 'Intradermal injections performed for ICG lymphography to map upper extremity
  forearm and upper arm superficial lymphatic pathways. Anterior forearm pathway injections
  are performed in the first and fourth web spaces on the dorsum of the hand. Posterior
  forearm pathway injections are performed in the radial and ulnar sides of the volar
  forearm proximal to the wrist crease. The lateral upper arm pathway injection is
  performed proximal to the antecubital crease over the cephalic vein, while the tricipital
  upper arm pathway is performed proximal to the radial aspect of the olecranon. Reprinted
  from Annals of Surgery, Fanning et al, The Upper Extremity Lymphatic System Is Not
  Symmetrical in Individuals: An Anatomic Study Utilizing ICG Lymphography and SPECT/CT
  Lymphoscintigraphy, 2024 Oct 1, Epub ahead of print, with permission from Wolters
  Kluwer Health, Inc'
