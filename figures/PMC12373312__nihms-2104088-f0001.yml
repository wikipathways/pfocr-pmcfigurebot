caption: 'A schematic representation of the development of cognitive control training
  for aphasia in accordance with treatment (left) and enablement (right) theories.Note:
  The thick arrows represent a potential pathway for developing the new treatment.
  The dotted arrows represent possible connections between different functions. Each
  dotted arrow has a particular “weight,” reflecting its relative importance or contribution.
  For simplicity, the weights are not assigned and dotted arrows are shown as unidirectional,
  though some could be bidirectional. For other potential active ingredients, see
  section “Blueprint for Developing Effective Cognitive Control Treatments.”'
