caption: 'AMPK-dependent and -independent molecular mechanisms of metformin action
  in CRC cells: The major molecular pathways through which metformin exerts its anticancer
  effects within CRC cells. The primary mechanism involves inhibition (red) of mitochondrial
  complex I, leading to AMPK activation (green), which subsequently inhibits (red)
  the mTOR pathway, suppresses (red) protein synthesis, induces (green) cell cycle
  arrest, and modulates (green_ autophagy. AMPK-independent mechanisms include ROS
  production and the modulation of key oncogenic signaling pathways such as the Wnt/beta-catenin,
  TGF-beta/PI3K/AKT, and ADORA1-mediated apoptosis pathways'
