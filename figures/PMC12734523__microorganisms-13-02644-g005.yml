figure_title: Oar-miR-125b regulates NF-κB p65 phosphorylation and signaling.
caption: Oar-miR-125b regulates NF-κB p65 phosphorylation and signaling. (A,B) Western
  blot analysis of PP65 and P65 expression in OBMECs following transfection with oar-miR-125b
  mimic or inhibitor. Western blot images were analyzed using the Image J software,
  and densitometry quantification of Western blots were normalized to β-actin. (C,D)
  Following transfection of oar-miR-125b mimics or inhibitors into OBMECs, real-time
  quantitative PCR was employed to detect the expression of mRNA molecules associated
  with the NF-κB signaling pathway. * p < 0.05, ** p < 0.01, *** p < 0.001 compared
  with miR-NC. Non-significant differences are indicated by ns
