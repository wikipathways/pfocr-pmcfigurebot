figure_title: Flux distribution of metabolic reactions associated with energy metabolism
  across exposure conditions in investigated mice.
caption: Flux distribution of metabolic reactions associated with energy metabolism
  across exposure conditions in investigated mice. (A) Reaction fluxes of pentose
  phosphate pathway (PPP), glycolysis, and citric cycle (TCA) in female and male BALB/c
  mice exposed to PFESA-BP2. Schematic diagram of the biological pathways was acquired
  from ESCHER database [79], where the orange-colored nodes represent metabolites,
  and reaction IDs are given to represent enzyme name catalyzing the reaction. (B)
  Reaction fluxes of fatty acid β-oxidation in mitochondria, including the transport
  reactions from extracellular and cytosol compartments in WT and PPARα−/− male mice
  exposed to PFOA and GenX. The pathway schematic diagram was acquired from WikiPathways-(WP3588)
  database [78] with minor modifications, addressing the reactions of interest and
  related enzymes. The BIGG reaction IDs are given corresponding to their set of enzymes
  (highlighted in red color). Statistical analyses were performed using unpaired two-tailed
  t-tests, using Ctrl group (for panel A) and WT-control group (for panel B) as the
  respective comparison references. A p-value < 0.05 was considered statistically
  significant (* p < 0.05, ** p < 0.01, and *** p < 0.005). KO represents the PPARα−/−
  mice. Low- and high-PFOA are PFOA doses of 0.05 and 0.3 mg/kg.bw/day, respectively
