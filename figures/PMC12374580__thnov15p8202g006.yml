figure_title: ARHGEF12 E620K mutation activates Rap1 signaling pathway and upregulates
  integrin gene expression.
caption: ARHGEF12 E620K mutation activates Rap1 signaling pathway and upregulates
  integrin gene expression. (A) Heatmap of mRNA-Seq analysis of differentially expressed
  genes regulated by ARHGEF12 mutant E620K (fold change >2, P <0.05). (B-C) GO enrichment
  analysis of downregulated genes (G1) by ARHGEF12 KO (B) or upregulated genes (G2)
  by the E620K mutant (C). (D) Gene set enrichment analysis (GSEA) showed enrichment
  of Rap1 signaling pathway and integrin-related gene signature in E620K mutated cells.
  NES, normal enrichment score. (E) WB of effects of ARHGEF12 E620K mutation on Rap1
  signaling activation (Rap1A-GTP, Talin, and p-ERK) in AGS cells. (F-G) qRT-PCR analysis
  of relative mRNA levels of integrin α (F) and β (G) family members regulated by
  the E620K mutant in AGS cells. Data are representative of three independent experiments
  with similar results. Data were presented as mean ± SEM. *P < 0.05, **P < 0.01,
  ***P < 0.001, by two-tailed Student's t-test
