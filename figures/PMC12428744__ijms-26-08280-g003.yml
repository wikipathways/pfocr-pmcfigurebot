figure_title: Lotus alkaloids exert neuroprotection by regulating inflammation triggered
  by LPS.
caption: Lotus alkaloids exert neuroprotection by regulating inflammation triggered
  by LPS. Nuciferine, neferine, and isoliensinine attenuate inflammatory responses
  by inhibiting the phosphorylation and subsequent proteasomal degradation of inhibitor
  of kappa B alpha (IκBα), thereby suppressing the activation of the NF-κB signaling
  pathway. This results in the downregulation of inducible nitric oxide synthase (iNOS)
  expression and inflammatory mediators, including TNF-α, IL-1β, PGE2, and NO production,
  thereby decreasing inflammation. Furthermore, neferine inhibits mechanistic Target
  of Rapamycin (mTOR) activation, thereby reducing autophagy dysfunction
