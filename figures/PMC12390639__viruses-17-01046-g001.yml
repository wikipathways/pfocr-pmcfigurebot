figure_title: Proposed innate immune processes involving the N protein in host cells.
caption: Proposed innate immune processes involving the N protein in host cells. Retinoic
  acid-inducible gene I (RIG-I) and melanoma differentiation-associated gene 5 (MDA5)
  are activated upon sensing dsRNA in the cytoplasm of infected cells. RIG-I and MDA5
  initiate the mitochondrial antiviral signaling (MAVS) protein, thereby triggering
  a cascade of immune responses such as nuclear factor kappa B (NF-κB), interferon
  regulatory factor (IRF) 3, IRF7, and type I interferon (IFN-1) pathways. (a) SARS-CoV-2
  N protein interacts with the RIG-I protein through the enzymatic active DExD/H domain,
  repressing the inflammatory response. (b) SARS-CoV-2 N protein interplayed with
  the TRIM25 and blocked RIG-I-mediated IFN production. (c) It also inhibited IFN
  signaling by targeting tank-binding kinase 1 (TBK1) and prevented the nuclear translocation
  of IRF3. Stress granules (SGs) are formed in response to viral infection as a host
  antiviral strategy. (d) SARS-CoV-2 N protein suppresses antiviral SG formation by
  interacting with GTPase-activating protein-binding protein 1 (G3BP1). (e) SARS-CoV-2
  N protein undergoes LLPS with RNA during viral replication. (f) The formation of
  LLPS also inhibits SG assembly. (g) SARS-CoV-2 N protein also induces the expression
  of histone deacetylases 6 (HDAC6) to facilitate the interaction with G3BP1, thereby
  inhibiting the formation of SGs. (h) By sequestering growth arrest and DNA damage-inducible
  34 (GADD34) mRNA into the N+foci and inhibiting its interaction with G3BP1, SARS-CoV-2
  N protein further suppresses the transcription of IFN genes. (i) The SARS-CoV-2
  N protein also suppressed the innate antiviral immune response by inhibiting Lys63-linked
  polyubiquitination and aggregation of MAVS. (j) SARS-CoV-2 N protein modulates MAVS
  SUMOylation by enhancing the interaction between UBC9 and MAVS. (k) SARS-CoV-2 N
  protein furthers the process of NF-κB signaling response and mitogen-activated protein
  kinase (MAPK) signaling pathway through Toll-like receptor 2 (TLR2). (l) During
  the LLPS process, N protein recruits key kinases of NF-κB signaling, such as TAK1
  and IKK complex, increasing the possibility of the NF-κB activation. (m) The SARS-CoV-2
  N protein binds to the receptor for advanced glycation end products (RAGE) via its
  NTD and CTD, activating the extracellular signal-regulated kinases 1 and 2 (ERK1/2)–NF-κB
  pathway. Nucleotide oligomerization domain-like receptor family pyrin domain containing-3
  (NLRP3) functions in both inflammatory and antiviral responses. (n) SARS-CoV-2 infection
  promotes the activation of the NLRP3 inflammasome and caspase-1, (o) while GSDMD
  cleavage and pyroptosis are suppressed. RNA interference (RNAi) is a post-transcriptional
  gene silencing process. (p) SARS-CoV-2 N protein suppressed the RNAi in both initiation
  and effector steps by preventing siRNA biogenesis, RISC assembly, and target RNA
  cleavage, thereby evading the host inflammatory response. (q) Nonsense-mediated
  mRNA decay (NMD) is another antiviral mechanism involved in promoting mRNA regulation
  and degradation to prevent viral mRNAs translation. The SARS-CoV-2 N protein counteracts
  this mechanism by directly interacting with RNA helicase UP-frameshift-1 (UPF1)
  and UPF2. (r)The cystic fibrosis transmembrane conductance regulator (CFTR), a cAMP-dependent
  Cl− channel, regulates the host immune defense against pathogen infection. SARS-CoV-2
  N protein raises the intracellular Cl− concentration by downregulating CFTR expression
  and depleting intracellular cAMP by increasing the phosphodiesterase 4 (PDE4), and
  the high intracellular Cl− concentration induces the phosphorylation of serum glucocorticoid
  regulated kinase 1 (SGK1) and activates robust inflammatory responses. (s) SARS-CoV-2
  N protein is ISGylated by HERC5 ISGylation
