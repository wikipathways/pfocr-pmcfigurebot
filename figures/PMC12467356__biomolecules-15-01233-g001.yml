figure_title: The schematic diagram illustrates the cellular signaling pathways involving
  FAK.
caption: The schematic diagram illustrates the cellular signaling pathways involving
  FAK. It depicts the structure of FAK, highlighting the N-terminal FERM domain, which
  serves as the interaction site for integrins, growth factor receptors, and other
  molecules. The central kinase domain functions as the catalytic domain of the enzyme.
  The C-terminal region is identified as the protein interaction domain. Notably,
  Y397 serves as the primary site of autophosphorylation for FAK and is also crucial
  for mediating interactions with Src. The lower portion of the diagram illustrates
  the downstream signaling pathways regulated by FAK. FAK interacts with p53, facilitating
  FERM-mediated nuclear translocation of FAK and its subsequent binding to p53. This
  interaction promotes the binding of p53 to Mdm2, leading to the degradation of p53
  through the ubiquitin-dependent pathway and the inhibition of apoptosis. Additionally,
  the FAK/Rac/JNK pathway is involved in the regulation of gene expression, while
  the FAK/MAPK pathway is critical for controlling cell proliferation and cell cycle
  regulation
