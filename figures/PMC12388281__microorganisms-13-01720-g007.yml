caption: 'Putative metabolic pathway of A. succinogenes starting from glucose to the
  target product succinate and other by-products. The C4 metabolism is defined from
  oxaloacetate. The C3 metabolism is defined from pyruvate. Red numbers indicate enzymatic
  steps of the enzymes listed in Table 1. Alternative metabolic pathways which are
  not related to the products discussed in this paper are not shown, for simplification.
  Abbreviations: G-6-P, glucose-6-phosphate; F-6-P, fructose-6-phosphate; G-3-P, glyceraldehyde-3-phosphate;
  PEP, phosphoenolpyruvate; AcAld, acetaldehyde; AcP, acetyl phosphate; OAA, oxaloacetate.
  Scheme imported and modified from Tix et al. (2024) [28]'
