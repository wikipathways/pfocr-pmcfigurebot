figure_title: Animal models for mixed dementia.
caption: Animal models for mixed dementia. (Top Left) Pathophysiologic ramifications
  of chronic hypoxia introduced following a hypothetical stroke or other vascular
  pathology. Under the conditions of chronic hypoxia, various cellular and molecular
  features of Alzheimer's Disease pathophysiology are exacerbated and/or accelerated.
  (Top Right) Hypoxia introduces cellular oxidative stress—a redundant cellular pathomechanism
  in AD. Oxidative stress, tau pathology, and Aβ pathology are mutually interconnected
  via numerous mechanisms, as exemplified by glycogen synthase kinase 3β (GSK3β) 234
  . Aβ pathology can likely initiate GSK3β-mediated phosphorylation of tau protein
  and mitochondrial proteins, which presumably promotes tau pathology, mitochondrial
  dysfunction, and oxidative stress 235. Additionally, acute and chronic hypoxia mediate
  transcriptional regulation via hypoxia inducible factors (HIFs). HIF-mediated transcriptional
  regulation likely contributes to beneficial adaptation to chronic hypoxia in the
  cerebral tissue microenvironment by promoting angiogenesis via upregulation of genes
  in the VEGF pathway. However, HIF-mediated transcriptional regulation may also be
  considered maladaptive, as HIFs also promote Aβ pathology by upregulating expression
  and activities of enzymes involved in amyloid precursor protein (APP) processing,
  introducing a bias towards production of pathologically relevant Aβ peptides such
  as Aβ42. (Bottom) Various mixed dementia models can be conceived by incorporating
  aspects of AD models with an appropriate experimental paradigm that introduces chronic
  hypoxia, such as a device that limits vascular patency or chronic exposure to hypoxic
  conditions. However, careful design must be exercised for such models, as different
  AD models showcase different aspects of AD pathology variably across the animal
  lifespan. Time course, background genetic environment in the model, and expression
  pattern of a pathologically relevant human transgene all influence selection of
  a model and interpretation of results. As an example, with very few exceptions,
  relevant tau pathology does not naturally present over the lifespan of rodents without
  use of a transgenic animal featuring a pathologically relevant MAPT variant (e.g.
  P301L, P301S), gene knock-in design, or seed injection of synthetic oligomeric tau
  (oTau) or patient-derived tau. Modeling Aβ pathology can be achieved using transgenic
  animals and/or gene knock-in of mutant or variant human genes implicated in the
  amyloidogenic pathway, such as amyloid precursor protein 1(APP1) or presenilin-1
  (PSEN1). Additionally, synthetic oligomeric seed models (oAβ) and patient derived
  Aβ seeds have been successfully employed in animal models of AD. Other models include
  genetic knock-in of other pathologically relevant human genes that attempt to model
  other aspects of dementia such as neuroinflammation or Aβ clearance. These knock-in
  strategies usually are selected in an animal model that already produces tau or
  Aβ pathology, or both. Examples included are triggering receptor expressed on myeloid
  cells 2 (TREM2) KI and apolipoprotein E4 (APOE4) KI models. Systemic administration
  of lipopolysaccharide (LPS) may also be used to model neuroinflammation in an AD
  or MD model. Many other AD models could be used in a hypothetical mixed dementia
  model. Generally, an ideal animal model for MD would capture a pathophysiologic
  feature of AD that exhibits mechanistic synergy with a translationally relevant
  vascular pathological effect introduced as an independent variable which is counter-balanced
  by a control group in the experimental design. Created in BioRender. Wohlfeld, C.
  (2025) https://BioRender.com/fen8ank
