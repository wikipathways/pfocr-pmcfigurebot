figure_title: Weighted gene co-expression network analysis and functional enrichment.
caption: Weighted gene co-expression network analysis and functional enrichment. (A)
  Soft threshold at 12 ensures scale-free network topology. (B) Gene dendrogram identifying
  20 co-expression modules. (C) Correlation heatmap showing that the MEblue module
  is positively associated with M2 macrophages and Tregs and negatively associated
  with activated NK cells. (D) The risk score was positively correlated with the MEblue
  module (R=0.718, ***P<0.001). (E) Gene Ontology analysis of the MEblue module highlights
  enrichment in extracellular matrix organization and cell adhesion. (F) Kyoto Encyclopedia
  of Genes and Genomes analysis revealed enrichment of the PI3K-Akt, focal adhesion
  and MAPK signaling pathways
