figure_title: Temporal expression patterns of immune-related genes in T.
caption: Temporal expression patterns of immune-related genes in T. absoluta larvae
  infected with H. indica strain CQ7-2. (A) Heatmap showing the expression profiles
  of key genes from major immune signaling pathways (IMD, Toll, JAK/STAT, and JNK)
  across infection time points (0, 6, 12, and 18 hpi). Genes are grouped by their
  pathway affiliation. Expression values are Z-score normalized across time for each
  gene, with red indicating upregulation and blue indicating downregulation (B) Heatmap
  displaying the expression dynamics of immune effector genes, categorized by their
  function in signaling (clip-domain serine proteases and serpins), antimicrobial
  peptides (AMPs), lysozymes, encapsulation, and melanization. Expression values are
  Z-score normalized; colors indicate relative changes within each gene
