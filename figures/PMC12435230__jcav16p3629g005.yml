figure_title: KDM6B depends on STAT3 signaling and its demethylase activity to promote
  PD-L1 and CD8+ T-cell-attracting chemokine expression.
caption: 'KDM6B depends on STAT3 signaling and its demethylase activity to promote
  PD-L1 and CD8+ T-cell-attracting chemokine expression. (A) GSEA analysis of JAK/STAT
  signaling pathway enrichment in CRC patients with different KDM6B expression levels.
  (B) Western blot analysis of the expression of KDM6B, p-STAT3 and STAT3, and their
  statistical results in CT26-overexpressing MCS and KDM6B cells. (C) Western blot
  analysis of the expression of KDM6B, p-STAT3 and STAT3 in tumor tissues from mice
  implanted with CT26 cells overexpressing MCS or KDM6B, with statistical analysis
  of the data. (D) HCT116 cells overexpressing KDM6B or MCS were treated with a STAT3
  inhibitor (10 μM, 24 h), followed by RT-qPCR analysis of PD-L1, CCL5, CXCL9, and
  CXCL10 mRNA expression. (E) ChIP-qPCR analysis of the enrichment levels of H3K27me3
  on the promoters of PD-L1, CCL5, CXCL9, and CXCL10 in HCT116 cells overexpressing
  KDM6B or MCS. (F) Schematic illustration the regulation of KDM6B-mediated regulation
  of CD8+ T cells: KDM6B in CRC cells promotes PD-L1 and CD8+ T-cell-attracting chemokine
  expression via STAT3 signaling and its demethylase activity. The data are shown
  as the means ± SEMs of three independent experiments. *P < 0.05, **P < 0.01, ***P
  < 0.001'
