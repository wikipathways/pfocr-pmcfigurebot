figure_title: Gene ontology and pathway enrichment analysis of differentially expressed
  genes in the hind paws of CIA mice treated with rapamycin.
caption: Gene ontology and pathway enrichment analysis of differentially expressed
  genes in the hind paws of CIA mice treated with rapamycin. (A – C) Gene Ontology
  (GO) enrichment analysis performed using Enrichr for biological processes, molecular
  functions, and cellular components, respectively. (D – F) Pathway enrichment analysis
  using Enrichr for KEGG, Wiki, and Reactome pathways. The x-axis represents the enrichment
  score for each term, calculated as the negative log10 p-value. Significant terms
  are highlighted in bold. Results are categorized by functional annotation database
