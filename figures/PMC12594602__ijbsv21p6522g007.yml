figure_title: AHR complete with IKB-ɑ binding MTDH to suppress NF-kB activation.
caption: AHR complete with IKB-ɑ binding MTDH to suppress NF-kB activation. (A) Co-immunoprecipitation
  (Co-IP) assays showed the protein binding with AHR. (B) Immunoprecipitation of AHR
  and MTDH HGC27 cells lysates also showed positive binding between AHR and MTDH.
  (C) Immunoprecipitation of GAPDH, AHR and MTDH HGC27 cells lysates also showed positive
  binding between AHR and MTDH. (D) Co-immunoprecipitation (Co-IP) assays showed the
  protein binding with MTDH. (E) Mass spectrometry analysis demonstrated the protein
  MTDH. (F) Immunofluorescence (IF) used to confirm the binding of AHR and MTDH. (G)
  The protein-ligand interaction complex was generated by HDock. ChimeraX was used
  to visualize the AHR-MTDH complex and binding sites were displayed. (H) Western
  blot analysis of the inhibition of NF-kB signaling pathway through suppressing the
  phosphorylation of MTDH. (I) The relative protein expression levels of AGS and HGC27.
  Data were analyzed by two-way ANOVA; Means ± SD. ns p≧0.05, *p < 0.05, **p < 0.01,
  ***p < 0.001, ****p < 0.0001
