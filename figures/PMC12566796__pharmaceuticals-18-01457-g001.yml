figure_title: Overview of factors contributing to Aβ accumulation and aggregation
  pathways in AD.
caption: 'Overview of factors contributing to Aβ accumulation and aggregation pathways
  in AD. The left panel illustrates the key factors contributing to elevated Aβ levels
  in both familial and sporadic forms of Alzheimer’s disease (AD), reinforcing the
  amyloid cascade hypothesis. These include mutations in the APP gene, mutations in
  PSEN1 and PSEN2, which encode the catalytic subunits of γ-secretase (presenilins
  1 and 2), inheritance of the APOE ε4 allele, increased β-secretase 1 (BACE1) activity,
  and impaired Aβ clearance. The schematic illustrates APP cleavage pathways: in the
  non-amyloidogenic pathway, APP is cleaved by α-secretase, followed by γ-secretase,
  producing soluble APPα (sAPPα), a non-toxic peptide fragment p3 (17–40/42 amino
  acids), and the C-terminal fragment α (CTFα or C83). In contrast, the amyloidogenic
  pathway involves initial cleavage by β-secretase, yielding sAPPβ, followed by γ-secretase
  cleavage, which generates the Aβ peptide (1-40/42 amino acids) and C-terminal fragment
  β (CTFβ or C99). Excess Aβ can undergo clearance, degradation, or self-aggregation
  through several distinct pathways: (1) fibrillar aggregation pathway: U-shaped β-strand
  (β-hairpin) monomers aggregate via primary nucleation to form fibrillar oligomers
  and protofibrils; (2) off-pathway aggregation: irregular β-sheet monomers form disordered
  oligomers and nuclei, leading to the formation of non-toxic, irregular aggregates;
  and (3) amorphous aggregation: random coil, disordered monomers associate into non-structured
  tangles or amorphous aggregates. Secondary mechanisms that further influence Aβ
  aggregation include fibril elongation, fibril fragmentation (monomer-independent),
  and secondary nucleation (monomer-dependent), all of which are modulated by fibril
  concentration. With permission of Atanasova [23], copyright 2025 Pharmaceuticals'
