figure_title: Signaling pathway of EPSs under oxidative stress.
caption: 'Signaling pathway of EPSs under oxidative stress. After being absorbed through
  the intestinal epithelium, EPSs enter the cytosol and initiate protective intracellular
  responses. Oxidative stress leads to cellular damage, including lipid peroxidation,
  protein oxidation, and DNA damage. EPSs mitigate these effects by enhancing antioxidant
  defenses through two major mechanisms: (1) EPSs stimulate the enzymatic antioxidant
  system by promoting the activation of key antioxidant enzymes, such as superoxide
  dismutase (SOD), glutathione (GSH), and catalase (CAT), and genes regulated by AMP-activated
  protein kinase (AMPK), thereby reducing ROS levels and protecting against oxidative
  injury. (2) EPSs activate the non-enzymatic antioxidant pathway by modulating the
  nuclear factor erythroid 2 (Nrf2)-related signaling cascade. Under normal conditions,
  Nrf2 is bound in the cytoplasm by its repressor KEAP1, which facilitates its ubiquitination
  and degradation through the Cullin 3 (CUL3)/RBX1 E3 ligase complex. Upon stimulation
  by EPSs, the interaction between Nrf2 and KEAP1 is disrupted, leading to the release
  and stabilization of Nrf2. The released Nrf2 is translocated to the cell nucleus,
  where it heterodimerizes with small Maf proteins (sMaf) and binds to antioxidant
  response elements (AREs) in the promoter regions of target genes, inducing the expression
  of cytoprotective and detoxifying genes that are involved in maintaining redox homeostasis'
