figure_title: BLIMP-1–dependent transcriptional programs in human Tregs
caption: (A) Schematic of culture conditions and Cas9:single-guide RNA ribonucleoprotein
  (Cas9 RNP) delivery. (B) BLIMP-1 mRNA expression in control and PRDM1KO Tregs was
  measured by RT-PCR. Primers were designed to amplify a 910 bp region spanning exon
  2 (upstream of the sgRNA site) to exon 5 (downstream of the editing site). Knockout
  efficiency is shown. Units are bp. (C) Immunoblot analysis of BLIMP-1 protein. The
  black vertical lines on B and C indicate that lanes were run on the same gel or
  blot but were noncontiguous. (D–F) At 7 days posttransfection, Tregs were rested
  overnight in media and stimulated with anti-CD3/CD28 and IL-2 for 16 hours before
  RNA-Seq. (D) Volcano plot comparing gene expression in control and PRDM1KO Tregs.
  Genes with ≥1.5-fold change (FC) and FDR < 0.05 are colored in red. (E) Reactome
  pathway analysis of DEGs. (F) Representative gene set enrichment analysis (GSEA)
  plots illustrating transcriptional signatures in PRDM1KO versus control Tregs, using
  gene sets from Molecular Signatures Database (MSigDB) (Hallmark, KEGG, and Reactome).
  Normalized enrichment score (NES) and P value are indicated
article_title: BLIMP-1 and CEACAM1 cooperatively regulate human Treg homeostasis and
  function to control xenogeneic GVHD
