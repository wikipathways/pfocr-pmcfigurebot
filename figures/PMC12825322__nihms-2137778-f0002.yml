figure_title: Interleukin- and NLRP3-mediated mechanisms in postoperative neuroinflammation
  and cognitive impairment.
caption: Interleukin- and NLRP3-mediated mechanisms in postoperative neuroinflammation
  and cognitive impairment. Anesthesia and surgery upregulate IL-6, IL-1β, IL-17A,
  and NLRP3 while downregulating IL-33, engaging distinct receptor pathways to disrupt
  BBB integrity, activate p-STAT3 signaling, impair synaptic homeostasis, and induce
  neuronal degeneration. BMMs infiltration into the hippocampus promotes IL-6 elevation,
  sustaining neuroinflammation. IL-17A suppresses tight junction proteins and elevates
  MMP-2/9, leading to BBB leakage. IL-33 regulates synaptic plasticity via microglial
  modulation, with bidirectional effects depending on surgical context. IL-1β from
  microglia-derived exosomes directly drives neuronal and synaptic loss. NLRP3 inflammasome
  activation triggers caspase-1–dependent maturation of IL-1β/IL-18 and pyroptosis,
  amplified by peripheral immune cell infiltration, contributing to postoperative
  cognitive deficits
