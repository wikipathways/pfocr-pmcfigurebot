caption: 'Gene Set Enrichment Analysis (GSEA) revealing distinct functional pathway
  profiles for TMOD2 and DOCK4. (A) GSEA enrichment plots for TMOD2 showing the top
  five most significantly enriched pathways. Running enrichment scores (colored lines)
  indicate pathway activity across ranked gene lists, with positive scores representing
  pathway upregulation. Key enriched pathways include spliceosome (purple), cell cycle
  (red), proteasome (orange), DNA replication (green), and cell adhesion molecules
  (CAMs, blue). The barcode plot below shows gene positions within the ranked dataset,
  and the gray curve represents the ranking metric correlation. (B) GSEA enrichment
  plots for DOCK4 displaying the most significantly enriched pathways, including ribosome
  (orange), hematopoietic cell lineage (blue), intestinal immune network for IgA production
  (purple), cell adhesion molecules (CAMs, green), and chemokine signaling pathway
  (red). Both biomarkers demonstrate convergent enrichment in CAMs pathway, suggesting
  shared roles in cell–cell communication and epithelial integrity maintenance. Complete
  pathway enrichment results are provided in Supporting Information 1: Table S7'
