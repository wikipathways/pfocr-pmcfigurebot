figure_title: Plasma levels of 27-OH-C in the alternative pathway of bile acids synthesis
  stratified by BZF treatment as well as ALP (A), GGT (B) and Bil (C) levels in patients
  with PBC/PSC.
caption: Plasma levels of 27-OH-C in the alternative pathway of bile acids synthesis
  stratified by BZF treatment as well as ALP (A), GGT (B) and Bil (C) levels in patients
  with PBC/PSC. Stratification was conducted by ULN (ALP), and median value (GGT and
  Bil) in all patients with PBC/PSC. Gray and black bars indicate values in patients
  without and with BZF therapy, respectively. A single asterisk (*) and a sharp symbol
  (#) denotes a significant difference (P<0.05) and a trend toward statistical significance,
  respectively (non-parametric Dunnett’s t-test). ALP, alkaline phosphatase; BZF,
  bezafibrate; ULN, upper limit of normal; GGT, gamma-glutamyl transpeptidase; Bil,
  bilirubin; PBC, primary biliary cholangitis; PSC, primary sclerosing cholangitis
