figure_title: DOT1L signaling pathways map in different cancers.
caption: DOT1L signaling pathways map in different cancers. This multi-panel figure
  illustrates the context-specific mechanisms of DOT1L. (A) In MLL-leukemia, MLL fusion
  proteins recruit DOT1L to HOXA/MEIS1, increasing H3K79 methylation and driving oncogenic
  gene expression. (B) In breast cancer, DOT1L upregulates MTDH, activating the NF-κB-HIF1α
  axis to promote angiogenesis. (C) In lung cancer, a gain-of-function mutation, DOT1L(R231Q),
  enhances H3K79me2 on the RAF1 promoter, activating the MAPK/ERK pathway. (D) In
  gastric cancer, DOT1L promotes CD44 expression through the Wnt/β-catenin signaling
  pathway. MLL, Mixed-lineage leukemia; HOXA, homeobox A gene cluster; MEIS1, Meis
  homeobox 1; MTDH, metadherin; NF-κB, nuclear factor kappa B; HIF1α, hypoxia-inducible
  factor 1-alpha; DOT1L(R231Q), DOT1L with arginine to glutamine mutation at position
  231; RAF1, rapidly accelerated fibrosarcoma 1; MAPK/ERK, mitogen-activated protein
  kinase/extracellular signal-regulated kinase; Wnt/β-catenin, Wingless-related integration
  site/β-catenin signaling pathway; CD44, cluster of differentiation 44
