figure_title: Characterization of the IPF-induced therapeutic gap
caption: '(A) Heatmap showing enrichment of prioritized GO terms in the IPF-induced
  gap (i.e., genes induced in untreated IPF but not repressed by either antifibrotic)
  in each cell type. GO terms were prioritized as described in the text. Color palette
  represents −log10p enrichment scale from p adj < 0.05 (yellow) to p adj <1E-25 (red);
  blue indicates no significant enrichment. Panels B-F indicate induction in untreated
  IPF vs. control of genes mapped to the following gap-prioritized GO terms: (B) cell-cell
  junction in AT2 cells; (C) T cell receptor signaling pathway in TCD8s; (D) cell
  leading edge in MACMONDs; (E) collagen-containing extracellular matrix in MFBs;
  (F) endothelial cell development in CAPAs. Full data are in table S8. (G) Scatterplot
  comparing TF rankings in the untreated IPF-induced (x axis) and IPF-induced gap
  (y axis) pan-Atlas regulatory networks. Full data are in table S11. (H) Regulatory
  network plot for the IPF-induced gap in Atlas IPF alveolar fibroblasts'
article_title: Single cell transcriptomics in a treatment-segregated cohort exposes
  a STAT3-regulated therapeutic gap in idiopathic pulmonary fibrosis
