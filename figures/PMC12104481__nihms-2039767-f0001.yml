figure_title: The anti-proliferation activity of enzalutamide and KRLS-017 against
  TNBC cells and potential targets to enhance the anti-proliferation activity of enzalutamide
  identified using high-throughput RNAi screening
caption: A, Expression levels of AR, CDK7, and c-MYC in TNBC cell lines were determined
  by Western blotting. β-Actin was used as the loading control. B, Enzalutamide was
  more effective at inhibiting proliferation of TNBC cells expressing high-levels
  of AR than TNBC cells expressing low-levels of AR. The anti-proliferation activity
  of enzalutamide was determined using a sulforhodamine B staining assay following
  a 5-day treatment. Data are presented as mean ± standard deviation. C, High-throughput
  RNAi screening identified 93 genes in a 2-dimensional (2D) culture and 323 genes
  in a 3-dimensional (3D) culture whose knockdown by siRNA enhanced the anti-proliferation
  activity of enzalutamide against SUM185 cells. Furthermore, 64 genes were commonly
  identified from both 2D and 3D culture screening. D, Identified pathways whose inhibition
  enhanced the anti-proliferation effect of enzalutamide. E, An ingenuity pathway
  analysis identified the PI3K/Akt/mTOR and cycle regulation pathways as the top candidates
  whose inhibition enhanced the anti-proliferation effect of enzalutamide. F, KRLS-017
  was not effective at inhibiting proliferation of TNBC cells. The anti-proliferation
  activity of KRLS-017 was determined using a sulforhodamine B staining assay following
  a 5-day treatment. Data are presented as mean ± standard deviation
article_title: Targeting CDK7 enhances the antitumor efficacy of enzalutamide in androgen
  receptor-positive triple-negative breast cancer by inhibiting c-MYC–mediated tumorigenesis
