figure_title: HDV sensing and interferon response.
caption: HDV sensing and interferon response. HDV enters hepatocytes by binding to
  heparan sulfate proteoglycans (HSPGs), followed by entry via the sodium/taurocholate
  co-transporting polypeptide (NTCP). After internalization, the ribonucleoprotein
  (RNP) is recognized by melanoma differentiation-associated protein 5 (MDA5) and
  laboratory of genetics and physiology 2 (LGP2). The caspase activation and recruitment
  domains (CARD1 and CARD2) of MDA5 mediate the recruitment of the mitochondrial antiviral
  signaling protein (MAVS) to initiate signal transduction that activates IFN regulatory
  factor 3/7 (IRF3/7) and nuclear factor-κB (NF-κB). These transcription factors translocate
  to the nucleus and induce the transcription of IFN-β and IFN-λ. Secreted IFNs then
  bind to their receptors in an autocrine and paracrine manner to activate JAK/STAT
  signaling. This pathway leads to the nuclear translocation of the interferon-stimulated
  gene factor 3 (ISGF3), which binds to interferon-stimulated response elements (ISREs)
  to initiate interferon-stimulated genes (ISGs) transcription. Figure created in
  BioRender. Lupberger, J. (2026) https://BioRender.com/7izhn5f
