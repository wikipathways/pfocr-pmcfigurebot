caption: Convergent pathway enrichment between YAPC LGALS3 knockout transcriptomes
  and LGALS3-correlated genes in TCGA-PAAD. Hierarchical clustering of Gene Ontology
  (GO) and pathway enrichment scores for differentially expressed genes from YAPC
  pancreatic cancer cells following CRISPR/Cas9-mediated knockout of LGALS3, together
  with genes significantly correlated with LGALS3 expression in TCGA-PAAD. The heatmap
  cells are colored by their p-values and significant terms are hierarchically clustered
  based on their statistical similarities
