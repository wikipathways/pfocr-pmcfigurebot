figure_title: Shared astrocyte CNS molecular signatures and mechanisms from different
  CNS areas of the mouse that provide clues to how astrocytes regulate neurons
caption: (A) Approach for astrocyte-specific RNA-seq using RiboTag mice 78 crossed
  with astrocyte selective Aldh1l1-CreERT2 mice. 79(B) Multidimensional scaling plot
  for input and immunoprecipitated RNA-seq data.(C) Heatmap showing the log2 FPKM
  values of the top 50 most enriched astrocyte genes shared in the 13 CNS regions
  (CB, cerebellum; DSC, dorsal spinal cord; HB, hindbrain; HIP, hippocampus; HY, hypothalamus;
  MB, midbrain; MCX, motor cortex; OB, olfactory bulb; SCX, somatosensory cortex;
  STR, striatum; TH, thalamus; VCX, visual cortex; VSC, ventral spinal cord). The
  bar graph shows the average ratio of immunoprecipitation (IP) versus input. Colored
  arrowheads indicate functional class (see D).(D) Bar graph showing the top 25 ingenuity
  pathway analysis (IPA) canonical pathways for the 825 shared astrocyte-enriched
  genes across regions with a threshold of p value < 0.05. The colored arrowheads
  indicate functional classes that are mostly related to metabolism. The figure is
  reproduced from Endo et al. 50 and illustrates pathways and genes shared across
  astrocytes from major CNS regions
