figure_title: High intracellular metabolic activity and extracellular stressors drive
  the creation of reactive oxygen species (ROS).
caption: High intracellular metabolic activity and extracellular stressors drive the
  creation of reactive oxygen species (ROS). ROS upregulate PARP and its product PAR,
  which triggers apoptosis through the release of apoptosis-inducing factor (AIF)
  from the mitochondrial membrane. ROS also causes damage to complex 1 of the electron
  transport chain, leading to the release of further pro-apoptotic species from the
  mitochondrial membrane (bax, bim, cytC). Cell apoptosis induces pro-inflammatory
  cytokines, which drive the conversion of protective microglia to pro-apoptotic microglia,
  perpetuating cell apoptosis. Mitophagy protects against apoptosis through the breakdown
  of diseased mitochondria. This process is mediated by PINK1, which tags diseased
  mitochondria for ubiquitination by PARKN ligase. Blue = protective pathway; Red
  = Pathological Process
