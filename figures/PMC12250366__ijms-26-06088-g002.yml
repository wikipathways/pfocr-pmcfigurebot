figure_title: Proteins associated with the TGF-β1 pathway and inflammatory response.
caption: 'Proteins associated with the TGF-β1 pathway and inflammatory response. Western
  blots of a variety of proteins relating to heart failure from the tachycardia-induced
  pacing are depicted in (A). Western blot expression in furosemide-treated animals
  found elevated TGF-β1 and TGF- β receptor1 endogenously (B,C) and plasma level of
  TGF-β1 proteins to be elevated shown in (D), and the data shown as mean ± SEM, p
  ≤ 0.05. Similarly, a Western blot data for Smad-2 and Smad-3 are shown in (E–G),
  which are significantly increased in furosemide-treated animals compared with saline-treated
  and control animals, and the data shown as mean ± SEM, p ≤ 0.05, (* = statistically
  different from control group, # = statistically different between furosemide HF
  and saline HF group)'
