figure_title: The non-canonical NF-κB pathway is activated in iMK2-KO cells (protein).
caption: The non-canonical NF-κB pathway is activated in iMK2-KO cells (protein).
  (a–c) Compared to iMK2- KO +MK2 cells, untreated (UT) iMK2-KO +GFP cells have higher
  levels of the non-canonical proteins RelB and NF-κB2 in nuclear and cytoplasmic
  fractions, but not of the canonical RelA and NF-κB1 proteins. Following IL-1α treatment
  (5 ng/mL, 2 h), the nuclear fraction of iMK2-KO cells showed elevated protein levels
  of RelB, NF-κB2, RelA, and NF-κB1. p53 and GAPDH serve as controls for successful
  nuclear/cytoplasmic separation. EF2 acts as a general control, used for normalization.
  (d,e) The basal protein level of TRAF2 is reduced in whole-cell lysis of iMK2-KO
  +GFP cells, whereas TRAF3 and cIAP1/2 are not changed. (f) The protein level of
  c-Rel is increased in iMK2-KO+GFP cells. Examples of Western blots from different
  gels are shown. Mean ± SEM, Student’s t-test, * p < 0.05, ** p < 0.01, *** p < 0.001
