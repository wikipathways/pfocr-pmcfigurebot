figure_title: The gene regulatory network of the TaSRS gene family in wheat.
caption: 'The gene regulatory network of the TaSRS gene family in wheat. Network Diagram
  (a) illustrates the protein interaction network. Nodes represent individual proteins,
  with node labels indicating the names of these proteins. The patterns within the
  nodes depict the three-dimensional structures of the proteins; an empty pattern
  indicates that the structure is currently unknown. Interactions between proteins
  are indicated by connecting lines, with the color of the line reflecting the type
  of interaction: yellow lines signify text-mining evidence, while purple lines indicate
  experimentally validated interactions. In Network Diagram (b), KEGG pathway enrichment
  is represented. The False Discovery Rate (FDR) indicates the adjusted significance
  level, while the Gene Count represents the number of genes enriched in a particular
  pathway. The FDR values range from 1.0 × 10−6 (highly significant) to 1.0 × 10−2
  (relatively less significant), indicating that the pathways depicted in the figure
  span from highly significant to moderately significant'
