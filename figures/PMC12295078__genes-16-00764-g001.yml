figure_title: Toll-like receptor (TLR) signaling pathways involved in the innate immune
  response.
caption: Toll-like receptor (TLR) signaling pathways involved in the innate immune
  response. TLRs recognize pathogen components and activate intracellular pathways
  leading to immune gene expression. TRL-1, -2, -5, and -6 are present on the surface
  and recognize bacterial components, whereas TLR-3, -7, and -9 are in the endosomes
  and recognized nucleic acids. NF-kB pathway leads to the production of inflammatory
  cytokines (TNF, IL-1, IL6), chemokines (CCL2 and CSCL8), and other immune-stimulating
  molecules, such as CD80 or CD86. IRF pathway stimulates the transcription of type
  I interferon genes, key in antiviral immunity [44]
