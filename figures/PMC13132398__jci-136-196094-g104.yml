figure_title: Multi-omics analysis reveals 1C metabolism dysregulation and reduced
  SHMT2 expression in HD models
caption: '(A) Principal component analysis (PCA) of metabolomic profiles in HdhQ7
  and HdhQ111 cells. (B) Volcano plot showing substantially altered metabolites in
  HdhQ111 cells relative to HdhQ7 cells. One-carbon metabolism–related metabolites
  are highlighted. (C) Pathway enrichment analysis of markedly altered metabolites
  between HdhQ7 and HdhQ111 cells. (D) Volcano plot of DEGs in HD-hSOs (HD42) versus
  control hSOs (RC01001-A), showing widespread transcriptional alterations. (E) GSEA
  (GO Biological Process) showing pathway changes in HD-hSOs. (F) GSEA enrichment
  plot for the 1-carbon metabolic process gene set. (G) Immunoblot analysis of SHMT2
  protein levels in hSOs derived from HD patient iPSCs (HD42) and iPSCs from a control
  line (ihtc-03) at D30 and D60 (n = 3). (H) Immunoblot analysis of SHMT2 protein
  levels in additional hSOs derived from HD patient iPSCs (HD66 and HD40) and control
  iPSCs (IMR90-4 and RC01001-A) at D30 (n = 3). (I) Soluble and insoluble HTTEx1-Q23/Q73
  in control and SHMT2-knockdown HdhQ7 cells transfected with Myc-tagged HTTEx1-Q23
  or HTTEx1-Q73 for 48 hours (n = 3). (J) Representative immunofluorescence images
  and quantification of polyQ aggregates in control and SHMT2-knockdown HdhQ7 cells
  transfected with GFP-tagged HTTEx1-Q23 or HTTEx1-Q73. Arrows indicate visible aggregates
  (scale bar: 20 μm; n = 3). Data are shown as the mean ± SEM. Unpaired t test was
  used for G, nested t test was used for H, and 1-way ANOVA with Tukey’s test was
  used for I and J. *P < 0.05, **P < 0.01, ****P < 0.0001'
