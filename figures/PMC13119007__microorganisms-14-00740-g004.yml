figure_title: 25-Hydroxycholesterol (25HC) downregulates the SREBP2-mediated cholesterol
  biosynthesis pathway.
caption: 25-Hydroxycholesterol (25HC) downregulates the SREBP2-mediated cholesterol
  biosynthesis pathway. (A) Effect of 25HC on gene expression. PK-15 cells were treated
  with the indicated concentrations of 25HC for 6 h. The mRNA levels of SREBP2 and
  its downstream target HMGCR were quantified by qRT-PCR, and protein levels were
  determined by Western blotting. β-actin was used as a loading control. (B) Visualization
  of intracellular cholesterol distribution. Cells were treated with 25HC (2 μM) for
  6 h, fixed, and stained with Filipin (blue) to detect free cholesterol. Scale bar
  = 20 μm. Note the accumulation of cholesterol in the intracellular compartment and
  reduction in plasma membrane cholesterol compared to the EtOH control. Data are
  presented as mean ± SD (n = 3). Statistical significance was analyzed by Student’s
  t-test
