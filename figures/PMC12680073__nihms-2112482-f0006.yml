figure_title: Analysis of differentially expressed proteins (DEPs) using STRING
caption: The STRING database was used for network analysis of the hTau vs WT, hTau/PKO
  vs hTau, and hTau/ParkinW402A vs hTau DEPs. The k-means clustering method was used
  under a high confidence interaction score (min. Interaction score = 0.7). (A) Network
  representation for the top upregulated and downregulated cluster of proteins in
  the hTau vs WT comparison. (B) Network representation for the top upregulated and
  downregulated cluster of proteins in the hTau/PKO vs hTau comparison. (C) Network
  representation for the top upregulated and downregulated cluster of proteins in
  the hTau/ParkinW402A vs hTau comparison. n = 5 mice per group. The Gene Ontology
  Biological Process (GO BP), KEGG, and Reactome databases were used to identify changed
  pathways
article_title: The absence of Parkin in hTau mice leads to synaptic mitochondrial
  dysfunction, alterations to the synaptic proteome, and increased phosphorylated
  tau in the Hippocampus
