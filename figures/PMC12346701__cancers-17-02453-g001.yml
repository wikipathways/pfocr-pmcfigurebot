figure_title: The cell regulation of KRAS protein.
caption: 'The cell regulation of KRAS protein. When these receptors are activated,
  guanine nucleotide exchange factors (GEFs) promote GDP-GTP exchange on Ras, switching
  it to an active state. It is inactivated when GTP is hydrolyzed to GDP, a process
  sped up by GTPase-activating proteins (GAPs). Ras mutations are commonly selected
  in cancer because Ras activates multiple effector pathways that promote oncogenic
  transformation. These include the MAPK cascade (RAF–MEK—ERK), PI3K/AKT/mTOR, and
  Ral guanine nucleotide exchange factors pathway [31,34,35,36,37,38]. Abbreviations:
  KRAS—Kirsten rat sarcoma viral oncogene; RTK—receptor tyrosine kinase; GAPs—GTPase-activating
  proteins; GEFs—guanine nucleotide exchange factors; GDP—guanosine diphosphate; GTP—guanosine
  triphosphate; RAF—rapid fibrosarcoma; ERK—extracellular signal-regulated kinase'
