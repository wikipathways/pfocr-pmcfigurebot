caption: Physical risk pathway and scenario tree for the introduction and transmission
  of foot-and-mouth disease virus (FMDV) to dairy farms via raw milk transportation
  in Ban Thi District, Lamphun Province, Thailand. The diagram illustrates the sequential
  events of FMDV entry and exposure, categorized into entry assessment (from an infected
  farm to the milk collection center) and exposure assessment (from the milk collection
  center to another dairy farm). The scenario tree details specific likelihoods (L1–L12)
  at each critical juncture of the pathway
