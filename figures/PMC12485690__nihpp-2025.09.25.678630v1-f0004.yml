figure_title: Latent factorization uncovers a 105-gene consensus human neurodegenerative
  disease-associated microglial (hnDAM) signature
caption: Microglial gene expression programs were defined using cNMF83 (see “Microglia
  signature discovery via latent factorization”). (A) GEPs uniquely enriched in subtypes
  associated with NDD diagnoses were apparent from three of the four discovery studies.
  Notably, no GEP from NM_2024 was specific to DAM subtypes (see Fig. S9D). (B) Genes
  were prioritized from Gerrits_2022_GEP5, Mathys_2024_GEP3, and Pineda_2024_GEP5
  by z-scoring eigenvalues within respective GEPs. Z-scores for each gene were averaged
  across study to define the hnDAM signature (105 genes, average z-score > 5). (C-D)
  Expression of hnDAM genes across microglial subtypes shows enrichment in three DAM
  subtypes. Expression was computed using the AverageExpression() function in Seurat,
  and z-scored across subtypes (C), or a module score was assigned to each cell using
  the AddModuleScore() function (D). (E) Comparison of hnDAM to human16,28,29 and
  mouse30,31 AD-related microglial states highlight core drivers of disease-association.
  (F) GO enrichment of hnDAM signature is significantly enriched for lipid-related
  pathways (BH < 0.05) reduced using rrvgo102. See the supplementary information for
  a summary of all enrichment analyses (see Table S34). (G) Variance of hnDAM explained
  by expression of transcription factors within hnDAM (MITF, PPARG, ARID5B, MAFB)
  and putatively controlling microglia states16,86,87 (CEBPA, SPI1). Variance partitioning
  performed in vegan85 conditioning on the respective expression of other transcription
  factors (see “hnDAM transcription factor analysis”) with covariates for age and
  sex (*** FDR < 0.001, ** FDR < 0.01, * FDR < 0.05)
