figure_title: Transcription Factors in Skeletal Muscle Nuclear Proteome
caption: 'A-B) Gene Ontology: Cellular Compartment analysis of proteins identified
  in whole muscle (A) and nuclei (B), with the number of proteins enriched in each
  compartment beside each bar. C) Venn diagram of proteins enriched in “Nucleus” compartment
  from whole muscle (blue) and nuclei (green) in A and B. Relative percentages of
  nuclear compartment enriching proteins in whole muscle (35%) and nuclei (66%) are
  displayed below venn diagram. D) Pie graphs for the top 4 molecular functions from
  Gene Ontology Analysis and percent distribution of proteins in whole muscle (blue),
  shared between whole muscle and nuclei (black), and exclusively identified in nuclei
  (green). The total number of proteins enriched in each pathway is noted beside each
  pie graph. Horizontal bar graphs show the number of proteins that are shared between
  nuclei and whole muscle that are more abundant in nuclei (blue) or whole muscle
  (red). E) Ranked order of identified sequence-specific DNA Binding proteins (i.e.,
  Transcription Factors) based on their log mean intensity. Graph includes factors
  shared between whole muscle and “post-sucrose” nuclei (blue) and factors exclusively
  identified in “post-sucrose” nuclei (green). Whole muscle proteome is taken from
  (24)'
article_title: Alterations of the skeletal muscle nuclear proteome after acute exercise
  reveals a post-transcriptional influence
