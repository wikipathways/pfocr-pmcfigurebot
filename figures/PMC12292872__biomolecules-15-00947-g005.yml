figure_title: MC-LR induces sepsis through the ferroptosis pathway.
caption: MC-LR induces sepsis through the ferroptosis pathway. MC-LR exposure inhibits
  the Nrf2/GPX4 pathway, leading to Fe2⁺ accumulation and triggering ferroptosis in
  intestinal epithelial cells. MC-LR enters renal cells via OATP, suppresses GPX4
  expression, reduces GSH production, exacerbates mitochondrial lipid peroxidation,
  and promotes ferroptosis in renal cells. Simultaneously, MC-LR activates the Erk/MAPK
  pathway, causing Fe2⁺ accumulation and increased ROS in brain glial cells, contributing
  to sepsis-related diseases
