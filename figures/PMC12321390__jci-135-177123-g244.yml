  and endoMT-related genes and (E) collagen contraction assay quantification in SVEC4-10
  cells treated with control, ANGPTL2, and ANGPTL2 + XAV-939. Scale bar: 10 μm. Data
  are shown as mean ± SEM; P values were calculated using 1-way ANOVA followed by
  Tukey’s post hoc analysis for multiple group comparisons. *P < 0.05, **P < 0.01,
