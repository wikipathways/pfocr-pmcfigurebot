caption: '(A) qPCR analysis of mRNA levels of vasculopathy and endoMT-related genes
  and (B) collagen contraction assay quantification in SVEC4-10 cells treated with
  control, ANGPTL2, and ANGPTL2 + ATN-161. (C) Staining for β-catenin (green) in control
