figure_title: Effect of cASC secretome on NFκB signaling activity in RAW264.
caption: Effect of cASC secretome on NFκB signaling activity in RAW264.7 cells. The
  NFκB signaling pathway was activated using LPS at a concentration of 10 ng/mL, followed
  by treatment with SEC 3D, concentrated SEC 3D 5× or SEC 2D. Values represent the
  means from five independent experiments ± SD. Results are expressed as fold change
  relative to the positive control (LPS). The negative control (NC) corresponds to
  non-activated macrophages without LPS stimulation. Statistical significance was
  calculated in comparison to positive control (LPS) consisting of RAW264.7 macrophages
  stimulated with LPS. ** p < 0.01, *** p < 0.001, one-way ANOVA followed by Dunnett’s
  post hoc test
