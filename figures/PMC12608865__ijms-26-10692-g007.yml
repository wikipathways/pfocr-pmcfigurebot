figure_title: ECS-mediated pronociceptive modulation in the spinal DH.
caption: 'ECS-mediated pronociceptive modulation in the spinal DH. (A) Nociceptive
  projection neurons: CB1R activation facilitates substance P release from primary
  afferents, evidenced by NK1 receptor internalization. Prolonged CB1R stimulation
  induces receptor desensitization and downregulation, diminishing antinociceptive
  capacity. TRPV1 activation in nociceptive neurons triggers Ca2-dependent signaling
  pathways (CaMKII, PKC, MAPK/ERK), enhancing channel phosphorylation and promoting
  NF-κB-dependent production of pro-inflammatory mediators. (B) Interneurons: Activation
  of CB1R on inhibitory interneurons reduces GABA/glycine release, thereby inducing
  synaptic disinhibition. TRPV1 activation on GABAergic interneurons triggers Ca2-dependent
  LTD of excitatory inputs, reducing inhibitory tone onto STT projection neurons and
  facilitating nociceptive transmission. (C) Microglia: M1 phenotype release pronociceptive
  mediators (TNF-α, IL-1β, IL-6, BDNF, CCL2, CXCL1) that enhance dorsal horn neuron
  excitability. P2X4/P2X7 and TLR4 overexpression, along with intracellular cascades
  (p38 MAPK, ERK1/2, JNK, NLRP3), consolidate the M1 phenotype. Pathological CB2R
  activation induces desensitization and impaired phagocytosis via ERK/AKT-Nurr1.
  Microglial TRPV1 activation promotes ROS production and upregulation of IL-1β and
  TNF-α. (D) Astrocytes: A1 phenotype upregulate inflammatory mediator receptors,
  enhance connexin-43 gap junctions, downregulate GLT-1, causing glutamate accumulation,
  and release pronociceptive mediators. Astrocytic CB1R and TRPV1 activation elevate
  intracellular Ca2+, triggering the release of gliotransmitters and pro-inflammatory
  mediators'
article_title: 'Dual Role of the Spinal Endocannabinoid System in Response to Noxious
  Stimuli: Antinociceptive Pathways and Neuropathic Pain Mechanisms'
