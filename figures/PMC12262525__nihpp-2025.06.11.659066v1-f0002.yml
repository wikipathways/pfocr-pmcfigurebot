figure_title: Galactose induces oxidative phosphorylation and increases Cu content
  and allocation to CuCOX in 786-O RCC cells
caption: A, Schematic representation of the Leloir pathway converting galactose into
  glucose. B, OCR and mitochondrial ATP production in response to 48 h treatment with
  galactose (red) as compared to glucose (black) (three biological replicates). C,
  SEC-ICP-MS chromatograms of Cu (top) and corresponding UV-vis absorbance plots in
  lysates from 786-O cells treated with 10 mM glucose or galactose for 48 h. D, Box
  whiskers show quantification of Cu allocated to CuCOX and MTs, and total Cu content
  in lysates from 786-O cells grown in glucose- or galactose-containing media (7 biological
  replicates with two technical replicates for each). E, Western blot of total input
  lysates and CuCOX eluates from 786-O grown in glucose or galactose media. F, Schematic
  model of mitochondrial electron transport chain along with localization of inhibitors
  for each complex. G, Quantification of SEC-ICP-MS peaks corresponding to Cu in CuCOX
  and MTs, and total Cu in lysates of 786-O cells treated with media containing glucose,
  galactose, or galactose with the indicated electron transport chain inhibitors added
  for 3 h before collection. ROT, rotenone (200 nM, 3 biological replicates in technical
  duplicates), IACS, IACS-10759 (1nM, 3 biological replicates in technical duplicates),
  MET, metformin (25 mM, 3 biological replicates in technical duplicates), AM, antimycin
  A (1nM, 4 biological replicates in technical duplicates), MYX, myxothiazol (1 nM,
  4 biological replicates run in technical duplicates), KCN, potassium cyanide (0.5
  mM, 4 biological replicates in technical duplicates), NaN3, sodium azide (0.5 mM
  4 biological replicates in technical duplicates). Box-and-whisker plots displayed
  the median, minimum and maximum values, and all individual data points. All P values
  were calculated using a two-tailed t-test
