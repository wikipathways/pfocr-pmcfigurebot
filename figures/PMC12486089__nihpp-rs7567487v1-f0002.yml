figure_title: Peripheral blood metabolite analysis of cohort A
caption: '(A) The peripheral blood level of L-tryptophan (Trp) and L-kynurenine (Kyn)
  were measured by HPLC-MS/MS using serum samples collected at designated time points
  of the trial. BL: baseline (n=11); C1: cycle 1 day 1 of the maintenance phase (n=10);
  C3: cycle 3 day 1 of the maintenance phase (n=7); C5: cycle 5 day 1 of the maintenance
  phase (n=4); EOT: end of treatment of the maintenance phase (n=4). Comparison of
  Trp/Kyn ratios between (B) BMS-986205 dosing arms and (C) long- vs. short-term survivors.
  Samples size for each group is shown in paratheses. (D)Comparison of serum-derived
  major Trp-Kyn pathway metabolites between baseline (BL, n=10) and on-treatment (C1,
  n=10). (E) Non-parametric Spearman correlations assessing baseline (BL) serum metabolites
  vs. future survival time. Blue: negative correlation; red: positive correlation.
  (F) Two serum metabolites show a significant correlation with survival in the baseline
  sample analysis. (G) Non-parametric Spearman correlations assessing on-treatment
  (C1) serum metabolites vs. future survival time. Blue: negative correlation; red:
  positive correlation. (H) One serum metabolite, quinolinic acid, shows a significant
  correlation with survival in the on-treatment sample analysis. * P<0.05'
