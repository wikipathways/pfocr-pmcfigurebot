figure_title: Disrupting kms1 upregulates mutagenic DSB repair
caption: A) Analysis of Rad52-GFP foci. ~50% of rad51Δ cells have a Rad52-GFP focus.
  When kms1 is also lost from a rad51Δ background, the number of foci decreases to
  ~25–30% (p=0.0158 by one way ANOVA with Tukey correction for multiple comparisons).
  B) Representative micrographs of Rad52-GFP foci in WT, kms1Δ, rad51Δ, and kms1Δrad51Δ
  cells. C) The assay to measure the rate of alternative repair pathway usage. D)
  Loss of the cNHEJ ligase Lig4 causes a trend of a decrease in the rate of loss of
  ura4, suggesting Lig4 is involved in this pathway. Although this finding approached
  statistical significance on an ANOVA with a Dunnett correction for multiple comparisons
  (p=0.053), a pairwise t-test revealed a p value of p=0.0151. Loss of pku70 has no
  effect, indicating that protection of DSB ends is dispensable in this context. However,
  loss of kms1 leads to an increase in the rate of loss of ura4 (p<0.0001 by one-way
  ANOVA with Dunnett correction for multiple comparisons), indicating that Kms1 restrains
  the use of this alternative pathway. Data points are the natural log of the fold
  change in rate. ). * indicates p < .05; ** indicates p < .01; *** indicates p <
  .001; **** indicates p<.0001
