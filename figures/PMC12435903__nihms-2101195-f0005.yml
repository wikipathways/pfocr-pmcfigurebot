figure_title: The Ubiquitin Activation and Transfer Pathway
caption: Ubiquitination is a stepwise process that tags proteins with ubiquitin. The
  cascade begins with ATP/Mg2+-dependent adenylation of ubiquitin by an E1 enzyme,
  forming a Ub-AMP intermediate. A thioester bond is then formed between the active-site
  cysteine of E1 and the Ub C-terminus. Ubiquitin is then transferred to an E2 conjugating
  enzyme through a thioester bond. Finally, an E3 ligase brings the E2~Ub complex
  and the target protein together, facilitating the transfer of ubiquitin onto specific
  lysine residues of the substrate
