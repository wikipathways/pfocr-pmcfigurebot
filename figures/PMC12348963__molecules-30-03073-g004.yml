caption: (a) Optimized structures of key intermediates and transition states involved
  in the radical-rebound (top, blue dashed boxes) and concerted (bottom, magenta dashed
  boxes) pathways for methane oxidation to methanol. Only the most stable configurations
  of CH4 and CH3OH are shown and are highlighted in black to indicate that they are
  common to both pathways. (b) Free energy profiles of methane oxidation on Cu2O@C2N
  via the radical-rebound (blue) and concerted (magenta) mechanisms. Energies are
  referenced to CH4 and the catalyst surface. An asterisk (*) represents adsorbed
  species
