figure_title: Mechanism of MMP-2-responsive nanosystem for synergistic ferroptosis-immunity
  antitumor therapy.
caption: Mechanism of MMP-2-responsive nanosystem for synergistic ferroptosis-immunity
  antitumor therapy. This schematic illustrates how an MMP-2-activated nanosystem
  enhances brain tumor treatment. The hyaluronic acid-targeted nanocarrier crosses
  the blood-brain barrier and accumulates in the tumor, where it responds to MMP-2
  to release a bispecific antibody (BsAb) and an epigallocatechin gallate derivative
  (dEGCG). Together with T cell-derived IFN-γ, dEGCG induces ferroptosis by inhibiting
  the GPX4/Xc⁻ pathway, leading to damage-associated molecular pattern (DAMP) release.
  This promotes dendritic cell (DC) maturation and antigen presentation, establishing
  a positive feedback loop that enhances T cell activation and synergistically inhibits
  tumor growth
