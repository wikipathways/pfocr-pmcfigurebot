caption: 'Scattering crosstalk measured by a CMOS image sensor placed in the detection
  pathway for highly anisotropic brain tissue at depths (a), (d), (g), and (j) 0 μm;
  (b), (e), (h), and (k) 30 μm; and (c), (f), (i), and (l) 100 μm when illuminated
  with a single beam corresponding to the SiPM #3 detection path. (a)–(c) Two-photon
  fluorescence images of brain tissue captured with only one excitation path for the
  respective depths. (d)–(f) CMOS images show crosstalk onto adjacent channels and
  (g)–(i) show the corresponding contrast enhanced images. (j)–(l) Light collected
  across the 4 SiPM active areas is plotted, showing increased crosstalk as depth
  increases due to the strong forward scattering in brain tissue resulting in a long
  transport mean-free path length'
