figure_title: PTH regulates the Hippo pathway in W-20 cells
caption: '(A) Visualization of bulk RNA-Seq data with PCA plot of gene expressions.
  (B) Volcano plot of differentially regulated genes. Genes significantly upregulated
  and downregulated by PTH are in salmon and blue, respectively. (C) Heatmap of significantly
  differentially regulated YAP-related genes and (D) Hippo signal–related genes. (E)
  Heatmap of significantly up- or downregulated pathway terms by PTH stimulation.
  (F) Expression of selected YAP target genes with or without PTH treatment after
  OB differentiation. (G) Representative image of Alp and Oil Red O staining and expression
  of selected OB and Adi markers after OB- or Adi-induced differentiation with or
  without PTH treatment. Data are shown as the mean ± SEM of 3 independent experiments.
  *P < 0.05, **P < 0.005, ****P < 0.0001 by unpaired Student’s t test. The fold change
  is relative to the vehicle (Veh). Panel F mean Ct values: Gene Ctgf Veh 29.96; PTH
  27.84. Gene Cyr61 Veh 22.65; PTH 21.31. Gene Myc Veh 27.93; PTH 27.38. Panel G mean
  Ct values: Gene Runx2 Veh 27.70; PTH 25.75. Gene Col1a1 Veh 27.60; PTH 25.45. Gene
  AdipoQ Veh 16.96; PTH 20.22'
