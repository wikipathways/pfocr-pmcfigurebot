caption: 'QIAGEN Ingenuity Pathway Analysis (QIAGEN IPA) results showing altered molecular
  pathways (control: n = 4, IH and SH: n = 5 each). (A) Major molecular pathways activated
  in the IH group compared to the control group. Pathways such as mitochondrial dysfunction
  were activated. (B) Major molecular pathways inhibited in the IH group compared
  to the control group. The KEAP1-NFE2L2 antioxidant pathway was inhibited. (C) Major
  molecular pathways activated in the IH group compared to the SH group. (D) Major
  molecular pathways inhibited in the IH group compared to the SH group. The KEAP1-NFE2L2
  antioxidant pathway was inhibited. The X-axis shows −log10 (p-value) and the color
  scale shows activation Z-score, with red indicating activation and blue indicating
  inhibition. Statistical significance was set at −log10 (p) > 1.3 and |Z-score| >
  2.0. IH, intermittent hypoxia; SH, sustained hypoxia'
