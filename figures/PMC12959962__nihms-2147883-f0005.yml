figure_title: Pathological α-Syn Accumulation Results in Nuclear Deficits.
caption: Pathological α-Syn Accumulation Results in Nuclear Deficits. A) RNASelect
  dye labeling of Neuro 2a cells clearly defines nucleoli and nuclear borders. All
  fluorescent signal outside of the nuclear border was considered cytoplasmic. Quantification
  of staining volume distribution between nucleus and cytoplasm (Bottom) in control
  (Ctrl, BioPORTER treated alone) and PFF treated cells yielded an of 0.4954 (95 %
  CI 0.3508–0.5679) for PFF treated cells, and 0.09499 (95 % CI0.02112–0.1689) for
  control treated cells. N = 3 biological replicates, n > 100 cells per replicate
  (p = 0.0003, Unpaired-t-test, t = 11.94). B) Micrograph of immunofluorescence staining
  for α-tubulin in cells with (Bottom Row) and without (Top Row) p-α-syn pathology.
  Quantification of α-tubulin volume per field of view, normalized to number of nuclei
  per field of view, revealed an average cell volume of 1173 μm3 (95 % CI 922.8–1424)
  for control cells and 1274 μm3(95 % CI 677.1–1871) for PFF treated cells. N = 3
  biological replicates (p = 0.5397, Unpaired- t-test, t = 0.6697). C) Western blot
  analysis of envelope repair pathway proteins in control and PFF treated Neuro 2a
  cells. Alpha-tubulin (α-tubulin) (DM1A Abcam) loading control shown on bottom. Quantification
  of western blots (Right Panel). Control treated cells displayed an average of 0.05319
  signal intensity ratio for LEMD2 (95 % CI 0.02738–0.07901), while PFF treated cells
  averaged 0.1080 fluorescent signal ratio for LEMD2 (95 % CI 0.05362–0.1624) (p =
  0.0173, Unpaired-t-test, t = 3.918). Control cells yielded an average CHMP7 (Proteintech)
  signal intensity ratio of 0.2419 (95 % CI 0.1961–0.2877) compared to 0.1409 signal
  intensity ratio (95 % CI 0.08469–0.1971) for CHMP7 in PFF treated cells(p = 0.0039,
  Unpaired-t-test, t = 5.994). Visual rendering of simplified ESCRT-III mediated envelope
  repair pathway (Bottom). Full blots can be viewed in Supplemental Fig. 8. D) Neuro
  2a cells were treated with increasing concentrations of the DNA damaging agent,
  Doxorubicin, for 24 h. Cell viability was determined with Cell Titer Glo 2.0 assay
  and normalized to untreated wells, and expressed at percent of the well with the
  highest luminescent signal. No statistical differences (Two-way ANOVA) were observed
  at 10 μM doxorubicin (1.10 % Ctrl, 0.35 % PFF Viability), or at 1 μM doxorubicin
  (41.12 % Ctrl, 30.43 % PFF viability). Statistical differences (Two-way ANOVA) in
  viability between control and PFF treated cells after doxorubicin treatment were
  present at 0.5 μM doxorubicin (91.64 % Ctrl, 37.84 % PFF viability) (Mean Diff.
  = 0.6929, 95 % CI of Diff. 0.3744–1.011, p < 0.0001), 0.25 μM doxorubicin treatment
  (94.79 % Ctrl and 40.51 % PFF viability) (Mean Diff = 0.6991, 95 % CI of Diff. 0.3806–1.018,
  p < 0.0001), 0.125 μM doxorubicin (100 % Ctrl, 50.04 % PFF viability) (Mean Diff.
  = 0.6439, 95 % CI of Diff. 0.3254–0.9625, p < 0.0001), 0.0625 μM (87.15 % Ctrl,
  51.71 % PFF viability) (Mean Diff. = 0.4565, 95 % CI of Diff. 0.1379–0.7750, p =
  0.0024), 0.0312 μM doxorubicin (84.24 % Ctrl, 49.60 % PFF viability) (Mean Diff.
  = 0.4462, 95 % CI of Diff. 0.1276–0.7647, p = 0.0019), 0.0156 μM (82.45 % Ctrl,
  48.85 % PFF viability) (Mean Diff. = 0.4328, 95 % CI of Diff.0.1143–0.7514, p =
  0.0027), and 0.0078 μM (83.62 % Ctrl, 38.31 % PFF viability) (Mean Diff. = 0.5836,
  95 % CI of Diff. 0.2650–0.9021, p < 0.0001). We previously determined that PFF treatment
  alone does not decrease viability of Neuro 2 a cells. N = 3 biological replicates,
  n = 6 technical replicates. See Table 1 for a complete list of all antibodies and
  reagents
