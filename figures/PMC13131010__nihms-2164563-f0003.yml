figure_title: Therapeutic targeting of fucosylation
caption: l-Fucose (LF) analogues and inhibitors developed to date selectively target
  FUT activity and reduce the global levels of fucosylated glycopeptides present on
  the cell surface or secreted into the extracellular compartment. Fluorinated LF
  analogues (yellow-outlined red triangles; including 2-fluoro-l-fucose (2FF), 2F-peracetyl-fucose,
  6,6-difluoro-LF, 5-thio-fucose) act as substrate-level competitive inhibitors that
  bind to the active site of fucosyltransferases (FUTs) and obstruct the binding and
  conjugation of the endogenous substrate guanosine diphosphate (GDP)-fucose. Direct
  inhibitors of FUT8 (5-alkynyloxyfuranoses) can specifically target the fucosylation
  mediated by this FUT. Unlike free LF, which is phosphorylated, GDP-coupled and goes
  on to serve as a FUT substrate, fluorinated rhamnoside and its derivatives (for
  example, fluorinated rhamnoside, Fucotrim I, Fucotrim II) all work similarly, by
  substrate-level competition with GDP-mannose for binding to GDP-mannose 4,6-dehydratase
  (GMD), depleting the pools of GDP-fucose generated from the de novo pathway. Fucostatin
  I and II are fucose analogues, which are phosphorylated by fucokinase (FUK) and
  inhibit GMD to suppress normal GDP-fucose conversion. GDP-fucose-pyrophosphorylase
  (GFPP)-competitive inhibitors, such as fucose-1-P analogues (Fucostatin II (allosteric
  binding to GMD), A2FF1P, B2FF1P), will restrict fucose-1-phosphate conversion into
  GDP-fucose, via another competitive substrate mechanism. Alkynyl-modified LF is
  incorporated into cellular pathways as a metabolite and interferes with either de
  novo or salvage pathway-mediated synthesis of GDP-fucose. Where 5-alkynyl-fucose
  suppresses the FUK or GFPP enzymes, 6-alkynyl-l-fucose inhibits the GDP-4-keto-6-deoxymannose-3,5-epimerase-4-reductase
  (FX) enzyme. ER, endoplasmic reticulum; POFUT1, protein O-fucosyltransferase 1
