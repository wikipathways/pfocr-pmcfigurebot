figure_title: NK cells entering the TME of OC undergo ferroptosis.
caption: NK cells entering the TME of OC undergo ferroptosis. (A) Volcano plot of
  differentially expressed genes in NK cells from the control and SKOV3 conditional
  culture groups, n=3. Significant genes are highlighted in either red (upregulated
  in the conditional culture group) or blue (downregulated in the conditional culture
  group). (B) GSEA enrichment score of differentially expressed genes in the ferroptosis
  pathway. (C) Lipid peroxidation level of 670 labeled NK cells after direct coculture
  with OVCAR3 and SKOV3 cells for 36 hours, n=3. (D) ROS levels in 670 labeled NK
  cells after direct coculture with OVCAR3 and SKOV3 cells for 36 hours, n=3. (E)
  Proportion of 7AAD-positive CFSE-labeled NK cells after direct coculture with OVCAR3
  and SKOV3 cells for 36 hours; n=3. (F) Lipid peroxidation levels of 670 labeled
  NK cells after indirect coculture with OVCAR3 and SKOV3 cells for 36 hours, n=3.
  (G) ROS levels in 670 labeled NK cells after indirect coculture with OVCAR3 and
  SKOV3 cells for 36 hours, n=3. (H) Proportion of 7AAD-positive CFSE-labeled NK cells
  after indirect coculture with OVCAR3 and SKOV3 cells for 36 hours; n=3. (I) Lipid
  peroxidation level of NK cells at 12-hour increments after conditional culture with
  the supernatant from OVCAR3 cell culture media, n=3. (J) Lipid peroxidation level
  of NK cells at 12-hour increments after conditional culture with the supernatant
  from SKOV3 cell culture media; n=3. (K) ROS levels in NK cells at 12-hour increments
  after conditional culture with the supernatant from OVCAR3 cell culture media, n=3.
  (L) ROS levels of the NK cells at 12-hour increments after they were subjected to
  conditional culture with the supernatant from the SKOV3 cell culture media; n=3.
  (M) Proportion of 7AAD-positive NK cells at 12-hour increments after conditional
  culture with the supernatant from OVCAR3 cell culture media; n=3. (N) Proportion
  of 7AAD-positive NK cells at 12-hour increments after conditional culture with the
  supernatant from the SKOV3 cell culture media; n=3. (O) Lipid peroxidation levels
  of 670 labeled NK cells after direct coculture with OC PDOs for 36 hours, n=3. (P)
  Lipid peroxidation levels of 670 labeled NK cells in the peritoneal lavage fluid
  of control (n=3) and OC abdominal tumor-bearing (n=2) mice. The error bars represent
  the SEM
