figure_title: Effect of AMPamide on MAPK/NF-κB signaling.
caption: 'Effect of AMPamide on MAPK/NF-κB signaling. (A, B) Representative immunoblots
  and quantification of MAPK pathway activation, assessing the phosphorylation levels
  of ERK, p38, and JNK. (C, D) Cytoplasmic and nuclear extracts from HaCaT cells pretreated
  with AMPamide for 24 h, followed by LPS stimulation for 3 h, were analyzed via western
  blotting for NF-κB, Lamin A/C (nuclear marker), IκB, phosphorylated IκB (p-IκB),
  and β-actin (cytoplasmic marker). Band intensities were quantified using ImageJ,
  and the relative intensities of phosphorylated proteins were normalized to their
  corresponding total protein levels. All presented images are representative of at
  least three independent experiments. Data are expressed as the mean ± SEM from at
  least three independent experiments. #p<0.05, ##p<0.01 compared with the untreated
  control; *p<0.05, **p<0.01 compared with the LPS-stimulated control group'
