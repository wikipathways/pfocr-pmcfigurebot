figure_title: Periarticular CD14hi macrophages play a predominant proinflammatory
  role in the development of psoriatic arthritis–like inflammation
caption: (A) UMAP plots of macrophages from the periarticular tissue of control and
  Spry1-cKO mice by scRNA-Seq, showing 5 clusters (n = 3). (B) Dot plots showing scaled
  expression of selected marker genes for macrophage subsets defined in A. (C) Comparison
  of the proportions of periarticular macrophage subsets between control and Spry1-cKO
  mice. (D) Dot plots showing the scaled expression of genes linked to activation
  and polarization in periarticular CD14hi macrophages from control and Spry1-cKO
  mice. (E) KEGG pathway enrichment of upregulated DEGs (Spry1-cKO vs. control) in
  periarticular CD14hi macrophages (adjusted P < 0.01). P values were determined using
  2-tailed unpaired Student’s t test (C). *P < 0.05, ***P < 0.001
article_title: CXCL10 secreted by SPRY1-deficient epidermal keratinocytes fuels joint
  inflammation in psoriatic arthritis via CD14 signaling
