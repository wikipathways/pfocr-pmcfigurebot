figure_title: Metabolic pathways affected by AdpASv.
caption: 'Metabolic pathways affected by AdpASv. The graph displays enriched metabolic
  pathways that are either activated (left) or suppressed (right) in the ΔadpA strain
  compared to the wild-type strain at 12 and 20-h time points, based on RNA-seq data.
  The DEGs were grouped into corresponding pathways according to the KEGG database.
  The GeneRatio parameter shows the proportion of pathway-associated genes that are
  significantly changed. Statistical significance, expressed as adjusted p-value,
  is reflected by color intensity: red indicates high significance (low adjusted p-value),
  while blue indicates low significance (high adjusted p-value). Gene grouping analysis
  was performed in R using the ClusterProfiler package'
