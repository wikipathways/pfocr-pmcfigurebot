figure_title: Analysis of signal direction and spatial variation.
caption: Analysis of signal direction and spatial variation. (a) Results of signal
  direction based on raw spatial data and imputed spatial data. The left figure represents
  the signal direction of the FGF pathway based on raw spatial data. The middle figure
  represents the signal direction of the CXCL pathway based on imputed spatial data.
  The right figure represents the signal direction of the ANGPTL pathway based on
  imputed spatial data. (b) Visualization of spatial variation based on UMAP. The
  left figure represents the spatial variation of raw spatial data and the right figure
  represents the spatial variation of imputed spatial data. (c) Expression levels
  of DEGs for cells with spatial-induced cell types. The upper figures represent the
  DEGs of neuron cells and the bottom figures represent the DEGs of neural crest cells
