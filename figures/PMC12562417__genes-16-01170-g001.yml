figure_title: Functional enrichment analysis of the consensus gene signature following
  LGALS3 CRISPR deletion.
caption: Functional enrichment analysis of the consensus gene signature following
  LGALS3 CRISPR deletion. (A) Protein–Protein Interaction network of genes consistently
  deregulated across multiple cancer cell lines upon LGALS3 knockout, conducted using
  the Metascape platform (accessed on 3 June 2025). Each MCODE network is assigned
  a unique color. (B) Network visualization of MCODE clusters, representing densely
  connected functional modules. (C) Summary table of major functional clusters enriched
  in the consensus gene signature, highlighting representative biological processes
  and pathways associated with LGALS3 loss. (D) Gene Ontology (GO) and pathway enrichment
  analysis of the consensus signature derived from CRISPR/Cas9-mediated knockout of
  LGALS3 is presented as heatmap. The heatmap cells are colored by their p-values
  and significant terms are hierarchically clustered based on their statistical similarities
