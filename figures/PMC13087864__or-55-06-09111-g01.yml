figure_title: Schematic of AICD in T cells in NPC.
caption: Schematic of AICD in T cells in NPC. EBV latent antigens are continuously
  presented by APCs, leading to sustained activation and exhaustion of T cells. Chronic
  TCR activation triggers immunosuppressive signals, resulting in T cell dysfunction
  (T cell exhaustion) and reduced antitumor efficacy. Activation of the PD-1/PD-L1
  pathway, accumulation of ROS and changes in mitochondrial membrane potential promote
  AICD. These processes further enhance immune evasion by NPC cells, which secrete
  immunosuppressive factors such as TGF-β and IL-10, inhibiting T cell function and
  promoting tumor growth. EBV, Epstein-Barr virus; APS, antigen-presenting cell; TCR,
  T cell receptor; AICD, activation-induced cell death; PD-1/PD-L1, programmed cell
  death protein 1/programmed cell death ligand 1; ROS, reactive oxygen species; NPC,
  nasopharyngeal carcinoma
