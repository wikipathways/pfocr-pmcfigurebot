figure_title: Experimental validation of the PI3K/AKT pathway in PET-induced liver
  injury.
caption: 'Experimental validation of the PI3K/AKT pathway in PET-induced liver injury.
  (A) Schematic diagram of the experimental design. (B) HE staining shows that AKT
  agonist SC79 alleviates inflammatory cell infiltration. (C,D) PET significantly
  increases ALT and AST levels, which are reduced by SC79; this effect is attenuated
  by LY294002. (E,F) Measurements of (E) MDA and (F) GSH levels. (G) Western blot
  analysis confirms that SC79 inhibits PET-induced pro-apoptotic signaling, an effect
  weakened by LY294002 treatment. Scale bar = 100 μm. Data are represented as the
  means ± SD. ** p < 0.01, *** p < 0.001 vs. Control; # p < 0.05, ## p < 0.01, ###
  p < 0.001 vs. PET'
