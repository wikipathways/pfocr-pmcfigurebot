figure_title: KEGG pathway-based amino acid biosynthesis in Lactobacillus isolated
  from Chinese sauerkraut.
caption: KEGG pathway-based amino acid biosynthesis in Lactobacillus isolated from
  Chinese sauerkraut. Red lines with bars indicate a potential missing reaction. Dotted
  arrows indicate a multi-step reaction. The first multi-step reaction is catalyzed
  by a series of his enzymes including hisA, hisB, hisC, hisD, hisE, hisF, hisG, hisI
  and hisZ. The second multi-step reaction is catalyzed by lysC, asd, thrB1 and thrC.
  The third multi-step reaction is catalyzed by garK, gpmA, serA and serC. Enzymes
  cysE and cysK participate in the fourth reaction. The fifth reaction is catalyzed
  by lysC, asd, metA, metB, metC and mmuM. Numerous enzymes (lysA, lysC, asd, dapA,
  dapB, dapE, dapF, dapG, dapH and mtnE) are involved in the sixth reaction. Enzymes
  aroA, aroB, aroC, aroD, aroE, aroK and EC:2.5.1.19 participate in the seventh reaction.
  Enzymes trpA, trpB, trpC, trpD, trpE, trpF and trpG participate in the eighth reaction.
  Enzymes EC:5.4.99.5, tyrA2 and hisC participate in the ninth reaction, and the tenth
  reaction is catalyzed by the three enzymes (carA, caiB and pyrB)
