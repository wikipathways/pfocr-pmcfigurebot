figure_title: Cell-type specific expression of genes within major CNV loci 16p11.2
  BP4-BP5 and 22q11.2 A-D suggests that the functional influence of a CNV in the brain
  may be driven by distinct pathway effects across a variety of cell types
caption: CNV associations displayed in (a) and (d) were obtained from Shanta et al.40
  Colors indicate the association direction and effect size (z-score), and asterisks
  indicate FDR<10% results. (b) and (e) heatmaps show log2 fold-change of cell type
  expression of the genes within each locus. The colors indicate the differential
  expression level. CNV-gene-gene-set networks in (c) and (f) display the CNV genes
  and their participation in the pathway-cell-type stratified gene sets. Shapes represent
  different entities of the network where the big circle in the middle is a GWS locus,
  peripheral circles are genes in the locus. A gene may be linked to one or more pathways
  (diamond) and at the end of the pathway, a cell type (square) is connected to indicate
  the gene membership of one or more stratified pathways of the same cell type. The
  color of diamond nodes indicates the group of pathways
article_title: Psychiatric disorders converge on common pathways but diverge in cellular
  context, spatial distribution, and directionality of genetic effects
