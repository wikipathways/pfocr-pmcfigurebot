figure_title: FAM134B-mediated ER-phagy in viral infectious diseases.
caption: FAM134B-mediated ER-phagy in viral infectious diseases. During DENV and ZIKV
  infection, the cleavage of FAM134B by NS2B at the RHD site disrupts FAM134B oligomerization,
  impairing ER-phagy and enhancing viral replication. BPIFB3 is an autophagy regulator
  that positively regulates DENV and ZIKV replication. Inhibition of FAM134B-mediated
  ER-phagy by BPIFB3 results in increased viral replication. In Ebola virus infection,
  FAM134B-mediated ER-phagy exerts antiviral effects by suppressing the expression
  of viral replication-associated proteins GP and VP and reducing the accumulation
  of nucleocapsid lattices. During COVID-19 infection, SARS-CoV-2 ORF3a manipulates
  ER-phagy by interacting with HMGB1, facilitating FAM134B-mediated ER-phagy via the
  HMGB1-BECN1 pathway, leading to ER stress, inflammation, cell death, and viral replication.
  SARS-CoV-2 ORF8 undergoes phase separation and interacts with p62 to form condensates.
  These ORF8/p62 condensates hijack FAM134B/ATL, preventing its interaction with LC3
  and impairing ER-phagy. This disruption results in increased viral DMV formation
  and severe ER stress
