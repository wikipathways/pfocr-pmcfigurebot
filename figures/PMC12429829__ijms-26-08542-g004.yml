figure_title: Activation of the cGAS/STING pathway and increased DNA damage in MDA-MB-231cells
  treated with (R)-SKGB-1.
caption: 'Activation of the cGAS/STING pathway and increased DNA damage in MDA-MB-231cells
  treated with (R)-SKGB-1. (A) Data represent dose–response curves reporting the mean
  ± standard deviation of the effects of different doses of (R)-SKGB1 on cell viability
  evaluated by MTS assay after 72 h of treatment in three experiments on breast cancer
  cell line, MDA-MB-231 wt, and shNONO cell clones. The table reports the IC50 values
  for each cell line. Results are expressed as a percentage of cell viability (calculated
  with respect to control cells treated with DMSO alone). Statistically significant
  differences between each dose versus control were evaluated using one-way repeated-measures
  ANOVA with Dunnett’s post-test and are indicated as follows: * p < 0.05; ** p <
  0.01. The IC50 values were calculated using GraphPad Prism 10. (B) Western blot
  analysis showing the expression and phosphorylation levels of key proteins in the
  cGAS/STING pathway, including cGAS, p-TBK1, TBK1, p-STING (Ser366), and STING, in
  MDA-MB-231 cells treated for 48 h with (R)-SKGB-1 at its IC50 value or with DMSO
  as a control. GAPDH was used as a loading control. (C) Quantification of cells with
  micronuclei formation in wt and (R)-SKGB-1 cells. Representative immunofluorescence
  images show nuclei stained with DAPI, and white arrows indicate the micronuclei.
  We analyzed approximately 500 cells for each condition. The results show the mean
  and standard deviation (SD) of two independent experiments. Statistically significant
  differences are indicated by * p < 0.05. (D) Immunofluorescence staining and quantification
  of NF-κB p65 nuclear localization in MDA-MB-231 wt and (R)-SKGB-1-treated cells.
  NF-κB p65 is shown in green and nuclei in blue (DAPI). The graph displays the mean
  ± SD of three independent experiments, with approximately 300 cells analyzed per
  condition. Statistically significant differences are indicated with **** p < 0.0001.
  (E) Quantification of cGAS intensity in MDA-MB-231 wt and (R)-SKGB-1-treated cells.
  cGAS is shown in green and nuclei in blue (DAPI). We analyzed 35 micronuclei for
  each condition. The results show the means and standard deviations (SDs) of three
  independent experiments. Statistically significant differences are indicated by
  **** p < 0.0001'
