figure_title: Antitumor activity of CDK12/13 degradation is STING dependent
caption: '(A) Enrichment of the indicated pathways in Myc-CaP subcutaneous (s.c.)
  tumors from FVB mice treated with YJ1206 compared to vehicle control. Adj., adjusted.
  (B) All pathways significantly enriched by GSEA, utilizing the MSigDB Hallmark database,
  in Myc-CaP s.c. tumors from FVB mice treated with YJ1206 compared to vehicle control.
  Type I and II IFN responses are highlighted in red. Adj., adjusted. (C and D) Representative
  images (C) or quantification (D) of immunofluorescence (for p-STING and MHC-I) or
  immunohistochemistry (for p-IRF3) performed on Myc-CaP tumor tissues from mice treated
  with vehicle, anti–PD-1 (α-PD-1), YJ1206, or the combination (combo) of α-PD-1 and
  YJ1206 (n = 4 mice per group). Scale bar: 40 μm. (E) Left: Growth curves of s.c.
  tumors derived from CT26 cells with or without Sting1 KO, in BALB/c mice treated
  with the combination (combo) of α-PD-1 and YJ1206. Right: Growth curves of s.c.
  tumors derived from CT26 cells with Sting1 KO, in Sting1-KO BALB/c mice treated
  with the combination (combo) of α-PD-1 and YJ1206. YJ1206 was administered orally
  at a dose of 25 mg/kg, 3 times per week, and α-PD-1 was administered intraperitoneally
  at a dose of 100 μg/mouse every 3 days (n = 5 mice per group). Data are displayed
  as mean ± SEM. Significance in D was determined by 2-tailed t test and by 2-way
  ANOVA in E. Bonferroni’s correction was applied for multiple comparisons in D and
  E'
article_title: CDK12/13 inactivation triggers STING-mediated antitumor immunity in
