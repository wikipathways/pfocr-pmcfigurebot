figure_title: A geodesic dome as an allegory for the biotensegrity model.
caption: A geodesic dome as an allegory for the biotensegrity model. This is shown
  to simplify the idea of interrelatedness of myofascial tissue and mechanical connections
  in the fascio-musculoskeletal system which can enable force transmission through
  mechanical links and myofascial chains. In the actual model, which is dynamic and
  in movement, each segment can have a different spring constant that changes according
  to the ECM composition and cellular activity of cells and the state of the fascia,
  the temperature, hydration, and so forth. In a biotensegrity framework, any shift
  or imbalance in the biotensegrity system may potentially lead to clinical manifestations,
  depending on the area, depth, force, and anatomical structures involved [7]. Amputation
  in one part of the system causes disruption in the stability of the entire system
  and the structures within it. After a disruption, caused by surgery, the structure
  has imbalance in it which may cause symptoms such as pain when severe enough to
  alter physiological processes. If a neuroma is present in a location experiencing
  high tensional force, it may predispose to pain and hyperexcitability of its sensory
  pathway
