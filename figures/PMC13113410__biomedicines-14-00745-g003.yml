figure_title: KEGG enrichment analysis and protein interaction network of the differentially
  expressed proteins between HSIL tissues and paired adjacent normal tissues.
caption: KEGG enrichment analysis and protein interaction network of the differentially
  expressed proteins between HSIL tissues and paired adjacent normal tissues. (A)
  The top 20 significantly enriched KEGG pathways of the differentially expressed
  proteins (p < 0.05). (B) Protein–protein interaction network constructed from the
  differentially expressed proteins. Red indicates upregulation and green indicates
  downregulation. (C) Pathway–pathway relationship network based on the enriched KEGG
  pathways. The thicker the line, the more elements they share. (D) Protein–protein
  interaction network of the top 50 proteins ranked by PageRank, with corresponding
  significantly enriched pathway information annotated. Red circles represent upregulated
  proteins, green circles represent downregulated proteins, and yellow boxes represent
  metabolic pathways
