caption: TCFE enhances the activity of Wnt signaling, TGF-β signaling, and steroid
  hormone metabolism in DPCs. (A) Effect of different concentrations of TCFE on DPCs
  viability. Data are presented as the mean ± SEM compared with Control group. (B)
  Changes in Biomarkers in DPCs (From top to bottom, they are Negative Control vs.
  TCFE 0.001% and Negative Control vs. TCFE 0.005%, respectively). (C) Heat maps of
  DEGs in the TGF-β signaling pathway (left) and steroid hormone metabolism (right).
  Red indicates upregulation and blue indicates downregulation. NC, negative control.
  (D) RT-PCR validation of some DEGs. Data are presented as the mean ± SEM, * p <
  0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
