figure_title: LCOR immunogenic effects are abrogated by ERα in HR+ BC
caption: |-
  (A) Volcano plot showing ranked gene signatures from GSEA analysis of LCOR-OE versus control cells following RNA-Seq of MDA-MB-231 and MCF-7 cells. Data are ranked on the basis of –log10
  P value (Pv) and NES values. The size of the dataset is represented. (B) GSEA of APM (KEGG: M16004) comparing LCOR-OE versus control MDA-MB-231 and MCF-7 cells. Heatmap of RNA-Seq analysis of MHC-I genes in LCOR-OE and control MCF-7 and MDA-MB-231 cells. (C) GSEA of the Scan-B BC clinical dataset (53). HR+ patients (n = 2,423) were stratified by ESR1/PGR/NR2F2 expression terciles in high (n = 824) and low (n = 800). Within each group, patients were ranked according to LCOR median expression. Groups were interrogated for the APM signature (KEGG: M16004) and IFN-γ response (hallmarks [Hall], M5913). (D) Computational interaction regression model in TCGA HR+ BC clinical data (n = 776 patients). The interaction model was calculated according to Score~geneA*geneB, where gene A is LCOR, gene B represents the different nuclear receptors, and the score represents pathways assessed as the APM (KEGG: M16004), MHC-I, and cytolytic scores. Heatmap represents the log10
  P value of the statistic applied to calculate the interaction
