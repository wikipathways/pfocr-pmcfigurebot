figure_title: Macrophage GPR18 activates the Gq–AMPK pathway to promote sphingolipid
  release
caption: '(A) Static GSIS from islets of LysM-Gq KO and control mice stimulated with
  low (2.8 mM) or high (16.8 mM) glucose (n=10–12) in presence or absence of NAGly
  (10 μM). (B) Static GSIS in clodronate-treated (macrophage-depleted) islets under
  low and high glucose with or without NAGly (10 μM; n=7–9). (C) Co-culture of BMDMs
  with INS-1 cells showing insulin secretion at low (2.8mM) and high (16.8mM) glucose
  in the presence or absence of NAGly (10 μM; n=4). (D) Experimental schematic of
  WT and LysM-Gq KO macrophages treated with vehicle or NAGly for 1 hour, alongside
  unstimulated controls (n=). (E) Stacked area plots of lipidomic profiles showing
  relative abundance of fatty acids (FA), glycerolipids (GL), glycerophospholipids
  (GP), and sphingolipids (SP) across conditions: (a) WT, 0 hour vs 1 hour NAGly;
  (b) WT, 1 hour vehicle vs 1 hour NAGly; (c) LysM-Gq KO, 1 hour vehicle vs 1 hour
  NAGly. Percentages represent the fraction of each lipid class within total lipid
  species. (F) Volcano plots of differential lipid species (log2 fold change vs −log10
  p-value) after NAGly treatment: WT, 0 hour vs 1 hour(left); WT, vehicle vs 1 hour
  NAGly (middle); LysM-Gq KO, vehicle vs 1 hour NAGly (right). (G) Pathway enrichment
  analysis in WT BMDMs (vehicle vs 1 hour NAGly; 10 μM), highlighting sphingolipid
  metabolism as the top enriched pathway. (H) Immunoblot and quantification of AMPK
  phosphorylation in control and LysM-Gq KO BMDMs after NAGly treatment (10 μM; 0–15
  min). Lipidomic experiments were done in 3 biological replicates and 2 technical
  replicates. Data are mean ± s.e.m. using one-tailed unpaired t-test (A-C, H); *p
  < 0.05, **p < 0.01'
article_title: Acute activation of Gq-signaling in islet macrophages inhibits β-cell
  insulin secretion through AMPK-sphingolipid axis
