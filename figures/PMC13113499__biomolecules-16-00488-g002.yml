figure_title: 'Molecular mechanisms underlying the biological activities of ginkgetin
  (GK): (1) GK attenuates oxidative stress and maintains mitochondrial homeostasis
  by reducing ROS and lipid peroxidation, restoring antioxidant enzymes, and activating
  the Nrf2/HO-1 pathway; (2) GK suppresses inflammatory responses through inhibition
  of NF-κB, MAPK, JAK2/STAT3 and cGAS–STING signaling, leading to decreased production
  of pro-inflammatory cytokines (TNF-α, IL-1β and IL-6); (3) GK regulates cell fate
  in a context-dependent manner by inducing apoptosis or ferroptosis in pathological
  cells, while protecting normal cells via modulation of autophagy, and suppressing
  excessive apoptosis; (4) GK inhibits abnormal cell proliferation, adipogenesis and
  extracellular matrix remodeling, and modulates microRNAs.'
