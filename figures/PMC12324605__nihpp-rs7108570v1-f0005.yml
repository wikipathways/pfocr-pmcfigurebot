figure_title: Evaluation of predicted protein expression in breast tissue.
caption: Evaluation of predicted protein expression in breast tissue. a, Spatial distribution
  of major cell compartments and cell types from scRNA-seq annotations. b–e, Comparison
  of predicted vs. measured expression for representative proteins across the full
  tissue (left, four expression bins) and within relevant compartments (right, high
  predicted in red, high measured in blue). f, Spatial concordance assessed via cell-level
  Maximum Mean Discrepancy (MMD) between predictions and ground truth, with RNA expression
  as a baseline. g, Distribution of Moran’s I scores showing spatial autocorrelation
  across all predicted proteins. h, Pathway enrichment analysis of the most spatially
  informative predicted proteins
