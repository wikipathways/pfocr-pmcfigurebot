figure_title: PARP1 and PARP2 participate in DSB pathway choice regulation by modulating
  DNA end-resection
caption: (A) In G1, DNA-PK prevents PARP1 from binding DSBs, thereby suppressing end
  resection and promoting NHEJ. (B) In S and G2, PARP1 and DNA-PK compete for access
  to DNA ends. While DNA-PK and associated factors inhibit resection to favor NHEJ,
  PARP1 and PARP2 promote resection, driving repair toward HR or MMEJ. PARP1 can displace
  DNA-PK from DSBs. It also facilitates the recruitment of the MRN complex, which
  performs short-range resection. Meanwhile, PARP2 inhibits 53BP1-mediated suppression
  of resection. (C) Downstream of end resection, PARPs regulate multiple repair processes
  by modulating various proteins, either through PARylation or via PAR-interacting
  domains, as indicated
