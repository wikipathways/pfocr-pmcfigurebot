figure_title: The regulatory effect of PSB4 on the AMPK/Nrf2 signaling pathway.
caption: 'The regulatory effect of PSB4 on the AMPK/Nrf2 signaling pathway. BMECs
  were first stimulated with H2O2 (500 μM) for 12 h, followed by treatment with PSB4
  (25, 50, and 100 μg/mL) for another 12 h. (A) Protein expression of Nrf2, p-AMPK,
  AMPK, and β-actin in BMECs was analyzed using Western blot. The predicted molecular
  weights for Nrf2, AMPK, p-AMPK, and β-actin were 97 kDa, 62 kDa, 62 kDa, and 42
  kDa, respectively. (B,C) Quantification of relative band intensity for the respective
  proteins, normalized to β-actin. Quantification of the bands in the Western blot
  (n = 3). (D–G) Determination of GCLM, HO-1, NQO1 and GPX1 gene expression via qRT-PCR
  (n = 3). (H) Representative immunofluorescence images of Nrf2 nuclear translocation
  in BMECs under different treatment conditions. Red: Nrf2 (Alexa Fluor 594); blue:
  DAPI (nuclei). Scale bar = 10 µm; n = 3. Values are expressed as the mean ± SEM.
  Statistical significance is indicated as follows: ** p < 0.01'
article_title: Pulsatilla Saponin B4 Alleviates H2O2-Induced Oxidative Stress and
  Apoptosis via the AMPK/Nrf2 Pathway in Bovine Mammary Epithelial Cell Models
