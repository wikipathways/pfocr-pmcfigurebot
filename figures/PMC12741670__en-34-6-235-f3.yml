figure_title: Mechanisms of astrocyte-targeted adjuvants.
caption: 'Mechanisms of astrocyte-targeted adjuvants. Illustration of the direct and
  indirect pathways that shift astrocytes toward a pro-inflammatory neurotoxic phenotype.
  Direct PRR engagement: Poly-ICLC activates TLR3 on astrocytes, localized in rough
  ER/endolysosomes, leading to TBK1→IRF3 phosphorylation, MHC-II upregulation, and
  robust chemokine (Cxcl10, Ccl5, Isg15) production. C100 micelles deliver cGAMP to
  the cytosol, where it binds STING, which activates STING→TBK1→IRF3 signaling and
  induces intersynaptogenic factors (Gpc4, Gpc6) through NF-κB and STAT1 axis activation.
  Functional consequences of A1 conversion include chemokine-mediated recruitment
  of CXCR3+ effector T cells and NK cells, upregulation of antigen-processing machinery
  to enhance cross-presentation to CD8+ T cells, and release of reactive nitrogen
  species and glutamate that impair tumor metabolic homeostasis'
