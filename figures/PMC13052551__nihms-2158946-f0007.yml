figure_title: AMPARs recycle selectively via the SNX27-Retromer pathway, not the SNX17-Retriever
  pathway
caption: '(A). Simplified illustration illustrating the internalization and routing
  of AMPARs to endosomes, followed by AMPAR recycling back to the plasma membrane.
  (B). Experimental schematic of antibody feeding assay for quantifying AMPAR recycling.
  Neurons are live-labeled with an antibody against a surface epitope of the AMPAR
  subunit GluA1, allowed to internalize labeled receptors for 60 min, then labeled
  with an Alexa 555-conjugated secondary antibody to mark AMPARs that remain on the
  surface. High concentrations of an unlabeled secondary antibody are then applied
  to saturate this remaining surface AMPAR population. After recycling intervals of
  0, 30, or 60 min, internalized receptors that are returned to the surface are labeled
  with an Alexa488-conjugated secondary antibody (recycled GluA1). (C). Left, Representative
  image of recycled GluA1 in a DIV 14–15 primary hippocampal neuron. Scale bar = 10
  μm. Right, Representative images of recycled GluA1 in dendrites of DIV 14–15 hippocampal
  neurons expressing the indicated shRNAs via lentivirus. Scale bar = 5 μm; intensity
  (8-bit) denoted by spectrum at right (D). Mean ± SEM recycled GluA1 intensity in
  SCR-, shSNX17-, and shSNX27-expressing neurons normalized to the 0 min SCR condition.
  SCR: 0, 30, 60 min, N = 30, 28, and 24 neurons; shSNX17: 0, 30, 60 min, N = 30,
  24, and 28 neurons; shSNX27: 0, 30, 60 min, N = 30, 30, and 30 neurons (F8,245 =
  44.53, p < 0.0001). Figure 7A was created in BioRender. Chavis, G. (2025) https://BioRender.com/rcq39ku'
article_title: Dual endomembrane recycling pathways function in parallel to support
  synapse maintenance and plasticity
