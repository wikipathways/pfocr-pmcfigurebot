caption: Identification of WGCNA gene co-expression modules and their correlation
  with stress treatments. (a) Clustering dendrogram of DEGs based on topological overlap,
  with modules labeled in different colors. (b) Heatmap showing correlations between
  module eigengenes and the stress conditions (green and red denote positive and negative
  correlations, respectively). (c) Gene Ontology (GO) enrichment analysis for genes
  in the red module. (d) KEGG pathway enrichment analysis for genes in the red module.
  Identification and correlation analysis of WGCNA modules. Red dashed lines in (b–d)
  highlight key modules or enriched pathways related to glutathione and flavonoid
  metabolism under stress conditions
