figure_title: Macrophages overexpressing ANXA6 inhibit the PI3K/AKT axis via TNF-α
  thereby inhibiting trophoblast function.
caption: 'Macrophages overexpressing ANXA6 inhibit the PI3K/AKT axis via TNF-α thereby
  inhibiting trophoblast function. (A) Quantitative values of migration ability and
  migration ability of HTR8 cells were detected by wound healing assays (n=3). (B)
  Quantitative values of invasive ability and invasive capacity of HTR8 cells detected
  by transwell assays (n=3). (C-E) Immunofluorescence analysis revealed the expression
  of E-cadherin, N-cadherin, and vimentin in each group and quantitative values of
  the MFI (n=3). (F) Differences in the expression of IL-33, CXCL-1, G-CSF, Wnt5a,
  and TNF-α in macrophages from ANXA6 overexpression and control groups were examined
  by qPCR (n=3). (G) TNF-α protein levels were quantified by ELISA (n=3). (H) Quantitative
  values of migration ability and migration ability of HTR8 cells were assessed using
  wound healing assays (n=3). (I) Quantitative values of invasive ability and invasive
  capacity of HTR8 cells detected by transwell assays (n=3). (J-L) E-cadherin, N-cadherin,
  and vimentin were measured by immunofluorescence and quantitative values of the
  MFI (n=3). (M-O) Western blot analysis was performed to evaluate the expression
  of p-PI3K, PI3K, p-AKT and AKT (n=3), and the statistical value was analyzed. (P-T)
  Trophoblast migration, invasion, and EMT were detected after activation of the PI3K
  pathway using 740 Y-P (PI3K agonist) (n=3). Student''s t-test and one-way ANOVA
  were employed for comparisons between two groups and multiple groups, respectively.
  *P < 0.05, **P < 0.01, ns: not significant'
