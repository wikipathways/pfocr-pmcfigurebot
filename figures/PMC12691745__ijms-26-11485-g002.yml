figure_title: Sequence comparison of PpiB and its folding-altering variants and the
  effect of SecB on folding dynamics of these proteins.
caption: Sequence comparison of PpiB and its folding-altering variants and the effect
  of SecB on folding dynamics of these proteins. (A) Schematic alignment of the N-terminal
  sequences of PpiB and its mutants used in this study. The signal peptide (green),
  rheostat region (blue), and mature domain (black) are indicated. Added or modified
  residues are shown in red. Dotted lines indicate omitted regions beyond the N-terminal
  portion. (B–G) Refolding of the indicated PpiB derivatives, at 25 °C, in the absence
  or presence of SecB (added at 1.5 molar excess over the Ppi proteins), by HDX-MS.
  The Deuterium-uptake at each time point was expressed as a percentage of the D uptake
  of the fully unfolded state (6 M urea; set as 100%) and is shown as a continuous
  colour map of the population fraction over time. The Unfolded (U), Intermediate
  (I) and Folded (F) states, and modifications/adducts that are not part of the folding
  pathway (o) are indicated. n ≥ 2 biological repeats
