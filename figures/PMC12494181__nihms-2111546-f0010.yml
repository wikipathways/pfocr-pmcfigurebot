figure_title: Model of PI(3)P-mediated regulation of endocytic recycling upon cLTP
caption: Increased PI(3)P synthesis upon cLTP promotes endocytic recycling through
  the SNX17 and SNX27 pathways, and is necessary for the cLTP-dependent structural
  changes in dendritic spines. Glycine-mediated cLTP (1) activates the CamKII pathway
  (2) and promotes the recruitment of the lipid kinase VPS34 to endosomes, leading
  to an increase in PI(3)P-positive endosomes (3). This rise in PI(3)P levels facilitates
  the recruitment of the SNX17-Retriever and SNX27-Retromer pathways to dendritic
  spines (4), leading to increased recycling of cell surface proteins (5). SNX17 and
  SNX27 mediate the recycling of distinct sets of cell surface proteins, including
  β1 integrin and the AMPA receptor subunit GluA1, respectively, that are necessary
  for the cLTP response (6). Created with BioRender.com
article_title: PI(3)P coordinates SNX17- and SNX27-dependent protein recycling for
  long-term synaptic plasticity
