figure_title: Organoids developed from lung tissue from wild-type and lung tumors
  from KrasG12D/+ (G12D) mice and their characterization
caption: '(A) Lung organoid development with representative images of wild-type (WT;
  blue) and G12D organoids (gold; scale bars: 250 μm).(B) RNA-seq was used to validate
  the KrasG12D mutation (gold) in lung tumor organoids.(C) Volcano plot depicting
  differentially expressed genes, with red representing upregulated (n = 535) and
  blue representing downregulated (n = 541) genes, respectively, in G12D compared
  with WT organoids, with a p value exclusion of 0.05.(D) Pathway analysis depicting
  upregulated signaling pathways in G12D lung tumor compared with WT lung tissue organoids.(E)
  CM was applied (1:3 with adipocyte culture media) to fully differentiated 3T3L1
  adipocytes.(F) Glycerol levels of supernatant of 3T3L1 adipocytes treated with WT
  (blue circles) or G12D (gold squares) organoid CM for 24 h.(G–J) Supernatant levels
  of IL-6 (G), MCP-1 (H), CXCL1 (I), and GDF15 (J) from 3T3L1 adipocytes treated for
  24 h with WT or G12D organoid CM.3T3L1 experiments are representative of 2–3 independent
  replicates. Data are represented as mean ± SEM and analyzed by Student’s t test,
  with ***p < 0.001.Images were created with BioRender.com (A and E). See also Figures
  S15 and S16'
