figure_title: Schematic illustration of the proposed model in which a TAM-mediated
  immunometabolic axis impairs PARPi efficacy in BRCA1-deficient breast cancer
caption: STAT5-dependent activation of the IRG1/itaconate pathway in TAMs reprograms
  mitochondrial metabolism and activates NRF2-driven GSH biosynthesis. The TAM-derived
  GSH protects tumor cells from ROS-induced DNA damage and ferroptosis, while concurrently
  suppressing STING-mediated immune activation in both tumor and dendritic cells.
  Pharmacological inhibition of IRG1 restores tumor sensitivity to PARPi, reactivates
  anti-tumor immunity, and significantly suppresses tumor growth in BRCA1-deficient
  preclinical models
article_title: IRG1/itaconate/NRF2/GSH axis in tumor-associated macrophages drives
  therapy resistance and immune evasion in BRCA1-deficient breast cancer
