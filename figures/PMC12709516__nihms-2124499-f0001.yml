caption: In a multicenter prospective cohort study—the 35th Multicenter Airway Research
  Collaboration (MARC-35), the current study investigated 504 infants hospitalized
  for bronchiolitis (i.e., severe bronchiolitis) with nasopharyngeal airway (NPA)
  microbiome and blood DNA methylation (DNAm) data. NPA microbiome data was measured
  by shotgun metagenomic sequencing, and 23 common taxa were used for the downstream
  analyzes. Blood DNAm data was measured by Infinium MethylationEPIC array (850 K),
  and a total of 776,307 CpGs were used for the downstream analyzes. First, we examined
  associations of NPA microbiota with blood DNAm by using the epigenome-wide association
  study (EWAS) approach. The microbiome-EWAS (mbEWAS) identified microbiota-associated
  differentially methylated CpGs (mbDMCs) and regions (mbDMRs). We also examined associations
  of NPA microbiota with DNAm age and associations of DNAm age with the risk of developing
  outcomes—recurrent wheeze by age 3 years and asthma by age 6 years. Second, we characterized
  the mbDMRs in 3 asthma-related pathogenic NPA bacteria—Haemophilus influenzae, Moraxella
  catarrhalis, and Streptococcus pneumoniae. We determined the 7 blood immune cell
  type-specific differential DNAm within the mbDMRs. The cell types were inferred
  by a deconvolution analysis using the DNAm data. In the 112 infants with serum proteome
  data, including 1,076 proteins measured by using 13 Olink panels, we identified
  mbDMR-related proteins and examined the pathway enrichment
