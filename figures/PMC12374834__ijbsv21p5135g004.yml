figure_title: Modulatory mechanisms of SIRT3 in aging-related pathologies.
caption: Modulatory mechanisms of SIRT3 in aging-related pathologies. (A) Chronic
  Obstructive Pulmonary Disease (COPD). Mitochondrial dysfunction induces excessive
  ROS production and mtDNA leakage, which activates the cGAS-STING pathway and triggers
  inflammatory cytokine release (e.g., IL-6, TNF). This promotes cellular senescence
  and the senescence-associated secretory phenotype (SASP). Impaired SIRT3 activity
  further aggravates oxidative stress by reducing SOD2 deacetylation, weakening mitochondrial
  antioxidant defenses and amplifying inflammation. (B) Intervertebral Disc Degeneration
  (IDD). Metabolic stress and AGE accumulation disrupt mitochondrial biogenesis and
  respiration. The AMPK-SIRT3-PGC-1α axis is central to maintaining mitochondrial
  function and antioxidant capacity. Its dysregulation leads to reduced expression
  of enzymes like SOD2 and catalase, increased ROS levels, and nucleus pulposus cell
  senescence, contributing to disc degeneration. (C) Osteoarthritis (OA). Oxidative
  stress impairs mitochondrial dynamics and activates the PINK1/Parkin-dependent mitophagy
  pathway. Inadequate mitophagy results in accumulation of dysfunctional mitochondria,
  elevated ROS, and chondrocyte apoptosis. Disrupted mitochondrial quality control
  exacerbates inflammation and cartilage matrix degradation, accelerating joint degeneration
