caption: Three−dimensional electroanatomic mapping and ablation of the right atrium
  in the Left anterior oblique (LAO) showing the activation map during atrial pacing
  and conduction via slow pathway (left side) and during sinus activation (right side).
  The yellow dots depict the location of the His bundle as recorded by an electrode
  mapping catheter. The light blue structures represent superior and inferior vena
  cava. The grey structure represents the location of the coronary sinus with ostium
  indicated. The blue circle outlines the tricuspid annulus. The red-black tags were
  created by radiofrequency ablation utilizing the QDOT Catheter in the QMODE+ ablation
  mode (90 W/4 s)
