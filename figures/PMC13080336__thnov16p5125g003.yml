figure_title: RNA seq analysis of vehicle and CEL treated A549 cells.
caption: 'RNA seq analysis of vehicle and CEL treated A549 cells. (A) Principal Component
  Analysis (PCA) of normalized gene counts for vehicle (Veh) and CEL-treated A549
  cells where each point represents an individual sample. Color intensity represents
  the strength of correlation, with darker blue indicating higher correlation values.
  (B) Clustered heatmap depicting differential expression of genes in Veh and CEL.
  Red denotes upregulation and green denotes downregulation. (C) Pearson correlation
  coefficient heatmap comparing gene expression profiles between Veh and CEL. (D)
  Volcano plot of differentially expressed genes in CEL vs Veh. Novel upregulated
  and downregulated genes are labelled. (E) Heatmaps of the differentially expressed
  claudins, cadherins and protocadherins (Left Panel) and MMPs (Right Panel). Each
  cell represents the expression level of the respective gene (rows) for the specific
  comparison (columns). Colors indicate expression intensity, with blue representing
  downregulation and purple representing upregulation based on log2FC. *<0.05, **<0.001,
  ***<0.001. (F) STRING Biological Processes (GO Ontology) Enrichments. Up-regulated
  enriched pathways are on top panel and down-regulated pathways are on bottom panel.
  Setting: Category: Biological Process (Gene Ontology), Group Terms by: Similarity
  ≥0.8, Sort Terms by: Enrichment, No of terms: maximum possible, Color Palette: mint-blue,
  Merge rows by term similarity: Don''t merge, Maximum FDR: <0.05, Minimum count in
  set = 5'
