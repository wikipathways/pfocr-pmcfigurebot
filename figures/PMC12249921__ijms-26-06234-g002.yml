figure_title: Cannabinoid system alterations in and effects on pediatric epilepsy
  syndromes.
caption: 'Cannabinoid system alterations in and effects on pediatric epilepsy syndromes.
  This schematic illustrates the pathophysiological changes in the endocannabinoid
  system (ECS) and the modulatory actions of cannabidiol (CBD) and other cannabinoids
  across three major pediatric epilepsy syndromes: febrile infection-related epilepsy
  syndrome (FIRES), Dravet syndrome (DS), and Lennox–Gastaut syndrome (LGS), and childhood
  absence epilepsy (CAE). FIRES (left panel): CBD reduces the release of proinflammatory
  cytokines (e.g., TNF-α, IL-1β, IL-6) via TLR4–NFκB and IFN-β–JAK–STAT signaling
  pathways, inhibits adenosine reuptake, modulates TRPV1 channels on microglia, and
  suppresses ATP release, Ca2+ influx, and reactive oxygen species (ROS) production
  through NADPH oxidase inhibition. These mechanisms underlie CBD’s anti-inflammatory,
  immunomodulatory, and antiepileptogenic properties. DS and LGS (center panel): Observed
  alterations include the upregulation of CB2 receptors in the hippocampus and CB1
  receptors in the hippocampus and cerebellum, along with a decreased expression of
  FAAH and MAGL enzymes in various brain regions. CBD reduces hippocampal interneuron
  rheobase and enhances inhibitory transmission via GPR55 receptors in the dentate
  gyrus. Clinically, CBD ameliorates associated comorbidities, such as motor dysfunction,
  anxiety, depression, memory impairment, and autism-related social deficits. CAE
  (right panel): There is a significant downregulation of CB1R mRNA and protein in
  the cortex, hippocampus, and thalamic regions (nucleus reticularis thalami [NRT]
  and ventrobasal complex [VB]). In Wistar Albino Glaxo/Rijswijk (WAG/Rij) rats and
  Genetic Absence Epilepsy Rats from Strasbourg (GAERS), two well-established rodent
  models of CAE, region-specific alterations in endocannabinoid levels have been reported.
  These include increased anandamide (AEA) concentrations in the thalamus and cerebellum,
  and elevated levels of 2-arachidonoylglycerol (2-AG) in the hippocampus, cortex,
  and cerebellum. While the synthetic CB1 receptor agonist WIN 55,212-2 has shown
  no significant effects on associated neuropsychiatric comorbidities, positive allosteric
  modulators (PAMs) of CB1 receptors have been demonstrated to enhance sociability
  and reduce exaggerated startle responses (see main text for references). The symbol
  ↓ indicates a decrease in expression, concentration, or function; ↑ indicates an
  increase in expression, concentration, or function; ↔ denotes no significant change
  or an unclear direction; and Ø represents the absence or lack of effect'
