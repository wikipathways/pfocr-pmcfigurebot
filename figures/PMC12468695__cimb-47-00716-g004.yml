figure_title: This overview highlights how curcumin modulates intrinsic and extrinsic
  apoptosis pathways in colorectal cancer cells (CRCs).
caption: This overview highlights how curcumin modulates intrinsic and extrinsic apoptosis
  pathways in colorectal cancer cells (CRCs). Curcumin induces apoptosis by activating
  (blue arrows) or inhibiting (red dashed lines) various molecular targets and signaling
  pathways. It downregulates antiapoptotic proteins of the Bcl-2 family and apoptosis
  inhibitors like Survivin and XIAP. Simultaneously, it promotes the production of
  ROS (ROS) and pro-apoptotic proteins, facilitating mitochondrial cytochrome c (C)
  release. Additionally, curcumin upregulates Fas and death receptor 5 (DR5), triggering
  the extrinsic apoptotic pathway. Curcumin also induces ferroptosis, reducing CRC
  proliferation [95,96,97]. The figure was prepared using Biorender
