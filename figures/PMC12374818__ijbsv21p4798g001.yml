figure_title: SETD1B is associated with the stem-like properties of hepatocellular
  carcinoma (HCC).
caption: SETD1B is associated with the stem-like properties of hepatocellular carcinoma
  (HCC). (A) The pan-cancer-view of SETD1B. (B) Spatial transcriptomics (HRA000437)
  analysis of SETD1B expression in liver tumor-adjacent tissue and HCC tissue. (C)
  The UMAP of spatial transcriptomics (HRA000437) analysis showing the expression
  of SETD1B in in liver tumor-adjacent tissue and HCC tissue. (D) Overall survival
  prognosis of SETD1B in liver cancer. (E) Enrichment of stemness signaling pathways
  associated with SETD1B. (F) Correlation and p-value ranking of stemness-related
  markers CD44, MYC, Nanog, CD133, EpCAM, and OCT4 with SETD1B. (G) Immunofluorescence
  (IF) staining of SETD1B and OCT4 in normal and tumor specimens. (H) Quantification
  of SETD1B and OCT4 fluorescence in each normal and tumor specimens. ** p < 0.01,
  *** p < 0.001
