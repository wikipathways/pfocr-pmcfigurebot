caption: Classification of differentially expressed mRNAs in the CBD or THC group
  compared to the control group as assessed using gene ontology (GO) and Kyoto Encyclopedia
  of Genes and Genomics (KEGG) pathway enrichment. (a,b) The top 20 enriched GO terms
  in the biological process (BP) category for upregulated (a) and downregulated (b)
  mRNAs in the CBD group compared to the control group. (c) KEGG pathway enrichment
  analysis of upregulated (red) and downregulated (blue) mRNAs in the CBD group. The
  dot plot displays only those KEGG pathways that were significantly enriched (p <
  0.05). (d,e) The top 20 enriched GO terms in the BP category for upregulated (d)
  and downregulated (e) mRNAs in the THC group compared to the control group. (f)
  KEGG pathway enrichment analysis of upregulated (red) and downregulated (blue) mRNAs
  in the THC group
