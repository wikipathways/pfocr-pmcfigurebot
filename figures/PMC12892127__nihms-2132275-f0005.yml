figure_title: Age-related gene comparison analysis of oxidative stress pathway genes
  in WT mice at 6 and 9 months of age.
caption: Age-related gene comparison analysis of oxidative stress pathway genes in
  WT mice at 6 and 9 months of age. (A) Heat map of all 84 oxidative stress pathway
  genes (plotted as log2FC), (B) glutathione peroxidases (GPx), 5C) peroxiredoxins
  (TPx), (D) oxidative stress response genes, (E) reactive oxygen species (ROS) metabolism
  genes, (F) antioxidants. All data are normalized to the 6-month WT control group.
  Data represented WT control and WT UCMS mice at 6 and 9 months of age. *p ≤ 0.05,
  **p ≤ 0.01, ***p ≤ 0.001, ****p ≤ 0.0001; mean ± SEM. n = 6–9/group. Blue dots =
  male data; white dots = female data. Data were compared using Two-way ANOVA, with
  the main effect of stress and time (and their interaction) with a Tukey post-hoc
  test. Glutathione peroxidase 1 (Gpx1), 4 (Gpx4), and 5 (Gpx5), glutathione S-transferase
  kappa 1 (Gstk1), cathepsin B (Ctsb), dual oxidase 1 (Duox1), excision repair cross-complementing
  rodent repair deficiency, complementation group 2 (Ercc2), prion protein (Prnp),
  ferritin heavy polypeptide 1 (Fth1), heat shock protein 1A (Hspa1a), Parkinson disease
  (autosomal recessive, early onset) 7 (Park7), proteasome subunit beta type 5 (Psmb5),
  thioredoxin 1 (Txn1), xeroderma pigmentosum complementation group A (Xpa), superoxide
  dismutase 1 (Sod1), peroxiredoxin 4 (Prdx4) and 5 (Prdx5), intraflagellar transport
  172 (Ift172), glutathione reductase (Gsr), sulfiredoxin 1 homolog (Srxn1), albumin
  (Alb), recombination activating gene 2 (Rag2), and vimentin (Vim)
