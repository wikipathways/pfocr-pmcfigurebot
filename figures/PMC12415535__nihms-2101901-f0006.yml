figure_title: Single-cell Functional Profiling Report for patient samples
caption: '(a) Overview: Extended human kidney reference atlas. Single-cell Functional
  Profiling compares gene expression coordination of an individual patient to a refence.
  Representative results from a biopsy of a patient with IgA Nephropathy (right).
  Radar plots indicate the cell type (listed outside) and the number of gene sets
  with significant changes in coordination (padj < 0.05). Top dyscoordinated gene
  sets are highlighted for podocytes and proximal tubule cells. Dot color represents
  scaled R2 values. Dot size indicates the frequency of significant changes for the
  specific cellular function among all diseased samples. X-axis shows the significance
  of the change (−log10(padj)).(b) Functional Profiling Report for a biopsy from a
  patient with hypertensive kidney disease.(c) Underlying genes of “Sodium Ion Transport”
  coordination changes (DCT_CNT_CD) from the individual H-CKD biopsy. Gene expression
  distributions are shown in density plots (reference = blue). Smoothed density estimate
  (y-axis), reflecting the relative number of samples for each normalized sample gene
  expression value (x-axis). The red arrow indicates the respective normalized gene
  expression of the H-CKD biopsy query.(d) Gene expression coordination changes of
  “Sodium ion transport” in DCT_CNT_CD cells in CKD samples without hypertension (HT−,
  n = 9), hypertension without diabetes (HT+ DM−, n = 15), and patients with hypertension
  and diabetes (HT+ DM+, n = 41). Coordination (R2, y-axis) with bars representing
  the mean. Red dots indicate padj < 0.05 for the respective sample.(e) Gene expression
  coordination changes (R2, y-axis) of “TNF −” and “mTOR signaling” pathways (PT)
  in AKI (acute kidney injury, n = 21), CKD (chronic kidney disease, n = 69), or PKD
  (polycystic kidney disease, n = 7).(f) Heatmap of coordination changes (R2 values)
  in the “mTOR Signaling” pathway in individual samples (rows) and cell types (columns).
  R2 values are plotted, darker red indicating lower values (coordination changes).
  Only samples with significant changes in at least one cell type are shown. Non-significant
  samples are assigned a R2 = 1.Statistics in (a), (b), and (d)–(f) were obtained
  from the CellSpectra sample-level analysis and FDR-corrected for multiple pathway
  testing'
