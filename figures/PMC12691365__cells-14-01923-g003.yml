caption: 'Clinical trials summarizing the therapeutic approach in AS (January 2024–September
  2025). Many registered trials focus on biologic disease-modifying antirheumatic
  drugs (bDMARDs), with IL-17 pathway inhibitors and non-pharmacological interventions
  such as physical rehabilitation representing the most intensively studied class.
  Other categories include JAK inhibitors, IL-23 inhibitors, microbiome-targeted therapies
  (e.g., fecal microbiota transplantation. Abbreviations: AS-ankylosing spondylitis;
  bDMARDs-biologic disease-modifying antirheumatic drugs; JAK-Janus kinase; IL-interleukin;
  TNF-tumor necrosis factor)'
