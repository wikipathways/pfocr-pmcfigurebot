figure_title: Signaling and Transcriptional Regulation of Th2 Cells.
caption: 'Signaling and Transcriptional Regulation of Th2 Cells. This diagram illustrates
  the complex network regulating Th2 cell function. Key activating pathways are initiated
  by external cytokines: Interleukin-4 (IL-4) activates the STAT6 pathway, and Interleukin-2
  (IL-2) activates the STAT5 pathway. These signals induce the master transcription
  factors GATA3 and C-MAF, which drive the expression of effector cytokines IL-4,
  IL-5, and IL-13. This network is tightly controlled by multiple negative feedback
  mechanisms. Internally, the STAT6 pathway induces inhibitors like SOCS and Grail,
  while the transcription factor T-bet antagonizes the Th2 program. Externally, regulatory
  T cells (Tregs) suppress Th2 cells through both direct cell contact-dependent inhibition
  and the release of inhibitory cytokines like IL-10'
