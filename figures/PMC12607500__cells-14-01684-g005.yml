figure_title: Proteomic profiling of melanogenesis regulation.
caption: 'Proteomic profiling of melanogenesis regulation. (A) Z-score normalized
  heatmap of melanogenesis-associated protein expression across groups. (B) Co-expression
  network analysis of key melanogenic protein. * denote statistically significant
  correlations (p < 0.05), with more * indicating higher significance levels: *, 0.01
  < p < 0.05; **, 0.001 < p < 0.01; ***, p < 0.001. (C–E) GSEA at protein level for
  melanosome (GO:0042470), tyrosine metabolism (KO: 00350), and melanogenesis pathway
  (ko04916). (F,G) Fontana–Masson histochemical staining: (F) Near-complete absence
  of melanin granules in group W skin; (G) abundant melanin deposition (arrows) distributed
  across epidermal, dermal, and subcutaneous layers in group C; (H) the percentage
  of melanin granules in the area of the skin (200×, %). Epi, epidermal layer; CL,
  compact layer'
