figure_title: 'Microglia-synapse interactions in AD: (A) The state and transcriptional
  properties of microglia are altered by the induction of abnormally deposited oligomeric
  Aβ.'
caption: 'Microglia-synapse interactions in AD: (A) The state and transcriptional
  properties of microglia are altered by the induction of abnormally deposited oligomeric
  Aβ. Then, microglia can effectively phagocytose Aβ oligomers with the assistance
  of TREM when new Aβ oligomers are generated while performing their anti-inflammatory
  effects. (B) Microglia form a “barrier” around Aβ plaques to prevent Aβ from damaging
  surrounding cells (including synapses) and limit the growth of fibers within Aβ
  plaques. Meanwhile, microglia can secrete hydrolases that promote the degradation
  of Aβ plaques. (C) Synapses damaged by Aβ can be recognized and phagocytosed by
  microglia through the complement pathway, thereby reducing the spread of damage
  along axons and limiting the damage near plaques. (D) With the accumulation of tau
  and NFT, the pro-inflammatory effects of microglia gradually enhanced, the phagocytosis
  of Aβ by microglia gradually weakened; microglia-induced peripheral astrocytes adopting
  a neurotoxic A1 phenotype; The reduction or deficiency of SIRPα increases the abnormal
  pruning of synaptic structures by microglia, further lead to the loss of neurons
  and synapses'
