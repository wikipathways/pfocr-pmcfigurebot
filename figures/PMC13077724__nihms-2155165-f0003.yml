figure_title: SR1 Promotes EC Proliferation through a Non-Canonical AHR Pathway
caption: 'a. Heatmap comparing the transcriptome between HUVECs cultured in vehicle
  or SR1 for 12 hours (n=6 patient-derived HUVEC lines).b. Heatmap comparing the transcriptome
  between HUVECs cultured in vehicle or SR1 for 48 hours (n=6 patient-derived HUVEC
  lines).c. WikiPathway analysis of 12 hours SR1 treated HUVECs compared to vehicle
  treated cells.d. Expression of canonical AHR pathway downstream genes CYP1A1, CYP1B1,
  and AHR in HUVECs treated with vehicle, UM171 or SR1 by RTq-PCR. Data represent
  mean ± s. d. p values, two-way ANOVA. (n=6 independent experiments).e. Cell expansion
  of HUVECs with treatment of vehicle (1: 10,000 DMSO) or two canonical AHR inhibitors,
  CH223191 (1μM) and α-naphthoflavone (ANF, 1μM). For each condition, 2,000 EC were
  plated and cultured for 8 days. Data represent mean ± s. d. p values, RM one-way
  ANOVA with the Geisser-Greenhouse correction. (n=8 experiments).f. Cell expansion
  of control (non-target) and AHR knockdown HUVECs (Sh820, Sh821, Sh823) with vehicle
  or SR1. For each condition, 2,000 ECs were plated and cultured for 8 days. Data
  represent mean ± s. d. p values, two-way ANOVA. (n=6 independent experiments).g.
  Cell expansion of HUVECs with wild type AHR or nucleus entering deficient mutant
  AHR in response to SR1 and FICZ. For each condition, 2,000 ECs were plated and cultured
  for 8 days. Data represent mean ± s. d. p values, RM two-way ANOVA with the Geisser-Greenhouse
  correction, matched values are both stacks and spread across a row. (n=11 independent
  experiments)'
article_title: A non-canonical aryl hydrocarbon receptor pathway authorizes and safeguards
