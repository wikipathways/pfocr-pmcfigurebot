figure_title: LncRNAs and Vascular Smooth Muscle Cells.
caption: LncRNAs and Vascular Smooth Muscle Cells. This diagram illustrates the molecular
  mechanism of lncRNA in regulating key biological processes (including phenotypic
  transformation, osteogenic transformation, apoptosis, proliferation, and migration)
  in VSMCs. In the figure, solid arrows indicate activation or promotion; T-shaped
  arrows represent inhibition; phosphorylation events are indicated by a circled “P”
  on arrows; dashed boxes denote key affected indicators; double wavy lines represent
  double-stranded DNA. In phenotypic switching, the regulatory role of lncRNAs was
  delineated into anti-phenotypic switching (e.g., ANRIL and PEBP1P2) and pro-phenotypic
  switching (e.g., NEAT1) categories. In the apoptosis pathway, the downstream effector
  molecules of pro-apoptotic (e.g., CASC11, p21, etc.) and anti-apoptotic (e.g., H19
  and Punisher) lncRNAs were identified. In the proliferation and migration module,
  the signal cascades of lncRNAs that promote proliferation and migration (e.g., ANRIL
  and XIST) and anti-proliferation and migration (e.g., MEG3 and UCA1) were divided,
  covering classic pathways such as RAS/RAF/ERK and PI3K/AKT/mTOR.Created in BioRender.
