figure_title: GlcNAc can activate STAT3 when glucose is depleted
caption: (A) Volcano plots for RNA-Seq data from CRC cell lines treated with 0 or
  25mM glucose for 4 hours. ER stress genes are labelled in the plots. (B) CRC cell
  lines treated with ER stress inducers tunicamycin (6μM) or thapsigargin (2μM) or
  DMSO control for 24 hours. (C) Schematic of the hexosamine biosynthesis pathway
  (HBP). (D) CRC cell lines treated with glucose free media overnight with 0, 12.5,
  or 25mM N-acetylglucosamine (GlcNAc) for 24 hours. (E) CRC cell lines treated with
  0 or 25mM glucose for 24 hours, GlcNAc (25mM) for 24 hours, and IL-6 (20ng/mL) for
  30 minutes
