caption: KEGG pathway enrichment analysis of DEGs in ΔbkdA1 and F2365PrfA* strains
  compared to WT strain. The analysis highlights upregulated (A) and downregulated
  (B) pathways in ΔbkdA1 strain, as well as upregulated (C) and downregulated (D)
  pathways in the F2365PrfA* strain. Each dot represents a specific pathway, with
  the size of the dot corresponding to the number of genes involved in that pathway.
  The color gradient indicates the adjusted p-value. The x-axis shows the enrichment
  factor
