figure_title: The inhibition of glycolysis normalized the W.Yaa TFH transcriptome
caption: '(A–D) RNA-seq was performed on TFH cells from 2DG-treated or untreated W.Yaa
  mice (n = 3 per group).(A) Principal-component analysis (PCA) in TFH cells from
  2DG-treated (green) and control (Ctrl, red) W.Yaa mice.(B) Volcano plot of DEGs
  upregulated (green) or downregulated (red) in 2DG-treated W.Yaa TFH cells.(C) Kyoto
  encyclopedia of genes and genomes pathways differentially enriched (green: up, red:
  down) in 2DG-treated W.Yaa TFH cells.(D) Heatmaps of DEGs in the indicated pathways.(E)
  Quantitative reverse-transcription PCR validation of DEGs in the cytokine-cytokine
  receptor interaction pathway in TFH cells from two independent cohorts of 2DG-treated
  (green) and Ctrl (red) W.Yaa mice (n = 7). Results were normalized to the Ctrl means.
  Mean ± SEM, compared with t tests. *p < 0.05, **p < 0.01, ***p < 0.001, and ****p
  < 0.0001.See also Figures S3-S6'
article_title: Glycolysis inhibition functionally reprograms T follicular helper cells
