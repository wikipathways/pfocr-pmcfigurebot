figure_title: CCT2 promotes glycolysis in HCC cells via interaction with ALDOA.
caption: 'CCT2 promotes glycolysis in HCC cells via interaction with ALDOA. (A) Volcano
  plot of the interactors of CCT2 detected by co-IP/MS (1379 interactors). (B) KEGG
  pathway analysis of CCT2 interactors identified by co-IP/MS. (C) Top-10 interactors
  of CCT2 based on Log2FC (anti-CCT2 vs. anti-IgG). (D) Extracellular acidification
  rate (ECAR) assay for glycolytic metabolism assessment of shNC- and shCCT2-transfected
  Huh7 and HCCLM3 cells (n = 3). (E) Glucose uptake assay of shNC- and shCCT2-transfected
  Huh7 cells and HCCLM3 cells (n = 3). (F) Lactate detection assay in the medium of
  shNC- and shCCT2-transfected Huh7 cells and HCCLM3 cells (n = 3). (G) Lactate levels
  in subcutaneous xenografts in BALB/c nude mice implanted with shNC- and shCCT2-transfected
  HCCLM3 cells (n = 6) and in subcutaneous xenografts in BALB/c nude mice implanted
  with oeNC- and oeCCT2-transfected Hep3B cells (n = 6). (H) Exogenous co-IP followed
  by western blot to detect the interaction between CCT2 (Flag-CCT2) and ALDOA (HA-ALDOA)
  in HEK293T cells. (I) Semi-exogenous co-IP followed by western blot to detect the
  interaction between CCT2 (Flag-CCT2/CCT2) and ALDOA (HA-ALDOA/ALDOA) in Huh7 cells.
  (J) Endogenous co-IP followed by western blot to detect the interaction between
  CCT2 and ALDOA in Huh7 cells. (K) GST pulldown assays for detecting direct interactions
  between CCT2 and ALDOA proteins. (L) Immunofluorescence staining of CCT2 and ALDOA
  in Huh7 cells (Scale bar, 5 μm). (M) Molecular docking analysis of CCT2 and ALDOA
  using HDOCK (confidence score: 0.9118). (N) Schematic diagram of human CCT2 domains
  and strategy for generating CCT2 deletion mutants and co-IP experiments in HEK293T
  cells to assess interactions between ALDOA and CCT2 fragments. Differences were
  analyzed by Student''s t-test or ANOVA. After ANOVA, Tukey''s post-hoc test was
  used for multiple comparisons. Three biological replicates were performed for cell
  experiments. Data are presented as mean ± SD. *P < 0.05, ** P < 0.01, *** P < 0.001'
