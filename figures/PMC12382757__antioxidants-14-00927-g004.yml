figure_title: Proteomics and metabolomics analysis of muscles revealed both tissue-
  and genotype-specific differences.
caption: 'Proteomics and metabolomics analysis of muscles revealed both tissue- and
  genotype-specific differences. (A) Muscle tissues (gastrocnemius and soleus) were
  collected from hG6PDND and hG6PDA− mice post-exercise. (B) Relative levels of G6PD
  show significant protein expression between the muscles organs. (C) Soleus and (D)
  gastrocnemius show significant genotype-specific differences for each tissue type,
  as measured by ANOVA. Protein abundances were grouped as being significantly increased
  or significantly decreased, with significant analytes indicated with a *. (E) Pathway
  enrichment analysis of significant metabolites and proteins within the soleus. (F)
  Pathway enrichment analysis of significant metabolites and proteins within the gastrocnemius.
  (G) Network and GO analysis of significant proteins in hG6PDA− muscle tissues. Significance:
  *: p < 0.05'
