figure_title: NAT10 depletion downregulates chemokine/cytokine genes and decreases
  neutrophils, monocytes, and pro-tumor macrophages in the tumor microenvironment
caption: '(A) Volcano plot of differentially regulated genes (Log2 FC) in Nat10 KO
  4T1 cells. (B) Normalized RNA-seq reads of differentially regulated genes in Nat10
  KO 4T1 cells. ANOVA with Tukey’s multiple comparison test, mean ± s.e.m. (C) Venn
  diagram showing the overlap of genes that have decreased H3K27ac marks and decreased
  transcription in Nat10 KO 4T1 cells. (D) GSEA hallmark pathways down- and upregulated
  in Nat10 KO 4T1 cells. (E) IGV tracks of ATAC-seq and ChIP-seq peaks at representative
  downregulated key immune-related, inflammatory response genes and upregulated genes
  in Nat10 KO 4T1 cells. (F) Tumor infiltrating leukocytes analyzed by high-parametric
  flow cytometry from 4T1 WT and Nat10 KO-c43 primary tumors. Absolute number of leukocytes
  (live CD45+) per mg of tumor. (G) t-SNE projection of tumor-infiltrating leukocytes;
  contour density plots showing cell distribution in WT (center) and Nat10 KO (right)
  tumors. (H) Pie chart of main immune cell populations. (I) Absolute number of each
  main immune cell population per mg of tumor. (J) UMAP projection of MP subsets;
  clustering of MP subsets (left): monocytes (Mono1, Mono2, Mono3, Mono4), macrophages
  (Mac1, Mac2, Mac3, Mac4, and Mac5), and dendritic cells [DC1, DC2, DC3, and plasmacytoid
  dendritic cells (pDC)]; contour density plots showing cell distribution in WT (center)
  and Nat10 KO (right) tumors. (K) Heatmap representing the of expression of indicated
  markers (scaled by marker) for each MP subset with hierarchical clustering indicated
  on top and markers on left. (L) Absolute number of each major MP population per
  mg of tumor. (F) Mann-Whitney U test, mean ± s.d. (I, L) Multiple Mann-Whitney test
  with Bonferroni-Dunn’s multiple comparisons test, mean ± s.d. n = 10'
