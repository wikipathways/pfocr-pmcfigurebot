figure_title: Immunoregulatory Network of TIGIT and VISTA pathways in T-cell exhaustion
  and suppression. This figure depicts a complex network of immune interactions involving
  the TIGIT and VISTA signaling pathways. The central node, TIGIT, is connected to
  multiple immune checkpoint molecules, including CTLA4, PDCD1, LAG3, and CD283, which
  are involved in T-cell checkpoint signaling and immunosuppression. TIGIT also regulates
  the expression of HLA-A in antigen processing and presentation (yellow box). The
  VISTA-VSIR signaling axis (blue box) interacts with IL10, inducing T-cell exhaustion
  through cytokine and chemokine production (green box), particularly CXCL13 and IFNG
  production. Additionally, TIGIT influences regulatory T cells (Treg suppressor,
  gray box) and modulates the production of cytotoxic molecules (GZMA, MKB7) in the
  immune response. This network emphasizes the interplay between immune checkpoints,
  cytokines, and chemokines in controlling T-cell function and exhaustion in the tumor
  microenvironment
