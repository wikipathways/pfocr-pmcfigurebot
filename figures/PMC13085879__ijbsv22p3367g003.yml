figure_title: LINC-EPS deficiency Promotes Ferroptosis in Dopaminergic Neurons In
  vitro and In vivo.
caption: 'LINC-EPS deficiency Promotes Ferroptosis in Dopaminergic Neurons In vitro
  and In vivo. (A) Heatmap of differentially expressed genes from regulated cell death
  pathways, identified by RNA-seq of SN tissue from MPTP-treated WT and LINC-EPS⁻/⁻
  mice. (B)Relative cell viability of primary WT and LINC-EPS⁻/⁻ neurons treated with
  MPP⁺ in the presence of inhibitors for ferroptosis (Ferrostatin-1, Fer-1), apoptosis
  (Z-VAD-FMK), necroptosis (Necrostatin-1s, Nec-1s), or pyroptosis (VX-765). Cell
  viability of MPP⁺-treated WT neurons was set as 1.0 to assess the protective effects
  of inhibitors (n = 4). (C) Representative immunoblots of ferroptosis-related proteins
  (FTL, FSP1, xCT, GPX4, CQ10B, CQ10A) in primary neurons from WT and LINC-EPS⁻/⁻
  mice treated with or without MPP⁺ (500 μM, 24 h). Due to limited primary neuron
  yield, two technical replicates from pooled neurons (six mice per pool) (D) Representative
  TEM images of mitochondria in primary neurons from WT and LINC-EPS⁻/⁻ mice treated
  with vehicle or MPP⁺. Blue arrows indicate ferroptosis-associated mitochondrial
  alterations, including shrinkage, increased membrane density, and outer membrane
  rupture. Scale bar, 500 nm. (E) Representative images of Prussian blue staining
  for iron in the SN of LINC-EPSf/f and LINC-EPSΔDat mice treated with saline or MPTP.
  Right: Quantification of the number of iron-positive cells per microscopic field
  (n = 12). Blue arrows highlight iron-positive cells. Scale bar, 50 µm. (F, G) Quantification
  of MDA content, an end-product of lipid peroxidation (F) and GSH/GSSG ratio as an
  indicator of the cellular redox state (G) in SN tissue from MPTP-treated LINC-EPSf/f
  and LINC-EPSΔDat mice (n = 3). (H) Representative immunoblots of ferroptosis-related
  proteins in SN tissue from LINC-EPSf/f and LINC-EPSΔDat mice treated with MPTP.
  Quantification is provided in Figure S2C. (I) Representative co-immunofluorescence
  images of GPX4 (red) and TH (green) in the SNpc of LINC-EPSf/f and LINC-EPSΔDat
  mice treated with MPTP. Right: Quantification of GPX4 MFI measured within the soma
  of individual TH-positive neurons (n = 6). Scale bar, 20 µm. Data are presented
  as mean ± SEM. Statistical significance was determined by two-way ANOVA with Tukey''s
  post-hoc test or a two-tailed unpaired Student''s t-test. *P < 0.05, **P < 0.01,
  ***P < 0.001. ns, not significant'
