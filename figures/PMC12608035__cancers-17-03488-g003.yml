figure_title: Integrated gene dependency and drug sensitivity profiling identifies
  therapeutic vulnerabilities in HSP90AB1-resistant cells.
caption: Integrated gene dependency and drug sensitivity profiling identifies therapeutic
  vulnerabilities in HSP90AB1-resistant cells. (A,B) Enriched pathways among CRISPR
  dependencies in resistant lines (A) and sensitive lines (B). (C) Differential drug
  sensitivities from The Genomics of Drug Sensitivity in Cancer (GDSC) datasets across
  sensitive and resistant populations visualized by X/Y plot with median IC50 for
  sensitive lines on the x-axis and resistant lines on the y-axis. (D) Overlap of
  gene dependencies, mutations, DEGs, and drug targets in resistant lines. (E) Pathway
  enrichment from multiple enrichment analyses (PANGEA), highlighting the top 25 pathways
  for the genes that are drug targets in resistant lines compared to parallel analyses
  in DEGs, dependencies and drug target gene lists. (F) Network analysis for visualizing
  protein–protein interactions (PPIs), drug–protein interactions and known Hsp90β
  interactors contributing to resistance
