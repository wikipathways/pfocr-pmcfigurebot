figure_title: Working model for Mec1-Ddc2/Dpb11 assembly on gapped DNA
caption: A, Canonical early steps of DNA damage and replication stress checkpoint
  signaling on a 1 kb ssDNA gap. RPA (light blue) binds to ssDNA and Mec1-Ddc2 (red)
  binds to RPA. The Mec1 activators Ddc1, as part of the 9-1-1 heterotrimer (yellow),
  and Dpb11 (green) are shown at the 5’ gap junction. The disordered C-terminal tails
  of Ddc1 and Dpb11 make up the activation radius (dashed circle). The gap-binding
  functions of Dpb11 identified in the current study help bring Mec1-Ddc2 into the
  activation radius, as in B and C. B, Dpb11 recruits Mec1-Ddc2 to the gap junctions,
  possibly as a dimer, via a predominately three-dimensional search. Insets, two pathways
  of recruitment. C, Protein bridges formed by Dpb11, RPA, or a combination of the
  two, stabilize ssDNA loops on gapped DNA
article_title: Molecular interplay between the DNA damage checkpoint kinase Mec1-Ddc2
  and its activator Dpb11 on gapped DNA
