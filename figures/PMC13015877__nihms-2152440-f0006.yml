figure_title: Gene regulation in skin from WT and β2-AR KO mice 6 h after a single
  dose of UV radiation.
caption: Gene regulation in skin from WT and β2-AR KO mice 6 h after a single dose
  of UV radiation. (A) Genes showing > 2-fold differential expression across experimental
  conditions served as input into TELiS promoter sequence-based bioinformatics analysis
  of transcription factor activity for pre-specified pathways involved in inflammation,
  cell differentiation and immune response. Data represent log2-fold difference in
  transcription factor-binding motif density in up- vs down-regulated genes for each
  condition (compared to control); red = up-regulated, blue = down-regulated. (B)
  Effect of experimental conditions on expression of pre-specified sets of mesenchymal
  and epithelial characteristic genes (and their difference, representing epithelial-mesenchymal
  transition). Data represent mean fold-difference from control condition; bars represent
  SEM (n = 4). (C) Immune cell Transcript Origin Analysis of genes showing >2-fold
  differential expression across experimental conditions. Data represent mean cell
  type diagnosticity score, red = up-regulated, blue = down-regulated. (D) NetworkAnalyst
  regulatory structure of gene transcripts down-regulated >2-fold in UV-exposed skin
  from Adrb2KO mice vs WT mice (edges represent regulatory associations as inferred
  from the TRRUST and SIGNOR 2.0 transcription control pathway databases)
