figure_title: Host factors associated with SARS-CoV-2 N protein.
caption: 'Host factors associated with SARS-CoV-2 N protein. (A) Expression of Flag-tagged
  SARS-CoV-2 N protein. Human 293T cells were transfected with a plasmid encoding
  a SARS-CoV-2 N-FLAG construct. At 48 h post-transfection, cells were harvested and
  protein extracts were subjected to immunoprecipitation using an anti-Flag antibody
  and then analyzed by SDS-PAGE and immunoblotting (Mock: non-transfected cells; N:
  cells transfected with the N-FLAG plasmid, Coomassie blue staining (middle panel),
  and Western blot analysis (left and right panels)). (B) Network of SARS-CoV-2 N
  protein interacting proteins generated with STRING. (C) Top twenty hub proteins
  in PPI network. (D) Venn diagram showing the overlapping N protein interactions
  and overlapping KEGG pathway between our study and data obtained from four references
  [23,24,25,26]'
