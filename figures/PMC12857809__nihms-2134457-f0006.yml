figure_title: Large-scale spatial transcriptomics reveal conserved IMM-EPI remodeling
  features in CRSwNP
caption: '(A) Experimental workflow for spatial transcriptomics analysis of a large
  validation cohort comprising 61 CRSwNP, 45 CRSsNP, and 7 control individuals, using
  GeoMx spatial transcriptomics coupled with PanCK, CD45, and CD68 antibodies to guide
  whole-transcriptome capture of specific cell types.(B) Representative images showing
  H&E staining, multiplexed immunofluorescence, and annotated cell regions for CRSwNP
  (left) and CRSsNP (right) samples. Cell types are annotated based on the multiplexed
  antibody stainings as EPI cells (magenta), IMM cells (green), and MLCs (blue). Scale
  bars: 50 m.(C) Heatmap demonstrating cell-type-specific gene expression patterns
  across EPI, IMM, and MLC regions.(D) Quantification of cell-type enrichment showing
  differential distribution of MLCs and IMM and EPI cells between CRSsNP and CRSwNP
  samples.(E) Barplot comparing the proportion of MLCs across control, CRSsNP, and
  CRSwNP samples. A pairwise two-sided Wilcoxon test was performed. See also Figure
  S6. Boxes indicate interquartile range (25th–75th), with the lines indicating the
  median.(F) Volcano plot showing DEGs in MLC regions between CRSsNP and CRSwNP conditions.
  Significant genes are highlighted in red (∣log2FC∣ > 1.5).(G) REACTOME pathway analysis
  highlight IMM regulatory pathways enriched in CRSwNP MLCs.(H) Violin plots comparing
  expression of type 1 (top row) and type 2 (bottom row) chemokines across sample
  types, demonstrating distinct inflammatory signatures. Boxes indicate interquartile
  range (25th–75th), with the lines indicating the median.(I) REACTOME pathway analysis
  showing tissue remodeling pathways enriched in CRSwNP MLCs.(J) Barplot comparing
  tuft cell signature scores across control, CRSsNP, and CRSwNP EPI regions. Boxes
  indicate interquartile range (25th–75th), with the lines indicating the median.(K)
  Correlation analysis between tuft cell scores and matrix metalloproteinase activation
  in MLCs. Blue lines indicate the mean, and gray regions highlight the 95% CIs.(L)
  Proposed model illustrating the interaction between tuft cells, MLCs, and CD4+ T
  cells in tissue remodeling and type 2 inflammation.See also Figure S2'
