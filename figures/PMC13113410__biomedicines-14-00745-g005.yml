figure_title: Functional annotation of differential metabolites between HSIL tissues
  and paired adjacent nor-mal tissues.
caption: 'Functional annotation of differential metabolites between HSIL tissues and
  paired adjacent nor-mal tissues. The superclass (A) and class (B) classification
  of differential metabolites. Numbers in parentheses indicate the metabolite count
  per superclass/class. (C) The top 30 significantly enriched KEGG pathways based
  on differential metabolites. (D) Chord plot displaying the association of dysregulated
  metabolites with KEGG pathways between HSIL and Adja groups. (E) The significantly
  enriched metabolic pathways in the SMPDB. (F) The pathway impact map integrating
  metabolite interaction network and pathway enrichment analysis results. (G) Differential
  abundance (DA) scores of metabolites involved in the top 30 pathways. SMPDB: Small
  Molecule Pathway Database'
