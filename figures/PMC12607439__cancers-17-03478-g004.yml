figure_title: 'The Role of Porphyromonas gingivalis in Oral Carcinogenesis and Progression
  by Remodelling the Tumour Microenvironment: A Narrative Review'
caption: P. gingivalis infection regulates cell cycling and cell proliferation through
  activation and phosphorylation of cyclin-dependent kinases (CDKs) and reduces TP53
  expression through the possession of fimbriae (FimA). This periodontal pathogen
  accelerates progression through the S phase of the cell cycle by preventing p53
  tumour suppressor gene activity and PI3K activation. Lowering TP53 expression promotes
  G1/S transition and upregulation of cyclin D1 and Cyclin E. The proliferation rate
  is also enhanced by modifying the expression of the oncogenic α-defensin gene and
  EGFR-dependent signalling. Also, it is possible that P. gingivalis may influence
  carcinogenesis through its role in the activation of β-catenin proteolysis by the
  non-canonical gingipain-dependent pathway
