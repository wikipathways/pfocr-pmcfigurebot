figure_title: Transcriptomic profiling and pathway enrichment in M.
caption: 'Transcriptomic profiling and pathway enrichment in M. bovis XJ01-infected
  BoMac cells. (A) Differentially expressed genes (DEGs) heatmap: Hierarchical clustering
  of 9926 DEGs (|log2 Fold Change | ≥ 1, padj ≤ 0.05) between infected (XJ01) and
  control (PBS) groups. Rows: genes; columns: biological replicates (n = 3). (B) Volcano
  plot of DEGs: Distribution of transcriptional alterations. Red: 1199 significantly
  upregulated genes (log2 Fold Change >1, padj < 0.05); Blue: 3224 downregulated genes
  (log2FC < −1, padj < 0.05). Dashed lines indicate significance thresholds. (C) Gene
  Ontology (GO) enrichment: Significantly enriched terms (p < 0.05) in Biological
  Process (BP), Cellular Component (CC), and Molecular Function (MF) categories. Top
  10 terms per category displayed. (D) Kyoto Encyclopedia of Genes and Genomes (KEGG)
  pathway enrichment: Bubble plot of significantly perturbed pathways (padj < 0.05).
  Circle size: gene count; color intensity: enrichment significance. (E) Key signaling
  pathway enrichment: Scatter plot highlighting apoptosis and p53 pathways (padj <
  0.001). Rich factor = DEGs annotated in pathway/total DEGs. (F) qRT-PCR validation
  of apoptosis-related genes: Expression changes (log2 Fold Change) of 12 candidate
  genes. Gadd45 and XIAP showed most pronounced alterations, concordant with RNA-seq
  data'
