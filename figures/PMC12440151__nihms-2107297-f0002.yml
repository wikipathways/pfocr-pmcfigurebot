figure_title: The lplA2 operon mediates resistance to ROS
caption: (A) Model of the LA salvage pathway in S. aureus.(B) Representation of the
  genetic organization of the lipoyl-protein ligase genes.(C) Growth curves of the
  indicated strains in RPMI medium for 12 h.(D) α-LA immunoblots of whole-cell lysates
  of the indicated strains after 9 h growth in RPMI medium (top) and Coomassie-stained
  gel (bottom). An arrow denotes the position of E2-PDH for comparison.(E) Susceptibility
  of the indicated strains to 30 μM NaOCl (n = 9 biological replicates).(F) Susceptibility
  of the indicated strains to 30 μM NaOCl (n = 5 biological replicates).(G) Susceptibility
  of the indicated strains to 15 mM H2O2 (n = 4 biological replicates).(H and I) The
  minimum inhibitory concentration of the indicated strains in cefazolin and trimethoprim-sulfamethoxazole
  (n = 4 biological replicates). y axis (I), trimethoprim and sulfamethoxazole concentrations.All
  biological replicates were conducted in technical triplicate. Boxplots indicate
  the median and quartiles, and whiskers indicate the range. Statistical significance
  was determined by one-way ANOVA with Dunnett’s multiple comparisons post hoc test.
  **p < 0.01, ***p < 0.001, ****p < 0.0001
