figure_title: GRO rescues the impaired profibrotic phenotypes of senescent cardiac
  fibroblasts and prevents age-related cardiac fibrosis and diastolic dysfunction.
caption: 'GRO rescues the impaired profibrotic phenotypes of senescent cardiac fibroblasts
  and prevents age-related cardiac fibrosis and diastolic dysfunction. A) Representative
  Western blot images displaying protein levels of Collagen I and III, TGFBR3, ALK1,
  α-SMA, and P21 in senescent CFs infected with adenovirus encoding FBLN7 (adFBLN7)
  and treated with DMSO or various concentrations of GRO (50, 100, and 200 μM). Quantifications
  are presented on the right. *: adNC+D-gal+DMSO vs. adNC+PBS+DMSO, &: adFBLN7+D-gal+DMSO
  vs. adNC+D-gal+DMSO, $: adFBLN7+D-gal+GRO50 vs. adFBLN7+D-gal+DMSO, #: adFBLN7+D-gal+GRO100
  vs. adFBLN7+D-gal+DMSO, %: adFBLN7+D-gal+GRO200 vs. adFBLN7+D-gal+DMSO. B) Schedule
  for FBLN7 overexpression and GRO supplementation in mice. C) Gross appearances of
  mice and their hearts in each group. D) Representative echocardiography images of
  the two groups of mice. Upper: B-mode; middle: PW Doppler mode; lower: tissue Doppler
  mode. Echocardiographic analysis of interventricular septal thickness in diastole
  (IVSd) and systole (IVSs), left ventricular posterior wall thickness in diastole
  (LVPWd) and systole (LVPWs), left ventricular mass, the ratio of early to late diastolic
  filling velocities (E/A), and the ratio of early diastolic filling velocity to left
  atrial pressure (E/e''), left ventricular ejection fraction (LVEF) and fractional
  shortening (FS%) are shown at the bottom. E) Representative images of H&E staining
  of hearts from aging mice (18 months old) injected with AAV-FBLN7 and administered
  40 mg/kg/d of GRO or solvent control via gavage. F) Representative WGA staining
  images of the two groups of mice, with quantification shown on the right. G) Representative
  micrographs of Masson staining in heart sections from the AAV-FBLN7-18M-GRO and
  AAV-FBLN7-18M-CTL mice, displaying three different views: upper: perivascular; middle:
  global; lower: interstitial. Quantifications of fibrotic areas are presented on
  the right. H) FBLN7 exerts its reversing effect on the impaired profibrotic phenotypes
  of senescent CFs by downregulating the TGFBR3/ALK1/Smad1 pathway, which may contribute
  to the pathogenesis of age-related cardiac fibrosis. GRO exerts antifibrotic effects
  possibly through interaction with FBLN7. Error bars represent the standard error
  of the mean (SEM). Statistical significance is indicated as follows: *P < 0.05,
  **P < 0.01, ***P < 0.001, ****P < 0.0001'
article_title: FBLN7 KO attenuates age-related cardiac fibrosis by promoting TGFBR3/ALK1/Smad1
  signaling and inhibiting the profibrotic phenotypes of cardiac fibroblasts
