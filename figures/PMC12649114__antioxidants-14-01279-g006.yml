caption: Summary illustration of the therapeutic effects of PD-MSCs on H2O2-injured
  RPE by increasing antioxidant enzymes via the Nrf2 pathway. PD-MSCs activate Nrf2
  through the PI3K/AKT signaling pathway, promoting the expression of antioxidant
  enzymes. Mitochondrial dynamics are regulated, leading to reduced mitochondrial
  ROS levels and stabilized mitochondrial membrane potential. RPE regeneration is
  enhanced with decreased lipoprotein accumulation and reduced apoptosis
