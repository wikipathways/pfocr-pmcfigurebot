caption: R. planticola elicits a different autophagy to confer resistance to PA14.
  (A) Workflow chart of the transcriptome of the R. planticola and OP50 groups. (B)
  Heatmap of up- and downregulated genes in the R. planticola and OP50 groups. (C)
  Volcano plot of up- and downregulated genes in the R. planticola and OP50 groups.
  (D) R. planticola was positively correlated with autophagy genes. (E) Heatmap of
  genes whose expression was upregulated or downregulated during autophagy in the
  R. planticola and E. coli OP50 groups. In the heatmap, red and blue represent the
  genes whose expression was upregulated and downregulated, respectively, in the R.
  planticola group compared with the E. coli OP50 group, and E. coli OP50 was negatively
  correlated with autophagy genes in the R. planticola and OP50 groups. (F) Genes
  whose expression was significantly upregulated in RP compared with that in OP50.
  (G) GO terms and KEGG pathway analysis of upregulated and downregulated genes in
  R. planticola vs. E. coli OP50
