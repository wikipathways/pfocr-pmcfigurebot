figure_title: Cellular pathways of cardiovascular resilience
caption: Signalling mediated by nuclear factor erythroid 2-related factor 2 (NRF2)
  is crucial for cellular resilience, that is, the capacity to maintain or return
  to cellular homeostasis. Disruptions in cellular homeostasis caused by sleep or
  metabolic disorders, toxic stress, ageing or diseases such as diabetes mellitus
  increase redox stress. As a stress-response factor, the functions of NRF2 in detoxification
  and antioxidant defence contribute to cellular resilience, together with other contributors
  such as Krüppel-like factor 2 (KLF2) and basic helix–loop–helix ARNT-like protein
  1 (BMAL1), epigenetic regulation (such as chemical changes to DNA or histones, or
  small RNA molecules), survival pathway (a network of cellular mechanisms that help
  to prevent damage from stress and promote continued function), a healthy lifestyle,
  physical exercise and chronopharmacology
article_title: 'Sleep and circadian rhythms in cardiovascular resilience: mechanisms,
