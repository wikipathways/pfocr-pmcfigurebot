figure_title: RAS activation contributes to exarafenib resistance in BRAF-mutant lung
  cancer cell lines
caption: a, Schematic of exarafenib-resistant cell lines (NCI-2405-ER, NCI-H1755-ER,
  and NCI-H1666-ER) generation through long-term dose-escalation exposure. b, Cell
  viability assay comparing exarafenib and belvarafenib sensitivity in parental and
  resistant cell lines. For exarafenib, IC50 values increased from 114 nM to 14,060
  nM in NCI-H2405 cells, from 422 nM to 2,139 nM in NCI-H1755 cells, and from 278
  nM to 1,513 nM in NCI-H1666 cells. The cells also exhibited cross-resistance to
  belvarafenib, with IC50 values increasing from 56 nM to 68,171 nM in NCI-H2405 cells,
  from 187 nM to 1,181 nM in NCI-H1755 cells, and from 870 nM to 5,100 nM in NCI-H1666
  cells. c, Time course analysis of MAPK and AKT signaling in parental and resistant
  lines treated with 500 nM of exarafenib. NCI-H2405-ER and NCI-H1666-ER cell lines
  exhibit a rebound in MAPK signaling, while NCI-H1755-ER cells maintains high pathway
  activation. d, RAS-RBD assay assessing RAS activation (RAS-GTP) in parental and
  resistant lines treated with exarafenib. Cells were treated with either DMSO or
  500 nM exarafenib for 4 hours. e, Cell viability assay evaluating RAS knockdown
  on exarafenib sensitivity in parental and resistant lines. Cells were transfected
  with control (siSCR) or RAS-targeting siRNA before exarafenib treatment. Data are
  mean ± s.d. P-values were calculated at selected points of interest (two-sided Student’s
  t-test). For NCI-H2405-ER, P = 1.04×10−9****, 4.02×10−12****, 7.99×10−12****, 3.41×10−12****
  (from left to right). For NCI-H1755-ER, P = 5.57×10−9****, 2.46×10−12****, 1.75×10−9****,
  7.98×10−7****. For NCI-H1666-ER, P = 2.55×10−6****, 2.10×10−9****, 3.42×10−7****.
  *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001
article_title: Targeting BRAF Class II and III Mutations in NSCLC with the pan-RAF
  inhibitor Exarafenib Reveals ARAF-KSR1-Mediated Resistance and Rational Combination
  Strategies
