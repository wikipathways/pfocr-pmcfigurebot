figure_title: Characterization of MetΔJMD osteoprogenitor cells
caption: (A and B) Representative Western blot time course (A) and quantification
  (B) of ERK activation following HGF stimulation of BMSCs from control (black; n
  = 3) and MetΔJMD (blue; n = 5) mice. Statistical analysis was conducted by 2-way
  ANOVA with Dunnett’s multiple-test correction including only 5- and 15-minute time
  points. (C and D) Relative (Rel.) expression (exp.) of Met (C) and Hgf (D) in BMSCs
  and PECs from control (n = 8–9) and MetΔJMD (n = 7–9) mice. Statistically significant
  differences were determined by 2-way ANOVA with Šidák’s multiple-test correction.
  (E and F) Representative Western blot (E) and quantification (F) of ERK pathway
  activation of serum-starved BMSCs and PECs from control (n = 5) and MetΔJMD (n =
  5) mice. Statistically significant differences were determined by 2-way ANOVA with
  Šidák’s multiple-test correction. (G) Cell count quantification of PECs from control
  (n = 4) and MetΔJMD (n = 4) mice. Statistically significant differences were determined
  by t test. (H and I) Relative expression of the mesenchymal adhesion genes Ncad
  (H) and Vim (I) in PECs from control (n = 6) and MetΔJMD (n = 6) mice. (G–I) Statistically
  significant differences were determined by 2-tailed t test. RT-qPCR values from
  cultured cells and other quantification data are presented as the mean ± SEM. *P
  < 0.05, ***P < 0.001, and ****P < 0.0001
