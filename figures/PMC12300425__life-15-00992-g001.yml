figure_title: Simplified diagram of the pathophysiological mechanisms underlying dystonia.
caption: 'Simplified diagram of the pathophysiological mechanisms underlying dystonia.
  The motor cortex controls voluntary movement and receives excitatory and inhibitory
  inputs from the thalamus, cerebellum, brainstem, and spinal cord. The basal ganglia
  play a central regulatory role in movement initiation through opposing pathways:
  the direct pathway promotes motor activity, while the indirect pathway suppresses
  it. An imbalance between excitatory and inhibitory signals within these circuits
  has been proposed as a key mechanism underlying dystonia. In addition, alterations
  in dopaminergic pathways have been shown to impact this balance, as evidenced by
  genetic variants affecting dopamine signaling and the clinical response observed
  in dopa-responsive dystonias. More recent evidence suggests that abnormal spatial
  and temporal activity within the direct pathway, particularly involving the globus
  pallidus internus (GPi) and substantia nigra pars reticulata (SNpr), may contribute
  to dystonia pathophysiology. The cerebellum has also been implicated, with disruptions
  in the cerebello–thalamo–cortical pathway and deficits in motor learning processes.
  Altered spatial and temporal discrimination of sensory stimuli appears to further
  contribute to dystonia onset, as highlighted by the presence of sensory tricks that
  temporarily relieve symptoms. This supports the hypothesis of a defective sensory
  gating mechanism, which normally regulates and adjusts motor responses to peripheral
  sensory inputs, enabling appropriate compensatory movements. Finally, disrupted
  neural plasticity, especially within inhibitory circuits descending from the brainstem
  and spinal cord, has been suggested as an additional mechanism contributing to the
  development of dystonia. Excitatory pathways are shown in green, inhibitory pathways
  in blue, and alterations leading to dystonia in red [11]'
