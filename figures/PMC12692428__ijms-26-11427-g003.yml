figure_title: 'Sequential model of Lp(a) pathophysiology in diabetes mellitus: (A)
  Endothelial and extracellular matrix anchoring: (A1) Apo(a) binds decorin/GAGs through
  lysine sites on apo(a).'
caption: 'Sequential model of Lp(a) pathophysiology in diabetes mellitus: (A) Endothelial
  and extracellular matrix anchoring: (A1) Apo(a) binds decorin/GAGs through lysine
  sites on apo(a). (A2) Subendothelial anchoring via Lp(a)–fibronectin/type I collagen
  interactions (heparin-facilitated), with possible involvement of MAC-1. (B) Endothelial
  activation and chemotaxis. Upregulation of VCAM-1, ICAM-1, and E-selectin, recruitment
  of monocytes, and differentiation into macrophages releasing IL-1β, IL-18, TNF-α,
  and IFN-γ. (C) Lp(a)-bound oxidized phospholipids (oxPL). Elevated Lp(a) and its
  oxPL act as DAMPs that trigger PRR, promoting innate responses and modulating the
  adaptive arm: (C1) Atherothrombotic effect. (C2) Antioxidant effect: PAF-AH on Lp(a)
  hydrolyzes oxPL (oxPL-hydrolysate). (D) Structural homology between Lp(a) and plasminogen.
  KIV/KV domains in apo(a) mimic plasminogen and compete for lysine-binding sites,
  impairing fibrinolysis (an antifibrinolytic action). (E) Non-enzymatic glycation
  of Lp(a). Glucose forms Schiff bases (hours) and Amadori products (days), evolving
  to AGEs (weeks); glycation of apoB-100 reduces LDLR binding, favoring gLp(a). (F)
  Additional atherothrombotic/antifibrinolytic potential. Lp(a)/apo(a) occupancy of
  lysine sites diminishes plasminogen binding and tPA activation, reducing fibrin
  affinity and promoting thrombo-resistance. Solid arrows indicate chronological biochemical
  steps, dashed arrows indicate modulatory or inhibitory interactions, and the upward
  arrow (↑) denotes a relative increase (e.g., in concentration, expression, or activity
  of the indicated component or pathway). Abbreviations: Lp(a): lipoprotein(a); apo(a):
  apolipoprotein(a); GAG: glycosaminoglycan; MAC-1: αMβ2 integrin; VCAM-1: vascular
  cell adhesion molecule-1; ICAM-1: intercellular adhesion molecule-1; E-selectin:
  endothelial-selectin; IL-1β. interleukin-1 beta; IL-18: interleukin-18; TNF-α: tumor
  necrosis factor-alpha; IFN-γ: interferon-gamma; oxPL: oxidized phospholipid; DAMPs:
  damage-associated molecular patterns; PRRs: pattern recognition receptors; PAF-AH:
  lipoprotein-associated phospholipase A2 (Lp-PLA2); KIV/KV: apo(a) kringle IV/kringle
  V; AGEs: advanced glycation end products; LDLR: low-density lipoprotein receptor;
  tPA: tissue plasminogen activator; gLp(a): glycated Lp(a). Created with https://BioRender.com/uenhksj
  (accessed on 31 October 2025)'
