figure_title: Molecular mechanisms underlying radioiodine sensitivity in anaplastic
  thyroid carcinoma (APC).
caption: 'Molecular mechanisms underlying radioiodine sensitivity in anaplastic thyroid
  carcinoma (APC). The left panel illustrates the interaction of key signaling pathways
  within a tumor cell. The sodium-iodide symporter (NIS), responsible for iodide uptake,
  is shown in the cell membrane, transporting iodide (I-) along with sodium (Na+).
  The binding of thyroid-stimulating hormone (TSH) to its receptor (TSH-R) activates
  G proteins, which can influence downstream pathways. Oncogenic pathways, like those
  driven by the B-Raf proto-oncogene V600E (BRAF V600E) mutation, suppress the expression
  of the NIS, preventing iodine uptake. Thus, the resveratrol molecule blocks the
  activity of oncogenic pathways and directly acts on the NIS receptor gene expression.
  The right panel shows the clinical implication: an anaplastic carcinoma (above)
  can be resensitized to radioiodine therapy (below) through modulation of these molecular
  pathways, leading to a “resensitized tumor cell” capable of accumulating radioiodine
  and being sensitive to the therapy. This “redifferentiation” re-enables iodine uptake,
  potentially resensitizing the aggressive tumor to treatment with radioactive iodine
  (RAI). Created with BioRender.com (accessed on 1 August 2025)'
