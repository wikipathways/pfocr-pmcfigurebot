caption: 'Schematic diagram of the molecular mechanism by which antimicrobial peptide
  C-1b(3-13) inhibits atherosclerosis via the miR-590-5p-regulated KLF12/p300 axis.
  AMP C-1b(3-13) upregulates miR-590-5p, which directly binds to the 3′UTR of KLF12
  mRNA, thereby suppressing KLF12 expression. KLF12 downregulation reduces nuclear
  accumulation of p300, consequently attenuating NF-κB signaling pathway activation.
  Consequently, AMP C-1b(3-13) alleviates inflammatory responses in foam cells and
  suppresses aortic plaque formation. Red arrows: pathology; Green arrows: AMP treatment'
article_title: The Frog Skin-Derived Antimicrobial Peptide Suppresses Atherosclerosis
  by Modulating the KLF12/p300 Axis Through miR-590-5p
