figure_title: Constitutive activation of the canonical and non-canonical NF-κB signaling
  pathways promoted by the viral protein Tax.
caption: Constitutive activation of the canonical and non-canonical NF-κB signaling
  pathways promoted by the viral protein Tax. In the canonical pathway, Tax interacts
  with the IKK complex (IKKα, IKKβ, IKKγ), promoting the phosphorylation, ubiquitination,
  and subsequent degradation of IκB, releasing the NF-κB complex (p50/p65/c-Rel) for
  nuclear translocation and gene activation. In the non-canonical pathway, Tax stimulates
  the activation of NIK and IKKα, promoting the phosphorylation of the p100 protein
  bound to RelB. This leads to the proteasomal processing of p100 into p52, allowing
  the formation of the RelB/p52 complex, which also migrates to the nucleus and activates
  the transcription of target genes. Both pathways converge at the persistent activation
  of pro-proliferative and anti-apoptotic genes, which is characteristic of HTLV-1-induced
  cellular transformation. Created using BioRender
