figure_title: Overview of gene therapy strategies for managing cardiac arrhythmias.
caption: 'Overview of gene therapy strategies for managing cardiac arrhythmias. Gene
  silencing therapy (left panel) attenuates the expression of pathogenic alleles via
  antisense oligonucleotides (ASOs) or RNA interference modalities such as small interfering
  RNAs (siRNAs), thereby counteracting deleterious gain-of-function effects. Gene
  replacement therapy (middle panel) delivers exogenous wild-type cDNA to restore
  functional protein levels, effectively addressing haploinsufficiency or complete
  loss-of-function in monogenic cardiac diseases. Direct genome editing (right panel)
  enables precise modification of the host genome through CRISPR-Cas9-mediated double-stranded
  DNA cleavage, base editing for targeted nucleotide substitutions, or prime editing
  for programmable insertions and deletions without inducing DNA breaks. Additional
  therapeutic modalities include pathway modulation, which aims to restore homeostasis
  by targeting key nodes within disease-relevant signaling cascades—often bypassing
  direct gene correction—and suppression-and-replacement (SupRep) approaches, which
  concurrently silence both wild-type and mutant alleles using short hairpin RNA,
  while reintroducing a knockdown-resistant transgene to reconstitute protein function.
  Optimization strategies across all modalities involve tailored vector selection
  (e.g., adeno-associated viruses and lipid nanoparticles), cardiac-specific promoters,
  and advanced delivery systems to enhance myocardial targeting and minimize off-target
  effects. Abbreviations: AAV, adeno-associated virus; Cas9, CRISPR-associated protein
  9; DNA, deoxyribonucleic acid; GST, gene silencing therapy; GRT, gene replacement
  therapy; LOF, loss-of-function; mRNA, messenger RNA; RISC, RNA-induced silencing
  complex; RNA, ribonucleic acid; shRNA, short hairpin RNA; siRNA, small interfering
  RNA; sgRNA, single guide RNA; WT, wild type'
