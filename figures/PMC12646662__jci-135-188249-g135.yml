figure_title: ZDHHC13 regulates lipid metabolism in melanomas
caption: '(A) RNA-seq analysis of B16 cells with or without ZDHHC13 expression, including
  differential gene expression and GO enrichment by GSEA (tool: RaNA-seq). (B) The
  change of lipid species in B16 stably expressing ZDHHC13 vs B16 expressing control
  empty vectors (Positive Ion Mode). (C) Pathway enrichment analysis of lipids based
  on KEGG database and MetaboAnalyst. Lipid metabolites with a variable importance
  in the projection (VIP) score > 1, Fold Change > 2.0 and P < 0.05 were considered
  significant changed lipids (Positive Ion Mode). (D) Quantification of LPC species.
  (E and F) Lipidomic profiling and heatmap of LPC and SM species in negative ion
  mode. (G) LPC and SM metabolic pathway'
article_title: S-acyl transferase ZDHHC13 modulates tumor microenvironment interactions
  to suppress metastasis in melanoma models
