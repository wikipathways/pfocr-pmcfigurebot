figure_title: Volcano plots of significantly altered metabolites in bovine dry secretions
  across four pairwise comparisons.
caption: 'Volcano plots of significantly altered metabolites in bovine dry secretions
  across four pairwise comparisons. Each point represents one metabolite; the x-axis
  shows log2(fold change) and the y-axis shows –log10(p-value) from Welch’s t-test.
  Horizontal dashed line: p = 0.05; vertical dashed lines: |FC| = 1.5. Filled circles:
  metabolites surviving Benjamini–Hochberg FDR correction (q < 0.05); open circles:
  nominally significant only (p < 0.05, uncorrected). Statistical criteria: Welch’s
  t-test, p < 0.05 and |FC| > 1.5 (primary); FDR q < 0.05 (sensitivity, indicated
  by filled symbols). (A) SCM-D2 vs. H-D2 (n = 186 significant; 133 FDR-corrected):
  120 upregulated and 66 downregulated. Dipeptides (rose diamonds) dominated the upregulated
  fraction (76 of 120; 63%), consistent with neutrophil-driven proteolysis. (B) SCM-D21
  vs. H-D21 (n = 36 significant; 1 FDR-corrected): 26 upregulated and 10 downregulated.
  The near-absence of FDR survivors reflects the weaker group separation at Day 21.
  Note the compressed fold-change scale relative to panel A. (C) SCM temporal, D21
  vs. D2 (n = 316 significant; 293 FDR-corrected): 207 accumulated and 109 depleted.
  (D) H temporal, D21 vs. D2 (n = 316 significant; 311 FDR-corrected): 224 accumulated
  and 92 depleted. Note the dramatic scale difference between health comparisons (A,B)
  and temporal comparisons (C,D), reflecting the dominance of involution-driven metabolic
  remodeling. Metabolites are colour-coded by KEGG pathway. Filled circles: FDR-corrected
  (q < 0.05); open circles: nominally significant only (p < 0.05, uncorrected). n
  = 10 per group; CIL-LC-MS platform'
