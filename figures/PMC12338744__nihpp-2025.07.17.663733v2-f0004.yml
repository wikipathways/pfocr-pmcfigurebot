figure_title: Global HBE responses to SARS-CoV-2 infection
caption: (A) PCA plot representing the global bulk RNA transcriptome in mock and virus-infected
  cultures. All dpi are represented. (B) PCA plots representing global RNA transcriptome
  in mock and virus-infected cultures at the dpi indicated. In A and B, ellipses are
  drawn at 95% level assuming normal distributions of samples per group. PC=principal
  component. (C) Differentially expressed genes (DEGs) at the dpi indicated, showing
  number of regulated genes in both directions comparing virus-infected to mock treated
  cultures [(upregulated by SARS-CoV-2 in the upward bar (open); and downregulated
  in the downward bar (closed)]. DEGs represented are filtered at adjusted P-value
  of <0.05 and absolute log2 fold-change >1 with an average expression >0 (log2; or
  roughly TMP>1). (D) Venn diagrams depicting the overlap of DEGs between mock and
  SARS-CoV-2 infection across dpi groups. (Di) All DEGs; (Dii) DEGs upregulated by
  virus; (Diii) DEGs downregulated genes by virus. Filtering as in (C). (E) Heatmap
  of selected significant gene expression pathways identified as differentially expressed
  from the Reactome + custom pathway annotation set between virus infected vs. mock
  at indicated dpi. NES=normalized enrichment score. Red represents pathways upregulated
  by virus, blue represents pathways downregulated by virus
