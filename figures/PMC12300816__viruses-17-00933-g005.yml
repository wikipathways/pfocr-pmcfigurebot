figure_title: BS promotes CSFV replication by downregulating IκBα expression.
caption: BS promotes CSFV replication by downregulating IκBα expression. (A) PK-15
  cells were treated with 100 nM BS and infected or not with CSFV (MOI = 1) for 24
  h. Viral RNA levels were measured by RT-qPCR. (B) Cells were treated with increasing
  concentrations of BS (0, 100, and 500 nM), followed by CSFV infection (MOI = 1)
  for 24 h. RT-qPCR was performed to quantify viral RNA and host NF-κB/IκBα transcripts.
  (C) Western blotting analysis of NF-κB pathway-related proteins (IκBα, p-P65, and
  P65) and viral protein Npro. β-actin served as the loading control. Data are shown
  as mean ± SD from three independent experiments. * p < 0.05; ** p < 0.01
