figure_title: Cellular senescence in the kidney is a multifaceted process shaped by
  several triggers and pathways.
caption: 'Cellular senescence in the kidney is a multifaceted process shaped by several
  triggers and pathways. Replicative stress occurs when cell proliferation shortens
  telomeres, hindering DNA replication and initiating the DDR, leading to replicative
  senescence. Oncogene activation can directly induce DDR or activate signaling pathways
  (e.g., MDM2-p53-p21 or p38AMPK-p16), resulting in cell cycle arrest, and cellular
  senescence. Loss of a tumor suppressor gene can trigger senescence via the Akt-mTOR-p53
  pathway. During embryonic development, senescent cells play a role in shaping and
  remodeling various tissues (limbs, nervous system, gut endoderm, mesonephros), with
  p21 playing a significant role. Epigenetic alterations, including histone modifications
  and DNA methylation changes, stimulate senescence through the p16-RB pathway and
  transcriptional reprogramming during cellular senescence. Mitochondrial dysfunction
  leads to excessive reactive oxygen species production and oxidative stress, causing
  DNA damage and activating the DDR or ERK-p16-RB pathway. Chemotherapy drugs, chemicals,
  and ionizing radiation can induce DNA damage, triggering senescence. These various
  cellular senescence inducers can lead to acute or chronic cellular senescence. In
  cases where the trigger is sudden and intense and the SASP is limited, this may
  result in either apoptosis or complete removal and repair by immune cells. However,
  when the trigger is persistent and of lower intensity, the sustained SASP activation
  or the full SASP engagement may result in chronic senescence. Abbreviations: DDR:
  DNA damage response; SASP: Senescence-Associated Secretory Phenotype'
