caption: SBEM induces PTX resistance in breast cancer cells by activating the AMPK
  pathway. (A) Flow cytometry analysis of apoptosis in SUM190PT/PTX cells transfected
  with siRNA for 48 h and treated with AMPK activator 13 (5 µmol/l) for 24 h. (B)
  The treatment of SUM190PT/PTX cells was the same as aforementioned. After the treatment,
  the change in cell viability was determined by the CCK-8 assay. (C) The treatment
  of SUM190PT/PTX cells was the same as aforementioned. After the treatment, the relative
  expression levels of Bax, Bcl2, Caspase-3 and cleaved-Caspase-3 proteins were detected
  by western blotting. **P<0.01, ***P<0.001, ****P<0.0001. ns, not significant; PTX,
  paclitaxel; SBEM, small breast epithelial mucin; CCK-8, Cell Counting Kit-8; si,
  small interfering (RNA)
