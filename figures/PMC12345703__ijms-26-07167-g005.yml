figure_title: Proposed model of NO-mediated miRNA regulation in plant stress responses
  and development.
caption: Proposed model of NO-mediated miRNA regulation in plant stress responses
  and development. Abiotic (drought, low temperature, methane) and biotic (pathogen
  infection) stresses activate NO biosynthesis through nitrate reductase (NR) and
  NO-associated protein 1 (NOA1). The resulting NO modulates microRNA (miRNA) expression,
  which in turn targets specific mRNAs. These mRNAs encode key regulators of stress
  adaptation, contributing to enhanced root development, defense mechanisms, cold
  stress tolerance, and hormonal crosstalk (including abscisic acid [ABA] and salicylic
  acid [SA] pathways)
