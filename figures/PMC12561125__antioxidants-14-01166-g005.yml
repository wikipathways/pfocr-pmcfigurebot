figure_title: Major triggers and checkpoint pathways driving cellular senescence.
caption: Major triggers and checkpoint pathways driving cellular senescence. Schematic
  overview of key senescence inducers—oxidative stress, endoplasmic-reticulum (ER)
  stress, DNA damage/DDR activation, oncogenic signaling, mitochondrial dysfunction,
  and telomere shortening—converging on canonical checkpoint modules within a normal
  cell. p53 stabilization with p21 inhibits CDKs; p16INK4A restrains CDK4/6; CDK2–Cyclin
  E control is depicted together with the Rb–E2F node. The outcome is durable cell-cycle
  arrest and a senescent phenotype characterized by enlarged morphology and secretory
  activity
