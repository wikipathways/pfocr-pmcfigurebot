figure_title: KEGG pathway enrichment analysis was conducted to identify signaling
  networks associated with differentially expressed lncRNAs between treatments and
  the control (P1).
caption: 'KEGG pathway enrichment analysis was conducted to identify signaling networks
  associated with differentially expressed lncRNAs between treatments and the control
  (P1). Scatter plots show the top 20 enriched pathways for (A) P2 vs. P1 (vaccine
  vs. control), (B) P3 vs. P1 (IFN-α1 vs. control), and (C) P4 vs. P1 (IFN-ω5 vs.
  control), ranked by q-value, rich factor, and gene number. Colored boxes indicate
  whether pathways are shared among multiple groups or unique to a specific treatment:
  blue highlights pathways shared by (A,B), orange highlights pathways shared by (B,C),
  and red highlights pathways shared by (A–C). The vaccine group was mainly enriched
  in metabolic and PI3K-Akt signaling pathways; the IFN-α1 group exhibited activation
  of chemokine, MAPK, and phagosome-related pathways; and the IFN-ω5 group displayed
  the broadest enrichment, including mTOR, AMPK, and ER protein processing pathways.
  (D) The Venn diagram summarizes shared and unique pathways among groups, highlighting
  overlapping immune-related pathways (PI3K-Akt, MAPK, chemokine) and IFN-ω5-specific
  engagement of broader metabolic and cellular regulatory networks. Abbreviations:
  AMPK, 5′ adenosine monophosphate-activated protein kinase; MAPK, mitogen-associated
  protein kinase; mTOR, mammalian target of rapamycin; PI3K-Akt, phosphoinositide
  3-kinase-protein kinase B'
