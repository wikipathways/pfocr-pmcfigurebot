caption: Effects of the gedatolisib/darolutamide combination on PAM pathway and AR
  pathway activities. (A) Quantitative PCR (qPCR) analysis showing relative mRNA levels
  of two AR-target genes (TMPRSS2 and KLK3) in PC cell lines treated with the indicated
  drugs for 24 h. (B) Flow cytometry analysis showing the relative levels of two markers
  of PAM pathway activity (p4EBP1 and pRPS6) in PC cell lines treated with the indicated
  drugs for 24–72 h. In the heatmaps, white indicates no relative change, blue indicates
  reduction, and red indicates increase in mRNA levels. The values used for the heatmaps
  are shown in Tables S6 and S7, and represent the mean of 2 biological replicates
