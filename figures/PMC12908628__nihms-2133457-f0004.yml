caption: A) Graphical summary of Ingenuity Pathway Analysis (IPA) of differentially
  expressed genes in the TRM CD4+ T-cells, as compared to naïve, in scRNA seq data
  of DCM hearts. The p-value of overlap was calculated using a right-tailed Fisher’s
  exact test B) IPA network plot of up- and down-regulated genes involved in ESR1
  and ESR2 signaling and their predicted activation or inhibition functions in activated
  cardiac TRM CD4+ T-cells, as compared to ‘Naïve’ CD4+ T-cells, in DCM hearts. The
  reported p-value is calculated using a right-tailed Fisher’s exact test. C) Heatmaps
  of the top 20 upregulated genes in the ESR1 and top 20 downregulated genes in the
  ESR2 pathway. Data from cells is shown in all panels
