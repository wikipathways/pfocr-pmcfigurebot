caption: 'Network pharmacology diagram of Scutellaria baicalensis predicted by NovelHTI.
  The figure visualizes the mechanism of action from the herb to biological pathways.
  Green diamond: The herb Scutellaria baicalensis. Yellow ovals: Key bioactive compounds
  (e.g., Baicalin, Baicalein). Blue circles: Predicted molecular targets. Larger nodes
  represent high-confidence targets highlighted in the case study (NLRP3, PTGS2, RELA,
  MAPK1). Red rectangles: Significantly enriched signaling pathways (NF-κB and TNF).
  Arrows indicate the regulatory relationships flowing from the herb components to
  targets and downstream pathways'
