figure_title: Comparative transcriptome analysis reveals similarities between mouse
  OLP-like lesions and human OLP lesions
caption: (A) Volcano plots comparing gene expression in ethanol-treated control mice
  and OXA-induced OLP-like lesions (n = 6 for vehicle control group, n = 5 for OXA
  group per group). Representative significantly upregulated and downregulated genes
  are labeled. Dashed lines indicate thresholds for log2 fold change and adjusted
  P value. Genes not meeting these criteria are marked as “none.” (B) GO enrichment
  analysis of upregulated genes, highlighting IFN responses and immune-related pathways.
  Bubble size reflects the number of genes associated with each GO category, while
  bubble color represents the –log10(P value). (C) KEGG pathway enrichment analysis
  of upregulated genes, showing involvement in JAK/STAT signaling and immune pathways.
  The rich factor is represented by horizontal bars, while the –log10(P value) is
  depicted as connected points. (D) Overlap analysis of differentially expressed genes
  between mouse and human OLP datasets. Fisher’s exact test indicates significant
  concordance in both upregulated and downregulated genes; odds ratios (OR), 95% CI,
  and P values are shown. (E) Gene Set Enrichment Analysis (GSEA) demonstrating enrichment
  of “cell killing” and “type II interferon-mediated signaling pathway” in both human
  OLP lesions and OLP-like mouse lesions (left), compared with the control group (right).
  (F) Venn diagram showing overlapping upregulated genes between human and mouse datasets,
  with corresponding expression levels of representative genes displayed in a bar
  plot
