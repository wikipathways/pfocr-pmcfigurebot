figure_title: Comparative analysis of biotinylated proteins in JTC Bulk vs.
caption: 'Comparative analysis of biotinylated proteins in JTC Bulk vs. JTC affinity
  purified samples. (A) Principal Component Analysis (PCA) of proteins from Kv1.3-TurboID
  transduced Jurkat T-cells and control samples (n=3). PC1 and PC2 explain 76% and
  10% of the variance, respectively. Distinct clustering of sample groups reflects
  significant differences in each sample proteome. (B) Volcano Plot for JTC Affinity
  Purified (AP) Samples: Differential Enrichment Analysis (DEA) between all Kv1.3-TurboID
  fusion and control in affinity purified (AP) samples, showing 1845 proteins channel
  transduction. (C) Volcano Plot for JTC Bulk Samples: DEA of all Kv1.3-TurboID fusion
  and control in bulk samples showing similar number of proteins increased (465) and
  decreased (453) with Kv1.3 channel transduction at bulk level. (D) Gene Ontology
  (GO) enrichment for increased proteins in AP samples identifies Kv1.3 enriched proteome
  involved in protein transport and signal transduction pathways. (E) GO Enrichment
  for increased proteins in JTC Bulk shows cadherin binding and vesicle mediated transport
  pathways enrichment with Kv1.3-TurboID fusion in bulk sample. (F) GO Enrichment
  analysis of decreased proteins in JTC bulk samples DEA shows downregulation of RNA
  processing, cytosolic translation, and mitochondrial function with Kv1.3 channel
  in bulk samples. (G) Venn diagram illustrates the overlap and unique proteins identified
  across JTC bulk and JTC affinity purified samples, with 1376 Kv1.3 enriched proteins
  unique to AP proteome, and overlap of 469 proteins with DEPs in bulk samples. (H)
  GO analysis for unique AP-Kv1.3 interacting proteins identified in Fig. 2G emphasizes
  enrichment of processes associated with endoplasmic reticulum organization, membrane-associated
  trafficking, and Golgi-mediated vesicular transport, suggesting role of Kv1.3 in
  regulating protein localization and intracellular membrane dynamics. Complete protein
  list for each analysis is given in Supp. Datasheet 3'
