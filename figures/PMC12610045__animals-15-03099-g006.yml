caption: Results of differential metabolite analysis in the intestines of the CK group
  and AP group. (A) Volcano plot of differential metabolites. (B) KEGG classification
  map of differential metabolites. (C) Pathway enrichment analysis bubble map of differential
  metabolites. The larger the Ratio value, the higher the enrichment degree of differential
  metabolites in the pathway. The color of the dots represents the p-value of the
  hypergeometric test, and the size of the dots represents the number of differential
  metabolites in the corresponding pathway. The positive ion mode (POS) is shown on
  the left, and the negative ion mode (NEG) is shown on the right
