figure_title: The integrated stress response (ISR) and senescence-associated secretory
  phenotype (SASP) in stem cell fate decisions.
caption: 'The integrated stress response (ISR) and senescence-associated secretory
  phenotype (SASP) in stem cell fate decisions. (a) ISR pathway. The four principal
  stress-sensing kinases—PERK (ER stress), GCN2 (amino acid deprivation), PKR (viral
  dsRNA), and HRI (oxidative stress/heme depletion)—converge to phosphorylate eIF2α,
  leading to global translational repression but selective translation of ATF4, ATF5,
  and CHOP. These transcription factors regulate adaptive or apoptotic programs that
  determine stem cell survival and lineage fate. (b) Stem cell stress outcomes. ISR
  activity influences diverse stem cell compartments, including hematopoietic stem
  cells (HSCs), neural stem cells (NSCs), and epithelial stem cells (epidermal/intestinal).
  Protective outcomes are represented by a shield icon, denoting preservation of healthy
  stem cells and regenerative potential. Detrimental outcomes are represented by a
  target icon, indicating selective elimination of malignant or senescent cells. Disease
  contexts associated with each compartment are illustrated: bone marrow failure and
  leukemia stem cells (HSCs), neurodegeneration and repair (NSCs), and epithelial
  regeneration or cancer (epithelial stem cells). (c) SASP pathway. Genotoxic stress—arising
  intrinsically within the cell or extrinsically from the microenvironment—activates
  DNA damage sensors that signal through p53. Early responses include cell cycle arrest
  and transient SASP suppression, promoting senescent arrest and acute alarm signaling.
  Over time, unresolved stress drives the full SASP program, characterized by chronic
  secretion of cytokines, growth factors, and proteases. This late-stage SASP fuels
  pathological outcomes that parallel the stem cell fates in (b), including bone marrow
  failure, neurodegeneration, and tumorigenesis. Together, panels (a–c) illustrate
  how ISR and SASP form a coupled Yin–Yang regulatory system that guides stem cell
  adaptation versus degeneration across development, aging, and disease. Abbreviations:
  integrated stress response (ISR); senescence-associated secretory phenotype (SASP);
  eukaryotic initiation factor 2 alpha (eIF2α), Protein Kinase RNA-Like ER Kinase
  (PERK), General control nonderepressible 2 (GCN2), protein kinase R (PKR), heme-regulated
  inhibitor (HRI), activating transcription factor 4,5 (ATF4,5), C/EBP Homologous
  Protein (CHOP), neural stem cell (NSC), intestinal stem cell (ISC), epithelial stem
  cell (EpSC), p53 kinase (p53)'
article_title: 'The Yin–Yang of Stress and Senescence: Integrated Stress Response
  and SASP Crosstalk in Stem Cell Fate, Regeneration, and Disease'
