figure_title: Alcohol promotes osteoclastogenesis and rewires cellular metabolism.
caption: Alcohol promotes osteoclastogenesis and rewires cellular metabolism. (A)
  UMAP showing clusters and lineage trajectory curves. Module scoring performed using
  gene sets involved in (B) Osteoclast differentiation and Regulation of osteoclast
  differentiation, (C) PI3/AKT pathway, (D) Glycolysis and Oxidative phosphorylation,
  (E) Phagocytosis, and (F) Migration. Normality of module scores was assessed using
  the Shapiro–Wilk test (α = 0.05). For panels (B–F), multiple testing correction
  was performed using a FDR approach with the two-stage step-up method of Benjamini,
  Krieger, and Yekutieli. Adjusted p-values < 0.05 were considered statistically significant,
  while values between 0.05 and 0.1 were interpreted as indicative of a modest trend
