figure_title: EndMT activation in veins exposed to arterial shear stress ex vivo using
  untargeted spatial cell sequencing.
caption: EndMT activation in veins exposed to arterial shear stress ex vivo using
  untargeted spatial cell sequencing. LSV segments were mounted on a perfusion apparatus
  and exposed to arterial flow for 4 h or maintained under static conditions as a
  control. (A) A cluster of cells demonstrating both endothelial cell (EC) and smooth
  muscle-cell (SMC) phenotypes (EC/SMC). (B) Representative images of a lower limb
  venous system (LSV) tissue section (10 μm) microscopy image, along with a 10X Visium
  spot coverage grid overlay illustrating the spatial distribution of the EC/SMC cluster.
  (C) A volcano plot of the identified EC/SMC cluster, displaying all differentially
  expressed genes (DEGs) between control samples and those exposed to 4 h of arterial
  haemodynamics (n = 4). (D) Global pathway analysis of the EC/SMC cluster, highlighting
  all significant differentially expressed genes (adjusted p-value < 0.05), with the
  top 30 connections presented. Enrichment is scaled based on significance (−log10
  p-value) and visually ranked by intersection size (overlap of DEGs with enriched
  pathways). (E) A network of significant differentially expressed genes (adjusted
  p-value < 0.05) in the TWIST2 subset of the EC/SMC cluster in samples exposed to
  ex vivo arterial haemodynamic conditions
