caption: Bidirectional modulation of SIRT1 dictates JEV replication via the mitochondrial
  apoptotic pathway (A) Mitochondrial membrane potential (ΔΨm) detected by JC-1 staining.
  Scale bar = 50 μm. (B) Western blot analysis of apoptosis-related markers (Bax,
  Bcl-2, and Cleaved Caspase-3). (C) Effect of EX527 on cell viability (CCK-8, left)
  and SIRT1 protein levels (Western blot, right). (D) NAD+ levels after EX527 treatment
  (5 μM). (E) Western blot of p53 acetylation recovery. (F) Rescue of JEV E protein
  expression by EX527. (G) CCK-8 assay evaluating SRT1720 cytotoxicity in WT cells.
  (H) SRT1720 (0.1 μM) suppresses JEV E protein expression in WT cells, with CD38-KO
  cells as a restriction control. Data are means ± SD from three independent biological
  replicates (n = 3). * p < 0.05, ** p < 0.01, *** p < 0.001; ns, not significant
