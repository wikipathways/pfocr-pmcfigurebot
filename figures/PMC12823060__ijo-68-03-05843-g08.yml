figure_title: Proposed working model in which PTPN18 negatively regulates cyclin E
  to interfere with cell cycle progression to exert tumor suppressive effects in BC.
caption: Proposed working model in which PTPN18 negatively regulates cyclin E to interfere
  with cell cycle progression to exert tumor suppressive effects in BC. The present
  study found that PTPN18 could inhibit the AKT signaling pathway by downregulating
  the expression of PI3K p110β as well as the tyrosine phosphorylation of PI3K p85
  and AKT. The inhibited AKT pathway weakens the negative regulation of downstream
  FOXO1, CDKN1A and CDKN1B. Increased expression of CDKN1A and CDKN1B enhances the
  inhibition of the cell cycle and cyclin E expression, ultimately leading to cell
  cycle arrest and BC suppression. PTPN18 can also enhance cell cycle arrest by downregulating
  cyclin E expression through the ubiquitin-proteasome pathway. PTPN18, protein tyrosine
  phosphatase non-receptor 18; BC, breast cancer; PI3K, phosphatidylinositol 3-kinase;
  AKT, protein kinase B; CDKN1A (p21Cip1), cyclin-dependent kinase inhibitor 1A; CDKN1B
  (p27Kip1), cyclin-dependent kinase inhibitor 1B; FOXO1, forkhead box O1
