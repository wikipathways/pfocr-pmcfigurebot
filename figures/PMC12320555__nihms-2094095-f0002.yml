figure_title: Cancer cells require GAG biosynthesis for lipoprotein uptake, ferroptosis
  resistance, and tumour growth
caption: 'a. Schematic of parallel metabolism-focused CRISPR screens in Karpas299
  lymphoma cells. The first screen assessed proliferation ± GPX4 inhibitor ML210 over
  14 doublings (left); the second used flow cytometric sorting of top/bottom 5% fluorescent
  populations following DiI-LDL treatment (right).b. Rank of genes by change in essentiality
  under ML210 treatment; GAG biosynthesis genes (dark blue) and known anti-ferroptotic
  genes (light blue) are highlighted.c. Rank of genes by change in essentiality for
  DiI-LDL uptake; GAG biosynthesis genes (dark blue) and known lipoprotein uptake
  genes (orange) are shown.d. Quadrant map of overlapping genes from both screens;
  shared hits belong exclusively to the GAG biosynthesis pathway.e. Schematic of GAG
  biosynthesis from disaccharide repeats containing glucuronic acid (GlcUA); UGDH
  is the pathway’s rate-limiting enzyme.f. Quantification of heparan sulfate (HS)
  and chondroitin sulfate (CS) in UGDH_KO cell lines expressing sgRNA-resistant UGDH
  cDNA or empty vector.g. Proliferation (log2 doublings, 5 days) of UGDH_KO cell lines
  expressing sgRNA-resistant UGDH cDNA or empty vector treated with ML162.h. Histograms
  of DiI-LDL (left) and DiI-HDL (right) uptake in A-498 UGDH_KO cells expressing sgRNA-resistant
  UGDH cDNA or empty vector.i. Representative tumours from immunocompromised mice
  implanted with Karpas299 or A-498 UGDH_KO cells expressing sgRNA-resistant UGDH
  cDNA or vector; non-engraftments marked with “X.”j. Schematic of daily intraperitoneal
  treatment with vehicle (grey) or liproxstatin-1 (Lip-1, dark blue) in mice implanted
  with UGDH_KO cells expressing sgRNA-resistant UGDH cDNA or empty vector.k. Tumour
  weights from mice treated as in (j).f, g: Bars represent mean ± s.d.; k: Boxes represent
  median, first and third quartiles, and whiskers are range. f, g: n=3; k: n=10 biological
  replicates. Statistics by two-sided unpaired t-test vs. empty vector (f, g) or vehicle
  (k) controls'
