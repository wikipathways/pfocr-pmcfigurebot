figure_title: Biological mechanism pathway of UCPs regulating BAT thermogenesis.
caption: Biological mechanism pathway of UCPs regulating BAT thermogenesis. Under
  external stress stimuli caused by various factors, the sympathetic nervous system,
  under the complex regulation of the brain's central nervous system, activates the
  sympathetic nerves, releasing or generating NE, T3, and Glu. These molecules bind
  to receptors on the BAT cell membrane, such as the α1/β3-AR, activating the downstream
  cAMP-PKA-UCPs signaling pathway. Specifically, UCPs exert their fundamental biological
  function of heat production by integrating multiple metabolic pathways, such as
  lipid metabolism and glucose metabolism. BAT, brown adipose tissue; NE, norepinephrine;
  T3, triiodothyronine; Glu, glucose; CAMP, 3'-5' Cyclic adenosine monophosphate;
  PKA, protein kinase A
