figure_title: Overexpression of CircNSD1 downregulated ACSL4 and SLC39A14 by H3K36
  methylation
caption: '(A) Reanalyzing a single-cell RNA-Seq dataset of mouse kidney (GSE139107).
  Venn diagram showing the intersection analysis of genes changed in I/R-2D and I/R-14D
  with genes associated with ferroptosis. (B) KEGG pathway analysis of overlapping
  genes. (C) ChIP assay detecting the H3K36me modification of ACSL4, LPCAT3, SLC39A14,
  and SAT1 regulated by CircNSD1 in control and CircNSD1 overexpressed cells treated
  with H/R-48h. (D) Representative immunofluorescence staining of ACSL4 and SLC39A14
  in control and CircNSD1 overexpressed cells treated with H/R-48h. Scale bar: 20
  μm. (E) Immunofluorescence staining of ACSL4 and LTL in kidney tissues from control
  and CircNsd1-overexpressing I/R mice. Immunofluorescence staining of SLC39A14 and
  LTL in kidney tissues from control and CircNsd1-overexpressing I/R mice. Scale bar:
  50 μm. Data are shown as mean ± SEM, *P < 0.05, **P < 0.01, ***P < 0.001 compared
  with the IgG-EV-H/R-48h group by 1-way ANOVA with Tukey’s post hoc test. ###P <
  0.001 compared with H3K36me1-EV-H/R-48h group or H3K36me2-EV-H/R-48h group by 1-way
  ANOVA with Tukey’s post hoc test. &&&P < 0.001 compared with H3K36me3-EV-H/R-48h
  group by 1-way ANOVA with Tukey’s post hoc test'
