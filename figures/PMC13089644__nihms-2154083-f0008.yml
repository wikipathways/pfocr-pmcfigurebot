figure_title: Repair effects of the identified proteins on compact zone cardiomyocyte
  proliferation in the ventricles of Ets1 eKO mice
caption: '(A) Schematic illustrating the culture of E12.5 Ets1 endothelial conditional
  knockout (eKO) ventricles. (B) Representative confocal images of PH3 immunofluorescence
  showing proliferating cardiomyocytes (white triangles) in control and recombinant
  protein treated-Ets1 eKO ventricles. Scale bars: 50 μm. (C) Representative confocal
  images of EdU immunofluorescence showing proliferating cardiomyocytes (white triangles)
  in control and recombinant protein treated-ventricles. Scale bars: 50 μm. (D) Graph
  of quantification of PH3 positive cardiomyocytes in control and recombinant protein
  treated-Ets1 eKO ventricles (Control, n=6; Treated, n=6 each). (E) Graph of quantification
  of EdU positive cardiomyocytes in control and recombinant protein treated-ventricles
  (Control, n=6; Treated, n=6 each). (F) Model depicting how Ets1 deficiency in either
  endocardium or coronary endothelium leads to the thinning of the compact myocardium.
  Loss of Ets1 in the endocardium inhibits the activity of the Notch1 signaling pathway
  by upregulating the expression of Dlk1 and downregulating the expression of Dll4,
  thereby leading to the decreased compact zone cardiomyocyte proliferation. Loss
  of Ets1 in the coronary endothelium reduces the expression of Hmcn1, Slit2, and
  Col18a1, three extracellular matrix (ECM) components, which in turn decreases the
  proliferation of compact zone cardiomyocytes. For (D) and (E), data are presented
  as mean ± SEM and P values were calculated using one-way ANOVA followed by Tukey’s
  multiple comparisons test'
article_title: Ets1-regulated endothelial-secreted factors promote compact myocardial
  growth and contribute to the pathogenesis of ventricular non-compaction
