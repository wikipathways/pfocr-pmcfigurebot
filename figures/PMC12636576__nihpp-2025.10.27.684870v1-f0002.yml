figure_title: Transcriptional profiles of NSC and iN lines with heterozygous POGZ
  deletion
caption: '(A) Number of upregulated (blue) and downregulated (red) genes in iN and
  NSC heterozygous (het) models. (B) Statistical significance for enrichment of pathways
  among DEG in heterozygous (het) N and NSC lines. Numbers in parentheses indicate
  the total number of genes in a given gene list. Colors represent pathway categorization
  according to the nature of the functional categories related to the enriched term.
  Groups of functional categories: VESIC: vesicles, ENERGY: energy metabolism, MENTAL:
  mental and behavioral traits, IMMUNE: immune system and inflammation, MIG: cell
  migration, CALCIUM: calcium signaling, MIT: mitosis and cell proliferation, STEROID:
  steroid metabolism, CSKEL: cytoskeleton, CHROM: chromatin structure and regulation,
  ECM: extracellular matrix, SYN: synapse. C. Heatmap indicating significant overlap
  between co-expression modules in iN and NSC. Asterisks indicate the modules containing
  POGZ'
