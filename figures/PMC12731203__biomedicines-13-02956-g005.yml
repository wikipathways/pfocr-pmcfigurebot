figure_title: Summary of changes in intracellular signaling and cellular responses
  in HTF cells after TGF-β1/PDGF stimulation and tacrolimus treatment.
caption: Summary of changes in intracellular signaling and cellular responses in HTF
  cells after TGF-β1/PDGF stimulation and tacrolimus treatment. TGF-β1/PDGF stimulates
  p-Smad2/3 activation, thereby promoting proliferation and migration of HTF cells
  and promoting transdifferentiation (left box, tacrolimus untreated group). Conversely,
  tacrolimus treatment inhibits p-Smad2/3 activation, thereby inhibiting proliferation,
  migration, and transdifferentiation (right box, tacrolimus-treated group). The red
  inhibitor symbol indicates inhibition of the p-Smad2/3 activation pathway by tacrolimus.
  Upward arrows indicate increased activation or promotion, while downward arrows
  indicate inhibition or reduction of the process
