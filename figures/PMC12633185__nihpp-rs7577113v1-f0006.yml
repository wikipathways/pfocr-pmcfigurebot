figure_title: Identification of sex-specific signaling pathways in the hippocampus
  of WT mice, and identification of a unique transcriptional profile for female Dek
  cKO mice that highlights differences in dementia-relevant pathways
caption: (A) A Heatmap depicts regulated pathways from the Pathway Commons database
  that are different in pairwise comparisons of all four sex X genotype groups, including
  sex differences in WT mice. Differentially expressed genes were identified using
  AltAnalyze with Kallisto and differentially expressed genes assess for pathway analysis
  using GO-Elite. The first column identifies sex-specific differences of the transcriptome
  from the hippocampal tissue of WT C57Bl/6 mice (Female WT vs. Male WT). Key upregulated
  pathways in female hippocampus from WT include DNA repair and stress pathways like
  ATM, ATR, and p53, in addition to mitogenic, pro-proliferative pathways like mTor,
  EGFR, FGF, and E2F transcription factor targets. In comparison, as shown in the
  second column, female Dek cKO mice compared with Dek WT females have down-regulation
  of these same pro-proliferative and DNA damage/stress pathways. This suggests that
  Dek cKO female mice have lost sex-specific differences and neuroprotective pathways.
  (B) Differentially expressed genes from female DekcKO mice compared with female
  WT were utilized to create cellular networks with Cytoscape, with cellular functions
  as central nodes and associated genes attached. Blue circles are down-regulated
  and red are up-regulated processes. Relevant down-regulated processes are limited
  but include genes relevant to dendrites and synaptic membranes/synapses including
  the glutamate receptor Grik2and protein kinase C-gamma (Prkcg). Up-regulated processes
  included extracellular factors like paracrine signaling proteins, collagen, and
  basement membrane. Of interest, the sex-determining factor Rspo1 is upregulated
  as well as several inflammation-relevant signaling factors like interleukins and
  pro-inflammatory Ccl3. The neurodegeneration and inflammation marker Lrg1 is also
  upregulated in female Dek cKO mice. (C) Marker discovery analysis to identify genes
  that could uniquely identify each sex/genotype group was performed with MarkerFinder
  and AltAnalyze. A heatmap shows the differentially expressed genes that identify
  each group (yellow are up-regulated, and blue are down-regulated). Relevant gene
  ontologies and p-values are shown on the left. (D) Cytoscape network analysis was
  used to visualize the marker gene set for female Dek cKO mice, which identified
  Wnt signaling, lipid metabolism, and calcium ion binding as relevant pathways
