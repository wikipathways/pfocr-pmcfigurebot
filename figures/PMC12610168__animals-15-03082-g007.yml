caption: KEGG and GO enrichment analyses of genes regulated by the top trans-eQTL
  hotspots in Hanwoo backfat tissue. KEGG and GO enrichment analyses were performed
  for genes regulated by the two most significant trans-eQTL hotspots, SNP 6:60512276
  and SNP 21:17035557. Panel (A) shows the KEGG pathway analysis for SNP 21:17035557,
  panel (B) shows the KEGG pathway analysis for SNP 6:60512276, and panel (C) presents
  the GO Biological Process analysis for genes regulated by SNP 21:17035557
