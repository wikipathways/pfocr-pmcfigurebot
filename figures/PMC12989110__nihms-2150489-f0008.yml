figure_title: SAA1 activates adipose-resident myeloid cells
caption: (A) Top Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways based on
  differentially expressed genes from comparisons of SAA1- or LPS-treated vs. control-treated
  adipose-derived stromal-vascular cells.(B) Network view of the six common SAA1-
  and LPS-regulated pathways showing shared and treatment-specific genes.(C) Expression
  scores for SAA1- (left) and LPS-responsive (right) genes following a 6-h incubation
  with either ligand in stromal-vascular cells from subcutaneous human WAT. Results
  are displayed on the uniform manifold approximation and projection panel from Figure
  1C and violin plots for each indicated cell class. Note that adipocytes and mesothelial
  cells were removed as these are not present in the stromal-vascular fraction from
  the subcutaneous depot.(D) Representative immunostaining of epiploic adipose tissue
  using antibodies directed against markers for AdipoSAA (CES1) and macrophages (CD68).
  Hoechst33342 was used as the counterstain for nuclei. Scale bar, 100 μm.ASPC, adipose
  stromal and progenitor cell; NES, normalized enrichment score
