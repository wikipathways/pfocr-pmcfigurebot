figure_title: Functional correlation heatmap of microbial genera and KOs grouped by
  demographic variables and metabolic pathways.
caption: Functional correlation heatmap of microbial genera and KOs grouped by demographic
  variables and metabolic pathways. Heatmap illustrates the correlation patterns between
  significant KOs (x-axis) and associated microbial genera (y-axis), organized by
  demographic associations and metabolic pathways. Genera are grouped according to
  their predominant demographic variables (formula-fed, urban, rural, CS-delivered,
  and breastfed), whereas KOs are categorized by their metabolic functions. The color
  gradient represents correlation coefficients ranging from −1 (navy blue) to +1 (red),
  with white indicating a neutral correlation. The annotation bars provide immediate
  visual reference to the grouping structures, with genera colored by demographic
  association and KOs colored by metabolic pathway. LEfSe identified biomarkers distinguishing
  multiple categorical classes (LDA score ≥ 2.0, p < 0.05)
