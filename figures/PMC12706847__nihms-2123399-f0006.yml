figure_title: Repeated morphine induces specific transcriptomics changes in nerve-injured
  PAE mice
caption: 'A-C. Volcano plots display DE mRNAs and ncRNAs between morphine-treated
  PAE mice (N = 5) and vehicle-treated PAE mice (N = 6) following minor CCI surgery.
  The x-axis shows the log2FC and the y-axis represents the −log10 (p-values). Red
  points indicate significantly upregulated RNAs (log2FC > 0.25 and p-value <0.05)
  and significantly downregulated RNAs (log2FC < −0.25 and p-value <0.05) and gray
  points denote RNAs with no significant change in expression. The horizontal dashed
  line indicates the threshold for statistical significance (padj-value or FDR-corrected
  p-value = 0.05), and the vertical dashed lines represent |log2FC| > 0.25. Labels
  highlight some of the most significantly DE RNAs. With a log2FC cutoff of |0.25|—(A)
  4 upregulated and no downregulated mRNAs, (B) 11 upregulated and 30 downregulated
  circRNAs, (C) 196 significantly upregulated lncRNAs, and 265 significantly downregulated
  lncRNAs were found. D. KEGG and GO pathways for mRNAs, circRNAs, and lncRNAs. The
  size of each dot corresponds to the number of genes/RNAs involved in each pathway,
  while the color indicates the “rich factor”, which is the ratio of the number of
  DE RNAs to the total number of RNAs in that pathway. A greater ratio indicates a
  stronger relationship. Pathways with p < 0.05 were considered significantly enriched;
  relevant pathways are shown. E. Circular visualization of genomic relationships
  and gene list overlap between mRNA-circRNA-lncRNA using a CirCos plot. Each outer
  segment corresponds to DE RNA species: green is associated with mRNA, red is associated
  with circRNA, and blue is associated with lncRNA. Inner segments (lines) display
  genes that are common between the RNA species. Thicker arcs indicate more genes
  in common. All genes with p < 0.05, regardless of fold change were included for
  this analysis. DE circRNA and DE lncRNA linked to various genes, including Rims
  1, Nsd1, Dennd1a, Ptprd, Grk3, and A230006K03Rik, were identified. A full list is
  shown in Table 1'
