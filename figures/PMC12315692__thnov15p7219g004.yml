figure_title: Serine synthesis pathway regulates CM proliferation and apoptosis.
caption: Serine synthesis pathway regulates CM proliferation and apoptosis. A. Experimental
  timeline and analysis of absolute intracellular labeled metabolites with [U-13C6]
  glucose flux using mass spectrometry of lysates from P2-P3 NRVMs transfected with
  PSAT1 or Luc modRNA. B. The levels of [U-13C]-labeled glycolysis metabolites were
  evaluated 10 mins after [U-13C6] glucose addition, TCA metabolites were evaluated
  8 h. after [U-13C6] glucose addition and serine and nucleotides synthesis pathway
  metabolites were evaluated 24 h after [U-13C6] glucose addition (n = 3). In all
  panels, the X-axis represents the carbon number labelled with [U-13C6] in the given
  structure of a specific molecule (shown as red ball with number) and the Y-axis
  represents absolute intensity. C. Experimental plan for inhibition of serine synthesis
  pathway by PHGDH inhibitor, NCT-503 in presence or absence of PSAT1 modRNA in mice
  model of MI. D. Proposed metabolic mechanism by which NCT-503 treatment impedes
  CM cell cycle and survival by inhibiting SSP. E-F. Quantitative analysis of serine
  levels in plasma and heart tissue 7 days post-MI showing inhibition of SSP (n =
  4-6). G. Quantitative analysis of CM cell cycle by pH3+ CMs 7 days post-MI after
  treatment with or without and NCT-503 and PSAT1 modRNA (n = 4-6). H. Quantitative
  analysis of TUNEL+ CMs 7 days post-MI (n = 4-6). Unpaired two-tailed t-test B, E
  and F. One-way ANOVA for G-H. ***, P < 0.001, **, P < 0.01
