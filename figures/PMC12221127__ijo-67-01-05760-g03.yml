figure_title: Influence of PD-L1 overexpression on immune cell infiltration and T
  cell activation in response to αPD-L1 therapy.
caption: 'Influence of PD-L1 overexpression on immune cell infiltration and T cell
  activation in response to αPD-L1 therapy. Representative (A) PD-L1 and (B) CD45
  immunohistochemistry images (scale bar, 100 μm) and the corresponding quantification
  data of the tumor tissues (n=3, mean ± SEM; *P<0.05, **P<0.01, ***P<0.001, ****P<0.0001
  by two-way ANOVA with Tukey''s post hoc test). (C) Representative tissue images
  of stained CD4 and CD8 (scale bar, 100 μm) and the corresponding quantification
  data of the images (n=5, mean ± SEM; *P<0.05, **P<0.01, ****P<0.0001 by two-way
  ANOVA with Tukey''s post hoc test). (D) Percentage of CD4 and CD8+ T cells in the
  total immune cells analyzed through flow cytometry (n=5, mean ± SEM; *P<0.05 by
  two-way ANOVA with Tukey''s post hoc test). Tumor groups are distinguished by color
  and fill across the graph panels in A-D: Black (hollow): 4T1-Ctl + IgG, blue (hollow):
  4T1-Ctl + αPD-L1, green (solid): 4T1-PD-L1 O/E + IgG, red (solid): 4T1-PD-L1 O/E
  + αPD-L1. (E) KEGG pathway analysis of DEGs upregulated in control tumors treated
  with αPD-L1 compared with IgG-treated controls. (F) KEGG pathway analysis of DEGs
  downregulated in PD-L1 overexpressing tumors treated with αPD-L1 compared with control
  tumors treated with αPD-L1. PD-L1, programmed death-ligand 1; αPD-L1, anti-PD-L1
  antibody; CD45, cluster of differentiation 45; CD4, cluster of differentiation 4;
  CD8, cluster of differentiation 8; KEGG, Kyoto Encyclopedia of Genes and Genomes;
  DEGs, differentially expressed genes; IgG, immunoglobulin G; O/E, overexpression'
