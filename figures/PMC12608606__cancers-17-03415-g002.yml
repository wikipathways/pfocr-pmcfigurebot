caption: 'Mechanisms of resistance exemplified with a brief demonstration of intrinsic
  mechanisms, such as secondary acquisition of mutations, activation of alternative
  signaling pathways within the cell, alterations in epigenetic regulators, or metabolic
  changes affecting anti-apoptotic processes. Extrinsic mechanisms of resistance within
  the bone marrow microenvironment of patients with FLT3 mutations, driven by stromal
  cell metabolism and local cytokine signaling. Drugs used in clinical trials active
  against FLT3 mutant AML: Midostaurin (1), Sorafenib (2), Gilteritinib (3), Quizartinib
  (4), Crenolanib (10). Drugs able to rescue resistance to FLT3 inhibitors: Gilteritinib
  (3), cellular therapy AMG-553 (5), RAS inhibitor RMC-7977 (6), IDH1 inhibitor Ivosidenib
  (7), IDH2 inhibitors Enasidenib (7), Venetoclax (8), synthetic retinoids (9), ATO
  (9). This figure was generated using Biorender (https://www.biorender.com)'
