figure_title: Efferocytosis during myocardial infarction.
caption: Efferocytosis during myocardial infarction. Efferocytosis through the recognition
  of PtdSer in the context of an infarcted heart is a crucial process. Within the
  infarcted heart, various cardiac cells experience cell death, including necrosis
  and apoptosis. The efferocytic activity of macrophages or myofibroblasts is facilitated
  by the utilization of either the Gas6/MerTK pathway or the MFG-E8/integrin avb5
  pathway
