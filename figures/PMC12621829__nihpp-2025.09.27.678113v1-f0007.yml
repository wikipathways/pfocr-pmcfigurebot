number: 'Figure 7:'
figure_title: Changes in megakaryocyte cell-cell contacts and morphology during leukemic
  progression
caption: '(A) CODEX images showing close physical contacts between MKs and plasmacytoid
  dendritic cells (pDCs; defined as CD3−CD4+B220+Ly6CloCD11clo). White arrows indicate
  pDCs. (B) Quantification of pDC-MK contacts in early CML compared to WT and advanced
  CML. Bar graph shows fold change in pDC-MK contacts normalized to early CML. (C)
  Dual immunohistochemistry stainings of MKs (CD61, red) and pDCs (CD123, brown) in
  BM from human chronic-phase (cp) CML patients (representative images from n=4 patients
  in a stained cohort of n=48 patients). Yellow arrows indicate CD123+ pDCs. (D) Representative
  CODEX images showing granulocyte emperipolesis, with granulocytes internalized by
  GFP-Ab− MKs (top row) and GFP-Ab+ MKs (bottom row). (E) Quantification of granulocyte-engulfing
  total MKs across groups. (F) CellProfiler23 analysis of the average form factor
  of MKs, with each data point representing a tissue region within the group. (G)
  Representative CODEX images of CD41 staining in WT and advanced CML mice indicating
  the shape of MKs. (H) Quantification of average sphericity of MKs in WT and advanced
  CML mice using 3D light sheet microscopy. Three mice per group were analyzed, with
  three identically sized regions selected per mouse. (I) Representative 3D images
  of femoral BM from WT and d21 CML mice. Surfaces were rendered based on CD42b expression
  to visualize the morphology of MKs. (J) Representative H&E-stained images of human
  healthy BM (HBM) and cpCML BM. Green arrows indicate MKs. (K) Schematic workflow
  of laser capture microdissection (LCM) followed by sequencing. apCML: advanced-phase
  CML; bpCML: blast-phase CML. (L) Volcano plot showing differentially expressed genes
  (DEGs) in laser-capture dissected MKs in cpCML vs. HBM samples. (M-Q) Normalized
  bulk expression values of selected genes in LCM-isolated MKs from HBM, cpCML, apCML
  and bpCML samples. (R) Bubble plot of Kyoto Encyclopedia of Genes and Genomes (KEGG)
  pathway enrichment analysis of downregulated DEGs in HBM vs. cpCML MKs. (S) Correlation
  of MK form factor and proportions of GFP-Ab+ MKs in advanced CML. Scale bars, (A,
  D) 10 μm, (C) 20 μm, (G, I, J) 50 μm. See also Figures S13-14, and Table S3. Data
  are presented as mean ± SEM. Statistics: (B) Permutation-based test; (E, H) Student’s
  t test; (F, M-Q) One-way ANOVA (Tukey’s post hoc test); (R) Wald test; (S) Linear
  regression analysis (Pearson’s correlation coefficient). *p<0.05, **p<0.01, ***p<0.001,
  ****p<0.0001'
