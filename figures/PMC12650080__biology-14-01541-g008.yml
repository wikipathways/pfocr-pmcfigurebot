caption: 'Defense pathway differential expression across virus–cultivar–timepoint
  combinations. Heatmap shows unscaled log2 fold change values for defense pathway
  gene sets relative to mock controls. Red indicates upregulation; blue indicates
  downregulation. Pathways include cell wall modification, NBS-LRR resistance, protein
  quality control/HSPs, RNA silencing, oxidative stress response, hormone signaling
  (SA and JA/ET), RNA decay, miRNA regulation, pattern recognition, and secondary
  metabolism. Conditions are labeled as Cultivar_Virus_Timepoint and organized by
  cultivar (‘Beauregard’: red; ‘New Kawogo’: orange; ‘Tanzania’: blue), treatment
  (SPCSV: red; SPFMV: blue; SPVD: green), and timepoint (3, 6, 12 weeks)'
