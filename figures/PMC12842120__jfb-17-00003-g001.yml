figure_title: Schematic representation of scar healing mechanism.
caption: Schematic representation of scar healing mechanism. (A) After skin injury,
  various stimuli activate intracellular scar formation related signal pathway. The
  signal cascades activate transcription factors that translocate into the nucleus
  and activate mechanically regulated genes. (B) Schematic diagram of wound scar healing.
  (a) Neutrophils, macrophages and mastocytes migrate into the wound by extravasation
  from nearby vessels and cause excessive inflammation. (b) Excessive angiogenesis
  in wound scar healing. (c) Fibroblasts activate into myofibroblasts. (d) ECM remodelling
  to form scars. Figure 1 was drawn by authors in Adobe Illustrator 2023
