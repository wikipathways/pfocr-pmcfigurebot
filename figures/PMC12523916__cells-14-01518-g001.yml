figure_title: The TGF-β signaling pathway in cancer drug resistance.
caption: The TGF-β signaling pathway in cancer drug resistance. After ligation of
  dimeric TGF-β to the heterotetrametric TGF-β receptor complex of type 1 and type
  2 receptors, a conformation change in TGFBR2 leads to kinase activation of TGFBR1.
  TGFBR1 kinase then activates the canonical receptor-associated SMAD2 and SMAD3 pathways
  through serine phosphorylation [16,17]. The activated hexameric SMAD2/3/4 complex
  enters the nucleus to regulate transcriptional programs that lead to EMT, CSC phenotypes,
  and tumor cell heterogeneity. Various non-canonical pathways may be triggered independent
  of the serine-threonine kinase activity of TGFBR1 [18,19], and both TGF-β receptors
  1 and 2 have intrinsic tyrosine kinase activity, albeit less active than the canonical
  serine/threonine-specific activity [20,21]. Activation of the PI3K/AKT/mTOR signaling
  axis, independent of SMADs, promotes cancer cell survival. Red circular arrows indicated
  the serine threonine TGFBR-SMAD phosphorylation cascade. Thin black arrows indicate
  downstream consequences. Short black bold arrows indicate upregulation of processes
