figure_title: Biological process enrichment and pathway analysis of protein clusters
  in pancreatic cancer progression
caption: (A) Biological processes (BPs) enriched in proteins from Cluster E in Figure
  3D, which are upregulated in both IPMN and PDAC. A total of 138 proteins with a
  ≥2-fold change compared to ND were analyzed. Enrichment p-values were calculated
  using hypergeometric distribution and corrected for multiple testing using the Benjamini-Hochberg
  false discovery rate (FDR) method. (B) Biological processes enriched in proteins
  from Cluster B in Figure 3D, which are downregulated in IPMN and PDAC. A total of
  70 proteins with a ≥2-fold change compared to ND were analyzed. (C) Single-sample
  gene set enrichment analysis (ssGSEA) of all proteins from Figure 3D, demonstrating
  the enrichment of Reactome pathways for individual tissue samples. The enrichment
  scores for each sample are provided in Supplementary Table S6
article_title: High-Sensitive Spatial Proteomics for Pancreatic Cancer Progression
