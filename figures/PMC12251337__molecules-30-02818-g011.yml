figure_title: The preparation of Pt/Fe-NC catalysts.
caption: The preparation of Pt/Fe-NC catalysts. (A) The preparation of Pt/Fe-NCs is
  schematically illustrated. The ORR performances of Pt/Fe-NC were assessed in O2-saturated
  0.1 M KOH. (B) A comparison of the ORR polarization plots obtained for Pt/Fe-NC,
  Pt/Fe-NPs, Fe-NC, Pt-NC, and the commercial Pt/C catalyst. (C) Tafel profiles were
  derived from the polarization plots. (D) The I–t plot of Pt/Fe-NC at 0.70 V vs.
  RHE was tested alongside Pt/C. The origin of ORR activity within the Pt-Fe dual-site
  catalyst was discussed. (E) The DFT-optimized configuration of Pt/Fe-NC was presented.
  (F) ORR pathways on Pt/Fe-NC were simulated. (G) The free-energy diagram of ORR
  for Pt/Fe-NC was calculated via DFT. * denotes the active site. Reprinted with permission
  from Ref. [60]. Copyright © The Royal Society of Chemistry 2023
