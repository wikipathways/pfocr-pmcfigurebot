figure_title: The Vicious Cycle of DED and the Multi-Targeted Therapeutic Role of
  Exosomes.
caption: The Vicious Cycle of DED and the Multi-Targeted Therapeutic Role of Exosomes.
  This schematic illustrates the self-perpetuating pathophysiological cycle of DED.
  The cycle is initiated by etiological factors such as tear film instability and
  hyperosmolarity, which cause ocular surface stress and damage. This stress triggers
  the release of ROS and inflammatory mediators, leading to the activation of key
  pro-inflammatory signaling pathways, including the NLRP3/IL-1β axis and MAPK/NF-κB.
  This inflammatory milieu promotes the maturation of APCs like DCs, macrophages are
  polarized to the M1 phenotype, driving T-cell polarization towards pro-inflammatory
  Th1 and Th17 lineages, further amplifying inflammation and tissue injury. These
  events lead to corneal/conjunctival epithelial damage, goblet cell loss, and neurosensory
  abnormalities, which in turn exacerbate the initial tear film instability, thus
  closing the vicious cycle. Exosomes intervene at multiple critical points to break
  this cycle through mechanisms including antioxidant effects (e.g., MSC-Exo@Ce, MSC-Exo@AA
  scavenging ROS), inflammasome suppression (inhibiting NLRP3 activation and IL-1β/IL-18
  secretion), signaling pathway inhibition (suppressing NF-κB/MAPK via miRNAs such
  as miR-21-5p and miR-125b), immune cell modulation (reducing DC maturation, inhibiting
  Th17 responses, and promoting M1-to-M2 macrophage polarization via miR-204), tissue
  repair and protection (enhancing epithelial repair, goblet cell function, and Muc5ac
  expression, and delivering regenerative miRNAs like miR-146a and miR-233-3p), and
  systemic modulation (probiotic-derived exosomes regulating inflammation via the
  gut–eye axis). DED, dry eye disease. ROS, reactive oxygen species. APCs, antigen-presenting
  cells. DCs, dendritic cells
