figure_title: SXC modulates C.
caption: 'SXC modulates C. albicans growth and hyphal formation by affecting riboflavin
  metabolism. (a) KEGG pathway enrichment analysis of cationic and anionic metabolites
  in C. albicans. (b) Levels of riboflavin, reduced flavin, and flavin adenine dinucleotide
  (FAD) in C. albicans metabolites (n = 6). (c) C. albicans biomass after 24-h treatment:
  SXC (0.5 μL/mL), Riboflavin (100 μg/mL), SXC (0.5 μL/mL) + riboflavin (100 μg/mL)
  supplementation (n = 3). Statistical significance is indicated as follows: ** p
  < 0.01, *** p < 0.001, compared to the model group; ‘ns’ denotes not significant.
  (d) Crystal violet staining of hyphal formation: SXC (0.031, 0.062, 0.125 μL/mL)
  treatment groups. SXC (0.125 μL/mL) + riboflavin (100 μg/mL) rescue group. Scale
  bar = 100 μm'
