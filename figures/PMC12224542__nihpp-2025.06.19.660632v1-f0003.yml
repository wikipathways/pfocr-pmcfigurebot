figure_title: US6 from cytomegalovirus inserts a disulfide-bonded loop into outward-facing
  TAP
caption: 'a-b: Structure of the TAP/hUS6 complex. TAP is colored as in Fig. 2 and
  the cryo-EM density for hUS6 is shown in green. ATP is shown as sticks. (Right)
  Zoom-in view of the TAP translocation pathway. TAP is shown as a molecular surface
  and hUS6 in ribbon. hUS6 cysteines 110 and 129 are denoted as red balls and connected
  via red line. The first and last hUS6 residues observed in the map are numbered.
  c. Electrostatic properties of hUS6 complements those of the N- and C-pockets. hUS6
  is represented as white wire superimposed onto a molecular surface colored by electrostatic
  potential. Scale: from −10 kT/e (red) to +10 kT/e (blue). Interacting residues between
  hUS6 and TAP N- and C-pockets are shown and labelled. d. Effect of US6 TM variants
  on cell-surface MHC-I assays. Data represent the relative MHC-I cell surface levels
  normalized to the control (YFP only) and represent three technical replicates of
  three biological replicates (n=9). Error bars represent the SEM. Labels: wild-type
  (WT), poly-leucine TM helix (pL-TM), TM deletion (ΔTM). Statistical significance
  relative to treatment with wild-type hUS6 IRES YFP was tested by one-way analysis
  of variance. ****P<0.0001; ns > 0.05. e-f. Structure of the TAP/rhUS6 complex. g.
  Electrostatic properties of rhUS6 and the interactions with N- and C-pocket residues,
  as scale as in panel c. h. TM helix of rhUS6 packs along TAP2. TAP and rhUS6 are
  shown as molecular surface and ribbons, respectively'
