figure_title: In vitro model system to study transcriptomic changes in human immune
  cells upon direct or indirect contact with the TNBC cell line, MDA-MB-231.
caption: In vitro model system to study transcriptomic changes in human immune cells
  upon direct or indirect contact with the TNBC cell line, MDA-MB-231. (A) Human monocytic
  cells (THP1) were contacted with MDA-MB-231 TNBC cells for 24 h in RPMI-1640 media
  in 6-well plates. Cells were separated and RNA analyzed with RNAseq. (B) Human monocytic
  cells (THP1) were incubated with pre-conditioned media from the TNBC cell line (MDA-MB-231)
  for 24 h. Cells were collected, RNA-isolated, and analyzed using RNA sequencing
  (RNAseq). A pathway analysis performed using IPA (Qiagen Inc). A minimum of three
  biological replicates were used for each condition
