figure_title: Activation of the ROS/NF-κB signaling pathway by PS-NPs exposure in
  TM3 cell lines results in decreased testosterone production.
caption: Activation of the ROS/NF-κB signaling pathway by PS-NPs exposure in TM3 cell
  lines results in decreased testosterone production. (A) Variations in oxidative
  stress-related protein levels following treatment with different concentrations
  of PS-NPs (n = 3). (B) Alterations in NF-κB signaling pathway-related protein levels
  after exposure to varying concentrations of PS-NPs (n = 3). (C) Modifications in
  proteins associated with testosterone production following treatment with different
  concentrations of PS-NPs (n = 3). (D–F) Immunofluorescence analysis of testosterone
  production-related proteins CYP11A1, SF-1, and StAR in TM3 cells. Statistical significance
  is denoted as * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
