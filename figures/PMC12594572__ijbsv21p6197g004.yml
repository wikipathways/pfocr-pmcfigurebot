figure_title: Gli1 deficiency induces a proliferative transcriptional phenotype in
  FAPs.
caption: Gli1 deficiency induces a proliferative transcriptional phenotype in FAPs.
  (A) Scheme of the experimental strategy for RNA sequencing of FAPs. (B) Volcano
  plot of differentially expressed genes (DEGs) between Gli1-decifient FAPs and control
  FAPs. (C) Heatmap of DEGs showing transcriptional changes in FAPs. (D) GO and KEGG
  pathway enrichment analysis of DEGs. (E) Visualized functional enrichment network
  of GO terms by clueGO. (F) EdU staining of FAPs treated with si-NC or si-Ido1. Scale
  bar, 200 μm. (G) Quantification of the proportion of EdU+ cells after si-NC or si-Ido1
  treatment (n = 7). Data are presented as mean ± SEM, **P < 0.01. (H) Scheme of the
  predicted Gli1 binding sites within the Ido1 promoter region. (I) Schematic of the
  construction of luciferase reporter plasmids for testing Ido1 promoter activity.
  BS, binding site. (J) Results of the luciferase reporter assays. Data are presented
  as mean ± SEM, ****P < 0.0001. (K) EdU staining of FAPs treated with 0.5% DMSO or
  Ido1 inhibitor (50 nM) in DMSO. Scale bar, 200 μm. (L) Quantification of the proportion
  of EdU+ cells after DMSO or Ido1 inhibitor treatment (n = 8). Data are presented
  as mean ± SEM, **P < 0.01. (M) Expression levels of Cdk1 and Ki67 in FAPs treated
  with si-NC, si-Ido1, 0.5% DMSO, or Ido1 inhibitor (50 nM). Data are presented as
  mean ± SEM, *P < 0.05, **P < 0.01. (N) Scheme of the experimental strategy for in
  vivo administration of the Ido1 inhibitor. (O) H&E staining of TA muscle sections
  from wild-type mice treated with or without Ido1 inhibitor at 7 dpi following CTX-induced
  injury. Scale bar, 200 μm. Black arrowheads indicate necrotic myofibers. (P) Quantification
  of the myofiber CSA distribution (n = 5). Data are presented as mean ± SEM, *P <
  0.05, **P < 0.01. (Q) IF staining of eMyHC (red), laminin (green), and DAPI (blue)
  of TA muscle sections at 7 dpi and 14 dpi following CTX-induced injury. Scale bar,
  200 μm. (R) Quantification of the eMyHC+ area within the total area (n = 4-6). Data
  are presented as mean ± SEM, **P < 0.01, ***P < 0.001. All numbers (n) are biologically
  independent experiments
