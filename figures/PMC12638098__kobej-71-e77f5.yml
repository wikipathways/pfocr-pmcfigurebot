figure_title: HZ-6d induces activation of the p53-mediated apoptosis signaling pathwayHepG2
  (A) and Huh7.
caption: HZ-6d induces activation of the p53-mediated apoptosis signaling pathwayHepG2
  (A) and Huh7.5 (B) cells were treated with various concentration of HZ-6d (0.1,
  1, 5, and 10 μM) or 200 ng/ml of Actinomycin-D (Act-D) as a positive control. After
  18 h of incubation, cell lysates were analyzed by immunoblotting using anti-PARP1rabbit
  pAb, anti-p53 (Ser-15) rabbit pAb, anti-p53 mouse mAb, anti-caspase-3 rabbit pAb,
  anti-cleaved caspase-3 rabbit mAb, anti-caspase-8 mouse mAb, anti-cleaved caspase-8
  rabbit mAb, or anti-GAPDH mouse mAb as a loading control. The immunoblots of Figure
  5A and 5B are representative images from three independent experiments that yielded
  similar results
