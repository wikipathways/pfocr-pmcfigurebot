figure_title: Activity-based imaging of acetaldehyde (AA) in living cells.
caption: 'Activity-based imaging of acetaldehyde (AA) in living cells. A375 or Huh
  7 cells were treated with 10 μM AAP-1 for 30 min in pre-heated HBSS, followed by
  incubation with acetaldehyde, formaldehyde, or methylglyoxal in HBSS for 30 min
  (60 min for ethanol). (A) Representative fluorescence images of live A375 WT cells
  stained with AAP-1 along with exogenous AA addition, showing a dose-dependent increase
  in fluorescence with rising AA levels. (B) Representative fluorescence images of
  A375 cells stained with AAP-1 and treated with acetaldehyde (AA), formaldehyde (FA),
  or methylglyoxal (MGO), showing that AAP-1 responds selectively in cells to elevations
  in AA. (C) Ethanol (EtOH) metabolism pathway highlighting production and consumption
  of acetaldehyde. (D) Chemical structures for alcohol dehydrogenase (ADH) and aldehyde
  dehydrogenase (ALDH) enzyme inhibitors employed for imaging in panel E. (E) Representative
  fluorescence images of changes in intracellular AA pools during EtOH metabolism
  in Huh7 cells. Huh7 cells were treated with 100 μM Fomepizole or 2 μM CVT-10216
  for 24 h in high glucose DMEM/10% FBS before the imaging experiments. Scale bar:
  20 μm. ns > 0.05, *P ≤ 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001'
