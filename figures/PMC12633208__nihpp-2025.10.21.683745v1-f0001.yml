figure_title: Properties of the cellular TME of pancreatic cancer metastases to the
  liver
caption: 'A. Study design and datasets overview. B. UMAP plot of pre- and on-treatment
  cell populations with distinct cell types annotated: cells were classified into
  epithelial (malignant) cells and hepatocytes, stromal cells (fibroblasts, endothelial
  cells), and immune cell types (CD4+ and CD8+ T cells, Tregs, natural killer (NK)
  cells, monocytes/macrophages (Mono/Mph), B cells, mast cells and neutrophils). Each
  cluster is annotated based on specific marker genes, with the number of cells per
  cell type indicated. C. Dot plot showing average expression levels and percent expression
  of key marker genes across different cell populations: the dot size represents the
  percentage of cells expressing a specific gene within a given cell type, while color
  intensity indicates the average expression level. D. Pathway enrichment analysis
  of on- vs pre-treatment malignant PDAC cells: ClusterProfiler analysis of differentially
  expressed genes showed significant enrichment of MHC-II-related pathways, particularly
  those involved in antigen processing and presentation. E. Expression of MHC-II pathway
  genes pre- and on-treatment: dot plot showing key MHC-II-related genes (CD74, HLA-DRA,
  HLA-DPB1, HLA-DPA1, HLA-DRB1 and HLA-DMB) in malignant cells pre- and on-cobimetinib
  treatment'
article_title: Tumor-intrinsic MHC-II activation in pancreatic ductal adenocarcinoma
