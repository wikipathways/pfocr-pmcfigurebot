figure_title: In vivo antitumor effect of CuB.
caption: In vivo antitumor effect of CuB. (A) Weights of mice (n = 6). Volumes (B)
  and weights (C) of tumors at the end of treatment (n = 6). (D) HE staining images
  of the heart (a), liver (b), spleen (c), lung (d), kidney (e), and tumors (f) of
  mice at the end of different treatments. (E) Blood biochemical index analysis; n
  = 6. IF staining of TUNEL (F) and caspase-3 (G) in tumor tissue. (H,I) WB analysis
  of proteins related to the PI3K/Akt/mTOR and PINK1/Parkin signaling pathways. γ-H2AX
  staining (J) and ROS staining (K) in tumor tissue. n = 3; bars, ±SE; statistical
  significance determined via unpaired two-tailed Student’s t-test; * p < 0.05, **
  p < 0.01, *** p < 0.001, **** p < 0.0001
