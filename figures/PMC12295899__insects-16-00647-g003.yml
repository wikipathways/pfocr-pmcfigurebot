figure_title: mTORC1 signaling pathway activity affects BmE cell cycle and cell proliferation.
caption: mTORC1 signaling pathway activity affects BmE cell cycle and cell proliferation.
  (A,B) Flow cytometry analysis of BmE cell cycle. (C) Effect of inhibiting mTORC1
  signaling pathway activity on cell proliferation. Proliferating cells were labeled
  with EdU (green fluorescence). Cell nuclei were stained with DAPI (blue fluorescence).
  Control, negative control with DMSO addition. Scale bar is 400 μm. (D) Statistical
  analysis of the proportion of EdU-positive cells. The number of cells was calculated
  from three randomized regions. (E) DNA content analysis. DNA extraction was performed
  after treatment of cells in 6-well cell plates. Error bars indicate SEM (n = 3).
  Statistically significant differences were assessed using Student’s t-test (ns >
  0.05, * p < 0.05, *** p < 0.001)
