figure_title: Engineering L-DOPA production and tunable biosynthesis in the EcNL-DOPA2
  system
caption: '(A) In vitro L-DOPA production, analyzed via HPLC-ECD, normalized to OD600,
  comparing plasmid-based EcN strain (EcNpL-DOPA) to wild-type EcN in the presence
  or absence of L-Tyr.(B) Cumulative in vitro L-DOPA production analyzed via HPLC-ECD,
  for chromosome-integrated EcNL-DOPA1 and EcNL-DOPA2, comparing induction (+Rha)
  or lack thereof (-Rha), against EcNVEC and wild-type EcN.(C) EcNL-DOPA2 HpaBC activity
  (ng/min per 1010 CFU) was determined by linear regression of L-DOPA production over
  time, comparing aerobic (+O2) and anaerobic conditions (−O2) with and without Rha
  induction.(D) Cumulative L-DOPA produced at 12 h by EcNL-DOPA2 and EcNL-DOPA1 when
  pre-induced with varying concentrations of Rha (0.01–0.5% w/v).(E) A schematic representation
  detailing the construction of the candidate strain EcNL-DOPA2 and the proposed L-DOPA
  synthesis pathway utilizing endogenous Tyr generated by EcN.(A-D) Data presented
  as the mean ± S.E.M. For scatter dot plots with bar, values from three independent
  biological replicates per strain. P-values were calculated from one-way ANOVA with
  Tukey multiple comparisons. Statistical significance reported: *p ≤ 0.05, **p ≤
  0.01, ***p ≤ 0.001, and ****p ≤ 0.0001.See also Figures S1, S2 and Table S1'
