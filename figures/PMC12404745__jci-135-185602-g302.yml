figure_title: Ppp2r1a haploinsufficiency impairs eCB-dependent synaptic plasticity
  at excitatory synapses
caption: (A–E) Ppp2r1a haploinsufficiency impaired the strength of DSE (Control, n
  = 20 neurons; NEX-het-cKO, n = 23 neurons). (A) Schematic of DSE experiments. Top,
  whole-cell recordings from L5 pyramidal neurons during induction of DSE; bottom,
  DSE induction pathway in response to depolarization. (B) Representative EPSC traces
  before and after DSE induction. The black line represents depolarization (0 mV,
  5 s). (C) Representative DSE experiment performed in control neurons. (D) Time-course
  summary of normalized EPSC amplitude during the DSE experiment. (E) DSE amplitude
  was decreased in NEX-het-cKO mice. (F–J) Ppp2r1a haploinsufficiency impaired eCB-LTD
  (Control, n = 15 neurons; NEX-het-cKO, n = 12 neurons; Control + AM251, n = 7 neurons).
  (F) Schematic of the eCB-LTD experiment. (G) Representative EPSC traces before and
  after S-DHPG (50 μM) application. (H) Normalized time-course summary of S-DHPG–mediated
  eCB-LTD in both genotypes. Note that the CB1R antagonist AM251 (10 μM) blocked this
  eCB-LTD. (I) Summary graph showing that eCB-LTD was impaired in NEX-het-cKO mice
  and blocked by AM251. (J) Summary graph showing that EPSC PPRs were increased in
  both control and NEX-het-cKO mice, suggesting that eCB-LTD was mediated by a reduced
  presynaptic Pr. Statistical comparisons were performed using 2-tailed unpaired Student’s
  t test (E and J), 2-tailed paired Student’s t test (J), 1-way ANOVA followed by
  2-tailed Bonferroni’s t test (I), 2-tailed Wilcoxon’s test (J), and 2-tailed Mann-Whitney
  test (J). All data are presented as mean ± SEM. *P < 0.05, **P < 0.01, ***P < 0.001
article_title: Ppp2r1a haploinsufficiency increases excitatory synaptic transmission
  and decreases spatial learning by impairing endocannabinoid signaling
