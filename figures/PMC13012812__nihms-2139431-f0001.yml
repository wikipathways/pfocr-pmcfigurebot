figure_title: Aging associates with reduced IFN gene expression in patients with SLE
  but not healthy controls
caption: (A) Volcano plot highlighting genes with significant (Padj < 0.05) age-related
  changes in expression in patients with SLE (n=271), treating age as a continuous
  variable. P values were calculated using the limma package and adjusted with the
  Benjamini-Hochberg method. (B) Gene Set Enrichment Analysis (GSEA) demonstrating
  immune-related biological signaling pathways in bulk RNA-seq samples from patients
  with SLE. Filled circles represent pathways with a Benjamini-Hochberg adjusted P
  value < 0.05. A positive normalized enrichment score value represents up-regulation
  of the pathway with older age and a negative value represents down-regulation with
  older age. MHC, major histocompatibility complex; IL, interleukin; BCR, B cell receptor;
  IFN, interferon. (C) Volcano plot highlighting genes with significant (Padj < 0.05)
  age-related changes in expression in healthy controls (n=880), treating age as a
  continuous variable. P values were calculated using the limma package and adjusted
  with the Benjamini-Hochberg method. (D) GSEA demonstrating immune-related biological
  signaling pathways in healthy controls. (E and F) Linear regression assessing relationship
  between expression of the canonical IFN stimulated gene ISG15 and age in patients
  with SLE (E) and healthy controls (F). Expression was measured by log2 counts per
  million. Slope refers to the change in normalized gene expression per year of age.
  P values were calculated using limma and adjusted with the Benjamini-Hochberg method
article_title: Epigenetic attenuation of interferon signaling is associated with aging-related
