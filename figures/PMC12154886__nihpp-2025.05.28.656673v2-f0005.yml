figure_title: OGDHL mediates lineage plasticity phenotypes and NE marker expression
  in prostate cancer
caption: |-
  (A-C) Average expression of genes in Gene Ontology Biological Pathway Gene Set: Axon Guidance (A), Hallmark: Epithelial Mesenchymal Transition (B) and Hallmark: Androgen Response (C) gene sets in 16DCRPC cells with CRISPR-Cas9 mediated genetic knockout of OGDHL allowed to adapt to enzalutamide for 6 weeks in vitro. Data shown is average Z scores from 3 control replicates (+/− Enza) and 6 knockout replicates (+Enza) in vitro.
  (D) mRNA expression of NEPC gene HES6 in 16DCRPC cells with genetic knockout of OGDHL cultured in vitro.
  (E and F) mRNA expression of NEPC genes HES6
  (E) and DLL3
  (F) in tumors formed from 16DCRPC cells with genetic knockout of OGDHL (n =4) or control cells (n = 5). (G) Average expression of HES6 target genes in tumors formed from 16DCRPC cells with genetic knockout of OGDHL (n =4) or control (n = 5). (H) Western blot of DLL3 and HES6 in control and OGDHL knockdown cell lines cells recovered 4 days after implantation in vivo. Error bars represent +/− SEM. P-value calculated by unpaired t-test with Welch’s Correction
article_title: OGDHL regulates tumor growth, neuroendocrine marker expression, and
  nucleotide abundance in prostate cancer
