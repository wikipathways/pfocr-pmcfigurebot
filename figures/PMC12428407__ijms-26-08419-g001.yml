figure_title: Gut microbiota and gut–brain axis in health and disease.
caption: Gut microbiota and gut–brain axis in health and disease. Summary of the bidirectional
  communication between the gut microbiota and brain via neural, immune, and endocrine
  pathways. Microbial metabolites, neurotransmitters, and immune signals modulate
  central nervous system (CNS) function, whereas factors such as diet, stress, and
  medication influence microbiota composition. Disruptions in these pathway axes are
  linked to neurodegenerative and metabolic disorders
