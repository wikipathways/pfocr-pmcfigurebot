figure_title: Schematic representation of the main cellular mechanisms induced by
  Alternaria mycotoxins AOH and AME.
caption: Schematic representation of the main cellular mechanisms induced by Alternaria
  mycotoxins AOH and AME. Upon exposure, these compounds can increase reactive oxygen
  species (ROS) and modulate xenobiotic metabolism via activation of Ahr and Nrf2
  pathways. These events contribute to oxidative stress, DNA damage, mitochondrial
  dysfunction, and ultimately lead to apoptosis or disruption of the cellular detoxification
  balance. Dashed arrows indicate feedback or secondary amplifying interactions between
  pathways
