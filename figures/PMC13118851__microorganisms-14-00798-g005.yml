caption: Biosynthetic pathway and heterologous expression of tryptophol. (A) Biosynthetic
  pathway of tryptophol from tryptophan; (B) codon optimization and construction of
  plasmid pET28a::PT7-aro9CA-aro10CA-adh1CA, abbreviated as pET28a::PT7-3A; (C) HPLC
  analyses of tryptophol produced by different E. coli strains. pET28a:PT7-3A was
  transformed into four expression hosts Arctic, Rossetta, BL21(DE3), and C41(DE3)
  to generate engineered strains Arctic/pET28a:PT7-3A, Rossetta/pET28a:PT7-3A, BL21/pET28a:PT7-3A,
  and C41/pET28a:PT7-3A, respectively
