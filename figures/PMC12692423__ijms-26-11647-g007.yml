figure_title: Proposed scheme of signaling in mutual NRas nanoclusters.
caption: Proposed scheme of signaling in mutual NRas nanoclusters. (A) NRas dimers
  accommodate either BRAF or PI3K, and signal exclusively to either MAPK pathway (MEK,
  ERK) or to AKT/mTOR (marked by blue and orange arrows, respectively). Right, NRas
  clusters can simultaneously recruit both BRAF and PI3K, signal downstream jointly
  to MAPK and AKT pathways. (B). Recruitment of both PI3K and BRAF to nanoclusters
  is abrogated by RBD overexpression and competition (left), and by treating cells
  with either wortmannin (middle) or trametinib (right)
article_title: NRas Nanoclusters Mediate Crosstalk Between BRAF/ERK and PI3K/AKT Signaling
  in Melanoma Cells
