figure_title: Loss of FABP4 decreased amino acid metabolism in TRAMP mice.
caption: Loss of FABP4 decreased amino acid metabolism in TRAMP mice. Prostate samples
  from 24-week-old mice in the TRAMP-HF and FABP4−/− TRAMP-HF groups (three mice per
  group) were subjected to comprehensive metabolome analysis via capillary electrophoresis–TOFMS
  (CE-TOFMS) analysis using the Agilent CE-TOFMS System. (A) Cluster heat map showing
  relative metabolite expression of amino acids between the TRAMP-HF and FABP4−/−
  TRAMP-HF groups. Increased levels are shown in red, while decreased levels are green.
  (B) Comparison of pan-amino acid expression between the TRAMP-HF and FABP4−/− TRAMP-HF
  groups. The expression levels of nine essential amino acids and ten of non-essential
  amino acids (excluding Cys) were markedly decreased by 1.3–3.6-fold in the FABP4−/−
  TRAMP-HF group compared with TRAMP-HF group. * p < 0.05. (C) Schematic of the putative
  effects of FABP4 on prostate tumor progression. HF influences PCa progression by
  upregulating FABP4-dependent amino acid production and protumorigenic cytokine secretion.
  FABP4 and its associated signaling pathway could thus serve as a promising target
  for the chemoprevention and/or therapy of prostate cancer
