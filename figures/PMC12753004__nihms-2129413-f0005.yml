figure_title: Co-expression analysis reveals intoxication-related hub genes and transcriptional
  signatures linked to addiction behavior
caption: 'Enriched pathways for each identified module: (A) black, (C) red, and (E)
  green modules, with the x-axis representing the −log10 p-value to indicate statistical
  significance. Hub gene analysis for each module, identifying hub genes based on
  their high degree (number of connections to other genes) and betweenness centrality
  (extent to which a gene lies on the shortest paths between other genes) for (B)
  black, (D) red, and (F) yellow modules, respectively. Principal component analysis
  (PCA) was performed on gene expression data from the (G) black and (H) red modules,
  extracting PC1 as a summary measure, which was then correlated with behavioral indices
  to assess sex-specific relationships between gene expression and behavior across
  drug exposure states. (I) Scaled bar graph depicting module differential connectivity
  across drug states, analyzed in females, males, and sex specific. Bar height reflects
  the magnitude of connectivity change; solid bars indicate significant gain, while
  striped bars indicate significant loss of transcriptional connectivity'
article_title: Sex-specific transcriptional signatures of oxycodone persist during
  withdrawal and abstinence in the suprachiasmatic nucleus of heterogeneous stock
  rats
