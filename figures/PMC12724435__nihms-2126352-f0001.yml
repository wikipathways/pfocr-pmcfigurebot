figure_title: Direct ocular exposure to vesicants leads to both corneal and retinal
  damage.
caption: 'Direct ocular exposure to vesicants leads to both corneal and retinal damage.
  In the cornea, key cellular signaling pathways—including inflammation, oxidative
  stress with the generation of reactive oxygen species (ROS), and the unfolded protein
  response (UPR)—are rapidly activated. These stress responses can lead to the release
  of signaling molecules such as VEGF and ROS, which may diffuse posteriorly and contribute
  to secondary retinal injury. Additionally, vesicants may directly reach the retina
  by diffusing through the vitreous humor, causing retinal cell death via apoptosis,
  ferroptosis, and/or necrosis or through blood circulation. Thus, in cases of systemic
  exposure, retinal injury can occur via two primary mechanisms: (1) direct transmission
  following corneal exposure, and (2) indirect exposure through ocular blood circulation.
  Both routes have the potential to disrupt retinal cell homeostasis and function'
article_title: Current progress in research on ocular injury caused by exposure to
