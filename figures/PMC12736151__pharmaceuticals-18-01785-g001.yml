figure_title: The pathological significance of ferroptosis.
caption: The pathological significance of ferroptosis. This figure systematically
  illustrates the broad associations between ferroptosis and human diseases. In cancers
  (left half, blue background), ferroptosis resistance contributes to tumor progression
  and therapy resistance, whereas inducing ferroptosis has emerged as a potential
  therapeutic strategy. The right half (red background) represents injury-related
  disorders associated with hyperactivation of ferroptosis. Understanding the mechanisms
  and regulation of ferroptosis across diverse diseases may facilitate the development
  of novel therapeutic interventions targeting this pathway. Created in BioRender.
  Chen, J. (2025) https://BioRender.com/727asls, accessed on 2 October 2025. This
  review primarily focuses on advances in ferroptosis inducers and inhibitors; detailed
  molecular mechanisms in specific diseases are not explored herein. Interested readers
  could refer to references [5,6,7,8]
