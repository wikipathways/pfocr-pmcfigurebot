figure_title: Overexpression of miR-200a reduces the Wnt signaling and inhibits the
  proliferation of GEDFs.
caption: Overexpression of miR-200a reduces the Wnt signaling and inhibits the proliferation
  of GEDFs. (A) RT-qPCR analysis demonstrating significant downregulation of Wnt signaling
  pathway genes following miR-200a overexpression. (B) RT-qPCR detection of proliferation-related
  gene expression after overexpression of miR-200a. (C) CCK8 detection of cell proliferation
  of GEDFs after overexpression of miR-200a at 12 h, 24 h, 36 h, and 48 h. (D) Images
  of EdU assays at 24 h post-transfection, with EdU-positive cells (red) counterstained
  with DAPI (blue). (E) Quantification of EdU-positive cells demonstrates significantly
  reduced proliferation rates in the miR-200a mimics group. All experiments were performed
  with three biological replicates (n = 3), with data presented as mean ± SEM (* p
  < 0.05, ** p < 0.01, **** p < 0.0001)
