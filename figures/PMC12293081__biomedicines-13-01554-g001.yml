figure_title: Role of autophagy in regulating intestinal homeostasis.
caption: Role of autophagy in regulating intestinal homeostasis. Autophagy counteracts
  colorectal cancer (CRC) by limiting cell proliferation and migration, mainly through
  inhibition of the Wnt/β-Catenin pathway) while also mitigating inflammation associated
  with inflammatory bowel disease (IBD), a condition that can progress to CRC. Autophagy
  in epithelial cells is also important for maintaining cell-to-cell adhesion and
  producing mucus, which prevents colonization by pathogenic bacteria. These activities
  highlight the dual protective role of autophagy in maintaining intestinal integrity
  and preventing tumorigenesis (Created in BioRender. Isidoro, C. (2025) https://BioRender.com/pzq0dhg)
