caption: 'Expression changes of carbon metabolism genes in response to CAP treatment
  of stationary-phase cells in glucose medium. (a) Heatmap of expression fold changes
  (FCs) for genes involved in major carbon metabolism pathways. The log2FC values
  are color-coded as indicated, with grey boxes indicating non-significant expression
  changes (FDR > 0.05). (b) Carbon metabolism network scheme to map gene expression
  changes in response to CAP treatment in stationary-phase cells grown in glucose
  medium. Genes are colored according to their log2FC shown in (a): red indicates
  significantly induced genes (log2FC > 1), blue indicates significantly repressed
  genes (log2FC < −1), black indicates small fold changes (−1 < log2FC < 1), and grey
  indicates non-significant changes (FDR > 0.05)'
