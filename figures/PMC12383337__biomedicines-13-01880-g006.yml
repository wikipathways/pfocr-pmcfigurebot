figure_title: Schematic representation of the ferroptosis signaling pathways.
caption: Schematic representation of the ferroptosis signaling pathways. The diagram
  shows iron uptake via the transferrin receptor, leading to Fenton reactions and
  lipid peroxidation. The glutamate–cysteine antiporter and System Xc- facilitate
  cystine uptake for glutathione (GSH) synthesis, which is crucial for GPX4-mediated
  lipid peroxide detoxification, preventing ferroptosis. The figure highlights the
  roles of p53 and NRF2 in regulating antioxidant defenses
