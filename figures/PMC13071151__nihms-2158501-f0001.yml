figure_title: mTORC2/AKT is required for c-Met/β-cateninΔ90 driven hepatocarcinogenesis
caption: '(A) Study design. FVB/N mice were hydrodynamically injected with c-Met/β-cateninΔ90.
  Mice were monitored for tumor development and were euthanized when moribund tumors
  developed. (B) Representative gross liver images, H&E staining, and immunohistochemistry
  of Ki67, β-catenin, Myc-tag, and GS. Scale bars: 100 μm. (C) Western blot analysis
  of AKT pathway proteins, β-catenin, GS, c-MET, and p-ERK in normal liver (NL) and
  c-Met/β-cateninΔ90 liver tumors. GAPDH was used as the loading control. (D) Study
  design. Rictorflox/flox mice were hydrodynamically injected with either c-Met/β-cateninΔ90/pCMV
  or c-Met/β-cateninΔ90/Cre plasmids. (E) The survival curves of Rictorflox/flox mice
  injected with c-Met/β-cateninΔ90/pCMV (n=12) and c-Met/β-cateninΔ90/Cre (N=11).
  (F) Comparisons of liver weight. Data are presented as the mean ± SEM. (G) Representative
  gross liver images, H&E staining, and immunohistochemistry of Ki67, β-catenin, Myc-tag,
  and GS. Scale bars: 100 μm. (H) Western blot analysis of the AKT pathway proteins,
  c-MET, β-catenin, and GS in normal liver (NL), c-Met/β-cateninΔ90/pCMV liver tumors,
  and c-Met/β-cateninΔ90/Cre liver tumors. GAPDH was used as the loading control.
  Statistical significance: **P < 0.01. Abbreviations: H&E, hematoxylin and eosin
  staining; w.p.i., weeks post-injection; NT, non-tumor; T, tumor'
