caption: Structural characteristics and evolutionary analysis of ORF70 protein sequence.
  (A) The nucleotide sequence of ORF70 and its corresponding amino acid sequence are
  shown, with the amino acid sequence highlighted in green. (B) Secondary structure
  prediction analysis of ORF70. The α-helices are represented by red helical shapes,
  while the β-sheets are depicted as blue arrows. (C) Signal peptide prediction for
  ORF70. The x-axis represents the amino acid sequence of ORF70, while the y-axis
  indicates the probability of signal peptide presence, ranging from 0 to 1. The red
  line represents the probability of the Sec/SPI pathway (SP), indicating the likelihood
  of the presence of a signal peptide. The horizontal thresholds indicate the cutoff
  values for signal peptide prediction, with values above 0.5 suggesting a signal
  peptide. (D) Prediction and analysis of transmembrane structures. Transmembrane
  helix prediction (TMHMM) showing the predicted transmembrane domain spanning residues
  ~2–24, with inside/outside probabilities plotted along the sequence
