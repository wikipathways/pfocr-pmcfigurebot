figure_title: Integration of metabolomic and transcriptomic datasets.
caption: 'Integration of metabolomic and transcriptomic datasets. A: significantly
  altered metabolites in the γ-irradiated HIOs were subjected to pathway enrichment
  (MetaboAnalyst 6.0). Enriched pathways for either crypt HIOs or villi HIOs, which
  have a P value < 0.05, are shown. B: a gene-metabolite interaction network was generated
  (MetaboAnalyst 6.0) using the 25 DEGs of villi γ-irradiated HIOs, which are associated
  with significantly changed metabolites. Red circles indicate genes upregulated with
  γ irradiation, whereas green circles represent downregulated genes. Blue squares
  are indicative of metabolites significantly altered in the HIOs. HIOs from five
  individual donors were included, and pooled technical replicates for each donor
  were subjected to analysis. DEGs, differentially expressed genes; HIOs, human intestinal
  organoids'
article_title: Distinct molecular responses of human intestinal organoids to proton
