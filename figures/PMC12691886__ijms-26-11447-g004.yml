figure_title: Mechanical triggers of cartilage degeneration leading to pre-OA.
caption: 'Mechanical triggers of cartilage degeneration leading to pre-OA. (a) HST
  during a typical gait cycle. The vGRF was plotted and normalized to %BW across the
  stride cycle. The shaded region highlights the HST (approximately 0–15% of the cycle;
  vertical dashed line = heel contact), where vGRF rapidly rises to its early peak.
  Initially, energy is absorbed (negative power), followed by a swift release (positive
  power) as the foot pushes off, thereby capturing the cyclic mechanical load that
  impacts the joint tissues. (b) Muscle response latency to gait cycle mechanical
  stimuli. Typical muscle tension (arbitrary units) over time (ms) following the gait
  stimulus. The phases shown were initial stimulus (heel contact at 0 ms), latency
  period/pre-activation delay, contraction (tension increase), and relaxation. Reflexive
  latencies commonly fall within 50–100 ms but vary with the muscle group and gait
  speed. (c) Mechanistic pathways linking mechanical loading to pre-OA. Mechanical
  stress (HST) triggers chondrocyte mechanotransduction and activates downstream signaling
  cascades (e.g., MAPK/ERK and NF-κB), increases intracellular ROS/RNS and pro-inflammatory
  cytokine (TNF-α, IL-1β, and IL-6) production, and upregulates proteolytic enzymes
  (MMPs and ADAMTS). The resultant degradation of aggrecan generates MDPs and DAMPs
  that further amplify inflammation and ECM proteolysis in a feed-forward loop, driving
  progressive cartilage deterioration and a matrix-degradation-associated secretory
  endotype. Adapted from: [87,128,129,131,132,135,144,145,146,147,148,149]. Abbreviations:
  ADAMTS, a disintegrin and metalloproteinase with thrombospondin motifs; BW, body
  weight; DAMPs, damage-associated molecular patterns; ERK, extracellular signal-regulated
  kinase; IL-1β, interleukin-1 beta; IL-6, interleukin-6; MAPK, mitogen-activated
  protein kinase; MDP, matrix-derived degradation products; MMP, matrix metalloproteinase;
  NF-κB, nuclear factor kappa B; ROS, reactive oxygen species; TNF-α, tumor necrosis
  factor-alpha'
