figure_title: The treatment of CDCA, GCDCA, and TGR5 agonist INT-777 exhibit the mechanistic
  parallels in modulating the inflammatory response induced by SARS-CoV-2 in THP-1
  cells through the NOD-like receptor signaling pathway.
caption: The treatment of CDCA, GCDCA, and TGR5 agonist INT-777 exhibit the mechanistic
  parallels in modulating the inflammatory response induced by SARS-CoV-2 in THP-1
  cells through the NOD-like receptor signaling pathway. (a,b) RNA sequencing of THP-1
  cell line stimulated by SARS-CoV-2 treated with 2.5 μM CDCA, 20 μM GCDCA, 20 μM
  GW4064, or 20 μM INT-777 for 24 h. PCA (a) and sample correlation analysis (b) of
  DEGs among the treatment of four compounds. (c) KEGG enrichment of TOP 10 upregulated
  and downregulated pathways induced by SARS-CoV-2 stimulation. (d–h) GSEA of NOD-like
  receptor signaling pathway in THP-1 cells stimulated by SARS-CoV-2 (e) and treated
  with CDCA (f), GCDCA (g), INT-777 (h), and GW4064 (d). The enrichment plot has three
  components. (Top) Enrichment score profile showing the maximum deviation from zero.
  The green curve represents the running enrichment score. (Middle) The bars indicate
  gene set member positions in the ranked gene list, while the core enrichment genes
  are highlighted in red. (Bottom) Red/blue gradient indicates high/low expression
  of leading-edge genes within the pathway. Gray area plot displays Signal2Noise values
  across all genes (ranked left-to-right). The heatmap plot indicates variations of
  the Transcript per Kilobase per Million mapped reads (TPM) between each sample of
  the two groups
