figure_title: Free energy evolution in the constant curvature and constant area models
  when accounting for one of either the polymerization energy term Ea=-μa0 or the
  curvature generation energy term Ec=-va0c0 (type 1) and Ec=-va0c02 (type 2).
caption: Free energy evolution in the constant curvature and constant area models
  when accounting for one of either the polymerization energy term Ea=-μa0 or the
  curvature generation energy term Ec=-va0c0 (type 1) and Ec=-va0c02 (type 2). (a,b)
  Free energy landscape of the modified constant curvature model where c‾0=2 with
  polymerization energy Ea=-μa0 in (a) and the corresponding phase diagram in the
  phase space of (c0,μ) in (b). The rightmost endpoint of each curve is the vesiculation
  point where ψmax=150∘. The red line in (a) and red dots in (b) correspond to pathways
  with minimum free energy Etot appearing at a point other than the vesiculation point
  on the Etot-a‾0 curve. The orange line in (a) and the orange dots in (b) correpsond
  to pathways where the vesiculation point is the minimum free energy point, but an
  energy barrier still exists. The green line in (a) and green dots in (b) correspond
  to vesiculation pathways without an energy barrier. The energy barrier ΔEtot is
  defined as the energy difference between the maximum point and the first minimum
  point before the maximum. ΔEtot of the orange curve is shown in (a) as a typical
  example. The gray dots in the left-hand side of (b) correspond to pathways that
  numerically fail to reach the vesiculation point when a‾0 reaches its upper limit
  10. (c,d) Free energy landscape of the modified constant area model where a‾0=2
  with curvature generation energy Ec=-va0c0 in (c) as a function of the intrinsic
  curvature c0 and the corresponding phase diagram in the phase space of a0,v in (d).
  The gray dots in the left-hand side of (d) correspond to pathways that numerically
  fail to reach the vesiculation point when c‾0 reaches its upper limit 5. (e,f) Free
  energy landscape of the modified constant area model where a‾0=2 with Ec=-va0c02
  in (e) and the corresponding phase diagram in the phase space of (a0,v) in (f).
  The gray dots in the left-hand side of (f) correspond to pathways that numerically
  fail to reach the vesiculation point when c‾0 reaches its upper limit 5. (a-f) The
  parameters with a bar over them are normalized to be dimensionless, and the dimensional
  parameters are calculated using one of the typical fitting values L0=40nm (Figure
  5). (b,d,f) The black line separates the region wiht gray dots (which did not numerically
  reach vesicultion) from the other regions. The dotted, dash-dotted and solid gray
  lines respectively represent the paths where ΔEtot=1kBT,ΔEtot=10kBT,ΔEtot=100kBT
