figure_title: Multi-omics analysis identifies nucleotide metabolism as a substantially
  reprogramed metabolic pathway upon classical stimulation
caption: a) Pathway enrichment analysis comparing metabolomic changes in unstimulated
  and 24h continually stimulated BMDMs. b) Several pathways identified in Fig. 1a
  are directly connected to the nucleotide metabolism process. c) Metabolomic changes
  in pentose phosphates, nucleotides, nucleosides, and nitrogenous bases in BMDMs
  over a timecourse of continual or acute stimulation. d) Principal component analysis
  of transcriptomic changes in BMDMs over a timecourse of acute stimulation. e) Transcriptional
  changes in nucleotide metabolism in BMDMs over a timecourse of acute stimulation.
  Genes involved in nucleotide de novo synthesis (blue) or degradation (green) are
  indicated by color codes of gene names. c, e) Relative (c) metabolite abundances
  or (e) gene expression levels are compared to unstimulated cells (0h) and displayed
  on a log2 scale as a heatmap, with saturating color representing 10-fold change
  (or 3.32 on log2 scale). Each box represents the mean of n=3 independent samples
article_title: Classically activated macrophages undergo functionally significant
  nucleotide metabolism remodeling driven by nitric oxide
