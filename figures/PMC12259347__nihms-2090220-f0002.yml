caption: 'Values are standardized coefficients. N = 299. Main and moderating effects
  of surgency and effortful control included but not illustrated. Covariates included
  in the model specified as predicting household food insecurity, depressive symptoms,
  maternal sensitivity, and behavior problem, but not illustrated include maternal
  age and education. Covariate included in the model specified as predicting behavior
  problem and socioemotional competence, but not illustrated include maternal depressive
  symptoms at 14 months. The dashed lines represent non-significant results. The conditional
  indirect pathway from food insecurity to socioemotional competence through depressive
  symptoms and maternal sensitivity was significant (β = −.02, B = −.04, SE = .03,
  95% CI [−.148, −.004]). Model fit: RMSEA= .05, 95% CI [.03, .07], SRMR = .04, and
  CFI = .91. *p < .05, **p < .01'
