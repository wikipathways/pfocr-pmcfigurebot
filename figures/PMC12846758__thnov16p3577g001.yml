figure_title: Serum lactate is elevated in patients with a poor prognosis and inhibition
  of glycolytic pathway alleviates edema and BBB injury.
caption: 'Serum lactate is elevated in patients with a poor prognosis and inhibition
  of glycolytic pathway alleviates edema and BBB injury. A, Heatmap of altered metabolites
  from targeted energy metabolite profiling between the PP (left) and GP (right) group.
  Color scale indicates Z-score: Z-score > 0 are upregulated (red); Z-score < 0 are
  downregulated (blue). B, Fold change plot of detected metabolites from targeted
  metabolite profiling of GP and PP serum. Color scale indicates the degree of log2
  fold change (red, upregulated > 2; violet, downregulated < -1). C, PCA plot of the
  PC 1 and 2 of significantly altered metabolites from ten GP and ten PP serum samples.
  D, Pathway matches of significantly changed metabolites in PP serum compared to
  GP serum based on targeted metabolite profiling. Circle size reflects the pathway
  impact and color code visualizes -log(p) value (white = 0, yellow = 1, orange =
  2, red > 3). E, Three-factor correlation analysis involving the patient''s 90-day
  mRS, serum lactate levels, and edema score. F, The modified Rankin Scale was employed
  to assess the clinical progression of patients at 90 days, with scores ranging from
  0 to 6. Specifically, a score of 0 indicates the absence of symptoms, 1 signifies
  no clinically significant disability, 2 denotes mild disability, 3 reflects moderate
  disability, 4 represents moderately severe disability, 5 indicates severe disability,
  and finally, a score of 6 corresponds to death. These figures illustrate the proportion
  of patients within each category (%). G, Experimental design and timeline for 2DG
  treatment, and analysis in tMCAO mice. tMCAO refers to transient middle cerebral
  artery occlusion. H, Representative MRI T2 images. Statistical brain infarct volume
  which was detected using T2-weighted MRI at 1,3,5 days after tMCAO (the upper n
  = 27 per group and the lower n = 9 per group). I, Representative MRI post-contrast
  T1 images. White dashed circles represent the leakage area. Quantification of BBB
  permeability by T1SIdiff ✕ PBV (the upper n = 27 per group and the lower n = 9 per
  group). J. Representative images of immunofluorescence staining of FITC-Dextran
  and endothelial marker CD31 in ischemia-reperfusion cortex. K. Quantification of
  relative extravasation of FITC-dextran in tMCAO mice (n = 8 per group). L. Analysis
  correlation between Dextran area and mNSS score. Data are mean ± SEM'
