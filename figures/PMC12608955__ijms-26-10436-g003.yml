figure_title: mRNA expression of cGAS–STING pathway genes, pro-inflammatory cytokines,
  microglial activation marker, and BDNF in the hippocampus of CUMS-exposed rats and
  the effect of vitamin D3 treatment.
caption: |-
  mRNA expression of cGAS–STING pathway genes, pro-inflammatory cytokines, microglial activation marker, and BDNF in the hippocampus of CUMS-exposed rats and the effect of vitamin D3 treatment. (A) Relative mRNA expression of cGAS, STING, TBK1, and IRF3 showing activation of the cGAS–STING pathway following CUMS exposure and attenuation by vitamin D3 in a dose-dependent manner. (B) Expression of IFN-γ, NF-κB, TNF-α, and IL-6 illustrating suppression of CUMS-induced pro-inflammatory cytokine upregulation by vitamin D3. (C) Expression of Iba1, VDR, and BDNF demonstrating reduction in microglial activation, restoration of VDR levels, and recovery of BDNF expression with vitamin D3 treatment. Data are presented as fold change relative to the control group (set at 1). Statistical analysis was performed using one-way ANOVA followed by Holm–Sidak post hoc tests. # indicates p < 0.05 and ##
  p < 0.001 for CUMS versus control; * indicates p < 0.05 and ** p < 0.001 for vitamin D3-treated groups versus CUMS
