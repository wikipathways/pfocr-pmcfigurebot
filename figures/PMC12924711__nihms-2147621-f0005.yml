figure_title: IR induces YTHDF2 to degrades m6A-bound mRNA in Notch signaling pathway
caption: '(A) Schematic illustration on the analysis strategy for identifying YTHDF2-bound
  and m6A-modified gene transcripts. (B) Venn diagram of overlapping genes from mRNAseq
  that were downregulated following WT+IR versus WT and upregulated following Ythdf2-cKO+IR
  versus WT+IR. (C) Twin-volcano plot of genes with differential expression levels
  in the DCs (left: cKO+IR versus WT+IR, right: WT+IR versus WT), m6A marked genes
  (m6A-seq) are shown with green circles, YTHDF2 marked genes (RIPseq) are shown with
  purple circles, both m6A and YTHDF2 marked genes are shown with red circles. 86
  target genes of YTHDF2 shown in upregulated cKO+IR versus WT+IR region and downregulated
  WT+IR versus WT region are represented with black circles. (D) GO enrichment pathway
  analysis using 86 YTHDF2 target genes in the context of IR. (E) Sankey flow diagrams
  of specific genes categorized in each enriched pathway in (D). (F) Induction of
  NICD from BMDCs with single or triple knockdown of Mfng, Aph-1b, and Aph-1c, n =
  3. Statistical analysis was performed using two-sided unpaired Student’s t test
  (F); **P<0.01. Data are represented as mean ± SEM'
article_title: Radiotherapy induces YTHDF2 in dendritic cells impairing cross-presentation
