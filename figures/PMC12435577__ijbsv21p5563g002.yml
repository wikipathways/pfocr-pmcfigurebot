figure_title: Hepatocyte pyroptosis is the critical feature of acute liver injury.
caption: 'Hepatocyte pyroptosis is the critical feature of acute liver injury. (A)
  Heatmap of DEGs related to hepatocyte injury in whole liver tissue sequencing. (B)
  Signaling pathways related to inflammation and cell death were enriched by GO analysis.
  (C) GSEA enrichment plot and heatmap showing upregulation of pyroptosis-related
  signaling in the primary hepatocytes from CCl4 group compared to the control group.
  (D) Phase contrast micrographs of primary hepatocytes from mice treated with CCl4
  at 0, 6, 12, 24, and 48 hours (Scale bar: 50μm). (E) LDH activity in the cell culture
  supernatant at different timeline under control and CCl4 treatment (n = 3 per group).
  (F) PI/Cleaved CASPASE1 co-staining of primary hepatocytes at different timeline
  of the CCl4 groups (Scale bar: 50μm, n = 3 per group). (G) Protein levels of GSDMD-N
  and Cleaved CASPASE1 in primary hepatocytes from CCl4-treated mice at different
  timeline. (H) Protein levels of GSDMD-N and Cleaved CASPASE1 in primary hepatocytes
  transfected with si-Caspase1 and control si-RNA from indicated groups (n = 3 per
  group). (I, J) PI/Cleaved CASPASE1 co-staining of primary hepatocytes and LDH activity
  in the cell culture supernatant at different timeline from indicated groups (Scale
  bar: 50μm, n = 3 per group). All results are shown as mean ± SEM. *p < 0.05. ns,
  not significant'
