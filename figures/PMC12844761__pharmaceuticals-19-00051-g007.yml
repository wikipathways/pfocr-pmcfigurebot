figure_title: Comparative evaluation of raw and nanoliposomal naringin on hepatic
  JAK/STAT signaling pathway following nickel sulfate exposure in rats.
caption: 'Comparative evaluation of raw and nanoliposomal naringin on hepatic JAK/STAT
  signaling pathway following nickel sulfate exposure in rats. (A) JAK: Janus Kinase;
  (B) STAT: Signal Transducer and Activator of Transcription. Group abbreviations:
  “NRG: Naringin (80 mg/kg body weight); NRG-NLPs: Naringin-loaded liposomal nanoparticles
  (80 mg/kg body weight); Ni: Nickel sulfate (20 mg/kg body weight); Ni + NRG: Combined
  treatment of naringin (80 mg/kg body weight) and nickel sulfate (20 mg/kg body weight);
  Ni + NRG-NLPs: Combined treatment of naringin-loaded liposomal nanoparticles (80
  mg/kg body weight) and nickel sulfate (20 mg/kg body weight) (each group n = 10)”.
  Values are presented as mean ± SE. Significant differences (p < 0.05) within the
  same row are indicated by different superscript letters (a, b, c, d)'
