  function (MF). (B) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment
  analysis of source genes of DECs from cluster P0. (C) GO enrichment analysis was
  performed on the host genes of DECs derived from cluster P3. (D) KEGG pathway enrichment
  analysis of source genes of DECs from cluster P3. (E) GO enrichment analysis was
  performed on the host genes of DECs derived from cluster P9. (F) KEGG pathway enrichment
  analysis of source genes of DECs from cluster P9
