figure_title: Molecular pathways modulated by OFIF-derived carotenoids in metabolic
  syndrome.
caption: 'Molecular pathways modulated by OFIF-derived carotenoids in metabolic syndrome.
  This schematic focuses on the mechanisms associated with carotenoids (e.g., β-carotene,
  lutein, zeaxanthin) present in Opuntia ficus-indica fruits. Carotenoids exert antioxidant
  and immunomodulatory effects through activation of nuclear receptor signaling pathways,
  including RAR/RXR and their interaction with PPAR isoforms, thereby influencing
  transcriptional regulation of lipid and glucose metabolism. These compounds contribute
  to the enhancement of NRF2-mediated antioxidant defenses and attenuation of NF-κB-driven
  inflammatory signaling, while also modulating lipid homeostasis (↓ SREBP-1c, ↓ FAS,
  ↑ PPAR-α, ↑ CPT1α) and oxidative stress markers. Although partially overlapping
  with other OFIF bioactives in downstream signaling, this figure emphasizes carotenoid-specific
  regulatory pathways and nuclear receptor–mediated effects. Current evidence is largely
  derived from experimental and observational studies, with limited direct clinical
  validation in metabolic syndrome. Upward (↑) and downward (↓) arrows indicate activation/upregulation
  and inhibition/downregulation of the indicated pathways, respectively. Color coding
  is used to distinguish functional domains: orange denotes carotenoid-related pathways,
  red inflammatory signaling, blue oxidative damage markers, and green systemic metabolic
  effects. Abbreviations: NRF2, nuclear factor erythroid 2–related factor 2; NF-κB,
  nuclear factor kappa B; TNF-α, tumor necrosis factor alpha; IL-6, interleukin-6;
  MCP-1, monocyte chemoat-tractant protein-1; NOX, NADPH oxidase; HO-1, heme oxygenase-1;
  NQO1, NAD(P)H quinone dehydrogenase 1; SREBP-1c, ster-ol regulatory element-binding
  protein 1c; FAS, fatty acid synthase; PPAR-α, peroxisome proliferator-activated
  receptor alpha; CPT1a, carnitine palmitoyltransferase 1a; MDA, malondialdehyde'
