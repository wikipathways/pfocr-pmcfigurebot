figure_title: Macrophages and neutrophils utilize their mitochondria differently in
  response to damage signals
caption: '(A) The mitochondria and mitochondrial respiration are the main source of
  reactive oxygen species (ROS) in macrophages, driving various inflammatory signals.
  (B) Neutrophils utilize the pentose phosphate pathway (PPP), which runs parallel
  to the glycolysis pathway, as the main source of cellular ROS production instead
  of their mitochondria. In response to stress, neutrophils trigger the formation
  of neutrophil extracellular traps (NETs), utilizing the DNA from DNA decondensation
  and nuclear envelope degradation, a hallmark of neutrophil stress, which results
  in NETosis. Abbreviations: LPS, lipopolysaccharide; MAVS, mitochondrial antiviral
  signaling protein; mtDNA, mitochondrial DNA; ox-mtDNA, oxidized mtDNA. Figure created
  with BioRender'
