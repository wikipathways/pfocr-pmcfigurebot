figure_title: Genomic analysis of extracranial tumors from patients with and without
  central nervous system (CNS) metastases
caption: (A) Genomic landscape of pretreatment samples from patients without (‘Never’)
  or with CNS metastases (de novo or acquired, ‘Ever’). The type of genetic alteration
  (structural variant, deletion, amplification, truncating mutation, splice variant,
  missense mutation, in-frame mutation, promoter mutation), mutational signature category
  [reactive oxygen species (ROS), homologous recombination deficiency (HRD), smoking,
  APOBEC, Clock-like, unknown], and whole-genome doubling (WGD) is described in the
  key. The frequency of mutations is noted in the middle. Tumor mutational burden
  (TMB) frequency is displayed on top. (B) Scatterplot of gene alterations with frequencies
  ≥5% in ‘Never’ versus ‘Ever’ tumor samples. TP53, RB1, EGFR, and MET are shown regardless
  of frequency. Genes highlighted in red indicate a ≥10% frequency difference between
  the cohorts. (C) Comparison of oncogenic signaling pathway alterations from ‘Never
  and ‘Ever’ patient samples
