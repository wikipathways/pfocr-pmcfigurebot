figure_title: ncRNAs implicated in both GBM progression and macrophage polarization.
caption: ncRNAs implicated in both GBM progression and macrophage polarization. (A).
  miR-340-5p regulates expression of Periostin to decrease integrin expression. (B).
  PVT1 stabilizes DHX9, increasing STAT1 signaling. (C). H19 encodes a small immune-related
  protein which decreases Galectin 9 Signaling. (D). miR-21 and miR-451 are packaged
  in exosomes and regulate expression of c-Myc. (E). miR-25 and miR-93 are packaged
  into exosomes and target IRF1 mRNA for degradation. (F). miR-125b and miR-155 are
  packaged into exosomes and traffic to macrophages to target IL-6 and Arginase 1.
  (G). miR-1246 is packaged into exosomes and interacts with the STAT3 signaling pathway
  to increase VEGF signaling. (H). miR-6733-5p travels to macrophages via exosomes,
  where it targets IGF2BP3. (I). miR-124 has been utilized in exosome research to
  decrease M2 markers within macrophages. (J). miR106-5p regulates expression of IRF1,
  decreasing expression of IFNß and related genes. (K). miR-142-3p targets the gp-130
  subunit of IL-6, impairing IL-6 signaling in GBM. (L). miR-340-5p targets LTBP1
  for degradation, increasing TGFβ signaling. (M). Neat1 stabilizes transcription
  factors Jun and Fos, increasing expression of TNFα. Created in BioRender. Westemeier-Rice,
  E. (2025) https://BioRender.com/54uu0p6
