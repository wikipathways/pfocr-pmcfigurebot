figure_title: Proposed Hedgehog and BMP signaling pathways in Drosophila nociceptors
caption: 'Hedgehog (Hh / Sonic Hedgehog: Shh) and downstream Bone Morphogenetic Protein
  (BMP) signaling components operate in the Drosophila Type II Class IV dendritic
  arborization neuron, a thermal and mechanical nociceptor. Hh binding to Patched
  (Ptc / Patched 1: Ptc1) disinhibits Smoothened (Smo / Vertebrate Smoothened: Smo).
  In ciliated sensory neurons, Smo enters the cilium. Subsequent activation of Cubitus
  Interruptus (Ci / Glioma Associated Oncogene 1: Gli1) leads to Hh target gene transcription,
  including Decapentaplegic (Dpp / BMP 2/4). Dpp and Glass Bottom Boat (Gbb / BMP
  5-8), possibly as a heterodimer, bind receptors Punt (Put / Transforming Growth
  Factor Beta Receptor 1: TGFBR1), Thick Veins (Tkv / BMP Receptor 1A/B: BMPR1A/B),
  Wishful Thinking (Wit / BMP2 Receptor: BMPR2) and Saxophone (Sax / Activin A Receptor
  1: ACVR1), leading to activation of Mothers Against Decapentaplegic (Mad / Small
  MAD 1: Smad1) which, with Medea (Med /Small MAD 4: Smad4), activates BMP target
  genes. Dally (Dly / GPC1-6: Glypican 1-6) and Dally-like Protein (Dlp / GPC3/5:
  Glypican 3/5) affect the availability of various ligands including Hh, Dpp and Gbb.
  No Mechanoreceptor Potential B (NompB / Intraflagellar Transport Protein 88: IFT88)
  is required for ciliary assembly and function. Abbreviations/Vertebrate Homologs:
  Hedgehog (Hh / Sonic Hedgehog: Shh), Bone Morphogenetic Protein (BMP), Patched (Ptc
  / Patched 1: Ptc1), Smoothened (Smo / Vertebrate Smoothened: Smo), Cubitus interruptus
  (Ci / Glioma Associated Oncogene 1: Gli1), Decapentaplegic (Dpp / BMP 2/4), Glass
  Bottom Boat (Gbb / BMP 5-8), Punt (Put / Transforming Growth Factor Beta Receptor
  1: TGFBR1), Thick Veins (Tkv / BMP Receptor 1A/B: BMPR1A/B), Wishful Thinking (Wit
  / BMP2 Receptor: BMPR2), Saxophone (Sax / Activin A Receptor 1: ACVR1), Mothers
  Against Decapentaplegic (Mad / Small MAD 1: Smad1), Medea (Med /Small MAD 4: Smad4),
  Dally (Dly / GPC1-6: Glypican 1-6), Dally-like Protein (Dlp / GPC3/5: Glypican 3/5),
  No Mechanoreceptor Potential B (NompB / Intraflagellar Transport Protein 88: IFT88).
  Created in BioRender. GANTER, G. (2025) https://BioRender.com/l7jtxj0'
