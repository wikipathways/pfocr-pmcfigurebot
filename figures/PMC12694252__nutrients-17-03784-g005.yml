figure_title: Integrated cardiometabolic mechanisms of HTyr and Tyr in atherosclerosis.
caption: 'Integrated cardiometabolic mechanisms of HTyr and Tyr in atherosclerosis.
  Schematic representation of the main pathways, from absorption and metabolism to
  downstream actions, through which HTyr and Tyr may attenuate atherosclerosis. ABCA1:
  ATP-binding cassette transporter A1; ACC: acetyl-CoA carboxylase; CAT: catalase;
  COX: cyclooxygenase; DOPAC: 3,4-dihydroxyphenylacetic acid; ER: endoplasmic reticulum,
  ET: Endothelin-1, FAS: fatty acid synthase; GPx: glutathione peroxidase; HTyr: hydroxytyrosol;
  HVA: homovanillic acid; ICAM-1: intercellular adhesion molecule-1; IL-6: interleukin-6;
  IL-10: interleukin-10; NF-κB: nuclear factor kappa-light-chain-enhancer of activated
  B cells; NO: nitric oxide; Nrf2: nuclear factor erythroid 2-related factor 2; ROS:
  reactive oxygen species; SOD: superoxide dismutase; SREBP-1: sterol regulatory element-binding
  protein-1; TNF-α: tumor necrosis factor-alpha; Tyr: tyrosol; VCAM-1: vascular cell
  adhesion molecule-1. Note: Arrows indicate direction of change (↓ decrease; ↑ increase);
  blunt-ended lines (⊣) indicate inhibition'
