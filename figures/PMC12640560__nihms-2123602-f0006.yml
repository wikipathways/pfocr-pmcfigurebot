caption: 'Comparison between the predictive performance of two common model types:
  DF-Native-Pathway and VTA-Normative- Structure for two pathways of interest: HDP
  (green-left) and CSBT (blue-right). Top: Each data point in a box plot is the R2
  value for one patient, i.e. the square of the correlation coefficient between the
  modeling activation predictions and experimental cEP amplitudes. Example correlation
  plots are shown for one patient (P03) comparing model predictions and cEP amplitudes
  for all stimulation settings. Bottom: An example of DF-based prediction of pathway
  activations (Left) versus VTA-based prediction of overlap with STN structure (Right)
  in the same patient (P03). Internal capsule structure is not shown on the right
  for clarity'
