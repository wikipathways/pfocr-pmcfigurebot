figure_title: Apoptosis and autophagy:S.
caption: Apoptosis and autophagy:S. costus and L. sativum activate p53, which leads
  to DNA damage response, cell cycle arrest, and apoptosis by upregulating pro-apoptotic
  proteins like Bax and Bak while down regulating anti-apoptotic proteins such as
  Bcl-2 and Mcl-1. Additionally, S. costus influences autophagy pathways, including
  Beclin-1 and the interaction of death receptors, leading to autophagic cell death.
  It includes also the apoptosis by ROS generation, which leads to mitochondrial dysfunction
  and apoptosis. R. tripartite is also involved in the modulation of the PI3K/AKT/mTOR
  pathway
