caption: 'Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway analysis of the DEGs
  among different treatment groups. (a) Statistical analysis of KEGG classification
  of all DEGs across different treatment groups; (b) statistical analysis of the enrichment
  of the top 20 KEGG pathways of the DEGs between PDMG vs. SMMG. The x-axis represents
  the level of Rich factor, and the y-axis represents the type of pathway. Dot size
  represents the number of DEGs, and colors indicate corrected p-values. The shape
  of the dot represents the KEGG classification, specifically as follows: M: Metabolism,
  GIP: Genetic Information Processing, CP: Cellular Processes, OS: Organismal Systems,
  HD: Human Diseases. The same applies to graphs c and d; (c) statistical analysis
  of the enrichment of the top 20 KEGG pathways of the DEGs between PDMG vs. EAMG;
  (d) statistical analysis of the enrichment of the top 20 KEGG pathways of the DEGs
  between SMMG vs. EAMG'
