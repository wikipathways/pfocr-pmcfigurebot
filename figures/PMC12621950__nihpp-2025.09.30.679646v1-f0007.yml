figure_title: Vitamin A production during betta development
caption: From 0 to 5 dpf, maternally deposited retinal in the yolk is utilized to
  produce the essential metabolite retinoic acid and the visual chromophore (11-cis
  retinal). Once the yolk stores of retinal are depleted, developing betta transition
  to retinoid production through the metabolism of dietary carotenoids. From 5–15
  dpf, betta convert β-carotene from rotifer feeds to retinal via the 15,15’ oxygenase
  activity of bco1l. From 15 dpf to adulthood, betta rely on the provitamin A ketocarotenoid
  content of Artemia feeds. These molecules are likely converted to β-carotene through
  an unknown pathway and subsequently cleaved by bco1l. Created in BioRender
article_title: Retinoic acid production via the ray-finned fish gene beta-carotene
  oxygenase 1-like is essential for juvenile development
