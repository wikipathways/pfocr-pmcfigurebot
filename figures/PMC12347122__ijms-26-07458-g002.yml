figure_title: Major schematic pathway of anti-sarcopenic compounds.
caption: Major schematic pathway of anti-sarcopenic compounds. Quercetin reduces muscle
  atrophy and inflammation by inhibiting NF-κB, ERK, and p38, thereby suppressing
  the transcription of TNF-α, MCP-1, Atrogin-1, and MuRF1. It also helps maintain
  mitochondrial homeostasis by regulating AMPK, which subsequently activates PPARs.
  Rutin primarily alleviates inflammation through inhibition of the NF-κB pathway
  and promotes mitochondrial biogenesis via AMPK activation. Both rutin and genkwanin
  enhance glucose uptake and help prevent hyperglycemia. Kaempferol glycosides mainly
  modulate the PI3K/Ras pathway, thereby promoting glycogen synthesis. Some kaempferol
  glycosides, along with isoschaftoside, naringin, and puerarin, effectively preserve
  mitochondrial homeostasis or enhance mitochondrial biogenesis. Additionally, isoschaftoside
  and naringin exhibit anti-inflammatory effects (blue arrow indicates decrease in
  inflammation and muscle atrophy)
