figure_title: Differential gene expression in slow-clearing parasites after artesunate
  treatment
caption: (A) Each bar represents the number of differentially expressed Plasmodium
  vivax genes between the two timepoints (FDR<0·1). Red segments represent genes that
  are uniquely differentially expressed in slow-clearing parasites while the grey
  segments show genes that are differentially expressed in both slow-clearing and
  fast-clearing parasites. Numbers above each bar indicate the number of sample pairs
  included in each comparison. (B) Volcano plot showing differential gene expression
  between 2 h and 4 h post-artesunate treatment. Blue points indicate genes that are
  significantly decreased in expression at 4 h post-treatment; red points indicate
  genes that are significantly increased in expression at 4 h post-treatment. Blue
  labels highlight genes involved in the haemoglobin digestion pathway; red labels
  highlight kelch-domain containing genes. DEG=differentially expressed gene. FC=fold-change.
  FDR=false discovery rate
