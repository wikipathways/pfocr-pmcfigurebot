figure_title: Impulse response dynamics of ERK pathway components in MIN5 cells
caption: (A) Diagram illustrating how the relationship between input (τin) and output
  (τout) kinetics influences the processing of extracellular signals into dynamic
  or sustained intracellular responses to control fast or slow processes that ultimately
  drive adaptation to environmental changes. (B) Schematic of an impulse-response
  assay, in which a single, pulsed input is applied to a given system to characterize
  how the kinetics of a measured response output (τout) vary with respect to the kinetics
  of the applied input signal (τin). (C) Summary quantification of the time to half
  decay (Decay T1/2) of the response from RCaMP1d (Ca2+;), RasGRF2-mCherry (RasGRF2;
  n = 16 cells), RaichuEV-Ras (Ras; n = 32 cells) and EKAREV (ERK; n = 70 cells) in
  MIN6 cells simulated with 30 mM potassium chloride (KCl) for 1 min. n = 109 (Ca2+),
  16 (GRF2), 32 (Ras), and 70 (ERK) cells from 7, 4, 3, and 4 independent experiments,
  respectively. ns, not significant. Data analyzed using Mann-Whitney U-test. Bars
  show mean ± s.e.m. (D-F) Representative average timecourses in MIN6 cells co-expressing
  (D) RasGRF2-mCherry (magenta curve; n = 7 cells) plus pmGCaMP3 (Ca2+, green curve)
  or either (E) RaichuEV-Ras (Ras, blue curve; n = 15 cells) or (F) EKAREV (ERK, dark
  blue curve; n = 17 cells) plus RCaMP1d (Ca2+, red curves) and stimulated with 30
  mM KCl for 1 min. Solid lines indicate the mean; shaded areas, s.d. Representative
  of 4 (D), 3 (E), and 4 (F) independent experiments. See also Fig. S5
