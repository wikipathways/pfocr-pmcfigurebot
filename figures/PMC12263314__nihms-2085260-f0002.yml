figure_title: Cell deconvolution analysis and comparison to matched bulk mRNA sequencing
  dataset
caption: (A) Graphical depiction of cell compartments from tumors in the Low and High
  DFI groups. (B) Macrophage proportions in the Low and High DFI groups. (C) CD8+
  T cell proportions in the Low and High DFI groups. (D) Comparison of cellular proportions
  between the GeoMx platform and bulk mRNA sequencing where each dot represents a
  specific cell type (e.g., CD8 T cells) estimated by RNAseq (x-axis) and GeoMx (y-axis)
  for each patient (n = 9). (E) Comparison of pathway enrichment between the GeoMx
  platform and bulk mRNA sequencing for cases that had both (n = 9). The top 5 pathways
  (unshaded) were significantly different between DFI groups across platforms. Pathways
  shaded in grey or green were significantly different between DFI groups only in
  the RNAseq or GeoMx datasets, respectively
