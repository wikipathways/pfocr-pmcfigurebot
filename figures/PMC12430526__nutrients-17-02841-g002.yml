figure_title: Neurophysiological mechanism of thirst, its relation to dehydration,
  and impact on cognitive functioning in adolescents.
caption: 'Neurophysiological mechanism of thirst, its relation to dehydration, and
  impact on cognitive functioning in adolescents. The diagram illustrates the physiological
  pathway from dehydration to reduced cognitive performance: a decrease in plasma
  volume and increase in electrolyte concentration activate the thirst center and
  stimulate antidiuretic hormone release, ultimately triggering the sensation of thirst
  and reactive fluid intake. Among adolescents, this response is often delayed; they
  tend to drink fluids only after early symptoms of dehydration appear. This delay
  may impair cognitive functions such as concentration, mood, and decision-making'
