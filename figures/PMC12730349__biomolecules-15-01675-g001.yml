figure_title: Structural and functional features of lipid rafts.
caption: 'Structural and functional features of lipid rafts. Figure legend: Lipid
  rafts are highly ordered membrane microdomains enriched in cholesterol and sphingolipids
  and can be categorized into planar and caveolar rafts based on their structural
  characteristics. The illustration depicts lipid rafts as functional catalytic platforms
  that selectively enrich diverse membrane proteins, including GPI-anchored proteins,
  CAV, flotillin, Src family kinases, and immune receptors, such as PD-L1 and the
  TCR. Notably, palmitoylation of PD-L1 at Cys272 facilitates its localization within
  raft domains. Under external stimulation, lipid rafts undergo dynamic reorganization—for
  example, Fas translocates into raft regions upon ligand engagement, promoting the
  assembly of the DISC and subsequent formation of the CASMER platform, ultimately
  driving apoptotic signaling. The schematic also highlights the role of caveolar
  rafts in receptor endocytosis and vesicular trafficking. Overall, the figure emphasizes
  that lipid rafts regulate membrane protein enrichment and spatial organization to
  compartmentalize signaling pathways, thereby orchestrating processes such as vesicle
  transport, immune responses, and cell death regulation'
