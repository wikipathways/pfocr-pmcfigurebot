figure_title: Transcriptome-wide comparison and functional characterization of 293T
  and A549 cells under baseline and receptor overexpression conditions.
caption: 'Transcriptome-wide comparison and functional characterization of 293T and
  A549 cells under baseline and receptor overexpression conditions. (A) Principal
  component analysis (PCA) of transcriptomes from 293T, A549, ADORA3-overexpressing
  293T, and P2RY12-overexpressing A549 cells. (B) Venn diagram showing overlap of
  differentially expressed gene (DEG) sets between 293T vs. A549 and ADORA3-293T vs.
  P2RY12-A549 comparisons. (C) Bar plots displaying the number of upregulated and
  downregulated genes in 293T vs. A549 and ADORA3-293T vs. P2RY12-A549 comparisons.
  (D) Gene Ontology (GO) molecular function terms enriched in DEGs from 293T and A549
  cells under baseline conditions. (E) KEGG pathway enrichment analysis of DEGs from
  293T and A549 cells. (F) GO molecular function analysis following ADORA3 and P2RY12
  overexpression. (G) KEGG pathway enrichment in ADORA3- and P2RY12-overexpressing
  cells. Red dots denote genes with up-regulated expression, and blue dots denote
  genes with down-regulated expression. Thresholds: padj < 0.05'
