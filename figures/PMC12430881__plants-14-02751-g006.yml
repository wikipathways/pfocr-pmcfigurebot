caption: 'Transcriptional regulatory networks associated with soluble sugar and citric
  acid metabolism during ‘kiyomi’ fruit development. (a) Upper: schematic diagram
  of the soluble sugar metabolic pathway. SWEET, sugars will eventually be exported
  transporter; INV, invertase; SUS, sucrose synthase; SUT, sucrose transporter; SPS,
  sucrose phosphate synthetase. (a) Lower: blue circles represent structural genes
  involved in soluble sugars metabolism during fruit development and ripening. (b)
  Upper: schematic diagram of the citric acid biosynthesis and degradation pathway.
  CS, citrate synthase; ACO, aconitase; MDH, malate dehydrogenase; IDH, isocitrate
  dehydrogenase; GAD, glutamate decarboxylase; DiT, di-carboxylate transporter; PH/VHA/VHP,
  vacuolar-ATPases. (b) Lower: pink circles represent structural genes involved in
  citric acid biosynthesis and degradation'
