figure_title: Immune infiltration characteristics associated with NLRC5 expression
  in the TCGA and CancerCell cohorts.
caption: Immune infiltration characteristics associated with NLRC5 expression in the
  TCGA and CancerCell cohorts. (A–D) Box plots representing Tumor Purity, Stromal
  Score, Immune Score, and ESTIMATE Score in the TCGA cohort (n = 80), stratified
  by NLRC5 expression levels (Low vs. High). Statistical comparisons were performed
  using unpaired Student’s t-tests. (E–H) Corresponding box plots for the CancerCell
  cohort (n = 155), evaluating the same immune-related scores. The consistency between
  the two cohorts underscores the robustness of NLRC5 as a potential immune modulator.
  (I,J) CIBERSORT analysis showing the relative proportions of various immune cell
  types between NLRC5 low and high expression groups in the TCGA (n = 80) and CancerCell
  (n = 155) cohorts. The analysis reveals significant variations in immune cell infiltration,
  particularly in subsets such as T cells and macrophages, where high NLRC5 expression
  correlates with increased immune cell presence. (K,L) ssGSEA (single-sample Gene
  Set Enrichment Analysis) showing enrichment patterns of immune-related gene signatures
  in NLRC5-high versus NLRC5-low tumors in the TCGA and CancerCell cohorts. Elevated
  NLRC5 expression was associated with increased activation of multiple immune-related
  pathways (ns, p > 0.05, * p < 0.05, ** p < 0.01, *** p < 0.001)
