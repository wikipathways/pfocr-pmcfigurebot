figure_title: Potential cellular targets mediating the antiinflammatory effects of
  GLP-1 medicines
caption: GLP-1Rs are expressed at low levels in most peripheral organs and often in
  rare cell types. In osteoarthritis, a well-established inflammatory condition, GLP-1
  medicines likely exert their effects through multiple pathways. These may include
  direct actions on joint tissues such as the synovium and cartilage. Interactions
  between GLP-1 medicines, the intestinal immune system including IELs, and the gut
  microbiota may also influence joint inflammation. Additionally, the central nervous
  system represents another site of GLP-1 action, contributing to the regulation of
  systemic inflammation through indirect mechanisms. Other common inflammatory diseases
  and metabolic complications may respond to GLP-1 medicines in a similar manner
article_title: Antiinflammatory actions of glucagon-like peptide-1–based therapies
  beyond metabolic benefits
