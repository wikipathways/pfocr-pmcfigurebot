figure_title: Ifi27l2a shifts metabolic pathway to glycolysis for ATP production
caption: Sim-A9 cells were seeded onto a Seahorse plate and treated with rIfi27l2a
  for 24 hours. Mitochondrial function was then assessed using Seahorse cell analysis.
  (a) mitoATP production rate and (b) percentage of oxidative phosphorylation were
  measured using Seahorse ATP rate kit (n=24–25, **** p<0.0001, one-way ANOVA with
  Tukey’s multiple comparisons test). (c) GlycoATP production rate and (d) percentage
  of glycolysis were also assessed using Seahorse ATP rate kit (n=24–25, **** p<0.0001,
  one-way ANOVA with Tukey’s multiple comparisons test). Glycolysis was further evaluated
  using Seahorse glycolysis stress kit. (e) ECAR levels were measured following glucose,
  oligomycin and 2-DG injection in Ifi27l2a-stimulated cells (n=12). (f)Glycolysis,
  (g)glycolytic capability, and (h)glycolytic reserve were increased in Ifi27l2a-stiumlated
  cells compared to vehicle-treated cells (n=10–12, *** p<0.001. One-way ANOVA with
  Dunnett’s multiple comparisons test). Primary microglia from WT brains and Het brains
  were seeded onto a Seahorse plate and treated with TNFα or rIfi27l2a for 48 hours.
  (i) Glycolysis was then assessed using Seahorse cell analysis (n=4–5, * p<0.05,
  ** p<0.01, *** p<0.005, **** p<0.0001. one-way ANOVA with Tukey’s multiple comparisons)
article_title: Ifi27l2a acts as a cytokine that promotes a pro-inflammatory phenotype
  in microglia and enhances neuroinflammation
