figure_title: Experimental verification of the relationship between ZNF649 and the
  Hedgehog signaling pathway, as well as their impact on 5-FU resistance in GCA.
caption: Experimental verification of the relationship between ZNF649 and the Hedgehog
  signaling pathway, as well as their impact on 5-FU resistance in GCA. (A) GSEA analyzed
  ZNF649-related signaling pathways. (B) WB detected the protein expression levels
  of ZNF649 and Hedgehog signaling pathway-related proteins SMO, GLI1, and Shh in
  cells from each treatment group. (C) CCK-8 assay measured cell viability in the
  three groups. (D) Flow cytometry detected the apoptosis rate of cells in each treatment
  group. Data are presented as mean + SD, and the differences are statistically significant
  (*p<0.05)
article_title: DNA-mediated ZNF649 downregulation modulates the Hedgehog signaling
