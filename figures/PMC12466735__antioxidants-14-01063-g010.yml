figure_title: CHE inhibits the liver oxidative stress and pro-inflammatory pathways.
caption: CHE inhibits the liver oxidative stress and pro-inflammatory pathways. (A)
  Western blot analysis of p-STAT3, p-ERK, p-JNK, p-p38, STAT3, ERK, JNK, p38, and
  β-actin protein expression. (B) DEGs of IL-17 signaling pathway, cytokine–cytokine
  receptor interaction pathway, and TNF signaling pathway were revealed in the enrichment
  analysis network. (C) In the APAP model, mouse inflammatory response and autoimmune
  PCR arrays showed significantly down-regulated expression of 14 transcripts between
  the normal and CHE groups. (D) Quantitative RT-PCR was used to verify the expression
  changes in Ccl2, Cxcl2, Cxcl5, TNF-a, and IL-17a. * p < 0.05, ** p < 0.01, and ***
  p < 0.001
