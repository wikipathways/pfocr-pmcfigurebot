figure_title: IFN-SPP1 axis orchestrates TME reprogramming in PARPi-resistant tumor
caption: (A and B) CellChat analysis of secreted ligand-receptor interactions. Word
  clouds depict enriched signaling pathways (A) and circle plots visualize the SPP1
  network (B) in nonresponder (NR) (n = 5) compared with responder (R) (n = 9) within
  niraparib posttreatment tumors. B, blood. (C and D) Differentially expressed genes
  in TAMs (C), and Venn diagram illustrating the top upregulated genes across various
  cell types (D) in NR (n = 5) compared with R (n = 9) within niraparib posttreatment
  tumors. (E) Representative immunofluorescent images with arrows indicating CD68+SPP1+
  cells (left). Quantification of indicated cell proportions between pre- and post-niraparib
  tumors in total (n = 19 pairs), response (n = 8 pairs) and nonresponse group (n
  = 11 pairs) using a paired t test (upper right), and between R and NR in posttreatment
  tumors (n = 26−27) using Wilcoxon rank-sum test (lower right). (F and G) IHC quantification
  of SPP1+ cells per field (×40 magnification; n = 5 mice/group) in niraparib treated
  Trp53−/−Brca1−/− ID8 (F) and Brca2−/− E0771 (G) mouse models. Statistical significance
  was determined by Wilcoxon rank-sum test. (H) Violin plots show PCF-derived, normalized
  IFN-γ protein level across indicated cells, compared among pretreatment (n = 25),
  post-niraparib R (n = 20), and post-niraparib NR (n = 18). (I) Correlation between
  CD68+SPP1+ cell proportion and normalized IFN-γ protein level in post-niraparib
  tumors (n = 19). Pearson correlation analysis. (J) IHC score of IFNβ and IFNα compared
  between pretreatment, post-niraparib R, and post-niraparib NR specimens, using the
  Wilcoxon rank-sum test with Benjamini-Hochberg correction. (K and L) Time-course
  quantification of SPP1 MFI (n = 4) following continuous IFN-γ (K) and IFN-β (L)
  treatment (10 ng/mL); solid lines represent continuous IFN dosing; dashed lines
  indicate SPP1 expression decay after IFN withdrawal. (M) SPP1 protein level in THP1
  cells after continuous IFN (10 ng/mL) treatment with or without STAT1 inhibitor
  (fludarabine 2 μg/mL) for the indicated time points. *P < 0.05, **P < 0.01, ***P
  < 0.001
