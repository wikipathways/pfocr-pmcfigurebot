figure_title: Differences in B cell–signaling qualities driven by TLR777 or TLR779
caption: Transcriptome analysis of bead-purified B cells from 5–7week-old Tlr7+/Y
  Tlr9–/– or Tlr779/Y Tlr9–/– male MRL/lpr mice that were stimulated with TLR7 agonist
  (CL097; 5 μg/ml) for 4 hours. (A) Number of differentially expressed genes (DEGs)
  identified using the limma R package (log2 FC > 0.5 and FDR-corrected P < 0.05),
  between stimulated versus unstimulated samples (first 2 columns) or between the
  2 genotypes, with or without stimulation (last 2 columns). (B) Upstream regulators
  that are predicted to be significantly activated upon CL097 stimulation by the IPA
  software in Tlr7+/Y (Y-axis) or Tlr779/Y (X-axis) B cells. XY plot shows the predicted
  z-score. (C) Bubble plot shows the top 15 reactome pathways enriched in Tlr779/Y
  (stim) (pink bubbles) and Tlr7+/Y (stim) (dark blue bubbles) regulated genes (from
  the Tlr779/Y (stim) vs Tlr7+/Y (stim) comparison). X-axis shows the –log10 FDR for
  the enriched terms displayed on Y-axis. Bubble size shows the genes in the pathway
  that are also differentially expressed in Tlr779/Y versus Tlr7+/Y. Enrichment was
  calculated using Fisher’s exact test (with all expressed genes as background) followed
  by Storey’s Q value FDR correction. (D) Volcano plot representing the DEGs between
  Tlr7+/Y and Tlr779/Y stimulated B cells. X-axis shows the log2 fold change value
  and Y-axis shows –log10 (FDR). The dotted lines separate the significant (FDR <
  0.05) and nonsignificant (FDR > 0.05) genes and indicate the log2FC –0.5 and 0.5
  cut-offs. The significant DEGs (log2 FC > 0.5, and FDR-corrected P value of < 0.05)
  were annotated based on the reported functions of their corresponding proteins in
  B cell activation (green dots), cell death (yellow dots), TLR-mediated inflammation
  (red dots), negative regulation of TLR-mediated inflammation and cell activation
  (blue dots), or if the genes were IFN-induced genes (pink dots)
