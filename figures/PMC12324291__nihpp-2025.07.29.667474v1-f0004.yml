figure_title: Candidate hopanoid transport pathways in proteobacteria
caption: (A) Schematic of the Mla phospholipid (PL) transport system from E. coli.
  The inner membrane transport complex MlaBDEF transports PLs to the periplasmic shuttle
  protein MlaC, which interacts with OmpF/C-associated lipoprotein MlaA in the outer
  membrane. (B) Candidate hopanoid transport pathways in diderm bacteria. In most
  proteobacteria (left), the inner membrane transporter HpnN may interact with the
  periplasmic shuttle HpnM to deliver hopanoids to the outer membrane lipoprotein
  HpnS. In the Rhizobiales order (right), hopanoids trafficked by HpnN are delivered
  to the periplasmic HpnT protein. (C) AlphaFold 3-predicted structures of the Burkholderia
  multivorans HpnSM dimer (top) and Bradyrhizobium diazoefficiens HpnT (bottom) in
  association with the hopanoid diploptene (grey)
