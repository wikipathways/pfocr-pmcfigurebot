figure_title: A schematic diagram of the mechanism by which chitosan and its bioactive
  degradation product NAG exert immunomodulatory and antitumor effects.
caption: A schematic diagram of the mechanism by which chitosan and its bioactive
  degradation product NAG exert immunomodulatory and antitumor effects. Chitosan and
  NAG induce HK2 dissociation from mitochondria by occupying the glucose binding site,
  destabilizing the HK2-VDAC complex and impairing mitochondrial integrity. This disruption
  drives ROS overproduction and mtDNA release, which synergistically activate the
  NLRP3 inflammasome to promote IL-1β secretion. Concurrently, cytosolic mtDNA engages
  the cGAS-STING pathway, creating cross-amplification with NLRP3 signaling, while
  cooperatively enhancing pro-inflammatory cytokine production. This dual activation
  network amplifies immune cell recruitment and effector functions, ultimately orchestrating
  the observed antitumor effects
article_title: Chitosan activates NLRP3 inflammasome and cGAS-STING to suppress cancer
  progression through hexokinase 2 dissociation and mitochondrial dysfunction
