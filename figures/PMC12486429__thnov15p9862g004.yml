figure_title: Non-targeted metabolomics profiling and mitochondrial functional alterations
  in ADSCs following CMS.
caption: 'Non-targeted metabolomics profiling and mitochondrial functional alterations
  in ADSCs following CMS. (A) OPLS-DA score plot of Static and CMS-preconditioned
  ADSCs (n=3 per group). (B-C) KEGG (Kyoto Encyclopedia of Genes and Genomes) pathway
  enrichment analysis of metabolites with significant changes. (D-E) Representative
  traces of OCR assay comparing ADSCs under CMS or ST (n = 5). (F) NAD⁺/NADH ratio,
  ATP, Lactate content in ST and CMS-ADSCs (n = 5). (G) Cultured ADSCs were labeled
  with MitoTracker Red and Hoechst 33342, and mitochondrial morphological changes
  were observed using confocal microscopy (Scale bar = 5 μm). (H) Quantitative analysis
  of the following mitochondrial parameters using ImageJ: mitochondrial number, shape
  factor [calculated as (Perimeter²)/(4π×Area)], and total mitochondrial area (n =
  10). (I) Western blot analysis of OPA1, PINK1, Parkin, LC3II and P62 protein levels
  in ADSCs under different treatments, with corresponding loading controls (n = 9).
  (Data are presented as mean ± standard deviation)'
