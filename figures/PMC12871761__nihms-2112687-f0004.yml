figure_title: 3-oxo-LCA enhances the stemness in Patient-derived cancer organoids
  (PDCOs)
caption: '(A) Schematic of human CRC PDCOs isolation from human patients, then subjected
  to 3-oxo-LCA, 6-oxo-LCA, and IsoalloLCA experiments.(B) PDCOs were treated with
  10μM of 3-oxo-LCA, 6-oxo-LCA, and IsoalloLCA with DMSO for 24 hours. Organoid viabilities
  were measured by Celltiter-glo-3D kit.(C-D) PDCOs were treated with 10μM of 3-oxo-LCA,
  6-oxo-LCA, and IsoalloLCA with DMSO for 3 days, Scale bar 20μm. The perimeter and
  area were quantified (C). Brightfield images were taken at day 0, 3 (D).(E) Co-immunostaining
  of ISCs marker LGR5 (green) and proliferation gene marker KI67 (red). PDCOs were
  treated with 10μM of 3-oxo-LCA, 6-oxo-LCA, and IsoalloLCA with DMSO for 3 days,
  Scale bar 20μm. KI67 positive cells and LGR5 mean fluorescence intensity (MFI) were
  quantified.(F-I) PDCOs were treated with 10μM of 3-oxo-LCA, 6-oxo-LCA, and IsoalloLCA
  for 24 hours. Relative expressions of FXR and its target genes (SHP, OSTα, OSTβ)
  (F), ISC signature genes (LGR5, OLFM4, ASCL2, and SOX9) (G), Wnt signaling pathway
  genes (CTNNB1, CCND1, and c-MET) (H), and Apoptosis signaling pathway genes (CASP8,
  BAK1, BCL2, CASP9, CASP3, CASP7) (I) measured by RT-qPCR.Experiments were independently
  replicated twice, and representative data are shown as the mean ± SEM. For two group
  comparation, Student’s unpaired t-test were applied. For more than two group comparation,
  one-way ANOVA or two-way ANOVA tests followed by multiple comparisons were applied.
  *p<0.05; **p<0.01; ***p<0.005; ns: not significant'
