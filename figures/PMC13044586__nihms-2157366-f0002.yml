figure_title: A schematic of purinergic receptors and key signaling in Tregs.
caption: 'A schematic of purinergic receptors and key signaling in Tregs. Purine receptors
  regulate Treg stability and function by modulating intracellular signaling. These
  receptors fall into three subfamilies: P1, P2X, and P2Y. P1 receptors are G protein-coupled
  receptors (GPCRs) with A1, A2A, A2B, and A3 subtypes. A1 and A3 signal via Gi, inhibiting
  adenylate cyclase (AC), reducing cyclic adenosine monophosphate (cAMP) levels. A2A
  and A2B signal via Gs, activating AC, increasing cAMP. A2B also engages Gq, activating
  phospholipase C (PLC) and increasing intracellular calcium (Ca2+), influencing protein
  kinase C (PKC) signaling. P2Y receptors are GPCRs with eight subtypes (P2Y1, P2Y2,
  P2Y4, P2Y6, P2Y11, P2Y12, P2RY13, and P2Y14), responsive to ATP, UTP, ADP, and UDP
  with varying potencies (Table 2). Most (P2Y1, P2Y2, P2Y4, P2Y6, and P2Y11) signal
  via Gq, activating PLC, increasing Ca2+, and simulating PKC. P2Y12, P2Y13, and P2Y14
  signal via Gi, inhibiting AC, reducing cAMP, and suppressing protein kinase A (PKA)
  signaling. P2Y11 can also act via Gs, activating AC and increasing cAMP. P2X receptors
  are ATP-gated ion channels permeable for Ca2+, Na+, and K+, contributing to Treg
  responses triggered by ATP binding. The symbolic icons are used to indicate the
  functional outcomes of signaling pathways: ☠ denotes associations with apoptosis
  and cellular stress (cell death),  indicates involvement in metabolic reprogramming,
  and ⚠ highlights pathways known to disrupt Foxp3 expression or Treg stability (Treg
  instability)'
