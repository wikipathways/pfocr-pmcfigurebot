figure_title: Diverse CD8+ T cell subset dynamics reflect patient-specific responses
  to GLP-2 analog therapy
caption: '(A) Uniform manifold approximation and projection (UMAP) visualization of
  CD8+ T cells identified using CD8A and CD8B markers. Data from 4 patients at 0 months
  (0M), 6M, and 12M include a total of 5,904 cells: case 1 (2,486 cells), case 2 (1,300
  cells), case 3 (1,472 cells), and case 5 (646 cells). Cells were clustered into
  13 groups, color-coded by metadata. (B) Expression patterns of key genes in CD8+
  T cell clusters. Each dot represents a gene, where color intensity indicates the
  scaled expression level in each cluster, and dot size represents the percentage
  of cells expressing the gene. (C) Cell distributions at 0M (1,744 cells), 6M (2,185
  cells), and 12M (1,975 cells). (D) Proportion of each cluster in CD8+ T cells at
  0M, 6M, and 12M. (E) Comparison of differentially expressed gene (DEG) sets related
  to Gene Ontology (GO) Biological Process (BP) across 0M, 6M, and 12M using compareCluster.
  Significantly enriched GO terms (y-axis) with P < 0.01 and q < 0.05 are visualized
  as dot plots. (F) Comparison of DEG sets related to biological pathways based on
  WikiPathways (WP) across 0M, 6M, and 12M using compareCluster. Significantly enriched
  pathways (y-axis) with P < 0.05 and q < 0.2 are visualized as dot plots. (E and
  F) Numbers below the column name represent the number of genes related to GOBP (E)
  or WP (F) for each cluster. Dot size represents the gene ratio (proportion of DEGs),
  and color indicates the adjusted P value. compareCluster analysis was performed
  using Over-Representation Analysis (ORA) based on a hypergeometric test. Multiple
  testing correction was applied using the Benjamini-Hochberg (BH) method to control
  the false discovery rate (FDR) (E and F)'
