figure_title: Differential gene expression and gene enrichment analysis of TEX-based
  clusters in patients with lung adenocarcinoma.
caption: Differential gene expression and gene enrichment analysis of TEX-based clusters
  in patients with lung adenocarcinoma. (A) Heatmap of differentially expressed genes
  between TEX clusters, (B) Volcano plot displays the magnitude of gene expression
  changes (fold change) and the significance of changes (P-value). Functional enrichment
  analysis includes the KEGG pathway enrichment results (C) and GO term enrichment
  results (D) for differentially up- or downregulated genes between the two TEX clusters.
  TEX-C, T cell exhaustion cluster; GO, Gene Ontology; KEGG, Kyoto Encyclopedia of
  Genes and Genomes
