figure_title: Transcriptomic profiling of drug response-associated pathways in osteosarcoma.
caption: Transcriptomic profiling of drug response-associated pathways in osteosarcoma.
  (A) This panel presented the GO enrichment analysis of the differentially expressed
  genes (DEGs). It highlighted key biological processes, molecular functions, and
  cellular compartment associated with drug response in osteosarcoma. (B) REACTOME
  pathway enrichment analysis of DEGs. (C) Protein–protein interaction (PPI) network
  visualized using Cytoscape, where nodes are color-coded by fold-change levels (darker
  violet indicates higher fold-changes). (D) Hub genes obtained from the PPI network
  were identified using MCODE, showing the most significant module (MCODE score =
  11.42). (E) Functional enrichment and pathway analysis of the hub genes in panel
  (D) were visualized using ClueGO. (F) The second significant module identified by
  MCODE (MCODE score = 6.0). (G) Functional enrichment and pathway analysis of the
  hub genes in panel (F) were visualized using ClueGO
