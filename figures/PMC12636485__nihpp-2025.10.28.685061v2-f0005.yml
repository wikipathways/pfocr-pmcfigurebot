figure_title: Resolving ambiguity in assignments of spectral signals corresponding
  to distance constraints by using 3D spectra and CS-Rosetta modeling
caption: '(a) Magnetization transfer pathway in the 3D hNHH experiment used for obtaining
  distance constraints. (b) w2-w₃ and w₁-w₃ planes of the 3D hNHH peak at (118.2,
  8.84, 0.74) ppm. (c) Four assignment candidates for w₃@0.74 ppm (±0.1 ppm tolerance)
  mapped onto a 2D hCH spectrum. (d) Eight candidates for w2@8.84 ppm (±0.1 ppm tolerance)
  in a 2D hNH spectrum. (e) Combined filtering using w₁ (118.2 ppm) and w2@8.84 ppm
  dimensions uniquely identifies V76. (f) Distance validation for four assignment
  candidates at monomer B-monomer A interface, monomer B interior, and monomer B-monomer
  C interface within the CS-Rosetta-derived pentameric structure. (g) Distance distribution
  analysis: Only inter-monomer V76 HN - L32Hδ2 satisfies the 9.0-Å cutoff'
