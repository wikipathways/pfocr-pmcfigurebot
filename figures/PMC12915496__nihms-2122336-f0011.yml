figure_title: TGF-β1/Smad2 pathway contributes to the indirect interaction between
  TAMs and cancer cells.
caption: TGF-β1/Smad2 pathway contributes to the indirect interaction between TAMs
  and cancer cells. (A) The concentration of TGF-β1 was measured in the H-TAM supernatant
  collected from the transwell assay (Fig. 9D) using an ELISA assay. Data was quantified
  as the concentration of TGF-β1 normalized to the untreated cancer cell group set
  to 100 %. N = 3–4, *P ≤ 0.05. (B) HPCCs were exposed to the conditioned media from
  H-TAMs treated with 2 μM ticagrelor and/or 2 μM cemiplimab for 48 h. The proteins
  harvested from the HPCCs were used to perform a Western blot to detect the level
  of phosphorylated Smad2. Representative images are shown. (C) Data was quantified
  as the ratio of phosphorylated Smad2 to β-actin. N = 4–5, *P ≤ 0.05, **P ≤ 0.01
article_title: Co-treatment of ticagrelor and anti-PD-1 immunotherapy in tumor-associated
  macrophages reduces pancreatic cancer cell growth and migration through the TGF-β1/Smad2
  pathway
