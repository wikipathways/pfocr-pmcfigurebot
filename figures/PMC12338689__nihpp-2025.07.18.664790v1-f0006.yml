figure_title: SOX2 and FOXA1 reciprocally bind DNA sites and regulate proliferation
  in both adenocarcinoma and NEPC contexts
caption: A-D) Heatmaps of transcription factor binding in CWR-R1 and NCI-H660 cells.
  The vertical axis of each heatmap represents the top 1000 transcription factor binding
  sites by peak score in both adenocarcinoma and NEPC. E) Nested Venn diagram of the
  shared SOX2/FOXA1 candidate target genes (from Figures 3C and 4C) in both CWR-R1
  and NCI-H660. We find 130 potentially SOX2/FOXA1 co-regulated genes across cell
  lines. F-H) Gene Ontology (GO) pathway analyses for the unique and shared CWR-R1
  and NCI-H660 candidate SOX2/FOXA1 co-regulated genes. GO enrichment was performed
  using Enrichr
article_title: SOX2 utilizes FOXA1 as a heteromeric transcriptional partner to drive
