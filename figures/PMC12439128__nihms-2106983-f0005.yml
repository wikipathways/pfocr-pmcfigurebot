figure_title: Description of the excitatory neurons 1 (EN1) population in PTHS brains
caption: (A) A volcano plot representing the differential gene expression observed
  in the EN1 population is shown. The upregulated gene cutoff was log2fold change
  > 0.5 and Bonferroni adjusted p-value (p adj) < 0.05. The downregulated gene cutoff
  was log2fold change < −0.5 and p adj < 0.05. (B) Network/pathway analysis of the
  DEGs identified by comparing the expression profiles of Cre+ and Cre− EN1 clusters.
  (C) Box plots showing the most differentially regulated genes identified in the
  EN1 population. Blue boxes represent Cre− cells, and orange boxes represent Cre+
  cells. Statistical analysis was done using R-suit. ****p< 0.0001. (D) UMAP plots
  of the EN1 cells of Cre− (left) and Cre+ (right) mice are shown. Each set of data
  includes both male and female mice. Thirteen subclusters were identified. The red
  rectangle indicates the unique population present in Cre+ cells. (E) Heatmap showing
  the top five differentially expressed genes identified after comparing the expression
  profiles of the Cre+ and Cre− EN1 subclusters. Each row indicates a gene, and each
  column belongs to a cell within a subcluster. The subcluster IDs are color coded
  at the top of the heatmap. The red rectangle highlights the subcluster in which
  a new population of cells was found. (F) Network/pathway analysis of the DEGs identified
  by comparing the expression profiles of the cells in Cre+ and Cre− EN1 subcluster
  7. Enlarged Figure 5B, E, and F are shown in Supplemental Figure 10
