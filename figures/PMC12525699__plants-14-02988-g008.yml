caption: 'Analysis of the metabolic regulation pathways of flavonoids in maize radicles
  under different treatment conditions. (a) Trends in changes in related metabolites
  in maize radicles of different genotypes under TS. The gray dashed box indicates
  phenylpropanoid biosynthesis, the orange dashed box indicates flavonoid biosynthesis,
  the green dashed box indicates isoflavonoid biosynthesis, and the blue dashed box
  indicates flavone and flavonol biosynthesis. Red to green indicates DAM content
  from high to low; (b) transcriptional changes in genes related to flavonoid compound
  metabolism in maize radicles of different genotypes under TS. Red to blue indicates
  DEG expression from high to low. PAL: phenylalanine ammonia-lyase; C4H: trans-cinnamate
  4-monooxygenase; 4CL: 4-coumarate-CoA ligase; C3′H: 5-O-(4-coumaroyl)-D-quinate
  3′-monooxygenase; CHS: chalcone synthase; CHI: chalcone isomerase; F3H: naringenin
  3-dioxygenase; FLS: flavonol synthase; DFR: bifunctional flavanone 4-reductase;
  ZCT: control treatment of ZD958; ZTS: TS treatment of ZD958; DCT: control treatment
  of DMY1; DTS: TS treatment of DMY1'
