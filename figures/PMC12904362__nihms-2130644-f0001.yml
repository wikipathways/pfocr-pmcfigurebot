figure_title: Lineage Features of Cancer Development
caption: 'Tumor lineage characteristics reflect three intrinsic properties of its
  tissue-of-origin: (1) preferential selection of oncogenic drivers, leading to their
  non-uniform distribution across tumor types; (2) dependence on lineage-restricted
  signaling pathways essential for the corresponding normal tissue; and (3) persistence
  of specialized functions established during embryonic development that remain critical
  for tumor maintenance and survival'
