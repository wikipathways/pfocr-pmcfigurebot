figure_title: Development and validation of a STING1 signaling-related prognostic
  signature for PAAD.
caption: 'Development and validation of a STING1 signaling-related prognostic signature
  for PAAD. (A) Univariate Cox regression analysis of STING1 pathway-related genes
  in PAAD. Genes with significant prognostic value (P<0.05) are included. (B) LASSO
  regression 10-fold cross-validation curve showing optimal λ selection (minimum criteria).
  (C) LASSO coefficient profiles of STING1-related genes across log(λ) sequence. (D)
  Kaplan-Meier survival analysis for the prognostic signature in TCGA-PAAD cohort
  (high-risk vs. low-risk groups; cutoff: median risk score). (E) Validation of prognostic
  signature in GSE224564 cohort. (F) Risk score distribution plot with corresponding
  survival status and expression heatmap for 6 signature genes in TCGA-PAAD. (G) Validation
  in GSE224564 cohort showing identical configuration to (F). STING, stimulator of
  interferon genes; PAAD, pancreatic ductal adenocarcinoma; LASSO, least absolute
  shrinkage and selection operator; TCGA, The Cancer Genome Atlas; MAVS, mitochondrial
  antiviral-signaling protein; IFI16, interferon γ inducible protein 16; IFIT2, interferon-induced
  protein with tetratricopeptide repeats 2; DTX4, deltex E3 ubiquitin ligase 4; ZDHHC1,
  zinc finger DHHC-type containing 1; PRKDC, protein kinase DNA-activated catalytic
  subunit; STAT6, signal transducer and activator of transcription 6; XRCC5, X-ray
  repair cross complementing: ELF4, E74-like ETS transcription factor 4; DDX58, RNA
  sensor RIG-I'
