caption: 'The schematic diagram illustrates the molecular mechanism through which
  MG suppresses IL-6 production in cardiac fibroblasts (CFs): in the isoproterenol
  (ISO)-induced CFs transdifferentiation model, MG-EWE and its active components Laurolitsine
  and Hecogenin can inhibit the abnormal activation of the ADRB2/JNK/c-Jun signaling
  pathway. When ISO binds to the ADRB2 receptor on the cell membrane surface of CFs,
  it initiates a downstream signaling cascade. Activation of this receptor leads to
  the phosphorylation of key signaling molecules, including JNK1/2/3 and c-Jun, thereby
  activating the JNK/c-Jun signaling pathway. The activated JNK1/2/3 translocates
  from the cytoplasm to the nucleus and further phosphorylates the transcription factor
  c-Jun within the nucleus, enhancing its transcriptional activity. This ultimately
  promotes the transcription of the IL-6 gene and increases its protein expression.
  Laurolitsine functions by inhibiting the activation of ADRB2 on the CFs cell membrane
  surface, while Hecogenin inhibits the phosphorylation of JNK, thereby blocking the
  subsequent phosphorylation of c-Jun. Together, these actions result in the joint
  inhibition of IL-6 production'
