figure_title: Calpain-mediated mechanisms underlying chronic spasticity and neuropathic
  pain after spinal cord injury (SCI).
caption: 'Calpain-mediated mechanisms underlying chronic spasticity and neuropathic
  pain after spinal cord injury (SCI). (A) In motoneurons below a chronic SCI, sustained
  calpain-1 activation, triggered by increased intracellular calcium, cleaves the
  inactivation gate of voltage-gated sodium (Nav) channels, resulting in persistent
  sodium currents (INaP) and bistable firing. Calpain-1 also mediates the proteolytic
  cleavage of the potassium-chloride cotransporter KCC2, which leads to chloride homeostasis
  disruption and a reduction in inhibitory synaptic transmission. Finally, calpain-1
  cleaves its own endogenous inhibitor, calpastatin, thus further increasing calpain
  activity. This cascade of events leads to motoneuron hyperexcitability, exaggerated
  reflex activity and spasticity. (B) In the dorsal horn, injury-induced microglial
  activation releases BDNF which activates TrkB signaling and upregulates calpain-1/2,
  further promoting KCC2 cleavage and the release pro-inflammatory cytokines (TNF-α,
  IL-6). This disrupts the chloride gradient, resulting in disinhibition and central
  sensitization, a key component of chronic neuropathic pain. Symbols: black arrows
  = signaling flow; black line ending with a filled circle = inhibition; scissors
  = proteolysis; “?” = hypothetical pathway'
