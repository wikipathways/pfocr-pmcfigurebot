figure_title: HER3 and HER2 are key mediators of ASPN-induced signaling
caption: (A and B) LNCaP HER3 targeted wild-type (TWT) and LNCaP HER3 truncated knockdown
  (TKD) were treated with 100 ng/mL recombinant human ASPN over a time course and
  assessed by immunoblotting for HER2 and HER3 pathway activation (A) and quantification
  (B) (n = 3). (C and D) LNCaP HER2 TWT and LNCaP HER2-KO, without elevated baseline
  HER3, were treated with 100 ng/mL recombinant human ASPN over a time course and
  assessed by immunoblotting for HER2 and HER3 pathway activation (C) and quantification
  (D) (n = 3). Graphs are shown as mean ± SEM and analyzed by 1-way ANOVA with Šídák’s
  post hoc analysis; *P ≤ 0.05, **P ≤ 0.01, ***P ≤ 0.001, ****P ≤ 0.0001
article_title: Identification of asporin as a HER3 ligand exposes a therapeutic vulnerability
