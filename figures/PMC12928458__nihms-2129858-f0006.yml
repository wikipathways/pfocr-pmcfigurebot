figure_title: Gene Set Enrichment Analysis (GSEA) of proteomic dataset demonstrates
  that Hyperoxia downregulates oxidative phosphorylation and upregulates glucose metabolism
  in developing airway epithelial cells
caption: (A) GSEA of DIA proteomic data reveals significant downregulation of proteins
  involved in the Reactome respiratory electron transport pathway in hyperoxia-exposed
  nTAECs on ALI day 14 (Normalized Enrichment Score [NES] = –3.32, FDR q-value < 0.001).
  Heatmap shows expression of proteins in the Reactome respiratory electron transport
  gene set. Asterisks denote core enriched proteins contributing most to the enrichment
  score. (B) GSEA analysis identifies significant upregulation of the Reactome glucose
  metabolism pathway in response to hyperoxia (NES = 2.33, FDR q-value = 0.028). Heatmap
  displays protein expression across donor samples for this gene set, with core enriched
  proteins marked by asterisks
