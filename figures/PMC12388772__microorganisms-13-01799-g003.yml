figure_title: Molecular pathways of ammonium assimilation in bacteria.
caption: Molecular pathways of ammonium assimilation in bacteria. Ammonium (NH4+)
  is assimilated into glutamate via two main enzymatic pathways. The GDH (glutamate
  dehydrogenase) pathway catalyzes the reductive amination of 2-oxoglutarate to produce
  glutamate using NADPH. This route predominates under high ammonium availability
  and low energy/carbon conditions. Alternatively, the GS-GOGAT (glutamine synthetase–glutamate
  synthase) pathway is the primary mechanism under low ammonium concentrations. It
  involves the ATP-dependent conversion of glutamate into glutamine by GS, followed
  by the transfer of the amide group from glutamine to 2-oxoglutarate by GOGAT, forming
  two molecules of glutamate. This pathway provides a higher affinity for ammonium
  and is more energy-intensive, contributing significantly to nitrogen assimilation
  under nutrient-limited conditions
