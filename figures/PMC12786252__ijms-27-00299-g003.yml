figure_title: Ethanol-induced Ca2+ dysregulation and mitochondrial dysfunction.
caption: Ethanol-induced Ca2+ dysregulation and mitochondrial dysfunction. The schematic
  illustrates how ethanol disrupts neuronal Ca2+ homeostasis and promotes mitochondrial
  injury. Ethanol exposure leads to ↑ intracellular Ca2+, in part through enhanced
  activation of NMDA/AMPA glutamate receptors, opening of voltage-gated calcium channels
  (VGCCs) and release of Ca2+ from endoplasmic reticulum stores. Elevated Ca2+ activates
  Ca2+-dependent signalling pathways, including CaMKII and PKC, and promotes Drp1-mediated
  mitochondrial fission. Mitochondrial Ca2+ overload results in loss of mitochondrial
  membrane potential (ΔΨm), increased generation of ROS, cytochrome c release and
  activation of the NLRP3 inflammasome, culminating in neuronal apoptosis. Together,
  these processes link ethanol-induced Ca2+ dysregulation with mitochondrial dysfunction
  and inflammatory cell death. Created by the authors in Adobe Illustrator version
  27.5, 2023 (created on 30 October 2025)
