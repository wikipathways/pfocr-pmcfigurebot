figure_title: The ligand-targeted CSF1R-CAR minimally activates the TCR signaling
  pathway in Jurkat cells
caption: '(A) Volcano plot analysis of the phosphotyrosine (pY) sites, as identified
  by LC-MS/MS, in CD19-CAR T cells after co-culture with Raji cells for the indicated
  times. Data are from four biological replicates. (B) Volcano plot analysis of the
  pY sites in CSF1R-CAR T cells after co-culture with THP-1 cells for the indicated
  times. Data are from four biological replicates. (C) Left: Western blotting analysis
  of pY-containing proteins (4G10-positive) in proteomics samples from the indicated
  cell co-cultures. Right: Quantification of the fold-change in the pY-containing
  proteins in the indicated cell co-cultures after normalization to GAPDH abundance.
  Data are from four biological replicates; blue shades indicating CD19-CAR and pink
  shades indicating CSF1R-CAR timepoints. (D and E) Western blotting analysis (left)
  and relative quantification (right), as described for (C), of PLCγ1 Tyr783 (D) and
  LAT Tyr220 (E) in the indicated cell co-cultures. LAT Tyr220 abundance was normalized
  to that of PLCγ1 because of the low LAT protein signal. Data are from four biological
  replicates. Statistical significance was determined by two-way ANOVA with Fisher’s
  least significant difference and the Holm-Sidak correction for multiple comparisons.
  *P < 0.05, **P < 0.01, ***P < 0.001. (F and G) Heatmaps showing quantification of
  the indicated individual phosphorylation sites observed in CD19-CAR T cells after
  co-culture with Raji cells (F) and in CSF1R-CAR T cells after co-culture with THP-1
  cells (G) for the indicated times. Data are from four biological replicates. (H
  and I) PTM-SEA showing enrichment of CD19-CAR T cell PTM sites in NetPath Pathways
  (H) and in the PhosphoSitePlus Kinase Signatures database (I). Data are from four
  biological replicates. (J and K) PTM-SEA showing enrichment of CSF1R-CAR T cell
  PTM sites in NetPath Pathways (H) and in the PhosphoSitePlus Kinase Signatures database
  (I). Data are from four biological replicates'
