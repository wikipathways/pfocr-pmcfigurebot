figure_title: HBT inhibits the TGF-β/Smad3 pathway and expression of fibrotic proteins
  induced by TGF-β.
caption: 'HBT inhibits the TGF-β/Smad3 pathway and expression of fibrotic proteins
  induced by TGF-β. (A) Western blot analysis was used to detect the phosphorylation
  of Smad3 in A549 cells. HBT was added to the cells 6 h prior to stimulation with
  TGF-β (5 ng/mL) for 1 h. (B) Western blot analysis was also employed to assess the
  nuclear translocation of Smad3 in A549 cells. After incubating with HBT for 6 h,
  cells were stimulated with TGF-β (5 ng/mL) for 2 h, followed by collection for nuclear
  and cytoplasmic extraction experiments. (C) Western blot was used to evaluate the
  expression levels of Fn and Snail proteins in A549 cells. Six hours after adding
  HBT, TGF-β (10 ng/mL) was added, and cells were stimulated for 24 h. ###, p < 0.005;
  Versus Mock and **, p < 0.01; ***, p < 0.005; Versus TGF-β+DMSO'
