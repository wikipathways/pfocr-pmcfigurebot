figure_title: Analysis of cell-type specificity of neuronal PFC SCZ OCRs in fetal
  cortical scATAC-seq data
caption: a, A UMAP plot of fetal cortical scATAC-seq data27 colored by z-scores of
  SCZ OCRs from neuronal PFC TRD6. The cell types include early/late radial glia (EarlyRG,
  LateRG), oligodendrocyte/OPC (Oligo/OPC), intermediate progenitors (nIPC, oIPC),
  glutamatergic (GluN) and inhibitory (IN) neurons, endothelial cells (EC), microglia
  (MG) and pericytes (Peric). b,c, The distribution of enrichment scores for SCZ OCRs
  from TRD6 across nine excitatory (b) and five inhibitory (c) neuronal subtypes split
  by developmental stage (pcw16–pcw24). The colors indicate coefficients from the
  mixed model. The asterisks denote subtypes that are significantly enriched and have
  stronger enrichment than OCRs outside TRDs. d, A functional pathway analysis conducted
  on the early and late fetal glutamatergic specific marker genes that are also annotated
  by SCZ OCRs in TRD6. For each pathway, statistical significance was assessed using
  a two-sided Fisher’s exact test and Reg. in pathways denote regulation. e, A heat
  map of MAGMA enrichment P values for brain-related and nonbrain-related GWAS traits.
  MAGMA gene-set analysis was performed using a two-sided regression test, and the
  P values show the association between SCZ OCR-annotated genes and each trait. f,
  The coefficients of enrichment of common SCZ risk variants using MAGMA in fetal-cell-specific
  marker genes that are also annotated to SCZ OCRs within neuronal PFC TRD6. The x
  axes in e and f are (1) early fetal (pcw16 + pcw20) glutamatergic (GluN1,3,5,8)
  (magenta), (2) late fetal (pcw21 + pcw24) glutamatergic (GluN6,9) (blue), (3) early
  + late fetal (pcw16 + pcw20 + pcw21 + pcw24) interneuron (IN4) (magenta + blue),
  (4) late fetal (pcw21 + pcw24) interneuron (IN3,5) fetal cell types (blue) and all
  ABC mapped SCZ OCRs to genes within neuronal PFC TRD6 (black). The pound symbol
  (#) signifies the MAGMA enrichment coefficient after FDR correction of multiple
  testing across all tests in the plot (Benjamini–Hochberg test). The asterisk is
  nominally significant for enrichment in e and f. The error bars in f represent the
  standard error in the enrichment coefficient from MAGMA for SCZ, and all P values
  are two-sided
