figure_title: Metabolomic profiling of iad pathway mutants reveals substrates and
  products of genes involved in IAA degradation in V. paradoxus CL014
caption: a, Genomic organization of Hot Spot 33 in V. paradoxus CL014. Gene annotations
  are shown above as the final two digits of the IMG gene ID (26436136##) and below
  with assigned gene names. The MarR-family transcriptional regulator marR73 is shown
  in red; the core nine-gene IAA degradation locus is highlighted in yellow. b, Heatmap
  of Log2 fold changes in metabolite abundance in iad pathway mutants relative to
  the wild type. Full LC–MS profiles are provided in Extended Data Fig. 2. Data represent
  the mean of n = 3 biological replicates. c–j, Bar plots showing the relative abundance
  of anthranilic acid (c), IAA (d), and key metabolic intermediates (e–j) across wild-type
  and mutant strains. Data represent mean ± s.e.m. (standard error of the mean) of
  n = 3 biological replicates. k, Schematic representation of the iad-mediated IAA
  degradation pathway in V. paradoxus CL014
