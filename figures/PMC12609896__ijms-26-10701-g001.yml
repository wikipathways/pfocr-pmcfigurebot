figure_title: Schematic representation of the liver lobule and metabolic liver zonation.
caption: 'Schematic representation of the liver lobule and metabolic liver zonation.
  The liver is divided into different lobes (right, left, caudate and quadrate lobes),
  organized in honeycomb-like structures arranged in heterogeneous size and axial
  orientation, named lobules. The lobules depict the smallest anatomical units with
  a hexagonal shape with a central vein (CV) in the center and portal triads composed
  of a portal vein (PV), a hepatic artery (HP) and a bile duct (BD), at the periphery.
  Within lobules, the hepatocytes (HEPs) are interconnected as cords that radiate
  out from CV towards PV, thus resulting in two intertwined radial networks: the sinusoids
  for blood flow (red arrow) and the bile canaliculi for bile secretion (green arrow).
  The region surrounding the portal triads is called periportal (PP, zone 1), the
  one adjacent to the CV is known as pericentral (PC, zone 3), and the area in between
  is referred to as midlobular (zone 2) (upper panel). Hepatic parenchymal cells,
  namely hepatocytes, radiate out from CV towards PV. The sinusoids are surrounded
  by sinusoidal endothelial cells and are populated by the hepatic macrophages known
  as Kupffers. Moreover, the space between the endothelial cells and HEPs provides
  a niche for hepatic stellate cells (HSCs). Hepatocytes manage the availability of
  nutrients and hormones, generating a flow of bile, blood and oxygen across the PP
  and PC areas. In turn, this gradient contributes to specialized HEPs in distinct
  metabolic pathways, resulting in a phenomenon defined as zonation. Gluconeogenesis,
  cholesterol synthesis, fatty acid and amino acid metabolism, oxidative phosphorylation,
  urea formation and drug metabolism are preferentially located in the PP zone, which
  receives blood richer in oxygen and nutrients, while glycolysis, bile acid synthesis,
  xenobiotic metabolism, glutamine synthesis, glucose uptake, lipogenesis and ketogenesis
  are mainly distributed in the PC zone. Metabolic hepatic zonation may be affected
  by several pathways: Wnt/β-catenin-HIF-Rspo signaling is mainly located in the PC
  zone, whereas APC, its negative regulator, is in the PP one; Hedgehog (Hh) pathway
  is higher in the PP region together with Ras-dependent signaling; HIPPO pathway
  is mainly activated in PP following oxygen gradient whereas YAP is located in PC
  (lower panel)'
