figure_title: Schematic overview of the CRISPR/Cas9 technology.
caption: Schematic overview of the CRISPR/Cas9 technology. The CRISPR/Cas9 complex
  mediates a double-strand break (DSB), which can be repaired via non-homologous end-joining
  (NHEJ) or homology-directed repair (HDR). (A) The NHEJ can facilitate gene silencing
  via the production of deletions (indicated as dotted lines) and insertions (indicated
  in blue) (indels) or precise gene correction via utilization of homology-independent
  targeted integration (HITI). The donor template (indicated in pink) is flanked by
  Cas9 cleavage sites (indicated with scissors). (B) Repair via the HDR pathway facilitates
  precise gene correction in the presence of a donor template with homology arms (HA)
