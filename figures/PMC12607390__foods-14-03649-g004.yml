figure_title: The balance between saccharolytic and proteolytic fermentation as influenced
  by the ratio of carbohydrates to protein, and its impact on gut health and disease
  progression.
caption: The balance between saccharolytic and proteolytic fermentation as influenced
  by the ratio of carbohydrates to protein, and its impact on gut health and disease
  progression. A high proportion of carbohydrates helps regulate the fermentation
  of protein and butyrate, thus exerting a beneficial influence on intestinal health,
  including increasing the expression of antimicrobial peptides and mucins, inhibiting
  the growth of harmful bacteria, and reducing the expression of pro-inflammatory
  factors. In contrast, high protein intake is dominated by protein fermentation,
  which produces harmful metabolites, such as BCFA. Elevated BCFA levels are associated
  with diseases such as obesity, diabetes, and Alzheimer’s disease. The catabolic
  intermediate of valine, 3-HIB, promotes the accumulation of lipids in muscle, thereby
  triggering insulin resistance. Furthermore, elevated BCFA concentrations have been
  linked to reduced glycine levels, with this alteration exhibiting a positive correlation
  with insulin resistance. High levels of BCFA can also stimulate the mTOR signaling
  pathway, which can subsequently induce oxidative stress and inflammatory responses.
  Furthermore, it can also lead to impaired hypothalamic insulin signaling, and exacerbate
  the hyperphosphorylation of Tau in Alzheimer’s disease (AD) patients. Antimicrobial
  peptide (AMP); Secretory immunoglobulin A (SIgA); 3-hydroxyisobutyric acid (3-HIB);
  microtubule-associated protein Tau (Tau)
