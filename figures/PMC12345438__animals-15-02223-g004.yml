caption: Effects of SI supplementation on antioxidant-related proteins in the jejunum
  of piglets. (A) Western blotting results for the Nrf2 antioxidant pathway in the
  jejunum. (B–G) Expression of the Nrf2 antioxidant pathway in the jejunum (Nrf2,
  ACSL4K, XCT, HO-1, NQO1, and GPX4). (H) Immunofluorescence analysis of GPX4 (green)
  and DAPI (blue) nuclear staining in the jejunum. (I) Immunofluorescence analysis
  of Nrf2 (green) and DAPI (blue) nuclear staining in the jejunum. Con—control; SI—soy
  isoflavone. Data are presented as mean ± standard error (n = 3). Different letters
  indicate statistically significant differences
