figure_title: Immunostimulatory therapy.
caption: 'Immunostimulatory therapy. IFN-γ increases mHLA-DR expression on monocytes;
  GM-CSF increases mHLA-DR expression on monocytes and promotes the maturation of
  both monocytes and neutrophils; IFN-β reactivates the IFN-I pathway, promotes monocyte
  maturation, and restores the production of TNF and IL-6; IL-4 promotes immune cells,
  increases the immunoreactivity of monocytes, and shifts the metabolic mode of anergic
  immune cells from glycolysis to oxidative phosphorylation; IL-7 inhibits T cell
  apoptosis and promotes T cell proliferation and functional recovery; IL-15 stimulates
  the proliferation and activation of CD8+ T cells, NK cells, and DCs and promotes
  IFN-γ secretion by NK cells; and immune checkpoint blockade therapy uses monoclonal
  antibodies to block TIM-3, and the PD-1/PD-L1 pathway can stimulate T cell proliferation,
  restore T cell function and inhibit their apoptosis. Other agents and mechanisms:
  BMP9 activates monocyte function and enhances the ability of monocytes to combat
  bacteria; thymosin-α1 stimulates TLR2 and TLR9, enhances the antigen-presenting
  capacity of DCs, promotes the production of IL-2, IL-12, IFN-γ, and IFN-α by immune
  cells, and increases mHLA-DR expression; PTH restores osteoblast function, thereby
  increasing IL-7 production and promoting T cell proliferation and function; Citrulline
  is metabolized in the kidneys to produce arginine, which improves mitochondrial
  function in T cells, enhances T cell responsiveness, and simultaneously inhibits
  the proliferation of immunosuppressive cells. IFN-β, interferon-β; IFN-I, interferons;
  IL, interleukin; GM-CSF, granulocyte–macrophage colony-stimulating factor; TIM-3,
  T cell immunoglobulin and mucin domain-3; PD-1, programmed death-1; PD-L1, programmed
  death ligand-1; BMP9, bone morphogenetic protein 9; thymosin-α1, thymosin-alpha-1;
  PTH, parathyroid hormone; mHLA-DR, monocytic human leukocyte antigen-DR isotype;
  TNF-α, tumor necrosis factor-α; TLR, Toll-like receptor; MHC, major histocompatibility
  complex. Green arrows denote cytokine therapies and their respective target cells,
  signifying a promotional effect. Pink arrows represent other classes of immunostimulatory
  therapies and their targets, similarly signifying promotion. Blue arrows signify
  the promotion of target cell proliferation and functional recovery via immune checkpoint
  blockade. Black arrows indicate the consequent functional alterations in immune
  cells upon targeting by immunostimulatory therapies, with an upward direction denoting
  improvement'
