figure_title: VS-4718 induces AQP2 membrane accumulation without phosphorylation at
  serine 256
caption: A. Membrane accumulation of AQP2 is induced by VS-4718 in cells expressing
  either WT-AQP2 or the S256A phosphorylation mutant. In contrast, LVP induces membrane
  accumulation only in cells expressing WT-AQP2, as expected. Methyl-β-cyclodextrin
  (MβCD) is a positive control to block endocytosis, resulting in AQP2 membrane accumulation
  in both WT and S256A-expressing cells; scale bar=10 μm. B. Western Blot of total
  (t)AQP2 and pS256 indicates that VS-4718 does not induce AQP2 trafficking through
  the canonical, VP-dependent pathway because no significant increase in the phospho-S256
  signal was detectable, in contrast to LVP treatment in 4 independent experiments
  run in parallel on the same gel. After detecting p256AQP2 with specific anti p256AQP2
  antibody, membranes were stripped and reblotted with tAQP2 antibody C. Bar graph
  represents ratio of p256 AQP2 and tAQP2 band intensities of 4 independent experiments
  (mean ± SE, n=4, p<0.001). The tAQP2 levels were variable among different experiments
  but results using the ratio method of analysis showed a consistent effect of LVP
  and no effect of VS-4718 on AQP2 phosphorylation
article_title: Focal Adhesion Kinase (FAK) inhibition induces membrane accumulation
  of aquaporin-2 (AQP2) in renal epithelial cells by actin depolymerization and endocytosis
