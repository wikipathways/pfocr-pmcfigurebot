figure_title: Estimated patient cohort sizes required to detect enriched pathways
caption: 'It illustrates the minimum number of patients needed to detect differential
  pathway expression based on the fold change in predicted mean log2(expression) relative
  to log2(TPM) in healthy controls. Three reference points are as follows: a fold
  change of 3.45 requires one patient; 2.97 requires two patients; and 2.70 requires
  three patients. For example, CRPC-AR (TCGA_ANDROGEN_RESPONSE), CRPC-NE (BELTRAN_NEPC_UP),
  and Luminal A (SMID_BREAST_CANCER_LUMINAL_A_UP) pathways showed fold changes of
  2.83, 5.08, and 3.35, respectively—requiring a minimum of three, one, and two patients
  for detection'
