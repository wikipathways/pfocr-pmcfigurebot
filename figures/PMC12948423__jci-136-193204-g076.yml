figure_title: Transcriptome profile of FNDC4-dependent neurogenesis
caption: (A) UMAP visualization inferring the order of cells along neurodevelopmental
  trajectories. Transcriptomic data for all single nuclei (n = 103,263) were included
  in the analysis. Each cell/(dot) was assigned a pseudo-time value (color-coded)
  that represents which stage the cell is in along neurodevelopmental trajectories.
  Cells at later stages of neurodevelopment (higher pseudo-time value) are colored
  yellow. Trajectories for neurodevelopment are depicted as red lines. Branch spots
  leading to different neuronal subtypes are circled in green. (B) Single-cell trajectory
  analysis using single-nuclei transcriptomics of forebrain organoids differentiated
  from the WT, FNDC4-KO#2, and FNDC4-KO#5 iPSC lines. Random downsampling was performed
  to ensure that the same number of cells (n = 14,610) from WT and KO organoids was
  included for comparison. Single nuclei of organoids differentiated from the same
  iPSC lines at 2 time points (days 45 and 90) were combined to increase diversity
  (in developmental stages) and number of single cells for trajectory analysis. The
  branch point in the trajectories leading to different neuronal subtypes (circled
  in green) was observed in KO but not in WT organoids. (C) UMAP visualization of
  the same single nuclei as in B with cell types color-coded. The branch point observed
  in KO was overlapped with a cluster of UnK cells. (D and E) Volcano plots for DEGs
  in UnK cells when comparing KO to WT organoids. (F) Venn diagram showing 221 common
  DEGs in UnK cells that were identified in organoids differentiated from both KO
  iPSC lines. (G and H) Top terms enriched by 221 DEGs in UnK cells after FNDC4 KO
  in the GO Biological Process (G) and GWAS catalog (H) phenotype/trait enrichment
  analyses. The FDR for pathway enrichment was computed from Fisher’s exact test and
  adjusted using the Benjamini-Hochberg method for the correction for multiple hypotheses
  testing
