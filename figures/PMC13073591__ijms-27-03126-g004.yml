caption: Integrated regulatory module of microRNAs (miRNAs), messenger RNAs (mRNAs),
  and transcription factors (TFs). (A) Complete regulatory module showing interactions
  among differentially expressed miRNAs (blue squares), their target genes (purple
  circles), and enriched transcription factors (yellow circles). The network was constructed
  using miRNet 2.0 based on the GSE34120 dataset and KEGG enrichment of the neurotrophin
  signaling pathway. (B) Simplified subnetwork highlighting transcription factors
  (green circles), differentially expressed genes (yellow circles), and regulatory
  miRNAs (blue squares) in the context of depression. Node size represents degree
  centrality (number of connections). Edges represent experimentally validated regulatory
  interactions and are unweighted
article_title: Integrative In Silico Analysis of miRNA–mRNA Regulatory Networks in
