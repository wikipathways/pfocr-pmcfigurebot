figure_title: Enteric infection with P.e. induces lipid accumulation in the Drosophila
  midgut and modulates host survival
caption: (A, B) Nile Red staining (A) and intensity quantification (B) of neutral
  lipids in the posterior midgut (genotype; OreR) during mock treatment or P.e. infection
  (20 hours after inoculation/initial feeding; n = 10 samples). Lipid droplet (Nile
  Red, red), and nuclei (DAPI, blue). (C, D) Bodipy493/503 staining (C) and intensity
  quantification (D) of neutral lipids in the posterior midgut (OreR) during mock
  treatment or P.e. infection (n = 10 samples). Lipid droplet (Bodipy 493/503, green),
  and nuclei (DAPI, blue). (E) RNA-seq heatmap showing lipid metabolic-related gene
  expression in midguts during P.e. infection (compared to mock treatment; genotype
  – NP1Gal4>UAS-Lucif.RNAi). (F) Simplified lipid metabolic pathway highlighting manipulated
  enzymes. (G, H) Nile Red staining (G) and intensity quantification (H) of neutral
  lipids in posterior midgut from flies with EC-specific (NP1Gal4) attenuation of
  Lipin or Bmm during P.e. infection (n = 7 samples). Lipid droplet (Nile Red, red),
  and nuclei (DAPI, blue). (I) Bodipy493/503 staining showing reduced lipid accumulation
  in NP1Gal4>UAS-LipinRNAi posterior midgut during infection. Lipid droplet (Bodipy
  493/503, green), and nuclei (DAPI, blue). (J) Survival curves post-infection following
  EC-specific attenuation of lipid synthesis genes (NP1Gal4>UAS-LipinRNAi or UAS-MdyRNAi)
  compared to controls (NP1Gal4>UAS-Lucif.RNAi). n = 200 flies per genotype. (K) Survival
  curves post-infection following genetic manipulation of Bmm in ECs (NP1Gal4>UAS-Bmm
  or UAS-BmmRNAi) vs. control (NP1Gal4>UAS-Lucif.RNAi). n = 200 flies per genotype.
  (L) Survival curves post-infection following genetic manipulation of lipid transportation
  genes in ECs (NP1Gal4>UAS-ApoLpp or UAS-Lpr2RNAi) compared to controls (NP1Gal4>UAS-Lucif.RNAi).
  n = 200 flies per genotype. Statistical comparisons were performed using two-sided
  t-tests (B, D, H) or two-way ANOVA (J-L). Bars represent mean ± SEM. **p value <
  0.01, ****p value < 0.0001. Scale bars, 10 μm
article_title: Diacylglycerol metabolism drives host-pathogen responses during enteric
  infection in Drosophila
