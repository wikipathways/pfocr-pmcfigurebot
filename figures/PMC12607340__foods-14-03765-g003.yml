figure_title: TFP activated MAPK/Nrf-2 pathway in cells.
caption: TFP activated MAPK/Nrf-2 pathway in cells. The cells were exposed to DEHP
  (2 mM) for 24 h after they were treated with TFP for 24 h, then the two main antioxidant
  enzymes were detected including (A) CAT and (B) SOD. (C) Expression analysis of
  antioxidant-related proteins via SDS—PAGE, and (D) the quantitative analysis of
  protein expression using Image J software. All data were analyzed by one-way ANOVA.
  “ns” indicates not significant; “**” indicates p < 0.01 compared with DEHP group
