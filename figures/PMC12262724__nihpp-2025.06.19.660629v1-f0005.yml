figure_title: CFIm25 affects polarization by alternative polyadenylation of AKT2
caption: '(A) Schematic representation of AKT2 mRNA showing the coding sequence (CDS),
  positions of proximal and distal polyadenylation (pA) sites (red lightning bolts),
  and locations of primer pairs used for total and long isoform detection (green arrows).
  (B) Analysis of AKT2 in M1 and M2 polarized THP-1 cells. Left: APA analysis showing
  Log2 ratio of long/total AKT2 mRNA. Right: Log2 fold change in total AKT2 mRNA levels.
  Bottom: Western blot showing Akt2 protein levels, with GAPDH as loading control.
  (C) Impact of CFIm25 overexpression on Akt2. Left: APA analysis showing Log2 ratio
  of long/total AKT2 mRNA in control and CFIm25 OE cells. Right: Log2 fold change
  in total AKT2 mRNA levels. Bottom: Western blot showing Akt2 protein levels, with
  Actin as loading control. (D) Effect of AKT2 proximal polyadenylation site blockade
  using antisense morpholino oligonucleotides (AMO). Left: APA analysis showing Log2
  ratio of long/total AKT2 mRNA. Middle: Log2 fold change in total AKT2 mRNA levels.
  Right: Western blot showing Akt2 protein levels in M1 polarized cells, with GAPDH
  as loading control. Data for A-D are normalized to respective controls (E) Effect
  of AKT2 pA AMO on macrophage surface markers by dual staining. Figure shows quantification
  of flow cytometry data showing percentage of cells expressing CD80 and CD206 surface
  markers in M1 polarized cells with or without AKT2 pA AMO (F) NOS activity measured
  by DAF-FM DA fluorescence in M1 polarized cells with or without AKT2 AMO. (G) Arginase
  activity assay in M1 polarized cells with or without AKT2 AMO. (H) Arginase gene
  expression by qRT-PCR in M1 polarized cells with or without AKT2 AMO. (I) Impact
  of AKT2 AMO on cytokine production. Left: M1 cytokines (TNF-α and IL-12) levels.
  Right: M2 cytokines (TGF-β and IL-10) levels measured by ELISA For all experiments,
  data is shown as mean ± SEM from three independent experiments. ***p < 0.001, **p
  < 0.01, *p < 0.05. (J) Western blot analysis of NF-κB pathway components in M1 polarized
  cells treated with control or AKT2 pA AMO for phospho-p65, total NF-κB p65 and IκB-α
  where GAPDH serves as loading control'
