figure_title: Schematic illustrating the intrinsic and extrinsic pathways of apoptosis
  and the regulation of these events by survivin.
caption: Schematic illustrating the intrinsic and extrinsic pathways of apoptosis
  and the regulation of these events by survivin. The intrinsic pathway is triggered
  by stimuli like radiation, leading to mitochondrial outer membrane permeabilization
  (MOMP) and release of cytochrome c. Apoptotic protease activating factor 1 (APAF-1)
  monomers bind to cytochrome c with ATP co-factors and oligomerize, forming the apoptosome
  and activating caspase-9. In the extrinsic pathway, ligand binding of TNFR1 triggers
  the formation of complex I, which includes TRAF2, TRADD, RIP, and cIAPs. Complex
  II forms with TRADD, RIP, FADD and procaspase-8. Initiator caspases converge to
  activate effector caspases, leading to cell death. Survivin acts on the intrinsic
  pathway by disrupting the pro-apoptotic function of SMAC
