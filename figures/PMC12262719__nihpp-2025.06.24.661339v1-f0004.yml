figure_title: Gene set enrichment analysis (GSEA) performed on proteins ranked by
  differential expression between progressive fibrosis and nodular CT phenotypes.
caption: Gene set enrichment analysis (GSEA) performed on proteins ranked by differential
  expression between progressive fibrosis and nodular CT phenotypes. Enrichment results
  using the Hallmark gene set collection for the (A) MYC Targets V1 gene set, and
  (B) MTORC1 Signaling pathway, (C) Adipogenesis, (D) Oxidative Phosphorylation, and
  (E) Epithelial Mesenchymal Transition are displayed. Gene sets shown in A-D were
  enriched in the progressive nodular CT phenotype group compared to progressive fibrosis
  while the gene set for E was enriched in the progressive fibrosis compared to the
  nodular group
