figure_title: PN-to-interneuron signaling is largely voltage-gate activity-independent
  and mediated by distinct molecular pathways in PVALB and SST subtypes
caption: 'a, Representative MERFISH spatial maps of SSp region showing the number
  and spatial location of selected PVALB and SST interneuron subtypes in control,
  activity silencing (Kir2.1) or blocking vesicular release (TeNT) conditions. b,
  Boxplots showing the proportions of selected deep-layer PVALB and SST subtypes across
  conditions based on MERFISH data. Sample sizes are presented as n = mice (from X
  ROIs). control: n=5 (7); Kir2.1: n=3 (5); TeNT: n=5 (9). Age range: P14–22. Wilcoxon
  rank-sum test, n.s. not significant, p≥0.05; *p<0.05. Exact sample genotypes and
  P values are provided in Supplementary Tables 2 and 3. c, Lollipop diagrams of top
  50 candidate ligand-receptor pairs predicted to mediate PN-interneuron interactions
  between L5b PNs and L5b PVALB versus SST interneurons. Line length represents the
  interaction score, with contributions partitioned across the midline according to
  relative ligand expression in L5b PNs versus receptor expression in L5b interneurons.
  Circle size indicates downregulation (large) or upregulation (small) of the ligand
  in Fezf2 KO. Filled circle signifies direct binding of the Fezf2 transcription factor
  to the ligand’s gene, based on ChIP-seq data. See Supplemental Tables 4 and 5 for
  a complete list of the top 100 ligand-receptor pairs'
