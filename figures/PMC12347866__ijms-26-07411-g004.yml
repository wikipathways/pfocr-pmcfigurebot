caption: 'Correlation analysis between the antigen-presenting-cell (APC) signature
  genes and metabolic pathways. (A) A heatmap showing the correlations between APC
  genes and highly enriched metabolic pathways in cluster 1. (B) A heatmap showing
  the correlations in cluster 10. (C) A heatmap showing the correlations in cluster
  3. (D) A heatmap showing the correlations in cluster 5. (E,F) Functional interaction
  networks of immune signaling and inflammatory response based on curated pathway
  data. Network graphs illustrate key molecular interactions involved in (E) antigen
  presentation and immune recognition and (F) inflammatory signaling. Nodes represent
  genes, proteins, or protein complexes, while edges indicate known biological relationships.
  Edge colors reflect interaction types: Orange: protein–protein interactions, Purple:
  gene regulatory interactions, Node label colors denote their roles in the network:
  Black labels mark seed nodes (user-supplied genes of interest) Magenta labels indicate
  intermediate nodes inferred through network expansion algorithms. These networks
  highlight critical signaling hubs (e.g., HLA complex in (E) and NF-κB complex in
  (F)) and their connections to peripheral components, offering insight into how immune
  and inflammatory pathways are coordinated at the molecular level. Protein–protein-interaction
  (PPI) networks were generated using ConsensusPathDB, incorporating only the experimentally
  validated functional interactions from curated databases (e.g., BioGRID, IntAct,
  and Reactome). A confidence score threshold of 0.7 was applied to include only the
  high-confidence interactions. Hub genes such as MYC, RELA, and NFKB1 were identified
  based on network connectivity (node degree)'
