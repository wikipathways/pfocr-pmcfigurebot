figure_title: CCL2 promotes human primary hepatocyte expansion in vitro.
caption: CCL2 promotes human primary hepatocyte expansion in vitro. (A) t-SNE visualization
  of all integrated single-cell transcriptomic data of foetal and adult human hepatic
  cells. (B) Feature plots of specific marker genes. (C) Characteristic genes induced
  at each stage of hepatocyte differentiation and corresponding pathway. (D) Pseudotime
  analysis revealed the bifurcation of hepatocyte trajectory during development. (E)
  Pseudotime analysis revealed the bifurcation of hepatocyte trajectory during development,
  with the pseudotime values color-coded. (F) Pseudotime analysis revealed the hepatocyte
  trajectory during development in Cluster 3. (G) Interaction plot of differentially
  expressed genes in Cluster 3. (H). Feature plots of CCL2. (I) Time-lapse imaging
  for 3 days (Scale bars, 100μm). (J) Brightfield photographs and Edu staining images
  of cells from HepGLs cultured to day 5 in different passages (Scale bars, 100μm).
  (K) The karyotype analysis of HepGLs at different passages. (L) Immunofluorescence
  staining for PCNA, AFP, and ALB in PPHs and HepGLs at different passages (Scale
  bars, 50µm). (M) Immunofluorescence staining for Cyp3a4, bright field photograph
  of glycogen staining and ICG uptake in HepGLs at different passages. (N) Immunofluorescence
  images of ALB, Ki67, HNF4A, SOX9 and HNF1A in hepatic organoids (Scale bars, 100µm).
  (O) Magnified panels (right) correspond to specific outlined regions (left). Red
  arrows indicate bile canaliculi convergence with biliary cyst (Scale bars, 50µm).
  (P-Q) ALB secretion(P) and ammonia elimination(Q) of 2D-HepGLs and organoids (n=5
  per group). The data represent the mean ± SEM. Statistical significance was assessed
  by two-tailed Student's t-test and two-way ANOVA. *p < 0.05, **p < 0.01, and ***p
  < 0.001; n.s., not significant
