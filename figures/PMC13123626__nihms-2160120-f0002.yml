figure_title: Phospho-mass spectrometry identifies candidate GSK3 phosphorylation
  events regulated by APC
caption: (A) Distribution of phosphorylated amino acids identified in phospho-mass
  spectrometry experiment.(B) Proportion of phosphorylated residues residing within
  a GSK3 consensus recognition motif (S/TXXXS/T) within all phosphoproteins or phosphoproteins
  significantly reduced in Gsk3α/βflox/flox or Apcflox/flox intestines after Villin-CreER-mediated
  deletion, relative to control (p < 0.05 and log2FC < −1). Statistical significance
  was determined by a chi-squared test and a two-tailed heteroscedastic t test. *p
  < 0.05.(C) Percentage of amino acids +4 downstream of phosphosites reduced in Gsk3α/βflox/flox
  intestines.(D and E) Volcano plot of phosphoproteins in Gsk3α/βflox/flox (D) or
  Apcflox/flox (E) intestines relative to control. Phosphosites commonly and significantly
  altered in both genotypes are labeled.(F and G) EnrichR pathway enrichment analysis
  of proteins reduced in Gsk3α/βflox/flox (F) or Apcflox/flox (G) intestines relative
  to control.(H) Overlap of significantly reduced phosphoproteins (p < 0.05 and log2FC
  < −1). Statistical significance was assessed by a hypergeometric test (n = 2)
