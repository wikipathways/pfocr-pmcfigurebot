figure_title: Stroke alters intestinal microbiota composition and the colonic transcriptome
caption: 'A) Schematic showing experiment design: male C57BL/6 mice underwent MCAO,
  sham surgery, or no surgery (naïve). Faecal pellets were collected at 24 h and mice
  euthanised at 48 h, where colon tissue was harvested for bulk RNAseq. B) Faecal
  albumin concentration at 24 h, data pooled from 3 independent experiments, n = 13–14.
  (C-E) 16S rRNA sequencing of fecal microbiota from naïve, sham and MCAO mice. C)
  Bray-Curtis dissimilarity index, D) Shannon index & E) Ratio of Firmicutes:Bacteroides
  (F:B), data pooled from 2 independent experiments, n = 8–9. (F-J) Bulk RNA sequencing
  of colonic tissue from naïve, sham and MCAO mice. F) Heat map of genes with 50 highest
  and 50 lowest differentially expressed genes (DEGs; p < 0.01), expressed as z-scores.
  G) 15 curated pathways from GO-term pathway analysis. H) Volcano plot of top 1000
  significant DEGs (p < 0.01) from comparison of sham and MCAO groups. Positive fold
  change indicates increase following stroke, negative fold change indicates decrease
  following stroke. (I-J) Selected exemplar genes identified from GO term pathways
  including I) immune system process and J) mucosal antibody regulation. Data pooled
  from 2 independent experiments, n = 7–9. Data presented as mean +/- SEM. Statistical
  tests: B, D, I + J – one-way ANOVA w/Tukey post-hoc. C= PERMANOVA, * p < 0.05, **
  p < 0.01, *** p < 0.001, **** p < 0.0001'
article_title: Cerebral ischaemic stroke results in altered mucosal antibody responses
  and host-commensal microbiota interactions
