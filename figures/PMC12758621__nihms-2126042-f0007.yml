figure_title: Selective autophagic pathways are independent regulated
caption: (A) Two hypothetical models for how peroxisomes and mitochondrial are degraded
  through autophagy. In the shared limiting resource model (left), the receptors Atg30
  and Atg32 compete for the same limiting autophagic machinery or resource such that
  the presence of one pathway is expected to slow the other. This model predicts that
  inhibition of either pathway should increase the flux through the unperturbed pathway.
  In the independent regulatory model (right) the pathways are not in competition
  and are not predicted to impact one another. (B) Clustered heatmap plotting the
  relative abundance of peroxisomal (orange) or mitochondrial (purple) proteins over
  time in wild-type, atg9Δ, atg11Δ, atg30Δ, and atg32Δ cells transitioning from M+N
  to M−N media. Columns represent individual timepoints, which are plotted above.
  (C-D) Degradation profiles and fit kinetic models (eq. 1, see Methods) of representative
  peroxisomal (C) or mitochondrial (D) proteins, with Atp synthase related proteins,
  which are degraded relatively slowly, outlined. Uniprot protein ID and protein common
  names are listed, with fit parameters kdeg and Adeg noted above each plot
