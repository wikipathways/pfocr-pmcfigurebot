figure_title: Immunometabolic profile of IPF macrophages.
caption: Immunometabolic profile of IPF macrophages. In IPF, alveolar macrophages
  exhibit distinct metabolic polarization that reflects the progression from early
  inflammation to late-stage fibrosis. Early in disease, macrophages may adopt a glycolysis-driven
  M1-like phenotype associated with pro-inflammatory cytokine production, including
  IL-1β. As fibrosis advances, these cells shift toward an M2-like metabolic profile
  characterized by enhanced fatty acid oxidation, upregulated PGC-1α signaling, and
  sustained TGF-β secretion. Concurrent mitochondrial calcium influx amplifies oxidative
  phosphorylation and ROS output. Suppression of the aconitate decarboxylase 1 (ACOD1)-itaconate
  pathway removes an anti-inflammatory regulatory node, enabling persistent macrophage
  activation. Together, these metabolic changes promote fibroblast activation, collagen
  deposition, and irreversible tissue remodeling. AEC, alveolar epithelial cell; ECM,
  extracellular matrix; EMT, epithelial-mesenchymal transition; HO-1, heme oxygenase
  1
