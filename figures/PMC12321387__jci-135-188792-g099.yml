figure_title: WNK bodies are necessary for KS-WNK1 to amplify NCC phosphorylation
  during hypokalemia
caption: (A) WT and 5Q mice were fed control or low K+ diet for 10 days, and kidney
  cortex homogenates were probed for tNCC, pNCC, tSPAK, and pSPAK/pOSR1. Brackets
  indicate the band analyzed. (B–E) Graphical representation of immunoblots in A.
  (B) tNCC abundance. (C) pNCC abundance. (D) tSPAK abundance. (E) pSPAK/pOSR1 abundance.
  K+-restricted 5Q mice had significantly increased pSPAK/pOSR1 and reduced tNCC and
  pNCC expression, indicating that signaling to NCC was uncoupled. n = 6 mice per
  genotype, sex, and diet. Two-way ANOVA with Šídák’s post test was applied, *P <
  0.05, **P < 0.01, ***P ≤ 0.001, ****P ≤ 0.0001. (F) Model of WNK-SPAK/OSR1-NCC signaling
  in WT, KS-WNK1–KO, and 5Q mice. KS-WNK1 normally facilitates WNK body condensate
  formation and NCC activation via the WNK-SPAK/OSR1 pathway. In K+-restricted KS-WNK1–KO
  mice, WNK bodies are largely absent and remaining complexes are mislocalized, resulting
  in low SPAK/OSR1 and NCC activity. In the K+-restricted 5Q mouse, WNK-pSPAK/pOSR1
  becomes trapped in perinuclear aggregates, preventing pSPAK/pOSR1 expression at
  the DCT apical membrane, causing a reduction in NCC activity. See also Supplemental
  Table 4
