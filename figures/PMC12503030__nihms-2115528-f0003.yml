figure_title: Mechanisms of T-cell Activation and Sites of Immunosuppressive Mechanisms
  of Action.
caption: Mechanisms of T-cell Activation and Sites of Immunosuppressive Mechanisms
  of Action. The three step model of T-cell activation includes signal 1 which involves
  TCR recognition of the peptide-MHC complex on APCs. Signal 2 involves co-stimulatory
  interactions between CD80 on the APC and CD28 on the T-cell. Signal 3 is mediated
  by cytokines released by the APC, thus promoting T-cell proliferation and differentiation.
  CNIs blocks T-cell activation by inhibiting calcineurin signaling downstream of
  TCR engagement. Steroids suppress cytokine production at the level of the APC, while
  also affecting TCR signaling and co-stimulation pathways. Cell cycle inhibitors
  impair clonal expansion of activated T-cells by halting progression through the
  cell cycle. Together, these agents can work synergistically to prevent allograft
  rejection. Created in Biorender
