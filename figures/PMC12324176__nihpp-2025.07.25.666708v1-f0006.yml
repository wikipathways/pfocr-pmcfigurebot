figure_title: Differential multimodal cell-cell interaction across three cancer types
  using integrative analysis of Visium, CosMx, Xenium data
caption: (a) Heatmap of LR scores for LR pairs enriched per cancer type, with a consistent
  trend across samples and the two Visium and CosMx platforms. Differentially expressed
  LR pairs were calculated comparing each cancer type vs the others using a pseudobulked
  LR scores with 3 pools per sample. Each heatmap row is a distinct CosMx or Visium
  sample. The two L-R pairs specific for melanoma IL34-CSF1R and FGF2-CD44 were used
  for experimental validations.(b) Differential interaction analysis based on LR pairs
  and cell type pairs. The Venn diagram compares differential LR pair results between
  Melanoma and the combined BCC + cSCC datasets, calculated using edgeR with pseudobulked
  LR scores. The diagram highlights consistent and unique results between CosMX and
  Visium, where Up indicates a higher LR score in Melanoma and Down indicates a lower
  score in BCC + cSCC. Cell-to-cell communication between the LR pairs that are up-
  and downregulated in melanoma in both CosMx and Visium is shown in the two Network
  plots flanking the Venn diagram. In both Network plots, the purple arrows show pairs
  of cell types that have interactions higher in Melanoma and green arrows show interactions
  between cell type pairs more in the BCC + cSCC than in Melanoma. The number displayed
  for each arrow shows the integrated p-value across all biological replicates (the
  thicker arrows indicate more interactions). Interactions between the two cell types
  can still be significantly upregulated in melanoma even if the set of LR pairs were
  downregulated.(c) Spatial mapping of cancer type-enriched LR pairs in CosMx data.
  One of the LR pairs that was significantly different between cancer types across
  technologies in Panel a, namely IL34-CSF1R (higher in melanoma) is shown. It is
  visualised in FOVs from melanoma sample (top) and BCC sample (bottom). For each
  cancer type, the cell type annotation of the FOV is shown (top left) with orange
  and black boxes indicating the highlighted regions (top right). Magnified boxes
  (top right) show the presence of the ligand (pink) and receptor (red), with white
  arrows showing the connections between ligands and receptors of nearby cells. An
  overview of interactions at tissue level is shown by large coloured arrows, representing
  cumulative interactions between two cell types in the tissue, with the location
  of the arrow root as the centroid coordinate of all cells in one cell type (bottom
  left).(d) Melanoma drug target graph integrating multiple biological and pharmacological
  knowledge types. Nodes represent genes, drugs, and biological functions. Level 1
  connections show melanoma-associated genes and drugs targeting melanoma. Level 2
  links display drugs targeting the melanoma-associated genes from Level 1 and a broader
  gene set targeted by drugs in the network. All genes in the graph are either upregulated
  or have high ligand-receptor scores. Clusters 1, 2, and 3 are pathways enriched
  with genes shown in the graph
