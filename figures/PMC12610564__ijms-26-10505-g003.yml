caption: 'Left: Complex heterogeneity within a solid tumor (adapted from Fu et al.
  [67]). A region enriched with apoptotic cells is marked. Such “apoptotic cell islands”
  stimulate the proliferation of surrounding cancerous cells, which is in part mediated
  by oncogenic caspase 3 [41,42]. Right: Examples of cancer cell types that can promote
  tumor repopulation post therapy. A subset of cancer cells increase their p21 protein
  levels in response to treatment which is “just right” to enable them to temporarily
  halt their cell cycle, repair their genome and resume proliferation [68]. Anastasis
  refers to the natural process of cell recovery from late stages of regulated cell
  death [23,24]. Dying cells (e.g., through apoptosis) release a panel of pro-survival
  factors, including prostaglandin E2 (PGE2) via the phoenix rising pathway [20,25].
  Polyploid/multinucleated giant cancer cells (PGCCs), senescent cancer cells, and
  therapy-tolerant cancer cells are three cell subgroups that enter a state of transient
  dormancy (active sleep) post-therapy [3,69]. Cancer stem cells undergoing apoptosis
  resist destruction (phagocytosis) by fusing their apoptotic belbs to form a blebbishield
  [26,45]'
