figure_title: Homozygous point mutation in Celsr3 does not perturb gross organization
  of the mouse brain.
caption: Homozygous point mutation in Celsr3 does not perturb gross organization of
  the mouse brain. (a) Depiction of P0 axonal projections—thalamocortical and corticothalamic
  projections (coronal view at axial position shown in panel b). Neonate (P0) brains
  were compared using different markers to reveal gross anatomical changes. (b) L1
  antibody labelling in coronal sections of the P0 mouse brain shows fiber tracts
  in Celsr3+/+ (left) and Celsr3R774H/R774H (right) mice. Scale bar represents 500
  µm. (c) Sagittal view of direct pathway axon tracts in adult Celsr3+/+ (top) and
  Celsr3R774H/R774H (bottom) based on Ai14 expression under control of Drd1-Cre. (yellow
  rectangle) zoom in of direct pathway axon tracts (d) Sagittal view of indirect pathway
  fiber tracts in Celsr3+/+ (top) and Celsr3R774H/R774H (bottom) mice based on Ai14
  expression under control of A2a-Cre, (yellow rectangle) zoom in of indirect fiber
  tracts. Scale bar represents 1 mm. Thal—thalamic nuclei, GP—globus pallidus, Str—striatum,
  Hpc—hippocampus, LV—lateral ventricle, Ctx—cortex, ic—internal capsule
