figure_title: Overview of PGCC Explorer platform and analysis modules
caption: '(A) Schematic overview of the PGCC Explorer platform. The platform provides
  access to high-throughput screening results and integrative multi-omics analysis.
  In addition to an overview of the full dataset, it supports two primary query modes:
  Module 1, Gene/pathway-centric search, which identifies anti-PGCC compounds influenced
  by a specified genomic or pathway feature (mutation, copy number alteration, gene
  expression, or pathway activity); and Module 2, Compound-centric search, which reveals
  gene or pathway features associated with the response to a selected compound. Integrated
  analysis combines PGCC screening data with genomic profiles (mutations, copy number
  alterations, gene expression, and pathway activities) and baseline viability data
  from the PRISM repurposing screen. Interactive outputs include compound information,
  statistical comparisons, sortable/searchable results, and a built-in user manual.
  (B) Screenshots of the homepage and query input and results interfaces. Also shown
  is an example from compound-centric analysis of auranofin highlighting top pathways
  associated with anti-PGCC efficacy under the non-induced condition. Pathway activities
  were derived from single-sample gene set enrichment analysis using baseline expression
  profiles of individual cell lines. P-values were calculated using two-tailed t-tests'
