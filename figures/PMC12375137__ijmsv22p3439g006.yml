figure_title: Role of GH/IGF-1, aldosterone, and cortisol in renal collecting ducts.
caption: Role of GH/IGF-1, aldosterone, and cortisol in renal collecting ducts. GH
  binding to GHR triggers activation of the STAT5 pathway, leading to transcriptional
  activation of GH target genes and increased expression of ENaC. IGF-1 can be synthesized
  locally or captured from the circulation, bound to IGF-1R, and activated via PI3K-dependent
  SGK1. SGK1, phosphorylating Nedd4/2, can inhibit its transport and degradation of
  ENaC. These two hormones act in concert and together regulate epithelial sodium
  transport. Aldosterone regulates ENaC by forming a dimer with MR to enter the nucleus
  and promote the expression of SGK1 and ENaC. The mineralocorticoid effect of cortisol
  is affected by 11β-HSD2, which converts cortisol to an inactive form and protects
  MR from activation by cortisol. Red lines indicate inhibition by phosphorylation
  or ubiquitination, and black lines indicate material movement or change to a phosphorylated
  state. GH, growth hormone; GHR, growth hormone receptor; IGF-1, insulin-like growth
  factor 1; IGF-1R, insulin-like growth factor 1 receptor; STAT5,signal transducer
  and activator of transcription 5; PI3K, phosphoinositide 3-kinase; SGK1, serum/Glucocorticoid
  regulated kinase 1; Nedd4-2, neural precursor cell expressed, developmentally down-regulated
  4-2; ENaC, epithelial Na+ channel; A, aldosterone; C, cortisol; MR, mineralocorticoid
  receptor; 11β-HSD2, 11β-hydroxysteroid dehydrogenase 2; P, phosphorylated
