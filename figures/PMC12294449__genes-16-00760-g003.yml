caption: Transcriptome sequencing data analysis of the bud and flowering stages of
  ‘Guichang’. (A) The volcano plot shows the expression levels of differentially expressed
  genes. Up-regulated genes are represented by red dots, while down-regulated genes
  are indicated by green dots. (B) KEGG enrichment analysis of up-regulated genes,
  where the Gene Ratio represents the proportion of differentially expressed genes
  within a specific pathway compared to all annotated genes in that pathway. The adjusted
  p-values (Padj) range from 0 to 1, with lower values indicating greater significance
  in enrichment. (C) qPCR was used to measure the transcription levels of various
  genes at the bud and flowering stages, using EF1a as a reference gene. Results are
  expressed as mean ± SD (n = 3). **** p < 0.0001
