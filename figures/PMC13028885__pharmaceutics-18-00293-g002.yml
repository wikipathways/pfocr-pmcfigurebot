figure_title: 'Mitophagy: Selective Mitochondrial Clearance in Platelets.'
caption: 'Mitophagy: Selective Mitochondrial Clearance in Platelets. This schematic
  illustrates the process of mitophagy in platelets, a selective autophagic pathway
  responsible for the removal of dysfunctional or damaged mitochondria. Upon mitochondrial
  depolarization or oxidative stress, PINK1 accumulates on the outer mitochondrial
  membrane and recruits the E3 ubiquitin ligase Parkin, which ubiquitinates various
  mitochondrial surface proteins. These ubiquitinated targets are recognized by autophagy
  receptors such as p62/SQSTM1, NDP52, and optineurin, which in turn interact with
  LC3 on the forming autophagosome membrane. The damaged mitochondrion is subsequently
  engulfed and delivered to the lysosome for degradation. This process ensures mitochondrial
  quality control, reduces ROS accumulation, and contributes to the regulation of
  platelet lifespan, reactivity, and thrombotic potential under stress conditions
  such as diabetes, aging, and ischemia'
