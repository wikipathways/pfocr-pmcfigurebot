figure_title: Increased expression of ALP and activation of the PI3K/AKT pathway in
  OS cultures within 3D COL matrices
caption: '(a) ALP activity, a biomarker of OS, was significantly higher in 2D COL
  and 3D COL cultures compared to 2D TCP at days 1 and 3 of culture compared to 2D
  TCP (n = 4 independent technical replicates, mean ± SD, ordinary one-way ANOVA with
  Tukey''s post hoc analysis, *p < 0.05, **p < 0.01). (b) AKT/Protein Kinase B gene
  expression was significantly increased in 2D COL and 3D COL cultures compared to
  2D TCP (n = 4 independent technical replicates, mean ± SD, ordinary one-way ANOVA
  with Tukey''s post hoc analysis, **p < 0.01, ***p < 0.001). (c and d) Western blot
  and protein expression of activated AKT (pAKT) and total AKT demonstrated increased
  activated AKT normalized to total AKT in 2D COL and 3D COL cultures compared to
  2D TCP (n = 3 independent technical replicates, mean ± SD, ordinary one-way ANOVA
  with Tukey''s post hoc analysis, * p < 0.05, **p < 0.01). Abbreviations: ALP = alkaline
  phosphatase; PI3K = phosphatidylinositol-3 kinase; OS = osteosarcoma; 3D = three-dimensional;
  COL = collagen; 2D = two-dimensional; TCP = tissue culture plastic; SD = standard
  deviation; ANOVA = analysis of variance'
