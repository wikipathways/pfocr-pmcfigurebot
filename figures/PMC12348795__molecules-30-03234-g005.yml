figure_title: The toxic mechanism of action of RDX.
caption: 'The toxic mechanism of action of RDX. Neurotoxicogenomic studies on RDX-induced
  epileptic seizures in northern white mice have shown significant differential expression
  of transcripts involved in mediating neuronal electrophysiology and signal transduction
  pathways (red = upregulated, green = downregulated). The overall effect of these
  effects is hypothesized to inhibit the repolarization potential of neuronal cells
  after action potentials (illustration), leading to increased neuronal excitability,
  epileptic seizures, and ultimately death. The affected transcripts include: (1)
  Na+, K+-ATPase upregulation, actively restoring neuronal repolarization; (2) Ornithine
  decarboxylase antizyme upregulation, regulating inward rectifier K+ channels affecting
  neuronal excitability; (3) aspartate aminotransferase gene (AspAT) upregulation,
  involved in buffering free glutamate (an excitatory neurotransmitter) concentration;
  (4) Visinin-Like Protein 1 (VSNL1) downregulation, regulating α4β2 acetylcholine
  receptors, increasing membrane surface expression levels and agonist sensitivity
  in response to intracellular Ca2+ levels; (5) Heat Shock Protein 70/72 (HSP70/72)
  upregulation, observed to promote channel opening and repolarization in association
  with voltage-dependent ClC-2 Cl− channels; (6) differential expression of Calmodulin
  2 (CALM2), which sequesters free Ca2+ as a neurotransmitter and neurotransmitter
  release factor; and (7) synaptosome-Associated Protein 25 (SNAP-25) upregulation,
  SNAP-25 being an important component of neurotransmitter release. The impact on
  these transcripts indicates that RDX has a direct effect on neuronal physiology
  and/or compensatory physiology, attempting to restore homeostasis within the neuronal
  tissue'
