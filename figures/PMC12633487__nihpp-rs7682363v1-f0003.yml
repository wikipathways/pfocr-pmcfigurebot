figure_title: Lipid reprogramming is more pronounced in lipid-accumulating microglia
  and macrophages.
caption: Lipid reprogramming is more pronounced in lipid-accumulating microglia and
  macrophages. (A) Feature plots for genes involved in lipid storage and processing
  (Lipa, Npc2, and Nceh1) and phagocytosis (Anxa5) identifying BAM_7 and DAM_3 as
  clusters with more pronounced lipid metabolism reporogramming. (B) Flow cytometry
  gating strategy for isolation of microglia (CD11B+CD45int) and monocytes (CD11B+CD45hi)
  with either low (BPlo) or high (BPhi) lipid load used for RNA isolation. (C) Heatmap
  of RTqPCR analysis of TBI-induced expression changes in DAM_3/BAM_7 markers from
  panel A in microglial (MG) and monocytes (MO) cells isolated using strategy from
  panel B. Increased expression levels in BPhi microglia and monocytes as compared
  to corresponding BPlo cells, indicated that that they represent DAM_3 and BAM_7
  populations, respectively. (D) Violin plots representing expression levels of lipid
  handling genes (top) and lipid synthesis genes (bottom) in BAM_7 vs all other BAMs
  (left) and in DAM_3 vs all other microglia (right). (E) TFlink analysis identifying
  top five transcription factors responsible for DEGs in BAM_7 vs all other BAMs (left)
  and DAM_3 vs all other microglia (right). The size of each bubble is proportionate
  to the number of DEGs genes controlled by the transcription factor. (F) Gene Ontology
  Biological Process (GO:BP) enrichment analysis for genes differentially expressed
  in BAM_7 vs all other BAMs following exposure to TBI. Lipid metabolism terms are
  highlighted in bold. (G) KEGG pathway analyses of BAM_7 vs all other TBI BAMs and
  DAM_3 vs all other TBI microglia. Terms related to lysosomal function are highlighted
  in bold. (H) Volcano plots demonstrating altered expression of LDAM genes1 in BAM_7
  vs all other TBI BAMs and DAM_3 vs all other TBI microglia
article_title: Inhibition of autophagy-lysosomal function exacerbates microglial and
  monocyte lipid metabolism reprograming and dysfunction after brain injury
