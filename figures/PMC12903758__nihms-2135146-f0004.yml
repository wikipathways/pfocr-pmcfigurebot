figure_title: Integrated model of spaceflight stress on immune dysfunction
caption: The spaceflight exposome collectively perturbs immune cell biology. Spaceflight
  fosters resilient microbes, heightening immune vulnerability. Chronic physiological
  stress raises cortisol, binding glucocorticoid receptors, suppressing NF-κB-mediated
  inflammation, and also facilitating lymphocyte apoptosis. Cosmic radiation increases
  the levels of reactive oxygen and nitrogen species (ROS and RNS), damaging cellular
  structures, activating inflammatory pathways, and also potentially enabling immune
  cell apoptosis. Microgravity induces alterations in GPCR expression in PBMCs, which
  may modulate PKA and Rho family GTPase activity, regulates ion channel activation
  and integrins, perturbing cytoskeleton organization. Cytoskeleton remodelling affects
  nuclear and cell shape likely via the LINC complex. Changes in the cytoskeleton
  also disrupts mitochondrial function. Altered GPCR activity, especially in T cells,
  potentially modulates calcium levels, worsening mitochondrial health. Altered actin
  remodelling and microgravity regulate nuclear receptor levels across PBMCs and reduce
  PKC translocation to influence inflammation, metabolism and activation. Cytoskeleton
  dynamics are also key in RLR, and potentially TLR mediated antiviral pathways, where
  microgravity deregulates RIG-I and TRIM25, which ubiquitinates RIG-I in innate immune
  cells. This change impedes interaction with MAVS, blocking downstream antiviral
  signalling and IFN expression. Spaceflight stressors, including microgravity, also
  regulate chromosome conformation, including epigenetic docking sites for transcription
  factors, affecting gene expression, as shown in T lymphocytes. For instance, FOXP3
  shows increased chromatin docking in regulatory T (Treg cells) after spaceflight.Other
  space stressors, including cosmic radiation, further impair mitochondria function,
  prompting caspase-3 activation and apoptosis. At the same time, ROS released from
  damaged mitochondria upregulate the HIF-1 pathway, affecting immune metabolism and
  inflammation. ROS coupled with other damaged cellular components further incite
  low-grade basal inflammation potentially through inflammasomes or nucleic acid-sensing
  mechanisms. Consistently, within the nucleus, cosmic radiation inflicts telomere
  stress and DNA damage, prompting cells to upregulate DNA repair proteins. However,
  microgravity impairs DNA damage responses, causing immune cells to accumulate DNA
  damage, predisposing them to apoptosis, further inflammatory changes or potentially
  senescence. Altogether, the space stressors elevate inflammatory cytokines and chemokines,
  reduce IFN signalling, suppress adaptive immune responses and proliferation to stimulation,
  and reduce innate cell phagocytosis and antigen presentation. These changes, coupled
  to changes in chromatin conformation, contribute to viral reactivation. Changes
  in microRNA (miRNA) and long non-coding RNA (lncRNA) levels have been documented
  in cells in space, and likely contribute to these processes.Solid lines are published
  mechanistic connections, while dotted lines are hypothetical mechanistic connections
  for spaceflight stressors. Black arrows represent pathways and phenotypes found
  in PBMCs (proposed or observed). Red arrows specifically denote pathways and phenotypes
  found in innate immune cells, blue arrows specifically denote pathways and phenotypes
  described in adaptive immune cells. IFN, interferon; miRNA, micro-RNA; lncRNA, long-non-coding
  RNA. ROS, Reactive oxygen species; RNS, reactive nitrogen species; LINC, linker
  of nucleoskeleton and cytoskeleton; RLR, retinoic acid-inducible gene I (RIG-I)-like
  receptors; TRIM25, tripartite motif containing 25; HIF-1, hypoxia-inducible factor
  1; MAVS, Mitochondrial antiviral signalling protein; GPCR, G protein-coupled receptor;
  PKC, Protein Kinase C; PKA, Protein Kinase A
