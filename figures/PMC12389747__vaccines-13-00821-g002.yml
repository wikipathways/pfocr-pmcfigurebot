figure_title: Possible degradation pathway of circRNA.
caption: Possible degradation pathway of circRNA. (1) Ago2 participates in circRNA
  degradation. (2) RNase H1-mediated circRNA degradation. (3) RNase L-mediated circRNA
  degradation. (4) m6A-modified RNAs could induce ribosome stalling and collision
  which recruits YTHDFs to initiate degradation. (5) m6A-modified circRNAs are recognized
  by YTHDF2 and degraded via HRSP12-RNase P/MRP complexes. (6) Structure-mediated
  circRNA degradation. (7) DIS3-dependent circRNA degradation pathway. Solid arrows
  denote experimentally validated degradation pathways, whereas dashed question-marked
  arrows indicate putative degradation mechanisms
