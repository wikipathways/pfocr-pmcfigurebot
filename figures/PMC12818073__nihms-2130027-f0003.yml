figure_title: Macrophage and pre-macrophage subsets and association with MASLD/MASH
  progression
caption: 'a, UMAPs of macrophages (MPs) and pre-macrophages (PreMPs) color coded by
  subcluster (top), compartment (FNAs or PBMCs, middle) and disease stage (NS–SS,
  early MASH and advanced MASH, bottom) in cells as in Fig. 1b (clustering settings:
  15 PCs; Louvain resolution, 1.4). b,c, Marker gene expression dot-plot for all PreMP
  or MP subclusters (PreMP_1, PreMP_2, PreMP_3, MP_0, MP_1, MP_2 and MP_3) (b) and
  only MP_1, MP_2 and MP_3 (c) as in a. Color represents the average scaled expression
  of a gene in a cluster and size the percentage of cells that express a gene in a
  cluster. d, Matrix plot of pairwise cluster modularity index for each PreMP or MP
  subcluster as in a. e, Subclustering of MP_0 macrophages (clustering settings: 7
  PCs; Louvain resolution, 0.4) as UMAP (left) and heatmap of differentially expressed
  genes (right). f, Differential abundance graph for MPs and PreMPs as in a depicting
  closely related cells (nodes), the layout of which is determined by the UMAP position
  of the neighborhood index cell. Node size represents the number of cells in the
  neighborhood. Lines represent the number of cells shared between adjacent neighborhoods.
  Color represents the log(fold-change) (log(FC)) differential abundance of neighborhoods
  in advanced versus early MASH. g, Volcano plot of differentially expressed genes
  in pooled MP_0, MP_1, MP_2 and MP_3 macrophage subsets in FNAs between early and
  advanced MASH (left) and the corresponding enriched pathways in early (middle) and
  advanced (right) MASH. One-sided hypergeometric test with Bonferroni’s correction
  was used. TriC/CCT, T-complex protein Ring Complex also known as Chaperonin Containing
  TCP-1 (CCT). h, IF showing staining for S100A9 and CD68 in livers from patients
  with SS (n = 1), MASH F1 (early MASH, n = 1) and MASH F2 (advanced MASH, n = 1)
  (top and bottom left) and percentage of S100A9+ cells among CD68+ cells in patients
  with NS (n = 1), SS (n = 1), MASH F1 (n = 1) and MASH F2 (n = 1) (bottom right).
  i, Representative immunohistochemistry images of S100A9 staining in male wild-type
  C57BL/6J mice fed with HF-CDAA every day for 4 (n = 4), 8 (n = 4) and 12 (n = 4)
  weeks, starting at 8 weeks of age. ER, endoplasmic reticulum'
