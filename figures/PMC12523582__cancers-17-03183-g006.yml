figure_title: PAK6 expression is correlated with chemokine signaling and may regulate
  immune cell migration in colorectal cancer.
caption: PAK6 expression is correlated with chemokine signaling and may regulate immune
  cell migration in colorectal cancer. (A) Heatmap demonstrating significant positive
  correlations (all p < 0.001) between PAK6 expression and key chemokines (CCL24,
  CCL5, CX3CL1, CXCL16) in the TCGA-CRC cohort, with CXCL16 showing the strongest
  correlation (R = 0.291). (B) Bubble plot of Gene Ontology (GO) enrichment analysis
  showing that PAK6-associated chemokine receptors and pathway genes are predominantly
  enriched in biological processes related to chemokine production and regulation.
  (C–J) Independent validation using the TISIDB database confirms significant correlations
  (p < 0.05) between PAK6 expression and the four highlighted chemokines (C–F) as
  well as key chemokine receptors CCR2, CCR4, CCR6, and CX3CR1 (G–J) in CRC. (***
  p < 0.001)
