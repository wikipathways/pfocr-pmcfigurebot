caption: 'Effects of CYRSV infection on the color, chromoplasts, and carotenoid and
  flavonoid pathways in tomato fruits. (A) Tomato symptoms after CYRSV infection.
  (B) Chromoplast micrographs for the CYRSV and mock groups. Numbers and areas of
  chromoplasts and plastoglobules in the CYRSV and mock groups. P, plastoglobule;
  ccr, carotenoid crystalloid; CW, cell wall; V, virus; scale bar = 500 nm. Carotenoid
  (C) and flavonoid (D) metabolite contents in tomato fruits from the CYRSV and mock
  groups. Asterisk indicate significant differences: * p < 0.05, ** p < 0.01, ***
  p < 0.001'
