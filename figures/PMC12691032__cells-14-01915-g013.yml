figure_title: Transcriptomic profiling of neuroglial cultures following EV-GPC treatment
  in modelling glutamate excitotoxicity.
caption: Transcriptomic profiling of neuroglial cultures following EV-GPC treatment
  in modelling glutamate excitotoxicity. (A) heatmaps of differentially expressed
  genes (DEGs) were obtained using pheatmap R package. Each row represents a gene
  and each column corresponds to an individual sample; sample groups indicated by
  column annotations. Log2-transformed gene expression values were row-scaled, and
  hierarchical clustering was performed for both rows (genes) and columns (samples)
  using Euclidean distance and the complete clustering method. The colour scale represents
  scaled expression values and ranges from blue (down-regulated) to red (up-regulated).;
  (B) results of classification of up-regulated DEGs using the KEGG database. The
  ratio of DEGs of the pathway to the total number of DEGs is shown on the X axis,
  and the selected signalling pathways are shown on the Y axis. (C) results of classification
  of down-regulated DEGs using the KEGG database. The ratio of DEGs of the pathway
  to the total number of DEGs is shown on the X axis, and the selected signalling
  pathways are shown on the Y axis
