figure_title: Classification of metabolites and identification of differentially accumulated
  metabolites.
caption: 'Classification of metabolites and identification of differentially accumulated
  metabolites. (A) Ring diagram showing the classification and composition of identified
  metabolite category. (B) Heatmap clustering of identified metabolites. (C) Principal
  component analysis (PCA) of the metabolite profiles from WT, ago1-25, ago1-38, and
  ago1-45 samples based on the identified metabolites. (D–F) Volcano plots showing
  the numbers of DAMs identified in pairwise comparisons of ago1-38, ago1-25, and
  ago1-45 versus WT. Red and green dots represent up- and downregulated DAMs, respectively.
  (G–I) The top 20 DAMs in ago1-38, ago1-25, and ago1-45 ranked by log2 fold change
  (log2FC). (J–L) Variable importance in projection (VIP) bar plots illustrating changes
  in metabolite profiles in ago1-38, ago1-25, and ago1-45. The y-axis represents compound
  classes, whereas the x-axis denotes log2FC values; bubble size corresponds to VIP
  scores. (M–O) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment
  and differential abundance (DA) score diagram of DAMs in ago1-38, ago1-25, and ago1-45.
  The bubble size represents number of DAMs, the color corresponds to p-value. In
  (M), the glutathione metabolism pathway was marked in red font, which was extensively
  enriched in henceforth analysis. The calculation of DA score in an enriched pathway:
  DA = (number of upregulated DAMs − number of downregulated DAMs)/number of total
  DAMs'
