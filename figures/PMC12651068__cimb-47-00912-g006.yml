figure_title: Differential lipid analysis chart.
caption: Differential lipid analysis chart. (A) The Venn diagram of the differential
  metabolites between MM and N and the differential metabolites between CM and N.
  (B) The constituent ratio of serum differential metabolite species between CM and
  MM groups. Steroids (Steroids and steroid derivatives). (C) Clustering heatmap analysis
  of 44 differential metabolite species between CM and MM groups. The color bars represented
  the log10 value of the ratio for each metabolite species and only statistically
  significant changes were shown (fold change > 1.50 or <0.67 and p < 0.05). (D) Trend
  of metabolites with high differential efficacy between CM and MM Groups. (* p <
  0.05). (E) KEGG pathway enrichment analyses of differential metabolites between
  CM and MM Groups. (F) The normalized peak intensity of Arachidonic Acid, and 15-HETE
  in each group (F (2, 9) = 4.515, F (2, 9) = 3.983, * p < 0.05, *** p < 0.001). The
  black squares, circles, and triangles represent independent biological replicate
  samples within each group
