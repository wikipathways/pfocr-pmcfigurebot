figure_title: EMT-associated alterations in B cell and NK cell populations in the
  tumor microenvironment
caption: 'A UMAP plot of B cells derived from CD45+ cell enriched samples across tumors
  with different EMT states, four distinct B cell subpopulations were identified:
  Cd44− MHCIIhi B cells, plasma cells, Cd25+Cd69+ B cells, and Cd44+Cd69+ B cells.
  B Violin plots showing expression of representative marker genes across B cell subtypes.
  C Feature plots displaying expression of immunoglobulin isotypes (Ighg1, Igha, Ighd,
  Ighe) in B cells. D Stacked bar plot illustrating the relative proportions of B
  cell subtypes in tumors with different EMT states. E Dot plot showing average expression
  of Gzma, Gzmb, Prf1, and Cxcr6 in NK cells across different samples. F Feature plots
  displaying expression of Nkg7, Gzmb, Pfr1, and Cxcr6 in NK cells. G Heatmap of Z-scores
  representing pathway enrichment in NK cells based on scRNA-seq data. Hallmark gene
  sets from the MSigDB database were used for gene set enrichment analysis (GSEA),
  with enrichment calculated using the Wilcoxon–Mann–Whitney. Z-scores reflect the
  relative enrichment of each pathway across samples'
