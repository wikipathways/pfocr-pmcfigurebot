figure_title: UBE2L3 regulates TSC2 expression via ubiquitination.
caption: UBE2L3 regulates TSC2 expression via ubiquitination. (A) Volcano plot showing
  differentially expressed proteins between shUBE2L3 MDA-MB-231 cells and control
  cells (|log₂FC| > 1 and p < 0.05). (B, C) GO and KEGG analyses showing enrichment
  of differentially expressed proteins in autophagy-related pathways. (D) Western
  blot analysis of the impact of UBE2L3 deficiency on proteins involved in the mTOR-regulated
  autophagy pathway in TNBC cells. (E) Western blot analysis of TSC2 protein stability
  in UBE2L3-deficient TNBC cells following treatment with the protein synthesis inhibitor
  CHX (20 μM). (F) Western blot analysis of TSC2 protein levels in UBE2L3-knockdown
  and control TNBC cells after treatment with MG132 for 6 hours. (G) Western blot
  analysis of the effect of UBE2L3 deficiency on TSC2 ubiquitination in TNBC cells.
  (H, I) Schematic diagrams illustrating the identification of target E3 ubiquitin
  ligases by IP/MS. (J) Co-immunoprecipitation (Co-IP) experiments reveal the endogenous
  interaction between UBE2L3 and SMURF2 in MDA-MB-231 cells. (K) Representative immunofluorescence
  images showing co-localization of UBE2L3 and SMURF2 in MDA-MB-231 cells. Scale bar,
  10 μm. (L, Q) Schematic diagrams of recombinant proteins used for bimolecular fluorescence
  complementation (BiFC) assays. (M, R) Western blot analysis of recombinant protein
  expression in HEK293T cells. (N, S) Representative immunofluorescence images showing
  protein-protein interactions in BiFC assays. Scale bar, 10 μm. (O) Co-IP experiments
  reveal the endogenous interaction between TSC2 and SMURF2 in MDA-MB-231 cells. (P)
  Representative immunofluorescence images showing co-localization of TSC2 and SMURF2
  in MDA-MB-231 cells. Scale bar, 10 μm. Error bars represent mean ± SD. ***p < 0.001
