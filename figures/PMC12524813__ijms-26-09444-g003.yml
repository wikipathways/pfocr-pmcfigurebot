figure_title: Amyloidogenic pathway of APP processing and Aβ formation.
caption: Amyloidogenic pathway of APP processing and Aβ formation. The amyloidogenic
  processing of APP involves sequential cleavage by β-secretase (BACE1) and γ-secretase,
  generating neurotoxic Aβ peptides (e.g., Aβ42). These peptides oligomerize and aggregate
  into insoluble plaques, disrupting synaptic function, triggering neuroinflammation,
  and promoting tau pathology—key events driving neurodegeneration in AD
