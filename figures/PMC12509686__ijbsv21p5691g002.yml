figure_title: Mechanistic pathway linking insulin resistance to MASLD via adiponectin-AMPK
  signaling.
caption: Mechanistic pathway linking insulin resistance to MASLD via adiponectin-AMPK
  signaling. Insulin resistance leads to decreased adiponectin levels, which suppresses
  AMPK activation in hepatocytes. This impairs ATP synthesis and enhances de novo
  lipogenesis, resulting in increased hepatic fat accumulation (fatty liver). Concurrently,
  hepatic insulin resistance disrupts glucose homeostasis, contributing to elevated
  blood glucose levels and further exacerbating metabolic dysfunction
