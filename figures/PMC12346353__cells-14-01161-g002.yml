figure_title: Multifactorial Pathophysiology of Parkinson’s Disease (PD).
caption: 'Multifactorial Pathophysiology of Parkinson’s Disease (PD). A central degenerating
  dopaminergic neuron receives converging insults from six interconnected pathways:
  (i) α-synuclein (α-syn) aggregation into Lewy bodies; (ii) mitochondrial complex-I
  failure with reactive oxygen species overload; (iii) chronic microglia-driven neuroinflammation;
  (iv) lysosomal-autophagy impairment that hampers protein/organelle clearance; (v)
  gut–brain axis signals, including dysbiotic microbiota and vagal transmission; and
  (vi) gene–environment interactions (e.g., SNCA, LRRK2, PRKN mutations plus pesticide
  or metal exposure). Bidirectional arrows emphasize crosstalk among mechanisms, underscoring
  PD as a systems disorder beyond a purely nigrostriatal dopamine deficit. LRRK2,
  leucine-rich repeat kinase 2; PRKN; Parkin RBR E3 ubiquitin-protein ligase; SNCA,
  synuclein alpha gene; ROS, reactive oxygen species'
