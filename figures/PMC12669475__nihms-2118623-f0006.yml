figure_title: Exploring the molecular mechanisms of foam cell formation through the
  protein-ligand and metabolite-mediated cell-cell communications
caption: 'A) NicheNet analysis identifies potential macrophage ligands that modulate
  inflammatory signaling in WT/Apoe−/− mice and reduce foam cell formation in LysM-DKO/Apoe−/−
  mice. B) Expression of predicted target genes in VSMCs of these identified ligands
  shown in the violin plot. C) Circos plot illustrating the down-regulated and upregulated
  cell-cell communication signals in LysM-DKO/Apoe−/− mice. D) MEBOCOST analysis reveals
  metabolite-mediated cell communication signals in both WT/Apoe−/− and LysM-DKO/Apoe−/−
  mice. E) Predominant cell-cell communication patterns observed in WT/Apoe−/− mice.
  F-G) Expression of cholesterol-producing enzymes is significantly downregulated
  in macrophage subtypes of LysM-DKO/Apoe−/− mice. H) Predominant cell-cell communication
  patterns observed in LysM-DKO/Apoe−/− mice. I) Schematic illustrating potential
  molecular mechanisms regulated by macrophage epsins in atherosclerosis progression
  (left panel). Deletion of macrophage epsins rewires these pathways, thereby inhibiting
  foam cell formation and atherosclerosis progression (right panel). Note: P values
  determined by the Wilcoxon test'
article_title: Single-Cell Analysis Reveals a Critical Role for Macrophage Epsins
  in Regulating the Origin of Foam Cells in Atherosclerosis
