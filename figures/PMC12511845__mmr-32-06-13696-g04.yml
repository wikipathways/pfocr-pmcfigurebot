figure_title: Regulation of Ang II-induced AF by HSPD1 via the PPAR signaling pathway.
caption: 'Regulation of Ang II-induced AF by HSPD1 via the PPAR signaling pathway.
  (A) Representative western blotting and protein expression of PPAR signaling pathway-associated
  proteins (B) PPARα, (C) PPARγ, (D) CPT-1 and (E) SIRT3 in CFs. (F) Cell Counting
  Kit-8 assay of CF viability. ELISA detection of the expression of the inflammatory
  factors (G) TNF-α, (H) IL-8 and (I) IL-1β in CFs. (J) Representative western blotting
  and protein expression of the AF markers (K) ANP, (L) β-MHC and (M) MMP-2 in CFs.
  *P<0.05 vs. Ang II+ si-NC; #P<0.05 vs. the Ang II+si-HSPD1-2 group. AF, atrial fibrillation;
  TZD, thiazolidinedione; CF, cardiac fibroblast; si, small interfering; NC, negative
  control; PPAR, peroxisome proliferator-activated receptor; CPT-1, carnitine palmitoyltransferase
  I; SIRT, sirtuin; ANP, atrial natriuretic peptide; MHC, major histocompatibility
  complex'
