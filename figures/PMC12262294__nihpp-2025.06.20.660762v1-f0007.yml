figure_title: Depletion of PARP1 in macrophages enhances communication between macrophages
  and NK cells
caption: (A) Chord diagrams showing the signaling interactions among cell subpopulations
  from scRNA-seq (macrophage, NK cell, T cell, and B cell) between control and Parp1
  KOLysM groups, analyzed by CellChat.(B) Bubble plots showing ligand-receptor interaction
  pathways among cell subpopulations from scRNA-seq between control and Parp1 KOLysM
  groups, analyzed by CellChat.(C) Violin plots showing expression level of M2-type
  marker genes Mrc1 and Cd136 in macrophage cluster from scRNA-seq between control
  and Parp1 KOLysM groups, analyzed by Wilcoxon Signed-Rank test (p value as indicated).(D)
  Schematic presentation showing that macrophage PARP1 is critical in the maintenance
  of adipose tissue inflammatory and metabolic homeostasis. Deficiency of PARP1 in
  macrophage not only affect macrophage, but also promotes cell-cell crosstalk among
  macrophage, preadipocyte, adipocyte and NK cell, driving the development of obesity
article_title: Role of Macrophage PARP1 in the Regulation of Crosstalk between Adipose
  Immune Cells and Adipocytes during Diet-induced Obesity
