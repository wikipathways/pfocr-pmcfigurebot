figure_title: An overview pathway showing myeloperoxidase (MPO) and its associated
  role during the pathogenesis linking lipid peroxidation and endothelial dysfunction.
caption: An overview pathway showing myeloperoxidase (MPO) and its associated role
  during the pathogenesis linking lipid peroxidation and endothelial dysfunction.
  Briefly, the human immunodeficiency virus infects cluster differentiation 4 positive
  (CD4+) T-lymphocytes, causing them to undergo pyroptosis. During pyroptosis, dying
  CD4+ T-cells and tissue-resident macrophages release pro-inflammatory cytokines
  including interleukin (IL)-6, IL-8, IL-1β, and tumor necrosis factor-alpha (TNF-α).
  These cytokines act in a paracrine manner to activate circulating monocytes and
  neutrophils. In neutrophils, cytokine signaling triggers degranulation and MPO release,
  while in monocytes, it promotes differentiation into macrophages and enhances oxidative
  burst activity. In addition, these inflammatory cytokines activate chloride channels
  in endothelial cells and other tissues. Activated monocytes and neutrophils release
  MPO and more cytokines, which sensitize hepatocytes to generate and release acute-phase
  proteins such as C-reactive protein (CRP) and serum amyloid A (SAA) in conjunction
  with reactive oxygen species (ROS) and low-density lipoprotein cholesterol (LDL-C).
  Circulating chloride ions reacts with ROS such as hydrogen peroxide (H2O2), catalyzed
  by MPO, to form hypochlorous acid (HOCl) through several steps, which generate aldehyde
  intermediates including 4-hydroxy-2-nonenal (HNE), oxysterols, and malondialdehyde
  (MDA). This illustrates the pro-oxidant role of MPO, contributing to oxidative stress,
  lipid peroxidation, and endothelial dysfunction. HOCl-mediated oxidation of LDL-C
  produces oxidized LDL-C (oxLDL-C), promoting monocyte and macrophage infiltration
  into the endothelium, foam cell formation, and subsequent endothelial injury. MPO
  also has context-dependent antioxidant functions, neutralizing pathogens during
  acute immune responses, but chronic overactivation shifts its activity towards tissue-damaging
  oxidation. In response, the immune system expresses monocytes and macrophages to
  eliminate oxLDL-C (oxLDL-C). Unfortunately, these immune cells are converted into
  atherosclerotic foam cells during this process, which contributes to endothelial
  dysfunction (Created using Microsoft PowerPoint, 2021)
