figure_title: Paillotin does not impact the Imd or Toll pathways
caption: The expression of Diptericin A (a) at 6 or 12h post-infection with Ecc15
  and Drosomycin (b) at 8h or 24h post-infection with M. luteus were monitored in
  w1118, PaiΔ41, and PaiΔ370 flies. RelishE20 and spzrm7 were used as the positive
  control. Expression was normalized to w1118 UC (unchallenged) flies set as a value
  of 1. The data shown in the figure are based on three independent experiments, with
  at least 30 flies per genotype at each time point in each experiment. Error bars
  represent SEM. Statistical analysis was performed using two-way ANOVA. For Diptericin
  A, significant effects were detected for genotype (F(3,24) = 148.1, p < 0.0001),
  time (F(2,24) = 332.8, p < 0.0001), and their interaction (F(6,24) = 38.98, p <
  0.0001). For Drosomycin, significant effects were also observed for genotype (F(3,24)
  = 72.82, p < 0.0001), time (F(2,24) = 191.5, p < 0.0001), and interaction (F(6,24)
  = 22.84, p < 0.0001). However, Tukey’s post hoc comparisons revealed no significant
  difference between w1118 and Paillotin mutants at any time point (n.s. = not significant)
article_title: 'Functional Characterization of Paillotin: An Immune Peptide Regulated
  by the Imd Pathway with Pathogen-Specific Roles in Drosophila Immunity'
