figure_title: RNAseq reveals differentially expressed genes in VGLUT-expressing DA
  neurons conserved between flies and mice
caption: (A) Annotations of adult Drosophila brain 10X single-cell RNAseq (scRNAseq)
  data via Uniform Manifold Approximation and Projection (UMAP) plots identified discrete
  clusters of dVMAT+ DA neurons. Expression of TH, DAT and dVGLUT across all 2,642
  dVMAT-expressing cells is represented, with highest expression shown in purple and
  lowest/no expression shown in gray. Specific subpopulations of dVMAT+/TH+/DAT+/dVGLUT+
  cells are highlighted by red boxes.(B) Volcano plot showing differential expression
  of genes in dVGLUT+ DA neurons compared to dVGLUT− DA neurons.(C) Gene ontology
  (GO) analysis of Drosophila scRNAseq data identifying top pathways based on differential
  gene expression in dVGLUT+ DA neurons.(D) Volcano plot showing differential expression
  of genes in mouse VGLUT2+ DA neurons compared to all DAT+ DA neurons. Additional
  analyses relating to VGLUT2+ DA neurons are shown in Figures S6 and S7 and Videos
  S1 and S2.(E) Schematic summarizing the mitochondrial findings from the comparative
  fly and mouse RNAseq studies. These data revealed overall downregulation of genes
  implicated in mitochondrial processes in both Drosophila dVGLUT+ and mouse VGLUT2+
  DA neurons. This included downregulation of mitochondrial ribosomal genes in mouse
  and overall downregulation of TCA cycle genes in flies. Among the mitochondrial
  respiratory complexes in VGLUT2+ DA, Complex I gene expression was downregulated
  in both mice and flies, while Complex IV and ATP synthase gene expression were specifically
  downregulated in mice
article_title: Sexually dimorphic mechanisms of VGLUT-mediated protection from dopaminergic
