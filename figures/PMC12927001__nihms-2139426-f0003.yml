figure_title: Microbial mass, microbial dominance, and specific microbes associate
  with mortality and with a dysregulated host response in patients with sepsis
caption: '(A) Microbial DNA mass (in picograms) in patients with sepsis who survived
  versus died. P values based on Mann-Whitney test. (B) The relative dominance of
  the most abundant microbe detected by plasma metagenomics in patients who survived
  versus died. P values based on Mann-Whitney test. (C) Non-metric MultiDimensional
  Scaling (NMDS) plot of compositional differences in circulating bacterial DNA (calculated
  based on Bray-Curtis distances) in patients with sepsis who survived (blue) versus
  died (gold). P value calculated using the Bray-Curtis dissimilarity index and PERMANOVA
  test with 1,000 permutations. (D) Over-representation analysis (ORA) of DE genes
  (FDR <0.1, corrected for multiple testing using the Benjamini-Hochberg method; n
  = 18,354 genes). ORA pathways highlighted that are enriched in patients with the
  highest microbial dominance (above the cohort mean). Pathways represent the top
  15 most significant up or down-regulated pathways identified at a padj <0.05. (E)
  Association between detection of bacterial sepsis pathogens or DNA viruses and mortality.
  P values reflect Fisher’s exact test comparing survival versus mortality between
  patients with the given pathogen or without the given pathogen; tests limited to
  pathogens present in >2 patients. Legend: * p <0.05; ** p < 0.01. Boxplot lines
  represent the median and quartile ranges. ORA pathway data are available in Supp.
  Data 6. Microbe data available for n = 129 patients'
