figure_title: The canonical cell death pathway does not regulate the size of the abdominal
  NSCs
caption: '(A) A model depicting abdominal NSCs apoptotic regulation by abdA. (B-C)
  nuclei of NSCs (marked with Dpn) in the abdominal region of Mid L3 in control(insc>mCD8GFP)
  and rescued in RHGmiRNA (insc>mCD8GFP,RHGmiRNA) are quantified in (D) for the size
  showing no significant difference. The statistical evaluation of significance based
  on an unpaired t-test is marked with asterisks, ****P<0.0001. Scale bar: 20 μm.
  More than 5 CNS were analyzed in the control and RHGmiRNA'
