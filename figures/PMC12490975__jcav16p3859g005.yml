figure_title: The biological function associated with FAMS.
caption: The biological function associated with FAMS. (A) Enrichment map showed biological
  function in high and low FAMS group through GSEA analysis. Each node represents
  enriched gene sets with p < 0.05. Node size corresponds to the number of genes within
  gene set. Edge thickness corresponds to the number of shared genes between gene
  sets. (B) Butterfly plot showed the correlation between FAMS and other pathway scores
  based on GSVA of GO and KEGG terms. (C-H) GSEA of cancer hallmark associated with
  high and low FAMS
