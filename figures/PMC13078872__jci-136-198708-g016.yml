figure_title: The RANK/RANKL pathway has critical role in TRAP+ macrophage differentiation
  and AAA disease progression in mice with clonal hematopoiesis
caption: '(A) Schematic of Tet2/Rank double-KO model. BM-derived lineage-negative
  cells from Cas9-expressing Tet2+/– mice were transduced with lentivirus particles
  expressing sgRNA/TagRFP and delivered to lethally irradiated Apoe-KO mice. One month
  after BMT, peripheral blood was collected for flow cytometric analysis. (B) Expression
  of sgRNA/TagRFP vector at 4 weeks after BMT in CD45+ cells. FSC-H, forward scatter
  height. (C) Quantitative analysis of TagRFP+ expression in cell populations derived
  from HSPCs transduced with lentiviral vectors encoding control or RANK-targeting
  sgRNA (n = 5 mice per genotype). Statistical significance was evaluated using Mann-Whitney
  U test. (D) Tracking of indels by decomposition analysis of the TagRFP+ peripheral
  blood cells revealing insertions and deletions. (E) Immunoblot analysis of RANK
  expression in BM-derived macrophages. Anti-RANK antibody detected multiple immunoreactive
  bands; the approximately 100–150 kDa band (putative modified form of RANK) is shown
  for KO validation. (F) Absolute number of WBCs, RBCs, and PLTs in both experimental
  groups (n = 6 mice per genotype). Statistical significance was evaluated using an
  unpaired, 2-tailed Welch’s t test. (G and H) In vitro differentiation of BM-derived
  macrophages. Representative images and quantification of the TRAP+ cell-to-macrophage
  ratio after RANKL stimulation from 4 independent biological replicates per genotype.
  Original magnification, ×10. ***P < 0.001, by Mann-Whitney U test. (I) Representative
  ultrasound images of the abdominal aorta at 0 (baseline) and 4 weeks after AngII
  infusion (n = 8 mice per genotype). (J) Quantification of abdominal aortic diameter
  at 0 (baseline), 2, and after 4 weeks of AngII infusion in control and RANK-KO mice
  (n = 8 mice per genotype). *P < 0.05 and ***P < 0.001, by 2-way, repeated-measures
  ANOVA with Šidák’s multiple-comparison test. (K) Representative images of Elastica
  van Gieson staining of abdominal aortic tissue. Scale bars: 100 μm. (L) Elastin
  fiber thickness and rupture counts in J (n = 8 mice per genotype). *P < 0.0 and
  **P < 0.01. Statistical significance for elastin fiber thickness was evaluated using
  a 2-tailed, unpaired Student’s t test, and for rupture counts using a 2-tailed Mann-Whitney
  U test'
