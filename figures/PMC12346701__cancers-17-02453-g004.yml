figure_title: Novel treatment strategies for KRAS-mutated PDAC.
caption: 'Novel treatment strategies for KRAS-mutated PDAC. Specific mutation-targeted
  strategies are currently being investigated, including selective inhibitors for
  KRAS G12C (sotorasib, adagrasib), KRAS G12D (MRTX1133, HRS-4642, PROTACs) and KRAS
  G12V (ternary complex formation with cyclophilin A, KRAS G12V and KRAS-inhibitor).
  Pan-RAS inhibitors (e.g., BI-2865, ADT-007, RMC-6236, YL-17231) target a broader
  range of KRAS isoforms, which may be more effective in heterogenous PDAC. Additional
  approaches involve RNA interference (siRNA therapies such as siG12D-LODER, nanoparticle-based
  delivery systems, PLGA microparticles, EFTX-G12V, and iExosomes), miRNAs (miR-217,
  miR-96, miR-873), and modulation of metabolic and autophagy pathways (e.g., devimistat,
  UBL4A, UAMC-2526). Based on [61,66,67,70,74,80,85,86,89,90,106,108,109,112,114,117,119,125,128,131,176,181,185].
  Abbreviations: CypA—Cyclophilin A; PLGA—Poly(lactic-co-glycolic acid); siRNA—Small
  interfering RNA; miRNA—MicroRNA; KRAS—Kirsten rat sarcoma viral oncogene homolog;
  PDAC—Pancreatic ductal adenocarcinoma'
