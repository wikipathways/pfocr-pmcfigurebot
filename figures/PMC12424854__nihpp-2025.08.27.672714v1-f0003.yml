figure_title: High salt diet-induced hypertension dynamically regulates biological
  pathway activity across organs
caption: A. Mean pathway activity heatmap of 50 Hallmark pathways across cortex, medulla,
  heart, and liver at days 7, 14, 21, and 35 after initiation of a high salt (HS)
  diet compared to normal salt (NS) controls. Pathways are highlighted as functional
  groups, including metabolism, inflammation and death, cell cycle, and other clustered
  along the y-axis. B. Euclidean distances from baseline pathway profiles plotted
  over time, representing the magnitude of transcriptomic remodeling in each organ.
  The medulla shows the greatest divergence, followed by the heart, cortex, and liver.
  C. Stacked bar charts enumerating up-regulated (red) and down-regulated (blue) Hallmark
  pathways at each time point for each organ. Numeric labels indicate pathway counts,
  highlighting distinct kinetics of pathway engagement across tissues. D. Heatmaps
  showing Pearson correlation between pathway profiles across tissues (cortex, medulla,
  heart, and liver) at each time point (days 7, 14, 21, and 35). Each panel compares
  all organ pairs for a single time point, revealing similarities and differences
  in pathway responses among organs after the HS diet. CX, cortex; MD, medulla; LV,
  liver; HR, heart; D7, day 7; D14, day 14; D21, day 21; and D35, day 35 time points.
  n = 6 male rats per group
