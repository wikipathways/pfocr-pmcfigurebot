figure_title: Conformational changes upon NBD dimerization in outward-facing TAP(EQ)
  enable substrate release
caption: (A) Global conformational changes upon NBD dimerization as viewed from the
  cytoplasm. Superposition of NBD1 in the NBD-separated (white) and NBD-dimerized
  (colored) conformations. The arrow indicates the movement of NBD2.(B) Local conformational
  changes in the NBDs upon NBD dimerization. Superposition of NBD1 and NBD2 individually
  in the NBD-separated (white) and NBD-dimerized (colored) conformations. The D-loop
  is highlighted, and the arrow indicates movement of the D-loop to interact with
  ATP in the degenerate site.(C) Zoom-in view of the degenerate nucleotide-binding
  site in NBD1. Hydrogen bonds are represented as dashed lines.(D and E) The TAP translocation
  pathway in the 9-mer peptide-bound inward-facing (D) or outward-facing (E) conformation
  as viewed from the ER lumen. The helices of TAP are numbered and shown as colored
  cartoon tubes. The main-chain backbone of the peptide substrate is shown as silver
  sticks. The N-pocket and C-pocket are boxed as indicated, and residues that comprise
  each pocket are shown as sticks.(F) Superposition of the TAP translocation pathway
  in the inward-facing peptide-bound (silver) and outward-facing (colored) conformations.
  Arrows indicate movement of the TAP helices.(G and H) Conformation of TAP TM3 in
  the 9-mer peptide-bound inward-facing (G) or outward-facing (H) conformation as
  viewed from the membrane.(I) Superposition of TAP TM3 in the inward-facing peptide-bound
  (silver) and outward-facing (colored) conformations.(J and K) Zoom-in of the TAP
  N- (J) and C- (K) pockets in the 9-mer peptide-bound inward-facing (left) or outward-facing
  (right) conformation. Hydrogen bonds are shown as dotted lines. The alpha-carbons
  of the peptide substrate are numbered. The peptide from the inward-facing state
  is superimposed upon the outward-facing state and is represented as transparent
  sticks (right). Arrows indicate movement of the TAP TM3.See also Figures S2–S4
