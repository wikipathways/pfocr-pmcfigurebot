figure_title: Graphical summary of MDS phenotypes and their associated molecular pathways
  and genes.
caption: Graphical summary of MDS phenotypes and their associated molecular pathways
  and genes. Common manifestations of MDS phenotypes are clustered as nervous system
  defects [4,18,60,61,62,63,64,65], facial dysmorphic features [20,23,24,25,27,37,62,64,66,67],
  physical and other manifestations [35,38,49,62,64], cardiac abnormalities [39,61,62],
  liver defects [62], gastrointestinal defects [62,68], and kidney defects [39,62].
  Gene names associated with each specific phenotype based on clinical studies are
  listed in parentheses, and the related molecular pathways, indicated with an arrow
  from an appropriate bullet point, are on the left or right side. Curly brackets
  indicate molecular pathways applying to all the covered bullet points. Parenthetical
  gene names at the bottom of purple box apply to all bullet points. Genes that are
  encoded in the MDS locus (see Figure 1) are in blue font, while genes in gray are
  predicted to be associated with each phenotype based on pathway analyses using differentially
  expressed genes determined by a multi-omics study [61]. Figure was created using
  BioRender [55]
