figure_title: SSF activates the NF-κB signaling pathway to exert immunomodulatory
  effects.
caption: 'SSF activates the NF-κB signaling pathway to exert immunomodulatory effects.
  (A) NF-κB reporter gene activity in WT and MyD88CRISPR−/− THP1-Lucia NF-κB cells
  stimulated with LPS (500 ng/mL) and SSF (50, 100, 200 μg/mL) for 18 h. Immunoblotting
  analysis of NF-κB pathway protein expression in WT (B) and MyD88CRISPR−/− (C) THP1-Lucia
  NF-κB cells stimulated with LPS and SSF for 0–24 h. (D) Protein expression of p-IKKa/β,
  IκBα, and p-NF-κB p65 in tissues of SSF-treated mice. Relative quantification of
  p-IKKa/β/GAPDH (E), IκBα/GAPDH (F), and p-NF-κB p65/GAPDH (G). Data are presented
  as mean ± SEM (n = 3). # p < 0.05, ### p < 0.001 vs. the Con group; * p < 0.05,
  *** p < 0.001 vs. the LPS/Mod group'
