figure_title: Absolute Metabolite Associations with Sleep and Circadian Disruption
  in Pre-Clinical Rodent Models
caption: 'Absolute Metabolite Relationships with Sleep and Circadian Disruption in
  Pre-Clinical Rodent Models. A. Absolute metabolites were annotated at the level
  of Sub Class (Class 2), rodent/pre-clinical model systems were classified based
  on if they were aimed to produce sleep or circadian disruption, and metabolite responses
  were stratified by sample type. Single amino acids were also referred to as amino
  acids in Class 2 grouping for clarity (in lieu of peptides), but two or more amino
  acids joined by peptide bonds were referred to as dipeptides or tripeptides. B.
  A subset of metabolites was also annotated at the level of group/category (Class
  3), classified by rodent/pre-clinical model sleep or circadian disruption, and stratified
  by sample type in pre-clinical/rodent models. Red circles indicate a significant
  increase in concentration or expression and blue indicate a significant decrease
  in concentration or expression. The size of the circle is scaled so metrics that
  are more frequently mentioned appear larger, and observations were required to be
  mentioned two or more times to appear in the figure. Abbreviations. C24: 24-Carbon,
  GI: Gastrointestinal. Please see Supplemental Figure S2 for absolute metabolite
  and metabolic pathway responses by sleep pathology group (defined in methods) in
  pre-clinical studies, and Supplemental Table S4 for tabulated absolute metabolite
  results used to make figures, as well as Class 1, 2, and 3 (with selected metabolites)
  hierarchical categorizations of metabolites'
