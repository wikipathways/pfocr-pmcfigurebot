figure_title: Pleiotropy among genes under selection in M. lucifugus between DNA-damage
  responsive genes and DNA-only VIPs
caption: A-B) Volcano plots of genes that are differentially expressed in M. lucifugus
  after 6 hours (A) and 18 hours (B) of treatment with 100uM neocarzinostatin (NCS).
  C-D) Pathway-level Gene Set Enrichment Analysis (GSEA) of genes differentially expressed
  at 6 and 18 hours post-treatment. E) Upset plot between genes that are differentially
  expressed after NCS treatment and DNA-only VIPs; the hypergeometric P-value of the
  intersection is shown. F) Pathway-level overrepresentation analysis of genes that
  are DNA-only VIPs and are also differentially expressed in response to NCS treatment.
  G) Pathway-level overrepresentation analysis of genes identified as under selection
  in M. lucifugus via ABSREL that are DNA-only VIPs and are also differentially expressed
  in response to NCS treatment
