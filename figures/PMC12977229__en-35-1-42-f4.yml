caption: Electroacupuncture downregulates the cGAS–STING pathway and attenuates neuroinflammatory
  signaling in the hippocampus. (A) Representative Western blot images showing hippocampal
  protein levels of cGAS, STING, NF-κB p65, IRF3, and IL-1β. (B~F) Quantitative analysis
  of protein expression normalized to α-Tubulin. (G, I) Immunofluorescence micrographs
  depicting hippocampal cGAS and STING expression across groups. (H, J) Quantification
  of mean fluorescence intensity for cGAS and STING. (n=5 biological replicates; *p<0.05,
  **p<0.01, ***p<0.001; ns, not statistically significant)
