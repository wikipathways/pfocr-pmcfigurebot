figure_title: The schematic diagram of the possible mechanism of HHcy hypertension.
caption: The schematic diagram of the possible mechanism of HHcy hypertension. This
  diagram illustrates a cascade of metabolic and vascular changes triggered by a high-methionine
  diet (HMD). The yellow, blue, and green spheres represent linoleic acid (LA), gamma-linolenic
  acid (GLA), and arachidonic acid (AA), respectively, all of which are reduced (↓)
  in the blood following HMD. Methionine is metabolized into homocysteine (Hcy), represented
  by purple circles in plasma, indicating elevated levels (↑). The central red structure
  represents the enzyme CYP1A1, whose activity is increased under the influence of
  high methionine, catalyzing the conversion of AA into 20-hydroxyeicosatetraenoic
  acid (20-HETE). The yellow structure represents 20-HETE, whose levels are increased
  (↑) in the blood as a result of this enzymatic activity. 20-HETE activates downstream
  signaling by binding to its receptor, GPR75, which is shown as a colorful transmembrane
  protein. Upon activation by 20-HETE, GPR75 initiates intracellular signaling cascades,
  notably the MAPK pathway. In endothelial cells, this results in elevated expression
  of NRAS and ERK1, with MEK1 ultimately contributing to endothelial dysfunction and
  the development of hypertension
article_title: CYP1A1/20-HETE/GPR75 Axis-Mediated Arachidonic Acid Metabolism Dysregulation
  in H-Type Hypertension Pathogenesis
