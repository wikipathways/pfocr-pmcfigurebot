figure_title: Spatially resolved regulatory programs and therapeutic vulnerabilities
  across GBM tumors
caption: (A) Proportions of spots assigned to malignant and non-malignant metaprograms
  (MPs) across 26 GBM ST samples. Differential (B) TF (C) pathway activity across
  MPs for each sample. Dot color shows the mean activity change of a MP relative to
  other MPs, and dot size indicates significance (–log10 adjusted p). (D) Predicted
  drug response profiles across MPs. Color denotes relative sensitivity and dot size
  indicates significance. Dot plot of drug scores significantly enriched in specific
  MP. Significance was determined using a two-sided Wilcoxon test (effect size0 >
  2, P < 0.05, Benjamini–Hochberg corrected)
