figure_title: Mechanisms of T cell–mediated rejection and pharmacologic targets after
  liver transplantation.
caption: Mechanisms of T cell–mediated rejection and pharmacologic targets after liver
  transplantation. Rejection after LT largely depends on T cell-mediated pathways
  initiated by allorecognition, in which donor or recipient APCs present donor antigens.
  Biological agents act at this stage by depleting activated T cells. Following antigen
  recognition via co-stimulatory signaling, the calcineurin–NFAT–IL-2 axis is activated,
  promoting cytokine production and T cell proliferation; this pathway is inhibited
  by CNIs. Activation of the mTORC1 pathway by IL-2 and growth factor signaling leads
  to T cell clonal expansion and differentiation, which is blocked by mTOR inhibitors,
  whereas antimetabolites suppress T cell clonal expansion. Corticosteroids suppress
  the production of cytokines and chemokines that recruit inflammatory cells. APC,
  antigen-presenting cell; Ca, calcium; CNI, calcineurin inhibitor; HIF-1α, hypoxia-inducible
  factor 1α; IL-2, interleukin 2; LT, liver transplantation; mTOR, mechanistic target
  of rapamycin; mTORC1, mechanistic target of rapamycin complex 1; NFAT, nuclear factor
  of activated T cells
