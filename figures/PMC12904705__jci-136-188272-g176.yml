figure_title: PDGFRβ signaling cooperates with TGF-β signaling to control myocyte
  morphology
caption: '(A) Experimental design for the in vitro cell-mixing experimental procedure:
  Muscle progenitor cells from ControlMyoG, PdgfrbMyoG-D849V, and WT mice were cultured
  either separately or as mixed populations, and myotube/chimeric myotube formation
  was assessed by MyoGtdTomato fluorescence. Panel A was created using BioRender.
  (B) Representative MyoGtdTomato images showing myotube development in the cultures
  described in A. (C) Fusion index quantification from the cultures in B (n = 3 mice/group).
  (D) Quantification of nuclei per myotube from the cultures in B (n = 3 mice/group).
  (E) Representative F-actin staining of myocyte morphology isolated from ControlPax7,
  PdgfrbPax7-KO, and PdgfrbPax7-D849V mice. (F) Quantification of myocyte spreading
  from the cultures in E (n = 3 mice/group). (G) Quantification of myocyte spreading
  from the cultures in H, assessing PDGFRβ activity and TGF-β pathway inhibition (n
  = 4 mice/group). (H) Representative F-actin staining of ControlPax7 and PdgfrbPax7-D849V
  myocytes treated with vehicle or SB431542 (5 μM). (I) Representative MyHC-stained
  images showing myotube formation in ControlPax7 and PdgfrbPax7-D849V progenitor
  cells treated with vehicle or SB431542. (J) Fusion index quantification corresponding
  to the cultures shown in I (n = 4 mice/group). Data represent the mean ± SEM. Statistical
  significance was determined using 1-way ANOVA (C and F) or 2-way ANOVA (D, G, and
  J) followed by Šídák’s, Tukey’s, or Dunnett’s multiple-comparison test. Scale bars:
  100 μm'
article_title: PDGFRβ signaling restrains myocyte function to limit the regenerative
