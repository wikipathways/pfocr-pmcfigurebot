figure_title: Gene expression and pathway analysis by miR-3127 groups.
caption: Gene expression and pathway analysis by miR-3127 groups. (A) Uniform manifold
  approximation and projection dimension reduction plot showing mRNA space color-coded
  by miR-3127 expression status. (B) Volcano plot displaying DESeq2 results for mRNA
  expression limited to miR-3127 target genes. (C) Volcano plot displaying DESeq2
  results for overall mRNA expression considering the 50 most significant genes out
  of 60,660 genes, with the top 10 most significant genes labeled. (D) Bar plot illustrating
  the proportion of differentially expressed genes (DEGs) across functional families,
  including cell differentiation markers (CDM), cytokines and growth factors (CGF),
  homeodomain proteins (HP), oncogenes (O), protein kinases (PK), translocated cancer
  genes (TCG), transcription factors (TF), and tumor suppressors (TS). (E) Correlogram
  presenting normalized enrichment scores in descending order from left to right
