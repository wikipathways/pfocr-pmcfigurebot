figure_title: Cachexia is associated with a pro-inflammatory tumor microenvironment
caption: A. Ingenuity Pathway Analysis (IPA) comparing tumor transcriptomics between
  CACS and NCACS mice. B. Venn-diagram showing the results from KL mice tumor transcriptomics
  Gene Set Enrichment Analysis (GSEA) comparing CACS to NCACS (blue) and tumor proteomics
  from patients with low and high body mass index (BMI) in the CPTAC cohort (red).
  C. Heatmap that shows the differential expression of cytokines relevant to cachexia
  in tumors from CACS and NCACS mice. D. Volcano plot comparing cytokine levels measured
  by Luminex in tumor lysates from CACS and NCACS. E. Immunohistochemistry (IHC) for
  p-STAT3 (Tyr705) in the KL tumors from CACS and NCACS mice. F. Quantification of
  the positive cells per square millimeter in the tumor p-STAT3 (Tyr705) IHC of CACS
  and NCACS KL mice. G. Relative expression of p-STAT3 (Tyr705) comparing tumor phospho-proteomics
  from patients with low and normal BMI in CPTAC cohort. Comparisons in D, F, G were
  done with Wilcoxon's test. Comparisons in M and O were performed with one-way ANOVA
  followed by Tukey’s multiple comparisons test. Individual data points are independent
  biological replicates unless otherwise stated
article_title: JAK1/2 Inhibition Delays Cachexia and Improves Survival through Increased
