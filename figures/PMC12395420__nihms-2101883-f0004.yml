figure_title: Myelin-axon interface proteome reveals protein abnormalities in AD postmortem
  brains
caption: A-B. Bar charts showing major themes from pathway enrichment analysis using
  the ActivePathways method, in (A) paranode proteomes and (B) myelin-axon interface
  proteomes. Bar length represents the number of pathways identified in each theme,
  with colors indicating FDR values. The names of each bar are curated based on the
  main pathways of each subnetwork. Pie charts indicate the number of pathways in
  AD versus control datasets within each subnetwork. Themes related to (A) paranode,
  myelin, axon and amyloid beta, as well as (B) metabolism and myelin-axon are highlighted
  in red, blue and magenta. C-D. Scatter plots of (C) paranode-enriched proteomics
  and (D) myelin-axon interface proteomics in AD human brains, ranked by the ratio
  of anti-bait protein samples versus no-antibody controls. The gene names of the
  top proteomic hits are labeled; novel top hits were further examined by immunofluorescence
  expansion microscopy (see Figure 6). E. Schematic outlining the statistical pipeline
  used to compare CASPR-labeled or MAG-labeled proteomes between AD human brains and
  unaffected controls (quantifications were performed two-sided). F-G. Scatter plots
  showing (F) PAP (paranode-Alzheimer’s proteome) and (G) MAP (myelin–axon interface
  Alzheimer’s proteome) hits that are up- or down-regulated in AD compared to controls.
  Gene names of the top novel hits examined by expansion microscopy are shown (see
  Figure 6). H. Enrichment map of pathways and processes for differentially expressed
  PAP and MAP proteins. The network indicates pathways as nodes connected by edges
  and grouped into subnetwork themes if the pathways share many genes. I. IPA pathway
  analysis showing the top 10 central nervous system-related signaling pathways enriched
  in PAP and MAP
