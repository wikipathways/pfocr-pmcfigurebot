figure_title: 4HCH inhibits the EGFR/AKT/ERK1/2 signaling pathway.
caption: 4HCH inhibits the EGFR/AKT/ERK1/2 signaling pathway. (A,B) Volcano plots
  showing differentially expressed genes (DEGs) in RD cells treated with 4HCH under
  normal (C vs. T) and HCoV-OC43-infected (V vs. VT) conditions. DEGs were selected
  based on adjusted p < 0.05 and fold change > 2. (C) Schematic of the Connectivity
  Map (cMAP) analysis to identify compounds with mechanisms of action similar to 4HCH.
  (D) Functional overlap analysis of cMAP-identified compounds, highlighting EGFR
  inhibitors. (E) Western blot analysis of EGFR, phosphorylated EGFR (p-EGFR), AKT,
  phosphorylated AKT (p-AKT), ERK1/2, and phosphorylated ERK1/2 (p-ERK1/2) in HCoV-OC43-infected
  RD cells treated with 4HCH or the EGFR inhibitor Vandetanib for 24 h. GAPDH served
  as an internal control. Data are presented as mean ± standard deviation (SD). Statistical
  significance is indicated as * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p
  < 0.0001 compared to the untreated HCoV-OC43-infected group. All experiments were
  independently performed in triplicate. A Student’s t-test was used to evaluate statistical
  significance between the untreated HCoV-OC43-infected group and the 4HCH- or Vandetanib-treated
  groups
