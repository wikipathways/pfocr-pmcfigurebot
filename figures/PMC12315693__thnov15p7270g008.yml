figure_title: Transcriptomic and metabolomic profiles under the XZ1606 treatment of
  liver fibrosis in the CDAA-HFD fibrosis model.
caption: Transcriptomic and metabolomic profiles under the XZ1606 treatment of liver
  fibrosis in the CDAA-HFD fibrosis model. (A-D) Transcriptomic analysis. (A) Hierarchical
  clustering of transcript expression data showing differential gene expression patterns
  across control, CDAA-HFD, and XZ1606 treatment groups (n = 4 for each group). (B)
  Volcano plots showing differential gene expression between the CDAA-HFD model vs.
  control and XZ1606 treatment vs. CDAA-HFD model. Upregulated genes are shown in
  red and downregulated genes in blue. (C) KEGG pathway enrichment analysis of upregulated
  genes in the CDAA-HFD model vs. control group, highlighting fibrotic pathways. (D)
  KEGG pathway enrichment analysis of downregulated genes in the XZ1606 treatment
  group vs. CDAA-HFD model, showing the reversal of fibrotic pathways by XZ1606. (E-G)
  Metabolomic analysis (n = 3, 3 and 2 samples for control, CDAA-HFD and XZ1606 treatment
  groups, respectively). One sample from the treatment group (originally n = 3) did
  not pass the quality control and was removed from analysis. (E) Volcano plots showing
  differential metabolite expression between the CDAA-HFD model vs. control. (F) Volcano
  plots showing differential metabolite expression between the XZ1606 treatment vs.
  CDAA-HFD model. (G) Hierarchical clustering of metabolomics data showing differential
  metabolite expression patterns across the groups
