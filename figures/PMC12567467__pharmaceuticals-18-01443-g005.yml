figure_title: Pharmacological activation of ClpP by ZG111, ONC201, and ONC212 induces
  mitochondrial dysfunction in PDAC.
caption: Pharmacological activation of ClpP by ZG111, ONC201, and ONC212 induces mitochondrial
  dysfunction in PDAC. Mechanistic effects include inhibition of OXPHOS, mitochondrial
  collapse, ATP depletion, cell cycle arrest, and ROS accumulation associated with
  ER stress and activation of the JNK/c-Jun pathway. ClpP expression also correlates
  with patient overall survival, highlighting its dual role as a prognostic biomarker
  and therapeutic target
