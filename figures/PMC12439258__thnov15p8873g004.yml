figure_title: Proteomic analysis of CB1R-mediated Ca2+ regulation and its downstream
  pathways.
caption: Proteomic analysis of CB1R-mediated Ca2+ regulation and its downstream pathways.
  (A) Schematic diagram of the proteomic analysis. (B) Volcano plot showing differentially
  expressed proteins between Cnr1-cKO and Cnr1-ctrl groups with 135 upregulated and
  98 downregulated. (C) Gene Set Enrichment Analysis (GSEA) indicating significant
  upregulation of the oxidative phosphorylation pathway in the Cnr1-cKO group. Normalized
  enrichment score (NES) = 1.79, **p < 0.001. (D) Gene Ontology (GO) enrichment analysis
  showing that differentially expressed proteins are primarily involved in ATP metabolism,
  ROS regulation, mitochondrial transmembrane transport, and other mitochondrial-related
  biological processes. (E) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway
  analysis highlighting signaling pathways associated with nerve repair, with significant
  enrichment in the calcium signaling pathway (highlighted in red). (F) Heatmap displaying
  expression levels of key differentially expressed proteins (including Slc25a5, Gna14,
  and Atp5mg) between Cnr1-cKO and Cnr1-ctrl mice at 14 days post-injury. (G) Intersection
  analysis of genes enriched in the GSEA calcium signaling pathway and the KEGG oxidative
  phosphorylation pathway with the mitochondrial gene database (MitoCarta) identified
  Slc25a5 (Ant2) as the only overlapping gene. (H) Western blot analyzed the expression
  of ANT2 after CB1R knockdown (siCnr1). (I) Western blot analysis of ANT2 expression
  with or without ω-Conotoxin administration. ANT2, adenine nucleotide translocase
  2
