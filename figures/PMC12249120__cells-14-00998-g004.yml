caption: 'The levels of proteins involved in insulin singling pathway, including glycogen
  synthase kinase 3—GSK-3 (A), phosphorylated glycogen synthase kinase 3—pGSK3 (Ser9)
  (B), insulin receptor substrate 1—IRS-1 (D), phosphorylated insulin receptor substrate
  1—pIRS1(Ser307) (E), protein kinase B—Akt (G), phosphorylated protein kinase B—pAkt
  (Ser473) (H), Akt substrate of 160 kDa—AS160 (J), and phosphorylated Akt substrate
  of 160 kDa—pAS160 (Thr642) (K) as well as pGSK-3/GSK-3 (C), pIRS-1/IRS-1 (F), pAkt/Akt
  (I), and pAS160/AS160 (L) ratios in H9c2 cardiomyocytes after 18 h incubation with
  palmitate (PA; 300 μM) and/or cannabigerol (CBG; 10 μM) and 10 min incubation with
  insulin (INS; 100 nM). The levels of the abovementioned proteins are presented as
  percentage differences compared to the control group which was set as 100%. The
  data are expressed as mean values ± SD and are based on four independent determinations
  in each group; a p < 0.05 indicates a significant difference: the control group
  in comparison to the examined group; b p < 0.05 indicates a significant difference:
  the INS group in comparison to the examined group; and c p < 0.05 indicates a significant
  difference: the PA group in comparison to the PA + CBG + INS group'
