figure_title: Presumed model of water and Na+ dynamics in V.
caption: 'Presumed model of water and Na+ dynamics in V. marina. A. Daytime: Opened
  stomata trigger transpiration-dependent water uptake, drawing water and Na+ into
  the root. But the apoplastic barrier blocks Na+ ions and let only water be transported
  to the leaf through xylem. In addition, the upregulated SOS2 turns SOS1 on, triggering
  active excretion of Na+ out of the root. B. Nighttime: Closed stomata stops transpiration-dependent
  water uptake. Though Na+ may passively flow into the root, the apoplastic barrier
  still blocks Na+. Given transpiration is stopped, the downregulated SOS2 turns SOS1
  off, saving the energy cost of SOS pathway'
