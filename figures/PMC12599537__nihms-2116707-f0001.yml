figure_title: DMPA reduces DSG1 gene expression
caption: Genome-wide gene expression profiles in vaginal tissue from estrus-stage
  (n = 3) and DMPA-treated (n = 3) mice were compared using limma and Ingenuity Pathway
  Analysis (IPA). A) Volcano plot identifying DMPA-modulated gene expression. B) Hierarchical
  clustering details differential gene expression with FDR-adjusted P value < 0.05
  in DMPA-treated mice and mice in estrus. C) 20 most up- and down-regulated genes
  in DMPA-treated mice. D) IPA identified diseases and biological functions associated
  with DMPA-modulated genes. IPA also identified E) canonical pathways activated and
  inhibited by DMPA and F) genes modulated in the selected canonical pathways. G)
  Potential upstream regulators of DMPA effects in vaginal tissue. H) Target genes
  identified as modulated by MPA. I) Upstream regulators of Dsg1a expression. J) Identified
  target genes involved in EFNA3-mediated pathway. DMPA, depot medroxyprogesterone
  acetate; DSG1, desmoglein 1; EFNA3, Ephrin-A3; MPA, medroxyprogesterone acetate.
  Upregulated genes/pathways (light red) and downregulated genes/pathways (light blue)
