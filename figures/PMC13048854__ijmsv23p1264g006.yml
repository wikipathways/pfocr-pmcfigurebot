figure_title: Investigation of how silencing CHGA and UCHL1 expression affects epithelial-mesenchymal
  markers and cell invasion through NFκB, ERK, and Rho pathways in oxaliplatin-resistant
  HCT-116/OxR cells.
caption: Investigation of how silencing CHGA and UCHL1 expression affects epithelial-mesenchymal
  markers and cell invasion through NFκB, ERK, and Rho pathways in oxaliplatin-resistant
  HCT-116/OxR cells. (A) Western blot analysis was performed to measure the changes
  in EMT-related marker proteins, including β-catenin, cyclin D, cyclin E, vimentin,
  and Twist, following the suppression of CHGA and UCHL1 expression. (B) The Rho/ERK/NFκB
  signaling pathway was analyzed under identical experimental conditions. β-actin
  was used as a loading control. Protein expression levels were quantified by densitometric
  analysis, with the untreated control group ratio normalized to onefold. Results
  are presented as mean ± SD, with statistical significance set at *p < 0.05
article_title: Expression of ubiquitin carboxyl-terminal hydrolase isozyme L1 and
  chromogranin A regulated via histone-modification through Rho/ERK/NFκB signaling
  in oxaliplatin-resistant colorectal cancer cells
