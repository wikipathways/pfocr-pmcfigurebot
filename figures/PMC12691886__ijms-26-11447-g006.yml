figure_title: Conceptual model of OA development centered on the MDP–cytokine–protease
  triad, illustrated using the “rock–paper–scissors” analogy and their self-amplifying
  interactions.
caption: Conceptual model of OA development centered on the MDP–cytokine–protease
  triad, illustrated using the “rock–paper–scissors” analogy and their self-amplifying
  interactions. Mechanical loading or early matrix disruption releases ECM fragments
  (the “rock”), which act as DAMPs to trigger pro-inflammatory cytokine signaling
  (the “paper”) and activate intracellular pathways (e.g., MAPK/ERK, NF-κB). These
  signals upregulate proteolytic enzymes (the “scissors”), driving aggrecan and collagen
  degradation and generating further matrix-derived fragments. The resulting self-amplifying
  cycle of mechanically driven inflammation (termed “mechaflammation”) and matrix
  loss perpetuates early cartilage dysregulation and OA progression. Oxidative stress,
  driven by ROS and RNS such as superoxide, hydrogen peroxide, and nitric oxide, amplifies
  the inflammatory–catabolic loop. In early-stage OA, these species potentiate cytokine
  signaling (IL-1β, TNF-α), enhance the activation of matrix-degrading proteases (MMPs,
  ADAMTS), and further promote chondrocyte stress and matrix breakdown. Targeted interventions
  that interrupt one or more nodes of this loop, such as load modification, PRR/TLR
  antagonism, selective protease inhibition, or antioxidant strategies, represent
  candidate disease-modifying approaches
