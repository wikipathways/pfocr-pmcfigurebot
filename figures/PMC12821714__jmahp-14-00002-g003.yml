  Future directions are presented according to the two country archetypes, illustrating
  tailored strategies to improve service provision, expand community-based support,
  strengthen multidisciplinary approaches and enhance reimbursement and policy mechanisms.
  This visual framework illustrates how tailored interventions can support functional
  and patient-centred outcomes in different healthcare contexts
