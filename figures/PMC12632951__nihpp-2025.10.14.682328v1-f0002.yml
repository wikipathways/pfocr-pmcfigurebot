figure_title: Genotype-immunophenotype relationships in BRAF-mutant AML clones
caption: 'A) Clonographs from 3 representative BRAF-mutant AML patients. Clones were
  quantified and denoted in columns (upper bar plot) with genotype of the clone depicted
  in bottom heatmap. Zygosity of mutation in heatmap denoted as wild-type (WT; beige),
  heterozygous (orange), or homozygous (red). BC) UMAP of cells from BRAF-mutant AML
  patient samples (n=7) clustered by immunophenotype. Cells are denoted by (B) absence
  (grey) or presence of class I V600 (dark blue), class II G469 (green), or class
  III D594 (purple) BRAF mutations or (C) absence (grey) or presence of NRAS (red),
  PTPN11 (black), KRAS (yellow), or BRAF (blue) mutations. D-G) UMAPs (D, F) and corresponding
  violin plots (E,G) of cells from A denoting low (grey) or high (purple) expression
  of CD34 (D,F) or CD11b (E,G) with colors in F and G denoted by genotype: WT (grey),
  NRAS (red), PTPN11 (black), KRAS (yellow), BRAF V600 (dark blue), BRAF G469 (green),
  and BRAF D594 (purple). Each dot within violin plot represents a cell. H) UMAPs
  of cells from A (n=7 samples) and BRAF-WT/RAS-mutant cells (n=6) clustered by immunophenotype.
  Cells are denoted by absence (grey) or presence of BRAF (blue) or other RAS pathway
  (red) mutations. IJ) Faceted UMAP from (H) denoting BRAF-mutant cells (l) and BRAF-WT/RAS-mutant
  cells (J) with low (grey) or high (red) expression of CD34. K) Corresponding violin
  plot for CD34 expression from cells in IJ. LM) Faceted UMAP from (H) denoting BRAF-mutant
  cells (L) and BRAF-WT/RAS-mutant cells (M) with low (grey) or high (red) expression
  of CD11b. N) Corresponding violin plot for CD11b expression from cells in LM. Asterisks
  denote P <0.05, *; P<0.01, **; P<0.001, ***, P<0.0001, **** (EGKN)'
