figure_title: Schematic of proposed pathway by which cardiomyocyte YAP represses cardiac
  inflammation and fibrosis
caption: AngII and other agonists increase YAP activation in cardiomyocytes. YAP signals
  to repress MEF2 regulated gene expression. Thus when YAP is deleted (down regulated,
  turned off), MEF2 target genes are upregulated. This includes genes involved in
  differentiation as well as cJun, CaMKII and TLR4, all known to contribute to cardiac
  inflammation. CaMKII and inflammation also feedback to further enhance MEF2 activation
article_title: Cardiomyocyte YAP represses myocardial inflammation and fibrosis and
