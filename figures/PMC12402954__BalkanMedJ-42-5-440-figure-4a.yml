figure_title: Knockdown of HIF-1α inhibited the EET of OCSCs induced through hypoxia
  and inhibited VM formation through PI3K and Hedgehog signaling pathway.
caption: |-
  Knockdown of HIF-1α inhibited the EET of OCSCs induced through hypoxia and inhibited VM formation through PI3K and Hedgehog signaling pathway.(a). 740 Y-P and LY294002 were added to the transfected SK-OV-3 OCSCs, and then they were placed in an hypoxic environment. PI3K pathway protein expressions were detected using Western blot. 740 Y-P increased p-PI3K and p-AKT expressions after 740 Y-P intervention, and decreased after LY294002 treatment. (b) The transfected SK-OV-3 OCSCs were added with 740 Y-P and LY294002, and then placed in an hypoxic environment. Hedgehog pathway proteins were detected using Western blot. Smo, SHH and Gli1 expressions increased after Purmorphamine intervention and decreased after Cyclopamine treatment. (c) E-cadherin, N-cadherin and VE-cadherin protein expressions were detected by Western blot. After hypoxia, E-cadherin expression lessened, N-cadherin and VE-cadherin expressions elevated. After HIF-1α knockdown, the protein levels were significantly reversed. (d-f) VM ability was detected by matrigel 3D culture experiment. The number of branching points and 3D channels increased significantly under hypoxic conditions, and decreased significantly after HIF-1α knockdown (× 10, 200 μm).n = 3, data are represented as mean ± SD, ***p < 0.001 vs. control group; ###p < 0.001 vs. Hypoxia + sh-NC group; &&&p < 0.001 vs. Hypoxia + sh-HIF-1α group. One-way ANOVA followed by Tukey’s honest significant difference as a post-hoc test to determine the corrected significance of comparison between multiple groups, or Kruskal-Wallis test followed by Dunn’s test as a post-hoc test to ascertain the corrected significance of comparison between multiple groups was used where appropriate.
  OCSCs, ovarian cancer stem cells; HIF-1α, hypoxia-inducible factor-1α; EET, epithelium-to-endothelium transition; VM, vasculogenic mimicry; PI3K, phosphatidylinositol 3-kinase; AKT, protein kinase B; Smo, smoothened; SHH, sonic hedgehog; SD, standard deviation
