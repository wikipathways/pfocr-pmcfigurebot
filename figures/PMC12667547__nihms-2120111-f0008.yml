figure_title: Working models for the induction of hyper-end resection and BIR onset
  at deDSBs in SETX-deficient cells
caption: (A) Illustration of non-canonical end-resection pathway in SETX-deficient
  cells. SETX deficiency causes more R-loop formation on DSB ends and RAD52 recruitment,
  which, in turn, recruits XPF. Instead of MRE11, XPF generates nicks on the 5′ strand
  of DSBs with accumulated R-loops, followed by removal of the remaining 5′ strand
  toward the DSB ends by MRE11 through its 3′ to 5′ exonuclease activity, and by long-range
  resection of the 5′ strand away from the DSB ends by EXO1 and BLM/DNA2. End resection
  proceeding on the side of the DSB where the 5′ strand serves as the transcription
  template (left) would remove R-loops/hybrids, whereas on the opposite side of the
  break (right), R-loops/hybrids are likely retained during end resection.(B) Working
  model of BIR activation at deDSB ends. After end resection at DSBs, while Polα-primase-initiated
  end-fill occurs at the 3′ ssDNA overhangs, de novo RNA synthesis may take place.
  In addition, hybridization of pre-existing transcripts with ssDNA may also occur
  on the right side of the break in our reporter. In WT cells, with the action of
  SETX and possibly other R-loop/hybrid resolvases, limited RNA/DNA hybrids are present
  on the ssDNA overhangs, which do not interfere with end-fill DNA synthesis to induce
  PCNA ubiquitination (top). However, in SETX-deficient cells, RNA/DNA hybrids on
  ssDNA overhangs are accumulated, which stall end-fill DNA synthesis, thereby promoting
  PCNA ubiquitination, PIF1 recruitment, and subsequent BIR activation (bottom). Additionally,
  hyper-end resection due to SETX deficiency allows more loading of end-fill DNA synthesis
  replicons on resected DSB ends, leading to stronger PCNA ubiquitination and PIF1
  loading, which contributes to the hyper-recombination observed in SETX-deficient
  cells
article_title: Break-induced replication is activated to repair R-loop-associated
  double-strand breaks in SETX-deficient cells
