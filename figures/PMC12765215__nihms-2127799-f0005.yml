figure_title: Disruption of astrocyte–glioma ANXA1–FPR1 crosstalk enhances anti-tumour
  immunity
caption: a–d, Experimental schematic and bulk RNA-seq analysis of CD8+ (a,b) and CD4+
  (c,d) T cells from GL261 sgFpr1-implanted mice. DEGs (a,c) and pathway analysis
  (b,d) are shown; n = 3 mice per sgFpr1 group and n = 5 mice for the sgRandom group.
  e–g, Flow-cytometry analysis of CD8+ T cells from GL261 sgFpr1-bearing mice. CD8+
  T cells stained for tumour-specific antigen GARC-1 (e; n = 9 for sgRosa26 and n
  = 14 for sgFpr1; two-sided unpaired t-test) or exhaustion markers (f, PD-1; g, TIM3)
  are shown (n = 9 mice for GL261 sgRandom and n = 14 mice for GL261 sgFpr1; two-sided
  unpaired t-test). h–l, Schematic (h) and bulk RNA-seq analysis of CD8+ (i,j) and
  CD4+ (k,l) T cells sorted from GL261-implanted mice after AAV-mediated genetic Anxa1
  inactivation in astrocytes (n = 4 mice for sgAnxa1, CD8+ and CD4+; n = 4 mice for
  CD8+; n = 5 mice for CD4+ T cell sgRosa group). DEGs (i,k) and pathway analysis
  (j,l) are shown. m,n, Flow-cytometry analysis of CD8+ T cells from GL261-bearing
  mice after genetic Anxa1 inactivation in astrocytes. CD8+ T cells were stained with
  tetramers loaded with the tumour-specific antigen GARC-1 (m; n = 10 for sgRosa26
  and n = 8 for sgAnxa1; two-sided unpaired t-test), SLAMF6 and exhaustion markers
  PD-1 and TIM-3 (n = 8 for sgRosa and n = 5 for sgAnxa1; two-sided unpaired t-test).
  Data in e,f,g,m and n represent pooled data from three separate experiments. ***P
  < 0.0005, **P < 0.01, *P < 0.05. Data are mean ± s.e.m. (e,f,g,m and n)
