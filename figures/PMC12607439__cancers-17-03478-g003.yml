figure_title: 'The Role of Porphyromonas gingivalis in Oral Carcinogenesis and Progression
  by Remodelling the Tumour Microenvironment: A Narrative Review'
caption: P. gingivalis infection triggers pro-inflammatory mechanisms and regulates
  the immune response to biofilm pathogens. P. gingivalis induces the overexpression
  of B7-H1 and B7-DC receptors in oral cells; these are responsible for chronic inflammation
  through the increased production of IL-1β, IL-6, IL-8, and TNF-α. Expression of
  B7-H1 receptor inhibits effector cells by inducing regulatory T cells (Treg), anergy,
  and apoptosis of activated immune cells. Bacterial flagella and LPS induce cancer-promoting
  inflammatory reactions. Secreted gingipains also contribute to the regulation of
  the relationship between cytotoxic T lymphocytes and antigen-presenting cells, such
  as dendritic cells. The B7-H1 receptor is upregulated on cancer cells and interferes
  with the PDL1 receptor on TILs, blocking the PD1-like cytotoxic T cells. The cell
  surface molecule TLR2-TLR1 complex induces gingipain secretion, which influences
  complement C5 to generate the C5a ligand for the C5aR1 receptor. The pathogen induces
  C5aR1-TLR2 signalling in neutrophils and macrophages, which separates the host protective
  TLR2-MyD88 pathway from the TLR2-MyD88-adaptor-like (MAL, also known as TIRAP)-PI3K
  pathway, which blocks phagocytosis and promotes inflammation. The activity of nucleoside-diphosphate-kinase
  (NDK), allowing ATP activation of P2X7 receptors, also contributes to the formation
  and release of reactive oxygen species (ROS) and activation of the inflammasome,
  and thus increased secretion of the pro-inflammatory cytokines IL-1β, TNF-α, TGF-β1,
  and IL-6
