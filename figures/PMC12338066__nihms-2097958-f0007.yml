figure_title: Microenvironmental profiles and tumor clones in sRCC
caption: (A) H&E staining of representative sRCC containing adjacent sarcomatoid (red)
  and clear cell (blue) regions (top left) and clustering of spatial transcriptomic
  data based on pathologic annotation (bottom left). Mapping of IMmotion molecular
  subsets by spatial transcriptomics (right).(B) IMmotion molecular subset expression
  enriched in sarcomatoid (red) vs. clear cell (blue) regions profiled by Visium spatial
  transcriptomics.(C) Select Hallmark pathway expression enriched in sarcomatoid (red)
  vs. clear cell (blue) regions by spatial transcriptomics.(D) Gene ontology adaptive
  immune pathway expression enriched in sarcomatoid (red) vs. clear cell (blue) regions
  of tumors by spatial transcriptomics.(E) tSNE reduction of cancer cells profiled
  by scRNA-seq.(F) Pseudobulked differential gene expression between sRCC- and ccRCC-derived
  cancer cells.(G) Select Hallmark pathways enriched in sRCC tumor clones.(H) Enrichment
  of sarcomatoid genes in sarcomatoid vs. matched clear cell regions profiled by spatial
  transcriptomics.(I) Differential expression of CD44 in sRCC relative to epithelioid
  RCCs in bulk transcriptomic datasets. All presented q values <0.25 by differential
  gene expression. *q<0.05; **q<0.01; ***q<0.001.(J) Ferroptosis signature ssGSEA
  values across cohorts. Mann-Whitney U Test. Boxplots denote interquartile range
  and median.(K) Gene ontology transition metal pathway expression in sarcomatoid
  (red) vs. clear cell (blue) regions by spatial transcriptomics.(L) Normalized expression
  of hERV_1366, hERV_5738, and hERV_6095 in TCGA KIRC. Mann-Whitney U Test. Horizontal
  lines denote median.See also Figures S3 and S6 and Tables S2, S3, and S6
