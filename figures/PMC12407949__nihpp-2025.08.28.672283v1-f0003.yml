figure_title: Transcriptomic profiles of TP53 mutant AML
caption: '(A) Schematic overview of the experimental design of RNA sequencing. Isogenic
  MOLM-13 cells were treated with DMSO or VenAza for 24 hours, followed by RNA-seq
  for transcriptomic profiling. (B) Principal component analysis (PCA) of RNA-seq
  data from all samples. PC1 and PC2 distinguish samples based on genotype and treatment.
  Genotypes are color-coded, while treatment conditions are indicated by shape. (C-F)
  Gene set enrichment analysis (GSEA) using MsigDB for 6 hallmarks related to the
  main p53 canonical functions: (C) p53 pathway for TP53−/− treated with VenAza vs
  TP53+/+ treated with VenAza; (D) p53 pathway for TP53-/R248Q treated with VenAza
  vs TP53+/+ treated with VenAza; (E) other pathways for TP53−/− treated with VenAza
  vs TP53+/+ treated with VenAza; (F) other pathways for TP53-/R248Q treated with
  VenAza vs TP53+/+ treated with VenAza. For all figures unless otherwise specified,
  treatment with VenAza: venetoclax 3 nM, azacitidine 50 nM'
