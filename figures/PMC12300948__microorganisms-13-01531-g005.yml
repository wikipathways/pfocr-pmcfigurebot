figure_title: PRV-GXLB-2013 infection in vivo and ex vivo activated the NF-κB/MLKL
  signaling pathway.
caption: PRV-GXLB-2013 infection in vivo and ex vivo activated the NF-κB/MLKL signaling
  pathway. (A) PRV-GXLB-2013-infected mice with different viral titers were assayed
  for MLKL levels in mouse brain tissues by the corresponding ELISA kits, and RT-qPCR
  detected NF-κB p65, IκBα, RIP3, and MLKL mRNA levels in mouse brain tissues. (B)
  After the PRV-GXLB-2013 infection of C8-D1A cells, the levels of MLKL in the supernatant
  of C8-D1A cells were measured by the corresponding ELISA kits, and the levels of
  NF-κB p65, IκBα, RIP3, and MLKL mRNA were detected by RT-qPCR in C8-D1A cells. Between
  groups, different uppercase letters indicate extremely significant differences (p
  < 0.01), different lowercase letters indicate significant differences (p < 0.05),
  and the same letter markings indicate no significant differences (p > 0.05)
