figure_title: Ras signaling networks and their oncogenic impact.
caption: 'Ras signaling networks and their oncogenic impact. Upon the activation of
  receptor tyrosine kinases (RTKs), Ras initiates multiple signaling cascades that
  influence various cellular functions. Adaptor protein GRB2 binds SOS, a guanine
  nucleotide exchange factor (GEF), forming a complex that facilitates GDP–GTP exchange
  on Ras. This figure illustrates key pathways: Mutant KRasG12D enhances SLC25A1 expression
  via the GLI1 transcription factor, promoting pancreatic tumorigenesis (purple boxes).
  In this context, the arrow from GLI1 to SLC25A1 reflects transcriptional activation,
  consistent with GLI1’s role as a nuclear transcription factor. Ras stimulates phospholipase
  C epsilon (PLCε), converting phosphatidylcholine inositol 4,5-bisphosphate (PIP2)
  into second messengers diacylglycerol (DAG) and inositol 1,4,5-trisphosphate (IP3),
  leading to intracellular Ca2+ release and activation of protein kinase C (PKC),
  which regulates secretion, ion conductance, gene expression, and cell proliferation
  (yellow boxes). Ras activates Tiam1, modulating Rac1 activity, which subsequently
  activates PAK1, influencing actin cytoskeletal reorganization, cell survival, proliferation,
  and motility (indicated by light blue boxes). Ras interacts with RalGEF and Ral
  proteins, regulating cell growth and survival, which has implications for cancer
  development (green boxes). Ras associates with RIN and RAB GTPases, regulating protein
  transport along endocytic and exocytic pathways (red boxes). Upon Ras activation,
  Nore1 may induce cell cycle arrest and apoptosis, suppressing tumor cell growth.
  Ras activates Afadin, facilitating the formation of adherent junctions during embryogenesis
  and modulating signal transduction, migration, invasion, and apoptosis in cancer
  progression (bright orange box)'
