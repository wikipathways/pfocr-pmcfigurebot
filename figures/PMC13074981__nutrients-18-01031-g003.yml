figure_title: Whole-body versus segmental bioelectrical impedance analysis (BIA).
caption: Whole-body versus segmental bioelectrical impedance analysis (BIA). Schematic
  representation of the traditional tetrapolar whole-body BIA configuration (left),
  in which a low-intensity alternating current is injected through distal electrodes
  placed on the hand and foot, while voltage drop is measured proximally at the wrist
  and ankle, assuming the body behaves as a single homogeneous cylindrical conductor.
  This model estimates TBW from the relationship between body length and electrical
  resistance. In contrast, segmental BIA (right) models the body as five interconnected
  cylinders (four limbs and the trunk) and independently measures impedance in each
  segment using multiple tactile electrodes. This approach accounts for regional differences
  in body geometry and resistance, improving the estimation of TBW and fluid distribution,
  particularly in conditions characterized by heterogeneous fluid shifts such as pregnancy.
  Red and blue lines represent the pathway of the applied alternating electrical current
  through the body between electrodes
