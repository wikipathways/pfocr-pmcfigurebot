figure_title: Simplified diagram of the canonical and noncanonical NF-κB pathways.
caption: Simplified diagram of the canonical and noncanonical NF-κB pathways. Activation
  of the canonical pathway leads to phosphorylation of IKK and then IκB, followed
  by its ubiquitination and proteasomal degradation. This enables the release and
  translocation of NF-κB dimers to the nucleus and the regulation of gene expression
  associated with inflammation and cell survival. Activation of the noncanonical pathway,
  due to the activity of NIK and IKKα kinases, leads to translocation of the RelB/p52
  complex to the nucleus, which influences lymphatic system development and immunoregulation.
  The arrow and line indicate a stimulating effect
