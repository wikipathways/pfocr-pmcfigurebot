figure_title: The role of the cytoskeleton in adrenal steroidogenesis.
caption: The role of the cytoskeleton in adrenal steroidogenesis. This figure schematically
  represents the involvement of cytoskeleton filaments and cytoskeleton binding proteins
  in steroidogenesis. The adrenocorticotropic hormone (ACTH) acts to increase the
  amount of cyclic AMP (cAMP) in adrenal cells. The activation of the cAMP pathway
  promotes both an increase in the microtubule dynamic and actin filament remodelling
  with a consequent increase in cholesterol transport into the mitochondria and a
  promotion of steroidogenesis. The ATP-dependent actomyosin contraction also has
  an effect on the reorganization of intermediate filaments, increasing mitochondria–lipid
  droplet interaction and steroidogenesis. Intermediate filament remodelling is also
  promoted by Ca2+-calmodulin phosphorylation. Two pathways involving cytoskeletal
  binding partners have been identified as key mediators of the effect of cAMP on
  the cytoskeleton in promoting steroidogenesis. cAMP activates PKA, which is able
  to phosphorylate RhoA on serine 188, promoting its interaction with diaphanous-related
  formin 1 (DIAPH1), and to directly phosphorylate DIAPH1 on threonine 759. In both
  cases, DIAPH1 is able to directly bind vimentin, actin, and tubulin as well as binding
  partners or cytoskeletal regulators, promoting cytoskeletal remodelling and consequently
  increasing mitochondrial trafficking and steroidogenesis. In addition, cAMP produces
  an inhibitory effect on the Rho-ROCK-LIMK pathway, reducing the phosphorylation
  and thus inactivation of cofilin. The presence of a more active cofilin leads to
  increased actin filament remodelling, promoting mitochondria–lipid droplet interaction
  and steroidogenesis
