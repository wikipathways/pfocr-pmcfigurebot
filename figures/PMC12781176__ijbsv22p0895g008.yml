figure_title: Schematic illustration showing the mechanisms by which AHR+ dMφs regulate
  maternal-fetal tolerance in URPL pregnancies.
caption: Schematic illustration showing the mechanisms by which AHR+ dMφs regulate
  maternal-fetal tolerance in URPL pregnancies. ① In URPL pregnancies, excessive levels
  of KYN in dMφs activate AHR-mediated transcription of CISH. ② Elevated CISH levels
  promote the ubiquitination and proteasomal degradation of ATP6V1A, a key subunit
  of the lysosomal V-ATPase complex responsible for maintaining lysosomal acidity.
  Loss of ATP6V1A impairs lysosomal acidification, resulting in lysosomal dysfunction.
  ③ This dysfunction facilitates the leakage of mtDNA into the cytosol and extracellular
  space. ④ Cytosolic mtDNA triggers the activation of cGAS-STING pathway, driving
  proinflammatory signaling and cytokine secretion from dMφs. ⑤ In parallel, extracellular
  mtDNA compromises trophoblast survival, migration, and invasion, thereby disrupting
  the immune-trophoblast interactions essential for maintaining decidual homeostasis.
  Collectively, the KYN-AHR-CISH-ATP6V1A axis mediates lysosomal and mitochondrial
  dysfunction in dMφs, contributing to a proinflammatory decidual microenvironment
  that may underlie the pathogenesis of URPL
article_title: Excessive Kynurenine Metabolism Impairs Lysosomal acidification and
  Triggers mtDNA Release via the AHR/CISH/ATP6V1A Axis in Decidual Macrophages Associated
  with Unexplained Recurrent Pregnancy Loss
