figure_title: TOP3B-C666R•mRNA covalent intermediates are sensitive to inhibiting
  the ubiquitin-proteasome pathway, phenocopying the “self-trapping” R338W mutant
caption: A) The reported proteasomal degradation pathway of unresolved TOP3B•RNA covalent
  intermediates that are sensitive to TAK243 (ubiquitin E1 activating enzyme inhibitor)
  and MG132 (proteasome inhibitor). B) Anti-FLAG slot blot of WT and mutant TOP3B•mRNA
  covalent intermediates isolated from Neuro2A cells treated with vehicle or 10 μM
  TAK243 for 3 hrs. NTC = no template control. C) Quantification of panel B. n = 3
  biological replicates. D) Anti-FLAG slot blot of WT and mutant TOP3B•mRNA covalent
  intermediates isolated from Neuro2A cells treated with vehicle or 10 μM MG132 for
  3 hrs. E) Quantification of panel D. n = 3 biological replicates. F) Anti-V5 slot
  blot of WT and mutant TOP3B•mRNA covalent intermediates isolated from Neuro2A cells
  co-transfected with either an empty plasmid control (Empty) or a plasmid encoding
  3xV5-Ubiquitin (3xV5-Ub). G) Quantification of panel F. n = 3 biological replicates.
  Free mRNA was stained with methylene blue and served as a loading control for all
  experiments. Comparisons were made using a one-way ANOVA with Dunnett’s multiple
  comparisons. ** = p≤0.01, *** = p≤0.001, **** = p≤0.0001. ns = not significant.
  Exact p-values are reported in Supplementary Table S2
article_title: An autism spectrum disorder mutation in Topoisomerase 3β causes accumulation
  of covalent mRNA intermediates by disrupting metal binding within the zinc finger
  domain
