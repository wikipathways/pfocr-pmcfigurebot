figure_title: FERMT2 regulates exosomal transfer of COL6A1, enhancing TGF-β signaling
  and CAF activation.
caption: 'FERMT2 regulates exosomal transfer of COL6A1, enhancing TGF-β signaling
  and CAF activation. (A) Schematic illustration of the transwell co-culture system
  (3 μm pores) used to assess the impact of GC cells on protein expression in GCAFs.
  (B) Immunoblot analysis of FERMT2, α-SMA, FAP, and FSP in NFs and GCAFs co-cultured
  with AGS-NC, AGS-FERMT2, HGC-shNC, HGC-shFERMT2, or with CM from AGS-NC or AGS-FERMT2
  cells. (C) KEGG pathway enrichment analysis of differentially expressed proteins
  in AGS-FERMT2 CM versus AGS-NC CM. (D) Functional pathway distribution of differentially
  expressed proteins, highlighting COL6A1 involvement in ECM-receptor interactions.
  (E) Top 25 up- and downregulated proteins in AGS-FERMT2 CM versus AGS-NC CM. (F)
  GO analysis showing the most enriched pathways in AGS-FERMT2 CM versus AGS-NC CM.
  (G) Transmission electron microscopy (TEM) images of exosomes from AGS-NC and AGS-FERMT2
  cells. (H) Immunoblot analysis of exosomal markers (TSG101, CD63) and the endoplasmic
  reticulum marker (Calnexin) in exosomes from AGS-NC and AGS-FERMT2 cells. (I) COL6A1
  expression in lysates of AGS-NC and AGS-FERMT2 cells. (J) Immunoblot showing COL6A1
  and TSG101 expression in exosomes from AGS-NC and AGS-FERMT2 cells. (K-M) Western
  blot analysis of COL6A1 (K), TGF-β1 (L), and ZEB2, FERMT2, α-SMA, FAP, and FSP (M)
  in GCAFs co-cultured with GES-1, AGS-NC, or AGS-FERMT2 cells. (N) Immunoblot analysis
  of TGF-β1, COL6A1, FERMT2, and ZEB2 in GCAFs treated with exosomes from AGS-NC or
  AGS-FERMT2 cells. (O) Western blot showing COL6A1, FERMT2, ZEB2, α-SMA, FAP, and
  FSP in GCAFs treated with rhCOL6A1 at different concentrations for 24 h. (P) Co-localization
  of exosomes and COL6A1 in GCAFs after 24 h incubation with double-labeled exosomes
  (PKH67, green; COL6A1, Cy3, red; nuclei, DAPI, blue). Scale bar, 100 μm. (Q) Western
  blot showing COL6A1, FERMT2, ZEB2, α-SMA, FAP, and FSP expression in GCAFs after
  COL6A1 knockdown. (R, S) Western blot analysis of Smad2/3, COL6A1, ZEB2, α-SMA,
  and FSP after siRNA-mediated silencing of Smad2/3 (R) and assessment of Smad2/3-mediated
  TGF-β1 signaling on COL6A1 and FERMT2 expression (S) in GCAFs. (T) Western blot
  showing TGF-β1, COL6A1, and ZEB2 in GCAFs treated with exosomes from AGS-NC or AGS-FERMT2
  cells, with or without si-COL6A1. (U) Transwell migration and invasion assays of
  GCAFs treated with exosomes from AGS-NC or AGS-FERMT2 cells, with or without COL6A1
  knockdown. (V) COL6A1 and Smad2/3 expression in AGS cells with FERMT2 overexpression
  or knockdown of Smad2. (W) Collagen gel contraction assay of GCAFs treated with
  exosomes from indicated GC cells, with or without COL6A1 knockdown; contraction
  quantified using ImageJ. (X, Y) In vivo tumorigenicity assays showing representative
  images and quantification of intraperitoneal tumors formed by AGS cells co-injected
  with GCAFs, with or without tumor-derived exosomes, into nude mice. (Z) Immunohistochemical
  staining of peritoneal metastatic nodules from BALB/c nude mice. (Statistical significance:
  ns, p > 0.05; *p < 0.05; **p < 0.01; ***p < 0.001; ****p < 0.0001.)'
