figure_title: (a) Upregulation of the MAPK signaling pathway in liver cirrhosis.
caption: (a) Upregulation of the MAPK signaling pathway in liver cirrhosis. KEGG pathway
  map showing significantly upregulated genes (in red) in the MAPK signaling cascade
  in cirrhotic liver tissue. Red intensity indicates the degree of upregulation. Key
  genes involved in the JNK and ERK branches were activated, suggesting roles in inflammation,
  apoptosis, and cell cycle regulation during liver cirrhosis progression. (b) Downregulation
  of the MAPK signaling pathway in liver cirrhosis. KEGG pathway map showing significantly
  downregulated genes (highlighted in green) in the MAPK signaling pathway in cirrhotic
  liver tissue. The reduction in expression across multiple components—including upstream
  receptors (e.g., TNFR, IL1R), MAPKKKs (e.g., MAP3K1, MAP3K5), and transcription
  factors (e.g., ATF2, c-Fos)—indicates suppression of inflammatory and proliferative
  signals. This suggests impaired regulation of key cellular processes such as stress
  response, apoptosis, and cell differentiation in cirrhosis. (c) Upregulation of
  the ERBB signaling pathway in HCC. This schematic depicts the ERBB signaling cascade
  with components upregulated in HCC highlighted. Genes and proteins are color-coded
  according to their expression levels, with a gradient from white (no change) to
  dark red (maximum upregulation), as indicated by the parameter change scale (0.0–1.0)
  in the top right. Red-colored nodes represent genes or proteins that are significantly
  upregulated in HCC. Solid arrows indicate direct activations, dashed arrows denote
  indirect interactions, and “+p” marks phosphorylation events. Key downstream pathways
  include MAPK, PI3K-Akt, JNK, and calcium signaling, all contributing to oncogenic
  processes such as proliferation, survival, angiogenesis, and invasion. (d) Upregulation
  of the PI3K-AKT signaling pathway in HCC. This diagram illustrates components of
  the PI3K-AKT signaling pathway with expression changes observed in HCC. Genes and
  proteins upregulated in HCC are marked by red boxes, with color intensity reflecting
  the degree of upregulation based on transcriptomic data. The accompanying scale
  bar (0.0–1.0) indicates relative expression changes, from no change (white) to maximum
  upregulation (dark red). Signaling flow is represented by solid arrows (direct activation)
  and dashed arrows (indirect or multi-step interactions), while phosphorylation events
  are indicated by “+p.” Central to this pathway is AKT, which integrates upstream
  signals from growth factors (GF), RTKs, integrins, and chemokine receptors, and
  propagates downstream signals influencing key cellular processes such as survival,
  proliferation, metabolism, protein synthesis, and apoptosis. Several downstream
  branches—including the mTOR, MAPK, and FoxO signaling pathways—are shown mediating
  diverse oncogenic effects
