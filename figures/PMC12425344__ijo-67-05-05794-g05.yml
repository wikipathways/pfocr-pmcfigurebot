  treatment. (D) Statistical analysis of relative EMT protein expression levels. All
  data are presented as the mean ± SD from three independent experiments. *P<0.05,
  **P<0.01, ***P<0.001 and ****P<0.0001 vs. control. EMT, epithelial-mesenchymal transition;
  mTOR, mammalian target of rapamycin; p-, phosphorylated; PPARα, peroxisome proliferator-activated
  receptor α; TNBC, triple-negative breast cancer; TP73, tumor protein p73; ZEB, zinc
  finger E-box-binding homeobox protein
