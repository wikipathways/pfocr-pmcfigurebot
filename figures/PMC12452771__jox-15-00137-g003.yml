figure_title: Effect of 4-PBA pretreatment on the SIRT1/HSF1 signaling pathway and
  HSF1 localization in the nucleus after SiNPs exposure.
caption: 'Effect of 4-PBA pretreatment on the SIRT1/HSF1 signaling pathway and HSF1
  localization in the nucleus after SiNPs exposure. (A) 4-PBA pretreatment (5 mM)
  inhibited ER stress in BEAS-2B cells after SiNPs (10 μg/mL) exposure. (a) Representative
  protein bands of CHOP, BIP, SIRT1, SIRT1 (ser47), SIRT1 (ser27), and HSF1 were detected
  by Western blot. (b–g) Grayscale values of the SIRT1/HSF1 protein expression levels
  were analyzed by ImageJ. n = 3–5. Data were expressed as mean ± S.D., * p < 0.05
  and ** p < 0.01, SiNP-treated group compared with the corresponding SiNPs plus 4-PBA
  group or SiNP-treated group without 4-PBA compared with the control group without
  4-PBA. NS = not significant. (B) The localization and quantitative analysis of HSF1
  in BEAS-2B cells pretreated with or without 4-PBA after SiNPs treatment. Blue: DAPI;
  red: HSF1, scale bar: 50 μm'
