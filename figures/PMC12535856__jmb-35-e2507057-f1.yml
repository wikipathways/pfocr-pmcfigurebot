figure_title: Allantoin degradation pathway and the associated gene cluster (ALL gene
  cluster) in E. coli
caption: Allantoin is converted by allantonase (allB), allantoate amidohydrolase (allC),
  and ureidoglycine aminohydrolase (allE) into ureidoglycolate, which serves as a
  branch point. In the oxamate branch, ureidoglycolate dehydrogenase (allD) and oxamic
  transcarbamylase (allFGH) convert ureidoglycolate into oxamate and carbamoyl phosphate,
  the latter serving as a substrate for catabolic carbamate kinase (allK), which produces
  ATP and NH3. In the glycerate branch, ureidoglycolate hydrolase (allA) produces
  glyoxylate and urea; glyoxylate is further metabolized by glyoxylate carboligase
  (gcl), tartronate semialdehyde dehydrogase (glxR), and glycerate kinase (glxK) to
  2-phosphoglycerate. NH3 yields per mole of allantoin are indicated below each branch
  of the pathway. Regulatory influences of AllR (R, orange), AllS (S, blue), and ArcA
  (A, green) are shown based on previously reported models and our working hypothesis.
  Detailed experimental evidence supporting these regulatory interactions is presented
  in the Results and discussed further in the Discussion
article_title: Dual Regulation of the allF Operon by ArcA and AllS Enables Anaerobic
