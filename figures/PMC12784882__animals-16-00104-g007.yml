figure_title: Gene Set Enrichment Analysis (GSEA) of KEGG pathways in lamb liver.
caption: Gene Set Enrichment Analysis (GSEA) of KEGG pathways in lamb liver. (A) Bubble
  plot of enriched KEGG pathways identified by GSEA. The x-axis represents the Normalized
  Enrichment Score (NES). A positive NES indicates pathway enrichment in the CYC supplemented
  group (e.g., PI3K-AKT signaling pathway, ECM–receptor interaction), while a negative
  NES indicates enrichment in the control group (e.g., Oxidative phosphorylation).
  The y-axis lists the pathway names. The bubble size corresponds to the Count (the
  number of genes within that pathway’s gene set). The bubble color indicates the
  p-adjust, with red representing higher statistical significance. (B) Enrichment
  map visualizing the functional relationships between the significant pathways. Each
  node represents one KEGG pathway. The size of the node represents the count of enriched
  genes
