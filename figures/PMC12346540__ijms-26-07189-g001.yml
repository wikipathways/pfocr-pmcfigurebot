figure_title: Accumulation of unfolded proteins results in the UPR.
caption: 'Accumulation of unfolded proteins results in the UPR. After translation,
  proteins that are properly folded are secreted (route 1: Secretion), while misfolded
  proteins are broken down in order to recycle important amino acids for continued
  production of other proteins (route 2: ERAD). Stress in the ER occurs when misfolded
  proteins accumulate. When the chaperone BIP binds misfolded proteins, a downstream
  transcription cascade (route 3: UPR) is initiated to either relieve burdens on the
  ER or activate apoptotic pathways if the former cannot be achieved. Italics within
  the nucleus represent the promoter elements bound by each transcription factor.
  Previously undefined abbreviations: IRE1-dependent decay (RIDD); site-1 and site-2
  proteases (S1P and S2P, respectively). Figure created with BioRender.com'
