figure_title: Metabolic flux of labeled glutamine in FXS LCLs
caption: (A) Integration of peak area measurement for glutamate (Glu), glutamine (Gln),
  and Gln:Glu in intracellular and extracellular compartments of TD, FXS1, and FXS2
  cells (Figure 2E).(B) TD, FXS1, and FXS2 LCLs (N = 1, n = 3) treated with [13C5,
  15N2]-glutamine for 8 h (cell pellets/media analyzed via LC-MS).(C) Diagram of labeled
  glutamine flux in the TCA cycle via oxidative or reductive (blue labels) pathways.
  The filled circles indicate carbons derived from labeled [13C5, 15N2]-glutamine.(D)
  Integrated peak area measurements of metabolites in TD, FXS1, and FXS2 cells, showing
  fractions of labeled glutamine-derived metabolites for each cell line (see Table
  S2).(E) Percent enrichment plot of labeled Glu in cell pellet and extracellular
  media fractions from (C) and (D).For (A)–(E), data are represented as the mean ±
  SEM of three replicates (N = 3). Statistical significance (p values) was calculated
  using a two-way ANOVA (D) with multiple comparisons. *p < 0.05, **p < 0.01, ***p
  < 0.001, and ****p < 0.0001
