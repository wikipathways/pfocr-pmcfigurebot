figure_title: Targeting the tumor microenvironment.
caption: Targeting the tumor microenvironment. This diagram illustrates key pathways
  and targets within the tumor microenvironment. (A) The adenosine pathway includes
  CD39 and CD73, which convert ATP to adenosine, leading to immunosuppression. (B)
  TAM receptors (Tyro3, AXL, Mer) are shown, which mediate immune evasion and tumor
  progression. (C, D) Neoantigens and T cell receptor (TCR) engineering are highlighted,
  representing the identification of tumor-specific antigens and the modification
  of T cells to enhance anti-tumor immune responses
