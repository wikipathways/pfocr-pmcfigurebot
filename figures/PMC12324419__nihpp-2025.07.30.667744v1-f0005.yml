figure_title: Gene set variation analysis (GSVA) and mediation analysis identify heme
  metabolism as a direct mediator of CaMKIICA-induced muscle weakness.
caption: Gene set variation analysis (GSVA) and mediation analysis identify heme metabolism
  as a direct mediator of CaMKIICA-induced muscle weakness. (a) To identify potential
  mediating effects in the transcriptome, GSVA was used to derive enrichment scores
  for the 50 hallmark gene sets in each sample. Partial Spearman correlation analysis
  was performed on the gene set enrichment scores, adjusting for subject ID, to identify
  redundant gene sets, defined as those with ∣ ρ ∣ ≥ 0.8, with two clusters identified
  and reduced to “eigenpathways” based on principal component analysis with the first
  principal component representing the new “eigenpathway” score. (b) All potential
  mediators were evaluated through two mediation models, one mediating contractile
  force and another mediating muscle mass, using the “mediation” package in R. Aber
  correcting for multiple comparisons, only three significant mediators were identified.
  (c) The Diagram of the full structural equation model (SEM) model. Each arrow represents
  a path from CaMKIICA treatment (independent variable) to contractile force (outcome),
  with boxes representing mediators of paths. The color and size of the arrows denote
  effect (red negative, green positive, and size magnitude), and the opaque arrows
  indicate significant paths. (d) Normalized transcript counts of heme and iron regulators.
  Whole transcriptome multiple-test adjusted p-values from DESeq2 analysis are included
  in the figure. (e) Malondialdehyde measured by mass spectrometry in CaMKIICA- and
  EGFP-expressing TA muscles. n = 6 per condition, one-tailed t-test, p-value in graph
