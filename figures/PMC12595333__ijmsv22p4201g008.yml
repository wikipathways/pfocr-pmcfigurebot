figure_title: Common expression genes and enriched signaling pathways associated with
  differential methylation patterns of cg08558971 and cg18416251 across tumor stages.
caption: Common expression genes and enriched signaling pathways associated with differential
  methylation patterns of cg08558971 and cg18416251 across tumor stages. (A-B) Venn
  diagrams illustrating the overlap of common and differentially expressed genes (DEGs)
  between two methylation transitions that one is high methylation of cg08558971 in
  early-stage tumors and low methylation of cg18416251 in late-stage tumors (A), and
  the other is low methylation of cg08558971 in early-stage tumors and high methylation
  of cg18416251 in late-stage tumors (B). (C-D) Gene Ontology (GO) enrichment analysis
  of common expression genes identified in the transitions described in (A-B). Genes
  were significantly enriched in immune-related (C) and metabolism-related pathways
  (D). (E-F) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis
  of common expression genes from both transitions. Genes also showed predominant
  enrichment in immune-related (E) and metabolism-related (F) signaling pathways
