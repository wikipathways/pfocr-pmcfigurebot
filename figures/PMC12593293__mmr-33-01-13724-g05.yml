figure_title: RNA sequencing analysis of esophageal cancer cells reveals the mechanisms
  by which downregulation of ZNF514 contributes to cancer progression.
caption: RNA sequencing analysis of esophageal cancer cells reveals the mechanisms
  by which downregulation of ZNF514 contributes to cancer progression. (A) Bar graph
  displaying the number of genes affected by ZNF514 knockdown, selected based on the
  criteria of |log2(Fold-change)|>1 and q-value <0.05. (B) Volcano plot illustrating
  the expression of DEGs, with red indicating upregulated genes and blue signifying
  downregulated genes. (C) Scatter plot showing the correlation of DEGs, with red
  indicating upregulated genes and blue signifying downregulated genes. (D) GO functional
  classification of DEGs, (E) GO enrichment analysis of DEGs, (F) KEGG pathway classification
  of DEGs, and (G) KEGG pathway enrichment analysis of DEGs. (H) Protein-protein interaction
  analysis was conducted based on the DEGs. DEG, differentially expressed gene; ZNF514,
  zinc finger protein 514; GO, Gene Ontology; KEGG, Kyoto Encyclopedia of Genes and
  Genomes; si-NT, siRNA-non-targeting
