caption: 'Proposed antidiabetic mechanisms of Marantodes pumilum (MP) based on in
  vitro and in vivo studies. The pathway diagram illustrates how MP extracts modulate
  glucose homeostasis through multiple mechanisms including enhanced glucose uptake,
  reduced inflammation, antioxidant activity, and prevention of β-cell apoptosis.
  The integrated pathways show MP’s potential in managing both insulin resistance
  and pancreatic dysfunction associated with diabetes mellitus. Abbreviations: HBA1c,
  glycated haemoglobin; GLUT, glucose transporter; SOD, superoxide dismutase; CAT,
  catalase; GPX, glutathione peroxidase; TNF-α, tumour necrosis factor alpha; PGE2,
  prostaglandin E2; NF-κB, nuclear factor kappa-B; IKKβ, IκB kinase beta; BAX, BCL-2-associated
  X protein; BCL, B-cell lymphoma; ROS, reactive oxygen species. Arrows: ↑ increase,
  ↓ decrease'
