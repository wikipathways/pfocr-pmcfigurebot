figure_title: Comprehensive lipidomics profiling revealing alterations in steroid
  and cholesterol metabolic process in Dhcr24 conditional knockout (cKO) mice.
caption: Comprehensive lipidomics profiling revealing alterations in steroid and cholesterol
  metabolic process in Dhcr24 conditional knockout (cKO) mice. (A) Orthogonal partial
  least squares discriminant analysis (OPLS-DA) and (B) OPLS-DA-spot indicating significant
  trends distinguishing the lipidomics profiling of Dhcr24fl/fl and Dhcr24-cKO groups.
  (C) Volcano plot showing 582 lipid metabolites, in which 16 were significantly upregulated
  and 9 were downregulated in the Dhcr24-cKO vs. Dhcr24fl/fl group (p < 0.05 & VIP
  > 1). (D) Sub class identification of the differentially expressed lipid metabolites
  between the Dhcr24-cKO and Dhcr24fl/fl groups. (E) Heatmap of the 25 differentially
  expressed lipids. (F, G) Kyoto encyclopedia of genes and genomes (KEGG) pathway
  analysis identifying significantly (F) upregulated and (G) downregulated pathways
  between the Dhcr24-cKO and Dhcr24fl/fl groups. (H-J) Gene set enrichment analysis
  (GSEA) based on lipid metabolites identifying significantly enriched pathways between
  the Dhcr24-cKO and Dhcr24fl/fl groups, including (H) cholesterol metabolism, (I)
  steroid biosynthesis, and (J) glycerophospholipid metabolism. (K, L) Heatmap based
  on lipid metabolites for significantly enriched metabolic pathways of (K) cholesterol
  metabolism and (L) glycerophospholipid metabolism. (M, N) Comparison of the (M)
  ratio of saturation for ChE, TG, PS, PI, and LPC, and (N) total unsaturation patterns
  between the Dhcr24-cKO and Dhcr24fl/fl groups. ChE, cholesteryl esters; LPC, lysophosphatidylcholine;
  PI, phosphatidylinositol; PS, phosphatidylserine; TG, triglyceride. (O) Significantly
  enriched signaling pathways identified through integrated transcriptomics and lipidomics
  of the Dhcr24-cKO vs. Dhcr24fl/fl mice, including cholesterol metabolic process,
  steroid biosynthesis, glycerophospholipid metabolism, and sphingolipid metabolism.
  (P) Correlation networks between DHCR24 and four significant lipid metabolic pathways
  in both Dhcr24-cKO and Dhcr24fl/fl mice
