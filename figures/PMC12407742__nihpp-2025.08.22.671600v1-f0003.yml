figure_title: High B12 supplementation causes gut dysbiosis leading to a reduction
  in SCFA-producing bacteria
caption: |-
  (A) Schematic of collection at month 8, bacterial DNA isolation, and shotgun metagenomic sequencing analysis of fecal pellets from mice (n= 4–5 mice per group) with competitive transplant of CD45.2+
  Tet2+/+ and Tet2+/− BM cells supplemented with low to high B12 (as outlined in Figure 1).(B) Alpha diversity levels measured by Shannon and Simpson’s indices.(C) Fecal microbiome composition at the phylum level averaged per group from B12 supplemented cohorts of Tet2+/+ and Tet2+/− host mice.(D) Composition levels of butyrate producers at the genera level in the fecal microbiome of B12 supplemented Tet2+/+ and Tet2+/− host mice.(E) Bar graphs of linear discriminant analysis (LDA) score calculated by linear discriminant analysis effect size (LEFSE) for species in the fecal microbiome.(F) Venn Diagrams of overlaps of enriched or depleted species in the high vs low B12-treated Tet2+/+ and Tet2+/− competitive BM reconstituted mice.(G) Dot plot of enriched KEGG pathways from metagenomic analysis comparing the fecal microbiomes of respective low and high B12 supplemented cohorts using the MG-RAST pipeline.(H) Experimental schematic of shRen and shTet2 Raw 264.7 mouse macrophage cells cultured in low, standard, and high B12 supplemented media.(I) Gene expression levels of Il1b and S100a9 in Raw 264.7 cells after 16-hour stimulation with PBS or 1 μg/mL LPS.p-values = *p < 0.05, **p < 0.005, ***p < 0.0005
article_title: B12 promotes gut dysbiosis and an inflammatory microenvironment that
  potentiates Tet2-deficient hematopoiesis
