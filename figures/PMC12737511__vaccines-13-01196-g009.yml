figure_title: Mechanisms of immune activation by RABV INV and NLS vaccine.
caption: 'Mechanisms of immune activation by RABV INV and NLS vaccine. (A) RABV INV:
  Upon administration, the vaccine antigens are taken up by dendritic cells. Antigens
  are processed and presented via the MHC-II pathway, leading to the activation of
  CD4+ T cells. These T cells provide help to B cells, promoting their proliferation
  and differentiation into antibody-producing plasma cells, which secrete nAbs against
  the viral antigen. (B) RABV NLS vaccine: The LNPs co-delivering G-mRNA and RABV-N
  target antigen-presenting cells and muscle cells. The G-mRNA is translated intracellularly,
  and the synthesized antigens are presented via the MHC-I pathway, robustly activating
  CD8+ CTLs. Concurrently, antigens are also presented via the MHC-II pathway to engage
  CD4+ T cells help for B cell activation. This dual-pathway activation induces a
  comprehensive immune response comprising both potent nAbs and strong cellular immunity'
