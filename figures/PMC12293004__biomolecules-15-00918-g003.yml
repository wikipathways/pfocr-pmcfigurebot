caption: The potential mechanism of CAPE in regulating pancreatic secretion based
  on CCKAR. (a) The potential mechanism of CAPE in regulating the pancreatic secretion
  pathway. Red, blue, purple, and black boxes indicate genes with significantly upregulated
  expression levels, downregulated levels, both upregulated and downregulated levels,
  and no significant change, respectively. (b) Molecular docking was used to explore
  the potential binding conformations between CAPE and CCKAR. CAPE and the CCKAR protein
  interact via hydrogen bonds and hydrophobic interactions. The binding energy of
  docking manners increases from top to bottom. Light blue, white, dark blue, and
  red represent carbon (C), hydrogen (H), nitrogen (N), oxygen (O), and sulfur (S)
  atoms, respectively. The numbers indicate the interatomic distances, with the unit
  being angstroms (Å). Amino acid residues within five angstroms near the ligand CAPE
  are shown here. The structure on the far right is the molecular structure of CAPE
