figure_title: Metabolic changes after fermentation (n = 3).
caption: Metabolic changes after fermentation (n = 3). (A) PCA plot of metabolites
  between fermented mixture substrate group (FMS) and unfermented mixture substrate
  group (MS). (B) Volcano plot of FMS vs. MS. Differentially abundant metabolites
  were defined as those with variable importance in the projection (VIP) > 1.0 from
  orthogonal partial least squares-discriminant analysis (OPLS–DA) and p < 0.05. (C)
  Hierarchical clustering heatmap visualizing the top 25 differentially expressed
  metabolites between FMS and MS (VIP > 1.0 and p < 0.05). Rows represent metabolites,
  columns represent samples, and color intensity reflects relative abundance. (D)
  Metabolic pathway enrichment analysis (TOP 25 most enriched pathways) based on differentially
  abundant metabolites
