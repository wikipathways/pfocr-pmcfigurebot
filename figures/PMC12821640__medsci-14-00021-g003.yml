figure_title: Functional meta-synthesis network illustrating the major stemness-related
  biological programs identified across computational and immunohistochemical studies.
caption: Functional meta-synthesis network illustrating the major stemness-related
  biological programs identified across computational and immunohistochemical studies.
  Each labeled domain (EMT/ECM remodeling, hypoxia/glycolysis, redox/ferroptosis,
  ribosome/transcription, and therapy resistance) represents a recurrent pathway cluster.
  Colored connecting lines depict conceptual relationships among these biological
  domains based on co-occurrence patterns in the included gene signatures. The layout
  reflects an abstracted, integrative overview rather than a mechanistic pathway map.
  Network visualization was generated using R igraph with force-directed layout optimization
