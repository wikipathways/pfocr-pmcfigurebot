figure_title: Mechanism of Cd exposure via breastmilk. Cd2+ is transported into the
  mammary gland via the Fe2+ and Mn2+ pathways. When the Fe2+ and Mn2+ of blood plasma
  bind with transferrin (Tf) separately [(a), (b)], Cd2+ is attached to Tf without
  replacing Fe2+ and Mn2+. These complexes are subsequently transferred onto the mammary
  gland with the help of the transferrin receptor (TfR). Thus, TfRs mediate the transportation
  of Cd2+ into the mammary gland. On the other hand, Cd2+ prevents Ca2+ from binding
  with CaT1, a Ca transporter, and instead binds itself with CaT1. In this way, CaT1
  facilitates the transportation of Cd2+ in the mammary gland. Finally, Cd2+ is transferred
  to neonates via breastmilk
