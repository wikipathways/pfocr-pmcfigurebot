figure_title: CrGPDH expression increases fatty acid β-oxidation in HeLa cells
caption: '(a) Volcano plot showing the log2 fold change (x-axis) and p-value (y-axis)
  for summed lipid classes in HeLa cells expressing CrGPDH. Significantly changed
  summed lipids (p value cutoff = 0.05, fold change cutoff < −0.1) are highlighted
  in dark blue, while grey dots represent lipids without significant changes. Light
  blue dots represent a decreasing trend but not statistically significant summed
  lipids (0.05 < p value <0.15, fold change cutoff < −0.1). AcCa: acylcarnitines,
  TG: triglycerides, PS: phosphatidylserine, PG: phosphatidylglycerol, PI: phosphatidylinositol,
  DG: diglyceride, Cer: ceramide. Heatmaps of changes in triglycerides (b) and acylcarnitines
  lipids (c) in HeLa cells with CrGPDH expression. (d) A Venn diagram showing the
  overlap between the 350 CrGPDH vs LUC differentially expressed genes (DEGs) and
  the 1136 genes encoding the human mitochondrial proteome from MitoCarta3.049. The
  cutoff for DEGs is a log2 fold change > 0.5. Upregulated overlapping genes are in
  red, while downregulated ones are in blue. Experiments in (a-d) were performed with
  pyruvate-free DMEM supplemented with dialyzed FBS (DMEM+dFBS) containing 25 mM glucose.
  (e) The schematics depicting fatty acid β-oxidation (FAO) and related pathways.
  Decreased acylcarnitines from (c) are highlighted in blue. Correlated genes in (d)
  are highlighted in red. MCFAs: medium chain fatty acids. In heatmaps (b, c) each
  column represents a biologically independent sample'
