figure_title: The distinct roles of FABP5 and FABP7 in regulating Ferroptosis.
caption: 'The distinct roles of FABP5 and FABP7 in regulating Ferroptosis. This schematic
  illustrates the opposing functions of FABP5 and FABP7 in the context of ferroptosis.
  (1) Pro-ferroptotic pathway (FABP5): FABP5 transports polyunsaturated fatty acids
  (PUFAs) to the cell membrane, where enzymes like ACSL4 and LPCAT3 incorporate them
  into phospholipids (PUFA-PLs). In the presence of iron (Fe2+), these PUFA-containing
  phospholipids are highly susceptible to lipid peroxidation, leading to the accumulation
  of lipid ROS and execution of ferroptosis. This process is normally counteracted
  by the antioxidant enzyme GPX4. (2) Anti-ferroptotic pathway (FABP7): FABP7 acts
  as a protective factor by sequestering PUFAs away from the membrane and trafficking
  them to LDs for safe storage. This prevents their peroxidation and shields the cell
  from ferroptotic death. The balance between these two pathways can determine the
  cell’s fate under oxidative stress'
