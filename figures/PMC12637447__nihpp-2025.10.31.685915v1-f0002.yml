figure_title: Overview of the cfOncoXpress pipeline
caption: cfOncoXpress takes only cfDNA WGS as input, from which six promoter-associated
  cfDNA features are extracted. These features are used to train regression models
  (i.e., Gradient Boosting regression (GBR), Extreme Gradient Boosting (XGB), Random
  Forest (RF), Supervector Machine Regression (SVR) and a Neural Network (NN)), with
  hyperparameter optimization performed using Optuna to identify the best-performing
  model and parameter set for gene expression prediction. A copy number correction
  is applied post-regression to further improve accuracy. Effects of ecDNA can also
  be evaluated in downstream analysis. Finally, the predicted gene expression values
  can be used to infer pathway activity
article_title: 'cfOncoXpress: Tumor gene expression prediction from cell-free DNA
  whole-genome sequences'
