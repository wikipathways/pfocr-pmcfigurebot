figure_title: Metabolic pathways are associated with exposure to xenobiotic mixtures
  in serum samples from first trimester pregnancy (n = 100).
caption: Metabolic pathways are associated with exposure to xenobiotic mixtures in
  serum samples from first trimester pregnancy (n = 100). Associations between PFAS,
  bisphenol, phthalate, OPE, and paraben mixtures and mixtures of these chemicals
  together, regardless of chemical class (total mix), and metabolites were determined
  using quantile gcomputation. Circles represent unadjusted models, while diamonds
  represent models adjusted for maternal age, BMI, race/ethnicity, income, fat intake,
  and dairy, vegetable, and whole grain consumption. The total mixture represents
  a mixture of 7 detected PFAS, 3 bisphenols, 5 phthalates, 3 organophosphate esters,
  2 parabens, and 1 pesticide. Shape color (overlap) denotes the percentage of significant
  metabolites (p < 0.05) divided by the total number of metabolites in a pathway,
  while shape size (enrichment) represents the percentage of enriched metabolites
  (p < 0.05) divided by the total percentage expected to be enriched. Dotted red lines
  represent a significance level of p < 0.05, and all values to the right of this
  line indicate significant pathways associated with chemical exposure. An asterisk
  is shown in pathways significant at FDR < 0.05
article_title: Nontargeted screening identifies mixtures of environmental pollutants
  that are associated with perturbations to amino acid and fatty acid metabolic pathways
  during early pregnancy
