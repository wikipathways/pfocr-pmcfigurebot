figure_title: The schematic illustrates the Nrf2–Keap1 signalling pathway.
caption: The schematic illustrates the Nrf2–Keap1 signalling pathway. (A) In basal
  conditions, Keap1 binds to the ETGE and DLG motifs on Nrf2, enabling Nrf2 to join
  the Keap1–Cul3 ubiquitin ligase complex, which tags Nrf2 for degradation via the
  proteasome. (B) Under oxidative stress conditions, an inducer (oxidation or alkylation)
  modifies a critical cysteine on Keap1, disrupting Keap1′s inhibitory complexes and
  preventing Nrf2 ubiquitination. This modification causes a conformational change
  in Keap1, releasing Nrf2 and preventing its ubiquitination, allowing it to escape
  degradation. Nrf2 then translocates into the nucleus, binds to the ARE, and activates
  genes encoding NQO1, HO-1, and GCL subunits C and M, boosting cellular defences
  against oxidative stress. As a result of oxidative stress, PKC, CSK2, PI3K, JNK,
  ERK, and p38 can induce phosphorylation-related translocation of Nrf2 to the nucleus
