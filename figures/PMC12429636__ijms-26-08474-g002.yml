figure_title: Molecular pathways involved in thyroid cancer progression, immune evasion,
  and potential therapeutic targets.
caption: 'Molecular pathways involved in thyroid cancer progression, immune evasion,
  and potential therapeutic targets. The top left panel illustrates a normal thyroid
  cell, depicting the function of the Sodium-Iodide Symporter (NIS) for iodide uptake
  and the TSH/TSH-R/cAMP pathway. The top right panel indicates key genetic alterations
  frequently in anaplastic, follicular, and papillary carcinomas: BRAF V600E, RAS-BRAF-MEK-ERK
  pathway mutations, PAX8-PPARγ rearrangements, and RET/PTC fusions, which contribute
  to the development of anaplastic, follicular, and papillary carcinomas. The central
  diagram below details complex signaling networks within the tumor microenvironment
  (TME) that promote tumor survival and immunosuppression. Extracellular ATP (eATP),
  released due to metabolic stress or cellular damage, can activate purinergic receptors
  like P2X7 or stimulate adenosine production via CD39 and CD73. Adenosine (Ado) can
  bind to A2B or A2A adenosine receptors. A2B activation, often via VEGF stimulation,
  can lead to the production of eATP, contributing to a cycle of pro-tumorigenic signaling.
  A2A activation, stimulated by growth factors and RTKs, activates the PI3K/Akt/mTORC1
  pathway, promoting protein synthesis and cell survival, and also contributes to
  immunosuppression. CD39 and CD73 facilitate the conversion of eATP to adenosine,
  a potent immunosuppressant. Intracellularly, metabolic stress and reactive oxygen
  species (ROS) can influence pro-apoptotic (e.g., Bak/Bax) and anti-apoptotic (e.g.,
  Bcl-2) pathways. ROS can also contribute to the activation of the nuclear factor
  kappa B (NF-κB): p50/p65/c-Rel, which typically promotes an anti-apoptotic response
  and can also activate immune responses. However, persistent or dysregulated NF-κB
  can contribute to tumor survival. Ultimately, these pathways converge to promote
  tumor survival by fostering gene proliferation, angiogenesis, and immunosuppression,
  while inhibiting apoptosis. Created with BioRender.com (accessed on 1 August 2025)'
