figure_title: 'Mediation analysis using structural equation modeling: maternal/paternal
  smoking quantity as a mediator of the associations between transmitted (PGST) and
  non-transmitted (PGSNT) polygenic scores and offspring smoking outcomes.'
caption: 'Mediation analysis using structural equation modeling: maternal/paternal
  smoking quantity as a mediator of the associations between transmitted (PGST) and
  non-transmitted (PGSNT) polygenic scores and offspring smoking outcomes.Note. In
  all panels, aT path is PGST on maternal/paternal smoking quantity; aNT path is PGSNT
  on maternal/paternal smoking quantity; b path is maternal/paternal smoking quantity
  on offspring smoking outcomes; c’T path is the direct effect of PGST on offspring
  smoking outcomes, while accounting for the mediator; and c’NT path is the direct
  effect of PGSNT on offspring smoking outcomes, while accounting for the mediator.
  Mediation effects are presented below each mediation model for aT*b and aNT*b. Sex
  and age were included as covariates in all models. Solid line and bold indicate
  a significant pathway, and dashed line represent a non-significant (p > .05) pathway.
  A. Maternal cigarettes per day (CigDay). Maternal CigDay mediated the influence
  of both PGST (βtotal = 0.125, SE = 0.012, 95% CI: 0.102 to 0.148) and PGSNT (βtotal
  = 0.043, SE = 0.016, 95% CI: 0.011 to 0.073) on offspring CigDay. B. Maternal pack-years.
  Maternal pack-years mediated the influence of both PGST (βtotal = 0.084, SE = 0.011,
  95% CI: 0.062 to 0.103) and PGSNT (βtotal = 0.027, SE = 0.013, 95% CI: 0.000 to
  0.052) on offspring pack-years. C. Paternal pack-years. Paternal pack-years mediated
  the influence of both PGST (βtotal = 0.107, SE = 0.011, 95% CI: 0.085 to 0.128)
  and PGSNT (βtotal = 0.034, SE = 0.016, 95% CI: 0.003 to 0.065) on offspring pack-years'
