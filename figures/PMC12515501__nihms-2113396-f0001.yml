figure_title: Contributions of the innate immune system to tauopathy progression
caption: Shown is the immunological interface between a microglial cell (red) and
  a neuron (gray), highlighting five key innate immune pathways implicated in the
  response to extracellular tau fibrils and aggregates.(A) Tau-burdened synapses are
  tagged with complement proteins such as C1q, which promotes microglial synaptic
  engulfment, which exacerbates pathology. Soluble C3a (yellow half-circles) promotes
  an inflammatory environment and worsens tauopathy when bound to C3aR. Extracellular
  tau fibrils interact with CR4 and can be internalized in a neuroprotective fashion.(B)
  Tau aggregates can trigger NLRP3 inflammasome assembly in microglia, leading to
  the activation of caspase-1, cleavage of gasdermin D (GSDMD), and release of the
  pro-inflammatory cytokines (blue spheres) IL-1β and IL-18. These cytokines can propagate
  neuroinflammation and contribute to tau pathology in a context-dependent manner.(C)
  Detection of tau by TLRs expressed on neurons and microglia incites proinflammatory
  cytokine production and further tau hyperphosphorylation and aggregation.(D) cGAS
  detects cytosolic DNA and activates STING, resulting in type I IFN production and
  the induction of IFN-stimulated genes (ISGs) via IFNAR in neurons and microglia.
  This cascade inhibits transcription factors like MEF2C, thus promoting microgliosis
  and inflammatory responses that worsen tauopathy.(E) Tauopathy-driven lipid droplet
  accumulation leads to defective microglial phagocytosis and excessive production
  of proinflammatory cytokines and reactive oxygen species (ROS). Apolipoprotein E4
  (APOE4) exacerbates these effects in neurons and microglia, leading to heightened
  inflammatory responses and worsened tau pathology
article_title: Emerging roles for innate and adaptive immunity in tauopathies
