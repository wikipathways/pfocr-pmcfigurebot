figure_title: Brief overview of relationship between different antioxidant pathways
  in C. albicans
caption: RS inhibit histidine kinases (HKs), which inactivates Ypd1 and enables Ssk1
  to start a protein kinase signaling cascade that activates the Hog1 protein kinase.
  Hog1 plays a major role in regulating numerous stress responses, including activation
  of gene expression. The response-regulator protein Skn7 also induces genes that
  promote stress resistance. The Cap1 transcription factor is kept out of the nucleus
  it contains a nuclear export signal (NE). RS oxidize Gpx3, which then forms a disulfide
  bond with Cap1 that is subsequently resolved by formation of an intramolecular disulfide
  bond in Cap1 that masks its nuclear export signal. This enables Cap1 accumulate
  in the nucleus where it upregulates a wide array of antioxidant genes. RS activate
  the pentose phosphate pathway (PPP), which increases the level of NADPH in cells
  to meet the elevated demand for this key source of reducing potential that is used
  by many different antioxidant pathways. RS activate the PPP by oxidizing a cysteine
  residue in the active site of the enzyme glyceraldehyde-3-phosphate dehydrogenase
  (GAPDH) which blocks glycolysis
