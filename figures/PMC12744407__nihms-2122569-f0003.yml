figure_title: Candidate endocrine modulators of cardiac protein synthesis and lipid
  metabolism
caption: 'A. Bar chart showing the number of significant organokines from several
  cardiometabolically relevant tissues that are significantly associated with heart
  latent variable 11 with MIPS Ribosome Cytoplasmic annotation.B. As in A, but for
  organokines associated with heart latent variable 536 (annotated with REACTOME Metabolism
  of Lipid and Lipoproteins).C. Dot plot showing the correlation coefficient and significance
  of organokines from the adipose tissue (subcutaneous), liver, and skeletal muscle
  with heart latent variable 11 (MIPS Ribosome Cytoplasmic).D. As in C, but for organokines
  associated with heart latent variable 536 (REACTOME Metabolism of Lipid and Lipoproteins).E.
  Scatterplot showing the correlated expression of adipose and liver organokines with
  heart ribosome and lipid metabolism latent variables. Each point is data from an
  individual donor. Red dashed line: best fit linear fit. Ribbon: s.e.F. Dot plot
  showing the absolute correlation of adipose (subcutaneous) LGALS3 with heart (left
  ventricle) latent variables. Only latent variables mappable to prior knowledge and
  with Bonferroni P ≤ 0.005 are shown. Color: Pearson’s correlation coefficient. Several
  latent variables of interest including those associated with protein synthesis and
  degradation pathways are highlighted.G. As in F, but for correlations between liver
  THPO with heart (left ventricle) latent variables'
