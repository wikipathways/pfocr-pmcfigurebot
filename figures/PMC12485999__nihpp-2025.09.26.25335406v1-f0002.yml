figure_title: Model of the Hypothetical Causal Pathways in Patients with Acute Ischemic
  Stroke
caption: We defined brain health loss, quantified using change in the effective Reserve
  caused by stroke, as a potential mediator influencing the effect of stroke lesion
  volume on functional outcome. The direct effect is defined as pathway c, and the
  indirect effect as pathways a x b. Outcomes were assessed at 90 days after onset
  of acute ischemic stroke. Functional outcome was analyzed among survivors as an
  ordinal variable with modified Rankin Scale scores ranging from 0–5 (0 indicating
  no symptoms, 5 indicating severe disability). In a sub-analysis, mortality as outcome
  was analyzed as a dichotomized variable
article_title: Brain Health Loss Mediates the Effect of Infarct Volume on Functional
  Outcome in Ischemic Stroke
