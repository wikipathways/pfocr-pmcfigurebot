figure_title: Schematic illustration of SP-induced apoptosis via both extrinsic and
  intrinsic pathways.
caption: 'Schematic illustration of SP-induced apoptosis via both extrinsic and intrinsic
  pathways. In the extrinsic pathway, SPs activate the FAS receptor, leading to recruitment
  of FADD and sequential activation of pro-caspase-8/10 and caspase-3/7. Activated
  caspase-8 cleaves BID, linking to the mitochondrial pathway. In the intrinsic pathway,
  SPs disrupt mitochondrial integrity through ROS generation and activation of Bax/Bak,
  promoting cytochrome c release and apoptosome formation (Apaf-1/ATP complex), which
  activates caspase-9. The convergence of these cascades ultimately results in programmed
  cell death. Abbreviations: SPs, sulfated polysaccharides; FADD, Fas-associated death
  domain; BID, BH3-interacting domain death agonist; ROS, reactive oxygen species;
  Apaf-1, apoptotic protease activating factor-1; ATP, adenosine triphosphate'
