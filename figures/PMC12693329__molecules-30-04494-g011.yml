caption: (a) Correlation of ET rate constant (KET) with intrinsic dipole coupling.
  (b) Correlation of KET with transition dipole coupling in nine PS–catalyst pairs.
  (c) Optimized structures of GS, TI, and MS of CAT 1. (d) Experimental and theoretical
  XANES spectra of CAT 1 at GS. (e) XANES difference spectrum of TI1 with theoretical
  fitting (delay 0.4  ±  0.3 µs, 7.1% fraction), where A, B, C, D, and E represent
  main positive absorption feature of TI1, minor positive absorption feature, main
  negative absorption feature of TI1, secondary negative feature and high-energy structural
  change feature, respectively. (f) Experimental and theoretical XANES spectra of
  CAT 1 at MS. (g) XANES difference spectrum of TI2 with theoretical fitting (delay
  0.4 ± 0.3 µs, 4.5% fraction). (h) DFT-calculated free-energy profile of CAT 1 along
  the CO2RR pathway, with GS, TI1, TI2, and MS resolved by operando TR-XAS. Reproduced
  from Ref. [37] with permission from Springer Nature
