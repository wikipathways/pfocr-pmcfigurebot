figure_title: The relationship between AD p athological mechanisms and the therapeutic
  interventions targeting them.
caption: 'The relationship between AD p athological mechanisms and the therapeutic
  interventions targeting them. It visually connects key processes like amyloid-β
  aggregation, tau hyperphosphorylation, oxidative stress, neuroinflammation, and
  cholinergic deficiency to specific molecular mechanisms from clinical trials, such
  as cholinergic modulation (sage), antioxidant effects (Curcumin and sage), sirtuin
  activation (resveratrol), BBB protection (olive oil- and olive-tree-derived compounds
  ) and neuroprotection (grape-derived polyphenols). Aβ: amyloid β peptide; BBB: blood–brain
  barrier, CNS: Central Nervous System, IL-8: interleukin-8, NFT: neurofibrillary
  tangle. Green arrows indicate the benefit from the natural product and the pathway
  they regulate, while red stars indicate the problem or molecular mechanism characterized
  in Alzheimer’s disease'
