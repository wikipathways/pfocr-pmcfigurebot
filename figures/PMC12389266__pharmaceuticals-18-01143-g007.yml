caption: |-
  SZC-6 Modulation of the NF-χB pathway in LPS-treated RAW264.7 cells. (A) Venn diagram showing overlapping potential compound targets of SZC-6 and therapeutic targets for DU treatment. (B) Bubble plot of GO function analysis of potential compound targets of SZC-6 in DU treatment. (C) Bubble plot of KEGG enrichment of potential compound targets of SZC-6 in DU treatment. (D,E) Effects of SZC-6 at different doses on MyD88, p-IκBα, and p65 expression in LPS-treated RAW264.7 cells (Figure S6). (F) Effects of SZC-6 at different doses on the nuclear translocation of p65 in LPS-treated RAW264.7 cells. Scale bar = 25 μm. Data are presented as Mean ± SEM, n = 3, ** p < 0.01, and *** p < 0.001 indicate significant differences compared to the NC group, while #
  p < 0.05 and ## p < 0.01 indicate significant differences compared to the HG + LPS group. NC refers to negative control, HG + LPS refers to the high-glucose model group, SZC-6-L denotes 5 μM SZC-6, and SZC-6-H denotes 10 μM SZC-6
