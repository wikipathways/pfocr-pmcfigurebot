figure_title: Structure of the trimeric PD3 channel.
caption: Structure of the trimeric PD3 channel. (A) Ribbon diagrams and electrostatic
  surface potentials of the side and top views of the trimer PD3 channel. The three
  PD3 domains of the MmpL5 trimer are in different colors. The blue (> 10 kBT) and
  red (< −10 kBT) colors of the electrostatic surface potential indicate the positively
  and negatively charged areas of the protein, respectively, where kB is the Boltzmann
  constant and T is absolute temperature. White denotes area between 10 kBT and −10
  kBT. The needle-like apparatus of the PD3 channel is 125 Å long and 40 Å wide. (C)
  The interior of the central channel creates a pathway for transporting substrates.
  The channel, calculated by HOLE (http://www.holeprogram.org), is indicated by cyan
  dots. Residues forming the restriction sites and narrowest regions of the channel
  are represented with sticks. (D) The elongated substrate transport channel connecting
  the outer leaflet of the inner membrane up to the outer mycomembrane. The beginning
  of this channel is generated by a hydrophobic pocket created by TM7-TM10 of MmpL5.
  This channel (colored blue) was calculated using the program CAVER (http://loschmidt.chemi.muni.cz/caver).
  In both (B) and (C), the restriction site is created by residues M615 and F619 of
  each PD3 subdomain of the MmpL5 trimer
article_title: Structures of MmpL complexes reveal the assembly and mechanism of this
  family of transporters
