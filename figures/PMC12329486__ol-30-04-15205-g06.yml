figure_title: DPYSL3, a miR-141-3p target, was indirectly controlled by LINC00467.
caption: DPYSL3, a miR-141-3p target, was indirectly controlled by LINC00467. (A)
  WT and Mut DPYSL3 3′-UTR sequences. (B) Luciferase reporter assays were used to
  assess interactions between miR-141-3p interactions with the DPYSL3 3′-UTR, following
  transfection of MKN45 cells with the miR-141-3p mimics and luciferase reporter vectors
  containing the WT or Mut DPYSL3 3′-UTR. (C) Relative DPYSL3 mRNA expression levels
  in HGC27 cells was reduced following LINC00467 knockdown. LINC00467 knockdown in
  HGC27 cells reduced DPYSL3 protein expression levels (D). Effects of miR-141-3p
  overexpression and knockdown on DPYSL3 (E) mRNA and (F) protein expression levels,
  in HGC27 cells. (G) Relationship between DPYSL3 and AKT, Myc and GLUT1 associated
  with the AKT signaling pathway was explored by Western blotting analysis. **P<0.01,
  vs. miR-NC. PGK, phosphoglycerate kinase; GLUT1, glucose transporter 1; HK2, hexokinase
  2; LDHA/C, lactate dehydrogenase A/C isoforms; WT, wild-type; Mut, mutant; NC, negative
  control; si-NC, small interfering RNA-NC; miR-141-3p, microRNA-141-3p; DPYSL3, dihydropyriminidase-like
  3; miR-NC, microRNA-NC
