figure_title: Effect of GAL3 locus on growth on galactose
caption: (A) Yeast galactose utilization pathway with genes colored by locus (GAL1/7/10
  form a single locus). (B) LOD scores for linkage mapping on galactose. Strong peaks
  at GAL pathway genes indicated. The FLO11, WHI2 and MSS11 QTL are not specific to
  the GAL condition. Insert rescales Y axis to highlight strong QTL other than GAL3.
  5% family-wise significance threshold in red. Chromosomes alternating in grey and
  white. (C) Growth on galactose for strain subpopulations defined by GAL3 haplotype.
  (D) Effect on founder 1 and founder 3 growth on galactose after transformation with
  plasmids expressing their own GAL3 allele (top) or derivatives (below). Growth is
  scaled relative to transformation with the S288c reference allele of GAL3 (100%)
  and an empty vector (0%). (E) Masking epistasis between the GAL1/7/10 introgression
  and GAL3 haplotypes, classified as loss-of-function (GAL3-, haplotypes 1&3) or functional
  (GAL3+, remaining haplotypes)
