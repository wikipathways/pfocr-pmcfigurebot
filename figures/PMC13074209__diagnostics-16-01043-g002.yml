figure_title: Types of delays contributing to inflammatory bowel disease (IBD) diagnosis.
caption: 'Types of delays contributing to inflammatory bowel disease (IBD) diagnosis.
  Schematic representation of four key types of diagnostic delays in IBD. 1. Delay
  in patients seeking medical attention in the community (cut-off: 1 month) reflects
  late presentation of symptoms to general practitioners (GPs). 2. Delay in GP referral
  to the point of review in the gastroenterology clinic (cut-off: 1 week) reflects
  outpatient waiting times. 3. Delay between first speciality review and index endoscopy
  (cut-off: 4 weeks) reflects waiting list for endoscopy units. 4. Delay between first
  formal diagnosis and initiation of treatment for IBD (cut-off: 4 weeks) reflects
  local hospital practices and treatment pathways. Together, these categories highlight
  patient-, system-, and hospital-level factors influencing the timeliness of IBD
  diagnosis and management. Image created with BioRender.com https://app.biorender.com/user/
  (accessed on 1 January 2026)'
