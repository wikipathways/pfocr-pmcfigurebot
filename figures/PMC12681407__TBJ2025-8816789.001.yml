figure_title: Regulatory relationships between miRNAs and MMP-2 in breast cancer progression.
caption: 'Regulatory relationships between miRNAs and MMP-2 in breast cancer progression.
  ECM degradation is essential for blood vessel formation and proliferation, and MMP-2
  can process various ECM components, including type I collagen, to aid in these processes.
  The diagnostic potential of miR-29a, miR-335, and MMP-2 was evaluated, and their
  correlation was shown to be more effective than traditional biomarkers such as CEA
  and CA 15.3. Furthermore, miR-616 increased BC cell proliferation and migration
  by directly affecting the tissue inhibitor TIMP2, suggesting that the miR-616/TIMP2/MMP
  pathway could serve as a novel therapeutic target. The oncoprotein c-Met was identified
  as a target of miR-340 in human BC cell lines, which promotes cell migration by
  regulating the expression of MMP-2 and MMP-9. Consequently, decreased expression
  of miR-340 was associated with higher-grade cancers. In metastatic tumors, the levels
  of cell division control protein 42 (Cdc42), MMP-2, and MMP-9 were lower, while
  miR-206 may reduce the invasion and migration of MDA-MB-231 cells, in part by managing
  the remodeling of the actin cytoskeleton. In addition, miR-106b can inhibit cell
  proliferation and migration by reducing MMP-2, which inactivates ERK and increases
  osteoblast activity through the miR-106b/MMP-2/ERK pathway, potentially leading
  to bone metastasis in BC. Breast cancer: BC; TAM: tumor-associated macrophage; matrix
  metalloproteinase-2: MMP-2. Control protein 42: Cdc42; TIMP metallopeptidase inhibitor
  2: TIMP2; extracellular signal-regulated kinase: ERK1'
