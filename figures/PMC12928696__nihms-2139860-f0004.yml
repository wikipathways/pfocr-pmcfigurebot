figure_title: GO, KEGG, and PPI network analyses.
caption: 'GO, KEGG, and PPI network analyses.A) Significant clusters in the PPI network
  analysis using the STRING database. B) Schematic representation of hub genes screened
  by the degree in the PPI network. The node size and colour are positively correlated
  with degree: brown indicates a larger degree, and blue indicates the minimum degree.
  C) KEGG pathway enrichment analysis without multiple testing adjustment. D) GO biological
  function enrichment analysis after FDR correction. PPI, protein-protein interaction;
  GO, Gene Ontology; KEGG, Kyoto Encyclopedia of Genes and Genomes; BP, biological
  process; MF, molecular function. (For interpretation of the references to colour
  in this figure legend, the reader is referred to the web version of this article.)'
