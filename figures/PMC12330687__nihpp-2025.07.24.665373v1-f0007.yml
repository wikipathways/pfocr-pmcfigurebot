figure_title: ID1/ID3 act through cell cycle genes and the MEK pathway
caption: a) Scatter plot of top KEGG pathways enriched by differentially expressed
  genes in PBS-treated HLF vs AGX-51-treated HLF in the presence of Serum (5% FBS)
  (n = 4 per group). b) PCR analysis of ccna2, ccnb2 and cdk1 mRNA levels in HLF treated
  with PBS or AGX51 in the presence of Serum (5% FBS) (n = 3–4 per group). c) Pulmonary
  ccna2, ccnb2 and cdk1 mRNA levels in lungs from the indicated groups (n = 5–6 per
  group). d) CCNA2, CCNB2 and CDK1 protein levels in HLF treated with 5%FBS in the
  presence or absence of AGX51 (n = 4–6 per group). e) Lung protein expression of
  CCNA2, CCNB2 and CDK1 in lungs from the indicated groups (n = 4–6 per group). f)
  Proliferation of human lung fibroblasts in the presence of the indicated treatments.
  n = 5 experiments performed in triplicate. g) HLF treated with TGFβ or AGX51 were
  lysed and analyzed on western blots with antibodies against MEK1 and phospho-MEK1.
  (Left) Representative Western blots. (Right) Quantitative analysis of Western blot
  data (n = 4 per group). h) HLF treated with Adenovirus control (Ad-Ctrl) or Adenoviruses
  ID1+ID3 (Ad-ID1/ID3) were analyzed on western blots with antibodies against MEK1
  and phospho-MEK1. (Left) Representative Western blots. (Right) Quantitative analysis
  of Western blot data (n = 3–4 per group). i) qPCR assessment of Acta2, Col1a1 and
  CTGF mRNA levels 48h after HLF treatment with Adenoviruses ID1+ID3 (Ad-ID1/ID3)
  and a MEK1 inhibitor (Selumetinib, 10 μM). n = 4 experiments performed in duplicate.
  * P < 0.05; ** P < 0.01. *** P < 0.001
