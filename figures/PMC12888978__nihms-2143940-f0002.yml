figure_title: Subthalamic pathways.
caption: Subthalamic pathways. A) Whole-brain view within CIT168 space. The thalamus
  (yellow volume), STN (green volume), pallidum (blue volumes), and the 2202 DBS lead
  in the left-hemisphere. B) Whole-brain view with axonal pathway models. C-K) Zoomed-in
  view of the subthalamic region with the individual pathway streamlines displayed
  in isolation. C-G) The pallidothalamic, motor hyperdirect, cerebellothalamic, pallidosubthalamic,
  and subthalamopallidal are considered therapeutic pathways. H-K) The motor internal
  capsule, prefrontal internal capsule, prefrontal hyperdirect, and medial lemniscus
  are considered side-effect pathways
