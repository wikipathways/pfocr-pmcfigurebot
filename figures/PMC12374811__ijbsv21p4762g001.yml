figure_title: Mechanisms of MCs damage in DKD.
caption: Mechanisms of MCs damage in DKD. During DKD, MCs undergo a range of pathological
  changes, including oxidative stress, mitochondrial dysfunction, abnormal lipid metabolism,
  and epigenetic dysregulation. As shown, Fyn expression was upregulated in DKD MCs,
  which inhibited the expression of antioxidant genes such as catalase through the
  Sirt1/FoxO3a pathway. In addition, Nrf2 was downregulated in HG-induced MCs, leading
  to ROS accumulation and inducing MCs injury. Dysfunctional mitochondria contribute
  to the progression of DKD. In DKD, impaired mitophagy, abnormal mitochondrial dynamics,
  and decreased mitochondrial production all contribute to MC destruction. It is worth
  noting that lipid metabolism undergoes substantial dysregulation in the early stages
  of DKD. Among other ways, poor fatty acid utilisation causes the production of lipid
  droplets, which has a negative impact on MCs. Finally, epigenetic alterations such
  as DNA methylation, histone modifications and non-coding RNA modifications are involved
  in MCs damage and subsequent dysfunction in DKD
