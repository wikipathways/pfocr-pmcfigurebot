figure_title: ECMSim network architecture and diffusion model
caption: 'Representation of the integrated cardiac fibroblast signaling model implemented
  in ECMSim, illustrating the key components and their interactions. The model encompasses;
  (A) Single feedback loop: representation of how feedback loops connected in ODE
  system; (B) ODE-based signaling pathway: crosstalk between signaling modules including
  MAPK cascades (ERK, p38, JNK), PI3K-Akt-mTOR, Rho GTPase, and mechanotransduction
  pathways; (C) Matrix remodeling: include cell-cell crosstalk with feedback molecules
  and ECM molecule diffusion; (D) Diffusion dynamics: spatial diffusion to neighboring
  cells, demonstrating the multi-scale integration from molecular interactions to
  tissue-level coordination according to the given conditions in the ECMSim platform'
