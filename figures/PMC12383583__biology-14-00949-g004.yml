caption: Functional enrichment analysis of differentially expressed genes in SME-treated
  E. coli. (A) Upregulated genes are mainly enriched in translation and cell envelope
  biosynthesis, including ribosome and peptidoglycan pathways. (B) Downregulated genes
  are enriched in central metabolism and DNA repair, including the TCA cycle, ethanolamine
  utilization, and SOS response. Bubble size corresponds to the number of associated
  DEGs; color intensity reflects statistical significance (−log10p-value)
