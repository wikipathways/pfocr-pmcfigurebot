figure_title: The mitotic-stopwatch pathway
caption: (A) During early mitosis, 53BP1 localizes to the kinetochore (KT), where
  it is functionally inhibited, likely through post-translational modifications. As
  mitosis progresses, PLK1-mediated phosphorylation of an unknown substrate displaces
  53BP1 from the KT, which in turn licenses the assembly of USP28-53BP1-p53 trimeric
  stopwatch complexes. Within these complexes, USP28 deubiquitylates and stabilizes
  p53, leading to the transcriptional activation of p21 and the induction of cell
  cycle arrest in the subsequent interphase. Approximately 90 minutes into mitosis,
  the mitotic surveillance pathway (MSP) is activated due to the critical accumulation
  of stabilized p53. Concomitantly, the gradual degradation of MDM-2, a negative regulator
  of p53 stability, cooperates with the MSP to trigger p53 activation. (B) Time-course
  of KT-based 53BP1 inhibition (gray region), stopwatch complex formation (red line),
  and MDM2-based p53 repression (dotted line) during MSP activation. Threshold levels
  of stopwatch complex formation can occur in response to a single prolonged mitosis
  (left) or after multiple cell cycles experiencing moderate mitotic delays (right)
