figure_title: Schematic representation of the apoptotic signaling pathways.
caption: Schematic representation of the apoptotic signaling pathways. The diagram
  illustrates the extrinsic pathway initiated by death receptor ligands (FasL/TRAIL)
  binding to death receptors (Fas/TRAILR), leading to the formation of the death-induced
  signaling complex (DISC). This complex activates caspase-8, which, in turn, activates
  caspases 3/6/7, leading to apoptosis. The intrinsic pathway is triggered by intrinsic
  lethal stimuli, activating BH3-only proteins that disrupt the Bcl-2/Bcl-xL/MCL-1
  complex, leading to the activation of BAX/BAK and the release of cytochrome C from
  the mitochondria. Cytochrome C then forms the apoptosome, which activates caspase-9
  and, subsequently, caspases 3/6/7, culminating in apoptosis. The diagram also shows
  the interaction between the extrinsic and intrinsic pathways through Bid
