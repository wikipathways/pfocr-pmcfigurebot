caption: The impact of PI3K/AKT/mTOR pathway inhibition on intracellular markers of
  cascade activity and autophagy. (A–C) Forest plots illustrating changes in the total
  AKT level (A), the phosphorylated form of AKT (p-AKT) (B), and the integral autophagy
  marker LC3-II/I (C) following pharmacological inhibition of PI3K/AKT/mTOR. Effect
  sizes are presented as standardized mean differences (Hedges’ g) with 95% confidence
  intervals (CI). (D) Summary table of meta-analytic estimates, synthesizing the direction
  and significance of changes in intracellular signaling markers and autophagy markers
