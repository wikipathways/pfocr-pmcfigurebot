  expressed POGZ targets in NSC compound heterozygous lines (right panel). Intersection
  of two gene lists is represented by “⋂”. Numbers in parentheses indicate the total
  number of genes in a given gene list. Colors represent pathway categorization according
  to the nature of the functional categories related to the enriched term. Groups
  of functional categories: APO: apoptosis, VESIC: vesicles, VASC: vascular system,
  ENERGY: energy metabolism, IMMUNE: immune system and inflammation, MIG: cell migration,
  MIT: mitosis and cell proliferation, TRANSLATION: translation, RNA: RNA metabolism,
  STEROID: steroid metabolism, CSKEL: cytoskeleton, CHROM: chromatin structure and
  regulation, SIG: intracellular signaling pathways, ECM: extracellular matrix, SYN:
  synapse. BH: Benjamini-Hochberg adjusted p-values'
