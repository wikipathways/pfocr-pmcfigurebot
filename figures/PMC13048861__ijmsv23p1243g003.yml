figure_title: Transcriptomic profiling reveals that ES treatment downregulates global
  lipid metabolism.
caption: Transcriptomic profiling reveals that ES treatment downregulates global lipid
  metabolism. (A) The principal component analysis (PCA) of the transcriptomics data
  between the untreated grouP and the ES-treated grouP in HL-60 cells. (B) DEGs between
  the ES-treated grouP and the untreated grouP of the HL-60 cells were visualized
  using a MA plot (Blue dots represent genes downregulated in the ES-treated group;
  Red dots indicate genes upregulated in the ES-treated group; Gray dots signify genes
  with no significant expression differences.). (C) GSEA of DEGs comparing the ES-treated
  grouP to the untreated grouP of the HL-60 cells, focusing on the enrichment of the
  “CITRATE CYCLE (TCA CYCLE)” pathway. (D) GSEA of DEGs comparing the ES-treated grouP
  to the untreated grouP of the HL-60 cells, focusing on the enrichment of the “OXIDATIVE
  PHOSPHORYLATION” pathway. (E) ToP 20 enriched GO terms (Biological Process) for
  DEGs. The enrichment significance is displayed as -log10(p-value). Bars are colored
  to indicate the proportion of upregulated (red) and downregulated (blue) genes within
  each term. The corresponding p-value and gene count are annotated for each bar.
  (F) ToP 20 enriched KEGG pathways for DEGs. The enrichment significance is displayed
  as -log10(p-value). Bars are colored to indicate the proportion of upregulated (red)
  and downregulated (blue) genes within each term. The corresponding p-value and gene
  count are annotated for each bar
