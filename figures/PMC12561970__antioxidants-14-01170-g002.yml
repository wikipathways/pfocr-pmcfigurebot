caption: 'Action mechanism of microalgae-derived peptides in mitigating oxidative
  stress, inflammation, and hypertension: (A) Microalgae-derived antioxidant peptides
  inhibit oxidative stress by scavenging ROS and activating the Nrf2 signalling pathway,
  promoting the expression of antioxidant enzymes. These peptides also protect against
  cellular inflammation and apoptosis by suppressing the NF-κB/MAPK signalling pathway
  and stabilising p53 and inhibiting cytochrome c release. (B) Microalgae-derived
  antihypertensive peptides interfere with the RAAS by inhibiting ACE activity and
  reducing Ang II production. In addition, the antihypertensive peptides suppress
  ROS formation and downregulate NF-κB/MAPK-mediated endothelial dysfunction, reducing
  pro-inflammatory factors and adhesion molecules, ultimately alleviating hypertension.
  Arrows indicate activation or direction of pathways; blue downward arrows show downregulation
  due to peptide action, and blue “X” indicates inhibition by peptide action. Created
  in BioRender. Qoms, M. (2025) https://BioRender.com/nvuth2e, accessed on 21 August
  2025'
