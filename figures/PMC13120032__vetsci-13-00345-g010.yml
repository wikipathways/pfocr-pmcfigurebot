figure_title: Box-violin plots of relative abundances for 12 representative metabolites
  spanning the major affected pathways.
caption: 'Box-violin plots of relative abundances for 12 representative metabolites
  spanning the major affected pathways. Each panel shows the distribution across four
  experimental groups (SCM-D2, blue; H-D2, green; SCM-D21, orange; H-D21, red). Violin
  shapes depict kernel density estimates; boxes show median and interquartile range;
  individual data points are overlaid. Significance brackets: * p < 0.05; ** p < 0.01;
  *** p < 0.001 (Welch’s t-test). Selected metabolites illustrate key biological themes:
  Uracil (pyrimidine metabolism) shows a dramatic increase in H-D21 (FC = 108.36);
  4-Hydroxybenzaldehyde/3-Hydroxybenzaldehyde was significant in all four comparisons;
  Alanyl-Alanine and Valyl-Arginine (dipeptides) were elevated in SCM-D2, reflecting
  proteolytic activity; Arginyl-Glycine and Arginyl-Alanine (dipeptides) were elevated
  in SCM-D2, consistent with the proteolytic signature;Ornithine and Cystine exemplify
  direction reversals (depleted in SCM at D2, accumulating during involution); Norepinephrine
  and Hypotaurine were strongly depleted in SCM-D2, suggesting catecholamine depletion
  and oxidative stress; N-Acetylindoxyl (tryptophan/xenobiotics) accumulated prominently
  during involution in both groups. n = 10 per group'
