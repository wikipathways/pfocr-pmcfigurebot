figure_title: Role of NSPs and the accessory protein in the escape of PEDV from host
  innate immunity.
caption: 'Role of NSPs and the accessory protein in the escape of PEDV from host innate
  immunity. Upon infecting host cells, PEDV antagonizes the host innate immune response
  through mechanisms involving its NSPs and accessory protein, thereby facilitating
  viral evasion of host immune defenses. Following PEDV infection, host cells initiate
  immune signaling cascades, which are subsequently suppressed primarily by viral
  NSP family proteins and the ORF3 protein. Viral recognition occurs via TLRs on the
  cell membrane, activating pathways such as MyD88 and TRIF, while intracellular PRRs
  including RIG-I and MDA5 detect viral RNA, triggering the MAVS-mediated signaling
  pathway. The NSPs of PEDV inhibit key signaling molecules like IRFs and NF-κB, disrupting
  both the production and signaling of IFN-I. Furthermore, these NSPs suppress nuclear
  antiviral factors, including ISGs. Additionally, PEDV interferes with the MHC-I
  antigen presentation pathway, further complicating the recognition of infected cells
  by NK cells. Collectively, these mechanisms strategically enable PEDV to evade the
  host innate immune systemTLRs: Toll-like receptors; TIRAP: Toll interleukin 1 receptor
  domain containing adaptor protein; TRAM: Toll-like receptor adaptor molecule; MyD88:
  myeloid differentiation factor 88; TRIF: TIR-domain-containing adaptor inducing
  interferon-β; IRAK4: interleukin-1 receptor-associated kinase 4; TAB1: TGF-beta-activated
  kinase 1 and MAP3K7-binding protein 1; TAK1: transforming growth factor-β-activated;
  IKKβ: inhibitor of kappa B kinase beta; IKKα: IκB kinase alpha; IκBα: inhibitor
  of nuclear factor κBα; IKKε: inhibitor of nuclear factor-κb epsilon kinase; ISGs:
  interferon-stimulated genes; STING: stimulator of interferon genes; ISRE: interferon
  stimulated response element. This figure was created by BioGDP.com [23]'
