figure_title: Therapeutic potential of OMVs in periodontitis and OSCC.
caption: Therapeutic potential of OMVs in periodontitis and OSCC. (A). Drugs can target
  OMVs for the treatment of periodontitis. HEF promotes the production of excess abnormal
  OMVs by P. gingivalis, which in turn downregulates the expression of the important
  OM transport proteins RagA and RagB in bacteria, decreases gingipain activity, and
  ultimately disrupts nutrient cycling. Curcumin can suppress the expression of the
  proinflammatory cytokines IL-6, IL-1β, and TNF-α in HGECs induced by P. gingivalis
  OMVs. QSIs can block QS, which may function partly through T. forsythia OMVs, to
  inhibit bacterial biofilm formation. It also blocks the MAPK and NF-κB signalling
  pathways to suppress the proinflammatory cytokine production induced by T. forsythia
  OMVs in monocytes. (B). P. gingivalis OMVs can be used as antigens in periodontitis
  vaccines. With immune adjuvants such as poly(I:C) and the more efficient A. actinomycetemcomitans
  OMVs, IgG in the serum and s-IgA in the mucosa can be induced via intranasal immunization.
  (C). E. coli OMVs can act as carriers for 5-FU and TiO2 in OSCC. The system E. coli
  OMV-MSN-5-FU effectively decreases the expression of the cancer progression biomarker
  Naa10 and inhibits the proliferation and metastasis of cancer cells. The system
  TiO2@E.coli OMV enhances the radiosensitization and immune activation of the tumour
  tissue. P. gingivalis OMVs can act as a target of sRNA23392 inhibitors to inhibit
  the P. gingivalis OMV-related metastasis
