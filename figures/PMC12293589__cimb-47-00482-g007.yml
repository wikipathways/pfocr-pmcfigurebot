figure_title: The effects of TNF-α on DRG neurons are independent of the NGF signaling
  pathway.
caption: 'The effects of TNF-α on DRG neurons are independent of the NGF signaling
  pathway. The neurite length of DRG neurons in the control group and the experimental
  group was measured following siRNA transfection and TNF-α/NGF for 48 h. Cell bodies
  and neurites were visualized via immunofluorescence staining with NF200 (green)
  and siRNA was labeled with cy3 (red). Scale bar = 20 μM. (A) Knockdown efficiency
  of siRNA was determined by RT-qPCR; (B) NC group received nonspecific siRNA, NC+TNF-α
  group received nonspecific siRNA and TNF-α, si-NGFR group received NGFR siRNA, si-NGFR+TNF-α
  group received NGFR siRNA and TNF-α; (C) Treatments were performed as indicated.
  Data are presented as mean ± SEM (n = 3 per group), ns: not significant, *** p <
  0.001'
