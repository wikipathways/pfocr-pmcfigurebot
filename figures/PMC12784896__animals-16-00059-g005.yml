figure_title: Effect of WEAA levels on the expression of TLR4/NF-κB signaling pathway-related
  genes in PBLs.
caption: 'Effect of WEAA levels on the expression of TLR4/NF-κB signaling pathway-related
  genes in PBLs. Abbreviations: TLR4 = Toll Like Receptor 4; IKKβ = Inhibitor of Nuclear
  Factor Kappa B Kinase Subunit Beta; IκB-α = NFKB Inhibitor Alpha; NFκBp65 = RELA
  Proto-Oncogene; IL-1β = Interleukin 1β; IL-4 = Interleukin 4; WEAA = Water Extracts
  of Artemisia annua L. Different concentrations of WEAA (0, 25, 50, 100, 200 and
  400 µg/mL), values were expressed as the means of 6 replicates in each group. Dose-dependent
  effects of WEAA (Lin = Linear; Qua = Quadratic), assesses the linear and quadratic
  effects on various response indices as a function of increasing WEAA supplementation
  levels. Values within a row with different superscripts (a, b, c) differ significantly
  at p ≤ 0.05, whereas the probability value of 0.05 < p < 0.10 was considered as
  a tendency'
