figure_title: Schematic representation of the possible pathway via which PKC-ι regulates
  MAPK/JNK pathway proteins in breast cancer.
caption: Schematic representation of the possible pathway via which PKC-ι regulates
  MAPK/JNK pathway proteins in breast cancer. The inhibition of PKC-ι leads to c-Jun
  degradation or reduced expression, which decreases the AP-1 activity. Decrease in
  AP-1 activity reduces the levels of TNF-α, TAK-1, MKK7 and JNK. Decrease in the
  levels of JNK activity further decreases c-Jun expression, thereby reinforcing the
  oncogenic positive feedback loop. All these proteins play an oncogenic role in breast
  cancer proliferation and survival; therefore, reducing the levels of these proteins
  will lead to decreased proliferation and survival
article_title: PKC-ι Regulates an Oncogenic Positive Feedback Loop Between the MAPK/JNK
  Signaling Pathway, c-Jun/AP-1 and TNF-α in Breast Cancer
