figure_title: Reconstruction of the sphingolipid signaling network.
caption: 'Reconstruction of the sphingolipid signaling network. The bioactive sphingolipid
  S1P, synthesized by SphK1/2, regulates cell proliferation and inflammation. In PH,
  elevated S1P levels bind to S1PR1–5 receptors and activate downstream pathways,
  including the YAP, JAK/STAT, and ERK pathway, thereby promoting the transcription
  of EGR1, SPHK1, KLF4, and Notch3. These changes ultimately drive cell proliferation
  and amplify inflammatory responses. Additionally, endothelial-derived EMAP II further
  triggers the SphK2/S1P axis, specifically inducing histone acetylations in PASMCs,
  which contribute to pulmonary vascular remodeling. Red arrows in the figure denote
  the upregulated expression of target molecules in PH. EGR1: Early growth response
  1; EMAP II: Endothelial monocyte-activating polypeptide II; ERK1/2: Extracellular
  signal-regulated kinase 1/2; H3K9: Histone H3 lysine 9; KLF4: Krüppel-like factor
  4; Notch3: Notch receptor 3; S1P: Sphingosine-1-phosphate; S1PR1–5 (labeled SIPR1-5
  in figure): Sphingosine-1-phosphate receptors 1–5; SPHK1/2: Sphingosine kinase 1/2;
  STAT3: Signal transducer and activator of transcription 3; YAP1: Yes-associated
  protein 1. This figure was created with BioRender.com'
