figure_title: Glucocorticoid and TNFR2 signaling pathway reciprocally regulate CD25loAREGpos
  Treg and CD25hiCXCR6pos Treg differentiation by modulating glycolysis
caption: 'a, UMAP plots highlighting AREG expression in RA synovial tissue. b, Suppressive
  assay of sorted CD25loCXCR6neg Tregs (including CD25loAREGpos Tregs), CD25hiCXCR6pos
  Tregs, and Tconv from RA synovial tissues (n=3 donors). Left: representative histogram;
  right: mean suppressive capacity. Treg suppressive capacity was calculated as Fig.
  3c. c, UMAP plots showing NR3C1, and FKBP5 expression in RA synovial tissue Tregs.
  d, Pearson’s correlations between CD25loAREGpos Treg markers and suppressive genes
  across Treg subsets. Color ranges from yellow (lowest negative correlation) to purple
  (highest positive correlation), data was trimmed to [−0.6,0.6]. e-f, Effects of
  cortisol on AREG expression in Tregs. ELISA (e) and qPCR (f) analyses shown (n=4
  donors). g, Flow cytometric analysis of FOXP3 and ICOS in Tregs treated with IL-2
  ± cortisol (n=4 donors). h-l, Effects of TNFR2 agonism on glycolysis and Treg suppressive
  function after cortisol treatment. Tregs were isolated from healthy donor blood
  and pre-treated with IL-2 and cortisol (5μM) or TNFR2ago(5μg/ml) for 3 days (n=4
  donors). (h) Flow cytometric analysis of 6-NBDG uptake. (i) Basal glycoATP production
  (ATP derived from glycolysis as measured by ECAR). (j) Flow cytometric analysis
  of Treg markers. (k) in vitro suppressive assay. Representative histogram (left)
  and mean suppressive capabilities (right) are shown. (l) Immunoblot for p-mTOR,
  total mTOR, p-STAT5, total STAT5. m-n, Effects of TNFR2 agonism on AREG expression
  and glycolysis in Tregs stimulated with TCR/IL-2 and cortisol (n=4 donors). (m)
  qPCR analysis of AREG expression. (n) Basal glycoATP production. o-p, Effects of
  cortisol on differentiation of CD25loAREGpos Tregs and CD25hiCXCR6pos Tregs from
  naïve and memory Treg precursors. Naïve and memory Tregs were isolated from healthy
  donor blood and stimulated with indicated conditions for 6 days (n=4 donors). (o)
  qPCR analysis (left) and ELISA (right) analyses of AREG expression. (p) Flow cytometric
  analysis of CXCR6 expression in Tregs. All gene expressions were normalized to β2M.
  Data represent mean ± SEM. Statistical significance was determined using unpaired
  t-tests, paired t-test (b) or one-way ANOVA in (e): *p < 0.05, **p<0.01, ***p <0.001,
  ****p <0.0001'
