figure_title: Transcriptomic profiling of SA-βGal high naïve CD4+ and CD8+ T cells
  reveals enrichment of cytotoxic, migratory, and inflammatory programs
caption: '(A–B) Volcano plots of RNA-seq data comparing SA-βGal high versus low naïve
  CD4+ (A) and CD8+ (B) T cells. Differentially expressed genes (FDR < 0.05, |log2
  fold change| ≥ 1) are shown, with selected genes involved in cytotoxicity (green)
  and migration (purple) highlighted (e.g., GZMH, GNLY, CCL5, CXCR3, ADAM19, GPR15).
  (C) GO pathway enrichment analysis of differentially expressed genes in SA-βGal
  high T cells reveals significant overrepresentation of immune and inflammatory processes,
  including chemokine signaling, cytokine-receptor interaction, and phagocytosis.
  Bubble size reflects enrichment score; color indicates p-value. (D) Heatmap showing
  functional pathway Z-scores for processes related to leukocyte migration, chemotaxis,
  and cytoskeletal organization. SA-βGal high cells display positive enrichment for
  cell motility-associated functions. (E) Heatmap of gene expression values (log-transformed)
  for genes categorized by function: cytotoxicity (e.g., GZMH, GNLY), migration (e.g.,
  CXCR6, GPR15), cytokine signaling (e.g., TNFRSF18, CCL5), and exhaustion (e.g.,
  CTLA4, PDCD1). Columns represent CD4+ and CD8+ T cells. (F) Expression heatmap of
  SenMayo senescence gene set. Only a subset of genes (e.g., CSF2RB, CCL4, CXCL8)
  are significantly upregulated in SA-βGal high T cells (denoted by asterisks). Most
  senescence-associated transcripts are not differentially expressed, indicating a
  distinct transcriptional program from canonical senescence. RNA-seq analysis was
  performed on sorted SA-βGal high and low naïve T cells from three donors per subset.
  Statistical thresholds: volcano plots (FDR < 0.05, |log2FC| ≥ 1); GO analysis (p
  < 0.05)'
article_title: Accumulation of SA-βGal–High Cells in Human Naïve T Cell Compartments
  Reveals a Stress-Adapted, Senescent-Like State
