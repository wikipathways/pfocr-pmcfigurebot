figure_title: Schematic illustration of Na+/K+−ATPase signaling pathway.
caption: Schematic illustration of Na+/K+−ATPase signaling pathway. Na+/K+−ATPase
  acts as an ion pump and signal transducer, triggering lung inflammation. The binding
  of ouabain to Na+/K+−ATPase signalosome located in caveolae transduces signals to
  multiple pathways. Ouabain binding to the Na+/K+-ATPase activates Src and PLC which,
  in turn, evokes transactivation of EGFR and, together with the recruitment of adaptor
  proteins and Ras, leads to the activation of Ras-Raf-MAPK/ERK1/2 signaling pathway
  and intracellular Ca2+ waves. Ras-Raf-MAPK/ERK1/2 signaling pathway can activate
  NF-κB. NF-κB activation by ouabain induces the expression of pro-inflammatory genes.
  The activation of the Ras-Raf-MAPK cascade reaction triggers mitochondria to produce
  ROS. The activation of ROS and enhanced Ca2+ activates NF-κB, leading to the activation
  of the immune system, cell proliferation and apoptosis. Ouabain can also induce
  the physical interaction between Na+/K+−ATPase and inositol triphosphate receptor,
  triggering intracellular Ca2+ waves. Moreover, the binding of ouabain to Na+/K+−ATPase
  also stimulates PI3K. ROS release stimulates AKT and NF-κB activation. AKT can activate
  PI3K and NF-κB or be phosphorylated by PI3K, essential to inflammation. However,
  the type of reaction depends on the cell type, glycoside concentration and exposure
  time. Src, non-receptor tyrosine kinases; PLC, phospholipase C; ROS, reactive oxygen
  species; PIP, phosphatidylinositol (3,4,5)-trisphosphate
