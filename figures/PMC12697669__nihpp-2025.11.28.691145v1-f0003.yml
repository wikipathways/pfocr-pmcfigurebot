figure_title: Regulation of membrane homeostasis through both the TOR and UPR pathways
  is required for CO2 tolerance
caption: A. Schematic representation of the early steps in C. neoformans sphingolipid
  biosynthesis pathway. B. Competitive fitness was determined for glucoceramide synthase
  mutant gcs1Δ after combining a 1:1 ratio of mNeonGreen labeled H99 and unlabeled
  mutant cells in RPMI 1640 medium with 165mM MOPS at pH 7 and incubating at 37°C
  in ambient air or 5% CO2 for 24hr. Cell populations were characterized by flow cytometry
  and the percentage of mNeonGreen negative cells in 5% CO2 was divided by those in
  ambient conditions to calculate competitive fitness. Bars represent the average
  of three biological replicates with error bars indicating SD. Asterisks indicate
  a significant difference relative to H99 as determined by Student’s t-test (P <
  0.05). C. Cells from overnight cultures of H99 were spread on solid RPMI agar plates
  buffered with 165mM MOPS to pH 7. Sterile disks were placed on plates and 100 μg
  aureobasidin A was added to each disk. Plates were incubated at 37°C in ambient
  air or 5% CO2 for 48hr before images were acquired. Images are representative of
  three biological replicates. D. Competitive fitness of the unfolded protein response
  (UPR) mutants ire1Δ and hxl1Δ in 5% CO2
article_title: Cryptococcus neoformans adapts to host CO2 concentrations through the
  coordinated remodeling of central carbon metabolism, oxidative stress resistance,
  and membrane homeostasis
