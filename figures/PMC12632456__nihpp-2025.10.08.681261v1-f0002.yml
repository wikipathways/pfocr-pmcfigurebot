figure_title: Transcritional profiling in WSB and WSB.APP/PS1 mice. Gene set enrichment
  analysis in WSB.APP/PS1 mice (compared to WSB) at 4, 8 and 14 months of age (M)
caption: (A) Age-dependent pathways identified by GO, KEGG and Reactome. Genes relating
  to each pathway are shown to the right. For pathways, positive NES score are shown
  in red, negative NES scores are shown in blue. For genes, increased log2 fold change
  is shown in red, decreased log2 fold change is shown in blue. (B) Alignment of differentially
  expressed genes in mouse with differentially expressed genes in human AMP-AD modules.
  A positive correlation is shown in blue, anti-correlation is shown in red. First
  three rows are combined for sex, second set of three rows are female only, third
  set of rows are male only. (C) One module, TCX yellow in Consensus Cluster D showed
  age-dependent correlations (strongest correlations at 14M), and included genes involved
  in microglia glia function on myelination. (D) Enrichment of genes positively correlated
  in human AMP-AD and WSB.APP/PS1 mice identified myelination-related processes, predicting
  white matter changes
article_title: WSB.APP/PS1 mice develop age-dependent cerebral amyloid angiopathy,
