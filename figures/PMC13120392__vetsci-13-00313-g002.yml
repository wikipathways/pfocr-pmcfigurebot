caption: 'Transcriptomic analysis in mock and PEDV-infected groups. (A) Hierarchical
  clustering heatmap of differentially expressed genes between two groups. Blue represents
  downregulation and red represents upregulation. (B) Volcano plots of differentially
  expressed genes between two groups. Red and blue dots represent genes up-regulated
  and down-regulated, respectively. (C) GO analysis of DEGs was enriched in three
  pathway categories: biological process (BP), cellular component (CC), and molecular
  function (MF). (D) KEGG analysis of top 20 pathways between mock and PEDV-infected
  groups'
