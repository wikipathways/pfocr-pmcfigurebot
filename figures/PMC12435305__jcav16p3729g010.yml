figure_title: CAFs promote the resistance of NSCLC cell to osimertinib via NRG1-mediated
  HER3/AKT/NF-κB pathway.
caption: CAFs promote the resistance of NSCLC cell to osimertinib via NRG1-mediated
  HER3/AKT/NF-κB pathway. (A, B) NSCLC cells were cultured in DMEM/F12 with rhNRG1
  (100 ng/mL) or CAF-CM with NRG1 neutralizing antibody (100 ng/mL). The protein expression
  and phosphorylation were detected by Western blotting after 48 h. (C) NSCLC cells
  were pre-treated with HER3 inhibitor TX1-85-1(1 μM), AKT inhibitor perifosine (1μM)
  or NF-κB inhibitor JSH23 (10 μM) for 2 h, then cultured in CAF-CM and treated with
  osimertinib (100 nm or 2 μM) for 48 h. Cell viability was detected by CCK8. (D)
  NSCLC cells were pre-treated with HER3 inhibitor TX1-85-1(1μM), AKT inhibitor perifosine
  (1μM) or NF-κB inhibitor JSH23 (10μM) for 2 h, then were cultured in CAF-CM and
  treated with osimertinib (100 nm or 2 μM). The colony formation assay was performed
  after 1-2 weeks. Columns, mean; bars, SD. *P<0.05, **P<0.01, ***P<0.001
article_title: Cancer-associated Fibroblasts Confer Osimertinib Resistance in Non-small
  Cell Lung Cancer Cells via NRG1-mediated HER3/AKT Signaling
