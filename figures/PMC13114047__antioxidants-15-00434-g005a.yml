figure_title: FPS-ZM1 reduces ferroptosis following H1N1 infection via the ACSL4/POR/GPX4
  pathway.
caption: FPS-ZM1 reduces ferroptosis following H1N1 infection via the ACSL4/POR/GPX4
  pathway. (A) Western blot analysis of key ferroptosis proteins ACSL4, POR, RAGE
  and GPX4 in lung tissues of mice on day 8 post-PR8 infection (Representative blots
  of n = 3 are shown). (B–G) Correlation analysis between lung RAGE levels and Fe3+
  (B), Fe2+ (C), ACSL4 (D), POR (E), SOD (F), and GPX4 (G) on day 8 post-PR8 infection
  (n = 15). (H–J) qRT-PCR analysis of ACSL4 (H), POR (I), and GPX4 (J) in CA04-infected
  A549 cells 24 h after treatment with FPS-ZM1 or Fer-1 (n = 4). (K) Western blot
  analysis of ACSL4, POR, and GPX4 in CA04-infected A549 cells 24 h after treatment
  with FPS-ZM1 or Fer-1 (n = 3). Data are presented as mean ± standard deviation (SD).
  Statistical comparisons were performed between the vehicle-treated PR8-infected
  group and the FPS-ZM1-treated group in vivo, and between the CA04-infected group
  and treatment groups in vitro * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
