figure_title: The mechanisms of exosomes in cutaneous medical aesthetics.
caption: The mechanisms of exosomes in cutaneous medical aesthetics. (A) Exosomes
  from umbilical cord-derived MSCs, enriched in miR-21, miR-23a, miR-125b, and miR-145,
  targeted the TGF-β2/SMAD2 pathway to inhibit the differentiation of fibroblasts
  to myofibroblasts, resulting in reduced excessive fibrosis and scar formation. (B)
  Exosomes could improve keratinocytes and fibroblasts function, enhance collagen
  and elastin synthesis, and increase dermal fat, thus promoting the regenerative
  and restorative capacity for skin anti-aging. (C) After exposure to the UVB, the
  keratinocyte-derived exosomes modulated their miRNA content to increase melanocyte
  pigmentation via miR-3196 and MITF-dependent signaling pathways or miR-203 and MITF-independent
  signaling pathway. The miR-330–5p overexpressing in keratinocyte-derived exosomes
  decreased the melanin production and TYR expression in melanocytes. And the miR-675
  from keratinocyte exosomes involved in H19 lncRNA downregulation-stimulated melanogenesis,
  by inhibiting MITF expression. (D) The dermal papilla cells-derived exosomes promoted
  the viability of DPCs, ORSCs, and HFSCs, increased the expression of IGF-1, KGF,
  HGF, β-catenin, and Shh, and also accelerated the onset of HF anagen, postponed
  catagen, longer hair shafts in the skin of mice. Hair Follicle Stem Cells, HFSCs;
  Dermal Papilla Cells, DPCs; Hair Follicle, HF; Outer Root Sheath Cells, ORSCs; Transforming
  Growth Factor Beta, TGF-β; Keratinocyte Growth Factor, KGF; Insulin-Like Growth
  Factor, IGF; Hepatocyte Growth Factor, HGF; Sonic Hedgehog, Shh; Ultraviolet B,
  UVB; Melanocyte Inducing Transcription Factor, MITF; Tyrosinase, TYR [39]
