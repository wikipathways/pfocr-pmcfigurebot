figure_title: ER disruption relocates LCOR chromatin binding and increases LCOR location
  in APM loci
caption: |-
  (A) Venn diagram of overlapping peaks across conditions from MCF-7 ChIP-Seq: LCOR, LCOR+Fulv (1 μM, 24 hours), and LCOR_LSKAA. Bar plot depicts genomic features and gene-regulatory element distribution of ChIP-Seq samples in the indicated conditions. (B) Tornado plot of ChIP-Seq k-means clustering based on the z score from the 3 different conditions with 4 representative clusters (Cl). (C and D) Comparative analysis and scatter plot showing genome-wide changes of LCOR binding in LCOR-untreated versus LCOR+Fulv-treated (C) or LSKAA (D) MCF-7 cells. Red dots denote sites induced by fulvestrant, green dots denote sites lost by fulvestrant, blue dots denote sites induced by LSKAA, and gray dots denote sites unchanged by treatment. The R2 value is shown. Analysis of the REACTOME pathway of the gained and lost peaks ranked by –log10
  P value. (E) Genomic distribution of LCOR in the chromosome 6p locus (MHC-I/APM region). Signal was obtained from the average of the ChIP-Seq analysis of 2 independent biological replicates. (F) ChIP-Seq peak occupancy of LCOR in genes involved in the APM pathway. The occupancy and scale are indicated. Shadows denote comparative peak enrichment. Data show a biological replicate
