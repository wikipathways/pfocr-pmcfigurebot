figure_title: Neuronal cell death via intracellular signaling. The schematic presentation
  illustrates the Cd-induced molecular events in HT4 neuronal cells leading to apoptosis.
  Following the lipid peroxidation phase, PI3-K and NADPH oxidase-like flavoprotein
  are activated initially. This activation contributes to increased reactive oxygen
  species (ROS) production which in turn initiates a signalling cascade. Here, p38
  activation is depicted as a central event that mediates oxidative damage, ultimately
  leading to neuronal apoptosis. In this figure, phosphorylation steps are indicated
  by P and arrows represent activation steps. The entire cascade highlights the oxidative
  stress-related pathway implicated in neurodegenerative processes
