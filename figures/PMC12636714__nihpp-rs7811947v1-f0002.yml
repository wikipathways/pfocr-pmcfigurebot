figure_title: System-wide remodeling of cardiolipins in aging.
caption: 'System-wide remodeling of cardiolipins in aging. (a) Schematic of the inner
  mitochondrial membrane (IMM), highlighting cristae and the cardiolipin (CL) pathway
  of de novo synthesis and remodeling/diacylation-reacylation (adapted from Ref.18).
  Abbreviations: PA, phosphatidic acid; PG, phosphatidylglycerol; CDP-DAG, cytidine
  diphosphate diacylglycerol; CMP, cytidine monophosphate; Crls1, cardiolipin synthase
  1; CL, cardiolipin; TA, Tafazzin; PLA2, phospholipase A2; FFA, free fatty acids;
  MLCL AT-1, monolyso cardiolipin acyltransferase; MLCL, monolyso cardiolipin; DLCL,
  dilyso cardiolipin. (b) Total sum of nascent and mature CL levels in young and old
  mice (dots, individual animals; n=16 per group, sex-balanced). Heat maps show fold
  change (old/young) for nascent (left panel) and mature (right panel) CL pools with
  a shared diverging color scale (−2 to +2; blue, decrease; red, increase; white,
  not significant). (c) & (d) Species-resolved heat maps of log2-fold changes (FC)
  between old and young mice of CL (c) and DLCL (d) across organs. Shared color scale
  as in (b); ×, not detected. Two-sided Mann–Whitney U tests; significance threshold
  raw p <0.05'
