figure_title: Oncoplot demonstrating pathological mutations and copy number alterations
  in uterine carcinosarcoma. Genes are grouped by function, including DNA damage,
  cell cycle regulation, PI3K/AKT/mTOR pathway, DNA repair, and RAS/MAPK signaling.
  Furthermore, tumor mutational burden and recurrence status are depicted. Two categories
  of genomic alterations—somatic mutations (e.g., missense, nonsense, or frameshift
  variants) and copy number alterations (e.g., amplifications or deletions)—are concurrently
  displayed. In instances where both a somatic mutation and a copy number alteration
  are present in the same gene within a single sample, the alterations are superimposed
  within the same cell of the plot. The percentages indicate the proportion of cases
  with alterations among the 24 samples analyzed
