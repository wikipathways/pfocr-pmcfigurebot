figure_title: The inhibition of the sialylation pathway results in enhanced cell-matrix
  and cell-cell adhesion.
caption: 'The inhibition of the sialylation pathway results in enhanced cell-matrix
  and cell-cell adhesion. (A) U87MGs and GL15 were treated with 100 µM of 3-Fax for
  48 h or untreated (Ctr), then were fixed and stained by Crystal violet staining
  solution after trypsinization after 5 h-attachment to cell plate. The graph represents
  the mean ± SEM of the relative number of attached cells counted in three different
  experiments. Statistical significance: **** p < 0.0001 according to two-way analysis
  of variance (ANOVA) followed by Tukey post hoc. (B) Immunocytochemistry and confocal
  analysis for Vinculin (red) and FAK (green) was performed on U87MG and GL15 cells.
  DAPI was used to stain nuclei (blue). Arrowheads indicate Vinculin/FAK positive
  focal adhesion. Scale bar: 10 µm. The graph represents the mean ± SEM of the number
  of focal adhesion puncta (FAK/Vinculin double positive structures) counted per each
  field in three different experiments. Statistical significance: **** p < 0.0001
  according to two-way analysis of variance (ANOVA) followed by Tukey post hoc. (C)
  Western blotting analysis of FAK, phospho Tyr416-SRC (p-SRC) and SRC expression
  was performed in protein extracts from U87MG and GL15 cells cultured in 3-Fax presence
  for 48 h (48h) or untreated (0 h) (left panels). Western blotting of phopsho Thr184/Tyr185
  SAPK/JNK (p-SAPK/JNK) and total SAPK/JNK was performed in cells cultured in 3-Fax
  presence for 48 h (48h) or untreated (0 h) (right panels). Vinculin was used as
  loading control. Representative images of three different experiments are shown
  and the corresponding densitometric analyses are shown. Statistical significance:
  * p < 0.05, ** p < 0.01, Multiple Unpaired t-test'
