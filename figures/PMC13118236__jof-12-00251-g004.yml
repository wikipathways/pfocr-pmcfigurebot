caption: Assembly, integration, and functional validation of the seven-gene α-bisabolol
  biosynthetic pathway. (A) Schematic of the integrated seven-gene pathway at the
  YORWΔ17 locus. (B) Agarose gel electrophoresis of PCR verification for pathway assembly
  and integration. F6 to F11 indicate four PCRs designed to confirm correct assembly
  and integration. (C) α-Bisabolol production by engineered strain bis03-ERG20-OsTPS1-tHMG1-ERG20-OsTPS1-tHMG1.
  Data represent mean ± SD of triplicate cultivations in 150-mL Erlenmeyer flasks.
  (D) Growth profile (OD600) of strain bis03-ERG20-OsTPS1-tHMG1-ERG20-OsTPS1-tHMG1
  under conditions in (C)
