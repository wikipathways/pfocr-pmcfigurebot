figure_title: Schematic of inflammation and ROS in pain mechanisms in peripheral nerves,
  spinal cord, Tand brain.
caption: 'Schematic of inflammation and ROS in pain mechanisms in peripheral nerves,
  spinal cord, Tand brain. Damaged axons and myelin in peripheral nerves undergo Wallerian
  degeneration. Schwann cells transition into repair phenotypes. Inflammatory cells
  (mast cells, neutrophils, macrophages, and T cells) are recruited and release cytokines
  like IL-1β, tumor-necrosis factor (TNF), IL-6, and chemokines like chemokine ligand
  2 (CCL2) near the injury site. This leads to elevated ROS production in damaged
  DRG neurons and hypersensitivity and pain signals ascending toward the spinal cord
  by affecting ion channels (Nav1.7, Nav1.8, Nav1.9, TRPV1, and TRPA1). DRG neurons
  release colony-stimulating factor 1 (CSF-1), CCL-2, and fractalkine (CX3CL1), which
  activate microglia and astrocytes. The inflammatory mediators produced promote the
  presynaptic release of glutamate and inhibit GABAergic signals of GABA and Glycine.
  Enhanced excitatory signals within the SDH are then transmitted to IC, PFC, S1,
  S2, ACC, and CTX through the Thalamus, which leads to an impaired periaqueductal
  Gray (PAG)-rostroventromedial medulla (RVM)-superficial dorsal horn (SDH) descending
  pain inhibition pathway. CTX: cerebral cortex; IC: insular cortex; PFC: prefrontal
  cortex; ACC: anterior cingulate cortex; S1/S2: primary/secondary somatosensory cortex;
  PAG: periaqueductal gray; RVM: rostral ventromedial medulla; SDH: superficial dorsal
  horn; DRG: dorsal root ganglion; ROS: reactive oxygen species; TNF: tumor-necrosis
  factor; IL-1β: interleukin-1 beta; GABA: γ-aminobutyric acid; TRPV1: transient receptor-potential
  vanilloid 1; TRPA1: transient receptor-potential ankyrin 1; Nav1.7: voltage-gated
  sodium channel 1.7; Nav1.8: voltage-gated sodium channel 1.8; Nav1.9: voltage-gated
  sodium channel 1.9'
