figure_title: Cell proportion and transcriptomic analysis of MDSCs in septic vs naïve
  mice
caption: (A) There was a significant expansion of MDSCs in all septic mice compared
  to naïve. Additionally, there was a greater expansion of MDSCs in the septic older
  mice compared to young but no significant difference between the sexes. (B/C) A
  differential expression analysis (DE) was performed between all the septic mice
  and all the naïve mice. Panel B shows the upregulated DEG overlap between the MDSC
  subtypes and panel C the downregulated gene overlap in sepsis compared to naïve.
  (D) Pathway analysis was performed using IPA. There was mostly upregulation (orange)
  of the canonical pathways in sepsis compared to naïve. IPA analysis of the PMN-MDSCs
  for this comparison is shown to represent all the MDSCs. There was upregulation
  of pathways related to translation and ribosome function, immune regulation like
  neutrophil degranulation and class I MHC antigen presentation, as well as those
  related to mitochondria function like oxidative phosphorylation and electron transport.
  The most significant downregulated pathways included those related to mitochondrial
  reactive oxygen mediated stress and mitochondrial death (granzyme A). Dendritic
  cell (DC), common myeloid progenitor (CMP)
