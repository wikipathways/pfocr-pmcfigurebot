figure_title: Biological roles of estrogen receptors.
caption: Biological roles of estrogen receptors. Estrogen exerts different biological
  effects in prostate cancer, bladder cancer, and renal cancer through ERα, ERβ, and
  GPER, respectively. In prostate cancer, E2 activates the PI3K/AKT and MAPK/ERK pathways
  through ERα, which can promote cell proliferation and migration. It can also enhance
  inflammation and microenvironmental remodeling by upregulating the expression of
  IL-6 and TNF-α. ERβ, on the other hand, can inhibit the PI3K/AKT pathway through
  PTEN, reducing drug resistance, and activate FOXO3a to upregulate apoptosis-regulating
  genes, inducing cell apoptosis. In bladder cancer, ERβ activates the NF-κB signal
  to promote cell proliferation and can also recruit mast cells and T cells to affect
  tumor progression. GPER rapidly activates non-genomic signaling pathways, inhibiting
  Cyclin D1 and c-Fos, reducing proliferation and invasion. In renal cell carcinoma,
  E2 activates lncRNA HOTAIR and VEGF through ERβ, upregulating angiogenesis-related
  pathways, and can also regulate tumor stem cell phenotype (CSC) through related
  RNA, enhancing migration and self-renewal capabilities
