caption: 'Spatial RNA-Seq data from resected glioblastoma tumor was collected across
  multiple cohorts, annotated for anatomical niches using Ivy GAP markers, and then
  deconvolved to obtain cell type proportions and tumor specific expression. Diverse
  analysis were applied to this data including: differential expression analysis at
  the gene and pathway level; transcription factor network analysis; ligand-receptor
  analysis, incorporating additional single cell RNA-Seq data to enhance performance;
  and finally gene coexpression network analysis. This integrative analysis produced
  niche specific biological insights including distinct ligand receptor interaction
  driven pathway activity'
article_title: Spatial transcriptomics of glioblastoma defines biologically and clinically
  significant reprogramming patterns across unique spatial microenvironments
