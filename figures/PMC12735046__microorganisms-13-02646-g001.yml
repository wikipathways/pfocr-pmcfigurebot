caption: The process of constructing the engineered bacteria and the working principle
  of nitrogen removal. By constructing plasmids to introduce gdhA, glnA and guaA into
  Escherichia coli BL21, an engineering strain was constructed. The GDH pathway and
  GS/GOGAT pathway were used to efficiently remove nitrogen under different ammonia
  concentrations, and the indirect denitrification effect was achieved through the
  GMP synthetase encoded by guaA that consumes glutamine
