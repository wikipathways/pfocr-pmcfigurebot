figure_title: Myxoma virus treatments to OC CD14+ TAMs promote CD4+ T cell activation
  against tumor antigen.
caption: Myxoma virus treatments to OC CD14+ TAMs promote CD4+ T cell activation against
  tumor antigen. A co-culture system with TADG14v peptide tumor antigen-specific CD4+
  T cells and OC ascites CD14+ TAMs was used for this study. (A). MYXV treatments
  of CD14+ TAMs reversed the immunosuppressive effect by TAMs. After incubating without
  any TAMs (mock), with untreated TAMs, with WT MYXV treated TAMs, or with ΔM062R
  treated TAMs, TNFa expression by allogeneic (top row) or autologous (bottom row)
  CD4+ T cells was determined following overnight stimulation with tumor peptide antigen-loaded
  autologous lymphoblastoid cells. A representative result from 3 individual patient
  TAM samples is shown. (B). Reversal of TAM immunosuppression by ΔM062R is independent
  of the cGAS/STING/TBK1/IRF3 signaling axis. CD4+ T cell functionality was measured
  as described above in (A). A STING antagonist, H-151 (1 μM), and a TBK1 kinase inhibitor,
  BX-795 (2 μM), were used to inhibit different steps of the DNA sensing pathway in
  cultures of T cells alone (first row), T cells plus CD14+ TAMs (second row), or
  T cells plus ΔM062R MYXV-treated TAMs (third row)
