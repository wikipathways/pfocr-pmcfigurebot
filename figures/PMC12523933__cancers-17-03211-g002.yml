caption: Clinical Pathway for Diagnosis, Treatment, and Surveillance of Epidermolysis
  Bullosa (EB)-Associated Cutaneous Squamous Cell Carcinoma (cSCC). Currently, the
  most effective diagnostic strategies include dermoscopy, biopsy, and fluorescence-based
  techniques to visualize the lesion. Once a malignant lesion has been identified,
  treatments include surgical excision, immunotherapy, and anti-EGFR therapy. Surveillance
  before a diagnosis of a malignant lesion may vary by subtype but generally involves
  skin checks from a young age every 3–12 months, and every 3 months after a diagnosis.
