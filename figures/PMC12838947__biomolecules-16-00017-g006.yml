caption: 'Identification and function analysis of DEGs: (A) Upregulated and downregulated
  DEGs in seeds between different development stages. (B) KEGG enrichment of the top
  25 pathways based on DEGs. Rich Factor represents the value of enrichment factor,
  which is the quotient of foreground value (the number of DEGs), and the larger the
  value, the more significant the enrichment. Coloring indicates p-value with higher
  in red and lower in blue, and the lower the p-value, the more significant the enrichment.
  (C) Network of representative KEGG pathways. Coloring indicates p-value with higher
  in green and lower in red, and the lower the p-value, the more significant the enrichment.
  Point size indicates the number of DEGs'
