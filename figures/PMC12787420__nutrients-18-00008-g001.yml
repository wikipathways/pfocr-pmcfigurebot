figure_title: Workflow of the network pharmacology analysis of Mecasin in Alzheimer’s
  disease (AD).
caption: Workflow of the network pharmacology analysis of Mecasin in Alzheimer’s disease
  (AD). Bioactive compounds from the nine constituent herbs were retrieved from the
  OASIS and PubChem databases and mapped to predicted molecular targets. Mecasin-associated
  targets were then integrated with AD-related genes obtained from GeneCards to identify
  shared gene signatures. These overlapping genes were analyzed through STRING-based
  PPI network construction, followed by GO and KEGG enrichment analyses in Cytoscape
  and Enrichr to determine key functional nodes and pathways. Subsequent co-expression,
  co-regulation, and molecular docking assessments were conducted to examine the binding
  compatibility between core targets (TNF, AKT1) and Mecasin-derived compounds (curcumin,
  salvianolic acid B, Tanshinone IIA), outlining potential interactions relevant to
  AD-associated molecular mechanisms
article_title: Network Pharmacology-Based Characterization of Mecasin (KCHO-1) as
  a Multi-Target Modulator of Neuroinflammatory Pathways in Alzheimer’s Disease
