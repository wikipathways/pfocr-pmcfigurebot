figure_title: The roles of peripheral myeloid cells in Alzheimer disease (AD)
caption: a, Monocytes and/or macrophages and Aβ. Peripheral monocytes and/or macrophages
  can sense and engulf amyoid-β (Aβ). The endogenous cysteine protease inhibitor CST7108
  and the receptor CD36107 have been linked with inhibiting Aβ phagocytosis, while
  formyl peptide receptor-like-1 (FPRL1) and formyl peptide receptor 2 (FPR2)104,105,
  toll-like receptor 2 (TLR2)96 have been linked with promoting Aβ phagocytosis in
  monocytes and/or macrophages. Several key AD GWAS genes, including those encoding
  CD33245, triggering receptor expressed on myeloid cells 2 (TREM2)101, TREM1102 and
  leukocyte immunoglobulin-like receptor subfamily B member 2 (LILRB2)100, modulate
  this phagocytic ability. AD gene risk mutations in TREM1102, TREM2 101 and the AD
  risk allele APOE4 have been reported to inhibit phagocytosis99. It has been reported
  that peripheral monocytes show accelerated chemotraction to Aβ compared to microglia86
  and that CCR2+ monocytes are the primary immune cells from the periphery recognising
  amyloid-β compared to neutrophils or lymphocytes89. However, with aging and AD progression
  monocytes undergo apoptosis more quickly at the brain border 95–98. In human APOE
  4 carriers, monocyte and/or macrophage phagocytic capacity is reduced compared to
  APOE3 carriers99. b, Recruitment and roles of brain border-associated macrophages
  (BAMs) in AD. In AD models, C-C chemokine receptor type 2 (CCR2) is crucial for
  the recruitment of monocytes and macrophages to the brain and loss of this protein
  worsens pathology126. Parenchymal border macrophages (a type of BAM found in the
  meninges and/or vasculature) regulate CSF flow98; their loss causes debris buildup,
  high interferon-γ (IFN-γ) in the cerebrospinal fluid (CSF), and faster AD pathology
  progression. Expression of APOE4 in BAMs leads to reactive oxygen species (ROS)-mediated
  vascular damage and cognitive decline127 and replacing APOE4 BAMs with APOE3 BAMs
  is protective 127. c, Neutrophils and AD. Neutrophils infiltrate the brain via integrin
  alpha-L (LFA-1; blockade of LFA-1 is beneficial)129. Neutrophils adhering to blood
  vessels reduce blood flow; removing them improves perfusion134. Female APOE4 carriers
  with AD have neutrophils secreting high levels of interleukin 17F (IL-17F), which
  impairs cognition50. Neutrophil IL-17F signals to microglia (via IL-17RA), inducing
  a damaging loop that involves interleukin 1α (IL-1α), interleukin-18 (IL-18) and
  tumour necrosis factor (TNF); blocking this pathway or removing APOE4 from neutrophils
  restores microglial function50. APOE4 neutrophils also produce more NETs including
  MPO50. Chronic neutrophil activation leads to an immunosuppressive phenotype (indicated
  by checkpoint signalling and degranulation gene upregulation) as seen in AD (exhaustion),
  and accumulation of toxic monocyte signatures correlates with cognitive decline
  in AD133
