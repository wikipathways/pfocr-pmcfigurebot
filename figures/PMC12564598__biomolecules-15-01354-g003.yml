figure_title: Scr1 and Rst2 regulate shared metabolic genes in response to CAP treatment.
caption: Scr1 and Rst2 regulate shared metabolic genes in response to CAP treatment.
  (a) Venn diagram to show the overlap between published Scr1 and Rst2 target genes
  [25]. Statistical significance of overlaps was calculated using Fisher’s exact test
  with the GeneOverlap R package (version 1.40.0) [39], with the resulting p-values
  of the overlaps indicated. The background gene set used for the analysis corresponds
  to all genes detected in the RNA-seq dataset in this study. (b–d) Overlap analysis
  of CAP-induced genes (b), carbon metabolism genes in Figure 2 (c), and CAP-repressed
  genes (d) with Scr1 and Rst2 target genes, with the resulting p-values of the overlaps
  indicated. Statistical significance of overlaps was calculated using Fisher’s exact
  test with the GeneOverlap R package (version 1.40.0) [39], with the resulting p-values
  of the overlaps indicated. The background gene set used for the analysis encompasses
  all genes detected in the RNA-seq dataset in this study. (e) Transcriptional response
  of Scr1 and Rst2 target genes to CAP treatment. Box plots show log2 fold changes
  in gene expression of Scr1 and Rst2 targets in CAP-treated versus untreated cells
  during exponential and stationary phases, as indicated. Substantial changes in gene
  expression (mainly induction) of Scr1 and Rst2 targets were observed predominantly
  during the stationary phase. Red horizontal lines mark log2 fold change = 0 (no
  change), while dashed lines mark log2 fold-change thresholds of ±1. The p-values
  were calculated using the Wilcoxon signed-rank test [54]. (f) Overlap analysis of
  Scr1 and Rst2 targets that were induced (top) or repressed (bottom) based on the
  RNA-seq data shown in (e), with the p-values of the overlap indicated. (g) KEGG
  pathway enrichment analysis of Scr1 and Rst2 target genes that are induced in our
  data. The most enriched pathways are related to carbon metabolism. Dot size represents
  gene count per pathway, and dot color indicates FDR values, as shown on the right.
  The analysis was performed using DAVID [36,37] with default parameters and visualized
  by R (version 4.4.1, R Foundation for Statistical Computing, Vienna) [38]
