figure_title: TRPV2 promotes STING activation through its channel activity in the
  canonical cGAS/cGAMP-dependent innate immune pathway
caption: (A–C) Effects of siRNA-mediated knockdown of TRPV2 on STING/TBK1/AMPKα phosphorylation
  induced by DNA transfection (2 μg/mL, 7 h) (A), MnCl2 treatment (2.5 mM, 4 h) (B),
  or cGAMP transfection (5 μg/mL, 7 h) (C) in HeLa cells.(D–F) Effects of expression
  of an mCherry-tagged TRPV2 dominant negative mutant (TRPV2(DN)) or mCherry alone
  on STING/TBK1/AMPKα phosphorylation induced by DNA transfection (2 μg/mL, 7 h) (D),
  MnCl2 treatment (2.5 mM, 4 h) (E), or cGAMP transfection (5 μg/mL, 7 h) (F) in HeLa
  cells.(G) Effects of TRPV2(DN) expression on the mRNA levels of IFN-β, IL6, IL-1β,
  and CCL2 measured by RT-qPCR after cGAMP transfection (5 μg/mL, 7 h). n = 3, ****,
  p < 0.0001 (unpaired t test).(H) Effects of siRNA-mediated knockdown of TRAF6 on
  STING/TBK1/Chk1 phosphorylation induced by 6 h etoposide treatment (10 μM) or by
  DNA transfection (2 μg/mL, 7 h) in HeLa cells.(I) Effects of TRPV2(DN) expression
  on the phosphorylation of STING, TBK1, and Chk1 induced by 6 h etoposide treatment
  (10 μM) or by DNA transfection (2 μg/mL, 7 h) in HeLa cells.(J) A diagram showing
  the requirement of TRPV2 for STING activation in the cGAS/cGAMP-dependent, but not
  TRAF6-dependent, innate immune pathway
article_title: 'Dual roles of TRPV2 in the innate immune response to cytosolic DNA:
  Arresting dormant and boosting activated STING'
