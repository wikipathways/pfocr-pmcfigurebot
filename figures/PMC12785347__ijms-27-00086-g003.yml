figure_title: Context-dependent modulation of stem cell differentiation, fibrosis
  and Neuronal Differentiation by SERPINE1/PAI-1.
caption: 'Context-dependent modulation of stem cell differentiation, fibrosis and
  Neuronal Differentiation by SERPINE1/PAI-1. This schematic summarizes the pleiotropic
  roles of PAI-1 across three distinct biological processes. (Top Panel) MSC Tri-lineage
  Differentiation: PAI-1 regulates the fate of MSCs. Knockdown or inhibition generally
  favors chondrogenesis and adipogenesis, whereas PAI-1 overexpression is linked to
  cellular senescence and SASP. Its role in osteogenesis is complex and context-dependent.
  (Middle Panel) Fibrosis: PAI-1 acts as a profibrotic driver in the liver, lung,
  kidney, and skin, promoting ECM accumulation via MMP inhibition and ERK/JNK signaling.
  Paradoxically, in the heart, PAI-1 deficiency exacerbates spontaneous cardiac fibrosis.
  (Bottom Panel) Neuronal Differentiation: PAI-1 exerts a dual effect on neurons.
  It can inhibit neurite outgrowth and migration by suppressing tPA activity but also
  promotes neuronal survival and gliogenesis via TGF-β1/Smad3 and anti-apoptotic (Bcl-2)
  pathways in specific contexts such as Fragile X syndrome. Abbreviations: Bcl-2,
  B-cell lymphoma 2; Bcl-XL, B-cell lymphoma-extra large; BMP, bone morphogenetic
  protein; COX-2, cyclooxygenase-2; CXCR5, C-X-C motif chemokine receptor 5; ECM,
  extracellular matrix; ERK, extracellular signal-regulated kinase; HGF, hepatocyte
  growth factor; IL, interleukin; JNK, c-Jun N-terminal kinase; MMP, matrix metalloproteinase;
  NF-κB, nuclear factor kappa-light-chain-enhancer of activated B cells; PA, plasminogen
  activator; PGE2, prostaglandin E2; RUNX2, Runt-related transcription factor 2; SASP,
  senescence-associated secretory phenotype; SM22α, smooth muscle protein 22-alpha;
  TGF-β, transforming growth factor-beta; tPA, tissue-type plasminogen activator;
  TrkA, tropomyosin receptor kinase A; uPA, urokinase-type plasminogen activator;
  VEGF, vascular endothelial growth factor'
