figure_title: Anatomy of brain-body communication
caption: 'The brain commands the body via three primary routes. Left: the hypothalamic-pituitary-peripheral
  gland axis is a neuroendocrine system that allows the brain to directly influence,
  and be influenced by, peripheral targets. The hypothalamus, a part of the central
  nervous system, produces and releases hormones (e.g., CRH and TRH) into the pituitary
  portal circulation, which stimulate the release of hormones (e.g., ACTH and TSH)
  from the anterior pituitary gland. Anterior pituitary hormones are released into
  the systemic circulation and travel through the body’s circulation to impact distant
  organs (e.g., adrenal and thyroid). The hormones (e.g., cortisol and thyroid hormones)
  released by the peripheral glands can influence the hypothalamus and pituitary,
  creating a feedback loop that maintains appropriate hormone balances via bi-directional
  communication between the brain and the body. Arrows represent stimulation, and
  lines terminating in a vertical bar represent feedback inhibition. Right: the brain
  also directly influences bodily functions via the efferent somatic and autonomic
  motor pathways. The somatic motor pathway relays command signals from the brain
  to skeletal muscle. Here, spinal projecting neurons relay information from the brain,
  either via mono-synaptic or poly-synaptic connections, to somatic motor neurons
  throughout the spinal cord. The somatic motor neurons then relay cholinergic commands
  to peripheral skeletal muscle targets. The autonomic nervous system is broadly divided
  into two main pathways: the sympathetic and parasympathetic systems, which govern
  ‘‘fight or flight’’ or ‘‘rest and digest’’ bodily functions, respectively. The sympathetic
  nervous system is controlled by descending commands from spinal projecting neurons,
  which innervate SPGNs in the thoracolumbar spinal cord. These SPGNs send short cholinergic
  axons to synapse onto the sympathetic ganglia close to the central nervous system.
  The post-ganglionic neurons send long noradrenergic axons to peripheral targets.
  Some SPGNs directly innervate the adrenal medulla. The parasympathetic nervous system
  is controlled by descending signals that innervate PSPGNs in the brainstem or the
  sacral spinal cord. Both the brainstem and sacral PSPGNs send cholinergic axons
  to synapse with post-ganglionic neurons located in the ganglia close to their target
  organs, which in turn release ACh to modulate the function of the target organs.
  PSPGNs residing in the brainstem command peripheral targets via the motor component
  of the vagus nerve. CRH, corticotrophin releasing hormone; TRH, thyroid releasing
  hormone; ACTH adrenocorticotrophic hormone; TSH, thyroid-stimulating hormone; ACh,
  acetylcholine; Epi, epinephrine; Norepi, norepinephrine; SPGN, sympathetic preganglionic
  neuron; PSPGN, parasympathetic preganglionic neuron'
article_title: 'From thought to action: The organization of spinal projecting neurons'
