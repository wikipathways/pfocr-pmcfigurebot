figure_title: Actmyosin-mediated thermogenic gene expression regulation is independent
  of classical PKA mediated pathway
caption: (a) AFM measurements of cellular stiffness for sWAT beige adipocytes treated
  without or with 50 mM Blebbistatin for 2 hours. (b) UCP1 mRNA expression measured
  by qPCR in sWAT beige adipocytes treated without (vehicle) and 1 mM isoproterenol
  overnight (n=3 per group). (n=6 per group). (c) UCP1 protein expression assessed
  by western blot in sWAT beige adipocytes treated as in b (n=3 per group). (d) Cellular
  respiration of sWAT beige adipocytes treated under the same conditions as in b and
  c (n=5 per group). (e) PKA activity in sWAT beige adipocytes treated without or
  with 50 mM Blebbistatin and without (0 min) or with 1, 2, 5, 10, 15, 20, and 25
  minutes of 1 mM isoproterenol treatment (n=3 per group). (f) Lipolysis of sWAT beige
  adipocytes treated with 50 mM Blebbistatin and without or with 1, 2, 3, and 4 hours
  of 1 mM isoproterenol treatment as measured via free glycerol (n = 3 per group).
  (g) phospho and total HSL and CREB western blot of sWAT beige adipocytes treated
  as in e. (h) quantification of phospho to total CREB ratio of sWAT beige adipocytes
  as treated in g and e. Error bars represent mean ± SD. *p < 0.05, **p < 0.01. ***p
  < 0.001, **** p < 0.0001
article_title: Bioenergetic responses to β-adrenergic stimulation in beige adipocyte
  depend on actomyosin driven forces
