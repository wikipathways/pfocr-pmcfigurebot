caption: Circuit diagrams illustrating the three most relevant pathways influenced
  by miR-128–3p. These include dopaminergic synapse, cortisol synthesis, and axon
  guidance. These pathways are central to neuropsychiatric disorders, such as mood
  regulation and neurodegeneration. Each diagram shows the genes targeted by miR-128–3p
  in red, underscoring its potential role in modulating signaling pathways critical
  for neuronal function and dysfunction in the brain
