figure_title: Schematic of transdermal drug delivery using hollow microneedles in
  SD rats and integrated evaluation strategy for RA treatment.
caption: Schematic of transdermal drug delivery using hollow microneedles in SD rats
  and integrated evaluation strategy for RA treatment. (a,b) Hollow microneedles were
  used for localized transdermal delivery into the ankle joints of SD rats with collagen-induced
  arthritis, enabling minimally invasive penetration from the epidermis to the dermis.
  (c) RA pathology involves complex immune cell infiltration (T cells, B cells, macrophages,
  dendritic cells, osteoclasts) and inflammatory mediator release (e.g., IL-1, IL-6,
  TNF-α, IFN-γ, IL-17, ROS), resulting in synovial inflammation, cartilage erosion,
  and bone remodeling. (d) Tofacitinib targets the JAK-STAT pathway, inhibiting JAK1
  and JAK3 to reduce proinflammatory cytokine signaling and immune cell activation.
  (e) Delivery of Tofacitinib and antioxidant NAC via hollow microneedles was designed
  to simultaneously suppress inflammation and oxidative stress. Multimodal assessments—including
  histology (H&E, Safranin O/Fast Green), micro-CT imaging, ELISA quantification of
  inflammatory markers, and RNA sequencing—were performed to evaluate therapeutic
  outcomes across structural, biochemical, and transcriptomic levels. (f) Microneedle
  drug administration was conducted daily from Day 8 to Day 28 post-induction
