figure_title: Further explorations of the multi-layer transcriptomic data to identify
  the mechanism(s) of interest underlying allodynic susceptibility of PAE mice following
  morphine treatment
caption: 'A: Venn diagram showing the distribution of shared differentially expressed
  mRNA, circRNA host genes, and lncRNAs contrasting the key groups of this study,
  which are allodynic PAE + minor CCI + morphine in comparison to the two non-allodynic
  control groups − Control + minor CCI + morphine and PAE + minor CCI + vehicle groups.
  This is based on the FDR-corrected p-values <0.05 for significance, and for all
  datasets, duplicate gene names were removed for the comparison. B. Bar chart showing
  a visual representation of the 4 DE mRNAs common between the allodynic PAE + minor
  CCI + morphine vs. both of the non-allodynic groups (Control + minor CCI + morphine
  and PAE + minor CCI + vehicle). C. KEGG/GO pathway analysis results of the cis genes
  of the dysregulated lncRNA, MSTRG.37633.127, which was upregulated both in PAE vs.
  non-PAE morphine treated samples (log2FC = 0.26) and morphine vs. vehicle-treated
  PAE mice (log2FC = 0.38). D. A total of 54 circRNAs were common in both datasets,
  while considering only significant DE circRNAs. A scatter plot of 16 common DE circRNAs
  in the nerve-injured PAE + morphine vs. the corresponding non-allodynic groups (Control
  + minor CCI + morphine and PAE + minor CCI + vehicle groups) to visualize the circRNAs
  with the same or opposite direction of regulation, with a log2FC of 0.25. E. Using
  CircNetVis to assess circRNA-miRNA-mRNA interactions that may occur between the
  common circRNAs in both datasets. Maroon boxes are circRNAs, light blue ovals are
  miRNAs, and pink ovals are mRNAs'
article_title: Prenatal alcohol exposure induces circular and linear long non-coding
  RNAs, and protein-coding genes linked to proinflammatory neuroimmune function, promoting
  nerve injury-induced allodynia following morphine treatment
