figure_title: Bulk RNA-seq of MARCH10 expressing BEAS-2B infected with influenza virus
  strain PR8
caption: A) mRNA expression of MARCH10 in BEAS-2B cells following overexpression of
  MARCH10 and nLuc control expression. Results are expressed as mean ± SD of n-fold
  MARCH10 mRNA expression vs. nLuc. Replicates of n=4 samples. ****P<0.0001. B) Ingenuity
  pathway analysis of bulk RNA-seq data in BEAS-2B transfected with MARCH10 vs control
  plasmids and infected with the influenza virus strain PR8 (fold change > |1.5|,
  adjusted P value <0.05 (n=4 per group). RNA lysates were collected 24h post infection.
  The diagram lists the 30 most regulated function terms and shows the number of DEGs
  in the RNA-seq data set within each category. DEG terms were labeled according to
  their relevance for development (red), cell movement and molecular transport (orange),
  biosynthesis and metabolism (green), cell cycle and DNA repair (blue), and other
  (gray). C) Ingenuity pathway analysis of the most regulated signaling pathways with
  adjusted P<0.05 and absolute z score cut-off > |2.5| for MARCH10 expression vs.
  nLuc control in infected BEAS-2B. D) Clustered heatmap shows upregulation of genes
  involving interferon signaling promoted by MARCH10 overexpression during infection
  with influenza virus PR8. Heatmap data is normalized log2-fold expression
