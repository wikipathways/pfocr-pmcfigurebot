figure_title: HY regulates the senescence of HaCaT cells by inhibiting the miR-361-5P/PI3K/Akt/mTOR
  signaling pathway.
caption: 'HY regulates the senescence of HaCaT cells by inhibiting the miR-361-5P/PI3K/Akt/mTOR
  signaling pathway. (A) Predicting the target gene of miR-130b-3p using bioinformatics
  tools. (B) RT-qPCR was used to detect the expression of has-miR-501-5p, has-miR-361-5p,
  has-miR-532-5p, and has-miR-139-5p. (C) Expression of miR-361-5p in THP-1 cells
  transfected with miR-361-5p mimics. (D–F) Western blot detected PI3K and Akt, along
  with their respective phosphorylation, in HaCaT cells and quantified them. (G–N)
  RT-qPCR detected TOM20, Beclin1, p62, Parkin, PINK1, p21, p16 and LC3 in HaCaT cells
  and quantified them. (O,P) Co-incubation staining with Beclin1 and TOM20 was observed
  by confocal microscopy (Scale bars: 100 μm). The cells were immunostained with TOM20
  (red), Beclin1 (green) and Nuclei were stained with DAPI (blue). (Q) Immunofluorescence
  detection of p21 expression (Scale bars: 50 μm). The cells were immunostained with
  p21 (red) and Nuclei were stained with DAPI (blue). (R) Representative image of
  SA-β-gal staining (Scale bars: 100 μm). Data are presented as the mean ± SD (n =
  3). * p < 0.05, ** p < 0.01, *** p < 0.001 and **** p < 0.0001. Ctrl (control group),
  UVB (the irradiated group)'
