figure_title: Classification and shared pathophysiological steps in kidney stone formation.
caption: Classification and shared pathophysiological steps in kidney stone formation.
  The diversity of KS types and the common biological pathway that underlies their
  formation. On the left, representative morphologies of the five major stone types
  (struvite, cystine, calcium oxalate, calcium phosphate, and uric acid) are shown
  to emphasize their compositional heterogeneity. On the right, a unified sequence
  of physicochemical and cellular events is presented, beginning with urine supersaturation
  and culminating in stone formation. This schematic highlights that, despite differences
  in stone composition, the mechanistic steps of crystal initiation, growth, aggregation,
  and epithelial interaction are shared across stone types. Understanding this convergence
  may be key to developing broad-spectrum preventive strategies [3,5,8,18,19,20,21,22,23]
