figure_title: A schematic representing the signaling pathways involved in ferroptotic
  induction and inhibition.
caption: A schematic representing the signaling pathways involved in ferroptotic induction
  and inhibition. System Xc− is a cystine/glutamate antiporter that allows for the
  uptake of cystine, a key precursor for glutathione (GSH) synthesis. Glutathione
  is an important cofactor that is used by glutathione peroxidase 4 (GPX4), which
  is a key antioxidant defense against lipid peroxidation. GPX4 can, in turn, be inhibited
  by RSL3. The KEAP–NRF2 pathway protects against lipid peroxidation and oxidative
  stress through the eventual transcription of antioxidant genes such as GPX4. However,
  ARF can inhibit NRF2, preventing transcription of antioxidant genes. Transferrin
  receptors can bind to iron-bound transferrin, allowing for the uptake of iron in
  the ferric state (Fe3+). Ferric iron is then converted to ferrous iron (Fe2+) via
  STEAP3, which contributes to the formation of a labile iron pool. Ferritin proteins
  can bind iron, but when degraded by proteins such as NCOA4, they can also release
  iron, contributing to the labile pool. The labile pool of iron can undergo the Fenton
  reaction, leading to the formation of reactive oxygen species (ROS) and peroxidation
  of lipids, which triggers ferroptosis. Ferroportin is a transmembrane protein that
  can transport iron out of the cell to reduce the labile pool and iron overload of
  the cell. Iron chelators can also sequester iron for a similar effect. Ferrostatin-1
  and liproxstatin-1 scavenge lipid peroxides, inhibiting ferroptosis. ACSL4 activates
  polyunsaturated fatty acids (PUFAs) to PUFA-CoA that are needed for the synthesis
  of membrane phospholipids. These phospholipids can oxidize the membrane phospholipids,
  further contributing to the creation of ROS and lipid peroxides. [Figure created
  on BioRender.com]
