figure_title: Molecular network analysis of the ERK/MAPK pathway and associated canonical
  pathways.
caption: 'Molecular network analysis of the ERK/MAPK pathway and associated canonical
  pathways. Integrated molecular network of ERK/MAPK signaling, autophagy, and apoptotic
  execution pathways in non-treated (A) NT (SC3KO vs. WT) and MK-8353 treated groups
  (B) (MK: SC3KO vs. WT). Molecular network analysis was performed using Ingenuity
  Pathway Analysis (IPA®). Node color indicates relative expression (red: upregulated;
  green: downregulated), and edges represent curated molecular relationships from
  the IPA knowledgebase. Legend indicates the function of each protein and the interactions
  between them. Significant proteins are determined by Log2FC ≤ 1.5 and p ≤ 0.05.
  (C) Protein–protein interaction network of SCAMP3-regulated phosphoproteins within
  the ERK1/2 cascade (yellow) and autophagy (red) (NT: SC3KO vs. WT). The network
  was generated using the STRING 2024 database with a confidence cutoff of 0.400.
  Interactions with scores < 0.400 are included and labeled with their numerical confidence
  values. Predicted interactions with SCAMP3, EGFR, MAP1LC3B, and mTOR are also highlighted.
  Gene names displayed in the network correspond to the following proteins: ACIN1,
  apoptotic chromatin condensation inducer in the nucleus; ELF4, E74 like ETS transcription
  factor 4; LMNB1, Lamin-B1; MAP1LC3B, microtubule-associated protein 1 light chain
  3 beta; MAP2K2, dual specificity mitogen-activated protein kinase kinase 2; MAPK1,
  mitogen-activated protein kinase 1; MAPK3, MAP kinase-activated protein kinase 3;
  mTOR, mammalian target of rapamycin; OPTN, optineurin; PAK4, serine/threonine-protein
  kinase PAK 4; PI4K2A, phosphatidylinositol 4-kinase type 2-alpha; PLEC, Plectin;
  PPP1R10, serine/threonine-protein phosphatase 1 regulatory subunit 10; PRKCD, Protein
  kinase C delta type; RAF1, RAF proto-oncogene serine/threonine-protein kinase: SQSTM1,
  Sequestosome-1; TBC1D5, TBC1 domain family member 5; TJP1, tight junction protein
  ZO-1, and TJP2, tight junction protein ZO-2. In IPA networks, an asterisk (*) next
  to a protein name means the node is representative for a group of molecules/isoforms/aliases,
  not just a single, unique protein'
