figure_title: Cell-cell communication among epithelial cells and the tumor stroma.
caption: Cell-cell communication among epithelial cells and the tumor stroma. (A-B)
  IF staining showing CD31 (red), a-SMA (green) and DAPI (blue) in treatment-naïve
  (A) and post-treatment (B) samples. (C) UMAP plot showing the 5 subtypes of ECs
  from 9 HRLPC patients, colored by subtypes. (D) The expression level of selected
  genes. Cells with the highest expression level are colored red. (E) Violin plots
  showing the expression levels of vascular endothelial markers across various EC
  subtypes. (F) Top three most enriched gene ontology (GO) terms for each EC subtype.
  (G-H) KM analysis showing the disease-free survival rate of TCGA-PRAD patients with
  high and low levels of THY1 (G) or HSPA6 (H) using the two-sided log-rank test.
  (I) The scatter plot showing the incoming and outgoing interaction strengths of
  each cell type in pre- and post-hormonal therapy samples. (J) Interaction number
  and strength of the 7 annotated cell types after hormonal therapy. (K) Heatmap illustrating
  the cell-cell interaction patterns in post-treatment samples. (L) Ligand-receptor
  pairs between Fibro_CXCL14 and ECs in the collagen pathway, and the communication
  probability and significance of their communication. (M) H&E and IF staining showing
  COL1A1+ (green), ITGA+ (red) and DAPI (blue) in treatment-naïve group (patient 04)
  and post-treatment group (patient 08)
