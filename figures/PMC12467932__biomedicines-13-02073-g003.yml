figure_title: The role of epoxide hydrolase (sEH) inhibitors in the pathogenesis of
  Alzheimer’s disease pathology.
caption: 'The role of epoxide hydrolase (sEH) inhibitors in the pathogenesis of Alzheimer’s
  disease pathology. AA, released via PLA2 from astrocytes, is metabolized into EETs,
  which exert anti-inflammatory and vasoprotective effects. sEH hydrolyzes EETs into
  diols (DiHETrEs and DiHETEs), which are pro-inflammatory. sEH inhibitors stabilize
  EETs, leading to: (1) activation of TFEB and LAMP1, thereby enhancing Aβ clearance;
  (2) modulation of the PI3K/AKT/GSK3β pathway, limiting tau hyperphosphorylation;
  (3) suppression of microglial activation and pro-inflammatory cytokines (TNF-α,
  IL-1β, IL-6), thus reducing neuroinflammation; and (4) attenuation of astrogliosis
  and oxidative stress, thereby promoting neuroprotection. Collectively, these actions
  help mitigate neurofibrillary tangle formation, amyloid plaque accumulation, vascular
  dysfunction, and cognitive decline. Abbreviations: PLA2—phospholipase A2; AA—arachidonic
  acid; EETs—epoxyeicosatrienoic acids; DiHETrEs—dihydroxyeicosatrienoic acids; TFEB—transcription
  factor EB; LAMP1—lysosomal-associated membrane protein 1'
