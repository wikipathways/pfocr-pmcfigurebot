figure_title: KEGG signaling pathway enrichment analysis across RA pathological and
  treatment groups.
caption: 'KEGG signaling pathway enrichment analysis across RA pathological and treatment
  groups. (a) Heatmap showing the −log10(p-value) of significantly enriched KEGG signaling
  pathways among the RA Day 18, RA Day 28, Tofacitinib-treated, and NAC-treated groups
  compared to the healthy control group. Notable pathways include JAK-STAT signaling,
  MAPK signaling, PI3K-Akt pathway, and multiple immune and cytokine-mediated pathways.
  (b) Classification of differentially enriched pathways into functional categories
  including: Environmental Information Processing, Cellular Processes, Organismal
  Systems, Immune System, Immune-Related Diseases, Infectious Diseases, and Other
  Human Diseases. The RA and treatment groups display distinct enrichment patterns
  across these categories, reflecting disease progression and therapeutic modulation.
  (c) Heatmap displaying the expression levels of key genes involved in the JAK-STAT
  signaling pathway across all groups. Genes such as CXCR4, IL6, IL1β, IFNγ, STAT1/3,
  and SOCS3 exhibit significant upregulation in RA groups, with partial normalization
  following Tofacitinib or NAC treatment. (d–g) Bar plots illustrating the enrichment
  scores of KEGG signaling pathways in: (d) RA Day 18 vs. Control, (e) RA Day 28 vs.
  Control, (f) Tofacitinib vs. Control, (g) NAC vs. Control. Orange bars represent
  upregulated signaling pathways, while blue bars denote downregulated ones. Consistently
  enriched upregulated pathways include cytokine-cytokine receptor interaction, chemokine
  signaling, Th1/Th2/Th17 cell differentiation, NF-κB, and Toll-like receptor signaling—hallmarks
  of RA inflammatory pathology. Both Tofacitinib and NAC treatments downregulated
  key proinflammatory and immune-related pathways (e.g., JAK-STAT and MAPK), suggesting
  distinct but overlapping immunomodulatory effects at the transcriptomic level'
