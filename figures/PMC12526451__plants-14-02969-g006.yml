figure_title: Expression of key genes related to leaf color and light responses.
caption: Expression of key genes related to leaf color and light responses. (A) Development-associated
  gene IbSPL9. (B) Genes involved in the chlorophyll biosynthetic pathway, including
  IbHEMB, IbPORC, and IbCAO. (C) Genes within the anthocyanin biosynthetic pathway
  and pivotal R2R3-MYB TFs, encompassing IbPAL, IbCHS, IbMYB1, IbMYB2, and IbMYB3.
  (D) Genes related to light signal transduction, including IbPHY (red light receptor),
  IbCRY (blue light receptor), IbUVR8 (UV-B receptor), and IbHY5 (a core TF in light
  signal transduction). Significant differences among the four sample types for each
  cultivar are indicated by letters (one-way ANOVA, n = 3, p < 0.05)
