figure_title: Schematic representation of the cooperative signaling between gC1q and
  VEGF-C in lymphatic endothelial cells.
caption: Schematic representation of the cooperative signaling between gC1q and VEGF-C
  in lymphatic endothelial cells. The gC1q domain binds to integrin α9β1, while VEGF-C
  activates VEGFR3. In the absence of gC1q–integrin engagement (e.g., when EMILIN-1
  is degraded by proteases), VEGF-C/VEGFR3 signaling alone supports lymphatic endothelial
  cell survival (left panel). Although gC1q by itself does not induce VEGFR3 phosphorylation,
  its binding to integrins enhances and prolongs downstream signaling cascades—such
  as AKT and ERK—when VEGF-C is present. This indicates a yet incompletely understood
  mechanism (grey arrows) in which integrin and VEGFR3 signaling pathways synergize
  to promote effective lymphangiogenic responses. Receptor interactions and signaling
  events are based on previously published data [32,74]. Green arrows indicate the
  activaction of downstream signaling. Created with BioRender.com
