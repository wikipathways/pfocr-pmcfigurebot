figure_title: Energy metabolism support network linking OLs, astrocytes, and axons.
caption: Energy metabolism support network linking OLs, astrocytes, and axons. Glucose
  taken up by astrocytes is processed through glycolysis and other pathways (e.g.,
  OXPHOS), yielding lactate and ketone bodies that are transported through the extracellular
  space (ECS) into OLs via monocarboxylate transporters (e.g., MCT1) or through gap
  junctions to fuel OL energy metabolism. In turn, OLs deliver lactate, ketone bodies,
  and lipids—acquired from the extracellular milieu, synthesized de novo, or supplied
  by astrocytes—to the myelin sheath, thereby providing metabolic support to axons.
  Arrows represent the direction of transfer of the relevant substances
article_title: 'Energy-Metabolic Imbalance of Oligodendrocytes in Multiple Sclerosis:
