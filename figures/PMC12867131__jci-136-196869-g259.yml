figure_title: Qualitative interaction in the association between sex and age on interferon-α
  response protein levels
caption: All 22 Hallmark interferon-α response pathway proteins represented in the
  Olink Inflammation Explore panel were z-scored and assessed for interaction by sex
  and age (≤47 vs. >47) after adjustment for CNICS site, race, nadir CD4+, MSM status,
  smoking, IDU history, HCV history, obesity, and ASCVD risk score. The β coefficients
  for female vs. male sex (red indicating a greater increase among women vs. blue
  for men) in the age ≤ 47 (A) and > 47 (B) strata are depicted in STRING protein
  network map for all 22 proteins in the pathway. A composite mean interferon-α response
  protein level score was calculated among all 22 z-scored proteins, and adjusted
  means were calculated for each age-sex stratum and compared, highlighting minimal
  changes with age among men but statistically significant changes with age among
  women (C)
article_title: Age modifies the association between sex and the plasma inflammatory
