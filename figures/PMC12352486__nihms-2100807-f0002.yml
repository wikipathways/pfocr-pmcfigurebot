figure_title: Schematic representation of steps involved in the regeneration of the
  visual chromophore
caption: 'Enzymes are colored blue, and transport proteins are green. Abbreviations:
  atRAL (all-trans-retinal), 11cRAL (11-cis-retinal), atROL (all-trans-retinol), atREs
  (all-trans-retinyl esters), RPE (retinal pigment epithelium), and OS (photoreceptor
  outer segment). The canonical visual cycle occurs in RPE cells, which express key
  enzymes involved in this process, including LRAT, RPE65, and RDH5. RPE cells also
  facilitate the specific uptake of retinoids from circulation through STRA6, a receptor
  for RBP4. Following the photobleaching of rhodopsin, atRAL undergoes reduction to
  atROL, a reaction catalyzed by all-trans-retinol dehydrogenases (atRDHs), primarily
  RDH8 and RDH12. The resulting atROL is transported via IRBP to RPE cells, where
  it binds to RBP1. atROL is then esterified by LRAT to form atREs, such as all-trans-retinyl
  palmitate, which serves as a direct substrate for the retinol isomerase RPE65. RPE65
  catalyzes the cleavage and isomerization of atREs, producing free fatty acids and
  11cROL. RDH5 subsequently oxidizes 11cROL to 11cRAL, which binds to CRALBP for transport
  back to the OS via IRBP, completing the visual cycle and enabling rhodopsin regeneration.
  In addition to the classical visual cycle, the presence of RGR in the RPE and Müller
  cells facilitates the light-dependent (photic) visual chromophore regeneration pathway.
  atROL, generated from the reduction of photoisomerized visual chromophore, is shuttled
  from the OS of cones and rods to adjacent cells. Upon conversion to atRAL, it associates
  with RGR, enabling photoconversion to the 11-cis isomer. Created in BioRender (https://BioRender.com/8lgbdlk)'
