figure_title: Simplified diagram of the dopaminergic hypothesis of schizophrenia.
caption: 'Simplified diagram of the dopaminergic hypothesis of schizophrenia. Hyperactivation
  of the dopaminergic mesolimbic pathway (red) causes positive symptoms (e.g. hallucination,
  delusion, etc.) of schizophrenia through increased stimulation of D2 receptors in
  limbic areas. Negative symptoms (e.g., reduced emotional expression, lack of motivation,
  social withdrawal, etc.) are caused by decreased activation of D1 receptors in cortical
  areas due to hypoactivation of the mesocortical pathway (blue). Green circles are
  expression sites of trace amine-associated receptor 1 (TAAR1) [9] in different brain
  structures (indicated by numbers). TAAR1 expression has been shown in neurons, astrocytes,
  and microglial cells the functions of which are discussed in detail in the text.
  Note: question marks signify the lack of confirmation of neuronal or subcellular
  localization of TAAR1'
article_title: Role of Glial Trace Amine Associated Receptor 1 (TAAR1) and Microbiota
  in Schizophrenia
