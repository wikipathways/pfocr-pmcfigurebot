figure_title: Therapeutic targeting of innate immune and inflammatory pathways during
  SARS-CoV-2 infection.
caption: Therapeutic targeting of innate immune and inflammatory pathways during SARS-CoV-2
  infection. Alveolar epithelial cells release DAMPs (Damage-associated molecular
  patterns) such as High Mobility Group Box 1 (HMGB1) and mitochondrial DNA (mtDNA).
  These DAMPs create a self-perpetuating pathogenic loop by engaging TLR2/4 (on the
  endothelium) and the NLRP3 inflammasome (in alveolar macrophages), leading to massive
  and uncontrolled production of pro-inflammatory cytokines. Additionally, DAMPs-driven
  activation massively amplifies the release of a diverse array of pro-inflammatory
  cytokines (IL-17A, IL-18, IL-1β, TNF-α, IL-6) and type I/III interferons. This leads
  to a cytokine storm, which drives systemic inflammation and multi-organ failure.
  The figure also highlights key therapeutic intervention points (marked by T in red
  circle) targeting pro-inflammatory cytokines, the JAK/STAT signaling pathway, DAMP
  sensors (TLR2/4 and NLRP3), TLR receptor inhibitors, and type I/III IFNs, to break
  this hyper-inflammatory feedback loop
