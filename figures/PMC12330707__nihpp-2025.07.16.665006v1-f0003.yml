figure_title: Gene program analysis reveals source- and cell-type-specific hypoxic
  strategies
caption: '(A) Venn diagrams showing the overlap of differentially expressed genes
  (DEGs) among α (blue), β (orange), and δ (green) endocrine cells at 6, 24, and 48
  hours for primary (top row) and SC-islets (bottom row). Numbers indicate upregulated
  (black) and downregulated (red) DEGs. Boxes highlight representative genes found
  in the core intersection (regulated in all three cell types).(B) Dot plot visualizing
  the conserved core response program. Expression changes are shown for representative
  genes and regulons that are significantly regulated in a similar direction across
  both primary and SC-islets. Genes are grouped by major biological pathways (HIF
  Pathway, Glycolysis, UPR, etc.).(C) Dot plot visualizing divergent adaptive strategies.
  Expression changes are shown for representative genes and regulons that exhibit
  source-specific regulation. Genes are grouped by their dominant expression pattern
  (e.g., “Primary-Biased Up,” “SC-Biased Down”).For dot plots (B, C): Dot color represents
  the relative expression change, scaled to the maximum absolute log-fold change for
  each gene/regulon across all conditions (red = up, blue = down). Dot size indicates
  the adjusted p-value. The top bar indicates islet source and cell type. All comparisons
  are relative to the 0-hour baseline'
