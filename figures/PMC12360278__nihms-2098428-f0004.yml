figure_title: Proteomic differences between human epilepsy and non-epileptic cases.
caption: Proteomic differences between human epilepsy and non-epileptic cases. (A)
  Principal component analysis (PCA) of epileptic (E, red) and non-epileptic (NE,
  blue) cases, showing distinct clustering based on protein expression profiles. Each
  point represents an individual case. The PC1 bar plot indicates significant separation
  between groups.(B) Volcano plot displaying protein expression differences for all
  identified proteins. Proteins highlighted in red showed significantly altered expression
  when comparing E and NE cases. Significance was determined using Student’s t-test.
  P-values for significantly altered proteins are provided in the Supplementary Table
  1. (C) Heatmap showing scaled protein expression values (z-scores), color-coded
  according to the legend on the right, for significantly changed proteins used in
  clustering analysis. (D) Expression levels of selected proteins of interest with
  significant alterations in epilepsy. Each point represents an individual case. *p
  < 0.05; **p < 0.01. (E) Gene Ontology (GO) analysis of significantly altered proteins,
  including biological process (BP), cellular component (CC), and molecular function
  (MF). The top 10 terms are shown. (F) KEGG pathway analysis of significantly altered
  proteins. The top 10 pathways are shown
