figure_title: Complement regulatory proteins
caption: A) Multiple complement regulatory proteins are expressed on the outer surface
  of cells or circulate in plasma. Of the soluble inhibitors, C1 inhibitor (C1INH)
  and C4b binding protein (C4BP) inhibit the classical and lectin pathways. Map44
  inhibits lectin pathway activation. The alternative pathway is inhibited by factor
  H, which can work in the fluid phase and can bind to the surface of cells. Other
  soluble complement regulators include carboxypeptidase-N (CPN), which inactivates
  C3a and C5a, and S-protein and clusterin, which prevent formation of C5b-9. Regulators
  expressed on the surface of cells include complement receptor-1 (CR1), CD46, and
  CD55. These regulators inactivate the C3- and C5-convertases by accelerating decay
  of the convertases (indicated with green) or by acting as cofactors for the factor
  I mediated cleavage of C3b and C4b (indicated with blue). CD59 prevents formation
  of C5b-9. Factor H, C4BP, CD55, CD46, and CR1 all contain multiple short consensus
  repeat domains, indicated with closed circles. B) Decay accelerators cause irreversible
  dissociation of C3b from Bb or C2b, halting activity of the convertase. C) Cofactors
  allow the cleavage of C3b into iC3b and C3b, and C4b is cleaved to form C4d and
  C4c. These fragments can no longer form convertases. D) CD59 binds to C5b-8 after
  it is formed on the cell surface and it also binds to C5b-8 in complex with a single
  C9. CD59 prevents the additional of more C9 proteins, however, thereby blocking
  C9 polymerization and formation of a pore in the cell membrane
