figure_title: AASDHPPT is required for mitochondrial fatty acid synthesis pathway
  function.
caption: AASDHPPT is required for mitochondrial fatty acid synthesis pathway function.(A)
  Two-dimensional network diagram representing gene essentiality score correlations
  between selected genes associated with AASDHPPT and known substrate targets, mtFAS
  pathway members, LYRM family members, and the GO term “pantothenate metabolism”
  using a minimum threshold correlation score > 0.2. Different colors represent genes
  associated with clusters as shown in Supplementary Fig. 2E. Correlation strength
  is represented by the length and thickness of the connecting edge. (B) Whole cell
  lysates from indicated cell lines expressing mtDSRed or PPT-GFP fusion protein were
  separated by SDS-PAGE and immunoblotted for the denoted targets. Data are representative
  of 3 biological replicates. Red asterisk denotes ATP5a band from previous blot.
  (C) Whole cell lysates from indicated cell lines expressing either NDUFAB1-Flag
  or NDUFAB1S112A-Flag were separated by SDS-PAGE and immunoblotted for protein expression
  of the denoted targets. Data are representative of 3 biological replicates. (D)
  Schematic of mass spectrometry approach using AspN digestion to detect Apo-, Holo-,
  and Acyl-species of NDUFAB1. (E) Coomassie stain of SDS-PAGE gel of NDUFAB1-FLAG
  immunoprecipitation from the indicated cell line. (F) Relative quantification of
  NDUFAB1 AspN digest products via tandem liquid chromatography mass spectrometry
  n = 3 technical replicates from immunoprecipitation, representative of 3 distinct
  biological replicates. NS = not significant, *** = p < 0.001, **** = p < 0.0001
  as determined by two-way ANOVA followed by Šidák’s multiple comparisons test. (G)
  Representative overlayed extracted ion chromatograms of Apo-, Holo-, and Acyl-NDUFAB1
  from cells of the indicated genotype, quantified in F
