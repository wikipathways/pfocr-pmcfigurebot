figure_title: Knockdown of FGFR4 inhibits fatty acid metabolism in colorectal cancer.
caption: Knockdown of FGFR4 inhibits fatty acid metabolism in colorectal cancer. (A)
  Network analysis using Metascape highlighted fatty acid biosynthesis and the PI3K-Akt
  signaling pathway as critical processes regulated by FGFR4. (B) Oil Red O staining
  showed decreased lipid droplet synthesis in sh-FGFR4 cells. (C) Quantification of
  total free fatty acid content in SW480/sh-NC and SW480/sh-FGFR4 cells. (D) Measurement
  of fatty acid oxidation activity in SW480/sh-NC and SW480/sh-FGFR4 cells. (E) Quantification
  of palmitic acid levels in SW480/sh-NC and SW480/sh-FGFR4 cells. ** p< 0.05
