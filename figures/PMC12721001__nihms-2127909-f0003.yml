caption: Top 30 enriched canonical pathways from IPA of Dependent vs naïve (A) and
  Dependent vs non-Dependent comparisons (B) in the IP (astrocyte) samples. Significantly
  differentially translated genes in the astrocyte fraction that were also enriched
  in astrocytes were analyzed for pathway overrepresentation in the Dependent vs naïve
  comparison (C) and the Dependent vs non-Dependent comparison (D). Pathways highlighted
  in yellow relate to interleukin signaling, green highlights relate to interferon,
  and blue highlights relate to oxidative stress and glutathione pathways. In each
  panel, the x-axis shows the activation z-score which assigns positive or negative
  activation based on known pathway dynamics and the regulation of genes enriched
  in the pathway
