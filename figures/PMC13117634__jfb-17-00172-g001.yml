caption: 'Overview of electrical microenvironment and reconstruction strategies following
  spinal cord injury. (Left panel): Primary injuries trigger secondary damages, including
  hematoma, edema, and inflammatory insult, which disrupt the spinal cord’s native
  electrical microenvironment. (Center left panel): This aberrant electrical microenvironment
  impedes neuroregeneration by inducing neuron apoptosis, astrocyte proliferation,
  and Mφ/microglia activation. (Center right panel): Electrical stimulation activates
  intracellular signaling pathways, inducing altered transcription of neuroregenerative
  genes. (Right panel): Electrical microenvironment reconstruction shifts from passive
  conductive hydrogels to proactive strategies, including electrode implantation,
  piezoelectric, and magnetoelectric stimulation'
