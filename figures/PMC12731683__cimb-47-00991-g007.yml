figure_title: Regulatory Role of ADGRG6 in the NF-κB→STAT6→GATA3 Signaling Axis.
caption: Regulatory Role of ADGRG6 in the NF-κB→STAT6→GATA3 Signaling Axis. (A) KEGG
  pathway analysis of the gene set co-expressed with ADGRG6 using the LinkInterpreter
  module; (B–E) Pearson correlation analysis between ADGRG6 and key genes of the signaling
  axis (NFKB1, RELA, STAT6, and GATA3) in 178 clinical samples. Values represent Pearson
  correlation coefficients and corresponding p-values, n = 178; (F,G) Relative expression
  levels of STAT6 and GATA3 genes in the signaling axis in AsPC-1 and BxPC-3 cells
  after ADGRG6 knockdown detected by RT-qPCR. Data are presented as mean ± standard
  deviation; (H,I) Secretion levels of secretory cytokines IL-6 and IL-8 in AsPC-1
  and BxPC-3 cells detected by ELISA; (J) Expression and activity of key proteins
  in the signaling axis after ADGRG6 knockdown detected by Western blot, *** p < 0.001
