  Effect of dietary HILM on NF-κB/MAPK signaling pathway of weaned piglets in ETEC-challenged pig housing. (A) Relative mRNA expressions levels of NOD1 and NOD2 in the colon of weaned piglets were detected by Real-Time PCR. Protein expressions of p-NF-κB, p-MAPK, and TLR2 in the colon of weaned piglets were detected by Western blot (B) and the bar graphs showed the protein band intensity (C). Data were presented as mean and SEM (protein expression n = 3; others n = 6). * p < 0.05, ** p < 0.01 compared with NC, #
