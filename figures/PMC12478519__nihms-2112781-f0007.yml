figure_title: Neurobiological pathways targeted by miR-128–3p.
caption: Neurobiological pathways targeted by miR-128–3p. (A) Pathway diagram illustrating
  key neurobiological pathways targeted by miR-128–3p, derived from the predicted
  target genes. These pathways include cortisol synthesis and secretion, dopaminergic
  synapse, EGFR pathway, ErbB signaling, FoxO signaling, mTOR signaling, and neurotrophin
  signaling. Each pathway is annotated with the corresponding genes identified as
  targets of miR-128–3p, providing insight into how miR-128–3p may influence critical
  cellular processes in the brain. (B) Bubble plot showing the enrichment significance
  and gene count for each neurobiological pathway targeted by miR-128–3p. The p-value
  gradient scale indicates the p-value associated with each pathway’s enrichment.
  The darker shades representing more statistically significant pathways. The size
  of each bubble corresponds to the total number of genes in the pathway targeted
  by miR-128–3p. This also emphasizes the breadth of influence miR-128–3p may have
  across various neurobiological processes
