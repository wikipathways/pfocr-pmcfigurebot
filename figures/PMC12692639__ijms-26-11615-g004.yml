caption: Immune activation by mtDNA release through both intracellular and extracellular
  pathways. TLR9 for sensing circulating (extracellular) mtDNA, and the NLRP3 inflammasome
  and the cGAS/STING pathway for sensing cytoplasmic (intracellular) mtDNA release.
