figure_title: Phagocytic receptor systems implicated in removal of apoptotic debris
  and Amyloid-β plaques in the CNS
caption: 'a. A summary of key phagocytic receptor systems implicated in removal of
  apoptotic cells and debris. Distinct molecules are increased on the surface of apoptotic
  debris and are identified by phagocytic receptors, including TREM2, TAM receptors
  (Tyro3, Axl, MerTK), and integrins (e.g., αvβ2, aka CR3). “Don’t eat-me” signals,
  such as CD47, inhibit uptake by phagocytes. Scavenger receptors clear debris, pathogens,
  and damage-associated molecules. CD33 is a Siglec family member that binds sialic
  acids and limits phagocytosis. b. Key receptors that directly bind and regulate
  removal of Aβ plaques. TREM2 and αvβ2 facilitate Aβ engulfment. In contrast, CD33
  interferes with Aβ uptake via binding sialic acid residues within the plaques and
  likely by inhibiting the TREM2 pathway. iC3b: protein fragment in the complement
  system, oxLDL: oxidized low-density lipoprotein, DAMPs: damage-associated molecular
  patterns; Siglec: sialic-acid binding immunoglobulin-like lectin; CR3: complement
  receptor 3; TAM: Tyro3, Axl, Mer receptor family. Figure created in part with BioRender.com'
