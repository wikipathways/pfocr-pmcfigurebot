figure_title: Activated FOXO1 hampers human HCC formation in vitro
caption: '(A) Western blots showing Myc-tagged FOXO1AAA expression in pInducer20-FOXO1AAA
  HepG2, SNU449, and PLC/PRF/5 cells. Cells were treated with 2 μM doxycycline hydrochloride
  (Dox) for 48 hours to induce FOXO1AAA expression. GAPDH was used as the loading
  control. (B) RT-qPCR analysis of FOXO1 downstream target genes in FOXO1AAA-overexpressing
  HepG2, SNU449, and PLC/PRF/5 cells. (C) Representative images and quantification
  of colony formation assay in FOXO1AAA-overexpressing HepG2, SNU449, and PLC/PRF/5
  cells. (D) Cell cycle distribution was quantified by measuring the area corresponding
  to each cell cycle phase in the flow cytometry histogram. (E) Schematic representation
  of RNA-seq study. pInducer20-FOXO1AAA SNU449 cells were treated with or without
  2 μM Dox for 48 hours, followed by RNA-seq analysis. (F) Volcano plots of the RNA-seq
  study described in (E). 3807 genes were upregulated and 4102 genes were downregulated
  upon FOXO1AAA overexpression. Significantly changed genes were defined as those
  with an adjusted p-value (FDR) < 0.05 and an absolute fold change greater than 1.5.
  (G) GSEA analysis of the hallmark pathways ‘FOXO signaling’, ‘Glycerophospholipid
  metabolism’, ‘Cell cycle’, and ‘Hepatocellular carcinoma’ in the RNA-seq study of
  FOXO1AAA-overexpressing cells. (H) Top 15 downregulated pathways identified by KEGG
  analysis of RNA-seq data. Data are presented as the mean ± SEM. Statistical significance:
  *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001'
