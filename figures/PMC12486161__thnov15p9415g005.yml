figure_title: Alisol A activates the NAMPT-related signaling pathway, thereby facilitating
  lysine deacetylation and autophagy.
caption: 'Alisol A activates the NAMPT-related signaling pathway, thereby facilitating
  lysine deacetylation and autophagy. (A) Schematic. (B) Total proteins were collected
  from the mice hippocampal tissues and evaluated by WB, including AMPK, p-AMPKα Thr172
  or Thr183, NAMPT, SIRT1, PGC1-α, and AcetyI-Lysine, bar graph represents semi-quantification
  of WB (C), n = 3; (D) NAD+ levels in the hippocampus of Ldlr-/- mice were determined
  by the NAD+ Assay Kit, n = 8; (E) NAD⁺ content in HT22 cells or in primary neurons
  was measured using an NAD assay kit, n = 8; (F) WB analysis of AMPK, p-AMPKα Thr172
  or Thr183, NAMPT, SIRT1, PGC1-α, and AcetyI-Lysine in cells, and quantification
  result was normalized against the levels of GAPDH, n = 3; (G) Representative images
  of NAMPT (green) and SIRT1 (red) double immunofluorescence staining, scale: 5 μm;
  and quantification of immunofluorescence stain intensity using Image J; (H) WB analysis
  of P62, BECLIN1, PARKIN, PINK1, COXIV, TOM20, and LC3B in cells, and quantification
  result was normalized against the levels of GAPDH or COXIV, n = 3; (I) Changes in
  MMP was monitored by staining with JC1, scale: 100 μm; and quantification of the
  percentage of MMP, n = 8. Compared to the 5, * P < 0.05, ** P < 0.01; compared to
  the 6, # P < 0.05, ## P < 0.01. Compared to the control group, * P < 0.05, ** P
  < 0.01; compared to the Ldlr-/-, # P < 0.05, ## P < 0.01'
