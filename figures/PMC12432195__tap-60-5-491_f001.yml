figure_title: Ketone body metabolism pathway.
caption: Ketone body metabolism pathway. This schematic illustration outlines the
  key steps involved in hepatic ketone body synthesis (ketogenesis) and peripheral
  utilization (ketolysis). In the liver, acetyl-CoA derived from fatty acid β-oxidation
  is converted to acetoacetyl-CoA (AcAc-CoA), which is then transformed into 3-hydroxy-3-methylglutaryl-CoA
  (HMG-CoA) by HMG-CoA synthase 2 (HMGCS2). Subsequently, HMG-CoA is cleaved by HMG-CoA
  lyase to yield acetoacetate (AcAc), which may be reduced to D-3-hydroxybutyric acid
  (3HB) or spontaneously decarboxylate to acetone (not shown). In extrahepatic tissues,
  acetoacetate is activated to acetoacetyl-CoA by succinyl-CoA:3-oxoacid CoA transferase
  and then cleaved into 2 acetyl-CoA molecules by mitochondrial acetoacetyl-CoA thiolase
  (ACAT1) for energy production. 3HB, D-3-hydroxy-n-butyric acid; Ac-CoA, acetyl-CoA;
  AcAc-CoA, acetoacetyl-CoA; AcAc, acetoacetic acid; HMG-CoA; 3-hydroxy-3-methylglutaryl-CoA;
  HMGCS2, 3-hydroxy-3-methylglutaryl-CoA synthase 2; TIG, tiglyglycine
