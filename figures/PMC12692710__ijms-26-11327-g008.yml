figure_title: RO-Exo reduces phosphorylation of MAPK pathway proteins in CNV retina.
caption: RO-Exo reduces phosphorylation of MAPK pathway proteins in CNV retina. (A–C)
  Representative confocal images of phosphorylated ERK (A), JNK (B), and p38 MAPK
  (C) in retinal sections at day 12 post-laser photocoagulation (LP). p-ERK, p-JNK,
  and p-p38 MAPK (red) were highly expressed in CNV lesions, whereas RO-Exo treatment
  reduced their expression levels. Hoechst (blue) was used for nuclear staining. Scale
  bar = 50 µm
