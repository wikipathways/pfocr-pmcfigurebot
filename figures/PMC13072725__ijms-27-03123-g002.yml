figure_title: Establishment of vascular endothelial growth factor (VEGF) stimulation
  conditions and mitogen-activated protein kinase (MAPK) signaling kinetics in HUVEC.
caption: Establishment of vascular endothelial growth factor (VEGF) stimulation conditions
  and mitogen-activated protein kinase (MAPK) signaling kinetics in HUVEC. In the
  experimental schematic panels (A,C), D followed by a number indicates the experimental
  day, and the dashed line represents the duration of VEGF treatment. (A,B) Dose-dependent
  effects of VEGF (0.1–20.0 ng/mL) on HUVEC viability at 24 h following serum starvation.
  Based on these results, 5.0 ng/mL VEGF was selected for subsequent experiments.
  (C) Experimental schematic illustrating the time course of VEGF stimulation (5.0
  ng/mL) for MAPK signaling analysis. (D–F) Representative Western blot images showing
  time-dependent phosphorylation of extracellular signal-regulated kinase (ERK), c-Jun
  N-terminal kinase (JNK), and p38 MAPK following VEGF stimulation for the indicated
  durations. Total ERK, JNK, and p38 levels were used for normalization. (G–I) Densitometric
  quantification of phosphorylated ERK (p-ERK), JNK (p-JNK), and p38 (p-p38) normalized
  to their total protein levels and expressed relative to the control. Distinct activation
  kinetics were observed for each MAPK pathway, with p-ERK peaking at 15 min, p-JNK
  at 30 min, and p-p38 at 60 min. Data are presented as mean ± SEM from three independent
  experiments (n = 3). Statistical analysis for cell viability was performed using
  one-way ANOVA followed by Tukey’s post hoc test. Time-course Western blot data were
  analyzed using the Kruskal–Wallis test followed by Dunn’s post hoc test. Statistical
  significance is indicated as * p < 0.05 and ** p < 0.01 compared with CON
