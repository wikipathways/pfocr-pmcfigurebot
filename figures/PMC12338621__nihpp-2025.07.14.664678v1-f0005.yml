figure_title: The flower initiation pathway and phototropic pathway use analogous
  signaling mechanisms
caption: 'A) Plasma-membrane-localized phototropins perceive blue light, causing changes
  in phosphorylation status of NPH3 and NPH3-PHOT association. In the nucleus, transcription
  factor ARF7/NPH4 also plays a role. B) Pathway for auxin-mediated flower initiation.
  Three genes (PID, NPY, and MP) are homologous to their counterparts in phototropism
  (color coded). The dotted arrows indicate that there are gaps in our understanding
  of the step. PHOT: PHOTOTROPIN; NPH3: NON-PHOTOTROPICAL HYPOCOTYL 3; ARF7: AUXIN
  RESPONSE FACTOR 7; MP: MONOPTEROS'
article_title: An increase of NPY1 expression leads to inhibitory phosphorylation
  of PIN-FORMED (PIN) proteins and suppression of pinoid (pid) null mutants
