caption: Myr attenuates imiquimod-induced skin inflammation in psoriasis-like mice
  accompanied by inhibiting the EGFR/AKT signaling pathway and decreased the level
  of Mmp9, Ptgs2 and Tnf. (A–D) Protein–ligand docking reveals a stable protein–ligand
  interaction between Myr and TNF, MMP9, PTGS2, as well as EGFR. (E) Western blot
  analysis of EGFR and AKT in IMQ-induced mouse model. (F,G) Quantitative analysis
  of Western blot results for Figure 5E. (H–J) The mRNA levels of Mmp9, Tnf, and Ptgs2
  in the skin were determined by RT-qPCR. Data are shown as mean ± SD. For (F–J),
  one way ANOVA with Tukey’s multiple comparisons test. * p < 0.05, ** p < 0.01, ****
  p < 0.0001
