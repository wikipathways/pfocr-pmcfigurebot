figure_title: Activation of NFkB and IRF pathways in human THP1 dual reporter cells
  by BbLP
caption: 'NF-kB activation was determined by the secreted alkaline phosphatase: a)
  SEAP activity in THP1 cells treated with different concentrations of BSA, Pam3CSK4
  and LP at 24 hrs. Kinetics of LP-induced SEAP activity in THP1 and MyD88 KO reporter
  cells, b) at 1, 16 and 24 hrs, and cells pre-treated with different concentrations
  of c) BAY inhibitor and d) BCI inhibitor. Kinetics of Pam3CSK4 induced SEAP activity
  in THP1 and MyD88 reporter cells pre-treated with different concentrations of e)
  BAY inhibitor and f) BCI inhibitor. IRF activity was determined by the secreted
  luciferase: g) kinetics of BbLP-induced luminescence at 1, 16 and 24 hours post
  treatment. Bar graphs showing the luminescence induced by h) BbLP and i) Pam3CSK4
  in THP1 and MyD88 KO THP1 reporter cells pre-treated with BAY or BCI inhibitors,
  while untreated cells were maintained as control. Data are presented as mean ± standard
  error of the mean (SEM). Statistical significance between samples is indicated as
  follows: *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
