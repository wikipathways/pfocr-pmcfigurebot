figure_title: P2rX4-centric regulation of plasma cell survival as a function of time
caption: Proposed model wherein P2rX4 dependency occurs with time as ER stress surpasses
  a critical threshold that coincides with movement of plasma cells into the bone
  marrow. Overall ER “stress” is influenced by a combination of factors including
  rates of protein synthesis and overall ER load capacity. As plasma cells approach
  full maturity, they become dependent on the constant attenuation of the ATF4-CHOP
  pathway for Bim driven apoptosis due to the regulation of ER homeostasis by P2rX4.
  Note, this model accommodates the possibility that P2rX4 dependency begins shortly
  before newly formed plasma cells exit a peripheral lymphoid tissue or soon after
  such cells enter the BM. Created with https://BioRender.com
