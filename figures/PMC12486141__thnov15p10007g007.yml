figure_title: Osteoblasts subtye-derived EVs aggravated subchondral bone remodeling
  in OA progression.
caption: Osteoblasts subtye-derived EVs aggravated subchondral bone remodeling in
  OA progression. Regulated by Wnt pathway, osteoblasts were heterogeneous in osteogenic
  differentiation and the activation of mitophagy will provide calcium phosphate for
  further mineralization. EVs from three OB subtypes inheriting the heterogeneity
  could promote osteogenic with functional miRNAs and calcium phosphate. Osteoblasts
  subtypes-derived EVs could accelerate the subchondral bone remodeling in OA progression,
  resulting in bone sclerosis and cartilage degeneration. Created by Biorender
