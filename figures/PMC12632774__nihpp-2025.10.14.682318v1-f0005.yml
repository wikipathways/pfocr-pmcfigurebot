figure_title: TF motifs in DEGs.
caption: TF motifs in DEGs. Here, we defined a gene with the binding of TF to be that
  annotated in a peak containing a TF motif. Asterisks highlight DEGs. (A) Z score
  of TF activity associated with psychosocial factors (DAMs, 10% FDR). TFs clustering
  into 4 groups using a hierarchical method with complete linkage and Euclidean distance.
  Asterisk denotes TF genes that are DEGs in the corresponding cell type (B) Log odds
  ratio of the enrichment of individual TF motifs in DEGs in the corresponding cell
  type and psychosocial variables. (C) schematic overview of the underlying mechanism
  of TF genes driving target gene expression changes (D) IRF4 gene expression (to
  row), motif activity (middle row), and pathway score of the IFN--γ signaling pathways
  belong to the IRF4 TF (bottom row) associated with psychological stress levels (left)
  and social support (right)
article_title: Psychological stress and social support are associated with opposing
  single-cell pro-inflammatory gene regulatory mechanisms in adults
