figure_title: RNA sequencing reveals Jph2 is critical for processes involved in CF
  activation
caption: A. Experimental design in which primary mouse CFs were infected with adenoviruses
  for 72 hours prior to RNA isolation and RNA-seq analysis. B and C. RNA-seq volcano
  plot of differentially expression genes (DEGs) after Ad-shJph2 (B) or Ad-Jph2 (C)
  infection relative to Ad-GFP infected CFs. Significant DEGs meeting thresholds of
  >1.5 fold change (0.585 absolute log2 fold change), Benjamini-Hochberg pAdj <0.05,
  and >1 transcript per million are indicated by darker symbols. D. Venn diagram of
  significant up- and down-regulated DEGs of Ad-shJph2 and Ad-Jph2 samples relative
  to Ad-GFP. E and F. Bubble plot of top ten enriched Canonical Pathway terms of each
  pairwise comparison for significant DEGs using Ingenuity Pathway Analysis. Z-scores
  <−2 and >+2 delineate thresholds for inactivated and activated terms, respectively.
  G. Heatmap of k-means clustering of all significant DEGs. H. Heatmap of DEGs commonly
  associated with fibrosis, TGFβ signaling, and cell cycle progression
