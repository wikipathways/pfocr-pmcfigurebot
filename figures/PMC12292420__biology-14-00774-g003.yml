figure_title: Diverse roles of HSP70 in autophagy modulation and cell survival under
  stress conditions.
caption: 'Diverse roles of HSP70 in autophagy modulation and cell survival under stress
  conditions. HSP70 has been shown to regulate autophagy in order to maintain cellular
  homeostasis under conditions of cellular stress through multiple mechanisms. It
  directly promotes the formation of autophagosomes and enhances membrane assembly
  in concert with Beclin-1 and VPS34; preferentially activates autophagy rather than
  apoptosis by inhibiting the anti-autophagic effect of BCL-2/BCL-XL or balancing
  it with cytochrome c; indirectly regulates autophagy by modulating the AMPK and
  NF-κB stress pathways; and also inhibits caspase-3 activation to provide a time
  window to promote cell survival. HSP70: Heat Shock Protein 70; AMPK: AMP-activated
  Protein Kinase; NF-κB: Nuclear Factor Kappa-Light-Chain-Enhancer of Activated B
  Cells; BCL-2: B-cell Lymphoma 2; Beclin-1: Bcl-2 Interacting Coiled-coil Protein
  1; BCL-XL: B-cell Lymphoma Extra Large; VPS34: Vacuolar Protein Sorting-associated
  Protein 34; Fas: Factor-Associated Suicide'
