caption: 'CCH induces neuronal damage and autophagy suppression via BNIP3/BNIP3L pathway
  dysfunction. (A) Representative images of hippocampal neuronal histopathology in
  HE staining (scale bar: 50 μm). (B) Representative images of hippocampal neuronal
  histopathology in Nissl staining (scale bar: 200 or 50 μm). (C) TUNEL staining showing
  apoptotic neurons (brown nuclei) in the cortex and hippocampal CA1, CA3, DG region
  (scale bar: 50 μm). (D) Quantification of TUNEL-positive cells in CA1 region (**
  p < 0.01, *** p < 0.001; n = 3 rats/group). (E) Electron micrographs of hippocampal
  neurons. BCCAO group showed mitochondrial vacuolation, nuclear membrane rupture
  (blue arrow), and reduced number of autophagic structures (red arrow) (scale bar:
  2 μm or 500 nm). (F) The ratio of autophagic structures (including autophagosomes
  and autolysosomes) to mitochondria across multiple fields from each group (* p <
  0.05, n = 3 rats/group). (G) The representative strip of WB. (H–M) WB analysis of
  autophagy and mitophagy markers (# p < 0.05, ## p < 0.01, ### p < 0.001 vs. sham;
  * p < 0.05 and *** p < 0.001 vs. BCCAO. Data = mean ± SD; n = 4 repetitions/group)'
