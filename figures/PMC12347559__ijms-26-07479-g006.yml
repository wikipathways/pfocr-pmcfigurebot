figure_title: ELP1 knockout limits ZIKV infection and translation.
caption: ELP1 knockout limits ZIKV infection and translation. (A) Schematic of U34
  modification pathway in ELP1 knockout (Elp1-KO) cells. Schematic representation
  of ZIKV BeH8-mCherry 5′ genomic in which the mCherry coding region is followed by
  a “self-cleaving” 2A peptide and inserted between two tandem capsid (c) segments.
  (B) Western blot analysis comparing ELP1 protein levels between HeLa (control) and
  Elp1-KO cells with actin loading control. Graph shows quantification of relative
  ELP1 levels. (C) ZIKV infection rates measured by flow cytometry in control (HeLa)
  vs. Elp1-KO cells at different MOIs 24 h post-infection. (D) Quantification of ZIKV
  viral translation in control vs. ELP1-KO cells across different MOIs 24 h post-infection.
  Statistical significance and percent changes are indicated where applicable. Error
  bars represent standard error of the mean
