figure_title: Effects of ALA on tumor-killing activity of T cells.
caption: |-
  Effects of ALA on tumor-killing activity of T cells. (A) The PC3 and DU145 cells treated with or without ALA (1.5, 2 mM) for 1 h followed by addition of IFN-γ or not for 24 h. Then, the cells were washed and then the activated Jurkat T cells or medium only were co-cultured with PCa cells for 24 h. After the Jurkat T cells were removed, the morphology changes of cells were evaluated and the cell viability of PCa cells was determined by CCK-8 assay. (B) The proposed schematic illustrates that ALA inhibits PD-L1 expression in IFN-γ-stimulated PC3 and DU145 cells through multiple mechanisms. ALA suppresses JAK1/STAT1/IRF-1 signaling, c-Myc and HIF-1α expression, and GSK3β/mTOR/p70S6K/4EBP1-dependent protein translation, all of which contribute to the reduction in PD-L1 expression. Notably, a crosstalk exists among c-Myc, HIF-1α, and the JAK1/STAT1/IRF-1 signaling pathway. Furthermore, ALA-mediated attenuation of ROS production inhibits STAT1/IRF-1 activation, c-Myc expression, and mTOR-regulated translational processes. Collectively, ALA regulating these interconnected pathways ultimately downregulates PD-L1 expression, thereby enhancing T-cell-mediated tumor cytotoxicity. The arrows indicate activation, and the blunt-ended lines indicate inhibition. The bidirectional arrows indicate a mutual activation. Results are expressed as mean ± S.E.M. &
  p < 0.05 vs. IFN-γ-treated alone cells. *** p < 0.001 vs. IFN-γ- and T-cell-treated alone cells. #
  p < 0.05, ##
  p < 0.01, ###
  p < 0.001 vs. respective groups without T cells
