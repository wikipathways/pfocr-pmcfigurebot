figure_title: Canonical and non-canonical miRNA biogenesis pathways.
caption: Canonical and non-canonical miRNA biogenesis pathways. In the canonical pathway
  of miRNA biogenesis, primary miRNA is processed in a stepwise manner by Drosha/DGCR8
  and Dicer, with Exportin-5 mediating cytoplasmic export, and Argonaute loading the
  guide strand into RISC for mRNA silencing via degradation or translational repression.
  In the non-canonical Dicer-independent route, Ago2 directly cleaves pre-miRNA, bypassing
  Drosha or Dicer steps, to generate a mature RISC complex that mediates gene repression.
  This figure was created using BioRender
