figure_title: Schematic illustration of Doxorubicin-induced senescence, proteolysis,
  and lipid accumulation in C2C12 myoblasts.
caption: Schematic illustration of Doxorubicin-induced senescence, proteolysis, and
  lipid accumulation in C2C12 myoblasts. Doxorubicin inhibits AKT signaling, activating
  FOXO1/3 and increasing MAFbx and MuRF1 to promote proteolysis and impair myogenic
  differentiation. Reduced p-GSK3β stabilizes β-catenin and induces the p53–p21 senescence
  pathway. Concurrent suppression of AMPK decreases ACC phosphorylation and enhances
  lipogenic regulators, including SREBP1, SCD1, and PLIN2, leading to lipid accumulation.
  These coordinated defects in differentiation, senescence, and metabolism contribute
  to Doxorubicin-induced muscle atrophy. AKT, protein kinase B; FOXO, Forkhead box
  O; MAFbx, muscle atrophy F-box; MuRF1, muscle RING finger-1; GSK3β, glycogen synthase
  kinase-3 beta; ACC, acetyl-CoA carboxylase; AMPK, AMP-activated protein kinase;
  SREBP1, sterol regulatory element-binding protein 1; SCD1, stearoyl-CoA desaturase
  1; PLIN2, perilipin 2
article_title: β-Catenin and AMPK/AKT/FOXO Signaling Mediate Doxorubicin-Induced Senescence
