figure_title: A variety of drug targets exert therapeutic effects on MASH by modulating
  key signaling pathways.
caption: 'A variety of drug targets exert therapeutic effects on MASH by modulating
  key signaling pathways. In terms of lipid metabolism regulation, FXR agonists induce
  FGF19 production, which, in turn, activates the FGFR4/β-Klotho complex primarily
  via the ERK1/2 pathway and ultimately inhibits CYP7A1 transcriptional activity.
  ATGL and Elafibranor also downregulate CYP7A1 expression by activating PPARα receptors.
  These mechanisms work together to reduce hepatic lipid deposition. In addition,
  GSK233072 alleviates lipid accumulation by blocking the bile acid transporter ASBT.
  YTP reduces lipid accumulation in the liver by altering intestinal microbial function
  and enhancing BSH activity. At the inflammatory regulatory level, the bile acid
  receptors TGR5 and FXR both inhibit the activation of the inflammatory body NLRP3,
  thereby alleviating the inflammatory response. For example, INT-777, as an agonist
  of TGR5, achieves anti-inflammatory effects by inhibiting NF-kB signaling. TGR5
  activation also promotes GLP-1 secretion and enhances insulin sensitivity, as shown
  by RDX8940. FXR activation inhibits the expression of the profibrotic factor TGF-β1
  in liver fibrosis, while S1PR2 inhibitors mitigate fibrosis by targeting S1PR2 receptors
  and inhibiting downstream PI3K/AKT/mTOR signaling pathways. In terms of energy metabolism
  enhancement, Resmetirom, as a THR-β selective agonist, promotes mitochondrial autophagy
  and enhances mitochondrial biosynthesis, thereby optimizing energy metabolism efficiency.
  These drugs show good potential in MASH therapy by synergistically improving liver–gut
  axis function and comprehensively regulating liver inflammation and lipid metabolism
  homeostasis. This mechanism of action not only exploits the metabolic properties
  of intestinal flora but also promotes the repair of liver tissue and inhibits the
  damage process by intervening in specific molecular signaling networks. Arrow: This
  means that TGR5 promotes GLP-1 secretion, which increases insulin sensitivity'
