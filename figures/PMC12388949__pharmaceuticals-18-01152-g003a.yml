figure_title: The impact of PI3K/AKT/mTOR inhibitors on the phenotypic characteristics
  of RA-FLSs.
caption: 'The impact of PI3K/AKT/mTOR inhibitors on the phenotypic characteristics
  of RA-FLSs. (A–G) Forest plots illustrating the effects of pharmacological inhibition
  of the PI3K/AKT/mTOR signaling pathway on the following phenotypic outcomes: apoptosis
  under stimulation with Semaphorin-5A (A) and TNF-α (B); invasiveness under PDGF
  stimulation (C); proliferative activity under Semaphorin-5A (D) and TNF-α (E); migratory
  potential under stimulation with Semaphorin-5A (F) and PDGF (G). Effect sizes are
  presented as standardized mean differences (Hedges’ g) with 95% confidence intervals
  (CI). (H) Summary table of integrated meta-analytic estimates for all phenotypic
  outcomes, indicating the direction and magnitude of the effect as well as statistical
  significance. The ranges presented reflect the minimum and maximum observed changes
  for each phenotypic parameter among all included studies. Assessment of the certainty
  of evidence was not performed'
