figure_title: Single-cell transcriptomics of non-classical monocytes shows multiple
  alterations driven by key cytokine signaling pathways including TNF, CCL2, and IFNγ.
caption: 'Single-cell transcriptomics of non-classical monocytes shows multiple alterations
  driven by key cytokine signaling pathways including TNF, CCL2, and IFNγ. (A) UMAP
  of non-classical monocytes (cluster 13) within the single-cell data set. (B) Volcano
  plot highlighting some of the differentially expressed genes in GBS patients compared
  to healthy controls. (C) Top 5 significantly enriched pathways as determined by
  PANTHER gene set enrichment analysis of the differentially expressed genes shows
  angiogenesis, blood coagulation (which included complement-associated genes), JAK/STAT
  signaling, CCKR signaling, and IFNγ signaling processes. (D) Analysis of the top
  10 upstream regulators with consistent differentially expressed downstream products
  shows TNF as the top predicted regulator. TNF, CRP, and CCL2 all reached statistical
  significance (P < 0.05). (E) Chord plot shows the differentially expressed genes
  in non-classical monocytes predicted to be regulated by TNF, CCL2, and CRP. (F)
  The directionality and predicted mechanisms of TNF on differentially expressed genes.
  CCL2: C-C chemokine ligand 2; CCKR: cholecystokinin receptor; IFNγ: interferon-gamma;
  JAK: Janus kinase; STAT: signal transducer and activator of transcription; TNF:
  tumor necrosis factor'
