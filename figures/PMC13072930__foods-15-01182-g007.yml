figure_title: Effect of GSO on PI3K–Akt pathway protein expression.
caption: Effect of GSO on PI3K–Akt pathway protein expression. (A) Effects of GSO
  and its co–treatment with the PI3K activator 740Y–P on the activation of the PI3K/Akt
  signaling pathway in cardiac fibroblasts (CFs). (B) Effects of GSO and its co-treatment
  with 740Y–P on the expression of fibrotic marker proteins. (C) Effects of GSO and
  its co-treatment with 740Y-P on the mRNA expression levels of fibrosis–related genes.
  Data are presented as mean ± standard deviation (SD) (n = 3). * p < 0.05, ** p <
  0.01, *** p < 0.001 compared to the Control group
