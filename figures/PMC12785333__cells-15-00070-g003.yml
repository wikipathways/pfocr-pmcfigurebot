figure_title: (A) The ESCRT-dependent exosome biogenesis starts with ubiquitinylated
  proteins that interact with the ESCRT-0 complex, comprising Vps27 (TSG101) and STAM.
caption: (A) The ESCRT-dependent exosome biogenesis starts with ubiquitinylated proteins
  that interact with the ESCRT-0 complex, comprising Vps27 (TSG101) and STAM. The
  ESCRT-0 complex is anchored to the endosomal membrane via the FYVE domains interacting
  with phosphatidyl-inositol-3-phosphate (PI3P). ESCRT-0 complex favors the interaction
  with the heterotetrameric ESCRT-I complex, which tethers the ESCRT-II complex. The
  ESCRT-II complex comprises the Vps36 protein that interacts with the ESCRT-I complex,
  and two Vps25 proteins. Vps25 binds the Vps20 protein of the ESCRT-III complex,
  serving as a primer for Snf7 polymerization. Upon its polymerization in a folded
  helix, the membrane presents a negative curvature that accentuates, leading to membrane
  budding and intraluminal vesicle formation. After vesicle release, Snf7 depolymerization
  occurs in the presence of Vps4, an AAA ATPase that generates the energy required
  for Snf7 depolymerization. Created in BioRender. Tirziu, A. (2025), https://BioRender.com/sylgtyo
  (accessed on 29 December 2025). (B) The syndecan–syntenin–ALIX pathway for exosomal
  biogenesis starts by the interaction of the intracytoplasmatic domains of syndecans
  with syntenin via the PDZ domains. Syntenin tethers ALIX, which interacts with TSG101,
  or with the CHMP4B protein of the ESCRT-III complex, leading to Snf7 polymerization
  and membrane budding. Created in BioRender. Tirziu, A. (2025), https://BioRender.com/1e4x1fz
  (accessed on 29 December 2025). (C) The ceramide pathway involves the hydrolysis
  of endosomal membrane sphingomyelin to ceramide by the acidic sphingomyelinase.
  The cone-shaped ceramide induces a negative membrane curvature, leading to membrane
  budding and ILV formation. The PLD2 pathway involves the action of phospholipase
  D2 activated by the Arf6 GTP-ase, which converts the endosomal phosphatidylcholine
  to phosphatidic acid, generating a negative membrane curvature. Created in BioRender.
  Tirziu, A. (2025), https://BioRender.com/vhxopci (accessed on 29 December 2025).
  (D) The tetraspanin pathway involves the transmembrane, cone-shaped proteins CD9,
  CD63, CD81 that generate a negative membrane curvature. Created in BioRender. Tirziu,
  A. (2025), https://BioRender.com/isbe9s1 (accessed on 29 December 2025)
