figure_title: Global upregulation of ciliary pathways in Upf2cKO cortex
caption: '(A) Bar plot of pathway enrichment analysis for DEGs identified between
  control and Emx1-Upf2cKO bulk RNA-seq samples.(B) GSEA plot of cilium movement signature
  (GO: 0003341) in the Upf2cKO transcriptome.(C) Venn diagram of upregulated genes
  identified in bulk RNA-seq, cilium-related genes from GO terms, and genes exhibiting
  significant UPF1 eCLIP-seq peaks in NPCs.(D) Bar plot of fold-change of the 19 high-confidence
  NMD-targeted ciliary genes. Magenta bars represent genes with log2 fold change greater
  than 1. Magenta arrowhead indicates Foxj1, a master transcriptional regulator of
  ciliary genes. Asterisks indicate genes harboring >1 kb 3′ UTRs.(E) Density plot
  of 3′ UTR length for high-confidence NMD-targeted ciliary genes and other genes.
  Solid and dashed lines indicate the mean and median length, respectively, for each
  category.(F) GSEA plot of top 244 FOXJ1 coexpressed genes in the GTEx dataset in
  the Upf2cKO transcriptome.(G) Dot plot representing the differential expression
  of 19 high-confidence NMD-targeted ciliary genes and the top 20 upregulated ciliary
  genes without UPF1 eCLIP-seq peaks in each cluster. The color and dot size represent
  log2 fold change and adjusted p, respectively.(H) Bar plot of the number of upregulated
  and downregulated ciliary genes showing upregulation in bulk RNA-seq data in each
  neuronal cluster.(I–K) PHATE plots of single-nucleus RNA-seq data colored by (I)
  genotype (control and Emx1-Upf2cKO), (J) neuronal clusters, and (K) neuronal cell
  types. Magenta circles indicate an ependymal cluster composed of cells of the Upf2cKO
  sample. Black arrows represent potential cell trajectories from RGC to Exc and Inh.
  A magenta arrow indicates a potential trajectory from RGC to Ependymal.See also
  Figures S7, S8, S9, and S10'
