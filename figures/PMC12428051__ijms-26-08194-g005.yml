figure_title: Apelin receptor system plays a role in hypertension, heart failure,
  and myocardial infarction.
caption: 'Apelin receptor system plays a role in hypertension, heart failure, and
  myocardial infarction. In hypertension, acting through nitric oxide or prostanoids,
  it promotes vasodilation, which in turn lowers vascular resistance and blood pressure.
  It facilitates its inotropic effect on cardiomyocytes through ERK1/2, phospholipase
  C, and protein kinase pathways, inducing cardiomyocyte sensitivity to calcium by
  inhibiting troponin I phosphorylation and activation of myosyne light chain kinase.
  In myocardial infarction, apelin inhibits PAI-1, and reduces NO-cylic guanosine
  monophosphate, both of which improve blood flow. ERK1/2: extracellular signal-regulated
  kinase 1/2; PAI-1: plasminogen activator inhibitor-1; ↑ increase; ↓ decrease'
