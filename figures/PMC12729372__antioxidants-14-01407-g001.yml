caption: Proposed mechanisms underlying the pathogenesis of inflammatory bowel disease.
  Genetic susceptibility (risk variants affecting immune regulation, epithelial barrier
  genes, and redox-related genes), immune dysregulation (overactivation of innate
  and adaptive immunity), environmental factors (diet, smoking, medications, early-life
  exposures), and intestinal dysbiosis (altered gut microbiota composition and microbial
  metabolites) converge to induce epigenetic and molecular alterations (DNA methylation,
  histone modifications, and microRNA regulation). These processes drive persistent
  immune activation and epithelial dysfunction, ultimately leading to IBD development.
  The downstream cycle includes barrier disruption, oxidative stress imbalance, and
  chronic inflammation. Barrier injury promotes microbial translocation; oxidative
  stress—characterized by increased ROS (reactive oxygen species) and reduced antioxidants—amplifies
  cytokine signaling via NF-κB (nuclear factor kappa-light-chain-enhancer of activated
  B cells) and MAPK (mitogen-activated protein kinase) pathways, while inadequate
  antioxidant defenses impair tissue repair
