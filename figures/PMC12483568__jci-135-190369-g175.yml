figure_title: IL-17a blockade prevents skin calcification and inflammation in the
  DHT+FeCl3–induced rat model
caption: '(A) Immunofluorescence staining and quantification of IL-17a+ cells in skin
  tissue from rats treated with DHT p.o. + FeCl3 s.c. or vehicle p.o. + H2O s.c. (representative
  images; n = 5 animals per group). Scale bar: 50 μm. (B) Schematic of the IL-17a
  mAb experimental timeline. (C) Gross images of dorsal skin lesions. Black arrowheads
  show visible regions of calcification. (D) Representative von Kossa–stained images
  of rat dermal tissue highlighting calcified regions (arrowheads). Quantification
  of calcified percentage in the IL-17a mAb–treated group (n = 12) compared with IgG
  control (n = 8). (E) Top 5 KEGG pathways enriched in DEGs between IgG-treated (n
  = 3 animals) and IL-17a mAb–treated rats following DHT p.o. + FeCl3 s.c. (n = 3
  animals). (F) Enriched genes in IL-17 signaling pathway. Data are represented as
  mean ± SEM. ***P < 0.001, 2-tailed Student’s t test'
article_title: Pharmacological targeting of the IL-17/neutrophil axis attenuates calcific
  deposits in rat models of calciphylaxis
