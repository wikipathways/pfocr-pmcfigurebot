figure_title: The STING structure and the mechanism of STING agonists in GBM treatment.
caption: 'The STING structure and the mechanism of STING agonists in GBM treatment.
  STING has a defined ligand-binding domain (LBD) in its C-terminal cytosolic head,
  which can be recognized by STING agonists. When binding with LBD, STING agonists
  induce conformational changes in STING, shifting it into an active state. Both cyclic
  dinucleotide (CDN) agonists (e.g., c-di-GMP, ADU-S100, IACS-8779, and IACS-8803)
  and non-nucleotide small-molecule agonists (e.g., diABZI, SR-717, ASA404) activate
  the STING pathway to trigger a proinflammatory response. This activation promotes
  immune cell remodeling and initiates anti-tumor immunity. DC(s): dendritic cell(s);
  TAMs: tumor-associated macrophages; NK cells: natural killer cells; CTLs: cytotoxic
  T lymphocytes; TAMCs: tumor-associated myeloid Cells; PFS: Progression-Free Survival;
  OS: Overall Survival'
