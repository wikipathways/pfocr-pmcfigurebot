figure_title: Thermogenic signal shifts in BAT versus quadriceps muscle and metabolic
  consequences in old-age mice.
caption: 'Thermogenic signal shifts in BAT versus quadriceps muscle and metabolic
  consequences in old-age mice. (a) Pathway for linoleate (LA)-derived oxylipins to
  12,13-DiHOME and tissue levels of 12,13-DiHOME between young and old mice in BAT,
  VAT and quadricep muscle. Dots: individual animals; horizontal lines: median; q
  values: FDR-adjusted p-values. (b) Violin plots of dicarboxylic acids levels in
  quadricep muscle of young and old mice. Dots: individual animals; horizontal lines:
  median; q values: FDR-adjusted p-values. (c) Heat map of log2-fold changes (FC)
  between old and young mice for carbohydrate, ketone, and amino acids and TCA cycle.
  EAA: essential amino acid; BCAA: branched chain amino acid; NEAA: non-essential
  amino acid; AA: amino acid (raw p<0.05). × denotes not detected. (d) β-hydroxybutyrate
  (BHB) levels in quadriceps muscle and BAT of young and old mice. q values: FDR-adjusted
  p-values. (e) Amino acid residue-level radar plots for peptide regulation in quadriceps
  muscle (left) and BAT (right). For each amino acid residue, values (%) indicate
  the proportion of detected di/tri-peptides containing that residue that were significantly
  up- or down-regulated (raw p<0.05). (f–i) Oxidative stress biomarkers levels in
  quadriceps muscle of young and old mice. (f) inosine/inosine monophosphate (IMP)
  ratio; (g) hypoxanthine/xanthine ratio; (h)oxidized glutathione/glutathione ratio
  (GSSG/GSH); (i) 18-hydroxylinoleic acid (18-HODE) levels. Dots: individual animals;
  horizontal lines: median; q values: FDR-adjusted p-values'
