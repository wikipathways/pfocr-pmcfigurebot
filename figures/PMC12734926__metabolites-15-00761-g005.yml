figure_title: The hepatocyte-specific ApoJ knockout alters hepatic metabolites and
  reshapes metabolite-related pathways in the T2DM-associated steatotic liver.
caption: The hepatocyte-specific ApoJ knockout alters hepatic metabolites and reshapes
  metabolite-related pathways in the T2DM-associated steatotic liver. In T2DM, insulin
  resistance promotes hepatic lipid accumulation, leading to steatosis. The excessive
  production of metabolites such as lysophosphatidic acid [7], galactosamine [8],
  glutamine [9], methionine [10], cysteine [11], tauroursodeoxycholic acid (TUDCA)
  [12], along with their derivatives, disrupts hepatic metabolic balance within steatotic
  hepatocytes. These metabolites influence both parenchymal and non-parenchymal liver
  cells, amplifying hepatic stress responses including lipotoxicity, oxidative stress,
  cell death, and inflammation. In contrast, HKO appears to restore metabolic equilibrium
  and attenuate these stress responses. Therefore, HKO may contribute to the re-establishment
  of hepatic inflammatory homeostasis by reshaping dysregulated metabolic pathways.
  Upregulated metabolites and pathways are indicated in red, while downregulated metabolites
  and pathways are indicated in green
article_title: Hepatocyte-Specific ApoJ Knockout Improves Metabolic Profiles in the
