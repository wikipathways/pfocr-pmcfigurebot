figure_title: Elongation Complex in the Presence of eEF2
caption: (A) Cryo-EM structure of a fully elongation complex, captured from the termination
  setup. This state contains a translocated P-site tRNA (dodger blue), an E-site tRNA
  (teal), and eEF2 (crimson). This class represents the transition from IRES-mediated
  initiation to canonical elongation. (B) and (C) Focused views of the complex in
  (A). Panel (B) shows the cryo-EM map, and (C) shows the atomic model, highlighting
  the arrangement of eEF2 and the two tRNAs. Notably, the P-site tRNA is well-resolved
  only at its lower half, while the off-pathway E-site tRNA is exceptionally stable,
  reflecting the strength of the stable occupation of the E site. (D) and (E) Comparative
  analysis of the tRNAs in the E and P sites. These panels highlight the unusually
  close proximity between the P-site and E-site tRNAs, with their backbones nearing
  a steric clash, a novel observation in eukaryotic elongation complexes. (F) A comparative
  analysis of the eEF2 conformation in our canonical complex versus the POST-3 state
  (PDB ID 6GZ5)
