figure_title: Role of the FoxO signaling pathway in pc-SLC2A4-induced changes in HG-induced
  HTR-8/SVneo cells.
caption: 'Role of the FoxO signaling pathway in pc-SLC2A4-induced changes in HG-induced
  HTR-8/SVneo cells. (A) Screen of targeted pathways related to gestational diabetes
  mellitus and SLC2A4 (five common genes identified through the CTD/GeneCards/DisGeNet
  database) using Kyoto Encyclopedia of Genes and Genomes, suggesting a critical role
  for FoxO signaling pathway. (B) The expression levels of p-FoxO1, FoxO1, p-FoxO3a
  and FoxO3a were analyzed by western blotting, GAPDH was used as the internal control
  for the results. The expression of INS and INSR was analyzed by (C) reverse transcription-quantitative
  PCR and (D) western blotting. (E) Glucose uptake was detected by glucose uptake
  assay. (F) Cell viability was measured using a Cell Counting Kit-8 assay. ***P<0.001
  vs. Control; nsP>0.05 vs. HG; ###P<0.001 vs. HG + pc-NC; $P<0.05, $$P<0.01 and $$$P<0.001
  vs. HG + pc-SLC2A4. SLC2A4, solute carrier family 2 member 4; HG, high glucose;
  ns, not significant; NC, negative control; OD, optical density; INS, insulin; INSR,
  INS receptor; p, phosphorylated; FoxO, Forkhead box O'
