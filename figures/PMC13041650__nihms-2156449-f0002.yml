figure_title: Functional interplay between Prdx6 and selenoproteins in intracellular
  selenium handling and ferroptosis prevention
caption: 'Beyond its established trifunctional enzymatic activities, Prdx6 functionally
  cooperates with the selenoprotein biosynthesis machinery to support cellular redox
  homeostasis. (A) In the inorganic selenium pathway, intracellular selenium may interact
  with Prdx6 at the active-site cysteine in a glutathione-dependent manner, forming
  a transient Prdx6–selenium complex that contributes to selenium availability for
  selenoprotein synthesis, including GPx4. (B) In the organic selenium pathway, selenium
  released via the selenocysteine lyase pathway is utilized by selenophosphate synthetase
  2 for selenoprotein biosynthesis. Through this coordinated process, Prdx6 indirectly
  supports GPx4 function and limits ferroptotic cell death. Prdx6 deficiency is associated
  with reduced expression and activity of selenoproteins, resulting in increased susceptibility
  to lipid peroxidation–driven cell death.Abbreviations: Prdx6, peroxiredoxin 6; GPx4,
  glutathione peroxidase 4; GSH, glutathione; PLOOH, phospholipid hydroperoxide; PLOO·,
  lipid peroxyl radical; SCLY, selenocysteine lyase'
