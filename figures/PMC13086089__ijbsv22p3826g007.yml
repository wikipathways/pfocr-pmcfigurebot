figure_title: Inhibiting the SphK1/S1P/S1PR2 pathway impedes M1 macrophage polarization
  and alleviates inflammation in AP mice.
caption: 'Inhibiting the SphK1/S1P/S1PR2 pathway impedes M1 macrophage polarization
  and alleviates inflammation in AP mice. The activity of SphK1 and S1PR2 of AP mice
  was inhibited by intraperitoneal injection of PF-543 and JTE-013 respectively. (A)
  Representative images of H&E staining in the pancreatic tissues of AP mice (n=4).
  Scale bar: 100 μm. (B) The expression of F4/80 and CD86 in the pancreatic tissues
  of AP mice were evaluated by IHC (n=6). Scale bar: 100 μm. (C) The mRNA levels of
  CD86, iNOS, and TNF-α in the pancreatic tissues of AP mice were determined by RT-qPCR.
  (D) The protein levels of CD86 and iNOS in the pancreatic tissues of AP mice were
  analyzed by Western blot. (E-F) The serum levels of TNF-α and IL-1β were measured
  by ELISA in AP mice. (G) Schematic diagram of iPACs induced M1 polarization of macrophage
  via SphK1/S1P signaling during AP. *P <0.05; **P <0.01; ***P <0.001; NS, no significance'
