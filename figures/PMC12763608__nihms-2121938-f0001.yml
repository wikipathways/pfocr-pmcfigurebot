figure_title: Study overview
caption: 'This study analyzed proteomic data from cognitively normal individuals across
  multiple cohorts, including the Knight Alzheimer Disease Research Center (Knight-ADRC),
  Alzheimer’s Disease Neuroimaging Initiative (ADNI), Fundació ACE (FACE), and Emory
  Diversity cohorts. To identify CSF proteomic changes by age, sex, APOE, and amyloid
  status, analysis was performed in three stages: 1) discovery stage in the Knight-ADRC
  cohort; 2) replication stage in the combined set of ADNI and FACE (N = 334); and
  3) orthogonal validation in Emory (N = 101). We also compared results with a previous
  study by Wesenhagen, et al.23. Network-based analyses were performed including WGCNA,
  disease enrichment, pathway and cell-type specificity, and progression analysis.
  Finally, plasma proteomic analysis was performed with Knight-ADRC along with aging
  clocks in both CSF and plasma.Abbreviations: WGCNA, Weighted Correlation Network
  Analysis'
article_title: Cerebrospinal fluid proteomic signatures in cognitively normal individuals
  identify distinct clusters linked to neurodegeneration
