figure_title: Drugs targeting the SPTAN1/RAF1/SOCE pathway modulate shear stress-mediated
  IL8 expression
caption: '(A) Schematic of drug treatment experiments. Whole blood from healthy donors
  (n = 3) was incubated in 6-well suspension culture plates with 5 μM sorafenib, 1
  μM BVD-523, 5 μM CM-4620, or DMSO control for 1 h prior to being sheared for 2 h.
  DMSO-treated blood samples under static conditions were used as controls. PBMCs
  were isolated for scRNA-seq.(B) UMAP plot for cell clustering and cell type annotation
  of 136,216 PBMCs from 16 samples based upon scRNA-seq, with 11 distinct cell types
  annotated.(C) Feature maps of IL8 expression in classical monocytes across five
  conditions: static, shear stress, sorafenib + shear, BVD-523 + shear, and CM-4620
  + shear, respectively.(D) Violin plot showing that IL8 expression was upregulated
  over 5.4-fold under shear stress conditions in classical monocytes compared to static
  conditions (adjusted p = 3.75 × 10−62).(E) Violin plot showing that the drug sorafenib
  upregulates IL8 expression in monocytes by 2-fold under shear stress conditions
  as compared to DMSO-sheared samples (adjusted p = 0.01).(F and G) Violin plots show
  that BVD-523 and CM-4620 downregulated shear stress-induced IL8 expression in monocytes
  by 29.8% (adjusted p = 0.0001) and 35.4% (adjusted p = 1.16 × 10−18), respectively,
  as compared to DMSO sheared samples.(H) Top 5 GO terms of functional enrichment
  results using 295 DEGs (adjusted p < 0.05) identified in classical monocytes with
  BVD-523 treatment compared to DMSO shear stress conditions.(I) Top 5 GO terms of
  functional enrichment results using 173 DEGs (adjusted p < 0.05) identified in classical
  monocytes with CM-4620 treatment compared to DMSO shear stress conditions'
article_title: A shear stress-responsive pathway in monocytes drives cardiopulmonary
  bypass-induced inflammation via spectrin/RAF1/store-operated calcium entry
