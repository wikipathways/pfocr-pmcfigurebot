figure_title: Discrepant activation of NF-κB signaling pathway following EV treatments.
caption: 'Discrepant activation of NF-κB signaling pathway following EV treatments.
  Microglia were treated with PBS or EVs derived from NPCs or mesencephalic neurons
  for 1 h (A,C) or 2 h (B). Whole-cell lysates were subjected to Western blotting
  using antibodies specific for total/phosphorylated (Ser 32) IκBα (A) or total/phosphorylated
  (Ser 468 and 536) NF-κB p65 (C). (B) After EV treatments, microglia were fixed and
  immunostained using anti-p65 antibody followed by counterstaining with DAPI. Representative
  confocal images are shown. The p65 fluorescence intensities in the nucleus were
  determined by image analysis. Scale bar = 10 μm. Data are presented as mean ± SEM
  for three independent experiments. Data were analyzed by one-way ANOVA followed
  by Scheffe’s post hoc test. * p < 0.05; ** p < 0.01 compared with control. # p <
  0.05; ## p < 0.01 compared with NPC EVs. (D) Microglia were pretreated with BAY
  11-7082 (an IκBα phosphorylation inhibitor, 2 μM) for 1 h prior to stimulation with
  NPC- or immature neuron-derived EVs for another 10 h (TNF-α) or 24 h (IL-1β and
  IL-6). Released cytokines were measured by ELISA. Data are presented as mean ± SEM
  for three independent experiments. Data were analyzed by paired t-test. ** p < 0.01
  compared with control'
