figure_title: Downregulating effect of galangin against PM2.
caption: 'Downregulating effect of galangin against PM2.5-induced MAPK signaling pathway.
  (A) Phospho-MEK1/2, phospho-ERK, (B) phospho-SEK1, phospho-JNK, and (C) phospho-p38
  in HaCaT cell lysates were analyzed using western blotting. MEK1/2, ERK, SEK1, JNK,
  and p38 were used as loading control. (D) Cell apoptosis level was analyzed using
  Hoechst 33342 staining, with arrows indicating apoptotic cells. (E) Cell viability
  was assessed using the MTT assay. (D, E) *p < 0.05, #p < 0.05, ##p < 0.05 versus
  control, PM2.5 and galangin+PM2.5. MEK1/2, mitogen-activated protein kinase kinase;
  ERK, extracellular signal-regulated kinase; SEK1, stress activated protein kinase
  (SAPK)/ERK kinase-1; JNK, c-Jun N-terminal kinase; PM2.5, particulate matter 2.5;
  MTT, 3-(4,5-dimethylthiazol-2-yl)-2,5-diphenyltetrazolium bromide'
