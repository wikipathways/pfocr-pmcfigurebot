figure_title: Mitochondrial Uncoupling and Hypoxia as Core Drivers of Adipocyte Dysfunction
  in Obesity.
caption: Mitochondrial Uncoupling and Hypoxia as Core Drivers of Adipocyte Dysfunction
  in Obesity. In lean adipose tissue, adipocytes are well oxygenated by the surrounding
  vasculature, allowing efficient coupled mitochondrial respiration. Protons are pumped
  from the mitochondrial matrix into the intermembrane space, generating the membrane
  potential required for ATP synthesis. Under these conditions, the adenine nucleotide
  translocase ANT2 remains minimally active, limiting proton leak and maintaining
  tightly coupled respiration—a metabolic state that preserves normal insulin sensitivity.
  In obesity, however, ANT2 activity increases, driving proton leak back into the
  mitochondrial matrix. This shift enhances uncoupled respiration, reduces mitochondrial
  membrane potential, and elevates oxygen demand despite a progressively inadequate
  oxygen supply. The resulting local hypoxia activates HIF1α, which in turn induces
  fibro-inflammatory gene programs and promotes metabolic reprogramming. Although
  initially adaptive, chronic activation of this pathway compromises adipocyte plasticity
  and accelerates tissue dysfunction. The persistent mismatch between oxygen availability
  and oxygen consumption triggers mitochondrial stress and fosters a fibro-inflammatory
  environment, ultimately contributing to insulin resistance, a defining feature of
  metabolic dysfunction in obese adipose tissue. FFA, free fatty acids; pO2, partial
  pressure of oxygen; HIF-1α, hypoxia-inducible factor 1 alpha; ROS, reactive oxygen
  species; ANT2, adenine nucleotide translocase 2; LDH, lactate dehydrogenase; GLS,
  glutaminase; TNFα, tumor necrosis factor alpha; IL-6, interleukin 6; MCP-1, monocyte
  chemoattractant protein 1 (CCL2). Created in BioRender. Lec, S. (2026) https://BioRender.com/mzxbcnh.
  (accessed on 2 January 2025)
