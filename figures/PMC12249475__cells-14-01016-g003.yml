figure_title: The functional domains of the p62 protein.
caption: The functional domains of the p62 protein. This figure illustrates the different
  domains of p62 and the proteins interacting with them, as well as the important
  functions of these domains. The PB1 domain at the N-terminal of p62 interacts with
  proteins containing the PB1 domain to promote the formation of homologous or heterologous
  aggregates. Moreover, the PB1 domain interacts with αPKC, MEKK3, ERK1, and NBR1,
  thereby controlling important physiological processes, such as the NF-kB pathway,
  mTORC1 activation, and adipogenesis. The ZZ domain, an atypical zinc finger, binds
  to RIP kinase to activate the NF-κB pathway. The TB domain interacts with the E3
  ubiquitin ligase TRAF6 and thereby regulates the NF-κB pathway. The region between
  the ZZ and TB domains contains the binding site for the subunit Raptor of the mTORC1
  complex, the nuclear localization signals (NLS1/2) and the nuclear export signals
  (NESs) mediate the nuclear-cytoplasmic shuttling of p62, and the autophagy marker
  LC3II recognizes and binds to p62 through the LIR domain to promote the formation
  of autophagosomes. KIR, the Keap-interacting region, binds to the E3 ubiquitin ligase
  Keap1, thereby activating Nrf2 to cope with oxidative stress. The C-terminal UBA
  domain is an important region for p62 to bind to ubiquitinated proteins for autophagic
  degradation. P62 mediates the autophagic degradation of ubiquitinated proteins through
  the LIR and UBA domains
