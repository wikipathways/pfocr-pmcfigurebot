figure_title: Mechanisms of photoreceptor degeneration.
caption: 'Mechanisms of photoreceptor degeneration. Part 1: CCL2-CCR2 axis: CCL2 recruits
  CCR2+ monocytes/microglia to sites of retinal injury. Infiltrating cells release
  proinflammatory cytokines, driving RPE and photoreceptor degeneration. Müller cell
  activation amplifies this cascade through CCL2 production, establishing a feedforward
  inflammatory loop. Part 2: mTORC1 pathway: mTORC1 hyperactivity contributes to drusen-like
  deposit formation, disrupting RPE-photoreceptor metabolic exchange and accelerating
  AMD progression. Abbreviations: AMD, age-related macular degeneration; CCL2, C-C
  motif chemokine ligand 2; CCR2, C-C chemokine receptor type 2; HIF1-α, hypoxia-inducible
  factor 1-alpha; mTORC1, mechanistic target of rapamycin complex 1; RPE, retinal
  pigment epithelium; SREBP2, sterol regulatory element-binding protein 2'
