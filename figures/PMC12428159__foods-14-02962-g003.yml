caption: Effect of SCP intervention on cecal content metabolites between SCP and Control
  groups. (A) Volcano plots of altered metabolites with p < 0.05 and |log2FC| > 1.2
  between Control and SCP groups (n = 6); (B) partial least squares discriminant (PLS-DA)
  analysis; (C) differences in KEGG functional pathways; (D) KEGG enrichment pathway
  analysis; (E) VIP bar graph. The top 30 differential metabolites were identified
  between SCP and Control groups. On the far right of the picture is the p value.
  * p < 0.05, ** p < 0.01 and *** p < 0.001 indicated significant correlation
