caption: 'Mass spectrometry and bioinformatic analysis of Kelly and KellyCis83 sEVs:
  (A) bioinformatics workflow for sEV proteomics analysis in Kelly and KellyCis83
  cells; (B) gene set enrichment analysis using the Gene Ontology: Biological Processes
  (GO: BP) and (C) Pathway Commons databases. The colour gradient indicates the –log10-adjusted
  p value, and the x-axis indicates the normalised enrichment score (NES). Significant
  pathways (p < 0.05) are grouped based on the higher-level classifications, and the
  top 10 most significant are visualised. (D) Heatmap of normalised LFQ intensities
  of proteins that contributed to significant glycolysis enrichment. A darker orange
  colour indicates higher protein abundance. Individual proteins were not differentially
  abundant in KellyCis83 sEVs; (E) volcano plot displaying differential abundance
  of KellyCis83 and Kelly sEV proteins (adjusted p < 0.05, absolute fold change >
  1.5)'
