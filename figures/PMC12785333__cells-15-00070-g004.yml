figure_title: Molecular composition of CAR-T cell-derived exosomes.
caption: Molecular composition of CAR-T cell-derived exosomes. The exosomal surface
  displays the chimeric antigen receptor (CAR) responsible for tumor antigen recognition,
  along with key adhesion and signaling molecules including CD2, LFA-1 (lymphocyte
  function-associated antigen-1), and CXCR4 chemokine receptor, facilitating cellular
  interaction and migration. The exosome membrane also expresses the pro-apoptotic
  Apo2L and FasL ligands, major histocompatibility complex class I (MHC I) molecules
  for antigen presentation, and tetraspanins CD9, CD63, and CD81 for exosome biogenesis
  and cargo sorting. Internal cargo includes cytotoxic effector proteins granzyme
  A/B and perforin, which mediate target cell lysis. Associated signaling kinases
  Lck and Fyn phosphorylate downstream targets to promote activation. The exosomes
  carry microRNAs (miRNAs) such as miR-155 and miR-146a that activate TLR/NF-κB pathways,
  miR-181 and let-7a that regulate T cell differentiation and activation, and miR-15,
  miR-16, and miR-92 involved in lipid/glucose metabolism and mitochondrial function,
  contributing to T cell proliferation and survival. Therapeutic drug loading cargo
  such as paclitaxel, RN7SL1, and miR-34a highlight the potential of CAR-T Exos as
  delivery vehicles. Created in BioRender. Tirziu, A. (2025), https://BioRender.com/n137ly7
  (accessed on 29 December 2025) [84,201,202]
