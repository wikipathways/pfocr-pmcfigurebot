figure_title: The upregulated inflammatory pathways and markers in myeloid cells with
  WP1066 treatment
caption: (A) Gene set enrichment analysis was performed to calculate the enrichment
  of the inflammatory pathway gene set in myeloid cells across time points. Gene sets
  were obtained from the MSigDB collection. Wilcoxon’s rank sum tests were used to
  compare enrichment scores among cells from C1D1 versus C1D8 and C1D8 versus C2D1
  time points. Cell counts are shown in the figure legend. ****P < 0.0001. (B) Differential
  expression analysis was performed to identify genes significantly changing in expression
  in myeloid cells between C1D1 and C1D8 time points. Genes increasing after treatment
  (UP @ C1D8, orange) and decreasing after treatment (UP @ C1D1, gold) were identified
  based on the adjusted P value and average log2(fold change) [log2(FC)] results [adjusted
  P value < 0.05, |average log2(FC)| > 0.5]. DEG, differentially expressed gene
