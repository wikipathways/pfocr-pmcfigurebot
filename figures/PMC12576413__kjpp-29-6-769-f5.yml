figure_title: Fimepinostat acts on glioblastoma cells
caption: via Akt/c-MYC pathway. (A) Western blot analysis of p-Akt, Akt, c-Myc, and
  β-actin in T98G and U251 glioblastoma cells treated with fimepinostat at concentrations
  of 0, 5, 50, and 500 nM. β-actin was used as a loading control. (B) MYC transcriptional
  activity was measured in T98G and U251 cells treated with increasing concentrations
  of fimepinostat. Data are presented as MYC activity relative to the control (0 nM
  fimepinostat). (C) Annexin V assay showing the percentage of apoptotic cells in
  T98G and U251 cells treated with 500 nM fimepinostat, with or without MYC overexpression.
  Data are expressed as mean ± SD from three independent experiments. *p < 0.05 compared
  to the control group
article_title: Fimepinostat is a dual inhibitor of tumor and angiogenesis in glioblastoma
  and synergizes with temozolomide through suppressing MYC
