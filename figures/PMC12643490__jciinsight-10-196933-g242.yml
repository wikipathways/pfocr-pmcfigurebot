figure_title: Pathway analysis implicates the TGFB signaling network in altered ECM
  composition in the myocardium of individuals with end-stage failing ICM
caption: (A) Heatmap of agglomerated Z-scores for KEGG pathway terms across samples
  showing upregulation of pathways related to focal adhesions and ECM-receptor interactions.
  In addition, these changes are accompanied by increased regulation of the cytoskeleton
  and decreased expression of metabolic and contractile proteins. Term changes are
  visualized for the ECM-enriched extract. (B) Term-protein network generated using
  input data from both extracts demonstrates connections between pathways via specific
  proteins. In general, adhesive glycoproteins (thrombospondins, tenascins, fibronectin,
  vitronectin) and proteoglycans (decorin) connect receptor processes to focal adhesion
  and regulation by protein digestion and TGFB pathways
