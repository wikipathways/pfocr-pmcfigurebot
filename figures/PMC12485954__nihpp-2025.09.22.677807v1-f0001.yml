figure_title: A gain of function ERK2 mutant promotes EMT and altered cell metabolism
caption: a, Schematic of an inducible ERK2D319N driven EMT model. b, Brightfield images
  of MCF10A cells expressing vector control, ERK2 wild type (WT) or mutants (Y261A,
  D319N) in response to 250 ng/ml doxycycline over 9 days. c, Groups of differentially
  expressed gene transcripts collected from cells grown as in b, plots show clustering
  analyses using k-nearest neighbors (kNN) of statistically significant expression
  changes. d, As in c, but for differentially expressed proteins. e, Enrichment analysis
  of clusters shown in c. f, Enrichment analysis of clusters shown in d. g, Enrichment
  analysis of differentially expressed metabolites. h, Joint transcript and metabolite
  pathway analysis of those with increased or decreased expression. i, Glycolysis
  stress test profile indicating changes to the extracellular acidification rate (ECAR)
  of control and ERK2D319N expressing cells on day 3, (n ≥ 10). j, Mitochondrial stress
  test profile indicating changes to the oxygen consumption rate (OCR) of control
  and ERK2D319N expressing cells on day 3, (n ≥ 10)
