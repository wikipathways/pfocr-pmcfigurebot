figure_title: Dose- and time- dependency of the HUVEC transcriptomes on IR.
caption: Dose- and time- dependency of the HUVEC transcriptomes on IR. HUVECs were
  exposed to 2 or 5 Gy IR, and RNA was isolated and sequenced at 24 or 72 h after
  IR. The global transcriptomic profiles of irradiated samples were compared with
  their corresponding controls (no IR) and across experimental conditions (dose and
  time after the exposure). (a) Heatmap presenting unsupervised hierarchical clustering
  of all genes across control and irradiated samples. Gene expression values were
  normalized and scaled to Z-scores to highlight relative expression changes. (b)
  Bar plot presenting the number of significantly differentially expressed genes in
  each comparison. Adjusted p-value of <0.05 and fold change (FC) of >1.5 (up-regulation)
  or FC of <0.67 (down-regulation) were considered as significance thresholds. (c,d)
  Venn diagrams presenting number of significantly enriched pathways identified by
  KEGG analysis shared between samples analyzed at 24 and 72 h after 2 Gy (c) and
  5 Gy (d) (See Supplementary Tables S1 and S2). Enrichment was considered statistically
  significant at p-values of <0.05. n = 5 per group. KEGG—Functional Kyoto Encyclopedia
  of Genes and Genomes
