caption: 'Metformin’s modulation of the TME: Metformin influences components of the
  CRC TME by interacting with cancer cells, immune cells (neutrophils, T cells), and
  stromal cells. Metformin has specific immune-modulatory effects, including the inhibition
  (red) of neutrophil extracellular trap (NET) formation. The CD39/CD73 axis generates
  immunosuppressive adenosine, which suppresses antitumor immunity, and metformin
  can modulate/counteract (red) this pathway to potentially enhance antitumor immunity.
  Metformin also influences metabolic reprogramming within the TME. Enhanced (green)
  antitumor immunity can then inhibit CRC cells'
