figure_title: Flexible Na+ sweat sensor system and performance validation.
caption: Flexible Na+ sweat sensor system and performance validation. (a) Layer schematic
  of the sensor. (b) Signal stability under bending. (c) Selectivity for Na+. (d)
  On-body cycling test with wireless prototype. (e) Real-time Na+ and heart rate monitoring.
  (Reproduced from [104] with permission from ACS Publications). This figure demonstrates
  a full validation pathway, integrating design, mechanical robustness, analytical
  specificity, and on-body performance. The real-time data (d,e) confirm the sensor’s
  capability to correlate biochemical and physiological metrics, establishing a benchmark
  for wearable biosensor maturity beyond sensitivity or LOD. (Reproduced from [105]
  with permission from ACS Publications)
