figure_title: Fatty acid oxidation (FAO) is the most significantly transcriptionally
  downregulated mitochondrial process in AEC2 with 60% compared to 10% fat diet after
  hyperoxia, and high fat diet is associated with more severe mitochondrial bioenergetic
  failure in AEC2 after hyperoxia
caption: (A) Ingenuity pathway analysis (IPA) of mrfDEGs in AEC2 of 60% fat versus
  10% fat fed mice after hyperoxia. (B) Oxygen consumption rate (OCR, left) and extracellular
  acidification rate (ECAR, right) of isolated AEC2 cells from mice on 10% or 60%
  diet exposed to room air (RA) or hyperoxia (HO) for 48 hours. All data are raw values
  (similar results were obtained from 3 independent experiments). Data are expressed
  as mean ± SD. (C) Basal and maximal respiration, and spare respiratory capacity
  of isolated AEC2 cells from mice fed 60% or 10% fat diet exposed to RA or HO. All
  data are raw values (ANOVA with Šídák’s correction for multiple comparisons, **p
  < 0.01, ****p < 0.0001, similar results were obtained from 3 independent experiments).
  (D) Cellular ATP levels of MLE12 cells exposed to PA (PA 150 μM) or control BSA
  at RA and HO conditions (μM, n = 15 wells/group, ANOVA with Šídák’s correction for
  multiple comparisons, ****p < 0.0001, similar results were obtained from at least
  3 independent experiments). (E) Cellular ATP levels of AEC2 cells isolated from
  mice on 10% or 60% fat diet exposed to RA or HO (μM, n = 15 wells/group, 40,000
  cells/well, ANOVA with Šídák’s correction for multiple comparisons, ****p < 0.0001,
  ***p < 0.001)
article_title: High fat diet obesity exacerbates acute lung injury induced dysregulation
  of fatty acid oxidation in alveolar epithelial type 2 cells
