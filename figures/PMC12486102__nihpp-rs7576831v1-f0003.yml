figure_title: Bacterial community structure and differentially expressed bacterial
  genes over time by BV recurrence status
caption: '(a–c) Principal component analysis (PCA) of bacterial metatranscriptomic
  profiles at (a) baseline, (b) 1-month post-treatment, and (c) 6-months post-treatment,
  stratified by recurrence status (nonrecurrent: blue; recurrent: red). PERMANOVA
  R2 and p-value is listed on each plot for BV-group comparison. Shaded ellipses represent
  95% confidence intervals for each group; density plots show sample distributions
  along each PC axis; open circles show group centroids. PCA axis loadings are available
  in supplementary data Figure 3. (d–f) Dot plots of differentially expressed bacterial
  genes (recurrent vs nonrecurrent) at (d) baseline, (e) 1 month, and (f) 6 months.
  Dot size represents – log10(adjusted p-value), and color reflects log10 fold change
  (logFC) scaled per-timepoint. Gene names include genus/species annotations where
  available; “MultiGenera” indicates genes indistinguishably mapping to multiple taxa.
  Numerous Gardnerella- and Fannyhessea-associated genes are enriched in recurrent
  participants, particularly at later timepoints, notably in the glycogen and maltose
  pathways'
