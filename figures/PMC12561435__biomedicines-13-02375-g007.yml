caption: Effects of in vivo knockdown or overexpression of Thbs4 on signal pathway
  factors. (A,B) show Western blot used to detect the expressions of signal pathway
  factor after knockdown and overexpression of Thbs4, respectively. (C) Schematic
  diagram of sciatic nerve transection model. GADPH was used as internal control group,
  and NC-sh or NC-OE was used as negative control. n = 3, versus negative control,
  * p < 0.05 and ** p < 0.01. sh, short hairpin RNA. NC-sh, negative control of shRNA.
  AAV, adeno-associated virus. NC-OE, negative control of overexpressed AAV. Thbs4,
  thrombospondin-4. NF-κB, nuclear factor-κB. AKT, protein kinase B. ERK, extracellular
  regulated protein kinase. GAPDH, glyceraldehyde-3-phosphate dehydrogenase. qRT-PCR,
  real-time quantitative PCR
