figure_title: Proposed model of the regulation of the role of β-catenin in anticancer
  drug (5-FU or OXT)-resistance by TDG and TET1.
caption: Proposed model of the regulation of the role of β-catenin in anticancer drug
  (5-FU or OXT)-resistance by TDG and TET1. Exposure to 5-FU or OXT led to elevated
  intracellular ROS levels in resistant cells. ROS accumulation upregulated the expression
  of DNA demethylases TDG and TET1. These enzymes cooperatively bind to CpG-rich regions
  within the β-catenin promoter, particularly at demethylated sites, thereby enhancing
  transcription of β-catenin. Elevated β-catenin expression activated downstream signaling
  pathways that promoted cell survival, inhibited apoptosis, and maintained chemoresistance
  against 5-FU and OXT. This model highlighted the ROS–TDG/TET1–β-catenin axis as
  a key epigenetic regulatory pathway contributing to colorectal cancer chemoresistance,
  suggesting TDG/TET1 as potential therapeutic targets for overcoming drug resistance.
  5-Fluorouracil (5-FU); Oxaliplatin (OXT); Thymine DNA glycosylase (TDG); ten-eleven
  translocation 1 (TET1); Reactive oxygen species (ROS)
