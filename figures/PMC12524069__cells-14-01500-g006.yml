figure_title: ROCK I and II (Rho-associated coiled-coil containing protein kinases)
  are key downstream effectors of the small GTPase RhoA and play a central role in
  regulating actin cytoskeleton dynamics and cellular contractility.
caption: 'ROCK I and II (Rho-associated coiled-coil containing protein kinases) are
  key downstream effectors of the small GTPase RhoA and play a central role in regulating
  actin cytoskeleton dynamics and cellular contractility. ROCK phosphorylates and
  activates LIM kinase (LIMK). Activated LIMK phosphorylates cofilin, an actin-depolymerizing
  factor. Phosphorylated cofilin becomes inactive, leading to stabilization of actin
  filaments and promotion of stress fiber formation. Regulation of Myosin Light Chain
  (MLC): ROCK directly phosphorylates MLC, enhancing actomyosin contractility. ROCK
  also inhibits myosin light chain phosphatase (MLCP), which normally dephosphorylates
  MLC. This dual action (activation of MLC and inhibition of MLCP) results in sustained
  phosphorylation of MLC, increasing cellular tension and promoting stress fiber assembly.
  ROCK-mediated phosphorylation of MLC is calcium-independent, providing an alternative
  pathway for MLC activation under different signaling conditions, in contrast to
  calcium/calmodulin-dependent signaling'
