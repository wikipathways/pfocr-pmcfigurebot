figure_title: Sensory and sympathetic neural mechanisms regulating bone remodeling
  during OTM.
caption: 'Sensory and sympathetic neural mechanisms regulating bone remodeling during
  OTM. On the one hand, PGE2 promotes bone resorption by elevating the RANKL/OPG ratio.
  Concurrently, it may also promote bone formation by binding to the EP4 receptor
  on sensory nerves, which activates the CREB pathway in the VMH to inhibit sympathetic
  tone. In contrast, NSAIDs attenuate OTM by inhibiting COX, the enzyme essential
  for PGE2 synthesis. On the other hand, orthodontic force stimulates the release
  of NE and NPY from sympathetic nerves, which activate β2-AR and Y1R on OBs/PDLCs.
  Additionally, force elevates intracellular Ca2+ in PDLCs, which directedly upregulating
  β2-AR expression in these cells. Collectively, sympathetic signals increase the
  RANKL/OPG ratio, leading to alveolar bone resorption. Abbreviation: VMH: ventromedial
  hypothalamus; OB, osteoblast; OC, osteoclast; NSAIDs, nonsteroidal anti-inflammatory
  drugs'
