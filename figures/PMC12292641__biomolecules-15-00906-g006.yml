caption: Detection of the interaction between PpMYB1 and PpbHLH1 and their transient
  overexpression in P. pulcherrima flowers. (A) The interaction between PpMYB1 and
  PpbHLH1 was analyzed using the Y2H system. The pGBKT7-Lam and pGADT7-T7 vectors
  served as negative controls, while the pGBKT7-53 and pGADT7-T7 vectors functioned
  as positive controls. (B) Photographs of the phenotypes from transient expression
  experiments of PpMYB1 and PpbHLH1 in P. pulcherrima flowers. (C) Measurement of
  total anthocyanin levels following the transient overexpression of PpMYB1 and PpbHLH1.
  (D) Analysis of the expression levels of structural genes in the anthocyanin pathway
  following the transient overexpression of PpMYB1 and PpbHLH1. The data are means
  ± SD (n = 3). Letters indicate significant differences (p < 0.05, Duncan’s multiple
  range tests)
