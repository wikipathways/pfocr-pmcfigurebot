figure_title: Proteomic analysis reveals networks supporting inhibition of fatty acid
  and glucose metabolism and mitogenesis in the left atria of swine with MYH7 R403Q
  mutation
caption: The number of downregulated (green) and upregulated (red) differentially
  expressed proteins present in the LA of MYH7-HCM swine versus Yucatan control (n=3/group)
  are shown in the volcano plot and Venn diagram (A). DEPs present in the sample predict
  significantly altered pathways related to energy metabolism and mitochondrial function
  ranked by z-score (B). Upstream regulators predicted to inhibit the fatty acid metabolism
  pathway (C). Clusters of proteins predicted to inhibit uptake of D-glucose and quantity
  of carbohydrate while activating diabetes mellitus (D), with a separate network
  inhibiting mitogenesis (E). z-score ≤ −2 and ≥ 2 represents significance
article_title: Heterozygous MYH7 R403Q mutation impairs left atrial mitochondrial
  function in a Yucatan mini-pig model of genetic non-obstructive hypertrophic cardiomyopathy
