figure_title: The expression profiles of differentially expressed genes (DEGs) involved
  in the photosynthesis pathway in mesocotyls of Zheng58 seedlings was analyzed by
  transcriptome sequencing.
caption: 'The expression profiles of differentially expressed genes (DEGs) involved
  in the photosynthesis pathway in mesocotyls of Zheng58 seedlings was analyzed by
  transcriptome sequencing. CK: mesocotyl of Zheng58 seedlings treated with 0 μM 24-epibrassinolide
  (EBR) application at 25 °C normal temperature; CKE: mesocotyl of Zheng58 seedlings
  treated with 2 μM 24-epibrassinolide (EBR) application at 25 °C normal temperature;
  LTE: mesocotyl of Zheng58 seedlings treated with 2.0 μM 24-epibrassinolide (EBR)
  application at 10 °C low temperature; LT: mesocotyl of Zheng58 seedlings treated
  with 0 μM 24-epibrassinolide (EBR) application at 10 °C low temperature. (A) The
  expression situation of DEGs in different comparisons was explicited by comparing
  different comparisons of DEGs. The DEGs in green background area at the top is up-regulated,
  and in the pink background area at the bottom is down-regulated. (B) Raincloud plot
  showing the central tendency, dispersion degree, outlier and data density of DEG
  expression (log2(FPKM + 1)) in mesocotyls under four treatments. (C) Heatmap shows
  the significance of the expression (log2(FPKM + 1)) of DEGs under four treatments'
