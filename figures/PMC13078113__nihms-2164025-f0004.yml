figure_title: Loading of HLA-E with non-VL9 peptides
caption: HLA-E is rapidly internalized from the cell surface by endocytosis, a process
  that requires the cytoplasmic tail of HLA-E. HLA-E may lose the bound VL9 peptide
  before, during or after endocytosis. ‘Empty’ HLA-E molecules can acquire non-VL9
  peptides, which may bind to HLA-E much more weakly than does VL9. Unlike peptide
  loading in the endoplasmic reticulum (ER), this peptide exchange is probably not
  a dedicated, chaperoned process — for example, it is not dependent on the peptide
  transporter associated with antigen processing (TAP) — but rather is a random binding
  process that is supported by the stability of the peptide-binding groove of HLA-E
  in the absence of bound peptide. Such non-VL9–HLA-E complexes need to be recycled
  back to the cell surface to be recognized by HLA-E-restricted T cells. The source
  and processing pathway of non-VL9 peptides are not known, but this probably involves
  endocytic, HLA-E-containing vesicles gaining some access to cellular degradation
  compartments, such as autophagosomes and lysosomes (in a similar manner to peptide
  loading on MHC class II molecules), before being recycled back to the cell surface.
  It has also been proposed that Golgi-located proteases, particularly furin, might
  be involved in generating non-VL9 peptides. These could be intercepted during recycling
  of HLA-E via the trans-Golgi network (TGN). The generation of non-VL9 peptides in
  recycling compartments could be further exacerbated in virus-infected and bacteriainfected
  cells; bacterial phagosomes have been implicated in loading of HLA-E with non-VL9
  peptides, and cytomegalovirus (CMV) creates a multivesicular viral assembly complex
  while inhibiting lysosomal degradation of autophagosomal content. MVB, multivesicular
