figure_title: Age–specific algorithm for lung function assessment after preterm birth.
caption: 'Age–specific algorithm for lung function assessment after preterm birth.
  Proposed clinical algorithm for structured pulmonary follow-up in preterm-born children,
  with or without bronchopulmonary dysplasia (BPD). The pathway emphasizes early initiation
  of lung function monitoring according to European Respiratory Society recommendations
  and age-adapted assessment strategies. In infancy (0–12 months), evaluation relies
  on tidal breathing flow-volume loop analysis. During late infancy and toddlerhood
  (1–3 years), tidal breathing-based techniques and emerging technologies may be applied.
  In preschool children (3–6 years), impulse oscillometry enables assessment of small
  airway function. From school age (≥6 years), spirometry represents the cornerstone
  of evaluation, complemented by advanced tests, including body plethysmography, diffusing
  capacity, and multiple breath washout, when indicated. The algorithm integrates
  periodic monitoring, phenotype-driven interpretation, and escalation of follow-up
  in case of abnormal findings, supporting individualized longitudinal surveillance
  into adolescence. BPD: bronchopulmonary dysplasia; ATS/ERS: American Thoracic Society/European
  Respiratory Society; TBFVL: tidal breathing flow-volume loop(s); VT/kg: tidal volume
  per kilogram; RR: respiratory rate; tPTEF/tE: time to peak tidal expiratory flow
  to expiratory time ratio; VPTEF/VE: ratio of volume to peak tidal expiratory flow
  to expiratory volume; IOS: impulse oscillometry (system); R5: respiratory system
  resistance at 5 Hz; R20: Resistance at 20 Hz; R5-R20: difference between resistance
  at 5 Hz and 20 Hz (reflecting peripheral airway resistance); X5: respiratory system
  reactance at 5 Hz; AX: area of reactance; Fres: resonant frequency; FEV1: forced
  expiratory volume in 1 s; FVC: forced vital capacity; FEV1/FVC: ratio of forced
  expiratory volume in 1 s to forced vital capacity; FEF25–75: forced expiratory flow
  between 25% and 75% of FVC; TLC: total lung capacity; RV: residual volume; FRC:
  functional residual capacity; DLCO: Diffusing Capacity of the Lung for Carbon Monoxide;
  MBW: Multiple Breath Washout; LCI: Lung Clearance Index. (Created with FigureLabs)'
