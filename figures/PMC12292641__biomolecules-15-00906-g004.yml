caption: qRT-PCR validation of the expression profiles of selected unigenes related
  to anthocyanin biosynthesis. Twelve unigenes from this pathway were used to confirm
  the RNA-seq results. Expression levels were determined using the 2−ΔΔCT method.
  The left y-axis shows the relative expression of the unigenes by qRT-PCR, while
  the right y-axis displays the TPM values from the RNA-seq data. Letters above bars
  indicate significant differences at p < 0.05. The data represent the mean of three
  biological replicates, with ±SD
