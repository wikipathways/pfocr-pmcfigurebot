figure_title: Effects of chestnut inner shell extract (CIE) on atrophy-related factors
  in denervated (Den) tibialis anterior (TA) muscle.
caption: |-
  Effects of chestnut inner shell extract (CIE) on atrophy-related factors in denervated (Den) tibialis anterior (TA) muscle. (A) The apoptotic cells from Sham, Den, and CIE treatment groups were identified using a terminal deoxynucleotidyl transferase dUTP nick end labeling (TUNEL) assay. The lower panels show magnified views of the boxed regions in the upper images.(B) The quantification of TUNEL-positive cells is presented as a percentage. (C) Myogenin (MyoG)-positive cells were detected in the Sham, Den, and CIE treatment groups through immunohistochemistry. Magnified images of the boxed areas in the upper panels are shown in the lower panels. (D) The quantification of MyoG-positive cells was expressed as a percentage. (E) Western blot analysis and quantification of apoptosis-related proteins (Bcl-2-associated X protein (Bax), cytochrome C, cleaved caspase-3) in TA muscle. Full-length blots/gels are located in Figure S2. (F) Western blot analysis and quantification of Akt/mTOR pathway proteins (p-protein kinase B (Akt), Akt, p-mammalian target of rapamycin (mTOR), mTOR) in TA muscle. (G) Western blot analysis and quantification of MyoG and muscle RING-finger protein-1 (MuRF1) expression in TA muscle. (F,G) Full-length blots/gels are presented in Figure S3. Data are presented as the mean ± SD. #
  p < 0.05, ##
  p < 0.01 and ###
  p < 0.001 vs. NC group; * p < 0.05, ** p < 0.01, and *** p < 0.001 vs. BaCl2 group; †
  p < 0.05 and ††
  p < 0.01 vs. CIE 100. Sham (sham control, PBS P.O.); Den (denervation group, PBS P.O.); and CIE (denervation + CIE 100 or 400 mg/kg/day P.O.)
