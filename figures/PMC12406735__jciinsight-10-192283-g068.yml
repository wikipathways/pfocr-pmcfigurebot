figure_title: |-
  Activation of the CDSP pathway in the Myh6-McmTam
  Dspfl/fl cardiomyocytes
caption: |-
  (A) Immunoblots showing expression of the selected proteins in the CDSP pathway in the WT, Myh6-McmTam, and Myh6-McmTam
  Dspfl/fl cardiomyocytes. (B) Dot plots showing the individual data points, median, and 95% CI representing the expression levels of the selected proteins shown in A. Data were compared among the 3 genotypes using ANOVA followed by pairwise comparisons per Bonferroni method (N = 4 to 8 per group). Only P values < 0.05 are depicted. (C) GSEA plot showing enrichment of interferon regulatory factor 3 (IRF3) target genes in the Myh6-McmTam
  Dspfl/fl myocytes compared with the WT. The normalized enrichment score (NES) and the q value are depicted. (D) GSEA plot showing enrichment of NF-κB target genes in the Myh6-McmTam
  Dspfl/fl myocytes compared with the WT. NES and the q value are depicted
