figure_title: SARS-CoV-2 infectivity and HBE culture host responses as a function
  of sex
caption: (A) Box plots depicting mean titers in SARS-CoV-2 infected HBE cultures from
  0–3 dpi colored by sex. (Aii) Slopes of mean titers in each sex for dpi 0–3 (slope
  = 1.77 for females and 1.40 for males). The p-value of the difference between the
  slopes (−0.37) is 0.0226. The shaded areas represent the 95% confidence intervals.
  (Aiii/iv) As for (Ai-iii) expect representing titer data for dpi 3, 7, and 14. (B)
  Venn diagram representing differentially expressed genes (DEGs) between sexes from
  analyses of mock HBE cultures at the dpi indicated. Numbers in parentheses represent
  the total number of DEGs in each group. DEGs represented are filtered at adjusted
  P-value of <0.05 and absolute log2 fold-change >1 with an average expression >0
  (log2; or roughly TMP>1). (C) Schematic representation of DEGs between the two sexes
  at the times and treatments indicated (m=mock; v=virus). Coloring represents the
  location of the DEGs on the chromosomes where Auto=all autosomes. DEGs represented
  are filtered as for (B). (D) Simplified heatmap of differentially expressed pathways
  from Reactome + custom annotation set for female vs. male in mock infected HBE cultures.
  Red pathways are upregulated in females compared to males; blue pathways are upregulated
  in males compared to females. NES=normalized enrichment score. (E) Replication cohort
  (Protocol 2). (Ei) Box plots depicting mean titers in SARS-CoV-2 infected HBE cultures
  from 0–3 dpi colored by sex Protocol 2. (Eii) Combined titer data for Protocols
  1–2. No significant difference between sexes were found for any timepoint measured
