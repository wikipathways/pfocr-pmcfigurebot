figure_title: Signaling Pathways Regulating BAK/BAX-Dependent Apoptosis and Necroptosis,
  and Targeted Pharmacological Strategies.
caption: Signaling Pathways Regulating BAK/BAX-Dependent Apoptosis and Necroptosis,
  and Targeted Pharmacological Strategies. This schematic illustrates key upstream
  signaling pathways—including JNK, MEK/ERK, and PI3K/AKT—that converge on the BCL2
  protein family to regulate mitochondrial outer membrane permeabilization (MOMP)
  and cell death. Pro-apoptotic BH3-only proteins (e.g., BIM, PUMA, BAD) and anti-apoptotic
  members (e.g., BCL2, MCL1, BCLXL) interact dynamically to control the activation
  of the effector proteins BAK and BAX. Their activation leads to apoptosis or, under
  certain conditions, necroptosis. Small-molecule screening strategies—such as BH3–groove
  binders, α9 helix mobilization blockers, and lipid–BAK interface disruptors—offer
  potential to modulate these interactions. Tool compounds targeting these nodes are
  primarily studied in Cardiovascular disease, neurological and cancer models
