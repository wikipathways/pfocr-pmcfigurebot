figure_title: Key immune and inflammatory responses in SLE.
caption: Key immune and inflammatory responses in SLE. Innate immunity plays a central
  role in the early stages of SLE through the activation of the IFN-I pathway. In
  SLE, U1 snRNP (small nuclear ribonucleoprotein, RNA-containing immune complexes),
  derived from apoptotic or necrotic cell debris, are taken up by immune cells via
  Fc receptors (FcRs), and the single-stranded RNA within U1 snRNP is recognized by
  endosomal TLRs. This recognition triggers IFN-I production by plasmacytoid dendritic
  cells (pDCs) via the JAK-STAT pathway. TLR7 activation promotes the differentiation
  of age-associated B cells (ABCs) into autoantibody-producing cells, while TLR8 activation
  stimulates TNF-α-producing monocytes that infiltrate the kidney. B cells, activated
  through BCR engagement and receptors such as BAFFR, TACI, APRIL, and CD19/CD20,
  interact with T cells through MHC-II-antigen–TCR/CD4 and CD40–CD40L signaling. Cytokines
  such as IL-4, IL-12, and IL-23 further promote T cell activation and inflammation.
  Autoantibodies form immune complexes that perpetuate adaptive immune responses and
  drive disease progression. All other abbreviations are defined in the main text
  and listed at the end of the manuscript. All one-way arrows indicate activation
  and forward progression along the pathway, bidirectional arrows represent interactions
  between components, and truncated lines indicate inhibition
