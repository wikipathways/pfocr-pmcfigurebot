figure_title: Molecular pharmacology and functional characterisation of δOR positive
  allosteric modulators BMS-986187 and MIPS3614
caption: '(a) Chemical structure of BMS-986187, a first-generation δOR PAM with limited
  solubility. (b-f) Pharmacological characterisation of BMS-986187 across multiple
  signaling pathways. Concentration-response curves showing DADLE-mediated responses
  in the presence of increasing concentrations of BMS-986187 (0–30 μM) in: (b) cAMP
  inhibition assay (n=2–3), (c) β-arrestin 2 recruitment assay (n=4–5), (d) mGsi recruitment
  assay (n=3–5), and (e) Nb33 recruitment assay (n=3–4). (f) Summary table of allosteric
  parameters derived from fitting the operational model of allosterism to the data
  in (b-e) to estimate functional cooperativity (αβ), PAM affinity (pKB), and PAM
  efficacy (τB) values. (g) Chemical structure of MIPS3614, a second-generation δOR
  PAM with improved solubility compared to BMS-986187 through reduced cLogP values.
  Key atoms are numbered. (h-l) Equivalent pharmacological characterisation of MIPS3614
  using the same assay panel as BMS-986187 (h) cAMP inhibition assay (n=5), (i) β-arrestin
  2 recruitment assay (n=6), (j) mGsi recruitment assay (n=5), and (k) Nb33 recruitment
  assay (n=5). (l) A summary table shows that MIPS3614 exhibits similar functional
  cooperativity and low intrinsic efficacy compared to BMS-986187, but with approximately
  10-fold lower binding affinity. (m) Validation of MIPS3614 allosteric effects in
  native tissue. Concentration-response curves for Leu-Enkephalin-mediated inhibition
  of electrically evoked contractions of the mouse colon in the absence (vehicle)
  or presence of 1 μM MIPS3614, 10 μM MIPS3614, or 10 μM BMS-986187. Data for 10 μM
  BMS-986187 were reproduced from Deo et al., 2025 for comparison32. (n) Quantification
  of Leu-Enkephalin potency changes from (m), demonstrating that MIPS3614 has a 10-fold
  greater allosteric effect compared to BMS-986187 in native tissue. Statistical significance
  was determined with one-way ANOVA (*p < 0.05) with a Dunnett’s post-test using Vehicle
  for comparison. (o) Representative traces from whole-organ colonic motility assays
  showing colonic motor complexes (CMCs) under vehicle control (left) and 3 μM MIPS3614
  treatment (right) with conditions under elevated intraluminal pressure.(p) Quantitative
  analysis of colonic motility parameters showing the effects of 3 μM MIPS3614. MIPS3614
  significantly reduced CMC frequency without affecting velocity under conditions
  of elevated intraluminal pressure. Statistical significance was determined with
  unpaired two-tailed t tests (*p < 0.05). (b-p) Data are presented as mean ± SEM'
