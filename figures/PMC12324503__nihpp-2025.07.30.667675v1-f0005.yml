figure_title: Differential gene expression and GO enrichment analysis of microglia
  from ICH samples
caption: (A); Condition-split UMAP highlighting microglia clusters in integrated P0
  scRNAseq samples (top left). Volcano plot of significantly differentially expressed
  genes (DEGs) in P0 microglia, KO vs. WT (bottom left). Blue lines on volcano plot
  mark −1 and +1 avg_log2FC cutoff of statistical significance (x axis). Red line
  on volcano plot marks adjusted p-value significance cutoff (0.05). Y axis is −log10
  of adjusted p value. Heatmap showing log-normalized and scaled expression of top
  20 DEGs upregulated in microglia from P0 ICH samples (up in KO) and downregulated
  in ICH samples (up in WT). TreePlot of top 15 gene ontology (GO) enrichment pathways
  overexpressed in KO microglia at P0 (right). (B); Condition-split UMAP highlighting
  microglia clusters in integrated P5 scRNAseq samples (top left). Volcano plot of
  significantly differentially expressed genes (DEGs) in P5 microglia, KO vs. WT (bottom
  left). Blue lines on volcano plot mark −1 and +1 avg_log2FC cutoff of statistical
  significance (x axis). Red line on volcano plot marks adjusted p-value significance
  cutoff (0.05). Y axis is −log10 of adjusted p value. Heatmap showing log-normalized
  and scaled expression of top 20 DEGs upregulated in microglia from P5 ICH samples
  (up in KO) and downregulated in ICH samples (up in WT). TreePlot of top 15 gene
  ontology (GO) enrichment pathways overexpressed in microglia in ICH samples at P5
  (right). (C); Condition-split UMAP highlighting microglia in integrated P10 scRNAseq
  samples (top left). Volcano plot of significantly differentially expressed genes
  (DEGs) in P10 endothelial cells, KO vs. WT (bottom left). Blue lines on volcano
  plot mark −1 and +1 avg_log2FC cutoff of statistical significance (x axis). Red
  line on volcano plot marks adjusted p-value significance cutoff (0.05). Y axis is
  −log10 of adjusted p value. Heatmap showing log-normalized and scaled expression
  of top 20 DEGs upregulated in P10 ICH samples (up in KO) and downregulated in microglia
  from ICH samples (up in WT). TreePlot of top 15 gene ontology (GO) enrichment pathways
  overexpressed in microglia from ICH samples P10 (right). (D); Ridgeplot of differently
  expressed genes downregulated in brain microglia in KO mice at the three neonatal
  ages (P0, P5, and P10). (E); Ridgeplot of shared differently expressed genes upregulated
  in KO microglia at P0, P5 and P10
