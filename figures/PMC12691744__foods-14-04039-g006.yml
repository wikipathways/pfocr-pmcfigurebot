figure_title: Metabolic-pathway profiles behind sugar differences.
caption: Metabolic-pathway profiles behind sugar differences. (a,b) represent the
  differentially expressed gene pathway enrichment in the Q60–Q120 and S60-S120 groups,
  respectively. (c–f) represent canonical correlation analysis of differential metabolites
  and differential genes related to sugars in Q60–S60 (purple background), Q120–S120
  (green background), Q60–Q120 (red background), and S60–S120 (yellow background)
  groups, respectively. Red dots represent individual genes (transcripts) in the corresponding
  KEGG pathway, projected onto the first two latent variables (U1 and U2) of the integrated
  metabolome–transcriptome model
