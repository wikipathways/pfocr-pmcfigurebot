figure_title: Genetic Architecture of Delirium Risk.
caption: 'Genetic Architecture of Delirium Risk. This figure depicts the complex genetic
  architecture underlying delirium susceptibility in humans. The diagram presents
  four major genetic influence categories: (1) Inflammatory gene variants (IL-6, IL-1β,
  TNF-α) with specific polymorphisms and their associated odds ratios, including the
  IL-6 -174G/C polymorphism (OR 2.65, 95% CI 1.54–4.57), (2) Neurotransmitter-related
  genes affecting cholinergic and dopaminergic signaling, (3) APOE genotype, with
  ε4 carriers showing increased vulnerability (OR 1.89, 95% CI 1.36–2.62) compared
  to the common ε3 allele, and (4) Blood–brain barrier integrity genes including tight
  junction proteins and matrix metalloproteinases. The figure illustrates the relative
  contribution of genetic factors (35–65% based on twin studies) versus environmental
  factors to delirium risk in the vertical bar chart on the right. The bottom section
  shows the genetic penetrance spectrum from high-impact rare variants to common low-impact
  polymorphisms. Dotted arrows between gene categories indicate cross-pathway interactions,
  such as APOE’s influence on inflammatory responses and inflammatory genes’ effects
  on BBB integrity, highlighting the interconnected nature of genetic risk factors.
  References: [88,89,90,91,92,93,94,95,96,97]'
