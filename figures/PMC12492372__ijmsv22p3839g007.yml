figure_title: Schematic illustration showing the proposed mechanisms by which PRDX3
  promotes lymph node metastasis in CCa.
caption: Schematic illustration showing the proposed mechanisms by which PRDX3 promotes
  lymph node metastasis in CCa. In primary tumors, highly-expressed PRDX3 activates
  the NF-κB signaling pathway where the downstream molecules MMP-9 and VEGF-C promote
  the invasion ability and lymphangiogenesis in CCa. In detached CCa cells, elevated
  PRDX3 hinders cell apoptosis by reducing ROS level. Together, these two pathways
  support the promotion effect of PRDX3 on LNM in CCa
