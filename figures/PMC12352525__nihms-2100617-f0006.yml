figure_title: Obesity is associated with downregulation of the FAO transcriptomic
  signature in AEC2 from patients with severe ARDS
caption: 'Transcriptomic signature in AEC2 cells in COVID19 ARDS was analyzed using
  human lung single-cell RNA sequencing datasets from subjects with fatal COVID-19
  grouped by BMI and control subjects (GSE171524). Enrichment scores of (A) fatty
  acid oxidation pathway (GO: 0006635), (B) lipid biosynthetic process (GO: 0008610),
  and (C) mitochondrial respiratory chain (GO: CC0005746) across groups are exhibited
  using violin plots of z-scores for involved genes. The p values were calculated
  using Mann-Whitney U tests'
article_title: High fat diet obesity exacerbates acute lung injury induced dysregulation
  of fatty acid oxidation in alveolar epithelial type 2 cells
