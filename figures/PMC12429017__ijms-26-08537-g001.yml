figure_title: 'Mitochondrial alterations induced by oncogenic mutations in nDNA and
  mtDNA: A comparison between normal and cancer cells.'
caption: 'Mitochondrial alterations induced by oncogenic mutations in nDNA and mtDNA:
  A comparison between normal and cancer cells. (A,B) Mitochondrial metabolic alterations
  due to nDNA mutations. In normal cells, glucose, glutamine, and FAs undergo complete
  oxidation through the TCA cycle and the ETC, generating ATP and maintaining proper
  ROS levels. In cancer cells, aerobic glycolysis dominates glucose metabolism, diverting
  glucose carbon away from the TCA cycle to fuel biosynthetic pathways. Increased
  glutamine anaplerosis replenishes TCA cycle intermediates, while elevated FA transport
  enhances acetyl-CoA supply for the TCA cycle. Impairments in ETC subunits, such
  as SDHB and GRIM-19, reduce ATP production and elevate ROS levels. (C,D) Alterations
  in OXPHOS, mtDNA copy number, and apoptosis due to mtDNA mutations. In normal cells,
  mtDNA-encoded genes regulate key mitochondrial functions, including metabolism,
  mtDNA replication, and calcium homeostasis. In cancer cells, mutations in OXPHOS
  subunits—such as ND1, ND2, ND4, ND4L, ND6, COX3, and ATP6/8—lead to defective OXPHOS
  and excessive ROS production. Mutations in the D-loop region reduce mtDNA copy number,
  while ATP6 mutations suppress apoptosis. (E,F) Alterations in mitochondria-associated
  apoptosis and mtQC due to nDNA mutations. In normal cells, calcium released from
  the ER into the mitochondrial matrix and BCL2 family proteins regulate apoptosis.
  mtQC is maintained through coordinated regulation by nuclear and mitochondrial proteins.
  In cancer cells, BCL-2 overexpression inhibits IP3R, reducing ER-to-mitochondria
  Ca2+ flux, while TP53 mutations and p53 downregulation enhance BAX suppression,
  collectively preventing apoptosis. Additionally, mutations in PARK2 and reduced
  Parkin expression impair mitophagy. Other regulators, including TFAM, Drp1, PINK1,
  and BNIP3, are upregulated through oncogenic transcriptional or post-translational
  modifications, reprogramming the mtQC process in cancer cells. GLUT1, glucose transporter
  1; GK, glucokinase; HK2, hexokinases II; VDAC, voltage-dependent anion channel;
  G-6-P, glucose-1-phosphate; F-6-P, fructose-6-phosphate; GSP, glycogen synthesis
  pathway; PPP, pentose phosphate pathway; rNTP, ribonucleotide triphosphate; HBP,
  hexosamine biosynthesis pathway; UDP-GlcNAc, Uridine diphosphate N-acetylglucosamine;
  PKM1/2, pyruvate kinase M1/2; LDH, lactate dehydrogenase; PDH, pyruvate dehydrogenase;
  PDK, pyruvate dehydrogenase kinase; NADH, nicotinamide adenine dinucleotide; FADH2,
  flavin adenine dinucleotide; ETC, electron transport chain; α-KG, α-ketoglutarate;
  GDH, glutamate dehydrogenase; GPT2, glutamate pyruvate transaminase 2; GLS, glutaminase;
  IDH, isocitrate dehydrogenase; ACLY, ATP citrate lyase; FASN, fatty acid synthase;
  CPT1, carnitine palmitoyltransferase 1; FAs, fatty acids; FAO, fatty acids oxidation.
  ND, NADH dehydrogenase; CYB, cytochrome b; COX, cytochrome c oxidase; ATP6/8, ATP
  synthase F0 subunit 6/8; MUC, mitochondrial unspecific channel. ER, endoplasmic
  reticulum; IP3R, inositol 1,4,5-triphosphate receptor; MCU, mitochondrial calcium
  uniporter; MAM, mitochondria-associated ER membrane; MOMP, mitochondrial outer membrane
  permeabilization; m-TOR, mammalian/mechanistic target of rapamycin; TFAM, transcription
  factor A, mitochondrial; Mfn1/2, mitofusin 1/2; OPA1, optic Atrophy 1; MFF, mitochondrial
  fission factor; FUNDC1, FUN14 domain containing 1; PHB2, prohibitin 2; NIX, also
  BNIP3L, BCL2 interacting protein 3 like; LC3, also MAP1LC3A, microtubule associated
  protein 1 light chain 3 alpha'
