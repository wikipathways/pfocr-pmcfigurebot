figure_title: The temporal and biological dynamics of radiation response
caption: Organs that exhibit sensitivity to radiation in the days and weeks following
  exposure are termed ‘early responding’ tissues, whereas those that exhibit sensitivity
  in the months and years following exposure are termed ‘late-responding’ tissues.
  These distinctions are important for understanding radiation effects, planning radiotherapy
  and predicting side effects. After exposure to ionizing radiation, immediate damage
  to biomolecules, and especially to DNA, activates the DNA damage response (DDR)
  pathways, leading to either DNA repair and cell survival, or to sustained cell injury.
  In the situation where DNA repair is efficacious and allows cell survival, the potential
  errors occurring during DNA repair can lead to the maintenance of genetic mutations
  in tumour suppressor genes or oncogenes that can, decades after radiation exposure,
  lead to radiation-induced secondary cancers118. In the situation where DDR pathways
  are overwhelmed and DNA damage is irreparable, early responding organs, characterized
  by a high cellular turnover, typically exhibit radiation effects within days post-exposure.
  These effects are primarily characterized by cell death or senescence. In the weeks
  following exposure, epithelial cell barriers can break down, inflammation can become
  chronic and the vasculature can exhibit damage. Over months, fibrosis can accumulate.
  By contrast, in late-responding organs, with slow cellular turnover rate, the damage
  induced by radiation primarily results from the gradual accumulation of structural
  and functional defects
