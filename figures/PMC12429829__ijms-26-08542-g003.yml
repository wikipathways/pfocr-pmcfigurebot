figure_title: Activation of the cGAS/STING/TBK1/NF-κB pathway in NONO-knockout cells.
caption: Activation of the cGAS/STING/TBK1/NF-κB pathway in NONO-knockout cells. (A)
  Quantification (left) and immunofluorescence (right) of cGAS signal intensity in
  micronuclei of wildtype (wt) and NONO-knockdown clones (cl1 and cl4). Images show
  cGAS (green), DAPI (blue), and merged channels. Knockout clones display strong cGAS
  localization to micronuclei. We analyzed 30 micronuclei for each condition. The
  results show the mean and standard deviation (SD) of three independent experiments.
  Statistical significance was determined using Student’s t-test, with results indicated
  as **** p < 0.0001. (B) Immunoblot analysis of NONO and cGAS proteins in MBA-MD-231
  cells following siRNA transfection (left) or in shNONO cell clones (right). GAPDH
  is used as a loading control. (C) Western blot analysis of STING phosphorylation
  at S366 in NONO-knockdown clones compared to wt. Total STING and GAPDH are shown
  as loading controls. (D) TBK1 Ser172 was analyzed in shNONO cell clones or in transfected
  MDA-MB-231 cells with siNONO, followed by incubation for 72 h before Western blot
  analysis. Total TBK1 and GAPDH serve as controls. (E) Representative Images of NF-κB
  p65 (green), DAPI (blue), and merged channels (up panel). Quantification (down panel)
  of nuclear NF-κB p65 immunofluorescence in wt, cl1, and cl4 cells. The graph displays
  mean ± SD of two independent experiments, with approximately 450 cells analyzed
  per condition. Statistically significant differences are indicated by **** p < 0.0001.
  (F) Real-time qRT-PCR analysis of CCL5 expression in NONO-downregulated clones compared
  to control cells. Results are reported as means with standard deviations of seven
  independent experiments. Statistical analysis was performed by subjecting the ΔCt
  values of treated and control samples to a two-sided Student’s t-test. Statistically
  significant differences are indicated with **** p < 0.0001. (G) MDA-MB-231 cells
  transfected with siRNA targeting NONO or control, followed by 72 h of incubation.
  CCL5 expression in NONO-depleted cells relative to control cells was calculated
  using the 2−ΔΔCt method. Results are presented as means ± standard deviations of
  six independent experiments. Statistical analysis was conducted by applying a two-tailed
  Student’s t-test to the ΔCt values of treated and control samples. Statistically
  significant differences are denoted by **** p < 0.0001
