figure_title: Dynamics of muscle-resident Schwann cell subtypes in healthy and remodeling
  neuromuscular junctions
caption: (A) UMAP visualization of reclustered muscle-resident Schwann cell clusters,
  identifying 2 terminal Schwann cell subclusters (tSC-A and tSC-B) and 3 myelin Schwann
  cell subclusters (mSC-A, mSC-B, mSC-C). (B) Proportions (%) of each Schwann cell
  subcluster, with corresponding UMAP plots (C) across conditions in WT, Sod1–/–,
  and 7-dpi mice. (D) Heatmap illustrating gene ontology (GO) pathway analysis results,
  with enriched biological processes for each Schwann cell cluster presented as z
  scores of normalized –log(P value) for each GO term. (E) Diffusion map showing Schwann
  cell subclusters with 3 trajectory lineages from slingshot analysis superimposed.
  (F) UMAP feature plots indicating expression patterns of key genes (Mpz, Gap43,
  Cola1a), highlighting their distribution within lineages 1, 2, and 3, respectively.
  (G) Variation in cell density over pseudotime for each lineage in WT, Sod1–/–, and
  7-dpi mice, reflecting differential engagement in nerve repair processes
article_title: Decoding muscle-resident Schwann cell dynamics during neuromuscular
