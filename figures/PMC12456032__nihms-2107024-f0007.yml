figure_title: Uncoating pathways for MS2.
caption: Uncoating pathways for MS2. Illustration of MS2 attachment and cell entry,
  showing two possible uncoating pathways. In one pathway, MS2 uncoats at a distance
  from the cell (extracellular uncoating); in the other, it uncoats at the cell surface
  during F-pilus retraction.2,21 In either scenario, the uncoated gRNA-Mat complex
  could be brought into the cell by F-pilus retraction. Multiple uncoating pathways
  could be advantageous for the phage by increasing the chance of a successful infection
