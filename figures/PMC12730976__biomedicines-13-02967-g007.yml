figure_title: Potential glioprotective mechanisms of melatonin in cultured cortical
  astrocytes from adult Wistar rats.
caption: Potential glioprotective mechanisms of melatonin in cultured cortical astrocytes
  from adult Wistar rats. Melatonin may trigger a coordinated cytoprotective response
  through activation of the Nrf2 and SIRT1 pathways. Nuclear translocation of Nrf2
  can subsequently suppress the NFκB pathway, reducing the expression of pro-inflammatory
  enzymes COX-2 and iNOS, while increasing IL-6 and IL-10 levels. Upregulation of
  SIRT1 expression may further reinforce the anti-inflammatory and antioxidant responses.
  In addition, the transcriptional profile induced by melatonin suggests a regulatory
  mechanism that prevents excessive cellular activation and maintains astroglial homeostasis.
