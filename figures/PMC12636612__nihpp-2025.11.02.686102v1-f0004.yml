figure_title: Distinct striatal cell populations mediate goal directed steering and
  action sequence counting behavior
caption: 'a) In-vivo calcium imaging of dSPNs and iSPNs. The hemisphere ipsilateral
  to the reward port was recorded (A2a: n = 5, D1: n = 4). Representative examples
  of calcium signals in D1+ and A2a + mice. b) The population of task-related direct
  and indirect pathway neurons increased activity at distinct components of the press
  count behavior and were classified by their temporal relationship to behavior. c)
  The proportion of neurons in each group. d) (Top) Representative examples of direct
  and indirect pathway lever approach neurons aligned to press run start. (Bottom)
  the population of lever approach neurons increased activity as mice contraversively
  approached the lever. The shaded bars show the time window used for computing correlation
  between neural activity and behavior. e) A representative direct pathway lever approach
  neuron and the mice’s velocity. A representative indirect pathway lever approach
  neuron and the mice’s velocity. f) Direct pathway lever approach neuron population
  activity was positively correlated with velocity toward the lever (R2 = 0.73, p
  = 0.0016). Indirect pathway lever approach neuron population activity was negatively
  correlated with velocity toward the lever (R2 = 0.63, p = 0.005). g) For lever approach
  neurons, dSPN population activity peaked before iSPN population activity (Unpaired
  t-test, p < 0.0001). The peak activity of dSPN and iSPN lever approach neurons was
  not correlated with the next count (dSPNs: R2 = 0.06, p = 0.688; iSPNs: R2 = 0.76,
  p = 0.051). h) (Top) Representative examples of direct and indirect pathway count
  neurons aligned to press run start. (Bottom) The population of direct and indirect
  pathway count neurons increased activity during pressing. i) A representative direct
  pathway count neuron and the mice’s presses. A representative indirect pathway count
  neuron and the mice’s presses. j) The slope of direct pathway count neuron activity
  was not correlated with count (R2 = 0.37, p = 0.27). The slope of indirect pathway
  count neuron activity was not correlated with count (R2 = 0.12, p = 0.55). k) The
  peak of direct pathway count neuron activity at the beginning of the count was positively
  correlated with count (R2 = 0.77, p = 0.04). The peak of indirect pathway count
  neuron activity at the end of the count (entry at run end) was positively correlated
  with count (R2 = 0.87, p = 0.01). Data represents mean ± SEM'
