figure_title: BMAL1 deficiency impaired GC responsiveness in HBECs.
caption: BMAL1 deficiency impaired GC responsiveness in HBECs. (A-B) RNA sequencing
  data showing the expression of the NF-κB pathway and AP-1 pathway. (C-D) mRNA levels
  of IL-25, IL-33, TSLP, GILZ and FKBP5 in HBECs. (E) The mRNA levels of GRα and GRβ
  and the ratios in the HBECs. (F-G) The protein expression of p-p65 and p65 in HBECs
  was measured by western blotting and immunofluorescence staining (scale bar =10
  μm). (H) The protein expression of cJUN and FOS in HBECs was determined by western
  blotting. (I) Immunofluorescence showing the expression of cJUN in HBECs (scale
  bar =10 μm). *P<0.05, **P<0.01, ***P<0.001, ****P<0.0001
