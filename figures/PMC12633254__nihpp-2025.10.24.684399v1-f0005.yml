figure_title: Phenotyping of subset of non-PIC mutants identified as suppressors of
  initiation reporters
caption: 'a. Guanine metabolism mutants and controls plated as single concentrations
  of cells on phenotyping media. Guanine metabolism gene mutants confer the His+ phenotype
  to cells with the imd2Δ::HIS3 reporter, likely due to the IMD2 promoter’s sensitivity
  to guanine levels. Guanine supplementation suppresses the His+ phenotype of guanine
  pathway mutants (SC-His 2mM 3AT Gua/HCl: left panel) whereas PIC mutants remain
  His+ under the same conditions (SC-His 2mM 3AT Gua/HCl: right panel). Guanine is
  solubilized in 10mM NaOH at a final concentration of 500μM and media must be neutralized
  by equivalent HCl as NaOH alone affects solubility of MPA. b. 10-fold serial dilutions
  of PMR1 or pmr1Δ strains plated on phenotyping media. pmr1Δ suppresses both upstream
  reporters and confers sensitivity to Mn2+'
