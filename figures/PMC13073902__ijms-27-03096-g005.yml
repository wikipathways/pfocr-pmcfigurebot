figure_title: HC-HA/PTX3, the primary component of CLARIX FLO, exerts an analgesic
  effect by suppressing TRPV1 expression and activity.
caption: 'HC-HA/PTX3, the primary component of CLARIX FLO, exerts an analgesic effect
  by suppressing TRPV1 expression and activity. (A,B) Mechanical sensitivity was measured
  1, 2, 4, 24, 28, and 72 h post-surgery after applying 10 μg of HC-HA/PTX3 to the
  L5 DRG. n = 3 male or female mice. * p < 0.05, ** p < 0.01, *** p < 0.001, adhesion
  group vs. 10 μg HHP group via two-way ANOVA. (C,D) The 340 nm/380 nm fluorescence
  ratio reflected cytosolic calcium levels in IB4+ cells before and after stimulation
  with capsaicin (Cap, 0.3 μM). (E) Histograms show the average peak intracellular
  calcium responses within 15 s following stimulation. ** p < 0.01, Cap + HHP 10μM
  group vs. Cap + Vehicle group. n > 15 total cells per group; mice numbers were 6
  to 8. The percentage of responsive neurons in small or medium-sized cells was 75
  to 80%. (F) TRPV1, Nav1.8, and TNFα mRNA levels were measured via RT-qPCR in L5
  DRGs 24 h post-surgery. N = 3; n = 6 DRGs per group. * p < 0.05, adhesion group
  vs. Ctrl group, # p < 0.05, Adhesion + HHP vs. Adhesion group using two-way ANOVA.
  (G) Mechanical sensitivity was measured 24 h post-surgery following application
  of HC-HA/PTX3 with or without 10 μg of anti-CD44 to the L5 DRG. Comparison among
  these groups was performed using two-way ANOVA (24-h vs. Baseline ** p < 0.01. anti-CD44(−)/HHP
  (+) vs. anti-CD44(−)/HHP (−) # p = 0.039. anti-CD44(+)/HHP (+) vs. anti-CD44(−)/HHP
  (+) $ p = 0.041). (H) Calcium imaging showed that HC-HA/PTX3 suppresses activation
  of IB4+ neurons via the CD44 pathway. L5 DRG was collected from mice 24 h after
  surgery (AD + HHP or AD + Veh) for primary culture. The ratio of 340 nm/380 nm represented
  the cytosolic calcium level of IB4+ cells before and after capsaicin (Cap, 0.3 μM)
  stimuli. The purple group/line represents the IB4+ neuron treated with capsaicin
  and anti-CD44'
