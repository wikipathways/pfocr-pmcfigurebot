caption: DB03476 suppresses TLR4/MyD88/NF-κB signaling pathway activation, renal cell
  apoptosis, and inflammatory factor expression in AKI mice. (A,B) Renal p-P65, MyD88,TLR4,
  and P65 expression. (C,D) c-caspase3, Bcl-2, Bax, and caspase-3 protein levels in
  the kidney of mice were quantified using Western blotting. (E,F) IL-6, IL-6R, IL-17,
  and IL-33 protein expressions were measured using Western blotting. The sample size
  was n = 3 per group. Data are presented as mean ± SEM. * p < 0.05, ** p < 0.01,
  *** p < 0.001, **** p < 0.0001
