figure_title: Relative quantities of secreted lipids species in irradiated OBCs.
caption: Relative quantities of secreted lipids species in irradiated OBCs. (A) Peak
  areas of lipids were normalized to the total detected lipid signal. Lipid species
  showing statistically significant changes compared to non-irradiated controls (*P<0.05,
  unpaired t-test) are shown. (B) KEGG pathway enrichment analysis based on the markedly
  altered lipid species using compound IDs (such as C00157 and C04230) was performed
  to identify associated biological pathways and metabolic processes. OBCs, osteoblastic
  cells; ; KEGG, Kyoto Encyclopedia of Genes and Genomes
