figure_title: Significant reduction in proliferation of ACC cells after combined treatment
  of HSP90 and PI3K inhibitors
caption: Graphs representing proliferation curves of SW13 cells treated with HSP90
  and PI3K drugs either as monotherapy or combination therapy of A. STA9090 and PIK75
  B. HSP990 and PIK75 C. AUY922 and PIK7 and D. STA9090 and BGT226 for 7 days. Graphs
  representing proliferation curves of NCI-H295R cells treated with HSP90 and PI3K
  drugs either as monotherapy or combination therapy of E. STA9090 and PIK75 F. HSP990
  and PIK75 G. AUY922 and PIK7 and H. STA9090 and BGT226 for 7 days. Statistical significance
  was calculated for day 7 using student’s t-test. Western blots showing I. inhibition
  of the protein expression of the PI3K pathway members phospho-AKT (ser 473 and thr
  308), phospho-mTOR and 4eBP1 after treatment of the inhibitors STA9090 and PIK75
  for 48hrs and 72hrs respectively, and J. inhibition of phospho-AKT(ser 473), phospho-mTOR
  and 4eBP1 after treatment of the inhibitors STA9090 and BGT226 for 48hrs and 72hrs
  respectively
