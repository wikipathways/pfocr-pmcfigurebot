figure_title: In vitro ROS-scavenging, immunomodulatory, and anti-osteoclastic abilities.
caption: 'In vitro ROS-scavenging, immunomodulatory, and anti-osteoclastic abilities.
  (A) Diagram depicting how SC/MTZ modulates macrophages and BMMs when exposed to
  gentle NIR irradiation. (B-D) Representative images and quantitative analysis of
  DCFH-DA and JC-1 staining in macrophages following different treatments. Scale bar:
  50 μm. (E) Quantitative analysis of the MDA content in macrophages after various
  treatments. (F) Live/dead cell staining and flow cytometry analysis of macrophages
  in each group. Scale bar: 100 μm. (G) Immunofluorescence staining was conducted
  on macrophages to assess the expression of F4/80, iNOS, CD206, TNF-α, and IL-10
  following different treatments. Scale bar: 50 μm. (H) Flow cytometry was used to
  analyze CD86 and CD206 expression levels in macrophages after various treatments.
  (I) Heatmap and western blot analyses were conducted to assess the expression of
  inflammation-related markers in macrophages subjected to various treatments. (J)
  Representative images of DCFH-DA, TRAP, and F-actin ring formation assays in BMMs
  post-treatment. Scale bar: 50 μm (DCFH-DA staining) and 200 μm (TRAP staining and
  F-actin ring formation assay). (K) Quantitative analysis of TRAP staining in each
  group. (L) Immunofluorescence staining of NFATc1 and CTSK in BMMs after various
  treatments. Scale bar: 50 μm. (M-N) Western blot analysis of osteoclastogenesis-
  and NF-κB pathway-related protein expression in BMMs after various treatments. (O)
  Schematic representation of how SC/MTZ+NIR influences macrophage polarization and
  osteoclast activity to promote bone regeneration. Data are expressed as mean ± SD
  (n = 3). Significant differences compared to the PBS group are indicated by *P <
  0.05 and **P < 0.01. Significant differences compared to the SC/MTZ+NIR group are
  indicated by #P < 0.05 and # #P < 0.01'
