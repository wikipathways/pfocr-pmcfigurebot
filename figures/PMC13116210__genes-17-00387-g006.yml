caption: Immune cell infiltration profiles in H-CXCL13 γδT and L-CXCL13 γδT groups
  from TCGA-COAD. (A) GSEA revealing significant enrichment of multiple immune-related
  terms in the H-CXCL13 γδT group. (B) Dotplot showing the enriched KEGG pathways
  in the H-CXCL13 γδT groups. (C) ESTIMATE analysis showing that H-CXCL13 γδT has
  higher ESTIMATE, immune and stromal scores than L-CXCL13 γδT groups. (D) Differences
  in immune activity between H-CXCL13 γδT and L-CXCL13 γδT groups. (E) Heatmap displaying
  elevated immune cell infiltration in the H-CXCL13 γδT group compared with the L-CXCL13
  γδT group. (F) The relative abundance of immune cells between two groups (ns = not
  significant, * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001)
