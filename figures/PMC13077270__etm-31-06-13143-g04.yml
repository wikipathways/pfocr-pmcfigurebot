figure_title: KEGG-based GSEA of transcriptomic changes in FCA-L2 cells following
  GLU treatment after SP infection.
caption: KEGG-based GSEA of transcriptomic changes in FCA-L2 cells following GLU treatment
  after SP infection. (A) KEGG enrichment bubble plot of pathways significantly altered
  in the GLU_SP vs. SP group. The x-axis indicates ES, bubble size represents the
  number of core genes and bubble color corresponds to FDR values. (B-F) GSEA enrichment
  plots and heatmaps of core genes enriched in representative pathways, including
  (B) cell cycle, (C) aminoacyl-tRNA biosynthesis, (D) p53 signaling pathway, (E)
  biosynthesis of nucleotide sugars and (F) amino sugar and nucleotide sugar metabolism.
  Heatmaps display Z-score normalized expression levels (n=4 per group). KEGG, Kyoto
  Encyclopedia of Genes and Genomes; GSEA, gene set enrichment analysis; GLU, glutamine;
  SP, Streptococcus pneumoniae; NC, negative control; ES, enrichment score; FDR, false
  discovery rate
