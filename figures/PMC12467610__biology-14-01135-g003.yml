figure_title: Changes in expression of key Wnt pathway genes following treatment with
  PC3-derived EVs (A–E) in PNT2 cells, significant upregulation was detected for Wnt3a,
  Wnt5a, Fzd7, and ROR2 gene expression in response to treatment with PC3 hypoxia-EVs.
caption: 'Changes in expression of key Wnt pathway genes following treatment with
  PC3-derived EVs (A–E) in PNT2 cells, significant upregulation was detected for Wnt3a,
  Wnt5a, Fzd7, and ROR2 gene expression in response to treatment with PC3 hypoxia-EVs.
  In contrast, sFRP1 mRNA level was significantly downregulated. (F–J) in LNCaP cells,
  PC3 hypoxia-EVs significantly upregulated Wnt3a, Wnt5a, Fzd7 and ROR2 mRNA levels
  while sFRP1 gene expression was significantly downregulated. The bar graphs represent
  the mean of three RNA replicates isolated from control and EV-treated PNT2 and LNCaP
  cells. Light blue: untreated cells; blue: normoxia-EV treated; dark blue: hypoxia-EV
  treated. Data analysed using two-way ANOVA followed by Šídák’s test. Data normalised
  according to RPII expression and analysed using fold analysis, n = 3, p < 0.05.
  * p ≤ 0.05; ** p ≤ 0.01; *** p ≤ 0.001; **** p ≤ 0.0001; ns = not significant; error
  bars indicate SD'
