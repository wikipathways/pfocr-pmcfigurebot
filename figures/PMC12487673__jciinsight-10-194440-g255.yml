figure_title: Differential gene coexpression by survival status
caption: (A) Network of genes coexpressed in BAL of nonsurvivors (right) but not coexpressed
  in survivors (left). Examples of hubs genes (CEACAM6, CXCL17, NFAM1) are shown.
  Examples of differentially coexpressed genes linked to each hub gene are shown (e.g.,
  CEACAM6-FN1 coexpression) to illustrate differential gene-expression. To the right,
  pathway enrichment for hub genes are shown. (B) Network of genes coexpressed in
  peripheral blood of nonsurvivors (right) but not coexpressed in survivors (left).
  Examples of hub genes (ZNF707, GARRE1, TMEM86B) are shown. Examples of differentially
  coexpressed genes linked to each hub gene are shown (e.g., ZNF707-BUB1B coexpression)
  to illustrate differential gene-expression. To the right, pathway enrichment for
  hub genes are shown
