figure_title: Identification of differentially expressed sncRNAs.
caption: Identification of differentially expressed sncRNAs. (A) Volcano plot of sncRNAs
  differentially expressed between cancerous and adjacent normal tissues. (B) Base
  preference of seed sequences in differentially expressed miRNAs and tsRNAs. (C)
  Venn diagram of predicted target genes of differentially expressed miRNAs in three
  databases. (D) Gene Ontology (GO) enrichment analysis of predicted target genes
  of miRNAs. Only the top 15 enriched terms by gene count are shown for each category.
  (E) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway analysis of predicted
  target genes of miRNAs. Only the top 15 pathways with the most significant differences
  are shown. (F) GO enrichment analysis of predicted target genes of tsRNAs. Only
  the top 15 enriched terms by gene count are shown for each category. (G) KEGG pathway
  analysis of predicted target genes of tsRNAs. Only the top 15 pathways with the
  most significant differences are shown. (H) Expression of genes related to the MAPK,
  TGF−β, and FoxO signaling pathways in hypopharyngeal cancer tissues and adjacent
  normal tissues (* p < 0.05; ** p < 0.01)
