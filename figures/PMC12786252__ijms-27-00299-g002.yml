figure_title: 'Neurotoxic pathways of ethanol metabolism: oxidative and non-oxidative
  mechanisms.'
caption: 'Neurotoxic pathways of ethanol metabolism: oxidative and non-oxidative mechanisms.
  The diagram summarizes how chronic ethanol exposure leads to neurodegeneration.
  Ethanol is converted to acetaldehyde, salsolinol, ROS, fatty acid ethyl esters (FAEEs)
  and phosphatidylethanol (PEth) (green box). These reactive intermediates form DNA
  and protein adducts and promote oxidative damage (lipid peroxidation and mitochondrial
  DNA injury; yellow box), which in turn contributes to mitochondrial dysfunction
  (blue box; ↓ ATP production, cytochrome c release, ROS-driven apoptosis). In parallel,
  ethanol and its metabolites activate neuroinflammatory signalling (cytokine release,
  TLR4 activation; red box) and integrate into lipid membranes, disrupting membrane
  fluidity and receptor signalling (turquoise box). All of these processes converge
  on neurodegeneration, especially in dopaminergic circuits (central oval) and contribute
  to the persistence of structural and functional brain damage even after abstinence
  (purple box). Arrows indicate the directional relationships between modules, and
  bidirectional arrows denote vicious cycles between metabolite formation, neuroinflammation
  and neurodegeneration. Created by the authors in Adobe Illustrator version 27.5,
  2023 (created on 29 October 2025)'
