figure_title: Major UPR pathways within the ER and UPR activation controlled by AGR2-IRE1β
  signaling caused by misfolded MUC2 in goblet cells.
caption: Major UPR pathways within the ER and UPR activation controlled by AGR2-IRE1β
  signaling caused by misfolded MUC2 in goblet cells. BiP senses the presence of misfolded
  proteins and releases ATF6, IRE1 and PERK to enter their active states, resulting
  in transcriptional programs that decrease ER stress. Goblet cells possess a relatively
  effective UPR sensor, IRE1β, whose activity is repressed by AGR2, a cell-specific
  chaperone, through a mechanism analogous to the repression of IRE1α by BiP. CHOP,
  CCAAT/enhancer binding protein-homologous protein, a master regulator of ER stress-induced
  apoptosis plays a pro-apoptotic role in the stress response. ER-associated degradation
  pathway transports accumulated unfolded/misfolded proteins from the ER to the cytosol
  for degradation by the ubiquitin-proteasome system. RIDD degrades mRNAs localized
  to the ER membrane through IRE1 RNase activity, thereby reducing the influx of proteins
  into the ER lumen. UPR, unfolded protein response; ER, endoplasmic reticulum; AGR2,
  anterior gradient 2; IRE1β, ER transmembrane inositol-requiring enzyme 1β; ATF6,
  activating transcription factor 6; PERK, pancreatic ER kinase; RIDD, regulated IRE1-dependent
  decay
