figure_title: The illustration depicts a schematic model delineating the operational
  mechanisms of MKRN2 in clear cell renal cell carcinoma (ccRCC).
caption: The illustration depicts a schematic model delineating the operational mechanisms
  of MKRN2 in clear cell renal cell carcinoma (ccRCC). To summarize, our investigation
  discerned that MKRN2, acting as a tumor suppressor, undergoes downregulation in
  ccRCC, a process facilitated by promoter hypermethylation. MKRN2 precisely targets
  PPP2CA at the K41 residue, instigating a sequence of events involving polyubiquitination
  and eventual degradation. Consequently, this molecular process impedes the dephosphorylation
  of the N-terminal segment of β-Catenin, thereby inhibiting the activation of the
  Wnt signaling pathway
article_title: E3 ligase MKRN2 destabilizes PPP2CA proteins to inactivate canonical
  Wnt pathway and mitigates tumorigenesis of clear cell renal cell carcinoma
