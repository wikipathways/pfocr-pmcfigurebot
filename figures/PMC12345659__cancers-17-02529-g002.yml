figure_title: DSP analysis of primary lung cancer and brain metastasis.
caption: DSP analysis of primary lung cancer and brain metastasis. Protein profiling
  of ROIs was performed using oligo-conjugated panel and read out with NanoString
  barcodes. (A) Volcano plot showing differential expression of proteins between patients
  with primary lung cancer and brain metastasis. The x-axis shows the magnitude of
  a protein’s association with metastasis. The y-axis shows the −log10(p value), which
  increases with statistical significance. The horizontal blue line represents the
  p value cutoffs. Comparisons were analyzed using independent t-test. (B–J) Proteins
  associated with adaptive immunity and PTEN/mTOR/STAT3 signaling pathway documented
  lower expression in patients with brain metastasis. (H) However, protein expression
  pS6 was higher in brain metastasis
