caption: 'Gene’s energy expenditure: Schematic representation of the leptin–melanocortin
  signaling pathway, Leptin (LEP) binds to the leptin receptor (LEPR), activating
  downstream components such as SH2B1 and TUB, which in turn stimulate pro-opiomelanocortin
  (POMC) expression. POMC is processed by PCSK1 and CPE to produce α-MSH, which activates
  the melanocortin 4 receptor (MC4R). MC4R signaling regulates food intake and energy
  expenditure through interactions with GRPR, ADCY3, and neuronal factors such as
  SIM1, MYT1L, and BDNF via NTRK2. The right panel illustrates transcription factors
  (POU3F2, NEUROG3, ARTN2, OTP, ISL1) involved in hypothalamic development and neuronal
  differentiation. Note: Solid arrows represent direct activation or signaling relationships,
  while dashed arrows (e.g., between SIM1 and MYT1L) indicate indirect or transcriptional
  regulation. The downward green arrow denotes decreased food intake, and the upward
  yellow arrow indicates increased energy expenditure'
