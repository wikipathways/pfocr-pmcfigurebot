figure_title: The molecular mechanism of donkey and camel milk to combat inflammation.
caption: The molecular mechanism of donkey and camel milk to combat inflammation.
  The figure illustrates that camel and donkey milk work through multiple mechanisms
  to inhibit the NF-κB inflammatory pathway, including regulation of the HMGB1/TLR4/NF-κB/MyD88
  signaling pathway and downregulation of NF-κB pathway activation by decreasing protein
  expression of activated NF-κBp65, p-NF-κBp65, and p-IκBα proteins. In addition,
  the figure demonstrates that camel milk is particularly effective as an anti-inflammatory
  agent—by targeting the phosphorylation step that is essential for MAPK activation,
  it can simultaneously shut down multiple pro-inflammatory pathways (ERK, p38, and
  JNK) that would otherwise lead to production of inflammatory mediators’ land matrix
  metalloproteinases
