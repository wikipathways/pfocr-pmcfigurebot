caption: FB1 activates the Wnt/β-catenin signaling pathway in chicken intestinal organoid
  monolayers. 2D chicken intestinal organoids were treated with 20 μg/mL FB1 for 48
  h. (A–L) mRNA levels of Wnt3a, Lrp5, β-catenin, TCF4, Lgr5, Cyclin D1, c-myc, PCNA,
  Ki67, Bmi1, SOX9 and Lyz of chicken intestinal organoid monolayers. (M) Confocal
  microscopic images showing the expression and subcellular localization of β-catenin.
  Edu is stained green, β-catenin red, and nuclei blue. Scale bar = 50 μm. ** p <
  0.01
