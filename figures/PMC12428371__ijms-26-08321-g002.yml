figure_title: Treatment with erythropoietin (EPO) increases the signal transducer
  and activator of transcription (STAT)3 pathway in the liver of sucrose-induced insulin
  resistance model rats.
caption: 'Treatment with erythropoietin (EPO) increases the signal transducer and
  activator of transcription (STAT)3 pathway in the liver of sucrose-induced insulin
  resistance model rats. The protein expression of phospho-Akt (Ser473, (A)) and phospho-STAT3
  (Tyr705, (B)) in the livers of the control, sucrose-treated, and EPO-treated groups
  was assessed by immunoblotting. While there were no significant differences in the
  expression of phospho-Akt (Ser473) among all groups, treatment with EPO recovered
  the phosphorylation of STAT3 (Tyr705) in the sucrose-induced insulin resistant rat
  liver. The expression of each phosphorylated protein was normalized to that of respective
  total protein. Immunoblot bands were developed by enhanced chemiluminescence and
  quantified by densitometry. Values are expressed as means ± SEM (n = 6/group). One-way
  analysis of variance ANOVA followed by Tukey’s multiple comparisons test was used
  for comparisons among groups. * p < 0.05 vs. control, # p < 0.05 vs. sucrose'
