figure_title: The general mechanism for calycosin-treated osteoarthritis, gouty arthritis,
  and rheumatoid arthritis.
caption: The general mechanism for calycosin-treated osteoarthritis, gouty arthritis,
  and rheumatoid arthritis. Calycosin in osteoarthritis interferes with cell apoptosis
  and inflammation, respectively, by suppressing the PI3K/Akt/FoxO1 pathway and inhibiting
  p65 phosphorylation. Also, it maintains the balance of cartilage synthesis and degradation
  by regulating type II collagen, Sox-9, COX-2, and EGFR molecules. In gouty arthritis,
  calycosin inhibits NF-κB while activating p62/Keap1 pathways to prevent subsequent
  AIM2 inflammasomes-induced inflammatory responses. In rheumatoid arthritis, calycosin
  mainly activates the p62/Nrf2 pathway to up-regulate antioxidant enzymes’ expression
  against inflammation, including HO-1 and NQO-1. It also inhibits JNK and IKK α/β
  to reduce the production of inflammatory cytokines, IL-1β, IL-6, etc. AIM2—absent
  in melanoma 2; ARE—antioxidant response element; COX-2—cyclooxygenase-2; EGFR—epidermal
  growth factor receptor; FoxO1—forkhead box O1; GA—gouty arthritis; HO-1—heme oxygenase-1;
  IKK—IκB kinase; IL—interleukin; JNK—c-Jun N-terminal kinase; Keap1—Kelch-like ECH-associated
  protein 1; NQO-1—NAD(P)H dehydrogenase quinone 1; Nrf2—nuclear factor-erythroid
  2-related factor 2; OA—osteoarthritis; PI3K/Akt—phosphatidylinositol three kinase
  serine/threonine kinase; RA—rheumatoid arthritis; and Sox-9—SRY-Box Transcription
  Factor 9. The red upward arrows indicate increases, the green downward arrows indicate
  decreases, and cross marks represent inhibition
