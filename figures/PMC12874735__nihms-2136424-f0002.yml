figure_title: Multi-level analysis of hypertension-related genes and pathway networks.
caption: Multi-level analysis of hypertension-related genes and pathway networks.
  (A) pHeatmap showing hierarchical clustering of genes involved in blood pressure
  regulation, angiotensin signaling, and associated pathways across key KEGG terms,
  including RAS and various related cardiomyopathy and hormone signaling pathways.
  Gene expression levels are normalized and color-coded from low (blue) to high (red).
  (B) pHeatmap representing enriched pathway-level scores for RAS-related genes across
  KEGG pathways. Each column denotes a pathway, and each row indicates a RAS gene;
  the intensity of red reflects higher enrichment scores x = 1. (C) cNETplot illustrates
  functional interaction networks between LNPEP/IRAP and other genes. Edges indicate
  predicted associations based on shared protein domains (gray lines) and co-expression
  (blue lines)
