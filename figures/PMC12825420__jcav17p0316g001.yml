figure_title: Study workflow and integrative analyses for OSA-associated lung cancer.
caption: Study workflow and integrative analyses for OSA-associated lung cancer. Study
  workflow and integrative analyses for OSA-associated lung cancer. Overview of the
  computational and experimental strategy. Multi-omics data (TCGA-LUAD, GSE301350,
  GSE31210, GSE78820) and single-cell RNA-seq datasets were integrated to quantify
  stemness (CytoTRACE, stemness scores), characterize immune infiltration (CIBERSORT,
  ESTIMATE), and assess functional pathways (GO ontology, and KEGG,). Prognostic modeling
  was performed using LASSO Cox regression and validated in independent cohorts. Immunotherapy
  response was evaluated using TIDE and IMvigor210 datasets, and drug sensitivity
  was predicted using GDSC data. The pipeline highlights the integration of stemness
  quantification, immune landscape profiling, and therapeutic prediction in OSA-associated
  lung cancer
article_title: Single-cell and transcriptomic profiling reveal stemness-driven immune
  evasion in obstructive sleep apnea (OSA) associated lung cancer
