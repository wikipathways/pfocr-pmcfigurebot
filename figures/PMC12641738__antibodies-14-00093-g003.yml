figure_title: Effect of N-glycosylation on IgG and IgM antibody functions.
caption: Effect of N-glycosylation on IgG and IgM antibody functions. (A) The presence
  of the N-glycans at Asn297 is important for the interaction of IgGs with FcRs. The
  increase in galactosylation and the reduction in fucosylation increase the affinity
  of IgG1 for FcγRIII, while the presence of Fuc interferes with the binding of IgG1
  to this receptor. (B) Sialylation increases the binding of IgGs to C1q and induces
  complement activation through the classical pathway. The presence of Gal induces
  IgG hexamerization and complement activation through the classical pathway. The
  presence of Man in IgGs can activate complement through the lectin pathway. (C)
  In IgM, sialic acid-rich N-glycans promote complement activation through the classical
  pathway. Neu5Ac (), Gal (), Man (), Fuc (), increase (↑), decrease (↓). Created
  in https://BioRender.com (accessed on 19 August 2025)
