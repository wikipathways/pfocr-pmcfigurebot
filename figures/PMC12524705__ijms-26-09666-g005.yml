  is mediated by extracellular vesicles (EVs). (A,C) Gene expression profile of EV-treated
  cells: (A) Activation of epithelial-to-mesenchymal transition (EMT) program in non-metastic
  BC cells after adipocyte-derived EV (AdEV) exposure; (C) modulation of apoptotic
  pathway genes in adipocytes treated with TdEV from non-metastatic BC cells. Heat
  map Log(2) fold change. (B,D) Cell proliferation after EV treatment over a 72 h
  period: (B) Proliferation of BC cells after AdEV treatment; (D) adipocyte proliferation
  following treatment with TdEV from non-metastatic BC cells. Sample size 9'
