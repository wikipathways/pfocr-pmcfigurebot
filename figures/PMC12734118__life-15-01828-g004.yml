figure_title: (A) KEGG pathway enrichment and cancer-related mapping of targets associated
  with medicarpin in cholangiocarcinoma.
caption: (A) KEGG pathway enrichment and cancer-related mapping of targets associated
  with medicarpin in cholangiocarcinoma. KEGG pathway enrichment analysis of 44 overlapping
  targets between medicarpin and cholangiocarcinoma, ordered by fold enrichment. The
  most notably enhanced pathways encompass PI3K-Akt signalling, ErbB signalling, and
  other oncogenic processes, including those associated with prostate, colorectal,
  and hepatocellular carcinoma, underscoring medicarpin’s extensive involvement with
  tumour-promoting networks. Colour intensity denotes statistical significance (–log10
  FDR). (B) Mapping of intersecting targets into the KEGG “Pathways in Cancer” diagram
  (23). Red boxes denote proteins or genes that may be influenced by medicarpin, allocated
  within essential oncogenic modules that regulate proliferation, survival, apoptosis,
  angiogenesis, and metastasis. The prevalence of hits in the PI3K/AKT/mTOR and MAPK
  pathways highlights medicarpin’s ability to disrupt key signalling centres that
  promote cholangiocarcinoma advancement
