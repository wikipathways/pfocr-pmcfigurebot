figure_title: Phaseoloidin promotes autophagy via the AMPK/mTOR pathway.
caption: Phaseoloidin promotes autophagy via the AMPK/mTOR pathway. (A) Western blot
  analysis of Pho-AMPK, AMPK, p62 and LC3B in animal groups mentioned above (left)
  and quantification of the band intensity (right). (B) schematic diagram of the phaseoloidin-treated
  cell model. Primary mouse fibroblasts became myofibroblasts after induction by TGF-β1
  for 48 h, then treated with or without phaseoloidin. (C) GFP-LC3B-RFP plasmid transfected
  for 24 h and observed under APOTOME fluorescence microscope. (D) Western blot analysis
  of Pho-mTOR, mTOR, p70S6K, elf-4B, p62 and LC3B in the groups mentioned above (left)
  and quantification of the band intensity (right). (E) Western blot analysis of Pho-AMPK
  and AMPK levels in phaseoloidin-treated primary mouse myofibroblasts (left) and
  quantification of the band intensity (right). (F) Western blot analysis of p70S6K,
  elf-4B, p62, LC3B, and AMPK under Ctl siRNA or AMPK siRNA treated (left) and quantification
  of the band intensity (right). Bars represent 20 μm (C). Data represent the means
  ± S.D. (* p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001)
article_title: Reversal of Myofibroblast Apoptosis Resistance and Collagen Deposition
  by Phaseoloidin-Induced Autophagy Attenuates Pulmonary Fibrosis
