caption: 'Synergistic network of phosphate metabolism and cellular homeostasis [48,50,51,56,59].
  The solid arrow (→) indicates conversion or activation; the dashed arrow (- - →)
  indicates transport; the T-bar arrow (⊥) indicates inhibition. In the vacuole, the
  VTC complex (VTC2/3, VTC4) synthesizes polyphosphate (poly P) using ATP, while PPX1/PPN1
  hydrolyze poly P into inorganic phosphate (Pi). Pi is released to the cytoplasm
  via PHO91 and exported by XPR1. Cytoplasmic Pi regulates this pathway: high Pi inhibits
  the nuclear entry of PHO4, whereas low Pi allows PHO4 to enter the nucleus and activate
  VTC and PHO91, forming a feedback loop. IP7 and SPX proteins participate in this
  regulation, which is essential for maintaining metal ion balance, energy metabolism,
  lipid metabolism, and stress response'
