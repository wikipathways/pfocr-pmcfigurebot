figure_title: GK attenuates DOX-induced cardiomyocyte inflammation, OS, and apoptosis.
caption: 'GK attenuates DOX-induced cardiomyocyte inflammation, OS, and apoptosis.
  (a-c) Inflammatory mediators (TNF-α, IL-6, COX-2) in cardiomyocyte culture supernatants
  were quantified by ELISA to assess GK’s anti-inflammatory effects against DOX stimulation.
  (d, e) ROS generation was measured fluorometrically using DCFH-DA oxidation. Scale
  bar 50 μm. (f, g) OS parameters (SOD activity, MDA content) were determined enzymatically
  to evaluate GK’s antioxidant capacity. (h, i) Apoptotic incidence was quantified
  morphologically via TUNEL assay. Scale bar 50 μm. (j, k) Apoptotic pathway activation
  was examined by immunoblotting key regulators (Bax, Bcl-2, caspase-3 cleavage).
  n = 6. ***p < 0.001 vs. Control; ns p > 0.05, #p < 0.05, ##p < 0.01, ###p < 0.001
  vs. DOX. DOX, doxorubicin; GK, ginkgetin; COX-2, cyclooxygenase-2; ROS, reactive
  oxygen species; ELISA, enzyme-linked immunosorbent assay; OS, oxidative stress;
  TNF-α, tumor necrosis factor-alpha; IL-6, interleukin-6; TUNEL, terminal deoxynucleotidyl
  transferase dUTP nick end labeling'
