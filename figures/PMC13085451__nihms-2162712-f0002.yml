figure_title: TFEB ameliorates DOX-induced endothelial apoptosis and protects against
  ROS production
caption: '(A) WT and EC-Tfeb Tg mice were treated with vehicle or DOX (5 mg/kg, i.v.)
  once weekly for five weeks, for a cumulative dose of 25 mg/kg. At the endpoint (8
  weeks after initial DOX treatment), vascular density was assessed by immunostaining
  CD102, an EC marker. Endothelial apoptosis was evaluated by TUNEL and CD102 (red)
  double staining, with apoptotic ECs indicated by yellow arrowheads. Apoptotic ECs
  and vascular density (vessels/HPF) were quantified and statistically analyzed (n
  = 5–8 per group). Scale bar = 100 μm. (B) Mouse cardiac microvascular endothelial
  cells (MCMECs) isolated from WT and EC-Tfeb Tg mice were treated with DOX (1 μM)
  or vehicle for 24 hours. Apoptosis was assessed by flow cytometry using Annexin
  V and 7-AAD (n = 8). (C) Caspase-3 activity was determined using a Caspase-3 Assay
  Kit (n = 6). (D) HUVECs stably overexpressing TFEB or control ECs (Ctrl) were generated
  using retrovirus transduction. ECs were treated with vehicle or DOX (1 μM) for 24
  hours. Apoptotic cells were determined by flow cytometry analysis of Annexin V and
  7-AAD (n = 5–6). (E) Human cardiac microvascular endothelial cells (HCMECs) were
  transfected with control siRNA (siCtrl) or siRNA targeting TFEB (siTFEB, 20 nM)
  for 48 hours, followed by treatment with DOX (1 μM) for 24 hours. Apoptosis was
  measured by flow cytometry using Annexin V and 7-AAD staining (n = 6–7). (F) RNA
  sequencing analysis was performed on HUVECs stably overexpressing TFEB or Ctrl,
  treated with vehicle or DOX (1 μM) for 24 hours. Pathway analysis was conducted
  on differentially upregulated genes (Ctrl_DOX vs. TFEB_DOX). (G-H) Gene Set Enrichment
  Analysis (GSEA) enrichment plots for the HALLMARK_APOPTOSIS pathway were generated
  by comparing Ctrl_DOX vs. Ctrl_vehicle and TFEB_DOX vs. Ctrl_DOX. Corresponding
  heatmaps display differentially expressed genes (DEGs), where pro-apoptotic genes
  are highlighted in red. The Z-score below each heatmap represents the number of
  standard deviations a gene’s expression level deviates from the mean across all
  samples, indicating relative upregulation or downregulation. N = 5 per group in
  F-H. (I) MCMECs from WT and EC-Tfeb Tg mice were treated with DOX (1 μM) for 8 hours,
  followed by incubation with MitoSOX (5 μM) for 30 min. ROS production was measured
  by flow cytometry, and the median fluorescent density (MFI) of MitoSOX was quantified
  for each group (n = 6). (J) ROS production was measured by flow cytometry analysis
  of MitoSOX in HUVECs stably overexpressing TFEB or Ctrl ECs treated with DOX (1
  μM) for 8 hours (n = 6). (K) HCMECs were transfected with siCtrl or siTFEB (20 nM)
  for 48 hours, then incubated with MitoSOX (5 μM) for 30 min. ROS production was
  evaluated by flow cytometry (n = 6). An unpaired t-test was used in panel A. Data
  in panels B, C, D, E, I, J, and K were analyzed by two-way ANOVA followed by Tukey’s
  post hoc test. Data are presented as mean ± SEM, *P < 0.05, **P < 0.01, ***P < 0.001.
  NES: normalized enrichment score; FDR: false discovery rate'
