figure_title: Schematic representation of the molecular mechanism of A.
caption: Schematic representation of the molecular mechanism of A. rhizogenic-mediated
  hairy root induction in plants. The process begins with the introduction of a recombinant
  plasmid carrying an exogenous gene into A. rhizogens. Upon wounding of plant explants,
  phenolic compounds and other signaling molecules released from the damaged tissue
  activate the bacterial vir genes, initiating the transfer of T-DNA from the Ri plasmid
  into the host plant cells. The T-DNA integrates into the plant genome, leading to
  the expression of rol and auxin-related genes, which disrupt endogenous hormonal
  balance and promote the formation of genetically transformed hairy roots. This transformation
  is further facilitated by bacterial signaling molecules and plant growth regulators,
  resulting in enhanced root proliferation. The establishment of hairy roots in plants
  serve as valuable platforms for metabolic engineering, pathway elucidation, and
  functional genomics. Scalable in bioreactors, these cultures enable sustainable
  production of high-value compounds and can be used to generate rare or novel metabolites
  under controlled conditions
