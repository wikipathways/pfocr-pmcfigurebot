figure_title: Overview of experimental design, data quality, and global transcriptional
  profiling
caption: A. Schematic of the study design and bioinformatics pipeline. Male Dahl SS
  rats were maintained on a normal salt (NS) control diet or switched to a high salt
  (HS) diet at 9–11 weeks of age to induce hypertension and organ injury. Kidney cortex,
  kidney medulla, liver, and heart samples were collected from NS controls and HS-fed
  rats after 7, 14, 21, and 35 days of treatment. RNA was isolated, quality-checked,
  and sequenced. Reads underwent sample-level quality control, alignment, and quantification.
  Downstream analyses included variance-stabilizing transformation (VST), differential
  expression analysis, pathway and upstream regulator enrichment, protein–protein
  interaction network analysis, genome-wide association study (GWAS) integration,
  and drug target analyses. B. Sample–sample Pearson correlation heatmap, annotated
  by organ and time point. C. Heatmap of all significantly differentially expressed
  genes (adjusted P < 0.05), hierarchically clustered by sample (columns) and gene
  (rows). Red boxes highlight major co-expression gene modules segregating primarily
  by organ. D. UMAP embedding of all 120 samples using VST counts, showing predominant
  clustering by organ. Dashed circles highlight zoomed-in views of distinct tissue
  clusters, illustrating separation of NS from HS experimental groups. E. Radial bar
  chart summarizing the number of differentially expressed genes (|log2 fold change|
  ≥ 0.585, equivalent to a fold change ≥ 1.5, adjusted P < 0.05) in each tissue and
  time point, illustrating dynamic and tissue-specific transcriptional responses to
  HS-induced hypertension. CX, cortex; MD, medulla; LV, liver; HR, heart; D7, day
  7; D14, day 14; D21, day 21; and D35, day 35 time points. n = 6 male rats per group
