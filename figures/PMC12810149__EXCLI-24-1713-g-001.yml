figure_title: Graphical Abstract. Environmental noise triggers a cascade of biological
  stress responses that link chronic exposure to cardiovascular disease. Noise-induced
  activation of the brain’s stress pathways leads to the release of catecholamines
  and glucocorticoids, oxidative stress, inflammation, and endothelial dysfunction.
  These mechanisms are further amplified by sleep disruption, circadian rhythm disturbance,
  and epigenetic modifications. The resulting vascular injury promotes hypertension,
  cardiac remodeling, and metabolic dysfunction, ultimately contributing to ischemic
  heart disease, stroke, heart failure, and increased cardiovascular mortality
