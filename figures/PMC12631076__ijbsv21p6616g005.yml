figure_title: FTL promotes ESCC development and metastasis via NRF2 pathway and inhibits
  ferroptosis via NCOA4 protein.
caption: 'FTL promotes ESCC development and metastasis via NRF2 pathway and inhibits
  ferroptosis via NCOA4 protein. (A) Metascape analyses for ESCC FTLhigh and FTLlow
  groups in ESCC single-cell transcriptional landscape. (B) Diagram of exploring upstream
  and downstream genes of FTL in TCGA database. (C) Protein-protein interaction network
  of FTL according to NRF2 and ferroptosis-related proteins. (D) qPCR of HMOX1, FTH1
  in KYSE510 and KYSE520 ESCC cells transfected with shNTC and FTL shRNA. qPCR of
  HMOX1, FTH1 in mEC2 and mEC3 cells transfected with vector and FTL isoform. (E)
  IF double staining of FTL and NCOA4 in KYSE520 ESCC cells transfected with shNTC
  and nuclei stained with DAPI. (F) IF double staining of FTL and NRF2 in KYSE520
  ESCC cells transfected with shNTC and nuclei stained with DAPI. (G) Cell lysates
  from HEK-293T cells transfected with FTL-Flag plasmids subjected to immunoprecipitation
  (IP) with NCOA4 antibody or control immunoglobulin G (IgG). (H) Western blotting
  of HMOX1 in KYSE520 ESCC cells transfected with shNTC, FTL shRNAs and mEC3 cells
  transfected with vector, FTL isoform. β-Actin was used as a loading control. (I)
  Western blotting of NRF2, FTL, FTH1 in mEC2 cells transfected with vector, FTL isoform,
  FTL-NRF2 shRNAs. β-Actin was used as a loading control. Statistical significances:
  *, P < 0.05; **, P <0.01; ***, P < 0.001'
