caption: 'In normal physiological conditions little TBI and NTBI is filtered by the
  glomerular assembly and is reabsorbed and cycled by the proximal tubular cells (PTEC).
  However, in LN, glomerular injury increases the amount of TBI and NTBI which are
  reabsorbed by the PTEC via TfR1, DMT1, ZIP8/14 and MCEC. While TfR1 and DMT1 are
  regulated by the IRP-IRE system, ZIP8/14 and MCEC are not and continue to absorb
  the leaking TBI and NTBI and iron overload the PTEC. This can lead to build up of
  excess labile iron (Fe2+). Iron catalyzes ROS formation via the Fenton reaction
  and can render the PTECs susceptible to ROS mediated injury, mitochondrial damage,
  and induction of ROS dependent inflammatory pathways such as NFκB, JNK, MAPK and
  accelerate the progression to renal failure. In parallel intracellular Fe2+ promotes
  lipid peroxidation and ferroptosis. ACSL4 in conjunction with LPCAT3 converts PUFA
  like AA into their AA-CoA intermediates. These intermediates are esterified into
  PE. Finally, ALOX15 catalyzes the oxidation of these esterified-PE and excessive
  AA-CoA to PE-OOH, thus promoting ferroptosis. Intracellular Fe2+ increases the catalytic
  activity of ALOX15 to accentuate lipid peroxidation and ferroptosis. Additionally,
  Fe2+ promotes the non-enzymatic arm of ferroptosis by catalyzing generation of ROS,
  which target unsaturated phospholipids and convert them to toxic phospholipids hydroperoxides.Abbreviation:
  TBI; transferrin bound iron, NTBI; non transferrin bound iron, TfR1; transferrin
  receptor 1, MCEC; megalin cubulin endocytic complex, FtH: heavy chain ferritin,
  ROS; reactive oxygen species, IRP-IRE; iron regulatory protein-iron response element,
  ACSL4; long-chain acyl-coenzyme A (CoA) synthase 4, LPCAT3; lysophosphatidylcholine
  acyltransferase 3, PUFA; poly unsaturated fatty acid, AA; Arachidonic acid, PE;
  phosphatidylethanolamine, ALOX15; acid-15-lipoxygenase'
