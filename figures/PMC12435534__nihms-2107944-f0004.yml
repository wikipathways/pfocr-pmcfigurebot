figure_title: Transcriptomic analysis of bulk RNA-Seq in geCHO cells expressing sE1E2
caption: (A) Bulk RNA-Seq was performed on geCHO cell clones expressing sE1E2, with
  respective parental cell lines serving as negative controls. Using the DESeq2 package
  in RStudio, we compared producer cell lines to their parental cell lines. The transcriptomic
  analysis revealed approximately >2,500 differentially expressed genes in CTRL and
  CL1 individually (red dots) compared to their respective parental cell lines (blue
  dots) (p-adjusted < 0.05 and Log2(fold-change) > 0) as visualized in the volcano
  plots. (B) Gene Ontology enrichment analysis focused on biological processes across
  statistically significant genes in all producer cell lines. The analysis uncovered
  enriched pathways predominantly associated with cellular processes involving mitotic
  cell cycle process, mRNA/DNA processes, and intracellular transport mechanisms
