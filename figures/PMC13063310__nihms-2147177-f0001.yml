figure_title: Regulation of ER-connected proteostasis and death pathways by the unfolded
  protein response
caption: 'Newly synthesized polypeptides form calcium dependent complexes with BiP.
  With increased translation increased numbers of BIP molecules are titrated away
  from the ER sensors IRE1, PERK, and ATF6, causing their de-repression. Upon activation
  each ER sensor contributes to proteostatic health: IRE1 splices full-length transcripts
  for Xbp1, allowing for the synthesis of a functional transcription factor that increases
  mRNA abundance for gene products that optimize protein synthesis, dimer formation,
  and ER and golgi function; ATF6 controls the expression of protein chaperones and
  enzymes needed for lipid biosynthesis; and PERK can serve to arrest global protein
  translation while also driving the preferential translation of ATF4. By contrast,
  unresolved ER stress can activate up to three pro-apoptotic pathways (shown in red)
  including the CHOP transcription factor, which in turn drives mitochondrial apoptosis
  via BIM (not shown). Created with https://BioRender.com'
