figure_title: Graphical representation of the statistical methods used in this paper
  (using dummy data representing a single county).
caption: Graphical representation of the statistical methods used in this paper (using
  dummy data representing a single county). Panel (a) shows the exposure response
  curve resulting from a distributed lag non-linear model (DLNM). Panel (b) displays
  how this model is applied to the current dataset to create a multi-year timeseries
  of expected values of ED visit counts in the present day data (Present E[Y]). For
  panel (b) and panels (c), (d) and (e), only the summer months of a single year of
  the multi-year time-series is shown. Panel (c) shows how the temperature change
  from different global climate models (GCMs) within a Shared Socio-economic Pathway
  (SSP) is used to estimate the expected value of future ED visits resulting from
  a time-series of present-day temperatures shifted by the estimates of each GCM (e.g.,
  2–4.5_A, 2–4.5_B, and 2–4.5_C all represent different GCMs under SSP 2–4.5). Panel
  (d) shows the bootstrapped difference between present and future expected values
  and the empirical confidence intervals (eCI 95%). Panel (e) shows the daily bootstrapped
  difference across all GCMs within an SSP (i.e., the differences in 2–4.5_A, 2–4.5_B,
  and 2–4.5_C are combined into 2–4.5_*). Panel (f) shows the mean and empirical confidence
  interval (eCI) of the combined difference at the average monthly level across the
  entire timeseries, obtained by bootstrapping and summing values by region and month
