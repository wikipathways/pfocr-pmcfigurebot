figure_title: Macrophage PARP1 alters the metabolite profile in WAT
caption: Untargeted metabolomics analysis in WAT from control and Parp1 KOLysM mice
  after 4 weeks of HFD feeding (n = 4 for each group).(A) Volcano plot showing all
  the detected metabolites. Each dot in the volcano plot represents a metabolite,
  where red dots represent upregulated differential metabolites, green dots represent
  downregulated differential metabolites, and grey dots represent metabolites detected
  but with insignificant differences. The horizontal coordinate represents changes
  in the relative metabolite level between two groups [shown as Log2 (fold change)],
  the vertical coordinate indicates the significance level of difference [shown as
  −Log10 (p-value)], and the size of the dot represents the VIP (variable important
  in projection) score.(B) Heatmap of hierarchical clustering showing differentially
  accumulated metabolites in WAT from Parp1 KOLysM versus control mice. Each row represents
  one metabolite, and each column represents one sample. The relative metabolite level
  is depicted according to the color scale.(C) Bar plot showing KEGG pathway analysis
  of differentially accumulated metabolites in Parp1 KOLysM versus control mice.(D)
  Category scatter plot showing classification of differentially accumulated metabolites.
  Each dot represents a metabolite. The horizontal coordinate represents changes in
  the relative metabolite level between two groups [shown as Log2 (fold change)],
  the vertical coordinate indicates individual category in different color, and the
  size of the dot represents the VIP (variable important in projection) score
