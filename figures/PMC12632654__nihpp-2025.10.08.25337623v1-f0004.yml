figure_title: Pathway function influences AN risk
caption: '(A) A toy figure to illustrate how pathway count in each of the four biological
  groups (i.e., brain, metabolic, immune/stress, reproduction) was generated for each
  individual. Four biological groups were identified based on the names of the 497
  significant pathways themselves or their associated parent nodes given the tree
  structure of Gene Ontology using the GOfuncR package in R. We classified a total
  of 49 brain-related pathways, 126 metabolic pathways, 39 immune/stress-related pathways,
  and 9 reproduction-related pathways. Each pathway pair includes individuals whose
  pathway PRS were ranked at top 10% for both pathways. AN case proportion was then
  calculated for each within-function and across-function pathway pairs. The exact
  AN case proportion for each pathway pair is included in Supplementary Table 16.
  This figure was created using BioRender software (www.biorender.com).(B) Number
  of pathways where the individual ranks in the top 10% for pathway PRS in 49 brain-related
  pathways. Each dot represents a group of individuals with certain number of Top10%
  pathways. Only dots with more than 30 individuals are included for plotting. Pearson
  correlation and its associated p-value are shown in blue.(C) Number of pathways
  where the individual ranks in the top 10% for pathway PRS in 126 metabolic pathways.(D)
  Number of pathways where the individual ranks in the top 10% for pathway PRS in
  39 immune/stress-related pathways.(E) Number of pathways where the individual ranks
  in the top 10% for pathway PRS in 9 reproduction-related pathways.(F) AN proportion
  distribution for pairwise pathways within and across functions. Among 497 AN-associated
  pathways from univariate models, 223 pathways were classified into these 4 groups
  and were used for plotting here. The order is based on median AN proportion per
  category. Significance of overall difference across all groups was examined by Kruskal-Wallis
  test. P-values for all pairwise comparisons across 10 categories are included in
  Supplemental Table 17. The mean correlation for each group is shown at the bottom.(G)
  AN proportion was shown in a heatmap format for individuals with certain number
  of brain-related pathways (x axis) and certain number of metabolic pathways (y axis)
  where they rank at top 10%. Abbreviations: AN=anorexia nervosa, PRS=polygenic risk
  score'
