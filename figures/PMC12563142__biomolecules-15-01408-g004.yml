figure_title: 2-AG is involved in regulating GLT-1 expression in astrocytes via the
  CB1-CREB signal pathway.
caption: '2-AG is involved in regulating GLT-1 expression in astrocytes via the CB1-CREB
  signal pathway. (A,B): Western blotting analysis of CREB and P-CREB in the hippocampus
  followed AM281 (n = 6 mice per group). (C,D): Representative immunofluorescent images
  demonstrating the expression of GFAP (Red), DAPI (Blue), and CREB (Green) (C) or
  P-CREB (Green) (D) in the CA1, DG, and CA3 of Sham, TBI + AM281, and TBI + Vehicle
  group on day 1 post-TBI (n = 9 slices from 3 mice per group). (E,F): Quantification
  of immunofluorescence images in (C,D). Bar = 10 μm. All data were presented with
  the mean ± SEM. * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
