figure_title: Differentially expressed proteins in the secretome of LPS-treated PMNs
  at multiple time points
caption: (A) Volcano plots (unadjusted p-values) comparing ECO vs CTRL (top), ECO
  vs FT (middle), and FT vs CTRL (bottom) at 3 h and 6 h (from left to right). (B)
  Gene Ontology Cellular Component (GO-CC), Biological Process (GO-BP) and Reactome
  pathway enrichment analysis for proteins significantly increased in the ECO vs FT
  comparison at 3 h. (C) GO-CC, Molecular Function (GO-MF) and Reactome pathway enrichment
  analysis for proteins significantly increased in the ECO vs CTRL comparison at 6
  h. DEPs were calculated with limma, with donor as a blocking factor, employing Empirical
  Bayes statistics, and all p-values were two-sided. DEPs were considered at an unadjusted
  p-value < 0.05, indicated by the horizontal dashed line in the volcano plots, with
  upregulated proteins shown in red, downregulated proteins in blue, and non-significant
  proteins in gray. For all GO enrichment analyses, terms were considered significant
  at FDR < 0.05, n = 3
