figure_title: Signaling pathways in cancer progression include the PI3K/Akt/mTOR,
  Hippo–YAP/TAZ, Wnt/β-catenin, and RAS/MAPK pathways.
caption: Signaling pathways in cancer progression include the PI3K/Akt/mTOR, Hippo–YAP/TAZ,
  Wnt/β-catenin, and RAS/MAPK pathways. The figure highlights the regulatory roles
  of miRNAs in these networks, either promoting or inhibiting tumor-related processes
  such as proliferation, invasion, angiogenesis, metastasis, apoptosis, and drug resistance.
  (A) In the PI3K/Akt/mTOR pathway, miRNAs regulate central effectors including PI3K,
  Akt, and mTOR, thereby influencing cell survival and differentiation. (B) In the
  Hippo–YAP/TAZ pathway, miRNAs control upstream kinases and YAP/TAZ transcriptional
  activity, shaping tumorigenesis and metastatic potential. (C) In the Wnt/β-catenin
  pathway, miRNAs modulate β-catenin stability and transcriptional activity, contributing
  to tissue homeostasis, invasion, and therapy sensitivity. (D) In the RAS/MAPK pathway,
  miRNAs target RAS, RAF, MEK, and ERK signaling, driving tumor growth, angiogenesis,
  and invasive behavior. miRNAs shown in green function as tumor suppressors, whereas
  those in red act as oncomiRs, underscoring their dual roles in cancer. Akt—protein
  kinase B; APC—adenomatous polyposis coli; AXIN—axis inhibition protein; β-TrCP—beta-transducin
  repeat-containing protein; CK1—casein kinase 1; DVL—Dishevelled segment polarity
  protein; ERK—extracellular signal-regulated kinase; GDP—guanosine diphosphate; GF—growth
  factor; GRB-2—growth factor receptor-bound protein 2; GSK3—glycogen synthase kinase
  3; GTP—guanosine triphosphate; LATS1/2—large tumor suppressor kinases 1 and 2; MAPK—mitogen-activated
  protein kinase; MEK—MAP/ERK kinase; miR—microRNA; MOB—Mps one binder; MST1/2—mammalian
  Ste20-like serine/threonine kinases 1 and 2; mTOR—mechanistic (mammalian) target
  of rapamycin; P—protein; PI3K—phosphatidylinositol 3-kinase; PTEN—phosphatase and
  tensin homolog; RAF—rapidly accelerated fibrosarcoma; RAS—rat sarcoma small GTPase;
  SAV1—Salvador family WW domain-containing protein 1; SOS—Son of Sevenless; TEAD—TEA
  domain transcription factor; TRIM24—tripartite motif-containing 24; Wnt—Wingless/Int-1;
  WWOX—WW domain-containing oxidoreductase; YAP/TAZ—Yes-associated protein/transcriptional
  co-activator with PDZ-binding motif
