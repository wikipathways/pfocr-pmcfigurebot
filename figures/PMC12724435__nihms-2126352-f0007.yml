figure_title: Protein-Protein Interaction network of enriched genes involved in the
  cell death pathway in SM-injured versus naïve rabbit corneas.
caption: Protein-Protein Interaction network of enriched genes involved in the cell
  death pathway in SM-injured versus naïve rabbit corneas. The network was generated
  using Cytoscape and the cytoHubba plugin was used to identify the influential nodes
  within the network. Nodes are colored based on their influence, with red indicating
  highly influential node that play a critical role within the network. Edges represent
  interactions between proteins, that emphasize the interconnectedness of the nodes
  implicated in cell death processes following mustard gas exposure (adapted from
  Sinha et al., 2025). (For interpretation of the references to color in this figure
  legend, the reader is referred to the Web version of this article.)
