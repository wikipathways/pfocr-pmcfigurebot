figure_title: Schematic diagram illustrating the molecular mechanism of PuWRKY22-mediated
  regulation under ABA stress.
caption: Schematic diagram illustrating the molecular mechanism of PuWRKY22-mediated
  regulation under ABA stress. PuWRKY22 directly binds to W-box elements in the promoter
  of Ptr.PYL4, enhancing its transcription and promoting stomatal closure to reduce
  water loss. Concurrently, PuWRKY22 activates ABA-responsive genes involved in photosynthesis
  (e.g., Ptr.NYC1, Ptr.PSB27-1) and ROS scavenging (e.g., Ptr.SOD2, Ptr.APXT) through
  the ABRE-mediated ABA signaling pathway, thereby improving drought tolerance. Indirect
  regulation of genes lacking W-box elements, such as Ptr.ARF3 and Ptr.GH3.6, likely
  balances stress responses with growth. This integrated regulatory network enhances
  plant adaptation to drought stress
article_title: Populus ussuriensis PuWRKY22 Transcription Factor Activates the ABA
  Receptor PYL4 to Enhance Drought Resistance
