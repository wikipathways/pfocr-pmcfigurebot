figure_title: Glucose is required to maintain basal STAT3 activation and synergizes
  with canonical IL-6-JAK signaling pathways
caption: '(A) HCT116 and SW480 cell lines were treated with increasing concentrations
  of glucose for 24 hours prior to harvesting lysates and probing for phospho-STAT3
  and total STAT3 levels with GAPDH loading control. (B) HCT116 and SW480 cell lines
  were glucose deprived overnight then treated with 25mM glucose and assessed for
  phospho-STAT3, total STAT3, and GAPDH in a temporal manner. (C) HCT116 and SW480
  cell lines treated with glucose (25mM) for 0, 2, or 24 hours and IL-6 (10ng/mL)
  for 0, 0.5, 1, or 2 hours prior to harvesting lysates and probing for phospho-STAT3
  and total STAT3 levels with GAPDH loading control. (D) Top: Schematic of the luciferase
  assay performed. Bottom: Results of luciferase assay done in HEK293T cells co-transfected
  with JAK overexpression constructs. Cells were treated with 0mM or 25mM glucose
  for 24 hours'
article_title: Glucose Metabolism Sustains Aberrant STAT3 Signaling in Colorectal
