figure_title: Dynamics of Torso activity differ from downstream ERK activity
caption: '(A) Imaging of terminal signaling at different nodes: receptor activation
  (Torso::pYtag), intracellular pathway activity (dpERK antibody), and inhibition
  of a nuclear repressor by ERK kinase activity (miniCic).(B) Maximum-intensity projections
  of embryos in NC11 through early NC14 visualized at each node. Left: Torso::pYtag
  images from a single embryo over time. Middle: WT embryos stained for dpERK. Right:
  miniCic::mCherry images from a single embryo over time. Scale bar: 50 μm.(C) Quantification
  of each node across the anterior-posterior axis in each nuclear cycle. Torso::pYtag
  (left) and dpERK (center) intensity values are normalized to the center of the embryo.
  miniCic (right) cytoplasmic:nuclear ratio is normalized to the highest and lowest
  values. Line shows mean ± SEM of n = 10 Torso::pYtag embryos, n = 3 miniCic embryos,
  and n = 8 (NC11+12), 19 (NC13), and 39 (NC14) dpERK embryos.(D and E) Domain width
  (measured as the percentage of embryo length from each pole) (D) and domain amplitude
  (E) over time for each embryo quantified in (C). Mean ± SEM.See also Figure S4 and
  Video S1'
