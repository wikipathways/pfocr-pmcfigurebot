figure_title: Effects of TT-DCM and pectolinarigenin on MAPK pathway activation in
  MDA-MB-231 cells.
caption: Effects of TT-DCM and pectolinarigenin on MAPK pathway activation in MDA-MB-231
  cells. MDA-MB-231 cells were incubated with TT-DCM (0–10 µg/mL; (A)) or pectolinarigenin
  (0–5 µM; (B)) for 24 h prior to protein extraction. Phosphorylation levels of ERK,
  JNK, and p38 were assessed by Western blotting, with band intensities quantified
  using ImageJ software v.1.410. Results are presented as mean ± S.D. from three independent
  experiments. Statistical significance is indicated as * p < 0.05, ** p < 0.01, and
  *** p < 0.001
