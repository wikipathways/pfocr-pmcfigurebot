caption: Validation of transcriptomic results. (A) Five genes associated with adrenergic
  signaling in cardiomyocytes were verified using qRT-PCR and verified using the fpkm
  values in the transcriptome data. (B) Five genes associated with PPAR signaling
  pathway were verified using qRT-PCR (n = 6) and verified using the fpkm values (n
  = 4) in the transcriptome data. Data are presented as the mean ± SEM. Asterisks
  indicate a significant difference between treatment group and control (* p < 0.05;
  ** p < 0.01)
