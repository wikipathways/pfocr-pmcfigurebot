figure_title: Qualitative interaction in the association between sex and age on IL-6
  and coagulation pathway protein levels
caption: Composite mean IL-6 and coagulation response protein level scores were calculated
  among all z-scored proteins, and adjusted means were calculated for each age-sex
  stratum and compared. For the IL-6 pathway, similar to the interferon-α pathway,
  there were minimal changes with age among men but statistically significant changes
  with age among women (A). There were similar findings in the coagulation pathway
  (B). Both models were adjusted for race, smoking status, IDU history, HCV serostatus,
  nadir CD4+, ASCVD risk score, MSM status, obesity, and CNICS site
article_title: Age modifies the association between sex and the plasma inflammatory
  proteome in treated HIV
