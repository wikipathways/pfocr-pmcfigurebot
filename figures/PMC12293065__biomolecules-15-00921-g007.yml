figure_title: The role of netrin-1 in diabetes.
caption: The role of netrin-1 in diabetes. Netrin-1 binds to A2BR on macrophages,
  activates the STAT/PPARγ signaling pathway, and regulates M2 transformation in macrophages.
  And through factors such as TGF-β, IGF-1, and VEGF secreted by macrophages, it works
  synergistically with endothelial cells to promote vascular regeneration and wound
  healing
