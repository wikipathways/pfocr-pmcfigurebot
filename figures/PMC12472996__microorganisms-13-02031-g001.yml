figure_title: Sampling distribution and genomic signatures of Mycoplasma bovis (M.
caption: 'Sampling distribution and genomic signatures of Mycoplasma bovis (M. bovis)
  strain XJ01. (A) Spatial distribution of sampling sites across Xinjiang (8 cattle
  herds; 84 nasal swabs plus 4 tissue samples). (B) Protein-coding gene length distribution
  of XJ01 strain: 939 genes predominantly clustered in 200–1000 bp (67.2%) and >2000
  bp (29.8%) ranges. (C) COG functional classification: Translation/ribosome biogenesis
  constituted the largest category (118/324, 36.4%) among 34.5% annotated genes. (D)
  GO term annotation: Metabolic processes (417/619) and catalytic activity (379/619)
  represented dominant biological functions. (E) KEGG pathway distribution: Metabolism-associated
  genes accounted for 31.7% of annotations (112/274 mapped to global metabolic pathways)'
