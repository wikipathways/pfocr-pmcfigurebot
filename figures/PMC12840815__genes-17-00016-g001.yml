figure_title: Overview of transcriptional regulation of riboflavin (vitamin B2) metabolism
  in Arabidopsis.
caption: Overview of transcriptional regulation of riboflavin (vitamin B2) metabolism
  in Arabidopsis. (A) Chemical structures of riboflavin, FMN, and FAD; the schematic
  was adapted from Martin et al. 2020 [22]. (B) Riboflavin metabolic pathway in A.
  thaliana based on KEGG pathway and Gerdes et al. 2012 [4]. Green and purple panels
  represent biosynthesis steps located in chloroplast and cytosol, respectively. The
  shaded arrow indicates flavin transport from the chloroplast to the cytosol, though
  the underlying mechanism remains unknown. (C) Spatiotemporal gene expression analysis
  of Arabidopsis riboflavin metabolic pathway. RNA-seq data were retrieved from the
  Transcription Variation Analysis database (TraVADB). Colors denote “0–1”-normalized
  values of the read counts with the TMM method. Squares indicate tissues and developmental
  stages with higher gene expression; (D) differential expression of flavin-metabolism-related
  genes under osmotic and salt stress conditions. Bar plots show gene expression fold
  change (log2FC; stress vs. control) of riboflavin metabolism genes at four time
  points (3, 6, 12, and 24 h) under osmotic stress and salt stress. Positive and negative
  values indicate upregulation and downregulation of gene expression, respectively,
  relative to control samples. Red dashed lines denote ±0.5 log2FC thresholds. Bar
  colors correspond to the duration of the stress treatment. Gene expression values
  were retrieved from the ePlant database [9]; (E) distribution of cis-regulatory
  elements within the promoter regions of riboflavin genes. The color scale denotes
  the number of cis elements identified. Cis-element analysis was performed using
  the PlantCARE database [8]
