figure_title: M1-polarized macrophages enhance SphK1 expression in PACs through the
  TNF-α/NF-κB pathway.
caption: M1-polarized macrophages enhance SphK1 expression in PACs through the TNF-α/NF-κB
  pathway. (A-B) LDH level in the culture media of 266-6 cells treated with CMS1P
  or CMLPS. (C) Western blot analysis of SphK1 expression in CMS1P or CMLPS-treated
  266-6 cells. (D) The mRNA level of SphK1 in 266-6 cells under the treatment of TNF-α
  or IL-1β. (E) Schematic illustration of the NF-κB in the promoter of SphK1. (F)
  The protein level of NF-κB p65 and p-p65 in CMS1P or CMLPS-treated 266-6 cells.
  (G-H) The protein level of SphK1, NF-κB p65 and p-p65 in 266-6 cells pretreated
  with CMCM-CCK. (I) ChIP assays with anti-NF-κB antibody verifying the binding of
  NF-κB in the SphK1 promoter, and with knockdown of NF-κB. (J) 266-6 cells were transfected
  with pGL3 reporter vector containing WT or MUT SphK1 promoter. Luciferase activity
  was measured using the dual-luciferase reporter assay system. (K) The mRNA and protein
  levels of SphK1 were determined when NF-κB was knockdown in 266-6 cells. *P <0.05;
  **P <0.01; ***P <0.001; NS, no significance
