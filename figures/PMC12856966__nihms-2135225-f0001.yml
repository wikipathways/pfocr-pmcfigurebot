figure_title: Selected ALS-mutated genes associated with autophagy
caption: Several genes that are mutated in ALS converge on key aspects of autophagy
  in both neuronal and non-neuronal cells in the CNS and in muscle fibres. For instance,
  C9ORF72, TBK1, VAPB, and UBQLN2 encode proteins that play direct roles in the initiation
  of autophagy. Mutations in these genes lead to various issues, including the accumulation
  of dipeptide repeat proteins, reduced activation of the autophagy receptors, disruption
  of autophagic flux, and impaired regulation of autophagy initiation and lysosomal
  acidification. The autophagy receptors OPTN and SQSTM1/p6 are crucial for selectively
  recognizing cargo; mutations in their genes hinder binding to ubiquitinated substrates,
  thereby disrupting autophagosome maturation. Additionally, genes encoding proteins
  involved in autophagosome maturation and fusion include CHMP2B, VCP, and TBK1. Mutations
  in CHMP2B affect the function of the ESCRT-III complex and the fusion process between
  autophagosome and lysosomes. In contrast, mutations in VCP cause aberrant activation
  of autophagy, which also impairs autophagosome–lysosome fusion. The regulation of
  endosomal maturation involves ALS2, FIG4, and VCP. DCTN1, KIF5A, and TUBA4A are
  critical for microtubule-based transport. Mutated SOD1 reduces the efficiency of
  the ubiquitin proteosome system and the degradation of misfolded TDP-43. As a result,
  dysfunctional proteins encoded by these genes lead to a blockage of the autophagic
  pathway, contributing to the accumulation of protein aggregates within MNs, glial
  cells, and muscle cells. Created in BioRender. Cristofani, R. (2026) https://BioRender.com/awb8cmm
