figure_title: KLFs in the Notch pathway.
caption: KLFs in the Notch pathway. The Notch pathway, initiated by ligand (DLL1,
  DLL3, DLL4, Jagged1, Jagged2) binding to Notch receptors (NOTCH1–4), triggers sequential
  proteolytic cleavages by ADAM metalloproteases (ADAM10 or ADAM17) and γ-secretase,
  releasing the intracellular Notch domain (ICN). ICN translocate to the nucleus,
  forming a transcriptional activation complex with CSL and MAML, and recruiting cofactors
  such as p300 and KDMA1. In the small intestine and colon, Notch1-mediated activation
  of HES1 represses KLF4, inhibiting goblet cell differentiation. In Barrett’s esophagus,
  Notch1 inhibition activates KLF4, inducing columnar cell lineage markers and glandular
  mucins while reducing squamous keratins. Organoid differentiation from colon tumors
  requires BMP activation to induce enterocyte markers (KLF4, KRT20, CA1, FABP2) and
  Notch inhibition to promote goblet cell markers (TFF2, TFF3, AGR2). KLF5 supports
  intestinal stem cell self-renewal and regenerative capacity by regulating Wnt/Notch
  target gene enhancers; its loss leads to premature differentiation and stem cell
  depletion. Created with BioRender.com
