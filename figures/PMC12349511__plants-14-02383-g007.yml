figure_title: KEGG pathway enrichment analysis of differentially accumulated metabolites
  (DAMs) in sweet potato (Ipomoea batatas L.
caption: 'KEGG pathway enrichment analysis of differentially accumulated metabolites
  (DAMs) in sweet potato (Ipomoea batatas L.) leaves under drought stress at different
  growth stages. The top 30 enriched KEGG metabolic pathways identified from pairwise
  comparisons are shown: (a) CK (control; soil moisture maintained at 75 ± 5% field
  capacity (FC) throughout the growth period) vs. DS1 (drought stress; soil moisture
  maintained at 45 ± 5% FC for 15 days during the branching and tuber formation stage,
  55–70 days after planting); (b) CK vs. DS2 (drought stress; soil moisture maintained
  at 45 ± 5% FC for 15 days during the storage root expansion stage, 90–105 days after
  planting); and (c) DS1 vs. DS2. The x–axis represents the Rich factor (the proportion
  of DAMs in each pathway relative to the total annotated metabolites). Dot size reflects
  the number of significantly enriched DAMs, while dot color indicates statistical
  significance, with red representing higher significance (smaller p-values)'
