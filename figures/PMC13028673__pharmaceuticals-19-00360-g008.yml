figure_title: YXJDF-containing serum activates the PTEN-induced putative kinase 1
  (PINK1)/Parkin-mediated mitophagy pathway in angiotensin II (Ang II)-treated HL-1
  cardiomyocytes.
caption: |-
  YXJDF-containing serum activates the PTEN-induced putative kinase 1 (PINK1)/Parkin-mediated mitophagy pathway in angiotensin II (Ang II)-treated HL-1 cardiomyocytes. (A–D) Quantitative real-time PCR (qRT-PCR) analysis of Pink1, Park2, Becn1, and Sqstm1 mRNA expression in each group. (E) Representative Western blot bands showing protein expression of PINK1, Parkin, Beclin-1, p62, autophagy-related protein 16-like 1 (ATG16L1), translocase of outer mitochondrial membrane 20 (TOM20), and microtubule-associated protein 1 light chain 3 (LC3)-I, and LC3-II. (F–L) Quantification of PINK1 (F), Parkin (G), Beclin-1 (H), p62 (I), ATG16L1 (J), TOM20 (K), and LC3-II/LC3-I ratio (L) based on Western blot. (M,N) Representative immunofluorescence images (M) and quantitative analysis (N) of PINK1 and Parkin expression and subcellular localization in HL-1 cells. Nuclei were stained with 4′,6-diamidino-2-phenylindole (DAPI, blue), and target proteins were labeled in red. Data are expressed as mean ± SD (n = 3–5 biological replicates per group). ##
  p < 0.01, ###
  p < 0.001 vs. Control; * p < 0.05, ** p < 0.01, *** p < 0.001 vs. Model. Abbreviations: YXJDF, serum obtained from rats treated with QiShen granule; TMZ, trimetazidine
