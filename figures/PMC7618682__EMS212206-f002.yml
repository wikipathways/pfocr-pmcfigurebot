figure_title: Nutrient classes and their effects on population ecology and species
  coexistence
caption: '(A–C) Cartoons to relate the nutrient classes to illustrative metabolic
  networks: (A) essential nutrients, where a carbon source drives catabolism (pink)
  and a nitrogen source drives anabolism (green)31; (B) substitutable nutrients, where
  glucose (pink) and galactose (green) can source catabolism along different pathways32,33;
  and (C) enhancer nutrients, where oxygen enhances metabolism by enabling respiration
  of a carbon source (green) over fermentation (pink).(D–F) Tilman’s graphical approach
  relates nutrient concentrations to population growth34 for (D) essential nutrients,
  (E) substitutable nutrients, and (F) enhancer nutrients. Here, the black line shows
  where microbial population growth is exactly balanced by loss (dilution) to give
  a zero population growth rate. This black line, known as the zero net growth isocline,
  then separates regions where nutrients cannot support population growth (white region)
  and regions where growth is sustained by an increased investment into a given metabolic
  pathway (pink/green regions). The zero net growth isocline does not cross either
  axis for two essential nutrients, because the population will crash when either
  is too low (D). By contrast, substitutable nutrients can compensate for one another,
  which is seen by the intersections of the zero net growth isocline with each nutrient
  axis (E). When the zero net growth isocline intersects only one nutrient axis, one
  nutrient is essential while the other can only enhance growth, an enhancer nutrient
  (F).(G–I) Plots for two species to understand whether coexistence or competitive
  exclusion is expected with changes in nutrient concentrations for (G) essential
  nutrients, (H) substitutable nutrients, and (I) in the presence of enhancers. Two
  microbial species (represented by red and blue rods; their zero net growth isoclines
  are shown as a solid line of the respective color) can go extinct (white region),
  competitively exclude each other (blue/red regions), or coexist (gray region), depending
  on nutrient supply'
