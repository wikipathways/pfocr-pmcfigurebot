figure_title: Assembly pathway and structural features of intermediates that accumulate
  in the S4KO
caption: (A) CyoEM density maps of distinct SC assembly states generated from the
  S4KO mouse liver data. The reconstructions are organized according to our model
  of CI assembly (light green box) and degradation (pink box). The additional Q/P
  assembly intermediate formed by binding of NDUFA6 (A6, red) and NDUFAB1-α (AB1-α,
  lilac) is highlighted with a purple background. (B) Matrix view of CIQ/P intermediate
  (representative of both SCQ/P,3 and SCQ/P/A6,3) with the cryoEM map of the S3 C-terminus
  shown in yellow and the rest of NDUFS3 (S3), NDUFS8 (S8) and NDUFS2 (S2) shown in
  surface and labeled, CI FeS clusters are shown colored by atom (sulfur yellow and
  iron orange) and labeled. (C) Matrix view of full CI (representative of SC1/AF2,3,
  SC1/pS6,3 and SC1,3) with the N-module subunits hidden with S3 C-terminal density
  and subunits shown as in (B). (D) Back view of CIQ/P intermediate (representative
  of both SCQ/P,3 and SCQ/P/A6,3) with NDUFAF2 hidden and S3 C-terminal density, FeS
  clusters and subunits shown as in (B). (E) Back view of full CI (representative
  of SC1/AF2,3, SC1/pS6,3 and SC1,3) with NDUFAF2/NDUFS6/NDUFA12 hidden with S3 C-terminal
  density and subunits shown as in (B) and NDUFS1 shown in light orange and label.
  (F) Overlay of SCQ/P,3 (CIQ/P light blue, CIII2 green and NDUFA5 (A5) pink) and
  SCQ/P/A6,3 (CIQ/P/A6 dark blue, CIII2 green, A5 dark red, A6 red and AB1-α lilac).
  Structures were aligned by the MA and the difference in the position of the Q-module
  is indicated with arrows. Subunit NDUFA10 (A10) is circled and labeled. (G) CryoEM
  density map for Q-module subunits (NDUFS2 orange, NDUFS3 yellow, NDUFS8 sea green,
  NDUFA9 purple, NDUFA6 red, NUDFAB1-α lilac) and ND1 light blue and ND3 green of
  showing the position of SCQ/P,3 (left) and SCQ/P/A6,3 (right). (H) Similar to (G)
  with NDUFS3, NDUFS8, NDUFA6 and NDUFAB1-α removed to reveal the structured ND3 TMH1–2
  loop and NDUFA9-latch in SCQ/P/A6,3, NDUFS7 density in pale green. Insets in (A-H)
  show viewing angle relative to the side view of the SCs with the matrix side up
  and CI blue and CIII2 green. (I) CryoEM density map and model for, from left to
  right, ND6 TMH3 from SC1/AF2,3 open, SC1/AF2,3 closed, SCQ/P,3 and SCQ/P/A6,3. The
  location and assignment of the π-bulge-α-helix transition is indicated. (J) Overlay
  of SCQ/P,3 (CIQ/P light blue) and SCQ/P/A6,3 (CIQ/P/A6 dark blue and NDUFA6 red,
  NDUFAB1-α removed for clarity) showing the NDUFA9 conformational change induced
  by binding of NDUFA6). Star marks the equivalent position of the NDUFA6G60D mutation
  in C. elegans
