figure_title: CHIKV replicon used in this study.
caption: 'CHIKV replicon used in this study. (A) Schematic of proposed alphavirus
  polyprotein processing pathways. Following entry and uncoating, the genomic RNA
  (gRNA) undergoes cap-dependent translation through both suppression and non-suppression
  mechanisms. Without suppression, translation terminates at the leaky opal stop codon
  at the end of nsP3, producing the P123 polyprotein, which undergoes cis-cleavage,
  yielding P12 and nsP3. P12 is further processed into nsP1 and nsP2. In the suppression
  pathway, opal read-through produces P1234, which is cleaved in stages to yield P12
  and P34, and subsequently cleaved into nsP1/nsP2 and nsP3/nsP4. (B) Organization
  of the CHIKV genome and replicon (rCHIKV-sg-nLuc). The positive-strand RNA genome
  is capped at the 5′ end and polyadenylated at the 3′ end. ORF-1 encodes nsP1–4,
  followed by a 26S subgenomic promoter and ORF-2 encoding structural proteins (C,
  E3, E2, 6K, E1). The replicon replaces structural proteins with nanoluciferase (nLuc),
  expressed from the subgenomic RNA. (C) Promoter and cap analog comparison: SP6 promoter
  with ARCA (GA) vs. T7 promoter optimized for CleanCap (AU). (D) Chemical structures
  of ARCA and CleanCap AU used in in vitro transcription of replicons. (E) Comparison
  of capped rCHIKV-sg-nLuc RNAs. AU-capped RNAs yielded stronger luciferase signals
  relative to GA-capped transcripts. The GAA mutant of nsP4 (polymerase-inactive)
  produced only a background signal. (F) Fluorescent reporter version (rCHIKV-sg-UnaG),
  UnaG placed in ORF-2. Transfected HeLa cells displayed UnaG fluorescence (green),
  with tubulin immunostaining (magenta) marking cell boundaries. Mock controls lacked
  UnaG signal'
