figure_title: P2rx7 deficiency dampens pathological EV secretion and EV-protein network
  associated with disease phenotypes in PS19 mice
caption: |-
  a, Schematic design for BDEV isolation from mice for nanoflow cytometry analysis and data-independent acquisition (DIA) mass spectrometry. b, Representative cryo-EM images of BDEVs isolated from the brains of 9.5-month-old mice. c, Western blot analysis of the brain and BDEV lysates from WT, PS19 and PS19/P2rx7−/− mice for common EV (Alix, CD81 and ANXA2) and non-EV (GM130 and EEA1) protein markers. d-f, Nanoflow cytometry analysis of BDEV size distribution (d and e) and particle concentration (f) (n= 6 WT mice, n= 6 PS19 mice, n=4 PS19/P2rx7−/− mice; one-way ANOVA with Holm–Šidák post hoc analysis). g, Venn diagram displaying the number of BDEV proteins found per group (n= 5 mice per group). h, Tau protein abundance in BDEVs quantified by mass spectrometry analysis. i, Venn diagram and enriched pathway terms of differentially expressed proteins recovered by P2rx7 deficiency in PS19 mice. j, BDEV protein module correlations with the main disease phenotypes. k, Comparison of the first principal component of each module (eigenprotein) by genotype using the top 4 significantly correlated modules (n= 5 WT mice, n= 5 PS19 mice and n= 5 PS19/P2rx7−/− mice; Kruskal–Wallis test with Wilcoxon test post hoc analysis). Gene Ontology (GO) annotation was performed with the main DEPs from each module. All bar graphs represent the mean ± SEM; *P < 0.05, **P < 0.01, ***P < 0.001 and **** or #
  P < 0.0001
