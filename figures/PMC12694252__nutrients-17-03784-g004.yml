figure_title: 'Anti-inflammatory effects of HTyr and atherosclerosis: proposed mechanisms.'
caption: 'Anti-inflammatory effects of HTyr and atherosclerosis: proposed mechanisms.
  The diagram illustrates the proposed mechanisms by which HTyr exerts anti-inflammatory
  effects that contribute to the attenuation of atherosclerosis lesions. HTyr plays
  a role in enhancing endothelial function, reducing inflammation and oxidative stress,
  promoting reverse cholesterol transport, and decreasing monocyte adhesion to the
  vascular endothelium. Key pathways involved include the modulation of inflammatory
  markers (e.g., CRP, TNF-α, IL-6), oxidative stress markers (e.g., malondialdehyde,
  ox-LDL), and adhesion molecules (e.g., ICAM-1, VCAM-1). ABCA1: ATP binding cassette
  subfamily a member 1, CFR: coronary flow reserve, COX-2: cyclooxygenase-2, CRP:
  C-reactive protein, FMD: flow-mediated dilation, HDL: high-density lipoprotein,
  ICAM-1: intercellular adhesion molecule 1, IL-1β: interleukin-1 beta, IL-1α: interleukin-1
  alpha, IL-6: interleukin-6, iNOS: inducible nitric oxide synthase, LOX: lipoxygenase,
  LXRα: liver X receptor alpha, MDA: malondialdehyde, MMP-9: matrix metallopeptidase
  9, NF-κB: nuclear factor kappa B, ox-LDL: oxidized low-density lipoprotein, PBR:
  perfused boundary region, PCSK9: proprotein convertase subtilisin/kexin type 9,
  PPARγ: peroxisome proliferator-activated receptor gamma, PWV: pulse wave velocity,
  RCT: reverse cholesterol transport, ROS: reactive oxygen species, TG: triglyceride,
  TNF-α: tumor necrosis factor-alpha, VCAM-1: vascular cell adhesion molecule 1. Note:
  Arrows indicate direction of change (↓ decrease; ↑ increase)'
