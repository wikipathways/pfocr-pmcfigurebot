figure_title: Stimulating the ISR pathway is associated with accelerated adult MuSC
  activation through selective translation
caption: A. Schematic of single muscle fibers from adult mice (3-6 months) treated
  either with DMSO, 10 μM Sal003 (ISR-a) or 200 nM ISRIB (ISR-i), pulsed with EdU
  and analyzed at 48 hours in culture (top); Q = quiescent, A = activated. Percentage
  of Pax7+EdU+ cells at 48 hours after ISR-a (bottom left) and ISR-i treatment (bottom
  right). Mean±SEM; n=3; *p<0.05.B. Schematic of FACS sorted adult MuSCs in vitro
  cultured in DMSO, ISR-a or ISR-i for 48 hours (top). Percentage of Casp3+ myogenic
  cells at 48 hours after treatment (bottom). Mean±SEM; n=3; ***p<0.001.C. Schematic
  of single muscle fibers from adult mice (3-6 months) treated either with DMSO, ISR-a
  or ISR-i and cultured for 72 hours in culture (top); Q = quiescent, A = activated,
  D = differentiated. Percentage of Pax7−/MyoG+ (orange) and Pax7+/MyoG− (purple)
  cells at 72 hours in culture after ISR-a treatment (bottom left) and ISR-i treatment
  (bottom right). Mean±SEM; n=2, *p<0.05.D. Schematic of FACS sorted adult MuSCs in
  vitro cultured in DMSO, 10 μM rapamycin, ISR-a or ISR-i for 48 hours (top); Q =
  quiescent, A = activated. Percentage of EdU+ FACS sorted myogenic cells at 48 hours
  after DMSO, Rapamycin, ISR-a or ISR-i treatment. Mean±SEM; n=3; *p<0.05; **p<0.01.E.
  Schematic of FACS sorted adult MuSCs in vitro cultured in DMSO, ISR-a, 100 μg/ml
  cycloheximide (CHX), or CHX+ISR-a for 48 hours (top); Q = quiescent, A = activated.
  Percentage of EdU+ FACS sorted myogenic cells at 48 hours after DMSO, ISR-a, CHX,
  or CHX+ISR-a treatment. Mean±SEM; n=3; *p<0.05; **p<0.01, ***p<0.001.F. Schematic
  of FACS sorted adult MuSCs in vitro cultured in ISR-a pulsed with EdU and ATF4 shRNA
  for 48 hours (top). Percentage of Pax7+EdU+ cells at 48 hours after ISR-a, ATF4
  shRNA or with ISR-a+ATF4 shRNA (bottom). Mean±SEM; n=3; *p<0.05
