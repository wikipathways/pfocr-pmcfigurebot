figure_title: Expression of genes involved in the IL-6 signaling pathway in cultured
  MCF-7 cells.
caption: Expression of genes involved in the IL-6 signaling pathway in cultured MCF-7
  cells. The bar chart illustrates the relative expression levels of IL6, IL6RST,
  and STAT3 in MCF-7 cells treated with 20% ADSC-derived extracellular vesicles (ADSC-EVs)
  compared with the control group (MCF-7 cultured in DMEM). A slight decrease was
  observed in IL6 expression, while IL6RST and STAT3 were significantly downregulated
  (** p < 0.01). These findings indicate that ADSC-EVs markedly suppress the IL-6/STAT3
  signaling axis, which plays a key role in breast cancer cell survival, proliferation,
  and migration, thereby contributing to the inhibitory effects of EVs on MCF-7 cells
