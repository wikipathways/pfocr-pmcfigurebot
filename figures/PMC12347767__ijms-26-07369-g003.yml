figure_title: Proteomic profiling of nisin (N)-treated HKB-11 cells reveals distinct
  molecular responses.
caption: Proteomic profiling of nisin (N)-treated HKB-11 cells reveals distinct molecular
  responses. (A) Ingenuity Pathway Analysis (IPA) graphical summary depicting enriched
  biological pathways and molecular functions based on significantly regulated proteins
  following treatment with N (5600 µM). Orange nodes represent predicted activation,
  blue nodes indicate predicted inhibition, and grey nodes show no prediction. Solid
  arrows denote direct interactions, while dashed arrows represent inferred interactions.
  (B) Volcano plot showing global changes in protein expression between nisin-treated
  vs. untreated HKB-11 cells. Red dots indicate significantly upregulated proteins,
  blue dots indicate significantly downregulated proteins, and grey dots represent
  non-significant changes or proteins that do not meet analysis thresholds. Significance
  was determined by absolute log2 fold change ≥ 0.58 and Q-value ≤ 0.05. Prominent
  up- and down-regulated proteins are labelled, highlighting key alterations in response
  to nisin treatment
