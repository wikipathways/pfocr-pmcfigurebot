caption: Eﬀects of myricetin on apoptosis and autophagy pathways in Huh7- and Hep3B-derived
  LCSCs. Huh7- and Hep3B-derived LCSCs were exposed to myricetin at the indicated
  concentrations for 24 h. The expression of apoptosis and autophagy markers was analyzed
  by western blotting and quantified by normalizing protein intensity to β-actin.
  Data are presented as mean ± SD (n=3). *p<0.05, **p<0.01, ***p<0.001 compared to
  the vehicle control. LCSC, liver cancer stem cell; DR5, death receptor 5; Bad, Bcl-2-associated
  death promoter; Bcl-2, B-cell lymphoma 2; Bax, Bcl-2-associated X protein; Atg5,
  autophagy-related gene 5; LC3B, microtubule-associated protein 1 light chain 3 beta;
  p62, sequestosome 1
