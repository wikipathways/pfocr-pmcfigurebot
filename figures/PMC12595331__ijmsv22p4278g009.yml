figure_title: The effect of erinacine S (ES) on PAK/FAK/p300 pathways in HCT-116/FUR
  cells.
caption: The effect of erinacine S (ES) on PAK/FAK/p300 pathways in HCT-116/FUR cells.
  The protein levels of phosphorylated p21-activated kinase (PAK), focal adhesion
  kinase (FAK), and histone acetyltransferase p300 in the HCT-116/FUR cells treated
  with or without erinacine S were determined at the indicated time by western blotting.
  The protein levels were quantified by densitometry with the ratio of the untreated
  control set as 1-fold. The quantitative data are presented as the mean of three
  repeats from three independent experiments. *p < 0.05, compared with the HCT-116/FUR
  untreated group
