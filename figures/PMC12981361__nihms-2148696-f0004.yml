figure_title: Glycocalyx engineering in Ext1−/− ESCs with Alpl-targeting DNA aptamer
  HS-mimetics promotes FGF2 binding and signaling.
caption: 'Glycocalyx engineering in Ext1−/− ESCs with Alpl-targeting DNA aptamer HS-mimetics
  promotes FGF2 binding and signaling. (A) Alpl-specific DNA aptamer promotes Hep-SA488–19S
  binding to Ext1−/− ESCs. (B) Hep-SA488–19S binding decreases with reduced Alpl expression
  after ESC differentiation. (C) Hep-SA488–19S (100 nM) pretreatment enhances FGF2
  binding to Ext1−/− ESCs compared to Hep-SA488-Scr. (D) FGF2 association with Ext1−/−
  ESCs increases with Hep-SA488–19S concentration. (E) A schematic representation
  of MAPK pathway activation by Hep-SA488–19S through simultaneous engagement of Alpl
  and recruitment of FGF2 to its receptor. (F) Western blot analysis of Erk1/2 phosphorylation
  in Ext1−/− ESCs treated with FGF2 (25 ng/mL, 15 min) and HS-mimetic conjugates (100
  nM). All heparin-containing conjugates restored signaling at this concentration.
  (Mean ± SD, n ≥ 3, Student’s t test: **p < 0.01, ****p < 0.0001)'
