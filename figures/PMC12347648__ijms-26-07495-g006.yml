figure_title: Proposed molecular mechanisms of cognitive dysfunction induced by intermittent
  hypoxia.
caption: Proposed molecular mechanisms of cognitive dysfunction induced by intermittent
  hypoxia. IH leads to increased ROS production, which suppresses the KEAP1-NFE2L2
  antioxidant pathway. This central pathway suppression results in multiple downstream
  effects including decreased suppression of inflammatory signals [21], promotion
  of cell death [23], and loss of neuroprotection [24]. Additionally, IH-induced ROS
  production causes suppression of mitochondrial-related genes (Lars2, Vstm2l) and
  cell junction-related genes (Hmcn1), leading to mitochondrial dysfunction [22].
  These molecular pathways converge to ultimately cause OSAS-related cognitive impairment.
  IH, intermittent hypoxia; ROS, reactive oxygen species
