caption: The figure illustrates the cellular mechanism of cuproptosis, a copper-induced
  cell death pathway. Copper enters cells via CTR1, is reduced by STEAP, and is trafficked
  by chaperones like ATOX1, CCS, and COX17 to destinations including the mitochondria.
  Excess Cu+ binds to lipoylated DLAT in the mitochondria, causing protein aggregation,
  Fe-S cluster loss, and proteotoxic stress. Elesclomol enhances this process, while
  MT, GSH, and transcription factors like Nrf2 help regulate copper levels. Cuproptosis
  is especially relevant in cancer cell metabolism. ES Elesclomol; STEAP Six-transmembrane
  epithelial antigen of the prostate; CTR1 Copper transporter 1; CCS Copper chaperone
  for superoxide dismutase; ATOX1 Antioxidant 1 copper chaperone; COX17 Cytochrome
  c oxidase copper chaperone; SOD1 Superoxide dismutase 1; MT Metallothioneins; GSH
  Glutathione; COA6 Cytochrome c oxidase assembly factor 6; SCO1/2 Synthesis of cytochrome
  c oxidase; COX Cytochrome c oxidase; MTF-1 Metal Regulatory Transcription Factor
  1; Nrf2 Nuclear factor erythroid 2-related factor 2; SLC25A3 Solute carrier family
  25 member 3; ATP7A/B ATPase copper transporting alpha/beta
