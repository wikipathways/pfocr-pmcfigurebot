figure_title: Evaluation of mitochondrial-mediated apoptosis in UVB-exposed HaCaT
  keratinocytes treated with Kjellmaniella crassifolia ethanol extract (KCE)
caption: (A) Mitochondrial membrane potential was assessed using the JC-1 assay. Depolarized
  mitochondrial membranes are shown in green, and polarized membranes are shown in
  red. (B) Western blot analysis of proteins involved in the mitochondria-mediated
  apoptotic pathway, with (C) quantification of relative protein expression normalized
  to β-actin. All experiments were performed in triplicate (n = 3) and data are presented
  as mean ± SD. Stm. refers to the non-treated/negative control group
