figure_title: 'PFAS-induced post-translational modifications:'
caption: PFAS regulates various signaling pathways by altering the phosphorylation
  states of key proteins involved. These changes subsequently affect downstream signaling
  pathways, such as JNK, ERK, and NF-κB, and cause apoptosis, neurotoxicity, and blood-brain
  barrier (BBB) disruption. Increased phosphorylation of ERK triggers autophagic pathways,
  ultimately leading to apoptosis. Phosphorylated PKD and p38 contribute to the disruption
  of tight junctions and the blood-brain barrier. Additionally, the activation of
  JAK/STAT and NF-κB pathways promotes cytokine release and neuroinflammation. P-Phosphorylation;
  Ub-Ubiquitylation
