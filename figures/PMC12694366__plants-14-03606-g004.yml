figure_title: Cis-regulatory landscape of the CtPAL1 promoter.
caption: Cis-regulatory landscape of the CtPAL1 promoter. Predicted cis-acting elements
  identified in the 2.0-kb upstream promoter region of CtPAL1. Functional motifs associated
  with hormone responsiveness (ABA, MeJA, SA, and GA), abiotic stresses (drought,
  salt, and UV-B), and light regulation are indicated. The presence of multiple stress-
  and defense-related motifs suggests that CtPAL1 transcription is tightly integrated
  into environmental and hormonal signaling pathways
