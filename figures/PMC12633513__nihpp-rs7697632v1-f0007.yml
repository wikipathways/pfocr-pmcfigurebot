figure_title: Tissue-specific AR and ERa signaling during genital sexual differentiation
  determine the loss or retention of male nipples in mammals
caption: Active signaling pathways are shown in black text; diminished signaling pathways
  are shown in gray text. Green boxes indicate increased activity, and red boxes indicate
  decreased activity. (A) In male mice, higher androgen (T) levels activate AR during
  the prenatal sexual differentiation window and upregulate androgen nuclear signal
  pathway genes and promote apoptosis and autophagy mainly in mammary epithelial cells,
  leading to nipple loss in male mice. (B) In male guinea pigs, high levels of androgen
  (T) are also produced in fetal testes during sexual differentiation, but since no
  AR is expressed in developing MGs at this stage, androgen nuclear signal pathway
  genes are inactivated, Wnt pathway genes are upregulated, increasing mammary epithelial
  cell proliferation and decreasing cell death, inducing nipple formation, so nipple
  remains after birth. (C) AR and ERα both are expressed at sexual differentiation
  stage. When male and female mice are exposed to high dose of estrogen (E), ER signal
  antagonizes AR signal, androgen nuclear signal pathway genes are downregulated,
  Wnt pathway genes are upregulated, decreasing cell death and increasing cell proliferation,
  inducing nipple formation in both male and female mice at prenatal stage, leading
  to visible nipples at birth
article_title: Developmental basis of male nipple loss and retention in mammals
