caption: 'This schematic diagram illustrates the core amino acid metabolic networks
  and regulatory pathways implicated in the development and progression of MASLD/MASH.
  Key amino acids (BCAAs, leucine, glycine, glutamine, glutamate, methionine) modulate
  hepatic lipid metabolism, oxidative stress, and energy homeostasis through multiple
  mechanisms: BCAAs can generate acetyl-CoA via β-oxidation or regulate fatty acid
  synthesis (mediated by FASN) and catabolism through pathways such as mTOR, PPAR-RXR,
  and MAPK9; glycine deficiency exacerbates oxidative stress by impairing glutathione
  (GSH) synthesis, while its metabolite SAMe regulates lipogenesis via the SAMTOR-mTOR-SREBP
  axis; glutamine metabolism exhibits distinct zonation within the hepatic lobule—mitochondrial
  GLS2 in the periportal region (ZONE1) hydrolyzes glutamine into glutamate and ammonia
  (supporting the TCA Cycle, energy production, and gluconeogenesis), whereas GS (regulated
  by the Wnt/β-catenin signaling pathway) in the perivenous region (ZONE3) synthesizes
  glutamine from residual ammonia to maintain systemic nitrogen balance. Additionally,
  gut microbiota (e.g., Prevotella copri, Bacteroides vulgatus) can synthesize BCAAs
  to indirectly influence host hepatic metabolism. Collectively, key enzymes (ACC,
  GNMT) and biological processes (pexophagy, fatty acid synthesis) constitute a core
  regulatory network through which amino acid metabolic dysregulation drives fatty
  liver progression'
article_title: 'Amino Acid Metabolism in Chronic Liver Disease: from Pathogenic Driver
  to Therapeutic Target'
