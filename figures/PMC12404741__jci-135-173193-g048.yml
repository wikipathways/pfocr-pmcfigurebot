figure_title: GPR31 shows pro-MASH capacity by promoting hepatocyte lipotoxicity in
  vitro
caption: '(A) The knockdown effects of GPR31 validated by Western blotting. n = 3.
  (B) BODIPY staining of lipid droplets in control and GPR31-deficient hepatocytes.
  Scale bars: 30 μm. n = 3. (C) BODIPY staining for quantification by flow cytometry
  in control and GPR31-deficient hepatocytes. n = 3. (D) RNA-Seq–based heatmap analysis
  of GPR31-deficient hepatocytes. n = 4. (E) The overexpression of GPR31-Flag validated
  by Western blotting. n = 3. (F) BODIPY staining of lipid droplets in control and
  GPR31-overexpressed hepatocytes. Scale bars: 30 μm. n = 3. (G) BODIPY staining for
  quantification by flow cytometry in control and GPR31-overexpressed hepatocytes.
  n = 3. (H) RNA-Seq–based heatmap analysis of GPR31-overexpressed hepatocytes. n
  = 4. (I) Pathway analysis of GPR31-overexpressed and GPR31-deficient mouse hepatocytes.
  n = 4. (J) mRNA levels of GPR31 in liver tissues from humans, monkeys, or mice at
  the stages of normal, MASL, and MASH. n = 5. (K and L) Protein levels of GPR31 in
  human (K) and monkey (L) liver tissues at the stage of MASL or MASH versus that
  in normal control. n = 4. (M) Protein levels of GPR31 in liver tissues from mice
  fed with NC or HFHC diet for 8 weeks and 16 weeks. n = 4. (N) Mouse primary hepatocytes,
  Kupffer cells, and hepatic stellate cells were treated with or without palmitic
  acid (PA), LPS, or TGF-β for 12 hours before whole cell lysate was collected for
  Western blot analysis to detect GPR31 expression. n = 3. Data are shown as mean
  ± SEM. *P < 0.05; **P < 0.01; ***P < 0.001'
