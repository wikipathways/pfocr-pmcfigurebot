figure_title: Promotion of wound healing by PDVLNs.
caption: 'Promotion of wound healing by PDVLNs. In the hostile wound microenvironment,
  high levels of reactive oxygen species (ROS), pro-inflammatory M1 macrophages, apoptosis,
  and inflammatory factors (e.g., COX-2, IL-6, IL-1β) impede healing and angiogenesis.
  PDVLNs intervene by shifting the microenvironment towards a pro-regenerative state
  characterized by M2 macrophage polarization, increased growth factors (VEGF, EGF,
  TGF-β, FGF), and enhanced angiogenesis. The above panel illustrates four key therapeutic
  mechanisms of PDVLNs: (1) Anti-inflammation—inhibiting pro-inflammatory cytokines
  and promoting re-epithelialization; (2) Anti-oxidation—activating the Nrf2 signaling
  pathway and upregulating antioxidant enzymes (HO-1, CAT, SOD) to scavenge ROS and
  reduce MMP-1/3 expression; (3) Angiogenesis—facilitating migration, proliferation,
  and tube formation of endothelial cells; and (4) Proliferation and migration—enhancing
  proliferation and migration of skin cells through AKT/mTOR and ERK signaling pathways.
  Various PDVLNs from ginseng, aloe, balloon flower root, wheat, and other sources
  act synergistically to regulate wound healing processes. Created in Biorender. Wang,
  Q. (2025) https://BioRender.com/c4qwf70'
