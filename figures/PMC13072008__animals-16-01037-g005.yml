caption: Comparison of proteome and lipidome profiles in ULF between the CON and PGE2
  groups. (A) A map depicting the glycerophospholipid and choline metabolism pathways.
  Circles represent metabolites, with green circles indicating decreased abundance
  in uterine luminal fluid following PGE2 treatment. Rectangles represent proteins,
  with red and brown rectangles indicating upregulated and downregulated proteins,
  respectively. (B) Analysis of differentially altered metabolites in glycerophospholipid
  and choline metabolism pathways. (C) Analysis of protein expression involved in
  glycerophospholipid metabolism and choline metabolism in the CON and PGE2 groups.
  “**” represents p < 0.01
