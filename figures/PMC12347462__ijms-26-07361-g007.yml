figure_title: Working model of FGF3 on the guidance of TCAs in the thalamus.
caption: 'Working model of FGF3 on the guidance of TCAs in the thalamus. (A) FGF3
  acts directly to regulate the turning of dorsal TCAs, which may be achieved by regulating
  the reorganization of PC-PLC downstream cytoskeletal actin. FGF3 is enriched in
  the ventral hypothalamus, potentially affecting expression levels of Slit1 activity
  by the PI3K pathway, and thus indirectly regulates the pathfinding of TCAs. (B)
  Schematic details the PC-PLC pathway activated by FGFR1 and FGF3, depicting components
  like PLC, DAG, IP3, PKC, and unresolved links to Rho and GTP. (C) Schematic depicts
  the indirect PI3K pathway, where FGFR1/FGF3 trigger signaling through molecules
  like SHP2, GRB2, etc., ultimately affecting Slit1, and cytoskeleton regulatory protein
  Rac. TH: thalamus; PT: prethalamus; HT: hypothalamus; T: telencephalon; ZLI: zona
  limitans intrathalamica; FGF: fibroblast growth factor; FGFR: fibroblast growth
  factor receptor; PC: phosphatidylcholine; PLC: phospholipase C; PLCγ: phospholipase
  C gamma; PI3K: phosphoinositide 3 kinase; PIP2: phosphatidylinositol 4,5-bisphosphate;
  DAG: diacylglycerol; IP3: inositol 1,4,5-trisphosphate; PCho: phosphocholine; PKC:
  protein kinase C; SHP2: Src homology 2 domain-containing protein tyrosine phosphatase
  2; FRS2α: fibroblast growth factor receptor substrate 2 alpha; GRB2: growth factor
  receptor-bound protein 2; CRKL: CRK-like proto-oncogene; GAB1: Grb2-associated binding
  protein 1; cCOMPASS: catalytically active COMPASS; mTORC2: mammalian target of rapamycin
  complex 2; AKT: protein kinase B; Robo: Roundabout; red ×: the assumed pathway does
  not exist; red ?: probable pathways'
