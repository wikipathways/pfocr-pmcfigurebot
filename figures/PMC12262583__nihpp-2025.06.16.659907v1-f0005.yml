figure_title: Overall framework for alcohol-induced disruptions in PFC SST peptide
  control over local neurocircuits
caption: In baseline conditions, PL cortical SST peptide signaling provides robust
  inhibitory control over PL pyramidal neurons, providing a mechanism to regulate
  PFC engagement. Following binge drinking, our previous work shows downregulation
  of SST intrinsic excitability and GABAergic control over pyramidal neurons. Here,
  we extend this to alcohol-induced downregulation of SST peptidergic control. This
  sets the stage for PFC pyramidal hyperexcitability, which is one putative pathway
  underlying the transition from causal substance use to addiction
