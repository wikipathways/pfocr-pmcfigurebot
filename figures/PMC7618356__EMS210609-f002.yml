figure_title: Emergence of basal, neuroendocrine, secretory-like, and hillock-like
  cells under hypoxia
caption: '(A) Experimental design. Epithelial progenitor organoids derived from two
  human fetal (9 pcw) lungs were treated with normoxia or hypoxia (2% O2) in SRM.
  Organoids were sampled, dissociated, and fixed over multiple days, and processed
  together for library preparation.(B) UMAP of cells from all samples with annotated
  cell populations.(C) Left: reference UMAP of human fetal lung epithelial cell atlas.
  Right: all cells from the organoids projected onto the reference UMAP.(D) Organoid
  cells sampled at different days shown in the same UMAP.(E) Expression patterns of
  canonical in vivo lineage markers, cell-type-specific markers newly identified from
  the organoid dataset, and HIF pathway-related genes.(F) Hillock-like cells (KRT13+)
  emerged at days 15 and 30 in hypoxic organoids. Arrows indicate KRT5+KRT13+ cells.
  Scale bars, 100 μm.(G and H) Slingshot trajectory analysis. (G) Three pseudotime
  trajectories originating from cycling cells and diverging at primed progenitors.
  (H) Cell-type changes along the trajectories.See also Figures S2 and S3'
