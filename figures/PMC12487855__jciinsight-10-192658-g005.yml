figure_title: SnRNA-Seq of human NF1-mutant, IDH wild-type glioblastoma (n = 9) reveals
  MES-like cells exhibit Ras pathway activation
caption: (A) SnRNA-Seq of 21,959 nuclei from 9 patient-derived human NF1-mutant, IDH
  wild-type glioblastomas identifies 5 tumor cell clusters and 9 nontumor cell clusters.
  (B) Tumor cells were distributed across 4 cell states (OPC-like, NPC-like, AC-like,
  MES-like), with relative enrichment for MES-like and OPC-like cell states. (C) Individual
  NF1-mutant glioblastomas samples are divided into MES-like enriched (samples S3,
  S4, S5, S6, and S8) and non-MES enriched (sample S1, S2, S7, S9) tumors. (D) MES-like
  cells express significantly increased MEK activation compared with non-MES cells
  (** P < 0.001, Wilcoxon rank-sum test). (E) Single-cell dot plot expression analysis
  of 31 genes comprising the MEK activation gene set confirms enrichment in MES-like
  compared with non-MES cells. (F) Integration with published glioblastoma snRNA-Seq
  data (45) comparing NF1-mutant and NF1 wild-type tumors reveals the MEK activation
  signature is significantly enriched in MES-like cells within NF1-mutant glioblastomas
  compared with both non-MES cells in NF1-mutant glioblastomas and MES-like cells
  in NF1 wild-type glioblastomas (** P < 0.001, Wilcoxon rank-sum test). UMAP, uniform
  manifold approximation and projection; SNV, single nucleotide variant
article_title: Tumor heterogeneity underlies clinical outcome and MEK inhibitor response
  in somatic NF1-mutant glioblastoma
