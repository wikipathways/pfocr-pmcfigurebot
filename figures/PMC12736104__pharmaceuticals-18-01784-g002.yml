figure_title: Molecular structure and signaling pathway of BTLA.
caption: 'Molecular structure and signaling pathway of BTLA. (A) Structure of the
  BTLA–HVEM complex: BTLA (B and T lymphocyte attenuator) is a type I transmembrane
  glycoprotein belonging to the immunoglobulin superfamily. Its extracellular IgV-like
  domain binds specifically to the cysteine-rich domain 1 (CRD1) of HVEM (herpesvirus
  entry mediator), a TNF receptor superfamily member. This 1:1 interaction forms a
  structurally stable but functionally non-redundant inhibitory complex. (B) BTLA
  intracellular signaling cascade: Following engagement with HVEM, the cytoplasmic
  tail of BTLA becomes phosphorylated at conserved ITIM and ITSM motifs, which recruit
  SHP-1 and SHP-2 phosphatases. These phosphatases dephosphorylate downstream signaling
  molecules of the T cell receptor (TCR) or B cell receptor (BCR), resulting in suppression
  of activation, reduced cytokine production, and attenuation of proliferation. HVEM,
  containing four CRDs (CRD1–CRD4), can also interact with other ligands such as LIGHT
  or CD160, acting as a bidirectional signaling hub that integrates both stimulatory
  and inhibitory cues. (Note: BTLA: blue color; HVEM: orange color)'
