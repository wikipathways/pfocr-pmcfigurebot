figure_title: Non-enzymatic glycation of Lp(a) and proinflammatory signaling.
caption: 'Non-enzymatic glycation of Lp(a) and proinflammatory signaling. Lp(a) undergoes
  non-enzymatic glycation (Maillard reaction) with sequential formation of Schiff
  bases → Amadori products → AGEs. Glycated Lp(a) becomes more electronegative and
  loses affinity for LDLR. AGE–RAGE engagement activates inflammatory pathways—NADPH
  oxidase/ROS, JAK2/STAT, PI3K/AKT, MAPK/ERK, and NF-κB— driving transcriptional activation
  of cytokines (IL-6, TNF-α), chemokines (MCP-1), growth factors (TGF-β), and adhesion
  molecules (VCAM-1, ICAM-1), thereby promoting microvascular and macrovascular complications.
  Solid arrows indicate the chronological biochemical steps. Abbreviations: Lp(a),
  lipoprotein(a); glLp(a), glycated Lp(a); apoB, apolipoprotein B; LDLR, low-density
  lipoprotein receptor; AGEs, advanced glycation end products; RAGE, receptor for
  AGEs; ROS, reactive oxygen species; NADPH oxidase, nicotinamide adenine dinucleotide
  phosphate oxidase; JAK2, Janus kinase 2; STAT, signal transducers and activators
  of transcription; PI3K, phosphoinositide 3-kinase; AKT, protein kinase B; MAPK,
  mitogen-activated protein kinase; ERK, extracellular signal-regulated kinase; NF-κB,
  nuclear factor kappa B; IL-6, interleukin-6; MCP-1, monocyte chemoattractant protein-1;
  TNF-α, tumor necrosis factor-alpha; TGF-β, transforming growth factor-beta; VCAM-1,
  vascular cell adhesion molecule-1; ICAM-1, intercellular adhesion molecule-1. Created
  with https://BioRender.com/tqjwvgv (accessed on 31 October 2025)'
