figure_title: Comparison of ERK1/2 signaling impairment in CCAs versus other biliary
  tract cancers.
caption: 'Comparison of ERK1/2 signaling impairment in CCAs versus other biliary tract
  cancers. The figure highlights key effectors involved in the altered regulation
  of the ERK1/2 pathway across biliary tract tumors. In all three CCA (CCAs), ALDH3B2
  via ITGB1 drives ERK1/2 hyperphosphorylation. In GBC, IL-17A, the mitochondrial
  glutamate carrier SLC25A22 and the non-coding RNA MALAT1 contribute to aberrant
  ERK1/2 activation, fostering malignant progression. AVC also exhibits ERK1/2 pathway
  overactivation. Conversely, SPRY4 is downregulated in pCCA, but, when highly expressed,
  it acts as an endogenous inhibitor of ERK1/2 phosphorylation, thereby limiting tumor
  proliferation. The figure was created with BioRender (https://biorender.com, accessed
  on 19 June 2025). Symbols: P, phosphate group'
