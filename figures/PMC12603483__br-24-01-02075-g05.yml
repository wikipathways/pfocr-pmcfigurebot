figure_title: IPA analysis of proteomes in AGE-supplemented mice predicts an altered
  phenome.
caption: 'IPA analysis of proteomes in AGE-supplemented mice predicts an altered phenome.
  (A) Top 10 IPA canonical pathways in the cortex (red bars) and hippocampus (green)
  proteomes of AGE-supplemented mice (P<0.05). (B) Top 10 most significantly changed
  upstream regulators in both cortex (left column) and hippocampus (right column)
  (P<0.05). Upstream regulators were ranked by P-value (rather ranking than z-score)
  in IPA to assess the statistical enrichment of their downstream targets. MAPT emerged
  as a top upstream regulator (P<0.01), indicating its targets are significantly overrepresented
  among the differentially expressed proteins. (C) IPA disease and function analysis
  to predict neurological behavior based on differential protein expression in the
  cortex and hippocampus (represented by red lines for increased protein expression
  and blue lines for decreased protein expression) indicates changes in behavioral
  phenotypes. Differential expression directionality (red lines: Increasing expression;
  blue lines: Decreasing expression) in the cortex and hippocampus predicts altered
  behavioral phenotypes including cognition, learning, anxiety, memory and spatial
  memory pathways (with red boxes highlighting behaviors driven by increased expression
  and blue boxes denoting behaviors influenced by decreased expression). IPA, Ingenuity
  Pathway Analysis; AGE, aged garlic extract; PSEN1, presenilin 1; APP, amyloid precursor
  protein'
