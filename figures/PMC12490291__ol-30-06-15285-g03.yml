figure_title: Relationship between HAT1 and DNA replication and pyrimidine metabolism
  pathways.
caption: Relationship between HAT1 and DNA replication and pyrimidine metabolism pathways.
  (A) LinkedOmics database suggested that differentially expressed genes of HAT1 were
  enriched in several biological processes, such as ‘DNA replication’, ‘pyrimidine
  metabolism’ and ‘RNA transport’. (B) Gene set enrichment analysis revealed that
  genes altered by HAT1 were positively associated with ‘DNA replication’ as well
  as ‘pyrimidine metabolism’ pathways. (C) cBioPortal database was used to analyze
  the correlations between HAT1 and regulatory proteins of the DNA replication pathway.
  Pearson's rank correlation between HAT1 and DNA replication-related proteins (PCNA,
  RPA1 and POLA1) was analyzed in ovarian cancer tissues. (D) Pearson's rank correlation
  between HAT1 and pyrimidine metabolism-related proteins (TK1, RRM1 and RRM2) was
  analyzed in ovarian cancer tissues as suggested in the cBioPortal database. HAT1,
  histone acetyltransferase 1; PCNA, proliferating cell nuclear antigen; RPA1, replication
  protein A1; POLA1, DNA polymerase α catalytic subunit; TK1, thymidine kinase 1;
  RRM, ribonucleoside-diphosphate reductase subunit M; NES, normalized enrichment
  score; FDR, false discovery rate
