figure_title: ScRNA-seq analysis identifies Non-Responder-specific signaling from
  monocytes and confirmed cell-type-specific Responder-signaling CXCL9/10-CXCR3 and
  CXCL16-CXCR3
caption: 'A. Schematic of in silico cell-cell interaction (CCI) analysis. Comparison
  analyses were plotted with interaction rank between groups (with R-enriched interactions
  at the lower end) on the x-axis and log2 fold change of CellChat interaction count
  on the y-axis. Enriched interactions are visualized with the left box representing
  senders, and the right box representing receiver cell types.B. Rank plot of CCIs
  enriched by Response for pre- and post-ICB.C. UpSet plots representing the degree
  of overlap of LR interactions to receiving T cell types sent from PBMC-like CD14
  monocytes both pre- and post-ICB.D. Alluvial plots representing sent signal to T
  cell subsets from PBMC-like CD14 monocytes pre-ICB, and the group specificity of
  these same interactions post-ICB. The left strata and links represent pre-ICB receiving
  cell type, and the right strata represent post-ICB specificity by Response. Grey
  stratum represents interactions either gained or lost following ICB. Left: Post-ICB
  specificity of NR-specific interactions from pre-ICB. Right: Post-ICB specificity
  of R-specific interactions from pre-ICB.E. Circos plots representing CCI interaction
  probability from myeloid to T cell compartments by pathway pre- and post-ICB using
  previously published pathways [24]. Chord color represents pathway. Interactions
  from each sender/receiver pair are categorized by group specificity: specific to
  Responders (R), Non-Responders (NR), or shared (Sh), and converted to percentage
  of total probability contribution to all interactions within that pair and group
  specificity.F. Rank plot of CCIs within the chemokine pathway pre- and post-ICB.
  Interactions on the top left are enriched in R, and interactions at the bottom right
  are enriched in NR. Individual interactions are represented by a 2-segment box,
  the left box indicating sender cell type, the right box indicating receiver cell
  type, ligand written in the left box, and receptor in the right box'
