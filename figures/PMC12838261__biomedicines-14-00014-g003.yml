figure_title: DEMs in rhPTX3-treated MDA-MB-231 cells in comparison with untreated
  cells.
caption: DEMs in rhPTX3-treated MDA-MB-231 cells in comparison with untreated cells.
  (A). Workflow illustrating the treatment of MDA-MB-231 cells with rhPTX3 through
  to in silico analyses. (B). The 3841 mapped miRNAs were subjected to differential
  expression analysis using DESeq2 software. As a criterion, miRNAs with a log2 fold
  change ≤−1 or ≥1 were considered DEMs. Thus, the 30 downregulated miRNAs are represented
  in blue in the heatmap, and the 112 upregulated miRNAs are shown in red. (C). Potential
  canonical pathways regulated by miRNAs following treatment with rhPTX3. IPA software
  (Version 150276282) was used to evaluate the canonical pathways regulated by the
  DEMs, which were filtered to obtain information specific to the MDA-MB-231 cell
  line. The bar graphs show the percentage of targets among the 15 main pathways related
  to breast cancer. The parentheses numbers represent the genes associated with each
  canonical pathway. The blue bars indicate the percentage of targets from the DEMs.
  The Benjamini–Hochberg statistical test was applied to adjust the p-value from Fisher’s
  exact test. (D). In IPA, the biological functions related to the DEMs identified
  in the miRNA sequencing were also analyzed. The Benjamini–Hochberg statistical analysis
  adjusted the p-value from Fisher’s exact test
