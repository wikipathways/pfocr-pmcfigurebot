figure_title: Schematic representation of the RNAi mechanism in plants.
caption: 'Schematic representation of the RNAi mechanism in plants. Blue arrows indicate
  the miRNA pathway, while red arrows indicate the secondary siRNA pathway. The specific
  RNAi outcome depends on the RNA substrate (pre-miRNA or dsRNA), its origin, the
  specific DCL protein responsible for processing, and the AGO protein that binds
  the resulting sRNA. Target mRNA slicing by the RISC is required to prime secondary
  siRNA production [4]. Abbreviations: DCL, Dicer-like protein; AGO, Argonaute protein;
  RDR, RNA-dependent RNA polymerase; RISC, RNA-induced silencing complex'
