figure_title: The second wave of increase in pRSK was repressed by inhibition of TGF-β.
caption: The second wave of increase in pRSK was repressed by inhibition of TGF-β.
  A, Partial circuit diagram showing the pathway targeted by the TGF-β antagonist
  TGF-β RII Fc (TGF Fc). B1, Representative confocal images of pRSK in SNs at 5 h
  after Standard protocol of 5-HT, in the absence or presence of TGF Fc. B2, Summary
  data. TGF Fc significantly decreased pRSK induced by 5-HT. C1, Representative confocal
  images of pRSK in SNs at 5 h after Enhanced protocol of 5-HT, in the absence or
  presence of TGF Fc. C2, Summary data. TGF Fc significantly decreased pRSK induced
  by 5-HT. D1, Representative confocal images of pRSK in SNs at 5 h after two-pulse
  protocol of 5-HT, in the absence or presence of TGF Fc. D2, Summary data. TGF Fc
  significantly decreased pRSK induced by 5-HT. * p < 0.05
