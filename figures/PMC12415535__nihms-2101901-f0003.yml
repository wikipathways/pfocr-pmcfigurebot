figure_title: Functional similarities and differences of rodent and human kidney cells
  in disease states
caption: '(a) Gene pathway similarity in cellular functions of rodents was compared
  to human patients (diseased reference).(b) Box plots of the average R2 values (y-axis)
  of marker gene sets per sample across species (human-healthy, mouse, rat) and cell
  type (x-axis). Higher R2 values indicate higher coordination with the diseased human
  reference. For each cell type three separate box plots show R2 sample averages of
  healthy humans (blue), healthy and diseased mice (orange), and healthy and diseased
  rats (green). Values were calculated for individual samples (biological replicates)
  above the cell number threshold (human n = 11–20, mouse n = 42–61, rat n = 17–34
  depending on the respective cell type). Box plots show the median (center line),
  quartiles (box limits), and whiskers, which extend to the minimum and maximum values
  within 1.5×IQR. Data points outside this range are plotted as outliers.(c) Example
  of R2 distributions of human (blue), mouse (orange), and rat (green) samples of
  “Regulation of protein kinase C signaling” in PEC. The y-axis represents a smoothed
  density estimate, reflecting the relative number of samples for each R2 value (x-axis).(d)
  Density plots of R2 distributions relative to the diseased human reference of diseased
  rats and rat controls for Stromal “glutamate metabolic process”. R2 distributions
  of rat controls are plotted in both density plots.(e) Density plots of R2 distributions
  of rodent models and human controls in injPT “Positive regulation of steroid biosynthetic
  process”. The y-axis represents a smoothed density estimate, reflecting the relative
  number of samples for each R2 value (x-axis).(f) Heatmap of average R2 values of
  selected functions in injPT cells across rodent models. Each column is a model:
  mouse FA (folic acid injury), diabetes, AKI (acute kidney injury, ischemia-reperfusion),
  rat DOCA (deoxycorticosterone acetate, hypertension) and rat ZSF1 (diabetes), each
  row is specific gene set. Yellow indicates higher R2 values'
