figure_title: Major oncogenic signaling networks in cancer.
caption: Major oncogenic signaling networks in cancer. The PI3K/AKT/mTOR cascade (1)
  promotes growth and survival, while the MAPK/ERK pathway (2) drives proliferation
  via RAS–RAF–MEK–ERK activation. The Wnt/β-catenin pathway (3) regulates cell fate
  and proliferation. Additionally, the JAK-STAT pathway (4) promotes proliferation
  via phosphorylation. Upstream, the EGFR/HER2 receptor axis functions as a central
  signaling hub and therapeutic target, with multiple inhibitors directed against
  its activation. CDK 4/6 inhibitors (5) can halt the cell cycle directly, by allowing
  Rb to exact its inhibitory effect on E2F. In the case of ESR1 mutations (6), targeted
  therapy can stimulate proteolysis of the abnormal protein, halting aberrant proliferation
  stimulation (created with Biorender.com accessed on 20 September 2025)
