figure_title: Overview of Toll-like receptor (TLR) signaling pathways.
caption: Overview of Toll-like receptor (TLR) signaling pathways. This schematic depicts
  the cell-surface TLRs (TLR-1, TLR-2, TLR-4, TLR-5, and TLR-6) and their ligands
  (flagellin, diacyl lipopeptides, triacyl lipopeptides, and LPS). It also shows endosomal
  TLRs (TLR-3, TLR-7, TLR-8, and TLR-9) recognizing CpG DNA and RNA molecules. The
  diagram illustrates the subsequent signaling cascades involving adaptor proteins
  such as MYD88, TRIF, and TRAF6, leading to the activation of NF-κB and IRFs and
  resulting in the expression of pro-inflammatory cytokines and type I interferons.
  Created in BioRender. Jurczuk, A. (2025) https://BioRender.com/fahv025 (accessed
