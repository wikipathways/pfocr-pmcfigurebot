figure_title: HDAC5 expression is low in TNBC and can be upregulated by SSD.
caption: HDAC5 expression is low in TNBC and can be upregulated by SSD. (A) The chemical
  structural formula of SSD. (B-C) The inhibitory effects of the drug SSD on MDA-MB-231
  and -468 cells were assessed using the CCK8 assay. (D) MDA-MB-468 cells were treated
  with SSD, and gene expression profiling was analyzed. (E) KEGG pathway analysis
  (gene sets NES from GSEA). (F) A volcano plot shows that HDAC5 is significantly
  upregulated. (G) The upregulated genes from SSD and Oxamate treatment were intersected,
  resulting in 514 common upregulated genes. (H) A list of the top 20 common upregulated
  genes, including HDAC5, is shown. (I) Real-time PCR analysis of HDAC family genes
  in SSD-treated MDA-MB-231 and -468 cells. (J) TCGA database analysis of paired TNBC
  data revealed that HDAC5 expression lowered in cancer tissues compared to adjacent
  normal tissues. (K-L) Clinical TNBC tissue microarrays were analyzed by immunohistochemistry,
  showing low expression of HDAC5 in tumor tissues
