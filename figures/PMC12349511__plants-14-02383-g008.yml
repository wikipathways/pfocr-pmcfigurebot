figure_title: Integrated transcriptomic and metabolomic analysis of flavone and flavonol
  biosynthesis pathways in sweet potato (Ipomoea batatas L.
caption: 'Integrated transcriptomic and metabolomic analysis of flavone and flavonol
  biosynthesis pathways in sweet potato (Ipomoea batatas L.) leaves under drought
  stress at different growth stages. Heatmaps show the log2 fold changes of gene expression
  (squares) and metabolite abundance (ovals) derived from transcriptomic and metabolomic
  data in the following pairwise comparisons: CK (control; soil moisture maintained
  at 75 ± 5% field capacity (FC) throughout the growth period); DS1 (drought stress;
  soil moisture maintained at 45 ± 5% FC for 15 days during the branching and tuber
  formation stage, 55–70 days after planting); and DS2 (drought stress; soil moisture
  maintained at 45 ± 5% FC for 15 days during the storage root expansion stage, 90–105
  days after planting)'
