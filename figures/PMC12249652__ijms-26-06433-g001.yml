caption: The transferrin bound iron (Tf-Fe) complex enters cells by binding to transferrin
  receptors and it is stored as ferritin through IRE/IRP regulation. LPI (NTBI) enters
  cells via unregulated pathways, contributing to the formation of labile cell iron
  (LCI) pools. Excessive iron uptake accumulates in the cells and catalyzes the production
  ofreactive oxygen species, leading to oxidative damage
