figure_title: The invasive potential of MDA-MB-231 breast cancer cells is decreased
  by MAE.
caption: The invasive potential of MDA-MB-231 breast cancer cells is decreased by
  MAE. For 24 h, MDA-MB-231 cells were cultured in Boyden chamber trans-well inserts
  that had been previously coated with Matrigel, either with a vehicle-containing
  control or with 100 or 200 µg/mL of MAE. The Matrigel layer’s invading cells were
  imaged, counted, and examined using DAPI staining. Images were captured with a 4×
  magnification. The three separate experiments’ mean ± SEM (n = 3) is represented
  by the data. (** p < 0.005 and *** p < 0.001). Western blotting was used to measure
  the phosphorylated STAT3 protein levels, with β-actin serving as a loading control.
  Cells were treated either with a vehicle-containing control or with MAE (100 or
  200 µg/mL). The results showed that the STAT3 signaling pathway is inhibited by
  MAE. Data represent the mean ± SEM of three independent experiments (n = 3), (*
  p < 0.05 and ** p < 0.005). After being seeded in serum-free media, MDA-MB-231 cells
  were treated with 100 or 200 µg/mL of MAE. Then the conditioned media were concentrated
  and put through gelatin zymography to determine MMP-9 activity (* p < 0.05 and **
  p < 0.01)
