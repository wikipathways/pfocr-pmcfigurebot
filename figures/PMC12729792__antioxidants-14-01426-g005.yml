figure_title: Schematic representation of antioxidant–PROTAC integration strategies
  for Alzheimer’s disease (AD) therapy.
caption: 'Schematic representation of antioxidant–PROTAC integration strategies for
  Alzheimer’s disease (AD) therapy. (A) Antioxidant mechanisms: scavenging of reactive
  oxygen species (ROS), activation of the Nrf2 pathway, and metal chelation to mitigate
  oxidative stress. (B) PROTAC pathways: formation of a ternary complex between the
  protein of interest (POI) and E3 ligase leading to ubiquitination and proteasomal
  degradation, resulting in neuroprotection. (C) Integration models for AD: combining
  antioxidant and PROTAC mechanisms to reduce amyloid-β (Aβ) oligomers and aggregation.
  (D) Translational pipeline: progression from in vitro and in vivo validation to
  pharmacokinetic/pharmacodynamic evaluation and clinical biomarker assessment (Created
  in BioRender. Singh, D. (2025) https://BioRender.com/pzlt3uv; accessed on 29 October
  2025)'
