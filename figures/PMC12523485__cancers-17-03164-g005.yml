figure_title: Validation of single-cell sequencing results by bulk RNA-Seq.
caption: Validation of single-cell sequencing results by bulk RNA-Seq. (A) Correlation
  scatter plot showing the association between the Hh activation level and the MMP1
  + FIB infiltration level in patients. (B) Volcano plot of the DEGs between the High_MMP1
  group and the Low_MMP1 group. (C) Results of the GO and KEGG functional annotation
  analyses for the High_MMP1 group and the Low_MMP1 group. (D) GSEA enrichment analysis
  showing the activation status of the ECM–receptor interaction and complement and
  coagulation cascades. (E) Correlation between the MMP1 + FIB infiltration level
  and the infiltration levels of M2 macrophages, T cells, plasma cells, and other
  immune cells in patients. (F) Box plot presenting the differences in the infiltration
  levels of M2 macrophages, T cells, plasma cells, and other immune cells between
  the High_MMP1 group and the Low_MMP1 group. Hedgehog, gsva enrichment score of the
  Hedgehog signaling pathway gene set; High_MMP1, patients with high GSVA scores for
  MMP1 + FIB-related characteristic genes; Low_MMP1, patients with low GSVA scores
  for MMP1 + FIB-related characteristic genes
