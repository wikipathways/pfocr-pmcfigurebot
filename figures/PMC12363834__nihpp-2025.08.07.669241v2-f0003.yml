figure_title: Bulk RNA sequencing revealed distinct molecular mechanism underlying
  LPS effect on Sh3+/− mice
caption: 'A-D. The volcano plot shows differentially expressed genes (DEGs) distribution.
  DEGs were identified in four comparisons: Sh3+/−+LPS vs Sh3+/−+PBS (A), WT+LPS vs.
  WT+PBS (B), Sh3+/−+LPS vs. WT+LPS (C), Sh3+/−+PBS vs. WT+PBS (D). Upregulated genes
  are indicated in red color, downregulated genes are indicated in blue color and
  DEGs below threshold are indicated in grey color.E-F. Venn diagrams show shared
  upregulated and downregulated genes among four comparisons. Shared upregulated (E)
  and downregulated genes (F) numbers are shown within the diagrams. Comparison of
  Sh3+/−+LPS vs Sh3+/−+PBS is red diagram, WT+LPS vs. WT+PBS is blue diagram, Sh3+/−+LPS
  vs. WT+LPS is green diagram, and Sh3+/−+PBS vs. WT+PBS is yellow diagram.G. Bubble
  chart shows functions of DEGs of Sh3+/−+LPS vs. WT+LPS comparison. Volcano plot
  of the negative log of p-value (Y-axis) vs. the z-score (X-axis). p-value was calculated
  using the right-tailed Fisher’s Exact Test. A negative log of p-value cutoff of
  1.3 (p < 0.05) was used to identify significantly changed functional pathways. A
  z-score range cutoff of ±0.1 was used to identify the activation or inhibition state
  of a canonical pathway. Some names of pathways are annotated in the chart. Activated
  pathways are orange bubbles and inhibited pathways are blue bubbles. The size of
  the bubbles reflects the number of genes overlapped with the pathway database'
