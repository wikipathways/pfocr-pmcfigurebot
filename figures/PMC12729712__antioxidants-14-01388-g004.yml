figure_title: The role of SHP2 in T cell signaling and immune checkpoint inhibition.
caption: The role of SHP2 in T cell signaling and immune checkpoint inhibition. (A)
  The figure illustrates how immune checkpoint inhibitors (ICIs) enhance T cell-mediated
  anti-tumor responses. Normally, tumor cells express immune checkpoint ligands (such
  as PD-L1), which bind to immune checkpoint receptors (such as PD-1) on T cells.
  This interaction suppresses T cell activation, leading to immune evasion by the
  tumor. ICIs (represented as therapeutic antibodies in blue) block the binding between
  the checkpoint receptor and its ligand, preventing inhibitory signaling. As a result,
  T cell receptor (TCR) signaling and co-stimulatory signals are restored, leading
  to the reactivation of cytotoxic T cells. This reactivation promotes T cell proliferation,
  cytokine production, and direct tumor cell killing, thereby enhancing anti-tumor
  immunity. (B) This schematic outlines the signaling pathways involved in T cell
  activation and immune checkpoint inhibition. Upon engagement of cytokine receptors
  (CRs) and the T cell receptor (TCR), tyrosine phosphorylation-based signaling cascades
  are triggered, with key contributions from the TCR, CRs, and co-stimulatory signals
  (e.g., CD3, CD4). These signals activate tyrosine kinases such as Janus kinase (JAK)
  or Zeta-chain-associated protein kinase 70 (ZAP70), initiating downstream tyrosine
  phosphorylation events that regulate T cell activation and function. The figure
  further illustrates the activation of several downstream signaling pathways, including
  JAK/Signal Transducer and Activator of Transcription (STAT), Phosphoinositide 3-kinase/Protein
  Kinase B (PI3K/AKT), Phospholipase C gamma 1 (PLC-γ1), GRB2/SOS, and Ras-related
  C3 botulinum toxin substrate (RAC). These pathways play vital roles in promoting
  T cell proliferation, cytokine production, immune surveillance, and pro-inflammatory
  responses, including the activation of M1-like macrophages. SHP2 is crucial in regulating
  these signaling pathways. It negatively modulates the activation of T cells by dephosphorylating
  key components such as JAK/STATs, ZAP70, CD28, and Linker for activation of T cells
  (LAT). The inhibitory role of SHP2 is a key target for immune checkpoint inhibitors
  (ICIs), which block this secondary inhibition, thereby enhancing T cell activation
  and promoting a stronger immune response. Created in BioRender. Paniagua Bojorges,
  A. (2025) https://BioRender.com/8d0508f
