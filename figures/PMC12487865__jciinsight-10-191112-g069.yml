figure_title: Nf2 regulates type I collagen biosynthesis and secretion in CNC-derived
  osteoblasts
caption: '(A and B) Molecular profiling reveals osteogenic defects: Western blot analysis
  (A) shows reduced osteogenic markers in Nf2-mutant mice at D7, and quantitative
  reverse transcription PCR (qRT-PCR) (B) confirms severe downregulation of ALP, RUNX2,
  Sp7, and Col1) in Nf2 deficient CNC-derived osteoblasts. (C–H) Collagen matrix abnormalities.
  (C) IHC shows less type I collagen in E16.5 Nf2-mutant coronal sections. Scale bars:
  100 μm. (D) Picrosirius red staining reveals disorganized collagen fibers (arrow)
  in Nf2-mutant mice at E16.5. Scale bars: 100 μm. (E) TEM demonstrates defective
  fibril ultrastructure at E18.5, and quantification shows wider collagen fiber diameter
  (G). Scale bars: 200 nm. (F) Increased interfibrillar spacing in Nf2 mutants. (H)
  Costaining confirms reduced collagen in Runx2+ osteoprogenitors at E12.5. Scale
  bars: 200 μm. (I and J) Secretory pathway impairment. (I) AA-stimulated (50 μg/mL)
  Nf2-mutant CNC-derived osteoblasts retain pro–collagen I in Golgi (GM130+, arrow).
  Scale bars: 100 μm. (J and K) Western blot quantified more intracellular collagen
  retention in Nf2 mutants after AA stimulation for the indicated time course. Data
  were expressed as means ± SD, and each dot represents an individual biological replicate.
  P values were calculated by unpaired Student’s t test with 2-tailed analysis without
  adjustments (F and G) and 2-way ANOVA multiple-comparison test (B and K). *P < 0.05,
  **P < 0.01, ****P < 0.0001'
