figure_title: Branched-chain amino acid metabolism
caption: Diagram of the mitochondrial branched-chain amino acid (BCAA) catabolic pathway.
  BCAAs are transported into the mitochondria through SLC25A44, where mitochondrial
  BCAT (BCATm) catalyzes reversible transamination of BCAAs to produce the branched-chain
  ketoacids (BCKAs) α-ketoisovalerate (KIV), α-keto-α-methylvalerate (KMV), and α-ketoisocaproate
  (KIC). BCKAs can be irreversibly oxidized by branched-chain ketoacid dehydrogenase
  (BCKDH) to form branched-chain acyl-CoA (BC Acyl-CoA) thioesters isovaleryl-CoA
  (IV-CoA), methylbutyryl-CoA (MB-CoA), and isobutyryl-CoA (IB-CoA), which are retained
  in the mitochondria for further oxidation to enter the tricarboxylic acid (TCA)
  cycle as either acetyl-CoA or succinyl-CoA. Succinyl-CoA is also generated as a
  product of propionyl-CoA metabolism, a substrate formed from the oxidative metabolism
  of isoleucine and valine, from propionate from gut flora, from odd-chain fatty acid
  (OC-FA) metabolism, and from metabolism of methionine and threonine in the form
  of α-ketobutyrate (α-KB). In methylmalonic acidemia, propionylcarnitine (C3), 2-methylcitrate
  (MCA), and methylmalonic acid (MMA) are accumulated during propionyl-CoA metabolism.
