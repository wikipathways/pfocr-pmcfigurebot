figure_title: Map of the ERK pathway phosphoproteomic signatures of MIN6 cells in
  different GSIS regulatory conditions
caption: Here, we highlight the value of our approach for mapping key phosphorylations
  in known signaling pathways and how they are differentially regulated in the context
  of GSIS with and without GPCR stimulation.(A) Heat map showing the log2 fold change
  in abundance of ERK pathway (and other key signaling regulators) phosphorylations
  upon stimulation with high glucose and different GPCR agonists at 15min post-treatment.
  Phosphorylations are sorted based on protein family, as indicated on the right.
  Dots are colored as a heat map, with increased abundance being red and decreased
  abundance being blue. in the schematics on the right, showing(B-E) Schematics of
  the ERK phosphosignaling pathway, indicating which pathways are stimulated under
  which conditions and how the phospho-signatures vary depending on treatment conditions.
  Note that high glucose (HG) (B), HG+Exendin-4 (C), HG+TUG891 (D), and HG+TUG891+Exendin-4
  combined treatment (E) pathway specificity are highlighted in bright color to show
  which pathways activate which factors. Phosphorylations are shown with heat-map
  coloration corresponding with the heat-map abundance shown in (A). In the box on
  the bottom left of each panel is a table summarizing the key phosphorylations shown
  here and the changes in abundances.(F) Chart summarizing key major changes in key
  regulators of the ERK pathway based upon HG versus Exendin4 versus TUG891 stimulations,
  with up and down arrows indicating either significant increase or decreased levels
  versus LG for HG or HG for the GPCR stimulations. The second column lists what compartments
  these different factors localize to, providing spatial context for compartmentalized
  ERK pathway signaling
