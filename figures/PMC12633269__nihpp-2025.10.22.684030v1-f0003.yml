figure_title: Adipocyte complex I deficiency limits adipose expansion and impairs
  systemic glucose homeostasis
caption: a, Body weight of Control (Ndufs2fx/fx) and Ndufs2-KO (Adiponectin-Cre; Ndufs2fx/fx)
  mice at 4 months of age on a chow diet (n = 6–7). b, Tissue weights of Control and
  Ndufs2-KO mice at 4 months of age (n = 6–7). c, Representative images of hematoxylin
  and eosin staining of gWAT and liver 4 months of age (10x magnification, scale bars
  200 μm). d, Oral glucose tolerance test (GTT) and insulin during the GTT at 4 months
  of age (n = 6–7). e, Serum non-esterified fatty acids (NEFA) in Control and Ndufs2-KO
  mice at 4 months of age (n = 6–7). f, KEGG pathway analysis of downregulated (upper
  panel) and upregulated (lower panel) genes in Ndufs2-KO vs. Control adipocytes (n
  = 4). g, RNA-sequencing was performed on fractionated adipocytes from the visceral
  WAT of Control (Ndufs2fx/fx), Ndufs2-KO (Adiponectin-Cre;Ndufs2fx/fx), and Bmal1-KO
  (Adiponectin-Cre; Bmal1fx/fx) mice. Pathway analysis of Gene Ontology biological
  process terms with highlighted genes among differentially expressed genes in Ndufs2-KO
  vs Control and Bmal1-KO vs Control fractionated adipocytes. h, Motif analysis of
  downregulated genes in Ndufs2-KO vs Control and Bmal1-KO vs Control fractionated
  adipocytes.Data are represented as mean ± SEM. Statistical significance was calculated
  by unpaired t-test in a and e, and two-way ANOVA followed by multiple comparisons
  in b and d. *p < 0.05, **p < 0.01, ***p < 0.001
