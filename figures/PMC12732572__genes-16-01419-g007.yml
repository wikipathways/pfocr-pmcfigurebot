figure_title: Functional Enrichment Analysis of Identified Key Genes.
caption: 'Functional Enrichment Analysis of Identified Key Genes. (A): Gene Ontology
  (GO) enrichment analysis for biological processes (BP), highlighting significantly
  enriched processes such as myeloid leukocyte migration and chemotaxis. (B): GO enrichment
  analysis for molecular functions (MF), identifying functions such as glycosaminoglycan
  binding and transporter activities. (C): GO enrichment analysis for cellular components
  (CC), emphasizing the involvement of secretory granule lumen, azurophil granules,
  and lysosomal components. (D): Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway
  analysis, illustrating significantly enriched pathways including folate transport
  and metabolism and acute myeloid leukemia pathways. The size of each dot represents
  the count of genes involved, and the color intensity indicates the significance
  level (–log10(p-value))'
