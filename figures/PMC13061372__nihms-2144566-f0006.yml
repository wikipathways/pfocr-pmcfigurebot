figure_title: Performance of each system.
caption: Performance of each system. GPT-4o is used to evaluate the responses shown
  in this plot, following clear evaluation instructions and a scoring rubric. Based
  on the instructions and rubric, GPT-4o assigns a score and provides a corresponding
  rationale for each response. A domain expert then reviews the rationales to verify
  that the assigned scores are reasonable. With the assistance of the pathway RAG
  and revision loop, the final version of scChat performs the best across all categories
  of benchmarking questions. During failure mode testing, we examine the rationale
  for not achieving a full score in each category. We also record the performance
  from systems with functionality removed for an ablation study
