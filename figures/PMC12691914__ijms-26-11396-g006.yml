figure_title: SESN2 modulates stress-activated MAPK signaling pathways and MAPK gene
  expression in endothelial cells.
caption: SESN2 modulates stress-activated MAPK signaling pathways and MAPK gene expression
  in endothelial cells. (A) Representative Western blot analysis showing protein expression
  and phosphorylation status of P38 MAPK and ERK1/2, with GAPDH as loading control.
  Cells were treated under control conditions (Ctl), SESN2 silencing (Si), or SESN2
  overexpression (Oe), with or without 600 μM MGO treatment for 18 h. Blots shown
  are representative of n = 3 independent experiments. (B) Quantitative analysis of
  phosphorylated protein levels normalized to their respective total protein counterparts
  (p-P38/P38 and p-ERK/ERK ratios). (C) Relative mRNA expression levels of MAPK14
  (p38α), MAPK1 (ERK2), and MAPK3 (ERK1), measured by qRT-PCR. mRNA data were normalized
  to GAPDH expression and are presented as fold change relative to the control (−MGO)
  group. All quantitative data (panels (B,C)) are presented as mean ± SD (n = 3 independent
  experiments). Groups that do not share a common letter are significantly different
  from one another (p < 0.05)
