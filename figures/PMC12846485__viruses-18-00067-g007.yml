figure_title: NF-kB inhibition restores VSV sensitivity in resistant PC3 cells.
caption: NF-kB inhibition restores VSV sensitivity in resistant PC3 cells. Cell survival
  levels, with and without the NF-kB pathway inhibitor Bay11-7082, were measured in
  PC3, following DMSO control treatment or infection with VSV (WT and R1) at an MOI
  of 50. Samples were run in duplicates and analyzed with PrestoBlue cell viability
  assay at 24, 48, and 72 h post-treatment with Bay11-7082. Viral infection was initiated
  8 h prior to analysis at each timepoint. (n = 2 Mean ± SEM, **** p < 0.0001, ***
  p < 0.001, ** p < 0.01, Student’s t-test)
