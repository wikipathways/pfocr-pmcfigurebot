figure_title: IGF2BP3 regulates translation of metabolic genes
caption: (A) Volcano plot showing differentially expressed transcripts after IGF2BP3
  depletion and IGF2BP3 targets defined by eCLIP analysis (dots exceeding the thresholds
  depicted by dashed lines). Gray dashed lines mark the significant cutoffs for differential
  expression (−1/1) and the adjusted p value (0.05). Putative IGF2BP3 targets identified
  using Skipper (see Boyle et al.29) are highlighted as green triangles.(B) MetaboAnalyst-based
  pathway enrichment analysis of consistently differentially regulated metabolites
  after IGF2BP3 loss with IGF2BP3 eCLIP targets in SEM cells.(C) Genome browser snapshots
  of eCLIP read coverage across some putative IGF2BP3 target genes. Depicted are the
  genes with key roles in glycolysis and one-carbon metabolism, and they map to the
  enriched terms in (B).(D) Western blot analysis of key genes in metabolic pathways
  (left) and simplified schematic depiction of genes that control metabolic pathways
  altered in IGF2BP3-depleted cells. Numbers alongside the bars represent p values;
  n = 3.(E) 10%–45% sucrose gradient fractionation of cytosolic extracts from control
  or IGF2BP3-depleted SEM cells, along with the EDTA control. MAT2B mRNA distribution
  was measured by RT-qPCR and represented as mean ± standard deviation (SD) (n = 3).All
  data are n = 2 replicates. Data are represented as mean ± SD, compared by two-sided
  unpaired t test; *p < 0.05, **p < 0.01, and ***p < 0.001. All experiments were repeated
  at least twice for consistency. Refer also to Figures S4 and S5
