caption: '(a) miRNA target gene volcano plot, where yellow indicates down-regulation
  and red indicates up-regulation. (b) GO enrichment circle diagram for miRNA target
  genes: First circle: Top 20 enriched GO terms, with the scale outside the circle
  indicating the number of miRNA target genes. Different colors represent distinct
  Ontologies. Second circle: The number of miRNA target genes in the background for
  each GO term and its Q-value. Longer bars indicate more background genes, while
  redder colors represent smaller Q-values. Third circle: The number of miRNA target
  genes for each GO term. Fourth circle: RichFactor values for each GO term (calculated
  as the number of miRNA target genes in that GO term divided by the total number
  of genes in that term), with background grid lines, where each grid represents 0.1.
  (c) KEGG enrichment circle diagram for miRNA target genes: First circle: Top 20
  enriched pathways, with the scale outside the circle indicating the number of miRNA
  target genes. Different colors represent different pathway classes. Second circle:
  The number of miRNA target genes in the background for each pathway and its Q-value.
  Longer bars indicate a greater number of miRNA target genes in the background, and
  redder colors represent smaller Q-values. Third circle: The number of miRNA target
  genes in each pathway. Fourth circle: RichFactor values for each pathway (calculated
  as the number of miRNA target genes in the pathway divided by the total number of
  genes in the pathway), with background grid lines where each grid represents 0.1'
