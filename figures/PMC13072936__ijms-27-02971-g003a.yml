figure_title: Identification and functional enrichment analysis of intersecting targets
  related to OTA and ccRCC.
caption: Identification and functional enrichment analysis of intersecting targets
  related to OTA and ccRCC. (A) A Venn diagram illustrates the intersection between
  genes associated with OTA exposure (red, n = 232) and those related to ccRCC (blue,
  n = 3224), revealing a total of 56 shared target genes, which constitutes 1.6% of
  the overall gene set (n = 3400). The diagram displays the number of genes, while
  the percentages indicate the proportion of genes in each section relative to the
  total. (B) The OTA–ccRCC association network graph depicts the regulatory network
  of compound → gene → disease associations. In this graph, blue nodes represent compounds,
  green nodes signify genes, red nodes denote diseases, and connecting lines illustrate
  predicted interactions. (C) A Gene Ontology (GO) bar graph presents the annotation
  of the intersecting genes across biological process (BP), cellular component (CC),
  and molecular function (MF). The x-axis indicates the gene counts for each entry,
  while the y-axis lists the names of the GO function entries. The color gradient
  of the bars reflects the corrected p-value, with deeper red hues indicating greater
  enrichment significance. (D) The GO circle plot illustrates the enrichment of intersecting
  genes across various GO categories. The outermost scale represents the total number
  of genes on a logarithmic scale with a base of 10. The first circle denotes the
  pathway number and classification. The length of the rectangles in the second circle
  corresponds to the number of genes within each GO entry, with darker colors indicating
  greater enrichment significance. The length of the rectangles in the third circle
  reflects the number of genes overlapping with the respective GO entry in the input
  gene set. The fourth circle depicts the ratio of the number of genes in the third
  circle to the corresponding number of genes in the second circle. (E) The Kyoto
  Encyclopedia of Genes and Genomes (KEGG) bubble map displays the enrichment pathways
  of intersecting genes. The x-axis represents the gene ratio, calculated as the number
  of genes associated with a specific KEGG entry in the target gene set divided by
  the total number of genes in the KEGG entries. The y-axis lists the KEGG pathway
  names. The size of the bubbles indicates the number of genes counted, while the
  color gradient represents the corrected p-value, with a redder hue signifying higher
  enrichment significance. (F) A Venn diagram illustrates the intersection between
  genes associated with OTA exposure (red, n = 180) and those related to ccRCC (blue,
  n = 3224), revealing a total of 39 shared target genes, which constitutes 1.2% of
  the overall gene set (n = 3365). The diagram displays the number of genes, while
  the percentages indicate the proportion of genes in each section relative to the
  total. (G) The KEGG bubble map displays the enrichment pathways of Ochratoxin B
  (OTB)–ccRCC genes. (H) The KEGG bubble map displays the enrichment pathways of ccRCC
  differentially expressed genes (DEGs). (I) The KEGG bubble map displays the enrichment
  pathways of OTA genes
