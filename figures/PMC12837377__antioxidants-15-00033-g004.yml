figure_title: Expression patterns of key DEGs under shading treatment.
caption: Expression patterns of key DEGs under shading treatment. (a) Heatmap showing
  the expression levels (Z-score normalized) of selected DEGs significantly enriched
  in the ‘Plant hormone signal transduction’, ‘Photosynthesis–antenna proteins’, and
  ‘MAPK signaling pathway–plant’ KEGG pathways. Key regulators are labeled, including
  ERF1, SNRK2, EIN3. (b) Heatmap showing the expression levels of DEGs related to
  heat stress response, enriched in the ‘Protein processing in endoplasmic reticulum’
  KEGG pathway. Key heat shock protein (HSP) genes are labeled, including Hsp20, Hsp70,
  Hsp90. Each row represents a gene, and each column represents a biological replicate.
  Red color indicates higher expression relative to the mean, and blue color indicates
  lower expression
