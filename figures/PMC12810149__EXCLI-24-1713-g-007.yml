figure_title: Proposed mechanisms linking aircraft noise exposure to cardiovascular
  dysfunction. Aircraft noise activates central stress pathways via the amygdala,
  hippocampus, and hypothalamic-pituitary-adrenal (HPA) axis, leading to sympathetic
  nervous system activation and release of catecholamines (adrenaline, noradrenaline)
  and glucocorticoids (cortisol). These stress mediators act on α- and β-adrenergic
  receptors, stimulating downstream signaling (PIP2, IP3, DAG, PKC) that promotes
  systemic inflammation (NF-κB activation, macrophage recruitment, cytokine release)
  and oxidative stress (ROS generation). Elevated ROS induces endothelial dysfunction,
  vascular inflammation, and blood pressure increases. The pathway also involves chronic
  cortisol resistance and RAAS activation. Pharmacological blockade with propranolol
  (β-blocker) and phenoxybenzamine (α-blocker) attenuates some but not all responses,
  as cortisol signaling, RAAS activation, and tachycardia remain unaffected. Reused
  from (Kuntic et al., 2025) with permission
