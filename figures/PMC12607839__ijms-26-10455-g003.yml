figure_title: Human purine metabolism in cardiac ischemia.
caption: 'Human purine metabolism in cardiac ischemia. Pertinent pathways: formation
  of the purine nucleotide inosine monophosphate (IMP) from non-purine precursors
  (synthesis de novo) or purine bases (salvage reactions); purine nucleotide interconversion
  reactions; degradation to the end product uric acid (catabolic reactions). Abbreviations:
  5′NT—5′-nucleotidase; ADA—adenosine deaminase; ADK-s—adenosine kinase short isoform;
  AK—adenosine kinase; ADP—adenosine diphosphate; AMP—adenosine monophosphate (or
  adenylic acid); AMPD—AMP deaminase; ASS—adenylosuccinate synthetase; ATP—adenosine
  triphosphate; GA—guanase; GDP—guanosine diphosphate; GMP—guanosine monophosphate;
  GR—GMP reductase; GS—GMP synthase; GTP—guanosine triphosphate HGPRT—hypoxanthine–guanine
  phosphoribosyltransferase; IDH—IMP dehydrogenase; IMP—inosine monophosphate; NDPK—nucleoside-diphosphate
  kinase; PNP—purine nucleoside phosphorylase; S-AMP—succinyl-AMP or adenylosuccinate;
  XOR—xanthine oxidoreductase. Created in BioRender. Anielska, A. (2025) https://BioRender.com/p2ftrx0.
  “(accessed on 16 May 2025)”'
