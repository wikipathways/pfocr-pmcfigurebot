caption: Functional pathway analysis. Common pathways of Th2 cytokines IL-4, IL-5,
  IL-6, and IL-13 that were found to have a significantly greater reduction in the
  multinutrient group versus the placebo group. IL-4 plays a large part in B cell
  activation, mast cell release, and induces monocytes to differentiate into dendrites
  and ultimately macrophages. IL-5 stimulates eosinophil growth and differentiation.
  IL-6 activates the HPA-axis, promotes B- and T-cell growth and regulates neuron
  development by stimulating differentiation of stem cells. IL-13 inhibits macrophage
  inflammatory cytokine production, and B-cell growth and development
