figure_title: Altered expression of genes associated with Ca2+ homeostasis in RTT.
caption: Altered expression of genes associated with Ca2+ homeostasis in RTT. The
  KEGG Ca2+ signaling pathway is depicted (ko04020). The genes highlighted in green
  were found altered according to the meta-transcriptomic analysis of RTT models by
  Sanfeliu and collaborators, 2019 [93]. Importantly, genes contributing to Ca2+ rise
  in response to depolarization and genes responsible for the intracellular Ca2+ liberation
  from the endoplasmic reticulum are part of the altered pool of genes common to the
  38 datasets of RTT models
