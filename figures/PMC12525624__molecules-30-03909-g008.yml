figure_title: Metabolic pathways favored by the effect of HPV 16.
caption: Metabolic pathways favored by the effect of HPV 16. (a) Enrichment of metabolic
  pathways favored by HPV 16. The overview shows all matching pathways according to
  the p-values from the pathway enrichment analysis and the impact values from the
  pathway topology analysis. Each node represents a metabolic pathway, nodes colored
  red and numbered 1 to 14 represent metabolic pathways with a p-value > 0.05. (1)
  Aminoacyl-tRNA biosynthesis; (2) Pentose phosphate pathway; (3) Arginine biosynthesis;
  (4) Valine, leucine and isoleucine biosynthesis; (5) Glycolysis or Gluconeogenesis;
  (6) Neomycin, kanamycin and gentamicin biosynthesis; (7) Citrate cycle (TCA cycle);
  (8) Nitrogen metabolism; (9) Glycine, serine and threonine metabolism; (10) Starch
  and sucrose metabolism; (11) Galactose metabolism; (12) Glutathione metabolism;
  (13) Alanine, aspartate and glutamate metabolism and (14) One carbon pool by folate.
  (b) The integration of the metabolic pathways favored by HPV 16 is shown. The diagram
  was constructed by synthesizing the metabolic pathways presented in panel (a), and
  each pathway represented by a node was retrieved from the KEGG database
