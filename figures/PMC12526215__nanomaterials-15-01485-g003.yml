figure_title: 'Representative strategies for active-site mimicry in photocatalytic
  nitrogen fixation: structural and electronic emulation of the FeMo cofactor.'
caption: 'Representative strategies for active-site mimicry in photocatalytic nitrogen
  fixation: structural and electronic emulation of the FeMo cofactor. Reproduced with
  permission. (a) Proposed photocatalytic N2 reduction pathway over a Fe–MoTe2 heterostructure
  under visible light. The Fe–Mo dual-site interface replicates the binuclear arrangement
  of FeMoco, enabling synergistic adsorption and activation of N2 via charge redistribution.
  Reproduced with permission [43]. Copyright © 2020 Royal Society of Chemistry. (b)
  Schematic representation of the FeBiVO4-0.05BP photocatalyst. The Fe active site
  simulates the iron center of nitrogenase, while BiVO4 provides a visible-light-absorbing
  matrix. The dual-functional architecture facilitates stepwise N2 protonation and
  suppresses competing HER via proton channel redirection. Adapted from ref. Reproduced
  with permission [44]. Copyright © 2023 Royal Society of Chemistry. (c) Molecular
  and structural design of Mo(IV)-doped FeS2. Upper panel: structural analogy to the
  FeMo cofactor of nitrogenase with [Fe–S2–Mo] motifs; lower panel: schematic of FeS2
  with Mo substitution, which induces Fe–Mo–S coordination resembling FeMoco subunits
  and enhances N2 adsorption capacity. Reproduced with permission [45]. Copyright
  © 2020 American Chemical Society. (d) Atomic-scale imaging and model of Fe single-atom
  anchored on sMoS2. The Fe1 center occupies a Mo atop site in a trigonal prismatic
  environment, forming a [Fe–S2–Mo] unit analogous to enzymatic cofactor geometry.
  The system exhibits strong photothermal synergy in NRR, with photogenerated excitons
  extended by thermally activated carrier lifetimes. Reproduced with permission [46].
  Copyright © 2021 Cell Press. (e) Schematic of K+-intercalated crystalline carbon
  nitride (KCCN) containing nitrogen vacancies (NVs) for visible-light-driven nitrogen
  photofixation. NVs chemisorb and activate N2, while intercalated K+ enables robust
  electron storage within the carbon nitride framework [47]. Copyright © 2022 Elsevier'
