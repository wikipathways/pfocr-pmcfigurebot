figure_title: Branched-Chain Amino Acids Metabolism in DCM.
caption: Branched-Chain Amino Acids Metabolism in DCM. Under physiological conditions,
  BCAAs undergo catabolism via a series of enzymatic reactions in the mitochondria
  of skeletal muscle, myocardium, and hepatic tissues. In diabetes, the interplay
  of impaired glucose/lipid metabolism, vagal dysfunction, and gut microbiota disruption
  alters the status of substrates and enzymes within the myocardial BCAA metabolic
  pathway, which contributes to the pathogenesis of DCM. Mechanistically, autophagy
  dysregulation, oxidative stress, and inflammatory responses collectively drive myocardial
  hypertrophy and fibrosis, ultimately manifesting as impaired cardiac function. An
  upward arrow indicates an increase in a substance or the promotion of a biological
  process, while a downward arrow indicates a decrease in a substance or the inhibition
  of a biological process
