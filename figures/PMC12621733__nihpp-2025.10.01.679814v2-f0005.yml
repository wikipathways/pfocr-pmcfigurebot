figure_title: The JAK–STAT pathway regulates CG5966 and schlank expression in the
  fat body
caption: a, c, qRT–PCR of CG5966 (a) and schlank (c) mRNA in the fat body of flies
  with or without ISC Upd3 or Pvf1 expression (esg>Upd3 or Pvf1) at day 8 (n = 3).
  b, d, CG5966 (b) and schlank (d) mRNA in the fat body of flies with or without fat-body
  Stat92E-act (constitutive-activated form of Stat92e) expression at day 8 (n = 3).
  e, g, CG5966 (e) and schlank (g) mRNA in the fat body of control, Yki flies, and
  Yki flies with fat-body hop depletion at day 6 (n = 3). f, h, CG5966 (f) and schlank
  (h) mRNA in the fat body of Yki flies with or without fat-body Stat92e depletion
  at day 6 (n = 3). i, Data from the ChIP-seq database indicating enrichment of Stat92e
  binding at the CG5966 and schlank promoter and gene regions. j, ChIP revealed the
  enrichment of HA-tagged Stat92E-act binding at the CG5966 and schlank promoter and
  gene regions, shown by fold changes relative to control IgG at day 8 (n = 3). Neg,
  negative control. k, Relative levels of whole-body ceramide levels of control, Yki
  flies, and Yki flies with fat-body hop or Stat92E depletion at day 6 (n > 3), data
  were retrieved from lipidomics analysis. l, Live imaging of lysosome and autophagic
  vesicles in Yki flies with or without fat-body hop or Stat92e depletion at day 7.
  m-q, Quantification of autophagic vesicle numbers (m) and sizes (n), lysosome numbers
  (o) and sizes (p), and autolysosome numbers (q) in l (n > 15). r, Western blot showing
  pro and matured forms of CtsL in control flies, Yki flies with or without fat-body
  hop or Stat92e depletion at day 7. Rhodamine was used as loading control. The same
  membrane was probed sequentially with Atg8 antibody in S4a, loading control is shared.
  *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001, ns indicates not significant.
  Error bars indicate SDs. n indicates the number of biological replicates in each
  experiment
