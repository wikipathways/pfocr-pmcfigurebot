caption: 'Integrative pathway analysis of metabolomics and proteomics between HSIL
  tissues and paired adjacent normal tissues. (A) Network constructed by integrating
  differential metabolomic and proteomic data. Rectangular nodes represent KEGG pathways,
  with a yellow-to-blue gradient indicating significance (p-value): yellow represents
  smaller p-values and blue represents larger p-values. Circular nodes denote proteins/genes,
  and pentagonal nodes represent metabolites, red indicates upregulation and green
  indicates downregulation. (B) The plot shows the enriched KEGG pathways from integrated
  proteomic and metabolomic data. Numbers in parentheses represent the p value. (C)
  The number of shared pathways between metabonomic and proteomic analyses. (D) The
  heatmap of shared KEGG pathways between metabonomic and proteomic analyses'
