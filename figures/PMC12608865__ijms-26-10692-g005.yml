figure_title: ECS components and cannabinoid receptor signaling pathways.
caption: ECS components and cannabinoid receptor signaling pathways. Panel (A). Endocannabinoid
  System. The main endocannabinoids (eCBs) are anandamide (AEA) and 2-arachidonoylglycerol
  (2-AG). AEA synthesis involves N-acyltransferase (NAT) and NAPE-phospholipase D
  (NAPE-PLD). 2-AG is synthesized via phospholipase C (PLC) and diacylglycerol lipase
  (DAGL). FAAH degrades AEA, and MAGL degrades 2-AG; both yield arachidonic acid.
  Panel (B). Cannabinoid receptor signaling. CB1R couples to Gi/o proteins, inhibiting
  adenylyl cyclase, blocking Ca2+ channels, opening K+ channels and activating MAPK/ERK
  pathways. CB2R shows similar adenylyl cyclase inhibition and MAPK activation without
  ionic channel modulation. GPR119 couples to Gs proteins, stimulating cAMP/PKA signaling.
  GPR55 couples to G13 proteins, activating PLC/RhoA pathways and increasing Ca2+
  and MAPK/ERK signaling. TRPV1 activation causes cation influx and depolarization.
  CB1R/CB2R activate KROX-24 via MAPK/ERK, regulating synaptic plasticity and gene
  expression
