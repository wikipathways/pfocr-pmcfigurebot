figure_title: Transcriptome sequencing analysis of healthy and atretic follicles.
caption: 'Transcriptome sequencing analysis of healthy and atretic follicles. (A)
  Healthy follicles (H), primary atretic follicle (EA), and atretic follicles (PA)
  were collected from different ovaries of pigs for transcriptome sequencing. In the
  schematic diagram of ovarian tissue, arrows indicate follicles, red arrows: healthy
  follicles, black arrows: atretic follicles. (B) Differences in the content of ferroptosis
  markers among healthy follicles, primary atresia follicles, and atresia follicles.
  (C) Volcanic and heat maps of differential genes in healthy follicles and atretic
  follicles. (D) Differential gene GO enrichment analysis of healthy follicles and
  atretic follicles. (E) Differential gene KEGG enrichment analysis of healthy follicles
  and atretic follicles. (F) Differential expression of NF-κB/PTGS2-related genes
  by transcriptome sequencing. (G) NF-κB and KEGG gene set enrichment analysis of
  the ferroptosis pathway. Significance: *, p < 0.05; **, p < 0.01; ***, p < 0.001;
  ****, p < 0.0001'
