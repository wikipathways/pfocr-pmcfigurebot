figure_title: Pathophysiological network underlying insulin resistance in metabolic
  syndrome.
caption: 'Pathophysiological network underlying insulin resistance in metabolic syndrome.
  IR represents the central node of MetS, resulting from coordinated dysfunction in
  adipose tissue, liver, skeletal muscle, and gut microbiota. Activation of the inflammatory
  redox loop, driven by NF-κB, NLRP3, and excess ROS with impaired NRF2 signaling,
  promotes systemic inflammation and oxidative stress. These alterations impair IRS-PI3K-AKT
  signaling, reduce GLUT4 translocation, and lead to hyperinsulinemia, hyperglycemia,
  dyslipidemia, and metabolic inflexibility. Gut-derived LPS-TLR4 signaling further
  amplifies inflammation, reinforcing the progression of MetS. Arrows indicate the
  direction and functional impact of interactions among tissues and pathways. Abbreviations:
  IR, insulin resistance; MetS, metabolic syndrome; NF-κB, nuclear factor kappa B;
  NLRP3, NLR family pyrin domain containing 3; ROS, reactive oxygen species; NRF2,
  nuclear factor erythroid 2–related factor 2; IRS, insulin receptor substrate; PI3K,
  phosphoinositide 3-kinase; AKT, protein kinase B; GLUT4, glucose transporter type
  4; LPS, lipopolysaccharide; TLR4, Toll-like receptor 4; SCFAs, short-chain fatty
  acids'
