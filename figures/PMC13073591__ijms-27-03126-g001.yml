figure_title: Differentially expressed mRNAs and associated molecular networks in
  the suicidal prefrontal cortex.
caption: Differentially expressed mRNAs and associated molecular networks in the suicidal
  prefrontal cortex. Data from the GSE101521 dataset (dorsolateral prefrontal cortex,
  BA9) were gathered to perform a differential expression analysis of mRNAs. (A) Heatmap
  showing fold change values of differentially expressed mRNAs identified using DESeq2
  compared with controls. (B) A co-expression (unweighted) network was constructed
  from the expression patterns of differentially expressed mRNAs. Nodes represent
  genes; edges, represent the statistically significant co-expression relationships
  identified using mutual information. Functional enrichment analysis based on KEGG
  pathways (C), Gene Ontology biological processes (D), and disease associations (E).
  The enrichment analyses were performed using an expanded network derived from the
  original differentially expressed genes. “Genes (Hits)” indicates the number of
  genes from this expanded network associated with each functional term. Statistical
  significance was set at p < 0.05, adjusted by using a hypergeometric test with multiple
  testing correction
