figure_title: Regional and role-specific reallocations of path efficiency across species
caption: (a) Path efficiency distributions (inverse-rank values) for the six region–role
  combinations showing significant cross-species differences by Kruskal–Wallis tests
  (see Table 1). Thin colored lines represent individual paths, thick black curves
  indicate smoothed species means, and shaded bands denote 95% confidence intervals.
  Human gains are most evident in anterior insula (source and target) and superior
  temporal (source), rhesus maxima appear in inferior temporal (source), and marmoset
  maxima occur in olfactory inflows and outflows.(b) Regional maps of cross-species
  divergence, with Table 1 Kruskal–Wallis differences (Diff values) projected onto
  anatomical ROIs. Regions with Diff > 5.0 are highlighted. Source-role analyses identify
  the anterior insula, superior temporal, inferior temporal, and anterior olfactory
  cortex as loci with significant divergence in at least one species. Target-role
  analyses identify the anterior insula and piriform cortex as regions with the strongest
  species differences.(c) Pairwise species comparisons of path efficiency for the
  six significant region–role combinations, using Dunn’s post hoc tests (see Supplementary
  Table 2). Heatmaps show mean paired differences (row – column); blue indicates higher
  efficiency in the column species, red indicates higher efficiency in the row species.
  The clearest human advantages occur in anterior insula (both roles) and superior
  temporal (source), while marmoset retains high olfactory influence (anterior source
  and piriform target). Together, these analyses pinpoint the specific cortical and
  subcortical loci where efficiency has been differentially reallocated across lineages,
  highlighting human amplification of temporal–insula roles, primate specialization
  of inferior temporal outflows, and marmoset preservation of olfactory pathways
article_title: Directed connectomes across species reveal conserved and divergent
  pathways of neural signaling
