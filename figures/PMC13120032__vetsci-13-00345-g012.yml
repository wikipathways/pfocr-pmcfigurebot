figure_title: Metabolite–metabolite correlation network constructed from the top 80
  most variable metabolites across all samples.
caption: 'Metabolite–metabolite correlation network constructed from the top 80 most
  variable metabolites across all samples. Edges represent Pearson correlations with
  |r| > 0.75 (80 nodes, 138 edges). Red edges: positive correlations; blue edges:
  negative correlations. Node size is proportional to degree (number of connections).
  Nodes are colour-coded by KEGG pathway: protein digestion (light pink/rose), tyrosine
  (purple), tryptophan (blue), arginine (orange), xenobiotics (grey), alanine (green),
  lysine (magenta), and glycine (dark orange/brown). Two major co-regulation modules
  are evident: (i) a densely connected central cluster of free amino acids and xenobiotic
  metabolites that increased coordinately from D2 to D21, including 1H-Indole-3-methanamine,
  S-Adenosyl-L-homocysteine, and alpha-D-Glucosamine 1-phosphate; and (ii) a peripheral
  cluster of dipeptides and catecholamine-related metabolites that decreased coordinately.
  Cross-module negative correlations connect these two clusters, consistent with a
  shift from dipeptide accumulation (proteolysis) toward free amino acid release during
  mammary involution. n = 40 samples (10 per group); Pearson correlation on log2-transformed
  relative abundances'
