figure_title: Stress-induced mtRNA release triggers inflammation in neighboring cells.
caption: Stress-induced mtRNA release triggers inflammation in neighboring cells.
  Under cellular stress or injury conditions, mt-dsRNA may be encapsulated into exosomes
  through membrane fusion-mediated extracellular release. These vesicles are subsequently
  internalized by neighboring cells via endocytic mechanisms. Intracellular recognition
  of mt-dsRNA by TLR3 triggers the activation of both IRF3/7 and NF-κB signaling pathways,
  ultimately driving inflammatory responses. TLR3; toll-like receptor 3, NF-κB; nuclear
  factor-κB, IRF3/7; interferon regulatory factor 3/7
