figure_title: White-opaque switching in C.
caption: White-opaque switching in C. albicans is regulated by multiple environmental
  factors and signal transduction pathways. The cAMP/PKA, MAPK, pH sensing, Hog1,
  and Vps21 signaling pathways converge on the regulation of the WOR1 master regulator
  of white-opaque switching. In MTLa/α strains, transcriptional regulators Efg1, Rfg1,
  Brg1, Sfl2, and a1-α2 repress the expression of WOR1. Arrows indicate activating
  effects, and lines with bars indicate inhibiting effects
