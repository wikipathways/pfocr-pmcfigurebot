figure_title: Biosynthetic Pathway of MA in Mycobacteria.
caption: Biosynthetic Pathway of MA in Mycobacteria. During MA biosynthesis, the FAS-I
  (yellow module) and FAS-II (pink module) fatty acid synthase systems synergistically
  generate the α-branch and meromycolic chain. Then, these precursors condense to
  form MA, which is subsequently transported to the outer membrane via a transmembrane
  system. Enzymes marked with “*” are regulated at the transcriptional and post-translational
  levels via Ser/Thr phosphorylation. Inhibitors targeting enzymes in the MA biosynthesis
  pathway are highlighted in purple
