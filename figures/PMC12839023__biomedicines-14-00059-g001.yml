  Vascular Dementia, driving mixed dementia. The focus is on the redox imbalance shared
  by these diseases and that potentiates the pathogenetic pathway affecting neuron
  viability. The blue color was used to better differentiate the context of brain
  barrier and the interstitial space between neurons and glial cells (black color).
