figure_title: Kms1 restrains the use of a microhomology-driven DNA repair pathway
caption: A) Analysis approach for 5-FOA-resistant colonies. B) PCR amplifying across
  the junction of the HO sites produces products of the expected size (~500bp) resulting
  from loss of the entire sequence between the two cut sites with slightly larger
  products also observed (red asterisks) in WT cells, while kms1Δ cells produce both
  WT-like small products and larger products, which are similar to products observed
  in the lig4Δ background. To control for technical failure of the colony PCR, a 3.5kb
  “control product” was also generated. C) PCR analysis of a pool of genomic DNA confirmed
  that kms1Δ cells can produce a mixture of products. D) Sequencing reveals that the
  most common product in WT cells is produced by a 4bp overhang left by the HO site
  5’ to ura4, and the untemplated insertion of a single T base. In kms1Δ cells producing
  a similarly sized product to WT cells there are small losses of sequence at the
  junction but no untemplated insertions. Three products were in common (black bars).
  E) WT and kms1Δ cells produce isolates that result from cleavage of both HO sites
  and lead to small deletions/insertions at the DSB junction. Larger products in kms1Δ
  cells are produced when the 3’ site and a portion of the ura4 sequence is retained
  through use of a microhomology within the ura4 gene body. In the lig4Δ background,
  neither end of the DSB is able to simply rejoin, and instead repair using microhomology
  within the ura4 gene leads to loss of a portion of the sequence. These products
  are also observed in kms1Δ cells, further supporting the idea that kms1Δ cells can
  produce a variety of products
article_title: The LINC complex component Kms1 and CENP-B protein Cbp1 cooperate to
  enforce faithful homology-directed DNA repair at the nuclear periphery in S. pombe
