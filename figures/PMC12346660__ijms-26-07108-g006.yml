caption: Integrated transcriptomic and metabolomic analysis of cholesterol-mediated
  metabolic reprogramming in HeLa cells. (A) Enrichment analysis of key pathways altered
  by cholesterol treatment. Larger circles indicate greater pathway enrichment, while
  darker colorsdenote higher statistical significance. (B) Bubble plot visualizing
  pathway enrichment results. (C) A schematic diagram of UDP-GlcNAc generation dependent
  on GFPT1 and the protein O-GlcNAc modification signaling pathway. Black straight
  arrows indicate the direction of metabolic conversion (straight downward), the upregulation
  of a gene or metabolite are shown by green arrows adjacent to labels). The curved
  arrow represents the O-linked N-acetylglucosamine transferae (OGT) catalyzed transfer
  of O-GlcNAc from UDP-GlcNAc to target proteins
