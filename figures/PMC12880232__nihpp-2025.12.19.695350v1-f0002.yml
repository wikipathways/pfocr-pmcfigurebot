figure_title: Identification of genetic pathways that regulate neuronal survival in
  individual and aggregated metabolic states
caption: 'A) Over-representation analysis among the gene KDs with the lowest average
  survival across averaged Respiratory states reveals the essentiality of genes involved
  in cellular respiration, complex I assembly, and protein lipoylation. Among gene
  KDs that limit survival across averaged Glycolytic states, we observe an over-representation
  of genes that code for parts of the cytoskeleton and neuron projection proteins.
  Genes encoding the pentose phosphate pathway are essential across averaged Hypoxia
  metabolic states. All “hit” pathways shown had an adjusted p < 0.05 in their respective
  aggregated metabolic state. B–D) Over-representation analysis among the genes with
  the greatest impact on survival in each individual metabolic state reveals genetic
  pathways that are either mitochondrial (B), non-mitochondrial (C), or (D) disease-
  and disorder-associated genes. Metabolic states were set by using media that enabled
  either 1) unrestricted respiration and glycolysis: “U”, 2) respiration only: “R”,
  3) glycolysis only: “G”, or 4) contained physiological levels of respiratory and
  glycolytic fuels: “P”. All displayed pathways had an adjusted p < 0.05 in at least
  one individual metabolic state'
