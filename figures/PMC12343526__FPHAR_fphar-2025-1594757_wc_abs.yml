figure_title: Schematic representation of Quercetin’s anti-fibrotic effects through
  the FSTL1/NF-κB pathway.
caption: Schematic representation of Quercetin’s anti-fibrotic effects through the
  FSTL1/NF-κB pathway. BLM/TGF-β1 induces epithelial-mesenchymal transition (EMT),
  inflammation, and pulmonary fibrosis by activating the FSTL1/NF-κB signaling pathway.
  Quercetin inhibits the FSTL1/NF-κB pathway, thereby alleviating EMT, inflammation,
  and suppressing pulmonary fibrosis. FSTL1 knockout abolishes the anti-fibrotic and
  anti-inflammatory effects of Quercetin
article_title: Quercetin ameliorates epithelial-mesenchymal transition and inflammation
  by targeting FSTL1 and modulating the NF-κB pathway in pulmonary fibrosis
