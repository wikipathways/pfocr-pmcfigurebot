figure_title: Inhibition of FAK affects the expression of multiple VSMC signaling
  pathways and counterbalances osteogenic medium-induced gene expression changes
caption: A, There were 7,211 differentially expressed genes comparing HASMCs in osteogenic
  medium versus common medium, of which >2000 are impacted by treatment with FAK inhibitor
  (Q value ≤ 0.05). B, Pathway analyses identified multiple signaling pathways involved
  in cell homeostasis, function, and calcification that are affected by FAK inhibition.
  C, 28 genes reported to be associated with calcification and/or atherosclerosis
  were significantly upregulated in HASMC cultured in osteogenic medium in contrast
  to common medium but were restored towards normal levels with treatment with FAK
  inhibitor. The genes were identified from those with a Q value <1.0×10−10 when comparing
  common media versus osteogenic media and when comparing vehicle (DMSO) or VS-6063
  in osteogenic media
