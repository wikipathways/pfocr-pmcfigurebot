figure_title: Pulmonary microbiota dysbiosis drives lung cancer progression through
  dual mechanisms.
caption: Pulmonary microbiota dysbiosis drives lung cancer progression through dual
  mechanisms. Airway microbiota dysbiosis drives lung cancer progression through multiple
  mechanisms, including direct activation of ERK/MAPK, PI3K/AKT, and inflammasome
  signaling pathways in respiratory epithelial cells to promote tumorigenesis; modulation
  of key gene expression indicated by positive correlations between tumor bacterial
  burden and CTNNB1 (Wnt/β-catenin), HIF1A (hypoxia response), and VEGFA (angiogenesis),
  alongside negative correlations with TP73 and TLR5; and immune microenvironment
  remodeling evidenced by positive associations between bacterial diversity and CAF
  infiltration or immune exclusion traits, resulting in enrichment of neutrophils,
  macrophages, and NK cells in high-diversity tumors and closely linked to increased
  PD-1⁺ T cells and CD4⁺ T cell exhaustion. Specifically, airway dysbiosis induces
  Myd88-dependent IL-1β/IL-23 release from alveolar macrophages and neutrophils, activating
  tissue-resident Vγ6⁺Vδ1⁺ γδ T cells to secrete IL-17. This synergizes with Th17
  cell responses to drive neutrophilic recruitment and perpetuate pulmonary inflammation.
  Lung cancer tissue-enriched Aspergillus sydowii induces IL-1β via the β-glucan/Dectin-1/CARD9
  axis, promoting MDSC and Treg expansion alongside PD-1⁺CD8⁺ T cell accumulation,
  fostering immunosuppression. Roseburia-derived butyrate upregulates non-coding RNA
  H19, increasing MMPs like MMP15 to facilitate metastasis; concurrently, butyrate
  polarizes M2 macrophages to secrete IL-10, IL-13, and MIP3α, enhancing tumor migration
  and invasion. Figure 2 was created using BioRender and holds the appropriate license.
