figure_title: Schematic overview of proteolytic pathways and summary findings.
caption: Schematic overview of proteolytic pathways and summary findings. (A) Summary
  of differentially expressed genes (DEGs) identified in the phagosome/endosome and
  autophagy–lysosomal pathways that are upregulated (red) or downregulated (blue)
  in response to POS trafficking and processing compared to control RPE. Differentially
  expressed transcriptional patterns from the previous timepoint are indicated by
  red (upregulation) or blue (downregulation) boxes. These broadly follow a pattern
  consistent with the temporal dynamics of POS trafficking and processing, revealing
  new links between cargo handling and transcriptome-level responses in RPE cells.
  (B) Proteolytic pathways that function in parallel with potential for cross-talk.
  The autophagy–lysosomal pathway internalises shed photoceptor outer segments (POS)
  daily from overlying photoreceptors which are subsequently trafficked for degradation
  in autolysosomes. By contrast, misfolded proteins are degraded via the ubiquitin–proteosome
  system. Here, polyubiquitinated proteins are targeted to the proteosome, where the
  muti-subunit 26S complex recognises, unfolds and degrades these substrates into
  smaller peptides. In the chaperone-mediated pathway, target proteins are recognised
  via the KFERQ or similar motifs by the heat shock cognate protein 70 (Hsc70) and
  guided to lysosomes alongside other chaperones for degradation. Even though POS
  cargos are trafficked and degraded in the autophagy lysosomal pathway, our findings
  reveal an initial upregulation of genes in the ubiquitin–proteosome system and the
  chaperone-mediated pathway at 4–6 h following POS entry into RPE cells
