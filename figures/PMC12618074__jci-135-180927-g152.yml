figure_title: USP10 expression correlates with upregulation of PTEN and PI3K pathway
  signaling
caption: (A and B) K means = 3 clustering of human invasive ductal carcinoma single-cell
  sequencing data set (https://www.10xgenomics.com/datasets/7-5-k-sorted-cells-from-human-invasive-ductal-carcinoma-3-v-3-1-3-1-standard-6-0-0).
  (A) Heatmap of differentially expressed genes in the K-means = 3 clusters. (B) USP10
  expression in the different clusters is shown (black). Cluster 1 = cancer, cluster
  2 = unidentified/mixed tissue, cluster 3 = stroma. (C) Violin plots of USP10, PTEN,
  PCNA, or PIK-AKT Hallmark genes in the K means = 3 clusters. Data demonstrate the
  predominant expression of USP10 and PCNA in cancer tissue (cluster 1), PTEN expression
  in cluster 1 (BRCA) and stroma (Cluster 3), and the expression of PIK-AKT hallmark
  genes in clusters 1 and 3, respectively. Data were visualized using the 10x Genomics
  Loupe browser (version 8.0). (D) Correlation analysis of the expression of USP10
  and PTEN in the single-cell sequencing data set on human invasive ductal carcinoma.
  Cells with predominantly high expression of USP10 are represented in blue and PTEN-expressing
  cells are marked in yellow. Co-expression is visualized in green. The zoomed-in
  view shows the predominant co-expression of USP10 and PTEN in BRCA. Data were visualized
  using the 10x Genomics Loupe browser (version 8.0). (E) Correlation analysis of
  USP10 and genes of the PIK-AKT-Hallmark gene set on human invasive ductal carcinoma.
  Areas of high USP10 expression are represented in yellow, PIK-AKT-Hallmark gene
  sets only are marked in blue, co-expression is visualized in green. The zoomed-in
  view shows the predominant co-expression of USP10 and PIK-AKT-Hallmark genes in
  BRCA. Data were visualized using the 10x Genomics Loupe browser (version 8.0)
