caption: GO and KEGG enrichment analysis of common DEGs in comparison combinations
  of worker bees of different age groups. (A) Results of GO functional enrichment
  analysis, presented by categories of biological process (BP), cellular component
  (CC), and molecular function (MF). The x-axis represents functional descriptions,
  and the y-axis, −log10(p-value), reflects the significance of enrichment, with larger
  values indicating greater significance. (B) Results of KEGG enrichment analysis.
  The x-axis, GeneRatio, represents the ratio of the number of DEGs enriched in a
  particular pathway to the total number of DEGs. The y-axis lists the pathway names.
  The color of each dot indicates the p-value (redder colors indicate greater significance),
  and larger size of each dot represents a higher number of genes enriched in that
  pathway
