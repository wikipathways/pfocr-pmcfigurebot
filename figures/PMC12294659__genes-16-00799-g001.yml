figure_title: DPH5 and the diphthamidation pathway.
caption: DPH5 and the diphthamidation pathway. DPH5 is important in diphthamide synthesis,
  which is important in the regulation of protein translation in general, particularly
  in selenoprotein translation and hence oxidative stress balance, although other
  pathways may be feasible but are not known to date. In the top left, DPH5 catalyzes
  the diphthamidation of eEF2 (black arrow denotes the conversion of non-diphthamidated
  to diphthamidated eEF2 through DPH5 activity). In the right panel, diphthamidated
  eEF2 facilitates efficient protein translation (indicated by grey arrows representing
  sequential translation steps; grey components depict the ribosome; colored rectangles
  represent tRNAs carrying amino acids shown as colored circles; the colored line
  along which ribosomes and tRNAs assemble represents mature mRNA with its nucleotide
  sequence), visualized in the bottom left (connected via a black arrow from right
  to left). It also promotes selenoprotein synthesis (indicated by a black arrow from
  top right to bottom left), shown in the bottom center. Selenoproteins contribute
  to the reduction (thick downward arrow) of reactive oxygen species (ROS, indicated
  by a black arrow), ultimately leading to decreased activation of the NF-κB signaling
  pathway. Created in BioRender (https://www.biorender.com/)
