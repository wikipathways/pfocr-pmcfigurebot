figure_title: PfATC, PfCPSII and PfDHODH are dispensable in the presence of a pyrimidine
  salvage pathway
caption: (A) PfATCCD, (B) PfCPSIICD, and (C) PfDHODHCD parasites expressing mCh-FUR1
  were monitored for their growth kinetics in the presence or absence of aTet and
  uracil by flow cytometry for 8 days. Parasite death resulting from the removal of
  aTet could be prevented with uracil supplementation. Growth curves were generated
  from two biological experiments were conducted in quadruplicate. Error bars represent
  standard deviations from the mean. Two-way ANOVA was performed using GraphPad Prism
  10 (GraphPad Software, Inc) followed by Bonferroni’s correction, with significant
  differences noted between - aTet and – aTet +Uracil conditions. (*, P ≤ 0.05; **,
  P ≤ 0.01; ***, P ≤ 0.001; ****, P ≤ 0.0001)
