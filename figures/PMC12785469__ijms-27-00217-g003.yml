figure_title: PFKFB3 is preferentiallyexpressed in TAMs in human colon cancer tissues.
caption: PFKFB3 is preferentiallyexpressed in TAMs in human colon cancer tissues.
  Representative confocal microscopy images of human colon cancer tissues stained
  with antibodies against PFKFB3 (red), the macrophage marker CD68 (green), and DAPI
  for nuclei (blue). The merged image shows co-localization of PFKFB3 and CD68 (orange),
  confirming PFKFB3 expression in TAMs. Scale bar = 50 µm. This observation emphasizes
  the critical role of stromal cells, particularly TAMs, in the metabolic reprogramming
  of the tumor niche. Our findings support the importance of investigating cell-specific
  contributions to PFKFB3-mediated pathways in CRC development. Specifically, the
  role of PFKFB3 expression in TAMs may be critical for regulating immunosuppression
  and metabolic adaptation within the TME
