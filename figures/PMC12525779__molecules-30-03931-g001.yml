figure_title: The upstream pathways for the biosynthesis of PACs.
caption: The upstream pathways for the biosynthesis of PACs. (a) The shikimate pathway
  for the synthesis of aromatic receptor precursors. The intermediaries of this pathway
  are PEP, E4P, DAHP, DHQ, DHS, SHIK, S3P, EPSP, CHA. The enzymes involved in the
  pathway include DAHP synthase (DAHPS), DHQ synthase (DHQS), DHQ dehydratase/shikimate
  dehydrogenase (DHQD/SDH), SK, EPSP synthase (EPSPS), chorismate synthase (CS). (b,c)
  are two pathways for the synthesis of IPP and DMAPP. (b) MEP pathway. The intermediaries
  of MEP pathway are G3P, PYR, DXP, MEP, CD-ME, 2-phospho-4-(cytidine 5′-diphospho)2-C-methyl-D-erythritol
  (CD-ME2P), 2-C-methyl-D-erythritol 2,4-cyclodiphosphate (ME-cPP), and HMBPP. The
  enzymes involved in the MEP pathway include DXS, DXR, MCT, CMK, MDS, HDS and HDR.
  (c) MVA pathway. The intermediaries of the MVA pathway are acetyl-CoA, acetoacetyl-CoA,
  HMG-CoA, MVA, 5-phosphomevalonate (MVP), and 5-diphosphomevalonate (MVPP). The enzymes
  involved in the MVA pathway include AACT, HMGS, HMGR, MK and PMK, MVD, and IDI.
  (d) The pathway for synthesizing prenyl side chain donors with IPP and DMAPP as
  precursors. The prenyl side chain donors include GPP, FPP, GGPP, heptaprenyl diphosphate
  (HPP), octaprenyl diphosphate (OPP), decaprenyl diphosphate (DPP)
