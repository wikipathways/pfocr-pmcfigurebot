figure_title: Knockdown of POSTN decreases the expression of proinflammatory factors
  in KFs.
caption: Knockdown of POSTN decreases the expression of proinflammatory factors in
  KFs. (A) Cytokine-cytokine receptor interaction pathway was revealed to be associated
  with POSTN knockdown in KFs by gene set enrichment analysis. (B) Heatmap showing
  DEGs related to cytokine-cytokine receptor interaction in si-POSTN and si-CTL KFs.
  The red box highlights the downregulated expression of IL-4R in si-POSTN KFs compared
  with si-CTL KFs. Three independent RNA-sequencing experiments are shown in each
  group. (C) Reverse transcription-quantitative PCR was performed to validate the
  DEGs related to cytokine-cytokine receptor interaction in si-POSTN- and si-CTL-transfected
  KFs (n=4). KF#1 and KF#2 indicate KFs derived from two different patients. ***P<0.001,
  **P<0.01, *P<0.05. DEGs, differentially expressed genes; NES, normalized enrichment
  score; IL-4R, IL-4 receptor; KFs, keloid fibroblasts; POSTN, periostin; si, small
  interfering
