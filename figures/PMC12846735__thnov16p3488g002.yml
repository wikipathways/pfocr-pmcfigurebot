figure_title: PLK1 activates the Wnt/β-catenin signaling pathway in colorectal cancer.
caption: 'PLK1 activates the Wnt/β-catenin signaling pathway in colorectal cancer.
  (A) Gene set enrichment analysis (GSEA) of RNA-seq data from PLK1-overexpressing
  HCT116 cells (HCT116-pLenti-PLK1) revealed significant enrichment of Wnt/β-catenin
  pathway genes (NES, FDR < 0.05). (B) GSEA revealed downregulation of Wnt/β-catenin
  pathway genes in HCT116 cells treated with 1 nM BI2536 for 12 hours (NES, FDR <
  0.05). (C) GSEA demonstrated suppression of Wnt/β-catenin signaling in HCT116 cells
  treated with 1 nM volasertib for 12 hours (NES, FDR < 0.05). (D-E) KEGG pathway
  enrichment analysis of BI2536 and volasertib -treated HCT116 cells revealed that
  Wnt/β-catenin signaling was the significantly altered pathway (p < 0.01). (F) Western
  blot analysis of β-catenin protein levels in CRC cell lines compared with those
  in normal NCM460 cells. β-Actin served as a loading control. The lower panel shows
  densitometric quantification (mean ± SD, n = 3; *p < 0.05, Student''s t test). (G)
  β-catenin protein levels in HCT116 cells following 24 hours of treatment with 10
  nM PLK1 inhibitor. The lower panel shows the results of the quantitative analysis
  (± SD, n = 3; *p < 0.05; representative blot shown). (H) Transwell invasion assay
  in HCT116 cells pretreated with 10 nM PLK1 inhibitor followed by 2 nM Wnt agonist.
  Invasion capacity was rescued by Wnt activation. Quantitative analysis shows the
  mean ± SD, n = 3; *p < 0.05 vs the inhibitor-only group (scale bar: 100 μm). (I)
  Scratch wound healing assay in HCT116 cells treated with the PLK1 inhibitor or the
  Wnt agonist. Wnt activation reversed the migration defect induced by PLK1 inhibition.
  The data represent the means ± SDs, n = 3; *p < 0.05 vs the inhibitor-only group
  (scale bar: 200 μm). (J) Immunofluorescence staining of the proliferation markers
  KI67 and p-H3 (Ser10) in PLK1-knockdown HCT116 cells treated with 2 nM Wnt agonist.
  Wnt activation restored proliferative signals. The data represent the mean fluorescence
  intensity ± SD, n = 3; *p < 0.05 vs the control (scale bar: 50 μm)'
