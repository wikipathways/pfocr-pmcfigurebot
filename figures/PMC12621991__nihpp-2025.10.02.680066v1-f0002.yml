figure_title: Increased glutathione synthesis is necessary to remodel mitochondria
  in the absence of glutamine metabolism
caption: '(A) Schematic diagram illustrating the metabolic pathways of glutamine-derived
  carbons, including their roles in glutathione (GSH) biosynthesis, epigenetic regulation,
  and the tricarboxylic acid (TCA) cycle. (B) Immunofluorescence images of C2C12 MitoTag-mCherry
  cells cultured in +Q or −Q media, treated with dimethyl α-ketoglutarate (αKG), sodium
  succinate (Succ), or vehicle control (Veh). Scale bar = 10 μm. (C) Quantification
  of mitochondrial length under the indicated conditions. Data represent mean ± SD
  from 10 cells per condition. Statistical significance was determined using Student’s
  t-test. (D) Immunofluorescence images of cells treated with αKG, R162 (a Glud1 inhibitor),
  GOT1i (an inhibitor of glutamic-oxaloacetic transaminase 1), or their combinations
  in +Q or −Q media. Scale bar = 10 μm.(E) Quantification of mitochondrial length
  under the indicated treatment conditions. Data represent mean ± SD from 10 cells
  per condition. Statistical significance was determined using Student’s t-test. (F)
  Immunofluorescence images of cells treated with Buthionine Sulfoximine (BSO, a GSH
  synthesis inhibitor) or Veh in +Q or −Q media. Scale bar = 10 μm. (G) Quantification
  of mitochondrial length under the indicated conditions. Data represent mean ± SD
  from 10 cells per condition. Statistical significance was determined using Student’s
  t-test. (H) Immunofluorescence images of cells treated with glutathione reduced
  ethyl ester (GSHEE, a cell-permeable form of GSH) or Veh in +Q or −Q media. Scale
  bar = 10 μm. (I) Quantification of mitochondrial length under the indicated conditions.
  Data represent mean ± SD from 10 cells per condition. Statistical significance was
  determined using Student’s t-test. (J) Immunofluorescence images of cells treated
  with diamide (a thiol-oxidizing agent) or Veh in +Q or −Q media. Scale bar = 10
  μm. (K) Quantification of mitochondrial length under the indicated conditions. Data
  represent mean ± SD from 10 cells per condition. Statistical significance was determined
  using Student’s t-test. (L) Cell death measured by Trypan Blue exclusion in cells
  cultured in glutamine-replete (+Q) or glutamine-free (–Q) media (Day 0) with BSO
  or vehicle (Veh), compared to cells in low-serum media (Day 2). Data represent mean
  ± S.D. from four replicates per condition. Statistical significance was determined
  by Student’s t-test.(M) Brightfield images of cells treated with BSO in glutamine-free
  growth media (10% FBS) or glutamine-free low-serum media (2% horse serum). Statistical
  significance is indicated as P < 0.05 (*, #), determined by Student’s t-test. Data
  are shown as mean ± S.D'
