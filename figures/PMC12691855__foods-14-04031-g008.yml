figure_title: Endogenous phytohormone levels and transcriptomic regulation of their
  signaling pathways in potato tubers.
caption: Endogenous phytohormone levels and transcriptomic regulation of their signaling
  pathways in potato tubers. Contents of gibberellin (A), abscisic acid (B), and jasmonic
  acid (C) quantified in CKL and IAA-treated tubers at 0 and 20 days of storage. Identification
  of differentially expressed genes (DEGs) associated with plant hormone signal transduction
  as determined by a KEGG pathway analysis in CKL 20 d, and IAA 20 d sample groups.
  Gibberellin signaling pathway (D). Jasmonate signaling pathway (E). Abscisic acid
  signaling pathway (F). Red arrow indicates upregulation of DEGs and blue arrow indicates
  downregulation of DEGs in the CKL 20 d vs. IAA 20 d treated group comparison. CKL
  represents the light control group. Data are presented as mean ± standard error
  (n = 3). Different letters indicate significant difference in the treatment of each
  sampling time at p < 0.05
