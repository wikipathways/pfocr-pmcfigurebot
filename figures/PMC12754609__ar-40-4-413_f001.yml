caption: Dysbiotic gut microbiota and the gut-joint axis mechanism in rheumatic diseases.
  Schematic representation of the gut-joint axis linking intestinal dysbiosis to systemic
  inflammation and joint destruction in rheumatic diseases. The illustration depicts
  the intestinal lumen densely populated by microbial communities. Dysbiosis—characterized
  by increased Prevotella, Collinsella, Ruminococcus, Clostridioides difficile, and
  Porphyromonas gingivalis alongside decreased Faecalibacterium, Bifidobacterium,
  and Lactobacillus—leads to disruption of the intestinal epithelial barrier (“leaky
  gut”). This increased permeability allows microbial products such as lipopolysaccharides
  (LPS) to enter the lamina propria and circulation, activating dendritic cells and
  macrophages via pro-inflammatory cytokines (e.g., IL-6, IL-1β, TNF-α, IL-23). The
  resulting skew toward Th17 differentiation (via IL-23 and IL-17 signaling) and reduced
  regulatory Tactivity promotes osteoclastogenesis, synovial inflammation, and bone
  destruction in joints. The figure integrates intestinal, immune, and skeletal compartments,
  illustrating the central mechanistic pathway by which gut dysbiosis contributes
  to rheumatic disease pathogenesis
