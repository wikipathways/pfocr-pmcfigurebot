figure_title: Differential proteomic analysis and pathway enrichment in PBMCs from
  Alzheimer’s disease (AD) patients and controls
caption: (A–C) Volcano plots showing log2 fold change versus −log10 low p-value for
  proteins detected in comparisons of AD male vs. control male (A), AD female vs.
  control female (B), and AD male vs. AD female (C). Numbers of upregulated, downregulated,
  and unchanged proteins are indicated. (D–F) Gene Ontology Biological Process (GOBP)
  enrichment plots for significantly regulated proteins in the same comparisons. (G–I)
  KEGG pathway enrichment plots for the corresponding comparisons. Analyses were performed
  using the iDEP 2.1 web-based platform. Significance of enrichment was defined as
  FDR < 0.1 based on adjusted p-values, and normalized enrichment scores (NES) were
  used to rank pathways
article_title: Exploring Proteomic Differences in PBMCs for Sex-Specific Insights
  into Alzheimer’s Disease
