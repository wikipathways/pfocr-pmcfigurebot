caption: 'RNA-seq of daCO. A Volcano plot of differentially expressed genes between
  daCO and WTO. B Identify differential genes between the daCO and WTO groups and
  genes associated with OcD were identified by Venn diagram analysis. C KEGG pathways
  enriched from differentially expressed genes of daCO versus WTO. Ordinate: 1. OcD,
  2. Leishmaniasis, 3. Tuberculosis, 4. Cytokine-cytokine receptor interaction, 5.
  Inflammatory bowel disease, 6. MAPK signaling pathway, 7. Rheumatoid arthritis,
  8. Pertussis, 9. AGE-RAGE signaling pathway, 10. C-type lectin receptor signaling
  pathway, 11. Type I diabetes mellitus, 12. Hematopoietic cell lineage, 13. Toll-like
  receptor signaling pathway, 14. Influenza A, 15. Hypertrophic cardiomyopathy, 16.
  Toxoplasmosis, 17. Le-gionellosis, 18. Graft-versus-host disease, 19. Prion diseases,
  20. Human T-cell leukemia virus 1 infection. D Heatmap of OcD-related genes. E Validating
  the expression of TGFβ ligands Tgfb1, Tgfb2, and Tgfb3 in daCO. *p < 0.05 by t-test,
  n=3. F Immunohistochemical assay of p-Smad2/3 on the longitudinal cross section
  of mouse femurs. Square boxes are the enlarged area in the diaphysis. * p < 0.05
  by t-test, n=3'
