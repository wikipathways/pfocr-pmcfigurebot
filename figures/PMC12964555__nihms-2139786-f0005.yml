figure_title: Human S100A8 and S100A9 homodimers induce epithelial cytokine responses.
caption: Human S100A8 and S100A9 homodimers induce epithelial cytokine responses.
  (A) Schematic representation of co-immunoprecipitation (Co-IP) experiments performed
  for identification of protein interaction partners of S100A8 and S100A9 in the gut
  lumen of IBD patients shown in B and C. Image was created in https://BioRender.com.
  Volcano plot depicting protein interaction partners of (B) S100A8 and (C) S100A9
  in stool from patients with active IBD (CD, n = 8; UC, n = 8), as identified by
  LC-MS/MS analysis after Co-IP. Significant protein interactions are defined by a
  P value <.05 and a fold change of >2. (D) Single-cell RNA sequencing of human colonic
  organoids, differentiated into monolayers, with Uniform Manifold Approximation and
  Projection (UMAP) projection depicting epithelial cell populations. (E) Heat map
  showing differential cytokine gene expression per cell-type in differentiated organoids
  treated with S100A8, S100A9, or S100A8/S100A9 (1:1), relative to vehicle. Red indicates
  upregulation of cytokine expression, blue indicates down-regulation. (F) Pathway
  RespOnsive GENes for activity inference (PROGENy) pathway activity scores (using
  a multivariate linear model) per epithelial cell type in differentiated organoids
  exposed to S100A8, S100A9, or S100A8/S100A9 (1:1). Red indicates up-regulation of
  a pathway relative to vehicle. CCL, chemokine (C-C motif) ligand; CFLAR, CASP8 and
  FADD like apoptosis regulator; CSF2, colony-stimulating factor 2; CX3CL1, C-X3-C
  motif chemokine ligand 1; CXCL, chemokine (C-X-C motif) ligand; EGFR, epidermal
  growth factor receptor; FDR, false discovery rate; GUCA, guanylate cyclase activator;
  ICAM, intercellular adhesion molecule; ICOSL inducible co-stimulator ligand; IL,
  interleukin; LTB, lymphotoxin-beta; MAPK, mitogen-activated protein kinase; NFκB,
  nuclear factor-κB; PI3K, phosphatidylinositol-3-kinase; PPBP, pro-platelet basic
  protein; PTAFR, platelet-activating factor receptor; JAK/STAT, Janus kinase/signal
  transducer and activator of transcription; TGF, transforming growth factor; TNF,
  tumor necrosis factor; TRAIl, TNF-related apoptosis-inducing ligand; VEGF, vascular
  endothelial growth factor
