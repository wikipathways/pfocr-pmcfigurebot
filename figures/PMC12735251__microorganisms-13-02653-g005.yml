caption: 'TEO exhibited potent anti-inflammatory effects in vitro, attenuating JAK1/STAT3
  signaling pathways in LPS cell models. (A) Western blot analysis of JAK1/STAT3 pathway
  activation and COX-2 expression; (B) TEO modulates RAW264.7 cellular activity; (C–E)
  TEO significantly reduced LPS-induced production of NO, TNF-α, and IL-10 in RAW264.7;
  (F,G) relative mRNA expression of JAK1 and STAT3. Groups: CK, untreated control;
  LPS, 100 ng/mL LPS-induced; TEO, 100 ng/mL LPS-induced and Thuja sutchuenensis essential
  oil at 20 μg/mL. Bars represent mean ± SEM (n = 3). Statistical significance: p
  < 0.01 (**), p< 0.001 (***)'
