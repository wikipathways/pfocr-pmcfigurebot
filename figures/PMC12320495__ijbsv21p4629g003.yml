figure_title: TFPI2 inhibits HCC growth by regulating the GADD45A-STAT3 pathway.
caption: 'TFPI2 inhibits HCC growth by regulating the GADD45A-STAT3 pathway. (A) Heatmap
  shows differential gene expression in TFPI2-overexpressed and control MHCC97H cells.
  (B) RT-qPCR validates gene expression after TFPI2 overexpression. Data are shown
  as the mean ± SEM of n = 3 biological replicates. (C) IHC detects TFPI2 and GADD45A
  expression in 31 cases of HCC tissue microarray. Pearson analysis assesses their
  correlation, p = 0.0003. Scale bar: 250 µm (LM), 50 µm (HM). (D) Western blotting
  determines the effect of GADD45A knockdown in TFPI2-overexpressing cells or GADD45A
  upregulation in TFPI2-knockdown cells on the GADD45A-STAT3 pathway. (E) Colony formation
  detects the effect of GADD45A knockdown in TFPI2-overexpressing HCC cells. Count
  cell colonies with ImageJ; data are shown as the mean ± SEM. *p < 0.05. (F) Orthotopic
  tumor model was established using TFPI2-overexpressing MHCC97H cells with GADD45A
  knockdown, and tumor volume was measured after 4 weeks. TFPI2 overexpression inhibits
  liver tumor volume, while GADD45A knockdown reverses this effect. (G) IHC examines
  TFPI2 and GADD45A expression in harvested tumor tissues. IHC staining was evaluated
  using histochemical scoring. Data are presented as mean ± SEM. *p < 0.05. Scale
  bar: 250 µm (LM), 50 µm (HM)'
