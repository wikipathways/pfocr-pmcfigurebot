caption: (A) (Left) Point range plot of the top 50 proteins with the greatest estimates
  in a linear mixed effects model with post-hoc testing evaluating the association
  with disease activity measured by the physician global assessment (PGA) and (right)
  a heatmap of individual-level z-score NPX expression of this set of proteins. The
  dot represents the fixed effect NPX estimate, and the line the 95% CI summarising
  the association with PGA, accounting for site effect and individual, where negative
  estimates represent proteins positively associated with PGA. A PGA score of 8.5
  was the maximum value in the cohort. (B) Dot plot representing Metacore process
  networks enriched in PGA-associated proteins where dot size represents the percentage
  of DEPs within that pathway and colour represents significance defined by the FDR
  (false discovery rate). (C) Point range plot displaying the top 20 proteins with
  the greatest estimates from the PGA analysis that are also differentially expressed
  in the FU compared to CTL analysis. BL, baseline; CTL, control; DEP, differentially
  expressed protein; IL, interleukin; FU, follow-up; JDM, juvenile dermatomyositis;
  NF-kB, nuclear factor kappa B; NK, natural killer; NPX, normalised protein expression;
  TCR, T cell receptor
article_title: Discovery of tissue-specific proteomic signatures in juvenile dermatomyositis
  highlights pathways reflecting persistent disease activity, clinical heterogeneity,
  and myositis-specific autoantibody subtype
