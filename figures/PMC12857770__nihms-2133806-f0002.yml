figure_title: Selenoprotein changes in Scly KO BAT on a Se deficient diet
caption: 'A. Diagram of the potential pathways for Sec. Pathways focused on are highlighted
  by the colored box. B. qPCR of Dio2 normalized to an average of the following housekeeping
  genes: Gapdh, 18S, and Actb. C. DIO2 activity in WT and Scly KO BAT on 0.08 and
  0.25 ppm Se diets. D. Representative western blot of GPX1 and quantification normalized
  to β-actin. E. Representative western blot and quantification of GPX4 normalized
  to β-actin. F. GPX activity assay. G. Representative western blot and quantification
  of SELENOP. H. GSH levels in WT and Scly KO BAT on 0.08 and 0.25 ppm Se diets. Each
  error bar represents mean ± SEM, n = 3–5. Data in all graphs except E were analyzed
  with two-way ANOVA with Bonferroni’s post hoc test. Graphs in E were two-tailed
  Student’s t-test with Welch’s correction. *P < 0.05, **P < 0.01. DIO, iodothyronine
  deiodinase; GPX, glutathione peroxidase; seleno, selenoprotein; GSH, glutathione'
