figure_title: Immune checkpoint pathways in cancer.
caption: Immune checkpoint pathways in cancer. T-cell activation is modulated by inhibitory
  signals, including (Cytotoxic T-Lymphocyte-Associated Protein 4 (CTLA-4)—Cluster
  of Differentiation 80 (CD80) interactions between antigen-presenting cells and T
  lymphocytes, and PD-1–PD-L1 binding between T cells and tumor cells. Antibodies
  targeting CTLA-4 (ipilimumab, tremelimumab), PD-1 (nivolumab, pembrolizumab, cemiplimab,
  cosibelimab, retifanlimab, tislelizumab), and PD-L1 (atezolizumab, durvalumab, avelumab)
  restore antitumor immunity. Emerging bispecific agents such as tarlatamab are also
  shown. MHC—molecular histocompatibility complex; TCR—T-cell receptor; PD-1—Programmed
  cell death protein 1 (created with Biorender.com accessed on 20 September 2025)
