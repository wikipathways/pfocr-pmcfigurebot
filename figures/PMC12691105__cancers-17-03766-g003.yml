figure_title: Comparative Overview of Ex Vivo and In Vivo CAR-T Cell Production.
caption: 'Comparative Overview of Ex Vivo and In Vivo CAR-T Cell Production. (A) Ex
  Vivo CAR-T Cell Therapy (Top Panel) The ex vivo pathway involves the external genetic
  modification and expansion of patient-derived T-cells before reinfusion. (1) Blood
  Cell Isolation: Peripheral blood mononuclear cells (PBMCs) are collected from the
  patient via leukapheresis. T-lymphocytes are subsequently isolated from the PBMC
  fraction. (2) T Cell Culturing: The isolated T-cells are activated and cultured
  in vitro under controlled conditions, preparing them for genetic engineering. (3)
  CAR-Encoding Construct Delivery: The T-cells are genetically modified through transduction
  (typically using viral vectors like lentivirus or gamma-retrovirus) or transfection
  (e.g., with mRNA or non-viral nanoparticles) to introduce the CAR gene. The CAR
  construct enables the T-cells to recognize a specific tumor-associated antigen.
  (4) CAR-T Cells Expansion and Isolation: Successfully transduced CAR-T cells are
  selectively expanded in culture to achieve a therapeutically relevant cell number.
  The final product undergoes quality control checks before harvest. (5) CAR-T Cells
  Infusion: The expanded and validated CAR-T cell product is infused back into the
  patient, often following a lymphodepleting chemotherapy regimen to enhance engraftment
  and efficacy. (6) Cancer Cells Elimination: The infused CAR-T cells circulate, recognize,
  and bind to target cancer cells via their CAR, initiating a cytotoxic immune response
  that leads to cancer cell death (e.g., via perforin/granzyme release and cytokine
  signaling). (B) In Vivo CAR-T Cell Therapy (Bottom Panel) The in vivo pathway aims
  to generate CAR-T cells directly within the patient’s body, bypassing complex external
  manufacturing. (1) CAR-Encoding Vector Injection: A targeted delivery vehicle (e.g.,
  an engineered viral vector like AAV, or non-viral lipid nanoparticles (LNPs) containing
  CAR-encoding mRNA/DNA) is administered systemically to the patient. (2) In Bloodstream:
  T-Cells Transduction: The circulating vectors/particles specifically target and
  transduce T-cells within the patient’s lymphoid organs and bloodstream. The genetically
  reprogrammed T-cells then begin to express the CAR on their surface and expand in
  situ. (3) Cancer Cells Elimination: The newly formed CAR-T cells, generated directly
  in the body, traffic to tumor sites, recognize the target antigen, and mediate the
  destruction of cancer cells'
article_title: 'CAR Therapies: Ex Vivo and In Vivo Potential of Exosomes and Biomimetic
