figure_title: Hepatocyte pyroptosis promotes macrophages M1 polarization to aggravate
  acute liver injury.
caption: 'Hepatocyte pyroptosis promotes macrophages M1 polarization to aggravate
  acute liver injury. (A) Heatmap presented the expression of marker genes of indicated
  cell types. (B) Hepatocyte (source) interaction weights/strength in liver injury
  group (left panel) and the up-regulated signaling between hepatocytes and macrophages
  in liver injury group (right panel). (C) IF staining of F4/80 (Scale bar: 50μm,
  25μm) and iNOS (Scale bar: 50μm) in liver sections from indicated groups. (D) mRNA
  levels of F4/80 and NOS2 from indicated groups (n = 3 per group). (E) GSEA analysis
  indicated the pathway of protein complex involved in cell adhesion was enriched
  in acute liver injury. (F) Schematic representation of co-culture model between
  primary hepatocytes and macrophages. (G) mRNA levels of F4/80, Cd68 and Nos2 in
  primary macrophages under co-culture with hepatocytes with different treatments
  (n = 3 per group). (H) iNOS immunofluorescence of primary macrophages by co-culture
  with hepatocytes with different treatments. All results are shown as mean ± SEM.
  *p < 0.05. ns, not significant'
