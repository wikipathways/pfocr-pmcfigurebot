caption: '(A) Venn diagram of targets related to HSW and dyslipidemia (HLP), showing
  the intersection targets of HSW and HLP. (B) PPI network of HSW against HLP: among
  the 101 intersection targets, the darker the color of the target and the thicker
  the line, the greater the impact on HLP. (C) GO enrichment analysis: the y-axis
  represents fold enrichment, and the x-axis represents items; green, orange, and
  purple represent the 20 core results of biological process (BP), cellular component
  (CC), and molecular function (MF), respectively. (D) KEGG pathway enrichment analysis:
  the y-axis represents pathways, the x-axis represents false discovery rate (FDR),
  and the color change represents p-value; the size of the bubble indicates the number
  of enriched genes in the pathway. (E) “Herb-component-target” network diagram: HSW
  refers to Polygonum multiflorum Thunb.; orange-yellow rhombuses represent active
  components, and green circles represent protein targets'
