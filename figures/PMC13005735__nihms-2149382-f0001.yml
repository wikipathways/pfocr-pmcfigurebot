figure_title: Convergent neuroprotective mechanisms of glucagon-like peptide-1 receptor
  agonists (GLP1-RAs)
caption: 'GLP-1 is an incretin hormone secreted by intestinal L cells in response
  to nutrient intake. Beyond its role in glucose homeostasis, enhancing insulin secretion,
  suppressing glucagon release, reducing appetite, and promoting weight loss, GLP-1
  exerts direct effects in the nervous system. GLP-1R, a G protein-coupled receptor,
  is expressed not only in the pancreas but also in multiple brain regions, including
  the cortex, hippocampus, hypothalamus, thalamus, amygdala, caudate putamen, and
  globus pallidus. Activation of GLP1 and insulin receptors (receptor tyrosine kinases,
  RTK) converge on the phosphatidylinositol-3-kinase/protein kinase B (PI3K/Akt) pathway.
  Akt inhibits glycogen synthase kinase-3β (GSK3β), reducing tau phosphorylation and
  α-synuclein toxicity, and suppresses forkhead box protein O (FOXO) signaling to
  limit apoptosis, while activating mammalian target of rapamycin (mTOR) to promote
  autophagy, synaptic plasticity, and protein synthesis. In parallel, the cAMP/protein
  kinase A/cAMP response element-binding protein (cAMP/PKA/CREB) pathway drives transcription
  of brain-derived neurotrophic factor (BDNF), supporting synaptic growth, plasticity,
  and memory. In glia, GLP1R activation suppresses NF-κB/NLRP3-mediated inflammation,
  limiting cytokine release, astrocytic activation, and BBB disruption. Collectively,
  these mechanisms reduce α-synuclein aggregation and protect dopaminergic neurons
  in PD, while lowering amyloid/tau pathology and enhancing cognition in AD. Abbreviations:
  BBB, blood brain barrier; CREB, cAMP response element-binding protein; ROS, reactive
  oxygen species; SNCA, α-synuclein. Figure created with BioRender'
