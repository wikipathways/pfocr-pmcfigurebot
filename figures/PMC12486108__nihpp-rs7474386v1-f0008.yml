figure_title: Schematic presentation of the pathway from NET formation and IL-17A
  production in the peritoneal cavity to remote organ injuries in the CLP model.
caption: Schematic presentation of the pathway from NET formation and IL-17A production
  in the peritoneal cavity to remote organ injuries in the CLP model. CLP upregulated
  neutrophil accumulation and PAD4 mediated NET formation in the peritoneal cavity
  (Figure 4). CLP increased IL-17A production in PLF and plasma, which was significantly
  decreased by Pad4 knockout (Figure 2 C and D). Knockout of Il-17a significantly
  decreased CXCL-1 and −2 production in PLF after CLP (Figure 5A). Knockout of Il-17a
  decreased NET formation in peritoneal cavity after CLP (Figure 5C and 6 A–D). Recombinant
  IL-17A, CXCL-1 and −2 upregulated NET formation in PLF cells collected from WT mice
  at 3 h after CLP ex vivo (Figure 6 E and F). Pad4KO as well as Il-17aKO significantly
  decreased CXCL-1 and −2 production in kidney and lung, neutrophil infiltration into
  kidney and lung, and AKI after CLP (Figure 1 and 3). Pad4KO significantly improved
  survival after CLP (Figure 1A). Adoptive transfer of WT neutrophil into Pad4KO mice
  restored IL-17A production in PLF and plasma, CXCL-1 and −2 production in kidney
  and lung, neutrophil infiltration into kidney and lung, and AKI (Figure 7)
article_title: Peritoneal Neutrophil Extracellular Traps contribute to septic AKI
  via peritoneal IL-17A and distant organ CXCL-1/ CXCL-2 pathway in abdominal sepsis
