caption: 'Differential metabolites and KEGG enrichment analysis were performed in
  lung and colon contents after Phe and Flu infection: (A) KEGG enrichment analysis
  bubble maps were drawn using differential metabolites in the intestine and lung;
  (B) KEGG signaling pathway diagram of AA metabolism; (C) relative expression levels
  of AA metabolites in lung tissue; (D) relative abundance of AA metabolites in colonic
  contents. Data are presented as mean ± SD (n = 6 independent biological replicates).
  Statistical significance was determined by an unpaired two-tailed Student’s t-test,
  * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
