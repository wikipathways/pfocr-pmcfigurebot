figure_title: PLA2G16-overexpressing cells infected with FMDV can activate the innate
  immune pathway of uninfected cells.
caption: PLA2G16-overexpressing cells infected with FMDV can activate the innate immune
  pathway of uninfected cells. (a) FMDV (MOI = 0.05)-infected wild-type cells and
  PLA2G16-overexpressing cells at 4 h and 8 h; cell supernatants were collected. The
  cell supernatants were then incubated with PK-15 cells, and cell samples were collected
  for subsequent assays; by Figdraw. (b) The supernatants of wild-type cells infected
  with FMDV and PLA2G16-overexpressing cells were incubated with PK-15 cells. Cell
  samples were collected to extract total protein, and the phosphorylation level of
  STAT1 was detected by Western blotting. (c) The RNA from supernatants of wild-type
  cells infected with FMDV and PLA2G16-overexpressing cells infected with FMDV; FMDV
  was then tested by RT-qPCR. (d,e) The supernatants of wild-type cells infected with
  FMDV and PLA2G16-overexpressing cells were incubated with PK-15 cells, the total
  RNA of PK-15 cells was extracted, and the mRNA levels of ISG56 (d) and ISG15 (e)
  were detected using RT-qPCR. The data shown are the mean ± SEM; * p < 0.05, ** p
  < 0.01
