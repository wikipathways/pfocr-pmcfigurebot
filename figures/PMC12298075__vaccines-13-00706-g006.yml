figure_title: Suggested networks of DEG-encoded proteins and their involvement in
  KEGG pathways.
caption: 'Suggested networks of DEG-encoded proteins and their involvement in KEGG
  pathways. DEGs upregulated after BCG vaccination were analyst in NetworkAnalyst
  for the interaction of the DEG-encoded proteins and tested for KEGG pathway modulation.
  Panel (A): Protein-protein interaction network with genes involved in chemokine
  signaling indicated in blue. Panel (B): Blue nodes indicated proteins that are part
  of the MAPK or PI3K-Akt signaling pathways. Panel (C): Examples of DEG-encoded proteins
  that are involved in cell metabolism (blue), such as The citrate cycle, glucagon
  synthesis, or phospholipase D signaling. Panel (D): A small subset of proteins was
  implicated in fatty acid metabolism'
