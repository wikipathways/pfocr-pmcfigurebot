figure_title: HIF1α is required for hypoxia-induced airway differentiation
caption: '(A) HIF1α is inhibited by CRISPRi. The dCas9-KRAB effector tagged with DHFR
  (dihydrofolate reductase) was stabilized in the presence of trimethoprim (TMP) to
  reduce leaky expression from the Tet-on promoter. HIF1α protein levels decreased
  after 4–9 days knockdown (KD) under hypoxia as shown by western blot.(B) Upper:
  experimental design. NTC or HIF1A-KD organoids were cultured under normoxia or hypoxia
  for 30 days. The dCas9 was induced at −2 days by doxycyline and TMP. Lower: RT-qPCR
  results. Fold changes were normalized to the mean of NTC + normoxia condition (not
  shown). Bars represent mean log2(fold change) ± SD, n = 4 experimental replicates
  from 3 biological donors. 2 gRNAs tested.(C) Immunostaining of organoids with NTC
  or HIF1A-KD induction for 30 days showed changes in organoid shape (Ecad) and differentiation
  (ASCL1 and KRT5). Representative images from 3 organoid lines.(D) The NTC and HIF1A-KD
  organoids were cultured under normoxia or hypoxia for 9 days and used for bulk RNA-seq
  with 2 gRNAs and 3 biological donors for each condition. Heatmap showing DEGs (|log2(fold
  change)| > 0.5, padj < 0.05, merged from DEGs in comparisons of hypoxia + NTC vs.
  normoxia + NTC, and hypoxia + HIF1αKD vs. hypoxia + NTC) across all samples, with
  representative genes labeled.(E and F) GSEA results of 9,621 DEGs (padj < 0.05)
  between hypoxia + NTC vs. normoxia + NTC (E), 5,904 DEGs (padj < 0.05) between hypoxia
  + HIF1αKD vs. hypoxia + NTC (F). Complete DEGs and GSEA results listed in Table
  S3.(G) Stabilized form of HIF1α was induced by Tet-On system under normoxia with
  GFP as control.(H) Immunostaining of organoids overexpressing GFP or HIF1α for 30
  days under normoxia. Representative images of 2 organoid lines.(I and J) HIF1α overexpression
  under normoxia induced HIF pathway genes (I) and differentiation genes (J). Fold
  changes were normalized to the mean of GFP-overexpression organoids. Data shown
  as log2(fold change), n = 3 biological donors.Scale bars, 100 μm. For RT-qPCR, Gene
  expression was normalized to ACTB. Statistical test: two-way ANOVA with Bonferroni’s
  multiple comparisons test.Significance levels: *p < 0.05, **p < 0.01, ***p < 0.001,
  ****p < 0.0001.See also Figure S5 and Table S3'
