figure_title: S100A8/A9 expression is upregulated in cardiac macrophages at four weeks
  post TAC in mice.
caption: 'S100A8/A9 expression is upregulated in cardiac macrophages at four weeks
  post TAC in mice. (A) t-SNE plot of the three macrophage subpopulations (OSM+CCR2+M1,
  CCR2-M2, and CCR2-M1). (B) Dot plots of signature genes confirming the subpopulation
  identities. (C) Monocle analyses showing the ordering of macrophages along pseudotime
  trajectories. The minute dots in the illustration signify cells, with diverse colors
  denoting distinct clusters or states. (D) Percentages of the macrosubpopulations
  in the sham and TAC groups. (E) Violin plots showing the expression levels of the
  S100A8 and S100A9 genes in three types of neutrophils in the TAC and sham groups
  at 4 weeks. (F) Differential gene expression in the OSM2+CCR2+M1 macrophage subgroup.
  Volcano plots displaying all differentially expressed genes in OSM2+CCR2+ macrophages
  from the TAC group versus the sham group at 4 weeks. S100A8 and S100A9 were the
  top two genes whose expression was most significantly upregulated in the TAC group.
  (G) Gene Ontology (GO) pathway enrichment results for 300 genes upregulated in OSM2+CCR2+M1
  macrophages from the TAC group compared with the sham group at 4 weeks. (H) KEGG
  pathways associated with 300 upregulated genes in OSM2+CCR2+M1 macrophages from
  the TAC group compared with those from the sham group at 4 weeks. (I) S100A9-KO
  and WT mice were subjected to TAC for 4 weeks to assess cardiac dysfunction and
  hypertrophy. Representative images of H&E-stained cardiac tissue. (J) Cardiac immunofluorescence
  staining with Mac-2 antibody (left, red) and quantification of the results (right,
  n = 10). (K) Cardiac qPCR analyses of IL-1β and TNF-α (n = 8). (L) Representative
  immunoblots of the p-p65, p65, and NLRP3 proteins, as well as the GAPDH loading
  control (left). The right panel shows the quantification of the results (n = 4).
  The values are presented as the means ± SDs (n = number of animals). **p < 0.01
  and ***p < 0.001 vs. the WT + sham group; ##p < 0.01 and ###p < 0.001 vs. the WT
  + TAC 4-week group'
article_title: Single-cell RNA sequencing reveals that myeloid S100A8/A9 is a novel
  regulator of the transition from adaptive hypertrophy to heart failure after pressure
  overload
