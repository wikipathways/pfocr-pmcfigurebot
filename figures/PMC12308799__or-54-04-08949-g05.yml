figure_title: Overexpression of ZNF695 activates the Akt/mTOR signaling pathway and
  dictates the sensitivity of CRC cells to rapamycin.
caption: Overexpression of ZNF695 activates the Akt/mTOR signaling pathway and dictates
  the sensitivity of CRC cells to rapamycin. (A) Western blot analysis of NEK2, p-Akt,
  Akt, p-S6, S6 and GAPDH in HCT-8 cells transfected with siCtrl, siZNF695#1 and siZNF695#2.
  GAPDH served as an internal control. (B) HCT-8 cells transfected with siCtrl, siZNF695#1
  and siZNF695#2 were treated with different concentrations of rapamycin for 48 h
  and cell viability was determined by CCK8 assay. *P<0.05, **P<0.01 vs. siCtrl group.
  (C) Growth inhibition rate in response to different concentrations of rapamycin
  was calculated in HCT-8 cells transfected with siCtrl, siZNF695#1 and siZNF695#2.
  *P<0.05 vs. siCtrl group. (D) Western blot analysis of NEK2, p-Akt, Akt, p-S6, S6
  and GAPDH in HT-29 cells infected with Ctrl and ZNF695-overexpressing lentiviruses.
  GAPDH served as an internal control. (E) HT-29 cells infected with Ctrl and ZNF695-overexpressing
  lentiviruses were treated with different concentrations of rapamycin for 48 h and
  cell viability was determined by CCK8 assay. *P<0.05, **P<0.01 vs. Ctrl group. (F)
  Growth inhibition rate in response to different concentrations of rapamycin was
  calculated in HT-29 cells infected with Ctrl and ZNF695-overexpressing lentiviruses.
  *P<0.05 vs. Ctrl group. CRC, colorectal cancer; CCK8, Cell Counting Kit-8; ZNF695,
  zinc finger protein 695; si, small interfering; p-, phosphorylated; NEK2, NIMA-related
  kinase 2; S6, ribosomal protein S6
