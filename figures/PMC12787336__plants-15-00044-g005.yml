figure_title: In-depth analysis of genes specifically regulated in ago1-38.
caption: In-depth analysis of genes specifically regulated in ago1-38. (A) Comparison
  of enriched pathways in ago1-38, ago1-25, and ago1-45 based on GO analysis. The
  phytohormone signaling-related pathways are marked in red font. (B) Comparison of
  enriched pathways in ago1-38, ago1-25, and ago1-45 based on KEGG analysis. The phytohormone-related
  pathways are marked in red font. (C) Venn diagram of DEGs between ago1-38, ago1-25,
  and ago1-45. Each circle represents a comparison group. The 1338 genes specifically
  expressed in ago1-38 are marked in red and bond font. (D) GO annotation and functional
  analysis of the 1338 ago1-38-specific DEGs. Phytohormone signaling-related pathways
  are marked in red font. The siRNA processing pathway is marked in green font. (E)
  KEGG annotation and functional analysis of the 1338 ago1-38-specific DEGs. Phytohormone
  signaling-related pathways are marked in red font. The RNA polymerase pathway is
  marked in green font. (F) Heatmap showing expression profile of phytohormone signaling-related
  DEGs based on FPKM values. Of note, some genes are shared in different hormones’
  signaling. (G) Heatmap showing expression profiles of siRNA processing- and RNA
  polymerase-related DEGs based on FPKM values. Note that some genes are shared in
  different hormone signaling pathways. In (A,B,D,E), the siRNA, phytohormone, and
  plant–pathogen interaction pathways are marked in colored fonts
