figure_title: Aberrant activation of the ERK1/2 signaling cascade in iCCA and its
  therapeutic targeting.
caption: 'Aberrant activation of the ERK1/2 signaling cascade in iCCA and its therapeutic
  targeting. Extracellular and intracellular stimuli can induce the hyperactivation
  of the ERK1/2 signaling cascade. Upon stimulation, RAS recruits and activates Raf-1
  kinase, which phosphorylates MEK1/2, subsequently leading to the activation of ERK1/2
  in the cytoplasm. Once phosphorylated, ERK1/2 translocates to the nucleus and regulates
  multiple downstream effectors involved in a wide range of cellular processes. Dysregulation
  of this pathway contributes to tumor growth and progression in iCCA, highlighting
  ERK1/2 as a promising target for molecular therapy. The figure illustrates the main
  components of this pathway and the small-molecule inhibitors currently under investigation
  to counteract aberrant ERK1/2 activation in iCCA. It also depicts the compensatory
  activation of the PI3K/AKT/mTORC1 pathway in response to ERK1/2 inhibition. It was
  created with BioRender (https://biorender.com/, accessed on 19 June 2025). Symbols:
  P, phosphate group; GDP, guanosine diphosphate; GTP, guanosine triphosphate'
