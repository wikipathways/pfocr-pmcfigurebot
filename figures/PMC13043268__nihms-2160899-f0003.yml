figure_title: Mechanisms of other novel T cell therapies
caption: T cell receptor (TCR)-engineered T cells use transgenic TCRs targeting specific
  antigens of the native major histocompatibility complex antigen recognition pathway.
  Tumour-infiltrating lymphocytes (TILs) are produced after the bulk resection of
  a tumour, followed by isolation and tumour antigen-specific expansion of local tumour
  T cells. In both therapies, the engineered cells are infused back into the patient,
  leading to T cell-mediated tumour cell death. Bispecific antibodies are engineered
  to recognize two antigens — a T cell-specific, anti-CD3 antibody and a tumour-specific
  antibody — bringing the T cells and target tumour cells into close proximity, allowing
  secretion of perforin and granzymes and leading to tumour cell death. pMHC, peptide–major
  histocompatibility complex
