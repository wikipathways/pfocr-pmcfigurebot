figure_title: Therapeutic strategies targeting TBK1 in ALS.
caption: Therapeutic strategies targeting TBK1 in ALS. Structural insights into TBK1
  domains and variant mechanisms inform therapeutic development. ATP-competitive inhibitors
  target the kinase pocket to suppress immune signaling but face selectivity and CNS
  penetration challenges. Allosteric modulators can stabilize regulatory or adaptor-binding
  interfaces, offering pathway-specific control. Gene-replacement and allele-specific
  silencing approaches aim to restore TBK1 dosage or neutralize dominant-negative
  alleles. Drug repurposing and combination therapies provide rapid translational
  opportunities. Biomarker-guided stratification (e.g., phospho-OPTN/p62, IRF3 activation,
  mitophagy reporters, neuroinflammation imaging) will be critical to match therapies
  with patient subgroups and assess efficacy
