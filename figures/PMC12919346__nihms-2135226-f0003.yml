figure_title: Gene Enrichment Analysis
caption: (A) Functional protein interactome for genes with de novo variants in all
  subjects with placental malperfusion (n = 41 genes) and without placental malperfusion
  (n = 46 genes) subjected to K-means clustering demonstrate distinct pathway enrichment.
  Circles and nodes are query proteins. Edges represent layers of evidence of protein–protein
  associations. False discovery rate P value is listed next to each pathway enriched.
  (B) Gene set enrichment analysis with the top 10 enriched terms in each library
  displayed based on the −log10(P value). Actual P value displayed next to each term.
  The term at the top has the most significant overlap with the gene set. *Adjusted
  P < 0.05. Abbreviation as in Figure 2
