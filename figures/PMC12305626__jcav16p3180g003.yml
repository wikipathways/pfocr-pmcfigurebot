figure_title: Induction of apoptosis by MWBSE in HeLa cells.
caption: 'Induction of apoptosis by MWBSE in HeLa cells. (A) HeLa cells were treated
  with various concentrations of MWBSE for 24 hours, and apoptosis was assessed using
  the Annexin V: AbFluor™ 488/PI double staining assay via flow cytometry. (B) Western
  blot analysis showing increased cleavage of caspase-3, caspase-9, and PARP in response
  to MWBSE. Treatment with MWBSE resulted in increased cleavage of caspase-3, caspase-9,
  and PARP, indicating activation of the caspase-dependent apoptotic pathway. GAPDH
  served as the loading control. The western blot data were from three independent
  experiments. The data are presented as the means ± SEMs (*p < 0.05, **p < 0.01,
  ***p < 0.001 compared with controls)'
article_title: The Traditional Chinese Medicine Formula Modified Wu Bao San Induces
