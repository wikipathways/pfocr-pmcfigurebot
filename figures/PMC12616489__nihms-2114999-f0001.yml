figure_title: RIG-I-like receptors in antiviral defense and autoimmunity
caption: 'The RIG-I-like receptors RIG-I and MDA5 recognize certain immunostimulatory
  RNAs –virus- or host-derived– via their C-terminal domain (CTD) and helicase domain
  and then relay signaling through CARD-CARD interaction to MAVS, which is localized
  at mitochondria, mitochondrial-associated ER membranes (MAMs), and peroxisomes.
  MAVS elicits downstream signaling pathways to induce the transcription of antiviral
  genes, including type I and III interferons (IFNs) and proinflammatory cytokines,
  through the activities of IFN-regulatory factors (IRFs such as IRF3) and nuclear
  factor-κB (NF-κB). Cytokines produced upon RLR activation signal in an autocrine
  and paracrine manner to create an antiviral state or recruit immune cells to the
  site of infection. LGP2, the third RLR family member, modulates the activities of
  MDA5 and RIG-I in antiviral signaling. Furthermore, single-nucleotide polymorphisms
  (SNPs) in the genes encoding RIG-I and MDA5 and aberrant recognition of host-derived
  RNAs can drive autoimmune responses. CARD: caspase activation and recruitment domain'
