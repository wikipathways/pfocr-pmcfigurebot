figure_title: Schematic representation of ncRNA interactions with DNA, RNA and protein
  at the transcriptional and post-transcriptional levels.
caption: Schematic representation of ncRNA interactions with DNA, RNA and protein
  at the transcriptional and post-transcriptional levels. (a) Messenger RNAs (mRNAs)
  are transcribed from protein-coding genes while non-coding RNAs (ncRNAs) arise from
  multiple loci (including protein-coding genes). (b) ncRNAs play a critical role
  in organization of the genome and mediate promoter–enhancer interactions to coordinate
  gene expression. (c) Various ncRNAs coordinate gene expression, either locally (cis-acting)
  or at multiple gene loci (trans-acting). (d) Messenger RNA is subjected to regulation
  by miRNAs in the cytoplasm. (e) miRNAs and lncRNAs modulate each other through crosstalk.
  (f) miRNA and lncRNA interact with proteins to activate or repress them. (Biosynthetic
  pathways are indicated by black arrows, and ncRNA regulatory interactions are in
  red.) (miRNA—microRNA; lncRNA—long non-coding RNA; RISC—RNA-induced silencing complex.)
