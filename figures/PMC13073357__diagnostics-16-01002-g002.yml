caption: 'Receiver operating characteristic (ROC) curves for the multivariable model
  predicting availability of both tumour markers (CEA and CA19-9) in the M-defined
  subset (n = 360): (a) Apparent ROC curve (AUC = 0.680); (b) 5-fold cross-validated
  ROC curve (AUC = 0.633). The model included surgery status, ED, metastatic disease
  (M1), age (per 10-year increment), and sex. Discrimination was moderate and attenuated
  after internal validation, supporting the interpretation that tumour marker availability
  reflects pathway organization rather than a stable predictive rule'
