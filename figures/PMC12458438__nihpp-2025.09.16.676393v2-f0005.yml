figure_title: Deletion of ARID1A and ARID1B in established lymphoma cell line SUDHL6
  enhances cell migration and is associated with increased mutation burden in patients
caption: '(a) In vitro growth curves of SUDHL6 cells after CRISPR/Cas9-targeting of
  ARID1A (left), ARID1B (middle) or both (right). KO=knockout (b) Pathway analysis
  (GAGE) of gene expression changes after ARID1A, ARID1B and double ARID1A/ARID1B
  deletion compared to non-target controls.(c) Overlapping gene expression changes
  in ARID1A KO, ARID1B KO and double ARID1A/ARID1B KO SUDHL6 cells (p<0.001, log2FC>2)(d)
  Heat map of cell migration signature in non-target control vs double ARID1A/ARID1B
  KO SUDHL6 cells.(e) Experimental schematic of in vitro transwell migration assay.(f)
  Quantification of transwell migration assays.(g) Heat map of the Hallmark DNA damage
  gene expression signature in non-target controls vs double ARID1A/ARID1B-targeted
  SUDHL6 cells.(h-j) Mutation burden analysis of patients that express either a wild-type
  vs mutated form of ARID1A or ARID1B in (h) B cell leukemia (BLL), (i) Diffuse large
  B cell lymphoma (DLBCL), or (j) Follicular Lymphoma (FL) patients. BLL: ARID1A/1B
  WT n=885, mut n=52. DLBCL: ARID1A/1B WT n=1135, mut n=234. FL: ARID1A/1B WT n=759,
  mut n=173.Mut: mutant'
