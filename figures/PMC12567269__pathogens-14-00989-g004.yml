figure_title: The mechanisms of IL-10-mediated immunosuppression.
caption: The mechanisms of IL-10-mediated immunosuppression. IL-10 exerts multifaceted
  inhibitory effects by suppression of pro-inflammatory cytokine secretion; blockade
  of TLR-mediated dendritic cell activation; downregulation of APC surface co-stimulatory
  molecules and MHC-II complexes; impairment of macrophage differentiation; induction
  of programmed cell death pathways; and promotion of T cell exhaustion states
