figure_title: Plasticity and stemness in adult nonstem cells following injury.
caption: Plasticity and stemness in adult nonstem cells following injury. The YAP/TAZ
  pathway, key components of the Hippo signaling cascade, plays the role of master
  regulator in regulating the plasticity of adult somatic cells by influencing their
  ability to dedifferentiate, transdifferentiate, or adopt a more stem cell—like state.
  During embryonic and fetal stages, YAP/TAZ activity is elevated but gradually decreases
  after birth, ultimately reaching basal levels in quiescent adult tissues. Following
  injury, YAP/TAZ expression transiently increases in tandem with the mobilization
  and proliferation of adult stem/progenitor cells, then returns to baseline upon
  completion of tissue repair. MSC lineage commitment is strongly influenced by YAP/TAZ
  localization, which is regulated by mechanical cues. On stiff substrates, integrin
  clustering and focal adhesion assembly enhance F-actin polymerization and stress
  fiber formation, leading to increased cell spreading and nuclear translocation of
  YAP/TAZ, thereby promoting osteogenesis. Conversely, soft substrates reduce focal
  adhesion and stress fiber formation, favoring cytosolic retention of YAP/TAZ and
  driving adipogenesis
