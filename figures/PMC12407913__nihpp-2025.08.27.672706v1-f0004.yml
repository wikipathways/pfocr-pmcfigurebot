figure_title: Differential proteomics of dopamine-free cells exposed to nitrite or
  nitrate
caption: '(A) HeLa cells were exposed to either 50 mM nitrite, 50 mM nitrate, or vehicle
  for 24 h. Mean fluorescence intensity per cell was quantified from maximum intensity
  projections acquired by structured illumination microscopy (n = 3 independent biological
  replicates, 3–4 technical replicates for each, untreated signal subtracted as background,
  bars denote mean ± S.E.M.; significance determined by t-test. (B–C) Volcano plots
  showing differential proteins (cyan = downregulated, coral = upregulated) of HeLa
  cells treated with 50 mM nitrite, 50 mM nitrate, or vehicle. The P-value cutoff
  was 0.05. (B) In the nitrite-treated group compared with the untreated HeLa cells,
  4035 proteins were identified: 121 were downregulated and 127 were upregulated.
  (C) In the nitrite-treated group compared with nitrate-treated HeLa cells, 4034
  proteins were identified: 137 were downregulated and 108 were upregulated. (D) Pathway
  enrichment analysis of unique differentially expressed proteins of the nitrite-treated
  HeLa cells. Proteins unique to nitrite-treated HeLa cells were identified after
  comparison between significantly altered proteins in the nitrite-treated vs untreated
  cells and the significantly altered proteins in the nitrate-treated vs untreated
  cells'
