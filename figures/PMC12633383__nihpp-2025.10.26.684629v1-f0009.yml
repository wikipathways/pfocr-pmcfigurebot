figure_title: Model for single-strand annealing by Mgm101
caption: (1) Mgm101 monomers are in equilibrium with 18/19-mers. (2) Mgm101 monomers
  assemble cooperatively on ssDNA, possibly coated with Rim1 (red circles) to (3)
  form a 19-mer ring-ssDNA complex. (4) Other ssDNAs can bind to the ring and sample
  the first ssDNA. When a match is found, a stable duplex intermediate is formed.
  Complementary ssDNA regions outside the groove are already aligned and free to fold
  into B-form dsDNA. (5) The paired ssDNAs within the groove eventually leave, fold
  into B-form dsDNA, and bind to the outer site at the Mgm101 C-lobe to drive the
  annealing reaction forward. 18-mer lock washers of Mgm101 without DNA are added
  to either end of the pathway, but their role is unclear. Native MS indicates that
  18-mers can bind ssDNA in step 3, and complementary ssDNAs in step 4, but such 18-mers
  were not captured by cryo-EM. It is unclear if the 18-mers observed by native MS
  are closed rings or open lock washers
article_title: Mechanism of single-strand annealing from native mass spectrometry
  and cryo-EM structures of RAD52 homolog Mgm101
