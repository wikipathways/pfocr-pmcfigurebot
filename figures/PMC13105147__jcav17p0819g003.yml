figure_title: Functional enrichment analyses reveal adhesion- and junction-related
  transcriptomic remodeling upon MUC16 silencing in LUAD.
caption: Functional enrichment analyses reveal adhesion- and junction-related transcriptomic
  remodeling upon MUC16 silencing in LUAD. (a) Network visualization of differentially
  expressed anoikis-related genes showing enrichment in biological processes such
  as cell-cell junction organization, tight junction assembly, and epithelial differentiation.
  Node color represents log₂ fold change, and node size indicates significance of
  enrichment. (b) KEGG pathway analysis highlighting significant enrichment of cell
  adhesion molecules, adherens junction, tight junction, and Hippo signaling pathways,
  indicating that MUC16 regulates adhesion-dependent survival cascades. (c) GSVA demonstrating
  downregulation of adhesion-linked transcriptional programs and negative enrichment
  of DNA-binding transcriptional repressors, suggesting loss of pro-survival signaling
  upon MUC16 silencing. GSVA highlights significant downregulation of EMT, focal adhesion,
  PI3K-AKT-mTOR signaling, apical junction, and actin cytoskeleton pathways upon MUC16
  silencing (FDR < 0.05). (d) GO enrichment across three ontologies—BP, CC, and MF—showing
  predominant enrichment of junctional organization, plasma membrane complexes, and
  cadherin/catenin-binding functions
