figure_title: SOD2 expression in patient tumors is associated with immune signatures
  identified through SOD2 knock-down in MCAs.
caption: SOD2 expression in patient tumors is associated with immune signatures identified
  through SOD2 knock-down in MCAs. A. Reactome pathway analysis of gene expression
  in tumors with high and low SOD2 expression (TCGA Pan Cancer RNAseq data n = 300,
  RSEM z-score above or below 0 was used for high (n = 90) and low SOD2 (n = 210)
  populations). B. Gene expression of leading genes in the Neutrophil Degranulation
  Pathway identified to be negatively enriched in MCAs following SOD2 knock-down (Fig.
  2A). C. Spearman correlation of SOD2 expression with genes of the Neutrophil degranulation
  pathway in TCGA patient tumors (n = 300; Pearson r, *P < 0.05; **P < 0.01; ***P
  < 0.001; ****P < 0.0001). D.-E. Correlation of SOD2 expression with immune and tumor
  associated cell signatures (D. TIMER and CIBERSORT analysis; E. based on [10]).
  F. Correlation of SOD2 expression with FOXP3, PD-1 and PD-L1 (TGCA RNAseq, RSEM
  z-score, n = 300). Our RNA sequencing data following SOD2 knock-down in OVC433 ovarian
  cancer
