caption: KEGG metabolic pathways co-enriched for both differential genes and metabolites.
  (A) Co-enrichment analysis of KEGG metabolic pathways involving both differential
  genes and metabolites. Metabolites with a VIP > 1 and p-value < 0.05 are considered
  significantly differentially expressed. The metabolic pathways associated with these
  metabolites were identified through KEGG database annotations. (B) Expression changes
  of genes and metabolites in the co-enriched KEGG metabolic pathway. Red color represents
  upregulated genes or metabolites, and blue color represents downregulated genes
  or metabolites
