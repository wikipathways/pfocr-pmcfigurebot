figure_title: ZFP36L1 deficiency induces hepatocyte dedifferentiation, metabolic stress,
  and susceptibility to senescence
caption: (A) Floxed alleles of Zfp36l1 were crossed with Alb-Cre mice to generate
  hepatocyte-specific knockouts, and liver tissue were subjected to RNA-seq. (B) Transcriptomic
  profiling revealed widespread transcriptomic changes in Zfp36l1HKO hepatocytes.
  (C) Expression analysis confirmed robust deletion of the targeted gene without compensatory
  upregulation of other Zfp36 family members. (D) Ingenuity Pathway Analysis identified
  “Metabolic Disease” and “Hepatic System Disorders” as the top enriched disease categories.
  (E) Functional enrichment analysis highlighting the top GO categories enriched are
  dysregulation of developmental, differentiation, and signaling pathways. (F) Zfp36l1
  deficiency resulted in reduced expression of mature hepatocyte markers and increased
  expression of progenitor/ductal markers. (G) Gene set enrichment analysis revealed
  enrichment of TNFα signaling, EMT, fatty acid metabolism, inflammation, and senescence-related
  programs in Zfp36l1HKO hepatocytes. Data are presented as mean ± SEM. p values were
  calculated using two-sided permutation tests with Benjamini-Hochberg correction
  for multiple comparisons in (D, G)
