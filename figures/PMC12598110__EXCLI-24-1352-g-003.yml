figure_title: 'IFN-γ signaling pathways. 1. JAK-STAT pathway : (1) IFNγR: Transcriptional
  regulation: NFκB, EGR, and SP1 promote IFNGR mRNA transcription, while AP2 and IRF2
  inhibit transcription. (2) JAK: ALPNR is essential for normal JAK function. SOCS
  proteins and small molecule inhibitors suppress JAK-mediated signaling. (3) STAT1:
  Transcriptional regulation: STAT1 promoter activity can be suppressed by methylation
  or activated through HDAC3-mediated deacetylation. Post-translational modifications:
  PIAS, A20, and CBP/TCP45 inhibit signal transduction activity by dephosphorylating
  p-STAT1. PRMT1 regulates STAT1 activity/stability independently of its phosphorylation
  state. p-STAT1 can be degraded via the proteasome pathway. 2. Non-canonical pathway
  : IFN-γ activates the STAT1-PI3K-Akt axis, thereby recruiting the mammalian target
  of rapamycin (mTOR) into interferon signaling. Additionally, the mTOR/p70S6 kinase
  cascade facilitates the mRNA translation of effector proteins'
