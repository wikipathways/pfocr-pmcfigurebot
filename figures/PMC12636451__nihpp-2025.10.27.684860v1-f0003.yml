figure_title: Tau0N3R expression shifts neuronal ATP production from oxidative phosphorylation
  to glycolysis
caption: (A–C) Real-time ATP/ADP ratio measurements in dissociated glutamatergic neurons
  coexpressing tau0N3R and the genetically encoded ATP/ADP sensor PercevalHR. Traces
  show pH-corrected PercevalHR ratio normalized to baseline (dotted line at 1.0) for
  control neurons (d42>PercevalHR, blue) and tau0N3R-expressing neurons (d42>PercevalHR+tau0N3R,
  magenta). (A) Response to 10 μM oligomycin A (oligo A). (B) Response to 10 mM 2-deoxyglucose
  (2DG). (C) Response to the combined application of 10 μM oligomycin A and 10 mM
  2DG. Data are mean ± SEM from n > 60 neurons per genotype across ≥ 3 independent
  experiments.(D) Quantification of integrated ATP/ADP ratio changes following pathway
  inhibition. Bars represent median ± 95% confidence intervals. ****P < 0.0001, n.s.,
  not significant, Mann-Whitney tests
