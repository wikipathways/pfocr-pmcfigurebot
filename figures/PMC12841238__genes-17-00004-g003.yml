caption: Differential expression and KEGG pathway analyses between CASP1+ and CASP1−
  groups in CD, UC, and MDD prefrontal cortex. (A–C) Volcano plots showing DEGs between
  CASP1+ and CASP1− groups in (A) CD, (B) UC, and (C) MDD prefrontal cortex. (D,E)
  Venn diagrams illustrating the overlap of (D) upregulated and (E) downregulated
  DEGs among CD, UC, and MDD prefrontal cortex. (F–H) Correlations between CASP1 and
  LYZ RNA expression in (F) CD, (G) UC, and (H) MDD prefrontal cortex. (I–K) KEGG
  pathways differentially enriched between CASP1+ and CASP1− groups in (I) CD, (J)
  UC, and (K) MDD prefrontal cortex. (L) Venn diagram showing the overlap of CASP1+–enriched
  KEGG pathways across CD, UC, and MDD prefrontal cortex
