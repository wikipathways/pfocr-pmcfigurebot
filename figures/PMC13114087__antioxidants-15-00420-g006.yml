figure_title: Effect of EPT on oxidative stress and inflammatory response pathway
  in OVA-induced mice.
caption: 'Effect of EPT on oxidative stress and inflammatory response pathway in OVA-induced
  mice. (a–c) Antioxidant parameters such as reduced glutathione (GSH) levels (a),
  superoxide dismutase (SOD) levels (b), and malondialdehyde (MDA) contents (c) in
  lung tissues; (d) representative Western blot images and (e) protein expression
  of inflammation-related pathway, i.e., IL-33, MyD88, p-JNK, p-NF-κB, COX-2, TNF-α,
  and IL-1β, in lung tissues. Values are expressed as mean ± SD (n = 5 for antioxidant
  parameters; n = 4 for Western blot analysis). *, **, ***, and **** indicate statistical
  differences compared with the NC group (p < 0.05, 0.01, 0.001, and 0.0001, respectively).
  # and #### indicate statistical differences compared with the OVA group (p < 0.05,
  and 0.0001, respectively). EPT200 indicates the OVA-sensitized mice treated with
  200 mg/kg EPT'
