caption: (A) A short cell with (B) a lipid bilayer membrane. Ion channels are not
  shown. (C) The currents across a short cell. The classical Hodgkin Huxley system
  is shown of a membrane capacitance C, with a current pathway for K+ ions through
  a potassium conductance gK driven by the gradient of chemical potential EK and similarly
  for sodium Na+ ions driven through a sodium conductance gNa by the gradient of chemical
  potential ENa. The sum of the currents through all three pathways is zero. There
  is no other place for the current to go! The HHK equation ∑ Ij=Cm∂V/∂t applies to
  a short cell or organelle of irregular shape like a mitochondria, as long as all
  of the membranes, channels, and transporters have the same potential across them
