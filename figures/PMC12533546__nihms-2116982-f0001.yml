figure_title: Building Participant BRAINN using in vivo brain MRI.
caption: 'Building Participant BRAINN using in vivo brain MRI. Panel A: Example multimodal
  brain MRI data used for building unique BRAINN for each participant in our real-world
  cohort. MRS: Spectrum of brain metabolites in a voxel in six oblique axial slices
  through the brain collected using a multiplanar chemical shift imaging (MPCSI) sequence.
  rs-fMRI: an example resting-state time signal averaged across a Brodmann area. WM
  Fiber: White matter neural pathways in coronal sections. CT: the cortex parcellated
  into Brodmann areas, rCBF: map of regional cerebral blood flow in the brain. Panel
  B: T1-weighted data was segmented into tissue types and coregistered to MR spectroscopy
  (MRS) data for partial volume correction. Partial volume-corrected MRS and regional
  cerebral blood flow data (rCBF) were then coregistered to T1w data, which were then
  all normalized into the coordinate space of diffusion tensor imaging (DTI) data.
  Deterministic fiber tracking was applied to trace neural pathways and compute various
  brain measures along these pathways. MRI-derived brain measures were then utilized
  to build BRAINN for each participant. We computed the various control system metrics
  for the dynamic behavior of BRAINN and compared how patients differed from healthy
  participants on those metrics. We also assessed how these metrics changed during
  chemotherapy in patients with childhood acute lymphoblastic leukemia (ALL). Finally,
  the functional connectivity of the stimulated BRAINN was compared with functional
  connectivity in our real-world resting-state fMRI data of healthy participants.
  MRS=MR Spectroscopy; NAA=N-Acetyl Aspartate; CH=choline; CR=creatine; Glx=glutamate-glutamine;
  rs-fMRI=resting-state functional MRI; CT=cortex; rCBF=regional cerebral blood flow;
  WM=white matter; ppm=parts per million;'
