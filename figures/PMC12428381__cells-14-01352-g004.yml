figure_title: Trajectory analysis using the RPPA data and Phase Protein Array.
caption: 'Trajectory analysis using the RPPA data and Phase Protein Array. Trajectory-Associated
  Pathway enrichment analysis (A) showing signaling pathways significantly associated
  with the pseudotime trajectory derived from principal curve analysis. The chart
  displays the top 10 signaling pathways (filtered for terms containing “signaling”)
  ranked by statistical significance. Protein expression changes along the trajectory
  were tested for association with canonical pathways using pathfindR. This identifies
  key biological processes that are dynamically regulated along the inferred treatment
  progression pathway. Principal Component Analysis (PCA) (B) of reverse-phase protein
  array (RPPA) data from 15 samples across four treatment groups: saline control (n
  = 5), iPSC-CD34+ cells (n = 4), iPSC-ECFC (n = 3), and combination treatment (combo,
  n = 3). Each point represents a sample, colored by treatment group. The plot shows
  the first two principal components, which capture the major sources of variation
  in the protein expression data. Polygon frames outline the boundaries for each group.
  The analysis reveals distinct clustering patterns among treatment groups, with a
  clear separation between the combination treatment and other conditions. Principal
  curve analysis was fitted to the first two principal components of the RPPA data.
  Blue points represent individual samples projected onto the principal curve (pink
  line, smoothed using smooth spline method with stretch parameter = 2). Dark red
  points show the projection of each sample onto the fitted curve. Sample labels indicate
  cell types. The principal curve represents a trajectory through the data that captures
  the major pattern of variation, potentially representing a treatment progression
  pathway. This analysis provides a pseudotime ordering of samples based on their
  position along the curve'
