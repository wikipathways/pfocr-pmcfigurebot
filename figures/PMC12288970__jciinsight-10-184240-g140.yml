figure_title: MS patient CNS-infiltrating CD8+ T cells exhibit PPP engagement
caption: (A) Dimensional reduction (UMAP) plot showing clustering of CSF cells in
  controls (CON) with idiopathic intracranial hypertension (N = 6). (B) Dimensional
  reduction showing clusters of CSF cells from patients with MS (N = 6). UMAP reduction
  was calculated on all cells from CON and patients with MS combined (N = 12). CD4,
  CD4+ T cells; CD8, CD8+ T cells; NK, NK cells; pDC, plasmacytoid dendritic cells;
  DC, myeloid dendritic cells; mono, monocytes. (C) Relevant phenotypic marker expression
  in the CD8+ cluster from CON (green) and patients with MS (red). Gene names are
  shown above each plot. The y axis shows expression level. Each symbol represents
  1 cell. To enhance clarity, all cells with zero expression have been removed from
  the violin plots. (D) Schematic showing the metabolites (ellipsoids) and enzymes
  (squares; marked by gene identifier) of the pentose phosphate pathway (PPP). Red
  metabolites are part of the oxidative arm of the PPP; green metabolites are part
  of the nonoxidative arm. Fold change (FC) for enzyme gene expression in MS patient
  CSF CD8+ cells relative to CON and adjusted P value are shown in italics. Light
  yellow boxes are not significant; bright yellow boxes are significant at P < 0.05.
  (E) Violin plots for each of the enzymes shown in D. Gene names are shown above
  each plot. The y axis shows expression level. Each symbol represents 1 cell. To
  enhance clarity, all cells with zero expression have been removed from the violin
  plots. Differentially expressed genes within the CD8+ cluster between MS and controls
  were identified using the Wilcoxon rank sum test via the Presto fast implementation.
  The average log2 fold change between MS and control and the Bonferroni-corrected
  P value for the comparison were calculated
article_title: Pentose phosphate pathway inhibition metabolically reprograms CD8+
  T cells and disrupts CNS autoimmunity
