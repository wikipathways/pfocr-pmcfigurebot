caption: Identification of gene and molecular network in the LgA-H animals in comparison
  to LgA-L. (A) The Venn diagram shows significant upregulated genes (p  <  0.05,
  fold change 1.5 F). (B) This Venn diagram shows significant downregulated genes
  (p  <  0.05, fold change 1.5 F). Sankey diagrams (Sankeymatic.com/build) reveal
  molecular functions for genes that were (C) upregulated and (D) downregulated in
  the LgA-H vs. LgA-L comparison. (E) Ingenuity Pathway Analysis (IPA, https://digitalinsights.qiagen.com/products-overview/discovery-insights-portfolio/analysis-and-visualization/qiagen-ipa/,
  accessed on 26 July 2025) shows the molecular networks for DEGs in the LgA-H vs.
  LgA-L comparison. The red color represents upregulated genes, whereas the green
  color represents downregulated genes, and the blue color represents interacting
  partners
