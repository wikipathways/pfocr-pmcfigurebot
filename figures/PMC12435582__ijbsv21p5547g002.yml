figure_title: CTT upregulated the functions of genes encoding antigen processing and
  presentation and activation markers of B cells.
caption: CTT upregulated the functions of genes encoding antigen processing and presentation
  and activation markers of B cells. (A-B) Volcano plot (A) and heatmap (B) showing
  DEGs between B cells from the control and CTT groups. In the volcano plot, genes
  with adjusted P values < 0.05 and log2FC > 1 values were defined as significantly
  upregulated signatures, and those with adjusted P values < 0.05 and log2FC < -1
  values were defined as significantly downregulated signatures. (C) Relationships
  of the core network with the top 10 Wiki pathways identified via enrichment analysis.
  (D) Scatter plot of the top 20 enriched KEGG pathways and 10 enriched GO pathways
  according to GSEA. (E-G) The expression levels of MHC-I (E), MHC-II (F), CD86 (G)
  and CD40 (H) on B cells. (I) The expression of cytokines, TLRs, and activation markers
  on B cells on day 14 after CTT was measured via qRT‒PCR. All the data are presented
  as the means ± SD. n=4 for each group. *P<0.05, **P<0.01, ***P<0.001. The data in
  the graphs were analyzed via two-tailed Student's t tests
