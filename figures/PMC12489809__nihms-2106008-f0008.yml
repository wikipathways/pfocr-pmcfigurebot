figure_title: CX3CR1-CX3CL1 signaling is upstream of microglia-astrocyte crosstalk
  via Wnts
caption: '(A) Experimental design for B-C. Barrel cortex, 24 hours post-lesioning.(B-C)
  Volcano plots of differentially expressed genes in microglia in the control vs.
  deprived hemispheres (hems) of (B) n=4 Cx3cr1+/− mice and (C) n=5 Cx3cr1−/− mice.(D)
  (Top) experimental design for E-F. Layer IV barrel cortex, 24 hours post-lesioning.
  (Bottom) diagram of Wnt signaling pathway.(E) Representative images of control vs.
  deprived hemispheres (hems) of TCF/Lef:H2B-GFP; Cx3cl1−/− mice showing anti-SOX9+
  astrocyte nuclei, DAPI+ nuclei, and anti-GFP+ nuclei. Right-most panels depict anti-GFP
  signal in astrocytes (SOX9+; examples outlined in insets). Scale bars and inset
  scale bars 10 μm.(F) Average TCF/Lef:H2B-GFP mean fluorescence intensity (MFI) in
  control vs. deprived hem astrocytes (n=4 mice. ns: p>0.05).(G) Experimental design
  for H-I. Layer IV barrel cortex, 24 hours post-lesioning.(H) Representative images
  of anti-β-catenin, anti-SOX9+ astrocyte nuclei, and DAPI+ nuclei in control vs.
  deprived hems of Cx3cr1−/− mice. Right-most column shows anti-β-catenin in astrocyte
  nuclei (SOX9+; examples outlined in insets). Scale bars and inset scale bars 10
  μm.(I) Average nuclear anti-β-catenin MFI in astrocytes in control vs. deprived
  hems of Cx3cr1−/− mice (n=5 mice. ns: p>0.05).(J) Experimental design for K-M. Layer
  IV barrel cortex, 4 days post-lesioning.(K) Representative 3D renders of control
  vs. deprived hems in Aldh1l1CreER/+; Rosa26mTmG/+; Cx3cl1−/− mice showing anti-VGluT2+
  synapses pseudo-colored by synapse-astrocyte nearest neighbor distance (NND; corrected
  for expansion index). Astrocyte-contacted synapses (NND=0) are transparent. Insets:
  3D renders of anti-VGluT2+ synapses and anti-GFP+ astrocyte processes. Scale bars
  and inset scale bars 2 μm (corrected for expansion index).(L-M) Mean synapse-astrocyte
  NND (L) and percentage of synapses contacted by astrocytes (M) in control vs. deprived
  hems of Aldh1l1CreER/+; Rosa26mTmG/+; Cx3cl1−/− mice (n=4 mice. ns: p>0.05).Bar
  graphs represent mean ± SEM. Circles (female) and squares (male) represent individual
  animals.Statistics: Ratio paired t test (F, I, L-M).See also Figure S7'
