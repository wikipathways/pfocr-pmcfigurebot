caption: Comparative pathway analysis of APB, Dex, and their combination (APB+Dex)
  in AGS gastric cancer cells using Ingenuity Pathway Analysis (IPA). Heatmaps show
  (A) affected canonical pathways, (B) predicted upstream regulators, and (C) disease
  and bio-function impacts. Orange indicates predicted activation, and blue indicates
  predicted inhibition (Q ≤ 0.001, |z-score| ≥ 2.5). Some pathways are trimmed as
  being too long to be listed in this figure which could be retrieved in the Supplementary
  File (Tables S3–S5)
