figure_title: 'Ciliary regulatory mechanism in proteostasis and cell-death pathway:'
caption: This schematic shows the role of cilia in regulating proteostasis and cell-death
  pathways, including autophagy and apoptosis, underscoring their importance in health
  and disease. A. Cilia contribute to the maintenance of proteostasis through mechanisms
  such as chaperone-mediated protein folding and degradation pathways, including the
  ubiquitin-proteasome system. B. Role of cilia in modulating apoptotic signals, indicating
  how ciliary dysfunction can lead to disrupted apoptotic pathways and contribute
  to cell survival or death. C. Autophagy plays a significant role in the process
  of ciliogenesis. Varying nutrient environments can influence autophagy processes,
  which in turn affect the formation and function of cilia. D. Illustrates the process
  of autophagy as a ciliary response to a signal, detailing how ciliary signaling
  can enhance autophagosome formation and degradation of damaged organelles and proteins
