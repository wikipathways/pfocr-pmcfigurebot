figure_title: Gadd45B demotes downstream targets of the MAPK pathway and promotes
  expression of iodine metabolic genes.
caption: 'Gadd45B demotes downstream targets of the MAPK pathway and promotes expression
  of iodine metabolic genes. (A) Schematic illustration of canonical targets related
  to Gadd45B in the MAPK signaling pathway and its effects on NIS, Tg, and TPO expression.
  (B) Protein expression levels and quantitative analysis of key MAPK pathway genes
  following Gadd45B overexpression in Bcpap and K1 cell lines (n = 3 independent biological
  replicates). (C) Gadd45B and BRAFV600E expression levels in Bcpap cells treated
  with 0.5 μM PLX4720 for 0, 12, and 24 h, with quantitative analysis (n = 3 independent
  biological replicates). (D) Expression levels of Gadd45B and p-MEK in Bcpap cells
  treated with 1 μM AZD6244 for the indicated durations, with quantitative analysis
  (n = 3 independent biological replicates). (E) Effects of Gadd45B depletion alone
  or in combination with 0.5 μM PLX4720 on indicated protein expression levels, with
  quantitative analysis (n = 3 independent biological replicates). (F) Effects of
  Gadd45B overexpression alone or in combination with 1 μM AZD6244 on protein expression
  levels, with quantitative analysis (n = 3 independent biological replicates). (G)
  Western blot analysis showing the effects of Gadd45B overexpression and/or 0.5 μM
  PLX4720 on p-MEK, t-MEK, p-ERK, and t-ERK expression levels in Bcpap cells, with
  quantitative analysis (n = 3 independent biological replicates). (H) Western blot
  analysis showing the effects of Gadd45B overexpression and/or MEK1/2 inhibition
  (1 μM AZD6244) on p-MEK, t-MEK, p-ERK, and t-ERK expression levels in Bcpap cells,
  with quantitative analysis (n = 3 independent biological replicates). (I) Western
  blot analysis showing expression levels of p-MEK, t-MEK, p-ERK, and t-ERK in different
  treatment groups in Bcpap cells. (J) Western blot analysis showing expression levels
  of NIS, Tg, and TPO under control, Gadd45B overexpression, PLX4720 treatment, and
  AZD6244 treatment, with quantitative analysis. (K) Representative immunofluorescence
  images showing the subcellular localization of p-MEK and p-ERK. (L) Immunofluorescence
  images showing OPN and NIS localization in Bcpap cells following combined treatment
  with Gadd45B overexpression, BRAFV600E inhibition, and MEK1/2 inhibition. Scale
  bar: 10 μm. (M) Workflow for mouse model establishment and assessment (n = 6/group;
  n = 3 for IHC, Western blotting, and tumor growth surveillance; n = 3 for iodine
  uptake rate). (N) Representative images of tumors from control and combined treatment
  groups. (O) Tumor volume was monitored weekly in indicated groups. (P) Protein expression
  levels of Gadd45B, NIS, Tg, and TPO in tumors from indicated groups, with quantitative
  analysis. (Q) Immunohistochemistry analysis of Gadd45B, NIS, Tg, and TPO expression
  levels in tumors from indicated groups. (R) Quantitative analysis of RAI uptake
  levels at 24 h in vivo. Data are shown as mean ± SD. Statistical significance: ns:
  not significant, * p < 0.05, ** p < 0.01, *** p < 0.001. The uncropped blots are
  shown in Figure S10'
