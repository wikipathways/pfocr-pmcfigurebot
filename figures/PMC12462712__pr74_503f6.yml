figure_title: miR-126-3p inhibits hypoxic-ischemic brain damage (HIBD) in neonatal
  rats by targeting low density lipoprotein receptor related protein 6 (LRP6) through
  the PKC/ERK signaling pathway.
caption: 'miR-126-3p inhibits hypoxic-ischemic brain damage (HIBD) in neonatal rats
  by targeting low density lipoprotein receptor related protein 6 (LRP6) through the
  PKC/ERK signaling pathway. (A) PKC activator PMA was injected into the brains of
  rats, and PKC/ERK signaling pathway protein levels were detected. It was found that
  the p-PKC and p-ERK1/2 protein levels were notably elevated after overexpressed
  miR-126-3p (P<0.001). There were notably declined after miR-126-3p and LRP6 overexpression
  (P<0.01). On this basis, they were obviously elevated by PMA (P<0.05). (B–D) The
  levels of inflammatory factors were evidently decreased after PMA compared with
  miR-126-3p and LRP6 overexpression (P<0.001). (E–G) The survival rate of neurons
  was tested by immunofluorescence. After the application of PMA, the survival rate
  markedly rebounded (P<0.05, P<0.01, P<0.001). (H–J) The apoptotic cells were tested
  by TUNEL staining. After the application of PMA, the apoptotic cells were markedly
  reduced (P<0.001). K–M: The number of neurons was tested by Nissl staining. After
  the application of PMA, it was notably elevated (P<0.001). (N–P) The number of FJC
  positive cells was tested by FJC staining. After the application of PMA, it was
  significantly decreased (P<0.001, P<0.01). (Q–R) The foot fault test showed that
  compared with miR-126-3p and LRP6 overexpression, the rate of forelimb and hindlimb
  fault in rats was significantly reduced after PMA application (P<0.001). (S) The
  wire suspension test showed that compared with miR-126-3p and LRP6 overexpression,
  the forelimb strength increased significantly after PMA application (P<0.05, P<0.01,
  P<0.001)'
