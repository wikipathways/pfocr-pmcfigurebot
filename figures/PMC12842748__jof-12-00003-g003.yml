figure_title: Key pathway analysis in Populus davidiana × P.
caption: 'Key pathway analysis in Populus davidiana × P. alba var. pyramidalis across
  Botryosphaeria dothidea inoculation time points. Expression heatmaps depict transcriptional
  profiles at 0, 6, 12, 24, and 48 h post-inoculation (left to right). Genes encoding
  same enzyme are grouped. Expression gradients: brown (low); green (high). Values
  represent mean normalized expression of differentially expressed genes from three
  biological replicates (n = 3). PAL: Phenylalanine ammonia-lyase; 4CL: 4-Coumarate-CoA
  ligase; CYP73A: Cytochrome P450 73A; CSE: Caffeoyl shikimate esterase; CAD: Cinnamyl
  alcohol dehydrogenase; PRX: Peroxidase; COMT: Caffeic acid O-methyltransferase;
  CCoAOMT: Caffeoyl-CoA O-methyltransferase; CYP84A: Cytochrome P450 84A'
