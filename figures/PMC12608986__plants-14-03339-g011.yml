figure_title: Joint pathway analysis of DEGs and DEMs in non-bagging vs.
caption: 'Joint pathway analysis of DEGs and DEMs in non-bagging vs. bagging Fuji
  apple peels: (a) Cutin, suberin and wax biosynthesis pathway, (b) cutin and suberin
  biosynthesis pathway. The gene expression levels of differentially expressed genes
  (DEGs) are represented by rectangles, and adjacent heatmaps (red to green scales)
  show the expression values of the samples. Differentially expressed metabolites
  (DEMs) are represented by solid circles, with yellow indicating upregulation and
  blue indicating downregulation. The color scale represents the level of expression
  (log2 (Fold Change)). The key enzyme steps have now been fully labeled (e.g., 2.3.1.188:
  BAT1 (brassinosteroid related acyltransferase 1)), directly linking DEGs to metabolic
  pathways'
