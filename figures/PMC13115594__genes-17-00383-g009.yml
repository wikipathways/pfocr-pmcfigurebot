figure_title: Identification of CRD-related molecular subtypes in UC.
caption: Identification of CRD-related molecular subtypes in UC. (A) Consensus clustering
  matrix when k = 2. (B) Consensus CDF delta area curves when k = 2–9. (C) Relative
  alterations in the AUC of CDF curve. (D) Principal component plots of the two subtype
  clusters. (E,F) Box plots and heatmaps of the expression of 12 genes in the two
  isoforms, with each row of the heatmap representing one gene and each column representing
  one sample. (G) GSVA of KEGG pathways in the two subtypes. (H) Box plots of the
  differences in immune cell infiltration in the two clusters. * p < 0.05, ** p <
  0.01, *** p < 0.001
