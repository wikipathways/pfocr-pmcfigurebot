figure_title: Pathway enrichment analysis of DEG and DSD
caption: Bubble plot showing significantly enriched pathways both common and exclusive
  for the differentially expressed genes (DEGs) and percentage Shannon diversity (DSD)
  in disease groups ASH versus HC (A–C) and AH versus HC (D–F) and AH versus ASH (G–I).
  Size of the bubbles is proportional to the gene count. The y-axis represents the
  negative logarithm of the log10(P value) for the genes, and the x-axis displays
  the z score. The threshold for displaying the bubble labels was set to a z score
  of 2.3. Bubbles for genes belonging to a high z score are depicted in yellow and
  a low z score in blue
