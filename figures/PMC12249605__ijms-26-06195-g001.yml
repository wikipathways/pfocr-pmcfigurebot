figure_title: mCRP-induced activation of innate immunity and inflammatory pathways.
caption: 'mCRP-induced activation of innate immunity and inflammatory pathways. Pathway
  legend: The schematic depicts the role of mCRP in activating macrophages through
  binding to integrin α5β3 and Fcγ receptors (FcγRs), leading to AKT pathway activation.
  This results in the upregulation of pro-inflammatory cytokines (IL-1, IL-6, IL-α)
  and chemokines, the recruitment of monocytes, neutrophils, and T cells and the enhancement
  of phagocytic activity. The inflammatory response is further sustained by increased
  vascular permeability (edema) and the release of prostaglandins, leukotrienes, and
  nitric oxide'
