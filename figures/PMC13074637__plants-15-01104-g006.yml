caption: The effects of GD17 inoculation and/or salt stress on the chlorophyll pathway.
  (A) Chlorophyll a, (B) Chlorophyll b, (C) Maximum quantum efficiency of PSII photochemistry
  (Fv/Fm), (D) Actual quantum efficiency of PSII (ΦPSII), (E) Non-photochemical quenching
  of fluorescence (NPQ), (F) Linear electron transport rate (ETR), (G) Effect of GD17
  inoculation and/or salt stress on the expression of chlorophyll biosynthesis-related
  genes. Data are presented as means ± SD from three independent experiments (n =
  3), with 10 seedlings per experiment. Different lowercase letters indicate significant
  differences at p < 0.05
