caption: 'Gene Ontology (GO) enrichment analysis illustrating significantly enriched
  functional terms (adjusted p-value < 0.05) associated with circRNA source genes
  identified in pairwise comparisons of treatment groups—MLV vaccine (P2), IFN-α1
  (P3), and IFN-ω5 (P4)—relative to the control group (P1). The analysis categorizes
  enriched GO terms into biological processes (BP), cellular components (CC), and
  molecular functions (MF), based on Wallenius’ non-central hypergeometric distribution.
  Distinct enriched GO terms in each comparison highlight circRNA-associated genes’
  involvement in specific biological pathways and functions, suggesting their potential
  roles in immune regulation and antiviral responses. Some long terms are truncated
  in the axis labels, but their full names are provided here for clarity: cellular
  macromolecule metabolic process; intracellular membrane-bounded organelle; transferase
  activity, transferring phosphorus-containing groups; purine ribonucleoside triphosphate
  binding; protein-lysine N-methyltransferase activity; histone-lysine N-methyltransferase
  activity; modification-dependent protein catabolic process; small conjugating protein
  ligase activity'
