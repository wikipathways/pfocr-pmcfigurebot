figure_title: Kuwanon A induced the cycle arrest and migration/invasion inhibition.
caption: 'Kuwanon A induced the cycle arrest and migration/invasion inhibition. (A)
  KEGG analysis of genes down or upregulated (determined by proteomics data) in MHCC97
  H after it was treated with KA (10 μM). The cell cycle and MAPK pathway were marked
  by a red box. The DMSO groups were used as controls. (B) According to the proteomics
  data, the regulation of some proteins related to the main pathway is detailed. The
  DMSO groups were used as controls. (C) The flow cytometry assays were used to detect
  the cell cycle progress of HCC cells (MHCC97 H and SMMC 7721) after treatment with
  the indicated concentration of KA for 48 h. The DMSO groups were used as controls.
  (D) Western blot assays were used to determine the level of CDK and cyclin proteins
  in HCC cells (MHCC97 H and SMMC 7721), which were treated with the indicated concentration
  of KA for 48 h. The DMSO groups were used as controls. (E) The wound healing assay
  was used to detect the migration ability of highly metastatic HCC cells (MHCC97
  H and SMMC 7721) after treatment with the indicated concentration of KA for 48 h.
  The DMSO groups were used as controls. Scale bars = 200 μm (F). The Transwell without
  Matrix-Gel and (G) with Matrix-Gel were used to detect the migration and invasion
  ability of highly metastatic HCC cells (MHCC97 H and SMMC 7721) after treatment
  with the indicated concentration of KA for 48 h. The DMSO groups were used as controls.
  Scale bars = 200 μm (H). Western blot assays were used to determine the level of
  N-cadherin and E-cadherin in HCC cells (MHCC97 H and SMMC 7721), which were treated
  with the indicated concentration of KA for 48 h. The DMSO groups were used as controls.
  All data are shown as the means ± SD; * p < 0.05, ** p < 0.01, *** p < 0.001. ns:
  not significant'
