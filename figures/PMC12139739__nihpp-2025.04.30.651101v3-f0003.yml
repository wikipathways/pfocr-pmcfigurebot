figure_title: Differential transcript usage between cell types and cell subpopulations.
caption: Differential transcript usage between cell types and cell subpopulations.
  (A) Heatmap showing differential transcript usage (DTU) between alpha and beta cells.
  Each row represents a transcript (significant at FDR < 0.05), and each column represents
  a cell type. Colors indicate the fraction of a gene’s expression contributed by
  each transcript within each cell type. DTU genes were identified from pseudobulk
  analysis of two biological replicates of mouse pancreatic islet sclrRNA-seq libraries
  prepared with 5′ modified 10x Genomics technology. (B) KEGG pathway overrepresentation
  analysis (ORA) for DTU genes between alpha and beta cells. The x-axis shows recall,
  i.e., the proportion of functionally annotated genes in the query that are associated
  with each pathway. Bubble size represents the number of DTU genes in the pathway,
  and bubble color indicates statistical significance (−log10 p-value). The top 25
  enriched KEGG pathways are shown. (C) Differential gene expression (DGE), differential
  transcript expression (DTE), and differential transcript usage (DTU) analysis of
  Gnas between alpha and beta cells. DTU shows the relative contribution of each transcript
  to the gene’s overall expression. (C) DGE, DTE, DTU analysis of Ndufs2 between beta
  cell subpopulations 1_beta and 4_beta
