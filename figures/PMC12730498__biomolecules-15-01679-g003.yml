figure_title: Significant enhancement of FAO in pulmonary vascular cells.
caption: 'Significant enhancement of FAO in pulmonary vascular cells. In pulmonary
  vascular cells, persistently increased FAO activates the PPARγ/CPT1 pathway, elevates
  ATP production, suppresses AMPK signaling, and drives proliferation and remodeling.
  Red arrows in the figure denote the upregulated expression of target molecules in
  PH. AMP: activated protein kinase; ET-1: endothelin-1; PDGF: platelet-derived growth
  factor; PPARs: peroxisome proliferator-activated receptors. This figure was created
  with BioRender.com'
