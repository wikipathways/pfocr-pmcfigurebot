figure_title: The proposed tychonamide (tchA-F) biosynthetic pathway.
caption: 'The proposed tychonamide (tchA-F) biosynthetic pathway. (A) The biosynthetic
  gene organization of the cluster in the Floridanema aerugineum BLCC-F46 genome annotated
  using antiSMASH. (B) The entire predicted tychonamide biosynthetic pathway. The
  open reading frames for PKS portions of the gene cluster are in green, while NRPS
  portions are shown in purple. Abbreviations: CAL, acyl-CoA ligase; ACP, acyl carrier
  protein; KR, ketoreductase; KS, ketosynthase; AT, acyltransferase; AmT, aminotransferase;
  MonoOx, monooxygenase; C, condensation; A, adenylation; PCP, peptidyl carrier protein;
  E, epimerization; MT, methyltransferase; TE thioesterase; GNAT, Gcn5-Related N-acetyltransferase'
