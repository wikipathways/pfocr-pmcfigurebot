figure_title: Gadd45B deficiency drive the formation of RAIR-DTC.
caption: 'Gadd45B deficiency drive the formation of RAIR-DTC. (A) Workflow for the
  identification and preliminary validation of candidate genes responsible for RAIR−DTC
  development. (B) Differentially expressed genes (DEGs) among normal tissue, DTC,
  and RAIR−DTC based on RNA−seq data from cohort 1. (C) Significantly upregulated
  or downregulated DEGs and correlations of gene modules among normal tissue, DTC,
  and RAIR−DTC. (D) Gene Ontology (GO) analysis showing the biological process, cellular
  component, and molecular function enrichment of DEGs. (E) KEGG pathway analysis
  revealing cancer-related signaling pathway enrichment. (F) Variability in Gadd45B
  expression levels and Thyroid Differentiation Score (TDS) with disease progression
  from normal tissue to DTC and RAIR−DTC. (G) Correlation of Gadd45B expression levels
  between BRAF wild-type and BRAFV600E-mutated thyroid cancer. (H) Gadd45B expression
  levels in normal tissue versus thyroid cancer (data sourced from TCGA−THCA; p =
  1.31 × 10−9). (I) Comparison of Gadd45B expression levels in BRAF wild-type versus
  BRAFV600E-mutated thyroid cancer (data derived from TCGA−THCA; p = 6.18 × 10−6).
  (J) Gadd45B expression levels in BRAF wild-type and BRAFV600E−mutated thyroid cancer
  (data collected from Timer2.0; Wilcoxon test, p = 3.2 × 10−5). (K) Representative
  images of Gadd45B IHC staining in normal tissue and thyroid cancer tissue, with
  quantitative analysis from cohort 2 (n = 5). Magnification: 40 × 10; scale bars:
  50 μm. (L) Protein expression levels of Gadd45B in normal tissue and thyroid cancer
  tissue, with relative quantitative analysis (n = 5). (M) Relative Gadd45B IHC scores
  in BRAF wild−type and BRAFV600E-mutated thyroid cancer (cohort 3, n = 186). (N,O)
  Progression-free interval (PFI) and disease−free interval (DFI) curves based on
  Gadd45B-related survival probabilities (data collected from TCGA−THCA). Data are
  shown as mean ± SD. Statistical significance: ** p < 0.01, *** p < 0.001, **** p
  < 0.0001. The uncropped blots are shown in Figure S8'
