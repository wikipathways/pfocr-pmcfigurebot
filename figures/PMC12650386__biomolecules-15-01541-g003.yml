figure_title: Schematic of polyphenols inhibiting pro-tumor signaling cascades by
  regulating RAS dual-axis balance.
caption: 'Schematic of polyphenols inhibiting pro-tumor signaling cascades by regulating
  RAS dual-axis balance. Polyphenols: the central regulatory molecule (e.g., EGCG,
  resveratrol), which inhibits the pro-tumor axis and activates the anti-tumor axis
  [58,90]. RAS dual-axis: pro-tumor axis (ACE/AngII/AT1R), activates downstream pathways
  including NOX (inducing oxidative stress and inflammation) and Wnt (promoting angiogenesis
  and metastasis) [95,97]. Anti-tumor axis (ACE2/Ang(1-7)/AT2R): inhibits downstream
  pro-tumor pathways such as MAPK (reducing cell proliferation) and PI3K/ERK (inducing
  cell death) [51,99]. Tumor microenvironment indicates the comprehensive regulatory
  effect of polyphenols on the tumor microenvironment (e.g., reducing pro-inflammatory
  cytokines) [39]'
