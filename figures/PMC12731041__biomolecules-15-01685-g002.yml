figure_title: Proposed overview of HCMV-mediated modulation of the immune landscape
  to promote ovarian cancer (OC) progression.
caption: Proposed overview of HCMV-mediated modulation of the immune landscape to
  promote ovarian cancer (OC) progression. It is hypothesised that HCMV infection
  activates multiple interconnected pathways that can promote tumour growth, survival,
  and immune evasion in OC. Upon viral entry, HCMV proteins can activate the PI3K/Akt/mTOR
  signalling cascade, leading to enhanced cell survival and proliferation. This promotes
  programmed death ligand 1 (PD-L1) expression and immunosuppressive cytokine production
  (such as transforming growth factor-beta, TGF-β, and interleukin-10, IL-10). HCMV
  also promotes epigenetic reprogramming via the Myc/enhancer of zeste homologue 2
  (EZH2) axis via the activation of mTOR [7]. This axis promotes the silencing of
  tumour-suppressor genes and loss of differentiation programmes, contributing to
  oncogenesis and EMT in OC [21,31]. The viral G protein-coupled receptor US28 constitutively
  activates NF-κB signalling and stimulates interleukin-6 (IL-6) production, which
  activates the JAK/STAT3 pathway via the IL-6 receptor (IL-6R) [7]. HCMV infection
  may also remodel the OC immune tumour microenvironment (TME) by promoting M1-to-M2
  tumour-associated macrophage (TAM) polarisation, inhibiting T-cell, cytotoxic T
  lymphocytes (CTLs) and natural killer (NK) cell function through multiple mechanisms
  (pUL18, cmvIL-10 (viral Il-10 homologue), and human leukocyte antigen-E (HLA-E)
  upregulation), and downregulating class I and II major histocompatibility complex
  (MHC-I and MHC-II) presentation. Collectively, HCMV may exploit pro-inflammatory
  and immunosuppressive signalling to create a permissive environment for tumour progression,
  metastasis, and treatment resistance in OC. Adapted from sources [7,35]. Created
  in https://BioRender.com
