figure_title: Automated gene library screening for verazine biosynthesis in engineered
  S. cerevisiae
caption: '(a) Genes selected for screening include the heterologous verazine biosynthetic
  pathway and endogenous genes involved in sterol metabolism, fatty acid biosynthesis,
  redox balance, TGA biosynthesis, and lipid droplet assembly. Enzymatic steps in
  the proposed verazine pathway are highlighted in the green box. Arrow coloring corresponds
  to data in panel (c): green arrows indicate genes that significantly increased verazine
  production; gray arrows indicate genes with no significant effect or a significant
  decrease. (b) Overview of the automated workflow, including transformation of a
  plasmid library into the verazine-producing S. cerevisiae chassis (PW-42), culture
  of 32 engineered strains (MA-1 to MA-32) in six biological replicates, and LC-MS
  analysis. (c) Verazine peak area normalized by optical density. Box plots represent
  six biological replicates per strain. Genes are colored based on statistical significance
  relative to the control strain in black: green, significantly higher; gray, not
  significant; dark gray, significantly lower (Welch’s t-test, P < 0.05). Outliers
  may arise from biological variability due to heterogeneous expression of high copy
  2μ plasmids in S. cerevisiae, as visualized in Figure 1f'
