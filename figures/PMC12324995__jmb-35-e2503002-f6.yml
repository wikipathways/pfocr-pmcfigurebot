figure_title: Effect of bufalin on the intrinsic apoptotic pathway in TNBCSCs
caption: MDA-MB-231- and HCC1937-derived TNBCSCs were treated with bufalin (200, 400
  nM) for 72 h. (A) Nuclear morphology was analyzed by DAPI staining under a fluorescence
  microscope. Condensed and fragmented nuclei are indicated by red arrows. (B) MMP
  was assessed by TMRE staining and quantified by densitometry. (C) Intracellular
  ROS levels were measured using DCFH-DA staining, and DCF fluorescence was quantified
  with a microplate reader. (D) Protein expression levels of apoptosis regulators
  were analyzed by Western blotting. β-Actin was used as a loading control, and band
  intensity was quantified by densitometry. * p < 0.05, *** p < 0.001vs. control
