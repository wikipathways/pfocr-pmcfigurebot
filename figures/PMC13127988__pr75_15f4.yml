figure_title: Pelargonidin suppresses TGF-β1/Smad signaling in ISO-induced heart failure.
caption: 'Pelargonidin suppresses TGF-β1/Smad signaling in ISO-induced heart failure.
  (A) Representative Western blot images showing expression of TGF-β1, Smad2, Smad3,
  p-Smad2, and p-Smad3 in left ventricular tissue across experimental groups. (B)
  Densitometric quantification of the blots confirming the effects of Pelargonidin
  on the Smad signaling pathway. Data are expressed as mean ± SEM (n=6 per group).
  Statistical significance was determined using one-way ANOVA followed by Tukey’s
  post hoc test: # P<0.05, vs. control group, * P<0.01, ** P<0.001 vs. ISO group'
