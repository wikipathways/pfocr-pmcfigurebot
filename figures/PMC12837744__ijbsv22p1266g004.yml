figure_title: Combination of CARM1 and c-Myc inhibitors significantly upregulates
  arachidonic acid levels and inhibits pyrimidine synthesis.
caption: Combination of CARM1 and c-Myc inhibitors significantly upregulates arachidonic
  acid levels and inhibits pyrimidine synthesis. (A-C) KEGG analysis based on the
  RNA-seq data. (D) Venn diagram showing the changing metabolites between control
  and medicated groups. (E) ELISA measures the level of AA (Arachidonic Acid) in control
  and medicated groups in KYSE450, KYSE510 and AKR cells in vitro or AKR cells in
  vivo. Data were presented as mean±SD; n=3. Two-tailed t-tests. (F) Heatmap of the
  changing metabolic pathway. (G-I) RT-qPCR analyses of the CAD, DHODH, and UMPS levels
  in control and medicated groups in KYSE450 (G), KYSE510 (H) and AKR(I) cells. Data
  were presented as mean±SD; n=3. Two-tailed t-tests
