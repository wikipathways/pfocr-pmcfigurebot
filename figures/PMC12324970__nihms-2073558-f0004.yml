figure_title: Identification of VAV2 as a mediator of EGFR-induced Rac1 activation
  in prostate cancer cells.
caption: Identification of VAV2 as a mediator of EGFR-induced Rac1 activation in prostate
  cancer cells. A, Heatmap for the expression of Rac-GEFs and ELMO adaptors in prostate
  cancer cell lines, as determined with a Q-PCR array. Expression is shown as ΔCt
  for each Rac-GEF relative to the average of UBC and B2M housekeeping genes. B, Correlation
  analysis of mRNA expression levels with Rac1 signaling pathway and Rac1 cell motility
  signaling pathway activities for 43 Rac-GEFs as predicted by PARADIGM among TCGA
  primary prostate carcinomas (n=488). Gene expression levels and pathway activities
  were retrieved from the UCSC Xena browser. Statistically significant positively
  correlated Rac-GEFs (p<0.05) were divided into low and high median Rac-GEF expression
  levels and compared to RAC1 cell motility signaling pathway activity using the Wilcoxon
  rank-sum test. C, C4–2 prostate cancer cells were transfected with the indicated
  Rac-GEF siRNA duplexes or a non-target control RNAi (NTC). After 48 h, cells were
  serum starved and treated with EGF (100 ng/μl, 1 min). Rac1-GTP levels were determined
  with a PBD pull-down assay. Upper panel, representative Western blots. Lower panel,
  densitometric analysis. Results, normalized to total Rac1 levels in each case, were
  expressed as percentage relative to parental cells, + EGF (dotted line) (mean ±
  SEM, n=3–11). ** p<0.01. D, Similar experiments as in C using DU145 cells (mean
  ± SEM, n=3–10). ** p<0.01
