figure_title: Venn diagram and heatmap illustrating differentially expressed genes
  in STL1267-treated primary normal human lung fibroblasts in the Ad-TGFβ1 model
caption: 'Primary normal human lung fibroblasts (NHLF: Donor 1) were transduced with
  adenoviral Ad-TGFβ1 (1 × 108 PFU) for 16 hours, followed by replacement with complete
  medium. After 24 hours, cells transitioned into a myofibroblast-like phenotype before
  treatment with the Rev-erbα agonist STL1267 (10 μM) for 48 hours. Total RNA was
  extracted and analyzed via RNA sequencing (RNA-seq). (A) Venn diagram showing the
  overlap of significantly upregulated genes (Log2FC > 1.5) in the Ad-TGFβ1 vs. Control
  comparison and significantly downregulated genes (Log2FC < −1.5) in the Ad-TGFβ1+STL1267
  vs. Ad-TGFβ1 comparison. A subset of 84 shared genes, significantly downregulated
  in the Ad-TGFβ1+STL1267 vs. Ad-TGFβ1 comparison, was further analyzed for pathway
  enrichment using Enrichr, revealing key pathways such as collagen biosynthesis and
  extracellular matrix (ECM) organization. (B) Heatmap depicting differentially expressed
  ECM-metabolizing genes, including integrins and matrix metalloproteinases, which
  were upregulated by Ad-TGFβ1 but downregulated following Ad-TGFβ1+STL1267 treatment.
  Hierarchical clustering and heatmap generation were performed using one minus Pearson
  correlation (linkage method: average; clustering: column) in Morpheus (Broad Institute)'
