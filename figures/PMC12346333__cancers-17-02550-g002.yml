caption: This figure illustrates the distinct mechanisms by which various oncolytic
  viruses modulate the glioblastoma (GBM) microenvironment in vivo. (A) Adenovirus
  (ICOVIR17) promotes extracellular matrix degradation and T-cell recruitment, reducing
  tumor burden. (B) Herpes simplex virus (HSV-P10) downregulates the AKT/IL-6/STAT3
  pathway, sensitizing GBM cells to radiotherapy. (C) Reovirus selectively replicates
  in RAS-activated tumor cells by suppressing PKR, activating NK cells, CD8+ T cells,
  macrophages, and dendritic cells. (D) Measles virus infects CD46-high tumor cells,
  releasing PAMPs and enhancing phagocytosis by dendritic cells, particularly promoting
  maturation. Viruses are delivered intratumorally or systemically in GBM-bearing
  mice in all models, offering insight into their therapeutic and immunomodulatory
  potential. [Created with BioRender.com]
