figure_title: Host concentrations of CO2 alter C. neoformans cellular redox balance
  and engage multiple acetyl-CoA generating pathways for tolerance
caption: A. The mitochondrial membrane potential of H99 in ambient or 5% CO2 conditions
  for 24hr was assessed by JC-1 staining. JC-1 staining was analyzed by dividing the
  MFI resulting from excitation with the blue (488nm) laser in the BL2 emission filter
  (574/26) by the MFI in the BL1 emission filter (530/30), i.e. red/green ratio of
  single yeast cells. Bars represent the average red/green ratio of a minimum of 10,000
  cells per condition and error bars represent the SEM. Asterisks indicate a significant
  difference relative to H99 as determined by Student’s t-test (P < 0.05). Cellular
  stores of NAD/NADH (B) and NADP+/NADPH (C) were determined for H99 after incubation
  in buffered RPMI medium at ambient or 5% CO2 conditions for 24hr. Data are presented
  as ratios of the oxidized or reduced forms. Bars represent the average of three
  biological replicates and SD with significance relative to ambient conditions as
  determined by unpaired t-test (P < 0.05). D) The metabolic profile of H99 grown
  for 24hr in ambient air or 5% CO2 was analyzed by tandem mass spectrometry. Data
  were processed and are presented for 6-P-Gluconate as normalized area. Asterisk
  indicates p <0.05 for the comparison of ambient to 5% CO2 using two-tailed Welch
  corrected t test. E. Competitive fitness was determined for indicated strains after
  combining a 1:1 ratio of mNeonGreen labeled H99 and unlabeled mutant cells in RPMI
  1640 medium with 165mM MOPS at pH 7 and incubating at 37°C in ambient air or 5%
  CO2 for 24 hr. Cell populations were characterized by flow cytometry and the percentage
  of mNeonGreen negative cells in 5% CO2 was divided by those in ambient conditions
  to calculate competitive fitness. Bars represent the average of three biological
  replicates with error bars indicating SD. Asterisks indicate a significant difference
  relative to H99 as determined by one-way ANOVA with Tukey’s multiple comparisons
  test (P < 0.05). The competitive fitness of H99 and indicated strains (acl1Δ or
  yhm2Δ) was determined in vivo after two inoculation routes in CD-1 mice. F. For
  intranasal inoculation (IN), wild-type and mutant cells were mixed in a 1:1 ratio
  prior to inoculation with 5 × 104 CFU/animal in a 50 μL volume. G. For intravenous
  inoculation (IV), wild-type and mutant cells were mixed in a 1:1 ratio prior to
  inoculation with 1 × 105 CFU/animal in 100 μL volume. Organs were harvested at day
  4 post-inoculation. Tissues were homogenized and serially diluted on YNB or YNB
  with 400 μg/mL hygromycin and incubated at 30°C for two days before counting CFUs.
  The competitive fitness was determined by dividing the CFU of mutant cells (HYG
  resistant) by the CFU of H99 cells in lung (F) from the IN model or brain (G) from
  the IV model. Data are represented with the average CFU/mouse and SD. Asterisks
  indicate a significant difference relative to H99 as determined by unpaired t-test
  (P < 0.05)
article_title: Cryptococcus neoformans adapts to host CO2 concentrations through the
  coordinated remodeling of central carbon metabolism, oxidative stress resistance,
  and membrane homeostasis
