caption: The steroid biosynthetic pathway that leads to the synthesis of estrogens
  in peripheral and/or breast tumor tissues. Cholesterol is transported into the IMM
  by the StAR protein, in which CYP11A1 converts cholesterol to pregnenolone, which
  is further processed through enzymatic steps to produce androstenedione. Aromatase
  is the key enzyme in estrogen biosynthesis, facilitating the conversion of androgens
  to estrogen/E2
