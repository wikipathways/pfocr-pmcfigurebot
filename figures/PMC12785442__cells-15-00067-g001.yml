figure_title: Forebrain (FB) metabolomic landscape of P20–30 HETs.
caption: Forebrain (FB) metabolomic landscape of P20–30 HETs. Forebrain tissue was
  collected from P20–30 HET and age-matched WT mice for metabolomic analysis. Metabolite
  concentrations were normalized to tissue weight. (A) Schematic of the metabolomic
  analysis workflow. (B) KEGG pathway analysis showing the top 25 enriched pathways
  in P20–30 HET forebrain. Black-filled bars represent data from wildtype (WT) mice,
  and pink-filled bars represent data from Scn1aA1783V/WT (HET) mice. (C) Metabolites
  that are significantly altered in the HET forebrain. Units on the Y-axis refer to
  "area under the curve" values. Tricarboxylic acid cycle cycle and pentose phosphate
  pathway metabolites are significantly decreased. (D) Levels of glucose, glycogen,
  and activities of HK and G6PD at baseline in the forebrain. Glucose and glycogen
  levels, and HK and G6PD enzyme activities, are insignificantly altered in the forebrain
  of HETs. Data are represented as mean ± SEM (error bars). For the KEGG pathway analysis
  in panel (A), p-values and enrichment ratios are represented within the image. The
  asterisk (*) in panel (B) highlights the pathways in which metabolites are significantly
  altered and shown in panel (C). For metabolites, * p < 0.05 versus WT by Student’s
  two-tailed unpaired, parametric t-test. N = 4–5/group (metabolomics), 5/group (glucose
  assay), 8/group (glycogen assay), and 5–6/group (HK and G6PD assays)
