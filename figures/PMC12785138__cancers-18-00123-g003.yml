figure_title: Antigen capture, processing, and presentation by dendritic cells.
caption: Antigen capture, processing, and presentation by dendritic cells. Dendritic
  cells have the capacity to present both endo- and exogenous antigens, thereby enabling
  immune surveillance against extracellular and intracellular factors. During the
  exogenous antigen presentation, major histocompatibility complex class II (MHC II)
  molecules are assembled in the endoplasmic reticulum (ER) in association with the
  invariant chain containing the class II-associated invariant chain peptide (CLIP)
  and form late endosomes. Dendritic cells can internalize exogenous antigens through
  selective phagocytosis, macropinocytosis, or receptor-mediated endocytosis. Antigen-transporting
  primary endosomes fuse with MHC II-marked late endosomes where the proteolytic degradation
  of the engulfed cargo occurs. Exchange of CLIP for peptides generated from processed
  antigens is mediated by HLA-DM, resulting in stable MHC II-peptide complexes that
  are, eventually, delivered to the cell membrane for presentation to CD4+ T helper
  (Th) cells. In the endogenous pathway, in contrast, cytosolic proteins are degraded
  by the proteasome and the resulting peptides are transported into the ER via transporter
  associated with antigen processing (TAP) and loaded onto MHC I proteins. The complex,
  then, is transported to the cell surface to be recognized by CD8+ cytotoxic T (Tc)
  cells. In both cases, effective T cell activation requires additional costimulatory
  signaling like CD80/86-CD28 connection. The figure was created with Biorender.com
