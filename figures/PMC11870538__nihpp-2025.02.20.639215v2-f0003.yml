figure_title: cfAF treatment reduces CCl4-induced liver fibrosis by attenuating hepatic
  stellate cell activation
caption: |-
  A. Experimental approach showing how mouse liver RNA was analyzed using the Nanostring nCounter Mouse Fibrosis Panel. B. Clustered heatmap showing RNA abundance from Nanostring nCounter normalized read levels clustered using Spearman’s rank correlation and single linkage. C. A Venn diagram showing the overlap of significant RNA abundance changes (P < 0.1) in each comparison from Nanostring nCounter results. D. Nanostring data shown in volcano plot with Log2FC on the x-axis and −Log10
  P-value on the y-axis; P-value cutoff for significance is P < 0.1 shows transcripts altered between CCl4 vs. control (green), CCl4 + cfAF vs. control (blue), and CCl4 + cfAF vs. CCl4 (red). E. Pathway analysis of RNA level changes associated with enrichment (left) or depletion (right) of pathways in CCl4 + cfAF mice versus CCl4 mice. F. RT-qPCR using RNA extracted from murine liver tissue and showing mRNA abundance relative to GAPDH. One-way ANOVA with multi-comparison was used to determine significance: *P < 0.05, **P < 0.01; N = 3 CCl4 mice, N = 4 CCl4 + cfAF mice; N = 3 control mice. G. Representative immunofluorescent images from murine liver tissue using antibodies to Fibronectin (top), Type I Collagen (middle), or Vimentin (bottom) in green and DAPI counterstain in blue; antibody signal intensity is shown relative to DAPI and displayed to the right of each set of images; N=3 mice per treatment condition; scale bars = 100 μm; One-way ANOVA with multi-comparison was used to determine significance: *P < 0.05, **P < 0.01, ***P < 0.001. H. Higher magnification immunofluorescent images showing Fibronectin antibody and DAPI counterstain focused on an individual portal triad; scale bars = 100μm
