figure_title: The role of L-cysteine/H2S pathway on CaCl2-induced relaxations.
caption: The role of L-cysteine/H2S pathway on CaCl2-induced relaxations. Representative
  traces CaCl2-induced relaxations (A). Graph showing that CaCl2-induced relaxations
  in the presence of PAG (Cystathionine-gamma-lyase (CSE) inhibitor, 10 mM) (B), AOAA
  (Cystathionine beta synthase (CBS) inhibitor, 1 mM) (C), and Calhex-231 (Calcium
  Sensing Receptors (CaSRs) inhibitor, 5 μM) (D). All values are mean ± S.E.M. (n=6).
  * P<0.05 significantly different from the control; unpaired t-test followed by Bonferroni’s
  comparison test
