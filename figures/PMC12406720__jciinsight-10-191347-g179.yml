figure_title: SH2D5 modulates NMDAR transcript levels via STAT1
caption: (A) KEGG pathway analysis of the LC–MS/MS quantitative proteomics data from
  Sh2d5-KO and control mice with epilepsy. The proteins outlined in red are related
  to the JAK/STAT signaling pathway. (B) Volcanic map of differentially expressed
  proteins identified by LC-MS/MS quantitative proteomics. (C) Verification of changes
  in glutamatergic receptor levels via qPCR. (D and E) Representative Western blot
  images (D) and quantification (E) of STAT1 and STAT1 dimer levels. (F and G) Representative
  Western blot images (F) and quantification (G) of p-STAT3-705, p-STAT3-727, and
  STAT3 levels. (H and I) Representative Western blot images (H) and quantification
  (I) of the protein levels of NMDARs after inhibition of STAT1 by fludarabine. (J–M)
  Quantification of the latency to seizure onset (J), latency to SE onset (K), latency
  to the first SRS (L), and total number of SRSs within 4 weeks (M) after KA treatment.
  (N) Representative images of LFP recordings taken 5 weeks after KA treatment. (O
  and P) Quantitative analysis of LFP recordings. (Q) Quantification of PTZ kindling–induced
  epileptic seizures. The data are presented as mean ± SEM. Unpaired t test in C,
  E, G, I–M, O, and P; 2-way ANOVA with Tukey’s multiple-comparison test in Q. *P
  < 0.05, **P < 0.01, and ***P < 0.001
article_title: Deletion of SH2D5 alleviates epileptic seizures and NMDAR expression
  via autophagic degradation of STAT1
