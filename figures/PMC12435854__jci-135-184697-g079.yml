figure_title: Intestinal H3R signaling reduces vascular leakage in inflamed paws
caption: (A) Heatmap of the top 50 regulated genes in CD11b– cells of the nervus plantaris
  in CIA mice ± RαMH. (B) Most enriched pathways identified by IPA (QIAGEN). (C) Top
  10 upstream regulators of the enriched neurovascular coupling pathway identified
  by IPA (QIAGEN). (D) Kep (transfer constant) in the paws of CIA mice ± RαMH on third
  treatment day. (E) Example MRI of T2 STIR, T1 POST KM, T1 POST KM, and map of parameter
  of CIA mice ± RαMH. (F) Raw signal intensity of DCE measurement over time of CIA
  mice ± RαMH. (G) Clinical arthritis score shown as paw thickness (mm) of CIA mice
  with or without QX-314 and bupivacaine-induced nerve blockage ± RαMH (n = 5) at
  the peak of disease. Data are expressed as mean ± SD. Statistical difference was
  determined by Student’s t test (D), Student’s t test of AUC (F), and 1-way ANOVA
  of AUC (G). *P < 0.05, **P < 0.01, ***P < 0.001
