figure_title: Bioinformatics and network pharmacology analysis of the effects of nintedanib
  on TNBC.
caption: Bioinformatics and network pharmacology analysis of the effects of nintedanib
  on TNBC. (A) Principal component analysis scatter plot comparing control and nintedanib-treated
  groups. (B) Volcano plot displaying DEGs identified from RNA-seq data. (C) Heatmap
  of DEGs across three nintedanib-treated and three control samples, with high expression
  levels shown in red and low levels in blue. (D) Gene Ontology enrichment analysis
  of DEGs related to TNBC. (E) Kyoto Encyclopedia of Genes and Genomes pathway analysis
  of DEGs associated with TNBC. (F) Venn diagram highlighting overlapping genes between
  DEGs from RNA-seq and nintedanib targets identified via the PharmMapper database.
  (G) Chemical structure of nintedanib. (H) Molecular docking visualization of the
  interaction between nintedanib and tumor protein p73. BP, biological process; CC,
  cellular component; DEGs, differentially expressed genes; MF, molecular function;
  RNA-seq, RNA sequencing; TNBC, triple-negative breast cancer
