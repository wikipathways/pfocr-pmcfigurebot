figure_title: Combined PI3Ki and CARM1i treatment inhibits the growth and metastasis
  of a PDX and CD8+ T cell infiltration in 4T1 tumors in vivo
caption: A, Schematic treatment workflow with vehicle, BKM120, EZM2302, or both in
  HCI-002.B, Normalized growth curves by drug treatment in HCI-002. The drug treated
  tumor volumes are normalized by the pre-treated tumor volumes. **P< 0.01; *P< 0.05.C,
  IHC staining of a human-mitochondria antigen and Ki-67 in HCI-002 tumors treated
  with vehicle, BKM120, EZM2302 or both. Representative images of local tumors are
  shown in top and metastatic tumors by human-mitochondria staining in lung are shown
  in bottom.D, Quantification of Ki-67 and human-mitochondria antigen positive cells
  in local tumors (top) or lung tissues (bottom) in C.E, Growth curves show the 4T1
  tumor volumes normalized by pre-drug treatment tumor volumes. ***P< 0.001F and G,
  (F) Flow cytometry analyses of CD4 and CD8 expressing T cells in local tumors of
  a 4T1.2 syngeneic model after treatment with vehicle, BKM120, EZM2302, and both.
  (G) Quantification of CD8+/CD45+ cells in panel F.H, A simplified model depicting
  MAP2K4 and PI3K pathways in ER+ BC and TNBC cells and the anti-growth effects of
  CARM1i and PI3Ki. In ER+ BC, MAP2K4 mutations inactivate the MAP2K4 pathway. Therefore,
  cell survival depends on PI3K and the cells are sensitive to PI3K inhibition (left).
  In TNBC, MAP2K4 is methylated by CARM1 to activate JNK and potentiate oncogenic
  functions. Inhibition of MAP2K4 methylation leads to increased sensitivity of TNBC
  cells to PI3Ki (right)
article_title: CARM1-mediated MAP2K4 methylation potentiates the oncogenic functions
  of MAP2K4 and constitutes a targetable dependency in triple-negative breast cancer
