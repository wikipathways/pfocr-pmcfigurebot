figure_title: Schematic diagram of the virological mechanisms of immune evasion by
  EBV.
caption: 'Schematic diagram of the virological mechanisms of immune evasion by EBV.
  After EBV infection of NPC cells, immune evasion is achieved through multiple mechanisms
  that suppress antitumor immune responses. The molecular mechanisms include: i) Antigen
  presentation inhibition: EBV proteins (EBNA1, BNLF2a and BCRF1) block the function
  of MHC class I molecules and TAP transport, weakening the recognition capacity of
  CD8+ T cells. ii) Anti-apoptosis and CTL evasion: BHRF1 and LMP1 inhibit apoptosis
  (for example, by blocking Bax) or activate the NF-κB pathway, assisting tumor cells
  in evading CTL-mediated killing. iii) Induction of T cell exhaustion: LMP1 and BARTs
  mRNA upregulate the PD-L1/PD-1 signaling pathway, leading to T cell dysfunction.
  iv) Remodeling of the TIME: Through the secretion of factors such as IL-10, TGF-β
  and CCL20, EBV recruits Tregs and MDSCs, further suppressing T cell activity and
  creating an immunosuppressive microenvironment. EBV, Epstein-Barr virus; NPC, nasopharyngeal
  carcinoma; EBNA1, Epstein-Barr nuclear antigen 1; BNLF2a, BamN-terminal latent protein
  family member 2a; BCRF1, BamC-terminal reading frame 1; BHRF1, BamHI rightward reading
  frame 1; LMP1, latent membrane protein 1; BARTs, BamHI-A rightward transcripts;
  MHC-I, major histocompatibility complex class I; TAP, transporter associated with
  antigen processing; CTL, cytotoxic T lymphocyte; PD-L1, programmed cell death ligand
  1; PD-1, programmed cell death protein 1; Treg cell, regulatory T cell; MDSCs, myeloid-derived
  suppressor cells; CCL20, C-C motif chemokine ligand 20; TIME, tumor immune microenvironment'
