figure_title: The expression and correlation of NLRC5 across different tissues and
  immune cell subtypes in single-cell RNA sequencing (scRNA-seq) data.
caption: The expression and correlation of NLRC5 across different tissues and immune
  cell subtypes in single-cell RNA sequencing (scRNA-seq) data. (A) Dot plot showing
  NLRC5 RNA expression across various tissue types, including peripheral blood mononuclear
  cells (PBMCs), lymph nodes (normal and metastatic), and esophageal tissues. Notably,
  NLRC5 is highly expressed in PBMC, suggesting its significant involvement in circulating
  immune cells. (B) UMAP plot of T cell subtypes from scRNA-seq data, highlighting
  various immune subpopulations including CD8+ T cells, Tregs, and other immune cells.
  (C) UMAP plot depicting NLRC5 expression levels across T cell subtypes, with notable
  enrichment in certain immune cell populations, indicating its role in immune modulation.
  (D) Dot plot illustrating the expression levels of NLRC5 in various immune cell
  subtypes, particularly high in T cells and certain myeloid cells. This pattern further
  emphasizes NLRC5’s involvement in immune processes within the tumor microenvironment.
  (E–H) Correlation analysis of NLRC5 with immune checkpoint molecules within the
  CD8+ T cell subset. Strong positive correlations are observed between NLRC5 and
  key immune checkpoint markers, including PDCD1 (E) (R = 0.71, p < 2 × 10−16), ENTPD1
  (F) (R = 0.08, p < 2 × 10−16), LAG3 (G) (R = 0.28, p < 2 × 10−16), and HAVCR2 (H)
  (R = 0.11, p < 2 × 10−16). These correlations suggest NLRC5 may influence immune
  checkpoint pathways and contribute to T cell exhaustion within the tumor microenvironment.
  The red line indicates the fitted linear regression line
