figure_title: Preparation and characterization of 7-PFBO-CBD.
caption: Preparation and characterization of 7-PFBO-CBD. A To confirm the existence
  of the aldehyde intermediate, 7-formyl-CBD, human liver S9 (500 μg/mL) was incubated
  with 10 μM 7-hydroxy-CBD in the presence of 2 mM NAD+ and 5 mg/mL PFBHA at 37 °C
  for 1 h. Control incubations were conducted without either S9 or 7-hydroxy-CBD.
  The samples were subjected LC–MS analysis, employing selected ion monitoring at
  m/z 524 to detect the PFBHA-trapped 7-formyl-CBD, namely 7-PFBO-CBD. B The fragmentation
  pattern of the parent ion (m/z 524) was collected using a ScanWave daughter scan;
  the proposed fragmentation pathway of the oxime is illustrated in the inset. C To
  prepare a sufficient amount of 7-PFBO-CBD for 1H NMR spectroscopic analysis, 50
  μM 7-hydroxy-CBD was incubated with 1 mg/mL human liver S9 in the presence of 2
  mM NAD+, 5 mg/mL PFBHA, and 100 μM disulfiram at 37 °C for 3 h. The 7-PFBO-CBD was
  purified and reconstituted in methanol-d4 and analyzed by 1H NMR spectroscopy
