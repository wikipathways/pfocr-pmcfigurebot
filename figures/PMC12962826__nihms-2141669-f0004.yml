figure_title: |-
  Dysregulated gene expression and RNA metabolism in SH-SY5Y OTULIN
  KO reveals a potential non-canonical role of OTULIN, which may serve as a master regulator of gene expression and RNA metabolism in neurons
caption: |-
  (A) Bulk RNA sequence analysis of SH-SY5Y OTULIN
  KO shows upregulation of 774 genes and a downregulation of 13,341 genes compared to wild type (WT), with three replicates from each group. (B)
  OTULIN gene deficiency dysregulates RNA metabolism in SH-SY5Y as reflected in the number of differentially expressed transcripts, with a downregulation of 43,003 transcripts and an upregulation of 1,113 transcripts compared to WT. (C) The volcano plot of differentially expressed genes in SH-SY5Y OTULIN
  KO represents the log2 of the fold change with a q value of <0.05 as the significant cutoff. On the plot of log2 of fold changes, red dots at positive and blue dots at negative zones represent upregulated and downregulated gene expression, respectively. Whereas gray dots at the neutral zone denote no significant change of gene expression in both WT and KO lines. (D) The volcano plot of differentially expressed transcripts represents the log2 of fold change with a q value of <0.05 as the significant cutoff for upregulated (red dots) or downregulated (blue dots) and no change (gray) of transcript levels in OTULIN
  KO as compared to WT. (E) Heatmap analysis of differentially expressed genes in OTULIN
  KO (KO_1,2,3) and wild type (WT_1,2,3) SH-SY5Y lines. Heatmap intensity in color codes indicates upregulated (orange to red) and downregulated (blue) gene expression, respectively. Most of the upregulated gene expressions in OTULIN
  KO are linked with mRNA degradation/decay and splicing pathways. (F) A gene ontology (GO) scatter plot represents a set of genes that are associated with protein-to-nucleotide binding and were significantly differentially expressed in the SH-SY5Y OTULIN
  KO line. (G) The cellular pathway analysis using the Kyoto Encyclopedia of Genes and Genomes (KEGG) scatter plot describes the enrichment of differentially expressed genes in OTULIN
  KO. RNA metabolism and neurodegenerative disease-associated pathway genes were enriched among the differentially expressed genes. The size and color of dots on the scattered plots (F, G) denote the number of genes and levels of significantly enriched differentially expressed genes
