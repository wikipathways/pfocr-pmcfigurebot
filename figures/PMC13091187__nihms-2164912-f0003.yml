figure_title: SGCC reveals coordinated spatial transitions in cellular states and
  tissue architecture
caption: '(A) Schematic overview of the SGCC methodology showing: I) Pattern binning
  of single-cells in spatial proteomics data, followed by II) Pattern encoding through
  GFT to generate low-frequency FCs, and III) Cross-correlation analysis to identified
  coordinated spatial patterns for downstream integration with transcriptomics. (B)
  Integration framework for identifying genes covarying with spatial pattern across
  the tissue, linking spatial factors to gene expressionfor functional analysis. (C)
  Analysis of CD4 T cell and BCL6+ B cells via IN-DEPTH proteomics and transcriptomics
  analysis, showing SGCC scores, total number of cells, CD4T cell proportion, BCL6+
  and BCL6- B cell proportion, their associated spatial distribution of cells in bins,
  and the coordinated gene expression programs reflecting intrinsic cell programs
  and T-B cell crosstalk (bottom). Enriched genes are italicized, pathways are bolded
  and myeloid subtypes are in purple. The full gene pathway names can be found in
  Supp Table 4. (D) A schematic illustrating tissue-level organization derived from
  SGCC analysis depicting the transitions in T-B cell interactions across the dark
  zone (DZ) and light zone (LZ)'
