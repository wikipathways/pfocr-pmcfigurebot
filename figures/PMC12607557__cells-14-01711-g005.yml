figure_title: Overview of region- and matrix-specific alterations in tryptophan-derived
  metabolites in 8-week-old male kat2−/− mice compared to wild-type (WT) controls
  in ultra-high-plasticity liquid chromatography with tandem mass spectrometry.
caption: 'Overview of region- and matrix-specific alterations in tryptophan-derived
  metabolites in 8-week-old male kat2−/− mice compared to wild-type (WT) controls
  in ultra-high-plasticity liquid chromatography with tandem mass spectrometry. This
  figure summarizes significant alterations in tryptophan–kynurenine, serotonin, indole-pyruvate,
  and tyrosine–dopamine pathway metabolites across distinct brain regions (striatum,
  cortex, hippocampus, cerebellum, brainstem), plasma, and urine in kat2−/− mice compared
  to the WT. Results highlight the region- and pathway-selective metabolic rewiring
  induced by kat2 deletion, particularly the consistent increase of 3-hydroxykynurenine
  and decrease in xanthurenic acid, alongside mixed kynurenic acid responses and downstream
  shifts in serotonin, indole, and catecholamine derivatives. We marked significant
  changes with circles. Red circles mean a statistically significant decrease, and
  green shows a significant increase in the concentration compared to the WT mice.
  The increasing size of the circles indicates higher levels of significance (small
  circle: p < 0.05; medium circle: p < 0.01; large circle: p < 0.001). Gray rectangle
  background: previously published results [67]. Black square: no data. 3-HAA, 3-hydroxyanthranilic
  acid; 3-HK, 3-hydroxykynurenine; 5-HIAA, 5-hydroxyindole-3-acetic acid; 5-HT, serotonin
  (5-hydroxytryptamine); 5-HTP, 5-hydroxytryptophan; AA, anthranilic acid; BH2, dihydroxybiopterin;
  BIO, biopterin; CER, cerebellum; CTX, cortex; DOPAC, 3,4-dihydroxyphenylacetic acid;
  HIPP, hippocampus; IAA, indole acetic acid; ICA, indole-3-carboxaldehyde; ILA, indole-3-lactic
  acid; INS, indoxyl sulfate; KYN, kynurenine; KYNA, kynurenic acid; MHPGS, 3-methoxy-4-hydroxyphenylglycol
  sulfate; QAA, quinaldic acid; Trp, tryptophan; Tyr, tyrosine; STEM, brainstem; STR,
  striatum; XA, xanthurenic acid'
