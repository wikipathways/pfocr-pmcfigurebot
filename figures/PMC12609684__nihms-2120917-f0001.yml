caption: Decreased peripheral immune cells and immune cell migration into the brains
  of HIP rats (A) Experimental overview of rat model expressing normal rat amylin
  and pancreatic human amylin. (B) Top 10 canonical and biological pathways identified
  by IPA and DAVID software, respectively, of DEGs in the brains of WT and HIP rats.
  (C) Frequency of CD4+ T cells, CD8+ T cells, B cells, neutrophils, and monocytes
  in the blood of WT and HIP rats quantified by flow cytometry. (D) Cells/g of CD4+
  T cells, CD8+ T cells, B cells, neutrophils, and macrophages in the spleens of WT
  and HIP rats quantified by flow cytometry. (E) Cell counts of CD4+ T cells, CD8+
  T cells, B cells, neutrophils, and macrophages in the brains of WT and HIP rats
  quantified by flow cytometry. *p < 0.05, **p < 0.01, and ****p < 0.0001 as determined
  using an unpaired two-tailed Students t-test. Data are presented as means ± SD;
  n = 8–9 rats per group
