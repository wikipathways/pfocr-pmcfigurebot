figure_title: Mesenchymal subpopulations and SSc vs control fibroblast analysis.
caption: Mesenchymal subpopulations and SSc vs control fibroblast analysis.(A) Subclustering
  of mesenchymal nuclei. (B) Mesenchymal nuclei divided by control vs SSc. (C) Proportion
  of mesenchymal nuclei consisting of each cell type at the individual sample level,
  comparing SSc vs control. The bar represents the mean with error bar the SEM. *P
  = .0106–.0142; **P = .0028–.0056; ***P = .0005. (D) Gene expression of select cell
  type identifiers. (E) SSc fibroblasts vs control fibroblasts DARs with labelling
  of select DARs and the nearest annotated gene. (F) Pathway enrichment of OCRs is
  more accessible in SSc vs control fibroblasts. (G) ATAC pseudobulk by mesenchymal
  cluster of 5 regions with top DARs in activated myofibroblasts. (H) Top-enriched
  TF family motifs in SSc-ILD fibroblasts vs control fibroblasts, ranked by absolute
  value of average difference and separated into positively and negatively enriched.
  The final column notes the number of TFs in the same class/family present in the
  top 100, as well as the direction of their enrichment (positive or negative). ATAC,
  assay for transposase-accessible chromatin; DAR, differentially accessible chromatin
  region; ILD, interstitial lung disease; OCR, open chromatin region; SSc, systemic
  sclerosis-associated; TF, transcription factor
