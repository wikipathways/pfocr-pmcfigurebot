figure_title: Liver dysfunction in Down syndrome is driven by hepatocyte dysfunction
caption: (A) Heatmaps showing the median Z score of the leading-edge genes from the
  cholesterol homeostasis, adipogenesis, bile acid metabolism, and fatty acid metabolism
  GSEA signatures in whole liver tissue.(B) Sina plots displaying the log2(RPKM) of
  various genes. Benjamini-Hochberg adjusted p values (q values) are indicated.(C)
  UMAP plot displaying the cholesterol homeostasis gene set NES in each cluster.(D)
  Bubble plot displaying the mean expression and the percent of cells per cluster
  expressing Fasn in both wild-type and Dp16 mice.(E) Sina plot displaying the log2
  of the normalized counts of Fasn expression within hepatocyte cluster 2 in wild-type
  and Dp16 animals.(F) UMAP plot displaying the bile acid metabolism gene set NES
  in each cluster.(G) Bubble plot displaying the mean expression and the percent of
  cells per cluster expressing Agxt in both wild-type and Dp16 mice.(H) Sina plot
  displaying the log2 of the normalized counts of Agxt expression within hepatocyte
  cluster 2 in both wild-type and Dp16 animals.(I) Schematic illustrating iPSC-derived
  hepatocyte differentiation protocol, with microscopy images of cells in each stage.
  Scale bars, 50 μm.(J) Sina plots displaying the gene expression of Alb and Cyp3a4
  relative to disomic iPSCs. Values from control cells are shown in gray and from
  T21 cells are shown in blue. p values, as determined by a Mann-Whitney U test, are
  shown.(K) Representative images of albumin (green) and DAPI (blue) immunofluorescent
  staining of D21 and T21 iPSC-derived hepatocytes. Sina plot displaying the concentration
  of albumin in the supernatant of iPSC-derived hepatocytes.(L) Sina plot displaying
  the concentration of albumin in the supernatant of iPSC-derived hepatocytes.(M)
  Sina plot displaying the concentration of urea in the supernatant of iPSC-derived
  hepatocytes.(N) Heatmap displaying the enrichment of various GSEA gene sets in whole
  mouse liver, hepatocytes, and two single-cell hepatocyte clusters. Asterisks indicate
  significance after Benjamini-Hochberg correction for multiple testing (q value<
  0.1).(O) Heatmap showing the median Z score of the leading-edge genes from the bile
  acid metabolism GSEA pathway in the iHepatocytes.(P) Sina plot displaying the log2(RPKM)
  of CYP27A1.(Q) Heatmap displaying the log2(fold change) of bile acids detected in
  the supernatant of trisomic versus disomic iPSC derived hepatocytes. Color coding
  indicates a positive (red) or negative (blue) log2(foldchange).(R) Sina plot displaying
  the log2(relative abundance) of taurolithocholic acid detected in the supernatant
  of disomic and trisomic iPSC-derived hepatocytes. Nominal and Benjamini-Hochberg
  adjusted p values (q values) are indicated.For (E, H, and P), q values determined
  by DEseq2 are shown.For (J–M), p values determined by a Mann-Whitney U test are
  shown.For (J–R), four separate cell lines were used per genotype, with 2–4 replicates
  per line
