figure_title: Conceptual framework of 5-ALA induced PpIX fluorescence guidance in
  urologic oncology.
caption: 'Conceptual framework of 5-ALA induced PpIX fluorescence guidance in urologic
  oncology. (a) After administration, 5-ALA enters cells and is metabolized through
  the heme biosynthesis pathway to generate PpIX, which can be converted to heme by
  FECH in an iron-dependent manner. PpIX emits red fluorescence under blue-violet
  excitation, enabling PDD. PpIX accumulation and tumor-to-normal contrast are influenced
  by multiple biological factors, including heme pathway activity, iron availability,
  and porphyrin transporters (for example, ABCG2-mediated efflux), as well as optical
  factors such as tissue attenuation and background autofluorescence. In the schematic,
  blue arrows indicate excitation light, red arrows indicate emitted fluorescence,
  and the red cross denotes inhibition of PpIX-to-heme conversion. (b) Typical site-dependent
  contrast patterns in urologic oncology. In bladder cancer, fluorescence contrast
  is often favorable for detecting carcinoma in situ and small or multifocal lesions,
  whereas specificity may decline in inflammatory or post-treatment settings. In renal
  tumors, fluorescence can be low or heterogeneous and may overlap with surrounding
  renal parenchyma, limiting margin visualization in some cases. Abbreviations: 5-ALA,
  5-aminolevulinic acid; PpIX, protoporphyrin IX; PDD, photodynamic diagnosis; FECH,
  ferrochelatase; ABCG2, ATP-binding cassette subfamily G member 2. Created in BioRender.
  Matsuoka, T. (2026) https://BioRender.com/f9cmhoe'
