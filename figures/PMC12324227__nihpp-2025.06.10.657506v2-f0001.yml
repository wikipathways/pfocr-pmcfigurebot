figure_title: Single-Cell transcriptomics workflow.
caption: Single-Cell transcriptomics workflow. This figure illustrates this study’s
  overall workflow for conducting single-cell transcriptomics (SCTr). The process
  begins with cell culture, followed by chemical treatments to induce cell stress
  responses. Cells are then prepared for single-cell analysis by fixation, dissociation,
  suspension, and pellet formation. The TempO-LINC assays are then used to generate
  the SCTr data. Finally, the data analysis stage involves identifying gene expression
  changes, clustering cells, and performing connectivity mapping to assess pathway
  activation in response to treatments, and identifying phenotypic clusters of cells
