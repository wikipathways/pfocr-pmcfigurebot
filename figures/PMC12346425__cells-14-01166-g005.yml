figure_title: Analyses of a subset of genes known to be regulators of the autophagy–lysosomal
  pathway showing raw mRNA read counts across four biological replicates.
caption: Analyses of a subset of genes known to be regulators of the autophagy–lysosomal
  pathway showing raw mRNA read counts across four biological replicates. (A) Following
  exposure to photoreceptor outers segments (POS), the transcription factor EB (TFEB)
  showed significant upregulation at 48 h compared to levels at 4 h. (B) At 24 h,
  homeostatic levels of the transcription factor binding to IGHM enhancer 3 (TFE3)
  were diminished compared to those at 4 h. This pattern was also recorded in RPE
  cells exposed to POS at identical timepoints. (C) At 24 and 48 h, levels of the
  melanocyte inducing transcription factor (MITF) were elevated compared to those
  at 4 h in RPE exposed to POS. (D) A similar pattern was also observed in the Rab-interacting
  lysosomal protein (RILP) at identical timepoints following POS exposure. However,
  upregulation of mRNA levels was also noted in RPE cells under homeostatic conditions
  between 48 vs. 4 h. RILP levels in POS-exposed RPE after 6 h were diminished compared
  to levels in controls at the same timepoint. (E) Levels of the transmembrane protein
  199 (TMEM199) were downregulated at 24 and 48 h compared to 4 h following POS exposure.
  (F) Levels of lysosomal cathepsin D (CTSD) were elevated at 24 and 48 h compared
  to 4 h following POS exposure. (G) Similarly, sequestosome 1 (SQSTM1) mRNA levels
  were also diminished at these timepoints as a function of POS. Statistical comparisons
  were made using a Wald test following a negative binomial generalised linear model,
  where significant differences are indicated as p ≤ 0.05 (*), p ≤ 0.01 (**), p ≤
  0.001 (***) and p ≤ 0.0001 (****). (H) A schematic diagram showing reported interactions
  between these genes
