figure_title: Roles of PDE8A and PDE8B in Various Systems
caption: |-
  The signaling pathways involving PDE8 across various biological systems. PDE8 interacts with Raf-1, leading to the upregulation of the downstream MEK and ERK signaling cascade, which ultimately enhances the function of cyclic AMP-responsive element-binding protein (CREB) in the nucleus. Concurrently, PDE8 associates with the R subunit of PKA (PKA-R), resulting in a decrease in cytosolic cAMP levels. This reduction allows the C subunit of PKA (PKA-C) to interact with CREB, thereby further amplifying the CREB signaling pathway. Together, these interactions contribute to the downregulation of steroidogenesis, promote tumor progression, and influence T-cell motility. Additionally, the scaffolding protein AKAP5/79 facilitates the recruitment of PDE8 to the endoplasmic reticulum-plasma membrane junction, where the pathway is initiated by SOCE through the action of STIM1 and ORAI1 channels. Raf-1: Raf-1 proto-oncogene, serine/threonine kinase; MEK: Mitogen-activated protein kinase kinase; ERK: Extracellular signal-regulated kinase; CREB: cyclic AMP-responsive element-binding protein; PKA-R subunit: PKA Regulatory subunit; PKA-C subunit: PKA Catalytic subunit; ER-PM Junction: junction of endoplasmic reticulum and plasma membrane.w STIM1: Stromal interaction molecule 1; ORAI1: Calcium release-activated calcium channel protein 1; SOCE: store-operated calcium entry. Created in BioRender. Xu, Y. (2026)
