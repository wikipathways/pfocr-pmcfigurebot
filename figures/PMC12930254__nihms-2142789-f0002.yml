figure_title: 'Genes regulated by CHK2-YBX1&YBX3 interaction: integration of RNA-seq
  and ChIP-seq data'
caption: (A) Volcano plot showing differentially expressed genes (upregulated and
  downregulated) in CHK2 knockout U87 cells. Upregulated genes are highlighted in
  the right half, and downregulated genes are in the left half. (B) Volcano plot showing
  differentially expressed genes in YBX1 knockout U87 cells. (C) Volcano plot showing
  differentially expressed genes in YBX3 knockout U87 cells. (D) Venn diagram illustrating
  the overlap of downregulated genes among CHK2, YBX1, and YBX3 knockout U87 cells,
  with the central green-labeled region indicating the 244 shared genes. (E) Venn
  diagram illustrating the overlap of upregulated genes among CHK2, YBX1, and YBX3
  knockout U87 cells, with 462 red color shared genes in the center. (F) KEGG pathway
  enrichment analysis of the 462 overlapping upregulated genes, visualized as a bar
  graph. The x-axis represents the −log10 (p-value), while the y-axis lists significantly
  enriched pathways. Darker green bars indicate more significant pathways. (G) Venn
  diagram showing ChIP-seq data from publicly available ENCODE datasets, illustrating
  2,606 genes that are co-bound by YBX1 and YBX3. (H) Venn diagram depicting the overlap
  between ChIP-seq peaks (YBX1&YBX3-bound regions) and genes upregulated in CHK2,
  YBX1, and YBX3 knockout cells. The 32 identified genes are likely direct transcriptional
  targets. (I) Heatmap showing the expression of 32 upregulated genes across CHK2,
  YBX1, and YBX3 knockout conditions. The color scale represents Z-score normalized
  expression, where red indicates upregulation and green indicates downregulation.
  Hierarchical clustering was applied to group genes with similar expression patterns
  across knockout conditions
