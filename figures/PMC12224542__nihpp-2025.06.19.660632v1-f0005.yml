figure_title: CPXV012 from cowpox virus inserts a C-terminal helix from the ER lumen
  into outward-facing TAP
caption: a. Molecular model of TAP(EQ) bound to CPXV012 (pink wire). ATP is shown
  as sticks and colored by heteroatom. b. Zoom-in of the TAP translocation pathway.
  TAP1 is shown as surface and CPXV012 is shown in ribbon. Residues identified in
  g are shown as sticks. c. Superposition of the structures of outward-facing TAP
  in the absence (grey) or presence (colored) of CPXV012. The conformational changes
  upon binding of CPXV012 are highlighted. d. Zoom-in of the interface between TAP
  and CPXV012 at the ER-luminal entrance of the TM cavity. e. Zoom-in of the interface
  near the N- and C-pockets. f. Interactions of CPXV012 with the TAP N- and C-pockets.
  The main chain of the last seven residues of CPXV012 are represented as sticks and
  numbered by their alpha carbons. g. Effect of single alanine substitutions in the
  ER luminal domain of CPXV012. Flow cytometry analysis of HEK293S cells expressing
  CPXV012 single alanine substitution variants coupled to YFP with an IRES element.
  Substitutions that are statistically significant are colored pink and shown in panel
  b. The red dotted line marks the relative cell surface MHC-I levels in the presence
  of WT CPXV012. Data represent the relative MHC-I cell surface levels normalized
  to the YFP only sample and represent three technical replicates of three biological
  replicates (n=9). Error bars represent the SEM. Statistical significance relative
  to treatment with wild-type CPXV012 IRES YFP was tested by one-way analysis of variance.
  ****P<0.0001; ***P(H53A)=0.005,*P(D66A)=0.0152. All other pairwise comparisons to
  the wild-type were not significant
