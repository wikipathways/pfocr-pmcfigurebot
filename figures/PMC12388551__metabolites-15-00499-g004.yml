figure_title: Flux distribution of metabolic reactions involved in cholesterol biosynthesis,
  investigated in female and male BALB/c mice under PFESA-BP2 exposure.
caption: Flux distribution of metabolic reactions involved in cholesterol biosynthesis,
  investigated in female and male BALB/c mice under PFESA-BP2 exposure. (A) Metabolic
  fluxes of selected reactions, identified by their BiGG (Biochemical, Genetic and
  Genomic knowledgebase) IDs (red colored). The pathway schematic diagram was acquired
  from WikiPathways (WP103) database [77]. Positive flux values represent the forward
  direction of the reaction, while negative values indicate the reverse direction.
  (B) Normalized and log10 transformed expression values of selective genes, including
  Hmgcr, Mvk, and Dhcr7, associated with reactions HMGCOAS, MEVK1, and DHCR27r, respectively.
  Statistical analyses were performed using unpaired two-tailed t-tests, using Ctrl
  group as the respective comparison reference. A p-value < 0.05 was considered statistically
  significant (* p < 0.05, ** p < 0.01, *** p < 0.005)
