figure_title: Abridged pathway of glucose fermentation by lactic acid-producing bacteria.
caption: 'Abridged pathway of glucose fermentation by lactic acid-producing bacteria.
  (A) Homofermentation; (B) mixed acid fermentation; (C) heterofermentation. Abbreviations:
  P = phosphate, BP = bisphosphate, PDH = pyruvate dehydrogenase, PFL = pyruvate formate
  lyase, LDH = lactate dehydrogenase. (With permission, A.O. Ojo and O. de Smidt [31],
  ©2023). Mixed acid fermentation can also produce succinic acid. Note the loss of
  carbon as CO2 in (B,C) from the carbon balance. All pathways are coupled with the
  formation of reducing power (NADH) and metabolic energy (ATP)'
