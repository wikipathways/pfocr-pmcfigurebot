figure_title: Proposed mechano-epigenetics pathway.
caption: Proposed mechano-epigenetics pathway. Energy-based devices (HIFU/RF) and
  biostimulators (PLLA) are hypothesized to function as physical epigenetic modulators.
  Mechanical tension generated within the extracellular matrix is transduced via integrins
  and the cytoskeleton to the nuclear YAP/TAZ complex. This translocation is thought
  to recruit chromatin–remodeling factors, potentially increasing chromatin accessibility
  to upregulate COL1A1 and ELN (elastin) mRNA synthesis, thereby supporting the restoration
  of youthful transcriptional fidelity [16,33,37]
