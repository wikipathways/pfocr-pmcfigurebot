figure_title: Heart transcriptomic profiling at 24 h after short-term ISO/OP reveals
  altered metabolic and muscle cell pathways in aged 17-month-old (17m) mice
caption: (A) PLS-DA showing clear separation of heart transcriptomes across groups.
  (B) Volcano plot of differentially expressed genes (DEGs) comparing 17m ISO/OP vs.
  17m Sham. (C-D) Enriched GO molecular processes (C) and KEGG pathways (D) for upregulated
  DEGs. (E-F) Enriched GO molecular processes (E) and KEGG pathways (F) for downregulated
  DEGs. Heatmaps of representative genes contributing to the top enriched GO term
  pathways (G, H). (I–J) Bar plots illustrating expression of selected DEGs linked
  to the top three enriched pathways in up- (I) and down- (J) regulated DEGs. n=3
  mice/group
