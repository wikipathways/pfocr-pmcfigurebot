figure_title: KLF4 and KLF5 promote basal and secretory cell fates downstream of the
  HIF pathway
caption: '(A) Venn diagram of HIF1α- and HIF2α-binding genes from targeted DamID-seq
  (false discovery rate [FDR] < 0.01) and hypoxia-activated genes from bulk RNA-seq
  (log2(fold change) > 0.5, padj < 0.05, DEGs of hypoxia + NTC vs. normoxia + NTC).
  Complete gene lists in Table S4.(B) Gene track views showing respective and averaged
  DamID signals from three biological replicates over KLF4 and KLF5 with consensus
  peaks labeled.(C–F) Immunostaining and quantification of 11 pcw human fetal lung
  sections showing KLF5, epithelium (Ecad), tip cells (SOX9), and differentiating
  basal cells (TP63) in distal regions (C and D) and airways (E and F). Quantification
  with lung sections from 3 donors. Statistical test: one-way ANOVA with Bonferroni’s
  multiple comparisons test. ****p < 0.0001.(G) Immunostaining of organoids with NTC,
  KLF4-KD (upper), or KLF5-KD (lower) by CRISPRi induction for 15 days. Representative
  images of 2 organoid lines for each gene.(H and I) RT-qPCR results of KLF4-KD (H)
  and KLF5-KD (I) compared with NTC in SRM under hypoxia for 15 days. Data shown as
  log2(fold change), n = 6 experimental replicates from 4 (KLF4) and 5 (KLF5) biological
  donors. 2 gRNAs used for each gene.(J and K) RT-qPCR results of KLF4-KD (J) and
  KLF5-KD (K) compared with NTC in AWDM under normoxia for 15 days. Data shown as
  log2(fold change), n = 4 (KLF4), 5 (KLF5) experimental replicates from 2 (KLF4)
  and 3 (KLF5) biological donors. 2 gRNAs used for each gene.(L) Proposed mechanisms
  underlying hypoxia-induced airway differentiation.Scale bars, 100 μm. RT-qPCR gene
  expression was normalized to ACTB. Statistical test: two-way ANOVA with Bonferroni’s
  multiple comparisons test.Significance levels: *p < 0.05, **p < 0.01, ***p < 0.001,
  ****p < 0.0001.See also Figure S6 and Table S4'
