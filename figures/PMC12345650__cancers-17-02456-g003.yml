figure_title: Therapeutic targeting of the Wnt/β-Catenin pathway in leukemia.
caption: 'Therapeutic targeting of the Wnt/β-Catenin pathway in leukemia. Graphical
  overview of pharmacological interventions targeting components of the canonical
  Wnt/β-catenin signaling pathway in acute leukemia. Therapeutic strategies include
  inhibition of Wnt ligand–Frizzled (FZD) receptor interactions, modulation of the
  β-catenin destruction complex, and blockade of β-catenin–TCF/LEF-mediated transcription.
  Several of these agents are under active preclinical or clinical investigation.
  APC: Adenomatous polyposis coli gene; AXIN: Axis inhibition protein; CBP: CREB binding
  protein; CK1: Casein kinase 1; DKK: Dickkopf-1; DVL: Disheveled; FZD: Frizzled;
  GSK3β: Glycogen synthase kinase 3β; LRP: Low density lipoprotein receptor-related
  protein; P300: E1A binding protein 300; PORCN: Porcupine; RSPO: R-spondin; TCF/LEF:
  T-cell factor/lymphoid enhancer factor'
