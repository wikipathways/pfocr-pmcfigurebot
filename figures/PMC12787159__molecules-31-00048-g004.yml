figure_title: Flavonoids interrupt the pathological feedback loop between hypertension
  and intestinal permeability.
caption: Flavonoids interrupt the pathological feedback loop between hypertension
  and intestinal permeability. Angiotensin (Ang) II—Ang II Type 1 Receptor (AT1R)
  signaling in vascular and intestinal epithelial cells promotes NADPH oxidase (NOX)-derived
  reactive oxygen species (ROS) generation and NF-κB-mediated inflammation which collectively
  reduce endothelial nitric oxide synthase (eNOS) activity and impair vasodilation.
  Concurrently, this pathway increases myosin light chain kinase (MLCK) activity and
  disrupts tight junction (TJ) structure by decreasing TJ protein expression and localization.
  Together, these processes contribute to endothelial dysfunction, vasoconstriction,
  and increased intestinal permeability. The resulting luminal antigen translocation
  triggers systemic inflammation and oxidative stress, further exacerbating vascular
  injury. Flavonoids counteract these effects by inhibiting NOX, NF-κB, and MLCK activity,
  enhancing eNOS function, and stabilizing TJ integrity, thereby restoring vascular
  and intestinal homeostasis. Up arrow indicate increase; blunt-ended arrow indicate
  inhibition. Created with BioRender.com
