figure_title: Senescence is associated with extensive loop remodeling linked to cell
  cycle arrest and inflammatory gene activation.
caption: Senescence is associated with extensive loop remodeling linked to cell cycle
  arrest and inflammatory gene activation. (A) Venn diagram showing the number of
  chromatin loops unique to proliferating cells, unique to replicatively senescent
  (RS) cells, and shared between conditions. (B) Gene Ontology (GO) enrichment analysis
  of downregulated genes located within RS-specific loops. (C) KEGG pathway enrichment
  analysis of downregulated genes within RS-specific loops, highlighting repression
  of proliferation-related programs. (D) GO enrichment analysis of upregulated genes
  located within RS-specific loops, including neuron-associated terms. (E) KEGG enrichment
  analysis of upregulated genes within RS-specific loops. (F) Overlap between senescence-associated
  secretory phenotype (SASP) genes and genes located within RS-specific loops. P-values
  for Venn diagrams were calculated using Fisher’s exact test
