caption: Mean ± SEM expression of components of the Hippo signaling pathway genes
  in oocytes matured in media containing FBS, with or without 1.5 mM L-carnitine.
  Expression levels of (A) MST1 (p = 0.6428), (B) MST2 (p = 0.6428), (C) LATS1 (p
  = 0.6428), (D) YAP (p = 0.0636), and (E) Tead-4 (p = 0.0636) in bovine oocytes measured
  by qPCR. Replicates = 3. Data was analyzed using a Mann–Whitney U test. p > 0.05,
  ns = not significant. n = 60–70 pooled oocytes per replicate per group, with a total
  of 180–210 pooled oocytes per group when replicates are combined
