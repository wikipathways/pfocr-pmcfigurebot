figure_title: RNA Pol II inhibition activates apoptosis prior to passive decay of
  apoptotic mRNA and protein
caption: '(A) Immunoblot of Rpb1 in U2OS following 1 or 0.1 μM triptolide (TRP). Blots
  representative of 3 biological replicates.(B) Quantification of (A).(C and D) Live/dead
  cell kinetics following 1 μM TRP in Nuc::mKate2-expressing U2OS cells. mKate+ =
  live; Sytox+ = dead. (C) U2OS. (D) U2OSBAX−/−/BAK1−/− (BAX/BAK DKO). Scale bar,
  100 μm.(E) Fractional viability (FV) following drugs ± pathway-specific inhibitors:
  z-VAD-FMK (z-VAD) inhibits apoptotic caspases; VX765 inhibits pyroptotic initiator,
  caspase-1; TTM inhibits cuproptosis (cupro); Rucaparib (Rucap.) inhibits parthanatos
  (parth); Nec-1 inhibits necroptosis (necro); and Fer-1 inhibits ferroptosis (ferro).
  RSL3, elesclomol (Eles.), MNNG, and TSZ are canonical activators of listed death
  pathways. M-157, MDA-MB-157. Heatmap scaled to the mean of 3 biological replicates.(F
  and G) Long-term response to 1 μM TRP. (F) Representative images from 3 biological
  replicates. Scale bar, 275 μm. (G) Lethal fraction (LF).(H) mRNA levels following
  1 μM TRP, relative to untreated cells. mRNA was quantified for times in which lethality
  had not yet occurred (4 h for WT; 10 days for DKO). Range for DKO represents 50
  longest/shortest half-life mRNAs. Dashed lines denote extrapolation from fit. For
  WT, the median, 25th, and 75th percentiles are shown.(I) (Top) Immunoblot of Rpb1
  in HAP1, or HAP1-RPB1-AID, following 500 μg/mL auxin (IAA, 3-indoleacetic acid).
  (Bottom) LF for HAP1-RPB1-AID cells +IAA, ±z-VAD. Data are mean ± SD of 9 biological
  replicates. For panels with error bars, data are mean ± SD of 3 biological replicates
  unless otherwise noted.See also Figures S1 and S2 and Tables S1 and S2'
