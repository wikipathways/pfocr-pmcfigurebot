figure_title: Predator-odor exposure altered host behavior, gene expression, and gut
  microbiota
caption: (A) Diagram shows experiment timeline and number of cages per treatment group.
  (B) Box plots show, for male (triangles) and female (squares) mice, time spent in
  the central area of open-field tests (OFT), time spent grooming in splash tests
  (SP), and social preference index in three-chamber tests (3CT). Differences between
  stressor groups and unstressed controls were tested using linear mixed-effects models
  (LMM) accounting for sex, litter, and cage effects (* = p < 0.05). Differences between
  stressor groups were assessed by pairwise comparisons of LMM marginal means (* =
  FDR-adjusted p < 0.05). In the 3CT plot, we tested whether the social preference
  index within each group significantly differed from zero with a one-sample Wilcoxon
  test (** = p < 0.01). Dashed gray lines indicate unstressed controls’ mean. (C)
  Volcano plots show log2-transformed fold change (LFC) in gene-expression level (points)
  in the visceral adipose tissue (VAT) of male and female mice in response to predator-odor
  exposure (left) or social isolation (right). Genes in the upper-outer quadrants
  were differentially expressed (DEGs; absolute LFC > 1 and FDR-adjusted p < 0.01).
  The total number of DEGs is presented at the top of each plot. (D) Bar plots show
  absolute LFC of genes belonging to the anti-microbial humoral response biological
  pathway, which was found to be significantly enriched in the up-regulated DEGs of
  mice exposed to predator odor (left) and social isolation (right). Genes are ordered
  and colored by the −log10(FDR-adjusted p) resulting from differential expression
  analyses. (E) Distance-based redundancy analysis (db-RDA) shows the first two axes
  of constrained ordination of the Bray-Curtis dissimilarity matrix of species genome
  bins (SGBs) composition at D30, accounting for sex and litter effects. Points represent
  the SGB profiles of pair (diamond) and single-housed (circle) mice, colored by whether
  they were exposed to H2O (blue) or TMT (yellow). Vectors indicate direction and
  relative strength of association between stressors and gut microbiome composition.
  The percent variation explained by each axis is enclosed in parentheses
article_title: The mouse gut microbiota responds to predator odor and predicts host
