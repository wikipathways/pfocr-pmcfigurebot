figure_title: Exploring the Neuroprotective Potential of Astragalus membranaceus in
  Central Nervous System Diseases
caption: A. membranaceus exerts anti-ferroptosis and anti-blood–brain barrier damage
  effects. (A) Inhibition of ferroptosis. A. membranaceus and its bioactive compounds,
  such as total flavonoids (TFA) and AS-IV, combat ferroptosis, an iron-dependent
  form of cell death. They upregulate the system Xc-transporter (comprising the SLC7A11
  subunit), which enhances cystine uptake and its reduction to cysteine for the synthesis
  of the key antioxidant glutathione (GSH). Concurrently, they activate the Nrf2 signaling
  pathway, which promotes the expression of glutathione peroxidase 4 (GPX4). GPX4
  utilizes GSH to reduce toxic lipid hydroperoxides (L-OOH) to non-toxic lipid alcohols
  (L-OH), thereby halting the lipid peroxidation chain reaction that drives ferroptosis.
  Additionally, modulation of iron metabolism (e.g., via Transferrin Receptor 1, TFR1)
  may contribute to reducing the intracellular pool of reactive Fe2+. (B) Protection
  of the Blood–Brain Barrier (BBB). A. membranaceus components preserve BBB integrity
  through several concerted actions. Astragalus polysaccharides (APS) inhibit the
  transcription factor ETS1, thereby blocking Endothelial-to-Mesenchymal Transition
  (EndoMT) and helping to stabilize tight junctions (TJ). Key active ingredients,
  such as AS-IV and Cycloastragenol (CAG), upregulate the expression of tight junction
  proteins, including Zonula Occludens-1 (ZO-1), occludin, and Claudin-5, which seal
  the paracellular space. Furthermore, they protect the BBB by inhibiting the expression
  and activity of matrix metalloproteinase-9 (MMP-9) and Aquaporin-4 (AQP4), which
  are involved in basement membrane degradation and edema formation, respectively
  [103]. They also favorably modulate transporters by upregulating P-glycoprotein
  (P-gp) for efflux and downregulating the Receptor for Advanced Glycation End-products
  (RAGE) for reduced influx. This figure is original and was created by the authors
  for this publication
