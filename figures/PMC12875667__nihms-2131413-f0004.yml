figure_title: Whole-cell biosynthesis of tagatose
caption: |-
  (A and B) Expression of DdGal1Pase and
  BcLAI from plasmid (indicated with + or −) in four
  different E. coli strain backgrounds fed (A)
  30 g/L galactose or (B) 30 g/L glucose. The ΔgalKM
  modification improves conversion of galactose to tagatose and reduces galactose
  consumption by native metabolism. Reversal of the Leloir pathway is enabled by
  pgi deletion and PGM overexpression combined with the
  Gal1P-specific DdGal1Pase.(C) The Leloir pathway reversal is dependent on DdGal1Pase expression
  level modulated by changing RBS strength, highlighting its key role in the
  pathway.(D) Complementation to assess the limitation of various genes in a fully
  integrated tagatose production strain with a pgi deletion and
  chromosomal overexpression of pgm, BcLAI, and
  DdGal1Pase. Only DdGal1Pase overexpression significantly
  improves mean tagatose production.Error bars represent means ± SD; n = 3; all
  p values represent two-tailed t tests
article_title: |-
  Reversal of the Leloir pathway to promote galactose and tagatose
  synthesis from glucose
