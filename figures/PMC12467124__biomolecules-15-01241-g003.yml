caption: Pseudotime trajectories analysis of tumor-infiltrating CD4+ T cells in ovarian
  cancer. (A) Trajectory of CD4+ T cell differentiation classified by cell subpopulation.
  (B) Trajectory of CD4+ T cells classified by pseudotime. (C) Trajectory of CD4+
  T cells classified by cell state. (D) Three cell states of CD4+ T cells. (E) The
  UMAP dimensionality reduction graph of the distinct clusters, which were annotated
  by cellular function. (F) Trajectory of CD4+ T cells classified by clusters, which
  were annotated by cellular function. (G) Changes in expression levels of selected
  genes during cell differentiation in different classifications. (H) Heatmap of corresponding
  genes and pathways in pseudotime trajectories analysis
