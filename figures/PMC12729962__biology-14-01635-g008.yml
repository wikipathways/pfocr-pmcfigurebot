caption: (A) The content of SA in the SlCSN5-3 silenced tomatoes under gray mold disease
  stress. (B) The content of JA in the SlCSN5-3 silenced tomatoes under gray mold
  disease stress. (C) The expression of SA pathway core transcription factor SlNPR1
  in the SlCSN5-3 silenced tomatoes under gray mold disease stress. (D) The expression
  of SA pathway key disease-resistance gene SlPR1 in the SlCSN5-3 silenced tomatoes
  under gray mold disease stress. (E) The expression of SA pathway key disease-resistance
  gene SlPR2 in the SlCSN5-3 silenced tomatoes under gray mold disease stress. (F)
  The expression of JA pathway core transcription factor SlMYC2 in the SlCSN5-3 silenced
  tomatoes under gray mold disease stress. (G) The expression of JA pathway key disease-resistance
  gene SlPDF1.2 in the SlCSN5-3 silenced tomatoes under gray mold disease stress.
  Error lines represent the standard error of the mean of the data from triplicate
  experiments (n = 3). Capital letters represent the significance of the same plant
  at different times, according to Fisher’s LSD test at the 5% level of probability,
  and lowercase letters represent the significance of different plants at the same
  time, according to Fisher’s LSD test at the 5% level of probability
