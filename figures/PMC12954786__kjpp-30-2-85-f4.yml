figure_title: SMK-002 promoted endocytosis and ubiquitination of EGFR
caption: via lysosomal pathway. (A) SMK-002 significantly promoted the internalization
  and degradation of EGFR. T24 cells were treated with SMK-002 (4 μM) for different
  times (0, 6, 8 h). The left is a representative graph, and the right is a statistical
  graph. Scale bar, 200 μM. (B) SMK-002 had no significant effect on EGFR mRNA level.
  T24 or J82 cells were treated with SMK-002. The EGFR mRNA level was detected by
  qRT-PCR. (C) SMK-002 promoted the ubiquitination degradation of EGFR. T24 or J82
  cells were treated with SMK-002 followed by lysis, EGFR immunoprecipitation (IP),
  SDS-PAGE, and immunoblotting (IB) for Ubiquitin (Ub) and EGFR. (D) SMK-002 did not
  inhibit synthesis of protein EGFR. T24 or J82 cells were pretreated with CHX, and
  then cells were treated with SMK-002. The EGFR expression at each time point was
  detected by Western blot. (E) CQ significantly weakened the downregulation effect
  of SMK-002 on EGFR and its downstream pathway. T24 and J82 cells were pretreated
  with CQ (5 μM) or MG132 (1 μM) for 5 h to destroy their lysosomes or proteasomes,
  and then cells were treated with SMK-002 for 24 h. To detect EGFR and its downstream
  signaling pathways, Western blot was used. The data presented here represent the
  results of three independent experiments. The columns represent the mean ± SD of
  triplicate experiments. The abbreviation “Ctrl” represents a DMSO concentration
  of less than 0.3%. EGFR, epidermal growth factor receptor. *p < 0.05, **p < 0.01,
  ***p < 0.001. Not significant (ns) is indicated by “ns”
