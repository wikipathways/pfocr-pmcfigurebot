figure_title: Enzalutamide-resistant and NEPC cells exhibit impaired IL-6 signaling
  pathways.
caption: 'Enzalutamide-resistant and NEPC cells exhibit impaired IL-6 signaling pathways.
  (A) Immunoblot analysis of p-STAT1, total STAT1, p-STAT3, total STAT3, and GAPDH
  in parental C4-2B and enzalutamide-resistant C4-2B MDVR cells following IFNγ stimulation
  (20 ng/mL, 0–60 min). (B) Cytoplasmic and nuclear fractionation shows impaired nuclear
  translocation of p-STAT1 and p-STAT3 in C4-2B MDVR compared to C4-2B after IFNγ
  stimulation (20 ng/mL, 30 min). (C) Immunoblot analysis of p-STAT1, total STAT1,
  p-STAT3, total STAT3, and GAPDH in C4-2B, C4-2B MDVR, CWR22Rv1, and NEPC cell line
  H660 following IFNγ treatment (20 ng/mL, 30 min). (D) Immunoblot analysis of STAT1/3
  phosphorylation following IL6 treatment (10 ng/mL, 30 min) in the indicated cell
  lines. (E) Luciferase reporter assay showing reduced p-STAT3 transcriptional activity
  in resistant and NEPC cells upon IL6 (10 ng/mL, 48 h) or IFNγ stimulation (20 ng/mL,
  48 h). (F) RT-qPCR analysis of downstream STAT1/3 target genes (IRF1, CXCL11, SOCS1,
  SOCS3) following IL6 (10 ng/mL, 48 h) or IFNγ stimulation (20 ng/mL, 48 h) in the
  indicated cell lines. Data are shown as mean ± SEM from three biological replicates.
  * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001; ns: not significant'
