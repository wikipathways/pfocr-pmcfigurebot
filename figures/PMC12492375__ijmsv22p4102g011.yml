figure_title: ORMDL2-mediated immune-metabolic stress in glioblastoma.
caption: ORMDL2-mediated immune-metabolic stress in glioblastoma. Bioinformatics analysis
  suggests that ORMDL2 may participate in the regulation of ER stress responses, including
  the UPR including PERK, ATF4, CHOP signaling. This dysregulation is potentially
  linked to impaired mitochondrial function, redox imbalance, and increased reactive
  oxygen species (ROS), which in turn are associated with DNA damage and apoptotic
  signaling. Furthermore, altered ORMDL2 expression may influence MHC-I antigen presentation
  pathways, thereby modulating immune recognition. The release of damage-associated
  molecular patterns (DAMPs) under stress conditions could engage TLR2/4-related immune
  signaling. Collectively, these observations suggest that ORMDL2 may serve as a regulatory
  node connecting metabolic stress and immune evasion in glioblastoma
article_title: Targeting ORMDL2 in glioblastoma through integrated landscape of high-throughput
