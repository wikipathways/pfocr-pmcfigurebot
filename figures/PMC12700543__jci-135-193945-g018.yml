figure_title: RT-MPs upregulate Ccl20 expression in macrophages through cGAS-STING/NF-κB
  pathway activation
caption: (A) Relative mRNA expression of Ccl20 in BMDMs after 10 Gy irradiation for
  24 hours. (B) Relative mRNA expression of Ccl20 in BMDMs treated with conditioned
  medium (CM) from control or irradiated tumor cells. (C) Relative mRNA expression
  of Ccl20 in BMDMs treated with RT-MPs or irradiated tumor cell–derived CM depleted
  of RT-MPs. (D) Left panel, pattern diagram of transwell migration assay. Right panel,
  flow cytometry analysis of γδ T cell migration to the lower chamber in corresponding
  treatment conditions. (E) GO enrichment analysis of differentially expressed genes
  in LLC subcutaneous tumors from WT RT and WT Ctrl mice. (F) Quantitative measurement
  of dsDNA content in RT-MPs and Ctrl-MPs. (G) Relative mRNA expression of Ccl20 in
  BMDMs treated with RT-MPs or dsDNA-depleted RT-MPs. (H) Representative Western blot
  images showing protein expression levels of cGAS, STING, TBK1, and p-TBK1 in BMDMs.
  (I) Relative mRNA expression of Ccl20 in BMDMs treated with RT-MPs or the STING
  inhibitor C176. (J) Flow cytometry analysis of γδ T cell proportions in the TME
  of LLC subcutaneous tumors in corresponding groups (n = 6 per group). (K) Representative
  Western blot images showing protein expression levels of P65 and p-P65 in BMDMs.
  (L) Relative mRNA expression of Ccl20 in BMDMs treated with RT-MPs or the NF-κB
  pathway inhibitor TPCA1. (M and N) ChIP assay of P65 in RT-MP–treated BMDMs. Representative
  gel electrophoresis results are shown in M. P65 binding to the Ccl20 promoter region
  is quantified by qPCR, with results expressed as fold enrichment in site-specific
  occupancy relative to the control (N). *P < 0.05; **P < 0.01; ***P < 0.001. Unpaired
  2-tailed Student’s t test (A, B, F, and N), 1-way ANOVA with Tukey’s multiple comparisons
  test (C, D, G, I, J, and L)
