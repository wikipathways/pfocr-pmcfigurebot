figure_title: Flux of methyl groups of folate and choline.
caption: Flux of methyl groups of folate and choline. Coordination between the betaine
  homocysteine methyl transferase (BHMT) and folate pathways (methionine synthase,
  MS) ensures balanced methylation. The relative contribution of the BHMT pathway
  versus the folate pathway to the methylation balance may vary according to the marker
  used to capture cellular methylation. The BHMT pathway provides 50% of the methionine
  or SAM [4] and is a major contributor to removing homocysteine after a methionine
  load [5,6]. A choline-deficient diet lowers liver folate by 31–40% [7,8]. Folate
  deficiency causes 37% lower methylation of homocysteine to methionine (thus elevated
  fasting homocysteine) [9], but has a limited effect on post-methionine hyperhomocysteinemia
  [5,9]. CHDH, choline dehydrogenase; MTHFR, methylenetetrahydrofolate reductase;
  PEMT, phosphatidylethanolamine methyl transferase
