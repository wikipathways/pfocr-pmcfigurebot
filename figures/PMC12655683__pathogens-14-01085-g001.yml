figure_title: Bacterial resistance mechanisms.
caption: Bacterial resistance mechanisms. (A) Bacteria containing antibiotic resistance
  genes are incapable of producing the drug targets for antibiotics, preventing the
  antibiotics from binding and exerting their effects (intrinsic resistance). Resistance
  genes can also encode enzymes that hydrolyze antibiotics, rendering them inactive.
  (B) Genetic mutations can alter the drug targets in bacteria, preventing antibiotics
  from binding to the targets as usual. Alternatively, they can change the number
  or function of porins, reducing the permeability of the cell membrane and thereby
  decreasing drug penetration. (C) Through genetic regulatory systems, drug efflux
  pumps can be activated to lower the concentration of drugs within the cell. Additionally,
  target-protecting proteins can be produced to prevent the binding of targets to
  drugs. (D) Resistance genes can be disseminated to susceptible bacteria via genetic
  vectors such as plasmids and bacteriophages, conferring resistance upon them. In
  addition, adaptive resistance includes the formation of biofilms, changes in metabolic
  pathways and nutritional deficiencies, and alterations in cell morphology. Nutritional
  deficient bacteria are unable to synthesize folic acid on their own and must acquire
  it from the external environment, thereby inhibiting the action pathway of sulfonamide
  antibiotics and promoting bacterial growth. PABA, p-aminobenzoic acid. This figure
  was created by BioGDP.com [17]
