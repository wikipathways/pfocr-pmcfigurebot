figure_title: Aucubin attenuates H2O2-induced oxidative damage and inflammation in
  rat tenocytes, mechanisms involving the estrogen receptor pathway.
caption: 'Aucubin attenuates H2O2-induced oxidative damage and inflammation in rat
  tenocytes, mechanisms involving the estrogen receptor pathway. (A) Viability of
  tenocytes after treatment (n = 6). (B) Representative flow cytometry plots of apoptosis.
  (C) Quantitative analysis of apoptotic rates (n = 3). (D) Representative micrographs
  of intracellular ROS levels detected by DCFH-DA staining. Scale bars: 100 μm. (E)
  Quantitative analysis of ROS fluorescence intensity (n = 3). (F–I) Effects of AU
  on (F) malondialdehyde (MDA) content, (G) superoxide dismutase (SOD) activity, (H)
  IL-1β, and (I) TNF-α levels (n = 3). Notably, the protective effects of AU on most
  parameters were mimicked by the estrogen agonist 17β-estradiol (E2) and antagonized
  by the estrogen receptor antagonist (R, R)-THC. Data are presented as mean ± SD.
  * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
