figure_title: K21 Induces Mitophagy And Lifespan Extension In C. elegans
caption: '(a,b) Dual channel image of intestinal MitoKeima fluorescence combining
  emission from 470 nm excitation (non-mitophagic mitochondria, green) and 555 nm
  excitation (mitophagic mitochondria, red) in (a) vehicle-treated or (b) K21-treated
  L4 nematodes. Arrowheads point to example mitochondria undergoing mitophagy. Bar,
  5 microns. (c) Ratio of fluorescence from excitation of 555 nm relative to that
  at 470 nm for individual mitochondria from 5 vehicle-treated versus 5 K21-treated
  animals. ****P<0.0001, t-test. Mean indicated by red bar. (d) Kaplan-Meier survival
  curves for vehicle-treated (black circles) or K21-treated (red squares) animals,
  pooled from three independent trials (n=128 and 151 animals, respectively). P<0.0001,
  Mantel-Cox log-rank. (e) WormCat category enrichment for either all DEGs induced
  by K21 or DEGs either up- or down-regulated by K21 vs vehicle, as indicated by the
  column headers. Circle size and shading represent number of genes identified in
  the category and the p-value for that category (adjusted for multiple comparisons),
  respectively, as per the legend. (f) Violin plots of mRNA expression levels (as
  log2 fold change) for individual genes for K21-treated versus vehicle-treated nematodes,
  separated into significantly (FDR<0.01) upregulated genes (gold), downregulated
  genes (blue), genes showing no significant differential regulation (gray), and all
  detectable genes combined (green). Other columns show the distribution of expression
  values within the RNA-seq for genes upregulated within the indicated stress response
  pathway gene set. Red solid line indicates the mean. (g) Venn diagram showing overlap
  between differentially expressed genes for K21 versus vehicle treatment from macrophage
  scRNA-seq (cyan), monocyte scRNA-seq (magenta), and C. elegans RNA-seq (yellow).
  Only genes showing orthology between humans and C. elegans, as well as differential
  expression in one or more datasets, are shown. (h) Hierarchically clustered heat
  map of log2 fold changes in mRNA levels from K21 versus vehicle-treated samples
  (as labeled in the columns) for only orthologous genes, and only for those showing
  differential expression in all three samples: macrophages, monocytes, and C. elegans'
