figure_title: Effects of tissue inhibitor of metalloproteinases-1 (TIMP-1) on cell
  migration and signaling pathway activation.
caption: 'Effects of tissue inhibitor of metalloproteinases-1 (TIMP-1) on cell migration
  and signaling pathway activation. (A) Representative images of wound healing assays
  with recombinant human TIMP-1 (rhTIMP-1) at the indicated concentrations (0, 1,
  10, and 100 ng/ml). Quantification of relative wound closure (%) is shown in the
  lower panel. ***P < 0.001 vs. rhTIMP-1 (0 ng/ml); ##P < 0.01, ###P < 0.001 vs. rhTIMP-1
  (1 ng/ml); $P < 0.05, $P < 0.05 vs. rhTIMP-1 (10 ng/ml). (B) Representative images
  of wound healing assays for cells treated with adult human neural stem cells-conditioned
  medium (ahNSC-CM) in the presence of control IgG or anti-TIMP-1 antibody (α-TIMP-1).
  Quantification of relative wound closure (%) is shown in the lower panel. ***P <
  0.001 vs. NC; ##P < 0.01 vs. ahNSC-CM; $$P < 0.01 vs. ahNSC-CM ＋ IgG group. (C)
  Western blot analysis of phosphorylated and total extracellular signal-regulated
  kinase (ERK1/2) and protein kinase B (Akt) in the indicated treatment groups. β-Actin
  was used as a loading control. (D) Densitometric analysis of p-ERK1/2 and p-Akt
  levels normalized to β-actin. All data are presented as mean ± standard deviation
  (SD) from three independent experiments (n = 3). ***P < 0.001'
