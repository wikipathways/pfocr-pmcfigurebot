figure_title: RNA-seq and ATAC-seq in neurons reveal conserved effects of MAPT V337M
  knockdown on axonogenesis pathways
caption: (A) iPSCs from a healthy donor (WTC11, here called MAPT WT) or a patient
  with the heterozygous MAPT V337M mutation (GIH6C1, here called *MAPT Het) were edited
  with Cas9 previously to generate a heterozygous MAPT V337M clone (MAPT Het), a homozygous
  MAPT V337M clone (MAPT Hom) and a healthy isogenic control (GIH6C1∆1E11, here called
  *MAPT WT). These cells were engineered to express dox-inducible mNGN2 in AAVS1 and
  CRISPRi machinery in CLYBL. We transduce the iPSCs with lentivirus for sgRNA/BFP
  expression. (B) Heatmap comparing changes in gene expression based on RNA-seq in
  MAPT Het NTC and MAPT WT MAPT KD vs. MAPT WT NTC at 2 and 4 weeks post differentiation.
  Three independent wells of neurons for each genotype/sgRNA combination were harvested
  at each timepoint. (C) Gene Ontology (GO) term enrichment analysis of the RNA-seq
  experiment in (B). Genes that are differentially expressed in both MAPT Het and
  MAPT WT MAPT KD vs. MAPT WT NTC were analyzed with Enrichr, and top terms with minimal
  overlap were plotted. Pathways related to axonogenesis and neuron morphology are
  colored magenta. (D) Heatmap summarizing ATAC-seq differential peaks at 4 weeks
  of differentiation. Two independent wells of neurons for each genotype/sgRNA combination
  were harvested. (E) Heatmap summarizing ATAC-seq transcription factor motif analysis
  at 4 weeks of differentiation from the same experiment in (D). Clusters were analyzed
  for pathway enrichment using Enrichr, and major pathways are annotated (“AP-1 Transcription
  Factor Network” and “Neuron Differentiation”). (F) Western blot measuring p-cJun
  and cJun levels in neurons at 1 week of differentiation. Two independent wells of
  neurons for each genotype/sgRNA combination were harvested. (G-H) Quantification
  of cJun (G) and p-cJun (H) from the western blot in (F). Significance was calculated
  using one-way ANOVA with Dunnett’s multiple comparison test, and comparisons were
  restricted within the donor background
article_title: Multi-omic phenotyping of iPSC-derived neurons harboring the MAPT V337M
  mutation reveals tau hypophosphorylation and perturbed axon morphology pathways
