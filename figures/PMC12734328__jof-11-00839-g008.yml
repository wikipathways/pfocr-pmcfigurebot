caption: GO enrichment analysis and illustration of over-represented metabolic pathways
  of DEGs collected from WT and ∆BbMpk1 strains treated with menadione stress as compared
  to non-stress conditions. Go term enrichment of DEGs in ∆BbMpk1 as compared to the
  WT parent under 12 h (A) or 30 min (B) of osmotic stress when normalized to non-stress
  conditions. (C) Expression profile of DEGs in the cell-cycle process under 30 min
  of MND-generated oxidative stress (gene tagged as yeast homolog). (D–F) Comparative
  expression of DEGs in glyoxylate and dicarboxylate metabolism (D), Amino sugar and
  nucleotide sugar metabolism (E), Galactose metabolism (F) under 12 h oxidative stress
  treatment when compared to non-stress conditions. Annotations of expression and
  gene IDs are the same as in Figure 6
