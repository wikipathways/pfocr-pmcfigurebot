figure_title: Proposed mechanism of PIC-LNP–mediated protection against MTX-induced
  renal injury.
caption: Proposed mechanism of PIC-LNP–mediated protection against MTX-induced renal
  injury. MTX administration triggers excessive ROS/RNS generation, GSH depletion,
  and suppression of Nrf2/HO-1 signaling, leading to TLR4 activation, NF-κB and MAPK
  (p38, JNK, ERK) stimulation, upregulation of pro-inflammatory cytokines and iNOS,
  and activation of the intrinsic mitochondrial apoptotic pathway (↑ Bax, ↑ caspase-3,
  ↓ Bcl-2), culminating in tubular damage and renal dysfunction. PIC-LNPs enhance
  Nrf2/HO-1-dependent antioxidant defenses, restore redox homeostasis, and concurrently
  suppress TLR4/NF-κB and MAPK signaling, thereby reducing cytokine and iNOS production,
  limiting mitochondrial apoptosis, and preserving renal structure/function
article_title: Liposomal Piceatannol Mitigates Methotrexate-Induced Oxidative Renal
  Injury via Modulation of Nrf2/HO-1, TLR4/NF-κB, MAPK, and Apoptotic Pathways in
  Rats
