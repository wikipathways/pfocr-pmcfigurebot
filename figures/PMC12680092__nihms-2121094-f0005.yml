figure_title: The Design-Build-Test-Learn (DBTL) cycle is applied to organize campaigns
  to engineer microorganisms to biosynthesize terpenoids.
caption: The Design-Build-Test-Learn (DBTL) cycle is applied to organize campaigns
  to engineer microorganisms to biosynthesize terpenoids. A roadmap has been established
  to identify sets of enzymes that can be utilized in microorganisms to produce terpenoid
  natural/new-to-nature products (‘Design’). These target enzymes can be rapidly implemented
  into genetic constructs and engineered microorganism strains via automated software
  and robotics (‘Build’). Generated resources (e.g. genes, strains, protocols, etc.),
  are valuable that can be shared with the broader scientific community. After cultivation,
  the metabolites in engineered strains are characterized, isolated, and, if applicable,
  assayed against potential targets (‘Test’). This approach provides valuable and
  multiplexed data (e.g. chromatographic characteristics, binding affinities, mass
  spectra, NMR spectra, -omics data, etc.) that can be deposited into public databases.
  These data are evaluated to determine flux in the engineered pathway(s) and if the
  characterized terpenoid natural/new-to-nature products exhibit valuable bioactivity
  (‘Learn’). The DBTL cycle can be repeated until a target therapeutic terpenoid is
  produced in a microorganism at a sufficient titer, rate, and yield
