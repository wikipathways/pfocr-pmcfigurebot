figure_title: Changes in NRF2 expression and localization after cisplatin treatment
  in vivo and in vitro.
caption: Changes in NRF2 expression and localization after cisplatin treatment in
  vivo and in vitro. (A) Bubble plot of KEGG pathway analysis for differentially expressed
  genes. (B) GO enrichment analysis of differentially expressed genes, with green
  representing biological process (BP), orange representing cellular component (CC),
  and purple representing molecular function (MF). (C) Venn diagram showing the overlap
  between differentially expressed genes and NRF2 downstream target genes. (D–I) Relative
  expression levels of NRF2 downstream genes Nqo1, Sod3, Gclc, Txnrd1, Ppargc1a, and
  Hsp90aa1 from RNA sequencing data. n = 4. Data are presented as means ± SEM. **
  p < 0.01 and *** p < 0.001 vs. CTRL. (J) Representative Western blot showing total
  and nuclear NRF2 protein levels in the kidneys of Cis-AKI mice at early time points
  (1, 3, 6, and 12 h) after cisplatin treatment. (K,L) Quantification of nuclear (n
  = 4) and total (n = 3) NRF2 protein levels in the kidneys of Cis-AKI mice at early
  time points after cisplatin treatment. (M) Immunofluorescence images of NRF2 (red)
  in HK-2 cells treated with cisplatin for different durations. Nuclei are stained
  with DAPI (blue), scale bar = 100 µm. Data are presented as means ± SEM. * p < 0.05,
  ** p < 0.01, and *** p < 0.001 vs. hour 0
