figure_title: Inhibition of TREM-1 and cGAS-STING pathways reduces mtDAMP-induced
  injuries in vitro.
caption: Inhibition of TREM-1 and cGAS-STING pathways reduces mtDAMP-induced injuries
  in vitro. (A) ECIS cell proliferation assay profile plots. MM14.Lu cells (2 × 103)
  and AMJ2-C8 cells (0.2 × 103) were seeded in each well. Signals were recorded in
  real-time at 4000 Hz. (B) mtDAMPs decreased cell proliferation; targeting TREM-1
  and cGAS-STING ameliorates mtDAMP-impaired cell proliferation at 24 h, 48 h (C),
  and 72 h (D). (E) Targeting TREM-1 and cGAS-STING ameliorates mtDAMP-impaired cell
  migration. MM14.Lu cells (4 × 104) and AMJ2-C8 cells (0.4 × 104) were seeded in
  each well, and the cell monolayers were wounded using an elevated field pulse of
  3000 μA at 80,000 Hz applied for 20 sec. Resistance was measured at 4000 Hz. (F)
  ECIS cell cytotoxicity assay profile plots. MM14.Lu cells (6 × 103) and AMJ2-C8
  cells (0.6 × 103) were seeded in each well. (G) Cells treated with TREM-1 and cGAS
  inhibitors in combination were better protected against mtDAMP-induced cell toxicity
  during the first 6 h, 24 h (H), and 48 h (I); signals were recorded in real-time
  at 4000 Hz. (J) Cytotoxicity observed in cells treated with mtDAMPs, as characterized
  by fewer bronchus cells and severe damage to the confluent cell layer; treatment
  with TREM-1 and/or cGAS inhibitors preserved the bronchus cell layer. Data were
  statistically analyzed using GraphPad Prism with one-way ANOVA followed by Tukey’s
  multiple-comparison test. *** denotes p < 0.0002, **** represents p < 0.0001
