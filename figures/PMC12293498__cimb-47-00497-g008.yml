figure_title: DMRTA2 inhibits the p53 malignant phenotype of wild-type lung cancer
  cells by regulating the p53 pathway.
caption: 'DMRTA2 inhibits the p53 malignant phenotype of wild-type lung cancer cells
  by regulating the p53 pathway. (A) Effects of the overexpression of DMRTA2 on p53
  and p21 proteins after p53 knockdown by Western blot analysis. (B) Colony formation
  experiment was conducted to detect the effect of the overexpression of DMRTA2 on
  cell clonogenesis after p53 knockdown. (C) The effect of the overexpression of DMRTA2
  on cell proliferation after the p53 knockdown was detected by MTS assay. (D) Effect
  of the overexpression of DMRTA2 on cell invasion ability after p53 knockout. p <
  0.05 was statistically significant; * p < 0.05, ** p < 0.01, and *** p < 0.001,
  ns means not significant. scale bar: 50 μm'
article_title: The Interaction of DMRTA2 with HSP90β Inhibits p53 Ubiquitination and
