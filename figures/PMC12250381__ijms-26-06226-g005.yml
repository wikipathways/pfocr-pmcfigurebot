figure_title: MSMs analysis of EGFR variants.
caption: MSMs analysis of EGFR variants. (a–d) show the macrostate transition networks
  and representative structures for WT (a), T790M (b), L858R (c), and T790M_L858R
  (d). Each colored node represents one of the four macrostates (S1–S4), annotated
  with its equilibrium population. Representative conformations are shown adjacent
  to each state node. Arrows indicate the mean first passage time (MFPT, in nanoseconds)
  between states, reflecting the kinetic accessibility of interconversion pathways.
  The asymmetry of transition times reveals directional preferences in conformational
  transitions. WT-EGFR exhibits a kinetically isolated S4 state, while mutants display
  enhanced interconversion among active-like states
