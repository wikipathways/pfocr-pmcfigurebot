caption: Organization of the ophiobolin biosynthetic gene cluster in Bipolaris species.
  The schematic illustrates the genomic arrangement of four key ophiobolin biosynthetic
  genes (oblA, oblB, oblC, and oblD) across representative Bipolaris isolates. Each
  gene is shown as a colored arrow indicating its coding orientation. Flanking and
  intervening genes not assigned to the core biosynthetic pathway are represented
  in gray. Black bars denote repetitive elements located within or adjacent to the
  gene cluster regions. These repetitive sequences are composed of complex repeat
  structures, including both known and simple repeats, although only the known repeat
  classes are visualized. Repeat orientation is omitted for clarity
