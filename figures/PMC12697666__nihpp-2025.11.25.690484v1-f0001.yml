figure_title: Uptake of PR20 is mediated by a pathway that shares features with macropinocytosis.
caption: Uptake of PR20 is mediated by a pathway that shares features with macropinocytosis.
  (A) Western blot detection of HA-PR20 uptake over 15 minutes in HeLa cells. Membrane
  (+) fractions are membrane bound + internalized PR; (–) fractions are solely internalized
  peptide. GAPDH, loading control. (B) Representative ICC of HA-PR20 colocalization
  with fibrillarin, a nucleolar marker, after 30-minutes of bath application. Scale
  bar, 20μm. Blue = Hoescht, green = fibrillarin, red = HA. (C) Representative ICC
  of HA-PR20 bath application at room temperature or on ice. Scale bar, 20μm. Blue
  = Hoescht, Red = HA. (D) Representative western blot of internalized HA-PR20 after
  bath application at room temperature or on ice. GAPDH, loading control. (E) Quantification
  of (C). Unpaired t test, two-tailed, n=3 biological replicates, ****p<0.0001. (F)
  Quantification of (E). Unpaired t test, two-tailed, n=3 biological replicates, **p<0.01
  (G) Quantification of internalized HA-PR20 in neurons pretreated with endocytosis
  inhibitors (chlorpromazine (CPZ), clathrin-mediated endocytosis inhibitor; 5-(N-ethyl-N-isopropyl)amiloride
  (EIPA), macropinocytosis inhibitor; and dynamin inhibitor Dynole 34–2 (inactive
  isomer Dynole 31–2)) for 1 hour before a 1-hour bath application with HA-PR20. One
  way ANOVA with Tukey’s post hoc test, F (5,728) = 18.02, n=3 biological replicates,
  ****p<0.0001. (H) Representative western blot showing p21-activated kinase 1 (PAK1)
  knockdown in HeLa cells. GAPDH, loading control. (I) Quantification of nuclear HA-PR20
  after PAK1 KD in HeLa cells. Unpaired t test, two-tailed, n=3 biological replicates,
  ****p<0.0001. (J) Representative western blot of clathrin heavy chain (CHC) knockdown
  in HeLa cells. GAPDH, loading control. (K) Quantification of nuclear HA-PR20 after
  CHC KD in HeLa cells. Unpaired t test, two-tailed, n=3 biological replicates, ns.
  (L) Representative western blot of dynamin 2 (DNM2) knockdown in HeLa cells. GAPDH,
  loading control. (M) Quantification of nuclear HA-PR20 after DNM2 KD in HeLa cells.
  Unpaired t test, two-tailed, n=3 biological replicates, ****p<0.0001. (N) Quantification
  of ICC of 30-minute bath application of HeLa with HA-PR20 composed of either D-amino
  acids or L-amino acids. Unpaired t test, two-tailed, n=3 biological replicates,
  ns
