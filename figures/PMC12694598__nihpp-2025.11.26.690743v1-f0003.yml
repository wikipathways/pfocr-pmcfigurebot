caption: Pathway analysis - Pathway enrichment analysis of differentially expressed
  proteins between normal and abnormal endothelial function groups with unadjusted
  p value < 0.005. The bar plot shows significantly enriched pathways according to
  KEGG, Gene Ontology (GO) Molecular Function, Reactome, and Jensen Diseases Curated
  databases. The x-axis represents the −log10 (adjusted p value) for each pathway,
  with a higher value indicating stronger enrichment. Top pathways include drug metabolism
  and xenobiotic metabolism (KEGG), glutathione transferase activity (GO), biological
  oxidations (Reactome), and inherited or metabolic diseases (Jensen Diseases). The
  black dashed line denotes the adjusted p-value threshold of 0.05 for statistical
  significance
