figure_title: CEMa system overview, cell line selection, and viability assays.
caption: 'CEMa system overview, cell line selection, and viability assays.(A) Schematic
  overview of the CEMa system and targeting location on the TP53 gene. (B)TP53 expression
  data of cancer cell lines from the Broad Institute’s DepMap,31 grouped by mutation
  status. (C) Table of pertinent TP53 pathway mutations in AGS, OE33, and KATO-III
  cell lines. (D) Relative expression of TP53 in AGS, OE33, and KATO-III cells with
  the CEMa system and nontargeting or TP53 targeting sgRNA stably infected, in the
  absence of CEM87. (E) Etoposide-induced p53, p21, and PUMA activation in AGS and
  OE33 cells was assessed by immunofluorescent staining after treatment with 25 μM
  etoposide for 48 h. (F) Cell viability evaluated by CellTiter-Glo in AGS cells with
  the CEMa system and nontargeting or TP53 targeting sgRNA stably infected, in the
  presence of CEM87. (G) Cell viability evaluated by CellTiter-Glo in OE33 cells with
  the CEMa system and nontargeting or TP53 targeting sgRNA stably infected, in the
  presence of CEM87. (H) Cell viability evaluated by CellTiter-Glo in KATO-III cells
  with the CEMa system and nontargeting or TP53 targeting sgRNA stably infected, in
  the presence of CEM87. In panels F–H, IC50 values were calculated using four-parameter
  nonlinear regression, and error bars represent the standard deviation of four biological
  replicates. Abbreviations: CEMa, activating chemical epigenetic modifier; sgRNA,
  single guide RNA'
