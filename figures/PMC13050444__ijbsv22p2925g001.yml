figure_title: Glycolysis is increased in the articular cartilage of OA patients.
caption: Glycolysis is increased in the articular cartilage of OA patients. A) Histopathological
  examination (H&E and SO-FG staining) of articular cartilage. B) Volcano plot of
  transcriptomic sequencing data from articular cartilage. C, D) KEGG pathway enrichment
  analysis of upregulated and downregulated genes in OA articular cartilage (including
  the medial and lateral compartments). E) GSEA for glycolysis/gluconeogenesis. F)
  Schematic diagram of the glycolytic pathway. G) Heatmap displaying the expression
  of genes involved in the glycolysis/gluconeogenesis pathway across articular cartilage
  samples. H) Expression levels of key glycolytic enzymes in individual articular
  cartilage samples (n=4). I, J) Western blot analysis and semi-quantification of
  key glycolytic enzymes in articular cartilage from healthy donors and OA patients
  (n=4). K) Lactate content in the articular cartilage (n=4). *P < 0.05, **P < 0.01,
  ***P < 0.001
