figure_title: GLP-2 analog therapy enhances microbial diversity and functional capacity
  without uniform taxonomic shifts in SBS
caption: '(A) β-diversity analysis: Principal coordinate analysis (PCoA) based on
  the Bray-Curtis dissimilarity index to assess gut microbiota differences among samples.
  (B) α-diversity analysis: Comparison of microbial diversity at 0 months (0M), 6M,
  and 12M based on observed operational taxonomic units (OTUs). The box shows the
  interquartile range (IQR), with the line inside indicating the median. The whiskers
  extend to the smallest and largest values within 1.5 times the IQR. Each dot represents
  an individual sample. (C) Microbial composition: Relative abundance of gut microbiota
  in each sample, represented by bacterial genus and categorized by phylum. (D) Differentially
  abundant taxa: Log2 fold change (LFC) of differentially abundant genera identified
  through Analysis of Compositions of Microbiomes with Bias Correction 2 (AMCOM-BC2).
  Genera with LFC > 1 were positively enriched, while those with LFC < –1 were negatively
  enriched. (E) MetaCyc functional pathways: Predicted MetaCyc functional pathways
  that showed significant temporal differences by Friedman test and exhibited increased
  abundance at 12M compared with 0M and/or 6M are shown. The x-axis represents the
  –Log10 (P value) from statistical comparisons of pathway abundances. Statistical
  analyses included permutational multivariate 2-way ANOVA (A), the Mann-Whitney test
  (B), and Friedman test (E)'
