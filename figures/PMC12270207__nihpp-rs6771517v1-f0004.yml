figure_title: P2rx7 deficiency ameliorates inflammatory microglial activation in PS19
  mice
caption: a, Schematic design for bulk RNA-seq analysis of hippocampi from 9.5-month-old
  mice (n= 8 WT mice, n= 8 P2rx7−/− mice, n= 10 PS19 mice and n= 6 PS19/P2rx7−/− mice).
  b, Volcano plot showing DEGs between PS19 and WT mice (q-value < 0.05). c, Weighted
  gene co-expression network analysis (WGCNA) module correlations with key pathological
  phenotypes from PS19 mice (n= 8 WT mice, n= 8 P2rx7−/− mice, n= 10 PS19 mice and
  n= 6 PS19/P2rx7−/− mice). d, Comparison of the first principal component of each
  module (eigengene) per genotype using the top 6 significantly correlated modules
  with at least one phenotype (n= 8 WT mice, n= 8 P2rx7−/− mice, n= 10 PS19 mice and
  n= 6 PS19/P2rx7−/− mice; Kruskal–Wallis test with Wilcoxon test post hoc analysis).
  e, Volcano plot showing DEGs between PS19/P2rx7−/− and PS19 mice in the MEblue module
  (n= 10 PS19 mice, n= 6 PS19/P2rx7−/− mice; q-value < 0.05). f, Gene set enrichment
  analysis (GSEA) of the top pathways regulated in PS19/P2rx7−/− versus PS19 mice
  in the MEblue module (n= 10 PS19 mice, n= 6 PS19/P2rx7−/− mice). g, Representative
  confocal images and 3D rendering of microglial IBA1 and CD68 staining in the DG
  hippocampus. h, IBA1 volume and CD68/IBA1 colocalized volume were measured using
  Imaris (n= 7 WT mice, n= 8 P2rx7−/− mice, n= 9 PS19 mice, n= 9 PS19/P2rx7−/− mice;
  one-way ANOVA with Holm–Šidák post hoc analysis). All bar graphs represent the mean
  ± SEM; *P < 0.05, **P < 0.01, ***P < 0.001 and ****P < 0.0001
