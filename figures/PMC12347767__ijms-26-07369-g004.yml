caption: 'Proteomic analysis reveals cellular pathways modulated by urolithin B (UB)
  treatment in HKB-11 cells. (A) An Ingenuity Pathway Analysis (IPA) graphical summary
  highlighting two major biologically enriched themes derived from significantly regulated
  proteins following treatment with UB (150 µM). Coloured nodes represent predicted
  pathway activity: orange indicates predicted activation, blue indicates predicted
  inhibition, and grey indicates no prediction. Arrows show relationships—solid for
  direct and dashed for inferred interactions. (B) A volcano plot displaying the distribution
  of differentially expressed proteins between urolithin B-treated and untreated HKB-11
  cells. Red dots represent significantly upregulated proteins, blue dots represent
  significantly downregulated proteins, and grey dots indicate proteins that did not
  meet the threshold for significance. Differential expression was defined by an absolute
  log2 fold change ≥ 0.58 and a Q-value ≤ 0.05. Select significantly altered proteins
  are annotated, illustrating the molecular impact of urolithin B on cellular protein
  networks'
