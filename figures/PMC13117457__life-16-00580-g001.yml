figure_title: Integrated workflow illustrating the multi-target neuroprotective mechanism
  of Garcinia mangostana peel aqueous extract (GMPE).
caption: Integrated workflow illustrating the multi-target neuroprotective mechanism
  of Garcinia mangostana peel aqueous extract (GMPE). Mangosteen peel (pericarp) was
  subjected to pressurized hot water extraction (PHWE) to obtain a polar aqueous extract,
  which was chemically characterized using UHPLC–QTOF–MS. Identified metabolites were
  subsequently filtered through in silico ADMET and blood–brain barrier (BBB) permeability
  screening to prioritize central nervous system–relevant compounds. Disease-associated
  gene sets for Alzheimer’s disease (AD), Parkinson’s disease (PD), and amyotrophic
  lateral sclerosis (ALS) were integrated to identify shared molecular targets. Protein–protein
  interaction analysis and compound–gene–pathway network construction were performed
  using STRING, and functional enrichment analyses (GO and KEGG) were used to elucidate
  core regulatory pathways. Molecular docking was conducted to validate interactions
  between prioritized metabolites and hub targets. The integrated analysis highlights
  key signaling pathways, including PI3K–Akt, MAPK, autophagy, and hypoxia-related
  pathways, supporting a systems-level multi-target neuroprotective mechanism
article_title: Mapping the Polar Neuro-Interactome of Garcinia mangostana Against
  the AD-PD-ALS Nexus
