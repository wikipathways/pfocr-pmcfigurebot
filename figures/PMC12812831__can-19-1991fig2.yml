figure_title: 'Sankey diagram illustrating treatment pathways for patients with non-metastatic
  rectal cancer presenting to Ocean Road Cancer Institute (ORCI). The central vertical
  bar (labeled ‘ORCI’ and shown in royal blue) marks the point of presentation to
  ORCI, delineating care received before ORCI (left-sided nodes) from care received
  at or after ORCI (right-sided nodes). Each node represents a distinct treatment
  modality, and flow lines indicate the number of patients moving between treatments.
  Patients may enter or exit the care pathway at any node. To summarise the left side
  of the diagram: a total of two patients received neoadjuvant chemotherapy and 33
  underwent surgery (n = 1 neoadjuvant chemotherapy followed by surgery, n = 1 neoadjuvant
  chemotherapy alone; and n = 32 surgery alone). On the right side: 26 patients initiated
  adjuvant therapy upon presentation to ORCI (n = 16 chemoradiotherapy, n = 7 chemotherapy
  and n = 3 radiation therapy). This figure represents 26 of the 33 patients who had
  surgery prior to ORCI, with 7 of those patients receiving no further therapy. A
  total of 67 patients initiated neoadjuvant therapy at ORCI as their first treatment
  (n = 35 chemoradiotherapy, n = 24 chemotherapy, n = 8 radiotherapy); of these, 6
  proceeded to surgery (n = 3 after chemoradiotherapy, n = 3 after chemotherapy).
  An additional 3 patients underwent surgery as their first and only treatment after
  presenting to ORCI. Overall, 42 patients received no cancer-directed therapy. Abbreviations:
  CT, chemotherapy; chemoRT, chemoradiotherapy; ORCI, Ocean Road Cancer Institute;
  RT, radiotherapy. Note: Thirty patients were excluded from this figure due to inconsistent
  or incomplete documentation regarding surgical care'
