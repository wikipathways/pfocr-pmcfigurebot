figure_title: p53 inactivates the non-canonical NF-κB pathway through RelB cleavage.
caption: p53 inactivates the non-canonical NF-κB pathway through RelB cleavage. (a,b)
  Nutlin-3 (20 µM, 4 h) treated iMK2-KO cells accumulate p53 and harbor reduced RelB
  protein, but not NF-κB2, TRAF2 or p38α. (c) RelB cleavage products (arrows) appear
  in Western blots after Nutlin-3 (20 µM) treatment in iMK2-KO cells. (d) Il1b mRNA
  and (e) TP53 mRNA are reduced in Nutlin-3 (20 µM)-treated iMK2-KO cells. (b) Student’s
  t-test, (d,e) n = 4, 2W RM-ANOVA with Bonferroni posttests, mean ± SEM, * p < 0.05,
  ** p < 0.01, *** p < 0.001
