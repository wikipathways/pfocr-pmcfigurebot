figure_title: Validation of ER/HER2 crosstalk in HR+/HER2+ cell lines and a PDX model
  HCI032
caption: RT-qPCR analyses of ESR1 and PGR mRNA levels after 48 hours treatment with
  DMSO, fulvestrant (100 nM), neratinib (200 nM), lapatinib (1 μM) or fulvestrant
  and either neratinib or lapatinib in BT474 (A) and MDA-MB-361 (B) cells. Mean ±
  SD, n=3. (C-D) Cell viability measured by MTT assays after 6-day treatment in BT474
  (C) or MDA-MB-361 cells (D). (E) Western blot showing effector proteins in HER2
  and ER pathways. The relative expression levels of HER2 and ER are indicated. (F)
  Study timeline of mice with HCI032 xenografts treated with indicated drugs. (G)
  IHC staining of ER and HER2 in HCI032 tumors. (H) Tumor growth curve over time of
  HCI032 xenografts treated with vehicle, fulvestrant, neratinib, or combination.
  Mean ± s.e.m. n=12. (I-J) Representative tumor images and average tumor weights
  on day 26 in each treatment condition. Mean ± SD, n=12. (K) Representative IHC staining
  of ER, HER2, PR, p-ERK, and Ki67 in HCI032 tumors in each treatment condition. (L)
  Quantification of HER2 or percentage of ER, PR, p-ERK and Ki67 positive cells using
  IHC images in (K) Mean ± SD, n>=10. For panel A-B, H, J and L, One-way ANOVA with
  multiple comparisons test was performed. For all the test, n.s., not significant
  *P < 0.05, **P < 0.01, and ***P <0.001
