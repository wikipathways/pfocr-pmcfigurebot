figure_title: Signaling library toolkit screening reveals candidates as resistance-promoting
  pathways for MEK inhibition.
caption: 'Signaling library toolkit screening reveals candidates as resistance-promoting
  pathways for MEK inhibition. (A) MEKi screen shows cell viability responses of individually
  virally transduced cell populations in 92.1 cells. Notable resistance mutations
  include AKT E17K, HRAS G12V, BCL2, and FAK Y180/M183A, which exceed the control
  threshold. CTL + 3SD: mean viability of control samples plus three times the standard
  deviation used as a cut-off for resistance. (B) Dose–response curves for MEKi (trametinib)
  in 92.1 cells demonstrate enhanced resistance in populations expressing AKT E17K,
  BCL2 R98H, LATS K697R, and FAK Y180/M183A compared to parental cells. (C) Dose–response
  curves for MEKi (trametinib) in MP46 cells validate resistance phenotypes driven
  by LATS K697R, BCL2, FAK Y180/M183A, and MEK5-DD compared to parental MP46 cells.
  Two-way ANOVA followed by Tukey post hoc, **** p < 0.0001'
