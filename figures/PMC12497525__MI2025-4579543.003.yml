figure_title: Selection and enrichment analysis of key genes in OSA.
caption: Selection and enrichment analysis of key genes in OSA. (A) Venn diagram showing
  the intersection of differentially expressed genes and palevioletred module genes.
  (B) GO enrichment analysis of key genes, highlighting their roles in biological
  processes, cellular components, and molecular functions. (C) DO enrichment analysis
  linking key genes to diseases, such as oral disorders and pulmonary heart disease.
  (D) KEGG pathway analysis showing enrichment in pathways including NF-κB signaling,
  human cytomegalovirus infection, and apoptosis. (E) GSEA validating the enrichment
  of the NF-κB signaling pathway
