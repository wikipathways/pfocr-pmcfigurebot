figure_title: Pathways of ethanol elimination in the human body
caption: Once in the bloodstream, the majority (94–98%) of ethanol undergoes oxidative
  metabolism in the liver. Acetate can be oxidized in the liver or be shuttled out
  of the hepatocyte as a fuel source for other tissues (heart, muscle, brain). Non-oxidative
  metabolism accounts for less than 1%, producing metabolites such as fatty acid ethyl
  esters (FAEEs), phosphatidylethanol (PEth), and ethyl glucuronide/sulfate (EtG/EtS)
  in various organs. A small fraction (2–6%) of ethanol is excreted unchanged via
  breath (1–3%), urine (1–3%), and sweat (<0.2%), with implications for biomarker
  and diagnostic applications. Created with BioRender.com
