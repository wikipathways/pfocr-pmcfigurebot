figure_title: Application of cell membrane- and vesicle-based biomimetic nanodrugs
  in the nasoencephalic pathway for treating various neurological diseases.
caption: Application of cell membrane- and vesicle-based biomimetic nanodrugs in the
  nasoencephalic pathway for treating various neurological diseases. (A) Catalase-loaded
  exosomes, after intranasal administration, are internalized by neurons and microglia
  in PD mice, exerting significant neuroprotective effects. (B) The Gas6-NV-NPs system
  is formed by modifying poly(lactic-co-glycolic acid) (PLGA) nanoparticles co-encapsulating
  rapamycin (RAP) and nicotinamide riboside (NR) with membranes from neural stem cells
  overexpressing glial cell line-derived neurotrophic factor (GDNF). This system targets
  pathological regions of AD, not only enhancing the phagocytic clearance of β-amyloid
  (Aβ) by microglia but also regulating microglia to an anti-inflammatory phenotype,
  achieving brain targeting and neuronal repair. (C) Macrophage membrane-coated liposomes
  (MM-Lip-Rg3/PNS) loaded with ginsenoside Rg3 and total saponins, by virtue of the
  affinity of macrophage membrane proteins for inflamed cerebral microvascular endothelial
  cells, cross the BBB to exert neuroprotective effects, addressing inflammation and
  tissue damage after ischemia. (D) Poly(lactic-co-glycolic acid) (PLGA) nanoparticles
  loaded with temozolomide (TMZ) and coated with U251 glioma cell membranes (NP-MB),
  combined with the nasoencephalic drug delivery pathway, enhance the targeting to
  GBM cells, thereby achieving effective treatment (Created in BioRender, Ding, F
  (2025) https://BioRender.com/h1hyqty)
