caption: Histogram. Serum protein levels were significantly higher in patients with
  RA compared with healthy controls, and even more elevated in patients with RA-ILD
  compared with patients with RA. The bar graph illustrates the relative expression
  levels of 20 differentially expressed proteins among healthy controls, patients
  with RA and patients with RA-ILD. The data are presented as mean ± SD. The data
  from patients with RA and patients with RA-ILD represent pooled samples. *P<0.05,
  **P<0.01 and ***P<0.001. RA, rheumatoid arthritis; RA-ILD, RA-associated interstitial
  lung disease; TFPI, tissue factor pathway inhibitor; CA9, carbonic anhydrase IX;
  AR, amphiregulin; Shh-N, sonic hedgehog N-terminal; Gas1, growth arrest-specific
