figure_title: 'There are two piRNA biogenesis pathways: the primary pathway and the
  secondary pathway [25,46].'
caption: 'There are two piRNA biogenesis pathways: the primary pathway and the secondary
  pathway [25,46]. The primary pathway starts in the nucleus, where piRNA clusters
  are transcribed by RNA polymerase II (POL II). The resulting piRNA precursor is
  exported to the cytoplasm, where it connects with the Zucchini protein (Zuc), whose
  function is to split the transcribed strand at specific sites starting with a uracil
  (U) [6]. The 5′ end of the cut-out fragments connects with the PIWI protein (PIWI),
  creating a pre-piRNA in which the first nucleotide is uracil. The 3′ end undergoes
  methylation (by the methyltransferase Hen1) and is converted to 2′-OCH3 [36,37,38].
  This mature piRNA is trimmed by the exonuclease Trimmer/PNLDC1 to produce mature
  initiator piRNAs, which is crucial in the secondary pathway. The initiator piRNA,
  the product of the primary pathway, begins the ping-pong cycle by slicing transposon
  mRNA into smaller sections, generating pre-pre-piRNAs. Each piece is bound by a
  PIWI protein creating pre-piRNA. The 3′ end of the generated molecule is trimmed
  by the exonuclease Trimmer/PNLDC1 and methylated by the methyltransferase Hen1 to
  finally produce the mature piRNA [25,46,47,48]'
