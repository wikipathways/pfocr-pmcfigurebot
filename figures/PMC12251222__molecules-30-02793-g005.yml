figure_title: Taxol combined with 25253 induces apoptosis in ES-2 cells.
caption: Taxol combined with 25253 induces apoptosis in ES-2 cells. (A) Annexin V
  assay of the combination of 0.5 μM 25253 and 10 nM Taxol. (B) Annexin V assay of
  the combination of 1 μM 25253 and 20 nM Taxol. Representative 2D dot plots and quantitative
  data are shown. ES-2 cells were treated for 72 h and then harvested for Annexin
  V assay. Apoptotic cells (%) were calculated as the sum of early (Q3) and late (Q2)
  apoptotic cells. (C) The combination of Taxol and 25253 induced apoptosis after
  48 h of treatment. ES-2 cells were treated for 24 h and 48 h and then subjected
  to Western blot analysis of PARP. * p < 0.05, ** p < 0.01, *** p < 0.001 vs. combination.
  (D) The combination of Taxol and 25253 induced apoptosis via the intrinsic pathway.
  ES-2 cells were treated for 24 h and 48 h and then subjected to Western blot analysis
  of Bcl-2 family proteins. * p < 0.05, ** p < 0.01, *** p < 0.001 vs. CTL. Quantitative
  data are presented as mean ± SEM of at least three independent experiments
