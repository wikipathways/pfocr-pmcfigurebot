figure_title: Hepatic transcriptomic data comparing Continuous and Intermittent TPN
  groups.
caption: Hepatic transcriptomic data comparing Continuous and Intermittent TPN groups.
  a) There were 9677 genes co-expressed between the three groups with 660 genes upregulated
  in the TPN groups. b) Volcano plot depicting the genes differentially expressed
  with |LFC| > 0.05 and an FDR-corrected p-value < 0.05. There were 240 genes upregulated
  and 287 genes downregulated in the Continuous group compared to intermittent. c)
  Gene Ontology analysis identified biological processes (BP), cell compartments (CC),
  and metabolic functions (MF) significantly upregulated in the Continuous group compared
  to the Intermittent group. d) Kyoto Encyclopedia of Genes and Genomes pathway analysis
  revealed metabolic pathways upregulated in Continuous infusions. N=6/group
article_title: Cyclic infusion mitigates liver dysfunction associated with continuous
  total parenteral nutrition in a novel murine model
