figure_title: Integrated mechanisms of AFB1-induced fetal bone toxicity.
caption: 'Integrated mechanisms of AFB1-induced fetal bone toxicity. The framework
  highlights four core causal nodes: (1) Oxidative Stress, (2) Inflammation, (3) Hormonal
  Disruption and (4) Calcium Metabolism. Maternal AFB1 exposure disrupts calcium metabolism
  and hormonal regulation through impaired vitamin D activation, altered parathyroid
  hormone signaling, and reduced calcium and phosphorus availability. Concurrent activation
  of oxidative stress and inflammatory pathways in fetal skeletal tissues promotes
  osteoblast apoptosis, enhances osteoclast differentiation via RANK/RANKL/OPG signaling,
  and induces chondrocyte dysfunction, collectively leading to delayed ossification
  and impaired skeletal mineralization. PTH: parathyroid hormone; Ca: calcium; P:
  phosphorus; NF-κB: nuclear factor kappa B; TNF-α: tumor necrosis factor-α; IL-6:
  interleukin-6; IL-1: interleukin-1; TLR2: Toll-like receptor 2; 25-hydroxylase:
  an enzyme converting vitamin D to 25-hydroxyvitamin D; 25-OH-D3: 25-hydroxyvitamin
  D3; PKCβ/p66^Shc/NF-κB: protein kinase C β/p66^Shc/nuclear factor kappa B signaling
  pathway; RANK/RANKL/OPG: receptor activator of nuclear factor κB/receptor activator
  of nuclear factor κB ligand/osteoprotegerin; VDR: vitamin D receptor'
