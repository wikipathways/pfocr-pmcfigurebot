figure_title: Pathway analysis of SLFN11-associated gene expression in multiple myeloma
caption: '(A) Gene Ontology (GO) enrichment analysis comparing MM samples with the
  highest and lowest SLFN11 expression (n = 844, divided by median expression). Red
  bars indicate pathways upregulated in SLFN11-high samples, while blue bars show
  pathways enriched in SLFN11-low samples. Left panel: biological processes; middle
  panel: molecular functions; right panel: cellular components. The x-axis represents
  −log10(P-value). (B) Gene Set Enrichment Analysis (GSEA) comparing SLFN11-high versus
  SLFN11-low samples. Upper panel: MSigDB C5 ontology gene sets showing positive enrichment
  in SLFN11-high samples, including adaptive immune response (NES = 8.270) and immunoglobulin
  complex (NES = 8.004). Lower panel: MSigDB Hallmark gene sets showing negative enrichment
  in SLFN11-high samples, including MYC targets v1 (NES = −2.757) and G2M checkpoint
  (NES = −2.385). NES: Normalized Enrichment Score'
