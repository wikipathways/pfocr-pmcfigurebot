caption: 'Fisetin attenuated the oxidative stress of SYFs in 580-day-old hens via
  regulating Nrf2 and β-catenin signaling pathways. (A,B) WB analysis of p-Nrf2, Nrf2,
  and β-catenin in control, Fisetin, Fisetin + ML385, Fisetin + IWR-1, ML385, IWR-1-treated
  groups. (C) H&E staining of SYFs following the indicated treatments. Scale bar:
  50 µm. The granulosa layer (arrowheads) and theca layer (arrows) from follicles
  and atretic follicles were separated by a dashed line. (D–G) TEM observation of
  SYFs from control, Fisetin, Fisetin + ML385, and Fisetin + IWR-1-treated groups.
  Scale bar: 1 µm. Red arrows: mitochondria. (H–K) Determination of CAT, T-SOD, GSH,
  and MDA in SYFs of each group. (L,M) WB analysis of TOMM20 in SYFs of each group.
  (N) ATP detection. Different lowercase letters indicate significant differences
  (p < 0.05)'
