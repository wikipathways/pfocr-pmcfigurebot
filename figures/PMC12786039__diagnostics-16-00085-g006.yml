figure_title: Development, validation, and biological interpretation of the five-gene
  signature prediction model.
caption: 'Development, validation, and biological interpretation of the five-gene
  signature prediction model. (A) ROC comparison of single vs. combined models. ROC
  analysis demonstrated that the combined five-gene model (AUC = 1.0) outperformed
  individual genes (PLPPR1: 0.846; CNTN3: 0.724; HOXA10: 0.841; HAGLR: 0.773; ENPP3:
  0.675). (B) Signature Score distribution shows complete separation between Responder
  and Non-Responder groups (p = 1.35 × 10−9, Wilcoxon test), with Responders exhibiting
  significantly higher scores than Non-Responders. (C) KEGG pathway enrichment analysis
  shows significant enrichment in metabolism-related pathways (pantothenate and CoA
  biosynthesis, nicotinate and nicotinamide metabolism, nucleotide metabolism) and
  transcriptional misregulation in cancer (p < 0.05), suggesting these core genes
  may influence immunotherapy response through metabolic reprogramming'
