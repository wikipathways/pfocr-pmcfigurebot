figure_title: Overview of BbLP induced changes in BMDMs
caption: A graphical overview depicting the modulation of BMDMs by BbLP. TLR1/2, bound
  to MyD88, are shown as the primary receptors for BbLP. IKK and DUSP1 are highlighted
  as central regulators, marked in green and yellow, respectively, while their inhibitors
  BAY and BCI are shown in red boxes. Mitochondrial effectors like mitoROS and mtDNA
  are depicted as stars. Type-I-IFN-regulated genes are listed in yellow boxes. Solid
  arrows indicate gene regulation pathways, while dotted arrows represent the translocation
  of proteins into the nucleus. Cytokines such as CXCL1, CXCL2, CCL5, and IL1B are
  shown as various colored granules in the extracellular space. The previously identified
  mediators, including JNK, BAX, TRAF6, and mtDNA, which were not experimentally examined
  in this manuscript, are highlighted in red
article_title: Role of Dual Specificity Phosphatase 1 (DUSP1) in influencing inflammatory
  pathways in macrophages modulated by Borrelia burgdorferi lipoproteins
