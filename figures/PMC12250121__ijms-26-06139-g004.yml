caption: Time-dependent inhibition of signaling pathways by fedratinib in TNBC cells.
  MDA-MB-231 and HS578T were treated with DMSO or fedratinib (5 μM) for indicated
  times, or cerdulatinib (5 μM) and peficitinib (5 μM) 24 h. (A) STAT3 phosphorylation
  (Y705) and (B) phosphorylation status of PI3K/AKT and MEK/ERK pathway proteins were
  analyzed by Western blot, with β-actin as a loading control. Data present mean ±
  SEM from three independent experiments. * p < 0.05, ** p < 0.01, and *** p < 0.005
