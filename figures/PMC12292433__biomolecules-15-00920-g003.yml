figure_title: Dual roles of microglia in ischemic stroke.
caption: 'Dual roles of microglia in ischemic stroke. Upon the onset of ischemic stroke,
  quiescent microglial cells are activated in three ways. DAMPs bind to both P2PRs
  (P2XRs, P2YRs) and pattern recognition receptors (PRRs) (TLRs, NLRs, CLRs) on dormant
  microglia, inducing microglia activation. Additionally, post-stroke neuronal death
  leads to loss of immunosuppressants (CD200) and Chemokine (CX3CL1) on the neural
  surface, augmenting microglial activation. Acute stage: Microglia activates and
  migrates to the infarct area, exhibiting neurotoxic influences and worsening post-stroke
  neuroinflammation. ① Pro-inflammatory mediators released by microglia increase the
  BBB permeability. ② Overactivated microglia accelerate neural death. ③ Excitotoxicity
  is caused by excessive levels of glutamate and inflammatory chemokines. ④ Excessive
  phagocytosis: Surviving damaged neurons are identified by MFG-E8 (milk fat globule
  EGF factor 8) and combine with MerTK (Mer tyrosine kinase), inducing phagocytic
  cell death. Later stage: ⑤ Anti-inflammatory cytokines aid in neural repair and
  regeneration. ⑥ Synaptic remodeling is initiated by IL-10 via the JAK1/STAT3 signaling
  pathway. ⑦ Both IL-6 and IGF-1 contribute to the increasing neuronal connectivity
  through re-establishment of the neural network. ⑧ CD36 and TREM2 (triggering receptor
  expressed on myeloid cells 2) are primary phagocyte receptors on macrophages, facilitating
  microglial phagocytosis of post-stroke debris and DAMPs'
article_title: 'A Comprehensive Review of the Role of the Microbiota–Gut–Brain Axis
  via Neuroinflammation: Advances and Therapeutic Implications for Ischemic Stroke'
