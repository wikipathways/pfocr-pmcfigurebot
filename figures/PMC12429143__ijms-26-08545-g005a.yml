figure_title: Insulin signaling pathway in PC12 cells by Western blot.
caption: 'Insulin signaling pathway in PC12 cells by Western blot. (A) Representative
  Western blot images showing protein expression levels of key insulin signaling pathway
  components (Akt, GSK-3β, AMPK) and their phosphorylated forms in PC12 cells from
  co-culture experiments. (B) Quantitative analysis of total and phosphorylated protein
  levels of Akt, GSK-3β, and AMPK in PC12 cells following treatment with TCM extracts.
  Experimental protocol: PC12 and Caco-2 cells were maintained in co-culture with
  PC12 cells in the basal layer and Caco-2 cells in the upper layer. PC12 cells were
  exposed to 10 μM Aβ for 1 h to induce neuronal damage, while Caco-2 cells were simultaneously
  exposed to 10 μM LPS for 1 h to simulate intestinal inflammation. Following damage
  induction, cells were treated for 24 h with vehicle control, donepezil hydrochloride
  (positive control), or 20 μg/mL concentrations of VT, PM, AVF, and EF extracts.
  PC12 cells were then harvested for Western blot analysis of insulin signaling pathway
  proteins, including total and phosphorylated forms of Akt, AMPK, and GSK-3β, with
  β-actin serving as loading control. Data are presented as mean ± standard error.
  Different letters (a, b, c) above bars indicate significant differences between
  treatment groups (Tukey’s test, p < 0.05). Identical letters indicate no significant
  difference. Abbreviations: Akt, AKT serine/threonine kinase; AMPK, AMP-activated
  protein kinase; AVF, Apocyni Veneti Folium; EF, Eucommiae folium; GSK-3β, glycogen
  synthase kinase-3β; LPS, lipopolysaccharide; PM, Plantago major; TCM, traditional
  Chinese medicine; VT, Vitex trifolia; Aβ, β-amyloid'
