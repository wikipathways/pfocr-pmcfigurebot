figure_title: Uracil-Triggered Signaling Pathway for DUOX-Dependent Hydrogen Peroxide
  Production and Antimicrobial Defense in Enterocytes.
caption: Uracil-Triggered Signaling Pathway for DUOX-Dependent Hydrogen Peroxide Production
  and Antimicrobial Defense in Enterocytes. Pathogenic bacteria release uracil, which
  is sensed at the enterocyte membrane, likely through a G-protein-coupled receptor
  (GPCR). This activates Gαq and PLβ, initiating a signaling cascade involving MEKK1,
  MKK3, and p38 kinase, leading to phosphorylation of the transcription factor ATF2.
  Phosphorylated ATF2 translocates to the nucleus to induce the expression of the
  duox gene. The DUOX protein is then produced and translocated to the membrane, where
  it generates hydrogen peroxide (H2O2). The locally produced H2O2 contributes to
  killing or damaging the pathogenic bacteria, mediating an antimicrobial response
