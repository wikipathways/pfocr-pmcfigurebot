figure_title: Summary of the principal microbial biotransformation pathways of major
  dietary polyphenol classes in the human gut, the corresponding bacterial taxa implicated,
  and the biological effects of resulting metabolites.
caption: Summary of the principal microbial biotransformation pathways of major dietary
  polyphenol classes in the human gut, the corresponding bacterial taxa implicated,
  and the biological effects of resulting metabolites. Flavonols such as quercetin
  undergo deglycosylation via β-glucosidase activity, followed by ring fission and
  dihydroxylation, yielding metabolites including 3,4-dihydroxyphenylacetic acid (anti-inflammatory,
  improves gut-barrier function and insulin sensitivity [175]), and protocatechuic
  acid (potent antioxidant, neuroprotective, and hepatoprotective effects [176]).
  Eubacterium ramulus, Clostridium orbiscindens, and Bacteroides spp. primarily mediate
  these transformations [177,178]. Flavanones (e.g., naringenin) are subjected to
  C-ring cleavage via flavanone reductase and dioxygenase, producing 3-(4-hydroxyphenyl)propionic
  acid (reduces macrophage lipid accumulation and inflammatory cytokine production
  [179]) and p-hydroxybenzoic acid (antioxidant, cardiometabolic protective effects
  [82]). Key degraders include E. ramulus, Bacteroides spp., and Clostridium spp.
  Key degraders include E. ramulus, Bacteroides spp., and Clostridium spp. [180].
  Flavanols (catechins such as epicatechin) are metabolized through C-ring fission
  (catechol dioxygenase) and subsequent dehydroxylation, yielding 3,4-dihydroxyphenyl-γ-valerolactone
  (activates SIRT1-mediated autophagy, antioxidant, and hepatometabolic benefits [181])
  and 3-hydroxyphenylpropionic acid (improves lipid profile, reduces hepatic steatosis
  [182]). Predominant bacterial taxa are Eggerthella lenta, Flavonifractor plautii,
  and Bifidobacterium spp. [183]. Flavones (e.g., apigenin) undergo deglycosylation,
  hydrogenation, and demethylation, producing luteolin (anti-inflammatory via NF-κB,
  JAK-STAT, Nrf2 modulation; restores epithelial barrier integrity [184]) and various
  4-hydroxycinnamic acid derivatives, largely mediated by E. ramulus, Bacteroides
  distasonis, and C. orbiscindens [185,186]. Anthocyanins (e.g., cyanidin) are processed
  via deglycosylation (β-glucosidase), ring fission, and dehydroxylation, generating
  protocatechuic acid (antioxidant, anti-inflammatory [176]) and phloroglucinaldehyde
  (phloroglucinol derivative with antioxidant and intestinal-modulatory effects [187]),
  involving Bifidobacterium spp., Lactobacillus spp., and Clostridium spp. [185].
  Isoflavones such as daidzein are reduced and dehydroxylated to yield equol (estrogenic
  ERβ agonist; anti-inflammatory, vasodilatory, and bone-protective [188]) and O-desmethylangolensin.
  These transformations involve Slackia isoflavoniconvertens, Eggerthella spp., and
  Adlercreutzia equolifaciens [189]. Lignans (e.g., secoisolariciresinol) undergo
  demethylation, dehydroxylation, and dehydrogenation, leading to enterodiol and enterolactone
  (phytoestrogenic activity, anti-proliferative, possible cancer-protective and neuroprotective
  effects [190,191]), produced by Clostridium saccharogumia, Bacteroides spp., and
  E. lenta [192]. Phenolic acids of the hydroxycinnamic type (e.g., caffeic acid)
  are reduced at the double bond and dehydroxylated, forming 3-hydroxyphenylpropionic
  acid (see above) and phenylpropionic acid, with contributions from Escherichia coli,
  Bacteroides spp., and Clostridium spp. [193]. Phenolic acids of the hydroxybenzoic
  type (e.g., gallic acid) are decarboxylated and dehydroxylated to yield pyrogallol
  and catechol (redox modulators with context-dependent antioxidant/pro-oxidant effects,
  influencing gut microbial ecology [82]), mainly via Lactobacillus plantarum, Clostridium
  spp., and Bifidobacterium longum [194]. Finally, stilbenes such as resveratrol are
  metabolized through hydrogenation and dihydroxylation, producing dihydroresveratrol
  and lunularin (anti-inflammatory, anti-proliferative, and tissue-retentive metabolites
  often more bioactive than parent compound [195]), with Slackia spp. as key players
  [195,196]. ↓ Significant decrease; ↑ Significant increase
