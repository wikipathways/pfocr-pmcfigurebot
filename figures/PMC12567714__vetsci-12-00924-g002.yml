figure_title: Transcriptomic profiling of bovine embryos treated with LY2955303 (LY).
caption: 'Transcriptomic profiling of bovine embryos treated with LY2955303 (LY).
  (a) PCA plot showing global gene expression differences (PC1: 50.71%; PC2: 18.37%).
  (b) Clustered heatmap of DEGs. The columns and rows in the heatmap represent samples
  and genes, respectively. Sample names are displayed below the heatmap. (c) Volcano
  plot of DEGs (|log2FC| > 1, p < 0.05; 1224 up, 1776 down). (d) The top 10 terms
  in biological processes (BPs), cellular components (CCs), and molecular functions
  (MFs) from the GO analysis. (e) KEGG pathway enrichment analysis of upregulated
  DEGs. (f) KEGG pathway enrichment analysis of downregulated DEGs'
