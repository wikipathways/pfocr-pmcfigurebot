figure_title: Studies on the presence and effect of the DIO2 pathway in primary mouse
  NPCs
caption: '(A) Schematic representation of the protocol to isolate mNPCs, propagate
  them in culture, and differentiate them into neurons. (B and C) Bright-field images
  showing representative neurospheres containing mNPCs (B) and the mNPCs cultured
  on poly-D-lysine–coated plates (C). (D–F) Confocal images showing mNPCs expressing
  Nestin (green) and Sox2 (red) (D) and Mct8 (red) (E). The insets in E depict 2 dividing
  mNPCs that exhibited higher intensity of Mct8 immunofluorescence. (F) Quantitation
  of the DIO2 deiodination in mNPCs; n = 6 DIO2 assays. The background condition includes
  all assay reagents except for the cell samples. (G) Bright-field images showing
  representative mNPCs after 2 days of neurodifferentiation. (H–J) Relative mRNA levels
  of the indicated genes in mNPCs under the indicated conditions; n = 4. (K) Bright-field
  images showing representative mNPCs after 4 days of neurodifferentiation. Note the
  neuronal process extension. (L) Tuj1+ cells under the indicated conditions and the
  quantitation of the percentage of Tuj1+ cells. Values are the mean ± SD of 5 replicates.
  Scale bars: 300 μm (B) and 25 μm (C–L). **P < 0.01; ***P < 0.001 by 2-tailed Student’s
  t test for comparing DIO2 deiodination in iPSC-derived NPCs'
