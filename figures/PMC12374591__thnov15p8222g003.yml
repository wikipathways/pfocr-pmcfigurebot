caption: 'Roles of LILRBs in hematological malignancies. (A-E) The schematic diagrams
  illustrate the functional roles of LILRBs in hematologic malignancies, depicting
  their interactions with specific ligands, activation of downstream signaling pathways,
  and subsequent modulation of tumor cell proliferation, migration, and T-cell function
  across distinct disease contexts: (A) acute myeloid leukemia (AML), (B) multiple
  myeloma (MM), (C) chronic lymphocytic leukemia (CLL), (D) acute T-cell leukemia
  (ATL), and (E) cutaneous T-cell lymphoma (CTCL)'
