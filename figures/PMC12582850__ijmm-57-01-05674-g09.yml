caption: Schematic illustration of targeting of CIRP attenuates osteoarthritis progression
  and the underlying mechanism. CIRP can be secreted in the form of exosomes and acts
  as a pro-inflammatory factor that activates the TLR4/NF-κB/NLRP3 signaling pathway,
  promoting the inflammatory response, ECM degradation and the progression of OA.
  Additionally, CIRP is identified as a target of miR-145, which inhibits its expression
  in OA. CIRP, cold-inducible RNA-binding protein; TLR4, Toll-like receptor 4; NLRP3,
  NLR family pyrin domain containing 3; OA, osteoarthritis; ECM, extracellular matrix;
  miR, microRNA; iNOS, inducible nitric oxide synthase; COX-2, cyclooxygenase-2; MMPs,
  matrix metalloproteinases
article_title: Targeting of CIRP attenuates osteoarthritis progression via suppressing
