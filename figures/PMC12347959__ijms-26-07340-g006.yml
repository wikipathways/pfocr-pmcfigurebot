figure_title: Regulation of GCR signaling by miRNAs in BCa progression and therapy
  response.
caption: Regulation of GCR signaling by miRNAs in BCa progression and therapy response.
  The GCR axis plays a dual role in BCa, modulating survival, proliferation, and sensitivity
  to glucocorticoid therapy. miR-144 is repressed by the lncRNA Sweet-P, and miR-133b
  targets components of the PI3K/AKT pathway, contributing to therapy resistance and
  increased cell survival. Conversely, when coadministered with glucocorticoid therapy,
  miR-203 promotes apoptosis. GCR overexpression leads to oncogenic activation via
  NF-κB, enhancing migration, metastasis, and EMT. These interactions illustrate the
  potential of miRNAs to modulate glucocorticoid-based treatment efficacy and tumor
  aggressiveness. Solid straight black arrows indicate activation, dashed black arrow
  represents indirect inactivation, up red arrows indicate increased expression. Figure
  created with BioRender.com (accessed on 1 May 2025)
