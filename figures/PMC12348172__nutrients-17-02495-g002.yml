figure_title: Metabolic fate of orally consumed deuterium-labelled choline.
caption: Metabolic fate of orally consumed deuterium-labelled choline. The methyl
  groups of choline are marked with different colors. The d-9-choline tracer contained
  three deuterium-labelled methyl groups. After irreversible oxidation of choline
  to betaine by choline dehydrogenase (CHDH) and betaine aldehyde dehydrogenases (BADH),
  one of the three labelled methyl groups is used to convert homocysteine to methionine
  and appears in the S-adenosylmethionine molecule. The second labelled methyl group
  (now on dimethylglycine) is traced in 5,10-methylene-tetrahydrofolate. The third
  methyl group of choline is channeled via sarcosine and then transferred to tetrahydrofolate,
  which is traced in 5,10-methylene-tetrahydrofolate. Thus, each choline molecule
  that is oxidized to betaine contributes three methyl groups to the methyl reservoir.
  The synthesis of phosphatidylcholine from phosphatidylethanolamine via phosphatidylethanolamine
  methyltransferase (PEMT) utilizes three methyl groups from the methylation pool.
  Also, it generates S-adenosylhomocysteine, which feeds back into the homocysteine
  remethylation pathway
article_title: The Shuttling of Methyl Groups Between Folate and Choline Pathways
