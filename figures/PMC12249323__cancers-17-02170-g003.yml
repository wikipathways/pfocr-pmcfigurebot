caption: 'Interactions of DNA repair pathways: Base Excision Repair (BER), Nucleotide
  Excision Repair (NER), Single-Strand Break Repair (SSBR), Double-Strand Break Repair
  (DSBR), including Homologous Recombination (HR), Non-Homologous End Joining (NHEJ),
  and Alternative End Joining (ALT-EJ). The red downward arrow symbolizes reduced
  or absent activity of specific repair proteins, which may shift the balance of repair
  processes, forcing cells to rely on alternative, often less accurate pathways. This
  imbalance is particularly significant in the context of PARP inhibitor treatment
  and mutations in BRCA1/2 genes, where the loss of effective repair mechanisms leads
  to the accumulation of DNA damage, potentially resulting in synthetic lethality,
  in which cancer cells are selectively eliminated due to their inability to repair
  critical DNA damage'
