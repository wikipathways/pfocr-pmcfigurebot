figure_title: Inhibition of PERK signaling alleviates astrocyte activation and neurotoxicity.
caption: |-
  Inhibition of PERK signaling alleviates astrocyte activation and neurotoxicity. (A) Schematic diagram illustrating inhibition of the PERK pathway by ISRIB. (B–D) Bar charts showing relative expression of (B) PAN-specific, (C) A1-specific, and (D) A2-specific transcripts in primary astrocytes, analyzed by RT-qPCR. The experiment included four groups: Con, ISRIB, Mn, and Mn+ ISRIB (n = 3, * p < 0.05 vs. Con, ** p < 0.01 vs. Con, *** p < 0.001 vs. Con, #
  p < 0.05 vs. Mn, ###
  p < 0.01 vs. Mn, ns p > 0.05 vs. Mn). (E) Representative immunofluorescence staining showing the effect of Mn-induced A1-activation astrocytes on primary neuronal synapses. Synapse markers PSD95 (red) and SNAP25 (green) were visualized to evaluate colocalization., Scale bar = 50 μm. Enlarged views of boxed areas are shown below. (F) Quantitative analysis of SNAP25 and PSD95 colocalization in immunofluorescence images (n = 3, ** p < 0.01 vs. Con ACM, #
  p < 0.05 vs. Mn ACM)
