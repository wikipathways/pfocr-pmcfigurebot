figure_title: Chromosomal localization and functional characterization of TMOD2 and
  DOCK4 biomarkers.
caption: Chromosomal localization and functional characterization of TMOD2 and DOCK4
  biomarkers. (A) Chromosomal ideogram showing genomic locations of TMOD2 (chromosome
  15) and DOCK4 (chromosome 7). Red and blue markers indicate respective gene positions
  along chromosomal bands. (B) Subcellular localization prediction analysis using
  mRNALocater algorithm, showing probability distributions across cellular compartments.
  DOCK4 demonstrates predominant nuclear localization, while TMOD2 shows primary cytoplasmic
  distribution. (C) Correlation analysis between TMOD2 and DOCK4 expression levels
  revealing strong positive correlation (Pearson r = 0.66, p=0.00015). Gray shading
  represents 95% confidence interval of the regression line. (D) Protein–protein interaction
  (PPI) network constructed using STRING database, displaying functional relationships
  between TMOD2, DOCK4, and 20 associated proteins. Node colors represent different
  functional categories, while edge colors indicate interaction types (physical interactions,
  coexpression, predicted, colocalization, genetic interactions, pathway, and shared
  protein domains). Network analysis reveals enrichment in cellular component assembly,
  myofilament organization, and muscle cell development pathways
