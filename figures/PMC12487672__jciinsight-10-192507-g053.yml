figure_title: Spry1ΔEpi mice exhibit psoriasis-like symptoms and dysregulated glyceride
  metabolism
caption: (A) Experimental timeline of tamoxifen (TAM) administration to establish
  K14CreERT Spry1fl/fl (Spry1ΔEpi) mice. (B) Images of Spry1ΔEpi and WT mice showing
  psoriasis-like skin phenotypes in Spry1ΔEpi mice. (C) Hematoxylin and eosin (HE)
  staining of the back and ear skin of WT and Spry1ΔEpi mice. (D) Gene set enrichment
  analysis (GSEA) showing significant upregulation of the IL-17 signaling pathway,
  TNF signaling pathway, IL-1 beta production, and keratinization in the skin of Spry1ΔEpi
  mice. (E) Increased expression of inflammatory cytokines (IL23a, IL17, IL1b, S100A8,
  S100A9), keratinization (Keratin14, Keratin16), and cell proliferation (Ki67) in
  the epidermis of Spry1ΔEpi mice. n = 3 mice per genotype. (F) TG staining images
  showing epidermal TG distribution in Spry1ΔEpi compared with WT mice. (G and H)
  ELISA quantification of TG and DG levels in keratinocytes and supernatants from
  Spry1ΔEpi and WT mice. n = 5 samples per group. For all images, the original magnification
  is 20×. Scale bars = 50 μm. Two-tailed Student’s t test was performed. *P < 0.05,
  **P < 0.01, ***P < 0.001, ****P < 0.0001
article_title: DGAT2 reduction and lipid dysregulation drive psoriasis development
  in keratinocyte-specific SPRY1-deficient mice
