figure_title: Lipid associated molecules biosynthetic pathways regulate lactate longevity
caption: 'A) Schematic of metabolomics experiments comparing N2 and sir-2.1(ok434)
  animals on a control or lactate-enriched diet. Samples were harvested at day 1 adult
  stage.B-D) Quantification of lactate-regulated LPC (B), fatty-acylcarnitine (C),
  and N-acylethanolamine (NAE – D) in sir-2.1(ok434) (teal) mutants.E) Schematic of
  NAE biosynthesis pathway and lifespan curves of faah-1(tm5011) and faah-4(lt121)
  animals grown on control diet or lactate (10 mM). Dotted lines correspond to wildtype
  curves. 90 animals were scored per condition.F) Schematic of LPC/LPE biosynthesis
  pathway and lifespan curves for N2 animals treated with L4440 (empty vector), cept-1,
  pcyt-1, or lpla-2 RNAi. Animals were grown on a control diet or lactate (10 mM).
  90 animals were scored per condition.Statistics for lifespan curves were done using
  log-rank (Mantel–Cox) method. For each condition, 90 animals were analyzed (in triplicate),
  and each experiment was repeated at least twice. P-values for metabolite levels
  were calculated by an unpaired, two-sided t-test with Welch correction. *P<0.05;
  **P<0.01; ****P<0.0001. ns: Not significant. Metabolite measures represent one experiment,
  performed in triplicate. Each experiment was performed three times.G) Graphical
  summary of the proposed model from this study, highlighting the key mechanisms and
  significant findings'
