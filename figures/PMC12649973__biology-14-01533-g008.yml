figure_title: Analysis of 120 hpf larvae gene expression.
caption: 'Analysis of 120 hpf larvae gene expression. (A) Heatmaps showing the mean
  normalized gene expression (HKGs: actb2 and rps18) of fox genes (foxf1, foxk1, foxl1,
  foxm1l, and foxq1a), hox genes (hoxa3a, hoxc4a, hoxc6a, and hoxc8a), endoplasmic
  reticulum stress- and apoptosis-related genes (hspa5, ddit3, and casp3), canonical
  phenotype-related genes (sox2, ddx4, hand2, and cenpf3b), and dopamine- and serotonin-pathway-related
  genes (drd1b, drd2a, and mao). (B) Histograms of differentially expressed genes
  within each batch. (n = 6 independent experiments; 20–30 larvae pool per sample).
  Mean value ± SEM (n = 6) is represented. * p < 0.0500. ** p < 0.0100. ‘ns’: not
  statistically significant (p > 0.0500)'
