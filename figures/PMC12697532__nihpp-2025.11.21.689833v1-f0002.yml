figure_title: Loss of ATP8A2 induces nerve neuroinflammation and non-SARM1 dependent
  axon degeneration
caption: A–D) Staining of sciatic nerves of 2-month-old mice for Iba1 (pan-macrophages,
  green) and CD68 (activated macrophages, magenta) shows peripheral inflammation in
  Atp8a2 knockout mice (B). Knockout of Sarm1, to prevent the canonical cell-autonomous
  axon degeneration pathway, does not prevent activated macrophages from infiltrating
  peripheral nerves of Atp8a2 knockout mice (C). D–D’) Quantification of Iba1+ cells
  (D) and CD68+ cells (D’) normalized to controls. E–H) Toluidine blue staining shows
  axon degeneration in Atp8a2 knockout (F) compared to control motor-predominant femoral
  nerves (E), which is not rescued by knockout of Sarm1 (G). H) Quantification of
  axons per nerve shows significant degeneration in two-month-old Atp8a2 knockout
  femoral nerves. Scale bars = 50 μm. D, D’, H) ** p < 0.01, *** p < 0.001, **** p
  < 0.0001 by One-way ANOVA
