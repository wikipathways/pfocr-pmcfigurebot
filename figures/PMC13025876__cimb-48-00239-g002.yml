figure_title: Integrated network pharmacology analysis of TN in AML therapy.
caption: Integrated network pharmacology analysis of TN in AML therapy. (A) Structural
  formula of TN from the PubChem database. (B) Integrated TN targets derived from
  Swiss Target Prediction and PharmMapper. (C) Integrated AML targets derived from
  GeneCards, OMIM, and CTD database. (D) Venn diagram illustrating the overlap of
  candidate targets for TN and AML. (E) PPI network of the 198 overlapping genes constructed
  using the STRING database and Cytoscape software. (F) GO enrichment analysis of
  the 198 overlapping genes, illustrating BP, MF, and CC involved. Blue represents
  the top 10 BP, Orange indicates the top 10 CC, and Purple denotes the top 10 MF.
  (G) KEGG pathway enrichment analysis of the 198 overlapping targets, highlighting
  relevant signaling pathways and mechanisms
