figure_title: Partner-specific contributions to regional role differences
caption: '(a) Partner-level Δ-connectomes for five representative region–role combinations
  with significant cross-species divergence: anterior insula (source, target), superior
  temporal (source), inferior temporal (source), and anterior olfactory (source).
  Each subgraph shows the focal region (yellow) and its top five partner nodes, ranked
  by absolute mean Δ values across pairwise species comparisons. Node color indicates
  the direction of difference (green = higher in the numerator species, red = higher
  in the denominator species), node size and edge width scale with |Δ|, and edge direction
  reflects the focal role (outflow or inflow). These graphs identify specific partner
  pathways driving species differences, including strengthened temporal–insula reciprocity
  in humans, ventral-stream outflows in rhesus, and olfactory outflows in marmosets.(b)
  Brain renderings of focal regions and their partner pathways, grouped by the species
  that showed the maximum efficiency for each region–role combination. Top: human
  maxima in anterior insula and superior temporal cortex. Middle: rhesus maxima in
  inferior temporal cortex. Bottom: marmoset maxima in anterior olfactory cortex.
  Focal regions and partners are color-coded within each species rendering, while
  yellow overlays depict white-matter tracts linking the focal region to its partners.
  Together, these analyses reveal the partner-specific basis of regional role differences,
  pinpointing strengthened temporal–insula circuits in humans, ventral visual stream
  specialization in Old World primates, and preserved olfactory routes in New World
  primates'
article_title: Directed connectomes across species reveal conserved and divergent
  pathways of neural signaling
