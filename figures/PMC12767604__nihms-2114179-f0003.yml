figure_title: The B cell compartment exhibits a pro-inflammatory skewing during progression
  to clinical RA
caption: |-
  (A) Uniform Manifold Approximation and Projection (UMAP) plots of MBCs from ARI, HC1 and ERA showing B cell population labels (left) and Leiden clusters (right). (B) DEGs for Beff-C8 compared with Beff-C9 with selected genes labeled (left). Dot size in heatmap (right) indicates the fraction of cells with positive expression for selected effector population marker genes. (C) Specified IgH isotype identity, as frequency within each population, for Beff-C8 and Beff-C9. UND, undetermined. (D)
  IGHG3 gene expression by core naïve B cells of ARI and HC1. (E) Normalized expression of IgH constant gene germline transcription of IGHMD+ naïve B cells that differ between ARI and HC1. (F) CLR-transformed cytometry frequencies of naïve B cell cluster Bnve-S5 as CONV progress to clinical RA. Each participant’s longitudinal series is connected by a gray line, with a group trendline and 95% confidence interval in purple. (G) GSEA enrichment analysis with the top Reactome pathways among naïve B cells of ARI compared with HC1. (H and I) B cells were stimulated ex vivo and analyzed by intracellular flow cytometry. Experimental workflow (H) and RANKL+, IL-6+ and TNF+ cell frequencies within the stimulated naïve B cell populations of ARI and HC2 (I). Boxplots show median (centerline) and first and third quartiles (lower and upper bound of the box); whiskers show the 1.5x interquartile range of data. Violin plot shape is proportional to the density of data points (dots). Larger width represents a higher density of data points. P values were determined by a linear mixed model (B, G), Wald test (E, F), or Wilcoxon rank-sum test (J). FDR values are indicated for all panels. Values below 0.1 were considered significant
article_title: Progression to rheumatoid arthritis in at-risk individuals is defined
  by systemic inflammation and by T and B cell dysregulation
