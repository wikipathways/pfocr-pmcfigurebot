figure_title: Differential gene expression of cells in hypoxic versus normoxic conditions
caption: 'HTR-8/SVneo placental cells were cultured in hypoxic conditions in a STEMcell
  hypoxia chamber versus standard normoxic conditions (excluding DCVC-exposed groups).
  RNA was isolated, sequencing performed, and RNA-sequencing analysis was conducted
  using DEseq2 in R. A) Volcano plot comparing differentially expressed genes in hypoxic
  versus normoxic conditions. Genes with an FDR < 0.05 were considered significantly
  differentially expressed. Furthermore, genes fulfilling the following criteria are
  denoted by color: FDR <0.05 only (light green), genes with ∣ log2fold-change > 1
  ∣ (green), and genes with both FDR < 0.05 and ∣ log2fold-change >1 ∣ (dark green).
  B) The top ten significantly upregulated and downregulated genes ranked by log2fold-change
  (FDR <0.05). C) Pathway analysis showing significantly (FDR< 0.05) enriched hallmark
  gene sets separated into upregulated (4) and downregulated (0)'
article_title: Exposure to the trichloroethylene metabolite S-(1,2-dichlorovinyl)-L-cysteine
  under hypoxic conditions (%O2 =2%) alters differential gene expression and mitigates
  decreased invasion capacity, compared to normoxic conditions (%O2 ≥ 21%) in HTR-8/SVneo
  cells
