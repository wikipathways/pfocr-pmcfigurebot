figure_title: RNA-Seq, GO, and pathway analysis of Slfn14fl/fl PF4-Cre versus Slfn14+/+
  PF4-Cre control mice
caption: (A) RNA-Seq analysis and workflow from murine samples. (B and C) Volcano
  plots of RNA-Seq target genes significantly up- or downregulated from (B) platelets
  and (C) MKs derived from Slfn14fl/fl PF4-Cre mutant and Slfn14+/+ PF4-Cre control
  mice. The top 10 up- and downregulated protein coding transcripts are annotated.
  (D) GO enrichment analysis of upregulated genes in Slfn14fl/fl PF4-Cre mutant platelets.
  Selection of upregulated subontology term “molecular function” (MF). Significantly
  enriched GO terms were selected based on adjusted P value < 0.05. (E) GSEA map based
  on DEGs in KO platelets. (F) GO enrichment analysis of upregulated genes in Slfn14fl/fl
  PF4-Cre mutant MKs. Selection of upregulated subontology terms “biological process”
  (BP) and MF. (G) GO enrichment analysis of downregulated genes in Slfn14fl/fl PF4-Cre
  mutant MKs. Selection of downregulated subontology terms BP and MF
