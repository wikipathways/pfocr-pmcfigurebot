figure_title: BRD8 regulates growth and survival pathways in ER+/HER2+ cells
caption: '(A) Volcano plot highlighting differentially expressed genes between BRD8
  KO BT474 cells and BT474 cells. (B) GSEA Normalized Enrichment Scores (NES) of significantly
  altered pathways (p < 0.05) in BRD8-KO versus BT474 cells. GSEA enrichment plots
  of estrogen response early (C) and cell apoptosis (D) signatures in BRD8-KO BT474
  cells compared with parental BT474 cells. (E) Volcano plot showing differentially
  expressed genes in neratinib treated BRD8 KO vs. BT474 cells. (F) GSEA NES of statistically
  significant pathways (p<0.05) between BRD8 KO and BT474 parental cells upon treatment
  with neratinib. (G) GSEA enrichment plot of the estrogen response early genes in
  BRD8 KO cells compared with parental cells upon neratinib treatment. (H) Relative
  mRNA levels of cell cycle-related genes affected by BRD8 KO in BT474 cells. Mean
  ± SD, n=3, two-tailed unpaired Student’s t-tests was performed. (I) Relative mRNA
  levels of E2F1 in BRD8 KO or BT474 cells treated with DMSO or neratinib. Mean ±
  SD, n=3, Two-way ANOVA was performed. (J) BRD8 knockout validation by immunoblot
  (top) and SRB growth curves of BT474 and BRD8-KO clones (bottom). One-way ANOVA
  with multiple comparisons test was performed. (K) Flow cytometric quantification
  of Annexin V+ apoptotic cells in parental and BRD8-KO BT474 cells treated with DMSO
  or 200 nM neratinib for 4 h. Mean± SD, n=3, Two-way ANOVA with multiple comparisons
  test was performed. For panel A and E, FDR-adjusted p-value < 0.05, n=3, LogFC cutoff
  1.For all the test, n.s., not significant, *P < 0.05, **P < 0.01, and ***P <0.001.
  Notes: The BT474 BRD8 KO cells are referred to as KO-1'
