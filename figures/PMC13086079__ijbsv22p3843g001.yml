caption: 'Frmd5-interacting proteins are enriched in the Jak2-Stat3 signaling pathway
  in vivo. (A) Schematic diagram of the Frmd5 gene structure in the Flag-tagged mice
  model. Blue arrows indicate the positions of primers used for genotyping. (B) PCR
  genotyping results showing elongated amplification products following insertion
  of the Flag sequence into the Frmd5 locus. (C) IHC analysis of the distribution
  of the Flag-Frmd5 protein. (D) Mass spectrometry and Gene Ontology enrichment analysis
  of Frmd5-interacting proteins isolated from vaginal tissues of Frmd5+/+ and Frmd5flag/flag
  mice. (E) Analysis of apoptosis-related proteins identified in in the proteomic
  dataset, highlighting components of Jak-Stat signaling pathway. (F) Co-IP of vaginal
  tissue proteins from Frmd5+/+ and Frmd5flag/flag mice, visualized by Coomassie Blue
  staining, confirming the presence of Flag-Frmd5 and Stat3. (G) Multiplex immunofluorescence
  analysis showing the distribution of Jak2, Stat3, and Frmd5 in the vaginal epithelium.
  Scale bar: 100 μm. (H) Red markers highlight epithelial cells exhibiting strong
  signals of all three proteins. The fluorescence intensity profile along the white
  line in panel G is shown. The x-axis represents cell position, and the y-axis indicates
  fluorescence intensity. Scale bar: 200 μm'
