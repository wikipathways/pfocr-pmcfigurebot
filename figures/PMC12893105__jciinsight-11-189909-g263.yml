figure_title: IL-15 vaccine response signature observed in an E03/B57 dually restricted
  cluster
caption: (A) UMAP of Seurat clusters for antigen-specific subset of 10x Genomics dataset.
  (B and C) Metadata distribution of HLA (B) and controller status (C). (D) Metadata
  membership table of each Seurat cluster based on highest relative metadata-labeled
  cell number in each cluster. Control and activation status were assigned by cell
  using percentile cutoffs as indicated in Methods. Dual or tri-membership indicates
  that a similar number of cells from those conditions were represented in the indicated
  cluster. (E) Venn diagram of marker overlap by MAST between B57-, E01-, E03- and
  null-CD8s. (F) Bubble plot showing top Gene Ontology enrichment terms organized
  as, first, unique to given clusters, then top terms shared by all clusters, colored
  by marker gene count and sized by FDR [absolute log(Q)] value of term. (G) Heatmap
  of top genes included in each term organized by term and cluster. (H) Violin plot
  of top genes within vaccine response signature IL-15 signaling pathway. **P < 0.01,
  ***P < 0.001, ****P < 0.0001
