figure_title: Transcriptomic analysis and drug discovery workflow.
caption: Transcriptomic analysis and drug discovery workflow. Differentially expressed
  genes (DEGs) were identified by comparing each experimental group (No treatment
  [N], Anesthesia [A], and Anesthesia plus Wounding [AW]) with baseline tumors. Gene
  Ontology (GO) and KEGG pathway enrichment analyses were subsequently performed to
  characterize biological processes associated with perioperative interventions. Venn
  diagram analysis was used to identify wound-specific DEGs (WsDEGs) by excluding
  genes shared with the N and A groups. The resulting wound-associated transcriptional
  signatures were subjected to pattern-matching analysis using the REMEDY® platform
  based on the LINCS L1000 database to identify candidate compounds predicted to reverse
  wound-induced gene expression patterns
article_title: Time-Resolved Transcriptomic Profiling of Surgical Wounds Identifies
  Stage-Specific Therapeutic Targets for Residual Ovarian Cancer
