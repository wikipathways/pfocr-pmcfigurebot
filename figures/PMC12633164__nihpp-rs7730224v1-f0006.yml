figure_title: Synj1 and VPS35 function in the same pathway to regulate D2S trafficking
  and presynaptic surface availability
caption: A) Representative confocal images of live neuronal axons showing basal pHmS-D2S
  fluorescence at axons, intracellular pHmS-D2S revealed by NH4Cl, and their merged
  image. B-C) Summary of the measured axonal D2S surface fraction (left) and vesicular
  pH (right) for Synj1+/+ (n=14), Synj1+/− (n=15) midbrain neurons expressing pHmScarlet-D2S,
  pHmScarlet-D2S with BFP-VPS35 shRNA or pHmScarlet-D2S with VPS35-eGFP. Data from
  3 batches of cocultures. *p<0.05, **p<0.01, ****p<0.0001 ns = non-significant, two-way
  ANOVA with Turkey’s multiple comparison. D) Summary of the axonal D2S surface fraction
  (left) and vesicular pH (right) for Synj1DA cKO dopamine neurons (−/−, n=10) and
  those expressing AAV2/5-DIO-VPS35 (−/− VPS35AAV, n=17). ***p<0.001, Mann-Whitney
  test
