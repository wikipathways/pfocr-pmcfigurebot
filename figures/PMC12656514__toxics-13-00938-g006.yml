figure_title: GO and KEGG pathway enrichment analyses of hub DEPs.
caption: 'GO and KEGG pathway enrichment analyses of hub DEPs. (A) GO functional pathway
  enrichment analysis of DEPs in CK (control group without treatment), NPs, NPs-SeNPs,
  and NPs-SiO2NPs treatments. DEPs can be divided into three ontologies (Biological
  Processes (BPs), Molecular Functions (MFs), and cellular components (CCs)). Asterisks
  indicate significance of GO-term enrichment: ** p < 0.01, *** p < 0.001. (B) The
  significance of up-regulated and down-regulated DEPs on KEGG for the first 20 pathways
  in CK, NPs, NPs-SeNPs, and NPs-SiO2NPs treatments. The x-axis represents the rich
  factor and the y-axis represents the name of the path. Bubble size indicates the
  amount of DEPs involved, and bubble color indicates the degree of pathway enrichment.
  (For interpretation of the references to color in this figure legend, the reader
  is referred to the Web version of this article)'
