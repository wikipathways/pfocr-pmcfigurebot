figure_title: Effects of RCE on protein degradation-related pathways in tibialis anterior
  muscle.
caption: Effects of RCE on protein degradation-related pathways in tibialis anterior
  muscle. The protein levels of (A) The mRNA levels of myostatin, Trim63, and Fbxo32
  in tibialis anterior muscle were evaluated using RT-PCR with β-actin as a housekeeping
  gene. (B) Serum IL-15 levels were evaluated by an ELISA kit. (C) The protein levels
  of FoxO3a in the tibialis anterior muscle were evaluated using a Western blot with
  α-tubulin as a housekeeping gene. n = 3–6 per group. Data are expressed as the mean
  ± SEM of individual experiments. Group differences were assessed using one-way analysis
  of variance (ANOVA). Bars with different letters are significantly different (p
  < 0.05). CON, mice received no surgery and were supplemented with saline; IMM, mice
  received immobilization surgery and were supplemented with saline; RCL, mice received
  immobilization surgery and were orally administered RCE at 200 mg/kg/day; RCH, mice
  received immobilization surgery and were orally administered RCE at 400 mg/kg/day;
  Trim63, gene name of muscle ring finger 1; Fbxo32, gene name of muscle atrophy F-box;
  IL-15, interleukin 15; FoxO3a, forkhead box O3a; p-FoxO3a, phosphorylated FoxO3a
