figure_title: SC144 counteracted changes in lipid and fatty acid metabolism, but did
  not markedly alter amino acid metabolism
caption: '(A) Central steps in the breakdown of triacylglycerols into diacylglycerols
  and monoacylglycerols. ATGL: adipose triacylglycerol lipase; HSL: hormone sensitive
  lipase; MGL: monoacylglycerol lipase (B) Abundances of triacylglycerols are reduced
  in PAB-Veh and PAB-SC144. (C) Diacylglycerols were similar between all groups. (D)
  Abundances of monoacylglycerols are elevated in PAB-Veh RVs. (E) Long chain fatty
  acid species are decreased in PAB-Veh RVs compared to control and PAB-SC144. (F)
  Abundances of medium chain fatty acids are increased in PAB-Veh pigs. (G) Most acylcarnitines
  are increased in PAB-Veh RVs compared to control and PAB-SC144 RVs. (H) Key proteins
  and metabolites of the acylcarnitine shuttle in mitochondria. Red arrows (PAB-Veh)
  and blue equal signs (PAB-SC144) visualize changes in these metabolites compared
  to control. A carnitine molecule is exchanged for the CoA of a fatty acyl-CoA, and
  the subsequent acylcarnitine is transported into the mitochondrial matrix. The carnitine
  molecule is removed, and the fatty acyl-CoA undergoes beta-oxidation. ACS: acyl-CoA
  synthetase; CPT1: carnitine palmitoyltransferase I; CACT: carnitine acylcarnitine
  translocase; CPT2: carnitine palmitoyltransferase II. (I) PAB-Veh and PAB-SC144
  RVs had similar abundances of metabolites in the histidine metabolism pathway. (J)
  Many metabolites in the arginine and proline, and (K) methionine, cysteine, and
  taurine metabolism pathways were increased in PAB-Veh and PAB-SC144 RVs. Scale bars
  show z-scores of protein abundances across all 3 groups in B-G, I-K'
