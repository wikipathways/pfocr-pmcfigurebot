figure_title: HBT inhibited IAV-induced activation of the TGF-β/Smad3 pathway and
  fibrosis markers in vitro.
caption: 'HBT inhibited IAV-induced activation of the TGF-β/Smad3 pathway and fibrosis
  markers in vitro. (A) Seven active compounds from R. rosea L. were screened for
  their anti-influenza fibrosis efficacy in A549 cells, with a drug concentration
  of 50 μM and RBV as the positive control. After infection with IAV (MOI = 0.05),
  mRNA levels of Fn and Snail were measured 24 h post-treatment. (B) The chemical
  structure of HBT was presented. (C) The phosphorylation level of Smad3 was assessed
  in A549 cells treated with HBT at concentrations of 25 and 50 μM for 16 h after
  viral infection. (D) Phosphorylation levels of Smad3 in the nucleus were evaluated
  in A549 cells 18 h post-viral infection. (E) The effect of HBT on mRNA levels of
  Fn and Snail was analyzed in A549 cells 24 h after viral infection. (F) The impact
  of HBT on protein levels of Fn and Snail was determined in A549 cells 30 h post-infection.
  #, p < 0.05; ##, p < 0.01; ###, p < 0.005; Versus DMSO and *, p < 0.05; **, p <
  0.01; ***, p < 0.005; Versus DMSO+IAV'
