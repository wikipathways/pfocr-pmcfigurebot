caption: 'Effects of different treatments on post-thaw sperm motility and movement
  trajectories (n = 3): (a) Bar chart of the effects of different inhibitors (8-M-PDOT:
  10−6 M; 4-P-PDOT: 10−6 M; Luzindole: 10−6 M; LY294002: 10−5 M; SB415286: 10−5 M)
  on post-thaw sperm motility: “−” indicates the inhibition of corresponding receptors/pathways;
  different superscript letters indicate significant differences (p < 0.05). (b) Left:
  Sperm movement trajectory of the control group. Right: Sperm movement trajectory
  of the MT group (0.1 mg/mL). Red lines: Rapid progressive sperm. Green lines: Slow
  progressive sperm. Blue lines: Non-progressive sperm. Note: All inhibitors were
  equilibrated with sperm samples at 4 °C for 10 min before cryopreservation'
