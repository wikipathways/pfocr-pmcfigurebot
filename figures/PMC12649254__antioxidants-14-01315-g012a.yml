figure_title: Drug screening utilizing testicular transcriptome sequencing.
caption: Drug screening utilizing testicular transcriptome sequencing. (A) Five small-molecule
  compounds were identified through cMAP screening, with PTL demonstrating the highest
  binding affinity (−6.585 kcal/mol). (B) PTL was found to inhibit proteins associated
  with oxidative stress (n = 3). (C) PTL also suppressed proteins related to the NF-κB
  signaling pathway (n = 3). (D) Furthermore, PTL restored proteins involved in testosterone
  production (n = 3). Statistical significance was noted as * p < 0.05, ** p < 0.01,
  *** p < 0.001, **** p < 0.0001, ***** p < 0.00001
article_title: Parthenolide Restores Testosterone Biosynthesis After Nanoplastic Exposure
  by Blocking ROS-Driven NF-κB Nuclear Translocation
