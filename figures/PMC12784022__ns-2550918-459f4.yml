figure_title: Altered lysosomal membrane lipid composition was detected in intervertebral
  disc degeneration (IDD).
caption: 'Altered lysosomal membrane lipid composition was detected in intervertebral
  disc degeneration (IDD). (A and B) Metabolomics analysis for the whole nucleus pulposus
  (NP) cells. The principal component analysis (PCA) and orthogonal partial least
  squares-discriminant analysis (OPLS-DA) for metabolic profiling. The results indicated
  a clear separation between the 2 groups. (C) Volcano plot displays the significant
  differential metabolites. (D) Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis
  of the disturbed metabolic pathways related to IDD. (E and F) Lipidomics analysis
  for lysosomes. The PCA and OPLS-DA for metabolic profiling, indicating a clear separation
  between the 2 groups. (G) Volcano plot displays the significant differential metabolites.
  (H) KEGG analysis of the disturbed metabolic pathways. (I) The integration of metabolomics
  and lipidomics analyses has identified “glycerophospholipid metabolism (Has00564)”
  as distinct KEGG items. (J) The phosphatidylcholine (PC) abundance of whole NP cells
  was decreased in advanced-stage when compared to early-stage. n=6. (K) The lysosomal
  PC abundance was decreased in advanced-stage when compared to early-stage. n=5.
  (L) Simplified diagram of the multiomics analysis. (M and N) Western blotting analysis
  and quantification of lysophosphatidylcholine Acyltransferase 1 (LPCAT1) proteins
  in early- and advanced-stage. n=3. (O and P) IHC staining and quantification of
  LPCAT1 in early- and advanced-stage IDD. Scale bar: 50 μm. n=29 for early stage
  and 36 for advanced stage. (Q) The LPCAT1 positive cells were inversely correlated
  with the Pfirrmann scores (r=-0.897, p<0.001). LPC, lysophosphatidylcholine. Compared
  to early-stage IDD, **p<0.01 and ***p<0.001'
