figure_title: GO and KEGG enrichment analysis of candidate genes.
caption: 'GO and KEGG enrichment analysis of candidate genes. (A) Top 20 significantly
  enriched Gene Ontology (GO) terms across three domains, cellular component, biological
  process, and molecular function, visualized as a horizontal bar chart. (B) Four-layer
  KEGG pathway enrichment plot: Outermost layer: Functional classification of enriched
  pathways, with scale bars indicating gene counts. Second layer: Gene counts and
  adjusted p-values (FDR) for each background category. Longer bars represent higher
  gene counts; red intensity correlates with statistical significance (smaller p-values).
  Third layer: Total candidate gene counts per pathway. Innermost layer: Enrichment
  factor (candidate gene count in category/background gene count per category), with
  grid lines spaced at 0.1 intervals. Color gradients reflect enrichment significance
  (darker shades = higher significance)'
article_title: Identification of MAPK10 as a Candidate Gene for High Milk Production
