figure_title: Therapeutic Strategies targeting Ub pathways
caption: (A) Proteolysis-targeting chimeras (PROTAC) induces the ubiquitination of
  protein of interest (POI). PROTACs are comprised of E3-recruiting ligand, a warhead
  that recruits protein of interest (POI), and a linker. (B) Molecular glue degraders
  are small molecules that induce the interaction between E3 ligase and POI. Rather
  than bridging two proteins, molecular glues stabilize novel interfaces at the E3–substrate
  binding site, triggering ubiquitination and degradation. (C) Intramolecular bivalent
  glues (IBGs) are a novel targeted protein degradation (TPD) strategy that induce
  conformational changes in a target protein by bridging adjacent domains, promoting
  its recognition and degradation by E3 ligases without directly binding the ligase.
  (D) Degradation tails are electrophilic or hydrophobic groups fused to non-degrading
  ligands that promote target protein ubiquitination by forming covalent bonds with
  E3 ligases, enabling degradation of POI. (E) AbTACs use bispecific antibodies to
  bridge membrane proteins with transmembrane E3 ligases like RNF43, promoting ubiquitination,
  endocytosis, and lysosomal degradation
