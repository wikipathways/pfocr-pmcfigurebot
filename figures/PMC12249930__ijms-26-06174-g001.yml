figure_title: Oxidative stress pathways and RPE dysfunction in AMD.
caption: 'Oxidative stress pathways and RPE dysfunction in AMD. Schematic depicting
  key sources of oxidative stress (part 1), antioxidant defense mechanisms (including
  Keap1/Nrf2/ARE pathway) (part 2), and consequences of oxidative damage in the retinal
  pigment epithelium (RPE) during AMD pathogenesis (part 3). Mitochondrial dysfunction
  (part 4): lipofuscin accumulation. ROS, reactive oxygen species; PUFA, polyunsaturated
  fatty acids; RPE, retinal pigment epithelium; BrM, Bruch’s membrane; Nrf2, nuclear
  factor erythroid 2-related factor 2; Keap1, Kelch-like ECH-associated protein 1;
  ARE, antioxidant response element; sMaf, small Maf protein; HO-1, heme oxygenase-1;
  SOD2, superoxide dismutase 2; mtDNA, mitochondrial DNA; ETC, electron transport
  chain; ATP, adenosine triphosphate; 4-HNE, 4-hydroxynonenal; MDA, malondialdehyde.
  Upward arrow (↑) indicates enhancement/increase; downward arrow (↓) indicates reduction/decrease'
