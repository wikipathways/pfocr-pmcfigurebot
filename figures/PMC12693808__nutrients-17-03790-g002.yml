caption: Nitric oxide (NO) is generated by nitric oxide synthases (NOS), which convert
  L-arginine and oxygen in the presence of essential cofactors [e.g., NADPH, flavin
  adenine dinucleotide (FAD), tetrahydrobiopterin (BH4), haem, and calmodulin], producing
  L-citrulline as a by-product. Alternatively, dietary nitrate, found in leafy greens
  and beetroot, can contribute to NO formation through its reduction to nitrite (NO2−)
  by oral bacteria (a rapid pathway) and xanthine oxidase (a slower pathway), which
  can be converted to NO via acidic reduction in the stomach or via various systemic
  nitrite reductases. This pathway is reversible hence the dashed arrows. The concentration
  of NO is relevant to its effects; while NO may be neuroprotective, high concentrations
  could contribute to oxidative and nitrosative stress when dysregulated. Although
  beetroots antioxidants may counteract this as discussed later
