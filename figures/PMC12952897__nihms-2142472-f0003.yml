figure_title: ISR outcomes and therapeutic implications in stem cell biology.
caption: 'ISR outcomes and therapeutic implications in stem cell biology. The integrated
  stress response (ISR) pathway is shown with its four major stress-sensing kinases:
  PERK (endoplasmic reticulum stress), GCN2 (amino acid deprivation), PKR (viral dsRNA),
  and HRI (oxidative stress/heme depletion). These converge on phosphorylation of
  eIF2α, attenuating global protein synthesis while enabling ATF4-driven transcription.
  Pharmacological intervention points are highlighted: PERK inhibitors (e.g., GSK2606414,
  AMG44) block maladaptive ER stress; GCN2 modulators (e.g., tryptophan mimetics)
  tune amino acid–responsive signaling; HRI activators augment protective antioxidant
  programs; ISRIB rescues translation by antagonizing phospho-eIF2α effects at eIF2B.
  Disease contexts are illustrated as modules branching from stem cell populations:
  hematopoietic stem cells (HSCs; bone marrow failure, leukemia stem cells), neural
  stem cells (NSCs; neurodegeneration, repair), and epithelial stem cells (epidermal/intestinal;
  regeneration, cancer). Therapeutic goals are represented with icons: a shield symbolizes
  preservation of healthy stem cells, while a target indicates selective elimination
  of malignant or senescent cells. This schematic emphasizes how ISR and SASP modulation
  can be tailored to context, either protecting regenerative potential or suppressing
  pathological outcomes. Abbreviations: integrated stress response (ISR); senescence-associated
  secretory phenotype (SASP); eukaryotic initiation factor 2 alpha (eIF2α), Protein
  Kinase RNA-Like ER Kinase (PERK), General control nonderepressible 2 (GCN2), protein
  kinase R (PKR), heme-regulated inhibitor (HRI), activating transcription factor
  4,5 (ATF4,5), C/EBP Homologous Protein (CHOP), hematopoetic stem cell (HSC), neural
  stem cell (NSC), intestinal stem cell (ISC), epithelial stem cell (EpSC), ISR InhiBitor
  (ISRIB), Janus kinase (JAK), signal transducer and activator of transcription (STAT),
  Wingless-related integration site (Wnt), Mechanistic target of rapamycin kinase
  (mTOR), nuclear factor kappa-light-chain-enhancer of activated B cells (NF-κB).
  ChatGPT5 was used to make early versions of the figures, which were improved with
  Photoshop'
