figure_title: Early steps of HIV-1 replication and cGAS-STING pathway activation in
  response to viral cDNA.
caption: Early steps of HIV-1 replication and cGAS-STING pathway activation in response
  to viral cDNA. After HIV-1 capsid enters the cell cytoplasm, a cDNA copy of the
  viral genome is synthesized by the viral reverse transcriptase. The cDNA within
  the capsid is transported into the nucleus through the nuclear pore, where it becomes
  integrated into the host cell genome, leading to the productive infection. In the
  case of a premature capsid disassembly in the cytoplasm, viral cDNA is detected
  by cGAS, resulting in cGAMP production and activation of the cGAS-STING pathway.
