figure_title: A schematic diagram of post-transcriptional gene silencing (PTGS) and
  transcriptional gene silencing (TGS) as interconnected antiviral defense pathways
  in plants.
caption: A schematic diagram of post-transcriptional gene silencing (PTGS) and transcriptional
  gene silencing (TGS) as interconnected antiviral defense pathways in plants. In
  the left panel, PTGS is illustrated, where viral RNA molecules are recognized and
  degraded by 21–22 nt small interfering RNAs (siRNAs). These 21–22 nt siRNAs can
  also feed into a non-canonical RdDM pathway, resulting in sparse and locus-specific
  DNA methylation. This methylation recruits RNA polymerase IV (Pol IV), which initiates
  the canonical RdDM pathway. Pol IV transcribes single-stranded RNA (ssRNA), which
  is then converted into double-stranded RNA (dsRNA) by RNA-DEPENDENT RNA POLYMERASE
  2 (RDR2). The dsRNA is processed into 24-nt siRNAs, which guide de novo DNA methylation
  through ARGONAUTE proteins and associated factors. In addition, histone modifications
  and chromatin remodeling occur at these loci, further reinforcing transcriptional
  repression (right panel). Together, these epigenetic changes establish stable TGS
  and effectively inhibit viral DNA transcription. Arrows indicate the direction of
  molecular flow; the blue dotted line separates cytoplasmic and nuclear processes
