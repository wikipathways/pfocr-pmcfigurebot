figure_title: Ilimaquinone (IQ) activates the AMPK-mTOR signaling pathway and regulates
  lipophagy.
caption: Ilimaquinone (IQ) activates the AMPK-mTOR signaling pathway and regulates
  lipophagy. (A) C. elegans N2 worms were treated with IQ (100 μM) for 11 d, and bafilomycin
  A1 (16 μM) was added 6 h before the experiment. Differences in lipid accumulation
  were analyzed using Oil Red O staining. (B) Lipid accumulation in each group was
  quantified using the ImageJ software. Data are expressed as the mean ± SD of the
  lipid accumulation (% of total worm body area). (C) AML12 cells were treated with
  PA (50 μM) and/or IQ (1 μM), one group was treated with bafilomycin A1 (40 nM) in
  combination with PA and IQ, and the cells were incubated for 24 h. To measure the
  lipid accumulation in each group, BODIPY 493/503 staining was performed, and representative
  microscopic images are shown. (D) The amount of lipid droplets in each group was
  quantified as % area of Oil Red O positive cells using the ImageJ software. Graphs
  are presented as the mean ± SD of microscopic images from five different locations
  per group. (E) The protein amounts of LC3 and p62 were checked by WB after bafilomycin
  A1 treatment. (F) The expression of p-AMPK, p-mTOR, LC3, and p62 was confirmed using
  western blotting. Actin was used as an internal control. (G) After treatment with
  IQ (2 μM) on AML12 cells, the time-dependent expressions of p-AMPK, p-mTOR, LC3,
  and p62 were examined by western blot analysis. (H) The expressions of p-AMPK, p-mTOR,
  LC3, and p62 were confirmed using western blotting after treatment with compound
  C, an AMPK inhibitor. (I) The effect of compound C on the reduction of IQ-induced
  lipid accumulation was measured by BODIPY 493/503 staining and representative microscopic
  images are shown. (J) The amount of lipid droplets in each group was quantified
  as % area of BODIPY 493/503 positive cells using the ImageJ software. Results are
  presented as mean ± SD from three independent experiments. *P < 0.05, ***P < 0.001
  by Student’s t-test
article_title: Ilimaquinone-induced lipophagy diminishes lipid accumulation via AMPK
