figure_title: GPX4 promotes iron deposition and activates the TGF-β pathway to induce
  AMT eventually.
caption: 'GPX4 promotes iron deposition and activates the TGF-β pathway to induce
  AMT eventually. (A-A1) Immunofluorescence assay and cell count of PLIN1+α-SMA+ adipocytes
  in GPX4-OE, GPX4-OE+FAC, GPX4-OE+DFO groups. Scale bar: 200 μm. (B) Western blot
  examination and quantification of Collagen I, α-SMA, p-AKT, p-SMAD2/3, p-ERK1/2,
  and PLIN1 in adipocytes. (C) Western blot analysis of fibrosis-associated proteins
  in KD fibroblast cells treated with either control adipocyte cell media or GPX4-OE-pretreated
  adipocyte cell medium. (D-E) Cell proliferation and migration of KD fibroblast cells
  pretreated with adipocyte cell medium, with or without GPX4-OE treatment. The data
  in A and B1-B7 are analyzed using one-way ANOVA with the Tukey test. The Student''s
  t-test assesses data in C, D, and E. Data are expressed as mean ± SEM. All tests
  are conducted in triplicate. *P < 0.05; **P < 0.01; ***P < 0.001'
