figure_title: Hypothalamic AMPKα1-JNK1 signaling coordinates energy homeostasis via
  the SNS and PSNS
caption: 'AMP-activated protein kinase alpha 1 subunit (AMPKα1) activity in steroidogenic
  factor (SF1) neurons of the ventromedial nucleus of the hypothalamus (VMH) modulates
  endoplasmic reticulum (ER) stress and ceramide levels. This pathway enhances sympathetic
  nervous system (SNS) output to brown adipose tissue (BAT), promoting thermogenesis
  and energy expenditure. In parallel, c-Jun N-terminal kinase 1 (JNK1)-mediated activation
  of the parasympathetic nervous system (PSNS) elicits hepatic de novo lipogenesis
  and triglyceride (TGs) synthesis to fuel BAT. Dysregulation leads to defective BAT
  mobilization and impaired metabolic responses. This dichotomic mechanism plays a
  key role in mediating the central actions of thyroid hormones, and adaptation to
  cold exposure. Genetic ablation of JNK1 in SF1 neurons impairs the lipogenic effects
  of T3 and temperature defense upon cold. 3V: third ventricle; ARC: arcuate nucleus
  of the hypothalamus; β3-AR: beta-3 adrenergic receptor; T3: triiodothyronine; TRα:
  thyroid hormone receptor alpha'
