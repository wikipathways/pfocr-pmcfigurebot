figure_title: Schematic of nucleic acid-templated amyloidogenesis
caption: The schematic illustrates a potential amyloidogenesis pathway mediated by
  nucleic acid interactions. The assembly process initiates from monomeric precursors,
  typically exhibiting a net positive charge, that may exist in unfolded, partially
  folded, or fully folded conformational states. During the nucleation phase, the
  equilibrium between the protein and nucleic acid generates species with enhanced
  amyloidogenic potential, leading to self-assembly. Upon formation of the critical
  protein-nucleic acid nucleus complex, rapid β-sheet-rich amyloid fibril formation
  begins which also involves secondary structure changes from α-helix to β-sheet in
  the protein. These nuclei can subsequently coalesce to form larger β-sheet assemblies
  manifested as fibrils or films. However, the retention of nucleic acids within the
  amyloid infrastructure following higher-order assembly formation is still undetermined
article_title: Molecular recognition and structural plasticity in amyloid–nucleic
