caption: Western blot for TLR4 and NF-κB pathway-related proteins. Western blot was
  performed at 0, 15 min, 30 min, and 60 min after 200 µM H2O2 treatment. TLR4 showed
  increased protein synthesis compared to the control (at 0). NF-κB (p65) showed a
  gradual decrease in a time-dependent manner; pIκBα showed an increase at 15 min
  of treatment, gradually decreasing after. IκBα did not show any difference as time
  passed. These results are representative of three experiments. TLR4, toll-like receptor
