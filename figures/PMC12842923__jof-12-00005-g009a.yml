caption: Joint transcriptomic and metabolomic analysis of G. lucidum. (a–c) KEGG enrichment
  analysis of the DEGs and DAMs in J vs. M (a), K vs. N (b), and L vs. O (c) comparisons.
  Red and blue bars represent enrichment for DAMs and DEGs, respectively; (d) Putative
  pathway of cyanoamino acid metabolism in G. lucidum generated by KEGG analysis;
  (e) Putative pathway of glycine, serine and threonine metabolism in G. lucidum generated
  by KEGG analysis. The boxes highlighted in red or blue represent up- or down-regulation
  under high CO2 concentrations. The boxes highlighted in green mean both up- and
  down-regulation under high CO2 concentrations
