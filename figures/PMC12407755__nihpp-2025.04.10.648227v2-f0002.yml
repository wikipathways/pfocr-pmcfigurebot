figure_title: Design rationale for tandem scFvs that selectively bind EPO-R/CD131
caption: A. Schematic of the three bispecific fusion proteins explored in this work.
  Each consists of a previously published EPO-R binding scFv (Borges et al., 2008;
  Moraga et al., 2015) and a previously published CD131 binding scFv (Panousis et
  al., 2016). The first protein (TscFv) is a tandem scFv whereby the EPO-R scFv and
  the CD131 scFv are joined by a long linker to make a single chain, bispecific binder.
  The other two proteins consist of the binding moieties fused to the fragment crystallizable
  (Fc) region of mouse IgG2a. Fusion to Fc is expected to enhance half-life due to
  an increase in size (and therefore a decrease in the rate of renal clearance) and
  FcRn-mediated recycling (Kontermann, 2011). One Fc fusion consists of the scFvs
  individually fused to the N terminus of Fc, forming a bispecific antibody (BsAb),
  and the other consists of the entire TscFv fused to one half of Fc (TscFv-Fc). B.
  Schematic of endogenous signaling through EPO-R and CD131 compared to the desired
  pathway activation by our fusion proteins. EPO naturally signals through either
  homodimeric EPO-R (which mediates RBC and platelet generation) or EPO-R/CD131. Our
  fusion proteins are designed to eliminate the activation of EPO-R homodimers to
  mimic EPO-induced activation of EPO-R/CD131 with enhanced selectivity. C. Solved
  structure (PDB 4y5y) of the EPO-R scFv bound to EPO-R (Moraga et al., 2015) D. Solved
  structure of the CD131 scFv (PDB 5dwu) bound to one monomer of CD131 (Panousis et
  al., 2016). E. Alphafold 3 (Abramson et al., 2024) and PyMOL model of the potential
  structure of the tandem scFv in complex with EPO-R/CD131. We used Alphafold 3 to
  predict the interaction of each scFv with hEPO-R and (CD131)2. Then we aligned both
  structures using the common structural elements (i.e., hEPO-R and (CD131)2) using
  PyMOL. The resulting structure is one possible prediction of how EPO-R and CD131
  may interact. In this model the C-terminus of the EPO-R scFv is 88 angstroms away
  from the N-terminus of the CD131 scFv. We used this model to design the linker to
  our tandem scFv, ensuring it could span that distance
article_title: Rational design of selective bispecific EPO-R/CD131 agonists
