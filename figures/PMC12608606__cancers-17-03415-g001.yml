figure_title: FLT3 structure, mutations and targeted drugs with their binding domains.
caption: 'FLT3 structure, mutations and targeted drugs with their binding domains.
  The left panel illustrates the structure of the wild-type FLT3 receptor, consisting
  of an extracellular domain that binds FLT3 ligand, a transmembrane domain, juxtamembrane
  domain and tyrosine kinase domains with the activation domain loop. It also highlights
  key mutational hotspots: juxtamembrane domain (exon 14): site of internal tandem
  duplication (ITD) mutations, common in AML, and associated with hyperdiploid ALL
  (via deletions); Tyrosine kinase domain 2 (exon 20): harbors TKD point mutations,
  seen in AML; Receptor activation loop: mutations observed in hyperdiploid ALL and
  MLL-rearranged AML. The right panel pictures mutated FLT3and all of the drugs active
  against both types of mutations. Also depicts multiple downstream pathways critical
  for leukemogenesis: STAT5A-signal transducer and activator of transcription 5A;
  PIK-gene provides instructions for cell growth, division, and survival; SHP2-protein
  crucial for cell growth, differentiation and movement by regulating the RAS/MAPK
  signaling pathway [11]. This figure was generated using Biorender (https://www.biorender.com)
  (accessed on 20 October 2025)'
