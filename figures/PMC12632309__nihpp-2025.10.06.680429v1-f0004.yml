figure_title: RNA sequencing and proteomics revealed sexual dimorphic human islet
  responses to estradiol
caption: 'Human islets were treated with vehicle or estradiol (E2) for 18h and subjected
  to RNA-seq and proteomics. (A) Experimental design. (B) Shared and unique differentially
  expressed genes (DEGs) identified between male and female islets treated with and
  without PIC. (C) Volcano plots of differentially expressed genes in male islets
  (left panel) and female islets (right panel) treated with PIC compared to vehicle.
  (D) Hallmark pathway analysis of sex-specific differentially expressed genes. (E)
  GSEA of Hallmark: Interferon Gamma Response (bottom panel) in islets from male donors
  (top panel) and female donors (bottom panel) treated with E2 compared to vehicle.
  (F) Heatmaps depicting expression of the leading edge genes from Interferon Gamma
  Response GSEA in Vehicle vs. E2 conditions in islets from male donors (left panel)
  and female donors (right panel). (G) Shared and unique differentially abundant proteins
  (DAPs) identified in male and female islets treated with and without E2. (H) Bioplanet
  analysis of sex-specific differentially abundant proteins. Islets from human donors:
  N=10 males and N=10 females'
article_title: Islet-intrinsic sex differences in inflammatory signaling contribute
