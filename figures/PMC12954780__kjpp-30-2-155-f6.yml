figure_title: Schematic diagram of molecular mechanism
caption: In the absence of androsin, NOX2 generates ROS, which activates the downstream
  PI3K/Akt signaling pathway. Subsequently, Akt exerts two main effects. On one hand,
  Akt activates NF-κB and MMP7, thereby promoting the invasion and migration of HCT116
  cells. On the other hand, Akt activates mTOR and its downstream survival signaling
  pathways, thus promoting the proliferation of HCT116 cells. When androsin is applied,
  it inhibits the production of ROS by NOX2, thereby blocking the downstream signaling
  pathways centered on PI3K/Akt, resulting in the inhibition of proliferation, invasion,
  and migration of HCT116 cells. ROS, reactive oxygen species; MMP7, matrix metalloproteinase-7;
  mTOR, mammalian target of rapamycin; FAK, focal adhesion kinase
article_title: Androsin alleviates colorectal cancer by inhibiting the PI3K/Akt-centered
  signaling pathway
