figure_title: Management escalation ladder for persistently high sperm DNA fragmentation
  (SDF).
caption: 'Management escalation ladder for persistently high sperm DNA fragmentation
  (SDF). Stepwise pathway: (1) foundational mitigation (treat infection/inflammation
  and dysbiosis; address lifestyle/thermal/toxin exposures; shorter abstinence or
  second ejaculate); (2) structured 3-month antioxidant therapy with objective reassessment
  of OS and SDF; (3) varicocele repair when indicated with re-evaluation at 3–6 months;
  (4) advanced sperm selection in ART (microfluidics, hyaluronic-acid binding, ±high-magnification/IMSI);
  (5) consider testicular sperm for ICSI (TESE-ICSI) after failed ART and persistently
  high SDF (>25–30%). Abbreviations: ART, assisted reproductive technology; IMSI,
  intracytoplasmic morphologically selected sperm injection; TESE-ICSI, testicular
  sperm extraction–intracytoplasmic sperm injection. Created in BioRender. Kaltsas,
  A. (2026) https://BioRender.com/6cp04tj'
