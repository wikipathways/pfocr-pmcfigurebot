caption: |-
  Predicted dysregulated pathways populated by differentially expressed
  genes (p<0.05) that are also differentially spliced for each pairwise
  comparison at 12 and 29-week time points. (A) Bar graph
  representing the number of predicted activated and inhibited canonical pathways
  for each pairwise comparison. Activated pathways defined as
  −log(p-value)>1.3; z-score>1; inhibited pathways defined as
  −log(p-value)>1.3; z-score<−1. (B) Venn
  diagram showing the number of predicted dysregulated canonical pathways at
  12-week time point populated by differentially spliced and differentially
  expressed genes due to iAs exposure (DAS1 and DEG1; labeled as DAS1), miR-186
  overexpression (DAS2 and DEG2; labeled as DAS2) and joint effect of iAs exposure
  and mir-186 overexpression (DAS3 and DEG3; labeled as DAS3) as well as their
  overlap. (C) Heat map of predicted activated/inhibited canonical
  pathways populated by differentially spliced and differentially expressed genes
  at 12-week time point stratified by pairwise comparison (DAS1 and DEG1; DAS2 and
  DEG2; DAS3 and DEG3). The canonical pathways are presented in the same order as
  in Supplementary Table
  3 (Sheet 1-CP-12W). (D) Venn diagram showing the number
  of predicted dysregulated canonical pathways at 29-week time point populated by
  differentially spliced and differentially expressed genes due to iAs exposure
  (DAS4 and DEG4; labeled as DAS4), miR-186 overexpression (DAS5 and DEG5; labeled
  as DAS5) and joint effect of iAs exposure and mir-186 overexpression (DAS6 and
  DEG6; labeled as DAS6) as well as their overlap. (E) Heat map of
  predicted activated/inhibited canonical pathways populated by differentially
  spliced and differentially expressed genes at 29-week time point stratified by
  pairwise comparison (DAS4 and DEG4; DAS5 and DEG5; DAS6 and DEG6). The canonical
  pathways are presented in the same order as in Supplementary Table 3 (Sheet
  2-CP-29W). For panels (C) and (E), the color code bar
  on the right refers to the Z-score values. Absence of a bar (represented by
  white) signifies that the canonical pathway was not predicted to be
  activated/inhibited for that comparison at that time point
