figure_title: MAPK signaling pathway, cell cycle progression, and immune checkpoint
  pathways in melanoma.
caption: 'MAPK signaling pathway, cell cycle progression, and immune checkpoint pathways
  in melanoma. Top panel: Schematic of the MAPK and PI3K/AKT/mTOR signaling pathways
  and their downstream regulation of the cyclin–CDK–RB axis in melanoma. Activation
  of receptor tyrosine kinases (RTKs) by growth factors, cytokines, or mitogens stimulates
  the RAS–RAF–MEK–ERK and PI3K–AKT–mTOR cascades, promoting CCND1 transcription and
  Cyclin D–CDK4/6 complex formation. Cyclin D–CDK4/6 phosphorylates the pRB, releasing
  E2F transcription factors to drive cell cycle progression from G1 to S phase. Cyclin
  E–CDK2 and Cyclin A/B–CDK1 further regulate late G1/S and G2/M transitions. Cell
  cycle inhibitors from the CIP/KIP (p21CIP1, p27KIP1, p57KIP2) and INK4A (p15INK4B,
  p16INK4A, p18INK4C, p19INK4D) families negatively regulate CDK activity. FDA-approved
  targeted therapies are shown, including BRAF inhibitors (vemurafenib, dabrafenib,
  encorafenib) for BRAF-mutant melanoma and MEK inhibitors (trametinib, binimetinib,
  cobimetinib). CDK4/6 inhibitors (palbociclib, ribociclib, abemaciclib), also shown
  in red, are not FDA-approved for melanoma but are under investigation. Bottom panel:
  Interplay between tumor cells, antigen-presenting cells (APCs), and T cells in the
  context of immune checkpoint regulation. Left: T-cell inactivation occurs when tumor-derived
  PD-L1 binds PD-1 on T cells, or when FGL1 engages LAG-3, suppressing T-cell activation.
  APCs present tumor neoantigens via MHC class II molecules to the T-cell receptor
  (TCR). CTLA-4 binding to B7 competes with binding of CD28 and B7, attenuating T
  cell activation. Right: T-cell activation is restored by immune checkpoint blockade.
  Anti-PD-L1 (atezolizumab) and anti-PD-1 antibodies (pembrolizumab, nivolumab) disrupt
  PD-1/PD-L1 interactions, while anti-LAG-3 (relatlimab) blocks LAG-3/FGL1 signaling,
  and anti-CTLA-4 (ipilimumab) prevents CTLA-4–mediated inhibition, allowing CD28–B7
  co-stimulation, all of which activate T cells and eliminate tumor cells'
