  eNOS, p-AKT/total AKT, and p-PI3K/total PI3K. (f) Detection of related protein expression
  after the addition of the inhibitor LY294002. (g–j) Semiquantitative analysis of
  the phosphorylation levels of p-eNOS/total eNOS, p-AKT/total AKT, and p-PI3K/total
