caption: mRNA expression levels of FOXO3-dependent pathway components in RNASEH2 mutated
  LCLs and healthy control LCLs. (A–C) FOXO3, CYCS, and SOD2 mRNA expression levels
  evaluated by RT-qPCR and normalized to the β-actin gene in RNASEH2B- and RNASEH2A-mutated
  LCLs in the presence (72 h Met) or absence (NT) of 72 h metformin treatment. The
  bar graph represents the mean of three biological experiments (n = 3). Two-tailed
  Student’s t-test was performed, and data are expressed as means ± SEM; * p < 0.05.
  (D) Representation of the FOXO3 pathway and its interactions, constructed using
  STRING-pathway version 11.5
