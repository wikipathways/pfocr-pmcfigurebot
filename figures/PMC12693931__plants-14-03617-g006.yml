caption: 'Genes of the GA pathway expression in overexpressing lines, Crispr lines
  and wild type. (a) Venn diagram showing differentially expressed genes (DEGs) among
  wild-type (AC), SlHsfC1-overexpressing lines (OE6, OE12), and CRISPR-Cas9 knockout
  lines (CR16, CR41) based on RNA-Seq analysis. (b,c) Volcano plots showing differentially
  expressed genes (DEGs) in transcriptome comparisons between wild-type (AC) and SlHsfC1-overexpressing
  lines (OE6, OE12), as well as between wild-type and CRISPR-Cas9 knockout lines (CR16,
  CR41). Significantly upregulated genes (|log2FC| > 1, FDR < 0.05) are highlighted
  in red, downregulated genes in brown, and non-significant genes in blue. (d) Expression
  of gibberellin biosynthesis genes of RNA-Seq suggest that key genes. (e) Expression
  of gibberellin signal genes of RNA-Seq suggest that key genes. (f) RT–qPCR analysis
  validated the RNA-Seq results, confirming the altered expression of key genes involved
  in GA biosynthesis and GA signal transduction. Statistical significance was determined
  by Student’s t-test (n = 3): * p  <  0.05, ** p  <  0.01, *** p  <  0.001, ****
  p  <  0.0001'
