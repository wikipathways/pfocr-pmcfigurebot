caption: Proposed mechanism of dasatinib. Dasatinib has been demonstrated to increase
  glucose uptake in skeletal muscle, in part, through an PI3K/AKT-mediated pathway,
  which results in the translocated of GLUT4. The solid arrows represent the steps
  in the signalling pathway, which were not investigated in the study. The broken
  arrows represent processes that are suggested to be affected by SMTKI to enhance
  glucose uptake in this study
