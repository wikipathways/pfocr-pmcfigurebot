figure_title: m6A mRNA methylation landscape in wild-type mice after a 70% hepatectomy
  reveal enrichment for response to stress, hepatobiliary system development and response
  to wounding.
caption: m6A mRNA methylation landscape in wild-type mice after a 70% hepatectomy
  reveal enrichment for response to stress, hepatobiliary system development and response
  to wounding.(A) Histogram of log2 fold changes in input-corrected m6A across genes
  in hepatectomy (HEPA3) versus SHAM in WT mice. (B) m6A coverage plot across significant
  hypermethylated genes in HEPA3 vs. SHAM that had fold change magnitude above 1.5
  plotted against RNA landmarks, whose borders are demarcated by vertical dotted lines.
  (C) m6A coverage plot across significant hypomethylated genes in HEPA3 vs. SHAM
  that had fold change magnitude above 1.5 plotted against RNA landmarks, whose borders
  are demarcated by vertical dotted lines. (D) Venn diagram of m6A tagged genes classified
  as hypermethylated or hypomethylated (FDR<0.05). (E) Enriched gene ontology analyses
  of differentially m6A methylated genes. (F) Enriched pathway analyses of differentially
  methylated genes. N=4 in all groups
