figure_title: Signaling pathways regulating the balance between follicular dormancy
  and activation in mammalian ovaries
caption: 'Left panel: The PI3K/AKT/mTOR pathway is activated by growth factors, cytokines,
  and KIT ligand (KITL) binding to KIT receptors on the oocyte membrane. KIT/KITL
  signaling recruits phosphoinositide 3-kinase (PI3K), which converts phosphatidylinositol
  4,5-bisphosphate (PIP2) to phosphatidylinositol 3,4,5-trisphosphate (PIP3) and activates
  protein kinase B (AKT). Activated AKT phosphorylates forkhead box O3 (FOXO3), promoting
  its cytoplasmic translocation and inactivation, and also phosphorylates tuberous
  sclerosis complex 1/2 (TSC1/TSC2), which inhibits the mammalian target of rapamycin
  complex 1 (mTORC1). These events collectively relieve follicular dormancy, enabling
  oocyte growth and follicular progression. Phosphatase and tensin homolog deleted
  on chromosome 10 (PTEN) opposes PI3K activity, preventing premature follicle activation.
  Right panel: In the active Hippo pathway, mammalian STE20-like protein kinases 1/2
  (MST1/2) phosphorylate large tumor suppressor homologs 1/2 (LATS1/2), which in turn
  phosphorylate yes-associated protein (YAP) and transcriptional co-activator with
  PDZ-binding motif (TAZ). Phosphorylated YAP and TAZ are retained in the cytoplasm,
  preventing their interaction with transcriptional enhanced associate domain (TEAD)
  and maintaining follicular dormancy. When the ovary experiences tissue injury or
  mechanical stress, the Hippo pathway is disrupted, MST1/2 and LATS1/2 activity decreases,
  allowing YAP and TAZ to translocate into the nucleus, bind TEAD, and promote follicular
  activation'
