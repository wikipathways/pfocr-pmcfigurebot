caption: 'Transcriptome analysis of MDA-MB-231 cells treated with compound 5Z-7-Oxozeaenol
  vs. the control: (A) Volcanic map showing the differential gene expression distribution.
  The scattered dots in the figure represent individual genes, with grey dots indicating
  genes whose expression did not with not significantly differ, red dots representing
  upregulated genes whose expression did not significantly increased, and blue dots
  representing downregulated genes whose expression significantly decreased. (B) Construction
  of the PPI network for the identification of hub genes. Colored nodes: query proteins
  and first shell of interactors. White nodes: second shell of interactors. The red
  bars on the right side of the PPI chart represent: 11 up-regulated genes with |log2(FoldChange)|
  > 2.0 were selected from the DEGs. The green bars on the right side of the PPI chart
  represent: 20 down-regulated genes with |log2(FoldChange)| > 2.0 were identified
  from the DEGs. (C) GO functional enrichment analysis of the DEGs. (D) KEGG pathway
  enrichment of DEGs'
