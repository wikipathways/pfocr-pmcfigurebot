figure_title: ATP promotes the expression of P2RX7 in Tc1 and Tc9 cells.
caption: ATP promotes the expression of P2RX7 in Tc1 and Tc9 cells. (A) GSEA plot
  demonstrating a significant positive enrichment of the Purinergic Nucleotide Receptor
  Signaling Pathway gene set of Tc9 cells compared to Tc1 cells in vivo. (B) RNA-seq
  data showing differential mRNA expression of Purinergic Nucleotide Receptor Signaling
  Pathway gene set in endogenously sorted Tc1 and Tc9 cells. (C) Relative mRNA expression
  level of P2rx7 gene in Tc1 and Tc9 cells cultured in vitro under control condition
  or treated with ATP (100 μM). (D) Flow cytometry histogram showing P2RX7 protein
  surface expression on Tc1 and Tc9 cells cultured under control or ATP-treated conditions
  (100 μM). (E) Quantification of the MFI of P2RX7 protein expression in each group
  (n = 3 biologically independent replicates, each derived from naive CD8+ T cells
  isolated from individual mouse spleens). Data are presented as mean ± SEM. * p <
  0.05, *** p < 0.001, **** p < 0.0001
article_title: Extracellular ATP Functions as a Metabolic Lineage Selection Signal
