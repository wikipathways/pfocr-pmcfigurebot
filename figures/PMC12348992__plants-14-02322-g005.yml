figure_title: STRING analysis detecting protein–protein interaction dynamics of ABA–ethylene
  crosstalk.
caption: 'STRING analysis detecting protein–protein interaction dynamics of ABA–ethylene
  crosstalk. The analysis was performed by inputting a curated list of ABA- and ethylene-responsive
  genes into the STRING database with reference to Arabidopsis database. This analysis
  mapped the interactions between major signaling components and downstream effectors,
  emphasizing both direct and indirect associations within and across the two hormonal
  pathways. The interaction detected 10 nodes linked by 30 edges. Network nodes represent
  proteins, colored nodes indicate query proteins and the first shell of interactors,
  white nodes indicate the second shell of interactors, empty nodes indicate proteins
  of unknown 3D structure, and filled nodes indicate 3D structure proteins of known
  or predicted structures. The average node degree is 6 and the average local clustering
  coefficient is 0.83. The resulting protein–protein interaction (PPI) network (p-value:
  <0.83) revealed functional modules and hub proteins involved in stress responses.
  Colored lines represent various types of evidence supporting interactions. Green
  shows gene neighborhood, red indicates gene fusion, and blue reflects gene co-occurrence
  across genomes. Pink lines represent experimental evidence, light blue denotes curated
  database information, black shows co-expression, yellow indicates text mining, and
  lilac suggests protein homology. The thickness of the lines corresponds to confidence
  levels, with thicker lines indicating stronger evidence'
