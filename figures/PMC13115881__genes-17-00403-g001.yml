figure_title: Differential gene expression analysis of Control vs.
caption: Differential gene expression analysis of Control vs. Primary open-angle glaucoma
  (POAG). (A) Volcano plot showing the differential gene expression between the control
  and POAG groups. The x-axis represents the log2 fold change (logFC), and the y-axis
  represents the -log10 of the p-Value. Genes significantly upregulated in POAG are
  shown in orange, while genes downregulated in POAG are depicted in blue. The total
  number of differentially expressed genes is 195, with 65 upregulated and 130 downregulated.
  (B) Heatmap displaying the distribution of expression levels for the top differentially
  expressed genes across the control and POAG groups. The heatmap shows gene expression
  in the two groups, with higher expression levels represented in red and lower levels
  in blue. A hierarchical clustering approach was used to group the genes based on
  expression patterns. (C) Gene ontology (GO) enrichment analysis of differentially
  expressed genes. The plot shows the top enriched biological processes (BP), cellular
  components (CC), and molecular functions (MF) associated with the DEGs. The size
  of the dots represents the count of genes in each category, while the color indicates
  the significance of the enrichment (p-Value). (D) KEGG pathway enrichment analysis
  of differentially expressed genes. The plot highlights the top enriched signaling
  pathways and processes. Pathways related to immune response, metabolism, and cell
  structure are prominently represented, such as the IL-17 signaling pathway, tyrosine
  metabolism, and corneous envelope formation
