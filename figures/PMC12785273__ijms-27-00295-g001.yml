figure_title: Overview of the biologically informed machine learning framework with
  a bio-centric interpretability scheme based on the mode of action of therapeutic
  agents in preventing ethanol-induced impairment in NCCs.
caption: Overview of the biologically informed machine learning framework with a bio-centric
  interpretability scheme based on the mode of action of therapeutic agents in preventing
  ethanol-induced impairment in NCCs. (A) Ethanol disrupts key epigenetic regulators,
  including miR-34a, DNMT3a, HDAC, miR-125b, and miR-135a, leading to impairment of
  NCC differentiation, migration, and survival through pathways involving Atg9a, Snail1,
  EMT, Bcl-2, PUMA, Siah1, p38 MARK, and P53, leading to developmental defects associated
  with prenatal alcohol exposure and FASD. In contrast, dietary supplements may exert
  protective effects by modulating these epigenetic regulators, restoring the disrupted
  pathways, and mitigating ethanol-induced impairments in NCC differentiation, migration,
  and survival. This figure was constructed primarily based on previous findings [17,18,21,22,23,26,43,44,45,46]
  and reviews [1] from our laboratory, and served as the conceptual foundation for
  the subsequent computational modeling. Vertical red arrows indicate the direction
  of ethanol-induced changes in epigenetic regulators, with upward arrows representing
  upregulation and downward arrows representing repression. Similarly, vertical green
  arrows depict the regulatory effects of therapeutic agents, indicating upregulation
  or repression of epigenetic regulators in NCCs. Additionally, the dashed arrows
  depict that ethanol-induced impairments in NCC differentiation, migration, and survival
  may contribute to FASD. T-shaped arrows represent inhibition. (B) The biologically
  informed machine learning framework integrates literature, databases, and expert-curated
  data to retrieve key epigenetic regulators and the chemical structure information
  of dietary supplements or nutrients, and is refined using experimentally validated
  targets characterized in our laboratory (as shown in (A)), enabling targeted prediction
  of compound-induced regulatory effects. After digital encoding, a machine learning
  model is trained to predict whether dietary compounds can upregulate or downregulate
  specific epigenetic regulators. This allows for in silico screening of potential
  protective agents against ethanol-induced epigenetic disruptions and NCC impairment
article_title: Biologically Informed Machine Learning Prioritizes Dietary Supplements
  That Protect Neural Crest Cells from Ethanol-Induced Epigenetic Dysregulation and
  Developmental Impairment
