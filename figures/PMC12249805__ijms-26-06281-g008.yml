figure_title: The UBC9-mediated SUMO pathway stabilizes PHB1 and promotes its nuclear
  accumulation in U2OS cells.
caption: The UBC9-mediated SUMO pathway stabilizes PHB1 and promotes its nuclear accumulation
  in U2OS cells. (a) Co-expression of UBC9 and SUMO isoforms enhances PHB1 protein
  levels. U2OS cells were transfected with the pLPC-3xFlag-PHB1 alone or co-transfected
  with different components of the SUMOylation pathway (UBC9; UBC9 + Sumo1; UBC9 +
  Sumo2; UBC9 + Sumo3). Total cell lysates were analyzed by Western blotting using
  an anti-Flag antibody to detect Flag-PHB1 protein levels. (b) The nuclear accumulation
  of PHB1 is dependent on its SIM in the presence of UBC9 and SUMO-1. U2OS cells were
  transfected with Flag-tagged PHB1, PHB1-NLS, or PHB1-ΔSIM constructs, in the presence
  or absence of co-transfected Myc-SUMO-1 and UBC9. The nuclear proteins (=X-N), as
  well as total proteins (X-T), were isolated from cells transfected with pLPC-3xFlag-PHB1,
  PHB1-NLS, or PHB1-∆SIM in the presence or absence of myc-SUMO1 and UBC9. Anti-GAPDH
  was used as a cytoplasmic loading control, and anti-Lamin was used as a nuclear
  loading control, demonstrating successful cell fractionation. (c) U2OS cells were
  transfected with UBC9 alone or co-transfected with pCMV4-myc-SUMO1, HA-SUMO2, and
  myc-SUMO3 or with the empty vector. Total (T), cytoplasmic (C), and nuclear (N)
  protein extracts were isolated. Western blot analysis using an anti-PHB1 antibody
  reveals changes in endogenous PHB1 subcellular localization. Anti-GAPDH and Anti-Lamin
  A/C were used as loading controls for cytoplasmic and nuclear fractions, respectively
