figure_title: Transcriptional changes and pathway alterations during adaptation to
  anoikis over time
caption: (A and B) UpSet plots of upregulated (A; P < 0.05, L2FC > 1.5) and downregulated
  (B; P < 0.05, L2FC < –1.5) genes in OV90 across P0 vs. P1, P3, P4, P6, and P7 comparisons.
  (C) Heatmap of DEGs (L2FC) for individual replicates (P0–P7) clustered by Euclidean
  distance; attached and suspension time points indicated. (D) GSVA heatmap of hallmark
  pathway normalized enrichment scores (NES) for OV90 samples (P0–P7) clustered by
  Euclidean distance. (E) Scatterplots of NES for epithelial-mesenchymal (left), apoptosis
  vs. oxidative phosphorylation (right), and apoptosis vs. MYC targets V2 (bottom)
  across passages. ssGSEA, single-sample gene set enrichment analysis. (F) Western
  blot for c-MYC in indicated OV90 cells (left), c-MYC knockdown validation (middle),
  and percent survival in suspension of P7 OV90 cells after siMYC knockdown (right).
  ****P < 0.0001, 2-tailed unpaired t test. Data are mean ± SEM
