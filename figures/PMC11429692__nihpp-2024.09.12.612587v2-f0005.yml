figure_title: Overexpression analysis reveals that the rate-limiting step of DptA
  production is downstream of peptidoglycan receptor activation
caption: '(Previous page.) (A) Schematic of IMD pathway activation. Here we focus
  on two isoforms of a peptidoglycan recognition protein, PGRP-LC.x and PGRP-LC.a,
  which both in turn activate Imd. The cartoons are inspired by [47]. (B) Schematic
  of the cross used to express Imd signaling components in the fat body and read out
  the response of the DptA reporter. mCD8 is a membrane marker used as a positive
  control for uniform fat body activation. (C)-(L) Normalized fluorescence distributions
  along the anterior-posterior axis (left) and representative widefield images (right)
  of the various activation conditions. (C)-(D) E. coli injection generates a “U-shaped”
  expression profile (24 hours post injection; “partial responders” only, see Fig.
  1). N = 10 larvae. (E)-(F) PGRP-LC.a overexpression phenocopies the E. coli partial
  response. N = 18 larvae. (G)-(H) PGRP-LC.x overexpression produces a largely “U-shaped”
  expression pattern, though with some additional expression in the lateral fat body.
  N = 15 larvae. (I)-(J) Overexpression of a constitutively active form of Imd, ImdCA
  [48], produces a largely uniform 1D expression profile along the anterior-posterior
  axis due to strong expression in the lateral fat body. However, larvae consistently
  lack expression in the middle dorsal lobes of the fat body. N = 22 larvae. (K)-(L)
  The membrane marker mCD8-mCherry shows a uniform expression profile, with small
  dips due to the anatomy of the fat body (see Methods: Image analysis for image analysis
  details). The dorsal-middle lobes of the fat body, which show the weakest DptA-GFP
  expression, are highlighted. N = 16 larvae'
article_title: Spatial microenvironments tune immune response dynamics in the Drosophila
  larval fat body
