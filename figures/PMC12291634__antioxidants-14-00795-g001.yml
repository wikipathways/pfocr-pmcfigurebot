figure_title: Transcriptomic analysis of C2C12 muscle cells treated with JGT-W or
  JGT-E.
caption: 'Transcriptomic analysis of C2C12 muscle cells treated with JGT-W or JGT-E.
  (A) Volcano plots depicting differentially expressed genes (DEGs) in C2C12 myotubes
  treated with JGT-W or JGT-E at a high dose (H). Genes significantly upregulated
  or downregulated (|log2 fold-change| > 1, adjusted p < 0.05) are marked in red or
  blue, respectively. (B) Venn diagrams illustrating the overlap and differences between
  significantly upregulated (left) and downregulated (right) DEGs from JGT-W and JGT-E
  treatments. (C) Gene set enrichment analysis (GSEA) results comparing enriched molecular
  pathways between JGT-W and JGT-E-treated cells at low (L, 20 μg/mL), medium (M,
  100 μg/mL), and high (H, 500 μg/mL) doses. Normalized enrichment score (NES) is
  indicated by color intensity. Statistical significance of the false discovery rate
  (FDR) is indicated by asterisks: * FDR < 0.05, ** FDR < 0.01, *** FDR < 0.001. (D)
  Representative GSEA plots highlighting key pathways, including oxidative phosphorylation,
  TGF-β signaling, mitochondrial function, PGC-1α signaling, mTORC1 signaling, and
  ERRα targets. The dotted horizontal line in each GSEA plot represents the maximum
  or minimum enrichment score for the gene set across the ranked gene list'
