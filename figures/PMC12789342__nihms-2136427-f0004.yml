figure_title: Pharmacologically blocking the CX3CL1/CX3CR1 chemotactic pathway blunts
  the Ang-II-induced pressor response.
caption: 'Pharmacologically blocking the CX3CL1/CX3CR1 chemotactic pathway blunts
  the Ang-II-induced pressor response. A Location of Cx3cl1 mRNA expression based
  on the single-nuclei RNA-seq data collected from the PVN and adjacent tissue. Upper
  panel: mRNA location; lower panel: UMAP for individual cell clusters. B, C Schematic
  and image of the administration route for Ang-II or antagonists. Scale bar, 50 μm.
  D Representative blood pressure (BP) recording traces from awake WT mice. E Summary
  data of the BP increase (mean arterial pressure, ΔMAP) in awake WT mice undergoing
  Ang-II injection (100 ng/100 nL) into the PVN with or without injection of AZD8797
  (a selective blocker of CX3CR1, 5 μmol/L per 100 nL, 30 min before Ang-II injection);
  and with or without injection of TRAM34 (a selective blocker of IKCa1 to inhibit
  microglial migration, 10 mg/kg in 100 nL, 30 min before Ang-II injection). F Representative
  BP recordings from anesthetized WT mice. G Summary data of BP increase (ΔMAP) in
  anesthetized WT mice undergoing Ang-II injection (100 ng/100 nL) into the PVN with
  or without injection of AZD8797 (5 μmol/L per 100nL, 30 min before Ang-II injection);
  and with or without injection of TRAM34 (10 mg/kg in 100 nL, 30 min before Ang-II
  injection). Each data point represents an individual mouse, n = 7–9 mice. Data are
  shown as the mean ± SEM. *P<0.05, **P<0.01, ***P<0.001 vs Ang-II, one-way ANOVA
  followed by Dunnett post tests'
