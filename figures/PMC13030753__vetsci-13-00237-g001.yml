caption: 'Proposed mechanistic pathway linking zoonotic tuberculosis (M. bovis) infection
  in livestock to increased susceptibility to secondary bacterial mastitis and its
  downstream impacts. Initial infection with M. bovis can impair host immunity by
  reducing interferon-gamma (IFN-γ) production, shifting the immune profile from a
  Th1-dominated to Th2-biased response, and reducing macrophage bactericidal capacity.
  This immune modulation predisposes the mammary gland to colonization by common mastitis
  pathogens, including Staphylococcus aureus, Streptococcus agalactiae, Escherichia
  coli, and Klebsiella pneumoniae. The resulting co-infection can lead to elevated
  somatic cell counts, reduced milk yield, carcass condemnation, and prolonged treatment
  durations, while also creating a zoonotic risk via raw milk consumption. Integrating
  bTB surveillance with mastitis control strategies is essential in endemic areas
  to break this cycle of immune compromise and economic loss. Notes: ↓ Milk yield
  means milk production decreases. ↑ SCC → The upward arrow means somatic cell count
  (SCC) increases'
