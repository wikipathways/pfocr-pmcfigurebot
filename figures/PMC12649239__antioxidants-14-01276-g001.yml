figure_title: Rotenone activates the NLRP3 inflammasome and cGAS–STING pathway in
  THP-1 macrophages.
caption: Rotenone activates the NLRP3 inflammasome and cGAS–STING pathway in THP-1
  macrophages. THP-1-derived macrophages were treated with rotenone at the indicated
  concentrations for 6 h. (A) Protein expression was analyzed by Western blot. Quantification
  of band intensities is shown in the right panels. NLRP3 and ASC were normalized
  to GAPDH, and the N-GSDMD was normalized to total GSDMD. (B) IL-1β secretion was
  measured by ELISA. (C) Expression levels of cGAS were normalized to GAPDH, while
  the p-STING and p-TBK1 levels were normalized to total STING and TBK1. (D) BMDMs
  were treated with rotenone at the indicated concentrations for 6 h, as in the THP-1
  cells. Data are presented as the mean ± SD (n = 3). Statistical significance was
  determined by one-way ANOVA followed by Tukey’s post hoc test. * p < 0.05, ** p
  < 0.01, *** p < 0.001
