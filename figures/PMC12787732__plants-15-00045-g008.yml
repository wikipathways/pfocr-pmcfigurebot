figure_title: Model of dynamic jasmonate signaling in wounded Capsicum annuum leaves.
caption: Model of dynamic jasmonate signaling in wounded Capsicum annuum leaves. The
  dynamic changes in jasmonoyl-isoleucine (JA-Ile) levels reflect the transcription
  and post-translational regulation of the genes and proteins involved in jasmonate
  biosynthesis and signaling. JA-Ile levels increase within the first few minutes
  after wounding, reaching maximal levels after 1 h and decreasing by 6 h. In the
  early response to wounding (30 min, 1 h), there is an increase in the expression
  of genes encoding jasmonate biosynthetic enzymes (CaPLA, CaLOX, CaAOS, CaAOC, CaOPR3,
  CaAIM1) (Figure 3). Further positive regulation of the jasmonate pathway is observed
  with the upregulation of F-box proteins and the E3 ubiquitin ligases PUB22/23, as
  well as the MYC2/3/4 transcription factors (Figure 7B). Specifically focusing on
  CaLOXs, CaLOX8 and CaLOX2, which are rapidly expressed in response to wounding,
  both encode proteins with a Ser at the predicted phosphosite that may be dephosphorylated
  in response to wounding, contributing to the initial wound-associated jasmonate
  burst. At 6 h post-wounding, increased retention of exon 4 of CaLOX8 is predicted
  to shield the enzymes’ active site, resulting in lower CaLOX8 activity. At this
  timepoint, CaLOX7, which encodes a protein with an Ala at the phosphosite, is expressed,
  which may contribute to sustained jasmonate production. Increased expression of
  JAZ genes is also observed, tempering jasmonate signaling (Figure 7B). Jasmonate
  signaling is shut off in the late response through the induction of genes encoding
  the jasmonate-deactivating jasmonate-induced oxygenases (JOXs) and members of the
  cytochrome P450 94 family (CYP94). Heatmaps represent the ratio of gene expression
  in wounded/undamaged plants, with red indicating high gene expression. Figure created
  with BioRender (https://www.biorender.com/)
article_title: Transcription, Alternative Splicing, and Post-Translational Regulation
  of CaLOXs in the Dynamic Regulation of Jasmonate Levels in Wounded Pepper Leaves
