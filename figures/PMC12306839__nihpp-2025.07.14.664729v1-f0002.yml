figure_title: Ethanol alters tumor phenotype and decreases tumor immunogenicity
caption: (A-B) RNA sequencing of tumors from patients with lung cancer, regular drinkers
  (>1 drink/week N=38) vs. occasional drinkers (≤1 drink/week, N=59). (A) Volcano
  plot of RNA sequencing of human lung tumors. (B) Heat map of most significantly
  differentially expressed genes of p < 0.001. (C-D) Ingenuity pathway analysis (IPA)
  of differential pathways (z-score greater than +/− 2) identifying altered pathways
  such as increased oxidative phosphorylation and decreased Granzyme A, IL7, and TRAIL
  signaling. (E-H) RNA sequencing of MB49 tumor cell lines +/− ethanol (50mM, 24 hours).
  (E) Volcano plot of RNA sequencing showing several differentially expressed genes.
  (F) IPA depicts identifying altered pathways such as increased oxidative phosphorylation
  and decreased interferon response. (G) RT-PCR confirmed reduced immunogenicity found
  by RNAseq with reductions in expression of IFNβ, IFNγ, IL-1β, and TNFa (One-way
  Anova). (H) Volcano plot of genes from MB49 RNAseq associated with antigen presentation
  machinery finding a decrease in immunoproteasome subunit genes, while an increase
  in constitutive proteasome subunit genes
