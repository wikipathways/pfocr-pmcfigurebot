figure_title: Mechanism of magnesium reabsorption in the thick ascending limb of the
  loop of Henle.
caption: 'Mechanism of magnesium reabsorption in the thick ascending limb of the loop
  of Henle. In the TAL, the apical NKCC2 and the renal outer medullary potassium channel
  (ROMK) facilitate the reabsorption of cations, primarily Ca2+ and magnesium (Mg2+),
  through a paracellular pathway mediated by tight junction proteins (claudins 10,
  14, 16, 19). Activation of the calcium-sensing receptor by high calcium levels leads
  to the inhibition of NKCC2 via its effects on ROMK and also suppresses passive paracellular
  calcium absorption through the modulation of claudins. Abbreviations: TAL: thick
  ascending limb of the loop of Henle; NKCC2: sodium-potassium-chloride (Na+-K+-2Cl−)
  cotransporter; ROMK: renal outer medullary potassium channel; Ca2+: calcium; Mg2+:
  magnesium; Na+: sodium; K+: potassium, Cl−: chloride; ClC-Kb: chloride channel Kb'
