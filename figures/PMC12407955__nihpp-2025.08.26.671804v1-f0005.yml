figure_title: Statistically differential genes and associated immune response profiles
  in humans vaccinated with LAIV and TIV based on VIGET OSEAN data analysis
caption: (a) Venn diagrams of the lists of differential genes in female, male, or
  all human subjects stimulated by LAIV and TIV. (b-d) show enriched Reactome immune
  system pathway profiles in female, male, or all human subjects stimulated by different
  vaccines, in which the combined LAIV/TIV-stimulated gene lists are used in (b),
  LAIV-stimulated gene lists are used in (c), and TIV-stimulated gene lists are used
  in (d). Boxes in red contain gene lists that did not have any statistically significant
  neutrophil degranulation or interleukin-4 and 13 signaling. The Reactome web tool25
  was used in the generation of (b-d) figures. Supplemental File 2 contains the CSV
  files containing the full results of the Reactome functional analysis for this figure.
  Full version of the pathway images from (b-d) figures can be found in Supplemental
  Figures 1–9
