figure_title: SSD activates HDAC5 transcription via HIF1α signaling.
caption: SSD activates HDAC5 transcription via HIF1α signaling. (A-B) Proteomic analysis
  of SSD influence on protein changes, showing significant alterations in signal transduction
  pathways, with notable activation of the HIF-1 pathways. (C-E) Realtime PCR and
  WB analyses of HIF1α expression in SSD-treated MDA-MB-231 and -468 cells. (F) Truncated
  mutant HDAC5-#1~4 according to JASPAR database potential binding sites for HIF1α
  within the -2kb region of the HDAC5 promoter were cloned into pGL3 luciferase reporter
  vectors. (G-H) Luciferase assays of SSD treatment or HIF1α overexpression effect
  on HDAC5 promoter activity. (I-K) ChIP-qPCR analysis revealed that SSD stimulation
  obtained a higher yield of HDAC5 promoter DNA located to ChIP2 primers amplified
  region DNA
