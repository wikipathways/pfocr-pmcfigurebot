figure_title: Pseudotemporal dynamics of NTG-induced microglial activation and fate
  determination.
caption: Pseudotemporal dynamics of NTG-induced microglial activation and fate determination.
  (A) Trajectory reconstruction revealing bifurcating differentiation paths. (B) Distribution
  of microglial subtypes (M1–M5) projected along the trajectory. (C) Differentiation
  potential inferred by CytoTRACE, with highest scores in M4 (root) cells. (D) Cell
  state assignments across pseudotime. (E) Heatmap of dynamic gene expression along
  the trajectory. (F) Comparison of pseudotime-defined cell state proportions between
  CON and NTG groups. (G) Relative abundance of microglial subtypes within each pseudotime-defined
  state. (H) Heatmap of branch-specific fate biases and their enriched functional
  pathways. (I,J) Condition-specific trajectories for CON and NTG groups, with corresponding
  gene expression patterns shown in heatmaps. (K,L) M1- and M2-like signature scores
  among microglial subtypes. (M) No correlation observed between M1 and M2 signature
  scores, indicating independent polarization trajectories
