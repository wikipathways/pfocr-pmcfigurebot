figure_title: Overlapping and distinct pathophysiological mechanisms in schizophrenia
  and Alzheimer’s disease leading to cognitive impairment.
caption: 'Overlapping and distinct pathophysiological mechanisms in schizophrenia
  and Alzheimer’s disease leading to cognitive impairment. This schematic outlines
  a model detailing how schizophrenia (left, blue-shaded area) and Alzheimer’s disease
  (right, red-shaded area) develop cognitive impairment through both unique and shared
  pathological pathways. The model begins with a common foundation of shared genetic
  susceptibility, identified by overlapping risk alleles from GWAS, which is known
  to trigger microglial and astrocytic activation. This activation, involving signaling
  through SYK and RAGE, proceeds with a central pathogenic cascade. Key elements of
  the cascade include dysregulated RAGE/S100B signaling, subsequent NMDA receptor
  dysfunction, and, ultimately, mTOR pathway dysregulation, all converging to produce
  cognitive deficits like memory loss and attention problems. Distinctly, the pathways
  predominantly associated with Schizophrenia emphasize cytokine release (IL-1β, IL-6,
  TNF-α), leading to pronounced neuroinflammation and BBB disruption. These schizophrenia-specific
  processes are shown to significantly impact and feed into the shared central mechanism,
  particularly exacerbating RAGE/S100B signaling and NMDA dysfunction. Conversely,
  while AD also involves cytokine release, it distinctively leads to heightened oxidative
  stress and ROS production, which in turn contribute to impaired autophagy and cellular
  senescence. These AD-specific dysfunctions are illustrated as directly influencing
  the shared mTOR pathway dysregulation and contributing to cognitive decline, with
  a feedback loop also suggesting a direct impact on cognitive impairment. The diagram
  thus highlights how divergent initial pathologies can converge on common molecular
  pathways, illustrating a complex interplay that ultimately leads to the cognitive
  symptoms observed in both disorders. GWAS: genome-wide association studies; BBB:
  blood–brain barrier; SYK: spleen tyrosine kinase; RAGE: receptor for advanced glycation
  end-products; S100B: S100 calcium-binding protein B; NMDA: N-methyl-D-aspartate;
  AD: Alzheimer’s disease; ROS: reactive oxygen species; mTOR: mechanistic target
  of rapamycin; IL-1β: interleukin 1-beta; IL-6: interleukin 6; TNF-α: tumor necrosis
  factor alpha; mCRP: monomeric C-reactive protein'
