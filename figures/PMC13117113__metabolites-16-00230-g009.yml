figure_title: Regulatory effects of Polygonum multiflorum Thunb.
caption: 'Regulatory effects of Polygonum multiflorum Thunb. (HSW) on lipid metabolism-related
  signaling pathway proteins in hyperlipidemic mice induced by a high-fat diet (HFD).
  (A–D). Relative mRNA expression levels of lipid metabolism-related genes: (A) is
  AMPK, (B) is SREBP-2, (C) is PCSK9, (D) is LDLR; HSW-H represents the HSW 120 mg/kg
  group, SIM is the simvastatin (10 mg/kg) positive control group, and NFD is the
  normal feed diet group. (E). Western blot detection results of lipid metabolism-related
  proteins: including AMPK, phosphorylated AMPK (P-AMPK), SREBP-2, PCSK9, LDLR, and
  internal reference β-actin. (F–J) Quantitative analysis of relative protein expression
  levels: (F) is AMPK, (G) is P-AMPK, (H) is SREBP-2, (I) is PCSK9, (J) is LDLR. Data
  are expressed as the mean ± standard deviation (x- ± SD); compared with the NFD
  group, ## p < 0.01; compared with the HFD group, * p < 0.05, ** p < 0.01'
