figure_title: Transcriptomic analysis of F.
caption: 'Transcriptomic analysis of F. proliferatum after BCP treatment. (A) Heatmap
  of gene expression following BCP treatment in F. proliferatum. (A) Heatmap of gene
  expression profiles. CK1-CK3: control replicates (2% DMSO + 0.1% Tween-80); BCP1-BCP3:
  BCP-treated replicates (200 mM). (B) Volcano plot of differentially expressed genes
  (DEGs) (red: upregulated; green: downregulated; gray: non-significant). (C) Top
  30 enriched GO terms. BP: Biological Process; CC: Cellular Component; MF: Molecular
  Function. (D) Top 10 KEGG pathways for upregulated DEGs. (E) Top 10 KEGG pathways
  for downregulated DEGs. Enrichment ratio reflects pathway-specific downregulation.
  The X-axis represents the rich factor, while the Y-axis denotes pathway names. Bubble
  color corresponds to −log10(P-value) (gradient scale at right; darker red = higher
  significance), while bubble size reflects the number of downregulated DEGs per pathway'
