caption: '(A) Volcano plot that shows differentially expressed proteins with statistical
  significance and fold change between different groups. Significant proteins were
  selected by FC > 1.2 or < 0.84 and p < 0.05. (B) Bubble plot of significantly enriched
  GO terms in the model vs. control comparative datasets. The cut−off for labeling
  was set at an adjusted p−value of 0.05. The horizontal axis indicates the given
  terms are more likely to be downregulated. The area of circles is proportional to
  the number of proteins assigned to the term. (C) Bubble plot of significantly enriched
  GO terms in the NGR1 vs. model comparative datasets. The cut−off for labeling was
  set at an adjusted p−value of 0.05. The horizontal axis indicates the given terms
  are more likely to be upregulated. The area of circles is proportional to the number
  of proteins assigned to the term. (D) KEGG enrichment analysis between different
  groups. The cut−off for labeling was set at an adjusted p−value of 0.05. The horizontal
  axis indicates the given terms are more likely to be upregulated. The area of circles
  is proportional to the number of proteins assigned to the term. (E) KEGG pathway
  Venn diagram analysis between different groups: The left panel (Top 25 KEGG Pathways
  Venn diagram) shows the overlapping and unique top 25 KEGG pathways of differential
  metabolite enrichment in ‘model vs. control’ and ‘NGR1 vs. model’; the right panel
  (All KEGG Pathways Venn diagrams) shows all the enriched KEGG pathways'
