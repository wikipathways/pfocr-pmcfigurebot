caption: Functional and validation analyses of transcriptomic alterations in L. monocytogenes
  CMCC54007-treated Caco-2 cells following interventions with E. faecium WEFA23 and
  its mutant strain E. faecium WEFA23 otc−/−. (A) KEGG pathway enrichment analysis
  for the four pairwise comparisons (CTRL vs. LM; LM vs. WEFA23; LM vs. WEFA23_otc;
  WEFA23 vs. WEFA23_otc), highlighting the major biological pathways affected by OTC;
  (B) KEGG chord diagram illustrating the top 10 enriched pathways and their associated
  genes in the WEFA23 vs. WEFA23_otc comparison, showing the functional connections
  of key DEGs; (C) hierarchical clustering heatmap of significantly dysregulated genes
  (FDR < 0.05) in the WEFA23 vs. WEFA23_otc group, revealing distinct transcriptional
  signatures induced by the OTC; (D) correlation analysis between RNA-seq and RT-qPCR
  results, demonstrating consistency in gene expression trends across the two methods;
  (E) RT-qPCR validation of representative genes (ORAI3, ADCY2, CCL5, and CCL9) in
  Caco-2 cells, confirming the transcriptomic findings. CTRL, blank control; LM, L.
  monocytogenes; WEFA23, E. faecium WEFA23; WEFA23_otc & WEFA23 otc−/−, otc gene deletion
  mutant of E. faecium WEFA23. Different letters indicate significant differences
  among groups (p < 0.05)
