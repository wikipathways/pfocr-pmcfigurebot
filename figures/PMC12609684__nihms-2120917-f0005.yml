figure_title: Defective development of B cells and CXCR4 expression in bone marrow
  and spleen of HIP mice.
caption: Defective development of B cells and CXCR4 expression in bone marrow and
  spleen of HIP mice. (A) Schematic representation of B cell development pathway from
  HSCs to developing B cells in the bone marrow and their continued maturation in
  the spleen. (B) Cell counts and (C) proportion of developing B cells, pre-pro B
  cells (CD19+ CD43−), pro B cells (CD19+ CD43+), pre B cells (CD19+ CD43− IgM−),
  and immature B cells (CD19+ CD43− IgM+) in the bone marrow of WT and HIP mice quantified
  by flow cytometry. (D) Cell counts and (E) proportion of developing B cells, such
  as transitional (CD19+ CD45RA/B220+ IgM+ IgD+), follicular (CD19+ CD45RA/B220+ CD21/35
  intermediate CD23+), and marginal zone (CD19+ CD45RA/B220+ CD21/35+ CD23−) B cells,
  in the spleens of WT and HIP mice were quantified by flow cytometry. (F) CXCR4 surface
  expression represented by geometric mean on developing B cells in the bone marrow
  and (G) spleen of WT and HIP mice quantified by flow cytometry. *p < 0.05, **p <
  0.01, ***p < 0.001, and ****p < 0.0001 as determined using an unpaired two-tailed
  Students t-test. Data are presented as means ± SD; n = 8–9 mice per group
