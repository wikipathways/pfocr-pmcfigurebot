caption: KEGG pathway enrichment and mapping of medicarpin targets in ovarian cancer.
  (A) KEGG enrichment analysis of 44 overlapping targets, highlighting major oncogenic
  and endocrine-related pathways, including PI3K–Akt and prolactin signaling. Bubble
  size represents the number of genes, and color intensity indicates statistical significance
  (−log10 FDR). (B) Pathview visualization of the prolactin signaling pathway showing
  medicarpin-associated targets (red) positioned at key regulatory nodes such as PIK3CA,
  AKT1, MAPK1, ESR1, and SOCS3
