figure_title: Characterization of basal/hillock lineage cell populations.
caption: Characterization of basal/hillock lineage cell populations. (A) UMAP plot
  of the 2,796 nuclei from subset basal/hillock lineage cluster of the human adenoids
  (dim. = 11, res. = 1). (B) Dot plot of the average expression of top DEGs for each
  nucleus cluster in this lineage. (C) Trajectory analysis with Monocle 3 of the clusters
  identified in the basal/hillock lineage. The black line in each group of nuclei
  represents the different trajectories identified by the pipeline. (D) Nucleus clusters
  organized by pseudotime setting as root nodes the ones specified in the Sup. Fig2A.
  One separated root node was designated for each trajectory group. The black bar
  inside each box represents the median value of the data. (E) Percentage of maximum
  expression of a representative DEG of each cluster through the differentiation pathway
