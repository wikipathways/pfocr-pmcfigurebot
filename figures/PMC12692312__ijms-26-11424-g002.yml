figure_title: Treatment pathways for localized gastroesophageal cancer.
caption: Treatment pathways for localized gastroesophageal cancer. This figure summarizes
  standard curative-intent treatment approaches for localized gastroesophageal adenocarcinoma.
  Neoadjuvant chemoradiotherapy (CROSS regimen) is preferred for esophageal and gastroesophageal
  junction tumors, whereas perioperative chemotherapy (FLOT regimen) is standard for
  gastric and select GEJ cancers. Both strategies converge at surgical resection (R0).
  Following surgery, patients with residual disease after chemoradiotherapy may benefit
  from adjuvant nivolumab (CheckMate-577), while observation or clinical trial enrollment
  may be appropriate for others. FLOT = 5-fluorouracil, leucovorin, oxaliplatin, docetaxel
