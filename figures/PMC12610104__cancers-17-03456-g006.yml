figure_title: KEGG pathway analysis of differentially expressed upregulated and downregulated
  genes in oviductal tissues of BPRN-conditional knockout mice.
caption: KEGG pathway analysis of differentially expressed upregulated and downregulated
  genes in oviductal tissues of BPRN-conditional knockout mice. (A) KEGG pathways
  overrepresented in the lists of genes upregulated (red) in mouse oviductal tissues
  of MPA-treated mice compared with placebo mice after 14 days of TAM treatment. (B)
  KEGG pathways overrepresented in the lists of genes up- (red) and downregulated
  (blue) in mouse oviductal tissues of P4-treated mice compared with placebo mice
  after 14 days of TAM treatment. (C) KEGG pathways overrepresented in the lists of
  genes upregulated (red) in mouse oviductal tissues of E2P4-treated mice compared
  with placebo mice after 14 days of TAM treatment. The enriched pathways with FDR
  ≤ 0.05 are shown
