figure_title: Effect of CIRP on NF-κB/NLRP3 pathway activation.
caption: Effect of CIRP on NF-κB/NLRP3 pathway activation. (A) Volcano plot showing
  differentially expressed genes between control and CIRP-treated chondrocytes. (B)
  Kyoto Encyclopedia of Genes and Genomes pathway enrichment analysis; a higher P-value
  (-Log10) indicates greater enrichment and the top 30 enriched pathways are displayed.
  (C and D) Western blotting showing the protein expression of IκBα in chondrocytes
  and p65 in the nucleus. (E and F) Western blotting showing the protein expression
  of NLRP3, cleaved-caspase-1 and ASC. (G) Immunofluorescence analysis of p65 nuclear
  translocation, with DAPI staining for nuclei (scale bar, 20 μm). n=3, *P<0.05, **P<0.01.
  CIRP, cold-inducible RNA-binding protein; NLRP3, NLR family pyrin domain containing
  3; Cle, cleaved
