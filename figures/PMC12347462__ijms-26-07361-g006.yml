figure_title: PI3K downstream signaling is required for Slit1 expression in the diencephalon.
caption: 'PI3K downstream signaling is required for Slit1 expression in the diencephalon.
  Western blot analyses of Slit1 expression in the diencephalic explants on the second
  day post the addition of different pathway inhibitors (A,A’). Compared with FGF3
  positive controls, PI3K pathway inhibitor LY294002 significantly reduced the expression
  of slit1 (B–D’). However, the other pathway inhibitors U0126, D609 and U73122 had
  no significant effect on the expression of slit1 (E–H). Immunofluorescence staining
  of DAPI (blue) and Slit1 (green) in the diencephalic explants on the second day
  post the addition of FGF3 (E,F), or post the addition of FGF3+LY294002 (G,H). (I)
  Quantification analyses of Slit1 per volume of the thalamic explant. **: p < 0.01;
  ***: p < 0.001; scale bars = 80 µm; HT: hypothalamus'
