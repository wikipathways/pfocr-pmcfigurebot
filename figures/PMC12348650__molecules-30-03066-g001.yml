figure_title: The pathological progression of MASH is progressive.
caption: 'The pathological progression of MASH is progressive. As shown, FXR inhibits
  SREBP-1c expression and activates the low-density lipoprotein receptor (LDLR), thereby
  reducing abnormal lipid accumulation in the liver. When lipid accumulation in the
  healthy liver exceeds a certain threshold, it triggers an inflammatory cascade that
  further drives liver fibrosis. CAR and FXR exert anti-inflammatory effects by activating
  the Nrf2 pathway and inhibiting NF-kB signaling, respectively. In contrast, LCA
  and CDCA activate MAPK and TLR4 signaling pathways, respectively, and exacerbate
  inflammatory responses. FXR and VDR inhibit TGF-β1 and COLIα1, respectively. Energy
  metabolism and insulin sensitivity are inextricably linked to the process. FXR enhances
  insulin sensitivity by inhibiting PEPCK and G6Pase transcriptional activity, while
  CDCA and S1PR2 enhance insulin sensitivity by activating the PI3K/Akt pathway. In
  contrast, PXR decreases insulin sensitivity by inhibiting INSR signaling. In intestinal
  epithelial cells, TGR5 promotes GLP-1 secretion and enhances insulin sensitivity.
  In addition, TGR5 promotes energy consumption by activating the cAMP-PKA pathway
  and regulating extracellular signal-regulated kinases 1 and 2 (ERK1/2) activity.
  Bile acids synthesized from cholesterol in hepatocytes are actively transported
  into bile by BSEP. BA uptake from the intestine is mainly mediated by ASBT, while
  OSTα/OSTβ is responsible for BA export from the basolateral membrane to the portal
  vein. Hepatocytes re-uptake bile acids from portal vein blood through NTCP to complete
  hepatointestinal circulation. Overall, bile acids and their specific receptors play
  a central role in the pathological evolution of MASH by finely regulating lipid
  metabolism, inflammation, fibrotic processes, and energy homeostasis at multiple
  levels. Arrow: This refers to an increase in energy metabolism after receptors regulate
  pathways'
