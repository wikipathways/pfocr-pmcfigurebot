figure_title: Induction of HO-1 expression against DENV by sofalcone through Nrf2
  induction.
caption: 'Induction of HO-1 expression against DENV by sofalcone through Nrf2 induction.
  (A) Huh-7 cells infected with DENV (MOI of 0.2) were transfected with the p3xARE-Luc
  reporter plasmid and subsequently treated with 5 to 30 μM sofalcone for 3 days.
  Luciferase activity was measured in total cell lysates to assess Nrf2-mediated transcriptional
  activity, expressed as fold changes relative to the control treatment with 0.1%
  DMSO defined as 1. (B,C) Western blotting was performed using anti-Bach1, anti-Keap1,
  anti-Nrf2, and anti-GAPDH antibodies to evaluate the protein levels of key regulators
  involved in the Nrf2 pathway, with a focus on nuclear accumulation of Nrf2 in the
  presence of DENV infection and sofalcone treatment. GAPDH and the nuclear marker
  larmin B were used to confirm equal loading of the cell lysates. (D) The impact
  of Nrf2 knockdown on the antiviral activity of sofalcone. RNA levels were determined
  by RT-qPCR in the presence of Nrf2 shRNA expression or non-specific shRNA expression
  (named: NS shRNA; shEGFP) under sofalcone (30 μM) treatment. Viral RNA levels were
  calculated as percentage changes using DENV-infected Huh-7 cells treated with 0.1%
  DMSO, defined as 100%. The experiment was conducted in replicates, and error bars
  represent SD. Statistical significance is indicated as ** p < 0.01'
