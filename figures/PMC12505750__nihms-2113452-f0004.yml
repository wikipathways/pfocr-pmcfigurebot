figure_title: Differential OL gene expression in IUGR females at P14.
caption: Differential OL gene expression in IUGR females at P14. A) Volcano plot demonstrates
  distinct gene expression differences between control and IUGR female groups (n=4).
  Colored dots represent significant DEGs with log2 fold change >±1.5 . Significant
  downregulated DEGs (blue) and upregulated DEGs (red). B) PCA plot of gene expression
  showing variance between groups. Control samples (blue) and IUGR samples (red).
  C) Top 15 significant pathways implicated from the data set using IPA. X-axis is
  the number of genes from the dataset found in the pathway and the color of the dot
  represents p-adjusted value with red indicating larger significance. D) Heat map
  of genes from the GO Mitochondrial ATP Synthesis pathway. Each row represents a
  gene from the GO Mitochondrial ATP synthesis pathway and every column is a separate
  sample. Colors represent the measured expression value with red representing higher
  expression and blue with lower expression
