figure_title: Fibroblasts synthesize and secrete cytokines.
caption: Fibroblasts synthesize and secrete cytokines. (a) The TGF-β pathway activates
  Smad proteins, leading to fibroblast proliferation, migration, and ECM synthesis,
  contributing to wound healing. (b) The overexpression of PDGF induces the abnormal
  activation of fibroblasts through PDGFR-α and PDGFR-β, which activates downstream
  PI3K/Akt and MAPK/ERK signaling pathways, promoting collagen protein synthesis and
  tissue remodeling. (c) FGFs, particularly through bFGF and other FGF family members
  (FGF2, FGF10, FGF21), interacts with TGF-β1/Smad and JNK pathways, regulating angiogenesis,
  collagen synthesis, and fibroblast activity.Created in BioRender. Huang, Q. (2026)
