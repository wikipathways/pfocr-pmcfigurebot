figure_title: KIF26A inhibits the NHEJ repair pathway by binding to Ku70.
caption: 'KIF26A inhibits the NHEJ repair pathway by binding to Ku70. (A, B) In HCT116
  (A) and RKO (B) cells characterization of DSB repair pathways by pEJ5-GFP (left)
  and DR-GFP (right). GFP+ cell percentages were quantified via FACS (n = 3). (C)
  Mass spectrometry identified 15 top proteins associated with KIF26A in HCT116 cells
  overexpressing KIF26A. Cell lysates underwent KIF26A-antibody immunoprecipitation,
  with IgG-antibody as a negative control. (D) In HCT116 and RKO cells, Western blot
  probed KIF26A and Ku70 proteins immunoprecipitated via anti-KIF26Aor anti-Ku70antibodies,
  with IgG as the control. (E) Immunofluorescence analysis of KIF26A and Ku70 in HCT116
  and RKO cells. DAPI labels nuclei. Scale bars: 10 µm. Shows the colocalization of
  KIF26A and Ku70 before and after CRT treatment (n = 5). (F) IP-WB analysis of Ku70-Ku80-DNA-PKcs
  complex with anti-Ku70 antibody in HCT116 (upper) and RKO (lower) cells. (G) Confocal
  images of DNA-PKcs (Ser2056, red) and Ku70 (green) in KIF26A-overexpressing or control
  cells after CRT treatment. Last column: Cell pixel intensity scatter plot. The last
  column shows the scatter plot of red and green pixel intensities in different treatment
  groups. (H) Western blot analysis of DNA-PKcs phosphorylation in HCT116 and RKO
  cells under different treatments. E, G and H, CRT group treated with radiation (8
  Gy) and chemotherapy (2 μg/mL of Oxaliplatin). A, ****P < 0.0001 or ns, not significant;
  determined one-way ANOVA; P value of less than 0.05 indicates a statistical difference.
  Error bars, mean ± SD. For all panels, three biological independent replicates were
  performed'
