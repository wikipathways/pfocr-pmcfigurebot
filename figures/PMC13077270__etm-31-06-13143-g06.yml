figure_title: Untargeted metabolomic profiling and pathway enrichment analysis in
  FCA-L2 cells.
caption: Untargeted metabolomic profiling and pathway enrichment analysis in FCA-L2
  cells. (A) PC analysis score plot showing sample distribution across treatment groups.
  (B) Volcano plots of differential metabolites in SP vs. NC, GLU_SP vs. SP and FCP_SP
  vs. SP comparisons. Significantly changed metabolites are colored by fold change
  and significance threshold. (C) Metabolite set enrichment analysis comparing SP
  vs. NC, GLU_SP vs. SP and FCP_SP vs. SP. The x-axis represents comparison groups;
  the y-axis lists enriched Kyoto Encyclopedia of Genes and Genomes pathways; NES>0
  indicates pathway upregulation. (D) Enrichment plots of downregulated metabolites
  in glycerophospholipid metabolism and arginine and proline metabolism (SP vs. NC).
  (E) Enrichment plots showing downregulation of glycerophospholipid metabolism and
  upregulation of purine metabolism (GLU_SP vs. SP). (F) Enrichment plots showing
  upregulated metabolites in biosynthesis of amino acids and biosynthesis of unsaturated
  fatty acids (FCP_SP vs. SP). PC, principal component; GLU, glutamine; FCP, fish
  collagen peptides; SP, Streptococcus pneumoniae; NC, negative control; QC, quality
  control; NES, normalized enrichment score
