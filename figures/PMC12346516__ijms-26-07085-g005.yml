figure_title: Ingenuity Pathway Analysis (IPA) of PFNA- and PFOA-induced transcriptomic
  changes under atopic dermatitis conditions.
caption: Ingenuity Pathway Analysis (IPA) of PFNA- and PFOA-induced transcriptomic
  changes under atopic dermatitis conditions. (a,b) Top enriched categories in the
  “Diseases and Disorders” domain for PFNA and PFOA, respectively. (c,d) Top molecular
  and cellular functions affected by each PFAS, ranked by –log10(p-value). (e) Predicted
  upstream regulators for PFNA and PFOA exposures, visualized based on z-scores indicating
  predicted activation or inhibition. (f,g) Gene networks of calcitriol-regulated
  downstream molecules, filtered from DEG datasets of PFNA- and PFOA-exposed atopic
  groups. (h) A broader upstream interaction network centered on calcitriol and its
  key downstream regulators, inferred from the IPA knowledge base. Node shapes indicate
  molecular categories defined by IPA
