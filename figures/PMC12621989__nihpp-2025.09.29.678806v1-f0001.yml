figure_title: Overview of the study datasets, white matter features, and analytical
  framework
caption: (A) Age distributions for each of the 42 contributing datasets (violin plots),
  illustrating broad coverage from 0–100 years. Color encodes the number of participants
  per dataset (log scale). (B) Features extracted for each of the 30 bilateral pathways.
  Microstructural indices (e.g., Fractional Anisotropy, and Mean, Axial and Radial
  diffusivities; FA, MD, AD, RD) summarize tissue organization and axonal/myelin density;
  macrostructural indices (e.g., tract volume, length, surface area) capture pathway
  size and geometry. (C) Analysis pipeline. For each participant, white matter pathways
  were segmented, and features were extracted. A Lateralization Index (LI) was calculated
  for each tract-feature pair. These LIs were used as input for a normative modeling
  framework (GAMLSS) to generate age-specific population centile curves
