figure_title: 'The BDNF–TrkB–MAPK/ERK–mTOR signaling axis in treatment-resistant depression
  Under physiological conditions, BDNF binds to its receptor TrkB, activating three
  major intracellular signaling cascades: (i) the MAPK/ERK pathway, which promotes
  CREB-dependent transcription of neuroplasticity-related genes; (ii) the PI3K–AKT–mTOR
  cascade, which regulates neuronal growth, survival, and synaptic protein synthesis;
  and (iii) the PLCγ–CaMK–CREB route, which controls Ca2+-dependent synaptic remodeling.'
caption: 'The BDNF–TrkB–MAPK/ERK–mTOR signaling axis in treatment-resistant depression
  Under physiological conditions, BDNF binds to its receptor TrkB, activating three
  major intracellular signaling cascades: (i) the MAPK/ERK pathway, which promotes
  CREB-dependent transcription of neuroplasticity-related genes; (ii) the PI3K–AKT–mTOR
  cascade, which regulates neuronal growth, survival, and synaptic protein synthesis;
  and (iii) the PLCγ–CaMK–CREB route, which controls Ca2+-dependent synaptic remodeling.
  In TRD, chronic stress, inflammation, and elevated glucocorticoids down-regulate
  expression and reduce TrkB phosphorylation, resulting in diminished ERK and mTOR
  activation, impaired protein synthesis, and synaptic atrophy. AKT, protein kinase
  B; BDNF, brain-derived neurotrophic factor; CaM, calmodulin; CaMK, calcium/calmodulin-dependent
  protein kinase; CREB, cAMP response element-binding protein; ERK, extracellular
  signal-regulated kinase; IP3, inositol 1,4,5-trisphosphate; MAPK/ERK, mitogen-activated
  protein kinase/extracellular signal-regulated kinase pathway; MEK, mitogen-activated
  protein kinase kinase; mTOR, mechanistic target of rapamycin; PI3K, phosphoinositide
  3-kinase; PLC, phospholipase C; RAF, rapidly accelerated fibrosarcoma kinase; RAS,
  Ras GTPase protein; TrkB, tropomyosin receptor kinase B'
