figure_title: Hdac3 and phospho-Hdac3 localize to mitochondrial gene promoters to
  restrict H3K27ac enrichment in energy metabolism pathways
caption: (A) Heatmaps display the enrichment of Hdac3 (left) and phospho-Hdac3S424
  (right) at transcriptional start sites in murine aortic valves (n = 3). (B) Pie
  charts illustrate genome-wide occupancy of Hdac3 (top) and phospho-Hdac3S424 (bottom),
  showing enrichment at promoter regions in murine aortic valves. (C) Top enriched
  pathways from PANTHER cellular component analysis reveal Hdac3 and phospho-Hdac3S424
  enrichment in mitochondrial categories within murine aortic valves. (D) Heatmaps
  show increased H3K27ac enrichment at transcriptional start sites in Hdac3-deficient
  murine aortic valves (right) compared with controls (left). (E) Top enriched pathways
  from Reactome pathway analysis of Hdac3-deficient murine aortic valves show increased
  H3K27ac enrichment in pathways related to energy production and mitochondrial biogenesis.
  (F) HOMER motif analysis identifies enrichment of nuclear receptor transcription
  factors at sites with increased H3K27ac enrichment in Hdac3-deficient murine aortic
  valves
