figure_title: DOXO dysregulates many critical pathways linked with BBB
caption: '(A) Volcano plot from RNA-seq using DeSeq2 represents the upregulated (red)
  and downregulated (blue) genes after 24 hours of 500 nM DOXO treatment in hCMEC/D3
  with a threshold of |log2Fold Change|= 0.5 and adjusted p-value < 0.05. Bar plot
  represents the selected (B) upregulated and (C) downregulated pathways from Geno
  Ontology: Biological Processes (GO:BP) pathway analysis, sorted by a −log10 (adjusted
  p-value) threshold of 1.3. (D) Bar plot represents the selected IPA toxicology lists
  impacted after 24 hours of DOXO treatment with a −log10(Benjamini-Hochberg (BH)
  p-value) threshold of 1.3. (E) Representative bubble chart of the selected canonical
  pathways impacted by DOXO treatment with the bubbles representing the number of
  genes in that pathway and a positive z-score (orange color) or a negative z-score
  (blue color) with a −log10(p-value) threshold of 1.3. Gene set enrichment analysis
  (GSEA) barcode plot displaying the enrichment score (ES) with the p-adjusted value
  for (F) cytokine-mediated signaling, (G) cell substrate junction, (H) angiogenesis.
  n = 4 biological replicates per group'
