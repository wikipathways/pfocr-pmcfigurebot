figure_title: Immunomodulatory Mechanisms of Medicinal Plant Polysaccharides.
caption: Immunomodulatory Mechanisms of Medicinal Plant Polysaccharides. Glucans and
  pectins modulate systemic immune homeostasis by acting on immune organs (spleen
  and thymus), cells (macrophages, natural killer cells, T-lymphocyte (T cells), B-lymphocyte
  (B cells), and dendritic cells), and cytokines (Nitric Oxide (NO), Tumor Necrosis
  Factor-α (TNF-α), Interleukin-6 (IL-6), Interleukin-10 (IL-10), Interferon-γ (IFN-γ),
  and Interleukin-2 (IL-2)). The signaling pathways involved in this process include
  mitogen-activated protein kinase pathway (MAPK), toll-like receptor 4-myeloid differentiationfactor
  88-nuclear factor-κB pathway (TLR4-MyD88-NF-κB), sirtuin 1-peroxisome proliferator-activated
  receptor-γ coactivator 1α-nuclear factor-κB pathway (SIRT1-PGC-1α-NF-κB), and toll-like
  receptor 2-nuclear factor-κB pathway (TLR2-NF-κB)
