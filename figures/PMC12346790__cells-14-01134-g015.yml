figure_title: Schematic representation of the intracellular mechanisms by which miR-193a
  may mediate E2-induces vasculogenesis.
caption: Schematic representation of the intracellular mechanisms by which miR-193a
  may mediate E2-induces vasculogenesis. (A) E2 promotes vasculogenesis by downregulating
  miR-193a expression, thus blocking miR-193a inhibitory actions on AKT-phosphorylation
  and VEGF expression. (B) miR-193a also inhibits the TFGβ signaling pathway. By reducing
  miR-193a expression, E2 reverses the suppressing effects of miR-193a on ALK1 and
  ID1 expression and induces microvessel formation
