caption: Differentially expressed pathways in glioblastoma based on WWOX/HIF1A ratio.
  This figure summarizes key signalling pathways differentially regulated in GBM tumours
  stratified by WWOX/HIF1A ratio. Yellow indicates good prognosis, pink signifies
  poor prognosis, and green indicates genes with unchanged expression. The figure
  emphasizes the balance between apoptotic and hypoxia-adaptive mechanisms influencing
  clinical outcomes
