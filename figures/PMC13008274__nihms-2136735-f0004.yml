figure_title: Differential gene expression and enriched molecular pathways in the
  Ad-TGFβ1 primary normal human lung fibroblast model with and without Rev-erbα agonist
  (STL1267) treatment
caption: '(A) Schematic overview of the experimental design. Primary normal human
  lung fibroblasts (NHLF: Donor 1) were transduced with Ad-TGFβ1 (1 × 108 PFU) for
  16 hours, followed by replacement with complete medium. After 24 hours, the cells
  transitioned into a myofibroblast-like phenotype before treatment with the Rev-erbα
  agonist, STL1267 (10 μM), for 48 hours. Total RNA was extracted, and RNA sequencing
  (RNA-seq) was performed. (B-C) Differently expressed genes (DEGs) with a |log2FC|
  ≥ 1.5 are shown in volcano plots for two different comparisons: Ad-TGFβ1 vs. control
  (B) and Ad-TGFβ1+STL1267 vs. Ad-TGFβ1 (C). Upregulated genes are shown in red, and
  downregulated genes are shown in blue. Pathway enrichment analysis reveals distinct
  biological pathways associated with these DEGs in both comparisons'
