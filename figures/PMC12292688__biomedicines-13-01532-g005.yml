figure_title: The flowchart of network pharmacology in MIRI.
caption: The flowchart of network pharmacology in MIRI. The illustration shows a step-by-step
  drug discovery workflow with a network pharmacology approach. It starts with data
  acquisition, in which compound data are obtained based on the traditional system
  of information (TSI) and modern/recent information (MI/RI), and then compound and
  disease targets are identified through gene databases. These targets are subsequently
  incorporated into the construction of the network to determine the shared targets
  between the compounds and diseases, which is presented in a Venn diagram fashion.
  The resulting network is thoroughly analyzed so as to identify important molecular
  interactions and pathways. Lastly, the in silico predicted targets and interactions
  undergo experimental verification to ascertain their therapeutic context
