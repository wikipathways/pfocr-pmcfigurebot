caption: Effect of oligodendrocytes on the function of lung cancer brain metastatic
  cells. (A) Prediction of cell interactions in the microenvironment of LCBM based
  on single-cell transcriptome sequencing data analysis. (B-C) Oligodendrocytes and
  lung cancer brain metastatic cells were co-cultured in a non-contact manner, then
  subjected to the Transwell, wound-healing and CCK8 assays. Magnification, × 200.
  (D) Expression difference of EMT pathway protein in tumor cells after co-culture.
  All experiments were repeated three times (* p < 0.05, ** p < 0.01, *** p < 0.001,
  ns > 0.05)
