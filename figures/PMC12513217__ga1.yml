caption: This study investigated the effects of visceral inflammation on subcutaneous
  fascia by comparing healthy mice with dysenteric mice. Using single-cell RNA sequencing
  technology, we comprehensively analyzed cellular composition and gene expression
  in different tissues and employed deep neural networks to identify disease-specific
  non-linear features. The findings revealed that dysentery-induced visceral inflammation
  is closely associated with systemic biological signals and affects distal tissues
  such as subcutaneous fascia. Further analysis uncovered the roles of CPTCs and MPs
  in the inflammatory process. We observed that fascial MPs exhibited Warburg-like
  metabolic reprogramming characteristics, and subsequent co-culture experiments verified
  that CPTCs inhibit inflammation by regulating paracrine signaling pathways such
  as Wnt. This study aims to elucidate how systemic inflammatory patterns from visceral
  inflammation are mapped in the subcutaneous fascia and provide new targets for potential
  therapeutic strategies
article_title: Application of single-cell deep learning in elucidating the mapping
  relationship between visceral and body surface inflammatory patterns
