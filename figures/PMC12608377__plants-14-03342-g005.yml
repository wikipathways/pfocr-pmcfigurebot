figure_title: Expression analysis of genes involved in the GA pathway in WT and sscd1
  seeds treated with paclobutrazol (PAC).
caption: Expression analysis of genes involved in the GA pathway in WT and sscd1 seeds
  treated with paclobutrazol (PAC). Relative expression of genes involved in GA signaling
  (RGL2), biosynthesis (GA20ox1, GA20ox2, GA3ox1, GA3ox2), catabolism (GA2ox2, GA2ox6),
  and cell wall extension (EXPA1, EXPA8, EXPA9) in WT and sscd1 seeds imbibed for
  12 h on MS medium without PAC (control) or with 10 µM PAC after stratification.
  RGL2, RGA-LIKE 2. GA20ox1, GA20-oxidase 1. GA20ox2, GA20-oxidase 2. GA3ox1, GA3-oxidase
  1. GA3ox2, GA3-oxidase 2. GA2ox2, GA2-oxidase 2. GA2ox6, GA2-oxidase 6. EXPA1, expansin
  A1. EXPA8, expansin A8. EXPA9, expansin A9. Data represent the mean ± SE from three
  biological replicates. Asterisks represent significant differences between the WT
  and sscd1 seeds (t-test, * p < 0.05)
