figure_title: Micro-heterogeneity of breast cancer using CRC and single-cell-derived
  clones.
caption: Micro-heterogeneity of breast cancer using CRC and single-cell-derived clones.
  (A) Heatmap of differentially expressed genes between subgroups C1&C2 and C3&C6&C8.
  The heatmap was constructed using MultiExperiment Viewer (MeV) v4.9.0. Both genes
  and samples were grouped via hierarchical clustering analysis (HCL) using Euclidean
  distance metrics. (B) Pathway network in subgroups C1 and C2. The network is dominated
  by pathways related to immune cell activation, survival, and proliferation, with
  central hubs including TNF, IL2, IL4, CD40/CD40LG, NFKB1, CREBBP, and EP300. Enriched
  functions include activation and viability of leukocytes and lymphocytes, calcium
  and CREB signaling, and transcriptional/epigenetic regulation, together with pathways
  associated with the molecular mechanisms of cancer. This network reflects a regulated,
  activation-driven immune environment closely linked to oncogenic and cell survival
  processes. (C) Pathway network in subgroup C3&C6&C8. This network is enriched for
  inflammatory, migratory, and tissue remodeling pathways, with prominent nodes such
  as TNF, IL1A, IL1B, IL6, IL17A, CXCR4, TLR4, MYD88, TGFB3, VEGFA, and FN1. Canonical
  pathways include pathogen-induced cytokine storm signaling, agranulocyte adhesion
  and diapedesis, lymphocyte and mononuclear leukocyte migration, hepatic fibrosis/stellate
  cell activation, and wound response. Collectively, this network represents a highly
  inflammatory, innate immune-dominated state associated with immune cell trafficking,
  stromal activation, and fibrotic remodeling. Together, these analyses highlight
  a shift from immune activation and survival signaling to inflammation-driven migration
  and tissue response
