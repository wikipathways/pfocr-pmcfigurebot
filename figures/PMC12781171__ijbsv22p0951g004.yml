caption: 'IA suppressed RANKL-induced activation of the NF-κB pathway but not the
  MAPK pathway. (A) Volcano plot showing fold change and statistical significance
  of each gene calculated by differentially expressed genes (DEGs) analysis. (B) GO
  terms in biological process were used for functional enrichment clustering analysis
  on common DEGs. (C) KEGG enrichment analysis showed various signaling pathways were
  significantly altered after IA treatment. (D) BMMs were pretreated with IA (0, 100μM)
  for various time periods (0, 5, 10, 20, 30 and 60 min) after RANKL induced osteoclast
  differentiation. Western blot for the expression of p-P65, P65 and p-IκBα. (E)The
  ratios of p-IκB-α to GAPDH bands, p-P65 bands to total P65 bands were determined
  using Image J. (F) Representative fluorescence images of p-P65 in the presence of
  IA (0, 100μM) for 10min after RANKL induced osteoclast differentiation. Scale bar
  = 10μm. (G) Western blot for the expression of p-AKT, AKT, p-JNK, JNK, p-ERK, ERK,
  p-P38 and P38. (H) The ratios of p-AKT, p-JNK, p-ERK, p-P38 bands to total AKT,
  JNK, ERK, P38 bands were determined using Image J. Data are presented as means ±
  SD of 3 independent experiments; *p < 0.05 **p < 0.01, ns: no significant differences'
