figure_title: PHICS 11 disrupts BCR-ABL signaling pathway
caption: a Inhibition of BCR-ABL downstream signaling. K562 cells were treated with
  either PHICS 11 (1 μM) or its control 10 (2 μM), and pSTAT5, pERK, and pCKRL were
  measured relative to the respective total protein level. b Activation of pro-apoptotic
  pathways. Immunoblotting after 70-hour incubation with either PHICS 11 (1 μM) or
  its control 10 (2 μM) is shown. Immunoblotting experiments in a and b were measured
  in at least three independent replicates, and a single representative example is
  shown. c Global transcriptomic analysis in K562 cells treated with DMSO, 10, 11,
  or asciminib. Equal number of genes scoring the highest p-values for each comparison
  are shown. d PCA plot for gene expression analysis. Cluster A is formed by 11 and
  asciminib, while cluster B is formed by DMSO and 10. Gene expression was analyzed
  across four independent biological replicates
