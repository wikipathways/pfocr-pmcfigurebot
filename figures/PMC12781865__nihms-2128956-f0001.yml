figure_title: Simplified schematic of the HH signaling pathway
caption: 'Left: In the absence of HH ligands, PTCH1 inhibits SMO, the major upstream
  activator of the pathway, and prevents its entry into the primary cilium. GLI proteins
  are bound to SUFU and retained in the cytoplasm or degraded by the proteasome. GLI
  proteins can also be processed into repressor forms (GLI-R) that silence target
  gene expression. Middle: In most BCCs, including Gorlin BCCs, loss of PTCH1 enables
  SMO to enter the cilium and constitutively transduce downstream signals. These signals
  cause activator forms of GLI (GLI-A) to predominate and enter the nucleus to induce
  target gene expression (eg, GLI1, PTCH1, MYCN). Right: In BCCs harboring activating
  mutations in SMO (eg, SMOM2), mutant SMO is insensitive to PTCH1-mediated inhibition
  and constitutively transduces downstream signals through GLI-A. BCC, basal cell
  carcinoma; HH, Hedgehog. Illustration assistance provided by Jan Ruvido Stebbins,
  Ruvido Medical Illustration, Dexter, MI'
