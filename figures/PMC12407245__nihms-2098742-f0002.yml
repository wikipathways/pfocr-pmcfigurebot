figure_title: Schematic showing the structure of the time series data and definitions
  of measures.
caption: Schematic showing the structure of the time series data and definitions of
  measures. The schematic shows two different episodes of coordinated attention (black
  boxes), when both infant and parent were looking at the same toy at the same time.
  In the first coordinated attention episode, both the infant and the parent looked
  at Toy 1. The episode was classified as infant-initiate/parent-follow (purple labels)
  because the infant looked at Toy 1 first, and face pathway (orange label) because
  the parent looked at the infant’s face in the latency period between the infant
  look to Toy 1 and the parent look to Toy 1. In the second coordinated attention
  episode, both the infant and the parent looked at Toy 2. The episode was classified
  as parent-initiate/infant-follow (purple labels) because the parent looked at Toy
  2 first, and hand pathway (orange label) because the parent touched Toy 2 in the
  latency period between the parent look to Toy 2 and the infant look to Toy 2
