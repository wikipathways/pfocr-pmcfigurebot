figure_title: Simplified diagram of the canonical Notch pathway.
caption: Simplified diagram of the canonical Notch pathway. Binding of a Delta-like
  or Jagged family ligand to the Notch receptor leads to its shortening by ADAM protease
  cleavage. Subsequently, γ-secretase releases NICD, which translocates to the cell
  nucleus, forming a transcriptional complex with CSL and MAML that affects the expression
  of genes regulating cell proliferation and apoptosis. The arrow and line indicate
  a stimulating effect
