figure_title: Partial least squares regression (PLSR) model predicts unique signaling
  pathways associated with CM size and elongation
caption: (A) Overview of experimental design for PLSR model, in which the goal is
  to identify predictive relationships from protein and phospho-protein expression
  (predictor block) to gene expression and morphological changes (response block).
  Protein levels were measured by RPPA 48 hours after treatment, gene expression was
  measured by qPCR 48 hours after treatment, and morphology of individual cells was
  tracked by fluorescent microscopy from before treatment to 48 hours after treatment.
  (B) PLSR loadings are plotted for protein expression (predictor block; circle markers)
  and for gene expression and morphology (response block; square markers). Unique
  signaling pathways are grouped together via K-means cluster analysis. Middle arrows
  show orientation and relative magnitude of PLSR scores for ligand inputs at two
  timepoints (1hr and 48hr after treatment). (C) Alignment scores of cell area and
  elongation in PLS latent space shown in panel B. (D) PLSR model performance, including
  percent variance explained (R2) and leave-one-out cross-validation to estimate predictive
  value (Q2). (E) Observed-versus-fitted plots for area and elongation
article_title: Systems analysis reveals neuregulin-1 control of cardiomyocyte size
  and shape mediated by distinct PI3K and p38 pathways
