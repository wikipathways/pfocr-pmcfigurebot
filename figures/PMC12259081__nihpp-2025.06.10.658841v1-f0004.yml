figure_title: Senescence-associated β-galactosidase high (SA-βGal high) naïve T cells
  exhibit increased autophagic flux and nutrient-sensing pathway activation
caption: (A–B) Gene Ontology (GO) enrichment analyses of differentially expressed
  genes in SA-βGal high naïve T cells. (A) Biological processes show enrichment for
  autophagy, phagocytosis, and vesicle trafficking. (B) Cellular components enriched
  include lysosomes, endosomes, and membrane-bound organelles. Circle size denotes
  −log(p-value); color scale indicates p-values. (C) Immunofluorescence staining of
  p62 (red) and DAPI (blue) in sorted SA-βGal low and high naïve T cells. Insets highlight
  cytoplasmic p62 puncta accumulation. Scale bars = 5 μm; inset = 2 μm. (D) Quantification
  of single-cell p62 mean fluorescence intensities in CD4+ and CD8+ naïve T cells.
  SA-βGal high cells exhibit significantly increased p62 levels. Bars represent mean
  ± SEM. (E) Percentage of p62+ cells in CD4 and CD8 subsets. Increased frequency
  in SA-βGal high populations. p-values by Wilcoxon matched-pairs test. (F) Immunofluorescence
  for phosphorylated mTOR (p-mTOR, red) and DAPI (blue). Insets show p-mTOR accumulation
  in SA-βGal high cells. Scale bars = 5 μm; inset = 2 μm. (G–H) Quantification of
  p-mTOR and LC3B positive CD4+ naïve T cells (n = 4 donors). Statistical analysis
  by paired t-test
article_title: Accumulation of SA-βGal–High Cells in Human Naïve T Cell Compartments
  Reveals a Stress-Adapted, Senescent-Like State
