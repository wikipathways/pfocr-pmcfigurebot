figure_title: Speculative model of the phage neck maturation pathway
caption: 'A. In order for genome packaging to occur, the Terminase motor must attach
  to the Portal in the vertex of a procapsid. EM density (EMDB: 4445) of the Portal
  and procapsid is cross-sectioned and colored according to protein identity as in
  Figure 1. The Terminase is schematized in grey and black. Scaffold protein and DNA
  are not shown. In the procapsid, the Portal pore is open to allow DNA packaging.
  The clip region of Portal, to which Adaptor tails will eventually bind, is occluded
  by the procapsid. The Terminase is pentameric, which we propose allows it to interact
  with the 5-fold vertex of the procapsid through its C-terminal tails. This tethers
  the nuclease domains away from the central channel through which DNA will be translocated.
  The Terminase can then package DNA into the capsid. During packaging, the capsid
  also expands. B. We propose that pressure of the packaged DNA changes the position
  of Portal, switching it from genome packaging to allow Tail attachment. When the
  capsid is full, the enormous pressure of packaged DNA (light grey) presses the Portal
  downwards like a piston. We propose that this disengages the C-terminal tails of
  Terminase from the capsid, freeing the nuclease domain so that it can access DNA.
  Once DNA has been cleaved, the Terminase and unpackaged DNA dissociate from the
  packaged capsid. After downward motion of the Portal and dissociation of the Terminase,
  the clip region is now available to bind Adaptor tails. C. The tail is attached
  to the fully packaged capsid. EM density (C1 reconstruction, gaussian filtered)
  of the mature Portal vertex and Neck is cross-sectioned and colored according to
  protein identity as in Figure 1'
article_title: The structure of a thermostable phage’s portal vertex and neck complex
  illuminates the headful maturation mechanism
