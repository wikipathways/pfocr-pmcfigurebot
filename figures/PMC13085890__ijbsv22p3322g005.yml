figure_title: TIMP1 secreted by MSCs activates the RAP1 signaling pathway via cMet.
caption: TIMP1 secreted by MSCs activates the RAP1 signaling pathway via cMet. (A)
  Comparison of IHC staining results for TIMP1 and EPAC1 within the same tissue region
  of NMIBC and MIBC samples. (B) Correlation analysis of quantitative results from
  TIMP1 and EPAC1 IHC staining. (C-F) CCK-8 results of UMUC-3 and J82 cells after
  48 hours of intervention with TIMP1 12.5ng/ml, ESI-09 10μM, and their combination;
  as well as the impact of these intervention conditions on the clone formation of
  UMUC-3 and J82 cells. (G-H) Changes in key proteins of the RAP1 pathway in UMUC-3
  and J82 cells after 24 hours of intervention with varying concentrations of TIMP1.
  (I) Following 24 hours of stimulation with TIMP1 at a concentration of 12.5ng/ml
  in UMUC-3 cells, mouse His and rabbit TIMP1 primary antibodies were employed to
  bind to recombinant TIMP1-his protein, while the cytoskeleton was labeled using
  ACTIN probes. (J) Proteins interacting with TIMP1 identified by IP mass spectrometry
  after incubation of total protein from UMUC-3 cells with exogenous TIMP1-his protein.
  (K) Changes in intracellular ADAM10 expression levels in UMUC-3 and J82 cells after
  24 hours of intervention with varying concentrations of TIMP1. (L-M) Changes in
  ADAM10 levels in the culture supernatant detected by ELISA after 24 hours of intervention
  with medium containing 12.5ng/ml TIMP1 in UMUC-3 and J82 cells. (N-O) Changes in
  key protein levels of the cMet signaling pathway in UMUC-3 and J82 cells after 24
  hours of intervention with medium containing varying concentrations of TIMP1. (P-Q)
  Changes in RAP1 pathway-related proteins in UMUC-3 and J82 cells after 24 hours
  of intervention with medium containing TIMP1 at 12.5ng/ml, ESI-09 10μM, and their
  combination
