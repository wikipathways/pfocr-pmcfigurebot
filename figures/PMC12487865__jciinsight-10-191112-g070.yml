figure_title: Nf2 scaffolds FGFR1/Akt signaling to regulate CNC-derived osteoblast
  function
caption: '(A–D) Nf2-FGFR1 interaction mapping. (A and B) Co-immunoprecipitation (co-IP)
  in HEK293T cells confirms specific Nf2-FGFR1 binding (HA/FLAG tags) (D). (C) Endogenous
  co-IP validates Nf2-FGFR1 complex in primary CNC-derived osteoblasts. (E and F)
  Downstream signaling defects in Nf2-mutant CNC-derived osteoblasts. Western blot
  shows unchanged FGFR1 but reduced p-Akt and p-PLCγ in Nf2-mutant primary CNC-derived
  osteoblasts (E). Quantification confirms selective pathway impairment (normalized
  to GAPDH) (F). (G) Costaining of Runx2 and p-Akt in E12.5 coronal sections shows
  reduced p-Akt+/Runx2+ osteoprogenitors in Nf2 mutants (dotted lines demarcate osteogenic
  zone). Scale bars: 100 μm. (H and I) Western blot shows the levels of p-Akt, Osterix/Sp7,
  and collagen type I were sufficiently rescued after the lentivirus-mediated Nf2
  overexpression in Nf2-mutant osteoblasts (H). (I) Quantification of expression level
  of p-Akt, Sp7, and collagen type I (normalized to GAPDH). Data were expressed as
  means ± SD, and each dot represents an individual biological replicate. P values
  were calculated by unpaired Student’s t test with 2-tailed analysis without adjustments
  (F) and 2-way ANOVA multiple-comparison test (I). *P < 0.05, **P < 0.01, ***P <
  0.001, ****P < 0.0001'
