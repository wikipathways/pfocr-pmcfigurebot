figure_title: ASPN induces HER2/HER3 signaling in prostate cancer cells
caption: (A and B) LNCaP cells treated with 100 ng/mL recombinant human ASPN over
  a time course and assessed by immunoblotting for HER2 and HER3 pathway activation
  (A) and quantification (B) (n = 3). (C and D) MyC-CaP cells treated with 100 ng/mL
  recombinant mouse ASPN over a time course and assessed by immunoblotting for HER2
  and HER3 pathway activation (C) and quantification (D) (n = 3). For Western blots
  in A and C, total proteins were normalized to GAPDH, and phosphorylated proteins
  were normalized to GAPDH and total protein. Graphs in B and D are shown as mean
  ± SEM and analyzed by 1-way ANOVA with Dunnett’s post hoc analysis; *P ≤ 0.05, **P
  ≤ 0.01, ***P ≤ 0.001
article_title: Identification of asporin as a HER3 ligand exposes a therapeutic vulnerability
