figure_title: LCL growth inhibitors target pathways enriched in EBV+ PBLs
caption: '(A) HIV-NHL in situ plasmablast signature scoring derived from EBV-transformed
  LCL scRNA-seq data. EBV+ non-GC samples are outlined in black (from left to right:
  EBV+ immunoblastic lymphoma, EBV+ plasmablastic lymphoma, and EBV+ high grade B
  cell lymphoma).(B) Gene ontology biological process (GO BP) enrichment in the three
  non-GC (differentiated, plasmablast-like) EBV+ tumors versus other HIV-NHL tumors.(C)
  LCL small molecule inhibitor screen hits by mechanism of action (highlighted targets
  consistent with GO BP). The percentage and absolute number (parenthetical) of molecules
  with concordant growth inhibition effects are presented.(D) ST expression of PIM2,
  a putative target identified by LCL growth inhibition screening, in and EBV+ HIV-NHLs.(E)
  DepMap data for PIM2 CRISPR perturbation sensitivity of 91 lymphoid lines stratified
  by neoplastic subtype (left panel); PIM2 CRISPR effects and expression in B cell
  lymphomas (red) versus other DepMap cell lines (right panel).(F) Sensitivity of
  EBV− (Ly3, Pfeiffer) and EBV+ (Farage, IBL1, LCL) DLBCL model cell lines to a PIM2-selective
  inhibitor (SMI-16a, 10μM; n = 3 per line); statistical significance evaluated using
  two-tailed t-test (*p=0.039)'
