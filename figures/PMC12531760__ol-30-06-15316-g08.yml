figure_title: Possible mechanism underlying the impact of FBXL22 on PCa cell function.
caption: Possible mechanism underlying the impact of FBXL22 on PCa cell function.
  Western blot analysis demonstrated the relative levels of p-PLK1 and PLK1 in (A)
  PC3 and (B) DU145 cells transfected with FBXL22-OE compared with the NC group. (C)
  Representative western blot images for p-PLK1, PLK1 and GAPDH in PC3 and DU145 cells.
  Western blot analysis indicated the relative levels of AR-V7 in (D) PC3 and (E)
  DU145 cells. (F) Representative western blot images for AR-V7, PD-L1 and GAPDH in
  PC3 and DU145 cells. Western blot analysis indicated the relative levels of PD-L1
  in (G) PC3 and (H) DU145 cells. (I) Representative western blot images for cleaved-caspase-3,
  caspase-3, cleaved-caspase-9, caspase-9, caspase-8 and GAPDH in PC3 and DU145 cells.
  (J) Mechanism by which FBXL22 functions in PCa cells. Error bars represent standard
  deviation. The data indicates that FBXL22 overexpression reduces p-PLK1, AR-V7 and
  PD-L1 levels while increasing cleaved caspase-3, −8 and −9 levels, which suggests
  modulation of the PLK1 pathway and promotion of apoptosis. **P<0.01, ***P<0.001
  and ****P<0.0001. PCa, prostate cancer; FBXL22, F-box and leucine rich repeat protein
  22; OE, overexpression; NC, negative control; PLK1, polo-like kinase 1; AR-V7, androgen
  receptor splice variant 7; PD-L1, programmed death-ligand 1; PDCD1, programmed cell
  death 1; PDCDILG2, programmed cell death 1 Ligand 2
