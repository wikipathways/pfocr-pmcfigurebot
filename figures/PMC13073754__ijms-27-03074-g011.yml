figure_title: (A) Anticancer mechanism of acacetin.
caption: (A) Anticancer mechanism of acacetin. Upregulation of specific targets/transcription
  factors is represented by upward-pointing arrows, and downregulation by downward-pointing
  arrows. Outward-pointing arrows depict the chronological order of events within
  the mechanism. (B) Molecular pathway of acacetin in inhibiting the migration and
  invasion in cancer cells. Upward arrows indicate the upregulation of targets or
  transcription factors, while downward arrows indicate downregulation. Arrows pointing
  outward show the sequence of events in this process. (C) Molecular pathway of acacetin
  to suppress angiogenesis. Upward arrows indicate the upregulation of targets or
  transcription factors, while downward arrows indicate downregulation. Arrows pointing
  outward show the sequence of events in this process. This figure is adapted from
  Singh et al. [156]
