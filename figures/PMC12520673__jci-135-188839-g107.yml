figure_title: Differential gene expression and pathway modulation in persister cells
caption: (A) Schematics of the experimental workflow for isolating persister cells
  based on geminin degron expression for RNA-Seq analysis. (B and C) Heatmaps showing
  the expression levels of E2F (B) and Myc (C) target genes in persister cells treated
  with palbociclib (1 μM), SY5609 (50 nM), or their combination. (D) Dot plot illustrating
  significantly enriched or depleted hallmark gene sets in persister cells treated
  with palbociclib (1 μM) + SY5609 (50 nM) combination compared with untreated controls.
  Enrichment was determined by adjusted P < 0.05 and FDR < 0.25. Dot size indicates
  gene count, and color indicates adjusted P values
