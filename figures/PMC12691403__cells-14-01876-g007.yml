figure_title: The functional duality of Cdk5 in cancer is determined by its subcellular
  localization.
caption: The functional duality of Cdk5 in cancer is determined by its subcellular
  localization. (A) In gastric cancer, nuclear Cdk5 acts as a tumor suppressor by
  inducing p16INK4a expression, which leads to cell cycle arrest and tumor growth
  inhibition. (B) In many other cancers, cytoplasmic and membrane-associated Cdk5/p35
  functions as an oncogene. It drives proliferation, metastasis, and therapy resistance
  by phosphorylating a diverse range of substrates in different cellular compartments,
  including Rb and STAT3 in the nucleus and FAK at the cell membrane. Green arrows
  indicate activation or promotion pathways, while red T-bars indicate inhibition
