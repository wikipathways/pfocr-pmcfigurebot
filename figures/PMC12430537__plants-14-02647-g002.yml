figure_title: Molecular mechanisms of jasmonic acid and SL crosstalk in cotton.
caption: Molecular mechanisms of jasmonic acid and SL crosstalk in cotton. When cotton
  is infected with Verticillium wilt, JA and SLs act in concert to mediate defense
  responses. This is primarily achieved by modulating the levels of JA and SLs, which
  in turn affect the signaling pathways. The process involves a negative feedback
  loop of SL-GbMYC2-GbCCD7/8b and the histone deacetylase GhHDA5, both of which regulate
  defense responses
