figure_title: Comprehensive Systems Analysis of Drug Response Screening Highlighting
  BCL2-Associated Functional Pathways
caption: '(A) UMAP plot of ORF perturbation profiles for 16 chemotherapeutic agents,
  color-coded by one of four drug mechanisms of action. (B) Functional enrichment
  network from drug-ORF correlations, showing ORF as node and Pearson correlation
  (cut-off: < 0.9) as edge (left), functional clusters using SAFE (right). (C) STRING
  protein-protein interaction (PPI) network of two BCL2-related SAFE clusters (“BH
  domain binding” and “Autophagy & Apoptosis”), highlighting genes involved in vesicular
  transport, apoptotic signaling, histone modification, and Notch receptor pathways.
  The network is based on high-confidence experimental interactions (score > 0.9),
  <50 interactors in the first and second shells. 12 diamond-shaped nodes highlight
  ORFs originating from the SAFE network clusters. (D) UMAP plots showing Single-cell
  RNA-seq treatment-specific ORF-expressing cell population changes for four different
  chemotherapeutics (left) and enriched pathways in distinct cell clusters identified
  by the Leiden algorithm and analyzed using DAVID (right)'
