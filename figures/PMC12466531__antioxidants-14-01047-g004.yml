figure_title: Cell-type-dependent NRF2 engagement.
caption: Cell-type-dependent NRF2 engagement. Neurons, oligodendrocytes, astrocytes,
  microglia, and vascular cells possess distinct NRF2 regulatory baselines that reflect
  their intrinsic oxidative stress susceptibility. Consequently, the optimal route
  of NRF2 induction varies across cell types and, by extension, across neurological
  diseases dominated by those cells. Although direct cell-specific data for non-pharmacological
  interventions are not yet available, the signaling pathways they recruit provide
  a rationale for therapeutic matching. Modalities such as physical exercise and DR
  activation, which primarily engage neuronal and oligodendroglial NRF2 signaling,
  may be preferable for disorders characterized by parenchymal injury. In contrast,
  interventions that robustly influence vascular NRF2 networks, e.g., electroacupuncture
  or electroconvulsive stimulation, may prove more advantageous in pathologies driven
  by cerebrovascular dysfunction. (Created with BioRender.com)
