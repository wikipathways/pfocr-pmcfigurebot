figure_title: Putative impact of ZEN and its metabolites on steroid hormone biosynthesis
  in dairy cows (Bos taurus).
caption: 'Putative impact of ZEN and its metabolites on steroid hormone biosynthesis
  in dairy cows (Bos taurus). ZEN disrupts the normal steroidogenic pathway by inhibiting
  key enzymatic steps, including cytochrome P450 enzymes, 3β-hydroxysteroid dehydrogenase
  (3β-HSD), and 17β-hydroxysteroid dehydrogenase (17β-HSD). These disruptions impair
  the conversion of pregnenolone to progesterone and androgens, ultimately leading
  to altered estrogen synthesis. α-ZEL and β-ZEL further stimulate aromatase activity
  and directly bind to estrogen receptors (ER), mimicking endogenous estrogens and
  promoting a hyperestrogenic state. * = metabolite not annotated by UHPLC-HRMS; **
  = metabolite with low predictive value (VIP score < 1). Arrow colors represent metabolite
  accumulation in MTX vs. CTR: red indicates up-accumulation; blue indicates down-accumulation'
