figure_title: The microbiome shapes the transcriptional landscape of every major cell
  type in the brain
caption: 'Single-nucleus RNA-seq was performed on hippocampal samples from young adult
  female germ-free (GF) and conventionally raised (CONV) mice (Table S1; NIH GEO:
  GSE289589).(A) UMAP shows all major cell types identified as well as the amount
  of each cell type found within each treatment group.(B) Cell type markers representing
  each major cell-type cluster.(C) Total number of differentially expressed genes
  (DEGs; log fold change > |1|, p < 0.001) in GF mice compared with CONV across each
  cell type.(D) DEGs normalized by the number of cells in that cluster DEGstotal cells
  in cluster×100.(E) GSEA showing increased neurogenerative disease KEGG pathways
  in GF excitatory and inhibitory neurons.(F) Representative pathways increased in
  at least four cell types by overrepresentation analysis.Data represent cells from
  4 mice per treatment'
article_title: Indigenous gut microbes modulate neural cell state and neurodegenerative
