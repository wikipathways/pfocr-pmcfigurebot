figure_title: MKRN2 represses ccRCC proliferation and promoted tumor cell apoptosis
  by antagozing PPP2CA-activated Wnt pathway.
caption: 'MKRN2 represses ccRCC proliferation and promoted tumor cell apoptosis by
  antagozing PPP2CA-activated Wnt pathway. In light of the overexpression of MKRN2,
  cellular models featuring concurrent overexpression of PPP2CA were generated via
  the transfection of PPP2CA lentivirus. (A) A Western blot assay was employed to
  evaluate the protein levels of MKRN2 and PPP2CA in the specified cells. (B) Cell
  growth curves were established through CCK8 assays for the designated cells (n =
  3). (C, D) TUNEL staining was employed to illustrate the apoptosis rate in the designated
  cells (n = 3). (E, F) Flow cytometry analysis was employed to ascertain the proportion
  of apoptotic cells in the specified samples (n = 3). Significance levels denoted
  as follows: ****p < .0001, ***p < .001, **p < .01, and *p < .05'
