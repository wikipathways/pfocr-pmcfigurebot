figure_title: Model of TC-DPC repair
caption: A DPC represents a fundamental blockage to RNAPII, resulting in transcription
  stalling. The interaction between CSB and RNAPII becomes sustained, and the CRL4CSA
  complex is recruited. RNAPII (RPB1-K1268, although this is not functionally relevant)
  and the crosslinked protein are then ubiquitinated by the CRL4CSA complex. TFIIH
  is potentially involved, aiding duplex manipulation to allow for DPC access. The
  unfoldase protein, p97, in complex with VCP, is then recruited to aid DPC degradation
  by the proteasome. It is thought that RNAPII is not evicted during DPC degradation.
  Degradation results in a crosslinked peptide remaining on the template strand, which
  would likely be a substrate for NER or another excision repair pathway [82,84]
