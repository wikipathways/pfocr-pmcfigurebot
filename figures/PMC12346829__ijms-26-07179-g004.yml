figure_title: Analysis of NRF-2 pathway in immature monocyte-derived dendritic cells
  (iDCs) treated with Lupeol.
caption: Analysis of NRF-2 pathway in immature monocyte-derived dendritic cells (iDCs)
  treated with Lupeol. (A) Representative immunofluorescent staining of NRF2 and HO-1
  in iDCs treated with Lupeol (25 µM), 7KCh (15 µM) or tertbutylhydroquinone (t-BHQ)
  for 18 h. The upright microscope Nikon Eclipse Ni-U with 60× magnification was used
  to capture micrographs. (B) Quantification of the intensity of the fluorescence
  signal for HO-1 and NRF2 by using Image J 1.53 t software. Nuclei were counterstained
  with DAPI, and nuclear segmentation was performed for each field of view using the
  DAPI fluorescence signal. Whole-cell fluorescence intensities of HO-1 and NRF2 were
  quantified by analyzing their respective signals in the green and red channels.
  To assess NRF2 translocation dynamics, nuclear and cytosolic NRF2 signals were delineated
  based on their corresponding fluorescence in the previously segmented compartments.
  The translocation of NRF2 was determined by calculating the ratio of mean pixel
  intensity between the nuclear (n) and cytoplasmic (c) compartments (n-NRF2/c-NRF2
  ratio). Data are presented as the mean ± SD for each group (n = 3). Significance
  was determined by one-way ANOVA followed by Tukey’s post hoc analysis; * p < 0.05;
  *** p < 0.001; **** p < 0.0001
article_title: Lupeol Attenuates Oxysterol-Induced Dendritic Cell Activation Through
  NRF2-Mediated Antioxidant and Anti-Inflammatory Effects
