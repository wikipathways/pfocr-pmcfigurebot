figure_title: Summary of increased neuroinflammation susceptibility in Sh3+/− mice
caption: The schematic drawing proposes a model of increased neuroinflammation and
  altered behavioral phenotypes in Shank3 haploinsufficiency mouse after LPS treatment.Generally
  speaking, LPS evokes neuroinflammation through three distinct pathways, 1) LPS binds
  to TLR4 expressed on neutrophils, promoting neutrophil infiltration through blood-brain
  barrier and activation of microglia cells; 2) LPS binds to TLR4 expressed in cerebral
  endothelial cells located in blood-brain barrier, compromising the integrity of
  blood-brain barrier and increasing permeability of additional immune components
  entering the brain; 3) LPS that penetrates blood-brain barrier binds to TLR4 expressed
  in microglia, activating microglia and triggering proinflammatory cytokines release.
  In Sh3+/− brain vs. WT brain, we observed excessive proinflammatory gene expression,
  proinflammatory cytokines, overactivation of microglia and increased expression
  of TLR4 at 24 hours after LPS injection. It suggests that LPS might exacerbate neuroinflammation
  responses through above routes in Sh3+/− mice.Microglia activation can sculpt synapses
  and brain circuits and change animal behavioral phenotypes long-term. In Sh3+/−
  brain vs. WT brain, we observed elevated microglia engulfment, reduced synapse,
  and decreased synaptic transmission gene expression at 24 hours after LPS injection,
  suggesting increased synapse elimination in Sh3+/− mice. At 2 weeks after LPS injection,
  we observed reduced synapse density, decreased PSD95 expression and lower expression
  of excitatory receptor expression. It indicates that neuroinflammation-induced synaptic
  dysfunction was associated with behavioral changes found in Sh3+/− mice
article_title: Inflammation increases the penetrance of behavioral impairment in Shank3
  haploinsufficiency mice – can it explain the behavioral regression in Autism?
