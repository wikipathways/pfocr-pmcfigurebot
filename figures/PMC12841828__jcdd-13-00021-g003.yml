figure_title: Molecular pathways of efferocytosis in cardiovascular pathology.
caption: Molecular pathways of efferocytosis in cardiovascular pathology. MFG-E8 binds
  integrin αvβ3 to PS located on the surface of apoptotic cells, but its expression
  is reduced in the mid- to late stages of atherosclerosis development. MFGE8 can
  bind directly to TG2, which is essential for cholesterol transport reversal and
  the prevention of plaque progression. Furthermore, C1q promotes macrophage viability
  by reducing the levels of active caspase-3 protein and PARP-1. Additionally, it
  has the potential to augment phagocytosis through the regulation of oxidized or
  acetylated LDL, enhance the functionality of cytosolic cells, and impede the progression
  of atherosclerosis. LRP1, together with its co-receptor CRT, enhances phagocytosis
  of apoptotic cells by acting on PS
