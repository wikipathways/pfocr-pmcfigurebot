figure_title: Periplocin suppresses NF-κB signaling through inhibition of HDAC10.
caption: Periplocin suppresses NF-κB signaling through inhibition of HDAC10. (A-B)
  KEGG pathway enrichment analysis of DEGs between Periplocin-treated and DMSO-treated
  K562 (A) and THP-1 (B) cells. (C) GSEA enrichment analysis of Periplocin-treated
  THP-1 cells. (D) Western blot analysis of total p65 and phosphorylated p65 in THP-1
  and K562 cells treated with DMSO or Periplocin. β-actin served as a loading control.
  (E) Western blot analysis of P-P65 expression in HDAC10 knockdown cells (KD1) and
  negative control (NC) in THP-1 and K562 cell lines. Data are presented as mean ±
  SD. *p < 0.05; **p < 0.01; ***p < 0.001
