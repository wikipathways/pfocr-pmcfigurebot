figure_title: The NLRP3 inflammasome pathway is silenced in OCs
caption: BMDMs from WT (A-F, I), Asc-citrine (G, H); and TrapRed;Asc-citrine mice
  (J-L) were treated with RANKL for 5 days or remained RANKL naïve. Cells were primed
  with 100 ng/ml LPS (B-J;L) or 10 ng/ml TNF-α (K) for 3 h and stimulated with 15
  μM nigericin for 45 mins (D-F; H-L). Samples were analyzed for NLRP3, GSDMD, cleaved
  GSDMD (cGSDMD), and β-Actin by immunoblotting (A,B,F) or for Nlrp3 expression by
  qRT-PCR (C). IL-1β (D) and LDH (E) levels in the supernatants were measured by ELISA
  and the cytotoxicity assay kit, respectively. Assessment of ASC-speck formation
  (G,H,J,K) or Sytox green uptake by live cells was imaged using a confocal microscope
  (I, L). Scale bar 50 μm. 2-way ANOVA with Tukey’s multiple comparison test. *p<0.05,
  **p<0.005; ***p<0.001; ****p<0.0001
