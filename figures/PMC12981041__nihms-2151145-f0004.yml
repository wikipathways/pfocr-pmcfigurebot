figure_title: Assessments of phenotypic consequences of increased NDRG1 in aged MuSCs
  downstream repression of the PI3K-AKT-mTOR pathway
caption: (A) Gene set enrichment analysis (GSEA) of hallmark gene sets enriched in
  DEGs in old MuSCs. (B) GSEA signature plots. (C) Representative immunoblots of MuSCs
  isolated from old WT and NDRG1cKO mice. (D, E) From replicate studies as in (C),
  band intensities of p-mTOR and p-AKT were normalized to those of total mTOR and
  AKT, respectively (n=4). (F) Freshly isolated old WT and NDRG1cKO MuSCs were treated
  with 100 nM of rapamycin for 48 h. EdU incorporation in the MuSCs was quantified
  after 40 h culture in the continuous presence of EdU (n=4). (G) Schematic of tamoxifen
  injection and in vivo EdU treatment. (H) In vivo EdU incorporation in YFP+ MuSCs
  isolated from each group of mice treated as described in (G) (n=4). (I) (Left) YFP+
  MuSC size was measured as forward angle light scatter (FSC) using flow cytometry
  (n=4). (Right) Representative FACS plot. (J) Schematic of tamoxifen injection and
  rapamycin and EdU treatments related to panels (K)-(M). (K) Spontaneous cell cycle
  entry in the absence of injury measured by in vivo EdU incorporation in freshly
  isolated MuSCs (n=4). (L) Quantification of cell size by FSC (n=4). (M) Quantification
  of dead YFP+ MuSCs upon isolation (n=4). P values were calculated using a two-sided
  unpaired Student’s t-test. Data are shown as mean ± SD in D-F, H, I, and K-M; *P
  < 0.05; **P < 0.01; ns = not significant
article_title: Cellular Survivorship Bias as a Mechanistic Driver of Muscle Stem Cell
  Aging
