figure_title: Therapeutic strategies targeting Lp-PLA2 in tumor treatment.
caption: 'Therapeutic strategies targeting Lp-PLA2 in tumor treatment. (A) Therapeutic
  strategies aimed at targeting Lp-PLA2 in the context of tumour treatment. Three
  distinct methodologies are presented: i) The small-molecule inhibitor darapladib,
  which enhances lipid metabolism, thereby increasing the susceptibility of cancer
  cells to ferroptosis. ii) Monoclonal antibodies (1H8 IgG and 1Ag VH-Fc) that selectively
  bind to specific epitopes of Lp-PLA2, effectively inhibiting the proliferation and
  migration of tumor cells. B and C the synergistic antitumor effects observed when
  darapladib is combined with PD-1 blockade. In vitro and in vivo studies both indicate
  that the combination of darapladib with a PD-1 inhibitor results in a significant
  reduction in tumor growth compared to the effects of monotherapy. AA, arachidonic
  acid; CCL5, C-C motif chemokine ligand 5; CD8, cluster of differentiation 8; CXCL10,
  C-X-C motif chemokine ligand 10; FFA, free fatty acid; IL-1β, interleukin-1 β; LPC,
  lysophosphatidylcholine; Lp-PLA2, lipoprotein-associated phospholipase a2; Lyso-PE,
  lysophosphatidylethanolamine; MAPK, mitogen-activated protein kinase; NF-κB, nuclear
  factor κ-light-chain-enhancer of activated B cells; Ox-PE, oxidized phosphatidylethanolamine;
  PD-1, programmed cell death protein 1; PEP, phosphatidylethanolamine plasmalogen;
  PI3K-AKT, phosphoinositide 3-kinase-protein kinase B pathway; TAMs, tumour-associated
  macrophages; TNF-α, tumor necrosis factor-α'
