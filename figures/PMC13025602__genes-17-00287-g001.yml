figure_title: Schematic representation of the three major genetic pathways contributing
  to gestational diabetes mellitus.
caption: Schematic representation of the three major genetic pathways contributing
  to gestational diabetes mellitus. The MTNR1B pathway shows how the rs10830963 variant
  leads to MT2 receptor overexpression, melatonin-mediated inhibition of insulin secretion,
  and inadequate β-cell compensation. The rs10830963 G risk allele leads to overexpression
  of the MT2 melatonin receptor on pancreatic β-cells (upward arrow). Elevated MT2
  signaling inhibits cAMP production via Gi protein coupling (inhibitory arrow), suppressing
  glucose-stimulated insulin secretion (GSIS; downward arrow on insulin granule release).
  The CDKAL1 pathway illustrates how the rs7754840 variant causes reduced tRNA modification,
  proinsulin translation errors, ER stress, and β-cell dysfunction. The rs7754840
  C risk allele impairs the methylthiotransferase enzyme that adds the ms2t6A37 modification
  to tRNA-Lys(UUU) (disrupted modification symbol). Hypomodified tRNA causes misreading
  of lysine codons during proinsulin translation (error symbol), producing misfolded
  proinsulin that accumulates in the ER, triggering the unfolded protein response
  (UPR), leading to β-cell dysfunction and apoptosis (cell damage symbol). The IRS1
  pathway demonstrates how the Gly972Arg variant impairs insulin receptor signaling,
  reduces PI3K/AKT activation, and decreases GLUT4 translocation. The Gly972Arg substitution
  impairs IRS1 tyrosine phosphorylation (diminished phosphorylation symbol), reducing
  PI3K/AKT activation (downward arrows), impairing AS160 phosphorylation and GLUT4
  translocation (impaired translocation arrow), and decreasing glucose uptake in muscle
  and adipose tissue. All three pathways converge during the third trimester, when
  pregnancy-induced metabolic stress and rising insulin resistance, driven by placental
  and hormonal factors such as hPL, TNF-α, cortisol, and progesterone, create a heightened
  demand for β-cell compensation. In this setting, combined defects in insulin secretion
  (associated with MTNR1B and CDKAL1 variants) and impaired insulin signaling (linked
  to IRS1) limit the ability to maintain euglycemia, ultimately resulting in inadequate
  insulin secretion, increased insulin resistance, and the hyperglycemia characteristic
  of GDM
