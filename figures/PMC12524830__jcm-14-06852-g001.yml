caption: Pathway illustrating the hypothetical connection between menopausal vasomotor
  symptoms (VMSs), altered sleep, and depressive symptoms, and their hypothetical
  association with long-term health risks. VMSs and depression affect sleep patterns,
  which in turn influence the symptoms of depression in a bidirectional manner. These
  factors induce biological changes such as non-dipping blood pressure, elevated cortisol
  levels, oxidative stress, and increased heart rate, all of which correlate with
  increased risks for cardiovascular disease, osteoporosis, and cognitive decline.
  Neurokinin antagonists, such as fezolinetant and elinzanetant, may mitigate vasomotor
  symptoms, depressive symptoms, and sleep disturbances, potentially decreasing the
  associated biological changes and the long-term health risks
