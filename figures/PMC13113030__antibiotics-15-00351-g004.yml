figure_title: 'The antibiotics disrupt bacterial nucleic acid synthesis and replication:
  (a) The catalytic cycle of DNA supercoiling induced by DNA gyrase and the mechanism
  of action of quinolones.'
caption: 'The antibiotics disrupt bacterial nucleic acid synthesis and replication:
  (a) The catalytic cycle of DNA supercoiling induced by DNA gyrase and the mechanism
  of action of quinolones. The specific stages of the catalytic cycle reaction on
  the left are unclear, with the dashed black circles and the right inset illustrating
  the lethal model of quinolones. Quinolones stabilize the drug––enzyme––DNA complex
  between the DNA double strands, affecting replication and transcription, ultimately
  leading to slow bacterial death if the complex is not cleared. If the broken double
  strands are not repaired after removing the complex, it results in rapid bacterial
  death. The presence of quinolones also causes ROS accumulation, leading to rapid
  bacterial death. (b) Reduction and toxicity of metronidazole in bacteria. Depending
  on the number of electrons accepted by metronidazole, it can form a nitroimidazole
  radical anion ①, a nitrosoimidazole ②, and a hydroxylaminimidazole ③. This process
  can proceed in the sequence ①→③ or be achieved in a single catalytic step. It is
  hypothesized that certain enzymes can transfer 6e– to metronidazole to form the
  non–reactive aminoimidazole ④, leading to metronidazole resistance. In the presence
  of oxygen, ① can be oxidized back to the metronidazole precursor. Active intermediates
  ①–③ damage bacterial DNA. Molecular oxygen is shown in blue; the superoxide radical
  and electrons are shown in red. (c) The bacterial flavoproteins convert nitrofurans
  to the corresponding nitro compounds, causing damage to bacterial DNA/RNA. The red
  circle highlights the reduced nitroso intermediate produced by bacterial flavoproteins.
  (d) Rifamycins inhibit RNA synthesis by directly blocking the RNA extension pathway
  by binding to RNA polymerase (RNAP)'
