figure_title: Mh-infected patients show impaired transcriptional response to Mh in
  vitro, which is GATA2 dependent
caption: (A) Number of differentially expressed genes (DEGs) in response whole blood
  stimulation to HK Mh add Mab in HCs (n = 3) and Mh-infected patients (n = 4). (B)
  Overlap of upregulated genes to Mh stimulation in HC and MH-infected patients. (C)
  Reactome pathway enrichment of the common 23 genes in B. (D) Overlap of downregulated
  genes to Mh stimulation in HC and Mh-infected patients. (E) Reactome pathway enrichment
  of the common 333 genes in D. (F) The pathway enrichment of the 17 exclusively upregulated
  genes in Mh-infected (Reactome). (G) Pathway enrichment of the 71 exclusively downregulated
  genes in Mh-infected patients implemented in Enrichr (113, 115, 116). (H) Putative
  TF enrichment of up and downregulated genes exclusively regulated in Mh-infected
  individuals. (I and J) The summed z-pathway score of the top up- and downregulated
  pathway for each condition. Each dot represents an individual. Two-way ANOVA with
  Sidak’s multiple correction was used. *P < 0.05. (K) Reduced cytokine levels after
  GATA2 knockdown using siRNA in human PBMCs (n = 4) as compared with scrambled and
  unstimulated controls. Kruskal-Wallis test with multiple comparisons is reported.
  Data are shown as mean ± SD. (L) Multiplex cytokine assay shows widespread reduction
  in inflammatory responses in healthy PBMCs (n = 2) upon GATA2 siRNA treatment to
  Mh stimulation. A heatmap of log2FC of cytokine and chemokine levels over the levels
  in unstimulated, showing scrambled versus siRNA treated PBMCs upon Mh stimulation.
  Two-way ANOVA results are shown with Fisher’s LSD. *P < 0.05, **P < 0.01
article_title: GATA2 mutation is associated with immune dysfunction and increased
  Mycobacterium haemophilum susceptibility in immunocompromised individuals
