figure_title: RNA-Seq identified the differentially expressed genes in zebrafish hearts
  after AVM and MPs co-exposure.
caption: RNA-Seq identified the differentially expressed genes in zebrafish hearts
  after AVM and MPs co-exposure. (A) The hierarchical clustering analysis of DEGs
  in each group is presented by heatmap. Red represents significantly upregulated
  genes, while green represents significantly downregulated genes. (B) Venn diagram
  of differential genes in three groups. The number of overlapped genes appears in
  the corresponding region. (C) The KEGG pathway classification of all DEGs in the
  AVM, AVM+LMPs, and AVM+SMPs groups when compared with the control group. The X-axis
  presents the −log10 (p-value) or count of genes, and the top pathways are displayed
  in each group. (D) Functional enrichment analysis of all DEGs genes in GO-biological
  processes (GO-BPs). (E) The cluster analysis revealed distinct expression profiles
  of MAPK signaling pathway-associated genes in different groups. (F) The heatmap
  visualization demonstrates group-specific expression patterns of DEGs involved in
  oxidation–reduction signaling pathways
