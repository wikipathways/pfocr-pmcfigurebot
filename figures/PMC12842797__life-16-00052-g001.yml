figure_title: Cytokine- and mechanotransduction-driven programming of pro-fibrotic
  M2 macrophages in kidney fibrosis.
caption: Cytokine- and mechanotransduction-driven programming of pro-fibrotic M2 macrophages
  in kidney fibrosis. This figure illustrates the major cytokine, metabolic, and mechanical
  signaling pathways that drive M2 macrophage polarization and stabilize pro-fibrotic
  phenotypes in the injured kidney. Th2 cytokines IL-4 and IL-13 initiate classical
  M2 programming by activating the JAK–STAT6 pathway, inducing transcription factors
  such as IRF4 and KLF4, and promoting the expression of M2 markers including ARG1,
  FIZZ1, YM1, and MRC1. STAT6 signaling also upregulates transglutaminase 2 (TG2),
  which enhances ALOX15 expression and 15(S)-HETE production and increases ECM stiffness,
  further reinforcing M2 activation. Persistent IL-10 and TGF-β feedback loops prolong
  STAT6 activity, converting an initially reparative response into chronic pro-fibrotic
  signaling. Epithelial-derived IL-33 additionally amplifies the Th2 cytokine milieu
  by activating ILC2s through the ST2 receptor, increasing IL-5, IL-13, and AREG production
  and promoting sustained M2 polarization. Meanwhile, TGF-β–Smad2/3 and IL-10–STAT3
  pathways suppress pro-inflammatory programs and stimulate fibroblast activation,
  establishing a self-reinforcing IL-10– and TGF-β–rich microenvironment. Integrin–FAK–RhoA
  signaling and mechanosensitive channels such as Piezo1 and TRPV4 increase actomyosin
  tension and Ca2+ influx, driving YAP/TAZ nuclear translocation. Nuclear YAP/TAZ
  interacts with TEAD, Smad, and β-catenin to amplify TGF-β–Smad and Wnt pathways,
  enhancing M2 gene expression and sustaining fibrotic programming
article_title: Macrophage Plasticity and Regulatory Networks During the Transition
  from Inflammation to Fibrosis in the Kidney
