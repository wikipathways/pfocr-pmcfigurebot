figure_title: Gene expression and pathways regulated by GLI2 in PSC.
caption: 'Gene expression and pathways regulated by GLI2 in PSC. (A) Schematic representation
  of the study design for bulk RNA sequencing of PSCs derived from Gli2△PSC and Gli2fl/fl
  mice. (B) Heatmap displaying the expression levels of selected adipogenic and fibrotic
  genes in PSCs derived from Gli2△PSC and Gli2fl/fl mice. (C) Volcano plots visualizing
  the differentially expressed genes (DEGs) in PSCs derived from Gli2△PSC and Gli2fl/fl
  mice. (D) GO enrichment analysis identifying GLI2-upregulated biological processes
  and pathways. (E-H) mRNA levels of genes enriched for GO biological processes ''Cellular
  responses to IFN-γ'' (E), ''Positive regulation of IL-6 production'' (F), ''Positive
  regulation of NF-κB transcription factor activity'' (G) and ''Cellular response
  to IFN-β'' (H). D2 PSCs were treated with 1 ng/mL TGF-β1 and 5 μM GANT61 for 48
  hours (n = 3). All data are represented as mean ± SEM. Statistical significance:
  ∗p < 0.05, ∗∗p < 0.01, ∗∗∗p < 0.001, ns, not significant'
