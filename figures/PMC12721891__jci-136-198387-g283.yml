figure_title: Bulk RNA-Seq and proteomics of LmnaiADKO WAT reveals increased inflammation
  and reduced fatty acid metabolism and mitochondrial pathways, similar to human FPLD2
  biopsies
caption: All data from female mice. LmnaiADKO and Lmnafl/fl pmWAT 2 weeks posttamoxifen
  was used for RNA-Seq (n = 6–7) and proteomics (n = 5). (A) Integrative GSEA on bulk
  RNA-Seq and proteomics. Pink dots symbolize that NES significantly changed in both
  RNA-Seq and proteomics datasets, orange dots that NES changed only in proteomics,
  and blue that NES changed only in RNA-Seq. (B) Highlighted GSEA pathways changed
  in both proteomics and RNA-Seq. Numbers on bars represent number of overlapping
  genes driving pathways. (C) Highlighted GSEA pathways changed in proteomics only.
  Heatmaps showing selected changes in genes driving (D) lipid biosynthesis, (E) mitochondrial
  function, (F) inflammation, and (G) cell death. TAG, triacylglycerol. (H) Integrative
  GSEA of LmnaiADKO pmWAT bulk RNA-Seq compared with FPLD2 bulk RNA-Seq (Figure 2).
  (I) Highlighted GSEA pathways changed in both mouse and human RNA-Seq datasets.
  (J) Leading-edge genes for GSEA pathways related to inflammation, fatty acid metabolism,
  and mitochondrial function for either iADKO or FPLD2 samples
article_title: Altered lipid metabolism and inflammatory programs associate with adipocyte
