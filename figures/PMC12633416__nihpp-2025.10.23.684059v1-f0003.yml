figure_title: Distinct hierarchical assemblies from concerted transitions of synIDP
caption: 'a, The temperature-pH phase diagram for pathway-dependent assembly to achieve
  each gel morphology from soluble synIDP; Heating and subsequent acidification produces
  arrested droplets, heating low pH samples leads to fractal gels with pH-dependent
  subunit sizes, and lowering pH to grow nanofibers before heating produces filament
  gels. b, Freshly prepared Alexafluor-488 labeled synIDP at pH 7.4 forms homogenous
  liquid droplets. c, Adjusting the pH to 6.0 with acid causes droplets to develop
  micro-phase separated structures. d, Heating fresh synIDP prepared at low pHs generates
  fractal gel networks: 2D projections of confocal z-stacks taken of synIDP transitioned
  at ph 5.2 with inserts showing aggregated microdroplet subunits. e, CryoTEM imaging
  of a pH 6.0 synIDP sample incubated for 3 days to grow high aspect ratio nanofibers.
  f, Z-stack projection of a filament gel formed by heating a pH 6 nanofiber sample
  after 3 days of incubation at 25 °C. h, SEM of a filament gel to show synIDP wetting
  of nanofiber bundles. Sample was prepared at pH 6 and has been flash frozen and
  desiccated'
