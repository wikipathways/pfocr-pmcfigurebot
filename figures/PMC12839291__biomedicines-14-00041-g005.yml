figure_title: Signalling pathway triggered by IL-1β affecting proliferation and death
  in RS4:11 leukaemic lymphoblasts.
caption: Signalling pathway triggered by IL-1β affecting proliferation and death in
  RS4:11 leukaemic lymphoblasts. A model is proposed based on the results obtained
  in this study and previously reported data on the targeting of PI3K/AKT to IKKβ,
  Src to IKKβ (Src is likely to phosphorylate IKKβ)., and IKKβ to the p65 subunit
  of NF-κB, leading to its translocation to the nucleus. IL-1β binds to its receptor
  on leukaemic lymphoblasts, recruiting and activating PI3K/AKT and Src at this receptor.
  These kinases then activate IKKβ, which phosphorylates the p65 subunit of NF-κB,
  causing it to translocate to the nucleus. Once in the nucleus, NF-κB induces the
  transcription of target genes such as cyclin D1, Bcl-2, and cIAP1. Overexpression
  of cyclin D1 can increase proliferation. Higher levels of Bcl-2 and cIAP1 may be
  associated with inhibition of apoptosis, and cIAP1 might also help limit necroptosis
  through the ubiquitination of RIPK1 and its subsequent degradation. Created in BioRender.
  Gudiño garcía, A. (2025) https://BioRender.com/chl9kru
