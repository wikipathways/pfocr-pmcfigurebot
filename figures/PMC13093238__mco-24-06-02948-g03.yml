figure_title: Schematic summary of the oncogenic roles and signaling networks of LEMD1
  in different types of tumors.
caption: Schematic summary of the oncogenic roles and signaling networks of LEMD1
  in different types of tumors. An integrated overview of the upstream regulators,
  downstream signaling pathways and functional consequences associated with LEMD1
  overexpression across multiple types of cancer. In the nucleus/nuclear membrane,
  SOX4 and LEMD1-AS1/LINC00958 are upstream regulators of LEMD1, which contribute
  to transcriptional activation and disruption of microRNA-mediated inhibition, respectively.
  LEMD1 overexpression activates multiple downstream signaling pathways, including
  PI3K/p-Akt, ERK1/2, β-catenin, RhoA/ROCK and p53/mTORC1-related pathways, and is
  associated with altered expression of E-cadherin, N-cadherin and vimentin. These
  downstream events are associated with increased proliferation, survival/anti-apoptosis,
  the EMT and invasion/metastasis, chemoresistance, and CSC traits (such as an enhanced
  sphere formation ability, elevated expression of stemness markers and an increased
  tumor-initiating potential). The tumor-type-specific pathway associations reported
  in GC, CRC and NSCLC, as well as in TNBC, PTC and PC are summarized. Arrowheads
  indicate activation, T-shaped lines indicate inhibition, and dashed lines indicate
  protein-protein interaction. The present figure was produced using Adobe Illustrator
  2024 (version 28; Adobe Systems, Inc.). BAF, barrier-to-autointegration factor;
  CSC, cancer stem cell; CRC, colorectal cancer; EMT, epithelial-mesenchymal transition;
  GC, gastric cancer; LEMD1, LAP2-emerin-MAN1 domain-containing protein 1; LEMD1-AS1,
  LEMD1 antisense RNA 1; LINC00958, long intergenic non-protein coding RNA 958; mTORC1,
  mechanistic target of rapamycin complex 1; NSCLC, non-small cell lung cancer; p-Akt,
  phosphorylated Akt; PC, pancreatic cancer; PTC, papillary thyroid cancer; ROCK,
  Rho-associated coiled-coil containing protein kinase; RhoA, Ras homolog family member
  A; SOX4, SRY-box transcription factor 4; TNBC, triple-negative breast cancer
