figure_title: Mass budget of mercury (Hg) cycling in the estuaries under different
  stratification conditions at steady state.
caption: Mass budget of mercury (Hg) cycling in the estuaries under different stratification
  conditions at steady state. A) Chesapeake Bay (CPB) under slightly stratified conditions
  during periods of increased river discharge. B) Chesapeake Bay (CPB) under well-mixed
  conditions during periods of decreased river discharge. C) Hudson River Estuary
  (HRE) under highly stratified conditions during periods of increased river discharge.
  D) Hudson River Estuary (HRE) under slightly stratified conditions during periods
  of decreased river discharge. The inorganic Hg reservoirs are in kmol, and the organic
  Hg reservoirs are in mol. Each arrow color highlights a distinct pathway in the
  Hg cycling process, with orange arrows representing external inputs into the water
  column, purple arrows representing outputs from the water column, green and gray
  arrows representing biogeochemical transformations between the four main Hg species,
  and yellow arrows representing the estuarine mixing mechanisms. Tidal inflow and
  ocean export are shown separately to illustrate the magnitude of each directional
  flux, but together represent the bidirectional tidal exchange process
