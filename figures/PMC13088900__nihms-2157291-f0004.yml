figure_title: Temporal dynamics of the global proteome of LPS-treated PMNs
caption: '(A) Volcano plots comparing 1 h vs 30 min (left), and 6 h vs 30 min (right)
  within each treatment: CTRL (top), ECO (middle), and FT (bottom). (B) Top: K-means
  clustering (K = 3) performed on all DEPs in at least one pairwise comparison within
  ECO treatment. Bold lines represent cluster centroids; thin lines represent individual
  DEPs. Bottom: Heatmap of DEPs in ECO treatment, separated by cluster. Red indicates
  relative increase in abundance and blue indicates relative decrease. (C) Gene Ontology
  Biological Process (GO-BP), Cellular Component (GO-CC), and Reactome pathway enrichment
  analysis for proteins assigned to cluster 1 in ECO-treated PMNs. (D) GO-CC enrichment
  analysis for proteins assigned to clusters 2 and 3, in ECO-treated PMNs. DEPs were
  calculated using limma with donor as blocking factor, employing empirical Bayes
  statistics; all p-values were two-sided. DEPs were considered at an FDR (q-value)
  < 0.05, indicated by the horizontal dashed line in the volcano plots, with upregulated
  proteins shown in red, downregulated proteins in blue, and non-significant proteins
  in gray. For all GO enrichment and reactome analyses, terms were considered significant
  at FDR < 0.05, n = 6'
