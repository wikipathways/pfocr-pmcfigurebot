figure_title: Pan-cancer analysis of KLRB1 expression and prognostic impact.
caption: Pan-cancer analysis of KLRB1 expression and prognostic impact. (A) Expression
  of KLRB1 across multiple cancer types in The Cancer Genome Atlas. Significant differences
  in KLRB1 expression were observed in several cancer types, including LIHC. (B) Prognostic
  analysis of KLRB1 expression in pan-cancer datasets, including DFI, DSS, OS and
  PFI. (C) Forest plot analysis of OS based on KLRB1 expression in pan-cancer. (D)
  Gene Set Enrichment Analysis revealed significant biological pathways enriched in
  both high- and low-expression groups, suggesting that KLRB1 may regulate important
  tumor-related processes. *P<0.05; **P<0.01; ***P<0.001; t-test based P-value. KLRB1,
  killer cell lectin like receptor B1; LIHC, liver hepatocellular carcinoma; DFI,
