figure_title: Correlation, interaction network, and enrichment analysis.
caption: 'Correlation, interaction network, and enrichment analysis. Abbreviations:
  %β, beta-cell function; BP, biological process; CC, cellular component; FDR, false
  discovery rate; HOMA2, Homeostasis Model Assessment 2; IR, insulin resistance; MF,
  molecular function. (A) Correlation of significant microRNAs with anthropometric
  and biochemical measurements. * p < 0.05, ** p < 0.01. (B) A network of interactions
  between 18 microRNAs and their target genes. These microRNAs were connected by lines
  to various target genes (mRNAs) indicated by orange circles. Arrows indicate the
  direction of regulatory interactions from miRNAs to their target mRNAs. (C) A bubble
  chart of Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway analysis for the
  target genes of the miRNAs from Panel (B). Bubble color indicates the significance
  of pathway enrichment (−log10 FDR-adjusted p), and bubble size reflects the number
  of genes involved in each pathway. (D) A bar chart of Gene Ontology (GO) analysis
  results. The bars were colored representing different levels of statistical significance
  (FDR-adjusted p), with bar length indicating the number of genes associated with
  each term'
