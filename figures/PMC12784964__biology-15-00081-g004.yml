figure_title: During the initial stages of ischemia, cardiomyocytes tend to undergo
  apoptosis more frequently, whereas necroptosis is more prevalent during reperfusion.
caption: During the initial stages of ischemia, cardiomyocytes tend to undergo apoptosis
  more frequently, whereas necroptosis is more prevalent during reperfusion. In ischemia,
  an influx of Ca2+ and the production of a large amount of ROS induce a reduction
  in the amount or activities of anti-apoptotic proteins such as BCL2 or MCL1 and
  an increase in pro-apoptotic proteins, leading to apoptosis. However, during reperfusion,
  the activation of the RIP1/RIP3 pathway induces the phosphorylation and translocation
  of MLKL to mitochondria, resulting in the degradation of MCL1. This triggers the
  opening of the MPTP, as well as the BAK/BAX-dependent MOMP, ultimately leading to
  necroptosis
