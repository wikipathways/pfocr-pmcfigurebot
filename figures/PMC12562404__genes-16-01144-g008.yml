figure_title: KEGG pathway enrichment analysis of ESR2-associated genes.
caption: KEGG pathway enrichment analysis of ESR2-associated genes. The bubble plot
  displays significantly enriched pathways, with the x-axis representing the enrichment
  signal score. Bubble size corresponds to the number of enriched genes, while bubble
  color indicates the false discovery rate (FDR), with lighter shades reflecting higher
  significance. Notably enriched pathways include endocrine resistance, estrogen signaling,
  thyroid hormone signaling, breast cancer, and general cancer pathways, highlighting
  the oncogenic relevance of ESR2 alterations
