figure_title: Graphical representation of the transcriptional profile of riboflavin
  pathway genes in A.
caption: Graphical representation of the transcriptional profile of riboflavin pathway
  genes in A. thaliana across developmental stages, tissues, and abiotic stress conditions.
  Upregulated and downregulated genes are shown in red and blue, respectively. Genes
  highlighted in both colors exhibit induction or suppression depending on the stress
  type. Genes without color show a stable expression pattern. The asterisks mars genes
  whose expression is altered only under osmotic stress. Most genes display elevated
  expression in siliques, germinating seeds, seedlings, and leaves. In contrast, FMN/FHY
  and PYRP2 maintain relatively stable expression across stages and tissues, being
  induced only in senescent leaves and dry seeds, respectively. This image was created
  with BioRender (Daras, G. 2025; https://BioRender.com/3p22o59, accessed on 20 August
  2025)
