figure_title: Silencing of miR-200a enhances Wnt signaling and promotes GEDF proliferation.
caption: Silencing of miR-200a enhances Wnt signaling and promotes GEDF proliferation.
  (A) RT-qPCR analysis showing significant upregulation of Wnt pathway genes following
  miR-200a inhibition. (B) Increased expression of proliferation markers in miR-200a-inhibited
  cells. (C) The CCK-8 assay indicates increased cell proliferation in groups treated
  with the miR-200a inhibitor relative to control groups. (D) EdU assay was performed
  at 24 h post-transfection for cell proliferation. (E) Quantitative analysis revealed
  significantly higher EdU-positive cell ratios in miR-200a-inhibited groups. All
  experiments included three biological replicates (n = 3), with data presented as
  mean ± SEM. (* p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001, ns = not significant)
