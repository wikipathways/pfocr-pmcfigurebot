figure_title: Mechanism of quazolinone compounds inducing cell death through apoptosis.
caption: Mechanism of quazolinone compounds inducing cell death through apoptosis.
  i) In the extrinsic pathway, the death ligand-receptor interaction triggers apoptotic
  signaling and forms the DISC complex, activating the Caspase-8/-3 cascade, leading
  to cell apoptosis (HMJ-38 induces apoptosis through the Fas/Death receptor-Caspase-8
  pathway and is regulated by p53/ATM signaling). ii) In the intrinsic pathway, quinazolinones
  downregulate Bcl-2/Bcl-xL and upregulate Bax/Bad, thereby promoting cytochrome c
  release, Apaf-1 apoptosome formation and Caspase-9/Caspase-3 cascade activation
  (QC suppresses Bcl-2, promotes the translocation of Bax into the mitochondria, releases
  Cyt C and activates Caspase-9. MITC-12 upregulates the Bax/Bcl-2 ratio and increases
  Caspase-3 expression. The analogs synthesized by Madbouly et al (61) induce apoptosis
  by promoting Caspase-3 and PARP-1 cleavage (compound 5k increases Bad and Bax, reduces
  Bcl-2 and Bcl-xL and enhances pro-apoptotic signals). iii) In the DNA damage pathway,
  ATM/ATR/p53 signaling induces Puma expression to enhance mitochondrial apoptosis
  (one of the mechanisms of HMJ-38 is to induce the p53/ATM signaling pathway through
  DNA damage, thereby activating the death receptor pathway Caspase-8). iv) ER stress
  activates the IRE1-TRAF2-ASK1 signaling pathway, which in turn activates the JNK
  and p38 MAPK pathways, induces CHOP expression, promotes the upregulation of TRIB3
  and DR5 and subsequently activates Caspase-3, Caspase-8 and Caspase-12, thereby
  inducing apoptosis (MJ-29 activates key markers of ER stress by increasing the protein
  levels of calpain 1 and CHOP). ER, endoplasmic reticulum; DISC, death-inducing signaling
  complex; DED, death effector domain; BID, BH3 interacting domain death agonist;
  APAF1, apoptotic peptidase activating factor 1; ING2, inhibitor of growth family
  member 2; Puma, P53 upregulated modulator of apoptosis; Bim, Bcl-2 interacting mediator
  of cell death; Bad, BCL2-associated agonist of cell death; JNK, c-Jun N-terminal
  kinase; IRE1, immunoglobulin-regulated enhancer 1; TRAF2, TNF receptor associated
  factor 2; ASK1, apoptosis signal-regulating kinase 1; CHOP, C/EBP homologous protein;
  TRIB3, Tribbles pseudokinase 3; DR5, death receptor 5; ATM, Ataxia-telangiectasia
  mutated proteins; ATR, Ataxia telangiectasia mutated and Rad3 related; caspase,
  cysteinyl aspartate specific proteinase
