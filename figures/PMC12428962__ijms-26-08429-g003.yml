figure_title: Statins inhibit mevalonate pathway and RhoA and Ras activation.
caption: Statins inhibit mevalonate pathway and RhoA and Ras activation. This diagram
  depicts the mevalonate pathway, detailing how the intermediates, GGPP and FPP, are
  utilized for activation of small G-proteins RhoA and Ras. HMG-CoA (1) is reduced
  to mevalonate (2), which leads to downstream conversion into non-steroidal isoprenoids
  (3), GGPP and FPP (4). RhoA and Ras become activated by these small G-proteins (4)
  via prenylation, specifically geranylgeranylation via GGPP and farnesylation via
  FPP. (5) These allow these molecules to be anchored to the cell’s inner membrane
  (6). The subsequent activation of several downstream signalling and outcomes, such
  as inflammation and cell progression (7), have been implicated in diseases such
  as diabetes, cancer, and more. Thus, by inhibiting the enzyme HMG-CoA, statins can
  inhibit the downstream cascade, allowing the attenuation of further signalling
