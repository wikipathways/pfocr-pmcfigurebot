caption: 'Validation analysis of acetylation modification of BDH1 protein in dairy
  goats. (A) Heat map related to each pathway of differentially acetylated modified
  proteins in dairy goats: lactation synthesis, lactose synthesis, milk protein synthesis,
  and milk fat synthesis. (B) Cluster analysis map of differentially acetylated modified
  proteins. (C) Interaction network map of differentially acetylated modified proteins
  of BDH1. (D) Interaction network map of the pathways of differentially acetylated
  modified proteins of BDH1. (E) Transfection of the pcDNA3.1-5×Flag -BDH1 plasmid
  after transfection, BDH1 acetylation modification was detected by IP and WB (using
  anti-acetylated lysine pan antibody). (F) Cells transfected with pcDNA3.1-Flag-BDH1
  plasmid were treated with 50 nM TSA or 100 μM NAM for 12 h, respectively, and BDH1
  acetylation levels were detected by IP and WB'
