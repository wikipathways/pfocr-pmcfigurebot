figure_title: A model depicting RICT-1 regulation of longevity through a Met-C-mitophagy
  axis
caption: The rict-1(ft7) worms fed on B12 or Met-rich diets display an increased osmotic
  stress tolerance and lifespan. Mechanistically, in the absence of RICT-1, the flux
  through the Met-C increases, resulting in an increased production of Met-C intermediates.
  This, in turn, leads to enhanced flow of Hcy into the transsulfuration pathway.
  This metabolic rerouting boosts levels of succinyl-CoA and succinate. Altogether,
  this results in fragmented mitochondria and enhanced mitophagy, ultimately contributing
  to osmotic stress tolerance and longevity benefits. Created in BioRender
article_title: RICTOR regulates an interspecies crosstalk that influences longevity
  through a novel methionine cycle-mitophagy axis
