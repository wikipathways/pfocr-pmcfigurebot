figure_title: DCBLD1 modulates EGFR signaling and physically interacts with EGFR.
caption: DCBLD1 modulates EGFR signaling and physically interacts with EGFR. A-B.
  Western blot analysis of the EGFR signaling pathway in A549 and H1299 cells upon
  DCBLD1 overexpression (A) or knockdown (B). C. Co-immunoprecipitation analysis of
  EGFR-DCBLD1 interaction in HEK-293T cells. Cells were transfected with EGFR-HA and/or
  DCBLD1-Flag plasmids for 48 h. Immunoprecipitation was performed using Flag or HA
  antibodies, followed by Western blot analysis. D. Endogenous co-immunoprecipitation
  assays were performed in A549 and H1299 cells using IgG control, DCBLD1 or EGFR
  antibodies. Immunoprecipitated complexes were analyzed by Western blot with EGFR
  and DCBLD1 antibodies. E. Representative confocal microscopy images showing co-localization
  of EGFR (green) and DCBLD1 (red) in A549 and H1299 cells. Scale bar, 20 μm. F. Schematic
  illustration of full-length DCBLD1 and EGFR proteins, and their corresponding truncation
  mutants. G. HEK-293T cells were co-transfected with EGFR-HA and either pcDNA3.1
  vector, DCBLD1-Flag, DCBLD1-ECD-Flag, or DCBLD1-ICD-Flag (upper panel). Alternatively,
  cells were co-transfected with DCBLD1-Flag and either pCMV vector, EGFR-HA, EGFR-ECD-HA,
  or EGFR-ICD-HA (lower panel). Co-immunoprecipitation assays were performed using
  HA or Flag antibodies, followed by Western blot analysis to identify interaction
  domains
