figure_title: 13C NMR of brain tissue extracts
caption: Brain tissues were collected 2 minutes after bolus injection of [U-13C3]lactate
  or [U-13C3]pyruvate. (A) PDH-mediated downstream products, including [5,6-13C2]citrate,
  [4,5-13C2]glutamate, [4,5-13C2]glutamine, [3,4-13C2]succinate, [1,2-13C2]GABA, and
  [3,4-13C2]aspartate, were detected in (B) 13C NMR spectra from both lactate-injected
  (red) and pyruvate-injected (blue) groups. As shown in the expanded spectral regions
  highlighting (C) carboxyl, (D) carbonyl, and (E) methylene carbons of selected metabolites,
  the brain spectra showed comparable fractional enrichments and isotopomer labeling
  patterns for lactate, succinate, and glutamate between lactate- and pyruvate-injected
  groups. (F) The absence of D23 doublets at the C3 positions of glutamate and glutamine
  indicates negligible contribution of PC pathway to their formation. Filled and open
  circles represent 13C-labeled and unlabeled (12C) carbons, respectively
article_title: Comparative evaluation of hyperpolarized [13C]pyruvate and [13C]lactate
  for imaging neuronal and glioma metabolism
