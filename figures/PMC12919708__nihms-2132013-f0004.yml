caption: Inflammasome pathway interleukin signaling for A) IL-1β and B) IL-18 levels
  (pg/mL) 24 h after Hb infusion in male, estrous female, and non-estrous female rats.
  IL-1β levels and IL-18 levels were significantly reduced in estrous females relative
  to both males and non-estrous females, suggesting reduced activation of the NLRP3
  pathway during the estrous cycle. Statistical significance (p < 0.05) between experimental
  groups is marked by * and compared to the control group is indicated by †
