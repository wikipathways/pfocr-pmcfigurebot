figure_title: Deficiency of Gadd45B enhances the stability of the MYCBP-c-MYC complex
  and TERT promoter activity by alleviating MYCBP degradation stress.
caption: 'Deficiency of Gadd45B enhances the stability of the MYCBP-c-MYC complex
  and TERT promoter activity by alleviating MYCBP degradation stress. (A) Schematic
  illustration of the effects of Gadd45B on the MYCBP-c-MYC complex and TERT promoter
  activity. (B) Workflow and analysis of immunoprecipitation-mass spectrometry (IP-MS)
  for Gadd45B in BRAFV600E-mutated cell lines. (C) Co-immunoprecipitation (Co-IP)
  and Western blot (WB) analysis of Gadd45B and MYCBP in Bcpap cells (n = 3 independent
  biological replicates). (D) Silver staining assay validating the interaction between
  Gadd45B and MYCBP in Bcpap cells (n = 3 independent biological replicates). (E)
  Representative immunofluorescence images showing the subcellular localization and
  expression levels of Gadd45B and MYCBP (scale bar: 10 µm; n = 3 independent biological
  replicates). (F) MYCBP expression levels in Bcpap cells treated with 1 µM MG(CHX)
  for the indicated durations, with relative quantification (n = 3 independent biological
  replicates). (G) Effects of MG132 treatment on MYCBP expression levels in Bcpap
  cells, with quantitative analysis (n = 3 independent biological replicates). (H)
  Ubiquitination levels of MYCBP in Bcpap cells with Gadd45B overexpression (n = 3
  independent biological replicates). (I) Protein expression levels of MYCBP, c-MYC,
  and TERT in Bcpap cells with Gadd45B overexpression, alone or combined with MYCBP
  overexpression, with quantitative analysis (n = 3 independent biological replicates).
  (J,K) Protein expression levels of MYCBP, c-MYC, and TERT in Bcpap cells with Gadd45B
  knockout, alone or combined with MYCBP downregulation (50 nM miR-26b-5p transfection),
  and corresponding quantitative analysis (n = 3 independent biological replicates).
  (L) Dual-luciferase reporter assays for wild-type, C228T, and C250T-mutated TERT
  promoters under the following conditions: control, Gadd45B overexpression, miR-26b-5p,
  and their combination (n = 3 independent biological replicates). (M,N) Protein expression
  levels of Sp1, GABPA, and GABPB, and their quantification in the indicated groups
  (n = 3 independent biological replicates). (O,P) Degree of MAPK signaling pathway
  activation in the indicated groups, with quantitative analysis (n = 3 independent
  biological replicates). (Q,R) Protein expression levels of c-MYC and iodine metabolism
  proteins (NIS, Tg, and TPO), with quantitative analysis (n = 3 independent biological
  replicates). Data are shown as mean ± SD. Statistical significance: ns: not significant,
  * p < 0.05, ** p < 0.01, *** p < 0.001. The uncropped blots are shown in Figure
  S12'
