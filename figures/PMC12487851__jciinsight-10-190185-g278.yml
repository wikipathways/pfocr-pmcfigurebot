figure_title: Metabolic reprogramming with citric acid cycle metabolites improves
  kidney viability after NMP
caption: (A) We hypothesized that replenishment of the citric acid cycle intermediates
  lost during NMP would lead to improved mitochondrial health, leading to better tissue
  integrity. (B) We named the buffer containing these additions MEPS. (C) Mapping
  of downregulated metabolites onto the citric acid cycle showed both input- and output
  of the cycle were downregulated. Therefore, we replenished the main input and output
  metabolites of the citric acid cycle to generate MEPS. (D) MEPS was tested during
  mouse NMP. (E) Metabolomics of kidneys after perfusion with MEPS showed 17 significantly
  upregulated metabolites. Multiple unpaired t test was used for analysis of significance.
  (F) Main upregulated metabolites were closely related to mitochondrial processes.
  (G) Metabolite organelle mapping returned mitochondria as the sole organelle predicted
  to be improved by MEPS. Multiple unpaired t tests were used for statistical analysis.
  (H) Pathway analysis showed partial reversal of deleterious changes seen with consensus
  buffer
