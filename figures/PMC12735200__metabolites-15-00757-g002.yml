figure_title: Enrichment plot for the comparison between high- vs.
caption: Enrichment plot for the comparison between high- vs. low-grade group. HILIC
  and RP enriched pathways were indicated by color green and blue, respectively. Differential
  metabolites were used as input for enrichment analysis with MetaboAnalyst 5.0. For
  each metabolic pathway, an over-representation analysis was performed to derive
  statistical significance for enrichment. (A) Enrichment factor was calculated as
  the ratio of the number of matched metabolites and the expected number of metabolites
  for a given pathway and presented at log10 scale. (B) The p-values were calculated
  by Fisher’s exact test for over-representation analysis in each pathway. Statistical
  significance was transformed into −log10(p-value) scale and indicated by the size
  of circles, with large circle size indicating higher significance
