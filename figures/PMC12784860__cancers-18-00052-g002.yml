figure_title: The 3PodR analytic framework for sex-informed drug repurposing.
caption: 'The 3PodR analytic framework for sex-informed drug repurposing. The 3PodR
  pipeline is a modular, R-based workflow designed to integrate transcriptomic data
  with drug repurposing analyses. It consists of three sequential analytic pods: (1)
  GSEA Pod: Gene Set Enrichment Analysis (GSEA) is applied to ranked transcriptomes
  to identify globally dysregulated pathways between glioma grades in a sex-stratified
  manner; (2) EnrichR Pod: leading-edge genes from the top GSEA pathways are input
  into EnrichR for over-representation analysis, enabling focused identification of
  functionally enriched gene sets using curated databases; (3) iLINCS Pod: refined
  gene sets are queried in the iLINCS platform to identify small molecules predicted
  to reverse sex-specific transcriptional signatures. Together, this stepwise framework
  progresses from broad pathway screening to targeted identification of actionable
  drug repurposing candidates'
article_title: Integrative Transcriptomic and Perturbagen Analyses Reveal Sex-Specific
