figure_title: MaR1 suppresses ferroptosis by PKA/LATS1/2/YAP activation in vitro.
caption: MaR1 suppresses ferroptosis by PKA/LATS1/2/YAP activation in vitro. (A) The
  protein expression levels of the PKA/LATS1/2/YAP pathway were determined by western
  blotting. (B) Quantification analysis of the protein expression levels of p-PKA,
  p-LATS1/2, and p-YAP protein. (C) Fold change in cell viability of the HPMEC cells.
  (D) Measurement of cell injury marker LDH in the HPMEC cells. (E) The levels of
  ROS were determined with the DCFH-DA fluorescent probe and quantified by flow cytometry.
  (F) Representative western blotting results of TFRC and ACSL4 expression. (G) Quantification
  analysis of the TFRC and ACSL4 expression levels. (H) Representative TEM images
  of each group. The white arrow indicates ferroptotic mitochondria, magnification
  ×8000. Data are presented as the mean ± SD, n = 6. * p < 0.05
