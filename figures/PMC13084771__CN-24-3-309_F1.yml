caption: Diagram of the main frontal and parietal regions in Brodmann’s map together
  with their association pathways. (A) Lateral view. The frontal lobe (green area)
  lies above the lateral sulcus, separated from the parietal lobe (red area) by the
  central sulcus. The parietal lobe transforms caudally into the occipital lobe without
  a definite landmark, it is split into the superior parietal lobule (SPL) and the
  inferior parietal lobule (IPL) by the intraparietal sulcus (IPS). The superior longitudinal
  fascicle is schematically drawn, which is the major long association pathway between
  the frontal lobe and the parietal lobe. (B) Mesial view. On the medial surface,
  both the frontal lobe and parietal lobe are located above the cingulum groove
