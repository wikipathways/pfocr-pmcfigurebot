caption: NAC is an inhibitor of the ROS/NF-κB signaling pathway and can restore testosterone
  production. (A) NAC effectively inhibits the expression of oxidative stress-related
  proteins (n = 3). (B) NAC suppresses the NF-κB signaling pathway (n = 3). (C) NAC
  restores the production of proteins associated with testosterone synthesis (n =
  3). (D–F) Immunofluorescence analyses of testosterone production-related proteins,
  which are rescued by the NAC inhibitor. Statistical significance is denoted as *
  p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
