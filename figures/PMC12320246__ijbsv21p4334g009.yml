figure_title: IGF2BP3 is correlated with OLFML1 expression in CRC and enhances the
  stemness of CRC cells.
caption: 'IGF2BP3 is correlated with OLFML1 expression in CRC and enhances the stemness
  of CRC cells. A Representative IGF2BP3, OLFML1, CD133 and GLI1 immunohistochemical
  staining images in serial sections from the same tumour tissue (CRC, n = 74) samples,
  scale bar 100 μm. B Spearman''s correlation analyses between IGF2BP3 and OLFML1
  expressions in CRC tissues. The level of 1+ represented for the score of 1-4, and
  2+ represented for the score of 6-8, and 3+ represented for the score of 9-12. Spearman
  r = 0.608, n = 74. C, D Percentage of IGF2BP3high OLFML1high (simultaneously high
  expression of both IGF2BP3 and OLFML1) or non-IGF2BP3high OLFML1high (non-high co-expression
  of IGF2BP3 and OLFML1) in 74 patients with different tumor size (C) and T stages
  (D). E-H Immunofluorescence images of OLFML1 and CD133 in RKO/IGF2BP3Mcherry (E)
  and SW620/IGF2BP3Mcherry (G) cells. The magnified parts of vector cells (dotted
  line) and IGF2BP3Mcherry overexpression cells (solid line) were respectively displayed.
  Mean fluorescence intensity levels of IGF2BP3, OLFML1 and CD133 from magnified parts
  in the left panel (n = 3 cells analysed per group). I Colony formation assays were
  performed in CRC cells treated with Vector, IGF2BP3 overexpression, and both IGF2BP3
  overexpression and OLFML1 knockdown. J The in vitro limiting dilution assay showed
  that IGF2BP3 enhances the formation of CSC spheres, simultaneously knockdown of
  OLFML1 reverses this effect (n = 12), likelihood ratio test. K Western blot assays
  demonstrate that overexpression of IGF2BP3 promotes expression of stem cell markers
  in CRC cells and hedgehog pathway-related proteins, while simultaneously knockdown
  of OLFML1 reverses this effect. Data information: Graphs report mean ± SD. Significances
  were assessed using 2-tailed Student''s t-test, except for (B) where Spearmen''s
  correlation test was used and (C, D) where Chi-square test was used. ***P< 0.001,
  **P< 0.01, *P< 0.05'
