figure_title: VD demonstrates potential in cancer immunotherapy.
caption: VD demonstrates potential in cancer immunotherapy. Its mechanisms of action
  include (1) interacting with pathways such as PPARγ/PI3K/ESR to regulate immune
  checkpoints like PD-L1; (2) modulating immune cell function; (3) upregulating MHC
  molecule expression to enhance immune recognition; and (4) suppressing pro-inflammatory
  factors such as IL-6/TNF-α. These multi-pathway synergistic effects suggest VD could
  serve as an ideal adjuvant to enhance the efficacy of immune checkpoint inhibitors
