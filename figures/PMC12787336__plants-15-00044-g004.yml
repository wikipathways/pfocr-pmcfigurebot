figure_title: Identification and functional enrichment analysis of DEGs.
caption: Identification and functional enrichment analysis of DEGs. (A) PCA of transcriptomic
  profiles from WT, ago1-38, ago1-25, and ago1-45. (B–D) Volcano plots showing differentially
  expressed genes (DEGs) in ago1-38, ago1-25, and ago1-45 relative to WT. Red and
  blue dots represent upregulated and downregulated DEGs, respectively. (E–G) KEGG
  enrichment analysis of DEGs in ago1-38, ago1-25, and ago1-45. (H–J) Gene Ontology
  (GO) enrichment analysis of DEGs in ago1-38, ago1-25, and ago1-45. In (E,H), the
  plant–pathogen reaction pathway was marked in green, the glutathione metabolism
  and MAPK signaling pathways were marked in bold font, and the salicylic acid response
  was marked in red font; these pathways are also extensively enriched in henceforth
  analysis
