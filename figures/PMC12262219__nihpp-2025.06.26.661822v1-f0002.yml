figure_title: Canonical pathway analysis of all the genes differentially expressed
  by epidermal γδ T cells comparing alopecia areata to control
caption: (a) Top differentially expressed genes on γδ T cells from publicly available
  scRNA sequencing data from Borcherding et al. (b) The top differentially expressed
  genes between alopecia and non-alopecia γδ T cells were clustered into canonical
  pathways based on IPA knowledge base platform. The threshold (orange line) depicts
  a default p-value of 0.05. A positive z-score (orange) shows the pathway is activated.
  A negative z-score (blue) shows the pathway is inhibited. No z-score (white) shows
  the pathway is neither activated nor inhibited. Z-scores not calculated (grey) shows
  the pathway did not have sufficient activity for a calculation. Bars are arranged
  by statistical significance
article_title: Epidermal γδ T cells, CD8 T cells and macrophages are increased in
  number in alopecia areata and express BST2 as part of an interferon-driven antiviral
  gene signature
