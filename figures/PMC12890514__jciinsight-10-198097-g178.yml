figure_title: aPD-L1–IFN-α exerts immunoadjuvant activity through the IFNAR signaling
  pathway in DCs and macrophages
caption: (A–D) HBV carrier mice or DC Ifnar1–/– HBV carrier mice (n = 5/group) were
  injected s.c. with a single dose of aPD-L1–IFN-α (2 μg/mouse) or PBS. After 24 hours,
  the expression of CD80 on DCs and macrophages in inguinal dLNs was analyzed by flow
  cytometry. The expression of CD80 on CD103+ mDCs (A), CD11b+ mDCs (B), CD169+F4/80+
  MΦ (C), and CD169–F4/80+ MΦ (D) is shown. (E and F) HBV carrier mice or DC Ifnar1–/–
  HBV carrier mice (n = 3/group) were treated as described in Figure 3A. Serum levels
  of ayw subtype–specific anti-HBsAg IgG (E) and HBsAg (F) were determined by ELISA.
  The detection limit in F is indicated by a dashed line. (G–J) HBV carrier mice or
  macrophage Ifnar1–/– HBV carrier mice (n = 5/group) were injected s.c. with a single
  dose of aPD-L1–IFN-α (2 μg/mouse) or PBS. After 24 hours, the expression of CD80
  on DCs and macrophages in inguinal dLNs was analyzed by flow cytometry. The expression
  of CD80 on CD169+F4/80+ MΦ (G), CD169–F4/80+ MΦ (H), CD103+ mDCs (I), and CD11b+
  mDCs (J) is shown. (K and L) HBV carrier mice or macrophage Ifnar1–/– HBV carrier
  mice (n = 3/group) were treated as described in Figure 3A. Serum levels of ayw subtype–specific
  anti-HBsAg IgG (K) and HBsAg (L) were determined by ELISA. The detection limit in
  L is indicated by a dashed line. E, F, K, and L represent the same batch of experiments.
  Data are shown as the mean ± SEM (A–D and G–J) or mean + SEM (E, F, K, and L) and
  are representative of at least 2 independent experiments. One-way ANOVA followed
  by Tukey’s test was applied in A–D and G–J. **P < 0.01; ****P < 0.0001. MΦ, macrophage;
  MFI, mean fluorescence intensity; NS, not significant; OD, optical density
article_title: Anti–PD-L1–IFN-α–adjuvanted HBsAg vaccine overcomes HBV immune tolerance
  through targeting both DCs and macrophages
