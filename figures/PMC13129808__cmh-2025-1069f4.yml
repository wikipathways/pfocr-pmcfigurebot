figure_title: Tumor cell clusters revealed by snRNA-seq.
caption: Tumor cell clusters revealed by snRNA-seq. (A) UMAP plot of single-nuclei
  transcriptomes of all samples, clustered to 9 main cell types (left). Origin of
  patient groups shown by colors (right). CAFs, cancer-associated fibroblasts. (B)
  UMAP plot of malignant single-nuclei transcriptomes, clustered to 7 subtypes (left).
  Origin of patient groups shown by colors (right). (C) Heatmap showing the differential
  expression of marker genes among malignant cell subtypes. (D) KEGG (Kyoto Encyclopedia
  of Genes and Genomes) analysis in each malignant subtype. GeneRatio, percentage
  of specific pathway genes presented in differentially expressed genes; P.adjust,
  adjusted P-value. (E) Proliferation and EMT scores among different malignant subtypes.
  CAF, cancer-associated fibroblast; EMT, epithelial-mesenchymal transition; snRNA-seq,
  single-nuclei RNA sequencing; UMAP, Uniform Manifold Approximation and Projection
