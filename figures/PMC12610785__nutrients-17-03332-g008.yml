caption: 'Regulatory effects of GFPs on gut microbiota (GM) –derived γ-aminobutyric
  acid (GABA) production. (A) Top enriched Kyoto Encyclopedia of Genes and Genomes
  (KEGG) pathways in the comparison of GFP vs. BLK groups (ranked by p-value). The
  top three KEGG metabolic pathways with the lowest p-values were highlighted with
  yellow rectangles. (B) Volcano plot of differential metabolites in the top three
  enriched KEGG pathways (p < 0.05, |log2FC| > 1). (C) Spearman correlation analysis
  between key bacterial genera, fermentation markers, and differential metabolites
  in the GFP and BLK groups. Red squares represent positive correlations, and blue
  squares represent negative correlations; * p < 0.05 indicates significant correlations.
  (D–G) OD600 values of Bacteroides thetaiotaomicron, Lactobacillus plantarum, Parabacteroides
  distasonis, and Akkermansia muciniphila during fermentation in GFP-supplemented
  medium. (H–K) pH changes of fermentation broths containing B. thetaiotaomicron,
  L. plantarum, P. distasonis, and A. muciniphila. (L) GABA concentration in fermentation
  broths of the four strains over time. (M) Multiple reaction monitoring (MRM) mass
  spectrometric signal profile of the GABA standard (transitions: m/z 104→69.2, m/z
  104→87.1). The letters a, b, c, d indicate significant differences, meaning values
  labeled with different letters are significantly distinct from each other (p < 0.05)'
