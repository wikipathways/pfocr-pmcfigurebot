figure_title: NanoString gene expression analysis for time point, diet, and supplement
  in mouse colon mucosa.
caption: NanoString gene expression analysis for time point, diet, and supplement
  in mouse colon mucosa. (a) Volcano plots depicting significant differentially expressed
  genes (DEGs) for each experimental factor with fold change > 1.5 and BH-adjusted
  q-value < 0.05. (b) Directed gene set significance scores for immune-related pathways
  included in the NanoString PanCancer Immune Profiling gene panel. (c) Pathway Z
  scores are shown as Tukey box plots (n = 3 to 6) for selected immune and cancer
  pathways. Figure S5 shows a heatmap for all individual samples for all pathways
  included in the gene panel. *, significantly different for CP vs. CON within the
  basal diet group as determined by general linear model regression with Tukey’s HSD
  post hoc test with FDR-adjusted p-value < 0.05. Full statistical results are available
  in File S1. (d) Log2 ratios for select genes of interest with respect to AIN/CON
  at the pre-DSS time point as the reference. Results of nSolver statistical analyses
  are provided in File S1
