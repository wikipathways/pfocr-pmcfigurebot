figure_title: Plant cell schematic and the primary PEV biogenesis pathway.
caption: 'Plant cell schematic and the primary PEV biogenesis pathway. (A) Plant cells
  are enclosed by a plasma membrane, and this is additionally surrounded by the primary
  cell wall. Other cell types or plant species also surround the plasma membraneof
  the plant cell with a secondary cell wall. Plant cells contain numerous large organelles,
  including the nucleus (which in turn harbours the nucleolus), smooth and rough endoplasmic
  reticulum, Golgi apparatus, and the central vacuole. Plant cells also harbour numerous
  other smaller-sized organelles such as chloroplasts, mitochondria, and peroxisomes,
  as well as an abundance of ribosomes in the cytoplasm. (B) MVB biogenesis pathway:
  (1) Likely identified by marker protein localisation (solid red, blue, and purple
  coloured triangles), endocytosis occurs at the plasma membrane to form an early
  endosome; (2) which via loading of specific cellular contents and molecular cargo
  transitions into a late endosome containing ILVs; (3) molecular cargo is exchanged
  bidirectionally between the late endosome and the Golgi apparatus to (4) result
  in MVB formation, and; (5) the marker proteins which identified the site of endocytosis
  may also direct MVB transport back to the plasma membrane for extracellular PEV
  release. The MVB biogenesis pathway likely forms the predominant pathway for the
  production of PEVs under normal growth conditions'
