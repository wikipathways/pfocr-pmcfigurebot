figure_title: Schematic positive feedback loop linking diffusion-limited nutrient
  supply to focal cartilage catabolism.
caption: Schematic positive feedback loop linking diffusion-limited nutrient supply
  to focal cartilage catabolism. Diffusion limitation in thick and poorly mixed cartilage
  regions initiates a cascade of metabolic and biophysical events. (Node 1) Diffusion-limited
  nutrient supply causes glycolytic collapse and ATP depletion, leading to mitochondrial
  ROS production and DAMP release. (Node 2) These mitochondrial signals activate NF-κB/MAPK
  and inflammasome pathways and upregulate proteolytic enzymes (MMPs, ADAMTS), while
  impairing TIMP-mediated inhibition. (Node 3) Protease activity, together with undersulfation,
  drives aggrecan loss, lowering fixed-charge density and glycosaminoglycan content.
  (Node 4) Reduced fixed-charge density decreases tissue hydration and interstitial
  fluid mobility. (Node 5) Decreased fluid mobility increases the relative load borne
  by the solid pericellular matrix, promoting microfissuring and the generation of
  matrix-derived fragments that further amplify DAMP/protease signaling. (Node 6)
  Concomitant osmotic and ionic shifts cause cell swelling, reduced intracellular
  macromolecular crowding, and increased ATP demand for ion homeostasis, feeding back
  into glycolytic failure (return to node 1). Potential therapeutic interventions
  include improving solute transport (mechanical mobilization or intra-articular convection
  strategies), restoring pericellular osmolarity (osmolytes or intermittent loading),
  supporting mitophagy/antioxidant defenses, and selective protease inhibition (MMP/ADAMTS)
