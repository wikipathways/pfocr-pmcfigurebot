caption: CMS attenuates oxidative stress-induced ADSCs apoptosis and activates antioxidant
  pathways. (A) Immunofluorescence of BAX (red), and Bcl-2 (red) (Scale bar = 125
  μm). (B) Western blot analysis apoptosis-related proteins, normalized to β-actin.
  (C) Western blot analysis Nrf2, HO-1, 4HNE and GPX4 expression, normalized to β-actin.
  (D) IF of lipid peroxidation marker 4-HNE (red) and glutathione peroxidase GPX4
  (red) (Scale bar = 125 μm). (E) Gray values (ImageJ) of BAX, Bcl-2, Nrf2, HO-1,
  4HNE and GPX4 (n = 9). (F) BAX, Bcl-2, Nrf2, HO-1, 4HNE and GPX4 mRNA expressions
  in different ADSCs cells detected by quantitative real-time PCR (n = 9). (G-H) Malondialdehyde
  and ferric reducing antioxidant power levels in different groups (n =10). (Data
  are presented as mean ± standard deviation)
