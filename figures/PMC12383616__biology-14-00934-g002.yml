figure_title: Visual pathway from retina to brain.
caption: 'Visual pathway from retina to brain. (a) Superior view of the visual circuit
  in the human brain. Signals from the nasal retina cross at the optic chiasm, while
  those from the temporal retina remain ipsilateral. These projections synapse at
  the lateral geniculate nucleus and then relay to the primary visual cortex. Additional
  projections reach the pretectal nucleus. (b) Lateral view of the visual circuit
  in the human brain. (c) Schematic zebrafish visual circuit: The optic tectum is
  the principal visual processing center in zebrafish, mediating sensorimotor information
  for visually guided behaviors. The pretectal nucleus, which receives input from
  the tectum, sends inhibitory projections to the nucleus isthmi, modulating visuomotor
  reflexes like the optokinetic response. The nucleus isthmi forms reciprocal connections
  with the optic tectum and contributes to visual attention and stimulus selection'
article_title: 'Eyes Wide Open: Assessing Early Visual Behavior in Zebrafish Larvae'
