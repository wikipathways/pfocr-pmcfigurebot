figure_title: The disulfidptosis pathway.
caption: 'The disulfidptosis pathway. (A) Under glucose-replete conditions, the PPP
  continuously produces NADPH, which provides the reducing power required for the
  conversion of SLC7A11-imported cystine into cysteine. This reduction process prevents
  aberrant disulfide bond accumulation in ACPs, thereby maintaining cytoskeletal stability
  and ensuring cell survival; (B) In contrast, glucose deprivation disrupts PPP activity
  and severely limits NADPH availability in SLC7A11-high cells. Sustained cystine
  import under these conditions leads to excessive intracellular accumulation of cystine
  and other disulfide-containing metabolites, which promote abnormal disulfide bond
  formation within ACPs. The resulting collapse of the actin network initiates disulfidptosis.
  Inhibition of TXNRD1, which mediates cystine reduction to cysteine or H2O2 treatment
  has also been shown to induce disulfidptosis in SLC7A11-high cells. Furthermore,
  the Rac1-WRC-Arp2/3 axis drives branched actin polymerization and lamellipodia formation,
  which are thought to provide a structural platform that facilitates disulfide bond
  formation in ACPs, thereby amplifying disulfidptosis. In the figure, disulfide bonds
  are illustrated as small red arcs. Created in BioRender. PPP: pentose phosphate
  pathway; NADPH: reduced nicotinamide adenine dinucleotide phosphate; SLC7A11: solute
  carrier family 7 member 1; ACPs: actin cytoskeleton proteins; TXNRD1: Thioredoxin
  reductase 1'
