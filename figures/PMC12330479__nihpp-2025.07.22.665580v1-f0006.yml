figure_title: Metabolite-Respiratory Quotient Correlations and Pathway Enrichment
  in WT-LD Flies
caption: (A) Heatmap depicting Spearman correlations (|ρ| > 0.7, p < 0.05) between
  respiratory quotient (RQ) and metabolite across the circadian cycle in wild-type
  flies maintained under light-dark (LD) conditions. Metabolites were clustered based
  on correlation patterns, highlighting groups with similar temporal associations
  with respiratory activity. (B) Pathway enrichment analysis of significantly correlated
  metabolites, illustrating metabolic pathways most closely linked to respiratory
  dynamics. Pathways with a p-value less than 0.05 were considered statistically significant
