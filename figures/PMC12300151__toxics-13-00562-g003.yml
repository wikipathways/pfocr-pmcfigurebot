figure_title: Transcriptomic profiling of PM2.
caption: 'Transcriptomic profiling of PM2.5-treated mice. Mice (n = 8) were administered
  25 μg of PM2.5 samples (n = 4) or physiological saline (n = 4) via oropharyngeal
  aspiration twice per week and were euthanized 24 weeks after the initial PM2.5 treatment.
  Total RNAs extracted from the mice’s buffy coats were subjected to RNA sequencing
  (RNA-Seq) analysis. (a) Principal component analysis (PCA) of the RNA-Seq data.
  C, PBS control; P, PM2.5-treated mice. (b) The heatmap represents the hierarchical
  clustering analysis. C, PBS control; P, PM2.5-treated mice. (c) The volcano plot
  represents the DEGs (differential expressed genes) of PM2.5-treated mice compared
  with the controls. Selected genes are indicated in the plot. (d) Gene set enrichment
  analysis (GSEA). GSEA using the collections from molecular signatures database (MSigDB):
  Hallmark, KEGG, and oncogenic signature are indicated. The enriched pathways are
  displayed in a bar plot. The normalized enrichment score (NES) is shown, where |NES|
  > 1 indicates that a pathway is enriched in the PM2.5-treated mice. p < 0.05 (*)'
