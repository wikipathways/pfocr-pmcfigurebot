figure_title: Chemical and genetic inhibition of the mevalonate pathway promotes STMN2
  expression
caption: |-
  (A) Simplified schematic illustrating key steps of the mevalonate pathway. (B-C) Luciferase assay (B) and immunoblot (C) to quantify STMN2 protein in WT SH-SY5Y cells co-treated with 1μM cerivastatin and either 30μM mevalonate or 10μM GGPP substrates. Points represent mean of technical replicates from independent experiments. One-way ANOVA with Dunnett’s multiple comparisons. Asterisks indicate comparison of each condition to DMSO control. (D) Immunofluorescence with STMN2 (red/black) and TUJ1 (green) antibodies of WT SH-SY5Y treated with statin and mevalonate/GGPP substrates. Scale bar = 25μm. (E) Newly synthesized isoform of pitavastatin (MGB06) bearing modified hydroxyl side-chain to inhibit engagement of the HMG-CoA reductase catalytic domain. (F) MGB06 Hydroxyl-modification prevents hydrogen bonding to the HMG-CoA reductase catalytic domain. Panels generated using Maestro software (Schrodinger). (G-H) MGB06 has no effect on STMN2 expression as measured by luciferase assay (G) or immunoblot (H). Points represent mean of technical replicates in three independent experiments. Two-way ANOVA with Tukey’s multiple comparisons. Asterisks represent comparisons to DMSO control. (I-K) Enzyme-linked immunosorbent assay for STMN2 (I) and RT-qPCR for STMN2
  (J) and HMGCR
  (K) in iPSC-derived hNIL motor neurons treated with cerivastatin and harvested at day 5 or day 9 post-doxycycline induction, normalized to mean of DMSO control values. Points represent replicates from three independent experiments. One-way ANOVA with Holm-Šídak multiple comparisons. Asterisks indicate comparison to DMSO. (L-M) Confocal image (L) and automated quantification of STMN2 immunostaining (M) in motor neurons differentiated from iPSC using a small molecules (SM)-based protocol and treated with cerivastatin. Points represent mean intensity across four independent wells. Unpaired t-test. (N) RT-qPCR for STMN2 in small-molecule differentiated motor neurons. One-way ANOVA with Holm-Šídak multiple comparisons. Asterisks indicate comparison to DMSO
