figure_title: Longitudinal gene set enrichment analysis (GSEA) of host cervical transcriptomes
  stratified by BV recurrence status
caption: Dot plots show significantly enriched host gene ontology (GO), pathway, and
  molecular function terms at (a) baseline, (b) 1-month post-treatment, and (c) 6-months
  post-treatment, based on differential expression between recurrent and nonrecurrent
  participants based on Amsel BV criteria. Enrichment was performed using gene ontology
  biological processes (GO:BP), molecular functions (GO:MF), KEGG pathways (KEGG),
  Reactome pathways (REAC), Human Phenotype (HP), and WikiPathways (WP), with results
  filtered at FDR < 0.05. Color indicates source ontology, and dot position reflects
  significance (–log10[FDR]). Key findings include baseline enrichment of immune-related
  pathways (e.g., NF-κB signaling, chemokine signaling) in participants who would
  later experience recurrence, strong EGFR signaling and transporter-related activity
  at 1-month, and limited but persistent signaling differences at 6 months
article_title: Host-microbe interactions characterized by gene expression of cervical
  adhesion molecules, cytokines, and growth factors define the recurrence of bacterial
  vaginosis
