figure_title: Characterization of spatial niches in JIA synovium
caption: (A) The central heatmap displays the percentage area of 30 spatial niches
  (columns) for each patient (rows). Patient samples are annotated by clinical features
  on the left. The bar plots above illustrate the proportional composition of cell
  clusters for each corresponding niche. Spatial niches are grouped by the major annotated
  niche clusters shown at the bottom. (B) UMAP embedding of niches based on their
  immune-stromal cell composition. Each dot represents a niche and is colored by an
  annotated niche cluster. (C) Heatmap showing normalized gene set enrichment scores
  for related pathways across the 4 annotated niche classes
article_title: Spatial transcriptomics reveals immune-stromal crosstalk within the
  synovium of patients with juvenile idiopathic arthritis
