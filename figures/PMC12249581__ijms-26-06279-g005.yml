figure_title: Schematic pathway of cuboidal parietal epithelial cell (PEC) formation
  caused by alcohol or ADH3 deficiency.
caption: Schematic pathway of cuboidal parietal epithelial cell (PEC) formation caused
  by alcohol or ADH3 deficiency. (a) Physiological testosterone metabolism pathway.
  ADH functions as an NAD-dependent oxidase, converting 19-hydroxytestosterone to
  19-oxotestosterone [15]. (b) During CAC, ethanol acts as a competitive substrate
  for ADH in testosterone metabolism, inhibiting the oxidation of 19-hydroxytestosterone.
  This suppression of testosterone metabolism leads to increased levels of 19-hydroxytestosterone
  and testosterone, which in turn promote the formation of cuboidal PECs. (c) In the
  absence of ADH3, testosterone metabolism is impaired, resulting in the accumulation
  of 19-hydroxytestosterone and testosterone, which also contributes to the formation
  of cuboidal PECs
