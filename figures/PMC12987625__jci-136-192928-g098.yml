figure_title: PIM2 negatively regulates VPRBP/EZH2 activity
caption: (A–C) Splenocytes from WT or Pim2-KO Pmel mice were activated with 500 ng/mL
  gp100 peptide for 3 days and subjected to tandem mass tag–based phosphoproteomics
  analysis with WT n = 5 and KO n = 5. (A) Differential expression analysis for each
  phosphosite between WT and KO was conducted, and differentially expressed phosphoproteins
  reported to regulate T cell response are displayed. (B) A pathway analysis was performed
  in the differentially phosphorylated proteins. The average abundance of the phosphorylated
  proteins is shown in each pathway. (C) All differentially expressed phosphoproteins
  are shown in a volcano plot. (D) WT or Pim2-KO CD8 T cells were stimulated with
  anti-CD3/CD28 for 24 hours. Anti-PIM2 mAb or control IgG was used to pull down PIM2,
  followed by Western blot detection of EZH2 and VPRBP. The target bands are marked
  with asterisks. (E) Western blot detection of VPRBP was performed in activated WT
  or Pim2-KO Pmel cells at 3 days after gp100 stimulation. (F) EZH2 and H3K27Me3 were
  detected in CD8 T cells after anti-CD3/CD28 stimulation. (G) Pmel splenocytes were
  activated with gp100 peptide plus 5 ng/mL IL-15 with or without 5 μM GSK126 for
  5 days. Frequencies of IL-2+, IFN-γ+, and CD44+CD62L+ (Tcm) are shown. Data represent
  2 independent experiments (D–G). Data were analyzed unpaired 2-tailed Student’s
  t test (A and G). Data are shown as mean ± SEM. *P < 0.05
article_title: Targeting PIM2 improves antitumor immunity through promoting effector
