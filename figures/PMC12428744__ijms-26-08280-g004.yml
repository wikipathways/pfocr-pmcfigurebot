figure_title: Lotus alkaloids exert neuroprotection by regulating oxidation and mitochondrial
  function.
caption: Lotus alkaloids exert neuroprotection by regulating oxidation and mitochondrial
  function. Nuciferine, neferine, and liensinine exert antioxidant effects by activating
  the AMP-activated protein kinase/Sirtuin 1 (AMPK/SIRT1) signaling pathway, which
  promotes the removal of Keap1/p62 and further nuclear translocation of nuclear factor
  erythroid-related factor 2 (Nrf2), thereby activating mitochondrial biogenesis.
  Simultaneously, this activation enhances the transcriptional upregulation of antioxidant
  enzymes, including heme oxygenase-1 (HO-1), catalase (CAT), superoxide dismutase
  (SOD), and glutathione peroxidase (GSH-Px), ultimately leading to a reduction in
  intracellular reactive oxygen species (ROS) levels
