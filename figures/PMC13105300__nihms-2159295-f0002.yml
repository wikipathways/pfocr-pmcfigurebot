figure_title: Metabolite profile differences between ADAM9-sufficient and ADAM9-deficient
  Th17 cells.
caption: Metabolite profile differences between ADAM9-sufficient and ADAM9-deficient
  Th17 cells. (A) Representative results of Seahorse glycolysis stress test. CD62L+CD4+
  T cells were isolated from the spleen of Adam9+/+ or Adam9−/− mice and differentiated
  to Th17 cells. Assay was conducted at 24, 48, and 72 hours after the initiation
  of differentiation. (B) Cumulative results of the glycolysis (left) and glycolytic
  capacity (right; mean ± SEM; n = 4–7). (C) Multivariate partial least squares discriminant
  analysis score plot for comparison of the global metabolite profiles of Adam9-sufficient
  and Adam9-deficient Th17 cells. (D) Clustering analysis of differentially expressed
  metabolites in Th17 cells under ADAM9 deficiency (Adam9+/+ n = 3; Adam9−/− n = 3).
  (E) Pathway enrichment analysis of the metabolites that changed significantly in
  Adam9−/− Th17 cells. (F) Intracellular levels of metabolites implicated in glycolysis
  from Adam9-sufficient and Adam9-deficient Th17 cells (n = 3 independent experiments).
  *P < 0.05. ECAR, extracellular acidification rate; TCAcycle, tricarboxylic acid
  cycle
