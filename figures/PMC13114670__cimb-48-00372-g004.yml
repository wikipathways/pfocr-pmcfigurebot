figure_title: JAK2–STAT3 signaling pathway involvement in the hepatoprotective effects
  of LH against ethanol-induced liver injury.
caption: JAK2–STAT3 signaling pathway involvement in the hepatoprotective effects
  of LH against ethanol-induced liver injury. Representative Western blot images showing
  total JAK2, total STAT3, phosphorylated JAK2 (p-JAK2), and phosphorylated STAT3
  (p-STAT3) in cells. Densitometric analysis of the p-JAK2/JAK2 and p-STAT3/STAT3
  ratios is presented. Data are expressed as mean ± SEM from three independent biological
  replicates (n= 3). ns denotes no significant difference, and * denotes significant
  differences at p < 0.05
