figure_title: The regulatory network of apoptosis in vascular calcification (VC).
caption: 'The regulatory network of apoptosis in vascular calcification (VC). Apoptosis
  is initiated through three major signaling cascades: extrinsic, intrinsic, and endoplasmic
  reticulum (ER) stress pathways. These pathways converge on effector caspases and
  the formation of apoptotic bodies. Apoptosis contributes to VC through two primary
  mechanisms: (i) Direct calcification: Apoptotic bodies serve as nucleation sites
  for calcium and phosphate crystal deposition. (ii) Osteogenic differentiation: Key
  apoptotic mediators, particularly C/EBP-homologous protein (CHOP) downstream of
  ER stress, directly transactivate osteogenic genes (Runx2, BMP2), promoting vascular
  smooth muscle cells (VSMCs) transdifferentiation into an osteoblast-like phenotype.
  Additionally, the Gas6/Axl pathway mediates apoptotic cells to become foci for calcium
  phosphate crystal deposition'
