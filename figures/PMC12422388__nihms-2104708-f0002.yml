figure_title: ATP binding to ATP hydrolysis-deficient TAP(EQ) adopts the outward-facing
  state
caption: '(A) NBD dimerization stabilizes the outward-facing state.(B) Molecular model
  of TAP(EQ) in the NBD-dimerized outward-facing ATP-bound state. TAP1 and TAP2 are
  shown as ribbons and colored in sky blue and gold, respectively. ATP is shown as
  spheres. The boundaries of the membrane are shown as silver lines.(C) Molecular
  surface models of TAP(EQ) in the NBD-dimerized outward-facing ATP-bound state. The
  closed cytosolic and open ER luminal gates are boxed.(D) The translocation pathway
  is open to the ER lumen.(E and F) TAP2 TM3 is flexible and adopts two conformations
  in the outward-facing state: an outward-facing open (E) and kinked (F) state. The
  molecular models of TAP1 and TM3 are represented as cartoons with the side chains
  represented as sticks. Cryo-EM densities corresponding to TAP1 and TAP2 TM3 are
  colored in transparent sky blue and gold, respectively, and contoured to 0.12 and
  0.196 SDs, respectively. The N- and C-pockets of the peptide-binding sites are labeled.See
  also Figures S2–S4'
