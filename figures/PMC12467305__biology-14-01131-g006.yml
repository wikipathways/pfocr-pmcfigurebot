caption: Transcriptome data of oat seedlings with different selenium treatments. (A)
  Principal component analysis of DEGs. (B) DEGs correlation heat map. (C) The numbers
  of upward and downward DEGs. (D) Venn diagram of DEGs. The overlap represents the
  proportion of genes shared with groups, while the non-overlap represents the proportion
  of genes that are unique to the group. (E) Heat map of DEGs associated with phenylpropanoid
  biosynthesis pathway. (F) Heat map of DEGs associated with flavonoid biosynthesis
  pathways. The color indicates the level of accumulation of each transcript, ranging
  from low (green) to high (red)
