figure_title: Spatial niches and associated pathway activities
caption: '(A–D) Representative images of association between niche clusters and ANGIOGENESIS
  pathway. Spatial mapping of annotated niches (A) from a representative synovial
  tissue section and H&E staining (B). (C) Spatial distribution of cell clusters in
  the zoom-in of the section in A. (D) Left, spatial enrichment score of the ANGIOGENESIS
  pathway. Right, Corresponding DAPI and expression of representative genes of the
  pathway. (E–H) Representative images of association between niche clusters and IFN-γ
  response pathway. Spatial mapping of annotated niches (E) from a representative
  synovial tissue section and H&E staining (F). (G) Spatial distribution of cell clusters
  in the zoom-in of the section in E. (H) Left, spatial enrichment score of the IFN-γ
  response pathway. Right, Corresponding DAPI and expression of representative genes
  of the pathway. Scale bars: 1 mm (A and E)'
