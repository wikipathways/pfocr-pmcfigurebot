figure_title: Dose dependent activation of the NLRP3 inflammasome pathway after ethanol
  exposure
caption: (A) RT–qPCR analysis of NLRP3 RNA expression from Day 7 IEE triculture; n
  = 5 triculture batches/independent experiments; one-way ANOVA [F(3,16) = 12.64,
  P = 0.0002, R2 = 0.7032]; Post hoc Dunnett’s multiple comparisons test (20 mM vs.
  0 mM, p = 0.0054), ( 40 mM vs. 0 mM, p = 0.0002), (75 mM vs. 0 mM, p = 0.0002);
  data are presented as mean ± SEM. (B) Representative immunofluorescence images of
  NLRP3 protein expression in a 7-day IEE triculture. (C) Immunofluorescence quantification
  of NLRP3 integrated density normalized to each control (0 mM) replicate; n = 3 triculture
  batches/independent experiments; Kruskal-Wallis Test [H(3) = 7.31, P = 0.036]; Post
  hoc Dunn’s multiple comparison test (20 mM vs. 0 mM, p=0.2616),( 40 mM vs. 0 mM,
  p = 0.2043), (75 mM vs. 0 mM, p = 0.0262); data are presented as mean ± SEM. (D)
  RT–qPCR analysis of IL1ß RNA expression from Day 7 IEE triculture; n = 5 independent
  experiments; one-way ANOVA [F(3,16) = 5.064, P = 0.0118, R2 = 0.487]; Post hoc Dunnett’s
  multiple comparisons test (20 mM vs. 0 mM, p = 0.5403), (40 mM vs. 0 mM, p = 0.0446),
  (75 mM vs. 0 mM, p = 0.0066); data are presented as mean ± SEM. (E) Representative
  confocal immunofluorescence images of IL1β and CASP1 protein expression from a Day
  7 IEE triculture in 0 mM and 75 mM conditions. *p < 0.05, **p < 0.01, ***p <0.001,
  ****p < 0.0001
