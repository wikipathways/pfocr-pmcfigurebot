caption: Functional enrichment analysis of 3661 dysregulated proteins using g:Profiler.
  Bubble plots show combined GO enrichment across biological processes, molecular
  functions, and cellular components. Bubble size represents the number of proteins
  per term, while color intensity reflects the significance level as −log10(p-value).
  This visualization highlights key pathways, functions, and cellular locations associated
  with the dysregulated proteins. The x-axis indicates the number of dysregulated
  proteins associated with each GO term (i.e., term count)
