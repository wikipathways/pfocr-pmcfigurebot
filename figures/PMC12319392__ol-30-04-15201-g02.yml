figure_title: mTOR enhances glucose uptake and glycolysis in CD4+ T cells by increasing
  GLUT1 expression and regulating the IRS1/PI3K/AKT pathway.
caption: mTOR enhances glucose uptake and glycolysis in CD4+ T cells by increasing
  GLUT1 expression and regulating the IRS1/PI3K/AKT pathway. This promotes glycogen
  synthesis, T cell proliferation and activation, favoring Th1/Th17 differentiation
  whilst reducing Treg generation. Inhibition of mTOR impairs glycolysis and CD4+
  T cell activation. GLUT1, glucose transporter 1; IRS1, insulin receptor substrate
  1; Treg, regulatory T cell; AMPK, AMP-activated protein kinase; Th, Helper T cell
