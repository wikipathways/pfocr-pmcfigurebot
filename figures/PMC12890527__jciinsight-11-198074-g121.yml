figure_title: Spatial neighborhood enrichment analysis framework characterizes niche
  of sublining fibroblasts and endothelial cells in JIA synovium
caption: '(A) Spatial neighborhood enrichment using our data from samples of JIA synovium.
  Statistical significance is indicated as *Padj < 0.1 and **Padj < 0.05. The highlighted
  gray square indicates the niche of sublining fibroblasts and endothelial cells.
  P values were adjusted by the Benjamini-Hochberg method. (B) Characterization of
  the identified niche of sublining fibroblasts and endothelial cells. The heatmap
  displays the relationship between distances to nearest endothelial cells (purple
  bar above) and fibroblast gene expression. Rows represent fibroblast-associated
  genes, and columns represent individual cells. Fibroblast marker genes are labeled.
  (C) Line plots depicting binned distance to nearest endothelial cells (x axis) and
  normalized gene expression (y axis) of representative fibroblast genes. Statistical
  significance was assessed using Spearman correlation coefficients and P values.
  (D) Heatmap of gene expressions related to NOTCH signaling pathway components across
  different cell types. (E) Representative spatial coordinates of an identified niche
  of sublining fibroblasts and endothelial cells, matching pathological images. Cells
  are colored according to their cluster assignments. (F) Spatial expression patterns
  of fibroblast-related and NOTCH signaling-related genes within the identified niche
  location. Scale bar: 100 μm'
