figure_title: Schematic showing synergistic effects of PI3K and HSP90 inhibitors
caption: Activation of PI3K-AKT-mTOR pathway causes cell proliferation and epithelial-to-mesenchymal
  transition (EMT) phenotype in adrenocortical carcinoma (ACC) cells (left panel).
  The BGGT226/PIK75 targets the p110 of the alpha-subunit of PI3K molecule, whereas
  the STA9090 targets heat shock protein 90 (HSP90), synergistically inhibiting the
  phosphorylation of downstream molecules of PI3K pathway, suppressing the tumorigenic
  processes (cell proliferation and epithelial-to-mesenchymal phenotype) and simultaneously
  inducing apoptosis/ autophagy in ACC (right panel)
article_title: Synergistic Inhibition of PI3K and HSP90 Enhanced Antitumorigenic Efficacy
  in Adrenocortical Carcinoma
