figure_title: P2Y2R regulates autophagy via PI3K-Akt-mTOR signaling pathway.
caption: P2Y2R regulates autophagy via PI3K-Akt-mTOR signaling pathway. (A) Analysis
  of PI3K-Akt-mTOR expression in NSC34 cells following treatment with a P2Y2R agonist
  and antagonist was conducted using Western blotting techniques. (B) Bar graphs depict
  the quantification of Western blot bands concerning GAPDH expression, *p < 0.05;
  (C) Analysis via Western blot was conducted to assess the expression levels of LC3
  and p62 in NSC34 cells post-treatment with a P2Y2R agonist and antagonist.; (D)
  Bar graphs illustrate the measurements of Western blot bands about GAPDH expression;
  *p < 0.05; (E) confocal microscopy was employed to visualize GFP-LC3 and mCherry-LC3
  puncta, scale bar = 5 μm
