figure_title: Effect of the Fgfr1 N330I variant on FGF23 synthesis
caption: (A)Fgfr1+/N330I mice show markedly elevated intact FGF23 levels (9211 ± 2625
  pg/mL; n = 5), when compared to WT littermates (522.1 ± 50.2 pg/mL; n = 14; p<0.0001)
  and consequently reduced circulating phosphate levels (10.1 vs. 13.6 mg/dL, p =
  0.0115; n = 19 WT and 6 mutant mice). Horizontal and vertical lines represent the
  mean ± SD. (B) Transcriptomics in bone (n = 5) revealed enrichment of the FGFR binding
  pathway (FDR adjusted p-value = 0.036), with Fgf23 having the highest rank metric
  score for the genes driving enrichment within this pathway. (C) Representative images
  of mouse femur sections processed for RNAscope in situ hybridization. Fgf23 mRNA
  probe shows red staining while nuclear staining is blue. The top panels demonstrate
  femur at 20× magnification (scale bar = 200 µm), while the middle panels represent
  zoomed-in view of cortical bone (scale bar = 50 µm) demonstrating increased Fgf23
  staining in mutant femurs. Bottom panels represent zoomed in view of the marrow
  region (scale bar = 50 µm) showing Fgf23 staining in peri-sinusoidal cells. Dot
  plot represents the density of positively stained nuclei with Fgf23 probe with respect
  to the area of cortical bone. The mean number of cells staining for Fgf23 in the
  mutant bone was 161, significantly higher in comparison to that of the WT mice (22,
  p = 0.0027). Horizontal and vertical lines indicate the mean ± SD from 2 WT and
  2 mutant mice. (D) FGF23 protein levels were also increased in femurs of mutant
  mice as shown by immunohistochemical staining. Original magnification = 40×; scale
  bar = 100 µm. (E) Quantification of FGF23 abundance in the femurs of WT and mutant
  mice, highlighting not only a higher percentage of FGF23-positive cells but also
  stronger intensity indicating increased per-cell production (H-score) in the mutant
  mice as compared to WT controls (3 mice/group). Horizontal and vertical lines represent
  the mean ± SD of 3 mice/group
