figure_title: mos−/− eggs express genes associated with RNA metabolism, transcription,
  and cell cycle regulation
caption: '(A) Volcano plot showing differentially expressed genes between mos−/− and
  wildtype eggs. Genes significantly upregulated in mos−/− eggs appear on the right,
  downregulated on the left, and non-significant changes are centered. All mos−/−
  eggs (M1, M2, M3) are represented in this dataset. (B) Bar plot depicting pathway
  enrichment analysis for genes upregulated in mos−/− eggs compared to wildtype eggs.
  Each bar represents a specific biological pathway, with the length indicating the
  degree of enrichment significance. (C-F) Violin plots representing upregulated genes
  in mos−/− eggs when compared to wildtype eggs. Each point is an individual egg/
  parthenote. The genes were classified into categories: those normally induced during
  early embryogenesis (C); maternal RNAs typically degraded in the egg (D); genes
  whose transcript levels remain consistent throughout metaphase II and early embryogenesis
  (E); and interesting genes involved in cell cycle regulation. WT, wildtype'
