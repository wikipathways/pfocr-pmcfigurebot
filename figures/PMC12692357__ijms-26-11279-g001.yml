figure_title: Proposed mechanistic pathway linking chronic inflammation, IL-6/CRP
  signaling, the stress response, and pain perception with neuropsychiatric and prognostic
  outcomes.
caption: 'Proposed mechanistic pathway linking chronic inflammation, IL-6/CRP signaling,
  the stress response, and pain perception with neuropsychiatric and prognostic outcomes.
  Legend: This flowchart illustrates the signaling associations and hierarchies among
  chronic inflammation, immune signaling intermediates, neuroendocrine stress responses,
  and pain sensitivity. Chronic peripheral inflammation, initiated by systemic disease,
  tissue injury, or immune dysregulation, leads to the upregulation of proinflammatory
  cytokines, specifically interleukin-6 (IL-6). IL-6 plays a central role in activating
  the hepatic acute-phase response, resulting in the synthesis and release of C-reactive
  protein (CRP) by hepatocytes. Elevated CRP levels not only serve as a systemic marker
  of inflammation but also may contribute to immune cell recruitment and further cytokine
  activation. Simultaneously, chronic inflammation and immune activation stimulate
  the hypothalamic–pituitary–adrenal (HPA) axis, triggering the stress response. This
  leads to increased secretion of cortisol, a glucocorticoid hormone that modulates
  both immune and central nervous system functions. Although cortisol has anti-inflammatory
  properties, prolonged or dysregulated HPA activation may result in glucocorticoid
  resistance, thereby exacerbating inflammation and impairing its ability to suppress
  excessive oxidative stress and impair feedback control. IL-6, CRP, and cortisol
  collectively influence central pain processing pathways, enhancing pain sensitivity
  through oxidative stress and subsequent feedback of NF-κB to generate a stronger
  immune and proinflammatory environment'
