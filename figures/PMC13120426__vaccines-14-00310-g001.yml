figure_title: BCV Suppresses Tumor Growth and Ameliorates the Tumor Immune Microenvironment
  in Mice.
caption: BCV Suppresses Tumor Growth and Ameliorates the Tumor Immune Microenvironment
  in Mice. (A) Schematic of the treatment protocol. Lewis lung cancer (LLC) cells
  (1 × 106 cells/200 μL) were subcutaneously (s.c.) injected into C57BL/6 mice. Four
  days later, mice were administered 200 μL of PBS or BCV twice weekly for 2 weeks.
  Mice receiving PBS were designated as the negative control (NC) group, while those
  receiving BCV were designated as the BCV group. (B) Representative macrographs of
  tumors from mice with or without BCV treatment. (C) Tumor growth curves of mice
  treated with or without BCV (n = 6 per group). (D) Representative macrographs of
  spleens from mice with or without BCV treatment. (E) Analysis of the spleen weight-to-body
  weight ratio (n = 6 per group). (F) Quantification of CD3+CD4+ T cells, CD3+CD8+
  T cells, and CD3−CD19+ B cells in tumors from BCV-treated (n = 6) and untreated
  (n = 6) mice. (G) Quantification of the expression of the indicated molecules in
  CD4+ and CD8+ T cells. (H) KEGG pathway enrichment analysis of differentially enriched
  genes in tumors from BCV-treated (n = 3) and untreated (n = 3) mice. Unpaired t-test.
  * p < 0.05, ** p < 0.01, *** p < 0.001
