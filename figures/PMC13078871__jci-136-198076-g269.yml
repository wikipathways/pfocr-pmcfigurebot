figure_title: Time-series transcriptome analysis reveals that Gsdme deficiency enhances
  intramuscular adipogenesis
caption: (A) Experimental design for time-series RNA-seq analyses of injured skeletal
  muscle tissue from WT and GSDME-KO mice with CTX-induced muscle injury at 3 postinjury
  time points (n = 3 per group at each time point). (B) Principal component analysis
  of transcriptome profiles in injured muscle of WT and KO mice. (C) Differentially
  expressed genes (DEGs) between injured muscle tissues of WT and KO mice at each
  time point. Cyan, adjusted P < 0.05; red, adjusted P < 0.01. (D) Time-series clustering
  analysis of transcriptomes using the Mfuzz algorithm in R. Cluster 6 gene signature
  (pink boxes) represents the most significant difference between WT and KO mice.
  (E) GO enrichment analysis demonstrating enriched signaling pathways in cluster
  6 gene signatures of WT and KO mice
article_title: GSDME–IL-18 pyroptotic axis prevents myosteatosis by expanding tissue-resident
  macrophages to promote muscle regeneration
