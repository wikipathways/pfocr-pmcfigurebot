figure_title: Overall survival according to MAPK pathway alteration status across
  age- and gemcitabine-stratified PDAC subgroups.
caption: 'Overall survival according to MAPK pathway alteration status across age-
  and gemcitabine-stratified PDAC subgroups. Kaplan–Meier survival curves illustrate
  overall survival differences between patients with tumors harboring MAPK pathway
  alterations and those without detectable MAPK alterations, stratified by age at
  diagnosis and gemcitabine exposure. Panels include: (a) early-onset PDAC (<50 years)
  treated with gemcitabine; (b) early-onset PDAC not treated with gemcitabine; (c)
  late-onset PDAC (≥50 years) treated with gemcitabine; and (d) late-onset PDAC not
  treated with gemcitabine. Within each subgroup, survival distributions for MAPK-altered
  versus MAPK-wild-type tumors are compared. Shaded areas represent 95% confidence
  intervals, and accompanying risk tables display the number of patients at risk over
  time, facilitating interpretation of temporal survival patterns within each clinically
  defined stratum'
