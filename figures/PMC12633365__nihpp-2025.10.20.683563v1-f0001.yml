figure_title: ISO/OP drives acute alterations to transcriptomic profile of cardiac
  tissue in young adult mice at 24h after isoflurane (ISO) exposure
caption: '(A) PLS-DA plot for all normalized transcriptome genes is depicted for young
  adult 3-month-old (3m) mice with or without ISO exposure following laparotomy. (B)
  Volcano plot displaying differentially expressed genes (DEGs) in the 3m ISO/OP vs.
  3m Sham comparison. (C-D) Pathway enrichment analysis of upregulated DEGs with Gene
  Ontology molecular processes (C) and KEGG pathways (D). (E-F) Pathway enrichment
  analysis of downregulated DEGs with Gene Ontology molecular processes (E) and KEGG
  pathways (F). Z-score normalization was applied to gene expression values. Heatmaps
  illustrate sample-wise variation (columns) across genes (rows). Color intensity
  reflects relative transcript abundance across samples: warmer colors for higher,
  cooler for lower. (G-J) Heatmap and bar graph of genes involved in the top three
  enriched pathways. n = 5 mice/group'
