figure_title: Mechanistic model of signaling pathways in odontogenesis.
caption: Mechanistic model of signaling pathways in odontogenesis. The figure displays
  the coordinated interaction of key signaling pathways—WNT, BMP/TGF-β, SHH, mTOR,
  and EDA/EDAR/NF-κB—across the stages of tooth development (initiation, morphogenesis,
  root formation, and eruption). Canonical WNT signaling via WNT10A, LRP6, MSX1, and
  PAX9 defines the odontogenic field and induces BMP/TGF-β activity. SHH signaling
  drives placode stabilization and cusp patterning, while mTORC1 regulates enamel
  organ growth, adhesion, and cytoskeletal organization. The EDA/EDAR/NF-κB pathway
  ensures epithelial integrity, governs enamel and crown morphogenesis, and contributes
  to root bifurcation through activity in Hertwig’s epithelial root sheath (HERS).
  The lower panel depicts the corresponding morphological progression—from epithelial
  thickening to bud, cap, and bell stages—culminating in enamel, dentin, and pulp
  formation. Collectively, these pathways act as an integrated network controlling
  tooth number, morphology, and integrity, whose disruption results in tooth agenesis
