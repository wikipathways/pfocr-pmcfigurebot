figure_title: Induction of autophagy by STA9090 and BGT226
caption: 'A. Principal component analysis (PCA) plot showing treatment groups distinctly
  segregated due to difference in their biology in NCI-H295R cells. B. Venn diagram
  comparing the number of genes expressed and overlapped in the comparison groups
  (C; Control, S; STA9090, P; PIK75, B; BGT226, SP; STA9090 and PIK75, SB; STA9090
  and BGT226). Pathway analysis showing contrast in the regulation in the top canonical
  pathways in treatment groups C. STA9090 + PIK75 and D. STA9090 + BGT226. Each horizontal
  bar represents a cellular pathway, y axis: log 10 P value, x-axis: z-score, orange
  color for upregulation and blue color for downregulation. E. Western blots validating
  the protein level expression of autophagy markers in the treatment groups F. Autophagy
  flux analysis showing accumulation of autophagosomes consisting of LC3-GFP in the
  ACC cells after the treatment of drugs (STA9090 with PIK75/BGT226). Magnification;
  20X, Green; GFP, Blue; DAPI nuclear stain'
