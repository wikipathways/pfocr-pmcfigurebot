figure_title: Association analysis of the TGF-β signaling pathway.
caption: 'Association analysis of the TGF-β signaling pathway. The levels of pSmad2,
  pSmad3, pERK, and pAkt were significantly increased in TGF-β1-treated HTF cells
  (all p < 0.05; n = 3) (A). Tacrolimus treatment inhibited the pSmad2 and pSmad3
  elevation (all p < 0.05; n = 3) (B), but it did not inhibit the pERK and pAkt increase
  at 18 h and 24 h (C). *: significant difference in pSmad2 between the proliferated
  group and tacrolimus-treated proliferated group. †: significant difference in pSmad3
  between the proliferated group and tacrolimus-treated proliferated group'
