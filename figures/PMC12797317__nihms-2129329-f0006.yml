figure_title: IPA analysis summary.
caption: 'IPA analysis summary. To investigate the possible interactions of differentially
  regulated genes, the IPA tool was applied to the RNA-sequencing data from kidney
  samples, and the following data are illustrated: (A) The list of top 20 rated networks
  from IPA analysis. Blue bars in the bar chart indicate predicted pathway inhibition.
  Gray bars indicate pathways for which no activity prediction can currently be made.
  White bars represent pathways with fewer than 4 analysis-ready molecules, resulting
  in a z-score of NaN. (B) Key regulators are modified by PA treatment. (C) BCR pathway
  list in IPA analysis. Transcription data were analyzed by IPA and plotted with P
  < 0.05, Log2FoldChange >1, or Log2FoldChange <–1 cutoff. BCR, B cell receptor; IPA,
  ingenuity pathways analysis; PA, propionate; RNA, ribonucleic acid; SOCS1, suppressor
  of cytokine signaling 1; A2M, Alpha-2-macroglobulin; BMP, bone morphogenetic protein;
  CD200R1, CD200 Receptor 1; FOS, Fos proto-oncogene; FPR1, Formyl Peptide Receptor
  1; IFI16, Interferon-inducible protein 16; MARCO, Interferon-inducible protein 16;
  MMP12, Matrix Metallopeptidase 12; NaN; NPY, Neuropeptide Y; SELE, Selectin E; STAT3,
  Signal Transducer and Activator of Transcription 3'
