figure_title: S1P activates WNK kinases, which function together with myosin to promote
  migration
caption: (A) T cells do not require myosin contractility to migrate toward S1P in
  transwell assays. T cells were pre-treated with the myosin pathway inhibitors Y-27632,
  ML-7, or blebbistatin, or with control media. Migration toward the indicated doses
  of S1P was measured using transwell assays, in the continued presence of inhibitor.
  n=4 independent experiments. (B) S1P activates WNK1-dependent phosphorylation of
  ion channel kinases. T cells were incubated for 1.5hrs with the WNK-1 inhibitor
  WNK463 (5μM) or with control media prior to stimulation with 100nM S1P. Lysates
  were immunoblotted for phospho-SPAK / phospho-OXSR1 and GAPDH. Left, one representative
  Western Blot. Right, quantification from independent experiments (n=3). Fold comparisons
  were drawn to the unstimulated control (dotted line). (C) T cell migratory responses
  after inhibition of WNK1 and myosin signaling. T cells were left untreated, or pre-treated
  with 0.2 or 5μM WNK463, 25μM Y-27632, or 0.2μM WNK463 together with 25μM Y-27632.
  Chemotaxis toward 10nM S1P was tested using transwell assays, in the continued presence
  of inhibitor(s). n=4 independent experiments. (D-F) Video analysis of T cell protrusions
  after inhibition of WNK1 and myosin signaling. T cells were pretreated as in panel
  C, and adhered to VCAM-1 coated coverslips. Cells were imaged using DIC optics before
  and after the addition of 100nM S1P or control media. Video sequences from independent
  experiments were manually analyzed for the frequency of ruffles (D) and blebs (E)
  after stimulus addition as described in Materials and Methods. n=3 independent experiments.
  (F) Timelapse sequences from representative T cell motility videos. Time is in seconds
  relative to the point of stimulation. Arrows indicate protrusions classified as
  ruffles; asterisks indicate protrusions classified as blebs. Bars = 5μm. Data from
  all panels represent means +/− StDev from multiple experiments. Statistical analysis
  for panels A-C was performed using an unpaired Student’s T test, relative to the
  untreated (A,B) or unstimulated (C) controls. Statistical analysis for panels D-E
  was performed using a one-way ANOVA, relative to the media control, with Dunnett’s
  multiple comparison’s test used to derive p values. *, p<0.05; ****, p<0.001
article_title: S1P induces bleb-based T cell motility via S1PR1-dependent activation
  of RhoA and WNK1
