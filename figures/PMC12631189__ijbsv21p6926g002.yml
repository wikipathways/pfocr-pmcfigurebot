figure_title: Metabolic reprogramming of renal cell carcinoma.
caption: Metabolic reprogramming of renal cell carcinoma. The hypoxic tumor microenvironment
  and mTOR signaling upregulate the HIF pathway, promoting lipid deposition and tumor
  progression through the PHF8-GLUL axis. 2. Promote tumor angiogenesis and metastasis
  by promoting the expression of VEGFA, PDGFB, and other proteins. 3. Generate lactic
  acid through the Warburg effect and inhibit pH-dependent iron death through lactate
  dehydrogenase (LDH)
