figure_title: Hallmarks of lung cancer
caption: The hallmarks depicted illustrate how diverse molecular, cellular, and microenvironmental
  changes underlie sensitivity and resistance to therapies, emphasizing the critical
  importance of molecular profiling in lung cancer, as well as current and future
  therapeutic approaches. Tumorigenic processes evolve dynamically across disease
  stages, from early lesions shaped by environmental injury and inflammation to invasive
  and metastatic disease sustained by profound genomic, metabolic, and microenvironmental
  reprogramming. The inner circle depicts key mechanisms underlying tumor sensitivity
  and resistance, including cell-intrinsic changes such as oncogenic pathway activation
  (e.g., EGFR and KRAS mutations, and ALK translocations), loss of tumor-suppressor
  function (e.g., TP53 inactivation), and immune escape, as well as changes in the
  microbiome, immune environment, tumor microenvironment (TME), and the presence of
  metastatic disease. The outer circle illustrates current and emerging therapeutic
  approaches for lung cancer, including chemotherapy, radiation, targeted therapies
  (e.g., EGFR, KRAS, and ALK inhibitors), and immunotherapy (e.g., PD-1/PD-L1 inhibitors),
  as well as ADCs, T-cell engagers (TCE), metabolic inhibitors, and novel targets.
  (Adapted with permission from the figure originally published in ref. (158))
