figure_title: The mechanism of action and intervention targets of the “gut microbiota-immune-metabolic-muscle”
  axis in cancer cachexia.
caption: The mechanism of action and intervention targets of the “gut microbiota-immune-metabolic-muscle”
  axis in cancer cachexia. Specifically, factors like cancer induce intestinal mucosal
  injury, elevated intestinal permeability, and gut dysbiosis (characterized by a
  decrease in beneficial bacteria and overproliferation of harmful bacteria such as
  Enterococcus). Harmful bacteria or translocated lipopolysaccharide (LPS) activate
  Toll-like receptors (TLRs) and NF-κB pathway, which induces the release of inflammatory
  cytokines and activates muscle protein degradation pathways (UPS and ALP). This
  upregulates Atrogin-1 and MuRF-1 to trigger muscle atrophy. Meanwhile, intestinal
  dysfunction exacerbates malnutrition and metabolic abnormalities, thereby promoting
  the progression of cachexia. In contrast, beneficial bacteria including Bifidobacterium
  and Akkermansia muciniphila, as well as herbal components such as astragalus polysaccharide
  and berberine, can interrupt the vicious cycle of cachexia by modulating the gut
  microbiota, repairing the mucosal barrier, and inhibiting inflammatory and muscle
  degradation pathways
