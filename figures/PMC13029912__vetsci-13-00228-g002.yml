figure_title: Overview of the herpesvirus life cycle.
caption: Overview of the herpesvirus life cycle. Herpesvirus entry is initiated by
  attachment to cellular receptors and membrane fusion (1), followed by cytoplasmic
  capsid transport along microtubules (2). Capsids dock at the nuclear pore complex
  and deliver the viral double-stranded DNA genome into the nucleus (3). Productive
  infection is initiated by immediate-early (IE) and early (E) gene expression (4),
  which is followed by viral DNA replication (5). Viral proteins are synthesized at
  the late (L) phase in the cytoplasm, including envelope proteins translated at the
  rough endoplasmic reticulum (6). Nuclear capsid assembly and genome packaging occur
  in the nucleus (7). Nucleocapsids subsequently undergo secondary envelopment at
  Golgi and trans-Golgi network–derived membranes and are transported through the
  secretory pathway (8–9), culminating in virion release from the cell surface (10).
  In parallel, a simplified latency–reactivation pathway is shown as an inset. During
  latency, the viral genome persists in the nucleus as an episomal DNA molecule in
  specific reservoir cells (illustrated here by a latent neuron). Reactivation leads
  to the re-initiation of IE gene expression and entry into the productive (lytic)
  replication cycle
