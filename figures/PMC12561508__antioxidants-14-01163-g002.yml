figure_title: Overlapping and distinct transcriptional responses to GGMSC in CAPAN-2
  and HPAF-II cells.
caption: Overlapping and distinct transcriptional responses to GGMSC in CAPAN-2 and
  HPAF-II cells. (A) Venn diagram showing overlap of significantly regulated genes
  in both CAPAN-2 and HPAF-II, highlighting common targets (padj < 0.01). (B) Genes
  significantly upregulated in both cell lines at 20 h under a stringent threshold
  (padj < 0.01 and log2FC > 1). (C) Log2 fold changes of the 12 most significant and
  commonly regulated genes across both cell lines. GGMSC reprograms metabolic pathways
  in CAPAN-2 and HPAF-II cells. (D) Heatmaps of differentially expressed metabolic
  genes related to glycolysis, the pentose phosphate pathway (PPP), the tricarboxylic
  acid (TCA) cycle, and oxidative phosphorylation (OXPHOS), show broad suppression
  in HPAF-II and maintenance in CAPAN-2
