figure_title: PARPi stimulate PCa cells to release CypA
caption: (A) Paired peripheral blood serum samples from 5 PCa patients before and
  after PARPi treatment were analyzed using proteomics profiling. (B) Heatmap showing
  changes in serum protein profiles before and after PARPi treatment. (C and D) RT-qPCR
  analysis of PARPi-induced changes in CypA mRNA levels in murine PCa cell lines (C)
  and human PCa cell lines (D); N = 3 per group. (E and F) Western blot analysis of
  PARPi-induced changes in intracellular CypA (cCypA) and eCypA protein levels in
  murine (E) and human (F) PCa cell lines. (G and H) ELISA of PARPi-induced changes
  in CypA supernatant levels in murine (G) and human (H) PCa cell lines. (I and J)
  DCFH-DA (green) staining to detect PARPi-induced ROS levels in PCa cell lines RM-1
  (I; N = 3) and MycCap/DU145/22RV1 (J; N = 5). Original magnification, ×100. (K)
  Gene Ontology enrichment analysis showing enhanced intracellular transport pathways
  in PCa cells after PARPi stimulation. (L) Western blot analysis of cCypA and eCypA
  levels after protein transport inhibition by Brefeldin A (BFA). Data are presented
  as mean ± SEM and were analyzed by Welch’s t test
article_title: PARP inhibitors restore NK cell function via secretory crosstalk with
