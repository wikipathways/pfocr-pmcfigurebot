figure_title: Hhip targets Hedgehog Signaling Pathway to mediate angiogenic changes
  in mECs
caption: '(A) Relative mRNA expression levels of Hhip in KO SMCs with siRNA-mediated
  (si-mediated) knockdown of Hhip or nonspecific control (si-NC) (n = 6). (B) representative
  images of the WB of HHIP protein from WT or KO SMC with si-NC and si-Hhip transfection.
  (C) the quantification of HHIP protein expression between Carmn WT or KO SMCs. (D)
  the HHIP concentration measured by ELISA in supernatants harvested from the indicated
  groups of SMCs. (E) quantification of BrdU incorporation in mECs incubated with
  supernatants collected from the indicated groups of SMCs. (F) the representative
  WB images of specific AKT and eNOS proteins in mECs incubated with supernatants
  collected from KO SMCs transfected with si-NC or si-Hhip. (G and H) the quantification
  of relative expression of p-AKT or p-eNOS of mECs incubated with KO SMC si-NC or
  si-Hhip supernatants. (I) representative WB images of the indicated protein expression
  of the Hedgehog signaling pathway in Carmn WT or KO SMCs. (J) the quantification
  of relative expression of proteins in I. (K) representative images of spheroids
  cocultured with supernatants collected from the indicated 4 groups of SMCs. Scale
  bar: 100 μm. (L) quantification of branch length and number of sprouts in K. For
  all panels, error bars represent SEM. P value was determined by unpaired 2-tailed
  Student’s t test (A, C, G, and H) or 1-way ANOVA with Bonferroni post test (D, E,
  J, and L)'
article_title: A smooth muscle cell lncRNA controls angiogenesis in chronic limb-threatening
