figure_title: Adaptive resistance mechanism involving RAS-ARAF-KSR1 signaling axis
  in BRAF-mutant NSCLC
caption: 'Schematic model illustrating MAPK signaling mechanisms in BRAF Class II
  & III mutant exarafenib-resistant cells under different treatment conditions. Column
  1 (Pretreatment baseline/drug-free): Resistant cells exhibit high MAPK signaling
  through conventional oncogenic-BRAF-dependent pathway. Column 2 (Exarafenib treatment):
  Resistant cells maintain sustained MAPK activation through an alternative ARAF-dependent
  pathway. RTK activation enhances RAS-GTP loading, which facilitates formation of
  an ARAF–KSR1 complex stabilized by exarafenib. This emergent complex provides a
  bypass route for pathway reactivation under drug pressure. Column 3 (Exarafenib
  + MEKi combination): Combination therapy with MEK inhibitor (MEKi) effectively suppresses
  the reactivated MAPK pathway by targeting downstream signaling, resulting in improved
  pathway suppression. Black arrows indicate active signaling pathways; gray arrows
  indicate suppressed pathways. Exa, exarafenib'
article_title: Targeting BRAF Class II and III Mutations in NSCLC with the pan-RAF
  inhibitor Exarafenib Reveals ARAF-KSR1-Mediated Resistance and Rational Combination
  Strategies
