caption: Differentially expressed genes (DEGs) found between untreated and proglumide-treated
  human pancreatic stellate cells. (A) Volcano plot showing 926 downregulated genes
  (green) and 2095 upregulated genes (orange) comparing untreated human PSCs to proglumide-treated
  PSCs. (B) Pancreatic cancer pathway analysis networks show that genes involved in
  proliferative and metastatic pathways in pancreatic cancer are downregulated by
  proglumide (shown in blue), and tumor suppressor genes and genes that are involved
  with apoptosis are upregulated with proglumide treatment of hPSC (shown in orange).
  Solid lines imply a direct interaction and dashed lines imply an indirect interaction
article_title: Downregulation of the CCK-B Receptor in Pancreatic Stellate Cells Blocks
  Molecular Proliferative Pathways and Increases Apoptosis to Decrease Pancreatic
  Cancer Growth In Vitro
