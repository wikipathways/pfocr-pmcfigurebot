figure_title: Health-promoting effects of selenium and its mechanisms of action.
caption: Health-promoting effects of selenium and its mechanisms of action. Selenium
  possesses anti-oxidant, anti-cancer, immunomodulatory, hypoglycemic, and intestinal
  microbiota-regulating properties. It acts as an antioxidant by lowering oxidative
  stress and deoxynucleotide levels. It functions as an anti-cancer agent by inducing
  apoptosis and cell-cycle arrest, preventing tumor cell invasion and metastasis,
  and promoting DNA damage repair. It exerts immunomodulatory effects by affecting
  non-specific immunity (e.g., macrophages and neutrophils) and specific immunity
  (e.g., T and B lymphocytes). It exerts hypoglycemic action by regulating the IRS-PI3K-Akt
  signaling pathway. It regulates the intestinal microbiota by regulating prostaglandins.
