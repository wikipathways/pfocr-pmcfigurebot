figure_title: Chronic stress reprograms amino acid metabolism and upregulates ANPEP
  expression in liver cancer
caption: (A) Venn diagram displayed intersecting pathway enrichment analysis of differential
  metabolites in serum of mice with H22 allograft tumor (n = 3) and in liver of mice
  with orthotopic Hepa1-6 tumor (n = 5). (B) The bubble chart of stress-upregulated
  genes in metabolic signaling pathways, as identified by KEGG pathway analysis. (C)
  The bubble plot of stress-upregulated genes in amino acid–associated pathways. (D
  and E) ANPEP mRNA and protein levels in primary H22 (n = 4) and Hepa1-6 tumors from
  control and stressed mice (n = 5) and in Huh7/HepG2 cells after dexamethasone (DEX;
  1 μM) for 48 hours (n = 3). Data are presented as mean ± SD. Significance was assessed
  by 2-tailed unpaired Student’s t test (D). **P < 0.01; ***P < 0.001
article_title: Chronic stress–induced ANPEP drives liver cancer progression by increasing
  glutathione synthesis and inhibiting ferroptosis
