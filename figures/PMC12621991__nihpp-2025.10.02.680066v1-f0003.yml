figure_title: Solute carrier transcriptome remodeling underscores increased GSH biosynthesis
  under glutamine limitation
caption: (A) UMAP analysis of KEGG pathways upregulated in C2C12 cells cultured under
  −Q conditions compared to +Q. (B) Cluster plot from GSEA comparing gene expression
  profiles of cells in −Q versus +Q media, highlighting significantly enriched gene
  sets. (C) Heatmap displaying expression levels of amino acid transporter genes under
  −Q and +Q conditions, generated using k-means clustering. (D) Highlighted expression
  levels of specific solute carrier (SLC) transcripts involved in glutathione synthesis,
  including Slc7a11 and Slc25a39, under −Q and +Q conditions. (E) Volcano plot showing
  differential expression of SLC gene family mRNAs under −Q conditions compared to
  +Q, indicating upregulated and downregulated genes. (F) qRT-PCR analysis of Slc7a11
  and Slc25a39 mRNA expression levels in cells cultured under −Q or glucose-free (−Gluc)
  conditions. Data represent mean ± SD from n = 3 independent experiments. Statistical
  significance was determined using Student’s t-test. Statistical significance is
  indicated as P<0.05(*) and P<0.05(#). Data presented as mean ± SD
