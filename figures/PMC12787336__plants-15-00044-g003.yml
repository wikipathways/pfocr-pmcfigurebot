figure_title: Analysis of ago1-38-specific DAMs.
caption: Analysis of ago1-38-specific DAMs. (A) Venn diagram showing the overlap of
  DAMs between ago1-25, ago1-38, and ago1-45. Each circle represents a comparison
  group. The number of the ago1-38-specific DAMs were marked in red bold font. (B)
  KEGG functional annotation and enrichment analysis of the 286 specific metabolites
  in ago1-38 identified in (A). The glutathione metabolism pathway was marked in red
  font, which is extensively enriched in henceforth analysis. The x-axis represents
  the enrichment factor and the y-axis lists pathway names (sorted by p-value). Point
  color reflects p-value significance, with red indicating the highest and purple
  the lowest significance, while point size represents the number of differential
  metabolites
