figure_title: IL-12 and TNFα Drive Expansion of Tet2-Mutant Clones in a Jak2V617F-Mutant
  Environment
caption: (A) Volcano plot showing differentially expressed genes between Tet2Δ/+ HSPCs
  from a Jak2V617F environment compared to Tet2Δ/+ HSPCs from a WT environment. (B)
  LogFC values for Tet2Δ/+ HSPCs DEGs from indicated pathways. (C) Volcano plot of
  gene set over-representation analysis (ORA) identifying IL-12 signaling as the most
  significantly enriched pathway in Tet2Δ/+ HSPCs from a Jak2V617F environment. (D-E)
  Serum cytokine levels (normalized to WT control chimeras) of (D) IL-12 and (E) TNFα
  from murine mixed chimeras (n= 9–15 / group). (F) Serum cytokine fold change (normalized
  to HD control mice) for PV and MF PDXs plotted against relative increase in VAF
  of individually tracked TET2 mutations engineered into cord blood CD34+ cells (n=
  12 recipient mice sourced from 4 separate donors for each HD, PV, and MF). (G) Representative
  flow cytometry plots showing intracellular pSTAT4 staining in Tet2Δ/+ BM cells in
  WT or Jak2V617F backgrounds. (H-I) Median fluorescent intensity (MFI) of intracellular
  pSTAT4 levels in (H) whole BM and (I) HSPCs (n = 5 / group). *p ≤0.05, **p ≤0.01,
  ***p ≤0.001, ****p ≤0.0001
