caption: 'Scatter plots depicting KEGG pathway enrichment analysis of circRNA-associated
  source genes from six pairwise treatment comparisons (P4 vs. P1, P4 vs. P3, P4 vs.
  P2, P2 vs. P1, P3 vs. P2, and P3 vs. P1). (A–C) Each plot illustrates the top 20
  significantly enriched pathways. The X-axis indicates the enrichment factor, while
  the Y-axis lists enriched KEGG pathways. Dot sizes correspond to the number of genes
  associated with each pathway, and colors reflect the significance level (q-value).
  Pathway enrichment analysis highlights specific biological processes and signaling
  pathways potentially regulated by circRNAs under distinct treatment conditions,
  suggesting their involvement in immune responses and antiviral mechanisms. Pathways
  framed indicated unique pathways enriched in each compared pair only (Red frame)
  or some compared pairs (Yellow or Blue frame). (D) Venn diagram to summarize pathways:
  (1) common pathways unframed in (A–C), or (2) to (6) unique pathways unframed in
  (A–C) enriched in the different comparisons, respectively, as indicated'
