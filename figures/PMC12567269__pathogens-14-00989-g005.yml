figure_title: Mechanisms by which IL-10 suppresses pro-inflammatory cytokine production.
caption: Mechanisms by which IL-10 suppresses pro-inflammatory cytokine production.
  IL-10 mediates its anti-inflammatory effects through engagement with its receptor
  complex, comprising IL-10R1 and IL-10R2. IL-10 binds to IL-10R, activating the JAK1-TYK2-STAT3
  signaling pathway, which orchestrates the transcription of various anti-inflammatory
  mediators. Key transcription factors ETV3 and Nfil3 are activated, leading to the
  suppression of NF-κB activity and a reduction in IL-12p40 production. Furthermore,
  STAT3 modulates the activity of MAPK p38 and RNA-binding proteins like TTP, resulting
  in decreased levels of pro-inflammatory cytokines. The IL-10/STAT3 axis also plays
  a role in chromatin remodeling, indicating an epigenetic layer of regulation. In
  addition to the JAK/STAT3 pathway, the PI3K/Akt/GSK3β signaling cascade contributes
  to IL-10-mediated transcriptional regulation in macrophages. Other downstream mediators,
  including Bcl3 and A20-binding inhibitors, require further investigation to elucidate
  their contributions to the comprehensive anti-inflammatory effects of IL-10
