figure_title: FGFR1N546K drives cytokine-independent proliferation of Ba/F3 cells
  and renders them sensitive to pharmacological FGFR inhibition
caption: (A) Relative cell counts of viable Ba/F3 cells transduced with different
  vectors (empty vector, FGFR1 WT, FGFR1D623A, FGFR1D623A;N546K, FGFR1N546K) normalized
  to parental Ba/F3 cells. Analyses were performed with 10 ng/mL IL-3 in culture medium
  and after withdrawal of IL-3 after 144 hours. Average numbers (±SD) of 6 independent
  experiments are shown. P values were calculated in pair-wise comparisons to Ba/F3
  parental cells using a 1-sided Wilcoxon rank-sum test and adjusted for multiple
  testing using the Benjamini–Hochberg method. (B) Levels of total and phosphorylated
  proteins of the FGFR pathway in IL-3–dependent Ba/F3 cells (parental, empty vector,
  FGFR1 WT, FGFR1D623A, FGFR1D623A;N546K, FGFR1N546K) and 3 IL-3–independent FGFR1N546K-transduced
  Ba/F3 cell clones (blue). IL-3–independent FGFR1N546K-transduced BA/F3 cells shown
  in different blue tones correspond to cells from 3 independent experiments labelled
  in light blue in (A). Antibodies against total and phosphorylated FGFR1, the adaptor
  protein FRS2, and the downstream targets AKT, ERK, and STAT3 were used. β-actin
  served as loading control
