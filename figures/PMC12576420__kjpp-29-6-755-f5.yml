figure_title: The AMPK/Nrf2 signaling pathway mediated the inhibitory effect of vericiguat
  on cardiomyocyte pyroptosis
caption: (A) mRNA level of Nrf2 in cardiac tissue (n = 6). (B) protein levels of p-AMPK,
  AMPK, and Nrf2 in cardiac tissue (n = 6). (C) Representative Nrf2 immunofluorescence
  staining images of each group (Scale bar = 20 μm, n = 3). The nuclear accumulation
  of Nrf2 are marked using white arrow. (D) The nuclear accumulation percentage of
  Nrf2 (n = 3). The obtained data were presented as the mean ± SD. CME, coronary microembolization;
  CME + VER, CME + Vericiguat; CME + VER + CC, CME + Vericiguat + AMPK inhibitor;
  AMPK, adenosine monophosphate-activated protein kinase; Nrf2, nuclear factor erythroid
  2-like; GAPDH, glyceraldehyde-3-phosphate dehydrogenase. *p < 0.05 vs. Sham group;
  **p < 0.05 vs. CME group; ***p < 0.05 vs. CME + VER group
