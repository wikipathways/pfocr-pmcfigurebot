figure_title: De novo serine synthesis activity is not conserved between activated
  human and mouse NK cells
caption: a, Schematic showing the de novo serine synthesis pathway with key enzymes
  highlighted. b, Transcript expression of genes encoding de novo serine synthesis
  enzymes in cytokine-stimulated human and mouse NK cells. c, Immunoblots showing
  protein expression of PHGDH and β-actin loading control in human (top) or mouse
  (bottom) NK cells after 72 h culture in Ser+ or Ser− medium with indicated cytokine
  stimulation. Quantification of PHGDH band density normalized to β-actin loading
  control (right). d, Percentage13C labelling of serine in human or mouse NK cells
  cultured with [U-13C]-glucose for 24 h with IL-15 stimulation immediately after
  isolation (24 h) or stimulated with IL-15 for 48 h before medium was washed and
  changed to [U-13C]-glucose medium for 24 h labelling (72 h) followed by GC–MS. e,
  Serine abundance measured by LC–MS in medium supernatant of human or mouse NK cells
  plated at 1 × 106 cells per ml and cultured with IL-2/IL-15 (human) or IL-15 (mouse)
  for 48 h and normalized to medium-only controls. f, Percentage of serine pool labelled
  with 2H in 48 h cytokine-stimulated human or mouse NK cells that were labelled with
  [2,3,3-2H]-serine for 15 min followed by LC–MS. g, Representative histograms of
  CTV dilution (left) and quantification of percentage divided cells (right) of NTC
  or PHGDHCRISPRa human NK cells cultured in Ser+ or Ser− medium with IL-2/IL-15 for
  6 d post-electroporation. Human NK cells were electroporated with CRISPRa constructs
  immediately after isolation from PBMCs. h, Quantification of percentage divided
  cells (left) and Ki67 expression (right) of Rosa26cRNP or PhgdhcRNP mouse NK cells
  cultured for 3 d in Ser+ or Ser− medium with IL-15 post-electroporation. Data represent
  mean ± s.e.m. or individual paired donors/mice across at least two independent experiments.
  Data are representative of n = 6 independent human donors and n = 3 mice (b), n
  = 4 independent human donors and n = 4 mice (c), n = 5 mice and n = 4 independent
  human donors (d), n = 4 mice and n = 3 independent human donors (e,f), n = 5 independent
  human donors (g) and n = 6 independent mice (h). *P < 0.05, **P < 0.01, ***P < 0.001,
  ****P < 0.0001 by two-way ANOVA (b,d,f,h), two-sided paired t-test (c), two-sided
  Student’s t-test (e) or one-way ANOVA (g). Exact P values are P < 0.0001 (PHGDH),
  P < 0.0001 (PSAT1), P < 0.0001 (PSPH) (b); P = 0.0084 (right, c); P = 0.0001 (d);
  P = 0.0083 (e); P < 0.0001 (f); P = 0.0244 (NTC Ser+ versus NTC Ser−), P = 0.0053
  (NTC Ser− versus PHGDHCRISPRa Ser−) (g); P = 0.0320 (left), P = 0.0500 (right) (h)
