figure_title: Pathway analysis of E2-regulated genes in MDA-MB-231-ERβ parental and
  resistant cell lines.
caption: Pathway analysis of E2-regulated genes in MDA-MB-231-ERβ parental and resistant
  cell lines. (A–C) Gene Set Enrichment Analysis (GSEA) for hallmark early and late
  estrogen response pathways in Par (A), D-R (B), and P-R (C) cells. Normalized enrichment
  scores (NES) are shown for each pathway in each cell line, indicating robust estrogen
  pathway activation in all models, with the strongest enrichment observed in parental
  cells. (D–G) Pathway enrichment analysis using Enrichr-KG of E2-regulated genes
  in Par (D), D-R (E), and P-R (F) cell lines, as well as for the 392 commonly regulated
  genes in all cell lines (G) across four gene set libraries. Blue shading represents
  Reactome pathways, purple shading represents WikiPathway pathways, pink shading
  represents GO Biological Process (GO BP) pathways, and green shading represents
  KEGG pathways. Bar length represents −log (p-value), with longer bars indicating
  greater statistical significance. Pathways are ranked based on significance. (H–K)
  Pathway analysis using IPA of differentially expressed genes in response to E2 treatment
  in Par (H), D-R (I), and P-R (J) cell lines, as well as for the 392 commonly regulated
  genes (K), with significance defined as p < 0.05 and |z-score| ≥ 2. The x-axis represents
  −log (p-value) of pathway enrichment, while the y-axis represents the ratio of differentially
  expressed genes in the pathway relative to the total genes in the pathway. The size
  of each bubble corresponds to the number of genes in the pathway, and the color
  reflects the z-score, indicating activation (red) or inhibition (blue). (L–O) Upstream
  regulator analysis using IPA of differentially expressed genes in Par (L), D-R (M),
  and P-R (N) cell lines, as well as for the 392 commonly regulated genes (O), with
  significance defined as p < 0.05 and |z-score| ≥ 2. The x-axis represents −log (p-value),
  while the y-axis represents the z-score, indicating activation (positive) or inhibition
  (negative). The size of each bubble corresponds to the number of genes regulated,
  and the color reflects the activation state (red for activated, blue for inhibited).
  Regulators are ranked based on statistical significance. All pathway enrichment
  and upstream regulator analyses were conducted using statistically significant differentially
  expressed genes (|FC| ≥ 1.5, p < 0.05, FDR < 0.1)
