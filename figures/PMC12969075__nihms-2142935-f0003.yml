figure_title: Extensive cortical transduction following FIVI
caption: '(A) Representative coronal sections in a 3-day-old marmoset show the widespread
  transduction pattern following a PC87 injection of AAV9-CAG-GFP. The side view of
  the extracted central nervous system highlights broad GFP labeling. Across all regions,
  the most abundant labeling is in the lower layers.(B–E) Detailed view of the insets
  shown in (A), highlighting the labeling pattern in the temporal, prefrontal, frontal,
  and parietal regions. Most labeled cells in the cortex are neurons, based on morphology
  and co-expression of NeuN (B, white arrowheads in yellow inset). Labeling in more
  superficial layers is almost entirely restricted to apical dendrites from lower-layer
  neurons (B, pink inset). The density of transduced neurons varied across cortical
  depths (dashed boxes in B–E). GFP+/NeuN+ cells were located in similar layers across
  regions, but the proportion of transduced neurons varied with depth, with up to
  80% of cells being transduced at certain depths.(F–I) Cell labeling was observed
  in additional structures, such as the olfactory bulbs (OBs; A-1), striatum (Str;
  A-3, A-4, and F), hippocampus and choroid plexus (Hipp and CP, respectively; A-5
  and G), and cerebellum (A-7 and I). Strong fiber labeling was observed in the thalamus
  (Th; A-5 and H) and white matter paths, such as corticofugal pathways within the
  internal capsule (F).Scale bars: (A) 1 mm, (B–H) 500 μm, and (I) and insets in (G)
  and (H), 250 μm. FIVI volume: 60 μL'
article_title: Targeted gene transfer into developmentally defined cell populations
  of the primate brain
