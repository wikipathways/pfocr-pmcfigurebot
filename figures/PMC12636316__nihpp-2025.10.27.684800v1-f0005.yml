figure_title: PNPLA3 expression in adipocytes is regulated by the cAMP–AKT pathway
caption: '(A) Immunoblot analysis of PNPLA3 protein levels on LDs (left, middle panels)
  and RT-qPCR analysis (right) of 3T3-L1 cells treated with forskolin. Mature adipocytes
  (10–12 days post-differentiation) were cultured in insulin-deprived high glucose
  DMEM medium for 2 days, then treated with 10 μM forskolin. (B–D) Western blot analysis
  (left, middle) of PNPLA3 on LD and relative Pnpla3 mRNA (right) in 3T3-L1 cells
  treated with norepinephrine (NE) in the presence or absence of the indicated kinase
  inhibitors: LY294002, AKTi VIII, Torin 1. Mature adipocytes were insulin-starved
  for 2 d, then pretreated overnight with LY294002 (50 μM), AKTi VIII (10 μM), Torin
  1 (500 nM). The next day, cells were stimulated with NE (10 μM) or vehicle (DMSO)
  in fresh medium containing 2% BSA, with or without the respective inhibitor, and
  harvested after 3 h (n = 3/group). Data represent mean ± SD. P values were determined
  by one-way ANOVA followed by Dunnett’s multiple comparisons test (A) and by one-way
  ANOVA followed by Tukey’s multiple comparisons test (B–D). *P < 0.05; **P < 0.01;
  ***P < 0.001; †P < 0.0001'
