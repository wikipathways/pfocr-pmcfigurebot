figure_title: Different nociceptive genes are expressed associated with visceral pain
  symptoms.
caption: Different nociceptive genes are expressed associated with visceral pain symptoms.
  (A-B) Ingenuity pathway analysis software was used to identify the genes (P value
  <0.1) involved in the nociception in the male (A) and female (B) mice. Blue color
  represents downregulation and red represents upregulation of identified DEGs. (C-D)
  Ingenuity pathway analysis relative comparison shows sexual dimorphism in the process
  of nociception, mechanical nociception, hyperalgesia, and analgesia. (C) IPA suggested
  strong inhibition of analgesia pathway and activation of nociception and mechanical
  nociception pathways in male DRG. (D) IPA suggested strong activation of analgesia
  pathway and mild activation of nociception pathway in female DRG. Mild inhibition
  of hyperalgesia pathway is also suggested in female DRG
article_title: Transcriptome Profiling Suggests Molecular Sexual Dimorphism in Lumbosacral
  Dorsal Root Ganglia and Sex-specific Mechanisms Underlying Visceral Pain
