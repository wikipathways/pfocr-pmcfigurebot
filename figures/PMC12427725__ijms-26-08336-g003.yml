figure_title: NLRP3 signaling pathway and its implications in neuroinflammation.
caption: NLRP3 signaling pathway and its implications in neuroinflammation. The activation
  mechanism of the NLRP3 inflammasome in response to diverse pathological stimuli,
  leading to neuroinflammation and cell death. NLRP3 activation is initiated by multiple
  upstream signals, including mitochondrial dysfunction, ion flux dysregulation, and
  lysosomal destabilization, which collectively promote the assembly of the inflammasome
  complex with ASC and caspase-1. Subsequent activation of caspase-1 facilitates the
  maturation and secretion of pro-inflammatory cytokines IL-1β and IL-18, thereby
  amplifying the inflammatory cascade. In parallel, caspase-1-mediated cleavage of
  GSDMD triggers pyroptosis, further exacerbating neuronal injury (the figure is generated
  via BioRender)
