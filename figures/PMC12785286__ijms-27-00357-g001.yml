figure_title: The dual pathways of cellular senescence determined by p53 status and
  corresponding therapeutic strategies.
caption: The dual pathways of cellular senescence determined by p53 status and corresponding
  therapeutic strategies. (A) p53 as a determinant switch in senescence. Upon stress
  signals such as chemotherapy, radiation, or oncogene activation, p53 directs the
  cell fate. Blue arrows indicate Path 1 (Functional/WT p53), leading to canonical
  senescence and stable cell cycle arrest. Red arrows indicate Path 2 (Mutant/Null
  p53), which initiates irregular or malignant senescence characterized by unstable
  genomic integrity and escape mechanisms. (B) Phenotypic and microenvironmental consequences
  of distinct senescence pathways. Path 1 (Blue) involves the secretion of acute/immunogenic
  senescence-associated secretory phenotype (SASP) factors like TGF-β and IL-6, promoting
  immune clearance by NK/T cells, although chronic persistence may promote tumor growth.
  Path 2 (Red) results in the formation of enlarged polyploid therapy-resistant senescent
  cells that secrete malignant SASP factors (driven by MMPs and NF-κB hyperactivation).
  This fosters an immunosuppressive environment (MDSC recruitment), metastasis, and
  the generation of stem-like progeny as an escape mechanism. (C) Therapeutic strategies
  targeting specific pathways. Interventions for Path 1 focus on maximizing WT p53
  activity using MDM2 inhibitors (Nutlins) or accelerating immune clearance via immunotherapy
  (PD-1/PD-L1 blockades). Strategies for Path 2 (Mutant p53/Escape) exploit specific
  vulnerabilities through synthetic lethality (e.g., KDM4C or DNA2 inhibitors), a
  one-two punch approach (therapy-induced senescence followed by senolytics like PROTACs
  or BCL-xL inhibitors), or by targeting metabolic vulnerabilities (SLC7A11) with
  ferroptosis inducers
