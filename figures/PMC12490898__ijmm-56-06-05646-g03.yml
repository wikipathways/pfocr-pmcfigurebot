figure_title: Mechanism of action of Quinazolinone compounds in pyroptosis, autophagy
  and cellular senescence pathways.
caption: Mechanism of action of Quinazolinone compounds in pyroptosis, autophagy and
  cellular senescence pathways. i) In the senescence pathway, telomere shortening
  and limited telomerase function activate the p53/p21/p16 pathway, causing G1 phase
  arrest and cellular senescence 3-(2-(hydroxymethyl) phenyl)-2-methylquinazolin-4(3H)-ones
  upregulate the expression of TRF1, POT1 and p53/p21/p16, and inhibit telomerase,
  inducing cells to enter a senescence phenotype]. ii) In the pyroptosis pathway,
  NLRP3 assembles with ASC and procaspase-1 to form the inflammasome, activating caspase-1,
  which mediates the maturation of IL-1β and IL-18, and induces pyroptosis through
  GSDMD, forming membrane pores. Quinazolinone derivatives can inhibit this process
  by blocking NLRP3 inflammasome activation and the release of inflammatory factors
  (Mdivi-1 inhibits NLRP3 inflammasome activation, reduces the activation of NLRP3,
  ASC, Caspase-1 and the level of GSDMD-NT, and decreases the release of IL-1β and
  IL-18). iii) In the autophagy pathway, ATG family proteins mediate phagophore nucleation
  and extension. LC3 is modified by ATG4 and ATG7, transforming into LC3-II, which
  promotes autophagosome formation and fusion with lysosomes for substrate degradation
  (DQQ and HF promote LC3-II generation, enhance ATG5-ATG12 complex formation and
  promote autophagy. MJ-33 initiates autophagy by activating ATG proteins during vesicle
  nucleation but reduces the LC3/LC3-II ratio and increases p62 levels, inhibiting
  autophagy). NLRP3, NOD-like receptor thermal protein domain associated protein 3;
  ASC, apoptosis-associated speck-like protein containing a CARD; GSDMD, gasdermin
  D; ATG, autophagy related gene; LC3, microtubule-associated-proteinlight-chain-3;
  NIX, NIP3-like protein X; TIN2, Terf1 interacting nuclear factor 2; RAP1, Ras-proximate-1;
  TRF1, telomeric repeat binding factor 2; POT1, protection of telomeres 1
