figure_title: Cellular heterogeneity of stromal cells.
caption: Cellular heterogeneity of stromal cells. (A) UMAP showing the COL1A1+ stromal
  cells, colored by nine subclusters. (B) Heatmap of Ro/e values for fibroblast subclusters
  across pathological and molecular subtypes. (C) Heatmap showing the GSVA enrichment
  scores for hallmark pathways across COL1A1+ stromal cell subclusters. (D) UMAP illustrating
  the developmental trajectories of fibroblasts across subclusters. (E) Volcano plot
  showing differentially expressed genes in fibroblasts between muscle-invasive (MI)
  and non-muscle-invasive (NMI) samples. (F) Lollipop chart showing area under the
  curve (AUC) scores from the Augur analysis, highlighting cell type prioritization
  among fibroblast subclusters between MI and NMI samples. (G) Kaplan-Meier survival
  curves for overall survival (OS) in the TCGA-BLCA cohort, stratified by high versus
  low infiltration of fib-GREM1. Statistical significance was determined using the
  log-rank test. (H) UMAP plot showing endothelial cells, colored by six subclusters.
  (I) Heatmap of Ro/e values for endothelial clusters across pathological and molecular
  subtypes. (J) UMAP showing endothelial cells, colored by tip-like and stalk-like
  scores. (K, L) Violin plots showing the tip-like (K) and stalk-like (L) scores across
  the normal, NMI and MI samples
