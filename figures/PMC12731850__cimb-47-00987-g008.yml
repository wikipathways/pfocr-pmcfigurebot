caption: Correlation analysis between serum metabolomics and proteomics of the thoracic
  aorta. (A) Bubble plot of KEGG pathway enrichment analysis of differentially expressed
  proteins and metabolites between the Model group and the Control group. (B) Bubble
  plot of KEGG pathway enrichment analysis of differentially expressed proteins and
  metabolites between the Edu group and the Model group. (C) Visualization of KEGG
  pathways between the Model group and the Control group. (D) Visualization of KEGG
  pathways between the Edu group and the Model group. The rectangular frame represents
  the enzyme or key intermediate, the circle represents the metabolite, the black
  solid line arrow indicates the main reaction step, and the dotted line arrow indicates
  the associated metabolic pathway or secondary process. Different colors in the pathway
  expressed the differential expression of proteins and metabolites. Red indicated
  up-regulation and blue indicated down-regulation. Control (untreated), Model (L-NNA-induced
  hypertension), Edu (model rats administered with 6 mg/kg/day Edu)
