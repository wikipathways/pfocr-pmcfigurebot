figure_title: Pathway analysis of lipidomic changes in primary human monocyte-derived
  model TAMs following PFKFB3 inhibition with PFK15 and AZ PFKFB3 26.
caption: 'Pathway analysis of lipidomic changes in primary human monocyte-derived
  model TAMs following PFKFB3 inhibition with PFK15 and AZ PFKFB3 26. Both inhibitors
  most profoundly affect glycerophospholipid metabolism but exhibit distinct secondary
  effects, with PFK15 showing a stronger association with ether lipid metabolism and
  AZ PFKFB3 26 having a greater impact on the phosphatidylinositol signaling system.
  Pathway analysis plots based on data from Table 3 and Table 4. (A) Control vs. PFK15
  treatment. (B) Control vs. AZ PFKFB3 26 treatment. Each node represents a metabolic
  pathway. Node color corresponds to the level of statistical significance (−log10(p-value)),
  from red (most significant) to yellow (less significant). Node radius corresponds
  to the “Pathway Impact” value, which reflects the cumulative influence of the altered
  metabolites on the pathway as a whole. Numbered pathways: glycerophospholipid metabolism
  (1); glycosylphosphatidylinositol (GPI)-anchor biosynthesis (2); sphingolipid metabolism
  (3); linoleic acid metabolism (4); alpha-linolenic acid metabolism (5); glycerolipid
  metabolism (6); ether lipid metabolism (7); phosphatidylinositol signaling system
  (8); inositol phosphate metabolism (9) and arachidonic acid metabolism (10)'
article_title: Inhibition of PFKFB3 in Macrophages Has a Dual Effect on Tumor-Regulating
