figure_title: Overview of integrated biomedical entities and their relations in BioMedGraphica.
caption: 'Overview of integrated biomedical entities and their relations in BioMedGraphica.
  (A) Data sources and entity distributions. The left panel shows the data sources
  (e.g., OMIM, HGNC, Ensembl, UniProt, KEGG, SILVA, DrugBank, etc.) used to define
  and harmonize 11 biomedical entity types: Promoter, Gene, Transcript, Protein, Pathway,
  Metabolite, Microbiota, Exposure, Phenotype, Disease, and Drug. The right panel
  presents the logarithmic-scaled bar plot showing the total number of unique entities
  in full BioMedGraphica (upper bar) and BioMedGraphica-Conn (lower opacity bar).
  (B) Circular chord diagram of pairwise relationships between biomedical entities.
  Each colored segment represents a specific entity type, and outer arcs quantify
  the total number of cross-entity edges for each type. The inner chords indicate
  the direction and volume of entity-to-entity relationships (e.g., Gene–Transcript,
  Protein–Pathway, Microbiota–Disease). Each relationship type is labeled (e.g., R1:
  Promoter–Gene, R2: Gene–Transcript, R10: Pathway–Drug, R23: Disease–Drug and total
  edge counts for selected relationships are annotated.)'
