figure_title: Metabolic pathways for β-hydroxybutyrate (BHB)-mediated suppression
  of hepatocellular carcinoma.
caption: 'Metabolic pathways for β-hydroxybutyrate (BHB)-mediated suppression of hepatocellular
  carcinoma. The ketone body BHB, endogenously synthesized by hepatic HMGCL during
  energy stress, inhibits HCC progression through multiple integrated mechanisms:
  direct inhibition of the glycolytic enzyme aldolase B (ALDOB); systemic reduction
  in insulin secretion to shift cellular metabolism from glycolysis (decreased ECAR)
  to oxidative phosphorylation (increased OCR); and enhancement of DPP4 expression
  to promote ferroptosis susceptibility. Abbreviations: Aldolase B, ALDOB; β-Hydroxybutyrate,
  BHB; Dipeptidyl Peptidase-4, DPP4; Extracellular Acidification Rate, ECAR; Fructose-1,6-Bisphosphate,
  F-1,6-BP; 3-Hydroxymethyl-3-Methylglutaryl-CoA Lyase, HMGCL; Oxygen Consumption
  Rate, OCR [66,67,68,69]'
