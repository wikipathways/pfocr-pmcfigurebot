figure_title: Effect of Epimedin C on the JNK/Nrf2/HO-1 signaling pathway and related
  protein levels detected by western blot analysis.
caption: 'Effect of Epimedin C on the JNK/Nrf2/HO-1 signaling pathway and related
  protein levels detected by western blot analysis. (A) Western blot analysis of PC12
  cells in each group (n=3). Semi-quantitative analysis of (B) Nrf2/GAPDH; (C) p-JNK/JNK;
  (D) HO-1/GAPDH; (E) Bcl-2/Bax. (F) Western blot analysis of PC12 cells in each group
  after JNK agonist (5 µM Ani) intervention (n=3). Semi-quantitative analysis of (G)
  Nrf2/GAPDH; (H) p-JNK/JNK; (I) HO-1/GAPDH. All results are presented as the mean
  ± SD from three replicates. &P<0.05; #P<0.05, ##P<0.01 vs. control group; *P<0.05,
  **P<0.01 vs. H2O2 group; $P<0.05, $$P<0.01 as indicated. 17β-E2, 17β-estradiol;
  Ani, anisomycin; HO-1, heme oxygenase-1; Nrf2, nuclear factor erythroid 2-related
  factor 2; p-, phosphorylated'
