figure_title: Lateral superior colliculus drives mechanical hypersensitization through
  OPRM1+ RVMSC neurons
caption: 'a, Schematic of chemogenetic silencing of the PAG→RVM pathway (upper) and
  representative vGlut2+ terminals (red) from PAG in the RVM (lower). Scale Bar: 500
  μm. b, Mechanical thresholds of saline (black) and CLZ (blue) infusion in hM4D-expressing
  mice (n = 8). c, d, e, Experimental timeline (c), representative images (d), and
  quantification (e) of monosynaptic inputs onto OPRM1+ RVMSC neurons (n = 6). Scale
  Bar: 250 μm. Inset: mCherry+ neurons in intermediate (iSuC) and deep SuC (dSuC)
  but not superficial SuC (sSuC) (Bregma −3.64mm). PAG: periaqueductal gray; lSuC:
  lateral superior colliculus; MRN: midbrain reticular nucleus; ZI; zona incerta;
  HY: hypothalamus; APN: anterior pretectal nucleus; Po: posterior complex of thalamus;
  CTX: cortex; BNST: bed nucleus of the stria terminalis. f, Representative images
  (left) and quantification (right) of RNAscope detection of vGlut2 and vGat in mCherry+
  input neurons from lSuC, PAG and ZI (6 slides from 3 mice). Scale Bar: 50 μm. g,
  Quantification of mechanical thresholds of saline (black, n = 6) and CLZ (blue,
  n = 6) infusion in RVM of vGlut2Cre mice with hM4D-expressing in lSuC for chemogenetic
  silencing (P = 0.5625, 0.0313, 0.0313). h, Quantification of mechanical thresholds
  after 7 daily RVM infusion of CLZ (23 h before test, shaded) in non-injured vGlut2Cre
  mice with hM3D-expressing in lSuC for chemogenetic activation (n = 6). i, Time for
  two phases of paw licking and biting after formalin injection into the hindpaw.
  CLZ was infused into the RVM of vGlut2Cre mice with eGFP- (black, n = 5) and hM4D-
  (blue, n = 5) expressing in lSuC for chemogenetic silencing. See supplementary Table
  1 for detailed statistics. Two-sided Wilcoxon signed-rank test (g); Non-parametric
  ANOVA (h). * P < 0.05, ** P < 0.01. Mean ± SEM'
