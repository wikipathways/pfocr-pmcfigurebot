figure_title: CDK8/19 inhibition induces bidirectional transcriptional reprogramming
  in anoikis-sensitive and -resistant cells
caption: '(A) Schematic of RNA-seq design; OV90 AnS and AnR cells treated with DMSO
  or SNX631 for 4 days in 2D; AnR cells further cultured in suspension ± SNX631. (B)
  Principal component analysis (PCA) of AnS vs. AnR transcriptomic profiles in 2D
  (top) and AnR cells in 2D vs. suspension (bottom). (C) UpSet plot of SNX631-regulated
  DEGs (FDR < 0.01, FC > 1.5) across 3 comparisons: AnS in 2D (AnS-SNX vs. AnS-Ctrl),
  AnR in 2D (AnR-SNX vs. AnR-Ctrl), and AnR in suspension (AnR-SS vs. AnR-DD). (D)
  Heatmap of all SNX631-regulated DEGs; columns 1–3: SNX631 response; column 4 (AnR-Ctrl
  vs. AnS-Ctrl): anoikis resistance-associated DEGs; column 5: acute anoikis response
  DEGs (AnR-DD vs. AnR-Ctrl). (E and F) Expression (transcripts per million) of representative
  DEGs upregulated (E) or downregulated (F) by CDK8/19 inhibition in AnR cells in
  suspension (AnR-SS vs. AnR-DD). (G and H) Expression of genes showing bidirectional
  regulation: reversed (G) or enhanced (H) by CDK8/19 inhibition. (I) GSVA heatmap
  of hallmark pathway NES clustered by Euclidean distance. (J) Expression of representative
  MYC targets V1 and PI3K/AKT/mTOR pathway genes'
article_title: Anoikis resistance and metastasis of ovarian cancer can be overcome
  by CDK8/19 mediator kinase inhibition
