figure_title: Lactobacillus paracasei ZJUZ2-3 inhibits gastrointestinal tumors via
  the IAA-induced AHR/MTDH/NF-κB axis
caption: 'L. paracasei ZJUZ2-3 and IAA could upregulate AHR, and AHR antagonists could
  abolish the antitumor effect of IAA. (A) Wiki pathway enrichment analysis of DEGs
  from RNA sequencing dataset of HGC27 cells treated with IAA. Size of circles represents
  the ratio of DEGs in pathways. Red: upregulated, blue: downregulated. (B, C) Western
  blot analysis of the activation of AHR in (B) IAA- and (C) L. paracasei ZJUZ2-3-
  treated GC cells. (D, E) The relative protein expression levels of AHR in AGS and
  HGC27. Data were analyzed by t tests; Means ± SD. *p < 0.05, **p < 0.01, ***p <
  0.001, ****p < 0.0001. (F) Western blot analysis of the activation of AHR in nuclear
  and cytoplasm in IAA- and L. paracasei ZJUZ2-3- treated GC cells. Data were analyzed
  by two-way ANOVA; Means ± SD. ns ≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p
  < 0.0001. (G) The relative mRNA expression levels of AHR and its downstream pathway
  genes. Data were analyzed by two-way ANOVA; Means ± SD. ns ≧0.05, *p < 0.05, **p
  < 0.01, ***p < 0.001, ****p < 0.0001. (H) The concentration of AHR in GC cells co-cultured
  with (D)IAA (10 μM) and (E) L. paracasei ZJUZ2-3. Data were analyzed by t tests;
  Means ± SD. ns ≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001. (I) Cell
  viability at OD450nm and (J)colony formation of human GC cells (AGS and HGC27) with
  PBS, IAA, CH223191(10μM), CH223191+IAA. Data were analyzed by two-way ANOVA; Means
  ± SD. ns ≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001. (J) The concentration
  of AHR in GC cells co-cultured with L. paracasei ZJUZ2-3. Data were analyzed by
  two-way ANOVA; Means ± SD. ***p < 0.001, ****p < 0.0001. Data in F, G, I, and J
  were analyzed by two-way ANOVA, Data in D, E and H were analyzed by t tests; Means
  ± SD. ns ≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
