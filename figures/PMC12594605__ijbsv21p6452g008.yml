figure_title: The existence of projection relationship of DR"LC"PBC neural pathway
  by anterograde tracing.
caption: The existence of projection relationship of DR"LC"PBC neural pathway by anterograde
  tracing. (A) Experimental protocol for the anterograde tracing by injecting anterograde
  tracing virus HSV into DR. (B) Representative coronal brain slice, showing the location
  of HSV injected in the DR. (C) Representative images show the co-expression and
  staining of HSV, TH and DAPI in the bilateral LC. (D) Representative images show
  the co-expression and staining of HSV, TH, NK1-R and DAPI in the bilateral PBC.
  (E) Representative coronal brain slice, showing the location of CTB-555 injected
  in the PBC. (F) Representative images show the co-expression and staining of CTB-555,
  TH and DAPI in the bilateral LC. (G) Representative images show the co-expression
  and staining of CTB-555, TPH2 and DAPI in the DR. Scale bar = 100 μm
