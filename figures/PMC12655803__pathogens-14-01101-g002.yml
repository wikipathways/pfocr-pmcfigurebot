caption: C. burnetii strains activate IL-17 signaling pathways. Bubble plots of top
  20 enriched pathways in human alveolar macrophages (hAMs) infected with NMI, NMII,
  G (Q212), or Dugway isolates of C. burnetii compared to uninfected hAMs (n = 3)
  at 72 hpi. Red bubbles represent pathways that are activated (z-score ≥ 1.5, p <
  0.05) and blue bubbles correspond to inhibited pathways (z-score ≤ −1.5, p < 0.05).
  Bubble size corresponds to the ratio of the number of differentially expressed genes
  in a pathway to the total number of genes in that pathway
