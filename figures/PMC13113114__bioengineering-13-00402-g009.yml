figure_title: miR-429 promotes osteogenic differentiation and reduces ROS levels by
  targeting and inhibiting NOG to modulate the BMP/Smad pathway.
caption: miR-429 promotes osteogenic differentiation and reduces ROS levels by targeting
  and inhibiting NOG to modulate the BMP/Smad pathway. (a) miRNA expression levels
  of miR-429 transfected with mir-NC + pcDNA-NC, mir-429 mimics + pcDNA-NC, mir-NC
  + pcDNA-NOG and mir-429 mimics + pcDNA-NOG in irradiated BMSCs; (b,c) Protein expression
  of NOG in irradiated BMSCs transfected with mir-NC + pcDNA-NC, mir-429 mimics +
  pcDNA-NC, mir-NC + pcDNA-NOG and mir-429 mimics + pcDNA-NOG; (d,e) Assessment of
  osteogenic differentiation via ARS staining and quantitative analysis in irradiated
  BMSCs following transfection and 21-day induction; (f,g) Measurement and quantitative
  analysis of total ROS levels in irradiated BMSCs from various transfection groups
  using the DCFH-DA fluorescent probe; (h) Measurement and quantitative analysis of
  total reactive oxygen species (ROS) levels in irradiated bone marrow-derived mesenchymal
  stem cells (BMSCs) from various transfection groups using the DCFH-DA fluorescent
  probe. (i) Measurement of SOD levels in irradiated BMSCs. n = 3 (*) p <0.05; (**)
  p < 0.01; (***) p < 0.001, and (****) p < 0.0001
