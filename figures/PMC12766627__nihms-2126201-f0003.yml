figure_title: Expression of genes associated with NF-κb and interferon pathways are
  elevated in central memory CD4 T cells in the PLNs of T1D
caption: (A-B) Bar plot demonstrating the number of differentially expressed genes
  for pseudo-bulk analysis in each cell type between T1D vs HD, T1D vs AAb+, and AAb+
  vs HD in PLNs (A) and spleen (B). (C) Heatmap representing the gene expression of
  differentially expressed genes between T1D and HD in central memory CD4 TCM in PLNs.
  (D-E) Pre-ranked gene set enrichment analysis (GSEA) results in the PLNs (D) and
  the spleens (E). (F) GSEA plot depicting the enrichment of TNF, NF-κb, and interferon
  signaling in CD4 TCM of the PLNs but not the spleens. (G) Heatmap showing the gene
  expression of the leading-edge genes for the NF-κb pathway extracted from GSEA output
  in PLNs
