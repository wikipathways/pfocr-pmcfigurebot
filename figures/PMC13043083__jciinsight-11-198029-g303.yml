figure_title: Signaling pathway analysis contrasting circulating T cells (donor origin)
  at tolerant state with T cells from the donor graft
caption: (A) Ingenuity Pathway Analysis (IPA) comparing tolerant T cells (Tol T; 99.8%
  donor origin) collected 2 years after BMT with bone marrow graft T (gT) cells collected
  before BMT, which possessed potential alloreactivity. Both cell populations were
  stimulated in vitro with hDCs for 7 days. (B) Heatmap comparison of signaling pathways
  between tolerant T cells (Tol T; left column) and graft T (gT) cells (right column)
  without in vitro stimulation. Each box represents a signaling pathway that is either
  activated (positive z score, light yellow for most positive) or inhibited (negative
  z score, dark blue for most negative). Pathways are listed on the y axis, and the
  color scale bar is shown on the right side of the heatmap
article_title: Durable hematopoiesis and tolerance after vertebral bone marrow transplant
  from a deceased lung transplant donor
