caption: 'EE modulates the non-canonical mitophagy pathway via regulation of H2S production.
  (A,C) Representative double immunofluorescence images showing co-localization of
  HIF-1α and NeuN in brain tissue sections, and quantitative analysis of mean HIF-1α
  fluorescence intensity; scale bar: 50 μm (n = 6). (B,D) Representative double immunofluorescence
  images showing co-localization of LC3B and NeuN, along with quantitative analysis
  of LC3B expression; scale bar: 50 μm (n = 6). (E) Western blot image of mitophagy-related
  proteins in peri-infarct tissues. (F–H) Quantitative analysis of HIF-1α, BNIP3L,
  and the LC3B-II/LC3B-I ratio, respectively (n = 6). All data are presented as mean
  ± standard deviation (SD). One-way ANOVA followed by Tukey’s post hoc test was used
  for multiple group comparisons. * p < 0.05, ** p < 0.01, *** p < 0.001, **** p <
  0.0001'
