figure_title: The downstream pathways of synthetic PACs.
caption: 'The downstream pathways of synthetic PACs. (a) Biosynthetic pathways and
  enzymes for the heterologous production of PACs. The enzymes involved in the pathways
  include PT, phenylalanine ammonialyase (PAL), tyrosine ammonialyase (TAL), 4-coumarate-CoA
  ligase (4CL), chalcone synthase (CHS), chalcone isomerase (CHI), flavanone 3-hydroxylase
  (F3H), flavonol synthase (FLS), 4’-O-methyltransferase (OMT4), 6’-Omethyltransferase
  (OMT1), stilbene synthase (STS), aromatic amino acid transaminase (AAA-AT), 4-hydroxyphenylpyruvate
  dioxygenase (HPPD), tocopherol cyclase (TC), p-coumaroyl-CoA 2’-hydroxylase (C2’H),
  feruloyl-CoA 6’-hydroxylase (F6’H), marmesin synthase (MS), CS, isochorismate synthase
  (MenF), 2-succinyl-5-enolpyruvyl6-hydroxy-3-cyclohexene-1-carboxylate synthase (MenD),
  demethylmenaquinone methyltransferase (MenH), O-succinylbenzoate synthase (MenC),
  O-succinylbenzoate-CoA ligase (MenE), 1,4-dihydroxy-2-naphthoyl-CoA synthase (MenB),
  1,4-dihydroxy-2-naphthoyl-CoA hydrolase (MenI), demethylmenaquinone methyltransferase
  (MenG). MGGBQ: 2-methyl-6-geranylgeranyl benzoquinol; SEPHCHC: 2-Succinyl-5-enolpyruvyl-6-hydroxy-3-cyclohexene-1-carboxylate;
  SHCHC: (1R,6R)-2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate. (b) Example
  of a prenylation reaction: biosynthesis of 8-prenylnaringenin from DMAPP and naringenin
  catalyzed by prenyltransferase SfN8DT-1'
