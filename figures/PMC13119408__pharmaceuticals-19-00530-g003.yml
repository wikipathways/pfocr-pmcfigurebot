figure_title: QPD and GQD differentially modulate serum metabolomic profiles in T2DM
  mice.
caption: 'QPD and GQD differentially modulate serum metabolomic profiles in T2DM mice.
  (A) Orthogonal partial least squares discriminant analysis (OPLS-DA) score plot
  showing distinct metabolic clustering among Mod, GQD, and QPD groups. (B–D) Volcano
  plots of differential metabolites in GQD vs. Mod, QPD vs. Mod and GQD vs. QPD. (E)
  Heatmap showing the relative abundances of key differential metabolites across groups.
  (F) Quantitative analysis of key differential metabolites in each group. (G) KEGG
  pathway enrichment analysis of differential metabolites in GQD vs. Mod, QPD vs.
  Mod and GQD vs. QPD. Data are presented as mean ± SEM. Panel (F): Statistical analysis
  was performed using one-way ANOVA followed by Tukey’s multiple comparisons test
  to evaluate differences among all groups. * p < 0.05, ** p < 0.01 vs. Mod; ns indicates
  not significant. Each triangle=one mouse. Panels (B–D) (Volcano plots): Differential
  metabolites were identified using Student’s t-test with FDR correction (Benjamini–Hochberg
  method) for multiple comparisons between groups. OPLS-DA (Panel (A)) was conducted
  using ropls package'
