figure_title: Mechanism of Action of Ipatasertib—PI3K/AKT Signaling Pathway.
caption: Mechanism of Action of Ipatasertib—PI3K/AKT Signaling Pathway. Many cancers
  display dysregulation of the PI3K (phosphatidylinositol 3-kinase)/AKT (also known
  as PKB, protein kinase B) pathway, which governs essential cellular processes such
  as metabolism, cell-cycle progression, survival, proliferation, motility, and differentiation.
  Activation of the PI3K/AKT cascade begins with stimulation of a Receptor Tyrosine
  Kinase (RTK). When ligands bind to the extracellular domain of the RTK (1), two
  receptor monomers come together to form a dimer (2). Dimerization activates the
  intracellular tyrosine kinase domains (TKDs), enabling each monomer to phosphorylate
  multiple tyrosine residues on its partner (3). These phosphotyrosines act as docking
  sites for downstream signaling proteins, ultimately leading to PI3K phosphorylation
  and activation (4). Activated PI3K converts PIP2 to PIP3 (5), which facilitates
  the recruitment and activation (6) of AKT. As the central effector of the pathway,
  activated AKT regulates numerous cellular functions (7). The pathway is negatively
  regulated by the tumor suppressor PTEN (8), which dephosphorylates PIP3 and restrains
  PI3K signaling. Mutations or alterations in PTEN, PI3K, or AKT—commonly found in
  various cancers—result in persistent AKT hyperactivation and uncontrolled cell growth.
  Ipatasertib exerts its activity by binding to the ATP-binding pocket of AKT (9),
  thereby inhibiting its activation and preventing downstream signaling. Through this
  mechanism, ipatasertib suppresses cellular proliferation and survival
