figure_title: Interconnected cycle of nutrient overload, redox imbalance, and insulin
  resistance in the pathogenesis of metabolic disease and type 2 diabetes mellitus.
caption: Interconnected cycle of nutrient overload, redox imbalance, and insulin resistance
  in the pathogenesis of metabolic disease and type 2 diabetes mellitus. Lifestyle
  choices and genetic factors lead to persistent nutrient overload, overwhelming metabolic
  processes and leading to mitochondrial dysfunction and excessive ROS production.
  Supraphysiologic ROS levels activate inflammatory pathways through myokine/cytokine
  release and activation of transcription factors. This inflammatory response and
  damaging ROS molecules lead to an increase in misfolded proteins causing endoplasmic
  reticulum stress and further shifts in redox balance compounding oxidative distress.
  This activates stress pathways like JNK and inhibits impairs insulin signaling,
  reducing the ability of skeletal muscle to maintain nutrient homeostasis, further
  driving nutrient overload. Solid arrows depict the self-reinforcing cycle, while
  the dashed arrow indicated external factors that contribute to its initiation and
  amplification
