figure_title: Dysregulation of the circadian rhythm pathway and core gene expression
  in Notch4-knockout mice under O3 exposure.
caption: Dysregulation of the circadian rhythm pathway and core gene expression in
  Notch4-knockout mice under O3 exposure. (A) GSEA of circadian rhythm pathway (KO04710)
  inNotch4−/− (N4KO) vs. wild-type (WT) mice under filtered air (FA) (N4KO_FA vs.
  WT_FA, n = 6). (B) GSEA of KO04710 pathway in N4KO vs. WT mice after 6 h O3 exposure
  (N4KO_ozone_6h vs. WT_ozone_6h, n = 6). (C) GSEA of KO04710 pathway in N4KO vs.
  WT mice after 24 h O3 exposure (N4KO_ozone_24h vs. WT_ozone_24h, n = 6). (D) GSEA
  of KO04710 pathway in N4KO vs. WT mice after 48 h O3 exposure (N4KO_ozone_48h vs.
  WT_ozone_48h, n = 6). (E) Box plots of circadian regulator expression in N4KO_FA
  vs. WT_FA (* indicates p < 0.05, n = 6). (F) Box plots of circadian gene expression
  at 6 h O3 exposure (N4KO_ozone_6h vs. WT_ozone_6h; * indicates p < 0.05, n = 6).
  (G) Box plots of circadian gene expression at 24 h O3 exposure (N4KO_ozone_24h vs.
  WT_ozone_24h; * indicates p < 0.05, n = 6). (H) Box plots of circadian gene expression
  at 48 h O3 exposure (N4KO_ozone_48h vs. WT_ozone_48h; * indicates p < 0.05, n =
  6)
