figure_title: Clinical relevance and a model of the synergistic hepatotoxic effects
  of chronic PFOS exposure
caption: (A-D) Transcriptomic analysis of human liver spheroids treated with PFOS
  for bile secretion genes (A, B), cell cycle transcripts (C), and senescence pathway
  genes (D). Graphic illustrating a working model of previously unrecognized toxicities
  associated with chronic occupational PFOS exposure (E). Data from this study establish
  chronic occupational levels of PFOS exposure as a driver of “black liver” pathology
  and hepatic aging. In this working model, PFOS-induced hepatic venous congestion
  leading to blood stasis in the liver contributes to the liver’s dark discoloration.
  Meanwhile, our data support cardiac injury by PFOS which could induce cardiopulmonary
  congestion (dashed arrows), contributing to hepatic venous congestion and the liver’s
  dark discoloration. Concurrently, intrahepatic vascular pressure causes cholestasis
  by impairing bile flow, which contributes to the greenish hue of the liver. Intrahepatic
  cholestasis in turn worsens congestion, intensifying liver injury. Hepatic pigmentation,
  characterized by melanin-like (M) and lipofuscin (L) deposits due to suppression
  of autophagy by sustained liver injury, adds a brown tone to the liver, and the
  combined effects produce the distinctive black liver phenotype. These stressors
  elevate ROS and hepatocellular injury (magenta arrows). Given the established effect
  of autophagy suppression on promoting cholestasis, pigmentation and liver aging
  due to lack of autophagic degradation of oxidative byproducts and other cellular
  wastes, suppression of autophagy by chronic occupational levels of PFOS exposure
  perpetuates cellular senescence, ultimately culminating in hepatic aging. Notably,
  the hepatotoxicity underlying the black liver pathology and hepatic aging appear
  to reinforce one another, establishing a vicious cycle of persistent liver injury,
  atrophy, and degeneration. (For interpretation of the references to colour in this
  figure legend, the reader is referred to the web version of this article.)
article_title: 'PFOS-induced black liver and hepatic aging in mice: A new paradigm
  in environmental hepatotoxicology'
