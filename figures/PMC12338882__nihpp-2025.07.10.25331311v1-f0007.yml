figure_title: Coexpression gene networks associated with BDNF-DT, BDNF-AS-DT, BDNF-AS,
  and BDNF, in human DLPFC
caption: A-C) RRHO2 heatmaps showing concordant (bottom-left and top-right quadrant
  in each panel, highlighted in a red frame) and discordant (top-left and bottom-right
  quadrant in each panel, highlighted in a green frame) association of BDNF-DT coexpression
  network (x-axis, A-C) with coexpression network of BDNF (y-axis, A), BDNF-AS (y-axis,
  B), BDNF-AS-DT (y-axis, C). Color bars represent negative logarithm of p value of
  the overlap from the hypergeometric test. BDNF-DT show a concordant pattern of association
  with gene expression compared with BDNF (A), and discordant pattern of association
  compared with BDNF-AS (B), and BDNF-AS-DT (C). D) Ingenuity Pathway Analysis summary
  graph with subcellular localization of the activators (orange) and inhibitors (blue)
  upstream regulators of the BDNF-DT gene coexpression network, and visualization
  of their effect on pathways predicted to be activated (orange) and inhibited (blue)
  in presence of the gene expression changes associated with the BDNF-DT gene coexpression
  network. Legend in the red box
