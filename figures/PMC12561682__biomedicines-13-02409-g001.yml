figure_title: Transition from binary screening to AI-augmented diagnostics.
caption: Transition from binary screening to AI-augmented diagnostics. Biological
  samples containing cancer-associated volatile organic compounds (VOCs)—for example,
  urine, breath, or sweat—can elicit measurable behavioral responses in living biosensors.
  Pathway 1 (validated screening) relies on established low-dimensional metrics, such
  as the C. elegans Chemotaxis Index, to generate a binary output optimized for high-throughput
  population screening [8,10]. In contrast, Pathway 2 (AI-augmented diagnostics) treats
  raw behavioral data as a high-dimensional behavioral vector, B(t), analyzed with
  advanced machine learning models (e.g., convolutional neural networks [CNNs], recurrent
  neural networks [RNNs], Transformers). This richer representation enables not only
  cancer detection but also finer-grained tasks such as subtype discrimination, staging,
  and therapeutic monitoring [11,12]
