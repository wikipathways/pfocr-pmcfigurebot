caption: Scatter plot displaying the top 30 significantly enriched KEGG pathways identified
  among differentially expressed genes (DEGs). (A) KEGG enrichment analysis of DEGs
  in roots (control vs. 1 µM IAA). (B) KEGG enrichment analysis of DEGs in leaves
  (control vs. 50 µM IAA). (C) KEGG enrichment analysis of DEGs in roots (control
  vs. 50 µM IAA). The rich factor represents the ratio of the number of DEGs annotated
  in a given pathway to the total number of genes annotated in that pathway. Dot color
  corresponds to the −log10 (Q value), and dot size indicates the number of DEGs annotated
  to each pathway
