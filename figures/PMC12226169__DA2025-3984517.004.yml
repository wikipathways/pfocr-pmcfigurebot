figure_title: Bioinformatics Analysis Results.
caption: Bioinformatics Analysis Results. (A) GO analysis for mediating-effect proteins
  on air pollutants and depression. This figure showcases the GO analysis results,
  where the color of each point represents the adjusted p-value (p adjust), indicating
  the level of significance. The color gradient ranges from 0 to 0.05. The size of
  each point (size = Count) represents the number of genes associated with each GO
  term, reflecting the frequency of appearance. The horizontal axis indicates the
  fold enrichment associated with depression. The vertical axis shows the three GO
  ontologies - biological process (BP), molecular function (MF), and cellular component
  (CC), with the top 10 terms displayed for each. (B) GO analysis for mediating-effect
  proteins on air pollutants and anxiety. Similar to Figure 4A, this figure presents
  the GO analysis results for mediating-effect proteins related to anxiety. (C) KEGG
  enrichment analysis for mediating-effect proteins on air pollutants and depression.
  This figure displays the KEGG pathway enrichment analysis, where the horizontal
  axis (count) represents the number of genes associated with each KEGG pathway, and
  the vertical axis shows specific enriched KEGG pathways in the gene list. The color
  gradient of the bars indicates the adjusted p-value (p adjust), reflecting the significance
  level of each pathway. (D) Protein–protein interaction (PPI) network for mediating-effect
  proteins on air pollutants and depression. (E) Protein–protein interaction (PPI)
  network for mediating-effect proteins on air pollutants and anxiety
