figure_title: Adaptive and maladaptive roles of TGF-β signaling in thoracic aortic
  aneurysm
caption: Inhibition of TGF-β in VSMCs results in loss of integrinmediated connections
  between these cells and elastic lamellae. This loss triggers downregulation of negative
  modulators of the TGF-β pathway and upregulation of TGFβ ligands, resulting in secondary
  signaling upregulation through residual functional branches. Secondary TGF-β signaling
  upregulation has both adaptive and maladaptive consequences. It can increase aortic
  wall strength through increased ECM deposition and by promoting VSMC-ECM adhesion.
  TGF-β signaling also inhibits the expression of positive effectors of AT1R signaling,
  while upregulating expression of inhibitors of the pathway, including Rgs5 and Rgs4.
  Pharmacological or genetic inhibition of AT1R obviates the need for this protective
  effect; it also results in indirect suppression of maladaptive responses activated
  by TGF-β signaling. Maladaptive effects of excess/prolonged TGF-β signaling can
  lead to detrimental accumulation of glycosaminoglycans and proteoglycan, upregulation
  of proteolytic enzymes, release of reactive oxygen species (ROS), and acquisition
  of a senescence-associated secretory phenotype (SASP). Some of these detrimental
  effects may depend on TGF-β-driven accumulation of fibronectin, which can drive
  and excess AKT/mTOR and/or NF-kB signaling through engagement with integrin αVβ3
  and α5β1
