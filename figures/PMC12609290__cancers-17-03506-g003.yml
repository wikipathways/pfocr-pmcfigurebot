figure_title: Post-translational modifications drive pancreatic cancer progression
  and immune evasion.
caption: 'Post-translational modifications drive pancreatic cancer progression and
  immune evasion. (a) PTMs in tumor development and signaling. Activated key PTM pathways
  in PDAC cells lead to cancer growth: glycosylation (e.g., by ST6GAL1) of receptors
  like EGFR promotes invasion; O-GlcNAcylation by OGT stabilizes oncoproteins such
  as β-catenin to drive proliferation; and kinase-mediated phosphorylation (e.g.,
  MAPK/ERK) drives uncontrolled growth. (b) PTMs in avoiding the immune system. PTMs
  change the surface of tumor cells to make them less immune: Sialylated mucins (MUC1/MUC16)
  bind to inhibitory Siglec receptors on T and NK cells. O-GlcNAcylation and glycosylation
  stabilize the PD-L1 checkpoint protein, which stops T cells from entering'
article_title: 'Antigenic Dark Matter: Unexplored Post-Translational Modifications
  of Tumor-Associated and Tumor-Specific Antigens in Pancreatic Cancer'
