caption: 'APOE4 mice on control diet exhibit reduced cortical levels of TCA cycle
  intermediates and metabolites. (A) Rescaled mean cortical levels of TCA cycle metabolites:
  Citrate (Cit), aconitate (Acon), isocitrate (Iso), alpha-ketoglutarate (A-Keto),
  succinylcarnitine (SucC), succinate (Suc), fumarate (Fum), malate (Mal), and pyruvate
  (Pyr). (B) Rescaled mean levels of alanine/aspartate pathway metabolites: alanine
  (Ala), aspartate (Asp), asparagine (Asn), and N-acetylaspartate (NAA). (C) Mean
  levels of glutamate-related metabolites: Glutamate (Glu), glutamine (Gln), N-acetylaspartylglutamate
  (NAAG), γ-aminobutyric acid (GABA), reduced glutathione (GSH), and oxidized glutathione
  (GSSG). *p < 0.05, **p < 0.01. Sample sizes: E3-Ctrl (n = 14) and E4-Ctrl (n = 15)'
