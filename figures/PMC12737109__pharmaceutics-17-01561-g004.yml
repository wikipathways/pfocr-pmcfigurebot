caption: Main molecular pathways targeted by clinical trials in paediatric brain tumours.
  (A) Diagram of the CDK4/6–RB pathway, showing its role in cell cycle progression,
  common mechanisms of deregulation in paediatric brain tumours (in red), and the
  points of inhibition by the CDK4/6 inhibitors Abemaciclib, Palbociclib, and Ribociclib.
  (B) Diagram of the PI3K/AKT/mTOR pathway, illustrating upstream and downstream signalling
  components, frequent alterations observed in paediatric brain tumours (in red),
  and the sites of action of main mTOR inhibitors used in analysed clinical trials.
  (C) Diagram of the MAPK/ERK signalling cascade, highlighting activation via growth
  factor receptors, recurrent aberrations in paediatric brain tumours (in red), and
  the inhibition points targeted by MEK and BRAF inhibitors
