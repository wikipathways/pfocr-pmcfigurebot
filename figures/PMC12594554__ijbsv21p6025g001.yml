figure_title: PI3K/Akt/mTOR pathway dysregulation by the IR/MASH oncogenic microenvironment
  fuels HCC metabolic reprogramming.
caption: PI3K/Akt/mTOR pathway dysregulation by the IR/MASH oncogenic microenvironment
  fuels HCC metabolic reprogramming. In hepatocellular carcinoma (HCC) cells, the
  insulin resistance (IR) and Metabolic Dysfunction-Associated Steatohepatitis (MASH)
  microenvironment—characterized by hyperinsulinemia, inflammatory cytokines (TNF-α,
  IL-6), saturated fatty acids (SFAs), and reactive oxygen species (ROS)—dysregulates
  PI3K/Akt/mTOR signaling. This occurs via mechanisms including impaired IRS signaling
  and ROS-mediated PTEN inactivation. These events promote hyperactivation of Akt
  (by PDK1 and mTORC2) and subsequently mTORC1. Activated mTORC1 drives metabolic
  reprogramming towards enhanced glycolysis (via HIF-1α) and de novo lipogenesis (via
  SREBP1c), fueling HCC progression and shaping the tumor microenvironment. Phosphorylation
  is denoted by (P)
