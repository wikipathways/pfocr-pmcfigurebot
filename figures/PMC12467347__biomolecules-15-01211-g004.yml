figure_title: Effects of oleuropein on the TGF-β1/Smad pathway in fibroblasts.
caption: 'Effects of oleuropein on the TGF-β1/Smad pathway in fibroblasts. NIH-3T3
  (A) and MLg (B) cells were exposed to oleuropein for 12 h and then treated with
  TGF-β1 (5 ng/mL) for 0.5 h before samples were collected for Western blot analysis
  to evaluate the protein expression levels of P-Smad2, Smad2, P-Smad3, Smad3 (original
  images can be found in Figure S1). The data are presented as Mean ± SD (one-way
  ANOVA with Tukey’s post hoc multiple comparison tests), n = 3. # indicates differences
  between the control group and the TGF-β1 group, with # p < 0.05, ## p < 0.01, and
  #### p < 0.0001. * indicates differences between the TGF-β1 group and the oleuropein
  treatment groups, with * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001'
