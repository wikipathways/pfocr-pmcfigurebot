figure_title: The molecular pathways of the activation of TAAR1 at a DA synapse.
caption: 'The molecular pathways of the activation of TAAR1 at a DA synapse. Endogenous
  TAs activate TAAR1, resulting in AC activation and downstream stimulation of PKA/PKC.
  In the postsynaptic domain, TAAR1 counteracts the normal effects of D2R activation.
  TAAR1 signals via a G protein-independent, βArr2 pathway involving the protein kinase
  B (AKT)/ GSK-3β signalling cascade. Heterodimerization of TAAR1 prevents βArr2 recruitment
  and blocks GSK3β activity [52, 53]. Furthermore, TAAR1 activates G protein-coupled
  inwardly rectifying potassium channels, leading to an outwards K current [29, 44].
  The figure was adapted from Halff et al. [49] and generated using BioRender (Agreement
  number: UF27UVYSDL). AC, adenylyl cyclase; TAAR1, trace amine-associated receptor
  1; TAs, trace amines; PKA, protein kinase A; PKC, protein kinase C; βArr2, β-arrestin2-dependent;
  GSK-3, glycogen synthase kinase 3; VMAT2, vesicular monoamine transporter 2'
