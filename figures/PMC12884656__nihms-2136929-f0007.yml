figure_title: Levels of hippuric acid correlate with disease severity and increased
  mortality in patients with sepsis
caption: '(A and B) RT-PCR of cytokines (IL-6, IL-1β, TNF-α, and IL-10), and cholesterol
  synthesis genes (HMGCS1, SREBF2, and SQLE) in human monocyte-derived macrophages
  (HMDMs) pre-treated with hippuric acid (100 μM) for 1 h and then stimulated with
  LPS (100 ng/mL)+IFNγ (100 ng/mL) for 8 h. n = 3–4. p values were determined by two-tailed
  Student’s t tests. Data are presented as the means ± SD.(C) ELISA of IL-6 and IL-10
  in HMDMs treated as in (A). n = 4. p values were determined by two-way ANOVA with
  post hoc multiple comparisons. Data are presented as the means ± SD.(D and E) Box-and-whisker
  plot for relative abundance of hippuric acid and benzoic acid in survivors versus
  non-survivors of patients with (D) B. pseudomallei and (E) S. aureus infection.
  p values were determined by a Mann-Whitney nonparametric test for comparisons of
  relative abundance values between survivor versus non-survivor patients.(F) Comparison
  of plasma levels of hippuric acid and metabolites within benzoic metabolism pathway
  in patients with early sepsis (n = 197) ranked by PLS-DA VIP score. Metabolite comparisons
  include group 1 (high mortality group) relative to all other patients and association
  with severity of illness (SAPS II score). The SAPS II p value is for Pearson’s correlation
  after adjustment for multiple comparisons.FC, fold change; SAPS, simplified acute
  physiology score; PLS-DA VIP, partial least squares discriminant analysis variable
  importance in projection. Significance is indicated as follows: *p < 0.05, **p <
  0.01, ***p < 0.001, ****p < 0.0001, and ns, no significant difference'
article_title: Aromatic microbial metabolite hippuric acid enhances inflammatory responses
  in macrophages via TLR-MyD88 signaling and lipid remodeling
