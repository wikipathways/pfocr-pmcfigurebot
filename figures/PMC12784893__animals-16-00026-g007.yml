caption: The Awareness Depth Gap Framework illustrates how surface-level awareness
  in AAW fails to progress into deeper conceptual understanding or applied competence
  without structured, experiential, and reflective learning processes. The broader
  learning and institutional environment (blue) shows critical learning states indicated
  by the arrows, contrasting surface-level awareness and deep-level understanding
  (red). The persistent but bridgeable gap between surface level awareness and meaningful
  understanding is highlighted by the dashed pathway (grey)
