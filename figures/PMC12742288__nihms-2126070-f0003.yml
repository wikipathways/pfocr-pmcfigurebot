figure_title: mTORC1 inhibition induces apoptosis in PAM pathway-mutated EC cells.
caption: 'mTORC1 inhibition induces apoptosis in PAM pathway-mutated EC cells. (A)
  RMC-6272-induced cell death in EC cell lines with PAM pathway mutation, but not
  in the PAM-wildtype KLE cells; (B) RMC-6272-induced cell death was partially inhibited
  by apoptosis inhibitor Z-VAD-FMK at 54 h; (C) RMC-6272 upregulated cleavage of caspase
  3 and PARP1 at 48 h post-treatment, and the cleavage was inhibited by Bcl-xL overexpression;
  (D) RMC-6272-induced cell death was inhibited by Bcl-xL overexpression. RMC-6272,
  1 nM; Lip-1, 2 μM; IM-54, 10 μM; Z-VAD-FMK, 20 μM; Nec-1, 20 μM. Data are presented
  as mean ± SD, n = 3 (A, B, D) biologically independent samples. Statistical analysis
  was performed using two-way ANOVA (B). mTORC1: mechanistic target of rapamycin complex
  1; EC: endometrial cancer; PAM: PI3K-Akt-mTOR; ANOVA: analysis of variance'
