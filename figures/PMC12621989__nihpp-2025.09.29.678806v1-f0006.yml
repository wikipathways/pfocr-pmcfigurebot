figure_title: Lifespan trajectories reveal dynamic reversals in the direction of hemispheric
  asymmetry
caption: Each cell indicates a “lateralization reversal,” where the population-median
  LI for a given tract-feature combination crosses the zero line. Red cells indicate
  a transition from leftward to rightward asymmetry (negative to positive LI), while
  blue cells indicate a transition from rightward to leftward (positive to negative
  LI). The overlaid numbers represent the age (in years) at which this reversal occurs.
  The results demonstrate that while reversals are sparse, they occur across all major
  pathway types and at various life stages
