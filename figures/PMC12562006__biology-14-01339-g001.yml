figure_title: Functional annotation based on the KEGG, GO, KOG, and NOG databases.
caption: 'Functional annotation based on the KEGG, GO, KOG, and NOG databases. (A)
  The Kyoto Encyclopedia of Genes and Genomes (KEGG) database divides biological pathways
  into eight main categories, each of which comprises several subcategories; (B) The
  Gene Ontology (GO) database is divided into three main parts: cellular component,
  molecular function, and biological process; (C) KOG is a protein database created
  and maintained by NCBI. The database is based on the evolutionary relationships
  of protein systems among bacteria, algae, and eukaryotes. (D) Non-supervised Orthologous
  Groups (NOG) database. Annotations for functional description and functional classification
  of direct homologous groups'
