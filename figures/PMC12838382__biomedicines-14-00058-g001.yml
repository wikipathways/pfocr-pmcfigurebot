figure_title: Microglial activation pathway.
caption: Microglial activation pathway. Microglia respond to nerve injury and peripheral
  inflammation through activation of receptors such as P2X4/P2X7 and TLR4, which detect
  ATP and DAMPs. These signals trigger intracellular pathways including p38 MAPK,
  NF-κB, ERK, and the NLRP3 inflammasome, leading to the release of inflammatory mediators
  (IL-1β, TNF-α, IL-6), BDNF, and ROS. These effectors drive neuronal hyperexcitability
  through NMDA receptor phosphorylation, reduced GABAergic inhibition, and KCC2 dysregulation,
  promoting central sensitization and chronic pain
