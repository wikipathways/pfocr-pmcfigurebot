figure_title: Multiple visual pathways convey information from the eyes to the cortex.
caption: Multiple visual pathways convey information from the eyes to the cortex.
  This schematic diagram illustrates four major routes of information transfer in
  the primate visual system. First, the black arrows denote the main image-forming
  pathway, which involves primarily magnocellular and parvocellular retinal ganglion
  cells synapsing onto first-order thalamic relay cells in the dorsal lateral geniculate
  nucleus (LGN), which then synapse in different layers of V1. V1 neurons then send
  processed information via projections to both dorsal and ventral stream extrastriate
  areas. Second, a number of non-midget, non-parasol retinal ganglion cells project
  (mostly) to koniocellular layers of the LGN; these neurons then synapse directly
  in extrastriate cortical areas, including a well-described innervation of the middle
  temporal (MT) area of the dorsal stream (gray arrows). Third, a different set of
  retinal ganglion cells, as well as some of those already projecting to the LGN,
  send either a direct projection or branch to innervate superficial layers of the
  superior colliculus (SC); the SC then projects to several pulvinar (Pul) subnuclei,
  which in turn project to extrastriate visual cortical areas in both the dorsal and
  ventral streams (red arrows). Finally, the blue arrows denote the direct projection
  of a small set of retinal ganglion cells to the inferior pulvinar, which in turn
  is known to send a direct projection to MT. Dotted lines indicate connections that
  are weaker and/or less well characterized
