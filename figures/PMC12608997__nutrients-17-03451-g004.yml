figure_title: The mechanisms of resveratrol promote neuroprotective and regenerative
  effects.
caption: The mechanisms of resveratrol promote neuroprotective and regenerative effects.
  (1) RSV enhances the production of BDNF through SIRT1/miRNA144/CREB/BDNF and PKA/CREB/BDNF
  pathways. (2) RSV promotes DNA damage repair via the PARP1 pathway while mitigating
  the inhibitory effect of NAD+ depletion on SIRT1 activity. (3) cis-RSV facilitates
  PARP1-mediated DNA repair by binding to TyrRS and mimicking a “tyrosine-free” conformation,
  whereas trans-RSV inhibits the TyrRS/PARP1 function by simulating a “tyrosine-bound”
  conformation. (4) RSV promotes adult hippocampal neurogenesis through the Wnt/β-catenin
  and PI3K/AKT/GSK-3β/β-catenin signaling pathways. cAMP, cyclic adenosine monophosphate;
  PDE4, phosphodiesterase 4; 5′AMP, 5′-adenosine monophosphate; PKA, protein kinase
  A; CREB, cAMP response element-binding protein; BDNF, brain-derived neurotrophic
  factor; SIRT1, sirtuin 1; YY1, Yin Yang 1; RSV, resveratrol; AMPK, AMP-activated
  protein kinase; NAD+, nicotinamide adenine dinucleotide; PARP1, Poly(ADP-ribose)
  Polymerase 1; cis-RSV, cis-resveratrol; trans-RSV, trans-resveratrol; TyrRS, tyrosyl-tRNA
  synthetase; PI3K, phosphatidylinositol 3-kinase; AKT, protein kinase B; LRP, low-density
  lipoprotein receptor-related protein; GSK-3β, glycogen synthase kinase-3β
