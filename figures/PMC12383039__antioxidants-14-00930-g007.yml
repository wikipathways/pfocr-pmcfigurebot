figure_title: CIRBP attenuates DOX-induced ferroptosis in cardiomyocytes via the SLC7A11/GPX4
  pathway.
caption: CIRBP attenuates DOX-induced ferroptosis in cardiomyocytes via the SLC7A11/GPX4
  pathway. (A) Representative immunoblots of SLC7A11, GPX4, and CIRBP in control and
  DOX-treated H9c2 cells; GAPDH was the loading control. (B–D) Densitometric quantification
  of CIRBP, SLC7A11, and GPX4 protein abundance (n = 4 independent cultures). (E,F)
  RT–qPCR analysis of Slc7a11 (E) and Gpx4 (F) mRNA in non-target control (NTC), CIRBP-overexpression
  (CIRBP OE) and CIRBP-silenced (siCIRBP) cells under basal and DOX conditions (n
  = 6). (G) Immunofluorescence images showing nuclear DAPI (blue), cTnT (green) and
  CIRBP (red) in the indicated groups; scale bars = 20 μm. (H) Quantification of cytoplasmic
  CIRBP fluorescence intensity from panel G (n = 30 cells per group). (I) Immunofluorescence
  detection of SLC7A11 (red) together with cTnT (green) and DAPI (blue) in NTC, CIRBP
  OE, and siCIRBP cells ± DOX; scale bars = 20 μm. (J) Quantification of SLC7A11 fluorescence
  intensity from panel I (n = 30 cells per group). Data are expressed as mean ± SEM.
  Statistical significance was assessed by one-way ANOVA followed by Tukey’s post
  hoc test. ns, not significant, ** p < 0.01, *** p < 0.001, **** p < 0.0001; ns,
  not significant
