figure_title: PDGF-BB activates NLRP3 inflammasome via ROS-NF-kB pathway in cultured
  VSMCs
caption: 'VSMCs were treated with 30 ng/ml PDGF-BB for 24 hours without or with pre-treatment
  of ROS blocker DPI (2.5 μM) or NF-kB inhibitor BAY (2.5 μM) for 1 hour. (A-C) Representative
  immunoblots and summarized data show the effects of PDGF-BB on protein expression
  of NLRP3, pro-caspase-1 and cleaved-caspase-1 (p10). Original uncropped WB bands
  for Figure 1A were presented in Supplemental Figs. S1. (D-E) Representative immunofluorescence
  images and quantification data show the effects of PDGF-BB on caspase-1 activation
  using active caspase-1 probe FLICA (green). Nuclei were counter-stained with Hoechst
  (blue). (F-G) Representative immunoblots, and summarized data show the effects of
  ROS inhibitor DPI on PDGF-BB-induced NLRP3 expression. Original uncropped WB bands
  for Figure 1F were presented in Supplemental Figs. S2. (H-I) Representative immunoblots,
  and summarized data show the effects of NF-kB inhibitor BAY on PDGF-BB-induced NLRP3
  expression. Original uncropped WB bands for Figure 1H were presented in Supplemental
  Figs. S3. Scale bar=20 μm. Data are shown as fold-changes compared to the control
  group without PDGF-BB or inhibitor, which was set to 1. The Kruskal-Wallis’s test
  was used, followed by Dunn’s multiple comparisons test. The Mann-Whitney test was
  applied for detecting significant differences between two groups. * vs control group
  without PDGF-BB or inhibitor, # vs PDGF-BB, P< 0.05 (n=4)'
