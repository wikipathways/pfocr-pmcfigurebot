figure_title: Pathways and protein network.
caption: Pathways and protein network. (a) Analysis of enriched KEGG pathways of dysregulated
  fecal proteins related to breed. The node colors depict the enrichment significance
  (ranging from red = p-value < 0.05 to dark red = p-value < 0.005 and dark brown
  = p-value < 0.0005). (b) Interaction analysis of dysregulated fecal proteins. The
  circles represent the identified proteins; the edges represent protein–protein interactions
  (blue lines = known interactions from curated databases, pink lines = experimentally
  determined interactions). LYZ = lysozyme C, spleen isozyme, FTH1 = ferritin heavy
  chain, GAPDH = glyceraldehyde-3-phosphate dehydrogenase, TPI1 = triosephosphate
  isomerase, PRSS2 = anionic trypsin, PRSS1 = serine protease 1. Data shown were obtained
  from pooled samples (n = 13 per group)
