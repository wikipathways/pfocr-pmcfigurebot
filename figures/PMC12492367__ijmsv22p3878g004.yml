figure_title: Link between disorders of lipid metabolism and the pathogenesis of glaucoma.
caption: Link between disorders of lipid metabolism and the pathogenesis of glaucoma.
  Lipid metabolism disorders, with increased saturated fatty acids in the body, trigger
  endoplasmic reticulum stress (ERS), exacerbate mitochondrial dysfunction and reactive
  oxygen species production, activate the JNK/p38 MAPK pathway, and an imbalance in
  the Bax/Bcl-2 ratio, causing apoptosis of the retinal ganglion cells (RGC). Lipids
  also promote atherosclerosis and vascular endothelial cell damage, resulting in
  microcirculatory impairment of blood flow, reduced blood supply, and decreased blood
  supply to the optic nerve from the short posterior ciliary artery, leading to optic
  nerve atrophy. In addition, lipid disorders affect SREPB-1 expression, resulting
  in lipid deposition in the trabecular meshwork, causing lectin-like oxidized LDL
  receptor-1 (Lox-1) uptake of oxidized LDL, activation of the NF-kB signaling pathway,
  and elevated expression of IL-6 and TNF-α, resulting in inflammatory damage to the
  optic nerve. Lipid deposition in the trabecular meshwork also causes oxidative stress
  and remodeling of the trabecular meshwork extracellular matrix (ECM), resulting
  in trabecular meshwork cellular damage, increased resistance to outflow of aqueous
  humor, and impaired aqueous drainage, which ultimately leads to elevated intraocular
  pressure. The mechanisms of action, such as changes in intraocular pressure and
  optic nerve atrophy, are coordinated to promote glaucoma in the figure. Created
