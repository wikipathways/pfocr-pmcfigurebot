figure_title: 'TMA and Atherosclerosis: proposed mechanisms.'
caption: 'TMA and Atherosclerosis: proposed mechanisms. Gut microbiota, particularly
  Firmicutes, convert dietary precursors as L-carnitine, choline, and betaine into
  TMA via TMA lyase. TMA is absorbed into the bloodstream and transported to the liver,
  where it is oxidized by FMO3 into TMAO. Although 95% of TMAO is excreted by the
  kidneys, elevated circulating levels has been implicated in increased risk of ASCVD.
  TMAO contributes to plaque instability and rupture by enhancing platelet activation
  and upregulating TF and VCAM1, while simultaneously reducing NO bioavailability.
  In macrophages, TMAO promotes foam cell formation through the upregulation of CD36
  and SRA1, impairs RCT, and exacerbates inflammation via activation of MAPK, ERK,
  and NF-kB signaling pathways. Endothelial dysfunction is further driven by TMAO-induced
  oxidative stress. Additionally, TMAO has been linked to elevated blood pressure
  through activation of signaling pathways involving PERK, ROS, CaMKII, PLC β3, and
  intracellular Ca2+. BP: blood pressure, FMO3: flavin-containing monooxygenase 3,
  GLP-1: glucagon-like peptide-1, ERK: extracellular signal-regulated kinase, MAPK:
  mitogen-activated protein kinase, NO: nitric oxide, NF-κB: nuclear factor-κB, PERK:
  protein kinase R-like endoplasmic reticulum kinase, SR-A1: class A1 scavenger receptor,
  ROS/CaMKII/PLC β3/Ca2+: reactive oxygen species/calmodulin-dependent protein kinase
  II/phospholipase C β3/Ca2+, RCT: reverse cholesterol transport, TMA: trimethylamine,
  TMAO: trimethylamine N-oxide, TF: tissue factor, VCAM1: vascular cell adhesion molecule
  1. Note: Arrows indicate direction of change (↓ decrease; ↑ increase)'
