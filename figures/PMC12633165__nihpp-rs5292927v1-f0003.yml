figure_title: Lateral superior colliculus (lSuC) provides major excitatory inputs
  onto OPRM1+ RVMSC neurons and drives mechanical pain sensitization
caption: 'a, Schematic (upper panel) of chemogenetic silencing of the PAG→RVM pathway.
  Representative image shows vGlut2+ terminals (red) from PAG in the RVM. CLZ: clozapine.
  Scale Bar: 500 μm. b, Quantification of mechanical thresholds of saline (black)
  and CLZ (blue) infusion in the same group of hM4D expressing mice (n = 8). c, d,
  e, Experimental timeline (c), representative images (d), and quantification (e)
  of monosynaptic inputs onto OPRM1+ RVMSC neurons (n = 6). Scale Bar: 250 μm. Inset:
  mCherry+ neurons are concentrated in intermediate SuC (iSuC) and deep SuC (dSuC)
  but not superficial SuC (sSuC) at Bregma −3.64mm. PAG: periaqueductal gray; lSuC:
  lateral superior colliculus; MRN: midbrain reticular nucleus; ZI; zona incerta;
  HY: hypothalamus; APN: anterior pretectal nucleus; Po: posterior complex of thalamus;
  CTX: cortex; BNST: bed nucleus of the stria terminalis. f, Representative images
  (left) and quantification (right) of RNAscope staining of vGlut2 (green) and vGat
  (blue) in mCherry positive retrogradely labeled input neurons from lateral SuC (lSuC),
  PAG and Zona Incerta (ZI) (6 slides from 3 mice). Scale Bar: 50 μm. g, Quantification
  of mechanical thresholds of saline (black, n = 6) and CLZ (blue, n = 6) infusion
  into the RVM of vGlut2Cre mice with hM4D expressing in lSuC for chemogenetic silencing
  of the lSuC→RVM pathway. Wilcoxon matched-pairs signed rank test, * P < 0.05. h,
  Quantification of mechanical thresholds after repetitive daily RVM infusion of CLZ
  in non-injured vGlut2Cre mice with hM3D expressing in lSuC for chemogenetic activation
  of the lSuC→RVM pathway (n = 6). Clozapine was injected 23 hours before each von
  Frey test for 7 consecutive days (shade area). Dunn’s multiple comparisons test,
  * P < 0.05, ** P < 0.01. i, Quantification of time for paw licking and biting after
  formalin injection into the hindpaw. CLZ was locally infused into the RVM of vGlut2Cre
  mice with eGFP- (black, n = 5) and hM4D- (blue, n = 5) expressing in lSuC for chemogenetic
  silencing of the excitatory lSuC→RVM pathway. Mean ± SEM'
article_title: Deconstruction of a spino-brain-spinal cord circuit drives chronic
  mechanical pain
