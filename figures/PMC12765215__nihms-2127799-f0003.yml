figure_title: FPR1 expression in GBM suppresses necroptosis and is associated with
  worse prognosis
caption: 'a,b, Representative images (a) and analysis (b) of FPR1 protein levels in
  GBM cells from patients surviving less than 12 months or 12 months or more (n =
  18 patients). c, GBM FPR1 expression by time to recurrence in GBM scRNA-seq11 (n
  = 25 patients). d, Multivariate survival analysis of FPR1 signature in n = 141 individuals
  with GBM from the TCGA or GLASS (hazard ratio, 1.36 with 95% confidence interval
  (1.07–1.65); Cox proportional hazards model). e, Schematic of Fpr1 inactivation
  in GL261 cells. crRNA, CRISPR RNA. f, Kaplan–Meier plot of mice bearing GL261 harbouring
  Fpr1 or random control sequence gRNA (n = 9 mice each, log rank test). g,h, RNA-seq
  of GL261 cells after Fpr1 (sgFpr1) or control (sgRandom) inactivation 24 days after
  implantation, showing volcano plot (g) and pathway analysis (h) (n = 4 mice each).
  i, Violin plot of necroptosis and FPR signalling signatures in cells from individuals
  with GBM11,28. j, Published necroptosis-related prognostic GBM signature28 and necroptosis
  signalling signature (GOBP_M24779) applied to RNA-seq of GL261 after Fpr1 (sgFpr1)
  or control (sgRandom) inactivation. k, Necroptosis pathway schematic. l,m, Immunofluorescence
  microscopy (l) and quantification (m) of pMLKL in GL261 sgFpr1-implanted mice (n
  = 3 mice per group, two-sided unpaired t-test). n, Design of in vitro studies using
  primary human GBM isolates treated with ZVAD-FMK (Z), cycloheximide (C) and TNF
  (T) to induce necroptosis. o, pMLKL in one human GBM isolate after necroptosis induction
  with recombinant human ANXA1 and/or an FPR1-neutralizing antibody (one dot per well
  with n = 3 wells). p, Design of the necroptosis system using the GL261–RIPK3act
  model followed by in vivo activation by B/B homodimerizer (also known as AP20187)
  administration. q, Kaplan–Meier plot of GL261 cells expressing small-molecule-activatable
  RIPK3 (n = 20 mice each; log-rank test). r, Intratumoral GL261 GARC-1-specific CD8+
  T cells; P value calculated using an unpaired two-tailed t-test. Graphs in f,m,o,q
  and r represent one of three independent replicate experiments and P values were
  from two-sided unpaired t-tests in b,i,m,o and r. ****P < 0.0001, **P < 0.01, *P
  < 0.02. Data are mean ± s.e.m. in b,m,o and r. Scale bars: 25 μm (a) and 50 μm (l).
  Illustrations in n created in BioRender (Lee, J. https://BioRender.com/0bkvepw;
  2025)'
