figure_title: Tabular GhostBuster prioritization of intergenic GWAS gene hits in Parkinson’s
  disease
caption: 'Tabular GhostBuster was trained to recognize 130 genes in the “Parkinson’s
  disease” (PD) pathway, sourced from the Molecular Signatures Database (MSigDB);
  and 75 genes that were found as hits in genome-wide association studies (GWAS) on
  PD, sourced from the Phenotype-Genotype Integrator (PheGenI). The latter included
  genes that hosted an intragenic or near-genic GWAS hits, as well as “intergenic
  gene hits”, that is, genes that were the closest in the primary sequence to an intergenic
  GWAS hit. Training was performed utilizing the TCGA channel as its training inputs
  (cyan arrow). At the end of the training, only the 184 intergenic gene hits were
  selected: of these, the top 50 genes were utilized for plotting, based on the prioritization
  list generated by the model trained on MSigDB in the full dataset, and are depicted
  here. Because intergenic gene hits are known for including a 50–75% share of false
  positives, the aim of this plot is to identify which ones are the most likely true
  positives, based on their similarity to the mechanistically involved genes (MSigDB),
  or to the GWAS hit list as a whole (PheGenI).The left part of the table showcases
  the percentile ranks generated by training Tabular GhostBuster against the PD MSigDB
  gene list, based on the LINCS (blue), TCGA (cyan), STRING (green) and GO (yellow)
  channels; next, GhostBuster’s auxiliary PPI scores (red), GPT scores (pink); and
  the richness, average expression and PubMed scores (grey). A grey target icon on
  the left side of genes’ symbols indicates that a gene is only a GWAS intergenic
  hit, while a purple target icon indicates that it is both an intergenic and an intragenic
  GWAS hit. A crimson book icon is assigned for genes that are already known for playing
  a role in the phenotype of interest, either because they are target list members,
  top-rankers in the GO model (>99th percentile), top rankers in the PPI score (>99th
  percentile), or GPT-positive (GPT score > 5). Conversely, a green ghost icon indicates
  that the gene was not predicted by any of the literature-biased sources, namely,
  the gene is not involved (or is marginally involved) in our current understanding
  of PD; hence, it is potentially novel (ghost) for such phenotype.The right part
  of the table showcases the percentile ranks generated by training Tabular GhostBuster
  against the PD MSigDB list, and the corresponding PheGenI list. We define as “single
  hits” the genes that reach the 99th percentile in the MSigDB channel or in the PheGenI,
  whereas “dual hits” are the genes that achieve the 99th percentile in both channels
  at the same time.The 50 selected genes are sorted based on hierarchical clustering,
  performed on the MSigDB and PheGenI percentile ranks. The clustering tree is depicted
  on the right of the main table, and helps identify blocks of genes with a potentially
  similar biology'
article_title: 'GhostBuster: A Deep-Learning-based, Literature-Unbiased Gene Prioritization
  Tool for Gene Annotation Prediction'
