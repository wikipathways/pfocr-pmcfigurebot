figure_title: Sec10 suppresses RNA virus-induced type I IFN signaling pathway in passaged
  cells.
caption: Sec10 suppresses RNA virus-induced type I IFN signaling pathway in passaged
  cells. (A) Real-time PCR analysis of IFNB, ISG15, CXCL10 and CCL5 mRNA expression
  in Sec10-overexpressing HeLa cell lines (Sec10-HA) infected with SeV, A549 cell
  lines(Sec10-HA) infected with H1N1 and MDBK cell lines(Sec10-Flag) with BEFV infection
  for 12 h, or Sec10-overexpressing HeLa cell lines transfected with 5'ppp-dsRNA for
  8 h. 5'ppp-dsRNA control (5'ppp-Ctrl) is a 19 mer blunt-end dsRNA without a 5'triphosphate
  (InvivoGen, tlrl-3prnac). (B, C) Immunoblot analysis of the protein expression of
  ISG15 in Sec10-overexpressing HeLa cell lines infected with SeV for the indicated
  time points or transfected with 5'ppp-dsRNA for 8 h. (D) Real-time PCR analysis
  of IFNB, ISG15, CXCL10 and CCL5 mRNA expression in Sec10-specific siRNA (siSec10)
  or negative control siRNA (siNC) transfected HeLa cell lines infected with SeV,
  MDBK cell lines with BEFV infection and A549 cell lines infected with H1N1 for 12
  h, or Sec10 silencing HeLa cells transfected with 5'ppp-dsRNA for 8 h. (E, F) Immunoblot
  analysis of the protein expression of ISG15 in Sec10-specific siRNA (siSec10) or
  negative control siRNA (siNC) transfected HeLa cells infected with SeV for the indicated
  time points, and transfected with 5'ppp-dsRNA for 8 h. Data in (B, C, E and F) are
  representative one of three independent experiments. Data in (A and D) are presented
  as mean±S.D from three independent experiments, two-way ANOVA. Ns, not significant.
  *P<0.05, **P<0.01, and ***P<0.001
