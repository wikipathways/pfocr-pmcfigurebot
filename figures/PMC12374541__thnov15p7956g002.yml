figure_title: O-GlcNAcylation enhances YAP stability and nuclear translocation to
  promote YAP-driven VSMC proliferation/migration.
caption: O-GlcNAcylation enhances YAP stability and nuclear translocation to promote
  YAP-driven VSMC proliferation/migration. A) YAP mRNA expression in PMSMCs with or
  without PDGF-BB (n = 3). Data shown as mean ± SEM, ns, no significance (one-way
  ANOVA with Tukey's posttest). B) Immunoblotting and quantitative analysis (relative
  to Actin) of YAP in PMSMCs treated with cycloheximide (20 μM) and PDGF-BB for indicated
  times. C) Immunoblot analysis of O-GlcNAcylated YAP in PMASMCs treated with PDGF-BB
  using an O-GlcNAc-specific antibody (n = 3). D) Schematic representation of the
  glucose metabolic flow pathway. E) LC/MS analysis heat map of various metabolites
  in the intracellular glucose metabolic pathway after PDGF-BB treatment (n = 4).
  (F-K) PMSMCs treated with PDGF-BB (10 ng/mL) and DMSO (solvent), OSMI-1 (15 μM),
  or TMG (10 μM) for 24 h. F) Immunoblot analysis of YAP in cells treated with cycloheximide
  (20 μM) for indicated time. G) Immunoblot analysis of YAP in cells treated with
  MG132 (10 μM) for indicated time. H) SEM images of cell morphology and immunofluorescence
  images of YAP (green) and DAPI (blue) (n = 3). Scale bars, 50 μm (morphology) and
  10 μm (immunofluorescence). I) mRNA expression of the YAP downstream target gene
  representative of CYR61 (n = 3). **p < 0.01, ****p < 0.001 (one-way ANOVA with Tukey's
  posttest). J) Transwell Migration Assay image and the quantitative number of migrating
  cells indicated the migration ability of the cells (n = 3), and K) the cell counts
  indicated the proliferation of the cells (n = 3). **p < 0.01 (one-way ANOVA with
  Tukey's posttest)
