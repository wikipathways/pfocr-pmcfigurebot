caption: 'Conceptual diagram illustrates how distinct genetic risk factors for ASD
  and Schizophrenia converge mechanistically, resulting in a brain with disrupted
  plasticity. Genes associated with increased risk for ASD, including FMR1, MECP2,
  TSC1, TSC2, SCN2A and RELN, are shown on the left. Key genetic risk factors for
  Schizophrenia, including NRG1, DISC1, COMT and the 22q microdeletion, are shown
  on the right. Both groups of genetic factors are hypothesized to influence the developing
  of normal brain state. The model proposes that the primary pathological outcome
  is the disruption of fundamental mechanisms of synaptic plasticity: Long Term Potentiation
  (LTP), Long Term Depression (LTD) and Short-Term Synaptic Plasticity (STP). This
  disruption of synaptic function ultimately leads to the final, pathological state,
  characterized as a brain with disrupted plasticity, suggesting a shared final common
  pathway in the pathophysiology of these two major neurodevelopmental disorders.
  Created in BioRender. Kesidou, E. (2026) https://BioRender.com/8jga3o6 (Accessed
  on 3 September 2025)'
