figure_title: Example of LCM-based deep visual proteomics in a clinical context
caption: a, A workflow of the study described in ref. 17 with a selection of cohort
  of biospecimens, including skin lesions with toxic epidermal necrolysis (TEN) and
  control biospecimens (TEN-absent skin lesions). b, Probe staining (CD45 and Pan-CK).
  c, Digital imaging to mark the cell types of interest for laser capture microdissection
  (LCM). d, Artificial Intelligence (AI) software segmentation masks of cell types
  (orange) and automated LCM microdissection of cell types. A mass spectrometry (MS)
  analysis of LCM-procured cell types (keratinocytes and immune cells). e, A comparison
  of cell-type-specific biomarker by volcano plot for TEN versus healthy biospecimens
  f, Immunohistochemistry validation of active signal pathway localization (pSTAT1)
  within the epidermal detachment lesion. g, Representative images of phosphorylated
  STAT1 (pSTAT1) immunohistochemistry staining in formalin-fixed paraffin-embedded
  tissue sections across retrospective cohorts. Cutaneous adverse drug reactions range
  from from self-resolving maculopapular rash (MPR), to drug reaction with eosinophilia
  and systemic symptoms (DRESS), and TEN. Note peroxidase staining at the site of
  detachment (TEN). mIF, multiplex immunofluorescence. Panels b–g adapted from ref.
  17, Springer Nature Limited
