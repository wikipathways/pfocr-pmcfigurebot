figure_title: Disrupting ERK pathway activity impacts Torso activity, revealing negative
  feedback
caption: '(A) Removal of the scaffold protein Ksr inhibits ERK, preventing negative
  feedback on Torso without impacting Torso activation by Trunk ligand. (B) Images
  taken from a single control and ksr RNAi embryo expressing Torso::pYtag over NC11–14.
  Scale bar: 50 μm.(C) Quantification of Torso::pYtag intensity along the anterior-posterior
  axis in control and ksr RNAi embryos in NC14. Line shows mean ± SEM of n = 11 (control)
  and 10 (ksr) embryos.(D and E) Posterior domain amplitude (D) and posterior domain
  width (E) over time for each embryo quantified in (C). Mean ± SEM. Significance
  by twoway ANOVA with multiple comparisons test.(F) OptoSOS induction of Ras activity
  increases ERK activity and induces negative feedback on Torso. (G) Torso::pYtag
  at the anterior pole of NC13 in unilluminated (dark) and illuminated (+light) OptoSOS
  embryos. Bright circles are autofluorescent yolk. Scale bar: 20 μm.(H) Quantification
  of Torso::pYtag intensity at the anterior pole in each condition. Mean ± SEM. n
  = 9. Unpaired t test.For all graphs, significance was defined as **p < 0.01 and
  ****p < 0.0001. ns indicates no significance.See also Figure S5 and Video S2'
