figure_title: Pituitary Adenylate Cyclase-Activating Polypeptide (PACAP) receptor-mediated
  signaling pathways promoting neuroprotection.
caption: 'Pituitary Adenylate Cyclase-Activating Polypeptide (PACAP) receptor-mediated
  signaling pathways promoting neuroprotection. PACAP exerts neuroprotective effects
  through activation of its high-affinity receptor PAC1R (PACAP type I receptor) and
  low-affinity receptors: VPAC1R (vasoactive intestinal peptide receptor 1) and VPAC2R
  (vasoactive intestinal peptide receptor 2), which are coupled with G-proteins (Gαs
  and Gαq). Upon PACAP binding, these receptors activate adenylyl cyclase (AC), leading
  to cyclic adenosine monophosphate (cAMP) production and protein kinase A (PKA) activation.
  PKA phosphorylates downstream targets including MEK1/2 (mitogen-activated protein
  kinase kinase 1/2) and ERK1/2 (extracellular signal-regulated kinase 1/2), which
  translocate to the nucleus to regulate transcription of survival genes such as CREB
  (cAMP- response element-binding protein), JUN, cJUN (jun proto-oncogene), and NF-κB
  (nuclear factor kappa-light-chain-enhancer of activated B cells). In parallel, PACAP
  receptors also engage the PLC/IP3/PKC signaling cascade via Gαq. This includes phospholipase
  C (PLC) activation, generation of inositol 1,4,5-trisphosphate (IP3), and stimulation
  of protein kinase C (PKC), leading to calcium (Ca2+) release from the endoplasmic
  reticulum (ER). This calcium signaling supports activation of the phosphoinositide
  3-kinase/protein kinase B (PI3K/Akt) pathway, which is crucial for cell survival
  and growth. Additionally, epidermal growth factor receptor (EGFR) transactivation
  may amplify PLC-dependent signaling. Collectively, these pathways contribute to
  PACAP’s neuroprotective functions, including cell proliferation, differentiation,
  and resistance to apoptosis. Created in BioRender. Tomczak, J. (2025) https://BioRender.com/mt2mtgo'
