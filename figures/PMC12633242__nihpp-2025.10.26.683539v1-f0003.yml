figure_title: A-D Transcriptional response of host to microbe taxonomy.
caption: 'A-D Transcriptional response of host to microbe taxonomy. A Spearman correlation
  between microbial taxa (x axis) and expression levels of host genes (y axis). Value
  of Spearman correlation coefficient indicated by color (red=positive, white=0, blue=negative).
  Taxa/host gene only included if identified as significant (FDR < 10%) in lasso analysis
  (see Methods). Analysis applied separately to colonocytes responding to urban (left)
  and rural (right) microbiomes. x and y axes subjected to hierarchical clustering
  using the Euclidean distance metric. B. Microbes (y axis) with the greatest number
  of pairwise host gene–microbe associations in lasso analysis. Number of host gene–microbe
  associations depicted by darkness of shading; green and purple shading reflect effect
  in rural and urban microbiomes, respectively (x axis). C, D Associative clusters
  between groups of taxa and groups of host genes in urban (C) and rural (D) samples
  Left text indicates groups of microbe taxa identified by canonical correlation analysis
  as having associations with groups of host genes. We only show associative clusters
  with significant over-representation. Right text indicates significant (FDR < 10%,
  gene count ≥ 3) host gene pathways enriched in each associative cluster. Dot size
  represents gene ratio: the proportion of input host genes that are annotated in
  a term. Blue dots indicate positive associations, orange dots indicate negative
  associations. Unless indicated by an asterisk (Anaerobutyricum), all microbes in
  a cluster act in the same direction. E-H Transcriptional response of host to microbe
  functions. E Similar to A, but with microbial pathways on the x axis. F Similar
  to B, but with microbial pathways on the y axis. G, H Similar to C, D, but considering
  microbial pathways. Groups of microbial pathways (left) and significant associated
  host gene pathways as identified by overrepresentation analysis (right)'
