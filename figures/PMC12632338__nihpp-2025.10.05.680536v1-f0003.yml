figure_title: Matrix stiffening activates Notch to drive JNK-FOS signaling and endothelial
  senescence
caption: '(A) qRT-PCR analysis revealed significant upregulation of Notch1 receptor,
  ligands JAG1 and JAG2, and downstream target HEY1 under stiff conditions. Dll4 ligand
  gene expression remained unchanged upon matrix stiffening. N=3. (B) Matrix stiffening
  also induced MAPK8 (encoding JNK1), FOS, and JUN gene expression, key components
  of the JNK-AP-1 signaling axis, as measured by qRT-PCR. N=3. (C-F) Western blot
  analysis confirmed increased protein levels of cleaved-Notch1 (NICD), JAG1, and
  JAG2 in stiffened matrices. GAPDH was used as a protein loading control. N=3. (G-K)
  Matrix stiffening increased phosphorylation of JNK (p-JNK) in both cytoplasmic and
  nuclear fractions (N=4), while phosphorylation of cJUN (p-c-JUN) was elevated only
  in the cytoplasm (N=3). This suggest that nuclear p-c-JUN activation is independent
  of stiffness-mediated Notch signaling. GAPDH and PCNA were used as protein loading
  controls for cytoplasm and nucleus, respectively. (L) Treatment with nirogacestat
  (Niro), a γ-secretase inhibitor, reduced stiffness-induced expression of Notch1,
  MAPK8, FOS, CDKN1A, and CDKN2A (N=3), indicating that Notch signaling regulates
  JNK-FOS signaling and senescence-associated cell cycle arrest. (M-N) Immunofluorescence
  staining exhibited reduced p16 expression in nirogacestat-treated microvascular
  networks compared to untreated stiff controls. Representative confocal images show
  endothelial networks stained for VE-Cadherin in green, p16 in white, nuclei in blue.
  Scale bar is 100 μm. N=3. (O) Schematic illustration of the proposed mechanotransductive
  pathway: matrix stiffening enhances Notch activation, NICD release, which in turn
  activates the JNK-FOS axis, promoting endothelial senescence and an immunomodulatory
  phenotype. Significance levels indicated as ns= not significant (p > 0.05), *p ≤
  0.05, **p ≤ 0.01, and ***p ≤ 0.001'
