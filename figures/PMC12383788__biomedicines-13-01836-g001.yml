caption: Comparison between the traditional diagnostic process and the AI-supported
  approach in immunodeficiency. This figure shows the impact of artificial intelligence
  on the diagnostic pathway for immunodeficiencies. Traditionally, diagnosis predominantly
  depends on physician-led evaluations, frequently necessitating numerous appointments,
  comprehensive differential diagnoses, and sequential testing, resulting in considerable
  delays. Conversely, AI-enhanced systems examine extensive patient data to discern
  trends and risk profiles indicative of immunodeficiencies (created with Biorender.com,
