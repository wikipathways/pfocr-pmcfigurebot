figure_title: CNPY3 and GRP94 alterations regulate UPR pathway and immune-related
  genes in the tumor microenvironment.
caption: CNPY3 and GRP94 alterations regulate UPR pathway and immune-related genes
  in the tumor microenvironment. (A) cBioportal data show the gene alternation of
  enrichment genes based on the HSP90B1 alternation, including the UPR pathway ATF4,
  CHOP, XBP1 and PDI genes; Th17 and Th2 cell markers RORC and GATA3; and cytokines
  CCL20, CCR6, CXCL12, IL2 and TNF. Red solid bars indicate gene amplifications, blue
  solid bars are deletions, and red blank bars indicate upregulation, and blue blank
  bars indicate downregulation. (B) Pair wise association plot for HSP90B1, CNPY3,
  the UPR pathway and immune-related genes based on the Curtis breast cancer dataset.
  This map provides summary statistics on mutual exclusivity and co-occurrence of
  genomic alterations in each pair of genes. The color scale represents the magnitude
  of the association (log odds). (C) Kaplan–Meier plotter data (http://kmplot.com,
  accessed on 15 October 2025) show the prognostic correlation of enrichment genes
  in breast cancer. Red dot (hazard ratio, HR > 1, p < 0.05), high expression is an
  unfavorable factor; blue dot (hazard ratio, HR < 1, p < 0.05), high expression is
  a favorable factor. OS, overall survival; PFS, progression-free survival
