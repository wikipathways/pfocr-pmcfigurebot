figure_title: IL-27 normalizes the expression of IFN and Treg suppressive genes in
  RRMS.
caption: 'IL-27 normalizes the expression of IFN and Treg suppressive genes in RRMS.
  (A) Gene Ontology and pathway enrichment analysis of DEGs from FOXP3+ Tregs from
  RRMS versus HC subjects; MS Tregs IL-27-stimulated vs. unstimulated; and HC Tregs
  IL-27-stimulated vs. unstimulated. (B) Volcano plot showing biologically relevant
  DEGs in RRMS Tregs compared to HCs. Color codes: type I IFN (red), and Treg suppressive
  genes (purple). (C) Volcano plot showing biologically relevant DEGs in RRMS Tregs
  IL-27-stimulated vs. unstimulated cells (left) and HC Tregs IL-27-stimulated vs.
  unstimulated (right), DEGs with adjusted Log10p<0.05 and Log2FC>0.25 and Log2FC<0.25.
  (D) Violin plots present gene expression level of IFN genes decreased in MS Tregs
  vs HC Tregs, which are upregulated after IL-27 stimulation of MS Tregs and HC Tregs
  (upper panel). Volcano plots present selected Treg suppressive gens that are decreased
  in MS Tregs and up-regulated following IL-27 stimulation. (E) IL27R gene expression
  in migrated vs. non-migrated Tregs from RRMS and HC donors following 24 h migration
  assay. Statistical analysis using two-way ANOVA'
article_title: Targeting Impaired Type I Interferon–IL-27 Signaling Rescues T Regulatory
  Cell Suppressive Function in Relapsing-Remitting Multiple Sclerosis
