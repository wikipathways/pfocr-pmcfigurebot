figure_title: The mechanism of the cGAS-STING pathway.
caption: The mechanism of the cGAS-STING pathway. When pathogens such as bacteria
  and viruses invade the body, they release dsDNA; this also includes DNA derived
  from mitochondria dysfunction and dead cells. These dsDNA molecules are recognized
  and bound by cGAS, which then catalyzes the production of cGAMP. cGAMP can bind
  to and activate STING. Upon activation, STING undergoes conformational changes and
  dimerization and then translocates from the endoplasmic reticulum (ER) to the perinuclear
  region via the Golgi apparatus. Activated STING serves as a scaffold to recruit
  and activate the kinase TBK1. Subsequently, TBK1 phosphorylates the transcription
  factor IRF3. Phosphorylated IRF3 forms a dimer, translocates to the nucleus, and
  cooperates with other factors (e.g., NF-κB) to initiate the transcriptional expression
  of IFN-I and various inflammatory cytokines
article_title: 'The cGAS-STING Pathway in Pulmonary Diseases: Mechanisms and Therapeutic
