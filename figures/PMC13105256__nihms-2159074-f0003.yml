figure_title: Individual metabolites and metabolic pathways are associated with xenobiotic
  mixtures in serum samples from first trimester (n = 100).
caption: 'Individual metabolites and metabolic pathways are associated with xenobiotic
  mixtures in serum samples from first trimester (n = 100). The total mixture represents
  a mixture of 7 detected PFAS, 3 bisphenols, 5 phthalates, 3 organophosphate esters,
  2 parabens, and 1 pesticide. Effect estimates were determined from quantile gcomputation
  and can be interpreted as: for an simultaneous increase in each chemical in a mixture
  by one quartile, peak areas of a select metabolite increase (values > 0; positive;
  red) or decrease (values < 0; negative; blue). Effect estimates are indicated only
  for metabolic features that are significantly associated with at least one chemical
  mix of PFAS, bisphenols, phthalates, OPEs, parabens, or mixtures of these chemicals
  together (total mix) in serum samples. One asterisk (*) indicates a significant
  correlation using p < 0.05, while two asterisks (**) indicates significant correlations
  using False discovery rate (FDR) correction of multiple comparisons performed using
  the Benjamin-Hochberg procedure at FDR < 0.05'
article_title: Nontargeted screening identifies mixtures of environmental pollutants
  that are associated with perturbations to amino acid and fatty acid metabolic pathways
  during early pregnancy
