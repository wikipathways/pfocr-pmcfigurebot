figure_title: Expression of IL-1 cytokines, TSLP, proteases, and protease inhibitors
  in the esophagus
caption: A. Heatmap showing the relative expression of IL-1 family cytokines and TSLP
  across the indicated human tissues. Yellow indicates high expression; black indicates
  low expression. Data are sourced from the Human Protein Atlas. The schematic illustrates
  the maturation of chromatin-bound IL-33 via the ripoptosome pathway (RipIL-33).19
  Activation of the ripoptosome (receptor-interacting protein kinase 1 [RIP] and Fas-associated
  death domain [FADD] complex) triggers activation of caspase-8, which subsequently
  activates caspases 3 and 7, leading to intracellular maturation and release of IL-33.B.
  Heatmap showing the relative expression of esophagus-enriched proteases and protease
  inhibitors across the indicated human tissues. Yellow indicates high expression;
  black indicates low expression. Data are sourced from GTEx
