figure_title: S100A8/A9 expression is upregulated in cardiac neutrophils at one week
  post TAC in mice.
caption: 'S100A8/A9 expression is upregulated in cardiac neutrophils at one week post
  TAC in mice. (A) t-SNE plot of the two neutrophil subpopulations (Mature_Neu_1 and
  Immature_Neu_2). (B) Dot plots of signature genes confirming the subpopulation identities.
  (C) Monocle analyses showing the ordering of neutrophil cells along pseudotime trajectories.
  The minute dots in the illustration signify cells, with diverse colors denoting
  distinct clusters or states. (D) Violin plots showing the expression levels of the
  S100A8 and S100A9 genes in all neutrophils from the TAC and Sham groups at 1 week.
  (E) Violin plots showing the expression levels of the S100A8 and S100A9 genes in
  the two neutrophil subgroups between the TAC and sham groups at 1 week. (F) Top
  10 Gene Ontology (GO) pathways associated with genes upregulated in the neutrophils
  from the TAC group versus those from the Sham group at 1 week. (G) The top 10 enriched
  KEGG pathways associated with the genes whose expression was upregulated in neutrophils
  from the TAC group versus those from the sham group at 1 week. (H) Lollipop plot
  showing the expression levels of differentially expressed inflammatory factors.
  (I) S100A9-KO and WT mice were subjected to TAC for one week to assess cardiac dysfunction
  and hypertrophy. Representative immunoblots of the phosphorylated (p)-p38, p38,
  p-JNK, JNK, p-c-Jun, c-Jun, p-c-Fos, and c-Fos cardiac signaling proteins, as well
  as the GAPDH loading control (upper). The lower panel shows the quantification of
  these proteins (n = 4). (J) Cardiac qPCR analyses of CCL2 and CCL6 (n = 6). The
  values are presented as the means ± SDs (n = number of animals). **p < 0.01 and
  ***p < 0.001 vs. the WT + sham group; #p < 0.05, ##p < 0.01 and ###p < 0.001 vs.
  the WT + TAC 1-week group'
