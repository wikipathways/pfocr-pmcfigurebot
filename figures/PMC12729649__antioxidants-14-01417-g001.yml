figure_title: EGCG improves metabolic disorders, reducing hyperlipidemia and hyperglycemia.
caption: EGCG improves metabolic disorders, reducing hyperlipidemia and hyperglycemia.
  At the same time, EGCG activates the Nrf2/HO-1 pathway, increasing the levels of
  antioxidants. The increase in ROS and low-density lipoprotein levels leads to an
  increase in the oxidation of low-density lipoprotein, which then stimulates the
  production of more ROS and inflammatory factors by macrophages and endothelial cells,
  thereby exacerbating the endothelial dysfunction. EGCG also reduces the levels of
  ROS and low-density lipoprotein, improving endothelial function, and inhibits platelet
  aggregation, which is helpful for preventing thrombosis. In addition, EGCG inhibits
  macrophage infiltration in plaques by suppressing signaling pathways such as NF-kB
  and JNK/AP-1, inhibits the activity of matrix metalloproteinases, and increases
  the collagen fiber content in plaques, thereby enhancing plaque stability. The grey
  downward arrow in the labels indicates a decrease while the red upward arrow indicates
  an increase. The black arrows between the labels indicate a promoting effect while
  the red arrows represent an inhibitory effect
