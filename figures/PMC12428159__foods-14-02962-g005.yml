caption: Correlation analyses of the gut microbiome and metabolites with lipid metabolism-related
  indices associated with SCP supplementation. (A) Spearman’s correlation analysis
  of gut microbiome and lipid metabolism-related indices, (B) Spearman’s correlation
  analysis of obesity-related gut microbiome and metabolites, (C) network analysis
  of gut microbiome and metabolites in lipid metabolism pathway, (D) network analysis
  of gut microbiome and metabolites in amino acid metabolism pathway. The size of
  the node indicates the size of genus or metabolites abundance, and different colors
  indicate different genus or metabolites, the color of the connecting line indicates
  positive and negative correlation, red indicates positive correlation and green
  indicates negative correlation; the thickness of the line indicates the size of
  the correlation coefficient, and the thicker the line is, the higher the correlation
  between the species is, and the more lines there are, the closer the connection
  between the nodes is. * p < 0.05, ** p < 0.01, *** p < 0.001
