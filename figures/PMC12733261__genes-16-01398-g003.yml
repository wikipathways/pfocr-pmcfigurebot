figure_title: Changes in the number of lymphatic endothelial cells and analysis of
  proliferation-related signals.
caption: 'Changes in the number of lymphatic endothelial cells and analysis of proliferation-related
  signals. (A) (Left): t-SNE plot showing the LEC subpopulations (LEC-1 and LEC-2);
  (Right): Intergroup variations of LEC subpopulations. (B) Dot plot showing the top
  6 genes expressed in each LEC subpopulation. (C) Feature plot showing the expression
  distribution of VEGF-C and VEGF-D in all clusters (samples were integrated together:
  Sham+AS8 w+AS16 w). (D) Heatmap showing the main VEGF-C and VEGF-D secreting subpopulations.
  (E) Analysis of LEC proportion between groups (The percentage represents the proportion
  of each LEC subgroup in the total number of cells in each group); the proportion
  of LECs increases in the early stages and decreases in the late stages of the disease.
  (F) Analysis of the interaction intensity of VEGF-C/D between cell subpopulations
  across groups (NL = Sham, AS1 = AS1:8 w HFD, AS2 = AS2:16 w HFD). (G) Top: RAS signaling
  activation receptor–ligand pair analysis in LEC subpopulations in the Sham group
  (the vertical axis represents receptors that convey activated signals, and the horizontal
  axis represents upstream cell subpopulations expressing the corresponding ligands);
  Bottom: RAS signaling activation receptor–ligand pair analysis in LEC subpopulations
  of the AS-8 w group. (H) LEC proliferative activity analysis: Top: Violin plot showing
  the intergroup differences in the expression of cell-cycle-related genes in each
  LEC subpopulation; Bottom: LEC cell cycle scores within each group. (I) Analysis
  of LEC proliferation-related activation pathways and upstream cell subpopulations
  in the Sham group (including the RAS signaling pathway, PI3K/AKT signaling pathway
  [16], and 5 other pathways; only the RAS signaling pathway was activated). (J) Analysis
  of LEC proliferation-related activation pathways and upstream cell subpopulations
  in the AS-8 w group (including the RAS signaling pathway, PI3K/AKT signaling pathway,
  and 5 other pathways; only the RAS signaling pathway was activated)'
