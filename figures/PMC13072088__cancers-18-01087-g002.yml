figure_title: Genetic correlates of adenosine pathway marker and PD-L1 expression
  in brain metastases.
caption: Genetic correlates of adenosine pathway marker and PD-L1 expression in brain
  metastases. (A) Bar plots showing mutation frequencies of selected genes stratified
  by compartment-specific immunohistochemical marker status, including CD39 expression
  on immune cells (CD39 IC) and tumor cells (CD39 Tumor), CD73 expression on immune
  cells (CD73 IC) and tumor cells (CD73 Tumor), and PD-L1 expression on immune cells
  (PD-L1 IC). Only associations meeting the exploratory significance threshold (p
  < 0.1) are shown. (B) Forest plots summarizing the corresponding associations between
  gene alterations and marker positivity, displayed as odds ratios (OR) with 95% confidence
  intervals. (C) Heatmap illustrating enrichment or depletion of recurrent gene alterations
  across tumor entity groups (gastrointestinal, gynecological, head and neck, lung
  cancer, skin, urological), based on log2-transformed odds ratios. (D) Heatmap depicting
  enrichment patterns of gene alterations across immune marker expression subgroups
  (CD39/CD73 tumor and immune cell expression, PD-L1 IC and TPS). Color intensity
  reflects log2(OR), with statistical significance indicated by asterisks
