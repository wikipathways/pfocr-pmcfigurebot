figure_title: Metabolic abnormalities decrease the level of AMPK, lead to overactivation
  of SREB-1, and increase the level of AGEs.
caption: Metabolic abnormalities decrease the level of AMPK, lead to overactivation
  of SREB-1, and increase the level of AGEs. Suppression of AMPK and overactivation
  of SREB-1 decreases fatty acid oxidation and increases lipid synthesis, leading
  to lipotoxicity and injury of tubular epithelial cells. Concurrently, AGEs bind
  with their receptor (RAGE), and this activates the MAPK and NF-κB pathways. The
  combined effects of these changes lead to accelerated progression of CKD
