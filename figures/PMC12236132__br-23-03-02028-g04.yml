figure_title: Mechanism of action of AGE in HaCaT and SCC7.
caption: Mechanism of action of AGE in HaCaT and SCC7. (A) MTT assay of 24 h treatment.
  AGE promoted proliferation in HaCaT, but not SCC7. (B) MTT assay of 48 h treatment.
  AGE promoted proliferation in HaCaT, but not SCC7, and 48 h treatment showed improved
  results vs. 24 h treatment. (C) The pathway through inhibition of ferroptosis was
  detected in the pathway of comparison between AGE (100 µg/ml, 48 h)-treated HaCaT
  and untreated HaCaT. (D) Akt could be one of the genes of focus as detected from
  first network analysis on comparison between AGE (100 µg/ml, 48 h)-treated and untreated
  HaCaT. (E) BDNF could be one of the genes of focus as detected from third network
  analysis on comparison between AGE (100 µg/ml, 48 h)-treated HaCaT and untreated
  HaCaT. (F) The possibility of cancer cell growth inhibition by AGE through the suppression
  of cancer metastasis signaling between AGE (100 µg/ml, 48 h)-treated and untreated
  SCC7. (G) The possibility of cancer cell growth inhibition by AGE through the enhancement
  of phagocytic activity between AGE (100 µg/ml, 48 h)-treated SCC7 and untreated
  SCC7. AGE, aged garlic extract
