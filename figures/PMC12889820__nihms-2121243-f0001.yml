caption: 'Cellular prestress regulates the innate immune response: (a) Phase images
  of HeLa cells seeded on 0.6 kPa and 8.5 kPa PA substrates. Quantification of (b)
  projected cell area (n = 20) shows that cells spread significantly more on 8.5 kPa
  substrates compared to 0.6 kPa, and (c) cell shape index (a measure of circularity;
  n = 20) indicates that cells on softer substrates adopt a more rounded morphology.
  (d–f) Basal RMS traction (n = 6) and prestress (n = 6) demonstrate that cells on
  stiffer substrates generate greater contractile forces. (g–j) Relative mRNA expression
  of key innate immune pathway genes following LMW-Poly(I:C) transfection on substrates
  of differing stiffness, measured from three independent experiments. Expression
  levels were normalized to the housekeeping gene Rps18. Scale bar, 20 μm'
