figure_title: Human bronchial epithelial culture responses at peak SARS-CoV-2 infection
caption: (A) Measures of cell death. (Ai) TUNEL assay quantification at 3 and 14 dpi
  in mock and infected cultures. ** = p < 0.01. (Aii) Box plots depicting LDHB release
  onto SARS-CoV-2-infected HBE culture surfaces spanning 1–14 dpi. (Aiii) Box plots
  depicting high mobility group box 1 (HMGB1) HBE apical surface protein levels spanning
  1–14 dpi. (B) Measures of metabolites. Box plots depicting (Bi) total adenosine
  triphosphate (ATP) metabolites and (Bii) uric acid (UAC) concentrations, (Biii)
  MTA = methy-lthioadenosine; (Biv) Ade = adenosine; and (Bv) Met = methionine as
  measured by mass spectroscopy in secretions at the indicated dpi. * = p < 0.05;
  **p<0.01. (C-E) Examples of pathway responses to peak SARS-CpV-2 infection. (Ci)
  Heatmap of nuclear-encoded mitochondrial genes post-SARS-CoV-2 HBE culture infection.
  (Cii) Box plots showing average gene expression per donor culture for mock and SARS-CoV-2-infected
  cultures over dpi. (Di) Heatmap describing histone acetylation gene expression over
  time post-SARS-CoV-2 infection. (Dii) Box plot describing average histone acetylation
  gene expression levels per HBE culture donor for mock and SARS-CoV-2-infected cultures
  with time. (Ei) Heatmap describing individual genes in the KEGG pathway for cytokines
  and receptors regulated by SARS-CoV-2 infection over dpi. (Eii) Box plots showing
  average gene expression per HBE donor culture for mock and SARS-CoV-2-infected cultures
  over dpi. Labels in Ci apply to all heatmaps. Statistics conducted and symbols as
  described in Figure 3 legend
