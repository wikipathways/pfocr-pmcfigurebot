figure_title: The central metabolic pathway leading to ethanol and PHB in E.
caption: 'The central metabolic pathway leading to ethanol and PHB in E. coli. The
  ethanol-producing strain harbored engineered metabolic pathways (red) and impaired
  reaction routes (dotted lines). This strain was further reprogrammed by manipulating
  metabolic pathways, as indicated in blue. The metabolic pathway involves genes of
  interest as follows: adhII (Z. mobilis), alcohol dehydrogenase; frdA, fumarate reductase;
  glf (Z. mobilis), glucose facilitator; ldhA, lactate dehydrogenase; pdc (Z. mobilis),
  pyruvate decarboxylase; pgl, lactonase; phaA, β-ketothiolase; phaB, acetoacetyl-CoA
  reductase; phaC, PHB synthase; poxB, pyruvate oxidase; pta, phosphate acetyltransferase;
  rpe, ribulose-5-phosphate 3-epimerase; rpiA, ribose-5-phosphate isomerase A; talB,
  transaldolase B; tktA, transketolase A; xylA, xylose isomerase; xylB; xylulokinase;
  zwf, glucose 6-phosphate dehydrogenase. Abbreviations: ACE, acetate; EtOH, ethanol;
  F6P, fructose 6-phosphate; Glc, glucose; G6P, glucose 6-phosphate; LAC, lactate;
  OAA, oxaloacetate; PGA, 3-phosphoglyceraldehyde; PYR, pyruvate; Ru5P, ribulose 5-phosphate;
  R5P, ribose 5-phosphate; SUC, succinate; Xyl, xylose; X5P, xylulose 5-phosphate'
