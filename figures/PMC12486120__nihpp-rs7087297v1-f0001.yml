figure_title: Whole transcriptome analyses of primary and asynchronous metastases
  in patients with clear cell renal cell carcinoma (ccRCC)
caption: A. Capture whole transcriptome sequencing was performed on primary nephrectomy
  specimens from 19 patients and matched asynchronous metastasis specimens from multiple
  sites comprising Adrenal, Bone, Liver, Lung, Lymph and Soft tissue. B. Principal
  Component Analysis (PCA) plot demonstrating separation of primary and metastatic
  tumors based on gene expression variation along the PC1 axis. C. Volcano plot demonstrating
  top significantly (FDR p-value < 5%) expressed genes between primary and metastatic
  ccRCC from differential gene expression (DGE) analysis D.MSigDB Cancer Hallmark
  pathways
