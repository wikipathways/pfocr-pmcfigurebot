figure_title: Environmental, genetic, and signaling factors contributing to eosinophilic
  esophagitis and esophageal cancer
caption: This schematic illustrates the multifactorial contributors to eosinophilic
  esophagitis (EoE) and esophageal cancer. Environmental exposures, including allergens,
  nutrition, detergents, particulate matter, and drug use during pregnancy and infancy,
  interact with genetic predispositions, such as GWAS-identified loci (e.g., CAPN14,
  TSLP, EMSY, STAT6, LRRC32, CLEC16A, epidermal differentiation complex [EDC] genes)
  and Mendelian diseases (e.g., severe atopy syndrome, Netherton syndrome, PTEN hamartoma
  tumor syndrome, hyper-IgE syndrome, Erbin deficiency). These factors converge on
  key signaling pathways, including TGF-β, IL-13, NF-κB, HIF1A, and others, shaping
  disease susceptibility and progression. Additional influences, such as delivery
  method, breastfeeding, neonatal intensive care unit (NICU) admission, and lifestyle
  factors (e.g., smoking, alcohol, obesity, proton pump inhibitor [PPI] exposure),
  are also depicted
