figure_title: TLR4-mediated apoptosis induction by Helicobacter pylori HP0175.
caption: 'TLR4-mediated apoptosis induction by Helicobacter pylori HP0175. H. pylori
  secretes the virulence factor HP0175, which binds to the host epithelial TLR4 receptor
  and triggers apoptosis via both extrinsic and intrinsic pathways. Extrinsic pathway:
  TLR4 signaling activates ASK1 and downstream p38 MAPK, promoting the activation
  of pro-CASP8 and pro-CASP9, ultimately resulting in CASP3 activation and cell death.
  (2) Intrinsic pathway—TLR4 activation leads to CASP8 activation, which cleaves Bid.
  This promotes permeabilization of the mitochondrial outer membrane, release of cytochrome
  c, and CASP3 activation, leading to cell apoptosis. Both pathways converge on CASP3,
  a key apoptotic executioner'
