figure_title: Functional enrichment and protein–protein interaction network analysis
  of the selected ASD biomarker panel.
caption: Functional enrichment and protein–protein interaction network analysis of
  the selected ASD biomarker panel. (a) Bubble plot summarizing Gene Ontology (GO)
  enrichment (biological processes [BP], cellular components [CC], molecular functions
  [MF]) and KEGG pathway analyses for the 10 candidate biomarkers. Bubble size corresponds
  to the number of proteins associated with each term, color indicates statistical
  significance (p-value), and fold enrichment reflects the degree of overrepresentation.
  Enriched pathways include synaptic signaling, immune response, cellular stress response,
  and metabolic regulation. (b) Protein–protein interaction (PPI) network of the selected
  biomarkers (COL1A1, ITIH4, CLU, NID1, C5, MASP1, PON1, PLTP, HSPA5, and FETUB) generated
  using the STRING database. Nodes represent individual proteins and edges indicate
  predicted functional associations. Distinct interaction modules are observed, with
  CLU acting as a central hub linking multiple functional clusters
