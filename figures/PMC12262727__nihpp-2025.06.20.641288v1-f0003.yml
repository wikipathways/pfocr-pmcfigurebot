figure_title: Validation cohort demonstrates platelet activation in patients with
  anti-LG positive antibody levels.
caption: Validation cohort demonstrates platelet activation in patients with anti-LG
  positive antibody levels. (A) R.gnavus (RG) serum anti-lipoglycan (anti-LG) levels
  in non-renal SLE, patients with LN patients without gut dysbiosis (Renal without
  dysbiosis), and LN patients with RG gut blooms (RG bloom) from the New York University
  pilot cohort (NYU)1,7. A cut point was used to dichotomize patients based on anti-LG
  levels (horizontal dashed line) in the ITN034AI clinical trial (ITN) validation
  cohort, separating those with negative (< 5.9 × 10^4 U/mL) and positive (≥ 5.9 ×
  10^4 U/mL) levels. (B, C) Genes (B) and pathways (C) related to platelet activation
  and neutrophil activation increased in anti-LG positive patients. Platelet activation,
  signaling, and degranulation (NES=3.5, padj=1.02E-06), platelet degranulation (NES=3.07,
  padj=4.5E-5), response to elevated platelet cytosolic Ca2+ (NES=2.99, padj=1.08E-4),
  platelet alpha granule (NES=2.96, padj=4.76E-05), myeloid leukocyte migration (NES=2.34,
  padj=8.08E-03), neutrophil degranulation (NES=2.33, padj=1.22E-02), myeloid activation
  (NES=2.27, padj=1.25E-02), platelet activation (NES=2.16, padj=2.17E-02), macrophage
  migration (NES=2.10, padj=1.59E-02), neutrophil activation (NES=1.96, padj=4.97E-02),
  macrophage chemotaxis (NES=1.9, padj=4.04E-02). *indicates patient with negative
  anti-LG antibody level based on designation (<5.9×10^4 U/mL), but with elevated
  urine protein/creatine ratios of >20 g/g. (See Extended data 5) (D) Platelet gene
  expression module scores (left) and platelet factor 4 (PF4) levels (right) in validation
  cohort anti-LG negative and positive patients. PF4 levels are shown for patients
  with class III and/or IV nephritis, without class V disease. (E) Neutrophil degranulation
  gene module (left) and serum NET fragment detection by ELISA for citrullinated Histone
  3 (citH3), myeloperoxidase (MPO), and DNA (right), which are markers for NETosis,
  in pilot and validation cohort patients with available serum samples. Unpaired,
  non-parametric t-test
