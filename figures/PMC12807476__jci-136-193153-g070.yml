figure_title: ER signaling is associated with immunotherapy resistance and reduced
  immunogenic pathways in patients
caption: '(A) GSEA of ranked transcripts for HR+HER2– BC patients classified as Rs
  (pCRs) versus NRs to the neoadjuvant anti–PD-L1/olaparib/Nab-paclitaxel arm of the
  ISPY-2 clinical trial (12). Data were ranked according to the normalized enrichment
  score (NES). Bubble size represents signature gene size, and the color scale depicts
  the nominal P value. Analysis of ESR1 mRNA levels in R and NR patients. Box plot
  represents the IQR with individual points. The adjusted P value was determined by
  Benjamini-Hochberg correction. αPD-L1, anti–PD-L1. (B) Analysis of scRNA-Seq of
  tumor cells from HR+ patients treated with anti–PD-1 (n = 15) from the BioKey clinical
  trial (45). Violin plot shows the estrogen response early signature (hallmarks,
  M5906), calculated using the Seurat function for patients before (Pre) and after
  (On) 1 cycle of anti–PD-1 monotherapy. Uniform manifold approximation and projection
  (UMAP) representation of time points (On and Pre) and overlapping signature expression
  with the color scale expression score. The P value shown was determined by Wilcoxon’s
  paired test for Pre versus On. (C) GSEA of ranked transcripts comparing ESR1hi versus
  ESR1lo HR+HER2– BC patients from the METABRIC BC public dataset. Data were ranked
  according to the NES. Bubble size represents the signature gene size, and the color
  scale depicts the nominal P value. (D) GSEA of APM (KEGG code: M16004) comparing
  ESR1hi versus ESR1lo patients ranked from ESR1 mRNA median expression of HR+HER2–
  group in METABRIC and TCGA datasets. Distribution of ESR1 mRNA levels across patients
  is shown as a z score. (E) GSEA of hallmark transcripts (estrogen response early,
  estrogen response late, E2F targets, IFN-γ response, and inflammatory response)
  and KEGG legacy (APM) comparing transcriptomes of patients before treatment versus
  2 weeks after letrozole therapy from specified datasets (46–48). Bubble size represents
  the nominal P value, and color depicts the NES. (F) Heatmap of the expression (z
  score) of genes related to an estrogen response and MHC-I pathways for patients
  before treatment and 2 weeks after letrozole therapy'
