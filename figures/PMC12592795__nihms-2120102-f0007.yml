figure_title: Primary cilia and SHH pathway competency decrease through aP2-Cre endothelial
  cell development
caption: '(A) Immunofluorescent images from E11.5, E15.5, and E17.5 AT embryos, adult
  SCM, HL muscles, lung, and the kidney, and AST tumor stained for primary cilia with
  ARL13B (white). Scale bars, 25 μm.(B) Quantification of ciliated and non-ciliated
  tdTomato+ cells in (A). Error bars ± SEM, total cells counted: E11.5 = 718, E15.5
  = 579, E17.5 = 389, SCM = 8883, quadricep (HL) = 15,783, lung = 8,683, kidney =
  4,993, and tumor = 8,994. Each dot represents quantification of a single image.
  ****p < 0.0001.(C) Immunofluorescent images from CT E11.5 and E15.5 embryos stained
  for primary cilia with ARL13B (white). Scale bars, 20 μm.(D) Quantification of ciliated
  and non-ciliated tdTomato+ cells in (C). Error bars ± SEM, total cells counted:
  CT E11.5 = 6,822, E15.5 = 5,767. Quantification of AT ciliated cells is the same
  as that of data from (B). Each dot represents quantification of a single image.
  ****p < 0.0001.(E) Immunofluorescent images from CST tumors stained for primary
  cilia with ARL13B (white). Scale bars, 10 μm.(F) Kaplan-Meier tumor-free survival
  in Kif3aWT (n = 16), Kif3ahet (n = 55), and Kif3acKO (n = 34) tumors (p = 0.0002).(G)
  Breeding scheme to generate aP2-Cre;R26tdTomato;Gli1LacZ/+ animals.(H) Immunofluorescence
  images of aP2-Cre;R26tdTomato;Gli1LacZ/+ E11.5 embryos visualizing primary cilia
  (ARL13B; green) and Gli1LacZ/+ (SPiDER-β-Gal; white). Scale bars, 25 μm. n = 3 embryos
  from two litters.(I) Immunofluorescence images of aP2-Cre;R26tdTomato;Gli1LacZ/+
  SCM and quadricep (HL) muscle and AST;Gli1LacZ/+ tumors visualizing primary cilia
  (ARL13B; green) and Gli1LacZ/+ (β-gal; white). Scale bars, 25 μm. SCM and HL n =
  3 mice, tumor n = 3 tumors.(J) Quantification of β-gal+/tdTomato+ cells in samples
  from (G) and (H). tdTomato+ cells counted: E11.5 = 249, SCM = 3671, HL = 3,744,
  and tumor = 13,117. Error bars ± SEM, p-value **** < 0.0001, *** < 0.001, and **
  < 0.01. Each dot represents quantification of a single image'
