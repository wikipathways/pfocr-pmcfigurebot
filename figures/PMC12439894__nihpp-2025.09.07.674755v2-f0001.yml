figure_title: FcγR− MPP3 expansion drives erythroid overproduction
caption: (A) Hematopoietic stem and progenitor cell (HSPC) and myeloid progenitor
  (MP) population analyses of littermate control (Ctrl) and Mx1-Cre::Jak2V617F (Jak2V617F)
  mice 12 weeks post-induction.(B) Myeloid colony forming assays using FcγR− MPP3
  isolated from littermate control and Mx1-Cre::Jak2V617F mice 12 weeks post-induction
  (n = 8). Colony-forming units (CFUs) in methylcellulose assays were scored 8 days
  after plating. GEMM, granulocyte/erythroid/macrophage/megakaryocyte; GM, granulocyte/macrophage;
  G (or) M, granulocyte or macrophage; MegE, megakaryocyte/erythrocyte.(C) Short-term
  in vivo differentiation assays. Donor cells were isolated from littermate control
  and Mx1-Cre::Jak2V617F mice 12 weeks post induction (20,000 cells per mouse). Donor-derived
  cells were analyzed for MP (Lin−/Sca-1−/c-Kit+) contributions at 3 days post-infusion.
  Representative FACS plots and quantification of donor-derived frequencies are shown.(D)
  Principal component (PC) analysis of HSC and FcγR− MPP3 bulk RNA-seq data from littermate
  control and Mx1-Cre::Jak2V617F mice. (E) KEGG pathway analysis of the top 500 differentially
  expressed genes (DEGs) in FcγR− MPP3 from littermate control and Mx1-Cre::Jak2V617F
  mice. The DEG list is provided in Table S1.Data are means ± S.D., and statistical
  significance was assessed by a two-tailed unpaired Student’s t-test. * p ≤ 0.05,
  ** p ≤ 0.01, *** p ≤ 0.001.See also Figure S1
