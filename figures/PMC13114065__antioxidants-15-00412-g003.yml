figure_title: Drug-specific molecular initiation and convergence of oxidative stress-mediated
  nephrotoxicity.
caption: Drug-specific molecular initiation and convergence of oxidative stress-mediated
  nephrotoxicity. Nephrotoxic drugs initiate renal injury through distinct molecular
  events, including differential cellular uptake, metabolic activation, or primary
  mitochondrial perturbation. These initiating processes activate upstream signaling
  nodes—such as p53-mediated mitochondrial stress responses—that subsequently converge
  on shared redox-sensitive pathways. The integrated activation of oxidative stress,
  inflammatory signaling, and regulated cell death culminates in tubular and vascular
  dysfunction, representing a final common pathway of drug-induced kidney injury.
