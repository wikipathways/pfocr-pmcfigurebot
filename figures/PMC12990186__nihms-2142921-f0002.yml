figure_title: Metabolomics of human FXS plasma and lymphoblastoid cells
caption: '(A) Volcano plot of polar metabolites in male FXS plasma (N = 6) vs. age-matched
  TD controls (N = 7) (see Tables S1 and S2). The dotted lines mark log2FC = 0 (vertical)
  and the significance threshold (−log10p ≥ 1.3, horizontal). Amino acids are in green,
  nucleotide intermediates are in red, and energy metabolism intermediates are in
  blue.(B) Table of dysregulated metabolites common between FXS plasma (A) and brain
  tissues (Figures 1E and 1F) (see Table S2).(C) Integrated schematic of FXS metabolite
  alterations in the brain and plasma (A, Figures 1E and 1F), highlighting impacted
  pathways. The direction of the arrows indicates an increase/decrease in levels.(D)
  Top: TD, FXS1, and FXS2 LCLs (N = 1, n = 3) were used to assess polar metabolites
  by LC-MS in cell pellets (intracellular) and media (extracellular). Bottom: western
  blots of FMRP and GAPDH and principal-component analysis (PCA) of intracellular
  metabolites. (‘‘N’’ and ‘‘n’’ represent biological and technical replicates, respectively).(E)
  Heatmaps of intracellular (pellet) and extracellular (media) metabolites from (D);
  ion counts (color gradient) and hierarchical clustering are shown (related to Figure
  S2 and Table S2).(F) Cumulative ion counts for cluster 1 metabolites: intracellular
  (top) from (E) and bar plots of methionine and serine. Data are represented as the
  mean ± SEM.(G) Cumulative ion counts for cluster 1 extracellular metabolites. Data
  are represented as the mean ± SEM'
