figure_title: The classical CRISPR/Cas9 system and its use as a gene therapy (GT)
  approach.
caption: 'The classical CRISPR/Cas9 system and its use as a gene therapy (GT) approach.
  (Left panel) The classical CRISPR/Cas9 system requires a double-strand break (DSB)
  within the DNA mediated by an RNA-guided Cas9 protein. Upon DSB, the cell activates
  two central repair mechanisms: the homologous recombination (HR) and non-homologous
  end-joining (NHEJ) pathways. While HR is predominant in dividing cells, the NHEJ
  is active in both dividing and non-dividing cells. Most importantly, HR needs a
  donor template with homologous arms to be inserted into the host genome. Without
  a donor template, the NHEJ mediates the DSB repair, producing random insertions
  or deletions known as indels. (Right panel) The CRISPR/Cas9 system can be used for
  in vivo and ex vivo genome editing (GE). Likewise, current studies have demonstrated
  the suitability of hematopoietic stem progenitor cells (HSPCs), induced pluripotent
  stem cells (iPSCs), and neural stem cells (NSCs) for ex vivo CRISPR/Cas9-based GTs.
  This figure was created with Biorender.com'
