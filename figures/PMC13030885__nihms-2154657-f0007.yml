caption: A data-driven “atlas” of disease progression generated by the SPT model,
  visualizing the most common probabilistic pathways originating from an initial diagnosis
  of Esophageal disorders and branching into subsequent metabolic, renal, and cardiovascular
  complications. The flowchart displays conditional probabilities at each branch point,
  showing how patients may progress from esophageal disorders (DIG004) to obesity
  (END009) with probability 0.2488, then through various pathways including coronary
  atherosclerosis and heart disease (CIR011), diabetes complications (END005), chronic
  kidney disease (GEN003), and other cardiovascular conditions. Each arrow is labeled
  with transition probabilities, illustrating the likelihood of developing specific
  comorbidities based on the learned disease progression patterns from patient data
