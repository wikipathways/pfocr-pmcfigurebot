figure_title: Embryo-absent and embryo-containing fruit transcriptomes.
caption: Embryo-absent and embryo-containing fruit transcriptomes. (a) Heatmap of
  hierarchical clustering of differentially expressed genes. the x-axis lists samples
  and their cluster results, while the y-axis features genes and their clustering.
  Pink indicates high expression; blue signifies low expression. (b) Venn diagram
  of differentially expressed genes among various groups. The non-overlapping area
  represents the differential genes unique to that differential group, while the overlapping
  area represents the differential genes shared by several overlapping differential
  groups. (c) Multiple combination KEGG enrichment scatter plot. The dot size shows
  how many differential genes are enriched in the pathway; bigger dots mean more genes.
  The dot color shows the enrichment significance; pink dots mean higher significance.
  The red boxes highlight the two key enriched KEGG pathways
