figure_title: 'Sankey diagram illustrating observed treatment pathways for patients
  with non-metastatic colon cancer presenting to Ocean Road Cancer Institute (ORCI).
  The central vertical bar (labeled ‘ORCI’ and shown in brown) marks the point of
  presentation toORCI, delineating between care received before ORCI (left-sided nodes)
  from care received at or after ORCI (right-sided nodes). Each node represents a
  specific treatment modality and flow lines indicate the number of patients transitioning
  between treatments. Patients may enter the care pathway at any node (e.g., referred
  after prior surgery) and stop at any point (e.g., no further treatment). To summarise
  the left side of the diagram, 82 patients underwent surgery prior to ORCI, including
  3 who also received adjuvant chemotherapy. Ten patients presented to ORCI without
  any prior oncologic treatment. To summarise the right side of the diagram, 70 patients
  received adjuvant therapy after presenting to ORCI (n = 66 adjuvant chemotherapy,
  n = 3 chemoradiotherapy, n = 1 radiotherapy). Among the 66 who received adjuvant
  chemotherapy, 63 had surgery prior to ORCI and 3 underwent surgery after being seen
  at ORCI. Of the 10 patients without prior treatment at the time they were seen at
  ORCI (labeled on left side of the diagram as ‘no prior care’), 4 received neoadjuvant
  therapy at ORCI (n = 3 chemotherapy, n = 1 chemoradiotherapy); 3 of these proceeded
  to surgery. One of the 10 patients underwent surgery as initial treatment and 5
  received no oncologic therapy. Abbreviations: Chemo, chemotherapy; chemoRT, chemoradiotherapy;
  ORCI, Ocean Road Cancer Institute; RT, radiotherapy'
