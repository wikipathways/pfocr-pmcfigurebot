figure_title: Model of T1D and LADA pathogenesis based on published literature and
  our own findings
caption: '(A) Illustration of the PBMC compartment, where heightened activity of CD4+
  Th1/Th17, CD8+ cytotoxic T lymphocytes (CTLs) and NK cells, coupled with depletion
  of FOXP3+ Tregs and IL-10–producing B regulatory cells (Bregs), establishes a proinflammatory
  milieu and systemic production of disease-defining autoantibodies. (B) Depiction
  of the pancreatic draining lymph node: dendritic cells ferry β cell antigens, driving
  oligoclonal expansion of autoreactive T cell receptors (TCRs) without a universal
  public clonotype. (C) Illustration of the islet microenvironment, where upregulation
  of HLA class I molecules and endoplasmic reticulum stress in β cells result in their
  direct lysis by CD8+ CTLs and NK cells. In addition, β cells are subject to cytokine-mediated
  damage driven by Th1 and Th17 cells, antibody-dependent cellular cytotoxicity (ADCC),
  and the effects of innate cytokines released by macrophages and dendritic cells.
  The bottom left panel displays data generated in the present study. Integrated JAK-STAT1/3,
  NF-κB, PI3K-AKT-mTOR, MAPK p38/JNK pathways maintain chronic inflammation and propagate
  β cell apoptosis, leading to epitope spreading and progressive loss of insulin secretion.
  Created in BioRender. (Samsonova M, 2025; https://BioRender.com/tkecn1v)'
