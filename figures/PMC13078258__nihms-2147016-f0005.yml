figure_title: S1PR4 antagonism in Col4a3−/− podocytes upregulated the expression of
  genes of lysosomal and autophagy-related pathways
caption: (a) Venn diagram showing the number of significantly differentially expressed
  genes (P < 0.05) between Col4a3+/+ podocytes and Col4a3−/− podocytes, and between
  Col4a3−/− podocytes and Col4a3−/− podocytes treated with APOM or CYM, as determined
  by RNA-seq. (b) Volcano plot of RNA-seq results between Col4a3+/+ podocytes and
  Col4a3−/− podocytes (significant genes in red, P < 0.05). (c) KEGG pathway enrichment
  analysis of differentially expressed genes between Col4a3+/+ podocytes and Col4a3−/−
  podocytes, ranked by significance (d) Volcano plot of RNA-seq results in the APOM
  treatment group (significant genes in red, P < 0.05). (e) Volcano plot of RNA-seq
  results for the CYM treatment group (significant genes are shown as red dots (P
  < 0.05), non-significant genes as black dots) highlighting the most significantly
  altered gene. (f) Magnified volcano plot of the CYM treatment group excluding Angptl4,
  which was disproportionately significant (significant genes are shown as red dots
  (P < 0.05), non-significant genes as black dots). (g) KEGG pathway enrichment analysis
  of differentially expressed genes in the CYM treatment group, ranked by significance.
  (h) Heatmap showing Log2 fold change of significantly altered genes (P < 0.05) in
  the CYM treatment group involved in lysosomal and autophagy pathways. (i) KEGG pathway
  enrichment analysis of the shared differentially expressed genes between the Col4a3+/+
  podocytes and Col4a3−/− podocyte group and the CYM treatment group, ranked by significance
article_title: Modulation of the APOM/S1PR4 Pathway Reduces Podocyte Lipid Overload
  in Alport Syndrome via Distinct Autophagy and Efflux Mechanisms
