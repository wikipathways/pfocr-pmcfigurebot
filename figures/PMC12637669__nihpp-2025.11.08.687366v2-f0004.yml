figure_title: Substrate stiffness increased proteasomal activity and PSMD11 expression,
  but not autophagy-associated proteins or proteasome subunit levels
caption: (A) Representative western blots for autophagy markers- Microtubule-associated
  protein light-chain 3 (LC3) and Sequestosome 1 (p62/SQSTM1) in bovine corneal endothelial
  cells cultured on stiff (32 kPa) or soft (8 kPa) substrates for 48 and 96 hours.
  (B) Corresponding quantification of the blots normalized by total protein; Mean
  ± standard deviation; n=3–4; unpaired Student’s t-test; ns (not significant). (C)
  Quantification of chymotrypsin activity, Mean ± standard deviation; n=8–10; unpaired
  Student’s t-test; ns (not significant), *p<0.05, ****p < 0.0001. (D) Representative
  Jess immunoblots for ubiquitin proteasomal pathway markers- proteasome 11S regulator
  subunit REG alpha (PA28α), proteasome 26S subunit non-ATPase 11 (PSMD11), and K48-linked
  polyubiquitin. (E) Corresponding quantification of the blots normalized by total
  protein; Mean ± standard deviation; n=3; unpaired Student’s t-test; ns (not significant),
  *p<0.05
article_title: Decreased substrate stiffness leads to mitochondrial dysfunctions and
  Endothelial to Mesenchymal transition through Focal Adhesion Kinase activity in
  corneal endothelial cells
