figure_title: CDK12/13 inactivation or low expression levels are associated with elevated
  STING activation and improved response to ICB
caption: '(A) Analyses of 10× Genomics Visium spatial transcriptomics on CDK12 mutant
  versus wild-type (WT) metastatic castration-resistant prostate cancer (mCRPC) samples.
  Top: Enrichment of the indicated pathways in tumor cells. Middle: Representative
  images illustrating the enrichment of STING activity signature in tumor areas. Bottom:
  The top 10 pathways enriched by gene set enrichment analysis (GSEA), utilizing the
  MSigDB Hallmark database, in tumor cells. Type I and II IFN responses are highlighted
  in red. Adj., adjusted. Scale bar: 200 μm. (B) Association between expression of
  CDK12/13 and STING activity signature in the indicated cancer types. Data were acquired
  from The Cancer Genome Atlas datasets. Abbreviations are defined in the legend of
  Supplemental Figure 1. (C) Association between pretreatment expression of CDK12/13
  and overall survival in the indicated cohorts treated with ICB therapy. MI-ONCOSEQ:
  a pan-cancer cohort at the University of Michigan. The KM plotter data were acquired
  from the KM plotter database (https://kmplot.com/analysis/). (D) Association between
  pretreatment expression of CDK12/13 and ICB response in the melanoma and MI-ONCOSEQ
  ICB cohorts in C. (E) Single-cell RNA sequencing assessing expression of indicated
  genes or signature in tumor cells in ICB-treated cohorts. Left: Expression of CDK12/13
  in tumor cells in patients with favorable versus unfavorable clinical outcomes.
  Right: Expression of STING activity signature in tumor cells in patients with favorable
  versus unfavorable clinical outcomes. Data were acquired from published research
  articles (see Methods). Low expression of CDK12/13 was defined as the bottom 20th
  percentile within each cohort. Two-tailed t tests were performed in B (with Bonferroni’s
  correction) and E, log-rank tests in C, and Fisher’s exact test in D. Panels B and
  D show box-and-whisker plots with the median (center line), 25th–75th percentiles
  (box), 10th–90th percentiles (whiskers), and outliers beyond the whiskers'
