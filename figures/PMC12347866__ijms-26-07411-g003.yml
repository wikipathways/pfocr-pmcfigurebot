caption: Metabolic reprogramming and cancer hallmark pathways vary with antigen-presenting-cell
  (APC) signature activity. (A) Kaplan–Meier plots showing the overall survival rates
  for the high- and low-MHC class APC, dendritic cell (DC) APC, tumor-associated macrophage
  (TAM) APC, and Breg-like APC expression groups. (B) Box plots of the MHC class APC,
  DC APC, TAM APC, and Breg-like APC activity in the StemID cluster of the adults.
  (C) Box plots of the MHC class APC, DC APC, TAM APC, and Breg-like APC activity
  in the StemID cluster of the pediatric dataset. (D) Heatmap of metabolic reprogramming
  in the StemID cluster for the adult dataset. “Heatmaps show Pearson correlation
  coefficients (r) between APC gene expression and metabolic pathway activity across
  single-cell clusters. Only correlations with FDR-adjusted p-values < 0.05 (Benjamini–Hochberg
  correction) are shown.” (E) A heatmap of the cancer hallmark pathways in the StemID
  cluster for the adult dataset. (F) A heatmap of the cancer hallmark pathways in
  the StemID cluster for the pediatric dataset
