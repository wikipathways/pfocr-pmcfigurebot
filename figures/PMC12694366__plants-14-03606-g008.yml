caption: Phenotypic analysis, quantification of total flavonoid content, and expression
  analysis of CtPAL1 and key flavonoid pathway genes in CtPAL1 mutant. (A) Phenotypic
  variations and total flavonoid content in control and mutant plants two weeks after
  the infection. TRV 1 + TRV 2 served as the control, and TRV 1 + pTRV 2-CtPAL1 as
  the mutant. (B) Relative expression levels of CtPAL1 gene and four representative
  flavonoid pathway genes in CtPAL1-mutant plants. Data are shown as mean ± SD of
  three biological replicates. Asterisks indicate significant differences relative
  to the control (* p < 0.05, ** p < 0.01)
