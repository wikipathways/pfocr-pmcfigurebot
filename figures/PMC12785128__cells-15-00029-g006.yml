figure_title: TIMP1 binds to CD63/β1-integrin on macrophages and activates the AKT/mTOR
  pathway.
caption: 'TIMP1 binds to CD63/β1-integrin on macrophages and activates the AKT/mTOR
  pathway. (A) Co-immunoprecipitation (Co-IP) showing the interaction between TIMP1
  and CD63/β1-integrin in RAW264.7 and THP-1-derived macrophages. Cell lysates were
  immunoprecipitated with anti-TIMP1 or control IgG and immunoblotted for CD63, β1-integrin,
  and TIMP1. (B) Reverse Co-IP using anti-β1-integrin confirms the formation of a
  TIMP1-CD63-β1-integrin complex. (C,D) Flow cytometric analysis of CD163+ macrophages
  after treatment with PBS, rTIMP1, rTIMP1 + siCD63, or rTIMP1 + si-β1-integrin. Quantification
  of CD163+ cell percentages is shown (right). (E) Western blot analysis of p-AKT,
  p-PRAS40, and p-mTOR in macrophages treated with PBS, rTIMP1, or rTIMP1 + IL4/IL13.
  (F) Knockdown of CD63 or β1-integrin inhibits TIMP1-induced activation of the AKT/mTOR
  signaling pathway. GAPDH was used as a loading control. Data are presented as mean
  ± SEM from at least three independent experiments. Statistical significance: ***
  p < 0.001'
