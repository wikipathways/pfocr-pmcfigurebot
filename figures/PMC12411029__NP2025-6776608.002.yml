figure_title: Blockade of PERK signaling pathway in mice astrocytes reduced MANF expression
  and exacerbated synapse loss and neuronal damage in the peri-infarct zone.
caption: Blockade of PERK signaling pathway in mice astrocytes reduced MANF expression
  and exacerbated synapse loss and neuronal damage in the peri-infarct zone. (A) Representative
  images of H&E staining on the 7th day after MCAO. The scale is 100 μm. (B, C) Representative
  images of Golgi staining and quantitative analysis of dendrite spine density (n = 3),
  and the scale is 100 μm and 10 μm, respectively. (D, E) western blot of representative
  MANF images and quantitative analysis (n = 3). (F–H) ELISA assay was used to detect
  the expression of inflammatory factors (n = 5). ns, Not significant. ⁣∗p < 0.05,
  ⁣∗∗p < 0.01, ⁣∗∗∗p < 0.001, and ⁣∗∗∗∗p < 0.0001
