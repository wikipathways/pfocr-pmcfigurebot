figure_title: Conservation and divergence between human and chimpanzee intestinal
  epithelial gene regulation
caption: 'A, Comparing single-cell sequencing data between human, chimpanzee, and
  mouse developing intestinal epithelium can illuminate similarities and differences
  between species. B, Developing human, chimpanzee and mouse epithelium integrated
  UMAP with cells colored according to cell type (left) or source (right). EC: Enterochromaffin
  cells. C, Barplots showing the number of differentially expressed genes (DEGs, left)
  and accessible chromatin regions (DARs, right) between human and chimpanzee for
  each intestinal epithelial cell type. D-E, Epithelial cell type average profiles
  of human-chimp differential and conserved gene expression (D) and chromatin accessibility
  (E) features. F, Heatmap indicates top 10 human-chimp differentially expressed enterocyte
  marker genes and nearby differentially accessible chromatin regions. G, Distinct
  human-specific pseudo temporal expression patterns along stem cell (SC) to enterocyte
  (Ent) trajectory (co-expression gene module index with number of genes in parenthesis)
  whereby each line depicting average expression patterns of each gene module in each
  species and shaded area depicting one standard deviation in expression patterns
  with corresponding KEGG pathway enrichment analysis (right). H, Expression profile
  of SLC5A12 along the stem cell to enterocyte differentiation trajectory (left) and
  the accessibility profile in enterocytes and stem cells of different sources of
  differentially accessible chromatin regions (right). Light grey color box highlights
  an SLC5A12 intronic region, chr11:26717719–26718218'
