figure_title: TAF1 loss impairs the activation of differentiation-associated genes
  (see also Figure S5)
caption: 'HSPCs were isolated from adult mice with Taf1 deletion mediated by Mx1-Cre
  and 2 weeks post poly(I:C) induction. A). Sc-RNA-seq assay was performed using purified
  HSPCs. The four tSNE plots shown here were generated by unsupervised clustering
  of cell transcriptomes from 6 merged samples. Each dot represents a cell, and cells
  were colored by samples, groups, gene expression clusters or sequencing depth. The
  annotation of each numbered cluster in Cluster plot: 1: MEP-K; 2: MEP-C; 3: ErP-K;
  4: ErP-C; 5: MEP(cycling); 6: MkP; 7: GMP1-K; 8: GMP1-C; 9: GMP2-K; 10: GMP2-C;
  11: GMP(cycling)-K; 12: GMP(cycling)-C; 13: LMPP1; 14: LMPP2; 15:LMPP3-K; 16:. Basophil/Master;
  17: Eosinophil. The cluster name followed by “C” or “K” indicates that cluster being
  composed of control or cKO cells, respectively. Clusters not identified by a “C”
  or “K” contain both cell types. n=3 B). KEGG pathway analysis of DE genes in the
  HSC/LMPP sub-population. C). The differentiation trajectory map of HSPCs was generated
  using sc-RNA-seq data. Left: pseudo-time plot showing the HSPC differentiation paths.
  Cells were colored according to their pseudo-time values, which represent their
  differentiation progression. Middle: control and cKO HSPCs are shown in different
  colors in the trajectory plot. Right: sub-populations were identified by signature
  genes and labeled accordingly in the plot. The red star indicates a unique sub-population
  in the cKO cells. “C” or “K” following a population name indicates that population
  is comprised of control or cKO cells, respectively. D). Time Series Analysis was
  performed with the RNA-seq data from the in vitro differentiation assay. Venn Diagrams
  show the overlap between DE genes at all time points and the genes in myeloid cell
  differentiation gene ontology term (GO: 0030099); Heatmaps show the relative expression
  level of these genes at day 3, day 5 and day 7 vs day 0 in control and cKO cells
  under macrophage differentiation culture. n=3 E). Line graphs show examples of changes
  in the mRNA level of differentiation- or self-renewal- associated genes as HSPCs
  undergoing terminal granulocyte differentiation. n=3'
