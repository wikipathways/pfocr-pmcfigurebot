figure_title: Combinatorial drug targeting of PI3Kδ pathway proteins enhances patient
  sample responses
caption: (A and B) (A) Relative expression of pS6 (pS235/pS236) and (B) CD71 in APDS
  patient T cells after stimulation for 24 h in the presence of either DMSO vehicle
  control or 100 nM Len. For each patient sample, expression of each marker is normalized
  to the mean of replicates in the DMSO condition. n = 3 biological replicates.(C)
  Representative schematic of combinatorial PI3K pathway targeting with drugs targeting
  p110δ (leniolisib), mTORC1 (rapamycin and everolimus), and mTORC2 (rapamycin).(D
  and E) (D) Expression of pS6 (pS235/pS236) in a patient sample with PIK3R1 p.N564K
  and (E) a patient sample with PIK3CD p.E1021K after 24 h of stimulation with either
  DMSO vehicle control or 100 nM of the indicated drug(s) (leniolisib, Len; rapamycin,
  Rap; and everolimus, Evr). n = 3 biological replicates.(F and G) Same as (D) and
  (E) but for CD71, with representative flow cytometry histograms shown.(H and I),
  Same as (D) and (E) but for TOX after 7 days of activation and expansion with the
  indicated drug treatment. n = 3 biological replicates. Representative flow cytometry
  histograms shown.One-way ANOVA with Tukey’s test for multiple comparisons in (A)
  and (B). One-way ANOVA with Bonferroni’s test for multiple comparisons in (D)–(I).
  Error bars represent mean ± standard deviation.Related to Figure S9
