figure_title: MYR-DM-ANG1-7 regulates the PI3K/AKT/eNOS signaling pathway through
  MasR to participate in vascular regulation.
caption: 'MYR-DM-ANG1-7 regulates the PI3K/AKT/eNOS signaling pathway through MasR
  to participate in vascular regulation. (a) Western blot detection of related protein
  expression after the addition of the inhibitor A779. Detection of the expression
  of total AKT, phosphorylated AKT, total PI3K total eNOS, phosphorylated eNOS, and
  MasR proteins in endothelial cells of the control group, HG + LPS group, cathelicidin-DM
  group, and MYR-DM-ANG1-7 group. (b–d) Semiquantitative analysis of the phosphorylation
  levels of p-eNOS/total eNOS, p-AKT/total AKT, and p-PI3K/total PI3K. (e) Semiquantitative
  analysis of MasR protein expression. Data are represented as mean ± SD (n = 3).
  Statistical analysis: ⁣∗p < 0.05, ⁣∗∗p < 0.01, ⁣∗∗∗p < 0.001 vs. the HG + LPS group.
  ##p < 0.01 and #p < 0.05 vs. the control'
