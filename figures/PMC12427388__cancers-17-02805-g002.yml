caption: 'Mechanisms of action of selected immune checkpoint inhibitors, according
  to [389], including pembrolizumab, durvalumab, and ipilimumab, where Tprog cell—progenitor-like
  exhausted T cell. T-cell activation requires two separate signals: the first involves
  the T-cell receptor (TCR) recognizing antigen–MHC (major histocompatibility complex)
  complexes, while the second comes from the interaction of co-stimulatory molecules
  with their respective receptors on the T-cell surface. In the tumor microenvironment
  (TME), however, co-inhibitory signals become upregulated, hindering T-cell activation
  by engaging with their corresponding receptors (such as PD-1/CD279 with PD-L1/CD274,
  CTLA-4 with B7-1/CD80 and B7-2/CD86). Blocking the CTLA-4 and PD-1/PD-L1 pathways
  enhances immune responses in different ways. Inhibiting CTLA-4 boosts the activation
  and expansion of diverse T-cell populations while decreasing the suppressive effects
  of regulatory T cells. Blocking the PD-1 pathway reactivates dormant T cells that
  target tumors. Using both blockades together may produce a stronger and more sustained
  immune attack against cancer; pembrolizumab, durvalumab, and ipilimumab can partially
  reactivate T cells by blocking these inhibitory pathways'
article_title: Comparative Mechanistic Insights and Therapeutic Potential of Pembrolizumab,
