figure_title: Identifying senescent subpopulations in VSMC clusters
caption: a, UMAP subclustering of cluster 0 (VSMCs) from the ND, HFD and HFD + ABT-737
  mouse groups. Subclusters were then analyzed for populations that increased in the
  HFD condition and were diminished by ABT-737 treatment; subcluster 5 (red) was considered
  potentially senescent, and the percentage (subcluster 5/total cluster 0) is indicated
  for each condition. b, Dot plot analysis of the top 50 RNAs most highly expressed
  in subcluster 5 compared to all subclusters. c, Dot plot analysis of the top 50
  RNAs most highly expressed in subcluster 5 compared across the ND, HFD and HFD +
  ABT-737 groups for cluster 0. d, Reactome pathway analysis of subcluster 5. e, UMAP
  subclustering of cluster 12 (VSMCs) from the ND, HFD and HFD + ABT-737 mouse groups.
  Subclusters were then analyzed for populations that increased in the HFD condition
  and were diminished by ABT-737 treatment; subcluster 4 (red) was considered potentially
  senescent, and the percentage is indicated for each condition. f, Dot plot analysis
  of the top 50 RNAs most highly expressed in subcluster 4 compared to all subclusters.
  g, Dot plot analysis of the top 50 RNAs most highly expressed in subcluster 4 compared
  across the ND, HFD and HFD + ABT-737 groups for cluster 12. h, Reactome pathway
  analysis of subcluster 4. In d and h, statistical significance was established using
  a Benjamini–Hochberg multiple test correction
