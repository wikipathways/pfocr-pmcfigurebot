figure_title: Conjoint analysis of m6A-RIP-seq and RNA-seq data.
caption: Conjoint analysis of m6A-RIP-seq and RNA-seq data. (a) A four-quadrant graph
  highlighting DEGs containing differentially methylated m6A peaks. (b) PPI network
  constructed with dysregulated m6A-modified genes. Cytoscape was used to visualize
  a network incorporating m6A-modified genes/proteins based on the conjoint analysis
  of m6A-RIP-seq and RNA-seq data. (c) KEGG pathway analysis of 105 m6A-modified genes.
  (d) qPCR validation of dysregulated m6A-modified genes. Relative mRNA expression
  levels of 10 representative genes were assessed using qPCR. Data represent mean
  ± standard deviation (SD) from three independent experiments. * p < 0.05, ** p <
  0.01
