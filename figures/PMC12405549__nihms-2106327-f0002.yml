caption: a There was significant difference in expression of TLR-4 (red arrow, P =
  0.02) amongst all TLR family, and b increase expression of TLR-4 (red arrow) amongst
  TLR family (n = 70 variables associated with inflammation). GSE analysis demonstrated
  c significant upregulation of functions associated with migration, blood brain barrier
  crossing, and downstream activation of MyD88 and inflammatory pathways (interferon-mediated
  signaling, NF-KB signaling). d KEGG analysis demonstrated altered regulation of
  innate immune signaling (RIG-I signaling) and cell-cell adhesion
