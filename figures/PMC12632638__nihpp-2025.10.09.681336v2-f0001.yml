figure_title: Proteomic response to neoadjuvant chemotherapy ± bevacizumab
caption: a, Schematic presentation of the NeoAva clinical trial with longitudinal
  tumor biopsy sampling and generation of molecular data. b, Volcano plot of differentially
  expressed proteins on-treatment relative to baseline visualized by plotting false
  discovery rate (FDR) adjusted p-values against the log2 fold change in protein expression.
  c, Boxplot of pathway activity scores of the breast reactive pathway and epithelial-mesenchymal
  transition (EMT) at baseline, on- and post-treatment separated by treatment arm.
  d, Odds ratios for associations between pathway activity scores and RCB 0/1 at baseline,
  and e, on-treatment. Circles represent the point estimate, and whiskers indicate
  95% confidence interval. ∗p < 0.05; ∗∗p < 0.01; ns, not significant
