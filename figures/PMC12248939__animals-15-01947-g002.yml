caption: 'Integrated analysis of antioxidant and glutathione metabolism-related genes
  expression. (A): The interaction network of the Keap1-Nrf2 pathway and antioxidant-related
  genes represents the changes in the expression levels of key genes and their interactions
  under different arginine/lysine ratios. The color represents the relative expression
  value, where red and blue colors indicate up-regulation and down-regulation, respectively.
  The genes not subject to research are marked in gray. (B): KEGG mapping results
  of key genes in the glutathione metabolism pathway. The blue or red box illustrated
  significant downregulation or upregulation of the gene, respectively. White boxes
  or circles represent components not investigated in this study'
