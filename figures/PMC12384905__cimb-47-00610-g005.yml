caption: (A) Protein–protein interaction (PPI) network of key genes constructed using
  the STRING database. Nodes represent proteins; edges represent predicted functional
  associations. Stronger associations are indicated by thicker lines. (B) KEGG pathway
  enrichment network showing key biological pathways associated with the gene set.
  (C) Hub gene subnetwork derived from the PPI network, using cytoHubba. Central hub
  genes are shown with increased node size and intensity, whereas first-degree neighbors
  are color-coded by interaction strength. (D) GO enrichment results categorized into
  biological process (BP), cellular component (CC), and molecular function (MF) ontologies
