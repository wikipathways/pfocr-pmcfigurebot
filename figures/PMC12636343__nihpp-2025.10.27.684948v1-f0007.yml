figure_title: Model for TOCA-1-mediated PLM branch formation
caption: 'TOCA-1 functions as an essential organizing protein that integrates membrane
  dynamics with actin regulatory pathways to control PLM collateral branching. DOCK-11
  acts upstream as a CDC-42 GEF, potentially providing spatial regulation that determines
  where CDC-42 becomes activated along the PLM axon. TOCA-1 serves as a crucial organizing
  protein required for multiple downstream effectors: its F-BAR domain induces membrane
  curvature at branch initiation sites while its coiled-coil and SH3 domains recruit
  and organize CDC-42 and WSP-1 to drive localized Arp2/3-mediated actin nucleation.
  The model incorporates three distinct actin regulatory pathways that converge on
  branch formation: UNC-34/Ena/VASP functions in a parallel pathway to generate linear
  actin filaments for branch elongation and stabilization, while the WAVE complex
  provides additional Arp2/3 activation that acts redundantly with the WSP-1 pathway.
  Netrin signaling integrates with this intrinsic branching machinery to provide spatial
  information that influences TOCA-1 complex assembly or activity. Endocytic components
  (dynamin, clathrin) regulate the availability of membrane components, guidance receptors,
  or other nucleation factors, adding spatial and temporal control to promote branch
  formation at correct axonal positions. TOCA-1 may also be involved in this process,
  inducing membrane curvature and promoting endocytosis. Created using BioRender'
article_title: The actin assembly regulator toca-1 regulates collateral branching
