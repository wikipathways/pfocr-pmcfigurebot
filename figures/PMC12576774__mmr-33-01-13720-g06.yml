figure_title: Exploration of the molecular mechanisms of PHLDB2 promoting the malignant
  characteristics of OSCC.
caption: 'Exploration of the molecular mechanisms of PHLDB2 promoting the malignant
  characteristics of OSCC. (A) Differential gene analysis identified differentially
  expressed genes between PHLDB2 low- and high-expression groups in TCGA-OSCC cohort.
  Threshold: P<0.05 and |log2FC|>1. (B) Differential gene analysis identified differentially
  expressed genes between the PHLDB2 knockdown group and the control group. Thresholds:
  P<0.05 and |log2FC|>1. (C) Intersection analysis revealed downregulated pathways
  shared between PHLDB2-RNAseq and PHLDB2-TCGA enrichment profiles. (D) Integrated
  Hallmark pathway analysis demonstrated enriched pathway for downregulated genes.
  (E) Integrated GO pathway analysis identified enriched biological terms for downregulated
  genes. (F) Integrated KEGG pathway analysis showed enriched pathways for downregulated
  genes. (G) Heatmap displayed expression patterns of PI3K-Akt signaling pathway genes
  in PHLDB2-knockdown vs. control groups. Reverse transcription-quantitative PCR indicated
  reduced PIK3CA expression in PHLDB2-depleted (H) HSC3 and (I) SCC1 cells. **P<0.01,
  ***P<0.001 vs. control-si. GO, Gene Ontology; GSEA, gene set enrichment analysis;
  KEGG, Kyoto Encyclopedia of Genes and Genomes; NES, normalized enrichment score;
  OSCC, oral squamous cell carcinoma; RNAseq, RNA sequencing; TCGA, The Cancer Genome
  Atlas; MsigDB, Molecular Signatures Database; si, small interfering'
