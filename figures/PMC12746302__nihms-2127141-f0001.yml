figure_title: Alcohol’s effect on skeletal muscle protein homeostasis.
caption: Alcohol’s effect on skeletal muscle protein homeostasis. Acute and chronic
  alcohol use decreases skeletal muscle protein synthesis. Alcohol decreases phosphorylation
  of several proteins in the mammalian target of rapamycin (mTOR) pathway (arrows).
  Alcohol increases protein degradation by affecting two major pathways. Alcohol increases
  markers of autophagy. Alcohol increases the expression of two major atrogenes, Atrogin-1
  and muscle ring finger (MuRF1) in the ubiquitin proteasome pathway (UPP)
