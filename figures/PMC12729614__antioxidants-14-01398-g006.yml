figure_title: Proposed mechanism of heme-induced detrusor relaxation.
caption: Proposed mechanism of heme-induced detrusor relaxation. Excess free heme,
  such as that released during intravascular hemolysis, can be metabolized by HO to
  generate CO. CO activates sGC, increasing cGMP levels and leading to inhibition
  of detrusor smooth muscle contraction. In this study, ex vivo exposure to heme reproduced
  this pathway, while pharmacological inhibition of HO (1J) or sGC (ODQ) abolished
  the effect, confirming the involvement of the HO–CO–sGC–cGMP signaling cascade in
  bladder relaxation
