figure_title: Vesicle recycling predominantly occurs through the run-away pathway
  after kiss-shrink exocytosis
caption: '(A) Tomographic slice (left) of a synapse frozen at 70 ms post-AP, showing
  small tethered SVs (purple arrowheads) and small semifused SVs (red arrowheads)
  within the AZ band. Shown on the right are zoomed-in views of individual SVs in
  the AZ band, categorized as small semifused (sSF) and small tethered (sT) SVs. (A1)
  presents a 3D rendering of the presynaptic profile, including the orthogonal view
  of the entire AZ band (magenta, presynaptic membrane; red, semifused SVs; purple,
  small tethered SVs; gray, SVs not in the AZ band). (B) Size distribution of tethered
  SVs in the AZ bands of synapses frozen at 70 ms post-AP, revealing two peaks (black
  arrows). The diameter distribution was fitted with a double-Gaussian function. The
  red and blue lines represent two Gaussian components, and the black dashed line
  represents their sum. (C) Normalized number of small tethered SVs in the AZ bands
  of synapses frozen at different time points post-AP. (D) Example tomographic slices
  of collapsing SVs, including Ω-shaped SVs (pore neck width >22 nm; top) and pits
  (bottom). (E) Normalized number of collapsing SVs per synapse at different time
  points post-AP. (F) Diameter distribution of collapsing SVs, fitted with a double-Gaussian
  function (μ1 = 29.06, σ1 = 5.959; μ2 = 36.57, σ2 = 0.79). The red and green lines
  represent two Gaussian components, and the blue line represents their sum. (G) Normalized
  number of different types of SVs in the AZ bands of synapses frozen at different
  time points post-AP. (H) Schematic diagram depicting the two concurrent routes of
  vesicle exocytosis in hippocampal synapses: the kiss-shrink-run and the kiss-shrink-collapse.
  Arrows indicate transitions between vesicle states, with the arrow thickness roughly
  corresponding to the relative rate of transition. The blue lightning bolts indicate
  synaptic activations triggered with optogenetic stimulation. Data are presented
  as mean ± SEM. Statistical significance was determined using the Mann-Whitney test;
  **p < 0.01, and ***p < 0.001. The number of synapses and vesicles, along with p
  values for significance comparisons, are provided in table S4'
article_title: “Kiss-shrink-run” unifies mechanisms for synaptic vesicle exocytosis
  and hyperfast recycling
