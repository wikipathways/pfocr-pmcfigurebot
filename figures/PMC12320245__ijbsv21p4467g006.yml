figure_title: A schematic illustration of the proposed mechanism through which amlexanox
  attenuates TBI-induced neuronal death.
caption: 'A schematic illustration of the proposed mechanism through which amlexanox
  attenuates TBI-induced neuronal death. (A) Pathophysiological cascade following
  TBI: TBI leads to an excessive influx of intracellular Zn²⁺, which in turn activates
  PDE enzymes. Elevated PDE activity decreases intracellular cAMP levels, resulting
  in reduced activation of PKA. Diminished PKA signaling contributes to the increased
  phosphorylation of p38 MAPK and elevated mitochondrial reactive oxygen species (MT-ROS)
  production, ultimately leading to mitochondrial dysfunction. Concurrently, TBI induces
  ER stress through activating the PERK pathway and phosphorylation of eIF2α, impairing
  lysosomal function. This disruption in lysosomal activity inhibits autophagosome-lysosome
  fusion, causing autolysosome accumulation and inefficient autophagic flux, which
  together exacerbate neuronal apoptosis and cell death. (B) Neuroprotective mechanism
  of AMX following TBI: Post-injury administration of AMX inhibits PDE activity, resulting
  in increased intracellular cAMP levels and reactivated PKA signaling. Activated
  PKA suppresses p-p38 MAPK phosphorylation and reduces MT-ROS generation, thereby
  stabilizing mitochondrial function. In parallel, AMX attenuates ER stress by downregulating
  the p-PERK and p-eIF2α pathways, thereby restoring lysosomal integrity. Enhanced
  lysosomal function promotes autophagosome-lysosome fusion and improves autophagic
  flux by reducing autolysosome accumulation. These combined effects of AMX alleviate
  multiple secondary injury mechanisms and contribute to reduced neuronal death following
  TBI'
article_title: Amlexanox Ameliorates Traumatic Brain Injury by Restoring Autophagy-Lysosomal
  Function via cAMP Signaling Modulation
