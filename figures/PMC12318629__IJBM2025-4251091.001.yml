caption: 'This figure shows how drugs penetrate the skin''s layers to achieve therapeutic
  effects. The skin acts as both a protective barrier and a pathway for drug administration,
  consisting of three main layers: Epidermis: The outermost layer, made mostly of
  keratinocytes. Its surface, the stratum corneum, is a tough barrier that restricts
  most drug entry. Beneath it, the living cells of the viable epidermis depend on
  the dermis for nutrients. Dermis: The middle layer, rich in connective tissue, blood
  vessels, nerves, hair follicles, and glands. Drugs reaching this layer can enter
  the bloodstream for systemic effects. Hypodermis (subcutaneous tissue): the deepest
  layer, containing fat and larger blood vessels. It insulates the body and connects
  the skin to muscles and bones. Some drugs target this layer for slow, sustained
  absorption'
