caption: (A) KEGG enrichment analysis between Control (healthy cells) and insulin
  resistant cells (MOD), (B) KEGG enrichment analysis between insulin resistant cells
  (MOD) and insulin resistant cells treated with peptide (P2). The x-axis represents
  the enrichment ratio of proteins associated with KEGG, while the y-axis lists the
  enriched functional KEGG pathways. Bubble size indicates the number of proteins
  contributing to each domain, and color intensity corresponds to −log10 (p-value).
  Statistical significance was assessed using adjusted p-values corrected for multiple
  testing (Benjamini–Hochberg method), with an adjusted p < 0.05 considered significant.
  KEGG pathways with adjusted p ≥ 0.05 are shown as non-significant enrichment trends
