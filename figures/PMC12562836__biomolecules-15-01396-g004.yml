figure_title: RNA-seq analysis reveals modulation of apoptotic and ribosomal biogenesis
  pathways in OVCAR8 cells following combination treatment with EC359 and trametinib.
caption: RNA-seq analysis reveals modulation of apoptotic and ribosomal biogenesis
  pathways in OVCAR8 cells following combination treatment with EC359 and trametinib.
  (A) Venn diagram showing the overlap of differentially expressed genes (DEGs) in
  OVCAR8 cells treated with EC359, trametinib, or their combination compared to control.
  (B,C) Gene Set Enrichment Analysis (GSEA) shows the top significantly enriched pathways
  in the combination-treated group, including upregulation of apoptotic signaling
  (B) and downregulation of mitochondrial translation and MYC target genes (C). (D)
  Heatmap show activation of several ferroptosis-related genes following combination
  treatment (E) Bar plot displaying the top enriched pathways (ranked by −log10(P))
  from genes uniquely upregulated in the combination group, as identified by Metascape.
  Notable enriched pathways include PRC2-mediated histone and DNA methylation, chromatin
  remodeling, and stress response to metal ion indicating activation of key tumor-suppressive
  and regulatory processes. (F) Bar plot showing the top enriched pathways (ranked
  by −log10(P)) derived from genes uniquely downregulated in the combination group.
  These include ribosome biogenesis, ribosomal large subunit biogenesis, rRNA modification,
  and RNA processing. (G) Western blot showing the levels of c-MYC protein levels,
  and BCL-2 family proteins following combination treatment. Significant genes with
  fold change > 2 and adjusted p value < 0.05 were used for interpreting the biological
  pathways using GSEA. Fold change values in heatmap were calculated by normalization
  of FPKM values to those for control
