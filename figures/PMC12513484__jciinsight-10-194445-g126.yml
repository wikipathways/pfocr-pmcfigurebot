figure_title: Studies on the presence and effect of the DIO2 pathway in iPSC-derived
  NPCs and COs
caption: '(A) Schematic representation of treating iPSC-derived NPCs with T4I125 to
  measure T3I125 production. (B) Representative chromatograms of the medium after
  control and MCT8-NPCs were incubated with T4I125 for 24 hours. (C) Quantitation
  of the DIO2 deiodination in control and MCT8-NPCs; n = 5 DIO2 assays. (D) Volcano
  plots showing the distribution of differentially expressed genes in Control + 1
  nM T4 versus Control NPCs; each point represents the average of 5 WT + 1 nM T4 and
  5 WT samples of pooled NPCs for each transcript. (E) Interpretation of the findings
  in A–D. (F) Schematic of the generation and timing of CO generation, starting with
  iPSCs to a culture of embryoid bodies, followed by neural induction, neuroepithelial
  bud expansion, and maturation. (G) Quantitation of DIO2 deiodination in control
  COs during their first 20 days in culture. n = 4 DIO2 assays per time point, each
  consisting of 4 pooled COs from control COs. (H) Relative SOX2 mRNA levels in control
  COs during their first 20 days in culture. Expression values are mean ± SD of n
  = 3–6 RNA samples, each of them consisting of 4 pooled COs from control COs. (I)
  Schematic representation of the experiment. COs were treated with 1 nM T4 from D7
  to D50 and then dissociated into a single-cell suspension for scRNA-seq. (J) UMAP
  plot showing the cell types identified. (K) Histogram of the relative number of
  cells in T4-COs and control COs. (L) Histograms of the relative number of cells
  in clusters of NPCs. The identification number of each cell cluster is indicated
  at the bottom right corner of each rectangle. (M) Volcano plots showing the distribution
  of differentially expressed genes in T4-COs versus control COs. (N) Gene set enrichment
  analysis reveals gene ontology terms enriched in T4-COs. (O) Histograms of the relative
  number of cells undergoing the indicate cell cycle phase in clusters 1 and 9 of
  control and NPCs. ***P < 0.001 by 2-tailed Student’s t test for comparing DIO2 deiodination
  in iPSC-derived NPCs. Differentially expressed gene thresholds: P < 0.05 and average
  log2(fold change) = 0.26'
