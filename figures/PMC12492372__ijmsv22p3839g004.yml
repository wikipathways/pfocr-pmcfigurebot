figure_title: PRDX3 promotes CCa invasion, lymphangiogenesis of CCa cells in vitro
  via activating NF-κB signaling pathway.
caption: PRDX3 promotes CCa invasion, lymphangiogenesis of CCa cells in vitro via
  activating NF-κB signaling pathway. (A) Western Blot analysis of the effect of PRDX3
  on the expression of NF-κB signaling pathway molecules and downstream metastasis-related
  targets MMP-9 ad VEGF-C. The nuclear protein p84 was used as the nuclear protein
  markers. Nu-p65, Nuclear p65; Cyto-p65, cytoplasmic p65. (B) Western Blot analysis
  of NF-κB signaling pathway molecules and downstream metastasis-related targets MMP-9
  ad VEGF-C after treating the indicated cells with a NF-κB signaling inhibitor BAY-11-7082.
  (C)-(E) NF-κB signaling inhibitor BAY-11-7082 attenuated the stimulatory effects
  of PRDX3 on the migration and invasion abilities of CCa cells. (F)-(G) NF-κB signaling
  inhibitor BAY-11-7082 attenuated the stimulatory effect of PRDX3 on the tube formation
  of HLECs (×200). (H)-(I) NF-κB signaling inhibitor BAY-11-7082 attenuated the stimulatory
  effect of PRDX3 on the migration ability of HLECs. Error bars represent the mean
  ± S.D. of three independent experiments. * P < 0.05, ** P < 0.01, *** P < 0.001
