caption: Network analysis of key regulatory genes associated with MHFD and Rebamipide
  treatment. Interaction network of Mttp, Cyp2c6, and Hspa9 node represents an individual
  gene, highlighting their functional associations. Edges are Co-expression links
  (39.02%) that connect these genes with lipid metabolism (e.g., Apob, Grpel2) and
  detoxification pathways (e.g., Cyp3a23/3a1, Ugt2b10). Physical interactions (25.61%)
  associate Hspa9 with mitochondrial import proteins (Grpel1/2) and ubiquitination
  (TRIM21). Predicted interactions (21.99%) link the genes to innate immunity and
  MAPK signaling, supporting their role in oxidative stress adaptation and inflammation
  resolution
