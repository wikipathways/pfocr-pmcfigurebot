figure_title: The activation and differentiation of B cells and CD8+ Tctx cells.
caption: The activation and differentiation of B cells and CD8+ Tctx cells. (a) B
  cell activation in humoral immunity. B cells can be activated independently of Th
  cells by pathogens displaying repetitive epitopes, leading to B cell receptor (BCR)
  crosslinking and differentiation into short-lived plasma cells that secrete IgM
  antibodies. Alternatively, BCR-mediated antigen uptake followed by MHC-II presentation
  to Th cells induces signaling cascades that promote the generation of long-lived
  plasma cells and memory B cells. This results in high affinity IgG production and
  robust humoral immunity. (b) CD8+ Tctx cell activation in cell-mediated immunity.
  CD8+ Tctx cells recognize infected or transformed cells through T cell receptor
  (TCR)-MHC-I-peptide interactions (step 1), along with co-stimulatory signals via
  CD28 and CD80/CD86 (step 2). This triggers activation of signaling pathways (step
  3) and differentiation into effector and memory Tctx cells (step 4). Effector cells
  secrete cytokines and cytotoxic molecules such as perforin and granzymes, enabling
  the elimination of target cells (step 5). Memory T cells help provide long-term
  protection by quickly responding to a previously encountered antigen (step 6). These
  responses are modulated by Treg and iNKT cells. All one-way arrows indicate activation
  and forward progression along the pathway, bidirectional arrows represent interactions
  between components, and truncated lines indicate inhibition
