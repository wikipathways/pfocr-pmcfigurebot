figure_title: Hsa_circ_0058495/IGF2BP2 promotes the activation of the ERK pathway
  by stabilizing MEKK1 mRNA in an m6A-dependent manner.
caption: Hsa_circ_0058495/IGF2BP2 promotes the activation of the ERK pathway by stabilizing
  MEKK1 mRNA in an m6A-dependent manner. (A-B) PANC1 and BxPC3 cells were transfected
  with siRNA against IGF2BP2 or plasmid expressing IGF2BP2 for 24 hours. The level
  of MEKK1 mRNA was determined by RT-qPCR. (C-D) PANC1 and BxPC3 cells were transfected
  with plasmid expressing IGF2BP2 or empty vectors for 24 hours, then treated with
  actinomycin D (5 μg/mL) for 0, 2, 4, and 6 hours. The half-life of MEKK1 mRNA was
  determined by RT-qPCR. (E-F) BxPC3 cells were treated with 3-Denitroadenosine (DAA)
  (1 μM) or transfected with si-METTL3. The level of MEKK1 mRNA was detected by RT-qPCR;
  MEKK1 protein was determined by immunoblotting with β-actin as loading control.
  (G) The predicated m6A-modified sites on MEKK1 mRNA. (H) Methylation-RNA-immunoprecipitation
  (with anti-m6A) and RT-qPCR were performed to detect the enrichment of m6A modification
  on predicted sites. (I-J) BxPC3 cells were transfected with plasmid expressing hsa_circ_0058495
  or si-0058495 for 48 hours (I) or transfected over-IGF2BP2 with or without si-0058495
  for 48 hours (J), IGF2BP2, MEKK1, p-ERK1/2, ERK1/2, p-SAPK/JNK, SAPK/JNK, p-p38
  and p38 proteins were determined by immunoblotting with β-actin as loading controls.
  ns, no significant; *P < 0.05; **P < 0.01; ***P < 0.001; ****P < 0.0001
