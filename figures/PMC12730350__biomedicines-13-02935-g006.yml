figure_title: GDF6 activates AMPKα through cyclic AMP/exchange protein directly activated
  by cAMP 1 (cAMP/Epac1) pathway.
caption: 'GDF6 activates AMPKα through cyclic AMP/exchange protein directly activated
  by cAMP 1 (cAMP/Epac1) pathway. (A) The levels of cAMP and protein kinase A (PKA)
  activity in PE-stimulated NRVMs with or without GDF6 knockdown. (B) The levels of
  cAMP and PKA activity in PE-stimulated NRVMs with or without rhGDF6 treatment. (C)
  Quantification of cell area in rhGDF6-treated NRVMs with or without adenylyl cyclase
  (AC) inhibition. (D) Rap1-GTP and total Rap1 protein levels in PE-stimulated NRVMs
  treated with siGdf6 or rhGDF6. (E) AMPKα protein levels in PE-stimulated NRVMs with
  or without Epac1 silence in the presence or absence of rhGDF6. (F) Quantification
  of cell area. (G) Epac1 mRNA levels in NRVMs with or without Epac1 silence. (H)
  Quantification of cell area. (I) Epac1 mRNA levels in murine hearts with or without
  Epac1 silence. (J) HW/TL in TAC mice with or without Epac1 silence in the presence
  or absence of AAV9-Gdf6. (K) Quantification of CSA. (L) IVSd and IVSs. (M) FS, LVEDd,
  and LVEDs. n = 6 per group. * p < 0.05 versus matched AAV9-Ctrl-injected TAC mice
  receiving siCtrl injection, # p < 0.05 versus matched AAV9-Gdf6-injected TAC mice
  receiving siCtrl injection. In (A–D,G–I), * p < 0.05 versus the matched groups.
  In (E,F), * p < 0.05 versus matched siCtrl-transfected NRVMs with DMSO treatment
  under PE incubation, # p < 0.05 versus matched siCtrl-transfected NRVMs with rhGDF6
  treatment under PE incubation. One-way ANOVA followed by Tukey post hoc test was
  applied. In (A,B,D,G–I), Student’s two-tailed t-test was performed'
