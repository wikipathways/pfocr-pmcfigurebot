figure_title: Working model and expression level of genes related to RA and BMP signaling
  pathway at GD12.
caption: 'Working model and expression level of genes related to RA and BMP signaling
  pathway at GD12.5 in the sclerotome. (A) RNA-seq result shows the relative RNA expression
  level of Cdx1, Drd2, Olig2, Hoxa5, Hnf1b, and Pitx2 at GD12.5 in the sclerotome
  (n=11 in each group). (B) RT-qPCR result shows the relative RNA expression level
  of Cdx1, Drd2, Olig2, Hoxa5, Hnf1b, and Pitx2 at GD12.5 in the sclerotome (n=6 in
  each group). Data represent mean±SEM. (C) RNA-seq result shows the relative RNA
  expression level of Nog, Chrdl1, MKK3, Dlx5, Osterix, Runx2, Bmp2, Smad1, and Smad6
  at GD12.5 in the sclerotome (n=11 in each group). (D) RT-qPCR result shows the relative
  RNA expression level of Nog, Chrdl1, MKK3, Dlx5, Osterix, Runx2, Bmp2, Smad1, and
  Smad6 at GD12.5 in the sclerotome (n=6 in each group). Data represent mean±SEM.
  (E) Diagram of a working model: VAD leads to the downregulation of the non-Smad-dependent
  BMP signaling pathway through suppression of the RA signaling pathway. Next, osteoblast
  differentiation is inhibited, which leads to sclerotome dysplasia. As a result,
  vertebral formation is suppressed, and CVM is induced. Created with BioRender. RA,
  retinoic acid; BMP, bone morphogenetic protein; GD12.5, gestational day 12.5; CON,
  control; VAD, vitamin A deficiency; RT-qPCR, real-time quantitative polymerase chain
  reaction; SEM, standard error of the mean; CVM, congenital vertebral malformation'
