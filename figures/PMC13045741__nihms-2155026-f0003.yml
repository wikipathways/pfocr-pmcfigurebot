figure_title: Dysregulated E6/E7 expression from integrated and episomal HPV genomes
caption: 'Schematic representation of how high-risk human papillomavirus (HPV) drives
  aberrant expression of the viral oncogenes E6 and E7 via episomal persistence (right)
  and integration into the host genome (left). (A) HPV Linearization: The circular
  HPV genome is linearized, typically by disrupting the E1/E2 region, enabling integration
  into the host genome. (B) Insertion into Host Genes: Integration can occur within
  tumor suppressor genes, leading to their inactivation, or near oncogenes, enabling
  their cis-activation by viral promoters. Integration at or near host super-enhancers
  can also amplify viral transcription. (C) Truncated Insertion: Prior to insertion,
  the linearized HPV genome is subject to host 3’ and 5’ nucleases. Although how truncation
  occurs is not yet established, these nucleases are hypothesized to degrade the viral
  genome before integration. If the E2 suppressor region of the HPV genome is lost
  to degradation, E6 and E7 oncogenes will be overexpressed. (D) Multiple Integration
  Events in the Host Genome: HPV integrates at multiple genomic loci, often in complex,
  rearranged concatemeric forms involving viral and host DNA. Despite multiple insertions,
  a single transcriptionally active integration site typically dominates, often localized
  to the perinucleolar region. (E) Single Active Transcription Site: Active viral
  transcription occurs at a locus where HPV sequences (lacking E2) are adjacent to
  functional splice sites and a host polyadenylation signal (PAS), enabling stable
  oncogene expression through viral, host, or fusion transcripts. (F) Episomal HPV
  - E2 Silencing: The unregulated expression of E6 and E7 oncoproteins can occur without
  integration by the silencing of episomal E2. This is accomplished via CpG methylation,
  histone modifications, enhancer disruption, or selection for escape variants. Each
  pathway converges on transcriptional activation of viral oncogenes, driving malignant
  transformation. Red boxes summarize key oncogenic consequences of each mechanism'
