figure_title: Sex DE in LC, surrounding neurons, and astrocytes
caption: A) Volcano plot illustrating sex DE in the LC domain. Red line indicates
  an FDR threshold of 0.05. B) Volcano plot illustrating sex DE in the Astro domain.
  Red line indicates an FDR threshold of 0.05. C) Volcano plot illustrating sex DE
  in the ACHE, SERT, LC, and WM mixed domain. Red line indicates an FDR threshold
  of 0.05. D) GSEA results for sex-DEGs in the LC, with the sign of the enrichment
  score (NES, normalized enrichment score) indicating enrichment among male-upregulated
  (blue) or female-upregulated (red) genes. GSEA results for all domains are available
  in Table S11. E) Pseudobulk expression per sample of selected cholesterol synthesis
  pathway genes in the LC domain and Astro domain, stratified by sex. * denotes FDR<0.05.
  F-G) As cholesterol synthesis genes are generally astrocyte-expressed, we visualized
  expression in the Astro (yellow) and LC (blue) domains to compare expression patterns
  of a canonical astrocyte-specific gene, AQP4 (F), alongside cholesterol synthesis
  gene HMGCS1 (G) in 2 representative donors (Br1884 and Br5426)
