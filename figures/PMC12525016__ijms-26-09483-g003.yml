figure_title: Translational pathway in placenta accreta spectrum (PAS).
caption: Translational pathway in placenta accreta spectrum (PAS). The schematic illustrates
  the cascade from molecular lesions (defective decidualization with loss of Nitabuch’s
  layer, ↑ MMP-9 and proteolytic activity, dysregulated non-coding RNAs [C19MC, C14MC
  clusters]) to morphological changes (anchoring villi penetrate the myometrium, absent
  decidual barrier, villous tissue adherent to the uterine wall). These abnormalities
  lead to clinical consequences (abnormal adherence, hemorrhage at delivery, increased
  risk with multiple cesarean scars, maternal morbidity/mortality). The flowchart
  also includes exploratory biomarkers under investigation (circulating miRNAs at
  the discovery stage, exploratory plasma proteomics)
