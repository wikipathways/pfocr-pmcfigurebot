figure_title: Hypothetical mechanism linking postoperative oxidative stress, BRCA1
  deficiency, and PI3K/Akt signaling pathway in ovarian carcinogenesis.
caption: 'Hypothetical mechanism linking postoperative oxidative stress, BRCA1 deficiency,
  and PI3K/Akt signaling pathway in ovarian carcinogenesis.This schematic was created
  by the authors using BioRender.com and constitutes an original conceptual illustration
  synthesizing previously published literature.Hypothesis: ROS, BRCA1 mutation, and
  PI3K/Akt1 pathway interactions.ROS directly activates PI3K, which in turn activates
  AKT. Activated AKT promotes cell survival by inhibiting pro-apoptotic factors and
  further sustains proliferation through the mTOR pathway. Additionally, ROS can induce
  double-strand DNA breaks. DNA damage activates ATM, initiating homologous recombination
  (HR) repair through the BRCA1-BRCA2/RAD51 pathway. HR deficiency caused by BRCA
  mutations forces tumor cells to rely on alternative error-prone repair mechanisms
  such as non-homologous end joining (NHEJ), leading to genomic instability and carcinogenesis.OSE:
  Ovarian surface epithelium, GPCR: G protein-coupled receptor, RTK: Receptor tyrosine
  kinase, ROS: Reactive oxygen species, PIP2: Phosphatidylinositol-4,5-bisphosphate,
  PIP3: Phosphatidylinositol-3,4,5-trisphosphate, PTEN: Phosphatase and tensin homolog,
  AKT: Protein kinase B, mTORC: Mammalian target of rapamycin complex, DSB: Double-strand
  break, ATM: Ataxia telangiectasia mutated, BRCA: Breast cancer gene, RAD: Radiation-sensitive
  protein, EMSY: BRCA2-associated protein, HR: Homologous recombination, NHEJ: Non-homologous
  end joining'
