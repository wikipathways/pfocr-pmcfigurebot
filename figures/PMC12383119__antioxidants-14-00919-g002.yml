figure_title: Putative roles of autophagy in folliculogenesis.
caption: 'Putative roles of autophagy in folliculogenesis. Autophagy involvement in
  granulosa cells (GCs) during follicular development is depicted. LC3B is expressed
  from primary through antral follicles. BMP2 and BMP6 suppress the Hippo pathway
  via nuclear translocation of YAP/TAZ, resulting in activation of autophagy and promoting
  GC proliferation. The accumulation of WT1, an autophagy substrate, inhibits GC differentiation:
  Chloroquine, an autophagy inhibitor, inhibits WT1 degradation in GCs. Chloroquine
  also elevates inhibin A (INHA) levels, thereby inhibiting GC differentiation. During
  follicle selection, atretic follicles (Atresia) exhibit increased caspase-3 (CASP-3)
  and LC3B expressions. In GC-specific BECN1 knockout mice, luteal neutral lipid stores
  are markedly reduced, resulting in diminished progesterone production'
