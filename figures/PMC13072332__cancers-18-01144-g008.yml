figure_title: LPCAT1 and MRPL9 regulate hepatocellular carcinoma progression through
  the PI3K/AKT signaling pathway.
caption: LPCAT1 and MRPL9 regulate hepatocellular carcinoma progression through the
  PI3K/AKT signaling pathway. (A) Principal component analysis (PCA) of MRPL9 high-
  and low-expression groups in the TCGA cohort. (B) Top 10 differentially expressed
  genes (DEGs) from the pairwise comparison of the MRPL9-high group versus the MRPL9-low
  group. Genes with |fold change| > 1 and adjusted p < 0.05 are highlighted in red
  (upregulated) and blue (downregulated). (C) PCA of LPCAT1 high- and low-expression
  groups in the TCGA cohort. (D) Top 10 DEGs from the pairwise comparison of the LPCAT1-high
  group versus the LPCAT1-low group. (E) Identification of the top 10 KEGG pathways
  most significantly upregulated in MRPL9/LPCAT1-high groups. (F) Western blot analysis
  of p-AKT, total AKT, and the p-AKT/AKT ratio in Hepa1-6 NC, Hepa1-6 siMRPL9-1, and
  Hepa1-6 siLPCAT1-1 cells. (G) Western blot analysis of p-AKT, total AKT, and the
  p-AKT/AKT ratio in Huh7 NC, Huh7 siMRPL9-1, and Huh7 siLPCAT1-1 cells. (H) Identification
  of the top 10 significantly upregulated (red) and downregulated (blue) Hallmark
  pathways from the MSigDB database in MRPL9/LPCAT1-high groups. Enrichment analysis
  was performed using gene set enrichment analysis (GSEA). (I) Flow cytometric analysis
  of cell cycle distribution in Hepa1-6 and Huh7 cells. Mean ± SEM, n = 3/group. ****
  p < 0.0001. Original western blots are presented in File S1
