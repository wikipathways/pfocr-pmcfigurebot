figure_title: Differentially expressed genes (DEGs) mapped to key metabolic pathways
  associated with leaf color change in Parrotia subaequalis.
caption: Differentially expressed genes (DEGs) mapped to key metabolic pathways associated
  with leaf color change in Parrotia subaequalis. Panels show DEGs involved in (a)
  starch and sucrose metabolism, (b) photosynthesis, and (c) carbon metabolism during
  four developmental stages (S1–S4). Gene expression levels are visualized using log2
  fold-change heatmaps across the stages. In starch and sucrose metabolism (a), up-regulated
  genes included SUS (sucrose synthase), UGP (UDP-glucose pyrophosphorylase), and
  treZ (malto-oligosyltrehalose trehalohydrolase), corresponding to increased D-glucose
  accumulation. In photosynthesis (b), expression changes were observed in PSB28 (photosystem
  II reaction center protein 28) and PSA (photosystem I subunit A), indicating shifts
  in light-harvesting complex activity. In carbon metabolism (c), SCO2 (cytochrome
  c oxidase synthesis homolog) and PDH (pyruvate dehydrogenase) were differentially
  expressed, reflecting modifications in mitochondrial energy pathways and carbon
  flux. Red and green colors represent up-regulation and down-regulation, respectively,
  across leaf stages S1 to S4
