figure_title: Model of the effects of BF and GF treatments on the growth of P.
caption: 'Model of the effects of BF and GF treatments on the growth of P. qamdoensis.
  Under BF treatment, the expression of photoreceptor genes (HYH, CRY1, PHYB, PIF4,
  and HY5) decreases, while genes in the porphyrin and chlorophyll metabolism pathway
  are up-regulated, promoting an increase in the contents of Chl a and Chl b. In the
  sucrose and starch metabolism pathways, most genes show an up-regulated trend, which
  accelerates the decomposition of starch and sucrose, resulting in a decrease in
  their contents. In the hormone signaling pathway, the negative regulators (AUX/IAA,
  GH3) in the auxin pathway are up-regulated, inhibiting auxin-mediated cell elongation;
  at the same time, the expression of genes in the gibberellin pathway is suppressed,
  further weakening the driving force for longitudinal growth. These changes are physiological
  responses of plants to adapt to strong light exposure, such as increasing the thickness
  of mesophyll cells, which collectively lead to the inhibition of P. qamdoensis height
  growth. In contrast, the GF treatment shows an opposite trend: the expression of
  photoreceptor genes is enhanced, the expression patterns of genes in the porphyrin
  and chlorophyll metabolism and sucrose and starch metabolism pathways are opposite
  to those under BF treatment, and the growth-promoting genes in the hormone signaling
  pathways (such as genes in the gibberellin pathway) are up-regulated. Ultimately,
  through physiological regulation, adapting to low-light environments, the growth
  of seedlings is promoted'
article_title: Transcriptome Reveals Growth Responses of Populus qamdoensis Under
  Blue and Green Films
