figure_title: Schematic representation of the role of LPA in AD pathogenesis.
caption: 'Schematic representation of the role of LPA in AD pathogenesis. LPC is transformed
  by ATX into LPA, which interacts with GPCRs in the cell membrane. Then, the Rho/RhoA
  pathway leads to hyperphosphorylation of tau, microtubule disorganization, and actomyosin
  contraction, ultimately producing neurite retraction. Through the MAPK pathway,
  BACE1 is overexpressed, cleaving APP and producing Aβ monomers. Abbreviations: AD—Alzheimer’s
  disease; APP—Amyloid precursor protein; ATX—Autotaxin; BACE1—β-site APP-cleaving
  enzyme 1 (β-secretase); CREB—Cyclic AMP response element binding protein; GPCRs—G-coupled
  protein receptors; GSK-3β—Glycogen synthase kinase-3 β; LPA—Lysophosphatidic acid;
  LPC—Lysophosphatidylcholine; LPE—Lysophosphatidylethanolamine; LPS—Lysophosphatidylserine;
  MAPK—Mitogen-activated protein kinase; PKC—Protein kinase C'
