caption: Proposed mechanistic model of Rebamipide’s therapeutic and preventive actions
  in MASLD. Schematic representation illustrating Rebamipide’s multi-layered mode
  of action in MHFD-induced liver injury, including sequential activation of xenobiotic
  detoxification, mitochondrial defense and protein import pathways, and lipid mobilization
  and export mechanisms. This coordinated metabolic reprogramming underlies Rebamipide’s
  dual role in preventing MASLD onset and reversing established steatosis, highlighting
  its potential as a repurposable therapeutic for metabolic liver disease
