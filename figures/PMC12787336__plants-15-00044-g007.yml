figure_title: In-depth analysis of transcriptional factors (TFs) specifically expressed
  in ago1-38.
caption: In-depth analysis of transcriptional factors (TFs) specifically expressed
  in ago1-38. (A) Venn diagram showing differently expressed TFs in ago1-38, ago1-25,
  and ago1-45. Each circle represents a comparison group. The 77 ago1-38-specific
  TFs are displayed in red font. (B) GO enrichment analysis of the 77 ago1-38-specific
  TFs. The phytohormone signaling-related pathways are marked in red font. (C) KEGG
  analysis of the 77 ago1-38-specific TFs. The phytohormone signaling-related pathway
  is marked in red font. (D) Heatmap showing expression profiles of genes involved
  in phytohormone signaling based on FPKM values. Some genes were co-enriched in GO
  analysis and KEGG analysis, and genes enriched in KEGG analysis are marked in pink
  font. Note that some genes are shared in different hormone signaling pathways. In
  (B,C), the phytohormone and plant–pathogen interaction pathways are marked in colored
  font; the MAPK signal pathway is marked in bold font
