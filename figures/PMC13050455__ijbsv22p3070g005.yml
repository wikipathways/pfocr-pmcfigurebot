figure_title: Apigenin enhances SIRT6-NCOA2 interaction, promotes NCOA2 deacetylation,
  and is associated with PPARα signaling activation.
caption: 'Apigenin enhances SIRT6-NCOA2 interaction, promotes NCOA2 deacetylation,
  and is associated with PPARα signaling activation. (A) Quantification summary of
  acetylated proteomics data. Paired bar graphs display identified and quantified
  acetylation sites, peptides, and proteins. (B) The number of modification sites
  in a protein. (C) Clustering heatmap of differential acetylation sites. Each row
  represents a lysine acetylation modification site (labeled as "protein name_K position"),
  and each column represents a sample (including the control group and various treatment
  doses). The right panel presents the p value for the comparison between the highest
  dose group (100) and the control group (0). The color reflects the relative acetylation
  levels of each site across the samples (Z-score) red indicates higher acetylation,
  while blue indicates lower acetylation. (D) Protein-Protein Interaction (PPI) Network
  of 19 genes. (E) WikiPathways enrichment analysis of differentially expressed proteins.
  Each circle represents an enriched pathway, with circle size proportional to the
  number of differentially expressed proteins in that pathway. The color corresponds
  to the statistical significance of the enrichment (warmer colors indicate more significant
  FDR values). (F) Schematic representation of post-translational modification sites
  in the NCOA2 protein. (G) Proteomic acetylation analysis reveals that apigenin treatment
  reduces acetylation of NCOA2 at lysine residues K780 and K785 (n=3). (H) Heatmap
  of deacetylase family protein expression. The upper graph shows proteomic data,
  and the lower graph shows transcriptomic data. Rows represent classical HDAC enzymes
  (classified as Class I, IIa, IIb, and IV) and Sirtuin family proteins (SIRT1-7),
  and columns correspond to different treatment group samples (T24+0 control and 20,
  40, 100 µM treatment groups). The color represents the relative abundance of gene
  expression as a Z-score (red indicates higher expression compared to the control
  average, blue indicates lower expression). (I-J) Apigenin (100 μM) enhances the
  interaction between SIRT6 and NCOA2, as demonstrated by co-immunoprecipitation.
  (K) Acetylation levels of NCOA2 in T24 cells following apigenin treatment were detected
  using a pan-acetyl lysine antibody. (L) Pan-acetyl lysine antibody was used to assess
  acetylation levels of wild-type NCOA2 and its K780R, K785R, K780Q, K785Q single
  and double mutants following apigenin stimulation. (M) Molecular docking simulation
  of apigenin with SIRT6, showing a binding score of -7.6 kcal/mol. (N) Dual-luciferase
  reporter assays were conducted to evaluate PPARα transcriptional activity in T24
  cells stably expressing NCOA2 K780R/K785R, K780Q/K785Q, or wild-type NCOA2 under
  apigenin treatment (n=4). (O-P) Apigenin enhances the expression of key enzymes
  involved in fatty acid β-oxidation, including FASN, ACC, CPT1A, and ACOX1, through
  deacetylation of NCOA2 at K780 and K785 sites (n=3). Statistical comparisons were
  performed using one-way ANOVA followed by Tukey''s post hoc test. Data are presented
  as mean ± SD. P values are indicated as follows: * p < 0.05, ** p < 0.01, *** p
  < 0.001, **** p < 0.0001; ns = not significant, compared to the control group'
