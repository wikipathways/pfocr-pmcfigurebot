figure_title: NEDD4 stabilizes YAP1 through the inhibiting CMA pathway degradation.
caption: NEDD4 stabilizes YAP1 through the inhibiting CMA pathway degradation. (A)
  Increasing amounts of Myc-tagged NEDD4 (WT or MUT) were transfected into primary
  astrocytes and cell lysates were analyzed using immunoblotting with anti-YAP1 and
  anti-Myc. (B) YAP1 mRNA levels in primary astrocytes transfected with control and
  different amounts of Myc-NEDD4. (C-D) YAP1 protein expression in shNC- and shNEDD4-transfected
  astrocytes was analyzed at the indicated time points after treatment with CHX (10
  μg/ml) (n = 3). (E-F) Indicated protein levels in HEK293T transfected Flag-YAP1with
  or without Myc-tagged NEDD4 (WT or MUT) using CHX (10 μg/ml) and quantified (n =
  3). (G-H) YAP1 protein levels in primary astrocytes transfected with shNEDD4 and
  treated with DMSO (Mock), MG132, 3-MA, Baf A1, CQ, or NH4CI and quantification (I)
  Primary astrocytes transfected with scramble shRNA or ATG5- or BECN1-specific shRNAs
  were co-transfected with shNC or shNEDD4 and lysates were analyzed using immunoblotting.
  (J) The presence of three canonical KFERQ-like motifs in YAP1. (K) HEK293T cells
  were co-transfected with Flag-YAP1, His-HSC70, and HA-LAMP2A. Cell lysates were
  collected to assess the interaction between Flag-YAP1, His-HSC70, and HA-LAMP2A.
  (L) HEK293T cells were co-transfected as indicated. Co-IP analysis of His-HSC70
  interaction with Flag- YAP1 WT or mutants. (M) Primary astrocytes transfected with
  scramble shRNA or HSC70- or LAMP2A-specific shRNAs were co-transfected with shNC
  or shNEDD4 and lysates were analyzed using immunoblotting. Statistical analyses
  were performed using one-way ANOVA for panel H and two-way ANOVA for panels D and
  F, followed by Bonferroni's post hoc correction
