figure_title: Flavonoid biosynthesis genes are induced during nutrient starvation
  and nodulation, with a subset exhibiting NSP1/NSP2-dependent regulation
caption: '(A) Schematic representation of the core flavonoid biosynthetic pathway.
  Key enzymes shown include PAL, phenylalanine ammonia lyase; 4CL, 4-coumarate:coenzyme
  A (CoA) ligase; CHS, chalcone synthase; CHI, chalcone isomerase; IFS, isoflavone
  synthase; FNS, flavone synthase; and FLS, flavonol synthase. ChOMT is chalcone O-methyltransferase
  (OMT), and IMaT is isoflavone malonyl-CoA acyltransferase (MaT). ChOMT, IFS, and
  IMaT are primarily found in legumes and are indicated in green.(B) Heatmaps showing
  selected phenylpropanoid and flavonoid biosynthetic genes regulated by NSP1/NSP2
  in response to nitrogen (N) and phosphorus(P) starvation and activated by NSP overexpression
  in Medicago truncatula. Genes involved in phenylpropanoid and flavonoid biosynthetic
  pathways are annotated. +N−P, −N+P, and −N−P represent the expression of these genes
  in wild-type plants by comparing −N or/and −P conditions to +N+P. The nsp mutants
  show gene expression in nsp mutants compared with wild-type plants under nutrient
  depletion, while NSPox shows NSP overexpression in roots compared with wild type
  under nutrient-replete conditions. The concentrations used were defined as follows:
  −N−P, no NO3− and no PO43−; −N+P, no NO3− and 0.5 mM PO43−; +N−P, 5 mM NO3− and
  no PO43−; and +N+P, 5 mM NO3− and 0.5 mM PO43−. Color scale represents log2 fold
  change. Data from Li et al.48(C) Heatmap showing selected genes induced after rhizobia
  inoculation. Data in the left panel from Schiessl et al.54; M. truncatula ecotype
  jemalong and Sm2011 were used. The right panel shows transcriptome profiling of
  nsp2-2 mutant compared with the wild-type control (A17) under whole-root inoculation
  conditions at 7 days post inoculation (dpi) with Sm2011 on Fahraeus plant agar plates.
  See also Data S1 and S2.(D) Expression analysis of a subset of flavonoid biosynthetic
  genes in wild type (A17), nsp1-1, and nsp2-2 at 3 dpi in soil. Data are presented
  as mean ± SD (n = 3). Statistical significance was determined by Student’s t test.(E)
  Promoter activity of ChOMT1 visualized by GUS (blue) in wild-type A17, myb40-1,
  nsp1-1, and nsp2-2 mutants after rhizobia inoculation. The numbers below the images
  indicate the numbers of roots having a pattern similar to the one shown in the figure
  as representative among the total number of analyzed roots. Scale bars, 200 μm.(F
  and G) Analysis of isoliquiritigenin and 4,4′-dihydroxy-2′-methoxychalcone (DHMC)
  in roots of wild type (A17), nsp1-1, and nsp2-2 at 3 dpi. Boxes show the first quartile,
  median, and third quartile; whiskers show minimum and maximum values; and dots show
  data points (n = 6). FW, fresh weight. Statistical significance was determined by
  Student’s t test.(H) Transactivation assays in Nicotiana benthamiana. The luciferase
  (LUC) activity induced upon the co-expression of NSP1 and/or NSP2 with different
  promoter-LUC reporters was analyzed, and the LUC activity was normalized to the
  Renilla (REN) activity. Data are presented as mean ± SD (n = 3–4 biological replicates).
  Statistical significance was determined by Student’s t test, with p values indicated
  above the columns relative to empty vector (EV) control. The western blot below
  shows that both proteins are expressed. Experiments were repeated three times with
  similar results.See also Figures S1 and S6'
