figure_title: CPS1 as an immune modulator in liver injury and cancer
caption: '(A) In mouse acute liver injury related to acetaminophen (APAP) or Fas-L,
  CPS1 is taken up by monocytes which leads to their M2 polarization. A similar effect
  is observed upon administering recombinant mutant CPS1 (rCPS1 T471N). The M2 monocytes
  can then home to the injured liver to become Kupffer cell tissue macrophages that
  protect the liver from injury. Potential nuclear localization of CPS1, as shown
  schematically, remains to be validated. (B) Two potential pathways by which CPS1
  is involved in cancer immune modulation: (Pathway 1, left panel) Ammonia accumulation
  related pathway. CPS1 downregulation contributes to ammonia accumulation in the
  tumor microenvironment (TME) due to impaired urea cycle function as occurs in some
  cancers like hepatocellular carcinoma (HCC) and colorectal cancer (CRC). The elevated
  ammonia leads to several downstream effects that decrease T cell number and function.
  (Pathway 2, right panel) Tumor cell metabolic reprograming related pathway. CPS1
  downregulation in HCC leads to fatty acid oxidation (FAO) increase and promote tumor
  cell growing by providing ATP. By contrast, CPS1 upregulation in non-small cell
  lung carcinoma (NSCLC) increases pyrimidine synthesis thereby promoting tumor proliferation.
  Metabolic reprograming enables tumor cell growth by outcompeting the immune cells
  for nutrition, coupled with the increase in metabolic byproducts that can lead to
  suppression of T cell function and number, or to increased M2 polarization thereby
  promoting tumor growth. [Diagram was created using BioRender]'
