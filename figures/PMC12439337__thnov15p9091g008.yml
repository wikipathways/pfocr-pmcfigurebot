figure_title: G6PD plays a pivotal role in the action of VPA on disulfidptosis.
caption: 'G6PD plays a pivotal role in the action of VPA on disulfidptosis.G6PD knockdown
  cells were generated through siRNA transfection, and the effectiveness of the knockdown
  model was assessed via western blot analysis. HCC cells (MHCC97-H) were exposed
  to varying concentrations of VPA for 24 h, and the protein levels of G6PD were measured
  to verify the knockdown effect (A), and si-2# was chosen for following assays. Furthermore,
  both wild type and G6PD knockdown HCC cells underwent treatment with VPA for 24
  h, followed by glucose deprivation (10-12 h) to trigger disulfidptosis. The morphological
  changes and cell death were subsequently analyzed in each group (B, Scale bar =
  20 μm). Additionally, the formation of disulfide bonds in cytoskeletal proteins
  (FLNA and DREBRIN) induced by glucose starvation was assessed using non-reducing
  western blot (C). The expression level of Group III was considered as “1”. Phalloidin
  staining was then utilized to examine the actin filament (F-actin) in the various
  groups (D, Scale bar = 10 μm). Given the significance of G6PD in the pentose phosphate
  pathway and NADPH production (E), the activity of G6PD (F) and NADP+-NADPH metabolism
  (G) were measured herein. Moreover, the activity of GR (H) and GSH-GSSH metabolism
  (I) were also investigated in this study. Data are expressed as mean ± SD. The P
  value less than 0.05 was considered statistically significant and the value of Cohen''s
  d over 0.8 represents a large effect size. *: P < 0.05 and Cohen''s d > 0.8 compared
  to Ctrl group or compared between different groups'
