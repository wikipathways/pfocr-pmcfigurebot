figure_title: Auranofin suppresses neutrophilic inflammation by inhibiting the IL-33/ST2
  signaling pathway.
caption: Auranofin suppresses neutrophilic inflammation by inhibiting the IL-33/ST2
  signaling pathway. (A) Immunoblot analysis IL-33, phosphorylated NF-κB p65, MyD88,
  and phosphorylated IκBα in MSU-stimulated THP-1 cells with or without auranofin.
  (B) Densitometric quantification of immunoblotting data in THP-1 cells. (C) Relative
  mRNA expression levels of IL33, NFKBIA (encoding IκBα), MYD88, and RELA (encoding
  NF-κB p65) in THP-1 cells. (D) IL-33 concentrations in THP-1 supernatants measured
  by ELISA. (E) Immunoblot analysis of IL-33, phosphorylated NF-κB p65, MyD88, and
  phosphorylated IκBα in MSU-stimulated BMDMs with or without auranofin. (F) Densitometric
  quantification of immunoblotting data in BMDMs. (G) Relative mRNA expression levels
  of Il33, Nfkbia, Myd88, and Rela in BMDMs. (H) IL-33 concentrations in BMDM supernatants
  measured by ELISA. Data represent mean ± SEM of five independent experiments. *
  p < 0.05; ** p < 0.01; *** p < 0.001. ns, not significant
