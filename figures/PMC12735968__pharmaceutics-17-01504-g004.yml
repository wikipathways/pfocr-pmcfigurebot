figure_title: Drug permeation pathways of topically administered ophthalmic emulsions
  to the posterior eye segment.
caption: Drug permeation pathways of topically administered ophthalmic emulsions to
  the posterior eye segment. This schematic figure illustrates the major ocular pathways
  through which drug-loaded ophthalmic emulsions can penetrate ocular tissues following
  topical administration. The figure highlights the corneal pathway, involving permeation
  across the tear film and corneal epithelium, followed by (i) aqueous humor, lens
  and iris, and vitreous to reach the retina, and/or (ii) sclera, choroid, and retinal
  pigment epithelium (RPE) to reach the posterior retina. It also highlights the conjunctival
  pathway, where the emulsion globules (i) diffuse through the conjunctiva and pass
  through the sclera, choroid, and RPE, and/or (ii) diffuse back to cornea, pass through
  the aqueous humor, lens and iris, and vitreous humor, and/or (iii) diffuse through
  the blood vessels and systemic circulation to access the posterior segment. The
  black colored arrows represent corneal pathway, whereas the green colored arrows
  represent conjunctival pathway
