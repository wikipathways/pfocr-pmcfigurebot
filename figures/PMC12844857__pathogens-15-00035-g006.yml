figure_title: GO enrichment analysis was conducted for differentially expressed lncRNA-associated
  genes among treatment groups relative to the control (P1).
caption: 'GO enrichment analysis was conducted for differentially expressed lncRNA-associated
  genes among treatment groups relative to the control (P1). The enriched GO terms
  were categorized into biological process (BP, red), cellular component (CC, blue),
  and molecular function (MF, green). Compared with the control, the vaccine group
  (P2 vs. P1) showed enrichment in metabolic and cellular processes; the IFN-α1 group
  (P3 vs. P1) displayed enrichment in immune and stress response–related terms; and
  the IFN-ω5 group (P4 vs. P1) exhibited broader enrichment involving protein binding,
  catalytic activity, and membrane-associated processes. These results indicate distinct
  functional regulation patterns of lncRNA-targeted genes under PRRSV infection and
  type I interferon stimulation. Some long terms are truncated with ellipses in the
  axis labels; their full names are provided here for clarity: cellular macromolecule
  metabolic process, antigen processing and presentation of peptide antigen, cellular
  protein modification process, phosphate-containing compound metabolic process, intracellular
  membrane-bounded organelle, transferase activity, transferring phosphorus-containing
  groups, phosphotransferase activity, alcohol group as acceptor, intramolecular oxidoreductase
  activity, interconverting aldoses and ketoses, cysteine-type endopeptidase activity
  involved in apoptotic signaling pathway, positive regulation of immune system process,
  cellular response to chemical stimulus, protein phosphorylated amino acid binding,
  and protein serine/threonine kinase activity, regulation of protein metabolic process'
