caption: 'Apelin promotes integrin production and cell motility via the STAT3 pathway.
  (A-F) Cells were treated with STAT3 inhibitor (10 μM) or transfected with STAT3
  siRNA for 24 hours then with apelin, the wound healing, cell migration and integrin
  mRNA expression was examined (n=3). (G&H) PC3 cells were treated with apelin or
  pretreated with ERK, p38 and JNK inhibitor then with apelin, the STAT3 phosphorylation
  was examined by Western blotting (n=3). * p < 0.05 compared with the control group.
  # p < 0.05 compared with the apelin-treated group'
