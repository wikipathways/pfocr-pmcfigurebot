figure_title: Molecular pathways regulating hepcidin transcription and iron metabolism
  in liver.
caption: Molecular pathways regulating hepcidin transcription and iron metabolism
  in liver. Hepcidin expression is regulated by hepatic iron stores and plasma iron
  levels through the BMP2/6–BMPR–SMAD signaling pathway, modulated by hemojuvelin,
  matriptase-2, and neogenin. Plasma iron stimulates hepcidin via TFR1–HFE–TFR2 complex
  enhancing BMP signaling; while inflammation upregulates hepcidin through IL-6 activation
  of the JAK–STAT pathway. In contrast, erythropoietin-stimulated erythroblasts suppress
  hepcidin by secreting erythroferrone, which inhibits BMP2/6 signaling. Cellular
  iron homeostasis involves iron uptake (TFR1, STEAP3, DMT1), export (ferroportin),
  and storage in ferritin. Autophagic degradation of ferritin (ferritinophagy), mediated
  by NCOA4, releases iron into the labile pool, increasing reactive oxygen species
  (ROS) and promoting ferroptosis (Illustration by authors)
