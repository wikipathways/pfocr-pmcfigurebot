figure_title: Strategy to analyze mechanisms of ICH pathogenesis and repair by quantitative
  single cell RNA sequencing
caption: (A); H&E-stained images of sagittal sections through the cerebral cortices
  of WT (Nestin-Cre;Itgb8 +/+) and KO (Nestin-Cre;Itgb8flox/flox) mice at P0 (upper
  panels), P5 (middle panels), and P10 (lower panels). Note that KO mice display obvious
  cortical hemorrhage at P0 and P5 (arrows), which is largely resolved by P10. Scale
  bars, 50 μm. (B); Immunofluorescent analysis of WT (left panels) and KO (right panels)
  cerebral cortices at P5 using anti-CD31 antibodies to label vascular endothelial
  cells (red) in combination with anti-GFAP (green) to label astrocytes (top panels)
  or anti-Iba1 (green) to label microglia (bottom panels). Note the increase in GFAP+
  and Iba1+ reactive astrocytes and microglial cells in the hemorrhagic cortices (arrows).
  Scale bars, 100 μm. (C); Experimental workflow for scRNAseq experiments to identify
  genes and pathways linked to hemorrhage development and repair in the neonatal cerebral
  cortex
article_title: Single Cell RNA Sequencing and Spatial Profiling Identify Mechanisms
