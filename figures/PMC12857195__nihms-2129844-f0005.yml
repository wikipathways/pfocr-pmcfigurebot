  and corrected p<0.05 for pathway analysis from Kyoto Encyclopedia of Genes and Genomes
  (KEGG), WikiPathways (WP), Reactome pathways, Reactome reaction pathways, and GO
  biological process (GO BP) glycolysis related terms
