caption: Proteomic pathways underlying intermittent fasting (IF) mediated protection
  against Chronic cerebral hypoperfusion (CCH). Pathway enrichment and molecular network
  analyses were conducted using Ingenuity Pathway Analysis (IPA). (A-D) Canonical
  pathway enrichment analysis at indicated time points post-BCAS. Bar plots show significantly
  enriched pathways with color coding reflecting activation states (orange, activated;
  blue, inhibited). The Y-axis represents -log(p-value). Data compare IF-CCH versus
  AL-CCH proteomic profiles. n = 5 mice in each experimental group
