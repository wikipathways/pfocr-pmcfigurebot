figure_title: OC immune phenotypes are characterized by distinct TILs and TME states
caption: '(A) Schematic representation of the HiTide-UPENN treatment-naive OC cohort
  (N=51 FFPE tissues for mIF imaging and N=71 snap frozen material for bulkRNA). (B)
  Example of mIF panel with deconvoluted images for each marker: arrows indicate the
  TILs subset of interest as labelled in the upper part. (C) Proportions of T cell
  subset of interest out of total CD8+ T cell profiled by mIF according to immune
  phenotypes. Total CD8+ T cell density (cells/mm2) according to immune phenotypes
  reported in the upper line. (D) Proportions of CD8+PD1+ T cell subset out of total
  CD8+ T cell profiled by mIF according to immune phenotypes. (E) Left: schematic
  representation of the NHS I/II cohort stained by mIF for a T cell exhaustion panel
  (N=270) and a T cell resident panel (N=237). Right: heatmap showing the median cell
  density (log10 scale) of the different T cell subsets clustered according to immune
  phenotype. (F-G) Fractions of CD3+PD1+ and CD3+CD8+CD69+CD103+ T cell subsets identified
  by mIF according to immune category. (H) Selected significant differential pathways
  from bulkRNA sequencing analysis in the HiTide-UPENN cohort among the four immune
  categories (full list in Supplementary Table 2).Data shown as mean ± SD in (C,D,F,G,H).
  Statistical analysis: unpaired, two-tailed Wilcoxon-rank test (C,D,F.G), corrected
  by Bonferroni correction (H). p values <0.05 considered significant. Also see Figure
  S2'
