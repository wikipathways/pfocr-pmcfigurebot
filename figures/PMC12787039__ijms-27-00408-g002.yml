figure_title: Phosphate-induced cellular damage mechanisms.
caption: 'Phosphate-induced cellular damage mechanisms. In VSMCs, extracellular phosphate
  overload promotes phosphate influx through the PiT-1 cotransporter, triggering mitochondrial
  dysfunction, NOX4-derived ROS production, and activation of pro-inflammatory (NLRP3
  inflammasome) and profibrotic pathways (NF-κB, TGF-β, and Wnt/β-catenin). These
  events collectively result in cytokine release. The resulting inflammatory mi-lieu,
  together with increased expression of Runx2, osteocalcin, and BMP-2, and decreased
  levels of miR-125b, drives the acquisition of an osteogenic phenotype, which is
  further exacerbated by the formation of CPPs. In ECs, high phosphate concentrations
  similarly induce oxidative stress, mitochondrial dysfunction, NOX4-derived ROS production,
  inflammation, and fibrosis through CPPs and the NF-κB, TGF-β, and Wnt/β-catenin
  pathways. Excess phosphate also induces cell death and senescence through CPP formation
  and eNOS uncoupling. VSMCs: Vascular Smooth Muscle Cells; PiT-1: Sodium-dependent
  phosphate cotransporter 1; NOX4: NADPH Oxidase 4; ROS: Reactive Oxygen Species;
  NLRP3: NOD-, LRR- and pyrin domain-containing protein 3; NF-κB: Nuclear Factor kappa
  B; TGF-β: Transforming Growth Factor Beta; MIA: Malnutrition–Inflammation–Atherosclerosis;
  Runx2: Runt-related transcription factor 2; BMP-2: Bone Morphogenetic Protein 2;
  CPPs: Calciprotein Particles; ECs: Endothelial Cells; eNOS: Endothelial Nitric Oxide
  Synthase; CKD: Chronic Kidney Disease'
