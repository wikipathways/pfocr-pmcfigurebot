figure_title: Conceptual overview of immunogenomic immune escape mechanisms in brain
  metastases.
caption: 'Conceptual overview of immunogenomic immune escape mechanisms in brain metastases.
  (A) Schematic illustration of tumor dissemination from the primary tumor to the
  central nervous system (CNS), where metastatic tumor cells establish within a distinct
  CNS immune microenvironment. (B) Major immune escape mechanisms identified in brain
  metastases. Tumor cells may suppress anti-tumor immunity through activation of the
  adenosine pathway via CD39 and CD73, leading to extracellular ATP degradation and
  adenosine-mediated T-cell inhibition. In parallel, immune checkpoint signaling through
  PD-L1 expression on tumor cells and PD-1 on T cells contributes to immune suppression.
  In addition, specific oncogenic alterations, including KRAS, PIK3CA, and APC, are
  associated with distinct immune phenotypes and may influence the activation of immunoregulatory
  pathways. (C) Integration of adenosine pathway activity and PD-L1 expression defines
  four immunogenomic subtypes of brain metastases: adenosine-high/PD-L1-high (dual
  immune suppression), adenosine-high/PD-L1-low (adenosine-driven immune escape),
  adenosine-low/PD-L1-high (PD-L1–driven phenotype), and adenosine-low/PD-L1-low (immune-cold
  phenotype). Created with BioRender.com'
