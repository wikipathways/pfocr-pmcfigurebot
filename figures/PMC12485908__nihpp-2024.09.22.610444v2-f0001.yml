figure_title: An integrated single-cell atlas of human SAT vascular cells reveals
  extensive heterogeneity
caption: |-
  a, UMAP projection of 68,503 vascular cells from human subcutaneous adipose tissue (SAT), identifying ten distinct cell populations. b, Dot plot displaying representative marker gene expression across the populations shown in (a). Dot size represents the proportion of cells expressing each gene; color denotes expression level (red: high, grey: low). Genes highlighted in red were validated at the protein level. c–e, Immunohistochemical staining of wholemount human adipose tissue for proteins encoded by marker genes in venous (V1–V3; c), capillary (C1–C2; d), and arterial (Ar; e) populations. White arrowheads mark ECs positive for the target protein. f,
  Top: Immunohistochemical staining for marker proteins of the sub-AdEC population. Bottom: Corresponding feature plots showing gene expression. White arrowheads mark ECs positive for the target protein. Black arrowheads indicate populations with pronounced expression. g, Top: Representative contour plots from conventional flow cytometry showing sub-AdECs co-expressing the hematopoietic marker CD45 (CD31+CD34+CD45+) or the fibroblastic marker PDGFRA (CD45⁻CD31+PDGFRA+) in human SAT stromovascular cells. Bottom: Corresponding feature plots illustrating gene expression. Black arrowheads indicate populations with pronounced gene expression; color scale denotes expression level (red: high, grey: low). h, Representative in-focus images captured by ImageStream showing sub-AdECs in bright field (BF), co-expressing the endothelial proteins CD144/VE-Cadherin (yellow) and CD31 (red), together with either the hematopoietic marker CD45 (CD144+CD31+CD45+; top) or the fibroblastic marker PDGFRA (CD144+CD31+PDGFRA+; bottom). i, Representative sections showing the spatial distribution of deconvolution scores for major vascular cell populations within the human adipose tissue vascular niche, as inferred by Cell2location. Color scale represents deconvolution score (red: high, blue: low). j, Bar plots showing five representative Gene Ontology (GO) terms among the most significantly enriched pathways in venous, capillary, arterial, and sub-AdEC cell populations. Bolded GO terms have been highlighted in the text. The x-axis indicates the number of associated genes. Scale bars (c-f): 50μm; h: 7μm
