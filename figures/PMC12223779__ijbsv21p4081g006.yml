figure_title: ZNF662 could down-regulate the transcription activity of NGF in TNBC
  cells.
caption: ZNF662 could down-regulate the transcription activity of NGF in TNBC cells.
  (A) Compared with control cells, the entire distribution of differentially expressed
  genes in ZNF662-overexpressing MB231 cells is shown as a volcano plot. (B+C) Hierarchical
  cluster analysis of screened differentially expressed genes in R software is shown
  as a heat map. (D) KEGG pathway classification of differentially expressed genes.
  The rich factor represents the proportion of differentially expressed genes in specific
  terms, and the size of the dots represents the number of relevant differentially
  expressed genes. (E) Pearson's correlation analysis exhibited the correlation between
  ZNF662 and NGF in normal mammary tissues from GEPIA2 database. (F) NGF mRNA expression
  in TNBC cells stably transfected with ZNF662 was detected by qRT-PCR. (G) input%
  of NGF DNA by anti-Flag antibody was determined by ChIP-qPCR. (H) Luciferase reporter
  activity assays were performed to detect the regulation of ZNF662 on NGF. Student's
  t-test was used. All data are presented as the mean ± SD. ***p < 0.001
