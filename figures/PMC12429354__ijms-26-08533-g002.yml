figure_title: Integrative analysis of bulk GSVA and single-cell data processing.
caption: 'Integrative analysis of bulk GSVA and single-cell data processing. (A) PCA
  visualization demonstrated stable cellular distributions across samples with minimal
  batch effect susceptibility. (B) Clustering resolution was optimized to refine single-cell
  grouping. (C) UMAP analysis revealed systematic partitioning of cells into 12 distinct
  clusters. (D,E) Manual annotation using canonical marker genes categorized cells
  into 8 major types. (F): The relationship between the marker genes of the eight
  types of cells mentioned above, along with the relevant pathways enriched by GO
  analysis'
