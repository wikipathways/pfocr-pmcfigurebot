figure_title: Combination therapy with STING agonist and IDO1 inhibitor improves antitumor
  immunotherapy under in vitro conditions
caption: (A) Violin plot showing differentially expressed genes (DEGs) in myeloid
  and monocyte clusters from MC38 tumors after MSA-2 treatment, based on scRNA-seq
  analysis. (B) Relative expression of key cytokine and chemokine genes in dendritic
  cells (DCs) after MSA-2 treatment. (C–E) Flow cytometric analysis of DC maturation.
  Representative plots and quantification of the costimulatory molecules CD80/CD86
  (C and D) and MHC class II (E and F) on bone marrow–derived dendritic cells (BMDCs)
  after various treatments (n = 3). (G) Western blot analysis evaluating the phosphorylation
  status of proteins associated with the STING pathway. (H) Quantitative real-time
  PCR (qRT-PCR) analysis of inflammation-associated genes (Ifnb1, Ifng, Il6, and Tnf)
  in BMDCs subjected to different treatments (n = 3). (I) Schematic representation
  of the in vitro validation of drug-enhanced cytotoxicity mediated by antigen-specific
  CD8+ T cells. Created with BioRender. (J) Evaluation of cytotoxicity using LDH assay
  and CCK8 assay for evaluating the viability of tumor cells (n = 3). (K) Flow cytometric
  analysis of specific cell death, showing the percentage of PI+ cells in the target
  B16-OVA population (n = 3). Data are presented as the mean ± SD. *P < 0.05, **P
  < 0.01, ***P < 0.001, ****P < 0.0001. One-way ANOVA was employed for the evaluation,
  with Tukey’s correction for multiple comparisons
article_title: Targeting STING-induced immune evasion with nanoparticulate binary
  pharmacology improves tumor control in mice
