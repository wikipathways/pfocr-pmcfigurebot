figure_title: TLR9 acts downstream of IL-1α to mediate NET formation and hepatocyte
  apoptosis in ASH.
caption: 'TLR9 acts downstream of IL-1α to mediate NET formation and hepatocyte apoptosis
  in ASH. (A) Volcano plot of RNA-seq data showing differentially expressed genes
  in neutrophils treated with IL-1α compared to untreated controls. TLR9 was among
  the significantly upregulated genes (red dots, n = 3 per group). (B) KEGG pathway
  enrichment analysis of 46 upregulated genes identified Toll-like receptor signaling
  as the most enriched pathway. (C) Experimental timeline. Mice were pair-fed or fed
  an ethanol-containing Lieber-DeCarli diet for 10 days. E6446 (a TLR9 inhibitor,
  20 mg/kg, orally [p.o.]) was administered 24 and 15 hours prior to euthanasia. (D,
  E) Serum ALT and AST levels were significantly reduced in EtOH-fed mice treated
  with E6446 compared to untreated ASH mice (n = 6 per group). (F, G) Representative
  H&E and Oil Red O staining of liver sections showing improved histology and reduced
  lipid accumulation in the E6446 group. Scale bar = 100 μm. (H) Immunofluorescence
  staining of liver tissues showing reduced intrahepatic NET formation (MPO: red;
  CitH3: green; DAPI: blue) after E6446 treatment. Original images, scale bar = 50
  μm; magnified insets, scale bar = 10 μm. (I, J) Representative TUNEL staining and
  quantification of TUNEL-positive areas showed a reduction in hepatocyte apoptosis
  in E6446-treated mice (n = 6 per group). Scale bar = 100 μm. (K) Western blot and
  densitometric quantification of hepatic TLR9, CitH3, and Cle-CASP3 levels. E6446
  treatment significantly reduced expression of all three proteins (n = 6 per group).
  Data are presented as mean ± SEM. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001;
  ns, not significant. Statistical comparisons were performed using one-way ANOVA
  followed by Tukey''s multiple comparisons test'
