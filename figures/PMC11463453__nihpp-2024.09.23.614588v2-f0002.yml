figure_title: mTORC1 and Myc pathways are hyperactivated in MPC overexpressing fat
  body cells
caption: a. Schematic of the mTORC1 pathway. The mTORC1 pathway is activated by pro-growth
  signals such as insulin, leading to the phosphorylation of S6 kinase (S6K) and 4EBP.
  S6K phosphorylates ribosomal protein S6, while 4EBP phosphorylation inactivates
  4EBP and releases elongation factor eIF4E. These events increase ribosomal assembly
  and elongation rates, thereby enhancing protein synthesis.b-c. b) Representative
  images of fat body clones with S6k over-expression, control clones, and MPC+ clones,
  stained for phosphorylated S6 (p-S6) in red (top panels) and white (bottom panels).
  Arrows indicate clonal cells with the specified genetic manipulation. The scale
  bar represents 20 μm. c) Quantification of total p-S6 fluorescence intensity in
  GFP-positive cells compared to neighboring GFP-negative cells in MPC+ versus control
  clones. Data are presented as mean ± s.d. with statistical significance as scored
  with One-way Annova test.d-e. d) Representative images of fat body clones with Rheb
  over-expression, control clones, and MPC+ clones stained for phosphorylated 4EBP
  (p-4EBP) in red (top panels) and white (bottom panels). Arrows indicate clonal cells
  with the specified genetic manipulation. The scale bar represents 20 μm. e) Quantification
  of total p-4EBP fluorescence intensity in MPC+ versus control clones with statistical
  significance as scored with One-way Annova test.f-g. f) Representative images of
  fat body clones with Myc knockdown, control clones, and MPC+ clones stained for
  Myc protein in red (top panels) and white (bottom panels). Arrows indicate clonal
  cells with the specified genetic manipulation. The scale bar represents 20 μm. g)
  Quantification of total Myc fluorescence intensity in MPC+ versus control clones
  with statistical significance as scored with One-way ANOVA test.h-i. h) Representative
  images of fat body clones from starved wild type, control clones, and MPC+ clones,
  stained for phosphorylated eIF2α (p-eIF2α) in red (top panels) and white (bottom
  panels). Arrows indicate clonal cells with the specified genetic manipulation. The
  scale bar represents 20 μm. i) Quantification of total p-eIF2α fluorescence intensity
  in MPC+ versus control clones with statistical significance as scored with One-way
  ANOVA test. Data are presented as mean ± s.d.One-way ANOVA tests were performed
  to evaluate the statistical significance of the data, with p-values noted in the
  graph if significance was observed
