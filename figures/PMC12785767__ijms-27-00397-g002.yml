figure_title: Stage-specific regulation of lipid metabolism genes and pathways in
  bovine oocytes.
caption: 'Stage-specific regulation of lipid metabolism genes and pathways in bovine
  oocytes. (a) Pathway activity scores by maturation stage. Module scores reveal reduced
  Elongation and Degradation (p < 0.01) in MII, while Biosynthesis remains stable
  (ns). (b) Effect-size analysis of module-specific genes. Dot plot of Cohen’s d effect
  size (GV vs. MII). Hollow circles: MII-enriched genes. Dashed line: null effect.
  (c–k) Stage-dependent expression of shared lipid metabolism genes. Box plots of
  genes shared between modules, showing significant downregulation from GV to MII.
  (l,m) CPT1 gene expression dynamics. Only CPT1C is significantly reduced in MII.
  (n) Stable CPT2 expression. CPT2 (critical for acylcarnitine-to-acyl-CoA conversion)
  shows no significant change (ns). Statistical significance is indicated as ** p
  < 0.01, *** p < 0.001; ns, not significant (p > 0.05)'
