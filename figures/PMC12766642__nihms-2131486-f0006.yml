figure_title: Glycemic-Dependent Pathway Analysis of Tregs and γδ T-cells with γδ
  T-cell IL-17A Production Studies
caption: 'A. Canonical IPA analysis of differentially expressed genes between normalglycemic
  and hyperglycemic phenotypes within cluster 0 (identified as γδ T-cell) B. Canonical
  IPA analysis of differentially expressed genes between normalglycemic and hyperglycemic
  phenotypes within cluster 2 (identified as Tregs). C. Relative mRNA expression of
  IL17A quantified by RT-qPCR using mouse splenic γδ T-cells incubated in normal glucose
  (NG, 5 mM), osmotic mannitol control (M, 25 mM), or high glucose condition (HG,
  25 mM). D-F. Relative IL17A mRNA expression in γδ T-cells incubated in NG or HG
  with varying concentrations of (B) lipopolysaccharide (LPS; 0.2, 1 and 5ug/ml),
  (C) advanced glycation end products (AGE; 50, 100, 200ug/ml) or (D) tumor necrosis
  factor (TNF; 10, 50, 250 ng/mL). G. Quantification of IL17A/F protein in the supernatant
  by ELISA using mouse splenic γδ T-cells under NG, M, or HG conditions. H. Quantification
  of IL17A/F in γδ T-cells under NG or HG conditions that were treated with LPS (left),
  AGE (middle), or TNF (right) at given concentrations. Fig. 6C–H: Data is shown as
  mean ± SEM from three independent experiments. *P < 0.05, Student’s t-test. Abbreviations:
  ns: not significant, *P < 0.05 by one-way ANOVA with Tukey’s post-hoc test'
