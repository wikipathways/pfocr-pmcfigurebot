figure_title: Metabolic pathways involved in fatty acid production by C.
caption: 'Metabolic pathways involved in fatty acid production by C. oleaginosus.
  The focus is on the generation of acetyl-CoA (Ac-CoA) as a central intermediate
  for fatty acid and isoprenoid production. Enzymes are highlighted in bold. The breakdown
  of the different amino acids and individual aromatic compounds as well as the phosphoketolase
  pathway were not considered. In the figure, AACT and HMGS are displayed in the cytosol,
  where they are most frequently found, but they have also been reported in other
  organelles such as the endoplasmic reticulum. The figure was adapted after [48,49,50,51,52,53,54,55,56].
  1,3-BPG: 1,3-Bisphosphoglycerate; AACT: Acetyl-CoA acetyltransferase; AcAc-CoA:
  Acetoacetyl-CoA; ACC: Acetyl CoA carboxylase; ACL: ATP citrate lyase; ACS: Acetyl-CoA
  synthetase; BGL: β-Glucosidase; DHAP: Dihydroxyacetone phosphate; FAA: Fatty acyl-CoA
  synthetase; FBA: Fructose-bisphosphate aldolase; Fru-1,6-BP: Fructose 1,6-bisphosphate;
  Fru-6-P: Fructose 6-phosphate; G3P: Glycerol 3-phosphate; GA3P: Glycerinaldehyde
  3-phosphate; GAPDH: Glyceraldehyde 3-phosphate dehydrogenase; GK: Glycerol kinase;
  Glc-6-P: Glucose 6-phosphate; GlcN-6-P: N-Acetyl-glucosamine 6-phosphate; GPD: Glycerol-3-phosphate
  dehydrogenase; HMGR: Hydroxymethylglutaryl-coenzyme A reductase; HMGS: Hydroxymethylglutaryl-CoA
  synthase; HMG-CoA: Hydroxymethylglutaryl coenzyme A; HXK: Hexokinase; LAI: L-Arabinose
  isomerase; MDH: Malate dehydrogenase; NAG: N-Acetyl-β-d-glucosaminidase; PDH: Pyruvate
  dehydrogenase; PFK: Phosphofructokinase; PGI: Glucose-6-phosphate isomerase; PP:
  Pentose phosphate; RK: Ribokinase; Rib-5-P: Ribulose 5-phosphate; RPE: Ribulose
  5-phosphate epimerase; SE: Sterol ester; SQ: Squalene; TAG: Triacylglyceride; TCA:
  Tricarboxylic acid; TPI: Triosephosphate isomerase; XDH: Xylitol dehydrogenase;
  Xylu-5-P: Xylulose 5-phosphate; XR: Xylose reductase. Created at https://BioRender.com'
