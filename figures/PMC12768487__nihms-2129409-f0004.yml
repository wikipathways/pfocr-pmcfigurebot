caption: Effects of SIRT3 knock-down on transcription in OVCA433 cells cultured in
  2D adherent conditions and as 3D MCAs. A. Volcano plots of differentially expressed
  genes in OVCA433 cells following SIRT3 siRNA-mediated knock-down in adherent and
  MCA culture conditions (n = 4; Dotted lines indicate significant cut-off of p <
  0.05 and log fold change >0.5, Supplemental Table 1). Venn diagram illustrating
  overlap of up and downregulated genes shared by OVCA433 cells cultured under adherent
  (2D) or multicellular aggregate (MCA; 3D) conditions following SIRT3 knockdown (cut
  off p.adj <0.05). B. Signaling, Reactome and TFEA analysis of gene expression changes
  following SIRT3 knock-down illustrates limited changes in significantly enriched
  pathways. C. Venn diagram and heatmaps of DEGs altered by both SIRT3 and SOD2 knock-down
