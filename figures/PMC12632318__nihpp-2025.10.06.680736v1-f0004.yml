figure_title: Predicted cell-cell interactions using Cellchat
caption: (A). PMN-MDSCs from septic older adult male mice had greater predicted interactions
  with CD8+ T lymphocytes compared to septic young adult male mice. (B) PMN-MDSCs
  from septic older adult female mice had greater interactions with Treg lymphocytes
  and CD4+ T lymphocytes compared to septic young adult females. (C) M-MDSCs from
  septic older adult males had greater interactions with CD8+T lymphocytes than septic
  older adult females. (D) E-MDSCs from septic young adult females had greater intercations
  with B lymphocytes than septic older adult females. (E) MDSCs from young females
  had different interactions along the Itgal-Itb2 pathway compared to the other cohorts.
  There was higher gene expression of the ligand receptors in the young adult female
  PMN-MDSCs compared to the other cohorts as well as shown in the violin plots. (F)
  Septic older males, young females, and young males had unique communication patterns
  in the galectin pathway. G) Septic older males had a unique interaction in the April
  pathway and expressed both the ligand and receptor as seen in the violin plot
