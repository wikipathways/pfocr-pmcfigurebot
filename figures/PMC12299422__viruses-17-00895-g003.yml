caption: 'Clusters 1 and 8 characterization, pathway and molecular process assignments,
  and linked gene network analysis: (A) window showing Cluster 1 and a circos plot
  showing significant genes in Cluster 1, as per Bonferroni-adjusted p values and
  pathway assignment visualization; (B) circos plot showing significant molecular
  processes in Cluster 1; (C) circos plot showing significant genes in Cluster 8 as
  per Bonferroni-adjusted p values and pathway assignment visualization; (D) window
  showing Cluster 8 and circos plot showing significant biological processes; (E)
  networks established by genes assigned to significant pathways in Cluster 8, with
  connectors indicating interactions based on activation, and predicted regulators.
  Pink nodes indicate upregulated genes, and blue nodes indicate downregulated genes;
  (F) Cluster 1 and 8 directional signature overlap; and (G) Cluster 1 and 8 were
  enriched by DA alone in U937 uninfected parent cells but occurred in small numbers
  in U1 latent cells'
