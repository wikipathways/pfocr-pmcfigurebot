caption: The t-test and mean proportion in predicted pathways of the ileal microbiota
  in various treatments. (A) t-test is a horizontal analysis, (B) t-test species level
  analysis, (C) functional prediction of CTR vs. E. coli, and (D) E. coli vs. LR +
  E. coli. * p < 0.05; ** p < 0.01. CTR—control group; ECOLI—the broilers were challenged
  with E. coli; LRECOLI—the challenged broilers were fed a basal diet supplemented
  with L. reuteri postbiotics. Each value represents the mean of 6 replicates per
  treatment (n = 6)
