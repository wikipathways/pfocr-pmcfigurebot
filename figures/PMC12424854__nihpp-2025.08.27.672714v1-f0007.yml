figure_title: Integration of Dahl SS rat transcriptomes with human genome-wide association
  studies (GWAS) loci identifies conserved gene networks underlying hypertension and
  kidney disease
caption: 'A and B. Integration of rat transcriptomic data with human GWAS identified
  a significant enrichment of overlap genes associated with hypertension (A) and chronic
  kidney disease (CKD; B). Venn diagrams show the intersection between rat DEGs and
  GWAS loci associated genes, revealing non-random convergence (hypertension: P <
  0.0001, odds ratio = 2.4; CKD: P < 0.0001, odds ratio = 3.8; hypergeometric test).
  C and D. Enriched pathways from GWAS-overlapping genes revealed coherent biological
  processes in hypertension (C), and CKD-overlap genes (D). E and F. Protein-protein
  interaction (PPI) networks, constructed from GWAS-overlap genes, revealing distinct
  modular architectures (STRING: score > 400 for hypertension, > 700 for CKD). Louvain
  clustering identified discrete gene communities, each annotated by its most significantly
  enriched GO-BP term. Node size corresponds to degree centrality; edge width reflects
  interaction strength; colors denote module identity. adj. p indicated adjusted P
  value'
