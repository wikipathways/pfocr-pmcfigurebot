figure_title: LSEC mediates cAMP Signaling of T cell activity in the liver.
caption: LSEC mediates cAMP Signaling of T cell activity in the liver. The liver maintains
  immune quiescence through a local rheostat mechanism involving HBV-presenting hepatocytes,
  liver sinusoidal endothelial cells (LSECs), and CXCR6+ CD8+ T cells. Antigen recognition
  leads to LSEC-mediated activation of adenylyl cyclase in T cells, triggering the
  cAMP–PKA–CREM pathway. This signaling cascade represses effector gene expression
  (IFNG, GZMB, TNF) and reduces mitochondrial ROS production, collectively dampening
  T cell activity. This results in a tunable immunosuppressive environment that prevents
  excessive inflammation and preserves tissue integrity. Created in Biorender.com
