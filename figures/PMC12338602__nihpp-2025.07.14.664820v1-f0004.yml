figure_title: PhoPR is involved in growth arrest and ethambutol susceptibility under
  acidic conditions
caption: (A) Proportions of growing (HADA-positive, blue) and non-growing (HADA-negative,
  red) cells after 4-day adaptation to pH 7.0, 5.9, or 5.7. Three strains were used
  – CDC1551 streptomycin-resistant WT (STR-R), phoPR mutant, and complemented strains
  (details in Materials and Methods). See Fig. 1A for experimental design. (B) After
  a 4-day adaptation at pH 5.7, cells were treated with ethambutol (untreated, 8,
  or 24 μg/ml) for ten days, then plated for CFU. Biological triplicates; mean with
  SEM. p-values between WT and mutant (p = 0.004), and mutant and complemented (p
  = 0.009); unpaired two-tailed t-test. (C) Multi-strain pathway and gene regulator
  enrichment analysis from RNA-seq of CDC1551, isolate 1, and isolate 2 after one
  or four days at neutral and acidic (pH 5.9). Differentially expressed genes (DEGs)
  (adjusted p-values < 0.05), shared across all strains under acidic conditions, were
  analyzed to identify commonly regulated pathways by the upstream regulators (hypergeometric
  test). The readout represents the statistical significance of differential gene
  expression. FDR, false discovery rate
