caption: 'A, Uniform manifold approximation and projection embedding of cardiomyocyte
  (CM) clusters. B, Proportion of major cell types by subjects and pooled cohorts.
  C, Top: Embedding derived from differential abundance (DA) analysis in hypertrophic
  cardiomyopathy (HCM; blue) vs control(red). Bottom: Beeswarm plots derived from
  DA testing stratified by cluster, where each point represents a neighborhood. D,
  Heatmap of differentially expressed genes (DEGs) in CM clusters. E, Enrichment map
  stratified by CM cluster for proportional Kyoto Encyclopedia of Genes and Genomes
  and DEGs pathway analysis with adjusted P<0.05. F, Feature and violin plots illustrating
  normal, pre-stressed, and stressed module expression. ** indicates a Kruskal-Wallis
  test P -value < 0.001'
