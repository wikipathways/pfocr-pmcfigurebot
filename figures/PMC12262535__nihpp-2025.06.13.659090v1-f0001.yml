figure_title: Distribution of genes enriched across top enriched pathways for region-based
  analyses for chronological gestational age
caption: From the single CpG sites epigenome wide association study with chronological
  age, we identified differentially methylated regions based on combinations of p-values
  from the single site EWAS using comb-p. These regions were then mapped to genes
  by ChiPseeker. Pathway analyses via IPA was performed. The table lists the pathways
  with an enrichment p-value<1×10−5. Dot represents enrichment of gene in listed pathway
article_title: Immune pathways and perinatal environmental exposures contribute to
