figure_title: Interactions between TAMs and myeloid cells in the TME.
caption: 'Interactions between TAMs and myeloid cells in the TME. (A) Crosstalk of
  TAMs and MDSCs: TAMs induce the recruitment of MDSCs via expressing CD11b/CD18 integrin
  heterodimer. However, TAM inhibition by CCR2 deficiency or anti-CSF1R agent also
  increases G-MDSCs. Reciprocally, MDSCs can induce M2 TAM polarization and infiltration
  by suppressing CD40/IL-27 signals. Additionally, hypoxia via HIF-1α induces the
  differentiation of MDSCs into TAMs, with a sustained expression of S100A9. (B) Crosstalk
  of TAMs and TANs: TAMs inhibit the recruitment of MMP-9+ neutrophils, except for
  M4 macrophages, which promote the recruitment of neutrophils and induce the secretion
  of NETs. On the other hand, TAMs drive the recruitment of pro-metastatic neutrophils
  to metastatic lesions via producing IL-1β. Reciprocally, TANs promote the recruitment
  of TAMs through CCL2-CCR2, CCL4-CCR5 and CCL7-CCR4 pathways. Neutrophil-derived
  CHI3L1 indirectly enhance TAM recruitment by stimulating tumor cells to release
  inflammatory chemokines. At last, TAN-derived azocyanin, lactoferrin and exosomal
  miR-30d-5p drive M1 polarization of TAMs, whereas IL-13 initiates M2 TAM polarization'
article_title: 'Focusing on the interplay between tumor-associated macrophages and
  tumor microenvironment: from mechanism to intervention'
