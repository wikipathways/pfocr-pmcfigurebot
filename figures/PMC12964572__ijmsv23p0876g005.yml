figure_title: Melatonin downregulates PD-L1 expression in TNBC cells through inhibition
  of the FAK signaling pathway.
caption: 'Melatonin downregulates PD-L1 expression in TNBC cells through inhibition
  of the FAK signaling pathway. (A) CD274 (PD-L1) mRNA expression analysis in the
  TCGA-BRCA cohort. Left: comparison between Normal-like (adjacent normal) and tumor
  tissues. Middle: comparison across breast cancer subtypes (Luminal A, Luminal B,
  HER2-enriched, and TNBC). Right: comparison between non-TNBC and TNBC, showing elevated
  CD274 expression in TNBC. Normal-like refers to adjacent normal tissues from breast
  cancer patients. Statistical tests and P values are indicated in the plots. (B)
  qPCR analysis showing that melatonin treatment (2 mM) significantly reduced PD-L1
  (CD274) mRNA levels in MDA-MB-231 and MDA-MB-468 cells. Expression was normalized
  to GAPDH and presented as relative fold change. (C) Western blot analysis demonstrating
  a dose-dependent decrease in PD-L1 protein expression in cells treated with melatonin
  (0, 1, and 2 mM) for 48 h. (D) Melatonin (2 mM) attenuated IFN-γ-induced PD-L1 upregulation
  in TNBC cells (IFN-γ, 50 ng/mL for 48 h). (E) FAK silencing (FAK siRNA) enhanced
  the downregulation of NF-κB and PD-L1 by melatonin (2 mM), whereas FAK overexpression
  partially reversed these suppressive effects. (F) Pharmacological inhibition of
  FAK using PF-562271 (1 μM) further augmented the suppressive effect of melatonin
  (2 mM) on PD-L1 expression. GAPDH served as a loading control. Data in (B) are presented
  as mean ± SEM from three independent experiments. *P < 0.05'
article_title: Melatonin inhibits FAK signaling to suppress PD-L1 expression and enhance
  chemosensitivity in triple-negative breast cancer
