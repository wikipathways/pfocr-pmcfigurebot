figure_title: Epithelial memory is promoted by proline catabolism
caption: |-
  A-C. Representative immunoblot analysis of proline dehydrogenase (PRODH; proline catabolism) and pyrroline-5-carboxylate synthase (P5CS; proline biosynthesis) expression in epithelial cells stimulated without or with β-glucan for the indicated times (A), in β-glucan primed epithelial cells after 48h resting (B), and in epithelial-enriched tissue from immunocompetent wildtype mice after 5 days of primary infection (C). N – naïve, P – β-glucan primed, S – Sham, Ca – Candida albicans
  D. Schematic diagram of the mitochondrial proline catabolism pathway. E. Intracellular metabolite concentrations in epithelial cells treated without or with 10mM tetrahydrofurfuryl acid (THFA; a proline dehydrogenase inhibitor) and stimulated with BG for 24h. N=5. One-way ANOVA with Tukey’s multiple comparisons test. F. Levels of chemokines and cytokines in culture supernatants of epithelial cells primed without or with THFA and BG after 8h of infection with C. albicans. N=6. Unpaired Student t-test. G. Global DNA methylation levels in epithelial cells trained with β-glucan and THFA for 24h, followed by 48h of resting in culture media. N=6. Two-tailed Mann–Whitney Test. H. Concentrations of metabolites in epithelial-enriched tissues from Prodhwt/wt and Prodh−/− mice 5 days post-infection. I. Oral fungal burden in Prodhwt/wt and Prodh−/− mice during reinfection. N=6. One-way ANOVA with Dunnett’s multiple comparisons test. The y-axis represents the limit of detection (20 CFUs/g of tissue). J. Proinflammatory cytokine response in tongue homogenates in Prodhwt/wt and Prodh−/− mice upon reinfection. N=6; Two-tailed Mann–Whitney Test. K. Global DNA methylation levels in epithelial-enriched tissues from Prodhwt/wt and Prodh−/− mice 5 days after primary infection
