figure_title: FAD-mutant PSEN-1 Affects Processive Proteolysis of C99 by γ-Secretase.
caption: FAD-mutant PSEN-1 Affects Processive Proteolysis of C99 by γ-Secretase. (A)
  Bar graphs illustrating all coproduct formation for specific mutations for the Aβ40
  pathway. (B) Bar graphs illustrating all coproduct formation for specific mutations
  for the Aβ42 pathway. (C) Percentage cleavage efficiency was calculated for Aβ40
  carboxypeptidase (trimming) pathway. (D) Percentage cleavage efficiency was calculated
  for Aβ42 carboxypeptidase (trimming) pathway. Steps yielding no detectable coproduct
  (“nd”) are indicated. Each graph represents n = 3, and statistical significance
  was determined using unpaired two-tailed t-tests comparing FAD mutants with WT (*
  p < 0.05, ** p < 0.01, *** p < 0.001)
