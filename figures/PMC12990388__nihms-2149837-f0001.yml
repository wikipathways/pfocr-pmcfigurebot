figure_title: CAC+HDL induces non-classical activation and select immune response
  pathway and gene expression changes in macrophages
caption: (A) Volcano plot depicting log10 p-adjusted (Q)-value versus log2 fold changes
  for all differentially expressed (≥2.0 absolute fold change) genes in BMDM’s treated
  with CAC+HDL or Ctr-HDL (n=3). (B) EGR1-containing gene set pathway analyses (Meta
  Core) enrichment, ranked by −log10(p-value) with false discovery rate (FDR) shown.
  (C) mRNA expression by qPCR displaying fold change from BMDMs treated with Ctr-HDL
  (n=9) and CAC+HDL (n=14). Statistical analysis assessed by Mann-Whitney U-test.
  Data are presented as mean + s.e.m., *p < 0.05
