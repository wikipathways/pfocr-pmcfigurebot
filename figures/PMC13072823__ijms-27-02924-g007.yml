figure_title: Eriodictyol exhibits superior anticancer efficacy and PI3K/AKT pathway
  targeting in gastric cancer models.
caption: 'Eriodictyol exhibits superior anticancer efficacy and PI3K/AKT pathway targeting
  in gastric cancer models. Eriodictyol displays stronger growth-inhibitory activity
  than structurally related flavonoids in gastric cancer cells (A) and suppresses
  xenograft tumor growth and burden in vivo in a dose-dependent manner. (B,C) Tumor
  volume and weight, (D) body-weight loss. (E,F) Reduced tumor proliferative capacity
  is confirmed by Ki-67 immunostaining (Scar bar: 50 μm). (G,H) Histological and biochemical
  assessments demonstrate minimal toxicity to major organs (Scar bar: 100 μm). (I,J)
  Systems pharmacology and molecular docking analyses identify PI3K as a central molecular
  target. Together, these data establish eriodictyol as a pathway-directed flavonoid
  with a favorable efficacy–safety balance in gastric cancer. Adopted from [26]. (Differences
  between groups are denoted by ‘ns’: non-significant, ** p < 0.01, and **** p < 0.0001)'
