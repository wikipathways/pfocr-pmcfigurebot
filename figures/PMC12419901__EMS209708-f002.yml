figure_title: Paillotin is regulated by the Imd pathway
caption: Transcript levels of Paillotin/CG10332 in w1118, RelishE20, spzrm7, and RelishE20,
  spzrm7 flies collected at 8 h, 16h, and 24h post-E. coli infection (a, c) and M.
  luteus infection (b, d). (e) Quantified Paillotin peptide levels of w1118, RelishE20,
  and spzrm7 hemolymph upon either Ecc15 or M. luteus infection (data extracted from
  (Rommelaere et al., 2025)). Gene Expression was measured by qRT-PCR and normalized
  with w1118 UC (unchallenged) flies set as a value of 1. The data shown in the figure
  are based on three independent experiments, with at least 30 flies per genotype
  at each time point in each experiment. Error bars represent SEM. Statistical significance
  was determined using two-way ANOVA (*p<0.05, ** p<0.01, *** p<0.001, n.s. = not
  significant, p>0.05)
