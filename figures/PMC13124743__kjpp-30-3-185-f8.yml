figure_title: The inhibition of NF-κB cellular signaling pathway suppressed interleukin-β
  (IL-1β)-induced oxiapoptophagy in chondrocytes
caption: CDDO-Me, a chemical inhibitor of NF-κB, suppressed IL-1β-induced oxiapoptophagy
  related biomarkers, including CH25H, CYP7B1, caspase-3, and beclin-1, as well as
  reduced ROS production in chondrocytes. Scale bar = 50 μm. CH25H, cholesterol-25-hydroxylase;
  CYP7B1, 25-hydroxycholesterol 7α-hydroxylase; ROS, reactive oxygen species; DCF-DA,
  dichlorfluorescein-diacetate
