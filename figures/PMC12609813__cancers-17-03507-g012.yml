figure_title: AR signaling pathway in PCa.
caption: 'AR signaling pathway in PCa. The diagram illustrates the molecular cascade
  beginning with cholesterol conversion to testosterone via CYP17 lyase. Testosterone
  is further metabolized to dihydrotestosterone (DHT) by 5α-reductase, which binds
  to cytosolic AR, triggering dissociation from heat shock proteins (HSPs) and enabling
  nuclear translocation. Inside the nucleus, the AR-DHT complex binds to androgen
  response elements (AREs) on DNA, initiating transcription of genes that drive PCa
  progression. Points of therapeutic inhibition are highlighted: (a) CYP17 lyase inhibitors
  (e.g., abiraterone) block androgen biosynthesis. (b) Androgen deprivation therapy
  reduces circulating testosterone. (c) 5α-reductase inhibitors (e.g., finasteride,
  dutasteride) prevent DHT formation. (d) AR inhibition or degradation targets the
  androgen receptor directly, either by blocking ligand binding, preventing nuclear
  translocation, or promoting proteasomal degradation. Degraders such as PROTAC act
  at this level. (e) AR antagonists (e.g., enzalutamide) inhibit receptor activation
  or promote degradation. (f) Transcriptional inhibitors block AR-mediated gene expression.
  Generated with BioRender (https://app.biorender.com, accessed on 10 June 2025)'
