caption: Canonical pathway enrichment analysis of differentially expressed proteins
  (A and C) and overlap network of differentially expressed proteins (B and D) for
  Extensive Dentin Caries vs Sound and Extensive Dentin Caries vs Distinct Dentin
  Caries. Enriched canonical pathways charts display the enriched pathways according
  to the −log(p-value). Bars in orange indicate pathways with positive z-score. Bars
  in white or gray indicate z-score = 0 and no activity pattern available, respectively.
  The networks illustrate shared regulatory nodes between interactions and overlaps
  among the enriched pathways. The intense red color nodes indicate pathways with
  predominantly up-regulated molecules, suggesting increased involvement or activity
  of those pathways under the analyzed conditions, while pink nodes represent a mix
  of upregulated and downregulated molecules within the pathway. A −log(p-value) ≥
  1.3 corresponds to a p-value of 0.05. Image was generated using QIAGEN Ingenuity
  Pathway Analysis (IPA, QIAGEN Inc., www.qiagen.com/ingenuity)
