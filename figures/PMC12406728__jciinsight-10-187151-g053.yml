figure_title: Tucatinib, a small molecule inhibitor of HER2, restricts ASPN-induced
  signaling in prostate cancer cells
caption: (A and B) LNCaP cells were treated with 100 ng/mL recombinant human ASPN
  with or without 0.5 μM tucatinib and then assessed for HER2 and HER3 pathway activation
  by immunoblotting (A) and quantification (B) (n = 3). (C and D) PC3 cells were treated
  with 100 ng/mL recombinant human ASPN with or without 20 μM tucatinib and then assessed
  for HER2 and HER3 pathway activation by immunoblotting (C) and quantification (D)
  (n = 3). Graphs are shown as mean ± SEM and analyzed by 1-way ANOVA with Šídák’s
  post hoc analysis; *P ≤ 0.05, **P ≤ 0.01, ***P ≤ 0.001, ****P ≤ 0.0001
article_title: Identification of asporin as a HER3 ligand exposes a therapeutic vulnerability
  in prostate cancer
