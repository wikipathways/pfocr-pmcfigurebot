figure_title: Glucocorticoid fluctuation contributes to ISG expression and virus clearance
caption: a, heatmap for Z-scores of genes in the response to peptide hormone pathway
  that are related to glucocorticoid signaling in EpCAM+ cells in scRNA-Seq dataset.
  Genes are grouped based on whether prior studies have shown them to be upregulated
  (Up), downregulated (Down), or interact with the glucocorticoid receptor during
  hormone signaling (Signal). b, time course of Sgk1 expression after CC in samples
  from Fig. 5J. n = 3–8 mice. c, corticosterone levels in serum from mice from Fig.
  5h as determined by ELISA. n = 3–10 mice. d, comparison of behavior of averaged
  corticosterone levels, ISG + Tnfa expression (as shown in Fig. 5h), and MuAstV levels
  after CC. e, percentage of mice with detectable MuAstV in their stool treated with
  either vehicle control (Ctr), glucocorticoid antagonist Mifepristone (Mif) or synthetic
  glucocorticoid Methylprednisolone acetate (MPA) +/−CC. n = 6–11 mice. f, Heatmap
  of normalized ISG and Tnfa expression in Mifepristone and Methylprednisolone acetate
  treated mice 24h post CC compared to control. n = 4–6 mice. g, model of cage change-induced
  MuAstV clearance. SPF mice were used for all experiments. Each dot represents data
  from one animal in panels (b-c) and (e-f) and the data are represented as mean ±SEM
  from at least two independent experiments. ns = not significant, *p≤0.05, **p≤0.01,
  ***p≤0.001, ****p≤0.0001 by 2way ANOVA using Holm-Šídák’s comparison for panels
  (c) and (e), and two-sided Student’s T-test compared to Ctr for panel (f). For panel
  f ‘+’ denotes FC with p≤0.05
