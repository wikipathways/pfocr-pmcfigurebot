figure_title: Modulation of autophagy in different cell death pathways.
caption: Modulation of autophagy in different cell death pathways. Ferroptosis (salmon-colored)
  is inhibited by the elimination of iron and oxidative stress via autophagy. Necroptosis
  (light pink) can be suppressed by the interaction of BECLIN-1 with RIPK1, inhibition
  of MLKL by BECLIN-1, and dysregulation of SNARE proteins by TNF; additionally, RIPK3
  can directly associate with AMPK, inducing necrosome formation and reducing autophagy.
  Apoptosis (orange) can be inhibited through direct interaction between AMBRA1 and
  BECLIN-1. Bif-1 also interacts with BECLIN-1 and LC3-II, promoting autophagosome
  formation and preventing apoptosis. Another way to regulate apoptosis involves the
  activation and dissociation of the BECLIN-1/BCL-2 complex. Pyroptosis (gray) can
  be inhibited through multiple mechanisms, including inhibition of NOD2 by ULK-1,
  inhibition of NLRP3 by BECLIN-1 and LC3-I, inhibition of GSDM by LC3-I, and elimination
  of DAMPs and PAMPs. On the other hand, increased release of IL-β and IL-18 upon
  ATG16L1 knockout promotes pyroptosis
