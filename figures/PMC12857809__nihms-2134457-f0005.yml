figure_title: Basal cell developmental trajectories drive tissue remodeling in CRSwNP
caption: (A) Volcano plot showing DEGs in suprabasal cells, comparing CRSsNP and CRSwNP
  conditions. Red dots indicate significantly altered genes (∣log2FC∣ > 1.5).(B) Pseudotime
  trajectory analysis of basal cell differentiation using Monocle2, colored by pseudotime
  progression (left) and cell-type identity (right), revealing a bifurcation point
  leading to two distinct cell fates.(C) Cell trajectory plots showing the distribution
  of basal cells from control and CRS samples along the pseudotime trajectory.(D)
  Quantification of cell fate distributions across sample types, demonstrating enrichment
  of Cell-fate2 (IMM remodeling) in CRSwNP NPs.(E) Heatmap showing gene expression
  dynamics along the basal cell trajectory, with distinct gene modules characterizing
  pre-branch, Cell-fate1 (host defense), and Cell-fate2 (IMM remodeling) states. Associated
  enriched pathways and their annotations are shown on the right.(F) Expression dynamics
  of key genes during pseudotime progression in CRSsNP (green) and CRSwNP (purple)
  conditions, highlighting differential regulation of inflammatory and developmental
  pathways.(G) Dynamic expression scores for IL4/IL13 signaling and cell-cell communication
  pathways along the basal cell pseudotime trajectory.(H) Correlation analysis between
  basal cell states and IMM cell populations, showing distinct IMM cell associations
  with host defense, compared with IMM remodeling cell fates.(I) Pathway enrichment
  analysis of IMM cells correlated with different basal cell fates.(J) Violin plots
  showing a reduction in the IMM remodeling signature following dupilumab treatment.
  Boxes indicate interquartile range (25th–75th), with the lines indicating the median.(K)
  In silico perturbation analysis of KLF4 knockout showing altered developmental trajectories
  as indicated by the arrows.(L) Quantification of the simulated perturbation effects
  in (K).(M) A reduction of KLF4 expression is observed following dupilumab treatment.
  Boxes indicate interquartile range (25th–75th), with the lines indicating the median.See
  also Figures S4 and S5
