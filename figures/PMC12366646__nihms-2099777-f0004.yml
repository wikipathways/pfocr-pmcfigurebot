figure_title: Bulk RNA-Seq transcriptomics in high- and low-producing rituximab cell
  lines
caption: (A) Bulk RNA-Seq analysis was conducted to compare high- and low-producing
  cell lines. The analysis identified approximately >1,300 differentially expressed
  genes in high-producing cell lines (red dots) and >900 differentially expressed
  genes in low-producing cell lines (blue dots) (Welch's t-test, p < 0.05) as visualized
  in the volcano plot. (B) Gene enrichment analysis focused on biological processes
  revealed significant pathways associated with the secretory pathway in high-producing
  cell lines. These pathways included protein secretion, ERAD pathway, vesicle budding,
  and related processes. (C) In contrast, low-producing cell lines showed gene enrichment
  primarily in RNA processing, splicing, modifications, and mitochondrial functions
