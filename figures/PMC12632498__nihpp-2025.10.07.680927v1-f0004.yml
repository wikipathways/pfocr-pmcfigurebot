figure_title: S1-D2 pathway becomes depressing synapses during chronic stages of pain
caption: (A) Timeline depicting electrophysiological recordings and behavioral experiments
  for either 25 days post-injury or 3 months post-injury.(B) Quantification of amplitude
  of PSP and time to peak of D1-SPNs (red) and D2-SPNs (blue) at 25 days post-injury.
  Two-tail Unpaired t-test. *p < 0.05. Error bars represent +/− SEM. N = 5-6 animals
  for sham and SNI(C) Quantification of PPR of sham and SNI conditions for D1-SPNs
  (red) and D2-SPNs (blue) at 25 days post-injury. Two-tail Unpaired t-test for normalized
  EPSP. Repeated Two-Way ANOVA with Sidak’s multiple comparisons for ratio.*p < 0.05.
  Error bars represent +/− SEM. N = 5-6 animals for sham and SNI.(D) Quantification
  of average PSP amplitude for all 25 pulses of sham and SNI conditions and the ratio
  of the 1st pulse for D1-SPNs (red) and D2-SPNs (blue) at 25 days post-injury. Two-tail
  Unpaired t-test for normalized EPSP. Repeated Two-Way ANOVA with Sidak’s multiple
  comparisons for ratio.*p < 0.05. Error bars represent +/− SEM. N = 5-6 animals for
  sham and SNI.(E) Quantification of amplitude of PSP and time to peak of D1-SPNs
  (red) and D2-SPNs (blue) at 3 months post-injury. Two-tail Unpaired t-test. *p <
  0.05. Error bars represent +/− SEM. N = 4-5 animals for sham and SNI(F) Quantification
  of PPR of sham and SNI conditions for D1-SPNs (red) and D2-SPNs (blue) at 3 months
  post-injury. Two-tail Unpaired t-test. *p < 0.05. Error bars represent +/− SEM.
  N = 4-5 animals for sham and SNI(G) Quantification of average PSP amplitude for
  all 25 pulses of sham and SNI conditions and the ratio of the 1st pulse for D1-SPNs
  (red) and D2-SPNs (blue) at 3 months post-injury. Two-tail Unpaired t-test for amplitude.
  Repeated Two-Way ANOVA with Sidak’s multiple comparisons for ratio.*p < 0.05. Error
  bars represent +/− SEM. N = 4-5 animals for sham and SNI
