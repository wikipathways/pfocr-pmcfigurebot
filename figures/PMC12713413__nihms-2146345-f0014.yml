figure_title: Comparison of homothallic mating in S.
caption: Comparison of homothallic mating in S. cerevisiae, C. albicans, and C. neoformans.
  (A) In S. cerevisiae, mating-type switching allows for the formation of cells of
  the opposite mating type in MATa or α cells. Cells of the opposite mating types
  then undergo mating. (B) In C. albicans, environmental stresses overwhelm the heat
  shock protein 90 (Hsp90)-mediated stress-response pathway and activate the master
  regulator of a-type mating, MTLa2, and the pheromone precursor-encoding gene, MFα.
  The activation of both a- and α-pheromone-response pathways in a cells confers the
  “bimater” feature to the cells and promotes homothallic mating in C. albicans. (C)
  In C. neoformans, the majority of natural isolates are MATα. MATα cells can mate
  and produce mating products in the absence of a partner of the opposite mating type
