figure_title: RUNX1 is hypomethylated in SSc fibroblasts.
caption: RUNX1 is hypomethylated in SSc fibroblasts. (A) DNA methylation profile of
  2D- and 3D-cultured fibroblasts isolated from patients with dcSSc or healthy donors,
  created using Illumina’s Infinium Methylation EPIC array. Heatmap shows top 592
  methylated CpG sites, with blue/yellow gradient of beta values. The bar plot on
  top shows the RUNX1 beta value that is labelled within the heatmap, showing that
  RUNX1 is hypomethylated in dcSSc samples. (B) Result of paired-wise differentially
  methylated CpGs and the number of significant CpGs in each group. (C) Pathway enrichment
  analysis of Reactome gene sets using the top significant CpGs identified in (B)
  for each 2D and 3D culture. (D) The beta values of representative CpGs in RUNX1
  locus in 2D and 3D SSc and healthy conditions. (E) RUNX1 locus on chromosome 21
  and common CpG islands in green. The differentially methylated regions (DMRs) are
  identified between SSc and healthy samples are shown in red. The beta values corresponding
  to the CPGs at DMRs for SSc (in orange) and healthy (in green). (F) RUNX1 expression
  rate in isolated healthy and SSc fibroblasts (n = 3) treated with DNA methyltransferase
  inhibitor, 5-Aza-2′-deoxycytidine (5-AZA) for 72 hours. dcSSc, diffuse cutaneous
  SSc; RUNX1, runt-related transcription factor 1; SSc, systemic sclerosis; 3D, 3-dimensional;
  2D, 2-dimensional. G-Protein Coupled Receptor (GPCR )
