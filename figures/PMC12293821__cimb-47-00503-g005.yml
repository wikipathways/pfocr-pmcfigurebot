figure_title: Transcriptome sequencing of platelet.
caption: 'Transcriptome sequencing of platelet. (A) Heat map of differentially expressed
  genes between the Sham group and I/R group. (B) Heat map of differentially expressed
  genes between the I/R group and I/R + MT-95ET group. (C) KEGG enrichment analysis
  of MT-95ET signaling pathway on platelet activation. Enrichment analysis of differentially
  expressed genes pathway barplot. In the figure, the horizontal axis is the number
  of differentially expressed genes, the vertical axis is the KEGG pathway, and the
  color represents classification. (D) Go enrichment analysis of differential gene
  categories of MT-95ET on platelet activation. Barplot of GO enrichment analysis
  of differentially expressed genes. In the figure, the vertical axis is the number
  of differentially expressed genes, the horizontal axis is gene ontology, and the
  color represents a classification. (E) Z-score-based gene expression heatmap: Differential
  expression analysis of platelet glycolytic pathway-related genes between the I/R,
  I/R + MT-95ET, and Sham groups. The Z-score values are color-coded, with red representing
  high expression (a Z-score of 2 indicates a high degree of high expression) and
  green representing low expression (a Z-score of -2 indicates a high degree of low
  expression)'
