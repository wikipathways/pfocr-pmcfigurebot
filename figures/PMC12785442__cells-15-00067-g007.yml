figure_title: The proteome and kinome are systematically and specifically altered
  in the brainstem of P40–50 HETs.
caption: The proteome and kinome are systematically and specifically altered in the
  brainstem of P40–50 HETs. Brainstem, cortex, and hippocampal tissue were collected
  from P40–50 HET and age-matched WT mice and subjected to our MS-based kinobead AP-MS
  workflow. (A) Comparison of differentially expressed protein kinases (top) and non-kinase
  proteins (bottom), P40–50 HET versus WT mice, between different brain regions. Data
  was analyzed using a two-tailed two-sample Student’s t-test. p < 0.1, N = 2 HETs
  and 3 WTs, see Table S1. (B) GSEA analysis using KEGG gene sets, comparing pathway
  enrichment between the different brain regions. (C) Specific differentially expressed
  protein kinases by brain region (for statistics, see the Supplementary Materials
  Table S1)
