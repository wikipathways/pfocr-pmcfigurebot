figure_title: A conceptual model summarizing the distinct biological strategies for
  agronomic performance in the Premature and Intermediate Coffea canephora populations.
caption: A conceptual model summarizing the distinct biological strategies for agronomic
  performance in the Premature and Intermediate Coffea canephora populations. The
  model visually contrasts the key findings from the comparative genomic analysis.
  The genetic architecture of the Premature population is linked to specialized metabolic
  pathways, including “lipid modification” and the cellular component “organelle lumen,”
  and is highlighted by a key candidate gene, a putative caffeine synthase 3. In contrast,
  the Intermediate population’s traits are governed by variation in core cellular
  machinery & signaling, with significant enrichment for pathways like “actin cytoskeleton
  regulation” and “salicylic acid signaling.” This figure illustrates that the two
  populations achieve agronomic success through fundamentally different, population-specific
  biological routes
article_title: Lipid Metabolism and Actin Cytoskeleton Regulation Underlie Yield and
