figure_title: p53-dependent ferroptosis signaling in DR.
caption: 'p53-dependent ferroptosis signaling in DR. Elevated p53 promotes ferroptosis
  in retinal microvascular endothelial cells through a coordinated multi-pronged strategy:
  (A) Iron Dysregulation: p53 activates ferritinophagy via NCOA4, increasing labile
  iron pools and Fenton reaction-derived ROS. (B) Antioxidant Inhibition: p53 represses
  SLC7A11 to impair System Xc− function, depleting glutathione (GSH) and invalidating
  the GPX4 system. (C) Pro-Peroxidation Mechanisms: p53 drives lipid peroxidation
  by facilitating the NOX1-DPP4 interaction, enhancing iron uptake via the STAT6-DMT1
  axis, and suppressing the anti-ferroptotic VKORC1L1/vitamin K hydroquinone pathway.
  These converging mechanisms lead to GPX4 depletion, lethal lipid ROS accumulation,
  and retinal microvascular damage in diabetic retinopathy'
