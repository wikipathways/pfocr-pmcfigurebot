figure_title: 3-oxo-LCA suppresses tumor growth in an FXR-dependent and apoptosis-dependent
  manner
caption: 'HCT116-xenograft NSG mice treated with 3-oxo-LCA or vehicle in Figure 1
  were subjected to bulk RNAseq, related data presented in A-C.(A) Pathway Enrichment
  Analysis by Metascape, showing the top significantly enriched pathways, ranked by
  −log10(P-value). Apoptosis related pathways are highlighted in red.(B) Gene Set
  Enrichment Analysis (GSEA) for Apoptosis pathway, P53 targets, and DNA damage response
  in above treatment groups in the tumors.(C) Heatmap of Apoptosis-related genes in
  above treatment groups in the tumors.(D) HCT116 cells were treated with 3-oxo-LCA
  (20μM) or vehicle control for 10 hours, followed by staining with Annexin V and
  PI. Live cells, early and late apoptotic cells, and necrotic cells were measured
  and quantified using flow cytometry. Representative images of different treatments
  are displayed, and the percentages of early apoptotic cells are quantified.(E) HCT116
  cells were transfected with indicated doses of siRNA of NR1H4, siFXR or siRNA of
  control (siCtl), then the cells were treated with 20μM of 3-oxo-LCA or DMSO for
  36 hours. The protein levels of Apoptosis signaling pathway (BCL2, CASP3, Cleaved
  CASP3, CASP7, Cleaved CASP7, PARP, Cleaved PARP) were measured by Western Blot,
  with FXR and β-actin as controls. Band intensities were quantified by image J and
  displayed on the righthand.(F-G) HCT116 cells were treated with the pan-apoptosis
  inhibitor Z-VAD-FMK (50 μM), 3-oxo-LCA (20 μM), or a combination of both for 36
  hours. The protein levels of Apoptosis signaling pathway (BCL2, CASP3, Cleaved CASP3,
  CASP7, Cleaved CASP7, PARP, Cleaved PARP) were measured by Western Blot, with FXR
  and β-actin as controls. Band intensities were quantified by image J and displayed
  on the righthand. Cell viabilities under different treatments were measured by Celltiter-Glo
  kit (G).Experiments were independently replicated twice, and representative data
  are shown as the mean ± SEM. For two group comparison, Student’s unpaired t-test
  were applied. For more than two group comparison, the one-way ANOVA test was followed
  by multiple comparisons. *p<0.05; **p<0.01; ***p<0.005; ns: not significant'
