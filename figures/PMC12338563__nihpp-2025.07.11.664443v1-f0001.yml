figure_title: A systematic framework for the characterization of metabolic heterogeneity
  in AD
caption: a Single sc/sn RNA-seq datasets. Datasets were retrieved from The Seattle
  Alzheimer’s Disease Brain Cell Atlas (SEA-AD), including ~1.2 million nucleus from
  dorsolateral prefrontal cortex (DLPFC) region in 80 participants and ~1.3 million
  nucleus from middle temporal gyrus (MTG) region in 84 participants. b Schematic
  diagrams showing intracellular metabolic heterogeneity calculation. The computation
  of single-cell signaling entropy and pathway activity based on the gene expression
  profiles in either protein-protein interaction (PPI) networks or metabolic pathway
  networks. The significant differences were scored for AD compared to non-AD. c Schematic
  of scFUMES analysis. Circular metabolites were collected from HMDB databases followed
  by filtering and cleaning. Metabolites functional/physical activities were comprehensively
  retrieved from ChEMBL and BindingDB databases. Single-cell gene expression matrix
  and metabolite-sensor activities were utilized to predict and score metabolite-sensor
  pairs in a given cell type in different disease pathologies. d Schematic of Mendelian
  Randomization (MR) genetics analysis. Instrumental variables (IVs) for each metabolite
  were selected from recently large-scale metabolite GWAS datasets. Four AD GWAS summary
  statistic datasets were treated as the outcome. Four multiple SNPs-based MR methods
  were adopted to estimate causal effects of circular metabolites on AD. e Integrating
  analysis of genetics and single cell-specific metabolite-sensor pairs. Combined
  the results from scFUMES (d) and MR analysis (e) to infer and validate genetics-supported
  single-cell-specific metabolite-sensor network across AD phenotypes, including brain
  regions, AD severity, sex difference, and APOE4 phenotypes
