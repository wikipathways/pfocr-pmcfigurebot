figure_title: Canonical and non-canonical renin–angiotensin system (RAS) pathways
  in humans.
caption: Canonical and non-canonical renin–angiotensin system (RAS) pathways in humans.
  Renin cleaves angiotensinogen to angiotensin I, which is converted by ACE to angiotensin
  II in the canonical pathway. Ang II binding to AT1R mediates vasoconstriction, aldosterone
  release, inflammation, and cell growth. ACE inhibitors block the conversion of angiotensin
  I to angiotensin II and prevent the degradation of bradykinin. Angiotensin receptor
  blockers prevent Ang II from binding AT1R. In the non-canonical axis, ACE2 converts
  angiotensin II to Ang (1-7), which signals via Mas to drive vasodilation, anti-inflammatory,
  and anti-proliferative activities. The dynamic balance between these axes is critical
  not only for blood pressure control but also for influencing aging trajectories,
  metabolic health, and tissue resilience
