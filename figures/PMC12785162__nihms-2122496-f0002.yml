figure_title: Intestinal sorbitol is derived from glucose and transported to the liver
caption: (A) Schematic to demonstrate labeling of the polyol pathway from U-13C glucose.
  The carbon atoms of each intermediate are labeled and are represented as circles.
  AR, aldose reductase; SDH, sorbitol dehydrogenase; NADP+, oxidized nicotinamide
  adenine dinucleotide phosphate; NADPH, reduced nicotinamide adenine dinucleotide
  phosphate; NAD+, oxidized nicotinamide adenine dinucleotide; NADH, reduced nicotinamide
  adenine dinucleotide. (B) Percentages of sorbitol fully labeled (M + 6) from U-13C
  glucose. n = 7 or 8 fish per group. (C) Percentages of fructose fully labeled (M
  + 6) from U-13C glucose in the liver of control and antimicrobial-treated fish.
  n = 7 fish per group. (D) Schematic to demonstrate labeling of the polyol pathway
  from U-13C sorbitol. SDH, sorbitol dehydrogenase. (E) Percentages of sorbitol (M+6)
  and fructose (M + 6) fully labeled from U-13C sorbitol. Data are from intestinal
  samples and media supplemented with tracer for 3 hours. Negative control media were
  not exposed to intestinal tissue. Their data are included to show that that unexposed
  media contained high-sorbitol labeling (99.99% for M + 6) and no fructose labeling.
  n = 3 intestinal samples from three fish per group. (F) Percentages of sorbitol
  (M + 6) and fructose (M + 6) labeling from U-13C sorbitol. Data are from liver samples
  exposed to tracer plus antimicrobials or tracer alone for 3 hours. n = 3 liver samples
  from three fish per group. Bars represent means. **P < 0.05; n.s., not significant
  by two-tailed, unpaired t test. Raw data are available in data file S1
article_title: Intestine-derived sorbitol drives steatotic liver disease in the absence
  of gut bacteria
