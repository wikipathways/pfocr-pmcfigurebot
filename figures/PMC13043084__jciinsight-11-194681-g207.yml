figure_title: MyrfhumdG C-terminal variant acts as a hypomorphic allele
caption: (A) Comparison of differentially expressed genes in RPE cluster of E17.5
  humanized C-terminal variant (MyrfhumdG/humdG) versus conditional KO (RxCre;Myrffl/fl)
  mice with key shared genes highlighted (n = 3 pooled per genotype). (B) Plot of
  MyrfhumdG/humdG versus RxCre;Myrffl/fl fold change in gene expression for genes
  expressed in both datasets (log2FC > 0.25, Bonferroni Padj < 0.1) showing strong
  concordance of up- and downregulated differentially expressed genes between the
  humanized allele and conditional KO. (C and D) Gene set enrichment analysis (GSEA)
  showing top 10 downregulated pathways in MyrfhumdG/humdG versus RxCre;Myrffl/fl
  mice. (E and F) Pseudobulk analysis of RPE cluster demonstrating magnitude of downregulation
  compared with respective control (E) is lower in the C-terminal variant (pink) than
  the conditional knock out at E15.5 (black) or P0 time points (blue), while magnitude
  of upregulation is similar across groups (F)
