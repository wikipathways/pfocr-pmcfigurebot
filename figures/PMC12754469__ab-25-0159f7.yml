figure_title: Identification and functional annotation of myogenesis-related hub genes
  in Muscovy duck.
caption: 'Identification and functional annotation of myogenesis-related hub genes
  in Muscovy duck. (A) and (B) depicted hub genes up- and down-regulated in 80D muscle,
  respectively. (C) and (D) reveal GO and KEGG enrichments for all hub genes, respectively.
  Consensus analysis identified immune-related hub genes (CD3E, ITK) among upregulated
  candidates, while downregulated hubs encoded core metabolic machinery including
  collagen IV (COL4A6), mitochondrial enzymes (HADHB, MCCC2), and amino acid regulators
  (GNMT, PIPOX). Functional enrichment demonstrated these hubs activate leucine catabolism,
  fatty acid β-oxidation, and key metabolic pathways: amino acid degradation, one-carbon
  metabolism, and folate cycling. GO, Gene Ontology'
