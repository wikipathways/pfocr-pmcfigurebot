figure_title: EBV latency promotes autoreactive B-cell programming and type I interferon–driven
  autoimmune amplification.
caption: EBV latency promotes autoreactive B-cell programming and type I interferon–driven
  autoimmune amplification. This schematic illustrates the pathway linking latent
  Epstein–Barr virus (EBV) infection to systemic autoimmune activation. Panel 1 (pale
  mint) depicts EBV persistence within memory B cells, characterized by episomal viral
  genomes, epigenetic remodeling, and immune evasion that sustain long-term latency
  and chronic B-cell signaling. Panel 2 (emerald green) represents the central reprogramming
  hub, where EBV latent membrane proteins LMP1 and LMP2A mimic host signaling to activate
  NF-κB/JAK-STAT and PI3K/Akt pathways, promoting survival of T-bet+ autoreactive
  B cells and enhanced antigen presentation (↑ MHC-II, CD80/CD86). Molecular mimicry
  mediated by EBNA1 and type I interferon/CXCL10 signaling further amplifies immune
  activation through interactions with T follicular helper cells (Tfh) and plasmacytoid
  dendritic cells. Panel 3 (deep forest green) illustrates downstream systemic outcomes,
  including chronic interferon-driven inflammation, dysregulated germinal center responses,
  expansion of autoantibody-producing cells, and increased risk for autoimmune diseases
  such as systemic lupus erythematosus, multiple sclerosis, and Sjögren’s syndrome.
  The left-to-right green gradient (pale mint to deep forest) represents progression
  from latent viral persistence to immune reprogramming and autoimmune amplification.
  Arrows indicate the direction of signaling, progression, and feedback interactions
  within the EBV-driven network. Upward (↑) arrows denote increased expression or
  activity. Schematic generated from author-developed prompts using the FigureLabs
  AI platform (https://www.figurelabs.ai/, accessed on 21 March 2026) and curated
  by the author
