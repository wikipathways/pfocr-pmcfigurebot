  summarizes the KEGG pathway enrichment analysis related to metabolism in proteomics.
  (F) The heatmap displays the differentially expressed proteins involved in oxidative
  phosphorylation, steroid hormone biosynthesis, glycolysis/gluconeogenesis, retinol
  metabolism, and bile secretion
