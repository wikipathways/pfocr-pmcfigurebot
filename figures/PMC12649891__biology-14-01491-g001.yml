figure_title: Generation of anaphylatoxins C3a and C5 in the tumor microenvironment
  (TME).
caption: Generation of anaphylatoxins C3a and C5 in the tumor microenvironment (TME).
  The production of C3a and C5a are initiated through cascades from the canonical
  pathways or non-canonical pathways. The three canonical pathways, classical pathway,
  lectin pathway, and alternative pathway, through differing activation cascades,
  result in the production of C3 convertases. C3 convertases cleave C3 into C3a and
  C3b. C3b combines with C3 convertase to create C5 convertase. C5 convertase cleaves
  C5 into C5a and C5b. C5b results in initiation of the MAC. The non-canonical pathways
  consist of C3 and C5 being cleaved by proteases such as thrombin, cathepsins, plasmin,
  and trypsin. This results in the production of anaphylatoxins C3a and C5a within
  the TME. The figure was created with BioRender.com
