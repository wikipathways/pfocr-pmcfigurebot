figure_title: Comparison of signaling pathways between circulating host and donor
  monocytes from the same time point using IPA software
caption: (A) Heatmap comparison of signaling pathways between host monocytes (hMono)
  and donor monocytes (dMono) collected either from flow cytometrically sorted monocytes
  using unique and HLA-specific antibodies at 2 years after BMT (left column) or from
  patient PB and graft before BMT (right column). Each box represents a signaling
  pathway either activated (positive z score ≥ 2, dark red as most positive) or inhibited
  (negative z score ≤ –2, dark blue as most negative). Pathways are listed on the
  y axis, and the z score color scale bar is shown on the right side of the heatmap.
  (B) Twelve pathways from the left column of A that are activated in circulating
  hMono (left column) relative to circulating dMono (right column) are highlighted.
  (C) Ten representative signaling pathways from the left column of A that are quiescent
  in hMono (left column) compared with dMono (right column) are highlighted
