figure_title: Pathway enrichment analysis of differentially expressed genes in C-33
  A, SiHa, and Ca Ski cells.
caption: Pathway enrichment analysis of differentially expressed genes in C-33 A,
  SiHa, and Ca Ski cells. Panels (a–c) represent the metabolic pathways with the highest
  enrichment when comparing C-33 A vs. SiHa/Ca Ski, SiHa vs. C-33 A/Ca Ski, and Ca
  Ski vs. C-33 A/SiHa, respectively. In (d), the Venn diagram integrates the commonly
  enriched pathways in C-33 A vs. SiHa/Ca Ski (pink), SiHa vs. C-33 A/Ca Ski (blue),
  and Ca Ski vs. C-33 A/SiHa (green). Numbers represent common and specific pathways
  in the three cell lines. Graphs were obtained from the analysis in the KEGG and
  GSA databases. Graphs and Ven diagram were obtained from SRplot. Significant enrichments
  were defined as |NES| > 1, NOM p. adjust < 0.05, and FDR q value < 0.25
