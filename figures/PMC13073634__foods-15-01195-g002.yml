caption: Impact of Daqu-associated pests on the microecology and production of Daqu.
  Insect feeding, oviposition, feces, exuviae, and other residues can damage the Daqu
  structure and introduce contamination, thereby disturbing microbiota, nutrient availability,
  and metabolic pathways. These changes may further affect fermentation conditions,
  enzyme performance, and flavor profiles, ultimately leading to flavor fluctuation,
  unstable quality grading, and broader production challenges. Overall, the figure
  illustrates a directional pathway from insect-induced structural disturbance to
  microecological imbalance and product-quality variation
