figure_title: Molecular defects in the autophagy–lysosomal pathway associated with
  Alzheimer’s and Parkinson’s diseases.
caption: Molecular defects in the autophagy–lysosomal pathway associated with Alzheimer’s
  and Parkinson’s diseases. A subset of genes—including AP2S1, SORL1, APOE4, PSEN1,
  TMEM175, LRRK2, VPS35, ATP13A2, GBA, SNCA, PICALM, PINK1, and Parkin—has been implicated
  in Alzheimer’s or Parkinson’s disease. Those genes are involved in the autophagy–lysosomal
  pathway and participate at distinct stages of the autophagic process, where their
  functional disruption contributes to disease-specific neurodegenerative mechanisms.
  The proposed sites of action for each gene corresponding to the particular pathological
  context of the associated disorder are indicated
