figure_title: Integrated transcriptomic and metabolomic analysis of FCA-L2 cells.
caption: Integrated transcriptomic and metabolomic analysis of FCA-L2 cells. (A) Bar
  plot showing the number of differentially expressed genes and differential metabolites
  in SP vs. NC, GLU_SP vs. SP and FCP_SP vs. SP comparisons. (B-D) Joint Kyoto Encyclopedia
  of Genes and Genomes enrichment analysis of transcriptomic and metabolomic datasets
  using hypergeometric testing. Bubble plots show commonly enriched pathways in (B)
  SP vs. NC, (C) GLU_SP vs. SP and (D) FCP_SP vs. SP groups. The x-axis represents-log(P-value)
  based on Fisher's exact test. Bubble size indicates total number of molecules mapped
  to the pathway and shape indicates omics source. GLU, glutamine; FCP, fish collagen
  peptides; SP, Streptococcus pneumoniae; NC, negative control; Tran, transcriptomics;
  meta, metabolomics
