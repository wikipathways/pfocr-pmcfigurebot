figure_title: Gene Ontology (GO) enrichment analysis of the 1179 genes significantly
  upregulated in MRC-5 cells cultured in normal conditions compared to MRC-5 cells
  cultured in Matrigel for a 24 h duration period.
caption: Gene Ontology (GO) enrichment analysis of the 1179 genes significantly upregulated
  in MRC-5 cells cultured in normal conditions compared to MRC-5 cells cultured in
  Matrigel for a 24 h duration period. (a) Top 15 significantly enriched GO cellular
  component (CC) terms associated with the upregulated genes in MRC-5 cells cultured
  in normal conditions compared to MRC-5 cells cultured in Matrigel. The gene ratio
  and statistical significance (p-value < 0.05, following Benjamini and Hochberg’s
  adjustment method) are also depicted. (b) Top 15 significantly enriched GO biological
  process (BP) terms associated with the upregulated genes in MRC-5 cells cultured
  in normal conditions compared to MRC-5 cells cultured in Matrigel. The gene ratio
  and statistical significance (p-value < 0.05, following Benjamini and Hochberg’s
  adjustment method) are also depicted. (c) The REACTOME pathway enrichment analysis
  on the upregulated genes in MRC-5 cells cultured in normal conditions compared to
  MRC-5 cells cultured in Matrigel. The top 15 statistically significant pathways
  are listed, and their colors correspond to the adjusted p-values
