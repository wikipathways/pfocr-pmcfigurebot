figure_title: Enriched metabolic pathways in Lactobacillus-fermented yogurt after
  21 days of refrigerated storage.
caption: Enriched metabolic pathways in Lactobacillus-fermented yogurt after 21 days
  of refrigerated storage. A differential metabolic pathway analysis was conducted
  to compare Lactobacillus-supplemented yogurt (L9 + HYY and LAC + HYY) with conventional
  HYY yogurt. (A) L9 + HYY and (B) LAC + HYY exhibited distinct pathway enrichment
  patterns (p < 0.05) in both positive and negative ionization modes. Analyses were
  executed in MetaboAnalyst 5.0 (KEGG database) with significance thresholds set at
  VIP ≥ 1.0 and p < 0.05. The pathway importance is represented by topological impact
  scores (x-axis), where the statistical significance (−log10 p-value, y-axis) is
  visualized using the bubble size (impact value) and color gradient (p-value magnitude)
