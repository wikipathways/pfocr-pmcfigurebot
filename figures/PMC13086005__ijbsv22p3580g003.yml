caption: The secreted ERBB3 protein may be involved in the interaction between oligodendrocytes
  and tumor cells. (A) Schematic diagram of cellular superalbumin proteomics. (B)
  Volcano diagram showing differential proteins in the cell supernatant. (C) ERBB3
  expression and distribution assessed using immunofluorescence in LCBM. (D) Multiple
  immunofluorescence staining was used to analyze the expression pattern of ERBB3
  in LCBM. (E) Distribution of ERBB3 expression in scRNA-seq data. (F) Correlation
  between ERBB3 expression and prognosis in LCBM evaluated by immunohistochemistry.
  (G) Expression level of ERBB3 in CSF. (H) ERBB3 secretion and expression in various
  cell lines. (I) Changes in ERBB3 secretion following co-culture of oligodendrocytes
  and lung cancer cells. (J) The effect of secretory ERBB3 on cell proliferation was
  investigated using CCK-8 assay. (K) The invasion function of tumor cells was evaluated
  by transwell assay. (L) Differential expression of EMT pathway proteins. (M) Brain
  metastases were determined by bioluminescence imaging and a histogram displayed
  the incidence of brain metastases across different groups. (N) Brain sections were
  stained by H&E. All experiments were repeated three times. All experiments were
  repeated three times (* p < 0.05, ** p < 0.01, *** p < 0.001, ns > 0.05)
