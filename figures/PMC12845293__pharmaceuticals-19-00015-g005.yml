figure_title: Overexpression of FXR improves renal fibrosis and inhibits TGF-β/Smad
  signalling pathway.
caption: Overexpression of FXR improves renal fibrosis and inhibits TGF-β/Smad signalling
  pathway. (A) The expression levels of FXR protein in HK-2 cells from different groups
  (n = 6). (B) Quantitative analysis of (A). Data represent the ratio of FXR band
  intensity to GAPDH (loading control), normalized to the Vector group. (C) The protein
  expressions of Fibronectin, Collagen-I, and Vimentin in the HK-2 cells from different
  groups (n = 6). (D–F) Quantitative analysis of (C). Data represent the ratio of
  Fibronectin/Collagen-I/Vimentin band intensity to GAPDH (loading control), normalized
  to the TGF-β group. (G) The protein expressions of TGF-β, Smad2, and Smad3 in the
  HK-2 cells from different groups (n = 6). (H–J) Quantitative analysis of (G). Data
  represent the ratio of TGF-β/Smad2/Smad3 band intensity to GAPDH (loading control),
  normalized to the TGF-β group. Results are mean ± SD of at least six independent
  experiments. *** p < 0.001
