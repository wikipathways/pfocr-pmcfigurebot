figure_title: Prediction of relative fluxes of GMP sources
caption: '(A) Generation of IMP M+9. (B) Isotope tracing in pentose phosphate pathway
  to generate M0-M5 R5P. (C) Production of isotopomers of nucleotides through de novo
  IMP synthesis. The last isotopomer in each column can be also produced through salvage
  of unlabeled nucleobases. (D) Purine metabolic model used to simulate fluxes and
  MIDs. (E) Design of a convolutional neural network (CNN) that can predict IMPDH-dependent
  GMP synthesis flux to total GMP synthesis flux (salvage and de novo GMP synthesis)
  for a set of MIDs. (F) Evaluation of CNN model on test simulated data. (G) Schematic
  of mycophenolate mofetil (MMF) treatment experiment with GBM38-bearing mice. (H)
  Sources of GMP synthesis (salvage and de novo). (I) CNN prediction of relative IMPDH-dependent
  GMP flux in GBM PDXs (Ctrl) and treated with MMF at 150 mg/kg (low) concentration
  with 1, 2, and 4 doses and 1 dose of 300 mg/kg (high) concentration. Different colors
  represent different mice (n=100 samples with imputation (dots with the same color)
  from a normal distribution with mean and standard deviation of 3 technical replicates).
  Black squares represent means of biological replicates for each condition. Stats
  represent Wilcoxon rank-sum test p-values (#: p<2.22e-16), one-way ANOVA with Benjamini
  and Hochberg correction (FDR=0.001) resulted in p<0.0001 for each treatment compared
  to control. (J-L) 15N-amide-glutamine infusion in intracranial GBM38-bearing mice.
  (J) Schematic of purine isotopologues produced from 15N-amide-glutamine. Mean enrichment
  (%) of (K) Inosine and (L) GTP normalized to glutamine mean enrichment. (n=4 technical
  replicates from 3–4 biological replicates) (M) Tracing with [U13C]-glucose and [U13C]-serine
  in control and MMF-treated GBM38-bearing mice. (N) Fractional contribution of de
  novo and salvage GMP synthesis estimated by a linear regression model (n=3–4 biological
  replicates). (O) CNN-predicted relative de novo GMP synthesis flux in TRP and GBM38
  models. (P) CNN prediction of relative IMPDH-dependent GMP flux in patients given
  imputed patient MIDs (n=100 samples from a normal distribution with mean and standard
  deviation of 1–3 technical replicates per patient sample). Stats in K-L,N show p-values
  from unpaired two-sided t-test with Welch’s correction and in O represents Mann-Whitney
  test (* p<0.05, ** p<0.01, *** p<0.001, **** p<0.0001)'
