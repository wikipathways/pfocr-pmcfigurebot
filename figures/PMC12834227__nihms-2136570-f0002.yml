figure_title: Increased inflammatory signaling and senescence markers in PMS iNSCs
caption: (A) Bulk RNA-seq PCA on the individual iNSC lines.(B) Volcano plot of differentially
  expressed genes vs. log2 abundance in PMS iNSCs compared with Ctrl iNSCs.(C and
  D) Pathway enrichment analysis, enriched (C) and depleted (D) on Gene Ontology (GO)
  and reactome (REAC) terms and TFs from bulk RNA-seq.(E) GRNs derived from the bulk
  RNA-seq.(F) Quantification of PMS relative telomere length (RTL) over Ctrl iNSCs.(G)
  Representative images and quantification of SPiDER-β-gal in control, PMS, and ABT-263-treated
  iNSCs. Scale bar, 50 μm.(H) Representative images and quantification of 5-ethynyl-2’-deoxyuridine
  (EdU) in control, PMS, and ABT-263-treated iNSCs. Scale bar, 100 μm.(I) Representative
  western blots and quantification for p16Ink4a, p21, GDF15, and β-actin in control,
  PMS, and ABT-263-treated iNSCs.Experiments in (F)–(I) were done on n = 3 Ctrl and
  n = 3 PMS iNSC lines, each performed in triplicate. Each data point represents an
  individual cell line. Data in (F) are mean values ± SEM. **p ≤ 0.01, unpaired t
  test. Data in (G)–(I) are mean values ± SEM. *p ≤ 0.05, one-way ANOVA, Tukey’s multiple
  comparisons
