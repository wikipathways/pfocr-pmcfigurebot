caption: 'Cyclic nucleotide signaling pathways in eukaryotes: cAMP and cGMP levels
  are determined by the balance of their synthesis by both soluble adenylyl and guanylyl
  cyclases (sAC, sGC) and membrane-confined cyclases, and their hydrolysis by cyclic
  nucleotide phosphodiesterases. The downstream targets that bind cyclic nucleotides
  to ultimately generate the physiological response are shown: EPAC (exchange protein
  activated by cAMP), PKA (protein kinase A), POPDC (popeye domain-containing proteins),
  PKG (protein kinase G), and CNGC (cyclic nucleotide-gated ion channels). The dashed
  arrow from cGMP to PDE indicates allosteric binding of cGMP to GAF-containing PDEs'
