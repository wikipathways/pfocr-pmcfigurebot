figure_title: KEGG, Network, and Bar Plot Analysis of Sarcopenia Regulatory Candidate
  Genes
caption: '(A) Tree plot from KEGG analysis of signaling pathways associated with candidate
  genes. This plot illustrates the KEGG analysis results for the 40 major genes implicated
  in sarcopenia, including those identified as upregulated in the selected dataset.
  The cytokine-cytokine receptor interaction pathway was identified as the primary
  signaling pathway associated with these candidate genes. (B) Network analysis results
  for the candidate genes. A network connectivity graph was generated using the KEGG
  analysis server (ShinyGO 0.8). The size of the green circular nodes represents the
  relevance of each signaling pathway. The cytokine-cytokine receptor interaction
  pathway has emerged as the central pathway in regulating sarcopenia, with the chemokine
  signaling pathway identified as the second most significant. (C) Bar plot of candidate
  genes: This bar plot visualizes the key signaling pathways with color-coded and
  sized nodes based on their significance. While the viral PPI pathway had the highest
  false discovery rate (FDR), the cytokine-cytokine receptor interaction pathway was
  considered the most significant based on its larger node size, indicating its strong
  relevance in sarcopenia regulation'
