caption: 'Differential expression characteristics and functional enrichment analysis
  of porcine mRNA before and after sexual maturity. (A): Principal component analysis
  (PCA) plot of transcripts from PSM and SM groups; (B): Volcano plot of differentially
  expressed transcripts, green represents downregulation, purple represents upregulation,
  and gray represents no significant difference; (C): Top 25 KEGG pathways enriched
  by differentially expressed transcripts; (D): GO functional enrichment bubble plot
  of differentially expressed transcripts, with functional classification including
  cellular components, molecular functions, and biological processes; (E): KEGG pathway
  association network diagram of differentially expressed transcripts, with nodes
  representing pathways and node size corresponding to the number of enriched genes;
  (F–J): GSEA enrichment analysis curves, showing the enrichment results of Notch
  signaling pathway, Wnt signaling pathway, steroid hormone synthesis, antifolate
  resistance, and cholesterol metabolism pathway in sequence (NES is the standardized
  enrichment score, and the color corresponds to the score)'
