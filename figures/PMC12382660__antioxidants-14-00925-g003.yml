figure_title: The effects of CV on TLR4, Myd88 and NF-kB pathway expression after
  DNBS-injection.
caption: 'The effects of CV on TLR4, Myd88 and NF-kB pathway expression after DNBS-injection.
  Immunohistochemistry for TLR4 was evaluated in Sham (A), DNBS (B) and DNBS+CV (C).
  The results are expressed as number of TLR4+ positive pixel (D). Images are figurative
  of at least three independent experiments. Western blots for Myd88, IKB-α, and NF-kB.
  Representative Western blots for cytoplasmic Myd88 (E,E’), IKB-α degradation (F,F’),
  nuclear NF-kB translocation (G,G’) expression were performed. A demonstrative blot
  of lysates (5 animals/group), with a densitometric analysis for all animals, is
  shown (E’,F’,G’). Laminin was used as a control for normalization of NF-κB and Nrf2,
  which were incubated on the same membrane that was stripped by agitation with 3%
  glycine, pH 2, blocked in 5% non-fat dried milk/PBS for 1 hour at room temperature,
  and reincubated with the antibody. Values = means ± SD of 5 animals in each group.
  *** p < 0.001 vs. Sham; ### p < 0.001 vs. DNBS'
