figure_title: Genome-wide CRISPR-Cas9 knockout screens identify regulators of selenocysteine
  decoding
caption: (A) Schematic representation of selenocysteine decoding. (B) GPX4 and GPX1
  selenocysteine decoding reporter design. U, selenocysteine; C, cysteine. (C) Fluorescence
  of GPX1, GPX4, and GPX4M HCT116 reporter clones. Mean fluorescence intensity (MFI)
  was quantified by flow cytometry and normalized to GPX4M. Mean ± SD shown, with
  individual clones plotted. n=12 for GPX1, n=17 for GPX4, n=10 for GPX4M (biological
  replicates). (D) Sodium selenite dose response of GPX reporters. MFI was normalized
  to 0 nmol condition. Mean ± SD with four parameter logistic fit plotted. n=3 biological
  replicates each for GPX1, GPX4, and GPX4M at all tested doses. (E) Flow cytometry
  histograms of reporter cell lines transduced with lentiviral constructs encoding
  Cas9 and either negative control sgRNA (sgNeg) or sgRNA targeting SECISBP2. (F)
  Schematic of CRISPR-Cas9 knockout screen. Following transduction of HCT116 reporter
  clones with a pooled lentiviral CRISPR library, the brightest and dimmest cells
  were collected by FACS, followed by analysis of sgRNA enrichment in sorted populations
  by high-throughput sequencing. (G) Known factors required for the uptake, biosynthesis
  and incorporation of selenocysteine. (H) and (I) Results of the dim screen for factors
  required for selenocysteine decoding. MAGeCK gene enrichment scores plotted for
  GPX4 vs. GPX1 reporters (H) or GPX4 vs. GPX4M reporters (I). Known genes in the
  selenocysteine pathway are labeled in purple
article_title: Oxidative stress sensing by the translation elongation machinery promotes
