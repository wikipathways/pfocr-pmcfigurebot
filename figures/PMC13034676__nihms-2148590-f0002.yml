figure_title: Model of metabolic and hormonal regulation of hepatic vagal nerve activity
caption: This schematic highlights that there is regulation of fibres that innervate
  the hepatic portal vasculature and fibres that innervate the liver, and that the
  activity of these fibres might be differentially regulated. Molecules in yellow
  are known activators of the hepatic vagal nerve at the location specified, whereas
  molecules in red are known inhibitors of the hepatic vagal nerve at the location
  specified. Arrows indicate an increase in the final metabolite, and bars indicate
  inhibition of that pathway or a decrease in the final metabolite. CCK, cholecystokinin;
  CCKAR, CCK type A receptor; GABA, γ-aminobutyric acid; GLP1, glucagon-like peptide
  1; GLP1R, GLP1 receptor; GPR40, G protein-coupled receptor 40
