caption: Summary of findings—Innate immune cells are maintained in a homeostatic resting
  state with the expression of strong signatures, such as NME2 and MIF, maintaining
  physiological processes via a healthy purine metabolism and mineral absorption (upper
  left). In cells that bear HIV provirus and are virologically suppressed, silence
  is maintained by a high expression of histone linkers and other components of chromatin
  organization, at the cost of a higher metabolic activation that may lead to some
  neurodegeneration (lower left). In the context of high levels of DA, innate immune
  cells do increase pathways associated with addiction (mainly dopaminergic signaling
  due to the presence of DA receptors in the innate immune cell surface) and are correlated
  with a decrease in the latency signature genes NME2 and MIF (upper right). On the
  other hand, cells with a provirus that are exposed to DA are strongly affected,
  with a significant decrease in histone linkers and protein-containing complex organization,
  unrepressing inflammation and unleashing HIV transcription. Predicted regulators
  of these phenotypes include EIF5, TP53, immune cytokines such as TNF, IL10, IL4
  and IL13, as well as epigenetic silencers such as SIRT1
article_title: A Single-Cell Perspective on the Effects of Dopamine in the Regulation
