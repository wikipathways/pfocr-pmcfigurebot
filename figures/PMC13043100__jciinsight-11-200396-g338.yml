figure_title: Upregulation of proteolytic systems in cachectic myofibers
caption: (A) Enrichment analysis of upregulated genes in cachectic myonuclei highlighting
  significantly enriched pathways related to protein degradation. (B) Violin plots
  showing module scores for the ubiquitin-proteasome system (UPS) and autophagy across
  different myonuclear clusters from GA muscle of control and KPC tumor–bearing mice.
  Scores were calculated using Seurat’s scoring function to quantify pathway activity.
  Each violin represents the distribution of pathway scores within a fiber type. (C)
  Heatmap displaying the expression of the top 50 upregulated genes in cachectic nuclei
  compared with all the myonuclei in control mice. (D) Heatmap showing the expression
  of representative top 50 upregulated genes from Bulk RNA-seq at tissue level. (E)
  Independent qPCR analysis of the upregulated top-ranked representative genes in
  GA muscle of control and KPC tumor–bearing mice. (F) Immunoblots of the levels of
  total ubiquitinated proteins, MAFbx, MuRF1, Beclin1, LC3B-I/II, and unrelated protein
  GAPDH in TA muscle of control and KPC tumor bearing mice. n = 4 for PBS group and
  n = 5 in KPC tumor group. All data are presented as mean ± SEM. *P ≤ 0.05, values
  significantly different from PBS-injected control mice analyzed by unpaired Student’s
  t test
article_title: Fiber-type vulnerability and proteostasis reprogramming in skeletal
