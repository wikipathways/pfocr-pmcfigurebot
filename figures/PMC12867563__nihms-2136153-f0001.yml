figure_title: Complement activation pathways
caption: The complement cascade is activated through three pathways. A) The classical
  pathway is activated when C1q binds to target ligands, including clustered IgG and
  IgM. Activation leads to cleavage of C4 and C2. Fragments of these proteins, C4b
  and C2b, combine to create a C3-covertase (C4b2b). The C3-convertase cleaves C3,
  generating C3a and C3b. The production of additional C3b can then generate a C5-convertase
  (C4b2b3b).B) The lectin pathway is activated when mannose binding lectin, collectins-10
  and −11, or ficolins-1, −2, or −3 bind to target glycans. Once bound, these proteins
  activate the MBL-associated serine proteases (MASPs), which cleave C2 and C4, generating
  a C3-convertase (C4b2b). Production of additional C3b can then generate a C5-convertase
  (C4b2b3b). C) Generation of C3b enables formation of the alternative pathway C3-convertase
  (C3bBb). The C3b in this convertase can be generated by tick-over, direct enzymatic
  cleavage of C3, or by activation of the classical and lectin pathways. C3b generated
  through the alternative pathway, itself, can form additional C3-convertase and amplify
  complement activation. Production of additional C3b can then generate a C5-convertase
  (C3bBbC3b). D) Generation of C5-convertase by the classical, lectin, and alternative
  pathways causes cleavage of C5. Cleavage of C5 produces C5a and C5b, and C5b generation
  initiates formation of C5b-9, the “membrane attack complex.”
