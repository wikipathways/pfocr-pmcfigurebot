caption: Effects of bamboo biochar (Bc) and sodium silicate (Si) on intracellular
  osmotic regulation and compatible solute accumulation in tobacco under oxybenzone
  (OBZ) stress. (A) Schematic illustration of osmotic adjustment pathways and key
  metabolic intermediates, including sugar conversion and proline biosynthesis. (B)
  Polyamine oxidase (PAO) activity. (C) Glucose content. (D) Fructose content. (E)
  Proline (Pro) content. Data are presented as means ± standard deviation (SD, n =
  3). Different lowercase letters indicate significant differences among treatments
  (p < 0.05) according to one-way ANOVA followed by Duncan’s test
