figure_title: STAT3/c-MYC pathway accelerates the stemness of duodenal adenocarcinoma
  via the Linc01559–GRSF1 signal.
caption: STAT3/c-MYC pathway accelerates the stemness of duodenal adenocarcinoma via
  the Linc01559–GRSF1 signal. (a) Correlation analysis among Linc01559, GRSF1, acidic
  environmental markers LDHA, CA12, and macrophage markers IL1B; (b) correlation analysis
  among GRSF1 and stemness marker EPCAM, CD44, and SOX2; (c) western blot of the protein
  expression of GRSF1, EPCAM, and CD44 in control and GRSF1-knockdown duodenal adenocarcinoma
  cells; (d) tumor spheres (with diameters larger than 50 µm) formed by control and
  GRSF1-knockdown duodenal adenocarcinoma cells cultured in alkaline and acidic conditions;
  (e) western blot of the protein expression of EPCAM and CD44 in control and Linc01559-knockdown
  duodenal adenocarcinoma cells treated with vector or GRSF1 plasmid; (f,g) western
  blot of the protein expression of STAT3 or c-MYC in control and STAT3-knockdown
  or c-MYC-knockdown duodenal adenocarcinoma cells; (h,i) qPCR of the RNA expression
  of Linc01559 in control and STAT3-knockdown or c-MYC-knockdown duodenal adenocarcinoma
  cells; (j) GSEA of the cancer hallmark signals in GRSF1 high and GRSF1 low group
  from duodenal adenocarcinoma tumor tissues; (k) the mRNA expression of stemness
  markers EPCAM, CD44, NUMB, and EMT markers OCLN, CDH1, and VIM in GRSF1 high and
  GRSF1 low group. Three independent experiments were performed to obtain the data
  in (d,h,i). The data are shown as the mean ± SD; the Pearson correlation coefficient
  (r) and p-values are shown * p < 0.05, ** p < 0.01, and *** p < 0.001
