figure_title: Predicted vulnerabilities in chemoresistant pAML aggregates
caption: '(A–K) Predicted vulnerabilities were validated using public perturbation
  datasets (A–F) and de novo assays (G–K), showing significant declines in the abundance
  of targeted pAML aggregates after treatment with biologicals or small-molecule inhibitors.
  The pathway or gene being tested is listed above each panel, and the control condition
  is shown on the left. (L) Aggregates not predicted to be vulnerable showed no significant
  changes; see Figure S10 for details. (M) Predicted vulnerability to the retinoic
  acid receptor agonist tamibarotene correlated with tumor cell viability in four
  pAML patient samples; note that samples from patients p198 and p401 were used to
  generate PDXs AML006 and AML001. (N–O) Predicted vulnerability to the FLT3 inhibitor
  quizartinib and CDK4/6 inhibitor palbociclib was confirmed by (N) reduced cell viability
  and (O) CD14 protein expression relative to DMSO controls (mean ± s.e.m.). DMSO:
  dimethyl sulfoxide control; dtAG: degradation tag; KO: knockout; WT: wildtype; NT:
  non-targeting; fl/fl: floxed/floxed; dt/dt: degradation tag; OE: CHAF1B overexpression;
  UF146inh: UF146 inhibitor; Quiz: quizartinib; Palb: palbociclib; Tami: tamibarotene'
