figure_title: Effect of cobimetinib (COB) and ulixertinib (ULIX) on the MAPK signaling
  pathway and P-gp expression.
caption: Effect of cobimetinib (COB) and ulixertinib (ULIX) on the MAPK signaling
  pathway and P-gp expression. (a) Representative Western blots of MAPK pathway proteins
  and P-gp in AMO-1 and AMO-1/CFZ cells; (b) Densitometry analysis of P-gp protein
  expression bands relative to control in AMO-1/CFZ cells; (c) Densitometry analysis
  of phosphorylated MAPK pathway proteins relative to control in AMO-1 cells treated
  with COB; (d) Densitometry analysis of phosphorylated MAPK pathway proteins relative
  to control in AMO-1 cells treated with ULIX; (e) Densitometry analysis of phosphorylated
  MAPK pathway proteins relative to control in AMO-1/CFZ cells treated with COB; (f)
  Densitometry analysis of phosphorylated MAPK pathway proteins relative to control
  in AMO-1/CFZ cells treated with ULIX. The dotted lines denote the protein expression
  level in the control samples, defined as 100%. The number of independent experiments
  (n) is indicated on the graphs. Results are presented as M ± SD. Statistical analysis
  was conducted using ANOVA with Dunnett’s multiple comparisons test. *—p< 0.05, **—p
  < 0.01, ***—p < 0.001
