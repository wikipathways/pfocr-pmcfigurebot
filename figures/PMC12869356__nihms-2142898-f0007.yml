figure_title: Eos regulates the responsiveness of Tregs to IL-2 via direct binding
  to the CD25 locus
caption: (A) Representative plots of Eos and CD25 expression on Tregs from the thymus
  or spleen of 7–9 wo WT mice.(B) Quantifications of CD25 MFI and frequencies of CD25+
  cells within Eos+ and Eos− Tregs from the thymus or spleen of 7–9 wo WT mice.(C)
  Representative plots of CD25 and Ccr6 expression on thymic Tregs from 8 wo WT and
  Eos KO mice. Quantification of CD25 MFI of Ccr6+ thymic Tregs from those mice.(D)
  Representative plots of pStat5 and Eos expression in thymic Tregs from 7 wo WT mice
  after stimulation with IL-2 for 20 min in vitro. Frequencies of pStat5+ cells within
  Eos+ and Eos− thymic Tregs.(E) Representative plots of pStat5 and CD73 expression
  on thymic Tregs from 7 to 9 wo WT or Eos KO mice. Frequencies of pStat5+ cells within
  CD73+ thymic Tregs from WT and Eos KO mice.(F) ChIP-seq analysis of the binding
  of Eos and Helios at the CD25 gene locus in WT or Eos cKO splenic Tregs.(G) ChIP-qPCR
  analysis of the binding of Eos and Helios at the CD25 gene locus in WT or Eos cKO
  splenic Tregs.(H) Representative pathways identified by Eos ChIP-seq using WT or
  Eos cKO splenic Tregs.(I) Representative Helios-targeted pathways that are also
  regulated by Eos from Helios ChIP-seq using WT or Eos cKO splenic Tregs.p values
  are determined by Student’s t test (B–E). Mean ± SD. *p < 0.05; **p < 0.01; ***p
  < 0.001; ****p < 0.0001
article_title: Eos plays a critical role in Treg homeostasis and modulates the function
  of recirculating thymic Tregs in the control of Treg development
