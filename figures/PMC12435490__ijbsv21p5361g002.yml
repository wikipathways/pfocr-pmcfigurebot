figure_title: MKRN2 inactivates the canonical Wnt pathway and motivates ccRCC cell
  apoptosis.
caption: 'MKRN2 inactivates the canonical Wnt pathway and motivates ccRCC cell apoptosis.
  (A, B, C) Gene Set Enrichment Analysis (GSEA) revealed significant associations
  between pathways in cancer, apoptosis, and Wnt signaling pathways in ccRCC and the
  mRNA levels of MKRN2. A False Discovery Rate (FDR) of less than 25% was considered
  statistically significant. (D) Western blot assay was conducted to evaluate the
  protein levels of Wnt and apoptosis-related proteins in MKRN2 overexpressing cells
  and the control. (E) TUNEL staining was employed to illustrate the rate of apoptosis
  in the indicated cells. (F) Flow cytometry analysis was employed to determine the
  proportion of apoptotic cells in samples with MKRN2-OE compared to control cells.
  (G) Western blotting shows subcellular localization of β-Catenin after MKRN2-KD.
  (H) Western blotting shows protein levels of MKRN2 and Wnt related-genes in the
  indicated cell lines. Cells with MKRN2-KD were treated with 10 µM ICG-001 (an inhibitor
  of β-catenin/TCF) or DMSO. (I) Flow cytometry analysis was employed to determine
  the proportion of apoptotic cells in indicated cell lines. (J) CCK8 assays for indicated
  cell lines (n = 4). Significance levels denoted as follows: ****p < .0001, ***p
  < .001, **p < .01, and *p < .05'
