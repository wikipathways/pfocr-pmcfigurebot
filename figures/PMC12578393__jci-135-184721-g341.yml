figure_title: IGFBP6 impairs macrophage-mediated bacterial phagocytosis and killing
caption: '(A) Phagocytic activity of PMs (1 × 106 cells) pretreated with rIGFBP6 (50/200
  ng/mL) or PBS for 4 hours; then challenged with FITC-labeled P. aeruginosa (30 min,
  37°C). Representative images from 3 independent experiments (scale bar: 50 μm).
  (B and C) Quantification of phagocytosis rate (B) and phagocytic index (C). (D)
  Gene set enrichment analysis (GSEA) of phagosome in the rIGFBP6 + bacteria group
  compared with PBS + bacteria group. (E) rIGFBP6-pretreated PMs (5 × 105 cells) were
  challenged with P. aeruginosa (30 min, 37°C). Internalized bacteria were quantified
  by CFU counting (n = 4/group). (F) rIGFBP6-pretreated PMs (5 × 105 cells) were challenged
  with P. aeruginosa. Bar chart shows macrophage killing rate (n = 7/group). (G) GSEA
  of ROS in the rIGFBP6 + bacteria group versus PBS + bacteria group. (H) Representative
  ROS fluorescence images (DCFDA staining). Scale bar: 1 mm. (I) Time-dependent ROS
  production in rIGFBP6-pretreated (200 ng/mL) PMs (1 × 106 cells) challenged with
  heat-inactivated P. aeruginosa (n = 4/group). (J and K) GSEA of inflammation-related
  pathways in the rIGFBP6 + bacteria group versus PBS + bacteria group. (L–N) IL-1β
  levels in supernatants from rIGFBP6-pretreated (200 ng/mL, 4 h) PMs (5 × 105 cells,
  L, n = 4/group), BMDMs (M, n = 3/group), and HMDMs (N, n = 3/group) after P. aeruginosa
  challenge (6 h). (O) Survival outcomes after adoptive transfer of rIGFBP6- versus
  PBS-treated PMs (n = 15/group). All data are representative of 3 independent experiments.
  Each dot in graphs represents an individual biological/technical replicate. Student’s
  t test in I; 1-way ANOVA in B, C, E, F, I, and N; log-rank test in O; NS, not significant.
  BMDMs, BM-derived macrophages; HMDMs, human monocyte–derived macrophages; PMs, peritoneal
  macrophages'
