figure_title: Inflammatory responses to DNA damage
caption: DNA damage from different sources, including excessive R-loops, can lead
  to cytosolic DNA or DNA:RNA hybrids. Extraneous DNA-sensing proteins, such as cGAS,
  can detect this DNA and induce an immune response by generating 2′3′ cyclic GMP–AMP
  (cGAMP), which interacts with STING, activating the cGAS-STING pathway. Reducing
  the amounts of R-loops and cytosolic DNA with nucleases and RNAses or the inhibition
  of cGAS-STING (with molecules such as hydroxychloroquine (HCQ)) are possible approaches
  to reduce immune disorders associated with DNA damage. Blue ribbons represent DNA
  strands and the red ribbon represents an RNA strand
