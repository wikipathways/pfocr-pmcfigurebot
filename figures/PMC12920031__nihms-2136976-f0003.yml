figure_title: The Lys lactylation isomers and how to distinguish between them
caption: 'a, The three Lys lactylation isomers include l-lactylation (Kl-la), which
  is derived from l-lactate, d-lactylation (Kd-la), which is derived from S-d-lactoylglutathione
  (LGSH), and N-ε-(carboxyethyl)-lysine (Kce), which is derived from methylglyoxal
  (MGO). b, The metabolic pathways involved in generation of Kl-la, Kd-la and Kce.
  The key enzymes and potential side reactions are indicated. In addition to Lys residues,
  MGO and LGSH are also highly reactive with a broad range of nucleophilic molecules
  (blue box), including Arg and Cys residues, nucleic acids and lipids. c, Analytical
  methods for detecting and characterizing Lys lactylation isomers, featuring two
  main approaches: immunological methods using isomer-specific antibodies, including
  immunoprecipitation coupled with mass spectrometry (IP–MS), immunohistochemistry
  (IHC) and western blotting, and chromatography-based methods using high-performance
  liquid chromatography coupled with tandem mass spectrometry (HPLC–MS/MS) analysis
  with chiral separation capabilities. This method can compare endogenous peptides
  with synthetic peptide standards to distinguish constitutional isomers. Chemical
  derivatization using Mosher’s reagent and chiral column, when combined with HPLC–MS/MS,
  allows for stereochemical discrimination between Kl-la and Kd-la. d, The chemical
  derivatization reactions and chromatography separation of Lys lactylation isomers.
  Top: the chemical derivatization reactions between l-lactyl Lys or d-lactyl Lys
  and methoxy-α-(trifluoromethyl)phenylacetyl chloride (MTPA-Cl; Mosher’s acid chloride).
  This reaction yields bis-derivatized products that amplify the stereochemical differences
  between the two isomers. Bottom: the extracted ion chromatograms from HPLC–MS/MS
  show the separation of the chemically derivatized synthetic Kl-la and Kd-la amino
  acid standards (light, K0) and the lactylated amino acids derived from cellular
  peptides (heavy labelled, K8). The extracted ion chromatograms demonstrate the presence
  of Kl-la in cell-derived peptide. GLO1, glyoxalase 1; GTPSCS, GTP-specific succinyl-CoA
  synthetase; LDH, lactate dehydrogenase. Panel d adapted from ref. 53, Springer Nature
  Limited'
