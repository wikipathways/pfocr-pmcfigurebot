figure_title: Amelioration of altered membrane repair and myogenesis pathway markers
  in mdx4cv muscle mediated by AAV-dystrophin constructs
caption: (A) Heatmap showing elevated expression of various proteins implicated in
  membrane trafficking and repair in mdx4cv gastrocnemius muscle and partial restoration
  with μDys5, midi-dystrophin, or full-length dystrophin delivered by AAV vectors.
  (B) Annexin (A1, A4, and A5) abundance in WT, dystrophic, or AAV-treated muscles.
  (C) Abundance of proteins involved in muscle repair. (D) Expression of key proteins
  involved in membrane trafficking and remodeling. (E) Galectin-1 and (F) galectin-3
  abundance in mdx4cv and WT muscles. Bar graphs represent mean ± SEM of n = 6 mice/group.
  NS, not significant. *P < 0.05, **P < 0.01, ***P < 0.001 versus WT; $P < 0.05, $$P
  < 0.01, $$$P < 0.001 versus saline group using 1-way ANOVA followed by Tukey’s post
  hoc test. μDys, micro-dystrophin; mDys, midi-dystrophin; fDys, full-length dystrophin
