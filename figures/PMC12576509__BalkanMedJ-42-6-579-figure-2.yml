caption: Scheme showing interaction(s) between cGAS-STING pathway and EFAs and its
  relationship with cytokines, metabolism and thermogenesis. The stimulator of interferon
  (STING) genes regulates cytoplasmic nucleic acid [such as micronucleus (MN)] associated
  inflammatory responses. STING regulates polyunsaturated fatty acids (PUFAs or EFAs)
  metabolism and EFAs and their metabolites inhibit STING-dependent inflammation.
  This cross regulation is central to the maintenance of metabolic homeostasis, inflammatory
  events and immune responses. The protein encoded by the FADS2 gene is a member of
  the fatty acid desaturase (FADS) gene family that acts on EFAs to convert them to
  their long-chain metabolites. MN containing cells are increased in uveitis. EFAs
  and their long-chain metabolites have anti-viral, anti-diabetic and immune and inflammation
  regulatory functions.EFA, essential fatty acid; IL-6, interleukin-6; TNF-α, tumor
  necrosis factor-alpha, DHA, docosahexaenoic acid; AA, arachidonic acid; LA, linoleic
  acid, ALA, alpha-linolenic acid
