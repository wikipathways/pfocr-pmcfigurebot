figure_title: HAECs have a dynamic transcriptional response to IL1B via alternative
  splicing
caption: A. 53 primary HAEC samples were treated with IL1B (10 ng/mL) and control
  media for four hours before collecting RNA. RNA-seq was performed, followed by differential
  splicing analysis using Leafcutter.B. Splice type categories in this study, and
  the number of significant DSTs (adjusted p.value < 0.05 and effect size (deltapsi)
  > 0.05, in each category.C. Percent of transcripts categorized as protein-coding
  or likely to be degraded by nonsense-mediated decay (NMD) based on RefSeq annotated
  stop codons. Dashed-line indicates average % of protein-coding transcripts (75%),
  including cryptic events (not shown).D. Pathway enrichment analysis was performed
  for DSGs, the top results are presented here. Full pathway enrichment analysis is
  available in Supplemental Table 2.E. PFKFB3 differential splicing at the first exon
  (AF). PFKFB3 has two transcription start sites (TSS’s) corresponding to mutually
  exclusive first exons for Isoform 1 (red) and Isoform 2 (blue). PSI values in IL1B
  and Control treatment are indicated on the sashimi plot for Isoform 1 and Isoform
  2 first exon inclusion events. The PFKFB3 AF-transcripts have differing 5’ UTR (middle)
  and protein-coding sequences (bottom) in their respective first exons
