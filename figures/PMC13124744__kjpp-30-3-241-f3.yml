figure_title: Metabolomic profiling of MDH2 S246 phosphorylation-deficient mutants
  under hypoxic stress
caption: (A) Principal component analysis score plot showing clustering of normoxia,
  hypoxia, wild type, hypoxic GFP-control, and hypoxic MDH2-S246A mutation groups
  with 71.6% principal variance at PC1 and 12.5% at PC2. (B) Partial least squares-discriminant
  analysis loading plot highlighting metabolites contributing to group separation
  wherein lactate and acetate are the two most-distinct metabolites under hypoxia.
  (C) Pathway enrichment analysis of differentially abundant metabolites, demonstrating
  significant enrichment of metabolic pathways in MDH2-S246A mutants compared to WT.
  Circle size represents enrichment ratio, and color scale indicates p-value. (D)
  Heatmap representation of metabolite expression across experimental groups. And
  respective quantitative analysis of selected metabolites showing increased acetate
  and lactate accumulation levels in MDH2-S246A cells compared with WT under hypoxia.
  Data are presented as mean ± SD. (D) One-way ANOVA. The numbers above graphs indicate
  significant p-values. MDH2, malate dehydrogenase 2; MT, mutant; WT, wild type
