figure_title: Hypoxia and combined hypoxia with high glucose downregulated NF-κB-p50
  expression while upregulating A20 and TNIP-3, two negative regulators of the NF-κB
  pathway.
caption: 'Hypoxia and combined hypoxia with high glucose downregulated NF-κB-p50 expression
  while upregulating A20 and TNIP-3, two negative regulators of the NF-κB pathway.
  High glucose increased NF-κB-p50 mRNA expression, while hypoxia, alone or in combination
  with high glucose, showed a marked reduction in NF-κB-p50 mRNA levels (A). In contrast,
  A20 and TNIP-3 mRNA expression (B,C) increased significantly, with the strongest
  induction observed with both stressors. Data represent mean ± SD of three independent
  experiments, each performed in duplicate [* p < 0.05, ** p < 0.01 and # p < 0.001
  compared with control (normoxia with 5.5 mM glucose)]'
