figure_title: 'STARD Flowchart: Patient and Sample Workflow.'
caption: 'STARD Flowchart: Patient and Sample Workflow. This flowchart illustrates
  the patient and sample processing pathway in this study. A total of 55 patients
  were screened, and all were eligible for analysis. Of these, two samples were classified
  as invalid due to insufficient DNA or degraded material. The remaining 53 valid
  samples underwent molecular and histological testing. Among them, 31 tested positive
  for HPV DNA and 22 tested negative. The final diagnosis was determined based on
  the combined histopathological and molecular workflow, ensuring a comprehensive
  assessment of HPV presence and lesion severity'
