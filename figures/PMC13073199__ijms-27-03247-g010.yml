figure_title: Western blot analysis of NF-κB pathway modulation in rat corneas after
  alkali injury.
caption: 'Western blot analysis of NF-κB pathway modulation in rat corneas after alkali
  injury. (A1,A2) Graphs of NF-κB p50 and NF-κB p105 relative density, compared with
  β-actin, measured at 6 h, at 4 days, and at 10 days after alkali injury. Quantitative
  densitometric analysis of NF-κB subunits p105 and p50, normalized to β-actin, at
  three time points post-injury: 6 h, 4 days, and 10 days. The graphs show a consistent
  downregulation of both NF-κB subunits in FP-treated corneas, especially evident
  at early time points (6 h and 4 d), indicating a time-dependent inhibition of the
  inflammatory cascade. SLPI shows a moderate reduction, while Buffer-treated groups
  maintain higher expression levels across all time points. (B) Western blot of NF-κB
  p105, p50 and β-actin at the three times measured after alkali injury of rat corneas
  treated with Buffer, SLPI and FP'
