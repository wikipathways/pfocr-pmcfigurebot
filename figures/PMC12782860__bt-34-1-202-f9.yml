figure_title: Schematic diagram of the antithrombotic mechanisms of chrysoeriol.
caption: Schematic diagram of the antithrombotic mechanisms of chrysoeriol. Chrysoeriol
  increases cAMP and cGMP levels, activating PKA and PKG, which reduces intracellular
  Ca2+ and inhibits MLC phosphorylation, disrupting platelet aggregation and clot
  retraction. It also promotes VASP phosphorylation, which reduces the affinity between
  integrin αIIbβ3 and fibrinogen. Furthermore, chrysoeriol suppresses PI3K/Akt and
  MAPK pathways, reducing granule secretion (ATP, serotonin) and TXA2 synthesis, which
  also contributes to the inhibition of platelet aggregation and clot retraction.
  Created with BioRender.com
article_title: Chrysoeriol Exerts Antiplatelet Effects by Regulating cAMP/cGMP and
