figure_title: The Hh pathway's role in immune microenvironment.
caption: The Hh pathway's role in immune microenvironment. Tumor cells secrete SHH,
  which acts on TAMs, activating the SHH-Gli1-STAT3 signaling cascade and upregulating
  PD-L1 expression on TAMs. This process impairs CD8⁺ T cell function. Additionally,
  TAMs inhibit CD8⁺ T cell infiltration into the TME by suppressing the production
  of chemokines CXCL9 and CXCL10, thereby facilitating tumor immune escape and promoting
  progression
