figure_title: The formation and maintenance of immune memory for TI.
caption: The formation and maintenance of immune memory for TI. Schematic depicting
  the quantitative alterations and dynamic shifts in the epigenetic landscape corresponding
  to distinct stages of macrophage training, alongside their consequential disease
  impacts. Macrophages across tissues establish an inflammatory memory state - characterized
  by transcriptionally inactive yet permissive chromatin - enabling the rapid recruitment
  of signal-dependent transcription factors and enhanced transcription of target genes
  upon heterologous or homologous secondary challenge. The top panel illustrates diverse
  stimuli (including BCG, LPS, and oxLDL) that engage cognate surface receptors, instigating
  profound epigenetic reprogramming and metabolic pathway rewiring within tissue-resident
  macrophages. This process entails elevated histone methylation and acetylation,
  coupled with augmented oxidative phosphorylation, mevalonate pathway flux, cholesterol
  metabolism, and glutaminolysis. Consequently, these trained macrophages exhibit
  heightened inflammatory mediator production, thereby conferring anti-tumor effects
  and protection against infectious diseases, while conversely demonstrating dual-edged
  consequences in the context of autoimmune disorders and atherogenesis. β-Glu, β-glucan;
  BCG, Bacille Calmette-Guérin; LPS, Lipopolysaccharides; oxLDL, oxidized low-density
  lipoprotein; OXPHOS, oxidative phosphorylation
