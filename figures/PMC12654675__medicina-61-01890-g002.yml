figure_title: Diagram of FGFR signaling pathways.
caption: 'Diagram of FGFR signaling pathways. FGF-FGFR binding induces receptor dimerization,
  leading to phosphorylation of FRS2, PLCγ, and JAK. This activates four major signaling
  cascades: (1) FRS2 recruits GRB2 and SOS to initiate RAS–MAPK signaling; (2) GRB2–GAB1
  activates the PI3K–AKT–mTOR pathway; (3) PLCγ hydrolyzes PIP2 to generate IP3 and
  DAG, leading to PKC activation; and (4) JAK–STAT signaling. Figure created with
  BioRender™'
