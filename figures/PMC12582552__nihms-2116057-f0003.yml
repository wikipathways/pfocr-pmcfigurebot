figure_title: CME disruption-induced endodermal suberization is CIFs/SCHENGEN pathway
  dependent
caption: (a) (Left) Boxplot of root endodermal suberin occupancy values from untreated
  and treated Col-0 WT plants with 10μM fluridone and 30μM of ES9–17 and/or ES-2,
  (right) representative images of 6 days old treated and untreated Col-0 WT plants
  showing FY suberin staining endodermal pattern. Data are the mean ± SD (N = 10–14
  roots), ordinary one-way ANOVA followed by a Tukey–Kramer test;(*) p < 0.05, (****)
  p < 0.0001. Results are representative of two independent experiments showing similar
  results. Asterisks indicate significant differences between untreated and treated
  plants. Box = interquartile range between the lower and upper quartiles, center
  line = median, + = mean, whiskers = min and max values. Scale bars = 1 mm.(b) (Left)
  Boxplot of root endodermal suberin occupancy values from untreated and treated abi1–1
  mutant plants with 30μM of ES9–17 or ES-2, (right) representative images of 6 days
  old of abi1–1 treated and untreated plants showing FY suberin staining endodermal
  pattern. Data are the mean ± SD (N = 10 roots), ordinary one-way ANOVA followed
  by a Tukey–Kramer test; (****) p < 0.0001, (ns) non-significant differences. Results
  are representative of two independent experiments showing similar results. Asterisks
  indicate significant differences between untreated and treated plants. Box = interquartile
  range between the lower and upper quartiles, center line = median, + = mean, whiskers
  = min and max values. Scale bars = 1 mm.(c) (Left) Boxplot of root endodermal suberin
  occupancy values from untreated and treated Col-0 WT, cif1cif2 and sgn1–2 plants
  with 30μM of ES9–17 or ES-2, (bottom) representative images of 6 days old of treated
  and untreated Col-0 WT, cif1cif2 and sgn1–2 plants showing FY suberin staining endodermal
  pattern. Data are the mean ± SD (N = 10–16 roots), ordinary one-way ANOVA followed
  by a Tukey–Kramer test; (**) p < 0.01, (****) p < 0.0001, (ns) non-significant differences.
  Results are representative of two independent experiments showing similar results.
  Asterisks indicate significant differences between untreated and/or treated plants.
  Box = interquartile range between the lower and upper quartiles, center line = median,
  + = mean, whiskers = min and max values. Scale bars = 1 mm
