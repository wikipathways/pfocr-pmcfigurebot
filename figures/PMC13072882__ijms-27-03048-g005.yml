figure_title: Neuronal development in the early stages can be accelerated by BMEE.
caption: 'Neuronal development in the early stages can be accelerated by BMEE. (A)
  Compound–target–neuronal development signaling pathway network. The green hexagons
  denote compounds, and the small and large circular nodes represent targets and signaling
  pathways, respectively. (B) Fluorescent images showing neurons grown until 24 h
  in the same culture condition with vehicle/BMEE (2.5 μg/mL), fixed and immunostained
  with MAP2 (Green, neuronal marker) and Tau (Red, dendritic marker) antibody. (C)
  Different developmental stages were observed at 24 h: lamellipodia, minor processes,
  and axonal outgrowth (insets). Statistical analysis shows the percentage of neurons
  in different stages at 24 h in vehicle- or BMEE-treated conditions. (D) Fluorescent
  images showing neurons grown until 48 h in the same culture condition with vehicle/BMEE
  (2.5 μg/mL), fixed and immunostained with MAP2 and Tau antibody. (E) Different developmental
  stages were observed at 48 h: lamellipodia, minor processes, and axonal outgrowth
  (insets). Statistical analysis shows the percentage of neurons in different stages
  at 48 h in vehicle- or BMEE-treated conditions. Scale bar, 20 μm for all image panels
  (B,D) and 2 μm for panels (C,E). Statistical significance was determined using a
  two-tailed Student’s t-test. Data are presented as mean ± SEM from three independent
  experiments (n = 3), with 100–150 neurons analyzed in each experiment (* p < 0.05,
  ** p < 0.01, *** p < 0.001)'
