figure_title: Si-ITGA5 partially reverses the inhibition of apoptosis by a miR-222-5p
  inhibitor.
caption: 'Si-ITGA5 partially reverses the inhibition of apoptosis by a miR-222-5p
  inhibitor. (A) Western blotting was used to determine (B) Bcl-2 and (C) Bax protein
  levels after co-transfection (n=3). (D) Cell Counting Kit-8 assay was used to assess
  cell viability after co-transfection with miR-222-5p inhibitor and si-ITGA5 (n=3).
  (E) Flow cytometry was performed to evaluate (F) apoptosis under co-transfection
  conditions (n=3). (G) Schematic diagram of the molecular mechanism: miR-222-5p mediates
  endothelial cell apoptosis and atherosclerotic progression by targeting the ITGA5
  pathway. *P<0.05, **P<0.01 and ***P<0.001. HUVECs, human umbilical vein endothelial
  cells; ITGA5, integrin subunit α5; miR, microRNA; NC, negative control; ns, not
  significant; si, small interfering; UTR, untranslated region'
