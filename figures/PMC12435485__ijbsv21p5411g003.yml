caption: 'RNA-seq was used to analyze the transcriptional profiles of transformed
  follicular lymphoma cells treated with chiglitazar. (A-B) Volcano plot (A) highlights
  key targets (red: upregulation; green: downregulation), and hierarchical clustering
  heatmap (B) delineates distinct expression patterns of top 50 DEGs of RNA sequencing
  data from SC-1 cells after 24 h of chiglitazar treatment. (C) KEGG enrichment analysis
  demonstrated that multiple signaling pathways were enriched in chiglitazar-treated
  t-FL, including apoptosis and glycolysis/gluconeogenesis. (D-G) GESA analysis revealed
  that multiple signaling pathways were enriched in chiglitazar-treated t-FL cells,
  including PPARα signaling (D), glycolytic pathways (E), mitochondrial functional
  regulation (F), and apoptotic pathways (G). (*P < 0.05, **P < 0.01, ***P < 0.001,
  ****P < 0.0001)'
