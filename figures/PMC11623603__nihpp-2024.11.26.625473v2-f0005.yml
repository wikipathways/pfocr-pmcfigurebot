figure_title: Model of ARHGAP18’s coordination of RhoA and Hippo signaling pathways
  in Human epithelial cells
caption: Under normal cellular conditions (black arrows), ARHGAP18 localizes to the
  nucleus, cell junctions, and microvilli. ARHGAP18 forms complexes with (1) Merlin
  at cell junctions and (2) ERMs in microvilli through direct binding to their conserved
  FERM domains. Once recruited to junctions by Merlin, ARHGAP18 regulates RhoA locally.
  Merlin simultaneously coordinates mechanosensation and proliferation signaling through
  activation of the hippo pathway. (4) Hippo signaling regulates the phosphorylation
  of YAP, where the active, dephosphorylated state is shuttled to the nucleus. (5)
  Active YAP/TAZ coordinate transcriptional changes which result in (6) expression
  of proteins regulating the actin cytoskeleton and proliferation. 7) Alternatively,
  when Hippo signaling suppresses YAP activation (orange arrows), YAP is phosphorylated
  through an ARHGAP18 dependent mechanism. 8) ARHGAP18 complexes with YAP which is
  required for proper phosphorylation and eventual shuttling of YAP to the cytosol
  for degradation. Loss of ARHGAP18 results in persistent localization of YAP to the
  nucleus with constitutively active proliferation signaling in addition to misregulation
  of RhoA at junctional and apical membranes. Without coordination of Hippo and RhoA
  signaling by ARHGAP18, knockout cells present a loss of stress fibers and filopodia
  at the basal surface through YAP signaling with disruption of microvilli actin core
  bundles and junctional integrity at the apical surface through RhoA signaling
article_title: The Rho effector ARHGAP18 coordinates a Hippo pathway feedback loop
  through YAP and Merlin to regulate the cytoskeleton and epithelial cell polarity
