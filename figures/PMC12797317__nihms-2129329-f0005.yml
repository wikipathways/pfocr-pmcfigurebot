figure_title: Propionate supplementation altered transcriptomic expressions in the
  kidneys of MRL-lpr mice.
caption: Propionate supplementation altered transcriptomic expressions in the kidneys
  of MRL-lpr mice. RNA was isolated from the kidneys of CON and PA-treated MRL-lpr
  mice, and RNA-Seq was performed. (A) Volcano plot showing differentially expressed
  genes in the kidneys of controls and PA-treated mice. Red indicates upregulation;
  green indicates downregulation. Data were derived from 5 mice in each group, with
  a P value of <0.05 and a log2 fold change of <1 compared with the controls. (B)
  Venn diagram depicting the overlap of nondifferentially expressed genes and differentially
  expressed genes. (C) Analysis of GO terms for the differentially expressed genes
  with P value < 0.05. (D) KEGG biological pathway analysis of differentially expressed
  genes. CON, control; COVID-19, coronavirus disease 2019; GO, gene ontology; mRNA,
  messenger ribonucleic acid; PA, propionate; RNA, ribonucleic acid; RNA-seq, ribonucleic
  acid sequencing; rRNA, ribosomal ribonucleic acid; AMPK; HIF-1; MAPK; PPAR; KDC;
  KDP; KEGG; MRL-lpr
