figure_title: The flavonoid biosynthesis pathway.
caption: 'The flavonoid biosynthesis pathway. (a) Biochemical reaction steps of flavonoid
  synthesis. Chemical products were shown in boxes, and enzymes were shown next to
  the arrows. The enzymes marked in red indicated that its coding gene was highly
  expressed in the red-skinned bulk in this study. CHS: chalcone synthase; CHI: chalcone
  isomerase; FNS: flavone synthase; F3H: flavanone 3-hydroxylase; FLS: flavonol synthase;
  DFR: dihydroflavonol-4-reductase; ANS: anthocyanidin synthase; LAR: leucoanthocyanidin
  reductase; ANR: anthocyanidin reductase; UF3GT: flavonoid 3-O-glucosyltransferase.
  (b) Putative binding sites of the MBW complex in the promoter region of RsDFR (Rs0R9c041942)
  and RsANS (Rs0R4c020786). The blue and yellow small rectangles represented the MYB-recognizing
  element (MRE) and bHLH-recognizing element (BRE), respectively'
