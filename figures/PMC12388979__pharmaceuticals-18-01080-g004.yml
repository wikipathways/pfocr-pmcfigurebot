figure_title: AKG attenuates H2O2-induced senescence in HT22 cells via modulation
  of cell viability, senescence markers, and the p53/p21 pathway.
caption: |-
  AKG attenuates H2O2-induced senescence in HT22 cells via modulation of cell viability, senescence markers, and the p53/p21 pathway. (A) H2O2 treatment significantly reduced HT22 cell viability in a dose-dependent manner. (B) Western blot analysis of p53 and p21 expression following H2O2 treatment. (C,D) Quantitative analysis of p53 and p21 protein expression levels. (E) Effects of different concentrations of AKG on cell viability in HT22 cells. (F) Effects of different concentrations of AKG on cell viability in H2O2-induced HT22 cells. (G,H) EdU staining and quantification of proliferating HT22 cells. (I,J) SA-β-gal staining and quantification. (K) The H2O2-induced aging, reversed by AKG, was detected by western blot (p53 and p21). (L,M) Quantification of p53 and p21 protein expression levels. (N) The mRNA expression levels of CXCL-1, TNF-α, IL-1β, and IL-6 were quantified by qRT-PCR. All data are expressed as means ± S.D. (n ≥ 3). #
  p < 0.05, ###
  p < 0.001, and ####
  p < 0.0001 versus the control group; * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001 versus the model group
