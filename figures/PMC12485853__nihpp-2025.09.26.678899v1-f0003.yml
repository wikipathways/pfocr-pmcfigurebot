figure_title: PGLYRP1 selectively modulates NOD1 and NOD2 signaling in response to
  Bordetella pertussis peptidoglycan
caption: (A–B) HEK293 reporter cells expressing either mouse (A) or human (B-D) NOD1
  or NOD2 were stimulated with recombinant mouse (A) or human (B-D) PGLYRP1 (12.5
  ug/mL), purified tracheal cytotoxin (TCT) (A,B), muramyl dipeptide (MDP, NOD2 agonist)
  (C) or conditioned bacterial growth media (OD = 0.8) (D). NF-κB-driven SEAP reporter
  activity was measured to assess pathway activation. Reporter activation was quantified
  after 18–24 hours. Single-cell RNA sequencing was performed on lung tissue from
  BALB/c mice infected with B. pertussis at 4 days post-infection. Neutrophils were
  subjected to further sub-clustering and visualized as a UMAP (E). Violin plots visualizing
  expression of Nod1, Nod2, IL1a and Pglyrp1 across neutrophil sub-clusters (F). Volcano
  plot demonstrating differentially expressed genes in Nod1 (blue) or Nod2 (red) expressing
  neutrophils (G) Single-cell analyses represent combined data from two mice per group.
  Statistical analyses were performed using Student’s t-test or adjusted p-values
  as appropriate. **, p-value < 0.01, *** p-value < 0.005, **** p-value < 0.001
article_title: A dual role for PGLYRP1 in host defense and immune regulation during
  B. pertussis infection
