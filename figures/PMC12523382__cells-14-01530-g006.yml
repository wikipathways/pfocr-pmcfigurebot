figure_title: Schematic overview of the putative inhibitory role of FynT kinase activity
  in modulating DHA-induced pyroptosis and downstream caspase-3 activation in astrocytic
  cells.
caption: Schematic overview of the putative inhibitory role of FynT kinase activity
  in modulating DHA-induced pyroptosis and downstream caspase-3 activation in astrocytic
  cells. Our findings suggest FynT involvement in the DHA-induced caspase-1/GSDMD-mediated
  pyroptotic process, which may also negatively modulate the downstream activation
  of apoptotic caspase-3. This pathway is likely distinct from the mitochondrial apoptotic
  pathway, which involves the mitochondrial apoptotic markers Bax and Bcl-2 in astrocytes.
  FynT involvement in caspase-3-mediated apoptosis is suggested by our results, but
  requires confirmatory follow-up studies
