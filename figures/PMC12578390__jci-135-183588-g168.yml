figure_title: Antiinflammatory effects of cyproheptadine via NF-κB pathway
caption: '(A) Volcano plot of the DEGs in RNA-seq performed on human chondrocytes
  (n = 5) treated with IL-1β (1 ng/mL) for 6 hours. (B) Volcano plot of the DEGs in
  RNA-seq performed on human chondrocytes (n = 5) treated with IL-1β (1 ng/mL) for
  6 hours after pretreatment with or without cyproheptadine (CYP) for 24 hours. (C)
  Venn diagram of the shared upregulated genes by IL-1β stimulation and the downregulated
  genes by CYP treatment under IL-1β stimulation. Metascape enrichment (D) and TRRUST
  (E) analysis using the shared genes in C. (F) GSEA showing induced “cytokine-mediated
  signaling pathway” in chondrocytes treated with IL-1β. (G) GSEA showing inhibited
  “cytokine-mediated signaling pathway” in chondrocytes treated with CYP under IL-1β
  stimulation. (H) Western blot analysis of total p65 and phosphorylated p65 at Ser536
  (p-p65 (Ser536)) in chondrocytes (n = 4) incubated with IL-1β (1 ng/mL) for 20 minutes
  after pretreatment with or without CYP (30 μM) for 24 hours. (I) Immunocytochemistry
  of p65 in chondrocytes (n = 3) incubated with IL-1β (1 ng/mL) for 20 minutes after
  pretreatment with or without CYP (30 μM) for 24 hours. Scale bar: 50 μm. Data are
  presented as means ± SD. Statistical analysis was performed using 1-way ANOVA with
  the Tukey-Kramer post hoc test. **P < 0.01, ***P < 0.001, ****P < 0.0001'
