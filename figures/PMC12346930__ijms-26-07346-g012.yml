figure_title: Relative levels of mRNA of Nrf2/ARE pathway in GBM cells.
caption: |-
  Relative levels of mRNA of Nrf2/ARE pathway in GBM cells. U-251 MG (a) or DBTRG-05MG (b) cells maintained in DMEM or Plasmax media were infected with PV at MOI 1, and mRNA levels were measured 24 h.p.i. by reverse transcription and real-time PCR analysis. mRNA levels were normalized to mRNA of β-glucuronidase and then to values of mock-infected cells in DMEM. Data are presented as mean ± SD, * p ≤ 0.05, ** p ≤ 0.01, *** p ≤ 0.001, #
  p < 0.07 by ANOVA with Tukey post hoc test
