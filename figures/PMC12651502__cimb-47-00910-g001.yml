figure_title: Network pharmacology analysis of thymol in primary ovarian failure.
caption: Network pharmacology analysis of thymol in primary ovarian failure. (A) Venn
  diagram showing POF-related targets identified from GeneCards, OMIM, TTD, and DisGeNET
  databases. (B) Venn diagram depicting overlap between POF targets and potential
  targets of thymol, γ-terpinene, and β-caryophyllene. (C) Interaction network of
  shared targets between thymol and POF, highlighting 12 core targets selected using
  Cytoscape. The darker color and larger circle size indicate nodes with higher degree
  values. (D) Gene Ontology enrichment analysis of the 12 core targets. (E) Kyoto
  Encyclopedia of Genes and Genomes pathway enrichment analysis of the 12 core targets
