figure_title: TFEB inhibits proinflammatory cytokine release via upregulation of DAB2
caption: '(A) A Venn diagram was used to integrate four different gene lists: upregulated
  genes in TFEB-overexpressing HUVECs treated with DOX (3,370 genes), upregulated
  genes in TFEB-overexpressing HUVECs treated with vehicle (3,267 genes), TFEB target
  genes from a chromatin immunoprecipitation (ChIP)-seq dataset in HUVECs (GSE88894,
  1002 genes), and genes in the autophagosome-lysosomal pathway (ALP, 891 genes).
  (B) Reanalysis of ChIP-seq dataset (GSE88894) identified potential TFEB binding
  sites in the promoter region of human DAB2. (C) HUVECs were infected with adenovirus
  encoding LacZ (AdLacZ) or Flag-TFEB (AdFlag-TFEB, 20 multiplicity of infection,
  MOI). Twenty-four hours later, ChIP quantitative PCR (ChIP-qPCR) was performed to
  measure TFEB enrichment at the DAB2 promoter (three individual primer pairs) and
  normalized to 10% input. IgG was used as a negative control (n = 5). (D) A luciferase
  reporter assay was performed by co-transfecting HEK293FT cells with control (DAB2
  non-promoter region), DAB2-promoter, and DAB2-promoter with deletion of TFEB binding
  region (illustrated). Firefly and Renila luciferase activities were measured by
  a luminometer (n = 5). (E) HCMECs were transfected with siCtrl or siTFEB (20 nM)
  for 48 hours and then treated with DOX (1 μM) for 24 hours. DAB2 expression was
  measured by Western blot (n = 5). (F) The expression of DAB2 in MCMECs from WT and
  EC-Tfeb Tg mice was measured by Western blot and quantified (n = 6). (G) HUVECs
  stably overexpressing TFEB and control ECs were treated with DOX (1 μM). At the
  indicated time points, DAB2 expression was assessed by Western blot and quantified
  (n = 6). (H) HCMECs were transfected with siCtrl or siDAB2 (20 nM) for 48 hours,
  followed by incubation with MitoSOX (5 μM) for 30 min. ROS production was determined
  by flow cytometry (n = 5–9). (I) C-G-LC3-ECs were transfected with siCtrl or siDAB2
  (20 nM) for 48 hours and then treated with DOX (1 μM) for 24 hours. Autophagic flux
  was assessed by flow cytometry (n = 6). (J-K) HUVECs stably overexpressing TFEB
  and control ECs were treated with DOX (1 μM) for 24 hours. The release of IL-6 (J)
  and IL-1β (K) into the culture medium was determined by ELISA (n = 5 in J and n
  = 5–6 in K). Data in panels C, D, and F were analyzed by an unpaired t-test. Data
  in panel E was analyzed by two-way ANOVA. Data in panels G-K were analyzed by two-way
  ANOVA followed by Tukey post hoc test. Data are presented as mean ± SEM, *P < 0.05,
  **P < 0.01, ***P < 0.001'
