figure_title: Analysis of apoptotic pathway components in retinal organoids
caption: 'a) Representative Western blot images show expression of cleaved caspase-3
  (ClC3), cleaved caspase-8 (ClC8), cleaved caspase-9 (ClC9), BAX, and BCL2, in retinal
  organoids at weeks 7 and 8 of differentiation. Notice the lack of ClC9 detection.
  b) Western blot quantification shows a decrease in the BAX/BCL2 ratio at 8 weeks
  of differentiation- the time of RGC death. c) Western blot quantification also shows
  an increase in ClC8 at 8 weeks of differentiation. N=3–8 biological replicates per
  time point, as plotted. Bar graph represents mean ± SEM. *p<0.05; **p<0.01. Scale
  bar: 100 μm'
article_title: Developmental wave of programmed ganglion cell death in human retinal
