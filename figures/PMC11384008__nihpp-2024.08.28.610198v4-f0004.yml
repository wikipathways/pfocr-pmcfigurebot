figure_title: The GET and SND posttranslational targeting pathways are needed for
  DNPs to access the ER
caption: A. Fluorescence micrographs of mNG-Ybr196c-a in cells with the indicated
  deletions of GET or SND components (Get3 or Snd3, respectively) are shown. B and
  C. Increasing numbers of puncta per cell, and concomitant loss of clear ER localization,
  are associated with disruption of the ER-targeting pathways needed for DNP targeting.
  The percentage of cells (n=305–881) with the number of puncta per cell (based on
  images shown in panel A and Figure S5C-D), are indicated as a stacked distribution
