figure_title: Over-representation analysis of differentially expressed genes from
  the endometrium tissue of subfertile and fertile beef heifers.
caption: Over-representation analysis of differentially expressed genes from the endometrium
  tissue of subfertile and fertile beef heifers. (A) Over-represented KEGG pathways
  and genes identified through ClueGO. Functionally related terms partially overlap
  and are randomly colored. The significance of pathway enrichment is represented
  as the node size. (B) Gene set enrichment analysis of expressed genes. The normalized
  enrichment score (NES) of top-enriched (blue bars) and top-depleted (orange bars)
  pathways is based on the comparison of subfertile and fertile heifers. Only pathways
  with an NES ≥ |1.0| are shown
