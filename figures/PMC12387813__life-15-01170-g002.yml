figure_title: Macrophage polarization pathways.
caption: Macrophage polarization pathways. M0 macrophages can differentiate into classically
  activated M1 macrophages upon stimulation with IFN-γ and lipopolysaccharide (LPS),
  leading to the production of pro-inflammatory cytokines (IL-1β, IL-6, TNF-α, IL-12).
  Alternatively activated macrophages (M2) are subdivided into M2a (induced by IL-4/IL-13),
  M2b (induced by immune complexes + LPS or IL-1R activation), M2c (stimulated by
  IL-10), and M2d or tumor-associated macrophages (TAMs, induced via TLRs). Each M2
  subtype exhibits distinct cytokine profiles and expression markers (marked in red),
  contributing to tissue repair, immunoregulation, or tumor progression. Arrows indicate
  the cytokines or signals responsible for each polarization pathway (modified from
  Gao et al., 2020 [44])
