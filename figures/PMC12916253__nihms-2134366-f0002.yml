figure_title: Single-cell resolution of retinal waves reveals stereotyped initiation
  and propagation patterns (A-W)
caption: '2A–C. Retina overview (A), apical side (B top) and cross-section (B bottom)
  of a single ommatidium immunostained with Dlg1. The dotted line in (B top) indicates
  the cutting plane for (B bottom) and vice versa. (C) Diagram of retinal cell types:
  cone cell (CC), primary pigment cell (1PC), secondary pigment cell (2PC), tertiary
  pigment cell (3PC), bristle cell (BC), photoreceptor (PR). Scale bars: 20 μm (A),
  5 μm (B, C).2D–H. Three-dimensional reconstructions of retinal cell morphology in
  longGMR-GAL4>UAS-MCFO retina at 40 hAPF. Top (D–H tops) and side views (D–H bottoms)
  show single cell morphology. Magenta marks single-cell labeling, green marks Dlg1.
  Arrow in (D bottom) highlights the leg-like structure of CC contacting IOCs. Scale
  bar: 10 μm (D–H).2I–L. Retinal calcium wave activity at single-cell resolution displayed
  as color-coded 3-min temporal activity maps for early stage 1 (I), late stage 1
  (J), stage 2 (K), and stage 3 (L). The arrow in (I) indicates a single cone cell
  firing, arrows in (J) indicate vertical waves, and the arrow in (L) indicates a
  primary pigment cell firing. All images came from the same retina. Scale bar: 10
  μm (I–L). See also Movie 3.2M–P. Vertical pathway patterns including single CC firing
  (M), CC–CC propagation (N), CC– 1PC propagation (O), and CC–IOC propagation (P).
  Time points are shown at T1 (cyan) and T2 (red, 4 s later). Bottom panels show schematics.
  Scale bar: 5 μm (M–P). See also Fig. S2A, C–E, Movie 4.2Q. Event log of retinal
  waves from stage 1 through early stage 2 in a single retina. Each bin represents
  a 1-min interval, and event frequency is color-coded. Blue box marks the vertical
  pathway, and red box marks the lateral pathway.2R–T. Lateral pathway wave patterns.
  (R, S) show T-series with apical (green) and basal (magenta) layers, where T1 and
  T2 are separated by 4 s. Cells: initial 2PC (1), propagated CC (2), 2PC (3), 3PC
  (4). (T) shows schematic representation of calcium signaling at T1 (cyan) and T2
  (red). Scale bar: 5 μm (R, S). See also Fig. S2F, Movie 5.2U, V. Diagrams of lateral
  pathway wave patterns as in (R–T).2W. Diagram of retinal wave propagation along
  vertical and lateral pathways across multiple ommatidia'
