figure_title: Leech enhances efficacy of EC-Exo in promoting collateral circulation
  establishment in MCAO/R mice.
caption: 'Leech enhances efficacy of EC-Exo in promoting collateral circulation establishment
  in MCAO/R mice. (A) Representative images depicting microvascular red blood cell
  velocity in MCAO/R mice along with corresponding statistical findings (n = 4). The
  lines represent the flow pathways of red blood cells. (B) Microvascular density
  and patency of MCAO/R mice (n = 4). The yellow arrows represent the accumulation
  of dyes, and the white arrows represent the improved distribution of blood vessels.
  (C) Representative images depicting immunofluorescence staining and corresponding
  statistical analysis of CD31/BrdU positive cells in ischemic cortex of MCAO/R mice
  (n = 4). Data analyzed by one-way ANOVA followed by multiple comparisons using Tukey’s
  post hoc test and expressed as mean ± standard deviation. ## p < 0.01 vs. Sham;
  * p < 0.05, ** p < 0.01 vs. Model; & p < 0.05 vs. EC-Exo'
