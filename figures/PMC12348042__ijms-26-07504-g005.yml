figure_title: Effects of beLP-K-mediated E3-ubiquitin proteasome pathway inhibition
  on DEX-induced damage in C2C12 myotubes.
caption: 'Effects of beLP-K-mediated E3-ubiquitin proteasome pathway inhibition on
  DEX-induced damage in C2C12 myotubes. (A) Western blotting of FoxO3α, MAFbx/atrogin-1,
  MuRF1, and GAPDH. (B) Quantitative analysis of FoxO3α and GAPDH expression (n =
  4). (C) Quantitative analysis of MAFbx/atrogin-1 and GAPDH expression (n = 7). (D)
  Quantitative analysis of MuRF1 and GAPDH expression (n = 5). GAPDH expression remained
  stable across all groups and was used to normalize the expression levels of each
  protein. Results are expressed as multiple changes compared to the DEX treatment
  group, which was set to 1. Data are presented as the mean ± SEM; *** p < 0.001 compared
  to the control group. ## p < 0.01 and ### p < 0.001 compared to the DEX treatment
  group. DEX: dexamethasone, FoxO3α: forkhead box o3 α, MAFbx: muscle atrophy f-box,
  MuRF1: muscle ring finger protein-1, and GAPDH: glyceraldehyde 3-phosphate dehydrogenase'
