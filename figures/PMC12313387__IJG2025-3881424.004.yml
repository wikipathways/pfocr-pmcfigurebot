caption: Correlation analysis of six hub lncRNAs with immune infiltration score in
  CRC. (a) Correlation of six hub lncRNAs with StromalScore. (b) Correlation of six
  hub lncRNAs with ImmuneScore. (c) Correlation of six hub lncRNAs with TumorPurity.
  (d) CIBERSORT was used to calculate the correlation analysis between six hub lncRNAs
  and 22 types of immune cells. (e) ssGSEA was used to calculate the correlation analysis
  between six hub lncRNAs and 28 types of immune cells. (f) Correlation of six hub
  lncRNAs with HALLMARK pathway ssGSEA score. In the graphs, ∗ indicates p < 0.05,
  ∗∗ indicates p < 0.01, ∗∗∗ indicates p < 0.001, and ∗∗∗∗ indicates p < 0.0001
