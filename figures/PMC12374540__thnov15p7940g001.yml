figure_title: The ATF6 arm of the UPR pathway is activated in a lens EMT model.
caption: The ATF6 arm of the UPR pathway is activated in a lens EMT model. (A) Experimental
  design. (B) Images under a slit-lamp microscope of adult control mice, lens-punctured
  mice at 6 h, and lens-punctured mice at 7 d. Scale bars, 200 μm. (C) Representative
  images of HE-stained lens sections from adult control mice 6 h after lens puncture
  and 7 d after lens puncture. Scale bars, 50 μm. (D) Results of GSEA enrichment.
  (E) Western blotting and quantification of the EMT markers fibronectin (FN), N-cadherin
  (N-cad), and SNAI1; the epithelial cell marker E-cadherin (E-cad); and the UPR markers
  p-PERK, p-IRE1α, full-length ATF6 (ATF6), cleaved ATF6 (c-ATF6) (n = 5). Data are
  presented as mean ± SEM; *p < 0.05, **p < 0.01, ***p < 0.001. (F) Whole-mount immunostaining
  and 3D cross-sectional images of ATF6 and SNAI1. Quantitative colocalization analysis
  of immunostaining for ATF6 and SNAI1 by Pearson's correlation coefficient (n = 5).
  Scale bars, 100 μm. Data are presented as mean ± SEM; *p < 0.05, **p < 0.01, ***p
  < 0.001. (G) Representative images of immunostained lens sections of EMT markers,
  including FN, α-SMA, SNAI1, and ATF6, from adult control mice 6 h after lens puncture
  and 7 d after lens puncture. Scale bars, 50 μm
