figure_title: At 5 dpf down-regulated transcripts with protein counterparts and inhibition
  of pathways emerge.
caption: At 5 dpf down-regulated transcripts with protein counterparts and inhibition
  of pathways emerge. Volcano plot of Differentially Expressed Genes (DEGs) comparing
  A. 5 dpf Heterozygous (HT) compared to 5 dpf Wild Type (WT) samples and B. 5 dpf
  Homozygous Mutant (MUT) compared to 5 dpf WT samples. Volcano plot of Differentially
  Abundant Proteins (DEPs) comparing C. 5 dpf HT compared to 5 dpf WT samples and
  D. 5 dpf MUT compared to 5 dpf WT samples. Ingenuity Pathway Analysis (IPA) pathway
  enrichment by patterns of DEGs from E. 5 dpf HT compared to WT samples and F. 5
  dpf MUT compared to WT samples. Ingenuity Pathway Analysis (IPA) pathway enrichment
  by patterns of DEPs from G. 5 dpf HT compared to WT samples and H. 5 dpf MUT compared
  to WT samples. I. Overlap of DEGs with p-value < 0.05 from 5 dpf HT v WT and DEGs
  with p-value < 0.05 from 5 dpf MUT v WT. J. Overlap of DEPs with p-value < 0.05
  from 5 dpf HT v WT and 5 dpf MUT v WT. K. Overlap of DEGs with p-value < 0.05 from
  5 dpf HT v WT and MUT v WT (purple) and DEPs with p-value < 0.05 from 5 dpf HT v
  WT and MUT v WT (green). L. Overlap of 5 dpf DEGs and DEPs from K. and Neuro-GO
  list. M. Log2 FC for selected DEGs and DEPs from MUT v WT comparison from overlap
  in K. and overlap in L. underlined
