figure_title: BMSCs participate in brain regulation through autologous transplantation,
  secretion of trophic factors, and inhibition of inflammatory factors.
caption: BMSCs participate in brain regulation through autologous transplantation,
  secretion of trophic factors, and inhibition of inflammatory factors. Transplanted
  BMSCs exhibit the capacity to differentiate into astrocytes, choline acetyltransferase
  neurons, and oligodendrocytes, thereby contributing to the regulation of brain function.
  Concurrently, BMSC transplantation enhances superoxide dismutase activity in the
  hippocampus by upregulating PSD95 and Egr1 expression, consequently ameliorating
  hippocampal cognitive function. Furthermore, BMSCs play a pivotal role in brain
  regulation through the action of BDNF, VEGF, and NGF. BDNF, firstly, suppresses
  the expression of pro-inflammatory cytokines (TNF-α, IFN-γ, IL-1β, IL-6) and promotes
  the expression of anti-inflammatory cytokines (IL-4, IL-10, TGF-β, IL-11). Additionally,
  BDNF mitigates neuronal apoptosis and fosters neuronal differentiation and proliferation.
  Secondly, VEGF orchestrates brain capillary production. Moreover, NGF facilitates
  neural-like cell differentiation, participates in the restoration of injured brain
  microvascular cells, downregulates the pro-inflammatory cytokine TNF-α, and inhibits
  the TNF-α/RelB pathway to mitigate inflammatory responses. The green arrow indicates
  promotion, while the red arrow indicates inhibition
