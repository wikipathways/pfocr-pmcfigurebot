figure_title: A microglial immunometabolic program in the aged brain (Component 351)
caption: (A) Cell-type loadings highlight strong microglial contributions to this
  component. (B) Top gene loadings from snRNA-seq show elevated expression of immunoglobulin
  and antigen-presentation transcripts (e.g., IGKC, IGHG1, CD68, HLA-DRB1), consistent
  with immune activation. (C) Positively loaded proteins include antioxidant and stress
  response factors (e.g., CUTA, SERINC3, SEP15), while negatively loaded proteins
  reflect downregulation of PI3K-Akt-mTOR signaling (e.g., AKT3, PTEN). (D) KEGG pathway
  enrichment for negatively loaded proteins shows suppression of metabolic and growth
  pathways, including mTOR, PI3K-Akt, and TNF signaling. (E) CpG sites near immune
  and metabolic genes (e.g., AKT1, DAAM1, PLEKHG5) show consistent loading directions,
  supporting epigenetic regulation of this axis. (F) Sample-level scores across individuals,
  with one outlier showing markedly high loading score, potentially indicating a localized
  or atypical inflammatory process
article_title: Aged brain multi-omic integration captures immunometabolic and sex
