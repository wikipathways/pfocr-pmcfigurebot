figure_title: Role of the vascular endothelium and the nitric oxide -soluble guanylate
  cyclase-cyclic guanosine monophosphate pathway in the vasodilator effect induced
  by apigenin 7-glucoside (A7G) in the mesenteric vascular beds of Wistar Kyoto (normotensive)
  and spontaneously hypertensive rats (hypertensive).
caption: Role of the vascular endothelium and the nitric oxide -soluble guanylate
  cyclase-cyclic guanosine monophosphate pathway in the vasodilator effect induced
  by apigenin 7-glucoside (A7G) in the mesenteric vascular beds of Wistar Kyoto (normotensive)
  and spontaneously hypertensive rats (hypertensive). The data show the effects of
  A7G (0.1, 0.3, and 1 µmol) in preparations with intact (End +) versus denuded (End
  −) endothelium (A,B). The effects were also evaluated in endothelium-intact preparations
  pre-incubated for 15 min with Nω-Nitro-L-arginine methyl ester (L-NAME) (100 µM;
  (C,D)), [1,2,4]oxadiazolo[4,2-alpha]quinoxalin-1-one (ODQ) (10 µM; (E,F)), or indomethacin
  (1 µM; (G,H)). Data are expressed as the mean ± S.E.M. (n = 6). + p < 0.05 compared
  to the respective control group (End + in panel (A); Vehicle in panels (B–D)). *
  p < 0.05 compared to the preceding dose
