figure_title: Oleuropein inhibits the TGF-β1/mTOR pathway in fibroblasts.
caption: 'Oleuropein inhibits the TGF-β1/mTOR pathway in fibroblasts. NIH-3T3 (A)
  and MLg (B) cells were exposed to oleuropein and/or TGF-β1 (5 ng/mL) for 12 h, after
  which samples were collected for Western blot analysis to assess the protein levels
  of mTOR, p-mTOR, ULK1, p-ULK1, p70 S6 kinase, p-p70 S6k, S6 ribosomal protein, and
  p-S6RP (original images can be found in Figure S1). The results are presented as
  Mean ± SD, n = 3, where # indicates differences between the control group and the
  TGF-β1 group, with # p < 0.05, ### p < 0.001, and #### p < 0.0001, and * indicates
  differences between the TGF-β1 group and the oleuropein treatment group, with *
  p < 0.05, *** p < 0.001, and **** p < 0.0001'
