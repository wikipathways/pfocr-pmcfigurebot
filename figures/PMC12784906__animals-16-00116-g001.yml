figure_title: Rumen bacterial community composition and predicted functional profiles.
caption: Rumen bacterial community composition and predicted functional profiles.
  (A) Venn diagram showing shared and unique bacterial ASVs among Sika deer, Reindeer,
  and Milu deer. (B) Comparison of alpha diversity indices of the rumen microbiota
  among the three species. (C) PCoA plots based on Bray–Curtis dissimilarity, unweighted
  UniFrac, and weighted UniFrac distances at the ASV level. The colored dashed ellipses
  indicate the 95% confidence intervals for each group. (D) Ternary plot displaying
  the average relative abundance of the top ten bacterial phyla. The three vertices
  represent the three species. Inner circles represent bacterial phyla, with size
  proportional to abundance. Proximity to a vertex indicates higher abundance of that
  phylum in the corresponding species. The colors of three triangle sides and inner
  circles represent different bacterial phyla as defined in the legend. (E) Comparison
  of the relative abundances of Bacteroidota and Firmicutes, and F/B ratio among the
  three species. (F) Average relative abundance of the top twenty bacterial genera
  among the three species. The colors of three triangle sides and inner circles represent
  different bacterial genera as defined in the legend. (G) Heatmap showing differentially
  abundant genera among the three species. The color scale represents normalized relative
  abundance, ranging from low (blue) to high (red). (H) Heatmap showing differentially
  enriched KEGG pathways (Level 3) among the three species. * p < 0.05, ** p < 0.01
