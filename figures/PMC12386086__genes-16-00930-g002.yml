figure_title: Functional pathway analysis of significant differential gene expression.
caption: |-
  Functional pathway analysis of significant differential gene expression. (A) The volcano plot shows differential gene expression between the case and control groups. Log2 fold change (x-axis), representing the magnitude of gene expression change. Positive values indicate upregulation, while negative values indicate downregulation in the case group. Y-axis: -Log10
  p-value, representing statistical significance. Each dot represents a gene. Bubble plots of functional pathway analysis in different ontology categories show enriched (B) biological process (BP), (C) molecular function (MF), and (D) cellular component (CC) in either activated or suppressed processes. X-axis: GeneRatio (the proportion of differentially expressed genes relative to the total genes in that pathway). Y-axis: Pathway names. Size (gene count): Represents the count of genes in the pathway (larger bubbles = more genes)
