figure_title: The central role of IRES-Mediated Translation (IMT) in orchestrating
  cancer cell responses to tumor microenvironment (TME) stress conditions.
caption: The central role of IRES-Mediated Translation (IMT) in orchestrating cancer
  cell responses to tumor microenvironment (TME) stress conditions. This figure illustrates
  how IMT allows cancer cells to adapt protein synthesis to stress conditions typical
  of the TME, such as hypoxia and nutrient deprivation. The surrounding boxes depict
  the major biological processes regulated by IMT that contribute to tumor proliferation
  and aggressiveness. Specifically, IMT controls the expression of key enzymes in
  one-carbon and polyamine metabolism, ensuring the continuous synthesis of nucleotides
  and the protection of DNA. It also regulates the expression of growth factors and
  oncogenes that promote cell cycle progression and survival. Furthermore, IMT modulates
  cellular stress response pathways, including the management of oxidative and nitrosative
  stress. Finally, IMT is a key factor in conferring therapy resistance, allowing
  tumor cells to maintain the expression of essential proteins even during treatment
