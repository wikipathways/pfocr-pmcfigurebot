figure_title: Statins modulate DAMP-induced MAPK signalling to attenuate inflammation.
caption: Statins modulate DAMP-induced MAPK signalling to attenuate inflammation.
  This figure illustrates how DAMPs (1), through binding TLRs (2), can also activate
  key MAPK families (ERK1/2, JNK, p38) (5) in immune cells, leading to upregulation
  of pro-inflammatory cytokines and chemokines. Statins exert anti-inflammatory effects
  primarily by inhibiting the mevalonate pathway, which reduces GTPase prenylation
  (3) and subsequently dampens MAPK activation (4), thereby attenuating all downstream
  signalling and inflammatory outcomes (6) as shown above
