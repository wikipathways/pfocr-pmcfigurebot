figure_title: Pro-inflammatory Stromal 4 cells were highly expressed in the distal
  colon of HSCR patients
caption: (A) Heatmap visualizing the enrichment of specific stromal cell subtype among
  the different groups studied, estimated by Ro/e. (B) Violin plots showing activity
  of signaling pathway inferred by UCell in different stromal cell subtypes. (C) Bar
  chart showing the percentage of Stromal 4 cells to total number of stromal cells
  in different groups. (D) Violin plots showing MMP1 expression in different stromal
  cell subtypes. (E) Representative immuno-staining micrographs of Pdgfrα (red) and
  MMP1 (green) in the colon from non-HSCR control and HSCR patients, with DAPI nuclei
  counterstaining and (F) quantification of MMP1 positive cells per crypt of control
  and HSCR patients. (G) Representative immuno-staining micrographs of Pdgfrα (red)
  and MMP1 (green) in the biopsy of obtained from the distal ganglionic colon and
  aganglionic rectum during pull-through surgery from HSCR patients following colostomy
  (DAPI nuclei counterstaining). (H) Representative photomicrographs of stromal cells
  derived from distal colon from non-HSCR control and HSCR patients at day 1 and day
  5 of culture. (I) Growth curve of stromal cells derived from distal colon of non-HSCR
  control and HSCR patients, measured by cell number quantified daily for 5 days.
  (J) Immunofluorescence micrograph of F4+ Stromal 2 cells and MMP1+ Stromal 4 cells
  in the stromal cell culture derived from distal colon of non-HSCR and HSCR patients,
  with DAPI nuclei counterstaining. (K) Mean fluorescence intensity (MFI) of MMP1
  in the stromal cell culture derived from distal colon of non-HSCR and HSCR patients.
  (L) Representative immunofluorescence micrographs of stromal cells 3 marker RSPO3
  (Green) and KCNN3 (Red) in the distal and rectum from HSCR patient and non-HSCR
  control patient, with DAPI nuclei counterstaining. Scale bars are shown in all the
  images. HSCR patients n=6 and control patients n=3. Experiments were repeated independently
  3 times, with similar results. Each dots represented average value of each individual.
  Data are presented as mean ± SD and compared using nonparametric unpaired Student’s
  t-tests or one-way ANOVA with post-hoc tests as appropriate. The primary p-value
  is indicated directly on the graph
article_title: Impairment of stromal-epithelial regenerative cross-talk in Hirschsprung
  disease primes for the progression to enterocolitis
