figure_title: TFP activated daf-16 and skn-1 by modulating multiple pathways.
caption: TFP activated daf-16 and skn-1 by modulating multiple pathways. N2 worms
  were treated with TFP from stages L1 to L4 before being exposed to DEHP (40 mg/L)
  for 12 h (n > 2000); the gene expression was detected, including (A) the gene expression
  of PI3K/AKT insulin signaling pathway, (B) the gene expression of mTOR and AMPK/MAPK
  pathways, and (C) the expressions of genes related to stress response system. All
  data underwent one-way ANOVA. “ns” denotes not significant; “**” denotes p < 0.01
  compared with DEHP group
