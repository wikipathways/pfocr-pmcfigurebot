figure_title: Overview of BDNF and TrkB signalling pathways.
caption: Overview of BDNF and TrkB signalling pathways. Upon binding of BDNF to TrkB,
  it will induce receptor homodimerization and activation which will then further
  trigger signalling pathways, such as PI3K/Akt, MAPK/ERK and PLC-γ pathways. These
  pathways are crucial for neuronal survival and developmental and synaptic plasticity.
