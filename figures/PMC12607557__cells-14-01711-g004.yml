figure_title: Region-specific alterations in serotonin (5-HT)-, indole-pyruvate-,
  and tyrosine (Tyr)–dopamine (DA)-derived metabolites in wild-type (WT) and kat2−/−
  mice.
caption: 'Region-specific alterations in serotonin (5-HT)-, indole-pyruvate-, and
  tyrosine (Tyr)–dopamine (DA)-derived metabolites in wild-type (WT) and kat2−/− mice.
  Box plots showing concentrations of metabolites across brain regions in wild-type
  (WT, light green) and kat2−/− (dark green) mice. (a,b) Serotonin pathway: 5-HTP
  (5-hydroxytryptophan), 5-HT (5-hydroxytryptamine, serotonin). (c–f) Indole-pyruvate
  pathway: IAA (indole-3-acetic acid), ICA (indole-3-carboxaldehyde), ILA (indole-3-lactic
  acid), INS (indoxyl sulfate). (g–j) Tyrosine-dopamine pathway: Tyr, DOPAC (3,4-dihydroxyphenylacetic
  acid), BIO (biopterin), BH2 (dihydrobiopterin). Brain regions: STR, striatum; CTX,
  cortex; HIPP, hippocampus; CER, cerebellum; STEM, brainstem. 5-HTP concentrations
  were reduced in the STR, CTX, and CER, whereas 5-HT levels were selectively increased
  in the CTX. IAA concentrations were diminished in the HIPP, ILA, and INS within
  the STEM, while ICA levels were elevated in the CTX. Tyr levels were reduced in
  the CTX, and decreases in DOPAC, BIO, and BH2 were detected in the CER. Data are
  shown as mean ± SD. Symbols: •, outlier; ▲, far out. Significance: *, p < 0.05;
  **, p < 0.01; ***, p < 0.001. Figures created with LabPlot 2.9.0 (KDE, Berlin, Germany)
  and BioRender.com. 5-HT, serotonin (5-hydroxytryptamine); 5-HTP, 5-hydroxytryptophan;
  BH2, dihydrobiopterin; BIO, biopterin; CER, cerebellum; CTX, cortex; DOPAC, 3,4-dihydroxyphenylacetic
  acid; HIPP, hippocampus; ICA, indole-3-carboxaldehyde; IAA, indole-3-acetic acid;
  ILA, indole-3-lactic acid; INS, indoxyl sulfate; kat2−/−, kynurenine aminotransferase
  II knockout mice; STEM, brainstem; STR, striatum; Tyr, tyrosine; WT, wild-type mice'
