figure_title: Partial UPR activation in Sel1L-deficient neurons
caption: '(A) Western blot analysis of IRE1α in cortical tissues of Sel1Lf/f and Sel1LSynCre
  mice at 5 weeks of age, with quantitation shown in B (n = 6 mice per group). Values
  shown are in kDa. (C) RT-PCR of Xbp1 mRNA splicing from cortical tissues of 5-week-old
  mice. u and s indicate the unspliced and spliced form of Xbp1. Quantitation of the
  spliced form of Xbp1 (Xbp1s) is shown in D (n = 6 mice per group). (E) Western blot
  analysis of the PERK sensor, including the eIF2α pathway in cortical tissues of
  mice at 5 weeks of age, with quantitation shown in F (n = 6 mice per group). (G)
  Representative TEM images from Sel1Lf/f and Sel1LSynCre mice at 5 weeks of age.
  Endoplasmic reticulum (ER) and mitochondria (M) are highlighted in red and green
  colors respectively. Quantitation of luminal ER width is shown in H (200-250 measurements
  from 12 cells, n = 3 mice per group). (I) UMAP plot showing cell types identified
  by unsupervised clustering of single-nucleus RNA-seq data from combined cortex and
  hippocampus tissue of Sel1Lf/f and Sel1LSynCre mice at 5 weeks of age. Each dot
  represents a single nucleus. (J) Relative abundance of cells across different clusters
  in Sel1Lf/f and Sel1LSynCre mice based on single-nucleus RNA sequencing. Cell types
  include neurons, oligodendrocytes (Oligo), microglia and perivascular cells (Micro-PVM),
  oligodendrocyte precursor cells (OPC), astrocytes (Astro), vascular and leptomeningeal
  cells (VLMC), inflammatory mononuclear cells (IMO), and endothelial cells (Endo).
  (K) Relative abundance of mRNAs based on single-nucleus RNA sequencing for genes
  associated with ER quality control pathways, including ERAD, chaperones, and the
  UPR, in cortical and hippocampal tissue from Sel1Lf/f and Sel1LSynCre mice at 5
  weeks of age. Clustering of excitatory and inhibitory neurons was performed using
  previously published cell-type specific gene markers. Data in (B, D, F, H) are presented
  as mean ± SEM and were analyzed using a Student’s t test. Data in (K) was analyzed
  using a two-way ANOVA with FDR correction. Data is shown as log2 fold change (FC).
  Significance levels are indicated as follows: *p < 0.05; **p < 0.01; ***p < 0.001'
