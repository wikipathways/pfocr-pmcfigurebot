figure_title: The differential toxicity effects induced by FLASH and conventional
  dose rate radiotherapy in healthy tissues and tumours
caption: The therapeutic index (or therapeutic window) of radiotherapy is described
  by the combination of tumour control probability (TCP) and the normal tissue complication
  probability (NTCP). The TCP curves often rise steeply with increasing doses and
  reach high values earlier than NTCP curves, meaning that tumour control can be achieved
  before normal tissue complications become dominant. Radiotherapy at conventional
  dose rate delivers radiation to the tumour over minutes, typically 1–4 Gy min−1.
  The surrounding healthy tissues limit the level of dose that can be delivered to
  the patient as radiation can induce direct and indirect killing of non-cancerous,
  resident cells through the production of reactive oxygen species (ROS) as well as
  damage to the DNA and other biomolecules. Acute and delayed cell death is followed
  by a complex series of events including stimulation and release of inflammatory
  factors and thrombotic factors, vascular activation and immune cell recruitment,
  as well as the activation and differentiation of fibroblasts into myofibroblasts
  that are able to remodel the extracellular matrix (ECM), inducing further activation.
  These molecular and cellular events disrupt tissue homeostasis and can cause a loss
  of organ function, impairing the patient’s quality of life and, in severe cases,
  their overall survival. FLASH radiotherapy compresses the time needed for radiation
  delivery to milliseconds or less, typically 100 Gy s−1, thereby increasing the dose
  threshold that could induce the toxicities associated with conventional dose rate
  radiotherapy. Although the DNA damage response seems to be similar after exposure
  of healthy tissue to FLASH or conventional dose rate radiotherapy, FLASH radiotherapy
  reduces the amount of oxidative stress and inflammation induced; preserves oxidative
  phosphorylation (OXPHOS), the vasculature and stem cell pool, and the expression
  of genes related to the tumour necrosis factor superfamily and cell death, as well
  as reduces inflammatory and fibrogenic responses. In tumours, both conventional
  and FLASH radiotherapy induce ROS production, damaging DNA and other biomolecules.
  FLASH and conventional dose rate radiotherapy are isoeffective in most experimental
  models investigated. They induce similar adaptive immune responses; however, FLASH
  radiotherapy reduces immunosuppressive signals and M2 polarization of macrophages
  due to the decreased ROS production and associated reduction of oxidized low-density
  lipoproteins (oxLDL), repressing the activation of the PPARγ pathway promoting M1
  polarization
