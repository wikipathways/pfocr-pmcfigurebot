figure_title: Rad18 promotes tolerance of 4NQO-nduced DNA damage in vitro and is elevated
  during 4NQO-induced oral carcinogenesis
caption: '(A) OKF-6 (normal oral keratinocytes) and DOK (dysplastic oral keratinocytes)
  cells were transfected with control non-targeting siRNA (siCon) or RAD18-directed
  siRNA, then treated with UV (20 J/m2) or 4NQO (0.01μM). 4 h after genotoxin treatment,
  cell lysates were prepared and analyzed by SDS-PAGE and immunoblotting. (B) DOK
  cells were treated with siCon or siRAD18, then tested for 4NQO-sensitivity using
  clonogenic survival assays. Error bars represent the standard deviation (SD) of
  the mean. Statistical analysis: two-way ANOVA followed by Sidak’s multiple comparison
  test, *P < .05, **P < .01, ***P < .001, ****P < .0001, ns = not significant. (C)
  Scheme showing in vivo 4NQO treatment regimens in the current study (50 ug/ml 4NQO)
  and study by Lee et al. (100 ug/ml 4NQO). In our study, Rad18+/+ mice were treated
  with 4NQO for 2 days or 14 days (or left untreated for controls). Then tongue epithelia
  from all three treatment groups were subjected to transcriptional profiling. Heatmap
  of TLS and DDR pathway genes in the 4NQO treatment groups when compared with control
  mice in our study and study by Lee et al. (D) Gene ontology (GO) analysis of upregulated
  genes at day 2 and 14 in 4NQO-treated oral epithelium showing top 20 GO terms'
article_title: Differential roles of Rad18 in repressing carcinogen- and oncogene-driven
  mutagenesis in vivo
