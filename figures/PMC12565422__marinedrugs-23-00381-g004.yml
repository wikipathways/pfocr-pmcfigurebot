figure_title: Effect of GNP on H2O2-induced NF-κB signaling pathway expression in
  ARPE-19 cells.
caption: Effect of GNP on H2O2-induced NF-κB signaling pathway expression in ARPE-19
  cells. (A) The protein expression level of NF-κB signaling pathway in cell lysates
  of ARPE-19 cells was measured by Western blot analysis. β-actin was used as an internal
  control. (B) Immunofluorescence strain for p65 protein in H2O2-induced ARPE-19 cells.
  DAPI staining for nucleus, Dylight 488 staining for p65 protein, merging image showed
  the change in p65 expression. (C) Analysis of nucleus/cytoplasmic ratios in p65
  immunofluorescence images. Data are shown as mean ± SD (n = 3–4). p < 0.05 (*),
  p < 0.001 (***), p < 0.0001 (****) compared with H2O2 alone treated control group
