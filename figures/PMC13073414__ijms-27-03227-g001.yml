figure_title: BC tumor characterization and differential gene expression (DGE) after
  post-RT.
caption: BC tumor characterization and differential gene expression (DGE) after post-RT.
  (A) A schematic represents the cohort study design, RT strategy, and RNA sample
  analysis by NanoString BC360 and IO360 panels. The detailed procedure is described
  in the Materials and Methods section. (B) Heat map representing tumor characterization
  (BC tumor subtypes, histological grade, RCB class, Ki67 cut-off, and TIL status
  of biopsy (pre-RT; n = 5) and surgical (post-RT n = 14) analyzed by BC360 panel.
  (C) Heat map representing tumor characterization and immune pathway analysis pre-RT
  (n = 5) and post-RT (n = 15) analyzed by IO360 panel. (D,E) Differential gene expression
  (DGE) analyses of the BC360 and IO360 panels were performed. Gene expression (fold
  change) was determined, with p-values adjusted within each analysis, using a difference
  t-test followed by the Benjamini and Yekutieli False Discovery Rate (FDR) adjustment
  to account for correlations amongst the tests, and statistical magnitude and significance
  were determined. Significantly adjusted (p < 0.05) cut-off expression key genes
  are presented (red circles) and labeled
