caption: |-
  Effect of oral BroccoMax®
  (BMAX) administration on protein expression of fatty acid synthesis pathway and Ki-67 in prostate cancer patients. (A) Representative immunohistochemical images for c-Myc, acetyl-CoA carboxylase 1 (ACC1), fatty acid synthase (FASN), and Ki-67 expression in normal tissue adjacent to tumor (NAT) of prostate cancer patients who received placebo (PBO) or BMAX treatment. (B) Quantitation of fluorescence intensities of proteins shown in panel A using ImageJ software. Results shown are mean ± 95% CI (n= 12 for PBO and n= 11 for BMAX groups). (C) Representative immunohistochemical images for c-Myc, ACC1, FASN, and Ki-67 expression in prostate tumor of patients who received PBO or BMAX treatment. (D) Quantitation of fluorescence intensities of proteins shown in panel C using ImageJ software. Results shown are mean ± 95% CI (n= 12 for PBO and n= 11 for BMAX groups). Statistical significance of difference was determined by two-sided t-test
