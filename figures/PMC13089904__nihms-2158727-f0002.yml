figure_title: Fatty acid epoxides, such as 14,15-epoxyeicosatrienoic acid (14,15-EET),
  are metabolized by multiple pathways.
caption: Fatty acid epoxides, such as 14,15-epoxyeicosatrienoic acid (14,15-EET),
  are metabolized by multiple pathways. EETs can undergo additional oxygenation by
  CYPs or cyclooxygenases (COXs), can be hydrolyzed to DHETs by soluble or microsomal
  epoxide hydrolase (sEH or mEH), or become esterified to the membrane phospholipids
  in an acyl-CoA dependent process. EETs can also undergo chain-shortening or elongation
  to epoxyhexadecadienoic acids (EHDs) or epoxydocosatrienoic acids (EDTs), respectively
