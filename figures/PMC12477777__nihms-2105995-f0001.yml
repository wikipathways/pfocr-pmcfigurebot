figure_title: α-Pinene metabolism pathway in human.
caption: 'α-Pinene metabolism pathway in human. Only detected metabolites (with aPM
  numbers, see Table 1) and their intermediate products are shown in the figure. The
  structures in black are metabolites previously reported in human urine or their
  predicted glucuronides. The structure in gray are metabolites detected via untargeted
  analysis. Structures of aPM7 and aPM8 were tentatively assigned, and others were
  assigned. While the structures of aPM2b and aPM2c have been confirmed through comparison
  with synthesized standards, further experimental evidence is needed to confirm other
  structures, especially those detected via untargeted analysis. Abbreviations: Glucuronic
  acid (GlcA); epoxide hydrolase (EH); oxidation (Ox); reduction (Red); UDP-glucuronosyl
  transferase (UGT); cytochromes P450 (CYP); The abbreviations for names of the metabolites
  can be found at Tables S3 and S4'
