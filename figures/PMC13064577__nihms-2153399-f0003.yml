figure_title: Metabolic features of HeLa cells expressing CrGPDH
caption: Glycerol levels (a) and the lactate/pyruvate ratio (b) measured in the medium
  which was incubated for 24 h with HeLa cells expressing CrGPDH. Cytosolic NADH/NAD+
  ratio (c) and NADPH levels (d) measured using genetically encoded biosensors SoNar
  and iNAP1 in HeLa cells expressing CrGPDH. To demonstrate responsiveness of the
  NADPH biosensor (iNAP1) time-lapse live cell imaging experiments were also performed
  in cells incubated with the imaging media in the absence of glucose but containing
  pyruvate as described under “Methods” section. (e) Volcano plot for targeted metabolomics
  of HeLa cells expressing CrGPDH when compared to LUC. The statistical significance
  (accumulated metabolites shown in red dots, decreased metabolites shown in dark
  blue dots) represents p value cutoff = 0.05, fold change cutoff = 0.5, gray dots
  represent statistically not significant changes. DHAP, dihydroxyacetone phosphate;
  Gro3P, glycerol-3-phosphate; F1,6BP, fructose-1,6-bisphosphate; R5P, ribose-5-phosphate.
  (f) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis for
  metabolites in (e) which were significantly changed. Heatmaps of the most impacted
  intracellular cofactors (g), glycolysis (h), TCA cycle (i), pentose phosphate pathway
  (PPP) (j), pyrimidines (k) and purines (l) metabolites in HeLa cells expressing
  CrGPDH and LUC. Experiments in (a-b, e-l) were performed with pyruvate-free DMEM
  supplemented with dialyzed FBS (DMEM+dFBS) containing 25 mM glucose, in (c-d) experiments
  were performed with the imaging medium (DMEM without pyruvate, fluorescent vitamins
  and phenol red with 5 mM glucose, 25 mM HEPES, pH 7.4 and 1% dialyzed FBS) or in
  the absence of glucose and presence of 10 mM pyruvate as described in the “Methods”
  section. Values are mean ± s.d.; n = 5, 6 in (a), n = 6, 6 in (b), n = 27, 27, 30,
  31 in (c), n = 29, 29, 27, 29 in (d) biologically independent samples. The statistical
  significance indicated for (a-b) represents a two-tailed unpaired t test; for (c-d)
  represents a One-Way ANOVA followed by uncorrected Fisher’s least significant difference
  test. In heatmaps (g-l), each column represents a biologically independent sample
