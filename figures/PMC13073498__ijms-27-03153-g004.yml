caption: 'GO annotations and Reactome pathway enrichment analyses of PDZbm proteins
  in Mtb. (A) Bar plot showing the top 15 most enriched GO terms associated with PDZbm
  proteins via DAVID. Red bars represent statistically significant enrichment (p ≤
  0.05). BP: Biological Process, MF: Molecular Function, CC: Cellular Component. The
  X-axis was plotted on a logarithmic scale. (B) Reactome pathway enrichment analysis.
  The number of genes enriched in each pathway is indicated by node size; a higher
  –log (FDR) value means a lower false discovery rate (FDR), where red is highly significant
  and blue is nonsignificant. Pathways related to human–Mtb interactions are labelled
  with an asterisk (*)'
