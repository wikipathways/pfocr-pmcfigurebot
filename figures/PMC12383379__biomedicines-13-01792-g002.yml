caption: 'Mechanisms linking aldosterone and MR activation to MASLD: This schematic
  illustrates the cascade by which aldosterone, through MR binding, activates SGK1
  and TGFβ signaling pathways. This leads to downstream activation of NFκB and NLRP3
  inflammasome, promoting inflammation and fibrosis. The pathway also includes Th17
  differentiation and IL1-β production, both contributing to hepatic fibrogenesis.
  Abbreviations: Aldo: aldosterone, IL1-β: interleukin 1 β, HSC: hepatic stellate
  cell, MR: mineralocorticoid receptor, NFκB: nuclear factor kappa B, NLRP: NOD-like
  receptor family pyrin domain containing 3, Sgk1: serum- and glucocorticoid-inducible
  kinase 1, Tgfβ: transforming growth factor β, Th17: lymphocyte Th 17'
