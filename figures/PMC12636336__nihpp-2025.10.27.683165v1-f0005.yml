figure_title: Genetic architecture of growth on galactose
caption: GAL pathway genes labelled when falling in QTL peak 2-LOD confidence intervals,
  1% significance thresholds in red. (A) QTL mapping in strains with the introgressed
  GAL1/7/10 locus. (B) QTL mapping in subpopulations lacking the introgressed GAL1/7/10
  locus, split based on GAL3+ vs GAL3-. GAL3-LOD scores plotted on negative scale.
  The FLO11, WHI2 and MSS11 QTL are not specific to the GAL condition. (C) Variance
  (+/− standard error) explained by individual GAL loci in each subpopulation (in
  the absence of the GAL1/7/10 introgression) using random sampling cross validation.
  (D) Performance of global and subpopulation-specific additive models on each subpopulation,
  assessed by random sub-sampling validation (mean residual estimate +/− SE values
  shown)
