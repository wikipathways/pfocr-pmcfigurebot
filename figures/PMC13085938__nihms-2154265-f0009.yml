figure_title: Sodium-glucose linked transporter 2 (SGLT2) inhibition restores age-related
  loss of cell-cell communication in the aging killifish kidney
caption: Cell-cell signaling networks inferred using CellChat from single-nucleus
  RNA-sequencing data. (a) Circle plot depicts the global intercellular signaling
  network in kidneys from old fish treated with SGLT2 inhibitor (SGLT2i). Each node
  represents a cell type, and lines represent significant ligand-receptor interactions.
  The total number of interactions increased to 57 with treatment, compared with 30
  in untreated old controls. (b) Bar plot shows relative information flow of key signaling
  pathways in old control (gray) versus SGLT2i-treated (red) kidneys, indicating selective
  reactivation of endothelial and perivascular signaling axes. (c) Comparison across
  all 3 groups (young, old control, and old + SGLT2i) highlights partial recovery
  of specific pathways (e.g., platelet–endothelial cell adhesion molecule 1 [PECAM1],
  junctional adhesion molecule [JAM], and vascular endothelial growth factor [VEGF])
  toward a youthful signaling profile. Overall, SGLT2i-treated signaling pathways
  mimic young signaling pathways more than old untreated. (d) Heat maps illustrate
  outgoing (left) and incoming (right) signaling patterns in kidney cell types from
  old SGLT2i-treated kidneys. Several signaling axes are reestablished, particularly
  from endothelial and perivascular cells. (e) Sankey plot visualizes major signaling
  pathways restored in SGLT2i-treated kidneys, with enhanced directional signaling
  among glomerular and tubular compartments. (f,g) Joint manifold learning was used
  to classify signaling pathways based on (f) functional and (g) structural similarity
  across groups. Each dot represents a signaling pathway, clustered by similarity
  in sender-receiver relationships. SGLT2i-treated kidneys (triangles) show a partial
  shift toward the youthful communication profile (circles), distinct from untreated
  aged controls (squares). ADGRL, adhesion G protein–coupled receptor L (latrophilin);
  AGRN, agrin; ANGPTL, angiopoietin-like proteins; ApoA, apolipoprotein A; CADM, cell
  adhesion molecule; CDH, cadherin; CNTN, contactin; DHEAS, dehydroepiandrosterone
  sulfate; EPHB, ephrin-B receptor; ESAM, endothelial cell-selective adhesion molecule;
  NCAM, neural cell adhesion molecule; ncWNT, noncanonical Wingless-related Int-1;
  NRXN, neurexin; PAR, protease-activated receptor; PDGF, platelet-derived growth
  factor; PVR, poliovirus receptor; SEMA, semaphorin
