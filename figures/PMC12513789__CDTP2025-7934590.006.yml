  were detected in different groups of coronary vascular tissues. (g) Western blot
  detection of the PI3K/AKT pathway and SLC7A11/GPX4 axis in coronary vascular tissues
  of different groups with grayscale analysis (n = 3). (h) Transmission electron microscope
  was used to show mitochondrial morphology. ⁣∗p < 0.05, ⁣∗∗p < 0.01, and ⁣∗∗∗p <
  0.001
