figure_title: Comparative transcriptomic profiles between different intestinal segments
  of growing pigs under different feeding patterns (n = 4).
caption: Comparative transcriptomic profiles between different intestinal segments
  of growing pigs under different feeding patterns (n = 4). (A) Venn diagram revealing
  the numbers of DEGs identified in different intestinal segments. (B) Column chart
  depicting the number of DEGs up-regulated and down-regulated in different intestinal
  segments. (C) KEGG pathway enrichment analysis exhibiting DEG-enriched pathways
  specific to different intestinal segments. The central node with pie chart represents
  co-enriched pathways of DEGs in both jejunum and colon, whereas node size represents
  the number of DEGs enriched in the pathway. Radiated nodes around them exhibit enriched
  pathways. DEGs in red were from the jejunum whereas blue-colored DEGs were from
  the colon. The pie chart represents the ratio of jejunal to colonic DEGs contributing
  to that pathway
