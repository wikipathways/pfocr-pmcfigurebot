figure_title: STAT3 inhibition is synthetic lethal with PTEN deficiency in vivo.
caption: STAT3 inhibition is synthetic lethal with PTEN deficiency in vivo. (A-F)
  Tumor growth curves in nude mice bearing HCT116 PTEN+/+(A) or PTEN -/- tumor (B)
  and RKO PTEN+/+(D) or PTEN -/- tumor (E) with vehicle or 5 and 10 mg/kg Stattic
  treatment. Wet tumor weights of HCT116 PTEN+/+ or PTEN -/- tumors (C) and RKO PTEN+/+
  or PTEN -/- (F) at endpoint. Error bars represent s.d. *P < 0.05, **P < 0.01 between
  vehicle and Stattic treatment groups (n = 4), two-way ANOVA. (G) Viability of patient-derived
  colorectal tumor organoids (PDOs) with 48 h Stattic treatment. (H) Immunoblot showing
  PTEN, STAT3, p-STAT3, PLK1, p-PLK1 and STMN1 protein levels in PDOs. I. Schematic
  illustration of the mechanism of synthetic lethality between PTEN and STAT3. STAT3
  signal is activated in PTEN-deficient cells by activated PI3K/AKT/mTOR pathway.
  Activated STAT3 stimulates PLK1 signal via inhibiting STMN1, leading to abnormal
  mitosis and CIN. Inhibition of STAT3 in these cells promotes mitotic cell death
  via activating SAC
