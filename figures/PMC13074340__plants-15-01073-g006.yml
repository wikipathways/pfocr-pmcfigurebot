figure_title: Strategic roadmap for developing climate-resilient and stripe rust-resistant
  wheat through integrated omics and advanced breeding approaches.
caption: Strategic roadmap for developing climate-resilient and stripe rust-resistant
  wheat through integrated omics and advanced breeding approaches. This framework
  illustrates the translational pathway from the identification of novel resistance
  alleles in wild progenitors (such as Aegilops tauschii) using genome-wide association
  studies (GWAS) and QTL mapping, to their precise introgression into elite cultivars
  through advanced molecular tools, including CRISPR/Cas9 and speed breeding. The
  pipeline further incorporates multi-location phenotypic screening and genomic validation
  (e.g., KASP markers) to ensure the development and deployment of wheat varieties
  capable of withstanding complex biotic and abiotic stresses
