figure_title: Model structure within each age group and risk stratification
caption: 'The risk of hospitalization for individuals with symptomatic influenza infection
  depends on whether individuals seek care, the timing of care-seeking, the occurrence
  and result of testing, the prescribing of antiviral treatment, and the filling and
  completion of any treatment course. The number of individuals progressing through
  each pathway may change by age and/or risk stratification (see Figure S7 for a Sankey
  diagram showing example flows for high-risk adults ≥65 years13). In addition, the
  number progressing through each testing and prescribing pathway will vary by the
  timing of care-seeking (i.e., early vs. late). Similarly, antiviral effectiveness
  varies by the timing of care-seeking and will lead to different numbers progressing
  through the fully compliant to hospitalized pathway. Finally, the colors indicate
  compartments that are influenced by parameters relating to individual behavior and/or
  access to medical care and treatment (care-seeking, timing of care-seeking, and
  antiviral compliance) or parameters relating to clinical testing and prescribing
  practices. We investigate the impact of changing these parameters as part of our
  analyses. Abbreviations: CAR = clinical attack rate; CHR = case-hospitalization
  ratio'
article_title: Modeling the potential impacts of outpatient antiviral treatment in
  reducing influenza-associated hospitalizations in the United States
