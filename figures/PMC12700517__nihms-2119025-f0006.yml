figure_title: Gln metabolism remodels macrophage functions and atherosclerotic lesions.
caption: 'Gln metabolism remodels macrophage functions and atherosclerotic lesions.
  Top left: healthy macrophages utilize intrinsic Gln fluxes in vitro as a metabolic
  rheostat to regulate restorative functions, such as matrisome reorganization and
  efferocytosis. This involves enhanced SLC7A7-dependent Gln influx, GLS1-dependent
  glutaminolysis (but not GLS2) and reduced GSdependent Gln synthesis. Top right:
  elevated systemic Gln levels in mice lacking hepatic GLS2 raise the pathogenic threshold
  of plasma GGR, promoting distal macrophage Gln influx. However, in the context of
  atherosclerosis—where GS is upregulated and GLS1 downregulated—the hexosamine (HBP)
  pathway impacts macrophage-driven extracellular matrix (ECM) remodelling. Bottom
  left: blocking SLC7A7-dependent Gln influx to limit GLS1-dependent glutaminolyis
  raises the pathogenic threshold of aortic GGR, impairs ATP production and promotes
  a dysferocytic phenotype, ultimately contributing to necrotic core formation. Bottom
  right: combining elevated systemic Gln levels in mice lacking hepatic GLS2 with
  impaired macrophage intrinsic glutaminolysis exacerbates the hexosamine pathway,
  while limiting ATP production, which ultimately impact the metabolic fingerprint
  of atherosclerosis. Parts of the figure were created using images from Servier Medical
  Art (https://smart.servier.com/)'
article_title: Slc7a7 licenses macrophage glutaminolysis for restorative functions
