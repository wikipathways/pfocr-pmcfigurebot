figure_title: The mechanism of LPS-induced pneumonitis.
caption: The mechanism of LPS-induced pneumonitis. In myeloid cells, membrane-bound
  CD14 (mCD14) is expressed, whereas in non-myeloid cells, CD14 exists as the soluble
  plasma form (sCD14). LPS forms a complex with lipopolysaccharide-binding protein
  (LBP) and interacts with CD14, which facilitates the delivery of LPS to TLR4. The
  LPS-TLR4-MD2 complex activates MyD88-dependent signaling, driving the production
  of pro-inflammatory cytokines via the NF-κB pathway. Simultaneously, it engages
  the TRIF-dependent pathway to internalize the complex, thereby inducing IFN-β generation.
  During LPS-induced lung injury, TLR5 may also participate. TLR5 is expressed in
  certain non-myeloid cells (e.g., epithelial and endothelial cells) and myeloid cells
  (e.g., alveolar macrophages and neutrophils). The presence of TLR5 promotes a bias
  toward the MyD88-dependent pathway in TLR4 signaling
