figure_title: ARIH2 and CCNC KO synergize to augment NK cell proliferation, activation,
  interleukin signaling and interferon gamma response
caption: (A) In vitro tumor re-challenge assay of CRISPR-edited NK cells deficient
  for ARIH2, CCNC, ARIH2/CCNC, CISH, or MED12, co-cultured with PATC148 human pancreatic
  cancer cells as assessed by xCELLigence real-time cell analysis. Data represented
  as mean±SEM (shaded in light grey); NK cell killing normalized to timepoint 0 and
  tumor. (E:T=6:1; n=2 human NK cell donors; one-way ANOVA for area under the PATC148
  growth curve; **p< 0.01, ***p<0.001, ****p < 0.0001) (See also Figures S10A and
  S10B).(B and C) Conceptual depicting the orthotopic pancreatic cancer mouse model
  to assess the in vivo antitumor efficacy of CRISPR-engineered TROP2CAR/IL-15-NK
  cells.(D) PATC148 tumor growth (mean bioluminescent radiance) in orthotopic pancreatic
  cancer-bearing mice infused with ARIH2 KO, CCNC KO, ARIH2/CCNC DKO, CISH KO or MED12
  KO TROP2CAR/IL-15-NK cells (n=4 per condition; one-way ANOVA for day 35 mean radiance
  (ns, not significant, *p<0.05, **p<0.01). (See also Figures S10C and S10D)(D, E
  and F) Deep phenotypic profiling of gene-edited TROP2CAR/IL-15-NK cells by mass
  cytometry.(D) Opt-SNE projection of CRISPR-edited NK cells at baseline and after
  one and two PATC148 tumor challenges, overlayed with FlowSOM metaclusters.(E) Bar
  charts depicting dynamic regulation of NK cells clusters in CRISPR-edited TROP2CAR/IL-15-NK
  cells at baseline (left) and after one (middle) and two (right) challenges with
  PATC148 pancreatic cancer cells.(F) Heatmap depicting z-transformed median expression
  per channel and percentage surface marker expression of CRISPR-perturbed NK cells
  across FlowSOM metaclusters.(G) UpSet plot showing the number of independent experiments,
  demonstrating cooperative protein induction for NK cell activating markers in ARIH2/CCNC
  DKO CAR-NK cells compared to expected additive effects from ARIH2 or CCNC single
  KOs (pseudo-Loewe sum analysis; n=7 CB donors).(H) Bar charts depicting median expression
  of CD25, NKG2D, Ki67 and CD69 by infused CRISPR-KO TROP2CAR/IL-15-NK cells harvested
  from the i.p. fluid of tumor-bearing (PATC148) mice, as assessed by mass cytometry
  (n=4 per condition; grey, WT control; blue, ARIH2 KO; purple, CCNC KO; pink, ARIH2/CCNC
  DKO).(I, J, and K) scRNA-seq studies of CRISPR-edited NK cells deficient for ARIH2,
  CCNC, ARIH2/CCNC, CISH, or MED12, co-cultured with PATC148 cells.(I) UMAP projection
  of gene-edited NK cells, overlayed with Seurat clusters.(J) Bar charts depicting
  Seurat NK cell cluster composition in CRISPR-edited TROP2CAR/IL-15-NK cells after
  tumor challenge.(K) Heatmap depicting significantly enriched pathways in CRISPR-edited
  CAR-NK cells compared to non-edited controls. Top annotation bars indicate experimental
  conditions and corresponding Seurat-defined NK cell clusters.Also see Figure S10
