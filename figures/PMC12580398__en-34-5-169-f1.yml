figure_title: Neuron–astrocyte interplay through Rheb–mTORC1 activation promotes neuroprotection.
caption: 'Neuron–astrocyte interplay through Rheb–mTORC1 activation promotes neuroprotection.
  Upregulation of neurotrophic factors (NTFs) has strong potential in neuroprotection
  through activation of the Rheb–mTOR signaling pathway. Sustained activation of Rheb–mTOR
  signaling via AAV-Rheb (S16H) delivery in adult neurons enhances the production
  of BDNF, GDNF, and CNTF. These NTFs exert autocrine neuroprotective effects, while
  BDNF and GDNF released from neurons further act on neighboring astrocytes. In astrocytes,
  mTORC1 activation drives additional production of CNTF and GDNF, reinforcing neuronal
  survival. This reciprocal exchange of NTFs between neurons and astrocytes establishes
  a supportive microenvironment that promotes the rescue and long-term maintenance
  of neurons. Such bidirectional communication underscores the importance of intercellular
  signaling through Rheb–mTORC1 as a fundamental mechanism of tissue-level neuroprotection.
  In addition, other NTFs such as VEGF, IGF-1, and NGF have been reported to be upregulated
  through mTOR signaling, though their direct involvement in neurons remains to be
  confirmed (Created and modified using BioRender.com license no: HJ28OP6O6D)'
