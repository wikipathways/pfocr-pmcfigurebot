figure_title: Bacterial transcriptional analysis of ESX-5 paralog knockouts reveals
  metal response axis
caption: 5A. Volcano gene expression plots of mutants relative to wildtype. Plots
  show respective expression profiles across mutant transcriptomes relative to wildtype.
  For all plots, significance level is on y-axis (Log10 FDR Corrected (“Adjusted”)
  p-value) and change in expression on x-axis (Log2 Fold Change). Red dots denote
  significant genes (FDR ≤0.01, Log2FC ≥1/≤−1), grey dots are non-significant. 5B.
  String network of overlapped down-regulated genes shared across all knockout strains.
  Each node represents a gene while the connecting lines represent combined string
  score of respective nodes (minimum string score >0.700, medium high connectivity,
  string-db.org). 5C. Hypergeometric mean pathway enrichment analysis of overlapping
  genes. Enrichment plot shows top 7 most significant gene sets (y-axis) based on
  Gene Ontology (GO) biological process. X-axis shows the strength of the observation
  (Log10(observed genes/expected genes)). Size of node proportional to the number
  of genes in our data belonging to a respective gene set. Color of node correlates
  to the FDR of the enrichment (significance calculated using Fishers Exact test with
  Benjamini-Hochberg FDR correction)
