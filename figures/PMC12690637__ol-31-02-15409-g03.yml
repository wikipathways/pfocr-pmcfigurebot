figure_title: Heatmaps of Z-score-normalized TPM values and bar plots of log2 fold-changes
  for differentially expressed genes associated with the interferon-responsive signaling
  pathway.
caption: Heatmaps of Z-score-normalized TPM values and bar plots of log2 fold-changes
  for differentially expressed genes associated with the interferon-responsive signaling
  pathway. (A) Analysis of interferon-stimulated genes using the C2 gene set and (B)
  the hallmark gene set. The color gradient indicates the Z-score of TPM. Bars are
  colored black for adjusted P-values ≥0.05 and log2 fold-changes between −1.5 and
  1.5. For bar plots with adjusted P-values <0.05, log2 fold-changes <-1.5 are marked
  in green, while those >1.5 are marked in red, indicating significant fold-changes.
  TPM, transcripts per million; FaDuex, advanced FaDu
