figure_title: Poly (I:C) molecular mechanism of microglia-activated neuronal apoptosis
  via NLRP3 inflammasome
caption: Poly (I:C) binds to the TLR-3 on the microglia surface. This binding activates
  the intracellular NLRP3 inflammasome, which has a vital role in the cleavage and
  maturation of proinflammatory cytokines, specifically IL-1β and IL-18. These inflammatory
  cytokines act as signaling molecules, propagating the inflammatory response and
  directly impacting neighbouring neurons. In neuronal cells, inflammatory signals
  trigger the intrinsic apoptotic pathway, which involves the sequential activation
  of executioner caspases (e.g., Cas-9 and Cas-3). The activation of these caspases
  leads to neuronal degeneration via apoptosis. Another key molecular mechanism of
  this apoptosis is the cleavage of PARP (poly-ADP ribose polymerase) into c-PARP.
  which is shown within the degenerating neurons as a definitive marker for apoptosis.
  Figure created using Biorender.com
