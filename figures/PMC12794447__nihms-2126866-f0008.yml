figure_title: Proteomics and Ingenuity Pathway Analysis - Synaptoneurosomes.
caption: Proteomics and Ingenuity Pathway Analysis - Synaptoneurosomes. (A) Hierarchical
  clustering of proteins confirms that the experimental groups are distinct based
  on their differential expression. Note that adjacent to the dendrogram, miR-17-5p
  targets are denoted by green and purple rectangles, corresponding to predicted-
  and experimentally- validated targets, respectively. Non-targets are indicated in
  a gray rectangle. (B) A volcano plot represents the results of the differential
  expression analysis. Upregulated proteins are shown in red and downregulated proteins
  are shown in blue (|FC| > 1.2 and P<0.05). (C) Bubble plot representing the results
  of the Ingenuity Pathway Analysis. The 20 paths with the best statistical significance
  were included. The size of each bubble indicates the number of proteins that exhibited
  differential expression (Hits), and the color represents the ratio between the hits
  within the pathway and the total number of molecules of the pathway (Ratio). The
  clustergram on the right shows the specific proteins and their involvement in each
  pathway. Each row of the clustergram is aligned with its corresponding pathway in
  the bubble plot. Upregulated proteins are represented in red, downregulated proteins
  are represented in blue. Note that adjacent to the dendrogram, miR-17a targets are
  denoted by green and purple rectangles, corresponding to predicted and experimentally
  validated targets, respectively. Non-targets are indicated in a gray rectangle.
  (n = 3 – 4)
