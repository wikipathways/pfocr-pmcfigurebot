figure_title: Schematic of an RBC-linked pathway for adenoviral vector-associated
  venous thrombogenesis.
caption: Schematic of an RBC-linked pathway for adenoviral vector-associated venous
  thrombogenesis. Following intravenous administration of Ad5 vector-rAd/HA(PR8),
  red blood cells remodel from discocytes to echinocytes to spherocytes. During this
  remodeling, green outlines denote increased surface phosphatidylserine (PS) exposure
  and red dots represent PS-rich microvesicles (MVs), together contributing to morphology-dependent
  procoagulant activity that supports factor Xa/Va-dependent thrombin generation and
  culminates in venous thrombosis in the rat IVC model. The diagram is not to scale
  and serves as a conceptual overview integrating the ex vivo and in vivo findings
