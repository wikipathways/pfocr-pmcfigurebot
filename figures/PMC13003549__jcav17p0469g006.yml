figure_title: Cell-cell communication between SPP1⁺ cells and CD8⁺ T cells in the
  DLBCL tumor microenvironment.
caption: 'Cell-cell communication between SPP1⁺ cells and CD8⁺ T cells in the DLBCL
  tumor microenvironment. (A) Heatmap showing the inferred cell-cell communication
  events between different subclusters. Columns represent signal-sending cells, and
  rows represent signal-receiving cells. The color represented the strength of interaction.
  (B) Scatter plot depicting cell-cell communication network centrality. The X-axis
  represents the contribution of each cell type in transmitting signals, while the
  Y-axis indicates its role in receiving signals. (C) Circular chord diagram illustrating
  interaction strength between SPP1⁺ Macro cells and T cells. Each ribbon represents
  a communication event, with SPP1⁺ Macro cells as signal sources and T cells as recipients.
  (D) Left: Heatmap of NMF-based clustering of cells according to outgoing signaling
  patterns. Color intensity reflects the relative contribution of each cell type to
  the corresponding signaling module. Right: Heatmap showing the composition of signaling
  pathways within each NMF-defined module. Color intensity denotes the strength of
  intercellular communication for each pathway. (E) Heatmap as in (D) but based on
  incoming signaling patterns'
