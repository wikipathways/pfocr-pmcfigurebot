caption: This study leveraged plasma proteomics from 4,538 individuals in the ‘European
  Prospective Investigation into Cancer and Nutrition for Parkinson’s disease’ case-cohort
  (EPIC4PD) to discover preclinical protein biomarkers of Parkinson’s disease (PD).
  Using the SomaScan 7K platform, 7,285 aptamers were analyzed across multiple time
  windows. Identified biomarkers were externally validated in three large cohorts
  (‘Age, Gene/Environment Susceptibility–Reykjavik Study’ [AGES], ‘Atherosclerosis
  Risk in Communities’ study [ARIC], and ‘United Kingdom Biobank’ [UKB]) and assessed
  in clinical PD cases from the ‘Global Neurodegenerative Proteomics Cohort’ [GNPC]
  and the longitudinal ‘Tracking Parkinson’s disease’ cohort. Functional characterization
  included pathway and cell-type enrichment, protein-protein networks, cross-trait
  analyses with Alzheimer’s disease (AD) and amyotrophic lateral sclerosis (ALS).
  Predictive protein risk scores were calculated in EPIC4PD and externally validated
  in AGES
article_title: Large-scale plasma proteomics uncovers preclinical molecular signatures
  of Parkinson’s disease and overlap with other neurodegenerative disorders
