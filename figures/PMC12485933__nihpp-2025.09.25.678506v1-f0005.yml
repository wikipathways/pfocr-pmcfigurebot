figure_title: Early regeneration stages exhibit shared stress responses and distinct
  metabolic activity
caption: (A) Illustration of the experimental timeline showing the main processes
  occurring at the early time points (4 and 8 hpa) in each body part following an
  injury. (B) Expression profiling of stress and metabolism related genes differentially
  expressed between the non-regenerative upper body part to the regenerative bottom
  body part. Rows represent genes, columns show gene expression in each time point.
  The color scale indicates log fold change. A black frame highlights the early time
  point, where differences between the two body parts are most pronounced. (C) Gene
  Ontology (GO) annotation analysis of both body parts at different time points following
  injury compared to the immediate post-amputation time point (0 hpa). (D) GO annotation
  analysis showing metabolic related process upregulating at the regenerative body
  part (bottom) compared to the non-regenerative body part (upper) at 4 hpa. (E) Matrix
  plot of log fold change values for TORC1 pathway–related metabolic genes, showing
  significant differences in expression between the two body parts following injury
