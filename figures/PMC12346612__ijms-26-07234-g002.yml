caption: 'Schematic representation of the brassinosteroid (BR) biosynthesis pathway
  (modified from [19,34,35]). BR biosynthesis begins with squalene (violet background),
  and many BR intermediates are subsequently synthesized (black letters) to produce
  biologically active BRs. BR biosynthesis is catalyzed by numerous enzymes (red letters).
  The process consists of two pathways: the CN-independent pathway (yellow background)
  and the CN-dependent pathway, which includes early (green background) and late C6-oxidation
  (blue background). The CYP734A1 inactivates BL into 26-OH-BL (gray background) via
  C26 hydroxylation to maintain optimal hormone levels'
