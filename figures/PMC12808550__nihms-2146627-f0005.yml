caption: 'The involvement of the aryl hydrocarbon receptor (AHR) in steroidogenesis
  in the ovary. The schematic shows the pathway for steroidogenesis in the theca cells
  (depicted in blue) and the granulosa cells (depicted in pink). The dashed arrow
  indicates transportation into the cell. The boxes show the metabolites, and the
  enzymes catalyzing the reactions are shown next to the arrows. The white boxes indicate
  metabolites affected by the AHR, whereas the white text indicates the enzymes affected
  by the AHR. Abbreviations: StAR- steroidogenic acute regulatory protein, CYP- cytochrome
  P450, HSD- hydroxysteroid dehydrogenase, DHEA- dehydroepiandrosterone. Further details
  on the highlighted results can be found in Table 2. Figure was created with BioRender.com'
