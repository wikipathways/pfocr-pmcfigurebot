figure_title: Proposed mechanism by which trans-resveratrol and hesperidin supplementation
  (tRES-HESP) combined with aerobic exercise ameliorates methylglyoxal (MGO)-induced
  skeletal muscle atrophy.
caption: Proposed mechanism by which trans-resveratrol and hesperidin supplementation
  (tRES-HESP) combined with aerobic exercise ameliorates methylglyoxal (MGO)-induced
  skeletal muscle atrophy. MGO contributes to muscle atrophy through AGEs–RAGE signaling,
  oxidative stress, NF-κB–mediated inflammation (e.g., increased IL-6 and decreased
  IL-10), and fibrotic signaling (e.g., activation of the TGF-β/Smad2/3 pathway, which
  promotes collagen deposition and fibrosis), while suppressing mitochondrial biogenesis
  (AMPK/SIRT1/PGC-1α) and anabolic signaling (AKT/mTOR). Combined polyphenol treatment
  (tRES-HESP) and regular aerobic exercise are proposed to counteract these pathological
  pathways, preserving muscle homeostasis by reducing inflammation and fibrosis and
  enhancing protein synthesis. Red and blue arrows indicate the effects of MGO and
  the protective actions of the treatment, respectively. AGEs, advanced glycation
  end products; RAGE, receptor for advanced glycation end products; NF-κB, nuclear
  factor kappa B; IL-6, interleukin-6; IL-10, interleukin-10; TGF-β, transforming
  growth factor-β; Smad2/3, SMAD family member 2/3; AMPK, AMP-activated protein kinase;
  SIRT1, sirtuin 1; PGC-1α, peroxisome proliferator–activated receptor gamma coactivator
  1-α; AKT, protein kinase B; mTOR, mechanistic target of rapamycin; tRES-HESP, trans-resveratrol
  and hesperidin supplementation; MGO, methylglyoxal
