figure_title: The mechanisms of resveratrol promote energy metabolism and mitochondrial
  homeostasis.
caption: The mechanisms of resveratrol promote energy metabolism and mitochondrial
  homeostasis. (1) RSV enhances glucose uptake and glycogen synthesis by activating
  the PI3K/AKT pathway, thereby enhancing insulin sensitivity. (2) RSV reduces fatty
  acid synthesis and insulin resistance through AMPK/mTORC and ACC. (3) RSV promotes
  mitochondrial biogenesis through the SIRT1/AMPK/PGC-1α pathway. (4) RSV enhances
  mitophagy through the PINK1/Parkin pathway and facilitates autophagosome formation
  by activating ULK1. (5) RSV upregulates the expression of LAMP1 and p62 through
  the MAPK/TFEB and AMPK/mTORC1/TFEB pathways. (6) RSV promotes the formation of autolysosomes
  through the SIRT1/FOXO1/Rab7 pathway. PI3K, Phosphatidylinositol 3-Kinase; AKT,
  protein kinase B; AS160, TBC1 domain family member 4; GLUT4, glucose transporter
  type 4; IRS-1, insulin receptor substrate 1; TSC1/2, tuberous sclerosis complex
  1/2; Rheb, ras homolog enriched in brain; mTORC1, mechanistic target of rapamycin
  complex 1; p70S6K, p70 ribosomal protein S6 kinase; GSK-3β, glycogen synthase kinase-3β;
  GS, glycogen synthase; RSV, resveratrol; SIRT1, sirtuin 1; AMPK, AMP-activated protein
  kinase; PGC-1α, peroxisome proliferator-activated receptor gamma coactivator 1-α;
  MAPK, mitogen-activated protein kinase; TFEB, transcription factor EB; FOXO1, forkhead
  box protein O1; Rab7, ras-associated binding protein 7; LAMP1, lysosomal-associated
  membrane protein 1; p62, sequestosome 1; NRF1/2, nuclear respiratory factor 1/2;
  ERRα, estrogen-related receptorα; ACC, acetyl-CoA carboxylase; ULK1, unc-51 like
  autophagy activating kinase 1; TBK1, TANK-binding kinase 1; FIP200, focal adhesion
  kinase family interacting protein of 200 kDa; NDP52, nuclear dot protein 52 kDa;
  OPTN, optineurin; ATG9A, autophagy related 9A; ΔΨm, mitochondrial membrane potential;
  LC3, microtubule-associated protein 1A/1B-light chain 3
