caption: (A) Comparison of KEGG enrichment bubble plots in group A vs. B (top 30);
  (B) KEGG enrichment bubble chart of comparison group B vs. D (Top 30); (C) comparison
  of KEGG enrichment bubble charts for group A, B, and D (top 30); (D) functional
  interaction network diagram of pathways; (E) KEGG mapping of bile secretion pathway;
  (F) KEGG mapping of the PI3K Akt signaling pathway. M, metabolism; G, genetic information
  processing; E, environmental information processing; C, cellular processes; O, organismal
  systems; H, human diseases; D, drug development. The horizontal coordinate represents
  the negative logarithmic transformation of the p-value and the vertical coordinate
  represents the pathway name. Attributing pathways to the level 1 category, the pathways
  in each category decreased from top to bottom −log10 (p-value), i.e., the p-value
  increased and the significance decreased sequentially. The size of the circle indicates
  count, i.e., the number of differential metabolites annotated to the pathway; the
  color of the circle corresponds to the corrected p-value, which is more significant
  from red to blue
