figure_title: A general scheme of the brassinosteroid (BR) signaling pathway from
  recognition to the transcriptional activation of BR-responsive genes in the nucleus
  (based on [35,40,46]).
caption: A general scheme of the brassinosteroid (BR) signaling pathway from recognition
  to the transcriptional activation of BR-responsive genes in the nucleus (based on
  [35,40,46]). BRs are recognized by a receptor complex containing BRI1 and BAK1.
  The binding of BR receptor kinases triggers the dephosphorylation and accumulation
  of the nuclear proteins BZR1/BES1, which is presumably achieved by inhibiting the
  negative regulator BIN2. In the absence of BR, the BIN2 kinase phosphorylates and
  targets BZR1/BES1 for degradation via the ubiquitin-dependent proteasome pathway
