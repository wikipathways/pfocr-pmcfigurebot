figure_title: The mechanism by which KLF6 affects melanogenesis.
caption: The mechanism by which KLF6 affects melanogenesis. (a) After silencing KLF6
  (si-KLF6), the relative expression levels of KLF6 gene and protein (N = 3, *** p<0.001).
  (b) The mRNA levels of genes related to the melanogenesis pathway (** p<0.01, ***
  p<0.001). (c) The mRNA levels of STAT3 and TYR after silencing KLF6 (** p<0.01).
  (d) After KLF6 silencing, STAT3 protein and its phosphorylation levels (N = 3, **
  p<0.01, *** p<0.001). (e) After STAT3 silencing, the expression levels of STAT3
  protein and its phosphorylation (N = 3, * p<0.05). (f) The expression levels of
  STAT3 and TYR mRNA after STAT3 silencing (** p<0.01). (g) The protein and phosphorylation
  levels after STAT3 phosphorylation inhibition (N = 3, ** p<0.01). (h) The mRNA expression
  level of TYR after STAT3 phosphorylation inhibition (** p<0.01). N, number of biological
  repeated experiments
