figure_title: The proposed model for FOXL2 and FOXO3 action in maintaining the ovarian
  reserve.
caption: The proposed model for FOXL2 and FOXO3 action in maintaining the ovarian
  reserve. The main mechanisms of follicle recruitment are described in WT, FOXL2
  KO, and TSC1 KO mice models. In WT ovaries, primordial follicles remain quiescent,
  and pfGCs expressing FOXL2 are flattened. In Foxl2 KO mutants, the absence of FOXL2
  in pfGCs leads to decreased Tsc1 transcription, which activates mTORC1, promoting
  primordial follicle activation by increasing KITL. KITL binds cKIT on the oocyte
  surface, triggering PI3K/Akt signalling, phosphorylating FOXO3, and relocating it
  to the cytoplasm, thereby abolishing a potential Tsc1 transcription. The activated
  PI3K/Akt pathway also inactivates TSC1/2 in oocytes, removing mTORC1 inhibition.
  GDF9 expression indicates oocyte awakening and follicle activation. Despite high
  levels of GDF9 and KITL suggesting activation, proliferation remains limited because
  the lack of FOXL2 prevents pfGCs from transitioning from flattened to cuboidal shape,
  implying that only mature cuboidal GCs respond to such factors. According to Zhang
  et al. 2014 [12], Tsc1 ablation in pfGCs results in mTORC1 hyperactivation and oocyte
  awakening. When FOXL2 is present, pfGCs differentiate into cuboidal cells, becoming
  GDF9-responsive, thus promoting follicle growth and maturation [5]. We propose that
  the master transcription factors FOXL2 and FOXO3 cooperate to maintain follicular
  quiescence by negatively regulating mTORC1 through TSC1, with FOXL2 acting in pfGCs
  and FOXO3 in oocytes [6]. The image has been created using Biorender.com
