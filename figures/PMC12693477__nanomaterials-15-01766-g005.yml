figure_title: Complement activation pathways induced by PSNs (Created in BioRender.
caption: 'Complement activation pathways induced by PSNs (Created in BioRender. Patel,
  T. (2025) https://BioRender.com/i2x0h8c). This figure illustrates the activation
  of the complement system by PSNs via three distinct pathways: the classical, lectin,
  and alternative pathways. The classical pathway is triggered by antigen–antibody
  complexes involving C1q, while MBL and MASP activate the lectin pathway. The alternative
  pathway is initiated through spontaneous hydrolysis of C3 into C3(H2O). Activation
  of C3 leads to the generation of C3a and C3b, where C3a functions as an anaphylatoxin
  that recruits neutrophils and monocytes, contributing to inflammation, while C3b
  facilitates opsonisation for phagocytosis. Further activation of C5 results in the
  formation of C5a, another potent inflammatory mediator, and C5b, which initiates
  MAC formation. The MAC, composed of C5b, C6, C7, C8, and C9, leads to cell lysis.
  Additionally, a self-amplification loop of C3 enhances the complement response.
  This schematic highlights the immune-modulatory effects of PSNs, demonstrating their
  potential to trigger complement activation, which may influence their biocompatibility
  and therapeutic applications'
