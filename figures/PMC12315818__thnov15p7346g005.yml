caption: 'Seeking anti-cancer effects among interactions with cell death mechanisms:
  Artemisiae Annuae Herba components and derivatives can often exert their anti-cancer
  effects through multiple mechanisms that induce tumor cell death. These mechanisms
  include A) apoptosis, potentially through activation of caspase pathways (through
  caspase-3 and -9) or modulation of Bcl-2 family proteins, specifically Bcl-2, BAX
  and BAK; B) autophagy, influenced by IL-3 and the PI3K/AKT/mTOR pathway; and C)
  ferroptosis, which is associated with labile iron and the Fenton reaction'
