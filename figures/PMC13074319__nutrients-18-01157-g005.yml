figure_title: Integrated contribution of micronutrients within the OFIF whole-food
  matrix in metabolic syndrome.
caption: 'Integrated contribution of micronutrients within the OFIF whole-food matrix
  in metabolic syndrome. This schematic highlights the role of vitamins (e.g., vitamin
  C, vitamin E, provitamin A carotenoids) and minerals (e.g., magnesium, potassium,
  zinc, calcium) present in OFIF as components of a complex nutritional matrix. Unlike
  Figure 3 and Figure 4, which focus on bioactive-driven intracellular signaling pathways,
  this figure emphasizes food-level interactions and micronutrient-mediated support
  of metabolic and vascular homeostasis, including antioxidant defense, insulin signaling
  support, endothelial function, and blood pressure regulation. Shared downstream
  effects with other bioactive compounds are simplified to underscore the concept
  of food synergy rather than pathway redundancy. Abbreviations: OFIF, Opuntia ficus-indica
  fruits; ROS, reactive oxygen species; NRF2, nuclear factor erythroid 2–related factor
  2; IRS, insulin receptor substrate; ATP, adenosine triphosphate; PUFA, polyunsaturated
  fatty acid. Arrows indicate the direction of interaction and functional contribution
  of each component to the OFIF food matrix. Color coding distinguishes nutrient classes:
  blue denotes antioxidant vitamins, green minerals and systemic metabolic interfaces,
  purple functional amino acids, and light green soluble fiber. The central concept
  highlights the synergistic action of whole-food components at physiological, non-pharmacological
  concentrations'
