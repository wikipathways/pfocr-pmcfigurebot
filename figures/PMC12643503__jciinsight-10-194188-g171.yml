figure_title: Retinol metabolism is strongly regulated by skin wounding
caption: '(A) Outline of the experimental setup. Pdgfrα+ fibroblasts were sorted from
  normal skin and 5-day wounds and subjected to RNA-Seq and metabolomics analysis.
  N = 3 mice per experiment. Created in BioRender. Werner, S. (2025) https://BioRender.com/aaw9vrp
  (B) Volcano plot showing differentially abundant metabolites in wound vs. normal
  skin fibroblasts. Colored points indicate metabolites with significantly differential
  abundance (P ≤ 0.05); diamond-shaped points indicate metabolites that were confirmed
  in an independent experiment. N = 3 mice per experiment. (C) Volcano plot showing
  differentially expressed genes in wound vs. normal skin fibroblasts based on bulk
  RNA-Seq analysis of FACS-sorted fibroblasts (16). Colored points indicate significantly
  differentially expressed genes (Bonferroni-corrected P ≤ 0.05, |log2(FC)| ≥ 2).
  N = 3 mice. Rdh10, retinol dehydrogenase 10; Rbp4, retinol-binding protein 4; Stra6,
  stimulated by retinoic acid 6. (D) Integrated pathway analysis of RNA-Seq and metabolomics
  data sets using MetaboAnalyst 6.0. Colored points indicate significantly altered
  pathways (P ≤ 0.05). (E) Schematic overview of retinol metabolism with highly relevant
  metabolites and genes. Metabolites with a strikethrough pattern were not detected
  in the metabolomics experiment. Members of the respective enzyme families that were
  significantly differentially expressed based on RNA-Seq data are featured (uncorrected
  P ≤ 0.05). Size of the circles corresponds to the log10(RPKM+0.95) (0.95 was added
  to all values to avoid negative results of the logarithm), and color represents
  the log2(fold change) of the genes (red: increased expression in wound vs. normal
  skin fibroblasts; blue: reduced expression in wound vs. normal skin fibroblasts).
  RPKM, reads per kilobase million'
