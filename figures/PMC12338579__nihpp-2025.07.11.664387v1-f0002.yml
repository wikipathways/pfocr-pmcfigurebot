figure_title: β-glucan priming induces epithelial memory
caption: |-
  A. Schematic of the in vitro β-glucan priming model in human oral epithelial cells. Created with BioRender.com
  B. Chemokine and cytokine levels in supernatants from naïve and BG-primed epithelial cells after 8h of C. albicans infection. N=6; One-way ANOVA with Tukey’s multiple comparisons test. UNINF – uninfected, INF – Infected. C. Chemokine and cytokine levels in supernatants from naïve, LPS-treated, and BG-primed epithelial cells after LPS restimulation for 24h. N=6; One-way ANOVA with Tukey’s multiple comparisons test. D. Chemokine and cytokine levels in supernatants from naïve, LPS-treated, and LPS-primed epithelial cells after LPS restimulation for 24h. N=6; One-way ANOVA with Tukey’s multiple comparisons test. E. Volcano plot showing pathways associated with differentially accessible regions (DARs) identified by ATAC-seq after, analyzed using g: profiler. F. Stacked bar plot depicting canonical pathways significantly enriched between 24 h after β-glucan-stimulated and control oral epithelial cells, as determined by Ingenuity Pathway Analysis (IPA). N=4. G. Representative immunoblot showing histone methylation in β-glucan primed epithelial cells after 48h rest. N – naïve, P – β-glucan primed H. Schematic of fungal infection model and timeline of epithelial-enriched tissue collection. I. Representative immunoblot showing histone methylation in epithelial-enriched tissue from wildtype mice after primary infection. N=3. J. Global DNA methylation levels in epithelial cells primed with β-glucan and mannan for 24h followed by 48h resting. N=6; One-way ANOVA with Dunnett’s multiple comparisons test. N – naïve, BG – β-glucan, M – mannan
