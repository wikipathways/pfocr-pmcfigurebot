figure_title: Carbamoyl phosphate is formed in three steps by the hepatic mitochondrial
  enzyme complex, carbamoyl phosphate synthetase I (CPS-I).
caption: Carbamoyl phosphate is formed in three steps by the hepatic mitochondrial
  enzyme complex, carbamoyl phosphate synthetase I (CPS-I). ① Bicarbonate is phosphorylated
  to carboxyphosphate. ② The addition of NH3 condenses carboxyphosphate to form carbamic
  acid and releases phosphate. ③ Carbamic acid is phosphorylated to form carbamoyl
  phosphate (CP). The consumption of two molecules of ATP makes this pathway irreversible.
  Both phosphorylation steps (1 and 3) require the allosteric regulator N-acetylglutamate
  (NAG) [54]
