figure_title: Anti-inflammatory effects of resveratrol (RSV) as a consequence of its
  influence on the metabolism of arachidonic acid (AA).
caption: 'Anti-inflammatory effects of resveratrol (RSV) as a consequence of its influence
  on the metabolism of arachidonic acid (AA). The cleavage of cell membrane phospholipid
  by calcium-dependent cytosolic phospholipase A2 (cPLA2) AA is released, which is
  an essential fatty acid and a precursor of eicosanoids: prostaglandins (PGs), thromboxanes
  (TX), leukotrienes (LTs), and lipoxins (LXs). Of the three main metabolic pathways
  of AA, involving lipoxygenase (LOX), cytochrome P450 (CYP), and cyclooxygenases
  (COX), the latter has been sufficiently studied in relation to the anti-inflammatory
  effects of resveratrol (marked in red with a crossed X symbolizing COX inhibition).
  Unlike COX, the ability of resveratrol to directly inhibit LOX and CYP has not been
  clearly confirmed (marked with a question mark in the figure). Resveratrol is an
  inhibitor of both COX-1 and COX-2 but has a stronger inhibitory effect on COX-2,
  because the antioxidative properties of resveratrol additionally and selectively
  cause COX-2 to silence the transcription of the COX-2-encoding gene. Ultimately,
  the inhibition of COX activity by resveratrol leads to a reduction in the concentrations
  of pro-inflammatory mediators, mainly PGs and TX. This final anti-inflammatory effect
  is marked symbolically with a green crossed X as extinguishing the flame. Other
  abbreviations: AP-1—activator-protein-1; c-Jun—a component of the transcription
  factor AP-1; ERK1—extracellular signal-regulated kinase 1; NF-κB—nuclear factor
  kappa-light-chain-enhancer of activated B cells; PKC—protein kinase C; ROS—reactive
  oxygen species. Down arrows are typical indications of decrease, double down arrow
  indicates a stronger decrease'
