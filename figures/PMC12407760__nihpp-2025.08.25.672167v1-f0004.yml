figure_title: IFN type preference of intestinal pDC differs from lymphoid tissue pDC
  and correlates with TGF-β signature genes
caption: Single-cell RNAseq data from this study was integrated with previously published
  scRNAseq datasets containing spleen and bone marrow-derived pDC. A. Data were integrated,
  and cells were clustered by UMAP. UMAP projections are shown below for each dataset
  individually downsampled to n = 200 cells to facilitate visual comparisons of cell
  distribution among clusters. B. Identifiers and cell numbers for data integrated
  in (A). C. Distribution of cells from each dataset in each cluster. D. Dot plot
  showing expression of marker genes identified by source publications for clusters,
  with each dataset downsampled to n = 200 cells. E. Proportion of reads belonging
  to type I, II, or III IFN genes in each dataset. Numbers at top indicate total number
  of cells expressing at least one IFN read and total number of IFN reads in each
  dataset. F. TGF-β HALLMARK pathway gene set enrichment analysis for gut vs. spleen
  cells in the pDC cluster. G. Dot plot showing expression of Itgae and leading-edge
  TGF-β HALLMARK pathway genes in each dataset
article_title: Plasmacytoid dendritic cells in the intestine preferentially produce
  interferon lambda at homeostasis contributing to tonic localized innate immune responses
