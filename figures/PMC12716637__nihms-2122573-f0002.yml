figure_title: Aryl hydrocarbon receptor (AHR)-dependent transcription in airway epithelial
  cells and in lungs of mice following respiratory syncytial virus (RSV) infection.
caption: 'Aryl hydrocarbon receptor (AHR)-dependent transcription in airway epithelial
  cells and in lungs of mice following respiratory syncytial virus (RSV) infection.
  A: Schematic representation of the canonical AHR signaling pathway. Upon ligand
  binding, AHR translocates from the cytoplasm to the nucleus, where it dimerizes
  with AHR nuclear translocator (ARNT). The AHR-ARNT heterodimer then binds DNA at
  xenobiotic response element (XRE) sites to regulate the expression of target genes,
  such as CYP1A1. B: Primary human small airway epithelial (SAE) cells from 2 donors
  and A549 cells were used in the experiments shown in C and D. Circles represent
  cells from the female, squares represent cells from male, open symbols represent
  uninfected cells, and filled symbols represent RSV-infected cells. C: SAE cells
  mock or infected with RSV were harvested 6, 15, and 24 hours postinfection (hpi),
  RNA was extracted, and CYP1A1 gene expression was quantified by RT-qPCR (n = 6;
  pooled data from three independent experiments performed in duplicate; *** P < 0.001
  by two-way ANOVA followed by Bonferroni’s test). D: A549 cells were transfected
  with the pGL4.43[luc2P/XRE/Hygro] vector and either infected with RSV or stimulated
  with the AHR ligand TCDD (10 nM) as positive control. At 15 and 24 hpi (or 3 h after
  stimulation with TCDD), the luciferase reporter activity was measured (n = 6; pooled
  data from two independent experiments performed in triplicate; *** P < 0.001 by
  one-way ANOVA followed by Dunnett''s test). E: SAE cells mock or infected with RSV
  for 15 h were exposed to vehicle (0.01% DMSO) or the AHR ligands TCDD (5 nM), BaP
  (1 μM), FICZ (1 nM), or I3C (20 μM) for 3h. Cells were harvested at 18 hpi, RNA
  was extracted, and CYP1A1 gene expression was quantified by RT-qPCR (n = 6, pooled
  data from three independent experiments performed in duplicate, *** P < 0.001 by
  two-way ANOVA followed by Bonferroni’s test). F: Female BALB/c mice infected with
  RSV (or mock inoculated with PBS) were euthanized at 1, 2, 4, 7, and 10 days postinfection
  (dpi), the lungs were harvested for RNA extraction, and Cyp1a1 gene expression was
  determined by RT-qPCR (n = 4-9 mice per group, biological replicates; *** P < 0.001
  by lognormal one-way ANOVA followed by Dunnett''s test). Each point or symbol represents
  data obtained from one mouse. Open circles represent control/mock inoculated mice
  and filled circles represent RSV-infected mice. Bar graphs show means ± SD'
