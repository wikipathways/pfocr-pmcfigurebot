figure_title: Knockdown of HIF-1α inhibited the proliferation and invasion of OCSCs
  in hypoxic environment through PI3K and Hedgehog signaling pathway.
caption: Knockdown of HIF-1α inhibited the proliferation and invasion of OCSCs in
  hypoxic environment through PI3K and Hedgehog signaling pathway.(a) Cell viability
  was detected by MTS experiment. It was significantly increased in hypoxic environment
  or after 740 Y-P and Purmorphamine intervention, and significantly decreased after
  HIF-1α knockdown or LY294002 and Cyclopamine intervention. (b) Cell proliferation
  was detected by EdU experiment. EdU positive cells increased significantly in hypoxic
  environment or after 740 Y-P and Purmorphamine intervention, and decreased significantly
  after HIF-1α knockdown or LY294002 and Cyclopamine intervention (× 40, 50 μm). (c)
  Cell invasion was detected by Transwell experiment. The number of invasive cells
  increased significantly in hypoxic environment or after 740 Y-P and Purmorphamine
  intervention, and decreased significantly after HIF-1α knockdown or LY294002 and
  Cyclopamine intervention (× 20, 100 μm). (d) Ki-67, MMP2 and MMP9 expressions
