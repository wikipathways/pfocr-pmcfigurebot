figure_title: Reduced 2-AG release mediates increased presynaptic Pr and learning
  deficits in NEX-het-cKO mice
caption: (A) Diagram showing synthesis and degradation pathways of 2-AG and AEA, together
  with related inhibitors. (B–D) The 2-AG was the principal eCB evoked by electrical
  stimulation. Representative traces (B and C) and summary (D) showing that DO34 (1
  μM) abolished GRABeCB2.0 signals (n = 5 mice). (E–L) The 2-AG release was significantly
  reduced in NEX-het-cKO mice (Control, n = 5 mice; NEX-het-cKO, n = 6 mice). (E)
  Schematic of GRAB2-AG1.2 activation by 2-AG but not by AEA. (F) Schematic of AAV-Syn-DIO-2-AG1.2
  injection in the mPFC of NEX-Cre (Control) or NEX-het-cKO mice. Heatmap (G) and
  average traces (H) of GRAB2-AG1.2 signals evoked by increasing stimulation intensities
  in control. (I and J) Same as in G and H but for NEX-het-cKO mice. (K) Input/output
  plot of GRAB2-AG1.2 signals versus stimulation intensity. (L) Slope of input/output
  relationship. (M and N) MAGL inhibitor JZL184 rescued the reduced EPSC PPRs in NEX-het-cKO
  mice (Control, n = 18 neurons; NEX-het-cKO, n = 21 neurons). (O and P) FAAH inhibitor
  URB597 did not affect the reduced EPSC PPRs in NEX-het-cKO mice (Control, n = 17
  neurons; NEX-het-cKO, n = 19 neurons). (Q–T) JZL184 ameliorated spatial learning
  and memory deficits in NEX-het-cKO mice (Control, n = 13 mice; NEX-het-cKO, n =
  10 mice; NEX-het-cKO + JZL184, n = 10 mice). Green asterisks, control versus NEX-het-cKO;
  red asterisks, NEX-het-cKO versus NEX-het-cKO + JZL184. (Q) Number of primary errors.
  (R) Primary latency. (S) Primary path length. (T) Percentage of strategy used. Statistical
  comparisons were performed using 2-tailed unpaired Student’s t test (L), 2-tailed
  paired Student’s t test (D), 1-way ANOVA followed by 2-tailed Bonferroni’s t test
  (Serial and Mixed; T), Kruskal-Wallis test followed by Dunn’s test (Direct; T),
  and 2-way ANOVA followed by Bonferroni’s post hoc test (K, N, P, and Q–S). Data
  are presented as mean ± SEM. *P < 0.05, **P < 0.01, ***P < 0.001
