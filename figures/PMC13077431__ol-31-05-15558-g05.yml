figure_title: HP promotes ferroptosis in M2 macrophage by inducing intracellular Fe2+
  generation via the CD163/HO-1 signaling pathway.
caption: HP promotes ferroptosis in M2 macrophage by inducing intracellular Fe2+ generation
  via the CD163/HO-1 signaling pathway. (A and B) M2 macrophages were cultured with
  CM from NCI-H226 and NCI-H520 cells infected with LV-HP or LV-Ctrl, in the presence
  of Hb and an anti-CD163 antibody. The heme levels in M2 macrophages were measured
  using (A) spectrophotometry and (B) HO-1 protein expression levels were examined
  using flow cytometry. (C) M2 macrophages were co-cultured with CM containing Hb,
  with or without the addition of an anti-CD163 antibody, the HO-1 inhibitor SnPPIX,
  or the Fe2+ chelator DFO for 24 h. (D) Following treatment with the anti-CD163 antibody,
  the percentage of 7-AAD+ cells, and the mean fluorescence intensity of FerroOrange
  and (E) C11-BODIPY were analyzed by flow cytometry. After SnPPIX treatment, (F)
  7-AAD+ cells, (G) FerroOrange intensity (H) and C11-BODIPY intensity were assessed.
  Following DFO treatment, (I) 7-AAD+ cells, (J) FerroOrange intensity, and (K) C11-BODIPY
  intensity were measured. Data are presented as the mean ± SD from five independent
  experiments and were analyzed using an unpaired t-test or a two-way ANOVA followed
  by a Tukey's post-hoc multiple comparison analysis. ****P<0.0001. HP, haptoglobin;
  CM, conditioned media; Hb, hemoglobin; 7-AAD, 7-aminoactinomycin D; HO-1, heme oxygenase-1;
  DFO, deferoxamine
