figure_title: The β-cell primary cilium as a semi-autonomous signaling compartment
caption: Schematic representation of the primary cilium as a specialized signaling
  domain. The ciliary membrane concentrates sensory and signaling machinery, including
  ion channels, GPCRs, and adenylyl cyclases, which converge to generate and maintain
  pools of second messengers (Ca2+, cAMP) that are distinct from the cell body. Outgoing
  signals from the cilium regulate cell body function, though the precise molecular
  signals downstream of ciliary metabolic GPCRs remain unmapped and are likely pathway-specific.
  Other unexplored signaling axes may involve communication between the cilium and
  other organelles such as mitochondria. For comparison, the plasma membrane harbors
  a distinct glycolytic metabolon where localized glucose metabolism regulates KATP
  channel closure to drive Ca2+ influx and insulin exocytosis. Key mechanistic questions
  addressed in the review are highlighted in the call-out box
article_title: 'Compartmentalized nutrient and hormone sensing in β-cells: the role
  of primary cilia'
