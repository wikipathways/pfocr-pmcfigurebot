caption: Proteomics analysis of ULF in dairy heifers between the CON and PGE2 groups.
  (A) Volcano plots of DAPs in ULF between the CON and PGE2 groups. (B) The bubble
  map of GO functional enrichment analysis of DAPs between the CON and PGE2 groups.
  (C) Pathway enrichment analysis of DAPs between the CON and PGE2 groups. (D,E) The
  GSEA analysis of cAMP and chemokine signaling pathways between the CON and PGE2
  groups, respectively. (F) The protein–protein interaction network of DAPs based
  on MCC value between the CON and PGE2 groups. Nodes represent proteins and edges
  indicate protein–protein interactions. Node size reflects the degree of connectivity,
  with larger nodes representing proteins with higher interaction degrees
