  Activity Status Index, CNST: Canadian Nutritional Screening Tool, FFMI: Fat-Free
  Mass Index, HADS: Hospital Anxiety and Depression Scale, CPET: Cardiopulmonary Exercise
  Test, PG-SGA: Patient-Generated Subjective Global Assessment, ERAS: Enhanced Recovery
  After Surgery'
