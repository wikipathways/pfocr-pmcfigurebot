figure_title: Hepatic DNL pathways.
caption: 'Hepatic DNL pathways. Elevated hepatic DNL, driven by carbohydrate overfeeding—especially
  fructose—plays a central role in MASLD pathogenesis by promoting TG accumulation.
  Fructose activates ChREBP, upregulates DNL enzymes, and increases palmitate synthesis,
  contributing significantly to VLDL-TG. Excessive fructose intake leads gut microbiota
  to produce acetate, which is converted to acetyl-CoA in the liver by ACSS2. In MASLD,
  DNL-derived FAs constitute a larger fraction of VLDLTG. The ER and Golgi microsome-associated
  lumenal lipid droplets (MALD) represent a metabolically active TG pool that serves
  as the precursor for hepatic VLDL production. *Abbreviations: ACSLs, long-chain
  fatty acyl-CoA synthetases; ACSS2, acetyl- CoA synthetase 2; AGPAT, 1-acylglycerol-3-phosphate
  acyltransferase; ALDOB, aldolase B; ApoB100, apolipoprotein B100; AQPs, aquaglyceroporins;
  DHAP, dihydroxyacetone phosphate; GA, glyceraldehyde; GA3P, glyceraldehyde-3-phosphate;
  GPD1/2, glycerol-3-phosphate dehydrogenase 1 and 2; LPA, lysophosphatidic acid;
  MCTs: monocarboxylate transporters; OAA, oxaloacetate; PA, phosphatidic acid; and
  TPI, triose topoisomerase'
