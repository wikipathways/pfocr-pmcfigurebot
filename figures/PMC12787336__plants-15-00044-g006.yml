figure_title: WGCNA of transcriptomes identifies co-expression modules associated
  with sRNA processing and phytohormone in ago1 mutants.
caption: WGCNA of transcriptomes identifies co-expression modules associated with
  sRNA processing and phytohormone in ago1 mutants. (A) Clustered modules generated
  from the weighted correlation network analysis. Each branch of the dendrogram represents
  genes, and genes clustered into the same module are assigned the same module color.
  Genes assigned in gray indicate no clustering to any module. (B) Module–trait relationship
  heatmap showing Pearson correlation coefficients between gene co-expression modules
  and sample traits. Each cell displays the correlation value and its p-value (red
  indicates positive correlations and blue indicates negative correlations, according
  to the color scale shown on the right). (C) GO analysis of genes clustered in brown
  module, yellow module, magenta module, pink module, black module, and greenyellow
  module. The phytohormone signaling-related pathways are marked in red font, the
  small RNA processing-related pathways are marked in green font, and the leaf development-related
  pathway is marked in pink font. The phytohormone signal, siRNA processing and leaf
  development pathways are highlighted in colored fonts
