figure_title: Activated FOXO1 inhibits c-Met/β-cateninΔ90 HCC formation in vivo
caption: '(A) Schematic representation of FOXO in the mTORC2/AKT pathway. Blocking
  AKT phosphorylation sites on FOXO leads to its constitutive activation. (B) Study
  design. FVB/N mice were hydrodynamically injected with either c-Met/β-cateninΔ90/pT3
  or c-Met/β-cateninΔ90/pT3-Foxo1AAA plasmids. (C) The survival curves of c-Met/β-cateninΔ90/pT3
  (N=6) and c-Met/β-cateninΔ90/pT3-Foxo1AAA (N=12). (D) Comparison of liver weight
  at 7 to 9 weeks post-injection. (E) Representative gross liver images and H&E staining.
  (F) Representative immunohistochemistry of Ki67, β-catenin, Myc-tag, and GS. Scale
  bars: 100 μm. (G) Study design. Foxo1flox/flox mice were hydrodynamically injected
  with either c-Met/β-cateninΔ90/pCMV or c-Met/β-cateninΔ90/Cre plasmids. (H) The
  survival curves of Foxo1flox/flox mice injected with c-Met/β-cateninΔ90/pCMV (N=5)
  and c-Met/β-cateninΔ90/Cre (N=11). (I) Comparison of liver weight. (J) Representative
  gross liver images and H&E staining. Scale bars: 100 μm. Data are presented as the
  mean ± SEM. Statistical significance: **P < 0.01. Abbreviations: H&E, hematoxylin
  and eosin staining; w.p.i., weeks post-injection'
article_title: Targeting mTORC2-Dependent AKT/FOXO1/RNF125 Signaling Exploits a Therapeutic
