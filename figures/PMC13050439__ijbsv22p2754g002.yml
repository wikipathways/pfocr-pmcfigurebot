figure_title: Metabolic reprogramming in IGF2BP2 KO macrophages.
caption: Metabolic reprogramming in IGF2BP2 KO macrophages. (A, B) Volcano plots of
  DEGs (shown in gray), with significantly upregulated glycolytic pathway genes highlighted
  in M0 (orange, A) and M2 (purple, B) macrophages (n = 3 mice per group). (C, E)
  Extracellular acidification rate (ECAR) during the glycolysis stress test and (D,
  F) Oxygen consumption rate (OCR) during the mitochondrial stress test in untreated
  (M0) and IL-4-treated BMMs, measured using the Seahorse XF Pro Analyzer (n = 4 mice
  per group, triplicates). (H) Quantitative RT-PCR detection of the relative mtDNA/gDNA
  ratio in BMMs (n = 8 mice per group, duplicates). (I, J) Flow cytometric measurements
  of mitochondrial mass (I) and mitochondrial membrane potential (J) relative to WT
  BMMs (n = 5-6 mice per group, duplicates), with pseudocolor plots of representative
  samples. (K, L) The MitoSOX™ signal was measured using live-cell imaging with the
  Incucyte® S3 system 15 minutes after adding MitoSOX or Antimycin A (AA). Fluorescence
  intensities relative to WT (set to 100%) are shown. (L) Representative Images. The
  fluorescence signal is shown in red. Scale bar = 200 µm (n = 4 mice per group, quadruplicates).
  p values were determined using one-way ANOVA followed by Bonferroni post-hoc tests
  (E-G, K) or Student's t-test (I, J) (* p < 0.05; **p < 0.01; ***p < 0.001)
article_title: IGF2BP2 Deficiency in Macrophages Impairs Migration, Reprograms Metabolism,
  and Limits Tumor Progression
