figure_title: Effects of RCE on myogenesis and protein degradation-related pathway
  in TNF-α-stimulated L6 myotubes.
caption: Effects of RCE on myogenesis and protein degradation-related pathway in TNF-α-stimulated
  L6 myotubes. (A) The mRNA expression of genes involved in myogenesis. (B) The mRNA
  expression of genes involved in muscle-specific E3 ubiquitin ligases. The mRNA expressions
  were measured by RT-PCR. (C) The protein levels of phosphorylated and total FoxO3a
  were assessed using Western blot analysis. α-Tubulin-served as a loading control.
  Group differences were assessed using one-way analysis of variance (ANOVA). Bars
  with different letters are significantly different (p < 0.05). Asterisk (*) indicates
  statistically significant differences between the two groups based on unpaired t-test
  results (p  <  0.05). Values are means ± SEM. RCE, Rosa canina extract; TNF-α, tumor
  necrosis factor-alpha; Myog, gene name of myogenin; Myh, gene name of myosin heavy
  chain; Trim63, gene name of muscle ring finger 1; Fbxo32, gene name of muscle atrophy
  F-box; FoxO3a, forkhead box O3a; p-FoxO3a, phosphorylated FoxO3a
