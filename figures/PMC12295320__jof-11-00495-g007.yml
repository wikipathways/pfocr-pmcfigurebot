figure_title: Global ubiquitinome analysis of ΔAaubp14 during infection.
caption: Global ubiquitinome analysis of ΔAaubp14 during infection. (A) Western blot
  analysis of total protein ubiquitination in wild-type and ΔAaubp14 mutant. (B) Workflow
  of quantitative ubiquitinome analysis. Mycelium from wild-type and ΔAaubp14 strains
  was inoculated onto Hongjv leaves (26 °C, 36 h), followed by protein extraction,
  trypsin digestion, ubiquitin peptide enrichment, and LC-MS/MS analysis. (C) Pearson
  correlation analysis of biological replicates shown as a heatmap. Darker blue shades
  reflect stronger correlations approaching 1. (D) Relative standard deviation (RSD)
  distribution of quantified proteins. Smaller RSD values indicate better quantitative
  reproducibility. (E) Amino acid frequency analysis of ubiquitination sites. (F)
  Distribution of hyper-ubiquitinated proteins and modification sites identified in
  ΔAaubp14. (G) Subcellular distribution of hyper-ubiquitinated proteins. (H) GO enrichment
  analysis of biological processes. (I) Enriched protein domains among hyper-ubiquitinated
  proteins. (J) KEGG pathway enrichment analysis of hyper-ubiquitinated proteins
