figure_title: Cyp1a1/Gpr75 in the aorta may mediate abnormal arachidonic acid metabolism.
caption: 'Cyp1a1/Gpr75 in the aorta may mediate abnormal arachidonic acid metabolism.
  (A) Reactome pathway enrichment analysis of DEGs with the arachidonic acid metabolism
  pathway significantly enriched (highlighted in red). (B) Gene-pathway network visualization
  showing enriched biological pathways. The arachidonic acid metabolism and Cyp1a1
  are marked. (C) The figure represents the enrichment pathway for transcriptome and
  metabolome co-analysis. Horizontal: The impact indicator of the pathway; the higher
  the right, the higher the “importance” of the pathway in the network. Longitudinal
  axis (−log10(p value)): Statistically significant; the higher the difference, the
  more significant the difference. (D) Generalized fold change plot of significantly
  altered genes in the arachidonic acid metabolism pathway between HCY and control
  groups. (E) Schematic diagram of the relationship between Cyp1a1 and Gpr75 in the
  AA pathway. (F) Transcriptome sequencing showing significant upregulation of Cyp1a1
  and Gpr75 mRNA expression in the HCY group and normalization after folic acid. (G)
  Quantitative RT-PCR analysis showing significant upregulation of Cyp1a1 and Gpr75
  mRNA expression in the HCY group and normalization after folic acid (FA) treatment.
  (H) Western blot validation of Cyp1a1 and Gpr75 protein expression levels with GAPDH
  used as a loading control. (I) Densitometric quantification of Western blot bands
  for Cyp1a1 and Gpr75, confirming significant overexpression in the HCY group and
  suppression by FA. Data are presented as mean ± SD. Statistical significance: *
  p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001'
