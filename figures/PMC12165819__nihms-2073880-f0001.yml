figure_title: Acetylated polyamines are associated with malignant progression of IPMN
caption: A) Volcano plot illustrating area under the Receiver Operating Characteristics
  curve (AUC) for individual metabolites detected in cystic fluid for distinguishing
  44 patients with high-grade (HG) IPMN with or without an associated adenocarcinoma
  (IPMN/PDAC) from 81 patients with non-cancerous (low-grade; LG) IPMN. A histogram
  above the volcano plot shows a non-gaussian distribution. B) Metabolite Set Enrichment
  Analyses (MSEA) of the 69 metabolites that were differential (Wilcoxon rank sum
  test 2-sided p-value <0.05) between cases (HG IPMN + IPMN/PDAC) and LG IPMN shows
  spermidine and spermine biosynthesis and catabolism as the top perturbed metabolic
  pathway. C) Relative abundance of acetylated polyamines in cystic fluid of patients
  with IPMN. Statistical significance was determined by Wilcoxon rank sum tests and
  2-sided p-values reported. D) Receiver Operating Characteristic Curves illustrating
  predictive performance estimates of individual acetylated polyamines for prediction
  of IPMN/PDAC + HG IPMN, IPMN/PDAC, and HG IPMN
article_title: Integrated metabolomics and spatial transcriptomics of cystic pancreatic
