figure_title: Proposed mechanism of action of ASB9 in GCs on PAR1-induced cell proliferation.
caption: Proposed mechanism of action of ASB9 in GCs on PAR1-induced cell proliferation.
  PAR1, which couples to G proteins, activates different intracellular signaling pathways,
  including the MAPK3/1 pathway, leading to cell proliferation. Following induction
  by LH/hCG, ASB9 binds to and inhibits PAR1, likely through the ubiquitin proteasome
  pathway of protein degradation, resulting in the inhibition of the PAR1-activated
  MAPK pathway and the reduction/blockade of granulosa cell proliferation. Granulosa
  cells expressing ASB9 after LH induction stop proliferating and instead move toward
  differentiation, which was also evidenced by a decrease in CCND2 expression. Additionally,
  we suspect that ASB9 may contribute to cell death by upregulating the expression
  of proapoptotic markers, as evidenced by the data demonstrating increased BAX expression.
  Thrombin stimulation of PAR1 leads to the activation of different signaling pathways,
  such as the MAPK3/1, AKT, and P38 pathways. In granulosa cells, thrombin could block
  the negative action of ASB9, enabling increased proliferation/survival of granulosa
  cells through PAR1 and MAPK3/1 activation. PAR-1, protease-activated receptor-1;
  MAPK3/1, mitogen-activated protein kinase 3/1 (ERK1/2); JNK, c-Jun N-terminal kinase;
  JAK, Janus-activated kinase; STAT, signal transducer and activator of transcription;
  AKT, protein kinase B; P38, p38 mitogen-activated protein kinase; GC, granulosa
  cells
article_title: The Negative Role of Ankyrin-Repeat and SOCS-Box Protein 9 in PAR1
  Expression and the MAPK Signaling Pathway in Bovine Granulosa Cells
