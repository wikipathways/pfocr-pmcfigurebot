caption: 'Protein identification and analysis: (A) PCA of proteomic data from four
  developmental stages and 36 qingke samples. (B) hierarchical clustering analysis
  of the protein expression profiles of Dulihuang, Kunlun 14, and Heilaoya at four
  developmental stages. The color scale 0−1 represents Spearman’s correlation coefficient.
  (C) statistics of the differentially expressed proteins, including upregulated and
  downregulated proteins, in each comparison group. (D) Top 10 GO terms of each category
  for the recognized proteins in the proteome. (E) KEGG pathway enrichment of the
  identified proteins. The enrichment factor is the percentage of members out of the
  total number detected. The bubble size represents the number of members detected
  in the KEGG pathway, and the color of the bubble represents the −log 10 (p value)'
