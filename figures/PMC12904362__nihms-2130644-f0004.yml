figure_title: Influence of Tissue‐Specific Signaling Pathways and BRAF Variants on
  Response to BRAF/MEK Inhibitors in Melanoma and Colorectal Cancers
caption: Responses to BRAF and MEK inhibitors in melanoma and colorectal cancer are
  shaped by tissue-specific signaling contexts and the distribution of catalytic and
  non-catalytic BRAF variants. In colorectal cancer, BRAF genetic alterations coexist
  with active Wnt and EGFR signaling pathways, which confer decreased sensitivity
  to BRAF and MEK targeting with small-molecule inhibitors despite the expression
  of BRAF mutations. This resistance is further compounded by a minority subset of
  non-V600 BRAF genetic variants, which are less sensitive to these inhibitors than
  BRAFV600-mutated cells. In contrast, melanoma exhibits increased sensitivity to
  BRAF and MEK pharmacological inhibition due to lower EGFR expression, less active
  Wnt signaling, and the predominance of BRAFV600 variants
