figure_title: hASC-derived EVs modulated microglia pathways linked to TBI-induced
  inflammation at 30 dpi.
caption: 'hASC-derived EVs modulated microglia pathways linked to TBI-induced inflammation
  at 30 dpi. Heat maps annotated by IPA core analysis based on trend and z-score,
  which represent (A–C) a comparison analysis of canonical pathways, (D–F) disease
  and function pathways, and (G–I) upstream regulators based on differentially expressed
  proteins obtained from TBI + PBS/sham, TBI + 20 µg EVs/sham, and TBI + 20 µg EVs/TBI
  + PBS group comparisons. Three different ages were included: 3 months (A,D,G), 15
  months (B,E,H), and 20 months (C,F,I). Red indicates predicted activation (positive
  z-score), and green indicates predicted inhibition (negative z-score). Pathway activation
  or inhibition was considered significant with a |z-score| ≥ 2 or ≤−2, respectively.
  Blank cells represent cases where the p-value for overlap did not meet the statistical
  threshold (p < 0.05) and thus where no activation prediction could be made. Each
  experimental group included N = 5 animals across different age groups'
