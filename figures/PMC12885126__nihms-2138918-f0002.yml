figure_title: Transcriptomic analysis of Sox10-hM3Dq OPCs
caption: (A) RNA-seq analysis was done on OPCs purified from dissociated Sox10-hM3Dq
  brain cortices at P1. Volcano plot map of all the genes. Differential expressed
  genes (DEGs) were determined while fold-change (FC) > 2 and p-value < 0.05. 171
  DEGs were found, among which 102 were upregulated (right, red dots) and 69 were
  downregulated (left, blue dots). (B) Gene ontology (GO) term enrichment analysis
  for differentially expressed genes was performed using the ClusterProfiler package.
  The normalized enrichment score (NES) in the x-axis is the relative abundance of
  genes in such term. (C) GSEA analysis reveals a significant inhibition of gene sets
  associated with OPC differentiation in CNO-treated hM3Dq-positive OPCs. Gene sets
  associated with chromosome segregation, mitotic cell cycle checkpoint signaling,
  and signal transduction by p53 class mediator were upregulated in CNO-treated hM3Dq-positive
  OPCs. On the x-axis of each plot genes are ranked from the most upregulated (left
  end) to the most down-regulated (right end). Black vertical lines indicate the position
  of the genes from the biological pathway. The y-axis shows a running enrichment
  score (ES) which goes up when genes are encountered in the pathway and goes down
  otherwise, leading to an assessment of the distribution within the set of all genes.
  The normalized enrichment score (NES) is inferred from permutations of the gene
  set and the false discovery rate (FDR). The heat map on the right shows the relative
  level of gene expression in the leading-edge subset, corresponding to the 12 most
  significant genes. Relative transcription values are color coded from red (high)
  through blue (low)
