figure_title: Pore fenestration of lipid tails and K+-driven pore hydration
caption: a) Density of lipid tails near the pore of wt hBK in the Ca2+-free state,
  calculated using the last 150 ns of equilibrium simulations (Table S1, sim 1). The
  density is plotted as red mesh with a cutoff of 0.03 atom/Å3. b) Distribution of
  lipid tails at various z-positions along the central axis of the pore. The mean
  lifetime of lipid tails in the pore is < 10 ns (see Figure S3). c) Free energy surface
  as a function of pore water number and distance to the membrane center, calculated
  from WHAM analysis of the umbrella sampling simulations for the closed state (Table
  S2, wt0v). Contours are drawn every 2.5 kcal/mol. Snapshots are shown for three
  representative locations (I – III) along the pathway, with the biased K+ ion highlighted
  as the green sphere and other K+ ions near the pore shown in silver spheres. Only
  two pore lining S6 helices and filter loops/helices are shown for clarity
