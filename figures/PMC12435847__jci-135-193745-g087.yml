figure_title: Targeting CDK12/13 activates STING signaling
caption: '(A) Enrichment of the indicated pathways in Myc-CaP cells treated with YJ1206
  at 1 μM for 24 hours. Adj., adjusted. (B) Immunoblot of the indicated proteins in
  Myc-CaP cells treated with YJ1206 at increasing concentrations for 4 hours, or siRNAs
  targeting Cdk12 and/or Cdk13. Nontargeting siRNA was used as control. GAPDH was
  used as a loading control. (C) Top: Analysis of the indicated gene expression by
  RT-qPCR in Myc-CaP cells treated with YJ1206 at 1 μM for 15 hours, or siRNAs targeting
  Cdk12 and/or Cdk13. Nontargeting siRNA was used as control. Bottom left: IFN-β ELISA
  results in Myc-CaP cells treated as described above. Bottom right: Flow cytometry
  assessing surface MHC-I expression in Myc-CaP cells treated as described above.
  (D) Immunoblot of the noted proteins in B16-F10 cells treated with YJ1206 at increasing
  concentrations for 4 hours. (E and F) Flow cytometry median fluorescence intensity
  (MFI) quantifications of surface MHC-I (E) or PD-L1 (F) in the indicated cells treated
  with YJ1206 at 1 μM or 3 μM for 15 hours. (G) Quantification of immunofluorescence
  DNA/RNA hybrid (red) staining in Myc-CaP cells treated with 1 μM YJ1206 for 4 hours
  or siRNA targeting Cdk12 and/or Cdk13, with/without RNase H. Representative images
  are in Supplemental Figure 4D. Nontargeting siRNA was used as control. Forty (siRNA
  treatment) or 20 (YJ1206 or DMSO treatment) cells were used per data point. Data
  in C, E, and F are displayed as mean ± SD of triplicate experiments. Data in G are
  presented as box-and-whisker plots, with the median (center line), 25th–75th percentiles
  (box), and minimum to maximum values (whiskers). *P < 0.05; **P < 0.01; ***P < 0.001;
  ****P < 0.0001 by 2-tailed t test. NS, not significant. Bonferroni’s correction
  was applied for multiple comparisons in C and E–G'
