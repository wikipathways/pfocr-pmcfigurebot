figure_title: XN induces GSDME-dependent pyroptosis by activating the mitochondrial
  intrinsic apoptosis pathway.
caption: 'XN induces GSDME-dependent pyroptosis by activating the mitochondrial intrinsic
  apoptosis pathway. (A,B) PC3 cells were exposed to XN for 48 h and the MMP was determined
  by flow cytometry using JC-1 dyeusing. (C) Morphological changes in PC3 cells induced
  by XN for 48 h, either administered alone or in combination with Z-DEVD-fmk. (D)
  Cell viability of PC3 cells after treatment with XN alone or in combination with
  Z-DEVD-fmk for 48 h. (E,F) Cytochrome c expression levels was determined by Western
  blotting in PC3 cells under XN treatment at varying concentrations. (G,H) Expression
  of caspase-3, PARP, GSDME-FL and GSDME-N in PC3 cells after co-treatment with XN
  and Z-DEVD-fmk. The bar chart represents the relative protein expression levels.
  Data are shown as mean ± SD. (* p < 0.05, *** p < 0.001 and **** p < 0.0001 relative
  to control conditions; ## p < 0.01, ### p < 0.001 and #### p < 0.0001 indicate significant
  differences between experimental groups)'
