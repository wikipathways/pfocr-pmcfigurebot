figure_title: Lysophosphatidylcholine acyltransferase 1-phosphatidylcholine (LPCAT1-PC)
  axis ameliorates ferroptosis through endoplasmic reticulum (ER) pathway.
caption: 'Lysophosphatidylcholine acyltransferase 1-phosphatidylcholine (LPCAT1-PC)
  axis ameliorates ferroptosis through endoplasmic reticulum (ER) pathway. Nucleus
  pulposus cells were incubated with or without the ER-stress-specific activator tunicamycin
  (TM) after LPCAT1 or PC treatment. (A–D) Western blotting (WB), immunofluorescence
  analysis and quantification of glucose-regulated protein 78 (GRP78) and C/EBP homologous
  protein (CHOP) protein levels. n=3. Scale bar: 30 μm. (E) LysoTracker staining and
  ER-tracker staining after LPCAT1 or PC treatment with or without TM. Scale bar:
  10 μm. (F–I) CTSD and NAGLU activity is decreased in lysosomal and increased in
  cytosolic fractions in LPCAT1 or PC group treated with or without TM. n=3. (J) Immunofluorescence
  staining of CTSD. Scale bar: 10 μm. n=3. (K and L) Lipids ROS staining for lipid
  peroxidation and quantification of relative influence intensity in LPCAT1 or PC
  group treated with or without TM. Scale bar: 30 μm. n=3. (M and N) Ferrorange staining
  for Fe2+ levels and quantification of relative influence intensity. Scale bar: 50
  μm. n=3. (O and P) WB analysis and quantification of proteins COX2, TF, GPX4 and
  FTH1 levels in LPCAT1 or PC group treated with or without TM. CTSD, cathepsin D;
  NAGLU, alpha-N-acetylglucosaminidase; LAMP1, lysosome-associated membrane protein
  1; COX2, cyclooxygenase-2; TF, tissue factor; GPX4, glutathione peroxidase 4; FTH1,
  ferritin heavy chain 1; DAPI, 4´-6-diamidino- 2-phenylindole; ROS, reactive oxygen
  species. Compared with the TM group, *p<0.05, **p<0.01, and ***p<0.001'
