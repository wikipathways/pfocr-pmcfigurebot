figure_title: Reanalysis of independent transcriptomic data confirms HSV-1-induced
  activation of neurodegeneration and senescence pathways in COs, with limited protective
  effect of acyclovir
caption: (A) Schematic representation of the experimental design from Rybak-Wolf et
  al. [42], in which human iPSC-derived COs were infected with HSV-1 and analyzed
  3 dpi, with or without acyclovir treatment. 3’ mRNA-seq was used to assess transcriptomic
  changes. (B) Top deregulated pathways enriched upon HSV-1 infection, based on DEGs
  (3dpi vs. non-infected control) in D60 organoids from the Rybak-Wolf et al. [42]
  dataset. Pathways at 3 dpi are shown in color, while corresponding data from our
  7 dpi dataset (Figure 4) are displayed in greyscale. (C) Top deregulated pathways
  enriched upon HSV-1 infection based on DEGs (D60 COs 3 dpi vs. D60 COs 3 dpi with
  acyclovir treatment; 3 dpi with acyclovir treatment shown in color, 3 dpi shown
  in greyscale)
