figure_title: Differential abundance of microbial taxa and functional pathways associated
  with AP across infant subgroups
caption: '(A) Multivariable linear modeling of top genera and species identifies differentially
  abundant taxa between infants with allergic proctocolitis (AP) and unaffected controls
  across key clinical stages: early samples (0–2 months), last pre-symptomatic sample,
  first symptomatic sample, and first resolved sample. Positive coefficients indicate
  enrichment in AP; negative coefficients indicate enrichment in controls. (B) Linear
  model analysis of microbial metabolic pathways across the same clinical stages as
  in (A). The top three pathways with the largest absolute effect sizes are shown
  for each timepoint. (C)A focused view of fermentation-related pathways involved
  in short-chain fatty acid metabolism, including acetate, succinate, and butyrate
  production. “Acetyl-CoA fermentation to butyrate” refers specifically to the Acetyl-CoA
  → butyrate pathway II variant'
article_title: Strain-Level microbial signatures and inferred functional alterations
  in infants with Food Protein-Induced Allergic Proctocolitis
