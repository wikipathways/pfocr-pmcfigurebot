figure_title: Gene expression and metabolite profiling reveal distinct metabolic and
  signaling programs in HSP90AB1-dependent and -resistant cells.
caption: Gene expression and metabolite profiling reveal distinct metabolic and signaling
  programs in HSP90AB1-dependent and -resistant cells. (A,B) Enrichment analysis of
  differentially expressed genes (DEGs) showing Reactome (A) and KEGG (B) pathways
  significantly altered between dependent and resistant cell lines. (C) Joint pathway
  analysis integrating DEGs and differentially abundant metabolites. Individual pathways
  scored by significance and pathway impact with point sizes scaled to pathway impact
  (x axis) and color scaled to significance (y axis). Kegg Pathview maps shown to
  illustrate broad differences. See Supplemental Tables S7 and S8 for individual genes/metabolites.
  Significantly altered genes and metabolites in dependent and resistant populations
  related to pyrimidine metabolism (D) and DEGs in signaling and structural pathways
  including Rap1, and actin cytoskeleton organization (E,F)
