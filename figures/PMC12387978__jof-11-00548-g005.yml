figure_title: Transcriptomic dynamics in CSP41b-OE versus WT plants pre- and post-inoculation.
caption: 'Transcriptomic dynamics in CSP41b-OE versus WT plants pre- and post-inoculation.
  (A) Principal component analysis (PCA) of gene expression in 12 samples across four
  experimental groups. Samples within the same group are denoted by same symbols.
  (B) Bar plot quantifying the number of DEGs between indicated group comparisons.
  (C) GO enrichment of upregulated DEGs in OE lines between WT plants. (D) The Venn
  diagram illustrates overlaps of DEGs between OE lines and WT plants before and after
  R. solani infection. (E) Gene Set Enrichment Analysis (GSEA) of DEGs from WT_24hpi
  vs. WT_Mock and OE_24hpi vs. OE_Mock comparisons. Enriched KEGG pathways shown on
  y-axis, significance levels on x-axis. Enrichment scores are color-coded (red: upregulated;
  blue: downregulated; NES: Normalized Enrichment Score). (F) GSEA for DEGs from OE_24hpi
  vs. WT_24hpi comparison: Top left: Enrichment score (ES) profile; Bottom left: Barcode
  plot showing positions of pathway-specific genes in ranked DEG list (colors represent
  distinct gene sets). (G) Proportion of reads from chloroplast genome relative to
  total reads across groups. Values presented as bar plot (mean ± SE). Significant
  differences were determined using a two-tailed Student’s t-test (** p < 0.01)'
