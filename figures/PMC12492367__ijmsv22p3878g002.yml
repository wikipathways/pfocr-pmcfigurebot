figure_title: Relationship between disorders of lipid metabolism and the progression
  of keratoconus.
caption: Relationship between disorders of lipid metabolism and the progression of
  keratoconus. Lipid accumulation in the body affects corneal health in a number of
  ways. Lipid deposition leads to the aggregation of lipid droplets within corneal
  endothelial cells (CECs), which results in decreased density of CECs, distorted
  cell morphology, disruption of intercellular tight junctions and adhesion junctions,
  reduction in the number of surface microvilli, reduction in the expression and function
  of intracellular Na+/K+-ATPase, imbalance in the concentration of sodium and potassium
  ions, activation of oxidative stress and mitochondrial dysfunction, and ultimately,
  corneal endothelial cytotoxicity and apoptosis. Meanwhile, lipids are initially
  distributed as low-density lipoproteins (LDL) around blood vessels and leak into
  tissues through an insulating process, after which LDL interacts with 2-acrylamide-2-methylpropanesulfonic
  acid (AMPS) to form LDL-AMPS complexes, which are selectively entrapped to different
  parts of the eye, and then phagocytosis uptakes and degrades the LDL-AMPS complexes
  and then releases the Cholesterol and other lipids are released into the ocular
  tissues, causing inflammatory congestion and vascular obstruction near the cornea.
  In addition to this, high lipid can lead to atherosclerosis, which on the one hand
  increases vascular permeability and abnormal blood flow, causing extravascular lipid
  deposition in ocular tissues, and ultimately lipid deposition occurs in the stromal
  layer of the cornea, forming corneal rings; on the other hand, the cycle of cytoplasm→cholesterol
  transfer protein (CETP)→high-density lipoprotein (HDL)→liver decreases, and the
  ability to exocytosis of cholesterol decreases, resulting in the occurrence of a
  corneo-scleral at yellowish-white lesions, foamy macrophage aggregates at the cornea,
  and corneal clouding. Together, these pathways contribute to the development and
  progression of corneal lesions. Created in BioRender. 1, 1. (2025) https://BioRender.com/rtkqkrf
