caption: Ground and excited-state energies determined using nonorthogonal state interaction
  (NOSI) of MSDFT for the TMPZ(D)-A-R• radical complex along an interpolated pathway
  from the D2/D3 minimum energy crossing intersection (frame 1) to the D0/D1 crossing
  point (frame100). Solvation-corrected ion-pair states are displayed in grey-colored
  dash curves, which are lower in energy than valence excitations. States are labeled
  according to those in methanol solvent in the work of Song,14 although the order
  in the figure legend is placed in the order for the complex at the frame 1 geometry
  in the gas phase. State D3 (black) and Q2 (maroon, behind) are local excitations
  of MPTZ, D*-AR•, depicted in Fig. 2. States D4 and D5 are transitions, respectively,
  from the highest doubly occupied (H) to the singly occupied orbital (S) and from
  S to the lowest unoccupied orbital (L) of the radical A-R•* in the presence of TMPZ
  ground state
