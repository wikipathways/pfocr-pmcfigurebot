figure_title: The vicious cycle of environmental insults, enteric dysfunction, and
  visceral hypersensitivity.
caption: The vicious cycle of environmental insults, enteric dysfunction, and visceral
  hypersensitivity. (Upper panel) A neural pathway involving the splanchnic nerves
  and sympathetic chain, which respond to environmental insults, triggers nociceptive
  signaling. These signals are relayed through the DRG and spinoreticular tract, further
  exacerbating the stress response. (Lower panel) Enteric dysfunction is characterized
  by leaky gut syndrome, where compromised intestinal epithelial barrier integrity
  allows increased permeability to harmful molecules. This dysfunction amplifies systemic
  inflammation and sensitizes neural pathways, forming a feedback loop (vicious cycle)
  that perpetuates visceral hypersensitivity and chronic gut dysfunction
