figure_title: Major pathways of NMD activation on PTC-containing mRNAs for EJC-Dependent
  (left) and EJC-Independent NMD (right).
caption: Major pathways of NMD activation on PTC-containing mRNAs for EJC-Dependent
  (left) and EJC-Independent NMD (right). EJC-Dependent NMD is facilitated by Upf3
  associated with the exon junction complex (EJC), which helps to recruit Upf1 and
  Upf2 to the ribosome. Smg1/8/9 binds then binds to Upf1–3, inducing Upf1 hyperphosphorylation.
  Smg5/6/7 is then recruited to internally cleave the mRNA, eliciting decay through
  Xrn1 and the exosome. In EJC-Independent NMD, Upf1 somehow evaluates the location
  of the stop codon within the mRNA and recruits Upf2–3 to initiate decay. The decapping
  factors Dcp1/2 are then recruited to facilitate Xrn1-mediated mRNA decay
