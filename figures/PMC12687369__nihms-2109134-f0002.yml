figure_title: TTX-silenced C9-NRE i3Neurons show persistent synaptic transcript dysregulation
caption: (A) Volcano plot of differentially expressed genes (DEGs) in comparing TTX-silenced
  Control i3Neurons and TTX-silenced C9-NRE i3Neurons. For each experiment n = 3 biological
  replicates, m = 2 technical replicates. (B) Enriched Gene Ontology (GO) terms and
  KEGG pathways for genes upregulated in C9-NRE and Controls are plotted. (C) The
  log2 fold change of synaptic genes upregulated in C9-NRE i3Neurons is plotted. (D)
  Predicted transcription factor activity is based on differentially expressed genes
  downregulated in C9-NRE i3Neuron. (E) Venn diagram of upregulated synaptic genes
  in the comparison of Con UT vs. C9 UT and Con TTX vs. C9 TTX
