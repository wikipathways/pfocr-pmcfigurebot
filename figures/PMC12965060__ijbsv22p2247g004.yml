figure_title: Glutaminolysis metabolism promotes the growth of IDH1-mutant intrahepatic
  cholangiocarcinoma cells and the high expression of MYC.
caption: Glutaminolysis metabolism promotes the growth of IDH1-mutant intrahepatic
  cholangiocarcinoma cells and the high expression of MYC. A. Reactome enrichment
  analysis were performed for genes with significantly differential expression in
  pTKI-R132C compared with pTKI-wt obtained by RNA-seq. B. KEGG enrichment analysis
  were performed for genes with significantly differential expression in RBE compared
  with HuCCT1 obtained by RNA-seq. C. Heat maps showed differences in the expression
  of important promotion genes and inhibition genes involved in glutaminolysis signaling
  pathway between HuCCT1 and RBE cell lines. D. The expression difference of GLS2,
  GOT2, ASNS, GLUD2 and GCLC in HuCCT1 and RBE cells was verified by qRT-PCR. n=3.
  **, p < 0.01. ***, p < 0.001. E. The expression difference of GLS, GOT1 and ASNS
  in tumor tissues of CHOL (n=36) or LIHC (n=365) patients with IDH1/2 mutation was
  analyzed using the TIMER2.0 database. p-values were calculated using Wilcoxon rank-sum
  test. F. Diagram of the glutamine-related metabolic signaling pathways, with red
  representing genes up-regulated in RBE compared with HuCCT1. G. 2mM glutamine accelerated
  cell growth in RBE cells. Cell proliferation was examined using the CCK-8 assay.
  Cell number was normalized to day 0. p-values were calculated using the two-way
  ANOVA. n=5. ***, p < 0.001. H. The expression level of MYC in glutamine treated
  RBE was detected by western blot (top) and qRT-PCR (bottom). The expression level
  was normalized to day 0 in HuCCT1. MYC was higher expressed in the IDH1 mutation
  cell line and was accelerated in RBE cells during the late stage. n=5. ***, p <
  0.001
