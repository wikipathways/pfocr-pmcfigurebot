figure_title: Proposed mechanism of action of SA in RL95-2 EC cells and HESC normal
  cells.
caption: Proposed mechanism of action of SA in RL95-2 EC cells and HESC normal cells.
  SA inhibits the proliferation and migration of RL95-2 cells by activating caspase
  cascades, modulating Bcl-2 family proteins, causing cell cycle arrest via the upregulation
  of p21 and p27, suppressing MMP-2, -7, -9, and β-catenin, and inducing ROS accumulation
  and acute inflammation. In parallel, SA reduces LPS-induced oxidative stress and
  inflammation in HESC normal cells by activating the Nrf2 antioxidant pathway and
  downregulating NF-κB-mediated pro-inflammatory responses, highlighting its dual
  role in anticancer activity and cytoprotection. The black arrows indicate the direction
  of progression. The upward and downward red arrows represent upregulation and downregulation,
  respectively. The red diagonal slash denotes that the effect is mitigated
