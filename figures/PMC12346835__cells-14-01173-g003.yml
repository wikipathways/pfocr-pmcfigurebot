figure_title: Swertiamarin exerts multifaceted hepatoprotective effects by targeting
  key molecular pathways.
caption: 'Swertiamarin exerts multifaceted hepatoprotective effects by targeting key
  molecular pathways. (1) Antioxidant: SW activates the Nrf2/HO-1/NQO1 pathway to
  enhance antioxidant enzymes (SOD, CAT, GSH) and reduce oxidative stress markers
  (MDA, TBARS). It upregulates cytochrome P450 (CYPs) and bile transport proteins,
  promoting toxin metabolism and excretion. (2) Anti-inflammatory: SW suppresses the
  Nrf-2/NF-κB signaling pathway, thereby decreasing the release of pro-inflammatory
  cytokines (TNF-α, IL-6, IL-1β) and reducing the expression of inflammatory mediators
  (iNOS/NO/MPO). (3) Anti-fibrotic: SW inhibits the TGF-β1/α-SMA/CTGF signaling cascade,
  leading to reduced collagen deposition (collagen I/III) and Hyp levels, and blocks
  the RAS system (Ang II/AT1R) and ERK/c-jun signaling, thereby slowing the progression
  of hepatic fibrosis. (4) Anti-apoptotic: SW modulates the PI3K/Akt pathway to upregulate
  the anti-apoptotic protein Bcl-2 while downregulating pro-apoptotic factors (Bax/caspase-3).
  (5) Metabolic regulation: SW improves NAFLD via AMPK/PPAR-α/SREBP-1 and alleviates
  cholestasis by activating FXR, inhibiting NTCP/CYP27A1 and toxic bile acids (CDCA/DCA)'
