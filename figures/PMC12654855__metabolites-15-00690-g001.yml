figure_title: Origin and detoxification of MG.
caption: Origin and detoxification of MG. In the glycolytic pathway, fructose-1,6-bisphosphate
  (F1,6bisP) is cleaved to dihydroxyacetone phosphate (DHAP) and glyceraldehyde-3P
  (GA3P). Part of DHAP is spontaneously dephosphorylated and isomerized to methylglyoxal
  (MG). MG reacts with glutathione (GSH) to form hemithioacetal (HTA). HTA, in turn,
  in a reaction catalyzed by glyoxalase-1 (GLO-1), produces S-lactoyl-glutathione
  (SLG). SLG, in a reaction catalyzed by glyoxalase-2 (GLO-2), produces D-lactate
  and regenerates GSH. D-lactate is converted to pyruvate, delivering its electrons
  directly to the respiratory chain, in a reaction catalyzed by mitochondrial D-lactate
  dehydrogenase (mDLD). Note that oxidized glutathione (GSSG) can, spontaneously and
  through the action of GST (glutathione-S-transferase), glutathionylate -SH groups
  of proteins. SLG can also do this (as indicated by the dotted line), in a process
  catalyzed by GLO-2
