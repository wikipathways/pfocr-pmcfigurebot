figure_title: Alternate schemes for translational proofreading with a single energy-consuming
  step
caption: (A) General schematic, where each circle corresponds to a compound state
  containing no internal driven transitions. Red arrows represent the only energy-consuming
  steps in the system. (B) Example of more complex proofreading scheme, employed in
  Ref. [37–39] to describe experimental measurements of ribosomal translation. Shaded
  regions delineate coarse-graining to the compound states in (A). Rate constants
  (gray) from Ref. [38]. All rate constant units are in sec−1, except for the binding
  rate in μM−1s−1. (C) Plot of error f and energetic cost in terms of excess hydrolyses
  ⟨n⟩, for the realistic ribosomal translation model and parameters given in (B),
  with varying rejection rates. The rejection rate for the wrong pathway is set to
  krej,w=krej,ceΔ˜2, with the discrimination factor Δ˜2=7.5, and all other rates are
  kept constant throughout. Dashed lines indicate limits for error rate with slow
  and rapid rejection. (D). Plot of excess hydrolysis cost ⟨n⟩ versus the error rate
  f, for different values of the proofreading discrimination factor Δ˜2, using the
  realistic model and parameters from (B). Dashed line marks the plateau region ⟨n⟩≈ge-Δ˜1.
  Stars in (C) and (D) mark the specific measured parameters from Ref. [38]
