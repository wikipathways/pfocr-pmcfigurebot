figure_title: Distinct sensory logic of cholesterol evaluation in mammals and Drosophila.
caption: Distinct sensory logic of cholesterol evaluation in mammals and Drosophila.
  Mammals lack a dedicated cholesterol taste pathway, and cholesterol-related sensory
  effects are thought to arise mainly through receptor modulation and membrane-context
  effects that influence preference in a physiological-state-dependent manner. In
  Drosophila, cholesterol is detected directly by dedicated IR-based gustatory pathways
  in GRNs, producing labeled-line outputs in which high cholesterol is aversive, whereas
  low cholesterol is neutral. This figure summarizes the contrast between indirect
  modulatory sensing in mammals and direct gustatory coding in insects
