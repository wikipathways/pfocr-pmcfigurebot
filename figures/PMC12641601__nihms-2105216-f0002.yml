figure_title: PTPN12-deficient models exhibit downregulation of cell cycle and mitotic
  pathways
caption: (A) ssGSEA was performed on transformed p-values obtained by moderated 2-sample
  t-test of PTPN12-normal and -deficient models. Heatmap shows normalized enrichment
  scores (NES) of significant gene-sets (FDR <0.05) enriched in RNA-seq, proteome
  and phosphoproteome datasets. (B) PTM-SEA analysis based on phosphoproteomics shows
  significant (p-value <0.01) upregulation of PTPN12-regulated tyrosine kinase signatures
  (e.g. EGFR, MET, ABL1) and downregulation of signatures of mitotic kinases including
  PLK1, CDK1, CDK2, and AURKB. Normalized enrichment score (NES) of each kinase signature
  in PTPN12-deficient models relative to PTPN12-normal models is plotted on the x-axis,
  while −log10 transformed p-values of this enrichment are plotted on the y-axis.
  (C) Phosphotyrosine sites in PTPN12-regulated RTKs are hyperphosphorylated in PTPN12-deficient
  PDX models. Phosphoproteomic data was mined for phosphosites from RTKs that were
  previously shown to be regulated by PTPN1216. The abundances of phosphotyrosine
  peptides from these RTKs across all 14 PDX models are plotted in the heatmap, with
  red indicating high abundance peptides and blue representing low abundance peptides.
  (D) Proteins involved in cell cycle progression and mitosis are downregulated in
  PTPN12-deficient PDX models. Heatmap of normalized protein abundance of cell cycle-
  and mitosis-associated proteins plotted for PTPN12-deficient and PTPN12-normal models.
  (E) Heatmap of normalized abundance of the 20 most significantly downregulated phosphopeptide
  substrates of cell cycle- and mitosis-associated kinases (PLK1, CDK1, CDK2, or AURKB)
  enriched in the PTM-SEA. All phosphopeptides shown are significantly downregulated
  in PTPN12-deficient models
