caption: Bay 11-7082 is an inhibitor of the NF-κB signaling pathway and can restore
  testosterone production. (A) Bay 11-7082 inhibits the NF-κB signaling pathway (n
  = 3). (B) Bay 11-7082 restores the production of testosterone-related proteins (n
  = 3). (C–E) Immunofluorescence analyses of testosterone production-related proteins,
  which are rescued by the Bay 11-7082 inhibitor. (F) Co-IP analysis of the interaction
  between p65 and SF-1 in TM3 cells (n = 3). Statistical significance is denoted as
  * p < 0.05, ** p < 0.01, **** p < 0.0001
