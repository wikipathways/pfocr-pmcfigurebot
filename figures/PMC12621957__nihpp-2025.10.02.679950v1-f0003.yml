figure_title: vIL-6 and hIL-6 induce the JAK/STAT pathway
caption: (A) HEK293T cells were transfected with a vIL-6 expressing plasmid (or mock)
  and the ISRE Luciferase reporter. 24h later luminescence was measured on a Berthold
  luminometer. (B) HEK293T cells were transfected with a vIL-6 expressing plasmid
  (or mock) and 24h later, RNA was extracted and used to measure STAT3 or NF-kB RNA
  levels by RT-qPCR (left). Protein lysates were also collected to measure STAT3 protein
  levels (right). (C) iSLK.219 cells were transfected with the ISRE Luciferase reporter
  and collected at the indicated timepoints and luminescence was measured on a Berthold
  luminometer. (D) iSLK.219 cells left latent (LAT) or reactivated (LYT) for 24, 48
  and 72hrs were collected, total RNA was extracted and subjected to RT-qPCR to measure
  STAT3 and NF-κB expression levels. (E) iSLK.219 cells left latent (LAT) or reactivated
  (LYT) for 24, 48 and 72 hours. Cells were harvested, lysed, resolved on SDS-PAGE,
  and Western blotted with the indicated antibodies. All graphs represent the mean
  ± SEM with individual biological replicates represented as dots. Statistical significance
  was determined using student t test., ns., not significant, * p<0.05, ** p<0.01,
  *** p<0.001
article_title: Virally encoded interleukin-6 (vIL-6) coordinates with human IL-6 to
  modulate cytokine expression during KSHV infection
