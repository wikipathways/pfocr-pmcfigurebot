figure_title: Conceptual framework of artificial intelligence–driven hypertension
  management.
caption: 'Conceptual framework of artificial intelligence–driven hypertension management.
  Artificial intelligence integrates multimodal data sources, including electronic
  health records, wearable devices, and imaging, to enable risk detection and stratification
  in patients with or at risk for hypertension. When embedded within structured quality
  improvement frameworks in primary care settings, AI supports therapeutic intensification,
  care escalation, and referral pathways. Continuous performance monitoring and outcome
  evaluation facilitate prevention of hypertension-related end-organ damage (including
  heart failure, aortic disease, chronic kidney disease, and stroke) within a learning
  health system model characterized by iterative feedback and system-level improvement.
  The stages depicted in this framework are supported by empirical evidence at varying
  levels of maturity. Detection and screening algorithms have demonstrated AUCs exceeding
  0.80 in large EHR-based cohorts [7,8], while risk stratification models integrating
  multimodal data have shown improved discrimination over conventional scores across
  multi-ethnic populations [13,32]. Clinical decision support interventions embedded
  within primary care workflows have produced modest but measurable improvements in
  blood pressure control in randomized trials [23,36]. By contrast, the outcome monitoring
  and recalibration stages remain primarily aspirational, with prospective evidence
  linking AI-driven interventions to reductions in end-organ damage still limited.
  Created in BioRender. Magouliotis, D. (2026) https://BioRender.com/3dzc85i (accessed
  on 23 March 2026). Abbreviations: EHR = electronic health record; CDS = clinical
  decision support; HF = heart failure; CKD = chronic kidney disease; AI = artificial
  intelligence'
