figure_title: Management pathway for chronic kidney disease in patients with rheumatoid
  arthritis.
caption: Management pathway for chronic kidney disease in patients with rheumatoid
  arthritis. This figure illustrates a stepwise management strategy for CKD in patients
  with RA, integrating immunologic disease control with renoprotective interventions.
  Initial risk stratification is based on estimated glomerular filtration rate and
  albuminuria category. Rheumatology–nephrology co-management is recommended for patients
  with CKD stage G3b–G5 and/or persistent albuminuria of category A2 or higher albuminuria
  (uACR ≥ 30 mg/g). Acute kidney injury risk factors, including NSAID exposure, dehydration,
  infection, and combined renin–angiotensin system blockade, should be actively assessed.
  Diagnostic kidney biopsy should be considered in cases of persistent albuminuria,
  unexplained AKI, or progressive renal dysfunction. Vaccination against influenza,
  pneumococcus, and herpes zoster is recommended prior to initiation of biologic or
  JAK inhibitor therapy whenever feasible. RA, rheumatoid arthritis; CKD, chronic
  kidney disease; csDMARDs, conventional synthetic disease-modifying anti-rheumatic
  drugs; bDMARDs, biologic DMARDs; JAK, Janus kinase; RAASi, renin–angiotensin–aldosterone
  system inhibitors; SGLT2i, sodium-glucose cotransporter 2 inhibitors; GLP-1a, glucagon-like
  peptide-1 receptor agonists; MRA, mineralocorticoid receptor antagonists; ERA, endothelin
  receptor antagonists; NSAIDs, nonsteroidal anti-inflammatory drugs; PPIs, proton
  pump inhibitors
