figure_title: Characterization of spatial niches and their associated pathway activities
  in JIA synovium
caption: a, The central heatmap displays the percentage area of 30 spatial niches
  (columns) for each patient (rows). Patient samples are annotated by clinical features
  on the left. The bar plots above illustrate the proportional composition of cell
  clusters for each corresponding niche. Spatial niches are grouped by the major annotated
  niche clusters shown at the bottom. b, UMAP embedding of niches based on their immune-stromal
  cell composition. Each dot represents a niche and is colored by an annotated niche
  cluster. c, Heatmap showing normalized gene set enrichment scores for related pathways
  across the four annotated niche classes. d–e, Representative images of association
  between niche clusters and ANGIOGENESIS pathway. Spatial mapping of annotated niches
  (d) from a representative synovial tissue section and H&E staining (e). f, Spatial
  distribution of cell clusters in the zoom-in of the section in panel d. g, Left,
  spatial enrichment score of the ANGIOGENESIS pathway. Right, Corresponding DAPI
  and expression of representative genes of the pathway. h–i, Representative images
  of association between niche clusters and INTERFERON−GAMMA−RESPONSE pathway. Spatial
  mapping of annotated niches (h) from a representative synovial tissue section and
  H&E staining (i). j, Spatial distribution of cell clusters in the zoom-in of the
  section in panel h. k, Left, spatial enrichment score of the INTERFERON−GAMMA−RESPONSE
  pathway. Right, Corresponding DAPI and expression of representative genes of the
  pathway
article_title: Subcellular spatial transcriptomics reveals immune–stromal crosstalk
  within the synovium of patients with juvenile idiopathic arthritis
