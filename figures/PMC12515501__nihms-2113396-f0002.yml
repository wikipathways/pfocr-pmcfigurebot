figure_title: DNA damage sensing by the innate immune system amplifies type I IFN
  signaling and exacerbates tau-mediated neurodegeneration
caption: Type I IFN (blue spheres) are elevated in aging and tauopathy brains. (1)
  Microglia (red) are highly responsive to these signals, resulting in increased ISG
  expression and microgliosis. Type I IFN signaling also suppresses the transcription
  factor MEF2C, which normally restrains microglial activation and supports neuronal
  resilience. (2) In neurons (gray), tau aggregates induce mitochondrial and nuclear
  damage, leading to the cytosolic release of double-stranded DNA (dsDNA). This DNA
  is sensed by cGAS, activating the STING pathway and triggering further type I IFN
  production and MEF2C inhibition. Tau aggregates also engage PQBP1, which independently
  activates the same cGAS-STING inflammatory cascade. The combined effects of enhanced
  microglial activation and loss of neuronal protective mechanisms promote exacerbated
  tau pathology and neuronal degeneration
article_title: Emerging roles for innate and adaptive immunity in tauopathies
