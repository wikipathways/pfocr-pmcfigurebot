figure_title: NEDD4L limits pro-fibrotic macrophage polarization via inhibiting SMAD3
  phosphorylation.
caption: 'NEDD4L limits pro-fibrotic macrophage polarization via inhibiting SMAD3
  phosphorylation. (A) Protein interaction network analysis (https://cn.string-db.org).
  (B) Structural prediction of the interaction between NEDD4L and phosphorylated SMAD3
  protein (https://www.rcsb.org/). (C) BMDMs isolated from Nedd4lf/f and Nedd4lΔMye
  mice were stimulated with M-CSF (20 ng/ml) for 7 days, and then stimulated with
  10 ng/ml TGF-β1. Western blot analysis of TGF-β1 signal pathway. β-actin was used
  as a loading control. (D) Representative images of p-Smad3 staining (Scale bar:
  50 μm) from oil-treated, CCl4- treated and CDAHFD-fed Nedd4lf/f and Nedd4lΔMye mice
  are shown. The number of positive cells was quantified. (E) Representative images
  of p-Smad3 and IBA1 (Scale bar: 50 μm) double staining of liver tissue sections
  from CCl4-treatedand CDAHFD-fed Nedd4lf/f and Nedd4lΔMye mice are shown. The number
  of positive cells was quantified. (F) Schematic diagram of experimental design.
  BMDMs isolated from C57BL/6J mice were differentiated with M-CSF (20 ng/ml, 7 days)
  prior to a 24-hour stimulation with TGF-β1 (10 ng/ml), with or without SIS3 (5 μM).
  Conditional BMDM medium were co-cultured with LX-2 cells. (G) The expression of
  fibrogenic genes were analyzed by RT-qPCR in LX-2 cells after culture with conditional
  medium from BMDMs. (H) Schematic diagram of experimental design. BMDMs isolated
  from Nedd4lf/f and Nedd4lΔMye mice were differentiated with M-CSF (20 ng/ml, 7 days)
  prior to a 24-hour stimulation with TGF-β1 (10 ng/ml), with or without SIS3 (5 μM).
  (I) The expression of pro-fibrotic genes was analyzed by RT-qPCR in BMDMs after
  culture with different conditional medium. Values represent mean ± SEM. *p< 0.05,
  ***p < 0.001'
