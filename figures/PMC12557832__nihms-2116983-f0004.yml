figure_title: 'Ingenuity pathway analysis (IPA): A.'
caption: 'Ingenuity pathway analysis (IPA): A. A. Bar chart of significant diseases
  and disorders observed in cord blood (CB) samples. The Y-axis represents −log (P-value),
  with a threshold value of 1.5. Diseases and disorders marked within the red box
  indicate findings similar to those reported in our previous cohort from the 45-month
  study group (Mondal et al., 2022). B. Network of Autophagy (predicted activation).
  C. Network of cell proliferation in carcinoma cell lines (predicted activation).
  D. Network of Endocytosis (predicted activation). The construction of the network
  relied on information stored in the Ingenuity Pathways Knowledge Base (IPKB), along
  with actual expression data. Connections between differentially expressed genes
  were analyzed, focusing on those exhibiting a fold change of ≥ 1.5 and p-value <
  0.05. Genes that are upregulated are represented by geometric figures in red, while
  downregulated genes are depicted in green. The intensity of the red and green colors
  reflects the degree of up- or downregulation, respectively, in the expression dataset'
