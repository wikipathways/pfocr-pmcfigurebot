figure_title: When miR-412-5p is underexpressed, Xpo1 is upregulated, which results
  in the excessive exporting of p53 and FOXO from the nucleus.
caption: When miR-412-5p is underexpressed, Xpo1 is upregulated, which results in
  the excessive exporting of p53 and FOXO from the nucleus. The lack of p53 and FOXO
  in the nucleus reduces the expression of SHC genes—p46SHC, p52SHC, and p66SHC, which
  inhibits the p53–p66SHC–p16 pathway. This leads to uncontrolled proliferation and
  angiogenesis, contributing to the formation of pathological hemorrhoids (Xpo1—Exportin-1,
  p53—tumor suppressor protein, FOXO—Forkhead box O transcription factor, SHC—Src
  homology 2 domain-containing (p46SHC, p52SHC, p66SHC), p16—cyclin-dependent kinase
  inhibitor involved in cell cycle arrest). Created in BioRender. Mazurek, M. (2025)
  https://BioRender.com/c8w1axi
