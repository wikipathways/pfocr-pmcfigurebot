figure_title: Relieving autoinhibition of the Mtw1 subcomplex with dsn1–2D also alleviates
  Mif2 autoinhibition
caption: (A) Percentages of CEN3 DNAs with colocalized Mif2-GFP after assembly in
  DSN1 (SBY22094, data replotted from Figure 2A) or dsn1–2D lysates (SBY22092, data
  replotted from Figure 4G).(B) Percentages of CEN3 DNAs with colocalized Mif2-GFP
  after assembly in lysates made from a dsn1-AID strain (SBY22872) treated with auxin
  to deplete the Dsn1-AID protein, or with DMSO as a control.(C) Schematics illustrating
  Mif2 autoinhibition. (i) Mif2 autoinhibition (closed) is relieved by binding to
  Cse4 (left pathway), making Mif2-N available (open) for binding to Mtw1c. Mif2 autoinhibition
  can also be relieved by binding to Mtw1c (right pathway), making Mif2 available
  for Cse4 binding (open). (ii and iii) Deleting the N-terminus of Mif2 (Mif2-ΔN,
  ii) or replacing it with an N-terminal fragment of Ame1 (Mif2Ame1N, iii) can relieve
  Mif2 autoinhibition. When the Ame1 N-terminus is grafted onto Mif2, it also restores
  binding to Mtw1c.(D) Percentages of CEN3 DNAs with colocalized wild type Mif2-GFP
  or colocalized truncation mutant Mif2-ΔN-GFP after assembly in either DSN1 or dsn1–2D
  lysates (from strains SBY22094, SBY23248, SBY22092, and SBY23250). Data from strains
  with wild type Mif2-GFP are replotted from Figures 1C and 4G.(E) Percentages of
  CEN3 DNA with colocalized wild type Mif2-GFP or colocalized swap mutant Mif2Ame1N-GFP
  after assembly in either DSN1 or dsn1–2D lysates (from strains SBY22094, SBY23252,
  SBY22092, and SBY23254). Data from strains with wild type Mif2-GFP are replotted
  from Figures 1C and 4G.All error bars represent the standard deviation over three
  biological repeats. At least 3,000 DNA molecules were imaged for each time point
  from each biological replicate
article_title: Direct observation of interdependent and hierarchical kinetochore assembly
  on individual centromeres
