figure_title: Astrogliosis is blunted with ZBP1 deficiency in PS19 mice.
caption: Astrogliosis is blunted with ZBP1 deficiency in PS19 mice. (A) Representative
  coronal hippocampal sections from 9-month-old PS19 and PZKO mice stained for DAPI
  (blue) and GFAP (white; scale bar = 200 µm). (B) Representative images of GFAP (white)
  in CA1, CA2, CA3, and DG (scale bar = 40 µm). (C–F) Quantification of GFAP+ area
  coverage per FOV in CA1, CA2, CA3, and DG. (G) snRNA-seq UMAP highlighting the astrocyte
  cluster with canonical markers. (H) Volcano plot depicting differential gene expression
  between PZKO astrocytes and PS19 astrocytes. (I) Reactome Pathway Database terms
  enriched in downregulated DEGs in PZKO astrocytes. Plot shows the top significantly
  enriched terms, ranked by ascending adjusted p-value. (J) GO Biological Process
  Database terms most significantly enriched in downregulated DEGs in PZKO astrocytes.
  Plot shows the top significantly enriched terms, ranked by ascending adjusted p-value.
  Statistical significance between experimental groups was calculated by linear mixed
  effects modeling. * p < 0.05, ** p < 0.01
