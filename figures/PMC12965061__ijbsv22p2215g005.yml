figure_title: Triptonide induces autophagic cell death by downregulating the JAK/STAT3
  signaling pathway.
caption: Triptonide induces autophagic cell death by downregulating the JAK/STAT3
  signaling pathway. (A) Differential gene expression analysis (|log2FC| > 1, adjusted
  P < 0.05) in shRNA control and PTGS2-knockdown SUM-159PT cells. (B) GSEA of downregulated
  genes in shRNA control and PTGS2-knockdown SUM-159PT cells. (C-D) Western blot analysis
  of KRAS/ERK signaling (C) and STAT3/c-Myc signaling (D) in SUM-159PT, MDA-MB-231,
  and SKOV3 cells after TN (40 nM, 72 h) treatment. (E) MYC mRNA quantification by
  qPCR in TN-exposed SUM-159PT, MDA-MB-231, and SKOV3 cells. (F) GSEA of HALLMARK_IL6_JAK_STAT3_
  SIGNALING and KEGG_JAK_STAT_SIGNALING pathways in shRNA control and PTGS2-knockdown
  SUM-159PT cells. (G) After TN pretreatment (40 nM, 12 h), SUM-159PT, MDA-MB-231,
  and SKOV3 cells were exposed to TG101209 (1 or 2 µM, 24 h), and viability was measured
  using the CCK-8 method. (H) Cytotoxic effect of TN in SUM-159PT, MDA-MB-231, and
  SKOV3 cells after addition of ML115 (10 µM). (I) Changes in p62 and LC3-II protein
  levels in SUM-159PT and SKOV3 cells after TN and ML115 treatment, detected by western
  blot. (J) Apoptosis in SUM-159PT and SKOV3 cells after TN and ML115 treatment, assessed
  by flow cytometry. Data are expressed as mean ± SD, with statistical significance
  assessed by two-way ANOVA, or Student's t-test; *P < 0.05, **P < 0.01, ***P < 0.001
