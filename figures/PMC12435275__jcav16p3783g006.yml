figure_title: Circ_0012586/miR-200b-5p/MFAP5 pathway was randomly chosen to verify
  the feasibility of the constructed circRNA-miRNA-mRNA network.
caption: Circ_0012586/miR-200b-5p/MFAP5 pathway was randomly chosen to verify the
  feasibility of the constructed circRNA-miRNA-mRNA network. The mRNA expression levels
  of circ_0012586 (A), miR-200b-5p (B), and MFAP5 (C) were examined by the qRT-PCR
  in highly metastatic OS cells and the controlled. The protein expression level of
  MFAP5 (D) was examined by the WB in highly metastatic OS cells and the control.
  The mRNA expression levels of circ_0012586 (E), miR- 200b-5p (F), and MFAP5 (G)
  were examined by the qRT-PCR in the paired primary and lung-metastasis OS tissues.
  (H-I) The correlation between circ_0012586 and miR-200b-5p as well as miR-200b-5p
  and MFAP5 in OS tissues was shown. (J-K) The qRT-PCR analysis of the effect on knockdown
  of circ_0012586 expression by siRNA in the 143B and MG63.2 cell lines was shown.
  (L) The qRT-PCR analysis of the effect on mimics or inhibitors of miR-200b-5p in
  the 143B cells. (M-N) Cell viability, migration, and invasion of OS cells were regulated
  by circ_0012586 and miR-200b-5p. (O) LRAT expression was regulated by the circ_0012586
  and miR-200b-5p. (P) Luciferase activity assay showed that circ_0012586 could combine
  with miR-200b-5p in the 293T cells. (Q) Luciferase activity assay showed that miR-200b-5p
  could combine with 3'UTR of MFAP5 mRNA in the 293T cells
