caption: 'Knockdown of POU5F1 inhibited the AMPK/mTOR signaling pathway in BMSCs induced
  by collagen hydrogel. (A) Immunofluorescence staining for p-AMPK. (B) Semi-quantification
  analysis of p-AMPK shown in (A). (C) Immunofluorescence staining for AMPK. (D) Semi-quantification
  analysis of AMPK shown in (C). (E) Western blot analysis detected protein levels
  of AMPK and p-AMPK. (F) Semi-quantification analysis of p-AMPK/AMPK shown in (E).
  (G) Immunofluorescence staining for p-mTOR. (H) Semi-quantification analysis of
  p-mTOR shown in (G). (I) Immunofluorescence staining for T-mTOR. (J) Semi-quantification
  analysis of T-mTOR shown in (I). (K) Western blot analysis detected protein levels
  of p-mTOR and T-mTOR. (L) Semi-quantification analysis of p-mTOR/T-mTOR shown in
  (K) (Scale bars: 200 μm; Mean ± SD, n = 3; *p < 0.05, **p < 0.01, ***p < 0.001 vs.
  Col+shNC; #p < 0.05, ###p < 0.01 for intergroup comparisons)'
