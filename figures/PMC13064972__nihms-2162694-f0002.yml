figure_title: Alternative antiviral sensing and signaling pathways in neurons.
caption: Alternative antiviral sensing and signaling pathways in neurons. (1) Double-stranded
  host RNA is enriched in neurons by the ELAVL family of proteins (HuB/C/D) and is
  further modified by ADAR1, resulting in the constitutive expression of low levels
  of type I IFN. (2) Upon sensing WNV RNA, RIG-I is activated through caspase-12-driven
  TRIM25-mediated ubiquitination, leading to expression of type I IFNs. (3). A noncanonical
  cGAS–STING signaling pathway contributes to TAU phosphorylation, which reduces expression
  of HSV-1 ICP27, a protein required for HSV-1 replication. (4) HSV-1 entry into neurons
  can be inhibited by the neuron-specific antiviral factor TMEFF1, which blocks HSV-1
  gD binding to Nectin-1 and gB binding to NMHC-IIA/B. (5) ZBP1 detects ZIKV Z-RNA,
  activating RIPK1 and RIPK3 and upregulating ACOD1. ACOD1 induces itaconate production,
  which inhibits SDH, an enzyme that generates metabolites necessary for ZIKV replication.
  (6) Type I IFN signaling promotes colocalization of α-synuclein with STAT-2, enhancing
  ISG induction
