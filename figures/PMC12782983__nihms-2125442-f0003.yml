figure_title: Bone marrow plasma quantitative proteomics in AL amyloidosis patients
  and healthy individuals
caption: |-
  A. Volcano plot showing significantly proteins enriched (right side, red) or depleted (left side, blue) in bone marrow plasma of AL amyloidosis patients as compared to healthy donors. Raw data available in Supplementary table 3
  B. Hallmark pathway analysis showing significantly enriched pathways (green bars) in AL amyloidosis patients as compared to healthy donors. Adjusted p value <0.005. Black arrows point at enrichment in TNF α and inflammatory pathways. Red arrow points at enrichment in complement proteins C. CD276 levels in the plasma of healthy donors (HD) versus AL amyloidosis patients (AL) as measured by Luminex technology. P value: 0.01. Raw data are shown in Supplemental table 4. D. Reactome pathway analysis showing significantly enriched pathways (blue bars) in AL amyloidosis patients as compared to healthy donors. Adjusted p value <0.005. Arrows point at pathways involved in phagocytosis and protein organization/remodeling
article_title: Single cell and clonal analysis of AL amyloidosis plasma cells and
