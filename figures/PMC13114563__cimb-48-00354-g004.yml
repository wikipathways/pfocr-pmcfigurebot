caption: 'Identification of molecular subtypes via consensus clustering. (A) Consensus
  clustering analysis determining two stable clusters (k = 2). (B) Kaplan–Meier survival
  curves for Subtype A versus Subtype B; the log-rank test was used to assess statistical
  significance. (C) Heatmap of ssGSEA scores comparing pathway enrichment profiles
  between the two subtypes. Statistical significance is denoted as follows: “***”,
  “**” and “*” denote p-values of ≤0.001, 0.01, and 0.05. Differences were compared
  using the Wilcoxon rank-sum test'
