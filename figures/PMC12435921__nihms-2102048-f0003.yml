figure_title: Impact of secretory stimuli on ISG density and insulin to proinsulin
  ratio
caption: '(A) Central figure shows the mechanism of action and the cellular signaling
  pathways that are activated by the different classes of secretory stimuli. Representative
  whole cell 3D models generated from SXT tomograms of cells treated with: Glimepiride
  (Yellow), GKA-50 (Green), Glucose (Red), GIP (cyan), Ex-4 (Blue), and TAK-875 (Purple)
  (B) Comparison of insulin secreted upon stimulation using ELISA shows increased
  secretion levels upon stimulation. (n = 8 biological replicates) (C) Mean Insulin
  label field LAC value comparison shows distinct effects of the stimuli on label
  field ISG density (n = 5 to 7 cells) (D-E) Ratio of Insulin to Proinsulin (I:P)
  upon stimulation: (D) secreted ratio (n = 4 biological replicates) (E) intracellular
  ratio (n = 11 biological replicates). Error bars in all panels represent SDs. *p<0.05;
  **p<0.01: ***p<0.001; ****p<0.0001 as calculated by a One-way ANOVA with Bonferroni’s
  correction in all panels'
article_title: Secretory stimuli distinctly regulate insulin secretory granule maturation
  through structural remodeling
