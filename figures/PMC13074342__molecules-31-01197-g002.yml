figure_title: Photocatalytic detoxification pathway of the organophosphate profenofos
  on Ag-modified TiO2.
caption: Photocatalytic detoxification pathway of the organophosphate profenofos on
  Ag-modified TiO2. Schematic representation of adsorption and reduction of Ag+ on
  TiO2, followed by UV and visible light activation, leading to bond cleavage in profenofos.
  The process yields bromo-chlorophenol, classified as non-toxic, and propyl mercaptan,
  which undergoes dimerization to dipropyl disulfide, demonstrating conversion of
  a toxic pesticide into less harmful products. Bromo-chlorophenol is considered less
  toxic than profenofos due to the absence of organophosphate functional groups responsible
  for acute toxicity. Reprinted with permission from the Journal of Physical Chemistry
  A
