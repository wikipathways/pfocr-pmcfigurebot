figure_title: Transcriptomic analysis of MDA-MB-231 cells following dasatinib treatment.
caption: Transcriptomic analysis of MDA-MB-231 cells following dasatinib treatment.
  (A) Venn diagram of differentially expressed genes (DEGs; p < 0.05) in MDA-MB-231
  cells treated with 100 nM dasatinib for 6, 12, 24, and 48 h, compared to untreated
  controls (0 h). (B) Overlap of DEGs (n = 554) at four time points and genes associated
  with the extracellular matrix (ECM) pathway (GO:0030198). (C) Heatmap showing expression
  profiles of 22 ECM-related genes in MDA-MB-231 cells treated with 100 nM dasatinib
  across four time points. (D) Protein–protein interaction network illustrating the
  association between SRC and the 22 ECM-related genes. (E) Top 20 commonly upregulated
  Gene Ontology (GO) pathways across four time points under dasatinib treatment. (F)
  Top 20 commonly downregulated GO pathways across four time points under dasatinib
  treatment. (G) Correlation between dasatinib sensitivity (log IC50 [µM]) and ETS1
  expression (nTPM) across 36 human breast cancer cell lines from the GDSC2 database.
  Each dot represents one cell line. Correlation was assessed using the Pearson correlation
  in GraphPad Prism. (H) Correlation between dasatinib sensitivity (log IC50 [µM])
  and ETS1 mRNA expression measured by qPCR across 10 in-house breast cancer cell
  lines. (I) Correlation between dasatinib sensitivity (log IC50 [µM]) and ETS1 expression
  (nTPM) across 76 human organoids. Each dot represents one organoid. Correlation
  was assessed using the Pearson correlation coefficient. (J) Correlation between
  MMP3 and ETS1 mRNA expression in breast cancer (BRCA) samples (n = 1226) from The
  Cancer Genome Atlas (TCGA) database. Correlation was assessed using the Pearson
  correlation coefficient
