figure_title: Analysis of putative Planktothrix spp.
caption: 'Analysis of putative Planktothrix spp. community genera-level gene enrichment
  and relative abundance. (A) Gene set enrichment analysis of all genes taxonomically
  annotated as Planktothrix spp. (n = 5,589) across all depths and time. Results are
  categorized by KEGG mapper metabolic pathways (n = 10) which are subsequently plotted
  by gene ratio and significance. Pathways of interest are indicated in hot pink font.
  (B) Schematic of the agrE/Z-mediated arginine catabolic pathway and OAC as identified
  in select cyanobacteria adapted from Zhang et al. (2018) and Zhang and Yang (2019).
  Genes that were confirmed present in the Meads Quarry coassembly are indicated in
  dark pink circles. Metabolite reactants and products catalyzed by each gene are
  shown, with metabolites significantly enriched at 2.0 m depth in red font, those
  not detected (or not assessed for) in light grey font. We note PEP was detected
  but not significantly enriched at 2.0 m depth: PEP = Phosphoenolpyruvate, AKG =
  Alpha-ketoglutarate'
