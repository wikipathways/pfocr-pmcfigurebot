figure_title: A ketogenic diet modulates intratumoral metabolism in GBM
caption: Global metabolic proling was performed on MES83 tumors extracted from mice
  fed a standard diet (SD; n=7) or KD (n=7) and visualized by (A) PLS-DA score plot
  and (B) hierarchical clustering. (C) Significantly altered metabolites (p ≤ 0.05;
  Wilcoxon rank-sum test) in KD fed mice were classified into major metabolic categories
  and the differential abundance (DA) scores of each pathway plotted. Metabolic categories
  having more than three metabolites were used in the DA plot. Size of the bubbles
  are relative to the number of metabolites in each category. (D)Identified fatty
  acids for indicated metabolic categories (phosphatidylcholines [PC], sphingomyelins
  [SM], triacylglycerides [TG]) were classified as saturated or unsaturated fatty
  acids based on fatty acid chain
article_title: Enhanced lipid metabolism serves as a metabolic vulnerability to a
  polyunsaturated fatty acid (PUFA)-rich diet in glioblastoma
