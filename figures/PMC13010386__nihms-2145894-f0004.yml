figure_title: Immune checkpoints in Alzheimer disease (AD)
caption: 'a, Several AD risk genes modulate the immune suppression mediated by myeloid-derived
  suppressor cells (MDSCs) that is observed in cancer biology. Several of these genes
  were reported to promote myeloid cell transition to MDSCs197,201,207,213,215,217,218,221,222,234,263,264,283,347–349,
  while others were associated with inhibition of MDSCs191,193,283. In addition, several
  cytokines that are altered in AD can modify MDSCs: interferon-γ (IFN-γ) reduces
  MDSCs193, while interleukin-34 (IL-34) increases CD163-expressing MDSCs195. The
  downstream effects of AD risk genes in MDSCs include checkpoint upregulation (programmed
  cell death protein 1 (PD-1) or TIM3 (also known as HAVCR2)) in MDSCs, neutrophils
  or dendritic cells (DC)191,199,207,221,264,348,350, metabolic alterations (such
  as reduced glucose metabolism, which has been linked with increased formation of
  regulatory T cells (Tregs)137,151,154,213,223, and increased immunosuppressive cytokine
  secretions (including interleukin-10 (IL-10) or transforming growth factor-β (TGF-β))
  in MDSCs, which can prevent T cell activation207,214,218,351. b, Elevated levels
  of programmed cell death protein 1 (PD-1) and cytotoxic T-lymphocyte protein 4 (CTLA-4)
  in aging and AD drive T cell exhaustion225; Antibody-mediated blockade of PD-1 or
  its ligand, PD-L1 (not shown), restored IFNγ-driven Aβ clearance by monocyte-derived
  macrophages in 5xFAD mice and promoted T cells to convert into active effector T
  cells57. Follow-up studies however reported opposite effects of targeting PD-1 in
  AD mice226 and/or no changes in monocyte recruitment to the CNS or improvement of
  Aβ-plaque pathology227,228. c, CD33 variants linked to AD risk impair Aβ clearance;
  The CD33M long isotype deletion increases pathology and impairs cognition, while
  the CD33m short isoform enhances Aβ compaction243,244. Using liposomes or antibodies
  to target CD33 offer therapeutic potential by removing the blocking of INPP5D (downstream
  of CD33) on the TREM2 pathway and thereby promoting Aβ degradation245. d, Expression
  of TIM3, which signals via TGFβ, on mature microglia inhibits Aβ clearance, positioning
  TIM3 as a promising target for microglial activation in AD53'
