figure_title: Gene Set Enrichment Analysis (GSEA) and gene expression heatmap of key
  pathways in TCA cycle and amino acid metabolism.
caption: 'Gene Set Enrichment Analysis (GSEA) and gene expression heatmap of key pathways
  in TCA cycle and amino acid metabolism. (A) (left panel) GSEA of TCA cycle pathway
  in csrA mutant compared to wildtype. Normalized enrichment score (NES) and false
  discovery rate (FDR) are indicated. Significant enrichment (FDR = 0.05) suggests
  altered TCA cycle activity in csrA mutant. (right panel) Heatmap of gene expression
  levels for key genes involved in TCA cycle. (B) GSEA of valine, leucine, and isoleucine
  degradation pathway in csrA mutant compared to wildtype (FDR < 0.05) and heatmap
  of gene expression levels for key genes involved in this pathway. (C) GSEA of arginine
  and proline metabolism pathway in csrA mutant compared to wildtype (FDR = 0.05)
  and heatmap of gene expression levels for key genes involved in this pathway. (D)
  GSEA of lysine biosynthesis pathway in csrA mutant compared to wildtype (FDR = 0.05)
  and heatmap of gene expression levels for key genes involved in this pathway. (E)
  GSEA of phenylalanine, tryosine, and tryptophan biosynthesis pathway in csrA mutant
  compared to wildtype (FDR, = 0.05) and heatmap of gene expression levels for key
  genes involved in this pathway. (F) GSEA of cysteine and methionine metabolism pathway
  in csrA mutant compared to wildtype (FDR = 0.05) and heatmap of gene expression
  levels for key genes involved in this pathway. Rows represent genes, and columns
  represent samples. Expression levels are normalized and color-coded (red: upregulation;
  blue: downregulation). Data are derived from RNA-seq analysis (n = 3)'
