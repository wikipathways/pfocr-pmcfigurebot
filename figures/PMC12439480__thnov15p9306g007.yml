figure_title: mTOR inhibition increases [177Lu]Lu-DOTA-CCK2R-dimer-induced oxidative
  stress by suppressing glutathione metabolism.
caption: 'mTOR inhibition increases [177Lu]Lu-DOTA-CCK2R-dimer-induced oxidative stress
  by suppressing glutathione metabolism. (A) Violin plots depicting the expression
  levels of glutathione metabolism-related genes across different treatment groups
  (Veh, mTOR, Lu, and Combo) on the basis of the scRNA-seq data. The Lu group exhibited
  significant activation of glutathione metabolism, whereas the mTOR group presented
  significant suppression of this pathway. (B) Flow cytometry analysis of intracellular
  reactive oxygen species (ROS) levels in AR42J cells treated with [177Lu]Lu-DOTA-CCK2R-dimer
  (Lu), the mTOR inhibitor (mTOR), combination therapy (Combo), or vehicle (Veh).
  The results revealed a discernible increase in ROS levels in both the Lu-treated
  and combination therapy groups relative to the vehicle control and mTOR inhibitor
  groups, suggesting that oxidative stress was activated under these treatment conditions.
  (C) Gene set enrichment analysis (GSEA) of glutathione metabolism and cytochrome
  P450-mediated xenobiotic detoxification pathways in the Lu and mTOR treatment groups.
  The Lu group presented activation of these detoxification pathways, whereas the
  mTOR group presented significant suppression of these pathways. (D) Venn diagram
  illustrating the overlap of differentially expressed genes (DEGs) involved in glutathione
  metabolism in the Lu vs. Veh, mTOR vs. Veh, and Combo vs. Veh comparisons. GSTK1,
  GPX1, and GPX2 were identified as key regulatory genes within this pathway. (E)
  Kaplan‒Meier survival analysis of the TCGA pancreatic cancer (PAAD) dataset. Patients
  with high GSTK1 expression presented significantly shorter overall survival (OS)
  than did those with low GSTK1 expression (p = 0.027). (F) Western blot analysis
  of GSTK1 expression in AR42J cells following Lu, mTOR, Combo, or Veh treatment.
  GSTK1 was upregulated in the Lu group but downregulated in the mTOR and Combo groups,
  which is consistent with the RNA-seq results. (G) Immunohistochemical (IHC) staining
  of GSTK1 in tumor tissues from the Veh, Lu, mTOR, and Combo treatment groups. GSTK1
  expression was notably higher in the Lu group but lower in the mTOR and Combo groups.
  Scale bars: upper panels, 100 µm; lower panels, 50 µm. (H) Immunofluorescence (IF)
  staining of γ-H2AX in tumor sections from different treatment groups. The γ-H2AX
  signal was strongest in the Combo group, indicating the greatest DNA damage. Scale
  bar: 100 µm'
