figure_title: Effects of simvastatin treatment on the SLOS proteome
caption: 'Volcano plots representing proteome analysis in SLOS individuals with simvastatin
  treatment (SLOS+Simvastatin) compared to controls (A) or to SLOS individuals without
  simvastatin treatment (SLOS-Simvastatin) (B). Differential proteins were used for
  Venn Diagram plotting (C) comparing SLOS without simvastatin treatment (SLOS-Simvastatin)
  and controls and SLOS with simvastatin treatment (SLOS+Simvastatin) and controls.
  Forty-eight differential proteins exclusively belonging to SLOS+Simvastatin were
  used to conduct the STRING network analysis (D), exhibiting affected pathways by
  simvastatin treatment, including the “Regulation of cell migration,” “Secretory
  granule membrane,” and “Cholesterol metabolism.” Courtesy: Oliveros, J.C. (200-2015)
  Venny. An interactive tool for comparing lists with Venn’s diagrams. Publicly available
