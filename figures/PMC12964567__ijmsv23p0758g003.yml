figure_title: MSC therapy reversed the TBI-induced reduced full retina, reduced GCC
  thickness, and reduced GCN counts in both OD and OS of the ipsilesional and contralesional
  retinas in rats.
caption: MSC therapy reversed the TBI-induced reduced full retina, reduced GCC thickness,
  and reduced GCN counts in both OD and OS of the ipsilesional and contralesional
  retinas in rats. (A) Schematic representation of the damaged brain region and correspondence
  visual pathway in the rat. (B) Representative HE-staining image of panoramic eye
  globe slice of Sham+Veh rat. In each eye, four nasal side areas (N1-N4) and four
  temporal side areas (T1-T4) were selected to quantify. (C) The HE-stained brain
  section denotes the LFP-induced brain lesion side (ipsilateral) and contralateral
  side. (D) Representative light microscopic images of H&E staining for a Sham+Veh,
  a Sham+MSC, a TBI+Veh, and a TBI+MSC rat at D35 after surgery. All images were obtained
  at 400× magnification. Scale bar = 50 µm. The full retinal and GCC thickness and
  ganglion cell nucleus (GCN) number in N1-N4 and T1-T4 of oculus dexter (OD, right
  eye) and oculus sinister (OS, left eye) in the (E) ipsilesional retinas and (F)
  contralesional retinas were quantified, respectively. Data were obtained from 6
  animals in each group and expressed as mean±SD. NFL/GCL, nerve fiber layer, and
  ganglion cell layer; GCC, ganglion cell complex; IPL, inner plexiform layer; INL,
  inner nuclear layer; OPL, outer plexiform layer; ONL, outer nuclear layer; IS/OS,
  photoreceptor inner segment/outer segment; RPE, retinal pigment epithelium
