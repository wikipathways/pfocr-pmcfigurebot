figure_title: Burn-injury-induced mitophagy.
caption: Burn-injury-induced mitophagy. Burn injury induces mitochondrial damage and
  fragmentation, resulting in mitochondrial fission and the segregation of dysfunctional
  mitochondrial segments. Damaged mitochondria are subsequently targeted for mitophagy
  through both receptor-mediated pathways and the PINK1/Parkin ubiquitin pathway.
  In this process, mitophagy receptors and adaptor proteins facilitate recruitment
  of LC3-positive phagophore membranes around injured mitochondria, promoting their
  sequestration within autophagic vesicles. These vesicles then fuse with lysosomes
  to form mitolysosomes, where mitochondrial components are degraded. This model illustrates
  the sequential steps linking burn-injury-associated mitochondrial stress to selective
  mitochondrial turnover by mitophagy. Created in Biorender. Guntur, A.R. (2026) https://app.biorender.com/illustrations/69bc04d271e1c07655790374
  (accessed on 23 March 2026)
