figure_title: Apoptosis is increased significantly in the combination therapy of copanlisib
  and navitoclax and is mediated through BCL-xL.
caption: Apoptosis is increased significantly in the combination therapy of copanlisib
  and navitoclax and is mediated through BCL-xL. A and B, Average of cells normalized
  to control in either early or late apoptosis from three replicates for each treatment
  group was graphed. An increase in cells in early and late apoptosis was seen in
  both SW48 and SW48PK when treated with combination therapy. *, P ≤ 0.05; **, P ≤
  0.01; ***, P ≤ 0.001 (Student t test). C, APPK MDCOs were treated with vehicle,
  200 nmol/L copanlisib, 250 nmol/L venetoclax (BCL-2), WEHI-529 (BCL-xL), or navitoclax,
  or a combination of these therapies for 48 hours. Response was determined using
  change in diameter. Venetoclax did not enhance the efficacy of copanlisib (copan
  −17%; combo 43%,; P < 0.001; GΔ = −2.1). WEHI-539 enhanced the efficacy of copanlisib
  similarly to copanlisib and navitoclax (WEHI-539 and copanlisib −21%; P = 0.33;
  GΔ = 0.1 and navitoclax and copanlisib −100%; P ≤ 0.001; GΔ = 2.8), three replicates.
  *, P ≤ 0.05; **, P ≤ 0.01; ***, P ≤ 0.001 (Wilcoxon rank-sum test). GΔ ≥1.25 indicates
  sensitive, GΔ ≤0.75 indicates resistance, and GΔ >0.75 and <1.25 indicates an intermediate
  response. D, GSEA was performed on patients with cancer that had a PIK3CA mutation
  with either high or low expression of BCL2L1. Cancers with low expression of BCL2L1
  had an increase in the DNA repair and IFN-α pathways, whereas patients with high
  expression of BCL2L1 had an increase in the mTORC1 signaling and metabolic pathways.
  E, Disease-free survival was compared between the two cohorts expressing either
  high or low BCL2L1. Patients with low expression of BCL2L1 had a greater disease-free
  survival compared with patients with high expression of BCL2L1 (P = 0.037). copan,
  copanlisib; nav, navitoclax; ns, not statistically significant
