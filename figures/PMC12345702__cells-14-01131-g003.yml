figure_title: PSAP in Parkinson’s disease (PD).
caption: PSAP in Parkinson’s disease (PD). PSAP gene variants (e.g., rs4747203, rs885828)
  promote Parkinson’s disease (PD) progression by impairing autophagic flux, inducing
  α-synuclein (α-Syn) aggregation, and disrupting lysosomal function, leading to dopaminergic
  neuron degeneration. PSAP is processed by Cathepsin B (CSTB) to generate Sap C;
  thus, PSAP deficiency or mutations reduce levels of its derivative Sap C, suppressing
  glucocerebrosidase (GCase) activity and exacerbating pathological α-Syn accumulation.
  Conversely, PSAP overexpression or pharmacological interventions (e.g., ambroxol)
  upregulate Sap C and LIMP-2 levels, restore GCase activity and enhance α-Syn clearance,
  thereby inhibiting PD pathogenesis. PSAP interacts with progranulin (PGRN) in lysosomes,
  mutually enhancing their transport and activation, which further potentiates GCase
  activity. PSAP, as an endogenous ligand of GPR37, binds to GPR37 and facilitates
  its translocation to neuronal membranes, forming a PSAP-GPR37-GM1 complex within
  GM1-enriched lipid rafts to promote cell survival. GBA gene mutations significantly
  increase PD risk, while Sap C antagonizes α-Syn-mediated inhibition of GCase, restoring
  lysosomal function. These findings highlight the therapeutic potential of targeting
  PSAP-related pathways. Created with BioRender.com
