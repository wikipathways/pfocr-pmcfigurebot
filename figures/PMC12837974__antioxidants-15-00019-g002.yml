figure_title: Mitochondrial respiration is impaired in fibroblasts derived from patients
  with DLD deficiency.
caption: 'Mitochondrial respiration is impaired in fibroblasts derived from patients
  with DLD deficiency. Mitochondrial oxygen consumption was assessed in controls (Ctrl1
  and Ctrl2) and patient (Pt1–Pt6) fibroblasts using high-resolution respirometry
  (Oroboros O2k). (A) Routine respiration; (B) maximal respiration calculated as the
  difference between FCCP-stimulated and α-chaconine–permeabilized rates; (C) complex
  I-linked respiration (NADH-linked respiration, N-pathway), calculated as the difference
  between ADP and α-chaconine; (D) complex II-linked respiration (NS-pathway) calculated
  as the difference between respiration after rotenone and α-chaconine addition; (E)
  effect of complex I inhibition, calculated as the difference between FCCP-stimulated
  and rotenone-inhibited respiration; and (F) complex I/complex II respiration ratio
  (complex I-linked activity divided by complex II-linked activity). Each open circle
  represents an independent experimental run (N = 4–8 repeats per sample). All data
  were normalized to cell number. Statistical analysis was performed using the Mann–Whitney
  U test. * p < 0.05 vs. Ctrl1; numerical p values (0.05 < p < 0.1) are indicated
  on the plots. Abbreviations: Ctrl, control; Pt, patient'
