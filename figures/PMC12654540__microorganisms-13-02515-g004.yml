figure_title: STING-Mediated Sensing of Bacterial Cyclic Dinucleotides (CDNs) and
  Microbial DNA in Human Cells.
caption: STING-Mediated Sensing of Bacterial Cyclic Dinucleotides (CDNs) and Microbial
  DNA in Human Cells. This diagram illustrates the STING (Stimulator of Interferon
  Genes) signaling pathway in the human cell cytosol in response to bacterial CDNs
  (c-di-AMP and c-di-GMP) and microbial DNA. Bacterial CDNs directly bind to STING,
  while microbial DNA is sensed by cyclic GMP-AMP synthase (cGAS), leading to the
  production of cyclic GMP-AMP (cGAMP), a second messenger that also activates STING.
  Upon activation, STING recruits and activates the kinase TBK1, which phosphorylates
  the transcription factors NF-κB and IRF3. These factors translocate into the nucleus,
  where they drive the transcription of type I interferon gene (Ifnβ), thereby initiating
  an innate immune response
