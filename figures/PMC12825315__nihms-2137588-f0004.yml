figure_title: Single-enzyme DNA repair reactions
caption: Bulky DNA lesions, such as cyclobutane pyrimidine dimers (CPDs), can be repaired
  by externally applying enzymes such as photolyase or T4 endonuclease V. Photolyase
  flips the CPD lesion accommodating it to its catalytic site. This enzyme absorbs
  photons at wavelengths around the 300–500 nm range and transfers the energy to a
  flavin (FADH−), which transfers the electron to the CPD, splitting it back to two
  pyrimidines343,344. The T4 endonuclease V flips the CPD, and, by DNA glycosylase
  activity, it removes the damage, leaving apurinic/apyrimidinic sites (AP sites),
  which will be repaired by the base-excision repair pathway345. UV, ultraviolet
