figure_title: Regulatory mechanism of the RANK/RANKL/OPG pathway in bone metabolism.
caption: 'Regulatory mechanism of the RANK/RANKL/OPG pathway in bone metabolism. RANKL
  binds to receptor activators of RANK on osteoclast precursors, promoting osteoclast
  differentiation/maturation and enhancing bone resorption through the activation
  of the TRAF6, MAPK, and NF-κB pathways. OPG acts as a decoy receptor for RANKL,
  inhibiting this osteoclastogenic cascade. RANK, receptor activator of nuclear factor-kappaB;
  RANKL, RANK ligand; OPG, osteoprotegerin; TRAF6, TNF receptor-associated factor
  6; NFATc1, nuclear factor of activated T cells 1; MAPK, mitogen-activated protein
  kinase; NF-κB, nuclear factor κB. The arrows indicate the direction of change: ↑,
  increased expression/activity; ↓, decreased expression/inhibition'
