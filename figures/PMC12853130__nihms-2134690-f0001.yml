figure_title: NUDT5 and HPRT1 regulate thiopurine sensitivity through different mechanisms
caption: '(A) Simplified schematic illustrating 6-TG metabolism-mediated cell death.
  (B) Growth rates of WT, ΔNUDT5, and ΔHPRT1 HeLa cells treated with the indicated
  doses of 6-TG. Data are technical replicates from one of three independent experiments.
  (C) Proteomics analysis showing upregulated pathways in 6-TG-treated WT cells compared
  to vehicle-treated WT, vehicle-treated ΔNUDT5 and 6-TG-treated ΔNUDT5 cells. (D)
  Heatmap showing abundance of proteins in the apoptosis pathway in WT and ΔNUDT5
  HeLa cells treated with or without 0.5 μg/mL 6-TG for 24 hours (n=4). (E) Apoptosis
  analysis in WT and ΔNUDT5 HeLa cells treated with 0.5 μg/mL 6-TG for 48 hours. To
  the left are representative contour plots. To the right are bar graphs showing the
  percentage of apoptotic (Annexin V+, PI−) and dead (Annexin V+, PI+) cells. (n=3).
  (F) Western blot assessing cleaved PARP in WT, ΔNUDT5, and ΔHPRT1 HeLa cells treated
  with 0.5 μg/mL 6-TG for 24 hours. Calnexin (CANX) is the loading control. (G) Growth
  rates of ΔNUDT5 HeLa cells that express empty vector (EV), NUDT5WT, or NUDT5E112Q
  treated with the indicated doses of 6-TG. Data are technical replicates from one
  of three independent experiments. (H) Western blot assessing cleaved PARP in ΔNUDT5
  HeLa cells that express empty vector (EV), NUDT5WT, or NUDT5E112Q treated with or
  without 0.5 μg/mL 6-TG for 24 hours. β-actin (ACTB) is the loading control. (I)
  Schematic illustrating labeling of purine nucleotides from [15N4]hypoxanthine. (J)
  Relative abundance of m+4 AMP and m+4 GMP from [15N4]hypoxanthine in WT, ΔNUDT5,
  and ΔHPRT1 HeLa cells during 4 hours of tracing. (n=4). (K) Growth rates of WT,
  ΔNUDT5, and ΔHPRT1 HeLa cells treated with DMSO, 1 μM lometrexol (LTX), or 1 μM
  methotrexate (MTX). Data are technical replicates from one of three independent
  experiments. (L-M) Relative abundance of 6-TG (L), 6-T-GMP, 6-T-GTP, and 6-thioguanosine
  (M) in WT, ΔNUDT5, and ΔHPRT1 HeLa cells treated with 0.5 μg/mL 6-TG for 24 hours.
  (n=4). Data points in each panel represent an independent sample unless specified.
  Error bars denote SEM. Multiple t test (E) and unpaired, two-sided t tests (M) were
  used for statistical analyses. ***: P < 0.001; ***: P < 0.001; *: P < 0.05; n.s.:
  P > 0.05. BioRender was used to generate the illustrations in (A and I)'
