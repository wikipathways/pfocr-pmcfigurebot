figure_title: Health and aging-related metapathway and its state biomarkers.
caption: Health and aging-related metapathway and its state biomarkers. (a) Location
  of metapathway’s metabolites within the KEGG global pathway network. Metabolites
  are highlighted in red; circle size represents the number of associated metabolites.
  The dashed area indicates the metapathway’s region within human metabolism. Generated
  using MetaboAnalyst. (b) Metabolite–metabolite interaction network for the metapathway.
  Node size corresponds to the degree of the node (metabolite). Central node metabolites
  (O), identified as having the highest degree (see Table 1), were selected as biomarkers
  of metapathway state (BMS). (c) The resulting list of BMS. Adapted from [40]
