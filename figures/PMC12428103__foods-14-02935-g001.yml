figure_title: Effect of the Lactobacillus supplementation on acidification kinetics
  and microbial viability during yogurt fermentation.
caption: 'Effect of the Lactobacillus supplementation on acidification kinetics and
  microbial viability during yogurt fermentation. (A) Time-course monitoring of the
  titratable acidity development during fermentation. (B) Enumeration of the starter
  culture (HYY) viability. (C) Quantification of supplemented Lactobacillus populations.
  The data represent biological triplicates (mean ± SD), where statistically significant
  differences (p < 0.05) were determined using one-way ANOVA with Tukey’s multiple-comparison
  test. (D) The genomic analysis of L. paracasei L9 (GenBank accession: CP012148.1)
  revealed a comprehensive metabolic network for lactose and galactose utilization,
  which can be systematically categorized into four functional modules: (1) sugar
  uptake (blue), which involves lactose permease genes (ptsG and ptsI) and phosphotransferase
  system components (LPL9_0600, 0601); (2) sugar catabolism (green), which involves
  Leloir pathway (Galactokinase, LPL9_0718; galactose-1-phosphate uridylyltransferase,
  LPL9_0720; UDP-glucose 4-epimerase, LPL9_0719; and galactose-6-phosphate isomerase
  subunit lacAB, LPL9_0733, 0734); (3) glycolysis (black); and (4) nucleotide sugar/amino
  nucleotide sugar biosynthesis (orange), which involves the UDP-glucose/epimerase
  family genes (Phosphoglucomutase, LPL9_0975). Asterisks indicate statistically significant
  differences compared with the HYY control (p < 0.05, one-way ANOVA with Tukey’s
  test)'
