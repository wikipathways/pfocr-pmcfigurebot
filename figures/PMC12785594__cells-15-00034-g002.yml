caption: KEGG and GO enrichment analysis of DEGs between 0, 4, and 12 h after hCG
  induction. (A,B) KEGG pathway enrichment analysis of DEGs up-regulated (A) and down-regulated
  (B) 4 h after hCG treatment. (C) GO enrichment analysis of DEGs 4 h after hCG treatment.
  (D) KEGG pathway enrichment analysis of DEGs 12 h after hCG treatment. (E) GO enrichment
  analysis of DEGs 12 h after hCG treatment. (F–G) KEGG enrichment analysis of down-regulated
  (F) and up-regulated (G) DEGs 12 h after hCG treatment compared with 4 h. (H) KEGG
  enrichment analysis of DEGs 12 h after hCG treatment compared with 4 h. (C,E,H)
  Red indicates up-regulated DEGs, blue indicates down-regulated DEGs; dark colors
  denote biological processes, intermediate colors denote cell localization, and light
  colors denote molecular functions. (I) Functional categorization of up-regulated
  genes 4 h after hCG treatment
