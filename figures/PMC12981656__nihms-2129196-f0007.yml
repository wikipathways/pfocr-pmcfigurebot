figure_title: GMM-based multi-model analysis of PPI scores.
caption: GMM-based multi-model analysis of PPI scores. (a) shows a general toy example
  of the density distribution of the PPI score for all genes of a given pathway. We
  can observe multiple ‘peaks’ corresponding to multiple ‘models’ within the scores
  distribution. In (b,c, and d) we show the GMM analysis of three progression groups
  (1,2 and 3 respectively) from the Colon Cancer dataset, each contains at least three
  gaussian models representing low mean PPI score (black), medium activity genes (magenta)
  and highly active/high PPI scores gene group (yellow). In (d) the most active cell
  group, we can see the even the lowest class (black) has a non-zero mean
