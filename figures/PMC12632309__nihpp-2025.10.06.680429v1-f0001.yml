figure_title: A discovery dataset revealed sexually dimorphic human islet responses
  to proinflammatory cytokines
caption: 'Human islets were treated with proinflammatory cytokines (PIC: IL1-β and
  IFN-γ) and subjected to RNA-sequencing. (A) Experimental design. (B) Principal component
  analysis plot. (C) Volcano plot of differentially expressed genes in male islets
  treated with PIC compared to vehicle. Labeled genes highlighted in red. (D) Volcano
  plot of differentially expressed genes in female islets treated with PIC compared
  to vehicle. Labeled genes highlighted in blue. (E) Shared and unique differentially
  expressed genes identified in male and female islets treated with and without PIC.
  (F) Hallmark pathway analysis of sex-specific DEGs. (G) GSEA of Hallmarks: Interferon
  Alpha Response (top panel) and Hallmarks: Epithelial Mesenchymal Transition (bottom
  panel) in islets from male donors treated with PIC compared to islets from female
  donors treated with PIC. Islets from human donors: N=6 males and N=4 females'
article_title: Islet-intrinsic sex differences in inflammatory signaling contribute
  to autoimmune diabetes susceptibility
