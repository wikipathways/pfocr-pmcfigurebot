figure_title: Stimulus contrast increases accommodative eye vergence
caption: '(A) Left: accommodative eye vergence in an example emmetrope (S.P., in black)
  measured at different contrasts with light stimuli driving ON pathways (in red)
  and dark stimuli driving OFF pathways (in blue). To facilitate comparison, the baseline
  for light stimuli was adjusted to match dark stimuli. Right: contrast-response function
  (C50, contrast at half maximum; n, exponent of Naka-Rushton function).(B) From left
  to right, normalized contrast-response function for the emmetrope average, increase
  in accommodative eye vergence with contrast, and larger accommodative eye vergence
  for dark than light stimuli at 3%–6% contrast.(C) Same as (A) for a myope (HR in
  green, spherical equivalent −2.25 D).(D) Same as (B) for myope average. All error
  bars are standard errors. Bar graphs illustrate means. The p values are obtained
  using Wilcoxon test comparing medians.Dashed lines in (B) and (D) are Naka-Rushton
  fits'
article_title: Human accommodative visuomotor function is driven by contrast through
  ON and OFF pathways and is enhanced in myopia
