figure_title: Effects of FAD-Associated PSEN1 Mutations on ε-Cleavage of C99 by γ-Secretase.
caption: Effects of FAD-Associated PSEN1 Mutations on ε-Cleavage of C99 by γ-Secretase.
  (A) Schematic representation of γ-secretase-mediated proteolysis of APP C99 substrate,
  highlighting sequential cleavage events. (B) Cryo-EM-based model of APP C99 (yellow)
  bound to the PSEN1-containing γ-secretase complex (other complex components nicastrin,
  Aph-1, and Pen-2 omitted for clarity), with FAD-associated PSEN1 mutations examined
  in this study shown in red. (C) Standard curves for AICD50–99 and AICD49–99 (coproducts
  of Aβ49 and Aβ48 generation, respectively) were generated using synthetic peptides
  and MALDI-TOF MS, with 50 nM insulin as an internal standard (IS). (D) Quantification
  of AICD products from WT and mutant γ-secretase reactions, based on MALDI-TOF MS
  measurements using the established standard curves. Data represent mean values from
  three independent experiments (n = 3). Statistical significance was determined using
  unpaired two-tailed t-tests; *** p < 0.001. Throughout the manuscript, purple bars
  denote quantification of cleavages along the Aβ48 → Aβ38 pathway, while red bars
  denote quantification of cleavages along the Aβ49 → Aβ40 pathway
article_title: Presenilin-1 Familial Alzheimer Mutations Impair γ-Secretase Cleavage
  of APP Through Stabilized Enzyme–Substrate Complex Formation
