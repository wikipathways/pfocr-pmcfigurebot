figure_title: Reversibility of the off-pathway state is supported by long timescale
  hemi-fusion extents.
caption: Reversibility of the off-pathway state is supported by long timescale hemi-fusion
  extents. Single-VLP hemi-fusion was monitored by time-lapse microscopy at pH 5 up
  to 120 min after pH drop. The measured hemi-fusion extents at each time point are
  shown (solid dots, representing mean ± standard deviation of three different image
  regions within the sample). These data were compared with predictions of the best
  fitting “per virus” model (see Fig. 3 I–K) with kreturn fixed at 0 s−1 (red line,
  irreversible model), 0.001 s−1 (green line), or 0.004 s−1 (gold line). Model predictions
  were calculated relative to the experimental extent at 5 min, consistent with the
  prior analysis in Fig. 3 above. The other rate constants employed were kBA = 6.4
  × 104 M−1s−1, koff = 0.2 s−1, and kAHF = 2.4 × 10−2 s−1
