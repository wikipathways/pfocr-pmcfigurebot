caption: Graphical abstract illustrating the core concept of this review. This schematic
  illustrates the integrated mechanisms of the lung–brain axis in the pathogenesis
  of AD. Common pulmonary diseases contribute to or exacerbate AD through several
  representative mechanistic pathways. Acupuncture, targeting specific meridians and
  acupoints (e.g., the six dorsal acupoints), may ameliorate pulmonary conditions
  by potentially promoting neurorestoration, modulating endocrine responses, resolving
  inflammation, and regulating immune activity. This multi-targeted intervention may
  subsequently contribute to the restoration of normal brain function in AD. This
  framework proposes potential strategic directions for future research on acupuncture
  targeting the lung–brain axis
article_title: 'Acupuncture Modulation of the Lung–Brain Axis in Alzheimer’s Disease:
