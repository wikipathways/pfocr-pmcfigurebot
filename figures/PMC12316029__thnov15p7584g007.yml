figure_title: Activation of the WNT pathway in the hippocampus effectively alleviated
  the suppression of hippocampal neurogenesis and cognitive dysfunction induced by
  SCI.
caption: Activation of the WNT pathway in the hippocampus effectively alleviated the
  suppression of hippocampal neurogenesis and cognitive dysfunction induced by SCI.
  (A) Trajectory plots illustrating mice movement during the open field test. (B)
  Quantification mice total move distance (one-way ANOVA, F (2, 21) = 77.88. p = 0.0031
  Tukey's post hoc test. n = 8 per group), percentage of move distance in center (one-way
  ANOVA, F (2, 21) = 24.69, p = 0.0109. Tukey's post hoc test. n = 8 per group) and
  percentage of time spent in the central region (one-way ANOVA, F (2, 21) = 15.37,
  p < 0.001. Tukey's post hoc test. n = 8 per group). (C) Trajectory plots illustrating
  mice movement during the novel objection reorganization test. (D) Proportion of
  time spent with the novel or familiar objections (one-way ANOVA, F (2, 42) = 56.17,
  p < 0.001. Tukey's post hoc test. n = 8 per group). (E) Quantification of success
  rate of spontaneous alternation of mice (one-way ANOVA, F (2, 21) = 34.80, p < 0.001.
  Tukey's post hoc test. n = 8 per group). (F) Western blot analysis of the expression
  of WNT10b and β-CATENIN in the hippocampal NSCs after WNT-agonist treatment. (G)
  Quantification of WNT10b and β-CATENIN expression in (F) (one-way ANOVA, F (2, 9)
  = 24.92, p < 0.001. Tukey's post hoc test. n = 3 per group). (H) Representative
  immunofluorescent stains of the radial glia-like cells (GFAP, green fluoresce, SOX2,
  Red fluoresces) images of the hippocampus at 8 weeks post-injury in each group.
  Scale bar, 100 μm. (I) Quantification of GFAP+SOX2+ cells of sham and SCI groups
  in (H) (one-way ANOVA, F (2, 21) = 41.47, p < 0.001. Tukey's post hoc test. n =
  8 per group). (J) Representative immunofluorescent stains of the BrdU+ cells (BrdU,
  white fluoresces) images of the hippocampus at 8 weeks post-injury in each group.
  Scale bar, 200 μm. (K) Quantification of BrdU+ cells of sham and SCI groups in (J)
  (one-way ANOVA, F (2, 21) = 99.74, p < 0.001. Tukey's post hoc test. n = 8 per group).
  (L) Representative immunofluorescent stains of the SOX2+BrdU+ cells (SOX2, Red fluoresces,
  BrdU, green fluoresces) images of the hippocampus at 8 weeks post-injury in each
  group. Scale bar, 50 μm. (M) Quantification of SOX2+BrdU+ cells of sham and SCI
  groups in (L) (one-way ANOVA, F (2, 21) = 102.8, p < 0.001. Tukey's post hoc test.
  n = 8 per group). (N) Representative immunofluorescent stains of the neuroblast
  (DCX, Red fluoresces) images of the hippocampus at 8 weeks post-injury in each group.
  Scale bar, 100 μm. (O) Quantification of DCX+ cells of sham and SCI groups in (N)
  (one-way ANOVA, F (2, 21) = 70.09, p < 0.001. Tukey's post hoc test. n = 8 per group).
  Data are presented as mean ± SD, NS, no significant difference, *P < 0.05, **P <
  0.01, ***P < 0.001
