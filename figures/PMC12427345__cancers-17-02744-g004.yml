caption: 'Unsupervised hierarchical clustering heatmap of ccRCC-R highlighting allele
  frequency–weighted pathway mutation burden and four molecular subgroups. This hierarchical
  heatmap illustrates allele frequency-weighted pathway mutation burdens (scale 0–3,
  reflected by color intensity) across individual tumors. Unsupervised clustering
  stratifies the 17 ccRCC-R tumors into four biologically distinct subgroups: Cluster
  A (DDR/Chromatin remodeling/CDK), Cluster B (MAPK-driven), Cluster C (mTOR/FGFR4-dominant),
  and Cluster D (RB/p53/MYC). Row color sidebars indicate cluster membership—red,
  blue, green, and purple, respectively—and reflect potential therapeutic implications'
