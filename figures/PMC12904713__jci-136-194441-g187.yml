caption: Polar metabolites were extracted and subjected to LC-MS. Heatmap of targeted
  metabolomics analysis of indicated 2M (A) and 6M (B) mouse liver tissues (n = 6).
  Pyrimidine-related metabolites are in boxes. (C) A summary graph of mitochondria
  and pyrimidine synthesis pathway. (D) Levels of key pyrimidine metabolites from
  untargeted metabolomics analysis (n = 6). (E) Heatmap of pyrimidine metabolism genes
  from the RNA-seq analysis (n = 6). All results are expressed as mean ± SE. *P <
  0.05; 1-way ANOVA analysis with Bonferroni’s post hoc test
