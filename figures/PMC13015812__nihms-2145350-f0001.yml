caption: 'The workflow diagram visually represents the Genetic Prompt Vision (GPV)
  algorithm pipeline, demonstrating how prompts are generated, optimized, and reranked,
  followed by the evaluation of chatbot responses. The illustration consists of two
  parts: (A) The overall pipeline of the GPV algorithm. The GPV process begins with
  handcrafted prompts, which are iteratively refined to find better prompts. Once
  the iterations are complete, the prompts are reranked, and the best-performing ones
  are selected. (B) The responses from multiple chatbots to the designed genetic pathway
  prompts, including (i) GPT-4oV, (ii) Claude-3.5, (iii) Gemini’1.5V, and (iv) Llama
  3.2v-11b'
