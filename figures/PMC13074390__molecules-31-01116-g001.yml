figure_title: Schematic representation of IBD pathogenesis.
caption: 'Schematic representation of IBD pathogenesis. This figure shows the bidirectional
  regulatory network between the brain, intestine and gut microbiota through neural,
  endocrine, immune and metabolic pathways; the core regulatory pathways are marked
  with blue dashed lines, and cells and molecules with different functions are identified
  by differentiated graphics. Different colors represent distinct components of gut
  microbiota and signaling molecules: red circular, green rod-shaped, purple rod-shaped,
  and brown curved rod-shaped symbols represent different types of gut microbiota;
  blue triangular symbols represent neurotransmitters; yellow clustered symbols represent
  short-chain fatty acids'
