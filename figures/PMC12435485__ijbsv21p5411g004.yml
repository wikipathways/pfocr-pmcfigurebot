figure_title: Chiglitazar remarkably suppresses the glycolytic pathway in transformed
  follicular lymphoma cells.
caption: Chiglitazar remarkably suppresses the glycolytic pathway in transformed follicular
  lymphoma cells. (A-B) Glucose consumption (A) and lactate production (B) were inhibited
  in RL, SC-1 and Karpas 422 cells after 24 h of chiglitzar (10 μM, 20 μM) treatment,
  and the glucose consumption and lactate production were measured using the Glucose
  Assay Kit and Lactic Acid Assay Kit, respectively. (C-E) OCR levels in RL and SC-1
  cells after 24 h of 20 μM chiglitazar treatment (C) in which mitochondrial Spare
  Respiratory Capacity (D) and ATP Production (E) were impaired. (F-G) ECAR levels
  in RL and SC-1 cells following 24 h of 20 μM chiglitazar (F) exposure in which glycolytic
  activity (G) was damaged. the ECAR and OCR were quantified using the Seahorse XF
  Glycolysis Stress Test Kit and Seahorse XF Cell Mito Stress Test Kit, respectively.
  (H) The levels of glycolysis-associated proteins (HIF1α, HK2, PKM2, PFKP, LDHA,
  GLUT1 and PGK1) were analyzed by Western blotting after 24 h of exposure to chiglitazar
  (5 μM, 10 μM, 20 μM, 30 μM). (*P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001)
