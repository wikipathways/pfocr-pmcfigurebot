figure_title: 'Cardiorenal Syndrome Type 4: Kidney Injury Induces Cardiac Remodeling.'
caption: 'Cardiorenal Syndrome Type 4: Kidney Injury Induces Cardiac Remodeling. Unilateral
  ureteral obstruction (UUO) in mice, used to model early chronic kidney disease (CKD),
  triggers cardiac remodeling even in the absence of severe uremia. After 3 weeks,
  hearts show collagen deposition and increased α-smooth muscle actin (ACTA2), with
  RNA sequencing revealing 76 differentially expressed genes enriched in inflammatory,
  proliferative, and apoptotic pathways while suppressing mitochondrial metabolism.
  Larger animal studies corroborate these findings, demonstrating that renal injury
  drives myocardial transcriptomic reprogramming and progressive CRS within the broader
  CRS spectrum. Abbreviations: UUO, unilateral ureteral obstruction; CKD, chronic
  kidney disease; CRS, cardiorenal syndrome; ACTA2, actin alpha 2 (smooth muscle actin);
  Cardiac RNA-seq in UUO mice (GEO: GSE235751)'
