caption: Dot plot of differentially methylated genes after metabolic/bariatric surgery
  within the selected pathways. The percentage of the methylation difference within
  the most significant CpG sites was grouped based on the appearance within seven
  selected pathways (FoxO, Toll-like, mTOR, cAMP, PI3K/Akt, insulin, and adipocytokine).
  The first column represents the associated pathway(s), the second column represents
  the most significant CpG sites, and the third column represents the percentage of
  methylation difference. For each tissue type and the intervention time, there is
  a different dot color [13,16,17]
