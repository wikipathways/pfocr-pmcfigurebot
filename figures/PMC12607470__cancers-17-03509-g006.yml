figure_title: Mutations across ovarian cancer cell lines.
caption: 'Mutations across ovarian cancer cell lines. The figure summarizes the mutation
  landscape of the seven ovarian cancer cell lines represented in this study. Rows
  correspond to genes, and columns represent cell lines, ordered into four biologically
  defined groups: Group 1 (COV362.4, OVCAR-5, OVCAR-8), Group 2 (SKOV3, TOV21G), Group
  3 (OVCAR-3), and Group 4 (IGROV-1). Each filled cell (yellow) indicates the presence
  of a mutation in the corresponding gene, while empty cells (red) represent wild-type
  status. Genes are ordered by overall mutation frequency across cell lines to highlight
  recurrently altered pathways. This visualization underscores the predominance of
  TP53 mutations across most models, alterations in BRCA1/2 and DNA damage repair
  genes in Group 1 and Group 3, enrichment of ARID1A, PIK3CA, and PTEN in Group 2,
  and distinct MYC and SMARCA4 alterations in OVCAR-3 and IGROV-1, respectively'
