figure_title: TAM-secreted GSH suppresses the response of BRCA1-deficient tumor cells
  to PARPi by scavenging ROS
caption: a, Schematic illustration of the peptide fractionation strategy from TAM-CM
  (left); apoptosis levels in BP cells treated with either the peptide-enriched fraction
  or the metabolite-enriched flow through from TAM-CM in combination with olaparib
  (middle); and the workflow for untargeted metabolomics of CM derived from control
  macrophages and TAMs (right). Data are presented as mean ± s.d.; unpaired Student’s
  t-test; n = 4. b, Volcano plots indicate significantly upregulated metabolites in
  CM derived from BP-TAM compared to control macrophages in the untargeted metabolomic
  analysis. c, Pathway enrichment analysis of metabolites significantly enriched in
  BP-TAM compared to control macrophages. d,e, Heatmap illustrates the relative cell
  viability of BP cells and MDA-MB-436 cells treated with olaparib at the indicated
  concentrations for 48 hours, under supplementation with different metabolites. The
  indicated metabolites, TAM-CM, and BMDM-CM or THP-1 macrophage-CM were added 12
  hours before olaparib treatment. The treatment concentrations were GSH and NAC at
  5 mM, lactate and sodium lactate at 20 mM, and itaconate and its derivatives at
  200 μM. Data represent the mean of three replicates and are color-coded; two-way
  ANOVA. f, Western blot analysis of γ-H2AX expression in BP cells following the indicated
  treatments. Cells were treated with olaparib (20 μM) for 48 hours, and the metabolites
  treatment strategy was consistent with (d). g, Relative cell viability of BP cells
  treated with olaparib (20 μM) for 48 hours under incubation with different TAM-CM.
  BMDMs were treated with GSH synthesis inhibitor BSO and lactate synthesis inhibitor
  sodium oxamate (10 μM) for 48 hours under incubation with BP-CM. CM from the inhibitor-treated
  TAM and vehicle TAM, as well as control BMDM-CM were used to incubate BP cells for
  12 hours before the treatment of olaparib. Data are presented as mean ± s.d.; n
  = 3. h, Western blot analysis of γ-H2AX expression in BP cells treated with olaparib
  (20 μM) for 48 hours under incubation with different CM. BMDMs were treated with
  GSH synthesis inhibitor BSO and lactate synthesis inhibitor sodium oxamate (10 μM)
  for 48 hours under incubation with BP-CM. CM from the inhibitor-treated TAM and
  vehicle TAM, as well as BMDM-CM were used to incubate BP cells for 12 hours before
  the addition of olaparib. i, Relative cell viability of MDA-MB-436 cells treated
  with olaparib for 48 hours under incubation with different TAM-CM. THP-1 macrophages
  were treated with GSH synthesis inhibitor BSO and lactate synthesis inhibitor sodium
  oxamate (10 μM) for 48 hours under incubation with MDA-MB-436-CM. CM from the inhibitor-treated
  TAM and vehicle TAM, as well as control THP-1 macrophage-CM were used to incubate
  MDA-MB-436 cells for 12 hours before the treatment of olaparib. Data are presented
  as mean ± s.d.; n = 3. j, Western blot analysis of γ-H2AX expression in MDA-MB-436
  cells treated with olaparib (20 μM) for 48 hours under incubation with different
  CM. THP-1 macrophages were treated with GSH synthesis inhibitor BSO and lactate
  synthesis inhibitor sodium oxamate (10 μM) for 48 hours under incubation with MDA-MB-436-CM.
  CM from the inhibitor-treated TAM and vehicle TAM, as well as control THP-1 macrophage-CM
  were used to incubate MDA-MB-436 cells for 12 hours before the treatment of olaparib.
  k, Relative cell viability of MDA-MB-436 cells after pre-treated with control or
  GCLC-knockdown TAM-derived CM for 12 hours, followed by olaparib treatment for 48
  hours. Data are presented as mean ± s.d.; n = 3. l, Intracellular ROS levels in
  MDA-MB-436 cells treated with TAM-CM derived from either control or GCLC-knockdown
  TAMs for 12 hours, followed by co-treatment with olaparib (10 μM) for 48 hours.
  Data are presented as mean ± s.d.; unpaired Student’s t-test; n = 5. m, Western
  blot analysis of γ-H2AX expression in MDA-MB-436 cells. Cells were pre-treated with
  TAM-CM derived from either control or GCLC-knockdown TAMs for 12 hours, followed
  by olaparib (20 μM) treatment for 48 hours before protein collection and analysis
article_title: IRG1/itaconate/NRF2/GSH axis in tumor-associated macrophages drives
  therapy resistance and immune evasion in BRCA1-deficient breast cancer
