figure_title: Translational pathway in pregnancy loss and early implantation failure.
caption: Translational pathway in pregnancy loss and early implantation failure. The
  flowchart depicts the continuum from molecular lesions (premature intervillous perfusion
  and oxidative stress, ↓ HLA-G with impaired immune tolerance, ↓ LIF and ↓ IL-11
  signaling) to morphological changes (hydropic degeneration of villi, poor vascularization,
  increased Hofbauer cells). These abnormalities culminate in clinical consequences
  such as early miscarriage and recurrent implantation failure. Biomarkers under evaluation
  include circulating cell-free DNA/RNA (cfDNA, cfRNA), and microRNAs from the C19MC
  cluster
