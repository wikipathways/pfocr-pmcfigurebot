figure_title: Modeling data show that the percolation universality class can explain
  the reaction of complement to surfaces
caption: '(A) Simplified schematic of alternative pathway C3-surface adhesion and
  autocatalysis, with reaction constants in red text.(B) Rate equations modeling reactions
  depicted in (A), showing a match to differential equations describing the TIV model
  for infection.(C) Results showing that the TIV-like model recapitulates the threshold
  effect in C3-surface interactions.(D) Magnified results from (C) show TIV model
  findings near the threshold fit a power-law relationship.(E–H) Results from ABM
  simulations showing characteristics of the percolation universality class and critical
  threshold behavior: (E) a shift in C3-surface interaction probability for sub-threshold
  surface protein spacing. (F) Critical threshold behavior as system size is scaled.
  (G) Moment ratio in number of active agents approaching a scale-invariant value
  near the critical point and variability in number of active agents increasing with
  scale. (H) Fit to a power-law curve.(I) Experimental measurements of C3b adhesion
  to nanoparticle surfaces (from Figure 2B), showing a fit to a power-law curve.(J)
  Schematic describing a protein-coated surface as a grid for “complement percolation.”(K)
  Schematics depicting how complement percolation responds to threshold surface protein
  spacing.See also Figure S9'
article_title: A percolation phase transition controls complement protein coating
  of surfaces
