figure_title: Schematic diagram illustrating different types of autophagy.
caption: 'Schematic diagram illustrating different types of autophagy. Autophagy has
  been divided into three processes: microautophagy, chaperone-mediated autophagy
  (CMA), and macroautophagy in which intracellular materials are delivered to lysosomes.
  (a) Microautophagy is a cellular process where cytoplasmic material is directly
  engulfed into lysosomes or vacuoles through membrane invagination for degradation.
  It is a distinct form of autophagy, in which the cells recycle and clear out damaged
  or unwanted components. It involves the direct invagination of the lysosomal membrane
  to engulf cytosolic cargo, whereas (b) CMA is a selective protein degradation pathway
  where proteins are targeted for lysosomal degradation. The KFERQ sequence is a specific
  amino acid sequence that serves as a signal for CMA. Proteins containing this motif
  are recognized by heat shock protein 70 (Hsc70). KFERQ is a pentapeptide sequence
  (Lys-Phe-Glu-Arg-Gln) found in certain proteins that acts as a signal for chaperone-mediated
  autophagy (CMA). The heat shock cognate protein 70 (HSC70) binds to the KFERQ motif,
  initiating the process. The HSC70-substrate complex then interacts with the lysosome-associated
  membrane protein 2A (LAMP2A), a receptor on the lysosomal membrane, allowing the
  protein to be translocated into the lysosome for degradation. The CMA is a significant
  pathway for protein turnover. Unlike other forms of autophagy that degrade bulk
  cellular material, CMA targets specific proteins for degradation. (c) Whereas in
  macroautophagy, the formation of double-membrane bound structures known as autophagosomes
  (dead cellular components, cargos) contains cytoplasmic materials and delivers them
  into lysosomes for breakdown by lysosomal enzymes (hydrolase). ATG proteins are
  the molecular machinery that drives macroautophagy. Enabling cells to remove unwanted
  cellular components, recycle nutrients, and maintain cellular homeostasis. The formation
  of macroautophagy process and ATG proteins in mammalian cells: The macroautophagy
  process involves autophagy-related proteins (ATG). Once phagophore is formed, ATG4
  cleaves LC3 to form LC3-I (microtubule-associated 1 protein light chain) during
  autophagy, and LC3-I binds with phosphatidylethanolamine (PE) to form LC3-II. The
  Elongation of the autophagosome is mediated by two step conjugated systems, ATG12–ATG5–ATG16L,
  and LC3–PE. After autophagy vesicles are formed, the mature autophagosome fuses
  with a lysosome to generate an autolysosome, where sequestered molecules and organelles
  are degraded'
