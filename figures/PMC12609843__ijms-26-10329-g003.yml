figure_title: HO-1197 attenuates FOXM1 by downregulating its expression and nuclear
  localization.
caption: HO-1197 attenuates FOXM1 by downregulating its expression and nuclear localization.
  (A) The biological pathway of HO-1197 was analyzed by RNA sequencing of Huh7 cells
  after treatment with 1 mg/mL HO-1197 for 48 h. (B,C) The mRNA expression of Lin9
  (B) and FoxM1 (C) was examined by qRT-PCR in Huh7 and Hep3B treated with HO-1197
  (0 or 0.5 mg/mL) for 48 h. The results were normalized to the expression of β-actin
  to calculate relative fold induction. (D) FoxM1 protein expression was measured
  in Huh7 and Hep3B cells treated with 0, 0.5, or 1 mg/mL HO-1197. (E) The nuclear
  translocation of FoxM1 in Huh7 (up) and Hep3B (down) cells treated with 0, 0.5,
  or 1 mg/mL HO-1197 was examined by immunofluorescence staining (left) and calculated
  (right). (F) FoxM1 protein expression was detected in HCC cells (Huh7 and Hep3B),
  hepatic stellate cells (LX2), fibroblasts (WI38), epithelial cells (HUVECs), and
  macrophages (THP-1), which constitute tumor spheroids. All images were obtained
  using the HCS system, and values were calculated with Harmony software. Data are
  expressed as the mean ± SD (n = 3). * p < 0.05, ** p < 0.005, *** p < 0.0005 compared
  with the control group
