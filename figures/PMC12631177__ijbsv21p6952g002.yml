figure_title: AA metabolism reprogramming affects immune cells.
caption: 'AA metabolism reprogramming affects immune cells. (a) Arg metabolic reprogramming.
  iNOS catabolizes Arg into NO, promoting the polarization of M1-like TAMs and inhibiting
  T cells. As the tumor progresses, the activity of ARG1 is upregulated, which catalyzes
  the decomposition of Arg into Orn. This process promotes the polarization of M2-like
  TAMs and inhibits T cells. PAs generated from Orn can not only drive the polarization
  of M2-like TAMs but also promote the activation of CAFs, thereby exacerbating tumor
  fibrosis. Meanwhile, Arg is also decomposed into creatine, which blocks iNOS activity,
  activates ARG, and further promotes M2-like TAM polarization. (b) Trp metabolic
  reprogramming. YKL-40 secreted by M2-like TAMs can upregulate IDO1 to activate the
  Trp/Kyn metabolic pathway. The upregulation of IDO1 leads to the depletion of Trp
  and accumulation of Kyn, which in turn activates GCN2 and AhR in immune cells. This
  activation results in the polarization of M2-like TAMs, functional impairment of
  CD8+ T cells, and differentiation of Treg. In addition, the depletion of Trp can
  also induce the apoptosis of NK cells. TPH can catalyze Trp to produce 5-HT. Meanwhile,
  CAFs can express TPH1 and actively secrete 5-HT, which activates 5-HTR and induces
  the polarization of M2-like TAMs. (c) Gln metabolic reprogramming. α-KG produced
  by Gln metabolism can activate JMJD3 to reduce the accumulation of H3K27me3, thereby
  activating M2-like TAMs. By contrast, α-KG can also participate in glycolysis to
  generate succinate. Succinate not only acts as an inhibitor of JMJD3, but also promotes
  the production of ROS and stabilizes HIF-1α, inducing the polarization of M1-like
  TAMs. In PC, the Yap/Myc signaling pathway can regulate Gln catabolism, induce the
  activation of PSCs, and drive the polarization of M2-like TAMs. In CCA, mutated
  IDH catalyzes α-KG to produce D-2-HG, which further induces CAFs to secrete SPP1
  and thereby facilitates M2-like TAM recruitment. DCs take up Gln via SLC38A2 to
  promote the formation of the FLCN-FNIP2 complex. This complex restricts the activity
  of TFEB, thereby enhancing antigen cross-presentation and the activation of CD8+
  T cells. Meanwhile, Gln metabolism exerts a unique effect: it promotes the differentiation
  of Th17 cells while restricting the differentiation of Th1 cells and CD8+ T cells.
  (iNOS: inducible nitric oxide synthase; Arg: arginine; NO: nitric oxide; TAMs: tumor-associated
  macrophage; ARG1: arginase; Orn: ornithine; PAs: polyamines; CAFs: cancer-associated
  fibroblasts; YKL-40: chitinase 3-like protein 1; IDO1: indoleamine 2,3-dioxygenase
  1; Trp: tryptophan; Kyn: kynurenine; GCN2: general control nonderepressible 2 kinase;
  AhR: aryl hydrocarbon receptor; Treg: regulatory T Cell; NK: natural killer; TPH:
  tryptophan hydroxylase; 5-HT: 5-hydroxytryptamin; 5-HTR: 5-hydroxytryptamine receptor;
  α-KG: α-Ketoglutarate; Gln: glutamine; JMJD3: Jumonji domain-containing protein
  3; H3K27me3: trimethylated histone H3 lysine 27; ROS: reactive oxygen species; HIF-1α:
  hypoxia inducible factor-1α; PC: pancreatic cancer; Yap: Yes-associated protein;
  Myc: myelocytomatosis; PSCs: pancreatic stellate cells; CCA: cholangiocarcinoma;
  IDH: isocitrate dehydrogenase; D-2-HG: D-2-hydroxyglutarate; SPP1: secreted phosphoprotein
  1; DCs: dendritic cells; SLC: solute carrier family; FLCN: folliculin; FNIP2: folliculin
  interacting protein 2; TFEB: transcription factor EB; Th: T helper; IL: interleukin;
  STAT: signal transducer and activator of transcription; IFN-γ: interferon-γ; JAK:
  Janus kinase; SERPINB2: serine protease inhibitor 2; THBS1: thrombospondin 1; STAB1:
  stabilin 1; COL23A1: collagen type XXIII alpha 1 chain; INHBA: inhibin subunit beta
  A; CCR2: C-C motif chemokine receptor 2; PAI-1: plasminogen activator inhibitor-1;
  MMP12: matrix metallopeptidase 12; mTORC1: mechanistic target of rapamycin complex
  1; CD8+ T cells: cytotoxic T lymphocytes)'
