figure_title: Reaction-diffusion Langevin dynamics simulations of the folate pathway
caption: A) Patchy particle model describing the 10 folate pathway proteins. B) Formation
  of enzyme clusters during the 1 μs Langevin dynamics simulations. C) Mean numbers
  of protein-protein contacts between different coarse-grained enzyme particles in
  the Langevin dynamics simulations. D) Size distribution of enzyme clusters at equilibrium.
  E) Reaction fluxes for each reaction in the metabolon state normalized by the same
  quantity in the monomeric (unclustered) state of the enzymes in the control simulation
  where PPI are abrogated. The initial reactions in the pathway (R1 to R4) show either
  a slight drop or no change in flux upon clustering. Later reactions in the pathway,
  however, show a dramatic increase in fluxes approaching several orders of magnitude
  showing the net gain in efficiency of substrate channeling in longer pathways upon
  clustering of enzymes
article_title: Conserved interfaces mediate multiple protein-protein interactions
