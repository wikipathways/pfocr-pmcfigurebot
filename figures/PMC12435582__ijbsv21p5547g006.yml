figure_title: MDSCs integrate B-cell-derived MHC-II in a CD36-dependent manner.
caption: 'MDSCs integrate B-cell-derived MHC-II in a CD36-dependent manner. (A) Schematic
  of RNA sequencing of MDSCs after co-culture with B cells in vitro. (B) Heatmap of
  differentially expressed genes in MDSCs co-cultured with B cells from the control
  group and MDSCs co-cultured with B cells after CTT. (C) Principal component analysis
  (PCA) of MDSCs co-cultured with B cells from the control or CTT group. (D) Volcano
  map of the phagosome pathway from the KEGG database analyzed by GSEA. (E) The expression
  of Annexin V on splenic B cells 14 days after CTT. (F) The expression of biotin
  on MDSCs after CD36 blockade. Briefly, MDSCs from the control group were co-cultured
  with biotinylated anti-mouse IA/IE antibody-prelabeled B cells from the CTT group
  for 20 h (with or without 10 μg/ml anti-CD36 antibody), and streptavidin-PE was
  used to detect the biotin+ MDSCs. (G-H) The expression levels of MHC-II (G) and
  CD86 (H) in MDSCs co-cultured with B cells after CTT plus CD36 blockade. (I) IFN-γ
  expression in OT-II CD4+ T cells after co-culture with MDSCs in the presence of
  the OVA 323-339 peptide (10 µg/ml) for 18 h. MDSCs were cultured with medium, control
  B cells or CTT B cells with or without JC63.1 or in transwell chambers for 12 h.
  *P<0.05, **P<0.01, ***P<0.001, ****P<0.0001. Data for graph (E) were analyzed via
  two-tailed Student''s t tests. Other groups compared with the medium-only group:
  &&&&P<0.0001. The data for graphs (F-I) were analyzed via one-way ANOVA'
