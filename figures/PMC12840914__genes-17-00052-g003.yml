figure_title: Alternate PEV biogenesis pathways.
caption: 'Alternate PEV biogenesis pathways. (A) EXPO biogenesis pathway: (1) Rough
  ER and Golgi apparatus produce proteins lacking conventional signal peptides (pink
  and purple shaded shapes) which are loaded into exocyst-positive organelles (EXPOs).
  (2) EXPO loading is likely mediated by surface receptors and/or proteins and the
  loading of other molecular cargo results in (3) EXPO PEV production. The EXPO PEVs
  are transported to the plasma membrane where they (4) release their cargo extracellularly
  or (5) retain their molecular cargo and are released extracellularly as PEVs. (B)
  Vacuolar biogenesis pathway (hypothesised): (1) A small vacuole forms from the MVB
  and houses ILVs and/or PEVs. (2) The small vacuole fuses with the central vacuole
  and releases its harboured vesicles. (3) Likely dependent on the molecular cargo
  of each vesicle type, together with the surface marker protein profile, the vesicles
  are either retained by the central vacuole or loaded into a budding vacuolar PEV
  (either as a single vacuolar PEV or as multiple vesicles as per the original MVB
  (pictured)). (4) Post-loading, mature vacuolar PEVs are transported to the plasma
  membrane (5) for their extracellular release. (C) Autophagy biogenesis pathway (hypothesised):
  (1) Proteins or entire organelles (e.g., nucleus, Golgi apparatus, chloroplasts,
  mitochondria, smooth and rough ER, peroxisomes, and the proteosome (barrel of spheres))
  can form targets of autophagosomes. (2 and 5) Likely due to protein composition,
  many autophagosome-derived PEVs will be directly transported to the plasma membrane
  for extracellular release. (3) Again, likely due to protein composition, some autophagosome-derived
  PEVs will initially be transported to the vacuole for processing. (4) Post-processing,
  specific autophagosome-derived PEVs will be transported back into the cytoplasm
  for (5) subsequent extracellular release. In contrast to the MVB biogenesis pathway,
  the documented EXPO biogenesis pathway and the hypothesised vacuolar and autophagosome
  biosynthesis pathways are likely activated by different forms of either biotic (viral,
  bacterial, and fungal pathogens) or abiotic (salinity, heat, flooding, and high
  light) stress as indicated by the black shaded cartoons'
