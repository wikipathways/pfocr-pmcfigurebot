figure_title: Netrin-1 signaling pathways in neuroinflammation and neurodegenerative
  diseases.
caption: 'Netrin-1 signaling pathways in neuroinflammation and neurodegenerative diseases.
  (a) Netrin-1 regulates immune cell migration by reducing TNF-α and IL-6 levels and
  stabilizes the BBB by upregulating occludin and claudin-5 in neuroinflammation.
  (b) Netrin-1 stabilizes BBB integrity, activates ERK and AKT signaling to support
  remyelination, and reduces neuroinflammation by decreasing Th17 and increasing Treg
  cells in MS. (c) Reduced netrin-1 leads to increased Aβ production via APP cleavage,
  activation of δ-secretase, cleavage of UNC5C, and impairment of synaptic plasticity
  through NMDAR downregulation and LTP reduction in AD. (d) Decreased netrin-1 promotes
  α-syn aggregation and activates caspase-3 and the UNC5B/MST1 apoptotic pathway,
  leading to increased neuronal apoptosis in PD. (e) Netrin-1 activates UNC5B and
  PPARγ signaling, which inhibits NF-κB activation, leading to reduced TNF-α and IL-6
  levels, decreased brain edema, and oxidative stress in SAH. (f) Netrin-1 deficiency
  leads to motor neuron loss, decreased synaptic protein levels, and axonal degeneration,
  contributing to neurodegeneration in ALS. AD: Alzheimer''s disease, PD: Parkinson''s
  disease, MS: multiple sclerosis, ALS: amyotrophic lateral sclerosis, SAH: subarachnoid
  hemorrhage, BBB: blood–brain barrier, APP: amyloid precursor protein, Aβ: amyloid-beta,
  DCC: deleted in colorectal cancer, LTP: long-term potentiation, NMDAR: N-methyl-D-aspartate
  receptor, UNC5C: uncoordinated-5 netrin receptor C, MST1: macrophage stimulating
  1, UNC5B: uncoordinated-5 netrin receptor B, α-syn: α-synuclein, PI3K: phosphoinositide
  3-kinases, AKT: protein kinase B, RAS: rat sarcoma virus, MEK: mitogen-activated
  protein kinase, and ERK: extracellular signal-regulated kinase'
