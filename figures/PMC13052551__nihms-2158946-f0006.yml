figure_title: Homeostatic upscaling requires both SNX17-Retriever and SNX27-Retromer
  pathways
caption: (A,D). Representative mEPSC traces of DIV 18–21 primary hippocampal neurons
  expressing the indicated constructs and treated for 24 hrs with 1 μM TTX or Vehicle.
  Scale bars = 10 pA, 50 ms. (B). Mean ± SEM mEPSC amplitude in neurons expressing
  shRNA against SNX17 or SCR control shRNA ± TTX treatment. SCR, N = 13 neurons, SCR
  + TTX, N = 7 neurons, shSNX17, N = 12 neurons, shSNX17 + TTX, N = 12 neurons; F3,40
  = 3.63, p = 0.03. (C). Cumulative mEPSC amplitude distribution for the 4 experiments
  conditions in (B) - a rightward shift in the distribution is induced by TTX in SCR-expressing,
  but not shSNX17-expressing neurons. (E). Mean ± SEM mEPSC amplitude in neurons expressing
  shRNA against SNX27 or SCR control shRNA ± TTX treatment. SCR, N = 13 neurons; SCR
  + TTX, N = 11 neurons; shSNX27, N = 11 neurons; shSNX27 + TTX, N = 14 neurons; F3,45
  = 3.22, p = 0.03. (F). Cumulative mEPSC amplitude distribution for the 4 experiments
  conditions in (E) - a rightward shift in the distribution is induced by TTX in SCR-expressing,
  but not shSNX27-expressing neurons. *P < 0.05, **P<0.01 by Fisher’s LSD
