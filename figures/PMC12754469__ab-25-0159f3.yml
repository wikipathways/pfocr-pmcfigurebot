figure_title: KEGG enrichment for the DEGs.
caption: KEGG enrichment for the DEGs. (A, B) illustrated the KEGG enrichments for
  the up- and down-regulated DEGs in 80D muscle. Upregulated DEGs in 80D leg muscle
  participated in key pathways like MAPK, VEGF, mTOR, FoxO, lysosomal function, and
  metabolic regulation (including adipocytokine and nitrogen metabolism), alongside
  cell adhesion and vascular smooth muscle contraction. Conversely, downregulated
  genes were associated with MAPK, PPAR, Wnt/Notch signaling, calcium homeostasis,
  and metabolic processes (e.g., amino acid/fatty acid metabolism and arginine biosynthesis).
  (C–I) revealed the upregulated genes in metabolic, Toll-like receptor, vascular
  smooth muscle contraction, mTOR, cell adhesion molecules, MAPK, focal adhesion signaling
  pathways. (J–P) indicated the downregulated genes in metabolic; focal adhesion;
  ECM-receptor interaction; glycine, serine and threonine metabolism; fatty acid metabolism;
  and fatty acid metabolism, respectively. In addition, genes marked with red borders
  are potential hub genes. DEG, differentially expressed gene
