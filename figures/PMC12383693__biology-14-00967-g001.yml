figure_title: Comparative metabolic pathways of vitamin D3 in fish and mammals.
caption: 'Comparative metabolic pathways of vitamin D3 in fish and mammals. “&1” represents
  a wedge bond, used to depict the three-dimensional structure of a molecule. The
  -H and -CH groups connected by “&1” are positioned in front of the plane of the
  paper, indicating the stereochemical configuration of the molecule at this location.
  VD3 undergoes two-step activation: (1) hepatic 25-hydroxylation by CYP2R1 produces
  25(OH)D3, followed by (2) renal 1α-hydroxylation by CYP27B1 to form 1,25(OH)D3 [1].
  Key species differences are highlighted: in fish, both hydroxylation steps occur
  primarily in the liver, whereas mammals distribute these reactions between liver
  (25-hydroxylation) and kidneys (1α-hydroxylation) [2]'
