figure_title: Pathway analysis
caption: Pathway-enrichment analyses using the Kyoto Encyclopedia of Genes and Genomes
  (KEGG) homo sapiens pathway library were performed using the 27 metabolites associated
  with fibroblast growth factor-23 (FGF23) (shown in Supplemental Table 2). Compounds
  without an HMDB ID were excluded from analysis. The top 4 pathways with two or more
  metabolites are indicated in black text. Pentose phosphate pathway metabolites included
  in analysis were D-gluconic acid, 6-Phospho-D-gluconate, D-Ribose 5-phosphate, and
  Erythrose-4-phosphate. Courtesy of metaboanalyst.ca (MetaboAnalyst 6.0, Xia Lab,
  McGill University)
