figure_title: ET-1 stimulated subcutaneous HWP growth via the ETAR and ETBR pathways.
caption: 'ET-1 stimulated subcutaneous HWP growth via the ETAR and ETBR pathways.
  We pretreated cells with either BQ610 or BQ788 and then treated them with 100 nM
  ET-1. According to the cell viability data, pretreatment with BQ610 or BQ788 blocked
  ET-1-mediated increases in cell viability and cell number: (A) Western blot bands.
  (B) Significant changes in cell number and cell viability were noted after BQ610
  or BQ788 treatment. (C) ET-1 altered the phosphorylation of the AMPK, ERK, c-JUN,
  and AKT proteins, and treatment with either BQ610 or BQ788 blocked the ET-1-stimulated
  phosphorylation of the ERK, c-JUN, AMPK, and AKT proteins in subcutaneous HWPs.
  All the data are expressed as the mean ± standard error of the mean (SEM) of three
  independent experiments. *p < 0.05 vs. the control; #p < 0.05, ET-1 vs. BQ610 +
  ET-1, or ET-1 vs. BQ788 + ET-1'
