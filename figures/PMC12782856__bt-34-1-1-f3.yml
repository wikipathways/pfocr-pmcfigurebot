figure_title: Neuro-immunology and novel pharmacological frontiers.
caption: 'Neuro-immunology and novel pharmacological frontiers. This schematic illustrates
  the evolving understanding of neuro-immune interactions (Vol. 34, No. 1). (A) The
  neuro-immune landscape and targeted interventions. Adaptive immune cells infiltrate
  the Alzheimer’s disease (AD) brain, where Ahn and Shin (2026) propose strategies
  to balance their dual roles in neuroprotection and neurodegeneration. Concurrently,
  the kynurenine–aryl hydrocarbon receptor (AhR) axis drives neuroinflammation, a
  pathway targeted by the novel modulator SB5794 (Cha et al., 2026). (B) Future horizon:
  The gut–immune–brain axis. Emerging research highlights how gut metabolites regulate
  this tripartite communication, shaping the future of neuro-immunological therapeutics
  (BBB, blood–brain barrier; AhR, aryl hydrocarbon receptor)'
