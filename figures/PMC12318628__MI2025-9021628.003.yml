figure_title: HBP21 exerted suppressive impacts on LPS-induced macrophage M1 polarization
  via PI3K/AKT pathway activation.
caption: 'HBP21 exerted suppressive impacts on LPS-induced macrophage M1 polarization
  via PI3K/AKT pathway activation. RAW 264.7 cells were transfected with Ov-HBP21
  for 24 h, then pretreated with the PI3K inhibitor LY294002 for 1 h prior to the
  addition of LPS for 24 h. (A) The protein expression of p-PI3K, PI3K, p-AKT, and
  AKT was detected in the above RAW 264.7 cells. ⁣∗∗∗p < 0.001, compared with control;
  ###p < 0.001, compared with LPS + Ov-NC; ⁣&p < 0.05, ⁣&&p < 0.01, ⁣&&&p < 0.001,
  compared with LPS + Ov-HBP21 via one-way ANOVA analysis, followed by Tukey''s post
  hoc test; (B) Flow cytometry analysis was performed on the above RAW 264.7 cells
  labeled with CD86 and CD206 in the above RAW 264.7 cells. (C) Levels of TNF-α, IL-1β,
  and IL-6 in the above RAW 264.7 cells were evaluated using ELISA assay kits. ⁣∗∗∗p
  < 0.001, compared with Ov-NC; ⁣#p < 0.05, ⁣##p < 0.01, ⁣###p < 0.001, compared with
  Ov-HBP21 via one-way ANOVA analysis, followed by Tukey''s post hoc test. Data were
  presented as means ± SD'
