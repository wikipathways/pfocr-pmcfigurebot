figure_title: LINC01235 interacts with the NFIB promoter region to carry out its function
caption: a. Schematic diagram showing the targeting of biotin-labeled oligonucleotides
  binding LINC01235 transcripts for Chromatin Isolation by RNA Purification (ChIRP)-PCR
  Odd and even oligo pools (seven oligos in each pool; only 6 shown) were used, and
  qRT-PCR was performed to check the RNA purification efficiency. n=3 biological replicates.
  Data are plotted as mean ± SEM using GraphPad Prism. b. qPCR with primers targeting
  NFIB promoter region shows the DNA fragment enrichment with LINC01235 pulldown.
  Primers targeting upstream and downstream of LINC01235 TSS were used as positive
  controls (PP9, PP10). n=3 biological replicates. Data are plotted as mean ± SEM
  using GraphPad Prism. (****) P<0.0001 by Student’s t-test. c. qPCR with primers
  targeting MPDZ promoter region shows no DNA fragment enrichment with LINC01235 pulldown.
  Data are plotted as mean ± SEM using GraphPad Prism. ns, not significant by student’s
  t-test. d. Proposed model of LINC01235 function. LINC01235 directly interacts with
  the NFIB promoter, positively regulating NFIB expression. Subsequently, NFIB protein
  modulates the downstream NOTCH pathway, impacting the proliferation of LP-like cells
  during breast cancer progression
article_title: LINC01235 is an Upstream Regulator of the NFIB Gene and the NOTCH Pathway
  in Triple Negative Breast Cancer
