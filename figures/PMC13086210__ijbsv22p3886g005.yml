figure_title: Activation of cytokines and inflammatory pathways in meibocyte-specificDhcr24
  conditional knockout (cKO) mice.
caption: 'Activation of cytokines and inflammatory pathways in meibocyte-specificDhcr24
  conditional knockout (cKO) mice. (A-C) Gene ontology (GO) analysis of differentially
  expressed genes (DEGs) revealing significantly enriched pathways in three categories,
  including (A) biological process (BP), (B) cellular component (CC), and (C) molecular
  function (MF). (D) Kyoto encyclopedia of genes and genomes (KEGG) enrichment analysis
  of DEGs between Dhcr24fl/fl and Dhcr24-cKO mice. (E) Representative immunofluorescence
  (IF) images of interleukin-6 (IL-6), interleukin-17 (IL-17), and tumor necrosis
  factor-α (TNF-α) in Dhcr24-cKO vs. Dhcr24fl/fl mice. Scale bars: 50 μm. (F-H) Enzyme-linked
  immunosorbent assay (ELISA) measurement of meibomian gland IL-6, IL-17, and TNF-α
  concentrations from Dhcr24-cKO and Dhcr24fl/fl mice. (I) Representative IF images
  of nuclear factor κB (NF-κB) p65 and phospho-NF-κB p65 in Dhcr24-cKO vs. Dhcr24fl/fl
  group. Scale bars: 50 μm. (J, K) Heatmap based on differentially expressed genes
  for significantly enriched pathways of (J) cytokines and inflammatory reponse and
  (K) NF-κB signaling. (L) Western blot of phospho-NF-κB p65 and NF-κB p65 protein
  levels. (M) Relative fluorescence intensity and (N) protein levels of phospho-NF-κB
  p65 and NF-κB p65'
