figure_title: Diagrammatic representation of impacts of calycosin on heart failure
  and myocardial infarction.
caption: Diagrammatic representation of impacts of calycosin on heart failure and
  myocardial infarction. Calycosin mainly activates the PI3K/Akt signaling pathway
  to attenuate inflammation and pyroptosis progression and prevent myofibrosis conversion
  in heart failure. Furthermore, in the context of myocardial infarction, it activates
  ALDH2 in mitochondria to inhibit ROS production and enhance the clearance of harmful
  aldehydes, and it activates ERα/β to suppress cell apoptosis. Calycosin also regulates
  VEGF/CD31 to facilitate angiogenesis and LTB4DH/LTB4 to reduce inflammation for
  treatment. 4-HNE—4-Hydroxynonenal; ALDH2—aldehyde dehydrogenase 2; CD31—cluster
  of differentiation 31; ERα/β—estrogen receptor α/β; IKK—IκB kinase; LTB4—Leukotriene
  B4; LTB4DH—Leukotriene B4 12-hydroxydehydrogenase; MDA—malondialdehyde; MMP-9—matrix
  metalloproteinase-9; NRF1—nuclear respiratory factor-1; PGC-1α—peroxisome proliferator-activated
  receptor gamma coactivator-1 alpha; PI3K/Akt—phosphatidylinositol three kinase serine/threonine
  kinase; ROS—reactive oxygen species; Sirt1—sirtuin 1; STAT3—signal transducer and
  activator of transcription 3; VEGF—vascular endothelial growth factor. The red upward
  arrows indicate increases, the green downward arrows indicate decreases, and cross
  marks represent inhibition
