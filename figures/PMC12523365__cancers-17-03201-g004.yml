figure_title: The synergistic relationship of Gadd45B and MAP3K4 in the MAPK pathway
  enhances antitumor activity.
caption: 'The synergistic relationship of Gadd45B and MAP3K4 in the MAPK pathway enhances
  antitumor activity. (A) Schematic representation of the biological processes involving
  Gadd45B and MAP3K4, with details of their molecular docking analysis. (B) Co-immunoprecipitation
  (Co-IP) assays showing the interaction between Gadd45B and MAP3K4 in Bcpap (OE-Gadd45B)
  cells (n = 3 independent biological replicates). (C) Silver staining assays confirming
  the interaction between Gadd45B and MAP3K4. (D) Effects of Gadd45B overexpression
  on MAP3K4 protein expression levels, with quantitative analysis (n = 3 independent
  biological replicates). (E) Representative immunofluorescence images showing the
  subcellular localization of Gadd45B and MAP3K4. Scale bar: 10 μm. (F) Western blot
  analysis showing the effects of Gadd45B overexpression and MAP3K4 knockdown on the
  MAPK signaling pathway, with quantitative analysis (n = 3 independent biological
  replicates). (G) Western blot analysis showing the effects of Gadd45B knockdown
  and MAP3K4 overexpression on the MAPK signaling pathway, with quantitative analysis
  (n = 3 independent biological replicates). (H) Synergistic effects of Gadd45B and
  MAP3K4 overexpression on the MAPK signaling pathway, with quantitative analysis
  (n = 3 independent biological replicates). (I) Synergistic effects of Gadd45B and
  MAP3K4 overexpression on the expression levels of NIS, Tg, and TPO, with quantitative
  analysis (n = 3 independent biological replicates). (J) Representative immunofluorescence
  images showing the subcellular localization and expression levels of p-MEK and p-ERK.
  (K) Immunofluorescence images depicting NIS localization and expression in Bcpap
  cells following combined Gadd45B and MAP3K4 overexpression. Scale bar: 10 μm. (L)
  Schematic workflow for mouse model establishment and assessment, with groups: control,
  Gadd45B overexpression, MAP3K4 overexpression, and combined treatment (Gadd45B and
  MAP3K4 overexpression). n = 6 per group (n = 3 for IHC, Western blotting, and tumor
  growth surveillance; n = 3 for iodine uptake rate). (M) Tumor volume curves for
  the indicated treatment groups. (N) Quantitative analysis of RAI uptake levels at
  24, 48, and 72 h in the indicated treatment groups. (O) Western blot analysis showing
  the synergistic effects of Gadd45B and MAP3K4 overexpression on the expression levels
  of NIS, Tg, and TPO. (P) Western blot analysis showing the expression of caspase-8,
  p38, and p53 proteins in the combined treatment group, with corresponding quantitative
  analysis. Data are shown as mean ± SD. Statistical significance: ns: not significant,
  * p < 0.05, ** p < 0.01, *** p < 0.001. The uncropped blots are shown in Figure
  S11'
