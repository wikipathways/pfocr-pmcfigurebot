figure_title: DNA damage tolerance pathways in human cells.
caption: DNA damage tolerance pathways in human cells. The replication forks in this
  figure depict the replisome progressing left to right, with the leading strand above
  the lagging strand. For leading strand replication the black DNA indicates the 3′−5′
  oriented leading strand template and the gray DNA indicates the 5′−3′ nascent strand.
  (A) Mechanism of “on-the-fly” TLS on the leading strand. During replication, DNA
  Pol-ε encounters a DNA lesion, is unable to proceed and becomes uncoupled from the
  CMG helicase. In response, PCNA is monoubiquitinated at K164 by the RAD6–RAD18 E2–E3
  ligase complex. This modification facilitates a polymerase switch from the replicative
  Pol-ε to a TLS polymerase, depending on the type of lesion encountered. The TLS
  polymerase inserts a nucleotide opposite the lesion and extends the DNA strand,
  therefore bypassing the damage. Once the lesion is replicated, PCNA is deubiquitinated,
  allowing Pol-ε to reassociate with PCNA and resume DNA synthesis. (B) Mechanism
  of gap formation and post-replicative filling by TLS. Gap formation during DNA replication
  depends on the location of the lesion relative to leading or lagging strand synthesis.
  In the left panel, the lesion is on the leading strand template; in the right panel,
  it is on the lagging strand template. Due to the physical properties of CMG helicase
  mediated DNA unwinding and ssDNA formation, PRIMPOL reprimes the leading strand,
  whereas Pol-α reprimes the lagging strand. When replicative polymerases stall at
  a DNA lesion, PCNA is monoubiquitinated at K164 by the RAD6–RAD18 E2–E3 ligase complex.
  However, in the depicted scenario an immediate polymerase switch does not occur.
  Despite polymerase stalling, the CMG helicase continues to unwind DNA, leading to
  the accumulation of ssDNA, which is quickly coated by RPA. PRIMPOL activity is tightly
  regulated by BRCA2 and MCM10, which prevent its association with ssDNA. However,
  upon depletion of these regulators, or through other unknown mechanisms, PRIMPOL
  reprimes DNA synthesis downstream of the lesion on the leading strand template.
  On the lagging strand template, Pol-α reprimes a new Okazaki fragment past the lesion.
  On both strands, repriming gives rise to ssDNA gaps. These gaps are filled post-replicatively
  in by TLS polymerases in a PCNA-dependent manner. (C) Template switching. DNA lesions
  may be repaired through a less mutagenic, error-free pathway that uses the sister
  chromatid as a template. PCNA is first monoubiquitinated at K164 by the RAD6–RAD18
  complex. Subsequently, UBC13, together with either HLTF or SHPRH, extends the modification
  by adding K63-linked polyubiquitin chains. ZRANB3 is recruited by polyubiquitnated
  PCNA to stimulate fork reversal. SMARCAL1 is a helicase with DNA annealing activity
  that is directed by RPA (not shown) to act on DNA on the leading strand. HLTF is
  the third enzyme promoting fork reversal, which is a key step in initiating template
  switching
