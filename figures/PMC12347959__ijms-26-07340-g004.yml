figure_title: Molecular roles of ONR and its regulation by miRNAs in BCa progression.
caption: Molecular roles of ONR and its regulation by miRNAs in BCa progression. Several
  RNRs play pivotal roles in BCa through the modulation of tumor cell behavior and
  interaction with the tumor microenvironment. HNF4G, which is directly targeted by
  miR-34a, promotes proliferation and progression via hyaluronan synthase 2 (HAS2).
  Nur77 and HNF4α influence apoptosis, invasion, and chemoresistance, although the
  regulation of Nur77 by miR-34a in BCa remains to be clarified. RORC activates the
  PD-L1/ITGB6/STAT3 signaling axis, thereby enhancing inflammation and therapy resistance.
  Additionally, RORα may regulate tumor immune responses. These ONR-mediated pathways
  represent potential targets for therapeutic intervention in BCa. Question mark (?)
  indicates speculative not validated function, solid straight black arrows indicate
  activation, dashed black arrow represents indirect inhibition, black down arrow
  indicates repressed activity and solid red arrow indicates direct inhibition process.
  Figure created with BioRender.com (accessed on 1 May 2025)
