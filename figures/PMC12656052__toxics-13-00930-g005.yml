figure_title: Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway diagram of Ni
  treatment at different concentrations.
caption: Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway diagram of Ni treatment
  at different concentrations. (a) The top 15 significantly enriched KEGG pathways
  of DEGs with different Ni2+ treatment. For multi-combination KEGG enrichment and
  scatter plots, the abscissa is the comparative combination; the ordinate is the
  enrichment pathway; the size of the point represents the number of genes that are
  enriched in the pathway; the larger the point, the more genes are enriched to the
  pathway; the color of the point represents the significance value of the enrichment
  of the pathway; and the redder the color of the point, the more significant the
  enrichment. (b) KEGG enrichment histogram of 8 μg/L Ni2+ treatment group. (c) KEGG
  enrichment histogram of 0.8 μg/L Ni2+ treatment group. In figures (b,c), the top
  50 significantly enriched KEGG pathways are shown (if there are fewer than 50 KEGG
  terms, all are displayed). The abscissa represents the number of differential genes
  annotated to the pathway, the ordinate represents the name of the KEGG pathway,
  the number in the figure represents the number of differential genes annotated to
  the pathway, the ratio of the number of differential genes annotated to the pathway
  to the total number of annotated differential genes is in parentheses; and the rightmost
  label represents the classification to which the KEGG pathway belongs
