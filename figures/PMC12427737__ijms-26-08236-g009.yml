figure_title: Proposed mechanism of chymase inhibitor (TY-51469) action on angiotensin
  II (Ang II)-mediated cardiac remodeling.
caption: Proposed mechanism of chymase inhibitor (TY-51469) action on angiotensin
  II (Ang II)-mediated cardiac remodeling. Ang II exerts both direct and indirect
  effects on cardiomyocytes and cardiac fibroblasts through AT1 receptor activation.
  In cardiomyocytes, AT1 receptor stimulation activates intracellular signaling pathways
  (including NADPH oxidase and ROS-MAPK), promoting protein synthesis and cellular
  hypertrophy. In cardiac fibroblasts, AT1 receptor activation upregulates latent
  TGF-β1 and ProMMP-2 expressions. Chymase subsequently converts these precursors
  into active TGF-β1 and MMP-2, driving fibrotic and hypertrophic processes in the
  heart. The chymase inhibitor TY-51469 blocks the conversion of latent TGF-β1 to
  active TGF-β1 and of ProMMP-2 to MMP-2, thereby attenuating these remodeling pathways.
  In this hamster model, where exogenous Ang II was administered in high doses, the
  inhibitor’s effect on endogenous Ang II production was negligible, with its primary
  action being through inhibition of the described pathway
