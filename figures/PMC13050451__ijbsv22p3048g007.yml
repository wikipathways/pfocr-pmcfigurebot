figure_title: ASNS modulated the PI3K-AKT and MAPK pathways by interacting with JUP.
caption: ASNS modulated the PI3K-AKT and MAPK pathways by interacting with JUP. Immunofluorescence
  staining revealed the sublocalization of ASNS and JUP protein expression in RCC
  tissues. (B) Western blotting analysis reveals changes in JUP protein expression
  following ASNS overexpression in Caki-1 cells. (C) Western blotting analysis shows
  alterations in JUP expression after ASNS knockdown in 786-O and RCC4 cell lines.
  (D) Western blotting analysis indicates changes in JUP expression after ASNS overexpression
  in 786-O and RCC4 cell lines. (E) A volcano plot illustrates the analysis of differentially
  expressed genes in JUP-overexpressing 786-O cells compared to control 786-O cells
  using RNA-seq. (F) The expression heat-map of these 49 differential genes. (G) KEGG
  pathway enrichment analysis for these differentially expressed genes. (H) Graph
  showing the number of differentially expressed genes included in the KEGG enrichment
  pathways. (I) Western blot analysis detects changes in protein expression levels
  of pERK1/2, pPI3K, pAKT, Cleaved-caspase 3, Bcl-2, BAX, E-cadherin, N-cadherin,
  and SNAIL following JUP overexpression in Caki-1 and 786-O cell lines. (J) Western
  blotting analysis shows changes in protein expression levels of pERK1/2, pPI3K,
  pAKT, Cleaved-Caspase 3, Bcl-2, BAX, E-cadherin, N-cadherin, and SNAIL after ASNS
  overexpression in Caki-1 and 786-O cell lines
article_title: Suppression of ASNS expression by VHL-mediated ubiquitination hinders
  the progression of renal cell carcinoma through enhancing JUP expression and inhibiting
  PI3K-AKT and MAPK pathways
