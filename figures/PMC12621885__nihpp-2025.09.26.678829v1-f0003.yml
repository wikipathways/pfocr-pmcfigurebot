figure_title: Semaglutide Reprograms Cardiomyocyte Metabolism
caption: (A) Unsupervised re-clustering of cardiomyocytes within the integrated dataset.
  Representative markers of each subcluster are labeled. (B) Feature plots of BCAT2
  and BCKDHB transcript expression in cardiomyocytes, showing uniform expression in
  all clusters. (C) Log2FC in branched chain amino acid catabolism, fatty acid metabolism,
  tricarboxylic acid cycle, and glycolysis-related genes in semaglutide-treated cardiomyocytes
  (CMs), fibroblasts (FBs), and endothelial cells (ECs) compared to HFpEF control
  (green, upregulated; red, downregulated). (D) Impact of semaglutide on pathways
  for BCAA, glucose and fatty acid metabolism (green, upregulated; white, unchanged;
  orange, downregulated). (E) Log2FC in insulin signalling genes between semaglutide-treated
  CMs, FBs, and ECs compared to untreated HFpEF controls (green, upregulated; red,
  downregulated). (F) Impact of semaglutide on insulin signalling in myocytes (green,
  upregulated; white, unchanged; orange, downregulated)
