figure_title: Aldosterone secretagogues increase AJ formation via the Rho/ROCK/NMII
  pathway
caption: '(A) Schematic illustrating AJ regulation by the K+/AngII-mediated Ca2+/ROCK/NMII
  pathway. Red arrow denotes AJ formation and stabilization. Nif, nifedipine; Fas,
  fasudil; Bleb, blebbistatin. (B) αCat co-IP in NCI-H295R cells treated with vehicle
  (11 mM NaCl), K+ (11 mM KCl), or AngII (100 nM) for 48 hours. KCad and αCat immunoblots.
  Input: whole-cell lysates. β-Actin: loading control. (C) Densitometric quantification
  of KCad/αCat co-IP (n = 3 independent experiments). (D) Representative image of
  αCat (green) and KCad (magenta) immunofluorescence in NCI-H295R cells stimulated
  with vehicle (11 mM NaCl), K+ (11 mM KCl) ± nifedipine (10 μM), fasudil (10 μM),
  or blebbistatin (10 μM) for 48 hours (1 hour preincubation with inhibitors or DMSO).
  Low-power images are in Supplemental Figure 2A. (E) Schematic of qLPA methodology.
  (F) qLPA of αCat and KCad fluorescence intensities represented in D presented as
  mean ± SEM (n = 90 cell–cell interfaces pooled from 3 independent experiments).
  (G) Average peak fluorescence intensity per experiment for KCad and αCat from D
  and F (n = 3). (H) RhoA activity in NCI-H295R cells treated with vehicle, K+, or
  AngII for 3 hours was assessed by pull-down assay. Immunoblots show active RhoA
  (RhoA-GTP) in precipitates (top), total RhoA in lysates (middle), and β-actin in
  lysates (bottom). Statistical significance determined by unpaired 2-tailed Student’s
  t test in C and 1-way ANOVA with Tukey’s multiple-comparison post test in G. *P
  < 0.05, **P < 0.01, ***P < 0.001. Data are presented as mean ± SEM. Scale bar: 20
  μm'
