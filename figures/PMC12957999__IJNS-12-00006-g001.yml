figure_title: Key workflow steps for newborn screening and early management in spinal
  muscular atrophy (SMA).
caption: Key workflow steps for newborn screening and early management in spinal muscular
  atrophy (SMA). Maternity/neonatology units collect dried blood spot (DBS) samples
  after obtaining parental informed consent and send them to accredited laboratories
  for NBS-SMA testing. Suspected positive cases undergo a second-tier confirmatory
  test (multiplex ligation-dependent probe amplification, MLPA) and are referred to
  a multidisciplinary treatment center for clinical assessment and genetic confirmation.
  Families are rapidly informed of results and invited for clinical and genetic consultation,
  while results are communicated in parallel to relevant health authorities (for example,
  the Ministry of Health) for resource allocation and program oversight. The newborn
  is enrolled in structured follow-up with clinical specialists, and information is
  shared with the general practitioner for coordinated long-term care. Family members
  at risk are evaluated for carrier status, receive further genetic counseling, and
  are offered prenatal diagnostic options in future pregnancies. Confirmed cases are
  entered into a national SMA registry to enable long-term monitoring and research.
  Legend. Dark blue boxes indicate key clinical actors (maternity/neonatology units,
  laboratories, treatment centers, child, family), light blue boxes represent process
  steps and administrative bodies, and white arrows indicate the flow of samples and
  results along the screening–treatment pathway. Solid arrows represent the routine,
  forward workflow, whereas pale blue arrows indicate communication and feedback loops
  (results reporting, resource requests, and registry entry)
