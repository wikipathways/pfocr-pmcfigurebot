figure_title: Schematic diagram of GP63 functions in Leishmania [16,30].
caption: Schematic diagram of GP63 functions in Leishmania [16,30]. GP63 facilitates
  parasite migration through the extracellular matrix by degrading its components
  and protects Leishmania from complement-mediated lysis by cleaving complement component
  3b (C3b) into its proteolytically inactive form (iC3b), which can bind to complement
  receptor types 1 and 3. GP63 binds macrophage fibronectin receptors, promoting adhesion
  of promastigotes to host cells. GP63 is secreted by promastigotes either via the
  classical secretory pathway through the flagellar pocket or via exosomes. It is
  believed that GP63 enters the macrophage cytoplasm through lipid rafts, where it
  cleaves and activates tyrosine phosphatases, such as SHP-1. This activation downregulates
  signaling pathways, including JAK2/STAT1α, which leads to an altered macrophage
  function. GP63 also modulates transcriptional regulation by inhibiting the mTOR
  pathway and targeting transcription factors such as AP-1 or NF-κB in the perinuclear
  region. In the amastigote stage, GP63 is thought to protect the parasite from the
  harsh phagolysosomal environment. Together, these functions promote Leishmania survival
  within host cells [16,30]
