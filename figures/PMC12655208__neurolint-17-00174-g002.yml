figure_title: Conceptual Model of Multidimensional Impairment in MS.
caption: Conceptual Model of Multidimensional Impairment in MS. Schematic representation
  of the proposed “common pathological pathway.” Axonal injury is shown as the central
  pathological mechanism linked to physical disability, cognitive impairment, fatigue,
  sleep disturbance, and depression. These domains converge to determine quality of
  life (QoL). Fatigue, sleep disturbance, and depression form an interrelated triad
  with reciprocal interactions, amplifying their contribution to reduced QoL
