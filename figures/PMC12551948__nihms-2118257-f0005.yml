figure_title: 'Role of MYB-HIF1α-shared transcriptional output in hypoxia adaptive
  response:'
caption: '(A) Venn diagram shows the comparison of MYB and HIF1α ChIP-seq profiles.
  MYB and HIF1α peaks were divided into three groups: MYB only, HIF1α only, and shared
  sites. The upper panel shows the line plot depicting the input normalized ChIP-seq
  signal intensities in each group. The density heatmap shows the MYB and HIF1α peak
  enrichment near peak center in all three categories (lower panel). (B) Distribution
  of MYB-HIF1α-shared sites across the defined genomic regions. (C) Venn diagram depicting
  the MYB and HIF1α-overlapped and unique ChIP-seq putative targets. (D) Comparison
  (overlapped and unique) of DEGs identified from RNA-seq analyses of MYB KO vs ctrl
  (red color) and HIF1α KO vs ctrl (green color). (E) Heatmap analysis of RNA-seq
  depicting the k-means clustering of significant DEGs affected by hypoxia in control,
  MYB knockout and HIF1α knockout cells compared to control cells under normoxia.
  A subset of genes that failed to be induced under hypoxia in both MYB KO and HIF1α
  KO cells as marked by black rectangular box. Green rectangle box shows the fraction
  of genes that were not affected with either MYB and HIF1α. (F) Venn diagram detailing
  the genes overlap among DEGs from MYB- and HIF1α-depleted cells and MYB-HIF1α overlapped
  putative ChIP-seq target genes. (G) KEGG pathway enrichment analysis of direct gene
  targets overlapped between MYB and HIF1α was examined using Enrichr. (For interpretation
  of the references to color in this figure legend, the reader is referred to the
  Web version of this article.)'
