caption: Neutrophil extracellular trap (NET) formation, or NETosis, is activated when
  neutrophils encounter pathogens or activated platelets, leading to chromatin de-condensation
  and the release of DNA, histones, and granule proteins into the extracellular space.
  These web-like NETs not only trap pathogens as part of the innate immune response
  but also promote thrombosis by activating factor XII, enhancing platelet aggregation
  via von Willebrand factor, and degrading TFPI to amplify both intrinsic and extrinsic
  coagulation pathways
