figure_title: Effects of miR-71 agomir on termite gene expression profiles revealed
  by RNA-seq analysis.
caption: Effects of miR-71 agomir on termite gene expression profiles revealed by
  RNA-seq analysis. (A) Differentially expressed genes (DEGs); (B) Gene Ontology (GO)
  enrichment analysis of DEGs in response to miR-71 agomir, showing upregulated (black
  bars) and downregulated (gray bars) genes across major biological processes, including
  detoxification, immune response, and defense pathways; (C) heatmaps representing
  the expression profiles of genes involved in key biological responses, including
  toxic substance response, reactive oxygen species response, and immune response;
  (D) KEGG pathway enrichment analysis of DEGs, indicating significant enrichment
  in pathways related to signal transduction, immune function, and carbohydrate metabolism;
  (E) heatmaps of DEGs associated with specific KEGG pathways, including antigen processing
  and presentation, olfactory transduction, citrate cycle (TCA cycle), and glycolysis/gluconeogenesis;
  (F,G) GO and KEGG enrichment analysis of upregulated versus downregulated genes.
  Each column represents one replicate from miR-71 agomir or control treatments. **,
  p < 0.01
