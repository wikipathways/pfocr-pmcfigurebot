figure_title: YoaI acts as a connector between two-component signaling systems, PhoR-PhoB
  and EnvZ-OmpR
caption: (A) Small protein YoaI is transcriptionally activated by the PhoR-PhoB system,
  which is directly stimulated by phosphate starvation and indirectly stimulated by
  Mg2+ starvation. Under low-Mg2+ conditions, there is no significant change in yoaI
  transcription, and its expression is activated post-transcriptionally in a PhoQ-independent
  manner, leading to an increase in YoaI abundance. YoaI binds to the sensor kinase
  EnvZ and promotes signaling through the EnvZ-OmpR pathway. (B) Overexpression of
  YoaI causes a PhoQ-dependent growth defect that is independent of its action on
  EnvZ
article_title: Analysis of stress-induced small proteins in Escherichia coli reveals
  that YoaI mediates cross-talk between distinct signaling systems
