figure_title: β2-adrenergic receptor signaling.
caption: β2-adrenergic receptor signaling. Upon activation by a β-agonist, β2AR undergoes
  conformational changes and recruits heterotrimeric G-protein. Gαs-subunit dissociates
  from βγ-subunits and activates adenylyl cyclase. Adenylyl cyclase generates cAMP
  from ATP which binds and activates PKA. PKA further activates other signaling pathways
  inducing bronchodilation. Once activated, G protein-coupled receptor kinases are
  recruited to phosphorylate the receptor. Consequently, β-arrestin binds to the receptor
  initiating receptor internalization and activation of signaling such as ERK mitogen-activated
  protein kinase. Agonist-induced internalization and degradation of the receptor
  leads to desensitization causing tachyphylaxis
