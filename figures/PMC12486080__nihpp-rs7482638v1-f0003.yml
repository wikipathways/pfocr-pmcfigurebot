caption: Revised causal pathway diagrams (CPDs) for LINC (Leveraging Informatics for
  MASLD Care) intervention adapted for future implementation in primary care setting.
  Figure A is for electronic medical record-integrated clinical decision support and
  reminder, Figure B clinical champion, and Figure C provider education. Black represents
  the components unchanged from the CPDs developed from implementation in the weight
  management context. Red represents changes made based on anticipated shifts in factors
  in the primary care context from qualitative interviews, construction of CPDs, and
  review by collaborators. Gray indicates components that are no longer relevant due
  need to significantly change the clinical decision support strategy. The distal
  outcome is adoption of MASLD risk stratification, defined as ordering of vibration-controlled
  transient elastography (VCTE) or hepatology referral. See Figure 1 for key regarding
  causal pathway diagrams depictions
