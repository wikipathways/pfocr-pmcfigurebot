figure_title: Mycobacterium tuberculosis phagosome damage and repair
caption: In macrophages, M. tuberculosis is initially localised in a phagosome. Through
  bacterial components such as the type VII secretion system (T7SS), ESX-1, the cell
  wall lipid phthiocerol dimycocerosate (PDIM), and other unknown factors, the bacilli
  damage the membrane of the phagosome and access the cytosol. This membrane damage
  triggers mechanisms in the host cell, including the kinase, LRRK2 and its substrate,
  the Rab GTPase Rab8, the TRAF-like E3 ubiquitin ligase E (TrafE) and the ESCRT-III
  machinery150 which attempt to repair the damage. These pathways are triggered by
  signals from the lumen such as calcium (Ca2+) leakage146 and the scrambling of sphingomyelin
  (SM) caused by early damage of the membrane143. Membrane damage also triggers condensate
  formation and stress granule plug formation, which stabilises the membrane140. Cytosolic
  proteins such as Galectin-3 (Gal3) and Galectin-8 (Gal8) recognise carbohydrate
  moieties exposed from the lumen of the phagosome146. These sensors lead to the recruitment
  of adaptor proteins that in turn recruit repair factors including the autophagy
  machinery. If the early damage proceeds further, then other repair mechanisms are
  engaged. These include endosomal fusion with the phagosome mediated by Rab20199,
  a small GTPase that regulates phagosome maturation and trafficking; ubiquitination
  of damaged membranes, which involves the addition of a small protein, ubiquitin,
  to damaged lysosomal proteins, marking them for degradation; recruitment of the
  autophagy machinery through adaptor proteins; and the transfer of lipids from the
  endoplasmic reticulum through OSBP, a lipid transporter that facilitates lipid transfer
  between membranes at sites of contact, after accumulation of PI4P, a key lipid regulator
  of membrane signalling and trafficking, on the phagosome membrane144. If the damage
  continues and the phagosomes are not repaired, M. tuberculosis will translocate
  to the cytosol. During phagosome damage, bacillary and phagosome luminal components
  leak directly into the cytosol. These include antigens for cross presentation via
  major histocompatibility complex (MHC) Class I and lysosomal enzymes such as cathepsins
  that modulate mitochondrial metabolism by degrading specific mitochondrial proteins151.
  LRRK2, leucine-rich repeat kinase 2; ESCRT-III, endosomal sorting complex required
  for transport; Ub, ubiquitin; PI4P, phosphatidylinositol-4-phosphate; OSBP, oxysterol-binding
  protein
