figure_title: Association of MMP1 + FIB with malignant progression of gastric cancer.
caption: Association of MMP1 + FIB with malignant progression of gastric cancer. (A)
  Survival analysis curves of patients in the High_MMP1 and Low_MMP1 groups. (B–D)
  Inter-group comparison analysis showing differences among fibroblast subsets in
  terms of tumor proliferation, metastasis, and immunosuppression. (E–G) Correlation
  analysis revealing associations between the Hh score and tumor proliferation, metastasis,
  and immunosuppression. (H) Results of KEGG and GO functional annotation analyses
  for each fibroblast subset. Hh_score, gsva enrichment score of the Hedgehog signaling
  pathway gene set; Prolif_feature, gsva enrichment score of the tumor proliferation
  gene set; Met_feature, gsva enrichment score of the tumor metastasis gene set; IS_feature,
  gsva enrichment score of the immunosuppressive gene set. ns, p ≥ 0.05; ** p ≤ 0.01;
  **** p ≤ 0.0001
