caption: 'Effects of Nag C liposomes on inflammation and apoptosis in the lung tissues
  of mice with LPS-induced ALI. ((A–D). qRT–PCR analysis of the mRNA expression levels
  of inflammatory factors in the lung tissue of the mice (n = 3). (E,F). Western blot
  analysis of NF-κB pathway-related protein expression and phosphorylation levels
  in mouse lung tissue (n = 3). (G). Apoptosis index in mouse lung tissue (n = 3).
  (H). Apoptosis level in mouse lung tissue; scale bar: 50 μm. The above data are
  expressed as the means ± SDs. *, p < 0.05, **, p < 0.01, ns = not significant vs.
  cells in the model group)'
