figure_title: Expression differences in vasodilation-related genes between NG and
  GDM HUVECs, with or without insulin stimulation.
caption: Expression differences in vasodilation-related genes between NG and GDM HUVECs,
  with or without insulin stimulation. (A) Insulin stimulation induces an upregulation
  of eNOS mRNA expression in NG HUVECs, but not in GDM HUVECs. However, no significant
  differences in eNOS expression are observed between NG and GDM groups under either
  condition. (B) mTOR expression is upregulated in GDM HUVECs under basal conditions.
  However, insulin stimulation does not affect either NG or GDM cells. (C,D) PTGS2
  and PTGIS mRNA expression, genes involved in the prostacyclin pathway, are not significantly
  affected by insulin treatment or by GDM status. (E,F) KCNN3 and KCNMA1, genes involved
  in the endothelium-derived hyperpolarizing factor pathway, show a trend toward increased
  expression in GDM HUVECs compared to NG, although the differences are not statistically
  significant. KCNN3 expression is significantly upregulated by insulin in NG HUVECs
  only. Data are presented as mean ± standard deviation. Statistical significance
  was determined using two-way ANOVA, with p < 0.05 considered statistically significant,
  indicated by an asterisk (*). Samples sizes were nNG = 6 (gray scale) and nGDM =
  6 (blue scale) (with ndGDM = 5 shown as empty dots and niGDM = 1 as filled dots).
  KCNMA1, potassium calcium-activated channel subfamily M alpha 1; KCNN3, potassium
  calcium-activated channel subfamily N member 3; mTOR, mechanistic target of rapamycin
  kinase; PTGIS, prostaglandin I2 synthase; PTGS2, prostaglandin-endoperoxide synthase
  2
