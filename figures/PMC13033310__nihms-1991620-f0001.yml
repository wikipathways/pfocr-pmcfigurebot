figure_title: Mutation of PA14’s xfp diminishes anaerobic survival on glucose but
  can be rescued by alleviation of reductive stress.
caption: Mutation of PA14’s xfp diminishes anaerobic survival on glucose but can be
  rescued by alleviation of reductive stress. (A) Condensed metabolic diagram highlighting
  the evidence behind our hypothesis that under reductive stress, glucose catabolic
  flux to acetate would be more favorable by way of the PPP than via the EDP. Blue
  arrows are pathways or genes that were important for anaerobic survival on glucose
  while red genes were detrimental (Saunders, 2020). All reducing equivalents are
  written as [2e-] for simplicity. KDPG = 2-keto-3-deoxy-6-phosphogluconate. (B) Mutation
  of xfp leads to a drop in anaerobic survival after 3 days in anoxic Balch tubes.
  Blue = Δphz. Grey = ΔphzΔxfp. (C) Addition of the electron shuttle phenazine-1-carboxamide
  (PCN) to increase reducing equivalent consumption rescues survival of the xfp mutant
  during anaerobic survival in a 96-well potentiostat system. Light grey = Δphz with
  no PCN, black = Δphz + 50 uM PCN, olive = ΔphzΔxfp with no PCN, light red = ΔphzΔxfp
  + 50 uM PCN, light blue = ΔphzΔxfp + 200 uM PCN. (B, C) Log transformed CFU per
  mL values. Carbon source is 20 mM glucose. Starting OD500nm = 0.75. Dots are biological
  replicates, lines represent means. (B) n = 3 per condition. (C) n = 3–6 per condition.
  (B) * denotes p-value < 0.05 from independent two-tailed t-test comparing each strain
  for each say. (C) * denotes p-value < 0.05 from one-way ANOVA comparing all groups
  per day
article_title: Pseudomonas aeruginosa relies on a phosphoketolase to support anaerobic
