figure_title: High-fat high-fructose (HFHF) fed animals develop metabolic-associated
  steatotic liver disease (MASLD), yet the pancreas is unaffected
caption: A, Representative Oil Red O staining illustrating increased lipid droplets
  (red) in HFHF (Disease and Treatment) liver vs. Control. B, heat map comparing upregulated
  disease and biological functions in Treatment vs. Control and Disease vs. Control
  datasets using Ingenuity Pathway Analysis. C, bar graph of MASLD-associated significantly
  upregulated genes and their log(2) expression in each group. Transcriptomic analysis
  based on Control, n = 7; Disease, n = 8; Treatment, n = 7 animals and fold change
  > 1.5 and < −1.5. D, PCA plot of liver transcriptomics illustrating Control animals
  segregate independently from the HFHF fed animals (Disease and Treatment). E, upregulated
  toxicity pathways in HFHF livers vs. Control livers based on differential gene expression.
  F, pancreatic islets probed using anti-insulin (green) and anti-glucagon (red) antibodies.
  Insulin-positive islet area (G) and insulin-positive cell counts (H) were quantified
  for each group. Each dot represents one islet with 8–10 islets measured per animal.
  Control, n = 4; Disease, n = 5; Treatment, n = 4 animals. All data are presented
  as the mean ± SD; P < 0.05 was considered statistically significant
