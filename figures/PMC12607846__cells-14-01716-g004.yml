caption: mtDAMPs induce lung injury through activation of the TREM-1 and cGAS-STING
  pathways. (A) Kidney mtDAMPs increase lung wet/dry ratio. (B) Neutrophil infiltration
  in BALF was observed in mtDAMP-treated mice using flow cytometry. (C) Percentage
  of neutrophils in immune cells. (D) Neutrophil to macrophage ratio in BALF. (E)
  mRNA expression levels of TREM-1 in mtDAMP-treated mouse lung tissue. (F) mRNA expression
  levels of cGAS in mtDAMP-treated mouse lung tissue. (G) mRNA expression levels of
  STING in mtDAMP-treated mouse lung tissue. All data are analyzed using GraphPad
  Prism with Student’s unpaired t-test; n = 5–6 in each group, and * means p < 0.0332,
  ** indicates p < 0.0021
