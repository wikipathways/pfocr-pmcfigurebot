caption: Tumor gene analysis of the combinatorial treatment with IL-15 complexes and
  anti-PD-1 therapy using Nanostring nCounter® multiplex panels from whole tumor lysates.
  (A) Heat map for the PanCancer IO 360TM panel. (B) Heat map for the metabolism panel.
  (C) Raw cytotoxicity-associated gene expression score (PanCancer Panel). (D) Raw
  Lymphoid compartment gene expression score (PanCancer Panel). (E) Raw cytokine and
  chemokine signaling gene expression score (PanCancer Panel). (F) Raw Notch signaling-associated
  gene expression score (PanCancer Panel). (G) Raw TCR and co-stimulatory signaling
  gene expression score (Metabolic Pathways panel). (H) Raw hypoxia-associated gene
  expression score (Metabolism Panel). (I) Raw lysosomal degradation-associated gene
  expression score (Metabolism Pathway panel). (J) Raw arginine metabolism gene expression
  score (Metabolism Panel). Data are from one experiment with three mice per group.
  An independent t-test was performed, * p < 0.05
