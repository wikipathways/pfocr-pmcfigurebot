caption: GSOAP clustering of Reactome-enriched pathways. This bubble plot displays
  the semantic similarity structure among enriched pathways identified from Reactome
  analysis. Bubble positions correspond to semantic proximity, bubble size reflects
  the number of genes mapped to each pathway, and grayscale shading indicates enrichment
  significance. Five pathway clusters were identified, with the neuronal-related cluster
  prominently represented in the analysis
