figure_title: Conceptual overview of molecular mechanisms linking pulmonary fibrosis
  (PF) to lung cancer (LC).
caption: Conceptual overview of molecular mechanisms linking pulmonary fibrosis (PF)
  to lung cancer (LC). Chronic PF induces persistent oxidative stress, mitochondrial
  dysfunction, DNA damage, and remodeling of the extracellular matrix (ECM), which
  together create a pro-tumorigenic microenvironment. These processes may promote
  epithelial–mesenchymal transition (EMT), genomic instability, and chronic inflammation,
  facilitating LC initiation. Key signaling mediators include TGF-β, PD-1/PD-L1, and
  components of the tumor immune microenvironment, which contribute to immune evasion
  and tumor progression. References supporting each pathway are included in the main
  text
