figure_title: Inducible TCF4 ablation impairs host recovery from respiratory viral
  infection
caption: A. Schematic of SARS-CoV-2 infection model in Tcf7l2fl/fl or Tcf7l2icKO mice.
  The mice were injected with tamoxifen for 5 consecutive days, followed by 5 days
  of rest. The mice were subsequently infected with SARS-CoV-2 and checked for morbidity
  and mortality until 10 d.p.i.B. Left, relative percentages of body weight loss in
  Tcf7l2fl/fl (n=14) or Tcf7l2icKO (n=15) mice. Right, survival plot of Tcf7l2fl/fl
  (n=11) or Tcf7l2icKO (n=11) mice after SARS-CoV-2 infection.C. Bar graph showing
  quantification of frequency and total AM number in Tcf7l2fl/fl (n=6) and Tcf7l2icKO
  (n=6) mice BAL fluid on day 10.D. Representative image for H&E section from Tcf7l2fl/fl
  or Tcf7l2icKO at 10 d.p.i. Bar graph on right showing % disrupted area in Tcf7l2fl/fl
  (n=5) or Tcf7l2icKO (n=6)E. Schematic of IAV infection model in Tcf7l2fl/fl or Tcf7l2icKO
  mice. The mice were injected with tamoxifen for 5 consecutive days, followed by
  5 days of rest. The mice were subsequently infected with IAV and checked for morbidity
  and mortality.F. Left, relative body weight loss in percentages in Tcf7l2fl/fl (n=9)
  or Tcf7l2icKO (n=10) mice. Right, survival plot in Tcf7l2fl/fl (n=9) or Tcf7l2icKO
  (n=10) mice after IAV infection.G. Bar graph showing quantification of frequency
  and total AM number in Tcf7l2fl/fl (n=4) or Tcf7l2icKO (n=4) mice BAL on day 14.H.
  Representative image for H&E section from Tcf7l2fl/fl or Tcf7l2icKO mice at 14 d.p.i.
  Bar graph on the right showing % disrupted area in Tcf7l2fl/fl (n=4) or Tcf7l2icKO
  (n=4).I. Schematic of acute deletion of Tcf7l2 in the IAV infection model. The mice
  were infected with IAV (150 PFU) on day 0 and injected with tamoxifen for 5 consecutive
  days on day 4 and checked for morbidity and mortality until 14 d.p.i. A group of
  mice was sacrificed on day 9 for single-cell RNA sequencing (scRNA).J. Left, relative
  body weight loss in percentages in Tcf7l2fl/fl (n=8) or Tcf7l2icKO (n=9) mice. Right,
  survival plot in Tcf7l2fl/fl (n=8) or Tcf7l2icKO (n=9) mice after IAV infection.K.
  Bar graph showing quantification of frequency and total AM number in Tcf7l2fl/fl
  (n=4) or Tcf7l2icKO (n=4) mice BAL fluid at 14 d.p.i.L. Representative image for
  H&E section from Tcf7l2fl/fl or Tcf7l2icKO. Bar graph on right showing % disrupted
  area in Tcf7l2fl/fl (n=4) or Tcf7l2icKO (n=4). M-P. Lung scRNAseq analysis was performed
  at 9 d.p.i.M. GSEA showing upregulated pathways in AM from IAV infected Tcf7l2fl/fl
  or Tcf7l2icKO mice.N. Bar graph showing proportion of cell cycle phase in AM from
  IAV infected Tcf7l2fl/fl or Tcf7l2icKO mice.O. Bar graph showing expression of Mki67
  in AM from IAV infected Tcf7l2fl/fl or Tcf7l2icKO mice.P. GSEA showing upregulated
  pathways in total lung cells from IAV infected Tcf7l2fl/fl or Tcf7l2icKO mice.Data
  are representative of at least two independent experiments with similar results
  except M-P, p-values are represented as *p< 0.05, ***p< 0.005, ****p< 0.001
