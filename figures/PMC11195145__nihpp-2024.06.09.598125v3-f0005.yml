figure_title: OSR1 interacts with molecular mediators involved in GLUT4 trafficking
caption: 'A) Representative Western Blot shows co-immunoprecipitation of endogenous
  OSR1 with AS160 from C57BL/6J whole mouse brain lysates; n=3. B) Representative
  Western blot shows co-immunoprecipitation of AS160 with OSR1 upon treatment with
  WNK63 (1 µM) and/or insulin (10 nM) in differentiated SH-SY5Y cells. C) Corresponding
  quantification of ‘B’ shows decreased association of AS160 and OSR1 in cells treated
  with insulin (10 nM) + WNK463 (1 µM) compared to insulin alone; n=6. D) Representative
  Western blot shows pAS160, AS160 and GAPDH in differentiated SH-SY5Y cells treated
  with insulin (10 nM) ± WNK463 (1 µM). E) Corresponding quantification of ‘D’ shows
  increased pAS160 in cells treated with insulin (10 nM) or WNK463 (1 µM) compared
  to DMSO; n=4. F) R-x-F-x-V- containing blocking peptide (BP: WNK1 1253–1265; NH3+-SAGRRFIVSPVPE-COO−;
  100 µM) decreases interaction of overexpressed OSR1/SPAK CCT bait protein fragment
  (aa 50–545) with myc-AS160 protein fragment (aa 193–446) in vitro; n=3. G) Corresponding
  quantification of ‘F’. H) Bright-field (left) or confocal images shows co-localization
  of endogenous OSR1 with sortilin in differentiated SH-SY5Y cells. OSR1 (red), sortilin
  (green), merged (yellow), scale bar=10 µm; n=3. I) Representative endogenous co-immunoprecipitation
  of OSR1 with sortilin in differentiated SH-SY5Y cells; n=5. J) Yeast two-hybrid
  assay shows binding of the conserved C-terminus (CCT) of OSR1 with the C-terminus
  (C-t) of sortilin (condition 3- denoted by *); binding of full-length and CCT of
  OSR1 to the C-terminus of WNK1 as positive controls (5,7). N-t: N-terminus. K) Representative
  Western blot shows co-immunoprecipitation of OSR1 and Flag-sortilin in HEK cells
  is diminished upon co-incubation with the blocking peptide (BP) SAGRRFIVSPVPE; n=3.
  L) Corresponding graphical representation for ‘K’; n=8. M) Representative Western
  Blot shows co-immunoprecipitation of OSR1 and Flag-sortilin in HEK cells is diminished
  upon WNK463 treatment; n=3. N) Corresponding quantification of ‘M’. O) Model shows
  balanced regulation of sortilin and AS160 by the WNK/OSR1/SPAK pathway to regulate
  GLUT4 trafficking. Data are represented as Mean±SE; analyzed by unpaired two-tailed
  Student’s t-test or one-way ANOVA. *p<0.05, **p<0.005 and *** p<0.0005. Graphics
  created with BioRender.com'
