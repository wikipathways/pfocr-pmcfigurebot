figure_title: Correlation network and pathway enrichment analysis of NLRC5 and PANoptosis-related
  genes across three cohorts.
caption: Correlation network and pathway enrichment analysis of NLRC5 and PANoptosis-related
  genes across three cohorts. (A–C) Correlation network of NLRC5 with PANoptosis-related
  genes in the TCGA cohort (A), CancerCell cohort (B), and GSE53625 cohort (C). The
  strength of the correlations is depicted by the thickness of the lines, while the
  direction and significance of the correlations are represented by color shading.
  (D–F) GSEA (Gene Set Enrichment Analysis) of NLRC5 expression in the TCGA cohort,
  comparing high and low NLRC5 expression groups. Enriched pathways include (D) apoptotic
  signaling, (E) necroptotic signaling, and (F) pyroptosis pathways. NES (Normalized
  Enrichment Score) and FDR (False Discovery Rate) q-values are indicated for each
  pathway. (G–I) GSEA in the CancerCell cohort, showing enrichment in the apoptotic
  (G), necroptotic (H), and pyroptotic (I) pathways. (J–L) GSEA in the GSE53625 cohort,
  illustrating similar enrichment patterns in the apoptotic (J), necroptotic (K),
  and pyroptotic (L) pathways. NES and FDR values are shown for each cohort and pathway
