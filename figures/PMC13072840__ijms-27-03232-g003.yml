figure_title: The non-canonical NF-κB pathway is activated in iMK2-KO cells (mRNA).
caption: The non-canonical NF-κB pathway is activated in iMK2-KO cells (mRNA). (a)
  Inhibition of the canonical NF-κB pathway using the IKKβ inhibitors Takinib (10
  µM, 2 h) and sc-514 (10 µM, 2 h) reduced Il1b mRNA levels in IL-1α- and LPS-treated
  iMK2-KO cells, but did not affect basal Il1b levels. Inhibiting IKKα and IKKβ with
  HPN-01 (10 µM, 2 h) reduced Il1b mRNA levels in untreated (UT) and IL-1α (5 ng/mL,
  1 h)- or LPS-stimulated cells (100 ng/mL, 1 h). Inhibition of the non-canonical
  NF-κB pathway by IKKα inhibitor B022 (5 µM, 2 h) mainly reduced basal Il1b mRNA.
  (b,c) IL-1β protein level is reduced in resting iMK2-KO cells after treatment with
  B022 (5 µM, 7 h). GAPDH serves as a control. (d) Il1b mRNA is reduced in MK2/3-DKO
  BMDMs after treatment with B022 (5 µM, 2 h). (e) The level of Map3k14 mRNA is increased
  in iMK2-KO +GFP. (f) Relb mRNA level is increased in UT iMK2-KO +GFP cells. (g)
  Relb and (h) Nfkb2 mRNA levels are increased in IL-1α (5 ng/mL, 1 h)-stimulated
  iMK2-KO +GFP cells. (i) Basal Traf2 mRNA is reduced in iMK2-KO +GFP cells. (j) The
  Traf3 mRNA level is not changed significantly. (a) 1W-ANOVA with Tukey’s Multiple
  Comparison Test, (c–j) Student’s t-test, mean ± SEM, * p < 0.05, ** p < 0.01, ***
  p < 0.001
