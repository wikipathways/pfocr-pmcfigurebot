figure_title: CES1KD M0 macrophages exhibit a differential gene expression profile
  similar to that of Control M1 macrophages.
caption: CES1KD M0 macrophages exhibit a differential gene expression profile similar
  to that of Control M1 macrophages. (A) Correlation plot between gene changes (log2
  fold change > ∣1∣) induced by loss of CES1 in unstimulated macrophages and those
  seen in LPS/IFNγ-treated control M1 macrophages. The correlation coefficient (r
  = 0.728) was significant (p < 0.001). (B) Heat map of differentially expressed genes
  (log2 fold change > ∣1∣, 1244 genes total) showing the similarity between control
  M1 and CES1KD M0 macrophages. GSEA shows an overrepresentation of genes related
  to innate immune response in both control M1 cells (C) and CES1KD M0 cells (D) relative
  to those in control M0 cells. (E) Gene Ontology analysis of upregulated pathways
  in control M1 and CES1KD M0 cells relative to those in control M0 cells. The number
  of genes associated with each term are shown at the top of each bar. Data represents
  n = 4 biological replicates. NES, normalized enrichment score; FDR, false discovery
  rate
article_title: Transcriptomics and Targeted Metabolomics Reveal That CES1 Ablation
  in Macrophages Confers a Distinct Inflammatory Phenotype Involving Altered Interleukin-1β,
  Citrate, and Lipid Levels
