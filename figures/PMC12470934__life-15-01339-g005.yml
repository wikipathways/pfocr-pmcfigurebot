caption: 'FGF21 involved the MAPK1 pathway and alleviated lipid accumulation in BHB-exposed
  bovine hepatocytes. (A) Western blot analysis of FGF21 protein levels using the
  samples extracted from cows’ healthy and ketotic liver tissues. (B) Western blot
  analysis of FGF21 protein level using the samples extracted from BHB-exposed bovine
  hepatocytes. (C–E) Western blot analysis of FGF21, MAPK1, FASN, SCD1, CPT1a, and
  ACOX1 protein levels using the samples extracted from bovine hepatocytes stimulated
  by different concentrations of FGF21 and 2.4 mmol/L BHB. (F) Oil Red O staining
  analysis of bovine hepatocytes stimulated by different concentrations of FGF21 and
  BHB: lipid droplets are in the white box. The results are presented as Mean ± SD;
  n = 3. *** p < 0.001. Lowercase letters indicate significant level (p = 0.05)'
