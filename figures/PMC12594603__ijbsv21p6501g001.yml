figure_title: Aspartate metabolism was elevated in LN metastatic tumor lines.
caption: Aspartate metabolism was elevated in LN metastatic tumor lines. Figure 1A.
  LN metastatic tumor lines were generated through serial in vivo selection of LN
  metastases. 1B-C. PCA 2D score plot (B) and OPLS-DA 2D score plot (C) of LLC and
  L-LN6. 1D. Venn Plot of differential metabolites from multi-dimensional statistics
  and univariate statistics. 1E. Volcano plot depicting metabolite differences based
  on univariate statistical analysis, in which differential metabolites (points with
  red highlight) in the right top corner are increased in LLC and differential metabolites
  (points with blue highlight) in the left top corner are decreased in LLC compared
  with L_LN6. 1F. Heatmap of significantly altered metabolites. 1G-H. Pathway enrichment
  analysis using pathway-associated metabolite sets (SMPDB) (G) and pathway analysis
  bubble plot (H) reveal upregulated and downregulated metabolic pathways in L-LN6
  relative to LLC
