caption: This figure depicts the disrupted metabolic pathway caused by mutant IDH
  enzyme activity, emphasizing its cascading effects on epigenetic regulation and
  neurotransmitter balance. Under normal physiological conditions, isocitrate is converted
  into α-ketoglutarate (α-KG), a vital cofactor for DNA and histone demethylation
  enzymes. However, in IDH-mutant gliomas, the enzyme undergoes abnormal dimerization,
  resulting in excessive production of 2-hydroxyglutarate (2-HG), an oncometabolite
  that profoundly alters gene expression. As 2-HG accumulates, it functions as a competitive
  inhibitor of α-KG-dependent dioxygenases, such as TET DNA demethylases and Jumonji-domain
  histone demethylases. This inhibition promotes global DNA and histone hypermethylation,
  locking tumor cells into a state of transcriptional repression. The silencing of
  genes involved in serotonergic, glutamatergic, and neuroplasticity-related pathways
  contributes to the mood disturbances, cognitive rigidity, and emotional flattening
  characteristic of Glioma-Associated Depression (GADep)
