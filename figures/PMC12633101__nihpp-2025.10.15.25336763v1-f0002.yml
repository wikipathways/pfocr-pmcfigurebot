figure_title: (A) Gene set enrichment scores to the 50 MSigDB Hallmark Gene Sets were
  calculated for BAL and nasal swabs together (gsva).
caption: '(A) Gene set enrichment scores to the 50 MSigDB Hallmark Gene Sets were
  calculated for BAL and nasal swabs together (gsva). Enrichment scores for each gene
  set pair were then correlated within BAL and within nasal swabs using Spearman rank-based
  correlation and plotted on the y- and x-axes, respectively. To contrast BAL and
  nasal correlations, correlation values were transformed to Z-scores (Fisher transformation)
  and the difference in Z-scores divided by the standard error of the difference is
  reported as ΔZ-score (dot shading, ddcor). Blue shaded dots indicate greater correlation
  in BAL than nasal; purple shaded dots indicate similar correlation in BAL and nasal;
  pink shaded dots indicate greater correlation in nasal than BAL. (B) Top: An example
  of similarly correlated gene sets in both BAL and nasal is depicted. Enrichment
  scores to Hallmark Inflammatory Response and Hallmark Hypoxia are positively correlated
  in both BAL and in nasal swabs. Bottom: An example of differently correlated gene
  sets in BAL and nasal swabs is depicted. Enrichment scores to Hallmark IL6/JAK/STAT3
  signaling and Hallmark DNA Repair are positively correlated in BAL but not correlated
  in nasal swabs. (C) Top left: For each gene detected in both body sites (n=15,114),
  Spearman rank-based correlation was calculated for normalized gene expression between
  BAL and nasal swab pairs. A density distribution is plotted showing the distribution
  of Spearman rho values. Top right, Bottom left, Bottom right: Normalized expression
  of CXCL8, gene set enrichment score to the Hallmark Hypoxia Pathway, and imputed
  Neutrophil Fractions are plotted for BAL (y-axis) and nasal swabs (x-axis) with
  Spearman correlation listed in gray'
