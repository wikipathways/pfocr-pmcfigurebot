caption: (A) Normalized expression dynamics in retinal Müller cells at OIR P14 between
  WT and Nrf2 deficient mice (n=4) are shown in a heat map. (B) Volcano plot showing
  985 down-regulated and 269 up-regulated genes in Nrf2-deficient Müller cells compared
  to WT Müller cells. (C and D) Pathway analysis showing the top 10 most enriched
  up-regulated and down-regulated canonical pathways in Nrf2-deficient Müller cells
  compared to WT Müller cells from OIR retinas at P14. (E) Analysis of variant genes
  in Ribotag-WT and Müller Nrf2-deficient retina samples using heatmap illustration
