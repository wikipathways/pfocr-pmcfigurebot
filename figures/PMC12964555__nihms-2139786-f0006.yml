figure_title: Human S100A8 and S100A9 homodimers enhance T-cell activation.
caption: Human S100A8 and S100A9 homodimers enhance T-cell activation. (A) Overview
  of the experimental approach. CD3+ and CD8+ T cells were isolated by negative selection
  (see Materials and Methods) and T cells of each healthy donor were cultivated in
  the presence of interleukin (IL) 2. CD3+ T cells were additionally activated with
  anti-CD3/28. Cells were stimulated with S100A8, S100A9, and S100A8/S100A9 (1:1),
  while vehicle served as a control. Surface markers were analyzed after 24 hours,
  and intracellular cytokine staining was performed after 48 hours of stimulation
  by flow cytometry. Results are normalized to vehicle and depicted as percentage
  change relative to control. Effector memory TEM were defined as CD62L−/CD45RO+,
  and CD25 and CD69 were used as activation markers. CD8+ T cells were additionally
  analyzed by bulk RNA sequencing and Western blot. FACS, fluorescence-activated cell
  sorter. Image was created in https://BioRender.com. (B and C) Quantification of
  activated CD4+ T cells after stimulation with S100A8, S100A9, and S100A8/S100A9
  (1:1) for 24 hours (n = 6/6/6/6; Kruskal-Wallis test with Dunn’s correction; median
  shown). (D) Quantification of effector memory CD4+ T cells after stimulation with
  S100A8, S100A9, and S100A8/A9 for 24 hours (n = 6/6/6/6; Kruskal-Wallis test with
  Dunn’s correction; median shown). (E and F) Quantification of activated CD8+ T cells
  after stimulation with S100A8, S100A9, and S100A8/S100A9 (1:1) for 24 hours (n =
  6/6/6/6; Kruskal-Wallis test with Dunn’s correction; median shown). (G) Quantification
  of effector memory CD8+ T cells after stimulation with S100A8, S100A9, and S100A8/S100A9
  (1:1) for 24 h (n = 6/6/6/6; Kruskal-Wallis test with Dunn’s correction; median
  shown). (H) Quantification of intracellular granzyme B (GrzB) in CD8+ T cells after
  stimulation with S100A8, S100A9, and S100A8/S100A9 (1:1) for 48 h (n = 6/6/6/6;
  Kruskal-Wallis test with Dunn’s correction; median shown). (I) Quantification of
  secreted IL17A in the supernatant of CD3+ T cells after stimulation with S100A8,
  S100A9, and S100A8/S100A9 (1:1) for 48 hours (n = 6/6/6/6; Kruskal-Wallis test with
  Dunn’s correction; median shown). (J) Heat map showing activity (act) scores (obtained
  with a multivariate linear model) of pathways in CD8+ T cells obtained from healthy
  individuals treated with vehicle, S100A8, S100A9, or S100A8/S100A9 (1:1). The y-axis
  indicates treatment condition, the x-axis indicates regulated pathways. Red indicates
  up-regulation of a pathway relative to vehicle, blue indicates down-regulation.
  Representative immunoblot of CD8+ T cells after S100A8, S100A9 and S100A8/S100A9
  (1:1) stimulation for the (K) nuclear factor (NF)-κB pathway (n = 6) and (L) signal
  transducer and activator of transcription 3 (STAT3) (n = 7). EGFR, epidermal growth
  factor receptor; GAPDH, glyceraldehyde-3-phosphate dehydrogenase; IKK, IκB kinase;
  JAK/STAT, Janus kinase/signal transducer and activator of transcription; MAPK, mitogen-activated
  protein kinase; NFκB, nuclear factor-κB; p-, phosphorylated; PI3K, phosphatidylinositol-3-kinase;
  TGF, transforming growth factor; TNF, tumor necrosis factor; TRAIl, TNF-related
  apoptosis-inducing ligand; VEGF, vascular endothelial growth factor. *P < .05, **P
  < .01, ***P < .001
