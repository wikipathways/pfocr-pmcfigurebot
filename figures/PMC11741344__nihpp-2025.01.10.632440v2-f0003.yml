figure_title: Erythroid cells express molecular machinery for oxygen binding
caption: (a) Schematic illustrating scRNA-sequencing of cells flushed from the injury
  site at 3 dpi (Fx) or the contralateral bone marrow (cBM). We removed dead cells
  and lysed mature red blood cells, but did not digest the samples or sort prior to
  scRNA-seq 24. (b) UMAP and Louvain clustering. Integrated data sets from n = 3 mice
  per group from 3 independent experiments. (c) Cell type annotations based on canonical
  marker expression. (d) Schematic illustration of hemoglobin synthesis 24 and (e,
  f) feature plots of relevant genes on the UMAP. (g) Gene set enrichment analysis
  (GSEA) highlighting upregulated pathways and processes in erythroid cells at the
  injury site compared to cBM. (h) Secondary Louvain clustering of erythroid cells.
  Integrated data sets from n = 3 mice per group from 3 independent experiments. (i)
  Erythroid cell differentiation state annotations based on developmental stage-specific
  marker expression. (j) Frequency of cells in the different clusters normalized to
  the absolute cell count per cluster. Data show individual data points from n = 3
  mice per group from 3 independent experiments and are mean ± s.e.m. P values were
  calculated using two-tailed paired Student’s t-test
article_title: Erythroid precursors regulate local oxygen tension and repair outcomes
  in the bone marrow niche
