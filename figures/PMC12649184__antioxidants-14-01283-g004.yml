caption: Analysis of differentially expressed genes in erastin-induced follicular
  ferroptosis. (A) Transcriptome sequencing data differential gene clustering heat
  map; (B) Differential gene volcano map of transcriptome sequencing data; (C) Venn
  diagram of target genes and transcriptome differential genes of miR-26a predicted
  by Targetscan and miRDB; (D) Enrichment analysis of sequencing differential miRNAs
  KEGG pathway; (E) Cluster analysis of differential genes associated with ferroptosis
  in the transcriptome; (F) The binding site of miR-26a to SLC7A11 was predicted;
  (G) Dual luciferase reports detected miR-26a binding to SLC7A11, 1mimic means 60
  pmol/mL mimics; (H) Correlation analysis of miR-26a and SLC7A11. Data are shown
  as mean ± SD from at least three times biological replicates. ** p < 0.01, *** p
  < 0.001, compared to control
