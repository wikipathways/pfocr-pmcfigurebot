figure_title: Different GPCR subclasses can contribute to or reduce fibrosis.
caption: Different GPCR subclasses can contribute to or reduce fibrosis. Gαq/11 activates
  PI3K and PLC, leading to an increase in Ca2+ and the assembly of actin. Gα12/13
  promotes actin assembly through Rho GTPases and ROCK1/2 signaling. Gαi/o inhibits
  cAMP and activates cell proliferation through the MAPK pathway. Agonists that activate
  GPCRs that are coupled to Gαq, Gα12/13, and Gαi/o G protein subclasses lead to fibrotic
  gene expression through YAP/TAZ and MRTF-A nuclear localization. Conversely, agonists
  that activate GPCRs that are coupled to Gαs produce cAMP. This promotes destabilized
  actin and sequesters YAP/TAZ and MRTF-A. cAMP signaling activates PKA and Epac.
  PKA canonically activates CREB, which promotes cathepsin gene expression and also
  phosphorylates v-ATPases, which acidifies lysosomes. cAMP stimulates Epac as well,
  which promotes Rap1 activity to increase collagen recognition and β1 integrin activation
article_title: Integration of cAMP and TRPV4 Signaling to Optimize Collagen Remodeling
