caption: 'Gm-PBM intervention remodels gut microbiota composition and function in
  APPswe/PS1dE9 mice. (A) Venn diagram showing the shared and unique ASVs among four
  groups: WT, AD, tc-PBM, and gm-PBM C. (B–D) Differential microbial biomarkers identified
  by linear discriminant analysis (LDA, LDA score >3.0): (B) Comparison between WT
  and AD; (C) Comparison between gm-PBM and AD; (D) Comparison between tc-PBM and
  AD. (E–G) Bar plots showing the relative abundance of representative bacterial genera:
  (E) WT vs. AD; (F) AD vs. gm-PBM; (G) AD vs. tc-PBM. (H,I) (mean ± SD, n = 5/group)
