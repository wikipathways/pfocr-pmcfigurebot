figure_title: CCT2 enhances HCC glycolysis and tumorigenesis via ALDOA stabilization.
caption: CCT2 enhances HCC glycolysis and tumorigenesis via ALDOA stabilization. (A)
  Protein expression of CCT2 and ALDOA in Huh7 and HCCLM3 cells transfected with si-NC,
  si-CCT2-1, and si-CCT2-2, determined by western blot analysis. (B) Cycloheximide
  (CHX) (200 μg/mL) chase assay to assess ALDOA degradation, determined by western
  blot analysis in Huh7 and HCCLM3 cells transfected with si-NC and si-CCT2-1. (C)
  Protein expression of CCT2 and ALDOA in Huh7 and HCCLM3 cells transfected with si-NC
  and si-CCT2-1, treated with or without MG132 (15 μM), determined by western blot
  analysis. (D) Ubiquitination of ALDOA detected by western blot analysis of ubiquitin,
  CCT2, and ALDOA in Huh7 and HCCLM3 cells transfected with si-NC or si-CCT2. (E)
  Venn diagram showing overlap between ALDOA-interacting proteins identified by co-immunoprecipitation
  coupled with mass spectrometry and known ALDOA interactors from the BioGRID database,
  identifying TRIM21 and TRIM25 as candidate E3 ubiquitin ligases. (F) Co-IP assays
  showing interactions between ALDOA and TRIM21 or TRIM25 in control and CCT2-overexpressing
  cells. (G) Co-IP assays showing increased binding of TRIM21 to ALDOA upon CCT2 knockdown
  in Huh7 cells. (H) Ubiquitination assay of ALDOA in cells transfected with indicated
  constructs, showing that CCT2 knockdown enhances TRIM21-mediated ubiquitination
  of ALDOA. (I) Targeted metabolite analysis in shNC- and shCCT2-transfected Huh7
  cells (n = 3) (Metabolites with P < 0.05 are shown). (J) Quantification of G3P,
  DHAP, lactate, and G6P detected by targeted metabolite analysis in shNC- and shCCT2-transfected
  Huh7 cells (n = 3). (K) Diagram illustrating significant changes in the indicated
  metabolites in the glycolysis pathway, identified after CCT2 knockdown by targeted
  metabolite analysis, with ALDOA shown (green downward arrows indicate significantly
  downregulated metabolites or proteins). (L) ECAR assay for glycolytic metabolism
  assessment of oeNC- and oeCCT2-transfected Hep3B cells with or without si-ALDOA
  treatment (n = 3). (M) Glucose uptake assay in oeNC- and oeCCT2-transfected Hep3B
  cells with or without si-ALDOA treatment (n = 3). (N) Lactate detection assay in
  oeNC- and oeCCT2-transfected Hep3B cells with or without si-ALDOA treatment (n =
  3). Differences were analyzed by Student's t-test or ANOVA. After ANOVA, Tukey's
  post-hoc test was used for multiple comparisons. Three biological replicates were
  performed for cell experiments. Data are presented as mean ± SD. CHX, cycloheximide;
  Ub, ubiquitin; G6P, glucose-6-phosphate; F6P, fructose-6-phosphate; F1,6BP, fructose-1,6-bisphosphate;
  G3P, glyceraldehyde-3-phosphate; DHAP, dihydroxyacetone phosphate; 1,3BPG, 1,3-bisphosphoglycerate;
  3PG, 3-phosphoglycerate; 2PG, 2-phosphoglycerate; PEP, phosphoenolpyruvate. ns,
  not significant, *P < 0.05, ** P < 0.01, *** P < 0.001
