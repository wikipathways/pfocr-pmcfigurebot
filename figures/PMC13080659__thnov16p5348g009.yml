figure_title: Lung microbiota coordinates AM and γδ T cell activation against K.
caption: Lung microbiota coordinates AM and γδ T cell activation against K. pneumoniae
  via SCFA-FFAR2 axis. Regulatory mechanism of SCFA-FFAR2 signaling in AMs. Lung microbiota-derived
  SCFAs, particularly acetate, orchestrate AM and γδ T cell activation to enhance
  host defense against K. pneumoniae lung infection. Acetate engages FFAR2 on AMs
  to activate the PKA-NF-κB signaling pathway, enhancing NF-κB phosphorylation, pro-IL-1β
  production, and inflammasome activation, which together increase IL-1β secretion
  and amplify downstream immune responses. This cascade subsequently promotes IL-17A
  production from γδ T cells, thereby driving neutrophil-mediated defense and preserving
  epithelial barrier integrity to protect against infection. In contrast, vancomycin-induced
  lung dysbiosis lowers pulmonary SCFA levels, thereby dampening this immune network
  and impairing resistance to K. pneumoniae infection
article_title: Lung dysbiosis disrupts an FFAR2-mediated innate immune circuit against
  Klebsiella pneumoniae
