figure_title: Model summarizing the effects of LLGL1 loss in Huh-7 cells.
caption: 'Model summarizing the effects of LLGL1 loss in Huh-7 cells. Schematic summary
  of the major signaling, molecular, and phenotypic changes observed following LLGL1
  loss in Huh-7 cells, summarizing experimental findings on EGFR/MAPK pathway activity,
  EMT-associated marker expression, and cellular behaviors. (A) LLGL1 ablation enhances
  EGFR/RAS/MAPK signaling upon EGF stimulation, reflected by increased phosphorylation
  of EGFR at Tyr1068 and Tyr1173 and downstream activation of the RAF1-MEK1/2-ERK1/2-RSK1-3
  cascade. These signaling alterations are associated with increased proliferative
  output observed in LLGL1 KO cells. (B) LLGL1 loss is accompanied by remodeling of
  EMT-associated marker protein levels, including increased E-Cadherin and ZO-1, reduced
  mesenchymal markers (N-Cadherin and Vimentin), and reduced nuclear ZEB1, together
  with increased cell motility. Red arrows indicate relative increases, green arrows
  indicate relative decreases, and dashed arrows indicate indirect or downstream relationships.
  GDP: Guanosine diphosphate; GTP: Guanosine triphosphate; p: phosphorylation. Adapted
  from Servier Medical Art (https://smart.servier.com accessed on 28 February 2026),
  licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/ accessed
  on 28 February 2026)'
