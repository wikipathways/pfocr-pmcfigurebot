figure_title: Main cellular pathways in LSDs.
caption: 'Main cellular pathways in LSDs. Genetic mutations in distinct molecular
  components of the lysosomal system lead to four mechanistic classes of dysfunction:
  (1) enzymatic hydrolytic defects, where loss of specific hydrolases causes substrate
  accumulation; (2) transporter-related defects, impairing metabolite exchange and
  leading to osmotic and lipid imbalances; (3) niogenesis and signaling defects, involving
  mis-sorting or defective maturation of lysosomes; and (4) cross-organelle interaction
  defects, in which lysosomal stress disrupts communication with mitochondria, ER
  and the autophagy machinery. Created with BioRender.com (https://www.biorender.com,
  accessed on 10 November 2025)'
