caption: Effects of BRC on wrinkle formation-related signaling pathways in UV-irradiated
  HS27 cells. (A) Western blot images showing JNK/c-Fos/c-Jun and MMP-related protein
  expression. (B–D) Quantification of JNK, c-Fos, and c-Jun phosphorylation. (E–H)
  Expression of MMP-1, MMP-2, MMP-3, and MMP-9. (I) Collagen I levels. (J) Phosphorylation
  of Smad3. (K–M) mRNA expression of TGF-βR1, PCOLCE, and pro-collagen type I. Data
  are presented as mean ± SD (n = 3). Different letters indicate significant differences
  (p < 0.05). NC, normal control; C, UVB irradiation; PC, UVB irradiation + 100 μg/mL
  of L-ascorbic acid; BRC50, UVB irradiation + 50 μg/mL of BRC; BRC100, UVB irradiation
  + 100 μg/mL of BRC; BRC200, UVB irradiation + 200 μg/mL of BRC
