figure_title: HSAT expression regulates TF/FVIIa activity and thrombin-induced PAR1
  activation through AT
caption: (A) Schematic showing the known targets of AT in the coagulation cascade
  and the proposed effect of the thrombin (FIIa) on tumor function via PAR1 activation
  and subsequent intracellular activation of the MAPK/ERK pathway. Created in BioRender
  (https://BioRender.com/wqk7st3). (B) AT inhibits TF/FVIIa activation on WT but not
  on HS3ST1–/– cells. (C) Titration of AT in the TF/FVIIa inhibition assay. (D) AT
  inhibits thrombin generation and PAR1 activation. (E) Quantification of the data
  in D after normalization to nontreated control (NT). Graph shows mean ± SEM. Statistical
  analysis by 2-way ANOVA with Šidák’s multiple-comparison correction. ***P ≤ 0.001;
  NS, not significant. Full statistical analysis shown in Supplemental Table 1. T-Erk,
  total Erk; ProT, Prothrombin; NT, no treatment
