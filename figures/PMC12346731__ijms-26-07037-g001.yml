caption: 'Experimental design flowchart. Legend. Patients (N = 45) were divided into
  2 groups: non-xerostomic control subjects (NX-group) consisting of 5 males and 13
  females and xerostomic patients (XP-group) consisting of 27 females. Dried saliva
  spot samples were collected from the left parotid, right parotid, and submandibular
  salivary glands, for a total of 135 saliva samples. Proteomic analysis identified
  a total of 1407 proteins across all three salivary gland sites, followed by the
  identification of differentially expressed proteins (DEPs) for each salivary gland.
  Statistical analysis revealed 86 DEPs in the left parotid, 112 in the right parotid,
  and 73 in the submandibular glands, which were subsequently used as input genes
  to create protein–protein interaction (PPI) networks from The Search Tool for Recurring
  Instances of Neighboring Genes (STRINGv12.0) for each gland site. The right parotid
  network resulted in 29 output genes with a confidence level of 0.90 (p = 8.86 ×
  10−5) and the submandibular network resulted in 31 output genes with a confidence
  level of 0.70 (p = 7.98 × 10−12). The Kyoto Encyclopedia of Genes and Genomes (KEGGv112.1)
  was used for pathway analysis'
