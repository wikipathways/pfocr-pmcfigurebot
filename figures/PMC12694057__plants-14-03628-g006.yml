caption: 'Overexpression of VgPIP1;2 induces changes in gene expression and abundance
  of metabolites related to N and C metabolism in rice roots. Schematic representation
  of nitrogen (A) and carbon metabolism (B), highlighting nitrate and ammonium uptake,
  amino acid synthesis and trehalose biosynthetic pathways. Heat maps represent the
  relative abundance of genes or metabolites in OE-3 line compared to WT genotype.
  Names written in red, blue or black indicate genes and metabolites significantly
  upregulated, downregulated or invariable, respectively, in OE-3 plants (p < 0.05).
  Names written in rectangles represent enzymes or transporters, while names outside
  rectangles represent metabolites within each pathway. NRT: NITRATE TRANSPORTER,
  AMT: AMMONIUM TRANSPORTER, NR: NITRATE REDUCTASE, NIR: NITRITE REDUCTASE, GS: GLUTAMINE
  SYNTHETASE, GOGAT: GLUTAMATE SYNTHASE, ASPAT: ASPARTATE AMINOTRANSFERASE, GAD: GLUTAMATE
  DECARBOXYLASE, INV: INVERTASE, SUS: SUCROSE SYNTHASE, TPS: TREHALOSE 6-PHOSPHATE
  SYNTHASE, TPP: TREHALOSE 6-PHOSPHATE PHOSPHATASE, Gln: glutamine, Glu: glutamate,
  Asp: aspartate, GABA: gamma-aminobutyric acid, Ser: serine, Ala: alanine, Gly: glycine,
  Pro: proline, Val: valine, Thr: threonine, Ile: isoleucine, Phe: phenylalanine,
  2-OG: 2-oxoglutarate'
