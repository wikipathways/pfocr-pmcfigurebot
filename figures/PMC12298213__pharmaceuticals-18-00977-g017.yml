figure_title: Therapeutic mechanism of AD808 in the mouse model of Alzheimer’s disease.
caption: Therapeutic mechanism of AD808 in the mouse model of Alzheimer’s disease.
  The superior therapeutic effect of AD808 stems from the synergistic action of ST707
  and gh625-Zn7MT3. gh625-Zn7MT3 regulates metal homeostasis by chelating excess Cu2+,
  reducing Cu(II) to Cu(I) and forming a stable non-toxic gh625-Cu(I)4Zn4MT3 complex,
  inhibiting Aβ aggregation. Cu-bound MT3 is metabolized in ER, restoring brain homeostasis.
  ST707 activates the STING/IRF3 pathway, upregulating TREM2, which binds DAP12 to
  enhance Aβ clearance and neuroprotection. AD808 activates the STING/IRF3 pathway,
  upregulating TREM2, which binds DAP12 to enhance Aβ clearance and neuroprotection.
  Phosphorylated IRF3 also activates the PI3K/AKT pathway under hypoxia, regulating
  the balance of M1/M2 ratios and promoting microglial polarization toward the anti-inflammatory
  M2 phenotype. M2 microglia secrete anti-inflammatory cytokine (e.g., IL-4, IL-10),
  suppressing inflammatory responses, and neurotrophic factor production (e.g., BDNF,
  GDNF) enhancing axonal regeneration and facilitating the repair and functional remodeling
  of injured neurons. Figure Created in BioRender (Premium). (https://app.biorender.com/illustrations/682a852af77e4e38e90dc000?slideId=a44ed1b1-eb3a-4e04-bc9b-8d7ba86332b8,
  accessed on 30 March 2025)
