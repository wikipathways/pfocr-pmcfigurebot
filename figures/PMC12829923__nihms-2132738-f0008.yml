figure_title: NF-YB relocalization activates new molecular pathways
caption: (A) GREAT enrichment analysis of menin and NF-YB direct targets based on
  their binding status (lost, stable, or gained) using the hallmark gene set comparing
  HLF cells treated with SNDX-5613 to those treated with DMSO.(B) Logarithmic differential
  gene expression analysis based on menin and NF-YB binding status to the corresponding
  nearest gene in HLF cells treated with SNDX-5613 to DMSO.(C) mRNA expression in
  HLF NTC or NFYBKO cells after 4 or 10 days of SNDX-5613 treatment (5 μM), as assessed
  by RT-qPCR and normalized to DMSO control. Bar graphs represent the mean of measurements
  of 2 technical replicates. Error bars represent the SD. *p ≤ 0.05, **p ≤ 0.01, ***p
  ≤ 0.001, and ****p ≤ 0.0001 were calculated using a Student’s t test.(D) Examples
  of CUT&RUN tracks showing distribution of ATAC-seq open chromatin, NF-YB, menin,
  and H3K27me3 binding in HLF cells treated with SNDX-5613
