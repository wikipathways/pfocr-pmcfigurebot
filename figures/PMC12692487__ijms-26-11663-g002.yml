figure_title: Inflammatory pathways in myocardial infarction affected by obesity and
  related disorders.
caption: 'Inflammatory pathways in myocardial infarction affected by obesity and related
  disorders. In acute MI, damage-associated molecular patterns (DAMPs) are released
  from injured myocardium and bind to and activate pattern recognition receptors (PRRs)
  on resident cardiac cells. PRR-signaling leads to NF-kB and inflammasome activation
  with subsequent generation of pro-inflammatory cytokines, including IL-6, TNF-α,
  and IL-1β. At the onset of reperfusion, the Reperfusion Injury Salvage Kinase (RISK)
  pathway is activated, which consists of a cluster of prosurvival kinases, including
  PI3K-Akt, and MEK-ERK1/2, activated upon restoration of blood flow after ischemia
  to protect cardiomyocytes from apoptotic cell death. Obesity leads to a chronic
  low-grade inflammatory state with elevated cytokine levels in adipose tissue and
  systemically (leptin, IL-6, IL-1β, TNF-α), which activate circulating immune cells
  and cardiac resident cells. In the context of MI, increased leptin expression and
  release activate the leptin receptor, which lacks intrinsic kinase activity and
  recruits JAK(2) to its intracellular domain, which in turn can activate several
  intracellular canonical signaling pathways, depending on the context. In the early
  phase of I/R, leptin exerts cardioprotection via PI3K and STAT3 activation. In later
  phases of MI, chronic leptin signaling shifts toward pro-inflammatory and pro-fibrotic
  pathways via STAT3–JAK2 and via MAPK/ERK. In contrast, AMPK activation in obesity
  reduces MAPK activation during I/R and improves cardiomyocyte mitochondrial function.
  The pink arrows indicate where the negative obesity-related impact occurs. Abbreviations:
  CCL2 C-C Motif Chemokine Ligand 2, ROS reactive oxygen species, IL-1β Interleukin-1
  beta, TNF-α Tumor necrosis factor alpha, IL-6 Interleukin-6, JAK/STAT Janus kinase/signal
  transducer and activator of transcription signaling pathway, MAPK Mitogen-activated
  protein kinase, PI3K Phosphoinositide 3-kinase, AMPK adenosine monophosphate-activated
  protein kinase, P phosphorylation, DAMPS Damage-associated molecular patterns, NF-κB
  Nuclear factor kappa B, RISK reperfusion injury salvage kinase, GPCR G protein-coupled
  receptor, MEK MAPK/ERK kinase mitogen-activated protein kinase/extracellular signal-regulated
  kinases, ERK1/2 extracellular signal-regulated kinase, AKT Protein kinase B, GSK3β
  Glycogen synthase kinase-3 beta, SR sarcoplasmic reticulum, PRR Pattern Recognition
  Receptor. Created in BioRender. Geerkens, L. (2025) https://BioRender.com/q4bugfd
  (accessed on 26 August 2025)'
