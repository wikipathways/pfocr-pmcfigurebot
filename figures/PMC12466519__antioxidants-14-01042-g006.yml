figure_title: Identification of key signaling pathways and candidate genes under carbonate
  alkalinity exposure in the ovary.
caption: Identification of key signaling pathways and candidate genes under carbonate
  alkalinity exposure in the ovary. (A) Gene–pathway enrichment network maps constructed
  by targeting Focal adhesion, ECM–receptor interaction, PI3K-Akt signaling pathway,
  and Relaxin signaling pathway pathways in the F0 vs. F10 group; (B–D) Network regulation
  maps of key candidate genes and pathway constructs in the three comparison groups
  of F0 vs. F10, F0 vs. F25, and F10 vs. F25; (E) Expression heatmap of common DEGs
  in shared–enriched pathways; (F) Protein–protein interaction (PPI) network maps
  constructed based on the candidate gene sets. Green arrows indicated the downregulation
  of gene expression, all heatmaps with log2 Fold change (FC) value as legend, hub
  genes were highlighted in orange. (For interpretation of the references to colour
  in this figure legend, the reader is referred to the web version of this article.)
