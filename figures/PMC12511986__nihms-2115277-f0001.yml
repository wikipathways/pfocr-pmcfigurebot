figure_title: Centromere dynamics in the germline and embryonic development.
caption: 'Centromere dynamics in the germline and embryonic development. (a) Premeiosis:
  In GSCs within the niche (left), larger and smaller centromeres (black circles)
  form by asymmetric enrichment of centromere proteins and align between asymmetrically
  distributed spindle microtubules (green). During asymmetric division (middle), larger
  and smaller centromeres segregate into self-renewed GSCs or differentiating cells,
  respectively. Sixteen-cell cyst schematic (right) represents a developmental stage
  in Drosophila gametogenesis when homologous centromeres are paired via SC proteins
  (lines between black circles). (b) Meiosis: in Drosophila males, premeiotically
  paired centromeres (black circles) are sequestered into nuclear territories (left)
  at S2b stage of spermatocyte development before unpairing and dissociation at S5/S6
  stages (right). In Drosophila females, centromeres cluster in zygotene (left) and
  remain paired through pachytene (right). In mouse males, centromeres are clustered
  in chromocenters (left), then chromosome arms pair in zygotene (middle), followed
  by centromere pairing, which persists beyond SC disassembly between chromosome arms
  (right). In mouse females, aging oocytes lose cohesins and protective Sgo2 (blue
  mesh), resulting in increased distance between sister chromatids and their biorientation
  at MI, and premature sister chromatid separation at metaphase MII. For simplicity,
  crossing over events are not depicted. (c) Post-meiosis: In round spermatids (left),
  centromeres form a prominent chromocenter. As spermatids elongate (middle), CENP-A
  nucleosomes at the centromeres (orange balls) are retained, while histone H3 nucleosomes
  (gray balls) are replaced by protamines (purple balls). By the mature sperm stage
  (right), centromeres cluster. (d) Mouse embryo: (Top) Differential centromere size
  can be epigenetically inherited from the gametes to the zygote (left). By the four-cell
  stage (middle), these differences are equalized if parental centromeres have similar
  abundance of DNA satellite repeats. During this plastic phase (blue box), a genetic
  pathway for CENP-A chromatin assembly is dominant over the epigenetic pathway that
  typically maintains centromere chromatin. (Bottom) Genetic and epigenetic pathways
  of CENP-A chromatin assembly. In the genetic pathway (left), CENP-B binds centromeric
  satellites (triangles) and recruits CENP-C to initiate assembly of new CENP-A nucleosomes.
  In the epigenetic pathway (right), pre-existing CENP-A binds CENP-C to assemble
  new CENP-A nucleosomes'
