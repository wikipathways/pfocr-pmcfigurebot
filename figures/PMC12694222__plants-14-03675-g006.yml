figure_title: GO enrichment analysis of candidate genes in the C.
caption: 'GO enrichment analysis of candidate genes in the C. canephora Intermediate
  population. The analysis was performed on genes associated with the top 100 predictive
  SNPs from the Bootstrap Forest models for various trait combinations. (a) For the
  green bean yield trait, the analysis reveals a strong enrichment for pathways involved
  in the regulation of the actin cytoskeleton. (b) Combining coffee bean production
  and green bean yield traits retains the actin-related terms and introduces significant
  enrichment for signaling pathways, including ‘response to salicylic acid’. (c) The
  analysis of all three traits combined (coffee bean production, green bean yield,
  and leaf rust incidence) reinforces the importance of defense-related signaling
  (‘salicylic acid mediated signaling pathway’, ‘regulation of defense response’)
  alongside the persistently significant actin regulation pathways. In all plots,
  the x-axis represents the fold enrichment, the point size corresponds to the number
  of genes, and the color indicates statistical significance based on the −log10(FDR).
  Abbreviations used: reg., regulation; proc., process'
