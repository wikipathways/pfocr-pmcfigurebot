caption: 'Schematic representation of ovarian torsion pathophysiology and key predictors.
  The diagram illustrates the anatomical predisposition favoring right-sided torsion
  due to the longer meso-ovarium and greater mobility of the right ovary, contrasted
  with the stabilizing effect of the sigmoid colon on the left. It integrates the
  study’s key findings: Nulliparity (VIRGO status) and Cyst Presence act as independent
  predictors that significantly reduce the probability of left-sided torsion. The
  presence of a cyst increases ovarian weight and volume, a key mechanical factor.
  The final common pathway involves the twisting of the vascular pedicle, leading
  sequentially to venous and lymphatic obstruction, arterial compromise, and ultimately
  ovarian ischemia and necrosis if not promptly intervened (Created by the authors
  for this manuscript)'
