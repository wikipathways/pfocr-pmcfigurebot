figure_title: Integrated model of lysosomal chemistry governing anticancer drug fate.
caption: Integrated model of lysosomal chemistry governing anticancer drug fate. Weak-base
  drugs enter cells and accumulate in lysosomes through pH-dependent trapping driven
  by the V-ATPase proton pump. The acidic lumen (pH 4.5–5) promotes protonation of
  weak bases and provides favorable conditions for Fenton and Fenton-like reactions
  involving labile Fe or Cu, which generate reactive oxygen species (ROS). Antibody–drug
  conjugates (Ab–linker–payload) are internalized via endocytosis and encounter progressive
  acidification along the endosomal–lysosomal pathway, facilitating cleavage of acid-labile
  linkers and controlled release of the cytotoxic payload. Together, pH, metal-driven
  redox chemistry, and pH- or enzyme-triggered bond cleavage converge to regulate
  drug sequestration, activation, efficacy, and lysosome-dependent cell death. Created
  in BioRender. Dharmasivam, M. (2025) https://app.biorender.com/68e337b54289dc9ed50e4581
  (accessed on 12 October 2025)
