figure_title: Discovery of Mouse model of AsymAD
caption: (a) Boolean AD model derived from human dataset was tested in five different
  mouse models of AD. Bar plots shows the sample ordering of the composite score from
  low to high. WT samples are color coded with green and AD samples are color coded
  with yellow. ROC-AUC and p value from a two-sided unpaired T-test with unequal variance
  is shown for each dataset. (b) WT and APP23 (+/−) AD samples are compared in four
  different age groups (1.5, 6, 18, 24 months; GSE8046). The results are visualized
  using bar plots and ROC-AUC and p value from a two-sided unpaired T-test with unequal
  variance is shown for each dataset. (c) WT and 5xFAD AD samples are compared in
  four different age groups (4, 8, 12, 18 months; GSE168137) and two different tissues
  (Hippocampus and cortex). The results are visualized in a Bubble plot. Bubble size
  corresponds to ROC-AUC, significance of p values are shown as *** (p < 0.001), **
  (p < 0.01), * (p < 0.05), ‘.’ (p < 0.1). (d) Bar, violin plot, ROC-AUC and T-tests
  were performed using the Boolean AD model composite score on a dataset with PFC
  samples from five different groups of mice (WT, PS19, CgA-KO/PS19 Female, CgA-KO/PS19
  Male, CgA-KO). P values shown are based on two-sided unpaired T-tests with unequal
  variance comparing WT vs the other four groups of mice. (e) Bar, violin plot, ROC-AUC
  and T-tests were performed using the composite score of genes described in the MSigDB
  GOBP INFLAMMASOME MEDIATED SIGNALING PATHWAY on a dataset with PFC samples from
  four different groups of mice (PS19, CgA-KO/PS19 Female, CgA-KO/PS19 Male, CgA-KO).
  P values shown are based on two-sided unpaired T-tests with unequal variance. (f)
  Boolean AD model discover that CgA-KO/PS19 Male mice PFC tissue have the AD disease
  states without any symptoms of the AD. Thus, this may represent the world’s first
  mouse model of the human AsymAD
