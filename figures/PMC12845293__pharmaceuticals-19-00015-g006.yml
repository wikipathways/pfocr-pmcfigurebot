figure_title: 7-KLCA inhibits TGF-β/Smad and Wnt/β-catenin signalling pathway.
caption: 7-KLCA inhibits TGF-β/Smad and Wnt/β-catenin signalling pathway. (A) The
  expressions of TGF-β, Smad2, and Smad3 in the kidneys of mice based on WB analysis
  (n = 6). (B–D) Quantitative analysis of (A). Data represent the ratio of TGF-β/Smad2/Smad3
  band intensity to GAPDH (loading control), normalized to the UUO group. (E) The
  expressions of Wnt5a/b, β-catenin, and Axin1 in the kidneys of mice based on WB
  analysis (n = 6). (F–H) Quantitative analysis of (E). Data represent the ratio of
  Wnt5a/b/β-catenin/Axin1 band intensity to GAPDH (loading control), normalized to
  the UUO group. (I) The expressions of TGF-β, Smad2, and Smad3 in the kidneys of
  mice based on WB analysis (n = 6). (J–L) Quantitative analysis of (I). Data represent
  the ratio of TGF-β/Smad2/Smad3 band intensity to GAPDH (loading control), normalized
  to the Ade group. (M) The expressions of Wnt5a/b, β-catenin, and Axin1 in the kidneys
  of mice based on WB analysis (n = 6). (N–P) Quantitative analysis of (M). Data represent
  the ratio of Wnt5a/b/β-catenin/Axin1 band intensity to GAPDH (loading control),
  normalized to the Ade group. Results are mean ± SD of at least six independent experiments.
  * p < 0.05, ** p < 0.01, *** p < 0.001
