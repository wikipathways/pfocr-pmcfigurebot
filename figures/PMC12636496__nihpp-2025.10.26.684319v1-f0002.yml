figure_title: Blood transcriptome perturbation and pathways, biological processes,
  and gene sets modulated in symptomatic and asymptomatic TB
caption: (A) Box and whisker plots showing molecular distance to health, a composite
  score that quantifies transcriptome-wide deviation from healthy controls, integrating
  both the number and magnitude of significantly regulated gene transcripts. On the
  left are Household Contact (HHC) Screening participants without TB, with asymptomatic
  TB or symptomatic TB. In the middle are Community Screening participants without
  TB, with asymptomatic TB or symptomatic TB. On the right are Clinic Triage participants
  without TB or bacteriologically-confirmed symptomatic TB. The horizontal lines indicate
  the median, the boxes the interquartile range (IQR) and the whiskers the range of
  data with 1.5 × IQR from the lower and upper quartiles. The shown p-value was computed
  with the Mann-Whitney U test. (B) Differential gene set enrichment analysis using
  QuSAGE on blood RNA-sequencing data, for the gene sets/modules listed on the left,
  from individuals with asymptomatic TB or symptomatic TB, relative to TB-negative
  controls, in the HHC Screening Cohort (left), Community Screening Cohort (middle),
  and Clinic Triage Cohort. Dots denote the enrichment score estimate and error bars
  the 95% confidence interval. The order of the gene sets is based on ranking from
  highest to lowest enrichment score estimates in prevalent TB (symptomatic and asymptomatic
  combined) from the HHC Screening Cohort
