figure_title: Activation of endothelial cells with their respective interactions with
  immune cells, molecules and factors during sepsis.
caption: Activation of endothelial cells with their respective interactions with immune
  cells, molecules and factors during sepsis. ECs can be activated by PAMPs and cytokines
  through TLR and cytokine receptors, respectively. This activates the transcription
  factor NF-kB for higher expression of proinflammatory cytokines. The activated ECs
  also express von Willebrand factor for platelet binding, together with ICAM-1, VCAM-1,
  E-selectin and P-selectin for leukocyte recruitment and binding. The recruited immune
  cells will secrete proteases and ROS to increase endothelial permeability and induce
  EC apoptosis. The apoptotic ECs will also secrete ROS, which can elevate procoagulant
  TF expression and diminish anticoagulant TM and TFPI expressions. Together with
  the activated platelets, the thrombus formation is facilitated. PAMPs, pathogen-associated
  molecular patterns; TLR, Toll-like receptor; NF-kB, nuclear factor kappa B; ICAM-1,
  intercellular adhesion molecule 1; VCAM-1, vascular cell adhesion molecule 1; EC,
  endothelial cell; ROS, reactive oxidative species; TF, tissue factor; TM, thrombomodulin;
  TFPI, tissue factor pathway inhibitor; vWF, von Willebrand factor. (Created in BioRender.
  Huang, C. (2025) https://BioRender.com/3370ji3 accessed on 17 June 2025)
