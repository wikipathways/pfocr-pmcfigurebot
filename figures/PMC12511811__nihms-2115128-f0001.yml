figure_title: Regulatory pathway controlling salivary gland (SG) cell fate specification,
  morphogenesis and physiological function
caption: Shown in dark green are genes required to activate SG cell fates (AP patterning
  genes giant (Gt), hunchback (Hb), Krüppel (Kr), fushi tarazu (Ftz), Sex combs reduced
  (Scr), homothorax (Hth), and extradenticle (Exd); DV patterning gene, dorsal (dl).
  Shown in red are genes that block SG specification (teashirt (Tsh), Abdominal B
  (AbdB), decapentaplegic (Dpp). Within the SG, cells along the ventral midline experience
  EGF signaling, which blocks expression of fork head (Fkh) (gray), limiting Fkh expression
  to only secretory cells (green). In secretory cells, Fkh blocks expression of duct
  genes, including trachealess (Trh), dead ringer (Dri), and Serrate (Ser), while
  maintaining and/or activating secretory cell specific genes. Signaling between Ser-expressing
  duct cells (tan) and Notch-expressing secretory cells (green) specifies the imaginal
  ring cells – the precursors to the adult SG (purple). Trh is required in duct cells
  for tube morphogenesis. Fkh activates expression of senseless (Sens) in secretory
  cells and maintains expression of several secretory-specific genes, including itself,
  sage and CrebA. CrebA boosts expression of secretory pathway component genes (SPCGs),
  as well as X-box binding protein (Xbp1) and Tudor-SN (TSN). Working with Sage and
  Sens, Fkh blocks apoptotic death of the SG and activates expression of the embryonic
  and larval secretome. Both fkh and hückebein (Hkb) are required in secretory cells
  for tube morphogenesis. Known Fkh morphogenetic targets include folded gastrulation
  (Fog), crumbs (Crb) and Arc. Known Hkb targets include both morphogenetic targets
  (klarsicht (Klar) and Crb) and cell cycle genes (E2F transcription factor 1 (e2F1)
  and cyclin E (CycE))
