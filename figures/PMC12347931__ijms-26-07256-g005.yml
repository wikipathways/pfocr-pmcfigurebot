figure_title: Molecular analysis of onion seedlings subjected to control and 60 min
  of c-DBD plasma treatments.
caption: Molecular analysis of onion seedlings subjected to control and 60 min of
  c-DBD plasma treatments. Panels (a–c) depict gene expression patterns linked to
  both growth-promoting and growth-inhibiting functions in the onion seedlings under
  60 min of c-DBD plasma treatment conditions, including the control and 60 min, (a)
  GA3OX1, (b) GA3OX2, (c) ABI5. Panels (d,e) display expression of genes in the phenylpropanoid
  pathway, (d) PAL, (e) 4CL. Panels (f,g) present genes involved in reactive oxygen
  species (ROS) signaling, (f) RBOH1, (g) SOD. Panels (h,i) show protein synthesis-related
  genes, (h) A0A6J0KTF3 and (i) A0A6J0NWX0 Statistical differences between treatment
  groups are indicated as * p < 0.05, ** p < 0.01, and *** p < 0.001 and “ns” denoting
  no significant difference compared to the control group
