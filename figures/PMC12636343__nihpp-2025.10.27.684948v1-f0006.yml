figure_title: Netrin signaling contributes to PLM branch formation in the same pathway
  as TOCA-1
caption: (A) Quantification of PLM branching defects in netrin pathway mutants. Bar
  graph shows mean number of PLM branches per animal for wild-type, single mutants,
  toca-1(tm3334) single mutant, and double mutants combining netrin pathway genes
  with toca-1. Animals were grown at 25°C and scored as L4 larvae using florescence
  microscopy. Single mutants unc-5, unc-6, and unc-40 each show reductions in PLM
  branching compared to wild-type. Double mutants combining unc-5, unc-6 or unc-40
  with toca-1 show a reduction in branching compared to toca-1 single mutants. Statistical
  significance determined by Mann-Whitney U test. n=39–61 animals per condition. Error
  bars represent SEM. ***p<0.001, *p<0.05, n.s.=not significant.(B) Representative
  images of PLM neurons expressing GFP-RAB-3 and cytosolic mRFP in netrin signaling
  mutants. Asterisks indicate synaptic puncta. Images are maximum intensity projections.
  Scale bar=10 μm.(C) Quantification of PVM morphological abnormalities in netrin
  pathway mutants. Bar graph shows percentage of animals with abnormal PVM morphology
  for wild-type, single mutants, toca-1(tm3334) single mutant, and double mutants
  combining netrin pathway genes with toca-1. Animals were grown at 25°C and scored
  as L4 larvae using fluorescence microscopy. Abnormal phenotypes include failure
  to meet the ventral nerve cord, absence of the neuron, incorrect process length,
  branching defects, migration paths with >45 degree turns, or ventral growth patterns
  (categories shown in Figure S8). Single mutants unc-5, unc-6, and unc-40 each show
  increased abnormal morphology compared to wild-type. The unc-6; toca-1 double mutant
  shows a statistically significant increase in abnormal phenotypes compared to the
  respective single mutants. Statistical significance determined by chi-squared test
  with Yates continuity correction. n=25–61 animals per condition. Error bars represent
  SD. ***p<0.001, **p<0.01, *p<0.05, n.s.=not significant.(D) Quantification of AVM
  morphological abnormalities in netrin pathway mutants. Bar graph shows percentage
  of animals with abnormal AVM morphology for wild-type, single mutants, toca-1(tm3334)
  single mutant, and double mutants combining netrin pathway genes with toca-1. Animals
  were grown at 25°C and scored as L4 larvae using fluorescence microscopy. Abnormal
  phenotypes scored as described for PVM neurons (Figure S8). Single mutants unc-5,
  unc-6, and unc-40 each show increased abnormal morphology compared to wild-type.
  The unc-6; toca-1 and unc-40; toca-1 double mutants show statistically significant
  increases in abnormal phenotypes compared to the respective single mutants. Statistical
  significance determined by chi-squared test with Yates continuity correction. n=25–61
  animals per condition. Error bars represent SD. ***p<0.001, **p<0.01, *p<0.05, n.s.=not
  significant
