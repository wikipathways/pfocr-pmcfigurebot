figure_title: Alleviated effect of QFD on PPARα/CPT pathway in myocardium of SIC mice
  and H9c2 cells.
caption: Alleviated effect of QFD on PPARα/CPT pathway in myocardium of SIC mice and
  H9c2 cells. (A) Expression levels of PPARα, CPT2, and CPT1B in myocardium of SIC
  mice (n = 3). (B) Cell viability (%) of H9c2 cells treated with various concentrations
  of QFD (n = 5). (C) Expression levels of PPARα and CPT2 in H9c2 cells (n = 3). H9c2
  cells were pretreated with QFD (20, 40, and 80 μg/mL) for 5-6 h and were subsequently
  stimulated with supernatant collected from RAW 264.7 cells for 24 h to generate
  an SIC cell model. Cell viability and protein levels of H9c2 cells were then determined.
  Data are expressed as mean ± SD. * p < 0.05, ** p < 0.01, *** p < 0.001, ns represents
  no significant difference
