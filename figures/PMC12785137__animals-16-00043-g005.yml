caption: Effects of dietary supplementation with rumen-protected β-alanine (RP-β-Ala)
  on the ruminal metabolomic features in beef cattle. (A) Pie chart showing metabolite
  classification. (B) Bar chart of metabolite KEGG function annotation. (C) Principal
  component analysis (PCA) score plot. (D) Partial least squares discriminant analysis
  (PLS-DA) score plot. (E,F) Orthogonal partial least squares discriminant analysis
  (OPLS-DA) score plot and OPLS-DA permutation test. (G) Volcano plot of the annotated
  metabolites. (H) Heatmap of differential accumulated metabolites. (I) KEGG enrichment
  pathways based on the differential metabolites; the X-axis represents the enrichment
  factor, which represents the number of differential metabolites in each pathway
  divided by the number of all metabolites in that pathway, and the Y-axis represents
  the names of pathways that are significantly enriched. (J) Violin plot analysis
  of 6 differential metabolites between control and RP-β-Ala groups. * p < 0.05
