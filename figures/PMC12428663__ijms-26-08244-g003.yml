figure_title: BAIAP3 knockdown in primary fibroblasts is associated with a significant
  increase in cilia elongation and significant reduction of GLI1 mRNA expression.
caption: BAIAP3 knockdown in primary fibroblasts is associated with a significant
  increase in cilia elongation and significant reduction of GLI1 mRNA expression.
  Representative western-blot (A) and qPCR analysis (B) of BAIAP3 RNAi experiment
  performed in control (sh-Scr) and BAIAP3 (ex.19 and ex.25) stably depleted fibroblast
  cells. β-actin was used as loading control. Scr = scramble; ex = exon. The bars
  represent mean and SD of two biological replicates; statistical value is reported
  as ** p < 0.01. (C) Confocal images showing an altered primary cilium morphology
  in fibroblasts obtained from a healthy donor in which the BAIAP3 expression was
  abolished by interfering compared to the same cell line infected with an empty vector
  (control cell-sh-SCR). We analyzed by immunofluorescence the fibroblasts in which
  the BAIAP3 knockdown was achieved using an interfering RNAs targeting exon 19 (sh-19).
  In this cell line, we observed a longer primary cilium than control cells. Primary
  cilia are labeled with ARL13B (green), basal bodies and nuclei are labeled with
  pericentrin (red) and DAPI (blue), respectively. Scale bar is 20 µm left and 2 µm
  right (zoomed images). (D) The scatter-plot represents the cilium lengths measured
  in μm. The sh-19 cells show a longer cilium than control. Cells were analyzed for
  each line over two independent experiments (20 cells/line each) for a total of 40
  cells/line scored. Horizontal lines represent the mean of two independent experiments
  for each subgroup assessed by Mann–Whitney U test (p < 0.001). (E) In the panel
  were reported representative images of cilium morphology observed in sh-19 and control
  cells. Scale bar is 2 µm. (F) Data are graphed indicating the fold change of GLI1,
  a target gene of the SHH pathway in sh-19 cells and also in another cell line in
  which the BAIAP3 knockdown was achieved using an interfering RNAs targeting exon
  25 (sh-25), compared to control cells. Fibroblasts were serum starved for 24 h and
  treated with SAG 100 nM for additional 24 h. The control (sh-SCR) is set as 1. GAPDH
  was used as endogenous control. Histograms show mean values ± SEM of two independent
  experiments, each performed in triplicate. The analysis of the expression was performed
  calculating the fold change using the 2−ΔΔCt formula and the results were statistically
  analyzed by PRISM7. p values were calculated by one-way ANOVA with Tukey’s correction
  for multiple testing. Graph bars show mean ± SEM. ns = not significant *** p < 0.001
