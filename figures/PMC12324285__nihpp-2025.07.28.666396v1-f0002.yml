caption: Neural-related transcripts with protein counterparts change developmentally
  from 3 dpf to 5 dpf due to loss of chd7. Volcano plot of Differentially Expressed
  Genes (DEGs) A. 5 dpf Wild Type (WT) compared to 3 dpf WT samples, B. 5 dpf Heterozygous
  (HT) compared to 3 dpf HT samples, and C. 5 dpf Homozygous Mutant (MUT) compared
  to 3 dpf MUT samples. Ingenuity Pathway Analysis (IPA) pathway enrichment by patterns
  of DEGs from D. 5 dpf WT compared to 3 dpf WT samples, E. 5 dpf HT compared to 3
  dpf HT samples, and F. 5 dpf MUT compared to 3 dpf MUT samples. Overlap of DEGs
  in WT 5 dpf v 3 dpf, HT 5 dpf v 3 dpf, and MUT 5 dpf v 3 dpf G. DEGs with p-value
  < 0.05, H. DEGs up-regulated with Fold Change (FC) > 1 and p-value < 0.05, I. DEGs
  down-regulated with FC < 1 and p-value < 0.05. J. Log2 FC for DEGs selected for
  most differing FC from S1. and all DEGs from overlap with Neuro-GO list S2. underlined
  in red and S3. underlined in blue
