figure_title: Canonical pathways and regulators of ferroptosis relevant to cancer
  and NPC biology.
caption: 'Canonical pathways and regulators of ferroptosis relevant to cancer and
  NPC biology. Ferroptosis is an iron-dependent form of regulated cell death characterized
  by excessive lipid peroxidation and distinct from apoptosis, necroptosis, and pyroptosis.
  The system xCT–GSH–GPX4 axis provides central antioxidant defense, while PUFAs incorporated
  by ACSL4 and LPCAT3 constitute vulnerable lipid substrates. Iron liberated from
  ferritinophagy (NCOA4–FTH1) or imported by DMT1 fuels Fenton chemistry, generating
  ROS that initiate lipid radical chain reactions. Enzymatic drivers such as lipoxygenases,
  cyclooxygenases, and POR-dependent pathways further amplify lipid peroxidation.
  Counteracting mechanisms include GPX4-mediated detoxification, ubiquinol regeneration
  via FSP1 and DHODH, and radical trapping by the GCH1–BH4 pathway. Failure of these
  protective systems results in lethal lipid peroxide accumulation and ferroptotic
  cell death. In nasopharyngeal carcinoma, dysregulation of these regulators, including
  upregulation of SLC7A11 and GPX4 or suppression of ACSL4 activity, contributes to
  radioresistance and chemoresistance, whereas deliberate ferroptosis induction has
  emerged as a promising therapeutic strategy. Abbreviations: ACSL4, acyl-CoA synthetase
  long-chain family member 4; ALOX, lipoxygenase; BH4, tetrahydrobiopterin; COX, cyclooxygenase;
  DHODH, dihydroorotate dehydrogenase; DMT1, divalent metal transporter 1; FSP1, ferroptosis
  suppressor protein-1; FTH1, ferritin heavy chain 1; GCH1, GTP cyclohydrolase 1;
  GPX4, glutathione peroxidase 4; GSH, glutathione; LPCAT3, lysophosphatidylcholine
  acyltransferase 3; NCOA4, nuclear receptor coactivator 4; NPC, nasopharyngeal carcinoma;
  POR, cytochrome P450 oxidoreductase; PUFA, polyunsaturated fatty acid; ROS, reactive
  oxygen species; Sec, selenocysteine; SLC7A11, solute carrier family 7 member 11;
  xCT, cystine/glutamate antiporter'
