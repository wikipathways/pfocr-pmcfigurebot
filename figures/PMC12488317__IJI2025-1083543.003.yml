figure_title: Overview of lung injury in sepsis.
caption: Overview of lung injury in sepsis. The opening of P2X1 channels increases
  Ca2+ entry into bronchial mucosal epithelial cells causing bronchial contraction.
  P2X1, P2X3 and P2X4 on the surface of vascular endothelial cells were associated
  with pulmonary artery vasoconstriction. P2X7 is located on the surface of lamellar
  bodies (LBs) in alveolar epithelial cells (AT cells) and assists in the secretion
  of surface-active substances. The ion concentration gradient caused by P2X caused
  mitochondrial damage. Activation of P2X7 receptors on pulmonary interstitial cell
  membranes upregulates the secretion of inflammatory cytokines through the classic
  pathways
