figure_title: The mechanisms of resveratrol inhibit neuroinflammation and oxidative
  stress.
caption: The mechanisms of resveratrol inhibit neuroinflammation and oxidative stress.
  (1) RSV suppressed the production of BACE1 and γ-secretase by reducing inflammatory
  factors, thereby diminishing Aβ generation. (2) RSV attenuates glutamate-induced
  MEK/ERK activation and reduces MCP-1 expression. (3) RSV inhibits TNF-α and IL-6
  production via suppression of the TLR4/NF-κB and STAT1/3 pathways. (4) RSV mediates
  deacetylation of RelA/p65 through SIRT1 activation, thereby blunting downstream
  inflammatory signaling. (5) RSV inhibits pyroptosis through AMPK/miR-155/NLRP3 pathways.
  (6) RSV promotes the expression of antioxidant proteins by activating the PI3K/AKT/GSK-3β/Nrf2
  pathway. RSV, resveratrol; LPS, lipopolysaccharide; STAT1/3, signal transducer and
  activator of transcription1/3; TLR4, toll-like receptor 4; MYD88, myeloid differentiation
  primary response 88; TRIF, TIR-domain-containing adapter-inducing interferon-β;
  TAK, TGF-β-activated kinase 1; NEMO, NF-κB essential modulator; IKKα/β, inhibitor
  of nuclear factor kappa B kinase subunit α/β; IκB, inhibitor of kappa B; p50, nuclear
  factor kappa B subunit p50; p65, nuclear factor kappa B subunit p65; SIRT1, sirtuin
  1, MEK, MAPK/ERK kinase; ERK, extracellular signal-regulated kinase; MCP-1, monocyte
  chemoattractant protein-1; PI3K, phosphoinositide 3-kinase; AKT, protein kinase
  B; GSK-3β, glycogen synthase kinase-3β; Fyn, proto-oncogene tyrosine-protein kinase
  Fyn; Nrf2, nuclear factor erythroid 2-related factor 2;β-TrCP, β-transducin repeat-containing
  protein; NLRP3, NLR family pyrin domain containing 3; AMPK, AMP-activated protein
  kinase; JUK, c-Jun N-terminal kinase; BACE1, β-Secretase 1; Caspase-1, cysteine-dependent
  aspartate-specific protease 1; ASC, apoptosis-associated speck-like protein containing
  a CARD; GSDMD, Gasdermin D
