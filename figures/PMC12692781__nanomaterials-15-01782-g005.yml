figure_title: (a) Schematic of the preparation of nanoporous C-Co2P electrocatalysts.
caption: (a) Schematic of the preparation of nanoporous C-Co2P electrocatalysts. (b)
  Polarization curves measured in 1 M KOH. (c) Polarization curves in simulated alkaline
  seawater electrolyte, demonstrating high activity at industrial-level current densities.
  (d) Galvanostatic stability tests at various current densities, confirming outstanding
  operational durability over 60 h. (e) Computed hydrogen ΔGH* on Co sites. (f) Energy
  profiles for the water dissociation step via the proton-delivery pathway. (g) Projected
  density of states (pDOS) of Co atoms, showing the downshift in the d-band center
  after C doping. (h) Charge density difference plots illustrating electron redistribution.
  (i) Schematic diagram summarizing the proposed enhanced HER mechanism facilitated
  by carbon doping [125]
