caption: 'Genetic and Molecular Factors in Obesity: Leptin–Melanocortin Axis Dysregulation:
  Schematic representation of the leptin–melanocortin signaling pathway and its dysregulation
  in obesity. Leptin, secreted from adipocytes, binds to leptin receptors (LEPR) in
  the hypothalamus. This interaction activates pro-opiomelanocortin (POMC) and cocaine-
  and amphetamine-regulated transcript (CART) neurons, while simultaneously inhibiting
  neuropeptide Y (NPY) and agouti-related peptide (AgRP) neurons. The cascade subsequently
  activates the downstream melanocortin-4 receptor (MC4R), leading to reduced appetite
  (↓) and increased energy expenditure (↑)'
