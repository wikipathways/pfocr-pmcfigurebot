figure_title: Superior colliculus neuronal responses to PS and DMS direct pathway
  activation
caption: 'A. Mean firing rates for example dSC units that were excited (left), inhibited
  (center), or both excited and inhibited (right) by PS D1-MSN optogenetic stimulation
  (blue) compared to activity on non-stimulation trials (gray). Optogenetic light
  delivery indicated by light blue shading. B. Same as A but for dSC units modulated
  by DMS D1-MSN stimulation. C. Percentages of dSC units exhibiting task properties
  (colored bars) or not (white bars) that were modulated by optogenetic activation
  of PS (left) or DMS (right) D1-MSNs. D. Proportions of PS (top) and DMS (bottom)
  D1-MSN modulated dSC units that were modulated during early delay (white), late
  delay (dark gray), or both epochs (light gray). E. Left: from recording sessions
  with both DMS and PS D1-MSN stimulation, proportions of dSC single units that were
  modulated by PS, DMS or both D1-MSN pathways. Center and right: the type of modulatory
  effect on dSC firing by PS and DMS D1-MSN stimulation'
article_title: A distinct circuit for biasing visual perceptual decisions and modulating
