figure_title: NHEJ repair pathway was upregulated by PARPi and proton BP irradiation
caption: U2OS cells were treated with PARPi and irradiation 4Gy delivered by proton
  beam profile. (A) The number of RAD51 foci was evaluated using IF at 4- and 24 hours.
  Data represent three independent biological replicates. Each red circle denotes
  the median value from a single replicate, and the red bar represents the mean of
  these medians. Statistical comparisons were performed across biological replicates.
  (B) Survival fractions of cells treated with olaparib (40 nM), talazoparib (0.2
  nM), veliparib (2 μM) in combination with proton ENT or BP after silencing XRCC4
article_title: PARP inhibitors potentiate proton therapy end-of-range effects by accelerating
