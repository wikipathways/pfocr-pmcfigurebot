caption: HGTs altered colonic contents and liver metabolism in the fibrosis of NASH
  mice. (A) OPLS-DA plots of colonic contents between Con and Mod. (B) OPLS-DA plots
  of colonic content between Mod and HGTs. (C) Volcano plot of colonic contents between
  Con and Mod. (D) Volcano plot of colonic contents between Mod and HGTs. (E) The
  KEGG pathway enrichment analysis of colonic content metabolites restored by HGTs.
  (F) OPLS-DA plots of livers between Con and Mod. (G) OPLS-DA plots of livers between
  Mod and HGTs. (H) Volcano Plot of livers between Con and Mod. (I) Volcano Plot of
  livers between Mod and HGTs. (J) KEGG pathway enrichment analysis of liver metabolites
  restored by HGTs. (K) OPLS-DA score plot of Mod vs. HGTs (colonic contents). (L)
  OPLS-DA score plot of Mod vs. HGTs (livers). Radar Plot for BAs in colonic contents
  (M) and livers (N) with significant differences in the Con group, Mod group, and
  HGT group. The abundance of each BA is normalized using min-max normalization. The
  number of animals in each group is six
