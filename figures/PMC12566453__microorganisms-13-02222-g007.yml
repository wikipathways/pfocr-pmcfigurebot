figure_title: Nitric oxide regulates production of antiviral and inflammatory chemokine/cytokine
  during HSV-1 infection of glial cells in vitro.
caption: Nitric oxide regulates production of antiviral and inflammatory chemokine/cytokine
  during HSV-1 infection of glial cells in vitro. (A) M1 and (B) M2 phenotypes of
  microglia and (C,D) expression of IL-1α, TNF-α, IL-6, CXCL1, CXCL9, CXCL10 and IFN-α
  mRNA at 24 h p.i. in mixed glial cultures prepared from wild-type (C57BL/6) mice,
  untreated or treated with 50 μM AMG or 100 μM sodium nitroprusside (SNP) and measured
  with qPCR. (E,F) The RAW cells were treated with 50 μM AMG or 100, 250 and 500 μM
  sodium nitroprusside (SNP100, 250 and 500, respectively) and then left uninfected,
  infected with HSV-1 (1 PFU/cell) or treated with poly (I:C) at 1 μg/mL. After 18
  h, the interferon regulatory factor (IFR) pathway (A) was measured as Lucia chemiluminescence,
  and the activation of the NF-κB pathway was measured as SEAP activity (B). Data
  from three independent experiments are presented as the mean ± SEM. Two-way ANOVA
  test was used. * represents p ≤ 0.05, while ** represents p ≤ 0.01 in comparison
  to untreated control, HSV-1 infection or poli (I:C)
