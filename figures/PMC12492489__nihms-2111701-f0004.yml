figure_title: SATB1 deficiency promotes terminal differentiation during the chronic
  phase of viral infection
caption: 'a-d, Representative flow plots and summary showing gMFI or percentage of
  PD-1 (a), CXCR6 (b), CX3CR1 (c), and Granzyme B (d) in P14+ cells from sgCtrl (control;
  orange) and sgSat1 (SATB1-deficient; blue) splenic P14 cells on day 21 p.i. (n =
  5). e, Heatmaps of DEGs between sgCtrl and sgSatb1 P14 cells (adjusted p value <
  0.05); selected DEGs in each category are indicated. f, GSEA of antigen processing
  from KEGG (Pathway ID: mmu04062) between sgCtrl and sgSatb1 P14 cells. g, Experimental
  design of CRISPR-RNP: CD45.1+ P14 CD8+ cells were transduced with sgCtrl (control;
  orange cell) and sgSatb1 (SATB1-deficient; blue cell) and then adoptively co-transferred
  in a 1:1 mix into CD45.2+ C57BL/6 recipient mice that had been infected with LCMV
  Cl13 for 14 days. h, Representative flow plots displaying the frequencies of sgCtrl
  and sgSatb1 splenic P14 cells on day 28 p.i., or day 14 post-transfer. i, Representative
  flow plots and summary of subset distribution of TPRO (Ly108+ CX3CR1−), TEFF (Ly108−
  CX3CR1+), and TEXH (Ly108− CX3CR1−) in splenic P14 cells in panel h. j-k, Representative
  flow plots and summary showing the Granzyme B (j) and TCF-1 (k) percentage in sgCtrl
  and sgSatb1 splenic P14 cells on day 28 p.i. (day 14 post-transfer). All data points
  (n) represent individual mice as biological replicates. Exact P-values are shown
  in each graph. Data in a-d and g-k are representative of 2-3 independent experiments,
  Paired t- test was used in a-d, and j-k; two-sided multiple paired t-test with Holm-Šídák
  correction was used in i'
