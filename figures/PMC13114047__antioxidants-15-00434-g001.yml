figure_title: Shared Molecular Landscape of RAGE and Ferroptosis.
caption: Shared Molecular Landscape of RAGE and Ferroptosis. (A) Venn diagram showing
  197 overlapping genes between receptor for advanced glycation end-products (RAGE,
  pink) and ferroptosis-related genes (blue), identified as core candidates for subsequent
  mechanistic analysis. (B) Protein–protein interaction (PPI) network. Nodes represent
  proteins, and edges indicate experimentally validated or predicted interactions.
  Node size and color intensity correspond to combined confidence scores from the
  STRING database. (C) KEGG pathway enrichment analysis of the overlapping genes.
  (D) Gene Ontology (GO) biological process (BP) enrichment analysis. Colors indicate
  the q-value of enrichment, and the x-axis represents the number of enriched genes.
  (E) Distribution of RAGE–ferroptosis overlapping genes annotated as associated with
  influenza virus infection
