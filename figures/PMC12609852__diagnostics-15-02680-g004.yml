figure_title: Single-cell transcriptomic analysis of immune subsets and their possible
  regulation in non-responders (NRs) versus responders (Rs) to anti–PD-1 therapy (GSE206325).
caption: Single-cell transcriptomic analysis of immune subsets and their possible
  regulation in non-responders (NRs) versus responders (Rs) to anti–PD-1 therapy (GSE206325).
  (A) UMAP plot showing clustering of immune cell subsets from non-responders (NRs;
  n = 12) and responders (Rs; n = 6). (B) UMAP plot highlighting the distribution
  of cells from the NR and R groups. (C) Quantification of cell-type proportions between
  NR and R samples, with enrichment of macrophage/monocyte cluster 5 (red arrow) in
  the NR group. (D) Association analysis comparing cell-type counts between NR and
  R, showing enrichment of CD8+ cytotoxic T cells (activated, effector-like and IFNG+
  subsets), regulatory T cells (Tregs), and macrophage/monocyte (containing SPP1+BCL2A1+
  TAMs) subsets. (E) Boxplot showing longevity pathway scores in anti–PD-1 NR versus
  R groups. **** p < 0.0001
