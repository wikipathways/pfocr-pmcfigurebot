figure_title: Analysis of scRNA-Seq data derived from treatment-resistant CRPCs and
  NEPCs identifies MUC1 associations with glycolysis, stemness, and NE differentiation
caption: (A) Uniform manifold approximation and projection (UMAP) of scRNA-Seq data
  from patient treatment-resistant CRPC/AR+, CRPC/AR–, and NEPC cells. (B) AR and
  MUC1 expression by CRPC/AR+, CRPC/AR–, and NEPC subtypes. Median expression per
  cluster is shown as a horizontal line. (C) UMAP of scRNA-Seq data from the indicated
  patient tumor samples (left). Overlap of MUC1, AR, and KLK3 normalized gene expression
  (right). (D) Heatmaps depicting CRPC/AR+, CRPC/AR–, and NEPC cell expression of
  candidate genes associated with AR signaling, glycolysis, NEPC and CSC gene signatures.
  (E) Gene set enrichment was performed for CRPC/AR+, CRPC/AR–, and NEPC cells using
  the HALLMARK GLYCOLYSIS gene signature. Each point represents the average score
  per tumor. Median gene signature scores per cluster are shown as horizontal lines.
  (F) UMAP showing the scores per cell using the HALLMARK_GLYCOLYSIS gene signature
  (left). Pearson’s correlation plots for CRPC/AR+, CRPC/AR–, and NEPC cells using
  imputed gene expression of MUC1 and HALLMARK GLYCOLYSIS enrichment scores (right).
  (G) Depiction of MUC1-C dependence in treatment-resistant CRPC/NEPC. Selection of
  AR-positive LNCaP cells for ENZ resistance and AR-negative DU-145 cells for DTX
  resistance induces MUC1-C expression and dependence on MUC1-C for the drug-resistant
  phenotype. Consistent with MUC1-C suppression of AR (12), progression of ENZ- and
  DTX-resistant PC to t-NEPC is associated with increasing MUC1-C and decreasing AR
  levels. Progression of drug-resistant PC to t-NEPC is dependent on activation of
  the MUC1-C/MYC axis and thereby effectors of the glycolytic pathway that regulate
  ROS and ATP levels necessary for maintaining the CSC state and treatment resistance.
  In support of MUC1-C addiction, we demonstrate that an M1C ADC is highly effective
  against t-NEPC cell self-renewal and tumorigenicity
article_title: MUC1-C dependence in treatment-resistant prostate cancer uncovers a
  target for antibody-drug conjugate therapy
