figure_title: Structural basis of TDase inhibitor binding and ground-state mechanistic
  basis for the covalent modification of FAD by propargyl and cyclopropyl amines.
caption: 'Structural basis of TDase inhibitor binding and ground-state mechanistic
  basis for the covalent modification of FAD by propargyl and cyclopropyl amines.
  X-ray crystal structures of aTC bound to Tet50 (a) and TetX6 (b) highlight the different
  inhibitor binding modes relative to FAD (PDBs: 5TUF and 8ER0, respectively) where
  the D-ring orients C9 in different directions. The “gatekeeper helix” of Tet50 is
  highlighted in orange. (c) Proposed mechanism for covalent adduct formation between
  FAD and a propargylamine via a two-electron pathway starting with a hydride transfer
  from the α-C–H. (d) Proposed mechanism for the formation of covalent adduct between
  FAD and a cyclopropylamine via a one-electron pathway starting with a single electron
  transfer from the lone pair of electrons on nitrogen. R and R'' are defined separately
  for the chemical structures shown throughout the manuscript'
