figure_title: Interrelation between the renin–angiotensin system (RAS) and the apelin
  system.
caption: 'Interrelation between the renin–angiotensin system (RAS) and the apelin
  system. In the RAS system, angiotensinogen is converted to angiotensin I by the
  action of renin, which is then transformed to angiotensin II by ACE. ACE2 can convert
  angiotensin II to Ang-(1-7), triggering opposite effects in the renal system. The
  active forms of apelin interact with APLNR, activating different biological responses.
  The active forms apelin-13 and Pyr-apelin-13 upregulate ACE2 expression. However,
  ACE2 cleaves the C-terminal phenylalanine of apelin peptides (apelin-13 and Pyr-apelin-13),
  producing low-activity forms of apelin (apelin-12 and Pyr-apelin-12). This generates
  a negative feedback loop that connects the apelin system with the RAS pathway. Dashed
  lines: Receptor interaction'
