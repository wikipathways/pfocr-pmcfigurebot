figure_title: Differential analysis and pseudotime analysis of luteal cells under
  different physiological conditions.
caption: Differential analysis and pseudotime analysis of luteal cells under different
  physiological conditions. (A) Volcano plot of differential gene analysis of ovarian
  luteal cells between pregnant and non-pregnant Holstein cows. Red represents upregulated
  differentially expressed genes (DEGs), and blue represents downregulated DEGs. (B)
  KEGG enrichment analysis showing the pathways enriched by the differentially expressed
  genes in luteal cells. (C) Pseudotime trajectory analysis of luteal cells under
  different physiological conditions. (D) Pseudotime heatmap shows the dynamic gene
  expression profiles during the fate determination process of luteal cells. The expression
  levels of dynamic genes are represented by a color gradient from red (high) to blue
  (low). (E) Expression trend plots of characteristic genes arranged along the pseudotime
  in luteal cell subtypes
