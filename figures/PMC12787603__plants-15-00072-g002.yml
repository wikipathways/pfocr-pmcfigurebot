figure_title: Potential pathways for IAA biosynthesis in Arabidopsis.
caption: 'Potential pathways for IAA biosynthesis in Arabidopsis. The de novo biosynthetic
  pathway of IAA initiates with Trp (marked in red) or its precursors. The enzymes
  identified in Arabidopsis are indicated on the arrows, while the conversion processes
  with unidentified genes are marked with question marks. Dashed lines represent unclear
  synthetic routes. Abbreviations: Indole-3-acetamide amidohydrolase (AMI), Anthranilate
  (ANT), Aldehyde oxidase 1 (AO1), Anthranilate synthase α (ASA), Anthranilate synthase
  β (ASB), Cytochrome P450 (CYP79B2, CYP79B3, CYP83B3), Epithiospecifier protein (ESP),
  Indole-3-acetaldehyde (IAAld), Indole-3-acetamide (IAM), Indole-3-acetamide hydrolase
  (IAMH), Indole-3-acetonitrile (IAN), Indole-3-acetaldoxime (IAOx), 3-Indolemethylglucoside
  (IG), Indole-3-Glycerol Phosphate (IGP), Indole synthase (INS), Indole-3-pyruvic
  acid (IPyA), Myrosinase (MYR), N-Hydroxytryptamine (NHT), Nitrilase (NIT), Tryptophan
  aminotransferase of Arabidopsis (TAA), Tryptophan Aminotransferase-Related (TAR),
  Tryptamine (TAM), Tryptophan synthase α (TSA), Tryptophan synthase β (TSB)'
