figure_title: The heterologous production of forskolin in Synechocystis.
caption: 'The heterologous production of forskolin in Synechocystis. (A) The Synechocystis
  strain FSK contains the following constructs: The TPS operon containing TPS2 and
  -3 is integrated into the NSP1-neutral site, and the operon containing the three
  P450s (CYP76AH15, CYP76AH11 and CYP76H16) and ACT1-8 resides on the replicative
  plasmid pDF-FSK (pDF-trc derivative). Promoters are indicated with an arrow (Pcpc560
  promoter for NSP1 and Ptrc promoter for pDF-FSK). The ribosomal binding sites (RBCs)
  are indicated with half circles. (B) LC-MS-based extracted ion chromatograms (EICs)
  showing the [M + H]+ adduct of forskolin in supernatants of cyanobacteria containing
  all pathway genes (PbTPS2, PbTPS3 and pDF-FSK) and the empty vector control (PbTPS2,
  PbTPS3 and pDF-trc (empty vector, EV)) are compared to the authentic forskolin standard'
