figure_title: Scalability and generalizability of NCLUSION across diverse datasets
caption: 'NCLUSION and baselines were applied to the following scRNA-seq datasets:
  PDAC (N=23,042cells)72, AML (N=43,690cells)73, and IMMUNE (N=88,057cells)74. (A)
  Runtimes for all methods when applied to each dataset. (B) Assessment of the inferred
  cluster labels from each method versus cell type annotations from the original studies.
  Evaluation is quantified by normalized mutual information (NMI) and adjusted Rand
  index (ARI). Asterisks indicate that there is a statistically significant difference
  in performance between NCLUSION and a corresponding method (two-sided t-test P<0.05).
  Panels (C)-(F) depict results from running NCLUSION on the PDAC dataset. (C) Shown
  is a t-SNE visualization of the PDAC scRNA-seq dataset, annotated by the cell type
  labels from the PDAC study (top) compared to the clusters inferred by NCLUSION (bottom),
  where the “NM” labels indicate non-malignant cells and the “M” labels indicate malignant
  cells. (D) Heat maps of the adjusted posterior inclusion probabilities (PIPs) (left),
  effect size sign (ESS) (center), and strictly standardized mean difference (SSMD)
  (right) of the significant genes in each cluster. (E) Highlighted location on t-SNEs
  of NCLUSION-inferred clusters that contain predominantly one cell type. (F) Violin
  plots comparing the normalized expression of cluster-specific marker genes across
  clusters. (G) Gene ontology (GO) pathway enrichment analysis for the marker genes
  identified for each cluster. Gene sets with a q-value below 0.05 are deemed to be
  significant'
article_title: Scalable nonparametric clustering with unified marker gene selection
  for single-cell RNA-seq data
