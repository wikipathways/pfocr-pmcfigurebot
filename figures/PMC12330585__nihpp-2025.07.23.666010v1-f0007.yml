figure_title: Protein carbonylation and insulin secretion in pre-T1D
caption: 'A: Carbonylated proteins in exocytosis and endocytosis. Shown is a modified
  KEGG pathway diagram of the synaptic vesicle cycle (https://www.kegg.jp/pathway/map04721,
  reproduced with permission (56)), which involves the same families of proteins as
  insulin secretion at this level of detail. Proteins highlighted red were identified
  as enriched in one or more of the experiments described in this paper (Table S1).
  B: Cellular model of PC in T1D. Islet inflammation leads to both extracellular (exogenous,
  orange arrows) and intracellular (endogenous, purple arrows) sources of ROS, which
  lead to carbonylation of distinct but overlapping sets of proteins and both inhibit
  insulin secretion by ~50%. Original artwork by K.R. Schultz'
article_title: Inflammatory Oxidative Stress Compounds Inhibit Insulin Secretion through
  Rapid Protein Carbonylation
