caption: Co-expression network analysis of trans-targeting lncRNA-PCG interactions
  in A. thaliana immunity. (a) Hierarchical clustering dendrogram with module assignment
  (24 co-expression modules; n = 8000 transcripts). (b) Module-trait correlation heatmap.
  (c) “Turquoise” module eigengene dynamics across genotypes (WT vs. MPK6SR) under
  Pst DC3000 and Pst DC3000 hrcC− challenges. (d) Module-wise distribution of lncRNA
  and protein-coding gene counts. (e) KEGG pathway enrichment for “turquoise” module
  trans-regulated lncRNA-PCG pairs. (f) “Pink” module eigengene expression patterns
  in plant–pathogen interactions. (g) Significantly enriched KEGG terms among “pink”
  module trans-targeting networks. (h) “Blue” module eigengene trajectories during
  immune responses. (i) Functional annotation of “blue” module cis-regulatory associations
  via KEGG
