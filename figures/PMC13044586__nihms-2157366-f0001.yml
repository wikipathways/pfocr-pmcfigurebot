figure_title: An overview of purine metabolism.
caption: An overview of purine metabolism. Purine metabolism is tightly regulated
  by interconnected anabolic and catabolic pathways, encompassing both intracellular
  and extracellular processes. De novo synthesis initiates with ribose-5-phosphate
  (R-5-P) and progresses through enzymatic steps involving PRPP synthetase (PRPPS)
  and amidophosphoribosyltransferase (GPAT), ultimately generating inosine monophosphate
  (IMP). The salvage pathway recycles purine bases, including adenine (Ade), guanine
  (Gua), and hypoxanthine (Hyp), via adenine phosphoribosyltransferase (APRT) and
  hypoxanthine-guanine phosphoribosyltransferase (HPRT), forming AMP, GMP, and IMP.
  Purine catabolism leads to uric acid (UA) through purine nucleoside phosphorylase
  (PNP) and xanthine oxidase (XO). Extracellular purine metabolism involves catabolism
  of extracellular ATP (eATP) by membrane-bound ectonucleotidases. CD39 (ENPDase)
  converts eATP to AMP, which CD73 (5’NT) further hydrolyzes extracellular adenosine
  (eADO). Ecto-adenosine deaminase (eADA) subsequently metabolizes eADO into inosine
  (INO). Noncanonical purine metabolism utilizes extracellular nicotinamide adenine
  dinucleotide (NAD+) to generate AMP and subsequently ADO. Ectoenzymes CD38 and CD157
  convert NAD+ to cyclic ADP-ribose (cADPR), which is converted to AMP by ectonucleotide
  phosphohydrolase/phosphodiesterase 1 (ENPP1 or CD203a) and further hydrolyzed to
  ADO by CD73
