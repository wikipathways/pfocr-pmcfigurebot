caption: 'Metabolic network remodeling in wild barley (Hordeum spontaneum) leaves
  under salt stress (500 mM NaCl) across four time points (0 h, 2 h, 12 h, 24 h),
  illustrating crosstalk between KEGG pathways centered on acetyl-CoA flux and oxidative
  phosphorylation. Enriched metabolites are color-coded to distinguish metabolic trajectories:
  orange highlights pivotal end-products, pink denotes metabolites channeled toward
  acetyl-CoA synthesis (e.g., pyruvate), green identifies acetyl-CoA-derived intermediates
  (e.g., malonyl-CoA), and blue marks reactions diverting to oxidative phosphorylation
  (e.g., TCA cycle intermediates). Further information is available in Figures S10–S12,
  S16, S17, S19, S20, S23, S24, S26 and S28'
