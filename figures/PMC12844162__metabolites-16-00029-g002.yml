figure_title: Pathways and physiological functions of succinate.
caption: Pathways and physiological functions of succinate. (A) Succinate can regulate
  downstream signaling and physiological functions by activating GPR91, and it also
  serves as an important circulating metabolite in the tricarboxylic acid (TCA) cycle,
  contributing to energy production. (B) Succinate regulates inflammation, muscle
  endurance, and glucose metabolism in mammals, showing potential applications in
  aquaculture
