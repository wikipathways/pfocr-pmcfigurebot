figure_title: Identification of novel players involved in the Aldo–MR pathway.
caption: Identification of novel players involved in the Aldo–MR pathway. (A) Pipeline
  used to filter candidates involved in the Aldo–MR pathway using global RNA sequencing
  of the AAV9-mediated MR-overexpression mice with aldosterone treatment compared
  to control mice. (B) Heat map of 192 significantly differentially regulated genes
  obtained from the global RNA sequencing with Ptgds highlighted in the heat map.
  Rows are centered and unit variance scaling is applied. Correlation distance and
  average linkage are used for clustering of both rows and columns. (C) Volcano plot
  showing the significantly up- and down-regulated genes in blue (adjusted p-value
  < 0.05) with the shortlisted candidates highlighted in red. Lead candidate Ptgds
  is labelled and indicated by a larger red point. (D) Enriched GO biological processes
  analyzed using Enrichr. Ranked according to p-value. (E) mRNA expression of various
  shortlisted genes in heart tissues from the complete sample set of mice treated
  with AAV9-Empty-Control and AAV9-MR-Aldosterone as measured by RT-PCR. Gene expression
  was calculated relative to the housekeeper gene Gapdh and normalized to the AAV9-Empty-Control
  group (n = 5–6 animals per group). All data are represented as mean ± SEM. * p ≤
  0.05, ** p ≤ 0.01, *** p ≤ 0.001
