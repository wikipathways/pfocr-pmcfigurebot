figure_title: Single-cell transcriptomic landscape of lymphoid cells in CLAD
caption: '(A) Heatmap of gene expression across T cell subtypes. The average expression
  per gene was calculated for each individual and further normalized within each row
  to a 0–1 range. (B) UMAP visualization of T cell subtypes, separated by CLAD and
  control groups. (C) Box plot showing the proportion of different T cell subtypes.
  Box plots show the interquartile range, median (line), and minimum and maximum (whiskers).
  (D) Box plot showing the proportion of each CD8+ T cell subtype per sample across
  multiple diseases. (E) Violin plot of pathway enrichment scores comparing CLAD and
  COVID-19 in exhausted CD8+ T cells. Violin plots show the full distribution of the
  data, with the width representing the density of values. (F) Stacked bar chart illustrating
  the distribution of T cell subtypes within donor and recipient cell groups. (G)
  Violin plot comparing IFN-α response scores across T cell subtypes in donor and
  recipient cells: Trm (tissue-resident memory T cells), TEM (effector memory T cells),
  TCM (central memory T cells), γδT (gamma delta T cells), Reg.T (regulatory T cells),
  Effector.T (effector CD8+ T cells), MAIT (mucosal-associated invariant T cells),
  Temra (terminally differentiated effector memory T cells). For comparisons between
  2 groups, the Wilcoxon test was used. For comparisons involving more than 2 groups,
  the Kruskal-Wallis test was followed by pairwise Wilcoxon rank-sum tests. P values
  were adjusted using the BH method, and FDR < 0.05 was considered statistically significant'
article_title: Single-cell dissection of chronic lung allograft dysfunction reveals
  convergent and distinct fibrotic mechanisms
