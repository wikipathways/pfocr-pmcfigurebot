figure_title: 'Porphyromonas gingivalis translocation via the oral–gut–liver axis:
  mechanisms of gut dysbiosis and inflammatory synergy.'
caption: 'Porphyromonas gingivalis translocation via the oral–gut–liver axis: mechanisms
  of gut dysbiosis and inflammatory synergy. (1) P. gingivalis activates TLR4 signaling,
  promoting IL-6/IFN-γ secretion and exacerbating Th17/Treg imbalance via STAT3/RORγt
  signaling, thereby aggravating intestinal inflammation, and releases DAMPs (HMGB1,
  histones, HSPs) to activate TLR2, TLR5, and TLR9 expression, exacerbating local
  inflammation. (2) IL-6 upregulates claudin-2 (via MEK/ERK and PI3K pathways), increasing
  intestinal permeability, while TNF-α/ROS-induced epithelial apoptosis synergistically
  disrupts gut microbiota homeostasis; pathogens and toxic products enter the liver
  via the portal vein. In this figure, arrows indicate cascade reactions or downstream
  products, and lines with termination bars represent inhibitory effects. Abbreviations:
  Treg, regulatory T cell; TRIF, TIR-domain-containing adapter-inducing interferon-β;
  TSC1/2, tuberous sclerosis complex 1/2; Rheb, Ras homolog enriched in brain; mTORC1,
  mechanistic target of rapamycin complex 1; HMGB1, high-mobility group box 1 protein;
  HSPs, heat shock proteins; STAT3, signal transducer and activator of transcription
  3; RORγt, retinoic acid-related orphan receptor gamma t; PI3K, phosphatidylinositol
  3-kinase; Akt, AKT serine/threonine kinase; DAMPs, damage-associated molecular patterns;
  TLR5, Toll-like receptor 5. Created with BioRender.com and based on the work of
  [158,159,160,161,162]'
