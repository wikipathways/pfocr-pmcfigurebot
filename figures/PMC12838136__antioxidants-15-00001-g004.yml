figure_title: Ferroptosis-mediated cell type-specific damage in DR.
caption: 'Ferroptosis-mediated cell type-specific damage in DR. Retinal Microvascular
  Endothelial Cells (RMECs): Early-stage alterations include inflammation (upregulation
  of ICAM-1/VCAM-1), mitochondrial apoptosis (Bax/cytochrome c), and ferroptosis,
  leading to the breakdown of the blood-retinal barrier (BRB). In the late stage,
  hypoxia drives aberrant proliferation and migration (mediated by VEGF/HMGB1/Gpr124),
  resulting in pathological neovascularization. Key genes (e.g., P53, HIF1A) and signaling
  pathways (e.g., HIF-1, FoxO, MAPK) are involved in these processes. Müller Cells:
  These cells undergo gliosis (increased GFAP expression) and overproduce factors
  like VEGF, thereby amplifying inflammatory responses, promoting vascular leakage,
  and contributing to neovascularization. Their function is critically regulated by
  HIF-1. Retinal Pigment Epithelial Cells (RPECs): These cells face high glucose-induced
  mitochondrial dysfunction, oxidative stress, and ferroptosis (evidenced by elevated
  Fe2+/MDA and inhibited GSH/GPX4). Furthermore, inflammatory cytokines (e.g., TNF-α)
  can upregulate mitophagy, exacerbating cell death. Photoreceptor Cells: These cells
  exhibit metabolic disturbances, increased ROS production, and undergo both apoptosis
  and ferroptosis. Their function is influenced by factors such as HIF-1α, Wnt signaling,
  and IL-17A'
