figure_title: Schematic diagram of some signal transduction pathways initiated by
  insulin (highly simplified in this figure).
caption: Schematic diagram of some signal transduction pathways initiated by insulin
  (highly simplified in this figure). Insulin binds to the α-subunit of insulin receptor,
  causing conformational changes that allow autophosphorylation of several tyrosine
  residues on the β-subunit. In the AKT signaling pathway, the phosphotyrosine-binding
  domains of adaptor proteins, such as members of the IRS family of insulin receptor
  substrates, recognize β-subunit residues of the insulin receptor, leading to phosphorylation
  of key tyrosine residues on IRS proteins. Activation of AKT requires PI3K, which
  induces phosphorylation of AKT. Once activated, AKT leads to phosphorylation and
  inactivation of GSK, which activates glycogen synthase. AKT also directly activates
  the transcription factors mTOR and Fork-head. AKT plays a significant role in the
  translocation of GLUT4 to the plasma membrane, resulting in glucose entry into the
  cell. AMPK is proposed to interact with insulin signaling and GLUT4 translocation.
  AKT, activates protein kinase B; GLUT, glucose transporter; GSK3, glycogen synthase
  kinase 3; IRS, members of the insulin receptor substrate family; mTOR, mammalian
  target of rapamycin; PI3K, protein kinase 3′-phosphoinositide-dependent protein
  kinase-1
