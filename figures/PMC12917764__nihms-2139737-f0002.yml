figure_title: Treatment workflow.
caption: Treatment workflow. (a) A histotripsy system (HistoSonics) was used in this
  study. (b) A veterinary radiology resident first performed freehand ultrasound (US)
  imaging to identify the pancreas (red dashes) and optimal acoustic pathway. (c)
  The “reservoir” was placed over the subject’s abdomen, filled with degassed water
  and the treatment head was submerged. Coax US imaging was collected (d) before,
  (e) during and (f) after histotripsy treatment. (g, h) Freehand US imaging and CT
  were collected immediately post-treatment. All subjects underwent immediate post-treatment
  CT with three subjects from the chronic group undergoing a second scan 5 weeks post-treatment
