figure_title: PDAC downregulates pathways associated with adipogenesis.
caption: PDAC downregulates pathways associated with adipogenesis. RNAseq on gWAT
  from ad libitum-fed PDAC and sham mice collected 14 days post tumor implantation.
  N=2 female, 3 male PDAC; 3 female, 2 male sham. (A) Volcano plot of differentially
  expressed genes in gWAT. Blue dots represent significantly downregulated genes (log2
  fold change < −1 and adj p<0.05). while red dots represent significantly upregulated
  genes (log2 fold change >1 and adj p<0.05). Grey dots are insignificant. Labels
  denote significant differentially expressed genes from the Hallmark Adipogenesis
  pathway. (B) Broad Institute GSEA showing significantly enriched pathways in PDAC
  gWAT relative to sham gWAT (pathway p<0.05). Blue is decreased expression, red is
  increased expression. (C) Heat map of Hallmark Adipogenesis pathways constituents
  in PDAC and Sham gWAT. Scale represents row-normalized raw counts. (D) qPCR validation
  of adipogenesis and lipogenesis genes in in gWAT collected 10 days post-implantation
  from 24 h-fasted and ad libitum-fed mice. N=5 male mice sham/fasted; 3 male, 3 female
  mice sham/ad lib; 6 male mice PDAC/fasted; 3 male, 2 female mice PDAC/ad lib. Statistically
  tested with two-way ANOVA with Tukey multiple comparisons comparing tumor experimental
  groups to sham controls. (E) qPCR validation of adipogenesis and lipogenesis genes
  in iWAT from ad lib fed mice collected 11 days post implantation. N=4 male mice
  per group. Statistically tested with unpaired t-test. *p<0.05, **p<0.01, ***p<0.001,
  and ****p<0.0001
