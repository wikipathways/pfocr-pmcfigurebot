caption: Heatmap showing the 50 KO gene families exhibiting the largest mean CPM differences
  between samples, grouped according to KEGG pathway annotations. Each row represents
  a KO gene family ordered by its associated pathway, and each column corresponds
  to a metagenomic sample. Values are shown as row-wise Z-scores of log10(CPM+1),
  allowing comparison of relative enrichment patterns across samples. Samples are
  stratified by Source (nose vs. oropharyngeal, indicated by purple and orange bars,
  respectively). The heatmap shows that Source (nose vs. oropharynx) is the dominant
  factor shaping functional gene profiles, with asthma status exerting a weaker effect.
  CPM, counts per million; KEGG, Kyoto Encyclopedia of Genes and Genomes; KO, KEGG
  Orthology
