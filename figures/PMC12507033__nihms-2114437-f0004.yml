figure_title: Genomic analysis comparing brain versus leptomeningeal metastases and
  paired central nervous system (CNS) versus systemic metastases
caption: (A) Scatterplot of gene alterations with frequencies ≥5% in brain (BrM) and
  leptomeningeal (LM) metastases, or (D) paired CNS (intracranial) and systemic (extracranial)
  metastases. TP53, RB1, EGFR, and MET are shown regardless of frequency. Genes highlighted
  in red indicate a ≥10% frequency difference between the cohorts. Oncogenic signaling
  pathway alterations from (B) BrM and LM, or (E) paired CNS and systemic metastases.
  Bold text indicates statistical significance (two-sided Fisher’s exact test, P <
  0.05; Multiple testing correction by Benjamini-Hochberg, q < 0.05). (C) Genomic
  landscape of paired EGFR-mutant CNS (intracranial) and systemic (extracranial) samples.
  The type of genetic alteration (structural variant, deletion, amplification, truncating
  mutation, splice variant, missense mutation, inframe mutation, promoter mutation),
  mutational signature category [reactive oxygen species (ROS), homologous recombination
  deficiency (HRD), smoking, APOBEC, Clock-like, unknown], and whole-genome doubling
  (WGD) is described in the key. Time interval (in months) between paired samples
  is displayed under sample type. The frequency of mutations is noted on the left.
  Tumor mutational burden (TMB) frequency is displayed on top.CSF, cerebrospinal fluid
