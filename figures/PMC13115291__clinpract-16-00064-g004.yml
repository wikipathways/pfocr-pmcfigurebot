figure_title: Systems-level model of multi-compartment inflammatory signaling during
  triple herpesvirus latency.
caption: Systems-level model of multi-compartment inflammatory signaling during triple
  herpesvirus latency. This schematic illustrates a proposed conceptual framework
  derived from convergent mechanistic and clinical evidence showing how concurrent
  latency of herpes simplex virus (HSV), Epstein–Barr virus (EBV), and cytomegalovirus
  (CMV) could generate a distributed inflammatory architecture across neuroimmune,
  lymphoid, and myeloid compartments. Because few studies have directly measured triple
  latency in the same individuals, this model should be interpreted as a hypothetical
  integrative scenario rather than a proven biological sequence. HSV (purple), EBV
  (green), and CMV (mustard) persist in distinct latency niches—sensory neurons, memory
  B cells, and myeloid/endothelial cells—where episodic or subclinical reactivation
  produces intermittent immune signaling. HSV latency promotes microglial priming
  and neuroinflammatory signaling; EBV latency drives interferon/CXCL10-mediated lymphoid
  activation and autoimmune skewing; and CMV persistence induces T-cell exhaustion
  and immunosenescence. Cross-compartment crosstalk may reinforce inflammatory signaling,
  including CMV-driven immune aging, facilitating EBV reactivation, EBV-derived cytokines
  sensitizing neural pathways, and HSV-associated neuroimmune activation, enhancing
  systemic antigen presentation. Convergent activation of the COX-2/PGE2 axis may
  further amplify cytokine signaling and neuroinflammation, linking spatially distributed
  viral reservoirs to shared outcomes such as chronic pain, fatigue, autoimmunity,
  frailty, and cognitive vulnerability. Potential counter-regulatory or inhibitory
  interactions between these pathways may also occur; however, they remain insufficiently
  characterized. The model illustrates how distinct latency niches may collectively
  contribute to systemic inflammatory load even in the absence of overt viral symptoms.
  Arrows indicate the direction of signaling, cross-compartment interactions, and
  feed-forward amplification within the distributed inflammatory network. Circular
  arrows represent self-reinforcing feedback loops. Upward (↑) arrows denote increased
  expression, activity, or sensitivity. Schematic generated from author-developed
  prompts using the FigureLabs AI platform (https://www.figurelabs.ai/, accessed on
  21 March 2026) and curated by the author
