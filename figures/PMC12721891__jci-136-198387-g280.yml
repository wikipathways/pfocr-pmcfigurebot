figure_title: Single nucleus RNA-Seq identifies changes in cell proportions and subclustering
  analyses between subcutaneous abdomen and upper neck adipose tissue in unaffected
  patients
caption: (A) Uniform manifold approximation and projection (UMAP) of abdomen and upper
  neck biopsies across all patient groups (A, B, and C). ASPC, adipose stem and progenitor
  cells; LEC, lymphatic endothelial cells. (B) Marker genes for each cell population.
  (C) Permutation tests to identify changes in cell proportions in the upper neck
  relative to the abdominal biopsies from control patients (group C); changes were
  statistically significant if the log2FC was less or greater than 0.32 and the FDR
  was less than 0.05. (D) Adipocyte subclusters and corresponding GSEA pathways. (E)
  Adipocyte subcluster changes between the upper neck and abdomen in control patients.
  (F) ASPC subclusters with GSEA pathways. EMT, epithelial-mesenchymal transition.
  (G) ASPC subcluster changes in the upper neck relative to abdomen. (H) Macrophage
  subclusters with GSEA pathways. (I) Subcluster changes in macrophages in upper neck
  relative to abdomen. (J) T cell subclusters with GSEA pathways. (K) Subcluster changes
  in T cells in upper neck relative to abdomen
