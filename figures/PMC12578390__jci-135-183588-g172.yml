figure_title: Mechanisms of cyproheptadine antiinflammatory effects via protein kinase
  C pathway
caption: '(A) Relative mRNA levels of IL6 and MMP13 in human chondrocytes (n = 6)
  incubated with IL-1β (1 ng/mL) for 6 hours after pretreatment with or without cyproheptadine
  (CYP) and ionomycin (IONO). (B) Diagram of HRH1 signaling pathway. (C) Relative
  mRNA levels of IL6 and MMP13 in human chondrocytes (n = 7) incubated with IL-1β
  (1 ng/mL) for 6 hours after pretreatment with or without CYP and phorbol 12-myristate
  13-acetate (PMA) (20 nM). (D) Western blot analysis of total p65 and phosphorylated
  p65 at Ser536 (p-p65 (Ser536)) in chondrocytes (n = 3) incubated with PMA (20 nM)
  for 20 minutes after pretreatment with or without CYP (30 μM) for 24 hours. (E)
  Immunocytochemistry of p65 in chondrocytes (n = 3) incubated with PMA (20 nM) for
  40 minutes after pretreatment with or without CYP (30 μM) for 24 hours. Scale bar:
  50 μm. Data are presented as means ± SD. Statistical analysis was performed using
  1-way ANOVA with the Tukey-Kramer post hoc test. *P < 0.05, **P < 0.01, ***P < 0.001,
  ****P < 0.0001'
