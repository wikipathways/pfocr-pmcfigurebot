figure_title: FOSL1 promoted malignancies of GBM through activation of NF-κB signaling
  pathway.
caption: FOSL1 promoted malignancies of GBM through activation of NF-κB signaling
  pathway. A, EDU assay was employed to evaluate cell proliferation in LN229 and U87
  cells following FOSL1 knock-down, with or without IKKα overexpression (n = 3, with
  independent sample t test). Scale bars, 50 μm. B and C, Cell matrigel invasion assays
  were performed to evaluate cell invasion in LN229 and U87 cells following FOSL1
  knock-down, with or without IKKα overexpression (n = 3, with independent sample
  t test). Scale bars, 100 μm. D, Wound-healing assay was conducted to assess cell
  migration in LN229 and U87 cells following FOSL1 knock-down, with or without IKKα
  overexpression (n = 3, analyzed by independent sample t test). Scale bars, 200 μm.
  E, Flow cytometry-based apoptosis analysis was used to evaluate cell apoptosis in
  LN229 and U87 cells following FOSL1 knock-down, with or without IKKα overexpression
  (n = 3, with independent sample t test). F, immunoblot analysis was used to detect
  the expression of NF-κB related biomarkers in LN229 and U87 cells following FOSL1
  knock-down, with or without IKKα overexpression. GAPDH was used as the loading control
  for normalization. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. Data shown
  as mean ± SD. The immunoblotting experiments were repeated three times with similar
  results
