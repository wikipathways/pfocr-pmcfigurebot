figure_title: Signaling Pathways and Metabolic Features of M1/M2 Polarization in Hepatic
  Macrophages.
caption: 'Signaling Pathways and Metabolic Features of M1/M2 Polarization in Hepatic
  Macrophages. Figure Legend: this figure compares the polarization mechanisms and
  metabolic features of M1-type and M2-type hepatic macrophages. M1-type macrophages
  are primarily activated by factors such as IFN-γ, LPS, and GM-CSF, enhancing pro-inflammatory
  responses through signaling pathways like STAT1 and NF-κB, producing pro-inflammatory
  factors including iNOS, IL-12, and TNF-α, and relying on the glycolytic pathway
  to provide energy for their pathogen-killing functions. M2-type macrophages, under
  stimulation by Th2-type cytokines such as IL-4 and IL-13, polarize through signaling
  pathways including STAT6, PI3K-Akt, and PPARγ, exhibiting high expression of immunosuppressive
  factors like Arg-1, CD206, IL-10, and TGF-β, with primary functions of promoting
  tissue repair and fibrosis. Furthermore, M1-type macrophages favor glycolytic metabolism,
  whereas M2-type macrophages support their immunosuppressive and reparative functions
  through fatty acid oxidation and OXPHOS metabolic pathways (Standard arrows indicate
  activation or signaling flow, T-shaped blunt lines indicate inhibition, vertical
  arrows indicate translocation, and curved arrows indicate metabolite flow)'
