caption: Transcriptomic reprogramming of A253 spheroids by decellularized MRC-5 spheroid
  scaffolds. (a) Heatmap of DEGs (A only vs. A/M(DC)); rows scaled by z-score (n =
  3). (b) Principal component analysis (PCA) of A only and A/M(DC) groups. (c) Scatter/MA
  plot highlighting top up- and down-regulated genes in A/M(DC). (d) Gene Ontology
  (GO) analysis with “Molecular Function” enrichment among downregulated genes (Fold
  change ≥ 2, Volume ≥ 4, p < 0.05). (e) Differentially expressed genes categorized
  under “Epidermal growth factor receptor signaling pathway” (GO:0007173; Fold change
  ≥ 2, Volume ≥ 4, p < 0.05). (f) Differentially expressed genes categorized under
  “Positive regulation of catabolic process” (GO:0009896; Fold change ≥ 2, Volume
  ≥ 4, p < 0.05). (g) GO analysis showing “Molecular Function” enrichment among downregulated
  genes (Fold change ≥ 2, Volume ≥ 4, p < 0.05). (h) DEGs categorized under “Mitotic
  nuclear division” (GO:0140014; Fold change ≥ 2, Volume ≥ 4, p < 0.05)
