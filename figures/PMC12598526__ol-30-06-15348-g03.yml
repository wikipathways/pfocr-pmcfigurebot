figure_title: Gene characteristics of different PAAD subtypes.
caption: Gene characteristics of different PAAD subtypes. (A) Heatmap of upregulated
  genes in STING1-enriched subtype (C1) vs. STING1-depleted subtype (C2). (B) Heatmap
  of downregulated genes in STING1-enriched subtype (C1) vs. STING1-depleted subtype
  (C2). (red, high expression; blue, low expression). (C) GO enrichment analysis showing
  top biological processes in STING1-enriched subtype. (D) KEGG pathway enrichment
  analysis showing top signaling pathways in STING1-enriched subtype. (E) Mutational
  landscape of STING1-enriched subtype (C1) showing frequent mutations in KRAS, TP53
  and CDKN2A. (F) Mutational landscape of STING1-depleted subtype (C2) showing distinct
  mutation profile with SMAD4 alterations. PAAD, pancreatic ductal adenocarcinoma;
  STING, stimulator of interferon genes; FC, fold-change; fdr, false discovery rate;
  TMB, tumor mutational burden; GO, Gene Ontology; KEGG, Kyoto Encyclopedia of Genes
  and Genomes
