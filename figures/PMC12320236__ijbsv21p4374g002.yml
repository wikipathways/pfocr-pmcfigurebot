figure_title: A summary of the pathways of tryptophan metabolism.
caption: A summary of the pathways of tryptophan metabolism. Serotonin, kynurenine,
  and indole pathways are three mainly metabolic pathways of tryptophan metabolism.
  A small fraction of free L-tryptophan is used for protein synthesis and the production
  of neurotransmitters such as serotonin and neuromodulators such as tryptamine. However,
  over 95% of free tryptophan is a substrate for the kynurenine pathway of tryptophan
  degradation, which generates several metabolites. Tryptophan is converted into various
  metabolites by the gut microorganism such as indole, tryptamine, ILA, indoleacrylic
  acid, IAld, IAA, IPA, indole-3-pyruvate and indole-3-acetaldehyde and may affect
  host physiology in numerous ways
