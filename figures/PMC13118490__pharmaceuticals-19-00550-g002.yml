figure_title: Multitargeted mechanisms of natural compounds in cancer hallmarks.
caption: 'Multitargeted mechanisms of natural compounds in cancer hallmarks. This
  summarized representation organizes key natural compounds according to their primary
  impact on the biological hallmarks of cancer. It illustrates how individual agents,
  such as Curcumin, Resveratrol, and Salinomycin, can simultaneously interfere with
  multiple signaling pathways to suppress inflammation, inhibit growth and survival,
  block metastasis, deplete cancer stem cells, modulate the tumor microenvironment,
  and ultimately induce various forms of cell death [139,140,141,142,143,144,145,146,147,148,149,150,151].
  Abbreviations: NF-κB: nuclear factor kappa-light-chain-enhancer of activated B cells;
  IL-1β: interleukin-1 beta; TNF-α: tumor necrosis factor-alpha; COX-2: cyclooxygenase-2;
  PI3K: phosphoinositide 3-kinase; AKT: protein kinase B; mTOR: mammalian target of
  rapamycin; MAPK: mitogen-activated protein kinase; ERK: extracellular signal-regulated
  kinase; EGFR: epidermal growth factor receptor; STAT3: signal transducer and activator
  of transcription 3; AMPK: AMP-activated protein kinase; EMT: epithelial–mesenchymal
  transition; Snail: snail family transcriptional repressor 1; Twist: twist family
  transcription factor; ZEB1: zinc finger E-box-binding homeobox 1; Slug: snail family
  transcriptional repressor 2; MMP-2: matrix metalloproteinase-2; MMP-9: matrix metalloproteinase-9;
  Wnt: wingless-related integration site signaling pathway; β-catenin: beta-catenin;
  CSC: cancer stem cell; Sox-2: SRY-box transcription factor 2; HIF-1α: hypoxia-inducible
  factor 1-alpha; VEGFA: vascular endothelial growth factor A; NK cells: natural killer
  cells; CD8+ T-cells: cluster of differentiation 8-positive T lymphocytes; ROS: reactive
  oxygen species; EGCG: epigallocatechin-3-gallate; TNBC: triple-negative breast cancer.
  ⊣ = inhibition; → = downstream consequence or activation; ↓ = decrease; ↑ = increase'
