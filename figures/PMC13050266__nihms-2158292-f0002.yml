figure_title: Sex-biased Gene Expression Underlies Immune Dysfunction in Asthma
caption: (A.) Heat map depicting differentially expressed genes by sex in adult blood
  datasets from TIGER. Genes represented in purple are more highly expressed in females
  (negative values) and genes represented in yellow are genes more highly expressed
  in males (positive values) in these datasets. Corresponding chromosomal location
  of each gene (X chromosome, autosome, and Y chromosome) are shown in above the heatmap.
  (B.) Selected gene enrichment for genes more highly expressed in females in the
  TIGER adult blood meta-analysis. (C.) Selected gene enrichment for genes more highly
  expressed in males in the TIGER adult blood meta-analysis. Pathway analysis was
  performed using Metacore™ enrichment analysis
