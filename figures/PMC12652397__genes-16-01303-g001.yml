figure_title: 'Acute CRS (Type 1): Cardiac Arrest and Resuscitation Model.'
caption: 'Acute CRS (Type 1): Cardiac Arrest and Resuscitation Model. Mouse models
  of cardiac arrest and resuscitation have been used to study acute cardiorenal syndrome
  (CRS), where abrupt heart failure leads to acute kidney injury (AKI). Single-nucleus
  RNA sequencing (RNA-seq) of the kidney reveals significant transcriptomic changes,
  especially in proximal tubules (PT, segments S1/S2) and distal convoluted tubules
  (DCT), which exhibit loss of identity gene expression and dedifferentiation stress.
  Importantly, the renal transcriptomic profile after cardiac arrest-induced AKI closely
  mirrors that of human AKI biopsy samples, underscoring translational relevance.
  Gene enrichment analyses also implicate immune-inflammatory pathways, with both
  overlaps and distinctions compared to ischemia–reperfusion injury. Abbreviations:
  CRS, cardiorenal syndrome; AKI, acute kidney injury; PT, proximal tubule; S1/S2,
  proximal tubule segments; DCT, distal convoluted tubule; RNA-seq, RNA sequencing;
  Kidney snRNA-seq after cardiac arrest/resuscitation (GEO: GSE271437)'
