figure_title: Genetic deletion of B, T, and NK cells (SRG rats) inhibits the formation
  of ectopic calcification
caption: '(A) Experimental scheme comparing the ability of WT and SRG rats treated
  with DHT p.o. + FeCl3 s.c. to exhibit ectopic cutaneous calcification. (B) Gross
  images of dermal tissue in WT and SRG rats. Black arrowheads point to calcific regions.
  (C) Representative von Kossa–stained images highlighting calcified regions in rat
  dermal tissue. (D) Immunofluorescent staining of CD45+ and CD68+ cells in WT and
  SRG rat dermal tissue (representative images; n = 6 animals per group). Scale bars:
  100 μm. (E) CT scan of rat dermal tissue in WT and SRG rats (arrowheads point to
  extraskeletal calcification) (WT, n = 4 animals; SRG, n = 6 animals). (F) Quantification
  of free calcium levels in rat skin dermal tissues (n = 10 animals per group). (G)
  Assessment of alkaline phosphatase activity in rat dermal tissues (TNAP, tissue-nonspecific
  alkaline phosphatase) (WT DHT p.o. + FeCl3 s.c.: n = 4 animals; WT vehicle p.o.
  + H2O s.c.: n = 4 animals; SRG DHT p.o. + FeCl3 s.c.: n = 6 animals; SRG vehicle
  p.o. + H2O s.c.: n = 3 animals). (H) Upregulated pathways identified in WT versus
  SRG rats after DHT p.o. + FeCl3 s.c. (n = 4 animals per group). Data are represented
  as mean ± SEM. **P < 0.01, ***P < 0.001, ****P < 0.0001, 2-tailed Student’s t test'
