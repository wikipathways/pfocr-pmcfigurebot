figure_title: Integrated analysis of TACC3-related pathways.
caption: Integrated analysis of TACC3-related pathways. (A) Overlap of enriched pathways
  among TACC3 co-expression modules in non-tumor, tumor, and TACC3 knockdown (KD)
  conditions. (B) Network graph of enriched biological processes in HCC.NT and HCC.T
  tissues. (C) Venn diagram illustrating the overlap of the top 50 transcription factors
  (ChEA3) identified in WGCNA modules associated with TACC3-KAT2A, TACC3, and KAT2A
  in HCC.NT and HCC.T tissues. (D) Differential expression of top transcriptional
  regulators (TRs) associated with TACC3, KAT2A, or both between HCC.T and HCC.NT
  tissues. (E) Density plots showing the proportion of TACC3 and KAT2A expression
  variance explained by FOXM1 and ZNF692. HCC, hepatocellular carcinoma; HCC.NT, tumor-adjacent
  normal liver; HCC. T, tumor; MASLD, metabolic dysfunction-associated steatotic liver
  disease; WGCNA, weighted gene co-expression network analysis
