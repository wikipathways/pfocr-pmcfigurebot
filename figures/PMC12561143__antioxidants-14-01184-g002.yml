figure_title: Regulation of anti-aging genes by the RFF–SA combination via the IL-17
  signaling pathway.
caption: Regulation of anti-aging genes by the RFF–SA combination via the IL-17 signaling
  pathway. (A) Principal component analysis (PCA) comparing intra- and intergroup
  gene expression differences among control and cells treated with SA, RFF, or the
  RFF–SA combination. (B) Radar plot depicting 10 genes significantly upregulated
  in SA and RFF treatment groups relative to control. (C) Volcano plot illustrating
  differentially expressed genes in cells treated with the RFF–SA combination compared
  to the SA group; upregulated genes are shown in red, downregulated genes in green.
  (D) KEGG pathway enrichment analysis of differentially expressed genes in HFF-1
  cells treated with the RFF–SA combination based on RNA-Seq data. (E) A Venn diagram
  showing the differentially expressed genes. Data are presented as mean ± SD from
  three independent experiments
