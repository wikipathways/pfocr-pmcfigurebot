caption: (A) Iron homeostasis through the phagocytosis of red blood cells (RBCs),
  taken up by reticuloendothelial macrophages of the spleen and liver. Iron released
  by macrophages is transported into the blood by transferrin to be reused for the
  synthesis of new hemoglobin. (B) Ferric carboxymaltose (FCM) is taken up by reticuloendothelial
  macrophages of the spleen and liver as in the standard pathway of intravenous iron
  metabolism. (C) A portion of the infused iron escapes this rule in favor of the
  non-standard pathway, releasing some of the iron directly into the circulation and
  resulting in the formation of NTBI, with direct uptake by cells, in this case cardiomyocytes
