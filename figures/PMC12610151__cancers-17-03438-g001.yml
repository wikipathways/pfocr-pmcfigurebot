figure_title: Genetic progression from early adenoma to colorectal adenocarcinoma.
caption: Genetic progression from early adenoma to colorectal adenocarcinoma. This
  model represents a conceptual framework of colorectal tumorigenesis, in which not
  all the listed alterations necessarily co-occur, nor should their sequence be considered
  dogmatic. This sequence typically occurs over 5 to 20 years. The preneoplastic normal
  mucosa (colonic mucosal field) is influenced by environmental, inflammatory, microbial,
  and genetic/epigenetic factors. These exposures act as initiating or permissive
  conditions that predispose the mucosa to neoplastic transformation, operating both
  before and during the initiation phase of tumorigenesis. Key genetic events are
  crucial for progression through the successive stages of neoplastic evolution. APC
  loss and Wnt/beta-catenin pathway activation drive the transition from normal mucosa
  to early adenoma, a stage in which defects in the DNA mismatch repair (MMR) system
  may also arise, leading to accelerated mutational accumulation. The acquisition
  of KRAS, BRAF, PIK3CA, SMAD4, or TGFRbeta2 alterations marks progression from early
  to late adenoma, fostering increased proliferative and invasive potential. The emergence
  of TP53 mutations, in particular, is critical for the acquisition of a fully malignant
  phenotype. A broad spectrum of additional driver and passenger mutations is identified
  in advanced adenocarcinoma (e.g., ABL, AKT, CDH1, EGFR, ERBB2, FBXW7, FGFR2, KIT,
  MET, and others), illustrating the molecular heterogeneity and clonal diversification
  that accompany malignant progression
