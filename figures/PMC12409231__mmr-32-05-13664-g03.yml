figure_title: Graphical abstract summarizing the mechanism of mitophagy in NAFLD.
caption: Graphical abstract summarizing the mechanism of mitophagy in NAFLD. ROS and
  cytokine production, lipid peroxidation and cell death contribute to mitophagy in
  NAFLD. The PINK1/Parkin, PI3K/AKT/mTOR and AMPK pathways are the main signaling
  pathways involved in the regulation of mitophagy. This figure was created using
  Biorender software (https://app.biorender.com/). NAFLD, non-alcoholic fatty liver
  disease; ROS, reactive oxygen species; PINK1, PTEN-induced putative kinase 1; AMPK,
  AMP-activated protein kinase; UQCRC2, ubiquinol-cytochrome c reductase core protein
  2; P, phosphorylation
