figure_title: Shared and unique molecular features of NDNB-25-sensitive and -resistant
  populations.
caption: Shared and unique molecular features of NDNB-25-sensitive and -resistant
  populations. (A) NDNB-25 IC50 values across tested cell lines that have omics and
  dependency data available in DepMap. (B) Correlation between NDNB-25 IC50 and HSP90AB1
  RNAi and CRISPR dependency. (C) Most frequent damaging mutations enriched in NDNB-25-sensitive
  lines. (D) Pathway enrichment of damaging mutations in sensitive and resistant lines.
  (E) Shared DEGs between NDNB-25 IC50 and HSP90AB1 RNAi correlation analyses. (F)
  Enriched pathways among shared DEGs, including Rho GTPase signaling, cytoskeletal
  remodeling, RTK signaling, and phosphoinositide metabolism. (G) Western blot analysis
  of Hsp90α and Hsp90 client proteins in NCI-H23 parental and NDNB-25-acquired resistant
  cells generated by serial passaging in escalating NDNB-25 concentrations. (H) X/Y
  plot of Pearson correlation analysis between NDNB-25 sensitivity (IC50) and kynurenine
  abundance from the Depmap/CCLE metabolomics dataset. (I) LC–MS quantification of
  intracellular kynurenine in paired NCI-H23 parental and NDNB-25-acquired resistant
  cells. Kynurenine measurement by multiple-reaction monitoring (MRM) peak areas using
  the transitions m/z 209.1 → 94.1 (qualifier) and m/z 209.1 → 192.0 (quantifier).
  Data were analyzed by a two-tailed Student’s t-test, p < 0.001 (***). The uncropped
  blots are shown in Supplementary Materials
