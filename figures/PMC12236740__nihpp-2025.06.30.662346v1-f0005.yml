figure_title: CtBP dimerization is regulated by metabolic pathways affecting NAD(P)H
  redox balance
caption: (A) Schematic presentation of the BiFC system to analyze CtBP homodimerization
  by the activity of metabolic pathways or enzymes influencing the redox balance of
  nicotinamide cofactors. GAL4 expression (Pros-GAL4ts) was activated 16 h prior measurement
  for all BiFC experiments. (B) CtBP dimerization as measured by BiFC reporters expressed
  in EE cells (Pros-GAL4ts>CtBP-CCOE:CtBP-VNOE), EE cells marked by anti-Pros antibodies.
  (C) CtBP dimerization (number of BiFC positive cells within EE cell population)
  is inhibited by LbNOX and TpNOX overexpression, which oxidize NADH and NADPH, respectively.
  The data are analyzed using ordinary one-way ANOVA, ****P < 0.0001. nsindicates
  no significant difference in the studied parameter. (D) CtBP homodimerization in
  EE cells (BiFC) is regulated by sugar catabolism and nicotinamide metabolism. A
  diet containing 2-deoxyglucose (DG) was used to inhibit glucose catabolism. Diets
  with NR and AG1, a small molecule activator of the enzyme glucose-6-phosphate dehydrogenase
  (G6PD), were used to modulate the metabolic state. The data are analyzed using one-way
  ANOVA with Kruskal-Wallis correction for not normal distribution, with *P=0.0143,
  ***P = 0.0002, ****P < 0.0001. nsindicates no significant difference in the studied
  parameter. (E) Glucose catabolism through glycolysis and the pentose phosphate pathway
  activates CtBP homodimerization in the EE cells. The enzymes of glycolysis (phosphofructokinase,
  pfk) and the pentose phosphate pathway (G6PD, Zw) were depleted in EE cells. The
  data are analyzed using ordinary one-way ANOVA, with *P=0.0264, ****P < 0.0001.
  (F) Depletion of pfk and Zw in larval EE cells leads to sugar intolerance. Larval
  development on HSD (30% sucrose) was fully impaired with pfk knockdown (Pros-GAL4>)
  (χ2 = 128.0, P < 0.0001) and modestly delayed by Zw knockdown (χ2 = 12.1, P = 0.0004),
  as determined by the log-rank test. (G) Knockdown of pfk and Zw (Pros-GAL4>) in
  larvae fed on moderate (MSD, 5% sucrose) or high sugar diet (HSD, 30% sucrose) reduces
  the proportion of EE cells in the larval intestine. These genetic manipulations
  also decrease populations of Dh31-positive (H) and Tk-positive (I) cells (unpaired
  t-test, with **P < 0.01, ***P < 0.001)
