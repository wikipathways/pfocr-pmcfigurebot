figure_title: OsrA is a 3-oxo-Δ1-reductase essential for complete reduction of synthetic
  glucocorticoids
caption: (A) Structure of synthetic glucocorticoids used in assays. (B) Products formed
  from synthetic glucocorticoids following incubation with C. steroidoreducens HCS.1
  cells. Error bars refer to the standard deviation of three independent replicates.
  (C) Percent prednisolone conversion to cortisol following incubation of E. coli
  cells with osrA- and osrB-expressing plasmids or an empty vector control. Error
  bars refer to the standard deviation of three independent replicates. (D) Rate of
  reduction of indicated synthetic steroid hormones by purified OsrA. Error bars refer
  to the standard deviation of three independent replicates. (E) C. steroidoreducens
  HCS.1 steroid reduction pathway identified in this study
