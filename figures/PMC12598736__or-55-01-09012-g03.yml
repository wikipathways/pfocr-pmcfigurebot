figure_title: Effects of LY-61 and CD44 knockdown on the TGF-β/Smad2 pathway in claudin-low
  breast cancer cell lines.
caption: Effects of LY-61 and CD44 knockdown on the TGF-β/Smad2 pathway in claudin-low
  breast cancer cell lines. (A) Co-immunoprecipitation assays showing that CD44 co-precipitated
  with TGFBR1 in MDA-MB-231 cells. The CD44-TGFBR1 interaction signal was reduced
  in shCD44 cells. No detectable co-precipitation was observed between CD44 and TGFBR2.
  (B) Western blotting and RT-qPCR showing Smad2 protein and mRNA levels in MDA-MB-231
  and SUM159 cells following CD44 knockdown and/or LY-61 treatment. Representative
  western blots (top), densitometric semi-quantification of Smad2 protein levels (middle)
  and mRNA expression levels determined by RT-qPCR (bottom) are shown. Data are presented
  as the mean ± SD from three independent experiments (n=3). (C) Western blot analysis
  of p-Smad2 and total Smad2 protein levels after TGF-β stimulation in MDA-MB-231
  and SUM159 cells with or without CD44 knockdown. The semi-quantification of Smad2
  phosphorylation was performed by calculating the p-Smad2/Smad2 ratio. CD44 knockdown
  increased TGF-β-induced p-Smad2 levels in both cell lines. (D) Western blotting
  showing the effect of LY-61 treatment on p-Smad2 levels in MDA-MB-231 and SUM159
  cells. Densitometric semi-quantification of the p-Smad2/Smad2 ratio from three independent
  experiments (n=3) is shown below the blots. (E) Relative mRNA expression levels
  of Snai1 and Twist in SUM159 and MDA-MB-231 cells following CD44 knockdown and/or
  LY-61 treatment, as determined using RT-qPCR. Data are presented as the mean ± SD
  from three independent experiments (n=3). Statistical significance was assessed
  using one-way ANOVA followed by (B) Dunnett's or (D and E) Tukey's multiple comparisons
  test, or (C) unpaired two-tailed Student's t-test. *P<0.05; **P<0.01. Ctrl, control;
  LY-61, LY2109761; NS, not significant; p-, phosphorylated; RT-qPCR, reverse transcription-quantitative
  PCR; sh, short hairpin RNA; Snai1, snail family transcriptional repressor 1; TGFBR,
  TGF-β receptor; IP, immunoprecipitation
