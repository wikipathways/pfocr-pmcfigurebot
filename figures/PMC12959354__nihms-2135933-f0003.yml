figure_title: Emerging approaches, strategies, and outcomes for optimizing CNS phagocytic
  efficiency
caption: a. Agonists for phagocytic receptors, such as a TREM2 agonist antibody, drive
  intracellular signaling that can enhance phagocytosis and inflammatory pathways
  within CNS phagocytes. b. Adding engineered fusion or hybrid proteins can amplify
  uptake of pathological CNS debris and amyloid-β (Aβ) plaques. For example, Aβ removal
  can be augmented by a hybrid protein pairing an Aβ-specific antibody moiety with
  Gas6 [142], thereby crosslinking Aβ with TAM receptors like MerTK. c. Another goal
  of phagocytic modulation is preserving lesion- or plaque-adjacent CNS tissue; this
  can be achieved by masking “eat-me” signals exposed on injured-but-viable cells.
  In the illustrated hypothetical approach, externalized phosphatidylserine (PS) is
  masked by annexin V from its cognate receptors. d. Focal activation of phagocytosis
  aims to enhance uptake of apoptotic debris and plaques specifically in the pathology
  epicenter. Emerging strategies include local injection of phagocytosis-driving particles
  (e.g., nanoparticles, AAVs); local transient breakdown of the blood-brain barrier
  (BBB) to enable drug delivery; or other innovative strategies like local activation
  using nanomaterials, chemogenetics, or optogenetics. Future research should further
  test, optimize, and combine these emerging strategies to boost phagocytosis selectively
  in pathological areas of the CNS. Figure created in part with BioRender.com
