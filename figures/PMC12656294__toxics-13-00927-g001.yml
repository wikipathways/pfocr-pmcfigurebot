caption: 'Pathways linking sunscreen ultraviolet (UV) filters to polycystic ovary
  syndrome (PCOS)-specific outcomes: (A) Oxybenzone and octinoxate enter the body
  through dermal absorption, inhalation of sprays, or ingestion of contaminated seafood
  and water, with high systemic absorption, bioaccumulation, and transplacental transfer;
  (B) Mechanistic disruptions include steroidogenic enzyme interference, estrogenic/anti-androgenic
  receptor activity, thyroid hormone imbalance, oxidative stress with mitochondrial
  dysfunction, vitamin D pathway modulation, and epigenetic reprogramming; (C) These
  pathways converge on PCOS pathophysiology, leading to hyperandrogenism, disrupted
  folliculogenesis and anovulation, adipokine imbalance with insulin resistance (IR),
  vitamin D deficiency, and potential transgenerational susceptibility'
