figure_title: Post-stroke rehabilitation requires a multidimensional assessment approach
  that integrates both qualitative and quantitative evaluations.
caption: Post-stroke rehabilitation requires a multidimensional assessment approach
  that integrates both qualitative and quantitative evaluations. Traditional qualitative
  scales assess aspects like body structure, sensory and cognitive functions, and
  quality of life but have limitations in sensitivity and objectivity. In contrast,
  quantitative methods offer more precise insights into motor and neural function
  recovery. Combining these tools enhances monitoring and personalization of therapy,
  supporting a more tailored and effective rehabilitation pathway
article_title: From Qualitative to Quantitative Functional Assessment in Stroke Rehabilitation
  with a Focus on Ultrasound Role
