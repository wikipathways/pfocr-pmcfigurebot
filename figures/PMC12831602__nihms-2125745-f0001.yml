figure_title: Vatiamide pathway β-hairpin DD system.
caption: 'Vatiamide pathway β-hairpin DD system. A) Predicted interaction (AlphaFold-Multimer26)
  of the VatM ACP (yellow) and VatN C domain (pink), mediated by a SLiMM (gray)-βHDNQS
  (black) interaction. The complex is shown with the ACP in position for substrate
  transfer. The C-terminal six amino acids of the SLiM are predicted to form a β-strand
  in the β-sheet of the βHD. The domains that flank VatM ACP-SLiMM and VatN βHDNQS-C
  are indicated. KS: ketosynthase, AT: acyltransferase, DH: dehydratase, ER: enoylreductase,
  KR: ketoreductase, A: adenylation, MT: methyltransferase, TE: thioesterase. B) Sequence
  alignments of upstream and downstream docking elements of the proteins in this study.
  Aligned residues are colored according to the Clustal X color scheme. Vertical lines
  indicate engineered boundaries for the SLiM and locations of chimera junctions.
  The C-terminal six residues of the SLiM are expected to interact with strand β2
  of the βHD10. C) Simplified schematic showing the biosynthesis of vatiamides A-F.
  Modules A-M produce a polyketide precursor, which is tethered to the VatM ACP. The
  VatM SLiM (gray arrow) and identical βHDNQS (gray boxes) facilitate transfer of
  the polyketide intermediate through the VatN, VatQ, and VatS routes to produce three
  distinct products12'
