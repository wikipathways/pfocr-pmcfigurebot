figure_title: Temperature-dependent lipidomic changes following POAKOR+ activation
caption: 'A) Heatmap of lipid abundance across conditions for the top 50 lipids showing
  the greatest separation between the hypothermic (N=6), normothermic (N=5) and control
  (N=6) conditions. (B) Pathway analysis for lipid metabolism. Nodes represent different
  lipid classes. Edges indicate transformations between lipid species, with numbers
  representing Z-score change in lipid conversion. Cyan nodes and arrows represent
  increased conversion in the hypothermic- POAKOR+ group compared to control, but
  not normothermic- POAKOR+ using a threshold of |Z-score| > 0.95. White nodes and
  unshaded arrows indicate lipids with no significant change in conversion. (C) Fourteen
  individual lipids that were significantly different (uncorrected *P < 0.1) in the
  hypothermic- POAKOR+ condition relative to control, but not the normothermic condition.
  Lipid class abbreviations: dhCer (Dihydroceramide), Cer (Ceramide), SBP (Sphingosine),
  SM (Sphingomyelin), PE (Phosphoethanolamine), PS (Phosphoserine), PC (Phosphocholine),
  DG (Diacylglycerol), TG (Triacylglycerol), FA (Fatty Acid), Sph (Sphinganine), CAR
  (Carnitine), PE P (Plasmalogen Phosphoethanolamine), PG (Phosphoglycerol), PI (Phosphatidylinositol),
  CE (Cholesteryl Ester), LPC (Lysophosphatidylcholine), LPE (Lysophosphatidylethanolamine),
  O-PE (Ether-linked Phosphoethanolamine), P-PE (Plasmenyl-Phosphoethanolamine)'
