figure_title: Spn-H2O2 drives Warburg-like metabolic reprogramming in lung epithelial
  cells
caption: (A–C, E–G) Human bronchial Calu-3 cells were mock-infected, infected with
  Spn strains, or incubated with Spn cultured in cell culture medium for 8 h. Culture
  supernatants (extracellular) or cell pellets (intracellular) were harvested to quantify
  levels of (A, B) citrate, (C) glucose, (E) acetate, and (F, G) lactate, as described
  in Materials and Methods. Data represent mean ± SEM; one-way ANOVA with Dunnett’s
  post hoc test (versus mock-infected cells) or unpaired Student’s t-test (versus
  TIGR4 strain); ns, not significant; *p < 0.05; **p < 0.005; ***p < 0.0005; ****p
  < 0.0001. (D) Diagram of pyruvate node reactions under aerobic conditions, incorporating
  oxaloacetate and citrate. Enzymes are highlighted in gray. (H) RNA-seq analysis
  of Calu-3 cells or (I) BEAS 2B mock-infected or infected with Spn strains. Heatmap
  depicts expression of glycolysis-related genes; NS, not significant. (K) Schematic
  of the canonical glycolysis pathway, highlighting genes encoding enzymes upregulated
  in RNA-seq analysis
