figure_title: RUNX and EGR seqlets in SSc and control fibroblasts.
caption: RUNX and EGR seqlets in SSc and control fibroblasts.(A) Number of RUNX seqlets
  (as detected for the MA0002.1 RUNX1 matrix profile) unique to and shared by SSc
  and control fibroblasts. Heatmap of RUNX contribution score dot product for each
  seqlet/chromatin region divided by SSc and control fibroblasts into 10 clusters.
  Darker blue indicates a higher contribution score. (B) Pathways enriched by gene
  ontology for the RUNX clusters 8 and 9 chromatin regions. (C) Contribution score
  track depictions for SSc and control fibroblasts of 3 chromatin regions (annotated
  to MYO3A, CDH17, and FGF6) enriched in the anatomical structure morphogenesis pathway,
  from RUNX clusters 8 and 9. (D) Pathways enriched by gene ontology for the RUNX
  cluster 10 chromatin regions. (E) Contribution score track depictions for SSc and
  control fibroblasts of 3 chromatin regions (annotated to TGFBR2, TRABD2B, and CPED1/WNT16)
  enriched in the regulation of signal transduction pathway, from RUNX cluster 10.
  (F) Number of EGR seqlets (as detected for the MA0162.5 EGR1 matrix profile) unique
  to and shared by SSc and control fibroblasts. Heatmap of EGR contribution score
  dot product for each seqlet/chromatin region divided by SSc and control fibroblasts
  into 10 clusters. Darker blue indicates a higher contribution score. (G) Pathways
  enriched by gene ontology for the EGR clusters 1, 2, 9, and 10 chromatin regions.
  (H) Contribution score track depictions for SSc and control fibroblasts of 3 chromatin
  regions (annotated to PACSIN1, MYO15A,and MYOM2) enriched in the regulation of actin-filament–based
  process pathway, from EGR clusters 1, 2, 9, and 10. (I) Pseudobulk bias removed
  signal and contribution score tracks for ADAM12 region with EGR footprinting in
  SSc fibroblasts. (J) Relative luciferase activity (ratio of firefly to renilla luminescence)
  for control plasmid (empty vector), MYO3A and ADAM12 OCR wild type, and mutant (point
  mutation disrupting the listed transcription factor binding site) plasmids in transfected
  IMR90 fibroblasts. CS, contribution score; SSc, systemic sclerosis-associated
