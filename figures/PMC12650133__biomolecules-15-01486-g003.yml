figure_title: Electroacupuncture restores gut microbial and functional imbalances
  in AD model.
caption: Electroacupuncture restores gut microbial and functional imbalances in AD
  model. (A) Box plots showing the relative abundance of specific bacterial phyla
  recovered by EA-treatment, including Verrucomicrobia, Acidobacteria, Cyanobacteria,
  Actinobacteria, and Proteobacteria, across the control group, AD model group, and
  electroacupuncture-treated group. (B) Box plots showing the relative abundance of
  specific bacterial genera recovered by EA-treatment, including Sphingomonas, Massilia,
  Ruminococcaceae_UCG-013, Escherichia-Shigella, and Erysipelatoclostridium, across
  the three groups. The “line” represents the median, and “dot” represents a single
  sample. (C) Principal component analysis (PCA) plot of microbial KEGG pathways showing
  the clustering of control, model, and electroacupuncture groups. Different colors
  represent the three groups, with the density distribution of samples along PC1 and
  PC2 illustrated. (D) Bar plot showing the relative abundance of KEGG pathways recovered
  by EA-treatment across the three groups. Pathways are categorized into metabolism,
  human diseases, and cellular processes, with distinct patterns observed among the
  groups. Statistical significance was set as * p < 0.05, ** p < 0.01
