figure_title: Lipid metabolic reprogramming in PH.
caption: 'Lipid metabolic reprogramming in PH. Cellular lipid synthesis integrates
  multiple metabolic inputs. Fatty acids can be supplied through passive diffusion
  or protein-mediated transport (e.g., FATPs and CD36). In addition, the coordinated
  upregulation of glycolysis and glutaminolysis ensures a continuous supply of acetyl-CoA
  and citrate. Along with the acetyl-CoA generated from mitochondrial FAO, these sources
  converge in the TCA cycle to produce citrate. Exported citrate provides acetyl-CoA
  via ACLY, fueling both fatty acid and cholesterol biosynthesis. The rate-limiting
  step of lipogenesis is catalyzed by ACACA, producing malonyl-CoA, which, together
  with acetyl-CoA, is utilized by FASN to generate palmitate. This product can be
  further elongated by ELOVL or desaturated by SCD and FADS2 to form SFAs and MUFAs.
  Cholesterol synthesis begins with acetyl-CoA, which is processed by HMGCS through
  the mevalonate pathway. Lipids are stored in LDs in the form of TAGs, with DGAT
  catalyzing the final step of TAG synthesis. During the pathogenesis of PH, cells
  reprogram lipid metabolism to adapt to genetic alterations and environmental stress,
  as illustrated by the altered pathways and upregulated proteins highlighted in the
  figure. Red arrows in the figure denote the upregulated expression of target molecules
  in PH. ACACA: acetyl-CoA carboxylase; ACLY: ATP-citrate lyase; ACSL: acyl-CoA synthetase
  long-chain family; CD36: cluster of differentiation 36; CPT1: carnitine palmitoyltransferase
  1; ELOVL: elongation of very long-chain fatty acid proteins; FADS2: fatty acid desaturase
  2; FASN: fatty acid synthase; FATPs: fatty acid transport proteins; FFAs: free fatty
  acids; GLUT1: glucose transporter 1; HKII: hexokinase II; HMG-CoA: 3-hydroxy-3-methylglutaryl-CoA;
  HMGCS: 3-hydroxy-3-methylglutaryl-CoA synthase; MUFAs: monounsaturated fatty acids;
  PFK: phosphofructokinase; SCD: stearoyl-coA desaturase; SFAs: saturated fatty acids;
  TAGs: triacylglycerols; TCA: tricarboxylic acid. This figure was created with BioRender.com'
