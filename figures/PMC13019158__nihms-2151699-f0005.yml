figure_title: STING1 variants are associated with diverse tumor immunity and treatment
  responses targeting the intrinsic IFN-I signal
caption: (A) Three-dimensional visualization of genetic variation in individuals from
  the reference populations and TCGA patients on the first three principal components
  (PCs) generated by EIGENSTRAT. In the top left, colors represent reference populations,
  while gray represents TCGA patients. The other graphs display individuals from TCGA
  with the STING1 WT/WT (green), AQ/AQ (orange), and HAQ/HAQ (dark red) haplotypes.(B)
  Alluvial plot illustrates the distribution of distinct STING1 haplotypes among five
  genetic ancestry populations in TCGA cohort.(C) Pie plots illustrate the distribution
  of four major STING1 haplotype groups among five genetic ancestry populations in
  TCGA cohort. Colors represent the different haplotype groups for the STING1 gene.(D)
  Comparison of the tumor purity in TCGA specimens harboring STING1 WT/WT or HAQ/HAQ
  haplotypes, with statistical significance determined by a meta p value after adjusting
  for genetic ancestry and cancer type.(E) Comparison of the leukocyte fraction in
  TCGA specimens harboring STING1 WT/WT or HAQ/HAQ haplotypes, with statistical significance
  determined by a meta p value after adjusting for genetic ancestry and cancer type.(F)
  Distribution of local ancestry at the STING1 genomic locus in TCGA patients. For
  each individual, local ancestry was normalized by their global ancestry, inferred
  through STRUCTURE. Each color corresponds to one of the four reference ancestries
  used in the local ancestry estimation. TCGA patients were grouped into five ancestry
  categories based on EIGENSTRAT, represented as five bars. Within each ancestry group,
  patients are shown as rows segmented by colors reflecting their genetic ancestry
  composition. The rows are ordered by hierarchical clustering using Ward’s method,
  with the distance matrix derived from the cosine dissimilarity of genetic composition.(G)
  An illustration of the IFN-I pathway and its feedback regulation loops mediated
  by PARP7 and USP18.(H) The percentage of PARP7i-sensitive and -resistant cell lines
  in cells with STING1 non-HAQ and HAQ haplotypes.(I) The viabilities of cancer cells
  following a 72-h treatment with PARP7i (RBN2397) were evaluated using MTT assays
  in six cancer cell lines with different STING1 haplotypes.(J) A representative image
  of the colony formation assay for cells treated with RBN2397 for 6 days in six cancer
  cell lines with different STING1 haplotypes.(K) Western blots were used to detect
  TBK1 and STAT1 phosphorylation after 48 h of RBN2397 treatment in cell lines with
  different STING1 haplotypes.(L) Western blots were used to detect TBK1 and STAT1
  phosphorylation after 30 min of cGAMP treatment in cell lines with different STING1
  haplotypes
