figure_title: NFS1-Hippo, p53, and STAT signaling axes regulate the ferroptosis mechanism
  mediated by the System Xc−- glutathione (GSH) -glutathione peroxidase 4 (GPX4) pathway.
caption: 'NFS1-Hippo, p53, and STAT signaling axes regulate the ferroptosis mechanism
  mediated by the System Xc−- glutathione (GSH) -glutathione peroxidase 4 (GPX4) pathway.
  (① System Xc−-GSH-GPX4 antioxidant defense: System Xc− comprises SLC7A11 and SLC3A2,
  which maintain intracellular GSH synthesis by promoting extracellular Cys uptake
  and Glu efflux. As a key substrate for GPX4, GSH participates in lipid peroxide
  clearance, thereby inhibiting ferroptosis. ② Upstream regulation and signaling network
  of NFS1: Activation of the Hippo pathway promotes YAP-YY1 binding, weakening YAP/TEAD1
  complex formation and downregulating NFS1 expression. NFS1 deficiency induces mitochondrial
  oxidative stress and Fe-S cluster imbalance, activates STAT signaling and inflammatory
  factor secretion like IL-6 and IFN-γ, and upregulates p53. Activated p53 then inhibits
  SLC7A11 transcription, thereby impairing Xc−-mediated Cys uptake, which reduces
  GSH levels and GPX4 activity, and promotes lipid peroxidation'
