figure_title: Metabolomics data analysis.
caption: Metabolomics data analysis. (A) Positive ion PCA score plot for each group
  (n = 7). (B) Negative ion PCA score plot for each group (n = 7). (C) Heatmap of
  differential metabolites between groups (n = 7). Red arrows mark the metabolites
  displayed in the lollipop plot. (D) The lollipop plot illustrates the p values,
  Log2 fold change values, and VIP scores of these metabolites (ranked by VIP value),
  based on the comparison between the model group and the CF-treated group. In this
  analysis, a Log2 fold change < 0 indicates that the metabolite level was downregulated
  after CF treatment, whereas a Log2 fold change > 0 reflects an upregulation in response
  to CF treatment. (E) Analysis of metabolic pathways in the control and model groups
  containing differential metabolites. (F) Pathway analysis of different metabolites
  in the model and CF groups The red arrows denote metabolites exhibiting significant
  differences. The red box indicates the KEGG pathways related to arachidonic acid
  and purine metabolism
