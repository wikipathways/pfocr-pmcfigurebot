figure_title: Pathway analysis of differentially expressed genes (DEGs) using the
  Kyoto Encyclopedia of Genes and Genomes database.
caption: Pathway analysis of differentially expressed genes (DEGs) using the Kyoto
  Encyclopedia of Genes and Genomes database. (A) DEGs in the TMZ + epirubicin + 5FU
  group compared to the control group were associated with 78 upregulated and 32 downregulated
  pathways. Key upregulated pathways included ribosome, coronavirus disease-COVID-19,
  and Epstein–Barr virus infection. (B) Clustering of pathway groups with significant
  expression variability (FDR < 0.05) in the TMZ + epirubicin + 5FU vs. control comparison.
  The top three upregulated pathways were ribosome, Parkinson’s disease, and Huntington’s
  disease, while the top three downregulated pathways were cell cycle, nucleocytoplasmic
  transport, and focal adhesion
