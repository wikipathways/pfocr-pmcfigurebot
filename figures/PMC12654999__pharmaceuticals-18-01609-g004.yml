figure_title: Tritherapy effects on endochondral ossification.
caption: 'Tritherapy effects on endochondral ossification. (A) Expression of the WNT
  effector gene Axin2, as measured by RT–PCR, in the prechondrogenic ATDC5 cell line
  with or without WNT pathway stimuli (LiCl, BIO) and rosiglitazone. $$ p < 0.01between
  the rosiglitazone-treated groups. # p < 0.05, ## p < 0.01, ### p < 0.001 vs. the
  stimuli treated. (B) Expression of the WNT effector gene Axin2, as measured by RT–PCR,
  in the prechondrogenic ATDC5 cell line with or without WNT pathway stimuli (LiCl,
  BIO) and pioglitazone. $ p < 0.05 between the pioglitazone-treated groups. # p <
  0.05, ## p < 0.01 vs. the stimuli treated. (C) Expression of the osteoblastic and
  chondrogenic marker genes osteopontin (Spp1), osteoactivin (Gpnmb), osteocalcin
  (Bglap) and collagen-2-α-1 (Col2a1) was measured via RT–PCR in an endochondral ATDC5
  cell line model treated with P-tritherapy for 28 days. * p < 0.05, ** p < 0.01,
  *** p < 0.001, **** p < 0.0001 versus the control'
