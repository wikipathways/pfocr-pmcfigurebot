figure_title: Pathway and single cell expression analysis of 53 validated thromboinflammatory
  mediators reveals central role of brain barrier compromise and neurovascular unit
caption: 'Pathway analysis of the validated thromboinflammatory mediators using the
  EnrichR platform incorporating eight curated libraries: GO Biological Process (2025),
  GO Cellular Component (2025), GO Molecular Function (2025), Jensen (Disease Curated
  and Experimental; 2025), Reactome (2024), SynGO (2024), and WikiPathways (2024).
  a, Mediators positively associated with neurodegeneration (31 genes) showed enrichment
  for neovascularization processes (P = 4.26e-4), protein glycosylation (P = 2.27e-4),
  and NOTCH signaling pathways (P = 1.22e-3). b, Mediators negatively associated with
  neurodegeneration (21 genes) were enriched for vascular regulation (P = 1.03e-4),
  synaptic processes (P = 3.97e-3), ficolin-1-rich granule components (P = 3.20e-3
  for lumen, P = 6.90e-3 for granules), and autoimmune disease pathways (P = 1.38e-3).
  c, One-versus-rest differential-expression analysis of an ex vivo scRNA-seq atlas
  across principal neurovascular and glial cell types. Endothelial cell-selective
  expression: FLT4 (log2FC = 7.29, 15.8% of cells), ROBO4 (5.54, 72.2%), PLXND1 (2.07,
  44.0%). Multi-cellular patterns: FN1 in pericytes (3.53, 86.5%), endothelial cells
  (3.29, 90.2%), fibroblasts (1.86, 68.6%), smooth-muscle cells (0.85, 64.1%); GSN
  in fibroblasts (1.37, 80.5%), oligodendrocytes (1.29, 93.5%), smooth-muscle cells
  (0.76, 90.9%), endothelial cells (0.70, 85.2%), microglia/macrophages (0.61, 64.7%),
  pericytes (0.50, 70.7%). Oligodendrocyte enrichment: SYT11 (3.12, 95.1%), ATOX1
  (1.72, 76.4%), NDRG3 (0.98, 23.4%). Mural cell expression: NOTCH3 in pericytes (4.69,
  91.3%) and smooth-muscle cells (2.73, 87.6%); CRIP1 in pericytes (1.84, 14.0%) and
  smooth-muscle cells (4.77, 51.7%). Microglial/macrophage enrichment: B4GALT1 (2.88,
  41.3%), CTSD (1.32, 42.4%), ATF6 (1.48, 26.6%)'
article_title: A proteomic signature of vascular dysfunction linked to tauopathy and
  degeneration in the aging brain
