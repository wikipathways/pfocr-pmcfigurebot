figure_title: CRISPR screen identifies modulators of polyamine sensitivity
caption: '(A) Chemical structures of mammalian polyamines.(B) Schematic of the polyamine
  metabolic pathway in mammalian cells. DFMO: difluoromethylornithine, Sard: sardomozide.(C)
  Cumulative population doublings of K562 cells treated with DFMO (0.5 mM), sardomozide
  (1 μM), and RO-3306 (5 μM, CDK1 inhibitor) over 12 days. Cells were passaged every
  3 days.(D) Schematic of the CRISPR knockout screen workflow in K562 cells.(E) Volcano
  plot showing −log10 (P value) versus median log2 (fold depletion) for all genes
  identified in the CRISPR drop-out screen. Horizontal line: p < 0.05; vertical line:
  fold change < −1.5. Top hits are highlighted in blue.(F) Fold change of sgRNAs targeting
  indicated genes. Each point represents a distinct sgRNA sequence. Error bars indicate
  mean ± SD (n = 5 sgRNAs).(G) Viability of AAVS1 and GPX4 knockout (KO) K562 cells
  treated with sardomozide (5 μM, 96 h).(H) Viability of K562 cells treated with A-1331852
  (0.1 μM, 48 h) following pre-treatment with sardomozide (5 μM, 72 h). DMSO served
  as the vehicle control'
