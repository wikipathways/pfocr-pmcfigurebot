figure_title: Antidiabetic mechanism of cinnamaldehyde in both in vitro and in vivo
  studies.
caption: Antidiabetic mechanism of cinnamaldehyde in both in vitro and in vivo studies.
  (A) Probable mechanism of the effects of CA and metformin on insulin-resistant adipocytes
  (3T3L1 cells), with both increasing miR26-b expression with a concomitant reduction
  in miR320 expression through the GLUT4 dependent pathway. (B) Summarized mechanism
  of combination of CA and kaempferol for regulating glucose and lipid metabolism
  via AMPK in a diabetic mouse model, with green colored arrows indicating the pathways
  facilitated by their synergistic effect, while upward and downward arrows denote
  upregulation and downregulation, respectively. (C,D) Effects of CA and glyburide/metformin
  on gestational diabetes in fat–sucrose diet/streptozotocin-inducted rats with periodic
  acid-Schiff (PAS)-stained placenta images showing placenta glycogen content, showing
  several-fold increases in gestational placenta compared to control (C), along with
  a plot revealing a significant decline in PAS H-score for both CA and glyburide/metformin-treated
  gestational diabetic rats. The arrowheads in (C) represent PAS-positive glycogen
  storage cells, while normal arrows denote PAS-positive spongiotrophoblast cells.
  (E) A schematic diagram showing the fabrication of pH-responsive TNT-CA and its
  anti-inflammatory, osteogenic and antibacterial effects on a simulated diabetes
  condition using RAW 264.7 cells, BMSC cells and Streptococcus mutans/Porphyromonas
  gingivalis bacteria. Different letters (a–c) in (D) indicate statistically significant
  data at p < 0.05. B, basal layer; L, labyrinth layer; TNT-CA, titanium dioxide-cinnamaldehyde;
  HG/HG + LPS, high-glucose- or high-glucose plus lipopolysaccharide-induced BMSCs;
  BMSCs, bone marrow mesenchymal stromal cells; RAW 264.7 cells, macrophage cells;
  Ti, titanium; IL-10, interleukin-10; M1, iNOS marker (inducible nitric oxide synthase);
  M2, CD163 marker (cluster of differentiation 163); APTES, 3-aminopropyltriethoxysilane;
  ATP, adenosine triphosphate; AMP, adenosine monophosphate; AMPK, adenosine monophosphate
  kinase; FA, fatty acid; TG, triglyceride; ACC, acetyl-CoA carboxylase; TCA, tricarboxylic
  acid cycle; ENO1, enolase 1; KP, kaempferol; CA, cinnamaldehyde; PAS H-score, periodic
  acid-Schiff histochemical score. Adapted with permission from Naghiaee et al. [123],
  Gao et al. [125], Hosni et al. [122] and Lee et al. [131]
