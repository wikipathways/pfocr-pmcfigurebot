caption: 'Overview of the hypothalamic–pituitary–adrenal axis and adrenal steroidogenesis
  pathway. Corticotropin-releasing hormone (CRH) from the hypothalamus stimulates
  pituitary ACTH release, which activates cortisol synthesis in the adrenal cortex.
  The zoomed-in view illustrates key steroidogenic steps from cholesterol to cortisol
  and highlights the inhibitory sites of drugs targeting this pathway. Abbreviations:
  CYP11A1, cytochrome P450 family 11 subfamily A member 1; CYP17A1, cytochrome P450
  family 17 subfamily A member 1; CYP21A2, cytochrome P450 family 21 subfamily A member
  2; CYP11B1, cytochrome P450 family 11 subfamily B member 1; CYP11B2, cytochrome
  P450 family 11 subfamily B member 2; 3β-HSD2, 3β-hydroxysteroid dehydrogenase; DHEA,
  dehydroepiandrosterone; MIT, mitotane; KET, ketoconazole; L-KET, levoketoconazole;
  MET, metyrapone; OSI, osilodrostat; AMG, aminoglutethimide; ABI, abiraterone'
