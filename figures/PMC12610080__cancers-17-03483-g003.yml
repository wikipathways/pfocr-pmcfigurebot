figure_title: Stratification and functional characterization of epithelial subpopulations.
caption: Stratification and functional characterization of epithelial subpopulations.
  (A) Epithelial cells colored by single-cell copy number variation (CNV) score. (B)
  CNV score distributions of epithelial clusters defined by k-means. (C) Normal and
  malignant epithelial subsets defined by per-cell CNV scores. (D) Malignant epithelial
  cells reclustered into six malignant subpopulations (C0–C5). (E) Volcano plot of
  differentially expressed genes in malignant epithelial cells. (F) Heatmap of pathway
  activity scores across malignant subclusters. (G) Kaplan–Meier survival curves showing
  that high abundance of subcluster C5 correlates with worse overall survival in four
  cohorts. (H) Monocle pseudotime trajectory of malignant epithelial cells, colored
  by subcluster identity (left) and inferred differentiation pseudotime (middle).
  (I) Boxplot of CytoTRACE potency scores for each malignant subcluster
