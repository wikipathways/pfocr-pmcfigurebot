figure_title: Iron supplementation suppresses DUX4-activated ferroptosis-related pathway
caption: '(A) Time course. Control or DUX4-Tg mice were fed ND or HID mixed with TMX
  at a concentration of 0.03 mg/g feed for 4 weeks as shown in Figure 4. (B and C)
  Immunoblot analysis for protein expression in quadriceps muscles (n = 8–11). (D)
  Immunohistochemistry for 8-OHdG and laminin to measure DNA damage in TA muscle (samples
  also used in Figure 5H). Scale bar: 100 μm; n = 7–11. (E) GSH/GSSG assay of biceps
  muscles (n = 5–7). (F–I) Myoblasts were induced to differentiate into myotubes in
  culture as shown in Figure 1B. Cultured myotubes were treated with 20 μM DFO or
  10 μM FAS for 48 hours in DM. Morphological analysis determined fusion index (H)
  and deformed myotube index (I). Arrowheads indicate deformed myotubes. Scale bar:
  100 μm; n = 3–7. Data represent the mean ± SEM. P values were determined using 2-way
  or 1-way ANOVA followed by Tukey’s multiple-comparison post hoc test'
