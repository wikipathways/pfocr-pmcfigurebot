figure_title: A schematic diagram illustrating both the classical and emerging perspectives
  on aqueous humor circulation is presented.
caption: 'A schematic diagram illustrating both the classical and emerging perspectives
  on aqueous humor circulation is presented. Traditionally, aqueous humor exits the
  posterior chamber, passes through the pupil into the anterior chamber, and then
  drains into Schlemm’s canal via the trabecular meshwork. Additionally, it may flow
  through intercellular spaces at the iris root, ciliary muscle fibers, and other
  uveal structures—collectively referred to as the uveoscleral route (indicated by
  red arrows). The newly proposed perspective involves the postiridial flow and the
  retinal glymphatic pathway (shown by blue arrows). In this model, the inflow of
  aqueous humor through the retinal glymphatic pathway is mediated by aquaporin-4
  channels expressed in Müller cells within the retina.Co, cornea; L, lens; R, retina;
  S, sclera; U, uvea; V, vitreous body. This figure is adapted from Ueki, S.; Suzuki,
  Y. “New Perspective on Aqueous Humor Circulation: Retina Takes the Lead.” Int. J.
  Mol. Sci. 2025, 26, 2645. https://doi.org/10.3390/ijms26062645 under the terms and
  conditions of the Creative Commons Attribution (CC BY) license'
