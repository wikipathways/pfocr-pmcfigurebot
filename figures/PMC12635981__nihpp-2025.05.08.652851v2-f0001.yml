figure_title: Characterization of human FOXG1+ neural progenitor cells and niche-dependent
  IGF1 signaling in rosette-derived neural aggregates
caption: (A-B) Schematic illustrating derivation of FOXG1+ neural progenitor cells
  (NPCs) from human pluripotent stem cells using a 2D culture system. Immunostaining
  confirms co-expression of FOXG1 (red) and Nestin (green), with DAPI (blue) marking
  nuclei.(C) Gene Ontology (GO) enrichment analysis of FOXG1+ NPCs highlights processes
  including forebrain development, neuronal differentiation, and cell fate commitment.
  Dot size reflects the number of associated genes; color indicates false discovery
  rate (FDR).(D) STRING network analysis identifies enriched clusters involved in
  immune signaling, cell cycle regulation, and metabolic networks.(E) Pathway enrichment
  analysis shows strong activation of Insulin/IGF, mTOR, Notch, Neurotrophin, and
  MAPK signaling pathways.(F) Expression analysis reveals high levels of IGF1R and
  IGF2R, absent IGF1 ligand, and selective expression of Relaxin receptors, suggesting
  reliance on paracrine IGF1 signaling.(G) Expression of IGFBP2, IGFBPL1, IRS1–3,
  and regulators of IGF bioavailability and insulin signaling is detected, favoring
  IGF axis competence.(H) Schematic of rosette-derived neural aggregate (RONA) culture
  system showing 3D tissue organization supported by Matrigel and nutrient exchange.(I-L)
  Immunostaining of RONAs reveals central IGF1 expression (green), peripheral CK8+
  epithelial cells (red), and FOXG1+ NPCs co-expressing IGF1R at the plasma membrane.(M)
  Quantitative co-localization analysis shows substantial overlap between FOXG1 and
  IGF1R (Manders’ coefficients ~0.6).(N) Working model proposing that IGF1+ niche
  cells secrete IGF1 to regulate neighboring FOXG1+ progenitors in RONAs
article_title: Spatially Organized IGF1–mTOR Signaling Controls Human Forebrain Progenitor
  F ate Through Coordinated Transcriptional and Translational Programs
