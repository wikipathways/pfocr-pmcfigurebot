figure_title: RUNX1 mediates EV secretion in differentiating HESCs by regulating HIF2α/RAB27B
  gene expression.
caption: 'RUNX1 mediates EV secretion in differentiating HESCs by regulating HIF2α/RAB27B
  gene expression. HESCs were treated with 20 nM control or RUNX1-specific siRNA for
  24 hours, then grown in culture under hypoxic conditions with decidualization cocktail
  for 72 hours. RNA was extracted and gene expression analysis was performed using
  primers specific for RUNX1 (A) and members of an EV secretion pathway in differentiating
  HESCs, transcription factor HIF2α (B) and vesicular trafficking protein RAB27B (C).
  EVs were also isolated from conditioned media of RUNX1-specific or control siRNA
  using the miRCURY (Qiagen) kit and analyzed by microfluidic resistive pulse sensing
  (Spectradyne, LLC). Concentration of EVs ranging from 60 to 400 nm was quantified
  (D) Data shown as mean fold change ± SEM (n = 3–6 independent experiments). *P <
  .05, **P < .01 relative to control siRNA treatment.Abbreviations: EV, extracellular
  vesicle; HESC, human endometrial stromal cell; RUNX1, runt-related transcription
  factor 1; siRNA, small interfering RNA'
