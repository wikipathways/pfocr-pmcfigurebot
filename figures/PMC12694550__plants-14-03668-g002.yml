figure_title: ABA signaling pathways and transcription factors that play crucial roles
  in mediating salt tolerance in soybean.
caption: 'ABA signaling pathways and transcription factors that play crucial roles
  in mediating salt tolerance in soybean. The red dots in the left diagram represent
  Ca2+, while the green spheres denote ABA. The red portion depicts the ABA-independent
  pathway, where Ca2+ serves as the primary signaling molecule. GmCaMs receive Ca2+
  signals and transmit them to GmCIPK1, which activates GmDREB through a cascade reaction.
  The activated GmDREB protein translocates to the nucleus, specifically binding to
  DRE cis-acting elements within the promoter regions of downstream target genes.
  This subsequently activates transcription of osmotic regulation genes (e.g., SOD
  and LEA proteins) and antioxidant genes. The green section depicts the ABA-dependent
  pathway: In this pathway, ABA is perceived by plasma membrane receptors, initiating
  intracellular signal transduction that leads to the activation of SnRK2 kinases.
  Alternatively, ABA binding to PYL receptors inhibits PP2C activity, which subsequently
  also results in SnRK2 kinase activation. The signal is then transduced to the nucleus,
  where the transcription factor GmbZIP132 and members of the NAC family (GmNAC1-6)
  bind to ABRE elements, thereby regulating the expression of LEA proteins. The blue
  route below the green section illustrates how PYL8 directly interacts with transcription
  factors such as MYB77, MYB44, and MYB73 to potentiate the auxin signaling pathway,
  consequently promoting the recovery of lateral root growth; however, this aspect
  remains subject to debate in soybean research. The right panel depicts the regulatory
  pathways of multiple transcription factors under salt stress'
