figure_title: Transcriptome of rosemary cream-treated mouse ear wounds displays a
  TRPA1 pathway activation profile
caption: (A) Representative photographs of vehicle control cream- or rosemary cream-treated
  WT ears at day 7 after injury. Dotted circle represents original 2 mm hole-punch
  size. Black scale bar represents 2 mm. (B) Percentage of wound closure at day 7
  in vehicle control cream- (C; n = 4) or rosemary cream-treated (R; n = 4) WT mouse
  ears. Student’s t test 2-tailed and unpaired. *P < 0.05. Data are presented as mean
  ± SEM. (C) Principal component analysis of vehicle control cream- (black dots) or
  rosemary cream- (green dots) treated WT ears. (D) Volcano plot of all differentially
  expressed genes in WT mouse ears treated with vehicle control cream or rosemary
  cream. (E) Gene ontology analysis of biological processes significantly upregulated
  in rosemary cream-treated WT mouse ears. (F) Enrichr pathway analysis of WT mouse
  ears treated with rosemary cream. Combined score is computed by taking the log of
  the P value from the Fisher exact test and multiplying that by the z score of the
  deviation from the expected rank
