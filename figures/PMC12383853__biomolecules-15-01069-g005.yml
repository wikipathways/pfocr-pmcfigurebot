figure_title: YY1 orchestrates TME remodeling to drive drug resistance.
caption: YY1 orchestrates TME remodeling to drive drug resistance. YY1 regulates glycolysis
  via HIF-1a and G6PD and creates an acidic hypoxic niche. It also upregulates CD47
  to block macrophage phagocytosis and induces T cell exhaustion by repressing IL-2,
  GALC, TGF-b, IL-10, and FOXP3. Additionally, YY1 mediates TKI resistance through
  the IL-32/b-5-integrin/AKT pathway and activates the IL-18/NF-κB axis to downregulate
  MRP2, forming an inflammatory feedback loop. This metabolic–immune crosstalk enables
  tumor cells to escape immune surveillance and resist therapy-induced cell death,
  thereby developing drug resistance. Arrows are used to show activation; arrows terminated
  with a bar represent inhibition
