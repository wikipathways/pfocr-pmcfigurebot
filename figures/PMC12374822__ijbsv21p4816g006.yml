figure_title: JCAD activates EMT, activates the Wnt/β-catenin pathway and induces
  high expression of FZD1.
caption: 'JCAD activates EMT, activates the Wnt/β-catenin pathway and induces high
  expression of FZD1. A-B: Analysis of the RNA-seq results revealed a positive correlation
  between JCAD and both EMT and the Wnt/β-catenin pathway. C: Western blot analysis
  of the levels of key proteins involved in EMT and the Wnt/β-catenin pathway in JCAD-OE
  and JCAD-KD cells. D: Transwell migration experiments verified that the XAV939 β-catenin
  inhibitor reduced the migration ability of JCAD-OE MDA-MB-231, BT549, and LM2 cells
  (10×). E: Wayne plot of genes with FC values greater than 2 in the sequencing results
  of the MDA-MB-231 and BT549 cell lines. F: Scatter plot of the sequencing results
  for the MDA-MB-231 and BT549 cell lines. G: Western blot analysis of FZD1 protein
  levels in JCAD-OE and JCAD-KD cells. H: Immunohistochemical staining of key molecules
  levels of EMT and Wnt/β-Catenin pathway of subcutaneous tumors in pCDH and JCAD-OE
  groups (LM2) mice (scale=100μm in the figure). I: Western blot analysis of FZD1
  protein levels in stable FZD1-OE MDA-MB-231, BT549 and LM2 cells and control cells.
  J: Western blot analysis of the protein levels of key molecules involved in EMT
  and the Wnt/β-catenin pathway in FZD1-OE cells and control cells'
