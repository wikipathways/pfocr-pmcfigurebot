caption: 'From genome-wide association analysis to functional verification: research
  framework and GWAS visualization of the LCORL–NCAPG pathway in donkey growth traits.
  Growth-related phenotypes were measured following China National Standard GB/T 29392-2022
  and common livestock measurement protocols [125]. The content is derived from published
  studies [2,24,26,31,38,124,126] based on GWAS results from multiple donkey populations.
  The figure was visualized using R (version 4.4.1). Horizontal dashed lines indicate
  genome-wide significance thresholds (p < 5 × 10−8); vertical lines highlight the
  LCORL–NCAPG region, supported by meta-analysis of three independent replicates'
