figure_title: Mechanistic overview of colon-dependent catechol-O-methyltransferase
  (COMT) and its role in visceral pain.
caption: Mechanistic overview of colon-dependent catechol-O-methyltransferase (COMT)
  and its role in visceral pain. Both central and peripheral pathways are involved
  in visceral pain following GI tract infection. Gut barrier dysfunction, immune activation,
  and neural hypersensitivity all contribute to the pathogenesis of visceral pain.
  In epithelial, neuronal, and macrophage cells, colon-dependent COMT expression is
  reduced, resulting in dysregulated inflammatory responses. Upregulation of nuclear
  factor kappa-light-chain-enhancer of activated B cells (NF-κB) and miR-155, coupled
  with the suppression of Src homology 2 domain-containing inositol phosphatase 1
  (SHIP-1), leads to increased TNF-α production, amplifying nociceptive signaling.
  Pro-inflammatory cytokines such as TNF-α activate NF-κB pathways within DRG and
  spinal dorsal horn neurons, further sensitizing pain pathways and transmitting signals
  to the brain stem, limbic system, and somatosensory cortex
