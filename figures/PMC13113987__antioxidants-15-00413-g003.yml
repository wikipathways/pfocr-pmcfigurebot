figure_title: ALA affects PD-L1 expression through JAK1/STAT1/IRF-1 signaling pathway.
caption: 'ALA affects PD-L1 expression through JAK1/STAT1/IRF-1 signaling pathway.
  (A) PC3 cells were pretreated with or without ALA (2 mM) for 1 h, and further incubation
  for 6 h in the presence or absence of IFN-γ. The immunohistochemical assay was used
  to detect p-STAT1, IRF-1, and c-Myc distribution in cells (scale bar: 50 μm). (B)
  The PC3 and DU145 cells were pretreated with or without Ruxo (0.5 μM), Fluda (1
  μM), or IRF-1-IN-2 (20 μM) for 1 h and then cultured with or without IFN-γ for 6
  h. The expression of PD-L1 and related target gene was determined. (C) The PC3 and
  DU145 cells were pretreated with or without ALA (2 mM) for 1 h and incubated for
  1 or 6 h in the presence or absence of IFN-γ. The expression of HIF-1α was determined
  using Western blot. Results are expressed as mean ± S.E.M. * p < 0.05, ** p < 0.01,
  *** p < 0.001 vs. IFN-γ-treated alone cells'
