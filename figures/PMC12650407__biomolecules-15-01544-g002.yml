figure_title: Potential effect of variable blood glucose levels on cellular apoptosis,
  nitric oxide (NO) production and the prostacyclin pathway in endothelial cells.
caption: Potential effect of variable blood glucose levels on cellular apoptosis,
  nitric oxide (NO) production and the prostacyclin pathway in endothelial cells.
  Glucose entering the cell has the potential to affect several pathways. Excess methylglyoxal
  (MG) produced as a side product of glycolysis can increase reactive oxygen species
  (ROS) levels, leading to apoptosis. Uridine diphosphate N-acetylglucoasmine (UDP-GlcNAc),
  synthesised as part of the hexosamine pathway, is a substrate of O-GlcNAc transferase
  (OGT) that catalyses the transfer of O-linked b-N-acetylglucosamine (O-GlcNAc) to
  Ser and/or Thr residues on target proteins. A key O-GlcNAcylation target is endothelial
  NO synthase (eNOS), causing eNOS uncoupling and loss of tetrahydrobiopterin (BH4),
  which reduces NO production. O-GlcNAc can be removed from eNOS by the enzyme O-GlcNAcase
  (OGA). Arachidonic acid, released from cell membrane phospholipids by phospholipase
  A2 (PLA2), is converted to prostaglandin H2 (PGH2) by cyclooxygenases 1 and 2 (COX-1
  and 2). PGH2 is further converted to thromboxane A2, which stimulates platelet activation,
  by thromboxane synthase (TXS) and prostaglandin I2 (PGI2), which inhibits platelet
  activation and triggers smooth muscle cell (SMC) relaxation by prostaglandin synthase
  (PGIS) [65]
