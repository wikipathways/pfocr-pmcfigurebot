caption: Cell communication analysis reveals signal crosstalk among various cell types
  in the ovaries of Holstein cows under different physiological states. (A) Circle
  plot representing cell communication among cell types. Circle sizes represent the
  number of cells, whereas edge widths represent the communication probability. (B)
  Interactions of the VEGF and ANGPT pathways among the main cell populations in the
  ovaries of Holstein cows under different physiological states. (C) Hierarchical
  plot showing the intercellular communication network for VEGF and ANGPT signaling
  pathways. Circle sizes represent the number of cells, whereas edge widths represent
  the communication probability. (D) Putative incoming and outgoing communication
  patterns of secretory cells in the bovine ovary under the pregnant physiological
  state. (E) Putative incoming and outgoing communication patterns of secretory cells
  in the bovine ovary under the non-pregnant physiological state
