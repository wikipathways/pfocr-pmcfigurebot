figure_title: Schematic representation of the main cellular mechanisms induced by
  Tentoxin.
caption: Schematic representation of the main cellular mechanisms induced by Tentoxin.
  TEN downregulates ATP-binding cassette (ABC) transporters, impairing efflux of bile
  acids, bilirubin, and xenobiotics, which compromises hepatocellular detoxification
  and predisposes cells to cholestasis, accumulation of toxic bile constituents, and
  apoptosis. TEN also modulates genes associated with inflammatory and necrotic pathways,
  contributing to hepatocyte injury despite limited genotoxic effects. Dashed arrows
  indicate feedback or secondary amplifying interactions between pathways
