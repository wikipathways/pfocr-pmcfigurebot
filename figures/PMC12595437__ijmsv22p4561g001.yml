figure_title: Signaling pathways of ER stress.
caption: Signaling pathways of ER stress. The three key ER stress sensors, IRE1, PERK,
  and ATF6, are activated upon the accumulation of misfolded proteins in the ER lumen.
  Upon activation, IRE1 splices XBP1 mRNA, resulting in the formation of the XBP1s
  transcription factor, which upregulates genes involved in protein folding and ERAD.
  Additionally, IRE1 activates the JNK signaling pathway through the recruitment of
  TRAF2 and ASK1, contributing to apoptosis. PERK phosphorylates eIF2α, leading to
  a reduction in global protein synthesis while selectively enhancing the translation
  of ATF4, a transcription factor that activates genes such as CHOP and GADD34 involved
  in protein synthesis regulation and stress response. ATF6 is processed in the Golgi
  apparatus and, once cleaved, translocates to the nucleus as ATF6f, where it activates
  UPR-related genes. Together, these pathways coordinate an adaptive response aimed
  at restoring ER homeostasis
