figure_title: Chronic stress robustly shifts neuronal, astrocyte, and microglia transcriptome
  profile in males
caption: '(A) Experimental paradigm: Thy1+ neurons, HepaCam+ astrocytes, and CD45+
  microglia were isolated by immunopanning within 1 hour after the final stressor
  exposure on the last day of the paradigm. Genes involved in the regulation of stress
  signaling are highlighted in bold. (B) Heatmaps of gene expression of neurons (top),
  astrocytes (middle), and microglia (bottom) in control no stim (orange/light pink)
  or following stress alone (dark red/orange), stress combined with AV flicker at
  10Hz (dark red/blue), or 40Hz (dark red/green). Colors above the heatmap indicate
  stress (dark red) or no stress (pink) and no stimulation (orange), 10Hz (blue),
  or 40Hz (green) flicker exposure. In the heatmap, red shows increased expression
  and blue shows decreased expression compared to no stress no stimulation controls
  (threshold set. log2fc>1 and p<0.05). (C) Primary pathways affected by stress alone
  in neurons, astrocytes, and microglia. N = 3 pooled samples from 6 animals per group.
  Transcriptional profile at gene expression level unadjusted p<0.05, Wald test. GO
  terms pathway analysis *p < 0.05, **p<0.01, ***p<0.001, and ****p<0.0001. A Created
  in BioRender. Franklin, T. (2025) https://BioRender.com/r17l695. See Supplemental
  Table 11 for statistical details'
