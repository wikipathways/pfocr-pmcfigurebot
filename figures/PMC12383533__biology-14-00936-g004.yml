figure_title: 'Activating insulin-induced receptors initiates two major signaling
  pathways: Ras/MAPK and PI3K/AKT.'
caption: 'Activating insulin-induced receptors initiates two major signaling pathways:
  Ras/MAPK and PI3K/AKT. After insulin binds to its receptor on the cell surface,
  it triggers sequential structural conformational changes and autophosphorylation
  on several tyrosine residues localized in the cytoplasmic domains, eliciting its
  activation. These events recruit and phosphorylate the insulin receptor substrate
  (IRS), Src homology, and collagen (SHC) signaling proteins. The IRC-SHC’s complex
  activation primarily initiates the GRB2-SOS-Ras-MEK-ERK cascade, Ras/MAPK pathway
  (blue boxes), which elicits cellular proliferation, antiapoptosis, survival, and
  differentiation. Additionally, the IRS/GRB2/SOS activated complex induces PI3K-AKT-GSK3,
  PI3K–AKT-FOXO, PI3K-AKT-mTOR1-SREBP, PI3K-AKT-mTOR1-P70S6K, and PI3K-AKT-PDE-3B
  activation, all of which are components of the PI3K-AKT pathway (dark yellow boxes).
  The multiple cellular consequences of activating the PI3K/AKT pathway are included
  at the bottom of each pathway branch (yellow boxes). Moreover, protein kinase C
  (PKC) activation by PI3K can promote glucose uptake by inducing the translocation
  of glucose transporters to the plasma membrane. Several interconnections exist between
  these two pathways, such as JNK activation (highlighted in the red box). The orange
  “P” denotes phosphorylation (phosphate group addition). Note: ↑ and ↓ indicate increases
  (induction) and decreases (repression), respectively'
