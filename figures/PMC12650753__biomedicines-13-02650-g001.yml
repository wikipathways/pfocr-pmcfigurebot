figure_title: Intracellular signaling pathways mediated by CCR5.
caption: 'Intracellular signaling pathways mediated by CCR5. Binding of CCR5 ligands
  (principally CCL3, CCL4, and CCL5) to the CCR5 receptor activates several heterotrimeric
  G proteins, whose distinct subunits subsequently initiate specific signaling cascades:
  (1) Gαq stimulates PLC-β, leading to the activation of CaMK and PKC; (2) Gαi inhibits
  adenylate cyclase, thereby reducing intracellular cAMP levels; (3) the Gβγ subunit
  activates PI3K-γ/β, which subsequently triggers PKB and the mTOR pathway. Abbreviations:
  CCR5 (C-C chemokine receptor type 5), CCL3 (chemokine -C-C motif- ligand 3), CCL4
  (chemokine -C-C motif- ligand 4), CCL5 (chemokine -C-C motif- ligand 5), Gαq (G
  protein alpha q subunit), Gαi (G protein alpha i subunit), PLC-β (phospholipase
  C beta), CaMK (Ca2+/calmodulin-dependent protein kinase), PKC (protein kinase C),
  cAMP (cyclic adenosine monophosphate), PI3K-γ (phosphatidylinositol 3-kinase gamma),
  PI3K-β (phosphatidylinositol 3-kinase beta), PKB (protein kinase B), and mTOR (mammalian
  target of rapamycin)'
