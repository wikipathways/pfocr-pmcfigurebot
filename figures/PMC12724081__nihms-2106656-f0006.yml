figure_title: Proposed model of how loss of IL-6R on Tregs disrupts epithelial cell
  programs
caption: In homeostatic conditions, IL-6R shedding from Tregs enables IL-6 trans-signaling
  through gp130 on epithelial cells, leading to STAT3 phosphorylation and activation
  of pro-repair gene programs. In IL-6R–deficient Tregs, trans-signaling is disrupted,
  resulting in downregulation of JAK/STAT3, MAPK and WNT signaling pathways, which
  impairs normal epithelial response to injury (such as inflammation) (Created in
  BioRender. Druliner, B. (2025) https://BioRender.com/aa8ypa7)
