caption: The second wave of increase in PKAc was repressed by inhibitors of TGF-β
  (B) or Smad3 (C-D). A, Partial circuit diagram showing pathways targeted with inhibitors.
  B1, Representative confocal images of PKAc in SNs 5 h after Standard protocol of
  5-HT, in the absence or presence of TGF-β inhibitor TGF-β RII Fc (TGF Fc). B2, Summary
  data. TGF Fc significantly decreased PKAc induced by 5-HT. C1, Representative confocal
  images of PKAc in SNs 5 h after 5-HT, in the absence or presence of Smad3 inhibitor
  SIS3. C2, Summary data. D1, Representative confocal images of PKAc in SNs 18 h after
  5-HT, in the absence or presence of Smad3 inhibitor SIS3. D2, Summary data. SIS3
  significantly decreased PKAc induced by 5-HT. * p < 0.05
