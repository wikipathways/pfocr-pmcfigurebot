caption: 'Gene expression related to the androgen pathway is analyzed following treatment
  with perilla seed extracts: (A) SRD5A1, (B) SRD5A2, and (C) SRD5A3 in DU-145 cells,
  and (D) SRD5A1, (E) SRD5A2, and (F) SRD5A3 in HFDPCs. These effects are compared
  to those of conventional therapeutic treatments (dutasteride, finasteride, and minoxidil)
  at 0.125 mg/mL. Data are reported as mean ± SD for each sample. Statistical comparisons
  are applied through a one-way ANOVA followed by Tukey’s post hoc test. Distinct
  lowercase letters (a–g) represent statistically significant differences among groups
  in each assay (p < 0.05). Abbreviations: MAC-PS, macerated perilla seed extract;
  SFE-PS, supercritical fluid-extracted perilla seed extract; SC-PS, screw-pressed
  perilla seed extract'
