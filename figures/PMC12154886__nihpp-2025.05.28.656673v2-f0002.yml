figure_title: Loss of OGDHL in CRPC cells alters transcription of cell stress and
  cell cycle associated pathways in vitro and in vivo
caption: |-
  (A) RNA expression of Canonical TCA cycle genes in OGDHL knockdown Enza-maintained 16DCRPC cells in vitro normalized to control knockdown values. Data represented as 3 technical replicates each from 2 shRNAs. (B) Volcano Plot of Differentially Expressed Genes in shOGDHL Enza-maintained 16DCRPC cells relative to control. Color indicates FDR < 0.05 (C) Heatmap of isolated proliferation and cell stress genes in control and OGDHL knockdown cells, with technical replicates shown. (D-F) Average expression of genes in Hallmark: G2M Checkpoint, E2F Targets, and Myc Targets v1 with Enza-Maintained 16DCRPC cells with acute knockdown of OGDHL in vitro
  (D), in OGDHL CRISPR knockout cell lines in vitro
  (E), and in tumors formed from OGDHL knockout cells (F). Data shown is average Z scores from 3 control replicates and 6 knockdown/knockout replicates in vitro or 5 control and 4 knockout replicates in vivo. Error bars represent +/− SEM. Adjusted P values were calculated by applying the Benjamini-Hochberg procedure for multiple hypothesis testing to p-values corresponding to 2-tailed t-tests
