figure_title: Fluoride exposure inhibits the secretion of antibacterial substances
  and intestinal mucus emptying.
caption: Fluoride exposure inhibits the secretion of antibacterial substances and
  intestinal mucus emptying. (A) Volcano plot showing differentially expressed genes
  between normal and fluoride-exposed Paneth cells. The names of the most significant
  genes are shown in the plots. (B) Violin plot indicating the expression of α-DEFENSIN
  machinery-related genes in ileal Paneth cells from control and fluoride-exposed
  mice. Significance was determined using the Wilcoxon test. (C) α-DEFENSIN content
  in the ileum, detected by ELISA. (D) Analysis of bacteria-mucus-epithelial localization
  in the ileum. Phalloidine stains the intestinal cytoskeleton, the 16S rRNA fluorescent
  probe labels bacteria, and MUC2 labels mucus. White arrows mark bacteria invading
  the intestinal epithelium. Violin plots indicate the expression of mucus machinery-related
  genes (E), mucin genes (F), and mucus release-related genes (G) in ileal goblet
  cells from control and fluoride-exposed mice. Significance was determined using
  the Wilcoxon test. (H) Immunofluorescence staining of RAMP1 and MUC2 in the mouse
  ileum (n = 3 biological replicates). (I) Heatmap representing the expression of
  selected genes in goblet cells from the Ctrl and F groups. (J) Violin plots indicate
  the enriched inhibitory pathways in goblet cells from the F group as determined
  by reactome analysis. (K) Representative immunofluorescence-staining images of LYZ1
  in ileal tissues from control and fluoride-exposed mice (n = 3 biological replicates).
  White arrows mark the positive expression of LYZ1. *, p < 0.05; **, p < 0.01; ***,
  p < 0.001; ****, p < 0.0001 were considered significant, and ns denotes non-significant
  differences
