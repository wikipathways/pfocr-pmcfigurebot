figure_title: Discovery of candidate genes for Idiopathic Pulmonary Fibrosis (IPF).
caption: 'Discovery of candidate genes for Idiopathic Pulmonary Fibrosis (IPF). (A)
  Venn diagram of IPF-associated targets from Genecards, Malacards, Comparative Toxicogenomics
  Database (CTD), Online Mendelian Inheritance in Man (OMIM), Therapeutic Target Database
  (TTD), and Genome-Wide Association Study (GWAS) databases. (B) Volcano plot of differentially
  expressed genes (DEGs) in IPF (threshold: |log2(fold change)| > 1). The horizontal
  dashed line indicates the threshold for statistical significance (p = 0.05). The
  two vertical dashed lines represent the thresholds for a 2-fold change (log2 FoldChange
  = ±1). (C) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis
  of up/downregulated DEGs. (D) Intersection of IPF targets from gene cards, mala
  cards, CTD, OMIM, TTD, and GWAS and the Gene Expression Omnibus (GEO) public gene
  expression dataset (GEO accession: GSE24206, GSE150910, GSE213001, and GSE124685)'
