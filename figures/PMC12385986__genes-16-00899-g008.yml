  W7 in response to low-temperature stress.
caption: Differentially expressed gene (DEG) expression patterns and related Kyoto
  Encyclopedia of Genes and Genomes (KEGG) pathway analysis in both X33 and W7 in
  response to low-temperature stress. Change trends of the DEGs across three time
  points in the two sweet potato genotypes (A). Among the change trends, DEGs continuously
  increased, remained unchanged first and then increased, increased and then decreased,
  continuously decreased, and remained unchanged first and then decreased. In each
  frame, gray lines represent the gene expression pattern, while blue lines represent
  the expression tendency of all genes. The number of genes belonging to each pattern
  is given above the frame. The related KEGG pathways were analyzed, including the
  continuously increasing trends in X33 (B) and W7 (D) and the tendency to remain
  unchanged first and then increase in X33 (C) and W7 (E)
