figure_title: CS treatment clears senescent-like HSCs.
caption: CS treatment clears senescent-like HSCs. (A) UMAP-based visualization of
  cell density distributions for CS-treated (left) and untreated (right) aged HSCs,
  shown as Galaxy plots. (B) UMAP plot highlighting a srHSC cluster with high Hspb1
  expression in aged mice. (C) UMAP visualization of MPPs from young, aged, and CS-treated
  aged mice, colored by group (bottom), srHSC across groups (top), and Hspb1 expression
  (middle). (D) HSPB1 gene expression of HSCs between elderly and young people by
  Wilcoxon test, ****P < 0.0001. (E) Differential gene expression analysis showing
  up- and down-regulated genes across eight healthy aged mice versus young mice HSCs.
  All adjusted p value < 0.01 dots were shown. up-regulated genes are indicated in
  red, while down-regulated genes are indicated in blue. Genes with an adjusted p
  value < 0.01 and log2 fold change > 0.263 were considered DEGs. Among these DEGs,
  Hspb1 is highlighted, with a total of five instances. (F) Cell clusters between
  aged-CS and aged group were visualized using UMAP (top). UMAP plots showing Hspb1
  gene expression in LTHSCs (bottom left). Identification of 6 subclusters of LTHSCs
  across all samples (bottom right). (G) The proportions of 6 subclusters in HSCs
  from aged-CS and aged groups. (H) UMAP plot of gene signatures for inflammation,
  DNA repair, and cellular stress pathways in HSCs, generated by UCell. (I) Heat map
  showing the scaled expression of top 5 marker genes in each cell cluster. (J) Dot
  plot showing Gene Ontology (GO) enrichment of highly expressed genes in C3 subcluster
