figure_title: MLEC mediates replication through the glycoprotein quality control pathway
caption: A. Schematic of glycoprotein biogenesis and quality control pathway. NGI-1
  is an OST inhibitor that blocks N-linked glycosylation(Lopez-Sambrooks et al., 2016).B.
  Representative Western blot of DBT lysates after OST inhibition and MLEC KD during
  MHV-FFL2 infection (MOI 1, 10 hpi). Blotting for glycosylated and non-glycosylated
  ERDJ3 served as a marker of N-linked glycosylation inhibition. Lysates were matched
  with the corresponding luminescence reading. See Figure S14.C. Levels of MHV-FFL2
  replicase reporter with NGI-1 or DMSO treatment at the time of infection in cells
  with Scramble, CEACAM1, or MLEC KD in the same lysates analyzed in (B). One replicate
  of siCeacam1 fell below the limit of detection (dotted line). Mock-infected cells
  were used as a control for background luminescence. Student’s T-test for significance,
  with p<0.05 considered significant, n = 6. See Figure S14.D. Abundance of N-linked
  glycosylated Spike peptides in siMlec versus Scramble-treated DBT cells. Cells were
  treated with siRNA and infected with mock or MHV (MOI 1, 10 hpi). Lysates were trypsinized,
  TMTpro labeled, pooled, then treated with PNGase F to cleave oligosaccharides, resulting
  in a deamidation mass shift (N to D) detectable by LC-MS/MS. Peptide sequence is
  listed, with “N*” denotating a deamidation modified Asn in a canonical glycosylation
  sequon (N-X-S/T, where X is not Proline). Peptides where the modified Asn could
  not be resolved lack the “N*” annotation. Peptide position within the protein is
  in brackets. One-way ANOVA, adjusted p-value. * p<0.05, ** p<0.01, ***p<0.005, ****p<0.0001,
  n = 4/condition, 1 MS run. See Figure S15, Table S6
