figure_title: Effects of CHA on polyunsaturated fatty acid (PUFA) metabolism in the
  skin of a photoaged mouse model.
caption: Effects of CHA on polyunsaturated fatty acid (PUFA) metabolism in the skin
  of a photoaged mouse model. (A) Total n-3 PUFAs levels in the mouse skin. (B) Total
  n-6 PUFAs levels in mouse skin. (C) Ratio of n-6/n-3 PUFAs in the mouse skin. For
  A-C, data are presented as mean ± SD (n = 6). (D) A schematic diagram of n-3/n-6
  PUFA metabolic pathways annotated with multi-omics data. α-Linolenic acid, linoleic
  acid, γ-linolenic acid, and dihomo-γ-linolenic acid were significantly elevated
  following CHA treatment compared to the MC group, while the PGE2 level was decreased.
  There was no significant effect of CHA on levels of EPA and arachidonic acid compared
  to the MC group. The detailed identification of PGE2 can be seen in Table S3. (E)
  Western blot analysis of COX-2 protein expression in the mouse skin from NC, MC,
  and CHA groups. The results are normalized to GAPDH and shown as mean ± SD (n =
  3). * p < 0.05, ** p < 0.01, **** p < 0.0001
