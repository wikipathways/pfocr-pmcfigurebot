figure_title: Bacterial stimulation re-induce inflammation in IEOs
caption: (A) Differential gene expression analysis comparing 6H stimulated vs. baseline
  conditions in IBD and control organoids. The volcano plot highlights genes with
  significant up- or downregulation (adjusted p-value <0.01) (red), emphasizing the
  upregulation of key pro-inflammatory markers, including CXCL8, NFKB2, IL-23A, BIRC3,
  TNFAIP1, and DUSP16. (B) Pathway enrichment analysis of differentially expressed
  genes (DEGs) following 6H organoid stimulation in both IBD and control groups. The
  dot plot shows significantly activated inflammatory pathways, including IL-17, NF-κB,
  TNF, and cytokine-cytokine receptor interactions, with dot size representing gene
  count and color indicating statistical significance. (C) Principal Component Analysis
  (PCA) of organoid samples based on transcriptomic profiles. Stimulated (6H, 72H)
  and non-stimulated (0H) samples cluster separately, while IBD and control organoids
  remain largely indistinguishable at both baseline and post-stimulation. (D) Differential
  gene expression analysis comparing IBD vs. control organoids. The volcano plot highlights
  significantly DEGs (adjusted p-values <0.01) in IBD-derived organoids across all
  time points (0H, 6H, 72H), suggesting distinct transcriptional responses to bacterial
  stimulation
