figure_title: The JAK/STAT signaling pathway.
caption: 'The JAK/STAT signaling pathway. (a) Ligand-receptor pairs and the JAK/STAT
  isoforms classically associated with each. Following receptor activation, autophosphorylation
  of JAKs ( JAK1, JAK2, JAK3, or TYK2), and subsequent phosphorylation of STATs (STAT1–6),
  STATs regulate gene transcription in several ways. STAT-STAT dimers as well as unphosphorylated
  STAT3 recognize GAS, the ISGF3 complex (STAT1, STAT2, and IRF9) recognizes ISREs,
  and unphosphorylated STAT1 interacts with ICS-2 to prolong expression of interferon-stimulated
  genes. (b) Heat maps showing the levels of JAK and STAT isoforms across brain regions
  as well as across cell populations in the central nervous system. Abbreviations:
  EPO, erythropoietin; G-CSF, granulocyte colony stimulating factor; GM-CSF, granulocyte-macrophage
  colony-stimulating factor; GAS, gamma-activated sequences; ICS-2, interferon consensus
  sequence 2; ISGF3, IFN-stimulated gene factor 3; IRF9, interferon regulatory factor
  9; ISRE, interferon-stimulated response element; JAK, Janus kinase; LIF, leukemia
  inhibitory factor; nTPM, normalized transcripts per million; OSM, oncostatin M;
  STAT, signal transducer and activator of transcription; TPO, thrombopoietin; Treg,
  regulatory T cell; TYK2, tyrosine kinase 2; uSTAT, unphosphorylated STAT. Panel
  a created in BioRender; Hoffman O. 2025. https://BioRender.com/n84z537'
