figure_title: NOTCH pathway gene and protein expression changes by the treatment with
  taxanes in sensitive and resistant SKOV-3 sublines in vitro.
caption: NOTCH pathway gene and protein expression changes by the treatment with taxanes
  in sensitive and resistant SKOV-3 sublines in vitro. NOTCH pathway gene expression
  in (A) SKOV-3/SEN and (B) SKOV-3/RES sublines untreated (CTRL) or treated with paclitaxel
  (PTX, 4500 nM) and Stony Brook taxanes (SB-Ts, 30 nM). Data are shown as fold change
  values (compared to controls). (C) NOTCH3 and (D) NOTCH4 protein expression in SKOV-3/RES
  subline untreated and treated with PTX and SB-Ts. Protein expression data are shown
  as expression change of normalized protein expression compared to the mean of normalized
  control expression level. All measurements are in triplicates. *p < 0.05, **p <
  0.01
