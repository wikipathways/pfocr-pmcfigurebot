figure_title: Single-cell perturbation analysis of counteracting PB and GCBC TFs
caption: (A) Experimental strategy to profile TF CRISPR perturbations by scRNA-seq
  (top left). Naïve B cells (Donor 1) were activated for 2 days before nucleofecting
  with RNP complexes, re-culturing and harvesting cells at D4 and D6 for sample hashtagging
  and pooling for scRNA-seq. UMAP projections of aggregated cells (D4, D6) with their
  Leiden cluster labels and normalized expression of PB-marker gene CD27 and GC-marker
  gene FCER2 (CD23) (top right). UMAP projections displaying cells with the indicated
  gRNAs harvested at the indicated timepoints (D4, D6). (B) Computational strategy
  for identifying TF regulated target genes by connecting DEGs with ChromBPNet TF
  motif seqlets via gene-specific RP models. (C) Volcano plots displaying mean log2
  fold change (FC) and RP scores (summed RP values of all ATAC-seq peaks containing
  ChromBPNet seqlets that correspond to binding sites of perturbed TF) for each DEG
  which is concordantly differentially expressed (|FC| > 1.25 and FDR < 0.05) between
  experimental replicates in the context of indicated TF KO. Dotted gray lines mark
  |FC| of 1.25. (D) Intersection of IRF4 KO DEGs with other TF KO DEGs (numbers indicate
  concordant co-regulated DEGs). (E) Heatmap displaying gene ontology pathway analysis
  of IRF4 co-regulated DEG modules (FDR, false discovery rate). (F) Plots displaying
  IRF4 co-regulated genes with its partners BATF, SPIB and PRDM1. Only concordantly
  regulated DEGs which are linked to at least one shared composite element motif seqlet
  (AICE, EICE, ISRE) are included. Sizes of the circles indicate the RP score for
  the respective composite element seqlets that are associated with the indicated
  target gene. Dotted gray lines mark |FC| of 1.25
