figure_title: The analysis of ileal intestinal flora biomarkers.
caption: The analysis of ileal intestinal flora biomarkers. (A). The LEfSe differential
  analysis of bacterial flora in the rat ileum. (B). Circos diagram (genus level).
  (C). The distribution of LDA effector values of flora marker species in rat ileum.
  (D). Correlation analysis of top 10 abundance genera with oxidative stress, TJ,
  apoptosis, and Nrf2 pathways. The distance is calculated by the Euclidean method,
  and the clustering method is ward.D2. Red represents positive correlation, blue
  represents negative correlation, the darker the color the greater the correlation.
  * p < 0.05, ** p < 0.01
