figure_title: Model of functional cross-talk between the mevalonate (MVA, in blue)
  and methylerythritol phosphate (MEP, in green) pathways mediated by protein prenylation
  involved in signaling.
caption: Model of functional cross-talk between the mevalonate (MVA, in blue) and
  methylerythritol phosphate (MEP, in green) pathways mediated by protein prenylation
  involved in signaling. The MVA pathway (cytosolic) and the MEP pathway (plastidial)
  both contribute to the biosynthesis of isoprenoid diphosphates (FPP, GGPP), which
  serve as substrates for protein prenylation, but also for isoprenoid biosynthesis.
  Prenylated signaling proteins can, in turn, activate downstream transcriptional
  or metabolic programs that result in the biosynthesis of specialized metabolites.
  Interestingly, this regulatory link allows for scenarios where an MVA-derived metabolite
  depends on a MEP-derived prenylated signaling protein, or vice versa, thereby introducing
  a novel layer of functional cross-talk between the two pathways. Pharmacological
  inhibition of either pathway (e.g., by statins or fosmidomycin) can disrupt this
  interplay, potentially blocking the synthesis of metabolites that do not directly
  derive from the inhibited pathway
