caption: (a) The distribution of genes in the principal component space generated
  with allowance for integrated features from the UniProt and KEGG databases, where
  each point corresponds to a separate gene and color indicates the histological type
  of ovarian cancer. EnOC—endometrioid ovarian carcinoma; HGSC—high-grade serous ovarian
  carcinoma; SOC—serous ovarian cystadenocarcinoma; (b) KEGG pathway enrichment analysis
  for identifying the most important signaling and metabolic pathways characteristic
  of genes in the cluster predominantly containing HGSC-associated genes. The combined
  score is calculated by multiplying the log of the p-value obtained using Fisher’s
  exact test by the z-score, which measures the deviation from the expected rank.
  This allows for the estimation of the significance and rank of enriched pathways
