caption: 'Unique Advantages of Zebrafish Models for Colorectal Cancer Research. Key
  benefits of zebrafish as an experimental platform for CRC studies include: High
  fecundity enabling large-scale studies, optical transparency permitting real-time
  tumor visualization, lack of adaptive immune system, minimal cost, and conserved
  cancer pathways with 70–80% human gene homology [226,227]'
