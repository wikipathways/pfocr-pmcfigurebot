  centrality. Blue nodes are related to proteins mapped in SynGO, red nodes are related
  to proteins involved in the “Regulation of actin cytoskeleton” KEGG pathways, while
  purple nodes are related to proteins mapped in SynGO that also take part in the
  “Regulation of actin cytoskeleton” pathway
