figure_title: FOXM1 inhibition attenuates growth and metastasis in spontaneous mouse
  model of SCLC
caption: A) Schematic showing study design in RPM, a spontaneous mouse model of SCLC.B)
  Representative IVIS bioluminescence images of RPM mice at the day of randomization
  (day 0 of treatment) and at the end of treatment (day 28 of treatment).C) Quantification
  of whole-body bioluminescence intensity in RPM mice treated with vehicle, FDI-6
  (60 mg/kg), cisplatin (2.5 mg/kg) and combination (cisplatin and FDI-6) groups.D-E)
  Representative H&E staining and quantification of RPM mice lung tumors showing significant
  downregulation of tumor burden in the combination group compared to control mice.
  F) Images of IHC staining of RPM lung tumor sections with FOXM1 and cleaved caspase
  3 (apoptotic marker) in different treatment groups as shown in panel B.G) Quantification
  of FOXM1 IHC staining as shown in panel F.H) Quantification of cleaved caspase 3
  IHC staining as shown in panel F. Statistical analysis is from student’s t test,
  one tailed, ns= not significant, *=p<0.05, and *** = p <0.001.I) Bulk RNA sequencing
  of vehicle and FDI-6 treated SCLC cell line (DMS-273) showing downregulation of
  multiple genes associated with FOXM1.J) Pathway analysis through gene set enrichment
  studies showing top modulated pathways in FDI-6 treated SCLC cells.K) AURKB IHC
  staining on SBC-3 xenograft tumor tissues isolated from different treatment groups.L)
  Quantification of AURKB positive cells as shown in panel K.M) Immunoblotting analysis
  depicting downregulation of AURKB following FOXM1 inhibition and KD.N) FOXM1 inhibitors
  reduces the chromatin binding of FOXM1 to the promoter region of AURKB. Statistical
  analysis is from student’s t test, unpaired comparison, **=p<0.01, and *** = p <0.001.O)
  FOXM1 inhibition by FDI-6 induces G2 cell cycle arrest in SCLC cells. Statistical
  analysis is from student’s t test, unpaired comparison, *=p<0.05
