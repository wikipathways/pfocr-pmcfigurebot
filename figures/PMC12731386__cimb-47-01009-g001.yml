caption: 'LSDs are grouped according to the disrupted pathway: enzymatic hydrolytic
  defects (deficient lysosomal hydrolases or cofactors), transporter-related defects
  (abnormal lysosomal membrane transporters), biogenesis and signaling defects (faulty
  lysosomal assembly or enzyme trafficking), and cross-organelle interaction defects
  (impaired lysosome–organelle communication). This framework highlights the diversity
  of LSDs and supports precision therapeutic approaches. Created with BioRender.com
  (https://www.biorender.com, accessed on 10 November 2025)'
