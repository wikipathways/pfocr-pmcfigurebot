figure_title: Crosstalk between the PI3K/AKT/mTOR (PAM) pathway and the Androgen Receptor
  (AR) pathway.
caption: Crosstalk between the PI3K/AKT/mTOR (PAM) pathway and the Androgen Receptor
  (AR) pathway. The PAM pathway controls key cellular functions involved in PC initiation
  and progression, including cell metabolism, cell survival, and cell proliferation.
  PI3K, AKT, mTOR complex 1 (mTORC1), and mTOR complex 2 (mTORC2) are key components
  of the PAM pathway. The catalytic subunit of class I PI3Ks, p110, also has multiple
  isoforms (α, β, γ, δ). Upon stimulation by extracellular signals transduced by various
  membrane receptors (e.g., RTKs, GPCRs), PI3K converts phosphatidylinositol (4,5)-bisphosphate
  (PIP2) into phosphatidylinositol (3,4,5)-trisphosphate (PIP3). PIP3 accumulation
  leads to the activation of downstream targets, such as AKT, which controls multiple
  effectors (e.g., mTORC1). mTORC2, a downstream effector of PI3K, can further activate
  AKT, while the PTEN phosphatase can terminate PAM activation by converting PIP3
  to PIP2. The AR pathway, through androgen-dependent and androgen-independent transcriptional
  regulation, also controls key cellular functions driving PC progression. The PAM
  and AR pathways are linked through multiple mechanisms that can lead to reciprocal
  regulation. Concomitant targeting of the PAM pathway (e.g., by gedatolisib) and
  the AR pathway (e.g., by darolutamide), shown in red, is a promising strategy for
  PC treatment. RTK = receptor tyrosine kinase; GPCR = G-protein-coupled receptors.
  Scheme based on [3,4]
