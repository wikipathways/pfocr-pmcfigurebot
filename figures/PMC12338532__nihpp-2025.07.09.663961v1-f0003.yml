figure_title: oxLDL uptake disrupts actin polymerization and causes neutrophil stalling
caption: (A) Representative FACS plot of cell sorting strategy to isolate purified
  oxLDL+ and oxLDL− neutrophils. (B) Reactome pathway analysis of proteins increased
  in oxLDL+ subset in the proteomics data. (C) Heatmap of selected differentially
  expressed proteins in oxLDL− and oxLDL+ neutrophil populations. (D) 100x STED immunofluorescent
  imaging of peritoneal cells isolated from zymosan and oxLDL-Dil IP-injected mice
  and stained for phalloidin. Cells were also stained and checked for Ly6G expression,
  which is not shown for clarity of phalloidin stain. Representative oxLDL+ (left)
  and oxLDL− (right) cells are shown. (E) In vitro oxLDL-Dil uptake in bone marrow
  enriched neutrophils treated with cytochalasin D. (F) Transwell migration assay
  of oxLDL− and oxLDL+ neutrophils sorted from peritoneal cells following zymosan
  and oxLDL-Dil IP injection. (E-F) All symbols represent independent experiments.
  Data are expressed as mean ± SEM. Statistical differences were calculated by one-way
  ANOVA for F and two-way ANOVA for G. * ≤ 0.05, ** ≤ 0.01, *** ≤ 0.001
