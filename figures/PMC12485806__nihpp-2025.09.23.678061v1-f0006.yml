figure_title: Blocking of NF-κB pathway results in cell death upon VSV infection in
  PC3 cells
caption: 'Cell survival levels, with and without the NF-κB pathway inhibitor Bay11–7082,
  were measured in PC3 cells, following DMSO control treatment or infection with VSV
  (WT and R1) at an MOI of 50. Samples were run in duplicates and analyzed with PrestoBlue
  assay at 24, 48, and 72h post-treatment with Bay11–7082. Viral infection was initiated
  8 hours prior to analysis at each timepoint. Statistical analysis was performed
  in R using student’s t-test comparing each treatment category and error bars were
  integrated by calculating the standard error of means (p.value < 0.0001: “****”,
  p.value < 0.001: “***”, p.value < 0.01: “**”, p.value < 0.05: “*”)'
