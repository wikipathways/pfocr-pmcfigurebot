figure_title: KEGG and Reactome pathway enrichment analysis for IL-6 and irisin.
caption: KEGG and Reactome pathway enrichment analysis for IL-6 and irisin. Bar graph
  illustrating the top five significantly enriched signaling pathways associated with
  IL-6 and irisin targets based on KEGG and Reactome databases. Pathways such as NF-κB
  signaling, cytokine–cytokine receptor interaction, and IL-17 signaling are prominently
  linked to IL-6 -related inflammatory responses, while AMPK signaling and oxidative
  phosphorylation are associated with irisin’s metabolic and anti-inflammatory roles.
  The x-axis shows the adjusted p-values indicating statistical significance of enrichment.
  This analysis supports the observed salivary expression profiles and implicates
  both biomarkers in periodontitis-related pathophysiological pathways. Statistical
  analyses were performed using IBM SPSS Statistics for Windows, Version 25.0. The
  Shapiro–Wilk test was used to assess normality. Group comparisons were made using
  the independent samples t-test or Mann–Whitney U test, while correlations were evaluated
  with Spearman’s rank correlation. ROC analysis was used to assess diagnostic performance.
  A p-value < 0.05 was considered statistically significant
