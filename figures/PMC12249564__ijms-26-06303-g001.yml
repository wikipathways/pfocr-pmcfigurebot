caption: Crucial components, targets, and mechanisms of Ligustri Lucidi Fructus (LLF)
  in diabetic nephropathy (DN) revealed by integrated network pharmacology and experimental
  validation. Workflow includes (1) screening 383 DN-related targets in LLF, (2) protein–protein
  interaction (PPI) and component–target–disease network analyses identifying core
  targets and components, (3) molecular docking and dynamics simulations confirming
  protein–ligand interactions, (4) GEO and KEGG analyses implicating the cytosolic
  DNA-sensing pathway, and (5) experimental validation of the podocyte-protective
  effects of LLF-containing serum and the mechanisms associated with this
