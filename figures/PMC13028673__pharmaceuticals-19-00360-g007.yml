figure_title: YXJDF activates the PTEN-induced putative kinase 1 (PINK1)/Parkin-mediated
  mitophagy pathway in TAC-induced failing hearts.
caption: |-
  YXJDF activates the PTEN-induced putative kinase 1 (PINK1)/Parkin-mediated mitophagy pathway in TAC-induced failing hearts. (A–D) Quantitative real-time PCR (qRT-PCR) analysis of mitophagy-related genes, including Pink1, Park2, Becn1, and Sqstm1 in myocardial tissue from each group. (E) Representative Western blot images showing protein expression of PINK1, Parkin, Beclin-1, p62, autophagy-related protein 16-like 1 (ATG16L1), translocase of outer mitochondrial membrane 20 (TOM20), microtubule-associated protein 1 light chain 3 (LC3)-I, and LC3-II in cardiac tissue. (F–L) Densitometric quantification of Western blot results for PINK1 (F), Parkin (G), Beclin-1 (H), p62 (I), ATG16L1 (J), TOM20 (K), and LC3-II/LC3-I ratio (L). Data are expressed as mean ± SD (n = 3–5 biological replicates). ##
  p < 0.01, ###
  p < 0.001 vs. Sham; * p < 0.05, ** p < 0.01, *** p < 0.001 vs. TAC. Abbreviations: Sham, sham-operated group; TAC, transverse aortic constriction; YXJDF, Yixinjiedu formula; TMZ, trimetazidine
