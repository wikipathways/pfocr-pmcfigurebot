caption: Native producing plant (left), chemical structures (middle), and proposed
  microbial biosynthetic pathway schematics (right) for the therapeutic terpenoids
  (a) artemisinin, (b) taxol, (c) vinblastine, (d) QS-21, and (e) cyclopamine. QS-21
  is composed of two isomers that contain either D-apiose or D-xylose as the final
  residue in the linear tetrasaccharide. For simplicity, only the xylosyl isomer is
  depicted. The chemical structures and biosynthetic pathways are colored according
  to the type of biochemical transformation that built that component, including cyclized
  triterpene cores in black, oxidations in red, glycosylations in blue, methylations/acylations/acetylations
  in teal, and other modifications in orange. Enzymes and proposed bottlenecks in
  the microbial biosynthetic pathways for these products or their precursors are listed
  in Supplementary Tables S1–S5
