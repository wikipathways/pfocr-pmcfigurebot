figure_title: Bacterial metabolites drive hepatocellular carcinoma through core signaling
  pathway networks.
caption: 'Bacterial metabolites drive hepatocellular carcinoma through core signaling
  pathway networks. Gut-derived metabolites (LPS, BAs, SCFAs, and TMAO) translocate
  to the liver via increased intestinal permeability, where they activate or inhibit
  key pathways (NF-κB, STAT3, mTORC1, MAPK/PKC, and FXR), collectively promoting hallmark
  HCC features including chronic inflammation, proliferation, EMT, metabolic reprogramming,
  and immune microenvironment remodeling. Color coding: red (pro-tumor effects: LPS,
  DCA, LCA, and TMAO); green (anti-tumor effects: UDCA and butyrate); blue (dual roles:
  SCFAs and FXR). Solid arrows: direct activation; dashed arrows: indirect regulation.
  Abbreviations: BAs, bile acids; DCA, deoxycholic acid; EMT, epithelial–mesenchymal
  transition; FXR, farnesoid X receptor; HCC, hepatocellular carcinoma; LCA, lithocholic
  acid; LPS, lipopolysaccharide; SCFAs, short-chain fatty acids; TMAO, trimethylamine
  N-oxide; UDCA, ursodeoxycholic acid'
