figure_title: 'The cellular origins and related activation pathways of cancer-associated
  fibroblasts (CAFs): CAFs can be originated from multiple cell types by utilizing
  distinct mechanisms: A.'
caption: 'The cellular origins and related activation pathways of cancer-associated
  fibroblasts (CAFs): CAFs can be originated from multiple cell types by utilizing
  distinct mechanisms: A. Activation—resident fibroblasts and quiescent stellate cells
  are converted into CAFs through stimulation by different modulators, such as TGF-β,
  HGF, PDGF, FGF-2, SDF-1, ROS, IGF-1 (insulin-like growth factor 1), and deficiency
  of vitamin A [37]; B. Recruitment and activation—mesenchymal stem cells (MSCs) can
  be transdifferentiated into CAFs, induced by stimulating molecules such as TGF-β1,
  CCL2, CCL5, CXCL12, and tumor-derived exosomes [38]; C. Transdifferentiation—adipocytes,
  pericytes, and smooth muscle cells can be transdifferentiated into CAFs by TGF-β1
  and Wnt3a [39]; D. EndMT—endothelial cells are transformed into CAFs through endothelial–mesenchymal
  transition [40]; E. EMT—epithelial cells are transformed into CAFs through epithelial–mesenchymal
  transition [41]; F. MMT—monocytes are transformed into CAFs through monocyte–myofibroblast
  transdifferentiation [42] (created with BioRender.com icons)'
