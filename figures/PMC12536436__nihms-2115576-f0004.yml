figure_title: “Per protein” kinetic modeling also supports off-pathway hemi-fusion
  mechanism.
caption: '“Per protein” kinetic modeling also supports off-pathway hemi-fusion mechanism.
  DENV VLP hemi-fusion data collected at different pH values (see Fig. 2) were fit
  to either a linear (A) or an off-pathway (B) mechanism, using “per protein” cellular
  automaton simulations (state definitions are described in the main text). CDFs of
  all pH values were fit simultaneously. (C) shows the best fit (solid lines) for
  the linear model to the experimental CDF (open circles). (F) and (I) show the best
  fits for the irreversible (kreturn = 0) and reversible (kreturn≠0) off-pathway models,
  respectively. The probability of hemi-fusion was calculated relative to the final
  extent at pH 5, which was set at 1. (D), (G), and (J) show the normalized fits on
  the normalized CDFs to demonstrate how well the fits model the experimental wait
  time distributions. CDFs were normalized to the final extent of hemi-fusion at each
  pH value. (E), (H), and (K) show the model predictions for final extents of hemi-fusion
  (solid bars) at t = 300 s compared with the experimental final extents (open bars).
  Final extents are shown relative to pH 5, which was set at 1. Error bars are the
  standard deviation of three sample replicates. The best fitting rate constants were
  as follows: linear: kact = 1.0 × 105 M−1s−1, ktri = 1.0 × 103 M−1s−1, and khemi
  = 7.0 × 10−3 s−1; off-pathway: kact = 8.0 × 108 M−1s−1, ktri = 8.0 × 106 M−1s−1,
  koff = 25.3 s−1, and khemi = 7.5 × 10−3 s−1; and off-pathway, reversible: kact =
  8.0 × 108 M−1s−1, ktri = 8.0 × 106 M−1s−1, koff = 25.3 s−1, khemi = 7.5 × 10−3 s−1,
  and kreturn = 0.12 s−1'
