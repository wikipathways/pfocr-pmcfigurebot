figure_title: Long telomere set length regulation is dependent on the telomerase pathway
caption: a. Southern blot with DNA derived from three clones of W3749A, four clones
  of rad52Δ MATa, two clones of rad52Δ MATα and one clone of W3749α. DNA was digested
  with PvuII and probed with a telomeric repeat fragment. TEL03L, TEL11L and TEL06R
  telomeric repeat tract lengths are indicated on right. (ns for difference not significant,
  t-test). b. Initial telomeric tract lengths for 3 clones of Est3-FRB are shown for
  TEL03L, TEL06R, TEL11R and Y’-telomeres. c. Changing telomeric tract lengths of
  TEL11R, TEL06R and Y’-telomeres during culture outgrowth (14 days or indicated population
  doublings) of Est3-FRB cells. d. Same as c. but for TEL03L. e. Calculated telomeric
  repeat loss rates (in bp/population doublings; bp/PDs) for Est1-FRB and Est3-FRB
  strains are tabled for TEL03L, TEL11R, TEL06R and Y’-telomeres. (ns for difference
  not significant, t-test)
