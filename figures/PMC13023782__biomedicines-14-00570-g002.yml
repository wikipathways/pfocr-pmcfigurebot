figure_title: Proposed stepwise treatment algorithm for DCS.
caption: 'Proposed stepwise treatment algorithm for DCS. This flowchart outlines the
  step-by-step treatment approach described in Section 14. Early or mild cases focus
  on controlling inflammation and preventing further follicle damage with topical
  or injected treatments. If inflammation continues, treatment moves to systemic antibiotics
  and retinoids. For cases that do not respond or are more complex, targeted immunomodulatory
  therapies may be considered, such as TNF-α inhibitors, IL-17/IL-23 pathway inhibitors,
  or JAK inhibitors. When sinus tracts and permanent scarring reduce the effectiveness
  of medical treatments, procedures like deroofing, excision, laser hair removal,
  or photodynamic therapy are recommended. This algorithm brings together current
  evidence to help guide clinical decisions, but it is not meant to replace formal
  guidelines. Abbreviations: DCS, dissecting cellulitis of the scalp; HS, hidradenitis
  suppurative; IL, interleukin; JAK, Janus kinase; PDT, Photodynamic therapy; QoL,
  quality of life; TNF-α, tumor necrosis factor alpha'
