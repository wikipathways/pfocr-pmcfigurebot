figure_title: Hepatocyte pyroptosis is regulated by METTL3-mediated m6A methylation.
caption: 'Hepatocyte pyroptosis is regulated by METTL3-mediated m6A methylation. (A)
  Signaling pathways related to RNA modification and methylation were enriched. (B)
  The m6A level of liver tissues and primary hepatocytes was detected (n = 6 per group).
  (C) mRNA levels of Mettl3, Mettl14, Mettl16, Wtap, Kiaa1429, Fto and Alkbh5 in primary
  hepatocytes from the control and CCl4 groups were determined by RT-qPCR (n = 3 per
  group). (D) IHC staining of METTL3 and NLRP3 under control and CCl4 treatment (Scale
  bar: 50μm, n = 6 per group). (E) Protein expression of METTL3 and NLRP3 under control
  and CCl4 treatment (n = 3 per group). (F) mRNA levels of Mettl3 in primary hepatocytes,
  macrophages, T cells, B cells, NK cells and HSCs from control or CCl4-treated mice
  (n = 3 per group). (G) Co-IF of METTL3 and ALB under CCl4 treatment (Scale bar:
  25μm). (H) The m6A levels of liver tissues and primary hepatocytes were decreased
  by METTL3 mutation (n = 6 per group). (I) H&E staining in liver sections from Mettl3-WT
  or Mettl3-Mut mice treated with CCl4 (Scale bar: 50μm). (J) Serum ALT and AST levels
  from indicated groups (n = 6 per group). (K) Western blot showed the decreased levels
  of METTL3, NLRP3, GSDMD-N, Cleaved CASPASE1, mature IL-1β and mature IL-18 in Mettl3-Mut
  mice compared to Mettl3-WT mice (n = 3 per group). (L) IHC staining of NLRP3, GSDMD-N,
  Cleaved CASPASE1 in liver sections from indicated groups (n = 6 per group). (M)
  mRNA levels of Mettl3, Il-1β, Il-18, Tnf-α, Tgf-β, Il-6 and Mpo in liver tissues
  from Mettl3-WT or Mettl3-Mut mice treated with CCl4 (n = 3 per group). (N) Serum
  pyroptosis index from indicated groups (n = 6 per group). (O) IF staining of mature
  IL-1β and mature IL-18 (Scale bar: 50μm) and TUNEL/GSDMD-N co-staining (Scale bar:
  25μm) in liver sections from indicated groups (n = 6 per group). All results are
  shown as mean ± SEM. *p < 0.05. ns, not significant'
