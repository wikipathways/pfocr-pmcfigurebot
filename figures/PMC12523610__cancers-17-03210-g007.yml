figure_title: Tumor-bearing mice exhibit distant liver metabolic reprogramming in
  heme and prostaglandin pathways.
caption: Tumor-bearing mice exhibit distant liver metabolic reprogramming in heme
  and prostaglandin pathways. UMAP of liver cell populations from two normal mice
  (upper cluster) and two tumor-bearing mice (lower cluster), reanalyzed from Vandenbon
  et al. In both groups, Cyp2a1 expression was maintained (fold change < 2), reflecting
  conserved hepatic metabolic activity. In contrast, livers from tumor-bearing mice
  exhibited significant upregulation of Mki67 (adjusted p < 0.05), indicating enhanced
  cell cycle activity. Moreover, the heme/porphyrin export gene Flvcr1 (adjusted p
  < 0.05) and the prostaglandin pathway enzyme Alox5 (adjusted p < 0.05) were elevated
  in tumor-bearing livers, consistent with metabolic reprogramming. These changes
  suggest that tumors can trigger early (“pioneer”) signals of heme and lipid pathway
  activation in distantly affected organs
