figure_title: The local cholecystectomy service.
caption: 'The local cholecystectomy service. Emergency laparoscopic cholecystectomy
  (ELC) sessions were made possible by reorganising elective activities. Procedures
  were primarily undertaken by experienced upper gastrointestinal (UGI) surgeons and
  their trainees, with general surgeons covering on the odd planned occasion. * On
  occasion, patients falling outside these criteria (e.g., ASA 3+) were pragmatically
  enrolled onto the ELC pathway on clinical grounds and when an experienced UGI surgeon
  was available. † Patients with an obstructive picture were often booked onto the
  inpatient ELC pathway once appropriate investigations were complete. USS: ultrasound,
  CT: computed tomography scan, MRCP: magnetic resonance cholangiopancreatography,
  CBD: common bile duct, ERCP: endoscopic retrograde cholangiopancreatography, CPA:
  clinical physician associate, ANP: advanced nurse practitioner, ADL: activities
  of daily living, BMI: body mass index, ASA: American Society of Anaesthesiologists'
