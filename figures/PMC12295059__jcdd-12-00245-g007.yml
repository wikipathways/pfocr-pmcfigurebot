caption: (A) Panel A shows a cross section through the walls of the right atrium from
  a heart obtained from a 6-month-old neonate, with the image orientated in “four
  chamber” fashion. Even at this low magnification it is possible to recognise the
  cardiomyocytes making up the atrioventricular node and the site of the sinus node,
  although the cells of the sinus node are not seen. The remaining walls are made
  up of aggregated working cardiomyocytes, with an obvious parallel alignment in the
  right atrial wall making up part of the superior rim of the oval fossa. (B) Panel
  B shows a dissection of the septal surface of the right atrium, having removed the
  endocardium to show the “grain” produced by the aggregation of the cardiomyocytes.
  There are obvious parallel alignments in the pathways leading into the triangle
