figure_title: Synapse loss after disruption of SNX17-Retriever and SNX27-Retromer
  pathways in vivo
caption: '(A). Procedural schematic: Unilateral stereotaxic injections of AAV9 vectors
  expressing shRNA against SNX17 or SNX27 in hippocampal area CA1 coupled with contralateral
  infusion of AAV9 vectors expressing scrambled shRNA were made at P8–10, followed
  by perfusion/fixation 14 days later. mNeonGreen (expressed by all vectors) was imaged
  by confocal microscopy (B). Representative low power mNeonGreen image of CA1 hippocampal
  region with injection site at P22. Scale bar = 50 μm. (C). Representative high power
  image of CA1 pyramidal neuron expressing AAV9-mNeonGreen fluorescent reporter. Scale
  bar = 20 μm. (D). Representative images of dendritic spines in CA1 basal dendrites
  in each of the indicated treatment conditions. Scale bar = 5 μm. (E-G). Mean ± SEM
  spine density in basal dendrites (F2,136 = 56.16, p <0.0001) (E), percent spines
  with mature mushroom morphology (F2,124 = 10.36, p <0.0001) (F), and soma area (F2,120
  = 0.20, NS) (G) in CA1 pyramidal neurons for the indicated conditions. SCR, N =
  53 neurons; shSNX17, N = 50 neurons; shSNX27, N = 36 neurons from 7 animals (5 male,
  2 female) receiving shSNX17/SCR and 5 animals (3 male, 2 female) receiving shSNX27/SCR.
  ** P < 0.01, ****P < 0.0001 by Fisher’s LSD. Data in (E-G) from the same animal
  is reflected with a common shade of red (SNX17 shRNA) or blue (SNX27 shRNA). When
  neurons from the same condition are averaged into a single value per animal: Mean
  ± SEM Spines per μm = 0.32 ± 0.04 (Scr), 0.26 ± 0.03 (shSNX17), 0.20 ± 0.03 (shSNX27);
  (F2,18 = 2.47, p < 0.11); Mean ± SEM % Mushroom Spines = 32.2 ± 2.0 (Scr), 21.2
  ± 1.2 (shSNX17), 29.1 ± 3.1 (shSNX27); F2,18 = 8.04, p < 0.01; Mean ± SEM Soma area
  (μm2) = 605.1 ± 44.7 (Scr), 523.5 ± 86.4 (shSNX17), 576.2 ± 66,4 (shSNX27); F2,18
  = 0.45, p = 0.65. Figure 1A was created in BioRender. Chavis, G. (2025) https://BioRender.com/izig63v'
article_title: Dual endomembrane recycling pathways function in parallel to support
  synapse maintenance and plasticity
