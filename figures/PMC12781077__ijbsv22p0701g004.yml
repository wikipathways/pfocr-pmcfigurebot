figure_title: Hh pathway activation induces drug resistance in lung cancer cells.
caption: Hh pathway activation induces drug resistance in lung cancer cells. This
  occurs primarily through EMT mediation and MDR induction. Specifically, Hh signaling
  upregulates MDR efflux transporters (e.g., ABCG2 and ABCB1), enhancing drug extrusion
  and reducing intracellular chemotherapeutic concentrations. Furthermore, the pathway
  stimulates KRAS expression, which confers resistance to KRAS-targeted inhibitors
