figure_title: qRT-PCR validation of key genes in the amino sugar and nucleotide sugar
  metabolism pathway under submergence stress.
caption: qRT-PCR validation of key genes in the amino sugar and nucleotide sugar metabolism
  pathway under submergence stress. (A) Schematic representation of the UDP-Glc and
  ADP-Glc biosynthesis branches within the amino sugar and nucleotide sugar metabolism
  pathway (KEGG map00520). The heatmap displays transcriptomic expression patterns
  of selected genes (OsHXK4, OscPGM, UGP1, and OsAGPL1) in the Xian133 and Chang15
  under submergence. The color scale represents normalized expression levels, with
  red indicating high expression and blue indicating low expression. (B–E) Time-course
  expression profiles of OsHXK4 (B), OscPGM (C), UGP1 (D), and OsAGPL1 (E) in both
  the tolerant Xian133 and sensitive Chang15 cultivars at 0, 6, 72, and 240 h post-submergence,
  as determined by qRT-PCR. Data are presented as mean ± SD (n = 3 biological replicates).
  Statistical significance was assessed using one-way ANOVA followed by Tukey’s HSD
  test. Different lowercase letters indicate significant differences (p < 0.05) among
  time points within each cultivar
