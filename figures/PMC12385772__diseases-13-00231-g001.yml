caption: 'Before-admission phase of the EUPEMEN protocol, illustrating structured,
  multidisciplinary preoperative evaluation and patient optimization strategies. These
  include screening, chronic disease control, nutritional and psychological assessments,
  and education, carried out collaboratively by the anesthetist, surgeon, nurse, and
  nutritionist. Where applicable, an alternate pathway may be initiated for high-risk
  patients—such as those undergoing neoadjuvant therapy, identified as frail, or with
  significant nutritional deficits—offering structured prehabilitation and optimization
  strategies before surgery. (source: https://eupemen-learning.com/)'
