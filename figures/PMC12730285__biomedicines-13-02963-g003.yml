figure_title: piR-hsa-022095 orchestrates a cell-cycle gene network.
caption: piR-hsa-022095 orchestrates a cell-cycle gene network. (A) Heatmap showing
  differentially expressed mRNAs after piR-hsa-022095 inhibition. (B) GO enrichment
  analyses of up- and down-regulated genes. (C) Overlap (Venn diagram) between regulated
  genes and predicted targets. (D) KEGG pathway enrichment of overlapping genes. (E)
  qRT-PCR confirming up-regulation of PGPEP1, LMBR1L, TSC22D2, and KLF11. Bars represent
  the mean ± SD of three independent biological replicates, each measured in technical
  triplicate. (F) Seed-sequence complementarity between piR-hsa-022095 and these genes.
  Data are presented as mean ± SD. * p < 0.05; ** p < 0.01 (unpaired Student’s t-test)
