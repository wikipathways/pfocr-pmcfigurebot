figure_title: Incidence of haematologic TEAEs by number of 177Lu-PSMA-617 administrations
  and number of bone metastases at baseline
caption: '(A) Proportion of participants with haematologic TEAEs occurring at 1–4
  versus 5–6 administrations of 177Lu-PSMA-617, among participants who received 5
  or 6 administrations 177Lu-PSMA-617 (n = 165). (B) Proportion of participants with
  haematologic TEAEs according to number of bone metastases at baseline (0a: 177Lu-PSMA-617
  n = 29, ARPI change n = 30; 1–5: 177Lu-PSMA-617 n = 80, ARPI change n = 84; 6–20:
  177Lu-PSMA-617 n = 69, ARPI change n = 84; or >20/superscan: 177Lu-PSMA-617 n =
  49, ARPI change n = 34). Adverse events were coded using Common Terminology Criteria
  for Adverse Events v5.0 grading and Medical Dictionary for Regulatory Events v27.1
  terms.aParticipants with a nonevaluable number of lesions are counted in the ‘0
  bone metastases at baseline’ subgroup.bIncludes haemoglobin decreased.cIncludes
  lymphocyte count decreased.dIncludes neutrophil count decreased (panel A and B)
  and febrile neutropenia (panel B only).eIncludes platelet count decreased.fIncludes
  white blood cell count decreased. ARPI, androgen receptor pathway inhibitor; No.,
  number; PSMA, prostate-specific membrane antigen; TEAEs, treatment-emergent adverse
  events'
