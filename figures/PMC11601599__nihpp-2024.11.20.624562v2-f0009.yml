figure_title: Modulation of IRF pathway genes in BMDMs by BbLP
caption: 'a) Line graphs showing the kinetics of relative expression of Gbp2, Gbp5,
  Ifit1, Isg15, Rsad2 and Hcar2 genes in BMDM during BbLP treatment (1 and 0.1 μg)
  at 1, 4 and 24 hrs determined by RT-PCR analysis. b) Bar graphs showing the relative
  expression of Gbp2, Gbp5, Ifit1, Isg15, Rsad2 and Hcar2 genes in BMDM during BbLP
  treatment (1 μg) pre-treated with or without BAY and BCI inhibitors, determined
  by RT-PCR analysis. Data are presented as mean ± standard error of the mean (SEM).
  Statistical significance between samples is indicated as follows: *p < 0.05, **p
  < 0.01, ***p < 0.001, ****p < 0.0001'
