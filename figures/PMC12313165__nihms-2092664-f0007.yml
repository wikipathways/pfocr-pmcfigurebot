figure_title: TAF1 loss has a greater effect on the transcriptome of fetal vs adult
  HSPCs
caption: 'FL HSPCs cells were isolated from E14.5 embryos and deletion of Taf1 was
  mediated by Vav1-iCre. Adult BM HSPCs were isolated from young mice and deletion
  of Taf1 was mediated by Mx1-Cre and 2 weeks post poly(I:C) induction. A). HSPCs
  were subject to RNA-seq. Venn diagrams showing the overlapping up- and down-regulated
  genes between FL and adult HSPCs. n=3–4 B). KEGG pathway analysis of DE genes in
  adult BM HSPCs. C). KEGG pathway analysis of the DE genes in FL HSPCs. The commonly
  regulated pathways between adult and fetal HSPCs are highlighted in red. D). Apoptosis
  in FL cells was determined using Annexin V and PI staining. Left: representative
  FACS plots. Right: percentages of early (Annexin V+, PI−) and later (Annexin V+,
  PI+) apoptotic cells. n=3–8 E). Cell cycle was determined using PI staining in FL
  cells. Left: representative FACS plots. Right: Percentages of cells in S-phase were
  determined using Watson model in FlowJo software. n=3–13'
article_title: TAF1 is required for fetal but not adult hematopoiesis in mice
