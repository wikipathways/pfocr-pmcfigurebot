figure_title: HTLV-1-infected lymphoid cells induce transcriptomic changes in A549
  lung epithelial cells
caption: A549 cells (4×10⁵) were co-cultured with Jurkat, MT-4 (or SN), or MT-2 (or
  SN) cells at a 1:1 ratio for 24 h (n = 4–6), and RNA was extracted for sequencing.
  (a) PCA shows distinct clustering of A549 cells (orange), and A549 cells co-cultured
  with MT-2 cells (blue), MT-2 SN (purple), MT-4 cells (green), MT-4 SN (turquoise)
  and Jurkat cells (red). (b) Venn diagram highlights unique and overlapping upregulated
  DEGs, with MT-2 cells and MT-2 SN showing distinct profiles. (c) Volcano plot displays
  DEGs in A549 MT-2 vs A549 Jurkat controls. (d) KEGG over-representation analysis
  of 830 MT-2–specific DEGs. Top 40 enriched pathways are shown, with selected pathways
  highlighted. (e) Chord diagram maps 105 clinically relevant DEGs shared across 4
  of 18 selected KEGG pathways. (f) Heatmap shows fold changes of the 105 filtered
  genes across all co-culture conditions. Genes highlighted in red were shown to be
  positively regulated by HTLV-1 Tax33
