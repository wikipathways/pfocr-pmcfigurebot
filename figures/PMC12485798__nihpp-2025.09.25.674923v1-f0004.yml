figure_title: A closer investigation of the excitatory-neuron-specific GRN
caption: (A) A Manhattan plot showing the physical distribution of all genes in the
  constructed excitatory-neuron-specific GRN. Genes in different chromosomes were
  colored in alternating colors. The Y-axis indicates the total degree of each gene.
  The red horizontal line is the 0.95 quantile degree of all genes in the GRN, serving
  as a cutoff. Genes with a degree higher than the 0.95 quantile cutoff were highlighted
  in the figure. Non-hub genes were highlighted in blue, regulatory hubs with the
  top 0.95 quantile of outdegree and C2 were highlighted in orange, and responsive
  hubs with top 0.95 quantile of indegree and R2 were highlighted in sky blue. TF
  hubs were highlighted in yellow triangles. Only hubs greater than the 0.99 quantile
  were labeled on this figure to avoid too many overlaps.(B) Heatmaps showing the
  pathway enrichment signals from the direction of upstream regulators to their targets
  for both GO and KEGG pathways. Only the top 30 significantly enriched pathways from
  pathway analysis were included in the heatmap, with rows as pathways enriched with
  source genes and columns as pathways enriched with target genes. The blocks in the
  heatmap were colored based on the number of regulations between the corresponding
  pair of pathways. Darker colors indicate more regulations. Corresponding pathway
  names of the IDs can be found in Supplementary Information Table S4.(C) A zoom-in
  GRN figure for selected TF hubs (JUNB, ETV5, EGR1, ATF3, and NR4A1) and their two
  nearest neighbors. The TFs were highlighted in pink diamond shape, with non-hub
  TFs in yellow circles and the rest in blue circles. The size of the circles is determined
  by the gene’s degree
