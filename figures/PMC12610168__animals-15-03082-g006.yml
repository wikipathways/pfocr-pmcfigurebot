caption: Network visualization of enriched functional categories among cis-eQTL-associated
  genes in Hanwoo backfat tissue. (A) KEGG pathway enrichment network. Each node represents
  a KEGG pathway, with edges connecting pathways that share genes. Node colors indicate
  functional clusters, with the same color denoting related pathways. (B) GO Biological
  Process enrichment network. Each node represents a significantly enriched GO term,
  with edges indicating shared gene content. Node colors indicate functional themes,
  and only clustered GO terms are shown
