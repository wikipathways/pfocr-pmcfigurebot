figure_title: Proteomic characterization of BTC cell lines identifies dysregulated
  protein networks and associated vulnerabilities
caption: '(A) Heatmap showing MAD normalized protein expressions corresponding to
  the unsupervised clustering of BTC (N=58) and HCC (n=17) cell lines based on protein
  expression profiles. The top 50 proteins enriched in each cluster are displayed
  (Wilcoxon rank-sum, q<0.1). Pathway enrichment analysis of differentially expressed
  protein (Methods, q<0.1) for each cluster is indicated on the right. Right panels:
  Volcano plots indicating differential dependencies corresponding to each cluster
  relative to other clusters (unpaired t-test). significant genes with at least 2
  dependent cell lines in the in-group are highlighted in red. Cluster P3 does not
  exhibit any significant dependencies.(B-E) Protein-protein interaction (PPI) networks
  generated using STRING database by combining differential dependencies and significantly
  up and downregulated proteins per cluster. Each network includes first neighbors
  corresponding to the dependencies. Size of the bubble corresponds to abs (Log2 Fold
  Change) value. Red=Dependency, Blue= upregulated proteins and Yellow= downregulated
  proteins.(F) Pearson correlation of protein expression and corresponding gene effect
  scores. Bubble size indicates the percentage of cell lines (n=52) dependent on the
  specified protein (gene effect<−0.5). Red: HIPPO signaling-related proteins.(G)
  Schematic representation of PARD3, PARD6B and WWTR1 regulating TEAD1 transcriptional
  activity. (Created with BioRender.com).(H) Heatmap showing correlation between the
  indicated gene effects in BTC cell lines (n=39).(I) Bar plots showing relative viability
  after siRNA mediated knockdown of TEAD1 or WWTR1. Bars represent mean ± SEM. Unpaired
  t-test. ****p<0.0001'
