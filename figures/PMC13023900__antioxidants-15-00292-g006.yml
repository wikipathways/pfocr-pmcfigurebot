figure_title: 'DUOX2-dependent oxidative stress restricts Parabacteroides proliferation:
  (A) Functional profiling of OS based on gut metagenomic data from Duox2 KO and WT
  mice.'
caption: 'DUOX2-dependent oxidative stress restricts Parabacteroides proliferation:
  (A) Functional profiling of OS based on gut metagenomic data from Duox2 KO and WT
  mice. (B) Correlation analysis between differential bacterial genera and OS profiling
  in Duox2 KO and WT mice. Color key: Spearman’s correlation coefficient (Rho). Red
  gradients indicate positive correlations, purple gradients indicate negative correlations,
  and white indicates no correlation. (C) Relative growth of P. distasonis strains
  and E. coli under different hydrogen peroxide (H2O2) concentrations. (D) Scanning
  electron microscopy (SEM) images showing morphological changes in P. distasonis
  and E. coli under different H2O2 concentrations. (E) Representative immunofluorescence
  images showing ROS levels in P. distasonis and E. coli under different H2O2 concentrations.
  (F–H) Proteomics sequencing analysis of P. distasonis and E. coli, with three biological
  replicates for each strain. (F) PCA of P. distasonis and E. coli, presenting the
  first and second principal components. (G) Volcano plot depicting the identified
  proteins in the two species. The significantly differentially abundant proteins
  are shown as blue dots and red dots, representing downregulated and upregulated
  proteins, respectively. The nonsignificant proteins are shown in gray. The screening
  criteria were p < 0.05 and |FC| ≥ 2. (H) Gene Ontology pathway analysis of differentially
  expressed proteins at the molecular function (MF) level (p < 0.05). Exact p levels
  were all provided. PD1, P. distasonis strain ATCC BAA-1295; PD2, P. distasonis strain
  ATCC 8503; EC, E. coli MG1655. Note: * p < 0.05, ** p < 0.01, *** p < 0.001, ns:
  not significant'
