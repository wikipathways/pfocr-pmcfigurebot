figure_title: Dysregulation and transcriptional impact of Notch signaling in MASLD-HCC.
caption: 'Dysregulation and transcriptional impact of Notch signaling in MASLD-HCC.
  (A) Differential expression of Notch pathway genes in MASLD HCC.NT versus HCC.T.
  (B) Differential expression of Notch4 and Notch pathway genes in KAT2A deletion
  (GSE279791). (C) Differential expression of Notch pathway genes in TACC3 knockdown.
  (D) Left: the number of KAT2A target genes and cell cycle-related genes that are
  significantly differentially expressed between HCC.T and HCC.NT samples. Middle:
  the number of KAT2A target genes affected upon TACC3 knockdown. Right: Loss of KAT2A
  disrupts the expression of promoter-proximal KAT2A target genes. (E) Concordant
  gene expression changes and enriched pathways observed between KAT2A deletion and
  TACC3 knockdown. HCC, hepatocellular carcinoma; HCC.NT, tumor-adjacent normal liver;
  HCC.T, tumor; MASLD, metabolic dysfunction-associated steatotic liver disease'
