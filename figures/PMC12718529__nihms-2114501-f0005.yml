figure_title: GP130 inhibition normalized mitochondrial dimensions, cristae morphology
  and mitigated dysregulation of oxidative phosphorylation and fatty acid metabolism
  proteins
caption: '(A) Representative electron micrograph demonstrating PAB-Veh mitochondria
  are smaller and more fragmented (white arrows). GP130 antagonism with SC144 normalized
  (B) mitochondrial shape assessed by length to width ratio (control: 1.7[1.6,1.9],
  PAB-Veh: 1.6[1.6,1.7], PAB-SC144: 1.8[1.7,2.2], Kruskal-Wallis ANOVA with Dunn’s
  post-hoc, medians shown), and (C) mitigated changes in cristae abundance (control:
  1.8±0.4, PAB-Veh: 1.3±0.05, PAB-SC144: 1.5±0.1, Kruskal-Wallis ANOVA with Dunn’s
  post-hoc, medians shown). (D) Hierarchical cluster analysis and (E) partial least
  squares discriminant analysis of RV mitochondrial enrichment proteomics cluster
  PAB-SC144 clusters with control (F) Pathway analysis identified 6 of the top 20
  pathways are related to metabolism (italicized, red star). (G) Proteins in complexes
  I-V of the electron transport chain were downregulated in PAB-Veh mitochondria,
  and normalized with SC144 treatment. (H) Schematic of complexes I-V of the electron
  transport chain. Red arrows (PAB-Veh) and blue equal signs (PAB-SC144) visualize
  changes compared to control abundances. (I) Proteins in the mitochondrial beta-oxidation
  pathway were reduced in PAB-Veh RVs, but not PAB-SC144 RVs. (J) Key proteins in
  the mitochondrial beta-oxidation pathway which produce cofactors for the electron
  transport chain and Acetyl-CoA for the TCA cycle. ACAD: acyl-coA dehydrogenase;
  ECH: enoyl-CoA hydratase; HADHA: hydroxyacyl-CoA dehydrogenase subunit A; HADHB:
  hydroxyacyl-CoA dehydrogenase subunit; MTP: mitochondrial trifunctional protein.
  Scale bars show z-scores of protein abundances across all 3 groups in D,G,I'
