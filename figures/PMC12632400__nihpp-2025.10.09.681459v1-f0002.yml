figure_title: Germline and soma employ different mechanisms to regulate Tc1 excision
caption: (A) Schematic of the C. elegans RNAi pathway showing factors assayed for
  roles in suppressing Tc1 excision, including the germ granule components DEPS-1
  (located in the P granule), ZNFX-1 (in the Z granule), RDE-3 and MUT-16 (in Mutator
  foci), and the nuclear RNAi factor NRDE-2, which inhibits gene expression at the
  level of transcription. (B and C) Percentage of plates containing one or more animals
  with germline Tc1 excision (indicated by mScarlet-I expression in all cells) when
  populations started with a single animal were expanded to the F1 generation (B)
  or F2/F3 generations (C). Total plates scored per genotype per replicate were 6–19.
  ≥3 replicates scored per genotype. Error bars denote mean ± standard deviation (SD).
  WT, wild-type. (D) Somatic Tc1 excision rates visualized as percentage of progeny
  animals expressing mScarlet-I in one or more somatic cells from independently singled
  animals. Data points represent independent lineages and are from ≥3 replicates.
  Total lineages scored per genotype were 25–116. WT is wild-type. ns, not significant;
  **, p≤ 0.01; ***, p ≤ 0.001 (Kruskal-Wallis test with Dunn’s test for multiple comparisons).
  Error bars denote mean ± SD
