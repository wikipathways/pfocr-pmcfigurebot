figure_title: Regulation of cancer hepcidin production.
caption: Regulation of cancer hepcidin production. Hepcidin is produced by the liver
  and malignant tumour cells. Hepcidin overexpression in tumour tissue is linked to
  BMP molecules, such as BMP7, and inflammatory triggers, including interleukin-6.
  In cancer tissue, the Wnt pathway and the sclerostin domain-containing protein 1
  (SOSTDC1), which is downregulated due to epigenetic silencing, have been found to
  regulate hepcidin. Ferroportin sequesters iron in tumour cells when hepcidin levels
  rise in the tumour microenvironment. Hepcidin increases with TFR1 overexpression,
  which enhances tumour cell iron availability. Increasing iron stores helps tumour
  cells survive and grow [97]. Reproduced via Biorender from Ref. [97] with permission
