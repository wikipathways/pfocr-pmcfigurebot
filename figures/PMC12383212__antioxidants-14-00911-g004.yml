figure_title: NAD+-dependent metabolic and regulatory pathways influenced by nicotinamide
  in aging skeletal muscle.
caption: NAD+-dependent metabolic and regulatory pathways influenced by nicotinamide
  in aging skeletal muscle. Nicotinamide supports redox balance, energy metabolism,
  and gene regulation through its role in NAD+ homeostasis. NAD+ fuels dehydrogenase
  activity in key metabolic pathways, supports antioxidant regeneration via NADPH,
  and regulates sirtuin- and PARP-mediated cellular processes. Age-related NAD+ decline,
  driven by increased CD38 and reduced NAMPT levels, impairs mitochondrial function,
  increases inflammation, and reduces muscle regeneration
