figure_title: UCHL1 regulates cycling D1 through the CIP2A-mediated signaling pathway.
caption: UCHL1 regulates cycling D1 through the CIP2A-mediated signaling pathway.
  (A) Western blot analysis of MKN1 following the silencing of UCHL1. (B) Western
  blot analysis of SNU484 cells following the silencing of UCHL1. (C) Effects of the
  UCHL1 knockdown on cell cycle regulatory protein following 16 h nocodazole treatment
  in MKN1 and SNU484 cells, after which the medium was replaced with complete growth
  medium to allow a cell cycle re-entry. (D) Flow cytometric analysis of the G1 phase
  cell cycle arrest following UCHL1 knockdown in MKN1 and SNU484 cells. The error
  bar represents SD. The two-sided Student’s t-test was used for statistical analysis
  (* p < 0.05; n = 4)
