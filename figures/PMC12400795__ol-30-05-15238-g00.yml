figure_title: In the TME, lactate polarizes TAMs to the M2 phenotype through histone
  lactylation.
caption: In the TME, lactate polarizes TAMs to the M2 phenotype through histone lactylation.
  Lactate-treated Th17 cells markedly reduce IL-17A and upregulate Foxp3. The high-energy
  metabolites (such as lactate and pyruvate) produced by CAFs via aerobic glycolysis
  are translocated into adjacent epithelial cancer cells. DL can promote the transformation
  of M2 to M1 macrophages by regulating the lactylation of macrophages, specifically
  through the inhibition of the PI3K/Akt pathway and the activation of the NF-κB pathway.
  PCSK9 affect the polarization of TAMs in colon cancer by regulating MIF and lactate
  levels. Higher glycolysis, hypoxia and the Warburg effect elevate lactate levels
  and promote tumor growth, evasion and metastasis. In cancer cells, lactate produced
  from glucose and exogenous lactate is further metabolized to produce lactyl-CoA,
  which can enter and exit the nucleus. p300, as a writer of lactylations, can add
  lactyl groups to lysine residues of histones or non-histone proteins to form lactylations,
  while erasers HDAC1-3 remove lactate modification motifs from histones or non-histone
  proteins and restore them to their original state. MIF, macrophage migration inhibitory
  factor; DL, D-lactic acid; TCA cycle, tricarboxylic acid cycle; TME, tumor microenvironment;
  PDH, pyruvate dehydrogenase; LDH, lactate dehydrogenase; PCSK9, proprotein convertase
  subtilisin/kexin type 9; CAFs, cancer-associated fibroblasts; TAMs, tumor-associated
  macrophages; HDAC, histone deacetylase
