figure_title: Enrichment analysis of proteomics data from the bud and flowering stages
  of ‘Guichang’.
caption: Enrichment analysis of proteomics data from the bud and flowering stages
  of ‘Guichang’. (A) Venn diagram showing the annotation results, created using four
  different databases, with colors indicating each database. (B) A volcano plot is
  presented to show the relative abundance of differential proteins. In this plot,
  red dots stand for up-regulated proteins, while green dots denote down-regulated
  proteins. (C) KEGG enrichment analysis of up-regulated proteins, with the ratio
  reflecting the number of differential proteins in a category relative to the total
  proteins identified in that pathway. A higher ratio signifies greater enrichment
  of differential proteins. The dots’ colors represent the significance of the hypergeometric
  test, with darker colors indicating lower p-values, while the dot size corresponds
  to the number of differential proteins in each pathway. (D) KEGG enrichment analysis
  of down-regulated proteins, where the differential ratio is calculated similarly.
  The dot colors indicate statistical significance, with redder colors showing smaller
  p-values. The larger the dot is, the more differential proteins are associated with
  that pathway. (E) The Brassinosteroid biosynthesis pathway shows the highest level
  of enrichment. Genes that are up-regulated are marked in red, while those that are
  down-regulated are marked in green
