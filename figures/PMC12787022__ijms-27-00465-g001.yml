figure_title: Integrated overview of major depressive disorder burden and plant-derived
  modulation of tryptophan pathways.
caption: 'Integrated overview of major depressive disorder burden and plant-derived
  modulation of tryptophan pathways. This schematic summarizes the clinical burden
  of major depressive disorder (MDD) and highlights limitations of current selective
  serotonin (5-HT) reuptake inhibitor (SSRI) and 5-HT-norepinephrine reuptake inhibitor
  (SNRI) therapies, including delayed onset, sexual dysfunction, weight gain, hyponatremia,
  emotional blunting, and treatment resistance. Tryptophan metabolism is illustrated
  as a fork between the 5-HT pathway (promoting mood regulation and emotional balance)
  and the kynurenine (KYN) pathway (associated with inflammation, neurotoxicity, and
  melancholic features). Inflammatory cytokines such as interleukin (IL)-6 and interferon
  (IFN)-γ shift tryptophan away from 5-HT production by activating Indoleamine 2,3-dioxygenase
  (IDO), contributing to reduced 5-HT, anhedonia, low mood, and suicidality. Mechanistic
  points where plant-derived compounds may intervene are shown on the right, including
  enhancement of tryptophan hydroxylase (TPH) activity and 5-HT synthesis, inhibition
  of IDO1 activation to reduce neurotoxic KYN metabolites, and modulation of the gut
  microbiota to increase beneficial indoles and reduce inflammation. Collectively,
  these actions increase bioavailable tryptophan and 5-HTP, offering potential complementary
  strategies for improving depressive symptoms. Created using Mind the Graph (https://mindthegraph.com/,
  last accessed on 6 December 2025). Abbreviations: Trp, Tryptophan; 5-HTP, 5-Hydroxytryptophan;
  KYN, Kynurenine; QA, Quinolinic acid'
