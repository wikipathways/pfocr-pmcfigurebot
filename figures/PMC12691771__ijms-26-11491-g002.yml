figure_title: E-Cig exposure triggers oxidative stress and stress pathway response
  in the skeletal muscle.
caption: E-Cig exposure triggers oxidative stress and stress pathway response in the
  skeletal muscle. Representative Western blot images for HO-1, SOD1, and SOD2 in
  (A) skeletal muscle of mice fed HFD and exposed to saline (n = 4–5), E-Cig 0% (n
  = 9), or E-Cig 2.4% (n = 10). β-Actin is used as a loading control. Molecular weight
  markers are depicted in KDa. (B–D) Quantitation of protein levels for HO-1, SOD1,
  and SOD2 normalized to β-Actin. Representative Western blot images for (E) phospho-p38
  MAPK (p-p38). β-Actin levels are shown as a loading control. Molecular weight markers
  are depicted in KDa. (F) Quantification of the protein levels for p-p38 were normalized
  to β-Actin and expressed as the mean ± S.E.M. (fold-change relative to the control).
  * p < 0.05, ** p < 0.01
