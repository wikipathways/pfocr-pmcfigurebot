figure_title: Vitamin D non-skeletal effects in skin, gut, and cardiovascular system.
caption: Vitamin D non-skeletal effects in skin, gut, and cardiovascular system. Schematic
  illustration of the pleiotropic actions of vitamin D beyond bone and mineral metabolism.
  In the skin, vitamin D–VDR signaling strengthens the epidermal barrier by upregulating
  structural proteins (filaggrin, loricrin, involucrin) and tight junction proteins
  (claudin-1, occludin, ZO-1), while also boosting antimicrobial peptide production
  (cathelicidin, β-defensins). Immune modulation includes suppression of Th1 and Th17
  responses, reduced pro-inflammatory cytokines (IL-2, IFN-γ, IL-17, TNF-α), and increased
  Treg activity and IL-10 release. In the intestine, vitamin D enhances barrier function
  through increased tight junction proteins (claudin-1, claudin-3, claudin-15, occludin,
  ZO-1), promotes a favorable microbiota balance, stimulates the Notch pathway, and
  augments antimicrobial peptide secretion, thereby reducing dysbiosis and supporting
  mucosal immunity. In the cardiovascular system, vitamin D improves endothelial function
  by stimulating nitric oxide production and reducing oxidative stress via Nrf2. It
  limits vascular inflammation and proliferation by downregulating adhesion molecules
  (VCAM-1, MCP-1), vascular smooth muscle cell proliferation, and pro-inflammatory
  cytokines such as IL-6 and TNF-α. Additionally, vitamin D exerts anti-fibrotic and
  vascular-protective effects by improving lipid profiles (↑ HDL, ↓ LDL and triglycerides)
  and promoting anti-inflammatory macrophage polarization (IL-10, M2 phenotype). AMPs,
  antimicrobial peptides; HDL, high-density lipoprotein; IFN-γ, interferon-gamma;
  IL-2, interleukin-2; IL-6, interleukin-6; IL-10, interleukin-10; IL-17, interleukin-17;
  LDL, low-density lipoprotein; MCP-1, monocyte chemoattractant protein-1; NF-κB,
  nuclear factor kappa-light-chain-enhancer of activated B cells; NO, nitric oxide;
  Nrf2, nuclear factor erythroid 2–related factor 2; PMCA, plasma membrane Ca2+ ATPase;
  RAAS, renin–angiotensin–aldosterone system; TJs, tight junctions; TNF-α, tumor necrosis
  factor-alpha; TRPV5/6, transient receptor potential vanilloid 5/6; Treg, regulatory
  T cell; VCAM-1, vascular cell adhesion molecule-1; VDR, vitamin D receptor; VSMC,
  vascular smooth muscle cell; ZO-1, zonula occludens-1
