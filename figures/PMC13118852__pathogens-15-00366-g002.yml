figure_title: A schematic diagram illustrating the signaling (blue undashed boxes)
  and signaling crosstalks (green dashed boxes) of selected CMGC kinases.
caption: A schematic diagram illustrating the signaling (blue undashed boxes) and
  signaling crosstalks (green dashed boxes) of selected CMGC kinases. Mitogenic signals,
  stress/inflammation signals, decreases in growth factors, or motogenic signals can
  activate CDKs, p38 MAPK, GSK3Β, and DYRK1, respectively. Upon ligand-receptor interaction,
  cyclin/CDK complexes are synthesized via the RAF-ERK or AKT-mTOR pathways, which
  then trigger a cascade leading to cell cycle regulation. The activities of these
  cyclin/CDK complexes can be inhibited by the p38 MAPK pathway and promoted by DYRK
  or CAK/CDC25. In the p38 MAPK pathway, ligand-receptor interaction activates upstream
  MAP3Ks kinases either through direct phosphorylation, ubiquitination, or adaptor
  interaction. These kinases eventually activate p38 MAPKs. When activated, p38 MAPK
  promotes the activity of transcription factors that influence cell survival, apoptosis,
  or the cell cycle. p38 MAPK can also modulate cell cycle factors and DYRK activity.
  For GSK3Β, a decrease in the AKT/p70S6K/LRP/Disheveled complex releases GSK3Β in
  its active form, which then activates factors that induce cell death, survival,
  or inhibit specific cellular processes. This kinase can also directly induce the
  degradation of certain cyclins. Upon ligand-receptor binding, DYRK1 is activated,
  promoting the activation of specific cell cycle inhibitors. DYRK1 can also phosphorylate
  and inhibit NFAT, a GSK3Β substrate. This diagram highlights the potential crosstalk
  among CMGC kinases or their substrates, emphasizing CMGCs’ functional overlap (Created
  in BioRender. Amusan, O.T. and Guo, H. (2026) https://app.biorender.com/illustrations/6923c9e8b5b50dbc7ee5f618,
  accessed 12 January 2026)
