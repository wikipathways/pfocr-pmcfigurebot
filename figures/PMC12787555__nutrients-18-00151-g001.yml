caption: Overview of the physiological mechanisms through which beetroot juice (BRJ)
  influences nitric oxide availability, vascular function, and skeletal muscle energetics.
  (a) Entero-salivary nitrate reduction and hypoxic/acidic conversion of NO3− → NO2−
  → NO, involving deoxygenated Hb/Mb, XOR, and mitochondrial pathways. (b) Endothelial
  NO signaling through the sGC–cGMP–PKG pathway promotes vasodilation, blood flow
  regulation, and improved vascular function. (c) NO effects on skeletal muscle energetics,
  including enhanced mitochondrial efficiency, faster PCr resynthesis, lower ATP cost,
  and modulation of Ca2+ handling via RyR and SERCA. ↑ and ↓ indicate increases and
  decreases, respectively. The red cross denotes NO-mediated inhibition or competition
  of oxygen binding at cytochrome c oxidase (Complex IV)
