figure_title: The role of wild-type IDH1 in GBM cells.
caption: The role of wild-type IDH1 in GBM cells. In glioblastoma cells with wild-type
  IDH1, hypoxic conditions shift IDH1 activity from oxidative decarboxylation toward
  reductive carboxylation, using NADPH to convert α-ketoglutarate (α-KG) into isocitrate
  and citrate (red arrows). This metabolic rewiring supports lipid synthesis and tumor
  adaptation to hypoxia, while increased NADPH consumption may reduce redox buffering
  capacity. The α-KG produced or recycled through transamination of glutamate can
  also feed the mitochondrial TCA cycle, supporting anabolic growth and cell invasion
  (the dashed arrows show a pathway that is less strongly activated). Hypoxia also
  suppresses prolyl hydroxylase (PHD) activity, stabilizing HIF-α, which translocates
  to the nucleus and dimerizes with aryl hydrocarbon nuclear receptor translocator
  (ARNT), binding hypoxia response elements (HREs) to activate genes promoting angiogenesis,
  glycolysis, and survival. In parallel, hypoxic accumulation of PHD3 can lead to
  TRiC/CCT–PHD3–vimentin complex formation around the perinuclear region, contributing
  to cytoskeletal remodeling and enhanced tumor invasiveness through TRiC/CCT–pVHL
  chaperone interactions. Created in BioRender. Caruso Bavisotto, C. (2025) https://BioRender.com/eshcd2
article_title: 'The TRiC/CCT Complex at the Crossroads of Metabolism and Hypoxia in
  GBM: Implications for IDH-Dependent Therapeutic Targeting'
