caption: Pathway intersection. The network of signaling pathways associated with miRNAs
  which were significantly different in nicotine-treated DPSCs compared to controls.
  The diagram was generated using the PathIN tool and cytoscape. Unweighted edges
  refer to common genes between two pathways. The pathways showing the most abundant
  interactions are highlighted in different colors (red, yellow, black, blue, and
  green). The less abundant interactions are shown with dashed white lines
