figure_title: Slc25a39 is necessary for the establishment of the PMA state under glutamine
  limitations via feedback regulation of Nrf2
caption: '(A) Heatmap displaying gene expression profiles (k-means clustering) of
  cells under four conditions: control in +Q media (Control, +Q), control in −Q media
  (Control, −Q), Slc25a39 siRNA knockdown in +Q media (si_Slc25a39, +Q), and Slc25a39
  siRNA knockdown in −Q media (si_Slc25a39, −Q). (B) Top pathways upregulated in glutamine-free
  Slc25a39 siRNA knockdown (−QKD) compared to control, identified using the TRRUST
  library via Enrichr-KG analysis. (C) Top pathways upregulated in −QKD compared to
  control, identified using the KEGG 2021 library via Enrichr-KG analysis.(D) qRT-PCR
  validation of Slc25a39, Slc7a11, and Nfe2l2 mRNA expression levels in cells cultured
  in +Q or −Q media, with or without Slc25a39 siRNA knockdown. Data represent mean
  ± SD from n = 3 independent experiments. Statistical significance was determined
  using Student’s t-test. (E) Immunofluorescence microscopy images of WT C2C12 cells
  and inducible SLC25A39 overexpression cells (iSLC25A39) cultured in +Q media, treated
  with antimycin A or Veh (DMSO). Nrf2 nuclear localization was assessed. Scale bar
  = 20 μm. (F) Quantification of Nrf2 nuclear localization. Data represent mean ±
  SD from n = 5 fields per condition. Statistical significance was determined using
  Student’s t-test. (G) Cluster plot analysis comparing −Q to +Q conditions (left)
  and −QKD to −Q conditions (right), highlighting differentially expressed genes and
  pathway enrichments.Statistical significance is indicated as p< 0.05 and P<0.05(#),
  determined by Student’s t-test. Data are presented as mean ± S.D'
