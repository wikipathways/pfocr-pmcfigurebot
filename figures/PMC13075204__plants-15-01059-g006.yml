figure_title: Regulatory networks of BTB proteins orchestrating plant growth and development.
caption: 'Regulatory networks of BTB proteins orchestrating plant growth and development.
  (A) Seed germination and flowering time: ABA signaling induces AHT1, which negatively
  feeds back by degrading ABI5, while BTB-A2s degrade SnRK2.3 to fine-tune germination.
  For flowering, BPM1 degrades the repressor MYB56, relieving the repression of FT;
  The CRL3-LRB1/2 complex degrades FRIGIDA (FRI), thereby reducing FLC expression.
  (B) Shaping plant architecture and organogenesis: In chrysanthemum, CmBT1 inhibit
  root growth by degrading CmANR1, thereby downregulating CmPIN2. In apple, MdBT2
  inhibits adventitious rooting by degrading MdARF8 and stabilizing MdIAA3. In Arabidopsis,
  ABAP1 negatively regulates DNA replication and leaf development by blocking pre-RC
  assembly (AtORC1a, AtCDT1a/b) via interaction with AtTCP24. (C) Fruit yield, quality,
  and defense: In apple, MdBT2 functions as a dual-modulator: it degrades MdMYB73
  to reduce fruit acidity, and degrades MdTCP46 to regulate anthocyanin synthesis
  via MdMYB1. MdPOB1 negatively regulates disease resistance by degrading MdPUB29,
  which suppresses SA signaling and ROS accumulation. In tomato, SlBTA2 promotes cuticle
  formation by degrading the repressor SlMYB41, thereby relieving the repression of
  cutin and wax biosynthesis genes. (D) Integration of diverse signaling pathways:
  ETO1 targets ACS5 to control ethylene biosynthesis. AtLRB3 is involved in NO signaling
  by modulating photomorphogenesis regulators. MdBT2 integrates GA and nitrogen signaling
  by degrading the DELLA protein MdRGL3a to promote plant growth. Solid lines indicate
  positive regulation/activation; T-bars indicate negative regulation/inhibition;
  “U” and “26S” denote ubiquitin-proteasome system mediated degradation. This schematic
  represents a proposed working model synthesized from established literature. This
  figure was drawn using Microsoft PowerPoint'
