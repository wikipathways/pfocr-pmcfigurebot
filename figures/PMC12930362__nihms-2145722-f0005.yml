figure_title: LD’s impair confined migration and confinement spaces can induce nuclear
  rupture
caption: |-
  A. Macrophage 3D migration is impacted by LD presence. i)
  Schematic: Transwell migration assays were used to quantify both migration efficiency and nuclear rupture events in THP-1 macrophages. Confocal z-slices of densely plated+LD macrophages on Tops and cells migrated to Bottoms of Transwell filters after 48 hours. ii). After 48-hour migration, LD’s or bead-preloaded macrophages show reduced migration through non-constricting 8 μm pores. (N=4, n>100 total cells/condition, square: bead loading, circle: LD loading).B. Rigid cytosolic objects can deform the nucleus and impede cellular migration by narrowing the effective migration pathway. i) Both rigid beads (top) and LD’s (bottom) can deform the nuclei of cells undergoing pore migration. ii) Cartoon illustrating the nuclear deformation, and subsequently the smaller effective diameter, experienced by a cell nucleus caused by a LD in a migration pore. iii) Confocal z-slices of a nucleus as it enters a pore show that multiple LD’s can cooperatively squeeze a migrating nucleus to limit movement. C. In confined microenvironments, presence of LD’s increases macrophage nuclear rupture frequency. i)
  Schematic: Micropillar system imposed 3 μm height confinement upon macrophages to assess nuclear rupture events via nuclear accumulation of mcherry-cGAS. Confocal z-slices of live THP-1 macrophages expressing mcherry cGAS showing LD-driven nuclear rupture by accumulation of mcherry-cGAS foci at the nuclear membrane next to LDs ii) Categorization of nuclear rupture location (top, bottom, side) in LD-loaded and control macrophages after 30 mins of confinement. (N=3, n≥15 total ruptures/condition). iii) Introduction of confinement enhances nuclear rupture events in LD-loaded cells. After ~30 min, +LD cells exhibit twice as many nuclear rupture events relative to control cells and a 2.5-fold higher change in non-confining rupture levels. After 120 mins, LD-loaded cells show significantly higher nuclear rupture than control cells. The introduction of Lat-A (red) eliminates confinement-driven rupture events and reduces overall rupture. Dotted lines illustrate the best linear fits to control conditions. Middle plot illustrates that adjusting for control conditions, LD’s cause additional rupture immediately after introduction of confinement that are independent of actin depolymerization. Kinetics of LD-driven nuclear rupture are captured by the equation y=A+B(1−et∕τ) with A=2, B=6, τ=20. (N>2 per condition, n>200 total cells/condition, p<0.05, unpaired t-test). Images show that rupture is less frequent following the addition of Lat-A prior to confinement of control cells for 2 hours
