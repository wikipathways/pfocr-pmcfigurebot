figure_title: Transcriptomic and pathway analysis of differentially expressed genes
  (DEGs) in bile duct tumors from the TCGA and GSE63420 dataset.
caption: Transcriptomic and pathway analysis of differentially expressed genes (DEGs)
  in bile duct tumors from the TCGA and GSE63420 dataset. (A)The UpSet plot illustrates
  the intersection of significantly enriched KEGG pathways derived from the differentially
  expressed genes (DEGs) in bile duct tumors. Each box plot represents the distribution
  of gene expression fold changes for genes involved in a specific pathway such as
  those in chemical carcinogenesis, cytoskeleton organization, motor proteins, and
  cholesterol metabolism. (B) Dot plot of KEGG pathway enrichment analysis, where
  the x-axis represents the gene ratio, the size of the bubbles indicates the number
  of genes involved, and the color gradient represents the adjusted p-value. (C) Volcano
  plot illustrating the distribution of DEGs, with significantly upregulated genes
  shown in red, downregulated genes in blue, and non-significant genes in gray. Key
  DEGs, including TUBB3, FLNC, MAP2K1, and ABCA1, are highlighted due to their involvement
  in enriched pathways related to bile duct tumorigenesis. (D) KEGG gene–pathway network
  centered on ABCA1, TUBB3, FLNC, and MAP2K1, linking these genes to cholesterol metabolism/ABC
  transporters, gap junctions, cytoskeletal regulation, and MAPK signaling; gray nodes
  denote genes and yellow nodes denote enriched KEGG pathways. (E) Reactome gene–pathway
  network for the same four genes, connecting ABCA1 to HDL assembly and lipid efflux,
  MAP2K1 to the RAF/MAPK cascade, TUBB3 to gap-junction/connexin trafficking and microtubule
  processes, and FLNC to L1CAM interactions and actin cytoskeleton organization; gray
  nodes denote genes and yellow nodes denote enriched Reactome pathways
