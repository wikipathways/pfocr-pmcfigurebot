figure_title: IGF1–IGF1R signaling activates ERK and Akt pathways and promotes forebrain
  neural progenitor proliferation through PI3K–AKT–mTOR and MEK/ERK cascades
caption: (A-C) Western blot analysis shows that IGF1 rapidly and robustly induces
  ERK phosphorylation within 10 minutes, sustained up to 60 minutes. Total ERK levels
  remain stable.(D-F) IGF1 stimulation also induces Akt phosphorylation, peaking between
  10–60 minutes, while total Akt levels modestly decline.(G-I) IGF1 enhances phosphorylation
  of S6, a downstream mTORC1 target, with peak activation at 30–60 minutes and stable
  total S6 levels.(J-P) BrdU incorporation assays combined with pathway-specific inhibitors
  demonstrate that PI3K, AKT, and mTOR pathways are essential for IGF1-driven proliferation.
  MEK/ERK inhibition partially reduces proliferation, indicating a secondary but supportive
  role
article_title: Spatially Organized IGF1–mTOR Signaling Controls Human Forebrain Progenitor
  F ate Through Coordinated Transcriptional and Translational Programs
