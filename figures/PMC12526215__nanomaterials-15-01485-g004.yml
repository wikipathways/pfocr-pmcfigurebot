figure_title: Bio-inspired design strategies for photocatalytic nitrogen fixation
  materials based on nitrogenase mimics.
caption: Bio-inspired design strategies for photocatalytic nitrogen fixation materials
  based on nitrogenase mimics. (a) Construction of single-site heterojunctions via
  Ru-anchored Mo-based MOFs enables precise energy band engineering. The coupling
  of Ru doping and Mo5+ defect states leads to enhanced light absorption and spatial
  charge separation, significantly boosting N2 activation. Reproduced with permission
  [55]. Copyright © 2022 American Chemical Society. (b) A nanozyme system mimicking
  plant–rhizobia symbiosis, constructed via confined CeOx clusters anchored on Mn3O4
  nanorods, achieves lattice interlacing and directional electron transfer (Mn2+→Ce4+),
  facilitating ROS scavenging and creating a protective redox microenvironment. Reproduced
  with permission [56]. Copyright © 2025 Wiley-VCH. (c) Schematic design of a nitrogenase-inspired
  photoelectrode based on Mo1/HsGDY@Cu2O, integrating defect-rich Mo sites with highly
  conjugated graphdiyne to form synergistic active centers for efficient solar-driven
  PEC-NRR. Reproduced with permission [57]. Copyright © 2025 American Chemical Society.
  (d) Rational assembly of UiO-66(Zr-Fe)/Fe-decorated MXene simulates the nitrogenase
  multi-site tandem pathway, with respective roles in photothermal conversion, electron
  transport, and N2 fixation. A high NH3 yield is achieved under solar irradiation
  in a gas–vapor–solid triphasic system. Reproduced with permission [58]. Copyright
  © 2024 Elsevier
