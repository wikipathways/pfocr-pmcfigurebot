figure_title: Fucosylation pathways
caption: 'a, Free l-fucose (LF; red triangle), derived from exogenous (dietary) uptake
  or endogenous (recycled glycoprotein) sources, enters cells primarily via GLUT1-mediated
  transport or macropinocytosis. Intracellular LF can be salvaged through phosphorylation
  by fucokinase (FUK) and activation by guanosine diphosphate (GDP)-fucose pyrophosphorylase
  (GFPP) to generate GDP-fucose. Alternatively, GDP-fucose can be synthesized de novo
  from GDP-mannose (green oval and circle) via the sequential action of GDP-mannose
  4,6-dehydratase (GMD) and GDP-4-keto-6-deoxymannose 3,5-epimerase-4-reductase (FX).
  GDP-fucose is transported into the endoplasmic reticulum (ER) and Golgi apparatus
  via solute carrier family 35 member C1 (SLC35C1) and SLC35C2 transporters, where
  it serves as the fucose donor for protein fucosylation. In the ER, fucosylation
  is mediated by protein O-fucosyltransferase 1 (POFUT1) and POFUT2, which modify
  epidermal growth factor (EGF) repeats and thrombospondin type I repeats (TSRs),
  respectively. In addition, FUT10 and FUT11 have recently been found to mediate fucosylation
  in the ER as well. In the Golgi, fucosylation of N-glycans is catalysed by a family
  of fucosyltransferases (FUT1–FUT11), each with distinct glycan linkage specificities,
  whereas FUT8 mediates core fucosylation of N-glycans. Conjugated fucosylated proteins
  may be secreted, recycled or presented on the cell surface, where they participate
  in diverse biological processes. b, Fucose can be conjugated into glycan branched
  structures in different orientations: α1–2, α1–3, α1–4 and α1–6, wherein fucose
  will be conjugated to N-acetylglucosamine (GlcNAc; blue square) or galactose (yellow
  circle) at core or terminal positions along the N-glycan or O-glycan oligosaccharide
  by the action of FUTs. N-Glycans are covalently attached to peptides at asparagine
  (N) residues, whereas O-glycans modify peptides by attaching to serine or threonine
  (S/T) residues, starting with a GlcNAcβ1-N linkage and subsequent monosaccharide
  addition. Additionally, fucose can be directly conjugated onto S/T residues by POFUT
  enzymes: in EGF-like repeats by POFUT1, in TSRs by POFUT2, and to the N terminus
  of elastin microfibril interface (EMI) domains by POFUT3 and POFUT4. FUCA, α-l-fucosidase;
  Neu5Ac, N-acetylneuraminic acid. Part b is adapted from ref. 153 under a Creative
  Commons licence CC BY 4.0'
