caption: (A) Complex Role of Zinc Signaling in Cellular Processes and Associated Pathways.
  Zn²⁺ as an intracellular second messenger mediates inflammatory signaling and immune
  homeostasis by activating downstream pathways via EZS and LZS, whose conductance
  is dependent on the ZnT, ZIP family, and MT modulation, and which play key roles
  in cellular communication and signaling. Zn²⁺ as an intracellular second messenger
  activates downstream pathways via EZS and LZS and plays a critical role in cellular
  communication and signaling. (B) Mechanism of zinc ion-induced apoptosis and pyroptosis
  in tumor cells. Activation of the caspase pathway through mitochondrial damage triggers
  apoptosis, while activation of inflammatory vesicles cleaves Gasdermin proteins
  to induce pyroptosis, both of which synergistically release inflammatory factors
  to enhance anti-tumor immunity. (A) Reproduced with permission from 29, copyright
  2025, Springer Nature Limited. (B) Reproduced with permission from 47, copyright
  2024, Chinese Chemical Society
