figure_title: RNA sequencing in bulk cerebellar preparations reveals marked upregulation
  of immune modulating pathways, pro-apoptotic and pro-inflammatory genes
caption: A) RNA-seq gene ontology dot plot of top 20 upregulated pathways. The size
  of the circle represents the count numbers for the pathway of interest, the pseudo
  color coding for the adjusted p-values represents significance of change in a given
  pathway with red color denoting a p-value closer to 0. Note the marked upregulation
  pathways responsible for mounting an immune response. B) Volcano plot of upregulated
  and downregulated differentially expressed genes (u/dDEG). Data points in light
  blue and light red represent identified DEGs before FDR correction, while dark blue
  and dark red data points outlined in black represent FDR-corrected DEGs. 1.3 on
  the y-axis represents the −log10 of p=0.05 for the uncorrected p-values. PN60 WT
  and Slc39a14-KO males were used for RNA extractions (WT n=3; KO n=3). Log2 Fold
  Change was set at 1. Data were sequenced and analyzed by NovoGene, GraphPad Prism
  10.4.1 was used to visualize the data
