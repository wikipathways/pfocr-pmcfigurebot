figure_title: Loss of Lsm1 induces global transcriptional imbalance in C.
caption: Loss of Lsm1 induces global transcriptional imbalance in C. albicans. (A)
  GO enrichment analysis showing significant enrichment of mitochondrion-associated
  pathways. (B) KEGG pathway analysis of differentially expressed genes in lsm1Δ/Δ
  relative to wild type. (C) Volcano map of differentially expressed genes. Statistical
  significance was evaluated using adjusted p-values calculated by the Benjamini–Hochberg
  false discovery rate (FDR) correction. The x-axis represents log2 (fold change)
  in gene expression between the two groups, and the y-axis represents −log10 (FDR).
  Red dots indicate significantly upregulated genes, and blue dots indicate significantly
  downregulated genes. The horizontal dashed line indicates the significance threshold
  (FDR < 0.05), and the two vertical dashed lines represent log2(fold change) = 1
  and −1
