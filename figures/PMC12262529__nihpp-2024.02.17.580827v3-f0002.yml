figure_title: Exploration of the complete PPI network shows strong intra- and inter-
  pathway cluster of interactions
caption: (A) A total of 35 proteins from the three different pathways were cloned
  as both N-terminal and C-terminal YFP fusions and interaction of every protein with
  every other protein (including itself which indicates homodimer probability) was
  probed using the split-YFP system. The matrix was color coded based on the mean
  YFP fluorescence of the pair. The interaction was evaluated in both formats (NYFP-A/CYFP-B
  and NYFP-B/CYFP-A) and the maximum fluorescence data for each pair was used to generate
  this matrix. Red boxes indicate MFI > 1100, yellow for 900 < MFI < 1100, blue for
  750 < MFI < 900 while white boxes indicate MFI < 750. Titration of inducer levels
  (arabinose and IPTG) to test dependence of fluorescence values on intracellular
  protein expression for (B) purD-purT (C) folA-tmk and (D) folA-metF pairs. As expected,
  higher inducer concentration leads to more complex formation and stronger YFP fluorescence.
  Data is presented as mean of n=2 independent biological replicates, and the error
  bars indicate standard deviation (s.d.) (E) While there is no significant clustering
  for all 11 proteins in the folate pathway (n=55 pairs of interactions), a set of
  5 proteins (n=10 PPI pairs for FolK, FolA, GlyA, FolD and MetF) show strong clustering.
  Similarly, a set of 5 proteins in the purine biosynthesis pathway (PurK, PurD, PurM,
  PurD, PurN) show cluster formation (n=9 PPI pairs). While no statistically significant
  clustering is observed among pyrimidine biosynthesis pathway proteins, there is
  strong evidence of inter-pathway interaction among selected folate and purine biosynthesis
  enzymes. For each cluster, the red data point represents the median MFI value of
  the cluster, while the box represents a null distribution of the median values of
  an equal number of interaction pairs (as the cluster size) randomly picked 10,000
  times from the matrix. The box represents the middle 50% of the data and line in
  between represents the median of the distribution. The whiskers represent the 5–95
  percentile interval. Statistical significance and p-value are calculated as described
  in Methods, *** indicates p-value < 0.001, ** indicates p-value < 0.01. No data
  normality is assumed. (F) A pictorial graph representation of the strongest interactions.
  Corners represent protein identity while edges represent strong interaction
