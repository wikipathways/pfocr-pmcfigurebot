figure_title: Induction of adipocyte Fam20c elicits a proinflammatory gene expression
  signature
caption: (A) Schematic of viral transduction of primary differentiated adipocytes
  with respective constructs. (B) Relative mRNA expression of proinflammatory genes
  in primary adipocytes transduced with respective viral constructs (n = 4 per group).
  (C) Heatmap of DEGs in primary adipocytes transduced with respective viral constructs
  (n = 4 per group). (D) Hallmark pathway analysis of top DEGs between Fam20c WT and
  Fam20c D473A (kinase-dead mutant) groups. (E) Representative Western blot images
  and (F) quantification of insulin-mediated p-AKT S473 induction in primary adipocytes
  transduced with respective viral constructs and stimulated with either PBS or insulin
  (10 nM for 10 minutes) (n = 4 per group). Three independent experiments were performed.
  (G) Heatmap of DEGs in primary differentiated adipocytes from control and Ad-Fam20c–KO
  mice (n = 4 per group). (H) Hallmark pathway analysis of DEGs between primary differentiated
  adipocytes from control and Ad-Fam20c–KO mice. NES, normalized enrichment score.
  (I) Upstream analysis showing top activated and inactivated pathways and (J) upstream
  cytokine pathways based on DEGs in primary differentiated adipocytes from control
  and Ad-Fam20c–KO mice. An activation z score of ≥2 was used as the cutoff. *P <
  0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001; 2-way ANOVA followed by Bonferroni’s
  multiple-comparison test for B and 1-way ANOVA for F. Data are shown as the mean
  ± SEM
article_title: Secretory kinase FAM20C triggers adipocyte dysfunction, inciting insulin
  resistance and inflammation in obesity
