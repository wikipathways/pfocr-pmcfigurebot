figure_title: Targetable pathways in malignant peripheral nerve sheath tumors (MPNSTs).
caption: Targetable pathways in malignant peripheral nerve sheath tumors (MPNSTs).
  Due to common mutations in NF1, CDKN2A (INK4A, ARF), TP53 (p53), SUZ12, and EED,
  several interrelated pathways have altered activity in MPNSTs. The RAS-related RAF/MEK/ERK
  and PI3K/AKT/mTOR pathways as well as the CDK4/6 pathway. Epigenetic regulation
  through PRC2 is also dysregulated. Commonly mutated proteins are depicted in pink,
  with consequently activated pathways shown in green, and decrease in inactive states
  of proteins shown in red. Potential therapeutic inhibitors are identified in red
  font
