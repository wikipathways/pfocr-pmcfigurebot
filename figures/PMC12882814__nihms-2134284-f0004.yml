figure_title: Tregs reversibly suppress antitumor functions of CCR7+ DCs at perivascular
  niches
caption: (A) (Left) Scheme outlining the experimental setup for bulk RNA-seq analyses
  of tumor-derived CCR7+ DCs. (Right) GO pathway enrichment analyses performed on
  differentially expressed genes (DEGs) in CCR7+ DCs in MC38 tumors (n = 4) from Treg-depleted
  (FoxP3-DTR) compared with Treg-sufficient (WT) mice. Bar plot indicates the −log10
  raw binomial p-values of the top 10 most enriched pathways in CCR7+ DCs.(B) (Left)
  Experimental setup for ex vivo stimulation of OT-I CD8+ T cells with tumor CCR7+
  DCs. (Right) Percentage of OT-I CD8+ T cells that proliferated after 5-day culture
  with OVA257–264 peptides-loaded CCR7+ DCs isolated from WT or Treg-depleted tumors.
  As a control, CCR7+ DCs without OVA257–264 peptides were used. Two-way ANOVA with
  multiple comparisons, whiskers represent min to max; **p < 0.01.(C) (Left) Relative
  gene expression levels analyzed by bulk RNA-seq. Each dot represents one mouse (n
  = 4), whiskers represent mean to max. Unpaired t test with multiple comparisons;
  *p < 0.05. (Right) Representative histogram of CD40 protein expression and relative
  mean fluorescence intensity (MFI) measured by FACS and expressed both as normalized
  values and absolute MFI. Each dot represents one mouse (n = 18), whiskers represent
  min to max. Unpaired t test; **p < 0.01.(D) Analyses of cDCs in tumor-draining lymph
  nodes. Absolute cell counts (left, n = 10) and MFI of CD40 expression (right, n
  = 18) measured by FACS in migratory cDCs (CCR7+CD8α−) from WT or Treg-depleted mice.
  Whiskers represent mean to max.(E) (Left) Experimental setup for ex vivo analyses
  of tumor CCR7+ DCs isolated from anti-PD-1-treated mice that received or not αCD25NIB
  mAbs. (Right) CD40 protein expression measured by FACS and expressed both as normalized
  values and absolute MFI. Each dot represents one mouse (n = 4 WT and n = 6 FoxP3-DTR),
  whiskers represent min to max. Unpaired t test; **p < 0.01.(F) (Left) Overall survival
  analyses of MC38 tumor-bearing mice treated, or not treated, with αPD-1 and αCD25NIB
  mAbs, and in which CD4+ or CD8+ cells were depleted or not (n = 8 or 9 mice/group).
  Log-rank Mantel-Cox test; *p < 0.05, ***p < 0.001, and ***p < 0.0001. (Right) Percentage
  of tumor-free mice on day 60 in the indicated treatment groups.(G) (Left) Experimental
  setup for ex vivo stimulation of OT-I CD8+ T cells with tumor CCR7+ DCs as in (B).
  The DCs were obtained from mice receiving anti-PD-1 immunotherapy and that were
  treated or not with αCD25NIB mAbs. (Right) Percentage of OT-I CD8+ T cells that
  proliferated after 5-day culture with OVA257–264 peptide-loaded CCR7+ DCs. Each
  dot represents one mouse (n = 8 and n = 7), whiskers represent min to max. Two-way
  ANOVA with multiple comparisons; *p < 0.05.(H) (Left) Scheme outlining bone marrow
  chimeras with inducible Cd40-deficiency in cDCs and the treatment schedule. (Right)
  Growth curves of MC38 tumors inoculated in zDCiDTR:Cd40WT and zDCiDTR:Cd40KO bone
  marrow chimeras treated with αPD-1, αCD25NIB, or αPD-1 + αCD25NIB combination (n
  = 8–10 mice/group). Mean with SEM. Two-way ANOVA with multiple comparisons; *p <
  0.05 and ****p < 0.0001.See also Figures S7 and S8
article_title: Positioning and reversible suppression of CCR7+ dendritic cells in
  perivascular tumor niches shape cancer immunity
