figure_title: Enrichment of immune cells in the STICs harboring BRCA1/2 germline mutations
caption: '(A) Volcano plot showing differentially expressed genes in germline (g)-BRCA1/2mut
  mutation STICs, compared to the g-BRCA1/2wildtype STICs. (B) Pathway analysis based
  on the differentially expressed genes from (A). (C) Percentages of STICs show enriched
  stromal lymphocytes. (D) CD45 cell density per mm2 in pathologist-defined lymphocyte-enriched
  versus non-enriched stroma (left); smoothed density plot displaying the distribution
  of CD45+ cell densities across all regions (middle); representative CD45+ cells
  with automated segmentation overlays from an enriched region and a non-enriched
  region (right panels). (E) Representative STIC lesions illustrate stromal lymphocyte
  density: non-enriched in a g-BRCA1/2wildtype sample (left) versus enriched infiltrate
  in a g-BRCA1mut sample (right)'
