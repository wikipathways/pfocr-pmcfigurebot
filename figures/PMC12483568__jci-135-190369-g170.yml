figure_title: Inflammation is prominent and precedes calcific mineral deposits
caption: '(A) Venn diagram of RNA-Seq results from dermal tissues treated with vehicle
  p.o. + H2O s.c., DHT p.o. + H2O s.c., vehicle p.o. + FeCl3 s.c., and DHT p.o. +
  FeCl3 s.c. (n = 3 animals per group). (B) Top 5 Kyoto Encyclopedia of Genes and
  Genomes (KEGG) pathways associated with differentially expressed genes (DEGs) between
  DHT p.o. + FeCl3 s.c. and vehicle p.o. + H2O s.c. (n = 3 animals per group). (C)
  Enrichment score of the IL-17 signaling pathway and the top 16 leading-edge genes
  in DHT p.o. + FeCl3 s.c. versus vehicle p.o. + H2O s.c. analyzed by gene set enrichment
  analysis (GSEA). (D) Immunofluorescent staining of CD45 and CD68 in calcified skin
  regions reveals the presence of CD45 and CD68 (red, arrowheads) localized within
  the calcified areas (red, arrowheads, CD45/CD68; green, HA,hydroxyapatite) (representative
  images). Quantification of CD45+ cells and CD68+ cells revealed a robust increase
  in macrophage infiltration in the DHT+FeCl3 group (n = 5 animals per group). Scale
  bars: 100 μm. (E) Representative immunofluorescent staining image of CD64 in calcified
  skin reveals CD64+ cells (red, arrowheads) localized within hydroxyapatite-rich
  (HA-rich) calcified regions (green) (n = 4 animals). Scale bars: 50 μm. (F) Time-course
  histological and immunofluorescent staining of CD45 at 30, 48, 72, and 96 hours
  in DHT-treated rats injected with FeCl3 (n = 6 animals per group). Scale bars: 100
  μm. (G) Temporal analysis of von Kossa–positive and CD45-positive cells in rat skin.
  Data are represented as mean ± SEM. ****P < 0.0001, 2-tailed Student’s t test'
