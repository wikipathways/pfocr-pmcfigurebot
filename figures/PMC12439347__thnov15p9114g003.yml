figure_title: KIF13B deficiency exacerbates the enrichment of pro-inflammatory macrophages
  in AAA.
caption: KIF13B deficiency exacerbates the enrichment of pro-inflammatory macrophages
  in AAA. (A) Schematic of the single-cell sequencing experimental design. Aortic
  tissues from PPE-treated WT (n = 10) and Kif13b-/- (n = 9) mice were pooled into
  a single sample for sequencing. (B) Uniform Manifold Approximation and Projection
  (UMAP) plot depicting nine distinct cell clusters in AAA tissues, color-coded by
  cell type. (C) Proportional distribution of all cell types in each experimental
  group. (D) UMAP plot highlighting five macrophage subpopulations, color-labeled
  for differentiation. (E) Pseudotime analysis illustrating the differentiation trajectories
  of macrophage clusters shown in D. (F) Proportional distribution of macrophage subpopulations
  in each group. (G) Gene Set Variation Analysis (GSVA) of pro-inflammatory and anti-inflammatory
  gene signatures in each group. (H) Gene Set Enrichment Analysis (GSEA) of differentially
  expressed genes (DEGs) from D, using Hallmark and Reactome pathway databases. Pathways
  with a normalized enrichment score (NES) > 1.5 and P < 0.05 were considered significantly
  enriched
