figure_title: CD4/CD8–p56lck-initiated downstream events.
caption: 'CD4/CD8–p56lck-initiated downstream events. Upon phospho-activation of ZAP-70,
  it phosphorylates LAT, allowing the recruitment of PLC-g1, GRB-2 and GADS branching
  in the TCR SP. ZAP-70 activity can be limited by RASAL1. TCR triggering modulates
  the RAS pathway, intracellular Ca2+ signaling, cell adhesion through ADAP-SKAP-1
  and the AKT-GSK-3 axis. PIP2: phosphatidylinositol-4, 5-bisphosphate, PIP3: phosphatidylinositol-3,
  4, 5-triphosphate, DAG: diacylglycerol, ER: endoplasmic reticulum, IP3R: IP3 receptor'
