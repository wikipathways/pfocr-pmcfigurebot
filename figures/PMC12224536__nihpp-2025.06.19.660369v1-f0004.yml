figure_title: Estrogens may play a greater role than androgens in shaping MERS-CoV
  outcomes
caption: 'Male (N = 2–4) and female (N = 2–4) mice were either mock-infected or infected
  with a lethal dose of 105 median TCID50 or a lower, tolerance-simulating dose of
  102 TCID50. On days 1–5 post-infection, RNA samples were collected from the lung
  and subjected to RNA-sequencing, data processing and differential expression (DE)
  analysis. DE genes (p < 0.05, log2FC > |1.5|) were uploaded to Ingenuity Pathway
  Analysis (IPA) for upstream sex hormone steroid and receptor analysis (A) and custom
  network mapping (B-E). The impact of estrogen and testosterone activity (middle)
  on antiviral interferon α/β and ISGylation DE molecules (left) were compared against
  pro-viral calcium signaling DE molecules (right). The IPA Overlay tool was used
  to visualize expression: red colouring denoted experimentally determined upregulation,
  while orange and blue represented predicted up or downregulation, respectively.
  Colour brightness indicated degree of enrichment. IPA upstream analyzes were performed
  using p < 0.01 and a Z-score ≥ |2| significance criteria. 2–4 male or female hDPP4
  mice were used per time point per dose group'
article_title: Sex bias determines MERS-CoV infection outcomes in a mouse model of
