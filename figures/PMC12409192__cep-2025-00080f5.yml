figure_title: Toll-like receptor 4 (TLR-4) pathway evaluation.
caption: 'Toll-like receptor 4 (TLR-4) pathway evaluation. (A) NF-κB-p65 levels in
  testicular tissue. (B) TLR- 4 levels in testicular tissue. The rats were divided
  into six groups and subjected to a sham operation or testicular torsion-detorsion
  (T/D) and received vehicle or linezolid (6, 12, 25, or 50 mg/kg). Data are expressed
  as mean±standard deviation. N=6 rats for each measurement in each group. #, ##,
  ###, and #### indicate P<0.05, 0.01, 0.001, and 0.0001, respectively, compared to
  the Sham group, while *, **, and *** denote P<0.05, 0.01, and 0.001 compared to
  the T/D+vehicle group. The statistical analysis was performed using 1-way analysis
  of variance followed by Dunnett multiple comparisons post hoc test. NF-κB, nuclear
  factor kappa B'
