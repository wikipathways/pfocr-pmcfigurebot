figure_title: Minor galactose supplementation protects against early-stage alcohol-related
  liver disease (ALD) by attenuating hepatic DNL overactivation
caption: '(A - Q) Male C57BL/6J mice were fed a Lieber-DeCarli liquid diet for 4 weeks.
  Mice in the alcohol-fed (AF) group underwent a 1-week ethanol adaptation phase (0–10%),
  followed by 3 weeks of stepwise ethanol feeding: 26% in week 2, 28% in week 3, and
  30% in week 4. In the galactose-supplemented alcohol-fed (Gal/AF) group, 2% of maltose
  dextrin in the alcohol diet was replaced with galactose to achieve isocaloric substitution.
  (A) Liver weight. (B) Liver-to-body weight ratio. (C) Hepatic TAG content. (D) H&E
  staining. (E) Hepatic ALT levels. (F & I) GFPT1 protein. (G & J) O-GlcNAcylation.
  (H & K) N-linked glycosylation. (L) Protein abundance of phosphorylated and total
  S6 was detected by Western blot with quantification. (M) SREBP-1c protein. The same
  loading control (actin) was used for Figs. 9I, 9J, and 9M as they were from the
  same Western blot membrane. (N) DNL-related gene mRNA levels. (O) Plasma TAG content.
  (P) Plasma glycerol levels. (Q) Blood glucose levels. (R) A schematic illustration
  for the distinct nutrient-sensing mechanisms by which glucose and fructose activate
  hepatic lipogenesis and the selective inhibitory effect of galactose on the glucose-induced
  HBP-mTORC1-SREBP-1c pathway. Data were expressed as mean ± SD. Statistical comparisons
  were made using Student’s t-test, one-way ANOVA, and two-way ANOVA with Tukey’s
  post hoc test, *p < 0.05, **p < 0.01, ***p < 0.001 versus the corresponding control.
  AF, alcohol-fed; Gal, galactose'
article_title: Low-Dose Galactose Rebalances HBP-mTORC1-SREBP-1c Signaling to Suppress
  Hepatic Lipogenesis and Protect Against Early-Stage Alcohol-Related Liver Disease
