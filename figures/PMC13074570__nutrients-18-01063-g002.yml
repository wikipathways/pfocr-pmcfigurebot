figure_title: Hormonal and psychoneuroimmunoendocrine regulation of nutrient metabolism
  throughout the menstrual cycle.
caption: 'Hormonal and psychoneuroimmunoendocrine regulation of nutrient metabolism
  throughout the menstrual cycle. Schematic representation of the multi-level regulation
  of nutrient metabolism across menstrual cycle phases. Fluctuations in ovarian hormones—estradiol
  (E2) and progesterone (P4)—drive phase-dependent metabolic adaptations. Central
  metabolic signaling pathways, including insulin/PI3K–Akt, AMP-activated protein
  kinase (AMPK), and mechanistic target of rapamycin complex 1 (mTORC1), converge
  at the mitochondrial level, regulating oxidative phosphorylation (OXPHOS), ATP production,
  and reactive oxygen species (ROS) signaling. Systemic modulators include the hypothalamic–pituitary–adrenal
  axis (HPA), gut microbiota/estrobolome (short-chain fatty acids, SCFAs), immune
  dynamics (pro-inflammatory vs. tolerogenic states), and intestinal barrier function.
  Behavioral factors—energy intake, substrate utilization, physical activity, and
  energy expenditure (basal metabolic rate, BMR)—interact with these systems to shape
  metabolic flexibility across phases. Abbreviations: E2, estradiol; P4, progesterone;
  PI3K, phosphoinositide 3-kinase; Akt, protein kinase B; AMPK, AMP-activated protein
  kinase; mTORC1, mechanistic target of rapamycin complex 1; OXPHOS, oxidative phosphorylation;
  ROS, reactive oxygen species; HPA, hypothalamic–pituitary–adrenal axis; SCFAs, short-chain
  fatty acids; BMR, basal metabolic rate; I-IV: Components of the electron chain transporters'
