figure_title: The Wnt non-canonical PCP (Planar Cell Polarity) pathway.
caption: 'The Wnt non-canonical PCP (Planar Cell Polarity) pathway. Wnt ligands bind
  to Frizzled/Celsr1/Vangl2 receptors and co-receptors (PTK7, Syndecan, RYK, MuSK,
  ROR1/2, or Glypican) at the cell membrane, activating Dishevelled (Dvl). Downstream
  signaling branches through Daam1 to three central cascades: Profilin/Dia1, RhoA/ROCK/MRLC,
  and Rac1/JNK pathways leading to CapZIP and c-Jun. These pathways regulate actin
  polymerization in the cytoplasm and gene expression in the nucleus, controlling
  cell polarity and morphogenetic movements'
