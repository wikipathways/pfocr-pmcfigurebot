figure_title: NUDT5 binds PPAT to suppress de novo purine biosynthesis during purine
  salvage
caption: '(A) Bio-plex data showing the interaction between PPAT and NUDT5. (B) Western
  blot showing the interaction between Flag-Strep-PPAT and NUDT5 in cells cultured
  in dialyzed FBS-supplemented medium after 20 μM hypoxanthine treatment at the indicated
  time points. Vinculin is the loading control for the input samples. (C) PPAT-NUDT5
  interaction depicted by AlphaFold3. (D) Relative abundance of ADPR in ΔNUDT5 HeLa
  cells that express NUDT5WT, NUDT5E112Q, or NUDT5R70A. (n=3). (E) Western blot showing
  interaction between Flag-Strep-PPAT and NUDT5WT or NUDT5E112Q but not NUDT5R70A.
  Vinculin is the loading control for the input samples. (F-G) Fractional enrichment
  of m+2 AMP and m+3 GMP from [amide-15N]glutamine in ΔNUDT5 HeLa cells that express
  empty vector (EV), NUDT5WT, NUDT5E112Q, or NUDT5R70A during 4 hours of tracing.
  The cells were treated with 20 μM hypoxanthine (F) or inosine (G) for 24 hours.
  (n=3). (H) Rates of PPAT-catalyzed synthesis of glutamate when incubated with or
  without NUDT5WT or NUDT5R70A, AMP, and GMP. Data are technical replicates from one
  of three experiments. (I) Western blot showing oligomerization of PPAT and NUDT5
  in ΔNUDT5 HeLa cells expressing empty vector (EV), NUDT5WT, NUDT5E112Q, or NUDT5R70A
  and ΔPPAT cells. β-actin (ACTB) is the loading control. (J) PRPP, AMP, and GMP binding
  pockets in PPAT overlap as depicted by AlphFold3. (K) Schematic illustrating allosteric
  inhibition of PRPS1 and PPAT in the DNPB pathway. (L) Western blot showing overexpression
  of WT and mutant PRPS1 in WT and ΔNUDT5 cells. Vinculin is the loading control.
  (M) Fractional enrichment of AMP m+2 and GMP m+3 from [amide-15N]glutamine during
  4 hours of tracing in WT or ΔNUDT5 cells that express empty vector (EV), PRPS1WT,
  PRPS1L129I, or PRPS1H193Q with or without 24 hours of treatment with 20 μM hypoxanthine.
  (n=3). Data points in each panel represent an independent sample unless specified.
  Error bars denote SEM. One-way ANOVA (D and M) was used for the statistical analyses.
  ****: P < 0.0001; **: P < 0.01; *: P < 0.05. n.s.: P > 0.05. BioRender was used
  to generate the illustration in (K)'
