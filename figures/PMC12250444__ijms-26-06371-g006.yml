figure_title: Epigenomic editors can prevent the onset of neurodegenerative disorders.
caption: 'Epigenomic editors can prevent the onset of neurodegenerative disorders.
  (A) repression of mutated copy of HTT can prevent huntingtin aggregates formation
  and save Huntington’s disease patients. (B) repression of PRNP expression can prevent
  neuronal death because of prion aggregates. (C) to treat Alzheimer’s disease, we
  can (1) repress MAPT to diminish TauHF aggregation; (2) repress APP to avoid Aβ
  plaque formation; (3) decrease BACE1 and increase ADAM9/17 expression to direct
  APP cleavage through a non-amyloidogenic pathway; (4) activate TFEB expression to
  accelerate protein cleavage. (D) to treat Parkinson’s disease, we can (1) activate
  GDNF, NRF2 and other neuroprotective genes to decrease ROS level and neuronal mortality;
  (2) repress SCNA to avoid α-synuclein aggregate generation; (3) activate ASCL1,
  LMX1A and NR4A2 in astrocytes to reprogram them into neurons in vivo. (E) to avoid
  retinal degeneration in retinitis pigmentosa patients, we can: (1) repress NRL for
  direct reprogramming of rods into cones; (2) activate OPN1MV and CNGA1 to better
  capture light quants. “(?)” indicates some future directions for which no evidence
  in the context of epigenomic editors was obtained yet. Created with BioRender.com'
