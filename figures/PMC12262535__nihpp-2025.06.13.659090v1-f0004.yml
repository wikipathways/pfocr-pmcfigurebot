figure_title: The top 10 biological pathways enriched across gestational age clocks
caption: Pathway analyses via IPA was performed from the genes mapping to the CpGs
  within each of the four clocks, accounting for the differing background of genes
  represented on the respective arrays. For each pathway, enrichment p-values were
  combined across studies using the sum of the study specific pathway enrichment -log10
  (p-values) and in this table, the pathways are displayed in their order of significance
  from top to bottom. Dot represents pathway enrichment p-value<0.05. For all pathways
  in each study, detailed p-values are listed in Supplementary Table 5
article_title: Immune pathways and perinatal environmental exposures contribute to
