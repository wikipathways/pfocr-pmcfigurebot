figure_title: Overexpression of PITX2 rescues the effects of miR-200a.
caption: Overexpression of PITX2 rescues the effects of miR-200a. (A) The expression
  levels of miR-200a were assessed with RT-qPCR after co-transfection of miR-200a
  mimics with pcDNA3.1. (B) Expression levels of miR-200a and PITX2 were assessed
  with RT-qPCR after co-transfection of miR-200a mimics with pcDNA3.1-PITX2. (C) The
  expression of Wnt pathway genes was detected following co-transfection using RT-qPCR.
  (D,E) EdU was performed 24 h after co-transfection to detect cell proliferation
  and count the positive cell rate. (F) The expression of proliferation-related genes
  was detected following co-transfection using RT-qPCR. (G) CCK8 detection of cell
  proliferation in GEDFs after co-transfection. All experiments included three biological
  replicates (n = 3), with data presented as mean ± SEM. (ns p > 0.05, * p < 0.05,
  ** p < 0.01, *** p < 0.001, **** p < 0.0001)
