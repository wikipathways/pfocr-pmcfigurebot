figure_title: Angiogenesis and senescence as immune escape mechanisms prevalent in
  HRD tumors
caption: (A) T values comparing Z-normalized Reactome pathway ssGSEA scores in HRD
  (positive t values) versus HRP (negative t values) tumors, analyzed separately in
  dHpC (orange) and dCpH (purple).(B) T values comparing Z-normalized ssGSEA scores
  between dHpC HRD and dCpH HRD.(C) Reactome pathway enrichment analysis of amplifications
  (2 copies above baseline major copy number) and LOH in dHpC versus dCpH HRD tumors;
  colors denote enrichment in dHpC (orange) or dCpH (purple).(D) Same as in panel
  C, comparing hot HRD versus cold HRD tumors.(E) Pearson correlation coefficients
  between Z-normalized ssGSEA scores and Z-normalized immune cell proportions (clusters
  as in Figure 3) in dHpC HRD tumors; significant correlations (p < 0.05) are outlined
  with black border.(F) Same as in panel E but for dCpH HRD tumors.(G-L) Additional
  pathways (in the same order as panels A–E).(M) T values from hot HRD versus cold
  HRD comparison; red indicates enrichment in hot and blue in cold tumors.For panels
  A-D, G-J, and M, the shades indicate the statistical significance (adjusted p <
  0.05, darker shades)
article_title: Tissue specificity and chromosomal alterations shape divergent immune
