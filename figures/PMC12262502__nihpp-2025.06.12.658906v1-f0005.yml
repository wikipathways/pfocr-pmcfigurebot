figure_title: LPS induces inflammation and innate immunity and suppresses proliferative
  and metabolic biological processes
caption: Gene set enrichment analysis was performed using the fgsea package in R on
  gene expression datasets ranked by fold-change and gene sets from the Gene Set Knowledgebase
  (GSKB) (40) filtered only to include Gene Ontology (GO) and KEGG gene sets (41).
  At both 4-hr and 8-hr time points, LPS induced immune and inflammatory pathways,
  including cytokine/chemokine signaling and responses to viruses, LPS, IFN, and dsDNA.
  These immune-related processes showed equal or greater activation at 4 hr compared
  to 8 hr, highlighting the rapid and dynamic nature of the inflammatory response.
  Simultaneously, pathways related to cell proliferation and metabolism (blue bars)
  exhibited significant negative enrichment, including cell division, DNA replication,
  lipid metabolism, and microtubule-associated processes, indicating coordinated suppression
  of growth and metabolic functions during LPS-induced inflammation
