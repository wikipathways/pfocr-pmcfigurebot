figure_title: Proposed mechanism of hydroxytyrosol (HT) cardioprotection against ischemia/reperfusion
  (I/R) injury.
caption: Proposed mechanism of hydroxytyrosol (HT) cardioprotection against ischemia/reperfusion
  (I/R) injury. Hydroxytyrosol (HT) acts within the cardiomyocyte to mitigate I/R
  damage. Upon entering the cell, HT activates the Nrf2 pathway, leading to its nuclear
  translocation and subsequent increased expression of antioxidant genes (ARE). The
  enhanced antioxidant defense system, along with HT’s direct effects, results in
  reduced oxidative stress (decreased H2O2). This action, coupled with improved mitochondrial
  function (evidenced by increased respiration, enhanced mitochondrial potential,
  and improved mitochondrial complex activity), collectively leads to cardioprotection
  and a reduction in myocardial infarct size
article_title: 'Unveiling the Cardioprotective Potential of Hydroxytyrosol: Insights
  from an Acute Myocardial Infarction Model'
