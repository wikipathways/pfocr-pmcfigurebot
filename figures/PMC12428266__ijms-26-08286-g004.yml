figure_title: BGN improves protein synthesis by activating the AKT/mTOR pathway.
caption: BGN improves protein synthesis by activating the AKT/mTOR pathway. (A) Western
  blot analysis and quantification of total and phosphorylated AKT, mTOR, pS6K, and
  p4EBP1 in C2C12 myotubes treated with 0.5 µg/mL BGN or PBS (as a negative control).
  (B) Western blot analysis and quantification of total and phosphorylated S6K and
  4EBP1 in C2C12 myotubes treated with BGN (0.5, 1.0, or 1.5 μg/mL) or PBS (as a negative
  control) for 48 h. (C) Representative immunoblot of puromycin incorporation in C2C12
  myotubes and the corresponding quantification. (D) Western blot analysis and quantification
  of total and phosphorylated S6K, 4EBP1, and S6 in C2C12 myotubes treated with 10
  µM Dex with or without 0.5 µg/mL BGN pretreatment for 24 h. The data are presented
  as the mean  ±  SD; * p < 0.05, ** p < 0.01, and *** p < 0.001
