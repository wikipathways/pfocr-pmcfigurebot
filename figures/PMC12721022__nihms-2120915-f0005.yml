figure_title: Metabolism-modulated mitoribosome assembly induces conformational differences
  in MRPs and rRNA
caption: '(A) Sequential assembly pathway during mitoribosome maturation: chaperone
  Ccm1 is released from the assembly intermediate, facilitating the insertion of mS47.
  This is followed by the dissociation of Rsm22 and the subsequent incorporation of
  mS46.46 Although G-mitoribosome assembled in respiring cells incorporates mS47 and
  mS46, fermenting cells assemble D-mitoribosome without inserting these two subunits.(B–D)
  Overview of the localization (B) and conformation of mS45 (C), uS5m (C), and uS10m
  (D) in mature D- and G-mitoribosomes. See also Video S4.(E) Comparison of the conformations
  of nucleotides near the decoding center reveals key differences between D- and G-mitoribosomes.
  Rsm22 release is known to induce the folding changes of these nucleotides.46 See
  also Figure S5B for comparison with the assembly intermediate'
