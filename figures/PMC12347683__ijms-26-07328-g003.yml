figure_title: Overview of the glutamate/GABA/glutamine cycle.
caption: 'Overview of the glutamate/GABA/glutamine cycle. The GABA–glutamine–glutamate
  shuttles replenish the neurotransmitters, L-glutamate and GABA using glutamine generated
  in astrocytes. After release from glutamatergic neurons into the synaptic clefts,
  glutamate not bound to post-synaptic receptors is carried with Na+ and H+ into astrocytes
  by the glutamate–aspartate transporters SLC1A3 (solute carrier 1A3, EAAT1) and SLC1A2
  (EAAT2), step ①. Similarly, unbound GABA released from GABAtergic neurons is carried
  into astrocytes with sodium and chloride by the GABA transporter SLC6A11 (GAT3),
  step ②, where it is converted to glutamate. Glutamine synthetase (GS) then catalyzes
  the formation of glutamine from glutamate and ammonia in an ATP-dependent reaction.
  Glutamine is exported with sodium into the extracellular space by Na+-amino acid
  cotransporters, SLC38A1 (SNAT1) and SLC38A2 (SNAT2), and Na+-amino acid cotransporters-H+
  antiporters, SLC38A3 (SNAT3) and SLC38A5 (SNAT5), step ③, and then imported into
  neurons by one or more SNAT transporters: SNAT1, 2 and SNAT7 [SLC38A7]), step ④.
  In glutamatergic neurons glutamine is hydrolysed by PAG (phosphate-activated glutaminase).
  In GABAtergic neurons. glutamine is dehydrogenated by GDH (glutamate dehydrogenase),
  producing GABA. The neurotransmitters are then packaged into vesicles, transported
  to the synapses, and released with neuronal stimulation. Most neurotransmitters
  not bound to post-synaptic receptors are recycled via astrocytes as described above.
  A fraction is transferred back into neurons: glutamate by SLC1A3 ⑤ and GABA by SLC6A1
  (GAT1) ⑥. Mitochondrial glutamate/H+ symporter SLCA22 probably makes a significant
  contribution to the cycle [18]. Abbreviations: Solute carrier family members (SLC):
  SLC1A3 aliases excitatory amino acid transporter 1 (EAAT1), glutamate-aspartate
  transporter (GLAST), SLC1A2, aliases EAAT2, glutamate transporter 1 (GLT1), SLC6A1
  (alias GABA transporter 1 (GAT1), SLC6A11, alias GABA transporter 3 (GAT3); Na+-amino
  acid cotransporters: SLC38A1 (SNAT1) and SLC38A2 (SNAT2); Na+-amino acid cotransporters-H+
  antiporters, SLC38A3 (SNAT3), SLC38A5 (SNAT5), and SLC38A7 (SNAT7). Red lines depict
  the major pathways, grey lines additional routes. Solid lines indicate direct enzyme
  conversions; dotted lines depict production from TCA cycle intermediates'
