figure_title: Exosomes derived from IR adipocytes increase transcription of EMT genes
  and migration ability of 4T1 cells in vitro
caption: A. 4T1 cells were treated with IS and IR adipocyte-derived exosomes compared
  to control (no treatment); cellular mRNA was analyzed by EMT array. B. Ingenuity
  pathway analysis of differentially expressed EMT array genes. C. Representative
  images of IHC staining with osteopontin and E-cadherin antibodies in Control, IS
  and IR groups, scale bar represents D. Representative images of migration assay
  of exosome-treated 4T1 cells; TGFB, TGF-β positive control at 5ng/ml for EMT induction.
  D. Quantification of C (n=4, *, p<0.05, **, P<0.01). E. Pathway enrichment analysis
  of differentially expressed genes; pathways are compared by exosome status. Bubble
  size indicates number of genes. Color bar indicates false discovery rate (FDR);
  red represents lower value, blue represents higher value. F. Survival analysis of
  breast cancer patients in Metabric Basal data using genes differentially expressed
  between IS and IR states
