figure_title: Mechanisms and signaling pathways of ferroptosis.
caption: 'Mechanisms and signaling pathways of ferroptosis. The occurrence of ferroptosis
  is predominantly associated with system Xc−, lipid peroxidation, and iron metabolism.
  System Xc−, functioning as a cystine/glutamate antiporter, mediates the import of
  cystine into cells and the export of glutamate. Intracellular cystine is reduced
  to cysteine, which participates in the biosynthesis of GSH. GSH, under the catalytic
  action of GPX4, reduces lipid hydroperoxides (PLOOH)—which are formed from PUFAs—to
  corresponding alcohols (such as PUFAs-OH), while GSH itself is oxidized to oxidized
  glutathione (GSSG). In terms of iron metabolism, Tf loaded with two iron molecules
  interacts with the cell membrane, releasing Fe3+, which is subsequently reduced
  to Fe2+ via SLC40A1. Mitochondria, through transporters like SLC25A28 and SLC25A37,
  participate in Fe2+ metabolism, thereby promoting the generation of ROS. When the
  activity of GPX4 is inhibited or the level of GSH is insufficient, PLOOH accumulates,
  triggering lipid peroxidation. Meanwhile, ROS, in conjunction with Fe2+—related
  processes, exacerbates lipid peroxidation. Ultimately, the accumulation of lipid
  peroxidation leads to ferroptosis, and the liver may be implicated in this process.
  Color Key: Green: Cystine/Glutamate metabolism and Glutathione synthesis pathway.
  Yellow: Transferrin/iron metabolism pathway. Blue: Mitochondrial ROS production.
  Red: Core process of lipid peroxidation and ferroptosis'
