figure_title: Immune-related genes and pathways.
caption: Immune-related genes and pathways. (A) the top 20 significantly up-regulated
  (red) and down-regulated (dark blue) gene sets identified by GSEA of the transcriptomic
  data based on KEGG pathway annotations (p-value < 0.05, FDR < 0.25). The normalized
  enrichment score (NES) for each pathway was calculated and is displayed in the histogram;
  (B) GSEA enrichment plots of the three up-regulated immune-related pathways; (C)
  Heatmap of the identified DEGs associated with the immune system. Colors represent
  the FPKM values of each gene; (D) The significantly enriched immune-related pathways
  in the context of DEGs. The color coding indicates the log2FC value of each gene,
  with red denoting up-regulated genes and green denoting down-regulated genes
