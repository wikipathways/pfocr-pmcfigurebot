figure_title: Mechanism of action of galunisertib according to [305].
caption: 'Mechanism of action of galunisertib according to [305]. TGF-β is a protein
  that plays a crucial role in regulating cell growth, differentiation, and immune
  responses. In cancer, abnormal TGF-β signaling can promote tumor growth, invasion,
  and immune evasion. Targeting TGF-β signaling in cancer treatment involves blocking
  the pathway that transmits signals from the TGF-β protein to the inside of the cell.
  This can be done by inhibiting downstream signaling components, such as the kinase
  activity of the TGF-β receptor. Small molecule kinase inhibitors like galunisertib
  work by blocking this receptor’s activity (targeting TβRI kinase), preventing the
  cancer-promoting signals from being carried out. Mature TGF-β binds to type I and
  type II serine/threonine kinase receptors (TβRI and TβRII), forming a heterotetrameric
  complex. The constitutively active TβRII phosphorylates and activates TβRI, which
  then initiates the canonical TGF-β signaling pathway. Activated TβRI phosphorylates
  SMAD family of proteins: SMAD2 and SMAD3 at their C-terminal serine residues. These
  phosphorylated SMADs form a trimeric complex with SMAD4, translocate to the nucleus,
  and regulate gene expression in cooperation with other transcription factors. Beyond
  transcriptional regulation, SMADs influence gene expression through epigenetic changes,
  RNA splicing, and miRNA processing. All abbreviations employed are defined in the
  text in the Abbreviations section'
