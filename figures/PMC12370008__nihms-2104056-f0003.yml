figure_title: JAK1 is required for cytokine-stimulated transcriptional reprogramming
  in cardiac myocytes.
caption: JAK1 is required for cytokine-stimulated transcriptional reprogramming in
  cardiac myocytes. (A) Experimental assessment of oncostatin-M (OSM)-inducible target
  genes. Adult ventricular cardiomyocytes (ACMs) isolated from male and female mice
  were treated with vehicle or OSM (10 ng/mL) for 16 h in culture, and RNA isolated
  for (B—C) RNA sequencing (RNAseq) or (D—H) qPCR. (B) Histogram of the top 10 KEGG
  biological processes most significantly enriched with upregulated genes in OSM-treated
  ACMs compared to vehicle-treated ACMs. Values at the end of histograms indicate
  the number of upregulated genes with OSM treatment in the pathway. Histograms for
  biological processes related to inflammation are colored light blue and the JAK-STAT
  pathway itself colored black. (C) Heat map depicting the 10 most-upregulated transcripts
  in OSM-treated ACMs relative to vehicle-treated ACMs by RNAseq. Relative mRNA levels
  of (D) Thbd, (E) Timp1 (F) Socs3, (G) Sprr1a, (H) Serpinb1a, and (I) Vegfa were
  assessed by qPCR in ACMs isolated from male and female mice of the indicated genotypes
  and treated with vehicle or OSM. n = 3 Myh6-Cre, 3 Jak1fl/fl, and 4 Jak1cKO in D,
  E, H, and I; n = 3 Myh6-Cre, 4 Jak1fl/fl, and 4 Jak1cKO in F; n = 3 Myh6-Cre, 3
  Jak1fl/fl, and 5 Jak1cKO in G. Data are presented as the mean value ± the standard
  error of the mean. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001, ns, not
  significant, two-way ANOVA with post-hoc Tukey’s multiple comparisons test
