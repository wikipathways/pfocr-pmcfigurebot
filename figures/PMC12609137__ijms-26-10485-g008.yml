figure_title: 'Molecular pathways implicated in tooth agenesis: Wnt, TGF-β/BMP, and
  EDA/EDAR/NF-κB.'
caption: 'Molecular pathways implicated in tooth agenesis: Wnt, TGF-β/BMP, and EDA/EDAR/NF-κB.
  The figure illustrates three major signaling cascades involved in odontogenesis
  and disrupted in DA as result of mutations in the involved genes. In the Wnt pathway,
  WNT proteins (such as WNT10A and WNT10B) activate LRP6 and Frizzled receptors, stabilizing
  β-catenin and promoting transcription of odontogenic target genes, while regulators
  such as AXIN2 and antagonists like DKK1 and KREMEN1 modulate activity. The TGF-β/BMP
  pathway, mediated by ligands including BMP4 and TGF-β, signals through SMAD proteins
  to control transcription factors such as MSX1 and PAX9, with modulators like GREM2
  and LTBP3 fine-tuning the process. The EDA/EDAR/NF-κB pathway is activated by EDA
  binding to EDAR and its adaptor proteins (EDARADD, TRAF6), leading to NF-κB nuclear
  translocation and regulation of tooth development genes. Together, these interconnected
  pathways orchestrate epithelial–mesenchymal signaling during tooth morphogenesis,
  and their disruption underlies both syndromic and non-syndromic forms of dental
  agenesis. This figure was generated using BioRender (https://BioRender.com) by Treccarichi,
  S. and adapted from a previous work [53]'
