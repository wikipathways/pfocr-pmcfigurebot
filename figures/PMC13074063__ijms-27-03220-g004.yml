caption: Transient transfection with miR-369-3p mimic improved the autophagic pathway.
  (A) Representative blots of LC3II/I, BECLIN-1, and SQSTM1/p62 protein expressions
  after miR-369-3p mimic transfection in Raw264.7 cells without and with LPS stimulation.
  (B) The histograms reported the quantitative analysis of LC3II/I ratio, BECLIN-1
  and SQSTM1/p62 after miR-369-3p mimic in unstimulated and LPS-stimulated cells.
  Protein levels were normalized to the housekeeping protein VINCULIN. Data are representative
  of four independent experiments. The histograms correspond to the mean ± SEM (*
  p < 0.05; ** p < 0.01)
