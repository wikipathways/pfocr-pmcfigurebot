figure_title: Mn exposure alters mitochondrial and endoplasmic reticulum (ER) structures.
caption: 'Mn exposure alters mitochondrial and endoplasmic reticulum (ER) structures.
  (A) Representative transmission electron microscopy (TEM) images. Scale bar = 0.5
  μm. Enlarged views of boxed areas are shown right, highlighting the endoplasmic
  reticulum (red arrows). (B) Representative fluorescence images of ER tracker red
  in primary astrocytes (left panel). Scale bars = 50 μm. Enlarged views of boxed
  areas are shown in the right panel. Scale bar = 25 μm. (C) Representative TEM images
  showing ultrastructural alterations in astrocytes in the SN (red arrowheads indicating
  ER). Scale bar: left, 2 μm; right, 1 μm. (D) Schematic diagram of the unfolded protein
  response (UPR) signaling pathway. (E–G) Quantitative RT-qPCR analysis of UPR-specific
  markers (Atf4, Atf6, and Xbp1) in the primary astrocytes (*** p < 0.001 vs. Con).
  (H) Representative TEM images showing mitochondrial alterations in primary astrocytes.
  Scale bar: left, 2 μm; right, 1 μm. Statistical analysis of mitochondrial length
  is shown (n = 5, ** p < 0.01 vs. Con). (I) Representative fluorescence images of
  MitoTracker red in primary astrocytes (left panel). Scale bars: =50 μm. Enlarged
  views of boxed areas are shown in the right panel. Quantitative analysis of mitochondrial
  length is provided (n = 5, *** p < 0.001 vs. Con)'
