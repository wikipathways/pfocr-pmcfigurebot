figure_title: Myeloid-intrinsic CD9 alters adipose tissue remodeling during obesity
caption: 'Epididymal white adipose tissue (eWAT) was collected from male control (Cd9fl/fl)
  and CD9-MKO (Cd9fl/fl LysMCre+/–) mice fed either an NCD or HFD for 12 weeks. (A)
  eWAT mass (n = 10–15). (B) Representative H&E staining of eWAT in control or CD9-MKO
  HFD mice (n = 11–12). Scale bar: 400 μm. (C) Frequency distribution and mean adipocyte
  diameter calculated from H&E images in B (n = 11–12). (D and E) Bulk RNA-Seq was
  performed on eWAT depots from control and CD9-MKO mice (n = 4). (D) Volcano plot
  showing the log2 fold-change (FC; x axis) and adjusted P value (–log10 FDR; y axis)
  of genes between CD9-MKO HFD and control HFD groups. Significantly differentially
  expressed genes (log2 FC > 0.58 and FDR < 0.05) are shown in purple. (E) Pathway
  enrichment analysis showing the most significant (by normalized enrichment score)
  nonredundant pathways downregulated in eWAT. Pooled data from 3 independent experiments
  (A–C) or data from 1 experiment (D and E). Data presented as mean ± SEM (A and C);
  1-way ANOVA with Fisher’s LSD test (A) or unpaired 2-tailed Student’s t test between
  means (C). ns, not significant; *P < 0.05, ****P < 0.0001. Avg, average; MMP, matrix
  metalloproteinases; NOXs, NADPH oxidases'
