caption: Heterologous reconstitution of moniliphenone (11) and blennolide C (9) in
  ScRC01. (A) Biosynthetic pathway of 11 and 9. (B) Heterologous reconstitution of
  11 from chrysophanol (10). (C) Heterologous reconstitution of 9 from 10. Compounds
  11, 9/9’ and 9-RD are fully characterized by NMR and high-resolution MS. The stereochemistry
  of C5 is assigned based on the reported stereochemistry of the same carbon in 1.5
  The C10 substituent in 9/9’ can readily epimerize under physiological conditions
  (Figure S4). 9-RD is isolated as a single diastereoisomer, but the absolute stereochemistry
  at C10 is not determined
