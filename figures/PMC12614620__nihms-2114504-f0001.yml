figure_title: Interactions between macrophages and NETs in atherosclerotic plaque
  environment.
caption: Interactions between macrophages and NETs in atherosclerotic plaque environment.
  1. ER stress (PERK-ATF4 activation) in foam cell macrophages decreases NET-induced
  DNase response leading to 2. accumulation of NETs in plaque environment. HMGB1 protein
  on NETs activates TLR4 signaling on macrophages, leading to ADAM17-mediated MERTK
  cleavage, 3. impairing macrophage efferocytosis of apoptotic cells and debris. 4.
  Impaired efferocytosis leads to higher percentage of plaque necrosis. ISRIB can
  inhibit the PERK-ATF4 pathway, restoring DNase response and improving NET clearance.
  Created in BioRender. Nazari, I. (2025) https://BioRender.com/fy3mpyy
