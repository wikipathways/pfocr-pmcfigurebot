figure_title: GO enrichment analysis of differentially expressed proteins between
  healthy cells (Control) and insulin resistant cells (MOD) groups.
caption: 'GO enrichment analysis of differentially expressed proteins between healthy
  cells (Control) and insulin resistant cells (MOD) groups. Gene Ontology (GO) enrichment
  of significantly differentially expressed proteins (adjusted p < 0.05, |log2 fold
  change| ≥ 1) between Control and MOD groups was performed using a GO over-representation
  analysis with the identified proteome as background. Enriched terms are shown for
  Biological Process (BP), Cellular Component (CC), and Molecular Function (MF) categories.
  Bars indicate the percentage of annotated proteins, and only terms with FDR-corrected
  p < 0.05 are displayed. The ellipsis (“…”) in the figure labels indicate truncated
  terms due to space limitations. The full terms are as follows: BP: cell surface
  receptor signaling pathway; cellular amino acid biosynthetic process; alpha-amino
  acid biosynthetic process; CC: integral component of Golgi membrane; MF: neurotransmitter:
  sodium symporter activity; secondary active transmembrane transporter activity;
  3,5-cyclic-nucleotide phosphodiesterase activity; substrate-specific transporter
  activity; monovalent inorganic cation transmembrane transporter activity; transmembrane
  receptor protein tyrosine kinase activity; mannose-6-phosphate isomerase activity;
  [heparan sulfate]-glucosamine N-sulfotransferase activity'
