figure_title: Developmental changes and cell-type specificity of astrocyte regional
  heterogeneity over postnatal development in the mouse
caption: A, Integrated UMAP embeddings of 68,485 mouse astrocytes colored by (i) brain
  region (one-hot color encoded in (iv)), (ii) developmental time point (one-hot color
  encoded in (v)), and (iii) Leiden cluster assignment. B, Expression heatmap (rows
  are cells, columns are genes) of regional differentially expressed genes (rDEGs)
  between astrocytes from cortex, striatum, and thalamus at (i) E18.5, (ii) P14, and
  (iii) P90 mice in log counts per million (logCPM). The raster plots beneath each
  heatmap indicate the time point and region(s) of upregulation for each rDEG. Genes
  are ordered as in Fig. 2B. Striatal astrocytes are ordered by subtype identity (see
  Methods). C, UpSet plot showing the number of overlapping cortex-thalamus rDEGs
  between developmental time points as in Fig. 2C. D, UpSet plot (as in (C)) showing
  the number of overlapping cortex-thalamus rDEGs between OPCs, astrocytes, inhibitory
  neurons, and excitatory neurons for (i) P4 and (ii) P90 mouse. Overlap categories
  with 0 rDEGs are not shown. E, Gene ontology (GO) and pathway analysis on cortex-thalamus
  (enriched in either region) astrocyte rDEGs via WebGestalt 2024 in (i) E18.5, (ii)
  P32, and (iii) P90 month mouse astrocytes. Lollipop plots were generated as in Fig.
  2E. See also Fig. S7, Figs. S10–11, and Fig. S13
article_title: A transcriptomic atlas of astrocyte heterogeneity across space and
  time in mouse and marmoset
