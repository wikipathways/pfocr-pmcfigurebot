caption: Identification of turquoise co-expression modules for PD-KEY-Neutrophils
  through hdWGCNA. (A) Soft power threshold of 4 was selected for hdWGCNA analysis.
  (B) Dendrogram from hdWGCNA identified three gene co-expression modules. (C) The
  top 10 genes for each co-expression module. (D) Feature Plots visualizing the expression
  patterns of these modules in neutrophils. (E) Dot plot showing selective enrichment
  of the turquoise module in PD-KEY-Neutrophils. (F) KEGG pathway enrichment analysis
  of the turquoise module genes. “Neutrophil Degranulation” (bolded) represents the
  most significantly upregulated pathway. “Complement Activation” (bolded) shows second-highest
  enrichment
