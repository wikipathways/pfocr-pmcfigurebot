figure_title: “Per virus” kinetic modeling supports off-pathway hemi-fusion mechanism.
caption: '“Per virus” kinetic modeling supports off-pathway hemi-fusion mechanism.
  DENV VLP hemi-fusion data collected at different pH values (see Fig. 2) were fit
  to either a linear (A) or an off-pathway (B) mechanism, using “per virus” modeling
  (state definitions are described in the main text). CDFs of all pH values were fit
  simultaneously. (C) shows the best fit (solid lines) to the experimental hemi-fusion
  CDF (open circles) for the linear model. (F) and (I) show the best fits for the
  irreversible (kreturn = 0) and reversible (kreturn≠0) off-pathway models, respectively.
  The probability of hemi-fusion was calculated relative to the final extent at pH
  5, which was set at 1. (D), (G), and (J) show the normalized fits on the normalized
  CDFs to demonstrate how well the fits model the experimental wait time distributions.
  CDFs were normalized to the final extent of hemi-fusion at each pH value. (E), (H),
  and (K) show the model predictions for final extents of hemi-fusion (solid bars)
  at t = 300 s compared with the experimental final extents (open bars). Final extents
  are shown relative to pH 5, which was set at 1. Error bars are the standard deviation
  of three sample replicates. The best fitting rate constants were as follows: linear:
  kBA = 1.4 × 103 M−1s−1 and kAHF = 0.99 s−1; off-pathway: kBA = 8.1 × 104 M−1s−1,
  koff = 0.1 s−1, and kAHF = 1.4 × 10−2 s−1; and off-pathway, reversible: kBA = 6.4
  × 104 M−1s−1, koff = 0.2 s−1, kreturn = 0.001 s−1, and kAHF = 2.4 × 10−2 s−1'
