figure_title: In vivo antimetastatic and anti-osteolytic effects of aqueous extract
  of Coriolus versicolor (CV) in a murine 4T1 breast cancer model.
caption: In vivo antimetastatic and anti-osteolytic effects of aqueous extract of
  Coriolus versicolor (CV) in a murine 4T1 breast cancer model. Daily oral administration
  of CV extract (1 g/kg for 4 weeks) significantly reduced primary tumor mass and
  lung metastases, without affecting liver metastasis. The treatment was well tolerated,
  with no changes in body weight or plasma enzyme activity (AST, ALT, ALP, CK), indicating
  low systemic toxicity. Additionally, CV extract exerted a protective effect on bone
  structure by reducing bone metastasis and osteolysis, increasing bone volume by
  10.2%. These effects may result from indirect inhibition of CXCR4/CXCL12 and RANK/RANKL
  signaling pathways involved in bone colonization
