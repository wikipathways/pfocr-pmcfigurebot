figure_title: In vitro osteogenic ability under oxidative stress.
caption: 'In vitro osteogenic ability under oxidative stress. (A) Schematic illustration
  of ROS accumulation and osteogenic inhibition in BMSCs under oxidative stress. (B)
  Live/dead cell staining and flow cytometry analysis of the BMSCs in each group.
  Scale bar: 50 μm. (C-D) Representative images and quantitative analysis of caspase-3
  and TUNEL staining in BMSCs following different treatments. Scale bar: 50 μm. (E-F)
  Representative images and quantitative analysis of JC-1 staining in BMSCs following
  different treatments. Scale bar: 50 μm. (G-H) Relative mRNA expression of antioxidant-related
  genes in BMSCs following different treatments. (I) Representative images of ARS,
  ALP, and Von Kossa staining of BMSCs following different treatments. Scale bar:
  2 mm (macroscopic photos) and 100 μm (microscopic images). (J) Immunofluorescence
  staining of Runx2 and OPN in BMSCs following different treatments. Scale bar: 50
  μm. (K) Heatmap of osteogenesis-related marker gene expression. (L) Western blot
  analysis was conducted to assess the expression of osteogenesis-related proteins
  in BMSCs following a 7-day coculture period. (M) Western blot analysis of PI3K/AKT
  signaling pathway-related proteins in BMSCs after different treatments for 7 days.
  (N) Schematic diagram of the mechanism by which SC/MTZ, combined with mild NIR irradiation,
  enhances osteoblast differentiation and mineralization. Data are expressed as mean
  ± SD (n = 3). Significant differences compared to the normal group are indicated
  by *P < 0.05 and **P < 0.01. Significant differences compared to the SC/MTZ+NIR
  group are indicated by #P < 0.05 and # #P < 0.01'
