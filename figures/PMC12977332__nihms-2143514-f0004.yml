figure_title: The hexosamine biosynthetic pathway (HBP) contributes to glucose-, but
  not fructose-induced DNL activation and TAG accumulation
caption: (A) Schematic of glucose and fructose entry into glycolysis. (B - D) AML12
  cells were treated with low-glucose (5 mM) and high-glucose (25 mM) for 16 hours.
  (B) GFPT1 protein. (C) O-GlcNAcylation. (D) N-linked glycosylation. (E - G) HepaRG
  cells were treated with low-glucose (5 mM) and high-glucose (25 mM) for 16 hours.
  (E) GFPT1 protein. (F) O-GlcNAcylation. (G) N-linked glycosylation. (H & I) AML12
  cells were treated with low-fructose (5 mM) and high-fructose (25 mM) for 16 hours.
  (H) GFPT1 protein. (I) O-GlcNAcylation. (J-M) AML12 cells were transfected with
  siRNAs targeting GFPT1 or treated overnight with azaserine (AZA), a pharmacological
  inhibitor of GFPT1, prior to exposure to low-glucose (5 mM) and high-glucose (25
  mM) media for 16 hours. (J & M) DNL-related gene mRNA levels. (K & L) Gfpt1 knockdown
  efficiency. (N & O) AML12 cells were transfected with siRNAs targeting GFPT1 or
  treated overnight with azaserine (AZA), a pharmacological inhibitor of GFPT1, prior
  to exposure to low-fructose (5 mM) and high-fructose (25 mM) media for 16 h. DNL-related
  gene mRNA levels. Data were expressed as mean ± SD. Statistical comparisons were
  made using two-way ANOVA with Tukey’s post hoc test, *p < 0.05, **p < 0.01, ***p
  < 0.001 versus the corresponding control. Glu, glucose; Fru, fructose; Aza, azaserine
