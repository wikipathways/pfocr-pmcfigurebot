figure_title: Age-related gene comparison analysis of oxidative stress pathway genes
  in 3xTg-AD mice at 6 and 9 months of age.
caption: Age-related gene comparison analysis of oxidative stress pathway genes in
  3xTg-AD mice at 6 and 9 months of age. (A) Heat map of all 84 oxidative stress pathway
  genes (plotted as log2FC), (B) reactive oxygen species metabolism genes, (C) peroxiredoxins
  (TPx), (D) oxidative stress response genes. All data are normalized to the 6-month
  3xTg-AD control group. Data represented 3xTg-AD control and 3xTg-AD UCMS mice at
  6 and 9 months of age. *p ≤ 0.05, **p ≤ 0.01, ***p ≤ 0.001, ****p ≤ 0.0001; mean
  ± SEM. n = 6–9/group. Blue dots = male data; white dots = female data. Data were
  compared using Two-way ANOVA, with the main effect of stress and time (and their
  interaction) with a Tukey post-hoc test. Nitric oxide synthase 2 (Nos2), NADPH oxidase
  2 (Nox2) and 4 (Nox4), peroxiredoxin 1 (Prdx1), 2 (Prdx2), and 6 (Prdx6), catalase
  (Cat), glutathione peroxidase 3 (Gpx3), glutathione reductase (Gsr), glutamate-cysteine
  ligase modifier subunit (Gclm), glutathione S-transferase (Gstp1), NAD(P)H dehydrogenase,
  quinone 1 (Nqo1), thioredoxin interacting protein (Txnip), and uncoupling protein
  3 (Ucp3)
