caption: Effects of CCK-BR-KO in murine PSCs on genes affecting the pancreatic tumor
  microenvironment. (A) Pathways involved in proliferation, invasion, and metastasis
  were downregulated, as demonstrated by the blue or green color. Genes involved in
  apoptosis were increased and shown by the orange color. Genes outlined in purple
  are very significant. (B) Flow cytometry of wild-type PSCs with apoptosis markers.
  (B-1) Graphical representation of the percentage of wild-type live cells versus
  cells undergoing apoptosis. (C) Flow cytometry of CCK-BR-KO cells with apoptosis
  markers. (C-1) Graphic representation of the percentage of CCK-BR-KO PSC live cells
  versus cells undergoing apoptosis
article_title: Downregulation of the CCK-B Receptor in Pancreatic Stellate Cells Blocks
