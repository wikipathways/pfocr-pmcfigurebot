figure_title: Knockdown of HIF-1α expression suppressed PI3K signaling pathway and
  Hedgehog signaling pathway activation in hypoxic environment.
caption: |-
  Knockdown of HIF-1α expression suppressed PI3K signaling pathway and Hedgehog signaling pathway activation in hypoxic environment.(a-c) PI3K signaling pathway and Hedgehog signaling pathway proteins were detected by Western blot. p-PI3K, p-AKT, Smo, SHH and Gli1 expressions were significantly increased after hypoxia. (d-f) Vector, HIF-1α, sh-NC and sh-HIF-1α plasmids were transfected into SK-OV-3 OCSCs, and the expressions of PI3K signaling pathway and Hedgehog pathway were detected through Western blot. p-PI3K, p-AKT, Smo, SHH and Gli1 expressions increased after HIF-1α overexpression and decreased after HIF-1α knockdown. (g-i) The transfected SK-OV-3 OCSCs were placed in a hypoxic environment for 24 h, and the expressions of PI3K and Hedgehog pathway were detected through Western blot. Under hypoxic conditions, p-PI3K, p-AKT, Smo, SHH and Gli1 proteins increased after HIF-1α overexpression and decreased after HIF-1α knockdown.n = 3, data are represented as mean ± SD, ***p < 0.001 vs. control or Vector group; ###p < 0.001 vs. sh-NC or Hypoxia + Vector group; &&&p < 0.001 vs. Hypoxia + sh-NC group. One-way ANOVA followed by Tukey’s honest significant difference as a post-hoc test to determine the corrected significance of comparison between multiple groups, or Kruskal-Wallis test followed by Dunn’s test as a post-hoc test to ascertain the corrected significance of comparison between multiple groups was used where appropriate.
  OCSCs, ovarian cancer stem cells; HIF-1α, hypoxia-inducible factor-1α; PI3K, phosphatidylinositol 3-kinase; AKT, protein kinase B; Smo, smoothened; SHH, sonic hedgehog; SD, standard deviation
