figure_title: Hepatocyte ZFP36L1 deficiency exacerbates cellular senescence and AH
  in a mouse model
caption: (A, B) Western blot and qPCR confirmed reduced Zfp36l1 expression in livers
  from Zfp36l1HKO ALD mice compared to Zfp36l1fl/fl controls. (C) Serum ALT and AST
  levels were elevated in Zfp36l1HKO ALD mice. (D) Representative H&E, Sirius Red,
  F4/80, and p21 IHC images showing increased steatosis, fibrosis, inflammation, and
  hepatocyte senescence in Zfp36l1HKO livers. (E) Quantification of Sirius Red and
  F4/80 staining. (F) Western blot analysis of Vimentin, cleaved caspase 3, p21, and
  p16 in liver tissues. (G) RT-qPCR showing increased expression of inflammatory,
  fibrotic, and senescence-related genes in Zfp36l1HKO ALD livers. (H, I) RNA-seq
  and GSEA analysis revealed suppression of metabolic pathways and enrichment of inflammatory,
  EMT, apoptosis, and senescence signatures in Zfp36l1HKO livers. Data are presented
  as mean ± SEM. p values were calculated using two-tailed Student’s t-test in (B,
  C, E, F, G), or two-sided permutation tests with Benjamini-Hochberg correction for
  multiple comparisons in (H, I). * Indicates statistical significance (p < 0.05)
