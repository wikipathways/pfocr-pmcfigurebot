figure_title: Prostaglandin E2 (PGE2)-mediated immunometabolic regulation in adipose
  tissue macrophages.
caption: Prostaglandin E2 (PGE2)-mediated immunometabolic regulation in adipose tissue
  macrophages. Under lipolytic conditions, fatty acids are released from triglyceride
  (TG) hydrolysis and converted into arachidonic acid (AA) by cytosolic phospholipase
  A2 (cPLA2). AA is further metabolized to PGE2 via cyclooxygenases (COX1/2) in both
  adipocytes and macrophages. PGE2 engages prostaglandin E2 receptor 3 (EP3) and prostaglandin
  E2 receptor 4 (EP4) receptors, triggering distinct signaling pathways. EP3 coupling
  to Gαi suppresses adenylyl cyclase (AC), reducing cyclic adenosine monophosphate
  (cAMP)-protein kinase A (PKA) activity and limiting Sp1 transcription factor (SP1)
  phosphorylation. Lack of phosphorylated SP1 fails to induce DNA methyltransferases
  1/3a (DNMT1/3a) expression, resulting in secreted protein acidic and cysteine rich
  (SPARC) promoter hypomethylation and sustained SPARC transcription, which influences
  adipogenesis through the Wnt/β-catenin pathway. Conversely, PGE2-EP4 signaling activates
  Gαs, stimulating AC and promoting an anti-inflammatory macrophage niche with enhanced
  recruitment. In cooperation with specialized pro-resolving mediators (SPMs) such
  as resolvins (RvDs) and maresins (MaRs), EP4 additionally engages Gi and phosphoinositide
  3-kinase (PI3K) signaling, supporting a pro-phagocytic macrophage phenotype. β-AR,
  beta-adrenergic receptor; ATGL, adipose triglyceride lipase; HSL, hormone-sensitive
  lipase; MGL, monoacylglycerol lipase; FFA, free fatty acid
