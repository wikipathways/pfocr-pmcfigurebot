figure_title: Leucine zipper-based cell sorting system (Zip-sort) for selectively
  purifying dual-transduced cells
caption: (A) Zip-sort methodology is based on a heterodimerizing leucine zipper pair,
  with each component expressed from a pair of distinct vectors. A membrane bound
  capture zipper pairs with an affinity tag secreted zipper selectively in dual-transduced
  cells. Anti-tag magnetic beads are used to selectively capture the dual-transduced
  cells. (B) Design of FLAG and human CD34 epitope affinity tag zippers and short
  hinge spacer-based capture zippers (top) and elongated spacer-based capture zippers
  (bottom). Blocking-zipper prevents non-selective extracellular zipper pairing encountered
  with elongated spacer capture zippers. 3N mutant blocking-zipper increases surface
  display of capture while reducing extracellular zipper pairing. (C) Depiction of
  Zip-sort principle for elongated spacer-based capture zipper with blocking-zipper
  modification. Pathway (i) demonstrates intracellular heterodimeric zipper pairing
  occurring for a subset of capture zipper molecules in a cell. Pathway (ii) demonstrates
  intramolecular blocking interaction that prevents extracellular zipper pairing.
  (D) Example design of Zip-sort vector set encoding multiple transgenes
