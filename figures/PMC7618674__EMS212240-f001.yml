figure_title: Mechanisms of nitric oxide (NO) signaling in cardiovascular physiology,
  infection and cancer
caption: NO is produced from L-arginine and molecular oxygen by NO synthase (NOS)
  enzymes, which include endothelial (eNOS), neuronal (nNOS) and inducible (iNOS)
  isoforms. In endothelial cells, eNOS-derived NO diffuses to smooth muscle cells
  (SMCs) where it activates soluble guanylate cyclase (sGC), which converts guanosine
  triphosphate (GTP) to the secondary messenger, cyclic guanosine monophosphate (cGMP).
  cGMP then activates protein kinase G (PKG), which phosphorylates multiple downstream
  proteins resulting in SMC relaxation and vasodilation. Activating this pathway in
  endothelial cells is important after vascular injury since it promotes re-endothelialization
  and angiogenesis, while preventing unwanted neointimal hyperplasia by inhibiting
  SMC proliferation and migration. In cardiomyocytes, nNOS is located at the sarcoplasmic
  reticulum (SR), where NO regulates calcium signaling to fine tune cardiac contraction
  and relaxation. NO also reduces reactive oxygen species (ROS) generation by inhibiting
  xanthine oxidoreductase and mitochondrial respiration at electron transport chain
  (ETC) complexes I and IV, thereby protecting against Ca2+ overload and oxidative
  stress. Endogenous cytokines or lipopolysaccharide (LPS) from bacteria can activate
  immune cells (such as macrophages) and induce iNOS expression to produce high levels
  of NO. They also activate nicotinamide adenine dinucleotide phosphate oxidase (NADPH
  oxidase) to generate superoxide (O2-), which reacts with NO to form peroxynitrite
  (ONOO -), an oxidant which induces tumor cell apoptosis and exhibits antibacterial
  effects by disrupting microbial iron-sulfur (Fe-S) proteins and DNA
