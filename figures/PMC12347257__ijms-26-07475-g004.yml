figure_title: ProBio outcome-adaptive platform trial schema (NCT03903835).
caption: 'ProBio outcome-adaptive platform trial schema (NCT03903835). Top: in standard
  practice, a single drug is given to an unselected cohort, resulting in heterogeneous
  responses. Bottom: in ProBio (NCT03903835) plasma ctDNA sequencing (78-gene panel
  plus germline control) stratifies men with mCPRC into four predefined genomic signatures,
  AR-WT, TP53-WT, TMPRSS2–ERG fusion, HRD, and TP53-altered. Within each signature,
  a Bayesian algorithm adaptively randomises patients between an androgen-receptor-pathway
  inhibitor (ARPI) and a taxane, while a separate physician’s-choice arm remains non-adaptive.
  Interim data show ARPIs prolong benefit and OS in the AR-WT and TP53-WT and TMPRSS2–ERG
  groups, yield comparable outcomes to taxanes in TP53-altered disease, and are still
  underpowered in HRD-positive tumors. Created in BioRender. Fatima, Y. https://BioRender.com/o8msq1v
  (accessed on 30 June 2025). Abbreviations: ARPI, androgen-receptor-pathway inhibitor;
  ctDNA, circulating tumor DNA; HRD, homologous-recombination deficiency; OS, overall
  survival; WT, wild-type'
