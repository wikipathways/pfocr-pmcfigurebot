caption: Use of the GO database shows enrichment of a cytoplasmic translation pathway.
  (A) Using the STRING network, we visualized protein targets that were identified
  as having significant differential abundance and contributed to the transcription
  initiation pathway enrichment. (B) We further evaluated specific proteins BRCA1/BRCA2
  complex-containing subunit 3 (Brcc3), Nedd8 ultimate buster 1 (Nub1), and Neural
  precursor cell expressed developmentally downregulated protein 8 (Nedd8) within
  our proteomic dataset, demonstrating increased abundance Nub1 and decreased abundance
  of Brcc3 and Nedd8. Log2 transformed LFQ values are shown
