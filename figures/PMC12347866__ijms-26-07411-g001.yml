caption: 'Prognosis-related genes are associated with antigen-presenting cell signature
  genes. (A) Schematic overview of the computational pipeline used in this study.
  (B) Kaplan–Meier survival curves comparing the SIG100-high and SIG100-low groups.
  (C–G) Correlation coefficients (Pearson’s r) and adjusted p-values (FDR of <0.05)
  are indicated. For example, SIG100 score and HLA-DRA expression: r = 0.61, FDR-adjusted
  p < 0.001. (C) Bar graph showing pathways significantly enriched in the high SIG100
  group. (D) Box plots comparing proliferation, lymphocyte infiltration signature
  scores, and TGF-β response between the high and low SIG100 groups. (E) Box plots
  showing telomere maintenance mechanism activities (e.g., telomerase and alternative
  lengthening of telomeres) in the high versus low SIG100 groups. (F) Box plots comparing
  the activities of six metabolic pathways between the high and low SIG100 groups.
  (G) Box plots depicting the relative abundances of mast-cell resting, monocytes,
  activated CD4 memory T cells, Th1 cells, Th2 cells, and nucleotides in the high
  and low SIG100 groups'
