figure_title: Molecular profiles of cell-type-specific metabolic heterogeneity in
  AD
caption: a, b Single-cell-specific signaling entropy for AD and non-AD samples in
  the middle temporal gyrus (MTG, a) and dorsolateral prefrontal cortex (DLPFC, b)
  brain regions. The lower sub-panels showing metabolic signaling rates (SR), representing
  the cellular entropy rates over the weighted metabolic PPI networks within specific
  cell types. Elevated signaling rates indicate high uncertainty or potential disorders.
  The upper dot plots showing normalized signaling entropy based on signaling rate
  values, where orange indicates metabolic signaling entropy (considering only metabolic
  related genes) and gray represents signaling entropy for all human genes. c Pathway
  activity scores for metabolic pathways across cell types in the MTG region. Differences
  between AD and non-AD that are greater than 0.1 indicate significant changes. Orange
  indicates up-regulated pathways in AD, while green indicates the pathways that are
  down-regulated in AD. d Summary of the number of significant metabolic pathways
  in AD as illustrated in c. e Exemplar metabolic pathways in InN and microglia
