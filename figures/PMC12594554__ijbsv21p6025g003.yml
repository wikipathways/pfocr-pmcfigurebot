figure_title: Synergy between intrinsic PI3K/Akt/mTOR signaling and the IR/MASH microenvironment
  amplifies immune evasion and reveals therapeutic targets.
caption: 'Synergy between intrinsic PI3K/Akt/mTOR signaling and the IR/MASH microenvironment
  amplifies immune evasion and reveals therapeutic targets. In HCC cells, intrinsic
  PI3K/Akt/mTOR signaling converges with extrinsic cues from the IR/MASH microenvironment
  to drive robust immune evasion. (A) Synergy in PD-L1 Upregulation: The MASH microenvironment,
  characterized by an inflammatory milieu (e.g., TNF-α, IL-6) and hypoxia, synergizes
  with the PI3K/Akt/mTOR pathway to enhance the activity of transcription factors
  (NF-κB, STAT3, HIF-1α), leading to supra-additive upregulation of PD-L1 and subsequent
  Teff inhibition. (B) Synergy in EMT Promotion: The fibrotic MASH microenvironment,
  rich in TGF-β, activates the canonical SMAD pathway. This synergizes with the PI3K/Akt
  pathway''s stabilization of the EMT-TF Snail, driving a robust EMT program. This
  network is further amplified by PD-L1 intrinsic signaling and the inflammatory-oncogenic
  CCRK axis, which is co-activated by IL-6 and androgens via the androgen receptor
  (AR). (C) Therapeutic Opportunities: This complex network reveals multiple points
  for therapeutic intervention, including PI3K/mTOR inhibitors, ICIs, anti-inflammatory
  agents, HIF inhibitors, and TGF-β inhibitors, highlighting the potential for mechanism-based
  combination strategies'
