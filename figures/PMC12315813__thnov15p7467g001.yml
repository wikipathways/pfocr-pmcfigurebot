figure_title: Mn3O4 nanozyme-based anti-inflammatory therapy modulates microglial
  phenotype by downregulating TLR4/NOX2 expression and further alleviates Alzheimer's
  disease pathology
caption: 'Illustration of the mechanism of Mn3O4 nanozymes regulating microglial phenotypes
  and further ameliorating AD pathology in 5×FAD mice: (1) The role of microglial
  polarization and TLR4/NOX2 in promoting neuroinflammation; (2) After 4 weeks of
  Mn3O4 nanozyme treatment, ROS generation was inhibited through the TLR4/NOX2 pathway,
  thereby regulating microglial phenotype; (3) Microglia exhibited immune tolerance,
  which attenuated the regulation of Mn3O4 nanozymes on the microglia phenotype of
  5×FAD mice; (4) Mn3O4 nanozymes alleviated fAβ pathology and improved cognitive
  impairment of 5xFAD mice after 8 weeks of treatment'
