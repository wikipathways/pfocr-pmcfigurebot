figure_title: L-ornithine and L-aspartate (LOLA) as a Potential Treatment Candidate
  for ME/CFS and Long COVID.
caption: L-ornithine and L-aspartate (LOLA) as a Potential Treatment Candidate for
  ME/CFS and Long COVID. L-aspartate potentially can help counteract the observed
  decrease in asparagine/aspartate in both ME/CFS and Long COVID. L-ornithine, as
  the metabolic product of arginine, potentially can help restore the balance of the
  down-regulated pathway of arginine and proline metabolism in ME/CFS. Additionally,
  the combined use of these amino acids could enhance urea cycle efficiency, which
  is critical in removing ammonia and reducing fatigue symptoms commonly associated
  with these conditions. Besides, emerging evidence suggests LOLA can improve mitochondrial
  function, thereby potentially enhancing energy metabolism in patients with ME/CFS
  and Long COVID. Red arrows denote the increase or upregulation of the corresponding
  metabolites or pathways, and blue arrows denote the decrease or downregulation
