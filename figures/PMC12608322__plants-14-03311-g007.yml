figure_title: Sucrose metabolism is involved in the regulation of epicotyl dwarfing.
caption: Sucrose metabolism is involved in the regulation of epicotyl dwarfing. (A)
  KEGG enrichment analysis of sucrose metabolism. (B) DEG analysis of sucrose metabolism
  on different treatment days. (C) Regulatory patterns and DEG changes in the sucrose
  metabolism pathway. (D) DEG expression was determined and verified on different
  days of PBZ treatment. The Y-axis represents the relative expression level of Lin5,
  Lin6, Lin7, Lin8, and Lin9 by RT-qPCR. Data represent the means of three biological
  replicates (±SD). Different letters indicate significant differences (p ≤ 0.05)
  according to Duncan’s test
