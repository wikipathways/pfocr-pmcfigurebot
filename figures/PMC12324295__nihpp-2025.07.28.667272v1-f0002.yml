figure_title: Differential gene expression and pathway analysis in dopaminergic neurons
  following acute methamphetamine treatment
caption: (A) Volcano plot displaying the top 10 upregulated and downregulated genes
  (by adjusted p-value) in dopaminergic neurons after acute methamphetamine administration.
  Red dots indicate genes with a false discovery rate (FDR) < 0.1 and absolute fold
  change > 1.3.(B) Metascape functional enrichment analysis highlighting the top upregulated
  pathways in dopaminergic neurons.(C) Schematic of key genes in the cholesterol synthesis
  pathway, adapted from (Sitaula and Burris 2016).(D) Volcano plot showing adjusted
  p-values and log2 fold changes for genes encoding enzymes depicted in (C), as well
  as Ldlr, Insig1, and Srebf2. Red dots indicate genes with FDR < 0.1 and absolute
  fold change > 1.3 when comparing methamphetamine- and saline-treated dopaminergic
  neurons.(E) Violin plots illustrating expression of representative differentially
  expressed genes (DEGs) in dopaminergic neurons between methamphetamine and saline
  groups. ***, p < 0.001, Wilcoxon rank-sum test.(F, G) Volcano plots showing adjusted
  p-values and log2 fold changes of cholesterol metabolism–related genes in male (F)
  and female (G) dopaminergic neurons. Red dots indicate FDR < 0.1 and absolute fold
  change > 1.3
article_title: Dynamic Regulation of Cholesterol Metabolism Genes in Dopaminergic
  Neurons following Methamphetamine Treatment as Revealed by Single-Nucleus RNA Sequencing
