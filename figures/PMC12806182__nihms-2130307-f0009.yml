figure_title: (A) A schematic representation of a dynamic seesaw-like model of nanoceria
  and different enzyme-mimicking activities by ceria-based nanozymes.
caption: '(A) A schematic representation of a dynamic seesaw-like model of nanoceria
  and different enzyme-mimicking activities by ceria-based nanozymes. (B) Schematic
  representation of the SOD-mimetic mechanism of nanoceria. (C) The mechanism involves
  several redox steps at the nanoparticle surface: ① Oxygen vacancies present on the
  nanoceria surface act as active sites; ② H2O2 binds to surface Ce4+ sites; ③ This
  interaction leads to proton release and electron transfer, reducing Ce4+ to Ce3+;
  ④ Molecular oxygen (O2) is subsequently released from the reduced vacancy site;
  ⑤ A superoxide (O2−) radical binds to the exposed oxygen vacancy; ⑥ The radical
  undergoes dismutation to form H2O2, which is released from the surface. ⑦ A second
  superoxide anion binds and completes the redox cycle, mimicking native superoxide
  dismutase (SOD) activity by converting reactive oxygen species (ROS) into less harmful
  products. (D) Illustrated mechanisms of catalase-like activity by nanoceria: The
  steps involved in the oxidation reactions follow the same order as shown in Scheme
  1C (steps ① to ④). Step ⑤ represents the interaction of hydrogen peroxide (H2O2)
  with a site containing two Ce3+ ions, while step ⑥ denotes the uptake of two protons
  during the process. (E) Reaction pathway for peroxidase catalysis using nanoceria.
  Reproduced with permission from [48]. Copyright, 2023, American Chemical Society'
