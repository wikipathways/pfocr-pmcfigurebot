figure_title: Astrocytes are central to neurotransmitter turnover of glutamatergic
  neurones.
caption: Astrocytes are central to neurotransmitter turnover of glutamatergic neurones.
  Glutamine is replenished in astrocytes by transamination of 2-oxoglutarate drawn
  from the TCA cycle, producing glutamate which GS then converts to glutamine. TCA
  cycle function is maintained largely by carboxylation of pyruvate (provided by glucose)
  by cytosolic pyruvate carboxylase forming oxaloacetate. This enters the cycle after
  hydrogenation to malate and transport into mitochondria. Oxaloacetate is also produced
  from aspartate generated by the malate-aspartate shuttle and makes an essential
  contribution to anaplerosis. Further anaplerotic support is provided by reuptake
  of GABA into astrocytes and its conversion to succinate. ① SLC1A3, alias excitatory
  amino acid transporter 1 (EAAT1; GLAST), SLC1A2, alias excitatory amino acid transporter
  2 (EAAT2, GLT1), ② SLC6A11 (GAT3), ③ Na+-amino acid cotransporters, SLC38A1 (SNAT1)
  and SLC38A2 (SNAT2), and Na+-amino acid cotransporters-H+ antiporters, SLC38A3 (SNAT3)
  and SLC38A5 (SNAT5). cAST cytoplasmic aspartate aminotransferase (alias GOT1 glutamic-oxaloacetic
  transaminase 1, cytoplasmic), GS glutamine synthetase, PC pyruvate carboxylase,
  OAA oxaloacetate, 2-oxoglut 2-oxoglutarate, cit citrate, isocit isocitrate, AcCoA
  acetyl CoA, LCFA long-chain fatty acids, LCFacylCoA, and C carnitine shuttle. Red
  lines, main route for glutamine synthess; solid blue lines, main anaplerotic pathway
  from glucose via pyruvate carboxylase; blue dotted lines anaplerosis from GABA via
  conversion to succinate
