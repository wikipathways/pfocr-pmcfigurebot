figure_title: Decreased HER2 gene copy number in DSR32 cells.
caption: Decreased HER2 gene copy number in DSR32 cells. (A) A ranked pathway with
  significance score is shown comparing DSR32 vs. H2170 cells. The significance score
  was calculated by the Affymetrix Transcriptome Analysis Console software version
  4.0.3. (B) Volcano plot of differential gene expression of DSR32 versus H2170 cells.
  Each point represents the average value of one transcript in two replicate experiments
  as revealed by microarray analysis. The X axis represents the linear fold change;
  Y axis represents −log10 p-values from the ANOVA. The expression difference is considered
  significant for a 2-fold change and a p-value of 0.05. Red-colored points indicate
  significantly enriched genes in DSR32 cells, and green-colored points indicate those
  in H2170 cells. Gray-colored points indicate no significant difference. (C) HER2
  copy numbers of H2170 and DSR32 cells, determined by NGS, are shown. (D) HER2 expression
  of whole-cell lysate of H2170, DSR26, and DSR32 cells was determined by a Western
  blot assay. The pixel densities of HER2 are shown as bar graphs relative to parental
  H2170 cells. (E) HER2 expression on cell surfaces of H2170 and DSR32 cells, measured
  by a flow cytometry. Mean HER2 molecule count per cell with the SD of three independent
  experiments is shown. t-test; * p < 0.05. (F,G) In xenograft mouse models of H2170
  (F) and DSR32 (G), tumors were treated with T-DXd (10 mg/kg triweekly) or vehicle.
  Each treatment group consisted of six mice. Data represent the mean ± SEM. Two-way
  ANOVA; ** p = 0.0002, *** p = 0.181
