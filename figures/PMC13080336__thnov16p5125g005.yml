figure_title: CEL reverses TGF-β-induced EMT and suppresses oncogenic signaling in
  lung cancer cells.
caption: CEL reverses TGF-β-induced EMT and suppresses oncogenic signaling in lung
  cancer cells. (A) H1299 cells were treated with TGF-β (5 ng/mL) for 24 h to induce
  EMT, followed by treatment with CEL (1 or 2 µM) for an additional 24 h. Western
  blot analysis revealed that CEL reversed TGF-β-induced mesenchymal changes, as shown
  by upregulation of epithelial markers (ZO-1, E-cadherin, claudin) and downregulation
  of mesenchymal markers (vimentin, β-catenin, N-cadherin). (B) A549 cells were treated
  with TGF-β and varying concentrations of CEL for 24 h. CEL treatment resulted in
  downregulation of KRAS and key oncogenic signaling molecules including phosphorylated
  AKT (pAKT), PI3K, c-Myc, and Smad4. These findings indicate that CEL effectively
  inhibits EMT progression and disrupts KRAS-mediated oncogenic and pro-survival pathways
  in NSCLC cells. H1299 and A549 cells were treated with TGF-β (5 ng/mL, 24 h) to
  induce EMT, followed by CEL (1 or 2 µM, 24 h). Gene expression analysis in H1299
  (A1-A6) and A549 (B1-B4) cells by qRT-PCR for validation of EMT and oncogenic signaling
  markers confirmed consistent transcript-level changes. (C, D) Western blot analysis
  of selected TGF-β-responsive and EMT-associated proteins shows that markers induced
  by TGF-β are reduced by both CEL and ExoCEL, in H1299 (C) and A549 (D) with ExoCEL
  producing a more consistent suppression across targets. Data are normalized to beta-actin
  and expressed as average ± SD (n = 3). Statistical differences were evaluated using
  one-way ANOVA followed by Bonferroni's multiple-comparison test (*p < 0.05, **p
  < 0.01, ***p < 0.001 vs. control)
