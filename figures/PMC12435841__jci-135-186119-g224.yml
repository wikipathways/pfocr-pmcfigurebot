figure_title: Developmental and transcriptomic analysis of human cerebral organoids
  derived from SNW1+/– hESCs
caption: (A) Schematic overview of the experimental design. hESCs were differentiated
  into NPCs over 12 days and into cerebral organoids over 45 days. NPCs cultured for
  18 days, cerebral organoids cultured for 18 days, and cerebral organoids cultured
  for 45 days were collected for bulk RNA-seq analysis. (B) GO biological process
  analysis of DEGs is shown, highlighting common enriched terms across the 3 groups
  (NPCs, day 18 organoids, and day 45 organoids). (C) KEGG pathway enrichment analysis
  of DEGs is presented, displaying shared enriched pathways among the 3 groups (NPCs,
  day 18 organoids, and day 45 organoids). (D) Reactome pathway enrichment circos
  plot for 45-day cerebral organoids. For each Reactome term around the circle (outermost
  ring), the adjacent ring shows upregulated (red) versus downregulated (teal) gene
  counts; the next inner ring shows –log10(P value) as a heat map; and the innermost
  ring displays gene ratio bars. (E) DisGeNET disease association circos plot for
  45-day cerebral organoids, plotted in the same concentric-ring format as in D
