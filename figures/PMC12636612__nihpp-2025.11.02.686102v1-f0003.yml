figure_title: Stimulation effects on counting depend on the current count
caption: 'a-f) Unilateral inhibition (500ms, 3–5mW, continuous) or excitation (500ms
  train duration, 10ms pulse width, 20–30hz, 5–7mW) of the hemisphere ipsilateral
  to the port was triggered by the 2nd or 5th press. a) Direct pathway inhibition
  and indirect pathway excitation both promoted reward port entry (direct pathway
  inhibition: paired t-test, p = 0.009, indirect pathway excitation: p = 0.0001).
  b) Without stimulation, the probability of a port entry increases with press number
  whereas the probability of another lever press decreased with press number (GtACR:
  n = 13; ChR2: n = 15). c) Direct pathway inhibition on the 5th press narrowed the
  distribution of counts of 5 but did not change the mean press count compared to
  no laser trials with a minimum of 5 presses (Paired t-test, p = 0.74). d) Indirect
  pathway inhibition on the 5th press caused a rightward shift in the distribution
  and significantly increased the press count compared to no laser trials with a minimum
  of 5 presses (Paired t-test, p = 0.016). e) Direct pathway excitation on the 5th
  press caused a rightward shift in the distribution and significantly increased the
  press count compared to no laser trials with a minimum of 5 presses (Paired t-test,
  p = 0.008). f) Indirect pathway excitation on the 5th press narrowed the distribution
  but did not significantly change the mean press count compared to no laser trials
  with a minimum of 5 presses (Paired t-test, p = 0.06). g) Direct pathway inhibition
  led to a greater probability of port entry when inhibition occurred on the 5th press
  (Two-way ANOVA, significant interaction F (1,6) = 14.57, p = 0.008. Fisher’s LSD
  post hoc tests revealed that there was a greater increase in port entry when stimulation
  was delivered on the 5th press (P2: p < 0.0124, P5: p < 0.0001). h) Indirect pathway
  inhibition increased pressing (Two-way ANOVA, significant interaction F (1,17) =
  6.917, p = 0.0198). Fisher’s LSD post hoc tests revealed that only inhibition on
  the 5th press increased pressing (P2: p > 0.05, P5: p = 0.0019, p = 0.0012). i)
  Direct pathway excitation increased pressing (Two-way ANOVA, significant interaction
  F (1,12) = 53.84, p = 0.0001. Fisher’s LSD post hoc tests revealed that excitation
  on the 5th press led to a greater increase in pressing (P2: p = 0.01, P5: p < 0.0001).
  j) Indirect pathway excitation on the 5th press increased port entry (Two-way ANOVA,
  significant interaction F (1,10) = 7.104, p = 0.0237. Fisher’s LSD post hoc tests
  revealed that excitation on the 5th press increased port entry (P2: p < 0.0012,
  P5: p < 0.0001). Data represents mean ± SEM. * p < 0.05, ** p < 0.01, **** p < 0.0001'
