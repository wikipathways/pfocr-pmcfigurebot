figure_title: The absence of HER2 expression at the protein level is not associated
  with its rapid degradation via the lysosomal pathway.
caption: The absence of HER2 expression at the protein level is not associated with
  its rapid degradation via the lysosomal pathway. Three different types of the human
  MSCs (MSCWJ-1, ECL 2455, and enMSC 2804) were subjected to 24 h treatment with lysosomal
  inhibitors Chloroquine (Chlq, C = 5 µM; 50 µM), or Bafilomycin A1 (BafA, 100 nM).
  Total cell lysates of these cells and the malignant SK-BR-3 cell line (served as
  HER2-positive control) were separated by SDS-PAGE and processed for Western blotting.
  Blots were stained with anti-EGFR, anti-HER2, anti-p62 (Abcam Inc., USA), anti-LC3A/B,
  and anti-alpha tubulin antibodies. The nitrocellulose membrane was stained with
  Ponceau S solution for total protein analysis and used as a loading control. The
  EGFR and HER2 Western blots were quantified and normalized against each line control
  cells (Ctrl) or SK-BR-3 in the case of HER2. Relative optical densities are presented
  as the means ± s.e of three independent experiments
