figure_title: Lipin3 can regulate the p21-Caspase 3/GSDME pathway by interacting with
  Sirt1.
caption: Lipin3 can regulate the p21-Caspase 3/GSDME pathway by interacting with Sirt1.
  (A) Co-IP analysis confirmed the interaction between Lipin3 and Sirt1 in HK2 cells.
  (B) Immunofluorescence staining showing the subcellular localization of Lipin3 and
  Sirt1 in HK2 cells. (C) Molecular docking results indicate that Sirt1 is a potential
  interacting protein of Lipin3. (D) WB analysis revealed the expressions of Sirt1
  in the kidney of WT mice (n = 5) and Lipin3-KO mice (n = 5) treated with or without
  cisplatin. (E) mRNA levels of Sirt1 in WT and Lipin3-KO PTECs treated with or without
  cisplatin. (F) WB analysis revealed the degradation rate of Sirt1 in WT and Lipin3-KO
  PTECs. (G) ChIP assays were performed in WT and Lipin3-KO PTECs using Sirt1-specific
  antibody. ChIP-qPCR showed the binding of Sirt1 protein to the p21 gene promoter
  in WT and Lipin3KO cells treated with cisplatin. IgG was used as a negative control.
  (H) Enrichment of p21 promoter was measured by qPCR. (I) CCK8 analysis showing the
  cell viability in Lipin3-KO PTECs transfected with Empty or Sirt1 followed by treating
  with or without cisplatin. (J) The levels of LDH in Lipin3-KO prim PTECs ary cells
  transfected with Empty or Sirt1 followed by treating with or without cisplatin were
  measured. (K) WB analysis revealed the expressions of Caspase 3, Cleaved-Caspase
  3, GSDME, N-GSDME in Lipin3-KO PTECs transfected with Empty or Sirt1 followed by
  treating with or without cisplatin. (L) Phase-contrast images of Lipin3-KO PTECs
  transfected with Empty or Sirt1 followed by treating with or without cisplatin.
  Arrows, pyroptotic cells
article_title: Lipin3 deficiency aggravates cisplatin induced acute kidney injury
