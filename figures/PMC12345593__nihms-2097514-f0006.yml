figure_title: Brain metabolism of ethanol
caption: 'The oxidation of alcohol in the brain involves the same three pathways as
  those described for the liver. However, the catalase pathway is the most important
  pathway in the brain, followed by CYP2E1, and ADH plays only a minimal role. In
  astrocytes: Ethanol is mostly metabolized to acetaldehyde by catalase and subsequently
  to acetate by ALDH2. Acetate is incorporated into the tricarboxylic acid (TCA) cycle
  as acetyl-CoA, contributing to glutamate synthesis. Glutamate is converted into
  glutamine by glutamine synthetase (GS) and transferred to neurons. In neurons: Ethanol
  is mostly oxidized to acetaldehyde by CYP2E1 in the endoplasmic reticulum, followed
  by conversion to acetate by ALDH1 in the cytosol. Acetate enters the TCA cycle as
  acetyl-CoA, contributing to glutamate synthesis. Glutamate is further converted
  to gamma-aminobutyric acid (GABA) via glutamic acid decarboxylase (GAD), modulating
  inhibitory neurotransmission. Importantly, glutamine supplied by astrocytes can
  be converted back to glutamate and GABA in neurons. Recent findings from preclinical
  models suggest that cerebellar astrocytic ALDH2-generated acetate mediates alcohol-induced
  elevation of GABA concentrations and its associated motor impairment (139). Created
  with BioRender.com'
