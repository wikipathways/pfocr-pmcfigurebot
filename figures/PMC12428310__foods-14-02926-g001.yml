figure_title: Mechanistic interplay of neuroinflammation in epilepsy and comorbid
  depression.
caption: Mechanistic interplay of neuroinflammation in epilepsy and comorbid depression.
  This figure illustrates the central role of neuroinflammation in the two-way relationship
  between epilepsy and depression, emphasizing key molecular and cellular mechanisms.
  Neuroinflammation causes an imbalance in glutamate and GABA, with HMGB1 contributing
  to neuronal hyperexcitability. It also activates the Kynurenine Pathway, resulting
  in serotonin depletion and the production of neurotoxic metabolites like quinolinic
  acid, which lead to mood dysregulation and seizures. Pro-inflammatory cytokines
  (TNF-α, IL-6, IL-1β) sustain this inflammation. Oxidative stress, via ROS and NF-κB
  activation, further intensifies neuroinflammation. Chronic neuroinflammation also
  disrupts the HPA axis and lowers neurogenesis and BDNF levels, worsening emotional
  issues and seizure risk. This complex interaction underscores neuroinflammation
  as a key link in the co-occurrence of epilepsy and depression
