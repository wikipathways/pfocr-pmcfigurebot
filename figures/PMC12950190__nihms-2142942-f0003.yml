figure_title: HOTT recapitulates features of the patient tumor microenviroment
caption: (A) Schematic of using HOTT nTME to benchmark patient tumor microenviroment
  (TME; left) and a violin plot (right) showing that annotating non-neoplastic nTME
  cells with a normal developing brain meta-atlas yields the highest similarity compared
  to normal adult or aged brain references. Applying these references to published
  patient glioblastoma datasets produced high predicted.id.score only with the developing
  brain atlas, suggesting tumor exposure reactivates developmental programs in surrounding
  cells and highlighting HOTT’s relevance for modeling the glioblastoma microenvironment.
  Data are shown as mean with 25% quartiles (in the box and whisker plot) with full
  range of values shown in the violin plot.(B) Bar graph of cell type scores annotated
  using the normal developing brain meta-atlas, showing high similarity between patient
  TME and HOTT nTME across all preserved cell types. Bars represent the mean predicted
  score for each cell type, and error bars indicate ±SD. Data are represented as mean
  ± SD.(C) Alluvial diagram illustrating shifts in TME cell annotations between normal
  developing and adult brain atlases. A random subset of HOTT nTME cells and publicly
  available patient TME cells were merged at a 1:1 ratio to generate this plot. High
  correlation is observed, with a notable correspondence between radial glia (developing
  brain atlas) and astrocyte/neuronal populations (adult brain atlas).(D) Density
  plots demonstrating concordance of major metabolic programs between HOTT nTME and
  patient TME (top panels), but not between HOTT nTME and normal adult brain (bottom
  panel).(E) Heatmap for outgoing signaling pathways via CellChat analysis reveals
  conserved prominent cell-cell interactions in both HOTT nTME (left) and patient
  TME (middle), which are absent in normal adult brain (right). Cell type contributions
  to each pathway are shown in columns, with totals at the top of each panel. No pooled
  data are shown.(F) Focusing on interactions between tumor and TME cells, strong
  preservation of top tumor-TME signaling pathways is observed in both HOTT nTME and
  patient TME. Light blue (HOTT) and red (patient) bars highlight signaling pathways
  targeted for functional validation. No pooled data are shown.See also Figure S3
