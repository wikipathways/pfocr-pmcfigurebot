figure_title: Regulatory mechanisms of DDR pathways involved in chemotherapy resistance
  in NSCLC.
caption: Regulatory mechanisms of DDR pathways involved in chemotherapy resistance
  in NSCLC. (A) Regulation of the HR pathway. ERβ1 enhances chemotherapy sensitivity
  by promoting G2-M cell cycle arrest via activation of checkpoint kinases CHK1/CHK2
  and upregulation of CCNG2. NPAS2 contributes to HR repair and chemoresistance by
  stabilizing H2AX mRNA, promoting γH2AX accumulation, and increasing phosphorylation
  of ATM and CHK2. ARRB1 functions as an upstream regulator of NPAS2 to promote its
  expression. RanBP9 is phosphorylated by ATM under genotoxic stress and translocates
  to the nucleus, where it stabilizes p21 through USP11-mediated deubiquitination,
  thereby maintaining cell cycle arrest independently of p53. RanBP9 may also interact
  with Tip60 or MDM2 to enhance p53 stability and function. (B) Regulation of the
  NER pathway. In the NER pathway, ERCC1 forms a repair complex with XPF to remove
  damaged DNA. High ERCC1 expression enhances DNA repair capacity and downregulates
  NDRG1, contributing to chemoresistance. NSCLC, Non-small Cell Lung Cancer; DDR,
  DNA Damage Response; HR, Homologous Recombination; NER, Nucleotide Excision Repair;
  ERβ1, Estrogen Receptor β1; CHK, Checkpoint Kinase; CCNG2, Cyclin G2; NPAS2, Neuronal
  PAS Domain Protein 2; ARRB1, Arrestin Beta 1; ATM, Ataxia Telangiectasia Mutated;
  RanBP9, Ran-binding Protein 9; USP11, Ubiquitin-specific Peptidase 11; MDM2, Murine
  Double Minute 2; ERCC1, Excision Repair Cross-complementation Group 1; NDRG1, N-myc
  Downstream-regulated Gene 1
