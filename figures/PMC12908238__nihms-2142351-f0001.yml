figure_title: The diversity of chimallivirus replication cycle pathways.
caption: The diversity of chimallivirus replication cycle pathways. All viruses in
  this family establish a phage nucleus within which DNA replication occurs. (a) The
  Pseudomonas phage ΦKZ family, including ΦKZ, ΦPA3, and 201φ2–1. In the ΦKZ family,
  the bacterial chromosome is rapidly degraded and the cell swells in the middle.
  A tubulin spindle (PhuZ, green filaments) rotates and positions the phage nucleus
  at midcell. Capsids traffic along PhuZ filaments to the nucleus in Pseudomonas phages.
  Mature virions assemble into clusters called phage bouquets. Other chimalliviruses
  such as Goslar, RAY, and Ariel also form a nucleus but show distinct variations
  in the pathway. (b) Escherichia coli phage vB_EcoM_Goslar (Goslar) PhuZ filaments
  form a cytoskeletal vortex that surrounds and rotates the phage nucleus. (c) Erwinia
  amylovora phage RAY does not degrade the chromosome, and (d) Vibrio parahaemolyticus
  phage Ariel does not encode a PhuZ protein
