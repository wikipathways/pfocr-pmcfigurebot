figure_title: MetaCore pathway enrichment analysis of ORMDL2 co-expression signature
  in GBM.
caption: MetaCore pathway enrichment analysis of ORMDL2 co-expression signature in
  GBM. (A) The top 25 enriched pathways generated by MetaCore enrichment analysis
  using ORMDL2 co-expressed genes (Spearman r ≥ 0.6). Pathways are ranked by -log(p)
  values, with the most significant pathways involving antigen presentation via MHC
  class I cross-presentation, mitochondrial apoptosis, TREM1/TLR signaling, and the
  PI3K/IL-5/NF-κB axis, all of which play key roles in tumor immunity and immune evasion.
  (B) MetaCore process network map highlighting the MHC class I antigen presentation
  pathway. Key ORMDL2-associated genes are mapped to compartments including endosomes,
  transport vesicles, and cytosolic antigen-processing machinery, indicating ORMDL2's
  potential indirect role in modulating immune recognition of GBM cells. Specific
  involvement is noted in vesicle recruitment (Rab27a), proteasome processing (PSMB
  family), and ER-Golgi transport. These findings support the hypothesis that ORMDL2
  regulates macromolecular immune networks in GBM, possibly influencing antigen processing
  and immune evasion
