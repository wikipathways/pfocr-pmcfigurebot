figure_title: Noise-Induced Epigenetic Reprogramming in Cardiovascular Disease. Transportation
  noise from road, rail, and aircraft activates central stress pathways, leading to
  systemic and molecular effects that promote cardiovascular disease. Acoustic stimulation
  activates the amygdala, hypothalamic–pituitary–adrenal (HPA) axis, and sympathetic
  nervous system (SNS), resulting in neuroendocrine stress responses, oxidative imbalance,
  and epigenetic reprogramming. These responses include DNA and histone methylation
  (Me1), which regulate inflammatory signaling pathways (e.g. CRP) and genes involved
  in cellular differentiation. In parallel, indirect redox regulation alters the expression
  of microRNAs (miR-134, miR-183) that suppress mRNAs encoding antioxidant defense
  proteins and other protective targets against coronary artery disease and depressive
  disorders. Collectively, these changes represent redox-sensitive, stress-mediated
  epigenetic mechanisms that link environmental noise exposure to vascular dysfunction,
  inflammation, and increased cardiovascular risk (designed with Biorender)
