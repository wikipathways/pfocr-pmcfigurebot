figure_title: Effects of PTEN on cardiac hypertrophy.
caption: 'Effects of PTEN on cardiac hypertrophy. (A) Venn diagram showing overlapping
  target genes between miR-141-3p and miR-200a-3p predicted using diverse databases.
  (B, C) GO enrichment and core pathway analyses of the 25 identified overlapping
  candidates. (D) qRT-PCR analysis of PTEN levels in iPSC-aCMs treated with Ang II
  at different concentrations (1, 2.5, and 5 μM). (E, F) qRT-PCR analysis of PTEN,
  ANP, BNP, and β-MHC levels in the indicated groups. Data are normalized to GAPDH
  levels. (G, H) Representative immunofluorescence images of α-actinin (green)- and
  Hoechst 33342 (blue)-stained iPSC-aCMs along with quantified data showing cell surface
  area. Scale bar = 50 μm. Ang II was used at 2.5 μM unless otherwise indicated. *Compared
  with the control group, *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. #Compared
  with the Ang II-treated group, #P < 0.05. GO, gene ontology; Ang II, angiotensin
  II; siNC, negative control siRNA; siPTEN, PTEN siRNA'
