figure_title: Modulatory effect of EVs-Chry on caspase-1.
caption: 'Modulatory effect of EVs-Chry on caspase-1. EVs-Chry modulate the expression
  of caspase-1, which is associated with the inflammasome pathway and appears increased
  in response to LPS stimulation, where it facilitates the release of IL-1β. Detection
  of caspase-1 expression by Western blotting and densitometric analysis. Data are
  expressed as mean ± standard deviation (SD). *** p < 0.001 vs. control. ### p <
  0.001 vs. LPS group'
