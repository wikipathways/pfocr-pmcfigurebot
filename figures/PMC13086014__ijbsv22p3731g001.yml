figure_title: Identification of B7-H3 related variations in NSCLC.
caption: Identification of B7-H3 related variations in NSCLC. (A) Overall survival
  (OS), post-progression survival (PPS), and first-progression survival (FPS) for
  patients with low or high levels of B7-H3 expression by Kaplan-Meier analysis. The
  data were generated from the TCGA database. (B) Heatmap of genes differentially
  expressed upon B7-H3 knockdown. (C) Volcano plot of differentially expressed genes;
  blue indicates downregulated genes and red denotes upregulated genes. Gene Ontology
  (GO) (D) and Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway analyses (E)
  were performed to investigate the biological functions and pathways associated with
  B7-H3-mediated differential gene expression
