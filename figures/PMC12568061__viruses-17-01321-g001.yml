caption: The PI3K/Akt/mTOR signaling pathway regulates autophagy and lipid metabolism,
  showing complex interactions during Orthoflavivirus infection. Nonstructural proteins
  from DENV (NS4A), DENV-2 (NS1), JEV (NS1, NS2A), and ZIKV (NS4A, NS4B) modulate
  distinct points of the PI3K/Akt/mTOR pathway, regulating processes such as autophagy
  and lipogenesis to support viral replication. The arrows indicate the activation
  of the signaling pathway. The inhibitor lines indicates the inhibition of the signaling
  pathway
