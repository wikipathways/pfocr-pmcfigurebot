figure_title: Chromosome 12p arms show a high propensity for bridging in anaphase
  cells and show disrupted subtelomeres, providing a pathway for the generation of
  trisomy 12 cells
caption: '(A) Chromosome 12 in diploid and trisomic metaphase spreads after labeling
  with whole chromosome 12 probes used to analyze the length of 12p and 12q arms.
  The overlays merge DNA (grey) and chromosome 12 (red). Maximum intensity projections
  are shown. Scale bars = 2 µm. (B) Quantification of 12p and 12q arm lengths in diploid
  and trisomic metaphase spreads labeled with whole chromosome 12 probes. The 12p
  arm measured 1.16 ± 0.21 µm (mean ± S.D.) and the 12q arm measured 2.85 ± 0.60 µm
  (mean ± S.D.). Each dot on the graph represents the length of a single arm. The
  n values represent the number of measured arms. Data presented as mean ± SD; p values
  were determined by unpaired two-tailed Student’s t-test and unpaired two-sided Mann-Whitney
  U test. P-values are as follows: * p=0.0313, **** p<0.0001, ns = not significant.
  Normality was assessed using the Shapiro-Wilk test. (C) The total length of both
  bridging chromosome 12 arms (4.91 ± 0.63 µm; mean ± S.D.) compared to the doubled
  12q arm length in the metaphase spreads. Bridging arms were significantly shorter
  than the doubled 12q arms. Each dot on the graph represents the length of two arms.
  Data presented as mean ± SD; p value was determined by unpaired two-sided Mann-Whitney
  U test, ** p=0.0097. Normality was assessed using the Shapiro-Wilk test. (D) Comparison
  of measured bridging 12p arm length to the predicted bridging 12q length after applying
  the average p-arm stretch ratio. If bridges originated from 12q, their expected
  length would be ~5.9 µm. Each dot on the graph represents the length of a single
  arm. Data presented as mean ± SD; p value was determined by unpaired two-sided Mann-Whitney
  U test, **** p<0.0001. Normality was assessed using the Shapiro-Wilk test. (E) Examples
  of chromosome 12 bridges in transition passage anaphase cells. The overlays merge
  DNA (grey) and chromosome 12 centromere (red). Single z-slices focused on the bridged
  chromosome 12 chromatids are shown. Scale bars = 10 µm. (F) Percentages of retained
  chromosome 12 subtelomeric regions in diploid, parental WTC-11 cells, and AICS-0012
  cells before, during and after trisomy 12 takeover. The n values represent the number
  of analyzed 12p and 12q subtelomeres. (G) Passaging history of the diploid, parental
  WTC-11 cell line during the development of the AICS-0012 cell line and further passaging
  of the AICS-0012 cell line through the initial appearance and takeover of trisomy
  12. (H) and (I) Representative images of metaphase chromosomes labeled with 12p
  and 12q subtelomeric probes in the diploid WTC-11 cells, and diploid and transition
  passages of the AICS-0012 cell line. Red arrows indicate 12p arms lacking subtelomeric
  signals and white boxes show enlargements of chromosomes missing 12p subtelomeric
  repeats. DNA is labeled in grey and the overlays merge DNA (blue) and chromosome
  12 subtelomeres (red). Maximum intensity projections are shown. Scale bars = 10
  µm. Scale bars in the enlarged regions = 2 µm. (J) Sequence of cell cycle events
  generating new chromosome 12 trisomic cells. When trisomy 12 takes over the culture,
  bridging chromosome 12p arms create one chromosome 12 monosomic cell that will not
  survive, and another daughter cell, where, in some cases, a chromosome 12 chromatid
  generates a micronucleus. This chromosome 12 trapped in the micronucleus fails to
  replicate properly in the next S phase. The resulting G2 cell has 2.5 copies (5
  chromatids) of chromosome 12. This would generate a metaphase cell with one unpaired
  chromatid, and a 3:2 anaphase, both of which we observed in the transition passages.
  This 3:2 anaphase would generate a new chromosome 12 trisomic cell. (K) Trisomy
  12 outgrowth modeled by incorporating the doubling time differences and an additional
  variable of 1% of diploid cells converting to trisomic at each cell division. After
  applying this variable, the mathematical model showed 80% of trisomy 12, closer
  to the observed trisomy 12 dominance'
