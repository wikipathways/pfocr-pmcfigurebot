caption: Mazdutide suppresses ER stress via the PERK pathway in MASLD mouse liver
  tissue. (A) Representative immunohistochemical staining of GRP78 and CHOP in liver
  sections (scale bar = 50 μm, 200× magnification). (B) Representative Western blot
  images of key proteins in the PERK pathway from each experimental group. (C) Quantitative
  densitometric analysis of PERK and eIF2α phosphorylation (presented as the p-PERK/PERK
  and p-eIF2α/eIF2α ratios) and the protein levels of GRP78, ATF4, and CHOP. All values
  were normalized to β-actin. Data are presented as the mean ± SD (n = 5). a p < 0.05
  vs. the NCD group; b p < 0.05 vs. the HFD group. Animal groups are defined in Figure
  1
