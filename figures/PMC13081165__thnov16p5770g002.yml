figure_title: Functional enrichment analysis of DEGs in BMSCs induced by collagen
  hydrogel for 7, 14 and 21 days.
caption: Functional enrichment analysis of DEGs in BMSCs induced by collagen hydrogel
  for 7, 14 and 21 days. (A and B) KEGG pathway enrichment analysis of up-DEGs (A)
  and down-DEGs (B) in 7, 14 and 21 days. (C) Venn diagram showed the intersection
  of DEGs among days 7, 14, and 21 groups. (D) Pathway enrichment analysis of the
  611 intersecting DEGs identified in (C). (E) Protein-protein interaction network
  of genes enriched in AMPK/mTOR signaling pathway. (F) Venn diagram illustrated the
  intersection between DEGs and ARGs. (G) Pearson correlation analysis between POU5F1
  and ARGs. (H) Heatmap showed expression profiles of POU5F1 and ARGs at different
  culture time points. (I-K) Scatter plots depicted correlations between POU5F1 and
  AMBRA1 (I), RB1CC1 (J) and ULK1 (K)
