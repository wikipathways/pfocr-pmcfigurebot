figure_title: Early-stage assembly pathway of rH174 and rH14 nanoribbon
caption: '(a) Negatively stained TEM image of rH174 assembly at Day 9 reveals a typical
  intermediate stage where disordered aggregates, proto-nanoribbons, and ordered nanoribbons
  coexist. Scale bar, 250 nm. Down: Higher magnification images highlight the process
  where inter-ribbon interactions prompt structural conversion into ordered nanoribbons
  via surface-templated secondary nucleation (indicated with red arrows). Scale bars,
  125 nm. (b) TEM image of rH146 assembly at Day 2 exhibits a mixture of disordered
  aggregates and nanoribbons. Scale bar, 250 nm. (c) Representative TEM images of
  rH146 assembly at Day 2 reveal further details of the structural transformation
  process. Disordered aggregates and the ordered domain of proto-ribbons are highlighted
  with red circles and red arrows, respectively. Scale bars, 50 nm. (d) TEM images
  showing elongation at nanoribbon ends. Scale bars, 50 nm. (e) TEM image showing
  secondary nucleation and growth along nanoribbon surfaces. Scale bar, 100 nm. (f)
  TEM images illustrating proposed transitions during early assembly, including primary
  nucleation from oligomers and proto-nanoribbons, and surface-templated secondary
  nucleation. The dynamic nature of the intermediate stage allows these processes
  to occur simultaneously. (g) AFM height images of rH174 illustrate the progression
  from spherical and worm-like oligomeric aggregates to proto-nanoribbons, ultimately
  giving rise to elongated nanoribbons. Secondary nucleation and elongation are evident,
  reflecting the self-templating nature of rH174 assembly. Scale bar, 20 nm. (h) AFM
  height images of rH146 reveal similar conformational conversion, where early nucleation
  events rapidly generate nanoribbons that elongate efficiently but exhibit minimal
  engagement in surface-templated secondary nucleation. Scale bar, 20 nm. (i) Average
  height values were obtained from AFM line profiles drawn along assemblies (indicated
  by yellow dashed lines in the corresponding AFM images). Both rH174 and rH146 showed
  that the transition from proto-ribbons to nanoribbons is accompanied by marked changes
  in height, with nanoribbons appearing flatter and more uniform compared to the taller,
  irregular oligomeric precursors. (j) Amide I (1600 – 1700 cm−1) FTIR absorption
  spectrum bands of rH174 and rH146 were analyzed in relation to their predominant
  morphological states: disordered oligomers (Day 2 for rH146; Day 9 for rH174) and
  nanoribbons (Day 4 for rH146; Day 15 for rH174). Progressive shifts from a random
  coil–dominated signal toward β-sheet–enriched profiles indicate increased structural
  ordering during self-assembly'
