figure_title: A model for Hippo and Warts signaling in C. elegans
caption: (A) In epithelium a canonical Hippo pathway functions, with potentially redundant
  CST-1 and CST-2 phosphorylating and activating WTS-1. WTS-1 in turn phosphorylates
  and inhibits YAP-1, keeping it out of the nucleus. Disruption of CST-1/2 or WTS-1
  results in nuclear translocation of YAP-1. Rather than contributing to activation
  of WTS-1 to repress YAP-1, MIG-15 inhibits YAP-1 protein levels. (B) In intestine
  a non-canonical Hippo pathway functions. Unknown upstream inputs regulate WTS-1
  to inhibit and retain YAP-1 out of the nucleus. Loss of WTS-1 causes nuclear translocation
  of YAP-1 but also L2 arrest, indicated as “Growth.” CST-1/2 and MIG-15 act redundantly
  to maintain growth via unknown mechanisms, since their loss does not cause tagged
  YAP-1 to enter the nucleus
article_title: Caenorhabditis elegans Uses Canonical and Non-canonical Hippo signaling
