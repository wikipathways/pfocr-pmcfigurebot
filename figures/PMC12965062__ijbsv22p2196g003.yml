figure_title: Trimetazidine reduces mitochondrial and inflammatory stress-associated
  cell populations in dysglycemic pancreatic tissue.
caption: 'Trimetazidine reduces mitochondrial and inflammatory stress-associated cell
  populations in dysglycemic pancreatic tissue. (A) Uniform Manifold Approximation
  and Projection (UMAP) of scRNA-seq data from pre-diabetic mice, showing six major
  pancreatic cell clusters: acinar cells, mitochondrially active stromal cells, stressed
  cells, ductal cells, endothelial cells, and immune cells. (B) Clustergrammer heatmap
  illustrating cluster-specific gene expression profiles. Genes enriched in mitochondrially
  active stromal cells and stressed cells are highlighted. (C) Reactome pathway enrichment
  analysis (via Enrichr) of genes significantly upregulated in mitochondrially active
  stromal cells. (D) Reactome pathway enrichment analysis based on the heatmap-defined
  gene cluster and significantly upregulated genes in stressed cells. (E) UMAPs showing
  pancreatic cells from control and TMZ-treated pre-diabetic mice. (F) Statistical
  analysis of cluster-specific cell frequency changes in TMZ-treated animals'
