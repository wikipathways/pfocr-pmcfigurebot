figure_title: Screening and analysis of key metabolites and pathways.
caption: 'Screening and analysis of key metabolites and pathways. (a) Key metabolites
  predicted by machine learning models constructed using the random forest algorithm.
  The horizontal axis represents the importance score of species for the classifier
  model, while the vertical axis shows the names of metabolites. (b) KEGG pathway
  analysis. Based on the KEGG enrichment analysis results for differentially expressed
  metabolites, the top 15 pathways with the smallest p-values (i.e., most significantly
  enriched) were selected for display: The x-axis represents −log10 (p value), and
  the y-axis represents KEGG Pathway. (c) Key Compounds and Pathways in Glycerophospholipid
  Metabolism. (d) Heatmap of relative abundance of metabolites enriched in each group.
  The relative abundance levels in the figure are represented by different colors,
  with greener hues indicating higher expression. Columns denote groups, while rows
  represent metabolite names'
