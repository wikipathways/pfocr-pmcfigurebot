figure_title: Requirement of Ugalt for mucin-type O-glycosylation.
caption: 'Requirement of Ugalt for mucin-type O-glycosylation. (A) Exon–intron structure
  of three splicing variants of Ugalt (upper), DNA sequence analysis of UgaltKz15
  heterozygous (UgaltKz15/+) mutants generated by CRISPR-Cas9 (lower left), and expected
  translational products from wild-type Ugalt (UgaltWT) and UgaltKz15 alleles (lower
  right). In the UgaltKz15 allele, 9 bases (GTAGCGTCG) were inserted into a site 3
  bases upstream of the PAM sequence in place of 5 bases (CCGCA) in UgaltWT. The UgaltWT
  allele produces two WT proteins, UgaltWT-PA/PC (357 aa) and UgaltWT-PB (368 aa),
  from Ugalt-RA/RC and Ugalt-RB, respectively. The UgaltKz15 allele produces two truncated
  proteins, UgaltKz15-PA/PC (p.Arg34*) and UgaltKz15-PB (p.Arg45*), due to the nonsense
  mutation. (B) Biosynthetic pathway of mucin-type O-glycans in Drosophila. The multiple
  transmembrane protein Ugalt is localized to the Golgi membrane, where it transports
  nucleotide-sugars including uridine diphosphate-N-acetylgalactosamine (UDP-GalNAc)
  and UDP-galactose (UDP-Gal) from the cytoplasm to the Golgi lumen in exchange for
  uridine monophosphate (UMP) derived from UDP, a by-product of the glycosyltransferase
  reaction. UDP-GalNAc is a donor substrate for polypeptide N-acetylgalactosaminyl-transferases
  (GALNTs), which transfer GalNAc to the serine or threonine residue of a core-protein
  via an α1-linkage to synthesize Tn antigen. UDP-Gal is a donor substrate for Drosophila
  core 1 β1,3-galactosyltransferase 1 (dC1GalT1), which transfers Gal to GalNAc of
  Tn antigen in a β1,3-linkage to synthesize T antigen. Drosophila β1,3-glucuronyltransferase-P
  (dGlcAT-P) subsequently transfers glucuronic acid (GlcA) to the Gal residue of T
  antigen in a β1,3-linkage to synthesize glucuronylated T antigen. (C) Relative mRNA
  levels of Ugalt in Ugalt knockdown 1 (KD1) and Ugalt KD2 larvae using Act5C-Gal4.
  mRNA levels were normalized to RpL32 mRNA, and that of Ugalt in the control (Act5C-Gal4/+)
  larvae was set as 1.0. Data are the mean ± standard error for each genotype (n =
  3). (D) PNA (left) and HPA (right) lectin blot analyses of proteins extracted from
  the body walls of control, KD1, and KD2 larvae. The α-tubulin internal control is
  shown below. A representative example of three experiments is shown. Original lectin
  blot and Western blot images can be found in Figure S4. (E,F) Relative band intensity
  of PNA (E) and HPA (F) normalized to the band intensity of α-tubulin. The intensities
  of bands indicated by arrowheads in (D) were measured. Data are the mean ± standard
  error for each genotype (n = 3). In (C,E,F), statistical significance was assessed
  by Dunnett test: * p < 0.05; ** p < 0.01, n.s., not significant'
