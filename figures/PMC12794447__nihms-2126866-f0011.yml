figure_title: Western Blot Assays for Akt/mTOR Pathway.
caption: Western Blot Assays for Akt/mTOR Pathway. (A) Representative immunoblot of
  synaptoneurosome fraction showing key components of the AKT-mTOR pathway. Protein
  levels of total and phosphorylated states of Akt (B-D), mTOR (E-G), S6K1 (H-J),
  and eIF4E (K-M) were evaluated by western blot in synaptoneurosomes. The bands were
  normalized to β-actin as loading control. All graphs represent the mean ± SEM of
  each experimental group. *P<0.05, (n = 3 – 5 per condition). The results suggest
  a synaptic activation of the mTOR pathway in the vHPC of animals administered with
  the miR-17-5p mimic
