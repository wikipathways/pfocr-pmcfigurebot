figure_title: Loss of citric acid cycle metabolites leads to cellular injury during
  NMP
caption: (A) Metabolomics of tissue before vs. after NMP with consensus buffer showed
  24 significantly upregulated and 55 significantly downregulated metabolites. (B)
  Metabolite organelle mapping identified mitochondria, peroxisomes and ER as the
  3 top organelles predicted to be affected by NMP with consensus buffer. (C) Pathway
  analysis on metabolomics results returned mainly downregulation of citric acid cycle
  products. (D) Metabolites from the citric acid cycle showed global downregulation
  by perfusion. Multiple unpaired t tests were used for statistical analysis
