figure_title: Systemic therapies for lung cancer and their main mechanisms of action.
caption: 'Systemic therapies for lung cancer and their main mechanisms of action.
  DNA-damaging chemotherapy includes agents that directly interfere with DNA structure
  or replication, inducing genomic damage and cell death. Platinum compounds (cisplatin
  and carboplatin) form DNA crosslinks, while antimetabolites (pemetrexed and gemcitabine)
  impair DNA synthesis. Topoisomerase inhibitors (etoposide, topotecan, and irinotecan)
  disrupt DNA unwinding and repair, leading to replication stress and apoptosis. Microtubule-targeting
  chemotherapy acts on the mitotic spindle, preventing proper chromosome segregation
  and inducing mitotic arrest. Taxanes (paclitaxel and docetaxel) stabilize microtubules,
  whereas vinca alkaloids (vinorelbine) inhibit microtubule polymerization, both ultimately
  blocking cell division. (EGFR TKIs selectively inhibit the intracellular kinase
  domain of the epidermal growth factor receptor, blocking downstream signaling pathways
  that promote tumor cell proliferation and survival in EGFR-mutant lung cancers.
  ALK/ROS1/NTRK TKIs target constitutively active fusion proteins generated by chromosomal
  rearrangements; these small-molecule inhibitors block the kinase activity of the
  aberrant fusion proteins, thereby suppressing oncogenic signaling without affecting
  protein expression. MET and RET TKIs target aberrantly activated receptor tyrosine
  kinases located at the cell membrane; capmatinib and tepotinib inhibit dysregulated
  MET signaling, while selpercatinib and pralsetinib selectively inhibit RET-driven
  oncogenic pathways, preventing downstream signal transduction that promotes tumor
  growth and survival. KRAS G12C inhibitors directly target the mutant KRAS protein
  in the cytoplasm; sotorasib and adagrasib covalently bind to the KRAS G12C mutant,
  locking it in an inactive state and thereby suppressing downstream proliferative
  signaling. PD-1/PD-L1 inhibitors are immune checkpoint inhibitors that restore antitumor
  immune responses by blocking the interaction between PD-1 on T cells and PD-L1 on
  tumor cells, releasing immune inhibition and promoting T-cell-mediated tumor cell
  killing. Other targeted therapies comprise agents with distinct or multimodal mechanisms
  of action, including antibody–drug conjugates such as fam-trastuzumab deruxtecan-nxki,
  which deliver cytotoxic payloads directly to tumor cells, bispecific antibodies
  such as tarlatamab that redirect immune cells toward cancer cells, and lurbinectedin,
  a DNA-binding transcriptional inhibitor that suppresses oncogenic transcription
  and modulates the tumor microenvironment. Abbreviations: EGFR, epidermal growth
  factor receptor; ALK, anaplastic lymphoma kinase; ROS1, ROS proto-oncogene 1 receptor
  tyrosine kinase; NTRK, neurotrophic tyrosine receptor kinase; MET, mesenchymal–epithelial
  transition factor; RET, rearranged during transfection; KRAS, Kirsten rat sarcoma
  viral oncogene homolog; PD-1, programmed cell death protein 1; PD-L1, programmed
  death-ligand 1; TKI, tyrosine kinase inhibitor. Created in BioRender. Silva, P.
  (2026). https://BioRender.com/wf8y907 (accessed on 22 January 2026)'
