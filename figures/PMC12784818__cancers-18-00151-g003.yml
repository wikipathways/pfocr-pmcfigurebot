figure_title: Schematic illustration of the multifaceted roles and targeting potential
  of CAFs in PCa.
caption: 'Schematic illustration of the multifaceted roles and targeting potential
  of CAFs in PCa. CAFs are key stromal components within the TME that actively contribute
  to prostate cancer progression through multiple mechanisms, including secretion
  of pro-tumorigenic cytokines (e.g., IL-6, CXCL8, CXCL13), remodeling of the ECM,
  modulation of angiogenesis-related genes, and metabolic support via cholesterol
  and steroid biosynthesis. CAF-derived TGF-β and chemokines activate downstream RAS
  and WNT signaling pathways in prostate cancer cells, enhancing oncogenic signaling
  (PI3K/AKT, STAT3, MAPK) and promoting cell proliferation, migration, and survival.
  Under androgen receptor signaling inhibition (ARSi), compensatory mechanisms such
  as neuroendocrine differentiation, hypoxia-induced factor activation, and immune
  evasion (reduced lymphocyte recruitment) are stimulated, thereby sustaining tumor
  growth despite androgen deprivation. CAFs further contribute to angiogenesis through
  upregulation of VEGF and stromal genes (HMGCS2, AKR1C3, SRFP1). Adapted from Owen,
  Jasmine S et al. Cancer-Associated Fibroblast Heterogeneity, Activation and Function:
  Implications for Prostate Cancer. Biomolecules. Copyright © 2024 by the authors
  [133]. This article is an open access article distributed under the terms and conditions
  of the Creative Commons Attribution (CC BY) license'
