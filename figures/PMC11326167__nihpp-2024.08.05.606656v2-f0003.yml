figure_title: Experiment II. Cocaine-administering rats received greater reinforcers
  than saline controls
caption: 'A) Experimental timeline for behavior, immunoprecipitation, and RNASeq.
  Rats were euthanized in a synchronized manner to align withdrawal days 1 and 45.
  B) Quantification of active lever presses for saline and cocaine groups across self-administration.
  C) Infusion counts shown for saline and cocaine groups throughout self-administration.
  (p < 0.05). Differential gene expression in nucleus accumbens gene expression after
  saline or cocaine operant self-administration and 1 or 45 day(s) of home cage abstinence.
  Volcano plots displaying the total number of significant differentially expressed
  genes (DEGs) in experimental group comparisons including cocaine vs. saline at withdrawal
  day (WD1) (D), cocaine vs. saline at WD45 (E), saline WD45 vs. saline WD1 (F), cocaine
  WD45 vs. cocaine WD1 (G) (nonsignificant: gray, significant downregulated DEGs:
  blue, and significantly upregulated DEGs: red) (FDR p-value cutoff of ≤ 0.05). Pathway
  enrichment analysis displaying most significant cellular pathways between saline-administering
  (H) and cocaine-administering (I) rats across abstinence (WD45 vs. WD1). Downregulated
  pathways are shown in blue and upregulated pathways shown in red (adjusted p-value
  < 0.05). (J) Venn diagram showing the total number of significant DEGs detected
  within saline and cocaine groups across time (WD45 vs. WD1)'
article_title: Investigating cocaine- and abstinence-induced effects on astrocyte
