figure_title: The role of m6A writer and eraser proteins in NAFLD.
caption: The role of m6A writer and eraser proteins in NAFLD. In NAFLD, Mettl3 promotes
  disease progression by stabilizing Ddit4 mRNA to activate the mTor pathway and enhancing
  Tgf-β1 mRNA to drive liver fibrosis, while Mettl14 accelerates NAFLD by increasing
  Kat3b-mediated Nlrp3 expression. Conversely, Mettl3 inhibits hepatic lipid metabolism
  through Cd36 and Ccl2 regulation, Rbm15 reduces oxidative stress by destabilizing
  Rnf5 mRNA, and Fto attenuates NAFLD progression by suppressing Srebf1 mediated lipogenesis
article_title: Unveiling the dynamics and therapeutic potential of m6A methyltransferases
  and demethylases in liver diseases
