figure_title: Functional annotation of proteins isolated from REIUS-derived extracellular
  vesicles.
caption: Functional annotation of proteins isolated from REIUS-derived extracellular
  vesicles. (A) Gene Ontology (GO) annotation of identified proteins categorized into
  biological process, cellular component, and molecular function. Enriched categories
  include protein binding, exosomal localization, and nucleic acid-associated functions.
  Statistical significance was determined using DAVID’s modified Fisher’s exact test
  with Benjamini–Hochberg correction for multiple testing (FDR < 0.05). (B) KEGG pathway
  analysis of identified proteins, highlighting predominant involvement in metabolic
  pathways, ribosome function, and biosynthesis of antibiotics, with further subcategorization
  of metabolic processes. Pathways with a false discovery rate (FDR) < 0.05, adjusted
  by the Benjamini–Hochberg method, were considered statistically significant. (C)
  Word cloud representation highlights the most frequent molecular functions and protein
  classes among the dataset, emphasizing binding, receptor, kinase, and ribosomal
  proteins. Word colors are for visual clarity only and do not represent any specific
  meaning. (D) The DFS workflow for identifying function-specific extracellular vesicle
  (EV) proteins. EV protein candidates (x) are filtered by subtracting proteins found
  in a “Healthy EV” reference database to yield non-scaffold proteins (y). These are
  then cross-referenced with a function-specific database to identify function-specific
  EV proteins (z). The process can be iteratively repeated for sub-functions
