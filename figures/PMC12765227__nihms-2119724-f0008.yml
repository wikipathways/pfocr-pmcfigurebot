figure_title: 'Proposed model: KHK regulates ER proteostasis by promoting IRE1α–XBP1-mediated
  adaptation and suppressing PERK–CHOP-driven apoptosis'
caption: Schematic illustration summarizing the dual role of KHK in nutrient-stressed
  hepatocytes. Under fructose + PA overload, KHK expression supports activation of
  IRE1α, splicing of Xbp1, and induction of ER chaperones, enabling adaptive proteostasis.
  In the absence of KHK (e.g., siKhk conditions), this protective pathway is impaired,
  leading to PERK activation, phosphorylation of eIF2α, induction of Chop and Dr4,
  and activation of the apoptotic cascade via caspase-8 and caspase-3. This shift
  results in increased protein aggregation and hepatocyte death
article_title: 'Beyond fructolysis: Ketohexokinase Orchestrates ER Proteostasis in
  Nutrient-Stressed Hepatocytes'
