figure_title: PSAP in Alzheimer’s disease (AD).
caption: PSAP in Alzheimer’s disease (AD). PSAP has multiple roles in Alzheimer’s
  disease (AD) from early Aβ pathology to late tau-mediated neurodegeneration. (A)
  In early stages, PSAP accumulates in dystrophic neurites surrounding Aβ plaques,
  where lysosomes enriched with Sap C and LAMP1 exhibit impaired hydrolase activity
  (e.g., absence of cathepsin-B/D), leading to lysosomal membrane permeabilization
  (LMP) and neuronal death. Concurrently, PSAP interacts with progranulin (PGRN) in
  neurons and microglia, promoting PGRN oligomerization and its pathological sequestration
  within Aβ plaques, thereby diminishing the neuroprotective and anti-inflammatory
  functions of PGRN. (B) As AD progresses to tau-dominated stages, PSAP expression
  declines in neurons harboring neurofibrillary tangles (NFTs), disrupting its interaction
  with PGRN and exacerbating tau hyperphosphorylation and aggregation, which ultimately
  promotes NFT formation, compromises PGRN-mediated neuroprotection and anti-inflammatory
  functions, and accelerates neurodegeneration and cognitive decline. (C) Therapeutic
  intervention with the PSAP-derived peptide PS18 counteracts Aβ toxicity by activating
  the PI3K/Akt pathway to suppress GSK-3β/α activity, shifting amyloid precursor protein
  (APP) processing toward non-amyloidogenic pathways, and enhancing hippocampal neurogenesis
  through regulation of progenitor cell proliferation, survival, and differentiation.
  PS18 further mitigates apoptosis by modulating Bcl-2/BAX balance, preserving mitochondrial
  integrity, and inhibiting caspase-3 activation. PSAP emerges as a critical regulator
  of lysosomal dysfunction, protein aggregation, and neuroinflammation, with its dual
  roles in early Aβ pathology and late tauopathy, highlighting its potential as a
  multi-target therapeutic candidate for AD. Created with BioRender.com
