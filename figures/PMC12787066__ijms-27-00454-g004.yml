figure_title: DB03476 inhibits Tlr4 pathway enrichment and macrophage infiltration/polarization
  in the kidneys of AKI mice.
caption: DB03476 inhibits Tlr4 pathway enrichment and macrophage infiltration/polarization
  in the kidneys of AKI mice. (A) RNA-seq analysis showed significant differences
  in multiple TLR4-enriched signaling pathways between the saline group and DB03476-treated
  group in renal tissues of the AKI model. (B,C) Immunofluorescence staining for iNOS
  and Arg1 in drug-treated renal tissues. (D) Immunofluorescence staining for F4/80
  in drug-treated renal tissues. Bars = 80 μm. (E) The protein level of F4/80 in drug-treated
  renal tissues was detected by Western blotting. The sample size was n = 3 per group.
  Data are presented as mean ± SEM. ** p < 0.01, **** p < 0.0001
article_title: A Novel TLR4 Inhibitor DB03476 Rescued Renal Inflammation in Acute
