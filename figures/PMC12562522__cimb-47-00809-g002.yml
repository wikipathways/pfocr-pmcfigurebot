figure_title: Pharmacological analysis reveals that HCX3 exhibits potential anti-ALI
  effects.
caption: Pharmacological analysis reveals that HCX3 exhibits potential anti-ALI effects.
  (A) HCX3 target genes were retrieved from multiple databases and intersected with
  ALI-related genes. (B) The HCX3-ALI-target networks was constructed and visualized
  using Cytoscape 3.10.2 software. (C) A PPI network was established to illustrate
  the target interactions and identify hub proteins. (D) GO enrichment analysis identified
  significantly enriched BPs, CCs, and MFs associated with HCX3 targets. (E) KEGG
  pathway analysis revealed enriched signaling pathways associated with HCX3 target
  genes. (F) RAW 264.7 cells were exposed to varying concentrations of HCX3, and then
  cell viability was assessed using the CCK8 assay after 24 h. (G) RAW 264.7 cells
  were exposed to varying concentrations of HCX3, followed by LPS stimulation, and
  cell viability was evaluated using CCK8 assay after 24 h. Data in (F,G) are expressed
  as mean ± SEM (n = 3) (* = p < 0.05, ns = not significant compared to the control
  group)
