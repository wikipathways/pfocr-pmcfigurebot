figure_title: eQTL colocalization and integrated evidence for prioritized genes
caption: 'A, Dot plot showing gene–tissue pairs with evidence of colocalization between
  SCAD MTAG association signals and GTEx v10 cis-eQTLs at loci that are newly associated
  with SCAD. Columns correspond to genes and rows to tissues. For each gene, the plotted
  variant is the top candidate SNP, defined as the variant that minimises the product
  of the SCAD MTAG and eQTL P-values for that gene. Each circle represents the eQTL
  association of this variant with gene expression in a given tissue; circle colour
  indicates the eQTL Z-score aligned to the SCAD risk-increasing allele (red, higher
  expression with the risk allele; blue, lower expression), as shown on the colour
  scale. Circle size reflects the strength of the eQTL signal. Circles outlined in
  black mark gene–tissue pairs with strong support for a shared causal variant between
  SCAD and the eQTL (colocalization posterior probability for H4 ≥ 0.8). Only genes
  with colocalization in at least one tissue are displayed.B, Tile plot summarizing
  the lines of evidence supporting 38 genes prioritized at SCAD loci that were not
  genome-wide significant in the SCAD-only GWAS. Each column represents one prioritized
  gene and each row a source of evidence. Filled red tiles indicate that the gene
  satisfies the corresponding criterion, blank tiles indicate absence of evidence.
  The upper five rows correspond to annotations directly used for prioritization:
  “MTAG” denotes the nearest gene to the MTAG lead SNP; “GBAT” indicates significance
  in LDAK-GBAT gene-based testing; “eQTL” indicates at least one significant cis-eQTL
  in GTEx v10 involving a candidate variant; “Coloc” marks loci with strong colocalization
  between SCAD MTAG and cis-eQTL signals (posterior probability for a shared causal
  variant H4 ≥ 0.8); and “missense” indicates presence of a candidate missense variant
  among SCAD candidate variants. The lower four rows summarize downstream annotation:
  “Prioritized disease” indicates membership of a disease term significantly enriched
  among prioritized genes; “Disease any” indicates any ClinVar disease association;
  “Prioritized pathway” indicates membership of an enriched biological pathway; and
  “Mouse phenotype” indicates a cardiovascular phenotype in Mouse Genome Informatics'
