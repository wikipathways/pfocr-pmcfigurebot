figure_title: Forms and paradigms of spinal plasticity.
caption: 'Forms and paradigms of spinal plasticity. The adult spinal cord supports
  multiple forms of learning, as shown here by key paradigms. Diagrams of the spinal
  cord indicate the neural circuitry for the stretch reflex or H-reflex (left, blue)
  and nociceptive reflex (right, peach) for each paradigm. Top left: Operant conditioning
  of the H-reflex. Subjects (human or animal) learn through feedback and reward to
  increase or decrease reflex amplitude and obtain persistent changes in synapses
  and motoneurons. Top right: Classical conditioning of spinal reflexes. The repeated
  pairing of a neutral stimulus (CS, feather) with a noxious stimulus (US, shock)
  produces associative plasticity. Before conditioning, the US alone elicits an unconditioned
  response (UR, withdrawal), while the CS alone evokes no response. During conditioning,
  CS and US are paired, eliciting the UR. After conditioning, the CS alone triggers
  a conditioned response (CR, withdrawal). Bottom right: Non-associative conditioning,
  including habituation and sensitization, derives from the repeated exposure to the
  same stimulus and generates a progressive decrease (habituation) or increase (sensitization)
  in reflex or pain pathways. Symbols: arrows = signaling flow or reflex change; ↑
  or ↓ = increase or decrease; MN = motoneurons'
