figure_title: Cellular adaptive responses to heat stress involving energy imbalance,
  oxidative damage, and autophagy.
caption: 'Cellular adaptive responses to heat stress involving energy imbalance, oxidative
  damage, and autophagy. Heat stress has been demonstrated to trigger cellular adaptive
  responses through the occurrence of an energy imbalance (AMP/ATP increase, activation
  of AMPK) and oxidative damage (ROS increase, activation of IKK/NF-κB), activating
  multiple pathways such as AMPK, NF-κB, and JNK. AMPK, in turn, has been shown to
  phosphorylate ULK1 and inhibit the TSC2/mTORC1 pathway, thereby promoting autophagy
  in concert with ATG13. ROS has been shown to regulate inflammatory genes through
  the degradation of IkBα, which, in turn, releases NF-κB to regulate inflammatory
  genes. Concurrently, hypoxia mimicry (HIF-1α increase) induces BNIP3, which in turn
  mediates mitochondrial autophagy (Mitophagy). AMPK: AMP-activated Protein Kinase;
  NF-κB: Nuclear Factor Kappa-Light-Chain-Enhancer of Activated B Cells; IKK: IκB
  Kinase; ULK1: Unc-51-Like Autophagy Activating Kinase 1; TSC2: Tuberous Sclerosis
  Complex 2; mTORC1: Mechanistic Target of Rapamycin Complex 1; ATG13: Autophagy-Related
  13; IκBα: Inhibitor of Kappa B Alpha; JNK: c-Jun N-terminal Kinase; c-Jun: v-jun
  Avian Sarcoma Virus 17 Oncogene Homolog; HRE: Hypoxia Response Element; ↑: Increase'
