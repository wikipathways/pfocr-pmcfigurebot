figure_title: In vivo metabolism effect of CuB.
caption: In vivo metabolism effect of CuB. (A) Protein expressions of LDHA and MCT4
  in tumor tissue (n = 3). Concentrations of LA (n = 6) (B) and PA (n = 3) (C). (D)
  pH values in the supernatant of mouse tumor tissue (n = 3). (E) PCA of metabolites
  in tumors from mice (n = 3). Volcano plot (F) and KEGG enrichment analysis (G) of
  all DEMs between N (control group) and S (CuB-treated group). (H) Clustering heatmap
  of differentially expressed metabolites related to glucose metabolism. (I) Schematic
  of CuB-induced changes in metabolic pathways. Bars, ±SE; statistical significance
  determined via unpaired two-tailed Student’s t-test; * p < 0.05, ** p < 0.01, ***
  p < 0.001, **** p < 0.0001
