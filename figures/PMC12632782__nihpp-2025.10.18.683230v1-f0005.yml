figure_title: Pharmacological profiles of presynaptic inhibition in OffT αRGCs
caption: '(A) Schematic showing parallel rod pathways in the retina with sites of
  pharmacological intervention. LY341495+APB (blue) blocks the rod->rod bipolar cell
  transmission, while strychnine (red) blocks glycinergic transmission from A2 amacrine
  cells.(B) Representative excitatory current traces in response to flashed gratings
  under control conditions (black) and with LY341495 10μM+APB(10μM) application (red)
  to block the primary rod pathway. Blue shading indicates grating presentation.(C)
  Top: Quantification of excitatory charge transfer in response to onset of gratings
  with different bar sizes under control (black) and LY341495+APB (red) conditions.
  Bottom: Paired comparison of excitatory charge transfer for individual cells under
  control and LY341495+APB conditions.(D) Comparison of OffT αRGC onset spike responses
  to natural image patches (x-axis) versus linear-equivalent discs (y-axis) under
  LY341495+APB treatment at 100 R*/rod/s.(E) Representative excitatory current traces
  in response to flashed gratings under control conditions (black) and with strychnine
  (0.5μM) application (red) to block glycinergic transmission.(F) Top: Quantification
  of excitatory charge transfer in response to gratings with different bar sizes under
  control (black) and strychnine (red) conditions. Bottom: Paired comparison of excitatory
  charge transfer for individual cells under control and strychnine conditions.(G)
  Comparison of OffT αRGC onset spike responses to natural image patches versus linear-equivalent
  discs under strychnine treatment at 100 R*/rod/s.(H) Summary of nonlinearity indices
  (NLI) for onset spike responses under control conditions, LY341495+APB treatment,
  and strychnine treatment at 100 R*/rod/s. Each line represents an individual cell'
article_title: Spatially-local inhibition and synaptic plasticity together enable
  dynamic, context-dependent integration of parallel sensory pathways
