figure_title: Graphical representation of the YBX1 signaling pathway, leading to drug
  resistance in HCC.
caption: Graphical representation of the YBX1 signaling pathway, leading to drug resistance
  in HCC. A diagram illustrating that Akt/PI3K and Ras/Raf/MAPK/ERK signaling phosphorylates
  p90 ribosomal S6 kinase (RSK), which in turn phosphorylates YBX1 at S102 and triggers
  the nuclear translocation of pYBX1, which contributes to drug resistance in HCC.
  The pathway highlights how YBX1 regulates key genes such as PD-L1, MDR1, and CD44
  ultimately promoting resistance to targeted therapies in HCC. Overexpression of
  HOTAIR interacts with YBX1 and kinases of pAKT and pRSK, enhancing the phosphorylation
  of YBX1, which leads to its nuclear translocation. Nuclear YBX1 activates PI3K/ERK,
  which further drives Akt and RSK phosphorylation in a positive feedback manner.
  The activated PI3K/Akt and ERK/RSK promote phosphorylation and nuclear translocation
  of YBX1. This activates the transcription of target genes to modulate proliferation
  and resistance
article_title: Transcription factor YBX1 orchestrates drug resistance and tumor progression
  in HCC
