caption: Mechanism diagram illustrating the neuroprotective effects of MsA in AD.
  MsA exerts its therapeutic effects through (1) Ameliorating cholinergic dysfunction
  by inhibiting AChE and BChE, increasing synaptic ACh; (2) Reducing oxidative stress
  markers (ROS, MDA); (3) Regulating APP processing via upregulating ADAM10 (non-amyloidogenic
  pathway) while suppressing BACE1 and γ-secretase (amyloidogenic pathway), thereby
  decreasing Aβ production; (4) Activating the PI3K/AKT pathway, leading to inhibitory
  phosphorylation of GSK3β (reducing tau hyperphosphorylation) and activation of CREB/BDNF
  signaling. Created with BioRender. Tu, D. (2025) https://BioRender.com/be7iclu
