figure_title: G4451 effectively blocks MASH in monkeys
caption: '(A) Illustration of the experimental procedure on monkeys fed an HFHC diet
  and treated with vehicle or G4451 (10 mg/kg/day). n = 4 monkeys. (B) Representative
  images of liver MRI from monkeys in week 0 (0W) and week 12 (12W) treated with vehicle
  or G4451. n = 4 monkeys. (C) Representative images of H&E, Oil Red O, CD11B, and
  Picrosirius red (PSR) staining on monkey liver sections in G4451- and vehicle-treated
  monkeys. Scale bars: 100 μm. n = 4 monkeys. (D) Triglyceride (TG) and total cholesterol
  (TC) content in 12W monkey liver tissues treated with vehicle or G4451. n = 4 monkeys.
  (E) Western blot showing the effect of G4451 on MAPK signaling pathway in HFHC-fed
  monkey liver. n = 3 monkeys. (F) KEGG pathway enrichment analysis in G4451- and
  vehicle-treated monkey livers. n = 3 monkeys. Data are shown as mean ± SEM. *P <
  0.05; **P < 0.01; ***P < 0.001; NS, no significance, P > 0.05'
