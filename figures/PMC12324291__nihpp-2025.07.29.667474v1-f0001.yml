figure_title: Conservation of hopanoid biosynthesis-associated protein domains in
  sequenced bacteria
caption: Consensus cladogram from 2,000 maximum likelihood trees generated from an
  alignment of representative bacterial 16S sequences from fully sequenced bacteria
  genomes in the JGI/IMG database. Each branch represents data from a group of phylogenetically
  related sequences; the number of genomes represented by each branch and the taxonomic
  classification of those genomes are provided as branch tip labels and branch names,
  respectively. Phyla assigned to genomes in each branch using the GTDB-Tk program
  are shown in the outer ring, with corresponding color-coding of the individual branches.
  Inner rings with grayscale rectangles indicate the degree of conservation within
  each branch of various hopanoid-associated domains and pathways from MetaCyc, Kegg
  Ontology, and TIGRFAM (see legend for domain/pathway represented by each ring).
  Scale bar indicates substitutions per 1000 nucleotide positions
