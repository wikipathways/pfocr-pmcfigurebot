figure_title: Obesity-epilepsy.
caption: 'Obesity-epilepsy. 1. In obesity, visceral adipose tissue acts as an active
  endocrine organ; hypertrophic adipocytes and infiltrating macrophages release pro-inflammatory
  cytokines: TNF-α, IL-6, IL-1β; adipokines and FFA. 2. Released cytokines and FFA
  can cross and disrupt the BBB, promoting infiltration of peripheral immune cells
  into the central nervous system. 3. Recruited immune cells, along with activated
  microglia and astrocytes, secrete ROS and other cytokines that facilitate neuronal
  hyperexcitability and synaptic remodeling. 4. Cytokines directly affect neuronal
  signaling by increasing surface expression of AMPA glutamate receptors, amplifying
  NMDA receptor phosphorylation, and simultaneously reducing GABA-A receptor activity.
  5. Prolonged exposure to cytokines modifies activation characteristics of ion channels,
  especially ATP-sensitive potassium (KATP) channels; blockade of KATP channels causes
  membrane depolarization, lowering the seizure threshold. 6. Obesity leads to dysregulation
  of adipokines; hyperleptinemia accompanied by central leptin insensitivity (leptin
  resistance) alters hypothalamic signaling by affecting the JAK2/STAT3 and PI3K-AKT
  pathways, resulting in increased appetite and decreased GABAergic inhibition. 7.
  The decrease in adiponectin levels in obesity hinders the activation of the AMPK
  pathway, causing it to lose its insulin-sensitizing and anti-inflammatory functions,
  thus intensifying oxidative stress and neuronal susceptibility. 8. Resistin is released
  by adipose tissue in obesity, promoting insulin resistance and the release of pro-inflammatory
  cytokines. Upward arrows (↑) indicate increased expression, activity, or upregulation;
  downward arrows (↓) indicate decreased expression, activity, or downregulation.
  Created in BioRender. Carpinteyro, S. (2026) https://BioRender.com/nh783nu (accessed
  on 23 March 2026)'
