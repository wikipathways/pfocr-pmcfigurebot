figure_title: APB5 and minocycline exert global changes in retinal transcriptome of
  4-week-old retinas
caption: (A) A volcano plot showing comparison of DEGs between IgG and APB5 retinas.
  (B) KEGG pathway analysis showing the top 10 enriched pathways in APB5 retinas.
  (C) GO domain biological processes showing key processes enriched by APB5. (D) A
  volcano plot showing comparison of DEGs between APB5 and APB5 with minocycline retinas.
  (E) KEGG pathway analysis shows the top 10 pathways enriched by minocycline. (F)
  GO domain biological processes showing key processes enriched by minocycline in
  APB5 retinas. The green dots on the volcano plots label some of the DEGs. The set
  cut-off for the DEGs shown on the volcano plot is log2 FC of ± 1 and FDR of < 0.05;
  n = 3 mice in each group. (G–P) Verification of DEGs by qPCR in whole retinal lysates;
  FgF2, Edn2, Glycam1, Aif1, Casp1, Tyrobp, Gfap, Actg2, Lyz2, and Cfb. The mRNA levels
  of these factors were significantly reduced in retinas of minocycline treated mice
  (n = 6 retinas). *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. Data show
  mean ± SD. One-way ANOVA
