figure_title: mtDAMPs increase TREM-1 expression and activate the cGAS-STING pathway
  in vitro.
caption: mtDAMPs increase TREM-1 expression and activate the cGAS-STING pathway in
  vitro. (A) mRNA expression levels of TREM-1, cGAS, and STING after treatment with
  mtDAMPs in lung bronchus cell line MM14.LU. (B) mRNA expression levels of TREM-1,
  cGAS, and STING after treatment with mtDAMPs in lung macrophage cell line AMJ2-C8.
  (C) WB results of MM14.LU cultured either alone or with AMJ2-C8 after treatment
  with mtDAMPs. (D) Densitometry analysis of WB results of MM14.LU cultured either
  alone or with AMJ2-C8 after treatment with mtDAMPs. (E) mRNA expression levels of
  TREM1 in AMJ2-C8 after mtDAMP treatment. (F) ELISA results of soluble TREM-1 protein
  in cell culture media after treatment with mtDAMPs. All results are presented as
  mean ± SE. Data were statistically analyzed using GraphPad Prism with one-way ANOVA
  followed by Tukey’s multiple-comparison test. ns represents statistically not significant,
  * means p < 0.0332, ** indicates p < 0.0021, **** represents p < 0.0001
