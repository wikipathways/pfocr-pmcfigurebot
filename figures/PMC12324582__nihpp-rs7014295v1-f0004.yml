figure_title: CRISPR screens for genes modulating sensitivity to RP-1664
caption: A,B. Screen for gene knockouts causing RP-1664 resistance in CHP134 TRIM37-low/TP53-KO
  cells. A. Experimental design. See methods for details. B. Screen results. Median
  sgRNA fold changes per gene in RP-1664-treated cells (Y axis) vs. untreated (X axis).
  Resistor hits with known functions in centriole/centrosome biogenesis (blue), apoptosis
  (red) or the PIDDosome (green) are highlighted. C,D. Screen for genes knockouts
  causing RP-1664 resistance or sensitivity in RPE1-hTERT Cas9 cells. C. Experimental
  design. See methods for details. D. Screen results. Gene-level DrugZ85 scores in
  cells treated with 50nM RP-1664 (centrosome amplification; Y axis) vs. 150nM (centrosome
  depletion; X axis). Hits with known functions in centriole/centrosome biogenesis
  (blue), the mitotic surveillance pathway (red) or the PIDDosome (green) are highlighted
