figure_title: Suppression of the sialylation pathway doesn’t affect GBM cells proliferation
  and TMZ chemosensitivity.
caption: 'Suppression of the sialylation pathway doesn’t affect GBM cells proliferation
  and TMZ chemosensitivity. (A) Immunofluorescence analysis showing the time course
  (0–72 h) of sialylation pathway inhibition by 3-Fax in U87MG and GL15 cell lines.
  PolySia expression is visualized in green. DAPI was used to stain nuclei (blue).
  Scale bar: 20 μm. The graph represents the mean corrected total cell fluorescence
  (CTCF). Statistical significance: ** p < 0.01; **** p < 0.0001, two-way ANOVA. ImageJ
  software was employed to analyze 10 fields per each condition. (B) Western blotting
  analysis of PolySia expression was performed in protein extracts from U87MG and
  GL15 cells cultured in 3-Fax presence for 24, 48 and 72 h. HSP90 was used as loading
  control. A representative image of three different experiments is shown. The corresponding
  densitometric analysis is shown. Statistical significance: ** p < 0.01, *** p <
  0.001, **** p < 0.0001, Two-way ANOVA. (C) U87MG and GL15 cells were cultured in
  complete DMEM or in presence of 100 µm of 3-Fax, TMZ 10 µM, or both. At the indicated
  time point, the cells were trypsinized and counted in a Thoma chamber. The graph
  represents the means ± SEMs of three different experiments. Data were analyzed by
  two-way analysis of variance (ANOVA) followed by Tukey post hoc. Statistical significance:
  * p < 0.05; **** p < 0.0001'
