figure_title: Bio-inspired defect engineering strategies enabling charge redistribution,
  electron localization, and N≡N bond activation in photocatalytic nitrogen fixation
  systems.
caption: Bio-inspired defect engineering strategies enabling charge redistribution,
  electron localization, and N≡N bond activation in photocatalytic nitrogen fixation
  systems. (a) Stepwise structural evolution of UiO-66, UiO-66(SH)2, and its dehydrated
  form illustrating defect formation and photo-induced charge transfer. SH-functionalization
  lowers the bandgap, while dehydration triggers linker loss and generates Zr–coordinatively
  unsaturated sites (CUSs). These CUSs act as artificial enzyme-like coordination
  nodes, enabling μ-N–Zr interactions for visible-light-driven N2 reduction. Reproduced
  with permission [77]. Copyright © 2022 Wiley-VCH. (b) Schematic synthesis of ultrafine
  Bi5O7Br nanotubes from Bi–Br–oleylamine precursors. The tubular architecture enhances
  light absorption, exposes more defect-rich surfaces, and facilitates directional
  electron migration. Oxygen vacancies (OVs) at the tube wall act as N2 adsorption
  centers, simulating active FeMoco cavities. Reproduced with permission [78]. Copyright
  © 2017 Wiley-VCH. (c) Bio-inspired Mo-doped Fe2O3 porous nanospheres for electrochemical
  N2 reduction. Mo atoms replace Fe sites, forming Fe–O–Mo subunits resembling nitrogenase
  cofactors. The doping induces a porous morphology, defect generation, and favorable
  orbital redistribution. DFT simulations confirm N≡N bond elongation and a reduced
  barrier for the associative distal pathway. Reproduced with permission [79]. Copyright
  © 2022 American Chemical Society. (d) Proposed charge-separation mechanism in FeVS/C3N4
  hybrid under visible light. The interface promotes spatially separated photogenerated
  electrons and holes, with electrons migrating toward FeVS to activate adsorbed N2.
  Conduction band alignment and defect-assisted transfer mimic the directional tunneling
  in enzymatic NRR. Reproduced with permission [80]. Copyright © 2023 Royal Society
  of Chemistry
