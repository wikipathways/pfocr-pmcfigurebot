figure_title: Construction, prognosis analysis and enrichment analysis of the ceRNA
  network.
caption: Construction, prognosis analysis and enrichment analysis of the ceRNA network.
  (A) Venn diagram of the co-expressed differential mRNAs and lncRNAs of CDH3, KRT17,
  PKP1 and CRABP2 in SKCM. (B) Global view of the ceRNA network, which consists of
  13 lncRNAs, 20 miRNAs and 4 mRNAs. Triangles, rectangles and diamonds represent
  mRNAs, miRNAs and lncRNAs, respectively. (C) Prognostic analysis of the ceRNA network
  expression level in SKCM assessed using the Kaplan-Meier plotter. KRT17, PKP1, CDH3,
  CRABP2, SOX21-AS1, hsa-miR-1276 and hsa-miR-151a-3p were demonstrated to be risk
  factors for SKCM, whilst hsa-miR-3200-3p, hsa-miR-1976 were protective factors for
  SKCM. (D) Functional enrichment analyses of co-expressed differential mRNAs of CDH3,
  KRT17, PKP1 and CRABP2 in SKCM. The Sankey diagram shows the pathways in which the
  co-expressed differential mRNAs were mainly enriched. The bubble pattern demonstrates
  the top 10 enrichment pathways with Entities ratio and Entities count. The y-axis
  represents the pathway and the x-axis represents the rich factor. The size and color
  of each bubble represent the number of differentially expressed genes enriched in
  the pathway and the -log10(P-value), respectively. ceRNA, competing endogenous RNA;
  lncRNA, long noncoding RNA; KRT17, keratin 17; PKP1, plakophilin 1; CDH3, cadherin
  3; CRABP2, cellular retinoic acid binding protein 2; SKCM, skin cutaneous melanoma;
  miRNA/miR, microRNA
