figure_title: The impact of ubiquitination on inflammatory signaling pathways in sepsis.
caption: The impact of ubiquitination on inflammatory signaling pathways in sepsis.
  Ubiquitination regulates TLRs and TNFRs and their downstream inflammatory pathways
  during sepsis. Upon receptor stimulation, the K63-linked polyubiquitination of MyD88/IRAK1/4
  (via Ubc13) or M1-linked polyubiquitination of NEMO (via LUBAC) recruits TAK1 or
  the IKK complex, respectively, driving NF-κB nuclear translocation and transcription
  of cytokines (TNF-α, IL-1β). Additionally, VANGL2 recruits PDLIM2 to catalyze the
  K63-type ubiquitination of p65 in LPS-induced sepsis, and NDP52 recognizes K63 chains
  to mediate p65 autolysosomal degradation, independent of the proteasome. Provided
  by FigDraw
