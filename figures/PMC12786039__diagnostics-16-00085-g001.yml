figure_title: Integrated workflow for biomarker discovery and validation in immunotherapy
  response prediction.
caption: 'Integrated workflow for biomarker discovery and validation in immunotherapy
  response prediction. This study integrated three GEO datasets (GSE279750, GSE215011,
  GSE235863) to identify predictive biomarkers for immunotherapy response. The workflow
  comprised: (1) data acquisition and quality control; (2) batch effect correction
  and normalization; (3) differential expression analysis; (4) meta-analysis integration;
  (5) feature selection using LASSO and Random Forest; (6) signature score development
  and ROC validation; (7) model stability assessment via cross-validation, bootstrap,
  and external validation; (8) KEGG pathway enrichment analysis'
