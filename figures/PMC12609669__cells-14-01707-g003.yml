figure_title: Mechanosensory systems, mechanotransduction, and mechanical memory of
  cancer cells are characterized by ongoing epigenetic modifications in the most extensively
  studied context of matrix stiffness.
caption: Mechanosensory systems, mechanotransduction, and mechanical memory of cancer
  cells are characterized by ongoing epigenetic modifications in the most extensively
  studied context of matrix stiffness. Cancer cells perceive high matrix stiffness
  through integrin activation, which encourages cytoskeletal reorganization, which
  then facilitates the translocation of mechanotransducing transcription factors,
  runt-related transcription factor 2 (RUNX2), and yes-associated protein (YAP), to
  the nucleus. These mechanosensory and mechanotransduction mechanisms arise in minutes
  to hours after encountering a rigid matrix. In the long term, mechanotransduction
  can result in epigenetic alterations, which include histone modifications by histone
  acetyltransferases (HATs) and histone deacetylases (HDACs), methylation of DNA (typically
  leads to gene silencing), and expression of non-coding RNAs, which initiate transcriptional
  gene silencing. When the level of mechanical stress and time of priming are severe
  enough (days to weeks), phenotypic adjustments are assumed to be preserved by the
  mechanical memory of cancer cells, which is enacted through sustained epigenetic
  alterations. Mechanical memory mechanisms appear to account for a key part of the
  metastasis pathway in that they directly couple the biophysical adaptations of cancer
  cells inherited from the primary cancer with the adaptations that propel the advancement
  of the disease to secondary cancer locations
article_title: Impact of the ECM on the Mechanical Memory of Cancer Cells
