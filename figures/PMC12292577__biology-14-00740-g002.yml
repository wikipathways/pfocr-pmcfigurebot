figure_title: Vestibular and visual pathways in self-motion perception.
caption: 'Vestibular and visual pathways in self-motion perception. The blue arrow
  represents the vestibular information pathway: peripheral vestibular signals are
  first transmitted to the vestibular nucleus (VN) and then relayed through the thalamus,
  primarily projected to the parieto-insular vestibular cortex (PIVC), and may further
  extend to the frontal cortex. The red arrow represents the visual information pathway:
  visual information from the retina is transmitted through the lateral geniculate
  nucleus (LGN) to the primary visual cortex (V1) and subsequently projected through
  the middle temporal area (MT) to other visual cortical regions involved in motion
  direction perception. MSTd, dorsal portion of medial superior temporal area; PIVC,
  parieto-insular vestibular cortex; VPS, visual posterior sylvian area; VIP, ventral
  intraparietal area; FEFsem, smooth eye movement region of the frontal eye field;
  STP, superior temporal polysensory area'
