figure_title: FABP5 alters ether lipid and PAF metabolism
caption: 'A) High performance liquid chromatography tandem mass spectrometry (HPLC-MS/MS)
  based quantification of total ether-containing lipid species in plasma of Fabp5+/+
  and Fabp5−/− mice on day 10 of treatment with MC903. (n = 13)B) HPLC-MS/MS based
  quantification of total phosphatidylethanolamine (PE) species with 18:0 ether-linked
  tails in plasma of Fabp5+/+ and Fabp5−/− mice on day 10 of treatment with MC903.
  (n = 13)C) HPLC-MS/MS based quantification of individual phosphatidylethanolamine
  species with ether-linked tails in plasma of Fabp5+/+ and Fabp5−/− mice on day 10
  of treatment with MC903. (n = 13). Two-way ANOVA with Šidák correction for multiple
  comparisons.D) Schematic of PAF synthesis via remodeling pathway. PAF synthesis
  begins by the hydrolysis of the sn-2 linked fatty acid tail from an ether-containing
  phosphatidylcholine (ether-linked tail in sn-1 position indicated by red arrow)
  by a phospholipase A2 thus forming an ether lyso-PC (also denoted lyso-PAF). An
  acetyl group is added to the sn-2 position by lysophosphatidylcholine acetyltransferase
  1 (LPCAT1) forming PAF which then signals via the PAF receptor encoded by Ptafr.
  Extracellular PAF is quickly degraded by the constitutively secreted phospholipase
  A2, PLA2G7 (sometimes denoted PAF acetyl-hydrolase (PAF-AH)). Structural formula
  of PAF is colored to illustrate its metabolic components (blue: choline headgroup,
  red: glycerol backbone, purple: ether-linked hydrocarbon tail).E) Heat map of relative
  gene expression from RNAseq of naïve (vehicle treated) and dermatotic (MC903 treated)
  mouse skin showing expression differential expression of various genes involved
  in platelet activating factor (PAF) metabolism and signaling.F) qPCR analysis of
  Lpcat1 and Pla2g7 and Ptafr gene expression from mouse skin on day 10 of treatment
  with vehicle or MC903. (n = 15)G) Quantification via ELISA of PAF from mouse skin
  punch biopsies collected on day 10 of treatment with vehicle or MC903. PAF is normalized
  per unit area of skin. (n = 9)H) Quantification via ELISA of PAF in mouse plasma
  collected on day 10 of treatment with vehicle or MC903. (n = 16)I) Caliper measurements
  showing increase in ear thickness over time during MC903 treatment of Ptafr+/+ and
  Ptafr−/− mice (n = 10). Dots show mean ± SEM. Stars represent Šidák corrected p
  values for 2-way ANOVA with multiple comparisons.J) Quantification via ELISA of
  PAF from skin punch biopsies from Fabp5+/+ and Fabp5−/− mice on day 10 of treatment
  with vehicle or MC903. PAF is normalized per unit area of skin (n = 13)K) Quantification
  via ELISA of PAF in plasma of Fabp5+/+ and Fabp5−/− mice on day 10 of treatment
  with vehicle or MC903. (n = 16)L) Representative immunofluorescence images of showing
  fibrinogen staining in skin sections from Fabp5+/+ and Fabp5−/− mice on day 10 of
  treatment with MC903.M) Fluorescence-based quantification of FITC-Dextran in skin
  punch biopsies from Fabp5+/+ and Fabp5−/− mice on day 10 of treatment with vehicle
  or MC903 10 minutes post injection with FITC-Dextran 70kD i.v. (n = 10)N) Core body
  temperatures (% of initial) following PAF induced anaphylaxis in naïve Fabp5+/+
  and Fabp5−/− mice. (n = 10). Dots show mean ± SEM. Stars represent Šidák corrected
  p values for 2-way ANOVA with multiple comparisons.O) Cell free enzymatic activity
  of recombinant human PLA2G7 on 2-thio PAF with or without the addition of recombinant
  mouse FABP5 (400nM). (control n = 8; rFABP5 n = 4)Unless otherwise noted, all data
  are reported as means ± SD. * p < 0.05; ** p < 0.01, *** p < 0.005. Two-tailed unpaired
  Student’s t-test. Datapoints are discrete biological replicates except in (M) which
  displays technical replicates'
