figure_title: DECIPHAER identifies correlated gene expression and morphology relationships
  that are informative of drug mechanism
caption: '(A) Pathway enrichment ratios (PathFindR) of three morphological features.
  For each morphological feature, the most correlated gene expression features (Spearman’s
  rank correlation coefficient > 0.5 or < −0.5; unitless, linear) were selected for
  pathway enrichment. Top enriched pathways are colored by their average Spearman
  rank correlation coefficient and the given morphological feature is shown below
  (positive correlation, red; negative correlation, blue). From left to right, the
  morphological features are solidity, cell area and DNA staining intensity (the *
  indicates the sugar metabolism pathway of which TreS and GlgE are members).(B) Heatmap
  of the predicted expression levels (unitless, linear) for genes involved in ribosome
  biogenesis and DNA replication and repair across the entire range of possible cell
  area bins. </p/>(C) Scatter plot of DECIPHAER-paired morphological and RNA-seq data
  for treS, glgE and area of nucleoid stain. Each feature (axis) is converted to a
  z-score to show relative differences between drug treatments. Each data point represents
  either a morphological profile summary of 1,000 cells and its corresponding DECIPHAER-predicted
  gene expression level or an RNA sample and its corresponding DECIPHAER-predicted
  nucleoid staining area (Spearman’s correlation coefficient, unitless; glgE and treS,
  p < 2.2e-16; treS and nucleoid staining area, p < 2.2e-16; glgE and nucleoid staining
  area, p < 2.2e-16).(D) Boxplots of the fluorescence intensity (arbitrary units)
  in the recA’::GFP Mtb strain binned by cell area quantile. The strain was treated
  with levofloxacin (purple) and moxifloxacin (pink) for 24 hours before measuring
  cell intensity with fluorescence microscopy.(E) Metabolic map of the maltose 1-phosphate
  pathway depicting accumulation of sugar-phosphate in linezolid-treated Mtb.(F) Abundances
  of metabolites for the KEGG maltose-1-phosphate pathway in cholesterol-adapted Mtb
  cultures treated with drugs for 48 hours. Rows are z-scored (unitless, linear) to
  demonstrate relative levels of the metabolites. Bedaquiline and clofazimine are
  shown as control drug treatments. Three doses are shown for each compound at 1x,
  5x and 10x their IC50 (n = 3, 2 independent experiments).(G) HILIC-MS quantification
  of maltose-1-phosphate in cholesterol-adapted 48-hour drug-treated (10x their IC50)
  and untreated Mtb cultures. (Barplots include individual data points and depict
  the mean value and error bars are calculated from the standard error of the mean.
  One-way ANOVA with Dunnett’s post-hoc test against no treatment control: ***p <
  0.001, **p < 0.01, *p < 0.05; ns, p > 0.05; n = 3)'
