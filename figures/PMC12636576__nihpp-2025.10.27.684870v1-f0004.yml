caption: '(A) and (B) Overlap between DEG and DTF targets from human heterozygous
  (het) iN or NSC. (C) Statistical significance for enrichment of pathways among heterozygous
  iN (left panel) and NSC (right panel) DTF targets which are DEG. Intersection of
  two gene lists is represented by “⋂”. Numbers in parentheses represent total genes
  in a given list. Colors represent pathway categorization according to the nature
  of the functional categories related to the enriched terms. Groups of functional
  categories: APO: apoptosis, IMMUNE: immune system and inflammation, MIG: cell migration,
  MIT: mitosis and cell proliferation, STEROID: steroid metabolism, SIG: intracellular
  signaling pathways, ECM: extracellular matrix, SYN: synapse, VASC: vascular. (D)
  and (E) FOS-JUN footprinting score over gene promoters of down/upregulated FOS-JUN
  targets in heterozygous iN (D) or NSC (E) lines. Numbers in parentheses indicate
  the total number of genes in a given gene list. BH: Benjamini-Hochberg adjusted
  p-values'
