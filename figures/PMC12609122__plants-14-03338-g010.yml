figure_title: Proposed model for Tha4 assembly in the protonated state and the deprotonated
  state in the thylakoid membrane.
caption: Proposed model for Tha4 assembly in the protonated state and the deprotonated
  state in the thylakoid membrane. In its deprotonated state, we can expect Tha4 to
  assemble in the membrane in a disorganized way and interact with the helix-helix
  interface of the adjacent Tha4 TMH. APH of the Tha4 would lie on the membrane as
  seen in the previous studies [77]. When a precursor and PMF are present, Tha4 organizes
  more systematically, as evidenced by the crosslinking data. TMH tends to form parallel
  bundle-like interactions. Meanwhile, APH positions themselves nearer to each other,
  with their N-terminal regions facing one another. This conformational shift would
  lead to the membrane thinning and translocation of the precursor through the cpTAT
  pathway. Arrows depict the thylakoid membrane thickness in the protonated and deprotonated
  state
