caption: 'Human Network Toxicology Analysis of Potential Gene Targets Linking PM2.5
  Exposure and Autism. (A) Flowchart outlining the methodological approach for the
  human network toxicology analysis. (B) Venn diagram showing the overlap between
  PM2.5-related genes and autism-related genes. (C) Bar plot presenting GO molecular
  function enrichment results for the intersecting genes. (D) Bar plot illustrating
  KEGG pathway enrichment results for the intersecting genes. (E) Visualization of
  the protein–protein interaction (PPI) network constructed from the intersecting
  gene set. (F) Hub gene analysis identifying top-ranked hub genes using two algorithms:
  Maximal Clique Centrality (MCC) and Degree. (G) Venn diagram displaying the 14 overlapping
  hub genes identified by both MCC and Degree algorithms: AKT3, AKT1, BDNF, CCR2,
  CTNNB1, EGF, FOS, IGF1, KRAS, MAPK3, mTOR, PTEN, PXDN, and SOX2'
