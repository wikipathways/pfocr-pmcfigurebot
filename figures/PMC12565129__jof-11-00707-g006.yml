caption: 'Expression of Fusarium solani strain FsK ethylene biosynthesis genes during
  early interaction with tomato. Relative transcript levels of FSKSAMT (A), FSKSUN1
  (B), FSKSUN2 (C), FSKSUN3 (D), and FSKCOXX (E) in FsK mycelium during in vitro co-cultivation
  with tomato (Solanum lycopersicum cv. Moneymaker) seedlings. Measurements were taken
  at three early interaction stages: T1, pre-contact (roots ~1 cm from fungal colony);
  T2, initial hyphal contact; and T3, three days post-contact. Data represent means
  ± standard deviation (n = 3). Data represent means ± standard deviation (n = 3).
  Different letters above boxplots indicate statistically significant differences
  according to ANOVA followed by Tukey’s HSD test (p < 0.05). (F) Proposed ethylene
  biosynthesis pathway in FsK, showing enzymatic steps catalyzed by SAM synthase (FSKSAMT),
  ACC synthase (FSKSUN1–3), and ACC oxidase (FSKCOXX)'
