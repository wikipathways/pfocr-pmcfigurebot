figure_title: Keratinocyte-derived CXCL10 binds to CD14 and mediates the proinflammatory
  response in periarticular CD14hi macrophages
caption: '(A and B) Flow cytometric analysis of TNF-α, IL-1β, and CD86 expression
  in RAW264.7 cells treated with blank keratinocyte medium plus IgG, control KC-CM
  plus IgG, Spry1-cKO KC-CM plus IgG, and Spry1-cKO KC-CM plus 2 μg/mL anti-CXCL10
  antibody for 24 hours (A), or treated with or without 100 ng/mL recombinant murine
  CXCL10 for 24 hours (B), followed by incubation with 50 ng/mL LPS and BFA for 6
  hours (n = 3). (C) Dot plots showing scaled expression (scRNA-Seq) of potential
  CXCL10 receptor genes mouse periarticular CD14hi macrophages. (D) Co-immunoprecipitation
  of TLR2, TLR4, CD14, and CXCL10 in RAW264.7 cells after recombinant murine CXCL10
  treatment. (E) Immunoprecipitation of recombinant murine CD14 and CXCL10 proteins.
  (F) Confocal images of CD14 and CXCL10 colocalization in RAW264.7 cells after treatment
  with recombinant murine CXCL10. Boxed areas are magnified below. Scale bar: 100
  μm. (G) Optimized binding mode with the lowest binding energy generated by HDOCK,
  and key residues for interaction between mouse CXCL10 and CD14. Boxed areas are
  magnified below. Hydrogen bonds are shown as yellow dashed lines and salt bridges
  as red dashed lines. (H) Immunoblotting analysis of protein levels associated with
  PI3K/AKT and NF-κB signaling pathways in RAW264.7 cells treated with NC or siCd14,
  followed by recombinant murine CXCL10 stimulation. (I) Flow cytometric analysis
  of CD14, CD86, TNF-α, and IL-1β expression in RAW264.7 cells treated with NC or
  siCd14, followed by recombinant murine CXCL10 stimulation and subsequent incubation
  with LPS and BFA (n = 3). (J) TSNE plots of 8 immune cell clusters in synovial fluid
  (SF) from PsA patients (GSE161500). (K) TSNE plots showing CD14 and CXCR3 expression
  across clusters defined in J. (L) TSNE plots showing single cell–level enrichment
  of inflammatory response and TNF-α signaling via NF-κB signatures in all immune
  clusters defined in J by GSVA. (M and N) GSVA for pathway enrichment of CD14+ versus
  CD14– macrophages (M) and CD14+ macrophages versus CXCR3+ T cells (N) in PsA SF
  (GSE161500). Data are shown as mean ± SEM. P values determined using 1-way ANOVA
  (A) and 2-tailed unpaired Student’s t test (B and I). *P < 0.05, **P < 0.01, ***P
  < 0.001, ****P < 0.0001'
article_title: CXCL10 secreted by SPRY1-deficient epidermal keratinocytes fuels joint
  inflammation in psoriatic arthritis via CD14 signaling
