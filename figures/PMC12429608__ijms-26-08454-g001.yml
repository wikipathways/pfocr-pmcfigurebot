figure_title: Mechanism of DNA de novo methylation and demethylation.
caption: Mechanism of DNA de novo methylation and demethylation. (A) SHH1 exhibits
  preferential binds to demethylated H3K9me2, thereby facilitating the recruitment
  of DNA-dependent RNA Pol IV to a subset of RdDM loci through direct interaction
  with CLSY1 or CLSY2 chromatin remodeling factors. Pol IV and RDR2 form a holoenzyme
  that produces double-stranded precursor RNAs (P4R2 RNAs). These P4R2 RNAs undergo
  cleavage by DCL3 to produce 24-nt siRNA. One strand of the siRNA is subsequently
  bound and stabilized by AGO4 and AGO6 proteins. The siRNA-AGO complex is then recruited
  by Pol V transcripts through base pairing. SUVH2 and SUVH9, acting as methylcytosine
  binding proteins, bind to pre-existing methylcytosines, along with the DRD1-DMS3-RDM1
  (DDR) complex. The siRNA-AGO complex, potentially in conjunction with other proteins,
  then recruits DRM2 to affect DNA methylation [52]. Reproduced with permission from
  Heng Zhang and Jian-Kang Zhu, Nature; published by Springer Nature, 2025. (B) DNA
  demethylation can occur passively during DNA replication. Active DNA demethylation
  is mediated by plant-specific DNA demethylases. The single-nucleotide gap will be
  filled with a unmethylated cytosine through BER pathway
