caption: The effect of the NaCl treatment on the rapeseed transcriptome is illustrated
  in several analyses. (A) A principal component analysis (PCA) was conducted to compare
  the control and NaCl-treated samples. (B) A scatter plot depicts the KEGG pathway
  enrichment of differentially expressed genes. (C) A volcano plot illustrates the
  differential expression of genes. (D) The number of DEGs. (E) The GO annotation
  classification statistics for the differentially expressed genes are presented
