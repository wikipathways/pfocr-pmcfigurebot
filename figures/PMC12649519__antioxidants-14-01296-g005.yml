figure_title: Synthetic peptide-scorpion venom heat-resistant synthetic peptide (SVHRSP)
  inhibited dextran sodium sulfate (DSS)-induced chronic colitis in mice via a cholinergic
  anti-inflammation pathway.
caption: Synthetic peptide-scorpion venom heat-resistant synthetic peptide (SVHRSP)
  inhibited dextran sodium sulfate (DSS)-induced chronic colitis in mice via a cholinergic
  anti-inflammation pathway. (A) Expression of acetylcholine (Ach) in colonic tissues
  by enzyme-linked immunosorbent assay (ELISA) (n = 6). (B) Immunohistochemistry analysis
  of α7 nicotinic acetylcholine receptor (α7nAChR) (brown) in colon tissues and (C)
  quantitative analysis (n = 5). (D) Western blot analysis of α7nAChR and (E) quantitative
  analysis in colon tissues (n = 5). The original blots are shown in Supplementary
  Figure S3. (F) Western-blot analysis of α7nAChR in RAW264.7 cells and (G) quantitative
  analysis (n = 3). The original blots are shown in Supplementary Figure S4. (H) Reverse
  transcription quantitative polymerase chain reaction (RT-qPCR) was used to measure
  mRNA levels of interleukin-6 (IL-6) and tumor necrosis factor-α (TNF-α) in RAW264.7
  cells (n = 6). (I) Overall docking model of SVHRSP with α7nAChR. (J) Enlarged view
  showing hydrogen-bond interactions with residues THR483, THR479, and ALA246. α7nAChR
  is depicted as a slate cartoon, SVHRSP as cyan sticks, binding site residues as
  magenta sticks, and hydrogen bonds as yellow dashed lines. Predicted binding energy
  is –5.4 kcal/mol. Results were expressed as mean ± standard error of the mean (SEM).
  * p < 0.05, ** p < 0.01 and *** p < 0.001
article_title: Scorpion Venom Heat-Resistant Synthetic Peptide Alleviates DSS-Induced
