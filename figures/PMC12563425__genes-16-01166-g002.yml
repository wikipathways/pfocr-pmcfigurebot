figure_title: CD44 plays a role in the uptake of iron during EMT in colorectal cancer
  cells.
caption: CD44 plays a role in the uptake of iron during EMT in colorectal cancer cells.
  TF-TfR1 is the mechanism by which epithelial phenotype colorectal cancer cells import
  iron. Intracellular iron and TfR1 form a negative feedback loop that limits the
  TF-TfR1 pathway, meaning that mesenchymal phenotype CRC cells require more iron.
  The absorption of iron by CRC cells through a glycan-Fe (III)-CD44-mediated process
  can enhance mitochondrial function and the generation of α-ketoglutaric acid (α-KG).
  The activity of the plant homeodomain finger protein 8 demethylase is enhanced by
  an increase in α-KG in conjunction with ferrous iron. In the end, this leads to
  the expression of genes related to EMT, such as CD44 [20]. Reproduced via Biorender
  from Ref. [20] with permission under a Creative Commons Attribution License (CC-BY),
