figure_title: PS direct pathway activation biases visual decisions
caption: 'A. Schematic of spatially cued orientation change-detection task trial structure
  and left and right visual displays. B. Peri-stimulus event histograms (PSTHs) of
  mean lick rates in 40-ms bins aligned to trial epoch onsets for change (top) and
  catch (bottom) trials (N=10). C. Representative expression of cre-dependent Channelrhodopsin
  (ChR2-mCherry) and optic fiber placement in the PS (top) and DMS (bottom) of a Drd1a-cre
  mouse. D. Schematic of light delivery to PS or DMS during the early delay (left)
  and late delay or change epochs (right). E. Cumulative lick probabilities from an
  example ChR2-expressing Drd1a-cre mouse. The first lick following PS light delivery
  onset (blue) or at a matched time on non-stimulation trials (gray) was quantified
  for the early delay epoch (left column) and late delay epoch (right column), separately
  for contralaterally cued trials (top row) and ipsilaterally cued trials (bottom
  row). F. Light delivery to the PS during the early delay epoch produced a small
  but significant increase in lick probability for ChR2-mCherry (purple and gold;
  N = 6) but not mCherry control (black and gray; N = 4) mice. G. PS light delivery
  during the late delay epoch significantly increased lick probability for ChR2-mCherry
  but not mCherry control mice. H. Light delivery during the change event reduced
  the median response latency for ChR2-mCherry but not mCherry control mice. Scale
  bars: 500 μm. Four-way repeated measures ANOVA (F, G); three-way repeated measures
  ANOVA (H). Error bars represent standard error of the mean (s.e.m.). d = Cohen’s
  d effect size. Abbreviations: ns (not significant)'
article_title: A distinct circuit for biasing visual perceptual decisions and modulating
  superior colliculus activity through the mouse posterior striatum
