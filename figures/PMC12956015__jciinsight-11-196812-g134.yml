figure_title: Altered mRNA expression of components of the CNP/GC-B signaling pathway
  in whole lung samples and lung stromal cells from patients with PF
caption: (A) The mRNA expression levels of NPR2 (GC-B), PKGI (cGKI), and PDE2A in
  samples of healthy human lung tissue and lung samples from patients with IPF were
  studied by qPCR. The expression was normalized to porphobilinogen deaminase (PBGD).
  The sample number for each experiment (n) varied between 10 and 16 and is indicated
  by the number of data points in each graph. Significance was tested by Student’s
  unpaired t test. *P < 0.05 versus controls. (B) UMAP plots derived from integrating
  scRNA-seq data reported in the HLCA (11) reveal the stromal cell clusters (right
  panel). (C) UMAP visualization (left panels) and violin plots (right panels) compare
  the mRNA expression levels of CTHRC1 (as myofibroblast marker), NPR2 (GC-B), PKGI
  (cGKI), and PDE2A in stromal cell clusters from control lungs and lungs from patients
  with interstitial lung diseases (ILD) or IPF. Significance was tested with the Wilcoxon
  signed rank test; *P < 0.05
