figure_title: Divergent intracellular signaling and functional mechanism mediated
  by FcRγ in different innate immune cells.
caption: Divergent intracellular signaling and functional mechanism mediated by FcRγ
  in different innate immune cells. Upon engagement of distinct ligand-receptor complexes
  (allergen-IgE complex, fungal α-mannan-Dectin-2, IgG-CD16A, IgG-CD64A), signaling
  is initiated via the associated FcRγ subunit, and phosphorylation of its ITAM recruits
  and activates SYK. This common initiating module then diverges into cell-type-specific
  downstream pathways, leading to distinct functional outputs in mast cells, natural
  killer cells, DCs and macrophages. The figure was drawn with FigDraw2.0 (supplied
  by Hangzhou Sifei Technology Co., Ltd.). FcR, Fc receptor; ITAM, immunoreceptor
  tyrosine-based activation motif; SYK, spleen tyrosine kinase; PLCγ, phospholipase
  Cγ; PIP2, phosphatidylinositol bisphosphate; IP3, inositol trisphosphate; DAG, diacylglycerol;
  DC, dendritic cell; ADCC, antibody-dependent cellular cytotoxicity; ADCP, antibody-dependent
  phagocytosis; Th, T helper; ROS, reactive oxygen species
