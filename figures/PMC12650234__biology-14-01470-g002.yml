caption: 'Under normal oxygen conditions (upper panel), the ERF-VII transcription
  factor in plant cells is labelled and degraded by ubiquitination mediated by ATE1/2
  and E3 ligases, resulting in the silencing of hypoxia-responsive genes and maintaining
  normal respiratory metabolism in the cells. C* represents oxidized cysteine, RC*
  represents arginine-bound oxidized cysteine. Under hypoxic conditions (lower panel),
  hypoxic stress triggers intracellular calcium signalling, the accumulation of reactive
  oxygen species (ROS), and energy depletion (decreased ATP levels), thereby activating
  the core regulatory factor, SnRK1 kinase. Activated SnRK1 coordinates adaptive response
  through dual pathways: (I) initiating metabolic processes such as glycolysis, starch
  degradation, and autophagy to generate energy rapidly; (II) interacted with the
  ethylene (ET) signalling pathway activated by hypoxia, the transcription factor
  ERF-VII is activated, which in turn activates the expression of downstream hypoxia-responsive
  genes, ultimately promoting cell adaptation to hypoxia stress. The solid arrow represents
  the promoting effect. The figure was charted using BioRender https://www.biorender.com/
  (accessed on 18 August 2025) according to the website’s instructions'
