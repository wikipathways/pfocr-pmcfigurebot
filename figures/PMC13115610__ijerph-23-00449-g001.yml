figure_title: Schematic representation of the production, migration, and mechanisms
  of action of irisin induced by physical exercise.
caption: Schematic representation of the production, migration, and mechanisms of
  action of irisin induced by physical exercise. The network was constructed based
  on functional enrichment (DAVID), protein–protein interactions (SIGNOR 4.0), and
  the literature. Irisin, produced in skeletal muscle, is released into the circulation,
  crosses the blood–brain barrier, and reaches the brain, where it can interact with
  αV/β5 integrin receptors expressed on astrocytes. This interaction is associated
  with the activation of FAK/PTK2 and SRC, with subsequent activation of the PI3K/AKT
  pathway, related to cell survival and proliferation and neuronal plasticity; the
  PKA/CREB pathway, which increases BDNF expression and hippocampal cell proliferation;
  and the MAPK/ERK pathway, which causes blockade of Tau protein, responsible for
  the formation of neurofibrillary tangles characteristic of Alzheimer’s disease.
  Solid blue arrows indicate direct upregulated interactions; dashed blue arrows represent
  indirect interactions; red arrows with flat ends indicate downregulated. Created
  in Biorender. Moara Manias. (2026) https://BioRender.com
