figure_title: Differential landscape of cell-cell interactions PD
caption: (a)Differentially regulated LR pairs ranked by log2FC and statistical significance.
  Top LR interactions are highlighted (red up-regulated, blue down-regulated).(b)GO
  Biological Process enrichment analysis of the top 5% most significantly altered
  LR pairs reveals overrepresentation of neurodevelopmental and immune-modulatory
  pathways.(c)Total number of FDR-significant LR interactions per class, stratified
  by sender (opaque) and receiver (transparent) roles.(d)Log2FC ratio of significant
  up-regulated versus down-regulated CCIs (FDR < 0.05) across classes.(e)Sankey diagram
  depicting the directional flow of LR interactions centered on Myeloid cells, indicating
  their dominant role as both signal senders and receivers in PD
