figure_title: Cases exhibited a deregulated immunological profile 3 months prior to
  HIV-1 infection
caption: (A) Volcano plot showing differentially altered genes between 32 cases and
  64 controls, 3 months prior to cases being HIV positive. Red dots represent genes
  upregulated in cases, blue dots represent downregulated genes, and grey dots represent
  unaltered genes. (B) The differentially altered genes can distinguish HIV-1 cases
  from those who remained negative. (C) Supervised heatmap clustering showing differences
  in gene expression between cases and controls. (D) Gene enrichment analysis showing
  transcriptional alteration at the cellular level. Genes belonging to neutrophils
  and NK cells were downregulated, while those belonging to eosinophils and Th2 cells
  were upregulated. (E) Pathway gene enrichment analysis shows that immunosuppressive
  biological processes, such as IL10 signaling and Tregs, were upregulated in the
  cases, while inflammatory and reparative processes were downregulated
article_title: Variation in antiviral immunity and inflammation pathways precedes
  HIV-1 infection in a high-risk African cohort
