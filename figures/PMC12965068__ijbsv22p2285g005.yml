figure_title: CXCL8 activates JAK1/STAT3 signaling via CXCR1/2.
caption: 'CXCL8 activates JAK1/STAT3 signaling via CXCR1/2. (A) TIMER2.0 analysis
  showing correlation between CXCL8 and JAK/STAT pathway genes in HNSC. (B)-(C) CXCL8-induced
  phosphorylation of JAK1 and STAT3 in SCC4 and HSC3 was assessed using Western blot
  analysis (n=4). (D)-(E) Cells receiving pretreatment with CXCR1/2 inhibitors and
  subsequent CXCL8 incubation, phosphorylation of JAK1 and STAT3 was assessed using
  Western blot analysis (n=4). (F) JAK1 inhibition (Itacitinib: 50 nM) was followed
  by CXCL8 stimulation, and STAT3 phosphorylation was assessed by Western blotting
  (n=4). Results are expressed as the mean ± SD of four independent experiments. *
  p < 0.05 compared with the control group; # p < 0.05 compared with the CXCL8-treated
  group'
article_title: CXCL8 Drives MMP1 Upregulation and Promotes Metastatic Progression
  in Oral Cancer Through CXCR1/2-Mediated JAK1/STAT3 Activation
