figure_title: Preliminary validation of the SRIS in a cadaver by an expert user
caption: '(A) View from inside the trachea looking superiorly through the vocal cords
  into the hypopharynx. From left to right: procedure begins; introducer rounds oropharynx
  (blue tips visible); self-guided tube is advanced and passes cords; tube enters
  trachea and contacts camera before ETT is revealed. (B) External view of intubation,
  from left to right: introducer rounds oropharynx; self-guided tube is advanced;
  introducer is separated from the self-guided tube and removed without interrupting
  the ventilation pathway; self-guided tube remains in trachea. (C) Per-attempt intubation
  duration and introducer removal time. Data are presented as a bar graph of the average
  duration, with each attempt (dots) overlaid to describe the range; green signifies
  intubation success and red signifies intubation failure (no failures recorded).
  n = 10 trials'
