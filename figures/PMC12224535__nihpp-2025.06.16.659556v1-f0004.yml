figure_title: Schematic diagrams of differentially methylated nuclear genes (DMGs)
  that encode mitochondrial pathway proteins shared between persons with and without
  mild cognitive impairment (MCI) and Alzheimer’s disease (AD).
caption: Schematic diagrams of differentially methylated nuclear genes (DMGs) that
  encode mitochondrial pathway proteins shared between persons with and without mild
  cognitive impairment (MCI) and Alzheimer’s disease (AD). (A)–(C). Sense (>) and
  anti-sense (<) strands are depicted with gene name abbreviations above each panel.
  Alignment to human reference genome hg38 coordinates are displayed in base pairs
  (bp) at the bottom of each panel with the chromosome number (x-axis). The direction
  of gene transcription is depicted by small arrowheads on the blue line. Blue rectangles
  indicate coding exons connected by a blue line that indicate introns. CpG islands
  > 300 bp in length are indicated by green rectangles. The relative location of CpG
  dinucleotides in each gene is shown as a vertical line with circles on top, and
  one in 25 non-significant CpGs in each gene are shown (gray vertical line with circle,
  N.S.). The significance level (y axis) of differentially methylated CpGs is shown
  for MCI versus CU (top row; blue circles are hypomethylated, white circles hypermethylated),
  AD versus CU (middle row; red circles are hypomethylated, white circles hypermethylated),
  and AD versus MCI (bottom row; purple circles are hypomethylated, white circles
  hypermethylated). A corrected significance level of local false discovery rate <
  0.05 and > 2.5% differential methylation level was adopted for all comparisons
article_title: Differential DNA methylation in blood in nuclear genes that encode
  mitochondrial proteins in mild cognitive impairment and Alzheimer’s disease
