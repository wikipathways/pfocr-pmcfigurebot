figure_title: Mechanistic illustration of semaglutide’s “not clinically confirmed
  as biased” GLP-1 receptor agonism and its potential impact on salivary gland signaling.
caption: Mechanistic illustration of semaglutide’s “not clinically confirmed as biased”
  GLP-1 receptor agonism and its potential impact on salivary gland signaling. Semaglutide
  engages the GLP-1 receptor and activates both Gs-mediated cAMP signaling and β-arrestin–dependent
  pathways, meaning that neither pathway is preferentially or selectively favored
  based on currently available evidence. Persistent systemic exposure is prolonged
  by high-affinity albumin binding, which limits renal clearance and maintains circulating
  drug concentrations, leading to sustained receptor occupancy. Following receptor
  activation, elevated intracellular cAMP may interact with Ca2+-dependent oscillatory
  signaling, which is essential for physiological, rhythmic salivary secretion. Concurrent
  β-arrestin recruitment can promote receptor internalization and desensitization,
  potentially reducing receptor responsiveness over time. Together, these processes
  represent a hypothesis-driven framework through which prolonged GLP-1R activation
  may modulate salivary gland cell signaling dynamics and influence secretory output,
  although direct human salivary-gland pharmacodynamic data are not yet available
article_title: 'GLP-1 Receptor Signaling and Oral Dysfunction: A Narrative Review
  on the Mechanistic Basis of Semaglutide-Related Oral Adverse Effects'
