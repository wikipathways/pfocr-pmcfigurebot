figure_title: Efficacy of PCCUR on hypertrophic scar models in rabbit ears.
caption: Efficacy of PCCUR on hypertrophic scar models in rabbit ears. (A) Flow cytometry
  results indicating the apoptosis of HSFs, along with (B) the corresponding quantitative
  analysis of apoptotic cells. (C) Visual representation of changes in the appearance
  of the ears of rabbits following different treatments. (D) Histological evaluations
  showing H&E staining, Masson's trichrome staining, Sirius red staining (observed
  under polarized light), and TUNEL immunofluorescence staining for each treatment
  group. The quantitative assessments included the (E) SEI derived from H&E staining
  and the (F) CVF measured from Masson's trichrome staining. (G) Volcano plots showing
  DEGs identified in the PCCUR + L-2 group versus the control group. (H) Enriched
  KEGG pathways associated with the identified DEGs. (I) Heatmap displaying scar formation-related
  genes based on RNA-seq data. L-2 (660 nm, 0.3 W/cm2). The data are presented as
  the means ± SDs (n = 3 or 4). **P < 0.01 and ***P < 0.001
