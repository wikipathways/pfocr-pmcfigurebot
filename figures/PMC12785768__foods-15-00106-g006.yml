figure_title: Pathway analysis of differential metabolites.
caption: Pathway analysis of differential metabolites. (A) KEGG pathway classification
  of the 242 differential metabolites. Horizontal bars (color-coded by broad KEGG
  category) show the percentage of these metabolites associated with each metabolic
  pathway. Bar length corresponds to that percentage, with annotations of metabolite
  count and percentage of total differential metabolites. (B) KEGG pathway enrichment
  plot showing the differential abundance (DA) score for each pathway. Each point
  represents one pathway (p < 0.05). The x-axis is the DA score, reflecting the overall
  difference in metabolite levels between SH363 and SH361 (negative values indicate
  the pathway’s metabolites are, on average, more abundant in SH361; positive values
  indicate they are more abundant in SH363). Each point is plotted with a horizontal
  line representing the range (min to max) of individual metabolite contributions
  to that pathway’s score, and a central dot for the mean DA score. Point color reflects
  enrichment significance (blue for p ≈ 1, red for p ≈ 0) and size is proportional
  to the number of differential metabolites in the pathway
