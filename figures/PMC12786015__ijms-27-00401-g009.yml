figure_title: Hypothetical model for the formation of a multiphasic photosynthetic
  response in systemic tissues and its spatial dynamics induced by different local
  stimuli.
caption: Hypothetical model for the formation of a multiphasic photosynthetic response
  in systemic tissues and its spatial dynamics induced by different local stimuli.
  (a) Scheme of formation of a multiphasic photosynthetic response as a superposition
  of individual components induced by long-distance signals. The components of the
  response are presented as curves corresponding to the initial activation (cyan),
  fast (magenta) and long (purple) phases of inactivation. Superposition of putative
  components represents changes in effective quantum yield of photochemical reactions
  of photosystem II. (b) Scheme showing the dependence of the amplitudes of the signal
  and the phases of the photosynthetic response on distance. The dependence of the
  intensity of the signal attenuating with distance is shown on the left. An exponential
  dependence of signal intensity on distance is assumed. Dependences of the amplitudes
  of each response component on the signal intensity for different distances from
  the stimulation area are shown on the right. A typical sigmoid dependence of the
  response amplitude on the signal intensity is assumed. (c) Schematic representation
  of the features of the spatial dynamics of the photosynthetic response induced by
  different stimuli, using wounding and heating as examples. A schematic representation
  of the dependence of the intensity of wound- and heat-induced signals on the distance
  from the stimulation site is shown on the left. In the case of wounding, only an
  attenuating signal (blue) appears to propagate, whereas in the case of heating,
  an additional autopropagating signal (orange) is transmitted. Key differences between
  photosynthetic responses induced by different local stimuli are the ratio of response
  phases and spatial dynamics of the response, which are determined by differences
  in long-distance signals. Blue arrows indicate an attenuating signal transmitted
  through the vessels from the stimulation zone. The orange dashed arrow indicates
  an autopropagating signal transmitted through the symplastic pathway. d, distance;
  I, intensity
