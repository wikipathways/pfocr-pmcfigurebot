figure_title: Crosstalk of UTs with other signaling pathways.
caption: Crosstalk of UTs with other signaling pathways. UT-A can be directly phosphorylated
  by PKA, AMPK, and PKC and can be ubiquitinated by MDM2. IL-11R inhibits UT-A via
  regulating STAT3. UT-B interacts with TβRII and stabilizes the TβRII protein, hindering
  Smurf1 mediated K48 linked ubiquitination degradation and enhancing TGF-β/Smad signaling.
  Snail directly upregulates SLC14A1 via transcriptional regulation. TGF-β pathway
  and SLC14A1 establish a positive feedback loop. The figure was created by Figdraw
  (www.figdraw.com, accessed on 3 August 2025)
