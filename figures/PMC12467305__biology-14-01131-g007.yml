caption: The expression of genes in the phenylpropanoid and flavonoid biosynthesis
  pathway was analyzed by seq-RNA and RT-qPCR. The column chart reflects the FPKM
  value of the transcript expression, while the line chart reflects the relative gene
  expression by RT-qPCR method. The relative gene expression was calculated using
  the 2−ΔΔCt method. The vertical bars in the line chart indicate the mean ± standard
  deviation, with n = 3. Line plots marked with different lowercase letters signify
  significant differences using one-way analysis of variance (ANOVA) followed by Duncan’s
  multiple range test (p < 0.05)
