figure_title: Remaining microglia in individuals with ALSP exhibit signatures of activation
  and lipid metabolism
caption: a, Uniform manifold approximation and projection (UMAP) plot of nuclei isolated
  from the brains of control individuals and individuals with ALSP; n = 208,982 total
  nuclei; N = 13 control individuals and N = 6 individuals with ALSP. Ex_neuron, excitatory
  neurons; In_neuron, inhibitory neurons; Oligo, OLs; Astro, astrocytes; Micro, microglia
  and the other myeloid cells; Endo, endothelial cells; SMCs, smooth muscle cells;
  Peri_Fibro, pericytes and fibroblasts; Cb_Oligo, a subset of OLs that is enriched
  in cerebellum; IMM, immune cells. b, Box plots showing the nuclei frequency of each
  cell type comparing control and ALSP samples. c, Representative IHC images of IBA1
  staining in the gray matter of ALSP and control brains (left), with corresponding
  quantification (right). Statistical significance was assessed using a nonparametric
  t-test. Data are presented as the mean ± s.e.m.; n = 9 control samples, n = 4 ALSP
  samples. Scale bars, 50 μm. d, Representative IHC images of IBA1 staining in the
  white matter of ALSP and control brains (left), with corresponding quantification
  (right). The inset shows an ameboid microglial cell. Statistical significance was
  assessed using a nonparametric t-test. Data are presented as box-and-whisker plots
  with all data points (minimum to maximum); n = 9 control samples, n = 4 ALSP samples.
  Scale bars, 50 μm. e, Number of upregulated (up) and downregulated (down) DEGs between
  ALSP and control individuals per cell type (log2fold change (FC) > 0.5, false discovery
  rate (FDR)-adjusted P value < 0.05)). DEGs for SMC, Peri_Fibro and IMM, which are
  present in low numbers, can be found in Supplementary Table 1. f, UMAP plot of microglia
  and other myeloid cells (re-cluster from the Micro cluster in a) from control individuals
  (N = 10) and individuals with ALSP (N = 5); n = 3,655 nuclei in control individuals,
  and n = 2,650 nuclei in individuals with ALSP; control-5, control-6 and ALSP-4 were
  removed due to the low number of myeloid cells in the sample (less than 50 nuclei
  per sample). MG, microglia; BAMs, border-associated macrophages. g, Donut plots
  showing nuclei distribution of each myeloid cell subset in control or ALSP samples.
  The percentages of the designated subcluster are labeled. h, Nuclei frequencies
  of each myeloid cell subset across all samples. i, Volcano plot depicting DEGs in
  ALSP versus control microglia (log2FC > 0.5, FDR-adjusted P value < 0.05, two-part,
  generalized linear model). j, Molecular function (MF) enriched in microglia from
  ALSP or control samples. Analyzed by clusterProfiler; log2FC > 0.5, FDR-adjusted
  P value < 0.05, q value < 0.1. k, IPA of pathways predicted to be activated or inhibited
  in ALSP microglia. l, Venn diagrams of overlapping genes commonly upregulated in
  ALSP microglia and microglia from two multiple sclerosis datasets (left). m, Venn
  diagrams of overlapping genes commonly upregulated in ALSP microglia and microglia
  from APOE4/E4 AD and APOE3/E3 AD brains. n, Expression level of ACSL1, DPYD and
  NAMPT in myeloid cells from control or ALSP brains. P values were calculated by
  two-sided Wilcoxon rank-sum test. o, Representative images of IHC staining of CD163,
  SPP1, FTL, P2RY12 and TMEM119 in control and ALSP brain white matter areas. Scale
  bars, 50 μm. Arrowheads point to the cells with CD163, SPP1 or FTL stainings in
  ALSP brains
