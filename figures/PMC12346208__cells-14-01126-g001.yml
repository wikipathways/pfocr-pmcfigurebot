figure_title: A historical model of p53-MDM2 nexus regulatory pathways.
caption: A historical model of p53-MDM2 nexus regulatory pathways. In cellular signaling,
  extracellular agonists act as first messengers by binding to membrane receptors,
  initiating pathways that promote either cell growth or DNA-damage response. In both
  contexts, PIPns serve as second messengers that propagate the signal to elicit a
  cellular response. Under growth stimulation, activated growth factor receptors trigger
  the generation of PIP3 that activates the PI3K-AKT pathway, leading to MDM2 phosphorylation
  and its nuclear translocation, where it suppresses p53. Conversely, under DNA damage,
  kinases such as ATM/ATR or ARF inhibit MDM2, thereby stabilizing and protecting
  p53
