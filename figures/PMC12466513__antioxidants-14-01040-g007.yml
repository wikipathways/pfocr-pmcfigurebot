figure_title: The effect of okanin on the SIRT3/FOXO3a signaling pathway.
caption: The effect of okanin on the SIRT3/FOXO3a signaling pathway. (A–E) The mRNA
  expression levels of SIRT3, FOXO3a, LC3B, PINK1, and Parkin were quantified by RT-PCR
  (n = 3). (F) The expression levels of SIRT3 and FOXO3a proteins. (G) siRNA inhibited
  the expression of the SIRT3 protein in HaCaT cells. The expression of the FOXO3a
  protein (H), and the expression of PINK1 and Parkin mRNA (I) after SIRT3 knockdown
  using siRNA. (J) The expression of NDUFS1, SDHA and LC3-II/I proteins after SIRT3
  inhibition. Values are presented as the mean ± SEM. * p < 0.05, ** p < 0.01, ***
  p < 0.001, **** p < 0.0001
