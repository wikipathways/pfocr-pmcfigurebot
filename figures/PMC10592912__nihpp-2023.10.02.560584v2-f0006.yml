figure_title: Forward genetic screens identify modulators of VGLUT-associated DA neuron
  resilience
caption: |-
  (A) Flow chart depicting the process by which candidate genes were selected for forward genetic screening.(B) Primary paraquat screen: 187 candidate genes differentially expressed in TH+/VGLUT+ DA neurons were knocked down via RNAi. Adult (2d post-eclosion) male and female TH-driven RNAi flies were exposed to either paraquat (10mM, 4d) or vehicle control. Paraquat-induced alterations in locomotion over days 2–4 of exposure are plotted as % locomotion relative to each candidate’s vehicle-treated control. For reference, TH-driven dVGLUT RNAi flies (orange dashed lines) were tested alongside candidates. Average paraquat locomotion of 5 Bloomington Drosophila Stock Center (BDSC)/Harvard Transgenic RNAi Project (TRiP) control lines tested are represented by green dashed lines. Two screen hits that are orthologs of human genes with known roles in PD are highlighted (i.e., dj-1β, Tom20). N=3–37 flies per group; mean N=18 flies per group.(C) GO pathway analysis of paraquat screen candidate hits.(D) Secondary αSynA53T
  screen: The top 32 candidate genes from the primary screen were knocked down via TH-driven RNAi alongside TH-driven αSynA53T expression. αSynA53T-induced changes in locomotion (at 4–6d post-eclosion) are plotted as % UAS Control. N=12–39 flies per group; mean N=21 flies per group.(E) GO pathway analysis of candidate hits from the αSynA53T secondary screen.Each candidate’s results in the screens along with control line results are shown in Table S5. Further analyses of candidate genes are included in Figure S8. All data are plotted as Mean±SEM
article_title: Sexually dimorphic mechanisms of VGLUT-mediated protection from dopaminergic
  neurodegeneration
