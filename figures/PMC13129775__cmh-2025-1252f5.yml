caption: DDX1 binds to the 3’ UTR regions of PRMT1 and USP10 mRNA to promote transcription.
  (A) Radar chart of differential gene expression levels between DDX1OE and V101 in
  RNA-seq sequencing. (B) Differentially expressed genes reactome pathway analysis.
  (C) The luciferase reporter gene detects changes in fluorescence intensity when
  DDX1 acts on different structures of USP10 and PRMT1 mRNAs. (D) The luciferase reporter
  gene detects changes in fluorescence intensity upon overexpression or knockdown
  of DDX1 acting on the 3’UTR region of USP10 and PRMT1 mRNA. (E) Effect of PRMT1
  on USP10 protein levels. (F) Detection of the role of the R602 site in PRMT1 on
  USP10 mRNA and protein levels. **P<0.01 and ***P<0.001; ns, not significant. WT,
  wild-type
