figure_title: Validation of targetable pathways in mouse kidney disease models
caption: '(a) Experimental scheme of the folic acid (FA)-induced kidney disease model
  and representative PAS-stained kidney section. Representative histological image
  from one folic acid-treated mouse. Similar results were observed in four independent
  mice. Scale bar: 20 μm.(b) Radar plots visualizing cell-type-specific coordination
  changes (CellSpectra, cross-species reference) in individual FA mice (biological
  replicates 1–3) using the KEGG pathway database. Axes represent cell types, plots
  scaled as noted.(c) Heatmaps of “TNF −” and “mTOR signaling” pathway coordination
  (upper, R2 values, CellSpectra) and normalized enrichment scores (lower, NES, GSEA-based).
  Each column represents one FA mouse (FA1–4). Red indicates lower R2 (coordination
  changes) or higher NES; ns = not significant. Non-significant samples are assigned
  R2 = 1 or NES = 0.(d) Density plots of Tsc2 and Akt3 expression (“mTOR signaling”)
  in PT cells of one FA mouse vs. healthy reference. The blue arrow indicates the
  reference gene expression distribution. Red arrow represents the individual FA mouse
  gene expression. Density (y-axis) and normalized gene expression of samples (x-axis).(e)
  Boxplots visualizing underlying gene expression coordination changes of “TNF signaling”
  in PT cells of the FA-induced kidney disease model (FA, n = 4 biological replicates)
  or the pooled on-the-fly reference (120 randomly permuted values equally derived
  from n = 10 biological replicates). Normalized gene expression of individual samples
  (y-axis). Box plots show the median (center line), quartiles (box limits), and whiskers,
  which extend to the minimum and maximum values within 1.5×IQR. Data points outside
  this range are plotted as outliers. Vascular Cell Adhesion Molecule 1 (Vcam1), C-X-C
  Motif Chemokine Ligand 1 (Cxcl1), C-X-C Motif Chemokine Ligand 2 (Cxcl2), cAMP Responsive
  Element Binding Protein 5 (Creb5), Conserved Helix-Loop-Helix Ubiquitous Kinase
  (Chuk, also known as IKK-α), Baculoviral IAP Repeat Containing 3 (Birc3).(f) Schematic
  of TNF pathway targeting (etanercept) followed by FA injection in mice.(g) Blood
  urea nitrogen (BUN) levels (y-axis) in FA and FA plus etanercept injected animals
  (x-axis). N = 5 biological replicates per group. Mean (bars) +/− SEM are shown.
  Statistical analysis was performed using an unpaired two-tailed Student’s t-test'
article_title: Analysis of individual patient pathway coordination in a cross-species
  single-cell kidney atlas
