figure_title: Boldly moving the field of ILD forward.
caption: Boldly moving the field of ILD forward. (A) Schematic illustration representing
  major themes that emerged from the 2024 Aspen Lung Conference supporting that ILD
  is a temporally dynamic disease with a beginning, middle, and end with distinct
  steps and pathways along that way that must be fully understood to generate a transformative
  road map for therapeutic success. (B) To move beyond incremental strides in ILD
  research, we need to adopt bottom-up and top-down strategies that involve interdisciplinary
  and interinvestigator collaboration, bold ideas with big vision, novel technologies,
  and support from our institutions and philanthropic organizations. Figures created
  in Biorender. ECM = extracellular matrix. ILA = interstitial lung abnormality
