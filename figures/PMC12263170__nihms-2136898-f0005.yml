figure_title: Single cell RNA sequencing identifies heterogeneity among TAMs in Mycn-nGEMM
  tumors, which correlates with TAMs in human NB
caption: (A) UMAP of 11,943 CD45+ cells and neuronal cells obtained from 3 replicates
  of Mycn-nGEMM tumors, after integration.(B) Violin plot of Mif mRNA expression by
  cell type of the Mycn-nGEMM tumors.(C) UMAP of 1,780 Mycn-nGEMM TAMs. Three major
  clusters were identified and annotated according to marker genes and pathway analysis
  (See text for details).(D) Dotplot presenting the marker genes for each cluster
  of (C)(E) Distributions of M2 signature (left) and M1 signature (right) scores for
  each TAM subtypes in (C).(F) Heatmap of correlation scores between Mycn-nGEMM TAMs
  and Human TAMs subtypes defined by Wienke et al (Wienke et al., 2024). Columns represent
  Mycn-nGEMM TAM cells and rows represent Human TAM subtypes. The colored bar at the
  top represents the Mycn-nGEMM macrophage clusters (subtypes)
