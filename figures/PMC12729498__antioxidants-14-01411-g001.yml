figure_title: The multi-layered antioxidant defense network against ferroptosis.
caption: 'The multi-layered antioxidant defense network against ferroptosis. Ferroptosis
  is a form of regulated cell death driven by iron-dependent LPO (pathways in red).
  The process is initiated when a hydroxyl radical (HO•) attacks a polyunsaturated
  fatty acid (PUFA) within a phospholipid (PLH), generating a lipid radical (PL•).
  This radical enters the propagation phase, reacting with O2 to form a lipid peroxyl
  radical (PLOO•). PLOO• subsequently attacks an adjacent PLH, creating a lipid hydroperoxide
  (PLOOH) and a new PL•. This cascade is amplified by ferrous iron Fe2+, which catalyzes
  the decomposition of PLOOH into highly reactive alkoxyl radical (PLO•). Cells employ
  a sophisticated, multi-layered defense system (pathways in blue) to counteract this
  process: the canonical pathway relies on GPx4/GSH, while the GPX4-independent axes
  are represented by FSP1/CoQ10, GCH1/BH4, DHODH and MBOATs. Created in BioRender.
  Smith, J. (2025). BioRender.com/c248457'
