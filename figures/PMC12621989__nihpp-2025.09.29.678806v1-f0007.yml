figure_title: The evolution of asymmetry is a dynamic and age-specific process
caption: This figure shows the mean rate of change (slope) of the population-median
  absolute lateralization index (|LI|) within four distinct life stages (rows). Each
  cell represents the slope for a given feature and white matter tract. Warmer colors
  (red) indicate an increase in the magnitude of asymmetry (strengthening of lateralization),
  while cooler colors (blue) denote a decrease in the magnitude of asymmetry (attenuation
  of lateralization). Childhood shows heterogeneous increases and decreases across
  pathways, adolescence largely continues these trends with smaller slopes, young
  adulthood is comparatively muted, and later adulthood shows a predominant increase—most
  marked for macrostructural measures (volume, surface area)
article_title: Lifespan Trajectories of Asymmetry in White Matter Tracts
