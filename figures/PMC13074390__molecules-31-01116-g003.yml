figure_title: Schematic diagram of the molecular mechanism of tannins in regulating
  inflammation and immune response.
caption: 'Schematic diagram of the molecular mechanism of tannins in regulating inflammation
  and immune response. The upper phospholipid bilayer represents the host cell plasma
  membrane, and the right phospholipid bilayer represents the microbial membrane (bacteria,
  viruses, parasites). Under pathogenic stimulation, macrophages are activated and
  release a variety of pro-inflammatory factors, which further trigger intracellular
  inflammatory signaling pathways, including PI3K/Akt/NF-κB, MAPK, and NLRP3 inflammasome,
  ultimately leading to severe inflammatory responses. Tannins serve as the key regulatory
  component to inhibit the activation of macrophages and the production of pro-inflammatory
  cytokines. Meanwhile, tannins directly act on microbial surface structures to reduce
  pathogenic stimulation. Through inhibiting multiple inflammatory signaling pathways,
  upregulating antioxidant enzymes and enhancing the expression of tight junction
  proteins, tannins effectively alleviate oxidative stress and inflammatory damage,
  maintain cellular barrier function, and finally exert significant anti-inflammatory
  and immunomodulatory effects. Arrow explanation: Downward arrows (↓) indicate downregulation
  or inhibition; upward arrows (↑) indicate upregulation or activation; solid arrows
  (→) represent activation/signaling'
