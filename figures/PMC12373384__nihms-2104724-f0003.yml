figure_title: Single cell analysis of fibrotic and remodeling skin reveals fibroblast
  subcluster specific to the fibrotic phase
caption: '(A) Schematic of sequencing of baseline, fibrotic, and remodeling skin samples
  (B) Left; UMAP of overall cell phenotypes identified from single-cell transcriptomic
  profiling of skin. Right: UMAP of fibroblasts identified from single-cell transcriptomic
  profiling of skin. (C) Proportion analysis of fibroblast subtypes over time. (D)
  Gene analyses of top differentially expressed markers of all fibroblast clusters.
  Top; Fibroblast Cluster 0 Markers. Blue box shows expression of cluster defining
  markers. Bottom; Fibroblast Cluster 3 Markers. Purple box shows expression of cluster
  defining markers. (E) Gene ontology (GO) pathway and GO term analysis of cluster
  0 (Top) and cluster 3 (Bottom). (F) Cell chat signaling of pathways enriched in
  Day 21 compared to Day 12 signaling including Apolipoprotein E (APOE) and Oncostatin
  (OSM) signaling (Top). Immunostaining of APOE and OSM in Day 21 skin (Bottom). Scale
  bar (F) 300 μm'
