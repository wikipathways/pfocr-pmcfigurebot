figure_title: Dynamic changes of gut microbiota in MASLD-HCC.
caption: 'Dynamic changes of gut microbiota in MASLD-HCC. Microbial metabolism, bacterial
  metabolites and antigens are draining into the liver, altering the environment.
  Bacteria and antigens activate B cells through MyD88-dependent or BCR signaling
  pathways, which finally induce B cells to differentiate into plasma cells or inflammatory
  phenotype. LPS binds to TLR4 in the liver and activates the downstream NF-κB and
  MAPK signaling pathways, leading to the secretion of inflammatory cytokines and
  promoting liver inflammation. LTA induces a senescent phenotype in HSCs, leading
  to the release of SASP factors. IL-33 is subsequently exported from senescent HSCs
  activating Tregs. SCFAs and primary bile acids tend to increase while 3-IPA and
  secondary bile acids tend to decrease. SCFAs activate STAT3 and mTOR in Th1 cells
  and upregulate transcription factor Blimp-1 consequently, thus promoting the secretion
  of IL-10 by Th1 cells. SCFAs also result in an immunosuppressed response by increasing
  Tregs and attenuating CD8+ T cells responses. Bile acids could bind to the TGR5
  and FXR, thereby reducing lipid synthesis and glucose levels. Primary bile acids
  are used by the gut microbiome to upregulate the expression level of CXCL16 to mediate
  the accumulation of CXCR6+ NKT cells, which are activated and produce more IFN-γ
  upon antigen stimulation. Secondary bile acids had a negative effect on CXCL16 expression,
  causing an opposite result. Abbreviations: Blimp-1, B lymphocyte-induced maturation
  protein 1; CXCL16, C-X-C motif chemokine ligand 16; CXCR6, C-X-C motif chemokine
  receptor 6; FXR, farnesoid X receptor; HSC, hepatic stellate cell; IFN-γ, interferon
  gamma; IL-10, interleukin 10; IL-33, interleukin 33; IPA, indole propionic acid;
  LPS, lipopolysaccharide; LTA, lipoteichoic acid; mTOR, mammalian target of rapamycin;
  MyD88, myeloid differentiation primary response 88; MASH, metabolic dysfunction
  associated steatohepatitis; MASLD-HCC, metabolic dysfunction associated steatotic
  liver disease-related hepatocellular carcinoma; NKT, natural killer T cells; SCFAs,
  short-chain fatty acids; STAT3, signal transducer and activator of transcription
  3; SASP, senescence-associated secretory phenotype; TGR5, G-protein-coupled bile
  acid receptor 5; Th, T helper cells; TLR4, Toll-like receptor 4; Tregs, regulatory
  T cells'
