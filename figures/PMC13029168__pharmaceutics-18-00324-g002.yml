caption: ARE induces G1/S arrest through transcriptional suppression of cell cycle
  regulators. (A) Heatmap showing differential gene expression profiles in MCF-7 cells
  following treatment with ARE (0.1, 0.3, and 0.5 mM). (B) Bubble plot representing
  the KEGG pathway enrichment analysis of significantly down-regulated genes. (C)
  Chord diagram illustrating the intricate interactions between the most enriched
  pathways and their associated key genes. (D) Flow cytometry analysis and quantification
  of cell cycle distribution in MCF-7 cells 12 h post-treatment, showing G1/S phase
  arrest. Data are expressed as mean ± SD (n = 3 biological replicates). *, p < 0.05,
  **, p < 0.01 vs. the untreated control (CTRL) group
