caption: Transcriptome analysis of the effects of mn deficiency on the mouse liver.
  (A) Volcano plots were used to illustrate the changes in gene expression between
  the MnD group to that of the control group; (B) volcano plots were used to illustrate
  the changes in gene expression between the MnD + Mn group to that of the MnD group;
  (C) a Venn diagram was used to display the overlapping differentially expressed
  genes between the MnD vs. control and MnD + Mn vs. MnD comparisons; (D) the bubble
  plot displays the top 15 enriched GO terms from the overlapping differentially expressed
  genes; (E) The bubble chart displays the top 20 enriched KEGG pathways from the
  overlapping differentially expressed genes
