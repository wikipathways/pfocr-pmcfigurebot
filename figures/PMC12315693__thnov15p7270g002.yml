figure_title: XZ1606 induces degradation of BRD4 via the ubiquitin-proteasomal pathway
  in LX-2 cells.
caption: XZ1606 induces degradation of BRD4 via the ubiquitin-proteasomal pathway
  in LX-2 cells. (A) Inhibition of BRD4 degradation by calcium chelation. Pre-treatment
  with EGTA (calcium chelator) reduces the XZ1606-induced BRD4 degradation, suggesting
  calcium signaling involvement in the mechanism of action. (B) Knockdown of ASGPR
  blocked the degradation of LIVTAC on BRD4. Small hairpin RNAs (shRNA) were used
  to knock down the ASGPR in LX-2 cells. (C) Proteasomal involvement in BRD4 degradation.
  Pre-treatment with indicated concentration of MG-132 (proteasomal inhibitor) blocks
  XZ1606-induced BRD4 degradation. (D) Ectopic expression of exogenous BRD4 and ubiquitin.
  LX-2 cells were treated with 100 nM XZ1606 for 4 h after which 20 μM MG132 were
  added for an additional 4 h. Cell lysates were collected for Western blot analysis
