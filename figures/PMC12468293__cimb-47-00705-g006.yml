caption: 'Ro 61-8048 inhibits KMO activation and reversal of the kynurenine metabolic
  pathway to the neuroprotective branch in epilepsy mice. After Ro 61-8048 intervention,
  we have the following: (A) decreased 3-HANA level; (B) reduced 3-HK/KYN ratio; (C)
  increased KYNA level; and (D) increased KYNA/KYN ratio. Data represent means ± SD
  (n = 3−6 mice/group). Bars indicate statistical differences among groups. * p <
  0.05, ** p < 0.01, *** p < 0.001, and n.s. = not significant'
