figure_title: Pathophysiology of SH in stroke.
caption: 'Pathophysiology of SH in stroke. SH mechanisms represent a complex interaction
  between glucose regulatory centers, the HPA axis, the sympathetic adrenomedullary
  system, and various humoral factors. Activation of the VMH by stress signals will
  initiate excessive glucose production via stimulation of the HPA axis and the sympathetic
  adrenomedullary system. The adrenal medulla is stimulated to release catecholamines
  through the paraventricular nucleus (PVN)–ventrolateral medulla (VLM)–intermediolateral
  column (IML) pathway. Concurrently, the adrenal cortex is stimulated to release
  cortisol. These hormones, together with the effects of glucagon, and growth hormone
  promote hepatic glycogenolysis and gluconeogenesis. Finally, this response is amplified
  by the release of pro-inflammatory cytokines, creating a viscous cycle. TNF-a: Tumor
  necrosis factor-alpha; ACTH: Adrenocorticotropic hormone; CRH: Corticotropin-releasing
  hormone; IL-1B: Interleukin-1 beta; IL-6: Interleukin-6; FFA: Free fatty acids;
  MCP-1: Monocyte chemoattractant protein-1; GLUT1: Glucose transporter type 1; GLUT3:
  Glucose transporter type 3; GLUT4: Glucose transporter type 4'
