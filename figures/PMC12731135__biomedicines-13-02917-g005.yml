figure_title: Effect of ATZ exposure on Nrf2 signaling pathway and cell cycle during
  IVS.
caption: 'Effect of ATZ exposure on Nrf2 signaling pathway and cell cycle during IVS.
  (a) qRT-PCR analysis showing that ATZ treatment upregulated NFE2L2 expression in
  all SSCLC lines, indicating ATZ-initiated oxidative stress. (b–d) Relative gene
  expression of antioxidant defense–related genes (as NFE2L2 target gene), including
  SOD1, GPX1, and NQO1, was also upregulated, particularly at 10 μM ATZ across all
  cell lines. (e) The expression of CDK1, a key regulator of the cell cycle and cell
  proliferation, remained stable in most groups, but showed a significant increase
  in HD2 SSCLCs treated with 10 µM ATZ. Data are presented as mean ± SEM from three
  biological replicates (n = 3). Statistical significance was determined using one-way
  ANOVA followed by Tukey’s multiple comparison test. Comparisons were made with the
  SSCLC no treatment of each cell line: * p < 0.05, ** p < 0.01, *** p < 0.001, ****
  p < 0.0001'
