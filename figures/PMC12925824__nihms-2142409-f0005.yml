figure_title: Pathway Optimization for UDP-Galactose formation in E. coli
caption: '(a) Native UDP-galactose production pathway in E. coli via GalT. (b) BLUSP
  mediated UDP-galactose production pathway. (c) and (d) AL4457(Δzwf ΔpfkA ΔrpiB ΔmanA,
  Table 1) harboring pAL2579 (PLlacO1: galM, PLlacO1: galK, PLlacO1: galT, Table 2)
  or pAL2611 (PLlacO1: galM, PLlacO1: galK, PLlacO1: BLUSP, Table 2) and pAL2710 (PgadB:
  MBD-Cvβ3galT–MBD-Cvβ3galT–MBD-NmlgtA, Table 2). (c) Cells were grown in M9YT medium
  with or without 10 g L−1 lactose at 37 °C until OD600 ~0.4, then shifted to 30 °C
  for 20 h. At OD600 ~0.4, 1 mM IPTG was added when required. Normalized peak area
  values were calculated by dividing the HPAEC-PAD peak area of each UDP-sugar by
  the culture optical density (OD600). (d) Cells were grown in M9YT medium with 5
  g L−1 lactose at 37 °C until OD600 ~0.4, then shifted to 30 °C for 24 h. At OD600
  ~0.4, 1 mM IPTG was added. Error bars represent s.d. from three biological replicates
  (n = 3)'
