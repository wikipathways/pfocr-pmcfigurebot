figure_title: Translational pathway in preeclampsia and fetal growth restriction (PE/FGR).
caption: Translational pathway in preeclampsia and fetal growth restriction (PE/FGR).
  The flowchart maps the cascade from molecular lesions (↑ sFlt-1/↓ PlGF angiogenic
  imbalance, dysregulated HIF signaling, altered KIR/HLA-C interactions) to morphological/vascular
  phenotypes (shallow trophoblast invasion, incomplete spiral artery remodeling, accelerated
  villous maturation, distal villous hypoplasia, syncytial knots), leading to clinical
  consequences (maternal hypertension, proteinuria, uteroplacental malperfusion, fetal
  growth restriction, increased perinatal morbidity). The diagram also highlights
  biomarkers currently validated in clinical practice (sFlt-1/PlGF ratio) and emerging
  ones (cell-free DNA [cfDNA], cell-free RNA [cfRNA], extracellular vesicle–derived
  microRNAs [EV-miRNAs])
