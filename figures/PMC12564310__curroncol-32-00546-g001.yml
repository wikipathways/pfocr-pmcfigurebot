figure_title: Cell cycle schematic showing the phases (G1, S, G2, and M) and key natural
  compounds investigated in Saudi-based studies for colorectal cancer (CRC) therapy.
caption: Cell cycle schematic showing the phases (G1, S, G2, and M) and key natural
  compounds investigated in Saudi-based studies for colorectal cancer (CRC) therapy.
  Ferula hermonis targets the G1 phase via caspase-3/7 activation and modulation of
  apoptotic gene expression. Nigella sativa and Olive leaf extract induce S-phase
  arrest through NF-κB inhibition, Bax/Bcl-2 modulation, ROS elevation, and DNA fragmentation.
  Tetraclinis articulata demonstrates cytotoxic activity in both S and G2 phases due
  to oxygenated sesquiterpenes. Moringa oleifera causes p53-mediated G2/M arrest.
  Selaginella repanda and Sansevieria trifasciata exert M-phase-specific effects,
  showing dose- and time-dependent cytotoxicity and selective action on CRC cells,
  respectively. Together, these agents modulate checkpoints and apoptotic pathways,
  supporting their relevance in CRC treatment strategies (created by the authors using
  PowerPoint)
