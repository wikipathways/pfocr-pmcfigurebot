figure_title: Overexpression of corin mitigates OGD/H-induced cell migration impairment,
  inflammatory response, and mitochondrial dysfunction in HAPI microglia via the AMPK
  pathway.
caption: 'Overexpression of corin mitigates OGD/H-induced cell migration impairment,
  inflammatory response, and mitochondrial dysfunction in HAPI microglia via the AMPK
  pathway. Cells were pre-transduced with corin-overexpressing or control lentivirus
  for 24 h, followed by OGD/H and treatment with 10-μM Compound C for 24 h. Subsequent
  assessments included: (A) cell viability, (B) migration, (C) iNOS and Arg-1 mRNA
  levels, (D) Iba-1, p-AMPK, and AMPK protein levels, (E) OCR, (F-J) activities of
  mitochondrial complexes I-V, and (K) ATP generation. Data presented as mean ± SD
  (n = 3). All experiments were repeated three times. Significant differences between
  groups were assessed using one-way ANOVA with Tukey’s post-hoc test. *P < 0.05,
  **P < 0.01, ***P < 0.001 vs. OGD/H＋vector＋vehicle. #P < 0.05, ##P < 0.01, ###P <
  0.001 vs. OGD/H＋Corin+vehicle'
