caption: Effects of combined pathway inhibitions on MYC and cyclin D1 expression in
  TNBC cells. (A) Western blot analysis of PARP, XIAP, and caspase-3 protein levels
  in cells treated with indicated inhibitor combinations for 24 h, β-actin as a loading
  control. Representative images from three independent experiments were shown. (B,C)
  Relative MYC and CCND1 mRNA levels measured by quantitative RT-PCR following 24
  h treatment. Data represent mean ± SEM from three independent experiments. * p <
  0.05, ** p < 0.01, and *** p < 0.005
