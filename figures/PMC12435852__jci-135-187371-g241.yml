figure_title: The spatial signature of DZ cells is independent of AICDA-related mutational
  processes
caption: '(A) Representative photomicrographs of H&E and IHC for Cre+ and Ki-67+ cells
  on mesenteric lymph nodes from WT and Aicda–/– mice. Original magnification, ×200.
  Scale bars: 100 μm. (B and C) Quantitative analyses of Cre+ (B) and Ki-67+ (C) cells
  in WT and Aicda–/– GCs (n = 20). Statistical analysis was assessed using a 2-tailed
  unpaired Mann-Whitney test. Values are shown as mean ± SEM; ***P < 0.001, ****P
  < 0.0001. (D) Representative photomicrographs of H&E-stained sections from WT and
  Aicda–/– mesenteric lymph nodes involved in the Visium spatial transcriptome experiment
  profiling. Original magnification, ×50. Scale bars: 250 μm. (E) Spatial visualization
  of WT and Aicda–/– follicle/GC clusters. (F) Volcano plot showing differentially
  expressed genes between WT cluster 4 and Aicda–/– clusters 1 and 3 (Wilcoxon’s rank
  sum test adjusted P values < 0.05, absolute log fold change > 0.025). (G and H)
  Spatial projection of DZ spatial signature (G) and T cell signature (H) total expression
  in WT and Aicda–/– samples. (I–L) Representative photomicrographs of triple IHC
  staining for DZ Ki-67+ (cyan signal), LZ CD21+ (pink signal), and CD4+ (I) or CD8+
  cells (K) (brown signal) and quantitative analyses of the percentage of CD4+ (J)
  or CD8+ (L) T cells in WT and Aicda–/– GCs (n = 10 WT GCs; n = 10 Aicda–/– GCs).
  Original magnification, ×400. Scale bars: 50 μm. Statistical analysis: 2-tailed
  unpaired Mann-Whitney test. Mean ± SEM is shown. (M) Gene set enrichment analysis
  (GSEA) of DZ spatial signature in AICDA-high and AICDA-low DZ B cells. (N) Pathway
  enrichment of 257 AICDA-high signature genes using Reactome Pathway library. (O)
  Pathway enrichment of 127 AICDA-low signature genes using Reactome Pathway library'
