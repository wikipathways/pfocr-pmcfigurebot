figure_title: Molecular characterization of STING signaling pathway-related genes
  in PAAD.
caption: 'Molecular characterization of STING signaling pathway-related genes in PAAD.
  (A) Protein-protein interaction (PPI) network of core STING signaling components
  identified through STRING database analysis (minimum interaction score: 0.4). (B)
  Expanded PPI network showing secondary interactors of STING pathway genes (minimum
  interaction score: 0.7). (C) Consensus matrix heatmap classifying patients with
  PAAD into two molecular subtypes (C1 and C2) based on STING-related gene expression
  patterns. (D) Heatmap comparing expression profiles of STING-related genes across
  PAAD subtypes (C1 vs. C2) with expression gradient key (red, high expression; blue,
  low expression). (E) Kaplan-Meier survival analysis showing significantly reduced
  overall survival in the STING-enriched subtype (C1) compared with the STING-depleted
  subtype (C2). STING, stimulator of interferon genes; PAAD, pancreatic ductal adenocarcinoma;
  CGAS, cyclic GMP-AMP synthase; TBK1, TANK-binding kinase 1; MAVS, mitochondrial
  antiviral-signaling protein; TRIM56, tripartite motif-containing 56; TREX1, three
  prime repair exonuclease 1; TRIM32, tripartite motif-containing 32; IFI16, interferon
  γ inducible protein 16; IFIT1, interferon-induced protein with tetratricopeptide
  repeats 1; DDX41, DEAD-box helicase 41; NLRP4, NLR family pyrin domain containing
  4; DTX4, deltex E3 ubiquitin ligase 4; ZDHHC1, zinc finger DHHC-type containing
  1; PRKDC, protein kinase DNA-activated catalytic subunit; XRCC, X-ray repair cross
  complementing; ELF4, E74-like ETS transcription factor 4; NLRC3, NLR family CARD
  domain containing 3; ARF1, ARF GTPase 1; DDX56, RNA sensor RIG-I; IKBKE, inhibitor
  of nuclear factor κB kinase subunit ε; IRF3, interferon regulatory factor 3; RNF5,
  ring finger protein 5'
