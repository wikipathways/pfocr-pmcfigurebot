figure_title: PFOA and PFHxS Exposure Induced Lipid Accumulation.
caption: PFOA and PFHxS Exposure Induced Lipid Accumulation. (A) Liver spheroids were
  cultured for 7 days with PFHxS, PFOA, PFOS or PFNA. Intracellular lipid accumulation
  was visualized with Nile Red (red), and cell nuclei were stained with DAPI (blue)
  (n = 4). Images were captured using confocal microscopy at 400x magnification, and
  lipid levels were quantified using ImageJ software. Statistical significance was
  determined using one-way ANOVA (***p < 0.001; ****p < 0.0001). Lipid metabolism-related
  pathways significantly altered in hepatocytes from female (F) and male (M) donors
  exposed to (B) PFHxS, (C) PFOA, (D) PFOS or (E) PFNA
