figure_title: Aberrant PI3K-Akt signaling leads to branching morphogenesis defects
  in the PLCγ1 mutant lacrimal gland
caption: '(A) Deletion of Pten in the lacrimal gland induced ectopic branching and
  further increased branching when combined with PLCγ1 mutation (arrowheads). Additionally,
  there was an increase in Mist1-expressing acinar cells in both Pten single- and
  Pten/PLCγ1 double-mutant glands. Scale bar for the top image: 1 mm. Scale bar for
  the bottom image: 50 μm.(B) Quantification of lacrimal gland branches at P1. One-way
  ANOVA, n = 11, *p < 0.0001.(C) Quantification of Mist1+ cells. One-way ANOVA, n
  = 3, *p < 0.01.(D) Schematic diagram of lacrimal gland explants. The lacrimal gland
  primordia were dissected from mouse embryos. After removal of the mesenchyme, the
  lacrimal gland epithelia were placed on a filter paper floating on culture media
  containing PI3K inhibitors (dotted lines).(E) After 1 day in culture, the lacrimal
  gland epithelia from E15.5 mice sprouted multiple buds, which were suppressed by
  PI3K inhibitors LY294002 and PX-866. Scale bar: 250 μm.(F) Quantification of fold
  changes in bud numbers. One-way ANOVA, n = 6, p < 0.01.(G) Deletion of Akt1 and
  −2 reduced ectopic branching in PLCγ1 mutants (arrowheads), and decreased numbers
  of Mist1+ and Ki67+ cells. Scale bar for the top image: 1 mm. Scale bars for the
  bottom two images: 50 μm.(H) Quantification of lacrimal gland branches at P1. Student’s
  t test, n = 16, p < 0.0001.(I) Quantification of Mist1+ cell. Student’s t test,
  n = 3, p < 0.05.(J) Quantification of Ki67+ cells. Student’s t test, n = 3, p <
  0.01.(K) Crosstalk between PLCγ and PI3K signaling. The FGF receptor recruits PLCγ
  via its phosphotyrosine residue at the C-terminal end and PI3K via Ras. The conversion
  of PIP2 to IP3 and DAG by PLCγ depletes the local pool of PIP2 in the vicinity of
  the FGF receptor, consequently limiting the ability of PI3K to generate PIP3 from
  PIP2. Thus, the activation of PLCγ exerts a negative regulatory effect on the PI3K
  pathway by reducing the availability of its substrate.Data are represented as mean
  ± SEM'
article_title: FGF-induced phospholipase Cγ signaling regulates lacrimal gland branching
  by competing with PI3K in phosphoinositide metabolism
