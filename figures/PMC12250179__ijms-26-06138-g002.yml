figure_title: Schematic outline for the involvement of pl-VDAC-1 in neuroprotection
  in a mouse model expressing human V12-Ha-RAS in postmitotic neurons.
caption: Schematic outline for the involvement of pl-VDAC-1 in neuroprotection in
  a mouse model expressing human V12-Ha-RAS in postmitotic neurons. Ha-RAS is anchored
  to the cytoplasmic membrane by two palmitoyl (black) and one farnesyl (grey) anchors.
  Guanine–nucleotide exchange factors (GEF) activate RAS by the exchange of GDP to
  GTP. V12-Ha-RAS is locked in its GTP-bound state because it cannot be inactivated
  by GTPase-activating proteins (GAP) due to the V12 mutation. V12-Ha-RAS then permanently
  activates the mitogen activated protein kinase (MAPK) signal transduction via rapidly
  activated fibrosarcoma (RAF), MAPK/ERK kinase (MEK), and extracellular-signal-regulated-kinase
  (ERK). MEK promotes BRAF activation through allosteric control of KSR proteins,
  with a kinase suppressor of RAS (KSR) serving as a molecular scaffold for effective
  signalling. Phosphorylations are indicated by yellow circles with Pi. MEK can be
  inhibited by U0126, resulting in a blockage of the downstream signalling. In the
  nucleus, a dimer of activated ERK stimulates the transcription of certain genes.
  The VDAC-1 mRNA becomes alternatively spliced into pl-VDAC-1 mRNA and mt-VDAC-1
  mRNA. The level of pl-VDAC-1 mRNA is selectively decreased by the activation of
  the RAS/MAPK pathway in comparison to wild-type mice. In mouse, the pl-VDAC-1 requires
  a signal peptide guiding the VDAC-1 to the plasmalemmal membrane; this sequence
  is schematically outlined in red in the pl-VDAC-1 mRNA. Upon translation, the mt-VDAC-1
  is inserted into the outer mitochondrial membrane (OMM), while the pl-VDAC-1 is
  passed by the endoplasmic reticulum and the Golgi apparatus and directly inserted
  into the cell membrane. In this mouse model, a reduced expression of pl-VDAC-1 causes
  neuroprotection, which is phenocopied by the extracellular application of an anti-VDAC-1
  antibody, resulting in channel blocking. The first 100 N-terminal amino acids of
  VDAC-1 are the target of the used anti-VDAC-1 antibody. Mt-VDAC-1 and pl-VDAC-1
  are shown in their three-dimensional protein structure (3EMN; [21]). Black thin
  arrows guide through different steps, while small dark red arrows pointing downwards
  represent decreased mRNA level or decreased protein expression level, respectively.
  An unchanged mRNA level is indicated by a dark red equal sign. A T-ending arrow
  indicates inhibition. The meaning of the arrows remains the same for all subsequent
  figures. This figure was created in https://BioRender.com/wxdvjtc (accessed on 19
  June 2025) in a modification from [118]
