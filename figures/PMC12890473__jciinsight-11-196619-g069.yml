figure_title: Identification of discriminatory protein-level autoantibodies between
  ARF and healthy controls
caption: (A) Scatter plot of sPLS-DA latent variable 1 (LV1) versus LV2 scores for
  individual samples. ARF cases (purple) and healthy controls (gold) are separated,
  with 95% confidence ellipses shown for each group. (B) Top 50 negative loading weights
  on LV1, representing protein-level autoantibodies most strongly associated with
  ARF cases. Bars are ordered by magnitude and colored according to loading strength.
  (C) Heatmap of protein-level autoantibodies expression for features selected by
  sPLS-DA across participants. Rows represent individuals colored by case/control
  status; columns represent selected features. Euclidean distance and complete linkage
  hierarchical clustering were applied to both rows and columns. (D) Heatmap of collagen-associated
  proteins identified from pathway enrichment analysis of top LV1 features. Rows represent
  the mean autoantibody reactivity in ARF and healthy control groups, and columns
  represent autoantibodies targeting collagen-related proteins. Reactivity against
  the top 3 proteins contributing to LV-10, noncollagen proteins, are included (right)
  for comparison of autoantibody magnitude. Color intensity reflects relative autoantibody
  reactivity
