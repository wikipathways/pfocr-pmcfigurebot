figure_title: Cosmic radiation damages Immune cell DNA, cellular structures and mitochondria
caption: 'Cosmic radiation is composed of protons, alpha particles, and high atomic
  number and energy ions. These high energy particles can generate reactive oxygen
  species (ROS) by radiolysis of water inside immune cells. ROS activates an ERK/MKP-1
  pathway, leading to increased Caspase-3 level, and apoptosis in immune cells, with
  this pathway particularly studied in B cell lines. Radiation also directly damages
  mtDNA, impairing mitochondrial function, and leading to the production of additional
  ROS. Excess ROS from across sources further harms cellular structures (e.g.: through
  lipid peroxidation) and activates NF-κB-mediated inflammation and induce cytokine
  expression. Radiation induced ROS potentially may signal inflammasomes (e.g. NLRP3)
  within immune cells, further bolstering production of cytokines like IL-1β. DNA
  damage, including base mismatch, single-stranded and double-stranded breaks engages
  DNA repair machinery, sensed through factors like ATM, PARP-1 or NEMO, also can
  upregulate pro-inflammatory pathways via activation of NF-κB. DNA damage also activates
  p53, which likely contributes to a mitochondria/Capsase-3 dependent apoptosis pathway.
  A combination of p53 and NF-κB induction could also potentiate cell senescence and
  a senescence associated secretory phenotype (not shown). Antioxidants mitigate these
  ROS-driven damages, offering potential protection against radiation-induced apoptosis.
  Black arrows represent pathways found in PBMCs (proposed or observed), and blue
  arrows denote pathways specifically tested in B cell lines only. mtDNA, mitochondrial
  DNA; NLRP3, NOD-, LRR- and pyrin domain-containing protein 3; ATM, Ataxia telangiectasia
  mutated; PARP1, Poly (ADP-ribose) polymerase-1; NEMO, NF-κB Essential Modifier'
