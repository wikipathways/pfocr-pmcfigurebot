figure_title: Subnetworks with orchestrated expression patterns and contrasting differences
  between cluster sets representing latent cells in resting state and reversed latency
  following DA stimulation.
caption: 'Subnetworks with orchestrated expression patterns and contrasting differences
  between cluster sets representing latent cells in resting state and reversed latency
  following DA stimulation. Subnetworks were identified in the merged pathway and
  physical interactions by applying filters using JActiveModules in Cytoscape 3.10.2.
  Subnetworks indicated 4 expression patterns that allowed a parallel visualization
  of contrasting behaviors between dominant response clusters. Cluster 2, representing
  the dominant latency phenotype (A,C,E,G), was visualized in parallel to Cluster
  3 (B,D,F,H), representing the dominant DA-induced latency reversal phenotype. The
  identified modules reflected: (A,B) Pattern 1 containing 72 nodes; (C,D) Pattern
  2 containing 21 nodes; (E,F) Pattern 3 containing 48 nodes; and (G,H) Pattern 4
  with 59 nodes. Red connector lines indicate physical interactions. Blue connectors
  indicate pathway interactions. Transcriptional expression levels are indicated by
  node colors, with shades of blue indicating downregulated and shades of red indicating
  upregulated genes. Diamond shapes indicate statistical significance (adjusted p
  < 0.05), and circles indicate non-significant genes'
