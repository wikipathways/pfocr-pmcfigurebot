caption: F. nucleatum as an onco-immune modulator. The figure illustrates the dual
  role of F. nucleatum. Protein Fap2 of F. nucleatum binds to the cell adhesion molecule
  CEACAM1 and to immune receptor TIGIT, both expressed by T and NK cells, inhibiting
  the function of immune cells and causing cancer cells evasion. At the same time,
  the bacterium, through its adhesin FadA, binds to E-cadherin, activating the Wnt/β-catenin
  oncogenetic pathway and causing tumor proliferation and progression. Image created
  with BioRender (https://biorender.com; last accessed on 18 July 2025)
