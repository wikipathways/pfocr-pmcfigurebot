figure_title: Inflammatory cues drive SAA1/SAA2 expression in adipocytes
caption: (A) Cell-cell communication analysis of SAA signaling pathway for the indicated
  depots and cells. Line colors and widths represent the sending cell and the strength
  of the signal, respectively.(B) Pseudobulk comparison of differentially expressed
  genes in epiploic vs. subcutaneous depots, highlighting the indicated signaling
  pathways.(C) Expression of SAA1 mRNA upon stimulation with LPS (10 ng/mL), TNF-α
  (2.5 ng/mL), IL-1β (10 ng/mL), or IL-6 (10 ng/mL) for 24 h. Data are presented as
  fold change (FC) over vehicle. Significant (<0.05) p values compared with the vehicle
  from one-way ANOVA are shown.(D) Relative expression of SAA1 (left) and SAA2 (right)
  mRNA in adipocytes, ASPCs, adipose-derived endothelial cells (adECs), and THP1-derived
  macrophages (THP1 M0). Significant (<0.05) p values compared with the cell-type-specific
  control from one-way ANOVA are shown.(E) Results from ELISA measurements of SAA
  in conditioned media from human adipocytes incubated without or with LPS for 72
  h. Results are displayed as mean, error bars represent standard error of the mean,
  and statistical significance was calculated using Student’s t test.(F) Analyses
  of DNA methylation in the indicated cell classes for the promoter and gene body
  regions of SAA1 and SAA2, respectively. Chromosomal localization and motifs for
  NFKB2/RELA/REL and STAT3 are indicated for both genes.(G) SAA1 and SAA2 mRNA expression
  in adipocytes treated with or without LPS in the presence or absence of different
  inhibitors described in the main text. Data are presented as FC over vehicle. Significant
  (<0.05) p values compared with the vehicle from one-way ANOVA are shown.For (C),
  (D), and (G), data are displayed as geometric mean ± 95% confidence intervals with
  technical replicates displayed from three independent experiments.ASPC, adipose
  stromal and progenitor cell
