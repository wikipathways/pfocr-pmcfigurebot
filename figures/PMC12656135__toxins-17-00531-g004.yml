caption: 'Convergent effects and synergy of aflatoxin B1 (AFB1) and fumonisin B1 (FUMB1):
  The synergistic mechanisms induced by combined exposure include increased production
  of reactive oxygen species (ROS), heightened oxidative stress, and activation of
  p53, Bax, and caspase-3-dependent apoptotic pathways. Furthermore, caspase-8 inhibition
  by FUMB1 has been shown to enhance the mitochondrial apoptotic pathway, contributing
  to a heightened risk of hepatocellular carcinoma (HCC) compared to exposure to AFB1
  or FUMB1 alone'
