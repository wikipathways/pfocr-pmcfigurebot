figure_title: Monoamine pathways in the CNS.
caption: Monoamine pathways in the CNS. (A) Dopaminergic pathways within the CNS [83,84,85,86].
  Mesocortical pathway emanates via projections from the VTA innervating the PFC to
  modulate concentration, focus, working memory, and decision-making. The mesolimbic
  pathway contains projections originating from the VTA that innervate the AMG, hippocampus,
  and NAc emerge to influence motivation, emotional processing, and reward-based decision-making.
  The tuberoinfundibular pathway involves innervations from DA neurons in the hypothalamus
  (hypo), which innervate neurons in the pituitary gland to provide negative feedback
  for the release of prolactin. Lastly, the nigrostriatal pathway emerges via projections
  between DA neurons in the SN to the striatum and is involved in regulating voluntary
  movement. (B) DA metabolism and conversion into NE [87,88,89]. (C) Noradrenergic
  signaling in the brain [90,91,92,93,94,95,96,97,98,99,100,101,102,103]. The LC is
  the primary site of NE synthesis from DA metabolism, and projects to the PFC alongside
  limbic structures of the brain. (D) Serotonergic signaling in the brain [104,105,106,107,108,109,110,111,112,113,114].
  Notably, 5-HT transmission originates in the Rn and innervates limbic structures
  to modulate mood, hunger, and attention. Created in BioRender. Yacoub, M. (2025)
  https://BioRender.com/573y6zo
