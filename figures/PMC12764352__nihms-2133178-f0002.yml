figure_title: Pyruvate and lactate metabolism in astrocytes and neurons
caption: Astrocytes express MCT1, which can mediate the transport of pyruvate and
  lactate, and MCT4, which primarily exports lactate to the extracellular space during
  high metabolic activity. Neurons predominantly express the high-affinity transporter
  MCT2, optimized for lactate uptake rather than pyruvate. PC activity is largely
  astrocyte-specific, whereas pyruvate oxidation through PDH is the dominant pathway
  in neurons. In astrocytes, LDH-A preferentially converts pyruvate to lactate, a
  reaction favored by their more reducing cytosolic redox state (higher NADH/NAD+
  ratio). In contrast, neurons predominantly express LDH-B, which favors the reverse
  reaction consistent with their more oxidized redox environment. LDH, lactate dehydrogenase;
  MCT, monocarboxylate transporter; PC, pyruvate carboxylase; PDH, pyruvate dehydrogenase;
  TCA, tricarboxylic acid
article_title: Comparative evaluation of hyperpolarized [13C]pyruvate and [13C]lactate
  for imaging neuronal and glioma metabolism
