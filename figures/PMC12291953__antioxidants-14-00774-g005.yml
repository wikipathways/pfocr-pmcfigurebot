figure_title: Pathological interactions between tau and Aβ in AD.
caption: Pathological interactions between tau and Aβ in AD. This schematic illustrates
  one of the several proposed mechanisms linking Aβ accumulation to tau hyperphosphorylation
  and NFT formation. Aβ-induced calcium influx activates calpain, which cleaves p35
  to p25, resulting in persistent CDK5 activation. Alongside GSK3β and DYRK1A, this
  contributes to tau phosphorylation and aggregation. The pathological cascade also
  involves mitochondrial dysfunction, synaptic damage, and axonal defects, ultimately
  promoting neurodegeneration. While this figure focuses on a specific pathway, other
  routes connecting Aβ and tau also exist
