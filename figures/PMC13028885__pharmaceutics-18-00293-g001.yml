figure_title: Molecular Machinery and Regulation of Autophagy in Platelets.
caption: Molecular Machinery and Regulation of Autophagy in Platelets. This diagram
  outlines the core autophagy pathway in platelets, highlighting key molecular components
  involved in the initiation, nucleation, elongation, and degradation phases of autophagy.
  Upstream metabolic sensors, including AMPK and mTOR, regulate the ULK1 initiation
  complex (ULK1–ATG13–FIP200). Vesicle nucleation is mediated by the Beclin1–VPS34
  complex, including VPS15 and ATG14L, leading to PI3P generation and phagophore formation.
  Autophagosome elongation requires the ATG5–ATG12–ATG16L1 conjugation system and
  LC3 processing (LC3-I to LC3-II) mediated by ATG4, ATG7, and ATG3. Selective cargo
  recognition involves adaptor proteins such as p62/SQSTM1. Fusion with lysosomes
  enables degradation of damaged organelles and oxidized substrates, thereby regulating
  platelet survival, activation, and functional responses under physiological and
  pathological conditions
