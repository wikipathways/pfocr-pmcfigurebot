caption: 'Functional enrichment analysis and tumor microenvironment analysis of DEGs
  between high- and low-risk groups. (A) DEG analysis identified significant differences
  between high- and low-risk groups (threshold: P<0.05 and |log2 fold change|>1).
  (B) Minus-vs.-Add plot quality control of the DEG analysis. (C) Hallmark GSEA revealed
  enriched pathways in upregulated DEGs. (D) KEGG GSEA identified significant pathways
  in upregulated DEGs (FDR<0.05). (E) GO GSEA determined biological functions in upregulated
  DEGs (FDR<0.05). (F) GO GSEA determined biological functions in downregulated DEGs
  (FDR<0.05). *P<0.05, **P<0.01 and ***P<0.001. DEGs, differentially expressed genes;
  FDR, false discovery rate; GO, Gene Ontology; GSEA, gene set enrichment analysis;
  KEGG, Kyoto Encyclopedia of Genes and Genomes'
