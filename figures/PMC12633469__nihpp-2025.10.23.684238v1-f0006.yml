figure_title: Single-cell transcriptomic analysis of vaccinated and IAV-infected CD1D−/−
  and CD1D−/+ pig lungs.
caption: 'Single-cell transcriptomic analysis of vaccinated and IAV-infected CD1D−/−
  and CD1D−/+ pig lungs. (A) UMAP visualization of pig lung cells. (B) The average
  frequency of each cell type is presented for each group. Significance was determined
  by t-test in each cell type. (C) Bar graphs displaying the number of upregulated
  and downregulated differentially expressed genes (DEGs) in G1 compared to G2 pigs.
  (D–E) Ingenuity pathway analysis (IPA) of DEGs in lymphocytes (D) and myeloid cells
  (E). The y-axis shows the top pathways identified in each cell type within the threshold
  −2.0 < Z > 2.0. Dot size indicates significance [−log10(P value)], and dot color
  saturation reflects the z-score. G1: CD1D−/− vaccinated and challenged; G2: CD1D−/+
  vaccinated and challenged'
article_title: Pigs lacking Natural Killer T cells have altered cellular responses
