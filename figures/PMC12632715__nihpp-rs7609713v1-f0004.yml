figure_title: Pathway enrichment analysis of kidney and liver transcriptomes changes
  following chronic e-cigarette exposure
caption: Top 10 KEGG pathway enrichment results based on fold enrichment are shown
  for (A) kidney E-cig vs. Air, (B) kidney VEH vs. Air, (C) liver E-cig vs. Air, and
  (D) liver VEH vs. Air. Bar length indicates fold enrichment, and color denotes p-value
  significance. E-cig exposures in the kidney were associated with enrichment of pathways
  related to oxidative stress, mitochondrial function, and extracellular matrix remodeling,
  while VEH exposures primarily affected circadian, metabolic, and signaling pathways.
  In the liver, E-cig exposures enriched lipid biosynthesis, insulin resistance, and
  ROS-related pathways, whereas VEH exposures enriched ferroptosis, insulin signaling,
  and fatty liver disease pathways
