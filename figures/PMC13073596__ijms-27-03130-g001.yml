figure_title: Proposed mechanism of TGR5-mediated anti-inflammatory signalling.
caption: Proposed mechanism of TGR5-mediated anti-inflammatory signalling. TGR5 activation
  by known agonists, such as deoxycholic acid, induces Gαs-mediated stimulation of
  adenylate cyclase, leading to higher intracellular cAMP levels. Enhanced cAMP activates
  protein kinase A (PKA), which may modulate downstream signalling pathways, including
  AMPK activation and the suppression of mTORC1 activity, thereby decreasing the production
  of pro-inflammatory cytokines such as TNF-α and IL-6. In the present study, ergosterol
  was computationally predicted to bind to the TGR5 binding pocket. The downstream
  signalling pathway, as shown here, represents a hypothetical mechanism based on
  established TGR5 signalling. Experimental validation would be essential to confirm
  functional activation
