caption: Interconnected Mechanisms Linking Diabetes Mellitus Type 2 and Alzheimer’s
  Disease. The figure illustrates the interconnected mechanisms that establish a link
  between DM2 and AD. It focuses on shared elements such as insulin resistance, chronic
  inflammation, and common brain proteins. The impact of insulin on cognitive processes,
  Aβ peptide levels, and tau protein hyperphosphorylation is highlighted. Additionally,
  it shows mechanisms like neuroinflammation, Aβ accumulation, and tau phosphorylation,
  emphasizing blood biomarkers for AD diagnosis. In the amyloidogenic pathway, amyloid
  precursor protein is first cleaved by β-secretase and subsequently cleaved by γ-secretase
  to generate Aβ peptides. The accumulation and aggregation of Aβ peptides results
  in neurotoxic amyloid plaques. This figure provides a visually comprehensive overview
  of the complex interplay between DM2 and AD, unraveling the interconnected mechanisms
  that contribute to their shared pathophysiology and mutual promotion of cognitive
  dysfunction. Created in BioRender. Gomez, G. (2026) https://BioRender.com/19y3vbh
