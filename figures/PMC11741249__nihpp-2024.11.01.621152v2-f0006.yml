figure_title: Differential molecular responses of TM cell subtypes to an Lmx1b mutation
caption: |-
  (A) UMAPs of limbal cells from WT and Lmx1bV265D/+ (V265D) mutant mice (both genotypes B6 background). (B)
  Lmx1b expression across limbal cell types. Lmx1b expression is highest in TM3 cells. (C) Pathways that are changed in all TM cell subtypes. (D-F) Top pathways that are significantly altered when comparing each indicated TM cell subtype across genotypes. Many of these pathways were not significantly changed when comparing all TM cell subtypes as a group, indicating that the V265D-induced changes are strongest within each TM cell subtype. V265D has a pronounced effect on mitochondrial pathways in TM3 cells but much less so in other TM cells. ECM = extracellular matrix. ECS = extracellular structure. (G) Mitochondria in V265D mutant TM cells are reduced in number per cell, have increased area, and decreased cristae area (cristae fraction is ratio of area occupied by cristae: total area of mitochondria; shown as bar plots with standard error). A total of 160–180 mitochondria were analyzed across 3 eyes per genotype (approximately 60 mitochondria per eye). Groups were compared using Student’s t-test. (H) Representative images show mitochondria defined by their outer membranes (OM) and inner membrane folds (cristae). Asterisks indicate a subset of representative cristae for each genotype. Mutant mitochondria exhibit increased area (space enclosed by the OM) and disorganized cristae structure. Arrows highlight regions in mutant mitochondria that lack cristae. Scale bar = 500 nm
