figure_title: The RIM101 and PKA pathways negatively regulate CO2 tolerance in an
  independent manner
caption: A. Competitive fitness was determined for the indicated vacuolar protein
  sorting (VPS) mutants after combining a 1:1 ratio of mNeonGreen labeled H99 and
  unlabeled mutant cells in RPMI 1640 medium with 165mM MOPS at pH 7 and incubating
  at 37°C in ambient air or 5% CO2 for 24 hr. Cell populations were characterized
  by flow cytometry and the percentage of mNeonGreen negative cells in 5% CO2 was
  divided by those in ambient conditions to calculate competitive fitness. Bars represent
  the average of three biological replicates with error bars indicating SD. Asterisks
  indicate a significant difference relative to H99 as determined by Student’s t-test
  (P < 0.05). B. Overnight cultures of vps and rim101Δ mutants were washed and concentration
  determined by OD600 reading. Strains were diluted to a starting OD600:1 and serial
  10-fold dilutions were performed. Three μL per replicate were spotted onto standard
  YPD agar plates or YPD buffered with 150 mM HEPES and adjusted to pH 9. Plates were
  incubated at 37°C in ambient air or 10% CO2 for 48hr (YPD) or 144hr (YPD pH 9) before
  images were acquired. Images are representative of three biological replicates.
  Competitive fitness of pkr1Δ and pka1Δ mutants (C) and rim101 mutants (D) in 5%
  CO2
