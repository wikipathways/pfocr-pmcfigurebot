figure_title: HA-modified zinc-copper bimetallic peroxide (ZCPO@HA) nanoparticles
  release Zn2+ and Cu2+ in the weakly acidic TME, effectively inducing both ferroptosis
  and cuproptosis.
caption: HA-modified zinc-copper bimetallic peroxide (ZCPO@HA) nanoparticles release
  Zn2+ and Cu2+ in the weakly acidic TME, effectively inducing both ferroptosis and
  cuproptosis. The resulting ICD releases damage-associated molecular patterns (DAMPs),
  activating adaptive antitumor immunity. Concurrently, mitochondrial damage promotes
  the release of mitochondrial DNA, which activates the cGAS-STING pathway and initiates
  innate immune responses. With the assistance of anti-PD-1, these nanoparticles leverage
  this synergistic immunotherapeutic effect to potently suppress tumor growth and
  metastasis. Reproduced with permission from [121]
