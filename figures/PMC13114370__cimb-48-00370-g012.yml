caption: 'Model of the acetyl-CoA-gated metabolic checkpoint and cordycepin biosynthetic
  pathways in C. militaris. Note: Sensing module: Enhanced TCA cycle and β-oxidation
  drive 4.1-fold acetyl-CoA surplus. Execution module: Acetyl-CoA activates CCM_06472
  via Lys123 acetylation () and inhibits it via Ser34 phosphorylation (⊣). Allocation
  module: High-yield GYS60 channels the majority of acetyl-CoA flux into cordycepin
  via a coupled assembly (no competition), while low-yield GYS80 only channels a small
  fraction (diverted by purine salvage and feedback inhibition). Dashed arrows indicate
  allosteric activation'
