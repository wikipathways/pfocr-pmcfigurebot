figure_title: SREBP1 is an additional EpA target in Th9 cells
caption: (A) Pathway analysis of RNA-seq data depicting of lipid metabolism pathways
  in EpA-treated Th9 cells. (B) Untargeted lipidomics profiling of Th9 cells on day
  4 showing global differences in lipid species abundance between control and EpA-treated
  groups. (C) Predicted binding model of EpA (pink) within SREBP1 (blue). (D and E)
  CETSA validating EpA–SREBP1 binding. Representative Western blot (D) and quantification
  (E) of normalized SREBP1 signal intensities across a temperature gradient (°C).
  (F) Weighted gene coexpression network analysis (WGCNA) of RNA-seq datasets identifying
  7 gene modules. (G) Module-trait correlation heatmap revealing a negative association
  between Il9 and Srebp1-associated gene modules. (H) Validation of inverse correlation
  between Il9 and Srebf1 expression using RNA-seq data from 12 independent Th9 samples
