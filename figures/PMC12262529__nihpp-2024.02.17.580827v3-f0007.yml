figure_title: Folate pathway proteins use dedicated conserved surfaces to interact
  with all their metabolon partners
caption: A) Representation of amino acid residues that are most frequently involved
  in hetero-dimeric protein-protein interactions in the folate pathway. 10 folate
  pathway enzymes are represented in the figure, and the most frequently observed
  residues in PPIs are represented by spheres. The radii and color of the spheres
  are represented such that most residues that appear most frequently in PPIs (in
  simulation) are represented by larger spheres that are brightly colored. Smaller,
  dark shaded spheres indicate residues that are not frequently involved in PPIs with
  other proteins. B) The ratio of observed inter-surface contacts to inter-surface
  contacts expected under the null hypothesis for randomly occurring surfaces. This
  ratio is presented for all 10 folate-pathway proteins. p-values vs random overlap
  null model (see Methods) is shown for each protein
article_title: Conserved interfaces mediate multiple protein-protein interactions
  in a prokaryotic metabolon
