caption: Identification of hub genes and construction of lncRNA/circRNA-mRNA networks.
  (A) Volcano plot of differentially expressed mRNAs. (B) KEGG enrichment based on
  DEGs. (C) LncRNA–DEGs regulatory network based on the trans, cis, and antisense
  methods. Diamond squares indicate candidate lncRNAs and larger circles indicate
  target genes of candidate lncRNAs. (D) Relationship of candidate lncRNAs and their
  target genes to the KEGG pathway. (E) CircRNA-DEGs regulatory network based on Pearson’s
  correlation analysis. Diamond squares indicate candidate circRNAs and larger circles
  indicate target genes of candidate circRNAs. (F) Relationship of candidate circRNAs
  and their target genes to the KEGG pathway
