figure_title: EMC mitigated 5-FU-induced alterations in the GSK3β/cyclin D1 signaling
  pathway.
caption: |-
  EMC mitigated 5-FU-induced alterations in the GSK3β/cyclin D1 signaling pathway. Homogenized small intestinal lysates were analyzed via Western blot to assess the protein expression. The bar chart illustrates that protein bands were quantified by densitometry, normalized against β-actin, and subsequently expressed as the relative ratio to the 5-FU-induced group. The value of the 5-FU-induced group was defined as 1.0 for comparison. Densitometric quantification was performed to determine the ratio of phosphorylated (activated) to total (non-activated) GSK3β protein levels for key components of the signaling cascade. Data are presented as mean ± S.D. of at least three independent experiments. Data are presented as mean ± S.D. of at least three independent experiments. Statistical significance is denoted as follows: ##
  p < 0.01 compared to the control group; ** p < 0.01, and * p < 0.05 compared to the 5-FU group
