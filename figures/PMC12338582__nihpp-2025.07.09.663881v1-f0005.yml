figure_title: Hypoxia-induced metabolic remodeling in CAAH revealed by urinary biomarkers
  and gene expression
caption: |-
  (A) Hypoxyprobe-1 immunostaining revealed diffuse cortical hypoxia in glomeruli, tubules, and small arteries in 6-month-old mice. Quantitative PCR demonstrated increased mRNA abundances of hypoxia-responsive genes (Hif1a, Hif2a, Epo, Epor, and Vefga) in 6mo old Ren1cKO kidneys (B) and in kidneys from mice treated with captopril (0.5 g/L in drinking water from 2 to 8 months) (C) (p = pairwise t-tests corrected with the Benjamini-Hochberg procedure). (D) Urinary metabolomic pathway analysis highlighted significantly impacted metabolic pathways in Ren1cKO mice at 1 and 6 months, with the most prominent being the TCA cycle and nicotinate/nicotinamide metabolism (NAD+
  depletion and succinate accumulation). Circles represent pathway enrichment (color: p-value, size: impact score). (E) Real time qPCR for hexokinase-2 (Hk2), phosphofructokinase (Pfkm), pyruvate kinase-2 (Pkm), and lactate dehydrogenase (Ldha) in both 6-month-old Ren1cKO (upper) and captopril-treated (from 2 to 8 months of age) SMMHCCreERT2;R26RtdTomato;Ren1cYFP
  mice (lower) confirmed Hif-mediated glycolytic reprogramming. All genes are significantly elevated (pairwise T-test with Benjamini-Hochberg multiple testing procedure correction) relative to controls (Ren1cWT or untreated). (F) Immunohistochemistry for glycolytic enzymes HK1, HK2, and PKM demonstrated enhanced expression in renal tissue of 6-month-old Ren1cKO mice. (G) Schematic: Chronic RAS inhibition triggers CAAH and renal hypoxia, activating Hif1α and Hif2α, which drive glycolytic reprogramming, NAD+
  depletion, and succinate accumulation. Succinate further stabilizes Hifs, sustaining glycolysis, inflammation, and fibrosis, contributing to progressive kidney injury. Abbreviations: CAAH, concentric arteriolar and arterial hypertrophy; Hif, hypoxia-inducible factor; Epo, erythropoietin; Epor, erythropoietin receptor; Vegfa, vascular endothelial growth factor a; NAD+
  nicotinamide adenine dinucleotide; RAS: renin-angiotensin system
