caption: Step two of the methodology was performed after investigating genes using
  Gene Database and Malacards, the DAVID and GSEA databases were used to find relevant
  genes and biological pathways. Based on the enrichment analysis, 11 genes out of
  129 exhibited a significant relationship with mTBI outcomes in both datasets. Protein–protein
  interaction and network analyse were performed utilizing string databases, while
  10 Hub genes were identified using Cytohubba. Multiple miRNA databases were used
  to predict miRNAs linked to mTBI candidate genes and key pathways tied to mTBI changes
