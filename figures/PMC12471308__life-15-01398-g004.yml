caption: 'Functional enrichments and classifications of Differentially Expressed Genes
  (DEGs) in N. oceanica. (A) Gene ontology (GO) functional annotation. The figure
  displays the top 20 functions with the highest number of associated genes across
  three major categories. The horizontal axis under each column represents the number
  of genes annotated with each GO function. (B) Upregulation distribution across KEGG
  pathways. KEGG pathway annotations were obtained for 71 protein-coding genes, with
  each column representing the number of genes in the respective secondary classification
  pathway. The columns are color-coded in five categories, from left to right: environmental
  information processing, human disease, genetic information processing, cellular
  processes, and metabolism. (C) Downregulation distribution across KEGG pathways.
  KEGG pathway annotations were obtained for 64 protein-coding genes, with each column
  representing the number of genes in the secondary classification pathway. The columns
  are color-coded in the same five categories: environmental information processing,
  human disease, genetic information processing, cellular processes, and metabolism'
