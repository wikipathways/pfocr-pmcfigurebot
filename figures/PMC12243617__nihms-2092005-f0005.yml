figure_title: Engineering protein arrangement on DNA origami surfaces modulates complement
  responses to those surfaces
caption: '(A) DNA origami design for 90 nm × 60 nm planes (left), with geometry confirmed
  by atomic force microscopy (AFM, right). Origami planes were incubated with alkyne-functionalized
  IgG (bright puncta in micrographs) to confirm lack of non-specific adhesion to origami
  (lower).(B–D) Left: DNA origami designs with four clusters (yellow boxes in schematics)
  of four azide-terminated anchor sequences (red points in schematics), with clusters
  set at the corners of 31 nm × 20 nm (B), 73 nm × 20 nm (C), or 73 nm × 40 nm (D)
  rectangles. Right: AFM micrographs confirming geometry of origami planes after incubation
  with alkyne-functionalized IgG. Lower: conformations of IgG conjugated to origami
  surfaces.(E) C3a production via classical/lectin pathways after incubation of origami
  in serum.(F) C3a production via alternative pathway after incubation of origami
  in serum.(G) C3b detected via fluorescent antibody stain after incubation of surface-bound
  origami with serum (n = 3 origami-serum preparations in E–G). **p < 0.01, ****p
  < 0.0001, one-way ANOVA with Tukey’s correction.See also Figure S8'
article_title: A percolation phase transition controls complement protein coating
  of surfaces
