figure_title: Sensory input is conveyed by inhibitory and dis-inhibitory pathways
caption: 'A, Summary diagram of the main cell types synapsing onto SG, Gr+, and SP−
  cells. B, Left: locations of the Gr+ and Sp− cells used for targeted reconstructions
  of presynaptic partners. Middle: all categorized presynaptic partners to the Gr+
  cell (n = 61 total synapses from EAF neurons; 216 total synapses were annotated,
  with 3% of those synapses from SP cells and 69% unclassified). Right: all categorized
  presynaptic partners to the SP− cell (n = 42 total synapses from Gr+ neurons; 55
  total synapses were annotated, with 1 synapse from an SG cell and 22% unclassified).
  C, Left: locations of the SG+ and SG− used for targeted reconstructions of presynaptic
  partners. Middle: all categorized presynaptic partners to the SG+ cell (n = 156
  total synapses from SG−, SP−, and EAF neurons; 201 total synapses were annotated
  with 22% unclassified). Right: all categorized presynaptic partners to the SG− cell
  (n = 127 total synapses from SG+ and Gr+ neurons; 157 total synapses were annotated,
  with 20% unclassified). D, Number of synapses from each cell type onto individual
  SG, Gr+ and SP− cells (n = 1387 total synapses from 457 SG, SP−, Gr+, and EAF neurons;
  2366 total synapses were annotated, with 41% unclassified). Cells are ordered along
  the horizontal axis by the number of inputs from Gr+ (decreasing) and then EAF (increasing).
  Pie charts show the fraction and total number of synapses from each cell type onto
  all SG+, SG−, Gr+, and SP− cells represented in the bar graphs. E, Observed connectivity
  from EAF, Gr+, SP−, SG+, and SG− to SG cells compared to that expected based on
  random connectivity. Conditional input analysis for the 11 SG cells (5 SG−, 6 SG+)
  represented in D. Each entry corresponds to input from the cell type shown on the
  horizontal axis given that the postsynaptic cell receives at least one synapse from
  the cell type shown on the vertical axis (see Methods). Presynaptic cell types are
  grouped along these axes according to their responses inferred from connectivity
  and/or known from previous in vivo recordings. Two clusters (illustrated with dotted
  lines) are observed among the input cell types, corresponding to the ON and OFF
  pathways. F, Same display as in E for the 6 SP− and 10 Gr+ cells represented in
  D'
