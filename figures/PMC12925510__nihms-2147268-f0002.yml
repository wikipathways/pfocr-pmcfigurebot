caption: (A) Volcano plot displaying differentially expressed proteins (DEP) in baseline
  (BL) juvenile dermatomyositis (JDM) compared to control (CTL) using a linear mixed
  effects model with site as a covariate. Significance was defined as P-adj < .05
  in the linear mixed effects model and P-adj < .05 in the post-hoc test. (B) Point
  range plots of the top 8 proteins with the greatest normalised protein expression
  (NPX) difference. The dots represent the fixed effect NPX estimate and the line
  the 95% CI summarising the NPX difference between BL JDM and CTL accounting for
  site effect. (C) Dot plot representing the top 20 Metacore process networks enriched
  at BL JDM vs CTL DEP, where dot size represents the protein ratio of DEP within
  each pathway and the colour of the dot represents significance defined by the FDR
  (false discovery rate). (D-F) Same as A-C, except for follow-up (FU) compared to
  CTL analyses. IFN, interferon; IL, interleukin; NF-kB, nuclear factor kappa B
article_title: Discovery of tissue-specific proteomic signatures in juvenile dermatomyositis
  highlights pathways reflecting persistent disease activity, clinical heterogeneity,
  and myositis-specific autoantibody subtype
