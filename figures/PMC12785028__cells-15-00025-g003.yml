figure_title: CAF-derived arginine supports cancer cell survival but does not rescue
  IFNγ-JAK-STAT signaling.
caption: 'CAF-derived arginine supports cancer cell survival but does not rescue IFNγ-JAK-STAT
  signaling. (A) Bar graph shows the number of DEGs in each TME cell type from the
  scArg-screen, indicating similar transcriptomic effects following cancer-endogenous
  and systemic inhibition of arginine availability. DEGs were determined using 12
  pseudo-samples per treatment as described in the Methods Section. (B) Heatmaps show
  GSEA-enriched pathways (p ≤ 0.05) shared between cancer cells and CAFs (left) or
  cancer and TAMs (right), based on the scArg-screen. In each graph, the pathways
  shown in the 2 columns on the left compare AFD vs. Ctrl, and the 2 columns on the
  right compare KD vs. Ctrl. Full data is provided in Table S3. (C) Representative
  images (left) and quantification (right) of GFP+ 4T1 cells co-cultured with NMFs
  demonstrate preserved spheroid size in arginine-deprived conditions. n = 3. Four
  spheroids were averaged for each replicate. Student’s t-test. p-value: 0.003. (D)
  Flow cytometry of annexin-V staining shows reduced apoptosis in 4T1 cells co-cultured
  with NMFs or treated with conditioned medium of NMFs. n = 3. One-way ANOVA and Tukey
  tests. *** p-value < 0.001. (E) LC-MS analysis shows elevated arginine levels in
  NMF medium compared to cancer cell medium or to medium of cancer cells treated with
  CM from NMF. Values were normalized to total protein mass. n = 3; one-way ANOVA
  and Tukey tests. p-values: 0.29 and 0.32, respectively. (F) Quantification of spheroids’
  area of 4T1 monoculture (4T1) or 4T1 co-cultured with NMFs expressing shGfp (NMF-shGfp)
  or shAss1 (NMF-shAss1). Preserved spheroid growth under arginine-deprived conditions
  was observed only when 4T1 cells were co-cultured with NMFs expressing Ass1. (n
  = 3; four spheroids analyzed per replicate. One-way ANOVA and Tukey tests. *** p-value
  < 0.001. (G) Flow cytometry shows reduced pSTAT1+ (left) and PSMB9+ (right) cancer
  cells co-cultured with NMFs under arginine deprivation, indicating fibroblasts do
  not rescue IFNγ signaling under arginine deprivation. n = 3. Student’s t-test. p-values:
  0.011 and 0.005, respectively. ns—not significant, * p < 0.05; ** p < 0.01; ***
  p < 0.001'
