figure_title: Endothelial to mesenchymal cell transition diminished and reversed by
  macrophage-epsins deletion
caption: 'A) RNA velocity analysis reveals that macrophage epsins promote EndoMT in
  WT/Apoe−/− mice, whereas loss of epsins results in a transition from mesenchymal
  to EC transition. B) Transition probabilities of ECs, FB-like VSMCs, and mesenchymal
  cells, reflecting EndoMT in WT/Apoe−/− mice and the MEndoT process in LysM-DKO/Apoe−/−
  mice. C) Violin plots showing the expression profiles of transcription factors driving
  EndoMT and MendoT process. D) Heatmap demonstrating downregulation of EC markers
  in WT/Apoe−/− mice and their upregulation in LysM-DKO/Apoe−/− mice, corroborating
  the evidence for EndoMT and MEndoT processes, respectively. E) Violin plots, showing
  comparison of transcriptomic profiles of genes involved in cytokine pathways between
  WT/Apoe−/− and LysM-DKO/Apoe−/− mice. F) Violin plot showing the transcriptomic
  enrichment of aortic EC identity genes in LysM-DKO/Apoe−/− versus WT/Apoe−/− mice.
  The mean values are indicated by a dashed line. G) Volcano plot highlighting differentially
  expressed genes in ECs between WT/Apoe−/− and LysM-DKO/Apoe−/− mice. H) Representative
  immunofluorescent co-staining of macrophages (CD68) and endothelial cells (CD31,
  white line) in the aorta. Unpaired t-test was conducted in Figure h, data from h
  (n=6) are presented as mean±SD. Scale bar: h=50 μm. I) Aortas from WT/Apoe−/− and
  LysM-DKO/Apoe−/− mice were isolated, qRT-PCR was performed to check the expression
  of upregulated genes such as Flt1, Cldn5 and Pecam1. J-K) Expression profiles of
  differentially expressed genes (Cldn5, Flt1, Col1a1, Tnfrsf11b) in endothelial cells.
  L) Functional pathway analysis showing genes upregulated in WT/Apoe−/− mice associated
  with mesenchymal and smooth muscle development. M) Genes upregulated in LysM-DKO/Apoe−/−
  mice are enriched in endothelial cell functional pathways. Note: P values determined
  by the Wilcoxon test'
