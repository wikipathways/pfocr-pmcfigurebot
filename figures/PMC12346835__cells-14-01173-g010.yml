figure_title: Swertiamarin demonstrates multi-target therapeutic effects for prostate
  disorders through four key mechanisms.
caption: 'Swertiamarin demonstrates multi-target therapeutic effects for prostate
  disorders through four key mechanisms. (1) BPH: SW exerts anti-hyperplastic action
  by modulating androgen/estrogen receptors (AR/ER-α), growth factors (VEGF/EGF/βFGF),
  and cell proliferation markers (PCNA), balances apoptosis (Bcl-2/Bax ratio), and
  inhibits hypoxia adaptation (HIF-1α). (2) Anti-fibrotic protection: SW reduces collagen
  deposition and prevents EMT by the HH pathway. (3) Anti-inflammatory and antioxidant:
  SW lowers pro-inflammatory mediators while enhancing antioxidant defenses and reducing
  oxidative stress'
