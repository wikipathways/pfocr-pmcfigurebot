figure_title: Metabolic pathway of BC biosynthesis.
caption: 'Metabolic pathway of BC biosynthesis. Glucose and fructose are taken up
  and phosphorylated into glucose-6-phosphate and fructose-6-phosphate, which feed
  into the pentose phosphate and glycolytic pathways. Glucose-1-phosphate is further
  activated to UDP-glucose, the direct substrate for cellulose synthase. UDP-glucose
  is polymerized into β-1,4-glucan chains and exported across the cell envelope, where
  they assemble into crystalline BC microfibrils. This pathway highlights how carbon
  metabolism is redirected toward polymer synthesis, linking primary sugar utilization
  to sustainable biopolymer production. Note: Created with BioRender.com, License
  No. XC28LV5FD3 (accessed on 1 November 2025)'
