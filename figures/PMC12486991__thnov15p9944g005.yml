figure_title: The versatile mechanistic role of GM-CSF⁺ Th cells in the pathogenesis
  of miscellaneous autoimmune diseases.
caption: The versatile mechanistic role of GM-CSF⁺ Th cells in the pathogenesis of
  miscellaneous autoimmune diseases. GM-CSF⁺ Th cells orchestrate a central inflammatory
  hub that drives a wide range of autoimmune diseases. By activating a common set
  of myeloid effector cells, including macrophages, neutrophils, and eosinophils,
  this pathway can induce shared while tissue-specific pathologies. The specific clinical
  manifestations, be it the β-cell destruction in type 1 diabetes, joint inflammation
  in spondylitis, epithelial damage in pustular psoriasis and ulcerative colitis,
  or renal failure in crescentic glomerulonephritis, is determined by the target organ
  and the precise downstream inflammatory mediators that are engaged. Created in BioRender.
  Meng, X. (2025) https://BioRender.com/o6m32us
