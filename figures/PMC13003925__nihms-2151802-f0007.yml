figure_title: Evidence that the RAS signaling pathway promotes the uSPG primitive
  state
caption: '(A) Differentially expressed genes (DEGs; q < 0.01, fold change >2) from
  PIWIL4+ vs. NANOS3+ cells.(B)Signaling pathways associated with the DEGs defined
  in (A). Statistical significance (−log10 (p value)) is indicated by the bar. The
  number of DEGs for a given category is indicated by an “X.”.(C) Schematic of experimental
  design. Fresh human testis biopsies were processed in two ways: (1) dissociation
  followed by magnetic-activated cell sorting (MACS) to isolate FSD1+ uSPG for feeder-free
  culture with or without RAS inhibitors (RASis) or (2) maintained in transwell systems,
  also treated with or without RASis.(D and E) RT-qPCR analysis of feeder-free human
  uSPG (enriched for FSD1+ cells) cultured for 1 week and treated with or without
  RASis: lonafarnib (D) and salirasib (E).(F) Immunofluorescence analysis of human
  testicular tissue fragments cultured with or without RASis, stained for PIWIL4,
  NANOS3, and BrdU. Cell nuclei were counterstained with DAPI (gray). Scale bars:
  50 μm.(G and H) Quantification of PIWIL4+ (n = 328) and NANOS3+ (n = 431) per cross-section
  across four samples.(I and J) BrdU index of PIWIL4+ (I) and NANOS3+ (J) cells in
  cultured testicular fragments, treated with or without RASis. Data are represented
  as the mean ± SEM. Four biological replications were performed.For (D), (E), and
  (G)–(J), data are represented as the mean ± SEM. Four biological replications were
  performed. **p < 0.01, ***p < 0.001, and ****p < 0.0001; ns, not statistically significant,
  as determined by unpaired t test (D and E) or one-way ANOVA (G–J)'
