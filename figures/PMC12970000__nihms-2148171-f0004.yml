figure_title: Proteoform-resolved networks reveal functional rewiring beyond gene-level
  models
caption: 'A–C, Network models comparing the ‘reference’ proteoform network to ‘alternative’
  proteoform networks provide insights into relative interaction differences and associated
  functional outcomes, including loss of interaction (A), gain of interaction (B)
  and change of interaction (C). Aa, Loss of function by loss of interaction: CREB5–204
  activates transcription through MAPK9, whereas CREB5–202 loses this interaction,
  which impairs transcriptional activation. Ab, Gain of function by loss of interaction:
  PIK3CA with E545K and/or H1047R mutations loses its interactions with BPIFA1 and
  SCGB2A1, which promotes conversion of PIP2 to PIP3 and thus activates the PI3K–AKT
  pathway. Ba, Loss of function by gain of interaction: the non-phosphorylated IκBα
  proteoform gains an interaction with NF-κB, thereby inhibiting the NF-κB-mediated
  transcription of inflammatory genes. Bb, Gain of function by gain of interaction:
  BRAF V600E mutant acquires a new interaction with KEAP1–NRF2, which promotes oncogenic
  transcriptional activation. Ca, Change of function by change of interaction: FOXP1-ES
  activates the transcription of pluripotency-associated genes (such as OCT4 (also
  known as POU5F1), NANOG and NR5A2), whereas FOXP1 activates the transcription of
  differentiation-related genes (such as GAS1, HESX1 and SFRP4). Cb, Change of localization
  by change of interaction: RBFOX1–240 binds nuclear RNAs associated with neurodevelopment,
  whereas RBFOX1–207 binds cytoplasmic RNAs associated with neuronal excitability,
  which are enriched in loci identified by genome-wide association studies for neurological
  disease such as psychiatric disorders and epilepsy'
article_title: 'Proteoform medicine: characterizing and targeting protein forms in
