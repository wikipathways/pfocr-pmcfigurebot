figure_title: Cyclin D1 overexpression increases DNA damage, RS, and MMEJ-mediated
  DNA damage repair
caption: '(A) RS assessed via p-RPA S33 foci using immunofluorescence microscopy in
  cyclin D1–overexpressing U2OS cells (experiments were done in triplicates, and P
  value was calculated using 1-way ANOVA with Tukey’s post hoc test). (B and C) DNA
  damage was assessed via γ-H2AX in the corresponding cells (experiments were done
  in triplicates, and P value was calculated using 1-way ANOVA with Tukey’s post hoc
  test). (D) DSB repair pathway assessment in cyclin D1–overexpressing reporter cells
  (experiments were done in quadruplicates, and P value was calculated using t test).
  (E and F) Assessment of POLΘ foci in cyclin D1–overexpressing U2OS cells in which
  endogenous POLΘ was tagged via V5 epitope (experiments were done in triplicates,
  and P value was calculated using 1-way ANOVA with Tukey’s post hoc test). Scale
  bars: 1 μm. OE, overexpressed. *P < 0.05; ***P < 0.001. Data are shown as the mean
  ± SEM'
