figure_title: Sex-specific proteomic differences in Pten knockout (KO) and wildtype
  (WT) mice.
caption: Sex-specific proteomic differences in Pten knockout (KO) and wildtype (WT)
  mice. (A–B) Volcano plots showing protein expression differences in all identified
  proteins. Proteins highlighted in red were significantly altered when comparing
  female KO (F-KO) with female WT (F-WT) (A), and male KO (M-KO) with male WT (M-WT)
  (B). Significance was determined using Student’s t-test. P-values for significantly
  altered proteins are provided in the Supplementary Table 1. (C–D) Heatmaps displaying
  scaled protein expression values (z-scores), color-coded according to the legend
  on the right, for significantly changed proteins in F-KO vs F-WT (C) and M-KO vs
  M-WT (D). (E–F) KEGG pathway analysis of significantly altered proteins in females
  (E) and males (F). (G) Fourteen upregulated proteins shared between females and
  males. (H) Twenty-one downregulated proteins shared between females and males. (I)
  Summary of overlapping proteins (14 upregulated (G) and 21 downregulated (H))
