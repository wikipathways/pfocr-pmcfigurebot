figure_title: Effects of Rhus on the inhibition of receptor activator of nuclear factor
  kappa B ligand (RANKL)-induced AKT signaling pathway in osteoclastogenesis.
caption: 'Effects of Rhus on the inhibition of receptor activator of nuclear factor
  kappa B ligand (RANKL)-induced AKT signaling pathway in osteoclastogenesis. (A)
  Bone marrow macrophages (BMMs) were differentiated with 10 μM Rhus, in the presence
  or absence of 1 μM SC79 or LY294002, for 1 day. Western blot analysis was used to
  assess c-Fos and β-actin expression levels. The relative level (%) is presented
  as a bar graph. (B,C) The BMMs were cultured in 30 ng/mL M-CSF and 100 ng/mL RANKL
  with 10 μM Rhus, in the presence or absence of 1 μM SC79 or LY294002, for 5 days.
  Mature osteoclasts were detected with tartrate-resistant acid phosphatase (TRAP)
  staining (pink) (B). TRAP-positive multinucleated osteoclasts (MNCs) were counted
  under a microscope (C). A quantity of 3–10 nuclei (left), 10 < nuclei (right). Scale
  bar: 100 μm. *, p < 0.05 compared with RANKL alone. #, p < 0.05 compared with RANKL
  + Rhus. The data presented are derived from three separate experiments and are expressed
  as the mean ± standard deviation (SD)'
