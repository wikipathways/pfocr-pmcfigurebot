figure_title: ASNS interacted with JUP protein and affected its expression.
caption: ASNS interacted with JUP protein and affected its expression. Molecular volcano
  plot illustrating differential expression in ASNS-overexpressing Caki-1 cells compared
  to control Caki-1 cells based on TMT proteomic analysis. (B) GO pathway enrichment
  analysis for differentially expressed molecules. (C) Silver staining results showing
  ASNS overexpression and its control in IP samples from Caki-1 cells. (D) Combined
  analysis of TMT proteomics and mass spectrometry results from silver-stained differential
  protein bands. (E) Correlation analysis of JUP expression with ASNS and VHL expression
  using TCGA-KIRC data. (F) Correlation analysis of JUP expression with ASNS and VHL
  expression using the data from VHL-mutant ccRCC tissues in TCGA-KIRC. (G) Confirmation
  of the interaction between ASNS and JUP proteins in Caki-1 and 786-O cell lines
  through IP experiments. (H and I) Analysis of JUP expression characteristics in
  ccRCC and its association with various pathological stages, grades, and distant
  metastasis using TCGA-KIRC data. (J) Comparison of overall survival (OS) and DFS
  between patients with high and low JUP expression. (K) Validation of JUP expression
  in clinical samples from our center using immunohistochemical staining. (L) Western
  blotting analysis of JUP protein in ccRCC tissues. (M) Western blotting analysis
  of ASNS protein in various RCC cell lines (A498, OSRC2, Caki-1, 769-P, 786-O, and
  RCC4)
article_title: Suppression of ASNS expression by VHL-mediated ubiquitination hinders
  the progression of renal cell carcinoma through enhancing JUP expression and inhibiting
  PI3K-AKT and MAPK pathways
