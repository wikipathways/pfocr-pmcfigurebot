figure_title: VvERF003 directly combined to and activated the VvFLS1 and VvCHI1 promoters.
caption: VvERF003 directly combined to and activated the VvFLS1 and VvCHI1 promoters.
  (A) Analysis of cis-acting elements in the promoters of flavonoid biosynthesis pathway-related
  genes; (B) yeast one-hybrid assay to verify the binding of VvERF003 to the VvFLS1
  and VvCHI1 promoters, respectively; (C) schematic diagram of the dual-luciferase
  reporter system, including the effector and reporter constructs; (D) double-luciferase
  assay was used to detect the luciferase activity of VvERF003 co-expressed with the
  promoters of VvFLS1 and VvCHI1, respectively. The asterisk represents significant
  difference (*** p < 0.001)
