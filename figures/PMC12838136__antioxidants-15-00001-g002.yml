figure_title: GPX4-dependent ferroptosis signaling in DR.
caption: GPX4-dependent ferroptosis signaling in DR. (A) Nrf2 inhibition downregulates
  the expression of GPX4, GCLM, SCD1, and iron metabolism regulators (FTH1, FPN),
  leading to increased labile iron (Fe2+) and peroxidizable PUFAs—collectively fostering
  an environment prone to labile iron pool (Fe2+) expansion and lipid peroxidation.
  (B) High glucose upregulates the E3 ubiquitin ligase TRIM46, promoting ubiquitination
  and degradation of GPX4 protein. Together, these convergent pathways lead to a critical
  failure in lipid peroxide repair, executing ferroptosis and driving the pathogenesis
  of diabetic retinopathy
