figure_title: Widespread dysregulation of proteins in the Wnt signaling pathway and
  decreased cell proliferation in SMA embryos
caption: '(A) Schematic overview of the Wnt signaling pathway. Molecules highlighted
  in green are downregulated, in pink are upregulated, and in purple are predicted
  to be inhibited in SMA embryos. Purple arrows indicate inhibition; pink arrows lead
  to activation; yellow arrows show a discrepancy between the activation state of
  1 or more molecules; and gray arrows represent an effect not predicted by IPA. (B)
  Representative coronal paraffin sections from littermate control mouse embryos at
  E14.5 to demonstrate whole brain topography in the mouse embryo. The relative position
  of the hippocampus is indicated by the white square. Cells positively labeled by
  the proliferative marker Ki67 are shown in green. Scale bar: 1 mm. Zoomed-in images
  highlight cell proliferation in the hippocampus of control and SMA mouse embryos
  at E14.5 shown using Ki67 labeling. Region of interest corresponding to the dentate
  gyrus is indicated by the white squares (39 × 39 μm). Scale bar: 10 μm. Total and
  proliferative cells are labeled by DAPI in blue and Ki67 in green, respectively.
  (C) Quantification of cell proliferation in the hippocampus of control and SMA Taiwanese
  mouse embryos reveals a significant decrease in SMA mice at E14.5. Each data point
  corresponds to the average values from 3 sections per embryo (N = 9 for control
  and 8 for SMA). *P value ≤ 0.05, unpaired t test, scatter dot plot, mean with SEM'
