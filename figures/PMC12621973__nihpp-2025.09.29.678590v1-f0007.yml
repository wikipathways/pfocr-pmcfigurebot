caption: 'A – C: Results of NanoString nCounter Metabolic Pathway, showing the effect
  of ECD on gene expression in WT and L-CB1r KO mice separately. A) Gene sets for
  which the difference in gene set score between WT and L-CB1r KO was greater than
  |2|. Presented in descending order of gene set score for WT mice. B) Scatterplot
  showing log2(fold change) of individual transcripts belonging to the Mitochondrial
  Respiration gene set. C) Heatmaps of relative expression of gene transcripts involved
  in the electron transport chain. Transcripts are separated into and labeled by the
  super-complex they comprise or facilitate (CI – CV). Within each genotype, individual
  samples are expressed as fold change with respect to the mean of the within-genotype
  Control group'
