figure_title: MSC-Exos from mesenchymal stem cells regulate multiple inflammatory
  pathways.
caption: 'MSC-Exos from mesenchymal stem cells regulate multiple inflammatory pathways.
  MSC-Exos ameliorate osteoporosis and osteoarthritis by regulating the following
  pathways: miR-23b-3p/TAB2/NF-κB, lncRNA HIF1A-AS2/HIF-1α/VEGF, miR-140-3p/TLR4/MyD88/NF-κB,
  miR-410-3p/STAT3, circRNA_0005567/miR-203/SOCS3, and miR-181a/IKKβ/NF-κB. MSC-Exos,
  mesenchymal stem cell-derived exosomes; TAB2, TGF-β-activated kinase 1 binding protein
  2; NF-κB, nuclear factor kappa B; HIF-1α, hypoxia-inducible factor 1-alpha; VEGF,
  vascular endothelial growth factor; TLR4, Toll-like receptor 4; MyD88, myeloid differentiation
  primary response 88; STAT3, signal transducer and activator of transcription 3;
  SOCS3, suppressor of cytokine signaling 3; IKKβ, IκB kinase beta; MMP-13, matrix
  metalloproteinase-13; JAK2, Janus kinase 2; miRNAs, microRNAs; lncRNAs, long non-coding
  RNAs; circRNAs, circular RNAs. The arrows indicate the direction of change: ↑, increased
  expression/activity; ↓, decreased expression/inhibition'
