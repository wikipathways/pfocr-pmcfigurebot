figure_title: Integrative preventive model targeting early metabolic imbalance of
  hyaline cartilage in pre-OA.
caption: 'Integrative preventive model targeting early metabolic imbalance of hyaline
  cartilage in pre-OA. The panels illustrate how combining lifestyle adjustments with
  targeted therapeutics can potentially modulate intra-cartilage transport and slow
  the progression from ultra-early biochemical imbalance to structural degeneration.
  (a) Schematic representation of a multimodal preventive intervention combining timed
  low-impact exercise (chrono-exercise; bicycle icon), pharmacological chondroprotection,
  and lifestyle measures to optimize intra-cartilage transport and limit catabolic
  cascades. Because synoviocytes secrete approximately 10× more HA than chondrocytes
  and cyclic motion has been reported to nearly double synovial HA secretion, timed
  low-impact exercise is proposed to augment synovial HA delivery to the joint surface,
  improve superficial-zone tribology, and thereby reduce mechanically induced ECM
  fragment release and downstream pro-inflammatory responses, synergizing with pharmacological
  and lifestyle interventions to slow the progression from ultra-early biochemical
  imbalance to structural degeneration. (b) “Handkerchief-game” analogy: opposing
  “teams” of pro-catabolic factors (matrix fragments, cytokines, degradative enzymes)
  and chondroprotective agents compete to reach chondrons across cartilage depth,
  from superficial to deep zones; biomechanical regimes can influence which team predominates
  by shaping transport dynamics. (c) Weight-bearing walking produces convective “pumping”
  that accelerates the penetration of large pro-catabolic species (e.g., FN-fs, COMP,
  TNF-α, IL-1β, MMP-3, ADAMTS-4/5) into deeper zones, concentrating degradative signals
  at the chondron and promoting matrix breakdown. Early time-targeted measures that
  limit aggrecanolysis or suppress nascent inflammatory signalling could plausibly
  disrupt this self-amplifying cascade and reduce the risk of irreversible fibrillation
  and the incipient loss of load-bearing capacity. (d) Cycling (low-impact, high-frequency
  joint motion) reduces repetitive impact while effectively agitating synovial fluid,
  potentially enhancing the diffusion of small protective molecules into cartilage
  (examples include glucosamine sulfate—investigational for prevention) while relatively
  limiting the convective entry of large degradative species, thereby favoring pericellular
  preservation. These considerations further imply that concurrently addressing multiple
  treatment targets—for example, combining biomechanical modulation, inhibition of
  early matrix-degrading enzymes, suppression of nascent inflammatory signalling,
  reduction in oxidative stress, and support of anabolic growth-factor pathways—may
  be essential to halt or substantially slow pre-disease progression in pre-OA by
  interrupting parallel, self-amplifying pathogenic loops rather than relying on single-target
  interventions alone. Together, the panels illustrate how specific biomechanical
  regimes can modulate intra-cartilage transport of key molecular classes and support
  a combined pharmacological/non-pharmacological lifestyle-medicine strategy to preserve
  cartilage homeostasis in pre-OA. Abbreviations: ADAMTS, a disintegrin and metalloproteinase
  with thrombospondin motifs; COMP, cartilage oligomeric matrix protein; CS, chondroitin
  sulfate; DZ, deep zone; ECM, extracellular matrix; FN-fs, fibronectin fragments;
  Glc, glucose; GS, glucosamine sulfate; IGF-1, insulin-like growth factor 1; IL-1β,
  interleukin-1 beta; IL-6, interleukin-6; MMPs, matrix metalloproteinases; MSM, methylsulfonylmethane;
  NAC, N-acetylcysteine; pre-OA, pre-osteoarthritis; ROS, reactive oxygen species;
  TGF-β, transforming growth factor-beta; TNF-α, tumor necrosis factor-alpha'
