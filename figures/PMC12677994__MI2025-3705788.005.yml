figure_title: Colocalization analysis results for TL-ccRCC pathways.
caption: 'Colocalization analysis results for TL-ccRCC pathways. The pronounced colocalization
  signals in both (A) and (B) panels demonstrate robust shared genetic architecture
  between TL and ccRCC risk, with multiple genomic regions displaying high posterior
  probabilities for common causal variants. (A) TL Discovery to ccRCC: colocalization
  analysis between telomere length discovery cohort and clear cell renal cell carcinoma
  risk, showing exceptional evidence for shared causal variants (PP.H4 = 98.3%) with
  key genomic loci, including rs10936602 displaying strong colocalization signals.
  (B) TL validation to ccRCC: colocalization analysis between telomere length validation
  cohort and ccRCC risk, demonstrating near-perfect colocalization evidence (PP.H4 = 99.7%)
  with rs13073066 and multiple genomic regions confirming shared genetic architecture'
