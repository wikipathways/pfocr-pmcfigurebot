figure_title: Strain-specific enrichment of host pathways in infected cells.
caption: 'Strain-specific enrichment of host pathways in infected cells. (A) Heatmap
  of normalized enrichment scores (NES) from gene set enrichment analysis (GSEA) comparing
  two aggregated cell groups: 18952-Infected and 23089-Infected. Pathways shown represent
  all significantly enriched Gene Ontology Biological Process (GO-BP) terms (adjusted
  p < 0.05) including both positively and negatively enriched gene sets. Negative
  NES values (blue) reflect pathways more enriched in Mock cells relative to the infected
  group. (B) Dot plots showing the expression of key genes involved in neuronal signaling
  and communication, proliferation and transcriptional activity, and suppressed translation
  and metabolism processes across distinct cell types in hSCOs infected with EV-D68
  strains 18952 and 23089. Dot size represents the percentage of cells expressing
  each gene, while color intensity reflects the average expression level, scaled (z-score)
  across all cells based on log-normalized values. Midplate and VLMCs were excluded
  from the Mock condition, as they were either absent from the infected groups or
  detected in only one of them (e.g., VLMCs: 1 cell in EV-D68–18952)'
