figure_title: GIV is required for dampening MDP-stimulated inflammation and promoting
  bacterial clearance in macrophage
caption: 'A. Immunoblot of control (shC) or GIV-depleted (shGIV) RAW 264.7 cells.B.
  Workflow of the NFκB reporter assay in RAW 264.7 cells (left). Bar graphs display
  the fold change in NFκB activity (right).C. Immunoblot of control (WT) and GIV-knockout
  (GIV-KO) THP1-NFkB SEAP reporter cell line-derived macrophages.D. Workflow of the
  NFκB reporter assay in CRISPR-depleted human THP-1 cells expressing an NFκB activity-tracking
  reporter (left). Line graphs display the fold change in NFκB activity over WT control
  (right).E. Schematic (top) displays the workflow for bacterial clearance assay.
  Line graphs (below) show the viable bacterial counts in the peritoneal macrophages.F.
  Immunoblot of control (WT) or GIV-knockout (GIV-KO) THP1 monocyte derived macrophage.G.
  Workflow of the gentamicin protection assay in THP1 cells. Bar graphs show the viable
  bacterial counts in the THP1 monocyte derived macrophage.H. Immunofluorescence images
  display representative fields of TGPMs challenged with live AIEC-LF82 (MOI 1:30)
  for 1 h. Scale bar = 20 μM. Bar graphs display quantification of intracellular AIEC-LF82;
  n = 4–6.I-K: Workflow for multiplexed proteomics analyses (I). Bar graphs showing
  biological process as determined by gene ontology biological process analysis (Red,
  pathways cited in text).L-M. Schematic summarizing findings in cells with GIV (L)
  and without GIV (M).Statistics: All results are displayed as mean ± SEM (n = 3 biological
  replicates). Significance was tested using two-way/one-way ANOVA followed by Tukey’s
  test for multiple comparisons. p-value ≤ 0.05 is considered as significant'
