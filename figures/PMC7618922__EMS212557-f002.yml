figure_title: Mechanisms of sensing hypoxia
caption: '(A) Hypoxia-inducible factors (HIFs) signalling pathway: in normoxic conditions,
  HIFs α are degraded, while in hypoxia, they are stabilised and enter the nucleus
  to activate their target genes. (B) 2-Aminoethanethiol dioxygenase (ADO) mechanism:
  ADO catalyses the conversion of cysteamine to hypotaurine to synthesise taurine
  and controls the stability of several proteins by modifying their N-terminal cysteine.
  This is inhibited in hypoxia. (C) Pyridoxine 5′-phosphate oxidase (PNPO) mechanism:
  PNPO catalyses the synthesis of pyridoxal-phosphate, a cofactor required for many
  enzymes, and this reaction only takes place under normoxic conditions. (D) KDM6A
  histone demethylase mechanism: This histone demethylase is blocked in hypoxia. (E)
  Lipid homeostasis in hypoxia: during hypoxia, the ratio of saturated to desaturated
  fatty acids (FAs) is increased, presumably due to inhibition of desaturases. This
  triggers metabolic adaptations to restore membrane fluidity and other processes
  dependent on lipid composition. (F) Mitochondrial changes in hypoxia: in response
  to low levels of O2, mitochondrial fission is increased, mitochondria are translocated
  to the perinuclear regions, and reactive oxygen species (ROS) are induced. Abbreviation:
  VHL, von Hippel-Lindau Figure created with BioRender'
