figure_title: Effects of MEG3 overexpression on the extrinsic apoptosis pathway in
  G.
caption: Effects of MEG3 overexpression on the extrinsic apoptosis pathway in G. parasuis-induced
  3D4/21 cells. (A) After treatment with different concentrations of Z-IETD-FMK, the
  mRNA expression levels of apoptosis-related genes in G. parasuis-infected 3D4/21
  cells were detected by qPCR. “**” indicates p < 0.01. (B) After transfection with
  the MEG3 overexpression vector and treatment with 20 μM of Z-IETD-FMK, the mRNA
  expression levels of apoptosis-related genes in G. parasuis-infected 3D4/21 cells
  were detected by qPCR. “**” indicates p < 0.01. (C) After transfection with the
  MEG3 overexpression vector and treatment with 20 μM of Z-IETD-FMK, the apoptosis
  rate was detected by flow cytometry. (D) Statistical analysis results of the apoptosis
  rate. “**” indicates p < 0.01
