caption: 'Hyperhomocysteinemia, the most common alteration of the transsulfuration
  pathway (red plot), contributes to multiorgan damage. This imbalance can potentially
  be restored (green plot) through supplementation/treatment with (a) folic acid and
  non-sulfur amino acids (i.e., serine), (b) sulfur-containing products of the transsulfuration
  pathway (i.e., cysteine, taurine, glutathione, or cystine), and (c) hydrogen sulfide
  (H2S)-donors. Abbreviations: CSA, cysteine sulfinic acid; Cys, cysteine; DMG, dimethylglycine;
  GSH, reduced glutathione; Hcy, homocysteine; HHcy, hyperhomocysteinemia; Met, methionine;
  SAH, S-adenosyl homocysteine; SAM, S-adenosyl methionine; THF, tetrahydrofolate;
  γ-Glu-Cys, γ-glutamyl cysteine'
