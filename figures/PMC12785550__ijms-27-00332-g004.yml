figure_title: Metabolic pathway alterations associated with mitochondrial transplantation
  in sepsis.
caption: Metabolic pathway alterations associated with mitochondrial transplantation
  in sepsis. Pathway mapping of discriminant metabolites showing the impact of sepsis
  and the restorative effects of mitochondrial transplantation (MT) in (A) peripheral
  blood mononuclear cells and (B) splenocytes. Metabolites downregulated in sepsis
  and recovered after MT are highlighted, including intermediates of amino acid metabolism,
  the tricarboxylic acid (TCA) cycle, and carbohydrate metabolism. These results indicate
  that exogenous mitochondria promote the reactivation of oxidative and biosynthetic
  metabolic pathways in immune cells
