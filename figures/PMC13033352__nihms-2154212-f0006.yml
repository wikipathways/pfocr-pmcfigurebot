figure_title: Recycling of shrunken vesicles and presynaptic membrane after 100 ms
  post-AP
caption: (A) Tomographic slice of a synapse frozen at 200 ms post-AP, showing one
  semifused SV at the AZ (red arrowhead) and one large vesicle undergoing ultrafast
  endocytosis at a peri-AZ site (yellow dashed circle). (A1) and (A2) show zoomed-in
  views of the boxed areas in (A) taken at different Z heights through the top (A1)
  and bottom (A2) of the presynaptic bouton. Small vesicles (brown arrows) were enriched
  at the top and bottom of the vesicle pool. (B) 3D rendering of all vesicles in the
  entire presynaptic bouton shown in (A). (C) The density of large (left) and small
  (right) vesicles across three layers of the entire vesicle pool, excluding vesicles
  in the AZ band. (D) Tomographic slice of a synapse frozen at 200 ms post-AP, showing
  a large vesicle under ultrafast endocytosis at the edge of the AZ (yellow dashed
  circle). (D1) presents a 3D rendering of the presynaptic profile, including the
  orthogonal view of the entire AZ band (magenta, presynaptic membrane; red, semifused
  SVs; blue, tethered SVs; yellow, collapsing SVs; gray, SVs not in the AZ band).
  (E) Number of vesicles undergoing ultrafast endocytosis (UFE) and clathrin-mediated
  endocytosis (CME) in synapses under different conditions. (F) Schematic diagram
  depicting the organization and dynamic of SVs in the presynaptic bouton during AP-induced
  synaptic release. In the resting condition, SVs are either tethered to the presynaptic
  membrane or form large semifused vesicles, ready for release in response to AP firing.
  Within ~4 ms post-AP, approximately one vesicle per synapse rapidly releases its
  transmitter through the kiss-shrink pathway. By 70 ms post-AP, most shrunken SVs
  detach from the presynaptic membrane (run-away), whereas others collapse into the
  presynaptic membrane. After 100 ms post-AP, the run-away shrunken vesicles further
  migrate to the periphery of the vesicle pool, and the expanded presynaptic membrane
  begins recycling through ultrafast endocytosis. Data are shown as mean ± SEM. Statistical
  significance was determined using the Mann-Whitney test; *p < 0.05, and ns indicates
  p > 0.05. The number of vesicles, along with p values for significance comparisons,
  are provided in table S5
article_title: “Kiss-shrink-run” unifies mechanisms for synaptic vesicle exocytosis
  and hyperfast recycling
