caption: 'a. Heatmap generated using the SCENIC tool, where red indicates high activity
  and blue indicates low activity by z-score of gene regulatory networks associated
  with specific transcription factors. b. Dot plots showing the relative expression
  of key genes during the activation and migration of LCs. Dot size reflects the proportion
  of cells expressing the gene, while color intensity represents expression levels.
  c. Pathway enrichment analysis using the SCPA package. Red indicates high pathway
  activity, and blue indicates low activity. Prefixes before pathway names denote
  the source database: H – Hallmarks, B – GO: Biological Processes, M – GO: Molecular
  Functions, C – GO: Cellular Components, R – Reactome, W – WikiPathways, and K –
  KEGG'
