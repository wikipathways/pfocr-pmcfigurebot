figure_title: Effects of DCVC treatment on HTR-8/SVneo gene expression under hypoxic
  conditions
caption: 'HTR-8/SVneo placental cells were cultured in hypoxic conditions in a STEMcell
  hypoxia chamber placed in a standard CO2 (5%) humidified incubator. Cells were treated
  with medium alone (control) or 10 μM DCVC. RNA was isolated, sequencing performed,
  and sequencing performed, and RNA-sequencing analysis was conducted using DEseq2
  in R. A) Volcano plot comparing differentially expressed genes between control and
  10 μM DCVC under normoxic conditions. Genes with an FDR < 0.05 were considered significantly
  differentially expressed. Furthermore, genes fulfilling the following criteria are
  denoted by color: FDR <0.05 only (light blue), genes with ∣ log2fold-change > 1
  ∣ (blue), and genes with both FDR < 0.05 and ∣ log2fold-change >1 ∣ (dark blue).
  B) The top ten significantly upregulated and downregulated genes ranked by log2fold-change
  (P <0.05). C) Pathway analysis showing significantly (FDR< 0.05) enriched hallmark
  gene sets separated into upregulated (11) and downregulated (3)'
article_title: Exposure to the trichloroethylene metabolite S-(1,2-dichlorovinyl)-L-cysteine
  under hypoxic conditions (%O2 =2%) alters differential gene expression and mitigates
  decreased invasion capacity, compared to normoxic conditions (%O2 ≥ 21%) in HTR-8/SVneo
  cells
