figure_title: Differential Effects of Polyphenol Classes on Neuroinflammation. While
  all polyphenols share the ability to modulate neuroinflammation, the specific mechanisms
  of action can differ between the different classes. Flavonoids tend to be more effective
  at modulating microglial activation and inflammatory cytokine production, while
  phenolic acids often act through inhibition of pro-inflammatory enzymes and oxidative
  stress reduction. Stilbenes, like resveratrol, are particularly effective at activating
  the Nrf2 pathway and promoting antioxidant responses. Flavonoids like quercetin
  and catechins are potent modulators of NF-κB, MAPK, and JAK/STAT pathways, while
  resveratrol and phenolic acids focus more on antioxidant gene expression and inhibition
  of COX-2
