caption: '(A,B). Summary of expression changes across functional categories. (A,B)
  Dot plots summarize mean log2 fold-change (mean LogFC) values for genes grouped
  by functional terms or clusters. The x-axis represents the mean LogFC (dashed line
  = no directional change). Dot size is proportional to the number of genes within
  a given category (n), and labels indicate the counts of up and downregulated genes
  in the format “↑u/↓d—n”. (A) g:Profiler enrichment analysis: each blue dot represents
  a functional term (GO/pathway/motif). Terms are ordered by mean LogFC. (B) DAVID
  functional clusters: each dot corresponds to one functional cluster, sorted by mean
  LogFC (lowest at top). Red dots represent clusters; labels show numbers of up and
  downregulated genes and total gene counts'
