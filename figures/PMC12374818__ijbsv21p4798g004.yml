figure_title: SETD1B KD down-regulates LCSC stemness via surface CD24 glycoprotein.
caption: SETD1B KD down-regulates LCSC stemness via surface CD24 glycoprotein. (A)
  Volcano plot for SETD1B-low vs SETD1B-high. (B) Single-cell RNA sequencing (GSE125449)
  analysis of CD24 gene expression across distinct cellular clusters. (C) Spatial
  transcriptomics (HRA000437) analysis of CD24 expression in liver tumor-adjacent
  tissue and HCC tissue. (D) (E) The proteins expression and quantification of CD24
  and EpCAM after SETD1B KD. (F) Correlation of SETD1B with CD24 gene expression.
  (G) Enrichment of CD24 with stemness signaling pathway. (H) Spheroid formation ability
  of HCCLM3 and HepG2 LCSCs after CD24 KD. (I) Quantification of spheroid formation
  ability and clone number of HCCLM3 and HepG2 LCSCs after CD24 KD. (J) (K) GO enrichment
  (Cellular Component and Biological Process) for high and low gene expression of
  CD24. (L)-(N) Proteins expression and grayscale value statistics of EpCAM and N-cadherin
  after CD24 KD. ** p < 0.01, *** p < 0.001
article_title: Histone Methyltransferase SETD1B Maintains Cancer Stem Cell Niche by
  Regulating the Crosstalk between CD24 and Surface Adhesion Molecules in Hepatocellular
  Carcinoma
