figure_title: Copper metabolism.
caption: Copper metabolism. Extracellular Cu2+ is reduced to Cu+ by the reductase
  STEAP. Some Cu+ is transported to the cell through the transporter CTR1 to bind
  to CCS and SOD1, and the remaining portion is transported to the mitochondria, TGN
  and nucleus. In mitochondria, Cu+ participates in the respiratory chain and redox
  pathway by binding CCO. In the mitochondrial intermembrane space, COX17 binds and
  transfers Cu+ to SCO1 or COX11, which transfers Cu+ to the cytochrome oxidase subunit.
  In the nucleus, Cu+ binds to transcription factors and drives gene expression. In
  the TGN, the Cu+-ATPase transporters ATP7A and ATP7B transfer Cu+ from the cytoplasm
  to the lumen of the TGN, where Cu+ activates Cu-dependent enzymes in the secretory
  pathway. When the intracellular Cu+ concentration is high, ATP7A and ATP7B withdraw
  from the TGN and promote Cu+ output. ATOX1, antioxidant 1 copper chaperone; ATP7A,
  ATPase copper-transporting α; CCO, cytochrome c oxidase; CCS, copper chaperone superoxide
  dismutase; COX17, cytochrome c oxidase copper chaperone protein 17; SCO1, synthetic
  cytochrome c oxidase 1; SOD1, superoxide dismutase 1; STEAP, prostate six-transmembrane
  epithelial antigen; SLC31A1, solute carrier family 31 member 1; TGN, trans-Golgi
  network
