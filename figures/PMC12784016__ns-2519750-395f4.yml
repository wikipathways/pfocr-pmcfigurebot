figure_title: Proteomics analysis for the LDs-enriched NP cells.
caption: Proteomics analysis for the LDs-enriched NP cells. (A) Workflow of BODIPY
  staining and flow cytometry sorting for BODIPY-low and -high NP cells. (B) Principal
  component analysis (PCA) analysis for proteomics. (C) Volcano plots show significantly
  differentially expressed proteins. (D) KEGG analysis of the different proteins were
  related to “IL-17 pathway.” (E and F) Immunohistochemical staining and corresponding
  statistical qualification of IL-17 expression in human NP tissues. Scale bar= 50
  μm. BODIPY, boron-dipyrromethene; LD, lipid droplet; NP, nucleus pulposus; TEM,
  transmission electron microscopy; PC, principal component; KEGG, Kyoto Encyclopedia
  of Genes and Genomes; FC, fold change; IL, interleukin; pLP, predominant lipids
  peak. Compared to non-pLP group, ***p<0.001
