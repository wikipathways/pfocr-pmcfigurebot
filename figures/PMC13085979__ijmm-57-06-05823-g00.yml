figure_title: Comparison of macrophage glucose metabolism reprogramming under physiological
  and sepsis states.
caption: Comparison of macrophage glucose metabolism reprogramming under physiological
  and sepsis states. Under physiological conditions (left), the AMPK pathway in macrophages
  is phosphorylated and activated. Macrophages use OXPHOS as their core metabolic
  mode, relying on the complete TCA cycle and ETC to provide stable energy supply
  to support the anti-inflammatory/reparative phenotype of M2 macrophages. In sepsis
  (right), PAMPs (such as LPS) activate the AMPK-mTOR-HIF-1α-PKM2 axis and inhibits
  AMPK through TLR4 or GLUT1, driving the expression of key glycolytic enzymes (PKM2,
  GLUT1, HK2, PFKFB3, LDH, PFK-1), leading to an increase in the conversion of pyruvate
  to lactate. The G-6-P produced during glycolysis also increases the activity of
  the PPP pathway. Lactic acid produced through glycolysis pathway or recovered through
  GPPR81 promotes HMGB1 acetylation/acetylation through p300/CBP dependent mechanism,
  which is released in the form of exosomes, exacerbating endothelial damage and DIC.
  The dimeric form of PKM2 can interact with HMGB1 to promote glycolytic transcription.
  In addition, succinic acid accumulation caused by TCA cycle interruption can also
  be taken up by GPR91 cells, further increasing inflammatory factors and inhibiting
  SDH. The glycolysis pathway and intermediates of the TCA cycle, such as citrate
  and succinate, can serve as important metabolic branching points for lipid synthesis
  and epigenetic signaling. AMPK, adenosine 5'-monophosphate (AMP)-activated protein
  kinase; OXPHOS, oxidative phosphorylation; TCA cycle, tricarboxylic acid cycle;
  PPP, pentose phosphate pathway; NADPH, nicotinamide adenine dinucleotide phosphate
  hydrogen; PAMPs, pathogen-associated molecular patterns; LPS, lipopolysaccharide;
  HIF-1α, hypoxia inducible factor-1α; PI3K, phosphatidylinositol 3-kinase; AKT, also
  known as protein kinase B or PKB; mTOR, mammalian target of rapamycin; TLR4, toll-like
  receptor 4; GLUT1, glucose transporter 1; PKM2, pyruvate kinase M2; HK2, hexokinase
  2; PFKFB3, 6-phosphofructo-2-kinase/fructose-2,6-biphosphatase 3; LDH, lactate dehydrogenase;
  ROS, reactive oxygen species; G-6-P, glucose-6-phosphate; HMGB1, high mobility group
  box-1; P300/CBP, p300 and CREB-binding protein; GPR81, G protein-coupled receptor
  81; DIC, disseminated intravascular coagulation; GPR91, G protein-coupled receptor
  91; IL-1β, interleukin-1β; SDH, succinate dehydrogenase; PFK-1, phosphofructokinase-1
