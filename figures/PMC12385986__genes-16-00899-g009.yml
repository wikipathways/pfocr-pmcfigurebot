figure_title: Correlation network analysis between differentially expressed metabolites
  (DEMs) and regulatory genes related to low-temperature stress.
caption: Correlation network analysis between differentially expressed metabolites
  (DEMs) and regulatory genes related to low-temperature stress. Analysis of X0 vs.
  X3 (A), W0 vs. W3 (B), X0 vs. X24 (C), and W0 vs. W24 (D). Five DEMs were selected
  from the common DEMs between X33 and W7 at different time points with definite KEGG
  pathways. The metabolites marked with numbers 1, 2, 3, 4, and 5 are 5-methoxyindoleacetate,
  choline, (S)-N-methylcoclaurine, nicotianamine, and taxifolin, respectively. Nodes
  represented metabolites and genes; edges indicated significant correlations, and
  positive/negative edges were retained. (E,F) Analysis of GO enrichment of the genes
  in X0 vs. X24 and in W0 vs W4, respectively. The most enriched relevant terms are
  shown in the plots
