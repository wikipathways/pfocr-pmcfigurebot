figure_title: Comparison of expression profiles of ovarian cell types in Holstein
  cows under different physiological conditions.
caption: Comparison of expression profiles of ovarian cell types in Holstein cows
  under different physiological conditions. (A) Differences in somatic cell types
  visualized by UMAP. (B) The top 10 differentially expressed genes (DEGs) for each
  ovarian somatic cell type under different physiological conditions. The gene expression
  levels are represented by a color gradient from blue (low expression) to red (high
  expression). (C) A bubble plot showing the top five enriched pathways for each cell
  type in the Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis. The proportion
  of genes involved in the corresponding pathway is represented by the size of the
  bubble. The adjusted p-values from low to high are represented by a color gradient
  from blue to red. (D) A bubble plot showing the top five enriched biological process
  (BP) terms for each cell type in the gene ontology (GO) analysis. The proportion
  of genes involved in the corresponding biological process is represented by the
  size of the bubble. The adjusted p-values from low to high are represented by a
  color gradient from blue to red
