figure_title: Overview of microRNA (miRNA) biogenesis and mitochondrial translocation
  in cardiac cells.
caption: Overview of microRNA (miRNA) biogenesis and mitochondrial translocation in
  cardiac cells. The figure illustrates the canonical pathway of miRNA biogenesis
  and subsequent mitochondrial import mechanisms relevant to cardiovascular regulation.
  miRNA transcription is initiated in the nucleus by RNA polymerase II (POL II), generating
  primary miRNAs (pri-miRNAs), which are processed by the Microprocessor complex (Drosha/DGCR8)
  into precursor miRNAs (pre-miRNAs). One strand, selected based on thermodynamic
  stability, is incorporated into the Argonaute-2 (AGO2) protein. AGO2, which may
  undergo post-translational modifications (PTMs) including phosphorylation, ubiquitination,
  and malonylation, directs the fate of the miRNA. Depending on cellular context and
  AGO2 state, the loaded miRNA may exert its function in the cytoplasm, translocate
  to processing bodies (P-bodies), or be targeted to mitochondria. Mitochondrial translocation
  occurs through two primary pathways. In the first, the AGO2-miRNA complex is imported
  via the translocase of the outer membrane (TOM complex, comprising TOM20 and TOM40)
  and subsequently through the translocase of the inner membrane (TIM complex, including
  TIM22 or TIM23). In the second mechanism, miRNAs are translocated into the mitochondrial
  matrix through polynucleotide phosphorylase (PNPase), located at the inner mitochondrial
  membrane
