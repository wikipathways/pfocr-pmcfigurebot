figure_title: Mazdutide inhibits the PERK-eIF2α-ATF4-CHOP pathway in MASLD cells.
caption: Mazdutide inhibits the PERK-eIF2α-ATF4-CHOP pathway in MASLD cells. (A) Representative
  Western blot images showing the protein levels of GRP78, p-PERK, PERK, p-eIF2α,
  eIF2α, ATF4, CHOP, and β-actin. (B) Quantitative densitometric analysis of the p-PERK/PERK
  and p-eIF2α/eIF2α ratios and the protein levels of GRP78, ATF4, and CHOP. The protein
  band intensities were normalized to β-actin. Data are presented as the mean ± SD
  (n = 3). a p < 0.05 vs. the NCD group; b p < 0.05 vs. the HFD group. Cell groups
  are as defined in Figure 8
