figure_title: IAld activates AMPK signaling pathway through AhR.
caption: IAld activates AMPK signaling pathway through AhR. (A, B) Caco2 cells were
  treated with IAld (10 μM) for 2 h, the AhR nuclear translocation was analyzed by
  immunofluorescence and quantified by Image J software, scale bar = 20 μm. (C) Molecular
  docking analysis of IAld binding on the ligand-binding domain of AhR protein. The
  analysis results indicated that IAld can form hydrogen bonds with amino acid residues
  (glutamine-118, arginine236). (D) Molecular docking results of IAld and AhR protein-binding
  pocket. (E, F) Caco2 cells were treated with IAld+TNF-α in the presence or absence
  of the AhR-specific inhibitor CH-223191 (10 μM) for 24 h, and the ZO-1 protein expression
  and cell membrane distribution were analyzed by immunofluorescence and quantified
  by Image J software, scale bar = 20 μm. (G) After the indicated treatment, the leakage
  of FD-4 induced by TNF-α-stimulation was measured. (H) Caco2 cells were treated
  with IAld in the presence or absence of the AhR-specific inhibitor CH-223191 (10
  μM) for 24 h, and the p-AMPK and LC3 protein expression levels were measured by
  western blotting. (I, J) Caco2 cells were treated with IAld in the presence or absence
  of the CH-223191 for 24 h, and the interaction between AhR and p-AMPK protein was
  assayed by immunoprecipitation and quantified by Image J software. Data are presented
  as means±SEM (n = 3 or 4). * p<0.05, ** p<0.01, compared with the respective control.
  AhR, aryl hydrocarbon receptor; IAld, indole-3-carboxaldehyde; ZO-1, zona occludens-1;
  TNF-α, tumor necrosis factor-alpha; AMPK, AMP-activated protein kinase; SEM, standard
  error of the mean
