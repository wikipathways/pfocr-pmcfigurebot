figure_title: The mos−/− eggs with one polar body have many differentially expressed
  genes when compared to wildtype eggs
caption: '(A) Three-dimensional UMAP projection of scRNA-seq data (n = 107) colored
  by type: wildtype (blue), chemically treated (green), mos−/− eggs M1 (red), M2 (beige),
  or M3 (purple). M1 and M2 correspond to mos−/− eggs that extrude 1 or 2 PBs, respectively;
  M3 corresponds to mos−/− eggs that extrude 2 PBs and undergo additional divisions.
  (B) Volcano plot showing differentially expressed genes between mos−/− eggs that
  extrude 1 PB (M1) and wildtype eggs. Genes significantly upregulated in M1 eggs
  appear on the right, those downregulated on the left, and non-significant changes
  are centered. (C) Bar plot depicting pathway enrichment analysis for genes upregulated
  in mos−/− eggs that extrude 1 PB compared to wildtype eggs. Each bar represents
  a specific biological pathway, with the length indicating the degree of enrichment
  significance. (D) Volcano plot showing differentially expressed genes between mos−/−
  eggs that extrude 2 PBs and undergo additional divisions (M3) and mos−/− eggs that
  extrude 1 PB (M1). Genes significantly upregulated in M3 eggs appear on the right,
  those upregulated in M1 appear on the left, and non-significant changes are centered.
  WT, wildtype'
