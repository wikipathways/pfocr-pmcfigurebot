figure_title: Characterization of porous collagen foam for various collagen concentrations.
caption: Characterization of porous collagen foam for various collagen concentrations.
  (A) Schematic illustration showing the interaction between colorectal cancer cells
  an ECM, along with the cellular signaling pathways activated within the porous foam.
  (B) Optical images of collagen foams fabricated with different collagen concentrations
  (2.8-5.6 w/v%). (C) Quantification of pore sizes and (D) air volume fraction (n
  = 3) across the different collagen concentrations. (E) Compressive stress-strain
  curves of the collagen foams. (F) Apparent compressive modulus and (G) inherent
  modulus estimated using the Gibson-Ashby model (n = 5). All values are represented
  as mean ± standard deviation
article_title: Tailorable porous collagen hydrogels as a physiologically relevant
  platform for extrachromosomal DNA-associated colorectal cancer research
