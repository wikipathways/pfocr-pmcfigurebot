figure_title: Inhibitory effects of GLP-1 medicines on immune cell function
caption: GLP-1 medicines generally exert inhibitory effects on immune cell function.
  Across multiple T cell populations, they suppress the secretion of interferon-γ
  (IFN-γ). In intraepithelial lymphocytes (IELs) and invariant natural killer T (iNKT)
  cells, GLP-1 medicines also induce cyclic adenosine monophosphate (cAMP) and cAMP-responsive
  element–binding protein (CREB), indicating engagement of the cAMP/protein kinase
  A signaling pathway. In IELs specifically, the activation of GLP-1R signaling suppresses
  phosphorylation of ζ chain–associated protein kinase 70 (ZAP70) and its downstream
  target SH2 domain–containing leukocyte protein 76 (SLP-76), leading to dampening
  of proximal T cell receptor signaling and reduced cytokine transcription. This mechanism
  may be shared by iNKT and other T cells expressing the GLP-1R. In myeloid cells,
  GLP-1 medicines also attenuate proinflammatory cytokine release, although these
  effects appear to be primarily indirect
article_title: Antiinflammatory actions of glucagon-like peptide-1–based therapies
  beyond metabolic benefits
