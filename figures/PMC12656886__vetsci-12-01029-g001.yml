figure_title: Bioinformatic enrichment analysis of candidate miRNAs.
caption: Bioinformatic enrichment analysis of candidate miRNAs. Hierarchical clustering
  heatmap generated with DIANA-mirPath v3 using the microT-CDS algorithm and Fisher’s
  exact test with FDR correction. The predefined panel included hsa-let-7a-5p, hsa-let-7b-5p,
  hsa-let-7c-5p, hsa-miR-21-5p, hsa-miR-30b-5p, hsa-miR-133b, hsa-miR-98-5p, and hsa-miR-103a-3p.
  Color intensity reflects the statistical significance of pathway enrichment (log
  p-value), with red indicating the strongest associations. The analysis revealed
  significant convergence (FDR < 0.05) of the selected miRNAs on key pathways implicated
  in myxomatous mitral valve disease (MMVD) pathogenesis, including ECM–receptor interaction
  (p = 5.0 × 10−4), TGF-β signaling (p = 3.0 × 10−3), PI3K–Akt signaling (p = 3.0
  × 10−3), MAPK signaling (p = 1.27 × 10−2), and focal adhesion/actin cytoskeleton
  regulation (p = 1.27 × 10−2). Additional modules such as Hippo signaling (p = 3.0
  × 10−3) and Wnt signaling (p = 1.02 × 10−2) were also represented, together with
  glycosaminoglycan/proteoglycan biosynthetic pathways, consistent with the histological
  hallmark of glycosaminoglycan accumulation in the spongiosa of MMVD valves. Notably,
  shared gene targets across these pathways included collagens, integrins, SMADs,
  PI3K/AKT components, and MAPKs, underscoring a strong molecular interconnection.
  This enrichment supports the biological relevance of the investigated miRNAs in
  ECM remodeling, fibrotic signaling, and growth-control processes central to valvular
  degeneration
