figure_title: Predictive functional analysis of metabolic pathways differently enriched
  among experimental groups.
caption: Predictive functional analysis of metabolic pathways differently enriched
  among experimental groups. (a) Relative abundance of key metabolic pathways in the
  control group (group A, red) and the challenged group (group B, blue), with the
  corresponding log2 fold change between groups displayed on the right. Pathways enriched
  in group A have positive log2 fold change values, whereas those enriched in group
  B have negative values. (b) Relative abundance of statistically significant metabolic
  pathways in the control group (group A, red) and the vaccinated and challenged group
  (group C, blue), with the corresponding log2 fold change displayed on the right.
  Pathways enriched in group A have positive values, while those enriched in group
  C have negative values. Statistical significance (adjusted p-value) for each pathway
  was calculated using the DESeq2 algorithm, embedded in ggpicrust2 R package, and
  is shown adjacent to the log2 fold change bars. Relative abundance of pathways with
  adjusted p < 0.05 were considered statistically significant
