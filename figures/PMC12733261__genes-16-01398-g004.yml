figure_title: Functional analysis of LEC-mediated T cell migration and activation.
caption: 'Functional analysis of LEC-mediated T cell migration and activation. (A)
  Gene Ontology (GO) enrichment analysis results (Biological Process, BP) of differentially
  expressed genes (DEGs) in the LEC-1 subpopulation. (B) GO enrichment analysis results
  (BP) of DEGs in the LEC-2 subpopulation. (C,D) Analysis of intergroup differences
  in the expression of immune cell adhesion/migration-related genes and the chemokine
  Ccl21 in LECs; in (C), left three columns: LEC-1; right three columns: LEC-2. (E)
  Feature plot displaying the expression of immune cell adhesion/migration-related
  genes and the chemokine Ccl21 in LECs. (F) Cell–cell communication analysis. Red
  arrows highlight interactions between LECs (upstream) and T cells (downstream).
  (G,H) Receptor–ligand pair analysis, with LECs as the upstream source (ligands)
  and T cells as the downstream target (receptors). The top ten signaling pathways
  ranked by interaction strength are shown (or all available if fewer than ten); (G)
  compares the Sham group and the AS1:8 w group, (H) compares the AS1:8 w group and
  the AS2:16 w group. Red indicates higher interaction strength in the former group
  of the comparison, while blue indicates higher interaction strength in the latter
  group of the comparison'
