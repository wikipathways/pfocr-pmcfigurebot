figure_title: Impact of melatonin on macrophages.
caption: Impact of melatonin on macrophages. Melatonin upregulates Trim26, which contributes
  to the regulation of macrophage senescence. Melatonin also enhances MHC-II expression,
  thereby increasing antigen-presenting capacity and amplifying immune activation.
  Melatonin suppresses the MIF/NLRP3/IL-1β signaling cascade, thereby reducing crosstalk
  between macrophages and tumor cells. Melatonin inhibits arginase activity, leading
  to increased nitric oxide (NO) production. Melatonin also modifies the microRNA
  content of tumor-derived exosomes, leading to decreased PD-L1 expression and attenuated
  immune suppression. Lack of pineal melatonin in rats increases TAM infiltration
  and promotes tumor progression. Melatonin combined with lipopolysaccharide (LPS)
  increases M2 macrophage apoptosis through JAK–STAT and Toll-like receptor (TLR)
  signaling pathways. Created in BioRender. Garcia-Macia, M. (14/11/2025) https://BioRender.com/v72fvv9
  (accessed on 27 December 2025)
