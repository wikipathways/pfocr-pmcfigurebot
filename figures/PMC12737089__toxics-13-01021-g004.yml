figure_title: KEGG pathway enrichment of targets of radon-responsive miRNAs.
caption: KEGG pathway enrichment of targets of radon-responsive miRNAs. (A) Bubble
  plot of the top enriched KEGG pathways for high vs low radon (targets of serum DE
  miRNAs). The x-axis shows RichFactor (hits ÷ pathway size); bubble area encodes
  the number of target genes; color indicates the FDR-adjusted q value. (B) Bar plot
  showing hit counts for the same pathways, grouped by KEGG parent category (Metabolism,
  Human Diseases, Environmental Information Processing, Cellular Processes). Notable
  signals include MAPK and PI3K–Akt (with Ras/Wnt/VEGF), focal adhesion/ECM–receptor
  interaction/regulation of actin cytoskeleton, cytokine/JAK–STAT/NF-κB pathways,
  and arachidonic acid metabolism
