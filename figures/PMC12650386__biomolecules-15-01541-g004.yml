figure_title: Schematic of polyphenols regulating RAS by modifying thiol-containing
  transmembrane proteins.
caption: 'Schematic of polyphenols regulating RAS by modifying thiol-containing transmembrane
  proteins. Polyphenols rapidly bind to cell surfaces and accumulate within 120 s
  [58,90]. Thiol-containing transmembrane proteins: (1) ADAM17: its phosphorylation
  is inhibited by polyphenols (e.g., rosmarinic acid), reducing ACE2 shedding and
  AT1R expression [79,103]. (2) Integrins (e.g., α2β1): polyphenols (e.g., carnosic
  acid) reduce their expression, decreasing ACE and AT1R levels and inhibiting AKT/ERK
  pathway activation [105,110]. RAS components: ACE, AT1R (pro-tumor), ACE2, AT2R,
  Ang(1-7), and MasR (anti-tumor), whose expression or activity is regulated by modified
  transmembrane proteins [107]. The dotted lines in the figure indicate that polyphenols
  may also bind to other membrane proteins containing sulfhydryl groups and thereby
  regulate the expression of RAS'
