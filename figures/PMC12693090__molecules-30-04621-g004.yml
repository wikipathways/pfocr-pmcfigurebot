caption: Schematic representation of the circular valorization pathway in mushroom
  production. The diagram illustrates the flow from cultivation and harvesting to
  the generation of commercial-grade mushrooms and residual biomass. Mushroom residues,
  including spent mushroom substrate, are redirected toward the recovery of bioactive
  compounds such as ergothioneine (EGT), β-glucans, enzymes, and cellulose, enabling
  their reintegration into nutraceutical, pharmaceutical, and agricultural applications
  within a circular bioeconomy framework
