figure_title: GO annotation and KEGG enrichment analysis of DEGs.
caption: 'GO annotation and KEGG enrichment analysis of DEGs. (A) Scatter plot of
  the top 30 rich factor rankings in the GO analysis of DEGs. (B) Scatterplot of the
  top 30 rich factor rankings in the GO analysis of upregulated DEGs. (C) Scatter
  plot of the top 30 rich factor rankings in the GO analysis of downregulated DEGs.
  (D) Top 30 KEGG pathways sorted by enrichment level in KEGG analysis of DEGs. (E)
  Top 30 KEGG pathways sorted by enrichment level in KEGG analysis of upregulated
  DEGs. (F) Top 30 KEGG pathways sorted by enrichment level in KEGG analysis of downregulated
  DEGs. The rich factor is calculated as follows: (number of differential genes in
  a given GO term/total number of differential genes that can be mapped to the GO
  database)/(number of genes contained in a given GO term/total number Genes that
  can be assigned to the GO database). A larger rich factor indicates a higher level
  of enrichment. The q value is the p value after correction for multiple hypothesis
  testing, with smaller values indicating greater enrichment'
