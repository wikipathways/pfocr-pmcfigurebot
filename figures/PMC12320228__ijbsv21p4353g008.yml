figure_title: HIF-1α is positively regulated by ucOCN in mice OA model.
caption: HIF-1α is positively regulated by ucOCN in mice OA model. (A-D) IHC staining
  of representative paraffin sections of HIF-1α and TIMP3 expression in articular
  cartilage of human LFC (CON) and MFC (OA) with OA (n=3 per group) and mice subject
  to sham and DMM surgery (n=6 mice per group). (E) IF analysis of representative
  paraffin sections of HIF-1α expression of articular cartilage treated with mouse
  IgG, recombinant ucOCN or OCN antibody respectively 2 months after DMM surgery,
  statistical analysis on the right. (F, G) IHC staining of representative paraffin
  sections of TIMP3 and p-mTOR expression of articular cartilage treated with mouse
  IgG, recombinant ucOCN or OCN antibody respectively 2 months after DMM surgery,
  statistical analysis on the right. (H) Schematic diagram of ucOCN regulation in
  the maintenance of cartilage integrity. ucOCN activates HIF-1α by interacting with
  GPRC6A. HIF-1α reduces hypertrophic markers by increasing the expression of TIMP3
  and increases autophagy by down regulate AKT/mTOR pathway, thus inhibits chondrocyte
  hypertrophy to protect cartilage from degradation. One-way ANOVA *p < 0.05; **p
  < 0.01; ***p < 0.001. Scale bar, 100 μm. n = 6 per group
article_title: Undercarboxylated OCN Inhibits Chondrocyte Hypertrophy and Osteoarthritis
  Development through GPRC6A/HIF-1α Cascade
