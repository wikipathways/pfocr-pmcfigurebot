figure_title: Cell–cell communication and pseudotime analysis of PD-key-neutrophil.
caption: Cell–cell communication and pseudotime analysis of PD-key-neutrophil. (A)
  Heatmap showing the intensity of outgoing and incoming signals for all the cell
  types. (B) Scatter plot depicting the communication weights/strengths for various
  cell types, with PD-key-neutrophils showing significantly higher signaling strengths.
  (C) Circle plots showing BAFF signaling initiated by PD-KEY-Neutrophils and monocytes,
  absent in other neutrophil subpopulations. (D,E) Visualization of the roles of different
  cell types within the CXCL and ANNEXIN signaling pathways. (F) pseudotemporal trajectory
  analysis of the developmental stages of neutrophil subtypes. PD-KEY-Neutrophils
  (subclusters 0, 3, 5, 6, 7) localize to terminal branches, indicating their maturation
  state in advanced periodontitis
