figure_title: Serine and threonine biosynthesis mutants are sensitive to INAM.
caption: Serine and threonine biosynthesis mutants are sensitive to INAM. A) A diagram
  illustrating the synthesis pathways of serine, aspartate, threonine, and cysteine,
  as well as the integration into one-carbon metabolism and purine metabolism. Deleted
  genes conferring INAM sensitivity are in bold. B) Representative quantitative dose-response
  curve illustrating the relative viability of BY4741 (WT) and the ser2Δ mutant at
  a range of INAM concentrations. Dots and inverted triangles represent values obtained
  from three biological replicates with sigmoid curves fitted to the data using a
  dose response function and the Levenberg Marquardt iteration algorithm. Shaded areas
  around the curve are 95% confidence bands. C) Mean INAM IC50 values for BY4741 (WT),
  ser2Δ, thr1Δ, and hom3Δ strains calculated from the equations from the fitted curves
  as in panel B. Error bars represent 95% confidence intervals. D) CLS assay showing
  moderate lifespan extension of ser2Δ mutant, and full extension by 25 mM INAM. E)
  CLS assay showing shortened lifespan of a hom2Δ mutant that is partially restored
  by 25 mM INAM. Oasis 2 statistics for CLS assays are provided in Table S5
article_title: Chronological lifespan extension and nucleotide salvage inhibition
