figure_title: Pharmacological inhibition of non-muscle myosin II (NMII) family members
  has therapeutic potential in a wide array of diseases, and oxidative stress is one
  mechanism whereby such inhibition produces a benefit in cancer
caption: '(A) Upper panel: NMII consists of two heavy chains. These are composed of
  three domains: (i) two motor domains at the amino terminus (right side of image)
  that contain the ATPase site and which bind to blebbistatin and its derivatives,
  (ii) the lever arm, containing the essential and regulatory light chains (middle,
  blue and magenta), and (iii) the C-terminal coiled coil (left side of image), which
  allows NMII to polymerize into minifilaments. Lower panel: illustration of the diverse
  diseases (upper portion of each box) that depend on an array of NMII functions (lower
  portion of each box). (B) Inhibiting NMIIA and NMIIB with MT-125 prevents mitochondrial
  fission. This is a quality control process that removes damaged segments of the
  mitochondrial membrane that would otherwise leak reactive oxygen species (ROS) into
  the cytoplasm, where it can damage DNA in the nucleus and peroxidize the cell membrane.
  This has two potentially therapeutic effects. First, it enables MT-125 to further
  extend survival by synergizing with radiotherapy, a standard treatment for cancers,
  which works in part by also generating ROS. Second, the MT-125-induced increase
  in ROS leads to peroxidation of protein tyrosine phosphatases, which inhibit the
  function of receptor tyrosine kinase (RTK). This leads to constitutive activation
  of RTKs, stimulation of RTK downstream effectors, including PI3 kinase (PI3K), AKT,
  and mammalian target of rapamycin (mTOR), and ‘oncogene addiction’ to these oncogenic
  kinases. Combining MT-125 with inhibitors of the RTK–PI3K–AKT–mTOR pathway thereby
  leads to synthetic lethality and prolongs survival in models of glioblastoma'
