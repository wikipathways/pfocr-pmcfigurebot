figure_title: Pkd1RC*17/− allele disrupts the c-Myc–miR-17–mitochondrial axis in cystic
  kidneys
caption: 'Shotgun label-free quantitative proteomics was performed to assess global
  proteomic profiles of kidneys from 18-day-old Pkd1+/+, Pkd1RC/−, and Pkd1RC*17/−
  mice (n=3, each group). A. Comparative differential expression analysis depicts
  a global trend where a substantial portion of dysregulated protein expression (adjusted
  p <0.05) in Pkd1RC/− kidneys compared to Pkd1+/+ kidneys was improved in Pkd1RC*17/−
  kidneys. B. Top pathways (based on z-score ≥ 6 in at least one comparison group)
  that underlie the proteomic changes observed in Pkd1RC/− compared to Pkd1+/+ kidneys,
  and Pkd1RC*17/− compared to Pkd1RC/− kidneys. The ingenuity pathway analysis software
  was used for the predictions. Expression of metabolic, proliferative, and RNA processing
  pathways were improved in Pkd1RC*17/− compared to Pkd1RC/− kidneys. C. Immunoblot
  analysis showing reduced pMTOR and pCREB expression, and increased expression of
  oxidative phosphorylation complex (OXPHOS) components in Pkd1RC*17/− compared to
  Pkd1RC/− kidneys (n=3). D-E. Phospho-histone H3 (pHH3, pink) immunofluorescence
  staining (D) and subsequent quantification (E) demonstrated reduced proliferation
  in Pkd1RC*17/− compared to Pkd1RC/− kidneys (n=4 each). The slides were counterstained
  with DAPI (blue). F-I. qRT-PCR analysis showing expression of primary miR-17 transcript
  (F), mature miR-17 and miR-20a (G), mature miR-21 (H), and cMyc (I) in kidneys of
  18-day-old Pkd1+/+, Pkd1RC/−, and Pkd1RC*17/− mice (n=3). The c-Myc/miR-17 axis
  remained elevated in Pkd1RC*17/− kidneys, whereas expression of miR-21, a cyst-pathogenic
  miRNA, was improved. J. Immunoblot analysis showing equivalent expression of cMyc
  protein in kidneys of 18-day-old Pkd1RC/− and Pkd1RC*17/− mice (n=3). Actin serves
  as the loading control; Error bars indicate SEM. Statistics: ANOVA with Tukey’s
  (A, F-I), and Unpaired, two-tailed t-test (E, J)'
article_title: Disruption of a six-nucleotide miRNA motif improves PKD1 dosage and
  ameliorates polycystic kidney disease
