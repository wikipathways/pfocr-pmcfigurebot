caption: 'The effect of T4 on baseline transmission in the perforant pathway–dentate
  gyrus synapses. Excitatory postsynaptic potential (EPSP) slope and population spike
  (PS) amplitude absolute input/output curves in the dentate gyrus (DG) region in
  relation to the increasing levels of stimulation of the perforant pathway (horizontal
  axis) before and following the 15-minute infusion (empty square: before aCSF infusion;
  black square: after aCSF infusion; empty triangle: before T4 infusion; gray triangle:
  after T4 infusion). The standard errors of the means are indicated by error bars.
  The baseline synaptic transmission remains unaffected by T4 injection.aCSF, artificial
  cerebrospinal fluid'
