figure_title: HP0175-induced autophagy.
caption: HP0175-induced autophagy. The H. pylori virulence factor HP0175 activates
  the unfolded protein response (UPR) via the PERK pathway. PERK activation leads
  to the phosphorylation of eIF2α, which enhances the translation of the transcription
  factor ATF4. ATF4 promotes the expression of autophagy-related genes, such as ATG5,
  LC3B, BECN1, ULK1, and CHOP. Consequently, a phagophore is formed and expands into
  an autophagosome, which engulfs damaged or misfolded cytoplasmic components. The
  autophagosome then fuses with a lysosome to form an autolysosome (autophagolysosome),
  where the enclosed material is degraded by the lysosomal enzymes. The arrow with
  a horizontal bar indicates an inhibitory process
