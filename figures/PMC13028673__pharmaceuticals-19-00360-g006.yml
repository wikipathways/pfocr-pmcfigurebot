figure_title: Network pharmacology analysis reveals potential therapeutic targets
  and pathways of YXJDF in heart failure (HF).
caption: Network pharmacology analysis reveals potential therapeutic targets and pathways
  of YXJDF in heart failure (HF). (A) Venn diagram showing 650 overlapping targets
  between YXJDF-related and HF-related genes. (B) Protein–protein interaction (PPI)
  network constructed from the 650 intersecting genes using the Search Tool for the
  Retrieval of Interacting Genes/Proteins (STRING) database. (C) Core target network
  identified by topological analysis using CytoNCA plugin (version 2.1.6) in Cytoscape
  (version 3.9.1; https://cytoscape.org/) (network visualization software); node size
  and color intensity represent degree value. (D) Gene Ontology (GO) enrichment analysis
  results, including biological process (BP), cellular component (CC), and molecular
  function (MF) categories. (E) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway
  enrichment analysis showing the top 15 significantly enriched pathways. (F) Network
  visualization of core targets and their associated KEGG pathways. Data were analyzed
  and visualized using Cytoscape, STRING, Metascape (a web-based enrichment analysis
  platform), and bioinformatics platforms
