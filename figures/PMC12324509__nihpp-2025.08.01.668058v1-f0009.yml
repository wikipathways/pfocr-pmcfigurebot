figure_title: Transcriptomic comparison of oxidative phosphorylation (OxPhos) gene
  expression in U3046 vs. U3035 GBM cell lines
caption: (A) KEGG pathway map of oxidative phosphorylation (hsa00190) displaying differential
  gene expression between U3046 (left half of each color bar) and U3035 (right half
  of each color bar) under basal conditions. Heatmap coloring reflects log2 fold-change
  (log2FC) values of irradiated cells relative to baseline, un-irradiated gene expression,
  with the color scale ranging from −1.0 (blue, down-regulated) to +1.0 (red, up-regulated),
  as indicated by the legend bar (top right). Notably, U3035 cells exhibited broad
  up-regulation of Complex I (NDUFS, NDUFA) and Complex V (ATP5, ATP6) subunits, consistent
  with enhanced mitochondrial bioenergetic capacity. In contrast, U3046 cells showed
  pronounced repression across several complexes, including down-regulation of Complex
  I and IV components (e.g., NDUFB8, COX11), indicative of a less active OXPHOS phenotype.
  Select Complex II components (e.g., SDHA, SDHB) were modestly preserved in both
  lines. (B) KEGG pathway map of glycolysis/gluconeogenesis (hsa00010) displaying
  differential gene expression between U3046 (left half of each color bar) and U3035
  (right half of each color bar) under basal (0 Gy) conditions. U3035 cells demonstrated
  up-regulation of glycolytic enzymes involved in glucose phosphorylation and pyruvate
  metabolism (e.g., HK1, PFKL, ENO1, LDHA), consistent with enhanced glycolytic engagement.
  In contrast, U3046 cells showed widespread repression of early and intermediate
  glycolytic enzymes (e.g., GALM, GAPDH, ALDH3A1), with relative up-regulation of
  select gluconeogenic and pyruvate metabolism genes (e.g., PCK1, PDHA1), suggestive
  of distinct carbon flux regulation
