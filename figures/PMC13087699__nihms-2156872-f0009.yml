figure_title: Sensory signals pathways from major organs
caption: 'A. Sensory fibers originate from peripheral organs like intestine, bladder,
  lung, heart, and pancreas. These neuronal fibers travel to the spinal cord and have
  their cell bodies (circles) in dorsal root ganglia. B. In the spinal cord they connect
  to neurons (post-synaptic) that project back to the brain (ascending pathway). The
  presynaptic terminal of the sensory fiber receives signals from GABAergic interneurons.
  As Cl− in the sensory neuron is high due to NKCC1 activity, when GABA is released
  and binds to GABAA receptors located at the terminal of the sensory fiber, it depolarizes
  the terminal. This affects the transmission of the signal coming from the peripheral
  organ. This mechanism, called presynaptic inhibition, requires NKCC1 function. NE:
  norepinephrine, Ach: acetylcholine'
