figure_title: (a) The PI3K complex, Akt, and mTOR pathways are essential for follicular
  activation.
caption: (a) The PI3K complex, Akt, and mTOR pathways are essential for follicular
  activation. The PI3K complex converts PIP2 to PIP3, which activates PDK1 and Akt.
  Akt then moves to the nucleus to phosphorylate FOXO3A, causing it to relocate to
  the cytoplasm and trigger follicular activation. PTEN negatively regulates the PI3K/Akt
  pathway by converting PIP3 to PIP2, acting as a natural brake against overactivation.
  (b) PMFs’ quiescence is maintained by molecules such as PTEN, TSC1–TSC2, FOXO3A,
  p27, AMH, and FOXL2
