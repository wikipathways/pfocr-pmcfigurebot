figure_title: Empirical epitope selection methods
caption: 'A Imprinting of N-terminal epitope of tumor surface target SIRPα for anti-cancer
  immunotherapy. (i) Illustration of the preparation route of molecularly imprinted
  lysosomal nanodegrader (MILND) and immunotherapy approach by MILND via blocking
  the SIRPα-CD47 signaling pathway. (ii) Fluorescence images demonstrating the uptake
  of MILND by tumor-associated macrophages (green: fluorescein-labelled MILND, red:
  lysosomes stained by Lyso Tracker Red, blue: DAPI-stained nuclei). (iii) Relative
  protein expression of MILND-targeted-SIRPα protein degradation in macrophages measured
  by western blot. (iv) Relative protein expression of SIRPα, phosphatidylinositol
  3-kinase, catalytic subunit alpha (PI3K-p110α), phosphorylated protein kinase B
  (p-Akt) and myosin IIa in control, MILND, or non-imprinted NILND treated cells.
  (v) Relative tumor volume growth curves of CT26 syngenetic tumor mice over 15 days
  treatment. (vi) Photograph of the dissected tumors from the CT26 syngenetic tumor
  mice after 15 days of therapy in each treated group. (vii) Average tumor weight
  resected from the CT26 syngenetic tumor mice after different treatment. Adapted
  with permission [56]. Copyright 2024, Elsevier. B Advanced empirical epitope selection
  by snapshot imprinting. (i) Diagram depicting the snapshot imprinting process, wherein
  cell surface proteins are imprinted, the resultant EINPs are collected, and the
  template peptides eluted and sequenced in order to identify novel biomarkers. (ii–iv)
  Extracellular region of epidermal growth factor receptor (EGFR); regions considered
  to be epitopes highlighted in orange, remainder in blue. Epitopes selected from:
  (ii) label-free deep proteome analysis; iii) snapshot imprinting. (iv) Depiction
  of epitopes ultimately selected for imprinting highlighted in red. Adapted under
  CC BY 4.0 [12]'
