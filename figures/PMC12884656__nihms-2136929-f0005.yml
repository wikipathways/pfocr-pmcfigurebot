figure_title: MyD88 is required for hippuric-acid-driven pro-inflammatory responses
  in vitro and in vivo
caption: '(A) IPA of RNA-seq in BMDMs pre-treated with hippuric acid (10 μM) for 1
  h and then stimulated with LPS (100 ng/mL)+IFNγ (100 ng/mL) for 8 h. Regulators
  are grouped by MyD88/TLR pathway. Differentially expressed genes passing an FDR
  of <5% were used. n = 3.(B) Western blot analysis for phosphorylation of IRAK4,
  NF-κB p65, and p38 on BMDMs pre-treated with hippuric acid and then stimulated with
  LPS or LPS+IFNγ for 1 h. The bar plot shows densitometric analysis of phospho-protein
  levels normalized to β-actin (relative band intensity).(C) ELISA of IL-12p40 production
  by BMDMs obtained from wild-type or MyD88-KO mice and pre-treated with hippuric
  acid and then stimulated with LPS+IFNγ for 8 h. n = 4.(D) Flow cytometry on BMDMs
  treated as in (C), showing expression levels of CD86 as MFI. n = 4.(E) Schematic
  of LPS-induced inflammation model showing hippuric acid i.p. administration and
  study readouts.(F) ELISA of 12p40 and IL-6 on peritoneal lavage from (E). n = 6.(G)
  Schematic of E. coli infection model showing hippuric acid i.p. administration and
  study readouts.(H) ELISA of 12p40 and IL-6 on peritoneal lavage from (G). n = 6.(I–K)
  Flow cytometry of CD45+ immune cells in the peritoneum from (G) for PDL1 expression
  on (I) small peritoneal macrophages (SPM) and (J) large peritoneal macrophages (LPM)
  and for IL-12p40 and TNF-α expression on (K) dendritic cells (DCs). n = 7.In (C)
  and (D), p values were determined by two-way ANOVA with post hoc multiple comparisons.
  In (F), (H), and (I)–(K), p values were determined by one-way ANOVA with post hoc
  multiple comparisons.Data are presented as the means ± SD. Significance is indicated
  as follows: *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001, and ns, no significant
  difference'
article_title: Aromatic microbial metabolite hippuric acid enhances inflammatory responses
  in macrophages via TLR-MyD88 signaling and lipid remodeling
