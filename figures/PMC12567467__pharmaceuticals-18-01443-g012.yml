caption: ClpP as a mitochondrial checkpoint in breast cancer subtypes. (A) In MCF7
  cells, ClpP upregulation is linked to reduced SIRT3 expression, senescence induction,
  and downregulation of cyclin E/Cdk2; (B) In BT474 cells, ONC201 induces mitochondrial
  stress, ISR activation, ROS accumulation, and suppression of cyclin E/Cdk2; (C)
  In HER2+ breast cancer, ClpP and mitochondrial chaperones promote UPRmt and activation
  of oncogenic signaling pathways
