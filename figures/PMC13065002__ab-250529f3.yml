caption: Metabolomic analysis of colonic contents of early estrus and diestrus female
  rabbits. (A) Display of PCA of the samples in two-dimension (PC1 = 55.6%, PC2 =
  23.8%). (B) Volcano plot of differential metabolites between the early estrus and
  diestrus groups. The blue dots represent the down-regulated differential metabolites,
  the red dots represent the up-regulated differential metabolites, and the gray dots
  represent the detected but not significantly different metabolites. VIP>1, p<0.05,
  FC>1.5 or <0.67. Top 10 up-regulated metabolism and enriched KEGG pathway in the
  early estrus group (C) and diestrus group (D). PCA, principal component analysis;
  VIP, variable importance in projection; FC, fold change; KEGG, Kyoto Encyclopedia
  of Genes and Genomes
