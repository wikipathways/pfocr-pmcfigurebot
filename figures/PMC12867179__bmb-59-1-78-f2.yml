figure_title: The effect of Lefty2 on the TGF-β1 signaling pathway.
caption: The effect of Lefty2 on the TGF-β1 signaling pathway. (A) Bone marrow cells
  were cultured with M-CSF in the absence or presence of TGF-β1 for 3 days. The indicated
  concentrations of Lefty2 were added during differentiation to naive BMMs or TGF-β1-pretreated
  BMMs cultured with M-CSF and RANKL. Cultured cells were stained with TRAP and osteoclasts
  were counted. Bar, 200 μm. (B) BMMs were serum-starved and treated with vehicle
  or Lefty2 one hour before TGF-β1 stimulation. Protein levels were assessed using
  western blot. (C) TGF-β1-pretreated BMMs were serum-starved and treated with vehicle
  or Lefty2 one hour before RANKL stimulation. Protein levels were assessed using
  western blot. **P < 0.001
article_title: Lefty2 prevents RANKL-induced bone loss by inhibiting osteoclast differentiation
