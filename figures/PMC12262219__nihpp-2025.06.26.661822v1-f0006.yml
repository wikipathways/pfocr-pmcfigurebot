figure_title: BST2-expressing CD11b+ macrophages are increased in the skin during
  alopecia areata and express genes involved in antiviral responses and the complement
  system
caption: (a) Immunofluorescent images were used to quantify the number of CD11b+,
  BST2+ and CD11b+ BST2+ cells from skin samples of C3H/HeJ mice with (n=6) and without
  (n=3) alopecia areata. (b) Quantification of CD11b+ cells. (c) Quantification of
  BST2+ cells. (d) Quantification of CD11b+BST2+ cells. (e) Canonical pathway analysis
  of the top differentially expressed genes using IPA sorted by BST2+ and BST2− Cd11b+
  cells. Significance determined using an unpaired t-test (*p < 0.05)
article_title: Epidermal γδ T cells, CD8 T cells and macrophages are increased in
  number in alopecia areata and express BST2 as part of an interferon-driven antiviral
  gene signature
