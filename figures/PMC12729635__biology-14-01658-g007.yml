caption: Transcriptome analysis of P. qamdoensis under three different color film
  treatments. (a) Sample correlation analysis. (b) Number of up- and down-regulated
  DEGs. (c) Venn diagram. (d–f) Each point in the volcano plot represents a gene.
  The abscissa (x-axis) denotes the logarithmic value of the fold change in gene expression
  between two samples, while the ordinate (y-axis) represents the negative logarithmic
  value of the statistical significance of gene expression changes. In the plot, green
  points indicate down-regulated DEGs, red points signify up-regulated DEGs, and black
  points represent non-DEGs. (g–i) GO enrichment analysis; (g) cellular component
  entries; (h) molecular function entries; (i) biological process entries. The outer
  color strip in the upper part shows the comparison groups, and the inner circle
  represents the composition of the comparison group. The outer color strip in the
  lower part shows the composition, and the inner circle indicates the abundance distribution
  of the composition among the comparison groups. The thickness of the chords in the
  middle part reflects the abundance level of the composition in each comparison group.
  (j) Analysis of KEGG pathway top 20 enrichment in three comparison groups. In the
  Sankey diagram, the three color bars on the left represent the three comparison
  groups, and the color bars on the right represent KEGG pathways. The flow direction
  of the bands indicates the correlation between data, and the width of the bands
  reflects the strength of the correlation between data
