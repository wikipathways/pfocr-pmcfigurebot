figure_title: Differential gene expression analysis and functional enrichment results.
caption: Differential gene expression analysis and functional enrichment results.
  (A) Bar chart showing the number of upregulated (red), downregulated (blue), and
  non-differentially expressed (brown) genes in fuhua30 and fuhua23. (B) Volcano plot
  illustrating the distribution of differentially expressed genes. The x-axis represents
  log2(fold change), and the y-axis represents −log10(FDR). Red points indicate upregulated
  genes, blue points indicate downregulated genes, and green points indicate non-significant
  genes. (C) Go pathway enrichment bubble plot. The x-axis represents the Rich Factor,
  and the y-axis lists the Go pathways. Bubble size corresponds to the number of genes,
  and color indicates the Q-value. (D) Sequence alignment of COLD1a, COLD1b, and Rice
  COLD1 proteins generated using sequences retrieved from UniProt, aligned with ClustalW,
  and visualized with ESPript
