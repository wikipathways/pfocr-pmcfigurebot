figure_title: FERMT2⁺ CAFs exhibit distinct transcriptional programs and enhanced
  communication with cancer cells via TGF-β signaling.
caption: 'FERMT2⁺ CAFs exhibit distinct transcriptional programs and enhanced communication
  with cancer cells via TGF-β signaling. (A) Schematic overview of the analysis pipeline
  using the gastric cancer single-cell RNA-seq dataset (Luo et al., 2022). Fibroblast
  clusters were isolated for pseudotime, CellChat, GSEA, and NicheNet analyses based
  on FERMT2 expression. (B) Pseudotime analysis of CAF populations showing dynamic
  expression patterns of FAP and FERMT2 along the trajectory. UMAP plot illustrates
  clustering and annotation of CAFs in different states. (C) Cell-cell communication
  analysis using CellChat reveals that FERMT2⁺ CAFs exhibit more interactions and
  stronger signaling intensity with cancer cells than FERMT2⁻ CAFs. Right panels:
  Quantification of interaction numbers and signaling strength between FERMT2⁺/⁻ CAFs
  and cancer cells, with or without FERMT2 expression. (D) GSEA comparing FERMT2⁺
  versus FERMT2⁻ CAFs reveals enrichment of pro-tumorigenic pathways, including TGF-β,
  WNT, and EMT signaling. (E) NicheNet analysis identifies key ligands involved in
  CAF-cancer cell communication. Heatmaps and dot plots display ligand activity (AUPR),
  expression changes in CAFs, and predicted regulatory potential of target genes.
  Notably, TGF-β1 is significantly upregulated in FERMT2⁺ CAFs. (F) Volcano plot of
  untargeted proteomic analysis of CM from GCAFs after FERMT2 knockdown versus control
  (sh-NC). Downregulation of secreted TGF-β1 and other associated proteins indicates
  FERMT2-dependent regulation of secretion'
