figure_title: Expression of different components of the Reelin/Dab1 signaling pathway
  in prion-infected mice injected in the striatum.
caption: 'Expression of different components of the Reelin/Dab1 signaling pathway
  in prion-infected mice injected in the striatum. (A) Total brain homogenates from
  terminally sick mice and age-matched controls were analyzed by WB for Dab1, ApoER2,
  VLDLR, NCAM, Fyn, and AKT expression. β-Actin was used as the loading control. (B)
  Immunoprecipitation experiments were performed on total brain homogenates from RML-infected
  mice and age-matched controls to detect Dab1 protein. (C) Reelin expression was
  measured in total brain homogenates from terminally sick mice and age-matched controls
  using WB experiments. β-Actin was used as the loading control. (D) The graph reports
  the quantification analysis of the experiments shown in (A,C). Sample size: n =
  5. Data are shown as the ratio of RML-infected samples to controls +- standard error
  to account for sample variability. ** p < 0.01, *** p < 0.001, n.s. = no statistical
  significance'
