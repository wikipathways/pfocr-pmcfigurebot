figure_title: Effect of dietary supplementation with plant essential oil (PEO) and
  coated plant essential oil (CEO) on the protein expression levels of SIRT1/PGC-1α
  signaling pathway in the liver of nursery piglets challenged by lipopolysaccharide
  (LPS).
caption: Effect of dietary supplementation with plant essential oil (PEO) and coated
  plant essential oil (CEO) on the protein expression levels of SIRT1/PGC-1α signaling
  pathway in the liver of nursery piglets challenged by lipopolysaccharide (LPS).
  CON, control group, piglets fed the basal diet and injected with 100 μg/kg BW saline;
  LPS, piglets fed the basal diet and injected with LPS at a dose of 100 μg/kg body
  weight; LPS+PEO, piglets fed the basal diet supplemented with 500 mg/kg PEO and
  injected with LPS; LPS+CEO, piglets fed the basal diet supplemented with 500 mg/kg
  CEO and injected with LPS. a–c Means with different superscript differ significantly
  (p<0.05). PGC-1α, peroxisome proliferator-activated receptor γ coactivator 1α; SIRT1,
  silent information regulator 1
article_title: Plant essential oil supplementation promotes growth and attenuates
  lipopolysaccharide (LPS)-induced acute liver injury through SIRT1/PGC-1α signaling
  pathway in nursery pigs
