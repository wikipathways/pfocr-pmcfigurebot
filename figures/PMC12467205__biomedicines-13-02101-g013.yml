caption: This stepwise regulatory flowchart outlines the non-clinical validation journey
  of a bioendogenous platform under the ICT-EP framework. The process begins with
  standard preclinical testing, transitions through STIP validation—where ex vivo
  phenotypic metrics, such as ΔC% and viability, are captured—then passes through
  ex vivo pharmacology using standardized, non-destructive assays. This structured
  evidence is compiled into a regulatory submission package that explicitly recognizes
  the product’s non-pharmacodynamic nature. The pathway concludes with authorization,
  emphasizing that approval is possible without systemic exposure, clinical endpoints,
  or human trials, when proportionate documentation is supplied through harmonized,
  reproducible non-clinical platforms. Symbols within the Ex Vivo Pharmacology panel
  represent assay wells (circles), experimental endpoints (triangles), and a representative
  response curve (center)
