figure_title: MC-LR promotes the occurrence of ferroptosis.
caption: MC-LR promotes the occurrence of ferroptosis. After entering cells via OATP,
  MC-LR inhibits PP1 and PP2A, suppresses GPX4 activity through the Erk/MAPK pathway,
  and also impairs the antioxidant system. This damages the endoplasmic reticulum
  and mitochondria, exacerbating lipid peroxidation and iron accumulation, ultimately
  leading to ferroptosis
