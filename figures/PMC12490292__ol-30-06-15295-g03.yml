caption: 'PRMT7 is involved in the regulation of cell cycle-related pathways and affects
  the cell cycle in PCa. (A) The DO enrichment distribution map of the DEGs associated
  with PRMT7. DO is a biomedical database that systematically annotates associations
  between human gene functions and diseases, providing standardized disease descriptors
  for functional genomics research. (B) Map of the GO enrichment sites of the DEGs
  associated with PRMT7. GO is a comprehensive bioinformatics resource that systematically
  characterizes gene functions through three orthogonal categories: Biological processes,
  cellular components and molecular functions. (C) KEGG enrichment analysis of the
  DEGs associated with PRMT7. KEGG is an integrated database that systematically consolidates
  genomic, chemical and systems functional information to facilitate biological pathway
  analysis and network modeling. (D) KEGG enrichment and distribution map of the PRMT7
  differential genes. PRMT7, protein arginine methyltransferase 7; DEGs, Differentially
  expressed genes; log2FC, log2 fold change; DO, Disease Ontology; GO, Gene Ontology;
  KEGG, Kyoto Encyclopedia of Genes and Genomes; NAFLD, Non-alcoholic fatty liver
  disease; NOD, Nucleotide-binding Oligomerization Domain'
