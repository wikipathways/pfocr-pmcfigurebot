figure_title: Transcriptomic changes of strain H1.
caption: Transcriptomic changes of strain H1. (A) Heatmap illustrating the inter-sample
  correlation among strain H1 (n = 3) and strain M (n = 3). Correlation coefficients
  are represented between samples across the horizontal and vertical axes, with color
  gradients indicating the degree of correlation. (B) Volcano plot showing differentially
  expressed genes. Genes with an adjusted p-value < 0.05 and a fold change (FC) >
  2 or <0.5 are defined as significantly differentially expressed. (C,D) KEGG-enriched
  metabolic pathways of the significantly upregulated (C) and downregulated genes
  (D) with enrichment rate on the horizontal axis and pathway names on the vertical
  axis. Circle size reflects the number of genes within each enriched pathway
