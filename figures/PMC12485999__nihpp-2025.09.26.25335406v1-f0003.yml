figure_title: Sex Differences in Mediation Pathway Mean Estimates
caption: The hypothetical causal model where effective Reserve loss mediates the effect
  of infarct volume on functional outcome at 90 days is illustrated in Figure 2. Bootstrapped
  mean estimates of each pathway and 95% confidence intervals. Direct effect, indirect
  effect, total effect and proportion of mediated effect differed significantly between
  females and males according to Mann-Whitney U tests (p<0.001)
