figure_title: Deletion of MaCsbD impairs melanin biosynthesis.
caption: Deletion of MaCsbD impairs melanin biosynthesis. (A) Visual comparison of
  melanin pigmentation in conidia from 15-day-old cultures of WT, ΔMaCsbD, and CP
  strains. (B) Quantitative spectrophotometric analysis of melanin content extracted
  from conidia. (C) Relative transcriptional levels of key genes in the DHN-melanin
  pathway—polyketide synthase (PksP), T4HN reductase (THR), and scytalone dehydratase
  (SCD)—as determined by qRT-PCR. The glyceraldehyde-3-phosphate dehydrogenase gene
  (GPDH) was used as an internal reference. Data are mean ± SEM (n = 3). Significant
  differences were determined by one-way ANOVA with Tukey’s test. *** p < 0.001; ns,
  not significant
