figure_title: Effect of gefitinib on A549-Puro and A549-BRG1 cells and its impact
  on the EGFR signaling pathway in vitro and in vivo.
caption: 'Effect of gefitinib on A549-Puro and A549-BRG1 cells and its impact on the
  EGFR signaling pathway in vitro and in vivo. (A) The in vitro cytotoxic effect of
  gefitinib (0.5–2 µM GEF) treatment on A549-Puro and A549-BRG1 cells at 24 and 48
  h (upper panel). DMSO-treated cells served as controls. Western blot analysis of
  selected markers in gefitinib-treated A549-Puro and A549-BRG1 cells at 24 h (lower
  panel). (B) The cytotoxic effects of siBRG1 (100 nM) in combination with gefitinib
  (2 µM) on A549-BRG1 cells at 24 and 48 h (upper panel). Western blot analysis of
  selected markers following siBRG1 and gefitinib combination treatment in A549-BRG1
  cells (lower panel). DMSO and C-siRNA (100 nM)-treated cells served as controls.
  Parental A549 cells were included as control for comparing BRG1 overexpression.
  β-Actin was used as loading control in Western blotting. (C) Tumor growth curves
  in nude mice bearing A549-Puro and A549-BRG1 tumor xenografts treated with either
  DMSO (vehicle) or gefitinib (100 mg/kg) are illustrated in the upper panel. Representative
  H&E and Ki67 stained tumor tissues are displayed at 10 X magnification: Scale bar,
  1000 µm. Quantitative analysis for Ki67 staining is presented as a bar graph. (D)
  Gefitinib-treated A549-Puro and A549-BRG1 tumor tissues were immunostained for selected
  proteins and compared to DMSO-treated tumors. Differences in protein expression
  were quantified and presented as bar graphs. Magnification, 10 X; Scale bar, 1000
  µm. (E) Western blot analysis of selected markers was performed in A549-Puro and
  A549-BRG1 tumor xenografts treated with DMSO (vehicle) or gefitinib (100 mg/kg).
  A representative blot showing changes in the protein expression levels is shown.
  Changes in the protein expression levels in two separate sets of tumor samples for
  each treatment and tumor group were quantified and presented as bar graphs. α-Tubulin
  was used as loading control. All original Western blot images are provided in the
  Supplementary Figure S6. Error bars denote SD; NS = not significant; * p < 0.05;
  ** p < 0.01'
