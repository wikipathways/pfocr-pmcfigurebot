figure_title: GCRV-II triggers mitochondria-dependent apoptosis pathway in PBLs.
caption: GCRV-II triggers mitochondria-dependent apoptosis pathway in PBLs. (A) Heatmap
  analysis of phenotypic DEGs between GCRV and control group (data adjusted p < 0.01,
  |log2FC| > 1; red, upregulated genes; green, downregulated genes). n = 3. (B) Top
  20 KEGG pathways enriched for GCRV group by GSEA. The red arrow indicates the selected
  pathways in Figure 2C. (C) Significantly enriched gene sets related to apoptosis
  in GCRV group at 36 h post infection (NES, normalized enrichment score; FDR, false
  discovery rate). (D) Heatmap analysis of phenotypic DEGs related to apoptosis pathway
  (data adjusted p < 0.01, |log2FC| > 1; violet, upregulated genes; green, downregulated
  genes). n = 3. (E) Relative mRNA levels of the mitochondria-mediated proapoptotic
  genes in PBLs at 36 h post infection. n = 4. (F) TEM observation of the morphology
  and ultrastructure of PBLs at 36 h post infection (N, nucleus; Mt, mitochondria).
  Scale bar, 1 µm (original), 0.5 µm (enlarged). Data acquisition required two or
  three independent tests (mean ± SEM). * p < 0.05, ** p < 0.01, *** p < 0.001. PBLs,
  peripheral blood leukocytes; DEGs, differentially expressed genes; GSEA, gene-set
  enrichment analysis; TEM, transmission electron microscope
