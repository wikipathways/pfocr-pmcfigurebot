figure_title: Mettl14 controls liver regeneration by modulating survival and regeneration
  pathways including fibrinogenic genes.
caption: 'Mettl14 controls liver regeneration by modulating survival and regeneration
  pathways including fibrinogenic genes.(A) Histogram of log2 fold changes in input-corrected
  m6A across genes in Mettl14 KO versus Flox in hepatectomy (HEPA3). (B) m6A coverage
  plot across significant hypermethylated genes in Mettl14 KO versus Flox in hepatectomy
  (HEPA3) that had fold change magnitude above 1.5 plotted against RNA landmarks,
  whose borders are demarcated by vertical dotted lines. (C) m6A coverage plot across
  significant hypomethylated genes in Mettl14 KO versus Flox in hepatectomy (HEPA3)
  that had fold change magnitude above 1.5 plotted against RNA landmarks, whose borders
  are demarcated by vertical dotted lines. (D) Venn diagram of m6A tagged genes classified
  as hypermethylated or hypomethylated (FDR<0.05). (E) Enriched gene ontology analyses
  of differentially m6A methylated genes. (F) Enriched pathway analyses of differentially
  methylated genes. (G) Gene network analyses of differentially methylated genes.
  (H) m6A coverage plot of represented genes. (I) Violin-plot representation of differentially
  expressed genes between Mettl14 KO versus Flox in hepatectomy (HEPA3). (J) Western
  blot analysis of fibronectin related proteins in Flox and M14KO mice after hepatectomy.
  (K) Protein quantification of FGA corresponding to Figure J. (L) Protein quantification
  of FGB corresponding to Figure J. (M) Western blot analysis of MET proteins in Flox
  and M14KO mice after hepatectomy. (N) Protein quantification of p-MET/MET corresponding
  to Figure M. Data indicate Mean ± SEM. Significance was assessed using a Mann-Whitney
  U-test in (K) (L) (N). * means : p<0.05. N=4 in all groups'
