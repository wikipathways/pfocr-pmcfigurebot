figure_title: TAAD pathway integration network.
caption: 'TAAD pathway integration network. Schematic representation of the major
  mechanistic groups contributing to TAAD. Each oval represents a functional category
  of genes implicated in TAAD: TGF-β/SMAD signaling, extracellular matrix (ECM) remodeling/structural
  matrix, vascular smooth muscle cell (VSMC) function/cytoskeletal contractility,
  metabolic/ion transport/connective tissue disorders, and developmental/signaling/transcriptional
  regulation. Arrows indicate the direction of influence on TAAD pathogenesis, with
  green solid arrows representing processes that accelerate or promote disease. The
  diagram illustrates that each pathway can independently contribute to TAAD while
  also engaging in cross-talk with other mechanistic groups, establishing a network
  of interconnected processes that collectively drive aortic wall weakening and progression
  to aneurysm or dissection [3]'
