figure_title: PICALMs are required for proper stomatal patterning
caption: (A) Confocal images of abaxial epidermis from wild-type (WT) and various
  picalm single, double, and higher-order mutants. WT plants exhibit normal stomatal
  development, whereas picalm mutants exhibit increased stomatal index with varying
  degrees of stomatal clustering. Scale bars, 40 μm.(B) Quantification of stomatal
  index in WT and picalm mutants. Box plots show a significant increase in stomatal
  index in picalm mutants compared to WT. Statistical analysis was determined using
  one-way ANOVA followed by Tukey’s HSD test.(C) Stomatal cluster index analysis in
  WT and picalm mutants. Stomatal clusters are categorized by size (e.g., two, three,
  or four stomata per cluster), highlighting a dramatic rise in clustering frequency
  in higher-order picalm mutants.(D) Confocal images of abaxial epidermis from WT,
  er-105, picalm1a;1b;4a;4b, and the quintuple mutant picalm1a;1b;4a;4b;er-105. The
  quintuple mutant shows similar stomatal numbering and clustering to er-105. Scale
  bars, 40 μm.(E) Quantification of combined stomatal and meristemoid index. The picalm1a;1b;4a;4b;er-105
  quintuple mutant exhibits values comparable to er-105, indicating that PICALMs act
  in the same genetic pathway as ERECTA.(F) Proposed model of the ERECTA receptor
  internalization facilitated by PICALM proteins. ERECTA is internalized through CME
  involving adaptor proteins such as PICALM3, PICALM4A, and PICALM4B, along with the
  AP2 complex and TPLATE. Internalized receptors are sorted via early endosomes or
  the trans-Golgi network (TGN) for recycling, or trafficked to vacuoles for degradation.
  In picalm mutants, defective CME impairs receptor pool balance, disrupting stomatal
  patterning. The secretion of newly synthesized ERECTA and trafficking to late endosomes/vacuoles
  remain unresolved in picalm mutants.(G) Representative images comparing stomatal
  patterning in WT, picalms, er, and er; erl1; erl2 mutants. picalm mutants phenocopy
  er family mutants, displaying increased stomatal number and clustering, supporting
  a functional link between CME regulation and ERECTA-mediated signaling
