figure_title: Effect of SiNPs on the SIRT1/HSF1 signaling pathway in BEAS-2B cells
  with SIRT1 knockdown through SIRT1 siRNA.
caption: 'Effect of SiNPs on the SIRT1/HSF1 signaling pathway in BEAS-2B cells with
  SIRT1 knockdown through SIRT1 siRNA. (A) The BEAS-2B cells pretreated with or without
  SIRT1 siRNA were exposed to 10 µg/mL SiNPs. Non-targeting siRNA was used as a negative
  control (NC). (a) Representative protein bands of SIRT1, SIRT1 (ser47), SITR1 (ser27)
  and HSF1 were detected by Western blot. (b–e) Western blot analysis of SIRT1, SIRT1
  (ser27), SIRT1 (ser47), and HSF1 protein expression levels and quantitative analysis.
  Data are expressed as mean ± S.D., n = 3–5, * p < 0.05 and ** p < 0.01. SiNPs treated
  group compared with corresponding SiNPs plus SIRT1 siRNA group or SiNP-treated group
  without SIRT1 compared with the control group without SIRT1 siRNA. (B) Effect of
  SIRT1 knockdown on the intracellular localization and quantitative analysis of HSF1
  after SiNPs exposure. Blue: DAPI; red: HSF1. Scale bar: 20 μm'
