figure_title: Loss of Hdac3 enhances mitochondrial biogenesis and activity in murine
  and human aortic valves
caption: (A) Reactome pathway analysis reveals enrichment in the energy generation
  and mitochondrial biogenesis categories (n = 3). (B–E) GSEA of differentially regulated
  transcripts in murine aortic valves lacking Hdac3 compared with control (n = 3).
  P < 0.05. (F) Hdac3-knockout aortic valves exhibit an increase in mitochondrial
  complex I activity compared with control (n = 3). (G–J) Coimmunofluorescence staining
  with Hoechst nuclear counterstain (G and I; blue) and corresponding quantification
  (H and J) demonstrate increased mitochondrial density, indicated by elevated ATP5A
  expression (red; yellow arrows), in Vimentin+ valvular interstitial cells (green)
  in Hdac3-knockout murine aortic valves (G) and in pathological regions of human
  aortic valves (I), compared with control murine valves and normal human valve regions
  (G and I; white arrows). Unpaired t test with Welch’s correction. Data represent
  median with interquartile range. Scale bar 50 μm
article_title: Epigenetic dysregulation of energy homeostasis drives aortic valve
  stenosis that is treatable with metformin
