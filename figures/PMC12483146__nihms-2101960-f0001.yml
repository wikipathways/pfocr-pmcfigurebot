figure_title: Diverse cancer resistance mechanisms of organisms across the tree of
  life
caption: Animals exhibit diverse proposed cancer resistance mechanisms, including
  DNA protection (e.g. e.g. efficient genotoxic drug efflux mediated by the ATP-binding
  cassette transporters in bats protects the DNA51), efficient DNA repair (e.g., high
  levels of cold-inducible RNA-binding protein (CIRBP) and replication protein A2
  (RPA2) are present in bowhead whale fibroblasts and increase the efficiency and
  fidelity of DNA repair32), effective elimination of damaged cells (e.g., high rates
  of p53-mediated apoptosis in response to DNA damage in elephants39), preventing
  clonal expansion of pre-malignant cells (e.g., naked mole rat fibroblasts secrete
  extremely high molecular weight hyaluronan acting as signal to CD44 receptors and
  triggering early contact inhibition52), elimination of over-proliferating pre-malignant
  cells (e.g. blind mole rat cells express very low levels of DNA methyltransferase
  1 that fails to maintain DNA methylation on retrotransposable elements during rapid
  cell proliferation; derepression of RTEs triggers the formation of cytoplasmic RNA-DNA
  hybrids, which activate the cGAS-STING pathway and induce concerted cell death40),
  and removal of cancer cells via cell competition (e.g., in fruit flies, genetically
  fitter cells eliminate neighboring abnormal cells, such as those with mutations
  or altered polarity, through apoptosis triggered by signaling imbalances, innate
  immune responses, or mechanical stress53)
