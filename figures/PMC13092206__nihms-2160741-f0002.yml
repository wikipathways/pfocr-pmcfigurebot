figure_title: PM-Associated Immune Response
caption: (i) Activation of respiratory epithelium following PM exposure results in
  increased secretion levels of TGF-β, IL-8, and AR from the respiratory epithelium
  and subsequent immune activation cascade. Further immune cell activation includes
  (ii) DCs, macrophages, granulocytes (neutrophil, eosinophil, basophil/mast cell),
  T cells, and B cells. DC activation resulted in decreased secretion levels of IL-5,
  -6, -12, -12, and TNF-α, as well as increased expression of CCR7, CD40, CD80, and
  CD86. Activated macrophages produce O2 radicals as well as increase activity of
  ATG2A and ERK1/2 pathway activity. Neutrophil activation resulted in O2 radical
  production as well as increased secretion/expression of IL-8, -4. MMP-9, CD4, CD138,
  NE. Activated eosinophils resulted in increased secretion of IL-13, eotaxin-1, and
  increased eosinophil accumulation. Basophil and mast cell activation resulted in
  increased activity and degranulation. PM-induced CD4+ T cells resulted in an increased
  Th2 to Th1 ratio and increased secretions of IFN-γ, IL-13, and IL-17A. Plasma cell
  activation resulted in increased IgE, IgM, and IgG levels as well as decreased IgA
  production. Figure created using BioRender.com
