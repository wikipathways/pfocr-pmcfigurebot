figure_title: Effect of AcCyc or AcClk knockdown on juvenile hormone pathway genes
  and other circadian clock genes under non-diapause conditions.
caption: Effect of AcCyc or AcClk knockdown on juvenile hormone pathway genes and
  other circadian clock genes under non-diapause conditions. The expression levels
  of AcPer (A), AcTim (B), AcClk (C), AcKr-h1 (D), AcJHAMT1 (I), AcJHAMT2 (J), Ac
  JHAMT3 (K), and AcMet (L) genes after RNAi-AcCyc. The expression levels of AcPer
  (E), AcTim (F), AcClk (G), AcKr-h1 (H), AcJHAMT1 (M), AcJHAMT2 (N), Ac JHAMT3 (O),
  and AcMet (P) genes after RNAi-AcClk. Data represent mean ± stand error of mean
  (SEM). Asterisks indicate significant differences between dsGFP and dsRNA using
  Student’s t-test (* p < 0.05; ** p < 0.01; *** p < 0.001; **** p < 0.0001; “ns”
  indicate no signiffcant differences)
