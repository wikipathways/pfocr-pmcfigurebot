figure_title: Macrophages lacking TREM2 promote the infiltration of CD8+ T cells into
  the infarcted region via the secretion of CXCL16.
caption: 'Macrophages lacking TREM2 promote the infiltration of CD8+ T cells into
  the infarcted region via the secretion of CXCL16. (A) Cell communication analysis:
  macrophage groups and CD8+ T cells in scRNA-seq, WT / TREM2 KO mice, MI-7d. (B)
  Heatmap: expression of ligands in (A), bulk RNA-seq of macrophages (CD45+CD11b+CD64+)
  in WT/TREM2 KO hearts, MI-7d. (C) ELISA results of CXCL16 levels in infarct hearts
  of WT/KO/BMT Mice (n = 8, 7). (D) Schematic of the transwell experiment. The proportion
  of migrated CD8+ T cells in E) ± CXCL16 protein solution (n = 5), (F) BMDMs culture
  medium (n = 5). (G) In scRNA-seq, macrophages (Mac) were isolated from both the
  TREM2 KO group and the WT group. KEGG pathway analysis was subsequently conducted
  to compare the transcriptomic profiles of Mac from the two groups. (H) bulk RNA-seq
  KEGG analysis of the intracellular signaling pathways between TREM2 KO and WT data.
  I, (L) Western blot images of PI3K-AKT pathway-related proteins in BMDMs. Activation
  levels of (J, K, M) PI3K (n = 3) and AKT (n = 3). (N) Migration ratio of CD8⁺ T
  cells via Transwell (n = 3); (O) CXCL16 ELISA results in BMDMs culture medium ±
  PI3K inhibitor (PI3K IN) (n = 6). WT→WT: Bone marrow cells from WT mice were transplanted
  into WT mice. KO→WT: Bone marrow cells from KO mice were transplanted into WT mice.
  Data are presented as the mean ± SD. Unpaired student t test or one-way ANOVA, Tukey
  test. *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
