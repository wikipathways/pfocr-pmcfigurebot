figure_title: β-Catenin stabilization reprograms lung gene expression during pristane-induced
  alveolar hemorrhage
caption: (A) Principal component analysis (PCA) showing separation of WT and CAT-Tg
  lung transcriptomes at day 14 after pristane-induced AH (n = 4 per group). (B) Volcano
  plot of differentially expressed genes (DEGs; FDR ≤ 0.05, |log2FC| ≥ 0.5) between
  CAT-Tg and WT lungs; positive log2FC indicates higher expression in CAT-Tg. (C)
  Hierarchical clustering heatmap of row-scaled normalized expression for DEGs across
  all samples (n = 4 per group). (D) Summary of Hallmark pathway enrichment by GSEA,
  highlighting pathways enriched in WT versus CAT-Tg lungs following AH. (E) Ridge
  plot showing normalized enrichment score (NES) distributions for selected Hallmark
  gene sets. (F) Dot plot summarizing gene ratios for selected Hallmark gene sets;
  dot size reflects the number of genes contributing to enrichment. (G and H) Representative
  GSEA enrichment plots for selected Hallmark pathways, including DNA repair and oxidative
  phosphorylation (G) and allograft rejection and coagulation (H)
