figure_title: HK2 participates in airway epithelial apoptosis, immune response and
  glycolysis through multiple signaling pathways.
caption: HK2 participates in airway epithelial apoptosis, immune response and glycolysis
  through multiple signaling pathways. (A) Volcano plot showing transcriptome changes
  from Beas-2b cells transfected with HK2 plasmid or control plasmid. Fold change
  ≥1.5. (B,C) Enriched GO terms (B) and KEGG pathways (C) analysis of DEGs. (D) Flow
  cytometry analysis of the apoptosis of Beas-2b cells transfected with plasmid and
  treated with IL-1β for 48 h (n = 4 per group). (E) Western blot analysis of HK2,
  PARP1, cleaved PARP1, caspase-3, cleaved caspase-3, Bax, and Bcl-2 in Beas-2b cells
  transfected with plasmid and treated with IL-1β for 48 h (n = 4 per group). (F)
  Inflammatory mediators. Data are presented as mean ± SEM, Statistical differences
  were determined with one-way ANOVA with a Tukey-Kramer test for multiple-group comparisons.
  * p < 0.05
