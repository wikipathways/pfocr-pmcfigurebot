figure_title: C1-assimilation pathways in native and synthetic microbes.
caption: 'C1-assimilation pathways in native and synthetic microbes. (a) Summary of
  described assimilatory pathways, including the ribulose monophosphate pathway (RuMP)
  variants (blue): including the oxidative pentose phosphate pathways (oxPPP) (1),
  phosphoketolase pathways, XFP-RuMP [33], also described as bifidobacterium shunt
  [39] and methanol-condensation cycle [57] (2), EDD-RuMP (3), and EMP-RuMP (4); the
  SC integrated with the EMCoA-P pathway(pink); and the Calvin cycle, CBB (green).
  (b) Carbon assimilation flux in Type I methanotrophs with the EDD-RuMP, initially
  predicted as the main methanotrophic pathways [43] but observed only in some strains
  during growth on methanol [37,39]; (c) Carbon flux in Type X methanotrophs, such
  as Methylococcus [78–80]; (d) Carbon flux in Type I methanotrophs, such as Methylotuvimicrobium,
  the EMP-RuMP variants enables the high efficiency of methane utilization, and commonly
  observed during growth on methane [38,40]; (e) Carbon assimilation in Type II methanotrophs,
  such as Methylosinus/Methylocystis [31,32]; (f) Autotrophic pathways for C1–assimilation
  found in some alphaproteobacterial and Verrucomicrobial [51] methanotrophs. (g)
  Synthetic C1 assimilation pathway, reconstructed in E.coli [58]. Connection line
  thickness indicates the predicted carbon flow based on -omics data analysis or direct
  13C-carbon measurements. Gray lines represent pathways that are absent in the type
  of microorganism described'
article_title: Harnessing the potential of microbial methane utilization for chasing
