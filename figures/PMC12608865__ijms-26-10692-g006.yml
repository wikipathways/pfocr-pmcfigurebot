figure_title: ECS-mediated antinociceptive modulation in the spinal DH.
caption: 'ECS-mediated antinociceptive modulation in the spinal DH. (A) Nociceptive
  projection neurons: Postsynaptic activity induces eCB synthesis. These mediators
  diffuse retrogradely to presynaptic CB1Rs (Gi/o-coupled), triggering: (i) Gαi/o-mediated
  adenylyl cyclase inhibition, reducing cAMP/PKA activity and modulating ion channels
  (TRPV1, HCN, ASIC, Nav); (ii) suppression of VGCCs and TRPM3, decreasing Ca2+ influx
  and neurotransmitter release; (iii) Gβγ-mediated activation of GIRK and K_ATP channels,
  producing hyperpolarization; (iv) MAPK cascade activation (ERK, JNK, p38) for long-term
  transcriptional changes. CB2R inhibits adenylyl cyclase, suppresses PKA-NF-κB/CREB
  signaling, and blocks inflammatory gene expression. (B) Interneurons: CB1R reduces
  glutamate release from excitatory interneurons. CB2R activates Gi/o-PLC-IP3 pathway,
  elevating Ca2+ to promote GABA/glycine release and hyperpolarization. (C) Microglia:
  M2 phenotype releases anti-inflammatory mediators (IL-10, TGF-β) and trophic factors
  (IGF-1, BDNF), and expresses inhibitory receptors (TREM2, CD200R, CX3CR1) that suppress
  NF-κB. CB2R activation promotes anti-inflammatory cytokines (IL-4, IL-10, NGF),
  reduces IL-1β, suppresses ATP/P2X4-BDNF signaling, and downregulates CCR2/CX3CR1.
  PPAR-γ inhibits M1 polarization and suppresses AP-1, STAT, and NF-κB pathways, thereby
  reducing iNOS and MMP-9. (D) Astrocytes: A2 phenotype forms protective barriers
  and secretes neurotrophic factors (BDNF, NGF, TGF-β, IL-10). CB1R/CB2R activation
  amplifies 2-AG/AEA release, suppresses pro-inflammatory cytokines, and reduces oxidative
  stress. eCB-activated PPARs, GPR55, GPR18, and TRPV1 provide additional anti-inflammatory
  effects'
