figure_title: Schematic illustration of the hepatic amino acid metabolic network,
  integrating roles of hepatocytes, non-parenchymal cells (NPCs), and systemic regulators.
caption: Schematic illustration of the hepatic amino acid metabolic network, integrating
  roles of hepatocytes, non-parenchymal cells (NPCs), and systemic regulators. In
  hepatocytes, amino acid uptake via transporters (e.g., SLC7A2, SLC38A2) fuels catabolism
  and anabolism, regulated by RAP1A and the ASS1-AMPK axis. Key regulatory hubs include
  the mTORC1-ATF4 positive feedback loop, which coordinates amino acid flux and synthesis,
  and the GCN2-eIF2α-ATF4 pathway, activated by amino acid deprivation. NPCs, including
  hepatic stellate cells (HSCs), cholangiocytes, and endothelial cells, contribute
  via paracrine signaling and specialized metabolism. Systemic integration occurs
  via the liver-pancreas axis, where hyperaminoacidemia stimulates glucagon release,
  activating hepatic PKA signaling to enhance catabolism. Gut microbiota-derived metabolites
  modulate hepatic metabolism through cGMP-PKG and PI3K/AKT pathways. Disruption of
  this network underlies pathologies such as steatosis, chronic liver disease, and
  HCC
