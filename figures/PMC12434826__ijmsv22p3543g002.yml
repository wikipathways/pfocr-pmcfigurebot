figure_title: Metabolic abnormalities increase the level of TNF-α and also damage
  mitochondria and endothelial cells.
caption: Metabolic abnormalities increase the level of TNF-α and also damage mitochondria
  and endothelial cells. Mitochondrial dysfunction leads to the production of ROS,
  activation of NLRP3 inflammasomes, increased expression of IL-1β, and then activation
  of the NF-κB pathway. These mitochondria-mediated responses, concurrent with the
  increased levels of TNF-α and MCP-1, lead to injury of tubular epithelial cells
  and accelerated progression of CKD
