figure_title: The cGAS-STING pathway
caption: Upon detection of pathogenic, cGAS synthesizes 2’3’-cGAMP from ATP and GTP.
  2’3’-cGAMP binds STING in the endoplasmic reticulum and triggers ER-Golgi trafficking
  of STING. At the Golgi, STING recruits TBK1, which triggers phosphorylation of itself
  and STING. This activates the IRF3 and/or NF-κB, leading to the production of type
  I interferons and pro/anti-inflammatory cytokines. Interferons bind their cognate
  receptor to activate ISGs through the JAK-STAT pathway. Created in BioRender. Nelson,
  T. (2026) https://BioRender.com/7dwbe6o
