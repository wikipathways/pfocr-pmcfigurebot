figure_title: SARS-CoV-2-induced remodeling, senescence/inflammation, and repair in
  human bronchial epithelial cell cultures
caption: (A) Ciliated cell quantification with infection. (Ai) Morphometric measurement
  of ciliation [cilia-covered apical surface/basement membrane (BM); measurement designated
  nCilia BM on axis label] for mock and SARS-CoV-2-infected HBE cultures at 3 and
  14 dpi. (Aii) nCilia BM vs. median multi-ciliated cell gene expression pathway at
  14 dpi. Mock HBE slope = 0.286 (SE 0.047), SARS-CoV-2-infected slope = 0.086 (SE
  0.011) (delta = 0.176, SE = 0.043, p < 0.00027). Shaded areas represent the 95%
  confidence intervals. (Aiii) Mean deuterosomal cell gene expression for mock and
  SARS-CoV-2-infected cultures over dpi. (B) Cell cycling. (Bi) Heatmap depicting
  cell cycle gene expression over time post-infection. (Bii) Box plot depicting mean
  cell cycle gene expression (transcripts per million = TPM) over time post-infection.
  (C) EGFR signaling. (Ci) Heatmap depicting EGFR signaling genes as a function of
  time post-infection. (Cii) Box plots depicting mean EGFR signaling pathway gene
  expression over time post-infection. (D) Mitochondrial encoded genes. (Di) Heatmap
  depicting mitochondrial encoded genes over time post-infection. (Dii) Box plot depicting
  mean mitochondrial gene expression over time post-infection. Statistics conducted
  and symbols as described in Figure 3 legend. Headers in Bi apply to all heatmaps
