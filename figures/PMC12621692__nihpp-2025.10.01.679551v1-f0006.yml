figure_title: Proposed model of ClC-7 regulation by PI(3,5)P2
caption: In the PIP-bound state (OFF), lipid binding creates an optimal interface
  to stabilize and anchor the ordered CyD against the TMD, with key residues highlighted.
  In the absence of PI(3,5)P2 (ON), this interface is lost and the CyD becomes disengaged
  and dynamic. Within this apo state, loss of the stabilizing interactions allows
  for the substantial movement of the critical R helix observed in the PIP-free or
  Y715C mutant structures (R1 and R2). Whereas the Q-R helix in the R1 conformation
  is similar to the PIP-bound, inactive structure, in the R2 conformation the ion
  transport pathway becomes much more solvent-accessible. These two conformations
  may represent steps along the gating or the transport pathway
article_title: Mechanism of phosphoinositide regulation of lysosomal pH via inhibition
  of CLC-7
