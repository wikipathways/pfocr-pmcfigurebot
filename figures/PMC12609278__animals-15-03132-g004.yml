figure_title: Explain the mechanism of action of different biomarkers.
caption: 'Explain the mechanism of action of different biomarkers. (a) In non-alcoholic
  fatty liver disease (NAFLD), hepatocyte membrane compromise leads to the release
  of alanine aminotransferase (ALT) into the bloodstream. Elevated serum ALT serves
  as a biomarker for liver damage. (b) BRCA1/BRCA2: These genes encode proteins critical
  for DNA double-strand break repair via homologous recombination. Loss-of-function
  mutations in BRCA1 or BRCA2 impair this repair pathway, leading to genomic instability
  and increased cancer risk. (c) Integrated AD biomarkers: Alzheimer’s disease diagnosis
  employs an integrated approach. MRI detects structural brain changes. Cerebrospinal
  fluid (CSF) analysis measures altered levels of amyloid-beta and phosphorylated
  tau proteins. Genetic testing identifies risk alleles, such as in the APOE gene.
  (d) HbA1c: Hemoglobin A1c is formed through the non-enzymatic glycation of hemoglobin
  in red blood cells. Its concentration reflects average blood glucose levels over
  the preceding 2–3 months, making it a stable biomarker for long-term glycemic control
  in diabetes'
