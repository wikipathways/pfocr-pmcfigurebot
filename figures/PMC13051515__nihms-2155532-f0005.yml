figure_title: SPP1hi macrophage SSc vs control analysis.
caption: SPP1hi macrophage SSc vs control analysis.(A) Gene expression of myeloid
  cell type markers. (B) SSc SPP1hi macrophages vs control SPP1hi macrophages differentially
  accessible regions with labelling of select DARs and the nearest annotated gene.
  (C) Pathway enrichment analysis of chromatin regions more accessible in SSc vs control
  SPP1hi macrophages. (D) TF motifs enriched in SSc SPP1hi macrophages vs control
  SPP1hiMacrophages, ranked by absolute value of average difference and separated
  into positively and negatively enriched. The final column notes the number of TFs
  in the same class/family present in the top 100. (E) Plot of pseudobulk-enriched
  peaks differentially accessible in SSc SPP1hi macrophages. bHLH, basic helix-loop-helix;
  CS, contribution score; DAR, differentially accessible chromatin region; SSc, systemic
  sclerosis-associated; TF, transcription factor
