figure_title: Dysferlin pathway proteins and wildtype AD proteins in the SG and neural
  elements.
caption: Dysferlin pathway proteins and wildtype AD proteins in the SG and neural
  elements. (A1) Low-magnification image of dysferlin (Hamlet, red, long arrow); (A2)
  BACE1 (green); (A3) dysferlin and BACE1 were in close association in nerve fibers
  approaching the habenula perforata (asterisk) and in the SG (two asterisks); scale
  bar = 5 µm for (A1–A3). (B) Low-magnification image of BACE1 (green) and FKBP8 (blue),
  which were closely aligned in nerve fibers (*), approaching the habenula perforata
  (asterisk); scale bar = 20 µm. (C) Dysferlin (red, Hamlet) and FKBP8 (light blue)
  on SG type I cell bodies; scale bar = 10 µm. (D) BACE1 (green), FKBP8 (blue) RYR
  (red, pan antibody). Arrows points to close association of FKBP8 (blue) and BACE1
  (green) in circular mitochondria-like structures in type I cell bodies of the SG;
  scale bar = 10 µm. (E1) PSEN1 (green; ABclonal 2187) on plasma membranes of type
  I cell bodies in SG and TAU (red) in interiors of type I cell bodies; scale bar
  = 10 µm. (E2) TAU (red) aligned with FKBP8 (blue) in interiors of type I SG cell
  bodies but not on plasma membranes with PSEN1; scale bar = 10 µm. (F1) RYR receptor
  (pan antibody, red) and (F2) PSEN1 (green; ABclonal 2187) on plasma membranes of
  type I cell bodies (arrows) extending inward (short arrows) and (F3) in close association
  with RYR (yellow); scale bar = 5 µm for (F1–F3). The Manders coefficient was 0.97
  (Volocity 7.0.0 software). (G) RYR3 (green). (H) RYR3 aligned with FKBP8; scale
  bar = 10 µm for (G,H). (I) RYR3 (green) and FKBP8 (blue); scale bar = 5 µm. Lines
  of RYR3 IR extend inward from the plasma membrane (small arrows), similarly to IR
  with the pan RYR antibody (F1)
