figure_title: A) Scatter plot displaying the Log2 fold change of the common differentially
  expressed genes contrasted from non-hypertensive controls to hypertension (gHTN
  or cHTN) in x axis, or to preeclampsia (PE or siPE) in y-axis.
caption: 'A) Scatter plot displaying the Log2 fold change of the common differentially
  expressed genes contrasted from non-hypertensive controls to hypertension (gHTN
  or cHTN) in x axis, or to preeclampsia (PE or siPE) in y-axis. Pink shaded area
  indicates higher gene expression in hypertension subgroup compared to preeclampsia
  subgroup. B) Box plots showing the significantly different GSVA MSigDB hallmark
  gene sets between normal (non-hypertensive control), gHTN, and PE, and C) between
  normal (non-hypertensive control), cHTN, and siPE. Line within box represents median,
  “X” mark indicates the mean, top and bottom of box indicate interquartile rage with
  the bottom and top edge marking the first and third quartiles respectively. Pathways
  shown here are common pathways between B) and C). Other pathways are listed in Supplementary
  Figure 2. Normal vs. gHTN: Mann-Whitney U test was used for allograft rejection,
  coagulation, IL6 JAK STAT3 signaling, inflammatory response, IFNα response, IFNγ
  response, UV response down, hypoxia, bile acid metabolism, KRAS signaling down,
  TNFA signaling via NFκB, and Wnt/β-catenin signaling; t-test was used for p53 pathway,
  based on the data distribution. Normal vs. PE: Mann-Whitney U test was used for
  allograft rejection, coagulation, IL6 JAK STAT3 signaling, inflammatory response,
  IFNα response, IFNγ response, UV response down, hypoxia, bile acid metabolism, KRAS
  signaling down, TNFα signaling via NFκB, and Wnt/β-catenin signaling; t-test was
  used for p53 pathway, and UV response up, based on the data distribution. gHTN vs
  PE: Mann-Whitney U test was used for allograft rejection, inflammatory response,
  IFNα response, IFNγ response, UV response down, hypoxia, and Wnt/β-catenin signaling;
  t-test was used for coagulation, IL6 JAK STAT3 signaling, p53 pathway, bile acid
  metabolism, KRAS signaling down, and TNFA signaling via NFκB, based on the data
  distribution. Normal vs. cHTN: Mann-Whitney U test was used for allograft rejection,
  coagulation, IL6 JAK STAT3 signaling, inflammatory response, IFNα response, IFNγ
  response, UV response down, hypoxia, bile acid metabolism, KRAS signaling down,
  TNFα signaling via NFκB, and Wnt/β-catenin signaling; t-test was used for p53 pathway,
  based on the data distribution. Normal vs. siPE: Mann-Whitney U test was used for
  allograft rejection, coagulation, IL6 JAK STAT3 signaling, inflammatory response,
  IFNα response, IFNγ response, UV response down, hypoxia, bile acid metabolism, KRAS
  signaling down, TNFα signaling via NFκB, and Wnt/β-catenin signaling; t-test was
  used for up p53 pathway, based on the data distribution. cHTN vs siPE: Mann-Whitney
  U test was used for allograft rejection, IL6 JAK STAT3 signaling; t-test was used
  for coagulation, inflammatory response, IFNα response, IFNγ response, UV response
  down, hypoxia, p53 pathway, bile acid metabolism, KRAS signaling down, TNFα signaling
  via NFκB, and Wnt/β-catenin signaling, based on the data distribution. *p<0.05,
  **p<0.01, ***p<0.001'
