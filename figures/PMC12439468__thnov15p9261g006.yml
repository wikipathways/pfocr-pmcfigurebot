figure_title: CircNFIB Promotes PNI by Activating the ERK/MAPK Axis in PDAC.
caption: CircNFIB Promotes PNI by Activating the ERK/MAPK Axis in PDAC. (A) Volcano
  plot of differentially expressed genes between circNFIB-overexpressing and control
  groups. (B) KEGG pathway enrichment analysis of differentially expressed genes between
  circNFIB-overexpressing and control groups. (C) Western blotting analysis of MAPK
  signaling pathway-related genes in PDAC cells upon circNFIB knockdown or overexpression.
  (D) Western blot analysis of p-ERK and t-ERK levels in PANC-1 cells upon circNFIB
  and L1CAM modulation. (E) Western blot analysis of p-ERK and t-ERK levels in PANC-1
  cells following SCH772984 treatment. (F) Representative Matrigel/DRG images and
  quantification of neural invasion and growth ability in designated PANC-1 cells.
  (G) Representative DRG Matrix images and quantification of neural invasion ability
  in designated PANC-1 cells. (H) Representative images and quantification of Transwell
  migration and Matrigel invasion assays in designated PANC-1 cells. Scale bar = 100
  μm. (I) Representative images and quantification of the neural adhesion assay using
  the indicated PANC-1 cells, showing the cell-nerve adhesion capacity. Statistical
  differences in F, G, H, and I were analyzed using one-way ANOVA followed by Dunnett's
  test. Error bars represent SD from three independent experiments. *p < 0.05, **p
  < 0.01
