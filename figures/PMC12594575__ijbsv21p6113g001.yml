figure_title: Global Gsdme knockout prevents DIC.
caption: |-
  Global Gsdme knockout prevents DIC. A, Diagram of the experimental design for the establishment of a chronic doxorubicin-induced cardiotoxicity (DIC) mouse model. B, Western blot and quantitative analysis of full-length GSDME (GSDME-F) and cleaved N-terminal GSDME (GSDME-N) in the hearts of DOX-treated WT mice at the indicated times (days 0, 3, 10, 14, 28, 42, and 49); n = 6 per group. C, heart weight (HW) normalized to tibia length (TL); n = 6 per group. D, Representative hematoxylin and eosin (H&E) staining of WT or Gsdme-/-
  murine hearts on day 49 after DOX treatment. Scale bar = 1000 μm. E, Representative wheat germ agglutinin (WGA) staining and quantification of the cardiomyocyte cross-sectional area of WT or Gsdme-/- murine hearts on day 49 after DOX treatment. Scale bar = 20 μm; n = 6 per group. F, Representative left ventricular M-mode images and echocardiographic measurements of the ejection fraction (EF) and fractional shortening (FS) of WT or Gsdme-/- mice on day 49 after DOX treatment; n = 6 per group. G, Representative Masson's trichrome staining and relative quantification of the myocardial fibrosis area in WT or Gsdme-/- murine hearts on day 49 after DOX treatment. Scale bar = 50 μm; n = 6 per group. H, Representative immunoblot images and densitometric analysis of collagen I, collagen III, α-SMA, and TGF-β/SMAD2/SMAD3 pathway-associated proteins in heart tissues from WT or Gsdme-/- mice on day 49 after DOX treatment; n = 6 per group. *P < 0.05, **P < 0.01, ***P < 0.001
article_title: Cardiomyocyte GSDME Drives Doxorubicin-Induced Cardiotoxicity by Targeting
  the CCL2-CCR2 Axis
