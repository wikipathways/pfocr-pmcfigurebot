figure_title: Comparative GO and KEGG enrichment analysis of differentially expressed
  genes across miR-133 isoforms.
caption: 'Comparative GO and KEGG enrichment analysis of differentially expressed
  genes across miR-133 isoforms. The upper panel presents a merged visualization of
  enriched GO categories (BP: Biological Process, CC: Cellular Component, MF: Molecular
  Function) combining data from all three miR-133 isoforms in a single integrated
  bar plot. The lower panel displays KEGG pathway enrichment analysis. Bar plots show
  enrichment in SW48-KI133A1 (red/pink bars), SW48-KI133A2 (blue/light blue bars),
  and SW48-KI133B (dark blue/yellow bars) compared with parental SW48 controls. For
  each isoform, darker-colored bars represent downregulated gene sets and lighter-colored
  bars represent upregulated gene sets. Bars are grouped by functional category to
  facilitate direct comparison across the three isoforms. The side-by-side presentation
  reveals highly convergent enrichment patterns across all three miR-133 isoforms,
  with consistent regulation of cell proliferation, metal ion homeostasis, extracellular
  components, protein binding functions, and cancer-associated signaling pathways'
