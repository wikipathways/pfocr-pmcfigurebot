figure_title: The GABA pathway.
caption: The GABA pathway. Glutamine (Gln) is released by the astrocyte via SNAT3
  transporter and is further imported by SNAT1/2 into the GABAergic neuron, where
  it is metabolized to glutamic acid (Glu) by glutaminases GLS1/2. GAD67/65 converts
  Glu into GABA (pink polygons), which is then loaded into the SV by VGAT, trafficked
  to the presynaptic membrane, and released into the synaptic cleft. Once released,
  GABA interacts with its receptors GABAAR and GABABR, activating Cl– (orange circles)
  influx by the former, and modulating the activity of the potassium and calcium channels
  associated with the latter, increasing K+ (green circles) efflux and decreasing
  Ca2+ (red circles) influx; this, in turn, results in the postsynaptic membrane hyperpolarization.
  The excess of GABA is taken up by the astrocyte via GAT1 (or GAT3), which simultaneously
  translocates 2 Na+ ions (light-blue circles) and one Cl– ion. In the astrocyte,
  GABA is sequentially catabolized by GABA transaminase ABAT and SSA dehydrogenase
  SSADH into succinic acid, which further enters the Krebs cycle, where it is processed
  into α-ketoglutarate, the precursor of Glu and Gln
