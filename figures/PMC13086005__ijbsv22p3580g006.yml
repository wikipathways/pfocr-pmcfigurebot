figure_title: Targeting ERBB3 to suppress LCBM in vitro and in vivo.
caption: Targeting ERBB3 to suppress LCBM in vitro and in vivo. (A) The effect of
  Elgemtumab on cell proliferation was investigated using CCK-8 assay. (B-C) The invasion
  function of H2030-BM and PC9-BM was evaluated by transwell assay. (D-E) The expression
  of PI3K-Akt-mTOR pathway proteins was detected using western blotting. (F-H) Intracellular
  copper ion enrichment was detected in H2030-BM and PC9-BM. (I) The expression of
  PI3K-Akt-mTOR pathway proteins was detected using western blotting. (J) Brain metastases
  were determined by bioluminescence imaging. (K) Brain sections were stained by H&E.
  All experiments were repeated three times (* p < 0.05, ** p < 0.01, *** p < 0.001,
  ns > 0.05)
article_title: Oligodendrocyte-secreted ERBB3 Mediates the Competitive Uptake of Copper
