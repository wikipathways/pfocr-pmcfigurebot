caption: Key genes and proteins in the Wnt signaling pathway and other signaling pathways
  were verified via qRT-PCR and Western blot. (A,B) mRNA expression levels of c-Myc,
  FZD7, FZD8, ID4, TRAF2, PPP1R13L and LRP5 were significantly up-regulated after
  AP intervention. (C–F) ZEN-induced suppression of LRP5, iASPP, and TRAF2 protein
  expression was alleviated by AP. The β-actin of 3E and 7J is the same because they
  are derived from the same PVDF membrane. Data are presented as mean ± SEM from three
  independent experiments (n = 3). * p < 0.05, ** p < 0.01, **** p < 0.0001
