figure_title: Distinct ribonucleoprotein complexes are formed with nucleolar-associated
  EU-RNA and HSATII RNA aggregates
caption: '(A) Biological process pathway analysis of DUX4-induced stable EU-RNA associated
  RNPs (EU-RNPs) proteomics filtered protein hits (>2 unique peptide matches and >1.5
  difference) ran through Enrichr. EU-RNP complexes were isolated from −DOX+EU, +DOX+EU
  or +DOX-EU iDUX4 cells harvested at the 48-hour time point using the “RICK” approach
  (Bao et al., 2018). Protein was purified from isolated EU-RNP complexes and was
  subjected to mass-spectrometry. Proteomics was performed in experimental duplicates.
  (B) Validation of selected proteins identified through EU-RNP proteomics: Known
  DUX4-induced protein aggregates SC35 and TDP-43, and m5C-related factors NSUN2 and
  YBX-1. Proteins were isolated as stated in Fig. 2A. GAPDH and beta-tubulin were
  used as loading controls for inputs and negative controls for pulldown samples.
  5% input was removed prior to RNA pulldown. N=1 per condition. A total of three
  independent experimental replicates were performed. −D+E, −DOX+EU samples; +D+E,
  +DOX+EU samples; +D-E, +DOX-EU samples. Quantification of immunoblot is shown right.
  (C) Immunofluorescence of EU-RNA (green) and SC35 (magenta) in −DOX+EU or +DOX+EU
  iDUX4 cells fixed at 48-hour time point. Scale bar = 20μm. Images are representative
  of two independent experimental replicates performed. (D) Mean signal intensity
  of SC35 within specified regions of interest (ROI) in the nucleus: either within
  EU-RNA foci or the remainder of the nucleoplasm in +DOX EU-RNA+ nuclei in iDUX4
  cells. Dots are each individual ROI. ROI within the nucleoplasm is drawn with relatively
  the same circumference as EU-RNA foci ROI. N= 50 ROI. A total of two independent
  experimental replicates were performed. Data represent means. Statistical differences
  between groups were analyzed employing Mann Whitney test. (E) Combined immunofluorescence
  and HSATII RNA-FISH of HSATII (green) and SC35 (magenta) in −DOX or +DOX iDUX4 cells
  fixed at 24-hour time point. Scale bar = 20μm. Images are representative of two
  independent experimental replicates performed. (F) Mean signal intensity of SC35
  within specified ROI in the nucleus: either within HSATII RNA foci or the remainder
  of the nucleoplasm in +DOX HSATII+ nuclei in iDUX4 cells. Dots are each individual
  ROI. ROI within the nucleoplasm is drawn with relatively the same circumference
  as HSATII RNA foci ROI. N= 35 ROI. A total of two independent experimental replicates
  were performed. Data represent means. (G) Immunofluorescence of EU-RNA (green) and
  TDP-43 (magenta) in −DOX+EU or +DOX+EU iDUX4 cells fixed at 48-hour time point.
  Scale bar = 20μm. Images are representative of two independent experimental replicates
  performed. (H) Mean signal intensity of TDP-43 within specified ROI in the nucleus:
  either within EU-RNA foci or the remainder of the nucleoplasm in +DOX EU-RNA+ nuclei
  in iDUX4 cells. Dots are each individual ROI. ROI within the nucleoplasm is drawn
  with relatively the same circumference as EU-RNA foci ROI. N= 30 ROI. A total of
  two independent experimental replicates were performed. Data represent means. Statistical
  differences between groups were analyzed employing Mann Whitney test. (I) Combined
  immunofluorescence and HSATII RNA-FISH of HSATII (green) and TDP-43 (magenta) in
  −DOX or +DOX iDUX4 cells with CTRL KD or HSATII KD fixed at 24-hour time point.
  Scale bar = 20μm. Images are representative of three independent experimental replicates
  performed. (J) Mean signal intensity of TDP-43 within specified ROI in the nucleus:
  either within HSATII RNA foci or the remainder of the nucleoplasm in +DOX HSATII+
  nuclei in iDUX4 cells. Dots are each individual ROI. ROI within the nucleoplasm
  is drawn with relatively the same circumference as HSATII RNA foci ROI. N= 90 ROI.
  A total of three independent experimental replicates were performed. Data represent
  means. Statistical differences between groups were analyzed employing Mann Whitney
  test. (K) Percent of cells with TDP-43 nuclear aggregates in +DOX iDUX4 cells with
  CTRL KD or HSATII KD. N=3 experimental replicates. Minimum 200 nuclei per experiment.
  Data represent means ± SD. Statistical differences between groups were analyzed
  employing two-tailed Unpaired t-test'
