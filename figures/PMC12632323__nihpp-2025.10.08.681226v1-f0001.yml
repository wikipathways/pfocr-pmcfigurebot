figure_title: TAK1 is activated in the epithelial compartment of PDAC and is associated
  with T cell dysfunction
caption: '(A) Schematic of human PDAC scRNAseq from 3 datasets, merged and analyzed
  with R Seurat. (B) UMAP plot scRNAseq data from human PDAC tumors showing 8 different
  cell clusters. (C) Heatmap of epithelial cells of PDAC, GSEA datasets: Hallmark
  (H), Reactome (R), and WikiPathways (W). (D) Representative multiplex IHC images
  of a human PDAC TMA with high and low TGF-β staining (yellow) and a correlation
  plot with CD8a (magenta). (E) Schematic showing isolation and co-culture of OT-NG
  CD8+ T cells from the spleens of double-transgenic OT-1; Nur77-GFP (OT-NG) mice
  and KPPC-ova cells. (F) Normalized Annexin V NIR area of TGF-β pathway inhibitors
  as indicated time (N=5/group). (G) Representative multiplex IHC images and heatmap
  of % colocalization of phospho-TAK1 (T187, red) with each cell-specific marker:
  CK19+ cells (green), CD163+ cells (orange), αSMA+ cells (purple), and CD8a+ cells
  (magenta) in the PDAC TMA. (H) Representative IHC images of PDAC TMA with high and
  low phospho-TAK1 (T187, red) and correlation plot with TGF-β (yellow). (I) Representative
  IHC images of PDAC TMA samples with high and low phospho-TAK1 (T187, red) CK19+
  cells (green), (J) αSMA+ cells (green), (K) CD163+ cells respectively and its correlation
  plots with CD8a+ cells (magenta). (L) Correlation plots of Hallmark TGF-β vs. T
  cell exhaustion signatures in the TCGA PDAC database from GEPIA 2. (*P < 0.05, **P
  < 0.01, ***P < 0.001; scale bars 500 or 100 μm)'
article_title: Targeting tumor-intrinsic TAK1 triggers anti-tumor immunity and sensitizes
