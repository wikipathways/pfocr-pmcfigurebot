figure_title: GSEA results of the high- and low-expression groups of SNHG25.
caption: GSEA results of the high- and low-expression groups of SNHG25. As we move
  from left to right, an ES value is calculated for each gene, and these values are
  connected to form a line. The peaks and troughs formed represent the ES values of
  the gene set phenotype. A positive ES indicates that a functional gene set is enriched
  towards the front of the ranked list, whereas a negative ES indicates that a functional
  gene set is enriched towards the end of the ranked list. The lower part represents
  the distribution of gene expression levels within that particular pathway
