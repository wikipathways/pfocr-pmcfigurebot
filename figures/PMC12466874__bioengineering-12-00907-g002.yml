figure_title: Proposed mechanism by which hylan A acts as a vehicle to transport APIs
  across the ocular epithelial barrier.
caption: Proposed mechanism by which hylan A acts as a vehicle to transport APIs across
  the ocular epithelial barrier. Hylan A strongly binds to CD44 receptors on corneal
  epithelial cells, is cleaved into intermediate-sized fragments by membrane-bound
  hyaluronidases, and these fragments are internalized and trafficked to intracellular
  compartments for further degradation. This pathway may enable the delivery of interacting
  APIs across one of the eye’s primary physiological barriers without compromising
  cellular or tissue architecture and function. Figure created with BioRender.com
