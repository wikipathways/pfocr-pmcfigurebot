figure_title: The glycogen biosynthesis pathway is enriched in gut microbes from pro-inflammatory
  environments
caption: (A) Schematic outlining the fecal RNA metatranscriptomic workflow. Fecal
  samples were classified into groups based on the extent of inflammation and risk
  of premature mortality experienced by C9orf72−/− mice in that environment (Group
  1, protective environment, red dots, Broad Institute n=1, Jackson Labs n=5; Group
  2, pro-inflammatory environment, blue dots, CWRU n=5, Harvard BRI n=5).(B) Principal
  component analysis (PCA) of bacterial taxonomic composition of fecal samples collected
  from different environments. Each dot represents fecal matter from one mouse. Group
  1 are red circles, Group 2 are blue circles. The circle size represents alpha diversity
  (Shannon index). PERMANOVA. See also Figure S2.(C) Metabolic pathways whose abundance
  differed significantly between fecal communities of Group 1 (red bars) and Group
  2 (blue bars) mice. Data shown as mean ± SD.(D) Summary of differentially abundant
  metabolic pathways identified in (C). Pathways enriched in Group 1 fecal samples
  represented by a red arrow and Group 2 fecal samples represented by blue arrows
