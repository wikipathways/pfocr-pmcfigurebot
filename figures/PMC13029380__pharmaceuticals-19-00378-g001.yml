figure_title: Comparative transcriptomic analysis of the effects of retinol and RE
  in HDFs.
caption: 'Comparative transcriptomic analysis of the effects of retinol and RE in
  HDFs. (a) PCA of whole transcriptome gene expression. (b) Volcano plot of differential
  gene expression under retinol and RE treatments. Red: up regulated genes (p < 0.05
  and log2(fold change) > 0.58); blue: down regulated genes (p < 0.05 and log2(fold
  change) < −0.58). (c) Similarity of gene expression change between retinol and RE
  treatments based on union of differentially expressed genes. Line: regression line
  with a 95% confidence interval. (d) GO comparison analysis between retinol and RE
  treatments. (e) Pathway activities under retinol and RE treatments based on IPA
  pathway analysis. Color indicates the predicted pathway activity using IPA (z-score
  shown in the table)'
