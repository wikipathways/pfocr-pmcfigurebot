figure_title: Composite overview of transcriptomic and regulatory responses in A.
caption: 'Composite overview of transcriptomic and regulatory responses in A. pernyi
  midgut following ApNPV infection. (A). Bar chart showing the count of genes significantly
  upregulated versus downregulated gene numbers. (B). Circular KEGG pathway enrichment
  plot of the top enriched pathways among the DEGs, with node size proportional to
  gene ratio and node color intensity. Qvalue is the p value adjusted for multiple
  hypothesis testing. Rich factor is the ratio of DEGs enriched in a given pathway
  to the total genes annotated to that pathway. Background auxiliary lines: 1 grid
  = 0.1 ich factor. (C). Volcano plot showing differential expression of lncRNA. (D).
  Lollipop chart showing the number of upregulated (red) and downregulated (blue)
  genes in each TF family following ApNPV induction. Family names are listed on the
  x-axis'
article_title: Integrating Full-Length and Second-Generation Transcriptomes to Elucidate
