figure_title: EpA promotes the differentiation of cytotoxic Th9 cells while reinforcing
  lineage identity
caption: (A) Volcano plot depicting differentially expressed genes between EpA-treated
  Th9 cells and controls on day 4 in vitro polarization. (B) Heatmap showing normalized
  expression of Th9-related signature genes from RNA-seq analysis. (C) Integrated
  genome tracks illustrating transcript abundance and chromatin accessibility at the
  Il9 and Ifng loci. (D) Heatmap of selected cytotoxicity-associated genes upregulated
  in EpA-treated Th9 cells. (E) GSEA revealing enrichment of the TNF signaling pathway
  in EpA-Th9 cells. (F) Representative flow cytometry and quantification of TNF-α
  expression in EpA-treated Th9 cells (mean ± SEM, n = 6). (G–I) Flow cytometric analysis
  of adoptively transferred CD45.1+ Th9 cells and endogenous T cells from spleens.
  EpA treatment increased IFN-γ+, TNF-α+, and granzyme B+ perforin+ populations among
  donor Th9 (G), endogenous CD8+ (H), and CD4+ T cells (I). Data in G–I are shown
  as mean ± SEM from n = 4 mice per group. (J and K) Kaplan-Meier survival analysis
  of patients with BLCA, SARC, and UCEC (J) and patients with melanoma and patients
  with melanoma receiving ICB therapy (K) based on the expression of canonical Th9-related
  signature genes (B) and cytotoxicity-associated genes (D) in EpA-treated Th9 cells.
  Statistical significance was determined using 2-tailed unpaired Student’s t test
  (F–I). *P < 0.05, **P < 0.01, ****P < 0.0001
