figure_title: Gm-PBM intervention reveals potential mechanisms for ameliorating AD
  pathology through reshaping the fecal metabolome.
caption: |-
  Gm-PBM intervention reveals potential mechanisms for ameliorating AD pathology through reshaping the fecal metabolome. (A–C) Heatmaps of differential fecal metabolites (Z-score scale; mean ± SD, n = 3 per group): (A) WT vs. AD, showing significantly upregulated (red) and downregulated (blue) metabolites between groups; (B) AD vs. gm-PBM, indicating metabolite level reversal after gm-PBM intervention; (C) WT vs. gm-PBM, demonstrating that gm-PBM treatment restores the metabolome profile toward WT-like patterns. (D–F) Volcano plots of differential metabolites (x-axis: log2 Fold Change; y-axis: −log10
  p value; mean ± SD, n = 3 per group): (D) WT vs. AD: 14 metabolites significantly upregulated, 43 downregulated; (E) AD vs. gm-PBM: 63 metabolites upregulated, 99 downregulated; (F) WT vs. gm-PBM: 31 metabolites upregulated, 157 downregulated. Dashed lines represent thresholds of p = 0.05 (horizontal) and |log2FC| = 1 (vertical). (G–I) Bar plots showing KEGG Level 1 pathway classification of differential metabolites: (G) WT vs. AD; (H) AD vs. gm-PBM; (I) WT vs. gm-PBM. Bar height reflects the number of differential metabolites within each pathway. (J–L) KEGG pathway enrichment dot plots (dot size = number of differential metabolites in the pathway; color = −log10 p-value): (J) WT vs. AD; (K) AD vs. gm-PBM; (L) WT vs. gm-PBM. Metabolite screening criteria: p < 0.05, |log2FC| > 1. Statistical analysis: one-way ANOVA followed by Tukey’s post hoc multiple comparisons
