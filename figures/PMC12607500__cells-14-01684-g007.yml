figure_title: Analysis results related to calcium signaling pathways.
caption: 'Analysis results related to calcium signaling pathways. (A) Z-score normalized
  heatmap of calcium signaling-associated gene expression profiles. (B) GSEA of the
  calcium signaling pathway (ko04020) in transcriptome. (C) Expression levels of key
  calcium signaling regulators (CACNG1, Camk2b, MYLK4) validated by qRT-PCR (* p <
  0.05; n = 3). (D) Z-score normalized heatmap of calcium signaling-related protein
  expression profiles. (E) GSEA of the calcium signaling pathway (ko04020) in proteome.
  (F,G) Immunohistochemical (CACNG1) staining results of skin, the positive results
  appear brownish-yellow: (F) the positive signals (arrows) were weak and sparse in
  group W skin; (G) the skin of group C showed strong and dense positive signals.
  Epi, epidermal layer; CL, compact layer'
