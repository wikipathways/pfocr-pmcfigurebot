figure_title: Overview of the yeast SL biosynthetic and degradative pathways
caption: Key enzyme-encoding genes and lipid intermediates are shown. Ceramide is
  produced in the ER and later transported to the Golgi complex for further conversion
  to complex SLs. Myriocin is a SL synthesis inhibitor that targets the first step
  in the biosynthetic pathway. Thinner dotted lines represent reversible reactions,
  alternative routes or catabolic (degradative) pathways that feedback into earlier
  intermediates. The thick (bold) dotted lines indicates transport. Solid arrows indicate
  forward enzymatic reactions or biosynthetic steps. These are catalyzed by the enzyme(s)
  written next to the arrow. KDS, 3-ketodihydrosphingosine; DHS, dihydrosphingosine;
  PHS, phytosphingosine; IPC, inositolphosphorylceramide; MIPC, mannosyl inositolphosphorylceramide;
  M(IP2)C, mannose-(inositol-P)2-ceramide
