caption: 'The synthesis and movement of the O-glycans along the compartments of the
  Golgi apparatus to be expressed on the cell surface. The key to glycans is as follows:
  yellow square = GalNac; blue square = GlcNac; yellow circle = galactose; purple
  diamond = sialic acid; red triangle = fucose; blue triangle arrow to shown GALNT
  acting on the reaction step. The dark bold arrows indicate movement of glycans from
  Golgi compartment to another. The small arrows in the cis-Golgi show the pathway
  of UDP-GalNAc to form Tn epitope. Abbreviations: UDP—uridine diphosphate; GALNT—polypeptide
  N-acetylgalactosaminlytransferase; TGN—trans-Golgi network; C1GALT1—core 1 synthase,
  glycoprotein-N-acetylgalactosamine 3-beta-galactosyltransferase 1; COSMC—Core-1
  β1-3galactosyltransferase-specific chaperone 1; ST3Gal—ST3 beta-galactoside alpha-2,3-sialyltransferase
  1; FUT—Fucosyltransferase; GlcNAc—N-Acetylglucosamine'
