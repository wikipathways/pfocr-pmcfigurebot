figure_title: Characterization and Analysis of Mononuclear Phagocytes Subpopulations
  in Normoglycemic and Hyperglycemic States
caption: A-E. A new object was created from mononuclear phagocytes identified in Fig.
  1 and re-clustered by R/Seraut. B. Cell populations consisting of 14 distinct clusters
  are identified in the table. C. UMAP distribution of canonical lineage-defining
  markers for dendritic cells (Itgax, Cd209a, H2-Aa) and monocyte/macrophages (Fcgr2b,
  Adgre1, Csf1r). D. UMAP shows mononuclear phagocyte subclusters split by hyperglycemic
  and normoglycemic conditions, highlighting cluster (4). E. Bar graph depicting the
  percentage of identified cell population counts per cluster, highlighting changes
  in clusters 3, 4, and 5. F. Canonical Ingenuity Pathway Analysis (IPA) of differentially
  expressed genes in cluster (4) compared to all other mononuclear phagocyte clusters.
  G. Canonical IPA analysis of differentially expressed genes between normoglycemic
  and hyperglycemic phenotypes within the cluster (4)
