figure_title: Role of natural antioxidants in Alzheimer’s disease (AD).
caption: Role of natural antioxidants in Alzheimer’s disease (AD). Oxidative stress
  and mitochondrial dysfunction play central roles in AD pathogenesis. Natural antioxidants—including
  flavonoids (quercetin, EGCG, luteolin), polyphenols (resveratrol, curcumin, ferulic
  acid), terpenoids (ginsenosides, bilobalide, ursolic acid), alkaloids (huperzine
  A, berberine), and others (carotenoids, vitamins C/E, coenzyme Q10)—exert neuroprotective
  effects via multiple mechanisms. These include ROS scavenging, Nrf2/ARE pathway
  activation, anti-inflammatory signaling (↓ TNF-α, IL-1β, NF-κB), mitochondrial protection
  (ATP production, membrane stabilization), and modulation of protein aggregation
  (Aβ, tau). Neuroprotective outcomes include reduced oxidative damage, enhanced neuronal
  survival, improved synaptic plasticity, and preservation of cognitive functions.
  However, challenges such as poor blood–brain barrier penetration, low oral bioavailability,
  and rapid metabolism limit their therapeutic potential. Future strategies involve
  nanocarriers/lipid formulations, synthetic derivatives with improved stability,
  and combination therapy with other modalities. (Created in BioRender. Singh, D.
  (2025) https://BioRender.com/pzlt3uv; accessed on 29 October 2025)
