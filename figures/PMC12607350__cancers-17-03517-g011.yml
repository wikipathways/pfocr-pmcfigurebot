figure_title: The pathway of NIPP impact on tumor cells.
caption: The pathway of NIPP impact on tumor cells. During the discharge process in
  Plasma care, a significant amount of ROS is generated. These ROS enter tumor cells,
  disrupt the mitochondria within the tumor cells, and hinder the aerobic glucose
  metabolism process, leading to increased anaerobic metabolism of glucose and the
  production of a substantial amount of lactate. Additionally, this process results
  in an increase in LDH activity, while SOD remains largely unchanged. Furthermore,
  ROS also alters the cell cytoskeleton, leading to the rearrangement of the cytoskeleton,
  which subsequently affects the migration and invasive abilities of tumor cells.
  These processes are not significantly inhibited by the short-term, minor elevation
  in the expression of heat shock proteins
