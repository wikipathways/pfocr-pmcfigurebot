figure_title: Caveolae-associated eNOS signaling pathway mechanism in health and diabetes.
  Health Scenario
caption: Caveolae behaves as a physical and biological signaling hub in the cardiomyocyte
  controlling NO-mediated signaling cascades through Cav-3 (in cardiomyocyte) as eNOS
  repressor. During the muscle fiber stretching, potential conformational changes
  in Cav3 transmembrane domain (TMD) and caveolin scaffolding domain (CSD) results
  in the release of eNOS. In addition, the transient increase in intracellular Ca2+
  concentration (partially mediated by Cav1.2, also controlled by Cav-3) activates
  the Ca2+-Calmodulin complex, an allosteric competitor of Cav-3-eNOS complex, promoting
  eNOS dislocation and its subsequent activation. NO inhibits mitochondrial complex
  IV leading to a reduction in O2 consumption, oxidative phosphorylation, and ATP
  synthesis. In addition, NO inhibits Cav1.2 channel and attenuates b1-Adrenergic
  receptor-mediated Cav1.2 activation, reducing [Ca2+]I, resulting in a final effect
  of sarcomere relaxation. Diabetes Scenario 1. Diabetes impairs Cav-3 caveolar localization,
  altering caveolae ultrastructure, stability, and cholesterol and Cav3 content, impairing
  cardiomyocyte Cav-3-dependent signaling, like Cav1.2 inward Ca2+ currents modulation.
  Caveolae cholesterol content reduction increases molecular freedom degrees, triggering
  Cav-3 conformational changes that release eNOS, leaving it in a constant active
  state that will produce a persistent sarcomere relaxed state and poor contractility
  force, compromising the cardiac function. Diabetes Scenario 2. Diabetes results
  in Cav-3 localization shift from caveolae to non-caveolar cardiomyocyte membrane.
  Non-caveolar Cav-3 localization presents significant biophysical differences compared
  with caveolae, together with a different signaling molecules and receptors landscape.
  This condition may favor Cav-3-eNOS complexes, inhibiting NO signaling in the diabetic
  cardiomyocyte. In the absence of NO relaxation signal and impaired Cav-3-Integrin
  b1D mechanotransduction system, the sarcomere contraction force opposes the cardiomyocyte
  stretching, producing fiber damage (113, 114, 262–265)
