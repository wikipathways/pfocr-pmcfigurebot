figure_title: A K+-deficient diet for 2 weeks alters kidney Ca2+ and Pi handling proteins
caption: (A) Study 1. Experimental overview where mice were fed a control diet containing
  1% K+ (1K+) or a diet deficient in K+ (0K+) for 2 weeks. Created in BioRender. (B)
  Plasma concentrations of sodium (Na+), potassium (K+), chloride (Cl–), total calcium
  (Ca2+), phosphate (Pi), PTH, and VitD [1,25(OH)2D or calcitriol]. (C) Urinary fractional
  excretion of same ions, creatine clearance, and daily aldosterone excretion. Each
  data point arises from an individual mouse and the data are shown as mean ± SEM.
  Statistical analyses were performed using a Student’s unpaired t test and annotations
  represent the level of significance. (D) Kidney samples were examined using quantitative
  proteomics. The volcano plot shows the distribution of all quantifiable proteins.
  The x axis is the log2 ratio between 1K+ and 0K+ diets, while the y axis represents
  the significance level of the ratio. Significantly changed proteins were defined
  using a Benjamini-Hochberg FDR of 5%. Proteins (genes names shown) highlighted in
  blue are examples of proteins involved in Ca2+ handling, proteins in green are involved
  in Pi handling, and red means involvement in both. (E) Ingenuity pathway analysis
  on significantly changed proteins. Lower x axis is the ratio of proteins (genes)
  that are involved in this pathway versus the total input, while upper x axis is
  the significance level determined by Fisher’s exact test. Color of bars represent
  either promotion (positive z score) or inhibition (negative z score) of the pathway.
  Canonical pathways under the category “Intracellular and Second Messenger Signaling”
  were plotted with a cutoff of 0.5 on both minus log(P value by Fisher’s exact test)
  and absolute value of z score
