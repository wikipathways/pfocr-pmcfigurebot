caption: Isoquercitrin (IQ)-induced melanogenesis via the p38 and protein kinase A/cyclic
  AMP response element-binding protein (CREB) pathways, validated using SB203580 (SB),
  H89, and forskolin (FSK). B16F10 melanoma cells were cotreated with 30 μM IQ and
  pathway modulators (SB, 20 μM; H89, 10 μM; FSK, 10 μM). Each experiment was repeated
  at least three times. (A) Tyrosinase activity assay. Data are presented as mean±standard
  deviation; †p<0.05 vs. control cells; *p<0.05 vs. IQ-treated cells. (B) Immunofluorescence
  analysis of tyrosinase expression. (C) Western blot analysis of protein expression
  following 3 hours of pretreatment with inhibitors/activators and subsequent 24 hours
  of IQ treatment. (D) SB (10, 20, 30 μM) pretreatment for 3 hours followed by 24
  hours of IQ treatment. (E) H89 (5, 10, 20 μM) pretreatment for 3 hours followed
  by 24 hours of IQ treatment. (F) FSK (5, 10, 20 μM) pretreatment for 3 hours followed
  by 24 hours of IQ treatment. GAPDH, glyceraldehyde-3-phosphate dehydrogenase
