figure_title: 'Attenuation of inflammation, apoptosis, and signaling pathway in eugenol-mediated
  protective effects against ischemia-reperfusion injury: Eugenol administration during
  ischemic conditions activates PI3/Akt signaling and results in preservation of mitochondrial
  membrane potential (MMP), which reduces the level of oxidative stress in the cells.
  The reduction in oxidative stress curbed the activation of inducible nitric oxide
  synthase (iNOS) and limited the production of NO and TNF-α. The reduction in TNF-α
  further failed to activate NF-κB, which led to reduced production of IL-6 and TNF-α.
  TNF-α reduction also reduced BAX activation and resulted in a reduction of apoptosis.
  The preservation of MMP reduced the level of caspase-3, Poly (ADP-ribose) and led
  to an overall reduction in apoptosis'
