caption: Causal pathway diagrams of LINC (Leveraging Informatics for MASLD Care) implementation
  strategies developed from lessons learned from failed implementation in weight management
  context. Figure A is for electronic medical record (EMR)-integrated clinical decision
  support and reminder, Figure B clinical champion, and Figure C provider education.
  The blue is the components of the stem based on causal logic in planning LINC. Purple
  are proximal outcomes identified during the pilot. Green are the leaves added based
  on post-implementation evaluation in the weight management clinic, including from
  qualitative interviews and additional insights from team debrief. The distal outcome
  is adoption of MASLD risk stratification, defined as ordering of vibration-controlled
  transient elastography (VCTE) or hepatology referral
