caption: 'Comparative proteomic analysis reveals Aaubp14-mediated regulation of pathogenicity-related
  proteins. (A) Volcano plot analysis of DEPs between wild-type (Z7) and ΔAaubp14
  mutant. Blue: downregulated DEPs; purple: upregulated DEPs; gray: non-differentially
  expressed proteins. (B) GO terms of DEPs between Z7 and ΔAaubp14. (C) KEGG pathway
  enrichment analysis of DEPs between Z7 and ΔAaubp14. (D) Upset plot showing the
  overlap between DEPs in ΔAaubp14 and Z7 and hyper-ubiquitinated proteins in ΔAaubp14.
  Blue dots indicate sets participating in each intersection, gray dots represent
  sets not involved in the specific intersection. Dot size reflects intersection size.
  (E) Heatmap comparing proteomic and SLN results of randomly selected 20 DEPs in
  ΔAaubp14 and Z7. (F) Scatter plot depicting the correlation of DEPs abundance ratios
  between proteomic and PRM analyses. The blue dots represent individual data points
  of DEPs. The purple regression line and shaded confidence interval highlight the
  linear relationship. (G) Protein–protein interaction network of DEPs related to
  virulence. Red circles indicate hyper-ubiquitinated in ΔAaubp14. (H) Expression
  profiles of known pathogenicity-related proteins in Z7 and ΔAaubp14'
