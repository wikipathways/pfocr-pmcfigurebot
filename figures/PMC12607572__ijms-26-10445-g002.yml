figure_title: Molecular and cellular mechanisms linking hypertrophic adipocytes to
  systemic metaflammation and insulin resistance.
caption: Molecular and cellular mechanisms linking hypertrophic adipocytes to systemic
  metaflammation and insulin resistance. Enlarged adipocytes release free fatty acids
  (FFAs), cholesterol crystals, danger-associated molecular patterns (DAMPs), and
  pro-inflammatory cytokines/chemokines such as TNF-α and MCP-1. These mediators recruit
  macrophages, which polarise toward a pro-inflammatory M1 phenotype. Within both
  adipocytes and macrophages, the activation of the NLRP3 inflammasome and caspase-1
  leads to the secretion of IL-1β and IL-18, thereby amplifying local and systemic
  inflammation in a vicious cycle. The released cytokines activate downstream intracellular
  signalling cascades in metabolic tissues (liver, skeletal muscle, pancreas), including
  NF-kB, JNK, IKK, PKR, JAK/STAT, which impair insulin receptor substrate-1 (IRS-1)
  activity, reduce AKT/PI3K pathway signalling, and block GLUT4 translocation. The
  cumulative effect results in insulin resistance, hyperglycaemia, and dyslipidemia,
  promoting progression toward type 2 diabetes mellitus (T2DM), non-alcoholic fatty
  liver disease (NAFLD), and cardiovascular disease (CVD)
