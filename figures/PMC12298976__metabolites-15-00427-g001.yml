figure_title: The scheme depicts the biochemical pathway of Gaucher Disease (GD).
caption: The scheme depicts the biochemical pathway of Gaucher Disease (GD). Enzymatic
  deficiency responsible for GD is marked in red. Eliglustat (marked in blue color)
  is a potent and specific inhibitor of the enzyme glucosylceramide synthetase (GCS)
  and acts as a substrate reduction therapy (SRT). SRT reduces the synthesis of glucosylceramide
  (also known as GL-1 or GB-1 or GlcCer)—the main substrate of β-glucocerebrosidase
  (GCase)—by inhibiting GCS and thus preventing the accumulation of GL-1. Beyond GL-1,
  several additional lipids accumulate in GD patients. One of these is the deacylated
  form of GL-1, glucosylsphingosine (also referred to as GlcSph, Lyso-GL1, or Lyso-Gb1),
  a reliable biomarker for evaluating disease severity and monitoring treatment efficacy
article_title: 'Increased Lyso-Gb1 Levels in an Obese Splenectomized Gaucher Disease
  Type 1 Patient Treated with Eliglustat: Unacknowledged Poor Compliance or Underlying
