figure_title: Schematic diagram illustrating CB1R-mediated regulation of calcium-induced
  mitophagy and its role in promoting nerve regeneration.
caption: 'Schematic diagram illustrating CB1R-mediated regulation of calcium-induced
  mitophagy and its role in promoting nerve regeneration. Following peripheral nerve
  injury, nerve tissue analysis revealed a moderate increase in extracellular calcium
  concentration within the injured microenvironment, accompanied by upregulation of
  CB1R expression (top left). Overall, CB1R-mediated regulation of calcium-dependent
  mitophagy plays a key role in promoting peripheral nerve regeneration (middle left).
  In addition, the CB1R antagonist JD5037 mimics the effects of genetic deletion and
  exhibits significant neuroregenerative potential in both sciatic nerve crush (SNC)
  and optic nerve crush (ONC) models, suggesting promising translational value (bottom
  left). Mechanistically (right): In control mice (Cnr1-ctrl), CB1R is upregulated
  in Schwann cells after injury, suppressing calcium channel opening and limiting
  extracellular Ca2+ influx. This inhibition impairs Ca2+-dependent mitophagy, leading
  to the accumulation of damaged mitochondria, reduced Schwann cell repair capacity,
  and delayed axonal regeneration. In contrast, in CB1R-deficient mice (Cnr1-cKO),
  the absence of CB1R removes the inhibitory effect on calcium channels, allowing
  extracellular Ca2+ to enter Schwann cells. Concurrently, CB1R deletion enhances
  ANT2 expression, which activates mitophagy by PINK1/Parkin pathway, thereby efficiently
  clearing dysfunctional mitochondria in Schwann cells and accelerating axonal regeneration'
article_title: Targeting CB1R Rewires Ca2+-Dependent Mitophagy to Promote Nerve Regeneration
