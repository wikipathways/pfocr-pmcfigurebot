figure_title: Validation of malignant cell-intrinsic MHC-II expression across multi-omics
  platforms
caption: 'A. Heatmap of MHC-II gene expression in PDAC cell lines from the CCLE. B.
  Visualization of cell type annotations mapped to Visium spots, inferred by the RDCT
  deconvolution algorithm. C. Spatial distribution of key MHC-II-related genes (CD74,
  HLA-DRA, HLA-DPB1, HLA-DPA1, HLA-DRB1 and HLA-DMB) expression within malignant cell
  spots in Visium samples, demonstrating variation in MHC-II pathway activation across
  the tumor microenvironment. D. Cell-type resolved spatial maps of two tumor samples
  profiled by Xenium in situ platform: a Stage IIB, Grade 3 tumor (left) and a Grade
  I–II tumor with ~50% malignant content (right). E. Spatial gene expression heatmaps
  of CD74 (left) and HLA-DQB2 (right) in malignant regions from the corresponding
  tumor sections in (D). F. mIHC analysis of HLA-II expression in PDAC tissues: Representative
  images showing DAPI (nuclear stain, blue), cytokeratin (CK; epithelial marker, magenta),
  and HLA-DR (MHC-II marker, yellow) expression. Malignant cells co-staining for HLA-DR
  and CK indicate MHC-II-positive malignant cells. G. Boxplot illustrating comparison
  of MHC-II pathway activity between T-cellhigh and T-celllow regions. H. Heatmap
  of key MHC-II-related genes expression in malignant clonal cells sorted via flow
  cytometry from the KPC mouse model from Li et al25. Samples with red or blue color
  indicate clones used in subsequent studies'
article_title: Tumor-intrinsic MHC-II activation in pancreatic ductal adenocarcinoma
  enhances immune response and treatment efficacy
