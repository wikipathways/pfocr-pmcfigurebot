figure_title: Transcriptomic divergence across disease etiologies
caption: (A) Heatmap illustrating the number of differentially upregulated DUGs identified
  in each disease state, categorized by cell type. NA indicates that no analysis was
  performed due to insufficient sample size. (B) Box plots depicting the expression
  levels of selected DUGs across epithelial (AT2), endothelial, stromal (AlvF and
  AdvF), and immune (CD4T) compartments. Each dot represents an individual, with colors
  indicating the same dataset. Box plots show the interquartile range, median (line),
  and minimum and maximum (whiskers). CPM, counts per million. (C) Protein-protein
  interaction (PPI) network for DUGs in AT2 cells across IPF, COVID-19, and COPD.
  Genes involved in KRAS signaling in IPF are highlighted in red, genes in the G2M
  checkpoint pathway in COVID-19 in green, and genes in the allograft rejection pathway
  in COPD in orange. Genes without interactions or not part of signaling pathways
  are excluded. (D) Violin plot comparing expression levels of 3 representative genes
  across disease etiologies in pairwise comparisons. Violin plots show the full distribution
  of the data, with the width representing the density of values
