figure_title: Shed NLGN3 treatment augments ADAM10-dependent CSPG4 cleavage
caption: 'a. Workflow depicting treatment of glioma cells or OPCs for 1 hour with
  recombinant NLGN3 ectodomains (to mimic naturally shed NLGN3) followed by conditioned
  medium (CM) concentration and western blot to detect shedding of CSPG4.b.Left: CSPG4
  Western blot from diffuse intrinsic pontine glioma model SU-DIPG13 conditioned medium
  after exposure to 100 nM sNLGN3 for 1-hour in the presence or absence of 5 uM ADAM10
  inhibitor. CSPG4 exists as a ‘part-time’ proteoglycan and is detected as either
  a core protein (discrete band at ~268 kDa) or as a chondroitin sulfate proteoglycan
  (higher molecular weight smear). Treatment of conditioned medium with chondroitinase
  ABC removes chondroitin sulfate chains and collapses diffuse smears into discrete
  bands. A c-terminal specific CSPG4 antibody only detects protein in the cell lysate
  control lane, confirming that conditioned medium bands are shed ectodomains. NLGN3
  treatment increases shedding relative to vehicle controls (p = 0.003). NLGN3-induced
  shedding of CSPG4 is blocked by pre-treating cells with 5 uM ADAM10 inhibitor (p
  = <0.0001). Right: Quantification of CSPG4 shedding as fold change in protein band
  intensities in the left (top N-terminal blot) relative to vehicle-treated controls.
  n (independent biological replicates of western blot) = 4, mean ± s.e.m., ordinary
  one-way ANOVA, p-values are mentioned in the legend and written on the figures.c.Left:
  Western blot of CSPG4 shedding from IDH1 WT glioblastoma (GBM) model conditioned
  medium after exposure to 100 nM sNLGN3 for 1-hour in the presence or absence of
  5 uM ADAM10 inhibitor. NLGN3 treatment increases shedding relative to vehicle controls
  (p = 0.0013). NLGN3-induced shedding of CSPG4 is blocked by pre-treating cells with
  5 uM ADAM10 inhibitor (p = <0.0001). Right: Quantification of protein band intensities
  relative to vehicle-treated controls. n (independent biological replicates of western
  blot) = 4, mean ± s.e.m., ordinary one-way ANOVA, p-values are mentioned in the
  legend and written on the figures.d.Left: Western blot of CSPG4 shedding from NF1-mutant
  optic pathway glioma model conditioned medium after exposure to 100 nM sNLGN3 for
  1-hour in the presence or absence of 5 uM ADAM10 inhibitor. NLGN3 treatment increases
  shedding relative to vehicle controls (p = 0.0066). NLGN3-induced shedding of CSPG4
  is blocked by pre-treating cells with 5 uM ADAM10 inhibitor (p = 0.0004). Right:
  Quantification of protein band intensities relative to vehicle-treated controls.
  n (independent biological replicates of western blot) = 4, mean ± s.e.m., ordinary
  one-way ANOVA, p-values are mentioned in the text and the figures.e.Left: Western
  blot of CSPG4 shedding from primary mouse oligodendrocyte precursor cell (OPC) conditioned
  medium after exposure to 100 nM sNLGN3 for 1-hour in the presence or absence of
  5 uM ADAM10 inhibitor. NLGN3 treatment increases shedding relative to vehicle controls
  (p = 0.0011). NLGN3-induced shedding of CSPG4 is blocked by pre-treating cells with
  5 uM ADAM10 inhibitor (p = 0.0003) Right: Quantification of protein band intensities
  relative to vehicle-treated controls. n (independent biological replicates of western
  blot) = 3, mean ± s.e.m., ordinary one-way ANOVA, p-values are mentioned in the
  figures.f. Model depicting serial events occurring during NLGN3-induced CSPG4 ectodomain
  shedding by ADAM10 from glioma cells. Red circular sector = ADAM10; Green rectangle
  = shed NLGN3; blue = CSPG4 ectodomain'
