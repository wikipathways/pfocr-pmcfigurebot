figure_title: Delivery of tRNA-Asp-GTC-3’tDR mimics protects against renal ischemia/reperfusion
  injury in mice
caption: (A) Northern blotting shows the levels of full-length and 3’tDR of tRNA-Asp-GTC
  in the kidney from the mouse renal IRI model at different time points. (B) Quantification
  of the levels of full-length and 3’tDR of tRNA-Asp-GTC in A. (C) Schematic illustration
  of the experimental design for tRNA-Asp-GTC-3’tDR delivery in the mouse renal IRI
  model. (D) Northern blotting shows the levels of full-length and 3’tDR of tRNA-Asp-GTC
  in kidney tissues from Sham or IRI mice treated with Ctrl or tRNA-Asp-GTC-3’tDR
  mimics. (E) Quantification of tRNA-Asp-GTC-3’tDR levels in D. (F) Analysis of Klotho
  expression in kidney tissues from Sham or IRI mice treated with Ctrl or tRNA-Asp-GTC-3’tDR
  mimics. (G) Analysis of gene expression related to acute kidney injury, immune cell
  infiltration, and fibrosis in kidney tissues from Sham or IRI mice treated with
  Ctrl or tRNA-Asp-GTC-3’tDR mimics (n=4–7 per group). (H to I) Immunostaining analysis
  of Cleaved-Caspase 3 (H) and Periostin (I) in kidney tissues from Sham or IRI mice
  treated with Ctrl or tRNA-Asp-GTC-3’tDR mimics. (J) Picrosirius Red staining analysis
  of collagen levels in kidney tissues from Sham or IRI mice treated with Ctrl or
  tRNA-Asp-GTC-3’tDR mimics. (K) Immunoblot analysis of the autophagy pathway in kidney
  tissues from Sham or IRI mice treated with Ctrl or tRNA-Asp-GTC-3’tDR mimics. (L)
  Quantification of protein levels in K. Data are shown as means ± SEM of at least
  three independent experiments. The Mann-Whitney test was used in (E), (F), (G),
  and (L). *p < 0.05, **p < 0.01, ***p < 0.001. Scale bar 250μm
article_title: A hypoxia-responsive tRNA-derived small RNA confers renal protection
