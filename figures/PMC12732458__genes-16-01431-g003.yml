caption: (A) The boxplot of biological distance to known UC-associated genes for candidate
  genes. The top ten genes are displayed in the plot. Shorter distance means biologically
  closer to UC genes. (B) IPA pathway analysis based on significant genes derived
  from high-impact rare variant collapsing analysis. Pathways with p < 0.05 are displayed.
  (C) Density of the most optimal polygenic risk scores of individuals in cases and
  controls. (D) Disease odds ratio (OR) for the second to fifth quintile of the most
  optimal polygenic risk score (the first quintile used as reference). Vertical bars
  demarcate 95% confidence intervals. The odds ratio is denoted as the odds of UC
  cases in quintiles over the odds of UC cases in the reference panel (the lowest
  quintile)
