figure_title: Biogenesis of extracellular vesicle (EV) subtypes.
caption: Biogenesis of extracellular vesicle (EV) subtypes. Exosomes are formed via
  the Endosomal Sorting Complexes Required for Transport (ESCRT) pathway. ESCRT proteins
  aid in organizing cargo into the intraluminal vesicles (ILVs) found within multivesicular
  bodies (MVBs), which eventually develop into exosomes. Exosomes can also be formed
  through ESCRT-independent pathways
