figure_title: Pathways that are significantly differentially targeted by TFs with
  age and also in Hashimoto’s thyroiditis (HT) and/or Anaplastic Thyroid Carcinoma
  (ATC).
caption: Pathways that are significantly differentially targeted by TFs with age and
  also in Hashimoto’s thyroiditis (HT) and/or Anaplastic Thyroid Carcinoma (ATC).
  The heatmap represents pathways in rows and disease in columns. Intensity of (green
  and pink) colors are proportional to the normalized enrichment scores (NES) from
  the gene set enrichment analysis (GSEA) performed to identify disease-related pathways,
  separately for HT and ATC compared to GTEx healthy thyroid. Pathways targeted more
  in disease compared to normal tissue are colored pink and pathways targeted less
  in disease compared to normal tissue are colored green. Pathways that were significant
  (p-value 0.05, after adjusting for false discovery rate) are marked with an asterisk.
  The left bar shows red or blue beside the pathway if that pathway is increasingly
  or decreasingly targeted by TFs with age, respectively
