figure_title: Short-term isoflurane (ISO) exposure alters acute transcriptomic responses
  in the heart of aged 27-month-old (27m) mice 24 h after cessation
caption: (A) PLS-DA of heart transcriptomes across groups shows clear separation.
  (B) Volcano plot of differentially expressed genes (DEGs) comparing 27m ISO/OP vs.
  27m Sham. (C-D) Enriched GO molecular processes (C) and KEGG pathways (D) for upregulated
  DEGs. (E-F) Enriched GO molecular processes (E) and KEGG pathways (F) for downregulated
  DEGs. Heatmaps of representative genes contributing to the top enriched GO term
  pathways (G, H). (I–J) Bar plots illustrating expression of selected DEGs linked
  to the top three enriched pathways in up- (I) and down- (J) regulated DEGs. n=5
  mice/group
