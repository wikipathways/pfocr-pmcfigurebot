figure_title: Integration of multi-omics data with artificial intelligence for precision
  oncology.
caption: 'Integration of multi-omics data with artificial intelligence for precision
  oncology. Heterogeneous molecular datasets—including mutations and CNVs (genomics),
  expression signatures (transcriptomics), signaling-pathway activity (proteomics),
  metabolic-flux features (metabolomics), and CRISPR-derived essentiality scores (functional
  genomics)—are processed through model-specific encoding steps: graph message passing
  for GNNs and self-attention encoding for Transformers. These inputs are subsequently
  transformed into graph-based or attention-based embeddings, integrated into graph-structured
  or attention-derived latent spaces, and utilized in graph-based or attention-driven
  predictive modeling'
