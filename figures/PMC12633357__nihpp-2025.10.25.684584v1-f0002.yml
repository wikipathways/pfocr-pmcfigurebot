figure_title: Isotope tracing with [2H7]IAA and H218O reveals a revised IAA degradation
  pathway in V. paradoxus CL014
caption: a, LC-MS analysis of [2H7]IAA catabolism identifies key pathway intermediates
  and their deuterium labeling profiles. Left, LC–MS peak intensities of major metabolites.
  Right, deuterium isotope distributions following incubation with unlabeled IAA or
  [2H7]IAA. Data represent mean ± s.e.m. (standard error of the mean) of n = 3 biological
  replicates. b, H21 O (20% v/v) tracing confirms the source of oxygen atoms incorporated
  during the two-step oxidation reactions. Data are shown for two biological replicates.
  c, A revised mechanistic model of IAA degradation consistent with isotope tracing
