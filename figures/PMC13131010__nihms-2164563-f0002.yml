figure_title: Fucosylation in immune cell function
caption: a, l-Fucose (LF) enhances tumour-intrinsic fucosylation and cell surface
  localization of major histocompatibility complex class II (MHCII) (human leukocyte
  antigen-DRB1 (HLA-DRB1)) on melanoma cells, a process essential for robust CD4+
  T cell-mediated immune infiltration and antitumour immune responses. Mechanistically,
  LF appears to alter CD4+ T cell-intrinsic pathways including integrin and protein
  kinase A (PKA) signalling, resulting in enrichment of intratumoural central memory
  CD4+ T cells. b, Core fucosylation of the innate pattern recognition molecule CD14
  is required for endocytosis of CD14 and Toll-like receptor 4 (TLR4), which in turn
  activates TIR domain-containing adapter-inducing interferon-β (TRIF)–interferon
  regulatory factor 3 (IRF3) signalling, type I interferon (IFNβ) production, and
  propagation of innate antitumour defence responses. c, LF treatment drives the polarization
  of dendritic cells (DCs) towards immunostimulatory antigen-presenting conventional
  DC1 (cDC1) and monocyte-derived DC (mo-DC) subsets, upregulating genes involved
  in antigen processing and presentation (valosin-containing protein (VCP), endoplasmic
  reticulum aminopeptidase 1 (ERAP1), histocompatibility 2, Q region locus 4 (H2-Q4),
  transporter associated with antigen processing 2 (TAP2)), as well as pro-inflammatory
  cytokines (interleukin-6 (IL-6), IL-12, IL-23), while downregulating immunosuppressive
  chemokines (CC-chemokine ligand 22 (CCL22), CCL17). This polarization is associated
  with enhanced antigen uptake, presentation and T cell activation (proliferation
  and interferon-γ (IFNγ) production) capacity. d, Experimental ex vivo fucosylation
  has been reported to increase surface levels of cutaneous lymphocyte-associated
  antigen (CLA), which contains the sialyl Lewis X (sLeX) epitope, on natural killer
  (NK) cells, promoting E-selectinmediated NK cell trafficking to tumours, NK cell
  effector differentiation, and downstream cytotoxic T cell (CTL) activation. These
  LF-induced effects enhance effector molecule production (IFNγ, granzyme B, perforin)
  from NK cells and amplify tumour cell killing and adaptive immune responses. GDP,
  guanosine diphosphate; GlcNAc, N-acetylglucosamine; Neu5Ac, N-acetylneuraminic acid;
  TCR, T cell receptor
