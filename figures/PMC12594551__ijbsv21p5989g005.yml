figure_title: METs stimulate the release of IL-33 from acinar Cells via the cGAS-STING-GSDMD
  pathway.
caption: 'METs stimulate the release of IL-33 from acinar Cells via the cGAS-STING-GSDMD
  pathway. A) Cytokine array analysis of serum from control and SAP mice. B) ELISA
  analysis of Il-33 in serum of control and SAP mice (left panel, n=4 mice per group),
  and IL-33 in serum from healthy controls and patients with AP and SAP (right panel,
  n=12~17 subjects per group). C) Immunofluorescence staining of Amylase (green) and
  Il-33 (red) in the pancreata of control and SAP mice (n=4 mice per group). Scale
  bar=25μm. D) Western blot analysis of full-length Il-33 and cleaved Il-33 in the
  pancreata of control and SAP mice (n=3 mice per group). E) ELISA analysis of Il-33
  levels in the serum of wild-type and Gsdmd-/- mice following SAP induction, as well
  as ELISA analysis of Il-33 levels in the serum of SAP mice, comparing those with
  and without DNase I treatment. F) Western blot analysis of full-length Il-33 and
  cleaved Il-33 in the pancreata of wild-type and Gsdmd-/- mice after SAP induction
  (n=3 mice per group) and in the pancreata of SAP mice with and without DNase I treatment
  (n=3 mice per group). G) GSEA enrichment analysis of the STING pathway in injured
  acinar cells, with data from GSE163254. H) Western blot analysis of Irf3 and phosphorylated
  Irf3 in the pancreata of control and SAP mice (n=4 mice per group). I) Western blot
  analysis of the total and phosphorylated forms of Tbk1, Irf3, and Sting in the pancreata
  of SAP mice with and without DNase I treatment (n=4 mice per group). J-K) CCK-8
  viability assays of acinar cells after conditioned medium (CM) with BMDMs and caerulein
  treatment, with or without DNase I and H151 co-treatment. L) ELISA analysis of Il-33
  in supernatant acinar cells after conditioned medium with BMDMs and caerulein treatment,
  with or without H151 co-treatment. M) Western blot analysis of phosphorylated Tbk1
  and N-Gsdmd in acinar cells after conditioned medium with BMDMs and caerulein treatment,
  with or without H151 co-treatment. P values in left panel of B and E was calculated
  using unpaired Student''s t-tests and P values in right panel of B, J, K and L was
  calculated using a one-way ANOVA with multiple comparisons test. Data are presented
  as mean ± SD. Statistical significance: *P < 0.05, **P < 0.01, ***P < 0.001, ns.
  not significant. CM, conditioned medium; H151, H151 treatment'
