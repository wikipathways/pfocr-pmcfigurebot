figure_title: Baicalin suppresses NF-κB pathway activation via a proteasome-independent
  mechanism.
caption: Baicalin suppresses NF-κB pathway activation via a proteasome-independent
  mechanism. The proteasome inhibitor MG132 was employed to investigate whether baicalin
  regulates NF-κB by inhibiting IκBα degradation. (A) Representative Western blots
  showing the effect of baicalin on IκBα protein stability in the presence or absence
  of MG132. (B) Quantitative analysis of IκBα protein levels from (A). (C) qRT-PCR
  analysis of downstream pro-inflammatory cytokines (IL-6, IL-1β, TNF-α) reveals a
  synergistic inhibitory effect on their transcription upon co-treatment with baicalin
  and MG132. (D) Immunofluorescence (IFA) analysis confirming that baicalin effectively
  inhibits the nuclear translocation of phosphorylated p65 (p-p65), an effect that
  is not dependent on proteasome activity. Data are presented as mean ± SD. * p <
  0.05, ** p < 0.01, *** p < 0.001
