figure_title: IL-4R is positively regulated by POSTN and essential for IL-4/IL-13-induced
  POSTN upregulation in KFs.
caption: IL-4R is positively regulated by POSTN and essential for IL-4/IL-13-induced
  POSTN upregulation in KFs. (A) A bubble chart showing the top 20 signaling pathways
  associated with POSTN in KFs based on Reactome analysis. The IL-4 and 13 signaling
  pathway is highlighted in red. (B) RT-qPCR results showing the mRNA expression levels
  of POSTN and IL-4R in KFs transfected with si-POSTN/si-CTL (n=4). (C) Western blotting
  of the protein expression of POSTN and IL-4R in KFs transfected with si-POSTN/si-CTL.
  (D) RT-qPCR results showing the mRNA expression levels of POSTN in KFs transfected
  with si-IL-4R/si-CTL, in the presence or absence of IL-4/IL-13 treatment (n=4).
  (E) Representative blots showing protein expression of POSTN in KFs transfected
  with si-IL-4R/si-CTL, in the presence or absence of IL-4/IL-13 treatment. (F) Immunofluorescence
  staining showing protein expression of POSTN in KFs transfected with si-IL-4R/si-CTL,
  in the presence or absence of IL-4/IL-13 treatment. Data are presented as the mean
  ± SEM. ***P<0.001, *P<0.05. IL-4R, IL-4 receptor; KFs, keloid fibroblasts; POSTN,
  periostin; RT-qPCR, reverse transcription-quantitative PCR; si, small interfering
