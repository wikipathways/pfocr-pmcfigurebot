figure_title: Biosynthetic pathways of GPIs in mammals and protozoa.
caption: 'Biosynthetic pathways of GPIs in mammals and protozoa. (A) In mammalian
  cells, GPI biosynthesis occurs in the ER, followed by glycan and fatty acid remodeling
  in the Golgi apparatus before transfer to the cell surface. The first two steps
  take place on the cytoplasmic side of the ER, and subsequent sugar, lipid, and EtNP
  modifications occur on the luminal side. After attachment of the GPI anchor to proteins,
  further side-chain modifications may be introduced. The numbers indicated for each
  reaction in the figure correspond to those listed in Table S1. (B) Trypanosoma brucei:
  GPI biosynthetic pathways in both bloodstream and procyclic forms. Fatty acid remodeling
  occurs prior to protein attachment in the ER. (C) Toxoplasma gondii: GPI biosynthesis
  involves species-specific side-chain additions catalyzed by PIGJ and PIGE glycosyltransferases.
  (D) Plasmodium falciparum: GPI biosynthesis retains the inositol-linked acyl chain
  without Golgi remodeling. (E) Leishmania spp.: GPI biosynthetic pathway producing
  both GPI-APs, GIPLs, and LPG'
