figure_title: Epithelial IL-36R signaling triggers neutrophil-mediated lung inflammation
caption: 'WT, K14-IL-36R−/−, Nkx-IL-36R−/−, and PMN−/− mice were e.c. exposed to S.
  aureus + CrA for 7 days, followed by i.t. CrA administration on days 10–12. Blood
  was collected on day 10, whereas BAL and lungs were harvested on day 13 (n ≥ 6 per
  group).(A) GO biological process enrichment pathway analysis of RNA-seq from WT
  naive and day 13 lungs (n = 5 per group).(B) Mean number of BAL PMNs (±SEM) as measured
  by FACS.(C) Representative lung immunofluorescence for Ly6G (green) and DAPI (blue)
  on day 13 (scale bar: 100 μm).(D) Quantification of lung tissue Ly6G expression
  levels (±SEM) from (C) using QuPath.(E) Mean number of blood PMNs/mL (±SEM).(F)
  Weight change (%) from day 0 to 13 (±SEM).(G) Representative lung histology (H&E,
  scale bars: 1 mm and 100 μm).(H) Lung inflammation (±SEM) from histologic sections
  as measured by ImageJ software analysis as the percentage of the density of H&E
  staining.(I) Mean bronchiole epidermal thickness (±SEM).(J) Mean number of BAL PMNs
  and monocytes (±SEM) as measured by FACS.ns, not significant; *p < 0.05, **p < 0.01,
  ***p < 0.001, and ****p < 0.0001 as calculated by one-way ANOVA multiple comparisons
  test with Tukey correction (B, D, and E) and a two-tailed Student’s t test (F and
  H–J). Results are combined from at least 2 independent experiments. See also Figures
  S3-S7'
