figure_title: In MI and MIRI, cardiomyocytes often exhibit impaired PI3K signaling
  pathways and overactivation of MAPK pathways, leading to excessive autophagy and
  the induction of RCD.
caption: In MI and MIRI, cardiomyocytes often exhibit impaired PI3K signaling pathways
  and overactivation of MAPK pathways, leading to excessive autophagy and the induction
  of RCD. EGCG mitigates this phenomenon through the mediation of miR-384, LncRNAGm4419,
  14-3-3η protein, and ATG4C protein. In addition, EGCG increases the expression level
  of miR-30a, inhibits the hydrolysis of OPA1, and thereby suppresses mitochondrial
  apoptosis. EGCG reduces ACSL4 protein expression by increasing the expression level
  of miR-450b-5p, thereby inhibiting ferroptosis, and it reduces the stability of
  AIM2 mRNA by lowering the expression level of LncRNAMEG3, thereby inhibiting pyroptosis.
  The black arrows between the labels indicate a promoting effect while the red arrows
  represent an inhibitory effect
