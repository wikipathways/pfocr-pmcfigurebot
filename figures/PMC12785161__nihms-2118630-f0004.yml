figure_title: Differential expression analysis between CEM and control medium-treated
  PMACs or naïve ECs
caption: A. Volcano plot illustrating significantly altered gene expression in CEM
  versus control medium-treated PMACs, determined by DESeq2 analysis with threshold
  values (absolute log2 fold change > 1, adjusted p < 0.05). Dashed lines and shaded
  regions indicate these thresholds, with red showing upregulated genes, blue indicating
  downregulated genes, and gray showing non-significant changes. Adjusted p-values
  are shown on a −log10 scale. B. KEGG pathway enrichment analysis of the upregulated
  genes in CEM-treated PMACs (p < 0.05). KEGG pathways were ranked by statistical
  significance, with the bar length representing the adjusted p-value score on a −log10
  scale. Longer bars indicate higher significance. C. Heatmap of genes highly enriched
  in inflammation. Hierarchical clustering was performed using Euclidean distance
  and average linkage. Colors represent z-scored expression values, with red indicating
  higher expression and blue indicating lower expression. D. Volcano plot illustrating
  significantly altered gene expression in CEM versus control medium-treated naïve
  ECs, determined by DESeq2 analysis with threshold values (absolutelog2 fold change
  > 1, adjusted p < 0.05). Dashed lines and shaded regions indicate these thresholds,
  with red showing upregulated genes, blue indicating downregulated genes, and gray
  showing non-significant changes. Adjusted p-values are shown on a −log10 scale.
  E. Heatmap of CEM-treated naïve EC gene signatures related to inflammation. Hierarchical
  clustering was performed using Euclidean distance and average linkage; colors represent
  z-scored expression values. F. KEGG pathway enrichment analysis of CEM-treated naïve
  EC gene signatures (p < 0.05)
