caption: 'Effects of exogenous Spd on the expression of genes related to GSH pathway
  in cucumber seedlings under Cd stress. (A) show the relative expression of CsGR
  gene. (B) show the relative expression of CsGSHS gene. (C) show the relative expression
  of CsPCS1 gene. Note: Data were expressed as the mean ± standard deviation (SD)
  from three independent biological replicates. Different lowercase letters denoted
  statistically significant differences among treatment groups at p < 0.05. CK: Distilled
  water as a control, S0: 10 mg·L−1 Cd treatment; S1 + Cd: 10 mg·L−1 Cd + 0.05 mM
  Spd group; S2+ Cd: 10 mg·L−1 Cd + 0.1 mM Spd group; S3+ Cd: 10 mg·L−1 Cd + 0.2 mM
  Spd group; S4+ Cd: 10 mg·L−1 Cd + 0.4 mM Spd group; S5+ Cd: 10 mg·L−1 Cd + 0.5 mM
  Spd group'
