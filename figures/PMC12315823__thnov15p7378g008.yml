figure_title: An overview of strategies for TAM-targeting antitumor therapeutics.
caption: 'An overview of strategies for TAM-targeting antitumor therapeutics. The
  ways TAMs have been manipulated can be sorted as follows: (A) Inhibition of TAM
  recruitment. Targeting CCL2-CCR2/CCR5, CSF1-CSF1R, or CXCL12-CXCR4 axis via inhibitors
  or antibodies can inhibit the recruitment of TAMs to the TME; (B) Depletion of TAMs
  in the TME. CSF1/IL-34-CSF1R blockade via monoclonal antibodies or small-molecule
  antagonists, bisphosphonates and trabectedin, and targeting scavenger receptor-A
  or FRβ via immunotoxins can reduce TAM count in TME by inducing apoptosis; (C) Enhancing
  phagocytosis. Blockade of the “do not eat me” signals, e.g. SIRPα/CD47 pathway,
  CD24/Siglec-10 pathway and MHC-I/LILRB1 pathway, can evoke the phagocytic activities
  of TAMs against tumor cells; (D) Reprogramming of TAMs. Agonistic CD40 antibodies,
  TLR2/4, TLR7/8 and TLR9 agonists, and PI3Kγ inhibitors induce the repolarization
  of TAMs from M2 towards pro-inflammatory and tumoricidal M1 phenotype; (E) Targeting
  TAM heterogeneity. The heterogeneous TAM subgroups can be targeted by distinct therapeutics.
  Reg-TAMs are inhibited via IDO1, TREM2, Arg-1 and COX-2/PGE2 inhibitors to blunt
  immunosuppression. Angio-TAMs are inhibited by ANG2-VEGF antibody to reduce tumor
  angiogenesis and therapeutic resistance. Inflam-TAMs are inhibited by IL-1β inhibitor
  to suppress pro-tumor inflammatory and immunosuppressive microenvironment; (F) Targeting
  TAM metabolism. Manipulation of TAMs'' metabolism can be achieved via glycolytic
  modulators 2-DG and metformin to induce M1 TAM polarization, LXR/ABCA1, COX2/PGE2/EP2-4
  and FAO inhibitors to treat lipid abnormality, and IDO1 inhibitor to block the tryptophan
  metabolism; (G) Genetically engineered macrophages. Macrophage precursors are genetically
  engineered through adenoviral or lentiviral transduction of antitumor IFN and IL-12,
  or ArgNP-mediated CRISPR/Cas9 delivery to knockout SIRP-α gene. Adoptive transfer
  of genetically engineered macrophages represents a new approach to enhance the phagocytosis
  and antitumor immune activities of TAMs'
article_title: 'Focusing on the interplay between tumor-associated macrophages and
  tumor microenvironment: from mechanism to intervention'
