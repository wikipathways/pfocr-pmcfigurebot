figure_title: Loss of TAZ reverses the dabrafenib-induced UPR in BRAFV600E-driven
  ATC cells
caption: A. Gene Set Enrichment Analysis (GSEA) for top 10 pathways showing that the
  unfolded protein response (UPR) is the most enriched pathway in response to dabrafenib
  treatment. B. Heat map showing the expression profile of the UPR genes in dabrafenib
  and vehicle treated control cells. C. Heatmap of log2fold-change value of differentially
  expressed genes of dabrafenib vs vehicle and dabrafenib treated shTAZ cells vs dabrafenib
  treated shCtrl cells. D. Left panel Proteomics profiling of dabrafenib treated cells.
  Difference is plotted in x-axis and −log10(adj P-value) on the y-axis. Right panel.
  Downstream effectors of UPR in dabrafenib treated cells. E. Cells depleted for TAZ
  (shTAZ and TAZ KO) were treated with dabrafenib for the indicated times. ATF4, PHGDH
  and p-MEK were analyzed. TAZ depletion was confirmed in shTAZ and TAZ KO cells.
  H3 and RPL32 were used as loading controls F. Analysis of newly synthesized proteins
  using puromycin incorporation for 10min at 7 days of dabrafenib treatment in the
  presence or absence of TAZ. G. Lipid ROS level was analyzed using BODIPY in shCtrl,
  shTAZ, shCtrl+dabrafenib and shTAZ+dabrafenib cells. RSL3 was used as a positive
  control. Concentration of dabrafenib used is 0.8 μM
