figure_title: Complete in vitro reconstitution of the 2,8-dioxopurine pathway
caption: (A) Extracted ion chromatograms from HILIC LC-MS for 2,3-diaminopropanoic
  acid standard and the molecular feature identified in C. sporogenes and E. coli
  ygeX supernatants. (B) Comparison of mass fragmentation spectra between C. sporogenes
  ygeX supernatants and an authentic 2,3-diaminopropanoic acid standard. (C) Labeled
  substrates and products detected in cell-free culture supernatants of C. sporogenes
  and E. coli wild-type and ygeX mutants using Poroshell positive (uric acid), DNS
  (DPA), or NPH (acetate and butyrate) LC-MS. (D) Extracted ion chromatograms for
  2,3-diaminopropanoic acid and pyruvate after incubation of 2,3-diaminopropanoic
  acid with BSA (control) or recombinant YgeX. Compounds were analyzed by DNS (DPA)
  or C18 (pyruvic acid) LC-MS. (E) Overview of enzyme conversion assays in culture
  supernatants. (F) Concentrations of labeled or non-labeled 2,3-diaminopropanoic
  acid and pyruvate corresponding to experimental overview in E. Compounds were analyzed
  by DNS (DPA) or C18 negative (pyruvic acid) LC-MS. (G) Structures of candidates
  for the second intermediate in the pathway (UA-2) including xanthine and its two
  isomers. (H) Comparison of extracted ion chromatograms for C. sporogenes ygfK culture
  supernatants and authentic standards for the three xanthine isomers using HILIC
  LC-MS. (I) Conversion of uric acid to 2,8-dioxopurine using purified C. sporogenes
  DOPDH (XdhAC), analyzed by Poroshell positive LC-MS. (J) Extracted ion chromatograms
  for UA-2 and UA-3 after incubation of recombinant E. coli DOPOR (YgfK) with a xanthine
  isomer mixture using HILIC LC-MS. (K) In vitro reconstitution of the uric acid pathway.
  Each enzyme was added sequentially, and intermediates were quantified by Poroshell
  positive (uric acid and 2,8-dioxopurine), HILIC (UA-3, UA-4, UA-5, and UA-6), DNS
  (DPA), or Poroshell negative (pyruvic acid) LC-MS after 1 hour. Structures for the
  intermediates are supported by comparison of retention times, accurate m/z, and
  mass fragmentation patterns with authentic standards, except for UA-3 and UA-4 which
  are provisional (see Supplemental Text for details). For A, D, H, and J, three replicates
  were performed, and representative data are shown. For C, F, I, and K, data represent
  means ± standard deviations from three replicates
