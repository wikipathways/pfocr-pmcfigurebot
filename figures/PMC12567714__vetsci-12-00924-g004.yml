figure_title: Transcriptomic analysis of bovine blastocysts treated with LY2955303
  (LY) starting at the 16-cell and 2-cell stages.
caption: 'Transcriptomic analysis of bovine blastocysts treated with LY2955303 (LY)
  starting at the 16-cell and 2-cell stages. (a) Venn diagram showing the overlap
  of DEGs between cell16_LY and cell12_LY groups. (b) Volcano plot of DEGs in cell16_LY
  vs. cell12_LY comparison. Genes with p-value < 0.05 and |log2FoldChange| > 1 are
  categorized as upregulated (red, N = 840), downregulated (green, N = 1117), or non-significant
  (blue, N = 20,283). (c) GO enrichment analysis (BP: Biological Process; CC: Cellular
  Component; MF: Molecular Function) of DEGs, visualized as a bar plot showing −log10(p-value)
  for top enriched terms. (d) Bubble plot of KEGG pathway enrichment for upregulated
  DEGs in cell16_LY vs. cell12_LY. Dot size represents gene count; color indicates
  p-value. (e) Bubble plot of KEGG pathway enrichment for downregulated DEGs in cell16_LY
  vs. cell12_LY. Dot size represents gene count; color indicates p-value. (f) Heatmap
  of top DEGs (hierarchically clustered) distinguishing the cell16_LY and cell12_LY
  groups, showing normalized expression values (blue: low; red: high), the red boxes
  indicate the genes related to the glycolytic pathway'
