figure_title: Resistance to targeted inhibitors of the PI3K/AKT/mTOR pathway in BC.
caption: Resistance to targeted inhibitors of the PI3K/AKT/mTOR pathway in BC. Induction
  of receptor tyrosine kinase (RTK) including insulin growth factor-1 (IGFR-1), epidermal
  growth factor receptor (EGFR), and HER 2 and 3 may activate PI3K/AKT/mTOR and Ras/Raf/MEK/ERK,
  leading to resistance. Other mechanisms include loss or inactivation of PTEN, acquired
  amplification and/or mutation of PIK3CA or PIK3CB, which increase signaling through
  the PI3K p110β isoform and hyperactivation of the PI3K pathway, AKT up-regulation,
  which increases glucose uptake, and growth factor stimulation of IGF1R and INSR,
  which, once phosphorylated, activates the PI3K p85 subunit inducing PI3K/AKT/mTOR
  pathway
