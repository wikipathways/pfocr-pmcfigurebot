figure_title: Integration of transcriptomic data with a genome-scale model of human
  metabolism unravels the rewired metabolism in human Hep-PNPLA3-I148M
caption: (A) Heatmap showing the z-scored mRNA expression level of metabolic genes
  in Hep-PNPLA3-I148M (n = 4) and Hep-PNPLA3-WT (n = 4). The genes are grouped according
  to their affiliated metabolic pathways. (B) Schematic of the workflow for integrating
  RNA-Seq data with Recon 2.2, a genome scale reconstruction model of human metabolism.
  The pipeline generates reaction activity scores that correspond to the degree of
  alterations in metabolic pathway activities in PNPLA3-WT and PNPLA3-I148M hepatocytes.
  (C) Bubble plot showing the flux propensity analysis of reactions in metabolic pathways
  of human hepatocytes. Cohen’s D statistic was used to compute the fold change difference
  between the means of 2 groups. The test statistic of the Cohen’s D fold change difference
  was computed using Wilcoxon’s P value adjusted based on Benjamini-Hochberg method.
  A positive Cohen’s D value indicates a reaction that is relatively more active in
  Hep-PNPLA3-I148M while a negative value indicates relatively higher activity in
  Hep-PNPLA3-WT. The size of the bubbles corresponds to the –log10 (Wilcoxon’s P value)
article_title: PNPLA3-I148M genetic variant rewires lipid metabolism to drive programmed
  cell death in human hepatocytes
