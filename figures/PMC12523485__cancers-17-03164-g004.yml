caption: CellChat reveals cell–cell communication roles of MMP1 + FIB in the gastric
  cancer TME. (A,B) Circos plots depict the number and strength of the interactions
  among different cell types. Thicker lines indicate greater interaction numbers and
  stronger intensity between cell types. (C–E) Cell–cell communication networks for
  MMP1 + FIB, PDGFA + FIB, and IGLC2 + FIB. (F) Heatmap showing the relative strength
  of each signaling pathway network per cluster, including incoming and outgoing signaling.
  Color gradients reflect scaled interaction strength. (G) Hierarchy plot illustrating
  the signaling cascade of the COMPLEMENT signaling pathway network. (H) Bubble plot
  highlighting the dominant signaling pathways in MMP1 + FIB. Each dot represents
  a ligand–receptor pair, with the size determined by the pathway-enrichment p-value
  and color indicating the communication probability. FIB, fibroblast
