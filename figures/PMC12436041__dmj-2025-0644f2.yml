figure_title: Integrated hepatic insulin signaling and metabolic pathways under insulin
  resistant conditions such as MASLD.
caption: 'Integrated hepatic insulin signaling and metabolic pathways under insulin
  resistant conditions such as MASLD. Hepatic IR, a hallmark of MASLD, is characterized
  by impaired insulin suppression of HGP, primarily driven by excess FFAs, DAGs, and
  ceramides. These lipid metabolites activate PKCs and inhibit INSR–IRS–AKT signaling.
  A key paradox in MASLD is selective hepatic IR: insulin fails to suppress gluconeogenesis
  but still promotes lipogenesis via mTORC1, SREBP-1c, and aPKCs. These pathways also
  feature multiple divergent insulin signaling components. DNL is highly active in
  MASLD, driven by hyperinsulinemia and carbohydrate-induced ChREBP activation. In
  IR states, a failure of insulin to facilitate degradation of ApoB as well as increased
  levels of FFAs and increased lipogenesis stimulate VLDL secretion. Nodes: lines
  and pathway regulation are presented similarly to the Fig. 1, except that pink-colored
  nodes and pathways indicate an increase by insulin action. *Abbreviations: GLUT2,
  glucose transporter 2; MRC, mitochondrial respiratory chain; mtProtein, mitochondrial
  ribosomal protein; NRF1, nuclear respiratory factor 1; SIRT1, sirtuin 1; and TFAM,
  mitochondrial transcription factor A'
