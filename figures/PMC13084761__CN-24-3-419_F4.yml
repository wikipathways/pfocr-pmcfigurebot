figure_title: Celastrol ameliorates VCR-induced inflammation by suppressing the CaMKII/cx43
  signaling pathway.
caption: Celastrol ameliorates VCR-induced inflammation by suppressing the CaMKII/cx43
  signaling pathway. (A) Western blot and (B) quantitative analysis of P65 and p-P65
  protein expression in the spinal cord from the indicated male mice. n = 6 mice per
  group. (C, D) qRT-PCR analysis of spinal cord TNF-α and Cox-2 mRNA levels, n = 4
  mice/group. (E) Western blot and (F) quantitative analysis of P65 and p-P65 proteins
  expression in astrocytes pre-incubated with celastrol (1.0 μM or 2.0 μM) and KN-93
  (10 μM) for 6 h, followed by a 24-hour exposure with VCR (3 nM). n = 3 independent
  experiments. (G, H) qRT-PCR analysis of primary astrocytes TNF-α and Cox-2 mRNA
  levels, n = 3 independent experiments. (I) Western blot and (J) quantitative analysis
  of Cx43 protein expression in the spinal cord from the indicated male mice. n =
  6 mice per group. (K) qRT-PCR analysis of spinal cord Cx43 mRNA levels, n = 4 mice/group.
  (L) Western blot and (M) quantitative analysis of Cx43 protein expression in astrocytes
  pre-incubated with celastrol (1.0 μM or 2.0 μM) and KN-93 (10 μM) for 6 h, followed
  by a 24-hour exposure with VCR (3 nM). n = 3 independent experiments. (N) qRT-PCR
  analysis of Cx43 mRNA levels in primary astrocytes pre-incubated with celastrol
  (1.0 μM or 2.0 μM) and KN-93 (10 μM) for 6 h, followed by a 24-hour exposure with
  VCR (3 nM), n = 3 independent experiments. (O, P) The levels of IL-6 and IL-1β in
  plasma were analyzed by ELISA. n = 6 mice/group. Data are presented as mean ± SEM
  and *P < 0.05, **P < 0.01, and ***P < 0.001. Unpaired two-tailed Student’s t-tests
  were performed in B-D, F-H, J, K and M-P
