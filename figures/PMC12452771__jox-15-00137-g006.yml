figure_title: Effect of SiNPs on the HSF1/HSPs signaling pathway in BEAS-2B cells
  with HSF1 knockdown through HSF1 siRNA.
caption: 'Effect of SiNPs on the HSF1/HSPs signaling pathway in BEAS-2B cells with
  HSF1 knockdown through HSF1 siRNA. (A) Effect of HSF1 knockdown on HSF1, HSP90,
  HSP70, HSP27, E-cadherin, and N-cadherin in BEAS-2B cells before SiNPs (10 μg/mL)
  exposure by Western blot. (a) Representative Western blot pictures. (b–g) Quantitative
  analysis of the grayscale values of the above proteins by ImageJ, n = 4, and the
  data were expressed as mean ± S.D. Non-targeting siRNA was used as a negative control
  (NC). (B) Effect of HSF1 knockdown on the distribution and quantitative analysis
  of HSF1 in BEAS-2B cells. (a) Representative immunofluorescence images of HSF1 proteins
  in BEAS-2B cells. (b) Quantitative analysis of the nuclear-cytoplasmic ratio of
  HSF1 protein in BEAS-2B cells. Blue: DAPI; red: HSF1, scale bar: 20 μm. (C) Effect
  of HSF1 knockdown on EMT-related genes after SiNPs treatment. (a–d) E-cadherin,
  Twist, MMP-3, and MMP-9. * p < 0.05 and ** p < 0.01. SiNP-treated group compared
  with corresponding SiNPs plus HSF1 siRNA group or SiNP-treated group without HSF1
  compared with the control group without HSF1 siRNA'
