figure_title: Proteomic profiling of extracellular vesicle (EV) cargo from the plasma
  of DOCA-salt hypertensive mice.
caption: Proteomic profiling of extracellular vesicle (EV) cargo from the plasma of
  DOCA-salt hypertensive mice. (A) Heatmap showing the differential protein expression
  in EV from male (MD vs. MB) and female (FD vs. FB) DOCA-salt mice compared to sex-matched
  baseline (pre-treatment). (B) cNetplot illustrating KEGG-enriched pathways in male
  DOCA-salt (MD) EV proteome, highlighting key RAS-related pathways. (C) cNetplot
  of KEGG-enriched pathways in female DOCA-salt (FD) EV proteome, showing distinct
  sex-based enrichment in RAS-associated pathways. (D) Comparison of pathway enrichment
  (-log10 adjusted p-value) between male and female DOCA-salt groups (FD vs. MD) across
  major RAS-related pathways. Asterisks indicate significant differences
