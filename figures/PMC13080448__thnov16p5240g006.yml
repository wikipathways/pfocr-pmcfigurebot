figure_title: In vitro cellular analysis of COLO320 laden in collagen foam bioinks.
caption: In vitro cellular analysis of COLO320 laden in collagen foam bioinks. (A)
  Immunofluorescence images of DAPI (blue)/MYC (red) staining of COLO320 cells cultured
  in collagen bulk and foam bioinks at days 14 and 28. (B) Quantification of cell
  proliferation using CCK-8 assay at days 1, 3, and 7 (n = 3). (C) Aggregate percentage
  based on the number of aggregates with diameters larger than 300 μm in 3D cultures
  at days 7, 14, 21, and 28. (D) Total aggregation area per unit area for aggregates
  larger than 300 μm in diameter at days 7, 14, 21, and 28 (n = 3). (E) Schematic
  illustration of notch signaling and mechanotransduction pathway in colorectal cancer
  cell within foam tumor model. (F) Relative gene expression (n = 3) and (G) gel electrophoresis
  of notch signaling (Notch1) and mechanotransduction (YAP, TAZ, and β-catenin) related
  genes at day 7. Relative RNA expression levels of (H) PVT1 and (I) MYC over time
  (days 7, 14, 21, and 28). (J) Electrophoresis analysis of gene expressions for PVT1
  and MYC at days 14 and 28. (K) Comparison of RNA expression levels of PVT1, MYC,
  POU5F1B, and FAM84B at day 14 between the porous collagen foam model and the minimum
  collagen concentration-based bulk model for structural maintenance. All values are
  represented as mean ± standard deviation
