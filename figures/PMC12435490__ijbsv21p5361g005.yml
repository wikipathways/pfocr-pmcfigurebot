figure_title: MKRN2 interacts with and destabilizes PPP2CA protein by catalyzing its
  poly-ubiquitination that is coupled to proteasome-specific degradation pathway.
caption: 'MKRN2 interacts with and destabilizes PPP2CA protein by catalyzing its poly-ubiquitination
  that is coupled to proteasome-specific degradation pathway. (A, B) Co-immunoprecipitation
  (Co-IP) assays were conducted to evaluate the endogenous interaction between MKRN2
  and PPP2CA in A498 and Caki-1 cells. (C, D) Co-IP assays were also employed to determine
  the exogenous interaction between MKRN2 and PPP2CA in HEK293T cells overexpressing
  Flag-MKRN2 and/or Myc-PPP2CA. (E) Representative confocal microscopic images illustrate
  the colocalization of MKRN2 and PPP2CA in A498 cells. (F) GSEA revealed significant
  associations between ubiquitin-mediated proteolysis and the mRNA levels of MKRN2.
  (G, H) ccRCC cells with stable MKRN2-KD and OE were subjected to cycloheximide (CHX)
  treatment at specified time intervals. Subsequently, cells were collected, and PPP2CA
  protein expression was assessed via western blotting (n = 3). (I, J) Quantitative
  analysis was performed to determine the relative protein level of PPP2CA in (G,
  H). (K) ccRCC cells with stable MKRN2 -OE were treated with vehicle (DMSO), MG132
  (20 × 10-6 M), or chloroquine (50 × 10-6 M) for 12 hours. Western blot analysis
  was employed to evaluate the protein level of PPP2CA. (L) After incubating with
  MG132 for a duration of 6 hours, cells overexpressing MKRN2 in a stable manner were
  lysed. Subsequently, immunoprecipitation was performed using an antibody targeting
  PPP2CA, followed by western blot analysis with an anti-ubiquitin antibody. Significance
  levels denoted as follows: ****p < .0001, ***p < .001, **p < .01, and *p < .05'
