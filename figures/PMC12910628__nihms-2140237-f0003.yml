figure_title: Break-induced replication-driven genomic amplification mechanisms
caption: 'a, Collapsed forks at repetitive elements repaired by BIR can use a repair
  template with a differing number of repeats as the broken strand. The broken strand
  from chromosome ‘A’ originally contained ‘Repeat 1’ and ‘Repeat 2,’ representing
  individual repeat elements for a total of two repeats. During BIR-mediated interchromosomal
  strand invasion, the invading strand uses a non-sister chromatid of chromosome ‘B’
  as a template that contains three repeat elements—‘Repeat 1’, ‘Repeat 2’ and ‘Repeat
  3’. As a result, the newly synthesized strand is expanded to include all three repeats.
  Color shading represents sequence orientation: dark, 5′–3′; light, 3′–5′. b, BIR
  and mmBIR can give rise to complex genomic rearrangements through co-occurring inversion
  and duplication events when using a sister chromatid as a template. Following fork
  collapse and 3′-end resection, the broken strand invades the sister chromatid through
  microhomology to copy locus ‘B’ in the opposite orientation and creates an inversion.
  This process is followed by fork collapse and re-invasion in the appropriate orientation,
  starting from locus ‘A’ through ‘B’ and ‘C.’ The resulting DNA product is a duplication
  of loci A, B and C flanking an inversion of locus ‘B.’ c, CRISPR–Cas9 mediated ‘amplification
  editing’141 is initiated by targeting of Cas9 nickases to two complementary regions,
  resulting in BIR-like expansions. The use of a Cas9-fused reverse transcriptase
  and a pegRNA at the targeted nicks generates 3′ flaps with complementary sequences.
  These flaps anneal, leading to self-template-driven DNA synthesis that causes unwinding
  of the template with continued synthesis up to the flap sequence. The resulting
  product is a duplication ranging from 20 bp to 100 Mbp, depending on the distance
  between the two generated flaps. This phenomenon has not been observed to occur
  endogenously in human cells, but its demonstration using genome-engineering tools
  to invoke endogenous DNA-repair pathways suggests it is a biologically possible
  variant of BIR'
