figure_title: Histone lactylation modulates PTC cell proliferation and invasion.
caption: 'Histone lactylation modulates PTC cell proliferation and invasion. (A) Schematic
  of glycolysis pathway and inhibitors: Shikonin suppresses PKM2 activity, and 2-DG
  inhibits the conversion of glucose to glucose-6-phosphate. (B) Dose-dependent effects
  of 2-DG and Shikonin on Lactylation and H3K18la levels in PTC cells. (C) Inhibition
  of PTC cell proliferation by 2-DG and Shikonin. (D-E) Inhibition of PTC cell invasion
  by 2-DG and Shikonin. (F) Rescue of H3K18la levels by Nala under 2-DG treatment.
  (G) Partial recovery of cell proliferation by Nala following 2-DG treatment. (H-I)
  Partial restoration of invasion ability by Nala under 2-DG treatment. (J) Schematic
  of xenograft tumor modeling and intraperitoneal injection in nude mice. (K-L) Tumor
  growth curves (K) and tumor weight comparisons (L) in mice treated with different
  regimens'
