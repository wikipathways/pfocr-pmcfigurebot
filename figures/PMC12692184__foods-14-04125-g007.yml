  Western blot analysis of the expression of PI3K/AKT/NOS3 signaling pathway-related proteins. (a) Western blot assays were performed to detect the expression levels of p-PI3K, PI3K, p-AKT, AKT, and NOS3. The p-PI3K/PI3K (b), p-AKT/AKT (c), and NOS3/GAPDH (d) were calculated by grayscale analysis. Data are presented as mean ± SD (n = 3, with three independent biological replicates). ##
