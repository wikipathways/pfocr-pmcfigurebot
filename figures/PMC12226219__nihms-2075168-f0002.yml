figure_title: The impact of RMC-7977 on PI3K correlates with sensitivity to RAS inhibition
caption: '(A) Dose-response Western blot analysis of AsPC-1 and HPAF-II exposed to
  three different concentrations of RMC-7977 (1nM, 10nM, 100nM) for 1h, 8h, and 24h.
  Vinculin is used as a loading control. (B) Dose-response assay of AsPC-1 and AsPC-1
  overexpressing myristoylated p110α (myr-p110α), treated with RMC-7977. The Western
  blot validates the expression of HA-tagged myr-p110α and shows its impact on PI3K
  signaling. The curves represent the average of three biological replicates, each
  consisting of two technical replicates. (C) Dose-response analysis of the HTVI-KRAS
  lines treated with RMC-7977. Statistical significance was calculated using the Wilcoxon
  matched-pairs signed rank test. Each curve represents the average of two different
  cell lines with the same genotype (HTVI-KRASG12D #1 and #2, HTVI-KRASQ61R #1 and
  #2), each obtained by averaging three technical replicates. (D) Time-course Western
  blot analysis of AsPC-1 treated with RMC-7977 or the combination of RMC-7977 and
  UCL-TRO-1938. (E) Time-course Western blot analysis of LIM1215, LIM1215 PIK3CAE545K,
  and LIM1215 PIK3CAH1047R treated with RMC-7977 (F) Dose-response pharmacological
  assays of LIM1215, LIM1215 PIK3CAE545K, and LIM1215 PIK3CAH1047R treated with RMC-7977
  or trametinib. (G) Drug combination validation experiments using RMC-7977 and alpelisib/AZD-8186:
  heatmaps show viability through color-coding as percentage of cell viability normalized
  on untreated controls (left) and the Loewe score of the drug combination (right).
  Each point in the heatmap represents the average of three biological replicates,
  each consisting of two technical replicates. (H) Western blot analysis of the MAPK
  and PI3K pathway responses to RMC-7977 50nM (RAS inhibitor, R), trametinib 50nM
  (MEK inhibitor, M), alpelisib 1μM / AZD-8186 0.25μM (PI3K inhibitors, P), and the
  respective combinations RP (RMC-7977 + alpelisib/AZD-8186) and MP (trametinib +
  alpelisib/AZD-8186) in AsPC-1 and HS766.T. Vinculin is used as the loading control'
article_title: Direct inhibition of RAS reveals the features of oncogenic signaling
  driven by RAS G12 and Q61 mutations
