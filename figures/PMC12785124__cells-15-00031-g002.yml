figure_title: Bulk RNA sequencing of human ileum-derived enteroids suggests a loss
  of stemness in hypoxia.
caption: Bulk RNA sequencing of human ileum-derived enteroids suggests a loss of stemness
  in hypoxia. (a) Schematic depicting the experimental setup for bulk RNA sequencing.
  Enteroids from donor 1 were incubated in normoxia (red) or hypoxia (blue) for 6,
  12, 24, or 48 h in quadruplicates in one experiment. (b) Dimensionality reduction
  was assessed by multi-dimensional scaling (MDS). Duration of incubation in normoxia
  (red) or hypoxia (blue) is illustrated by color intensity. (c) Pathway RespOnsive
  GENes for activity inference (PROGENy) analysis was performed to infer pathway activity.
  Hypoxia, VEGF, and Wnt pathway activities were plotted for each different time point.
  An unpaired signed-rank Wilcoxon test was applied. p ≥ 0.05 = ns (not significant),
  <0.05 = *. (d) Differential expression analysis of 16 stem cell-associated genes
  between enteroids incubated under normoxia and hypoxia is represented as a heat
  map. The color scale indicates relative expression levels, with magenta representing
  upregulated and green representing downregulated gene expression in hypoxia compared
  to normoxia. (e) Correlation analysis between hypoxia and stemness using stem cell
  signatures from a previously published single-cell RNA sequencing dataset [38].
  A Spearman rank correlation test was performed. (f) Cell type deconvolution was
  performed via CIBERSORTX using our previously published single-cell RNA sequencing
  dataset of the same ileum enteroids (derived from donor 1) [41] to infer the stem
  cell fractions of the different samples. An unpaired signed-rank Wilcoxon test was
  performed. p ≥ 0.05 = ns (not significant), <0.05 = *
