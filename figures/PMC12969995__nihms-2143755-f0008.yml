figure_title: Modulating the immune activation and cytokine response to severe influenza
caption: a,b, Cytokine release profiles in the interstitium (a) and airway (b) of
  IC-LOC devices in response to infection and treatment with Tamiflu, IL-1βi (canakinumab)
  or TNF-αi (infliximab). N = 5 independent devices. c, CellChat predicted L–R interactions
  comprising the CXCL pathway, with CXCL12–CXCR4 appearing as the key L–R pair. d,e,
  CXCR4 expression levels in CXCR4+ NK cells (d) and CD8 T cells (e) in uninfected
  and infected devices, determined from scRNA-seq data. Significance determined via
  one-way ANOVA followed by Kruskal–Wallis test. f, Flow cytometry quantification
  of live PBMC cell counts per device in the circulatory fraction of IC-LOC devices
  in response to H1N1 infection and treatment with CXCR4 inhibitor AMD3100. N = 5
  samples for ±H1N1 and N = 3 samples for AMD3100, with each sample comprised of 3
  pooled IC-LOC devices. g,h, Activation phenotypes of NK cells (g) and CD8 T cells
  (h) in response to influenza infection and CXCR4 inhibition with AMD3100. Marker
  expression plotted as fold change from uninfected devices. N = 5 samples for ±H1N1
  and N = 3 samples for AMD3100, with each sample comprised of 3 pooled IC-LOC devices.
  i, Cytokine release profiles in the interstitium of IC-LOC devices in response to
  infection and treatment with AMD3100. N = 10 independent devices across at least
  2 independent experiments. j,k, Quantified viral levels as determined via particle
  count from confocal fluorescence microscopy in the airway (j) and interstitium (k)
  of infected devices left untreated or treated with Tamiflu, IL-1βi (canakinumab),
  TNF-αi (infliximab) or CXCR4i (AMD3100). N = 18 ROIs from 3 independent devices.
  All devices use immune cells from the same immune cell donor. Statistical significance
  determined via ordinary one-way ANOVA unless otherwise specified. Data are presented
  as mean values ± s.d
