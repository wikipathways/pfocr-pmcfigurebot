figure_title: Analysis and concentrations of carotenoid and flavonoid metabolites
  in the fruits of different groups of tomatoes.
caption: 'Analysis and concentrations of carotenoid and flavonoid metabolites in the
  fruits of different groups of tomatoes. (A) Kyoto Encyclopedia of Genes and Genomes
  (KEGG) enrichment map of carotenoid metabolites in three comparison groups: CYRSV
  (red-yellow) vs. CK (red), CYRSV (yellow) vs. CK (red), and CYRSV (yellow) vs. CYRSV
  (red-yellow). A higher enrichment factor indicates a greater degree of enrichment.
  (B) Differentially abundant metabolite enrichment pathways for flavonoids in three
  comparison groups: CYRSV (red-yellow) vs. CK (red), CYRSV (yellow) vs. CK (red),
  and CYRSV (yellow) vs. CYRSV (red-yellow). The color and size of the points represent
  the range of the p value and the number of differentially abundant metabolites enriched,
  respectively. A more intense red color indicates more significant enrichment. (C)
  Lycopene, α-carotene, β-carotene, and lutein contents of two colors of lesion and
  normal (CK) fruits were quantified. (D) Dihydrokaempferol, luteolin, rutin, (-)-catechin,
  naringenin chalcone, and quercetin contents of two colors of lesion and normal (CK)
  fruits were quantified. FW, fresh weight. Asterisk indicate significant differences:
  * p < 0.05, ** p < 0.01, *** p < 0.001'
