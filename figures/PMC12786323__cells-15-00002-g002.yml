figure_title: The mechanisms of the integrated stress response (ISR) pathway and its
  pharmacological modulation.
caption: 'The mechanisms of the integrated stress response (ISR) pathway and its pharmacological
  modulation. The ISR is initiated by stress-sensing kinases (PERK, GCN2, PKR, HRI),
  which phosphorylate eIF2α. Upon ISR activation, global cap-dependent translation
  (via impaired ternary complex formation) is suppressed while enabling selective
  translation of ISR transcription factors (e.g., ATF4/ATF3) and induction of stress-adaptive
  gene programs. Negative feedback is provided by GADD34/CReP-containing phosphatase
  complexes. Pharmacologic modulators are indicated: GSK2606414/GSK2656157 (PERK inhibitors),
  2-aminopurine/C16 (PKR inhibitors), halofuginone (GCN2 activator), and salubrinal
  (inhibitor of eIF2α dephosphorylation by PP1–PPP1R15 complexes, prolonging p-eIF2α
  signaling). Inhibitors are shown in red, while activators are in green'
