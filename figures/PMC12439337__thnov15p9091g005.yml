figure_title: VPA modulates multiple metabolites related with programmed cell death.
caption: VPA modulates multiple metabolites related with programmed cell death. In
  this study, the HCC cell line MHCC97-H underwent treatment with VPA (2 mM) for a
  duration of 24 h. Subsequently, the cell samples were collected for metabolomics
  analysis. The primary metabolic alterations were assessed using both Positive Mode
  and Negative Mode (A). The analysis of secondary metabolites highlighted both upregulated
  and downregulated metabolites, as illustrated in Figure 5B. Furthermore, the relationship
  between mass-to-charge ratio and P value was examined in Figure 5C, while the interactions
  among differential metabolites and key metabolic pathways were depicted in a network
  plot (D). Lastly, Figure 5E presented the significant metabolic pathways in HCC
  cells that were affected by VPA
