figure_title: Network pharmacology-based mechanism analysis of QFD against SIC.
caption: 'Network pharmacology-based mechanism analysis of QFD against SIC. (A) Wayne
  diagram. (B) Component–target network diagram of QFD against SIC. Components and
  genes are shown in different sizes according to their degree values. HQ 1-17 and
  FZ 1-13 correspond to the compositional information in Tables S4 and S5, respectively.
  Abbreviations: HQ, Huangqi; FZ, Fuzi. (C) KEGG pathway bubble map. (D) Bar chart
  of GO enrichment analysis for the BP-CC-MF triad. (E) Core genes screened from the
  PPI network. On the left is the visualized PPI network mapped with Cytoscape. The
  larger the degree value of the gene, the larger the shape and the redder the color.
  On the right is the network of the 26 core genes screened using Cytoscape. The larger
  the shape and the more orange the color, the more significant their role in the
  whole network. The thicker the connecting line between the genes, the more significant
  the interaction between the genes'
