figure_title: Multi-omics analyses identified dehydrocholesterol reductase 24 (DHCR24)
  as a biomarker of age-related meibomian gland dysfunction (ARMGD).
caption: 'Multi-omics analyses identified dehydrocholesterol reductase 24 (DHCR24)
  as a biomarker of age-related meibomian gland dysfunction (ARMGD). (A) Multi-omics
  study design for biomarker screening. In general, meibomian glands (MGs) of two-month-old
  (n = 15) and two-year-old (n = 15) mice were dissected for lipidomics (6 vs. 6),
  proteomics (3 vs. 3), and transcriptomics (6 vs. 6) profiling, followed by systematic
  bioinformatics analyses for biomarker identification. (B) Heatmap visualization
  of 46 differentially expressed lipids in 7 classes (PE, SM, PS, PC, DG, ChE, and
  TG) between the two-month-old (Y) and two-year-old (O) groups. ChE, cholesteryl
  esters; DG, diglyceride; PE, phosphatidylethanolamine; PC, phosphatidylcholine;
  PS, phosphatidylserine; SM, sphingomyelin; TG, triglyceride. (C) Integrated proteomics
  and transcriptomics analyses identified the shared significant pathways (*p < 0.05;
  dashed line) in three categories, including human diseases, organismal systems,
  and metabolism. (D) Combined transcriptomics and proteomics analyses of steroid
  biosynthesis pathway identified DHCR24 as the only biomarker differentially expressed
  in both mRNA and protein levels between the two-month-old and two-year-old groups.
  (E) Schematic diagram for subsequent DHCR24 verification, including immunohistochemistry
  (IHC) for paraffin-embedded human tarsal plate samples, and Western blot (WB) and
  immunofluorescence (IF) for mouse MGs. (F, G) IHC staining and H-score for DHCR24
  in 3-year-old and 40-year-old human tarsal plate samples. Scale bars: 50 μm. (H,
  I) IF and relative fluorescence intensity for DHCR24 in two-month-old and two-year-old
  mouse MGs. Scale bars: 50 μm. (J, K) DHCR24 protein expression in two-month-old
  and two-year-old mouse MGs'
