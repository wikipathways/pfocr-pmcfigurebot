figure_title: YY1-mediated DNA repair pathways in drug resistance.
caption: YY1-mediated DNA repair pathways in drug resistance. YY1 promotes DNA repair
  via transcriptional activation of SHLD1/PARP1, inhibiting PP2A-mediated dephosphorylation
  of PTEN, binding guanine quadruplexes (G4s) to restrict RAD51-dependent homologous
  recombination, and activating AKR1C3 and Hedgehog signaling, and recruits BRD2/4
  to cis-regulatory elements of TCF7L2 to modulate its expression. These mechanisms
  enhance DNA repair and enable evasion of DNA-damage-induced cell death, establishing
  YY1 as a key mediator of therapeutic resistance. Arrows are used to show activation;
  arrows terminated with a bar represent inhibition
