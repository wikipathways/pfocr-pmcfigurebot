  via NF-kB.'
caption: 'Gene Set Enrichment Analysis (GSEA) for patients with high and low JCHAIN
  expression: (A) GSEA of hallmark gene sets in the high JCHAIN expression group,
  highlighting immune and inflammatory pathways, including complement, IL6-JAK-STAT3,
  inflammatory response, Interferon gamma signaling, KRAS signaling, and TNFA signaling
  via NF-kB. Distinct enrichment patterns are shown in the enrichment score (ES) curves.
  (B) GSEA in the low JCHAIN expression group, enriched in estrogen responses, cell
  cycle, and transcriptional regulation pathways. (C) Immune-related functional gene
  sets enriched in the high JCHAIN expression group in C7 collection. (D) GSEAfor
  the iSE2410 dataset (CTRL vs IL35-treated TCONV CD4 T cells),showing significant
  enrichment with a p-value of 0.0003. In subfigure (D), the black line marks gene
  positions, and the red-blue heatmap shows expression abundance (deeper red = larger
  logFC, deeper blue = smaller logFC)'
