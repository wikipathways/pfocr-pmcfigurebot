figure_title: Galectin-3-binding protein (LGALS3BP) knockout (KO) mice exhibited improved
  insulin resistance and reduced liver damage when fed a high-fat diet (HFD).
caption: Galectin-3-binding protein (LGALS3BP) knockout (KO) mice exhibited improved
  insulin resistance and reduced liver damage when fed a high-fat diet (HFD). (A)
  Schematic representation of the mouse model fed either chow diet (CD) or HFD for
  12 weeks. (B) Body weight measurements in wild-type (WT) and LGALS3BP KO mice fed
  CD or HFD. Week 0 indicates the baseline body weight measured immediately prior
  to diet initiation. (C) Serum levels of alanine aminotransferase (ALT) and aspartate
  aminotransferase (AST) in WT and LGALS3BP KO mice fed CD or HFD (n=7). (D) Glucose
  tolerance test (GTT; WT CD, n=8; KO CD, n=8; WT HFD, n=6; KO HFD, n=10) and (E)
  insulin tolerance test (ITT; WT CD, n=7; KO CD, n=7; WT HFD, n=6; KO HFD, n=10)
  were performed in WT and KO mice after 11 and 12 weeks of CD or HFD exposure, respectively.
  Corresponding quantification by area under the curve (AUC) is presented to the right.
  (F) Expression of hepatic glucose metabolism-related genes in WT and KO mice fed
  HFD (n=7). (G) Fasting serum glucose levels, and (H) fasting insulin concentrations
  analyzed in WT and KO mice fed HFD (WT HFD, n=6; KO HFD, n=7). (I) Immunoblot analyses
  of key proteins involved in the hepatic insulin signaling pathway in WT and KO mice
  fed HFD (n=7). Each band represents a liver tissue extract from an independent mouse.
  Protein intensities are presented as bar graphs; individual data points are displayed
  to the right. Statistical significance was determined using two-way analysis of
  variance (ANOVA) with Tukey’s post hoc test for (C-E) and a two-tailed unpaired
  Student’s t test for (F-I).All data are presented as mean±standard deviation. G6pase,
  glucose-6-phosphatase; Pck1, phosphoenolpyruvate carboxykinase 1; Gck, glucokinase;
  Gys2, glycogen synthase 2; Pygl, glycogen phosphorylase; Pdk4, pyruvate dehydrogenase
  kinase 4; AKT, protein kinase B; FoxO1, forkhead box protein O1; GSK3β, glycogen
  synthase kinase 3 beta; mTORC1, mammalian target of rapamycin complex 1. aP<0.01,
  bP<0.001 compared to WT CD; cP<0.05, dP<0.01 compared to WT HFD
