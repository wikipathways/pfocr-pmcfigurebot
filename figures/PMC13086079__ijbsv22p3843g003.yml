figure_title: Frmd5 activates the Jak2-Stat3 signaling pathway by enhancing the interaction
  between Jak2 and Stat3.
caption: 'Frmd5 activates the Jak2-Stat3 signaling pathway by enhancing the interaction
  between Jak2 and Stat3. (A) Schematic representation of the Frmd5 gene structure
  in the urinary epithelium-specific Frmd5 knockout mice model. Blue arrows P1 and
  P2 indicate the positions of primers used for genotyping. (B) Schematic diagram
  of the breeding strategy used to generate urinary epithelium-specific Frmd5 knockout
  mice. (C) PCR genotyping results. The upper panel shows the presence of the Cre
  recombinase gene. The lower panel shows PCR products distinguishing wild-type and
  floxed Frmd5 alleles. (D) Schematic representation of the sectioning positions corresponding
  to panel G. (E) Immunohistochemistry analysis of Frmd5 expression in the vagina
  of 2-month-old and 4-month-old Cdh16-Cre-; Frmd5flox/flox and Cdh16-Cre+; Frmd5flox/flox
  mice. Scale bar: 50 μm in the original images, and 20 μm in the magnified views
  in the black boxes. (F) Immunohistochemical staining showing the distribution of
  Jak2, Stat3, p-Stat3 (Y705), and p-Stat3 (S727) proteins in the vaginal epithelial
  cells of 2-month-old and 4-month-old mice before and after epithelial-specific knockout
  of Frmd5. (G) Quantification of Frmd5-positive cells in the vaginal epithelium of
  2-month-old and 4-month-old Cdh16-Cre-; Frmd5flox/flox and Cdh16-Cre+; Frmd5flox/flox
  mice. Data are presented as mean ± SEM. ** P < 0.01. (H) Quantification of Jak2,
  Stat3, p-Stat3 (Y705), and p-Stat3 (S727) positive cells in vaginal epithelial cells.
  (I) Western blot analysis of the expression of proteins related to the Jak2-Stat3
  signaling pathway in the vagina of 2-month-old and 4-month-old mice before and after
  epithelial-specific knockout of Frmd5. (J) Co-IP analysis the impact of Frmd5 depletion
  on the interaction between Jak2 and Stat3 in the intestinal tissue of Frmd5-/- mice.
  (K) Co-IP analysis of the effect of FRMD5 knockdown on the interaction between JAK2
  and STAT3 in HeLa cells. Scale bars: 50 μm in the original images; 20 μm in the
  magnified images within the black boxes. Experiments were independently repeated
  at least three times. Data are presented as mean ± SEM. * P < 0.05'
article_title: Loss of Frmd5 Inhibits Jak2-Stat3 Signalling Pathway and Impairs Cell
