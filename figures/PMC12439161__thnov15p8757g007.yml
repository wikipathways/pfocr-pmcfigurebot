figure_title: Mechanisms of tumor suppression by IMSFs under AMF Exposure.
caption: Mechanisms of tumor suppression by IMSFs under AMF Exposure. (A) Schematic
  diagram of the RNA sequence analysis of 4T1 cells from the Control and IMSFs+AMF
  groups. (B) Cumulative release of sorafenib from IMSFs at different pH levels (n
  = 3). (C) Comparative images of the transmission electron microscope of two groups
  of 4T1 cells after various treatments. (D) A volcano plot illustrates the differentially
  expressed genes between the Control and IMSFs+AMF groups. (E) Representative GO
  pathways associated with genes significantly differentially expressed between the
  Control and IMSFs+AMF groups. (F) The glutathione metabolism pathway is enriched
  in the IMSFs+AMF group
