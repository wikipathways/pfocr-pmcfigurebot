figure_title: The forskolin biosynthetic pathway from the endogenous precursor GGDP.
caption: 'The forskolin biosynthetic pathway from the endogenous precursor GGDP. 13-R-MO:
  13-R-Manoyl Oxide. Indicated are the two diterpene synthases (PbTPS2 and -3), the
  three cytochrome P450s (PbCYP76A11, -H15 and -H16) and the acetyl transferase (PbACT1-8)
  known to catalyze the final step in the biosynthesis of forskolin. The genes encoding
  all six enzymes were all obtained from Plectranthus barbatus. The reactions catalyzed
  by the individual cytochrome P450s, as identified by Pateraki et al. [6], are indicated
  in color'
