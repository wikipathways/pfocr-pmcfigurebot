figure_title: Schematic diagram of EMX2-CADM1 axis as a tumor suppressor in renal
  cell carcinoma
caption: EMX2-mediated transcriptional regulation orchestrates multifaceted suppression
  of RCC progression. EMX2 directly binds to the CADM1 promoter and triggers transcriptional
  expression. Upregulation of EMX2-CADM1 enhances PARP1 activity and disrupts mitochondrial
  membrane potential (MMP), leading to parthanatos in movable and migrating RCC cells.
  EMX2-CADM1 also promotes RCC cell apoptosis under adherent conditions through the
  activation of the Caspase-3 pathway. Concurrently, increased EMX2-CADM1 expression
  inhibits PI3K-AKT signaling, impairing RCC cell proliferation and migration. These
  orchestrated effects ultimately converge to the suppression of renal tumor growth
  and invasion
article_title: Empty spiracles homeobox 2 (EMX2) transcription factor functions as
  a tumor suppressor in renal cell carcinoma by targeting CADM1
