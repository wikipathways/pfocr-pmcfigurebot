caption: An illustration depicting the neural pathway of the brain–gut–microbiota
  axis in patients with amyotrophic lateral sclerosis (ALS). Altered gut microbiota
  interacts with enterochromaffin cells, leading to the release of neuroactive substances
  such as serotonin that signal through the vagus nerve to the brain. These signals
  contribute to neuroinflammation. Additionally, changes in microbial metabolites
  influence ENS activity and may contribute to constipation, a common symptom in patients
  with ALS
