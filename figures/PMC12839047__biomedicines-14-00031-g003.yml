figure_title: Two competing metabolic pathways for L-arginine.
caption: 'Two competing metabolic pathways for L-arginine. When UT-B is inhibited,
  the concentration of urea in endothelial cells increases. Excessive urea can down-regulate
  arginase, thereby reducing the substrate L-arginine–arginase metabolic pathway and
  promoting the biosynthesis pathway of NO. NO: nitric oxide; NOS: NO synthase; UT-B:
  urea transporter-B; ODC: ornithine decarboxylase; OAT: ornithine aminotransferase.
  The red sharp arrow denotes promotion/activation, while the red blunt arrow represents
  inhibition/blockade'
