figure_title: Mechanism diagram of gut microbiota-mediated pathogenesis in HCC via
  the gut–liver axis.
caption: 'Mechanism diagram of gut microbiota-mediated pathogenesis in HCC via the
  gut–liver axis. The figure integrates key pathways through which gut microbial metabolites
  influence HCC development in a context-dependent manner. BAs signaling: Hydrophobic
  BAs (e.g., DCA) promote DNA damage, inflammasome activation, and suppression of
  anti-tumor immunity, while hydrophilic BAs (e.g., UDCA) exert protective effects
  via FXR/TGR5 activation and ER stress alleviation. SCFAs metabolism: SCFAs (butyrate,
  acetate, propionate) modulate HDAC activity, GPR43 signaling, and immune cell functions
  (e.g., ILC3s, CD8+ T cells), with outcomes depending on concentration, receptor
  expression, and microenvironmental pH. TMAO pathway: TMAO derived from gut microbial
  metabolism of choline promotes HCC progression via MAPK/ERK and ILK/AKT/mTOR axes,
  while its reduction attenuates fibrosis and inflammatory signaling. Indole metabolite
  network: Microbial tryptophan metabolites (e.g., IPA, I3P) differentially activate
  AhR, leading to either enhanced anti-tumor immunity (via T cell stemness) or immune
  tolerance and MYC-driven proliferation, depending on metabolite species and tumor-immune
  context. LPS-triggered cascade: LPS translocation activates TLR4-mediated NLRP3
  inflammasome, mtDNA-cGAS-STING signaling, and hepatic stellate cell transdifferentiation,
  driving chronic inflammation, fibrosis, and tumor progression. In the diagram, the
  black arrow indicates the direction of movement, orange arrows indicate pro-carcinogenic
  pathways, while blue arrows denote tumor-suppressive pathways'
article_title: 'The Dual Role of Gut Microbiota and Their Metabolites in Hepatocellular
  Carcinoma: A Context-Dependent Framework'
