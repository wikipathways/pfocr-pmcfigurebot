figure_title: Schematic representation of the nociceptive transmission pathway.
caption: Schematic representation of the nociceptive transmission pathway. This figure
  illustrates the key anatomical components involved in the transmission of pain signals,
  beginning with the activation of peripheral nociceptors and culminating in the perception
  of pain in the cerebral cortex. It outlines the sequential steps of signal transduction,
  including primary afferent neuron activation, synaptic transmission in the dorsal
  horn of the spinal cord, ascending pathways (such as the spinothalamic tract), and
  the integration of nociceptive signals in the cerebral cortex. The red-colored neuron
  represents the first-order neuron, the orange one corresponds to the second-order
  neuron, and the green neuron denotes the third-order neuron
