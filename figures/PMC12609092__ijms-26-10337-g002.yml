figure_title: Physiological and pathological conditions mediated by JAK2 signaling
  and hypotheses on the role of the V617F mutation.
caption: Physiological and pathological conditions mediated by JAK2 signaling and
  hypotheses on the role of the V617F mutation. The figure compares the physiological
  condition (A) with the pathological one (C). In panel (B) is represented the wild-type
  JAK2, characterized by the inhibitory activity of JAK2 pseudokinase (JH2 domain)
  on JH1. (A) In normal conditions, upon ligand (in the figure represented by the
  orange triangle) binding to the transmembrane receptor, this undergoes dimerization,
  activating the associated tyrosine kinase JAK2. Activated JAK2 phosphorylates specific
  tyrosine residues on the receptor, generating docking sites for STAT proteins. Once
  recruited, STATs are subsequently phosphorylated by JAK2, dimerize, and translocate
  into the nucleus, where they regulate the transcription of target genes like Socs3,
  Il8 and Mcl1. (C) V617F mutation in the JAK2 JH2 domain induces constitutive activation
  of the JAK/STAT pathway regardless of the presence of the ligand. The pathogenic
  JAK2 constitutive activation is typical of some MPNs. Pathogenetic hypotheses include
  the functional impairment of the JH2 domain leading to a constitutive activation
  of JAK2 even in the absence of external stimuli (D), an alteration of the interaction
  with the F595 residue, which is located in the αC helix of the JH2 domain, which
  alters the helix’s structure (E), and an abnormal interaction between the SH2 and
  JH2 domains in the SH2-JH2 linker (F)
