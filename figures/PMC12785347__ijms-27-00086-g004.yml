figure_title: Molecular mechanisms underlying the role of SERPINE1/PAI-1 as a switch
  between cell differentiation and senescence.
caption: 'Molecular mechanisms underlying the role of SERPINE1/PAI-1 as a switch between
  cell differentiation and senescence. The schematic illustrates the intracellular
  signaling cascades by which PAI-1 directs cell fate. (Bottom Panel) Senescence Pathways:
  PAI-1 promotes cellular senescence through multiple mechanisms: (i) The P53/P21/pRb
  pathway and P16 activation trigger cell cycle arrest; (ii) PAI-1 can act on P53
  through proteasome to stabilize it and interact with P53. (iii) IGFBP3 is downstream
  of PAI-1, pharmacological agents like TM5441 inhibit PAI-1. (iv) As2O3 acts on P53
  through P38/JNK signaling to produce SASP such as β-galactosidase. (v) Accumulation
  of ROS and DDR promote the release of SASP, leading to osteoporosis, cardiovascular
  disease, and liver fibrosis. (Top Panel) Differentiation Pathways: PAI-1 regulates
  differentiation via distinct routes: (i) Modulation of PAR signaling affects adipocyte
  differentiation; (ii) Regulation of the MMPs and uPA/tPA signaling pathways by PAI-1
  is important for the ECM, leading to pulmonary fibrosis. (iii) The TLR4/ERK pathway
  is implicated in neural differentiation (e.g., Parkinson’s disease context); (iv)
  In osteoblasts, Metformin downregulates miR-181a-5p, relieving the suppression of
  PAI-1 and enhancing RUNX2/OPN expression. SIRT6 also modulates these epigenetic
  landscapes. (v) SIRT7 upregulates P16 by inhibiting PAI-1 and affects the differentiation
  of chondrocytes. The “Traffic Light” represents the critical decision node where
  PAI-1 levels determine the shift between differentiation (Green/Go) and senescence
  (Red/Stop). Abbreviations: As2O3, arsenic trioxide; DDR, DNA damage response; ECM,
  extracellular matrix; ERK, extracellular signal-regulated kinase; JNK, c-Jun N-terminal
  kinase; LPS, lipopolysaccharide; MMP, matrix metalloproteinase; NF-κB, nuclear factor
  kappa-light-chain-enhancer of activated B cells; OPN, osteopontin; PAR, protease-activated
  receptor; Rb, retinoblastoma protein; ROS, reactive oxygen species; RUNX2, Runt-related
  transcription factor 2; SASP, senescence-associated secretory phenotype; SIRT, sirtuin;
  TLR4, Toll-like receptor 4; uPA, urokinase-type plasminogen activator; uPAR, urokinase
  plasminogen activator receptor. Created in BioRender. Ke, J. (2025) https://BioRender.com/e8qwrd2'
