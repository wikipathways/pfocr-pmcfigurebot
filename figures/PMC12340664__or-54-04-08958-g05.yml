figure_title: PTP4A1 promotes intrahepatic cholangiocarcinoma cell proliferation,
  migration and invasion by regulating the PTEN/PI3K/AKT/GSk3α pathway.
caption: PTP4A1 promotes intrahepatic cholangiocarcinoma cell proliferation, migration
  and invasion by regulating the PTEN/PI3K/AKT/GSk3α pathway. (A) WB was performed
  to examine the expression and phosphorylation of PTEN, PI3K, AKT and GSk3α in PTP4A-KD
  RBE and HCCC-9810 cells treated with the PTEN inhibitor SF1670 or the GSK3α inhibitor
  SB216763. (B and C) A 5-ethynyl-2′-deoxyuridine assay was used to evaluate the effects
  of the PTEN inhibitor SF1670 or the GSK3α inhibitor SB216763 on the proliferation
  of PTP4A-KD RBE and HCCC-9810 cells. (D-G) SF1670 and SB216763 attenuated the inhibitory
  effects of PTP4A1 knockdown on (D and E) migration and (F and G) invasion in RBE
  and HCCC-9810 cells. (H) WB was used to evaluate the ERK and TGF-β signaling pathways
  in RBE and HCCC-9810 cells co-treated with SF1670 or SB216763 and TGF-β. **P<0.01.
  PTP4A1, protein tyrosine phosphatase 4A1; PTEN, phosphatase and tensin homolog;
  WB, western blotting; KD, knockdown; NC, negative control; p-, phosphorylated
