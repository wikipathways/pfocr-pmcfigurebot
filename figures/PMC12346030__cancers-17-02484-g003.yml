figure_title: CAF-mediated recruitment of immune cells and mechanisms of immunosuppression
  in the TME.
caption: CAF-mediated recruitment of immune cells and mechanisms of immunosuppression
  in the TME. CAFs shape the tumor microenvironment toward a protumorigenic and immunosuppressive
  milieu by recruiting and affecting functions of various innate and adaptive immune
  cells. CAFs modulate the antitumor activity of immune cells through the secretion
  of multiple chemokines, cytokines, and other effector molecules. They (i) promote
  the transdifferentiation or polarization of immune cells such as tumor-associated
  macrophages (TAMs), tumor-associated neutrophils (TANs), mast cells (MCs), dendritic
  cells (DCs), and T lymphocytes into certain protumorigenic cell subsets; (ii) recruit
  and facilitate the activities of immune-inhibitory cells, including M2-type TAMs,
  N2-type TANs, regulatory DCs (rDCs), regulatory T (Treg) cells, and myeloid-derived
  suppressor cells (MDSCs); and (iii) restrict the cytotoxic activity and cytokine
  production of NK cells and cytotoxic T lymphocytes (CTLs). Reciprocally, several
  infiltrating immune cells such as TAMs, TANs, MCs, and DCs can contribute to the
  formation of immune-suppressive loops by effecting CAF activation and function.
  CAFs can also upregulate the expression of immune checkpoint molecules such as PD-1/PD-L1,
  CTLA4)/B7, LAG-3, and TIM-3 to induce T-cell (CD8 and CD4) dysfunction. Moreover,
  CAF-mediated remodeling of the ECM facilitates immune suppression through the production
  of fibronectin, collagen, MMPs, and activation of the focal adhesion kinase (FAK)
  signaling pathway (Created in BioRender. Amin, M. (2025) https://BioRender.com/92cbdud
  (accessed on 16 June 2025))
