figure_title: Ajuforrestin A impedes A549 cell migration through the FAK signal pathway.
caption: Ajuforrestin A impedes A549 cell migration through the FAK signal pathway.
  A549 cells were exposed to ajuforrestin A for 48 h, followed by Western blotting.
  (A) Representative micrographs of A549 cells at 0 and 48 h. (B) Bar graph of the
  migration rate. (C) Western blot results showing the expression of FAK, p-FAK, and
  MMP2. (D) Bar graph depicting the relative protein expression levels compared to
  the control. Data are expressed as mean ± SD. *** p < 0.001 relative to the control
  group
