figure_title: DDR2-expressing human ovarian CAF68 cells activate an NRF2-dependent
  chronic oxidative stress response to resist ferroptosis
caption: (A) Schematic of the KEAP1 mediated NRF2 regulatory pathway. (B) Western
  blot of KEAP1, NRF2, and ATF4 expression in shSCR, shDDR2, and shDDR2-DDR2 rescued
  (Rescued) CAF68 cells. The bands are from the same membrane development but presented
  separately since they were not contiguous. Ticked numbers indicate molecular weights
  (kDa). (C) Expression of HMOX1 mRNA in shSCR and shDDR2 CAF68 cells determined by
  qPCR. (D) Viability of shSCR CAF68 cells treated with indicated doses of Erastin
  (16h) in combination with the specific NRF2 inhibitor ML385 (10μM) or not. (E) Viability
  of shDDR2 CAF68 cells treated with indicated doses of Erastin (16h) in combination
  with the NRF2 activator TBHQ (10μM) or not. (C) Data are mean ± SEM (n=6 biological
  replicates). One sample t-test; ** p < 0.002; two-tailed. (D-E) Data are mean ±
  SEM (n=3 biological replicates). Two-way ANOVA; *** p < 0.0002, **** p < 0.0001;
  Tukey’s multiple comparisons
article_title: DDR2 confers ferroptosis resistance to cancer-associated fibroblasts
  and attenuates PARPi sensitivity of ovarian tumor cells
