figure_title: DE-miRNAs from RBCs of young and old donors
caption: '(A) Significantly upregulated and (B) downregulated exosomal miRNAs in RBCs
  of OM donors considered in this study. (C) Significantly upregulated and (D) downregulated
  exosomal miRNAs in RBCs of OF donors considered in this study. (E) Volcano plot
  of exosomal miRNAs derived from RBCs of young and old donors. Cutoff thresholds
  for downstream analysis: −1 ≤ log2FC ≥ 1 and adjusted P value <.05. (F) KEGG and
  (G) miRWalk pathways enriched from DE-miRNAs in old donors, with young donors as
  the reference group. Neurological pathways enriched, dementia and frontotemporal
  dementia, are highlighted in green. (H) Volcano plot of exosomal miRNAs differentially
  expressed in YF and OF donors. (I) miRWalk pathways enriched from DE-miRNAs from
  OF donors, with young donors as the reference group. Cutoff thresholds for downstream
  analysis: −1 ≤ log2FC ≥ 1 and raw P value <.05. (J) Volcano plot of exosomal miRNAs
  derived from RBCs of YM and OM donors. ALS, amyotrophic lateral sclerosis; FDR,
  false discovery rate; OF, old female; OM, old male; YF, young female; YM, young
  male. *P < .5, **P < .01, and ***P < .001'
