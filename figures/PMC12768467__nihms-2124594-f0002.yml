figure_title: Transmembrane topology and oligomerization of TMEM65
caption: 'a, Proteinase K digestion of TMEM65. C-terminally 1D4-tagged MCU and EMRE,
  with known orientations as depicted, serve as controls. Western blot signals of
  all proteins were obtained using anti-1D4 antibody.b, Proposed transmembrane topology
  of TMEM65. A C-terminal 1D4 tag was included in TMEM65 for all subsequent experiments
  unless otherwise noted.c, CoIP testing TMEM65 oligomerization and interaction with
  NCLX. 1D4-tagged TMEM65 or NCLX was immobilized to pull down FLAG-tagged TMEM65.
  WCL: whole-cell lysate; IP: eluate. Western blot signals were obtained using anti-1D4
  or anti-FLAG antibodies. In WCL, TMEM65 primarily appeared as monomers (~20 kDa),
  while the IP fraction showed increased dimer (~40 kDa) presence, probably due to
  protein oxidation during the 1-hour binding process. NCLX without MTS was expected
  at ~48 kDa (the upper band in WCL and IP), but we also observed an additional minor
  band at ~25 kDa, possibly representing degraded NCLX.d, TMEM65 crosslinking. Western
  blot using anti-1D4 antibody shows complete crosslinking of 1D4-tagged TMEM65 to
  dimers within 30 minutes in mitochondrial lysates by 0.01% glutaraldehyde. Expected
  positions of different TMEM65 oligomers are indicated, showing absence of trimer
  or tetramer formation.e, Predicted structure and putative ion-binding residues of
  TMEM65. The grey mesh area (left) illustrates a water-accessible pathway leading
  to a potential cation binding area (box). A magnified view (right) highlights residues
  in this area.f, Impact of ion-binding residue mutations on mito-NCX activity. WT
  or mutant TMEM65 was expressed in TMEM65-KD HEK cells at comparable levels, as shown
  by Western blot using anti-1D4 antibody. Actin: loading control. Control: untransfected
  cells. Data are presented as mean ± SEM. Statistical analysis was performed comparing
  control or mutants to WT using unpaired, two-tailed t-test. Independent biological
  replicates: Control = 3; WT = 6; D132A = 3; D167A = 3; N163A = 3; S166A = 3.Molecular
  weight marker unit: kDa. All independent biological replicates in panels a, c, and
  d—conducted 6, 3, and 5 times, respectively—led to similar results'
