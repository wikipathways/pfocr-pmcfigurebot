figure_title: The miR-425-ZNF24-CCL8 signaling pathway is upregulated in brain metastases
  and activated astrocytes of mice intracardially injected with breast cancer cells
  overexpressing miR-425.
caption: The miR-425-ZNF24-CCL8 signaling pathway is upregulated in brain metastases
  and activated astrocytes of mice intracardially injected with breast cancer cells
  overexpressing miR-425. (A) Increased EV-miR-425 expression in mouse serum from
  the SKBR3-Luc-miR-425 group compared to the control group. miR-425 expression measured
  by RT-qPCR (N = 5 per group). (B) SKBR3-Luc-miR-425 group mouse serum has significantly
  higher levels of mouse CCL8 as measured by ELISA (N = 7 per group). (C) No significant
  difference in mouse SCF levels in SKBR3-Luc-miR-425 or control mice serum as measured
  by ELISA (N = 5 per group). (D,E) GFAP H-score and intratumoral astrocytes are significantly
  higher in brain metastases from the SKBR3-Luc-miR-425 mouse group than the control
  in mouse brain sections as measured by IHC (N = 5 per group). (F) Brain metastases
  from the SKBR3-Luc-miR-425 group have significantly increased Ki-67 positive cells
  as measured by IHC (N = 5 per group). (G) Tumor-adjacent and infiltrative astrocytes
  in brain metastases from the SKBR3-Luc-miR-425 group have decreased ZNF24 staining
  measured by IHC (N = 5 per group). (H) Representative IHC images at 20× magnification.
  Scale bar indicates 100 µm. (I) Co-staining IF of ZNF24 (green) and GFAP (red) in
  mouse brain sections containing brain metastases. Nuclei were stained with DAPI
  (blue). Representative images at 20× magnification. Scale bar indicates 100 µm.
  (J) Schematic of described mechanism by which breast cancer-derived EV-miR-425 activates
  astrocytes by suppressing ZNF24, increasing CCL8, and thereby promoting BCBM. Fold
  change was calculated in panel A. Student’s t-test used in panels (A–G,I)
article_title: Breast Cancer-Derived Extracellular Vesicle miR-425-5p (miR-425) Promotes
  Brain Metastasis via Activating Astrocytes Through the Novel miR-425-ZNF24-CCL8
  Signaling Axis
