figure_title: PARP7 knockout or inhibition promotes IFN-I signaling initiated by IFNβ
  treatment
caption: (A) The mRNA levels of CXCL10 and ISG15 (measured by qPCR) under IFNβ (2
  ng/mL) treatment in MEF Parp7+/+ and Parp7−/− cells. Statistical significance was
  determined using an unpaired t test (*p < 0.05, **p < 0.01, ***p < 0.001). Error
  bars represent standard error, n = 4.(B) Immunoblot analysis of IFN-I signaling
  pathway in MEF Parp7+/+ and Parp7−/− cells with or without IFNβ (2 ng/mL) treatment.(C)
  The mRNA levels of CXCL10 and ISG15 (measured by qPCR) under 3 h of IFNβ (2 ng/mL)
  treatment in MEF Parp7+/+ cells with or without RBN-2397 (500 nM). Statistical significance
  was determined using an unpaired t test (**p < 0.01). Error bars represent standard
  error, n = 3.(D) Immunoblot analysis of IFN-I signaling pathway in Parp7+/+ MEF
  cells under IFNβ (2 ng/mL) treatment with or without RBN-2397 (500 nM).All experiments
  were done in triplicates. See also Figure S1
