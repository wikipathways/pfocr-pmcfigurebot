figure_title: Immune therapy response prediction based on palmitoylation-associated
  prognostic model.
caption: Immune therapy response prediction based on palmitoylation-associated prognostic
  model. (a) Correlation analysis between the palmitoylation-based risk score and
  immune therapy–related pathways, showing significant positive correlations with
  most pathways. (b, c) Immune infiltration analysis using the ESTIMATE algorithm,
  comparing the immune score and ESTIMATE score between the high-risk and low-risk
  groups. (d, e) Differential expression of immune-related genes based on ssGSEA and
  Cibersort algorithms, highlighting significant differences in immune profiles between
  the two risk groups. (f) TIDE analysis comparing immune therapy response predictions
  between the high-risk and low-risk groups, indicating a higher proportion of responders
  in the low-risk group. (g) Correlation between the palmitoylation-based risk score
  and immune dysfunction levels. (h) Validation of immune therapy response predictions
  using the Submap algorithm, with results consistent with TIDE analysis, showing
  better outcomes for low-risk patients
