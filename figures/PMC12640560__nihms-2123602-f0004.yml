figure_title: Example of modeling in different imaging spaces for one patient (P06).
caption: Example of modeling in different imaging spaces for one patient (P06). The
  normative space used here is MNI2009b. All images are generated in StimVision. The
  lead type is ABT6172, and STN, HDP, and CSBT are shown in orange, green, and blue,
  respectively. Transformation into normative space introduces visually subtle warping
  of the anatomical structures and the lead shaft. A) Illustration of the STN, lead,
  and pathways in native space, B) Warped image in normative space before fitting
  a lead shaft to a straight line between the contacts and tip. C) Warped image in
  normative space after fitting a lead shaft to a straight line between the contacts
  and tip
