caption: 'Effects of DuoX on cyclooxygenase-2 (COX-2) protein expression and mitogen-activated
  protein kinase (MAPK) pathway phosphorylation in lipopolysaccharide (LPS)-induced
  RAW 264.7 cells. RAW 264.7 cells were pretreated with DuoX for 30 min, followed
  by stimulation with LPS for 24 h. Total cell lysates were collected and analyzed
  to assess COX-2 protein expression (A) and the phosphorylation levels of p38 (B)
  and ERK (C) using western blotting, with GAPDH, total p38, and total ERK as loading
  controls. Data for p-p38 (n = 4) and COX-2 and p-ERK (n = 3) are presented as mean
  ± standard error of mean. # p < 0.05, ### p < 0.001 compared with the LPS-untreated
  control; * p < 0.05, ** p < 0.01 compared with the LPS-treated group'
