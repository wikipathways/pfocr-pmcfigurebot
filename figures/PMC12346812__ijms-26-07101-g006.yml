figure_title: Key immune and inflammatory responses in pSS.
caption: Key immune and inflammatory responses in pSS. Early activation of the innate
  immune system, particularly the IFN-I pathway, plays a central role in pSS. Activated
  pDCs by blood dendritic cell antigen 2 (BDCA2) secrete IFN-I and TNF family cytokines,
  including BAFF and APRIL, through the JAK-STAT pathway, initiating inflammatory
  responses. Autoreactive B cells, stimulated by BAFF and APRIL via BAFFR and TACI,
  and the Bruton’s tyrosine kinase (BTK) pathway, produce autoantibodies, with CD19
  and CD20 contributing to B cell activation. These autoantibodies form immune complexes
  that sustain adaptive immune responses. B cells present antigens to Th cells via
  MHC-II and TCR-CD4 interactions, along with CD40-CD40L signaling. Activated Th cells
  secrete IL-12, promoting Th1 differentiation and IFN-γ production, which further
  enhances BAFF expression—creating a pathogenic feedback loop central to pSS. All
  one-way arrows indicate activation and forward progression along the pathway, bidirectional
  arrows represent interactions between components, and truncated lines indicate inhibition
