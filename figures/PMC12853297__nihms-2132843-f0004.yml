figure_title: Schematic diagram of brainstem vagal neurocircuits in the rat
caption: 'A: Vagal motoneurons innervate the viscera via one of five vagal efferent
  branches. The Anterior gastric, hepatic, and accessory celiac branches are located
  in the left DMV, while the posterior gastric and celiac are located in the right
  DMVB: Vagal afferent projections terminate within the NTS in a broadly viscerotopic
  manner, with inputs from the GI tract terminating within the gelatinosus and commissuralis
  subnuclei, while esophageal afferents terminate within the centralis subnucleus.
  Note, the gelatinosus and centralis subnuclei are present only in the portion of
  the NTS that is rostral to the APC: Vago-vagal reflex schematic. Vagal afferent
  neurons, whose cell bodies lie within the paired nodose ganglion (or nodose-jugular
  ganglion complex) are pseudounipolar neurons with a peripheral projection that terminates
  within the GI tract, and a central terminal that enters the brainstem via the tractus
  solitarius (TS) and terminates within the NTS. NTS neurons assimilate this visceral
  sensory information with inputs from the brainstem, midbrain, and forebrain and
  relayed the integrated response to the adjacent DMV, which contains the preganglionic
  parasympathetic motoneurons that send the efferent output response back to the GI
  tract. All DMV neurons are cholinergic and innervate postganglionic neurons within
  the target organ that form one of two distinct pathways: an excitatory cholinergic
  pathway and an inhibitory NANC pathway. Inset box highlights the three principle
  NTS-DMV projections: glutamatergic, GABAergic, and catecholaminergic, of which the
  inhibitory GABAergic projection is the most prominent under basal conditions.Figure
  created with BioRender.com under license'
