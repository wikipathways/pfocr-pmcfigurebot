figure_title: Central glial mechanisms sustaining neuropathic pain.
caption: Central glial mechanisms sustaining neuropathic pain. Peripheral nerve injury
  triggers central inflammation within the dorsal horn of the spinal cord. Microglia
  are the earliest responders, releasing TNF, IL-1β, PGE2, and BDNF that enhance pain
  signaling and initiate central sensitization. Astrocytes become reactive slightly
  later (“astrogliosis”) and maintain sensitization for months through persistent
  cytokine and prostaglandin production. Oligodendrocytes provide a supportive contribution
  by releasing IL-33, which activates ST2 receptors on neurons and glia to engage
  PI3K and MAPK (p38/ERK/JNK) and NF-κB signaling, thereby increasing pain pathway
  sensitivity. Together, these glial interactions create a self-reinforcing inflammatory
  network that stabilizes central sensitization and chronic pain
article_title: 'Oxidative Stress, Inflammation, and Cellular Senescence in Neuropathic
  Pain: Mechanistic Crosstalk'
