figure_title: Spatiotemporal dynamics of the PRRSV-2 1B sub-lineage in North America.
caption: Spatiotemporal dynamics of the PRRSV-2 1B sub-lineage in North America. (A)
  The panel on the top left shows a maximum clade credibility (MCC) phylogenetic tree
  reconstructed using a discrete-space diffusion model. (B) The heatmap panel on the
  top right displays number of transition between different regions, represented by
  color gradients and numerical values within each cell. Warm colors indicate high
  transition counts, while cool colors indicate low transitions counts. The thickness
  of the black boxes around the cells indicates the magnitude of the Bayes factor;
  only Bayes factors above 3 were considered significant. (C) The bottom panel shows
  spread pathway. Arrows indicate the direction of spread, and their thickness represents
  the transition numbers. The USA regions shown correspond to swine-producing areas,
  defined based on animal density according to SHIC. The abbreviations on the Canada
  map refer to different provinces
