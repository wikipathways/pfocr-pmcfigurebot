figure_title: Effects of Fx on the pyroptosis signaling pathway in vivo.
caption: Effects of Fx on the pyroptosis signaling pathway in vivo. (a) RT-qPCR analysis
  of mRNA levels for Nlrp3, Casp1, and Gsdmd; (b) representative immunofluorescence
  staining images in testicular sections for LPS (red) and Hoechst 33342-stained nuclei
  (blue) (400 ×), immunohistochemistry images showcasing NLRP3, Caspase-1, and Caspase-11
  protein expression (400 ×) and their quantitative diagrams; (c) the expression of
  Caspase-1 p20/Caspase-1, Caspase-11 p20/Caspase-11, N-GSDMD and N-GSDMD/GSDMD protein
  levels in mice testis by immunoblotting assay and their quantitative diagrams. Data
  presentation and statistical analysis are as described for Figure 1 (n = 3). *p
  < 0.05, **p < 0.01, ***p < 0.001. BPA, bisphenol A; Fx, fucoxanthin; RT-qPCR, reverse
  transcription-quantitative polymerase chain reaction; LPS, lipopolysaccharide; NLRP3,
  nucleotide-binding oligomerization domain-like receptor family pyrin domain-containing
  3; GSDMD, gasdermin D
