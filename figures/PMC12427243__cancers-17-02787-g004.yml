figure_title: DNA-PKcs upregulation drives multifaceted oncogenic pathways in cancer
  progression.
caption: DNA-PKcs upregulation drives multifaceted oncogenic pathways in cancer progression.
  DNA-PKcs forms a complex with Ku70/Ku80 at double-strand breaks (DSBs), where it
  phosphorylates Thr2609/Ser2056 clusters to activate NHEJ repair. Through the TGF-β/Smad3
  and PI3K/Akt/mTOR pathways, DNA-PKcs triggers epithelial–mesenchymal transition
  (EMT). It also phosphorylates Sp1, which promotes PRKDC mRNA expression. As non-coding
  RNA effects on PRKDC mRNA decrease, DNA-PKcs levels rise further, forming a positive
  feedback loop. This process activates glycolysis through enzymatic actions, supplying
  energy to cancer cells. Additionally, DNA-PKcs promotes vascular endothelial growth
  factor expression, supporting angiogenesis. High DNA-PKcs levels are also associated
  with PD-L1 overexpression, the combination of DNA-PKcs inhibitors with immunotherapy
  represents a promising therapeutic strategy
