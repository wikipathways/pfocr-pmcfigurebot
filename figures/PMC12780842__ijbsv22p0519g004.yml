figure_title: Predicted structural impact of mutations on the JAK-STAT pathway.
caption: 'Predicted structural impact of mutations on the JAK-STAT pathway. (A) Superimposition
  of the JAK3 kinase domain (residues 812-1124) from the wild-type crystal structure
  (gray; PDB: 3PJC) and the AlphaFold 3-predicted L1073F mutant (orange). The bound
  drug in the ATP-binding site and the side chains of residue L1073(F) are depicted
  as sticks. (B) Superimposition of STAT2 wild-type (gray; PDB: 6UX2) and the AlphaFold-predicted
  M594I mutant (orange). The wild-type structure (residues 1-713) is derived from
  a crystal structure of STAT2 complexed with the Zika virus NS5 protein on the coiled-coil
  domain. c. Zoomed-in view of the SH2 domain from panel (b)'
article_title: Impact of rare JAK/STAT germline mutations on vaccination-induced innate
  immune responses in a Tyrolian population
