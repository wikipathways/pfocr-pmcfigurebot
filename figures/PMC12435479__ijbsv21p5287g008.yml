figure_title: Dectin-1 deficiency reduces macrophage-to-myofibroblast transition (MMT)
  through TGF-β/Smad pathway.
caption: Dectin-1 deficiency reduces macrophage-to-myofibroblast transition (MMT)
  through TGF-β/Smad pathway. Wild-type (WT) and Dectin-1 knockout (KO) mice subjected
  to unilateral ureteric obstruction (UUO) operation. (A) Representative flow cytometric
  images illustrating the expression of α-SMA+ in CD45+ CD11b+ F4/80+ live cells (left)
  and the percentage of α-SMA+ cells in macrophages and its mean fluorescence intensity
  levels (2 parts in the right) in kidneys (n=6 for each group). (B) Relative mRNA
  expression of Acta2 in sorted macrophages from fibrotic kidneys (n = 5 for each
  group). (C) Schematic of Dectin-1 induced MMT. (D) Representative western blot analysis
  of TGF-β1 protein in the kidney tissues. α-Tubulin was used as loading control (n
  = 6 for each group). (E) Densitometric quantification of blots in (D). (F) Relative
  mRNA expression of Tgfb1 in kidney tissues (n = 5 for each group). (G) Relative
  mRNA expression of Tgfb1 in sorted macrophages from fibrotic kidneys (n = 5 for
  each group). (H) The concentrations of TGF-β1 detected by ELISA in supernatant from
  sorted macrophages of fibrotic kidneys (n = 5 for each group). (I) Representative
  flow cytometric images illustrating the expression of p-Smad2/3+ in CD45+ CD11b+
  F4/80+ live cells (left) and the percentage of p-Smad2/3+ cells in macrophages and
  its mean fluorescence intensity levels (2 parts in the right) in kidneys (n=6 for
  each group). Data are presented as mean ± SD. *P < 0.05, **P < 0.01, ***P < 0.001,
  ****P < 0.0001
