figure_title: TIMP1 promotes the formation of VDIMs through the Rap1 signaling pathway.
caption: TIMP1 promotes the formation of VDIMs through the Rap1 signaling pathway.
  (A) Schematic diagram of VDIMs in UMUC-3 cells, with colocalization curves confirming
  MitoTracker (+)/ TOM20 (-). (B-E) Flow cytometry detection of intracellular Ca2+
  levels using the Fluo-4/AM probe in UMUC-3 and J82 cells after 24 hours of treatment
  with MSCs -CM/TIMP1 combined with ESI-09. (F-G) Changes in intracellular VDAC1 expression
  levels in UMUC-3 and J82 cells after 24 hours of intervention with varying concentrations
  of TIMP1 and TIMP1 combined with ESI-09. (H-I) Effects of MSCs-CM/TIMP1 combined
  with ESI-09 on the formation of VDIMs in UMUC-3 cells after 24 hours. (J) Fluorescence
  imaging and colocalization curves of VDIMs and the lysosomal marker LAMP1 in UMUC-3
  cells, with orange representing VDIMs localized to lysosomes and black representing
  VDIMs not localized to lysosomes. (K) Morphology of mitochondria observed under
  an electron microscope in UMUC-3 cells after 24 hours of treatment with MSCs-CM/TIMP1
  combined with ESI-09
