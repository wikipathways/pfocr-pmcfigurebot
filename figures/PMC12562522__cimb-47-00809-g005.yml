figure_title: HCX3 is molecularly docked to key proteins of the NF-κB signaling pathway.
caption: HCX3 is molecularly docked to key proteins of the NF-κB signaling pathway.
  (A–D) Results of molecular docking simulations between HCX3 and key proteins of
  the NF-κB signaling pathway, including TLR4 (A), MyD88 (B), IκB-α (C), and p65 (D).
  In the figure, yellow represents hydrogen bonds, red indicates the relevant amino
  acid residues of the protein that form hydrogen bonds with molecules, and the numerical
  values denote the bond lengths. Visualization of the protein-compound complexes
  (A–D) illustrates the interaction patterns of HCX3 with the active sites of these
  key proteins
