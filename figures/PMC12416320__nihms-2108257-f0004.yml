caption: 'Biosynthetic pathway of shinorine (A) and constitutive expression of the
  wild type and refactored shinorine BGC in E. coli BAP1 (B), B. subtilis (C), Synechocystis
  (D) and Anabaena (E). The yields of 4-DG, MG and shinorinewere shown with gray,
  orange and green bars, respectively. Synechocystis and Anabaena were cultured in
  BG11 for 48 h and 72 h, respectively, before extraction and production analysis
  by HPLC. Strains transformed with empty vectors served as negative controls. Data
  represents the mean ± S.D. of at least three replicates. SH7P: sedoheptulose-7-phosphate;
  4-DG: 4-deoxygadusol; MG: mycosporine-glycine'
