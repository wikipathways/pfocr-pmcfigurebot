figure_title: Working model illustrating the possible interplay between ACase and
  ferroptosis in senescent cells
caption: The upregulation of ACase in senescent cells would increase the pool of SFA/MUFA
  from the Cer breakdown (1). Through the Kennedy pathway (2) and/or the Lands cycle
  (3), increased sn-2SFA/PUFA-PL would lead to an accumulation of sn-2PUFA-PL, priming
  the cell membranes for LPO and ferroptosis (4). SM, sphingomyelin; Cer, ceramide;
  SFA, saturated fatty acid; MUFA, monounsaturated fatty acid; PUFA, polyunsaturated
  fatty acid; PL, phospholipid; ROS, reactive oxygen species; LPO, lipid peroxidation;
  GSH, reduced glutathione; GSSG, oxidized glutathione
article_title: Acid ceramidase modulates the lipid profile and exacerbates sensitivity
  to ferroptosis in senescent cells
