figure_title: Schematic representation of the pathway by which milrinone (MRN)-loaded
  human serum albumin (HSA) nanoparticles exert their effects on cardiomyocytes.
caption: Schematic representation of the pathway by which milrinone (MRN)-loaded human
  serum albumin (HSA) nanoparticles exert their effects on cardiomyocytes. MRN-loaded
  HSA nanoparticles conjugated with angiotensin II (indicated by light blue circles)
  can enter the heart either via receptor-mediated transcellular transcytosis through
  angiotensin II type 1 (AT1) receptors (indicated by blue ellipses) or via paracellular
  passive diffusion through disrupted tight junctions between capillary endothelial
  cells. Once released in the heart, MRN may diffuse passively into cardiomyocytes.
  Alternatively, MRN may be released from endosomes into the cytosol after receptor-mediated
  endocytosis of angiotensin II–modified MRN-loaded HSA nanoparticles via AT1 receptors,
  although the mechanism of endosomal escape remains to be elucidated. MRN functions
  as a phosphodiesterase 3 (PDE3) inhibitor, preventing the hydrolysis of cyclic adenosine
  monophosphate (cAMP) into AMP. The accumulation of cAMP activates protein kinase
  A (PKA), which regulates cardiac contraction by modulating Ca2+ concentrations through
  sarcoplasmic reticulum Ca2+-ATPase (SERCA2a) and ryanodine receptor 2 (RyR2). Calcium
  uptake from the cytosol into the sarcoplasmic reticulum (SR) occurs via SERCA2a,
  whereas calcium release from the SR into the cytosol is mediated by RyR2. As a result,
  MRN induces mild enhancement of cardiac contraction. MRN is indicated by a red circle,
  and PDE3 is indicated by a magenta ellipse
