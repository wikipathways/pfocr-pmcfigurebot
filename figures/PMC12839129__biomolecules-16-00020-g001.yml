figure_title: The renin–angiotensin–aldosterone system (RAAS) is of major importance
  in the regulation of blood pressure and the maintenance of electrolyte balance in
  the body.
caption: The renin–angiotensin–aldosterone system (RAAS) is of major importance in
  the regulation of blood pressure and the maintenance of electrolyte balance in the
  body. Renin is produced in the kidneys when intracellular proteolytic enzymes act
  on its inactive precursor, prorenin. This enzyme catalyzes the bioconversion of
  angiotensinogen, an important intermediate protein in angiotensin I (Ang I), the
  first step in the RAAS pathway. Ang I mainly acts as a precursor for the generation
  of the other active peptides of the pathway. After the angiotensin-converting enzyme
  I (ACE1) converts Ang I to angiotensin II (Ang II), Ang II activates AT1R, causing
  vasoconstriction, triggering inflammation, and leading to oxidative stress. On the
  contrary, when this peptide interacts with AT2R, it promotes blood vessel dilation,
  inhibits cell proliferation, and exerts anti-oxidative effects. Aminopeptidase-A
  (AP-A) converts Ang II to angiotensin III (Ang III), which is then converted to
  angiotensin IV (Ang IV) with the help of Aminopeptidase-N (AP-N). The end result
  of this process is the enhancement of cognitive function while also facilitating
  cellular signal transmission. Angiotensin A (Ang A) is generated from the decarboxylation
  of Ang II, having both a hypertensive and hypotensive action. Angiotensin 1–9 (Ang
  1–9) is generated from Ang I via angiotensin-converting enzyme 2 (ACE2) interacting
  with AT2R, and it bio-transforms into angiotensin 1–7 (Ang 1–7) through ACE1. Ang
  I can also be cleaved directly by NEP to form Ang 1–7. All of these bioactive peptides
  can be created via many different ways, as indicated in the figure and the main
  body of the review. Through decarboxylation of Ang II, Alamandine (ALA) is created,
  exerting cardioprotective, anti-inflammatory, and anti-fibrotic effects. Aldosterone,
  a hormone produced by the adrenal cortex, induces sodium and water retention and
  increases blood volume and blood pressure. Due to the complexity of the system,
  where many different parameters can be deregulated, the need to maintain the system
  in equilibrium becomes unprecedented
