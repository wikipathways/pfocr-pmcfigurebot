figure_title: Modeling the C9-NRE patient hyper- to hypo-excitability spectrum using
  i3Neurons identifies disease-relevant pathways
caption: (A) A representative raster plot of i3Neurons loaded with Ca2+ indicator
  dye Fluo-4 and, following a baseline recording, were stimulated with 4 mM TEA as
  shown by the arrow at 1 minute. The ΔF/F was calculated per cell using PeakCaller
  and is plotted. n = 3 biological replicates, m = 3–4 independent experiments per
  line, o = 50 cells per experiment. (B) DEG clusters were identified using maSigPro,
  using levels of neuronal activity as pseudo-time. (C) Pathway Enrichment/GO for
  transcripts divergently regulated in C9-NRE i3Neurons compared to Control i3Neurons
  following silencing with TTX or activation with TEA
article_title: Neuronal Activity-Dependent Gene Dysregulation in C9orf72 i3Neuronal
