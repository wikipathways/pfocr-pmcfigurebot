caption: 'Analytical design: oral lesion formalin-fixed paraffin-embedded (FFPE) samples
  were collected from oral squamous cell carcinoma (OSCC) patients (N = 3) after the
  surveillance for oral potentially malignant disorders (OPMDs). OSCC FFPE samples
  (N = 3) were analyzed using RNAseq. Sequences from FFPE samples of OSCC patients
  (N = 3) (our data) were used in conjunction with breast cancer (BC) patients to
  perform a technical comparison (N = 6) (publicly available data from Gene Expression
  Omnibus (GEO) Database, GSE58135; https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE58135,
  accessed on 24 October 2024). Samples were aligned to the human reference (GRCh38.p13).
  Quality control was completed using FASTQC and genes were counted using Spliced
  Transcripts Alignment to a Reference (STARv2.7.9a) software. Count data was merged
  using pythonv3.12.4. Differential gene expression was determined in R using DESeq2v1.40.2
  comparing OSCC (27,237 input genes) and BC (30,343 input genes) samples. A total
  of 9194 and 4728 genes were determined as up- or downregulated, respectively. Principal
  component analysis (PCA) was completed and plotted showing clear differentiation
  between OSCC and BC samples. Differential Kyoto Encyclopedia of Genes and Genomes
  (KEGG) pathways were determined via the Pathviewv.1.40.0 program determining 17
  downregulated pathways. The Search Tool for the Retrieval of Interacting Genes (STRINGv12.0)
  was used to determine protein–protein interactions (PPIs) at the highest confidence
  level (CL = 0.900) between genes appearing in more than one KEGG pathway with an
  input of 25 upregulated and 73 downregulated genes returning 23 and 63 genes within
  the protein–protein interaction, respectively'
