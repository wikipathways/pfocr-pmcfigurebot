figure_title: Deciphering drug response through single-sample gene set enrichment
  analysis (ssGSEA) of transcriptomic states.
caption: Deciphering drug response through single-sample gene set enrichment analysis
  (ssGSEA) of transcriptomic states. The heatmap illustrates the enrichment scores
  of six predefined biological states across various cell line samples treated with
  bortezomib. Rows represent the specific biological states, while columns represent
  individual cell line samples (e.g., A549, NCI-H460, HOP-62, etc.). Color intensity
  in the heatmap reflects the ssGSEA scores, where red indicates higher enrichment
  (activation) and blue indicates lower enrichment (suppression) of the respective
  pathway. The “RI” (resistance index) top bar shows the calculated index for each
  sample, with red representing RI > 0 and blue representing RI ≤ 0. The “Predicted”
  top bar categorizes samples into “effective” or “ineffective” based on the RI values,
  demonstrating the model’s ability to classify drug sensitivity based on transcriptomic
  signatures. Dendrograms on the top and left represent unsupervised hierarchical
  clustering of samples and biological states, respectively
