figure_title: 'PFAS-induced neurotoxicity and tumorigenesis:'
caption: PFAS also triggers calcium (Ca2+) influx, which alters phosphorylation levels
  in the discs large homolog 1 (DLG1) phosphorylation and dissociation from glutamate
  transporter 1 (GLT-1) pathway and SMAD signalling, contributing to neurotoxicity
  and pyroptosis, respectively. Increased ubiquitination and degradation of SMAD7
  and subsequent increase in downstream phosphorylation events also promote tumorigenesis
  via the SMAD pathway. Additionally, altered acetylation and tau hyperphosphorylation
  have been linked to Alzheimer’s disease pathology. Regulation of β-catenin results
  in ferroptosis and inhibited cell proliferation. P-Phosphorylation, Ub-Ubiquitination,
  Ac-Acetylation
