figure_title: Protein-protein interaction network analysis of differentially expressed
  genes in CIA joints following rapamycin treatment.
caption: Protein-protein interaction network analysis of differentially expressed
  genes in CIA joints following rapamycin treatment. STRING analysis of Cluster 1
  identified genes associated with aging (pink nodes) and genes involved in immune
  and inflammatory responses (nodes in other colors). The nodes corresponding to mediators
  identified as crossover points between aging and immune processes were magnified
  (top-right). The table summarizes the Gene Ontology (GO) biological processes significantly
  enriched within this cluster, including pathways related to aging and immune regulation.
  (For interpretation of the references to colour in this figure legend, the reader
  is referred to the web version of this article.)
