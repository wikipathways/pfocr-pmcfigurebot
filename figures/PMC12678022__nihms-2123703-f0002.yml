figure_title: Interferon (IFN)-activated fibroblasts (FBs) are enriched in SS skin.
caption: Interferon (IFN)-activated fibroblasts (FBs) are enriched in SS skin. A,
  Number of significantly upregulated genes (adjusted P value [Padj] < .05) in patients
  with SS versus patients with HC for each cell type. Differential expression analysis
  was performed using DESeq2. Pseudobulked data were used to control for cell number.
  B, Dimensionality reduction and unsupervised clustering of FBs, colored by subset.
  C, Expression of the top 4 marker genes per FB subset. D, Proportion of FB subsets
  for each condition. E, Pathway analysis inferring upstream transcription factors
  regulating gene expression for each cluster. F, Scaled expression of neutrophil
  chemokine CXCR2 ligands (CXCL1, CXCL2, CXCL3, CXCL5, CXCL6, and CXCL8) and CXCR4
  ligand (CXCL12) across cell types for each condition. Keratinocytes, eccrine cells,
  and melanocytes were combined into the category epithelial. DCs, pDCs, mast cells,
  and myeloid cells were combined into the category myeloid. Plasma cells and lymphoid
  cells were combined into the category lymphoid. Vascular endothelial cells, lymphatic
  endothelial cells, and mural cells were combined into the category endothelial-mural.
  Proliferating cells and adipocytes were excluded. Error bars represent SEMs
