figure_title: Schematic diagram illustrating the proposed mechanism of LGZG in ameliorating
  HFD-induced MASLD via the gut microbiota–non-12-OH BA–TGR5 axis.
caption: 'Schematic diagram illustrating the proposed mechanism of LGZG in ameliorating
  HFD-induced MASLD via the gut microbiota–non-12-OH BA–TGR5 axis. LGZG orchestrates
  a multi-organ metabolic defense against MASLD through sequential biological modulation.
  (A) In the liver, LGZG shifts bile acid synthesis toward the alternative pathway
  by upregulating key enzymes (CYP27A1 and CYP7B1), leading to the enrichment of non-12-OH
  BAs (e.g., HCAs and keto-derivatives). Simultaneously, LGZG reshapes the gut microbiota
  composition, notably increasing the abundance of commensals such as Akkermansia
  and Bifidobacterium, which further optimizes the bile acid profile. (B) These TGR5-preferring
  non-12-OH BAs drive tissue-specific signaling across three key metabolic organs:
  (1) In adipose tissue (primarily iWAT): LGZG-induced bile acids activate the TGR5-cAMP-PKA-CREB
  signaling axis, thereby triggering a potent thermogenic program. This is characterized
  by the induction of multilocular beige adipocytes and the upregulation of thermogenic
  genes (Ucp1, Pgc1α, and Prdm16), ultimately enhancing systemic energy expenditure;
  (2) In the liver: LGZG facilitates hepatic TGR5 activation and achieves coordinated
  modulation of FXR-associated signaling pathways. This dual-receptor engagement promotes
  lipid clearance and attenuates hepatic steatosis and pathological damage; (3) In
  the intestine: Non-12-OH BAs selectively activate TGR5 to enhance GLP-1 secretion,
  improving systemic glucose homeostasis, while concurrently suppressing the intestinal
  FXR-FGF15 axis (downregulation of Fgf15 and Asbt). Collectively, LGZG ameliorates
  MASLD not through a single target, but by integrating gut microbial ecology with
  compartmentalized receptor signaling to restore systemic energy and lipid balance'
article_title: Lingguizhugan Decoction Ameliorates MASLD by Modulating the Gut Microbiota
  and Enriching Non-12-OH Bile Acids to Activate TGR5-Mediated Thermogenesis
