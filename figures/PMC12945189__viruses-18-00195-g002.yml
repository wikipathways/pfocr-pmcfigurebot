caption: 'Integrated strategic workflow for the structural determination of underrepresented
  viruses. The central pathway depicts standard single-particle analysis (SPA) for
  typical icosahedral viruses, with schematic representations based on Sapovirus structure
  [57]. Specialized pathways overcome specific barriers: Subtomogram Averaging (STA)
  for morphological heterogeneity, Block-Based Reconstruction for size limitations,
  and Cryo-ET for symmetry validation. All strategies converge to a high-resolution
  atomic model'
