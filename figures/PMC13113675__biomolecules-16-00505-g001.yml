figure_title: The complement cascade pathways.
caption: The complement cascade pathways. Initiation of the classical pathway is triggered
  by binding of C1q to antibody chains thus activating C1s and C1r. Cleavage of activated
  C2 and C4 molecules into C2a, C2b and C4a, C4b by the activated C1 complex leads
  to C3 convertase formation after binding of C2b to C4b (C4b2b). Recognition of microbial
  carbohydrates by ficolins, mannan binding lectin (MBL), or collectins leads to lectin
  pathway activation. These molecules bind to mannan binding lectin serine peptidases
  (MASPs) forming a complex. The activated MASPs cleave C2 and C4 into active C2a,
  C2b and C4a, C4b fragments the C3 convertase (C4b2b) is formed. Alternative pathway
  activation involves spontaneous C3 activation by C3 hydrolysis. Factor B and Factor
  D enable the formation of a fluid phase C3 convertase through binding of the hydrolyzed
  C3 to an active Bb fragment (C3(H2O)Bb). C3(H2O)Bb cleaves C3 into active C3a and
  C3b fragments. Binding of active C3b to Bb results in the formation of the alternative
  pathway C3 convertase (C3bBb). The three pathways join at the C3 step and the activation
  of the cascade to continue to the C5 step which involves to the formation of the
  C5 convertase by binding of active C3b to the existing C3 convertases resulting
  in the formation of active C5 convertases (C4b2bC3b, C3bBbC3b). Circulating C5 is
  cleaved into active C5a and C5b by the C5 convertases leading to C5b binding to
  the cell membrane and assembly with C6, C7 and C8 molecules. This further enables
  polymerization of C9 molecules and formation of C5b-9, also known as membrane attack
  complex (MAC). Generation of sufficient C5b-9 molecules on the cell membrane leads
  to cell lysis. The release of C3a and C5a anaphylatoxins and binding to their cellular
  receptors initiates cellular activation and chemotaxis promoting a strong inflammatory
  state. Created using BioRender
