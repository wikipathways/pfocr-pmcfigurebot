figure_title: Mirdametinib improves pseudarthrosis healing in a patient with OFD
caption: (A and B) Representative Western blot (A) and quantification (B) demonstrating
  a dose-dependent reduction in ERK pathway activation in OFD patient pseudarthrosis–derived
  primary cells (n = 5) treated with mirdametinib. Triangles indicate samples with
  somatic MET mutations; circles indicate samples without detectable MET mutations.
  Quantification data are presented as the mean ± SEM, with statistically significant
  differences determined by 1-way ANOVA with Dunnett’s multiple-test correction. (C)
  Principal component (PC) analysis of OFD patient pseudarthrosis–derived primary
  cells treated with vehicle or mirdametinib (n = 5). (D and E) Volcano plot (D) and
  heatmap (E) of genes differentially expressed between mirdametinib- and vehicle-treated
  OFD patient pseudarthrosis–derived primary cells. Exp., expression. (F and G) GO
  analysis of differentially expressed genes with increased (F) and decreased (G)
  expression following mirdametinib treatment. activ., activity; coll., collagen;
  diff., differentiation; phosph., phosphotase; reg., regulation; struct., structure;
  sys. develop., system development. (H and I) Longitudinal postoperative radiographs
  of an OFD patient’s pseudarthrosis treated without mirdametinib (H) and with mirdametinib
  (I). **P < 0.01, ***P < 0.001, and ****P < 0.0001
