figure_title: SYT4 directly interacts with PSMC6.
caption: SYT4 directly interacts with PSMC6. A total of 106 potential binding proteins
  for SYT4 were discovered by IP-MS. B Co-IP detected that SYT4 interacts with the
  protein PSMC6. C SYT4 and PSMC6 were co-localized in cytoplasm by immunofluorescence.
  D GST pull-down verified the direct interaction of SYT4 and PSMC6. E and F The C2B
  domain (288-423 aa) of SYT4 was essential for interaction with PSMC6. G Knockdown
  of SYT4 downregulated PSMC6 protein level, but not transcript level. H SYT4 knockdown
  markedly decreased the half-life of PSMC6 protein. I SYT4 stabilized PSMC6 protein
  by autophagy-lysosome pathway
