figure_title: The Hh pathway in stem cell-like side population (SP) cells.
caption: The Hh pathway in stem cell-like side population (SP) cells. In SP cells,
  the EGFR-Src-Akt pathway and the Hh pathway cooperatively regulate stemness by inducing
  SOX2 expression. Furthermore, activation of the Hh pathway promotes expression of
  the long non-coding RNA SOX2OT. SOX2OT facilitates m6A methylation of Gli transcription
  factors via the METTL3/14-IGF2BP2 complex, establishing a positive feedback loop
  that amplifies Hh signaling
