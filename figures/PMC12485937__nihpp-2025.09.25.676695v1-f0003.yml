figure_title: Pathway map of changes in the frequency of central carbon metabolism
  genes across the lytic to temperate spectrum
caption: Map of central carbon metabolism with each enzymatic step colored by the
  change in enzymatic metagenomic gene frequency across lytic to temperate viral communities.
  Red arrows show higher frequency in temperate communities while blue arrows are
  lytic associated, reflecting ρs values for each enzyme as seen in Table 1 and Figure
  2. Enzymes are labeled by EC numbers (see Table 1 for gene names). Single-headed
  and double-headed arrows represent irreversible and reversible reactions, respectively.
  Black arrows show genes that were absent from all viromes. Central intermediate
  metabolites glyceraldehyde-3-phosphate (G3P) and pyryvate are shown in bold. *Note
  that fructose-6-phosphate is found in the EMP/gluconeogenesis pathways as well as
  the PPP, ** that oxaloacetate is produced in both the TCA and gluconeogenesis, and
  that EC1.1.1.42 in the TCA has an oxalosuccinate intermediate. Code can be found
  at https://tinyurl.com/viral-metabolic-ratchet-code
