figure_title: Statins inhibit the NLRP3 inflammasome to attenuate pro-inflammatory
  cytokine release.
caption: Statins inhibit the NLRP3 inflammasome to attenuate pro-inflammatory cytokine
  release. This figure highlights the structure of the NLRP3 inflammasome (PDB code
  8EJ4), with its associated NACHT domain, which acts as a molecular switch. Stress
  signals such as DAMPs activate the complex DAMP/NLRP3/CAS-1 axis. Statins inhibit
  this cascade at multiple points, allowing the attenuation of this pathway towards
  an anti-inflammatory state
