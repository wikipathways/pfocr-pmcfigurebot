figure_title: Transcriptomic profiling linking cytoskeletal regulation to skeletal
  cell aging
caption: '(A) UMAP plots visualize 3 batches of single-cell sequencing datasets. (B)
  Clustering a total of 20,811 cells into 10 subsets: granulocyte (GRAN), monocyte
  (MONO), erythrocyte (ERY), myeloid cell (MC), T lymphocyte (T Cell), skeletogenic
  cell (SC), endothelial cell (ENDO), B lymphocyte (B Cell), megakaryocyte (MK), and
  pericyte (PERI). (C) Dot plot showing marker gene expression for the classification
  of 10 clusters. (D) Pathway enrichment analysis of 2135 DEGs in SC cluster exhibited
  with a bar graph showing selected pathways, including cytoskeleton and cell adhesion,
  related to stem cell regulation from the top 10 enriched KEGG pathways (P < 0.05,
  logFC < –0.1, 2M versus 18M)'
