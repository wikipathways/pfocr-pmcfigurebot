figure_title: Differentiation of diagnostic categories based on gene-dosage effects
  in pathways by cell type and brain region
caption: '(a) Genetic correlations between diagnostic categories when each diagnosis-dosage
  combination is treated as an independent component, see also Table S11, *p<0.05)
  **q<0.05). Diagnosis-dosages with factor loadings >0.25 were grouped and labeled
  to highlight psychiatric traits contributing to F1, F2 and F3. (b): Factor loadings
  of DEL and DUP for disorders reveal a distinct profile for each diagnostic category.
  (c, g, k) Gene set-factor scores for the three factors, cell types and pathways
  were ordered using a simple sign-based bi-clustering algorithm (see methods) (Table
  S14). (d,h,i) Factor scores are representative of dose-dependent effects of genes.
  Scatterplots of gene set effect sizes (z-score) are shown for the top 2 diagnosis-dosage
  groupings with highest absolute factor loadings for factor F1, F2, and F3, and factor
  score of each gene set is indicated using the same color scale as in panels c,g,k.
  Solid trend lines indicate significant correlation between the diagnosis-dosage
  pair. (e,j,m) Factor analysis of gene sets with genome-wide significant loci removed
  yielded results with highly concordant gene set factor scores (e,f,i,j,m,n; tau_F1=0.45,
  tau_F2=0.53, tau_F3=0.32, p<2.2e-16; Table S14), demonstrating that these patterns
  are not attributable to a select subset of major loci'
article_title: Psychiatric disorders converge on common pathways but diverge in cellular
  context, spatial distribution, and directionality of genetic effects
