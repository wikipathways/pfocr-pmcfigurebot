figure_title: Prevalence, Virulence, and Pathogenic Mechanisms of Mastitis-Associated
  Klebsiella pneumoniae in Herds and Phage-Based Control Strategies
caption: 'K. pneumoniae subverts the innate immune response in epithelial cells to
  suppress early inflammation and evade immune surveillance. (A) Via a NOD1-dependent
  pathway, K. pneumoniae upregulates the deubiquitinase CYLD, leading to attenuated
  NF-κB activation and a diminished inflammatory response. (B) The virulence factors
  LPS O-polysaccharide and pullulanase PulA decrease the expression of proinflammatory
  cytokines (IL-1β, TNF-α, and IL-8) by impairing the activation of the TLR2-TLR4-MyD88
  pathway and subsequent NF-κB signaling. (C) CPS and O-polysaccharide promote SARM1
  expression via IFN production induced by the TLR4-TRIF-TBK1-IRF3 signaling axis.
  SARM1 then negatively regulates both MyD88 and TRIF, thereby suppressing AIM2 inflammasome
  activation and antagonizing host immunity. Created with Figdraw.com. Author: [Yangseng
  Wang], (accessed on 28 December 2025)'
