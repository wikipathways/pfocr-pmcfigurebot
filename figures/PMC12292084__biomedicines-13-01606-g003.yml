figure_title: LUAD subgroups defined by cellular markers associated with disease progression.
caption: LUAD subgroups defined by cellular markers associated with disease progression.
  (a) Hierarchical clustering analysis of RNA—seq expression of 55 genes derived from
  epithelial cells revealed three LUAD subgroups, C1, C2, and C3. These genes were
  separated into four clusters enriched in distinct pathways and biological processes
  (BPs) related to tumor development. (b) Among the three identified subgroups, C1
  (blue), C2 (orange) and C3 (red), Kaplan—Meier survival curves indicate that patients
  in subgroup C3 (red) had the poorest survival outcomes, while those in subgroup
  C1 (blue) exhibited the best survival. (c) The C3 (red) subgroup showed the highest
  tumor purity, accompanied by the lowest levels of stromal and immune cell content.
  (d) The three genes encoding immune inhibitors were expressed at significantly higher
  levels in subgroup C2 (orange) compared to subgroups C1 (blue) and C3 (red). (****
  p<0.0001)
