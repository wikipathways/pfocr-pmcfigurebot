figure_title: Canonical and non-canonical IFN signaling.
caption: Canonical and non-canonical IFN signaling. Type I IFNs initiate signaling
  by binding to the common IFNAR receptor, forming a ternary complex with its IFNAR1
  and IFNAR2 subunits. This triggers the sequential activation (phosphorylation) of
  the receptor-associated Jak1 and Tyk2 kinases. These kinases then phosphorylate
  downstream targets, including STAT proteins, as well as components of the MAPK and
  PI3K pathways. The canonical signaling pathway involves the formation of the pSTAT1,
  pSTAT2, and IRF9 (ISGF3) trimer, which moves to the nucleus, binds to ISRE, and
  triggers transcription of ISGS responsible for the antiviral and antibacterial response.
  There are many non-canonical signaling pathways, one of which is the formation of
  pSTAT1 homodimers and binding to GAS, followed by transcription of pro-inflammatory
  and pro-apoptotic genes. Non-canonical signaling also includes phosphorylation and
  formation of homo- and heterodimers of STAT3, STAT4, STAT5, and STAT6. Interactions
  with MAPK (mitogen-activated protein kinase) and PI3K (phosphoinositide 3-kinase)
  kinases can also occur, leading to various effects in the cell
