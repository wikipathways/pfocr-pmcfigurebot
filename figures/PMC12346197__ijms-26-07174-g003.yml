figure_title: Mass spectrometry-based proteomic analysis of MTH1 inhibitor TH1579,
  which induces protein changes in human keratinocytes.
caption: Mass spectrometry-based proteomic analysis of MTH1 inhibitor TH1579, which
  induces protein changes in human keratinocytes. (a) Schematic representation of
  the mass spectrometry-based proteome profiling workflow. Figure generated by BioRender
  software, https://app.biorender.com/, accessed on 1 February 2025. (b) The volcano
  plot illustrates differentially expressed proteins (DEPs) between TH1579 treatment
  vs. control. Significantly DEPs are denoted as colored dots (blue-downregulated,
  red-upregulated) with FDR-adjusted p-value < 0.05 and log2 fold change > ±0.58.
  (c) Heatmap of unsupervised cluster analysis of the log2 protein intensities profiles
  of 2692 differentially expressed proteins. Dot plots of Gene Ontology (GO) of biological
  process (d), Reactome (e) and Kyoto Encyclopedia of Genes and Genomes (KEGG) (f).
  Pathway analysis of DEPs displaying top 10 significantly (Benjamini–Hochberg FDR
  correction, p < 0.05) enriched terms. (g) The chord plot shows the three selected
  significant KEGG pathway enrichments and corresponding differentially expressed
  proteins connected by chords. Proteins are arranged based on log2 fold change
