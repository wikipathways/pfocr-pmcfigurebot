figure_title: V9302 inhibits the AKT/mTOR signaling pathway.
caption: V9302 inhibits the AKT/mTOR signaling pathway. (a) Western blot analysis
  of key proteins in the AKT/mTOR pathway after treating HS-SY-II cells with V9302
  (0, 15, 20 µM) for 24 h. GAPDH was used as a loading control. (b) Quantification
  of the Western blot bands. Data are presented as mean ± SD and individual data points
  are shown as circles (n = 3). One-way analysis of variance (ANOVA) with Tukey’s
  post hoc test was used. * p < 0.05; ** p < 0.01; *** p < 0.001. The uncropped bolts
  are shown in Supplementary Materials
