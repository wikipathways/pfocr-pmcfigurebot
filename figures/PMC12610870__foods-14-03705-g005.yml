caption: Expression of gibberellin biosynthetic enzymes and association with gibberellin
  levels in mango fruit (a) Proposed biosynthetic pathway of gibberellins and the
  relative expression of candidate genes across the pathway in mangoes. KAO, entkaurenoic
  acid oxidase; 20oX, GA 20-oxidase; 13oX, GA 13-oxidase; 3oX, GA 3-oxidase; 2oX,
  GA 2-oxidase; N.D., not detected. Pink indicates high expression; blue signifies
  low expression. (b) Correlation heatmap between the expression levels of genes involved
  in the gibberellin synthesis pathway and the levels of gibberellins. Pink indicates
  a positive correlation and blue denotes a negative correlation. Higher color intensity
  signifies a stronger correlation. Data were analyzed using Pearson correlation coefficient.
  Asterisks indicate significant correlations (** p<0.01)
