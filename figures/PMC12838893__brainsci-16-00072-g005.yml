figure_title: Chemoactivation of the ZI–RVM circuit alleviates pain hypersensitivity
  of CCI mice.
caption: 'Chemoactivation of the ZI–RVM circuit alleviates pain hypersensitivity of
  CCI mice. (A) Schematic of the strategy for chemogenetic activation of ZI–RVM neurons.
  (B) Representative images of scAAV2/1-hSyn-Cre (mixed with CTB 647) expression in
  the ZI (left) and DIO-hM3Dq-mCherry in the RVM (right). Scale bar, 200 μm. White
  linear demarcations define the extent of the associated brain areas. (C) Effects
  of chemogenetic activation of the ZI–RVM circuit on mechanical thresholds of injured
  hind paws (n = 6 mice for the SA group and n = 7 mice for the CNO group). (D–H)
  Effects of chemoactivation of the ZI–RVM pathway on locomotion activity and anxiety
  level: Example tracts (D), total distance (E), and time spent in the center (F)
  in the open field test (OFT), and example tracts (G) and time in open arms (H) in
  the elevated plus maze (EPM) test. ns p > 0.05, **** p < 0.0001. Repeated-measures
  two-way ANOVA followed by Sidak post hoc test for (C) and unpaired t-test for (E,F,H).
  Data were presented as mean ± SEM'
