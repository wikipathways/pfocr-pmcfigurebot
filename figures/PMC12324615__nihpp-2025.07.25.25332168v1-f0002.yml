figure_title: CXCR4+ keratinocytes in HS skin
caption: (A). CXCR4 protein expression in HS skin. (B) We used single cell transcriptomic
  data to compare CXCR4+ keratinocytes to CXCR4- keratinocytes and found upregulated
  SOX9 and HLA class II genes (red). We also identified transcription factors with
  binding sites that contain HS risk variants (blue) and a strong signature of epithelial
  mesenchymal transition associated with epithelial wound responses (black). Strong
  co-expression of CD74 suggest that CXCR4 may be forming a heterodimer with CD74
  to amplify PI3K/AKT, ERK/MAPK, and NF-KB signaling. (C) Activation of these pathways
  is confirmed in CXCR4+ keratinocytes. Furthermore, exposure to Plerixafor in ex
  vivo HS skin attenuated these pathways in CXCR4+ keratinocytes. (D) Proposed model
  illustrating how upregulated CXCR4 expression in HS keratinocytes disrupts the balance
  of inflammatory signaling pathways, and how Plerixafor treatment may restore this
  balance (purple). In this model, CXCR4 upregulation in HS keratinocytes promotes
  activation of MAPK/ERK, PI3K/Akt, and NF-κB pathways, contributing to sustained
  inflammation and impaired resolution. Pharmacologic inhibition of CXCR4 with Plerixafor
  attenuates these pathways and enhances apoptotic and gene programs associated with
  physiological remodeling in the hair follicle. Downstream pathway components that
  are modulated in CXCR4+ keratinocytes following Plerixafor treatment are highlighted
  in purple. Genes identified as GWAS-associated are marked with light blue indicators,
  and genes differentially expressed between HS and healthy keratinocytes are marked
  with green indicators
article_title: The polygenic architecture of hidradenitis suppurativa reveals signaling
  mechanisms that implicate epithelial remodeling
