figure_title: Protein spacing on nanoparticles is an on/off switch for complement
  C3 deposition on nanoparticle surfaces
caption: '(A) Schematic describing mechanisms of C3b deposition and flow cytometry
  method for detection on nanoparticles.(B) C3b fluorescence on protein nanoparticles
  vs. protein spacing on the nanoparticles (n = 3 replicate nanoparticle-serum preparations).(C)
  Nanoparticle fluorescence vs. alternative pathway C3b fluorescence for protein nanoparticles
  with different surface protein spacing.(D) Histograms of alternative pathway C3b
  fluorescence per nanoparticle. Red boxes in (C) and (D): high-C3b populations.(E)
  Schematics of C3b-high (low surface protein spacing) and C3b-low nanoparticles.(F)
  Schematic showing method for NTA of C3b deposition on nanoparticles.(G) Images of
  fluorescent C3 signal in NTA of serum + fluorescent C3 + protein nanoparticle samples.(H)
  Concentration vs. size of total nanoparticles (black) and C3-positive nanoparticles
  (red) with different surface protein spacing (red curves) (n = 3 replicate nanoparticle-serum
  preparations).(I) %Nanoparticles that are C3-positive vs. protein spacing on the
  nanoparticles (data derived from panel H).(J) Schematic of proposed mechanism by
  which surface protein spacing regulates C3-surface interactions. Top: C3b generation
  and adhesion on surfaces with large protein spacing. Leftmost top: generation of
  a surface-bound C3b-Bb complex via tick-over. Middle top: generation of a second
  C3b via cleavage of fluid-phase C3 by the initial C3b-Bb complex. Rightmost top:
  failure of C3b to adhere to the surface with large protein spacing, wherein the
  thioester on the newly generated C3b hydrolyzes before the C3b can diffuse to a
  new adhesion site. Lower: C3b generation and adhesion on surfaces with small protein
  spacing. Rightmost lower: C3b generated on the surface diffuses to an adhesion site
  before hydrolysis, forming new C3b-Bb complexes and yielding a positive feedback
  loop of C3b generation and adhesion.See also Figures S1, S4, and S5'
