figure_title: A rescue experiment confirmed that ITGA2 promotes resistance to lenvatinib
  in hepatocellular carcinoma by activating the FOXO signaling pathway.
caption: A rescue experiment confirmed that ITGA2 promotes resistance to lenvatinib
  in hepatocellular carcinoma by activating the FOXO signaling pathway. (A–C) After
  treatment with LY294002, Huh7 (B) cells with ITGA2 overexpression, Huh7-LR (A) cells
  with 740-YP knockdown, and Huh7-LR (C) cells treated with inhibitors were used for
  colony formation experiments to evaluate the proliferation ability of cells treated
  with lenvatinib. (D–F) After treatment with LY294002, ITGA2-overexpressing Huh7
  (E) cells, 740-YP-treated ITGA2-knockdown Huh7-LR cells (D), and Huh7-LR cells treated
  with inhibitors (F) were subjected to WB experiments to detect the expression levels
  of ITGA2, Bax, Bcl-2, and Caspase-3 in the cells treated with lenvatinib. (G–I)
  After treatment with LY294002, Huh7 (H) cells with ITGA2 overexpression, 740-YP-treated
  ITGA2-knockdown Huh7-LR cells (G), and Huh7-LR (I) cells treated with the inhibitor
  were subjected to flow cytometry to detect the rate of apoptosis in response to
  lenvatinib treatment. The total apoptosis rate (sum of early and late apoptosis)
  is delineated by the yellow boxes. (J–L) After treatment with LY294002, ITGA2-overexpressing
  Huh7 (K) cells, 740-YP-treated ITGA2-knockdown Huh7-LR (J) cells, and Huh7-LR (L)
  cells treated with the inhibitor were subjected to flow cytometry to detect the
  cell cycle during lenvatinib treatment. (A–L) All the cells were treated with the
  appropriate concentrations of lenvatinib (1 μM lenvatinib for the overexpression
  group, 10 μM lenvatinib for the knockdown group, and 10 μM lenvatinib for the inhibitor
  group). * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001. ns, not significant
