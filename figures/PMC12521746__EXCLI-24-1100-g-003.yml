figure_title: Immunoregulatory pathways involving TIGIT and VISTA checkpoints in tumor
  immunotherapy. This figure illustrates the molecular interactions between the TIGIT
  and VISTA immune checkpoints and their roles in modulating antitumor immune response.
  Panel A shows the TIGIT-CD155-DNAM 1 axis in non-small cell lung cancer (NSCLC)
  cells, where TIGIT engagement dampens PI3K signaling, resulting in CD8+ T cell exhaustion
  in NSCLC. Panel B depicts the VISTA-PSGL-1 pathway, in which VISTA on myeloid-derived
  suppressor cells (MDSCs) suppresses TCR signaling in exhausted anti-VISTA CD8+ T
  cells. Panel C highlights the synergy between TIGIT and VISTA, where VISTA acts
  on myeloid-derived suppressor cells (MDSCs) and tumor-associated macrophages, thereby
  promoting anti-VISTA activity. Panel D illustrates the concept of dual checkpoint
  inhibition, where the combined targeting of TIGIT and VISTA leads to the reactivation
  of exhausted CD8+ T cells within the tumor microenvironment, thereby enhancing antitumor
  immunity
