figure_title: IGF1–mTOR Axis regulates neural progenitor translational programs governing
  biosynthesis, energy metabolism, proteostasis, and genome stability
caption: (A) Workflow illustrating ribosome profiling (Ribo-Seq) in cultured FOXG1+
  neural progenitors, including cycloheximide treatment, ribosome-protected fragment
  (RPF) isolation, and sequencing.(B-C) Cumulative distribution plots show that IGF1
  broadly enhances translation efficiency transcriptome-wide, while Torin1 attenuates
  this effect, particularly for known mTOR targets.(D) KEGG pathway enrichment identifies
  ribosome biogenesis, oxidative phosphorylation, proteasome function, and neurodegenerative
  pathways (e.g., Parkinson’s, Huntington’s) among IGF1-upregulated translational
  targets.(E-F) GO biological processes enriched among IGF1-upregulated transcripts
  include cytoplasmic translation, ribonucleoprotein biogenesis, and macromolecule
  biosynthesis.(G) IGF1-responsive translational programs prominently involve proteostasis
  mechanisms such as ubiquitin-dependent protein catabolism and multivesicular body
  transport.(H) IGF1 stimulation enhances translation of mitochondrial pathways, including
  the electron transport chain and oxidative phosphorylation.(I) IGF1 promotes translation
  of genes involved in genome stability, including DNA repair, chromatin remodeling,
  and cell cycle checkpoints
article_title: Spatially Organized IGF1–mTOR Signaling Controls Human Forebrain Progenitor
  F ate Through Coordinated Transcriptional and Translational Programs
