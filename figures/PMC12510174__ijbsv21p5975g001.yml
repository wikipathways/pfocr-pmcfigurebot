figure_title: Single-cell analysis reveals enhanced macropinocytic activity in RB
  cells versus normal intraocular cells.
caption: Single-cell analysis reveals enhanced macropinocytic activity in RB cells
  versus normal intraocular cells. (A-B) UMAP projection of single-cell transcriptomes
  from four independent retinal tissue samples(A) and integrated UMAP visualization(B)
  of the combined dataset (GSE249995) are presented, with individual points representing
  cells and colors indicating computationally annotated clusters. (C) Cell-type annotation
  was achieved using published single-cell RNA-seq datasets through reference-based
  mapping. (D) Specific gene markers were identified for each cell type. (E) Expression
  levels of marker genes associated with the retinoblastoma cell class are shown.
  (F) Gene set enrichment analysis (GSEA) of genes in the Rac1 pathway (NES=1.30).
  (G) A violin plot illustrates the expression levels of Rac1 and PAK1 across different
  cell types. (H) The t-SNE visualization depicts Rac1 and PAK1 expression patterns,
  with gradient colors representing normalized expression levels
