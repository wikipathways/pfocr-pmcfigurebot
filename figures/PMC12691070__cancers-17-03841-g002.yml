figure_title: Urine sample comparisons between patients and healthy subjects.
caption: 'Urine sample comparisons between patients and healthy subjects. (A) α-diversity
  boxplot where the asterisk denotes p-value significance. (B,C) Effect plot representing
  the DAA (B) and functional analysis (C) results. Each dot represents a single genus
  or pathway, displaying on the x-axis its median difference in pairwise comparisons
  between groups (difference) and on the y-axis the maximum within-group variance
  (dispersion). Difference > 0 means that the genus or the pathway is more enriched
  in patients. Blue dots represent the differentially enriched genera or pathways
  (p < 0.05 and ES > |1|). Notation: *: p < 0.05; **: p < 0.01'
