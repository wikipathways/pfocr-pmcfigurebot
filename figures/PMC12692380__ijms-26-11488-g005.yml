figure_title: DEGs and cell wall metabolism overview in the two C.
caption: 'DEGs and cell wall metabolism overview in the two C. pepo cultivars following
  P. xanthii infection. Schematic overview of differentially expressed genes (DEGs)
  in partially resistant (968Rb) and susceptible (TF) C. pepo genotypes following
  P. xanthii inoculation. Genes are categorized based on functional annotation using
  MapMan, with expression changes indicated by color (green: upregulated; red: downregulated).
  The figure includes a focused view of DEGs involved in cell wall metabolism, highlighting
  genes related to precursor synthesis (pectin, hemicellulose, cellulose), cell wall
  modification, and structural proteins. Key gene abbreviations are provided to assist
  interpretation (e.g., UGE, UXS, MUR4, GAE, PL, XTHs, CSL). This integrated representation
  illustrates both the overall transcriptional response to biotic stress and specific
  alterations in cell wall-related pathways relevant to disease resistance'
article_title: AI-Integrated Omics Analysis Reveals Cultivar-Specific Resistance Mechanisms
  to Powdery Mildew in Cucurbita pepo
