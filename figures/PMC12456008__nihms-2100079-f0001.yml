figure_title: Strain differences in neonatal hyperoxia-induced lung injury
caption: '(a) Neonatal C57BL/6J (B6) and DBA/2J (DBA) mice were exposed to 75% oxygen
  (Hyperoxia) from P0 to P14 and harvested at P14 for analysis. Littermate controls
  raised in room air (21% oxygen, Normoxia) were served as controls. Body weights
  in hyperoxia-exposed B6 and DBA mice. Data are mean ± SEM (n=6 for each group).(b)
  H&E staining was performed on formalin fixed paraffin embedded lungs to assess the
  alveolar complexity at P14 in B6 mice (left panels) and DBA mice (right panels)
  with scale bars denoting 100 μm. The bar graph represents the results of the quantification
  of alveolar simplification using mean linear intercept. Data are mean ± SEM (B6
  Nx, n = 4; B6 Hprx, n = 4; DBA Nx, n = 6; DBA Hprx, n = 6). ANOVA was performed
  followed by Tukey’s post hoc comparison. **p < 0.01 and ***p < 0.001.(c) Bronchoalveolar
  lavage (BAL) was performed at P14 in hyperoxia-exposed B6 and DBA mice, and the
  control mice. Data are mean ± SEM (B6 Nx, n = 7; B6 Hprx, n = 7; DBA Nx, n = 7;
  DBA Hprx, n = 8). ANOVA was performed followed by Tukey’s post hoc comparison. *p
  < 0.05. n.s.: not significant.(d) RNA-seq in whole lung tissues of B6 and DBA mice
  at P14. Heatmap shows the 6201 differentially expressed genes (FC > 1.5; p-adj <
  0.05) comparing hyperoxia-exposed B6 and DBA mice, and the normoxic controls (B6
  Nx, n = 2; B6 Hprx, n = 3; DBA Nx, n = 4; DBA Hprx, n = 4).(e) Scatterplots of RNA-seq
  data in whole lung tissues showing hyperoxia-regulated gene expression in B6 mice
  (left panel) and DBA mice-regulated gene expression in the hyperoxic conditions
  (right panel). Dark red dots in left panel: significant hyperoxia-induced genes
  in B6 mice, light red dots in left panel: significant hyperoxia-suppressed genes
  in B6 mice, dark red dots in right panel: significant DBA mice-suppressed genes
  in the hyperoxic conditions, dark purple dots in right panel: significant DBA mice-induced
  genes in the hyperoxic conditions (FC > 1.5; FDR < 0.05). Venn diagram shows the
  overlap between hyperoxia-induced genes in B6 mice (n = 287) and hyperoxia-suppressed
  genes in DBA mice (n = 1320).(f) KEGG pathway (left panel) and Gene Ontology enrichment
  (right panel) analysis of the 97 genes that were induced in B6 mice and suppressed
  in DBA mice by hyperoxia. P-values were calculated from hypergeometric distribution.(g)
  Bar plots for expression of representative genes belonging to the p53 signaling
  pathway. Data are mean ± SEM. **p-adj < 0.01 and ***p-adj < 0.001 reported by DESeq2
  using the Benjamini–Hochberg method for the multiple-testing correction (B6 Nx,
  n = 2; B6 Hprx, n = 3; DBA Nx, n = 4; DBA Hprx, n = 4). Each dot represents one
  mouse.(h) Caspase 3 activity measured in cytosolic fractions from whole lung tissues
  (B6 and DBA mice) harvested on P14. Data are mean ± SEM (n=3 for each group). ANOVA
  was performed followed by Tukey’s post hoc comparison. *p < 0.05 and **p < 0.01.(i)
  Bar plots for expression of representative genes belonging to the cell proliferation
  pathway. Data are mean ± SEM. ***p-adj < 0.001 reported by DESeq2 using the Benjamini–Hochberg
  method for the multiple-testing correction (B6 Nx, n = 2; B6 Hprx, n = 3; DBA Nx,
  n = 4; DBA Hprx, n = 4). Each dot represents one mouse (b, c, g, h, i). See also
  Extended Data Fig. 1'
