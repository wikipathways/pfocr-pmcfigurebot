figure_title: SuMMIT-SRS imaging dissects carbon source for hepatic de novo lipogenesis
  under intermittent fasting
caption: '(a) Cartoon showing the mice fed with D-labels in drinking water with the
  liver sections examined by SuMMIT-SRS imaging. (b) Images showing SuMMIT-SRS-detected
  single and merged channels of acetate-, glutamine-, and methionine-derived protein
  and lipid signals in the fed and fasting mouse liver. Scale bar: 20 μm. (c) Quantification
  of macromolecule synthesis by the ratio of CD (AUC) to CH (AUC) based on the Raman
  spectra. n=3 mice per group. (d) qRT-PCR showing an increased expression of FASN
  gene in fasting liver compared to the control group. n=3 mice per group. (e-f) Raman
  spectra of the CD region of acetate-, glutamine-, and mix labeling-derived lipids
  from fed(e) and fasting(f) liver, respectively. Each spectrum was averaged from
  n=30 spectra collected from 4 mice per group. (g-h) Quantification of lipid synthesis
  from D-acetate (g) and D-glutamine (h) by the CD/CH ratio based on the unmixed SRS
  signals. n=4 mice per group. (i) SRS ratiometric images generated by the intensity
  ratio of D-glutamine derived lipids to D-acetate derived lipids based on the unmixed
  SRS signal. n=4 mice per group. (j) Quantification of the intensity ratio of D-glutamine
  derived lipids to D-acetate derived lipids based on (i). n=4 mice per group. (k-n)
  qRT-PCR showing an increased expression of genes in glutamine metabolic pathway
  (ACLY (k) and GLD1 (l)) but a reduction of gene expression in acetate metabolic
  pathway (ACSS2 (m) and ACACA (n)) in fasting liver compared to the control group.
  n=3 mice per group. (o) Redox ratio images (NADH/FAD) generated by two photon excited
  fluorescence (TPEF) imaging detected NADH and FAD signal in the fed and fasting
  liver. (p) Quantification of redox ratio within PV and CV regions in the fed and
  fasting liver. n=30 ROIs from 3 mice for each group. (q-r) Stimulated Raman Scattering
  Hyperspectral Imaging (SRS-HSI) combined with unsupervised K-means clustering applied
  to the C─H stretching spectral region to analyze liver tissue under fed and fasting
  conditions. Each cluster, identified by a distinct color, corresponds to a unique
  chemical profile derived from the spectral data. The spatial localization of each
  color in the image reveals the distribution of these chemical features across the
  tissue (q). The spectral plot displays the average Raman spectra for each cluster
  (r), with the curve color matching the corresponding spatial region, thereby enabling
  direct correlation between chemical composition and tissue morphology. C, cluster.
  The arrows indicate lipid peaks at 2850, 2880, and 3015 cm−1. Each clustering image
  represents 9 ROIs from 3 mice for each group. Values in (c, d, g, h, j-n, p) are
  mean ± SEM. ns, not significant; *, p < 0.05; **, p < 0.01; ***, p < 0.001 by Student’s
  t-test'
