figure_title: Glycolysis imbalance in PEO.
caption: Glycolysis imbalance in PEO. (A) The bar plot shows the protein expression
  of the glycolysis pathway in PEO (n = 8) vs. Ctrl (n = 8). A Fold Change (FC) threshold
  of 1.5 was applied, while the strength of the statistical significance was determined
  according to the t-test (p-value cutoff at 0.1, 0.05, and 0.01). Protein expression
  is reported as PEO vs. Ctrl ratio FC, with proteins showing FC > 1.5 in red and
  those with FC < −1.5 in blue. Statistical significance for PEO vs. Ctrl is displayed
  using (*) for p-value < 0.1, (**) for p-value < 0.05, and (***) for p-value < 0.01.
  Several glycolytic enzymes resulted upregulated in the PEO group. (B) The heatmap
  displays the Log2FC values (x-axis) for the POLG vs. Ctrl, TWNK vs. Ctrl, and Sdel
  vs. Ctrl ratios related to glycolysis enzymes. A Fold Change (FC) threshold of 1.5
  was applied. Proteins upregulated in the variants with respect to Ctrl are shown
  in red, while the downregulated ones are in blue. The most significant impairment
  appears to affect TWNK, followed by POLG. In the Sdel variant, alterations in PGAM1
  and PKM are observed, but the overall condition is switched off compared to the
  nuclear variants
