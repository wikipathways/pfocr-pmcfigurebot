figure_title: Transcriptomic analysis reveals metabolic remodeling in S.
caption: Transcriptomic analysis reveals metabolic remodeling in S. mutans upon erythritol
  treatment. (A) Principal component analysis (PCA) of RNA-seq data from S. mutans
  cultured with or without 10% erythritol (n = 3). Each dot represents one replicate;
  ellipses indicate 95% confidence intervals. (B) Pearson correlation heatmap showing
  intra- and inter-group sample correlations. Color scale represents R2 values. (C)
  KEGG pathway enrichment of significantly differentially expressed genes (|log2 fold
  change| ≥ 1, adjusted p < 0.05). The x-axis represents −log10 (adjusted p-value).
  Red bars indicate enrichment among upregulated genes, and green bars indicate enrichment
  among downregulated genes. (D) GO enrichment analysis of differentially expressed
  genes. The x-axis represents −log10 (adjusted p-value)
