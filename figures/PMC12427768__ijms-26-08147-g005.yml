caption: Gm39822 is a proinflammatory lncRNA in non-diabetic endothelial cells (mECs).
  (A–H) The expression of inflammatory signaling pathways as detected using Western
  blot analysis (A) for (B) p-p65, (C) p65, (D) p50, (E) ERK1/2, (F) p-ERK1/2, (G)
  p-p38, and (H) p38 expression after knockdown of Gm39822 in non-diabetic endothelial
  cells (mECs) under basal conditions or Il-1β stimulation (20 ng/mL; n = 3/group)
  at the indicated time points. (I–P) The expression of inflammatory signaling pathways
  as detected using Western blot analysis (I) for (J) p-p65, (K) p65, (L) p50, (M)
  p-ERK1/2, (N) ERK1/2, (O) p-p38, and (P) p38 expression after Gm39822 overexpression
  in non-diabetic endothelial cells (mECs) under basal conditions or Il-1β stimulation
  (20 ng/mL; n = 3/group) at the indicated time points. The data are represented as
  the mean ± SEM, and statistical significance was determined with an unpaired two-tailed
  Student t-test. ns—non significant,* p < 0.05, ** p < 0.01, **** p < 0.0001
