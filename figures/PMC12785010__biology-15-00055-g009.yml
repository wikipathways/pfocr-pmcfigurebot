caption: Effects of early exercise intervention on serum MSTN, quadriceps femoris
  MSTN and femur-related signaling pathway gene and protein expression in OVX rats.
  (A) Serum MSTN. (B) MSTN mRNA expression. (C) ActRIIB mRNA expression. (D) Smad
  3 mRNA expression. (E) Wnt mRNA expression. (F) GSK-3β mRNA expression. (G) β-catenin
  mRNA expression. (H) Related protein expression of MSTN. (I) Related protein expression
  of ActRIIB. (J) Related protein expression of Smad 3. (K) Related protein expression
  of Wnt. (L) Related protein expression of GSK-3β. (M) Related protein expression
  of β-catenin. (N) Western blot images. Statistical analysis was performed using
  one-way ANOVA followed by Tukey’s post hoc test for pairwise comparisons; n = 3
  or 4 biologically independent samples; *** p < 0.001, ** p < 0.01, * p < 0.05. Data
  are represented as means ± SD. The original Western blot images were summarized
  in Table S2
