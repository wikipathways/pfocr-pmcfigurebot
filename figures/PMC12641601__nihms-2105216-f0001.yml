figure_title: Integration of proteo-genomics and forward genetics to reveal novel
  vulnerabilities in TNBC
caption: To identify selective vulnerabilities of PTPN12-deficient TNBC, we integrated
  information from two orthogonal datasets. (A) First, we performed proteogenomic
  characterization of a cohort of TNBC PDX models that were classified into two groups
  based on their PTPN12 expression status. This allowed for the identification of
  pathways that are specifically dysregulated in PTPN12-deficient TNBC. (B) Second,
  we performed a genetic screen to identify genes that are selectively essential in
  PTPN12-deficient cells. Immortalized human mammary epithelial cells (HMECs) engineered
  with a doxycycline-inducible PTPN12 shRNA were transduced with an shRNA library
  targeting 2,569 genes. Genes that are selectively lethal in the PTPN12-deficient
  state represent candidate tumor-selective vulnerabilities of PTPN12-deficient TNBC.
  (C) These two datasets were integrated using geneset enrichment analysis (GSEA)
  to identify genesets that are mutually enriched and represent pathways that are
  both selectively dysregulated in PTPN12-deficient TNBC models and selective vulnerabilities
  of PTPN12-deficient cells
