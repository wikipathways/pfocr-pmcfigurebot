figure_title: TCF4 and β-catenin reciprocally regulate AM inflammation and self-renewal
caption: A. Representative IF images of TCF4 in Ctnnb1fl/fl and CtnnbcKO AM stimulated
  with or without Poly(I:C). Violin plot representing TCF4 MFI in Ctnnb1fl/fl or Ctnnb1cKO
  AM stimulated with or without Poly(I:C). Scale bar 10 μm.B. Immunoblot of active
  β-catenin, HIF-1α and β-Actin in Tcf7l2fl/fl or Tcf7l2cKO AMs treated with or without
  Poly(I:C).C. Bar graph showing relative expression of active β-catenin in Tcf7l2fl/fl
  or Tcf7l2cKO AMs treated with or without Poly(I:C) quantified from three individual
  experiments.D. Bar graph showing relative expression of HIF-1α in Tcf7l2fl/fl or
  Tcf7l2cKO AMs. AMs treated with or without Poly(I:C) quantified from three individual
  experiments.E. Bar graph showing relative expression of Wnt signaling pathway genes
  (Fzd2, Ctnnb1, Wnt1, Wnt4) in Tcf7l2fl/fl or Tcf7l2cKO AMs treated with or without
  Poly(I:C).F. Bar graph showing relative expression of inflammatory cytokine expression
  (Il1b, Il6, Tnf, and Ccl2) in Tcf7l2fl/fl or Tcf7l2cKO AMs treated with or without
  β-catenin inhibitor (XAV939) or HIF-1α inhibitor (LW6).G. Graph showing oxygen consumption
  rate (OCR) measurements in WT and Tcf7l2cKO AMs treated with or without β-catenin
  inhibitor (XAV939) or HIF-1α inhibitor (LW6). Right bar graph of OCR measurements
  in WT and Tcf7l2cKO AMs treated with or without β-catenin inhibitor (XAV939) or
  HIF-1α inhibitor (LW6).Data are representative of at least two independent experiments
  with similar results, p-values are represented as *p< 0.05, **p< 0.01, ***p< 0.005,
  ****p< 0.001
