figure_title: SIRT4 negatively regulates ferroptosis during liver I/R injury.
caption: SIRT4 negatively regulates ferroptosis during liver I/R injury. (A) Heatmap
  analysis of liver samples from WT and SIRT4 KO mice after LIRI. (B) KEGG enrichment
  scatter plot analysis of liver samples from WT and SIRT4 KO mice after LIRI. (C)
  GSEA of ferroptosis signaling pathway components in WT and SIRT4 KO mice after LIRI.
  (D) MDA, GSH and Fe2+ contents in liver tissue from WT and SIRT4 KO mice subjected
  to different treatments (n=6/group). (E) Mitochondrial structure of WT and SIRT4
  KO mice subjected to different treatments was observed via TEM (n=6/group). (F)
  Protein detection and statistical analysis of ACSL4, SLC7A11 and GPX4 in the liver
  tissues of WT and KO mice subjected to different treatments (n=6/group). (G) mRNA
  expression of ACSL4, SLC7A11 and GPX4 in the liver tissues of WT and KO mice subjected
  to different treatments (n=6/group). (H) MDA, GSH and Fe2+ contents in liver tissue
  from AAV-GFP and AAV-SIRT4 mice subjected to different treatments (n=6/group). (I)
  Mitochondrial structure of AAV-GFP and AAV-SIRT4 mice subjected to different treatments
  was observed via TEM. (J) Protein detection and statistical analysis of ACSL4, SLC7A11
  and GPX4 in liver tissues from AAV-GFP and AAV-SIRT4 mice subjected to different
  treatments (n=6/group). (K) mRNA expression of ACSL4, SLC7A11 and GPX4 in liver
  tissue from AAV-GFP and AAV-SIRT4 mice subjected to different treatments (n=6/group).
  The data are presented as mean ± SD. *P<0.05; **P<0.01
