caption: 'Schematic diagram of Molecular Mechanisms of Disease-Associated Proteins
  from A. muciniphila (A) Signaling cascades in intestinal L cells and downstream
  systemic metabolic effects. GLP-1 secretory pathways: (1) P9 binds to ICAM-2 and
  synergizes with IL-6 from immune cells to activate the PLC-Ca2+-CREM axis, promoting
  GLP-1 release; (2) P5 activates FFAR-2 (a G protein-coupled receptor, GPCR) to induce
  GLP-1 synthesis; (3) Amuc_1100 engages TLR2 to augment GLP-1 secretion. Systemic
  physiological effects of GLP-1: Circulating GLP-1 exerts pleiotropic metabolic effects,
  including inducing satiety in the brain, improving insulin resistance and glucose
  intolerance in the pancreas, and promoting thermogenesis and energy expenditure
  in brown adipose tissue (BAT). Inflammatory suppression pathway: Amuc_1100 alleviates
  HFD-induced NAFLD by downregulating nucleotide-binding oligomerization NLRP3, TLR4,
  NF-κB, and pro-inflammatory cytokines (TNF-α, IL-6). (B) In adipocytes, Amuc_1100
  activates the TLR2–MyD88–PI3K/Akt–AC3 cascade, elevating cAMP to activate PKA, which
  phosphorylates HSL (Ser 660) to drive lipolysis. (C) Amuc_1434 downregulates Muc2
  expression in CRC cells to inhibit cancer cell adhesion, upregulates p53 and activates
  the TRAIL-mediated apoptotic pathway, thereby suppressing tumor proliferation, promoting
  cancer cell apoptosis, and ultimately blocking CRC progression. (D) Amuc_1409 binds
  to E-cadherin on intestinal epithelial cells, induces dissociation of the E-cadherin/β-catenin
  complex, activates the Wnt/β-catenin signaling pathway, and promotes intestinal
  stem cell (ISC) proliferation and gut epithelial regeneration. (E) Amuc_2109 reshapes
  the intestinal flora, downregulates pro-inflammatory factors (TNF-α, IL-6) and NLRP3
  inflammasome expression, upregulates tight junction proteins, enhances intestinal
  barrier function, and maintains intestinal flora homeostasis. Arrows indicate upregulation
  (↑) or downregulation (↓) of gene/protein expression or biological activity'
