caption: TGF-β1-induced α-smooth muscle actin (α-SMA) expression and the serine–glycine
  pathway activation are enhanced in lung fibroblasts from mito-mice ND6M. The mRNA
  expression of α-SMA, type I collagen (COL1A1) (A), phosphoserine phosphatase (PSPH),
  and serine hydroxymethyltransferase2 (SHMT2) (B) in primary lung fibroblasts generated
  from wild-type (WT) and mito-mice ND6M (ND6M) cultured in medium alone (cont) or
  in medium with TGF-β1 for 72 h. Data are representative of two independent experiments
  and shown as the mean ± SD (n = 6). * p < 0.05
