caption: Overview of the full text. The rumen microbial community and metabolome of
  the two groups of beef cattle were analyzed. Dietary supplementation with RP-β-Ala
  increased the abundance of beneficial bacteria, such as Prevotella, Treponema, and
  Selenomonas, which improved ruminal fermentation, optimized rumen fermentation capacity,
  and provided more energy for beef cattle growth. The abundance of harmful bacteria,
  such as Thermobifida, Thermoactinomyces vulgaris, and Saccharopolyspora, was inhibited.
  Moreover, a significant positive correlation was observed between Saccharopolyspora
  and spermidine, indicating that this bacterial genus may be an important contributor
  to the ruminal polyamine pool. Additionally, the arachidonic acid metabolism pathway
  was modulated. This suggests that RP-β-Ala could stimulate beef cattle growth by
  boosting antioxidant capacity and reducing inflammation
article_title: Effects of Rumen-Protected β-Alanine on Growth Performance, Rumen Microbiome,
  and Serum Metabolome of Beef Cattle
