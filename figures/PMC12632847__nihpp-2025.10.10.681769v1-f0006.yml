figure_title: SuMMIT-SRS imaging unveils the metabolic pathway shift in aging i-Neurons
caption: '(a) Schematic depiction of direct conversion of donor fibroblasts to neurons.
  (b) Brightfield images showing the morphological characteristics of transdifferentiating
  neurons. (c) Map2 staining to confirm the identity of the converted neurons. (d)
  Raman spectra of the CD lipids from young and old neurons, respectively. Each spectrum
  was averaged from n=30 spectra collected from 3 independent groups. (e-f) A-PoD-processed
  high-resolution ratiometric images of glutamine/glucose lipid signal in single lipid
  droplets (LDs). The color of each LD represents the ratio intensity map of glutamine/glucose
  derived lipid ratio value (e). Quantification of the mean intensity of the glutamine/glucose-derived
  lipid ratio (f). (g) Correlation between LD size distribution and glutamine/glucose-derived
  lipid ratio. The plot shows a clear separation between the ratios of Glutamine-
  to Glucose-derived lipids in two age groups, particularly for larger LDs. (h) Raman
  spectra of protein signals from young and old i-neurons after 5 days of co-labeling
  with D-glucose, D-glutamine, D-methionine, D-tyrosine and D-leucine. (i) Zoomed-in
  view of the C─D region from (h). (j) Quantification of protein synthesis by the
  ratio of CD (AUC) to CH (AUC) based on the Raman spectra in (i). n=15 spectra per
  group. (k) Images showing SuMMIT-SRS-detected single channel of glutamine-, methionine-,
  tyrosine-, and leucine-derived protein signals in the young and old neurons. Arrows
  indicate protein aggregations. Scale bar: 10 μm. (l) Quantification of protein synthesis
  from each deuterium labeled precursor by the CD/CH ratio based on the unmixed SRS
  signals in (K). n=15 ROIs per group. Values in (j, l) are mean ± SEM. ns, not significant;
  **, p < 0.01 by Student’s t-test'
