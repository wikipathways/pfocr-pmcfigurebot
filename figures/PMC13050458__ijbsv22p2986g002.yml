caption: 'FOXM1-regulated genes involve in DNA repair, cell cycle, stemness and EMT.
  (A) GO function and KEGG pathway enrichment analysis of DEGs between FOXM1 KD and
  NC KD in HUH7 cells. (B). GO function and KEGG pathway enrichment analysis of top
  50 targets in the PPI network of FOXM1. (C). Volcano plot for the DEGs involved
  in DNA repair and cell cycle analyzed by RNA-seq. (D) Volcano plot for the DEGs
  involved in cell stemness, invasion and migration. (E). The relationship between
  FOXM1 expression and HCC cell stemness in TCGA. (F). Differential expression of
  genes between LIHC tissues and adjacent tissues in TCGA. (G). ROC curves for the
  relationship between gene expression and HCC prognosis. Data were statistically
  analyzed using one-way ANOVA: *P<0.05 compared with adjacent tissues'
