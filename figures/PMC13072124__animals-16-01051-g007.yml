figure_title: Differential immune pathway expression between SARDS and CAR.
caption: Differential immune pathway expression between SARDS and CAR. Differential
  KEGG pathway enrichment between SARDS and CAR. CAR demonstrated stronger expression
  of chemokine signaling genes (e.g., CCR5, CXCR4), potentially indicative of the
  paraneoplastic immune modulation in CAR retinas. SARDS showed greater enrichment
  for complement and coagulation pathways (e.g., C5AR1), potentially indicative of
  vascular inflammation and innate immune activation
