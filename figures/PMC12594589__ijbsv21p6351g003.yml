caption: TTC36 suppresses HCC progression via SPRED1-mediated inhibition of Ras/MAPK
  signaling. A. Hierarchical clustering heatmap of RNA-seq data from TTC36-overexpressing
  and control HCC cells. B. KEGG pathway enrichment analysis of differentially expressed
  genes. Top 15 pathways ranked by significance. C. Venn diagram identifying SPRED1,
  SPRY2, and SPRY4 as overlapping genes between DEGs and Ras/MAPK regulators. D. Correlation
  analysis of TTC36 and SPRED1 mRNA levels in HCC clinical samples (n=80, R=0.4059,
  P = 0.0057). E. SPRED1 expression level in 80 paired HCC and non-tumor tissues.
  F-G. SPRED1 mRNA (E) and protein (G) levels in TTC36-modulated cells. H. Western
  blot analysis of MEK/ERK phosphorylation in SPRED1-modulated cells. I. Colony formation
