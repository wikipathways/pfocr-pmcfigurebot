figure_title: The pyruvate–glyoxalate pathway.
caption: The pyruvate–glyoxalate pathway. The pyr-glyox pathway starts with the aldol
  reaction depicted in (A). The pathway between pyruvate and glyoxalate in the presence
  of reduced Fe2+ (B). The cycle involves aldol/retro-aldol condensation (orange arrows,
  e.g., pyr + glyox → hydroxyglutarate and isocitrate → succinate + glyoxalate for
  aldol and retro-aldol reactions, respectively), hydration/retrohydration (blue arrows,
  e.g., hydroxyglutarate → oxopentenedioate), oxidative decarboxylation (green arrows,
  oxalohydroxyglutarate → isocitrate + CO2) and reduction/oxidation (violet arrows,
  e.g., succinate → fumarate). From [9]
