figure_title: PSAT1 promotes HOS and 143B migration by activating the mTOR/S6K pathway.
caption: PSAT1 promotes HOS and 143B migration by activating the mTOR/S6K pathway.
  (A) mTOR transcriptional levels after siPSAT1 interference in HOS and 143B cells
  by qPCR. (B) The subcellular positions of PSAT1 and mTOR in HOS and 143B cells by
  immunofluorescence staining. (C) HOS and 143B cells were treated with 100 μg/mL
  CHX for 0, 4, 12, and 24 hours in the control and siPSAT1 groups, and the mTOR protein
  levels were analyzed by western blotting. (D) Western blotting analysis of PSAT1,
  PI3K, p-PI3K, mTOR, p-mTOR, and p-S6K levels after siPSAT1 in HOS and 143B. (E)
  PSAT1 overexpression (using pcDNA3.1-PSAT1 overexpression plasmid) in HOS and 143B,
  and mTOR inhibition (using rapamycin) reducing effector protein S6K phosphorylation.
  (F) Migration of HOS and 143B after PSAT1 overexpression and mTOR pathway inhibition,
  analyzed by wound-healing assay, scale bars, 200 µm; the indicated results represent
  the mean ± SD (n=3), * P < 0.05, ** P < 0.01, *** P < 0.001. (G) Cell migration
  ability in Transwell assay, scale bars, 100 µm; the indicated results represent
  the mean ± SD (n=3), * P < 0.05, ** P < 0.01, *** P < 0.001
