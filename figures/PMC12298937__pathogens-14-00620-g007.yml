figure_title: Scheme of EGFR/TLR4 signaling cascades likely involved in altering cholangiocyte
  proliferation and migration under the influence of the excretory–secretory product
  of O.
caption: 'Scheme of EGFR/TLR4 signaling cascades likely involved in altering cholangiocyte
  proliferation and migration under the influence of the excretory–secretory product
  of O. felineus. Two main proposed pathways for EGFR activation are presented. The
  direct pathway of EGFR activation: O. felineus ESP potentially interacts with EGFR,
  causing activation of downstream PI3K/AKT and Ras/ERK1/3 signaling pathways followed
  by stimulation of angiogenesis, cell survival, cell proliferation, and migration.
  Alternatively, MMPs can be activated via TLR4-associated pathways, followed by the
  release of various EGFR ligands. These ligands then bind to EGFR. Marimastat inhibits
  MMP activity through direct binding, preventing the release of EGFR ligands. EGFR
  inhibitor can block EGFR activation, preventing its effects on cells. The scheme
  was prepared using GIMP 2.10 (https://www.gimp.org/) (accessed on 20 June 2025)'
