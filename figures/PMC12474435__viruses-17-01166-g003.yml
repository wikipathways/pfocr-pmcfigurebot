figure_title: Functional enrichment analysis of genes associated with transcription
  factors, based on KEGG 2021 Human pathways.
caption: Functional enrichment analysis of genes associated with transcription factors,
  based on KEGG 2021 Human pathways. (A) UMAP (Uniform Manifold Approximation and
  Projection) visualization displays the clustering of genes based on pathway-level
  functional enrichment. Each cluster represents a significantly enriched KEGG pathway
  and is annotated with a distinct color-coded label. Prominent pathways include Wnt
  signaling, cellular senescence, axon guidance, and transcriptional misregulation
  in cancer, among others. This spatial distribution reflects the underlying transcriptional
  programs and their associated biological functions. (B) Bar chart showing the top
  significantly enriched KEGG pathways, ranked by statistical significance (−log10
  (p-value)). Pathways such as cGMP-PKG signaling, oxytocin signaling, and Wnt signaling
  appear among the most highly enriched, underscoring their potential relevance in
  the transcriptional regulation associated with disease processes
