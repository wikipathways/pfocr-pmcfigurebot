figure_title: Putative interaction networks between mIELs and epithelial cells
caption: A, B, Chord diagrams showing potential signaling pathways upregulated in
  lactation from mIEL populations to epithelial cells (A) and from epithelial cells
  to mIEL populations (B). Ligand–receptor pairs as summarized into functionally related
  signaling pathways. Outer thicker bars represent the cell population that is the
  source or target of the signaling pathway in the chord diagram. The inner thinner
  bar color is the target of the signal. The thickness of the edge represents the
  signaling strength (communication probability) as calculated by CellChat. C, Dot
  plot showing the communication probabilities of ligand–receptor pairs upregulated
  in lactation from mIELs to epithelial cells. Heatmap depicts the communication probability
  of each ligand pair for each cell pair in N and L3 mammary glands. Sender and receivers
  are indicated by the color bars on top. P values computed by CellChat v.2 from a
  one-sided permutation test. D, E, Dot plot of transcript expression levels in mIELs
  (D) and epithelial cells (E) in N and L3 mammary glands, depicting the percent of
  cells expressing and mean expression levels in each cell population. Data are generated
  using scRNA-seq of epithelial and mIEL populations in N (n = 2) and L3 (day 3 postpartum)
  (n = 2) mammary glands
article_title: Mammary intraepithelial lymphocytes and intestinal inputs shape T cell
  dynamics in lactogenesis
