figure_title: Ddit3 is a key regulator of AS-mediated inhibition of BC cell growth.
caption: Ddit3 is a key regulator of AS-mediated inhibition of BC cell growth. (A)
  KEGG enrichment analysis showing differentially expressed pathways in the AS-treated
  group compared to the control group. (B) GSEA indicating that the cell cycle pathway
  was significantly inhibited in the AS-treated group compared to the control group.
  (C) Heatmap of the top 10 differentially expressed genes. (D) Real-time PCR analysis
  detecting the mRNA levels of Ddit3 in MDA-MB-231 (left) or 4T1 cells (right) after
  treatment with AS or vehicle. (E) The mRNA level of Ddit3 in MDA-MB-231 cells and
  4T1 cells transfected with si-Ddit3 was detected by real-time PCR. (F,H) Representative
  flow cytometry images of BrdU incorporation in MDA-MB-231 (F) and 4T1 (H) cells
  after treatment with AS with or without transfection of Ddit3 siRNA (left) and quantification
  (right). (G,I) Representative flow cytometry images of apoptotic MDA-MB-231 (G)
  and 4T1 (I) cells after treatment with AS with or without Ddit3 knockdown (left)
  and the quantification results (right). AS, astragalin; ctrl, control. ** p < 0.01;
  *** p < 0.001. **** p < 0.0001
