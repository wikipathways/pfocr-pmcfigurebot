figure_title: CGRP Activates AREG+ ILC2s that Respond to ADM2
caption: |-
  Heatmap derived from bulk RNA sequencing showing differentially expressed type 2 cytokines in ILC2s cultured under vehicle, CGRP alone, IL-25 alone or IL-25 plus CGRP conditions (A). Heatmap derived from bulk RNA sequencing showing CGRP family of ligands and receptors in ILC2s cultured under vehicle or CGRP treatment conditions (B). Violin plot of Calcrl, Ramp1, Ramp2, and Ramp3
  (C) in ILC2s cultured under vehicle or CGRP treatment conditions. Heatmap derived from bulk RNA sequencing showing GPCR signaling molecules in ILC2s cultured under vehicle or CGRP treatment conditions (D). Bar graph of pathway analysis of differentially expressed genes between vehicle and CGRP treated ILC2s, assessed via GO Biological Processes, ranked by P value (E). In vitro culture of bulk colon lamina propria cells (F) or sort-purified large intestine ILC2s for 72 hours under vehicle and ADM2 treated conditions. Freshly sorted ILC2s were stained with Cell Trace Violet and proliferation was assessed under vehicle and ADM2 treated conditions (G). Volcano plot derived from bulk RNA sequencing showing differentially expressed genes in freshly sorted ILC2s cultured under vehicle or ADM2 treatment conditions (H). Frequencies of AREG+ ILC2s after 72 hours of ADM2 treatment (I). Data are from a representative experiment (F) with (Vehicle n=3, 5 μg/ml ADM2 n=3, 10 μg/ml ADM2 n=3). Data are pooled (G, I) from 3 independent experiments with (Vehicle n=9, ADM2 n=9). Data are Mean ± SEM. P values were calculated using two-sided, Student’s t-tests (C, G, I) and one-way ANOVAs followed by a Tukey’s multiple comparisons test (F). (C) ***P=0.0008, (F) **P=0.0023, ***P=0.0009, (G) **P=0.0092, (I) **P=0.0028
