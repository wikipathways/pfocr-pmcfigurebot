figure_title: LCHADD cardiac transcriptomic analysis reveals differential expression
  of alternative bioenergetic pathways and oxidative stress
caption: A. Volcano plot of differential expression of bulk RNA sequencing of LCHADD
  and WT cardiac tissue (n=6 biological replicates per genotype; 3 male and 3 female
  per genotype). B. Heatmap of differentially expressed genes using KEGG pathway analysis.
  Significant upregulation of glycolysis genes (Hk1= hexokinase, p=2.75e-10; Pfkp
  = phosphofructokinase, p=5.43e-13; Pck2= phosphoenolpyruvate carboxykinase, p=2.3e-22)
  and glutathione synthesis genes (Gss= glutathione synthetase, p=2.60e-2; Gsta2=
  glutathione transferase 2, p=1.5e-9; Gsta1= glutathione transferase 1, p=8.13e-9;
  and Gpx4= glutathione peroxidase 4; p=5.45e-10) and downregulation of TCA cycle
  genes (Ogdhl= oxoglutarate dehydrogenase, p=4.13e-14; Aldob= aldolase B, p=8.3e-9;
  and Idh2= isocitrate dehydrogenase, p=0.0006), downregulation of cardiac muscle
  contraction genes (Cacna2d1= calcium voltage-gated channel, p=1.40e-5; Tpm1= tropomyosin,
  p=1.17e-9; Tnnt2= cardiac muscle troponin T, p=2.72e-7; and Tnni3= cardiac muscle
  troponin I, p=1.48e-10) and downregulation of Ca++ signaling pathway genes (Adra1b=
  adrenergic receptor, p=4.17e-11; Chrm2= cholinergic (M2) receptor, p=2.49e-6; Atp2a3=
  sarcoplasmic intracellular Ca++-ATPase, p=0.0001) C. Glycolysis, gluconeogenesis
  and TCA cycle. mRNA of Pck2 and TCA cycle genes were significantly lower in LCHADD
  hearts; western blot of Glut1 normalized to total protein (n=6 WT, 3 male and 3
  female and n=6 LCHADD, 3 male and 3 female) was not different but IHC for Cox IV
  on heart sections showed decreased protein expression, suggesting high glucose uptake
  but low glucose oxidation (n=4 per group; 2 male as closed circles and 2 female
  as open circles). Scale bar = 25μm. Graphed by mean and SD with two-sided unpaired
  Student t-test. D. Oxidative stress. mRNA of glutathione peroxidases Gsta1 and Gsta2
  indicate increased expression of oxidative stress response genes confirmed by IHC
  on heart sections showing increased protein expression of Gpx4 and Gss in LCHADD
  male (closed circles) and female (open circles) hearts (n=4 per group; 2 male and
  2 female) when compared to WT (p=0.01). Scale bars = 25μm and 50 μm, respectively.
  Graphed by mean and SD with two-sided unpaired Student t-test. E. Cardiac muscle
  contraction and Ca++ signaling. Western blot of Serca2 normalized to total protein
  (n=6 per group, 3 male and 3 female; p=0.09). mRNA of cholinergic and adrenergic
  receptors (Chrm2 and Adra1b) as well as other genes involved in Ca++ signaling and
  cardiac contraction (Tnni3 and Tnnt2) were lower in LCHADD compared to WT confirmed
  by IHC showing reduced protein expression of cardiac troponin I in LCHADD hearts
  when compared to WT. Scale bar = 50μm. Full western blots available in Supplemental
  Figure 4. Graphed by mean and SD with two-sided unpaired Student t-test. ns= not
  significant; * p <0.05; ** p <0.01; *** p<0.001; **** p <0.0001
