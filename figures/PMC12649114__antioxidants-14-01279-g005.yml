figure_title: PD-MSC cocultivation activates the Nrf2 signaling pathway in ARPE-19
  cells exposed to H2O2.
caption: 'PD-MSC cocultivation activates the Nrf2 signaling pathway in ARPE-19 cells
  exposed to H2O2. mRNA expression of (A) PI3K p110a, (B) AKT and (C) Nrf2 levels
  in H2O2-treated ARPE-19 cells treated with 10 ng/mL PEDF, cocultured PD-MSCs or
  their combination. (D) Western blot analysis of antioxidant enzymes in cell lysates
  of H2O2-treated ARPE-19 cells cocultured with PD-MSCs. Quantification of (E) PI3K
  p110a, (F) AKT, (G) Nrf2 and (H) KEAP1 in cell lysates of H2O2-treated ARPE-19 cells
  cocultured with PD-MSCs. Quantitative analysis and representative images of (I,J)
  phospho-Nrf2 and (K,L) KEAP1 in H2O2-treated ARPE-19 cells cocultured with 10 ng/mL
  PEDF, PD-MSCs or their combination. The negative correlation between phospho-Nrf2
  and KEAP1 was determined by the intensity of IF staining. DAPI was used for counterstaining.
  Scale bar = 50 µm. The data represent 2–3 independent experiments for each group
  and are expressed as the mean ± SEM. Statistical significance was determined by
  one-way ANOVA (* p < 0.05 vs. control, # p < 0.05 vs. H2O2 treatment, $ p < 0.05
  vs. PD-MSCs cocultivation)'
