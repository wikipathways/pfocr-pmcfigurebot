figure_title: Overview of the ubiquitin–proteasome system (UPS)
caption: The proteasome, a multi-subunit protease, operates in both the cytosol and
  the nucleus, predominantly degrading proteins tagged with ubiquitin (Ub). Cullin-RING
  ubiquitin ligases, the largest family of E3 enzymes, selectively recognize and ubiquitinate
  a diverse array of substrates due to the modular structure of the cullin complexes.
  Misfolded proteins from the endoplasmic reticulum (ER) and mitochondria can be extracted
  via ER-associated degradation (ERAD) and mitochondria-associated degradation (MAD)
  pathways, respectively, for proteasomal degradation in the cytosol. Additionally,
  the proteasome is capable of degrading certain proteins in a ubiquitin-independent
  manner. For instance, the receptor protein midnolin can selectively recognize several
  transcription factors. Figure created with BioRender
