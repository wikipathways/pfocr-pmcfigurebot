figure_title: Conventional view of the yeast secretory and endocytic pathways.
caption: 'Conventional view of the yeast secretory and endocytic pathways. Single-headed
  arrows indicate pathways mediated by vesicles or other transport carriers, and double-headed
  arrows indicate pathways that involve transformation of a compartment. The following
  concepts are depicted. COPII vesicles bud from the endoplasmic reticulum (ER) and
  deliver biosynthetic cargo proteins to a nascent Golgi cisterna, which progressively
  matures. During cisternal maturation, COPI recycles certain components to the ER,
  and COPI also recycles a subset of the resident Golgi transmembrane proteins in
  a series of retrograde intra-Golgi pathways. At the terminal stage of Golgi maturation,
  biosynthetic cargo proteins and resident TGN transmembrane proteins are sorted into
  one of three pathways: transport to prevacuolar endosome (PVE) compartments with
  the aid of GGAs and Ent3, transport to early endosomes (EE), and transport to the
  plasma membrane in secretory vesicles. Not shown is AP-3-dependent delivery of proteins
  from the TGN to the vacuole. Early endosomes are represented as existing compartments
  that receive traffic from the plasma membrane and TGN, although they could also
  arise from homotypic fusion of endocytic vesicles or from maturation of the TGN
  (Pelham, 2002). The postulated traffic pathway from the TGN to early endosomes has
  not been characterized, but it has been proposed to involve AP-1 (Liu et al., 2008).
  AP-1 and Ent5 mediate retrograde traffic from early endosomes to the TGN. Early
  endosomes mature into PVE compartments, which then fuse with the vacuole to deliver
  their contents, including intraluminal vesicles. Kex2 and Ste13 travel together
  with Vps10 from the TGN to PVE compartments, and then all three proteins return
  to the Golgi. Retrieval from PVE compartments involves sorting nexins (Bean et al.,
  2016; Ma and Burd, 2020)'
