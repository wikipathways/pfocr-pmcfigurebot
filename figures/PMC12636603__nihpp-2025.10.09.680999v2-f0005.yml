figure_title: A recurrent feedback loop controls courtship song detection and action
  in the auditory system
caption: 'a Overview of the auditory pathway and recurrent feedback circuit. Song
  induced vibrations move the arista to activate Johnston’s organ B neurons, activating
  a sensorimotor loop that provides feedback from song generating networks back to
  the central brain. b Circuit schematics for male (left) and female (right) from
  JO-B to higher order processing centres. Boxes denote cell types, edge thickness
  scales with synaptic weight, and edge colors indicate transmitter identity. Node
  colors mark sex classes: isomorphic (white), sexually dimorphic (gold), sex specific
  (blue). Line widths denote input-normalized connection strengths. c Top 10 output
  partners of vPN1 (top), vpoEN (middle) and vpoIN (bottom) in males and females.
  Bars show the fraction of total synaptic outputs (right) (output-normalized) to
  each identified type across sexes. d Quantification of partner identity for vPN1,
  vpoEN and vpoIN. Top: fraction of inputs from sex-specific/dimorphic neurons in
  the female (left) and male (right). Bottom: fraction of outputs to sex-specific/dimorphic
  neurons in female (left) and male (right). e Connectivity between central brain
  song detection and ventral nerve cord song production circuits. The established
  pulse and sine song network in the wing neuropil is reproduced and connected to
  identified descending neurons and to male specific ascending neurons that project
  back to central brain nodes. Line widths denote input-normalized connection strengths.
  Scale bars as indicated'
article_title: Sexual dimorphism in the complete connectome of the Drosophila male
  central nervous system
