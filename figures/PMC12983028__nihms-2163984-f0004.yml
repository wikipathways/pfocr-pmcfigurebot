figure_title: KLF2 overexpression prevents the acquisition of tissue resident genes
  and provides protection from activation induced dysfunction
caption: (A and B) Pathway analysis (GO Biological terms, DAVID enrichment tool) was
  performed on differentially expressed genes between control- (A) and NKAR-stimulated
  (B) (3 days) mNeonGreen (mNG) and KLF2-transduced (KLF2-mNG). (C) Normalized CPM
  (counts per million) data for specific genes from the comparison in (A) were chosen
  to highlight differential expression of tissue residency genes. (D) NK cells from
  day 4 of NKAR stimulation were cultured with HL-60 leukemia cells expressing NucLight
  Red (NLR) for 48 hours (2:1 effector/target ratio). Cytotoxicity was measured using
  the Incucyte platform. HL-60 viability in experimental wells, normalized to viability
  of HL-60 targets alone, was calculated on the basis of fluorescent cells that were
  not Caspase 3/7+. (E) Control- and NKAR-stimulated mNG and KLF2-mNG NK cells were
  cultured with K562 for 5 hours after which degranulation (CD107a) and cytokine accumulation
  (IFNγ & TNFα) were measured using flow cytometry. (2:1 effector/target ratio.) Parent
  populations are GFP+ NK cells (CD3− CD56+). (F) The viability of stimulated cells
  was measured prior to running the function assay using the Nexcelom Cellaca automated
  cell counter. (G) Transductants were cultured in complete medium supplemented with
  varying concentrations of IL-15 for four days after which they were used in K562
  function assays where degranulation (CD107a) and cytokine accumulation (IFNγ & TNFα)
  were measured using flow cytometry. (2:1 effector/target ratio.) Parent populations
  are GFP+ NK cells (CD3− CD56+). (H) Representative data depict % NK cells expressing
  IFNγ and TNFα. (I and J) Expression of Granzyme B, Perforin, T-bet (I), and CX3CR1(J)
  in mNG and KLF2-mNG NK cells was measured following 4-day culture in varying concentrations
  of IL-15. Data are representative of one (A-D;I-J) or two (E-H) independent experiments
  with n = 3 (A-D;I-J) or n = 6 (E-H) donors per group. Violin plots depict mean,
  upper/lower quartiles, and min/max values. Error bars indicate mean + SD. p values
  were calculated by paired two-way ANOVA (E-J), paired Student’s t test (C), or Area-under
  the curve analyses with Student’s paired t-test (D). *p < 0.05, **p < 0.01, ***p
  < 0.001, ****p < 0.0001; n.s., not significant
article_title: Chronic NK cell activation results in a dysfunctional, tissue resident-like
  state mediated by KLF2 deficiency
