figure_title: MC signatures across disease conditions in NHPs
caption: 'Data was re-analyzed from the lungs of M. mulatta infected with Mtb CDC1551
  (GSE200151). (A) Schematic of the study design across disease conditions (B) UMAP
  embedding of FCER1A+ mast cells, showing the distribution of these cells across
  the different disease conditions (PTB in pink, HC in green, and LTBI in blue). (C)
  Heatmap of Hallmark pathway analysis for differentially expressed genes, highlighting
  the top pathways with the highest FDR values for each condition. (D-G) UCell module
  for pathways: IFNγ signaling (D), TNF-α signaling (E), Oxidative Phosphorylation
  (F), and Th2 signature (G) across disease conditions, shown on UMAP embeddings.
  (H) Violin plots of gene expression for key MC markers (CMA1, TPSG1, LOC699599)
  across disease conditions. (I) Cell counts of different MC subtypes (MCC, MCT, MCTC)
  across disease conditions (PTB, red bars, LTBI, blue bars, and HC green bars). (J)
  UMAP plot of the NHP lung granuloma dataset (GSE200151), showing the distribution
  of cells at 4 weeks (high disease burden) and 10 weeks (low disease burden) in M.
  fasicularis infected with Mtb Erdman. (K) Gene expression violin plots for key MC
  markers (CMA1, TPSG1, LOC699599) from the new dataset across time points. (L) Proportions
  of different MC subtypes (MCC, MCT, MCTC). (M) Violin plots of summed module scores
  for the key pathways (IFNγ signaling, TNF-α signaling, oxidative phosphorylation)
  across disease burdens, showing pathway activity. Statistical significance was assessed
  using Kruskal-Wallis tests with Dunn’s multiple comparison correction (**p < 0.01,
  ***p < 0.001, ****p < 0.0001)'
