figure_title: NOTCH pathway gene and protein expression changes by the treatment with
  PTX alone or combined with SB-T-121606 in sensitive and resistant SKOV-3 CDX models
  in vivo.
caption: NOTCH pathway gene and protein expression changes by the treatment with PTX
  alone or combined with SB-T-121606 in sensitive and resistant SKOV-3 CDX models
  in vivo. Gene expression of NOTCH pathway genes in tumors from (A) SKOV-3/SEN and
  (B) SKOV-3/RES CDX models after treatment with vehicle (CTRL), 10 mg/kg PTX, or
  combination of 9 mg/kg PTX and 1 mg/kg SB-T-121606. Data are shown as fold change
  values (compared to control). (C) NOTCH3 protein expression in SKOV-3/RES CDX tumor
  tissue after treatment with vehicle (CTRL), PTX, or the combination. Protein expression
  data are shown as expression change of normalized protein expression compared to
  the mean of normalized control expression level. *p < 0.05
