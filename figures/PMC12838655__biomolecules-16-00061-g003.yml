caption: This figure illustrates some of the chemical diversity among melanin pigments
  found in fungi, highlighting the specific cellular context of melanin. Fungal melanin
  is produced within melanosomes inside fungal cells, transporting melanin to the
  cell wall and throughout the cytoplasm (Top). While eumelanin is produced by some
  fungi (Figure 2), DHN-melanin (allomelanin) (Bottom Left) [68] is by far the most
  common form of fungal melanin. Pyomelanin, the smallest of the melanin pigments,
  is particularly suited to covering cell surfaces. It undergoes a unique synthesis
  process that begins with tyrosine, as eumelanin does, but instead of following the
  homogentisate (HGA) pathway, it utilizes the precursor benzoquinone acetic acid
  (Bottom Right). Created in BioRender. Hatch, K. (2025) https://BioRender.com/bui29x3
  (accessed on 15 November 2025)
