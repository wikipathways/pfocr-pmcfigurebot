figure_title: CrebA motifs are more abundant in SPCGs than RpGs
caption: '(A) Plot shows the occurrence of CrebA motifs in promoter regions of (left)
  90 SPCGs and (right) 82 RpGs. Genes are ordered by the number of hits and motif
  match scores of CrebA_1 motifs. (B) The majority of secretory pathway component
  genes (SPCGs) contain at least one CrebA motif (85%), compared to only 62% of ribosomal
  protein genes (RpGs). Fisher’s exact test confirms a significant enrichment of CrebA
  motifs in SPCGs (odds ratio = 3.4, p < 0.001). Motif p-value thresholds are CrebA_1:
  p<5.25e-4 CrebA_2: p<3.24e-4. (C) Of the genes that have at least 1 CrebA motif
  hit, a larger fraction of the SPCGs had more than 4 hits as compared to RpGs. (D)
  The IUPAC sequence version of the CrebA motif (from Jackson et al., 2025, CrebA_1)
  shows a peak near at the TSS for SPCGs but not for the RpGs, although on quantification,
  the preference is not significant (KS test p = 0.23). The consensus PWM version
  of CrebA (from JASPAR 2020, CrebA_2) does not show obvious positional preference
  for either group'
