caption: (A) Comparison of the preferentially activated non-hallucinogenic PLC–IP3
  signaling pathway (blue) and the proposed molecular cascade promoting SP-related
  hallucinations via β-arrestin-2 (red). The β-arrestin-2-dependent pathway involves
  the 5-HT-induced atypical activation of the 5-HT2A receptor, leading to the formation
  of a βarr2–Src–Akt signaling complex. The aforementioned complex triggers ERK1/2
  phosphorylation and further gene transcription. (B) Intracellular signaling pathways
  activated by LSD via the 5-HT2A receptor. LSD activates the PLC-IP3 signaling pathway
  with moderate efficacy (grey), leading to MAPK/ERK activation, but preferentially
  engages the PLA2–arachidonic acid (AA) pathway (orange). Activation of the PLA2–AA
  pathway leads to calcium influx and neuronal depolarization through ion channel
  opening. The presence of β-arrestin-2 is required for the hallucinogenic effect.
  Self-compiled in power-point; graphical elements adapted from Servier Medical Art
