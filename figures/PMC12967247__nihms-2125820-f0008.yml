figure_title: Model of the function of TBK1 on autophagy and endo-lysosomal pathways
caption: 'This scheme summarizes the multifaceted roles that TBK1 plays in selective
  autophagy and endo-lysosomal pathways in neurons. TBK1 interacts with its adapter
  proteins in neurons. Through phosphorylation of its targets, including selective
  autophagy cargo receptors and other autophagy factors, TBK1 likely contributes to
  autophagy initiation, cargo recruitment, and autophagosome-lysosome fusion. Importantly,
  we provide evidence that TBK1 may also directly regulate lysosomal activity via
  RAB7A in neurons and possibly even related retromer function via RAB11B (Note: while
  not observed here in neurons, the G217R variant modestly affected IRF3 phosphorylation
  in iPSCs, and TBK1 is well known to regulate the interferon response pathway in
  non-neuronal subtypes)'
article_title: Phospho-proteome profiling in human neurons reveals targets of TBK1
  in ALS/FTD-associated autophagy networks
