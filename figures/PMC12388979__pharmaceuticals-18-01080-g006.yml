figure_title: Proteomics analysis and validation reveal that AKG modulates mTOR and
  p53 signaling pathways.
caption: |-
  Proteomics analysis and validation reveal that AKG modulates mTOR and p53 signaling pathways. (A) Venn diagram showing the overlap of differentially expressed proteins (DEPs) between Ctrl vs. model and AKG vs. model comparisons. (B) Heatmap of DEPs in AKG-treated versus H2O2-induced HT22 cells. (C) Volcano plots showing significantly altered proteins (|log2FC| > 1, * p < 0.05) in Ctrl vs. model and AKG vs. model groups. (D) KEGG pathway enrichment analysis of DEPs in AKG vs. model (left) and the intersecting 238 proteins (right), highlighting pathways including mTOR and p53 signaling. (E,F) Gene set enrichment analysis (GSEA) indicated a negative enrichment of mTOR and p53 signaling pathways following AKG treatment. (G) Representative Western blot images of mTOR signaling-related proteins in HT22 cells. (H–J) Quantitative analysis of p-mTOR/mTOR, p-ULK1/ULK1, and p-4EBP/4EBP levels normalized to Tubulin. All data are expressed as means ± S.D. (n ≥ 3). ##
  p < 0.01 versus the control group; * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001 versus the model group
