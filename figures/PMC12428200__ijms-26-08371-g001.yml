figure_title: Protein folding, trafficking and quality control in the periplasm of
  E.
caption: 'Protein folding, trafficking and quality control in the periplasm of E.
  coli. Most extracytoplasmic proteins (lipoproteins, outer membrane proteins (OMPs),
  soluble periplasmic proteins, and some secreted proteins) are translocated across
  the IM via the SEC pathway. PpiD protein facilitates this process at the periplasmic
  site and probably initiates the folding of some substrates. Lipoprotein sorting
  is mediated by the LolABCDE system, where ATP hydrolysis drives the extraction of
  lipoproteins from the IM by LolCDE, followed by LolA-dependent periplasmic transit
  and insertion into the outer membrane via LolB. The precursors of OMPs transit the
  periplasm in complex with periplasmic chaperones/folding factors, such as SurA,
  Skp, or FkpA, which deliver them to the BAM complex for IM insertion. SurA and FkpA
  act mainly as holdases, but they also exhibit PPIase activity, which may facilitate
  the folding process. DegP plays a dual role: it may act as a holdase, but it mainly
  functions as a protease to degrade irreversibly damaged proteins. Proteases BebA
  and YcaL degrade stalled OMPs in the BAM complex. Skp supports this process by binding
  to stalled OMPs and delivering them to DegP. DegQ degrades damaged proteins, mainly
  at low pH values. Spy acts as a holdase and foldase to stabilize periplasmic proteins
  and facilitate their proper folding'
article_title: 'The Extracytoplasmic Protein Quality Control System in Pathogenic
  Campylobacterota: Its Role in Bacterial Virulence and Maintaining Cellular Envelope
  Proteostasis'
