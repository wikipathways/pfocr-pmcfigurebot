figure_title: 'The SEL1L-HRD1 ERAD pathway: core components, cofactors, structural
  insights, and representative endogenous substrates'
caption: '(a) Schematic representation of the ERAD pathway. Major steps include: (1)
  recognition and recruitment of misfolded proteins to the ERAD machinery; (2) retrotranslocation
  of substrates across the ER membrane; (3) ubiquitination of substrates by the E3
  ligase; (4) extraction of polyubiquitinated substrates by the ATPase VCP/p97/Cdc48;
  and (5) subsequent degradation by the 26S proteasome. (b) Schematic illustration
  of the mammalian SEL1L-HRD1 core complex and associated cofactors including OS9
  and ERLEC1 (substrate adaptors), DERL (retrotranslocation facilitators), HERP1 and
  FAM8A1 (regulatory components), the E2 ubiquitin-conjugating enzyme UBE2J1, and
  AAA+-ATPase valosin-containing protein VCP/p97/Cdc48 complex. (c) Model of the yeast
  Hrd1-Hrd3 complex, which can exist in either monomeric or homo-dimeric configuration.
  (d) Cryo-electron microscope (cryo-EM) structure of the monomeric yeast Hrd1-Hrd3-Der1-Usa1
  complex (PDB ID: 6VJZ). (e) Representative list of mammalian SEL1L-HRD1 ERAD substrates,
  including those linked to genetic mutations (indicated by *). Panels (a-c) created
  in BioRender'
