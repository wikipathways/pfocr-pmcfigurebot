figure_title: The mechanisms of PEDV regulating the apoptosis pathway.
caption: The mechanisms of PEDV regulating the apoptosis pathway. PEDV S1 protein
  activates caspase-8 and caspase-3 to trigger the extrinsic apoptosis. Additionally,
  PEDV S1 triggers the translocation of apoptosis-inducing factor (AIF) from mitochondria
  to the nucleus, leading to caspase-independent apoptosis. PEDV nsp5 disrupts mitochondrial
  membrane potential, resulting in the release of cytochrome c and activation of caspase-9/-3-induced
  apoptosis. PEDV ORF3 inhibits apoptosis through suppressing caspase-3 activation.
  PEDV PLP2 stabilizes MDM2 and promotes p53 degradation, inhibiting the transcription
  of pro-apoptotic BAX/BAK and then suppressing the apoptosis pathway. PEDV infection
  activates p53 by inducing the accumulation of ROS, which upregulates pro-apoptotic
  proteins, PUMA and Bax, and triggers intrinsic apoptosis
