figure_title: Cuproptosis pathway.
caption: 'Cuproptosis pathway. Cu2+ is transported into mitochondria facilitated by
  Cu ionophore (e.g., elesclomol) and then is reduced to Cu+ by FDX1. Subsequently,
  Cu+ binds to the lipoylated TCA proteins, thereby inducing their oligomerization
  and proteotoxic stress. Additionally, Cu+ induces a loss of Fe-S cluster proteins,
  thereby resulting in mitochondrial dysfunction. Finally, the proteotoxic stress
  and mitochondrial dysfunction result in cell death. FDX1: ferredoxin 1; DLAT: dihydrolipoamide
  S-acetyltransferase; LIAS: lipoacylation synthase'
