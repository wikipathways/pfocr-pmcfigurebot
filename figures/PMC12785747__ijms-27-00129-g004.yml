figure_title: Overlapping therapeutic signaling map linking exercise, exercise mimetics
  and the KP in mood disorders.
caption: Overlapping therapeutic signaling map linking exercise, exercise mimetics
  and the KP in mood disorders. The schematic integrates lifestyle and pharmacological
  levers that converge on three central nodes, PPAR–PGC-1α, AMPK–SIRT1, and adiponectin–AdipoR,
  to rebalance kynurenine pathway (KP) flux, increase mitochondrial quality control,
  and dampen neuroinflammation. Exercise (aerobic, HIIT, resistance) and myokines
  (irisin, FGF21, apelin) activate PGC-1α and AMPK/SIRT1, whereas exercise mimetics
  (e.g., fibrates, GW501516, TZDs, metformin, NAD+ precursors, resveratrol, AdipoRon,
  KMO inhibitors, meldonium, trimetazidine) target the same hubs. Downstream, PPAR/PGC-1α
  and AMPK/SIRT1 upregulate KAT in skeletal muscle, promoting the peripheral shunt
  of KYN → KYNA, thereby lowering brain KYN influx. In parallel, KMO inhibition/downshift
  reduces the formation of 3-HK and QA (neurotoxic branch). Adiponectin → AdipoR1/2
  signaling activates AMPK/SIRT1/PGC-1α and suppresses NF-κB–driven cytokines (IL-6,
  TNF-α), which decreases IDO1 activity and preserves Trp for 5-HT synthesis. These
  intersecting routes increase the KYNA/QA ratio, support mitochondrial biogenesis
  and mitophagy (via AMPK-mediated mTORC1 inhibition), increase BDNF (via PGC-1α/FNDC5–irisin),
  and attenuate microglial activation, collectively reducing NMDA-mediated excitotoxicity,
  improving redox resilience, and yielding antidepressant and cognitive-protective
  effects. (Down arrow ↓ indicate decrease, up arrow ↑ indicate increase)
article_title: Kynurenine Pathway Metabolites as Mediators of Exercise-Induced Mood
  Enhancement, Fatigue Resistance, and Neuroprotection
