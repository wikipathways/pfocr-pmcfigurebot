caption: This schematic illustrates the key challenges and future directions in BTLA-targeted
  immunotherapy. On the left, major current limitations are depicted, including heterogeneous
  BTLA expression across tumors, dual functional roles of the BTLA–HVEM pathway, limited
  clinical efficacy in certain cancer types, and safety concerns related to immune
  overactivation. A critical unmet need is the identification of reliable predictive
  biomarkers—such as BTLA/HVEM expression profiles, immune gene signatures, and functional
  immune assays—to guide patient selection. On the right, innovation opportunities
  and personalized medicine strategies are presented. These include the development
  of next-generation BTLA modulators such as bispecific antibodies, Fc-engineered
  molecules, small-molecule inhibitors, and agonists for specific immune contexts.
  The integration of multi-omics data, AI-driven predictive modeling, and adaptive
  clinical trial designs offers a path toward tailoring BTLA-targeted therapies to
  individual tumor immune landscapes, aiming to maximize efficacy while minimizing
  adverse effects
