figure_title: The effect of three key factors on model performance when predicting
  activation of HDP (green-left) and CSBT (blue-right) pathways.
caption: 'The effect of three key factors on model performance when predicting activation
  of HDP (green-left) and CSBT (blue-right) pathways. Nonsignificant differences are
  shown by n.s. Top: Two model types – DF-Pathway and VTA-Structure were generated
  in native and normative space and in all cases the native model outperformed its
  normative counterpart. Middle: DF and VTA modeling methods were directly compared
  in both spaces. DF outperformed VTA in predicting CSBT activation. Bottom: Pathway
  and Structure anatomical representation were compared in VTA models with no significant
  differences'
