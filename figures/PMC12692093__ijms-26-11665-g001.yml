figure_title: Mechanism of Action of PARP Inhibitors.
caption: Mechanism of Action of PARP Inhibitors. DNA damage and PARPs. The most frequent
  form of DNA damage is the single-strand break (SSB) (1), which is primarily repaired
  through the PARP-dependent base excision repair (BER) pathway (2). Members of the
  PARP (Poly ADP-Ribose Polymerase) enzyme family catalyze the transfer of ADP-ribose
  units to target proteins. Some PARP isoforms act as sensors that detect SSBs and
  initiate an immediate repair response. Upon recognizing a SSB, a PARP enzyme binds
  to the damaged DNA site (3) and undergoes a conformational shift that enables β-NAD⁺,
  its required cofactor, to access the active site (4). PARP then cleaves β-NAD⁺ and
  transfers ADP-ribose units to target proteins, generating a poly(ADP-ribose) (PAR)
  chain (5). This modification promotes the recruitment of DNA repair factors via
  their PAR-binding domains (6), allowing the repair machinery to efficiently resolve
  the lesion (7). The repair process concludes with PAR degradation by Poly(ADP-ribose)
  Glycohydrolase (PARG) and release of PARP and associated enzymes. PARP inhibitors.
  PARP inhibitors (PARPi) (8) block PARP catalytic activity, preventing PARylation,
  and trap PARP molecules on damaged DNA (9). When SSBs cannot be repaired, they are
  converted into double-strand breaks (DSBs) during DNA replication, leading to additional
  DNA damage under PARP inhibition (10). DSBs can be repaired through homologous recombination
  (HR), so HR-proficient cells are able to survive by correcting these lesions (11).
  In contrast, HR-deficient cells—such as those harboring BRCA1 or BRCA2 mutations—cannot
  repair DSBs and undergo cell death (12). Because many tumors carry defects in DNA
  repair pathways, PARP inhibitors exploit the principle of synthetic lethality, where
  two individually non-lethal defects become lethal when combined
