figure_title: IGFBP6 inhibits STAT1 pathway via PHB2 interaction
caption: '(A) Representative confocal images of colocalization of IGFBP6 (FITC) and
  PHB2 (rhodamine phalloidin) in lung and intestinal tissues of septic mice. Nuclei
  counterstained with DAPI. Scale bar: 100 μm. (B) Representative confocal images
  of colocalization of IGFBP6 (FITC) and PHB2 (rhodamine phalloidin) in MLE-12 and
  MODE-K cells (nuclei, DAPI). Scale bar: 40 μm. (C and D) Co-IP of IGFBP6-PHB2 interaction
  in MLE-12 (C) and MODE-K (D). (E) Phosphotyrosine-specific binding assay: cell lysates
  from MLE-12 and MODE-K incubated with rIGFBP6 (200 ng/mL) were incubated with phosphotyrosine
  (pTyr Ab) or IgG control; PHB2 detected by Western blot. (F) CCL2 secretion in PHB2-silenced
  (siPHB2, 48 h) versus control (siNC) epithelial cells (MLE-12 and MODE-K) after
  P. aeruginosa stimulation (12 h, MOI 100; n = 6/group). (H and I) Phosphorylation
  of STAT1 in siPHB2/siNC-treated MLE-12 (G) and MODE-K (H) after P. aeruginosa challenge
  (30 min, MOI 100) (n = 3/group). (J and K) Co-IP of STAT1 with PHB2 in rIGFBP6-treated
  MLE-12 (J) and MODE-K (K). (L and M) Representative confocal images of the colocalization
  of STAT1 (FITC) and PHB2 (rhodamine phalloidin) in rIGFBP6- or PBS-treated MLE-12
  (L) and MODE-K (M) (nuclei, DAPI). Scale bar: 50 μm. (N and O) After 24 hours of
  siNC or siPHB2 (33 μg/mouse) in vivo transfection, PHB2 level and phosphorylation
  of STAT1 in lung (N) and intestinal (O) tissues of PBS- and rIGFBP6-treated septic
  mice measured by Western blot. (P) Mouse PHB2 gene KD by in vivo siPHB2 transfection.
  Bacterial loads in peritoneal lavage fluid, blood, lung, and spleen from PBS- or
  rIGFBP6-treated mice assayed at 24 hours after cecal ligation and puncture (n =
  5/group). (Q) After PHB2 gene KD by in vivo siPHB2 transfection, survival rates
  of PBS- or rIGFBP6-treated septic mice were observed for up to 2 weeks (n = 19–20/group).
  Data in F and P represent 3 independent experiments. Each dot in graphs represents
  data from an individual biological/technical replicate; 1-way ANOVA in F, I, and
  P; log-rank test in Q; NS, not significant'
article_title: IGFBP6 orchestrates antiinfective immune collapse in murine sepsis
  via prohibitin-2–mediated immunosuppression
