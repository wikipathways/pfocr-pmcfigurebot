figure_title: PTPN18 can regulate the expression levels of CDKN1A and CDKN1B proteins
  through the PI3K/AKT signaling pathway leading to cell cycle arrest.
caption: PTPN18 can regulate the expression levels of CDKN1A and CDKN1B proteins through
  the PI3K/AKT signaling pathway leading to cell cycle arrest. (A and B) STRING database
  analysis showed proteins that interact with (A) cyclin E1 (CCNE1) and (B) E2 (CCNE2).
  (C) GEPIA database analysis of the CDKN1A and CDKN1B association with cyclin E1.
  (D) Correlation analysis between CDKN1A and cyclin E2 using the GEPIA database.
  (E) Western blot analysis of the PI3K/AKT signaling pathway protein expression levels
  in MCF-7 cells. Levels of P-PI3K p85, P-AKT and P-GSK3 were monitored after a 30-min
  stimulation with EGF (100 ng/ml). (F) Relative quantitative analysis of the PI3K/AKT
  signaling pathway protein expression levels. (G) Western blotting demonstrated the
  expression levels of FOXO1, PI3K p110β, CDKN1A and CDKN1B. (H) The bar graph was
  obtained by normalizing the levels to β-actin. Data are shown as the mean ± SD from
  three technical replicates following 48 h of overexpression or 72 h of knockdown.
  **P<0.01 and ***P<0.001. PTPN18, protein tyrosine phosphatase non-receptor 18; GEPIA,
  Gene Expression Profiling Interactive Analysis; PI3K, phosphatidylinositol 3-kinase;
  AKT, protein kinase B; CDKN1A (p21Cip1), cyclin-dependent kinase inhibitor 1A; CDKN1B
  (p27Kip1), cyclin-dependent kinase inhibitor 1B; P-, phosphorylation; FOXO1, forkhead
  box O1; ns, not significant; P-, phosphorylated; siRNA, small interfering RNA
