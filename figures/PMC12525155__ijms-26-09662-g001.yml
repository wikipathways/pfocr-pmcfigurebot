figure_title: Volcano plots depicting differential gene expressions, and the heatmap
  exhibiting pathway dysfunction across AA subtypes and scalp regions.
caption: Volcano plots depicting differential gene expressions, and the heatmap exhibiting
  pathway dysfunction across AA subtypes and scalp regions. (a–e) Genes meeting FDR
  < 0.05 and |fold change| > 1.5 are shown for each comparison. Hair follicle genes
  (green), Type 1 (blue), and Type 2 (red) immunity genes are labeled. (a) Non-lesional
  scalp vs. normal shows early immune activation. (b) AAP lesions vs. normal reveals
  strong immune upregulation and keratin suppression. (c) AAP lesions vs. non-lesional
  highlight localized cytotoxicity and follicular loss. (d) AT/AU lesions vs. non-lesions
  shows widespread keratin repression with immune activation. (e) AT/AU lesions vs.
  AAP lesions exhibit greater hair shaft suppression with persistent immune signals.
  AAP = patchy-type AA; AT = alopecia totalis; AU = alopecia universalis; NL = non-lesional;
  NC = normal control; LS = lesional. The horizontal dotted line represents FDR =
  0.05, and the vertical dotted lines represent an absolute fold change of 1.5
