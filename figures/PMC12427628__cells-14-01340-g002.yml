figure_title: PLEKHM1 overexpression exacerbates the αSyn-induced degeneration of
  the nigrostriatal pathway.
caption: 'PLEKHM1 overexpression exacerbates the αSyn-induced degeneration of the
  nigrostriatal pathway. (A) Representative images of the SN from the treated hemisphere.
  Dopaminergic neurons in the midbrain were visualized using immunofluorescence staining
  for tyrosine hydroxylase. Cohorts are indicated above each image. The SNc is highlighted
  in pink and the SNr is outlined in orange. Scale bar: 300 μm. (B) Count of TH-positive
  neurons in the SNc. Each animal’s count of TH-positive neurons in the transduced
  hemisphere is shown as a ratio to the contralateral hemisphere. Dots represent individual
  animals (n = 5 in all cohorts, except n = 6 in mice transduced with rAAV-αSyn +
  rAAV-PLEKHM1). Comparison by a two-way ANOVA. Independent variable 1: rAAV-EGFP
  or rAAV-αSyn. Independent variable 2: rAAV-EGFP or rAAV-PLEKHM1. Variable 2 explains
  the significant variation (F-Value = 7.572, p-value = 0.0136). The interaction between
  these variables was not significant. Tukey’s HSD post hoc analysis revealed significant
  pairwise differences between rAAV-αSyn + rAAV-EGFP and rAAV-αSyn + rAAV-PLEKHM1
  (p-value = 0.045), as well as rAAV-EGFP and rAAV-αSyn + rAAV-PLEKHM1 (p-value =
  0.049). Asterisks indicate significance levels (* p < 0.05). (C) Density of TH-positive
  area in the SNr normalized to the contralateral hemisphere. Dendrites of dopaminergic
  neurons are located in the SNr. Dots represent individual animals (n = 5 in all
  cohorts, except n = 6 in mice transduced with rAAV-αSyn + rAAV-PLEKHM1). Comparison
  by a two-way ANOVA. Independent variable 1: rAAV-EGFP or rAAV-αSyn. Independent
  variable 2: rAAV-EGFP or rAAV-PLEKHM1. Variable 1 explains the significant variation
  (F-value = 10.363, p-value = 0.005). The interaction between these variables was
  not significant. Tukey’s HSD post-hoc analysis revealed significant pairwise differences
  between rAAV-EGFP and rAAV-αSyn + rAAV-EGFP (p-value = 0.021) as well as rAAV-EGFP
  and rAAV-αSyn + rAAV-PLEKHM1 (p-value = 0.009). Asterisks indicate significance
  levels (* p < 0.05, ** p < 0.01). (D) Representative images of dopaminergic axons
  and axon terminals in the striatum labeled by TH. Cohorts as indicated above each
  image. Scale bar: 30 μm. (E) Density of TH-positive area in the striatum, normalized
  to the contralateral hemisphere. Comparison by a two-way ANOVA. Independent variable
  1: rAAV-EGFP or rAAV-αSyn. Independent variable 2: rAAV-EGFP or rAAV-PLEKHM1. Variable
  2 explains the significant variation (F-value = 5.394, p-value = 0.0329). The interaction
  between these variables was significant (F-value = 4.511, p-value = 0.0487). Tukey’s
  HSD post hoc analysis revealed significant pairwise differences between rAAV-αSyn
  + rAAV-EGFP and rAAV-αSyn + rAAV-PLEKHM1 (p-value = 0.0273). Dots represent individual
  animals. Asterisks indicate significance levels (* p < 0.05). (F) Correlation between
  the count of dopaminergic neurons and the density of dopaminergic dendrites. Each
  dot represents an individual animal. Pearson’s product–moment correlation with R
  = 0.67 (p-value = 0.0013). Dotted line represents the corresponding generalized
  linear mixed model. (G) Correlation of the count of dopaminergic neurons and dopaminergic
  axon terminal density. Each dot represents an individual animal. Pearson’s product–moment
  correlation with R = 0.7 (p-value = 0.00041). Dotted line represents the corresponding
  generalized linear mixed model'
