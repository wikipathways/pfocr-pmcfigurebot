figure_title: UTX controls chromatin accessibility at progenitor and effector gene
  loci in antigen-specific pLN Tprog cells
caption: (A) PCA analysis of ATAC-seq (top) and RNA-seq (bottom) profiles of sorted
  Tprog (CD8+ Ly108+ CD39–) cells from pLNs of NOD-TCR 8.3 WT and NOD-TCR 8.3 UTXTCD
  mice (n = 3/group). (B) Heatmaps of the expression (left, RNA-seq) and chromatin
  accessibility (right, ATAC-seq) of selected differentially expressed and accessible
  genes involved in immune function. The color scale indicates the relative expression
  or accessibility, with red representing higher values and blue representing lower
  values. (C and D) Gene set enrichment analysis (GSEA) for progenitor signature (Supplemental
  Data File 4) (C) and effector signature (D) genes in the RNA-seq dataset of Tprog
  cells from NOD-TCR 8.3 WT and NOD-TCR 8.3 UTXTCD mice. (E) Pathway analysis of differentially
  accessible genes by ATAC-seq using Enrichr (P value by Fisher’s exact test)
