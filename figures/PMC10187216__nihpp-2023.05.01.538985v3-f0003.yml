figure_title: Analysis of AHR target genes
caption: (A) Upregulated AHR target genes (fold change TCDD vs vehicle, 2-hour exposure,
  mouse liver) containing AHR ChIP peaks with 5 or more NC-XRE motifs separated by
  50 base pairs or less. AHR target genes are defined as differentially expressed
  genes (RNA-seq, fold difference in TCDD vs vehicle > 1.5x, FDR < 5%) containing
  AHR ChIP peaks within 10 kb of a gene body. (B) Over-Representation Analysis (ORA)
  of Gene Ontology Biological Processes (GOBP) using the AHR target genes from panel
  A. Enriched pathways were ranked by their statistical significance (P-value) along
  with the number of hit genes and their names. For example, the embryo development
  GOBP pathway contains 8 upregulated genes (Atoh8, Notch1, Mafb, Lrp4, Maff, Hes1,
  Tsgz1, Sebox) that have 5 repeats of NC-XRE motifs with a maximum of 50 bp spacers
  between them. (C) Gene Set Enrichment Analysis (GSEA) displaying normalized enrichment
  scores (NES) for mouse liver global RNA-seq (TCDD vs vehicle) ranked genes. Only
  the pathways identified in the ORA (panel B) are shown here. All except the ‘response
  to oxygen-containing compound’ pathway are enriched in the TCDD-exposed mouse liver
