figure_title: Immune antitumor effects following oncolytic herpes simplex virus (oHSV)
  infection.
caption: 'Immune antitumor effects following oncolytic herpes simplex virus (oHSV)
  infection. After oHSV infection, cyclic GMP-AMP synthase (cGAS) recognizes viral
  dsDNA, activates STING signaling, recruits TBK1, and promotes the phosphorylation
  of IRF3. These receptors trigger downstream signaling cascades that lead to NF-κB
  expression and the release of proinflammatory cytokines. In the cytoplasm, viral
  proteins ICP47 and ICP34.5 are deleted, which processes MHC-I antigenic peptide
  presentation and the EIF2S1-ATF4 pathway-associated autolysosome. The ICP6 protein
  can interact with receptor-interacting kinase-3 (RIPK3) directly. The Rhim domains
  are necessary for the formation of the ICP6-RIPK3 complex, and they activate RIPK3/mixed
  lineage kinase domain-like protein (MLKL)-dependent programmed cell necrosis. MLKL-mediated
  necroptosis will induce cell membrane rupture and release damage-associated molecular
  patterns (DAMPs) in the TME. Phosphor-MLKL can also translocate to mitochondria,
  lead to the microtubule-dependent release of mitochondrial DNA (mtDNA), and activate
  the cGAS-STING signaling pathway. Abbreviations: STING, stimulator of interferon
  gene; IRF3, interferon regulatory factor 3; TBK1, TANK-binding kinase 1; EIF2S1,
  eukaryotic translation initiation factor 2 subunit alpha; ATF4, activating transcription
  factor 4'
