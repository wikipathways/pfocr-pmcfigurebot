figure_title: Ivy GAP anatomy shows MS4A6A enrichment in vascular niches of GBM and
  nominates pathway-targeted vulnerabilities.
caption: 'Ivy GAP anatomy shows MS4A6A enrichment in vascular niches of GBM and nominates
  pathway-targeted vulnerabilities. (A) Principal Component Analysis (PCA) of Ivy
  GAP micro-dissected GBM regions (PC1 = 27.2%, PC2 = 17.3%). Samples are annotated
  by anatomic compartment: CT (Cellular Tumor), CT.hbv (CT—Hyperplastic Blood Vessels),
  CT.mvp (CT—Microvascular Proliferation), CT.pan (CT—Pseudopalisading cells around
  Necrosis), CT.pnz (CT—Peri-necrotic Zone), IT (Infiltrating Tumor), and LE (Leading
  Edge). Reproduced from ref. [16], Cancers 2025, 17(19), 3271; https://doi.org/10.3390/cancers17193271
  (Figure 5F). (B) MS4A6A is highly expressed in CT.mvp and CT.hbv, which indicates
  that MS4A6A preferentially marks angiogenic/perivascular microenvironments in GBM.
  (C) Predicted drug sensitivity profiles (OncoPredict) for patients stratified by
  the MS4A6A-based risk group (HighRisk = MS4A6A-high; LowRisk = MS4A6A-low). The
  y-axis represents the predicted IC50, with lower values indicating greater sensitivity.
  The HighRisk group shows significantly lower predicted IC50 for AZD8055 (mTORC1/2
  inhibitor), SCH772984 (ERK1/2 inhibitor), and Ribociclib (CDK4/6 inhibitor), highlighted
  with boxed annotations'
