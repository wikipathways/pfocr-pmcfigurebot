figure_title: FA limits labile iron (Fe2+) pool in HSCs independently of NRF2.
caption: FA limits labile iron (Fe2+) pool in HSCs independently of NRF2. (A) Analysis
  of LIP size by FerroOrange staining in BM HSCs of Ctrl and l-FA-treated mice. Scale
  bar, 10 μm. (B) Flow cytometric quantification of LIP size in BM HSCs of Ctrl and
  l-FA-treated mice (n = 6). (C) Flow cytometric quantification of ferritin expression
  in BM HSCs of Ctrl and l-FA-treated mice (n = 6). (D) LIP size in HSCs cultured
  with FA and/or erastin (n = 6). (E,F) Ferroptosis analysis of HSCs cultured with
  different concentrations of FeSO4 (n = 4). (G,H) Ferroptosis analysis of HSCs cultured
  with FA and/or FeSO4 (n = 4). (I) Flow cytometric quantification of NRF2 expression
  in BM HSCs of Ctrl and l-FA-treated mice (n = 6). (J) GSEA of NRF2 pathway in BM
  HSCs of l-FA-treated versus Ctrl mice. Data represent mean ± SD. * p < 0.05, **
  p < 0.01, ns, no significance. Two-tailed unpaired Student’s t-test unless stated
  otherwise. One-way ANOVA (D–F). NES, normalized enrichment score; FDR, false discovery
  rate
