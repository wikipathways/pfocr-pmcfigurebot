figure_title: In vitro and in vivo studies on tissue factor pathway inhibitor (TFPI)
  inhibition by factor VII-activating protease (FSAP).
caption: In vitro and in vivo studies on tissue factor pathway inhibitor (TFPI) inhibition
  by factor VII-activating protease (FSAP). The schematic summarizes experimental
  evidence on the interaction between FSAP and TFPI. In vitro studies (marked in green)
  include purified systems, HUVEC cultures, plasma assays, and experiments using FSAP-treated
  TFPI in TFPI-depleted plasma. In vivo studies in mice (marked in blue) involve comparisons
  between wild-type (WT) and FSAP-deficient animals in pulmonary embolism and carotid
  artery thrombosis models. In vivo clinical studies in patients with restenosis (marked
  in violet) demonstrate correlations between FSAP and TFPI levels
