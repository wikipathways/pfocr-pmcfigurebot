figure_title: Lum stem-like cell is the dominant epithelial subgroup in HRLPC after
  hormonal therapy.
caption: Lum stem-like cell is the dominant epithelial subgroup in HRLPC after hormonal
  therapy. (A) UMAP plot showing the subtypes of epithelial cells from 9 HRLPC patients,
  including basal cells, Lum DPP4+, Lum stem-like, Lum Vim+ and Lum NE+. (B) UMAP
  plot of single-cell transcriptomic profiles colored by AR, luminal, stem-like, NE-like,
  basal and EMT gene signature score (z score) for each cell (dot). (C) Heat map representing
  the lineage scores of lineage marker gene signatures in cell subtypes. (D) Proportions
  of each epithelial cell subtypes before and after hormonal therapy and the composition
  of epithelial cell subtypes for each patient. (E) Subpopulation-specific regulons
  of each epithelial cell subpopulation revealed by SCENIC analysis. (F) The regulon
  specificity score (RSS) ranking plot for Lum stem-like cell subtype. (G) The transcriptional
  activity levels of SOX9 in epithelial cells, cells with the highest transcription
  level are colored blue. (H) The expression level of SOX9 in epithelial cells. Cells
  with the highest expression level are colored red. (I) H&E and mIHC staining showing
  TROP2+ (red) SOX9+ (green) and DAPI (blue) in Lum stem-like cells in patient 08.
  (J) Pseudotime trajectory of epithelial cell subtypes by Monocle2. Trajectory is
  colored by pseudotime (left), cell subtypes (middle), treatment groups (right).
  (K-L) Pseudotime trajectory and boxplot showing the latent time of epithelial cell
  subtypes by pseudotime. Trajectory is colored by cell subtypes for patient 01, 08
  and 03. (M) Two-dimensional plots showing the dynamic expression of CHGA along the
  pseudo-time, colored by epithelial cell subclusters. (N) Bar plot for Hallmark pathway
  enrichment of upregulated genes for Lum NE1 and Lum NE2. (O) Heatmap showing the
  differentially expressed genes across two pseudotime trajectories. (P-Q) KM analysis
  showing the disease-free survival rate of TCGA-PRAD patients with high levels of
  the two trajectory varied genes using the two-sided log-rank test
