figure_title: 'Whole-cell mechanosensing as a key phenomenon in mechanotransduction:
  cellular and extracellular components.'
caption: 'Whole-cell mechanosensing as a key phenomenon in mechanotransduction: cellular
  and extracellular components. Mechanosensing of stimuli related to blood flow, such
  as shear stress, occurs through mechanoreceptors in the form of mechanosensitive
  ion channels (MSICs) and G protein-coupled receptor (GPCRs). The conversion of mechanical
  stimuli into electrochemical or biochemical signals occurs in the transduction process
  involving the entire cell, including structures linked to the cell membrane, cytoskeletal
  elements, glycocalyx (GLX), junctional and other proteins. Focal adhesions (FA),
  formed by dynamic protein structures containing integrins, establish connections
  between the intracellular cytoskeleton (CSK) and the extracellular matrix (ECM),
  which favors the propagation of deformation as a result of mechanical force. Mechanotransduction
  also influences cell behavior and function by changing the level of protein synthesis
  in the cell nucleus. For example, upregulation of endothelial nitric oxide synthase
  (eNOS) increases the production of nitric oxide (NO), which diffuses through the
  cell membrane, and especially through myoendothelial gap junctions (GJ), leading
  to endothelium-dependent relaxation of vascular smooth muscle cells (VSMC). Cav—caveola,
  EC—endothelial cell, ECCJ—endothelial cell–cell junctions, ENaC/DEG—epithelial sodium
  channel/degenerin family of mechanosensory channels, IEL—internal elastic lamina,
  K2P—two-pore domain potassium channels; PIEZO—PIEZO channel, RTK—receptor tyrosine
  kinase, TRP—transient receptor potential channel. Considering the response to vascular
  shear stress as a phenomenon encompassing the entire cell and the multidirectional
  nature of mechanotransduction, it is not surprising that a complex network of cell
  signaling pathways is activated. Conformational changes in proteins within FAs,
  the mitogen-activated protein kinase (MAPK) pathway, the phosphorylation of extracellular
  signal-regulated kinases (ERKs), and the GPCR-related mechanosensing Gq/11/PLC calcium
  signaling pathway are involved [33,256,313]. Moreover, rapid tyrosine phosphorylation
  of platelet endothelial adhesion molecule-1 (PECAM-1) triggers a pathway associated
  with angiogenesis and maintaining the homogeneity of ECs, in which VEGFR2/VEGFR3,
  vascular endothelial cadherin (VE-cadherin, also known as CDH5), phosphatidylinositol
  3-kinase (PI3K), and protein kinase B (PKB, also known as Akt) participate [33,314,315,316,317,318]'
