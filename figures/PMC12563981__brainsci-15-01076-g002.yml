figure_title: The role of pulmonary diseases in AD.
caption: The role of pulmonary diseases in AD. The diagram illustrates the proposed
  pathway through which pulmonary diseases contribute to the development of AD. In
  patients with pulmonary conditions such as COPD and OSA, levels of oxidative stress
  markers (e.g., hydroxyl radical (OH·), singlet oxygen (1O2), and superoxide anion
  (O2·−)) increase in the bloodstream. Concurrently, levels of pro-inflammatory cytokines,
  including interleukin-6 (IL-6), tumor necrosis factor-alpha (TNF-α), and interleukin-8
  (IL-8), are elevated. These factors can trigger several pathological mechanisms,
  including immune dysregulation, disruption of the blood–brain barrier, and exacerbated
  oxidative stress, which ultimately lead to neuronal apoptosis, increased amyloid-beta
  (Aβ) deposition, and protein misfolding, thereby contributing to the onset or progression
  of AD
