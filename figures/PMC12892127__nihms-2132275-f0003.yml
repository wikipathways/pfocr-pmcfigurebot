figure_title: Age-related gene comparison analysis of AD pathway genes in WT mice
  at 6 and 9 months of age.
caption: Age-related gene comparison analysis of AD pathway genes in WT mice at 6
  and 9 months of age. (A) Heat map of all 84 AD pathway genes (plotted as log2FC).
  (B) Amyloid-β Pathway genes. (C) Cell Signaling molecules. (D) Lipid and lipoprotein
  metabolism genes. (E) Mitochondrial-related genes. All data is normalized to the
  6-month WT group. Data represented WT control and WT UCMS mice at 6 and 9 months
  of age. Blue dots = male data; white dots = female data. *p ≤ 0.05, **p ≤ 0.01,
  ***p ≤ 0.001, ****p ≤ 0.0001; mean ± SEM. n = 6–9/group. Data were compared using
  Two-way ANOVA, with the main effect of stress and time (and their interaction) with
  a Tukey post-hoc test. Acetylcholinesterase (Ache), amyloid beta precursor protein
  binding family A member 1 (Apba1), amyloid beta A4 precursor protein-binding family
  B member 1 (Apbb1) and 2 (Apbb2), aph-1 homolog A gamma-secretase subunit (Aph1a),
  amyloid precursor like protein 1 (Aplp1) and 2 (Aplp2), apolipoprotein E (Apoe),
  beta-secretase 1 (Bace1), cathepsin B (Ctsb), nicastrin (Nctsn) presenilin-1 (Psen1),
  G protein subunit alpha (Gnaz) and gamma 4 (Gng4), glycogen synthase kinase 3 alp
  (Gsk3a), insulin receptor (Insr), protein kinase C epsilon (Prcke), protein kinase
  C Iota (Prkci) and theta (Prkcq), alpha (Snca) and beta (Sncb) synuclein, low density
  lipoprotein receptor-related protein 1 (Lrp1), 6, (Lrp6), and 8 (Lrp8), ubiquilin
  1 (Ubqln1), ubiquinol-cytochrome C reductase core protein 1 (Uqcrc1) and 2 (Uqcrc2)
