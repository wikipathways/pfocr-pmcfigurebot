figure_title: Targeting IRF3/7 and DNA and RNA sensors to increase the transfection
  efficiency in host cells.
caption: 'Targeting IRF3/7 and DNA and RNA sensors to increase the transfection efficiency
  in host cells. (A) Dot plots showing the differential expression levels of the OAS1,
  OAS2, OAS3, and OASL genes in HCT116, HeLa, L02, and NCM460 cells following transfection
  with the pcDNA3.1-neo plasmid. n=3 independent replicates. (B) qPCR results at 24
  h revealing the relative OAS1, OAS2, OAS3, and OASL expression levels compared with
  those of the GAPDH gene after the knockdown of cGAS, STING, MDA5, RIGI, IRF3, and
  IRF7, as well as the double knockdown of factors in the DNA- and RNA-sensing pathways
  in NCM460 cells transfected with pcDNA3.1-GFP plasmids. Statistical P values were
  calculated using Dunnett''s test after ANOVA, with siNC cells transfected with pcDNA3.1-GFP
  used as the control group. siNC: negative control siRNA. *P < 0.05, **P < 0.01,
  ***P < 0.001 and ****P < 0.0001. ns, not statistically significant. n=3 independent
  replicates. (C) Flow cytometry results of NCM460 cells transfected with pcDNA3.1-GFP
  plasmids following the knockdown of cGAS, STING, MDA5, RIGI, IRF3, and IRF7, as
  well as the double knockdown of factors in the DNA- and RNA-sensing pathways. NC:
  negative control. FSC: forward scatter. n=3 independent replicates. (D) GFP+ cell
  ratio determined by flow cytometry, as shown in Figure 4C. Statistical P values
  were calculated using Dunnett''s test after ANOVA, with siNC cells transfected with
  pcDNA3.1-GFP used as the control group. siNC: negative control siRNA. *P < 0.05,
  **P < 0.01, ***P < 0.001 and ****P < 0.0001. ns, not statistically significant.
  n=3 independent replicates. (E) qPCR results at 24 h revealed the relative GFP expression
  levels compared with those of the GAPDH gene after the knockdown of cGAS, STING,
  MDA5, RIGI, IRF3, and IRF7, as well as the double knockdown of factors in the DNA-
  and RNA-sensing pathways in NCM460 cells transfected with pcDNA3.1-GFP plasmids.
  Statistical P values were calculated using Dunnett''s test after ANOVA, with siNC
  cells transfected with pcDNA3.1-GFP used as the control group. siNC: negative control
  siRNA. *P < 0.05, **P < 0.01, ***P < 0.001 and ****P < 0.0001. n=3 independent replicates.
  (F) Schematic diagram illustrating the p-IRF3/IRF7-dependent positive feedback loop
  downstream of the cGAS-STING pathway activates the RNA-sensing pathway, resulting
  in increased expression of OAS and IFIT family genes, followed by RNA degradation
  and translation inhibition'
