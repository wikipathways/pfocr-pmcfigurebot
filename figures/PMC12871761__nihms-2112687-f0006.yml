figure_title: 3-oxo-LCA inhibits tumor progression in HCT116-xenograft NSG mice
caption: '(A) A scheme of 3-oxo-LCA (20 mg/kg BW p.o.) or vehicle (corn oil) were
  administrated in HCT116-xenograft NSG mice for 4 weeks before tissue harvest and
  tumor measurement.(B) Total Bile Acid levels measured in both 3-oxo-LCA and vehicle-treated
  HCT116-xenograft mice.(C-G) Representative live image of tumors (C), tumor weight
  (D), tumor growth curve (E), and final tumor volume (F), and tumor distribution
  (G) in HCT116-xenograft mice in the above treatment groups.(H) Representative images
  of H&E staining of tumors in HCT116-xenograft mice in the above treatment groups.
  Scale bar, 100μm.(I-L) Relative expression of FXR target genes (FGF19, ASBT, OSTα,
  SHP) (I), Apoptosis signaling pathway (CASP3, CASP7, BCL2, BAK1, BAX, CASP8, CASP9)
  (L) in the tumors of HCT116-xenograft mice under above treatment groups, measured
  by RT-qPCR.(M) Representative images of immunostaining for proliferation marker
  KI67 (green) in HCT116-xenograft mice in the above treatment groups, along with
  the corresponding quantification of each staining. Scale bar, 100μm(N-O) Representative
  images of TUNEL assay stained apoptotic cell death (N) and immunostaining of Apoptotic
  protein Cleaved Casp3 (O) in the tumor of HCT116-xenograft mice, along with the
  corresponding quantification of each staining. Scale bar, 100μm.Experiments were
  independently replicated twice, and representative data are shown as the mean ±
  SEM. For two group comparison, Student’s unpaired t-test were applied. For more
  than two group comparison, the one-way ANOVA test was followed by multiple comparisons.
  *p<0.05; **p<0.01; ***p<0.005; ns: not significant'
