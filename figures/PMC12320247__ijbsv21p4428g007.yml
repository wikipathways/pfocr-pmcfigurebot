figure_title: FGF19 impairs chondrogenic differentiation through the Wnt/β-catenin
  signalling pathway.
caption: FGF19 impairs chondrogenic differentiation through the Wnt/β-catenin signalling
  pathway. a. Representative western blots showing that LiCl inhibited the changes
  in the levels of Wnt antagonists (SFRP1, DKK2 and WIF1) and reversed the decrease
  in the level of β-catenin. b. Quantitative analysis of the changes in the levels
  of SFRP1, WIF1, DKK2 and β-catenin shown in (a). c. Representative immunofluorescence
  images showing the increase in β-catenin in BMSCs after pretreatment with 20 mM
  LiCl in the presence of FGF19 and KLB. Cytoskeleton (F-actin), green; β-catenin,
  red; Nucleus (DAPI), blue. d. Quantification of the linear fluorescence intensity
  of β-catenin in the BMSCs shown in (c). e. Alcian blue staining revealed that LiCl
  restored the loss of proteoglycan production in BMSCs induced by FGF19 in the presence
  of KLB. f. Representative western blots showing that FGF19 induced changes in the
  protein levels of COL II and SOX9 in chondrogenic BMSCs in the presence or absence
  of LiCl. g. Quantification analysis to confirm the protein changes in (f). h. Protein‒protein
  interaction network showing that FGF19 mediate chondrogenic differentiation by regulating
  β-catenin signalling. The data in b, d and g are presented as the means ± SD. The
  significance analysis in b and g was based on two-tailed Student's t tests. All
  the results in a, c, e and f were obtained from three independent experiments (n
  = 3)
