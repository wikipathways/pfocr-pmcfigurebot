figure_title: Transcriptomics and Ingenuity Pathway Analysis - Synaptoneurosomes.
caption: Transcriptomics and Ingenuity Pathway Analysis - Synaptoneurosomes. (A) Dendrogram
  and heat map of hierarchical clustering of differentially expressed RNAs indicate
  that the experimental groups are different. Note that adjacent to the dendrogram,
  miR-17-5p targets are denoted by green and purple rectangles, corresponding to predicted-
  and experimentally-validated targets, respectively. Non-targets are indicated in
  a gray rectangle. (B) A volcano plot represents the results of differential expression
  analysis. Upregulated transcripts are shown in red and downregulated transcripts
  are shown in blue (|FC| > 1.2 and P<0.05). (C) Bubble plot representing the results
  of the Ingenuity Pathway Analysis. The top 20 pathways showing the strongest statistical
  significance based on adjusted p-values were selected for inclusion. The size of
  each bubble indicates the number of RNAs that exhibited differential expression
  (Hits), and the color represents the ratio between the hits within the pathway and
  the total number of molecules in the pathway (Ratio). The clustergram on the right
  shows the specific transcripts and their involvement in each pathway. Each row of
  the clustergram is aligned with its corresponding pathway in the bubble plot. Upregulated
  transcripts are shown in red and downregulated transcripts are shown in blue. Note
  that miR-17a targets are denoted in green or purple rectangles, corresponding to
  predicted and experimentally validated targets, respectively. (n = 5)
