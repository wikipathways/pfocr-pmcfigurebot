figure_title: Metabolic pathways upregulated in P. aeruginosa growing at 37°C at exponential
  phase
caption: 'A selection of notable metabolic and enzymatic pathways that were characteristic
  of PAO1 growing at 37°C at exponential phase. Genes labeled in red were significantly
  upregulated at 37°C (fold change > 2, adjusted p-value < 0.05). Pathways are simplified
  to highlight the function of thermoregulated genes. Pathways or genes related to
  anaerobic growth and survival and/or induced by low oxygen conditions are marked
  with Low O2. Abbreviations: MGD – molybdopterin guanine dinucleotide; ROS – reactive
  oxygen species; HCN – hydrogen cyanide, ? – indicates an incomplete understanding
  in a specific aspect of a metabolic pathway'
article_title: The interplay between temperature and growth phase shapes the transcriptional
  landscape of Pseudomonas aeruginosa
