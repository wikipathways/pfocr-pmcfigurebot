figure_title: Summary of apoptosis- and ferroptosis-inducing activities of 1.
caption: Summary of apoptosis- and ferroptosis-inducing activities of 1. Compound
  1 induces apoptosis in SBC-3 cells via the mitochondrial pathway, involving cell
  cycle arrest at the G2/M phase in SBC-3 cells. Additionally, 1 also induces ferroptosis
  in SBC-3 cells, accompanied by upregulation of transferrin, CD71, Nrf2, and HO-1
  expression; downregulation of Keap1, xCT, and GPX4 expression; and accumulation
  of cellular Fe2+, hydroxyl radicals, and lipid peroxides
article_title: Agapanthussaponin A from the Underground Parts of Agapanthus africanus
  Induces Apoptosis and Ferroptosis in Human Small-Cell Lung Cancer Cells
