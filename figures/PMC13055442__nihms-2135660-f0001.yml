figure_title: 'Nociceptor primary cilium: structure and function'
caption: |-
  Nociceptors, whose cell bodies are located in dorsal root ganglia (DRG), elaborate a single primary cilium on their cell body. This organelle signals to the nucleus as well as ion channels in the plasma membrane, to influence neuronal activity. (A) Left panel: Nociceptor, with its cell body located in a DRG (black box to the right of the spinal cord, above neuron). Stimuli are transduced at its peripheral terminal (e.g., innervating skin, below neuron) and transmitted to its central terminal in the spinal dorsal horn (above neuron). The primary cilium, located on the nociceptor cell body (blue box), modulates sensory transduction at its peripheral terminal. Right upper panel: Intraflagellar Transport (IFT) in the Primary Cilium. A magnified image of the primary cilium in the blue box, on the cell body. Basic structure of the primary cilium, indicating the microtubule-based central axoneme in green, elaborated from the basal body (BB), and an IFT system moving cargo between the axoneme and the plasma membrane sheath of the cilium, utilizing IFT protein complex B (purple) and a kinesin-2 motor (pink) for anterograde transport (red arrow), with retrograde transport (blue arrow) accomplished by IFT protein complex A. Right lower panel:
  Primary Cilium-dependent Hedgehog (Hh) signal transduction pathway (see text for details). Kif3a: Kinesin family member 3a; Gli1,2,3: Gli family zinc finger 1,2,3; SMO: Smoothened; Ptch1: Patched homolog 1. (B,C) Confocal immunofluorescence images of IB4-stained (white) neurons cultured from rat L4 DRGs and stained for the ciliary axoneme (αArl13B, green), the basal body (αγ-tubulin, red), and the nucleus (DAPI, blue), in groups of neurons (B) or, at higher magnification, in one neuron (C). Overlay image in the left panels; right panels indicate individual channels. White arrowheads indicate primary cilia. Scale bars: 10 μm. Created in BioRender. GANTER, G. (2025) https://BioRender.com/pos0601
