figure_title: NISCH S-glutathionylation disrupts protein-protein interactions, activating
  the Rac1 pathway
caption: (a) NISCH domain and its interacting partners. NISCH domains interacting
  with protein partners were drawn in lines in different colors. (b-d) Analysis of
  NISCH-protein interactions and Rac1 downstream pathway in MDA-MB-231 cells. MDA-MB-231
  cells expressing NISCH WT or C185S were incubated in low or high glucose (LG or
  HG). (b) NISCH glutathionylation dissociates NISCH from Rac1 and PAK1. After incubating
  cells in LG or HG for 16 h, the co-immunoprecipitation was used to examine the binding
  of Rac1, PAK1, or integrin α5 (n = 2–3). (c) Rac1 activation analysis after NISCH
  C185 glutathionylation. After incubating cells for 16 h, the GST-fused p21-binding
  domain (PBD) derived from PAK1 (GST-PAK1-PBD) was used to pull down the Rac1-GTP
  form, which was then analyzed by Western blot (n = 2). (d) The co-localization analysis
  of NISCH and Rac1. After 16 h, cells were fixed and analyzed by antibodies to FLAG
  (green) and Rac1/Cdc42 (red) (n = 10 images). The merged images were analyzed to
  examine the relative displacement of NISCH and Rac1 in the cell periphery at higher
  magnification (box). Data represent the mean ± SD. The statistical difference was
  analyzed by one-way ANOVA and Tukey’s post-hoc test (b-d), where *p < 0.03, **p
  < 0.002, ***p < 0.0002, ****p < 0.0001
