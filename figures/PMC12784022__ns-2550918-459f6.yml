figure_title: Lysophosphatidylcholine acyltransferase 1-phosphatidylcholine (LPCAT1-PC)
  axis normalizes lysosomal membrane lipid composition after N-dodecylimidazole (NDI).
caption: 'Lysophosphatidylcholine acyltransferase 1-phosphatidylcholine (LPCAT1-PC)
  axis normalizes lysosomal membrane lipid composition after N-dodecylimidazole (NDI).
  (A and B) CTSD and NAGLU activity is increased in lysosomal and decreased in cytosolic
  fractions in LPCAT1 or PC treated NDI damage group. n=3. (C and D) CTSD in the lysosomal
  fractions were extracted from the NDI, NDI+LPCAT1 and NDI+PC group, and quantification
  of the protein levels of CTSD in lysosomes fractions. (E and F) CTSD in the cytosol
  fractions were extracted from the from the NDI, NDI+LPCAT1, and NDI+PC group, and
  quantification of the protein levels of CTSD in cytosol fractions. (G) Immunofluorescence
  staining of CTSD. Scale bar: 10 μm. n=3. (H and I) Lipidomics analysis for the lysosomal
  membrane lipid composition treated with LPCAT1 after NDI induced lysosomal damage,
  principal component analysis (PCA) and orthogonal partial least squares-discriminant
  analysis (OPLS-DA) analysis indicates a clear separation between the 2 groups. (J)
  Heat-map of different metabolites. (K) Kyoto Encyclopedia of Genes and Genomes (KEGG)
  analysis of the disturbed metabolic pathways. (L) PC abundance after LPCAT1 treatment
  for NDI induced lysosomal damage. (M and N) Lipidomics analysis for the lysosomal
  membrane lipid composition treated with PC after lysosomal damage, PCA and OPLS-DA
  analysis indicates a clear separation between the 2 groups. (O) Heat-map of different
  metabolites. (P) KEGG analysis of the disturbed metabolic pathways. (Q) PC abundance
  after PC treatment for NDI induced lysosomal damage. Compared with the indicating
  group, CTSD, cathepsin D; NAGLU, alpha-N-acetylglucosaminidase; OE-control, overexpression-control;
  LAMP1, lysosome-associated membrane protein 1; DAPI, 4´-6-diamidino-2-phenylindole.
  *p<0.05, **p<0.01, and ***p<0.001'
