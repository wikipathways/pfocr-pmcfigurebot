figure_title: Cell and non-cell autonomous dysfunctions during ALS progression
caption: In the degenerating CNS, ubiquitinated, SQSTM1/p62-positive misfolded protein
  aggregates have been observed, resulting from different gene mutations associated
  with ALS. These aggregates are found not only in neurons but also in glial cell,
  including microglia, astrocytes, and oligodendrocytes. To date, in ALS, impaired
  autophagic flux and reduced protein clearance have been strictly associated with
  MNs. In the case of microglia, studies have shown an increase in autophagy accompanied
  by a decrease in phagocytosis. Moreover, the presence of different gene mutations
  favours the activation of microglia, leading to elevated secretion of proinflammatory
  cytokines into the extracellular space. This inflammatory environment induces a
  reactive state in astrocytes, characterised by the overactivation of the IGF-mTOR
  pathway, which results in decreased autophagic flux. At the same time, reactive
  astrocytes show reduced support for neurons and an increased release of toxic molecules
  and inflammatory cytokines, all of which negatively impact MN viability. Altough
  only mild autophagic defects have been observed in oligodendrocytes, the presence
  of ALS-related mutations adversely impacts their functions, leading to reduced trophic
  support and myelination of MN axons, contributing to neuronal degeneration. Created
  in BioRender. Magdalena, R. (2026) https://BioRender.com/pn52mxd
