figure_title: Detection of genes related to antioxidant enzyme apoptosis pathway after
  RNAi knockdown of Lv-ALF like gene.
caption: Detection of genes related to antioxidant enzyme apoptosis pathway after
  RNAi knockdown of Lv-ALF like gene. After knocking down the target gene, WSSV was
  injected for immune stimulation, and the expression of related genes in the shrimp
  hepatopancreas was detected within 0, 12, 24, 36, and 48 h later. The dsGFP + WSSV
  group was used as the control. The same letters indicate no differences among the
  groups. Different letters represent significant differences between groups. Error
  bars represent ± SD of three independent PCR amplifications in quantitation ((A)
  Lv-Caspase 3; (B) Lv-Caspase 8; (C) Lv-Bax; (D) Lv-Bcl2; (E) Lv-GST; (F) Lv-CAT;
  (G) Lv-Prx; (H) Lv- GPX; (I) Lv-SOD)
