figure_title: This figure displays the dose-dependent effects of ozone therapy on
  cellular pathways.
caption: This figure displays the dose-dependent effects of ozone therapy on cellular
  pathways. At high concentrations (left panel), ozone generates excessive reactive
  oxygen species (ROS), leading to H2O2 accumulation, impaired mitochondrial function,
  and depletion of antioxidants such as ascorbate (Asa), glutathione (GSH), and superoxide
  dismutase (SOD). This imbalance promotes oxidative stress and cellular injury. At
  low concentrations (right panel), mild ROS/electrophile signaling activates the
  Nrf2–Keap1 pathway. Nrf2 is released from Keap1, translocates into the nucleus,
  and binds to the antioxidant response element (ARE), driving transcription of cytoprotective
  proteins and enhancing antioxidant defense. Black solid arrows = progression of
  signaling events or molecular processes. Red downward arrow = inhibition or depletion
  of antioxidant defenses. Dashed arrow = nuclear translocation of Nrf2. Created with
  Biorender.com
