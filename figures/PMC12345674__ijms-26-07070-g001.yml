figure_title: Microbial origins and systemic impacts of uremic toxins in autism spectrum
  disorder.
caption: Microbial origins and systemic impacts of uremic toxins in autism spectrum
  disorder. Schematic overview illustrating the gut microbiota-mediated production
  of key uremic toxins—indoxyl sulfate (IS), p-cresyl sulfate (PCS), and trimethylamine
  N-oxide (TMAO)—from dietary amino acids (tryptophan, tyrosine, and choline). These
  toxins enter systemic circulation and may contribute to oxidative stress, inflammation,
  and neurological disturbances through interactions with the kidneys and brain. This
  functional pathway supports the rationale for studying toxin ratios and burden in
  ASD
