figure_title: Metabolic processes underlying energy production and utilisation in
  neurons.
caption: Metabolic processes underlying energy production and utilisation in neurons.
  Glycolysis, oxidative phosphorylation, and the oxidation of lactate and ketone bodies
  generates ATP. During glycolysis, glucose is converted to pyruvate, producing ATP.
  Lactate is converted to pyruvate, and ketone bodies such as β-hydroxybutyrate are
  oxidised to acetyl-CoA, allowing both intermediates to enter central metabolic pathways
  that yield ATP. This ATP is essential for restoring resting membrane potential,
  synthesising neurotransmitters, and producing myelin to improve signal transmission.
