figure_title: Differentially expressed miRNA profiles by sequencing in ox-LDL-induced
  THP-1 macrophages.
caption: 'Differentially expressed miRNA profiles by sequencing in ox-LDL-induced
  THP-1 macrophages. PMA-induced THP-1 macrophages were treated with ox-LDL alone
  or in combination with C-1b(3-13) (6.25 μM) for 24 h. (A) The number of DEMs in
  the following: (i) ox-LDL-treated and control groups, and (ii) AMP C-1b(3-13)-treated
  and ox-LDL groups. |log2 FC| >1, p < 0.05. (B) Heatmap of differentially expressed
  miRNAs in the following: (i) ox-LDL-treated and control groups (left), and (ii)
  AMP C-1b(3-13)-treated and ox-LDL groups (right). Color scale indicated log2-transformed
  normalized expression values (red: upregulation and blue: downregulation). (C,D)
  Functional enrichment analysis of the predicted target genes of differentially expressed
  miRNAs: (C) KEGG enrichment pathways (level 2) and (D) GO terms (Level 2). (E) RT-qPCR
  validated the expression levels of the top ten differentially expressed miRNAs (n
  = 3, each point represents an independent experiment). One-way ANOVA was used to
  compare multiple groups for each mutation. Results are expressed as mean  ±  SEM;
  # p < 0.05, ## p < 0.01 vs. the control group; ** p < 0.01 vs. ox-LDL group'
