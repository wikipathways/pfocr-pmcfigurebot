figure_title: Differentially expressed genes in the neck-panicle node between the
  booting stage and the grain filling stage.
caption: Differentially expressed genes in the neck-panicle node between the booting
  stage and the grain filling stage. (a) PCA analysis on the neck-panicle node at
  the booting stage (S3) and the grain filling stage (S5). Each data point represents
  an independent biological replicate. (b) Number of DEGs in the neck-panicle node
  between S3 and S5. (c,d) GO enrichment analysis (c) and KEGG enrichment analysis
  (d) of DEGs in (b). The top 20 GO terms or KEGG pathways with the lowest p-value
  are shown. (e,f) Heatmaps showing representative DEGs related to mineral nutrient
  transport (e) and carbohydrate transport (f) at S3 and S5. (g) Potential genes involved
  in mineral nutrient allocation and carbohydrate allocation in node I. Heatmaps show
  the normalized expression values normalized by the Z-score method. The red color
  in the heatmaps in (e–g) represents higher expression levels, while blue represents
  lower expression levels. NPN, neck-panicle node; NDI, node I
