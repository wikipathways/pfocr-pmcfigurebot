caption: Functional annotation and pathway analysis of PCD signature-defined risk
  groups. (A) GSVA-derived heatmap illustrating differential pathway activities between
  high- and low-risk groups using MSigDB gene sets. (B) t-SNE visualization of KEGG
  and reactome pathway activities in risk-stratified groups. (C) Metascape-generated
  enrichment network of differentially expressed genes between risk groups. (D) GSEA
  plots highlighting significantly enriched KEGG pathways associated with PCD signature.
  ⁣∗∗∗p  < 0.001
