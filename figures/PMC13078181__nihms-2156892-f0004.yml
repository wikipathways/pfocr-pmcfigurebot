figure_title: NR4A2 induces a Warburg-like metabolic reprogramming in the mouse heart
caption: Integrative schematic depicting the interconnection between enzymes and metabolic
  intermediates from the glycolysis pathway, the TCA cycle, and the glutamine-dependent
  reductive carboxylation pathway. Relative amounts of metabolic intermediates were
  determined in the ventricle of Nr4a2-icTg mice and Cre control littermates at 3,
  6 and 12 days after tamoxifen injection. Mean ± SEM of n = 10 mice per group per
  timepoint (5 males/5 females). Data analyzed by two-way ANOVA contrasts. *p < 0.05.
  Relative expression levels of the genes encoding enzymes of interest are presented
  in the form of heatmaps for the ventricle of Nr4a2-icTg mice after 3, 6 and 12 days
  of NR4A2 induction. Tamoxifen-injected Cre control mice (C) were used to establish
  basal gene expression levels. Mean of n = 4 mice per group per timepoint (2 males/2
  females). Absolute quantification and statistical differences for all genes are
  presented in Supplemental Figure S6
