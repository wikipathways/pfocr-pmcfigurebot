figure_title: C/EBPβ deficient keratinocytes utilize TNF-α mediated signaling to activated
  UVB-induced apoptosis
caption: A) Ingenuity Pathway Analysis’ Upstream Regulator Analysis of RNAseq data
  reveals top upstream transcription regulators in UVB exposed C/EBPβ −/− primary
  keratinocytes compared to UVB exposed wild type mice. B) Wild type and C/EBPβ −/−
  primary keratinocytes were treated with 10 mJ/cm2 UVB. Cells were collected 8 hours
  post-UVB. TaqMAN Real-Time PCR analysis for Tnfa. Data are expressed as the mean
  normalized to Gapdh ±SD n=3. C) Wild type and C/EBPβ knockout primary mouse keratinocytes
  were treated with 10 mJ/cm2 UVB. Growth media from cultured cells was collected
  8 hours post-UVB. Secreted TNF-α protein levels were measured by ELISA. Data are
  expressed as the mean ±SD n=3. D) Wild type and C/EBPβ −/− primary keratinocytes
  were pre-treated with 0.1 or 1 μg/mL TNF-α neutralizing antibody for 1 hour prior
  to exposure to 10 mJ/cm2 UVB. Cells were collected 16 hours post-UVB and stained
  with Annexin V and PI and subjected to flow cytometric analysis. Plotted data are
  mean percentage of cells staining Annexin V+/PI−, ±SD n=3. E) Wild type and C/EBPβ
  −/− primary keratinocytes were pre-treated with 25 μM BMS986165 for 1 hour, cells
  were then treated with 10 mJ/cm2 UVB. 8 hours post-UVB. TaqMAN Real-Time PCR analysis
  for Tnfa. Data are expressed as the mean normalized to Gapdh ±SD n=3.Statistical
  analysis was done using student t-test for paired data with the significance level
  set to p < 0.05. * denotes p-value < 0.05, ** denotes p-value < 0.01
article_title: C/EBPβ Deficiency Enhances Keratinocyte Apoptosis after UVB-Induced
  DNA Damage via Regulation of the Type I IFN and TNF Responses
