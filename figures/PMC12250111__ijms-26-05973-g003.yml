figure_title: The cancer-promoting functions of TAMs in the Br-TME.
caption: The cancer-promoting functions of TAMs in the Br-TME. TAMs facilitate angiogenesis
  by multiple factors and pathway cascades (e.g., CSF-1R, CCL18, VEGF/PCAT6, and TIE2/ANG).
  TAMs stimulate factors (e.g., macrophage-CSF, ICAM-1, and ephrin) and signaling
  pathways (e.g., IL-6/STAT-3, EGFR/STAT3/SOX2, CCL2/AKT/β-catenin, and VEGFA/NRP-1)
  to maintain the quantity and functionality of breast cancer stem cells. TAMs regulate
  the immune microenvironment by enhancing M2 TAM and Treg with TGF-β and CXCL1, and
  by inhibiting DC, NK cell, T cell, and CTL with TGF-β, IL-10, ARG-1, IFN-γ, IRF8,
  CD80/CD86, IL-1R2, and CSF-1R
