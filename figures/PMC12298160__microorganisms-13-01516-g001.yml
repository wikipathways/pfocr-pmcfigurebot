figure_title: Overview of RNA transcriptomic and proteomic profiles of wildtype and
  csrA mutant strains.
caption: 'Overview of RNA transcriptomic and proteomic profiles of wildtype and csrA
  mutant strains. (A) Volcanic map of differential genes in transcriptome (FDR < 0.05,
  |log2 (fold change)| ≥ 1) (left panel) and statistical column chart of differentially
  expressed genes (right panel). WT: wildtype strain V. alginolyticus ZJ-T; R6H: csrA
  mutant strain ZJ-T-csrAR6H. Red dot represents significantly upregulated difference;
  green dot represents significantly downregulated difference; black dot represents
  no difference. (B) Volcanic map of differential proteins in proteomics (FDR < 0.05,
  |fold change| ≥ 1.5) (left panel) and statistical column chart of differentially
  expressed proteins (right panel). Red dot represents significantly upregulated difference;
  blue dot represents significantly downregulated difference; gray dot represents
  no difference. WT: wildtype strain V. alginolyticus ZJ-T; R6H: csrA mutant strain
  ZJ-T-csrAR6H. (C) Histogram of top 21 KEGG pathway enrichments in transcriptomics
  after mutation of csrA. (D) Histogram of top 26 KEGG pathway enrichments in proteomics
  after mutation of csrA'
