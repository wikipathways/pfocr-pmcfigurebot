figure_title: Functional pathway enrichment analysis of differential metabolites in
  pairwise comparisons of serum and milk samples.
caption: 'Functional pathway enrichment analysis of differential metabolites in pairwise
  comparisons of serum and milk samples. (A–C) Bubble chart analysis of functional
  pathways of camel’s milk from L vs. C, M vs. C, and H vs. C comparisons, respectively.
  (D–F) Bubble chart analysis of functional pathways of serum from L vs. C, M vs.
  C, and H vs. C comparisons, respectively. X-axis: x/y (number of differential lipid
  compounds in a pathway/total identified lipid compounds in that pathway), higher
  values indicate greater enrichment of differential lipids in the pathway. Y-axis:
  KEGG pathway names. The color and size of the bubbles indicate the p-value and the
  pathway impact index; the darker the bubble, the higher the p-value, and the larger
  the bubble, the higher the pathway impact index. (G,H) Venn diagrams of significantly
  different metabolites per experimental group'
