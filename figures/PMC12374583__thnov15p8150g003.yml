figure_title: Tan I inhibits the microglia activation in the mPFC of CUS mice.
caption: 'Tan I inhibits the microglia activation in the mPFC of CUS mice. (A) The
  volcano plot showed differentiated genes, with 932 up-regulated genes and 1667 down-regulated
  genes. (B) Heat maps of the DEGs between the Veh + CUS and Tan I + CUS groups were
  determined by RNA-seq. (C) KEGG pathway analysis was performed based on the obtained
  DEGs. (D-E) GSEA analyses revealed that Tan I affected gene expression related to
  microglial cell activation (D) and regulation of neuronal synaptic plasticity (E).
  (F-G) Representative images (F) and quantitative analysis (G) of Iba1 (red) and
  Hoechst (blue) in the mPFC of CUS mice after Tan I treatment (n = 5). (H-I) The
  levels of IL-1β (H) and TNF-α (I) were determined in the mPFC tissues in different
  groups of mice (n = 4). (J) The levels of COX-2 in the mPFC of different groups
  of mice were analyzed. (K) Relative quantification of COX-2 protein levels in different
  groups of mice (n = 4). (L) The levels of iNOS in the mPFC of different groups of
  mice were analyzed. (M) Relative quantification of iNOS protein levels in different
  groups of mice (n = 4). (N) Representative images of Iba1 (red) and CD68 (green)
  in the mPFC of CUS mice after Tan I treatment (n = 5). Scale bar = 25 μm. Zoom in
  images (bar = 10 μm). (O) The quantification of the number of CD68+ microglia (n
  = 5). ∗∗P < 0.01, ∗∗∗P < 0.001 versus vehicle control group; #P < 0.05, ##P < 0.01,
  ###P < 0.001 versus vehicle CUS group; ns, not significant. One-way ANOVA with Tukey''s
  post hoc test. All data are expressed as mean ± SEM'
