figure_title: Analysis of differentially expressed exosomal miRs and their target
  pathways.
caption: 'Analysis of differentially expressed exosomal miRs and their target pathways.
  (A) The heatmap shows unsupervised clustering of statistically significantly differentially
  regulated exosomal miRs resulting from different treatments. The miRs shown in the
  heatmap are derived from MSC exosomes (n = 3) treated as indicated on the bottom
  and were selected based on the following criteria: absolute fold change > 1.5 and
  p < 0.05. Missing values that did not pass these criteria are shown in white. (B)
  For each treatment, the differentially regulated miR-targeted pathways are indicated.
  Target genes that belong to multiple KEGG pathways were placed into each assigned
  pathway, and the number of target genes is written next to the pathway'
