figure_title: Concepts map of the type 2 inflammatory pathway in bronchial asthma
  and the mechanism of action of dupilumab.
caption: Concepts map of the type 2 inflammatory pathway in bronchial asthma and the
  mechanism of action of dupilumab. T helper 2 (Th2) cells and type 2 innate lymphoid
  cells (ILC2) release IL-4, IL-5, and IL-13. IL-4 primarily promotes B-cell IgE class
  switching and mast cell degranulation, whereas IL-5 drives eosinophil recruitment
  and survival. IL-13 induces goblet cell hyperplasia, airway smooth muscle hyperplasia,
  collagen deposition by fibroblasts, and FeNO production. These cytokines collectively
  sustain eosinophilic inflammation and promote eosinophil migration from the bloodstream
  into the airways. Redundancy is illustrated by gray dashed lines. Dupilumab, by
  blocking the IL-4 receptor α (IL-4Rα) subunit, inhibits IL-4 and IL-13 signaling,
  thereby reducing type 2 inflammation and its downstream effects (red lines)
