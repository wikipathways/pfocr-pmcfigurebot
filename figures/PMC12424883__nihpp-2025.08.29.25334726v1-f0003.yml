  based on: (i) top 10 protein mediators combined with demographic confounders (age,
  sex, BMI), (ii) randomly selected sets of 10 proteins (100 repetitions), (iii) the
  full proteomic panel, and (iv) models built with varying numbers of top-ranked proteins'
