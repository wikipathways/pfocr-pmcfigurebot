figure_title: The ligand-targeted CSF1R-CAR activates CSF1R signaling in THP-1 cells
caption: '(A) Volcano plot analysis of the phosphotyrosine (pY) sites, as identified
  by LC-MS/MS, in Raji cells after co-culture with CD19-CAR T cells for the indicated
  times (Data are from four biological replicates). (B) Volcano plot analysis of the
  pY sites in THP-1 cells after co-culture with CSF1R-CAR T cells for the indicated
  times. Data are from four biological replicates. (C) Left: Western blotting analysis
  of ERK1/2 Thr202Tyr204 phosphorylation in proteomics samples from the indicated
  cell co-cultures. Right: Quantification of the fold-change in phosphorylated ERK1/2
  in the indicated cell co-cultures. Data are from four biological replicates. (D
  and E) Western blotting analysis (left) and relative quantification (right) as described
  for (C) of CD19 Tyr531 (D) and CSF1R Tyr723 (E) in the indicated cell co-cultures.
  CSF1R Tyr723 abundance was normalized to that of Lck. Data are from four biological
  replicates. Statistical significance was determined by a two-way ANOVA with Fisher’s
  least significant difference and the Holm-Sidak correction for multiple comparisons.
  *P < 0.05, **P < 0.01, ***P < 0.001. (F and G) Heatmaps showing quantification of
  the indicated individual phosphorylation sites observed in Raji cells after co-culture
  with CD19-CAR T cells (F) and in THP-1 cells after co-culture with CSF1R-CAR T cells
  (G) for the indicated times. Data are from four biological replicates. (H and I)
  PTM-SEA showing enrichment of Raji PTM sites in NetPath Pathways (H) and in the
  PhosphoSitePlus Kinase Signatures database (I). Data are from four biological replicates.
  (J and K) PTM-SEA showing enrichment of THP-1 PTM sites in NetPath Pathways (H)
  and in the PhosphoSitePlus Kinase Signatures database (I). Data are from four biological
  replicates'
