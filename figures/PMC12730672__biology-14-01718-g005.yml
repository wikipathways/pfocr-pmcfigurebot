caption: 'Enrichment analysis of gene GO term and KEGG pathway for DEGs under warming.
  (a,b) Bar chart of the top 20 significantly enriched DEGs of the two comparison
  groups in Amur grayling. The two comparison groups include 15 °C vs. 9 °C and 21
  °C vs. 9 °C. The different colors in the GO chart represent the enriched categories
  with −log10(Padjust) as the standard. (c,d) KEGG enrichment of the two DEG comparison
  groups in Amur grayling. The two comparison groups include 15 °C vs. 9 °C and 21
  °C vs. 9 °C. The red bar in the KEGG chart represents the enriched categories with
  -log10(Padjust) as the standard. The polylines represent the number of genes enriched
  into different categories. Con: control group (9 °C); C15: 15 °C group; C21: 21
  °C group. KEGG pathway: © Kanehisa Laboratories; reproduced with permission. Individual
