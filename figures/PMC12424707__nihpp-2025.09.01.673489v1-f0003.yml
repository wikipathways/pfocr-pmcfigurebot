figure_title: Depletion of NAT10 preferentially induced IFN and ISG expression with
  poly(I:C) stimulation
caption: (A-E) A549 cells were transfected with NAT10 or non-targeting siRNAs (1:1
  mixture of siNAT10–1 and siNAT10–2, siNT), followed by poly(I:C) treatment (1μg/mL).
  Cell samples (triplicate 1–3) were prepared and processed for transcriptomic analysis
  by RNA-seq. Volcano plot of differentially expressed genes (DEGs) induced by poly(I:C)
  treatment (A), or NAT10 depletion (B) in A549 cells treated with poly(I:C). Heatmap
  of the upregulated DEGs due to NAT10 depletion (C). KEGG (D) and GO (E) analysis
  of top 10 enriched pathway of upregulated DEGs due to NAT10 depletion
