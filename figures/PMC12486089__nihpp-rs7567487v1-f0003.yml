figure_title: PBMC analysis of immune-related gene expression and immune cell analysis
  of longer- and shorter-surviving GBM patients in cohort A
caption: 'RNA-Seq was performed on PBMC samples from enrolled patients. (A) Differential
  gene expression was compared between GBM patients that survived ≥24 months (Long
  Survival, n=4) and <24 months (Short Survival, n=8) from PBMCs isolated at baseline
  (BL). Left panel: significant immune-related GO pathways were identified by Gene
  Set Enrichment with P<0.05; Right panel: comparison of expression levels for immune-related
  GO genes that were highlighted during the Gene Set Enrichment analysis. (B) Differential
  gene expression was also compared between long- (n=3) and short-term (n=7) survival
  patient PBMCs isolated at the cycle 1 day 1 (C1) time point. Left panel: Significant
  immune-related GO pathways identified by Gene Set Enrichment with P<0.05; Right
  panel: comparison of expression levels for immune-related GO genes that were highlighted
  during the Gene Set Enrichment analysis. (C) t-SNE plot projection of immune cells
  in the peripheral blood via spectral flow cytometry analysis. (D) Comparison of
  different CD8+ T cell subtypes and dendritic cells (DCs) between baseline and C1
  timepoints stratified by short-term vs. long-term survival. *P<0.05, **P<0.01'
