figure_title: Genome-wide scans for signatures of natural selection in Tibetan sheep.
caption: Genome-wide scans for signatures of natural selection in Tibetan sheep. (A).
  Manhattan plot depicting composite selection scores (CMS) for 25,327,494 single-nucleotide
  variants (SNVs). The red horizontal line (CMS = 7.06) indicates the top 0.5% threshold
  for significant selection signals. Novel candidate genes are highlighted in red,
  whereas previously reported hypoxia-adapted genes are shown in navy blue. The top
  10 TSNSGs are annotated with gene symbols. (B). Pie chart categorizing genomic annotations
  of 126,075 trait-associated SNVs under selection (TSNSSs). The majority of SNVs
  reside in intergenic regions, while the “Others” category comprises 1126 upstream
  and 2106 downstream regulatory variants. (C). Tibetan sheep harbored 165 positive-selection
  reproduction-associated genes. This set includes 92 differentially expressed genes
  (DEGs) exhibiting selection signals in gonadal tissues—specifically, four testis-specific,
  15 testis-enriched, and 73 ovary-enriched DEGs—alongside 73 key reproductive pathway
  genes subject to selection
