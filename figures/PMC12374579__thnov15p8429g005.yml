figure_title: Intermittent fasting (IF) changes the proteomic landscape of hippocampus.
caption: 'Intermittent fasting (IF) changes the proteomic landscape of hippocampus.
  We first examined the effect of IF on the hippocampus under normal physiological
  conditions. (A and B) Bar plots showing the top enriched Gene Ontology (GO) terms
  across three categories—Biological Process (BP), Cellular Component (CC), and Molecular
  Function (MF)—modulated by IF. Bars represent normalized enrichment scores. Two
  analyses were performed: (A) using the entire proteomics dataset from AL-sham and
  IF-sham groups, and (B) using significantly differentially expressed proteins (DEPs).
  (C) Heatmap displaying DEPs in response to IF compared to AL. (D) Graphical summary
  of key canonical pathways and biological functions altered by IF, identified using
  Ingenuity Pathway Analysis (IPA). Predicted pathway activation states are indicated
  by z-scores (orange: activation; blue: inhibition). n = 20 mice in each experimental
  group'
article_title: Intermittent fasting reprograms the brain proteome to prevent synaptic
  degeneration and cognitive impairment in vascular dementia
