figure_title: Hallmarks of inflammaging.
caption: Hallmarks of inflammaging. Central to inflammaging is persistent chronic
  low-grade systemic inflammation, driven by elevated levels of pro-inflammatory cytokines
  and an immunosenescence-associated inflammatory shift—where aged immune cells acquire
  a pro-inflammatory phenotype. The accumulation of senescent cells secreting the
  senescence-associated secretory phenotype (SASP) further propagates inflammation.
  Mitochondrial dysfunction and the generation of reactive oxygen species (ROS) activate
  innate immune pathways, while aging-associated changes in the gut microbiota (dysbiosis)
  promote systemic exposure to microbial products like lipopolysaccharide (LPS). Simultaneously,
  there is a decline in anti-inflammatory mechanisms, such as the reduced secretion
  of IL-10 and TGF-β by regulatory T cells (Tregs). Inflammatory metabolic shifts,
  including increased glycolysis and altered lipid metabolism, support pro-inflammatory
  immune cell function. Collectively, these processes accelerate the onset and progression
  of age-related diseases, including cardiovascular disease, type 2 diabetes, osteoporosis,
  and neurodegeneration
