figure_title: Effect of MEG3 on CASP8 expression via ssc-miR-135-mediated pathway.
caption: Effect of MEG3 on CASP8 expression via ssc-miR-135-mediated pathway. (A)
  CCK-8 assay was performed to detect the effect of co-transfection of MEG3 overexpression
  plasmid and ssc-miR-135 mimic on cell viability after G. parasuis infection of 3D4/21
  cells. “**” indicates p < 0.01. (B) After co-transfection with MEG3 overexpression
  plasmid and ssc-miR-135 mimic, 3D4/21 cells were infected with G. parasuis, and
  apoptosis rates were detected by flow cytometry. (C) Statistical analysis results
  of apoptosis rate. “**” indicates p < 0.01. (D) After co-transfection of MEG3 overexpression
  plasmid and ssc-miR-135 mimic, qPCR was used to detect the expression of MEG3 and
  (E) ssc-miR-135 in G. parasuis-infected 3D4/21 cells. “**” indicates p < 0.01. (F)
  After co-transfection with MEG3 overexpression plasmid and ssc-miR-135 mimic, qPCR
  was performed to determine the mRNA level of CASP8 in G. parasuis-infected 3D4/21
  cells. “**” indicates p < 0.01. (G) After co-transfection of the MEG3 overexpression
  plasmid and ssc-miR-135 mimic, Western Blot analysis was conducted to detect the
  protein level of CASP8 in G. parasuis-infected 3D4/21 cells. “**” indicates p <
  0.01
