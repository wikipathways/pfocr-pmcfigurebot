figure_title: AR Signaling in Physiology and Tumor Biology
caption: A. Effects of androgens on target organs in normal physiology. B. Testosterone
  can be converted into a more potent androgen, dihydrotestosterone (DHT), by cytoplasmic
  5α-reductase. Testosterone or DHT can bind AR, resulting in a conformational shift
  that releases it from heat shock proteins (HSPs) and enables receptor dimerization
  and nuclear translocation. AR binds chromatin to mediate transcriptional regulation
  of AR target genes in a tissue-specific manner in the genomic pathway. In the non-genomic
  pathway, monomeric liganded AR activates mTORC1 resulting in mRNA translation of
  transcripts encoding cell cycle regulators C. Effects of androgens on prostate cancer
  cells
