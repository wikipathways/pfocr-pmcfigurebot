figure_title: SHIP1 interacts with proteins important for endo-lysosomal function
caption: '(A) Simplified experimental pipeline for SHIP1 immunoprecipitation followed
  by mass spectrometry (IP-MS). Created with BioRender.com.(B) Representative Western
  blot of SHIP1 immunoprecipitation WT and INPP5D KO iMGs.(C) Bar plot of the top
  30 statistically significant binding partners of SHIP1 identified via IP-MS.(D)
  Venn diagram of the previously identified SHIP1 binding partners and the binding
  partners identified in this study.(E) SHIP1 binding partners identified via IP-MS
  categorized by endo-lysosomal pathway-related GO terms.(F) Representative Western
  blot for the validation of co-immunoprecipitation of SHIP1 with SHIP2 and CAPZA2.(G)
  Representative confocal image of SHIP1 immunostaining in BR24 iMGs, along with proximity
  ligation assay (PLA) signal showing areas of close interaction of SHIP1 and SHIP2.
  Scale bars: 25 μm. See Figure S1A for negative and positive controls.(H) Representative
  confocal image of SHIP1 immunostaining in BR24 iMGs, along with proximity ligation
  assay (PLA) signal showing areas of close interaction of SHIP1 and CAPZ. Scale bars:
  10 μm. See Figure S1B for negative and positive controls'
