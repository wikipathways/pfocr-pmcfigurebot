figure_title: PSAP in Atherosclerosis (AS).
caption: PSAP in Atherosclerosis (AS). PSAP regulates macrophage function in atherosclerosis
  (AS) by a dual mechanism. (Left) Intracellularly, PSAP is processed into mature
  saposins by Cathepsin D (CTSD) to regulate sphingolipid degradation; its functional
  abnormalities (e.g., reduced CTSD activity) lead to the accumulation of glycosphingolipids
  and cholesterol in lysosomes, impeding ABCA1-mediated cholesterol efflux and accelerating
  foam cell formation. In addition, PSAP is co-expressed with APOE, APOC1, CCL2, CTSB,
  CTSD and MMP9, which play important roles in plaque inflammation. Furthermore, PSAP
  promotes macrophage inflammation via the mTOR/S6K1 pathway, and inhibition of mTOR/S6K1
  reduces inflammatory responses and plaque volume in APOE-/- mice, while PSAP deficiency
  suppresses macrophage glycolysis and oxidative phosphorylation to inhibit inflammatory
  activation of macrophages. (Right) Extracellularly, PSAP+ efferocytic extracellular
  vesicles (Effero-EVs) released by efferocytes bind to GPR37 on macrophages, activating
  ERK signaling and increasing c-Fos expression, which upregulates Tim4 to enhance
  apoptotic cell clearance. This process reduces plaque necrosis and increases collagen
  deposition. Advanced plaques with impaired efferocytosis exhibit necrotic core expansion
  and thin fibrous caps. Targeting PSAP may stabilize plaques by balancing inflammatory
  and efferocytic pathways. Created with BioRender.com
