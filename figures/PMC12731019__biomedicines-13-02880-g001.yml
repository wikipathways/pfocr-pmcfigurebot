figure_title: SCAP/SREBP pathway.
caption: 'SCAP/SREBP pathway. When intracellular demand for cholesterol and lipids
  increases and their cellular levels decline, SCAP in astrocytes acts as a chaperone
  to bind SREBP and facilitate its nuclear translocation, thereby upregulating genes
  involved in cholesterol/lipid synthesis and uptake. Newly synthesized cholesterol
  and lipids are assembled in the endoplasmic reticulum (ER) into ApoE-lipid particles,
  which are internalized by OLs via receptor-mediated endocytosis (e.g., through LRP1)
  to support myelin synthesis and the maintenance of myelin homeostasis. The arrows
  following “cholesterol” and “lipid” indicate: concentration increase'
