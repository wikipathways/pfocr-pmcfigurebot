figure_title: Single-cell RNA sequencing reveals novel cellular heterogeneity in western-diet-fed
  WT/Apoe−/− and LysM-DKO/Apoe−/− mice
caption: 'A) Aortic root sections from WT/Apoe−/− and LysM-DKO/Apoe−/− mice fed a
  Western Diet (WD) for 16 weeks were stained with the macrophage marker CD68 (green)
  and counter stained with DAPI (blue). Brachiocephalic artery (BCA) sections from
  these two groups were stained with Oil Red O. Scale bar: aortic root=500 μm. BCA=500
  μm, Lesion area (outlined by dashed lines) were analyzed by NIH ImageJ software.
  Unpaired t-test was conducted, and data were presented as means±SD, n=6 per group.
  B) UMAP plot depicting 15 distinct cell types, including seven specific VSMC subtypes.
  C) Bar plot representing the proportions of each cell population in WT/Apoe−/− and
  LysM-DKO/Apoe−/− background mice. D) Violin plots showing marker genes used to annotate
  various VSMC subtypes. E) Pathway enrichment analysis demonstrating the functional
  diversity of VSMC subtypes. F) Aortas from WT/Apoe−/− and LysM-DKO/Apoe−/− mice
  were isolated and qRT-PCR was performed to investigate the expression of marker
  genes (n=3) in VSMC sub types. Data are presented as means±SD. Unpaired t-test was
  used to analyze the data. G) The expression of endothelial-enriched (Pecam1, Cdh5)
  and macrophage-specific (Spp1, Lyz2) marker genes in their respective cell types.
  H) Comparison of transcriptomic profiles of genes involved in inflammatory and cytokine
  pathways between WT/Apoe−/− and LysM-DKO/Apoe−/− mice. The mean values are designated
  by a dashed line. I) Bar plot showing qRT-PCR results for the expression of the
  inflammatory marker gene, TNF-α (n = 3) in aortas from WT/Apoe⁻/⁻ and LysM-DKO/Apoe⁻/⁻
  mice. J) Upregulation of macrophage epsins in human atherosclerosis samples. K-L)
  Representative confocal images showing immunofluorescent co-staining of macrophage
  marker (CD68, dashed white line outlined) and smooth muscle cell marker (α-SMA,
  white arrowheads), counterstained with DAPI (blue). Unpaired t-test was conducted
  in Figure L, data from K-L (n=6) are presented as means±SD. Scale bar: k=500 μm.
  M) The Pearson correlation between SCIG identified cell identity gene scores for
  each cell type between WT/Apoe−/− and LysM-DKO/Apoe−/−. Note: P values determined
  by the Wilcoxon test'
