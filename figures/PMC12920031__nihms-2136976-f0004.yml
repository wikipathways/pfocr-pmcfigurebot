figure_title: Cellular metabolic pathways and the regulation of histone Kl-la
caption: Glucose enters the cytoplasm through transmembrane glucose transporters (GLUTs)
  and undergoes glycolysis to produce pyruvate, which can either enter the tricarboxylic
  acid (TCA) cycle in the mitochondria to generate acetyl-CoA or be converted to l-lactate
  by lactate dehydrogenases (LDH). l-lactate can also enter the cell through monocarboxylate
  transporters (MCTs). In the nucleus, GTP-specific succinyl-CoA synthetase (GTPSCS)
  converts l-lactate to l-lactyl-CoA, which is then used by the indicated writers
  to transfer the l-lactyl group to Lys residues of histone proteins. ATP-citrate
  synthase (ACLY) can convert citrate to acetyl-CoA, and acetyl-CoA synthetase 2 (ACSS2)
  can convert acetate to acetyl-CoA; both sources of acetyl-CoA can be used for histone
  Lys acetylation (Kac). Histone Lys l-lactylation (Kl-la) and Kac can be recognized
  by their respective reader proteins to mediate downstream effects. Histone Kl-la
  can be removed by the indicated erasers. CBP, CREB-binding protein; HDAC, histone
  deacetylase; HAT, histone acetyltransferase; KAT, lysine acetyltransferase; SIRT,
  sirtuin
