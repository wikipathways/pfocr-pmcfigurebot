figure_title: Evolutionary strategies for the regeneration of visual opsins
caption: 'A. Visual pigments of invertebrates exist in two stable forms: a dark state
  and a light-activated state. When exposed to light, these pigments undergo a transition
  involving the isomerization of the visual chromophore from the 11-cis to the all-trans
  configuration. The photoproduct can then revert to the original dark state through
  subsequent absorption of a photon of light. B. In the squid eye, a bistable visual
  opsin operates alongside another bistable opsin called retinochrome. Retinochrome
  catalyzes the light-dependent conversion of atRAL back to the 11-cis configuration
  but does not play a role in phototransduction. Additionally, the retinal-binding
  protein RALBP acts as a carrier, transporting retinoids and supporting the regeneration
  of the visual pigment. C. Two distinct mechanisms for visual chromophore regeneration
  in vertebrates. Light-driven re-isomerization is catalyzed by RGR, a protein phylogenetically
  related to the retinochrome found in squid. The alternative mechanism is unique
  to vertebrates and involves an enzymatic, light-independent pathway. This process
  is carried out by a series of specialized enzymes, which operate in RPE cells. Visual
  opsins in the ground state are shown in red, in contrast to their light-activated
  forms, which are shown in yellow. Non-visual opsins (retinochrome and RGR) are depicted
  in green and purple to distinguish their 11cRAL- and atRAL-bound states, respectively.
  Different colors of the light symbol represent various wavelengths of light that
  contribute to retinoid isomerization processes. Created in BioRender (https://BioRender.com/f3x90bj)'
