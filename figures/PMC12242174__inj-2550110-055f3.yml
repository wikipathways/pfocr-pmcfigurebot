figure_title: Proposed clinical pathway for LUTD management using optical modalities.
caption: Proposed clinical pathway for LUTD management using optical modalities. This
  decision tree illustrates how NIRS, OCT, PAI, and fiber-optic sensors can be incorporated
  into standard evaluations of LUTD. Initially, noninvasive functional monitoring
  (e.g., NIRS) may identify detrusor overactivity in patients with symptoms like urgency
  or incontinence. In cases where hematuria or suspicious lesions arise, OCT or PAI
  can be used to visualize superficial or deeper bladder structures, respectively.
  For continuous intravesical pressure tracking—particularly in neurogenic bladder—FOS
  offer higher temporal resolution with semi-invasive placement. LUTD, lower urinary
  tract dysfunction; NIRS, near-infrared spectroscopy; OCT, optical coherence tomography;
  PAI, photoacoustic imaging; FOS, fiber-optic sensors; OAB, overactive bladder
