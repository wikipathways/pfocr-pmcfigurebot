figure_title: 'Trained immunity versus immune tolerance: stimuli, mechanisms, and
  functional outcomes.'
caption: 'Trained immunity versus immune tolerance: stimuli, mechanisms, and functional
  outcomes. Schematic comparison of trained immunity (left) and immune tolerance (right)
  highlighting differences in primary stimuli, cellular targets, molecular mechanisms,
  and functional consequences upon restimulation. Trained immunity is induced by transient
  or moderate inflammatory stimuli such as BCG vaccination, viral infections, or β-glucan,
  primarily through TLR2/4, Nucleotide-binding oligomerization domain-containing protein
  2 (NOD2), and Dectin-1 signaling. It involves both central reprogramming of HSCs,
  leading to myeloid bias and long-term imprinting, and peripheral reprogramming of
  mature innate immune cells, resulting in enhanced responsiveness and tissue-adapted
  memory. These processes are supported by epigenetic changes associated with open
  chromatin (e.g., increased H3K4me3 and H3K27ac), metabolic rewiring toward glycolysis
  and the mTOR/HIF-1α and mevalonate pathways, and poised cytokine loci that enable
  rapid transcription. Functionally, trained immunity leads to faster and stronger
  cytokine responses, improved pathogen control, and broad, nonspecific protection,
  but carries the risk of excessive inflammation if dysregulated. Created with Biorender.com'
