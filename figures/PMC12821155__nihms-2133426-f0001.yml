figure_title: Genetic enhancement of autophagy in Becn1F121A/F121A mice (BMut) results
  in reduced inflammation responses, altered microglia functions and immune responses
  in inured spinal cord tissues (SPC) at 3 days post-injury.
caption: Genetic enhancement of autophagy in Becn1F121A/F121A mice (BMut) results
  in reduced inflammation responses, altered microglia functions and immune responses
  in inured spinal cord tissues (SPC) at 3 days post-injury. (A) Gene expression profiles
  from the NanoString Neuroinflammation panel were visualized as z-score heatmaps,
  revealing distinct transcriptomic patterns across the four groups. (B) Partial Least
  Squares Discriminant Analysis (PLS-DA) plot indicated that the two main principal
  components of variation were captured on the x- and y-axis, respectively, showing
  a clear separation of clusters between the Sham (Sh) and SCI groups. (C) A volcano
  graph displayed the differential expressed genes (DEGs) between BMut/SCI and WT/SCI.
  (D) A Heatmap of gene z-scores showed different expression levels of DEGs from (C)
  involved in Autophagy pathway. (E) Box plots of the representative genes indicated
  gene variations among the four groups included in (D). (F-M) Transcriptomic variations
  were displayed as heatmaps and box plots for Inflammatory Signaling (F-G), Microglia
  Function (H-I), Adaptive Immune Response (J-K), and Innate Immune Response (L-M).
  n = 6 mice (Sham) and 5 mice (SCI) each group
article_title: Autophagy activation by the Becn1F121A mutation reprograms neuroinflammation
