figure_title: Integrated Bioinformatics and Proteomics Analysis of RAS-related Genes
  and Pathways in Hypertensive Mice.
caption: 'Integrated Bioinformatics and Proteomics Analysis of RAS-related Genes and
  Pathways in Hypertensive Mice. (A) pHeatmap displaying differential gene expression
  levels in male control (MB), female control (FB), female DOCA-salt hypertensive
  (FD), and male DOCA-salt hypertensive (MD) groups. Gene expression intensity is
  indicated by the color gradient (blue: lower expression, red: higher expression).
  (B) cNetplot illustrating gene-pathway interactions among identified key genes.
  Node size corresponds to the significance of gene involvement, while colored lines
  depict distinct pathways, emphasizing central genes within multiple pathways. (C)
  Correlation matrix illustrating Pearson correlations between LNPEP/IRAP, ANPEP,
  and isoforms of 14-3-3 proteins (Ywha(s)). Negative correlations (blue) and positive
  correlations (red) reveal inverse relationships among LNPEP/IRAP, ANPEP, and 14-3-3
  isoforms. (D) Pathway network demonstrating connections among LNPEP/IRAP, ANPEP,
  ACE2, Ywha(s), Nedd4-2, eNOS and associated signaling pathways'
