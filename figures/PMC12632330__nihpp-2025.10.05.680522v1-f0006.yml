figure_title: Host metabolism of aryl amino acids to indole and phenol metabolites
caption: There is a conserved mammalian pathway across all aryl-amino acids where
  host enzymes can transaminate tryptophan, phenylalanine and tyrosine to their respective
  aryl-pyruvate and reduce to aryl-lactate. Additionally, indole-3-acetate, indole-3-carboxylic
  acid, and cinnamic acid are produced by host metabolism in vivo. While benzoic acid
  can also be made through host metabolism, it is still primarily a microbially derived
  metabolites isotope tracing of host metabolic pathways could only account for ~30%
  of benzoic acid production. Bacterial metabolism is required for circulating aryl-propionates,
  indole, phenol, cresol
article_title: Many circulating indole and phenol metabolites are host derived
