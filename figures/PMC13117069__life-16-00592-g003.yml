caption: 'Functional enrichment analysis of differentially expressed genes (adjusted
  p-values < 0.05 and fold enrichments > 1.5) identified in peripheral blood from
  early iPD patients. (A) GO enrichment analysis, significantly enriched biological
  process (BP), cellular component (CC), and molecular function (MF) categories are
  shown. Symbol shapes denote GO classes, as indicated in the legend: circles represent
  BP, triangles rep-resent CC, and squares represent MF. (B) KEGG pathway enrichment
  analysis of the same gene set. The x-axis represents fold enrichment, dot size corresponds
  to gene count per term, and color scale indicates statistical significance (−log10-adjusted
  p-value). Enrichment analyses were performed using multiple testing correction,
  and only significantly enriched terms and pathways (adjusted p-values < 0.05 and
  fold enrichments > 1.5) are displayed. Analyses were performed using the AMP-PD
  discovery cohort (n = 44 participants; 26 iPD patients and 18 controls), with one
  RNA-seq library per individual included after quality filtering'
