figure_title: Activation of the insulin pathway in hepatic cells.
caption: Activation of the insulin pathway in hepatic cells. C9 and Hepa 1-6 cells
  were stimulated with 100 nM insulin for the indicated times. Total cell lysates
  were separated by SDS-PAGE and analyzed by immunoblotting using anti-p-IR-Tyr1158
  (A), anti-p-IRS-1-Tyr628 (B), anti-p-Akt-Ser473 (C), and anti-p-ERK1/2-Thr202/Tyr204
  (D), as described in Materials and Methods. Data represent the mean ± S.E.M. of
  five independent experiments, and the panels below show representative blots. Western
  blots were also probed for total IR, IRS, Akt, ERK, and actin, all showing equal
  loading. Vertical lines represent the S.E.M. values. * p-value ≤ 0.01 vs. basal
  phosphorylation (A–D). C9, clone 9 cells (red circles); H1-6, Hepa 1-6 cells (blue
  squares); B-C9, basal phosphorylation of C9 (red dotted line); B-H1-6, basal phosphorylation
  of H1-6 (blue dotted line)
