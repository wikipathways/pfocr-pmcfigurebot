figure_title: Ubiquitin pathway mutations are frequent and mutually exclusive in AML
caption: Patients with AML with ubiquitin pathway mutations from AML PMP, TCGA, TARGET,
  and Beat AML data sets are represented in an oncoprint. Shown are 149 of 1,727 total
  patients with AML with ubiquitin pathway mutations along with cooccurring somatic
  mutations, representing 11.2% of adult (AML PMP, TCGA, Beat AML) and 4.5% of pediatric
  (TARGET) AMLs. Columns represent individual AML samples, and rows represent individual
  genes. Additional variants not shown are recorded in Supplemental Table 1
