figure_title: Systemic effects of OMVs derived from oral bacteria.
caption: Systemic effects of OMVs derived from oral bacteria. OMVs from oral bacteria
  can diffuse and affect the nervous system, circulatory system, endocrine system,
  and immune system. (A). In the circulatory system, gingipains in P. gingivalis OMVs
  can reduce PECAM-1 on the surface of HMEC-1 cells and increase vascular permeability.
  P. gingivalis OMVs also promote the calcification of VSMCs through the ERK1/2-Runx2
  pathway. (B). In the endocrine system, P. gingivalis OMVs inhibit the AKT/GSK-3β
  pathway and reduce the insulin sensitivity of HepG2 cells through gingipains, leading
  to alterations in glucose metabolism in the liver. (C). In the immune system, A-LPS
  on the surface of P. gingivalis OMVs may participate in PPAD sorting, and increased
  PPAD is potentially associated with the occurrence of RA. (D). In the nervous system,
  P. gingivalis OMVs can lead to neuroinflammation by promoting the expression of
  proinflammatory factors in HMC3 cells, Tau phosphorylation, and NLRP3 inflammasome
  production. OMVs from T. denticola may help form mini-biofilm aggregates. A. actinomycetemcomitans
  OMVs may cross the BBB and promote the expression of the proinflammatory factor
  TNF-α
