figure_title: Stem cell proliferation occurs prior to floral initiation in Asteraceae
  capitula
caption: a-b, Shoot meristem dynamics during inflorescence development in Arabidopsis
  thaliana (raceme) and Helianthus annuus (sunflower; capitulum) with stem cell niche
  in blue. c, Confocal micrographs of H. annuus cv. Ha412HO shoot meristems spanning
  floral transition, meristem expansion and floral initiation; representative of stages
  used for transcriptomics. d, Volcano plots showing differentially expressed (DE)
  genes across pairwise comparisons of sunflower inflorescence development, total
  number of DE genes indicated for each comparison (green = up; red = down). e, Scaled
  expression of genes from clusters 1 and 2 following clustering analysis of DE genes
  (solid line = mean; dotted lines = standard deviation) with total number of genes
  in each cluster and representative CLAVATA pathway genes present indicated. f, Expression
  of CLV3 and WUSb in Lactuca sativa (lettuce) and sunflower meristems during inflorescence
  development (TPM = transcripts per million). g, Confocal micrographs of the GhCLV3pro::NLS-eGFP
  reporter in shoot meristems of Gerbera hybrida across inflorescence development.
  Upper panel shows a top-down view (xy-axis) and lower panel shows representative
  longitudinal sections (z-axis) of each shoot meristem with meristems outlined in
  white. VM = vegetative meristem, TM = transition meristem, IM = inflorescence meristem,
  FM = floral meristem. Scale bars - 100mm (c), 500mm (g)
