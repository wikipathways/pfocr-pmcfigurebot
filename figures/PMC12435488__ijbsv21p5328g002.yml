caption: 'Major pathways of iron metabolism in cells: Extracellular Fe3+ is recognized
  by Tf and TfR1 and transported into the cell, where it is converted from STEAP3
  to Fe2+ within the endosome and transported by DMT1 to the cytoplasm. Extracellular
  Fe3+ can also be converted from Cyt b to Fe2+ and transported into the cell by DMT1
  or ZT. Intracellular Fe2+ and Fe3+ enter the labile iron pool (LIP), and these iron
  ions undergo the Fenton reaction to promote ferroptosis or combine with ferritin.
  Finally, iron ions are expelled from the cell via FPN1'
