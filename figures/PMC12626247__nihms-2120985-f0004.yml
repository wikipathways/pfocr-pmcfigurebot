figure_title: WT p53 suppresses the PI3K pathway in HPV+ HNSCC.
caption: WT p53 suppresses the PI3K pathway in HPV+ HNSCC. (A) Normalized RNA-seq
  read counts (RSEM) for INPP5D in HPV+ TP53-WT and HPV+ TP53-mutant HNSCC tumors.
  (B) Immunoblot analysis of PI3K-p110α and GAPDH in UPCI-SCC-090 cells 48 h post-transfection
  with siRNA targeting p53 (sip53) or a non-targeting control (siCTRL). Quantification
  of p110-α signal is shown relative to GAPDH and siCTRL. (C) Normalized RNA-seq read
  counts (RSEM) for MYC, and CCND1 in HPV+ TP53-WT and HPV+ TP53-mutant HNSCC tumors.
  (D) Viability assay in UM-SCC-47-dCas9 cells with (sgCTRL) or without p53 (sgTP53)
  in the presence of increasing concentrations of Alpelisib (BYL719; 0–20 μM). (E)
  Schematic representation of p53-mediated inhibition of the PI3K–AKT pathway in HPV+
  HNSCC. *p < 0.05, ***p < 0.0005. [Color figure can be viewed at wileyonlinelibrary.com]
