figure_title: Molecular mechanisms of osteogenesis and bone remodeling, through osteoblast
  proliferation and/or inhibition of osteoclast differentiation, or by induction of
  osteoblast formation, respectively.
caption: Molecular mechanisms of osteogenesis and bone remodeling, through osteoblast
  proliferation and/or inhibition of osteoclast differentiation, or by induction of
  osteoblast formation, respectively. CREB3L1, abundantly expressed in osteoblasts,
  interacts with Smad4, which facilitates its translocation to the nucleus, where
  it promotes the expression of the COL1A1 gene, resulting in the production of collagen
  type I α1 chain, essential for collagen formation, the predominant component of
  bone extracellular matrix. CREB3L1 also interacts with HIF-1a, subsequently leading
  to the synergistic upregulation of VEGFA gene expression, which is in turn crucial
  for oxygen and nutrient provision in bone tissue. SLCO2A1, a prostaglandin anion
  transmembrane transporter, facilitates the intracellular transfer of prostaglandins
  (mainly of PGE2) for subsequent metabolism by PGDH, thus regulating their levels
  and preventing accumulation. Prostaglandins are key factors for osteogenesis, mainly
  by stimulating osteoblast activation, while simultaneously inhibiting osteoclast
  development. Their balanced levels, highly reliant on normal SLCO2A1 function, are
  crucial for the maintenance of a normal osteogenesis/bone-remodeling ratio. LRP5
  and LRP6 both act as membrane co-receptors of the Wnt/β-catenin pathway that contribute
  to the enhancement of signal transduction through the binding of Wnt ligands, which
  induces the phosphorylation of their carboxy-terminal ends, followed by the recruitment
  and binding of Axin. This subsequently leads to the disruption of β-catenin’s destruction
  complex and therefore its nucleic and cytoplasmic accumulation, thus facilitating
  the enhanced transcription of Wnt/β-catenin downstream target-genes. Finally, the
  SFRP4 glycoprotein negatively regulates osteogenesis through the inhibition of both
  osteoblast proliferation and differentiation, as well as the simultaneous induction
  of osteoclast differentiation through the inhibition of Wnt signaling
