caption: Development of a nomogram and functional pathway analysis based on the risk
  model. (a) Univariate Cox regression analysis of the clinical factors. (b) Multivariate
  Cox regression analysis of the independent prognostic factors. (c) Nomogram for
  predicting 1-, 2-, and 3-year OS probability. Each variable corresponds to a scale-marked
  line segment reflecting its value range; the length of the segment reflects the
  contribution of each factor to the outcome. “Points” indicate the single score for
  each variable value. “Total Points” represents the sum of the individual scores
  for all variables. *** p < 0.001. (d) Calibration curve of the nomogram. (e) GSEA
  of the significantly enriched pathways between the HRG and LRG. (f) GSVA showing
  differentially enriched pathways between the HRG and LRG
