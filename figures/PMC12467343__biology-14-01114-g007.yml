figure_title: MsA regulates the PI3K/AKT/GSK3β/CREB signaling pathway and reduces
  tau phosphorylation in N2a/APP695swe cells.
caption: MsA regulates the PI3K/AKT/GSK3β/CREB signaling pathway and reduces tau phosphorylation
  in N2a/APP695swe cells. (A) Representative Western blot images (Supplementary Material
  Section S2.1) displaying the expression levels of phosphorylated PI3K (p-PI3K),
  total PI3K, phosphorylated AKT (p-AKT Ser473), total AKT, phosphorylated CREB (p-CREB),
  total CREB, phosphorylated GSK3β (p-GSK3β Ser9), total GSK3β, and phosphorylated
  Tau (p- Tau Ser404) in N2a/APP695swe cells treated with different concentrations
  of MsA (10, 25, 50 μM). GAPDH and tubulin served as loading controls. (B–F) Quantification
  of protein phosphorylation levels of p-PI3K/PI3K (B), p-AKT/AKT (C), p-CREB/CREB
  (D), p-GSK3β/GSK3β (E), and p-Tau/GAPDH (F). Data are presented as mean ± SEM (n
  = 3) (Supplementary Material Section S2.2). * p < 0.05, ** p < 0.01 vs. control
  group. ns, no significance
