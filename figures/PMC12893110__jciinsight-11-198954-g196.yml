figure_title: SSc fibroblasts demonstrate major transcriptomic activation in growth
  factor response and downstream mediators
caption: '(A) Multimodal UMAP clustering identifies 10 distinct fibroblast subclusters.
  (B) UMAP demonstrating the broad distribution of SSc and HC nuclei in subsets of
  fibroblasts. (C) The proportion of each fibroblast cluster per patient in SSc and
  HC samples. Fibroblast clusters of 0, 7, and 9 are significantly enriched in SSc
  skin (2-tailed t test: **adjusted P value ≤ 0.01, *adjusted P value ≤ 0.05). (D)
  Two of the most differentially expressed RNA transcripts from each fibroblast subset.
  (E) UMAP with gene expression density for SFRP2, COLA81, CCL19, and COCH enriched
  across fibroblast subclusters for fibroblasts 6, 7, 2, and 4, respectively. (F)
  Variance-adjusted Mahalanobis (VAM) analysis reveals a global and significant enrichment
  of specific hallmark pathways, including epithelial-mesenchymal transition, TGF-β
  signaling, and PI3K Hallmark pathway in SSc compared with HC fibroblasts (Wilcoxon’s
  rank-sum test, all adjusted P ≤ 0.01). (G) GSVA of the pseudo-bulked fibroblasts
  shows significant differential variation in ECM interactions and FGF response and
  signaling in the SSc samples (Wilcoxon’s rank-sum test, all P values ≤ 0.05). (H)
  Volcano plot shows the inferred transcription activity in all SSc or HC fibroblasts
  (adjusted P values by Wilcoxon’s rank-sum test). (I) The top most enriched transcription
  factors by activity for each fibroblast subcluster for both SSc and HC samples'
article_title: Multimodal analyses of early, untreated systemic sclerosis skin identify
  a proinflammatory vascular niche of macrophage-fibroblast signaling
