figure_title: EA modulates HIRI via the Esr1/TAK1-JNK/p38 axis.
caption: EA modulates HIRI via the Esr1/TAK1-JNK/p38 axis. (A) MPO activity in liver
  tissues. (B) Serum levels of TNF-α, IL-1β, and IL-6 measured by ELISA. (C) Immunofluorescence
  staining of CD68+ macrophages and GR-1+ neutrophils. (D) Western blot analysis of
  of p-TAK1, p-JNK, p-p38, Nrf2, HO-1, and NQO1 in liver tissues from Sham, HIRI + oe-NC,
  HIRI + EA + oe-NC, and HIRI + EA + oe-Esr1 groups. (E) Western blot analysis of
  TAK1–JNK/p38 signaling pathway-related proteins and Nrf2, HO-1, and NQO1 levels
  in HIRI + EA + oe-Esr1 rats treated with DMSO or TAK1 inhibitor 5 Z-7-ox. (F) Serum
  ALT and AST levels in each group. (G) H&E staining was used to detect the necrotic
  areas of the liver and Suzuki's score was used to evaluate liver injury severity
  in each group (scale bar = 25 μm). (H) TUNEL staining was used to detect cell apoptosis
  in liver tissues of rats in each group. (I) Immunohistochemical staining for c-CASPASE-3
  expression in liver tissues (scale bar = 25 μm). (J) Western blot analysis of Bcl2,
  Bax, and the c-CASPASE-3/CASPASE-3 ratio. (K) MPO activity measured in liver tissues.
  (L) LISA assessment of serum TNF-α, IL-1β, and IL-6 levels. (M) Immunofluorescence
  staining of CD68+ macrophages and GR-1+ neutrophils in liver tissues. (N) Co-immunoprecipitation
  (CO-IP) analysis to detect the interaction between ESR1 and TAK1. ⁣∗p  < 0.05 among
  groups, analyzed by one-way ANOVA followed by Tukey's post hoc test. Each group
  comprised eight rats
