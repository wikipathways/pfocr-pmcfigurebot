figure_title: Cynarin suppresses osteoclastogenesis and inflammation via the MAPK
  and Nrf2-Keap1 pathways in inflammatory bone resorption.
caption: Cynarin suppresses osteoclastogenesis and inflammation via the MAPK and Nrf2-Keap1
  pathways in inflammatory bone resorption. (A) Representative images of calvarial
  histology stained with Nrf2 and Keap1 (magnification, ×40, first row; ×200, second
  row; ×40, third row). (B) Representative images of calvarial histology stained with
  p-ERK1/2, p-JNK1/2 and p-P38 (magnification, ×100). (C) Quantitative analysis of
  the expression of Nrf2 and Keap1 in the immunofluorescence staining. (D) Quantitative
  analysis of the expression of p-ERK1/2, p-JNK1/2 and p-P38 in the immunohistochemical
  staining. All experiments were performed with three independent biological replicates
  (n=3). The data are presented as the mean ± SD. *P<0.05, **P<0.01 and ****P<0.0001.
  p-, phosphorylated; Cy-M, medium-dose cynarin; LPS, lipopolysaccharide; Alen, alendronate
