figure_title: The sporadic Alzheimer’s disease (sAD2.1) iPSC line-derived neurons
  (iPSNs) show significantly altered gene expression profile with increased OTULIN
  long non-coding RNA (OTULIN IncRNA) levels
caption: (A) A comparative bulk RNA sequence analysis of sAD2.1 vs WTC11 iPSNs shows
  upregulation of 2,390 genes and downregulation of 2,124 genes were differentially
  expressed in sAD2.1 iPSNs. (B) The volcano plot of differentially expressed genes
  in sAD2.1 iPSNs represents the log2 of fold change with a q value of <0.05 as significant
  cutoff. On the plot, blue, red and gray dots indicate the levels of gene expression
  were downregulated, upregulated and no changes, respectively. (C) sAD2.1 iPSNs shows
  altered RNA metabolism as reflected in the number of differentially expressed transcripts,
  with an upregulation of 3,828 transcripts and downregulation of 1,852 transcripts
  as compared to WTC11 iPSNs. (D) sAD2.1 iPSNs shows significant downregulation of
  OTULIN lncRNA (OTULIN-DT), which is inversely correlated with slightly upregulated
  OTULIN gene expression, which may exacerbate tau pathology. The MAPT gene expression
  may be slightly downregulated in contrast to either upregulated MAPT-AS1 or downregulated
  MAPT-IT1, which may initially function as a defense mechanism to prevent tau pathology
  progression in sAD2.1 iPSNs. (E, F) The Gene Set Enrichment Analyses (GSEA) pathways
  showing enrichment of signaling pathways relevant to tauopathy and Alzheimer’s disease.
  (G) Heatmap analysis of differentially expressed genes in sAD2.1 (sAD_1,2,3) vs
  WTC11 (WTCII_1,2,3) iPSNs with three numbers from each group of cells. Heatmap intensity
  in color codes indicates upregulated (orange to red) and downregulated (blue) gene
  expression, respectively. Notably, the melanoma antigen gene (MAGE) family members
  (MAGE-A2/A2B/H1), which are known to enhance ubiquitin ligase activity, are significantly
  downregulated in sAD2.1 compared to WTC11 iPSNs
article_title: The deubiquitinase OTULIN regulates tau expression and RNA metabolism
  in neurons
