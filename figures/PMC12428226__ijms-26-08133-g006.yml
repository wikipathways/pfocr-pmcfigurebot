figure_title: Relative expression of SUMOylation pathway genes during the somatic
  embryogenesis induction phase in leaf explants of Medicago truncatula non-embryogenic
  (M9) and embryogenic (M9-10a) lines.
caption: 'Relative expression of SUMOylation pathway genes during the somatic embryogenesis
  induction phase in leaf explants of Medicago truncatula non-embryogenic (M9) and
  embryogenic (M9-10a) lines. Gene expression was normalized to ACTIN2 and presented
  as fold change relative to the M9 line (set as 1) at each time point. Bars represent
  mean values ± standard deviation (SD) of three independent biological replicates,
  each with three technical replicates. Statistical significance between M9 and M9-10a
  at each time point was determined using Student’s t-test. Asterisks indicate significance
  levels: * p  <  0.05, ** p  <  0.01, *** p  <  0.001, **** p  <  0.0001'
