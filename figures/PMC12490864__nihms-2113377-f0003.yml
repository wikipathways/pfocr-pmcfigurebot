figure_title: Mechanical forces influence the activity of RBPs
caption: (A) In healthy cardiomyocytes, HNRNPC localizes to the nucleus where it promotes
  skipping of YAP1 exon 4 (left). During heart failure, the ECM undergoes remodeling,
  and as a result, HNRNPC shuttles to the sarcomere, where it functions in local translation.
  Because there is less nuclear HNRNPC, YAP1 exon 4 inclusion is increased. When exon
  4 is included, YAP1 readily activates TEAD transcription factors, which drive the
  transcription of Hippo pathway targets (right). This illustration is based on work
  published in Martino et al.66(B) The transcription factor TEAD4 is alternatively
  spliced at exon 3. When exon 3 is included, the full-length TEAD4 (TEAD4-FL) is
  produced. TEAD4-FL contains the DNA-binding domain and YAP1-interacting motif. TEAD4-FL
  can bind YAP1 and drive transcription of Hippo-YAP1 targets. In cancer, the inclusion
  of TEAD4 exon 3 is associated with tumor cell proliferation and metastasis (bottom
  left). The RBP RBM4 binds a CGGCCGG motif within TEAD4 exon 3 and induces its skipping,
  which results in the production of a short TEAD4 protein isoform (TEAD4-S). Since
  exon 3 encodes the DNA-binding domain of TEAD4, TEAD4-S protein does not have a
  DNA-binding domain but retains the YAP1-interacting motif. Thus, TEAD4-S isoforms
  compete with TEAD4-FL for YAP1 binding. When YAP1 binds TEAD4-S, transcription is
  not activated, and there is an attenuation of transcription of Hippo-YAP1 targets.
  As a result, cancer cells expressing high levels of RBM4 exhibit reduced cell proliferation,
  migration, and apoptosis, and consequently, patients with higher levels of RBM4
  have improved chances of cancer survival (right). This illustration is based on
  results published in Qi et al.69(C) RBFOX1 is upregulated during postnatal heart
  development and is downregulated in pathological cardiac hypertrophy. Mice overexpressing
  RBFOX1 present reduced progression of pathological cardiac hypertrophy due to RBFOX1
  regulation of alternative splicing. This illustration is based on findings from
  Gao et al.70(D) RBFOX1 regulates alternative splicing of the pre-mRNAs of two focal
  adhesion proteins, paxillin (PXN) and vinculin (VCL). When RBFOX1 is depleted, Pxn
  exon 6 and Vcl exon 19 are skipped, generating PXN and VCL proteins (left), whereas
  when RBFOX1 is overexpressed, Pxn exon 6 and Vcl exon 19 are included via RBFOX1
  binding to a (U)GGAUG motif in the intron downstream of these alternative exons.
  These alternative splicing events result in the production of extended PXN (ePXN)
  and metavinculin (MVCL) proteins (right).(E) In cultured H9C2 embryonic cardiomyocytes,
  the abundance of RBFOX1 regulates cellular morphology, gene expression, and actin
  cytoskeleton. When RBFOX1 is depleted (left), differentiated cardiomyocytes were
  more frequently mononuclear when compared to cells expressing endogenous RBFOX1,
  which became more often multinucleated after differentiation (middle). Moreover,
  differentiated RBFOX1-depleted cells exhibited reduced expression of myocyte differentiation
  markers such as myoblast determination protein 1 (MyoD) and cardiac troponin T (Tnnt2).
  MVcl and ePxn expression was also downregulated at the mRNA level in RBFOX1-depleted
  cardiomyocytes when compared to differentiating cells with normal RBFOX1 levels.
  RBFOX1 overexpressing cells (right) were overall more elongated, and VCL was increasingly
  localized to the plasma membrane (PM) when compared to wild-type cardiomyocytes
  (middle). Moreover, RBFOX1 overexpressing cells contained notably shortened actin
  filaments and actin rings when compared to wild-type.The illustrations in (D) and
  (E) are based on Zorn et al.71
