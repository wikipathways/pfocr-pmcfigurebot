figure_title: Suppression of LPS-induced inflammatory responses by Chamaecyparis obtusa-derived
  samples (COD, COE, and CPE-1) via MAPK pathway modulation in RAW 264.
caption: 'Suppression of LPS-induced inflammatory responses by Chamaecyparis obtusa-derived
  samples (COD, COE, and CPE-1) via MAPK pathway modulation in RAW 264.7 macrophages.
  (A–C) Western blot analysis of phosphorylated ERK (p-ERK) and corresponding quantitative
  densitometry in LPS-stimulated RAW 264.7 cells treated with various concentrations
  of COD (A), COE (B), or CPE-1 (C). Suppression of LPS-induced inflammatory responses
  by Chamaecyparis obtusa-derived samples (COD, COE, and CPE-1) via MAPK pathway modulation
  in RAW 264.7 macrophages. (D–F) Western blot analysis of phosphorylated JNK (p-JNK)
  and corresponding densitometric analysis in LPS-stimulated cells treated with increasing
  concentrations of COD (D), COE (E), or CPE-1 (F). β-Actin was used as an internal
  loading control. Bar graphs represent the relative protein expression normalised
  to β-actin, expressed as the mean ± SD of three independent experiments. ### p <
  0.001, # p < 0.05 versus control (Con); *** p < 0.001, ** p < 0.01, * p < 0.05 versus
  LPS-treated group (NC). C: control group (untreated); NC: negative control (LPS-stimulated
  without extract treatment); treated groups received LPS and indicated doses of extract'
