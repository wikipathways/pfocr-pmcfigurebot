figure_title: IL-6 and sIL-6Rα concentrations over 24 h with signaling pathway blockade
caption: Primary human PTECs cultured on Transwells were treated for 48 h (media replaced
  every 24 h) with 1 ng/mL IL-6, 1 ng/mL IL-6 + 100 ng/mL sIL 6Rα + the inhibitor
  cocktail, 100 ng/mL sIL-6Rα, or 100 ng/mL sIL-6Rα + the inhibitor cocktail. IL-6
  and the inhibitor cocktail were added to both Transwells chambers, while sIL-6Rα
  was only added basally. Apical and basal media were sampled at the time of addition
  (“Initial”) and after 24 h, and the concentrations of (A) IL-6 and (B) sIL-6Rα were
  measured by ELISA. In groups without exogenous IL-6, the inhibitor cocktail reduced
  endogenous IL-6 to near background. Addition of sIL-6Rα did not further lower IL-6
  concentration when the effect of the inhibitor cocktail was accounted for, indicating
  substantial free IL-6 at steady state. sIL-6Rα significantly declined over 24 h
  across conditions, consistent with complex formation and receptor-mediated consumption/turnover.
  The inhibitor cocktail did not meaningfully alter the concentrations of sIL-6Rα
  over 24 hours, despite lowering the production of endogenous IL-6. Bars show mean
  ± SD of three donors (denoted by points, each quantified in technical triplicate).
  Statistical significance (*p≤0.05, **p<0.01, ****p <0.0001) was assessed using repeated-measures
  one-way ANOVA with Šídák’s multiple comparisons correction between pre-selected
  pairs (i.e., 0 h vs. 24 h, apical vs basal)
