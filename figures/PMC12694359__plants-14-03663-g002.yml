figure_title: Transcriptomic features and metabolic responses associated with pruning
  treatments.
caption: Transcriptomic features and metabolic responses associated with pruning treatments.
  (a) Protein–protein interaction (PPI) network of 192 transcription factors identified
  from homologous differentially expressed genes (DEGs) in Arabidopsis under high-confidence
  criteria. The network was generated based on STRING analysis, highlighting transcription
  factor groups related to TCP (green), light signaling (red), and hormone responsive
  (blue). (b) MapMan metabolic overview of DEGs related to primary and secondary metabolic
  pathways under hand pruning (left) and mechanical pruning (right) at 168 h after
  pruning. Red and blue colors indicate upregulation and downregulation, respectively.
  (c,d) Heatmaps of selected genes involved in (c) photosynthesis and flavonoid biosynthesis,
  and (d) hormone metabolism and signaling (GA, ABA, and JA). Differential expression
  patterns across pruning treatments and time points are displayed for each category
