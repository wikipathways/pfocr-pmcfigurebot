figure_title: Decoding antigenic dark matter in PDAC.
caption: Decoding antigenic dark matter in PDAC. (a) Composition and detectability
  of the PDAC immunopeptidome. PTM-bearing peptides (orange) constitute the predominant
  fraction, whereas mutation-derived neoantigens represent a smaller subset (purple).
  This PTM-rich space is systematically under-recovered by (i) acquisition methods
  that strip labile groups (CID), (ii) analysis biases (search/ML models trained on
  unmodified peptides; restricted variable-mod settings), and (iii) immunological
  tolerance to self-like PTM epitopes together yielding the illusion of low immunogenicity.
  Electron-based fragmentation (ETD, EThcD, AI-ETD) preserves fragile modifications
  and improves detection and site localization. (b) Gated decoding pipeline from discovery
  to translation. PDAC tissue/PDOs → HLA pulldown → PTM-compatible MS → PTM-aware
  search → Gate 1 applies standard QC (≤ 1% FDR, site localization ≥ 0.75, replicate
  support, PTM-aware search/rescoring) → Gate 2 retains peptides meeting HLA-binding
  rank thresholds (Class I ≤ 2%, Class II ≤ 10%), favorable presentation/processing
  scores, and tumor-restricted expression, with surrogate PTM encodings documented
  where predictors lack native support. Candidates passing both gates are routed via
  a Translation Hub to (i) enzyme/pathway inhibitors (PAD4, OGT, ST6GAL1; often combined
  with ICI/CD73/LOX), (ii) PTM-neoepitope vaccines (e.g., MUC1-STn, citrullinated
  peptides), or (iii) cellular therapies (PTM-reactive TCRs/ACT)
