figure_title: Circadian reprogramming in late adulthood
caption: 'a, Time of death (TOD) information for subjects used in the rhythmicity
  analysis. Each dot is an individual’s TOD in zeitgeiber time (ZT). For full 24 h
  coverage, Young and Middle adulthood groups were combined (YA+MA; 21 – 60 years),
  and then compared to the Late adulthood (LA; ≥ 61 years) group. b, Genes identified
  as rhythmic (FDR < 0.05). c, Number of genes identified as rhythmic (p < 0.01) for
  YA+MA, LA or Both groups. Rhythmic genes with significantly different R2 values
  (p < 0.01) are denoted as dark red or black. d, Peak expression times for all rhythmic
  genes. e,f, Example rhythms for ARNTL (e) and PER3 (f), two canonical molecular
  clock genes, in EN, IN, and glia, including microglia, astrocytes, oligodendrocytes
  and OPC subclasses. Solid lines are the calculated 24 h oscillation, transparent
  area is the 95% confidence interval. Individual plots are available in Supplementary
  Fig. 27–28. g,h, Rhythmicity and timing of genes associated with the circadian molecular
  clock in YA+MA (g) and LA (h). Represented pathways include the forward limb (FWD
  limb), the primary PER/CRY regulatory arm (R1), the secondary D-Box regulatory arm
  (R2), the secondary ROR/NR1D regulatory arm (R3), the BHLHE40/41 feedback loop (FB),
  and modifiers of the R1 arm. (R1 mod). i, Important pathways identified by enrichR.
  # represents FDR < 0.05'
