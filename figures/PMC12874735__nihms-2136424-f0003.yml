figure_title: Pathway enrichment and functional annotation of blood pressure regulatory
  genes.
caption: Pathway enrichment and functional annotation of blood pressure regulatory
  genes. (A) Pie chart representing the distribution of genes across different blood
  pressure regulatory categories. Each slice indicates the percentage of genes involved
  in specific functions, with the largest proportion (48.34 %) participating in 0–10
  % of categorized regulatory roles. (B) Bar plot showing gene ontology (GO) enrichment
  analysis of genes involved in blood pressure regulation. The x-axis displays GO
  terms related to blood pressure regulation, while the y-axis shows the number of
  genes associated with each term. Bars are color-coded by gene count. (C) Dot plots
  representing the KEGG pathway enrichment analysis of differentially expressed genes
  in male (MD vs. MB, top panel) and female (FD vs. FB, bottom panel) DOCA-salt hypertensive
  models compared to their respective controls. The x-axis represents the −log10(p-value),
  indicating pathway enrichment significance. Dot size reflects gene count per pathway,
  and color scale corresponds to enrichment scores. Pathways associated with the RAS
  and its related pathways are prominently enriched in both sexes
