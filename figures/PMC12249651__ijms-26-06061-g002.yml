figure_title: The Link Between Dietary Timing and Exercise Performance Through Adipocyte
  AMPKα2 Signaling
caption: '(A). Systemic regulation of muscle clock genes by adipocyte AMPKα2 signaling.
  Activation of adipocyte AMPKα2 by upstream signals (e.g., exercise, hormones, nutrient
  deprivation) enhances fatty acid oxidation and suppresses lipogenesis, leading to
  altered secretion of metabolites such as lactate and succinate. These circulating
  metabolites act on skeletal muscle, modulating clock gene expression (e.g., Bmal1,
  Per2, Cry1) and shifting metabolic rhythms, contraction efficiency, and energy production
  timing. This pathway illustrates the role of adipocyte-derived time-sensitive metabolic
  signals in synchronizing muscle circadian functions, particularly under day-restricted
  feeding conditions. (B). Intracellular mechanisms linking circulating metabolites
  to clock gene activation in skeletal muscle. Schematic illustration shows how day-restricted
  feeding (DRF) activates adipocyte AMPKα2, leading to the secretion of metabolic
  intermediates that regulate muscle clock genes. Cytoplasm: Circulating lactate enters
  muscle cells via MCT1 transporter and is converted to acetyl-CoA. Succinate binds
  to SUCNR1 receptor, activating a signaling cascade that phosphorylates CREB. Acyl-CoA
  species are transported into cells via multiple transporters, altering cellular
  acetyl-CoA availability. Nucleus: At the Bmal1 promoter, CLOCK/BMAL1 complex utilizes
  acetyl-CoA (primarily from lactate) and short-chain acyl-CoA to enhance histone
  acetylation and transcriptional activity, with CREB-P providing additional support.
  At the Per2 promoter, CLOCK/BMAL1 and CREB-P (primarily from succinate signaling)
  synergistically enhance transcription, supported by short-chain acyl-CoA availability.
  This metabolite-mediated inter-tissue communication ensures coordinated circadian
  gene expression between adipose tissue and skeletal muscle. Abbreviations: ↑, increased;
  ↓, decreased; →, signaling direction or effect (multiple arrows indicate greater
  magnitude of effect)'
