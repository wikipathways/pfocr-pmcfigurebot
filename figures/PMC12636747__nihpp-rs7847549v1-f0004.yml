caption: 'A) Top 50 pEVs proteins highly correlated with CSF Aβ42 levels. The color
  scale represents the degree of correlation (Pearson r) and the size of the dots
  the statistical significance (p value). Proteins labelled in red and blue belongs
  to the inflammation and neurology panels respectively. B) Venn diagram of CSF Aβ42,
  CSF pTau, Qalb and MMSE significant associations with complete set of Olink Explore
  pEVs proteins (n=662). C)Top ten identified enriched molecular pathways in pEVs
  protein using the Panther tool. Statistical significance was set at p value < 0.05.
  D) Variance explained (%) by PCs 1–5. E) Multiple linear regression correlation
  analysis. Variables included in the model: demographic, clinical, and CSF biomarkers'
