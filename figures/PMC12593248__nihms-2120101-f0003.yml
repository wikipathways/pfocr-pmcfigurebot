figure_title: IGF2BP3 supports one-carbon metabolism pathways that serve as methyl
  donors
caption: (A) Heatmap depicting significantly altered metabolites from control versus
  IGF2BP3-depleted SEM cells, as indicated, using targeted analysis of polar central
  carbon metabolites by LC/MS. Shown are metabolites with a consistent change in both
  IGF2BP3-depleted lines, I3sg2 (purple) and I3sg5 (sky blue), with their respective
  p value significance; n = 3.(B) Schematic of metabolites that are produced in one-carbon
  metabolism. Metabolites reduced after IGF2BP3 depletion are marked in pink.(C–J)
  Intracellular abundance and steady-state incorporation of carbon from 13C-labeled
  glucose, measured as mole percent enrichment (MPE), into one-carbon pathway metabolites
  serine, glycine, S-adenosyl-methionine (SAM), and glutathione (GSH) in control versus
  IGF2BP3-deleted SEM cells.All data are n = 3 replicates represented as mean ± standard
  deviation (SD), compared by two-sided unpaired t test; *p < 0.05, **p < 0.01, and
  ***p < 0.001. All experiments were repeated at least twice for consistency. Refer
  also to Figure S2
