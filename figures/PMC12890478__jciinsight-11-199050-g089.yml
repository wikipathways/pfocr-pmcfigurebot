figure_title: Signaling pathway activity inference in immune cells from healthy donors
  and patients with latent autoimmune diabetes mellitus and type 1 diabetes
caption: '(A) Scheme of differential gene expression analysis and pathway activity
  inference. (B–D) Volcano plots of differentially expressed genes in cell subtypes
  between patients with type 1 diabetes (T1D) and healthy donors (B), patients with
  latent autoimmune diabetes mellitus (LADA) and patients with T1D (C), and patients
  with LADA and healthy donors (D). Wald’s test with Benjamini-Hochberg P value correction.
  Thresholds in plots: log2 fold change > 0.25, P adjusted < 0.05. (E–G) Bar plots
  of differentially activated signaling pathways in cells between patients with T1D
  and healthy donors (E), patients with LADA and healthy donors (F), patients with
  LADA and patients with T1D (G). Student’s t test (2 tailed) with Benjamini-Hochberg
  P value correction. *P < 0.05, **P < 0.01, ***P < 0.001'
