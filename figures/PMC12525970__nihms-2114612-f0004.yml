figure_title: Distinct factors that control tumor development
caption: (A) It is well-established that oncogenic mutations can drive tumor development
  in only a subset of permissive cells. It has recently been shown that those cells
  where the oncogenic event elicits the shortest cell cycle length is associated with
  the permissive state. A number of interventions that lengthen the cell cycle transit
  time were shown to suppress tumor development. (B) Oncogenic events represent an
  intrinsic cellular stress that can lead to the upregulation of the endogenous CDK4/6
  inhibitor p16INK4A. This event can drive senescence and p16INK4A must be downregulated
  for tumor development, as is seen in most tumors driven through the KRAS-BRAF signaling
  pathway. In contrast, CCNE1 amplification or RB deficiency yield a cell cycle that
  does not require CDK4/6. Thus, the tumors retain p16INK4A
