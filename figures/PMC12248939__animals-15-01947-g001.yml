figure_title: Serum and liver biochemical indicators and gene expression analysis
  under different arginine/lysine ratios.
caption: 'Serum and liver biochemical indicators and gene expression analysis under
  different arginine/lysine ratios. (A–C): Analysis of enzymatic activities of T-NOS,
  AST, and ALT in the serum of juvenile largemouth bass; (D): analysis of arginase
  activity in the liver of juvenile largemouth bass; (E–I): analysis of antioxidant-related
  indicators in the liver, including (E): MDA, (F): T-AOC, (G): SOD, (H): GSH, and
  (I): CAT; (J) heatmap of gene expression analysis related to the Keap1-Nrf2 pathway,
  antioxidant activity, and glutathione metabolism. Data are presented as mean ± standard
  deviation (SD) and were analyzed using one-way ANOVA. Different letters indicate
  statistically significant differences (p < 0.05) among groups'
