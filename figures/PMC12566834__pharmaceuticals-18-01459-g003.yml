caption: 'This figure summarizes the molecular mechanisms influenced by Ivermectin
  across several cancer models. Each stacked bar represents the number and type of
  pathways affected in a given cancer type, with colors corresponding to specific
  molecular targets: mitochondrial pathway (light blue), NF-κB (cyan), Bax/Bcl-2 (blue),
  caspases (dark blue), ROS (purple), importin β (KPNB1, light green), PAK1 (green),
  ATP/P2X4/P2X7 (yellow-green), gasdermin D (GSDMD, orange), and MDSC/Tregs (red).
  Esophageal squamous carcinoma and colorectal carcinoma show modulation of five distinct
  pathways, suggesting a broad mechanism of action. In contrast, ovarian cancer, murine
  triple-negative breast cancer (TNBC), and metastatic melanoma involve fewer pathways,
  but still reflect targeted effects relevant to apoptosis, immune regulation, and
  tumor progression. This visualization highlights the pleiotropic and context-dependent
  actions of Ivermectin, supporting its potential role as a multi-target anticancer
  agent'
