figure_title: Schematic overview of SLPI-mediated pathways in osteoarthritis.
caption: Schematic overview of SLPI-mediated pathways in osteoarthritis. The figure
  summarizes the protective mechanisms of Secretory Leukocyte Protease Inhibitor (SLPI)
  in the pathogenesis of osteoarthritis (OA). SLPI inhibits serine proteases, such
  as neutrophil elastase, cathepsin G, and trypsin, thereby preserving extracellular
  matrix (ECM) integrity and preventing cartilage degradation. It suppresses the nuclear
  factor kappa B (NF-κB) signaling pathway, reducing the expression of pro-inflammatory
  cytokines, including IL-1β, IL-6, and TNF-α, which limits synovial inflammation
  and matrix metalloproteinase (MMP) activity. SLPI also exerts chondroprotective
  effects by inhibiting caspase-mediated apoptosis, promoting autophagy, and upregulating
  anti-apoptotic proteins, such as Bcl-2 and Bcl-xL. Furthermore, SLPI modulates immune
  responses by downregulating M1 macrophage activation, enhancing M2 macrophage polarization,
  and regulating T cell responses to maintain joint homeostasis. Collectively, these
  actions slow OA’s progression and preserve joint structure and function. The red
  arrows indicate a decrease and blue arrows indicate an increase. Created in BioRender.
  Kim, W. (2025) https://BioRender.com/6dx8m3w
