figure_title: Collagen Degradation Pathways.
caption: Collagen Degradation Pathways. Collagen can be degraded by extracellular
  and intracellular pathways. Extracellular collagen digestion is performed by a collection
  of matrix metalloproteinases (MMPs) and extracellular cathepsins. MMPs and extracellular
  cathepsins cleave collagen fibrils into collagen fragments, which can be internalized
  and degraded by intracellular pathways. The main intracellular pathways are phagocytosis,
  macropinocytosis, and receptor-mediated endocytosis. (A) Intact collagen fibrils
  are internalized by collagen phagocytosis. Initial cleavage of pericellular collagen
  is performed by membrane-type 1 MMP (MT1-MMP). β1 integrins mediate recognition
  and fibril adhesion. Actin remodeling enables the formation of the phagocytic cup
  to internalize fragments into a phagosome. Phagosomes (pH = 6.0) fuse with an acidic
  lysosome (pH = 4.5) to form a phagolysosome, where collagen fibrils are ultimately
  degraded. (B) Cleaved collagen fragments can be internalized by actin-mediated macropinocytosis.
  Once internalized, collagen fragments are enclosed in a macropinosome (pH = 7.0),
  which is then trafficked to early endosomes and then to lysosomes for degradation.
  (C) Collagen fragments can also be degraded through receptor-mediated endocytosis.
  uPARAP/Endo180 receptors recognize collagen fragments and internalize collagen using
  clathrin-coated pits to form vesicles (pH = 6.5), which are subsequently trafficked
  to the lysosome for degradation. All three of the intracellular collagen degradation
  pathways converge on lysosomes. In these organelles, collagen is degraded by acid-optimized
  cysteine proteases, including cathepsins
