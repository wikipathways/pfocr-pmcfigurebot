figure_title: The mechanisms of resveratrol inhibit amyloid plaque deposition and
  NFTs.
caption: The mechanisms of resveratrol inhibit amyloid plaque deposition and NFTs.
  (1) RSV reduces the production of Aβ and promotes the degradation of Aβ through
  affecting the expression of ADAM10, BACE1, PSEN1 and NEP. (2) RSV reduces and attenuates
  Aβ neurotoxicity by inhibiting the aggregation of Aβ from low molecular weight oligomers
  to high molecular weight oligomers. (3) RSV regulates the permeability of the BBB
  by affecting the levels of LRP-1 and TTR, thereby promoting the transport and clearance
  of Aβ. (4) RSV promotes autophagic degradation of Aβ by activating the SIRT1/LKB1/AMPK/mTORC1/ULK1
  pathway and upregulating proteins associated with the autophagic-lysosomal pathway,
  including NDP52, LAMP2A and GCN2. (5) RSV inhibits tau protein hyperphosphorylation
  through PI3K/AKT/GSK-3β, CaMKII and ERK1/2 pathways. Resveratrol also promotes tau
  dephosphorylation by inhibiting MID1-mediated ubiquitination degradation of PP2A.
  sAPPα/β, soluble amyloid precursor protein α/β; APP, amyloid β precursor protein;
  P3 (Aβ17-40/42), APP non-amyloidogenic fragment p3 (Aβ17-40/42); PSEN1, presenilin
  1; ADAM10, a disintegrin and metalloproteinase domain-containing protein 10; BACE1,
  β-secretase 1; NF-κB, nuclear factor kappa-light-chain-enhancer of activated B Cells;
  SIRT1, sirtuin 1; Nrf2, nuclear factor erythroid 2-related factor 2; NEP, neprilysin;
  ERK1/2, extracellular signal-regulated kinase1/2; NDP52, nuclear dot protein 52
  kDa; LAMP2A, lysosomal-associated membrane protein 2A; LKB1, liver kinase B1; AMPK,
  AMP-activated protein kinase; mTORC1, mechanistic target of rapamycin complex1;
  ULK1, unc-51 like autophagy activating kinase 1; ATP, adenosine triphosphate; ADP,
  adenosine diphosphate; GCN2, general control nonderepressible 2; CaMKII, calmodulin-dependent
  protein kinase II CaMKII; GSK-3β, glycogen synthase kinase-3β; tau, tubulin-associated
  unit; PP2A, protein phosphatase 2A; MID1, midline 1
