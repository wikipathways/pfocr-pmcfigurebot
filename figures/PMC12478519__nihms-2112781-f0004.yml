figure_title: Roles of miRNA-128 in protein misfolding, signaling pathways, and apoptosis.
caption: Roles of miRNA-128 in protein misfolding, signaling pathways, and apoptosis.
  (A) Inhibition of the Wnt/β-catenin signaling pathway by miR-128–3p under stress
  conditions. In Major Depressive Disorder (MDD) patients, miR-128–3p is upregulated
  in the amygdala, leading to the downregulation of key genes involved in the Wnt/β-catenin
  signaling pathway, including DVL1, LEF1, and Wnt5b. This suppression may contribute
  to altered neuronal function and stress-related neuropathology. (B) Protein misfolding
  and neuronal death. Overexpression of miRNA-128, coupled with the downregulation
  of TFEB, leads to the repression of protease activity, impairing protein degradation.
  This results in the accumulation of misfolded proteins, ultimately contributing
  to neuronal death. (C) Regulation of the Wnt/β-catenin signaling pathway. Overexpressed
  miRNA-128, along with AXIN1, acts as a negative regulator of the Wnt/β-catenin signaling
  pathway. This suppression directly inhibits neuronal regeneration and neural plasticity,
  potentially impairing cognitive and functional recovery in neurodegenerative conditions.
  (D) Apoptosis modulation by miRNA-128. miRNA-128 overexpression, combined with AXIN1
  downregulation, leads to increased expression of EAAT4, which in turn reduces caspase-3
  production. This reduction in caspase-3 activity prevents apoptosis, suggesting
  a potential neuroprotective role of miRNA-128 in certain cellular contexts
