caption: The images show histological sections prepared from three neonatal hearts
  from patients with Ebstein’s malformation [47]. All sections are orientated in comparable
  fashion to Figure 7 and Figure 8. (A) Panel A shows dispersion of the nodal cardiomyocytes
  throughout the fibrous atrioventricular insulating tissues, with a strand producing
  a nodoventricular communication. (B) In panel B, there is less dispersion but a
  more obvious nodoventricular pathway. (C) In panel C, there is still less dispersion,
  but the nodoventricular pathway is insulated as it extends into the crest of the
  muscular ventricular septum
