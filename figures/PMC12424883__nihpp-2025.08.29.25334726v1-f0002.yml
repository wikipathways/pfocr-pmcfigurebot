caption: (a) Hazard ratios and 95% confidence intervals for the associations between
  three primary diseases and 18 secondary diseases; only statistically significant
  associations are shown (p < 0.05). (b) Associations between the three primary diseases
  and plasma proteins; most proteins showed positive associations. (c) Number of plasma
  proteins exhibiting significant mediation effects in each primary–secondary disease
  path. (d) Plamsa proteins mediated in the disease development pathway from each
  primary disease to multiple secondary diseases. (e) Dot plot showing the top five
  plasma proteins with the strongest mediation effects in each disease mediation pathway.
  (f) Comparison of mediation effects for proteins that mediated associations from
  all three primary diseases to a single secondary disease
