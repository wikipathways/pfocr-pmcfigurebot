figure_title: PRPS loss leads to an accumulation of newly synthesized histones
caption: (A) Model showing the PRPS1/2 enzymes as key regulators of nucleotide biosynthesis
  (left) and histone deposition pathway from histone biosynthesis with posttranslational
  marks on new histone H3 and H4 (right). (B) PRPS1-HA-FKBP12F36V (dTAG) schematic
  and induction of its proteasomal degradation in response to dTAG13/47. (C) Total
  histone and posttranslational modification marks associated with new histones in
  response to time dependent depletion of PRPS1. (D) Violin plot showing the levels
  of PRPS1-HA-dTAG, total histone H3, H4 and posttranslational modification marks
  associated with new H3 and H4, normalized to loading control from multiple independent
  experiments in response to dTAG13 or 47 treatment for 24 hours. p values were calculated
  using two-way ANOVA. (E-F) Total histones and posttranslational modification marks
  associated with new histones in response to time dependent depletion of PRPS1. (G)
  Experimental workflow to examine newly synthesized proteins. (H) Histone H3 and
  H4 in the pool of newly synthesized protein isolated from cells with or without
  PRPS1 depletion. (I) qPCR showing the mRNA levels of two of each histone H3 and
  H4 genes in HEK293TPRPS1-HA-dTAG cells with or without dTAG47 treatment for 24 hours.
  Data are represented as mean of n=3, with value from each experiment shown in different
  color. Error bars are mean ± SD, and p values were computed from Student’s t test.
  Molecular weight (kDa)
