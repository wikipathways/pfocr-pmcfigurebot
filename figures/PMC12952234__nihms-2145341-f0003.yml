figure_title: Splayed interface mutants likely require monomer collision for WASP-independent
  nucleation
caption: (A) Pathways of WASP-independent nucleation by the Arp2 (A208W) complex mutant
  tested via mathematical modeling. Each pathway also included reactions for spontaneous
  nucleation in the simulation (see Figure S3). The filament nucleus is indicated
  by the dashed box in each pathway. Floated rate constants are in red and fixed or
  constrained rate constants (see main text) are in black.(B) Polymerization time
  courses (dashed lines) of 15 % 2 μM pyrene labeled actin with the indicated concentrations
  of Arp2 (A208W) Arp2/3 complex. Best fits from Model 1 (Arp2-Arp3 dimer nucleus
  model) simulations are shown as solid lines.(C) Polymerization time courses as described
  in (B). Best fits from Model 2 (Arp2-Arp3-actin trimer nucleus model) simulations
  are shown as solid lines.(D) Objective values of the best fits from Model 1–3. The
  objective value is a measure of the model fit calculated from the normalized weighted
  sum of squares (see methods)
