figure_title: PS and DMS direct pathways preferentially modulate SC neurons responsive
  to visual task properties
caption: 'A. Approximated regions of the SC recorded from 6 mice on a standard atlas
  (Franklin and Paxinos, 2008). Transparent bar represents the anterior-posterior
  and medial-lateral location of the recording bundle center, with approximate DV
  range of recorded units relative to the division between superficial (sSC) and deeper
  (dSC) layers (solid bar). Filled circles indicate location of electrolytic lesioned
  wire tips, color-coded per mouse. B. Distribution of recorded single units across
  the SC relative to the estimated division of sSC and dSC layers (n = 530 units;
  N = 6 mice). C. Left: PSTHs of sSC single unit responses to the spatially cued orientation
  change task stimuli (n = 88). Right: PSTHs of dSC single unit responses with time
  windows for quantifying task-related activity (n = 442). D. Percentages of sSC (light
  gray) and dSC (dark gray) units that exhibited task-related activity. Chi-square
  tests (D). Error bars represent s.e.m. (C) or 95% CI (D). Scale bar = 500 um. Abbreviations:
  D (dorsal), L (lateral)'
article_title: A distinct circuit for biasing visual perceptual decisions and modulating
  superior colliculus activity through the mouse posterior striatum
