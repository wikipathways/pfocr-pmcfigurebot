figure_title: Diagram of the KEGG phytohormone signaling pathway under salt stress
  in which the CsGRAS15 and CsGRAS27 genes act.
caption: Diagram of the KEGG phytohormone signaling pathway under salt stress in which
  the CsGRAS15 and CsGRAS27 genes act. Under salt stress, sodium ions penetrate the
  cell membrane to reach the nucleus, promoting diterpenoid biosynthesis and thereby
  directing the binding of GA molecules to the receptor GID1, which subsequently enhances
  the affinity of GID1 for the N-terminus of the DELLA protein, triggering a structural
  change in the DELLA protein (i.e., within the blue dashed line), which inhibits
  the overgrowth of the root to acclimatize to and resist salt stress. Under normal
  conditions (i.e., black dashed line), DELLA acts as a negative regulator in the
  GA signaling pathway, inhibiting plant growth and development. Suppose that the
  interaction between the DELLA and the SCF is enhanced. In this case, the DELLA protein
  is ubiquitylated and degraded by the 26S protease complex, which in turn removes
  the inhibitory effect of the DELLA protein, and the plant can ultimately develop
  normally
