figure_title: The glycolytic enzyme phosphoglycerate mutase (PGAM) suppresses Th17
  cell pathogenicity
caption: '(A) Left: Metabolic reactions were ordered by the Spearman correlation of
  their Compass-predicted activity with a Th17 pathogenicity signature based on previously
  inferred transcriptomic modules (STAR Methods). Right: A schematic diagram of central
  carbon metabolism. Reactions are colored according to the Spearman correlation of
  their Compass-predicted activity with the Th17 pathogenicity signature (reactions
  with a non-significant correlation shown in gray).(B) Spearman correlations between
  Compass-predicted activity of glycolysis reactions (rows) and genes belonging to
  the pro-inflammatory or pro-regulatory transcriptomic modules. Only statistically
  significant correlations with |rho| > 0.25 are shown in color; only reactions/genes
  with at least one colored entry are shown.(C) Inhibitors of selected reactions in
  central carbon metabolism are denoted.(D) Th17 cytokines were measured by flow cytometry
  and compared with Student’s t test. Naive T cells were differentiated under non-pathogenic
  Th17 (Th17n) conditions (STAR Methods) in the presence of control solvent or inhibitors.
  Cells were pre-labeled with division dye; protein expression is reported for cells
  that have gone through one division (d1) to exclude arrested cells.(E) Ratio of
  13C-tagged carbon to total carbon in metabolites retrieved from Th17n cells cultured
  for 15 min in the presence of 13C-glucose. Three metabolites are shown: PGAM’s substrate
  (3-phosphoglycerate), product (2-phosphoglycerate), and the next downstream metabolite
  along the glycolytic pathway (phosphoenolpyruvate).(F and G) RT-qPCR results showing
  ‘‘knockdown’’ of PGAM in Th17n cells where each dot represents an independent lentiviral
  infection with either control or PGAM sgRNA containing lentiviruses. (E–G) Data
  are represented as mean ± SEM in (D)–(F). *p < 0.05; **p < 0.01; ***p < 0.001; ****p
  < 0.0001. Statistical significance computed by Student’s t test with a BH adjustment
  for multiple comparisons where appropriate. Reaction and metabolite abbreviations
  appear in Table S2'
