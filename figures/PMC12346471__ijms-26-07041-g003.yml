figure_title: Gene Set Enrichment Analysis (GSEA) of differentially expressed genes
  for 2 and 5 dpi.
caption: Gene Set Enrichment Analysis (GSEA) of differentially expressed genes for
  2 and 5 dpi. (A) Ridge plots displaying the distribution of log2FC for DEGs in the
  top 39 significantly (padj < 0.05) shared GSEA pathways between 2 and 5 dpi. These
  37 pathways were selected by identifying an overlap among the top 75 GSEA pathways
  for 2 and 5 dpi. The x-axis displays log2 fold change values, while the y-axis lists
  GSEA pathway names corresponding to those in panels A and B. The ridges within the
  plot are colored, where blue is 2 dpi, and yellow is 5 dpi. (B) Heatmap showing
  the normalized enrichment scores (NES) for the top 39 significantly (padj < 0.05)
  shared GSEA pathways. Pathways are clustered hierarchically by normalized enrichment
  scores (NES), with a color scale ranging from light blue (lower enrichment) to dark
  blue (higher enrichment)
