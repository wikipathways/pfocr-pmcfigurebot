figure_title: Key signaling cascades in mammary gland affected by obesity in lactogenesis.
caption: Key signaling cascades in mammary gland affected by obesity in lactogenesis.
  Obesity promotes insulin and prolactin resistance and is characterized by elevated
  leptin levels. Insulin signaling through the PI3K–AKT pathway, essential for milk
  protein synthesis, is impaired. Simultaneously, high basal phosphorylation of STAT5
  downstream of the prolactin receptor leads to a blunted prolactin response. Elevated
  leptin engages the JAK2–STAT3 pathway preventing further STAT5 activation and contributing
  to delayed lactogenesis
article_title: Etiology of Delayed Lactogenesis in Obesity
