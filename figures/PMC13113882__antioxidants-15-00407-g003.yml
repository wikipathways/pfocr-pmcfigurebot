figure_title: Functional and pathway enrichment analyses of RVVC-ferroptosis shared
  genes.
caption: 'Functional and pathway enrichment analyses of RVVC-ferroptosis shared genes.
  (A) Gene Ontology (GO) enrichment analysis (three categories: Biological Process
  [BP], Molecular Function [MF], Cellular Component [CC]). Dot plots show significantly
  enriched GO terms: x-axis = enrichment signal, size of dots = number of genes annotated
  to the term, color gradient = FDR (higher value = more significant enrichment).
  (B) KEGG pathway enrichment analysis. Dot plot displays top enriched pathways: x-axis
  = enrichment signal, dot size = gene count, color = FDR. (C) WikiPathways enrichment
  analysis. Dot plot of significantly enriched pathways: x-axis = enrichment signal,
  dot size = gene count, color = FDR. (D) Gene Set Enrichment Analysis (GSEA) plot
  for the ferroptosis pathway in the RVVC DEGs (NES = 1.79, adj.p < 0.05). The curve
  reflects enrichment trend; vertical lines indicate positions of ferroptosis-related
  genes in the ranked DEG list'
