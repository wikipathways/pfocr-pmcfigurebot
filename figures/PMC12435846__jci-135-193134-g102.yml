figure_title: ICOS is related with cholesterol biosynthesis
caption: (A) Chord plot representing the differentially expressed genes from the most
  enriched metabolic pathways. Specific pathways are color-coded and represented in
  the right inner bands, where chords gather. Outer bands on the right depict the
  IPA −log10 (P value). The left inner bands represent the gene −log10 (P value).
  Outer bands on the left represent the gene log2(fold change). (B) The bar graphs
  represent the normalized counts of Srebf2. n = 3. (C) Representative histogram of
  protein expression of SREBP2. Corresponding quantitation is presented as MFI. n
  = 4. (D) Dot plot representing selected critical genes involved in cholesterol synthesis.
  Dot size is indicative of the total gene expression level. Gray histograms represent
  −log10 (P value), and the dotted line represents P < 0.05. (E–H) ICOS-KO aILC2s
  were cultured with vehicle or SREBP2 inhibitor. (F) Levels of IL-10 in the culture
  supernatant were measured. n = 4. (G and H) Representative plots of MAF (G) and
  NFIL3 (H) expression levels in each group are shown. Corresponding quantitation
  is presented as MFI. n = 4. Data are presented as mean ± SEM and are representative
  of 4 independent experiments. Two-tailed Student’s t test or 1-way ANOVA followed
  by Tukey’s post hoc tests was employed for statistical analysis; *P < 0.05, **P
  < 0.01, ***P < 0.001, and ****P < 0.0001. Schematic images were created in Adobe
  Illustrator. FMO, fluorescence minus one
