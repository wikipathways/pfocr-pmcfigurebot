caption: 'High-altitude hypoxic injury: complementary mechanisms and potential interventions.
  High-altitude hypoxia initiates a cascade of pathophysiological events, including
  oxidative stress, calcium homeostasis disorder, inflammatory response, and mitochondrial
  dysfunction, which interact to exacerbate cellular injury. These systemic disturbances
  manifest as specific organ pathologies: in the brain, they lead to high-altitude
  cerebral edema (HACE) and blood–brain barrier (BBB) disruption; in the lungs, they
  cause high-altitude pulmonary edema (HAPE) and stress failure; and in the heart,
  they result in cardiomegaly and right ventricular overload. Therapeutic strategies
  are categorized into three dimensions: oxygenation support (e.g., oxygen therapy,
  acetazolamide, and erythropoietin), molecular pathway modulation (e.g., HIF-1α stabilizers,
  antioxidants like NAC, and calcium channel blockers), and damage prevention (e.g.,
  dexamethasone and natural compounds such as astragaloside and ginsenoside)'
