figure_title: YW3-56 promoted metabolic-differentiation coupling in NB4 cells via
  PI3K-AKT-mTOR signaling.
caption: YW3-56 promoted metabolic-differentiation coupling in NB4 cells via PI3K-AKT-mTOR
  signaling. (A) KEGG pathway enrichment analysis of proteomic data highlighting PI3K-AKT
  signaling modulation. (B,C) Transcriptomic analysis confirmed the increase in the
  expression of PI3K/AKT regulatory subunits. (D) Representative Western blot images
  of the PI3K-AKT-mTOR pathway in NB4 cells treated with YW3-56 (8, 4, and 2 μM).
  GAPDH was used as a loading control. (E–I) Quantification of the protein expression
  levels and phosphorylation status of PI3K (Ser249), AKT (Thr308), and mTOR (Ser2448).
  The data are shown as the means ± SD. *, p < 0.05; **, p < 0.01; ***, p < 0.001
