caption: Metabolic network remodeling in salt-stressed wild barley (Hordeum spontaneum)
  15-day-old leaves exposed to 500 mM NaCl at four intervals (0 h, 2 h, 12 h, 24 h)
  with temporal enrichment of KEGG pathway enzymes governing sugar phosphate and riboflavin
  biosynthesis under salt stress. Gene expression profiles identify upregulated enzymes
  driving the production of D-fructose-6P, D-ribulose-5P, D-ribose-5P, and riboflavin,
  illustrating cross-pathway coordination between carbohydrate metabolism and redox
  cofactor generation. Orange boxes highlight these pivotal end-products, while distinct
  color-coding delineates three metabolic trajectories, where two funneling carbon
  flux toward sugar phosphate intermediates and one directing synthesis of riboflavin.
  Further information is available in Figures S10, S13–S15, and S27
