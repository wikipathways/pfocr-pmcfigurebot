figure_title: Effect of bufalin on the Wnt/β-catenin signaling pathway in TNBCSCs
caption: MDA-MB-231- and HCC1937- derived TNBCSCs were treated with bufalin (200,
  400 nM) for 72 h. (A) Total RNA was extracted, and cDNA was synthesized via reverse
  transcription. β-Catenin mRNA levels were analyzed by RT-PCR. GAPDH served as an
  internal control, and band intensity was quantified by densitometry. (B) Protein
  expression levels of β-catenin and EGFR were assessed by Western blotting. β-Actin
  was used as a loading control, and band intensity was quantified by densitometry.
  * p < 0.05 vs. control
