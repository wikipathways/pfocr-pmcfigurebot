figure_title: Effect of the JUN signaling pathway on DU145 cell migration, invasiveness,
  and RB1CC1 phosphorylation.
caption: Effect of the JUN signaling pathway on DU145 cell migration, invasiveness,
  and RB1CC1 phosphorylation. (A) Viability of human prostate cancer DU145 cells analyzed
  using the MTT assay following treatment with different concentrations of MPD alone
  or with SP600125 for 48 h. (B) Migratory activity of DU145 cells determined in the
  wound healing assay following treatment with various concentrations of MPD alone
  or with SP600125 for 48 h. Scale bars = 10 µm. (C) Wound healing ratio from (B).
  (D) Invasive properties of DU145 cells determined in the Transwell assay following
  treatment with various concentrations of MPD alone or with SP600125. Scale bars
  = 10 µm. (E) Numbers of invading cells from (D). (F) Immunoblot analysis showing
  the expression of JNK, p-JNK, and p-RB1CC1 following treatment with MPD at different
  concentrations for 48 h. (G) Histograms representing the quantifications of the
  JNK, p-JNK, and p-RB1CC1 bands from (F). (H) JNK, p-JNK, and p-RB1CC1 expression
  levels analyzed using Western blotting, after 48 h following treatment with MPD
  alone or in combination with SP600126. (I) Histograms representing the quantifications
  of the JNK, p-JNK, and p-RB1CC1 bands from (H). Data are presented as the mean ±
  standard error of the mean (n = 3). Statistical significance of differences was
  analyzed using ANOVA. Significantly different values are indicated by distinct letters
  (p < 0.05). Original images can be found in the Supplementary Materials
