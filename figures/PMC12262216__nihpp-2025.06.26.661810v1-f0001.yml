figure_title: Edited PRESS pulse sequence with the corresponding complete coherence
  transfer pathway (CTP) map
caption: A The pulse sequence diagram of our MEGA-edited PRESS implementation, showing
  the intended CTP as a green line and an example of an unwanted CTP as a broken black
  line. Two gradient schemes are shown; gradient pulses included in both are shown
  in white. Black-filled gradient pulses in our ‘Shared’ gradient scheme are changed
  to the red pulses in the upgraded scheme, referred to as ‘Two-last, increased-area’
  because the duration of these pulses has been increased and there are pulses on
  two axes in the final delay. B The complete CTP map, where each column corresponds
  to one of the 81 possible pathways, and each row represents the coherence order
  following the application of a specific RF pulse (RFex, RFecho1, RFedit1, RFecho2,
  RFedit2). The acquired signal is conventionally defined by a final coherence order
  of −1. The broken line in A corresponds to CTP-41 in B
