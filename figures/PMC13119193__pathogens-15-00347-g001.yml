figure_title: Cellular and molecular mechanisms of angiogenesis.
caption: 'Cellular and molecular mechanisms of angiogenesis. (A) Hypoxic microenvironment
  induced by HIF-1α, promoting VEGF expression and the formation of a gradient that
  guides angiogenesis. (B) Cellular response and vascular remodeling: Macrophages,
  lymphocytes, and neutrophils secrete proangiogenic factors such as VEGF, FGF, PDGF,
  and MMPs. Endothelial tip cells (specialized motile cells in blood vessels) initiate
  sprouting, whereas stalk cells extend the vessel. Metalloproteinases remodel the
  extracellular matrix, and VEGFR, PDGFR, EGFR, and TGF-β receptors regulate signaling
  pathways involved in the formation and stabilization of new vessels'
