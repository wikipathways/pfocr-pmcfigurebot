figure_title: Diffusion map analysis and representative structures of tetra-nucleosome
  folding with homodimers of HP1α and tPHC3 in dilute and dense phases.
caption: Diffusion map analysis and representative structures of tetra-nucleosome
  folding with homodimers of HP1α and tPHC3 in dilute and dense phases. (a–d) Representative
  structural snapshots from dilute and dense phase simulations. (e–h) Diffusion map
  projections (ψ1, ψ2) colored by RMSD to the native tetra-nucleosome structure. HP1α
  in both phases (e,g) shows organized landscapes with smooth RMSD gradients, indicating
  progressive folding. In contrast, tPHC3 (f,h) exhibits broader and more fragmented
  manifolds with multiple low-RMSD regions, suggesting heterogeneous folding pathways.
  (i–l) Corresponding free energy surfaces projected onto ψ1–ψ2 space. HP1α (i,k)
  favors continuous funnels leading toward native-like states, while tPHC3 (j,l) shows
  multiple quasi-stable basins. In the dense phase (l), several low-energy basins
  contain β-rhombus–like and α-tetrahedron–like structures (insets), highlighting
  the emergence of distinct intermediates enroute to compact chromatin architectures.
  The snapshots were rendered using VMD software.(36)
article_title: 'How chromatin-binding proteins direct distinct folding pathways of
