figure_title: The Host Trimethylamine Receptor TAAR5 Shapes Circadian Oscillations
  in Circulating Hormones and Cytokines
caption: 'Male chow-fed wild-type mice (Taar5+/+) or mice lacking the TMA receptor
  (Taar5−/−) were necropsied at 4-hour intervals to collect plasma. (A) Plasma levels
  of metabolites in the metaorganismal trimethylamine N-oxide (TMAO) pathway were
  quantified using liquid chromatography tandem mass spectrometry (LC-MS/MS). (B)
  Plasma metabolic hormones (insulin, C-peptide, glucagon, GLP-1, leptin, ghrelin,
  and peptide YY) and cytokine/chemokine (MCP-1, IL-6, and TNFα) levels were quantified
  using MesoScale Discovery multi-plex immunoassays as described in the materials
  and methods. Data shown represent the means −/+ S.D. for n= 3–6 individual mice
  per group. Group differences were determined using cosinor analyses p-values are
  provided where there were statistically significant differences between Taar5+/+
  andTaar5−/− mice. The complete cosinor statistical analysis for circadian data can
  be found in Table 1. Significant differences between Taar5+/+ andTaar5−/− mice by
  student’s t-tests within each ZT time point (*p< 0.05: **p< 0.01; ***p <0.001, and
  ****p<0.0005)'
