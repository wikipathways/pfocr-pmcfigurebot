figure_title: STZYD effects on the NMDAR-2B/CaMKII/CREB signaling pathway.
caption: 'STZYD effects on the NMDAR-2B/CaMKII/CREB signaling pathway. (A) Western
  blotting was used to detect the expressions of NMDAR-2B, CaMKII, p-CaMKII, CREB,
  p-CREB, and Vinculin proteins in the IPN. (B) Relative protein expression levels
  of NMDAR-2B receptor. (C) Relative protein expression levels of p-CaMKII. (D) Relative
  protein expression levels of p-CREB. (E–H) Representative immunohistochemical images
  and statistical analysis of each group showing the positive areas of NMDAR-2B, p-CaMKII,
  and p-CREB in the IPN (scale bar: 50 μm; magnification 40×; n = 3). Black arrows
  indicate IPN neurons immunopositive for NMDAR-2B, p-CaMKII, or p-CREB. One-way ANOVA
  was used to analyze the protein expression levels and positive cell rates of NMDAR-2B,
  p-CaMKII, and p-CREB. All data are expressed as means ± SEMs, n = 3. Compared with
  the Sham group, # p < 0.05, and ### p < 0.001. Compared with the SNI group, * p
  < 0.05, ** p < 0.01, and *** p < 0.001'
