figure_title: Role and mechanisms of action of SCFAs in the intestinal epithelium.
caption: Role and mechanisms of action of SCFAs in the intestinal epithelium. SCFAs,
  particularly butyrate, exhibit anti-carcinogenic effects in the intestine through
  a range of mechanisms, including induction of protective autophagy (and correlated
  downregulation of the Wnt/β-Catenin pathway), immunomodulation of the inflammatory
  response, epigenetic modulation of gene expression, and stabilization of intestinal
  barrier integrity (Created in BioRender. Isidoro, C. (2025) https://BioRender.com/pzq0dhg)
