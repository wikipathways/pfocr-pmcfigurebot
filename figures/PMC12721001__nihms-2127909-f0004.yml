figure_title: Interferon and Interleukin related genes in NAc Astrocytes from EtOH
  Dependent mice.
caption: Interferon and Interleukin related genes in NAc Astrocytes from EtOH Dependent
  mice. A. Interferon related pathways were significantly overrepresented in Dependent
  vs non-Dependent NAc astrocytes. Genes and pathways summarized in Table 2 were used
  to create a network of known direct and indirect interactions using IPA. B. Interleukin
  related pathways were significantly overrepresented in Dependent vs non-Dependent
  NAc astrocytes. Genes and pathways summarized in Table 3 were used to create a network
  in IPA. C. Confirmation by qPCR of RNA-seq data on Il33 expression and translation.
  Il33 down-regulation in the IP fraction from the NAc of Dependent vs non-Dependent
  mice (*, p = 0.038); Il33 enrichment in astrocytes (IP fraction) compared to input
  (bulk tissue; ****, p < 0.0001). Sample sizes are 5 for female non-dependent input
  and IP, 4 for female dependent input and IP, 4 for male non-dependent input, 3 for
  male non-dependent IP, and 3 for male dependent input and IP
