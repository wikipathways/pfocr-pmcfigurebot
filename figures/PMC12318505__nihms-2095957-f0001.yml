figure_title: PGG inhibits TAK1 and NF-κB signaling, but not the complete MAPK pathway
  or ASK1
caption: THP-1 macrophages were pre-treated with either 5Z7o or 0.1–10 μM PGG for
  two hours prior to priming with LPS for four hours and stimulation with 100 μg/mL
  MSU for 30 minutes. A) Schematic representation of experiment. B) Representative
  western blots for selected signaling kinases. PGG inhibited phosphorylation of TAK1184/187
  and NF-κB p65 in a dose-dependent manner, but did not inhibit other MAPK signaling
  proteins, PKCδ, or ASK1. C) Densitometric analysis of target protein normalized
  to β-Actin in n=3 replicates with statistical analysis by one-way ANOVA, *p<0.05,
  **p<0.001, ***p<0.0001, ****p<0.00001
