figure_title: AI-HOPE-RTK-RAS conversational workflow for integrative clinical and
  genomic analysis.
caption: AI-HOPE-RTK-RAS conversational workflow for integrative clinical and genomic
  analysis. This figure presents the functional pipeline of AI-HOPE-RTK-RAS, an interactive
  artificial intelligence platform tailored for exploring RTK-RAS signaling in colorectal
  cancer (CRC). (a) The process begins with the user posing a research question in
  natural language—for example, assessing differences in survival between early- and
  late-onset Hispanic/Latino patients with RTK-RAS pathway mutations. (b) The query
  is handled through a user-friendly graphical interface, where a large language model
  (LLM) interprets the request, translates it into executable code, and defines the
  parameters for subgroup comparison. (c) The platform accesses harmonized clinical
  and genomic datasets—such as those from TCGA and cBioPortal—focusing on RTK-RAS
  genes, including KRAS, NRAS, BRAF, EGFR, ERBB2, CBL, MAPK3, and NF1. Relevant clinical
  filters (e.g., age, ancestry, treatment exposure) are applied based on the query
  intent. (d) Statistical analyses are carried out automatically, generating results
  such as survival curves and odds ratios. Outputs are rendered in publication-ready
  formats alongside narrative interpretations, enabling efficient exploration of complex
  CRC datasets through a precision oncology lens
article_title: 'Precision Oncology Through Dialogue: AI-HOPE-RTK-RAS Integrates Clinical
  and Genomic Insights into RTK-RAS Alterations in Colorectal Cancer'
