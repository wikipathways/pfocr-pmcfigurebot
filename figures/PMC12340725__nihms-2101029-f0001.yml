figure_title: A) Calculated pathway for Cu(L3) migration along the azatriene framework
  after (L3)CuH migratory insertion.
caption: A) Calculated pathway for Cu(L3) migration along the azatriene framework
  after (L3)CuH migratory insertion. B) Examination of calculated imine addition transition
  states TS-I through TS-V from additions via IN-1, IN-2, and IN-4. C) The calculated
  lowest energy pathway for imine addition, TS-VI, by reaction of azomethine ylide
  IN-3. D) Calculated higher energy potential competing transition states via the
  Cu–N axis diastereomer (TS-VII), which affords the same major product stereoisomer,
  or via TS-VIII, TS-IX, or TS-X, which lead to product diastereomers or enantiomer.
  E) Energy decomposition analysis for the calculated azomethine ylide transition
  states and SE2’ addition transition state TS-IV reveals that the lowest energy TS-VI
  possesses the greatest dispersion and electrostatic attractive forces between the
  N-phosphinoyl imine and Josiphos L3 (van der Waals forces, most significantly London
  dispersion forces, illustrated for TS-VI in green). Energies calculated for R1,
  R3 = H, R2 = Ph
