figure_title: Sharp thresholds are present at multiple levels of the complement cascade
  and are invariant upon normalization to the number of proteins on the liposomes
caption: (A) Schematics of C3 convertase assembly for the different complement pathways,
  highlighting C3 cleavage.(B) C3b fluorescence on liposomes vs. protein spacing on
  the liposomes (as in Figure 2B).(C) Normalization of data from (B) to number of
  proteins per liposome.(D) C3a production in serum doped with liposomes vs. protein
  spacing (n = 4 nanoparticle-serum preparations).(E) Normalization of data from (D)
  to number of proteins per liposome.(F) Schematics of C5 convertase assembly for
  the different complement pathways, highlighting C5 cleavage.(G and H) Data as in
  (D) and (E), but for C5a production vs. protein spacing (n = 3 nanoparticle-serum
  preparations).(I) Schematic of properdin stabilization of alternative pathway C3
  convertase.(J and K) Data as in (B) and (C), but for detection of properdin on nanoparticle
  surfaces (n = 3 nanoparticle-serum preparations).See also Figures S1, S5, and S6
