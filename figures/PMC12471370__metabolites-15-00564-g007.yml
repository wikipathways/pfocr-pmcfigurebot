caption: 'KEGG pathway enrichment analysis of differential metabolites. (A) P treatment
  vs. control, (B) T treatment vs. control, (C) T treatment vs. P treatment. The X-axis
  indicates the Rich Factor (ratio of differential to total metabolites in a pathway),
  while the Y-axis lists the KEGG pathways. Dot color reflects statistical significance
  (p-value), with darker red indicating greater significance. Dot size corresponds
  to the number of enriched differential metabolites in each pathway. Note: C is untreated
  control, P-treatment is HFD only, T-treatment is HFD + STZ'
