figure_title: Activated CD8+ T cells engage the PPP
caption: (A) Realtime extracellular acidification rate (ECAR) was measured using the
  Seahorse XF analyzer in unstimulated (UNT) or CD3/28-activated (CD3/28) CD8+ splenocytes
  in the presence of the AMPK activators AICAR (500 μM) and metformin (MET) (10 mM)
  or the PPP inhibitors 6AN (1 mM) and polydatin (polyD) (1 mM). (B) Glycolytic capacity
  derived from the ECAR in unstimulated (UNT) or CD3/28-activated (CD3/28) CD8+ splenocytes
  in the presence of AICAR, MET, 6AN, or polyD. n = 11 technical replicates/condition.
  (C) Glucose uptake evaluated at 24 hours in UNT or CD3/28-activated splenocytes
  inhibited with 6AN (1 mM) or polyD (1 mM); n = 3. (D) Summary representation of
  isotope distribution in PPP pathway molecules in CD8+ splenocytes 4 hours after
  the addition of D-glucose-1,2-13C2. Graphs show mole percent enrichment for the
  m+0, m+1, and m+2 species in cells that were untreated (U), activated with CD3/28
  (A), or activated with CD3/28 in the presence of 6AN (100 μM) (A+I). (E) Individual
  mole percent enrichment data for each species in each treatment condition (n = 3
  per condition) shown in D. Due to the density of data, individual statistics are
  provided in Supplemental Table 1. One-way or 2-way ANOVA with Tukey’s or Dunnet’s
  pairwise comparison test was used to assess significance. ****P < 0.0001. Data in
  A–C are representative of at least 3 separate experiments. Data are shown as mean
  ± 95% CI
