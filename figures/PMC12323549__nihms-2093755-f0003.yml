figure_title: BsAbα5β1/αv suppresses Myc/E2F signaling and induces an interferon response
  in basal-type cancer lines
caption: RNA-seq was performed, comparing BsAbα5β1/αv treatment to vehicle control
  in (A) DU-145 and (B) PC-3 prostate cancer cells (n=2 per arm). Pre-ranked gene
  set enrichment analysis was conducted using MSigDB hallmark gene sets, ranking genes
  by a combination of fold change and p-value. The normalized enrichment scores for
  hallmark gene sets are shown, with green bars indicating enrichment (upregulation)
  and red bars indicating suppression (downregulation) of pathway activity following
  treatment. (C-D) Using a 48-plex ELISA, cytokine expression profiles were measured
  in the supernatants of DU-145 (C) and PC-3 (D) cells treated with integrin monospecific
  or bispecific antibodies (10 μg/mL) for 48 hours. Mean expression levels ± standard
  error of the mean (n=2 per arm) for CXCL-10 and CCL5, the only cytokines significantly
  modulated by BsAbα5β1/αv in both cell lines, are shown. p-values from one-sided
  head-to-head t-tests are provided
article_title: A novel bispecific integrin α5β1/αv antibody reprograms the Myc-regulated
  basal phenotype of prostate cancer with natural killer cell–mediated tumor elimination
