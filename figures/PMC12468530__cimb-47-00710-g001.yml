figure_title: Cellular pathways through which N-acetylcysteine supports redox balance
  and sulfur-based signaling.
caption: 'Cellular pathways through which N-acetylcysteine supports redox balance
  and sulfur-based signaling. NAC is absorbed by cells and converted to cysteine through
  deacetylation, which plays a role in two primary pathways: glutathione synthesis
  and sulfur species formation. Cysteine is converted to glutathione (GSH) through
  the sequential action of γ-glutamylcysteine ligase (γ-GCL) and glutathione synthetase
  (GS). GSH acts as a key antioxidant by neutralizing reactive oxygen species (ROS)
  directly and via enzymatic systems: glutathione peroxidase (GPX), glutathione S-transferase
  (GST), which mediate peroxide reduction, electrophile detoxification, and disulfide
  bond regulation, respectively. Cysteine is also a precursor for hydrogen sulfide
  (H2S) and other sulfane sulfur species, which provide additional protective roles
  through radical scavenging, thiol group preservation, and redox-sensitive protein
  modulation'
article_title: 'The Central Nervous System Modulatory Activities of N-Acetylcysteine:
