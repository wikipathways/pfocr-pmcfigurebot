figure_title: Bidirectional associations between MASLD and major NCDs.
caption: Bidirectional associations between MASLD and major NCDs. MASLD is centrally
  linked to the pathogenesis and progression of type 2 diabetes, cardiovascular diseases,
  chronic respiratory diseases, and cancer. Shared mechanisms include insulin resistance,
  chronic inflammation, dyslipidemia, hormonal imbalance, environmental exposures,
  and mitochondrial dysfunction. These pathways not only promote MASLD development
  but also exacerbate comorbid NCDs, creating a cycle of mutual reinforcement and
  increased mortality risk
