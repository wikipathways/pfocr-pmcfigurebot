figure_title: Critical SKCM metastasis-related genes and signaling pathways in the
  GEO SKCM cohort.
caption: 'Critical SKCM metastasis-related genes and signaling pathways in the GEO
  SKCM cohort. (A) Identification of DEGs in 4 GEO datasets using the RobustRankAggreg
  package. A heatmap of the top 20 upregulated and 10 downregulated DEGs in the integrated
  GEO datasets analysis is presented: The rows represent the genes, and the columns
  represent the GEO dataset. Each cell contains the log2FoldChange value. Red represents
  upregulated genes and blue represents downregulated genes. GO analysis based on
  DEGs between metastatic and primary SKCM. (B) GO enrichment analysis was performed
  using the clusterProfiler package to evaluate the related biological processes.
  (C) The line color of the ring graph represents the GO terms, the points represent
  the genes and the size of the points represents the count number. (D) Heatmap illustrating
  Pearson correlation coefficients between metastasis-associated genes and N6-methyladenosine
  regulators in SKCM, with color intensity indicating the correlation coefficient
  (blue, negative; yellow, neutral; and orange/red, positive). **P<0.01. SKCM, skin
  cutaneous melanoma; GEO, Gene Expression Omnibus; DEGs, differentially expressed
  genes; GO, Gene Ontology'
