caption: 'Positioning EHMN 2026 as an interoperable metabolic backbone for quantitative
  systems pharmacology (QSP) and multi-layer modelling. The diagram shows EHMN 2026
  at the centre, connected to: (left) upstream annotation resources that populate
  the model (MetaNetX, ChEBI, Reactome, Human-GEM, KEGG, BRENDA); (right) downstream
  integration targets in QSP and systems biology (CYTOCON/CYTOCON DB for immune cell
  concentration calibration; SABIO-RK and BRENDA for selective kinetic augmentation;
  TRANSFAC and TRANSPATH for regulatory and signalling layer coupling; COBRA/COBRApy/Tellurium
  for constraint-based analysis). The uniform MetaNetX identifier namespace and embedded
  Reactome pathway IDs provide the structural bridges for namespace-clean multi-layer
  coupling. Arrows indicate data flow direction; bidirectional arrows indicate planned
  bidirectional integration'
