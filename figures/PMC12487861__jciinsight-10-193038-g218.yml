figure_title: Cellular composition of palmoplantar pustulosis skin and healthy skin
caption: (A) Uniform manifold approximation and projection (UMAP) of 32,364 cells
  from lesional and nonlesional skin biopsies of 3 patients with PPP and 5 healthy
  controls colored by cell types. Ingenuity pathway enrichment significance was determined
  using a right-tailed Fisher’s exact test, and results are displayed as –log(p-value).
  (B) Bar plot depicting the proportional distribution of cell types across disease
  conditions (lesional, nonlesional, and healthy), with individual donor proportions
  represented as dots. (C) Dot plots illustrating selected marker genes expression
  for cell types. (D) Enriched IPA across lesional (red), nonlesional (green), and
  healthy (blue) with significance indicated by the dotted line (–log[P value])
article_title: Th17 cells with regulatory phenotype are the main IL-17F and IL-26
  producers in palmoplantar pustulosis
