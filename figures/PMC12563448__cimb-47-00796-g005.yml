caption: KEGG and GO functional enrichment analysis of ASD-related PEPs target genes.
  (A) KEGG pathway enrichment analysis shows the potential pathways targeted by PEPs
  related to ASD. (B) GO enrichment analysis shows the molecular functions (MF) enriched
  by the ASD-related PEPs target genes. (C) GO enrichment analysis of biological processes
  (BP) enriched by the ASD-related PEPs target genes. (D) GO enrichment analysis of
  cellular components (CC) enriched by the ASD-related PEPs target genes. (E) MCODE
  analysis of core target genes for PEPs. Enrichment results are displayed by the
  network plot. The node size indicates the degree of enrichment
