figure_title: Bioinformatics annotation of the drug-disease crossover genes.
caption: Bioinformatics annotation of the drug-disease crossover genes. (A–D) The
  highest-scoring top four modules obtained from the PPI network comprising 168 drug-disease
  crossover hub genes. (E) Heatmaps of the GO-based enrichment terms for genes within
  the top four modules. (F) Heatmaps of biological pathways (WikiPathway) enrichment
  for genes within the top four modules. The heatmaps were generated based on Kappa-statistical
  similarities among their gene memberships. Color key in heatmaps, ranging from gray
  to brown, represented high to low p-values, respectively
