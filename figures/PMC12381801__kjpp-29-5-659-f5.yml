figure_title: The regulation of procyanidin B2 (PB2) on mammalian target of rapamycin
  (mTOR) signaling pathway and cell proliferation through AMP-activated protein kinase
  (AMPK)
caption: 'Cells were transduced with adenovirus-green fluorescent protein (GFP), constitutively
  active form of AMPK (AMPK-CA), or dominant-negative isoforms of the α1 and α2 subunits
  of AMPK (AMPK-DN α1 and α2) for 6 h. After pre-treatment with PB2 (20 μM) for 1
  h, cells were stimulated with platelet-derived growth factor-BB (PDGF-BB) (10 ng/ml)
  for 24 h. (A, B) Results of western blot analysis indicated that PB2-activated AMPK
  inhibited the mTOR signaling pathway. (C) PB2 decreased cell proliferation through
  AMPK activation. Representative results are shown from three independent experiments.
  *p < 0.05 vs. control, **p < 0.05 vs. PDGF-BB alone, #p < 0.05 vs. PDGF-BB + PB2'
article_title: Procyanidin B2-induced LKB1-AMPK activation mitigates vascular smooth
  muscle cell proliferation through inhibition of mTOR signaling
