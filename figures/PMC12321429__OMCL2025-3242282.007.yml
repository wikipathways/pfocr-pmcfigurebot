figure_title: Acod1 was significantly upregulated by E2f1 overexpression in cultured
  aged mouse-derived CECs.
caption: Acod1 was significantly upregulated by E2f1 overexpression in cultured aged
  mouse-derived CECs. (A) Cultured CECs isolated from 20 m/o male mice were transfected
  with pCMV-HA-E2F1 (E2F1) or pCAG (cont.). Then, RNA from cells was isolated and
  processed for RNA sequencing analysis. The heatmap shows the 500 most expressed
  genes in control and E2f1-overexpressing CECs. Representation of the biological
  processes upregulated (B) and downregulated (C) in E2f1-overexpressing CECs compared
  with control CECs. Each biological process shows a p value. Representation of the
  most enriched KEGG pathways containing the most significant upregulated (D) and
  downregulated (E) genes in E2f1-overexpressing CECs, compared with control CECs.
  Each KEGG pathway shows a p value. (F) Volcano plot showing fold changes for genes
  differentially expressed between control CECs versus E2f1-overexpressing CECs in
  culture. (G) Gene expression of E2f1 relative to β-actin in cultured CECs transfected
  with a control plasmid (cont.) or with a plasmid coding for E2f1 (E2F1). (H) Gene
  expression of Acod1 relative to β-actin in cultured CECs transfected with a control
  plasmid (cont.) or with a plasmid coding for E2f1 (E2F1). Data are mean ± SEM from
  independent cultures of CECs from three aged mice. Student's t-test
article_title: E2f1 Overexpression Reduces Aging-Associated DNA Damage in Cultured
  Cerebral Endothelial Cells and Improves Cognitive Performance in Aged Mice
