figure_title: Mechanism of naringenin in inhibiting ETEC-induced ferroptosis in IPEC-J2
  cells.
caption: Mechanism of naringenin in inhibiting ETEC-induced ferroptosis in IPEC-J2
  cells. Cystine-glutamate antiporter (system Xc-) is composed of SLC7A11 and SLC3A2.
  SLC7A11 plays a key role in transmembrane transportation of cystine for GSH biosynthesis,
  which is further involved in the conversion of lipid hydroperoxides into non-toxic
  lipid alcohols by the catalytic activity of GPX4. This is identified as the system
  Xc-/GPX4 pathway to prevent ferroptosis. CHAC1 leads to GSH depletion and lipid
  peroxide accumulation. Ferrous ion (Fe2+) accumulation, Fenton reaction, and inhibition
  of GPX4 cause lipid peroxidation to trigger ferroptosis. ETEC infection upregulates
  HSP90, which further inhibits the SLC7A11/GPX4 pathway, resulting in the activation
  of ferroptosis in IPEC-J2 cells. Naringenin inhibits HSP90 to attenuate ETEC-induced
  ferroptosis of IPEC-J2 cells
article_title: Naringenin Inhibits Enterotoxigenic Escherichia coli-Induced Ferroptosis
  via Targeting HSP90 in IPEC-J2 Cells
