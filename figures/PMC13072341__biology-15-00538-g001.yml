caption: Major histocompatibility complex class I (MHC-I) Antigen presentation pathway.
  Transcription of DNA generates coding and noncoding transcripts, including long
  non-coding RNA (lncRNAs) with diverse structural features. These transcripts may
  undergo canonical translation or noncanonical initiation (e.g., non-AUG start codons,
  small open reading frame (smORFs), or internal ribosome entry site(IRES)-dependent
  mechanisms), producing lncRNA-derived peptides (lncPEPs). Stable lncPEPs can undergo
  ubiquitination and degradation by the proteasome or immunoproteasome, whereas unstable
  or defective ribosomal products (DRiPs) may also be processed by cytoplasmic proteases.
  The resulting peptides are transported into the endoplasmic reticulum (ER) via transporter
  associated with antigen processing (TAP) and further trimmed by endoplasmic reticulum
  aminopeptidase (ERAP). MHC-I molecules are assembled in the ER in association with
  the peptide-loading complex (including TAP, tapasin, ERp57, calnexin, and calreticulin),
  enabling stable peptide loading and formation of the peptide–HLA complex (pHLA)
  complex. The pHLA complex is transported through the Golgi apparatus to the cell
  surface via exocytosis, where it can be recognized by naive CD8+ T cells, leading
  to their activation and differentiation into cytotoxic T lymphocytes that mediate
  antigen-specific immune responses
