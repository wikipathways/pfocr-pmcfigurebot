figure_title: ERK1/2 pathway is activated and involved in BTXA’s promotion of Cldn1
  transcription though the upregulation of Sp1 expression.
caption: ERK1/2 pathway is activated and involved in BTXA’s promotion of Cldn1 transcription
  though the upregulation of Sp1 expression. (A) Dual-luciferase reporter assay with
  SMG-C6 cells transfected with a luciferase reporter plasmid. (B) Western blot analysis
  of Sp1 and Cldn1 after transfecting SMG-C6 cells with Sp1-specific siRNA. (C) Western
  blot analysis of Sp1 after preincubating with U0126. SMG-C6 cells treated with 50
  U/mL BTXA for 24 h. SP1, specificity protein-1; NC, negative control. Data are presented
  as mean ± SEM; n = 5–7, * p < 0.05; ** p < 0.01; *** p < 0.001 compared with control
  group
