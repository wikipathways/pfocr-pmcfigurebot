figure_title: The anti-fibrotic effects of LIG are related with cellular senescence.
caption: 'The anti-fibrotic effects of LIG are related with cellular senescence. (A)
  GSEA analysis of senescence-related pathway. (B) The correlation of pro-fibrotic
  genes and senescence promoting genes. (C) The heatmap of senescence-related marker
  genes. (D-E) Relative mRNA levels of cell cycle-related genes and SASPs are determined
  by qPCR and normalized with Hprt1 in BDL-(D) and CCl4-(E) induced fibrosis model.
  (F-G) The protein levels of P21 and P53 in BDL-(F) and CCl4-(G)induced fibrosis
  model are determined by WB and normalized by GAPDH. Statistical significance: *
  P < 0.05, ** P < 0.01, *** P < 0.001, compared with sham/con group; # P < 0.05,
  ## P < 0.01, ### P < 0.001, compared with the BDL/CCl4 group'
