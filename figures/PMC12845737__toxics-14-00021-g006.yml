caption: Functional and pathway enrichment analysis of differentially expressed genes
  (DEGs) in NSCLC cells exposed to biomass haze-derived PM2.5. (A–C) Dot plots of
  KEGG pathway enrichment for DEGs in A549 (A), NCI-H1975 (B), and NCI-H460 (C) cell
  lines. The gene ratio reflects the proportion of DEGs involved in each pathway,
  and bubble size corresponds to the number of genes. (D,E) Sankey diagrams depicting
  the categorized biological functions of the top 10 upregulated (D) and downregulated
  (E) genes in each cell line
