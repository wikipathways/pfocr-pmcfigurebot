figure_title: The transition from canonical replication to BIR is responsible for
  ALT
caption: a, Schematic of DNA replication during S phase and of BIR. When a replication
  fork encounters an unresolvable barrier, the replication machinery can collapse
  and generate a seDSB. At the seDSB, the capture by a single-strand 3′ overhang of
  a homologous template initiates BIR, which proceeds through unidirectional, conservative
  DNA synthesis. Unlike canonical, S-phase replication, lagging-strand synthesis during
  BIR is delayed, resulting in the accumulation of extended ssDNA on the leading strand,
  which is an inherently mutation-prone intermediate. The extension of BIR is limited
  by the presence of converging replication forks. b, Diagram of ALT mechanisms in
  yeast. In yeast, ALT occurs through two pathways. Type I ALT uses BIR, in which
  a Rad51-coated 3′ end invades donor DNA and generates a tandem of the sub-telomeric
  Y′ element and telomere repeats (marked as (TG)n). Type II ALT is a Rad51-independent
  BIR, in which the 3′ overhang of the TG repeats anneals with the template DNA. The
  Y′ element is not amplified in this pathway. A recent model also indicates that
  a type I survivor product can be further elongated by Rad52 and Rad59 to form the
  hybrid ALT outcome containing both tandem Y′ elements and a long TG repeat sequence158.
  c, In human cells, ALT is mediated by the helicase BLM, a component of the BTR complex,
  which unwinds Okazaki fragments to create a 5′ flap to promote the DNA-damage response
  that mediates ALT. The endonuclease DNA2 cleaves long 5′ flaps generated by BLM
  on unligated Okazaki fragments. The translocase FANCM is recruited to BLM-dependent
  telomere substrates and prevents excessive recombination. Hyperactive ALT occurs
  in response to FANCM loss, leading to the accumulation of unresolved telomeric recombination
  intermediates and cell death specifically in ALT-positive cancer cells. PIF1, ATP-dependent
  DNA helicase PIF1
