figure_title: Neuroinflammation cycle.
caption: 'Neuroinflammation cycle. 1. Recurrent epileptic activity stimulates microglia
  and astrocytes to release pro-inflammatory cytokines IL-1b, TNF-a, IL-6. 2a. Cytokines
  exacerbate neuroinflammation by activating the NF-kB and MAPK pathways. 2b. Cytokines
  modify neuronal excitability by upregulating NMDA receptors (↑), α-amino-3-hydroxy-5-methyl-4-isoxazolepropionic
  acid (AMPA) receptors (↑), and GABA-A receptors (↓). They also affect the functionality
  of ion transporters: KATP and Na/K ATPase, (↑ membrane depolarization ↑ epileptic
  seizures). 2c. Cytokines alter the BBB by increasing the expression of ICAM-1, VCAM-1;
  allowing infiltration of peripheral immune cells into the CNS. 3. Cytokines released
  from the CNS affect peripheral metabolism, such as in adipose and muscle tissue,
  by facilitating serine phosphorylation of IRS-1, disrupting the PI3K-AKT pathway,
  leading to lipolysis and the release of free fatty acids. 4. FFA lead to lipotoxicity
  and insulin resistance in the liver and muscle, due to mitochondrial stress and
  increased ROS. 5. Chronic epileptic activity leads to increased oxidative stress
  and mitochondrial dysfunction in neurons and glial cells, due to decreased activity
  in the electron transport chain and generation of superoxide anions. 6. Mitochondrial
  insufficiency alters the beta-oxidation of fatty acids and ATP synthesis in the
  liver and muscle, leading to lipid accumulation. 7. In obesity, adipose tissue secretes
  pro-inflammatory adipokines: leptin, resistin, TNF-α, IL-6, which perpetuate chronic
  inflammation. 8. IL-6 and TNF-α compromise the BBB by decreasing the expression
  of occludin, claudin-5, and ZO-1, facilitating the entry of cytokines and peripheral
  immune cells into the CNS. 9. Microglia activated by the passage of pro-inflammatory
  molecules perpetuate the neuroinflammation cycle. Upward arrows (↑) indicate increased
  expression, activity, or upregulation; downward arrows (↓) indicate decreased expression,
  activity, or downregulation. Blunt-ended lines (⊣) represent inhibitory signals.
  Numbered arrows (1 to 9) indicate the sequential steps of the neuroinflammation
  cycle described above. Colored circles represent different molecular species: green
  circles, glutamate (Glu); pink/red circles, pro-inflammatory cytokines and adipokines;
  blue circles, GABA; yellow/orange circles, reactive oxygen species (ROS) and lipid-related
  molecules. The double-headed arrows (↔) between microglia and astrocytes indicate
  bidirectional activation. Created in BioRender. Carpinteyro, S. (2026) https://BioRender.com/ie3qud3
  ( accessed on 23 March 2026)'
