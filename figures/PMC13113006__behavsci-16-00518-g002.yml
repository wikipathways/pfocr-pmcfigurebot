caption: The configurations sufficient for high-quality employment and non-high-quality
  employment. Specifically, peripheral conditions exist indicates the condition supports
  the configuration but is less central to the causal pathway. Core conditions exist
  indicates the condition plays a central role in the configuration leading to the
  outcome and appears consistently across simplified solution terms. Absence of a
  peripheral condition indicates the condition is absent but plays a secondary or
  supporting role in the configuration. Absence of a core condition indicates that
  the lack of this condition forms a central component of the configuration associated
  with the outcome. A blank cell signifies that the condition is not relevant or not
  required in the corresponding configuration, which indicates the outcome can occur
  regardless of whether this condition is present or absent
