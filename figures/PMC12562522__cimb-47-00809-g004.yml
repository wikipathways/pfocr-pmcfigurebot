figure_title: HCX3 inhibits the activation of the NF-κB signaling pathway.
caption: 'HCX3 inhibits the activation of the NF-κB signaling pathway. (A) RAW 264.7
  cells were pretreated with the indicated concentrations of HCX3 or 1 μg/mL DEX for
  1 h, followed by LPS stimulation for 3 h. Subsequently, the cells were lysed and
  the phosphorylation levels of p65 and IκB-α, as well as total p65 and IκB-α, were
  detected using Western blotting. β-actin was used as an internal control. (B) Quantitative
  analysis of phosphorylated p65 and IκB-α relative to their non-phosphorylated forms
  from (A). The same stimulation method was applied to BMDM cells, and the same proteins
  was detected using Western blotting (C). The quantitative data were shown in (D).
  The representative Western blot images in (A,C) are from three independent experiments.
  Data in (B,D) are presented as mean ± SEM (n = 3) (ns = not significant, * vs. LPS
  group, # vs. Control group, * p < 0.05; ** p < 0.01; *** p < 0.001; # p < 0.05,
  ## p < 0.01'
