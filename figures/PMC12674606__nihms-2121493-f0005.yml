caption: |-
  NSCLC subtype-specific marker genes characterization by pathway analysis
  and gene-drug-disease network studies. A,B) GO pathway enrichment analysis of
  marker genes for LUAD (A) and LUSC (B), as identified by RPSLearner, revealing
  subtype-specific biological processes. Rich Factor represented the percentage of
  genes in the specific GO terms that were identified as DEGs. C,D) Network
  diagrams illustrated potential drugs repurposing for LUAD (A) and LUSC (B),
  suggesting their possible application in cancer therapy. Red: Target gene, Blue:
  Drug, Green: Disease
