figure_title: Hyperinflammatory MEFISTO and mortality-associated signature
caption: Analysis of 137 samples from 80 patients at 2 time points. (A) Proportion
  of total variance explained per data modality (gene, metabolite). (B) Proportion
  of total variance explained per MEFISTO factor. (C) Association of MEFISTO factors
  with clinical variables at day 0 as determined via Spearman’s correlation for continuous
  predictors and linear regression for categorical predictors (FDR < 0.05). (D) The
  slope of change in factor 3 over time by 90-day mortality. P value derived from
  interaction term of a linear mixed effects regression model with 90-day mortality,
  time point, and their interaction as fixed effects and patient as random effect.
  (E) Top genes in factor 3 by relative scaled weight. (F) Top metabolites in factor
  3 by relative scaled weight. (G) Top enriched gene expression pathways by normalized
  enrichment score (NES) in factor 3. (H) Top enriched metabolic pathways by NES in
  factor 3. ESR, estrogen receptor; plt, platelet; APACHE, Acute Physiology and Chronic
  Health Evaluation III score; BMI, body mass index; Carn, carnitine; FA, fatty acid;
  GFR, glomerular filtration rate; HSC, hematopoietic stem cell; LC, long chain; metab,
  metabolism; MUFA, monounsaturated fatty acid; PUFA, polyunsaturated fatty acid;
  Sat, saturated
