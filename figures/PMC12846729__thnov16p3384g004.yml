figure_title: STING signaling pathway-driven reprogramming of the GBM immune landscape.
caption: 'STING signaling pathway-driven reprogramming of the GBM immune landscape.
  Activation of the cGAS-STING signaling pathway potently stimulates innate interferon
  responses and pro-inflammatory signaling, playing a pivotal role in remodeling the
  immunosuppressive landscape of GBM. Upon activation, the STING signaling pathway
  induces type I IFNs, cytokines (e.g., IL-6, TNF-α), interferon-stimulated genes
  (ISGs), and chemokines (e.g., CXCL9/10/11, CCL2/3/4). This secretory milieu promotes
  recruitment, differentiation, maturation, and priming of various immune cells (e.g.,
  MDSCs, DCs, TAMs, NK cells, neutrophils). STING activation can shift TAMS from a
  suppressive state toward an inflammatory and phagocytic phenotype. Furthermore,
  it facilitates the infiltration and enhances the effector function of CD8⁺ T cells.
  TAMs: tumor-associated macrophages; MDSCs: myeloid-derived suppressor cells; NK
  cells: natural killer cells; DC(s): dendritic cell(s); Tregs: regulatory T cells;
  ICB: Immune Checkpoint Blockade; TLS: tertiary lymphoid structures'
