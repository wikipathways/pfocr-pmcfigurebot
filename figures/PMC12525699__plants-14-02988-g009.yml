caption: 'Changes in TF content, total antioxidant capacity of maize radicles and
  the activity of key enzymes in the flavonoid metabolic pathway under different treatments.
  (a) TF content; (b) T-AOC; (c) 4CL activity; and (d) DFR activity in maize radicles
  of different genotypes under CT or TS treatment conditions. CT: control treatment;
  TS: low-temperature stress; TF: total flavonoid; T-AOC: total antioxidant capacity;
  4CL: 4-coumarate-CoA ligase; DFR: bifunctional dihydroflavonol 4-reductase. Data
  represent the mean ± SE of five replicates (n = 3). **: p < 0.01'
