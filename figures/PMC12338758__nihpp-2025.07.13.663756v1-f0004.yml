figure_title: STRING diagram representing the protein interaction pathway derived
  from 15 muscle-related genes identified as enriched at one day post-deafferentation
  in our neuronal transcriptome
caption: The average local clustering coefficient as reported by STRING was 0.486
  and the protein-protein interaction (PPI) enrichment p-value was <1.0e-16. Known
  interactions from curated databases are shown in turquoise and interactional experimentally
  determined are shown in pink. Predicted interactions are shown in green (gene neighborhood),
  red (gene fusions), and purple (gene co-occurrence). Additional interactions are
  predicted from text mining (light green), co-expression (black), and protein homology
  (light purple)
article_title: Integration of a neuronal RNAseq dataset with the draft Gryllus bimaculatus
  transcriptome refines gene predictions and highlights potential systematic response
  to injury
