figure_title: Proteomic analysis of EnSC- and ASC-derived exosomal proteins.
caption: Proteomic analysis of EnSC- and ASC-derived exosomal proteins. (A) Venn diagram
  of protein identification. (B) Gene ontology (GO) enrichment for differentially
  expressed proteins in endometrial stem cells-exosome (EnSC-ex) and adipose-derived
  stem cells-exosome (ASC-ex). Fold enrichment of top 10 GO terms with significantly
  different protein abundance ratios between EnSC-ex and ASC-ex. GO enrichment analysis
  was performed for proteins meeting differential expression criteria using the Fisher’s
  exact test, reporting terms with a false discovery rate (FDR)<0.05. The red and
  blue bars represent EnSC-ex and ASC-ex, respectively. (C) KEGG pathway analysis
  of protein relative significance (relatively higher in ASC-ex [red] or EnSC-ex [blue];
  adjusted p-value<0.001). (D) Protein-protein interaction (PPI) network analysis
  of axon guidance-related proteins enriched in EnSC-ex
