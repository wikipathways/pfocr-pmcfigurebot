figure_title: Machine learning paradigms for decoding organismal behavior.
caption: 'Machine learning paradigms for decoding organismal behavior. Pathway 2 of
  the dual-pathway framework integrates three paradigms: (a) feature-based learning
  (hypothesis-driven) applies biologist-defined features with interpretable models
  such as SVMs and Random Forests [30,34,35]; (b) representation learning (discovery-driven)
  uses deep neural networks, including CNNs, RNNs, and Transformers, to automate feature
  discovery [37,38,39,40]; and (c) unsupervised learning (hypothesis-generating) employs
  latent embeddings (e.g., VAEs) and clustering algorithms such as HDBSCAN to reveal
  novel behavioral motifs and construct data-driven ethograms [43,44,45,46]. Notes:
  CNN, convolutional neural network; RNN, recurrent neural network; SVM, support vector
  machine; XAI, explainable artificial intelligence; VAE, variational autoencoder;
  HDBSCAN, hierarchical density-based spatial clustering of applications with noise'
