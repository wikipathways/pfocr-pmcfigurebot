figure_title: Subgroup of purine biosynthesis pathway proteins that interact strongly
  also have strong structural similarity
caption: (A) shows median TM scores (red data point) for all groups presented in Fig
  2E (all proteins in folate, purine and pyrimidine pathways, as well as the clusters)
  compared to a null distribution of TM values from the matrix (Table EV3). Only the
  purine cluster (PurD, PurN, PurT, PurM and PurK, total 9 pairs) have a highly statistically
  significant TM-score (*** indicates p-value < 0.001), while all none of the other
  pathway proteins show any significant structural similarity. The null distribution
  is generated from the median values of an equal number of interaction pairs (as
  the cluster size) randomly picked 10,000 times from the matrix (represented by the
  box plot, where the box represents the middle 50% of the data and line in between
  represents the median of the distribution. The whiskers represent the 5–95 percentile
  interval). Statistical significance and p-value are calculated as described in Methods.
  No data normality is assumed. (B) Median fluorescence intensities for all PPI pairs
  which show strong structural similarity (TM score > 0.5). The data shows that while
  high TM score by itself does not guarantee interaction, those in the purine biosynthesis
  pathway show mildly significant interaction propensity. The null distribution and
  p-values are calculated in the same way as panel (A). (C) A similar analysis showing
  median TM scores for all protein pairs that show strong interaction in the split
  YFP assay. The results indicate that structural similarity is not a general mechanism
  that leads to stronger interaction. On the left panel, the distributions of all_MFI>=750
  and all_MFI=<750 are compared using a Student’s t-test, assuming normal distribution
  of data. On the right panel, like panel A and B, the red data point represents the
  cluster median, and the box plot represents the null distribution. p-values are
  calculated as in Methods
