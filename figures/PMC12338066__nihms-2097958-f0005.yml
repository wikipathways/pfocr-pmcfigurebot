figure_title: Humoral immune activity in sRCC
caption: '(A) Cellular communication prediction of signaling between T cell and B
  cell populations from scRNA-seq.(B) Select B lymphocyte pathways enriched in sRCC
  across TCGA KIPAN, CheckMate, and COH cohorts by gene set enrichment analysis. All
  presented q values <0.25. *q<0.05; **q<0.01; ***q<0.001.(C) B Cell abundance by
  xCell immune deconvolution within the IMmotion151 cohort. Mann-Whitney U Test. Horizontal
  lines denote median.(D) Unique B cell receptor and T cell receptor clonotypes per
  patient between sRCC and ccRCC in COH by TRUST4 repertoire reconstruction. Mann-Whitney
  U Test. Horizontal lines denote median.(E) Scatter plot of BCR clonotype abundance
  and TLS Imprint score per sample (top), with separation between sRCC (middle) and
  ccRCC (bottom) in COH. Pearson correlation test.(F) Top: BCR clonotype count per
  patient and corresponding TLS Imprint score in COH. Bottom: TCR clonotype count
  per patient in COH. Clonal fraction classified as follows: Rare (0<x≤1×10−4), Small
  (1×10−4<x≤0.001), Medium (0.001<x≤0.01), Large (0.01<x≤0.05), Hyperexpanded (0.05<x≤1).(G)
  tSNE reduction of B lymphocytes profiled by scRNA-seq. Top: Populations defined
  by Louvain clustering. Bottom: tSNE reductions separated by histology of origin.(H)
  Feature mapping of B lymphocyte-associated genes to scRNA-seq tSNE reduction.(I)
  Differential expression analysis between ccRCC- and sRCC- derived B lymphocytes
  by scRNA-seq.(J) Abundance of antibody-expressing B lymphocytes (defined in panel
  G) relative to total B lymphocytes by scRNA-seq.(K) Scatter plot of relative proportion
  of antibody-expressing B lymphocytes and relative proportion of CXCL13-expressing
  CD8+ T cells per patient as profiled by scRNA-seq. Pearson correlation test.(L)
  CD38 fluorescence amongst CD19+ B cells profiled by full spectrum flow cytometry.(M)
  CD38 expression within CD19+ populations as shown in Panel L by percentage of CD38-positive
  events (left) and MFI (right). Mann-Whitney U Test. Error bars denote standard deviation.(N)
  IgG binding (by MFI) amongst T cell (CD45+CD3+), myeloid (CD45+ CD14/15+), and tumor
  cell (CD45−CD31−CD90−) populations.(O) IgG binding amongst tumor cells between sRCC
  and ccRCC samples.(P) Quantification of IgG binding to tumor cell populations as
  shown in Panel N by percentage of IgG-positive events (left) and MFI (right). Mann-Whitney
  U Test. Error bars denote standard deviation.See also Figure S5 and Tables S2 and
  S4'
