figure_title: Multiple pathways aim to protect cardiomyocytes by suppressing the activation
  of BAK/BAX as the downstream node.
caption: Multiple pathways aim to protect cardiomyocytes by suppressing the activation
  of BAK/BAX as the downstream node. In the condition of ischemia and hypoxia, the
  activation of kinase pathways such as AKT, ERK, and PKM increases the levels or
  activities of anti-apoptotic proteins and decreases the levels or activities of
  pro-apoptotic proteins, while the activation of the nrf2 pathway can inhibit excessive
  ROS-induced cellular damage. These processes ultimately aim to reduce the activation
  of BAK/BAX, thereby decreasing the occurrence of apoptosis
