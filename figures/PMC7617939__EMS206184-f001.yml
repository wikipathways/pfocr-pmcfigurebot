figure_title: Reproductive care pathway for women with pathogenic mtDNA variants
caption: Women are referred for reproductive advice and potential ART to limit the
  transmission of the pathogenic mtDNA variant. The numbers referred and progressing
  through each part of this pathway are shown. Women are assessed at the MRA-C or
  MART-C clinics for assessment prior to either PGT or PNT. *Includes three women
  who had PGT but had no embryos below threshold and were subsequently referred for
  mitochondrial donation. **Births and pregnancies since start of Mitochondrial Reproductive
  Care Pathway. Completed means those women who have failed to become pregnant despite
  a full course of treatment. 51 women who were not able to proceed with either PGT
  or mitochondrial donation, within their reproductive capacity, can be referred back
  to MRA-C. MD – mitochondrial donation
