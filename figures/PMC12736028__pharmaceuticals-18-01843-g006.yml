caption: Effects of (A) coixol and (B) sinigrin on the expression of fat browning-associated
  signaling pathway targets in 3T3-L1 adipocytes. Target gene mRNA expression was
  analyzed using qRT-PCR and normalized to Gapdh using the 2−ΔΔCt method (n = 6).
  Gapdh was used as the housekeeping gene for mRNA analysis, and β-actin as the loading
  control for protein analysis (n = 3). Data are presented as mean ± standard error
  of the mean (SEM). * p < 0.05, ** p < 0.01, and *** p < 0.001 vs. control
