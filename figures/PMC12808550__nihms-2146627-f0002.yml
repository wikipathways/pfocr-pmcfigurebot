figure_title: Schematic of the aryl hydrocarbon receptor (AHR) protein and the signaling
  pathway in the ovary.
caption: Schematic of the aryl hydrocarbon receptor (AHR) protein and the signaling
  pathway in the ovary. (Top) The protein structure of the AHR contains the basic
  helix–loop–helix (bHLH) at the N-terminus (N), with Per/Arnt/Sim A and B domains
  in the middle, and the glutamine-rich (Q-rich) transactivation domain on the C-terminus
  (C). (Bottom) The AHR in the cytoplasm is in complex with AHR-interacting protein
  (AIP), p23, proto-oncogene tyrosine-protein kinase Src (SRC), and two heat shock
  protein 90s (HSP90). Once ligand (L) binds, the AHR translocates to the nucleus
  where the AHR forms a heterodimer with the aryl hydrocarbon receptor nuclear translocator
  (ARNT). A list of example ligands is provided [29]. The heterodimer interacts with
  the xenobiotic response element (XRE) to promote transcription of its downstream
  targets, the aryl hydrocarbon receptor repressor (Ahrr) and the cytochrome P450s
  (Cyp1a1 and Cyp1b1). Figure was created with Biorender.com
