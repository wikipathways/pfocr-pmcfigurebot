figure_title: Neuronal overexpression of intracellular Prx2 reduces infarct size,
  DNA damage, and NAD+ depletion, and inhibits p53/PARP1-mediated cell death.
caption: Neuronal overexpression of intracellular Prx2 reduces infarct size, DNA damage,
  and NAD+ depletion, and inhibits p53/PARP1-mediated cell death. CDK5 phosphorylates
  Prx2 at threonine 89, inactivating it and promoting neuronal death. Extracellular
  Prx2 triggers inflammation by activating dendritic cells via TLR2/4 and inducing
  IL-23/IL-17 signaling. Gas-D suppresses Prx2-induced macrophage activation by inhibiting
  the TLR4/NF-κB pathway
