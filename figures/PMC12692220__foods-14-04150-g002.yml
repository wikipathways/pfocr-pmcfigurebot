caption: 'The metabolic pathway of Bacillus subtilis producing MK-7 is divided into
  five modules, namely CCM pathway, SA pathway, MEP pathway, MK-7 pathway and biosynthesis.
  CCM pathway: GlcK glucose kinase; GlpK glycerol kinase; GlpD glycerol-3-phosphate
  oxidase; Zwf glucose-6-phosphate1-dehydrogenase; Pgi glucose-6-phosphate isomerase;
  GndA NADP+-dependent 6-P-gluconate dehydrogenase; YwlF sugar phosphate isomeras;
  Rpe ribulose-phosphate 3-epimerase; Tkt transketolase; Tal transaldolase; PfkA 6-phosphofructokinase;
  FbaA fructose-bisphosphate al-dolase; GapA glyceraldehyde-3-phosphate dehydrogenase;
  Pgk phosphoglycerate kinase; Eno enolase; TpiA tri-osephosphate isomerase; Pyk pyruvate
  kinase; PckA phosphoenolpyruvate carboxykinase; GltA citrate synthase; CitB aconitate
  hydratase; Icd isocitrate dehydrogenase; OdhB 2-oxoglutarate dehydrogenase E2 component;
  SucD suc-cinyl-CoA synthetase alpha subunit; SdhA succinate dehydrogenase flavoprotein
  subunit; SdhB succinate dehydro-genase iron-sulfur subunit; Mdh malate dehydrogenase;
  FumC fumarate hydratase; Pdh pyruvate dehydrogenase; AraM glycerol-1-phosphate dehydrogenase;
  MgsA methylglyoxal synthase; BdhA 2,3-butanediol dehydrogenase; Ack Acetate kinase
  MEP pathway: Dxs 1-deoxy-D-xylulose-5-phosphate synthase; Dxr 1-deoxy-D-xylulose-5-phosphate
  reductoisomerase; IspD 2-D-methyl-D-erythritol 4-phosphate cytidylyltransferase;
  IspE 4-diphosphocytidyl-2C-methyl-D-erythritol kinase; IspF 2-C-methyl-D-erythritol
  2,4-cyclodiphosphate synthase; IspG 4-hydroxy-3-methylbut-2-en-1-yl diphosphate
  synthase; IspH 4-hydroxy-3-methylbut-2-enyl diphosphate reductase;Fni isopentenyl-diphosphate
  delta-isomerase; IspA farnesyl diphosphate synthase; HepS heptaprenyl diphosphate
  syn-thase component 1; HepT heptaprenyl diphosphate synthase component 2 MK-7 pathway:
  MenF menaquinone-specific isochorismate synthase; MenD 2-succinyl-5-enolpyruvyl-6-hydroxy-3-cyclohexene-1-carboxylate
  synthase; MenH 2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate synthase; MenC
  o-succinylbenzoate synthase; MenE 2-succinylbenzoate-CoA ligase; MenB 1,4-dihydroxy-2-naphthoyl-CoA
  synthase; YuxO 1,4-dihydroxy-2-naphthoyl-CoA hydrolase; MenA 1,4-dihydroxy-2-naphthoate
  polyprenyltransferase; MenG deme-thylmenaquinone methyltransferase; SA pathway:
  AroA 3-deoxy-D-arabino-heptulosonate 7-phosphate synthase; AroB 3-dehydroquinate
  synthase; AroC 3-dehydroquinate dehydratase; AroD shikimate 5-dehydrogenase; AroE
  5-enolpyruvoylshikimate-3-phosphate synthase; AroF chorismate synthase; AroK shikimate
  kinase Biosynthesis: AroH chorismate mutase; TrpE anthranilate synthase; PabB para-aminobenzoate
  synthase; PabA anthranilate synthase'
