figure_title: ASPN-induced signaling overlaps but is distinct from NRG1β, a HER3 ligand
caption: (A and B) LNCaP cells treated with 15 ng/mL recombinant human NRG1β over
  a time course and assessed by immunoblotting for HER2 and HER3 pathway activation
  (A) and quantification (B) (n = 3). (C and D) MyC-CaP cells treated with 15 ng/mL
  recombinant mouse NRG1β over a time course and assessed by immunoblotting for HER2
  and HER3 pathway activation (C) and quantification (D) (n = 3). (E and F) Heatmaps
  of LNCaP (E) and MyC-CaP (F) cells treated with 15 ng/mL recombinant human or mouse
  NRG1β for 0, 12, and 24 hours (n = 3). (G and H) Bubble plots of top 20 overlapping
  Oncogenic Signatures by GSEA of LNCaP and MyC-CaP cells treated with 15 ng/mL recombinant
  NRG1β for 12 hours (G) and 24 hours (H) compared with time 0. Pathways marked in
  blue represent signatures also upregulated in ASPN RNA-Seq at 12 and 24 hours. For
  Western blots in A and C, total proteins were normalized to GAPDH, and phosphorylated
  proteins were normalized to GAPDH and total protein. Graphs in B and D are shown
  as mean ± SEM and analyzed by 1-way ANOVA with Dunnett’s post hoc analysis; *P ≤
  0.05, **P ≤ 0.01, ***P ≤ 0.001, ****P ≤ 0.0001
article_title: Identification of asporin as a HER3 ligand exposes a therapeutic vulnerability
