figure_title: Three membrane fusion pathways.
caption: Three membrane fusion pathways. (A) SNAREs and class I superfamily fusogens,
  slender α-helical rods. Our simulations suggest these fusogens use a common pathway
  to fuse small membrane compartments. Entropic forces (arrows) squeeze membranes
  and drive a boundary hemifusion stalk. The rods then surround and entropically expand
  the stalk into a fusion pore. (B) Class II fusogens, bulky β-sheet-rich rods. This
  pathway is similar to (A), but following hemifusion the bulky fusogens cannot surround
  the stalk and instead line its edge and entropically expand it longitudinally. Simple
  pores rapidly form in each vesicle that the stalk encircles to make a fusion pore.
  (C) Brute force. A third pathway may be used when large interfaces are created,
  e.g. SNARE-mediated fusion of vacuoles in plants and fungi. The pathway is similar
  to (B), but several fusion pores elongate along the boundary edge and merge to release
  an intralumenal vesicle
