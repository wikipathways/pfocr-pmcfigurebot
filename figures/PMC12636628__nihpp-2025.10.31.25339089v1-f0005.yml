figure_title: Sex-biased enrichment of biological pathways, cell-type specificity,
  and drugs
caption: A) Sex-biased prioritized AD genes were used for sex-stratified pathway enrichment
  analyses, followed by retaining FDR significant pathways, filtering for sex specificity,
  and clustering. Violin plots display final pathway GO terms in their respective
  clusters (top, female; bottom, male). B) Sex-biased prioritized genes were evaluated
  for cell-type expression specificity, showing significant (*) enrichment for microglia
  and astrocyte specific genes in women (red bars). C-F) Drug enrichment analyses
  were conducted per sex and filtered for FDR significance and sex specificity. Bar
  graphs display top 10 enriched drugs based on top prioritized genes (score-1) in
  C) women and D) men. E) A subset of sex hormone-related drugs was observed solely
  for female-prioritized genes. F) The genes and drug network underlying findings
  in (E) are displayed, including prioritized female-biased AD genes (dark red), their
  connected, druggable AD-related genes (bright red), and their connections with sex
  hormone-related drugs (beige), centered on Endothelial growth factor receptor (EGFR)
