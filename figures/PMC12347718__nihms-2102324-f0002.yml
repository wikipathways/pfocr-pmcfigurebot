figure_title: SARS-CoV-2 variants have distinct effects on the megakaryocyte transcriptome.
caption: SARS-CoV-2 variants have distinct effects on the megakaryocyte transcriptome.
  (A) Amplification plots of SARS-CoV-2-specific real-time polymerase chain reaction
  (RT-qPCR) of CD34+-derived MKs co-incubated with WA1, Delta or Omicron SARS-CoV-2
  isolates or vehicle control (n = 4) for 24 hours. (B-D) Volcano plot of differentially
  expressed genes (DEGs) between vehicle control and SARS-CoV-2 WA1, Delta or Omicron
  (B, C and D, respectively). Colored dots are p < .05; red dots represent up-regulated
  and blue dots down-regulated genes. (E-G) Ingenuity Pathway Analysis (IPA) of DEGs
  identified upon co-incubation with SARS-CoV-2 WA1, Delta or Omicron (E, F and G,
  respectively). The top 5 up-regulated and top 5 down-regulated pathways are presented
  for each SARS-CoV-2 variant (p < .05). (H) Venn diagram depicting shared DEGs between
  SARS-CoV-2 isolates. (I) Heatmap of overlapping DEGs between SARS-CoV-2 variants.
  Z-scores were computed gene-by-gene by subtracting the mean of normalized counts
  and dividing by the standard deviation
