figure_title: 'NO-centered therapeutic strategies in lung cancer: (a) Therapies inhibiting
  NO production by targeting the molecular pathways involved, such as the STAT/NF-κB/HIF-1α
  pathway, by silibinin.'
caption: 'NO-centered therapeutic strategies in lung cancer: (a) Therapies inhibiting
  NO production by targeting the molecular pathways involved, such as the STAT/NF-κB/HIF-1α
  pathway, by silibinin. L-NAME acts as a pan-inhibitor of NOS enzymes, while β-Elemene
  inhibits the Prx-1/NF-kB/iNOS signaling pathway and reduces the expression of EMT/CSC
  markers. (b) Therapies based on exogenous administration of NO to potentiate its
  anti-tumor effects. UHCgNO increases the RNS levels, causing DNA damage and, from
  an immunological perspective, causes a rise in T and B cells in both the spleen
  and blood, while the MDSC levels decrease in the spleen. SNAP and SNP decrease survival
  activity, inducing cancer cell death. JS-K increases the RNS, ROS, and GSSG levels,
  determining an inhibitory effect on cancer cells. [Zn (PipNONO)Cl] inhibits EMT
  and EndMT by interfering negatively with the expression and activity of TGF-β1,
  inhibiting cancer progression'
