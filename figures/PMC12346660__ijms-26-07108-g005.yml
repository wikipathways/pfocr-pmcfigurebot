caption: 'Broad spectrum metabolomic alterations in HeLa cells after cholesterol exposure.
  (A,B) Volcano plots of DAMs in the negative (A) and positive (B) ion modes. Each
  dot represents a metabolite: blue = downregulated, red = upregulated, and purple
  = no significant change. DAMs are defined by |log2FC| > 0.38 (1.3-fold) and p-value
  < 0.05. (C,D) Heatmaps of DAMs in the negative (C) and positive (D) ion modes. Rows
  = metabolites, columns = samples (cholesterol/vehicle groups). Color intensity reflects
  expression ratio. (E,F) KEGG pathway enrichment of DAMs in the negative ion mode
  (E) and positive ion mode (F)'
