figure_title: miR-6126 suppresses the glycolysis pathway in triple-negative breast
  cancer (TNBC) cell line.
caption: 'miR-6126 suppresses the glycolysis pathway in triple-negative breast cancer
  (TNBC) cell line. (A) MDA-MB-231 cells were not transfected (NT), transfected with
  siRNA negative control (NC) or siGRP78. Protein levels were determined by Western
  blotting. (B) MDA-MB-231 cells were transfected with miRNA mimics negative control
  (NC) or 20 nM miR-6126 mimics. Protein levels were determined by Western blotting.
  β-actin and GADPH were served as a loading control. (C) MDA-MB-231 cells were transfected
  with cDNA negative control (Mock) or 2 μg, 4 μg or 6 μg cDNA of GRP78. Protein levels
  were determined by Western blotting. (D) MDA-MB-231 cells were transfected with
  miR-6126 mimics or siGRP78, then incubated with a fluorescent glucose derivative,
  2-NBDG, for 30 min before examination by fluorescence microscope 100X (Scale bars:
  100μm). Fluorescence intensity of 2-NBDG uptake was analysed by flow cytometry.
  Phloretin was used as a natural phenol that inhibits glucose uptake. (E) Lactate
  production was performed by using Lactate Colorimetric/Fluorometric Assay Kit. Values
  shown are means ± SD. Quantification of the result is shown (n=3) ns: no significant,
  *p < 0.05, **p < 0.01, ***p < 0.001 versus untreated control cells'
