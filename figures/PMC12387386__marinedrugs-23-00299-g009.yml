figure_title: Mechanisms of action of biofunctional polar lipids with UFA (MUFA or
  ω-3-PUFA) in their structures, derived from fish and their by-products, against
  thrombo-inflammatory signaling and associated inflammatory cell responses and manifestations.
caption: 'Mechanisms of action of biofunctional polar lipids with UFA (MUFA or ω-3-PUFA)
  in their structures, derived from fish and their by-products, against thrombo-inflammatory
  signaling and associated inflammatory cell responses and manifestations. (Red colors:
  representative signaling of thrombo-inflammatory stimuli induced by the presence
  of several risk factors, such as those of PAF and thrombin, which, via the pathways
  shown, propagate the inflammatory cell responses. Blue colors: bioactive polar lipids
  (PLs) rich in UFA (MUFA or ω3-PUFA) from fish or their by-products can beneficially
  affect all these signaling pathways and transcription factors and thus further inhibit
  the expression of thrombo-inflammatory genes and associated cell responses (the
  blue X represents an inhibitory effect on a pathway and/or an enzyme and/or a receptor
  and/or a transcription factor and/or the expression of thrombo-inflammatory genes
  by fish-derived bioactive polar lipids, as indicated by the blue arrows). Abbreviations:
  UFA = unsaturated fatty acid; MUFA = monounsaturated fatty acids; PUFA = polyunsaturated
  fatty acids; PAF = platelet-activating factor; GPCMR = G-protein-coupled membrane
  receptors; PAF-R = PAF-receptor; PAR = protease-activated receptors for thrombin;
  PAF-CPT and LPCAT = the basic biosynthetic enzymes of the two distinct pathways
  of PAF-synthesis, PAF-cholinephosphotransferase and lyso-phosphatidylcholine acetyltransferase
  2, respectively; cPLA = cytoplasmic phospholipase A2; MAPK = mitogen-activated protein
  kinase; IP3 = inositol trisphosphate; OA = oleic acid; ALA = alpha-linolenic acid;
  COX = cyclooxygenase; NF-kB = nuclear factor kappa beta; IKB = inhibitor of NF-kB;
  ROS = reactive oxygen species; PL = polar lipids; Ox-PL = oxidized phospholipids;
  ADP = adenosine diphosphate; PLCβ = phospholipase C beta (Cell/nucleus membranes/structures
  depicted were reproduced from https://mindthegraph.com/ and https://smart.servier.com/,
  both accessed 25 June 2025. Information on the mechanisms involved and the activities
  of fish PLs were retrieved from Tsoupras et al., 2022 [196])'
