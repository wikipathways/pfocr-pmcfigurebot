figure_title: Schematic depicting Sphk1/S1P/S1PR2 modulation of mitochondrial function
  to promote vascular remodeling and PAH
caption: In PASMCs hypoxia leads to upregulation of Sphk1, which catalyzes the conversion
  of sphingosine (sph) to sphingosine-1-phosphate (S1P). S1P is transported to the
  extracellular environment by the Spns2 transporter allowing S1P to engage its receptor,
  S1PR2, to stimulate intracellular signaling events. The ERK pathway is activated
  to induce Egr-1 translocation to the nucleus to transactivate HIF1α. HIF1α leads
  to decreased respiration and increased glycolysis and mitochondrial fragmentation
  to promote PASMC proliferation. Engagement of S1PR2 also leads to activation of
  eIF2α which induces ATF-5 nuclear localization and activation of a transcriptional
  program that promotes the UPRmt and PASMC proliferation. During S1P signaling mitochondrial
  ROS is generated, which signals mitochondrial stress, a of stimulant of UPRmt activation.
  The Sphk1/S1P/S1PR2 signaling axis leads to activation of two transcription programs
  via, HIF1α and ATF-5, to promote PASMC proliferation which leads to increased pulmonary
  vascular resistance to promote the PAH pathogenesis
article_title: The mitochondrial unfolded protein response and metabolic reprogramming
  promote PASMC proliferation in response to sphingosine kinase-1/sphingosine-1-phosphate
  signaling
