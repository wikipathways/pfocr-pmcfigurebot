figure_title: This illustrates the role of PTPN1 and PTPN2 inhibitors in regulating
  cytokine-induced JAK-STAT signaling pathways.
caption: This illustrates the role of PTPN1 and PTPN2 inhibitors in regulating cytokine-induced
  JAK-STAT signaling pathways. Under normal conditions, cytokine binding to its receptor
  activates the JAK kinases, which phosphorylate downstream targets and drive the
  transcription of pro-inflammatory genes. PTPN1 and PTPN2, acting as protein tyrosine
  phosphatases, negatively regulate this pathway by dephosphorylating key signaling
  intermediates, effectively dampening the inflammatory response. The inhibition of
  PTPN1/2 prevents their dephosphorylation activity, thereby sustaining JAK-STAT activation
  and enhancing the production of inflammatory cytokines. This dysregulated signaling
  is linked to chronic inflammation and oxidative stress, which contribute to neurodegeneration
  in diseases like ALS, AD, and PD. However, targeted inhibition of PTPN1/2 offers
  a novel therapeutic approach to restore redox balance by suppressing cytokine-driven
  inflammation
