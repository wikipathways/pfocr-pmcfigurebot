figure_title: Elements of direct optogenetic therapy
caption: 'a, Light-activated mechanism for transmembrane ion conductance. Shown are
  the inner workings of a cation-conducting (excitatory) channelrhodopsin. The orange
  structure is the all-trans retinal chromophore that receives the photon and isomerizes
  to drive channel opening; the gray spheres represent water molecules; the green
  cylinders depict the transmembrane α-helices; the orange circles represent sodium
  ions; and the vertical arrows indicate the cation conduction pathway. b, Established
  strategy for direct optogenetic therapy: optogenetic vision restoration in retinitis
  pigmentosa. (i) AAV delivering the channelrhodopsin gene is injected into the patient’s
  retina, leading to (ii) expression (represented by blue dots on the cell surface)
  in retinal ganglion cells (RGCs). (Note that this disease involves the loss of photoreceptors,
  not ganglion cells.) (iii) Light delivery activates expressing cells (represented
  by red dots on the cell surface). c, Diagram illustrating the delivery route for
  the gene (indicated by the gray needle delivering viral particles) and light (indicated
  by the arrow following the physiological route through the pupil and lens to the
  retina at the back of the eye). d, Light is emitted at sufficient intensity by special
  goggles, which capture the environment through a camera and stimulate the retina
  through a projector to generate an image. Panel a adapted from ref. 15, AAAS'
article_title: Roadmap for direct and indirect translation of optogenetics into discoveries
  and therapies for humans
