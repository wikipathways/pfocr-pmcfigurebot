figure_title: Proposed model of NO-mediated EBR regulation of cucumber tolerance to
  alkaline stress.
caption: Proposed model of NO-mediated EBR regulation of cucumber tolerance to alkaline
  stress. NaHCO3 stress induces sodium toxicity, oxidative imbalance, high-pH stress,
  and water stress, thereby inhibiting cucumber growth. Exogenous EBR enhances stress
  tolerance by relying on NO as a downstream signaling molecule to coordinate multiple
  defense pathways. EBR-induced NO signaling promotes organic acid accumulation to
  buffer cellular pH and alleviate high-pH stress; enhances aquaporin expression to
  relieve water stress; activates the SOS pathway together with H+-ATPase and H+-PPase
  activities to facilitate sodium efflux and vacuolar compartmentalization; and stimulates
  the antioxidant system, including antioxidant enzymes and the ascorbate–glutathione
  cycle, to reduce reactive oxygen species accumulation and oxidative damage. These
  coordinated effects collectively mitigate growth inhibition in cucumber seedlings
  exposed to sodium bicarbonate stress (The yellow boxes represent the types of physiological
  damage caused by alkaline stress; the red boxes indicate factors upregulated by
  exogenous NO and EBR; and the green boxes indicate factors downregulated by NO and
  EBR)
