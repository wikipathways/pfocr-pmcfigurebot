caption: 'GO and KEGG enrichment analyses were conducted on intersecting target genes:
  (A) The GO bubble diagram illustrates the annotation of these intersecting genes
  across BP, CC, and MF. The x-axis represents the gene ratio, which is calculated
  as the number of genes from the target gene set belonging to a specific GO term
  divided by the total number of genes in that GO term. The y-axis displays the names
  of the GO functional entries. The color gradient indicates the corrected p-value,
  with a deeper red signifying greater significance. The size of the bubbles corresponds
  to the number of enriched genes, with larger bubbles indicating a higher gene count.
  (B) The GO circle diagram provides a detailed view of gene enrichment across various
  GO entries. The outermost circle scale represents the total number of genes, expressed
  as a power of 10. The first circle denotes the pathway number and classification.
  The length of the rectangles in the second circle reflects the number of genes associated
  with each term, with darker colors indicating higher enrichment significance. The
  length of the rectangles in the third circle represents the number of genes overlapping
  with the GO entry in the input gene set. The fourth circle illustrates the ratio
  of the number of genes in the third circle to the corresponding number of genes
  in the second circle. (C) The KEGG histogram illustrates the enriched pathways of
  the intersecting genes. The x-axis denotes the number of genes within each pathway,
  while the y-axis lists the names of the pathways. The color gradient of the bars
  indicates the corrected p-value, with a deeper red signifying greater significance'
