figure_title: Mechanism of activation of CBs glomus cells by opioids
caption: 'Schematic representation of the cellular mechanisms underlying glomus cell
  activation. Activation of κ-opioid receptors leads to increases in intracellular
  Ca12+ concentration, increasing neurotransmitter release. However, it is not yet
  possible to determine whether the increase in intracellular Ca2+ originates from
  influx through Ca2+ channels or from release from the endoplasmic reticulum (ER).
  The released neurotransmitters activate sensory fibers that innervate glomus cells,
  generating action potentials that propagate to the brainstem. Note that many aspects
  represented in the figure remain unanswered, such as: (i) do sensory fibers express
  receptors for opioids?; (ii) in addition to activating glomus cells, can opioids
  activate glial cells of the CBs?; and (iii) which intracellular pathway(s) are recruited
  after activation of the k opioid receptor that leads to the opening of Ca2+ channels
  and/or the release of intracellular Ca2+ stores? Created with BioRender.com'
