figure_title: A schematic model of Hippo pathway regulation in non-cancerous and endometrioid
  cancer cells.
caption: 'A schematic model of Hippo pathway regulation in non-cancerous and endometrioid
  cancer cells. Upper panel: In non-cancerous cells, the Hippo pathway regulates the
  dynamic subcellular localization of YAP/TAZ. When the Hippo pathway is ON, the MST1/2–SAV1
  complex activates the LATS1/2–MOB1A/B complex through a kinase cascade, resulting
  in phosphorylation of YAP/TAZ. Phosphorylated YAP/TAZ (indicated by P in the figure)
  are retained in the cytoplasm and degraded, preventing their nuclear accumulation
  and downstream gene transcription. In contrast, when the Hippo pathway is OFF, YAP/TAZ
  remain unphosphorylated, accumulate in the nucleus, bind to TEAD transcription factors,
  and activate gene expression. Therefore, in non-cancerous cells, cell proliferation
  is controlled by turning the Hippo pathway ON and OFF. Bottom panel: Based on the
  findings of this study, endometrioid cancer cells exhibit reduced Hippo pathway
  activity (Hippo OFF), leading to the nuclear accumulation of YAP/TAZ and the enhanced
  transcription of target genes such as GLUT1. Upregulation of GLUT1 promotes glucose
  uptake and contributes to cancer cell proliferation, survival, and invasion'
article_title: YAP/TAZ Promote GLUT1 Expression and Are Associated with Prognosis
  in Endometrial Cancer
