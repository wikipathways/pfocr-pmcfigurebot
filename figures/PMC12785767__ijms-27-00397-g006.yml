figure_title: Stage-specific regulation of lipid metabolism genes in mouse oocytes.
caption: 'Stage-specific regulation of lipid metabolism genes in mouse oocytes. (a)
  Heatmap of lipid metabolism gene expression. Dynamic changes across GV and MII stages,
  categorized by: Fatty Acid Biosynthesis (FAB), Elongation (FAE), and Degradation
  (FAD) or shared between 2 modules. Color scale: Z-score of expression (red: upregulated;
  blue: downregulated). Shared genes are annotated. (b) Pathway activity scores across
  maturation stages. Module scores reveal that all three modules (Biosynthesis, Elongation,
  Degradation) show no significant differences between the GV and MII stages in mouse
  oocytes (p > 0.05 for all comparisons). (c) Effect-size analysis of module-specific
  genes. Cohen’s d values (GV vs. MII) indicating GV-enriched (highlighted) or MII-enriched
  (hollow circle) genes. (d–h) Stage-dependent expression of shared genes. Box plots
  illustrate the expression patterns of significantly shared genes across lipid metabolism
  modules, revealing a general downregulation from GV to MII oocytes. In contrast,
  Acsl3 shows significant upregulation (****, p < 0.001). (i,j) Cpt1 gene expression
  dynamics. Both Cpt1b, c are significantly reduced at the MII stage compared with
  GV. (k) Cpt2, a key enzyme mediating acylcarnitine-to-acyl-CoA conversion, exhibits
  significant downregulation during oocyte maturation. Statistical significance is
  indicated as * p < 0.05, ** p < 0.01, *** p < 0.001; ns, not significant (p > 0.05)'
