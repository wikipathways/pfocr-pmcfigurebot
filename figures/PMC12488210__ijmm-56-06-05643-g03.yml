figure_title: Signalling pathways and cellular interactions mediated by microglia
  in DR.
caption: Signalling pathways and cellular interactions mediated by microglia in DR.
  In DR, microglia express receptors such as C3a and C5a receptors, VEGFR and TLR4.
  The activation of these receptors triggers intracellular signalling pathways which
  subsequently activate downstream kinases. These signalling cascades lead to the
  activation of transcription factors such as NF-κB, resulting in the production and
  release of pro-inflammatory cytokines including IL-1β, TNF-α and IL-6. The released
  pro-inflammatory cytokines then act on Müller cells, promoting the release of VEGF.
  This process highlights the role of microglia in mediating inflammatory responses
  and angiogenesis in DR through these signalling pathways. DR, diabetic retinopathy;
  TLR-4, Toll-like receptor 4; MyD88, myeloid differentiation primary response 88;
  IRAK-4, interleukin-1 receptor-associated kinase 4; TRAF6, TNF receptor-associated
  factor 6; IKK, IκB kinase
