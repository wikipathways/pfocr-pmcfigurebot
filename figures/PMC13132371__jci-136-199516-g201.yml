figure_title: CD138+ TAMs facilitate the progression of PDAC by promoting tumor immune
  evasion
caption: (A) Experimental approach utilized for the adoptive transfer of CD138+ or
  CD138– TAMs isolated from CD45.1+ orthotopic tumors into CD45.2+ orthotopic KPC
  mice. (B and C) Quantification of tumor weight in mice (B) and the number of Ki67+
  cells per ×40 field in tumor sections (C) (n = 6 per group). HPF, high power field.
  (D) Overall survival probabilities of mice that received the adoptive transfer (n
  = 8 per group). (E) Quantification of the frequencies of effector cell subsets within
  CD45+ cells in tumor tissues (n = 6 per group). (F) Analysis of UMAP (left) and
  the proportions (right) of CD8+ T cell clusters in tumor tissues. (G) Heatmap of
  the relative expression of effector cytokines in tumor-infiltrating CD8+ T cells.
  (H) GSEA of the gene set related to IFN-γ production. (I) GSEA of pathways associated
  with CD8+ T cell proliferation and activation. (J) Quantification of tumor weight
  in mice (n = 9 per group). (K and L) Quantification of the number of Ki67+ cells
  (K) and the percentage of CC3+ area (L) per ×40 field in tumor sections (n = 6 per
  group). CC3, cleaved caspase-3. (M) Overall survival probabilities of control and
  Sdc1-cKO mice (n = 8 per group). (N) Quantification of the frequencies of effector
  cell subsets within CD45+ cells in tumor tissues (n = 9 per group). (O) Analysis
  of UMAP (left) and the proportions (right) of CD8+ T cell clusters in tumor tissues.
  (P) Heatmap of the relative expression of effector cytokines in tumor-infiltrating
  CD8+ T cells. (Q) GSEA of the gene set related to IFN-γ production. (R) GSEA of
  pathways associated with CD8+ T cell proliferation and activation. *P < 0.05, **P
  < 0.01, and ***P < 0.001 by Kruskal-Wallis test with Dunn’s multiple-comparison
  test (B and E), by log-rank analysis (D and M), and by unpaired 2-tailed Student’s
  t test (J–L and N). Data represent mean ± SEM
article_title: A CD138+ tumor-associated macrophage/Siglec-F+ neutrophil feed-forward
  loop promotes immune evasion in pancreatic cancer
