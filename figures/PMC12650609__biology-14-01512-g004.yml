figure_title: LPS-primed BV-2 microglia exhibit enhanced migratory activity mediated
  by ERK1/2 signaling pathway.
caption: 'LPS-primed BV-2 microglia exhibit enhanced migratory activity mediated by
  ERK1/2 signaling pathway. BV-2 cells after the second challenge on day 4 (100 ng/mL
  LPS) under normoxic and hypoxic conditions were analyzed for their (A) migratory
  ability using the in vitro transwell migration assay and (B, N = 5) the number of
  migrated cells (DAPI-stained nuclei) was expressed as the absolute number of transmigrated
  cells. Protein expression of (C) phospho-ERK1/2 (N = 5) were assayed by Western
  blotting and quantified (unprimed cells under normoxia assigned as 1.0). RNA samples
  collected 6 h after the second challenge were analyzed for gene expression of (D)
  CD11a and (E) MMP9 (N = 4, normalized to GAPDH; unprimed cells under normoxia assigned
  as 1.0) by real-time PCR. Results are depicted as scatter dot plots, mean + SD,
  2-Way ANOVA, * p < 0.05, * versus unprimed (UP) control; # p < 0.05, # versus normoxic
  condition (white bar)'
