figure_title: Transcriptional and functional characterization of LCs activation state
caption: a. scRNA-seq analysis identified three major transcriptional states of LCs
  —steady, activated, and migratory — separated by UMAP clustering. For in-depth regulon
  and pathway analysis, the dataset was further subdivided into eight transcriptionally
  distinct substages. b. Differential gene expression and flow cytometry analysis
  demonstrates that activated LCs can be distinguished from steady and migratory populations
  using surface markers such as Cd137, Cd14, and Ly6a. Flow cytometry is representative
  data (n = 3 mice). c. During activation, the majority of LCs exit the proliferative
  cycle and undergo mitotic arrest, indicating a functional shift from self-renewal
  to immune engagement
article_title: An intermediate activation state primes Langerhans cell migration from
  the epidermis
