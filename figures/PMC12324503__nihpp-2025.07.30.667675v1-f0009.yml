figure_title: Pseudotime trajectory inference analysis, differential gene expression,
  and gene ontology enrichment in vascular endothelial cells
caption: (A); UMAP of endothelial cells from all scRNAseq samples. (B); UMAP split
  by condition and clustered according to neonatal age (P0, P5 and P10). (C); Condition-split
  UMAP showing cells within pseudotime trajectory highlighted, cell colors correspond
  to time along trajectory. Principal curves are shown as black line along trajectory.
  Arrows show pseudotime trajectory directionality. (D); Subset UMAP showing only
  cells within pseudotime trajectory (colored cells in C), clustered by sample age
  (left). Dot plot of top 20 DEGs for each age from cells within pseudotime trajectory
  (right). (E); Dot plot of GO enrichment results showing top 15 enriched pathways
  per neonatal age. (F); Key pathways of interest depicted as a category network plot
  (cnetPlot) showing GO terms and related genes for each neonatal age
