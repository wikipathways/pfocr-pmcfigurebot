figure_title: Cholesterol metabolism genes in astrocytes and oligodendrocytes
caption: '(A) Pathway analysis of differentially expressed genes (DEGs) in astrocytes
  induced by acute methamphetamine treatment, based on WikiPathways.(B) Violin plots
  showing expression levels of significant DEGs in the SREBP pathway. For each gene,
  saline and methamphetamine groups were compared using the Wilcoxon rank-sum test;
  *** p < 0.001.(C, D) Volcano plots showing adjusted p-values and log2 fold changes
  for genes associated with cholesterol metabolism in astrocytes (C) and oligodendrocytes
  (D) (cutoff: FDR < 0.1, absolute fold change > 1.2)'
article_title: Dynamic Regulation of Cholesterol Metabolism Genes in Dopaminergic
