figure_title: SGCC reveals coordinated spatial multi-modal interactions and EBV-linked
  cell states in the tumor-macrophage-CD4 T cell axis
caption: '(A) Analysis of tumor-macrophage spatial relationships. Top: SGCC-ranked
  spatial distributions and representative images. Middle: EBV score (transcript levels),
  LMP1+ tumor cells, and tumor-associated signaling pathways across SGCC scores. Bottom:
  Changes in macrophage polarization states (based on MoMacVERSE signature (49)) and
  associated pathway signatures with increasing SGCC scores. Each column shows an
  individual ROI. Full pathway names are in Supp Table 7. (B) Analysis of macrophage-CD4
  T cell spatial relationship. Top: SGCC-ranked spatial distributions and representative
  images. Middle: Changes in HLA-DR and PD-L1 expression in macrophage and functional
  programs across SGCC scores. Bottom: Changes in T cell dysfunction signatures (RNA
  and protein) and immune signaling pathways across SGCC scores. Each column shows
  an individual ROI. Full pathway names are in Supp Table 7. (C) Ternary plot depicting
  a three-way SGCC relationship between CD4 T cells and tumor (top vertex), CD4 T
  cells and macrophages (bottom left vertex), and macrophages and tumor (bottom right
  vertex). Points located near the vertices indicate colocalization between two specific
  cell types while forming a complementary structure with the third cell type (e.g.
  the ROI from Rochester 4 at the left bottom end of the triangle demonstrates colocalization
  between CD4 T cells and macrophages while complementing the tumor). In contrast,
  points near the center of the triangle may signify colocalization among all three
  cell types. EBV-positive and EBV-negative samples are indicated in circle and triangle,
  respectively). (D) Ternary plots across the tumor-macrophage-CD4 T cell axis colored
  by their expression of key immune dysfunction features (top two rows) or adjacency
  enrichment statistic (AES) (bottom row) (Supp Table 8). (E) Correlation of LMP1-expressing
  tumors with CD4 T cell dysfunction signatures and macrophage polarization states
  across protein and RNA levels. (F) Cartoon model depicting contrasting immune state
  differences in the tumor-macrophage-CD4 T cell interaction axis between EBV-positive
  (immune-suppressive) and EBV-negative (immune-active) DLBCL TMEs'
