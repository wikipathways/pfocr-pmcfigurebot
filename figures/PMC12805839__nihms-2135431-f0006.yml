figure_title: Cutaneous exposure to OVA + SEB enhances Th2 cell polarization by skin
  dLN DCs
caption: (A) Experimental protocol for testing Th2 cell polarization by CD11c+ cells
  from dLNs of mouse skin exposed to OVA + SEB (DCOVA + SEB), OVA alone (DCOVA), SEB
  alone (DCSEB), or saline (DCSal).(B) Cytokine secretion, 4–5 mice/group.(C) Percentage
  of DQ-OVA+ CD11c+MHC class IIhigh skin in skin dLNs of mice exposed to DQ-OVA (DCDQ-OVA)
  or DQ-OVA + SEB (DCDQ-OVA + SEB) and mean fluorescence intensity (MFI) of DQ-OVA,
  5 mice/group.(D) MFI of MHC class II, CD40, CD80, and CD86 in DCDQ-OVA and DCDQ-OVA
  + SEB, 5 mice/group.(E and F) Ingenuity pathway analysis (E) and gene expression
  heatmap of IL-14/IL-13 regulated genes (F) in DCOVA + SEB and DCOVA, 8 mice/group.
  (G and H) Percentage and MFI of PDL2+ cells (G) and RELMα+ cells (H) among CD11c+MHC
  class IIhigh DCOVA + SEB and DCOVA, 5 mice/group.For (B)–(D), (G), and (H), a representative
  experiment out of 2 is shown. Data are presented as mean ± SEM. ***p < 0.001, ****p
  < 0.0001; ns, not significant by one-way ANOVA with Tukey’s post hoc analysis in
  (B) and Student’s t test in (C), (D), (G), and (H).See also Figure S5
