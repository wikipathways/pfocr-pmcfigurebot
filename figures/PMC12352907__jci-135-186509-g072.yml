figure_title: Listerin inhibits the degradation of ABCA1 through the ESCRT lysosome
  pathway
caption: '(A and B) Immunoblot analysis of ABCA1 expression in PMs from Listerinfl/fl
  and Listerinfl/fl Lyz2Cre mice treated for 12 hours with oxLDL (50 μg/mL) and proteasome/lysosome
  inhibitors (MG132, calpeptin, chloroquine, NH4Cl, bafilomycin A1, 3-MA, wortmannin,
  DBeQ). n = 5 per group. (C) ABCA1 immunoblot in control/HRS-KO THP-1 cells with
  siCTL/Listerin silencing and oxLDL stimulation. n = 4 per group. (D) ApoA1-mediated
  cholesterol efflux in HRS-KO THP-1 cells transfected with siCTL/siListerin. n =
  4 per group. (E) Immunoblotting for ABCA1 was performed in control/ATG5-KO THP-1
  cells with siCTL/Listerin silencing. n = 4 per group. (F) Cholesterol efflux in
  ATG5-KO THP-1 cells transfected with siCTL/siListerin. n = 4 per group. (G) Co-IP
  of ABCA1-HRS interaction in oxLDL-treated PMs. An equal amount of nonspecific antibody
  was used as a negative control. (H) Confocal imaging of Flag-HRS/GFP-ABCA1 colocalization
  with/without His-Listerin overexpression. in HeLa cells. Scale bars: 10 μm and 2
  μm (enlarged insets). (I) Flow cytometric analysis of membrane ABCA1 in PMs from
  Listerinfl/fl and Listerinfl/fl Lyz2Cre mice. n = 5 per group. (J) Immunoblot analysis
  of membrane (MEM) and total ABCA1 in PMs from Listerinfl/fl and Listerinfl/fl Lyz2Cre
  mice. n = 5 per group. (K) Confocal microscopic images of ABCA1 expression in PMs
  from Listerinfl/fl and Listerinfl/fl Lyz2Cre mice. HRS was silenced in PMs, which
  were then stimulated with oxLDL (50 μg/mL). n = 5 per group. Scale bar: 20 μm. Data
  are presented as the mean ± SD. The Shapiro-Wilk method was used to test normal
  distributions. Data analysis was performed using 1-way ANOVA followed by Dunnett’s
  post hoc test (A and B), unpaired, 2-tailed Student’s t test (I), and 2-way ANOVA
  followed by Šidák’s post hoc test for the other panels. The adjusted P values are
  provided for multiple-group comparisons. NS, P > 0.05; *P < 0.05, **P < 0.01, and
  ***P < 0.001. Each experiment was repeated at least 3 times independently'
