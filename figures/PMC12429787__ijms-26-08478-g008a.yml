  biological replicates. The data were analyzed using the 2−ΔΔCT method, and the results
  were compared using an unpaired two-tailed t-test. Statistical analysis of the data
  was conducted using an ANOVA. Compared with the control group, identical letters
  indicate no significant difference (p > 0.05), while different letters signify statistically
  significant differences between groups (p < 0.05)'
