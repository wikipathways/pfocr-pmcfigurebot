figure_title: Sesn2 affects pathways associated with muscle regeneration under immobilized
  conditions
caption: (A) GSEA results for TgSesn2 mice. Comparison of GSEA for Sesn2 Tg mice between
  basal and immobilized conditions using gene sets related to mitochondrial functions
  and myogenesis (left). Enrichment plots for the genes involved in mitochondrial
  biogenesis and remodeling, and the differentiation process to skeletal muscle cells
  (“Reactome Mitochondrial biogenesis; M26973” and “GOBP Skeletal muscle cell differentiation;
  M15486”) (right). (B) Network analysis of GSEA for Sesn2 Tg mice under immobilized
  condition using the Gene Ontology (GO) gene set. Among the statistically significant
  GO terms (false discovery rate [FDR] < 0.05), those that share many common genes
  were clustered and annotated as representative biological functions of that cluster.
  Unconnected clusters with three or fewer terms were excluded for simplicity. Sesn2,
  sestrin2; GSEA, gene set enrichment analysis; Tg, transgenic; WT, wild type; NES,
  normalized enrchiment score
