figure_title: Functional heterogeneity of malignant epithelial subpopulations and
  characterization of their metastatic features.
caption: 'Functional heterogeneity of malignant epithelial subpopulations and characterization
  of their metastatic features. (A) Boxplots showing EMT signature scores in malignant
  cells across cancer stages and metastatic states, demonstrating that EMT activity
  progressively increases with tumor progression and metastasis. (B) UMAP visualization
  of malignant cells showing three EMT-defined subtypes (hEMT, mEMT, lEMT). (C) Stacked
  bar plot showing that the proportion of hEMT cells increases with metastatic advancement
  across cancer types. (D) Heatmap illustrating AUCell Z-score activity of functional
  pathways across EMT subtypes, with pathways hierarchically clustered by biological
  functions, highlighting distinct enrichment patterns among different EMT subtypes.
  (E) Developmental trajectories of PRAD cells: CytoTRACE (left) shows predicted differentiation
  potential (red = low, blue = high), and the Monocle trajectory (right) depicts lineage
  progression with annotated branch points, revealing a pseudo-temporal transition
  from lEMT to hEMT states. Different arrows indicate distinct developmental trajectories,
  and numbers mark key branch points. (F) Circular bar plot of differentiation potential
  scores for EMT subgroups (lower scores indicate higher differentiation potential),
  showing that hEMT cells possess greater stem-like plasticity. (G) Heatmap summarizing
  2004 cancer-derived modules, integrated into 13 major programs using the Infomap
  algorithm. (H) Dot plot showing AUCell scores of 13 NMF-defined programs across
  EMT subgroups in different cancer types, highlighting the preferential functional
  programs of each EMT subtype. Statistical significance was assessed using the Wilcoxon
  rank-sum test (* p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001, ns = not
  significant). (I) Heatmap (left and right) depicting WGCNA module correlations,
  with the Sankey diagram (middle) showing associations between WGCNA modules and
  NMF functional program scores. Ribbon width indicates correlation strength, and
  gray ribbons represent non-significant associations (p > 0.05 or |cor| < 0.1). (J)
  Schematic workflow of the mapping-based differential gene analysis strategy'
