figure_title: Molecular mechanisms of the pathway of chrysin in cancer cells.
caption: Molecular mechanisms of the pathway of chrysin in cancer cells. Chrysin demonstrated
  anticancer activity by inducing apoptosis via both mitochondrial and death receptor
  pathways. It activates pro-apoptotic proteins (Bax), blocks anti-apoptotic proteins
  (Bcl-2), and causes cell cycle arrest. Chrysin also increases oxidative stress (ROS),
  inhibits growth pathways such as PI3K/Akt, and regulates inflammatory pathways,
  including NF-κB and COX-2
