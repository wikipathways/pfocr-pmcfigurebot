figure_title: The pathogenesis of ML.
caption: The pathogenesis of ML. ML pathogenesis involves the upregulation and activation
  of RTKs, including MET, RET and VEGFRs, leading to enhanced PI3K pathway activity.
  Growth factors that bind to RTKs, such as IGF-IR, activate PI3K, transforming PIP2
  into PIP3 and triggering AKT signaling and phosphorylating downstream targets. PTEN
  inhibits PI3K signaling by conversion of PIP3 back to PIP2. Moreover, RTKs activate
  genes linked to angiogenesis, proliferation and survival by Ras and the PI3K/AKT
  pathway. ML is associated with AKT activation and PIK3CA and PTEN alterations. The
  oncogenic circuit includes FUS-DDIT3, the IGF-IR/PI3K/AKT pathway and the Hippo/YAP1
  axis. FUS-DDIT3 induces IGF-2 expression, forming an autocrine IGF-II/IGF-IR signaling
  loop that activates the IGF-IR/PI3K/AKT pathway. Signals from IGF-IR and PI3K inhibit
  Hippo kinase LATS1, enabling nuclear accumulation of YAP1. FUS-DDIT3 interacts with
  YAP1/TEAD in the nucleus, regulating oncogenic gene programs involved in apoptosis,
  adipogenesis, the cell cycle and proliferation. ML, myxoid liposarcoma; RTK, receptor
  tyrosine kinase; MET, MET proto-oncogene receptor tyrosine kinase; RET, ret proto-oncogene;
  PIP2, phosphatidylinositol 4,5-bisphosphate; PIP3, phosphatidylinositol (3–5)-trisphosphate;
  PIK3CA, phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic subunit α; IGF,
  insulin-like growth factor; IGF-IR, IGF-1 receptor; FUS-DDIT3, fused in liposarcoma-DNA
  damage-inducible transcript 3; YAP1, Yes-associated protein 1; LATS1, large tumor
  suppressor kinase 1; TEAD, transcriptional enhanced associate domain; HGF, hepatocyte
  growth factor; GDNF, glial cell line-derived neurotrophic factor
