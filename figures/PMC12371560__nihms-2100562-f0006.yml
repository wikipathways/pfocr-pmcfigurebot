figure_title: Schematic model of the CdaAR signalling pathway
caption: CdaR’s intrinsically disordered region (squiggly blue line) senses defects
  in the cell wall meshwork, leading to a conformational change in the CdaAR complex
  that stimulates CdaA activity. Increased c-di-AMP molecules (pink circles) bind
  to cytoplasmic domains (blue circles)8 on membrane transporters. C-di-AMP binding
  inhibits K+ and osmolyte importers, and activates K+ exporters. The reduction in
  cytoplasmic osmolarity reduces cellular turgor pressure. Reduced turgor protects
  the cell from lysis and could enable fortification of the meshwork. In the absence
  of cell wall stress, the IDR resides in the Gram-positive periplasm68
article_title: Cyclic-di-AMP modulates cellular turgor in response to defects in bacterial
  cell wall synthesis
