figure_title: 'Microbiota from the Duox2 KO mouse intestine suppresses colitis: (A)
  Single-cell RNA sequencing (scRNA-Seq) was performed on colonic epithelial cells
  from WT and Duox2 KO mice (n = 2 per group).'
caption: 'Microbiota from the Duox2 KO mouse intestine suppresses colitis: (A) Single-cell
  RNA sequencing (scRNA-Seq) was performed on colonic epithelial cells from WT and
  Duox2 KO mice (n = 2 per group). Differential gene expression analysis followed
  by Gene Ontology biological process enrichment showed significant enrichment of
  host–microbe interaction pathways. (B) Cohousing experiment design. Duox2 KO and
  WT mice were cohoused (1:1 ratio) for 3–4 weeks to enable gut microbiota exchange.
  After cohousing, DSS-induced colitis was established by treating all mice with 2%
  (w/v) DSS in drinking water for 7 days. (C) Body weight of co-KO and co-WT mice
  following 7 days of 2% DSS treatment (n = 7 per group). (D) Serum levels of FD4
  concentration from co-KO and co-WT mice at day 8 following 7 days of 2% DSS administration
  (n = 4 per group). (E) Colon length and colonic photographs from co-KO and co-WT
  mice at day 8 (n = 7 per group). (F) Representative high-magnification light microscopy
  images of H&E-stained colon tissue sections and histological inflammation scores
  from co-KO and co-WT mice at day 8 following 7 days of 2% DSS administration. Scale
  bars: 100 μm. Low-magnification panoramic images are provided in Figure S3. (G)
  FMT experimental design. Duox2 KO and WT mice were put on a course of intragastrically
  antibiotic cocktail administration for 14 days for gut microbiota depletion prior
  to FMT and gavaged with the fecal contents of either WT or Duox2 KO donor mice.
  After FMT, DSS-induced colitis was established. (H) Body weight of WT to WT, KO
  to WT, and WT to KO mice following 7 days of 2% DSS administration (n = 5 per group).
  (I) Serum levels of FD4 concentration from WT to WT, KO to WT, and WT to KO mice
  at day 9 following 7 days of 2% DSS administration (n = 4 per group). (J) Colon
  length and colonic photographs from WT to WT, KO to WT, and WT to KO mice at day
  9 (n = 5 per group). (K) Representative high-magnification light microscopy images
  of H&E-stained colon tissue sections and histological inflammation scores from WT
  to WT, KO to WT, and WT to KO mice at day 9 following 7 days of 2% DSS administration.
  Scale bars: 100 μm. Low-magnification panoramic images are provided in Figure S3.
  Data were expressed as the mean ± SEM. Differences in the data were assessed by
  ordinary one-way ANOVA or the Kruskal–Wallis test, depending on the sample distribution.
  Note: * p < 0.05, **** p < 0.0001, ns: not significant'
