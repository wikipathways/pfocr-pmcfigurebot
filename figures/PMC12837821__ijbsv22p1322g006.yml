figure_title: Mechanisms of Action for Biologics Targeting the Type 2 Inflammatory
  Pathway.
caption: Mechanisms of Action for Biologics Targeting the Type 2 Inflammatory Pathway.
  This figure illustrates the mechanisms of three key biologics targeting different
  stages of the type 2 inflammatory cascade. Tezepelumab is a monoclonal antibody
  that acts upstream by binding to and blocking the alarmin TSLP, preventing the initiation
  of the inflammatory cascade at its source. Dupilumab is a monoclonal antibody that
  binds to the IL-4 receptor alpha subunit (IL-4Rα), thereby simultaneously blocking
  the signaling pathways of two key Th2 cytokines, IL-4 and IL-13. Omalizumab is a
  monoclonal antibody that targets the final effector molecule by binding to free
  IgE, preventing it from attaching to receptors on effector cells like mast cells
  (MC) and thereby blocking the trigger for Degranulation and Histamine release
