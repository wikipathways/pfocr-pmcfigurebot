figure_title: Pharmacological inhibition of the mTor (rapamycin) and calcium (cyclosporin
  A) based hypertrophy pathways revealed mTor to be involved in longitudinal hypertrophy.
caption: Pharmacological inhibition of the mTor (rapamycin) and calcium (cyclosporin
  A) based hypertrophy pathways revealed mTor to be involved in longitudinal hypertrophy.
  (A) Schematic of the inhibition protocol, showing mice were injected with inhibitors
  for 3-days prior to receiving UDD surgery, with continued twice daily dosing of
  inhibitors until sacrifice at day 3 post-UDD. Rapamycin inhibited hypertrophy development
  both at the costal diaphragm mass level (B; p<0.001) and at the longitudinal hypertrophy
  level (C; p<0.001), whereas cyclosporine A had no effect. Neither cyclosporine A
  or rapamycin affected the innervated costal diaphragm (D), or body mass (E) and
  all mice used were of approximately the same size based on skeletal size, as measured
  by tibia length (F). (G) Hypothetical mechanism for longitudinal hypertrophy following
  muscle stretch. The mTorc1 pathway is activated by stretch and initiates longitudinal
  muscle hypertrophy. MARP proteins sequestered by titin’s N2A element are released
  upon stretch and tunes the longitudinal hypertrophy, thus preventing excessive longitudinal
  hypertrophy (Image was generated through BioRender). N=8–10/group, statistical testing
  by 1-way-ANOVA and Dunnett’s multiple comparisons test
article_title: The titin N2A-MARP signalosome constrains muscle longitudinal hypertrophy
  in response to stretch
