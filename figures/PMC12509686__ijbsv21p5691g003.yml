figure_title: Hyperglycemia and the renin-angiotensin-aldosterone system (RAAS) in
  MASLD.
caption: Hyperglycemia and the renin-angiotensin-aldosterone system (RAAS) in MASLD.
  Hyperglycemia promotes the upregulation of RAAS components, including angiotensinogen,
  ACE, angiotensin II, and the AT1 receptor. Angiotensin II stimulates aldosterone
  secretion and transactivation of the EGF receptor, while insulin signaling through
  the IRS-1/PI3K/AKT/eNOS pathway contributes to vasodilation. The interplay between
  these pathways may contribute to metabolic and vascular dysregulation in MASLD
