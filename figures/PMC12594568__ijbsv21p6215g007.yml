figure_title: Effect of STK32C on PAM signaling pathway in CRCs.
caption: Effect of STK32C on PAM signaling pathway in CRCs. (a) Effect of STK32C depletion
  on PAM signaling in HCT116 and SW620 cells. (*<0.05, **<0.01, ***<0.001 vs untreated
  control). n=3. (b) Effect of STK32C overexpression on PAM signaling in HCT116 and
  STK32C lowly expressed SW480 cells. (*<0.05, **<0.01, ***<0.001 vs untreated control).
  n=3. (c) PPI score between STK32C and HSP90 or AKT1. (d) Co-immunoprecipitation
  analysis showing the physical interaction between AKT1 and STK32C in HCT116 cells.
  (e) Effect of HSP90 inhibitor GA and/or STK32C overexpression on HSP90 and p-AKT
  in HCT116 cells. n=3. (f) Effect of AKT inhibitor LY294002 and/or STK32C overexpression
  on HSP90 and p-AKT in HCT116 cells. n=3. Experiments were performed in triplicate
  and repeated three times
