figure_title: SERPINB-centered protein–protein interaction network and pathway enrichment
  of TNBC-exclusive cancer epithelial genes.
caption: SERPINB-centered protein–protein interaction network and pathway enrichment
  of TNBC-exclusive cancer epithelial genes. (A) STRING protein–protein interaction
  network generated from TNBC-exclusive epithelial genes identified in the single-cell
  analysis (Supplementary dataset). SERPINB3 emerges as a central hub linking clusters
  involved in extracellular matrix remodeling (COL1A1/2, FN1, MMPs), EMT regulation
  (ZEB1/2, SNAI2, SMADs), and immune-modulatory pathways (STAT1, NLRC5, HLA class
  I genes). (B) GO Biological Process enrichment of the SERPINB-linked network showing
  the top significant pathways, including ECM organization, EMT, antigen processing
  and presentation, and interferon-γ–related immune signaling. Dot size reflects gene
  count and color indicates FDR. (C) Schematic model illustrating the dual role of
  TNBC in shaping tumor immunity. TNBC enhances B-cell and plasmablast activation,
  leading to increased immunoglobulin production and heightened immunogenicity. Conversely,
  TNBC epithelial cells upregulate SERPINB3, driving stromal reprogramming toward
  immune suppression; CAF, endothelial, and myeloid cells acquire immune-mimicry features
  through ectopic IGLV/IGKV expression. This stromal mimicry suppresses authentic
  B-cell activity and promotes immune evasion, collectively supporting tumor progression.
  Figure created with BioRender.com
