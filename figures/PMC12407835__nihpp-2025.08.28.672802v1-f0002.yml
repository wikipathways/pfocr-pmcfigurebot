  spectrometry (GC-MS). Shown are the percentages of the single sterols in the indicated
  strains. (B) Illustration of the effects of the absence of either Erg3 and/ or Erg4
  in AMBS and AMBR strains. Shown are branches of the ergosterol biosynthesis pathway
  in absence of Erg3 and/ or Erg4 leading to the production of non-physiological predecessors
