figure_title: Synthetic Lethality versus Escape via Polyploidy in TNBC.
caption: 'Synthetic Lethality versus Escape via Polyploidy in TNBC. (A) Normal Mitosis.
  Represents a proliferation-competent cancer cell completing mitosis to produce two
  identical daughter cells. (B) Synthetic Lethality. Depicts the mechanism of synthetic
  lethality in BRCA-mutant (HRD) cells. Pharmacological inhibition of PARP blocks
  single-strand break repair, leading to the generation of catastrophic double-strand
  breaks and severe replication stress. (C) Apoptotic Outcome. Following the events
  in (B), the massive burden of DNA damage activates apoptotic signaling pathways,
  resulting in cell elimination. (D) Escape Mechanism and Therapeutic Bypass. Stepwise
  progression of resistance to Aurora A kinase inhibitors and a proposed combination
  strategy. (1) Mitotic Arrest: Aurora A inhibition compromises spindle assembly,
  arresting cells in mitosis. (2) Mitotic Slippage: Arrested cells bypass cytokinesis
  and revert to an interphase state without dividing, resulting in tetraploidy. (3)
  Formation of Dormant PGCCs: These tetraploid cells evolve into multinucleated Polyploid
  Giant Cancer Cells (PGCCs), characterized by significant hypertrophy and entry into
  a therapy-resistant dormant phase. (4) Senolytic Therapy: Utilizing senolytics to
  specifically target and eliminate the senescent-like PGCC population, thereby preventing
  disease recurrence'
