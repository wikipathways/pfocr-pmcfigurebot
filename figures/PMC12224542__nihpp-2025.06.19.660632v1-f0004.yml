figure_title: bUL49.5 from bovine herpes virus 1 inserts its N-terminal luminal region
  into outward-facing TAP
caption: a,b TAP adopts two conformations in the presence of bUL49.5. The cryo-EM
  density for bUL49.5 in both conformations is shown in purple. c. Superposition of
  the two TAP structures, illustrating conformational differences within the translocation
  pathway. The kinked structure is shown in color and unkinked structure in grey.
  The side chains for R467 of TAP1 and N267 of TAP2 are shown as sticks. d. The unkinked
  TAP/bUL49.5 complex viewed from the ER-lumen, also shown in grey ribbon is the TM
  helix of bUL49.5. e. (Left) Cross-section of the plugged TAP translocation pathway
  in the unkinked conformation. Densities corresponding to TAP are in blue/yellow,
  and inhibitor in purple. (Right) Rotated view with the side chain of TAP1 W308 illustrated.
  f. The kinked TAP/bUL49.5 structure. g. Density (Left) and contact residues (Right)
  of the kinked structure. h. Topology of bUL49.5, TAP (unkinked) is shown as a molecular
  surface. Sequences not visible in the density are represented as dashed lines. The
  C-terminal RGRG degron (not observed in the map) is indicated. i. Effect of bUL49.5
  TM variants and the degron deficient mutation, R93K, on cell-surface MHC-I assays,
  normalized to the YFP only sample. Data for WT, pL-TM, and ΔTM samples represent
  three technical replicates of three biological replicates (n=9). R93K data points
  represent one biological replicate in technical triplicate (n=3). Error bars represent
  the SEM. Statistical significance relative to treatment with wild-type bUL49.5 IRES
  YFP was tested by one-way analysis of variance. ****P<0.0001; ns > 0.05
