caption: Transcriptomic analysis revealed Myc-driven proliferative signatures in illite
  and minoxidil/illite treatments. (A) PCA results showing distinct clustering of
  the control, illite, and minoxidil/illite treatment groups. (B,C) Volcano plots
  showing DEGs in the illite group versus the control (B) and the minoxidil/illite
  group versus the control (C) (black dots indicate non-significant genes). (D,E)
  GSVA bar plots depicting enrichment of Hallmark pathways in the illite (D) and minoxidil/illite
  (E) groups relative to the control. Both treatments show significant enrichment
  of Myc target gene signatures
