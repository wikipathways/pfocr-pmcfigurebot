figure_title: cAMP-mediated signaling pathways promoting axonal regeneration after
  nerve injury.
caption: 'cAMP-mediated signaling pathways promoting axonal regeneration after nerve
  injury. Nerve injury leads to calcium influx and activation of G-protein-coupled
  receptors (GPCRs), which stimulate transmembrane adenylyl cyclases (ACs) and soluble
  AC (sAC) to produce cAMP. Elevated cAMP levels activate two major effectors: protein
  kinase A (PKA) and exchange protein directly activated by cAMP (Epac). PKA phosphorylates
  the transcription factor cAMP-response element-binding protein (CREB), promoting
  the expression of regeneration-associated genes, including arginase I (Arg1), interleukin-6
  (IL-6), secretory leukocyte protease inhibitor (SLPI), and metallothionein I/II
  (MT-I/II). These genes help overcome myelin-associated growth inhibition. In parallel,
  Epac activates Rap1, which promotes axonal growth through inhibition of the RhoA/Rho-associated
  kinase (ROCK) pathway and the activation of the B-Raf/MEK/ERK (MAPK) cascade. cAMP
  signaling also enhances calcium entry via cyclic nucleotide-gated (CNG) channels,
  contributing to membrane depolarization and further amplifying regenerative responses.
  Collectively, these pathways reduce extrinsic inhibitory signals and support intrinsic
  neurite outgrowth and functional recovery. Created in BioRender. Tomczak, J. (2025)
  https://BioRender.com/mt2mtgo'
