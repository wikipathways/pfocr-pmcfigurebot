figure_title: Heatmap and network ofHSP90B1andCNPY3in human cancers.
caption: Heatmap and network ofHSP90B1andCNPY3in human cancers. (A) Heatmap of mRNA
  expression for HSP90B1, co-chaperone, unfolded protein response (UPR) pathway, lymphocyte
  marker (LCM), and immune-related genes in common solid tumors. The red square indicates
  upregulation, and blue indicates downregulation, and p value < 0.05 (Oncomine Platform,
  Thermo Fisher, Ann Arbor, MI, USA). (B) HSP90B1 and CNPY3 gene network in cBioPortal
  for Cancer Genomics (http://www.cbioportal.org, accessed on 15 October 2025). The
  network contains 10 nodes, including HSP90B1 and the 9 most frequently altered neighbor
  genes. (C) The weak correlation of HSP90B1 and CNPY3 mRNA levels in the Curtis et
  al., Nature 2012 dataset [28] (n = 2136, r = 0.113, p value < 0.001). (D) The weak
  correlation of HSP90B1 and TLR7 mRNA levels in the Curtis et al., Nature 2012 dataset
  (n = 2136, r= 0.130, p value < 0.001). (E) There was no correlation of HSP90B1 and
  TLR8 mRNA levels in the Curtis et al., Nature 2012 dataset (n = 2136, r = 0.040,
  p value < 0.001). (F) The gene alternation of HSP90B1 and CNPY3 in the Curtis et
  al., Nature 2012 dataset. Red solid bars indicate gene amplifications, blue solid
  bars are deletions, and red blank bars indicate upregulation, and blue blank bars
  indicate downregulation
