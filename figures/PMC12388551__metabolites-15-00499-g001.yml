figure_title: Hepatotoxicity of PFESA-BP2 in female and male BALB/c mice.
caption: Hepatotoxicity of PFESA-BP2 in female and male BALB/c mice. (A) Experimental
  design of the exposure conditions in GSE147331 and GSE147332, with systems biology
  approaches applied in present study. (B) Principal component analysis (PCA) of normalized
  gene count across both female and male mice groups exposed to PFESA-BP2. Female
  and male are represented as F and M, respectively. (C,D) Heatmaps showing normalized
  and scaled gene count for differentially expressed genes (DEGs) in female mice (743
  genes) and male mice (597 genes), across five doses of PFESA-BP2, respectively.
  (E,F) Venn diagrams representing DEGs in females and males, respectively, at all
  exposure doses. (G,H) Enriched biological pathways associated with the DEGs in female
  and male mice, respectively. The circle size represents number of genes corresponding
  to enriched pathway, and color represents statistical significance of enrichment
  (−log10 p-value). (I,J) Network analysis of lipid and energy metabolic pathways.
  Rectangle and circle nodes represent genes and pathways, respectively. Yellow circles
  are the pathways associated with upregulated genes, while blue circles are those
  associated with downregulated genes. Female and male networks are colored in pink
  and green, respectively
