figure_title: BAF60a regulates β cell function by modulating glucose metabolism–related
  genes
caption: '(A) Left: Differential expression analysis of RNA-Seq from flox/flox and
  BaβKO islets (RNA pooled from 3 mice; n = 3 biological replicates; |log2FC| > 0.5;
  FDR < 0.05). Right: GO analysis of significantly differentially expressed genes
  (DEGs) showing top nonredundant biological processes with gene counts and P values.
  (B) Heatmap of selected pathway-associated genes from (A). (C) Left: Uniform Manifold
  Approximation and Projection (UMAP) visualization of transcriptome-based clustering
  in flox/flox and BaβKO islets. Islets pooled from 3 mice; 4,077 and 4,078 cells
  analyzed, respectively. Right: GO analysis of DEGs in β cell cluster with top biological
  processes. (D) Workflow of 13C-glucose metabolic flux analysis in Min6 cells. (E)
  13C-glucose tracing in control (CTR) and BAF60a-KO Min6 cells. M, unlabeled metabolite;
  M+n, metabolite mass with n labeled carbons. Mean ± SEM; n = 5 biological replicates;
  2-tailed unpaired Student’s t test. (F) Molar percent enrichment (MPE) of 13C in
  glycolysis and TCA metabolites in CTR and BAF60a-KO Min6 cells. Mean ± SEM; n =
  5 biological replicates; 2-tailed unpaired Student’s t test. (G) Intracellular ATP
  content in CTR and BAF60a-KO Min6 cells stimulated with 16.8 mM glucose. Mean ±
  SEM; n = 5–6 biological replicates; 2-way ANOVA'
