figure_title: TEC enables the prediction of gene functions
caption: a, We predicted that LOX belongs to the collagen-containing extracellular
  matrix using an older version of human GO terms (1 January 2021) and confirmed this
  prediction with the newer version (4 December 2022) (Methods). The network displays
  the similarity in TE between LOX (yellow dot) and other genes (gray dots) from the
  collagen-containing extracellular matrix. Line weight in figure panels indicates
  the absolute value of ρ from 0.1 to 1. b, The networks display the ρ between LRRC28
  and glycolytic genes at the TE level (on the left) and RNA level (on the right)
  in humans. Green dots represent genes that belong to the glycolysis pathway; purple
  nodes are transcription factors that regulate glycolysis. c, TE and RNA expression
  of LRRC28, glycolytic genes and transcription factors whose protein products regulate
  glycolysis (FOXK1 and FOXK2) across human cell types and tissues. d, We used AlphaFold2-Multimer
  to calculate the binding probabilities between the proteins LRRC28 or LRRC42 and
  glycolytic proteins (Methods). We evaluated the models with ipTM+pTM (x axis) and
  precision of protein–protein interface binding predictions (pDOCKQ; y axis). We
  set a threshold of ipTM+pTM > 0.7 (ref. 97) and pDOCKQ > 0.23 (refs. 98,99) as previously
  suggested to identify confident binding. e, Three-dimensional model of binding between
  LRRC28 and FOXK1. For visualization purposes, we removed residues 1–101 and 370–733
  in FOXK1 (pLDDT scores below 50). f, Binding probabilities between LRRC28 and transcription
  factors belonging to the forkhead family71. The dashed lines represent ipTM+pTM
  > 0.7 or pDOCKQ > 0.23. g,h, Kinetic ECAR response of SHSY-5Y cell line (n = 6,
  stable overexpression) (g) and Huh 7.5 cell line (n = 6; transient overexpression)
  (h) overexpressing LRRC28 or LRCC42 to 10 mM glucose and 100 mM 2-DG. Unpaired two-sided
  Student’s t-test, ***P < 0.005 and **P < 0.05 (SHSY-5Y measurement 4 P = 0.01, measurement
  5 P = 0.003 and measurement 6 P = 0.002; Huh 7.5 measurement 4 P = 4.2 × 10−5, measurement
  5 P = 6 × 10−8 and measurement 6 P = 8.4 × 10−8). g and h show mean ± s.d.; n shows
  biological independent experiments. 2-DG, 2-deoxy-d-glucose; TF, transcription factor
