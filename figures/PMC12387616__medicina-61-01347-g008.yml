figure_title: Quantitative analysis of mRNA expression levels of PI3K, Akt1, Runx2,
  and Caspase-3 genes in MG-63 osteosarcoma cells following treatment with Q, Dox,
  or their combination (Q + Dox).
caption: 'Quantitative analysis of mRNA expression levels of PI3K, Akt1, Runx2, and
  Caspase-3 genes in MG-63 osteosarcoma cells following treatment with Q, Dox, or
  their combination (Q + Dox). Gene expression levels were normalized to the control
  group (set to 1) and presented as mean ± standard deviation (SD). PI3K and Akt1:
  A significant downregulation was observed in all treatment groups compared to the
  control (p < 0.05), with the most pronounced suppression detected in the Q + Dox
  combination group (p = 0.001), suggesting inhibition of the PI3K/Akt signaling pathway.
  Runx2: mRNA expression was significantly reduced following the Q, Dox, and especially
  Q + Dox treatments (p = 0.040, p = 0.030, and p = 0.010, respectively), indicating
  possible suppression of osteogenic transcriptional activity. Caspase-3: In contrast,
  a marked upregulation of Caspase-3 gene expression was observed in all treatment
  groups, with the combination therapy producing the highest induction (approximately
  4-fold increase; p = 0.001), supporting enhanced apoptotic activation'
article_title: PI3K/Akt1 Pathway Suppression by Quercetin–Doxorubicin Combination
  in Osteosarcoma Cell Line (MG-63 Cells)
