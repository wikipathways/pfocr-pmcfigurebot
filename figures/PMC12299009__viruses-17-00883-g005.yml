figure_title: Overexpression of PLA2G16 causes earlier release of viral nucleic acids
  and the activates interferon signaling pathway.
caption: Overexpression of PLA2G16 causes earlier release of viral nucleic acids and
  the activates interferon signaling pathway. (a) FMDV (MOI = 0.05)-infected wild-type
  cells and PLA2G16-overexpressing cells at 0 h, 2 h and 4 h. Cells were collected
  for RNA extraction, and RT-qPCR was performed to detect the relative levels of viral
  nucleic acids. (b) PLA2G16-overexpressing cells were examined for co-localization
  of PLA2G16 with viral particles 4 h after FMDV (MOI = 1) infection. (c) Cells were
  treated with the TBK1 inhibitor GSK8612 (25 μM) or DMSO 1 h after infection with
  FMDV (MOI = 0.05), and cell samples were collected at 12 h and 16 h post infection
  to assay phosphorylated STAT1 levels. (d,e) RT-qPCR assay of PLA2G16 knockdown cells
  (d); 16 h after FMDV (MOI = 0.05) infection of wild-type cells and PLA2G16 knockdown
  cells, cell samples were collected to detect phosphorylated STAT1 levels (e). The
  data shown are the mean ± SEM; *** p < 0.001, **** p < 0.0001
