figure_title: RNA-Sequencing reveals differentially expressed genes and pathways in
  skeletal muscle undergoing atrophy as a result of B0092 tumor growth
caption: (A) Principal Component Analysis (PCA) of control (red) and B0092 (HNC; light
  blue) samples (n=4), with the majority of varience being acounted for by PC1. (B)
  Top 50 dysregulated genes in B0092-bearing mice (25 upregulated and 25 downregulated).
  (C) DEGs with a role in mitochondrial homeostasis in muscle of B0092-bearing mice.
  (D) Fold change and FDR cutoff describing differential expression, total number
  of upregulated and downregulated genes, and color scale for heatmap. (E). Heatmap
  illustrating top 200 dysregulated genes correlated with quadriceps weights (100
  upregulated and 100 downregulated) associated with significantly enriched pathways
  and ontologies (p ≤ 0.05, minimum of two genes per pathway). (F) Alluvial plot mapping
  the connections between genes and the respective enriched pathways and ontologies
