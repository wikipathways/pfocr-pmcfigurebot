figure_title: CD300a suppresses STAT3 phosphorylation in SiglecFlo neutrophils
caption: (A–C) WT or Cd300a−/− BM neutrophils were cultured for 2 days in the presence
  of the culture supernatant of the naive cardiac tissue, which had been stimulated
  or not with HMGB-1 or IL-1α (A) and analyzed for SiglecF expression by flow cytometry
  (B). (C) The GM-CSF and G-CSF levels in the culture supernatant of the cardiac tissue
  after stimulation with HMGB-1 or IL-1α. (D) Flow cytometric analysis of SiglecF
  expression on WT or Cd300a−/− BM neutrophils after stimulation with GM-CSF or G-CSF.
  (E) Ingenuity Pathway Analysis based on differentially expressed genes from Cd300a–/–
  and WT SiglecFlo neutrophils. (F and G) Flow cytometric analysis of phosphorylated
  STAT3 (p-STAT3) in neutrophils of the cardiac tissue of Cd300a–/– (n = 7) and WT
  (n = 6) mice (F) and WT or Cd300a–/– BM neutrophils stimulated with or without the
  cardiac tissue supernatant (G). (H and I) Prok2 and Chil1 mRNA expression in BM
  neutrophils of WT or Cd300a–/– mice stimulated with the cardiac tissue supernatant
  after MI/R (H) or with G-CSF together with STAT3 inhibitor (STAT3i) or control vehicle
  (Vehicle) (I). (J) LVEF after MI/R in Cd300a–/– (vehicle, n = 5; STAT3i, n = 4)
  and WT mice (n = 3 in each group) treated with STAT3i or vehicle. Data are presented
  as mean ± SEM, representative of 2 experiments (B, D, G, and H) and pooled from
  2 (C, F, and I) and 4 (J) experiments. One-way (B–D) and 2-way ANOVA (F, G, I, and
  J) and unpaired Student’s t test (H). *P < 0.05; **P < 0.01; ****P < 0.0001
