figure_title: DatIRES-Cre-Ptprsflox/fl mouse line effectively recombines floxed alleles
  in dopaminergic neurons within the substantia nigra.
caption: DatIRES-Cre-Ptprsflox/fl mouse line effectively recombines floxed alleles
  in dopaminergic neurons within the substantia nigra. (A) Model for targeting Ptprs
  gene deletion in mDA neurons. (B) Representative image showing tdTomato labeling
  colocalization with TH+ cells in the nigrostriatal pathway. (C) Dissected bulk tissue
  from cerebellum (Cer), substantia nigra (SN), hippocampus (HC), cortex (CTX), and
  stratum (STR) were collected from DatIRES-Cre-Ptprswt/wt (WT) and DatIRES-Cre-Ptprsfl/fl
  (cKO) mice with the blue arrow pointing to the Ptprs recombined allele. (D-E) Increased
  mDA neuron specificity was achieved with Laser Capture Microdissection (LCM) performed
  on tdTomato+ cells as seen (D) before and (E) after LCM collection. Blue triangles
  represent cells targeted for LCM and green dashed circles represent LCM cut site.
  (F) Electrophoresis gel for the tdTomato+/− SNc LCM single mDA neurons from WT and
  cKO mice with the blue arrow pointing at the Ptprs recombined allele. Scale bar
  as indicated
article_title: Inhibition of PTPRS function does not affect the survival or regeneration
  of dopaminergic neurons but alters synaptic function in the nigrostriatal pathway
