caption: This schematic illustrates the continuum of IRAK pathway activation across
  healthy, inflammatory, and cancer states, and the corresponding impact of various
  IRAK-targeted strategies. IRAK1 inhibition, IRAK4 inhibition, IRAK4 degradation,
  and dual IRAK1/4 inhibition result in varying degrees of pathway suppression, with
  dual inhibition achieving the most complete blockade
