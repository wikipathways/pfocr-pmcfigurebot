figure_title: SXC treats VVC mice by exerting antioxidant effects and suppressing
  the NLRP3 pathway to produce anti-inflammatory actions.
caption: 'SXC treats VVC mice by exerting antioxidant effects and suppressing the
  NLRP3 pathway to produce anti-inflammatory actions. (a) Levels of GSH, SOD, and
  MDA in vaginal tissues (n = 7). (b) mRNA transcript levels of TLR4, NF-κB, NLRP3,
  Caspase-1, IL-18 and IL-1β in vaginal tissues measured via RT-qPCR (n = 8). (c)
  Levels of GSH, SOD, and MDA in the supernatant of LPS-stimulated RAW264.7 cells
  (n = 6). (d) mRNA transcript levels of inflammatory cytokines HO-1, NF-κB, NLRP3,
  Caspase-1, IL-18 and IL-1β in LPS-stimulated RAW264.7 cells (n = 6). Statistical
  significance is indicated as follows: * p < 0.05, ** p < 0.01, *** p < 0.001, compared
  to the model group; ‘ns’ denotes not significant. (e) SXC suppresses oxidative stress
  and pyroptosis by inhibiting the TLR4/NF-κB/NLRP3 signaling pathway'
