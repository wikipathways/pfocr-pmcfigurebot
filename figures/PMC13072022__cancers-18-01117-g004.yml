figure_title: Functional enrichment analysis of genes correlated with NLRC5 in TCGA
  and CancerCell cohorts.
caption: 'Functional enrichment analysis of genes correlated with NLRC5 in TCGA and
  CancerCell cohorts. (A–D) represent the TCGA cohort: (A) Gene Ontology (GO) biological
  process (BP) analysis showing significant enrichment in immune-related processes
  such as T cell activation, defense response to virus, and adaptive immune response.
  (B) GO cellular component (CC) analysis highlighting enrichment in cell surface
  and various membrane-related components. (C) GO molecular function (MF) analysis
  showing enrichment in protein binding, receptor binding, and MHC class II protein
  complex binding. (D) KEGG pathway analysis indicating significant enrichment in
  pathways related to allograft rejection, cell adhesion molecules, type I diabetes
  mellitus, and antigen processing and presentation. (E–H) represent the CancerCell
  cohort: (E) GO biological process (BP) analysis showing significant enrichment in
  pathways related to the immune response, T cell receptor signaling, and interferon-gamma
  production. (F) GO cellular component (CC) analysis highlighting enrichment in various
  membrane-related components similar to the TCGA cohort. (G) GO molecular function
  (MF) analysis indicating significant enrichment in receptor binding, MHC class II
  receptor activity, and T cell receptor binding. (H) KEGG pathway analysis showing
  significant enrichment in pathways related to type I diabetes mellitus, allograft
  rejection, and antigen processing and presentation. (The size of each bubble corresponds
  to the number of genes enriched in the respective pathway. Bubble color reflects
  the statistical significance of enrichment, represented as −log10(FDR), with darker
  blue indicating more significant enrichment)'
