figure_title: Cdk5 orchestrates distinct stages of neuronal migration.
caption: Cdk5 orchestrates distinct stages of neuronal migration. Cdk5 phosphorylates
  key substrates to control the multi-step migration process. (i) In multipolar cells,
  phosphorylation of p27kip1 regulates the RhoA-Cofilin pathway to control actin dynamics.
  (ii) During the bipolar transition, the RapGEF2 pathway modulates N-cadherin function.
  (iii) In locomoting neurons, phosphorylation of Ndel1 and Dcx governs nuclear movement
  and microtubule stability, respectively
