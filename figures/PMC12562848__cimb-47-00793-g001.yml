figure_title: Results of network pharmacology and molecular docking.
caption: Results of network pharmacology and molecular docking. (A) 2D structural
  diagram of EC. The red O represents the oxygen element in the 2D structure of epicatechin.
  (B) Venn diagram illustrating the overlap between EC targets and aging—related genes.
  (C) Core components were identified by adopting Cytoscape 3.10.2 grounded in a median
  degree greater than 2, ultimately bringing about 54 paramount targets, comprising
  EGFR, ErbB4, NFKB1 and BCL2. (D) GO analysis of the 54 core targets revealed 15
  enriched phrases related to molecular functions (MFs), cellular components (CCs)
  and biological processes (BPs). (E) KEGG pathway enrichment analysis unveiled critical
  pathways tightly correlated with anti-aging effects, such as the EGF receptor tyrosine
  kinase inhibitor resistance pathway, the PI3K-Akt signaling pathway and the cancer
  proteoglycan pathway. (F) As molecular docking results suggested, EC binds effectively
  to Neuregulin-1 (NRG1), illustrating a binding affinity of −2.68 kcal/mol. (G) Visualization
  via PyMOL confirmed stable interactions between EC and NRG1, which adequately demonstrates
  favorable binding activity
