figure_title: KT-1 enhances CD8+ T cell effector function and mediates antitumor immunity
  through a CD8+ T cell–dependent mechanism
caption: '(A) UMAP analysis of tumor-infiltrating immune cells showing increased cytotoxic
  T cell representation in KT-1–treated tumors. (B–G) scRNA-seq analysis of CD8+ T
  cells reveals differential expression of effector-related genes following KT-1 treatment.
  (H) KEGG pathway enrichment analysis highlights immune activation signatures in
  CD8+ T cells. For panels A–H: scRNA-seq was performed on CD45+ cells pooled from
  n = 10 mice per group; asterisks indicate cell-level Wilcoxon rank-sum test results
  for visualization purposes only and do not represent biological replicates. (I)
  Schematic of CD8+ and CD20+ cell depletion in KT-1–treated mice; n=5 per treatment
  group (J) Tumor growth curves with or without immune cell depletion. (K–L) Flow
  cytometry quantification of total immune infiltration (CD45+) and T cell populations
  (CD3+). (M–N) Representative plots and CD8+/CD4+ T cell ratio within tumors. Data
  are presented as mean ± SD. *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001,
  ns = not significant'
