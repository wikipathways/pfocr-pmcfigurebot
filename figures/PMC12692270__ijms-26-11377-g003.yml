figure_title: Transcriptome and mutation pathway analysis and comparison within and
  between basal cell carcinoma subtypes.
caption: Transcriptome and mutation pathway analysis and comparison within and between
  basal cell carcinoma subtypes. (A) Morphoeic BCC transcriptome gene-set enrichment
  analysis (GSEA) compared to its WES OncodriveFM pathway data; (B) nodular BCC transcriptome
  GSEA compared to its WES OncodriveFM pathway data. Pathways in red are significantly
  changed in both DNA and RNA analysis using q = 0.05. Orange pathways represent pathways
  significantly altered in WES data only, and blue pathways are RNA-seq aberrantly
  expressed pathways only; (C) WES mutations of mBCC and nodBCC were compared using
  OncodriveFM pathway analysis. n = 10 morphoeic and 10 nodular BCCs; (D) transcriptome
  gene-set enrichment analysis (GSEA) of mBCC was compared to that of nodBCC. n =
  3 morphoeic and 3 nodular BCCs. Red pathways are significantly changed in both histological
  subtypes using q = 0.05. Orange pathways represent pathways significantly altered
  in morphoeic BCC only, and blue pathways are nodular-specific pathways only
