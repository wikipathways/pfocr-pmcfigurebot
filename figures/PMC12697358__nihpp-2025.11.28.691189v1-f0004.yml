figure_title: Examples of ancestral and/or nested expansions in core siRNA factors
caption: (A) A subset of montium group species have expanded both the core miRNA factor
  Drosha, as well as the siRNA effector AGO2. (B) A sublineage of the quinaria clade
  has expanded several members of the core miRNA pathway, and occasionally some siRNA
  factors. Curiously, the nature of the small RNA factor changes does not clearly
  align with phylogenetic relationships. (C) Nearly all species across the willistoni
  group have co-amplified siRNA factors r2d2 and AGO2. (D) All species within the
  obscura clade have amplified AGO2, with subsets of species also gaining copies of
  the other siRNA factors. Apparent evolutionary trajectories can be inferred from
  the phylogeny. For example, in the lower half of the obscura phylogeny, which all
  exhibit amplification of AGO2, D. subsilvestris and its sister species all gained
  dicer-2, while D. tristis and D. ambigua further gained r2d2. (E) All species analyzed
  within the Chymomyza genus have amplification of AGO2, and a subset of them have
  additional expansion of dicer-2 and r2d2. Note examples of species within the obscura
  group and Chymomyza that have expanded all three core RNAi factors
article_title: Recurrent expansion and rapid evolution of the Drosophilid RNAi pathway
  in testis
