caption: (A) Volcano plot showing differentially expressed proteins in iTau cells
  compared to iGFP based on mass spectrometry. (B) Pathway analysis of significantly
  altered pathways in iTau cells. (C) Top 50 significant proteins with the largest
  change in iTau cells. (D) Volcano plots of actin-binding (GO:0003779) or nuclear
  proteins (GO:0005634) in iTau cells compared to iGFP. n=3 biological replicates
  per group. Log2FC for significance is +/− 0.585 and p≤0.05
