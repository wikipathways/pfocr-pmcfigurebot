figure_title: Functional enrichment of high-FST genes.
caption: 'Functional enrichment of high-FST genes. Genes in highly divergent regions
  show enrichment for stress response, signaling, and metabolic functions. Divergent
  regions overlap with kinase domains, transporters, and retrotransposon activity.
  (A) Top enriched Gene Ontology (GO) terms (FDR < 0.05; X-axis: GO categories; Y-axis:
  enrichment score). (B) KEGG pathway enrichment (X-axis: pathways; Y-axis: enrichment
  score). (C) Most frequent Pfam domains among high-FST genes (X-axis: Pfam domains;
  Y-axis: frequency). (D) Top divergent genes by FST per chromosome (X-axis: chromosomes;
  Y-axis: top-ranked genes)'
