figure_title: Adipose tissue function in a lean individual.
caption: Adipose tissue function in a lean individual. This figure illustrates the
  role of adipose tissue in a lean individual as an active endocrine organ maintaining
  metabolic homeostasis. In these conditions, adipose tissue operates in equilibrium
  with immune cells, such as M2-type macrophages. The secretion of anti-inflammatory
  adipokines, like Omentin-1, helps regulate metabolism by improving insulin sensitivity,
  an effect mediated by potentiating the Akt signaling pathway in adipocytes and inhibiting
  inflammatory cytokines (IL-6 and TNF-α), thus contributing to anti-inflammatory
  homeostasis. This figure was made on Biorender.com
