figure_title: PACs-CFE Modulates the TGF-β1/Smad3 Pathway (A,B).
caption: PACs-CFE Modulates the TGF-β1/Smad3 Pathway (A,B). Representative Western
  blot for TGF-β1 and Smad3 in LX-2 cells treated with indicated concentrations of
  PACs-CFE for 48 h. (C) Influence of PACs-CFE on TGF-β1 gene expressions in LX-2
  cells. (D) Influence of PACs-CFE on Smad3 gene expressions in LX-2 cells. (E) Influence
  of PACs-CFE on TGF-β1 protein expressions in LX-2 cells. (F) Influence of PACs-CFE
  on Smad3 protein expressions in LX-2 cells. Assay was carried out in cells treated
  with indicated concentrations of PACs-CFE for 48 h. The data presented are means 
  ±  S.D. Statistical significance was determined by Student’s t-test. (* p < 0.05,
  ** p < 0.01, *** p < 0.001, **** p < 0.0001, n = 3)
