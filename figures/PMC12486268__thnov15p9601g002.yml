caption: 'Selenium metabolism characteristics and GPX1 expression in orbital tissues
  of TED patients. (A) Heatmap of 24 screened selenium metabolism-related genes. (B)
  Pathway enrichment analysis of differentially expressed genes in the TED group.
  (C) GSEA pathway analysis based on median GPX1 expression. (D) GSEA pathway analysis
  based on median SELENOP expression. (E) Immunofluorescence staining of GPX1 in orbital
  adipose tissue. (scale bar: 100 μm) (F) Western blot analysis of GPX1 protein expression
  in orbital adipose tissues (n = 6). (G) GSH-Px activity and (H) MDA levels in orbital
  adipose tissues; ***p < 0.001 (mean ± SE, n = 6). (I) Flow cytometric phenotyping
  of primary orbital fibroblasts. HC, Healthy control'
