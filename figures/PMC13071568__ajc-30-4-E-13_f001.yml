caption: '(A) Electrocardiography demonstrated right bundle branch block, left anterior
  fascicular block, left ventricular hypertrophy, abnormal Q waves in the high lateral
  leads, and nonspecific ST-T changes; (B) 24-hour Holter Monitoring: Revealed intermittent
  ventricular pre-excitation, characterized by the occasional presence of delta waves
  and a short PR interval, suggestive of an accessory pathway; (C-D) Echocardiography
  revealed uniform hypertrophy of the interventricular septum and left ventricle;
  (E-F) Cardiac magnetic resonance imaging demonstrates uniform left ventricular hypertrophy
  with myocardial edema (red arrow); (G) Quantitative T2 mapping revealed myocardial
  edema with prolonged relaxation times (66.3 ms, green arrow); (H) Cardiac magnetic
  resonance imaging demonstrates myocardial fibrosis (yellow arrow)'
