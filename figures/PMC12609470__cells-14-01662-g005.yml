figure_title: ESA attenuates kidney fibrosis by modulating G2/M cell cycle arrest
  through JNK and p38-MAPK signaling pathways.
caption: 'ESA attenuates kidney fibrosis by modulating G2/M cell cycle arrest through
  JNK and p38-MAPK signaling pathways. (A) Immunoblot analysis of p-JNK, p-p38/p38,
  and p-ERK1/2/ERK1/2 in HK-2 cells. (B) Immunoblots of p-JNK, p-p38/p38, and p-ERK1/2/ERK1/2
  in the UUO kidney. After the administration of DARB, JNK and p38-MAPK signaling
  pathways, which contribute to kidney fibrosis, were dose-dependently and significantly
  suppressed compared with HK-2 cells that were only stimulated with TGF-β and the
  UUO kidney. Data are expressed as mean ± SD. N = 5–6 mice per group. * p < 0.05,
  ** p < 0.001, ns, not significant, ## p < 0.001 vs. UUO + PBS'
