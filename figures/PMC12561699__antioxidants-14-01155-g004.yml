figure_title: IL-1β induces IRS-1 (Ser307) phosphorylation through ERK, JNK, and IKK
  pathways.
caption: IL-1β induces IRS-1 (Ser307) phosphorylation through ERK, JNK, and IKK pathways.
  (A) Cells were treated with IL-1β (10 ng/mL) for 0, 10, 30, and 120 min. (B–D) Cells
  were pretreated with PD98059 (15 μM), SP600125 (10 μM), or Bay11-7082 (20 μM) for
  2 h, followed by stimulation with IL-1β (10 ng/mL) for 10 min. Protein levels of
  p-ERK, p-JNK, p-IKK, p-IRS-1 (Ser307), and α-actin were analyzed by Western blotting.
  Data are expressed as mean ± SD from three independent experiments. Values not sharing
  the same letter are significantly different (p < 0.05)
