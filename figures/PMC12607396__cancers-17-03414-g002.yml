figure_title: A brief summary of AR signaling.
caption: A brief summary of AR signaling. The diagram illustrates the mechanisms of
  androgen receptor (AR) signaling in response to androgen. In the genomic pathway,
  androgen diffuses across the cell membrane. Androgen binds to cytoplasmic AR, which
  is maintained in an inactive conformation by chaperone proteins. Ligand binding
  induces AR activation, chaperone dissociation, and subsequent nuclear translocation.
  Within the nucleus, AR-Androgen complexes bind to androgen response elements (AREs)
  on DNA, recruiting co-regulatory proteins to modulate transcription of target genes
