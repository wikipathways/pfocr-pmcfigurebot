figure_title: Gene ontology (GO) and KEGG pathway enrichment analysis of genes regulated
  by miR-133 isoforms.
caption: 'Gene ontology (GO) and KEGG pathway enrichment analysis of genes regulated
  by miR-133 isoforms. The plots display enriched terms across four categories: Biological
  Process (BP), Cellular Component (CC), Molecular Function (MF), and KEGG pathways.
  The x-axis represents fold enrichment, bubble size indicates the number of genes
  (count) associated with each term, and the color scale reflects statistical significance
  (–log10 p-value). Enrichment results demonstrate that miR-133 isoforms regulate
  pathways related to cell proliferation, metal ion homeostasis, cellular stress responses,
  extracellular matrix regulation, and major cancer-associated signaling cascades
  including p53, PI3K-Akt, and Hippo pathways'
