figure_title: Dysregulation of the autophagic pathway in AD.
caption: Dysregulation of the autophagic pathway in AD. The figure illustrates key
  impairments in this major cellular clearance mechanism. In AD, the initiation of
  autophagy (via ULK1 complex and TFEB activation) and the formation of autophagosomes
  are disrupted. This leads to the accumulation of defective autolysosomes, which
  fail to degrade their cargo. Consequently, there is a harmful buildup of Aβ peptides
  and hyperphosphorylated tau proteins, alongside damaged organelles. These accumulations
  contribute significantly to synaptic dysfunction and neuronal loss, hallmark features
  of AD pathogenesis
