figure_title: Time-dependent changes in the behavioral role—but not axon collaterals—of
  the mPFC–TEa pathway
caption: A. Schematic of experimental paradigm for auditory fear conditioning and
  recall testing (top), and surgery scheme for circuit manipulation (bottom). B. Tone-induced
  freezing at recent (D1) and remote (D28) recall with and without laser (D1 paired
  t-test=0.4, n=10 mice; D28 paired t-test P=0.02, n=8 mice). C. Contextual freezing
  on D29 in Jaws and GFP mice (paired t-test, P=0.5, n=11 mice). D. Schematic for
  recording TEa bulk activity using fiber photometry during recent (D1) and remote
  (D28) memory recall. E. Example traces of TEa activity during tone onset. F. TEa
  tone responses during recent and remote memory retrieval (paired t-test, P=0.01,
  n=8 mice).G. Schematic of surgical scheme to label the axonal projections of all
  mPFC-TEa neurons (left), mPFC-TEa neurons active on D1 (middle), or mPFC-TEa neurons
  active on D28 (right). H. Dotogram showing density of axonal innervation across
  brain segments in general mPFC-TEa neurons. Dot size represents normalized pixel
  counts summed across subjects (n=5 all mPFC-TEa mice; n=4 D1 mPFC-TEa mice; n=5
  D28 mPFC-TEa mice). I. Same as I for mPFC-TEa neurons active during recent memory
  retrieval. J. Same as I for mPFC-TEa neurons active during remote memory retrieval.
  K. Volcano plot comparing regional axonal innervation density between the all mPFC-TEa
  cohort and recent retrieval (D1) activated mPFC-TEa cohort (CLA difference=−3.861
  arbitrary units (AU), −log10(P)=3.688, CeA difference=0.288 AU, −log10(P)=1.584).
  L. Same as L comparing all mPFC-TEa and mPFC-TEa neurons active during remote retrieval
  (CLA difference=−4.2 AU, −log10(P)=2.359, CeA difference=0.276 AU, −log10(P)=1.713).
  M. Same as L comparing mPFC-TEa neurons active during recent and remote memory retrieval.
  CLA = claustrum, CeA = central amygdala, IPN = interpeduncular nucleus.*P<0.05,
  **P<0.01. Error bars represent mean ± s.e.m
