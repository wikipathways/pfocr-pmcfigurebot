figure_title: Mitochondrial ROS–ER Stress Axis Governs IL-10 Production in Neutrophils
  and Regulates Inflammation in Murine Chlamydia pneumoniae Lung Infection
caption: 'C. pneumoniae infection-induced mitochondrial ROS–ER stress–IRE1α sensor
  pathway activation leads to IL-10 production by murine neutrophils. B/M-derived
  neutrophils were infected with C. pneumoniae for 6 h, stained with MitoRed and MitoGreen
  (A) or with MitoSOX (B), and analyzed by flow cytometry. (C) ER stress-related genes
  in neutrophils at 12 h post-infection (h.p.i.) with mock or C. pneumoniae were analyzed
  by quantitative RT-PCR. (D) The protein of Bip or IRE1α, expressed in the mock or
  C. pneumoniae-infected neutrophils at an indicated time point, was assayed by Western
  blot. (E,F) Mock or C. pneumoniae-infected neutrophils were treated with the mtROS
  inducer Rotenone or the ER stress inhibitor 4-PBA. Neutrophils were collected at
  12 h.p.i. and stained with MitoSOX, then analyzed by flow cytometry. (G) Mock or
  C. pneumoniae-infected neutrophils were treated with or without MitoTEMPO for 12
  h. Bip and IRE1α proteins were detected by Western blot. (H) Mock or C. pneumoniae-infected
  neutrophils were treated with ER stress inhibitor 4μ8C or MitoTEMPO. mRNA of neutrophils
  was isolated at 12 h.p.i. and translated to cDNA. Xbp1 was amplified by PCR and
  then digested with PstI enzyme for 2 h. The ratio of sXbp1 to total Xbp1 was normalized
  to the control C. pneumoniae-infected neutrophils. (I,J) Mock or C. pneumoniae-infected
  neutrophils were treated with mtROS scavenger MitoTEMPO or IRE1α inhibitor 4μ8C.
  Neutrophils were collected at 12 h.p.i., stained with XBP-1S antibody, and then
  analyzed by flow cytometry. (K) Neutrophils infected with C. pneumoniae were treated
  with the indicated dose of MitoTEMPO. Culture medium was collected 24 hrs after
  infection. TNFα and IL-10 in the culture medium were measured by ELISA. (L,M) Neutrophils
  infected with C. pneumoniae were treated with ER stress inhibitor 4-PBA (L) or 4μ8C
  (M); culture medium was collected 24 h after infection. IL-10 in the culture medium
  was measured by ELISA. Statistical analyses were performed using a two-way ANOVA
  followed by Tukey’s multiple comparison test (A,B), an unpaired two-tailed Student’s
  t-test (C), and a one-way ANOVA followed by Tukey’s multiple comparison test (F,J–M).
  * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001. Every experiment was
  conducted with n ≥ 3 and repeated at least three times, and the experiment shown
  is representative. Cpn: C. pneumoniae'
