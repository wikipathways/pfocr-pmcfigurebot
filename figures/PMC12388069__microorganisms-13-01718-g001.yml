caption: Metabolic pathway of the hydroxycinnamic acids, ferulic acid, p-coumaric
  acid and caffeic acid in A. niger. Pathways observed in A. niger are marked with
  black arrows. Unidentified pathways in A. niger are marked with dashed arrows. Boxes
  near an arrow represent identified enzymes catalyzing the reactions. Pathways that
  were not observed in A. niger but in other Aspergilli are marked with blue (A. flavus),
  green (A. japonicus) yellow (A. parasiticus), orange (A. fumigatus), cyan (A. luchuensis)
  and purple (A. brasilliensis) arrows. HMPKP-SCoA, 4-hydroxy-3-methoxyphenyl-β-hydroxypropionyl-CoA;
