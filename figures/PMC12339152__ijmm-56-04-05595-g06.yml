figure_title: SDF2 knockdown mediates the downregulation of ATP7A and ATP7B via the
  endoplasmic reticulum-associated degradation pathway.
caption: SDF2 knockdown mediates the downregulation of ATP7A and ATP7B via the endoplasmic
  reticulum-associated degradation pathway. (A and C) Reverse transcription-quantitative
  PCR analysis revealed that GRP78 mRNA levels and the XBP1s/XBP1u ratio were increased
  in U87 and U251 cells following Ad-shSDF2 transfection (n=5). (B and D) Western
  blot analysis demonstrated that the protein expression of GRP78, SDF2L and ERdj3
  was increased in U87 and U251 cells after SDF2 knockdown (n=3). (E and F) Western
  blot analysis revealed that in U87 and U251 cells, SDF2 knockdown reduced ATP7A
  and ATP7B expression compared with that in control cells, whereas pretreatment with
  MG132 significantly reversed the Ad-shSDF2-induced reduction in ATP7A and ATP7B
  levels (n=3). (G and H) Immunofluorescent analysis revealed that DLAT aggregation
  was increased following Ad-shSDF2 transfection in U87 and U251 cells (n=3; scale
  bar, 10 μm). SDF2, stromal cell-derived factor 2; GRP78, glucose-related protein
  78; XBP1, X-box binding protein 1; sh-, short hairpin; DLAT, dihydrolipoamide S-acetyltransferase;
  ERdj3, endoplasmic reticulum DnaJ heat shock protein 3; NC, negative control
