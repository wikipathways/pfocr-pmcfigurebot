figure_title: Gene set enrichment analysis (GSEA) of four shared immune-related pathways.
caption: Gene set enrichment analysis (GSEA) of four shared immune-related pathways.
  Normalized enrichment scores (NESs) are shown for COVID-19 and epilepsy. Cytokine
  signaling was the only pathway significantly enriched in both conditions (FDR <
  0.05), whereas NF-κB signaling, Toll-like receptor signaling, and leukocyte migration
  did not reach statistical significance (FDR > 0.05). Exact NES and FDR values are
  indicated. The small black dots at the ends of the bars represent FDR < 0.05, indicating
  statistical significance
