figure_title: Multi-omic profiling reveals metabolic dysregulation in decidual macrophages
  (dMφs) from URPL pregnancies.
caption: 'Multi-omic profiling reveals metabolic dysregulation in decidual macrophages
  (dMφs) from URPL pregnancies. (A) UMAP visualization of 132,301 decidual tissue
  cells from 9 URPL and 10 normal pregnancies. (B) Bubble chart illustrating the expression
  levels of canonical marker genes used to annotate specific cell populations. (C)
  Bar plots illustrating: (i) the proportions of immune and non-immune cells among
  total decidual cells; (ii) the composition of immune cell subsets within immune
  cells, and (iii) the composition of non-immune cell subsets within non-immune cells
  in URPL and normal pregnancies. (D-E) AUGUR scores quantifying cell type-specific
  transcriptional perturbations in immune (D) and non-immune (E) populations, highlighting
  the cell types most responsive to the pathological microenvironment of decidua from
  URPL pregnancies. (F) Bar plot of the top 10 most significantly upregulated and
  downregulated KEGG pathways in dMφs from URPL pregnancies. (G) GSEA analysis of
  pathways related to cholesterol metabolism, amino acid biosynthesis, glycolysis/gluconeogenesis,
  and carbon metabolism. (H) COMPASS analysis revealing differential metabolic pathway
  activities in dMφs between URPL and normal pregnancies. The X-axis represents Cohen''s
  d values; dot color intensity reflects statistical significance. (I) Altered activity
  of the tryptophan metabolism pathway in dMφs from URPL pregnancies. (J) Volcano
  plot showing differentially abundant tryptophan metabolites in decidual tissues,
  between URPL and normal pregnancies, identified through targeted metabolomics. Purple
  dots represent upregulated metabolites, blue dots represent downregulated metabolites,
  and the size of each dot corresponds to the VIP value. Abbreviations: KYN: Kynurenine;
  5-HIAA: 5-Hydroxyindoleacetic Acid; AA: Anthranilic Acid; IS: Indole Sulfate; KYNA:
  Kynurenic Acid; ICA: Indole-3-carboxaldehyde; 3-HAA: 3-Hydroxyanthranilic Acid;
  IPA: Indole-3-propionic acid; IAA: Indole-3-acetic acid; ILA: Indole-3-acetalamine;
  Xa: Xanthurenic Acid; 5-HTOL: 5-Hydroxytryptophol; Skatole: 3-Methylindole; IA:
  Indole Acetic Acid; 3-HK: 3-Hydroxykynurenine; Nicotinic Acid; Trp: Tryptophan;
  5-M-IAA: 5-Methoxy-3-indoleacetic Acid. (K-M) Boxplots comparing the concentrations
  of KYN (K), 5-HIAA (L), and AA (M) in decidua between URPL and normal pregnancies.
  Each group includes n = 10 samples; statistical significance was assessed using
  the Student''s t-test'
