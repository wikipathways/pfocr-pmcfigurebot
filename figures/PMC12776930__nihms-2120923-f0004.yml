figure_title: Mechanisms of resistance to CDK4/6 inhibition and MAPK pathway-targeted
  therapy in melanoma.
caption: 'Mechanisms of resistance to CDK4/6 inhibition and MAPK pathway-targeted
  therapy in melanoma. Schematic representation of key molecular alterations enabling
  melanoma cells to bypass growth suppression mediated by MAPK pathway inhibition
  and CDK4/6 inhibition. MAPK pathway reactivation occurs through multiple mechanisms:
  loss of PTEN leading to PI3K–AKT–mTOR activation; upregulation of receptor tyrosine
  kinases (RTKs) such as EGFR, PDGFR-β, or IGF-1R; activating mutations in NRAS or
  MEK1/2; and emergence of alternative RAF isoform signaling via CRAF. Resistance
  to BRAF inhibitors may arise from BRAF splice variants (e.g., p61BRAF) or secondary
  mutations that enhance MAPK signaling. Cell cycle dysregulation occurs through gene
  amplification of CCND1, loss of CDK inhibitors from the CIP/KIP (p21CIP1, p27KIP1,
  p57KIP2) and INK4A (p15INK4B, p16INK4A, p18INK4C, p19INK4D) families, or activation
  of CDK2 kinase activity independently of CDK4/6. RB pathway alterations include
  loss of functional RB protein, resulting in uncontrolled E2F activity, or enhancement
  of CDK4/6 non-kinase functions, such as transcriptional upregulation of VEGF. These
  events can drive unchecked cell cycle progression from G1 to S phase, occasionally
  via non-canonical (CDK-independent) mechanisms. Immune evasion may be promoted by
  low tumor neoantigen expression or defective interferon-γ signaling, leading to
  reduced PD-L1 expression and impaired T-cell recognition'
