figure_title: CLARIX FLO attenuates hypersensitization of IB4-positive neurons via
  CD44 signaling under DRG adhesion conditions.
caption: 'CLARIX FLO attenuates hypersensitization of IB4-positive neurons via CD44
  signaling under DRG adhesion conditions. One or four weeks following CLARIX FLO
  treatment, L5 DRG tissues were collected from mice. (A–D) The ratio of 340 nm/380
  nm fluorescence was used to represent cytosolic calcium levels in IB4-positive (IB4+)
  and IB4-negative (IB4−) neurons before and after stimulation with a pH 6.8 acidic
  buffer. (E,F) Histograms show the average peak intracellular calcium responses within
  15 s after stimulation. Differences in neuronal calcium concentrations between groups
  were evaluated using the Mann–Whitney U test. * p = 0.035, AD + Veh vs. Sham; ##
  p < 0.01, AD + CLARIX FLO vs. AD + Veh. n > 15 total cells per group; mice numbers
  were 6 to 8. The percentage of responsive neurons in small or medium-sized cells
  was 75 to 87%. (G) L5 DRG was treated with 10 or 20 μg of anti-CD44 antibody (anti-CD44)
  25–30 s prior to CLARIX FLO administration [Adhesion (+) CLARIX FLO/anti-CD44].
  Mechanical sensitivity was evaluated one week after surgery. Comparison between
  groups was analyzed via one-way ANOVA. Sham vs. AD + Veh (** p < 0.01). Comparison
  between experimental groups and Adhesion (# p = 0.043). Comparison between Adhesion
  (+) CLARIX FLO/anti-CD44 and Adhesion + CLARIX FLO ($ p = 0.041). (H) Calcium imaging
  showed that CLARIX FLO suppresses activation of IB4+ neurons via the CD44 pathway.
  One week after surgery and CLARIX FLO treatment, L5 DRGs were harvested from mice.
  The 340 nm/380 nm fluorescence ratio indicated cytosolic calcium levels in IB4+
  cells before and after stimulation with capsaicin (Cap, 0.3 μM). The green and purple
  traces represent IB4+ neurons treated with capsaicin alone and in combination with
  anti-CD44, respectively'
