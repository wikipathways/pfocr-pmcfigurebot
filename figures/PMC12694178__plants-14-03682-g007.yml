caption: Schematic diagram of the mechanism of aroma release of Phalaenopsis Formosa
  Sweet Memory. The main aroma compounds of Phalaenopsis Formosa Sweet Memory were
  β-Ocimene, Linalool, and Methyl Benzoate. DXS, TPS, ispE, ispH, ispG, GPPS 4CL,
  SAM, and AAMT were key genes in the biosynthesis pathways of terpenoids and esters,
  which were co-expressed with aroma release. These structural genes were also regulated
  by transcription factors
