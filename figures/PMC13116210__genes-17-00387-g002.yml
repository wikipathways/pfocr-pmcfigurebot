caption: Heterogeneity of γδT cells in MSI and MSS CRC revealed by single-cell RNA-seq.
  (A) Heatmap of signature genes across different cell clusters. (B) UMAP embedding
  of the distribution of γδT cells in MSI and MSS CRC. (C) UMAP visualization of γδT
  cell clusters after annotation. (D) Dotplot showing the expression of cytotoxic
  and immune checkpoint genes. (E) Boxplots showing the immune checkpoint score of
  γδT cell subsets (**** p < 0.0001). (F) Distribution of γδT cell subset fractions
  across tissues. (G) UMAP embedding of γδT cell clusters from adjacent tissue, MSS
  CRC, and MSI CRC. (H) Gene Ontology and pathway enrichment analysis of DEGs upregulated
  in C4_CXCL13 γδT cells. (I) KEGG enrichment analysis of DEGs upregulated in C4_CXCL13
  γδT cells
