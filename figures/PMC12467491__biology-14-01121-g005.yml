caption: 'GSEA enrichment analysis plots are shown for key pathways: (A) FOXO signaling
  pathway (6 h vs. 0 h), (B) mTOR signaling pathway (6 h vs. 0 h), (C) glutathione
  metabolism pathway (6 h vs. 0 h), (D) FOXO signaling pathway (48 h vs. 0 h), (E)
  mTOR signaling pathway (48 h vs. 0 h), and (F) glutathione metabolism pathway (48
  h vs. 0 h). The green curve at the top represents the enrichment score, indicating
  the cumulative change in enrichment as genes are ranked; the black vertical lines
  in the middle denote the positions of the pathway’s genes within the ranked gene
  list. The gray bar graph at the bottom displays the ranking metric scores for each
  gene, where the red region indicates genes upregulated in the experimental group,
  and the blue region represents genes upregulated in the control group'
