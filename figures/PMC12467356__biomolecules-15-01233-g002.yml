caption: The mechanisms of action of five FAK inhibitors in lung cancer and ALI include
  Defactinib, GSK2256098, and PF-562271, which regulate tumor cell migration, proliferation,
  invasion, and survival through the FAK/p53 and FAK/RAS/RAF pathways. Additionally,
  APG-2449 modulates the migration, proliferation, invasion, and survival of NSCLC
  and ovarian cancer cell lines via the FAK/PI3K-AKT pathway. Furthermore, Simvastatin
  decreases the expression of inflammatory factors, such as IL-6 and IL-8, via the
  FAK/MAPK/NFκB signaling pathway. Additionally, it enhances lung barrier function
  and reduces pulmonary microvascular permeability. PND-1186 exerts anti-inflammatory
  effects through the FAK-TAK1-MAPKs/NFκB pathway, leading to reduced expression of
  inflammatory factors. Arrows indicate activation (→) and inhibition (⊣)
