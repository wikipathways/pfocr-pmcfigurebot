figure_title: Revealing lung functional signaling in AATD patients using ExCON’s derived
  signature
caption: A. Pathway clusters were generated based on ExCON-integrated transcriptomic
  and metabolomic features from AATD and healthy individuals. Markov clustering was
  applied to identify distinct functional modules. Nodes represent individual genes
  or features, colored by cohort (blue = AATD, patients, green = healthy controls),
  and grouped into pathway clusters annotated by biological function. AATD-associated
  nodes prominently populate clusters involved in inflammatory signaling, NF-κB/MAPK
  pathways, EV biology, and metabolic regulation. In contrast, healthy-associated
  features are enriched in mitochondrial regulation, translation, and transporter
  activity. B. Proposed mechanism from this study’s findings on the impact NEVsNE
  + convey to accelerating lung pathophysiology in patients with AATD
