figure_title: Interaction between the HPA axis and the gut microbiota in stressful
  situations.
caption: 'Interaction between the HPA axis and the gut microbiota in stressful situations.
  Prolonged cortisol secretion in response to chronic stress can disrupt the composition
  of the gut microbiota, leading to dysbiosis. This promotes the overgrowth of Gram-negative
  bacteria, which produce increased levels of LPS. LPS then compromises the integrity
  of the intestinal barrier by increasing epithelial permeability. Once weakened,
  LPS can translocate into the lamina propria, where it binds to TLR4 on the surfaces
  of intestinal dendritic cells, macrophages and epithelial cells. This interaction
  activates a signalling cascade involving adaptor proteins such as MyD88, ultimately
  leading to the activation of NF-κB. NF-κB then triggers the transcription of genes
  that encode proinflammatory cytokines, such as TNF-α, IL-6 and IL-1β. This results
  in chronic, low-grade inflammation. Elevated levels of IL-6 and other cytokines
  can impair the expression of glucocorticoid receptors through JAK/STAT signalling,
  thereby weakening negative feedback regulation of the HPA axis. This dysregulation
  perpetuates elevated cortisol levels during chronic stress. In the context of dysbiosis,
  cytokines such as IL-6 and IFN-γ stimulate IDO-1 activity, shifting tryptophan metabolism
  towards the kynurenine pathway. This increases the production of neurotoxic metabolites
  such as KYN and QA, while the levels of serotonin and protective indole derivatives
  decline. Consequently, the activation of AhR, which plays a role in maintaining
  mucosal immune homeostasis, is reduced. Abbreviations: ACTH—adrenocorticotropic
  hormone; AhR—aryl hydrocarbon receptor; BBB—blood–brain barrier; CRH—corticotropin-releasing
  hormone; GR-α/β—glucocorticoid receptors; HPA—hypothalamic–pituitary–adrenal axis;
  IDO-1—indoleamine 2,3-dioxygenase; IFN-γ—interferon-gamma; IL-1β—interleukin 1β;
  IL-6—interleukin 6; JAK/STAT—Janus kinases/signal transducer and activator of transcription;
  KA—kynurenic acid; KP—kynurenine pathway; KYN—kynurenine; LPS—lipopolysaccharides;
  MyD88—myeloid differentiation primary response 88; NF-κB—nuclear factor-kappa B;
  TLR4—Toll-like receptor 4; SOCS3—suppressor of cytokine signaling 3; TNF-α—tumor
  necrosis factor-alpha; QA—quinolinic acid. This figure was created using Servier
  Medical Art (available at https://smart.servier.com/) (accessed on 1 May 2025)'
