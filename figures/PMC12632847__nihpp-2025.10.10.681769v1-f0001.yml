figure_title: The principle of SuMMIT-SRS imaging
caption: '(a) Schematic showing the workflow of SuMMIT-SRS imaging. Cells, Drosophila
  flies, mice were cultured in medium or supplied with water containing deuterium
  labeled metabolites (D-metabolites). Following labeling, deuterium was incorporated
  into macromolecules including proteins, lipids, DNA, and RNA through various metabolic
  pathways. After that the distribution of proteins, lipids, DNA, and RNA can be captured
  by stimulated Raman scattering (SRS) imaging. (b) Cartoon showing HeLa cells cultured
  in medium supplemented with 4 mM D5-glutamine for 72 h. Following labeling, proteins,
  lipids, DNA, and RNA were extracted from D5-glutamine–labeled cell pellet and then
  subjected to Ramam spectral measurements. (c) Raman spectra of D5-glutamine labeled
  protein, lipid, DNA, and RNA spectra measured by spontaneous Raman microscopy. (d)
  SRS images showing SuMMIT-SRS detected protein, lipid, DNA, and RNA distributions
  before and after the linear unmixing. Scale bar: 10 μm. (e) Raman spectra of HeLa
  cells labeled with D-glucose, D-methionine, D-tyrosine and D-leucine, respectively.
  They were collected using spontaneous Raman microscopy and used to generate the
  linear fitting spectrum. This computed spectrum agrees well with the spectrum directly
  measured from the cells labeled with a cocktail of D-glucose, D-methionine, D-tyrosine
  and D-leucine. Each spectrum was averaged of n=15 ROIs from 3 independent experiments'
