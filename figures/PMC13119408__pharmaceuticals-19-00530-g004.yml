figure_title: QPD and GQD differentially regulate hepatic transcriptomic profiles
  in T2DM mice.
caption: QPD and GQD differentially regulate hepatic transcriptomic profiles in T2DM
  mice. (A) PCA score plot among Mod, GQD, and QPD groups based on variance-stabilized
  transformation (VST) normalized counts. (B) Volcano plots of differentially expressed
  genes in GQD vs. Mod, QPD vs. Mod, and GQD vs. QPD. Differential expression analysis
  was performed using DESeq2 with Wald test and Benjamini–Hochberg adjustment; significance
  thresholds were set at |log2 fold change| > 1 and adjusted FDR ≤ 0.05. (C) KEGG
  pathway enrichment analysis of differentially expressed genes in GQD vs. Mod, QPD
  vs. Mod, and GQD vs. QPD. KEGG pathway enrichment analysis was conducted using hypergeometric
  test with FDR correction (p < 0.05 considered significant)
