figure_title: Functional organization of the medial temporal lobe.
caption: 'Functional organization of the medial temporal lobe. Left: Ventral view
  of the Rhesus monkey brain defining the cytoarchitectonic borders of the different
  medial temporal cortical areas. Center: Schematic drawing of the hierarchical organization
  of cortical inputs reaching the hippocampal formation. Neocortical inputs conveying
  information about object features (object processing stream) converges in the perirhinal
  cortex and lateral entorhinal area, whereas details about the location of objects
  (spatial processing stream) converge in the parahippocampal cortex (areas TH/TF)
  and medial entorhinal area. These two streams reach the hippocampus, which via further
  processing through the trisynaptic pathway (DG—CA3—CA1—Sub), represents items in
  the context in which they were experienced. Backward projections follow the same
  pathways back to the entorhinal cortex, then perirhinal/parahippocampal cortices,
  and finally to neocortical regions. Right: Thionin-stained section through the midbody
  of the hippocampus of rhesus monkeys. Arrows represent the flow of information through
  the trisynaptic circuits: that is, Erh to DG to CA3 to CA2 to CA1 to Sub and back
  to ERh (continuous white arrow) that progressively developed through the 2 postnatal
  years in monkeys and a more direct pathway (dashed white arrow) from the ERh to
  CA1 present early in infancy. CA1, CA2 and CA3, Cornus Ammoni fields of the hippocampus
  proper; Cing. Cx, Cingulate cortex; DG, dentate gyrus; STS, superior temporal sulcus;
  Sub, subiculum; TH/TF, temporal cortical areas on the parahippocampal gyrus (PG);
  TE and TEO, visual temporal areas as defined by von Bonin and Bailey (1947)'
