figure_title: Detection of DEGs regulated by WSB2.
caption: Detection of DEGs regulated by WSB2. (A) MDA-MB-231 cells were transfected
  with pCMV-HA or pCMV-HA-WSB2. Volcano map of DEGs, which was obtained from the transcriptome
  sequencing analysis results. Red dots indicate significantly upregulated genes and
  green dots indicate significantly downregulated genes. (B) Top 10 Kyoto Encyclopedia
  of Genes and Genomes pathway items enriched for DEGs. (C) NUPR1, MDM2 and LDLRAD4
  mRNA levels were detected in MDA-MB-231, MCF-7, A2780, U87 MG and HeLa cells using
  reverse transcription-quantitative PCR. Compared with HA-vector, *P<0.05, **P<0.01,
  ***P<0.001 vs. HA-vector. n.s, no significance; WSB2, WD repeat and SOCS box containing
  2; DEGs, differentially expressed genes; OE, overexpressed; NC, negative control;
  LDLRAD4, low density lipoprotein receptor class A domain containing 4; MDM2, mouse
  double min 2; NUPR1, nuclear protein 1
