figure_title: The gut–brain-FABP axis in neurodegeneration.
caption: 'The gut–brain-FABP axis in neurodegeneration. This diagram illustrates the
  multi-stage pathological cascade linking gut health to neurodegeneration. Stage
  1 (Gut Initiation): Gut dysbiosis and other insults lead to FABP2 dysfunction, which
  compromises tight junctions, resulting in a “leaky gut.” This allows bacterial lipopolysaccharide
  (LPS) to enter the bloodstream and creates a local inflammatory environment that
  promotes the misfolding of α-syn in the ENS. Stage 2 (Propagation): The pathology
  spreads to the brain via two parallel pathways. Pathological α-syn “seeds” propagate
  from the ENS to the brainstem via retrograde transport along the vagus nerve (Vagal
  Propagation), consistent with the hypothesis. Concurrently, LPS enters the systemic
  circulation. Stage 3 (Central Pathology and Inflammation): The α-syn pathology spreads
  trans-neuronally within the brain, causing synucleinopathy. Meanwhile, circulating
  LPS crosses a compromised blood–brain barrier (BBB) and activates microglia via
  the FABP4/TLR4 signaling pathway, establishing a chronic neuroinflammatory state
  that exacerbates the primary proteotoxic damage'
article_title: 'Targeting the FABP Axis: Interplay Between Lipid Metabolism, Neuroinflammation,
  and Neurodegeneration'
