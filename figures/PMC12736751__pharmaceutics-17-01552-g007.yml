figure_title: Comparative Pharmacokinetics of Lutein and Zeaxanthin from Phospholipid,
  Liposomal, and MCT Formulations in SD Rats
caption: 'Proposed mechanistic pathway for enhanced lutein absorption with PS: (1)
  PS-stabilised mixed micelles/vesicles in the intestinal lumen increase lutein solubility;
  (2) greater partitioning of lutein into enterocytes through SR-BI/CD36 facilitation
  at the brush border; (3) faster endoplasmic reticulum (ER) trafficking and MTP-mediated
  chylomicron assembly with PS supporting apolipoprotein B-48 lipidation; (4) improved
  lymphatic export and incorporation of lutein into circulating lipoproteins; (5)
  the overall result is higher and more sustained plasma lutein levels without affecting
  elimination kinetics'
