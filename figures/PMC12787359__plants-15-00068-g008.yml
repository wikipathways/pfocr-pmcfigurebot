caption: 'Expression of the genes associated with cambial activity in PtrBTB82-overexpressing
  P. trichocarpa. Cambial tissues of wild-type (WT) and PtrBTB82 overexpression lines
  were used to isolate total RNAs for RT-qPCR analysis. These genes include WUSCHEL-related
  pathway (PtrCLE41, PtrPXY, PtrWOX4, and PtrWOX14), plant hormone signaling (PtrIAA9/12,
  PtrARF5, PtrPIN1/3/5/6, PtrARR7/15, PtrBIL1, PtrDET2, and PtrJAZ5), as well as transcriptional
  regulators and peptide (PtrHB7, PtrVCM1/2, PtrVCS2/2h, PtrGRF15, PtrMYB31, and PtrC3H17).
  A change of more than twofold with the value p < 0.05 was used to determine differential
  expression. Values are means ± SDs (n = 3). Asterisks denote a significant difference
  from WT using the Student’s t-test: ** p < 0.01'
