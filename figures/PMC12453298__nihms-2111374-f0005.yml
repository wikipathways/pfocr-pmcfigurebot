figure_title: Overview of lysosome-dependent proteostasis
caption: 'Macroautophagy is responsible for the bulk or partial degradation of organelles:
  including the endoplasmic reticulum (ER), nuclear components, and especially mitochondria.
  In doing so, this pathway modulates cellular metabolic states and removes damaged
  organelles. Aggregates of misfolded proteins can be cleared via two distinct routes:
  smaller aggregates or individual misfolded proteins may be degraded by the proteasome
  with the assistance of the BAG1 co-chaperone. Larger protein aggregates are directed
  toward autophagic degradation through the action of the BAG3 co-chaperone, a process
  known as chaperone-assisted selective autophagy (CASA). These aggregates are first
  organized into aggresomes—perinuclear structures encased in vimentin filaments—which
  are then engulfed by autophagosomes for degradation. Chaperone-mediated autophagy
  (CMA) selectively targets individual proteins bearing a KFERQ-like pentapeptide
  motif, facilitating their direct translocation into lysosomes. Figure created with
  BioRender'
