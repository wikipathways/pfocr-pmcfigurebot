figure_title: Enrichment overview illustrating the top 25 metabolic pathways significantly
  altered in acute DVT compared with healthy individuals.
caption: Enrichment overview illustrating the top 25 metabolic pathways significantly
  altered in acute DVT compared with healthy individuals. The x-axis represents the
  statistical significance of pathway enrichment expressed as –log10 (p-value), while
  the y-axis lists the identified pathways. The size of the circles corresponds to
  the enrichment ratio, and the color gradient reflects the p-value intensity (from
  orange to red, indicating increasing significance). The main pathways identified
  include pyruvate dehydrogenase deficiency, glycogen synthase deficiency, and respiratory
  chain deficiencies, highlighting disturbances in energy metabolism associated with
  DVT
