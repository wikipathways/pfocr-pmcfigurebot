figure_title: KLFs in PI3K/AKT signaling.
caption: 'KLFs in PI3K/AKT signaling. PI3Ks are classified into three types: class
  I, II, and III, based on the triggering stimulus. The pathway initiates with the
  phosphorylation of PIP2 to PIP3, a second messenger that activates various substrates.
  KLF2 exhibits context-dependent regulation of PI3K/AKT signaling. it suppresses
  AKT activity in colorectal cancer by downregulating GPX4 to induce ferroptosis,
  yet in pancreatic β-cell injury, resveratrol-induced KLF2 activates PI3K/AKT via
  miR-126. KLF3 enhances AKT signaling in hepatocytes through miR-21-5p–mediated control
  of lipogenesis, whereas KLF4 acts oppositely, repressing AKT2 via miR-206 in gastric
  cancer and reducing AKT activity under MoS2-induced stress, thereby impairing intestinal
  morphology. KLF5 demonstrates strong reciprocal crosstalk with AKT: it promotes
  hepatocellular carcinoma progression via the PI3K/AKT/Snail axis. In turn, AKT stabilizes
  KLF5 by blocking GSK3β-mediated degradation, while a P301S mutation in colon cancer
  further prevents degradation, sustaining oncogenic KLF5 and reinforcing a feed-forward
  loop with AKT. KLF9 suppresses PI3K/AKT signaling. Several KLFs, indicated at the
  bottom of the figure, can either activate or repress the pathway, but the mechanisms
  of this regulation are not clear. (Activation is represented by a pointed arrow
  and repression by a flathead arrow). Created with BioRender.com'
