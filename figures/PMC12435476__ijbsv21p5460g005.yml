figure_title: JPI-547 disrupts YAP pathway.
caption: JPI-547 disrupts YAP pathway. (A) Immunoblot analysis of YAP-related proteins
  following treatment with 2.5 µM of olaparib or JPI-547 for 72 h in indicated cell
  lines. Representative images from duplicates are shown. (B) Volcano plot illustrating
  differentially expressed genes (DEGs) associated with the Hippo signaling pathway
  (GO:0035329) in HPAF-II cells. DEGs were identified from RNA-seq analysis of untreated
  and JPI-547-treated cells, defined by fold-change ≥ 1.5 and raw p < 0.05 (n = 3).
  (C) Immunoblot analysis of phospho-YAP (Ser127) following 72 h treatment with 2.5
  µM olaparib or JPI-547 in AsPC-1. (D) Immunofluorescent imaging of YAP (red) in
  AsPC-1 cells treated with JPI-547 for 72 h. Representative images from three independent
  experiments are presented. (E) Immunoblot analysis demonstrating interactions between
  YAP/TAZ and TEAD1. AsPC-1 cells were treated with 2.5 µM JPI-547 for 72 h and subjected
  to immunoprecipitation. (F) Immunoblot analysis of YAP/TAZ and CTGF in subcellular
  fractions of AsPC-1 cells. Cells treated with 2.5 µM of olaparib or JPI-547 for
  72 h underwent subcellular fractionation and subsequent immunoblotting. Lamin B1
  served as a nuclear loading control. (G) qRT-PCR analysis of YAP transcriptional
  targets (CTGF, CYR61, and VEGFA) in AsPC-1 cells following 72 h treatment with 2.5 µM
  of olaparib or JPI-547. Data represent mean ± SEM (n = 3); adjusted p-values by
  one-way ANOVA with Bonferroni's multiple comparisons test
