figure_title: Schematic overview of the integrated bioinformatics workflow.
caption: Schematic overview of the integrated bioinformatics workflow. The pipeline
  begins with a multi-label perceptron neural network, which is applied to a feature
  matrix to predict gene-pathway associations. Predicted gene names are analyzed for
  enrichment using KEGG and GO databases, followed by gene ID conversion via GenID.
  RAS-related pathways are extracted from the KEGG pathway database. To support computational
  predictions, literature mining is conducted using the Entrez e-utility and PubMed,
  linking gene IDs to PMIDs. Relevant articles are converted from PMIDs to PMC IDs
  and downloaded as PDF or text files for curation. This combined in silico and literature-based
  approach enhances the biological validation of key genes involved in cardiometabolic
  disease
