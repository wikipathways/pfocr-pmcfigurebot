figure_title: Functional characterization of CYP2R1-associated pathways in HCC.
caption: Functional characterization of CYP2R1-associated pathways in HCC. (A) Bar
  plot summarizing enriched pathways that remained significant after multiple-testing
  correction (FDR-adjusted p < 0.05) across four databases (KEGG 2021 Human, Reactome
  Pathways 2024, MSigDB Hallmark 2020, and WikiPathways 2024 Human). Bars represent
  the combined enrichment score for each pathway, and colors indicate the FDR-adjusted
  p value on a –log10 scale (yellow ≥ 1, orange ≥ 1.5, red ≥ 2). (B) Top 10 Hallmark
  pathways identified by GSEA comparing CYP2R1-high (Q1) vs. CYP2R1-low (Q4) TCGA
  HCC samples. (C) GSEA enrichment plot of the DNA repair program. The orange line
  represents the enrichment score. (D) Correlation plots of CYP2R1 expression with
  representative DNA repair genes (POLA2, LIG1, PCNA, RPA3, and RAD51). The dashed
  lines represent fitted regression lines
