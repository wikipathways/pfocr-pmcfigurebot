figure_title: Loss of endodermal BRD4 disrupts epithelial-mesenchymal crosstalk
caption: '(A and B) Wholemount IHC for SOX2 and SOX9 to assess branching at E12.5.
  Scale bar: 200 μm. Quantification data are represented as mean ± SEM. Two-tailed
  t test: **P ≤ 0.01, n = 3. (C) Left: bright-field images of control and mutant lungs
  at E12.5. Scale bar: 500 μm. Middle: wholemount IHC for SOX2 and SOX9 after 3 days
  of culture ex vivo. Scale bar: 500 μm. Dashed white boxes indicate branching tips
  in control and mutant lungs. Right: magnified images of branching tips. Dashed white
  lines outline a distal airway. Scale bar: 100 μm. (D) Wholemount IHC for SOX2 and
  SOX9 at E15.5. Scale bar: 500 μm. Dashed white boxes mark magnified areas shown
  in the right panels. Scale bar: 100 μm. (E) RNA FISH for Shh, Bmp4, and Fgf10 in
  control and mutant E12.5 lungs. Scale bar: 50 μm. (F) Matrix plots of differentially
  expressed genes by RNA-seq of E12.5 epithelium including cell markers, BMP signaling
  targets, and FGF signaling targets. Genes in red for BMP and FGF targets are positively
  correlated with activation of each respective signaling pathway. (G) Gene expression
  analysis by qPCR for Fgf10 (left box) and SHH target genes in E12.5 mesenchyme.
  Quantification data are represented as mean ± SEM. One-way ANOVA: *P ≤ 0.05, n =
  3–4'
