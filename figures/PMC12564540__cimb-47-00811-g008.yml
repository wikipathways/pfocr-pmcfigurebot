caption: This figure illustrates the protective effects of natural compounds and antioxidants
  on fibroblast function and mitochondrial integrity in periodontal therapy. Polyphenols
  like resveratrol, quercetin, curcumin, and EGCG activate the Nrf2 pathway, enhance
  mitochondrial function, and reduce oxidative stress. Coenzyme Q10 and vitamins C
  and E support antioxidant defenses and inhibit MAPKs. Hyaluronic acid preserves
  ECM integrity and hydration. Together, these agents modulate inflammatory signaling
  pathways, reduce pro-inflammatory cytokines, and help maintain fibroblast viability
  and tissue regeneration. Created with Biorender.com
