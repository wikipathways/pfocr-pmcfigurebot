figure_title: The major oxylipin biosynthetic pathways revealed in the present study.
caption: The major oxylipin biosynthetic pathways revealed in the present study. (A),
  allene oxide synthase pathway. (B), hydroperoxide bicyclase pathway. (C), epoxyalcohol
  synthase pathway. (A,B), R = ethyl, R’ = (CH2)7COOMe, or vice versa. (C), R = ethyl,
  R’ = (CH2)7COOMe. All conversions are enzymatic. The only exceptions are the hydrolysis
  of the short-lived allene oxide (Figure 5A, bottom) and the hydrolysis of oxiranyl
  vinyl carbinol (Figure 5C, bottom)
