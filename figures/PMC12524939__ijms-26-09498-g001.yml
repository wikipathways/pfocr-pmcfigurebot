caption: 'Mechanistic Pathway—From Inflammation to Colorectal Carcinogenesis. This
  schematic illustrates the multi-step cascade of molecular and cellular mechanisms
  involved in the transition from chronic intestinal inflammation to inflammation-driven
  colorectal cancer (CRC) development, particularly in the context of inflammatory
  bowel disease (IBD), with a focus on genetic and epigenetic regulation. Notes: Bottom
  right call-out. Familial disease (in pink background); CRC* predisposition of tumor
  suppressor genes promoted by epigenetic changes (in orange background); Hereditary
  Susceptibility genes to colorectal neoplasia (in white background). (see details
  in the text)'
