figure_title: Neural circuits underlying maternal motivation and caregiving behavior.
caption: Neural circuits underlying maternal motivation and caregiving behavior. This
  schematic illustrates key brain regions and neurotransmitter pathways involved in
  maternal behavior. The medial preoptic area (MPOA) projects to the ventral tegmental
  area (VTA) though MPOAEsr1 + GABAergic (magenta) neurons that synapse on non-dopaminergic
  cells (gray), and potentially other yet to be determined mechanisms. The MPOA also
  projects to the periaqueductal gray (PAG) via GABAergic pathway. The VTA sends dopaminergic
  (blue) projections to the nucleus accumbens (NAc), which in turn sends GABAergic
  (magenta) projections to the ventral pallidum (VP). The basolateral amygdala (BLA)
  provides glutamatergic (green) input to both the NAc and VP. Gray arrows indicate
  projections that are less well-characterized or involve mixed neurotransmitter signaling.
  Outlines of brain regions indicate their place in classic appetitive vs consummatory
  networks, with consideration given to conflicting results. Solid outlines (VTA,
  BLA) are established as exclusively appetitive regions. Dashed outlines (MPOA, PAG,
  NAc, VP) indicate brain regions that may be involved in both appetitive and consummatory
  behaviors. In the classic appetitive vs consummatory brain networks the MPOA-VTA-NAc
  network in appetitive and MPOA-PAG is consummatory
