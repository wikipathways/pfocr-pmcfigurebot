figure_title: Pyroptosis is involved in acute liver injury.
caption: 'Pyroptosis is involved in acute liver injury. (A) Signaling pathways related
  to inflammation and cell death were screened by the GO enrichment analysis. (B)
  Reactome enrichment analysis based on differentially expressed genes (DEGs). (C)
  GSEA enrichment plot and heatmap showing upregulation of pyroptosis-related signaling
  in CCl4 group compared to control group. (D) H&E staining in liver sections (Scale
  bar: 50μm, 25μm) and serum ALT and AST levels of control group and CCl4 group (n
  = 6 per group). (E) IHC staining of GSDMD-N and Cleaved CASPASE1 in liver sections
  from indicated groups (Scale bar: 50μm, n = 6 per group). (F) Protein expression
  of GSDMD-N, Cleaved CASPASE1, mature IL-1β and mature IL-18 in mouse liver treated
  with or without CCl4 (n = 3 per group). (G) Ultrastructural features of liver identified
  by TEM under control and CCl4 treatment (Scale bar: 5μm, 2μm, n = 6 per group).
  (H, I) Co-IF staining of TUNEL/GSDMD-N (Scale bar: 25μm) and IF staining of mature
  IL-1β and mature IL-18 (Scale bar: 50μm) in liver sections from indicated groups
  (n = 6 per group). (J) mRNA levels of Il-1β, Il-18, Tnf-α, Tgf-β, Il-6 and Mpo in
  liver tissues were determined by RT-qPCR (n = 3 per group). (K) The levels of CASPASE1
  activity, IL-1β and IL-18 in serum from indicated group were measured (n = 6 per
  group). All results are shown as mean ± SEM. *p < 0.05'
