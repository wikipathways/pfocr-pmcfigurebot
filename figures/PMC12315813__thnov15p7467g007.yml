figure_title: Mn3O4 nanozymes regulated microglial phenotype by inhibiting the TLR4/NOX2
  pathway, thereby reducing ROS generation and NF-κB-mediated inflammatory responses.
caption: Mn3O4 nanozymes regulated microglial phenotype by inhibiting the TLR4/NOX2
  pathway, thereby reducing ROS generation and NF-κB-mediated inflammatory responses.
  (A-B) Representative images and statistical analysis of fluorescence imaging of
  prefrontal cortex and hippocampus slices incubated with DCFH-DA probe in 5×FAD mice
  treated with Mn3O4 nanozyme for 4-8 weeks, n = 6 per group, scale bar = 100 μm.
  (C-D) Immunoblotting results and densitometric analysis of p-NF-κB and NF-κB in
  the prefrontal cortex and hippocampus of 5×FAD mice treated with Mn3O4 nanozymes
  for 4-8 weeks, n = 3 per group. (E) Immunoblotting results and densitometric analysis
  of NOX2 and TLR4 in the prefrontal cortex and hippocampus of 5×FAD mice after 4-8
  weeks of Mn3O4 nanozyme treatment, n = 3 per group. (F-G) Relative mRNA expressions
  of NOX2 and TLR4 in the prefrontal cortex and hippocampus of 5×FAD mice after 4-8
  weeks of Mn3O4 nanozyme treatment, n = 4 per group. (H) Schematic diagram of Mn3O4
  nanozymes inhibiting inflammatory response and regulating microglia phenotype through
  TLR4/NOX2 pathway. Data are presented as mean ± SEM. Multiple t-tests were used
  for multigroup comparisons. ****p < 0.0001, ***p < 0.001, **p < 0.01, *p < 0.05,
  and ns (no significance)
article_title: Mn3O4 nanozyme-based anti-inflammatory therapy modulates microglial
  phenotype by downregulating TLR4/NOX2 expression and further alleviates Alzheimer's
  disease pathology
