figure_title: Integration of multi-omics data and functional characterization of overlapping
  genes in thyroid cancer.
caption: 'Integration of multi-omics data and functional characterization of overlapping
  genes in thyroid cancer. (A) Venn diagram illustrating the overlap among five gene/protein
  lists derived from multi-omics analyses: enzyme, phosphorylation, proteomics, RNA,
  and pediatric malignant versus pediatric benign (PM/PB) comparisons. The analysis
  includes data from papillary thyroid cancer (PTC) patients (n=37 pairs of tumor
  and adjacent normal tissues) and pediatric thyroid tissue samples (PM, n=15; PB,
  n=12). A total of 46 genes were identified as shared across at least three datasets.
  (B) Cancer Hallmark analysis of the 46 overlapping genes, highlighting significant
  enrichment in pathways related to metabolic reprogramming. The radial plot displays
  adjusted p-values for each hallmark category, with lower values indicating stronger
  enrichment. (C) Bubble plot showing Gene Ontology (GO) cellular component enrichment
  among the intersecting genes. Bubble size corresponds to the number of genes in
  each GO term, and color intensity reflects statistical significance (FDR-adjusted
  p-value). (D) Bubble plot of enriched KEGG pathways for the overlapping genes. Bubble
  size represents the gene ratio (proportion of genes in each pathway), and color
  intensity indicates statistical significance (FDR-adjusted p-value, shown as -log10
  values)'
