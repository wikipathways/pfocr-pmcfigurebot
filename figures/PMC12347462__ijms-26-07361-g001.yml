figure_title: Pharmacological inhibition of PC-PLC pathway affects the TCA-repulsive
  effect of FGF3.
caption: 'Pharmacological inhibition of PC-PLC pathway affects the TCA-repulsive effect
  of FGF3. Thalamic explants were co-cultured with FGF3 beads (500 ng/mL), and inhibitors
  of different pathways were added to the culture medium (n ≥ 6 in each group). (A–C’)
  Compared with the control groups (A,A’: negative PBS control; B,B’: positive FGF3
  control), when cultured with PC-PLC inhibitor D609 (10 µM), FGF3 beads lose their
  ability to repel TCA axons, even exhibiting attractive effects, since more thalamic
  axons (arrow) were observed on the proximal side (towards FGF3 beads) (C,C’). (D)
  The expression of glutamatergic marker Gbx2 in thalamic explants. (E–G’) The inhibitors
  of U73122, U0126, and LY294002, however, show little effects on the TCA axonal rejection
  of FGF3. Scale bars (A–C,E–G) = 80 µm; ***: p < 0.001; Scale bar (D) = 40 µm'
