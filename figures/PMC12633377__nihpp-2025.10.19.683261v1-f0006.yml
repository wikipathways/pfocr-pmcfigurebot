figure_title: Early CPF exposure selectively impacted nitrogen metabolism-related
  pathways in the juvenile zebrafish gut
caption: (A-C) Enrichment analyses detected changes in gut metabolomic pathways in
  CPF-treated fish compared to DMSO control fish, based on untargeted metabolomics
  analysis of gastrointestinal tissues and gut contents. Surveying the RaMP-DB (A),
  SMPDB (B), and KEGG (C) databases consistently identified urea cycle, arginine metabolism,
  and aspartate metabolism among the top enriched pathways (red arrows). Both arginine
  and aspartate are intermediate metabolites of the urea cycle. Changes in nitric
  oxide (NO) metabolism and nitric oxide synthase (NOS) activity were detected by
  surveying RaMP-DB (A). Color coding represents levels of significance (p value).
  The size of each dot represents enrichment ratio. (D) Network view of the enrichment
  analysis result in (A). L-arginine is a precursor for the endogenous production
  of NO through NOS, thereby connecting arginine metabolism, aspartate metabolism,
  and urea cycle with the NO/NOS pathway. (E) Enrichment analysis comparing metabolomic
  changes between CPF+SB and CPF samples based on untargeted metabolomics analysis
  of gastrointestinal tissues and gut contents. Pathways related to the urea cycle,
  arginine metabolism, and aspartate metabolism (red arrows) were identified by surveying
  SMPDB
