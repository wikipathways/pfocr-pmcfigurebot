figure_title: Core Immunopathology and Targeted Therapies of Allergic Rhinitis (AR).
caption: Core Immunopathology and Targeted Therapies of Allergic Rhinitis (AR). This
  figure illustrates the pathogenesis of Allergic Rhinitis (AR), driven by genetic
  predisposition (e.g., HLA, FLG genes) and environmental factors, including microbiome
  imbalance. The core pathology centers on a type 2 inflammatory response, involving
  both innate immunity, where alarmins like TSLP activate ILC2s, and adaptive immunity,
  centered on Th2 cells. These pathways lead to the release of key cytokines (IL-4,
  IL-5, IL-13), which subsequently cause IgE production, eosinophil infiltration,
  and goblet cell hyperplasia. This mechanistic understanding has enabled the development
  of targeted therapies such as Omalizumab (anti-IgE), Dupilumab (anti-IL-4/IL-13),
  and Tezepelumab (anti-TSLP)
article_title: 'The Immunogenetic Landscape of Allergic Rhinitis: from Cellular Effectors
