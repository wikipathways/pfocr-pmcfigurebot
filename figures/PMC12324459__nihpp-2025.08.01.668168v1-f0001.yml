figure_title: SDH loss significantly alters imCC and iMEF total proteomes
caption: A-B. Volcano plot depicting effects of SDH loss on A. imCC and B. iMEF total
  proteomes. Vertical dotted lines indicate fold change (FC) of 2. The number and
  percentage of significantly changed (P (FDR-adjusted p-value) < 0.05, |FC| > 2)
  proteins are labeled in red. C. Venn diagram of all identified proteins shown in
  A. and B. as shared or unique to imCC and iMEF total proteomes. D. Correlation plot
  of total protein changes upon SDH loss between imCCs and iMEFs. Proteins with iMEF
  FC/imCC FC > 1.25 are colored in gold and proteins with imCC FC/iMEF FC > 1.25 are
  colored in teal. E-F. Top 15 upregulated and downregulated pathways upon SDH loss
  for E. imCCs and F. iMEFs from Ingenuity Pathway Analysis
article_title: Distinct proteomic and acylproteomic adaptations to succinate dehydrogenase
  loss in two cell contexts
