figure_title: Metabolic and Immune Responses to Sleep Disruption
caption: 'Under conditions of physiologic sleep (left panel), the intestinal barrier
  is maintained through normal mucus production, tight junction regulation, and a
  favorable metabolic environment that supports the growth of commensal bacteria.
  Growth-associated pathways such as glycolysis, gluconeogenesis, and glycan biosynthesis
  are upregulated, and regulatory immune responses (Treg cell activation, IL-10, TGF-β)
  promote homeostatic balance and SCFA production. During sleep disruption (right
  panel), (A) stress-associated sympathetic outflow (i.e., increased SNS and HPA axis
  activity) (B) leads to reduced gut motility, mucus secretion, and GI blood flow.
  (C) These changes contribute to impaired epithelial integrity, characterized by
  disrupted tight junction proteins and increased intestinal permeability. (D) Consequently,
  there is an increase in pro-inflammatory cytokine production, (E–F) a shift in bacterial
  metabolism from growth-related processes to stress-adaptive and maintenance pathways,
  which (G) leads to a GI environment that promotes the expansion of opportunistic
  bacterial taxa and (H) increased luminal LPS resulting in a continued proinflammatory
  state. (I) Elevated LPS activates systemic inflammatory signaling, leading to increased
  cytokine expression in the systemic circulation, the brain and other tissues (e.g.,
  liver, mesenteric lymph nodes, and white adipose tissue). Additionally, elevated
  levels of NLRP3 and IBA-1 in brain tissue indicate activation of the inflammasome
  (i.e., the multiprotein complex that activates innate immune responses) and neuroinflammation
  in response to cellular stress and/or injury. ɸCircadian disruption was also associated
  with an increase in TCA Cycle and PTS Activity pathways, as well as an increase
  in LPS biosynthesis and microbial virulence pathways. * Across the reviewed studies,
  circadian disruption was also associated with increased systemic LPS, but unlike
  sleep disruption, changes in pro-inflammatory cytokines remained localized to the
  gastrointestinal tract. Abbreviations. HPA: Hypothalamic-Pituitary-Adrenal, IBA-1:
  Ionized Calcium-Binding Adapter Molecule 1, LPS: Lipopolysaccharide, NLRP3: NOD-Like
  Receptor Family Pyrin Domain Containing 3, SCFA: Short Chain Fatty Acid, SNS: Sympathetic
  Nervous System, Treg: Regulatory T Cell. Created in BioRender. Maki, K. (2025) https://BioRender.com/jg7yn5b'
