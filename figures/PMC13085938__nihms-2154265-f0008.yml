figure_title: Sodium-glucose linked transporter 2 (SGLT2) inhibition restores mitochondrial
  function and reduces inflammatory signaling in aged killifish kidneys
caption: '(a) Venn diagram depicting shared and condition-specific expressed genes:
  385 genes were uniquely detected in SGLT2 inhibitor (SGLT2i)–treated aged samples,
  whereas 97 were unique to untreated aged samples. (b) Bar plot showing relative
  proportions of major kidney cell types. No major differences were observed in endothelial
  and perivascular cells counts between the SGLT2i group and the untreated group.
  (c) Heat map displaying expression (Z-score) of key inflammatory genes, including
  NF-κB, CRP, TNF-α, and IL-6, which were downregulated in treated kidneys. (d) Gene
  set enrichment analysis of major kidney cell types showing normalized enrichment
  scores (NESs) for the top 10 gene sets combining biological processes, molecular
  functions, and cellular components. Positive enrichment (blue) highlights restored
  expression of mitochondrial- and electron transport–associated pathways in SGLT2i-treated
  animals, particularly in tubular, endothelial, and perivascular cells. (e) Uniform
  manifold approximation and projection (UMAP) visualization of single renal and nonrenal
  cell types from all conditions (young, old untreated, and old SGLT2i) based solely
  on metabolic gene expression. (f) Same UMAP, colored by sex, highlights a distinct
  male-specific proximal tubular cluster as well as differences in proximal tubule
  S2/S3 cluster. (g) UMAP, colored by age, shows largely overlapping metabolic profiles
  across age groups. (h) Stacked bar plots showing relative proportions of major renal
  cell types (proximal tubule, distal tubule, podocyte, perivascular, and endothelial
  cells) stratified by age, sex, and treatment. SGLT2 inhibition alters vascular cell
  proportions in males but not females'
