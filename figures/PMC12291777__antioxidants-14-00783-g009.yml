caption: 'MAPK and NF-κB inflammatory signaling pathways in the jejunum and longissimus
  dorsi muscle of neonatal piglets. (A) Expression of MAPK (P-ERK/ERK, P-JNK/JNK,
  and P-P38/P38) and NF-κB signaling pathway-related proteins in the jejunum; (B)
  expression of MAPK (P-ERK/ERK, P-JNK/JNK, and P-P38/P38) and NF-κB signaling pathway-related
  proteins in the longissimus dorsi muscle. CON: control group; GML: glyceryl monolaurate
  group. * p < 0.05, ** p < 0.01. Red arrow: decrease. Green arrow: increase. Data
  from newborn piglets (n = 6 per group). Differences were determined using t-tests
  (p < 0.05)'
