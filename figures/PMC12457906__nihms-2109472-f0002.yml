caption: '(A,B) Volcano plots of tenure-associated proteins in (A) S-EVs and (B) L-EVs.
  Dashed line indicates p = 0.05 threshold. Red: positive correlation (estimate >
  0); blue: negative correlation (estimate < 0). Key proteins with significant associations
  (p ≤ 0.05) are labeled. (C) Heatmap visualizing the relative expression of significantly
  correlated proteins (p ≤ 0.05) from both S-EVs and L-EVs across all participants.
  The dendrogram reflects hierarchical clustering of the proteins based on their expression
  patterns. Color scale: red = positive correlation, blue = negative correlation.
  (D) Top functional pathways identified by Metascape enrichment analysis. Bar height
  represents −log10(q-value); colors indicate statistical significance for pathway
  categories. SARS-CoV-2 Signaling and NABA CORE MATRIAOME pathways are highlighted
  with an asterisk (*)'
