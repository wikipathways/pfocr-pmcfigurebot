figure_title: Lipidomic profiles of primary human monocyte-derive model TAMs following
  PFKFB3 inhibition with PFK15 and AZ PFKFB3 26.
caption: 'Lipidomic profiles of primary human monocyte-derive model TAMs following
  PFKFB3 inhibition with PFK15 and AZ PFKFB3 26. The profiles confirm significant
  alterations in key lipid species, including a decrease in glycerophospholipids (PC,
  PE) and an increase in specific ceramides and oxidized lipids upon PFKFB3 inhibition,
  supporting the pathway analysis findings. The panels show levels of individual lipids,
  grouped by class, that demonstrated statistically significant differences in pairwise
  comparisons between non-treated control (NS), PFK15-treated, and AZ PFKFB3 26-treated
  groups (pairwise Mann–Whitney U tests). Data are presented as median values with
  standard deviation. Asterisks denote statistical significance (* p < 0.05) compared
  to the control group, unless otherwise indicated. Lipid classes: Cer—ceramides,
  PC—phosphatidylcholines, PE—phosphatidylethanolamines, OxPL—oxidized phospholipids,
  PS—phosphatidylserines, LPC—lysophosphatidylcholines, CL—cardiolipins'
