figure_title: Global Transcriptional Patterns and Pathway Enrichment on PFAS Exposure.
caption: Global Transcriptional Patterns and Pathway Enrichment on PFAS Exposure.
  (A) UpSet plot displaying common and unique differentially expressed genes (DEGs)
  in whole spheroids across PFAS groups. Left bars represent the total number of DEGs
  for each group, while gray columns indicate intersections between groups. Notably,
  28 genes are shared by the four PFAS groups. PFNA, PFOS, PFOA and PFHxS groups also
  demonstrate unique transcriptional profiles, expressing 1512, 1438, 34 and 8 distinct
  genes, respectively. (B) Heatmap illustrating the scaled expression levels of the
  28 genes shared across spheroids exposed to PFAS. (C) Pathway enrichment analysis
  using the 28 common genes altered by PFAS exposure, highlighting shared biological
  processes affected by PFAS exposure. (D) Pathway enrichment analyses showing pathways
  altered by the unique DEGs identified in spheroids from each PFAS group
