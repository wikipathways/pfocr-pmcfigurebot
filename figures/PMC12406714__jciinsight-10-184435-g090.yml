figure_title: Loss of uracil DNA glycosylase (UNG) activity leads to persistence of
  uracil (U) and 5-fluorouracil (FU) bases in DNA
caption: The uracil base excision repair pathway (UBER, left) efficiently excises
  U and FU (not shown) bases from DNA irrespective of whether the base pairs involve
  A or G. After the multiple-step pathway is complete, the excised nucleotide is replaced
  with either dTMP or dCMP using the coding information of the complementary strand
  base. In the absence of UNG activity (right), U or FU residues persist, leading
  to transition mutations after the DNA replication machinery encounters the lesion
  (U/G → T/A). U and FU lesions located on the template strand have been implicated
  in stalled DNA replication forks, and due to increased wobble base pairing, increase
  the misincorporation of guanine opposite to the U or FU base. Created with Biorender
article_title: Ablating UNG activity in a mouse model inhibits colorectal cancer growth
  by increasing tumor immunogenicity
