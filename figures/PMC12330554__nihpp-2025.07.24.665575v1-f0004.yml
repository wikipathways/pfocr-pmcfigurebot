figure_title: Genes impacted by HR-PCBs in the mouse brain
caption: 'A. Volcano plots showing differentially expressed genes impacted by HR-PCB
  mixture in different brain regions: hippocampus, thalamus, fiber tracts, neocortex,
  and caudoputamen. B. Pathway analysis showing significantly enriched pathways (GO:
  Molecular function) (p.adjust < 0.01 & qvalue < 0.05) on unique or common genes
  upregulated or downregulated in five brain regions. The top three gene function
  annotations are shown. Upregulated and downregulated DEGs are shown in red and blue
  colors, respectively'
