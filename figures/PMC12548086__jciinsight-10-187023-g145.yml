figure_title: DNA accessibility data analysis of PM2.5-exposed BAT
caption: '(A) Multidimensional scaling plot of biological replicates from FA (n =
  3) and PM2.5 (PM: n = 3) in the DNA accessibility data of BAT. (B and C) Bayesian
  ANOVA (BAM) “M” scatter plot of statistically significant differentially accessible
  regions (DARs: 2278, of which 833 are with a gain of accessibility [GA] and 1445
  with a loss of accessibility [LA]) in PM2.5-exposed BAT. (B) The BAM “M” plot is
  a shrinkage plot, where each point represents a single DAR. Red and green dots indicate
  GA and LA DARs, respectively. The y axis is the posterior variance and the x axis
  is the Bayesian test statistic (Zcut) value. (C) The volcano plot, in which every
  point represents a single DAR, is a scatter plot of statistical significance versus
  magnitude-of-change, where the y axis represents the absolute value of the Bayesian
  test statistic (Zcut) and the x axis represents the log(fold change). (D) Table
  of top 10 significant DARs ordered by decreasing significance and by DNA accessibility
  status: GA (red) or LA (green). “NAs” refer to intergenic DARs peaks with no gene
  annotation. (E) Illustration of PM2.5 exposure–induced DNA accessibility peaks profiles
  of DARS in specific pathways of interest. Left: BAT Metabolism (Ucp1). Middle: ROS
  and Glutathione Metabolism (Gclc), Right: Circadian Rhythm (Sik1). (F) GO analysis
  (Biological Process) of DAR significant GO terms by DNA accessibility status. (G
  and H) Bar plots of GREAT analysis by DNA accessibility status. (G) Genomic partition
  distribution and (H) genomic feature distance distribution (DAR peaks to TSSs) of
  DARs associated with GA or LA. (I and J) Predicted DAR target motifs and regulatory
  enhancer sites by GREAT analysis. (I) Comparison of significant transcription factors
  motifs of DAR target genes by DNA accessibility status. (J) RGT_HINT analysis of
  significant (enriched) transcription factor DNA-binding sites of DAR target genes
  by DNA accessibility status'
