figure_title: AJ and B6 developing lungs have distinct gene expression signatures
  and differential activation of a SM gene regulatory network under RA-deficiency
caption: '(A) Experimental design: E14.5 lungs from AJ or B6 embryos under maternal
  BMS (3.75 μg/bw/day) or control diets.(B) Bulk RNA-seq: Hierarchical clustering
  heatmap of sample-to-sample distances from variance-stabilized RNA-seq data: segregation
  by strain (AJ vs B6) (left). Principal Component Analysis (PCA, right) plot of variance-stabilized
  RNA-seq data: sample clustering based on strain and treatment status. Points colored
  by strain and treatment revealing transcriptional shift by BMS administration in
  AJ and B6 E14.5 lungs. PC1 and PC2 variance: strain effect vs BMS effect.(C) Differential
  gene expression between controls AJ and B6 E14.5 lungs. Hierarchical clustering
  and unsupervised heatmap depicting the top genes enriched in each strain (* depicts
  Lrat as a top enriched in AJ control, see text).(D) Distinct response of AJ and
  B6 embryonic lungs to BMS exposure. Volcano plots: differentially expressed genes
  (DEGs) in BMS vs control embryonic lungs from AJ and B6 mice. Number of DEGs downregulated
  or upregulated depicted in boxes and highlighted in red if padj < 0.05 and log2FC
  > 0.58. Supervised heatmap (DEGs control vs BMS from bulk RNA-seq highlighting markers
  of RA activity (*) downregulated in AJ and B6.(E and F) Gene set enrichment (GSE)
  and Undirected Linear Motif (ULM) analysis of transcription factor (TF) activity
  in BMS vs control from AJ and B6 lungs. Plots in (E): significantly enriched GO
  terms (padj < 0.05) activated (left) or repressed (right) ordered by GeneRatio in
  AJ lungs; (*) highlight GO terms associated with muscle function. (F) Analysis of
  TF activity: Bar charts depict the 25 most differentially activated TFs ranked by
  activity in BMS vs Control (AJ: top; B6: bottom). Positive scores (red): increased
  activity in BMS; negative scores (blue) increased activity in control (*p<0.05,
  **p<0.01, ***p<0.001). Right panels: String DB network visualization of key regulatory
  pathways altered by BMS in each strain: increased activity of muscle tissue development-related
  TFs in BMS-AJ but not BMS-B6 lungs. Red nodes: TFs with significantly elevated activity
  by BMS. Edge thickness represents confidence of functional associations based on
  experimental evidence, co-expression data and pathway information'
