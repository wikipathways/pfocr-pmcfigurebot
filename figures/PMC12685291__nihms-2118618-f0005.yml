figure_title: Hpa2 LOF reduces endothelial glycocalyx (eGCX) quantity and dysregulates
  EC signaling in zebrafish larvae
caption: '(A) Workflow for EC analysis in Hpa2 LOF larvae with a Tg(fli1:EGFP) background.
  Hpa2 LOF fish and control fish were pooled and dissociated into single cells at
  96 hpf. Cells were either stained and subjected to quantitative analysis using cytometry,
  or were sorted to enrich GFP+ ECs. RNA of ECs was isolated and subjected to bulk
  RNA sequencing. (B) Gating strategy for sorting and analyzing ECs. (C) Representative
  analysis of glycocalyx stained by wheat germ agglutinin in GFP+ cells (upper) and
  GFP-negative (lower) comparing Hpa2 LOF and control larvae at 96 hpf (50 individual
  larvae per group). (D) Venn diagram of genes expressed in Hpa2 LOF (red) and control
  (blue) larvae. (E) Number of genes differentially expressed (blue: downregulated,
  red: upregulated) between Hpa2 LOF and control ECs. (F) Volcano plot of differentially
  expressed genes. Genes with p value ≤ 0.05 and fold change ≥ 2 are colored. (G)
  Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis of differentially regulated
  pathways. The numbers to the right of the horizontal bars indicate the numbers of
  differentially regulated genes in the corresponding pathway. (H) Gene Ontology analysis
  of dysregulated biological processes. Gene ratio expresses the number of differentially
  expressed genes in a pathway relative to all genes grouped to that pathway. (I)
  Number of genes that are up- (red) or down-regulated (blue) in the corresponding
  biological process. (J, K) Gene set enrichment analysis of MAPK (mitogen-activated
  protein kinase) signaling pathway (J) and mTOR (mammalian target of rapamycin) signaling
  pathway (K). NES = Normalized enrichment score. Graphs shown in (D-K) derive from
  RNA isolated and pooled from n = 100 larvae per group'
