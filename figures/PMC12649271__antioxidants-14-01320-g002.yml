figure_title: Transcriptional effects of CHA on the skin of a photoaged mouse model.
caption: 'Transcriptional effects of CHA on the skin of a photoaged mouse model. (A)
  Volcano plots showing DEGs (q-value < 0.05 and |log2fold change| > 0.58) identified
  in NC vs. MC (left) and CHA vs. MC (right) comparisons. Red and blue dots represent
  significantly up- and downregulated genes, respectively. (B) Venn diagrams showing
  overlapping of DEGs between the two comparisons: upregulated (left), downregulated
  (right). (C) Heatmap visualization for overlapped DEGs between the two comparisons:
  upregulated (left), downregulated (right). Each column represents the column-normalized
  expression pattern of a single gene. Red indicates upregulation. Blue indicates
  downregulation. (D) KEGG pathway enrichment analysis for overlapped DEGs between
  the two comparisons: upregulated (left), downregulated (right). Data were obtained
  from three independent biological replicates'
