figure_title: Propagation of immunolabeling with cell death pathway antibodies for
  control (CT) and pneumonia-induced groups (G2, G3, G4).
caption: Propagation of immunolabeling with cell death pathway antibodies for control
  (CT) and pneumonia-induced groups (G2, G3, G4). The first row of images shows the
  negative control utilizing tris-buffered saline (TBS). Propagation of anti-Beclin-2
  (Bcl-2) antibody labeling (second row) was low throughout all bronchioles (CT–G3),
  receding into the portion of the bronchiole and limited to some regions (G4). Labeling
  with anti-cathepsin D (third row) was evident from the beginning, as it spread in
  the bronchioles (CT–G3), followed by a decrease in propagation in the final group
  (G4). For Bax (fourth row), the antibody was seen to advance into the bronchioles
  (CT–G4), with some limitation in the alveoli (G3, G4). Anti-caspase-3 antibody labeling
  (fifth row) propagated progressively in the bronchioles and alveoli (CT–G3), ending
  with reduced propagation in the final group (G4)
