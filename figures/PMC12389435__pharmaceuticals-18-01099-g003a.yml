figure_title: Effects of ALR-ELN treatment on immune response and signaling pathway
  activation.
caption: 'Effects of ALR-ELN treatment on immune response and signaling pathway activation.
  Bubble charts that show significantly enriched canonical pathway categories (Y axis)
  are listed according to the right-tailed Fisher’s exact test p-values (X axis; −log
  (p-value) > 1.3) as shown: (a) LPS+ELN vs. LPS and (b) ELN vs. control. Orange circles:
  positive-value z-score; blue circles: negative-value z-score; gray circles: zero-value
  z-score. Detailed information on molecules belonging to each pathway category is
  provided in Supplementary Table S1 (LPS+ELNs vs. LPS) and Table S2 (ELNs vs. control).
  The vertical axis represents the pathway classification category, and the size of
  each circle indicates the number of genes that overlap in each pathway. Horizonal
  bars indicate the top 20 significantly enriched canonical pathways (Y axis) listed
  according to their p-values (X axis; −log (p-value) > 1.3), (c) LPS+ELN vs. LPS
  and (d) ELN vs. control. Orange bars, predicted pathway activation z-score; blue
  bars, predicted pathway inhibition; gray bars, no activity prediction; white bars,
  pathways with z-scores at or very close to 0 or if there are fewer than four analysis-ready
  molecules, resulting in a z-score that cannot be calculated (z-score = NaN), respectively.
  Z-scores that are greater than or equal to 2 represent predictions of activation,
  whereas those less than or equal to −2 represent predictions of inhibition'
