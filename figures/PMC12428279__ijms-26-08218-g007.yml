figure_title: Top 20 KEGG pathways enriched among predicted target genes of differentially
  expressed miRNAs in the MDD group.
caption: Top 20 KEGG pathways enriched among predicted target genes of differentially
  expressed miRNAs in the MDD group. The analysis was conducted using DIANA-miRPath
  v4.0 based on the top 20 miRNAs. The x-axis represents the −log10(FDR) significance
  score, while the number of target genes associated with each pathway is shown on
  the right side of the bars. Enriched pathways include Alzheimer disease, Parkinson
  disease, AMPK signaling, and ubiquitin-mediated proteolysis, suggesting shared neurodegenerative
  and cellular stress-related mechanisms in MDD
