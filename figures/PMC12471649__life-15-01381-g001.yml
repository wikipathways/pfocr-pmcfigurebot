caption: 'Schematic diagram of the finite-replicated organisms (FROs) framework with
  three modules: an ncAA module, a rescue module, and a suicide module that releases
  Cl2Y via controlled proteolysis (degradation arrow), sustaining endogenous ncAA
  supply for survival. Rescue Module A (dusty green) links ncAA availability to a
  degradable storage protein gene containing 8 TAG codons. This module is coupled
  with Ptac-driven expression of essential genes carrying dual TAGs (Suicide Module
  A, dusty orange), enabling infinite growth only when ncAA-dependent translation
  machinery (tRNA/aaRS) actively suppresses TAG stop codons. Toxin–Antitoxin (TA)
  strategy (right pathway, Module B): the same ncAA module drives antitoxin expression
  (2TAG-coded) to produce antitoxin (Rescue Module B, dusty green). In Suicide Module
  B (dusty orange), growth hinges on dynamic TA neutralization: antitoxin directly
  binds toxin (protein interaction node) to permit replication. Finite replication
  emerges from TAG codon competition (2TAG mRNA vs. translational components), while
  AND-gate logic triggers irreversible termination upon ncAA depletion or TA imbalance'
article_title: A Programmable Finite-Replicated Organism Framework for Balanced Safety
