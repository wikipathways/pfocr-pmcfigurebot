figure_title: Angiotensin II–mediated signaling pathways regulating COX-2 expression.
caption: Angiotensin II–mediated signaling pathways regulating COX-2 expression. Binding
  of ANG II to AT1R activates the mitogen-activated protein kinase (MAPK) and NF-κB
  pathways, as well as phospholipase A2 (PLA2). Crosstalk between PKC and MAPK enables
  PKC to activate Raf-1 and downstream ERK, leading to ERK-mediated transcriptional
  regulation of the COX-2 gene [79,116]. In parallel, PKC activates IκB kinase (IKK)
  within the NF-κB pathway, further promoting COX-2 expression [117]
