caption: Gene Set Enrichment Analysis (GSEA) reveals metabolic reprogramming and altered
  immune responses in uEV from treated IC patients. Ridge plots showing the distribution
  of enrichment scores for the top 10 most enriched Hallmark gene sets (A) and C5
  gene sets (B). Each ridge plot represents a different pathway, with the x-axis showing
  the enrichment score and the y-axis listing pathway names. The shape and position
  of the distribution indicate the degree and direction of enrichment. Colors represent
  the adjusted p-value (p. adjust)
