figure_title: Depletion of TRAP1 restricts metabolic plasticity to factitive glycolytic
  metabolism
caption: (A) GSEA of mass spectrometry was performed with MSigDB HALLMARK gene set
  and is summarized as the normalized enrichment score (NES) in WT and KO cells. (B,
  C) Enrichment analysis was carried out using the GSEA HALLMARK gene set. GSEA plots
  of hypoxia and glycolysis genes are presented within the TRAP1 metabolic gene signature.
  (D) Differential gene expressions were analyzed using DEseq2, with fold change >1.5
  and FDR <0.1. Volcano plot shows relative fold change (log2) in protein abundance
  versus −log10(P values) from WT cells compared with KO cells. Proteins that demonstrate
  a significant change in expression are colored, with decreased expression in green
  color and increased expression in red color. (E, F) BP and KEGG pathway analysis
  of the differential gene expressions was conducted using ShinyGO website. The dot
  plot represents the top 10 significant pathways ranked according to − log enrichment
  P value. (G) Correlation analysis of TRAP1 with HIF1A and HIF1A with MCT1 expression
  in the TCGA database was performed using the ENCORI website. (H) Cells were fixed
  with 4 % paraformaldehyde and stained with HIF1A antibody. Staining was analyzed
  ushing a Nikon microscope. (I) Nuclear and cytoplasmic fractions of WT and KO cells
  were separated using a nuclear extraction kit (ThermoFisher). TRAP1, HIF1A, Lamin
  B1, and Tubulin proteins were detected using specific antibodies by Western blotting.
  (J) WT and KO cells stably expressing HRE-luciferase were subjected to a reporter
  assay using the Promega luciferase kit, One-GLO. Luminescence levels were measured
  using a Luminescence reader. (K) TRAP1, HIF1A, GLUT1, MCT1, and Actin proteins were
  detected using Western blotting. (L) Illustration of TRAP1 depletion induces ROS
  generation to facilitate glycolysis pathway through ROS-HIF1A axis. P < 0.05 (*),
  P < 0.01 (**)
