figure_title: Hematopoietic cysteinyl leukotriene production constitutes an acutely
  inhibitable pathway required for oral anaphylaxis
caption: (A) Effect of chronic Zileuton administration on severity of active oral
  anaphylaxis in BALB/cJ (B) effects of acute Zileuton administration from 5th challenge
  on severity of oral anaphylaxis in BALB/cJ (C) effects of acute Zileuton administration
  on severity of intravenous anaphylaxis (D) effect of LTC4S KO or WT BALB/cJ status
  on severity of active oral anaphylaxis (E) FcεR1-DTR (RMB) mice were sublethally
  irradiated and transplanted with bone marrow cells derived from WT or LTC4S KO mice,
  or a mix of 1:1 WT and LTC4S KO mice. The mice were then rested for 8 weeks before
  being sensitized and orally challenged as previously described. (F) Temperature
  drop over time after 4th oral OVA challenge and greatest temperature drop. D denoted
  death within a mouse group. (G) LTC4S KO mice were passively sensitized with aDNP-IgE
  and challenged 16–24 hours later with 25ng-250ug of DNP-HSA intravenously and anaphylaxis
  severity assessed by greatest rectal temperature over the ensuing hour. n=3–11 per
  group for mouse experiments across 2–3 independent experiments except for panels
  E-F which are from one. Statistics were performed by one-way ANOVA with multiple
  comparisons in A-D, G and unpaired t-test in F. Each dot represents an individual
  mouse. Horizontal lines represent mean. *p<0.05, **p<0.01, ***p<0.001, and ****p<0.0001
article_title: Intestinal mast cell-derived leukotrienes mediate anaphylactic response
  to ingested antigens
