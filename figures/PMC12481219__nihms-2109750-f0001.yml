figure_title: Multi-omics profiling of Catharanthus roseus tissues reveals tissue-specific
  insights into metabolism and gene regulation
caption: Illustration of C. roseus with major tissue types analyzed using various
  omics approaches. Stem tissues were analyzed with spatial metabolomics to map early,
  late, and central biosynthetic pathways across tissue layers. Single-cell RNA-sequencing
  (scRNA-seq) and single-cell metabolomics were performed on petal and root tissues
  to explore cell type-specific gene expression and metabolite profiles. In leaf tissues,
  scRNA-seq, single-cell assay for transposase-accessible chromatin using sequencing
  (scATAC-seq), and single-cell metabolomics were conducted, enabling integrated analysis
  of transcriptomic, epigenomic, and metabolic profiles. The t-distributed stochastic
  neighbor embedding (t-SNE) plot (right) represents cell clustering from single-cell
  transcriptomic data, highlighting cellular heterogeneity in the petal
