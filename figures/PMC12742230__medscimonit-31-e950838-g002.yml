figure_title: Multivariate separation and univariate screening of oxylipins.
caption: |-
  Multivariate separation and univariate screening of oxylipins. (A) PCA and OPLS-DA score plots demonstrate clear separation between DCM (red) and control (green) samples. OPLS-DA model validity was assessed by 7-fold cross-validation and permutation testing. (B) Volcano-style dot plot of 2-sample Wilcoxon rank-sum tests (FDR <0.05) highlights the top 5 differentially abundant oxylipins (fold change on x-axis, -log10 FDR on y-axis). (C) IPA of 16 significant oxylipins: top canonical pathways ranked by -log10 (P-value), with bar color indicating predicted activation state (gray=no prediction). (D) IPA Top Diseases and Bio Functions: bars represent -log10
  P-values for enriched disease/function categories; dashed line denotes the significance threshold (-log10
  P=2). DCM – dilated cardiomyopathy; FDR – false discovery rate; IPA – Ingenuity Pathway Analysis; OPLS-DA – orthogonal partial least squares-discriminant analysis; PCA – principal component analysis
