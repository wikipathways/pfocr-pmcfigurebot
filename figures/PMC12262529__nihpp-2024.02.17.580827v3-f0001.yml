figure_title: Overview of the E. coli 1-carbon metabolism pathway and YFP complementation
  method used to detect protein-protein interaction (PPI)
caption: (A) Purine, pyrimidine and folate biosynthesis pathways converge on to the
  1-carbon metabolic pathway. (B) PPI is detected by bimolecular fluorescence complementation
  assay (BiFc) using the split YFP system wherein N-terminus of YFP molecule is fused
  to protein A, while the C-terminus is fused to protein B. A mature fluorescent YFP
  molecule is formed by complementation only if protein A and protein B interact.
  (C) A mutually compatible two-plasmid based system used for expression of YFP-fusion
  proteins. NYFP-protein A is expressed from an IPTG-inducible lac promoter, while
  CYFP-protein B is expressed from an arabinose inducible pBAD promoter. Representative
  flow-cytometry data for (D) a weakly interacting PPI pair and (E) strongly interacting
  pair. For both panels D and E, the left panel shows the SSC (side scatter of cells)
  as a function of fluorescence. SSC is a measure of internal granularity of the cell,
  which helps to identify a particular cellular population. P2 highlights the population
  that shows higher fluorescence than untransformed E.coli cells (not shown). This
  population is for visualization purpose only and is not used to calculate any relevant
  parameter for this study. The histogram on the right panel is derived from all cells
  (red and green dots together) in the left panel, and the mean fluorescence intensity
  (MFI) of this histogram is used to assess the extent of interaction
article_title: Conserved interfaces mediate multiple protein-protein interactions
  in a prokaryotic metabolon
