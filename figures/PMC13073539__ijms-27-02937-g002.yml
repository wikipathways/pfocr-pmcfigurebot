figure_title: Metabolic origins, compartmentalization, and regulatory network of propionyl-CoA
  and Kpr.
caption: Metabolic origins, compartmentalization, and regulatory network of propionyl-CoA
  and Kpr. This schematic summarizes major sources of propionyl-CoA and the writer/eraser/reader
  network governing Kpr on histone and non-histone proteins. Exogenous propionate
  (e.g., microbiota-derived) can be activated to propionyl-CoA by acyl-CoA synthetases
  (e.g., ACSS2), whereas endogenous propionyl-CoA is generated primarily in mitochondria
  through catabolism of propiogenic substrates. Mitochondrial propionyl-CoA is normally
  routed to the TCA cycle via the propionyl-CoA carboxylase/methylmalonyl-CoA/succinyl-CoA
  pathway. When propionyl-CoA accumulates, a fraction can be buffered as propionyl-carnitine
  and redistributed to extra-mitochondrial compartments. Propionyl-CoA can also be
  produced in nucleus via catabolism of BCAA (e.g., isoleucine). Propionyl-CoA serves
  as the direct acyl donor for Kpr, which is written by KATs, erased by sirtuins and
  class I HDACs, and recognized by multiple reader modules. Kpr influences chromatin
  organization and transcriptional activity, whereas non-histone propionylation modulates
  protein stability and synthesis. Created in BioRender. Z.L. (2026) https://BioRender.com
