figure_title: Transcriptional reprogramming by selenium nanoparticles reverses adipogenic
  differentiation in TED.
caption: 'Transcriptional reprogramming by selenium nanoparticles reverses adipogenic
  differentiation in TED. (A) Three-dimensional PCA illustrating global transcriptomic
  differences among the control, DM (adipogenic differentiation), and Se@LNT intervention
  groups. (B) Volcano plot of DEGs between DM and control groups, identifying 1,352
  upregulated and 1,978 downregulated genes (threshold: |log2FC| ≥ 1 and adjusted
  p < 0.05. (C) Se@LNT-mediated reversal of DM-induced DEGs, with 823 upregulated
  and 576 downregulated genes (threshold as in B). (D) KEGG functional annotation
  of genes upregulated in DM vs. control. (E) KEGG annotation of genes downregulated
  in Se@LNT vs. DM groups. (F) KEGG pathway enrichment analysis of upregulated genes
  in DM vs. control. (G) KEGG pathway enrichment analysis of downregulated genes in
  Se@LNT vs. DM'
