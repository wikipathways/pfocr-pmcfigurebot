figure_title: Enriched metabolic pathways in Lactobacillus-fermented yogurt at the
  terminal fermentation stage.
caption: Enriched metabolic pathways in Lactobacillus-fermented yogurt at the terminal
  fermentation stage. Based on differential metabolic pathway analyses, Lactobacillus-supplemented
  yogurt (L9 + HYY and LAC + HYY) was compared with conventional HYY yogurt. (A) L9
  + HYY and (B) LAC + HYY exhibited distinct pathway enrichment patterns (p < 0.05)
  in both positive and negative ionization modes. Analyses were performed in MetaboAnalyst
  5.0 (KEGG database) with significance thresholds at VIP ≥ 1.0 and p < 0.05. The
  pathway importance is represented by topological impact scores (x-axis); the statistical
  significance (−log10 p-value, y-axis) is visualized using the bubble size (impact
  value) and color gradient (p-value magnitude)
