figure_title: CRES exchanges with larger DNA-bound CRES oligomers.
caption: 'CRES exchanges with larger DNA-bound CRES oligomers. (a) Comparison of backbone
  amide 15N transverse relaxation rates (15N R2) of wild type CRES in the absence
  and presence of 2.5% and 5% hairpin DNA. P-values were calculated by one-way ANOVA
  and Tukey’s multiple comparisons test. (b) Schematic of the proposed DNA-CRES binding
  mechanism, where CRESm DNA indicates another CRES-DNA aggregate that can interact
  with CRESn DNA. (c) Model (PDB ID: 6UIO) highlighting the mutants used to disrupt
  the two oligomerization pathways. (d) Cartoon depicting the pathway blocking mutants:
  T79G (blocks L1 loop pathway), LMA (blocks CRES loop interactions), and T79G + LMA
  (blocks both pathways). (e) Comparison of 15N lifetime line-broadening (15N ΔR2)
  measurements for wild type, T79G + LMA, and T79G CRES in the presence of 5% 15-bp
  hairpin DNA. P-values were calculated by one-way ANOVA followed by Tukey’s multiple
  comparisons post-test'
