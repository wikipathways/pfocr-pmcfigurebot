figure_title: The CD47–SIRPα pathway.
caption: The CD47–SIRPα pathway. In physiological situations, there is a balance between
  reciprocal CD47–SIRPα ligation, resulting in an inhibitory effect. Whenever a higher
  affinity CD47–SIRPα interaction occurs (eg, in transplantation), monocytes can be
  activated to differentiate into mature, interleukin-12-producing dendritic cells.
