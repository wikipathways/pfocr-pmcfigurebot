figure_title: Serine-dependent glutathione synthesis tunes human NK cell effector
  functions
caption: a, Schematic showing serine contributions to glutathione synthesis. b, Percentage
  of glutathione labelled by [2,3,3-2H]-serine-derived 2H in freshly isolated or 48
  h IL-2/15-stimulated human NK cells cultured with [2,3,3-2H]-serine for 24 h followed
  by LC–MS. c, Representative histograms showing two independent donors (left) and
  quantification of MFI (right) of ThiolTracker Violet in human NK cells cultured
  in Ser+ or Ser− medium with IL-2/IL-15 for 48 h. d, MFI of ThiolTracker Violet in
  Ser+ or Ser− splenic mouse NK cells. e, Representative histograms (left) and quantification
  of MFI (right) of MitoBright ROS Deep Red staining of human NK cells cultured in
  Ser+ or Ser− medium for 48 h followed by staining with or without piericidin A treatment
  (100 nM). f, Schematic showing glutathione synthesis pathway with key enzymes highlighted.
  g, MFI of ThiolTracker Violet in control ABE8e only-edited or GCLC KO human NK cells
  6 d post-electroporation. h, Quantification of percentage IFN-γ+ and IFN-γ MFI of
  cytokine-producing cells of control edited or GCLC KO human NK cells 6 d post-electroporation
  following stimulation with K562 cells, IL-2/IL-15 and IL-12. i, MFI of ThiolTracker
  Violet in NTC-edited or GCLCCRISPRa human NK cells 6 d post-electroporation. j,
  Quantification of percentage IFN-γ+ and IFN-γ MFI of cytokine-producing cells of
  NTC-edited or GCLCCRISPRa human NK cells 6 d post-electroporation following stimulation
  with K562 cells, IL-2/IL-15 and IL-12. k, Percentage specific lysis of K562 cells
  by control edited or GCLC KO/CRISPRa human NK cells 6 d post-electroporation at
  a 1:1 E/T. l, OCR of NTC-edited or GCLCCRISPRa human NK cells. Cells were subjected
  to sequential treatment with oligomycin (O), FCCP (F) or rotenone with antimycin
  A (R + A). m, Quantification of spare OCR in NTC-edited or GCLCCRISPRa human NK
  cells. Data represent mean ± s.e.m. or individual paired donors across at least
  two independent experiments. Data are representative of n = 3 (b), n = 13 (c), n
  = 5 (e), n = 8 (g,h,k), n = 9 (i,j) and n = 7 (l,m) independent human donors and
  n = 6 independent mice (d). *P < 0.05, **P < 0.01, ***P < 0.001 by two-sided paired
  t-test (b–d,g–j,m) or two-way ANOVA (e,h,j–l). Exact P values are P = 0.0031 (b);
  P = 0.0034 (c); P = 0.0050 NT Ser+ versus NT Ser−, P = 0.0015 NT Ser− versus piericidin
  A Ser− (e); P = 0.0002 (g); P = 0.0009 (h); P = 0.0023 (i); P = 0.0009, P = 0.0002
  (j); P = 0.0032, P = 0.0026 (k); P = 0.0112 (l); P = 0.0271 (m)
