figure_title: Sesn2 promotes muscle regeneration under injury conditions
caption: (A) Enrichment plot for the TGF-β signaling pathway, PGC-1α target genes,
  and ERRα target genes (“WP Canonical and noncanonical TGFB signaling; M39686”, “Mootha
  PGC; M9788”, and “Stein ESRRA Targets Up; M18491”). (B) Expression levels of genes
  associated with muscle regeneration under immobilized condition. Row-normalized
  levels for each wild type (WT) or TgSesn2 sample (left). Levels of significant differentially
  expressed genes in TgSesn2 compared with WT (right). (C) Representative H&E-stained
  cross-sections of TA muscles from uninjured (day 0) and injured (7, 14, 21, and
  28 days after CTX injection) WT and Sesn2 KO mice (n = 3) (top panel). Quantitative
  analysis of muscle fiber CSA was performed on the same samples (bottom panel). Statistical
  significance was determined using an unpaired two-tailed Student’s t-test. Results
  are expressed as the mean ± SEM. Sesn2, sestrin2; TGF-β, transforming growth factor
  beta; PGC-1α, peroxisome proliferator-activated receptor gamma coactivator-1 alpha;
  ERRα, estrogen-related receptor alpha; Tg, transgenic; TA, tibialis anterior; CTX,
  cardiotoxin; KO, knockout; CSA, cross-sectional area; FDR, false discovery rate;
  NES, normalized enrchiment score; ns, non-significant. ****p < 0.0001
