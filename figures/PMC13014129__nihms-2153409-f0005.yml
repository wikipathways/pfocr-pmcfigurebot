figure_title: Distal epithelial cells at E21 in CDH upregulate genes related to fibrosis,
  and epithelial regeneration.
caption: 'Distal epithelial cells at E21 in CDH upregulate genes related to fibrosis,
  and epithelial regeneration. (A) UMAP embedding of all epithelial cells at E21 with
  corresponding plot showing cell representation by condition. (B) Barplots with proportion
  of each cell type within the epithelium in normal and CDH lung showing decrease
  in AT2 cell proportion in CDH (15%) versus normal (28%). In CDH, the epithelium
  is in a (C) transitional epithelial stem cell state, and shows (D) upregulation
  of TGFβ pathway, and (E) profibrotic molecules. (F-H) In CDH, distal epithelial
  cells (AT1 and AT1 cells) are responsible for dysregulated gene expression. (I)
  Immunohistochemical staining of paraffin-embedded E21 lung tissue (CDH and Normal)
  demonstrating differential Krt8 expression. In CDH lungs, Krt8 is upregulated in
  the alveolar regions, marking ATI and ATII cells, whereas in normal lungs, Krt8
  expression is largely restricted to the large airways. Vimentin (Vim) staining is
  included for comparison. Arrows indicate Krt8+ alveolar cells in CDH lungs and Krt8+
  airway cells in normal lungs. Scale bar: 250 μm'
