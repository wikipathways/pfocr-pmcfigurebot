figure_title: Eno enhances sorafenib-induced ferroptosis is accompanied by a synergistic
  inhibition of the p62/Keap1/Nrf2/HO-1 signaling pathway in HepG2 cells.
caption: 'Eno enhances sorafenib-induced ferroptosis is accompanied by a synergistic
  inhibition of the p62/Keap1/Nrf2/HO-1 signaling pathway in HepG2 cells. HepG2 cells
  were treated with sorafenib (2 μM) or sorafenib (2 μM) in combination with Eno (100
  μg/mL) for 24 h, cells were harvested for assay. (A) The protein expression levels
  of p62, Keap1, Nrf2 and HO-1 in HepG2 cells were evaluated by Western blot analysis.
  (B) mRNA expression levels of corresponding genes were determined by qRT-PCR. n
  = 3 biologically independent samples. * is the comparison between the experimental
  group and the control group, and # is the comparison between the groups, * p < 0.05,
  ** p < 0.01, *** p < 0.001 and # p < 0.05, ## p < 0.01, ### p < 0.001. p values
  were determined by unpaired two-tailed Student’s t-tests or one-way ANOVA'
