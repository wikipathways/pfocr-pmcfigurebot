caption: 'Neutrophil extracellular trap (NET)—bioresorbable scaffold (BRS) interaction
  axis: triggers, mechanisms, and outcomes. Schematic diagram illustrating the NET-BRS
  interaction axis. The figure shows: (1) the initial foreign body response following
  BRS implantation and protein adsorption; (2) NET triggers including scaffold surface
  properties (hydrophobicity, topography), degradation products (lactic acid, crystalline
  residues, metal ions), and platelet–neutrophil interactions via the P-selectin/PSGL-1
  pathway; (3) the NETosis cascade via ROS production, NADPH oxidase activation, PAD4-mediated
  histone citrullination, and chromatin decondensation; (4) NET-mediated outcomes
  including immunothrombosis (tissue factor exposure, platelet activation), impaired
  endothelialization, heterogeneous degradation, and mechanical instability—along
  with therapeutic intervention points (DNase, PAD4 inhibitors, anti-inflammatory
  coatings, surface modifications); (5) circulating biomarkers (cfDNA, citH3, MPO-DNA,
  NE-DNA) and imaging methods for monitoring'
