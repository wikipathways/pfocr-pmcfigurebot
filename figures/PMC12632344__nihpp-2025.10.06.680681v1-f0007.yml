figure_title: Models for cytokinesis-linked hepatocyte polarization and BC formation
caption: (A) Schematic illustrating the overlapping and distinct roles of E-cadherin
  and N-cadherin in controlling BC elongation and maintaining hepatic polarity via
  opposing effects on RhoA activity. E-cadherin activates RhoA at the AJs surrounding
  the BC and at the cleavage furrow via ARHGEF17, while restricting active RhoA to
  the division site via NuMA at the lateral membrane during cytokinesis. This spatially
  restricted RhoA activity enables the recruitment of E-cadherin to nascent cell-cell
  contacts between daughter cells, promoting new AJ assembly during primordial BC
  formation and BC elongation. ARHGEF17 and NuMA also contribute to BC elongation
  by regulating spindle orientation (see below). While N-cadherin shares the role
  of promoting AJ assembly during primordial BC formation with E-cadherin, it also
  decreases RhoA activity at AJs via ARVCF and p190B RhoGAP, thereby preventing an
  unwanted switch from hepatic to columnar polarity.(B) Model depicting the roles
  of two distinct mechanical forces in regulating spindle orientation during BC elongation.
  The first force is generated by E-cadherin—NuMA—dynein—astral microtubule pathway
  at the cell poles (#1), which governs the initial selection of spindle orientation.
  The second force arises from a RhoA-mediated actomyosin belt at the AJs surrounding
  the BC membrane, activated by ARHGEF17 (#2). This force stabilizes spindle orientation
  by anchoring the dividing cell at the BC side of its cleavage furrow and also provides
  an asymmetric mechanical cue that biases furrow ingression towards the BC (#3 and
  red arrow). RhoA–ROCK-dependent constriction of the contractile ring enables E-cadherin
  delivery to the division site during cytokinesis, promoting the formation of a new
  AJ between daughter cells and driving BC elongation (#4)
article_title: E- and N-cadherin drive hepatic polarity and lumen elongation via opposing
  effects on RhoA activity
