figure_title: BCR-ABL protein–protein interaction (PPI) network and pathway enrichment.
caption: BCR-ABL protein–protein interaction (PPI) network and pathway enrichment.
  The network was generated using BCR-ABL as the input. Nodes represent proteins directly
  interacting with BCR-ABL, and edges indicate known or predicted protein–protein
  associations. Node segments are color-coded based on the top 10 enriched KEGG pathways
  identified through over-representation analysis in Cytoscape. White colors indicate
  that the corresponding pathways are not enriched in that node. A totally grey node
  indicate that this node was not enriched in any of the top pathways shown in this
  figure
