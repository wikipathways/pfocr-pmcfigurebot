figure_title: Identification of PPP2CA in the MKRN2 protein complex that is over-expressed
  in ccRCC.
caption: 'Identification of PPP2CA in the MKRN2 protein complex that is over-expressed
  in ccRCC. (A) A Venn diagram illustrates proteins that interacted with Wnt-related
  molecules (KEGG_WNT_SIGNALING_PATHWAY), proteins pulled down via Flag-MKRN2, and
  proteins pulled down via Vector in A498 cell lines. (B) PPP2CA peptides that were
  pulled down by Flag-MKRN2. (C) the mRNA expression level of PPP2CA and PPP2R1A in
  MKRN2-OE renal tumor cell lines (n = 4). (D) Western blot analysis was employed
  to confirm the two potential targets of MKRN2. GAPDH served as a loading control.
  (E)PPP2CA protein expression was elevated in renal cancer tissues compared to adjacent
  non-cancerous renal tissues. (F) and (G) The protein levels of PPP2CA were evaluated
  in 24 ccRCC tissues and adjacent nonmalignant tissues. (H) and (I) The mRNA and
  protein levels of PPP2CA were assessed in RCC cell lines (786-0, A498, Caki-1, and
  OSRC-2) and a normal cell line (293). (J) Immunohistochemistry (IHC) staining was
  performed for PPP2CA in ccRCC tissues and adjacent nonmalignant tissues. (K) No
  significant differences in the mRNA expression levels of PPP2CA and PPP2R1A in the
  TCGA-KIRC database. (L) Survival analysis showed a significant difference for PPP2CA
  with no significant difference in PPP2R1A from the CPTCA database. (Significance
  levels denoted as follows: ****p < .0001, ***p < .001, **p < .01, and *p < .05'
