figure_title: FTD-related MAPT mutations and the potential impact of melatonin as
  an inducer of Nrf2.
caption: 'FTD-related MAPT mutations and the potential impact of melatonin as an inducer
  of Nrf2. Top left: AD has been linked to mutations in APP, PSEN1, PSEN2, APOE, TREM2,
  and PLGC2 genes, as well as abnormal forms of tau which maintain the 3R/4R isoform
  balance. Top right: Specific MAPT mutations, which are known to dysregulate the
  3R/4R isoforms equilibrium, are directly associated with FTD. Bottom left: MAPT
  gene mutations present an inverse correlation with the Nrf2 pathway, whose molecular
  mechanisms remain unknown. Bottom right: Melatonin is already known to trigger beneficial
  effects in AD models through Nrf2 activation, and a similar protective role is suggested
  for familial FTD models. Created with BioRender 201'
