figure_title: Sex-specific variations in pathway targeting scores with age in normal
  thyroid.
caption: Sex-specific variations in pathway targeting scores with age in normal thyroid.
  The six plots show how the targeting scores change with age in each sex for six
  groups of biological pathways (grouped according to KEGG hierarchy of pathways).
  The pathway targeting score for a specific group of pathways is the sum of in-degrees
  of all genes in that group of pathways. The x-axis represents age, and the y-axis
  represents the gene targeting score of the corresponding group of pathways. Each
  plot shows an aging trajectory curve computed for male samples (marked teal) and
  a trajectory curve computed for female samples (marked reddish orange) in GTEx using
  Locally Estimated Scatterplot Smoothing (LOESS). The grey shaded region around each
  curve is the pointwise 95% confidence band
