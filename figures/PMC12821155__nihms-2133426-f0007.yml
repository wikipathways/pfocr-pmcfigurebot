figure_title: Becn1F121A/F121A (BMut) mice exhibits enhanced autophagy–lysosome function
  and reduced inflammatory responses in the hippocampus (Hi) 10 weeks after SCI.
caption: Becn1F121A/F121A (BMut) mice exhibits enhanced autophagy–lysosome function
  and reduced inflammatory responses in the hippocampus (Hi) 10 weeks after SCI. (A)
  All genes were plotted in a volcano plot, displaying p-values versus fold changes
  based on differential expression genes (DEGs) analysis of the interaction effect
  between genotype (BMut vs. WT) and injury (SCI vs. Sham). (B) Top 10 GO terms were
  visualized in the dot plot colored by significance and sized by GeneRatio based
  on the DEGs from (A). (C) The bar graph exhibited GO terms related to Autophagy
  process. (D) Top 10 terms on inflammation and immune response were displayed by
  GO enrichment analysis. (E) Gene Set Enrichment Analysis (GSEA) terms of “Lysosome
  Localization” and “Protein K63-Linked Ubiquitination” were enhanced in BMut/SCI
  compared to WT/SCI. (F) Multiple pathways related to inflammatory response were
  altered with BMut/SCI versus WT/SCI
