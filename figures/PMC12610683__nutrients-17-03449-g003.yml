figure_title: In vitro production method of Equol.
caption: In vitro production method of Equol. (1) Single-strain. Under anaerobic fermentation
  conditions at 37 °C, A. equolifaciens subsp. celatus do03 can convert daidzein into
  equol through dihydrodaidzein (DHD) [33]. Eggerthella sp. YY7918 can synthesize
  S-equol using daidzein and DHD as substrates under anaerobic conditions [32]. The
  strain Mt1B8 can convert daidzein and genistein into equol and 5-hydroxy-equol,
  respectively, through DHD and dihydrogenistein (DHG) under anaerobic conditions
  [36]. Under anaerobic conditions, Eggerthella sp. DZE can convert daidzein and genistein
  into (3S)-equol and 5-hydroxy-equol, respectively [37]. Eggerthella sp. Julong732
  can convert DHD into S-equol under anaerobic conditions [38]. (2) Co-culture microorganisms.
  A mixed culture containing four strains (L. mucosae EPI2, E. faecium EPI1, F. magna
  EPI3, Veillonella sp. EP) can convert daidzein into equol through the DHD pathway.
  Moreover, the colonic fermentation products of carbohydrates such as hydrogen, butyrate,
  and propionate can stimulate the production of equol [34]. DHD, dihydrodaidzein;
  L, Lactobacillus; E, Enterococcus; F, Finegoldia; A, Adlercreutzia
