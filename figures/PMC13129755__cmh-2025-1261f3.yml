figure_title: Proteomics analysis of MTARC1 p.
caption: 'Proteomics analysis of MTARC1 p.A165 KO in Hep3B2 cells. Whole-cell proteomics
  was performed on six technical replicates of Hep3B2 mock and MTARC1 KO cells. Samples
  were processed and proteins were quantified using MS/MS, liquid chromatographytandem
  mass spectrometry. The protein abundance ratios were log2-transformed, and statistical
  significance was assessed using Benjamini-Hochberg test, with an adjusted P-value
  threshold of <0.05. A |log₂FC|≥±0.58 cutoff was used to define upregulation or downregulation.
  The colour intensity in the heatmap represents the Log2FC values. Pathway enrichment
  analysis was performed using Enrichr, and the following pathways were enriched in
  MTARC1 KO cells: (A) EMT, (B) Hypoxia, (C) EGFR1, (D) Fatty acid metabolism, (E)
  TGF-β regulation of extracellular matrix and (F) p53 pathway. EGFR1, epidermal growth
  factor receptor 1; EMT, epithelial–mesenchymal transition; KO, knockout; MS/MS,
  tandem mass spectrometry; MTARC1, mitochondrial amidoxime-reducing component 1;
  TGF-β, transforming growth factor-beta'
