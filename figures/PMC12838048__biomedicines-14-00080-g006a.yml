figure_title: V-125 modulates immune-related pathways and enhances anti-tumor immune
  responses in HER2+ mammary tumors.
caption: V-125 modulates immune-related pathways and enhances anti-tumor immune responses
  in HER2+ mammary tumors. (A) Quantification of CD8 cell infiltration (mean positive
  area) in tumor tissues from control, V-125, and Bexarotene-treated mice. (B) Representative
  IHC images showing CD8 cell staining across treatment groups. For each tumor, regions
  of interest were manually selected within tumor tissue at 40× magnification for
  analysis. (C) Quantification of CD206+ macrophages (mean positive area) in tumor
  tissues, reflecting tumor promoting macrophage population. (D) Representative IHC
  images showing CD206 staining across treatment groups. For each tumor, regions of
  interest were manually selected within tumor tissue at 40× magnification for analysis.
  (E) Quantitative RT-PCR validation of Slit2 mRNA expression in mammary tumors from
  control, V-125, and bexarotene-treated mice. (F) Kaplan–Meier overall survival analysis
  of breast cancer patients stratified by SLIT2 expression, showing improved survival
  associated with higher SLIT2 levels. Data are presented as mean ± SEM. * p < 0.05,
  ** p < 0.01, *** p < 0.001, n.s. = not significant; n ≥ 3 mice/group
article_title: RXR Agonist V-125 Induces Distinct Transcriptional and Immunomodulatory
  Programs in Mammary Tumors of MMTV-Neu Mice Compared to Bexarotene
