figure_title: Esketamine inhibits PARP1 overexpression, promotes autophagy via the
  PARP1-SIRT1 pathway, and improves neuroinflammation.
caption: Esketamine inhibits PARP1 overexpression, promotes autophagy via the PARP1-SIRT1
  pathway, and improves neuroinflammation. (A) Western blot analysis of inflammatory
  cytokines, revealing bands for IL-6, TNF-α, and IL-1β. (B–D) Quantitative analysis
  of IL-6, TNF-α, and IL-1β protein levels, as determined by Western blot, expressed
  as mean ± standard error (SE). (E) Western blot analysis of SIRT1 and PARP1 protein
  expression. (F–G) Quantitative analysis of SIRT1 and PARP1 protein levels, presented
  as mean ± SE. (H) Western blot bands for autophagy-related proteins LC3 and P62,
  indicating autophagy activity. (I–J) Quantitative analysis of LC3 and P62 protein
  levels, shown as mean ± SE. (K) Biochemical measurement of NAD+/NADH content in
  different treatment groups, reflecting cellular energy status. OvPARP1 refers to
  BV2 cells transfected with a PARP1 overexpression plasmid. OvPARP1+Esk represents
  BV2 cells transfected with a PARP1 overexpression plasmid for 24 h, followed by
  culture in medium containing 5 μg/ml esketamine. OvPARP1+RAPA refers to BV2 cells
  transfected with a PARP1 overexpression plasmid for 24 h, then cultured in medium
  containing 100 nmol/l rapamycin. Data are represented as mean ± SE, with * P<0.05
  and ** P<0.01 indicating statistically significant differences
