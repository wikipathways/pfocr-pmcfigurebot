figure_title: Temporal dynamics of DEGs (FDR < 0.
caption: 'Temporal dynamics of DEGs (FDR < 0.05 and |log~2~Fold Change| ≥ 1) in Ilex
  verticillata leaves during Alternaria alternata infection. (A): Histogram showing
  the total number of DEGs identified at 3-, 12-, and 19 days post-inoculation (dpi)
  compared to uninoculated controls (0 dpi). (B,C) Venn diagrams illustrating (B)
  upregulated and (C) downregulated DEGs at each time point relative to 0 dpi controls,
  revealing stage-specific transcriptional responses. (D,E) Comparative Venn analyses
  of (D) upregulated and (E) downregulated DEGs across all infection timepoints (3
  vs. 12 vs. 19 dpi), highlighting conserved and unique gene expression patterns during
  disease progression. (F): Top 20 significantly enriched KEGG pathways (FDR < 0.05)
  during A. alternata infection. The Rich Factor (x-axis) is the ratio of the number
  of DEGs to the total number of genes in a given pathway. The size of the bubble
  corresponds to the number of DEGs assigned to the pathway, and the color represents
  the -log10 transformed p-value from the enrichment analysis'
