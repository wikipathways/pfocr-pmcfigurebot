figure_title: Proteome analysis in irradiated OBCs.
caption: Proteome analysis in irradiated OBCs. Volcano plots comparing (A) 0.5 Gy
  vs. 0 Gy and (B) 1.0 Gy vs. 0 Gy. Proteins with significant differences (P<0.05;
  Tukey-Kramer's multiple comparisons test) are labeled. (C) Box plots of the proteins.
  Groups with significant differences are indicated by asterisks. Rpl4 and Serpinc1
  exhibited significant differences in ANOVA among groups (not indicated). The vertical
  axis represents the relative quantitative values (normalized peak area values) (*P<0.05).
  (D) Pathway enrichment analysis; markedly altered proteins were subjected to KEGG-based
  annotation and analyzed using OmicsNet 2.0. Red circles indicate the six key proteins
  of interest, while pink circles represent predicted proteins that are functionally
  associated with these six. OBCs, osteoblastic cells; KEGG, Kyoto Encyclopedia of
  Genes and Genomes
