figure_title: 3-oxo-LCA inhibits tumor progression in Patient-derived xenograft (PDX)
  NSG mice
caption: '(A) A scheme of 3-oxo-LCA (20 mg/kg BW p.o.) or vehicle (corn oil) were
  administrated in a PDCO line 1-xenograft NSG (PDX1) mice for 4 weeks before tissue
  harvest and tumor measurement.(B) Total Bile Acid levels measured in both 3-oxo-LCA
  and vehicle-treated PDX1 mice.(C-G) Representative live image of tumors (C), tumor
  weight (D), tumor growth curve (E), and final tumor volume (F), and tumor distribution
  (G) in PDX1 mice in the above treatment groups.(H) Representative images of H&E
  staining of tumors in PDX1 mice in the above treatment groups. Scale bar, 100μm(I-J)
  Relative expression of FXR target genes (FGF19, ASBT, OSTα, SHP) (I), Apoptosis
  signaling pathway (CASP3, CASP7, BCL2, BAK1, BAX, CASP8, CASP9) (J) in the tumors
  of PDX1 mice under above treatment groups, measured by RT-qPCR.(K) Representative
  images of immunostaining for proliferation marker KI67 (green) in PDX1 mice in the
  above treatment groups, along with the corresponding quantification of each staining.
  Scale bar, 100μm.(L-N) Representative images of TUNEL assay stained apoptotic cell
  death (L), immunostaining of Apoptotic protein Cleaved Casp3 (M) and Cleaved Casp7
  (N) in the tumor of PDX1 mice, along with the corresponding quantification of each
  staining. Scale bar, 100μm.(O) The protein levels of Apoptosis signaling pathway
  (BCL2, Cleaved CASPASE3, CASPASE3, Cleaved CASPASE7, CASPASE7) in PDX1 mice in the
  above treatment groups were measured by Western Blot. Band intensities were quantified
  by image J and presented on the righthand.Experiments were independently replicated
  twice, and representative data are shown as the mean ± SEM. For two group comparison,
  Student’s unpaired t-test were applied. For more than two group comparison, the
  one-way ANOVA test was followed by multiple comparisons. *p<0.05; **p<0.01; ***p<0.005;
  ns: not significant'
