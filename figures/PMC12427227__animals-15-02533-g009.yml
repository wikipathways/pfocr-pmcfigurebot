figure_title: Analysis of overlapping genes following RWFC infection with E.
caption: Analysis of overlapping genes following RWFC infection with E. tenella. (A)
  Venn diagram displays the overlapping of 2562 DEGs at 2 dpi (light orange), 1048
  DEGs at 4 dpi (light blue), and 2164 DEGs at 7 dpi (light green), resulting in a
  total of 114 overlapping genes. (B) Trend analysis of the overlapping genes at 2,
  4, and 7 days post-RWFC infection. The x-axis denotes the three time points following
  infection, while the y-axis illustrates the log2-transformed and normalized intensity
  ratios at each respective time point. (C) GO analysis of the top 20 most enriched
  GO pathways. (D) Sankey plot illustrating the top 10 significantly enriched pathways
  within the overlapping genes of the RWFC. The dot plot depicted the ratio of RWFC−T
  to RWFC−Cin relation to the total number of genes within each enriched pathway (p
  ≤ 0.05). Genes marked with asterisks in the heatmap were selected for subsequent
  qRT−PCR validation
