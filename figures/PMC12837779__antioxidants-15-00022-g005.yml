figure_title: Transcriptomic profiling identifies AhR-regulated gene expression in
  HBECs.
caption: Transcriptomic profiling identifies AhR-regulated gene expression in HBECs.
  (A) Volcano plot of differentially expressed mRNAs in CRE-treated HBECs with or
  without the AhR agonist VAF347. (B) Heatmap of the top-ranking differentially expressed
  mRNAs in CRE-treated HBECs with or without VAF347. (C) KEGG pathway enrichment map
  of differentially expressed genes comparing the CRE and CRE + VAF347 groups. (D)
  Heatmap of differentially expressed genes enriched in the cellular senescence pathway.
  (E) Validation of selected senescence-related genes (MYC, TGFβ2, IGFBP3, and SERPINE1)
  by RT-PCR. n = 3. Data represent mean ± SEM; * p < 0.05, ** p < 0.01, *** p < 0.001,
  **** p < 0.0001
