figure_title: Time-course temporal transcriptomics uncovers differential effects of
  hypersecretion and ER stress
caption: (A) MIN6 β cells treated with DMSO (0.1%), SW (5 μM), or Tg (100 nM) for
  1, 2, 6, and 24 h. n = 3.(B) Time-course edgeR analysis results showing overlap
  of differentially expressed genes (DEGs) between Tg and SW.(C) Heatmaps showing
  selected pathways containing DEGs that were significant in SW, Tg, or both. Asterisks
  inside heatmap cells indicate FDR < 0.05 for treatment vs. DMSO for that time point.
  Asterisks to the right of each gene row indicate significance (FDR < 0.05) across
  the entire time course vs. baseline.See also Figure S4
