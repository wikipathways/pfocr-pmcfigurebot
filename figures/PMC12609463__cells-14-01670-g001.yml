figure_title: Schematic diagram illustrating the role of PDEs in pulmonary arterial
  hypertension (PAH).
caption: 'Schematic diagram illustrating the role of PDEs in pulmonary arterial hypertension
  (PAH). In the pulmonary artery, prostacyclin (PGI2) stimulates the production of
  cAMP, which subsequently activates downstream effectors such as PKA and EPAC1. Cyclic-GMP
  is generated either by NO-mediated stimulation of sGC or via the stimulation of
  pGC by natriuretic peptides ANP and BNP. Cyclic-GMP activates PKG. In endothelial
  cells (ECs), cAMP mitigates endothelial permeability and EndoMT. Within pulmonary
  artery smooth muscle cells (PASMCs), cyclic nucleotides exert their effects by activating
  PKG and PKA, targeting multiple downstream pathways involved in vasodilation, cell
  proliferation inhibition, and apoptosis. The pathway downstream of BMPR2 signalling
  is promoted by cAMP and cGMP. The reduction in cAMP and cGMP levels occurs either
  via degradation by PDEs or through export from PASMCs by MRP4. In PAH, upregulation
  of specific PDEs (e.g., PDE1A, PDE1C, PDE3B, PDE4B, PDE5A, and PDE10A) accelerates
  the degradation of cAMP and cGMP. This attenuates the beneficial effects of cyclic
  nucleotides in ECs and PASMCs. In the adventitia, upregulation of PDEs (possibly
  PDE4) may also contribute to immune cell activation and inflammation, further exacerbating
  PAH. Solid lines represent direct actions; dashed lines represent indirect actions.
  AC: adenylyl cyclase; BMPR2: bone morphogenetic protein receptor 2; EC: endothelial
  cell; EndoMT: endothelial-to-mesenchymal transition; EPAC1: exchange protein activated
  by cAMP 1; eNOS: endothelial nitric oxide synthase; Id1: inhibitor of DNA binding
  protein 1; NO: nitric oxide; MRP4: multidrug resistance-associated protein 4; PDE:
  phosphodiesterase; pGC: particulate guanylyl cyclase; PASMC: pulmonary artery smooth
  muscle cell; PKA: cAMP-activated protein kinase; PKG: cGMP-activated protein kinase;
  PGI2: prostacyclin; PTGIS: PGI2 synthase; sGC: soluble guanylyl cyclase; ↑: modest
  increase in expression; ↑↑: strong increase in expression'
