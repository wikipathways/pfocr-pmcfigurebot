figure_title: Network diagram construction.
caption: 'Network diagram construction. (A) The interactions between PD-related targets
  are classified according to Gene Ontology (GO) terminology. Targets are divided
  into three categories: biological process (blue), cell composition (orange) and
  molecular function (green). (B) Network analysis shows the enrichment KEGG pathway
  of 121 PD-related targets, including the AGE-RAGE signaling pathway, lipid metabolism
  and atherosclerosis, neurodegenerative diseases, cancer and other related pathways.
  (C) The molecular interaction network shows the relationship between environmental
  toxins and their corresponding targets. The hexagonal shape of the color block represents
  environmental toxins, and the surrounding network displays corresponding biological
  targets and related molecular pathways'
