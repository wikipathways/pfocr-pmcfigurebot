figure_title: PAK6 expression is associated with immune regulatory genes and checkpoint
  molecules in colorectal cancer.
caption: PAK6 expression is associated with immune regulatory genes and checkpoint
  molecules in colorectal cancer. (A,B) Heatmaps displaying the correlation between
  PAK6 expression and a panel of immunostimulatory (A) and immunosuppressive (B) genes
  in the CRC tumor microenvironment from the TCGA cohort. (C) Scatter plot validating
  the strongest positive correlation between PAK6 and MCM5 (R = 0.597, p < 0.001),
  an immunostimulatory gene. (D–F) Heatmaps showing significant enrichment of PAK6-correlated
  genes in immune-related biological processes, including T cell activation (D), B
  cell activation (E), and negative regulation of immune response (F). (G) Scatter
  plot showing a significant negative correlation between PAK6 and IFNK (R = −0.163,
  p < 0.001), a key gene involved in T and B cell activation pathways. (H,I) Analysis
  of immune checkpoint molecules reveals significant positive correlations between
  PAK6 expression and key checkpoint proteins CD276 (R = 0.44, p < 0.001), LAG3 (R
  = 0.30, p < 0.001), and PVR (R = 0.27, p < 0.001), as visualized in the heatmap
  (H) and scatter plots (I)
