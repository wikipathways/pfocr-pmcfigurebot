figure_title: Conceptual framework of an emergency-initiated prehabilitation pathway.
caption: Conceptual framework of an emergency-initiated prehabilitation pathway. At
  ED arrival, patients undergo rapid screening (frailty, sarcopenia, labs, modifiable
  risks). Immediate interventions include nutrition, respiratory training, mobility,
  anemia prevention (IV iron, IM B12, folate, vitamin D), and general medical optimisation.
  All actions operate under the principle of no delay and must be transferred to the
  operating room and postoperative care. ERAS continuity and tele-prehab strategies
  support adherence, with outcomes assessed via quality metrics
