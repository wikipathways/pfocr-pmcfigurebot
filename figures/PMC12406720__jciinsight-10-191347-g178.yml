figure_title: SH2D5 primarily affects the function and expression of NMDARs
caption: (A) GO enrichment analysis of the IP-MS data. The proteins outlined in red
  are related to synapses. (B) KEGG pathway analysis of the IP-MS data. The proteins
  outlined in red are related to glutamatergic synapses. (C and D) Representative
  Western blot images (C) and quantification (D) of total glutamatergic receptor protein
  expression in the hippocampal tissue of Sh2d5-KO mice with epilepsy. (E and F) Representative
  Western blot images (E) and quantification (F) of glutamatergic receptor protein
  expression in the membrane fraction of hippocampal tissue from Sh2d5-KO mice with
  epilepsy. (G and H) Representative traces of NMDAR–evoked EPSCs (G) and quantification
  (H) of the amplitude of the NMDAR-eEPSCs. The data are presented as mean ± SEM.
  Unpaired t test in D, F, and H. *P < 0.05, **P < 0.01 and ***P < 0.001
article_title: Deletion of SH2D5 alleviates epileptic seizures and NMDAR expression
  via autophagic degradation of STAT1
