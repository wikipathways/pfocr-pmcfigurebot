figure_title: Spatial neighborhood enrichment and niche characterization of sublining
  fibroblasts and endothelial cells in JIA synovium
caption: a, Schematic description of the spatial neighborhood enrichment analysis
  pipeline. The procedure includes identifying nearest neighbors, quantifying neighborhood
  cell-type composition, performing permutation tests by shuffling cell-type labels,
  and calculating enrichment Z-scores. b, Examples of two simulation patterns (concentric
  circles and layered arrangement) utilized to evaluate the performance of the spatial
  neighborhood enrichment method. c, Results from the simulation experiments. The
  x-axis represents pre-specified actual proximity distances, and the y-axis shows
  calculated spatial enrichment Z-scores. The red line indicates Z-scores for cell
  types that were designed to be spatially close, whereas the grey line represents
  randomly distributed cell types. The grey dashed line indicates the multiple testing-adjusted
  significance threshold for Z-scores. d, Spatial neighborhood enrichment using our
  data from samples of JIA synovium. Statistical significance is indicated as * (adjusted
  p-value < 0.1) and ** (adjusted p-value < 0.05). The highlighted grey square indicates
  the niche of sublining fibroblasts and endothelial cells. P-values were adjusted
  by the Benjamini-Hochberg method. e, Characterization of the identified niche of
  sublining fibroblasts and endothelial cells. The heatmap displays the relationship
  between distances to nearest endothelial cells (purple bar above) and fibroblast
  gene expression. Rows represent fibroblast-associated genes, and columns represent
  individual cells. Fibroblast marker genes are labeled. f. Line plots depicting binned
  distance to nearest endothelial cells (x-axis) and normalized gene expression (y-axis)
  of representative fibroblast genes. Statistical significance was assessed using
  Spearman correlation coefficients and p-values. g, Heatmap of gene expressions related
  to Notch signaling pathway components across different cell types. h, Representative
  spatial coordinates of an identified niche of sublining fibroblasts and endothelial
  cells, matching pathological images. Cells are colored according to their cluster
  assignments. i. Spatial expression patterns of fibroblast-related and Notch signaling-related
  genes within the identified niche location
