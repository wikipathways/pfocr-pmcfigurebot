figure_title: DMRTA affects the stability of the p53 protein and inhibits p53 ubiquitination.
caption: 'DMRTA affects the stability of the p53 protein and inhibits p53 ubiquitination.
  (A) qRT-PCR assay was used to detect the effect of the overexpression or DMRTA2
  knockout on p53 transcription level. (B) GSEA results show that DMRTA2 is associated
  with ubiquitin-mediated protein degradation (FDR q-value= 0.007, p < 0.05). (C)
  A549 cells were cultured for different times after adding actinomycosterone, and
  the influence of the overexpression of DMRTA2 on the stability of p53 protein was
  detected by Western blot. (D) MG132 was added into H460 cells, and the effect of
  the DMRTA2 knockout on the proteasome degradation pathway of p53 was detected by
  Western blot. (E) A549 cells were simultaneously transfected with DMRTA2 plasmid
  and Ub plasmid to detect the effect of the overexpression of DMRTA2 on the degree
  of p53 ubiquitination. (F) The effect of the overexpression of DMRTA2 on the subcellular
  localization of p53 was detected by immunofluorescence assay. (G) After the overexpression
  of DMRTA2 in A549 cells, a nuclear plasma separation experiment was conducted, and
  the influence of the overexpression of DMRTA2 on the entry and exit of p53 in the
  nucleus was detected by Western blot. p < 0.05 was statistically significant; **
  p < 0.01, and *** p < 0.001, ns means not significant. scale bar: 10 μm'
article_title: The Interaction of DMRTA2 with HSP90β Inhibits p53 Ubiquitination and
  Activates the p53 Pathway to Suppress the Malignant Progression of Non-Small-Cell
