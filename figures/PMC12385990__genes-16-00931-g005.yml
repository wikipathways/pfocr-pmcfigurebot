figure_title: Analysis of ovarian cell differentiation, differential analysis of granulosa
  cells, and pseudotime analysis during pregnancy and non-pregnancy.
caption: Analysis of ovarian cell differentiation, differential analysis of granulosa
  cells, and pseudotime analysis during pregnancy and non-pregnancy. (A) Analysis
  of the differentiation potential of ovarian cells using CytoTRACE. The gradient
  color from red to blue indicates the differentiation ability from low to high. (B)
  Volcano plot of differential gene analysis of ovarian granulosa cells between pregnant
  and non-pregnant Holstein cows. Red dots represent upregulated differentially expressed
  genes (DEGs), and blue dots represent downregulated DEGs. (C) KEGG enrichment analysis
  showing the pathways enriched by differentially expressed genes in granulosa cells
  (GCs). (D) Pseudotime trajectory analysis of granulosa cells under different physiological
  conditions. (E) Pseudotime heatmap showing the dynamic gene expression profiles
  during the fate determination process of GCs. The expression levels of dynamic genes
  are represented by a color gradient from red (high) to blue (low). (F) Expression
  trend plots of characteristic genes arranged along the pseudotime in granulosa cell
  subtypes
