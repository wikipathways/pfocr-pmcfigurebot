figure_title: Temporal dynamics of key signaling pathways during human cochlear organoid
  differentiation.
caption: Temporal dynamics of key signaling pathways during human cochlear organoid
  differentiation. Pathway enrichment scores for DNA Repair (red), P53 Pathway (black),
  and Wnt/β-Catenin Signaling (orange) in hair cells (solid lines) and supporting
  cells (dashed lines) from day 30 to day 60 of differentiation from Udea 2023 dataset
  in gEAR portal. In supporting cells, DNA Repair pathway peaks at day 40, P53 pathway
  shows highest activity at day 30 with continuous decline, and Wnt/β-Catenin signaling
  increases from day 30 to peak at day 50. Hair cells demonstrate synchronized pathway
  activation with all three pathways reaching maximum enrichment at day 50, followed
  by sharp decline by day 60, suggesting a critical developmental checkpoint for terminal
  differentiation. These pathways were selected based on their direct functional relationships
  with the identified regulatory markers Trp53, Ezh2, and Zbtb4
