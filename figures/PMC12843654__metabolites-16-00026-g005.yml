caption: Regulatory mechanisms of tea polyphenol synthesis in high- and low-content
  genotypes. (A) Venn diagram showing common differentially expressed genes (DEGs)
  among comparison groups F1, F2, and F3. (B) Top 20 significantly enriched GO terms
  for the 84 common DEGs. (C) Top 20 significantly enriched KEGG pathways for the
  84 common DEGs. (D) Protein–protein interaction (PPI) network of tea polyphenol-related
  genes. (E) Heatmap showing correlations between expression levels of key candidate
  genes and tea polyphenol content. The asterisk (∗) indicates significant difference
  (p < 0.05)
