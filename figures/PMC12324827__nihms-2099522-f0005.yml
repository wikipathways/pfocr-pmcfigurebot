figure_title: ANGPTL3 activates the AKT pathway independently of its interaction with
  LPL
caption: (A) [3H]-fructose uptake in AML12 cells after treatment with increasing concentrations
  of LPL in the presence of 100 nM human ANGPTL3 (N = 3 samples per group).(B) Schematic
  of generated point mutants of ANGPTL3.(C) [3H]-fructose uptake in AML12 cells after
  treatment with 100 nM wild-type or catalytically dead mutant of human ANGPTL3 in
  the presence or absence of LPL (N = 3 samples per group).(D) Representative western
  blot and quantification of p-AKT, p-AKT substrate, p-S6 in HepG2 cells treated with
  indicated doses of full-length human ANGPTL3, and positive controls showing the
  intracellular signaling pathways over time (N = 1 sample per group, repeated in
  two independent experiments).(E) Representative western blot and quantification
  of p-AKT, p-AKT substrate, p-S6 in HepG2 cells treated with indicated doses of C-terminal
  human ANGPTL3, and positive controls showing the intracellular signaling pathways
  over time (N = 1 sample per group, repeated in two independent experiments).(F)
  Representative western blot of p-AKT; p-AKT substrate; p-S6 induced by C-terminal
  human ANGPTL3 (100 nM); or positive controls in HepG2 cells pretreated with PI3K
  inhibitors wortmannin (1 μM), mTORC1 inhibitor rapamycin (100 nM), mTORC1/2 dual
  inhibitor torin (100 nM), PKA inhibitor H89 (10 μM), or the translation inhibitor
  cycloheximide (10 μM) (N = 1 sample per group).(G) [3H]-fructose uptake in AML12
  cells after treatment with wortmannin with or without ANGPTL3 (N = 8–9 samples per
  group).(H) Schematic of ANGPTL3-induced cellular signaling pathways in hepatocytes.Data
  are presented as mean ± SEM. *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001
  by one-way ANOVA (A, C, and G)
