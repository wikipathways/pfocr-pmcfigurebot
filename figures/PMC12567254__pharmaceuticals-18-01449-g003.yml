figure_title: Analysis of DKD DEGs and potential mechanisms of AS action.
caption: 'Analysis of DKD DEGs and potential mechanisms of AS action. (A) Volcano
  plot of DKD DEGs (Red: Upregulated genes; Green: Downregulated genes). (B) Venn
  diagram showing common differentially expressed genes (co-DEGs) associated with
  AS intervention in DKD and common core differentially expressed genes (co-core DEGs).
  (C) Bubble plot of GO enrichment analysis for co-DEGs (highlighting key biological
  processes). (D) KEGG pathway enrichment analysis for co-DEGs (Bar plot, bubble plot,
  and chord plot; core pathways post-filtering are indicated). (E) PPI network of
  co-DEGs (Node size proportional to Degree; Light green nodes: co-DEGs; Dark red
  nodes: co-core DEGs). (F) Heatmap based on PPI network topological parameters (Degree,
  Radiality, Neighborhood Connectivity) (Higher values indicate greater centrality)'
