figure_title: Ephb4-CKO fibrotic mouse lung fibroblasts exhibit unique transcriptomic
  profiles
caption: (A) Ephb4f/f;Col1a2-CreERT mice were treated with 4-hydroxytamoxifen (1 mg/day
  for 5 days) or corn oil control at 4 weeks of age and were then intratracheally
  instilled with PBS or bleomycin (1.2 U/kg) at 6 weeks of age. Mice were sacrificed
  14 days after bleomycin or PBS challenge, and lung fibroblasts were isolated and
  cultured (n = 4 mice per group). Fibroblasts were enriched with a single passage
  followed by RNA extraction for total RNA-Seq. (B) Pairwise comparisons were made
  between bleomycin and PBS-treated Ephb4 control mice, or between Ephb4-CKO and control
  mice under bleomycin condition (n = 4 mice/group). Differentially expressed genes
  (DEGs) were determined using an FDR cutoff of q < 0.05 (red). In the bleomycin versus
  PBS comparison, 257 DEGs were identified in fibroblasts, including 155 upregulated
  and 102 downregulated DEGs. In the Ephb4-CKO versus control comparison, 317 DEGs
  were identified in fibroblasts, including 103 upregulated and 214 downregulated
  DEGs. (C) DEGs from both comparisons were visualized using heatmaps. (D) Lists of
  both upregulated and downregulated DEGs in the RNA-Seq dataset of Ephb4 CKO (n =
  4) versus Ephb4 control mice (n = 4) treated with bleomycin were analyzed separately
  using pathDIP to identify subsets of genes enriched for unique pathways in the Reactome
  database. Gene-pathway associations were visualized in NAViGaTOR v.3.0.16. (E) Unique
  gene-pathway enrichments from the downregulated gene list visualized by dot plot,
  with significance determined using the Benjamini and Hochberg method (with cutoff
  of q < 0.01). (F) The expression of downregulated DEGs associated with ECM organization,
  protein transport, and ER cargo concentration visualized by Wideplot
