figure_title: 'A: UpSet plot summarizing overlapping of DEGs in the abdominal ganglia
  between lab- and wild-cross animals (n = 3 per group and treatment) at different
  experimental treatments.'
caption: 'A: UpSet plot summarizing overlapping of DEGs in the abdominal ganglia between
  lab- and wild-cross animals (n = 3 per group and treatment) at different experimental
  treatments. Top three bar plot panels show lab versus wild-cross DEGs (DESeq2) shared
  between treatments: all, all shared DEGs (bottom in black); L > W, shared DEGs with
  higher expression in lab-cross cohort (top in red); and L < W, shared DEGs with
  higher expression in wild-cross cohort (middle in blue). The bottom right horizontal
  bars show the total number of lab versus wild-cross DEGs per treatment, and the
  connected-dots matrix represents the interactions that resulted in the bar plots
  above. Most of the DEGs between lab and wild crosses were shared between all exposed
  treatments, with most shared genes being expressed less in lab-cross animals. B:
  EMAP plot shows connected networks of enriched Gene Ontology (GO) terms for lab
  versus wild-cross DEGs shared across all hypoxia treatments, reoxygenation, and
  recovery in the abdominal ganglia (highlighted in orange in A). Dot size corresponds
  with the size of the GO term (number of genes). Two functional clusters are evident,
  one related to immune response and the other to DNA metabolism. Gene-set enrichment
  analysis (GSEA) of Kyoto Encyclopedia of Genes and Genomes (KEGG) terms (C) and
  KEGG modules (D) in the abdominal ganglion for contrasts of lab versus wild-cross
  animals across different treatments of hypoxia exposure (2 h, 6 h, 5 days, 6 days,
  reoxygenation, and recovery). Both, direction of the arrow and color signify regulation
  direction. Arrow size corresponds with the size of the enriched pathway (number
  of genes). Upregulated terms and modules across all comparisons are related with
  metabolism or metabolic alterations, while downregulation appear to be related with
  immune and stress response pathways consistent with B'
