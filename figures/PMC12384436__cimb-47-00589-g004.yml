figure_title: Key molecular pathways activated in CD44+/CD24−/low breast cancer stem
  cells contributing to radiation resistance.
caption: Key molecular pathways activated in CD44+/CD24−/low breast cancer stem cells
  contributing to radiation resistance. Schematic representation of molecular targets
  and signaling pathways associated with radiation resistance in breast cancer stem
  cells exhibiting the CD44+/CD24−/low phenotype. CD44-mediated signaling has been
  linked to the upregulation of ALDH1, IFIT2, ATM, and the mTOR pathway, including
  its downstream effector phosphorylated S6 kinase 1 (p-S6K1). These factors contribute
  to enhanced DNA repair capacity, survival, and resistance to radiotherapy. The tumor
  microenvironment further enhances these characteristics in breast cancer through
  the secretion of interleukin-6 (IL-6) and platelet-derived growth factors from cancer-associated
  fibroblasts. Tumor-associated macrophages further contribute to therapy resistance
  through the secretion of interleukin-10 (IL-10). Created in BioRender. Mageau, E.
  (2025) https://BioRender.com/c6b46ka
