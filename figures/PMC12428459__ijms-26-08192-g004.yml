figure_title: Elevated autoantibodies in PCOS—drivers and consequences.
caption: Elevated autoantibodies in PCOS—drivers and consequences. The left panel
  presents contributing factors that may promote autoantibody generation in PCOS.
  The center panel lists autoantibodies reported as elevated in PCOS; larger font
  denotes stronger evidence, whereas smaller text indicates limited evidence. The
  right panel shows consequence boxes color-matched to the corresponding autoantibodies.
  Upward and downward arrows indicate increased (↑) or decreased (↓) levels. AEAs—anti-endometrial
  antibodies; ANAs—antinuclear antibodies; anti-CA I—anti-carbonic anhydrase I antibodies;
  anti-dsDNA—anti-double-stranded DNA antibodies; anti-FSH—anti-follicle-stimulating
  hormone antibodies; anti-GnRHR—anti-gonadotropin-releasing hormone receptor antibodies;
  anti-HSA–MDA—antibodies to malondialdehyde-modified human serum albumin; anti-TG—anti-thyroglobulin
  antibodies; anti-TPO—anti-thyroid peroxidase antibodies; CYP1B1—cytochrome P450
  family 1 subfamily B member 1; FBN3—fibrillin 3; FcγR—Fc gamma receptor; GnRH—gonadotropin-releasing
  hormone; GnRHR—gonadotropin-releasing hormone receptor; HLA-B/HLA-F—human leukocyte
  antigen B/F; HPO—hypothalamic–pituitary–ovarian; HSA–MDA—malondialdehyde-modified
  human serum albumin; IL-6—interleukin-6; JAK–STAT3—Janus kinase–signal transducer
  and activator of transcription 3 pathway; NF-κB—nuclear factor κB; PCOS—polycystic
  ovary syndrome; SMA—smooth muscle antibodies; TLR—Toll-like receptor. Created with
