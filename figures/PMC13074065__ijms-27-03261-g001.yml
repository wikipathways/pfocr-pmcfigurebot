caption: Untargeted metabolomics profiling reveals altered metabolic pathways in CRC.
  (A) Partial least squares discriminant analysis (PLS-DA) score plot of the Tumor
  and Normal groups. (B) Volcano plot highlighting significantly upregulated and downregulated
  metabolites, the horizontal dashed line represents the significance threshold of
  p < 0.05. (C) Heatmap visualization of differential metabolites. (D) Bubble chart
  of KEGG pathway enrichment analysis based on the altered metabolites. (E) Network
  visualization of the enriched metabolic pathways. (F) KEGG map illustrating the
  alterations in central carbon metabolism in cancer
