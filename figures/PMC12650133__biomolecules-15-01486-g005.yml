caption: Electroacupuncture affects metabolic function by modulating the gut microbiota.
  (A) Heatmap showing pathway enrichment analysis of differentially expressed metabolites,
  with pathways categorized into biosynthesis, metabolism, and other functional processes.
  Colors represent the degree of enrichment. (B) Venn diagrams showing the overlap
  of differentially expressed metabolites. Left diagram represents upregulated metabolites
  in Model vs. Control and downregulated metabolites in EA vs. Model; right diagram
  represents the inverse relationship. (C) Heatmaps of representative key metabolites
  recovered by EA-treatment in different groups, illustrating specific metabolite
  changes associated with electroacupuncture treatment. (D) Correlation analysis showing
  associations between specific metabolites and the abundance of microbial, with significant
  correlations marked. The shade of the color corresponds to the size of the circle,
  which means both are associated with the corresponding values indicated in the legend.
  * indicates p < 0.05, ** indicates p < 0.01, and *** indicates p < 0.001 to the
  figure legend
