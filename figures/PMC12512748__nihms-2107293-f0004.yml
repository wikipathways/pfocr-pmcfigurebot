figure_title: GIV-VILP induced transcriptomic changes in cell cycle regulation and
  inhibited cell proliferation compared to IGF-1
caption: (A–E) Gene-set enrichment pathways identified after (A) GIV infection or
  (B) GIV-scVILP stimulation. The scale of the number of genes identified in each
  pathway is based on an analysis using a fold-change threshold of 1.5 (FC1.5) and
  a false discovery rate (FDR) of 0.01. Venn diagram representing the total (C), upregulated
  (D), and downregulated (E) differentially expressed genes (DEGs) common between
  GIV-scVILP stimulation and GIV infection, along with their associated gene-set enrichment
  pathways.(F) Quantification of GK cell proliferation by EdU staining after stimulation
  and/or competition by different ligands or GIV supernatant. All quantifications
  were performed in triplicate and statistical analysis were performed using one-way
  ANOVA (***p < 0.001 ****p < 0.0001). Data are expressed as means ± SDs (n = 30)
