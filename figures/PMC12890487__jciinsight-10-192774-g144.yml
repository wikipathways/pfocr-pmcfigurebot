figure_title: Blockade of oxidative PPP at the 6PGD metabolic checkpoint ameliorates
  the severity of and the mortality due to aGvHD
caption: '(A and B) BALB/c (H-2d) mice were lethally irradiated (8.5 Gy) on day –1
  and transplanted with 3.5 × 106 T cell–depleted bone marrow (TCD-BM) cells and 0.7
  × 106 purified splenic WT T cells from C57BL/6 (H-2b) mice on day 0. Splenic donor
  T cells (CD45+H2Kb+H2Kd–TCRβ+) were sorted and examined by scRNA-seq (A). The expression
  of oxidative PPP gene signatures was detected within the T cell clusters (B). T
  cells were isolated and pooled for analysis from 5 spleens. (C and D) Allo-HCT model
  was generated as in A and B using 0.2 × 106 purified splenic WT naive T cells. The
  expression levels of oxidative PPP pathway genes (C) and the Pgd gene (6PGD) (D)
  were examined in sorted alloreactive T cells (Allo: CD45+H2Kb+H2Kd–TCRβ+) and from
  BALB/c mice transplanted with syngeneic mice T cells (Syn: CD45+H2Kb–H2Kd+TCRβ+)
  on day +7. T cells were pooled from 5 spleens (1-way ANOVA). (E–G) BALB/c (H-2d)
  mice were lethally irradiated (8.5 Gy) on day –1 and transplanted with 3.5 × 106
  TCD-BM cells with or without 0.2 × 106 splenic naive T cells from WT (Pgdfl/fl)
  or 6PGD-deficient (Pgdfl/flCd4Cre) C57BL/6 (H-2b) mice on day 0. Body weight loss
  (E) and clinical GvHD scores (F) are presented as mean ± SEM. n = 5 mice per group
  (2-way ANOVA). Survival data (G) are presented as percentage survival (log-rank
  Mantel-Cox test). (H and I) Allo-HCT model was generated as in E–G. GvHD progression
  was examined in the GI tract on days +7, +14, and +21. Representative images of
  H&E staining demonstrate infiltration of intraepithelial lymphocytes (blue arrows)
  and apoptosis (red arrows) (H). Original magnification, ×200. Semiquantitative GvHD
  scoring of small (top) and large (bottom) intestines are shown. n = 5 mice per group
  (Student’s t test). (J–L) C3H/SW (H-2b) mice were lethally irradiated (11.5 Gy)
  on day –1 and transplanted with 3.5 × 106 TCD-BM cells with or without 0.5 × 106
  splenic naive T cells from Pgdfl/fl or Pgdfl/flCd4Cre C57BL/6 (H-2b) mice on day
  0 as minor-mismatched model. Body weight loss (J) and clinical GvHD score (K) data
  are presented as mean ± SEM. Data are representative of 2 independent experiments
  (2-way ANOVA). Survival data are presented as percentage survival (log-rank Mantel-Cox
  test) (L). Data are shown as mean ± SEM. *P < 0.05; **P < 0.01; ***P < 0.001; ****P
  < 0.0001'
article_title: Targeting the pentose phosphate pathway mitigates graft-versus-host
  disease by rewiring alloreactive T cell metabolism
