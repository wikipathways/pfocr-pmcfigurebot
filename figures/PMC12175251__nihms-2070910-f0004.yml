figure_title: Immunosuppressive myeloid cell subsets are upregulated in the perivascular
  niches associated with MVP, along with PDGF/TGF-β signaling and extracellular matrix
  changes
caption: a. Representative example of CD45, PDGFRβ, and CD45−PDGFRβ− (other) masks
  for the digital spatial profiling of a MVP-associated perivascular niche. CD31+
  areas were subtracted from the PDGFRβ mask to maximize the accuracy of enrichment.b.
  The immune-related proteins of the CD45 mask show an upregulation of CD14 (associated
  with monocytes and myeloid-derived suppressor-like cells) and CD163 (associated
  with perivascular macrophages) along with immunosuppressive markers such as ARG1
  and B7-H3. Immunostimulatory proteins such as STING, ICOS, 4–1BB, and GZMB are also
  upregulated. A log2 fold change of 0.6 and adjusted p value of 0.05 were used as
  cutoffs.c. The pathway analysis obtained using digital spatial profiling shows upregulation
  of PDGF signaling, the TGF-β, matrix reorganization and collagen-associated axes
  in gliomas with MVP compared to those without. Top differentially downregulated
  processes are also shown. An adjusted p value cutoff of 0.05 was used
