figure_title: Enhancing effect of NBDHEX on BITC-induced apoptosis and its signaling
  pathways.
caption: Enhancing effect of NBDHEX on BITC-induced apoptosis and its signaling pathways.
  (A) Enhancement of BITC-induced activation of the JNK pathway by NBDHEX. After pretreatment
  with NBDHEX (0.5 μM) for 1 h, cells were treated with BITC (5 μM) for 1 h. The phosphorylated
  and total protein levels of c-jun and JNK as well as actin were analyzed with western
  blotting. (B,C) NBDHEX enhanced the BITC-induced caspase-3 activation. After pretreatment
  with NBDHEX (0.5 μM) for 1 h, cells were treated with BITC (5 μM) for 24 h. Caspase-3,
  cleaved caspase-3, and actin were analyzed with western blotting (B). The caspase-3
  activity was assessed with an enzyme assay using a substrate specific for caspase-3
  (C). (D) Effects of NBDHEX and BITC on the induction of apoptosis. After pretreatment
  with NBDHEX (0.5 μM) for 1 h, cells were treated with BITC (10 μM) for 24 h. The
  percentage of the cell population that exhibited apoptotic characteristics was estimated
  using a commercially available apoptosis detection kit (Annexin V-FITC Apoptosis
  Detection Kit, Nacalai Tesque Inc., Kyoto, Japan) with observations performed using
  a fluorescence microscope (Biozero BZ-8000, KEYENCE, Osaka, Japan). The different
  letters over the bars correspond to significant differences between treatments for
  each condition (p < 0.05, Tukey’s HSD, n = 3)
article_title: Augmentation of the Benzyl Isothiocyanate-Induced Antiproliferation
  by NBDHEX in the HCT-116 Human Colorectal Cancer Cell Line
