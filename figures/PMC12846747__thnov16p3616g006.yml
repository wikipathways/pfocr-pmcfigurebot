figure_title: PDA NPs activate MS-hippocampal projections via the DA D2 receptor.
caption: 'PDA NPs activate MS-hippocampal projections via the DA D2 receptor. (A):
  Schematic illustration of the experimental procedure. Mice underwent surgery and
  then received i.p. injections of PDA NPs (10 mg/kg/day) for three consecutive days
  (D1-D3). At the same time, intra-MS microinjections of raclopride or SCH23390 (0.2
  μL/mouse/day) were administered on four occasions (D2, D4, D6, D8). (B): Bar graphs
  (with individual data points) showing the number of ChAT-positive cells in the medial
  septum (MS) (*P < 0.05, **P < 0.01; n = 6). (C): Schematic illustration of the experimental
  design. Mice were divided into four groups: one group received i.p. injections of
  PBS (control); the other three groups were treated with LPS followed by i.p. injections
  of either PBS (D1-D7; LPS group), PDA NPs (5 mg/kg/day, D1-D7; LPS+PDA group), or
  PDA NPs (5 mg/kg/day, D1-D7) plus raclopride (10 mg/kg/day, D1-D12; LPS+PDA-R group).
  Behavioral tests—including the open field test (OFT), Y-maze, and novel object recognition
  (NOR) test—were subsequently performed. (D): Bar graphs (with individual data points)
  depicting spontaneous alternation performance in the Y-maze. (E): Bar graphs (with
  individual data points) showing the NOR ratio in the NOR test (*P < 0.05, **P <
  0.01, ***P < 0.001; n = 8). (F): Schematic diagram outlining the fiber photometry
  procedure for recording hippocampal ACh levels. Mice were i.p. injected with either
  PBS (control) or PDA NPs (10 mg/kg/day) for three consecutive days (D1-D3). An additional
  group received PDA NPs (10 mg/kg/day, D1-D3) followed by i.p. raclopride (10 mg/kg/day)
  on three occasions (D4, D7, D9) prior to recording. (G): Schematic depiction of
  the viral injection strategy along with representative images showing rAAV-hSyn-ACh3.0
  expression in the hippocampus (scale bar: 500 μm). (H): Plots of fluorescent ACh
  signals recorded from the hippocampus of freely moving mice on D4, D7, and D9. (I):
  Heatmaps displaying the average fluorescent ACh signals in the hippocampus recorded
  from freely moving mice on D4, D7, and D9. (J): Bar graphs showing the average fluorescent
  ACh signal values in the hippocampus on D4, D7, and D9. ****P < 0.0001 (PDA vs.
  PBS) and ####P < 0.0001 (PDA vs. PDA-R), n = 5000. (K): Schematic diagram of the
  chemogenetic inhibition strategy for MS-projecting hippocampal neurons. rAAV2-retro-CHAT-Cre
  was injected into the hippocampus, and hM4Di-DIO-mCherry was injected into the MS.
  (L): Quantification of c-Fos expression in the MS, measured 90 min after raclopride
  administration on D9 in mice transduced with hM4Di-mCherry in the MS. **P < 0.01,
  ***P < 0.01; n = 6. (M): Schematic illustration summarizing the findings, indicating
  that PDA NPs selectively activate cholinergic neurotransmission from the MS to hippocampal
  neurons via DA D2 receptor pathways'
article_title: Polydopamine nanoparticles restore cognition via targeted dopamine
  delivery and septo-hippocampal cholinergic activation
