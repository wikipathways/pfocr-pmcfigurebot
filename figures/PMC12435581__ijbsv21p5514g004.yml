figure_title: Signaling pathways of FAM134B in tumor-related diseases.
caption: Signaling pathways of FAM134B in tumor-related diseases. FAM134B suppresses
  colorectal cancer by inhibiting EB1 and upregulating KDELR2 expression, which in
  turn activates the WNT/β-catenin pathway. FAM134B also upregulates MIF and p53 levels
  via the WNT/β-catenin pathway, influencing cell cycle regulation and mitochondrial
  function. Conversely, FAM134B acts as an oncogene in HCC, promoting tumorigenesis,
  EMT, and tumor metastasis through the AKT signaling pathway. Downregulation of FAM134B
  in HCC contributes to radiotherapy resistance by modulating the JAK/STAT3 pathway.
  Moreover, FAM134B suppresses the expression of ER stress-related degradation factors
  such as DERL2, EDEM1, SEL1L, and HDR1, thereby accelerating HCC progression
