figure_title: Connectomic identification of the direct and indirect pathway on the
  level of MSNs.
caption: Connectomic identification of the direct and indirect pathway on the level
  of MSNs. a The densely spiny MSN cell type (see insets) can be readily identified
  in Area X. Link to 3D visualizations. b Pallidal cell types can be separated into
  at least two populations, consistent with electrophysiological data 37, putative
  GP and GPe based on axon mitochondria volume density, axon median radius. Insets
  show mitochondria in two example cells. c Pallidal cell types can be separated in
  a PCA based on parameters in b, axon myelin fraction and soma diameter (see Extended
  Data Fig. 5). d MSNs show a weak preference to connect to one pallidal cell type,
  and connectivity does weakly correlate with morphological features such as spine
  density. MSNs that did not project to either GPe or GPi were excluded (2.4%, n=197).
  e GPi preference of MSN plotted against shuffled synapses. Black curve shows mean
  over 100 iterations, gray indicates 95% confidence interval. f MSNs connect to GPi
  through slightly larger synapses, g, with more parallel synapses, and h, larger
  total synaptic area per pre-post neuronal connection. i Schematic representation
  of the direct pathway together with MSN-GPe connections with synaptic area between
  the shown cell types normalized to their corresponding incoming and outgoing synaptic
  area (see Fig. 6f, g)
