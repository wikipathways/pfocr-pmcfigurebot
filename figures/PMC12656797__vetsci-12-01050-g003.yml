figure_title: The mechanisms of PEDV regulating the pyroptosis pathway.
caption: The mechanisms of PEDV regulating the pyroptosis pathway. PEDV Z-RNA can
  be recognized by ZBP1, which triggers ROS-mediated oxidative stress and the release
  of mtDNA. This process activates the NF-κB signaling pathway and NLRP3 inflammasome,
  which induces pyroptosis. PEDV nsp5 cleaves porcine GSDMD into two inactive fragments,
  which inhibit pyroptosis
