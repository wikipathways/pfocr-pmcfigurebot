figure_title: Comparison of the metabolic synthesis capacity per cell of sporulation-deficient
  strains.
caption: Comparison of the metabolic synthesis capacity per cell of sporulation-deficient
  strains. (a) Specific glucose consumption rate per CFU of the sporulation-deficient
  strain at 12 and 24 h; (b) Specific acetoin biosynthesis rate per CFU of the sporulation-deficient
  strain at 24 h; (c) Specific 2,3-BD biosynthesis rate per CFU of the sporulation-deficient
  strain at 12 h. All experiments were independently repeated three times, and the
  average value was taken as the final result. The differences between two sets of
  data were analyzed using a 2-tailed Student’s t-test, while the differences between
  multiple sets of data were compared using one-way ANOVA and Tukey’s test. “***”
  is used to indicate a significance of p < 0.001.Wild-type strain B1319 and sporulation-deficient
  strains ΔspoIIE and ΔrsfA exhibited specific glucose consumption rates per cell
  of 4.65, 13.61, and 6.55 fmol/(CFU·h), respectively, at 12 h, with corresponding
  2,3-BD production rates of 2.26, 6.12, and 2.09 fmol/(CFU·h). At 24 h, the specific
  glucose consumption rates were 3.09, 13.4, and 11.43 fmol/(CFU·h), respectively,
  while acetoin production rates reached 1.1, 5.7, and 3.69 fmol/(CFU·h). These results
  demonstrate that knockout of sporulation genes significantly enhanced the metabolic
  and biosynthetic capacity per cell. When sporulation is blocked, cellular resources
  and energy utilization may be redirected toward more efficient metabolic pathways,
  enabling the cells to achieve several-fold increases in per-cell metabolic capacity
  despite growth inhibition
