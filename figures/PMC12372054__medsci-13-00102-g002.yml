figure_title: Mechanistic basis of selected inherited cardiac arrhythmia syndromes.
caption: 'Mechanistic basis of selected inherited cardiac arrhythmia syndromes. Inherited
  cardiac arrhythmias arise from pathogenic variants in key genes encoding proteins
  involved in cardiac excitability, conduction, and calcium handling. These genetic
  alterations—typically manifesting as either loss-of-function (LOF) or gain-of-function
  (GOF) mutations—disrupt the finely tuned balance of ion fluxes and intracellular
  signaling, culminating in distinct electrophysiologic phenotypes. Among the principal
  clinical entities are Brugada syndrome (BrS), catecholaminergic polymorphic ventricular
  tachycardia (CPVT), calcium-release deficiency syndrome (CRDS), long QT syndrome
  (LQTS), and short QT syndrome (SQTS). Each disorder is linked to specific molecular
  derangements: for example, L-type calcium channels (LTCCs), sodium-calcium exchanger
  1 (NCX1), and sarcoplasmic/endoplasmic reticulum calcium ATPase 2a (SERCA2a) represent
  pivotal components of calcium cycling pathways whose dysfunction contributes to
  arrhythmogenesis. Abnormal phosphorylation states and impaired protein-protein interactions
  within these signaling cascades further modulate arrhythmic risk. The resultant
  electrical instability underscores the importance of precise ion channel regulation
  and excitation-contraction coupling integrity in maintaining cardiac rhythm'
article_title: 'Gene Therapy for Cardiac Arrhythmias: Mechanisms, Modalities and Therapeutic
