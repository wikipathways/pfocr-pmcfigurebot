figure_title: Pathway enrichment analyses indicate significant changes in immune relevant
  pathways.
caption: 'Pathway enrichment analyses indicate significant changes in immune relevant
  pathways. The order of the dots is presented according to the pathway gene ratio
  score, the color represents the BenjaminiHochberg (BH) adjusted p-value, and the
  size represents the number of genes from the dataset that matched the pathway annotation.
  A. Dot plot of the 25 most significant Over Representation Analysis (ORA) of the
  Gene Ontology Biological Process (GO: BP) pathways. B. Dot plot of the 25 most significant
  ORA of Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways. C. GSEA dot plot
  of the top 25 most significantly enriched GO-BP pathways in MG patients. D. GSEA
  score plots immunoglobulin production (GO:0002377, p = 7.9e-5), complement activation
  (GO:0006956, p = 0.009), and T cell receptor signaling pathway (GO:0050852, p =
  0.03)'
