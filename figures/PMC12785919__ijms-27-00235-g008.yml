figure_title: A proposed regulatory model for the roles of CsATG8f and CsRAP2.
caption: A proposed regulatory model for the roles of CsATG8f and CsRAP2.12 in conferring
  submergence resistance in tea plants. Overexpression of CsATG8f enhances autophagic
  activity in tea plants under submergence. The interaction between CsATG8f and CsRAP2.12
  may promote tea plants’ tolerance to submergence by promoting oxidative stress responses
  through an atypical fermentation pathway. Endogenous GABA levels increase in tea
  plants in response to submergence. Solid arrow indicates promotion. T-bar indicates
  inhibition. Dotted arrow indicates a hypothesized interaction or regulatory relationship
article_title: Interaction Between CsATG8f and CsRAP2.12 Modulates Antioxidant Defense
  and Hypoxia Response During Submergence in Camellia sinensis
