figure_title: NEAT1 targeting the MAD1L1 promoter regulates the cell cycle and apoptosis
  through the p53 pathway.
caption: NEAT1 targeting the MAD1L1 promoter regulates the cell cycle and apoptosis
  through the p53 pathway. (A) NEAT1 RNA and MAD1L1 gene promoter sequence targeting
  the binding sequence site; (B) Dual luciferase activity reporter assay results;
  (C) qPCR analysis showing the enrichment of the MAD1L1 promoter region DNA precipitated
  by biotinylated NEAT1-specific probes; (D) Co-IP to detect the changes in the expression
  of the PML coprecipitated proteins MAD1L1 and MDM2; (E-F) Western blotting to detect
  changes in p53/p21/Cyclin B1/CDK1/Bax protein expression levels. Data are presented
  as mean ± SD (n = 3 independent biological replicates). Statistical significance
  was determined by a one-way ANOVA with Tukey's post hoc test, SD indicates error
  bars, **P < 0.01. DDP induced indicate cells treated with 5 μM DDP
