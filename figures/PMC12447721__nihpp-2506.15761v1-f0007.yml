figure_title: Microbial and metabolomic features of ME/CFS identified in additional
  cohorts
caption: 'A) Decreased richness and B) increased heterogeneity (Bray-Curtis dissimilarity)
  in the gut microbiota were consistent in our second timepoint (Wilcoxon rank-sum
  test). B) The performance of our classifiers was assessed using ROC curves in C)
  our second timepoint and D) an independent cohort (Germain et al., 2020). The models
  were colored by species relative abundance (pink), KEGG gene profile (blue), and
  metabolites (orange). E) The fold change of important metabolic subpathways and
  biomarkers are shown from three cohorts: timepoint 1, 2, and an independent cohort.
  The shared features with Germain’s study were highlighted in blue. F) The fold change
  of microbial biomarkers from the classifier in timepoints 1 and 2. The shared biomarkers
  with Guo’s study are highlighted in blue. G) The fold change of key genes in the
  butyrate pathway across three cohorts. The shared essential genes from the Acetyl-CoA
  branch are highlighted in blue. See also Figure S7'
