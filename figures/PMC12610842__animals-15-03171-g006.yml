figure_title: PITX2 overexpression activates Wnt signaling and enhances GEDF proliferation.
caption: PITX2 overexpression activates Wnt signaling and enhances GEDF proliferation.
  (A) RT-qPCR detection of PITX2 expression after its overexpression. (B) RT-qPCR
  detection of Wnt pathway gene expression after overexpression of PITX2. (C) An EdU
  assay was performed for cell proliferation (D). Quantitative analysis demonstrating
  increased EdU-positive cell ratios in PITX2-overexpressing groups. (E) RT-qPCR for
  the expression of proliferation-related genes after overexpression of PITX2. (F)
  CCK8 detection of cell proliferation of GEDF after overexpression of PITX2. All
  experiments were conducted with three biological replicates (n = 3), with data presented
  as mean ± SEM. (* p < 0.05, ** p < 0.01, **** p < 0.0001)
