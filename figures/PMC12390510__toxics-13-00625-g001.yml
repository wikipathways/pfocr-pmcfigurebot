figure_title: A proposal molecular mechanism model of mycotoxin exposure-induced cell
  apoptosis and oxidative stress in the intestines of animals.
caption: 'A proposal molecular mechanism model of mycotoxin exposure-induced cell
  apoptosis and oxidative stress in the intestines of animals. Mycotoxin exposure
  can promote ROS production via inhibiting SOD, CAT, GPXs activities and reducing
  GSH levels, then induce lipid peroxidation and oxidative stress. Excessive ROS production
  can damage mitochondria, cause DNA fragmentation, and cell cycle arrest, finally
  blocking cell proliferation and inducing cell apoptosis in intestinal epithelial
  cells. Additionally, mycotoxin exposure can also activate autophagy via the activation
  of AMPK and IKK pathways and the inhibition of the Akt/mTOR pathway. The inhibition
  of Nrf2 at the transcriptional level caused by mycotoxin exposure exacerbated oxidative
  stress damage. Bcl-2, B-cell lymphoma-2; Bax, Bcl-2-associated x gene; AMPK, AMP-activated
  protein kinase; Akt, protein kinase B; AFB1, aflatoxin B1; CytC, cytochrome C; CAT,
  catalase; HO-1, heme oxygenase-1; H2O2, hydrogen peroxide; GST, glutathione S transferase;
  GSH, glutathione; DON, deoxynivalenol; GPX, glutathione peroxidase; mTOR, mammalian
  target of rapamycin; IKK, IκB Kinase; SOD: superoxide dismutase; ROS, reactive oxygen
  species; Nrf2, nuclear factor E2-related factor 2; ZEN, zearalenone'
