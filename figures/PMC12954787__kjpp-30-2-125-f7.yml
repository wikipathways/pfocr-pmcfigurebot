figure_title: Subtype identification and functional analysis of OP
caption: (A) Distribution of OP samples before removal of batch effects. (B) Distribution
  of OP samples after removing batch effect. (C) Heatmap of consensus clustering based
  on ConsensusClusterPlus. (D) Cumulative distribution function (CDF) curve. (E) Delta
  area plot used to determine the optimal number of clusters (k = 2). (F) PCA analysis
  of clustering results. (G) Differential expression of SDC1 and ELN in different
  subtypes. (H) Differences in immune cell infiltration between subtypes shown by
  ssGSEA analysis. (I) Differences in immune cell infiltration calculated by the CIBERSORT
  algorithm. (J) GO functional enrichment analysis of DEGs between subtypes. (K) KEGG
  pathway enrichment analysis of DEGs between subtypes. ***, p < 0.001; **, 0.001
  < p < 0.01; *, 0.01 < p < 0.05; ns indicates no significant difference. OP, osteoporosis;
  PCA, Principal Component Analysis; GO, Gene Ontology; DEGs, differential expressed
  gene; KEGG, Kyoto Encyclopedia of Genes and Genomes
