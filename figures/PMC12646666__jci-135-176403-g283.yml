figure_title: Blood-based NR signature in anti–mouse CD3 R mice and its cellular origin
caption: (A) Volcano plot illustrating DEGs comparing peripheral blood leukocytes
  of R and NR samples. Blue dots and labels indicate downregulated genes, while gray
  dots and labels indicate upregulated genes that were statistically significant (P
  < 0.05). The log-transformed FC values are reported on the x axis, and –log10-transformed
  values of the adjusted P values are shown on the y axis. P values were obtained
  by Wilcoxon rank-sum test with Bonferroni correction. (B) hypeR pathway analysis
  performed on downregulated DEGs in peripheral blood leukocytes of R samples. Assessment
  of relevant pathways was conducted utilizing the hallmark gene sets from the MSigDB
  as a reference. (C) Heatmap presenting normalized expression levels of the 50 genes
  comprising the NR signature, represented using the z score. (D) Box plots representing
  the NR signature score calculated in peripheral blood (left) and pancreas (right)
  of RO, R, and NR samples. Mean expression of the genes comprising the NR signature
  in each individual cell was calculated using the Seurat function AddModuleScore.
  Boxes represent the median (center line) and extend from the 25th to 75th percentiles
  (bottom and top lines, respectively); whiskers extend from the minimum to the maximum
  value. (E) UMAP plot displaying the expression of the NR signature in the main immune
  cell types in peripheral blood and pancreas. (F) Dot plot showing the expression
  of individual genes comprising the NR signature in the main immune cell types in
  peripheral blood and pancreas. (G) Dot plot showing the average expression of the
  NR signature in the main immune cell types in peripheral blood and pancreas. (H)
  Violin plots comparing the expression levels of the NR signature in the main immune
  cell types in peripheral blood and pancreas. In D, the Mann-Whitney U test was used
  for statistical comparison
article_title: Neutrophil-enriched gene signature correlates with teplizumab therapy
  resistance in different stages of type 1 diabetes
