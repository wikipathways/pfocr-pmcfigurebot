figure_title: Enzalutamide-treated cells retain IFNγ sensitivity during early treatment.
caption: 'Enzalutamide-treated cells retain IFNγ sensitivity during early treatment.
  (A) Volcano plots showing differential gene expression in C4-2B, C4-2B-1M, and C4-2B
  MDVR cells after IFNγ stimulation. Key upregulated interferon-stimulated genes such
  as CXCL10, BATF2, CD274, and IFIT1 are highlighted. (B) Venn diagram comparing significantly
  upregulated genes following IFNγ treatment in the three cell lines. (C) Heatmap
  showing expression profiles of shared and unique IFNγ-induced genes. (D) GO enrichment
  analysis of IFNγ-induced genes reveals enrichment of type I and II interferon signaling
  pathways, cellular responses to virus, and inflammatory processes across the groups.
  (E) Heatmaps showing expression of representative IFNγ-responsive genes and key
  interferon-regulated transcription factors across treatment groups. (F) RT-qPCR
  analysis of IFNγ downstream target gene expression in C4-2B, C4-2B-1M, and C4-2B
  MDVR cells following 24-h IFNγ treatment. * p < 0.05, ** p < 0.01, *** p < 0.001,
  **** p < 0.0001; ns: not significant'
