figure_title: BMEE components accelerate dendritic arborization.
caption: 'BMEE components accelerate dendritic arborization. (A) Various dendritic
  developmental pathways are modulated by BMEE-derived active components, as revealed
  by network pharmacology screening. The green hexagons denote compounds, and the
  small and large circular nodes represent targets and signaling pathways, respectively.
  The connecting lines show interconnections. Statistical representation of dendritic
  morphogenesis in vehicle- and BMEE-treated neurons, including (B) number of primary
  dendrites at different branching orders (primary or secondary) and number of dendritic
  branches, (C) length of primary dendrites, and length of dendritic branches. Representative
  Sholl analysis of vehicle- and BMEE-treated neurons at DIV5 is shown in (D). Scale
  bar = 20 μm. Statistical evaluation of Sholl analysis is presented in (E) number
  of dendritic intersections and (F) dendritic branching points. Data are presented
  as mean ± SEM from three independent experiments (n = 3), with 5–10 neurons analyzed
  per experiment. Statistical significance was determined using a two-tailed Student’s
  t-test (* p < 0.05, ** p < 0.01). In (B,E,F), # indicates the “number of”'
