figure_title: GPR31-Gαi3 interaction is essential for MASH aggravation
caption: '(A and B) The number of DEGs in enriched pathways regulated by GPR31 was
  analyzed integratively by comparing GPR31-overexpressed (A) and GPR31-deficient
  hepatocytes (B) with corresponding controls. n = 4. (C and D) GSEA of MAPK pathway
  in gain- and loss of function of GPR31 in hepatocytes and mouse liver tissues. n
  = 4. (E) Effect of GPR31 knockdown on the phosphorylation of key proteins in the
  MAPK signaling pathway in mouse primary hepatocytes. n = 3. (F) Co-IP assays were
  performed to examine the interaction of GPR31 and identified downstream small G
  proteins in HEK293T cells. n = 3. (G) Representative Western blot images showing
  the phosphorylation of key proteins in the MAPK signaling pathway in hepatocytes
  transfected with the indicated plasmids and shRNA. n = 3. (H) GST pull-down assays
  were performed to examine the interaction of GPR31 and GNAI3. n = 3. (I) Interacting
  domains of GPR31 and GNAI3 predicted by computer simulation. (J) Co-IP assays were
  performed to examine the interaction of GNAI3 and GPR31-WT or its docking mutant
  GPR31(5A). n = 3. (K) BODIPY staining of lipid droplets in hepatocytes with or without
  GNAI3 or its docking mutant GPR31(5A) overexpression. Scale bars: 30 μm. n = 3 with
  8 images quantified. (L) Hepatocytes transfected with GPR31 or GPR31(5A). RNA was
  collected for RNA-Seq. KEGG pathway–based phenotypic characterization shown. n =
  4. Data are shown as mean ± SEM. ***P < 0.001'
