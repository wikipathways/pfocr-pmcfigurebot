caption: (A) Volcano plot showing differentially expressed genes between untreated
  wildtype eggs (WT) and chemically activated wildtype eggs/parthenotes. Genes significantly
  upregulated in chemically activated eggs/parthenotes appear on the right, those
  downregulated on the left, and non-significant changes are centered. (B) Bar plot
  depicting pathway enrichment analysis for genes upregulated in chemically activated
  wildtype eggs compared to untreated wildtype eggs. Each bar represents a specific
  biological pathway, with the height indicating the degree of enrichment significance.
  (C) Volcano plot showing differentially expressed genes between chemically activated
  wildtype and mos−/− eggs/parthenotes (M1, M2, M3). Genes significantly upregulated
  in chemically activated eggs appear on the right, those downregulated on the left,
  and non-significant changes are centered. (D) Bar plot depicting pathway enrichment
  analysis for genes upregulated in mos−/− eggs/parthenotes compared to chemically
