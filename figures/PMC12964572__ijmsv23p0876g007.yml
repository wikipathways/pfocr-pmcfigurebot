figure_title: Melatonin suppresses malignant phenotypes of murine 4T1 TNBC cells and
  enhances sensitivity to cisplatin.
caption: 'Melatonin suppresses malignant phenotypes of murine 4T1 TNBC cells and enhances
  sensitivity to cisplatin. (A-E) Melatonin reduces cell viability and induces apoptosis.
  4T1 cells were treated with increasing concentrations of melatonin (0-2 mM). Melatonin
  dose-dependently decreased cell survival fraction (A) and clonogenic survival (0,
  0.5, and 1.0 mM) (B). Apoptosis was increased after 24 h of melatonin treatment
  (0, 1, and 2 mM), as assessed by Annexin V/PI flow cytometry (C). Melatonin (1 and
  2 mM) also disrupted tumorsphere morphology and reduced intracellular ATP levels
  (D). Immunoblotting performed after 48 h of treatment (0-2 mM) (E) showed decreased
  proliferation markers (Ki67, PCNA) and reduced FAK pathway signaling (FAK and p-FAK
  (Y397)) and NF-κB, accompanied by reduced BCL-xL and increased apoptotic markers
  (PARP cleavage (arrow) and cleaved caspase-3). (F-H) Melatonin inhibits motility
  and modulates EMT-associated markers. Wound-healing (F) and Transwell invasion (G)
  assays demonstrated that melatonin (1 mM) significantly suppressed migration and
  invasion of 4T1 cells. Consistently, melatonin (1 and 2 mM) increased E-cadherin
  and decreased β-catenin (H). (I-L) FAK mediates melatonin responses and is associated
  with PD-L1 regulation. FAK knockdown enhanced melatonin-induced cytotoxicity (I)
  and apoptotic signaling (J). Melatonin (2 mM) reduced basal PD-L1 expression (K)
  and attenuated IFN-γ-induced PD-L1 upregulation (Melatonin: 2 mM; IFN-γ: 50 ng/mL)
  (L). (M-Q) Melatonin potentiates cisplatin-induced cytotoxicity. Co-treatment with
  melatonin (2 mM) and cisplatin (increasing concentrations for (M); 10 μM for (N)-(Q))
  decreased survival fraction (M), colony formation (N), and intracellular ATP levels
  (O), and increased apoptosis (P), which was further supported by enhanced apoptotic
  signaling (PARP cleavage (arrow) and cleaved caspase-3) by immunoblotting (Q). Data
  are presented as mean ± SEM from three independent experiments. *P < 0.05'
