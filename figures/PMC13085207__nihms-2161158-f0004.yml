figure_title: Scientific discoveries and engineering outcomes of spherical nucleic
  acids (SNAs) in nanomedicine research
caption: '(A) The dense 3D DNA shell of SNAs confers enhanced resistance to nuclease
  degradation relative to linear oligonucleotides. This protection arises from slower
  enzymatic hydrolysis, as the negatively charged and sterically bulky shell inhibits
  nuclease activity. The protein corona that forms on SNAs in biological media is
  not depicted. FAN1 Nuclease PDB ID: 8S5A. (B) Compared to linear or transfected
  oligonucleotides, SNAs exhibit high cellular uptake due to their multivalent interactions
  with class A scavenger receptors, which facilitate endocytosis via a lipid-raft-dependent,
  caveolae-mediated pathway. The representation of scavenger receptors is adapted
  from PDB IDs 2QIH and 7DPX. (C) Their high uptake efficiency, stability, and limited
  activation of host immune responses enable SNAs to function broadly as tools in
  both in vitro and in vivo systems. This versatility supports their use in intracellular
  detection, imaging, gene regulation, and immunotherapy. (D) Detection probes, including
  nanoflares, sticky-flares, and FIT-flares, have been engineered to sense intracellular
  RNA, ions, small molecules, and diseased tissue in vivo, as well as to perform live-cell
  genetic and metabolic analysis. These probes incorporate fluorophores that are either
  released or activated upon target binding, generating sensitive and responsive readouts.
  (E) As gene regulation agents, SNAs can be constructed from DNA or RNA to modulate
  expression through antisense or RNA interference pathways. As immunotherapies, they
  stimulate both innate and adaptive immune responses and have shown promise as nanomedicines
  for treating diverse cancers and infectious disease. The representation of a CRISPR
  SNA is adapted from PDB ID 8UZA. ePMV software was used in the generation of panels
  A, B, D, and E, ref (250)'
