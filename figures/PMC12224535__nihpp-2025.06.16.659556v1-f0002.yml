figure_title: Polarity proportions and mean density of differentially methylated positions
  (DMPs).
caption: Polarity proportions and mean density of differentially methylated positions
  (DMPs). Pie charts display the proportion of hypermethylated and hypomethylated
  DMPs in nuclear genes that encode mitochondrial pathway proteins in pairwise comparisons
  of A) MCI vs. CU (180 DMPs; hypermethylated [gray]; hypomethylated [blue]), C) AD
  vs. CU (253 DMPs; hypermethylated [gray]; hypomethylated [red]), and E) AD vs. MCI
  (314 DMPs; hypermethylated [gray]; hypomethylated [purple]). Density plots depict
  distributions of the mean methylation differences across DMPs in nuclear genes that
  encode mitochondrial pathway proteins in pairwise comparisons of B) MCI vs. CU comparison
  (blue bars depict hypomethylated DMPs; white bars depict hypermethylated DMPs),
  D) AD vs. CU comparison (red bars depict hypomethylated DMPs; white bars depict
  hypermethylated DMPs), and F) AD vs. MCI comparison (purple bars depict hypomethylated
  DMPs; white bars depict hypermethylated DMPs)
article_title: Differential DNA methylation in blood in nuclear genes that encode
