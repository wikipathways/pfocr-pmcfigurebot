figure_title: Cluster Analysis of Signaling Pathways Overrepresented in CRP PPIs.
caption: 'Cluster Analysis of Signaling Pathways Overrepresented in CRP PPIs. All
  71 proteins with protein–protein interactions (PPIs) with CRP curated by BioGrid
  (https://thebiogrid.org) from published data were used and the ShinyGO database
  (https://bioinformatics.sdstate.edu/go/, accessed on 1 May 2025) database was queried.
  (A) Interactions between proteins and pathways identified by CRP PPIs showing similarities
  and overlap between specific pathways. The number of CRP PPIs identified in each
  pathway is indicated by node size with opacity indicating statistical enrichment.
  Number of proteins overlapping (i.e., CRP PPIs present in each dataset) is indicated
  by line thickness. (B) Hierarchical cluster analysis of pathways as a function of
  representation from the CRP PPI dataset, with PPIs shared across pathways clustering
  closer together. Data indicates two primary clusters: (top) metabolic pathways,
  specifically those associated with glycosaminoglycan and glycosphingolipid synthesis,
  and (bottom) cancer associated pathways and molecular responses to infectious diseases'
