figure_title: KEGG enrichment of GOP-regulated pathways in C.
caption: 'KEGG enrichment of GOP-regulated pathways in C. elegans. (A) KEGG enrichment
  bubble plot highlighting significantly enriched pathways. Dot size indicates the
  number of DEGs, and color represents adjusted p-value. (B) Expression profile of
  25 DEGs enriched in the longevity regulating pathway—worm, ranked by log2FC, showing
  most significantly up- and down-regulated genes. (C) Chord diagram illustrating
  the associations between representative DEGs (left panel) and significantly enriched
  KEGG pathways (right panel). Each gene is represented as a segment, colored by expression
  change (red: upregulated; blue: downregulated). Pathways are grouped by functional
  categories, and chords indicate gene–pathway associations'
