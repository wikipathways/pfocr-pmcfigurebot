figure_title: Effect of EPT on pulmonary fibrosis and apoptosis pathway in OVA-induced
  mice.
caption: 'Effect of EPT on pulmonary fibrosis and apoptosis pathway in OVA-induced
  mice. (a) Representative Western blot images of fibrosis and (b) protein expression
  of pulmonary fibrosis-related pathway, i.e., TGF-β1, p-Smad-2, p-Smad-3, MMP-2,
  and MMP-9, in lung tissues; (c) representative Western blot images of apoptosis
  and (d) protein expression of apoptosis-related pathway, i.e., p-Akt, BC1-2, BAX,
  BAX/BCI-2 ratio, and caspase-3, in lung tissues. Values are expressed as mean ±
  SD (n = 4). *, **, ***, and **** indicate statistical differences compared with
  the NC group (p < 0.05, 0.01, 0.001, and 0.0001, respectively). #, and #### indicate
  statistical differences compared with the OVA group (p < 0.05, and 0.0001, respectively).
  EPT200 indicates the OVA-sensitized mice treated with 200 mg/kg EPT'
