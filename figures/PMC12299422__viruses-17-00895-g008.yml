figure_title: Pathway-based connections among gene signatures significantly perturbed
  by DA in U1 latent cells.
caption: 'Pathway-based connections among gene signatures significantly perturbed
  by DA in U1 latent cells. Pathway-based gene networks identified in: (A,C) Clusters
  2 and 10 that characterize U1 latent cells, in comparison to (B,D) Clusters 3 and
  6 that characterized DA-treated cells exhibiting latency reversal. The most significant
  pathway annotations were (A,B) ribosomal control of transcription (Benjamini, p
  = 3.9 × 10−58) and (C,D) proteasome (Benjamini, p = 4.4 × 10−8). Colors indicate
  upregulation (shades of red) and downregulation (shades of blue). Blue connectors
  indicate links through pathway'
