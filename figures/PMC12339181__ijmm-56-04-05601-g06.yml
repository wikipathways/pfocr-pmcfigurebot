figure_title: Osteoarthritis induces osteoporosis through multiple regulatory pathways.
caption: 'Osteoarthritis induces osteoporosis through multiple regulatory pathways.
  During KOA, an imbalance in joint mechanics increases local stress within the subchondral
  bone. This stress stimulates osteoblasts to release the receptor activator of RANKL,
  enhancing osteoclast activity and accelerating bone resorption. Synovitis-derived
  factors infiltrate the subchondral bone, inhibiting osteoblast synthesis of OPG,
  increasing the RANKL/OPG ratio, further increasing osteoclast activity, and leading
  to trabecular thinning. Chronic inflammation and oxidative stress reduce OPG secretion
  while increasing RANKL secretion by osteoblasts, resulting in increased bone resorption
  and the coexistence of osteoporosis and osteosclerosis. Osteoclasts secrete VEGF,
  prompting bone microvessels to invade the calcified cartilage layer, disrupting
  calcium-phosphorus homeostasis, and causing mixed bone loss. Inflammation increases
  DKK1 activity, blocking the binding of Wnt ligands to LRP5/6. This increases β-catenin
  degradation, reduces its nuclear translocation, and inhibits osteoblast differentiation.
  During OP, trabecular sparsification diminishes the shock absorption capacity, concentrating
  the joint load onto the cartilage and causing collagen fiber detachment. Impaired
  Wnt function disrupts bone mineralization and calcium-phosphorus deposition, allowing
  vascular invasion into the calcified cartilage layer, activating hypertrophic chondrocytes,
  and increasing cartilage matrix degradation. Imbalanced bone remodeling enhances
  osteoclast activity and RANKL secretion. RANKL traverses the subchondral bone plate,
  binds to chondrocytes, and activates the NF-κB pathway. This increases MMP-13 and
  ADAMTS5 activity, accelerating type II collagen degradation and proteoglycan loss.
  OP-induced trabecular fractures decrease subchondral bone stiffness, causing uneven
  joint surface loading and local stress concentration. This activates Piezo1 mechanoreceptors
  in chondrocytes, promoting YAP nuclear entry. This increases proinflammatory gene
  expression, triggers a ROS burst, and causes mitochondrial damage. Mitochondrial
  dysfunction in bone cells reduces ATP synthesis and alters extracellular vesicle
  release. These vesicles carry miR-483-5p, which is internalized by chondrocytes
  and inhibits SIRT3 expression. The resulting increase in oxidative stress ultimately
  leads to chondrocyte pyroptosis and apoptosis. OP, osteoarthritis; KOA knee OA;
  RANKL, receptor activator of nuclear factor-kappaB ligand; OPG, osteoprotegerin;
  VEGF, vascular endothelial growth factor; DKK1, Dickkopf WNT signaling pathway inhibitor
  1; Wnt, wingless-type MMTV integration site family; MMPs, matrix metalloproteinases;
  ADAMTS, a disintegrin and metalloproteinase with thrombospondin motifs; ROS, reactive
  oxygen species; Piezo1, Piezo-type mechanosensitive ion channel component 1; ATP,
  adenosine triphosphate; SIRT3, sirtuin 3. The arrows indicate the direction of change:
  ↑, increased expression/activity; ↓, decreased expression/inhibition'
