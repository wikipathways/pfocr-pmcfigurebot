figure_title: Sankey plot of pathway–gene associations in tooth agenesis.
caption: Sankey plot of pathway–gene associations in tooth agenesis. The diagram illustrates
  the relationships between major signaling pathways and the genes most frequently
  implicated in DA. Pathways include mTOR signaling, TNFR2 non-canonical NF-κB, TNFs
  binding their physiological receptors, lncRNA regulation of canonical Wnt signaling,
  and the breast cancer pathway. Key genes linked to these pathways are AXIN2, EDA,
  EDA2R, EDAR, EDARADD, FGFR1, LRP6, WNT10A, and WNT10B. The flow width represents
  the strength of association, highlighting how individual genes are shared across
  multiple pathways relevant to odontogenesis and TA pathogenesis. The gene-pathways
  associations were retrieved from MalaCards database, while the plot was generated
  using the package ggalluvial of R Studio software version 3.4.3
