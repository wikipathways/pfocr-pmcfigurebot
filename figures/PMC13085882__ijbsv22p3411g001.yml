figure_title: KIF26A functions as a DNA damage response protein.
caption: KIF26A functions as a DNA damage response protein. (A) DNA array analysis
  in responders and non-responders. 132 DEGs (P < 0.05 and Fold Change ≥ 2.0 or ≤
  0.5) were found. (B) KIF26A expression level among samples of responders (TRG1+2)(n
  = 30), intermediate responders (TRG3)(n = 37) and non-responders (TRG4+5)(n = 14).
  Data are shown as mean±SD. ***P < 0.001; ****P < 0.0001; ns, not significant, as
  determined by one-way ANOVA. (C) Gene Set Enrichment Analysis (GSEA) of the differentially
  expressed genes between the high and low KIF26A expression groups (divide into high
  and low groups based on the median) from TCGA-COADREAD dataset. (D) The results
  of Gene Set Enrichment Analysis (GSEA) focusing on the UV Response DN pathway. (E)
  Drug activity data and mRNA expression level of KIF26A in colon or CRC cell lines
  were downloaded from CellMinerCDB. Spearman correlation coefficient between drug
  activity and KIF26A expression level was calculated and the correlation was tested.
  The bar plot shows the number of target pathways of the 22 filtered drugs with GDSC
  annotation. (F) KIF26A expression is compared to that of genes coding for DNA repair
  factors. Unsupervised hierarchical clustering of the Pearson's correlation coefficients
  (PCCs) of gene expression analyses with studied genes depicted on the x axis across
  TCGA studies. Cancer acronyms are on the y axis; nominally significant PCCs are
  indicated by *P < 0.05, **P < 0.01 or ***P < 0.001. The TCGA cancer acronyms are
  listed in the Abbreviations section. (G) Gene Ontology Enrichment Analysis (GO)
  of differentially expressed genes in cells with KIF26A overexpression (OE) or control.
  (H) The results of Gene Set Enrichment Analysis (GSEA) focusing on the DNA repair
  related pathways of the differentially expressed genes between KIF26A-overexpressing
  or control. (I) Live-cell imaging of EGFP-KIF26A proteins recruitment to laser-induced
  DNA damage sites in HCT116 and RKO cells. Confocal images are presented, with white
  dashed lines highlighting irradiated areas. The accumulation of EGFP-KIF26A at these
  sites was measured (n = 3). Scale bars, 4 µm. D, H and I, NES, normalized enrichment
  score. Error bars, mean ± SD. I, three independent biological replicates were performed
