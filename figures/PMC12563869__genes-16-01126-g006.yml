figure_title: LCPD pathogenesis is complex since multiple mechanisms are affected.
caption: 'LCPD pathogenesis is complex since multiple mechanisms are affected. Description
  of results of this study (metabolites and polymorphisms). Different etiological
  factors will share a common pathogenic pathway that triggers LCPD. The markers not
  associated with patients with LCPD are shown in red, in blue and/or ★, the associated
  with patients with LCPD are shown; orange arrows indicate direct alterations present
  in our population. In black, the markers are described in other studies. Black arrows
  and dotted lines represent direct alterations described by other authors. TT: Thrombin
  Time; APTT: Activated Partial Thromboplastin Time; PT: Prothrombin Time; F: coagulation
  factor: I, II, V, VII, VIII, IX, X, and XI. VWF: Von Willebrand Factor; Hcy: Homocysteine;
  PC: Protein C; AT: Antithrombin; PAI-1: Plasminogen Activator Inhibitor-1; MTHFR:
  Methylenetetrahydrofolate reductase; eNOS: Endothelial nitric oxide synthase; OPG:
  Osteoprotegerin; RANK: Receptor Activator of Nuclear Factor κ B; RANKL: Receptor
  Activator of Nuclear Factor κB Ligand; TNF-α: Tumor necrosis factor alpha; COL1A1:
  Collagen type I alpha 1 chain; COL2A1: Collagen type II alpha 1; IL: Interleukin;
  IL-23R: IL-23 receptor; SSI: Systemic Immunoinflammation Index; N/L R: Neutrophil
  lymphocyte ratio; ↗: Increases. ↘: Decreases'
