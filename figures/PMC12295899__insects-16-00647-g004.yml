figure_title: Effect of enhanced mTORC1 signaling pathway activity on BmE cell cycle
  and cell proliferation.
caption: Effect of enhanced mTORC1 signaling pathway activity on BmE cell cycle and
  cell proliferation. (A) qPCR analysis of Rheb expression in BmE cells after 48 h
  post-transfection. (B) CCK-8 assay for cell proliferation viability. Error bars
  indicate SEM (n = 6). (C) WB analysis of the phosphorylation level of S6K and the
  expression of CyclinB and CyclinE protein in BmE cells. (D) qPCR analysis of the
  expression changes in cell cycle-related genes in BmE cells. Error bars indicate
  SEM (n = 3). (E) Effect of Rheb overexpression on cell proliferation of BmE cells.
  Proliferating cells were labeled with EdU (green fluorescence). Cell nuclei were
  stained with DAPI (blue fluorescence). Scale bar is 400 μm. (F) Statistical analysis
  of the proportion of EdU-positive cells. Cell numbers were calculated from three
  randomized regions. (G) Overexpression of Rheb leads to increased DNA content. Error
  bars indicate SEM (n = 3). Statistically significant differences were assessed using
  Student’s t-test (ns > 0.05, * p < 0.05, ** p < 0.01, and *** p < 0.001)
