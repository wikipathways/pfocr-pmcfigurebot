figure_title: DPP7 induces immunosuppressive phenotype by promoting FAO in TAMs.
caption: DPP7 induces immunosuppressive phenotype by promoting FAO in TAMs. (A) Volcano
  plot of differentially expressed genes (DEGs) analyzed by RNA-seq between Vector
  or DPP7 plasmid-transduced THP-1-differentiated macrophages. (B) GO enrichment analysis
  of DEGs between Vector and DPP7 groups. (C) Reactome pathways enrichment analysis
  of DEGs between Vector and DPP7 groups. (D) Heatmap of functional genes in Vector
  and DPP7 groups. (E) Flow cytometry analyses of CD80 and CD026 in Vector and DPP7
  groups. (F) KEGG enrichment analysis of upregulated proteins interacting with DPP7
  compared with IgG, based on LC-MS/MS results. (G) Heatmap of differentially abundant
  lipid metabolites between Vector and DPP7 groups. (H) Expression of triglycerides
  (TGs) and fatty acids (FFAs) with different carbon chains length between Vector
  and DPP7 groups. (I) Representative images showing the TGs content determined by
  oil red O staining. (J) Intracellular FFAs content detected by assay kit. (K) Intracellular
  ATP content detected by assay kit. (L) The OCR was measured at baseline and in response
  to incubation with oligomycin (Oligo), FCCP (Carbonyl Cyanide 4-(trifluoromethoxy)
  phenylhydrazone), and rotenone plus antimycin A (R + A) in THP-1-differentiated
  macrophages. *p<0.05, **p<0.01, ***p<0.001, and ns = non-significant
