figure_title: The expression of TLR3 is positively correlated with 5-FU-Resistance
  in CRC cells.
caption: The expression of TLR3 is positively correlated with 5-FU-Resistance in CRC
  cells. (A) Schematic overview of the transcriptomic analysis workflow comparing
  parental and 5-FU-R HCT116 and SW480 CRC cell lines using RNA-sequencing data (GSE196900).
  Differentially upregulated genes were identified using the criteria of log2 fold
  change (log2FC) > 1.5 and p < 0.05, and overlapping upregulated genes between the
  two 5-FU-R cell lines were determined. (B) Scatter plot of KEGG pathway enrichment
  analysis based on genes upregulated in 5-FU-R CRC cells compared with their parental
  counterparts. The size of each circle represents the number of differentially expressed
  genes in the corresponding pathway, while the color scale indicates the enrichment
  p-value. (C) qRT-PCR analysis showing increased relative TLR3 mRNA expression in
  5-FU-R HCT116 cells compared with parental HCT116 cells. (D) qRT-PCR analysis of
  TLR3 mRNA expression in 5-FU-R SW480 cells relative to parental SW480 cells. Gene
  expression levels were normalized to GAPDH and expressed relative to parental control.
  (E) Representative phase-contrast images showing morphological changes and enhanced
  formation of adherent spheroid-like clusters in 5-FU-R CRC cells following stimulation
  with the TLR3 agonist poly (I:C) (1 μg/mL) for the indicated time points. (F) Cell
  viability analysis of 5-FU-R HCT116 cells treated with 5-FU in the presence of DMSO
  or the TLR3 inhibitor CU-CPT 4a, as determined by the MTT assay. (G) Cell viability
  analysis of 5-FU-R SW480 cells treated with 5-FU following inhibition of TLR3 signaling
  using CU-CPT 4a. Data are presented as mean ± SD. * p < 0.05 vs. parental cells
  or DMSO-treated control, as indicated
