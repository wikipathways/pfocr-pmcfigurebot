figure_title: Retrieval-augmented generation maintains overall parity yet excels in
  the high-fidelity regime of drug-centric mechanistic answers
caption: (A) Cosine-similarity scores (sentence-transformer embeddings; see Methods)
  between each generated answer and the reference drug→biological-process pathway
  are plotted for all 842 questions in the Drug Benchmark, ordered from lowest to
  highest similarity. Dashed traces (LLM-only) and solid traces (BTE-RAG) follow nearly
  overlapping trajectories across most of the distribution, indicating broadly comparable
  performance between the two inference modes. However, above a cosine similarity
  threshold of ≈ 0.7, both gpt-4o-mini (orange) and gpt-4o (blue) curves generated
  with BTE context surge ahead of their prompt-only counterparts, revealing a marked
  advantage in producing highly concordant mechanistic explanations.(B) Score distribution
  GPT-4o, LLM-only. Histogram of cosine-similarity scores for GPT-4o answers generated
  without external context. The hatched bar at 0.90–1.00 marks the high-fidelity zone,
  capturing 129 near-perfect matches produced by the baseline model.(C) Score distribution
  GPT-4o + BTE-RAG. Same format as panel B but for GPT-4o answers produced with BTE-RAG’s
  context. The distribution is right-shifted, and the solid bar in the 0.90–1.00 high-fidelity
  zone now contains 144 answers, highlighting the enrichment of top-tier mechanistic
  concordance achieved through retrieval-augmented generation
article_title: Federated Knowledge Retrieval Elevates Large Language Model Performance
  on Biomedical Benchmarks
