figure_title: BMEE promotes neurite outgrowth by activating the TrkA pathway.
caption: 'BMEE promotes neurite outgrowth by activating the TrkA pathway. (A) GO analysis
  illustrates the involvement of the TrkA receptor (NTRK1) with other targets and
  in neuron, dendrite, and axonal development. (B) Statistical analysis shows morphometric
  parameters of DIV 3 neurons: the number of primary processes, the total length of
  primary processes, and the length of the longest process in the presence of vehicle,
  BMEE (2.5 μg/mL), BMEE + GW441756 (TrkA inhibitor), and GW441756. Data are presented
  as mean ± SEM from three independent experiments (n = 3), with 10 neurons analyzed
  in each experiment. Statistical significance was determined by one-way ANOVA followed
  by Tukey’s post hoc test, with comparisons made against the vehicle control (* p
  < 0.05, ** p < 0.01, *** p < 0.001). (C) Representative fluorescent images show
  primary neurons grown to DIV 3, stained with MAP2 (Green) and Tau (Red), with DAPI
  in the vehicle/BMEE/BMEE + GW441756/GW441756-treated condition. “#” denotes “number
  of”. Scale bar, 20 μm, applies to all images'
