figure_title: CSE-P12 ameliorated the survival rate and lung inflammation in the CLP-induced
  sepsis mouse model by regulating STING pathway.
caption: 'CSE-P12 ameliorated the survival rate and lung inflammation in the CLP-induced
  sepsis mouse model by regulating STING pathway. (A) A scheme showing the CLP-induced
  sepsis mouse model in WT and STING-/- mice; CSE-P12 treatment (500 nM, 100 μL) or
  the PBS control was intraperitoneally administered on Day 0, 1, 2 and 3, and mice
  were monitored for survival rate over 7 days or sacrificed on Day 3 for further
  analysis. (B) The survival rate of mice over 7 days after CLP with/without CSE-P12
  treatment; N = 6 for the sham group and N = 18 for the CLP and CSE-P12 treatment
  groups; the log-rank (Mantel-Cox) test was used for the statistical analysis. (C)
  Immunoblots showing the levels of STING, p-TBK1, and p-IRF3 in the lung tissues
  of mice from the sham control, CLP, CLP+CSE-P12 groups; β-actin as the internal
  control. (D) Densitometry analysis of STING protein levels in (C). (E-G) Bacterial
  loads in the lung (E), kidneys (F), and spleen (G) of WT and STING-/- mice under
  CLP-induced sepsis with CSE-P12 (500 nM, 100 μL) or PBS treatment through i.p. injection
  (Day 3 after CLP). (H) The representative H&E images of lung sections from WT and
  STING-/- mice under CLP with/without CSE-P12 treatment (Day 3); scale bar = 2 mm
  (top) and 100 μm (bottom). The red arrows indicate neutrophils in the lung. (I)
  The lung injury scores were analyzed based on the 5 pathophysiological features
  in the H&E images in (H); N = 3 for sham control and N = 5 for CLP and treatment
  groups. ns: not significant, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
