figure_title: Schematic Diagram of the Mechanism by Which Alveolar Echinococcus Secreted
  Molecules Drive M2 Polarization of Macrophages.
caption: 'Schematic Diagram of the Mechanism by Which Alveolar Echinococcus Secreted
  Molecules Drive M2 Polarization of Macrophages. Figure Legend: this figure illustrates
  the mechanism by which alveolar echinococcosis induces M2 polarization of host macrophages
  through secreted antigenic molecules and related factors. The parasite directly
  stimulates host macrophages by releasing soluble antigens, cyst fluid, or protoscoleces,
  activating RhoA-ROCK and MAPK signaling pathways, promoting the expression of M2
  markers such as Arg-1 and IL-10, while inhibiting the upregulation of M1 markers
  such as iNOS and IL-12. Furthermore, the phytic acid secreted by the parasite chelates
  Ca2+ within macrophages, inhibiting the NF-κB signaling pathway, thereby attenuating
  pro-inflammatory responses and further promoting M2 polarization, Extracellular
  vehicles (EVs) containing miRNAs (e.g., miR-10a-5p, putatively) may target the STAT6/PPARγ/JAK-STAT
  pathway; this mechanism remains hypothetical and is depicted with dashed lines and
  question marks. These coordinated actions collectively drive macrophages toward
  an M2-like phenotype, resulting in active tissue remodeling, fibrosis promotion
  (via hepatic stellate cell activation and collagen deposition), and parasite immune
  evasion (Solid arrows indicate experimentally supported signaling or regulatory
  effects, T-shaped blunt lines indicate inhibition, dashed lines/dashed outlines
  indicate putative or incompletely validated mechanisms, and question marks indicate
  uncertain molecular targets or pathways)'
