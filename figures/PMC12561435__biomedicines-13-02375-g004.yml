figure_title: Effects of knockdown or overexpression of Thbs4 on related factors in
  DRG neuron cells.
caption: Effects of knockdown or overexpression of Thbs4 on related factors in DRG
  neuron cells. Before (A) and after (B) knockdown or overexpression of Thbs4, qRT-PCR
  was used to detect the expressions of growth- and apoptosis-related factors in DRG
  neuron cells. Before (C) and after (D) knockdown or overexpression of Thbs4, Western
  blot was used to detect the expressions of growth factors and signal pathway factors.
  NC or NC-OE was used as negative controls. n = 3, versus negative control, * p <
  0.05, ** p < 0.01 and *** p < 0.001. siRNA, small interfering RNA. NC, negative
  control of siRNA. AAV, adeno-associated virus. NC-OE, negative control of overexpressed
  AAV. Bcl2, B-cell lymphoma-2. Bax, Bcl-associated X protein. NF200, neurofilament
  200. PKCα, protein kinase Cα. bFGF, basic fibroblast growth factor. AKT2, threonine
  Kinase 2. TNFα, tumor necrosis factor α. GAP43, growth associated protein 43. IL-1β,
  interleukine-1β. Thbs4, thrombospondin-4. NF-κB, nuclear factor-κB. ERK, extracellular
  regulated protein kinase. GAPDH, glyceraldehyde-3-phosphate dehydrogenase. DRG,
  dorsal root ganglion. qRT-PCR, real-time quantitative PCR
