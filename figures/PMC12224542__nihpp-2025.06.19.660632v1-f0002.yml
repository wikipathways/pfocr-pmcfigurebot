figure_title: BNLF2a from Epstein-Barr virus inserts an N-terminal helix from the
  cytoplasm into inward-facing TAP
caption: 'a. The overall structure. TAP1, TAP2, and BNLF2a are colored in sky blue,
  gold, and salmon, respectively. b Zoomed-in view of the TAP translocation pathway
  sliced perpendicular to the plane of the membrane. TAP is shown as molecular surface.
  The first and last visible BNLF2a residues are numbered. c. Left: BNLF2a interacts
  with the C-pocket of the TAP substrate binding site, from the ER lumen. Right: The
  TAP N- and C-pockets in the inward-facing state interact with a peptide antigen
  (PDB: 8T4F). d. Details of TAP/peptide (upper) and TAP/BNLF2a (bottom) interactions
  at the N- and C-pockets. Pocket residues in TAP1 are shown in blue on the left panel
  and those of TAP2 in yellow on the right panel. Hydrogen bonds are shown as dotted
  lines'
