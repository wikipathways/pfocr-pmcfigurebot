figure_title: The TAS1R2/TAS1R3 heterodimer signaling pathway
caption: Sucrose binds to the TAS1R2/TAS1R3 heterodimer, triggering closure of the
  receptor’s Venus flytrap domains (VFDs) and opening of the intracellular region,
  which facilitates G protein activation and downstream signal transduction 6. Activation
  of the associated G protein initiates intracellular signaling cascades that contribute
  to the perception of sweetness and various physiological responses 12
