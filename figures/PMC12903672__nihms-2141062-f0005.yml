figure_title: Lymphoma triggers age-related epigenetic reprogramming in young CD4+
  T cells
caption: (A) Principal-component analysis of bulk ATAC-seq of the indicated CD4+ T
  cells.(B) Fold changes of open chromatin regions (OCRs) with p-adjusted values.
  Light blue indicates significantly more closed OCRs and yellow indicates significantly
  more open OCRs (FC < 0.5 or FC > 0.5; p-adj <0.05).(C) Gene set enrichment analysis
  using HALLMARK pathways of genes associated with OCRs in CD4+ T cells.(D) Genes
  in the heme metabolism pathway around OCRs that are significantly altered in comparisons
  of YL vs. YC and of AL vs. YL groups.(E) Enrichment of heme metabolism gene expression
  in lymphoma-experienced young (left) and in aged (right) CD4+ T cells, from pseudo-bulk
  analysis of scRNA-seq, as in Figure 4.(F) ATAC-seq tracks around the Hmox1 locus
  and the accessibility index for the highlighted regions.(G) Relative openness of
  OCRs around genes in the Abnormality of Iron Homeostasis Pathway (bars represent
  normalized read counts, minimum to maximum).YC, YL, AC, AL are defined in Figure
  1. Data (n = 3) are compiled from 3 independent experiments. See also Figure S5
