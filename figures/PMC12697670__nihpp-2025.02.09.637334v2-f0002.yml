figure_title: Distinct dopamine pathway tracks internal nutrients
caption: a, Dopamine release recorded with the fluorescent sensor GRAB-DA during Ensure
  IG infusion, showing responses localized to BLA.b, Dopamine release 5 s into the
  first lick bout, showing distributed responses.c, Dopamine release 5 s after the
  first lick bout, showing sustained activity in BLA.d, Peak times within 30 s of
  the first lick bout. Note prolonged BLA responses.e, During IG infusion, dopamine
  release was greatest in anterior BLA (aBLA).f, During the first lick bout, dopamine
  release was similar across BLA subregions.ns P > 0.05; *P < 0.05; **P < 0.01; ***P
  < 0.001. See Extended Data Table 2
