caption: Schematic representation of the proposed pathogenic amplification loop linking
  migration inhibitory factor (MIF), neutrophil activation, anti-neutrophil cytoplasmic
  antibody (ANCA), NETosis, tissue factor (TF) release, and coagulation in ANCA-associated
  vasculitis (AAV). Elevated circulating or tissue MIF binds to CXCR4/CD74 on resting
  neutrophils, and primes these. Upon subsequent encounter with ANCA autoantibodies,
  primed neutrophils undergo full activation via Fcγ receptors and PR3/MPO engagement.
  Activated neutrophils release TF-bearing microparticles, and form neutrophil extracellular
  traps (NETs) decorated with TF. These procoagulant structures trigger extrinsic
  coagulation pathway activation and thrombin generation. In turn, thrombin further
  upregulates the endothelial MIF release, and activates platelets, which serve as
  both an important source of circulating MIF and a target of MIF-mediated activation.
  The resulting complement activation, endothelial injury, and microthrombosis amplify
  the inflammatory-thrombotic cycle characteristic of active AAV. The model integrates
  clinical MIF-coagulation correlations and experimental evidence, showing the ANCA-induced
  TF and NET release
