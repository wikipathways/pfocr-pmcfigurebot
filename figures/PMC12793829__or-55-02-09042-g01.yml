caption: Disulfidptosis-regulated clusters and characteristics in cholangiocarcinoma.
  (A) Box plots of the top 20 differentially expressed DRGs in cholangiocarcinoma
  vs. normal samples; (B) heatmap of 74 DRGs in cholangiocarcinoma; (C) correlation
  matrix heatmap of the top 20 DRGs; (D) waterfall plot of mutations in 74 DRGs; (E)
  CDF curves for consensus clustering (k=2-10); (F) consensus matrix heatmap at k=2;
  (G) relative change in CDF Δ area for k values; (H) Kaplan-Meier survival curves
  for two molecular subtypes (P=0.038; HR=1.81; 95% CI, 1.03–3.2); (I) Violin plots
  of pathway enrichment score differences between subtypes. ***P<0.001, ****P<0.0001.
  DRGs, disulfidptosis-related genes; CDF, cumulative distribution function; MutCount,
  mutation count
