figure_title: The function of IGFBP2 is mediated via the PI3K/AKT pathway.
caption: The function of IGFBP2 is mediated via the PI3K/AKT pathway. (A) The HTR-8/SVneo
  cells were transfected with IGFBP2 overexpression plasmids to upregulate IGFBP2
  expression levels. The expression of the PI3K-AKT signaling pathway-related proteins
  P-PI3K/PI3K and P-AKT/AKT in HTR-8/SVneo cells detected by the Western blot analysis.
  (B) The expression levels of PI3K-AKT signaling pathway-related proteins, including
  P-PI3K/PI3K and P-AKT/AKT, were quantitatively analyzed in HTR-8/SVneo cells with
  IGFBP2 knockdown using the Western blot analysis. (C–G) The HTR-8/SVneo cells were
  transfected with IGFBP2 overexpression plasmids and incubated with 20μM PI3K/AKT–IN-1
  for 24 h. (C) The relative protein expression of P-PI3K/PI3K and P-AKT/AKT was determined
  by the Western blot with the management of PI3K/AKT–IN-1 in HTR-8/SVneo cells. (D)
  The CCK-8 assay was used to detect the proliferation of HTR8/SVneo cells in each
  group after the management of PI3K/AKT–IN-1 in HTR-8/SVneo cells. (E) The transwell
  assay was used to examine the migratory and invasive capabilities of HTR8/SVneo
  cells in each group; scale bar = 200 μm. (F) Western blotting was used to assess
  the EMT biomarkers levels of E-cadherin, N-cadherin, and Vimentin with the management
  of PI3K/AKT–IN-1 in HTR-8/SVneo cells. (G) The immunofluorescence was used to determine
  the relative expression levels of E-cadherin, N-cadherin, and Vimentin with the
  management of PI3K/AKT–IN-1 in HTR-8/SVneo cells. (scale bar = 100 μm). The data
  was expressed as the mean ± SD. An independent sample t-test was used to compare
  data across two groups. The two-way ANOVA and Bonferroni post-hoc test were utilized
  to compare the data at different time intervals. ns indicates no significant difference.
  * indicates p < 0.05, ** indicates p < 0.01, *** indicates p < 0.001, **** indicates
  p < 0.0001
