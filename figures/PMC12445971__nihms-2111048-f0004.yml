figure_title: Overview of engineered PROTAC delivery strategies
caption: (a) Antibody-PROTACs (AbTACs). Antibody-PROTAC conjugates selectively bind
  to antigens on target cells, facilitating endocytosis and PROTAC release. The released
  PROTAC recruits an E3 ligase, leading to POI ubiquitination and degradation via
  the ubiquitin–proteasome system (b) Bispecific antibody PROTACs. The bispecific
  antibody recognizes both the POI and a membrane-bound E3 ligase, inducing POI ubiquitination.
  The complex undergoes endocytosis, resulting in POI degradation through the lysosomal
  pathway. (c) Aptamer-based PROTACs. Aptamer-PROTAC conjugates use aptamers for POI
  recognition and E3 ligase recruitment, enabling ubiquitination and subsequent POI
  degradation via the ubiquitin–proteasome system. (d) Nano-PROTACs. PROTACs are encapsulated
  in pH- and cathepsin B-responsive nanoparticles (PSRNs). Upon exposure to acidic
  conditions and cathepsin B in the tumor microenvironment, the PROTACs are released,
  facilitating POI degradation
