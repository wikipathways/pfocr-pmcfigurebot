figure_title: Gut microbiota-derived metabolites modulate cardiac metabolic function.
caption: Gut microbiota-derived metabolites modulate cardiac metabolic function. A
  balanced diet promotes the production of SCFAs, which activate AMPK–SIRT1 signaling
  and improve mitochondrial efficiency, myocardial stress resistance, and endothelial
  function. In contrast, a diet rich in red meat and saturated fats increases TMAO
  levels, triggering NF-κB/MAPK pathways and promoting oxidative stress, chronic inflammation,
  and adverse cardiac remodeling. Arrows indicate the direction of pathway interactions,
  while red upward arrows (↑) indicate increased activation of the indicated signaling
  pathways. SCFAs (Short-chain Fatty Acids); TMAO (Trimethylamine N-oxide); AMPK (AMP-activated
  protein kinase); mTOR (Mammalian target of rapamycin); SIRT1 (Sirtuin1); HDAC (Histone
  deacetylase); NF-κB (Nuclear factor kappa-light-chain-enhancer of activated B cells);
  MAPK (Mitogen-activated protein kinase)
