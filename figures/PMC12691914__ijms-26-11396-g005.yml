figure_title: SESN2 differentially regulates the AKT/mTOR signaling pathway in endothelial
  cells under normal and MGO-stressed conditions.
caption: SESN2 differentially regulates the AKT/mTOR signaling pathway in endothelial
  cells under normal and MGO-stressed conditions. (A) Representative Western blot
  analysis showing protein expression of phosphorylated AKT (p-AKT Ser473), total
  AKT, phosphorylated mTOR (p-mTOR Ser2448), total mTOR, with GAPDH as a loading control.
  Endothelial cells were subjected to control (Ctl), SESN2 silencing (Si), or SESN2
  overexpression (Oe) conditions, with or without 600 μM MGO treatment for 18 h. Blots
  shown are representative of n = 3 independent experiments. (B) Quantitative analysis
  of p-AKT/total AKT ratio (left) and p-mTOR/total mTOR ratio (right). Data are presented
  as mean ± SD (n = 3 independent experiments). Groups that do not share a common
  letter are significantly different from one another (p < 0.05)
