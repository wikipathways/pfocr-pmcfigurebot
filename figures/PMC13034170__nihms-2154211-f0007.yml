figure_title: High miR-29 expression in LUAD patients correlates with CD8 expression
  and immunoregulatory pathway signatures, improving overall survival
caption: A. From publicly available TCGA data, a composite score of miR-29a-3p and
  miR-29c was generated from the dataset of 510 lung adenocarcinoma (LUAD) patients
  as described in the methods. Patients were then designated into miR-29 high, middle,
  or low categories based on this composite score, and the expression of CD8A was
  analyzed in the matched RNA-seq data. Thicker dashed line denotes the median, and
  thinner lines above and below indicate quartiles. *p<0.05 by Wilcoxon test. B. The
  expression of CD14 was analyzed in miR-29a/c high patients versus low patients as
  described in A. *p<0.05 by Wilcoxon test. C. LUAD patients from A were analyzed
  for miR-29a expression and was correlated with other transcripts in the matched
  RNA-seq data. A cut-off of FDR < 0.05 and Pearson correlation coefficient > ±0.20
  was applied to the data, and the resulting hits were analyzed by gene set enrichment
  analysis (GSEA) using the gene ontology functional database on WebGestalt.org(40).
  Top pathways with FDR < 0.05 are depicted, with blue bars representing a positive
  enrichment in miR-29 high patients and red bars depicting negative enrichment. D.
  Kaplan Meier survival plots were generated using kmplot.com(32–34). LUAD patients
  (n = 513) were split by the automatic selection of the best cutoff threshold of
  an equally weighted composite score of miR-29a, -29b, and -29c (left). These patients
  were then divided into those considered CD8 enriched (middle) or CD8 decreased (right)
