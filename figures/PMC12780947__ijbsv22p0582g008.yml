figure_title: TNF-α induces STAT1 phosphorylation at Tyr701 to directly bind the AIM2
  promoter and enhance transcription, and phosphorylation at Ser727 via the p38/MAPK
  pathway further augments AIM2 transcription.
caption: TNF-α induces STAT1 phosphorylation at Tyr701 to directly bind the AIM2 promoter
  and enhance transcription, and phosphorylation at Ser727 via the p38/MAPK pathway
  further augments AIM2 transcription. A) STAT1 DNA-binding motif obtained from JASPAR.
  B) Predicted STAT1-binding sites within the AIM2 promoter (JASPAR). C-E) HK-2 cells
  were treated with TNF-α (100 ng/mL) or vehicle for 24 h, then subjected to ChIP
  using anti-STAT1 antibody; IgG served as the negative control. (C, D) qPCR quantification
  of STAT1 enrichment at site 1 and site 2. (E) Agarose-gel verification of site-1
  amplification. F) Relative luciferase activity of cells transfected with pGL3-AIM2-WT
  reporter plasmid and mutant plasmids (pGL3-AIM2-MUT1 or pGL3-AIM2-MUT2) after treatment
  ± TNF-α. G-K) Western blot analysis of the protein levels of JNK, p-JNK, ERK, p-ERK,
  p38MAPK, p-p38MAPK, p65, p-p65, AKT, and p-AKT in HK-2 cells treated with TNF-α
  (100 ng/mL) for 0, 0.25, 0.5, 1, 3, and 6 h. L) Western blot analysis of AIM2 in
  HK-2 cells treated with TNF-α supplemented with or without (MK-2206 [AKT inhibitor],
  QNZ [NF-κB inhibitor], SB203580 [p38MAPK inhibitor], SP600125 [JNK inhibitor], or
  U0126 [MEK/ERK inhibitor]) for 24 h. M) Western blot and quantitative analysis of
  Fibronectin, STAT1, p-STAT1 (Tyr701), p-STAT1 (Ser727), and AIM2 in HK-2 cells treated
  with TNF-α supplemented with or without SB203580. N) Western blot analysis of Fibronectin,
  STAT1, p-STAT1 (Tyr701), p-STAT1 (Ser727), and AIM2 in HK-2 cells treated with TNF-α
  supplemented with or without R7050 (TNF-α Antagonist)
article_title: Dual Phosphorylation of STAT1 at Y701/S727 by TNFα Drives AIM2-Mediated
