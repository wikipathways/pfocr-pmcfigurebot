figure_title: MAP4 is an upstream interactor of the PC2-mediated osmosensing pathway
caption: '(A) Representative images of EB3-tdTomato expression in C2C12 CTL cells
  (top panels) and PC2-KO cells (bottom panels) at 300 mOsm and 400 mOsm. Insets:
  Zoomed images of EB3 comets. Scale bars: 10 μm. Original magnification for zoomed-in
  images, ×113.4. (B) EB3 comet length decreased in C2C12 CTL with 400 mOsm (blue
  vs. black bars). At 300 mOsm (black bars), comets were reduced in PC2-KO cells and
  remained unchanged at 400 mOsm (blue bars). Data analyzed by Kruskal-Wallis test
  followed by Dunn’s test. (C) Mean velocity of EB3 comets increased with 400 mOsm
  in CTL C2C12 cells, while in PC2-KO cells comets were faster at 300 mOsm and decreased
  with 400 mOsm. Data analyzed to determine normality, then by 2-way ANOVA followed
  by Šídák’s test. (D) Shortening of EB3 comets in C2C12 CTL cells (red dots) occurs
  within 0.91 minutes after hyperosmotic stimuli, which induced a cytosolic calcium
  (green trace) increase 20 seconds after. (E) MAP4 expression in the KO cell line
  (top Western blot). PC2 expression remained unchanged in MAP4-KO cells (bottom Western
  blot). GAPDH and tubulin used as loading controls, respectively. (F) Representative
  images of EB3-tdTomato expression C2C12 CTL cells (top panel) and MAP4-KO cells
  (bottom panel). Scale bar: 10 μm. (G) EB3 comet length was decreased in C2C12 MAP4-KO
  at baseline and remained unchanged with 400 mOsm. Statistical analysis determined
  by Kruskal-Wallis test followed by Dunn’s test. (H) Representative trace of cytosolic
  calcium changes in C2C12 MAP4-KO cells after hyperosmotic stimuli (blue line). (I)
  AUC decreased in the MAP4-KO after hyperosmotic stimuli. Statistical analysis by
  Mann-Whitney U test. Bar graphs represent mean ± SEM. In panels B, C, G, and I,
  dark dots represent biological replicates, while light dots represent individual
  cells. n > 3 biological replicates. P values listed in each panel'
