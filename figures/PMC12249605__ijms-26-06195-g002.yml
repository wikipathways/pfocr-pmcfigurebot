figure_title: Pathogenic mechanisms linking CRP isoforms to primary brain injury in
  hemorrhagic stroke.
caption: 'Pathogenic mechanisms linking CRP isoforms to primary brain injury in hemorrhagic
  stroke. Legend: Illustration of the pathogenic cascade in hemorrhagic stroke, highlighting
  the role of CRP isoforms. Systemic inflammation, mediated by IL-6, IL-1β, and TNF-α
  released from immune cells and dendritic cells, stimulates the hepatic synthesis
  of pentameric CRP. Upon encountering exposed phosphocholine on injured vascular
  membranes, pCRP dissociates into mCRP, which, via inflammatory, mechanical, and
  oxidative pathways, promotes locally astrocyte dysfunction, microglial activation,
  high endothelial permeability, MMP-9 release, and oxidative stress. These processes
  contribute to BBB disruption, vascular fragility, and ultimately to parenchymal
  damage via tissue necrosis, perihematomal edema, neuroinflammation, and neuronal
  loss in the setting of intracerebral hemorrhage'
