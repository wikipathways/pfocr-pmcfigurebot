figure_title: A) Volcano plot of gene expression for 5237 chromosomal and pXO1 genes,
  with log2 fold change on the x-axis and log10 adjusted p-value on the y-axis.
caption: A) Volcano plot of gene expression for 5237 chromosomal and pXO1 genes, with
  log2 fold change on the x-axis and log10 adjusted p-value on the y-axis. Genes with
  adjusted p-value < 0.05 and log2 fold change > 1 are shown in red (up-regulated),
  while those with log2 fold change < −1 are shown in blue (down-regulated). Bacteria
  were grown in NBY-G (NBY+ 10mM glucose) media with and without 5% CO2.B) Heatmap
  of the top 30 dysregulated genes (15 down-regulated and 15 up regulated) under 5%
  CO2 condition sorted by adjusted p-values, with color gradient indicating linear
  fold change. Hypothetical genes are annotated by their locus tag number. Biological
  replicates of are labeled as Air.1 to Air.3 and CO2.1 to CO2.3 for bacteria grown
  under 5%CO2.C) Ridge plots of selected metabolic pathways dysregulated in B. anthracis
  Wt under toxin-producing (10mM glucose + 5% CO2) vs. non-toxin-producing (10mM glucose
  + air) conditions. Based on Net Enrichment Score (NES), Up-regulated pathways (NES
  > 0) are shown in red, and down-regulated pathways (NES < 0) are shown in blue.D)
  Enrichment score profile for the TCA cycle pathway (bar00020). Vertical bars represent
  gene grouping based on net enrichment scores. The heatmap below shows leading genes
  defining the pattern in Figure 1C, with color gradient indicating linear fold change.
  Biological replicates of are labeled as Air.1 to Air.3 and CO2.1 to CO2.3 for bacteria
  grown under 5%CO2.E) Immunoblot of PA (88 kDa) expression in Wt grown with and without
  5% CO2 in RM minimal media supplemented with specific sugars. Representative image
  of n=7 experiments. Supernatant volume in each lane is normalized to total cellular
  protein concentration (mg/mL) estimated using BCA method.F) qRT-PCR analysis of
  atxA and pagA transcripts in bacteria grown with different sugars and 5% CO2. Expression
  levels are normalized to rpoB transcripts. ns = non-significant, p < 0.05, * p <
  0.01. Representative graph of n=3 experiments
