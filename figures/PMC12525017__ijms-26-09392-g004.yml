figure_title: CK−derived EVs modulate the mRNA and protein expression levels of SIRT1/SREB−1c/PGC−1α
  pathway-related genes in hepatocytes.
caption: CK−derived EVs modulate the mRNA and protein expression levels of SIRT1/SREB−1c/PGC−1α
  pathway-related genes in hepatocytes. (a) Effects of CK−derived EVs on the relative
  mRNA expression levels of SIRT1-SREBP−1c/PGC−1α pathway-related genes in normal
  and 2.4 mM NEFA−treated hepatocytes. (b,c) Effects of CK−derived EVs on the relative
  abundance of SIRT1/SREBP−1c/PGC−1α pathway-related proteins in normal hepatocytes
  and those treated with NEFAs at 2.4 mM. (d,e) The relative protein levels were quantified
  in the normal and 2.4 mM NEFA groups using ImageJ 2.0.0−rc−30. The levels of β-actin
  were used to normalize the relative protein levels. CK, Clinical ketosis. CK−Normal,
  normal hepatocytes treated with CK−derived EVs. CK-2.4 mM NEFA, hepatocytes treated
  with CK−derived EVs and NEFAs at 2.4 mM. Results are presented as the mean ± SD
  (n = 3). * p < 0.05 and ** p < 0.01 vs. 0 μg/mL CK−derived EVs. Typical images of
  Western blotting are shown
