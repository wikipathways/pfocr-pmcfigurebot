figure_title: Cell-specific effects of SHP2 T cells and myeloid cells.
caption: Cell-specific effects of SHP2 T cells and myeloid cells. (A) In T cells,
  PD-1 engagement by PD-L1 recruits SHP2 to phosphorylated ITIM and ITSM, leading
  to the dephosphorylation of TCR signaling components (CD3ζ, ZAP70, PI3K). This suppresses
  downstream pathways (PI3K-AKT, Ras-ERK), reduces IL-2 production, and decreases
  phosphorylation of co-stimulatory protein CD28, which in turn decreases co-stimulatory
  engagement. (B) In myeloid cells, PD-1–SHP2 signaling inhibits differentiation by
  reducing HOXA10 and IRF8, while in macrophages, it regulates CSF-1/CSF-1R and CD47/SIRPα
  pathways [5]. SHP2 promotes immunosuppressive M2 polarization through the stabilization
  of PPARg [54] and tumor-associated macrophage formation, thereby limiting anti-tumor
  immunity and contributing to resistance to checkpoint inhibitor therapy. SHP2 may
  also contribute to an increase in CSF-1 and CSF-1R expression. Additionally, upon
  CD47 engagement, SIRPα recruits SHP2, which is deneddylated by SENP8, leading to
  its activation and subsequent dephosphorylation of substrates at the phagocytic
  cup, thereby inhibiting phagocytosis. Created in BioRender. Pereda, C. (2026) https://BioRender.com/rbj0i0b
