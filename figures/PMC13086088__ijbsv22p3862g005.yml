figure_title: Characterization of T cells during LSCC progression.
caption: Characterization of T cells during LSCC progression. A UMAP plot of T cell
  subsets colored by cell type. B Dot plots showing the expression of canonical marker
  genes across each T cell subset. C Violin plots showing the cytotoxicity and exhausted
  scores for CD8+ T cell subsets, with colors representing different cell types. D
  Bar plots showing the frequency (left) and proportion (right) of each T cell subset
  in different tissues. E The infiltration proportion of CD8+ Tex (left) and CD8+
  Teff (right) cells. F Heatmap displaying pathway activities of each T cell subset,
  quantified as normalized enrichment scores (NES) from GSEA. G Heatmap illustrating
  the expression of selected genes related to exhaustion and cytotoxicity across CD8+
  T cell subsets. H Pseudotime trajectory analysis of CD8+ T cells, with subsets and
  distinct cellular states color-coded. The inset plot colors cells by pseudotime
  score, ranging from dark blue (early state) to light blue (terminal state). I Pseudotime
  plots demonstrating the temporal variation of cytotoxic (upper panel) and exhausted
  (lower panel) signatures within CD8+ T cells. J Stacked bar graph showing the distribution
  proportions of CD8+ T cells in each state across LSCC precursor (LSCCP), VCL, and
  LSCC groups. K Pseudotime plots of CD8+ T cells from LSCCP (top), VCL (middle),
  and LSCC (bottom) samples, with cell density along the pseudotime trajectory displayed
  along the upper section
