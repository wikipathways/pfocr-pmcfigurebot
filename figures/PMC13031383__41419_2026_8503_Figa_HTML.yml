figure_title: Proposed model of sialic acid–Siglec-7–mediated regulation of EVT invasion
  through the ST6GALNAC6–sialic acid–Siglec-7–IL-8–STAT3 signaling axis.
caption: 'Proposed model of sialic acid–Siglec-7–mediated regulation of EVT invasion
  through the ST6GALNAC6–sialic acid–Siglec-7–IL-8–STAT3 signaling axis. Schematic
  representation of the working model: enhanced sialylation of EVT membrane glycoproteins—driven
  by ST6GALNAC6—facilitates recognition by Siglec-7 expressed on dNK cells. This interaction
  promotes the activation of the IL-8–STAT3 signaling pathway, which supports EVT
  cell migration and invasion. Disruption of sialylation or Siglec-7 engagement impairs
  this pathway and reduces EVT invasiveness, potentially contributing to the pathogenesis
  of RPL. Figure created with BioRender.com (https://BioRender.com/dxxt5az)'
article_title: Deficient extravillous trophoblast invasion caused by impaired sialylation–Siglec-7
  interaction contributes to recurrent pregnancy loss
