figure_title: Increased expression of TGF-β pathway–related genes and myofiber atrophy–associated
  genes in human hernia tissue
caption: '(A–C) Representative RNAscope images from herniated and adjacent healthy
  LAM tissue from male patients showing (A) expression of TGFBR2 (magenta arrow) in
  fibroblasts (FBN1+, green arrow) and mesothelial-like cells (WT1+, orange arrow),
  (B) expression of TGFB2 (orange arrow) in PGR+ (FBN1+, green arrow; PGR+, magenta
  arrow) and PGR– (FBN1+, green arrow; PGR–) fibroblasts, and (C) expression of TRIM63
  (orange arrow) and FBXO32 (magenta arrow) in myofibers (green outline in autofluorescent
  (AF) channel). (D–G) Quantification of expression levels of (D) TGFBR2, (E) TGFB2,
  (F) TRIM63, and (G) FBXO32 in healthy and herniated LAM tissue from male patients
  (n = 5–6/group, paired t test). Scale bars: 25 μm and 5 μm (INSERT). *P < 0.05,
  **P < 0.01'
