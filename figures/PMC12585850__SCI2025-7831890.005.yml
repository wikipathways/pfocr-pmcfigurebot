caption: 'HuMSC-Exos regulated the Nrf2 signaling pathway by delivering miR-200a-3
  p targeting Keap1. (A, B) miRNA sequencing analysis showing relative miRNA proportions
  and Venn diagram illustrating intersecting miRNAs. (C) RT-qPCR validation of miR-200a-3
  p and miR-423-5 p expression. (D, E) Dual-luciferase reporter assays confirming
  the direct binding of miR-200a-3 p to Keap1 3′UTR. (F–H) RT-qPCR and Western blot
  analysis of Keap1, Nrf2, and HO-1 expression in HaCaTs transfected with NC, miR-200a-3
  p mimics, or inhibitors, and grayscale quantification of protein bands. (I–K) Validation
  of miR-200a-3 p effects on Keap1/Nrf2/HO-1 expression in differently treated HaCaTs
  by RT-qPCR, Western blot, and grayscale analysis. Data are presented as mean ± SD
  (n = 3). (ns: nonsignificant, ⁣∗p < 0.05, ⁣∗∗p < 0.01, ⁣∗∗∗p < 0.001, ⁣∗∗∗∗p < 0.0001)'
