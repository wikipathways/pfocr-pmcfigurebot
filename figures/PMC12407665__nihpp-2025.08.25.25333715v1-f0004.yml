figure_title: Spatial transcriptomic analysis of precancerous to HGSC transition in
  the fallopian tube
caption: '(A) Principal component analysis (PCA) of epithelial cell transcriptomes
  of normal epithelium, FT precursors, HGSC, and corresponding metastasis (met). FOXJ1pos,
  FOXJ1-positive. FOXJ1neg, FOXJ1-negative. P53, p53 signature.(B) Volcano plot. Differential
  expression of transcripts between normal epithelial secretory cells (FOXJ1neg) and
  STICs (Table S4B). FDR < 0.05, fold change > 1.5.(C) GSEA revealing pathways of
  differentially expressed transcripts in STICs versus normal secretory cells (Table
  S4C). Bar length indicates enrichment significance; color intensity represents normalized
  enrichment score.(D) RNA expression levels of WNT11 and CTNNB1. Statistical significance
  was determined using unpaired two-tailed Student’s t-test.(E) PCA of stromal transcriptomes
  below normal FT epithelium, FT precursors, and within HGSC and corresponding metastasis.(F)
  Volcano plot comparing gene expression between normal and STIC-adjacent stroma,
  highlighting BGN and other significantly expressed transcripts (Table S4D). FDR
  < 0.05, absolute fold change > 1.5.(G) GSEA reveals REACTOME pathways enriched in
  STIC-adjacent stroma versus normal stroma (Table S4E).(H-I) Gene expression levels
  of biglycan (BGN) across the indicated sample types (H, statistics: two-tailed Student’s
  t-test) and immunohistochemistry in STIC-adjacent and normal stroma (black and green
  dashed lines, respectively) (I).(J-L) Deconvolution of Nanostring GeoMx transcriptomic
  data using SpatialDecon54 (Table S4F, G). Box plot showing the proportion of macrophages
  (J), T cells (K) and canonical fibroblasts (L) across disease states. Each dot represents
  an individual sample. Statistical significance was determined using Kruskal-Wallis
  test. **p < 0.01, ***p < 0.001, ****p < 0.0001. Box plots show median (center line),
  first and third quartiles (box limits), 1.5× interquartile range (whiskers), and
  mean (diamonds)'
