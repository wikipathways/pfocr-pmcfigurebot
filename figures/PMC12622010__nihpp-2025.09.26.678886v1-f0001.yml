figure_title: Data Description and Exploratory Data Analysis
caption: (a) Schematic overview of dataset and analyses performed. BMAC samples and
  KL grades (OA severity) were obtained for 119 OA patients, and each sample was subjected
  to scRNA-seq and LC-MS profiling, yielding cell type-specific transcriptomic profiles
  and metabolomic profiles of each patient. These multi-omics data were analyzed to
  produce metabolite-gene associations for each cell type, highlighting key genes,
  metabolites and pathways, associating metabolites with cell types, and relating
  multi-omics profiles to KL scores. (b) Boxplots representing proportions of 17 cell
  types in BMAC samples across all patients. The cell types are sorted from left to
  right in decreasing order of median abundance. (c, d) UMAP plots of batch-corrected
  transcriptomics profiles (C) and batch-corrected metabolomics profiles (D). Each
  point represents a patient sample and is colored according to the site (hospital)
  where the sample was collected
article_title: Multi-omics integration at cell type resolution uncovers gene-metabolite
  mechanisms underlying osteoarthritis heterogeneity
