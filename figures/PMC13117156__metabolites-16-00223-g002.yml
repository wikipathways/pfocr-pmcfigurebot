caption: Differential metabolite analysis and metabolic pathway enrichment among MT,
  BT, and JT groups. (A–C) Volcano plots illustrating the differential metabolites
  between MT vs. BT (A), MT vs. JT (B), and BT vs. JT (C). Red dots represent significantly
  up-regulated metabolites; blue dots represent down-regulated metabolites. (D) Chemical
  classification and proportion of the identified differential metabolites. (E) Hierarchical
  clustering heatmap of key differential metabolites across MT, BT, and JT groups.
  The color scale from blue to red represents relative abundance from low to high.
  (F) KEGG pathway enrichment analysis of the differential metabolites
