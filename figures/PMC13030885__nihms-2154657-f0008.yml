figure_title: Counterfactual Simulation of Diverging Disease Pathways.
caption: Counterfactual Simulation of Diverging Disease Pathways. This graph simulates
  how a single differing diagnosis creates two distinct patient futures. Both trajectories
  share a common start (Essential hypertension → Fluid and electrolyte disorders)
  before splitting. The blue path shows a metabolic-renal cascade initiated by Diabetes,
  leading to Chronic kidney disease. In contrast, the red path follows an inflammatory
  trajectory culminating in Fever, demonstrating the model’s ability to identify critical,
  path-defining clinical events
