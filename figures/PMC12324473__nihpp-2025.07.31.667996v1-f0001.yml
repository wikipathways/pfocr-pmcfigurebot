figure_title: Homozygous but not heterozygous loss of Pten in a sporadic mouse model
  of SmoM2 SHH-MB increases penetrance and reduces time of disease onset
caption: (A) An Oncoprint of 27 patient samples considered to be SHH-MB3 using the
  cBioPortal20, 21 showing the frequency of mutations in PTEN and genes that activate
  the SHH pathway showing co-occurrences. (B) Schematic showing Mosaic mutant Analysis
  with Spatial and Temporal Regulation (MASTR) technique used to model SHH-MB by expressing
  SmoM2 in scattered GCPs starting at P0 and deleting one or two copies of Pten (Atoh1-FlpoER/+;
  R26MASTR/LSL-SmoM2; Ptenfl/fl or SmoM2-Ptenfl/fl mice). (C) Kaplan-Meier curve and
  statistics (below) for survival of SmoM2 mice compared to SmoM2-Ptenfl/fl and SmoM2-Ptenfl/+
  mice. Statistics were calculated using the log-rank test. (D-F) Representative images
  of hematoxylin and eosin (H&E) stained sagittal sections of end stage tumors from
  SmoM2, SmoM2-Ptenfl/+, and SmoM2-Ptenfl/fl mice with higher maginification images
  shown below (n>8 per genotype). Scale bars indicates 1mm (D-F) and 100 μm (D’-F’).
  (G-I) GFP stained saggital sections of end stage tumors from the the indicated mutants
  (n=5–8 per genotype). Scale bar indicates 1mm. (J-L) Saggital sections of end stage
  tumors from the indicated mutants stained for PTEN (J-L) or pAKT (M-O) with higher
  magnifications below. Scale bars indicates 1mm (J-O) and 20 μm (J’-O’). (D-O) Dashed
  lines outline the tumors, solid lines outline IGL, dotted rectangles indicate location
  of high magnification images
article_title: PTEN restrains SHH medulloblastma growth through cell autonomous and
