figure_title: Schematic representation of SBSPON action in bladder cancer cells.
caption: Schematic representation of SBSPON action in bladder cancer cells. SBSPON
  inhibits HSPA5 membrane translocation, ultimately suppressing bladder cancer cell
  proliferation via inhibition of the HSPA5-AKT-MEK/ERK pathway. SBSPON may inhibit
  EMT process through GSK-3β/Snail signal pathway. A novel interaction between HSPA5
  and SBSPON enhanced following treatment of ER stress inducers DDP and TM. SBSPON
  can attenuate the binding between HSPA5 and PERK, leading to a lower threshold for
  activation of ER stress signaling and ultimately induces cell death associated with
  ER stress (by Figdraw)
article_title: Novel glycoprotein SBSPON suppressed bladder cancer through the AKT
  signal pathway by inhibiting HSPA5 membrane translocation
