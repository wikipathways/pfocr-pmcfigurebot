figure_title: Hypothetical interplay between LPS-induced signaling pathways and the
  modulatory effects of DHA+DEX on type I IFN-regulated and proinflammatory gene expression
caption: 'LPS stimulation activates toll-like receptor 4 (TLR4), initiating two major
  signaling pathways: 1) the MYD88-dependent pathway and 2) the TRIF-dependent pathway.
  The MYD88-dependent pathway leads to activation of the transcription factors (TFs)
  AP-1 (ATF-2/c-Jun) and NF-κB (p50/RelA), which induce expression of proinflammatory
  cytokines such as TNF-α, IL-1α, and IL-6, as well as IFN-β. Concurrently, the TRIF-dependent
  pathway phosphorylates IRF3/7, which forms a complex with NF-κB and AP-1, termed
  the IFN-β enhanceosome, to drive IFN-β production. IFN-β binds to its receptor (IFNAR1/IFNAR2),
  activating JAK/STAT signaling and inducing downstream ISGs such as CCL2, CXCL10,
  and IRF1. DHA combined with DEX suppresses the expression of inflammatory cytokines
  (TNF-α, IL-1α, IL-6) and IFN-β, as well as downstream genes regulated by STAT1/2,
  by inhibiting key IFN-β enhanceosome components. Symbols: →, increase activity;
  ┤, suppress activity. Created with BioRender.com'
