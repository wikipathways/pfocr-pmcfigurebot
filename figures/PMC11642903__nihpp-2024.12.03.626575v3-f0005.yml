figure_title: Chemomechanical Model of Proposed Catch-bond Mechanism
caption: (A) Diagram of kinesin chemomechanical cycle model consisting of strongly-
  and weakly-bound states that make up the stepping cycle, and slip and detached states
  that terminate runs and stalls. Note that two pathways of detachment from the slip
  state (and reattachment) are incorporated into the model, but only one pathway is
  shown for simplicity (see Supplementary Methods for details). (B) Table of rate
  constants used to simulate unloaded and stall durations and restarting times. All
  rate constants are derived from fits to experimental data, as described in Supplemental
  Methods. kS-W and kslip depended exponentially on load (k(F)=k0eFδkBT) with δ for
  kS-W of −2.7, −2.4, and −3.6 nm and δ for kslip of 1.6, 1.3 and 2.7 nm for kinesin-1,
  -2 and -3, respectively; see also Figure S8A). (C-E) Experimental (symbols) and
  simulated (lines) unloaded and stall durations. 10,000 events were simulated for
  each condition and plotted with minimum cutoffs matching experiments. Kinesin-3
  ramp durations were taken from parameter estimated in Figure 3. (F-H) Experimental
  (symbols) and simulated (lines) restart times
