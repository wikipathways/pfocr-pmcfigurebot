figure_title: EMILIN-1 and proliferation.
caption: EMILIN-1 and proliferation. The illustration depicts the molecular mechanisms
  through which EMILIN-1 regulates cell proliferation. Under physiological conditions,
  TGF-β exerts a cytostatic effect primarily by inducing Smad2 phosphorylation at
  Ser465/467 and modulating the PI3K/Akt pathway by regulating PTEN expression. EMILIN-1
  disrupts this signaling by binding specifically to the pro-TGF-β precursor, thereby
  inhibiting its extracellular maturation. In addition, EMILIN-1 interacts with α4β1
  and α9β1 integrins via the E955 (E954 in humans) residue of each of its monomers,
  promoting PTEN activation and suppressing the pro-proliferative ERK1/2 pathway.
  Through this dual mechanism, EMILIN-1 counteracts TGF-β–driven proliferative signaling.
  In the absence of EMILIN-1, the unregulated maturation of TGF-β leads to increased
  levels of its active form, while α4/α9β1 integrins are no longer engaged, resulting
  in PTEN downregulation. This contributes to enhanced activation of proliferative
  signaling pathways, including pAkt and pERK1/2. Additionally, activation of α4β1
  integrin by the gC1q domain stimulates FAK, leading to an increase in HRasGTP levels
  and its subsequent ubiquitination (HRasGTP-Ub). HRasGTP inactivation, together with
  low basal intracellular Ca2+ levels, contributes to decreased ERK1/2 phosphorylation
  and reduced cell proliferation. Created with BioRender.com
