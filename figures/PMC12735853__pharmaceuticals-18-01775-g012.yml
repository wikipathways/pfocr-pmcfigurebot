figure_title: Therapeutic mechanism of ST909 in the rat model of ischemic brain injury.
caption: Therapeutic mechanism of ST909 in the rat model of ischemic brain injury.
  During the recovery phase of ischemic brain injury, ST909 activates the STING/IRF3
  pathway. On the one hand, it releases IFN-β, promoting angiogenesis and oxidative
  stress resistance. On the other hand, phosphorylated IRF3 activates the PI3K/Akt
  pathway under hypoxia, regulating the balance of M1/M2 ratios and promoting microglial
  polarization toward the anti-inflammatory M2 phenotype. M2 microglia secrete anti-inflammatory
  factors (e.g., IL-4 and IL-10), suppressing inflammatory responses and protecting
  healthy neural tissue. Secondly, M2-polarized microglia are activated and rapidly
  migrate to the infarct core and penumbra, engulfing damaged neurons and cellular
  debris, reducing local inflammation, and thereby restoring neuronal function. Furthermore,
  M2 microglia upregulate neurotrophic factors (e.g., BDNF), enhancing axonal regeneration
  and facilitating the repair and functional remodeling of injured neurons. Created
