figure_title: Key oncogenic signalling pathways implicated in advanced ER-positive
  breast cancer and corresponding targeted therapeutic strategies with positive phase
  III trial data.
caption: 'Key oncogenic signalling pathways implicated in advanced ER-positive breast
  cancer and corresponding targeted therapeutic strategies with positive phase III
  trial data. Evidence for PIK3CA inhibitors emerged from the SOLAR-1 [18] and BYLieve
  [19] trials, where alpelisib in the second-line setting improved PFS in PIK3CA-mutant
  patients (8–11 months; HR 0.65, p < 0.001). Mutant-selective PIK3CA inhibitors,
  such as inavolisib, reduce off-target toxicities and demonstrated improved PFS (15
  vs. 7.3 months; HR 0.43, 95% CI 0.32–0.59 and p < 0.001) and OS (34.0 vs. 27.0 months;
  HR 0.67, p = 0.019) in the first-line setting (INAVO120) [20]. Capivasertib, a pan-AKT
  inhibitor, showed efficacy in the second-line setting, irrespective of AKT pathway
  alterations (PFS 7.2 vs. 3.6 months; HR 0.60, 95% CI 0.51–0.71 and p < 0.001) [21].
  Everolimus combined with exemestane improved PFS in the second-line setting in the
  BOLERO-2 trial (HR 0.36, 95% CI 0.27–0.47 and p < 0.001) [22], prior to the routine
  implementation of molecular profiling. CDK4/6 inhibitors in combination with endocrine
  therapy remain the cornerstone of first-line treatment, irrespective of molecular
  mutation status. Abbreviations: AKT: Protein kinase B; CDK4/6: cyclin-dependent
  kinase 4/6; E2: oestradiol; ERα: oestrogen receptor alpha; ERβ: oestrogen receptor
  beta; FDA: Food and Drug Administration; mTOR: mammalian target of rapamycin; PDK1:
  3-phosphoinositide-dependant kinase 1; PI3K: phosphoinositide 3-kinase; PIP2: Phosphatidylinositol
  (4,5)-bisphosphonate; PIP3: Phosphatidylinositol (3,4,5)-Triphosphonate; PTEN: Phosphatase
  and tensin homolog; Rb: Retinoblastoma; T: testosterone'
