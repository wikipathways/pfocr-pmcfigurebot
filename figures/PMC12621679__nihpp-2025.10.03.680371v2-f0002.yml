figure_title: In vitro screening reveals that microbiome-associated metabolites perturb
  genes and pathways linked to age-associated neurodegenerative disease.
caption: 'In vitro screening reveals that microbiome-associated metabolites perturb
  genes and pathways linked to age-associated neurodegenerative disease. (A) Schematic
  illustrating the setup of the in vitro transcriptomic screen. The full panel of
  30 metabolites was distributed across four sequencing batches, with each metabolite
  included in one batch. Within each batch, at least n=3 wells were treated with each
  assigned metabolite, its respective vehicle control, or the LPS control (see Methods
  and Supplementary Table 3). (B) Top enriched KEGG pathways for the genes significantly
  upregulated by the LPS control in the first sequencing batch. The analogous results
  for batches #2–4 are presented in Fig. S2. The non-specific “KEGG root term” was
  filtered out. (C) Number of differentially expressed genes (DEGs) per metabolite
  in the KEGG pathways for Alzheimer’s Disease (AD) and Parkinson’s Disease (PD).
  Metabolites impacting at least 5 unique AD/PD genes are shown. (D) Identity and
  characteristics of the four metabolites chosen for subsequent in vivo validation
  of their effects on the brain. IAA = indoleacetic acid, GDCA = glycodeoxycholic
  acid, TMAO = trimethylamine N-oxide, PA = palmitic acid, AD = Alzheimer’s Disease,
  PD = Parkinson’s Disease, GF = germ-free, CSF = cerebrospinal fluid. GUTSY refers
  to the GUTSY Atlas22, which reports microbiome-attributable variance in blood levels
  for 1,168 blood metabolites. Structure diagrams were produced with rdkit47. Relevant
  studies (e.g., those reporting metabolite detection in CSF or brain) are cited in
  the text'
article_title: Age-related microbiome metabolites alter RNA splicing and chromatin
