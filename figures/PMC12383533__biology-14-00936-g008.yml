figure_title: Mechanisms of general microbial modulation of Ras signaling.
caption: Mechanisms of general microbial modulation of Ras signaling. (A) Fusobacterium
  nucleatum is associated with KRAS mutation, reprogramming the tumor microenvironment
  by recruiting tumor-infiltrating immune cells and releasing pro-metastatic cytokines.
  (B) Reovirus is a virus that can replicate in cells with activated Ras signaling,
  promoting the release of progeny virions and oncolysis. (C) Adenovirus and hepatitis
  B virus (HBV) alter cell cycle progression by activating the Ras/RAF/MEK/ERK pathway,
  driving uncontrolled proliferation, oncogenesis, and metastasis
