figure_title: The addition of DEIX increases proliferation of BMSCs, but suppresses
  ROS accumulation and recovers the Nrf2/HO-1 pathway in H2O2-exposed BMSCs.
caption: The addition of DEIX increases proliferation of BMSCs, but suppresses ROS
  accumulation and recovers the Nrf2/HO-1 pathway in H2O2-exposed BMSCs. BMSCs were
  isolated from young B6 mice that did not receive any treatment and then used to
  evaluate the direct effect of DEIX on H2O2-mediated cellular responses. (A) CCK-8
  assay results showing the proliferation rate of BMSCs in relation to the concentrations
  of DEIX at 24 and 48 h of incubation (n = 5). (B) Flow cytometric histograms exhibiting
  the H2O2-mediated increase in DCF-positive BMSCs and its inhibition by DEIX treatment
  along with (C) the mean percentage of DCF-positive cells in relation to the treatment
  (n = 5). (D) Western blot images showing the expression levels of HO-1 and Nrf2
  in BMSCs in relation to the concentrations of DEIX together with the graphs derived
  from densitometric analysis (n = 3). (E) Western blot result showing the level of
  HO-1 in BMSCs exposed to H2O2, DEIX, or both (n = 3). (F) qRT-PCR results exhibiting
  the expression of HO-1 and Nrf2 in BMSCs untreated or treated with H2O2 and/or DEIX
  (n = 4). Letters (a–c) in (A,C–F) indicate significant differences (p < 0.05) among
  the groups in ANOVA followed by Tukey’s multiple comparisons test
