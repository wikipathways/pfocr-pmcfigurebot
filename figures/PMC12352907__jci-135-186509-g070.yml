figure_title: Macrophage Listerin KO inhibits cholesterol efflux and aggravates foam
  cell formation
caption: '(A) Macrophage subtypes were classified into 4 different subpopulations.
  (B) The percentage of Listerin+ macrophages among the 4 subtypes of macrophages
  as the atherosclerosis progressed. (C) GO pathway analysis of differentially expressed
  genes (DEGs) in Listerin+ macrophages. (D) Oil Red O–stained images and quantitation
  of PMs from Listerinfl/fl and Listerinfl/fl Lyz2Cre mice after incubation with or
  without oxLDL (50 μg/mL) for 24 hours. n = 5 per group. Scale bar: 100 μm. Ctrl,
  control. (E) Oil Red O–stained images and (F) quantitation of PMs incubated with
  or without oxLDL (50 μg/mL) for 24 hours after adenovirus-mediated overexpression
  of Flag-Listerin and Flag–Listerin-ΔRing. n = 5 per group. Scale bar: 100 μm. (G)
  Immunofluorescence images and quantitation of PMs from Listerinfl/fl and Listerinfl/fl
  Lyz2Cre mice treated with Dil-oxLDL (40 μg/mL) at 37°C for 4 hours. n = 5 per group.
  Scale bar: 50 μm. (H) Immunofluorescence images and quantitation of PMs preloaded
  with the NBD cholesterol and then incubated with ApoA1 for 4 hours. n = 5 per group.
  Scale bar: 50 μm. (I) Time course of ApoA1-mediated cholesterol efflux assay of
  PMs from Listerinfl/fl and Listerinfl/fl Lyz2Cre mice. n = 3 per group. (J) ApoA1-mediated
  cholesterol efflux assay of PMs infected with the indicated adenovirus. n = 6 per
  group. (K) Percentage of [3H] cholesterol appearance in plasma, liver, and feces
  48 hours after transplantation of cholesterol-loaded RAW264.7 macrophages transfected
  with either normal control or Listerin siRNA (n = 6 per group). Data are presented
  as the mean ± SD. The Shapiro-Wilk method was used to test normal distributions.
  Statistical analysis was performed using an unpaired, 2-tailed Student’s t test
  (D, G, and K), a Mann-Whitney U test (H), 2-way ANOVA followed by Šidák’s post hoc
  test (I), and 1-way ANOVA with Dunnett’s post hoc test (F and J). The adjusted P
  values are provided for multiple-group comparisons. NS, P > 0.05; *P < 0.05, **P
  < 0.01, and ***P < 0.001'
