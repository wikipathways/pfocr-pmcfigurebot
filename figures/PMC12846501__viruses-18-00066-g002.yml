figure_title: FMDV VP3 activates the PI3K/AKT-mTOR pathway in 3D4/21 cells.
caption: FMDV VP3 activates the PI3K/AKT-mTOR pathway in 3D4/21 cells. Western blot
  analysis of PI3K, AKT, and mTOR and their phosphorylated forms (p-PI3K, p-AKT, p-mTOR)
