figure_title: VEGFA and NOTCH signaling promote migration of HCC cells.
caption: VEGFA and NOTCH signaling promote migration of HCC cells. (A) Transwell migration
  assay of HuH-7 cells. a, negative control (NC). b, Treatment with the NOTCH pathway
  inhibitor DAPT. c, Stimulation with recombinant VEGFA protein. d, Co-treatment with
  VEGFA and DAPT. e, Co-culture with cancer-associated fibroblasts (CAFs). f, Co-culture
  with CAFs in the presence of DAPT. Scale bar, 400 μm. (B) Relative mRNA expression
  levels of NOTCH1, NOTCH2, and NOTCH3 in HuH-7 cells under monoculture and CAFs co-culture
  conditions, as determined by RT-qPCR (top). The quantitative results of the transwell
  assays (bottom). (C) Transwell migration assay of SNU-449 cells. a, Vehicle control.
  b, Treatment with the NOTCH pathway inhibitor DAPT. c, Stimulation with recombinant
  VEGFA protein. d, Co-treatment with VEGFA and DAPT. e, Co-culture with CAFs. f,
  Co-culture with CAFs in the presence of DAPT. Scale bar, 400 μm. (D) Relative mRNA
  expression levels of NOTCH1, NOTCH2, and NOTCH3 in SNU-449 cells under monoculture
  and CAFs co-culture conditions, as determined by RT-qPCR (top). The quantitative
  results of the transwell assays (bottom). 0.1% human serum albumin and/or 0.1% DMSO
  were used as vehicles in control groups. HCC, hepatocellular carcinoma; RT-qPCR,
  real-time quantitative polymerase chain reaction. *P<0.05; **P<0.01; ***P<0.001,
  P-values of unpaired t-test
