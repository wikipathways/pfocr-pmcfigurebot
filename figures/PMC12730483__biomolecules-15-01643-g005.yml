figure_title: Effects and mechanisms of calycosin in the context of liver disease.
caption: Effects and mechanisms of calycosin in the context of liver disease. Calycosin
  acts as an agonist of the farnesoid X receptor signaling pathway to maintain the
  homeostasis of glucose and lipids in the liver. Calycosin activates FXR to facilitate
  the expression of the small heterodimer partner, after which it inhibits sterol-regulatory
  element binding protein 1c, Acetyl-coenzyme A carboxylase, fatty acid synthase,
  and stearoyl-coenzyme A desaturase 1 expressions, which are responsible for lipogenesis.
  FXR activation up-regulates the expression of peroxisome proliferator-activated
  receptor α to increase fatty acid β-oxidation and attenuate fatty acid accumulation.
  Meanwhile, calycosin suppresses gluconeogenesis via the Shp-mediated inhibition
  of phosphoenolpyruvate carboxykinase and glucose-6-phosphatase and increases the
  expression of glucose transporter 4 and phosphorylase insulin receptor substrate
  1/2 to promote glucose transport into cells and recover insulin sensitivity. Moreover,
  calycosin attenuates liver injuries and inflammation by down-regulating the TLR4-mediated
  nuclear factor kappa-B pathway and NOD-like receptor 3 inflammasome, reducing the
  risk of liver fibrosis via inhibiting hepatic stellate cell activation-induced extracellular
  matrix deposition. ACC—Acetyl-coenzyme A carboxylase; ECM—extracellular matrix;
  FASN—fatty acid synthase; FXR—farnesoid X receptor; G-6-pase—glucose-6-phosphatase;
  Glut-4—glucose transporter 4; HSC—hepatic stellate cells; NF-κB—nuclear factor kappa-B;
  NLRP3—NOD-like receptor 3; Pepck—phosphoenolpyruvate carboxykinase; p-IRS-1/2—phosphorylase
  insulin receptor substrate 1/2; PPARα—peroxisome proliferator-activated receptor
  α; SCD1—stearoyl-coenzyme A desaturase 1; Shp—small heterodimer partner; Srebp-1c—sterol-regulatory
  element binding protein 1c; and TLR4—toll like receptor 4. The red upward arrows
  indicate increases, the green downward arrows indicate decreases and the cross mark
  represents inhibition
