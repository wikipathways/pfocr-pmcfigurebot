figure_title: Transcriptome analysis of human monocytes exposed to uric acid in vitro
  and single-cell transcriptome analysis of arterial tissue in a mouse model of atherosclerosis.
caption: Transcriptome analysis of human monocytes exposed to uric acid in vitro and
  single-cell transcriptome analysis of arterial tissue in a mouse model of atherosclerosis.
  (A) Volcano plot of uric acid-induced differential genes in human monocytes, with
  tags labeling signature proinflammatory markers of M1 macrophages. (B) UAMP visualization
  of single-cell transcriptome data, with a representative cell type for each cluster
  for all combined time points (0, 8, 16, and 26 weeks). Vascular endothelial cell
  (EC), fibroblast (FC), smooth muscle cell (SMC), intermediate cell state (ICS),
  and SMC-derived intermediate cells (SEM). (C,E) The results of differential gene
  enrichment analysis of upregulated genes in isolated human monocytes induced by
  uric acid. KEGG enrichment analysis (C); GO biological pathway enrichment analysis
  (E). (D) Proportion of cell types at different time points. (F) Heatmap of correlations
  between weighted coexpression gene modules and molding time for the three macrophage
  subtypes. The colored narrow bands were used to distinguish between the different
  gene co-expression modules, and the colored wide bands indicate the correlation
  between the different gene modules and the atherosclerotic lesions. * p < 0.05;
  and *** p < 0.001. (G) Volcano plots of human monocytes exposed to uric acid in
  vitro and Hub gene network map of key gene modules. From left to right are the blue
  module of macrophage 2, the turquoise module of macrophage 2, and the turquoise
  module of macrophage 3
