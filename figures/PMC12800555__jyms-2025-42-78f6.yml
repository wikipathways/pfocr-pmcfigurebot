caption: Curcumin induces changes in the expression of glycolysis-related proteins
  and in pathways associated with prostate cancer cells. (A, C) After treatment with
  curcumin for 24 hours, the expression of glycolysis-related proteins and pathway-related
  proteins is assessed via western blot analysis. (B, D) Bar graphs showing the protein
  expression in A and C. Data are presented as the mean±standard deviation (n=3).
  GLUT1, glucose transporter type 1; PKM2, pyruvate kinase M2; HK2, hexokinase 2;
  GAPDH, glyceraldehyde-3-phosphate dehydrogenase; P-AKT, phosphorylated AKT; HIF-1α,
  hypoxia-inducible factor-1α. *p<0.05, **p<0.01 compared with the control (n=3)
