figure_title: Swertiamarin exerts multi-target neuroprotective effects through anti-neuro-inflammatory,
  antioxidant, and neuromodulatory mechanisms.
caption: 'Swertiamarin exerts multi-target neuroprotective effects through anti-neuro-inflammatory,
  antioxidant, and neuromodulatory mechanisms. (1) Anti-neuro-inflammatory: SW inhibits
  TLR4/PARP1/NF-κB signaling to reduce pro-inflammatory cytokines and suppresses microglia/astrocyte
  activation. (2) Antioxidant/Mitochondrial: SW demonstrates potent antioxidant activity
  by activating the Nrf2/HO-1/NQO1 pathway, upregulating sod-3/gst-4, reducing ROS,
  and enhancing mitochondrial complexes I-IV. (3) Anti-apoptotic: SW upregulates Bcl-2
  and downregulates Bax while inhibiting α-synuclein aggregation. (4) Neurotransmission:
  SW modulates neurotransmission by increasing tyrosine hydroxylase-positive (TH+)
  neurons and DA levels, inhibiting AChE and nAChRs, and regulating 5-HT2 receptors.
  (5) Disease-specific benefits include reducing α-synuclein in Parkinson’s disease
  (PD), inhibiting cholinesterase (ChE) in Huntington’s disease (HD), decreasing infarct
  volume in stroke, and enhancing GABA activity in epilepsy'
