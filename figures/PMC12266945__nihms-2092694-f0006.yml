figure_title: Clustering analyses unveil a distinct β cell hypersecretory response
  signature
caption: (A) Weighted gene co-expression network analysis (WGCNA) of the unfiltered
  transcriptomics dataset.(B) Module eigengene (ME) values for modules that have similar
  kinetics between SW and Tg (black), different kinetics (yellow), or opposite directional
  effects (royalblue and turquoise). Data are the mean ± SD of n = 3.(C) Directed
  network analysis of MEs with their top enriched ontology shown and colored by their
  kinetics and effect directions. Edges connecting the nodes are colored by positive
  (red) or negative (blue) correlation, and thickness indicates the magnitude of the
  correlation, with thicker edges showing stronger relationships.(D) Dirichlet process-Gaussian
  process (DPGP) clustering analysis.(E) UpSet plot comparison of all WGCNA modules
  and DPGP clusters. The overlap between SW_DPGP_cluster_3 and the royalblue module
  is highlighted in light blue. These two sets were merged and analyzed by GO biological
  process (inset).(F) Select genes for the ERAD pathway show differential expression
  dynamics between SW and Tg. Values shown are transcripts per million (TPMs) from
  RNA-seq data (N = 3).See also Figure S5
