figure_title: D2 action sustains the Notch signaling pathway
caption: |-
  (A) Volcano plot showing differences in the mRNA expression of qMuSCs from cD2KO and WT mice. Negative log10
  P value (y axis) and log2 fold change (x axis) are plotted for transcripts detected by RNA-seq analysis. The experiments were conducted on n = 3 biological replicates. Gray line indicates P value < 0.05. (B) The top upregulated pathways in Panther (Protein Analysis Through Evolutionary Relationships; http://www.pantherdb.org/). (C) The downregulated pathways in Panther. (D) mRNA levels of Notch receptors (Notch1–4) and Notch targets (HeyL, Hes2, and Rbpi) in freshly isolated qMuSCs by FACS. n = 6 WT and n = 6 cD2KO mice. (E) Western blot of cD2KO and WT qMuSCs freshly isolated by FACS. The graph on the right shows the quantification of N1ICD/tubulin. (F and G) ChIP-qPCR using THR-α and isotype IgG control antibodies on proximal enhancer and promoter regions of Notch2 and Notch3 genes, respectively, in C2C12 cells. Data are normalized to input chromatin; n = 3 biologically independent samples. (H) ChIP-qPCR using THR-α and isotype IgG control antibodies on proximal enhancer of Notch2 in freshly isolated MuSCs from WT, rT3-treated, and D2KO cells. Data are normalized to input chromatin; n = 3 biologically independent samples. (I) Mouse model used and diagram of in vivo rescue experiment. 2 independent experiments were conducted with n = 4 WT, n = 4 cD2KO, and n = 4 cD2KO-N1ICD mice each. (J) Representative IF of PAX7 (red) and MyoD (green) in TA muscle from indicated mice harvested 21 days after CTX injection. Scale bars: 50 μm. (K) The number of PAX7–MyoD+, PAX7+MyoD+, and PAX7+MyoD– cells per mm2. Bars represent the average of at least 3 technical replicates. n = 8 mice for each group. Data are presented as mean ± SEM; *P < 0.05, **P < 0.01, ***P < 0.001 using a 2-tailed Student’s t test when comparing 2 conditions and 2-way ANOVA when comparing multiple conditions
