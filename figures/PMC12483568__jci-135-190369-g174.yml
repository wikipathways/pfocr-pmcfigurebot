figure_title: Cyclophosphamide-induced leukopenia rescues ectopic calcification
caption: '(A) Experimental scheme for neutrophil depletion using cyclophosphamide
  (CPA) in WT rats treated with DHT p.o. + FeCl3 s.c. (B) Comparison of WBC count
  in PBS- and CPA-treated rats after DHT p.o. + FeCl3 s.c. administration (n = 5 animals
  per group). (C) Gross images of rat dermal tissue in PBS- and CPA-treated rats.
  Black arrowheads point to calcific regions. (D) Von Kossa–stained rat dermal tissue
  highlighting calcification in PBS- and CPA-treated rats given DHT p.o. + FeCl3 s.c.
  (representative images; arrowheads point to calcific regions; n = 4 animals per
  group). (E) Immunofluorescent staining of CD68+ cells in PBS- and CPA-treated rats
  and quantification (representative images; n = 4 animals per group). Scale bar:
  100 μm. (F) Immunofluorescent staining of myeloperoxidase (MPO) to identify neutrophils
  in PBS- and CPA-treated rats and quantification (representative images; n = 4 animals
  per group). Scale bar: 50 μm. (G) Immunofluorescence staining and quantification
  of CD3+ T cells in PBS- versus CPA-treated rats (n = 5 animals per group). Scale
  bar: 50 μm. (H) Alkaline phosphatase activity in rat dermal tissues in PBS- versus
  CPA-treated animals (n = 5 animals per group). (I) Serum alkaline phosphatase activity
  in rats treated with PBS or CPA (n = 5 animals per group). (J) Gene Ontology analysis
  associated with upregulated DEGs in PBS-treated (n = 4 animals) and CPA-treated
  rats following DHT p.o. + FeCl3 s.c. (n = 5 animals). (K) Enriched genes in immune
  response–regulating cell surface receptor signaling pathway. Data are represented
  as mean ± SEM. ***P < 0.001, ****P < 0.0001, 2-tailed Student’s t test'
