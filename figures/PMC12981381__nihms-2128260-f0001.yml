figure_title: Robust saccade modulation induced by optical stimulation of the FEF-SC
  pathway
caption: '(A) The retrograde viral vector was injected into the SC, from where it
  was transported retrogradely to the somata of SC-projecting neurons in the FEF.
  Optical stimulation was applied in the FEF.(B) Free-viewing task: macaques viewed
  movies and were rewarded for fixating within the display.(C) Optical stimulation
  during free-viewing. Stimulation trials (top) included a 0.1s optical pulse from
  a blue laser. Control trials (bottom) included a 0.1s non-stimulated period. Both
  were flanked by 2-3s non-stimulated periods.(D) Example FEF optical stimulation
  session showing saccades occurring in stimulation (left) and control (right) trials.(E)
  Example peri-stimulus time histogram (PSTH) of saccades in the stimulation (red)
  and control trials (black) during FEF optical stimulation (N=40 trials per condition).
  Upper raster shows time of saccade onsets in individual trials (both spontaneous
  and putatively stimulation-evoked). Lower histogram shows distributions of those
  onset times binned at 5ms intervals. Triangle: time of peak saccade occurrence (35ms).(F)
  Polar histograms of saccade directions in stimulation and control trials for both
  monkeys during FEF optical stimulation. The radial axis represents the proportion
  of saccades within each angular bin (width: 22.5°), normalized to the total number
  of saccades recorded during the 100ms interval under each condition for each monkey.(G)
  Population PSTH of saccades in stimulation and control trials for both monkeys during
  optical stimulation in the FEF. Triangles indicate the time of peak saccade occurrence
  for monkey R (red: 32.5ms) and monkey A (magenta: 27.5ms).(H) Delayed saccade task.
  In each trial, a target appeared in the left or right visual field, followed by
  a delay period of 0.8-1.2s. Then the fixation point disappeared, cueing the animal
  to saccade to the target location.(I) Example session showing eye movement traces
  for contralateral (top) and ipsilateral saccades (bottom) during optical stimulation
  (red) and control (black) trials. Reaction times: Contralateral, 122.9 ± 8.1ms [Mean
  ± S.E.M] for Stim vs. 154.4 ± 3.3ms for Control, p=7.45e-04; Ipsilateral, 170.4
  ± 5.7ms for Stim vs. 157.6 ± 5.7ms for Control, p=0.06; all N=20 trials.(J) Scatter
  plot of mean reaction times across sessions (N=20) for contralateral saccades in
  optogenetic Stim vs. Control trials. Filled Symbols: individual sessions with a
  significant difference between Stim and Control (p<0.05; Triangles: Monkey R; Squares:
  Monkey A. Inset: pooled comparisons [Mean ± S.E.M]. Reaction times were shorter
  for Stim (158.23 ± 7.81ms) than for Control (171.44 ± 6.89ms; p=0.0068).(K) Same
  but for ipsilateral saccades, which in both individual sessions and in the pooled
  data showed longer reaction times in Stim vs. Control trials. For inset, pooled
  data: Stim 176.43 ± 6.54ms vs. Control 166.04 ± 6.69ms; p=0.0084.See also Figure
  S1 and S2'
