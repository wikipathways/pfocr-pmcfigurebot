caption: Cell modeling and sequencing analysis. (a) Relative viability of HCAECs incubated
  for 24 h with different concentrations of OX-LDL (n = 3). (b) Relative viability
  of HCAECs incubated with 50 μg/mL of OX-LDL for 24, 48, and 72 h, respectively (n
  = 3). (c) Volcano and scatter plots of differential genes associated with coronary
  atherosclerosis analyzed by RNA sequencing (n = 3). Eight hundred and eighty-six
  upregulated genes and 330 downregulated genes including HTR2B and PI3KCG were shown.
  (d) KEGG analysis of pathway mechanisms associated with differential genes (n =
  3). (e) GO analysis of differential gene-related pathway mechanisms (n = 3). ⁣∗p
  < 0.05, ⁣∗∗p < 0.01, and ⁣∗∗∗p < 0.001
