figure_title: PSAP in Gaucher disease (GD).
caption: 'PSAP in Gaucher disease (GD). Gaucher disease (GD) is primarily caused by
  mutations in the GBA1 gene located at chromosome 1q21. This gene encodes the lysosomal
  enzyme β-glucocerebrosidase (GCase), which is responsible for hydrolyzing glucosylceramide
  (GluCer) into glucose and ceramide. The PSAP gene encodes the precursor protein
  prosaposin, which is proteolytically cleaved to generate Saposin C (Sap C), one
  of the four saposins. Sap C regulates GCase function through the following mechanisms:
  (1) stabilizing the GCase protein structure to prevent degradation; (2) disrupting
  the lipid organization of lysosomal membranes to promote GCase binding to anionic
  phospholipid-enriched membrane surfaces, thereby enhancing its catalytic activity;
  and (3) directly participating in the hydrolysis of the substrate GluCer. When PSAP
  gene mutations occur (e.g., p.Pro378Arg, c.1005+1G>A splice-site variant, or biallelic
  deletions), Sap C production is significantly reduced or completely absent, leading
  to the inability of GCase to effectively bind lysosomal membranes and subsequent
  loss of activity. This dysfunction not only causes abnormal accumulation of GluCer
  but also results in widespread deposition of other sphingolipid metabolites, such
  as lactosylceramide (LacCer) and globotriaosylceramide (Gb3). These lipid aggregates
  trigger the transformation of macrophages into “Gaucher cells” (lipid-laden macrophages),
  which infiltrate organs such as the liver, spleen, and bone marrow, leading to anemia,
  thrombocytopenia, and bone damage. Additionally, Sap C deficiency disrupts axonal
  membrane homeostasis in the nervous system, causing progressive loss of cerebellar
  Purkinje cells, axonal globoid degeneration, and motor deficits (e.g., ataxia).
  It also activates oxidative stress and neuroinflammatory pathways, accelerating
  Parkinson’s disease-like neurodegenerative pathology. Created with BioRender.com'
