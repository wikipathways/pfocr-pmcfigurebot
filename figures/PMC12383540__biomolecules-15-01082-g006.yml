figure_title: 'Localisation of Mura in S2 cells: (A) Notch-GFP and Mura-V5 show partial
  colocalisation when expressed in S2 cells.'
caption: 'Localisation of Mura in S2 cells: (A) Notch-GFP and Mura-V5 show partial
  colocalisation when expressed in S2 cells. (B) After the endocytic uptake of Anti-NotchECD
  labelled surface Notch, there is colocalisation between anti-ECD and GFP-tagged
  ICD, indicating the endocytic uptake of full-length Notch. MuraV5 does not colocalise
  with ECD but does overlap with ICD-GFP lacking anti-ECD staining. (C–E) Mura-V5
  does not colocalise with EYFP-tagged endosomal markers Rab5 (C), Rab7 (D), and Rab11
  (E). (F–I) Puncta of Mura colocalisation with ER marker, PDI (F), intermediate compartment
  marker COPII (G), cis-Golgi marker GM130 (H), and trans-Golgi marker Fringe-GFP
  (I) are indicated with arrows. White arrows in (A,B) indicate examples of Mura-V5
  colocalisation with Notch-GFP, yellow arrows in B indicate Notch anti-ECD localisation
  with Notch-GFP, white arrows in F-I indicate examples of Mura-V5 colocalisation
  with secretory pathway markers'
