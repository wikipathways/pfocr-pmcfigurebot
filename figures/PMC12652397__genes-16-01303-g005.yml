figure_title: Inflammation, Oxidative Stress, and RAAS Hyperactivation in CRS.
caption: 'Inflammation, Oxidative Stress, and RAAS Hyperactivation in CRS. Inflammatory
  and immune pathways are strongly upregulated in CRS, with transcriptomic profiles
  showing cytokine release, macrophage recruitment, leukocyte trafficking, and complement
  cascade activation. Oxidative stress markers such as myeloperoxidase and NADPH oxidase
  components further damage cardiac and renal tissue. Parallel proteomic studies demonstrate
  marked activation of RAAS, with renal ACE levels >20-fold higher and angiotensin
  II massively elevated, promoting vasoconstriction, fibrosis, and inflammatory signaling
  through AT1 receptors. Aldosterone excess exacerbates myocardial fibrosis and renal
  injury. These pathways intersect, as angiotensin II can stimulate TGFβ and ROS production,
  linking neurohormonal, inflammatory, and fibrotic mechanisms in CRS progression.
  Abbreviations: CRS, cardiorenal syndrome; RAAS, renin–angiotensin–aldosterone system;
  SNS, sympathetic nervous system; IL-6, interleukin-6; IL-1, interleukin-1; MCP-1,
  monocyte chemoattractant protein-1; TNFα, tumor necrosis factor alpha; ROS, reactive
  oxygen species; ATP, adenosine triphosphate;FN1, fibronectin-1; POSTN, periostin;
  SERPINE1, serpin family E member 1; TIMP-2, tissue inhibitor of metalloproteinases-2;
  IGFBP7, insulin-like growth factor-binding protein 7'
