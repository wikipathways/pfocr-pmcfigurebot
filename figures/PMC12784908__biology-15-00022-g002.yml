figure_title: Schematic representation of the methionine cycle pathway highlighting
  key metabolites, enzymes, and inhibitors.
caption: Schematic representation of the methionine cycle pathway highlighting key
  metabolites, enzymes, and inhibitors. The diagram illustrates the reversible reaction
  catalyzed by S-adenosylhomocysteine hydrolase (SAHH) and the inhibition of methionine
  adenosyl-transferase II alpha (MAT2α), a SAM-dependent methyltransferase (shown
  by flow symbol). Metabolites involved in the pathway shown in red include methionine,
  S-adenosylmethionine (SAM), S-adenosylhomocysteine (SAH), homocysteine, adenosine,
  ATP, inorganic phosphate (Pi), pyrophosphate (PP), tetrahydrofolate (THF), and 5-methyl-THF
  (5-CH3-THF) (flow symbol). Metabolic enzymes shown in green include 5′-nucleotidase
  (5-NT), adenosine kinase (ADK), SAHH (SAH hydrolase), EZH2 (histone methyltransferase),
  LSD1 (histone demethylase), MAT2α, and methionine synthase (MTR). Enzyme inhibitors
  shown in blue (block symbol) include 5′-iodotubercidin (5′-IT, ADK inhibitor), DZNep-HCl
  (SAHH inhibitor), and FIDAS-5 (MAT2α inhibitor)
