caption: 'Pathway and biological processes annotations and predicted regulators to
  signatures that differ between U1 cells with active replication following DA stimulation
  vs. cells that preserve latency. The comparison between cells transcribing HIV genes
  and cells that do not result in significantly increased and decreased gene signatures:
  (A) circos plot indicating main annotated pathways; (B) circos plot indicating main
  biological processes linked to gene signatures; (C) predicted regulators of upregulated
  genes; (D) predicted regulators of downregulated genes; (E–H) gene network interactions
  with consensus predicted regulators, where white nodes represent predicted regulators,
  pink nodes represent genes upregulated, and blue nodes indicate genes downregulated
  in correlation with active HIV transcription; (E) TP53-regulated gene signatures;
  (F) TNF-regulated genes; (G) IL10-regulated genes; and (H) IL4/IL13 regulated genes'
