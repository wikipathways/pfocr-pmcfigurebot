figure_title: Pathway enrichment analysis of histone phosphorylation-associated DEGs.
caption: Pathway enrichment analysis of histone phosphorylation-associated DEGs. (A)
  KEGG pathways enriched for upregulated histone phosphorylation-linked DEGs in the
  duodenum at D7, highlighting immune and metabolic regulation (e.g., MAPK, ErbB,
  PPAR, Toll-like receptor, and necroptosis pathways) alongside stress-responsive
  processes (C-type lectin receptor, NOD-like receptor, and adipocytokine signaling).
  (B) Pathways associated with downregulated histone phosphorylation-related DEGs,
  predominantly involving genomic stability mechanisms (p53 signaling, mismatch/base
  excision/nucleotide excision repair, homologous recombination) and cell cycle regulation
  (spliceosome, DNA replication, cellular senescence). (C–J) present the histone phosphorylation-related
  genes in the signaling pathways of cell cycle, necroptosis, NOD-like receptor, apoptosis,
  MAPK, ErbB, and PPAR respectively. DEG, differentially expressed genes
