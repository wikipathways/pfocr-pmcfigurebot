caption: RET-altered malignancies initially respond to selective RET inhibitors such
  as selpercatinib and pralsetinib; however, resistance frequently develops through
  multiple mechanisms. On-target resistance arises from secondary RET mutations, including
  solvent-front mutations (e.g., RET G810 substitutions) and gatekeeper mutations
  (e.g., RET V804M/L), which reduce inhibitor binding and efficacy. Off-target resistance
  occurs through activation of bypass signaling pathways, such as MET amplification,
  EGFR pathway activation, or mutations in downstream effectors including KRAS and
  NRAS, enabling continued tumor growth despite RET inhibition. Histologic and phenotypic
  transformation, including transformation from non–small cell lung cancer (NSCLC)
  to small cell lung cancer (SCLC) or epithelial-to-mesenchymal transition, may also
  contribute to therapeutic resistance. Emerging strategies to overcome resistance
  include the development of next-generation RET inhibitors and rational combination
  therapies targeting bypass signaling pathways. Comprehensive molecular profiling
  using DNA- and RNA-based next-generation sequencing (NGS) is critical for identifying
  resistance mechanisms and guiding precision treatment strategies
