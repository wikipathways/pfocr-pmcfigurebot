caption: cyclic adenosine monophosphate (cAMP)/protein kinase A (PKA)/cAMP-response
  element-binding protein (CREB) and brain-derived neurotrophic factor (BDNF) signaling
  pathways involved in synaptic plasticity. Synaptic activity triggered by glutamate
  release activates ionotropic receptors-AMPA (α-amino-3-hydroxy-5-methyl-4-isoxazolepropionic
  acid), NMDA (N-methyl-D-aspartate), and kainate-as well as GPCRs (G-protein-coupled
  receptors), leading to membrane depolarization and calcium ion (Ca2+) influx. GPCR
  stimulation enhances cAMP production via adenylyl cyclase (AC), activating PKA,
  which phosphorylates CREB. In parallel, BDNF binding to tropomyosin receptor kinase
  B (TrkB) receptors activates mitogen-activated protein kinase (MAPK)/extracellular
  signal-regulated kinase (ERK), phosphoinositide 3-kinases (PI3K)/AKT, and phospholipase
  C gamma (PLCγ) pathways, which also converge on CREB. Activated CREB drives transcription
  of genes essential for synaptic plasticity, including BDNF itself. These signaling
  cascades regulate key processes such as synapse strengthening, calcium homeostasis,
  neurotransmission and neuronal survival. Created in BioRender. Tomczak, J. (2025)
  https://BioRender.com/mt2mtgo
