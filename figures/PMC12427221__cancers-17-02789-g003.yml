figure_title: Activation of NOTCH3 was driven by diminished estrogen in GC with depression.
caption: Activation of NOTCH3 was driven by diminished estrogen in GC with depression.
  (A) Venn diagrams displaying the overlap between DEGs in TCGA-STAD (orange) and
  depression-related genes from PDX model treated by CUS (blue). (B) Heatmap of the
  213 overlapped DEGs in the tumor tissues from mice with and without CUS treatment.
  (C) GO enrichment analysis of the 213 overlapped DEGs. (D) KEGG pathway enrichment
  analysis of the 213 overlapped DEGs. (E) Comparison of NOTCH3 expression between
  female and male TCGA-STAD patients. (F,G) Tumor microenvironment cell composition
  grouped by ESR1 and ESR2 expression in TCGA-STAD (TIMER 2.0 database). (H) Serum
  estradiol levels in mice with and without CUS treatment (n = 4). (I,J) Histological
  analysis and NOTCH3 expression in tumor tissues from mice with and without CUS treatment
  (scale bar = 50 μm, n = 4). (K–M) Investigation of the effects of estradiol (E2)
  on NOTCH3 mRNA and protein levels in GC cell lines with RT-qPCR (n = 3), Western
  blotting assays and IF staining (10 nM for 24 h, scale bar = 50 μm). * p < 0.05,
  ** p < 0.01, *** p < 0.001, **** p < 0.0001
