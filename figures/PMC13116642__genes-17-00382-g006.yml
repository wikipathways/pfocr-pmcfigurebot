figure_title: HCA-based expression profile clustering and KEGG pathway enrichment
  of DEGs in mesocotyls of rice plants sown at different depths.
caption: 'HCA-based expression profile clustering and KEGG pathway enrichment of DEGs
  in mesocotyls of rice plants sown at different depths. (Left): Co-expression patterns
  of the genes in the five modules. Clusters of genes associated with similar biological
  processes are grouped according to the degree of enrichment, as indicated on (Right).
  The red, orange, blue, purple, and green bars correspond to the genes enriched in
  the five modules. Each column within the sowing depth regions corresponds to a different
  sowing depth. The red and blue boxes indicate genes with increased and decreased
  abundances, respectively. W3, W5, and W7 represent sowing depths of 3, 5, and 7
  cm, respectively'
