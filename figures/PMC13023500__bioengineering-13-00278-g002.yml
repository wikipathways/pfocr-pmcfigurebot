figure_title: Interactions between bioresorbable scaffold materials and NET formation.
caption: 'Interactions between bioresorbable scaffold materials and NET formation.
  Dual-panel schematic comparing immune interactions of polymeric and metallic scaffolds.
  (Left Panel) (Polymeric Scaffolds-PLLA/PDLLA): Surface hydrophobicity → protein
  adsorption (fibrinogen, complement) → neutrophil adhesion via integrin receptors
  → ROS generation → NETosis; Degradation pathway: ester hydrolysis → lactic acid
  + oligomers → crystalline residues → macrophage/neutrophil activation → inflammatory
  amplification; Acidic microenvironment effects on local pH and neutrophil function.
  (Right Panel) (Magnesium-Based Scaffolds): Corrosion reaction (Mg + 2H2O → Mg(OH)2
  + H2) → Mg2+ ion release → potential neutrophil modulation; Hydrogen gas bubble
  formation → mechanical disruption; Hydroxide layer formation → pH increase → alkaline
  microenvironment effects. Central Convergence: Both pathways lead to NET release,
  platelet aggregation, coagulation activation, and immunothrombosis'
