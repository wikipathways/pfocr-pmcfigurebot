figure_title: Schematic representation of the molecular pathways involved in the synergistic
  apoptotic effect of quercetin and doxorubicin in MG-63 osteosarcoma cells.
caption: 'Schematic representation of the molecular pathways involved in the synergistic
  apoptotic effect of quercetin and doxorubicin in MG-63 osteosarcoma cells. This
  diagram illustrates how Q and Dox collaboratively induce oxidative stress and mitochondrial-mediated
  apoptosis. Quercetin increases intracellular ROS, leading to mitochondrial dysfunction
  and cytochrome c release. This promotes apoptosome formation through Apaf-1 and
  triggers the caspase cascade via caspase-9 and caspase-3, culminating in apoptosis.
  Doxorubicin contributes to this process by activating the p53 pathway, which amplifies
  the apoptotic signal. This Figure summarizes the key molecular interactions confirmed
  in this study through qPCR, ROS assays, and caspase activity analysis. Apaf-1: Apoptotic
  Protease Activating Factor 1; p53: Tumor Protein p53; ROS: reactive oxygen species'
