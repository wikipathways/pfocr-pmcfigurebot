figure_title: Shared transcriptional and pathway programs across organs in response
  to high salt diet-induced hypertension
caption: A. Venn diagrams show overlap of DEGs across cortex, medulla, liver, and
  heart at each time point (days 7, 14, 21, and 35). Each segment displays the number
  of unique and shared DEGs. Genes shared by all tissues are highlighted in center.
  B. Heatmap of common 44 DEGs genes across all tissues on day 7. C. Bar plot showing
  significant Hallmark pathways emerged in the analysis of day 7 common genes. D.
  STRING-derived protein-protein interaction (PPI) network of common day 7 genes,
  with modules annotated by top enriched Hallmark terms per Louvain clustering. E.
  Circos plot showing high-confidence TF–target interactions for day 7 common genes,
  where outer sectors represent TFs and targets, colored by average log2FC. Directional
  links denote regulatory interactions. F–H. Heatmaps of common DEGs at days 14, 21,
  and 35. I. Hallmark pathways emerged for D35 common genes. CX, cortex; MD, medulla;
  LV, liver; HR, heart; D7, day 7; D14, day 14; D21, day 21; and D35, day 35 time
  points. adj. p indicated adjusted P value. n = 6 male rats per group
