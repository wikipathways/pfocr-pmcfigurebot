figure_title: Top five pathways affected by ZNF16 depletion
caption: 'U2OS cells were transfected with siControl or siZNF16-E siRNAs and gene
  expression was measured by RNA-seq. (A) Volcano plot showing the 2883 significantly
  differentially expressed genes represented by their expression change (logFC) vs
  the significance of the change (−log10(adjPVal)). Upregulated genes are shown in
  red and downregulated genes in blue. (B) Graph showing the top five pathways associated
  with ZNF16 depletion based on pathway overrepresentation (pORA) and total pathway
  accumulation (pAcc). Each pathway is represented by a single bubble and the size
  of the bubble is proportional to the size of the pathway it represents. Abbreviations:
  FA = Focal adhesion, CCRI = Cytokine-cytokine receptor interaction, ECM = extracellular
  matrix-receptor interaction, HPVI = Human papillomavirus infection, PC = pathways
  in cancer. (C) Chord diagram of the top 10 differentially expressed genes in the
  five pathways. Each pathway is represented by a different chord color as shown in
  the legend. Changes in gene expression (log2FC) are depicted in red-blue as shown
  in the legend'
