figure_title: KEGG pathway enrichment of differential metabolites across comparisons
  of developmental stages in Coprinus comatus.
caption: 'KEGG pathway enrichment of differential metabolites across comparisons of
  developmental stages in Coprinus comatus. Significantly different abundant metabolites
  (DAMs; p < 0.05; |log2FC| ≥ 1) from each pairwise contrast were subjected to KEGG
  over-representation analysis. (A) JTGZ vs. JGTX: ether lipid metabolism; cyanoamino-acid
  metabolism; biosynthesis of amino acids; porphyrin metabolism; D-amino-acid metabolism;
  glycerophospholipid metabolism; ABC transporters; arginine biosynthesis; and aminoacyl-tRNA
  biosynthesis. (B) JTGD vs. JTGZ: pentose phosphate pathway; citrate cycle (TCA cycle);
  glycerophospholipid metabolism; α-linolenic acid metabolism; and tyrosine metabolism.
  (C) JTGD vs. JGTX: tyrosine metabolism; tryptophan metabolism; carbapenem biosynthesis;
  biosynthesis of amino acids; and glycerophospholipid metabolism'
