figure_title: SUL suppresses neuronal damage by suppressing the MAPK signaling pathway
  following I/R.
caption: 'SUL suppresses neuronal damage by suppressing the MAPK signaling pathway
  following I/R. (A) Volcano maps showing the DEGs in the brain of MCAO/R rats treated
  with and without H-SUL (n = 3). (B) KEGG enrichment analysis showing significant
  enrichment of various signaling pathways in MCAO/R rats treated with and without
  H-SUL (n = 3). (C) GSEA analysis shows that SUL can downregulate the MAPKs signaling
  pathway (n = 3). (D) GO analysis showing the significant enrichment of various cellular
  components and cell biological processes in MCAO/R rats treated with and without
  H-SUL (n = 3). (E-H) Immunoblot analysis of p-ERK, ERK, p-JNK, JNK, p-p38 and p38
  in the cerebral cortex of MCAO/R rats treated with the indicated doses of SUL or
  vehicle (n = 3). (I-L) Immunoblot analysis of p-ERK, ERK, p-JNK, JNK, p-p38 and
  p38 in SH-SY5Y treated with the indicated doses of SUL (0.1, 1, 10 μM) or vehicle
  (n = 3). (M) MTT results showed the effect of H-SUL on the activity of OGD/R-treated
  SH-SY5Y cells in the presence of MAPK inhibitors SB203580 (SB, 5 μM), SP600125 (SP,
  10 μM), and PD98059 (PD, 20 μM) (n = 3). Data are expressed as mean ± SEM. Statistics:
  one-way ANOVA followed by Tukey''s test. ###p < 0.001 vs. control; *** p < 0.001,
  **p < 0.01, *p < 0.05vs. MCAO/R group or OGD/R group'
