figure_title: Activation of MAPK signaling induces high rates of conversion in the
  absence of mutant RAS
caption: '(A) Diagram depicting the expected results of adding PMA, a small-molecule
  activator of the MAPK pathway, on MAPK signaling levels and conversion.(B) Schematic
  depicting the replacement of viral transduction of RAS oncogene with small-molecule
  PMA to activate MAPK signaling.(C) Representative images of immunofluorescent staining
  for ppERK in cells fixed 20 min after treatment with either a vehicle control (DMSO)
  or 100 nM PMA. Scale bars, 100 μm.(D and E) Total number of HyperP cells at 4 dpi
  (D) and conversion yield at 14 dpi (E) with 100 nM PMA treatment for conditions
  without RAS. Mean is shown with 95% confidence interval; marker style denotes biological
  reps; n = 3 or 4 biological reps per condition; t test independent samples.(F and
  G) Total number of HyperP cells at 4 dpi (F) and conversion yield at 14 dpi (G)
  with 100 nM PMA treatment for conditions with polycistronic cassettes containing
  HRASG12V. Mean is shown with 95% confidence interval; marker style denotes biological
  reps; n = 3 or 4 biological reps per condition; t test independent samples.(H) Diagram
  depicting the expected results of adding PMA in combination with an MEK inhibitor
  to test whether the effects of PMA are specific to the MAPK pathway.(I) Conversion
  yield quantified at 14 dpi for cells infected with NIL SNAP-DD and treated with
  combinations of 0 nM or 100 nM PMA to activate MAPK signaling and 0 μM, 0.1 μM,
  or 1 μM of MEK inhibitor (PD0325901) to inhibit MAPK signaling. Small molecules
  were added to the media beginning at 1 dpi. Mean is shown with 95% confidence interval;
  marker style denotes biological reps; n = 4 biological reps per condition; t test
  independent samples.Significance summary: p > 0.05 (ns); *p ≤ 0.05; **p ≤ 0.01;
  ***p ≤ 0.001; and ****p ≤ 0.0001'
