caption: Differential gene expression profiles and their functions. (A) Heat map of
  gene expression related to groups M and GL in the Cytokine-cytokine receptor interaction
  pathway. (B) Heatmap of gene expression related to groups M and GL in the NOD-like
  receptor signaling pathway. (C) Heatmap of gene expression related to groups M and
  GL in the Toll-like receptor signaling pathway. (D) Heatmap of related gene expression
  in the M and GL groups in the NF-κB signaling pathway. (E) Heatmap of gene expression
  related to groups M and GL in the IL-17 signaling pathway. (F) On the 5th day, the
  pathways were significantly enriched in the M and LS groups. (G) On the 5th day,
  pathways were significantly enriched in the M and GB groups. (H) On the 5th day,
  the pathways were significantly enriched in the M and GL groups. (I) GSEA analysis
  of all genes in the M and GL groups. The circled red box indicates the same content,
  the red font indicates the pathway we are concerned about
