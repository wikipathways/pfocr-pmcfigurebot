figure_title: CRABP2 and FABP5 opposite pathways upon RA binding.
caption: CRABP2 and FABP5 opposite pathways upon RA binding. RA is transported to
  the nucleus by CRABP2 and binds to retinoic acid receptor α (RARα), forming heterodimers.
  This classical RA pathway leads to gene expression that inhibits cell growth. Alternatively,
  RA can be transported by FABP5 to non-classical receptors, such as PPARβ/δ, activating
  non-genomic pathways that promote cell proliferation and inhibit apoptosis. Created
  in BioRender. Kakouratos, C. (2025) https://BioRender.com/qxxrpl6. Adapted from
  Gupta et al. [63]
