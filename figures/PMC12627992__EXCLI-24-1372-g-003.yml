figure_title: 'Effects of PN on apelin signaling pathway. A) Bar graph displaying
  the top ten significantly enriched KEGG pathway networks based on upregulated DEGs
  in the PN-treated group compared to the LPS group. The x-axis represents significance
  (-log10 p-value). B) PPI analysis illustrating gene interactions related to the
  apelin signaling pathway among DEGs in PN-treated conditions. Purple-colored nodes
  indicate significant DEGs directly associated with the apelin signaling pathway,
  while grey-colored nodes represent closely linked genes within the pathway. The
  top enriched functional networks within the apelin signaling pathway are shown in
  the following bar plots: C) Cell development, proliferation, and differentiation-associated
  network; D) Inflammatory response-associated network; E) Synaptic function-associated
  network. The color code represents significance (-log10 p-value) of enriched terms,
  while the x-axis refers to number of interacting genes within each term. F) mRNA
  expression levels of Apln and its receptor Aplnr as determined by real-time qPCR
  (n = 4~). *p < 0.05, **p < 0.01, ****p < 0.001, by one-way ANOVA followed by Dunnett''s
  post hoc test'
