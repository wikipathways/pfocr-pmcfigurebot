figure_title: TLR9 pathway activation in rat cortex.
caption: TLR9 pathway activation in rat cortex. (a) Western blotting to detect TLR9,
  MyD88 in cortical tissue; β-Tubulin as the internal reference protein (b,c) Quantified
  TLR9, MyD88 expression. (d) Western blotting to detect BDNF, NMDAR, and SYN1 in
  cortical tissues; β-Tubulin was used as the internal reference protein. (e–g) The
  quantitative analysis of NMDAR, SYN1 and BDNF. * p < 0.05, ** p <0.01, *** p <0.001.
  The bar graphs represent the normalized quantification results. Symbols such as
  ■, ●represent individual samples within each group. Statistical analysis was performed
  using an independent samples t-test
