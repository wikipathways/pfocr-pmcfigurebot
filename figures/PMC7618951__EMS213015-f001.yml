figure_title: An arrayed full-genome CRISPR-Cas9 screen reveals host gene dependencies
  for multiple parameters of a C. parvum infection
caption: (A) Schematic of the arrayed full-genome CRISPR-Cas9 screen. HCT-8 cells
  expressing Cas9 were seeded into wells containing guide CRISPR RNAs (crRNAs). Each
  well contained four guides targeted to a single gene in the human genome. Three
  days later, cells were infected with C. parvum, followed by fixation 49 h post-infection.
  Cells were immunostained to detect all parasites, females, host actin, and nuclei
  and then imaged at three z stacks 3 μm apart to effectively capture host nuclei,
  actin pedestals beneath parasite vacuoles, and apically located intracellular Cryptosporidium.
  Scale bar, 20 μm; inset, 5 μm.(B–D) (B) Rank-ordering of all genes in the screen
  based on the effect of their knockout on parasite growth, (C) development of the
  female sexual stages, and (D) recruitment of host actin to “pedestals” beneath the
  parasite vacuole. Rank-ordering was based on median Z scores of three replicates
  per gene.(E) Representative examples of groups of genes in the same protein complex
  or pathway with significant Z scores in at least one parameter. Z scores for each
  replicate in each parameter are depicted as a heatmap
article_title: The essential host genome for Cryptosporidium survival exposes metabolic
  dependencies that can be leveraged for treatment
