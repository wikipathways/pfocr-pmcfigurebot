figure_title: Manipulation of pigmentation enzymes have unexpected effects on dopamine
caption: (A) Drosophila dopamine metabolism pathway. Gene names encoding pigmentation
  enzymes are in blue and metabolites are in black. (B-D) Thorax phenotypes observed
  upon knockdown of Tyrosine hydroxylase (TH, also known as Pale) (C) and Dopa decarboxylase
  (Ddc) (D) compared to control (B). (E-E’) Dopamine levels, measured using HPLC,
  from the heads (E) and brains (E’) upon knockdown of TH and Ddc. Pigmentation phenotypes
  observed mutant alleles in the thorax (F-L) and the body (F’-L’) (Arrow in I’ indicates
  the darker region characteristic of speck mutants). T2A-GAL4 alleles for black,
  speck, and tan adult brain expression with dopaminergic neurons (DAN) staining in
  magenta (DANs) (M-P). (Q) Dopamine, measured using HPLC, in the heads of classical
  pigmentation mutants, black1, ebony1, straw1, and yellow1. (R) Dopamine levels in
  dissected brains of classical pigmentation mutants. Ordinary one-way ANOVA test
  with Dunlett multiple comparisons test. *=p<0.05, **=p<0.01, ***=p<0.001, ****=p<0.0001.
  Error bars show standard deviation (SD)
article_title: RNAi-based screen for pigmentation in Drosophila melanogaster reveals
