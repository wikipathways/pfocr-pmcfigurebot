caption: 'Mechanistic study of paclitaxel, cephalomannine, and their combination in
  regulating MDA-MB-231 cell death via activation of the pyroptosis pathway (A–H).
  Western blot analysis of NLRP3, Caspase-1, GSDMD and IL-18 protein expression (A).
  Quantification of relative NLRP3 expression (B). Quantification of relative Caspase1
  expression (C). Quantification of cleaved-GSDMD/GSDMD expression ratio (D). Quantification
  of intracellular IL-18 expression (E). ELISA results of extracellular IL-18 levels
  (F). ELISA results of extracellular IL-1β levels (G). ELISA results of extracellular
  TNF-α levels (H). Data are expressed as mean ± standard deviation (SD) from biological
  replicates (n = 3). ** p < 0.01 vs. Con, * p < 0.05 vs. Con, ## p < 0.01 vs. P1,
  # p < 0.05 vs. P1, && p < 0.01 vs. C1, & p < 0.05 vs. C1'
