figure_title: Genes in the Alox5 pathway.
caption: Genes in the Alox5 pathway. (A) Beta-catenin is a downstream gene of Alox5.
  Bone marrow GFP+Lin−c-Kit+Sca-1+ cells were sorted by FACS from recipients of GFP
  vector- or BCR-ABL-transduced bone marrow cells from wild type or Alox−/− donor
  mice for isolation of total RNA. Expression of beta-catenin was detected by RT-PCR.
  (B) Gene expression changes between wild type and Alox5−/− LSCs. BM cells from C57BL/6
  (B6) or Alox5−/− mice were transduced with BCR-ABL-GFP, and then transferred into
  B6 mice. At day 14 post BM transplantation, BM cells from CML mice were sorted by
  FACS for GFP+Lin−Sca-1+c-Kit+cells, and total RNA was isolated for DNA micorarray
  analysis. The significantly altered genes associated with apoptosis, cell cycle
  control and proliferation of cells are listed
