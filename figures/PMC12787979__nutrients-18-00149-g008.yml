caption: Relationship between miR-144-5p and miR-19a-3p and the inflammasome pathway.
  Molecular interaction between the miRNAs and their targets with the inflammasome
  obtained from IPA software. The direct targets for miR-144-5p and miR-19a-3p are
  indicated in green color. Predicted gene regulation is shown in orange (upregulation)
  or blue colors (downregulation) by MAP analysis. The green color refers to the effect
  of the miRNAs on their target genes. Molecules are shown according to their cell
  distribution. Direct and indirect molecular interactions are displayed as whole
  lines and dotted lines. Gray and yellow lines refer to low predictive power and
  inconsistent findings, respectively
