figure_title: Conformational changes upon NBD dimerization enable substrate release.
  See also Figures S2–S4
caption: (A) Global conformational changes upon NBD dimerization as viewed from the
  cytoplasm. Superposition of NBD1 in the NBD-separated (white) and NBD-dimerized
  (colored) conformations. The arrow indicates the movement of NBD2. (B) Local conformational
  changes in the NBDs upon NBD dimerization. Superposition of NBD1 and NBD2 individually
  in the NBD-separated (white) and NBD-dimerized (colored) conformations. The D-loop
  is highlighted and the arrow indicates movement of the D-loop to interact with ATP
  in the degenerate site. (C) Zoom-in view of the degenerate nucleotide-binding site
  in NBD1. Hydrogen bonds are represented as dashed lines. (D-E) The TAP translocation
  pathway in the 9-mer peptide-bound inward-facing (D) or outward-facing (E) conformation
  as viewed from the ER lumen. The helices of TAP are numbered and shown as colored
  cartoon tubes. The main chain backbone of the peptide substrate is shown as silver
  sticks. The N-pocket and C-pocket are boxed as indicated and residues that comprise
  each pocket are shown as sticks. (F) Superposition of the TAP translocation pathway
  in the inward-facing peptide-bound (silver) and outward-facing (colored) conformations.
  Arrows indicate movement of the TAP helices. (G-H) Superposition of the N- (G) and
  C- (H) pocket of the TAP substrate-binding site as shown in (D). The main chain
  of the peptide substrate is represented as silver sticks and numbered by alpha-carbon.
  TAP residues important for interacting with substrate are shown as sticks and hydrogen
  bonds are shown as dashed lines. Arrows indicate movement of TM3 upon NBD dimerization
article_title: Nucleotide-dependent conformational changes direct peptide export by
  the transporter associated with antigen processing
