figure_title: The Effect of 6,7DH-4MC on MAPK Phosphorylation in MDI-Induced 3T3-L1
  Adipocytes.
caption: 'The Effect of 6,7DH-4MC on MAPK Phosphorylation in MDI-Induced 3T3-L1 Adipocytes.
  The expression levels of phosphorylated and total MAPK pathway proteins were analyzed
  by Western blotting in MDI-induced 3T3-L1 adipocytes treated with EGCG (10 μM) or
  6,7DH-4MC (25, 50, 100 μM). (a) Western blot images of phosphorylated ERK1/2 (P-ERK),
  p38 MAPK (P-p38), and JNK (P-JNK), along with their respective total protein levels
  (ERK, p38, JNK). (b) Quantification of P-ERK/ERK expression. MDI significantly increased
  P-ERK levels (# p < 0.001), while EGCG and 6,7DH-4MC reduced these levels in a dose-dependent
  manner. (c) Quantification of P-p38/p38 ex-pression. P-p38 levels were markedly
  increased by MDI (# p < 0.001) and significantly reduced by 6,7DH-4MC, especially
  at 100 μM. (d) Quantification of P-JNK/JNK expression. MDI-induced P-JNK levels
  showed minimal inhibition by EGCG and 6,7DH-4MC. Protein band intensities were quantified
  using ImageJ and normalized to total protein levels. Untreated cells were set as
  100%. Data represent mean ± SD from three independent experiments, with statistical
  significance indicated as follows: # p < 0.001 compared to the untreated control,
  ** p < 0.01, *** p < 0.001 compared to the MDI-treated group'
