figure_title: Molecular docking sites for fentanyl in Kv10.1 (KCNH1), Kv10.2 (KCNH5)
  and Kv11.1 (KCNH2), predicted by AutoDock-Vina
caption: A, side view of Kv10.1, with S463 at the base of the pore a-helix and Y491
  at the top of S6 coloured in blue. Fentanyl predicted to dock within the rings formed
  by these two residues contributed by each of the four subunits (left panel). A top-down
  view of this predicted Kv10.1-fentanyl docked structure through the K+ selectivity
  filter (coloured in blue) shows the central piperidine ring of fentanyl, which is
  slightly electropositive, directly centred beneath the K+ selectively filter, in
  position to displace a focally coordinated K+ ion (right panel). B, side view of
  Kv10.2, with T432 at the base of the pore α-helix and Y460 at the top of S6 coloured
  in blue. Fentanyl predicted to dock below the ring formed by Y460, and in many conformations,
  consistent with its lower blocking ability for this EAG subtypes. C, side view of
  Kv11.1, with S624 at the base of the pore α-helix and Y652 at the top of S6 coloured
  in blue. Fentanyl predicted to dock within the rings formed by S624 and Y652, similar
  to Kv10.1. In addition, the phenylethyl ring of fentanyl is predicted to be aligned
  within 3.6–3.7 Å in close parallel orientation to the phenolic ring of Y652 (yellow
  circle), predictive of a strong stacked p-orbital interaction. These features of
  the predicted docking site may underlie the higher observed blocking ability of
  fentanyl for Kv11.1 and Kv11.3. Fentanyl is also predicted to dock asymmetrically
  relative to the central ion conduction pathway, similar to astemizole (Miyashita
  et al., 2024) (right panel). See Methods for details of docking methods. Ribbon
  representations of only two subunits displayed in the left panels for clarity
