figure_title: Molecular mechanism of lncRNA regulating macrophage function.
caption: 'Molecular mechanism of lncRNA regulating macrophage function. In the figure,
  solid arrows indicate activation or promotion; T-shaped arrows represent inhibition;
  dashed boxes denote key affected indicators; double wavy lines represent double-stranded
  DNA. (A) Regulation of polarization: lncRNA-MRGPRF-6:1 and lncRNA-AFAP1-AS1 promote
  pro-inflammatory M1 polarization via activating the TLR4/MyD88/MAPK signaling axis,
  while the STAT3/lncRNA-M2 axis induces anti-inflammatory M2 polarization through
  the PKA/CREB pathway. (B) Regulation of inflammation: lncRNA HOTAIR drives macrophage
  inflammation via the PTEN/HIF-1α/NF-κB axis; lncRNA H19 amplifies NF-κB-mediated
  inflammation by inhibiting the ABCA1/PPARα/PGC-1α axis; lncRNA MERRICAL upregulates
  the expression of chemokines CCL3 and CCL4 through the MLL1/WDR5 complex, exacerbating
  inflammatory infiltration. (C) Regulation of apoptosis: lncRNA MAARS induces macrophage
  apoptosis by inhibiting the nucleocytoplasmic shuttling of HuR protein, while lncRNA
  SIMALR promotes apoptosis via the HIF-1α/NIT1 signaling pathway, participating in
  inflammatory resolution. (D) Regulation of foam cell formation: lncRNA GAS5 acts
  as a ceRNA to sponge miR-145-5p, and lncRNA Al662270 directly upregulates ABCA1
  expression, jointly modulating cholesterol efflux and macrophage foam cell formation.Created
  in BioRender. Jingyue_Wei. (2026) https://app.biorender.com/illustrations/69be4ddacd6bc4537ef26b17
  (accessed on 10 February 2026)'
