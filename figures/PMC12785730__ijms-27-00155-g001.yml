figure_title: Neutrophils, NETs, and anesthesia.
caption: Neutrophils, NETs, and anesthesia. Propofol exerts inhibitory effects. It
  blocks formyl peptide receptor-1 (FPR1) on the neutrophil surface and inhibits the
  ERK/MAPK pathway, leading to reduced downstream MPO-derived HOCl production [107,111].
  Sevoflurane attenuates neutrophil activation by blocking chemokine receptor 2 (CXCR2)
  (IL-8 receptor) and reducing β2-integrin (CD11b) expression, resulting in less neutrophil
  adhesion/recruitment and a smaller oxidative burst (lower ROS output) [96]. Lidocaine,
  administered intravenously, decreases ROS generation, PAD4 activation, and histone
  H3 citrullination [115]. Dexmedetomidine inhibits TLR2/NF-κB/NLRP3 pathway activation
  and the subsequent production of ROS [119]. Ketamine reduces ROS levels in a nonspecific
  and not yet fully understood manner [98]. It also decreases IL-8 expression, thereby
  contributing to both the direct and indirect inhibition of PAD activity [98,127].
