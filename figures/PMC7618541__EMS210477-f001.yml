figure_title: MTHFD1 enzymatic functions influence adenosine dependency or toxicity
caption: (A) Schematic overview of the folate cycle and cellular purine synthesis
  pathway. Corresponding folate intermediates are generated by the enzymatic functions
  of the MTHFD1 synthetase (S), cyclohydrolase (C) and dehydrogenase (D) domains.
  10-CHO-THF is used for the synthesis of inosine monophosphate (IMP) through the
  purine de novo synthesis pathway. Alternatively, IMP can be synthesized through
  the salvage pathway in the presence of exogenous adenosine (Ado). The schematic
  domain structure of MTHFD1 is shown below with sites of K56R and K386E mutations
  that ablate the enzymatic reactions of the respective domain. (B) Normalized cell
  counts of WT, MTHFD1KO, MTHFD1K386E, and MTHFD1K56R cells grown for 72 h in media
  containing dialyzed serum (DIA) or dialyzed serum supplemented with 50 µM adenosine
  (ADO). Values are normalized to the respective clone grown in media containing full
  serum (FULL) (n = 3 biological replicates, mean ± SD, *P < 0.05). (C) Normalized
  cell counts of WT and MTHFD1K56R cells at indicated concentrations of adenosine.
  Cells were cultured in DIA supplemented with respective adenosine concentrations
  for 72 h. (n = 2 biological replicates, mean ± SD). (D) Normalized cell counts of
  MTHFD1K56R cells cultured at indicated media conditions and with supplemented nucleotides
  and precursors (50 µM) (n = 3 biological replicates, mean ± SD, ****P < 0.0001).
  Guo – guanosine, Cyd – cytidine, Urd – uridine, Thy – thymidine, AICAR - 5-aminoimidazole-4-carboxamide
  ribonucleotide, dCTP – deoxycytidine triphosphate, dGTP – deoxyguanosine triphosphate,
  dATP – deoxyadenosine triphosphate, dUTP – deoxyuridine triphosphate, dTTP – deoxythymidine
  triphosphate. (E) Representative cell cycle plots for WT and MTHFD1 mutant HAP1
  cells in DIA and ADE conditions. (F) Representative images of γH2A.X and RPA2 staining
  of MTHFD1K56R cells with adenosine supplementation. (scale bar is 10 µm) (G) Growth
  assays of fibroblasts derived from MTHFD1 deficiency patients in FULL, DIA and ADE
  (n = 3 biological replicates, mean ± SD, *P < 0.05). (H) Schematic overview of the
  genetic folate trap model. (B), (D), (G) - comparison of groups carried out by two-way
  ANOVA
