figure_title: Eliminating decapping activators or decapping enzyme confers similar
  changes in polar metabolites
caption: (A) Principal component analysis of the levels of 147 metabolites in biological
  replicates of each strain. (B-C) Hierarchical clustering analysis of log2 changes
  in all 147 metabolites analyzed (B) or the 46 metabolites up-regulated in any two
  of the four mutants (C) conferred by the indicated mutations vs. WT, including the
  Spearman coefficients (ρ) and P values for the indicated correlations. (D) Results
  of pathway analysis of the 46 up-regulated metabolites described in (C) conducted
  at https://www.metaboanalyst.ca/MetaboAnalyst/Secure/pathway. Red ovals depict groups
  of metabolites significantly enriched among the set of 46 compounds, with P-value
  <0.05. (E-F) Log2 changes in levels of TCA cycle intermediates (E) or amino acids
  (F) conferred by the indicated mutations vs. WT
