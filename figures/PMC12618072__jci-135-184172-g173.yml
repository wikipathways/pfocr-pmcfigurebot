figure_title: Loss of HSAT increases tumor inflammation and decreases apoptosis
caption: (A) Schematic representation of the orthotopic transplantation model performed
  with WT and HS3ST1–/– F1242 and FC1245 lines. Graphic illustration created in BioRender
  (https://BioRender.com/x05fpme). (B) Tumor size at 2 weeks after implantation, measured
  by ultrasound. No significant difference in tumor size observed. (C) RNA was extracted
  from the tumors (n = 5 per group) and subjected to RNA-Seq analysis. Data represented
  as a volcano plot with cutoffs of adjusted P value < 0.05 and log2 fold change ≥
  0.58. (D) Gene ontology analysis was analyzed in the upregulated genes in HS3ST1–/–
  line (log2 fold change > 0.58, adjusted P < 0.05) using Metascape (54). (E) Gene
  Set Enrichment Analysis was performed on the same data set, revealing enrichment
  for pathways involved in inflammation, EMT, and KRAS signaling. (F and G) Staining
  for Ki67 in FFPE tissue sections derived from the tumors (F) and for cleaved caspase-3
  (CC3) (G). Graphs show the mean ± SD. Statistical analysis by 2-tailed t test in
  B, F, and G. *P ≤ 0.05; **P ≤ 0.01; NS, not significant
