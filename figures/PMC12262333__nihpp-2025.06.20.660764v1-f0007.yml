figure_title: Analysis of differentially expressed proteins of edited KOLF2.1J-derived
  cell lines subject to neuronal differentiation
caption: '(A) Volcano plot with Log2 fold changes (Protocol 2/ Protocol 1) (x-axis)
  versus −Log10 adjusted P-values comparing differentially expressed proteins between
  the two comparing experimental protocols. Each dot represents a protein, gray dots
  (adjusted p-value ≥0.05), blue dots (adjusted p-value <0.05). Orange-highlighted
  dots indicate protein markers associated with specific neuronal identities, including:
  (B) neuronal progenitor cells (NPCs), cortical glutamatergic neurons and astrocytes.
  (C) Bubble plot with selected Gene Ontology (GO) biological processes and pathways
  enriched among differentially expressed proteins. Each bubble represents a GO term
  or pathway colored according to the adjusted P value, and exact P-values are indicated
  below each bubble. (D) Bar plot showing Log2 fold change (Protocol 2/ Protocol 1)
  in expression for proteins in GO term 0048708 related to astrocyte differentiation.
  GO term highlighted on (C). ***P < 0.001: Mann–Whitney U test. (E) Proposed model
  of protein interactions involved in iPSCs conversion to astrocytes in KOLF2.1J-derived
  cell lines. Of note, these pathways are favored with Protocol 1 experimental strategy'
