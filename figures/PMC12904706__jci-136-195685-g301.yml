figure_title: ANPEP enhances GSH levels to reduce sorafenib sensitivity of liver cancer
caption: '(A) Targeted amino acid metabolomic profiling of Huh7 cells with or without
  ANPEP overexpression, followed by KEGG pathway enrichment analysis of differential
  metabolites. (B and C) GSH levels and GSH/GSSG ratios in liver cancer cells with
  ANPEP manipulation (B, n = 5; C, n = 3). (D and E) Lipid peroxide levels were labeled
  by C11-BODIPY in Huh7 and HepG2 cells with ANPEP manipulation (D: Huh7, n = 4; HepG2,
  n = 5. E: Huh7, n = 4; HepG2, n = 6). (F and G) IC50 of ANPEP-manipulated Huh7 and
  HepG2 cells with 24 hours of sorafenib treatment (0, 1, 2, 4, 8, 16, 32, 64 μM)
  (n = 3). (H and I) Lipid peroxides in liver cancer cells treated with sorafenib
  alone or sorafenib plus ANPEP manipulation, quantified by C11-BODIPY intensity (n
  = 4). (J) Cell viability of Huh7 and HepG2 cells stably expressing shNC or shANPEP
  after 24 hours of treatment with sorafenib (10 μM) and/or ferrostatin-1 (2 μM) (n
  = 4). (K and L) Xenograft tumor model established by subcutaneous injection of ANPEP-manipulated
  Huh7 cells into nude mice, followed by treatment with sorafenib or vehicle. Tumor
  growth (K) and MDA and 4-HNE levels (L) were assessed (K, n = 8; L, n = 5). Data
  are presented as mean ± SD. Statistical significance was determined by 2-way ANOVA
  with Šidák’s multiple comparisons test (K), 1-way ANOVA with Tukey’s multiple comparisons
  test (C, E, H–J, and L), and 2-tailed unpaired Student’s t test (B, D, F, and G).
  **P < 0.01; ***P < 0.001'
