figure_title: Pathogenic mechanisms of Entamoeba histolytica.
caption: Pathogenic mechanisms of Entamoeba histolytica. The parasite induces inflammation
  and NO, and ROS activate the Raf-MEK-ERK signaling pathway and immune activation
  (neutrophils and macrophages), leading to epithelial damage and extracellular matrix
  remodeling. Despite the activation of signaling pathways (e.g., ERK1/2 and MAPK)
  and angiogenic mediators (ICAM-1 and VEGF-related signals), vascular integrity is
  compromised, and effective neovascularization is not always achieved. Arrows indicate
  the production of molecules by cells and the interactions between molecules, parasites,
  and immune cells
