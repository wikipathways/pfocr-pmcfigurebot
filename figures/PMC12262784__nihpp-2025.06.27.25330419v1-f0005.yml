figure_title: Impacts of gene tissue distribution on the network convergence of common
  and rare variants
caption: A) Tissue distribution of gene expression for CVGs and RVGs, compared to
  the COLOC score for 30 traits. Bar plot (left) shows the median number of tissues
  with mRNA expression > 1 TPM for CVGs and RVGs, and lollipop plot (right) shows
  the corresponding COLOC score for each trait. Traits were selected by the difference
  between the number of expressed tissues for RVGs and CVGs, including the top 15
  traits with CVG > RVG and the top 15 traits with CVG < RVG. B) Comparison of the
  COLOC score to the tissue-specific enrichment in the most relevant tissue (Mann-Whitney
  U Test, **p=0.004). Significant tissue-specific enrichment was defined as an adjusted
  p-value < 0.05 (Methods) for the gene set (CVG or RVG) with a lower median number
  of expressed tissues. Results shown for 24 of the top 30 traits in (A) for which
  a trait-relevant tissue could be defined. C) Subnetwork of initial CVGs and RVGs
  for glucose measurement. Edges derived from PCNet2.0. Non-prioritized genes are
  those not included in the glucose measurement trait network. D) KEGG pathway (top)
  and Human Phenotype Ontology (HPO, bottom) enrichments for the glucose measurement
  trait network. Enrichments were filtered to those with adjusted p-value < 0.05 (KEGG)
  or 5×10−5 (HPO), term size < 1000, and gene intersection size > 20
article_title: Common and rare genetic variants show network convergence for a majority
  of human traits
