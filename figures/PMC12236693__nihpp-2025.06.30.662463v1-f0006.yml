figure_title: Coarse-grained EFF-1 fusogens drive fusion via a second entropic pathway.
caption: 'Coarse-grained EFF-1 fusogens drive fusion via a second entropic pathway.
  (A) Entropic forces maintain an expanded ring of seven fusogens, squeeze vesicles
  into a flat interface, nucleate a stalk (blue arrow) and elongate the stalk along
  the interface edge. Simple pores that open in each vesicle (green arrows) are encircled
  by the stalk, yielding a fusion pore (1.12 ms, yellow arrow). (B) Mean entropic
  force per EFF-1 with seven full-length or truncated EFF-1 complexes (n = 20 and
  10 simulations, respectively; SDs: 66.5 pN and 58.7 pN). (C) Mean hemifusion and
  fusion times versus number of fusogens (n = 20 simulations per value). Diamond indicates
  a single event. (D) Hemifusion and fusion times versus acidic tip attraction ϵtip
  (n = 20 simulations per value, seven fusogens). Solid lines: fits τ=τ0e-ϵtip/E0
  with τ0≈32sec,E0=0.11kT for hemifusion (R2=0.89) and τ0≈28min,E0=0.09kT for fusion
  (R2=0.93). Dashed line: ϵtip=0.6kBT, value best reproducing experimental (58) EFF-1
  monomer orientational distribution (see Fig. S10). Error bars: SEM for (C) and (D).
  For (A)-(C), ϵtip=1.2kT'
