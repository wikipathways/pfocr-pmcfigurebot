caption: Overexpression of VgPIP1;2 alters the global gene expression profile in rice
  roots. (A) Principal component analysis (PCA) of the root transcriptional profiles
  of OE-3 line and WT plants. (B) Volcano plot showing the numbers of downregulated
  and upregulated differentially expressed genes (DEGs) in the OE-3 line compared
  to WT plants. Functional enrichment analysis of DEGs based on Gene Ontology (GO)
  biological process (C,E) and Kyoto Encyclopedia of Genes and Genomes (KEGG) molecular
  pathways (D,F). Enrichment analysis for upregulated (C,D) or downregulated (E,F)
  genes. Only the top 20 false discovery rate (FDR) ranked terms are shown (FDR cutoff
  = 0.05)
