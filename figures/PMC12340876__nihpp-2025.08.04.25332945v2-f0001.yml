figure_title: Study design
caption: 'Overview of datasets: The Global Neurodegeneration Proteomics Consortium
  (GNPC) cohort (N=4,045, plasma, SomaLogic 7k) was used to identify proteins associated
  with APOE4 or APOE2 and clinical diagnosis (CU vs. AD dementia). To investigate
  APOE-related proteomic changes in relation to Aβ status (Aβ− vs. Aβ+), we utilized
  plasma data from BioFINDER-2 (SomaLogic 7k, a subset of GNPC), CSF data from Alzheimer’s
  Disease Neuroimaging Initiative (ADNI) (SomaLogic 7k), and CSF data from BioFINDER-2
  (OLINK). The UK BioBank (UKB) (plasma, OLINK) was used exclusively to define APOE-driven
  protein signatures, as clinical diagnosis and Aβ status were unavailable in the
  dataset. Parkinson’s Progression Markers Initiative (PPMI) cohort (CSF, OLINK) is
  utilized to investigate the longitudinal APOE-protein associations. Differential
  abundance analysis identified APOE (APOE4 or APOE2) associated proteins and AD diagnosis
  (or Aβ status) associated proteins, resulting in different groups of proteins specifically
  associated with APOE or AD, or jointly associated with both. Proteins associated
  with APOE were further tested and categorized based on its upstreaming or downstreaming
  role in AD using 2 mediation models: APOE => protein => AD diagnosis or Aβ status
  (Upstream mediation model) and APOE => AD diagnosis or Aβ status => protein (Downstream
  mediation model). Diagnosis or Aβ status stratification analysis were conducted
  to investigate in-depth the changes of APOE-protein associations. An age stratification
  analysis only in CU or Aβ− to investigate how early APOE-protein association changes
  with age. APOE4 and APOE2 analysis were conducted separately and the results were
  compared together with the inclusion of ε2ε4 carriers to investigate protein level
  change in detailed APOE genotypes (6 genotypes: ε2ε2, ε2ε3, ε2ε4, ε3ε3, ε3ε4 and
  ε4ε4). APOE associated proteins were annotated using cell type enrichment analysis,
  Gene Ontology (GO) term enrichment analysis or biologically informed neural networks
  (BINNs)-enriched Reactome pathway analysis, protein-protein interaction (PPI) analysis
  and spatial co-expression analysis (APOE and associated genes). Those are done based
  on the GNPC cohort as it has a larger sample size than other cohorts. For the BioFINDER-2
  and ADNI cohort, BINN-enriched reactome analysis was used to globally validate the
  pathways or processes found in the GNPC cohort. In the BioFINDER-2 cohort, we evaluated
  the association between APOE-associated proteins and available 5 AD biomarkers or
  cognitive function: tau-PET, Aβ-PET, atrophy: cortical thickness in the temporal
  lobe, cognitive performance measurements Mini-Mental State Examination (MMSE) and
  modified Preclinical Alzheimer Cognitive Composite (mPACC) scores. A separate cohort
  (PPMI) was used to evaluate longitudinal protein-APOE associations. Figure created
  with BioRender.com'
