figure_title: The schematic illustration of the beneficial roles of Kruppel-like transcription
  factor 2 (KLF2) in atherosclerosis.
caption: 'The schematic illustration of the beneficial roles of Kruppel-like transcription
  factor 2 (KLF2) in atherosclerosis. KLF2 has multiple beneficial roles in atherosclerosis.
  For vascular smooth muscle, KLF2 enhances nitric oxide bioavailability, thereby
  promoting vasodilatory responses. For metabolism, KLF2 promotes steatolysis through
  nuclear factor erythroid 2–related factor 2 (NRF2)/Transcription factor 7-like 2
  (TCF7L2) pathway; For endothelium aspect, KLF2 prevents endothelial injury through
  activation of cystathionine γ-lyase and maintaining autophagic function; For anti-inflammatory
  effects, KLF2 inhibits proinflammatory responses through multiple mechanisms: reducing
  macrophage infiltration via lncRNA MANTIS, suppressing the forkhead box protein
  p1 (Foxp1) and NOD-like receptor protein 3 (NLRP3) inflammasome to inhibit pyroptosis,
  repressing proinflammatory transcription by silencing the miR-150 promoter and inhibiting
  NF-κB and activating transcription factor 2 (ATF2), and blocking coxsackievirus-adenovirus
  receptor (CAR)-mediated neutrophil migration via the KLF2/activator protein-1 (AP-1)
  axis. In the diagram, red “+” symbols (promotion) and green “−“ symbols (inhibition)
  are used to indicate how KLF2 influences various biological processes involved in
  atherosclerosis'
article_title: 'Decoding the Kruppel-like Transcription Factors in Atherosclerosis:
