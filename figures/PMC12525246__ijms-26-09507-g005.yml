  larger and darker nodes representing proteins that interact with more partners.
  (C) GO enrichment and (D) KEGG pathways enrichment analysis of the core targets.
  “GO numbers” indicate Gene Ontology term identifiers, and “Hsa” denotes Homo sapiens
  pathways
