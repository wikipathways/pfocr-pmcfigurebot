figure_title: BMEE is involved in neuronal development signaling pathways.
caption: BMEE is involved in neuronal development signaling pathways. (A) Mechanistic
  analysis from network pharmacology represents active BMEE metabolisms in neuronal
  signaling networks. Here, green hexagon-shaped nodes represent metabolites identified
  in BMEE by GC-MS (Table S2, Supplementary File S2) whereas red square boxes indicate
  the neuronal developmental signaling pathways involved. The purple circular nodes
  illustrate the nuclear signaling-associated targets, and the yellow circular nodes
  represent the targets known to associate with metabolites. Also, the yellow circular
  nodes with purple border lines represent shared targets. (B) Venn diagram showing
  the common targets between active compounds BMEE and neuronal development. (C) The
  protein–protein interaction (PPI) network represents the interconnectedness between
  93 targets of BMEE, which also belong to neuronal developmental signaling. In this
  representation, circular nodes represent targets, and blue lines represent their
  interactions. The darkness of the node colors represents the degree of connectivity
