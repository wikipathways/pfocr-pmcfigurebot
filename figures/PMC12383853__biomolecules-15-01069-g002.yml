figure_title: YY1 as a key regulator of cell death pathways in tumor drug resistance.
caption: YY1 as a key regulator of cell death pathways in tumor drug resistance. YY1
  promotes tumor cell survival and drug resistance through multifaceted anti-apoptotic
  mechanisms, including engagement in the NF-κB/SNAIl/YY1/RAF regulatory loop, upregulation
  of MCL-1 alongside inhibition of caspases-3, -7, and -9, and suppression of the
  death receptor pathway via p53/YY1-mediated downregulation of DR5 and direct inhibition
  of FAS expression. Additionally, YY1 inhibits BIM by forming a complex with the
  NF-κB subunit RELA, confers resistance to ferroptosis by inhibiting the PPARs-ACSL1/4
  signaling axis and upregulating TRIM34 and amplifies EGFR signaling through YY1-mediated
  inhibition of SNX1 under nutrient stress. Collectively, these mechanisms enable
  YY1 to drive therapeutic resistance by robustly promoting anti-apoptotic responses
  in tumor cells. Arrows are used to show activation; arrows terminated with a bar
  represent inhibition
