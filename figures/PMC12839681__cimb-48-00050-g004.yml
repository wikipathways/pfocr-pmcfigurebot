caption: Effects of BRC supplementation on skin barrier function and antioxidant enzyme
  activities in UV-irradiated SKH-1 hairless mice. (A) Western blot images showing
  NF-κB pathway proteins, COX-2, and CerS4 expression. (B–E) Quantification of Western
  blot results. (F–H) mRNA expression of TNF-α, IL-1β, and IL-6. (I–K) Antioxidant
  enzyme activities in skin tissues. Data are presented as mean ± SD (n = 8). Different
  letters indicate significant differences (p < 0.05). NC, normal control; C, UVB
  irradiation; PC, UVB irradiation + 100 mg/kg b.w. of L-ascorbic acid; BRC10, UVB
  irradiation + 10 mg/kg b.w. of BRC; BRC30, UVB irradiation + 30 mg/kg b.w. of BRC;
  BRC60, UVB irradiation + 60 mg/kg b.w. of BRC
