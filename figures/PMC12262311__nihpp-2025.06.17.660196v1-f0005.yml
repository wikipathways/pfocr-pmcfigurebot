figure_title: Ex-4 tunes metabolism through Med14
caption: (A) Ex-4 regulated gene counts from spike-in corrected RNA-seq after 1, 8
  and 16 hour exposure in WT and Med14 S983A mutant cells.(B) KEGG pathway enrichment
  of Ex-4-induced genes (16 hours) in WT and Med14 S983A mutant cells.(C) Heatmaps
  of metabolic gene regulation by Ex-4. Glycolytic genes with Mdh1 and Slc25a1 (top),
  cholesterol homeostasis genes (middle) and fatty acid metabolism genes (bottom).(D)
  Oxygen consumption rate (OCR) of WT and Med14 S983A mutants with or without 16 hour
  pre-exposure to FSK (10 uM). Basal glucose concentration is 2 mM. Cells were treated
  with 20 mM glucose, 5 uM oligomycin and 5 uM rotenone + 5 uM antimycin A at the
  indicated timepoints.(E) Western blots probing fat metabolism and CREB activation
  in WT and Med14 S983A mutant cells. Cells were exposed to Ex-4 as indicated. Unprocessed
  and cleaved SREBP-1a bands are marked.(F) RT-qPCR of Ldlr and Hmgcs1 comparing WT
  and Med14 S983A mutant cells. Cells were cultured for 4 days in lipoprotein deficient
  serum and treated with 10 ug/ml cholesterol plus 1 ug/ml 25-hydroxycholesterol for
  8 hours as indicated. * p < 0.002, ** p < 0.0003 by unpaired t test.(G) Heatmap
  comparing levels of triglycerides (left), cholesterol esters (middle) and phospholipids
  (right) in WT and Med14 S983A cells
