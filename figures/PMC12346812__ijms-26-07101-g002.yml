figure_title: Innate immune responses.
caption: Innate immune responses. (a) Innate immunity involves epithelial and physiological
  barriers, complement activation, and recruitment of innate immune cells. TLRs initiate
  phagocytosis and stimulate the production of interferons (IFNs), interleukins (ILs),
  and other cytokines and chemokines, facilitating antigen presentation through the
  generation of antigen-presenting cells (APCs). (b) Innate immune responses triggered
  by pathogen-associated molecular patterns (PAMPs) or damage-associated molecular
  patterns (DAMPs) initiate inflammation, primarily via surface TLR-mediated signaling
  through the Myddosome complex (MyD88 and IRAKs), leading to the activation of transforming
  growth factor-β-activated kinase 1 (TAK1), NF-κB, MAPK, and interferon regulatory
  factor (IRF) pathways. These cascades promote the nuclear translocation of NF-κB,
  AP-1, and IRF3/5, driving proinflammatory cytokine expression. Endosomal TLR7-9
  and TLR4 also activate IRF5 via the SLC15A4-associated adaptor TASL, enhancing type
  I interferon (IFN-I) production. These cytokines further amplify inflammation by
  activating downstream Janus kinase-signal transducers and the activator of transcription
  (JAK-STAT), NF-κB, and MAPK-AP-1 signaling pathways through their respective receptors.
  All other abbreviations are defined in the main text and listed at the end of the
  manuscripts. All one-way arrows indicate activation and forward progression along
  the pathway, while bi-directional arrows represent interactions between components
