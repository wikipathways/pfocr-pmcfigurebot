figure_title: 'Roux-en-Y gastric bypass (RYGB) and single anastomosis duodeno–ileal
  bypass with sleeve gastrectomy (SADI-S) achieve metabolic benefits through different
  pathways: SADI-S upregulates colonic glucose metabolism pathway genes.'
caption: 'Roux-en-Y gastric bypass (RYGB) and single anastomosis duodeno–ileal bypass
  with sleeve gastrectomy (SADI-S) achieve metabolic benefits through different pathways:
  SADI-S upregulates colonic glucose metabolism pathway genes. (a) Quantitative real-time
  PCR (qRT-PCR) analysis of glucose metabolism–related genes in the IL and CL. Expression
  of glucose metabolism–related genes shows no significant difference between the
  sham and surgical groups. (b) qRT-PCR analysis of glucose metabolism–related genes
  in the colon. SADI-S rats exhibit significant upregulation of glycolytic genes in
  the colon, Hexokinase 2 (Hk2), Fructose-1,6-bisphosphatase 2 (Fbp2), aldolase B
  (Aldob), and lactate dehydrogenase A (Ldha), compared to both sham and RYGB groups.
  Expression levels were normalized to those of B2M. This coordinated upregulation
  indicates enhanced colonic glucose utilization and metabolic reprogramming specifically
  in the SADI- S procedure. All data are presented as the mean ± SEM. n = 5-6 in each
  group (a and b). Data in a and b were analyzed using the Mann–Whitney U test; ∗p
  < 0.05 and #p < 0.05'
