figure_title: Effects of BC99 on serum metabolic profiles in HFD-induced obese rats.
caption: 'Effects of BC99 on serum metabolic profiles in HFD-induced obese rats. (A,B)
  OPLS-DA score plots showing separation between CON and HFD (A) and between HFD and
  BC99_M (B). (C,D) Volcano plots of differential metabolites (VIP > 1, p < 0.05)
  for CON vs. HFD (C) and HFD vs. BC99_M (D) Dashed lines indicate the significance
  threshold (q=0.05) and the fold change threshold (∣log2FC∣=1). (E,F) Hierarchical
  clustering heatmaps of differential metabolites. (G–J) Relative abundance of selected
  metabolites: (G) 2-amino-3-prop-2-enylsulfinylpropanoic acid, (H) 1-nonadecanoyl-sn-glycero-3-phosphocholine,
  (I) GUDCA, (J) GDCA. (K) Percentage stacked bar chart of key lipid metabolites.
  (L–Q) Relative abundance of individual metabolites from (K): (L) 2-palmitoylglycerol,
  (M) 1-monomyristin, (N) 1-stearoyl-sn-glycero-3-phosphocholine, (O) LysoPC(20:4),
  (P) LysoPC(18:1), (Q) indolelactic acid. (R) KEGG pathway enrichment analysis of
  altered metabolites. Data are mean ± SEM. * p < 0.05 vs. HFD'
