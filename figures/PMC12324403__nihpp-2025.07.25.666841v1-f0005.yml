  Raptor, or both. **p < 0.01, ***p < 0.001; n.s.: not significant (Dunn’s test, two-sided;
  n = 14–16). (C) Quantification of grooming in flies harboring RNAi targeting Nf1,
  S6K, or both. **p < 0.01, ***p < 0.001; n.s.: not significant (Šidák, n = 13–15)'
