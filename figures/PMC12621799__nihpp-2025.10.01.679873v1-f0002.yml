figure_title: Hypertrophic ligands induce diverse changes in protein abundance and
  phosphorylation
caption: (A) Hierarchical clustering of RPPA data from 172 total/phospho probes following
  1 hr and 48 hr treatment with Nrg1 (10 ng/mL), Ang II (1 μM), ET-1 (100 nM), or
  IGF-1 (10 nM) (log2 fold-change compared to control). (B) Venn diagrams of top 20%
  most responsive proteins under each treatment at 1 hr vs 48 hr. (C) Enrichr Reactome
  pathway enrichment analysis, showing the top 3 enriched pathways with overlap genes
  ≥ 10. (D) Differentially expressed or phosphorylated proteins corresponding to with
  the most enriched Reactome pathways for each treatment
