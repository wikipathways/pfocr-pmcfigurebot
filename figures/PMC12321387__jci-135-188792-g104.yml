figure_title: Dysregulated WNK4-SPAK/OSR1 pathway activity in KS-WNK1–KO mice during
  K+ restriction, but not during K+ loading
caption: Immunoblot analysis of kidney cortical extracts from female and male WT littermates
  and KS-WNK1–KO mice subjected to various K+ maneuvers for 10 days. (A–C) Immunoblot
  of the WNK-SPAK/OSR1 pathway from mice treated with control diet or (A) low K+ diet,
  (B) HKB diet, or (C) HKB + amiloride. Brackets indicate the band analyzed. In A–C,
  lanes corresponding to WT and KO animals on control diet were from replicate lysates
  to facilitate normalization between blots. The values graphed for control diet in
  Figures D and E represent an average of the replicates (Supplemental Figure 6).
  (D) WT mice fed a low K+ diet had significant increases in tSPAK, pSPAK/pOSR1, and
  WNK4 compared with WT mice on control diet. KS-WNK1–KO mice had a blunted response
  to the low K+ diet compared with WT mice. (E) Phosphorylated-to-total SPAK ratio
  in WT and KO mice subjected to control vs. low K+ diet. (F) No differences in WNK4-SPAK/OSR1
  pathway abundance or phosphorylation in WT and KS-WNK1–KO mice subjected to HKB
  or HKB + amiloride treatment. (G) WNK-SPAK/OSR1 pathway activation during low, control,
  and high blood [K+] experimental maneuvers. During low [K+], KS-WNK1–dependent WNK
  bodies condense the WNK-SPAK/OSR1 pathway; this correlates with SPAK/OSR1 and NCC
  phosphoactivation. During high K+, KS-WNK1 inhibits pNCC activation independently
  of the SPAK/OSR1 pathway. Results are shown as mean ± SEM; n = 12 mice per genotype
  and diet (males and females combined). Two-way ANOVA with Šídák’s multiple comparisons
  test, *P ≤ 0.05, **P ≤ 0.01
