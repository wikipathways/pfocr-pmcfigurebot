figure_title: Overview of excitation-contraction coupling and calcium cycling proteins
  in the cardiomyocyte
caption: Schematic representation of the proteins involved in Ca2+ handling in the
  cardiomyocyte. Targets of the Ca2+/Calmodulin kinase signaling pathway are depicted
  with dotted red arrows. Targets of the protein kinase A signaling pathway are depicted
  with dotted black arrows. LTCC indicates the L-type Ca2+ channel; NCX, sodium-calcium
  exchanger; β-AR, β-adrenergic receptor; AT2R, angiotensin 2 receptor; CaM, calmodulin;
  CaMKII, Ca2+/Calmodulin-dependent kinase; cAMP, cyclic AMP; PKA, protein kinase
  A; PP1, protein phosphatase 1; RyR, ryanodine receptor; CSQ, calsequestrin; SERCA,
  sarcoendoplasmic reticulum Ca2+-ATPase; PLN, phospholamban; SR, sarcoplasmic reticulum;
  HRC, histidine-rich Ca2+ binding protein; S100A1, S100 Ca2+ binding protein; Cal2,
  Calstabin 2. Created in BioRender. Redel-traub, G. (2025)
