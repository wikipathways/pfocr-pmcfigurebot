caption: Screening and differential function analysis of upper- and lower-layer sperm
  metabolites. (A) Principal component analysis (PCA) diagrams of metabolomics analysis
  of upper- and lower-layer sperm cells. (B) OPLS-DA diagrams. (C) Upper- and lower-layer
  sperm differ in the top fifty metabolites. (D) Histogram analysis showed that R837
  led to upregulation or downregulation of metabolites associated with the tricarboxylic
  acid cycle and some amino acids in lower-layer sperm. (E) DA score pathway analysis
  showed that oxidative phosphorylation and AMPK energy metabolism pathway were affected
  by R837. * indicates p < 0.05, ** indicates p < 0.01, *** indicates p < 0.001
article_title: Imiquimod (R837), a TLR7-Specific Agonist, Regulates Boar Sperm Motility
