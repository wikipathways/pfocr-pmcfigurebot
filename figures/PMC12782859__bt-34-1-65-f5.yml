figure_title: The Wnt signaling pathway controls both osteoclasts and osteoblasts,
  through which it shapes bone formation and resorption operations.
caption: The Wnt signaling pathway controls both osteoclasts and osteoblasts, through
  which it shapes bone formation and resorption operations. New bone formation in
  osteoblasts receives support through mechanisms that enable osteoblast activity
  by activation of the classical β-catenin-dependent Wnt signaling pathway. Bone resorption
  reduction happens through reduced osteoclast differentiation because of higher OPG
  gene expression. The expression of LRP5/6 increases through pathways that do not
  depend on β-catenin, which strengthens osteoblast differentiation. Wnt5a activates
  RhoA through ROR2 receptors enabling the differentiation process of osteoblasts.
  Wnts receive activation through the PLC/PKCδ signaling pathway as it advances both
  osteoblast differentiation and the process of new bone tissue formation. The OPG
  expression that occurs through classical Wnt signaling leads to reduced bone resorption
  in osteoblasts, but non-classical Wnt direction accelerates bone resorption. Through
  Wnt5a-ROR2 activation, the signaling cascade increases RANKL-mediated osteoclastogenesis
  by activating c-Jun, which raises RANK expression. The Daam2 aptamer protein activates
  Rho with adaptive mechanisms that trigger the subsequent activation mechanism via
  Pkn2 effector kinase. The Pkn3 kinase develops actin rings by binding with c-Src
  kinase, thus promoting enhanced bone resorption. The activation of NF-kB and NFATc1
  by RANKL stimulation becomes inhibited through Wnt4 and Wnt16 Wnt proteins. The
  activation mechanism stops osteoclast differentiation within appropriate levels
  to keep bone remodeling processes in equilibrium
