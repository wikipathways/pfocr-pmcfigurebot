figure_title: IWR1-POMA degraded TNKS to suppress both catalysis-dependent and independent
  WNT signaling
caption: (A) 293T-TNKS1/2-DKO cells were transfected with FLAG-TNKS1 and STF plasmids
  and then treated with IWR1 or IWR1-POMA. In contrast to IWR1 that plateaued in suppressing
  the WNT/β-catenin signaling induced by TNKS1, IWR1-POMA allowed for a more complete
  control of the pathway activity.(B) 293T-TNKS1/2-DKO cells transfected with FLAG-TNKS2
  and STF plasmids and then treated with IWR1 or IWR1-POMA similarly showed that catalytic
  inhibition led to residual WNT/β-catenin activity.(C) 293T-TNKS1/2-DKO cells were
  transfected with 3×FLAG-TNKS1-PD and STF plasmids and then treated with IWR1 or
  IWR1-POMA. IWR1-POMA suppressed the luciferase activities whereas IWR1 had no effect.(D)
  293T-TNKS1/2-DKO cells transfected with FLAG-TNKS2-M1054V and STF plasmids and then
  treated with IWR1 or IWR1-POMA. TNKS2 exhibited robust scaffolding effects. All
  the data is presented as mean ± SEM, n = 3
article_title: Role of tankyrase scaffolding in the β-catenin destruction complex
  and WNT signaling
