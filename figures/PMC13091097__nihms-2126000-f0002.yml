figure_title: Select gut bacteria uniquely shape neuroinflammatory tone
caption: '(A) Young adult wild-type germ-free (GF) mice were mono-colonized with type
  strains of interest for 2 weeks: Escherichia coli (E. coli), Bacteroides thetaiotaomicron
  (B. theta), Clostridium celatum (C. celatum), and Lactobacillus johnsonii (L. johnsonii).
  After mono-colonization, CD11b+ myeloid cells were isolated from the brains, and
  bulk RNA-seq was performed (Table S2; NIH GEO: GSE289591).(B) Number of differentially
  expressed genes (DEGs; log fold change > |0.25|, p < 0.05) in mono-colonized mice
  compared with GF.(C) Venn diagrams showing overlapping DEGs across colonization
  states.(D) Comparison of overrepresentation-based pathway analysis results across
  mono-colonization states.(E) KEGG pathway analysis was run using DEGs for each treatment.
  Pathways that were significantly increased or decreased in at least two treatments
  are shown.(F) KEGG pathways increased specifically after E. coli mono-colonization.(G)
  Immunohistochemistry was performed on the choroid plexus of the lateral ventricle
  to quantify the percentage of CD206+ cells that were also MHC class II+.Representative
  images highlight the region of interest (ROI) analyzed (left) and example zoomed-in
  images used for quantification for each treatment (right).Quantification was performed
  using at least two images per mouse and four mice per treatment group.n = 3–7 mice.
  In (G), dots represent individual mice, and error bars represent mean ± SEM. ***
  p < 0.001'
article_title: Indigenous gut microbes modulate neural cell state and neurodegenerative
  disease susceptibility
