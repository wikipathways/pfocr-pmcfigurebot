figure_title: Alternative polyadenylation patterns in CPSF1 amplified cancers.
caption: Alternative polyadenylation patterns in CPSF1 amplified cancers. (a), A dot
  plot showing PDUI score of each gene in high and low CPSF1 copy number. Dashed lines
  represent 0.15 cutoffs. Blue dots represent 3′-UTR-shortened genes while red dots
  represent 3′-UTR-lengthened genes. (b), A volcano plot denoting 3′-UTR-lengthened
  (red) and 3′-UTR-shortened (blue) genes (ΔPDUI = ±0.15; Adjusted p-value < 0.05).
  (c), Quadrant dot plot of ΔPDUI (y-axis) and ΔZ-scores (x-axis). (d–g), Pathway
  enrichment analysis of different quadrants from panel C. Upward and downward arrows
  represent an increase and a decrease, respectively
article_title: CPSF1 Is Co-Amplified with MYC but Is Independently Associated with
  Alternative Polyadenylation in Cancer
