caption: Schematic illustration showing double deletion of AT1a receptors and NHE3
  selectively in the proximal tubules of the kidney markedly attenuates the development
  of Ang II-induced and 2K1C Goldblatt hypertension in PT-Agtr1a−/−/PT-Nhe3−/− double
  gene knockout mice. The data of the present study provides strong evidence for a
  key role of the Ang II/AT1a/NHE3 signaling pathways in the proximal tubules in maintaining
  physiological blood pressure homeostasis and the development of Ang II-induced and
  2K1C Goldblatt hypertension. +, iL1-Sglt2-Cre/Agtr1aflox/flox mice cross bred with
  iL1-Sglt2-Cre/Nhe3flox/flox mice to generate PT-Agtr1a−/−/PT-Nhe3−/− double gene
  knockout mice
