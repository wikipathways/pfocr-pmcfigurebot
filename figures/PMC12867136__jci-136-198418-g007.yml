figure_title: Osimertinib activates TGF-β2 secretion to initiate the EMT-dependent
  secretory pathway
caption: (A) TGF-β2 WB analysis of CM and whole-cell lysate (WCL) samples from H1975
  cells (DN or OR). (B) Enzyme-linked immunosorbent assays of CM samples show that
  increased TGF-β2 secretion is detectable 4 hours after initiating Osi treatment
  in H1975 DN cells. (C) Quantitative PCR analysis shows that ZEB1 mRNA levels are
  upregulated 24 hours after initiating Osi treatment in H1975 DN cells. (D) TGF-β2
  gene promoter reporter assays. Reporters containing a 2-kb TGF-β2 gene promoter
  fragment or truncated (1.1 kb or 0.6 kb) fragments were transfected into HCC827
  DN cells. After 48 hours, cells were treated with DMSO or 100 nM Osi for 24 hours.
  Values were normalized to Renilla, averaged from replicates (n = 6), and expressed
  relative to DMSO. Predicted transcription factor binding sites shown in schematic
  (left). (E) WB confirmation of SMAD2/3 dephosphorylation by 0.5 and 1 μg/mL neutralizing
  anti–TGF-β antibody treatment of H1975 OR cells. β-Actin served as loading control.
  (F) Scatter plot of Golgi areas following TGF-β neutralization in H1975 OR cells
  (dots). Values normalized based on nucleus area. (G) WB analysis of L1CAM in CM
  and WCL samples following TGF-β neutralization in H1975 OR cells. (H) WB confirmation
  of increased SMAD2/3 phosphorylation by recombinant TGF-β2 (100 nM) treatment of
  H1975 DN cells. β-Actin served as loading control. (I) Golgi areas following recombinant
  TGF-β2 treatment in H1975 DN cells (dots). Values normalized based on nucleus area.
  (J) WB analysis of L1CAM in CM and WCL samples following recombinant TGF-β2 treatment
  of H1975 DN cells. (K) WB analysis of L1CAM and COL6A1 in CM samples from H1975
  DN cells treated for 24 hours with DMSO, 100 nM Osi, or Osi in combination with
  1 μg/mL neutralizing anti–TGF-β antibody. Ponceau-stained gel included as loading
  control. (L) Scatter plot of Golgi areas in H1975 DN cells (dots) treated with Osi
  alone or in combination with neutralizing anti–TGF-β antibody. Data are the mean
  ± SD from a single experiment incorporating biological replicate samples (n = 3,
  unless otherwise indicated) and are representative of at least 2 independent experiments.
  One-way ANOVA with Dunnet’s post hoc test (B, C, and L). Two-tailed Student’s t
  test (D, F, and I)
article_title: Osimertinib activates a TGF-β2–dependent secretory program that drives
  lung adenocarcinoma progression
