figure_title: Top KEGG pathways identified by gene set enrichment analysis.
caption: Top KEGG pathways identified by gene set enrichment analysis. Gene set enrichment
  analysis (GSEA) of the top 20 Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways
  in peripheral blood mononuclear cells (PBMCs) following elderberry juice (EBJ) or
  placebo (PL) treatment. Pathways are ranked by the lowest mean adjusted p-value
  across both groups [false discovery rate (FDR) < 0.1]. GSEA evaluates the distribution
  of all expressed genes ranked by fold-change or test statistic. Each dot represents
  a pathway–treatment combination, with the x-axis showing the normalized enrichment
  score (NES), a standardized metric reflecting the degree to which a pathway’s genes
  are overrepresented at the top or bottom of the ranked list. Dot size corresponds
  to statistical significance [−log10(FDR)], and color indicates treatment group (blue
  = EBJ, red = PL). Positive NES values indicate pathway enrichment in the fasted
  versus fed state, while negative NES values indicate relative downregulation. The
  vertical dashed line at NES = 0 denotes no enrichment. Data reflect pooled transcriptomic
  analyses from n = 10 participants per group
