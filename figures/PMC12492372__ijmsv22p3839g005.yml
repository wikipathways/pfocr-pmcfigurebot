figure_title: PRDX3 promotes LNM and lymphangiogenesis in vivo via an NF-κB signaling
  pathway-dependent way.
caption: PRDX3 promotes LNM and lymphangiogenesis in vivo via an NF-κB signaling pathway-dependent
  way. (A)-(B) NF-κB signaling inhibitor BAY-11-7082 attenuated the stimulatory effect
  of PRDX3 on the volumes of popliteal lymph nodes in nude mice model (n = 10 mice
  per group). (C)-(D) NF-κB signaling inhibitor BAY-11-7082 attenuated the stimulatory
  effect of PRDX3 on the metastatic areas of LNM in nude mice model (n = 10 mice per
  group). (E)-(F) NF-κB signaling inhibitor BAY-11-7082 attenuated the stimulatory
  effect of PRDX3 on lymphangiogenesis in the primary tumors of nude mice (×200).
  Error bars represent the mean ± S.D. of three independent experiments. ** P < 0.05,
  *** P < 0.01, **** P < 0.001
article_title: PRDX3 Promotes Lymph Node Metastasis in Cervical Cancer by Activating
