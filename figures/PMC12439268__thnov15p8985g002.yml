figure_title: Inhibition of Twist1/PPAR-δ signal pathway rescues depressive-like behaviors
  in tumor-bearing mice.
caption: Inhibition of Twist1/PPAR-δ signal pathway rescues depressive-like behaviors
  in tumor-bearing mice. (A) Twist1 mRNA expression in the serum-derived EVs from
  tumor-bearing mice treated with RNase A (2 mg/mL) alone or in combination with Triton
  X-100 (0.1%). (n = 5 mice per group). (B) Twist1 mRNA expression in the mPFC, Amy,
  NAc, hippucampus and VTA of tumor-bearing mice (n = 6-8 mice per group). (C) Twist1
  and PPAR-δ proteins expression in the mPFC of tumor-bearing mice (n = 11 mice per
  group). (D) Schematic timeline of 4T1 cells inoculation, lentivirus injection and
  behavioral tests. Targeted locations and confocal images of LV-mediated GFP (green)
  expression in the mPFC (right). Scale bar = 20 µm. (E) Twist1 and PPAR-δ proteins
  expression in the mPFC of tumor-bearing mice with LV-shTwist1 injection (n = 10
  mice per group). (F-I) Behavioral consequences of viral knockdown of Twist1 in the
  SPT (F), TST (G), FST (H) and OFT (I) for tumor-bearing mice (n = 10 mice per group).
  All data are presented as the mean ± s.e.m., with each point representing data from
  an individual. *p < 0.05, **p < 0.01, ***p < 0.001 by one-way ANOVA (A) followed
  by Bonferroni's post hoc test, Student's t test (B, C) or two-way ANOVA (E, F, G,
  H, I) followed by Bonferroni's post hoc test. Amy, amygdala; FST, forced swimming
  test; GFP, green fluorescent protein; Hip, hippocampus; LV, lentivirus; mPFC, medial
  prefrontal cortex; NAc, nucleus accumbens; OFT, open field test; PBS, phosphate
  buffered saline; PPAR-δ, peroxisome proliferator-activated receptor-δ; SDEVs, serum-derived
  extracellular vehicles; SPT, sucrose preference test; TST, tail suspension test;
  VTA, ventral tegmental area
