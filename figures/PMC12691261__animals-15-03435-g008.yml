figure_title: Screening, PCA, and KEGG enrichment analysis of differential metabolites.
caption: Screening, PCA, and KEGG enrichment analysis of differential metabolites.
  (A,B) Principal component analysis (PCA) score plots.The scatter plots (A,B) show
  the distribution of samples along the first (PC1) and second (PC2) principal components,
  colored by experimental groups. The ellipses in (B) represent the 95% confidence
  ellipse for each group (not shown for groups with biological replicates n < 4).
  (C) Bar chart displaying the number of differential metabolites. (D) The Rich Factor,
  calculated as the number of differential metabolites in a given KEGG pathway divided
  by the total number of metabolites assigned to that pathway, is represented on the
  x-axis. Each point’s color intensity corresponds to the enrichment p-value, with
  more significant (smaller) p-values indicating a higher degree of KEGG pathway enrichment
