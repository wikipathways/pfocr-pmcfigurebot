figure_title: Network pharmacology and in silico prediction of chrysoeriol targets
  associated with platelet activation.
caption: Network pharmacology and in silico prediction of chrysoeriol targets associated
  with platelet activation. (A) Venn diagram showing the overlap between predicted
  chrysoeriol targets (22 proteins) and platelet activation-related genes (5218 genes
  from GeneCards), revealing 17 common targets. (B) Protein–protein interaction (PPI)
  network of the 17 overlapping genes constructed using the STRING database. Key hub
  proteins such as AKT1, PIK3R1, EGFR, SRC, and PTK2 are highlighted due to their
  central roles in platelet signaling. (C) Compound–target–pathway network generated
  using Cytoscape, illustrating the connections between chrysoeriol overlapping protein
  targets, and enriched KEGG pathways. Major pathways include platelet activation,
  PI3K-Akt signaling, MAPK signaling, arachidonic acid metabolism, and focal adhesion.
  (D) BOILED-Egg model from SwissADME, predicting chrysoeriol’s passive gastrointestinal
  absorption and lack of blood–brain barrier permeability based on WLOGP and topological
  polar surface area (tPSA). (E) Bioavailability radar plot showing chrysoeriol’s
  physicochemical properties within the optimal range for drug-likeness across six
  key descriptors (lipophilicity, size, polarity, solubility, saturation, and flexibility)
