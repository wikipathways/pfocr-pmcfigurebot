figure_title: The innovative delivery platforms in GBM.
caption: 'The innovative delivery platforms in GBM. Schematic overview of nanoplatforms
  that deliver STING agonists to remodel the immunologically “cold” TME of GBM into
  a “hot” state. DT-Exo-STING: An immunotherapeutic system based on chimeric exosomes
  derived from dendritic cell (DC)-tumour hybrid cells. It restores the activity of
  STING agonists, enhances antigen presentation by DCs, and promotes robust T-cell
  priming. bALG@DT-Exo-STING: An artificial lymph-node-like depot formed by in situ
  spraying of an alginate gel cross-linked with DT-Exo-STING. The bioorthogonal reaction
  between azide-modified exosomes and alkyne-modified alginate prolongs local retention,
  avoids rapid clearance, and drives potent T-cell activation. ZnCDA: A nanoscale
  coordination polymer encapsulating bacterial cyclic dimeric adenosine monophosphate
  (CDA). It enhances intratumoral accumulation, selectively targets tumour-associated
  macrophages (TAMs), and boosts STING-dependent antigen presentation and T-cell responses.
  SRHLS: A sequential release hydroLipo system integrating hydrogels and nanoparticles
  to achieve spatiotemporally controlled delivery. SRHLS releases decitabine followed
  by STING agonists to potentiate antitumour immunity. PLHM-DOX NPs: Telodendrimer/Mn²⁺-based
  doxorubicin (DOX) nanoparticles. By combining Mn²-mediated potentiation of the STING
  pathway with cytosolic DNA accumulation, PLHM-DOX NPs activate innate immunity,
  promote DC maturation, and drive infiltration of CD8⁺ cytotoxic T cells into GBM.
  TCe6@Cu/TP5 NPs: A brain-targeted nanoassembly formed by self-assembly of triphenylphosphonium-conjugated
  Chlorin e6 (TPP-Ce6, TCe6), copper ions, and thymopentin (TP5). TCe6@Cu/TP5 NPs
  trigger mitochondrial photodynamic damage, activate the AMP-activated protein kinase
  (AMPK) pathway to promote PD-L1 degradation, and engage the cGAS-STING pathway to
  enhance antitumour immunity. BM@MnP-BSA-aPD-1: BV2 microglia-membrane-coated manganese
  porphyrin-BSA nanoparticles conjugated with anti-PD-1 antibody. BM@MnP-BSA-aPD-1
  crosses the BBB, targets the GBM TME, activates the cGAS-STING pathway to promote
  DC maturation, activate CD8⁺ T cells and NK cells, and sensitizes tumours to aPD-1
  therapy. NED@MnO₂-DOX: A multimodal platform in which vitamin D₃-inserted lipid
  hybrid neutrophil membrane (NED) cloaks MnO₂-based DOX-loaded nanoparticles. NED@MnO₂-DOX
  exploits neutrophil-like tropism to reach GBM, decomposes to generate Mn²⁺, and
  activates the cGAS-STING pathway. BBB: blood-brain barrier; CDA: cyclic dimeric
  adenosine monophosphate; Ce6: Chlorin e6; DOX: doxorubicin; NPs: nanoparticles;
  TP5: thymopentin; BM: BV2 microglia membrane; SRHLS: sequential release HydroLipo
  system; DCs: dendritic cells; TAMs: tumour-associated macrophages; TME: tumour microenvironment'
