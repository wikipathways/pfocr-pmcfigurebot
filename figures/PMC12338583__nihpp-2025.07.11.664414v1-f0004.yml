figure_title: Orchiectomy impacts gene expression of fibroblast cells
caption: Prostates at time 0 (Sham) and 15 days post-orchiectomy (T15) were subjected
  to scRNAseq. The cells identified as fibroblasts in the scRNAseq analyses were selected
  and subjected to bioinformatic analysis. These were annotated based on the expression
  of previously published fibroblast types seen in healthy murine prostate. (a) UMAP
  of fibroblasts from Sham and T15 combined (left) and UMAP of fibroblasts separated
  by time point (right). (b) Dot plot showing expression of marker genes for fibroblast
  types identified from previously published scRNAseq mouse prostates. Marker genes
  for the primary three fibroblast types identified as described in the text of each
  paper. (c) Dot plot showing expression of marker genes for each fibroblast type
  as identified in this paper. For each fibroblast type, the top 5 markers based on
  fold change were chosen in both Sham and Orx. (d) Heat map of the most differentially
  expressed genes in each of the fibroblast types PF, OIF, KR2F, DF and UF. For the
  heat map, the top 95 upregulated and 5 downregulated genes were chosen for each
  cluster, both as a single type (eg DF) or as how they separated between Sham and
  T15 (ie 8 cell types), for 203 genes. (e) ORA for top) pathways differentially active
  between OIF and PF, bottom) Go terms differentially regulated between OIF and PF
