figure_title: Identification of CCRK as a potential modulator of NHEJ.
caption: Identification of CCRK as a potential modulator of NHEJ. (A) Differential
  gene expression of GSE295979 and GSE2048 datasets. A heatmap was employed to show
  the pattern of differential gene expression. Red colour represents up-regulation
  while blue colour represents down-regulation. (B) 5 commonly enriched pathways.
  KEGG pathway enrichment analysis was performed using the GSE295979 and GSE2048 datasets.
  The lists of enriched pathways from each of the datasets were compared, and common
  pathways were identified. (C) Androgen response was found to be enriched using gene
  set enrichment analysis. Modulation of BQ and AR activity did not affect the mRNA
  level of NHEJ-related genes in (D) MCF-7 and (E) MDA-MB-453. Results were shown
  as mean ± SD from 4 independent experiments. (F) The differential gene expression
  from the two datasets suggested 5 kinases were potentially enhanced. AR activation
  by 1 nM of DHT enhanced CCRK expression in (G) MCF-7 and (H) MDA-MB-453. Overexpression
  of BQ enhanced CCRK expression in (I) MCF-7 and (J) MDA-MB-453. Results were shown
  as mean ± SD from 4 independent experiments. Each dot represents results from one
  independent experiment. Students’ t-test was used. **** represents p <0.0001
