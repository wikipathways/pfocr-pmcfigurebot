figure_title: FABP5 is critical in saturated FA-mediated IL-1β production in macrophages
caption: (A) Differentially expressed genes (DEGs) of RNA sequencing of the whole
  skin from wild-type (WT) and Fabp5−/− mice shown in volcano plot with an adjusted
  p value cutoff of 0.05. Red dots are genes with significantly different expressions,
  and gray dots are genes with no significant difference.(B) Heatmap of downregulated
  genes in the whole skin of Fabp5−/− mice compared WT mice fed the cocoa butter HFD.(C)
  Pathway analysis using the KEGG database of DEGs with an adjusted p value cutoff
  of 0.05 and a Log2 fold change cutoff of −0.5.(D and E) Flow cytometric analysis
  of FABP5 expression level in different cell subsets from the epidermis (D) and dermis
  (E) of mice (n = 5) fed the cocoa butter HFD or LFD with IMQ treatment for 4 days.(F
  and G) Flow cytometric analysis of FABP5 expression in WT and Fabp5−/− Raw264.7
  cells.(H and I) OCR of WT and Fabp5−/− Raw264.7 cells was measured a Seahorse analyzer
  after injection of the indicated drugs at specific time points (H), statistical
  analysis of the maximal respiration OCR shown in (I), and ATP production in (J).(K)
  Expression levels of FAO-related genes in WT and Fabp5−/− Raw264.7 cells (n = 4)
  treated SA for 4 h, analyzed by real-time PCR.(L) Supernatant ATP concentration
  of WT and Fabp5−/− Raw264.7 cells treated with FAs or BSA for 6 h in the presence
  of LPS.(M–O) Supernatant IL-1β concentrations by ELISA of SA or BSA treatment on
  WT or Fabp5−/− Raw264.7 cells (M) overnight or peritoneal macrophages (N) and GM-BMMs
  (O) for 6 h in the presence of LPS. Data are shown as mean ± SEM. For statistically
  significant comparisons, mean fold changes are >1.5 unless otherwise noted. p values
  are shown within each panel; unpaired two-tailed multiple t test for (D and E) and
  (K–O); or unpaired two-tailed Student’s t test for (G), (I and J). (See also Figure
  S5)
