figure_title: Inflammatory mediators and RvD2 biosynthesis pathway in the ileal mucosa
  of Crohn’s disease patients.
caption: 'Inflammatory mediators and RvD2 biosynthesis pathway in the ileal mucosa
  of Crohn’s disease patients. (A) Transcriptional analysis of pro-inflammatory cytokines.
  TNFα, IL1β, IL6, and L23 mRNA levels (fold change) were measured in the ileal mucosa
  of Crohn’s disease patients (CD) compared to controls (CTR). (B–E) Transcriptional
  analysis of genes involved in the RvD2 biosynthesis pathway: (B) PLA2G, (C) 15-LOX,
  (D) 5-LOX, and (E) GPR18 mRNA levels (fold change) in the ileal mucosa of Crohn’s
  disease patients (CD) compared to controls (CTR). (F) Immunohistochemical analysis
  of GPR18 was performed on paraffin-embedded slides from the ileal mucosa of both
  Crohn’s disease and control groups. The white arrows indicate positive epithelial
  cells, and the black arrows signal positive cells from the lamina propria; 10× and
  20× objective lenses were used as indicated in each image. (G) Quantitative analysis
  of RvD2 staining in the ileal mucosa of Crohn´s disease patients (CD) compared to
  controls (CTR). Results are presented as the mean ± SEM. CTR = control group; CD
  = Crohn’s disease group. n = 7 for CTR and n = 15 for CD in the transcriptional
  analyses; n = 4 for CTR and n = 4 for CD in the immunohistochemical analysis. *
  p < 0.05 and ** p < 0.01 were considered statistically significant compared to the
  CTR group'
