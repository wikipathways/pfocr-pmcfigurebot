figure_title: Fibroblasts secrete inflammatory factors.
caption: Fibroblasts secrete inflammatory factors. Fibroblasts release TNF-α, IL-6,
  and IL-1β, activating NF-κB, JNK, and STAT3 pathways to enhance proliferation, ECM
  synthesis, and inflammation. Immune cells amplify this response through a positive
  feedback loop, sustaining chronic inflammation and promoting pathological fibrosis.
