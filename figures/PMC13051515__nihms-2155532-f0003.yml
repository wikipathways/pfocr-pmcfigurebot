figure_title: ChromBPNet analysis of SSc and control fibroblast nuclei.
caption: ChromBPNet analysis of SSc and control fibroblast nuclei.(A) Graphic representation
  of analysis pipeline for ATAC pseudobulk ChromBPNet analysis. (B) Number of seqlets
  detected by transcription factor family (largest number for each family depicted)
  in SSc and control fibroblasts by TF-MoDISco genome sampling. (C) Number of AP-1
  seqlets (as detected for the MA0099.3 FOS::JUN matrix profile) unique to and shared
  by SSc and control fibroblasts. (D) Contribution weighted matrices for SSc and control
  fibroblasts by cluster. (E) Heatmap of AP-1 contribution score dot product for each
  seqlet/chromatin region, divided by SSc and control fibroblasts, into 10 clusters.
  Darker blue indicates a higher contribution score. (F) ChromBPNet analysis of ADAM12intronic
  region with AP-1 footprinting for SSc and control fibroblast pseudobulk ATAC data.
  Multiple levels from pseudobulk raw signal, bias removed signal, and contribution
  score tracks depicted. (G) Pathways enriched by gene ontology for the AP-1 cluster
  7 chromatin regions. (H) Contribution score track depictions for SSc and control
  fibroblasts of 3 chromatin regions (annotated to CDH8, TNC, and ITGB3) enriched
  in the cell junction organisation pathway, from AP-1 cluster 7. (I) Pseudobulk bias
  removed signal and contribution score tracks for CTHRC1 region with duplicate AP-1
  footprinting in SSc fibroblasts. (J) Relative luciferase activity (ratio of firefly
  to renilla luminescence) for control plasmid (empty vector), ADAM12 and CTHRC1 OCR
  wild type, and mutant (point mutation disrupting the transcription factor binding
  site) plasmids in transfected IMR90 fibroblasts. ATAC, assay for transposase-accessible
  chromatin; CS, contribution score; DAR, differentially accessible chromatin region;
  OCR, open chromatin region; SSc, systemic sclerosis-associated; TF, transcription
  factor
