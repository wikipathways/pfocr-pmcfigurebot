figure_title: Comparison of anti-fibrotic effects of ESA and the p53 inhibitor.
caption: Comparison of anti-fibrotic effects of ESA and the p53 inhibitor. (A) In
  HK-2 cells stimulated with paclitaxel, DARB significantly attenuated the protein
  expression of p53 and p21. It may be inferred that the number of G2/M-arrested cells
  was decreased through the p53-p21 pathway. This finding was supported by the protein
  expression of p-HH3. Similar trends were observed in the expression of CTGF, α-SMA,
  and collagen. (B) In HK-2 cells treated with paclitaxel, protein expressions of
  p-CDK1, Cyclin B1, Cyclin D1, TIMP2, and IGFBP7 showed results similar to those
  of HK-2 cells treated with TGF-β. DARB administration significantly decreased the
  expression of these proteins. (C) Immunoblot analysis of p-JNK, p-p38/p38, and p-ERK1/2/ERK1/2.
  After DARB administration, JNK and p38-MAPK signaling pathways, which contribute
  to kidney fibrosis, were significantly decreased in HK-2 cells stimulated with TGF-β
  or paclitaxel. Considering these results, the effects of DARB on anti-fibrotic activity,
  cell regulatory proteins, and the p38-MAPK pathway were comparable to those of a
  p53 inhibitor (PIF-α). Data are expressed as mean ± SD. * p < 0.05; ** p < 0.001;
  ns, not significant
