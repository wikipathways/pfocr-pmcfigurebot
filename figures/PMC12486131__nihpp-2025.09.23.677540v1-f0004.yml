figure_title: TBCK deficiency alters miRNA expression and impacts key regulatory pathways
caption: A) Bar graph showing post-normalized counts of miRNA transcripts in control
  vs. TBCK−/− fibroblasts, indicating overall miRNA abundance. B) Density plot of
  log2(CPM + 1) values illustrating the distribution of miRNA expression levels across
  all samples. X126 nomenclature represents a sample from a TBCK−/− individual. C)
  PCA showing separation between control and TBCK-deficient samples based on global
  miRNA expression profiles. D) MA plot displaying log2 fold-change (y-axis) versus
  log2 counts per million (CPM, x-axis) for each miRNA. Differentially expressed miRNAs
  (adjusted p-value ≤ 0.1) are color-coded to indicate upregulation or downregulation.
  E) Table summary of significantly upregulated miRNAs (red bars) in TBCK−/− cells,
  including gene name, log2 fold-change, and adjusted p-value. F) Table summary of
  significantly downregulated miRNAs (blue bars) with corresponding gene name, log2
  fold-change, and adjusted p-value. G) KEGG pathways significantly enriched among
  targets of upregulated miRNAs, identified using the Pathways Union method in DIANA
  mirPath v3.0. Columns include pathway name, enrichment p-value, number of genes
  involved, and number of contributing miRNAs. H) Corresponding table of enriched
  KEGG pathways associated with downregulated miRNAs, also identified via Pathways
  Union analysis
