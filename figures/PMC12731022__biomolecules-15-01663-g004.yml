caption: 'Network diagrams with high IPA scores. Ingenuity pathway analysis (IPA)
  of differentially expressed miRNAs in Frail compared to non-frail groups. Top network
  associated with TGF beta, insulin, and collagen alpha1 signals. Node Colors: Red
  indicates molecules that are upregulated, with darker red representing more extreme
  upregulation. Green denotes downregulated molecules, with darker green representing
  more extreme downregulation. Orange represents the predicted activation of a molecule
  or process, with darker shades indicating higher confidence. Blue indicates the
  predicted inhibition, with darker shades representing higher confidence. Edge Types
  (Predicted Relationships): Orange lines signify the relationships that lead to activation.
  The blue lines signify the relationships that lead to inhibition. Yellow lines represent
  findings inconsistent with the predicted state of the downstream molecule. Gray
  lines indicate relationships in which the effect was not predicted. *: Duplicates-Gene/Protein/Chemical
  identifiers marked with an asterisk indicate that multiple identifiers in the dataset
  file map to a single gene/chemical in the Global Molecular Network'
