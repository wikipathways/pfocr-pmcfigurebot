caption: The mechanisms of PEDV regulating the PANoptosis pathway. PEDV infection
  generates Z-RNA and releases mtDNA, which can be sensed by ZBP1 and triggers the
  assembly of PANoptosome. ZBP1 promotes mitochondrial damage as well as ROS-mediated
  oxidative stress, which in turn facilitates the formation of the ZBP1-mediated PANoptosome
