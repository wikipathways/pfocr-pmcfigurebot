figure_title: Emerin has increased interaction with cytoskeletal proteins in iTau
  neurons
caption: (A) Volcano plot showing the altered interactome of emerin in iTau neurons
  compared to iGFP based on mass spectrometry. (B) Emerin interactome stratified by
  cytoplasm (GO:0005737), cytoskeleton (GO:0005856), motor proteins (GO:0003774),
  nuclear (GO:0005634), nuclear envelope (GO:0005635), and DNA damage (GO:0006974)
  GO terms. (C) Top 50 significant proteins with the largest change in abundance in
  the emerin interactome in iTau cells. (D) Pathway analysis of emerin-associated
  proteins that are significantly altered in iTau neurons. (E) Cytosolic emerin is
  elevated in iTau cells based on cellular fractionation. n=3 biological replicates
  per group. Log2FC for significance is +/− 0.585, and p≤0.05. t-test, *p≤0.05, ***p≤0.001
article_title: Elevation of the mechanically-sensitive protein emerin links nuclear
