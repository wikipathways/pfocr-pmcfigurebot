figure_title: Action mechanism of microalgae-derived peptides in managing diabetes
  and obesity.
caption: Action mechanism of microalgae-derived peptides in managing diabetes and
  obesity. (A) Microalgae-derived antidiabetic peptides inhibit key carbohydrate-degrading
  enzymes, including salivary and pancreatic α-amylase and brush border α-glucosidase,
  reducing glucose release and subsequent levels in the bloodstream. Additionally,
  these peptides inhibit DPP-IV, preventing the degradation of incretin hormones (GIP
  and GLP-1), thereby enhancing insulin secretion and contributing to the maintenance
  of normal blood glucose levels. (B) Microalgae-derived anti-obesity peptides reduce
  fat digestion by inhibiting pancreatic lipase, limiting the formation and absorption
  of monoglycerides. They also inhibit adipogenesis by activating AMPK and MAPK pathways
  and downregulating adipogenesis-related proteins and reducing preadipocyte differentiation.
  Furthermore, these peptides reverse gut microbiota dysbiosis associated with high-fat
  diets, restoring microbiota balance and improving obesity-related disorders (e.g.,
  fat accumulation, dyslipidaemia, hepatic inflammation, and insulin resistance).
  Arrows indicate activation or direction of pathways; blue downward arrows show downregulation
  due to peptide action, blue upward arrows represent upregulation due to peptide
  action, and blue “X” indicates inhibition by peptide action. Created in BioRender.
  Qoms, M. (2025) https://BioRender.com/dax4wk3, accessed on 21 August 2025
