figure_title: SOD2 knockdown induces transcriptional changes and signaling pathway
  alterations in ovarian cancer cells cultured in 2D adherent and as 3D multicellular
  aggregates (MCA).
caption: SOD2 knockdown induces transcriptional changes and signaling pathway alterations
  in ovarian cancer cells cultured in 2D adherent and as 3D multicellular aggregates
  (MCA). A. Volcano plots of differentially expressed genes in OVCA433 cells following
  SOD2 siRNA-mediated knock-down in adherent and MCA culture conditions (n = 4; Dotted
  lines indicate significant cut-off of p < 0.05 and log fold change >0.5, Supplemental
  Table 1). B. Venn diagram illustrating overlap of up and downregulated genes shared
  by OVCA433 cells cultured under adherent (2D) or multicellular aggregate (MCA; 3D)
  conditions following siRNA-mediated SOD2 knockdown (cut off p.adj <0.05). C. Top
  30 significantly altered signaling pathways identified by Ingenuity Pathway Analysis
  in adherent 2D (i) and MCA 3D (ii) cultures following SOD2 knock-down. D. Venn diagram
  summarizing the overlap between signaling pathways in adherent 2D and MCA 3D conditions.
  E.-G. Heatmaps of genes within signaling pathways identified to be significantly
  altered following SOD2 knock-down. Gene order in heatmaps is based on hierarchical
  clustering (Euclidian distance, average linkage)
article_title: Mapping transcriptomic signatures downstream of mitochondrial superoxide
