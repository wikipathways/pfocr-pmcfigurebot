figure_title: Functional enrichment analysis reveals PAK6 is involved in cell cycle
  regulation and malignant progression of CRC.
caption: Functional enrichment analysis reveals PAK6 is involved in cell cycle regulation
  and malignant progression of CRC. (A) Heatmap of the top 15 genes most significantly
  positively and negatively correlated with PAK6 expression in the TCGA-CRC cohort.
  (B) Scatter plots showing the strongest positive correlation between PAK6 and RAD51
  (Pearson’s R = 0.683, p < 0.001) and (C) the strongest negative correlation between
  PAK6 and PRKN (Pearson’s R = −0.430, p < 0.001). (D) Bar plot of significantly enriched
  Gene Ontology (GO) terms and Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways
  for genes co-expressed with PAK6. Biological Processes (BP), Cellular Components
  (CC), and Molecular Functions (MF) are shown. The most enriched terms and pathways
  are related to chromosome segregation, nuclear division, and DNA replication. (E)
  Gene Set Enrichment Analysis (GSEA) plots showing that genes correlated with high
  PAK6 expression are significantly enriched in gene sets related to transcriptional
  regulation by TP53, cell cycle checkpoints, and translation. The p values in (D,E)
  are both adjusted by FDR. (*** p < 0.001)
