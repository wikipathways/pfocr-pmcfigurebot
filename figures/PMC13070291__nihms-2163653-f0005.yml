figure_title: DTAC-V1 induces the selective and proteasome-dependent degradation of
  the Cyclin D1−CDK4/6 complex.
caption: |-
  DTAC-V1 induces the selective and proteasome-dependent degradation of the Cyclin D1−CDK4/6 complex. (A) Western blot analysis of Cyclin D1, CDK4, and CDK6 in U-251 cells treated with PB (1 μM), CP-10 (1 μM), or DTAC-V1 (20 or 100 nM) for 16 h. (B) Quantification of Cyclin D1, CDK4, and CDK6 levels in panel (A). The mean values ± SD from two independent experiments are shown. (C) DTAC-V1 selectively degrades Cyclin D1 and CDK4/6 but not CDK1, CDK2, or CDK9 after 6 h at 100 nM in U-251 cells. Representative of two independent experiments. (D) Streptavidin pulldown assay showing competition among DTAC-V1, PB, and Biotin−DNA-PB for CDK4/6 binding. (E) Palbociclib (PB,1 μM) or Pomalidomide (POM,1 μM) blocked DTAC-V1-induced Cyclin D1−CDK4/6 degradation in U-251 cells. Representative of at least two independent experiments. (F) Immunoblot analysis of U-251 cells pretreated with MG132 (2 μM) and carfilzomib (PR-171, 2 μM) before DTAC-V1 (100 nM, 8 h) treatment. Representative of three independent experiments. (G) Volcano plot from the proteomic analysis of U-251 cells treated with DTAC-V1 (100 nM) or DNA control for 16 h, highlighting differentially expressed proteins (log2 fold change <−1 or >1, P < 0.05). CDK4, CDK6, and Cyclin D1 (CCND1) are marked. (H) GO analysis of differentially expressed proteins. The rich factor shows the ratio of the identified to total pathway proteins. Bubble size indicates protein count; color denotes the −log10
  Q-value. (I) Network plot (Cnetplot) of the top five enriched KEGG pathways. Yellow nodes represent pathways; line colors denote categories; node size indicates gene count
