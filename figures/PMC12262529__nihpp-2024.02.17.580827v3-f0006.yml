figure_title: Metadynamics simulations used to compute interaction interfaces and
  unbinding free energies for folate pathway dimers
caption: A) AlphaFold 3.0 is used to make initial dimeric structure predictions for
  all possible folate pathway enzyme pairs. To further refine these structures and
  compute their stabilities, metadynamics simulations were performed, with AlphaFold3
  predicted structures as starting points and with inter-chain distance as the collective
  variable. The structures corresponding to the free energy minima in the PMFs were
  then used to study the interaction interfaces for folate pathway proteins. B) Dimers
  with ΔGbinding<-3kcal/mol in metadynamics were considered stable binders. Those
  dimers predicted to be stable binders in simulation were considered as “true predictions”
  if the MFI for the corresponding protein-pair in the fluorescence experiments were
  greater than 670. p-values above each bar indicate statistical significance of agreement
  between theory and experiment against null hypothesis that simulations predict binding
  surfaces between pairs of proteins at random. A more complete analysis of agreement
  between computational predictions and experiment for a range of thresholds is in
  Fig EV10. C) Simulations and experiments predict similar interaction surface for
  FolA with FolK. Residues of FolA involved in interactions with FolK based on experimental
  data (marked as red beads in left structure) and metadynamics simulations (marked
  as cyan beads in right structure). The simulation predicted surface and the experimentally
  detected interaction surfaces show significant overlap (p-value of 2.7×10−5 for
  the null hypothesis that experimental and predicted interaction surfaces have random
  overlap, see Methods for detail)
article_title: Conserved interfaces mediate multiple protein-protein interactions
  in a prokaryotic metabolon
