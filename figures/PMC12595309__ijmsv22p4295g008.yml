figure_title: The effect of Palmitate on ER stress-related proteins, hepatocyte injury
  and and ASK/JNK/p38 MAPK pathways in liver cells.
caption: The effect of Palmitate on ER stress-related proteins, hepatocyte injury
  and and ASK/JNK/p38 MAPK pathways in liver cells. (A, B, C) The protein levels of
  p-IRE1, TRAF2 and Elovl5 and Ptbp3 ae well as Bcl-2, Bcl-XL, caspase-3, caspase-9,
  cytoplasmic Cytochrome C, phosphorylation of ASK, JNK, and p38 were determined using
  Western blotting in sodium palmitate-treated cells. While β-actin served as an internal
  control, densitometric analysis was used to quantify protein levels with the control
  at 100%. Data are expressed as the mean ± SD of three independent experiments. *
  p < 0.05, compared with the control group. (D) Protein lysates of the cells from
  control, siControl, siElovl5, and siPtbp3 clones were subjected to western blot
  analysis
