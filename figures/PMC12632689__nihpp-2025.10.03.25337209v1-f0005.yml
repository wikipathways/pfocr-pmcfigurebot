figure_title: Chord diagrams and Reactome pathway enrichment for Bisphenol A (BPA)
  and Benzo[a]pyrene (B[a]P)
caption: Chord diagrams (A, B) show chemical–gene interactions for five RPL-associated
  genes (AURKB, F2, F5, FOXD1, and PADI6), with ribbons connecting each specific molecular
  action (e.g., “increases methylation,” “decreases expression”) to its respective
  gene target. Interaction data was obtained from merging the Intolerome and CTD datasets.
  BPA exhibited diverse regulatory interactions, especially increasing methylation
  and gene expression, while B[a]P mainly caused repressive changes, such as decreased
  methylation and reduced gene expression. Barplots (C) present Reactome pathway enrichment
  analyses of targeted genes with significant enrichment (FDR-adjusted p < 0.05) primarily
  in pathways related to hemostasis, including “Common Pathway of Fibrin Clot Formation,”
  “Formation of Fibrin Clot (Clotting Cascade),” and “Platelet Activation, Signaling,
  and Aggregation.” P-values were calculated using a hypergeometric test and adjusted
  for multiple comparisons using the Benjamini–Hochberg method
