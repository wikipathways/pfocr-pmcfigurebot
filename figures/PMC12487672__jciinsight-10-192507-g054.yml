figure_title: SPRY1 is associated with DGAT2 expression and stability in keratinocytes
caption: (A) Two main pathways in glyceride metabolism. (B) Heatmap showing differential
  expression of glyceride metabolism–related genes in Spry1ΔEpi and WT mice. (C) RNA
  sequencing analysis verifying reduced DGAT2 expression in epidermis of Spry1ΔEpi
  compared with WT mice. n = 3 mice per genotype. (D) Single-cell RNA sequencing showing
  DGAT2 expression across various cell populations in Spry1ΔEpi mice. (E) Western
  blot showing decreased DGAT2 expression in epidermis from Spry1ΔEpi compared with
  WT mice. (F) Western blot analysis showing reduced DGAT2 expression following SPRY1
  deletion in keratinocytes. (G) Co-immunoprecipitation assay demonstrating a direct
  interaction between SPRY1 and DGAT2 in mouse keratinocytes. (H) Western blot analysis
  showing accelerated degradation of DGAT2 protein upon SPRY1 knockdown, assessed
  over time following cycloheximide treatment to inhibit new protein synthesis. (I)
  Molecular modeling using AlphaFold3 predicts a stable interaction interface between
  SPRY1 (green) and DGAT2 (blue), with hydrogen bonds between specific residues of
  the 2 proteins. The magnified view highlights hydrogen bonds supporting the interaction.
  For Western blotting, 20 μg of protein is loaded per well. n = 4 samples per group.
  Two-tailed Student’s t test was performed. *P < 0.05, **P < 0.01, ***P < 0.001
article_title: DGAT2 reduction and lipid dysregulation drive psoriasis development
  in keratinocyte-specific SPRY1-deficient mice
