figure_title: AKT maintains Agrin-mediated AChR clusters via the proteasome degradation
  pathway.
caption: AKT maintains Agrin-mediated AChR clusters via the proteasome degradation
  pathway. (A) Representative confocal images of AChR clusters labeled with α-bungarotoxin.
  MK2206 treatment (6 h) markedly reduced AChR cluster intensity, whereas pretreatment
  with the proteasome inhibitor MG132 (10 μM, 30 min) restored cluster abundance.
  (B) qPCR analysis of AChR transcripts in C2C12 myotubes treated with Agrin or Agrin
  ± MK2206 and MG132. (C) qPCR analysis of proteasome-related genes (Psma1, Psmc4,
  and Psmd11) in C2C12 myotubes treated with Agrin ± MK2206 or Agrin + MK2206 and
  MG132. Data are presented as mean ± SEM. * p < 0.05 vs. unstimulated control, **
  p < 0.01 vs. unstimulated Agrin, *** p < 0.001 vs. Agrin+MK2206. **** p < 0.0001.
  Images were acquired using a 40× objective. Images were acquired using a 40× objective;
  scale bar, 20 µm
