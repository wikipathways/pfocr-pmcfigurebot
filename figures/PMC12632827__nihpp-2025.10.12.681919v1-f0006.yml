figure_title: Model illustrating SPRY4-ERK function during spermatogonia recovery
  and regeneration in BU-damaged mouse testis
caption: (A) Wild-type spermatogonia achieve regeneration through a SPRY4-controlled
  signaling transition. At BU-D2, SPRY4 imposes repression to RTK signaling, inactivating
  both MAPK/ERK pathway and mTORC1, and poises the surviving Aundiff spermatogonia
  in quiescent state. By BU-D10, MAPK/ERK pathway is released to activate ERK1/2 in
  the cytoplasm of Aundiff spermatogonia, which then function as a major activator
  of mTORC1. Activated mTORC1 promotes Aundiff spermatogonia transition from quiescent
  to cell-cycle-activated phase (proliferation) and initiates regeneration. (B) In
  Spry4G-KO spermatogonia, both ERK1/2 and mTORC1 are activated in the cytoplasm of
  the surviving Aundiff spermatogonia immediately after damage (BU-D2), resulting
  in rapid proliferation in response to injury. By BU-D10, hyperactivated ERK1/2 locates
  to the nucleus of Aundiff spermatogonia and promotes fate commitment, suspending
  Aundiff spermatogonia proliferation with inactivated mTORC1. Q, quiescent Aundiff
  spermatogonia; A, activated Aundiff spermatogonia; P, fate-primed spermatogonia;
  PD, PD0325901; RAPA, Rapamycin
article_title: Restoration of Spermatogenesis is Dependent on Activation of a SPRY4-ERK
  Checkpoint Following Germline Stem Cell Damage
