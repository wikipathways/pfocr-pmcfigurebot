figure_title: Canonical miRNA biogenesis pathway and the synthesis of hsa-miR-128–1
  and hsa-miR-128–2.
caption: Canonical miRNA biogenesis pathway and the synthesis of hsa-miR-128–1 and
  hsa-miR-128–2. (A) miRNA genes are transcribed by RNA polymerase II, generating
  primary miRNA (pri-miRNA). The pri-miRNA is subsequently processed by the microprocessor
  complex, consisting of DROSHA and DGCR8, to produce precursor miRNA (pre-miRNA).
  The pre-miRNA is then transported to the cytoplasm via Exportin-5, where the Dicer
  enzyme cleaves the terminal loop, yielding a mature miRNA duplex. This duplex is
  loaded onto an Argonaute (Ago1–4) protein complex, where the passenger strand is
  removed, resulting in a functional, single-stranded mature miRNA (depicted in blue).
  (B) The human hsa-miR-128–1 gene is located within the intronic region of the R3HDM1
  protein-coding gene on chromosome 2, whereas hsa-miR-128–2 is embedded within the
  intronic region of the ARPP-21 gene on chromosome 3. Both miRNA genes are transcribed
  by RNA polymerase II/III, producing pri-miR-128–1 and pri-miR-128–2, respectively.
  These primary transcripts undergo processing by the microprocessor complex (DROSHA
  and DGCR8) to generate precursor miRNAs (pre-miR-128–1 and pre-miR-128–2), which
  are then transported to the cytoplasm by Exportin-5. In the cytoplasm, the Dicer
  enzyme removes the terminal loop, producing mature miRNA duplexes. These duplexes
  are subsequently loaded onto Argonaute proteins, where strand separation occurs,
  leading to the formation of mature single-stranded hsa-miR-128–1 (blue) and hsa-miR-128–2
  (red)
