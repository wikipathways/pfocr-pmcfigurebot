figure_title: Mitochondrial and autophagy dysfunction in postoperative neurocognitive
  disorders.
caption: Mitochondrial and autophagy dysfunction in postoperative neurocognitive disorders.
  Downregulation of MFN2 disrupts mitochondrial fusion and weakens mitochondria–ER
  tethering at MAM. Reduced PGC-1α/NRF-1 signaling diminishes respiratory chain complex
  expression, leading to energy deficits and ROS accumulation, while loss of SIRT3
  deacetylase activity further exacerbates oxidative stress. In parallel, surgical
  suppression of the CIRP/Trx1 pathway facilitates Drp1 activation, driving excessive
  mitochondrial fission and the release of mitochondrial DNA, which activates the
  cGAS–STING pathway and triggers immune inflammation. Activation of the PKC/PKR pathway
  inhibits mitochondrial autophagy, whereas mTOR-driven LC3/Beclin-1 suppression blocks
  macroautophagy, reducing SYN and PSD-95 expression, impairing synaptic plasticity,
  and aggravating neuronal injury. Collectively, these mitochondrial and autophagy
  impairments converge to amplify neuroinflammation, promote synaptic damage, and
  accelerate postoperative cognitive decline
