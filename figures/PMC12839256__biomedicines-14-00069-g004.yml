figure_title: The CoA biosynthetic pathway in mammalian cells and associated pathologies.
caption: 'The CoA biosynthetic pathway in mammalian cells and associated pathologies.
  Schematic diagram of canonical CoA biosynthetic pathway in mammalian cells. Neurodegeneration
  is associated with inborn mutations in key CoA biosynthetic enzymes (Pank and CoASy).
  Abbreviations: Pantothenate kinase-associated neurodegeneration (PKAN); CoA synthase
  protein-associated neurodegeneration (CoPAN); Neurodegeneration with brain iron
  accumulation (NBIA). Pantothenate kinase (PANK); 4′-phosphopantothenoylcysteine
  synthase (PPCS); 4′-phosphopantothenoylcysteine decarboxylase (PPCDC); Phospho-panthethine
  transferase (PPAT); Dephospho CoA kinase (DPCK); CoA synthase (CoASy). Created in
  BioRender. Brett, C. (2025). https://BioRender.com/uzrb4jh'
