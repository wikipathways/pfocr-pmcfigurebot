figure_title: Knockdown of FTL inhibits tumor growth and promotes ferroptosis in ESCC.
caption: 'Knockdown of FTL inhibits tumor growth and promotes ferroptosis in ESCC.
  (A) Comparison of the FTL expression among non-tumor tissues, tumor and metastasis
  in combined TCGA and GTEx database. (B) Representative IHC staining of protein FTL
  in normal adjacent, primary tumor ESCC specimens. (C) The single-cell transcriptional
  analysis of FTL expression in normal adjacent, primary tumor, metastatic, and normal
  lymph node ecosystem. Figure 1C included three figures, the left one shows the distribution
  of single cells in different groups. The middle one illustrates how the FTL expression
  level was quantified in different groups via UMAP plot and the right one calculates
  specific statistic for FTL expression in different groups via the violin plot. (D)
  Kaplan-Meier survival curves showing different overall survival between with FTL
  high and low expression ESCC patients. (E) Foci formation assay showing different
  colony numbers in KYSE520 ESCC cells transfected with shNTC and FTL shRNAs. (F)
  XTT assay revealing cell proliferation of KYSE520 ESCC cells transfected with shNTC
  and FTL shRNAs. (G) In vivo subcutaneous implantation Nude mice model induced by
  5 × 106 KYSE520 ESCC cells transfected with shNTC and FTL shRNAs. KYSE520 ESCC cells
  transfected with shNTC and FTL shRNAs were injected subcutaneously in right and
  left sides of the Nude mice back respectively. Mice were sacrificed after 6 weeks
  for the subcutaneous tumors. Tumors of shNTC group were shown in the upper side
  and there were no tumors in the FTL shRNA group in the lower side. (H) GO enrichment
  pathways for FTL related genes. (I) GSEA analysis of ESCC FTLhigh and FTLlow groups
  in TCGA database. (J) Iron detection assay showing the accumulation of Fe2+ in KYSE520
  ESCC cells transfected with shNTC and FTL shRNAs. (K) MDA assay revealing the lipid
  formation in KYSE520 ESCC cells transfected with shNTC and FTL shRNAs. (L) ROS assay
  displaying the accumulation of reactive oxygen species in KYSE520 ESCC cells transfected
  with shNTC and FTL shRNAs. Statistical significances: *, P < 0.05; **, P <0.01;
  ***, P < 0.001'
