figure_title: Cardiac metabolic flexibility under physiological and unbalanced dietary
  conditions.
caption: Cardiac metabolic flexibility under physiological and unbalanced dietary
  conditions. Balanced diets preserve cardiac metabolic flexibility through interconnected
  nutrient-sensing and redox pathways, including AMPK–SIRT1–PGC-1α and Nrf2. High-fat/high-sugar
  diets disrupt this network, promoting NF-κB-linked inflammatory and epigenetic signaling
  and maladaptive myocardial remodeling. ↑ indicates increase; ↓ indicates decrease.
  AMPK (AMP-activated protein kinase); SIRT1 (sirtuin1); PGC-1α (Peroxisome proliferator-activated
  receptor gamma coactivator 1-alpha); Nrf2 (nuclear factor erythroid 2-related factor
  2); ROS (Reactive oxygen species); NF-κB (Nuclear factor kappa-light-chain-enhancer
  of activated B cells); miRNA (microRNA)
