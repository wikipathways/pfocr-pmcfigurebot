caption: The dynamic epithelial–mesenchymal transition spectrum, highlighting the
  intermediate hybrid E/M state and its key molecular regulators—including EMT transcription
  factors (such as SNAIL, SLUG, ZEB1/2), epigenetic modulators, and signaling pathways
  (such as TGF-β, MET, and AXL)—while a schematic timeline beneath maps tumor progression
  stages and aligns therapeutic strategies (e.g., early EMT inhibition with galunisertib
  and later MET targeting with capmatinib or bemcentinib) to emphasize the timing-dependent,
  reversible nature of EMT in cancer progression. All abbreviations employed are defined
  in the text in the Abbreviations section
