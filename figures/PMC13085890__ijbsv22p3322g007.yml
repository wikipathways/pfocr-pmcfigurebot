caption: Inhibition of the RAP1 signaling pathway in BC via intervention in MSCs with
  FXR agonist 3. (A) ELISA detection of TIMP1 levels in the culture supernatant after
  24 hours of intervention with varying concentrations of FXR agonist 3 in MSCs. (B-C)
  ELISA detection of TIMP1 secretion levels in the culture supernatant after 24 hours
  of co-culture of MSCs with UMUC-3 and J82 cells in the presence of FXR agonist 3.
  (D-G) Effects of MSCs-CM, FXR agonist 3, and CM from MSCs pretreated with FXR agonist
  3 on the proliferation and clonal formation of UMUC-3 and J82 cells after 48 hours
  of treatment. (H-I) Impact of MSCs-CM, FXR agonist 3, and CM from MSCs pretreated
  with FXR agonist 3 on key proteins of the intratumoral cMet-RAP1 pathway in UMUC-3
  and J82 cells after 24 hours of treatment
