figure_title: Replication of POWV NS3 T561M in human MDDCs induces heightened antiviral
  responses
caption: A. Volcano plot of differentially expressed genes, and B. Reactome pathway
  analysis comparing differences following infection with WT rPOWV and rPOWV NS3 T561M
  at 24 hpi (n=5). C. Quantification of POWV positive sense RNA, and D. IFNβ protein
  expression measured by ELISA, in MDDCs pre-treated with Ruxolitnib and infected
  with POWV (n=3). Graphed values represent the mean ± SD. Statistical significance
  was assessed using one-way ANOVA followed by Sidak’s post hoc test for multiple
  groups. * p<0.05, ** p<0.01, *** p<0.001, **** p<0.0001
