figure_title: The oculomotor nerve pathway
caption: It consists of intra-axial, subarachnoid, cavernous, and orbital segments.
  The oculomotor nerve originates from the oculomotor nucleus located ventral to the
  cerebral aqueduct in the midbrain at the superior colliculus level. The subnucleus
  innervating the levator palpebrae superioris is a solitary nucleus located centrally
  and caudally. The other subnuclei are positioned bilaterally. The Edinger-Westphal
  nucleus—the accessory oculomotor nerve nucleus—is located in the rostral portion
  of the oculomotor nucleus. The oculomotor nerve passes between the PCA and SCA while
  exiting the midbrain, runs through the cavernous sinus, and enters the orbital fossa
  through the superior orbital fissure.PCA = posterior cerebral artery, SCA = superior
  cerebellar artery
