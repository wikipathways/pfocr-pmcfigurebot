figure_title: Single-cell transcriptomic landscape of endothelial and stromal cells
  in CLAD
caption: (A) Violin plot of allograft rejection scores among different endothelial
  cell types. Violin plots show the full distribution of the data, with the width
  representing the density of values. Adjusted P value was obtained from the Wilcoxon
  rank-sum test for the comparison between CLAD and control. (B) Box plot of biological
  process scores in bronchial endothelial cells of scRNA-Seq data, distinguishing
  donor and recipient cells. Box plots show the interquartile range, median (line),
  and minimum and maximum (whiskers). A linear mixed effects model was fitted using
  the lmerTest package in R, with different datasets treated as a random effect. Pairwise
  comparisons were conducted using Tukey’s post hoc analysis. Biological processes
  with an adjusted P < 0.05 were considered statistically significant. (C) Dot plot
  of enrichment scores for different pathways across various stromal cells. The pink
  background indicates higher scores in the CLAD group, while the light blue background
  indicates higher scores in the control group. Dot size is proportional to the absolute
  coefficient value from the linear regression, and filled dot color corresponds to
  different FDR values. (D) Violin plot of significant genes and pathways between
  donor and recipient cells across different stromal cell types. The selected genes
  were the significant ones with FDR < 0.05 calculated from differential expression
  analysis of scRNA-Seq data using FindAllMarkers in Seurat. For the pathway comparison
  between 3 groups, the Kruskal-Wallis analysis followed by pairwise Wilcoxon rank-sum
  tests at cell level was performed. The Benjamini-Hochberg (BH) method was used for
  P value adjustment, and pathways with FDR < 0.05 were selected for plotting
