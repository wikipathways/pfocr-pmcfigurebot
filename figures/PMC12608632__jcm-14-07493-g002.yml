figure_title: Clinical decision pathway for adult PS.
caption: Clinical decision pathway for adult PS. After CTA (arterial phase) ± DSA
  to confirm PS and map systemic feeding arteries, urgent hemoptysis or instability
  prompts endovascular bleeding control (embolization or aortic stent-graft), followed
  by reassessment and planned staged hybrid resection; nonoperative candidates may
  receive palliative endovascular therapy. In stable patients, small/simple anatomy
  favors embolization with structured imaging follow-up, whereas large/complex or
  aneurysmal feeding arteries favor hybrid devascularization followed by VATS/lobectomy.
  CTA, Computed tomography angiography; DSA, digital subtraction angiography; PS,
  pulmonary sequestration; VATS, video-assisted thoracoscopic surgery
