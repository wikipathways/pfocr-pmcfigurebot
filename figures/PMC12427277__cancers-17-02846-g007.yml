figure_title: ITGA2 activates the FOXO signaling pathway in hepatocellular carcinoma
  to promote resistance to lenvatinib.
caption: ITGA2 activates the FOXO signaling pathway in hepatocellular carcinoma to
  promote resistance to lenvatinib. (A) Heatmap of differentially expressed genes.
  (B) KEGG enrichment analysis of differentially expressed genes. (C) WB analysis
  of AKT/FOXO pathway-related proteins in Hep3B, Hep3B-LR, Huh7, Huh7-LR, and SNU449
  cells treated with lenvatinib (1 μM). (D) Immunohistochemical staining of P-FOXO3A
  in tumor tissues from Huh7-overexpression, Huh7-LR-knockdown, Huh7-LR-inhibitor,
  and corresponding control groups. (E) WB detection of changes in AKT/FOXO pathway-related
  proteins in the Huh7-LR-knockdown group (control group, knockdown group, and knockdown
  group treated with 740-YP) (lenvatinib concentration of 10 μM). (F) WB detection
  of changes in AKT/FOXO pathway-related proteins in the Huh7 overexpression group
  (control group, overexpression group, and overexpression group treated with LY294002)
  (lenvatinib concentration of 1 μM). (G) WB detection of changes in AKT/FOXO pathway-related
  proteins in the Huh7-LR inhibitor group (control group, inhibitor group, and inhibitor
  group treated with 740-YP) (lenvatinib concentration of 10 μM). (A–G) All the experimental
  groups were treated with the appropriate concentrations of lenvatinib. * p < 0.05,
  ** p < 0.01, *** p < 0.001, **** p < 0.0001
article_title: ITGA2 Mediates the Resistance of Hepatocellular Carcinoma to Lenvatinib
  by Activating the AKT/FOXO3A Signaling Pathway
