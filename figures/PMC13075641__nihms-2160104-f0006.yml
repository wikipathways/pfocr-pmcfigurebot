figure_title: AXL mediates LCN2 induction of ferroptosis
caption: (A) Unbiased phosphorylation array demonstrating that AXL phosphorylation
  decreased in KR158 non-target versus Lcn2 knockdown cells. Quantification of AXL
  phosphorylation is shown on the right.(B) Immunoblot showing phosphorylation of
  AXL at Y702 showed decreased phosphorylation in CPA control versus Lcn2 knockdown
  cells. See Figure S7B for the entire blot.(C) Schematic of pathway with RSL3 inhibition.(D)
  Perturbation of GPX4 via RSL3 does not change AXL phosphorylation via immunoblot.(E)
  Lipid peroxidation was increased via Image-It lipid peroxidation kit. Statistics
  measured by paired t test (*p < 0.05).(F) Schematic of pathway with RSL3 inhibition.
  All data points are shown, with the median indicated.(G) Perturbation of AXL phosphorylation
  via R428 decreases GPX4 levels via immunoblot.(H) Lipid peroxidation was increased
  upon measurement via Image-It Lipid Peroxidation kit. Statistics measured by paired
  t test (**p < 0.01). All data points are shown, with the median indicated.(I) Quantifications
  of immunoblot of phosphorylated AXL relative to total AXL, normalized to actin.
  Full blot in Figure S7K. Statistics were measured by paired t test (*p < 0.05).
  All data points are shown, with the bars indicating the range.(J) Schematic showing
  the four-pronged experiment. Mice were either implanted with non-target control
  cells or Lcn2 knockdown cells. Mice were then treated with vehicle control (corn
  oil) or 125 mg/kg of R428.(K) Survival analysis of CPA non-target control cells
  with vehicle treatment or R428 treatment, and Lcn2 knockdown constructs with vehicle
  treatment or R428 treatment. Significance measured by Gehan-Breslow-Wilcoxon test
article_title: Lipocalin 2 orchestrates resistance to ferroptosis via AXL
