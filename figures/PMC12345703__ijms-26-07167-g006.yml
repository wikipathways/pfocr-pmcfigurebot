figure_title: Technological platforms linking redox signaling to epigenetic regulation
  under abiotic stress.
caption: Technological platforms linking redox signaling to epigenetic regulation
  under abiotic stress. Abiotic stresses such as drought, salinity, and extreme temperatures
  trigger the production of ROS and RNS, which in turn modulate key epigenetic mechanisms.
  This figure illustrates how epigenomic platforms, including whole-genome bisulfite
  sequencing (WGBS), chromatin immunoprecipitation sequencing (ChIP-seq), and small
  RNA sequencing (sRNA-seq), enable high-resolution mapping of stress-induced modifications
  in DNA methylation, histone marks, and small RNA pathways. These technologies provide
  a foundational framework to decode the redox-sensitive epigenetic landscape that
  shapes plant stress responses and chromatin dynamics
