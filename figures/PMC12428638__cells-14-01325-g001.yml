caption: 'Intracellular signaling mechanisms of IGF-I. IGF-I elicits cellular effects
  by two principal intracellular signaling pathways: the Ras/mitogen-activated protein
  kinase (MAPK) pathway and the phosphoinositide 3-kinase/protein kinase B (PI3K/AKT)
  pathway. Ligand binding to IGF-IR leads to its activation and initiates a complex
  network of downstream signaling events that regulate diverse cellular processes'
