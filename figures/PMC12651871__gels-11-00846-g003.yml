figure_title: Nasal-brain drug delivery routes via the olfactory system.
caption: 'Nasal-brain drug delivery routes via the olfactory system. (a) Extracellular
  pathway (across sustentacular cells): Drugs pass through sustentacular cells, traverse
  the nasal epithelium to reach the lamina propria, and are then transported toward
  the olfactory bulb and CSF. (b) Extracellular pathway (beside sustentacular cells):
  Drugs diffuse along the paracellular spaces beside sustentacular cells, enter the
  lamina propria, and are then transported toward the olfactory bulb. (c) Intra-axonal/intraneuronal
  transport: Drugs are internalized by olfactory neurons, transported along axons
  to the olfactory bulb, and then released into brain regions (Created in BioRender,
  Ding, F (2025) https://BioRender.com/99krrc4)'
