figure_title: Schematic representation of the speculative role of an individual’s
  pre-vaccination virome composition in shaping vaccine-induced immune responses.
caption: 'Schematic representation of the speculative role of an individual’s pre-vaccination
  virome composition in shaping vaccine-induced immune responses. The left panel represents
  the diversity of virome components—commensal viruses, latent viruses (e.g., herpesviruses,
  Torque Teno Virus), and acute infections—differing in abundance, diversity, and
  strain-specific features. The central panel explains the principal intrinsic immune-sensing
  pathways activated by viral elements, such as Toll-like receptors (TLRs), RIG-I-like
  receptors, and the cGAS-STING pathway, that converge on intracellular transcription
  factors IRF3, IRF7, and NF-κB. These pathways trigger the release of type I interferons
  and inflammatory cytokines. The right panel shows how such pre-existing immune conditions
  driven by the virome can modulate the vaccines’ immunogenicity to enhance, leave
  untouched, or diminish responses. The figure highlights the bidirectionality of
  virome–vaccine interactions: pre-activation may function as a natural adjuvant,
  while excessive immune noise or tolerance can suppress responsiveness to vaccines.
  Abbreviations: TLR, Toll-like receptor; NF-κB, nuclear factor kappa-light-chain-enhancer
  of activated B cells; IRF, interferon regulatory factor; cGAS, cyclic GMP–AMP synthase;
  STING, stimulator of interferon genes. (Created with BioRender.com.)'
