figure_title: Schematic overview of the single-strand break (SSB) repair and the effect
  of PARP inhibition.
caption: Schematic overview of the single-strand break (SSB) repair and the effect
  of PARP inhibition. Single-strand break (SSB) is caused by DNA damage during which
  PARP attaches to damaged DNA and is PARylated in an NAD+-dependent manner. This
  pathway calls on repair complex and re-establishes the integrity of DNA. The inhibition
  of PARP (PARPi) interferes with PARylation, as a result, locking PARP on the DNA,
  and SSBs are not repaired. Unrepaired SSBs become transformed into the double-strand
  breaks (DSBs). The survival of cells can be achieved through the DSB repair machinery;
  nevertheless, cells with dysfunctional homologous recombination, e.g., with mutated
  BRCA1/2, are unable to repair DSBs, causing cell death. The figure accentuates the
  pathway of normal SSB repair to the lethal effects of PARP inhibition in homologous
  recombination defective cells. In Table 2, we have summarized the information of
  PARP inhibitors use in therapy
