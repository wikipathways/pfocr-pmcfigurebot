figure_title: Generalized biosynthetic pathway to produce cyclized terpene cores.
caption: Generalized biosynthetic pathway to produce cyclized terpene cores. Enzymes,
  co-substrates, and cofactors are not included in the biosynthetic pathway. Sugars
  and salts are converted by networks of biosynthetic transformations into acetyl-CoA,
  pyruvate, and G3P. These products are then converted by biosynthetic transformations
  into terpenes. Isoprene building blocks within terpenes are highlighted with different
  colors (i.e. blue, red, teal, orange, and gray).[3–5] Acetyl-CoA, acetyl coenzyme
  A; G3P, glyceraldehyde 3-phosphate; MVA, mevalonate; MEP, methylerythritol phosphate;
  IPP, isopentenyl pyrophosphate; DMAPP, dimethylallyl pyrophosphate; GPP, geranyl
  pyrophosphate; FPP, farnesyl pyrophosphate; GGPP, geranylgeranyl pyrophosphate;
  and GFPP, geranylfarnesyl pyrophosphate
