figure_title: Estrogen receptor-mediated mechanisms influencing therapy responses
  in urological tumors.
caption: Estrogen receptor-mediated mechanisms influencing therapy responses in urological
  tumors. a. Tamoxifen competitively binds to estrogen receptor alpha, inhibiting
  the binding of estrogen receptors to ERE, thereby reducing the transcription and
  translation of the NRF2 gene. The decrease in NRF2 protein leads to the downregulation
  of antioxidant genes (such as GCLC) and multidrug resistance-related genes (such
  as ABCC2, ABCB1, Bcl-2, etc.). The accumulation of ROS results in enhanced oxidative
  stress in cells, making cancer cells more sensitive to enzalutamide due to oxidative
  damage. b. Estrogen can reduce the adhesion and internalization of BCG in bladder
  cancer cells through estrogen receptors, while also inhibiting the recruitment of
  monocytes and macrophages, thus diminishing the efficacy of BCG. Fulvestrant can
  counteract this effect of estrogen and promote the release of IL-6 from bladder
  cancer tissue to recruit monocytes/macrophages, which in turn can secrete TNF-α
  to inhibit the growth of bladder cancer cells. c. Sunitinib can upregulate the expression
  of lncRNA-ECVSR, enhancing the stability of ERβ mRNA, thereby promoting the expression
  levels of ERβ. ERβ binds to the estrogen response elements (ERE) in the promoter
  region of HIF2α, upregulating HIF2α expression, which ultimately promotes the characteristics
  of cancer stem cells (CSCs) and the formation of VM (vasculogenic mimicry). Additionally,
  ERβ can regulate angiogenesis through the ANGPT-2/Tie-2 signaling pathway. Faslodex
  can target ERβ, inhibiting the ERβ/ANGPT-2/Tie-2 pathway, and enhance the therapeutic
  effect of sunitinib on RCC (Renal Cell Carcinoma)
