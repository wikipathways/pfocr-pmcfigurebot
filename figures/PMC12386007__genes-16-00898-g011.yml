figure_title: Transcriptomic analysis of light-regulated photomorphogenesis-related
  genes in A.
caption: Transcriptomic analysis of light-regulated photomorphogenesis-related genes
  in A. kusnezoffii. The proposed regulatory network shows the expression patterns
  of the photoreceptors (e.g., PHYB, PHYC, PHYE, and PHOT2), transcription factors
  (e.g., PIF1, PIF3, and PIF7), and hormone biosynthesis pathways (auxin, gibberellic
  acid, jasmonic acid, and brassinolide) involved in phenotypic plasticity in response
  to different light conditions. Heatmaps illustrate gene expression levels under
  low (A), moderate (B), and high (C) light intensities, with the color scale representing
  log2 fold change (−1 to 1)
article_title: Multi-Level Transcriptomic and Physiological Responses of Aconitum
