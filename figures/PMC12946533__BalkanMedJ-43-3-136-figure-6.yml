figure_title: sFgl2 in MSCs promotes an N2-like, anti-inflammatory phenotype in BMDNs
  via the TGF-β-Smad2/3 pathway.
caption: sFgl2 in MSCs promotes an N2-like, anti-inflammatory phenotype in BMDNs via
  the TGF-β-Smad2/3 pathway. (a, b) Representative histograms and statistical plots
  depicting Ly6g+CD95+ and Ly6g+CD206+BMDNs in the coculture system are displayed
  (n = 3 independent experiments). (c) Extracellular DNA release (as an indicator
  of NETs) was assessed by Sytox Green staining, and fluorescence intensity was quantified
  (n = 3). (d) The protein levels of PAD4, and CitH3 in BMDNs were determined via
  WB, with GAPDH serving as an internal control for normalization across diverse treatment
  conditions. Statistical analyses were carried out on the calculated ratios of PAD4/GAPDH,
  and CitH3/GAPDH (n = 3 independent experiments). (e) In BMDNs undergoing various
  treatment conditions, WB was carried out to detect the protein levels of TGF-β1,
  p-Smad2/3, and Smad2/3, using GAPDH as an internal reference. (n = 3 independent
  experiments). (f-i) The levels of the pro - inflammatory cytokines TNF-α, interleukin
  (IL)-6, and IL-1β, along with the anti - inflammatory cytokine IL-10, in the culture
  supernatant were measured using the ELISA method (n = 3 independent experiments).
  Data are mean ± standard deviation. Statistical comparisons were performed using
  one-way ANOVA followed by Tukey’s post-hoc test (for multiple groups), as detailed
  in Methods. n.s., p > 0.05, *p < 0.05, **p < 0.01, and ***p < 0.001. MSCs, mesenchymal
  stem cells; sFgl2, soluble fibrinogen-like protein 2; BMDNs, bone marrow-derived
  neutrophils; NETs, neutrophil extracellular traps; CitH3, citrullinated histone
  H3; ELISA, enzyme-linked immunosorbent assay; TNF-α, tumor necrosis factor-alpha
