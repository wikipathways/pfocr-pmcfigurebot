figure_title: Cardiomyocyte integrin β1D-Cav-3 mechanotransduction in health and Diabetes
caption: Integrin β1D-Cav-3 mechanosensing during health. Cav-3 modulates Integrin
  b1D function and together transduce mechanical signals from the cardiomyocyte cellular
  membrane (anchored through laminin to the extracellular matrix, ECM) to the sarcomere.
  Intermediary proteins like Pax, Kindlin2, Integrin-linked Kinase (ILK), Talin, Vcl,
  and b-parvin, Integrin β1D-Cav3 complex transmits the force to the sarcomere through
  α-actin and F-actin, synchronizing the mechanical stress of the fiber with the sarcomere
  contraction/relaxation. In addition, the Integrin b1D-Cav3 complex promote the activation
  of growth, hypertrophy, survival, and proliferation signaling pathways. Integrin
  β1D-Cav-3 mechanosensing during diabetes. The impairment of Cav-3 expression and
  membrane redistribution (from caveolar to non-caveolar membrane) during diabetes
  impairs its modulatory effect over Integrin β1D, compromising the appropriate mechanotransduction
  that can lead to cardiomyocyte damage. Since Integrin β1D-Cav-3 activates cell survival
  and proliferative pathways, the disruption of Cav-3 as a signaling hub during diabetes
  can result in cardiomyocyte damage, lost, and replacement with fibrous tissue, reducing
  the heart muscle efficiency during diabetic cardiomyopathy (149, 266–270)
