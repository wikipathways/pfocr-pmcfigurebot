figure_title: Cell adhesion remodeling regulates AMPK and AKT signaling through the
  integrin pathway.
caption: Cell adhesion remodeling regulates AMPK and AKT signaling through the integrin
  pathway. See also Figure S4. A) Western blot showing levels of phosphorylated AMPKα
  (T172), total AMPKα, phosphorylated AKT (S473), total AKT, non-phosphorylated (active)
  β-catenin and total β-catenin. Mesendoderm progenitors (derived from H1 cells as
  shown in Figure 1A) on Day 2 of differentiation were either passaged using EDTA
  or not passaged (left in the same well and changed to fresh DF medium), with or
  without IWP2 treatment. Samples were collected right after manipulation (0 hr) and
  after 2, 6, 24 hours. NP-DF, not passaged and no treatment. Pass-DF, passaged and
  no treatment. NP-IWP2, not passaged, treated with IWP2 (3µM). Pass-IWP2, passaged
  on Day 2 and treated with IWP2 (Day 2-4, 3µM). β-actin was used as loading control.
  B) Heatmap showing Day 2-3 DEGs from RNA-seq. GO terms associated with each cluster
  are shown on the right. C) Immunostaining of phosphorylated FAK (Tyr397, green)
  in passaged versus non-passaged cells. H1 cells were induced to mesendoderm progenitors
  as described in Figure 1A. Cells were fixed for immunostaining two hours after medium
  change (non-passaged well, DF medium) or passaging (passaged well, DF medium) on
  Day 2. Nuclei were stained with Hoechst (blue). Scale bar, 50µm. D) Immunostaining
  of phosphorylated FAK (Tyr397, green) after SRC inhibitor treatment. H1 cells were
  induced to mesendoderm progenitors. Cells were treated with or without PP2 (5µM)
  on Day 2 for 24 hours in DF medium, cultured in DF medium for another day, and fixed
  for immunostaining. Nuclei were stained with Hoechst (blue). Scale bar, 50µm. E)
  Flow cytometry analysis of TNNT2+ cells on Day 10 following treatment with PP2,
  Y11 or both on Day 2. Data presented as mean ± SD of three biological replicates.
  ***, p < 0.001 compared to control (One-Way ANOVA with Dunnett's Multiple Comparison
  Test). F) Western blot showing levels of phosphorylated AMPKα (T172), total AMPKα,
  phosphorylated AKT (S473), total AKT, non-phosphorylated (active) β-catenin and
  total β-catenin. Mesendoderm progenitors (derived from H1 cells as shown in Figure
  1A) on Day 2 of differentiation were treated with PP2 (5µM) or PP2 combined with
  Y11 (10µM) and compared to control (Ctrl, fresh DF medium only). Samples were collected
  right after manipulation (0 hr) and after 2, 6, 24 hours. β-actin was used as loading
  control
