figure_title: Ferroptosis contributes to multiorgan dysfunction through distinct mechanisms
  across tissues.
caption: Ferroptosis contributes to multiorgan dysfunction through distinct mechanisms
  across tissues. The up-regulation of GPR116 inhibits the expression of the System
  Xc-/GPX4 pathway, leading to reduced GPX4 activity, which promotes hepatocyte ferroptosis
  and exacerbates ALF; In LPS-treated lung epithelial cells, the activity of SLC7A11
  and GPX4 is reduced, while TF activity is increased, leading to enhanced intracellular
  iron dependency. The accumulation of MDA and 4-HNE promotes ferroptosis in lung
  epithelial cells, contributing to ALI; increased activity of DMT1 in the brain leads
  to elevated Fe2⁺ influx into glial cells, while the activity of the iron export
  protein Fpn1 is reduced. This results in the accumulation of Fe2⁺ in glial cells,
  triggering iron overload in glial cells; in renal cells of septic mice, reduced
  GPX4 activity and decreased GSH production exacerbate mitochondrial lipid peroxidation.
  Concurrently, increased TF activity enhances the influx of Fe3⁺ into cells, which
  is reduced to Fe2⁺ by STEAP3, promoting iron accumulation. The accumulation of lipid
  peroxidation-related substances (LIP) induces the up-regulation of endogenous FTH-1
  transcription. The accumulation of Fe2⁺ in renal cells further exacerbates ferroptosis;
  in the cardiomyocytes of SCM model mice, enhanced gene expression of COX-2 promotes
  the transport of iron ions into mitochondria via mitochondrial TF, leading to increased
  mitochondrial ROS and accelerating the process of myocardial ferroptosis
