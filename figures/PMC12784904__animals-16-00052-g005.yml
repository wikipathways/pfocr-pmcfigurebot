caption: 'Summary of the transcriptome analyses in the jejunum of growing pigs under
  different feeding modes (n = 4). (A) PCA between the FA group and TRF group. (B)
  Volcano plot exhibiting the distributions of the DEGs between the FA group and TRF
  group. (C) Bar plot showing the enriched GO terms of DEGs. BP: biological process.
  CC: cellular component. MF: molecular function. (D) KEGG pathway enrichment analysis
  exhibiting DEG-enriched pathways. The central node with pie chart presents enriched
  pathways whereas radiated nodes around them exhibit enriched DEGs. DEGs in red color
  were up-regulated whereas blue-colored DEGs were down-regulated. Pie charts represent
  the percentage of up-regulated and down-regulated DEGs within the pathway'
