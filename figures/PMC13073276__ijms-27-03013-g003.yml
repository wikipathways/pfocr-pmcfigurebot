figure_title: Metabolomic analysis of S compared to CK in winter wheat.
caption: 'Metabolomic analysis of S compared to CK in winter wheat. (A): Orthogonal
  projections to latent structures-discriminate analysis (OPLS-DA) of metabolites.
  (B): Clustering heat map of DEMs. (C): Volcano of the DEMs. The horizontal blue
  dashed line in the figure represents the statistical significance threshold. Points
  above the horizontal line have p < 0.05, and points below the horizontal line have
  p > 0.05. The vertical dashed lines represent the fold change of differences. Points
  outside the right vertical line represent metabolites with significantly up—regulated
  expression, points outside the left vertical line represent metabolites with significantly
  down—regulated expression, and points between the two lines represent no significant
  difference. (D): KEGG pathway analysis of DEMs'
