figure_title: Galectin-3-binding protein (LGALS3BP) deficiency attenuates hepatic
  inflammation by suppressing toll-like receptor 2 (TLR2)-inhibitor of nuclear factor
  kappa-B kinase subunit alpha/beta (IKKα/β)-nuclear factor kappa B (NF-κB) signaling
  in a chronic high-fat diet (HFD) model.
caption: Galectin-3-binding protein (LGALS3BP) deficiency attenuates hepatic inflammation
  by suppressing toll-like receptor 2 (TLR2)-inhibitor of nuclear factor kappa-B kinase
  subunit alpha/beta (IKKα/β)-nuclear factor kappa B (NF-κB) signaling in a chronic
  high-fat diet (HFD) model. (A) Relative mRNA expression levels of inflammatory markers
  in liver tissues from wild-type (WT) and knockout (KO) mice fed chow diet (CD) or
  HFD for 24 weeks (WT CD, n=8; KO CD, n=8; WT HFD, n=6; KO HFD, n=13). (B) Immunoblot
  analysis of key proteins in the inflammatory signaling pathway, including TLR2,
  phosphorylated IKKα/β (p-IKKα/β), p-NF-κB p65, phosphorylated extracellular signal-regulated
  kinase (p-ERK), and phosphorylated insulin receptor substrate 1 at Ser307 (p-IRS1),
  along with their respective total protein, in liver tissues (n=5). Each band represents
  liver tissue extract from an individual mouse. Band intensities are presented as
  bar graphs with individual data points displayed to the right. (C) Relative mRNA
  expression levels of fibrosis-related genes in liver tissues from WT and KO mice
  fed HFD (WT HFD, n=6; KO HFD, n=13). Statistical significance was determined using
  two-way analysis of variance (ANOVA) followed by Tukey’s post hoc test for (A),
  and a two-tailed unpaired Student’s t test for (B) and (C). All data are expressed
  as mean±standard deviation. Tnfα, tumor necrosis factor alpha; Il1β, interleukin
  1 beta; Ccl2, C-C motif chemokine ligand 2; Il6, interleukin 6; Tgfβ1, transforming
  growth factor beta 1; Acta2, alpha smooth muscle actin; Col1a1, collagen type I
  alpha 1 chain; S100a6, S100 calcium-binding protein A6; Pdgfb, platelet derived
  growth factor subunit B. aP<0.01, bP<0.001 compared to WT CD; cP<0.05, dP<0.01,
  eP<0.001 compared to WT HFD
