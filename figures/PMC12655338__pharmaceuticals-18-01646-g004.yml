figure_title: Multiomics profiling revealed YW3-56-mediated metabolic reprogramming.
caption: 'Multiomics profiling revealed YW3-56-mediated metabolic reprogramming. (A)
  Venn diagram showing the overlap among total DEGs/DEPs in YW3-56-treated NB4 cells.
  (B) Nine-quadrant plot illustrating the correlation between transcriptomic and proteomic
  regulation. Quadrants I and IX: mRNA and corresponding protein levels change in
  opposite directions, suggesting post-transcriptional or translational regulation
  (e.g., miRNA-mediated regulation). Quadrants II and VIII: Proteins show differential
  expression without corresponding mRNA changes. Quadrants III (upregulated) and VII
  (downregulated): mRNA and protein exhibit concordant differential expression, reflecting
  coordinated transcriptional and translational regulation. Quadrants IV and VI: mRNA
  shows differential expression without corresponding protein changes. Quadrants V:
  Both mRNA and protein are not differentially expressed in most genes. (C) Circos
  plot summarizing the features of coexpressed DEGs/DEPs enriched in the top 25 KEGG
  pathways. From inner to outer layers: the RichFactor, the number of DEGs, total
  gene count (with the gradual red scale indicating −log10[q-value] from the enrichment
  analysis), and the KEGG accession numbers (with different colors representing distinct
  KEGG classes). Proteomic analyses of key enzymes involved in the (D) glycolytic
  pathway, (E) pentose phosphate pathway, and (F) tricarboxylic acid cycle. Transcriptomic
  analyses of key enzymes related to the (G) glycolytic pathway, (H) pentose phosphate
  pathway and (I) tricarboxylic acid cycle. The data are shown as the means ± SD.
  *, p < 0.05; **, p < 0.01'
