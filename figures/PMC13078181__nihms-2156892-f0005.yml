figure_title: NR4A2 promotes phospholipids synthesis in the mouse heart
caption: (A) Metabolite enrichment analysis in the ventricle of Nr4a2-icTg mice compared
  to Cre control mice at 3, 6 and 12 days after tamoxifen treatment. The top 5 metabolic
  pathways are represented, with pathways related to phospholipids synthesis shown
  in blue. (B) Heat map representation of the relative amounts of glycerophospholipids
  in the ventricle of Nr4a2-icTg mice and Cre control mice at 3, 6 and 12 days after
  tamoxifen injection. Mean of n = 10 mice per group per timepoint (5 males/5 females).
  Relative amounts and statistical differences for all metabolites are provided in
  Supplemental File S3. (C) Heat map representation of relative expression levels
  for genes encoding key enzymes involved in the synthesis of phosphatidic acid, diacylglycerol
  and phospholipids after 3, 6 and 12 days of NR4A2 induction. Tamoxifen-injected
  Cre control mice (C) were used to establish basal gene expression levels. Mean of
  n = 4 mice per group per timepoint (2 males/2 females). Absolute quantification
  and statistical differences for all genes is provided in Supplemental Figure S7.
  (D) ChIP-seq profiles for NR4A2 binding at the loci of the genes encoding glycerol
  3-phosphate dehydrogenase 1 (Gpd1) and glyceronephosphate O-acyltransferase (Gnpat)
  in hearts of Nr4a2-icTg mice (N1–3; red tracks) and Cre control mice (C1–3; black
  tracks). The position of transcripts from NCBI RefSeq are shown in dark blue below
  the tracks. ENCODE candidate cis-regulatory elements are shown in red for a promoter-like
  signature, orange for a proximal enhancer-like signature, and yellow for a distal
  enhancer-like signature. The ChIP-seq profiles for all enzymes presented in (C)
  with quantification of NR4A2 binding to the corresponding intervals are provided
  in Supplemental Figure S8. (E) Quantification of NR4A2 binding to the promoter (Pr.)
  and enhancer (Enh.) sequences of the genes at 3 days after tamoxifen treatment.
  Mean ± SEM of n = 3 samples per group. Pairwise differential peak analysis performed
  with edgeR. *p < 0.05. n.s., not significant
