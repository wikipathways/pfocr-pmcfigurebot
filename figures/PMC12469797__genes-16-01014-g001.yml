figure_title: 'Mammalian canonical Toll-like receptor 4 (TLR4) signaling pathways:
  myeloid differentiation factor 2 (Myd88)-dependent (yellow) and Myd88-independent
  (pink) downstream signaling.'
caption: 'Mammalian canonical Toll-like receptor 4 (TLR4) signaling pathways: myeloid
  differentiation factor 2 (Myd88)-dependent (yellow) and Myd88-independent (pink)
  downstream signaling. Nuclear factor kappa-light-chain-enhancer of activated B cells
  (NF-κB) is activated, and pro-inflammatory cytokines are produced when the TLR4/myeloid
  differentiation factor 2/cluster of differentiation 14 (TLR4/MD-2/CD14) complex
  recognizes lipopolysaccharide (LPS), starting the MyD88-dependent pathway at the
  plasma membrane. However, when the MyD88-independent (Toll/interleukin-1 receptor
  domain-containing adapter-inducing interferon-β (TRIF)-dependent) route takes place
  following TLR4 incorporation into endosomes, it leads to interferon regulatory factor
  3 (IRF3) and IRF7 activation and the generation of type I interferons. When exposed
  to Gram-negative bacterial LPS endotoxins, animals can generate both quick inflammatory/anti-inflammatory
  reactions and antiviral defenses because of this dual signaling pathway'
article_title: Beyond TLR4 and Its Alternative Lipopolysaccharide (LPS) Sensing Pathways
  in Zebrafish
