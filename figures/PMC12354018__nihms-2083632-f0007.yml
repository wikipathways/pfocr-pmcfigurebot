figure_title: Radioprotection through a PKCδ/SIRT6-dependent antioxidant response
caption: When PKCδ is depleted, SIRT6 expression is increased, leading to enhanced
  NHEJ and HR DSB repair and increased cell survival and radioprotection. Cell survival
  is dependent on increased production of mitochondrial ROS and induction of a persistent
  Nrf2-dependent antioxidant pathway resulting in upregulation of antioxidant protein
  expression. Our studies suggest that SIRT6 is required for maintenance of the antioxidant
  response through activation of Nrf2. Created with BioRender.com
article_title: PKCδ regulates DNA damage and cell death through a SIRT6/Nrf2-dependent
  antioxidant response
