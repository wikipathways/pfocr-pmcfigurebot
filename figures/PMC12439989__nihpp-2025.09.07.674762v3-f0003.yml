figure_title: Comparative analysis of directed path efficiency across species with
  cross-scale validation
caption: '(a) Distribution of minimum path costs in directed connectomes derived from
  the common cross-species atlas. Real networks (green) are compared against 10,000
  null networks generated by randomizing tracer-defined directionality (gray), showing
  that directionality stabilizes network organization and prevents inefficient detours.
  Right: pairwise interspecies comparisons summarized by Cohen’s d, with bootstrap
  resampling (n = 1,000) for statistical testing: Mouse vs. Marmoset p < 0.0001; Mouse
  vs. Rhesus p = 0.0410; Mouse vs. Human p < 0.0001; Marmoset vs. Rhesus p = 0.0840;
  Marmoset vs. Human p < 0.0001; Rhesus vs. Human p < 0.0001.(b) Top 20 most efficient
  mouse paths, sorted by cost, with corresponding values in other species shown as
  stacked colored bars. Conserved high-efficiency routes include medial temporal →
  hippocampus, thalamo–occipital, and precentral–parietal pathways.(c) Visualization
  of the top-ranked pathway across all species: medial temporal → hippocampus. 3D
  renderings highlight this conserved circuit in mouse, marmoset, rhesus macaque,
  and human.(d) Cross-scale validation within the Allen Brain Atlas (ABA). Left: distributions
  of minimum path costs for real networks (green) compared to 10,000 tracer-randomized
  nulls (gray), demonstrating results consistent with panel a. Right: bar plot of
  the 25 most efficient ABA-defined paths, with costs from dMRI-only symmetric connectomes
  shown in red for reference. Canonical hippocampal trisynaptic circuits (ENTm → DG,
  DG → CA3, CA3 → CA1), along with thalamo–occipital and sensorimotor loops, are recapitulated,
  confirming the biological fidelity of the framework at finer resolution. Together,
  these analyses demonstrate that tracer-informed directionality stabilizes network
  organization, recapitulates canonical hippocampal circuits, and enables comparative
  analysis of conserved versus lineage-specific efficiencies'
article_title: Directed connectomes across species reveal conserved and divergent
