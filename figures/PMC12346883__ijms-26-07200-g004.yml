figure_title: The Akt/ERK signaling pathway is important for the ERα36-mediated regulation
  of MDR1 expression.
caption: The Akt/ERK signaling pathway is important for the ERα36-mediated regulation
  of MDR1 expression. Cells were treated with 100 nM of BSA-E2 for 5–60 min (A) or
  BSA-E2 (10−100 nM) for 15 min (B). p-Akt and p-ERK protein levels were determined
  by Western blot. (C) Cells were pretreated with 10 µM of LY294002 and 10 µM of PD98059
  for 1 h, followed by treatment with 100 nM of BSA-E2 for 24 h. The MDR1 protein
  level was determined by Western blot. (D) Cells were pretreated with 10 µM of LY294002
  and 10 µM of PD98059 for 1 h and then treated with 100 nM of BSA-E2 for 15 min.
  CREB and NF-κB protein levels were analyzed by Western blot
