figure_title: Integrated single-nuclear transcriptomic analysis identifies disproportionate
  enrichment of vascular smooth muscle cells
caption: (A) UMAP-based unsupervised clustering following integration of ACTA2-p.Met49Thr
  mutation (TAA_ACTA2) and hypertensive aortopathy (TAA_NG). (B) UMAP-based clustering
  at 0.4 resolution, identifying 11 distinct clusters. (C) Density plots of gene markers
  for known cell types, identifying (D) Endothelial Cell (EC), T Lymphocyte (T Lymph),
  Fibroblast, Fibromyocyte, Dendritic, Macrophage, B Lymphocyte (B Lymph), Natural
  Killer T Lymphocyte (NKT), and two clusters of Vascular Smooth Muscle Cell (VSMC_1/2)
  populations. (E) Proportional bar plot showing relative enrichment of VSMCs in TAA_ACTA2.
  (F) UpSet plot illustrating the intersection of differentially expressed genes (DEGs)*
  in TAA_ACTA2 relative to TAA_NG across cell types, highlighting shared and unique
  gene sets within the dataset. (G) Violin plot of gene expression profiles of 6 shared
  DEGs across cell types. (H) Clustered gene set enrichment analysis to overlapping
  pathways across cell types, showing the ratio of DEGs to the number of genes in
  the pathway (GeneRatio) and BH-corrected p-value (p.adjust) based on the Fisher’s
  Exact test. *Statistical significance is assumed based on a BH-corrected p-value
  < 0.05
