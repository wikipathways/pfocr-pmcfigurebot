figure_title: Cynarin suppresses macrophage-mediated inflammation through activation
  of the Nrf2-Keap1 signalling pathway.
caption: Cynarin suppresses macrophage-mediated inflammation through activation of
  the Nrf2-Keap1 signalling pathway. (A) RAW264.7 cells were exposed to cynarin (10,
  50 or 100 μM) for 24 h and then treated with LPS (1 μg/ml) for 12 h. Expression
  levels of IL1β, IL6, Nos2 and Tnf were detected by RT-qPCR (n=3). (B) RAW264.7 cells
  and bone marrow-derived macrophages were exposed to cynarin (10, 50, 100 or 200
  μM) for 24 h and then treated with LPS (1 μg/ml) for 12 h. Intracellular ROS levels
  were measured with a ROS assay kit (n=3). (C) RAW264.7 cells were exposed to cynarin
  (10, 50, 100 or 200 μM) for 6 h and then treated with LPS (1 μg/ml) for 12 h. Expression
  levels of Nrf2, Keap1, Hmox1 and Cat were detected by RT-qPCR (n=3). (D) RAW264.7
  cells were exposed to cynarin (10, 50, 100 or 200 μM) for 24 h and then treated
  with LPS (1 μg/ml) for 24 h. Expression levels of Nrf2, Keap1 and HO-1 were detected
  by WB. (E) RAW264.7 cells were exposed to 100 μM cynarin for 24 h and then treated
  with LPS (1 μg/ml) for 24 h. Nuclear extracts and cytoplasmic extracts were used
  to test expression of Nrf2 by WB. (F) Quantitative densitometric analysis was performed
  to normalize Nrf2, Keap1 and HO-1 expression levels from D (n=3). (G) Quantitative
  densitometric analysis was performed to normalize Nrf2 expression levels from E
  (n=3). The data are presented as the mean ± SD. *P<0.05, **P<0.01 and ****P<0.0001
  vs. CTL and LPS group separately. LPS, lipopolysaccharide; RT-qPCR, reverse transcription-quantitative
  PCR; ROS, reactive oxygen species; HO-1, heme oxygenase-1; WB, western blotting
