caption: (a) Fabrication and therapeutic mechanism of the microneedle (MN) patch for
  hypertrophic scar treatment, in Section II, the downward arrows next to ROS and
  MMPs indicate decreases in their respective levels, and the upward arrow next to
  the keratinocyte pathway and inflammatory pathway denote the activation of these
  pathways. Adapted and reproduced, with permission, from references [200]. (b) Representative
  scar photographs, Scar Elevation Index (SEI) measurements, and H&E and Masson staining
  of hypertrophic scars pre- and post-treatment (* p < 0.05 and ns indicates no statistically
  significant difference between groups). Adapted and reproduced, with permission,
  from references [200]. (c) Immunofluorescence staining for reactive oxygen species
  (DHE, 8-OHdG) and matrix metalloproteinases (MMP-2 and MMP-9). Adapted and reproduced,
  with permission, from references [200]. (d) Schematic of the oxygen-generating MN
  system for alleviating hypoxia and potentiating 5-fluorouracil (5-FU) efficacy in
  hypertrophic scars. Adapted and reproduced, with permission, from references [201]
