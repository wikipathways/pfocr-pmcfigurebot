figure_title: ACSL4 deficiency attenuates MAPK signaling via the interaction between
  γ-GC and PTP4A1.
caption: ACSL4 deficiency attenuates MAPK signaling via the interaction between γ-GC
  and PTP4A1. (A) Venn diagram showing the overlapping candidate genes identified
  from transcriptomic analysis, molecular docking, and qPCR validation. (B) Volcano
  plots of DEGs from our liver RNA-seq (n = 5). (C) Heatmap of mRNA levels of high-affinity
  DEGs identified by molecular docking following γ-GC treatment. (D) Protein levels
  of PTP4A1 in HepG2 cells treated with γ-GC (250, 500, 1000 μM), HDA (2.5, 5, 10
  μM), m-CA (50, 100, 200 μM), and DL-BSA (50, 100, 200 μM) for 24 h. (E) Molecular
  docking model of the PTP4A1-γ-GC complex. (F) Thermal stability analysis of PTP4A1
  in HepG2 cells treated with γ-GC (1000 μM, 2 h). Representative immunoblots (left)
  and quantification (right). (G) Relative expression levels of PTP4A1 in liver samples
  from GSE103580 (Alcoholic steatosis, n = 6; Alcoholic cirrhosis, n = 67). (H) Correlation
  between ACSL4 and PTP4A1 expression in liver samples from GSE103580, determined
  by Pearson correlation test. (I,J) Relative mRNA (I) and protein (J) levels of PTP4A1
  in livers from Gao-Binge model Acsl4flox and Acsl4HKO mice (Pair-fed, n = 8; EtOH-fed,
  n = 10). (K,L) Relative mRNA (K) and protein (L) levels of PTP4A1 in HepG2 cells
  treated with EtOH (100 mM, 24 h) following transduction with shNC or shACSL4. (M)
  GSEA enrichment plot for the regulation of MAPK cascade in our liver RNA-seq. (N)
  Protein levels of phospho- and total MAPK/NF-κB pathway components (p38, JNK, ERK1/2,
  and p65) in livers from Gao-Binge model Acsl4flox and Acsl4HKO mice. (O) Protein
  levels of MAPK/NF-κB pathway in HepG2 cells treated with EtOH (100 mM, 24 h) following
  transduction with shNC or shACSL4. (P) Protein levels of MAPK/NF-κB pathway in HepG2
  cells following transduction with shNC or shACSL4, with or without pcDNA3.1-PTP4A1.
  Data are represented as the mean ± SD. * p < 0.05, ** p < 0.01, *** p < 0.001 by
  unpaired two-tailed Student’s t-test (G), one-way ANOVA test (I,K), two-way ANOVA
  test (F)
