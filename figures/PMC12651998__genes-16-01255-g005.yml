figure_title: Regulatory mechanisms during mouse aging.
caption: Regulatory mechanisms during mouse aging. (A) Illustration of applying Planet
  to mouse aging data. (B) Summary of TF regulatory activity from cell-type-specific
  GRN con-structed by Planet. (C) Summary of TF regulatory activity from cell-type-specific
  GRN con-structed by DigNet. (D) Overlap of the top 10 TFs in each cell-type-specific
  GRN across aging stages. (E) Normalized regulatory activity of the top three TFs
  in each GRN across aging stages. (F) Cell-type-specific GRN generated by Planet,
  showing the top three TFs and their associated regulatory edges for each stage.
  (G) Summary of KEGG pathway enrichment analysis of the top 50 variable genes from
  GRN at 6, 12, and 23 months. (H) Detailed KEGG enrichment analysis of key genes
  from the 12-month GRN with visualization
