figure_title: The light–suprachiasmatic nucleus (SCN)–pineal pathway regulating melatonin
  biosynthesis.
caption: 'The light–suprachiasmatic nucleus (SCN)–pineal pathway regulating melatonin
  biosynthesis. Light information from the retina reaches the suprachiasmatic nucleus
  (SCN), the master circadian pacemaker, via the retinohypothalamic tract. The SCN
  projects to the paraventricular nucleus and modulates sympathetic innervation of
  the pineal gland. In darkness, SCN activity stimulates pineal metabolism of Trp
  through a sequential enzymatic cascade: tryptophan hydroxylase (TPH) converts Trp
  into 5-hydroxytryptophan (5-HTP), aromatic L-amino acid decarboxylase (AADC) generates
  serotonin (5-HT), serotonin N-acetyltransferase (SNAT) produces N-acetylserotonin,
  and acetylserotonin O-methyltransferase (ASMT) catalyzes the final step to melatonin.
  Light exposure suppresses this pathway, reducing melatonin output. Melatonin acts
  as a key circadian regulator, influencing sleep, neuroendocrine rhythms, and mood
  regulation. Abbreviations: ↓, Decrease'
