figure_title: Overview of altered metabolic pathway by ALY688 in TAC-induced HFrEF.
caption: Overview of altered metabolic pathway by ALY688 in TAC-induced HFrEF. Schematic
  overview of altered metabolic pathways involving amino acid catabolism, TCA cycle
  intermediates, and gut microbiota-derived metabolites. Heatmaps show relative metabolite
  abundance across Sham, TAC, and TAC-A groups (red = high, blue = low). TAC induced
  elevation of key metabolites associated with mitochondrial stress and inflammation,
  including TMAO, 5-AVA, kynurenine, and succinate, alongside disruption of serine,
  tryptophan, and aspartate metabolism. ALY688 treatment partially restored these
  dysregulated metabolites toward Sham-like levels, suggesting improved mitochondrial
  metabolic balance and reduced gut–heart metabolic stress
article_title: Systemic Metabolomic Remodeling in Pressure Overload-Induced Heart
  Failure Indicates Modulation of a Gut–Liver–Heart Axis by the Adiponectin Receptor
  Agonist ALY688
