figure_title: Schematic representation of inflammatory pathways during myocardial
  ischemia/reperfusion injury (MIRI).
caption: Schematic representation of inflammatory pathways during myocardial ischemia/reperfusion
  injury (MIRI). Damage-associated molecular patterns (DAMPs) and pathogen-associated
  molecular patterns (PAMPs) activate Toll-like receptor 4 (TLR4), which recruits
  the adaptor protein Myeloid differentiation primary response 88 (MyD88), and activates
  Nuclear Factor kappa B (NF-κB). NF-κB promotes the transcription of pro-inflammatory
  cytokines, including pro-IL-1β and pro-IL-18. Cellular stress and increased reactive
  oxygen species (ROS) contribute to the activation of the NOD-like receptor family
  pyrin domain containing 3 (NLRP3) inflammasome. NLRP3 cleaves pro-caspase-1 into
  active caspase-1. Caspase-1 then processes pro-IL-1β and pro-IL-18 into the active
  forms. Caspase-1 also cleaves Gasdermin D (GSDMD), releasing its N-terminal fragment
  (GSDMD-N), which forms pores in the plasma membrane, leading to cell swelling, membrane
  rupture, and pyroptosis
