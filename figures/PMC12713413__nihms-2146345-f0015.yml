figure_title: Role of white cells in mating.
caption: Role of white cells in mating. (A) White cell responses to pheromone. The
  MAPK pathway mediates pheromone-induced biofilm development and mating in white
  cells when treated with synthetic pheromone or in the presence of opaque cells of
  the opposite mating type. (B) Glucose depletion induces white cell mating. The Cph1
  and Tec1 transcription factors play positive and negative roles, respectively, in
  the regulation of mating
