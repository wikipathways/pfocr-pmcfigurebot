figure_title: The central autonomic network structures, the autonomic nervous system,
  and the neocortex are highly connected and involved in visceral information processing.
caption: The central autonomic network structures, the autonomic nervous system, and
  the neocortex are highly connected and involved in visceral information processing.
  Visceral information is transmitted via the spinal and cranial pathways to various
  structures belonging to the central autonomic networks (CANs), between which reciprocal
  connections exist as well as connections with the hypothalamic-pituitary-adrenal
  (HPA) axis, the autonomic nervous system (ANS), and the prefrontal cortex (PFC).
  Visceral information transmitted through the spinal pathway reaches primarily the
  insular cortex, while information transmitted via the cranial pathway is directed
  to the nucleus of the solitary tract (NST)
