figure_title: Role of IMT in the interplay between one-carbon and polyamine metabolisms,
  supporting DNA synthesis and rapid cancer cell proliferation.
caption: Role of IMT in the interplay between one-carbon and polyamine metabolisms,
  supporting DNA synthesis and rapid cancer cell proliferation. This figure provides
  a detailed representation of the interplay between one-carbon metabolism (including
  the folate and methionine cycles) and polyamine biosynthesis. These pathways are
  crucial for sustaining rapid cancer cell proliferation by enabling the enhanced
  synthesis of key biomolecules. They provide purine and pyrimidine nucleotides essential
  for DNA replication and gene transcription, and S-adenosylmethionine (SAM), the
  universal methyl donor required for epigenetic regulation, including chromatin remodeling.
  Additionally, they produce polyamines, which are fundamental for DNA stabilization
  and protection. Notably, key genes indicated in red (SHMT1, ODC1, MTR, and CAT-1)
  are regulated through IMT, a mechanism that allows for their efficient expression
  under the high-stress conditions prevalent in the TME
