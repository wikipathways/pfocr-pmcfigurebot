figure_title: Schematic diagram of the antioxidant mechanisms of tannins in ameliorating
  UC-associated intestinal oxidative stress.
caption: 'Schematic diagram of the antioxidant mechanisms of tannins in ameliorating
  UC-associated intestinal oxidative stress. This diagram illustrates the multifaceted
  antioxidant actions of tannins and their downstream protective effects on the intestinal
  tract in UC. Tannins exert antioxidant activity through two core pathways: (1) direct
  free radical scavenging: their phenolic hydroxyl groups act as hydrogen donors to
  eliminate ROS including ·OH, O2−·, DPPH· and interrupt free radical chain reactions;
  (2) potentiating endogenous antioxidant defense systems: tannins activate the Nrf2/HO-1
  signaling pathway by dissociating Nrf2 from Keap1, thereby upregulating the expression
  and activity of key antioxidant enzymes (SOD, CAT, GSH-Px). By mitigating intestinal
  oxidative stress, tannins further inhibit the secretion of pro-inflammatory cytokines
  (TNF-α, IL-6, IL-1β), upregulate the anti-inflammatory cytokine IL-10, alleviate
  intestinal mucosal damage and promote mucosal repair. Additionally, tannins modulate
  the gut microbiota by reducing harmful bacteria and enriching beneficial taxa, which
  in turn maintains intestinal redox homeostasis and relieves clinical symptoms of
  UC, forming a synergistic antioxidant-anti-inflammatory-microbiota regulatory loop'
article_title: 'Tannins as Therapeutic Agents for Ulcerative Colitis: Mechanisms and
  Prospects in Regulating Gut Inflammatory-Oxidative Homeostasis'
