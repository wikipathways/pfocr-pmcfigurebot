figure_title: Endothelial REST silencing triggers endMT in human cells in vitro
caption: A. Hallmark pathway analysis of RNA-seq data in HAEC treated with siRNA for
  REST or siRNA scramble. The top 5 upregulated and downregulated pathways are shown.
  P-values were calculated with a permutation test implemented in GSEA and all pathways
  shown are significant at an FDR < 0.05. Each data point reflects a measurement obtained
  from multiple cells in one biological replicate. B. Heatmap of expression of endMT
  related genes in HAEC treated with siRNA for REST or siRNA scramble. Colors represent
  the average log2 expression for each biological replicate normalized with the rlog
  method based on DESeq2 in RNA-seq. For presentation purposes all genes are row normalized
  by dividing with the average value in control samples. Groups were compared with
  a Wald test as implemented in DESeq2 and all genes shown are significant at an FDR
  < 0.005. C. Western blot with corresponding quantification data and D. Immunofluorescence
  of endothelial (PECAM1, NOS3) and mesenchymal (ASMA, TAGLN) proteins in HAEC treated
  with siRNA for REST or siRNA scramble. Each data point reflects a measurement obtained
  from multiple cells in one biological replicate. E. Endothelial monolayer permeability
  and endothelial cell migration in transwell assays in HAEC treated with siRNA for
  REST or siRNA scramble. In C-E, linear mixed models were used to account for nesting
  structure from 2-3 independent experiments with n=2-4 replicates each. Each data
  point reflects a measurement obtained from multiple cells in one biological replicate
