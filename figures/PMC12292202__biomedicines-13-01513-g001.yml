figure_title: Cleavage of APP.
caption: Cleavage of APP. Depending on the secretases involved, APP is processed via
  the non-amyloidogenic or amyloidogenic pathway. Cleavage by α-secretase (e.g., ADAM-9,
  -10, -17) results in the release of sAPPα and C83; C83 is then cleaved by γ-secretase
  to produce nontoxic p3 and AICD. However, under pathological conditions, APP may
  be processed by β-secretase, resulting in the production of sAPPβ and C99; C99 is
  then cleaved by γ-secretase. As a result, similarly to the non-amyloidogenic pathway,
  AICD is released; however, such cleavage also produces toxic Aβ species, which aggregate
  into amyloid plaques, main hallmark of Alzheimer’s disease
article_title: The Potential Regulators of Amyloidogenic Pathway of APP Processing
  in Alzheimer’s Disease
