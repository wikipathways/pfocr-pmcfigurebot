figure_title: Reduced cell death in SAT- vs VAT-resident ATMs
caption: (A) Scatter plots showing differential gene (DE) expression in each of five
  different ATM clusters residing in SAT and VAT in each of four different diet and/or
  treatment conditions. (B) Pathway analysis using DE genes in ATM1 from SAT and VAT
  of NCD mice. (C) Heatmap showing pathways that are up (red)- or down(blue)-regulated
  in ATM1 from SAT and VAT by HFD, the HFDNCD switch diet, or the treatment with Rosi.
  (D) Pathway analysis using DE genes in ATM1 from SAT and VAT of HFD mice. (E) mRNA
  expression of genes involved in cell death in ATM1 from SAT and VAT in each of different
  diet and/or treatment conditions. (F) Caspase-3/7 activity in sorted CD301b+ ATMs
  isolated from NCD and HFD mouse SAT and VAT (n=6 mice per group). (G-H) Relative
  TBARS (G) and reduced glutathione (GSH) (H) contents in VAT and SAT ATMs from HFD
  mice (n=10 mice/group). (I) Cell viability as measured by MTT assays (n=4 wells/group).
  (J) Effect of soluble factors released from obese VAT and SAT on macrophage apopotosis.
  BMDMs were incubated with HFD SAT- or HFD VAT-CM in the presence or absence of ferrostatin.
  24h later, caspase-3/7 activities were measured (n=6–12 wells/group). (K) TBARS
  levels in BMDMs incubated in HFD VAT- or HFD SAT-CM (n=5–8 well/group). (L) Expression
  of genes involved in cell death in BMDMs incubated in HFD VAT- or SAT-CM (n=4 well/group).
  ns, not significant. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. All data
  are mean +/− SEM. Statistical analysis was performed by unpaired Student’s t-tests
  or 1- or 2-way ANOVA with Tukey’s multiple comparison tests. See also Figure S4
