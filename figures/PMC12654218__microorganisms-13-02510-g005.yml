figure_title: Reduced expression of FliC/FljB was observed in ΔmsbB ST.
caption: 'Reduced expression of FliC/FljB was observed in ΔmsbB ST. (A) The volcano
  plot highlights several genes impacted by the deletion of msbB, with two group of
  pathway-specific genes highlighted: Two-component system—cheA, cheB, cheR, cheY,
  and Flagellar assembly—flgK, motA, motB. All are down-regulated. (B) Fold change
  of fljB, fliC, prgI and prgJ mRNAs in ΔmsbB relative to those genes in WT ST, measured
  by RT-qPCR. (C) Representative image of immunoblotting analysis of FliC, PrgJ and
  TolC in WT and ΔmsbB ST. Three colonies of each strain were selected and used for
  WB. (D) Relative density quantification for FliC and PrgJ bands, normalized to the
  density of TolC. *** p  <  0.001, **** p  <  0.0001, ns: no significant difference.
  Two-way ANOVA with Holm–Sidak multiple comparison test'
