figure_title: Exosomal miR-145a-3p is functional in migration assays
caption: A. Representative images of migration assay with 4T1 cells treated with exosomal
  miRNA. B. Quantification of migration assay. C. miR-145a-3p is differentially expressed
  between IS and IR adipocyte exosomes. D. Top table, Trp53bp2 and Ocln has complementary
  sequence of miR-145a-3p in the 3’-UTR regions, based on TargetScan prediction. Bottom
  table, average counts of Trp53bp2 and Ocln, fold change, and adjusted p-value when
  comparing miR-145a-3p treated group with scrRNA control from bulk RNA sequencing.
  E. Representative images of migration assay treated with scrambled miRNA (scrRNA)
  control and miR-145a-3p for 3 days and 1 day without treatment. F. Quantification
  and statistical analysis of E (n=4, *, p<0.05, **, P<0.01, ***, p<0.001). G. Differentially
  expressed gene between scrRNA and miR-145a-3p treated group. H. Pathway enrichment
  analysis using genes downregulated in miR-145a-3p treated group VS scrRNA group.
  I. Quantification of the number of colonies in brain clonogenic assay (n>=3, *,
  p<0.05)
