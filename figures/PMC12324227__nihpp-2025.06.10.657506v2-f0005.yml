figure_title: Stress response clusters and phenotypic groups.
caption: Stress response clusters and phenotypic groups. (A) A custom heatmap visualizes
  the relationships between clusters (rows), stress response pathways (SRPs) (columns),
  and connectivity scores. Circles represent SRP-cluster relationships, with color
  saturation indicating mean connectivity scores and size reflecting the fraction
  of cells in each cluster exceeding 1 standard deviation above the mean connectivity
  score for that SRP.(B) Barplots showing the distribution of the cell populations
  across clusters (rows) for each chemical treatment (columns)
