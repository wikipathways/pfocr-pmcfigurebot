figure_title: CSE-P12 alleviated HAdV4-induced lung injury through inhibiting the
  STING pathway.
caption: 'CSE-P12 alleviated HAdV4-induced lung injury through inhibiting the STING
  pathway. (A) Immunoblots showing the absence of STING in the lung of STING-/- mice;
  β-actin as the internal control. (B, C) The effects of CSE-P12 on the mRNA levels
  of Ifnb1 and Isg15 genes in the lung of WT and STING-/- mice on Day 5 after HAdV4
  infection. (D, E) The effects of CSE-P12 on the mRNA levels of IL-6 (D) and IL-12b
  (E) in the lung of WT and STING-/- mice on Day 5 after HAdV4 infection; CSE-P12
  = 500 nM (50 μL), 3 doses at -1 h, 48 h, and 96 h after infection. (F) The representative
  H&E images of lung sections from WT and STING-/- mice in each group; scale bar =
  2 mm (left) and 200 μm (right); black arrows indicated the perivascular and interstitial
  infiltration of inflammatory cells and the lung consolidation; red arrows indicated
  infiltrated neutrophils in the lung. (G) Histological scores quantified from the
  H&E images in (F). N = 3 for the uninfected group, N = 6 for HAdV4 infected and
  HAdV4+CSE-P12 groups; ns: not significant, *p < 0.05, **p < 0.01, ***p < 0.001,
  ****p < 0.0001'
