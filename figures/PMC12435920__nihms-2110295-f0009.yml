figure_title: Model for negative regulation of microglial activation in primary microglia
caption: 14-3-3 proteins sequester IKKβ under resting conditions, preventing NF-κB
  pathway activation in the absence of pro-inflammatory signals, such as LPS. LPS
  exposure promotes the dissociation of the 14-3-3/IKKβ complex to allow activation
  of the kinase activity of IKKβ. IKKβ phosphorylates IκBα, leading to accelerated
  degradation of IκBα. Loss of IκBα allows the release and nuclear translocation of
  the NF-κB p65 subunit in order to induce pro-inflammatory gene transcription. Transient
  increases in 14-3-3 protein levels induced by LPS ultimately reestablishes the 14-3-3/IKKβ
  interaction to return microglia to baseline resting state. Created in BioRender.
  Stone, W. (2025) https://BioRender.com/8rw7v7t
