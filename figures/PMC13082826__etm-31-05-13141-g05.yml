figure_title: Schematic diagram of the cytological basis for FCER1G prognostic paradox.
caption: 'Schematic diagram of the cytological basis for FCER1G prognostic paradox.
  The dual prognostic value of FCER1G is clearly demonstrated to depend on the cellular
  context in which it is expressed. Left pathway: When FCER1G is highly expressed
  in M2 TAMs, it promotes an immunosuppressive microenvironment, leading to poor prognosis.
  Right pathway: When FCER1G is highly expressed in effector immune cells such as
  natural killer cells, it enhances the antitumor immune response, which is associated
  with favorable prognosis. The figure was drawn with FigDraw2.0 (supplied by Hangzhou
  Sifei Technology Co., Ltd.). FCER1G, Fc fragment of IgE receptor 1G; TME, tumor
  microenvironment; TAMs, tumor-associated macrophages; ADCC, antibody-dependent cellular
  cytotoxicity'
