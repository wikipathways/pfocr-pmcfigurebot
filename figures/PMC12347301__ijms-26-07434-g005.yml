figure_title: RSV negatively regulates the insulin pathway downstream of Akt.
caption: RSV negatively regulates the insulin pathway downstream of Akt. C9 cells
  were pretreated with different concentrations of RSV (12.5–75 µM as indicated) and
  then stimulated with 100 nM insulin for an additional 10 min. Under all experimental
  conditions, untreated cells were used as controls. Total cell lysates were separated
  by SD-PAGE and analyzed by immunoblotting with anti-p-Akt-Thr308 (A) or anti-p-GSK3α/β-Ser21/9
  (B) and anti-p-GS-Ser641 (C), as described in Materials and Methods. Representative
  blots of Akt, GSK3, and GS phosphorylation are shown (D). * The same blot was used
  in Figure 2C, as it corresponds to the same experiment. Western blots were also
  probed for total Akt showing equal loading. Data represent the mean ± S.E.M. of
  five to six individual experiments, and the panels below show representative immunoblots.
  Vertical lines represent the S.E.M. The p-value indicates Ins vs. control (A–D);
  RSV [12.5–75 µM] + Ins [100 nM] vs. Ins (A–D)
