figure_title: Differential HDAC6 and ATAT1 phosphorylation serve a pivotal role in
  orchestrating context-specific microtubule stability and dynamics during GSIS
caption: '(A) UMAP comparing high glucose to low glucose phosphorylations in MIN6
  cells revealed key phosphorylations of known acetylation/deacetylation pathway regulators:
  HDAC6[S21] and ATAT1[S315] (both of which phosphorylations are conserved in humans).(B-C)
  Representative spectra of HDAC6[S21] (B) and ATAT1[S315] (C) phosphorylations as
  derived from Skyline software. To the top of each graph is the amino acid sequence
  for the peptide of interest, with the phosphorylated site indicated in red font
  with a “p” in front.(D-E) Plots showing the relative abundance (×10^6) of each phosphorylation
  in the following different GSIS treatment conditions in MIN6 cells, 15 minutes after
  stimulation: LG, HG, HG+TUG891, HG+Exendin4, and HG+TUG891+Exendin4 (Combo). Error
  bars= SD, N=3(F) Plot measuring the effects of HDAC6 inhibitor treatment (5nM Ricolinostat
  (ACY-1215)) on percentage insulin secretion as measured by luciferase assay in MIN6
  cells. Cells were grown in low glucose and preincubated either with DMSO or HDAC6i.
  Samples were treated with one of the following conditions for 30 minutes before
  harvesting supernatant (without washout of DMSO or HDAC6i): LG, HG, HG+TUG891, HG+Exendin4,
  or HG+TUG891+Exendin4 (Combo). Error bars=SD, N=3.(G) Analysis of HDAC6 localization
  via IF of MIN6 cells at different time points after stimulation of GSIS conditions.
  Above are shown confocal z-stack images (60x magnification) were collected, with
  green= HDAC6, red= β-tubulin, blue= DAPI. Scale = 10μm. Below are plots showing
  quantification of HDAC6 localization at nucleus (left) versus cytoplasm (right)
  under different treatment conditions. Error bars= SEM. Statistical significance
  was assessed via One-Way ANOVA, with *P = 0.05; **P = 0.01; ***P=0.001; ****P =
  0.0001. Plots were generated using GraphPad Prism software.(H) Analysis of ATAT1
  localization via IF of MIN6 cells at different time points after stimulation of
  GSIS conditions. Above are shown confocal z-stack images (60x magnification) were
  collected, with green= ATAT1, white= acetylated tubulin, blue= DAPI. Scale= 10μm.
  Below are plots showing quantification of ATAT1 localization at nucleus (left) versus
  cytoplasm (right) under different treatment conditions. Error bars= SEM. Statistical
  significance was assessed via One-Way ANOVA, with *P = 0.05; **P = 0.01; ***P=0.001;
  ****P = 0.0001. Plots were generated using GraphPad Prism software.(I) Imaging of
  MIN6 cells treated with different GSIS stimulating conditions reveals context-dependent
  differences in frequency of mitochondria-cis Golgi inter-organellar contacts. Cells
  were stained with the following markers: Complex I to mark mitochondria (red), -COP
  to mark (green), and DAPI to mark nuclei (blue). Z-stacks were collected via confocal
  microscopy at 60x magnification. Scale bar= 10μm. Shown here are representative
  images of low glucose versus high glucose (5min) treatments.(J) Plot showing quantitation
  of percentage of cells with mitochondria-cis Golgi contacts under different GSIS
  stimulation conditions, at 5 versus 20min timepoints post-stimulation. Error bars=
  SEM. Statistical significance was assessed via One-Way ANOVA, with *P = 0.05; **P
  = 0.01; ***P=0.001; ****P = 0.0001. Plots were generated using GraphPad Prism software'
