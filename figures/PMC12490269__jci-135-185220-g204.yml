caption: '(A) Heatmap of supervised analysis of RNA-Seq results of MM-337 and MM-505
  in vivo tumors after treatment with vehicle or Cobi+Reg. (B) z scores of downregulated
  genes in various biological processes (as determined by Fisher’s exact test) identified
  by Gene Ontology analysis. (C) qRT-PCR analysis of expression of various differentially
  downregulated genes after treatment of MM-337 cells in culture with vehicle or Cobi+Reg;
  *P < 0.05 by Student’s t test. (D) Western blot analysis of expression of various
  proteins in MM-337 cells treated with vehicle or Cobi+Reg in culture. (E) z scores
  of upregulated genes in various biological processes identified by Gene Ontology
  analysis. (F) qRT-PCR analysis of expression of various differentially upregulated
  genes after treatment of MM-337 cells in culture with vehicle or Cobi+Reg; *P <
  0.05 by Student’s t test. (G–I) Representative images of immunofluorescence detection,
  as well as quantification of expression of HLA (ABC) (H) and B2M (I) in MM-337 in
  vivo tumors treated with vehicle or Cobi+Reg; *P < 0.05 by Student’s t test. Scale
  bar: 20 μm'
