figure_title: Heatmap and volcano plot of changes in metabolites and effect of placebo
  and sevelamer on plasma taurocholate, glycocholate and FGF19 concentration in the
  obesity group
caption: '(A) Heatmap of plasma metabolite levels in lean and obesity subjects. This
  heatmap visualizes the plasma concentrations of 286 significantly different metabolites
  between lean and obesity groups at baseline (Welch’s t-Test, p < 0.05). Three groups
  are included and labeled on the top bar: Lean at baseline (left section) and Obese
  before treatment (left section). Each column represents an individual participant.
  The rows represent individual metabolites, with examples of the top 10% most highly
  significant on the right side. The color intensity represents the normalized and
  imputed data for each metabolite, with the following gradient: Blue: Lower levels
  (value = 0); Red: Higher levels (value = 4); Intermediate colors (purple shades):
  Moderate levels (value = 2). The leftmost color bars represent different nutrients
  groupings for all the metabolites. (B) Heatmap of plasma metabolite levels in the
  Obesity group pre- and post-sevelamer. The heatmap visualizes plasma concentrations
  of 194 significantly different metabolites in the Sevelamer group during pre- vs.
  post-intervention analyses within the Obesity group (paired t-test, p < 0.05). Three
  groups are included and labeled on the top bar: Lean at baseline (left section,
  brown), Obesity receiving placebo [middle section, Pre (light blue) and Post (blue)
  group], and Obesity receiving sevelamer [right section, Pre (light blue) and Post
  (blue) group]. Each column represents an individual participant, with each color
  representing a different subject, and they are ranked in the same order in the Pre
  and Post groups. The rightmost rows represent individual metabolites, with examples
  of top 10% most highly significant listed on the right side along with their related
  pathway. The color intensity represents the normalized and imputed data for each
  metabolite, with the following gradient: Blue: Lower levels (value = 0); Red: Higher
  levels (value = 4); Intermediate colors (purple shades): Moderate levels (value
  = 2). The leftmost color bars represent different groupings for all the metabolites.
  (C) Volcano plot of changes in metabolite concentrations with sevelamer treatment
  in the obese group, (D) glycocholate, (E) taurocholate, and (F) FGF19 concentrations.
  Data are means ± SEM. *p<0.05'
