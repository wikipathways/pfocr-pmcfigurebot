figure_title: Reprogrammed energy metabolism of gut Tregs.
caption: 'Reprogrammed energy metabolism of gut Tregs. (A) Volcano plots depicting
  the DEGs across comparisons of NCs/IRs, NCs/INRs, and INRs/IRs. (B) Cluster heatmap
  displaying the specific DEGs identified in the NCs/IRs, NCs/INRs, and INRs/IRs.
  Z-score standardization was applied to normalize the data by centering (subtracting
  the mean) and scaling (dividing by the standard deviation). (C) Bubble plot of GO
  enrichment analysis of the DEGs. “Count” indicates the number of DEGs enriched in
  pathway; “GeneRatio” indicates the ratio of enriched DEGs to background genes; “p.adj”
  indicates the p-value corrected by ‘BH’ method. (D) Violin plot showing metabolism-related
  scores for Tregs across the three groups. The Mann-Whitney U test was employed to
  assess statistical differences between groups. Significance levels are denoted as
  follows: * p < 0.05; ** p < 0.01; *** p < 0.001; **** p < 0.0001; ns indicates non-significant
  results. (E) Dot plot showing the expression levels of metabolism-related genes.
  DEGs: differentially expressed genes; GO: gene ontology; BH: Benjamini–Hochberg'
