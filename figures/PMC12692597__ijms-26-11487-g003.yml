figure_title: Common immune mediators and their mechanism of action.
caption: 'Common immune mediators and their mechanism of action. Different cytokines,
  belonging to different families, can contribute to disease development in AD (some
  that are more relevant have been written in bold letters to facilitate their identification).
  Most activated receptors signal via the Janus kinase (JAK)/STAT cascade, each with
  concrete JAK subtypes (JAK1, JAK2, JAK3 and TYK2). If a JAK protein is depicted
  with a faint color next to a receptor, this indicates that its activity within the
  pathway has been reported only in murine models, experimental conditions, non-physiological
  contexts, or specific cellular subsets. The signal transducer and activator of transcription
  (STAT) family consists of seven members. The JAK/STAT pathway is used by many cytokines
  relevant to AD apart from interleukins (ILs) themselves, including alarmins and
  interferons (IFN). Sharing intracellular pathways makes some functions redundant
  and explains the complexity in managing AD effectively by addressing a unique molecule.
  For example, the fact that the IL-7Rα is a shared component between the thymic stromal
  lymphopoietin (TSLP) receptor complex and the IL-7 receptor complex explains some
  of the overlapping functions of these cytokines. However, whereas the TSLP receptor
  complex utilizes JAK1 and JAK2 for STAT5 activation, IL-7 signaling involves JAK1
  and JAK3 [11]. Highlights from innate immunity: TSLP interacts with its receptor
  complex (TSLP receptor [TSLPR]/IL-7 receptor alpha chain [IL-7Rα]) on various immune
  cells and is particularly crucial in the pathogenesis of AD. For instance, it induces
  the expression of OX40L on dendritic cells (DCs), a key signaler for the polarization
  of naïve T cells towards a T helper (Th) 2 phenotype. TSLP also elicits innate lymphoid
  cells (ILC) 2, together with but also independently from IL-33 [12]. IL-33 belongs
  to the IL-1 superfamily—which also comprises the IL-1, IL-36 and IL-18 subfamilies
  [13]—and is mainly secreted by structural cells, and binds to a specific receptor
  from the Toll-like receptor (TLR)/IL-1R superfamily. It acts as an amplifier towards
  ILC2 and Th2 cells, stimulates the production of IL-4 by eosinophils, increases
  local fibrosis, and has replicated AD-like cutaneous manifestations with eosinophil
  and mast cell accumulation in murine models [14,15,16,17]. Notably, both TSLP and
  IL-33 influence mast cell proliferation (IL-33 acting via the MyD88 pathway and
  TSLP involving STAT6 signaling), adhesion, and mediator release [18]. IL-25 similarly
  promotes Th2 differentiation through DCs and ILCs [19]. Highlights from adaptive
  immunity: Cytokines such as IL-1α and IL-36 help facilitate transition to adaptive
  immunity. IL-4 is essential for Th2 differentiation. IL-4 and IL-13 receptors will
  be addressed more deeply in a separate figure due to their central role in disease
  pathogenesis and the development of various targeted therapies against them or their
  receptors. IL-5 is crucial for eosinophil maturation and survival. IL-31, despite
  signaling through its own receptor, belongs to the IL-6 family, and is related to
  inflammatory responses and pruritus. IL-22 has a role in barrier repair but can
  also contribute to skin lichenification in chronic stages of the disease. IL-2 and
  IL-10 signaling contribute to downregulation of immune responses through regulatory
  T cells (Tregs) and are decreased in AD. IFN-γ is produced by Th1 cells and increases
  its relevancy in chronic stages of the disease with a higher Th1 presence'
