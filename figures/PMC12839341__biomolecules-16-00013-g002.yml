figure_title: Replication-coupled chromatin assembly.
caption: Replication-coupled chromatin assembly. (A). Posttranslational modification
  of newly synthesized histones H3-H4 for their deposition on nascent DNA by chromatin
  assembly factors. Newly synthesized histone (H3-H4) dimer is chaperoned by Asf1.
  Rtt109 binds Asf1 and acetylates histone H3-K56 (H3-Ac). Rtt101/Mms1/Mms22 then
  ubiquitinates H3-K121, -K122, and -K125 (H3-Ub). H3-Ac and H3-Ub facilitate the
  handover of (H3-H4) dimer from Asf1 to CAF-1 and Rtt106 chromatin assembly factors.
  (B) Deposition of newly synthesized and parental histones H3-H4 on daughter strands
  at the DNA replication fork. Left, newly synthesized histones H3-H4 marked by H3-Ac
  and H3-Ub (green circles) are deposited by CAF-1 or Rtt106 to both leading and lagging
  strands. Right, parental histone (H3-H4)2 tetramers (red circles) are transferred
  to the leading strand via the Polε pathway, and to the lagging strand through the
  MCM-Ctf4-Polα axis and PCNA-Polδ axis. Replisome components CMG, Polα, Polδ, Polε,
  Ctf4, PCNA, and FACT are shown. See the text for more descriptions
