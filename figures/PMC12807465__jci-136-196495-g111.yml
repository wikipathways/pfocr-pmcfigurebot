figure_title: UGT2B17 regulates PERK and IRE1a pathways independent of its androgen-catabolic
  activity
caption: (A) LN95(KO) cells were transfected with control, UGT2B17, and UGTm for 16
  hours. Real-time qPCR measured the mRNA levels of the indicated genes. (B) LNCaP
  cells were transfected with GFP-tagged IRE1a and treated with vehicle or 5 μM TG
  for the 6 hours. IRE1a oligomerization was monitored by confocal microscopy and
  counted in 7 randomly selected high-power fields. (C) LN95(KO) cells were transfected
  with control, UGT2B17, or UGTm for 16 hours. Cells were then treated with increasing
  doses of TG or MG for 0–96 hours. Cell viability was measured by Incucyte and plotted
  over vehicle treatment at day 0. (D) Protein lysates were collected from LNCaP95,
  LN95(KO), and LN95(KO) cells transfected with UGT2B17 or UGTm for 72 hours. The
  PDI activity was measured. (E) Purified Flag UGT2B17 and UGTm were used to measure
  their impacts to PDI activity. (F) LNCaP95 and LN95(KO) cells were treated with
  2 μm PACMA31 and/or 1 μM TG for 16 hours. Cell lysates were collected for immunoblotting
  using the indicated antibodies. (G) LNCaP95 and LN95(KO) cells were treated with
  increasing doses of PACMA31 and TG for 16 hours. Cell viability was measured and
  plotted over vehicle treatment. (H) LN95(KO) cells transfected with UGT2B17 or UGTm
  were treated with 2 μm PACMA31 and/or 1 μM TG for 16 hours. Cell lysates were collected
  for immunoblotting using the indicated antibodies. (I) A model depicting PDI activity
  suppressed by UGT2B17 to control the PERK/CHOP pathway to determine the cell fate.
  Experiments in A–H were performed 3 times with similar results obtained. Data are
  shown as the mean ± SEM. Statistical tests performed by 2-way ANOVA test (A, B,
  and D), 1-way ANOVA test (E). **P < 0.01, ***P < 0.001
