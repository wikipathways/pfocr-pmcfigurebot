figure_title: Parallel spinothalamic tract pathways drive mechanical hypersensitization
caption: 'a, Representative image of transsynaptically labeled thalamic neurons and
  their terminals in the SS. AAV1-Cre was injected into the spinal cord and AAV8-FLEX-mScarlet
  into the thalamus. Scale Bar: 500 μm. b, Functional connectivity between Po, VPL
  with retrogradely labeled lSuC-projecting neurons in SS. Upper: optical EPSC (oEPSC)
  traces. Lower: Connectivity quantification. Numbers indicate cells with oEPSC/total
  recorded. Scale bar: 50 ms, 50 pA. c,d, Mechanical thresholds after saline (black,
  n = 7 (c, left), n = 5 (c, right), n = 7 (d)) and CLZ (blue, n = 7 (c, left), n
  = 5 (c, right), n = 7 (d)) injection into mice expressing hM4D in SC→VPL (c, left),
  SC→Po (c, right), or in both pathways (d: P = 0.8125, 0.0156, 0.0156). e, CPA after
  silencing SC→VPL (n = 6), SC→Po (n = 5), or both pathways (n = 5). f, Mechanical
  thresholds after 7 daily CLZ infusion (shaded) in non-injured mice expressing hM3D
  in SC→Po (left, n = 5) or SC→VPL (right, n = 5) pathway. g, CPA after repetitive
  activation of SC→VPL (n = 5) or SC→Po (n = 5) pathway. Control (black, n = 5). h,
  Diagram (left) and quantification (right) of silencing both SC→VPL, SC→Po pathways
  (yellow, n = 5) or DCN→VPL pathway (white, n = 6) or wildtype mice without manipulation
  (WT, gray, n = 5) on texture discrimination (P = 0.0625, 0.0313, 0.1250). i, Summery
  circuity diagram for pain sensitization and touch/tactile sensation. Dash line:
  hypothetical interneurons connecting the OPRM1+ inhibitory inputs to the excitatory
  STT output pathway. See supplementary Table 1 for detailed statistics. Two-sided
  Wilcoxon signed-rank test (c, d, h); One-way ANOVA (e); Non-parametric ANOVA (f,
  g). * P < 0.05, ** P < 0.01, *** P < 0.001. Mean ± SEM'
