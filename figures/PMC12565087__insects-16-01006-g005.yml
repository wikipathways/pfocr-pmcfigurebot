figure_title: The mTOR signaling pathway plays a crucial role in differential resistance
  of JPS against Beauveria bassiana (Bb) and Metarhizium anisopliae (Ma) infection.
caption: 'The mTOR signaling pathway plays a crucial role in differential resistance
  of JPS against Beauveria bassiana (Bb) and Metarhizium anisopliae (Ma) infection.
  (a–c) Corrected mortality of JPS larvae were assessed 24 h post-treatment with:
  (a) rapamycin (RAPA), (b) Torin-1, and (c) mTOR-targeting RNAi products (dsmTOR-1,
  dsmTOR-2, dsmTOR-3), following 24 h infections with Bb or Ma. (d) Schematic representation
  of mTOR-mediated immune defense activation upon Bb infection. Data are presented
  as mean ± SD. Statistical significance (p < 0.05, one-way ANOVA with Tukey’s multiple
  comparisons test) is indicated by “*” (significant) and “ns” (not significant)'
