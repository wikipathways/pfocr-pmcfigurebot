figure_title: Genes specifically upregulated at the early grain filling stage (S5)
  in node I.
caption: Genes specifically upregulated at the early grain filling stage (S5) in node
  I. (a) Heat map showing genes significantly upregulated at S5 in node I. The gene-normalized
  signal intensities are shown in the heat maps using Z-scores and clustered by the
  average method. S1 to S7 represent seven different growth stages during the reproductive
  growth stage. The red color in the heatmaps represents higher expression levels,
  while green represents lower expression levels. (b,c) GO enrichment analysis (b)
  and KEGG enrichment analysis (c) of DEGs in (a). The top 20 GO terms or the KEGG
  pathways with the lowest p-values are shown. (d–f) Four representative genes specifically
  upregulated at S5 in node I are shown. Data are shown as mean ± SD with three independent
  biological replicates. Different letters indicate significant differences of gene
  expression levels among different stages at p ≤ 0.05 with three biological replicates
  (Tukey’s multiple comparisons test). FPKM, Fragments Per Kilobase of transcript
  per Million mapped reads
