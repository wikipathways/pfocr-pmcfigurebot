figure_title: ER stress-mediated regulation of tumor cell metabolism.
caption: ER stress-mediated regulation of tumor cell metabolism. ER stress reprograms
  cellular metabolism to support tumor growth through the three canonical pathways
  of the UPR, initiated by the sensors PERK, IRE1α, and ATF6. Upon activation, the
  PERK pathway phosphorylates eIF2α, which enhances the translation of HIF-1α and
  c-MYC to drive glycolysis, and activates transcription factor ATF4 to promote glutamine
  metabolism by upregulating genes such as SLC1A5, ASNS, and GLS1. Concurrently, the
  IRE1α pathway, through the splicing of XBP1 mRNA to its active form XBP1s, upregulates
  genes involved in both lipid metabolism (SCD1, FASN, ACLY) and glycolysis (PKM2),
  while also suppressing the glycolysis inhibitor TXNIP. The ATF6 pathway contributes
  by activating the transcription factor SREBP to further promote lipid synthesis.
  Collectively, these ER stress signaling networks converge to regulate glycolysis,
  lipid metabolism, and glutamine metabolism, highlighting the critical role of the
  UPR in sustaining the metabolic demands of cancer cells
