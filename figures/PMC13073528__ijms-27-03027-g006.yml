figure_title: Molecular mechanisms through which DHA targets ferroptosis in UM cells.
caption: 'Molecular mechanisms through which DHA targets ferroptosis in UM cells.
  DHA is extracted from the leaves of Artemisia annua Linn. The xCT/SLC3A2-GSH-GPX4
  system plays a critical role in cellular resistance to ferroptosis. In UM cells,
  DHA promotes ferroptosis by inhibiting the xCT/GPX4 signaling pathway. In the catabolic
  products of heme and HO-1, divalent iron ions are generated through the Fenton reaction,
  which accelerates the accumulation of lipid peroxides and ROS, further promoting
  ferroptosis. Additionally, the Fenton reaction produces highly reactive hydroxyl
  radicals (OH-), which, under the catalytic effects of OH- and enzymes such as ACSL4
  and LPCA3, initiate the lipid peroxidation chain reaction. PUFAs trigger the lipid
  peroxidation chain reaction. This cascade ultimately leads to ferroptosis. DHA facilitates
  ferroptosis primarily through the upregulation of HO-1 and downregulation of the
  xCT/GPX4 signaling pathway, two key steps that promote ferroptosis. The iron chelator
  deferoxamine (DFO) prevents iron-dependent lipid peroxidation by sequestering free
  iron. The red and blue arrows next to HO-1 indicate its dual role: elevated HO-1
  can both promote cell survival and induce cell death'
article_title: Dihydroartemisinin Induces Ferroptosis in Uveal Melanoma Cells Through
  the HO-1 and xCT/GPX4 Signaling Pathways
