figure_title: This figure illustrates the integration of NO and GSNOR signaling into
  plant immunity.
caption: This figure illustrates the integration of NO and GSNOR signaling into plant
  immunity. Recognition of pathogen-associated molecular patterns (PAMPs) by receptor-like
  kinases such as FLS2 and BAK1 activates the cytoplasmic kinase BIK1, triggering
  Ca2+ influx, MAPK cascades, and NADPH oxidase (RBOHD)-dependent ROS bursts. Nitric
  oxide (NO) interacts with ROS to regulate hypersensitive response (HR) and programmed
  cell death (PCD), and reacts with glutathione (GSH) to form S-nitrosoglutathione
  (GSNO), a mobile reservoir of NO bioactivity and the main donor of S-nitrosylation
  (SNO). GSNO levels are tightly controlled by S-nitrosoglutathione reductase (GSNOR),
  while regulators such as QSOX1 and PcRD18 modulate its activity. Protein S-nitrosylation
  modifies immune regulators, including SRG1, SABP3, and NPR1, thereby controlling
  their stability, activity, and redox-dependent transitions. NPR1, in particular,
  undergoes S-nitrosylation to regulate its oligomer–monomer transition and SA-dependent
  transcriptional activity (Figure 4; Table 1 and Table 4). Denitrosylation is mediated
  by thioredoxin h5 (Trx5), linking NO/SNO homeostasis to SA signaling. Pathogen effectors
  can suppress immunity by targeting GSNOR, whereas R proteins and the EDS1–PAD4 complex
  activate effector-triggered immunity (ETI). Through the GSNO/GSNOR balance, NO signaling
  intersects with salicylic acid (SA), jasmonic acid (JA), and ethylene (ET) pathways,
  coordinating defense gene expression, HR/PCD, and systemic acquired resistance (SAR).
  Black solid arrows indicate direct activation where blunt shows inhibition
