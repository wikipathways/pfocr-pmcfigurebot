figure_title: |-
  Activation of the ATM/TP53 pathway in the Myh6-McmTam
  Dspfl/fl cardiomyocytes
caption: |-
  (A) Circos map of the differentially expressed genes showing activation of the DDR ATM/TP53 and the CDSP CGAS/STING1 pathways in the Myh6-McmTam
  Dspfl/fl (compared with the WT) myocytes. Fold change in gene expression is depicted as log2 units. (B) GSEA plot showing enrichment of TP53 target genes in the Myh6-McmTam
  Dspfl/fl myocytes compared with the WT. NES and the q value are depicted. (C) Immunoblot of selected proteins in the nuclear cell cycle checkpoint DDR pathway. (D) Dot plots showing individual data points, median, and 95% CI of the data on the expression levels of the selected proteins in the nuclear DDR pathway. ANOVA P values are shown along with Bonferroni-corrected pairwise P values (N = 4 per group)
