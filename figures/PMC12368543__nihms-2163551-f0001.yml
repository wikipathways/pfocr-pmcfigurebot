figure_title: Evidence supporting a role of AMPK signaling in regulating uteroplacental
  vascular function and fetal growth at high altitudes.
caption: Evidence supporting a role of AMPK signaling in regulating uteroplacental
  vascular function and fetal growth at high altitudes. 1) A putatively adaptive PRKAA1
  variant identified in highland Andeans was associated with increased uterine artery
  (UA) diameter and birth weight at high altitude (HA) and altered AMPK-mTOR pathway
  gene expression in maternal peripheral blood mononuclear cells during pregnancy.
  2) Together, human studies (in vitro) and animal experimental models (in vitro and
  in vivo) indicate that pharmacological AMPK activation increased UA and myometrial
  artery (MyoA) responses in healthy HA pregnancy, enhanced redistribution of maternal
  cardiac output (CO) to the uteroplacental (U-P) circulation and partially protected
  against reduced fetal growth at HA. 3) Maternal peripheral blood mononuclear cell
  PRKAA1 expression was positively associated with UA diameter at HA (2850 m) compared
  to lower altitudes (LA, 1609 m). 4) Placental AMPK activation, as assessed by the
  expression of phosphorylated AMPK (pAMPK), increased with altitude in a dose-dependent
  manner. 5) High AMPK activation may suppress mitochondrial respiration. Reduced
  mitochondrial complex I (CI) and IV (CIV) activity has been observed in experimental
  studies of human trophoblasts under hypoxic conditions. Recent studies of healthy
  HA pregnancy found an inverse relationship between maximal mitochondrial oxidative
  metabolism (OXPHOS) in the human placenta and umbilical venous pO2, supporting a
  link between placental metabolism and fetal oxygenation. Created in BioRender. Julian,
  C. (2025) https://BioRender.com/f45l366
