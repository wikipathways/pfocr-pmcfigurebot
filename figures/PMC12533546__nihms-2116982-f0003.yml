caption: 'Neural Pathways Connecting Brodmann Areas Panel A: Frontal aslant tract
  (FAT) and inferior fronto-occipital fasciculus (IFOF) traced in one participant
  diffusion tensor imaging data by the deterministic fiber tracking algorithm in DSI
  Studio. Panel B: Parcellations of the cortex in 41 Brodmann areas indicated by numbers,
  where each area is coded in a different color. Panel C: Combining contiguous Brodmann
  areas that engendered fiber tracts into the same neural pathway, thereby partitioning
  the brain into 14 regions. Homologous areas in the two hemispheres are coded in
  the same color. FAT=frontal aslant tract; IFOF=inferior fronto-occipital fasciculus;
  SM=Somatosensory; MPM=Motor-Premotor; SF=Superior-Frontal; OF=Orbito-Frontal; BA=Broca’s
  Area; TP=Temporal Pole; Fu=Fusiform; LT=Lateral Temporal; OC=Occipital Cortex; WR=Wernicke’s
  Region; SP=Superior Parietal; Cer=Cerebellum;'
