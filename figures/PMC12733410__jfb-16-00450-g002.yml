figure_title: The preferential inhibitory activity of HCQ-L on endosomal TLR signaling
  pathways in THP-1 reporter cell-derived macrophages.
caption: 'The preferential inhibitory activity of HCQ-L on endosomal TLR signaling
  pathways in THP-1 reporter cell-derived macrophages. (a) The schematic diagram of
  TLR2/3/4/7/8 signaling pathways. (b) The effects of HCQ-L and empty liposomes (Lipo)
  on the cell viability of the THP-1 reporter cell-derived macrophages. N = 3. (c–h)
  The effects of HCQ-L on the activation of NF-κB/AP-1 (c,e,g) and IRF (d,f,h) in
  the THP-1 reporter cell-derived macrophages upon LPS (for TLR4) (c,d), Poly I:C
  (for TLR3) (e,f), and R848 (for TLR7/8) (g,h) stimulation. (i) The effects of HCQ-L
  on the Pam3CSK4 (for TLR2)-induced activation. LPS = 10 ng/mL, Poly I:C = 50 μg/mL,
  R848 = 10 μg/mL, Pam3CSK4 = 10 ng/mL, L/HCQ-L = 1, 10, 50 μM; N = 3; ns: not significant,
  * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001 vs. TLR agonist groups unless
  otherwise specified'
