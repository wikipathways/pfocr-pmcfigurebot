figure_title: Transcriptomic profiling of C6/36 cells infected with Umatilla virus
  (NX23166).
caption: Transcriptomic profiling of C6/36 cells infected with Umatilla virus (NX23166).
  (A) Z-score heatmap of gene expression. Red indicates high expression, blue indicates
  low expression. (B) Principal component analysis plot. The mock control group, 24
  h.p.i., 48 h.p.i., and 72 h.p.i. groups are represented in gray, blue, purple, and
  red, respectively. The labels rep1, rep2, and rep3 denote three biological replicates.
  (C) Venn diagrams of differentially expressed genes (DEGs). The Venn diagrams display
  the overlap of DEGs across different time points. The top and bottom diagrams illustrate
  the overlaps among upregulated and downregulated DEG sets, respectively. (D) KEGG
  pathway enrichment bubble plot. The plot displays the top 10 most significantly
  enriched KEGG pathways. Bubble size corresponds to the number of genes enriched
  in the pathway; bubble color indicates the gene set used for the enrichment analysis
  (red, analysis with the up-regulated gene set; blue, analysis with the down-regulated
  gene set); and the position on the x-axis represents the statistical significance
  of the enrichment (−log10 (p-value))
