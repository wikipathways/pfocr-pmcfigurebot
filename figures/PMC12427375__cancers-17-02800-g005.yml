figure_title: Schematic of normal human embryonic and germline development in comparison
  to the carcinogenesis of somatic VP-MCC and germ cell tumors.
caption: Schematic of normal human embryonic and germline development in comparison
  to the carcinogenesis of somatic VP-MCC and germ cell tumors. Light green arrows
  show normal early embryogenesis from fertilization to primed pluripotent hESCs before
  crossing the Weismann barrier into somatic differentiation to form the soma. The
  intrinsic plasticity between the two-cell stage and the primed hESC stage is reflected
  in the bidirectionality of the light green arrows [1]. Normal human germline development
  (dark green arrows) begins at the specification of hPGCs from formative hESCs and
  ends with the formation of sperm or eggs, guided by an intrinsic program suppressing
  somatic fate, yet exhibiting latent/poised pluripotency [32] with the germline being
  the only human cell lineage capable of physiological conversion to pluripotency
  (parthenogenesis) without genetic manipulation. Thus, the germline cycle may be
  considered a “pluripotency cycle” [32], consisting of both early embryogenesis (light
  green arrows) and germline development (dark green arrows), which are separated
  from the soma compartment by the Weismann barrier. Based on our mouse model, carcinogenesis
  of somatic VP-MCC (red straight arrow) also crosses the Weismann barrier to the
  somatic compartment, like teratomas which are a type of non-seminomatous GCT (dark
  purple and light purple straight arrows), and normal human embryogenesis [1]. However,
  unlike teratomas or embryogenesis, VP-MCC tumorigenesis crosses the Weismann barrier
  directly from the germline (late hPGCs) to the somatic side without a pluripotent
  intermediary, resulting in mono-lineage (neuroendocrine) somatic differentiation
  accompanied by developmental arrest. In contrast, tumorigenesis of malignant teratomas
  more closely mirrors normal embryogenesis, requiring a totipotent embryonic carcinoma
  cell intermediate to cross the Weismann barrier and enable somatic differentiation
  of three germ layers. These totipotent stem cells of malignant teratomas are believed
  to arise via parthenogenetic transformation of transformed hPGCs in vivo (dark purple
  and light purple curved arrows), rather than from fertilization-derived zygotes.
  Seminomas, another malignant germ cell tumor subtype, consist of transformed late
  hPGCs and therefore retain the epigenetic signatures characteristic of this stage
  [1]. Two waves of global DNA demethylation occur during development, each followed
  by de novo methylation. The first wave begins at the two-cell stage and reaches
  its bottom at the naïve hESC/inner cell mass stage, with partial erasure of global
  DNA methylation (~40%) [33,34]. The second, germline-specific wave occurs only during
  hPGC development, resulting in near-complete global DNA methylation erasure and
  reaching the lowest bottom at the late hPGC stage (global DNA methylation ~6%) [33,34].
  The moderate global hypomethylation observed in two variant VN-MCC cell lines like
  that of seminoma cell line TCam2 and VP-MCC lines suggests a possible somatic-to-hPGC
  transformation (slanted dashed blue arrow with a question mark), potentially triggered
  by somatic mutations or other mechanisms. The somatic to hPGC transformation may
  also undergo indirect pathway through reprogramming of somatic cells into hiPSCs
  followed by specification into a hPGC-like state (vertical dashed blue arrow). The
  three human primeval stem cell types used in our mouse model, including hPGCLCs
  (modeling early hPGCs), hiPSCs (modeling primed hESCs), and hEGCLCs (modeling hEGCs),
  are highlighted in yellow
