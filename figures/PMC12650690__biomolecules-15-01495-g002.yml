figure_title: Overview of molecular mechanisms underlying cisplatin-induced muscle
  atrophy.
caption: Overview of molecular mechanisms underlying cisplatin-induced muscle atrophy.
  Cisplatin induces mitochondrial dysfunction, endoplasmic reticulum stress, and inflammatory
  responses, which activate the ubiquitin–proteasome system and autophagy, thereby
  enhancing protein degradation. At the same time, cisplatin suppresses the Akt/mTOR
  signaling pathway, leading to reduced protein synthesis. The imbalance between protein
  degradation and synthesis ultimately results in muscle atrophy. In the figure, “↑”
  denotes upregulation or activation, “↓” indicates downregulation or suppression,
  and “⊥” represents inhibitory regulation. ROS, reactive oxygen species; ER, endoplasmic
  reticulum; UPS, ubiquitin–proteasome system; LC3-II, microtubule-associated protein
  1 light chain 3-II; mTOR, mechanistic target of rapamycin; Akt, protein kinase B;
  NF-κB, nuclear factor kappa B; STAT3, signal transducer and activator of transcription
  3; FoxO, forkhead box O; TNF-α, tumor necrosis factor alpha; IL-6, interleukin-6;
  IFN-γ, interferon gamma
