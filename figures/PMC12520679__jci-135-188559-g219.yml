figure_title: Inhibition of the Hedgehog signaling pathway in WT SMCs can phenocopy
  the antiangiogenetic effects of Carmn-KO SMCs
caption: '(A) the representative images of mECs spheroid cocultured with supernatants
  collected from WT or KO SMCs treated with or without Hedgehog signaling pathway
  inhibitors. Scale bar: 100 μm. (B) quantification of spheroid branch length and
  the number of branches in A. (C) the BrdU incorporation of mECs incubated with WT
  or KO SMCs treated with or without Hedgehog signaling pathway inhibitors. (D) the
  representative images of WB results of the indicated AKT or eNOS proteins in mECs
  after being incubated with supernatants collected from WT or KO SMCs treated with
  or without Hedgehog signaling pathway inhibitors. (E) the quantification of the
  indicated protein expression levels in D. (F) representative images of mECs in the
  network formation assay after incubation with supernatants collected from WT or
  KO SMCs treated with or without Hedgehog signaling pathway inhibitors. Scale bar:
  1,000 μm. For all panels, error bars represent SEM. P-value was determined by 1-way
  ANOVA with Bonferroni post test (B, C, E, and F)'
