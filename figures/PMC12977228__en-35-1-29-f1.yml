figure_title: Ethanol extract from Chrysanthemum zawadskii flower reduces LPS-induced
  inflammation by inhibiting the NF-κB pathway in BV2 microglial cells.
caption: 'Ethanol extract from Chrysanthemum zawadskii flower reduces LPS-induced
  inflammation by inhibiting the NF-κB pathway in BV2 microglial cells. (A) Antioxidant
  activity of the indicated concentrations of an ethanol extract from Chrysanthemum
  zawadskii (CZ-F), as determined using the DPPH (left panel) and ABTS (right panel)
  assays. (B, C) BV2 cells were treated with 100 ng/ml of LPS for 24 h in the presence
  of the indicated concentration of CZ-F. Intracellular ROS levels were measured by
  DCF-DA assay, (B) and nitrite levels, indicative of NO production, were quantified
  in the media using Griess reagents (C). (D) BV2 cells were treated with the indicated
  concentrations of CZ-F with or without 100 ng/ml of LPS for 24 h. The mRNA expression
  levels of the indicated cytokines were analyzed by RT-PCR, with β-actin detected
  as a control. (E, F) BV2 cells were treated with 100 ng/ml of LPS for 30 min with
  or without the indicated concentration of CZ-F. Total cell lysates were prepared
  and subjected to immunoblotting with the indicated antibodies, with β-actin detected
  as a loading control. The ratio of phosphorylated IκBα expression levels per IκBα
  protein were quantified (F, bottom panel). (G) BV2 cells were treated with 100 ng/ml
  of LPS for 15 min with or without the indicated concentration of CZ-F. Cells were
  incubated with an anti-p65 antibody, followed by a FITC-conjugated secondary antibody.
  Nuclei were counterstained with DAPI. Photographs were obtained under confocal microscopy.
  Scale bar: 10 μm. Data are presented as mean±standard deviation (SD). Significant
  differences between groups are denoted as *p<0.05, **p<0.01, or ***p<0.001'
