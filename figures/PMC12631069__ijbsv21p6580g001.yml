figure_title: Metabolic rearrangement in macrophage polarization to classically activated
  proinflammatory “M1” macrophages or alternatively activated anti-inflammatory “M2”
  macrophages.
caption: Metabolic rearrangement in macrophage polarization to classically activated
  proinflammatory “M1” macrophages or alternatively activated anti-inflammatory “M2”
  macrophages. Pro-inflammatory stimuli induce the activation of specific pathways
  through the stabilization of transcription factors such as nuclear factor (NF)-κB
  and hypoxia-inducible factor (HIF)-1α, which trigger the expression of markers like
  inducible nitric oxide synthase (iNOS), CD80, and CD86 and the release of tumor
  necrosis factor (TNF)-α, IL-1β, IL-6, IL-12, and IL-23. Cells undergo a metabolic
  reprogramming toward glycolysis, the pentose-phosphate pathway, and fatty acid synthesis.
  This associates to interruption of tricarboxylic acid (TCA) cycle, ROS formation
  and efflux of citrate, which supports nicotinamide adenine dinucleotide phosphate
  (NADPH) and prostaglandin (PG) E2 synthesis, and succinate, which stabilizes HIF-1α,
  thereby promoting lipopolysaccharide (LPS)-induced expression of IL-1β. Alternatively,
  anti-inflammatory “M2” macrophages are induced by cytokines such as IL-4 and IL-13,
  leading to activation of transcription factors like STAT6 and peroxisome proliferator-activated
  receptor-γ (PPAR-γ). These cells are characterized by the expression of markers
  such as arginase-1 (Arg1), CD206 (mannose receptor), and Ym1, and the secretion
  of anti-inflammatory mediators like IL-10 and TGF-β. M2 polarization is associated
  with enhanced oxidative metabolism, including increased fatty acid oxidation (FAO)
  and mitochondrial oxidative phosphorylation (OXPHOS), along with an intact TCA cycle.
  This metabolic profile supports cellular functions such as tissue repair, matrix
  remodeling, efferocytosis (clearance of dead cells), and resolution of inflammation.
  Additionally, metabolic regulators like carbohydrate kinase-like protein (CARKL)
  and PPAR-γ coactivator 1 β (PGC-1β) contribute to maintaining redox balance and
  limiting pro-inflammatory responses. ATP, adenosine triphosphate; ETC, electron
  transport chain; FAS, fatty acid synthesis; F6P, fructose-6-phosphate; Gln, glutamine;
  Glu, glutamic acid; GLUT, glucose transporter; G6P, glucose-6-phosphate; HRE, hypoxia
  response element; IFN-γ, interferon-γ; PPP, pentose phosphate pathway; TLR4, toll-like
  receptor 4
