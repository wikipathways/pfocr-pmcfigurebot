figure_title: Effects of co-treatment with chloroquine and myricetin on the JAK2/STAT3
  pathway and stemness markers in Huh7- and Hep3B-derived LCSCs.
caption: Effects of co-treatment with chloroquine and myricetin on the JAK2/STAT3
  pathway and stemness markers in Huh7- and Hep3B-derived LCSCs. Huh7- and Hep3B-derived
  LCSCs were pretreated with chloroquine (200 μM) for 1 h, followed by myricetin (100
  μM) treatment for 24 h. Protein expression levels were determined by western blotting
  and are presented as the normalized ratio of each target protein (or phosphorylated
  protein) to β-actin or the corresponding total protein. Data are presented as mean
  ± SD (n=3). *p<0.05, **p<0.01 compared to the myricetin-treated group. LCSC, liver
  cancer stem cell; NT, non-treated; CQ, chloroquine; Myri, myricetin; p-, phosphorylated;
  JAK2, janus kinase 2; STAT3, signal transducer and activator of transcription 3;
  Sox2, SRY-box transcription factor 2; Oct4, octamer-binding transcription factor
  4; Nanog, Nanog homeobox; ALDH1A1, aldehyde dehydrogenase 1 family member A1
