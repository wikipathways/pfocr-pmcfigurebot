figure_title: Activation of the NLRP3 inflammasome-IL-1β pathway in the retina by
  HFHF diet under BL exposure.
caption: Activation of the NLRP3 inflammasome-IL-1β pathway in the retina by HFHF
  diet under BL exposure. The expression of IL-1β and NLRP3 inflammasome components
  was examined by immunofluorescence staining in mice fed an HFHF diet or standard
  chow for 40 weeks, followed by 8 weeks of BL exposure. (A) Representative immunofluorescence
  images showing retinal expression patterns of IL-1β and NLRP3 inflammasome pathway.
  (B) Quantitative analysis of relative fluorescence intensity for each marker. Data
  represent mean ± SD (n = 8). Intergroup differences were assessed by two-tailed
  unpaired Student’s t-test (** p < 0.01, bars without asterisks denote nonsignificant
  differences). BL, blue light. HFHF, high-fructose high-fat. ONL, outer nuclear layer.
  INL, inner nuclear layer. IS/OS, photoreceptor inner segment/outer segment. GCL,
  ganglion cell layer. RFI, relative fluorescence intensity. RPE, retinal pigment
  epithelium
