caption: 'TMP activates the Wnt/β-catenin signaling pathway in the kidney of rats
  following I/R. (A) Representative western blots and semi-quantified protein levels
  showing the expression levels of Wnt1 in the renal tissue of rats in different groups.
  n=6. (B) Representative IHC images and protein semi-quantification of Wnt1 in the
  renal tissue of rats in the sham, I/R and I/R + TMP groups. n=3. (C) Representative
  western blots and semi-quantified protein levels showing the expression levels of
  β-catenin in the renal tissue of rats in different groups. n=6. (D) Representative
  IHC images and protein semi-quantification of β-catenin in the renal tissue of rats
  in the sham, I/R and I/R + TMP groups. n=3. IHC images: Top row, scale bars, 200
  µm, magnification, x40; bottom row, scale bars, 20 µm, magnification, x400. *P<0.05,
  **P<0.01, ****P<0.0001. I/R, ischemia-reperfusion; TMP, tetramethylpyrazine; IHC,
  immunohistochemistry'
