figure_title: Mechanism of a CAR-T-cell killing a tumor cell.
caption: Mechanism of a CAR-T-cell killing a tumor cell. T cells mediate cytolytic
  effector functions predominantly by either exocytosis of cytotoxic granules containing
  perforin and granzymes or apoptosis induced by the engagement with tumor necrosis
  factor (TNF) family ligands and their respective receptor, such as Fas/FasL. Typically,
  tumor antigens are categorized into tumor-associated antigens (TAAs); once TAAs
  are identified by scFv, CAR-T cells are activated and transmit activation signals
  to the intracellular domain. The CD28 co-stimulatory region can rapidly activate
  CAR-T cells, which resulted in rapidly elevating cytokine levels and may lead to
  early-onset CRS. 4-1BB CARs can activate non-canonical nuclear factor-κB (NF-κB)
  signaling after ligand engagement, thus affecting the viability, expansion, and
  cytotoxicity. Moreover, 4-1BB signaling directly upregulate Fas/FasL-dependent apoptosis
  of T cells via NF-κB. Phosphorylation of the ITAMs in CD3ζ will initiate signal
  transduction via the tyrosine kinase ζ-related protein of 70 kDa (ZAP70), resulting
  in activated T-cell responses, such as proliferation and cytokines release. Secretion
  of granzymes and perforins by CAR-T cells can inhibit tumor progression. Perforin
  induces pore formation on the target cell membrane, facilitating the access of pro-apoptotic
  granzymes; granzymes can induce caspase dependent and independent apoptosis. Meanwhile,
  cancer-cell apoptosis will be induced by activating the apoptosis signaling pathway,
  including activation of the FAS-associated death domain protein. The Fas/FasL pathway
  results in the activation of caspase 8; the activated caspase 8 then is responsible
  for the processing and maturation of caspase 3, which further mediates the apoptosis
