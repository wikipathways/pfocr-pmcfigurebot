figure_title: The regulatory effects of UBE2L3 deficiency on TNBC cells are mediated
  by TSC2.
caption: 'The regulatory effects of UBE2L3 deficiency on TNBC cells are mediated by
  TSC2. (A) Real-time cell analysis (RTCA) of proliferation rates in the indicated
  cells. (B) Colony formation assay measuring the impact of TSC2 knockdown on colony-forming
  ability in UBE2L3-deficient cells. (C) Representative images of organoid diameter
  and Ki-67 immunofluorescence intensity in UBE2L3-deficient organoids following TSC2
  knockdown. Scale bar, 40 μm. The indicated cells were subcutaneously injected into
  nude mice, and tumor growth was monitored: (D) Representative images of tumors,
  (E) Tumor weight, (F) Tumor volume, and (G) Representative H&E staining and IHC
  images showing UBE2L3, TSC2, and Ki-67 expression in xenograft tissues. (H) Representative
  images of autophagic flux detected by the mCherry-EGFP-LC3B reporter in the indicated
  cells. Scale bar, 10 μm. (I) Representative transmission electron microscopy images
  showing the ultrastructure of autophagosomes and/or lysosomes in the indicated cells.
  Scale bar, 500 nm. (J) Western blot analysis of the effect of TSC2 knockdown on
  mTOR-regulated autophagy pathway proteins in UBE2L3-deficient TNBC cells. Error
  bars represent mean ± SD. ***p < 0.001; **p < 0.01'
article_title: In vivo CRISPR/Cas9 Screening Reveals that UBE2L3 Modulates Autophagic
  Flux through TSC2 Ubiquitination and Potentiates PD-1 Blockade in Triple-Negative
  Breast Cancer
