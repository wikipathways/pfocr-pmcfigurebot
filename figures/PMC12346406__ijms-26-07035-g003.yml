figure_title: Overview of the systemic effects of NPs and their impact on autophagy
  in different organs.
caption: 'Overview of the systemic effects of NPs and their impact on autophagy in
  different organs. NPs can cross biological barriers and accumulate in various tissues,
  interfering with autophagy and related pathways. In the nervous system, NPs cross
  the BBB, promoting mitophagy (via AMPK/ULK1 and PINK1/Parkin pathways) and ferroptosis
  due to iron overload. In the cardiovascular system, NPs inhibit autophagy through
  lysosomal impairment, decreased LAMP1 expression, and increased ROS. In the respiratory
  system, they alter mitochondrial function, enhance ferroptosis and ferritinophagy,
  and reduce MMP. In the gastrointestinal system, NPs disrupt TJs, reduce autophagy
  and mitophagy, and trigger inflammation and iron dysregulation. Finally, NPs lead
  to autophagy inhibition in the reproductive system, increased ROS production, and
  reduced fertility. NPs: nanoplastics; BBB: blood–brain barrier; AMPK: AMP activated
  protein kinase; ULK1: Unc-51 like autophagy; PINK1: PTEN induced kinase 1; LAMP1:
  lysosomal-associated membrane protein 1; ROS: reactive oxygen species; MMP: mitochondrial
  membrane potential; TJs: tight junctions'
