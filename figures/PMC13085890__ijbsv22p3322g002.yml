figure_title: MSCs promote the proliferation of BC by activating the RAP1 pathway.
caption: MSCs promote the proliferation of BC by activating the RAP1 pathway. (A)
  KEGG enrichment analysis of differential proteins in UMUC-3 cells detected by mass
  spectrometry after co-culture with MSCs for 24 hours. (B-C) The effect of time-gradient
  co-culture of UMUC-3 and J82 cells with MSCs on EPAC1 and RAP1 proteins. (D-E) CCK-8
  experiment results of UMUC-3 and J82 cells after 48 hours of intervention with MSCs-CM
  and ESI-09 10μM. (F-G) The impact of MSCs-CM and ESI-09 10μM on the clone formation
  of UMUC-3 and J82 cells. (H-I) Detection of changes in RAP1 pathway-related proteins
  in UMUC-3 and J82 cells after 24 hours of intervention with MSCs-CM, ESI-09 10μM,
  and their combination; RAP1A-GTP protein was obtained through GST-pulldown experiment
  for subsequent protein detection. (J) Comparison of mIHC labelling of MSCs and IHC
  staining of TIMP1 within identical regions of BC and normal tissue. (K-M) Quantitative
  analysis results of IHC staining of EPAC1 in BC tissue samples with different clinical
  features. (N) HE and IHC staining of the BC marker UPK2 in the constructed organoids.
  (O) IHC staining results of TIMP1 and EPAC1 in samples after intervention with TIMP1
  12.5ng/ml and MSCs-CM in the BC organoid model
