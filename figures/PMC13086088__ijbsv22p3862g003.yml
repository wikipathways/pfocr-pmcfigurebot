figure_title: Intercellular communication between POSTN+ fibroblasts and maEpCs in
  LSCC and validation of their functional.
caption: Intercellular communication between POSTN+ fibroblasts and maEpCs in LSCC
  and validation of their functional. A Heatmaps showing the regulatory patterns between
  POSTN+ fibroblasts and maEpCs based on NicheNet analysis. B Enriched Hallmark, Gene
  Ontology (GO), and Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways among
  the NicheNet-predicted target genes in maEpCs. C qPCR analysis of target gene expression
  in SNU899 or SNU1076 cells with or without stimulation by rMIF (n = 3 per group).
  D, G Representative images of invaded SNU899 or SNU1076 cells from transwell invasion
  assays after 48 h of culture under the indicated experimental conditions. Images
  were acquired from randomly selected fields (n = 3 per group). E, H Representative
  images of wound-healing in SNU899 or SNU1076 cells cultured under the indicated
  experimental conditions at 0 and 24 h post-scratch (n = 3 per group). F SNU899 or
  SNU1076 cells were incubated for 48 h with different conditioned media (CM); epithelial-mesenchymal
  transition (EMT)-related and stemness-related protein expression was evaluated using
  immunoblotting (n = 3 per group). I Representative images of excised tumours (left
  panel), tumour volume quantification over time (middle panel), and tumour weight
  (right panel) from SNU1076 tumour-bearing mice following treatment with PBS, IgG,
  or imalumab (n = 4 per group). *p < 0.05; **p < 0.01; ***p < 0.001, **** p < 0.0001
