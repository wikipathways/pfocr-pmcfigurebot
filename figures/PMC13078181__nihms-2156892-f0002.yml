figure_title: Direct transcriptional regulation of the glycolysis pathway by NR4A2
  in the mouse heart
caption: (A) Heat map representation of gene expression levels for the glucose transporter
  GLUT4 and glycolytic enzymes in the ventricle of Nr4a2-icTg mice after 3, 6 and
  12 days of NR4A2 induction. Tamoxifen-injected Cre control mice (C) were used to
  establish basal gene expression levels. Mean of n = 4 mice per group per timepoint
  (2 males/2 females). Absolute quantification and statistical differences are presented
  in Supplemental Figure S2. (B) Comparison of ChIP-seq profiles for NR4A2 binding
  at the loci of the genes encoding the glucose transporters GLUT4 (Slc2a4) and GLUT1
  (Slc2a1) in hearts of Nr4a2-icTg mice (N1–3; red tracks) and Cre control mice (C1–3;
  black tracks). The position of transcripts from NCBI RefSeq are shown in dark blue
  below the tracks. ENCODE candidate cis-regulatory elements are shown in red for
  a promoter-like signature, orange for a proximal enhancer-like signature, and yellow
  for a distal enhancer-like signature. The ChIP-seq profiles of all glycolytic enzymes
  with quantification of NR4A2 binding to the corresponding intervals are provided
  in Supplemental Figure S3. (C) Quantification of differential NR4A2 binding to the
  promoter (Pr.) and enhancer (Enh.) sequences of the genes at 3 days after tamoxifen
  treatment. Mean ± SEM of n = 3 samples per group. Pairwise differential peak analysis
  performed with edgeR. *p < 0.05. (D) Relative amounts of glucose and glycolytic
  intermediates in the ventricle of Nr4a2-icTg mice and Cre control littermates at
  3, 6 and 12 days after tamoxifen injection. Mean ± SEM of n = 10 mice per group
  per timepoint (5 males/5 females). Data analyzed by two-way ANOVA contrasts. *p
  < 0.05
