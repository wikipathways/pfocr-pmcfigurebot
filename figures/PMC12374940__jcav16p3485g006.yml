figure_title: Association of anoikis resistance pathways with model genes and validation
  of G6PD expression via immunohistochemistry.
caption: Association of anoikis resistance pathways with model genes and validation
  of G6PD expression via immunohistochemistry. (A-C) ssGSEA was used to assess the
  activity of canonical anoikis resistance-related pathways, including the PI3K-Akt
  signaling pathway, ECM-receptor interaction, and MAPK signaling pathway, based on
  KEGG gene sets. (D) Immunohistochemical staining of G6PD in paired HCC and adjacent
  non-tumor tissues demonstrated markedly higher expression of G6PD in tumor tissues.
  (E) Quantitative analysis of the Area Density from IHC staining confirmed that G6PD
  protein levels were significantly upregulated in HCC tissues compared to adjacent
  non-tumor controls (p < 0.05)
