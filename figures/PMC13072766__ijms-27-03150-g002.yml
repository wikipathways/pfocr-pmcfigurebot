figure_title: High-dose voclosporin exerted full protective capacity against superimposed
  ischemia/reperfusion (I/R) injury in Inmt transgenic mice by suppressing voclosporin
  nephropathy and downregulating Lcn2.
caption: 'High-dose voclosporin exerted full protective capacity against superimposed
  ischemia/reperfusion (I/R) injury in Inmt transgenic mice by suppressing voclosporin
  nephropathy and downregulating Lcn2. (A) Inmt transgenic (Tg) mice with proximal
  tubular overexpression of Inmt and wild-type (WT) mice were treated with high-dose
  voclosporin (30 mg/kg, intraperitoneally) for 2 weeks at 8–10 weeks of age, followed
  by I/R at 14 weeks (sham as control). Four groups were compared: WT+Voc+Sham, WT+Voc+I/R,
  Tg+Voc+Sham, and Tg+Voc+I/R. Kidneys were analyzed 24 h after I/R. (B) Fluorescent
  immunostaining of INMT was performed, with double staining for the proximal tubular
  marker Lotus tetragonolobus lectin. INMT fluorescence intensity was quantified.
  (C) Bulk RNA sequencing was performed to compare genome-wide differential gene expression
  between Tg+Voc+I/R and WT+Voc+I/R kidneys. (D) Kyoto Encyclopedia of Genes and Genomes
  (KEGG) enrichment analysis of downregulated differentially expressed genes. The
  x-axis indicates gene ratio, and the y-axis represents KEGG terms. Circle size represents
  gene count, and its color represents adjusted p-value. (E) The IL-17 signaling pathway
  is demonstrated within the KEGG pathways identified in (D). (F) Notably, Lcn2 expression,
  encoding neutrophil gelatinase-associated lipocalin (NGAL), was markedly lower in
  Tg+Voc+I/R, indicating that Lcn2 downregulation mediates the protective effect against
  I/R-induced acute kidney injury (AKI). (G) Renal functional parameters. I/R+WT+Voc
  mice exhibited marked increases in BUN and creatinine, whereas Inmt Tg mice maintained
  values comparable to sham controls, demonstrating preserved renal function under
  Voc+I/R stress. (H) Histological injury scores were quantified by hematoxylin–eosin
  staining. Arrows indicate lysed tubules. (I) NGAL immunostaining was performed and
  quantified. Importantly, once Voc nephropathy was suppressed in Inmt transgenic
  mice, high-dose voclosporin exerted its full protective capacity, attenuating superimposed
  I/R-induced AKI. Scale bars: 100 μm (immunofluorescence), 50 μm (light microscopy).
  All quantitative data were analyzed using two-way ANOVA followed by Tukey’s post
  hoc test (n = 7 per group). Exact p-values are indicated in the figure. * p < 0.05;
  *** p < 0.001; NS: not significant'
article_title: High-Dose Voclosporin Protects Against Acute Kidney Injury via Regnase-2-Mediated
