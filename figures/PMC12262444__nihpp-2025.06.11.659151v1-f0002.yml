figure_title: Compartment switching in senescence reflects heterochromatin loss and
  promotes inflammatory gene expression.
caption: Compartment switching in senescence reflects heterochromatin loss and promotes
  inflammatory gene expression. (A) Genomic compartment switching in replicative senescence
  (RS) and oncogene-induced senescence (OIS), showing a bias toward transitions from
  the repressive B compartment to the active A compartment. P-values reflect chi-square
  test results. (B) Overlap between all compartment-switching genes (black), genes
  that are differentially expressed in the concordant direction (green), and those
  differentially expressed in the discordant direction (red) for both RS and OIS.
  (C) Gene ontology (GO) enrichment analysis of genes shifting to the A compartment
  in RS, revealing enrichment of inflammatory and immune-related pathways. (D) Overlap
  between senescence-associated secretory phenotype (SASP) genes and genes upregulated
  in RS (left) and OIS (right) that also shift to the A compartment. P-values are
  based on Fisher’s exact test
