figure_title: The AMGlu-mNAcShD2-LHAorexin pathway controls pain hypersensitivity
caption: (A) Schematic showing viral injection. (B) Light-evoked currents were blocked
  by TTX and restored by TTX+4-AP (n = 5); F(1.749, 6.994) = 119.6. (C) NBQX blocked
  light-evoked currents. Paired t test; t7 = 8.435, ***P < 0.001. (D) Examples and
  input-output curves of EPSC evoked by a progressive increase in light intensity
  (n = 10-11 neurons/group); F(1, 19) = 6.340. (E) Representative traces and statistics
  showing PPR of EPSC (n = 12-13 neurons); t23 = 2.956. (F) Sample traces and statistics
  of AMPA/NMDA ratio of EPSC (n = 12–13 neurons); t23 = 2.934. (G) Schematic showing
  viral injection. (H) The membrane excitability of AM-mNAcShD2-LHA neurons (n = 13–15
  neurons); F(15, 390) = 2.896. (I and J) The rheobase (I) and RMP (J) of AM-mNAcShD2-LHA
  neurons (n = 13–15 neurons); t26 = 3.475, (I); t26 = 3.470 (J). (K) Illustration
  and representative image showing viral injection. Scale bar, 100 μm. (L–N) Heat
  maps, averaged responses, and peak ΔF/F of the Ca2+ signals during von Frey (L),
  thermal stimuli (M), or tail suspension (N) (n = 6 animals/group); t10 = 13.16 (L);
  t10 = 9.728 (M); t10 = 0.7716 (N). (O) Experimental schematic. (P and Q) Mechanical
  (P) and thermal (Q) pain thresholds in SNI mice (n = 6–8 mice/group); F(1, 12) =
  12.75, (P); F(1, 12) = 6.763 (Q). (R and S) Sucrose preference (R) and immobility
  time in TST (S) in mice (n = 6–8 mice/group); F(1, 12) = 0.2662 (R); F(1, 12) =
  0.05487 (S). *P < 0.05, **P < 0.01, ***P < 0.001 by 1-way (B) or 2-way repeated
  measures ANOVA with Bonferroni’s multiple comparisons test (D, H and P–S). **P <
  0.01, ***P < 0.001 by 2-tailed t test (E, F, I, J, and L–N). Data are represented
  as mean ± SEM
