figure_title: Transcriptomic pathway analysis of ndufs2−/− larvae
caption: ndufs2−/− larvae show enrichment of expression in pathways related to general
  metabolic processes and one-carbon and nucleotide metabolism but downregulated expression
  of pathways involved in eye development and vision. Pathway enrichment analysis
  was performed with RNA-Seq data using GO, KEGG, and WikiPathways databases in ndufs2−/−
  larvae compared to healthy control larvae through the R package WebGestaltR. Pathways
  with lollipops towards the right or left indicate pathways that are upregulated
  or downregulated, respectively, in ndufs2−/− larvae relative to wild-type controls
article_title: ndufs2−/− zebrafish have impaired survival, neuromuscular activity,
