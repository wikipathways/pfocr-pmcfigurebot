figure_title: Loss of B cells alters the transcriptional state of lung CD8+ T cells
  during memory superinfection
caption: 'Bulk RNA sequencing was performed on lung CD8+ T cells from WT and μMT mice
  with either F/F or F/F/S infections (WT-F/F: n = 4; WT-F/F/S: n = 4; μMT-F/F: n
  = 3; μMT-F/F/S: n = 3). (A) Venn diagram shows the number of statistically significant
  differentially expressed genes (DEGs) shared between WT-F/F and WT-F/F/S groups
  and between μMT-F/F and μMT-F/F/S groups. (B) Top and bottom 10 Gene Ontology pathways
  in μMT-F/F/S versus WT-F/F/S for genes with false discovery rate adjusted P values
  less than 0.05 (8,831 DEGs). (C) Clustering heatmap of log2-transformed transcripts
  per million (TPM) values of WT-F/F/S and μMT-F/F/S mice for CD8+ T cell genes with
  adjusted P values (right). (D) Flow cytometry analysis showing the percentage of
  PD-1+LAG-3+TIM-3+CD8+ T cells (WT-F/F: n = 11; WT-F/F/S: n = 10; μMT-F/F: n = 11;
  μMT-F/F/S: n = 12). (E) Gene set enrichment analysis (GSEA) of a pathway in μMT-F/F/S
  versus WT-F/F/S (top) with P value and enrichment score (bottom). Right: Flow cytometry
  analysis showing the percentage of annexin V+7-AAD–CD8+ T cells (WT-F/F: n = 8;
  WT-F/F/S: n = 7; μMT-F/F: n = 7; μMT-F/F/S: n = 8). Graphed data are represented
  as mean ± SEM, and P values were determined by repeated 1-way ANOVA measures (**P
  < 0.01, ***P <0.001, ****P < 0.0001)'
