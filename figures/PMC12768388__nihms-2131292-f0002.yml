figure_title: Deletion of aceBAK prevents biomass generation from acetate and increases
  yield.
caption: 'Deletion of aceBAK prevents biomass generation from acetate and increases
  yield. (a) Pathway from acetate to dodecanol, with a branch point at acetyl-CoA
  for carbon to either enter the TCA cycle for energy and biomass generation or fatty
  acid biosynthesis for membrane components and product generation. Two heterologous
  enzymes, BTE and ACR are integrated on the chromosome, and a heterologous PTrc promoter
  is integrated to replace E. coli’s native FadD promoter. Deleting the aceBAK operon
  prevents accumulation of biomass from acetate, necessitating a secondary non-C2
  carbon source: glucose is shown. (b) Final titers (bars) and ODs (green diamonds)
  after 5 days for 5 mL cultures in MOPS minimal media with a 10% dodecane overlay
  fed either 5 g/L acetate, 2 g/L glucose, or both. Error bars represent the standard
  deviation of 3 biological replicates. **, statistically significant difference in
  dodecanol titers, α=0.01 (c) Acetate consumption (black circles) and yields (bars)
  on acetate for C12 and C14 alcohols or C12 and C14 alcohols + C12 and C14 fatty
  acids. For cases where both glucose and acetate were fed, titers from cultures only
  fed glucose were subtracted to estimate the amount of product from acetate alone.
  Error bars represent standard deviation of 3 biological replicates.**, statistically
  significant difference in alcohol yields, α=0.01'
