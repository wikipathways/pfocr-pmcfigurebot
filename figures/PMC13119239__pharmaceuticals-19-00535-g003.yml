figure_title: LCS1269 augments the expression of the crucial genes of the extrinsic
  apoptotic pathway.
caption: LCS1269 augments the expression of the crucial genes of the extrinsic apoptotic
  pathway. (A,B) The mRNA levels of the key genes within the extrinsic apoptotic pathway
  in U87 and U251 that were exposed to increasing concentrations of LCS1269 for 24
  h were measured using qRT-PCR. The relative expression for the tested genes was
  normalized to the housekeeping gene YWHAZ and was quantified by the 2−ΔΔCt method.
  The data are presented as mean ± SD of at least three separate experiments. * p
  < 0.05, ** p < 0.01, and *** p < 0.001
