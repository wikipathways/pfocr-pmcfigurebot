figure_title: The proposed model of CRC-derived H-EVs promoting angiogenesis and liver
  metastasis through the HIF1A/SP1/miR-6084/ANGPTL4 axis
caption: H-EVs induce both angiogenesis and liver metastasis, and the level of miR-6084
  within H-EVs is reduced. MiR-6084 inhibits angiogenesis by transferring to endothelial
  cells via EVs. In endothelial cells, miR-6084 directly targets ANGPTL4 mRNA, thus
  inhibiting angiogenesis through the ANGPTL4-mediated JAK2/STAT3 pathway. Moreover,
  SP1 acts as a transcription factor regulating miR-6084 transcription, while HIF1A
  promotes the dephosphorylation of SP1 at Thr739 and Thr453 via PP2A, consequently
  facilitating Ub-proteasome degradation of SP1
article_title: MicroRNA-6084 orchestrates angiogenesis and liver metastasis in colorectal
  cancer via extracellular vesicles
