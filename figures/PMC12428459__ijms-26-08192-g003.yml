figure_title: A proposed pathway of autoantibody generation in polycystic ovary syndrome
  (PCOS).
caption: A proposed pathway of autoantibody generation in polycystic ovary syndrome
  (PCOS). The inflammation can arise from mitochondrial damage, which also triggers
  oxidative stress in the cell. The latter leads to increase in αB-crystallin promoter
  activity, generating epitope for autoimmunization, leading to production of autoantibody
  type found in PCOS. Furthermore, oxidative stress damages proteins, such as human
  serum albumin, leading to an increase in their modified version in the blood. These
  proteins then serve as neoepitopes. Mitochondrial damage leads not only to NLRP3
  inflammasome assembly and activation, but also to release of oxidated fragments
  of mitochondrial DNA (mtDNA), which are another potential epitope for autoimmunization.
  The inflammasome then leads to activation of cyclic GMP-AMP synthase (cGAS), which
  triggers phosphorylation of stimulation of interferon genes (STING) protein. The
  process of self-reactive antibody generation is then mediated via activated peripheral
  B cells (also found in PCOS) in which, due to affinity maturation upregulation,
  the process has become more error-prone and self-reactive cells are not efficiently
  screened out. It is important to note that this is a proposed pathway based on a
  literature screening as described in this chapter. Created with Biorender.com
