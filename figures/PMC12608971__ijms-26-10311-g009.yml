figure_title: Hypothetical mechanisms of intracellular cholinergic signaling in the
  regulation of cell survival and proliferation in cancer, and neurodegeneration in
  Alzheimer’s disease (AD) and amyotrophic lateral sclerosis (ALS).
caption: Hypothetical mechanisms of intracellular cholinergic signaling in the regulation
  of cell survival and proliferation in cancer, and neurodegeneration in Alzheimer’s
  disease (AD) and amyotrophic lateral sclerosis (ALS). (1) Acetylcholine (ACh) is
  proposed to promote cell proliferation and/or survival through an intracellular
  signaling mechanism that involves monitoring mitochondrial bioenergetic function.
  (2) This mechanism includes the regulation of mitochondria-driven apoptosis [48],
  which may be differentially affected during the progression of cancer and neurodegenerative
  diseases such as AD and ALS. (3) In cancer, tumor cells may upregulate the expression
  and activity of choline acetyltransferase (ChAT), leading to elevated intracellular
  ACh levels. (4) This upregulation may serve as a protective mechanism against cellular
  damage induced by treatments such as radiotherapy or chemotherapy, by suppressing
  mitochondria-driven apoptosis [20,21,22,23,24,25,26,41]. This suppression may allow
  more time for DNA repair, thereby enhancing cell survival, promoting metastatic
  spread, recolonization of the tumor site, and potentially contributing to cancer
  relapse. (5) In contrast, in cholinergic neurodegenerative disorders such as AD
  and ALS, a progressive decline in ChAT expression is observed in neurons [6,7,8,9,10,15,16].
  This decline may result from aging, reduced stimulation or availability of neurotrophic
  factors (e.g., NGF, BDNF), or the inappropriate use of anticholinergic drugs, including
  proton pump inhibitors (PPIs) and various receptor antagonists. (6) Additionally,
  metabolic and mitochondrial dysfunction may reduce the production or cytoplasmic
  availability of acetyl-Coenzyme A (A-CoA), a critical co-factor required in equimolar
  amounts for ACh synthesis by ChAT. A-CoA is primarily generated in mitochondria,
  where it is used for ATP production via the Krebs cycle and exported to the cytoplasm
  for biosynthetic processes, including ACh synthesis. A reduction in A-CoA availability
  may impair intracellular ACh biosynthesis, weakening the cell’s defense against
  mitochondria-driven apoptosis and rendering cholinergic neurons more vulnerable
  to degeneration and anticholinergic insults. (7) This dual-edged mechanistic hypothesis
  can be experimentally tested using selective ChAT inhibitors, such as PPIs [35],
  and warrants further investigation. The ACh–mitochondria–apoptosis axis may represent
  a critical pathway for understanding both selective cholinergic neurodegeneration
  in dementia and neuromotor disorders, and the survival strategies exploited by cancer
  cells
