figure_title: Schematic diagram of the mechanism by which tannins regulate the intestinal
  microbiota.
caption: 'Schematic diagram of the mechanism by which tannins regulate the intestinal
  microbiota. This diagram illustrates the multi-layered regulatory effects of tannins
  on gut microbiota and the subsequent formation of a gut health homeostasis loop
  in UC, with key clarifications on tannin binding and immune interactions: tannins
  do not directly interact with antibodies; their biological effects are initiated
  by targeting and remodeling the gut microbiota (the core upstream mechanism), and
  they exert indirect cellular regulation by binding to GPR43 (G protein-coupled receptor
  43) on intestinal epithelial cells and immune cells (the only well-characterized
  receptor for tannin downstream signaling). Tannins first inhibit the colonization
  and proliferation of intestinal pathobionts (e.g., Escherichia coli) and enrich
  beneficial symbionts (e.g., Lactobacillus, Bifidobacterium), which promotes the
  production of short-chain fatty acids (SCFAs) by beneficial bacteria. SCFAs then
  activate GPR43 on intestinal cells, further inhibiting the TLR4/MyD88/NF-κB inflammatory
  signaling pathway, reducing pro-inflammatory cytokine secretion and promoting the
  differentiation of Treg cells to maintain immune homeostasis. Concurrently, tannin-induced
  microbiota remodeling upregulates the expression of intestinal tight junction proteins
  (e.g., ZO-1, Occludin) to repair the intestinal barrier, normalizes intestinal amino
  acid and carbohydrate metabolism, and ultimately forms a synergistic loop of microbiota
  remodeling-barrier repair-immune/metabolic homeostasis to alleviate intestinal inflammation
  and improve UC symptoms. Arrow explanation: Downward arrows (↓) indicate downregulation
  or inhibition; upward arrows (↑) indicate upregulation or activation; solid arrows
  (→) represent activation/signaling'
