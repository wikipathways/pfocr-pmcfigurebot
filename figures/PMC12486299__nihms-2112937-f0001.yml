figure_title: Metabolic stressors disturbing ER homeostasis in the TME
caption: a, In cancer cells, unconjugated bile acids induce endoplasmic reticulum
  (ER) stress by disrupting ER homeostasis, whereas taurine-conjugated bile acids
  mitigate the unfolded protein response (UPR) pathway activation. Taurine restriction
  intensifies ER stress, activating the protein kinase RNA-like ER kinase (PERK) pathway
  and promoting apoptosis in cancer cells. In CD8+ T cells, unconjugated bile acids,
  particularly the secondary bile acid lithocholic acid, induces ER stress, which
  promotes T cell exhaustion and dysfunction in advanced hepatocellular carcinoma.
  When taurine is depleted from the microenvironment due to cancer cell uptake, CD8+
  T cells exhibit exhaustion via PERK–activating transcription factor 4 (ATF4) signalling,
  impairing cytokine production and upregulating immune checkpoints. Question marks
  indicate that the mechanism remains unknown. b, Lipid imbalance in the tumour microenvironment
  (TME), including cholesterol and glucosylceramide accumulation, disrupts ER homeostasis.
  Cholesterol accumulation activates inositol-requiring enzyme 1α (IRE1α)–XBP1s, impairing
  CD8+ T cell cytotoxicity. Glucosylceramide induces lipid saturation in tumour-associated
  macrophages, activating detrimental IRE1α–XBP1s signalling that promotes T cell
  suppression. c, Carbon monoxide (CO) is often elevated in the TME due to upregulation
  of haem oxygenase-1, which is induced by oxidative stress and chronic UPR activation.
  While controlled CO administration enhances mitochondrial–ER communication (the
  dashed line is shown here to indicate indirect interaction), improving CD8+ T cell
  metabolic resilience and antitumour activity, high levels of CO drive immunosuppressive
  phenotypes. ARG1, arginase 1; BiP, binding-immunoglobulin protein (also known as
  GPR78); CHOP, C/EBP homologous protein; CTLA4, cytotoxic T lymphocyte protein 4;
  EGFR, epidermal growth factor receptor; eIF2α; eukaryotic initiation factor 2α;
  LAG3, lymphocyte activation gene 3; LPCAT3, lysophosphatidylcholine acyltransferase
  3; PD1, programmed cell death protein 1; ROS, reactive oxygen species; TIGIT, T
  cell immunoreceptor with Ig and ITIM domains; TIM3, T cell immunoglobulin and mucin-domain-containing-3
