figure_title: Biohybrid energy supply systems inspired by nitrogenase for light-driven
  nitrogen fixation under mild conditions.
caption: Biohybrid energy supply systems inspired by nitrogenase for light-driven
  nitrogen fixation under mild conditions. (a) A dual-catalyst photocatalytic system
  integrates polyoxometalate SiW12 as a photoredox mediator and Pt/C as the nitrogen
  hydrogenation site, enabling alcohol-driven in situ hydrogen generation and sustainable
  N2-to-NH3 conversion. Solar-driven dehydrogenation of alcohols supplies protons
  and electrons, which are stored in reduced SiW12 and subsequently transferred to
  Pt/C for N2 reduction via an associative distal pathway, bypassing the need for
  external H2. Reproduced with permission [65]. Copyright © 2024 Elsevier. (b) A photosynthetic
  biohybrid system (PBS) composed of ceria nanoparticles embedded within light-responsive
  purple membrane (PM) fragments from halobacterium salinarum. The bacteriorhodopsin
  chromophores (yellow rods) embedded in PM facilitate directional charge transfer
  under solar illumination, enabling efficient abiotic N2 reduction on ceria surfaces
  under ambient conditions. Reproduced with permission [66]. Copyright © 2025 American
  Chemical Society. (c) A nitrogenase-inspired metal-organic framework (MOF) catalyst,
  U(Zr-Hf)-2SH, integrates Zr-Hf bimetallic clusters with thiol-functionalized linkers.
  In this architecture, Zr sites serve as nitrogen activation centers while Hf acts
  as an electron reservoir, enabling a ligand-to-metal-to-metal electron transfer
  (LMMET) mechanism. The -SH-containing organic ligands extend visible-light absorption
  and promote π-backbonding with N2, collectively driving a high NH3 generation rate
  [67]. Copyright © 2021 Elsevier
