figure_title: Placental weighted gene co-expression network analysis (WGCNA)(A.
caption: Placental weighted gene co-expression network analysis (WGCNA)(A.) Co-expressed
  gene modules associated (p < 0.05) with birthweight adjusted for placental weight
  (BWadj), BW:PW, and phthalate metabolites. Effect estimates represent the change
  in standardized eigengene expression for each standard deviation increase in birthweight
  or BW:PW ratio, or 1 unit increase in natural log transformed phthalate concentration
  (ng/mL). The size and color of the dot highlight the strength and direction of the
  association. (B.) Over-representation analysis identified KEGG pathways enriched
  within WGCNA modules. Pathways are organized into themes based on the KEGG pathway
  maps BRITE hierarchy. Point size corresponds to −log10(p-value). Modules are colored
  based on their name, which was assigned by the WGCNA package
article_title: The placental transcriptome serves as a mechanistic link between prenatal
  phthalate exposure and placental efficiency
