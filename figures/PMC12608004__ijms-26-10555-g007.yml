figure_title: A fragment of the DEC-signaling pathway network obtained for the striatum
  and frontal cortex at 24 h after tMCAO.
caption: A fragment of the DEC-signaling pathway network obtained for the striatum
  and frontal cortex at 24 h after tMCAO. Signaling pathways (KEGG) are shown as rectangles,
  DECs as ovals. Signaling pathways are grouped into clusters. Pathway cluster 1 (PC1)
  includes signaling pathways that are distinguished only in the IR-s vs. SO-s comparison.
  Pathway cluster 2 (PC2) includes signaling pathways that are distinguished only
  in the IR-f vs. SO-f comparison. Pathway cluster 3 (PC3) includes signaling pathways
  that are distinguished for both comparisons, IR-f vs. SO-f and IR-s vs. SO-s. The
  first 3 most significant signaling pathways from PC1–PC3 are shown. DECs on the
  right side of the figure are found only in the IR-s vs. SO-s comparison; on the
  left side of the figure, only in the IR-f vs. SO-f comparison. The first 10 DECs
  involved in competition with the maximum number of genes (mRNAs) associated with
  PC2–PC3 are shown. Only two DECs involved in pathway presentation are found in both
  IR-f vs. SO-f and IR-s vs. SO-s comparisons, are shown at the bottom of the figure.
  Lines connecting DECs and signaling pathways indicate that DECs compete with DEGs
  associated with pathways
