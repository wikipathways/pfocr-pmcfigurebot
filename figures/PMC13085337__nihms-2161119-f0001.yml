figure_title: Physiochemical characterization of plasma-derived extracellular vesicles
  (EVs) and differential miRNA abundance
caption: |-
  (A) Mean particle size, (B) particle counts, and (C) protein concentration of plasma-derived EVs collected from healthy controls (HC), non-severe asthmatics (NSA), and severe asthmatics (SA). (E) Volcano plots and bar graphs showing pairwise comparisons of miRNA abundance (|log2(FC)| > 1.5 and P < 0.05). Upregulated miRNAs are shown in red, and downregulated miRNAs in blue. (F) Network visualization and pathway enrichment analysis (KEGG and Reactome) of predicted miRNA-mRNA targets using the STRING database. Both upregulated and downregulated target mRNAs from each pairwise comparison were included. The top 10 significantly enriched pathways from KEGG and Reactome are presented as a column graph. Data are shown as mean ± SEM. ** P < 0.01 vs. HC; #
  P < 0.05 vs. NSA
