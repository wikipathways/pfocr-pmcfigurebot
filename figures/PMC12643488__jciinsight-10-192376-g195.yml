figure_title: RIP140 regulates an array of pathways/processes known to be involved
  in muscle endurance
caption: (A) PCA plot displaying WT control sedentary (WT_S), WT control trained (WT_TR),
  strNrip1–/– (strKO) sedentary (KO_S), and strNrip1–/– trained (KO_TR) groups from
  RNA-seq of EDL muscle (n = 3 per group). (B) Volcano plot comparing strKO trained
  and WT control trained differentially expressed genes (DEGs) from RNA-seq of EDL
  muscle. (C) Gene Ontology (GO) pathway analysis of upregulated Biological Process
  pathways in strKO trained EDL compared to WT control trained EDL. (D) Heatmap of
  upregulated DEGs at sedentary and trained conditions in strKO EDL muscle compared
  to corresponding WT controls. Fold change (FC) > 1.2, FDR < 0.05
article_title: A role for the transcriptional coregulator RIP140 in the control of
