figure_title: Structural, developmental, signaling, and post-ovulatory features of
  Xenopus oocytes and eggs.
caption: Structural, developmental, signaling, and post-ovulatory features of Xenopus
  oocytes and eggs. (A) Stage VI immature oocyte. A schematic representation of a
  fully grown Xenopus stage VI oocyte showing the characteristic animal–vegetal polarity.
  The darkly pigmented animal hemisphere contains the germinal vesicle (GV), while
  the vegetal hemisphere is enriched in maternal mRNAs that will direct early embryonic
  patterning after fertilization. (B) Chronological diagram. A timeline illustrating
  the major transitions of Xenopus oocytes from prolonged oogenesis to meiotic maturation
  and fertilization. During oogenesis (months), the oocyte grows while remaining arrested
  in prophase I. Upon hormonal stimulation, meiotic maturation and ovulation occur
  over several hours, accompanied by increased MAPK and MPF activity and arrest at
  metaphase II. Following fertilization (minutes), MAPK and MPF activities rapidly
  decline, leading to egg activation, release from metaphase arrest, and the resumption
  of meiosis. (C) Signaling pathway at fertilization. A schematic summary of the major
  signaling events triggered upon fertilization in Xenopus. Following sperm adhesion
  and fusion, egg surface receptors and sperm-derived factors (e.g., uroplakin III
  and PLCζ) initiate signaling cascades. Activation of the Src kinase–PLCγ–IP3 pathway
  induces a characteristic Ca2+ transient/wave/oscillatory response, leading to CSF
  inactivation and meiotic resumption. These Ca2+-dependent events also promote the
  block to polyspermy, subsequent pronuclear fusion, and ultimately the initiation
  of embryonic development. (D) Fate of unfertilized eggs. A schematic representation
  of the two major post-ovulatory fates of unfertilized Xenopus eggs. Mature eggs
  arrested at metaphase II undergo time-dependent deterioration. After 12–36 h, gradual
  declines in MAPK activity, ATP levels, and protein content—together with increases
  in ROS production and caspase activation—lead to apoptosis, culminating in cell
  swelling and membrane rupture by 36–72 h. Alternatively, within 0–1 h after ovulation,
  eggs may undergo overactivation, characterized by premature loss of MAPK activity,
  ATP depletion, rapid cytoplasmic deterioration, and early membrane rupture. These
  distinct pathways underscore the metabolic and signaling vulnerabilities of unfertilized
  post-ovulatory eggs
