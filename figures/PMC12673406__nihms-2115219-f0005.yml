figure_title: Pioglitazone activates hepatic AMPK signaling pathway and alters liver
  metabolite profiles in Pi*Z mice
caption: (A) Western blot analysis of liver lysates from control- and pioglitazone-treated
  Pi*Z mice (30 mg/kg/day, 12 weeks) showing levels of total and phosphorylated AMPK
  (Thr458), ULK1 (Ser317, Ser757), mTOR, p-mTOR, and Rheb. GAPDH is shown as a loading
  control. (B-D) Quantification of p-AMPK (Thr458), p-ULK (Ser317), and p-mTOR band
  intensities from (A), normalized to GAPDH. Bars show mean ± SD; n = 4 mice per group.
  (E-F) Tissue concentrations of lactate, alanine, and succinate in the liver of control
  and pioglitazone-treated mice measured by GC-MS. Data are presented as mean ± SD.
  n = 5 mice per group
article_title: Pioglitazone Reduces Hepatic Alpha-1 Antitrypsin Accumulation Through
