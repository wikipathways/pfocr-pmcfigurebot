caption: 'Western blotting outcomes of muscle production-related proteins (Myo D and
  myogenin) (A), muscle atrophy suppression signaling pathway-related proteins (p-Foxo1a
  and p-Akt) (B), and pro-inflammatory expression-related proteins (TNF-α, NFκB, HMGB1,
  and pp38) (C). Group-1 (control): C2C12 myoblasts with no treatment; Group-A: C2C12
  myoblasts with 10 µM dexamethasone; Group-B: C2C12 myoblasts with 10 µM dexamethasone
  and microcurrent with square waveform for 15 min, and then left in place for 1 day;
  Group-C: C2C12 myoblasts with 10 µM dexamethasone and microcurrent with sine waveform
  for 15 min, and then left in place for 1 day; and Group-D: C2C12 myoblasts with
  10 µM dexamethasone and microcurrent with triangle waveform for 15 min, and then
  left in place for 1 day. * p indicates <0.05, ** p < 0.01, *** p < 0.001, and ****
  p < 0.0001 (post hoc intergroup tests)'
