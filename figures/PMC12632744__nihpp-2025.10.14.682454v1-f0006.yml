figure_title: Pathway-specific information flow between BMS-986187, DAMGO and the
  G protein
caption: '(A) Total information flow (in bits) for three pathways: BMS-896187 to DAMGO,
  DAMGO to the G protein, and BMS-896187 to the G protein. (B–D) Network diagrams
  illustrating the predominant allosteric communication pathways within MOR: from
  BMS-986187 to DAMGO (B), from DAMGO to the G protein (C), and from BMS-896187 to
  the G protein (D). The 20 residues with the highest contribution to information
  flow are labeled, including the nearby cholesterol molecule (labeled CLR). The top
  10 contributing residues are highlighted in green and enclosed in boxes. Node size
  is proportional to the total information flow transmitted or received by each residue,
  while edge thickness indicates the magnitude of transfer entropy between residue
  pairs. (E–G) Fractional information flow per residue (mean ± SEM, based on 20 samples
  of transfer entropy values) for the top 10 residues in each of the three pathways:
  BMS-986187 to DAMGO (E), DAMGO to G protein (F), and BMS-986187 to G protein (G).
  In panel F, flow values in the absence of BMS-986187 are shown in orange for comparison'
