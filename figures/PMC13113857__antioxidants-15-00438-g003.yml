figure_title: Hepatocyte-specific Acsl4 deficiency alleviates lipid accumulation in
  mice with ALD.
caption: 'Hepatocyte-specific Acsl4 deficiency alleviates lipid accumulation in mice
  with ALD. (A–E): Gao-Binge model Acsl4flox and Acsl4HKO mice. (A) KEGG enrichment
  analysis of DEGs from our liver RNA-seq (n = 5 per group). (B) Relative mRNA levels
  of genes related to fatty acid synthesis (Fasn, Srebp-1c, Scd1) and triglyceride
  oxidation (Ppara, Cpt1a, and Acacb) in livers (n = 10 per group). (C) Protein levels
  of fatty acid transporter CD36, synthesis enzyme FASN, and oxidation regulators
  PPARα and PGC1α in the liver. (D) Representative Oil Red O staining (left) and quantitative
  results (right) in livers from Gao-Binge model mice. Scale bar, 50 μm (n = 6 per
  group). (E) Hepatic TG levels (left), serum TG (middle) and T-CHO (right) levels
  (n = 10 per group). (F) Representative images of Oil Red O staining and quantitative
  results in hepatocytes treated with EtOH (100 mM, 24 h), PA (0.33 mM, 24 h), and
  OA (0.66 mM, 24 h). Left: HepG2 cells following transduction with shNC or shACSL4
  (scale bar, 50 μm; n = 5). Right: PMHs from Acsl4flox and Acsl4HKO mice (scale bar,
  50 μm; n = 5). (G) GSEA enrichment plot for the oxidative phosphorylation pathway
  in our liver RNA-seq. (H) OCR profiles and key mitochondrial respiratory parameters
  in HepG2 cells treated with EtOH (100 mM, 24 h) following transduction with shNC
  or shACSL4. Data are presented as the mean ± SD. * p < 0.05, ** p < 0.01, *** p
  < 0.001 by unpaired two-tailed Student’s t-test (B,D,H) and one-way ANOVA test (E,F)'
