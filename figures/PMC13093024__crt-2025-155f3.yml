figure_title: Correlation of genetic alteration with outcomes to treatment.
caption: Correlation of genetic alteration with outcomes to treatment. (A) Oncoplot
  showing the pathogenic alterations encompassing mutation, copy number alteration,
  fusion, and splicing variants. (B) The corresponding statistics for survival among
  patients treated with ifosfamide and mesna combination therapy with alterations
  in a single gene. (C) Curated pathways for genetic alterations. (D) The corresponding
  statistics for survival among patients treated with ifosfamide and mesna combination
  therapy with alterations in oncogenic signaling pathways. (E) Kaplan-Meier plot
  of the progression-free survival (PFS) of patients according to the presence of
  alterations in TP53 pathway. (F) Kaplan-Meier plot of overall survival (OS) of patients
  according to the presence of alterations in the TP53 pathway. CI, confidence interval;
  HR, hazard ratio
