figure_title: Relocation of a (CAG)130 locus to the NP depends on the activation of
  the DDC or DRC
caption: (A) Flowchart of the DNA damage checkpoint pathway.(B) Yeast chromosome 6
  containing an integrated (CAG/CTG)130 repeat tract ((CAG)130) and a lacO or tetO
  array that binds the GFP-LacI or TetR-RFP protein, respectively. Mid-to-late S-phase
  cells were imaged, and the location of the foci was scored into one of three zones
  of equal area, using the GFP-Nup49 signal to mark the NP. Representative images
  are shown. Scale bars, 1 μm.(C and D) Percentage of cells with LacO loci in zone
  1 for mid/late S phase cells for the indicated strains. Points represent the results
  of at least 2 biologically independent experiments done with independent isolates
  for mutants, and >120 cells (avg. ~200) were scored per genotype. See method details
  and Table S1 for the exact number of cells analyzed per experiment and genotype,
  percentages, and p values. Compared with the wild-type (CAG)130 strain by chi-squared
  test.(E) Percentage colocalization of CFP-LacI foci (representing the (CAG)130 locus)
  with the NP in wild-type (WT) or mrc1AQ cells post alpha factor release. Points
  represent 3 biologically independent experiments, and >220 cells (avg. ~300) were
  scored per time point and genotype. Significance calculated using Bonferroni-corrected
  chi-squared test comparing wild type to mutant for each time point. Detailed in
  Table S2. *p ≤ 0.05, **p ≤ 0.01, ***p ≤ 0.001, ****p ≤ 0.0001.(F) Model illustrating
  the activation of the DRC in response to an uncoupled fork (left) or activation
  of the DDC following fork reversal and recruitment of the MRX complex (right). Created
  with Biorender.com
article_title: The DNA replication checkpoint targets the kinetochore to reposition
