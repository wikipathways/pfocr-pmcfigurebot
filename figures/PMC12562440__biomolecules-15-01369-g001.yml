caption: 'Schematic diagram depicts that CAFs drive the progression of PCa through
  three interconnected mechanisms: (1) ANGPTL4 secretion-mediated activation of the
  IQGAP1/ERK/PGC1α axis on PCa cell membranes enhancing mitochondrial biogenesis and
  oxidative phosphorylation function; (2) HGF secretion-triggered signaling that mediates
  the c-Met/ERK/FRA1 pathway upregulating SOX9 expression to promote tumor growth;
  (3) Exosomal miR-1290 delivery that inhibits the GSK3β/β-catenin signaling pathway
  in PCa cells'
