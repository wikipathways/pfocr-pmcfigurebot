caption: S1P/S1PR2 signaling induces M1 polarization in macrophages by activating
  PI3K/JNK and ERK pathways. (A) Protein levels of PI3K, JNK and ERK in pancreatic
  tissues from AP mice were analyzed by Western blot. (B) Protein levels of PI3K,
  JNK and ERK in RAW264.7 cells after treatment with CMCCK or LPS were analyzed by
  western blot. (C) Protein levels of PI3K, JNK and ERK in S1P-treated RAW264.7 cells
  were analyzed by western blot. (D) Protein levels of PI3K, JNK and ERK in S1P-treated
  RAW264.7 cells were assessed by western blot following JTE-013 addition. *P <0.05;
  **P <0.01; ***P <0.001; NS, no significance
