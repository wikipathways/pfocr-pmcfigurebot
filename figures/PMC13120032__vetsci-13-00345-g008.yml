caption: Grouped horizontal bar chart showing the pathway-level distribution of significantly
  altered metabolites (p < 0.05, Student’s t-test) across four pairwise comparisons.
  Bars represent the number of significant metabolites assigned to each of 12 KEGG-based
  pathway categories. Protein digestion and absorption (dipeptides) and xenobiotics
  metabolism were the most represented pathways. Temporal comparisons (D21 vs. D2)
  yielded higher metabolite counts across nearly all pathways than health-status comparisons,
  while SCM-D21 vs. H-D21 showed the fewest significant metabolites, confirming attenuation
  of the disease signature by Day 21. n = 10 per group; 474 metabolites; CIL-LC-MS
  platform
