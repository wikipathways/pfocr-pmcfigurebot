figure_title: Potential therapeutic targets for treating MDS symptoms.
caption: Potential therapeutic targets for treating MDS symptoms. The schematic summarizes
  the key metabolic pathways, and their associated effectors implicated in MDS. The
  pathways are shown with key enzymes, receptors (RTK, TRKA, cytokine receptor, FZD6),
  molecules involved, and their potential effects on cellular processes. Areas where
  drug intervention (magenta color) could inhibit (red blunt end) or enhance (green
  arrow) the metabolic activity to improve treatment outcomes are indicated. Figure
  was created using BioRender [55]
