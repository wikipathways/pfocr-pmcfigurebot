figure_title: β-amino-containing natural products, their biosynthesis, and MALDI-based
  loading assay of PKAL-1 using N-acylated β-amino substrates.
caption: 'β-amino-containing natural products, their biosynthesis, and MALDI-based
  loading assay of PKAL-1 using N-acylated β-amino substrates. a, Examples of the
  chemical structures of natural products containing β-amino fatty acids (indicated
  in red) in macrolactam rings. b, A portion of the cremimycin biosynthetic pathway
  indicating how the β-amino fatty acid in cremimycin (indicated in red) is biosynthesized.
  c, Chemical synthesis of 10-12: i) triethylamine, methyl bromoacetate, THF, rt,
  overnight, 54%; ii) LiOH, 1,4-dioxane/H2O (1:1), rt, 5 h, quant. yield; iii) triethylamine,
  acetyl chloride, DCM, 0 °C to rt, 12 h; then LiOH, 1,4-dioxane/H2O (1:1), rt, 3
  h, 62%; iv) (tert-butoxycarbonyl)glycine, HOBt, EDCl, triethylamine, DCM, rt, 48
  h, 81%; v) LiOH, 1,4-dioxane/H2O (1:1), rt, 3 h; then TFA/DCM (1:1), rt, 1 h, 61%.
  d-f, PKAL-1 was incubated with holo-ACP7, ATP, and different substrates. The MALDI
  trace of the reaction in red is overlaid with the MALDI trace of the no substrate
  control reaction (unreacted holo-ACP7) in blue to enable comparisons between traces.
  The substrates that were included in the reactions are 10 (d), 11 (e), and 12 (f)'
