figure_title: HIF1 signalling pathway in HER2 subtype with prognostic implications.
caption: HIF1 signalling pathway in HER2 subtype with prognostic implications. The
  HIF1 signalling pathway also varies according to the WWOX/HIF1A ratio in HER2 tumours.
  Poor prognosis tumours show elevated HIF1A levels accompanied by upregulation of
  glycolytic enzymes such as PIK3CG and VEGFA, supporting metabolic adaptations favouring
  tumour growth. In contrast, good prognosis cases maintain higher WWOX expression,
  suggesting its role in counteracting metabolic reprogramming associated with malignancy.
  Yellow denotes good prognosis, pink denotes poor prognosis, and green indicates
  genes with unchanged expression
article_title: 'Prognostic Significance of WWOX/HIF1A Ratio in Cancer Subtypes: Insights
