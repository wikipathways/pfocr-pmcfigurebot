caption: 'a. Gene set enrichment analysis of bulk RNAseq data indicate pathways that
  may have contributed to NCB (PD or SD < 4 months) or CB (PR or SD ≥ 4 months). Dot
  plot shows the enriched pathways associated with NCB.b-d. NCB signature scores in
  CB vs. NCB tumors within D+O+C, D+C and a public dataset (GSE206422; recurrent ovarian
  cancers treated with pembrolizumab, bevacizumab, and metronomic cyclophosphamide)
  calculated using singscore (b) and scores correlating with PFS (c-d). Two-sided
  Wilcoxon rank-sum test was used for comparing signature scores between CB and NCB.
  Spearman correlation test was used for correlation between signatures and PFS.Abbreviations:
  CB, clinical benefit; D+O+C, durvalumab, cediranib, and olaparib; D+C, durvalumab
  plus cediranib; NCB, no clinical benefit; PFS, progression-free survival'
