figure_title: The iEC-derived functional hierarchy in the human brain
caption: a, Schematic of our approach to estimate the hierarchy. To illustrate the
  process of hierarchy determination, we put in side by side a hierarchical signal
  flow from our previous findings (Fig. 4e) and its theoretical circuit model. Inspired
  by FLN-based hierarchy determination in the macaque brain, we used the iEC matrix
  to infer the hierarchy level of each cortical area across the entire human brain.
  b, The resultant functional hierarchy map is shown. The insular and paralimbic areas
  are positioned at the top of the hierarchy, while the primary sensorimotor areas
  are located at the bottom. c, The difference between our EC-based hierarchy and
  FC-based functional gradient. The brain areas with higher EC-based hierarchy (>mean+1SD)
  but lower functional gradient (<mean-1SD) are marked by red, while those with opposite
  profiles are marked by blue (i.e., higher gradient but lower hierarchy) in both
  graphs and cortical surfaces. d, The cortical zones proposed by Mesulam99 (left),
  indicating different levels of cortical hierarchy. Note that within the neocortex,
  the paralimbic areas are at the top of the hierarchy. These four zones are superimposed
  on the Brodmann parcellation scheme (middle). Finally, the hypothetical signal processing
  pathways across corresponding hierarchical levels proposed by Mesulam are shown
  (right). All figures are sourced from Mesulam, 199899. e, The relationship between
  the identified functional hierarchy and histological cortical types. Note that as
  the hierarchical value increases, the cortical type transitions from a laminar structure
  with clearly defined granular layers to one with less distinct or even absent granular
  layers. f, Signal propagation was analyzed across 27 modules derived from Mesulam’s
  cortical zones. Positive signals dominantly originated from primary and unimodal
  areas decreased along the hierarchy, while the negative signals progressively occupy
  the emission of the higher order areas
article_title: In vivo cartography of state-dependent signal flow hierarchy in the
  human cerebral cortex
