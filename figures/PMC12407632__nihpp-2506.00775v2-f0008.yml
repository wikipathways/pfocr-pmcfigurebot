figure_title: Energetic driving enhances sensitivity to substrate binding
caption: '(a) For a single type of tRNA (g=0), probability that an interaction will
  successfully result in elongation is plotted against the binding energy ϵbind. The
  energy landscape along the binding-and-activation pathway is shifted concomitantly
  with the binding energy, maintaining constant barriers for transitions (inset).
  Each curve corresponds to a different driving force ϵdrive. Dashed and dotted green
  lines show two different exponential scalings. (b) Sensitivity to the binding energy
  (defined as dlogpelong/dϵbind), at ϵbind=8 is plotted as a function of driving force.
  Parameters used: E2‡=20, Eh‡+ϵbind=40, Ep‡+ϵbind=35'
