figure_title: Pathway PRS partially explains why individuals with low genetic risk
  could develop AN
caption: '(A) A toy figure to illustrate our hypothesis of genetic liability threshold
  such that among cases, individual with a lower AN PRS would have higher pathway
  PRS residuals (i.e., greater positive residuals) to be a case, whereas among controls,
  individuals with a higher AN PRS would have lower pathway PRS residuals (i.e., greater
  negative residuals) to be a control. Our finding suggests that our hypothesis for
  cases is true, but not for controls. This figure was created using BioRender software
  (www.biorender.com).(B) Correlation between genome-wide AN PRS (x axis) and pathway
  PRS residuals (y axis) for 497 significant pathways identified from the univariate
  models. Pearson correlation and its associated p-value are shown for both cases
  and controls. While we observed negative correlations between pathway PRS residuals
  and AN PRS for both cases and controls as we hypothesized, only the correlation
  in cases was significant, suggesting pathway PRS contributes to the genetic liability
  threshold to become a case for those with lower AN PRS.Abbreviations: AN=anorexia
  nervosa, PRS=polygenic risk score'
