figure_title: Simplified diagram of the intrinsic and extrinsic apoptosis pathway.
caption: Simplified diagram of the intrinsic and extrinsic apoptosis pathway. In the
  intrinsic pathway, ligands activate the death receptor, leading to the formation
  of the death-inducing signaling complex (DISC). Caspase 8 and caspase 3 are activated,
  leading to the activation of executive caspases, which initiate the process of apoptosis.
  In the extrinsic pathway, the apoptosis-activating factor causes inhibition of Bid
  and Bax proteins by Bcl-2 and p53 proteins. This leads to an increase in mitochondrial
  porosity, which results in the release of cytochrome c and activation of caspase
  9 by the Apaf-1 protein. As a result, an apoptosome is formed, which activates effector
  caspases, leading to apoptosis
