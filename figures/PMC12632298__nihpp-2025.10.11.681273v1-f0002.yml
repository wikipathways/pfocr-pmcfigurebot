figure_title: Distinct genes and pathways in scWAT between higher BMI subjects with
  and without T2D at baseline.
caption: 'Distinct genes and pathways in scWAT between higher BMI subjects with and
  without T2D at baseline. A, PCA plot for baseline RNA-seq data from the 29 subjects
  included in this study. The plot is colored by lower, higher BMI no T2D, and higher
  BMI with T2D. B, Volcano plot showing the differentially expressed genes (DEGs)
  between the higher BMI group with T2D vs. without, with the top 10 significantly
  up- and downregulated genes labeled. C, Ridge plot showing the top 15 significant
  pathways enriched by the up- and downregulated DEGs in the higher BMI group with
  T2D vs. without. D, Bar plots showing the inferred transcription factors (TFs) enriched
  in the up- and down-regulated DEGs in the higher BMI group with T2D vs. without.
  TFs discussed in the text are in bold. E, Box plots comparing the deconvolved cell
  type proportions between the two higher BMI groups: with and without T2D. The boxplot
  visualizes the median, the first and third quartiles and 1.5*inter-quartile range
  from the hinge'
