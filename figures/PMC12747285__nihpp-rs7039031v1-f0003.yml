figure_title: Inflammatory cytokine profile, IFN signature analysis, and immune phenotyping
  in Patient 1 and controls
caption: (A) Serum cytokine profiling of P1 compared to family controls. A 27-plex
  immunoassay was performed, and the most significantly upregulated cytokines are
  displayed. For each cytokine, the value from P1 was divided by the average of family
  controls and log2-transformed to visualize fold changes.(B) IFN signature analysis
  by Nanostring. Heatmap displaying the expression levels of IFN-stimulated genes
  (ISGs) in the patient (II.1) compared to three age-matched healthy controls (HC1-3)
  and an IFN-positive control (IFN). Red indicates upregulation, while green represents
  downregulation relative to controls.(C) Phosphorylated STAT (pSTAT) levels in different
  immune cell populations. Peripheral blood mononuclear cells (PBMCs) from P1 and
  her sibling control (SC) were stimulated with IFN-α2 (upper panel) or IL-6 (lower
  panel) for 3 hours. pSTAT1 and pSTAT3 were assessed by flow cytometry using double-staining
  for pSTATs and cell-type-specific markers (CD14 for monocytes, CD3 for T cells,
  and CD19 for B cells). Histograms show increased baseline pSTAT1 in P1 and altered
  response upon IFN-α2 stimulation. IL-6–induced pSTAT3 levels were also measured
  to evaluate STAT3 pathway activation.(D) Western blot analysis of IFN pathway activation
  in EBV-transformed B cells. EBV-transformed B cells from P1 and SC were treated
  with IFN-α2 for the indicated durations. Western blot analysis was performed using
  specific antibodies against pSTAT1, ISG15, and Actin as a loading control.(E) Sustained
  IFN response in EBV-transformed B cells. Western blot analysis of EBV-transformed
  B cells from P1 and SC following 24 hours of IFN-α2 stimulation. The blot shows
  the expression of pSTAT1, ISG15, and Actin.(F) Cytokine secretion in response to
  IFN stimulation. ELISA quantification of IP-10 (CXCL10), MIG (CXCL9), and IL-6 levels
  in culture supernatants from EBV-transformed B cells of a healthy control (HC),
  SC, and P1 following 24 hours of IFN-γ treatment. Additionally, IL-6 levels were
  quantified in supernatants from PBMCs of P1 and a healthy control cultured for 48
  hours (panel bottom right)
