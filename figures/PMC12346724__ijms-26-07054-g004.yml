figure_title: Inflammatory mechanisms involved in Fabry disease.
caption: 'Inflammatory mechanisms involved in Fabry disease. Lysosomal dysfunction
  resulting from α-galactosidase A (α-Gal A) deficiency leads to the accumulation
  of glycosphingolipids, primarily globotriaosylceramide (Gb3) and its deacylated
  form globotriaosylsphingosine (lyso-Gb3). This accumulation triggers several inflammatory
  pathways. In the innate immune system activation, Gb3 and lyso-Gb3 activate the
  toll-like receptor 4 (TLR4) and nuclear factor-kappa B (NF-κB) signaling pathway,
  promoting the release of pro-inflammatory cytokines such as tumor necrosis factor-alpha
  (TNF-α), interleukin-1 beta (IL-1β), and interleukin-6 (IL-6). NOD-, LRR- and pyrin
  domain-containing protein 3 (NLRP3) inflammasome activation and complement system
  dysregulation further amplify the inflammatory response. Furthermore, Gb3 accumulation
  induces persistent endoplasmic reticulum (ER) stress and unfolded protein response
  (UPR), which contributes to cytokine release and apoptosis. Autophagy impairment
  leads to increased production reactive oxygen species (ROS) and further inflammasome
  activation. Additionally, endothelial dysfunction, characterized by NF-κB activation
  and upregulation of vascular endothelial growth factor A (VEGF-A) and cell adhesion
  molecules (CAMs), promotes vascular inflammation. These interconnected mechanisms
  promote chronic inflammation and contribute to organ damage in FD. Abbreviations:
  MAPK, mitogen-activated protein kinase; COX-2, cyclooxygenase-2'
article_title: 'Fabry Disease Beyond Storage: The Role of Inflammation in Disease
  Progression'
