figure_title: Secondary screens reveal modifiers specific to tau oligomer levels and
  MAPT genotype
caption: (A) Schematic of retest strategy. A focused sgRNA library targeting all genome-wide
  screen hit genes was screened in MAPT WT and MAPT V337M neurons using different
  antibodies. (B) Overlap of hit genes knockdown of which increases tau oligomer levels
  detected by three tau oligomer antibodies, T22, TOC1, and M204. Top KEGG Pathways
  enriched for the 118 hit genes common to all three screens were calculated after
  removal of mitochondrial genes. (C) Overlap of hit genes knockdown of which decreases
  tau oligomer levels detected by three different tau oligomer antibodies, T22, TOC1,
  and M204. Top KEGG Pathways enriched for the hit genes common to all three screens
  are listed. (D) Comparison of total tau and tau oligomer screens in MAPT V337M neurons
  by gene score. ETC Complex I genes (red), ER/UFMylation genes (orange), and GPI-anchor
  genes (blue) were oligomer-specific hits. mTOR and AMPK signaling genes are in green.
  (E) Comparison of tau oligomer screens in MAPT WT vs. V337M neurons by gene score.
  GPI-anchor genes (blue) were V337M-specific, while knockdown of genes involved in
  mRNA transport (white), especially nuclear pore subunits, strongly decreased tau
  oligomer levels in WT but not V337M neurons. Knockdown of TCA cycle genes (red)
  and genes involved in AMPK signaling (green) weakly increased tau oligomers in WT,
  but not V337M neurons. (F) Comparison of screens for total tau levels in MAPT V337M
  versus WT neurons. mTOR signaling (green) and GPI anchor genes (blue) have a higher
  gene score in MAPT V337M than WT neurons. Knockdown of genes involved in RNA degradation
  (white) have a higher gene score in MAPT WT than V337M neurons. For (D)-(F) CUL5
  is labelled in purple, non-targeting controls are in black and genes are in grey
