figure_title: Exploring the Neuroprotective Potential of Astragalus membranaceus in
  Central Nervous System Diseases
caption: A. membranaceus exerts anti-apoptotic and autophagy regulatory effects. (A)
  Anti-apoptotic signaling pathways. AS-IV inhibits neuronal apoptosis through multiple
  pathways. AS-IV suppresses the phosphorylation of c-Jun N-terminal kinase (JNK)
  and downregulates the expression of the calcium-sensing receptor (CaSR), thereby
  preventing the activation of pro-apoptotic cascades. Concurrently, it activates
  the pro-survival PI3K/Akt and ERK signaling pathways. The net effect is a shift
  in the mitochondrial balance towards cell survival, characterized by a decrease
  in the Bax/Bcl-2 ratio, inhibition of cytochrome c (Cyto C) and apoptosis-inducing
  factor (AIF) release from mitochondria, and subsequent suppression of the key executioner
  caspase, caspase-3. (B) Regulation of autophagy. A. membranaceus components modulate
  the highly conserved autophagy pathway to exert neuroprotective effects. A key mechanism
  involves the inhibition of the PI3K/Akt/mTORC1 signaling axis. By reducing mTORC1
  activity, A. membranaceus relieves its suppression on the ULK1 complex and Beclin-1,
  thereby initiating autophagosome formation. This promotes the sequestration of damaged
  organelles and protein aggregates into a phagophore, which matures into an autophagosome
  and subsequently fuses with a lysosome to form an autolysosome, where cargo is degraded
  and recycled. The regulation of this process helps maintain cellular homeostasis
  in neurons under stress. This figure is original and was created by the authors
  for this publication
