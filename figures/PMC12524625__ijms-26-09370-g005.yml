figure_title: Possible mechanism of normal stromal cell transitions in CAFs and transition
  of CAFs subtypes with formation of CAF aggressive phenotypes.
caption: Possible mechanism of normal stromal cell transitions in CAFs and transition
  of CAFs subtypes with formation of CAF aggressive phenotypes. S100A4 resistance
  possibly supports the transition of normal stromal cells to the CAF-S2 subtype,
  while S100A4-sensitive stromal cells transit to the CAF-S3 subtype. CAF-S3 may transit
  to aggressive CAF phenotypes through the activation of RAGE downstream pathways
  supporting ECM remodeling and metastasis development. The mechanism (symbol “?”)
  of CAF—mediated development of drug resistance and transition of normal stromal
  cells to the CAF-S2 subtype remains the subject of further study
