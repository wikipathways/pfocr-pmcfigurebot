figure_title: Balanced expression of Slc25a39 is necessary for proper progression
  through the myogenesis program in vitro and in vivo
caption: '(A) Pathway enrichment analysis of differentially expressed genes in Slc25a39-silenced
  cells, identifying affected biological pathways compared to control cells. (B) Heatmap
  displaying expression levels of key myogenic differentiation regulators under four
  conditions: control (+Q, si_NT), Slc25a39 knockdown (+Q, si_Slc25a39), glutamine-free
  (−Q, si_NT), and glutamine-free Slc25a39 knockdown (−Q, si_Slc25a39). (C) Immunofluorescence
  microscopy images of primary myoblasts stained for myosin heavy chain (MHC) after
  24 or 48 hours of differentiation, transfected with si_NT or si_Slc25a39. Scale
  bar = 20 μm. (D) Quantification of fusion index (percentage of nuclei within MHC-positive
  multinucleated myotubes) from experiment in Figure 7C. Data represent mean ± SD
  from n = 5 fields per condition. Statistical significance was determined using Student’s
  t-test. (E) Immunofluorescence microscopy images of C2C12 cells stained for myogenin
  (MyoG) and MHC after 24 hours of differentiation, transfected with si_NT or si_Slc25a39.
  Scale bars: MyoG = 20 μm; MHC = 100 μm. (F) Quantification of fusion index and percentage
  of MyoG-positive cells from the experiment in Figure 7E. Data represent mean ± SD
  from n = 3 independent experiments. Statistical significance was determined using
  Student’s t-test. (G) Left: Proliferation of parental (WT) C2C12 myoblasts versus
  a line constitutively expressing human SLC25A39 (CMV-hSLC). Right: Proliferation
  of WT C2C12 versus a doxycycline-inducible tet-ON SLC25A39 line (iSLC25A39). Cells
  were cultured in growth medium and counted every 24 h for 72 h; WT denotes matched
  parental cells handled identically. Both constitutive and inducible SLC25A39 expression
  markedly blunts cell accumulation relative to WT. Axes reflect the observed dynamic
  range for each experiment. Data are mean ± SD of biological replicates. (H) Immunofluorescence
  images of WT and CMV-hSLC cells after 2 days of differentiation, stained for MHC
  (red), GFP (green), and DAPI (blue). Scale bar = 20μm. (I) Quantification of fusion
  index in WT and CMV-hSLC cells. Data represent mean ± SD from n = 3 independent
  experiments. Statistical significance was determined using Student’s t-test. (J)
  Schematic of in vivo experimental design: mice were subjected to muscle injury,
  followed by intramuscular injection of 100nM siRNA (si_NT or si_Slc25a39) the next
  day, and muscles were harvested on day 5 post-injury. (K) Immunohistochemistry images
  of injured mouse muscle sections stained for embryonic myosin heavy chain (eMHC)
  and DAPI, comparing si_NT and si_Slc25a39-injected muscles. Scale bar = 200 μm.
  (L) Quantification of muscle regeneration area, expressed as the number of eMHC-positive
  myofibers per mm2. Data represent mean ± SD from 3 mice per group. Statistical significance
  was determined using Student’s t-test. (M) The proposed model illustrates how mitochondrial
  redox balance mediated by SLC25A39 influences myogenic differentiation and regeneration.
  Statistical significance is indicated as P<0.05(*) and P<0.05(#), determined by
  Student’s t-test. Data are presented as mean ± S.D'
article_title: Glutamine-Dependent Slc25a39–Nrf2 Axis Couples Mitochondrial Dynamics
  with Metabolic Reprogramming to Establish Myogenic Commitment
