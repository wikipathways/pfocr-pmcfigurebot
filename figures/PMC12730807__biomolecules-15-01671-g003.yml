figure_title: Mechanisms of A.
caption: 'Mechanisms of A. membranaceus in Combating Neuroinflammation and Oxidative
  Stress. (A) Anti-neuroinflammation pathway. A. membranaceus components, notably
  Astragaloside IV (AS-IV) and A. membranaceus polysaccharides (APS), exert potent
  anti-inflammatory effects primarily by inhibiting the NF-κB signaling pathway. This
  inhibition results in a decrease in the production of key pro-inflammatory cytokines,
  including TNF-α, IL-1β, and IL-6. Furthermore, these bioactive compounds suppress
  the activation of the NLRP3 inflammasome, a critical complex that drives the maturation
  and secretion of IL-1β, thereby mitigating a central inflammatory cascade in CNS
  disorders. Concurrently, A. membranaceus promotes the polarization of microglia/macrophages
  from a pro-inflammatory M1 phenotype towards an anti-inflammatory and reparative
  M2 phenotype, contributing to the resolution of neuroinflammation. (B) Antioxidant
  stress pathway. A. membranaceus and its flavonoid constituents, such as Calycosin
  and Formononetin, activate the central antioxidant regulator Nrf2. Upon activation,
  Nrf2 translocates to the nucleus and binds to the Antioxidant Response Element (ARE),
  initiating the transcription of a battery of cytoprotective and antioxidant enzymes.
  This includes the upregulation of Superoxide Dismutase (SOD), Catalase (CAT), and
  Glutathione Peroxidase (GSH-Px). These enzymes work in concert to neutralize reactive
  oxygen species (ROS): SOD catalyzes the conversion of superoxide anions into hydrogen
  peroxide, which is then subsequently degraded to water (H2O) by CAT and GSH-Px.
  This enhanced antioxidant capacity effectively reduces oxidative damage to cellular
  components, a common feature in various CNS diseases. This figure is original and
  was created by the authors for this publication'
article_title: Exploring the Neuroprotective Potential of Astragalus membranaceus
