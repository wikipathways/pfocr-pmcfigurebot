caption: 'Transcriptional profiling analysis of PFE treatment on HaCaT cells. (A):
  Transcriptome sequencing revealed 420 differentially expressed genes (DEGs), 349
  upregulated and 71 downregulated. (B): Volcano plot highlights the symmetrical distribution
  of upregulated (red) and downregulated (blue) genes at the log 2 FC threshold. (C):
  Clustering diagram of differentially expressed genes (red indicates high expression
  genes, blue indicates low expression genes). (D): GO functional enrichment analysis
  of differentially expressed genes. (E): KEGG pathway enrichment analysis of differentially
  expressed genes'
