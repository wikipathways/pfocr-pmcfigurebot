figure_title: AS inhibited the expression of Ddit3 by regulating the IRE1-AKT pathway.
caption: AS inhibited the expression of Ddit3 by regulating the IRE1-AKT pathway.
  (A) GO analysis indicating that ER stress pathways significantly changed in the
  AS-treated group. (B) Real-time PCR analysis detecting the mRNA levels of IRE1 in
  MDA-MB-231 cells or 4T1 cells. (C) The mRNA level of IRE1 in MDA-MB-231 cells and
  4T1 cells transfected with si-IRE1 was detected by real-time PCR. (D) Western blotting
  detecting the levels of total and phosphorylated IRE1, AKT, and p38 after treatment
  with AS with or without IRE1 knockdown. (E,F) Quantification of C. (G) Real-time
  PCR analysis detecting the mRNA levels of Ddit3 in 4T1 cells treated with AS with
  or without IRE1 knockdown. (H) Real-time PCR analysis detecting the mRNA levels
  of Ddit3 in 4T1 cells treated with AS in the absence or presence of SC79. AS, astragalin.
  * p < 0.05; ** p < 0.01, *** p < 0.001
