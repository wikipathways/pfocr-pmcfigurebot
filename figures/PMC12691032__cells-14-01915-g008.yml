figure_title: Transcriptomic profiling of neuroglial cultures following EV-GPC treatment.
caption: Transcriptomic profiling of neuroglial cultures following EV-GPC treatment.
  (A)—heatmaps of differentially expressed genes (DEGs) were obtained using pheatmap
  R package (version 4.5.2). Each row represents a gene and each column corresponds
  to an individual sample, sample groups indicated by column annotations. Log2-transformed
  gene expression values were row-scaled; hierarchical clustering was performed for
  both rows (genes) and columns (samples) using Euclidean distance and the complete
  clustering method. The colour scale represents scaled expression values and ranges
  from blue (down-regulated) to red (up-regulated); (B)—results of classification
  of down-regulated DEGs using the Gene Ontology Biological Processes database. The
  X-axis shows the ratio of pathway DEGs to the total number of DEGs, and the Y-axis
  shows the selected biological processes; (C)—results of classification of down-regulated
  DEGs using the KEGG database. The X-axis shows the ratio of pathway DEGs to the
  total number of DEGs, and the Y-axis shows the selected signalling pathways
