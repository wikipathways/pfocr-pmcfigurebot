figure_title: Swertiamarin exhibits broad immunomodulatory and anti-inflammatory properties
  through multiple mechanisms.
caption: 'Swertiamarin exhibits broad immunomodulatory and anti-inflammatory properties
  through multiple mechanisms. (1) Immunomodulation: SW enhances humoral and cellular
  immunity by increasing antibody titers, plaque-forming cells, and immune organ weights
  and reducing delayed-type hypersensitivity (DTH) responses and Th1/Th2 balance shifting.
  (2) Anti-inflammation: SW inhibits AKT-PH domain binding to suppress p-AKT activation,
  consequently reducing pro-inflammatory cytokines, and synergistically modulates
  both the PI3K-AKT and p38 MAPK pathways to decrease IL-1, IL-6, and PGE2 production.
  (3) Antimalarial protection: SW reduces parasite load and regulates cytokine profiles
  for antimalarial effects. (4) Free radical scavenging: SW reduces ROS in PHA-stimulated
  neutrophils and edema in paw models'
