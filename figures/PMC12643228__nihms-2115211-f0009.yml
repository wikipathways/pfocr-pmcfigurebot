figure_title: Ca2+ pathway analysis of bulk RNA sequencing in UB and CD organoids
  cultured for 35 d and 63 d
caption: '(A) Volcano plots of FDR adjusted p-value versus log2 fold-change for each
  comparison, cross-referenced from the Calcium Gene Database. Colors highlight significant
  genes with fold-change ≤ 2 (orange), significant genes with fold-change > 2 (blue),
  and non-significant genes (gray). Gene names are displayed for the top 30 most significant
  genes. (B) Gene ontology enrichment analysis for Ca2+ genes that are differentially
  expressed (adjusted p-value < 0.05) in response to the four comparisons: 63 d UB
  vs. 35 d UB, 63 d CD vs. 35 d CD, 63 d CD vs. 63 d UB, 35 d CD vs. 35 d UB. The
  displayed p-values are adjusted according to the Benjamín-Hochberg method, and the
  top 5 pathways (or more if p-values were approximately tied) with adjusted p < 0.001
  are shown. (C) Heatmap analysis of gene expression for a selected set of genes involved
  in the frequency of decoding of Ca2+ oscillations, showing the impact of state of
  differentiation (UB vs CD) and timepoint (35 d vs 63 d) on gene expression. Expression
  profiles were normalized using variance stabilizing transformation'
article_title: Ca2+ signal dynamics in maturing ureteric bud (UB) and collecting duct
