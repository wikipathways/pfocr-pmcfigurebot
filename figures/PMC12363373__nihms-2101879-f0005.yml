figure_title: Treg-deficient mice show metabolic dysregulation and mitochondrial aberrancies
  upon treatment with an Adrb3 agonist
caption: '(A) Volcano plot comparing the BAT transcriptomes of mice treated with CL316,
  243 (CL) or PBS for 4h (n = 3 RNA samples per group). Differentially expressed (≥
  2-fold, p < 0.05) (bottom) and total (top) transcripts are indicated.(B) Pathway
  analysis on the differentially expressed genes highlighted in (A).(C-H) Mice with
  (DTR−) or without (DTR+) Treg cells were administered CL or PBS and analyzed.(C)
  Experimental Scheme.(D) Volcano plot comparing the transcriptomes of DTR+ and DTR−
  mice. CL-induced (olive) or repressed (green) gene signatures from (A) are overlain
  (n = 3 RNA samples per group).(E) GSEA showing the Hallmark gene-sets most impoverished
  in CL-treated Treg-cell-deficient mice.(F) Representative H&E histology of BAT depots.
  Arrows indicate lipid droplets.(G) Representative immunoblot of whole-lysates (top)
  and densitometry quantification (bottom) for the indicated proteins extracted from
  BAT tissues. Vin. = loading control. Triplicate data.(H) Top and center: representative
  transmission electron micrographs of BAT mitochondria with arrows highlighting examples
  of those with aberrant cristae; bottom: quantification of cristae area (n ≥ 120
  mt, each dot represents a quantified micrograph from one of the 3 mice per group).(I)
  Trace of energy expenditure (left; Mean ± SEM) and cumulative EE during the acute
  (0–4h) or dark phase following CL injection (right; n = 7–8 mice per group).Mean
  ± SD, unless stated. Two-way ANOVA with Tukey’s multiple comparisons test (G), Student’s
  t-test (H; I, right), χ2 test (D), or ANCOVA (I, left ). P values as per Fig. 1.
  CL, Adrb3 agonist CL316, 243'
