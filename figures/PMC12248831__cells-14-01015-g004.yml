figure_title: CON, OE-Mfn1, and shMfn1 cells for metabolomics analysis and key metabolite
  content detection.
caption: CON, OE-Mfn1, and shMfn1 cells for metabolomics analysis and key metabolite
  content detection. (A) Correlation coefficient analysis of metabolites in CON, OE-Mfn1,
  and shMfn1 cells, respectively. (B) PCA clustering of metbolomics in CON, OE-Mfn1,
  and shMfn1 cells. (C) Differential metabolite statistics in CON and OE-Mfn1 cells.
  (D) Differential metabolite statistics in CON and shMfn1 cells. (E) KEGG functional
  pathway enrichment analysis of differential metabolites between CON and OE-Mfn1
  cells. The red bars represent the enriched signal pathways related to metabolism,
  the green bars represent the enriched signal pathways related to genetic information
  processing, the purple bars represent the enriched signal pathways related to cellular
  processes, and the blue bars represent the enriched signal pathways related to organismal
  systems. (F) KEGG pathway enrichment analysis of differential metabolites between
  CON and OE-Mfn1. (G) Detection of α-KG content in CON, OE-Mfn1, and shMfn1 cells.
  (H) Detection of A-CoA content in CON, OE-Mfn1, and shMfn1 cells. (I) Detection
  of SAM content in CON, OE-Mfn1, and shMfn1 cells. * p < 0.05; ** p < 0.01; *** p
  < 0.001; ns, no statistically significant difference
