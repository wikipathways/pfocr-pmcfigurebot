figure_title: The ER stress sensor BBF2H7 is activated during melanogenesis.
caption: 'The ER stress sensor BBF2H7 is activated during melanogenesis. (A) Schematic
  representation of the putative structure (upper) and activation mechanism (lower)
  of BBF2H7. BBF2H7 is an ER-resident transmembrane transcription factor that translocates
  to the Golgi apparatus in response to ER stress, where it is cleaved by regulated
  intramembrane proteolysis (RIP) via site-1 and site-2 proteases (S1P and S2P). The
  generated cytoplasmic N-terminal fragment, containing a basic leucine zipper (bZIP)
  DNA-binding domain, functions as a transcription factor. (B) Expression levels of
  Bbf2h7 in melanocytes derived from human embryonic stem cells (normal) and in melanocytes
  derived from pluripotent stem cells of patients with oculocutaneous albinism (patient-1
  and patient-2); data were obtained from the Gene Expression Omnibus Dataset GSE45226
  and are shown as a box plot (n = 3). (C) Pathway analysis of genes showing more
  than a two-fold increase or decrease in expression in patient-1 relative to normal
  melanocytes (p < 0.05) in GSE45226. “Protein export” is the most enriched category
  (fold enrichment: 4.5). (D) Gene ontology (biological process) analysis of differentially
  expressed genes (as in (C)). The second-, third-, fourth-, and sixth-largest categories
  are “intracellular protein transport” (2.2-fold), “intracellular transport” (2.1-fold),
  “protein localization to organelle” (2.0-fold), and “protein transport” (1.9-fold),
  respectively. (E) Phase-contrast images of B16 cells treated with α-MSH. Scale bar:
  10 μm. (F) Cell pellets (arrows) of B16 cells treated with α-MSH. (G) Melanin content
  in B16 cells treated with α-MSH (n = 3). (H) Western blot analysis of Tyrosinase,
  IRE1, BBF2H7, and Sec23a in B16 cells treated with α-MSH. (I) Immunofluorescence
  staining of Tyrosinase (red) and BBF2H7 (green) in B16 cells treated with α-MSH
  (DAPI: blue). Scale bar: 10 μm. Mean ± SD. ** p < 0.01'
