figure_title: Cynarin suppresses the MAPK signalling pathway in RANKL-induced osteoclastogenesis.
caption: Cynarin suppresses the MAPK signalling pathway in RANKL-induced osteoclastogenesis.
  (A) RANKL induced RAW264.7 cells for 5 days with or without 100 μM cynarin. Total
  RNA was extracted and sent for RNA sequencing. Genes exhibiting |Log2FC|≥0.58 (FC
  ≥1.5) and unadjusted P≤0.05 were considered to be differentially expressed. Volcano
  plot of the distinct upregulated and downregulated genes of Cy vs. OC (n=3). (B)
  Gene Ontology enrichment analysis of differential genes of Cy vs. OC (n=3). (C)
  Kyoto Encyclopedia of Genes and Genomes pathway analysis of differential genes of
  Cy vs. OC (n=3). (D) RAW264,7 cells were pretreated with 100 μM cynarin for 6 h
  and stimulated with 50 ng/ml RANKL for 10 to 60 min. Expression levels of total
  and phosphorylated forms of JNK, ERK, and P38 were detected by WB. (E) RAW264.7
  cells were treated with 100 μM cynarin, 10 μM anisomycin for 30 min and stimulated
  with 50 ng/ml RANKL for 30 min. The ratio of phosphorylated JNK to JNK, p-ERK to
  ERK and p-P38 to P38 were quantitatively determined by WB. (F) Quantitative densitometric
  analysis was performed to normalize p-JNK/JNK, p-ERK/ERK and p-P38/P38 expression
  levels from D (n=3). (G) Quantitative densitometric analysis was performed to normalize
  p-JNK/JNK, p-ERK/ERK and p-P38/P38 expression from E (n=3). (H) RAW264,7 cells were
  treated with 100 μM cynarin, 10 μM anisomycin for 4 days in RANKL-induced osteoclastogenesis.
  Expression levels of OC-specific genes were detected by reverse transcription-quantitative
  PCR (n=3). The data are presented as the mean ± SD. *P<0.05, **P<0.01, ***P<0.001
  and ****P<0.0001. RANKL, receptor activator of nuclear factor κB ligand; OC, osteoclast;
  p-, phosphorylated; WB, western blotting; Ani, anisomycin
