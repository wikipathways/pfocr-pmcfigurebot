figure_title: 'MSC-derived EVs carrying miR-335-5p induce protein degradation in MFLCs
  via the MAPK11/iNOS pathway: (A) A schematic diagram of miR-335-5p or MSC-derived
  EVs labeled with Cy3 or FAM treated with MFLCs.'
caption: 'MSC-derived EVs carrying miR-335-5p induce protein degradation in MFLCs
  via the MAPK11/iNOS pathway: (A) A schematic diagram of miR-335-5p or MSC-derived
  EVs labeled with Cy3 or FAM treated with MFLCs. (B) MSCs were transfected with an
  miR-335-5p NC or miR-335-5p mimic, and MSC-derived EVs were collected representative
  images of Cy3-labeled miR-335-5p (red) and FAM-labeled TSG101 (green) were obtained
  after incubation with MFLCs for 24 h. Bar: 50 μm. (C) MSCs were transfected with
  an miR-335-5p NC or miR-335-5p mimic, and MSC-derived EVs were collected; qRT-PCR
  analysis of miR-335-5p levels after incubation with MFLCs for 24 h. (D) Western
  blot analysis of MAPK11, iNOS, FBXO32, TRIM63, and MYOG protein levels of MSC-derived
  EVs transfected with miR-335-5p and NC mimics in MFLCs for 24 h. Original Western
  blot images can be found in Figure S5. (E) Western blot analysis of MAPK11, iNOS,
  FBXO32, TRIM63, and MYOG protein levels in MFLCs transfected with pcDNA-3.1 or pcDNA-MAPK11
  and MSC-derived EVs transfected with an miR-335-5p or NC mimic. n = 3. The results
  are expressed as the mean ± SEM. * p < 0.05, ** p < 0.01, ns, not significant, values
  significantly differ from those of the corresponding control based on an unpaired
  t-test. Original Western blot images can be found in Figure S5'
