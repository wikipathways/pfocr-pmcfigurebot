figure_title: Remodeling of mitochondrial lipid metabolism pathways during bovine
  oocyte maturation.
caption: 'Remodeling of mitochondrial lipid metabolism pathways during bovine oocyte
  maturation. (a) De novo fatty acid biosynthesis in the cytosol generates hexadecanoic
  acid (palmitic acid; C16:0) as the central metabolic hub. Palmitoyl-CoA is subsequently
  elongated in the endoplasmic reticulum by the ELOVL enzyme family in sequential
  +2-carbon cycles, producing long- and very-long-chain fatty acyl-CoAs (C18–C26).
  (b) Fatty acid degradation (β-oxidation) and energy generation. Pathway highlights:
  (1) carnitine shuttle (*CPT1/2*), (2) β-oxidation cycle (VLCAD, HADHA/B), (3) TCA
  cycle and oxidative phosphorylation (ATP synthase). (c) Functional annotation of
  lipid metabolism genes. Left: Sankey diagram linking genes to pathways (Fatty Acid
  Biosynthesis [FAB], Elongation [FAE], Degradation [FAD]). Shared genes are color-coded.
  Right: Dot plot of enriched pathways (GeneRatio vs. −log10(p-value)). (d) Dynamic
  expression of lipid metabolism genes across maturation. Heatmap of genes grouped
  by pathway (FAB, FAE, FAD). Color scale: Z-score of expression (red: upregulated;
  blue: downregulated). Shared genes are annotated'
article_title: Cross-Species Transcriptomic and Metabolomic Analysis Reveals Conserved
  and Divergent Fatty Acid Metabolic Regulatory Strategies During Mammalian Oocyte
  Maturation
