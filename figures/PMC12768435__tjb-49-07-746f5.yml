figure_title: Shenfu injections regulate ferroptosis in cardiac tissues of yang-deficient
  CHF rats via Akt/GSK-3β/Nrf2 pathway.
caption: 'Shenfu injections regulate ferroptosis in cardiac tissues of yang-deficient
  CHF rats via Akt/GSK-3β/Nrf2 pathway. A: DHE probe detecting ROS in the cardiac
  tissues of rats in each group; B–G: ELISA detecting GSH, SOD, GPX4, SLC3A2, MDA,
  and ACSL4 in serum of rats in each group; H: Fe2+ kit detecting Fe2+ in serum of
  rats in each group; I: RT-qPCR detecting Nrf2 in the cardiac tissues of rats in
  each group; J–M: RT-qPCR detecting Ptgs2, GPX4, SLC3A2, SLC7A11, and ACSL4 in the
  cardiac tissues of rats in each group. Data are expressed as mean ± SD. *p < 0.05
  compared with control group, and #p < 0.05 compared with the high-dose Shenfu injection
  group, &p < 0.05'
