caption: Diagram of all latent transition probabilities between latent classes at
  ages 9, 12, and 15 and most common latent transition analysis paths. Numbers within
  each circle correspond to latent class (e.g., “1” = class 1) at the age indicated
  at the top of the column above it. Percentages displayed on lines between the columns
  for each age represent the percentage of individuals from within the prior (i.e.,
  left) latent class who transitioned to the indicated (i.e., right) latent class.
  Percentages indicated on the right side of the figure within rectangles indicate
  the percentage of the total sample in a given latent transition path from age 9
  through age 15, as depicted by the pair of lines in the indicated color and the
  corresponding numbers. Three-digit numbers indicate the class assignments at ages
  9, 12, and 15 in the latent transition pathway. 111 = persistently TD; 114 = adolescent
  IN; 224 = typical ADHD; 324 = desisters; 333 = persistently oppositional; 442 =
  worsening; 444 = persistently IN; 524 = mixed trajectory; TD = typically developing;
  IN = inattention; ADHD = attention-deficit/hyperactivity disorder; HI = hyperactivity/impulsivity;
  ST = subthreshold; mod = moderate
