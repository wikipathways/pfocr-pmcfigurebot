figure_title: Somatosensory cortex (SS) to lSuC pathway drives mechanical hypersensitization
caption: 'a, b, Representative images (a) and quantification (b) of monosynaptic inputs
  onto RVM projecting neurons in the lSuC (n = 4). Scale Bar: 500 μm. Inset: reconstruction
  of retrogradely labeled neurons in the cortex. Dashed circle highlights the anterior
  motor cortex (MOa) and SS. MO: motor cortex; ZI: zona incerta; SS: somatosensory
  cortex; MRN: midbrain reticular nucleus; SNr: substantia nigra; APN: anterior pretectal
  nucleus; PAG: periaqueductal gray; LHA: lateral hypothalamic area; GRN: gigantocellular
  reticular nucleus; VNC: vestibular nuclei; VM: ventral medial nucleus of the thalamus;
  PRNc: pontine reticular nucleus, caudal part; PB: parabrachial nucleus; RSP: retrosplenial
  area. c, d, Quantification of mechanical thresholds of saline (black, n = 6–7) and
  CLZ (blue, n = 6–7) infusion into the lSuC of mice expressing hM4D in MOa (c) or
  SS (d) for chemogenetic silencing of the MOa→lSuC pathway or SS→lSuC pathway, respectively.
  CLZ: clozapine. Wilcoxon matched-pairs signed rank test, * P < 0.05. e, Example
  traces and quantification of mechanical stimuli (0.16 g von Frey filament) evoked
  CPA in mCherry (white, n = 6) but not hM4D (blue, n = 7) expressed in SS after SNI.
  Mann-Whitney test, ** P < 0.01. f, Quantification of mechanical thresholds of non-injured
  mice expressing hM3D in SS after repetitive CLZ infusion into the lSuC in control
  mice (red, n = 7) or mice after ablation of OPRM1+ RVMSC neurons (black, n = 8).
  CLZ was injected 23 hours before each von Frey test for 7 consecutive days (shade
  area). Comparing control vs. ablation: Mann-Whitney test, ** P < 0.01, *** P < 0.001;
  Comparing before vs. after CLZ: Dunn’s multiple comparisons test, # P < 0.05, ##
  P < 0.01, ### P < 0.001. g, Example traces and quantification of mechanical stimuli
  (0.16 g von Frey filament) evoked CPA in hM3D- (red, n = 7) but not in mCherry-
  (white, n = 6) expressing mice after repetitive infusion of CLZ into the lSuC. Mann-Whitney
  test, ** P < 0.01. Mean ± SEM'
article_title: Deconstruction of a spino-brain-spinal cord circuit drives chronic
  mechanical pain
