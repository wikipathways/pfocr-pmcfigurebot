figure_title: AI-HOPE-TP53 analysis of TP53 pathway alterations in early onset colon
  adenocarcinoma among Hispanic/Latino (H/L) and Non-Hispanic White (NHW) patients.
caption: 'AI-HOPE-TP53 analysis of TP53 pathway alterations in early onset colon adenocarcinoma
  among Hispanic/Latino (H/L) and Non-Hispanic White (NHW) patients. (a) Pie charts
  illustrate the distribution of selected samples following natural language–driven
  filtering of the dataset. The case cohort included 82 patients with early onset
  colorectal cancer (EOCRC) patients under age 50 years of H/L ethnicity and a diagnosis
  of colon adenocarcinoma, comprising 1.5% of the dataset. The control cohort included
  608 patients under age 50 years who were NHW and diagnosed with colon adenocarcinoma,
  representing 11% of the dataset. (b) A 2 × 2 odds ratio analysis was used to evaluate
  the frequency of TP53 pathway alterations between the two groups. The stacked bar
  plot shows the proportion of samples with and without TP53 pathway alterations.
  Alterations were present in 91.46% of H/L cases and 83.39% of NHW controls. The
  calculated odds ratio was 2.13 (95% CI: 0.956–4.767), with a p-value of 0.084, indicating
  a non-significant but suggestive trend toward a greater TP53 alteration prevalence
  in the H/L population'
