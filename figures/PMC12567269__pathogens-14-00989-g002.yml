figure_title: Signaling pathways regulating IL-10 expression in T cells.
caption: Signaling pathways regulating IL-10 expression in T cells. “?” indicates
  that the regulatory mechanism is still unclear. In T cells, the activation of the
  TCR and co-stimulatory molecules, such as CD28 and CD46, initiates the synthesis
  of IL-10 through a complex signaling cascade involving NF-κB, NFAT, and c-Maf. This
  process is often accompanied by the secretion of cytokines, including IFN-γ, IL-4,
  IL-27, and IL-21, which activate specific STAT proteins—STAT4, STAT6, and STAT3.
  In the nucleus, transcription factors such as AP-1, GATA3, and RORγt enhance IL-10
  transcription. Metabolic reprogramming, like short-chain fatty acids pentanoate,
  modulates IL-10 production
