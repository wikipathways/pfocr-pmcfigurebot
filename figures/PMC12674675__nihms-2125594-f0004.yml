caption: IPA Disease and Functions analysis of the RNA sequencing data for genes associated
  with apoptosis of lung cancer cell lines. This pathway is overlayed with IL-13,
  UVB-Induced MAPK, HOTAIR Regulatory pathway, and VEGF signaling canonical pathways.
  EIF2 signaling pathway did not have any associated genes. Each of these genes are
  known to be involved in the apoptosis of lung cancer cell lines. The expression
  data of each gene determines versus its known function determines whether it increases
  or decreases cell proliferation (Table 8 and Table 9). This pathway has an activation
  z-score of 0.862
