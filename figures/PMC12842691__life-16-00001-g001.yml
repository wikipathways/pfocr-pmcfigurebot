figure_title: Longitudinal expression of NLRP3 inflammasome components in patients
  after acute coronary syndrome.
caption: Longitudinal expression of NLRP3 inflammasome components in patients after
  acute coronary syndrome. Relative mRNA expression levels of key inflammasome components
  were assessed at baseline and during follow-up using quantitative RT-PCR. Bars represent
  mean ± standard error of the mean (SEM) of fold change values calculated as 2−ΔΔCT.
  (A) Caspase-1 expression significantly increased at follow-up compared with baseline
  (p = 0.003). (B) NLRP3 expression showed a marked upregulation (p < 0.001). (C)
  IL-1β expression was also significantly elevated (p < 0.001). These findings indicate
  activation of the NLRP3 inflammasome pathway during the post-ACS period. Expression
  of NLRP3 inflammasome components in peripheral blood mononuclear cells at baseline
  and follow-up after acute coronary syndrome. Bars show the arithmetic mean fold
  change ± SEM for (A) caspase-1, (B) NLRP3, and (C) IL-1β. Statistical comparisons
  were performed using two-sided paired t-tests
