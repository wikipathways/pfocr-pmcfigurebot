figure_title: Similar numbers of sex-specific transcripts across drug states, with
  a divergent gene expression pattern emerging during abstinence
caption: Volcano plots comparing sex differences in (A) naïve, (B) intoxication, (C)
  withdrawal, and (D) abstinence. Genes with p-value<0.01 and |FC|>0.26 are highlighted.
  Upregulated genes are shown on the right in red, while downregulated genes are shown
  on the left in blue. RRHO heatmap illustrating both downregulated genes (top-right),
  opposing regulation trends (top-left and bottom-right), and both upregulated genes
  (bottom-left), with warmer colors indicating higher −log10 p-values, highlighting
  sex specific patterns in (E) naïve vs. intoxication, (F) intoxication vs. withdrawal,
  and (G) withdrawal vs. abstinence. Subsets of enriched pathways are shown in (H)
  naïve, (I) intoxication, (J) withdrawal, and (K) abstinence, with the x-axis representing
  −10log(p-value) of each pathway, where higher values indicate more significant pathways.
  (L) Heatmap showing minimal overlap of sex-specific DE genes between groups. (M)
  Polar plot displaying the average peak phase time of rhythmic DE genes, and (N)
  a higher proportion of rhythmic DE genes to total DE genes in abstinence
article_title: Sex-specific transcriptional signatures of oxycodone persist during
  withdrawal and abstinence in the suprachiasmatic nucleus of heterogeneous stock
  rats
