figure_title: Lipogenic programming in the BAT of Scly KO mouse
caption: A. Diagram of the pathways that can utilize Sec as a substrate, highlighting
  the lipogenic route. B. qPCR of lipid metabolism markers from BAT of WT and Scly
  KO mice on a 0.08 and 0.25 ppm Se diet. C. qPCR of PPARγ on a 0.08 and 0.25 ppm
  Se diet. D-E. Western blot and quantification analysis of PPARγ in WT and Scly KO
  mice on a 0.08 and 0.25 ppm Se diet with or without CL injection. F. Western blot
  and quantification of CHREBP. H-I. Western blot and quantification of HSL and ATGL.
  Each error bar represents mean ± SEM, n = 3–6 (B-C) and n = 3–5 (D-H). Data in all
  graphs except E were analyzed with two-way ANOVA with Bonferroni’s post hoc test.
  Data in E was analyzed with two-tailed t-test with Welch’s correction. *P < 0.05,
  **P < 0.01, ***P < 0.001, ****P < 0.0001. PPARγ, peroxisome proliferator activated
  receptor gamma; HK, housekeeping; Ucp1, uncoupling protein 1; hormone sensitive
  lipase E, Lipe; PPAR coactivator 1 alpha, Ppargc1a; peptidyl-prolyl cis-trans isomerase
  B, Ppib; glycerol-3-phosphate dehydrogenase 1, Gpd1; and acetyl-coA carboxylase
  alpha, Acaca; CHREBP, carbohydrate-responsive element-binding protein; HSL, hormone
  sensitive lipase; ATGL, adipose triglyceride lipase; FC, fold change
