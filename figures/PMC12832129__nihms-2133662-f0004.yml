figure_title: Therapeutic Approaches Targeting Cardiac Senescence after Myocardial
  Infarction (MI)
caption: a Dasatinib + Quercetin (D+Q) reduce senescence by inhibiting SCAP through
  PI3K/Akt signaling. b Navitoclax, a BCL-2 family inhibitor, induces apoptosis of
  senescent cells by targeting Senescent Cell Anti-apoptotic Pathways (SCAP). c Fisetin
  reduces SASP secretion through modulation of the p38MAPK/NF-κB pathway. d Resveratrol
  suppresses SASP expression through sirtuin 1. e Hemin upregulates the anti-inflammatory
  enzyme HO-1 thus decreasing SASP secretion. f Cilnidipine inhibits mitochondrial
  fission and prevents senescence. g+h Levosimendan and Losartan reduce senescent
  cell populations by downregulating p16 expression. i Metformin reduces SASP levels
  by activating the AMPK pathway. j Growth differentiation factor 11 (GDF11) inhibits
  the senescence marker p16, facilitating the clearance of senescent cells in a manner
  similar to senolytics, promoting the rejuvenation of cardiac stem cell populations.
  k Activation of AMPK, AKT/mTOR, and WNT pathways enhance stem cell regeneration
  and proliferation
