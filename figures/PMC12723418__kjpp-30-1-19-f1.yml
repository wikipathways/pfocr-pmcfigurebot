figure_title: Loss of Sesn2 induces cellular senescence in C2C12 myoblasts
caption: (A) Representative phase microscopy images of WT and Sesn2 KD C2C12 myoblasts
  stained with X-gal showing phase contrast (left and middle); and SA-β-Gal activity
  (right). (B) Sesn2, NOX4, and TGF-β mRNA expression in WT and Sesn2 KD C2C12 myoblasts.
  β-actin was used as a loading control. (C) Expression levels of NOX4, TGF-β, and
  p21 in muscles of Sesn2 WT and Sesn2 Tg mice under basal conditions. (D) Gene set
  enrichment analysis plots for the genes involved in TGF-β signaling, oxidative stress,
  and degradation of p21 and p27 (“PID TGFBR pathway; M286”, “WP Interactions between
  loxl4 and oxidative stress pathway; M39586”, and “Reactome SCF Skp2 mediated degradation
  of P27 P21; M1801”). Sesn2, sestrin2; WT, wild type; KD, knockdown; SA-β-Gal, senescence-associated
  β-galactosidase; NOX4, nicotinamide adenine dinucleotide phosphate oxidase 4; TGF-β,
  transforming growth factor beta; Tg, transgenic; FDR, false discovery rate; NES,
  normalized enrchiment score
