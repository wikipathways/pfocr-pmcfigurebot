figure_title: KIF13B expression is decreased in aortic tissues of AAA patients and
  mouse models.
caption: 'KIF13B expression is decreased in aortic tissues of AAA patients and mouse
  models. (A) The Venn diagram illustrates the intersection of commonly downregulated
  genes and kinesin family member genes across different AAA samples and control tissues,
  including: the murine ANG II-AAA model (GSE265897), murine PPE-AAA model (GSE51228),
  and AAA patients (GSE57691). Genes with FDR < 0.05 and log2foldchange < 0 were included.
  (B) Normalized KIF13B signal in aortic samples comparing healthy controls (HC, n
  = 9) and abdominal aortic aneurysm (AAA, n = 44) patients within the GEO dataset
  (GSE57691). (C) Representative images of HE staining and co-localized immunofluorescence
  staining depict α-SMA (green), CD68 (grey), and KIF13B (red) protein levels in human
  AAA lesions versus adjacent normal aortas (ANAs) (n = 6/group). (D) Western blot
  analysis of KIF13B protein levels in human AAA lesions and ANAs (n = 6/group). (E)
  Quantitative analysis of KIF13B protein expression levels corresponding to C and
  D. (F) Representative images of HE staining, EVG staining, and immunofluorescence
  staining depict α-SMA (green), CD68 (red), and KIF13B (red) expression levels in
  WT mouse abdominal aortas treated with saline (n = 3) or porcine pancreatic elastase
  (PPE, n = 6). (G) qPCR analysis of Kif13b mRNA expression (n = 3/group) and western
  blot analysis of KIF13B protein expression in WT mouse abdominal aortas treated
  with saline or PPE (n = 6/group). (H) Representative images of HE staining, EVG
  staining, and immunofluorescence staining illustrate α-SMA (green), CD68 (red),
  and KIF13B (red) expression levels in WT mouse abdominal aortas perfused with saline
  (n = 3) or angiotensin II (ANG II, n = 6). (I) qPCR analysis of Kif13b mRNA expression
  (n = 3/group) and western blot analysis of KIF13B protein expression in WT mouse
  abdominal aortas perfused with saline or ANG II (n = 3/group). (J) Correlation analysis
  of TMM-normalized counts between KIF13B and other genes in KEGG pathways. Node sizes
  represent the absolute values of Pearson''s correlation coefficients. Data are presented
  as mean ± SEM. B, E, G left, i were analyzed by unpaired Student''s t-test; G right
  was analyzed by Welch''s t-test'
