figure_title: Identification of players involved in the MAPK/Erk Pathway Oscillator
caption: (A) Left, cartoon representing the molecular interactions described by our
  mathematical model. Right, dependency of the time period and amplitude of oscillations
  on the bifurcation parameter. This analysis confirms that our model is consistent
  with a SNIC bifurcation. (B) Image showing a 6 dpf TgKI(spry2-hsp70I:venus-Pest)
  larva and the subsequent computational extraction of the notochord region, followed
  by extraction of spry2+ individual cells color coded by their mean fluorescence
  levels. (C) spry2:venus-Pest fluorescence as a function of time for single cell
  tracks from a 8 dpf larva. This analysis demonstrates oscillations. (D) Average
  spry2:venus-Pest fluorescence as a function of time from two larvae stage matched
  by entpd5a expression. (E) Detrended spry2:venus-Pest expression levels along with
  timepoint-by-timepoint difference in entpd5a fluorescence as a function of time.
  This analysis shows concurrent oscillations between spry2 expression and entpd5a
  bursts. (F) Time averaged spry2:venus-Pest expression as a function of position
  along the AP axis quantified in entpd5a+ (blue dots) and entpd5a- (purple dots)
  populations. (G) Detrended single cell tracks of dusp6-hsp70I:venus-Pest fluorescence
  (n=16) as function of time in an individual 7 dpf larva. Data are compatible with
  an oscillatory behavior. (H) Averaged egf-hsp70I:venus-Pest and entpd5a:pKRed fluorescence
  levels as a function of time. This analysis indicates an increase in egf expression
  around 5 dpf, similar to when the first bursts of entpd5a expression can be detected.
  (I) Segmented cells detected by venus-Pest fluorescence in the notochord, color
  coded by mean fluorescence levels per cell. (J) Erk levels in individual cells as
  function of position along the AP axis following an EGFR inhibition by treating
  3 dpf larvae for 50 hours with Afatinib at 50 μM (N=3 per condition)
article_title: Tissue-wide, synchronous Erk oscillations time the segmentation of
