figure_title: Acute versus long-lasting effects of optogenetic manipulations
caption: 'Top: after the transduction of the neural population expressing an excitatory
  or inhibitory opsin (amber-colored cells), light is briefly applied to yield an
  acute effect (indicated by the arrow). Once the intervention is stopped, the effect
  quickly wanes, governed by opsin deactivation kinetics. One example of this type
  of intervention is the acute inhibition of D1 receptor (D1R)-expressing medium spiny
  neurons in the nucleus accumbens, which immediately and reversibly increases food
  intake in mice; this behavioral effect of the brief light delivery is illustrated180.
  Bottom: optogenetic modulation of afferent projections for applying plasticity-inducing
  stimulation protocols. The precise protocol for light delivery depends on the type
  of plasticity intended (for example, theta bursts to potentiate synaptic strength
  or low-frequency stimulation to depress synaptic strength). The resulting plasticity
  can be cell type- and pathway-specific. The figure shows a synaptic depressing effect,
  as indicated by the reduced postsynaptic density (brown crescents). Such effects
  may outlast the actual stimulation for days or weeks. One example of this type of
  intervention is the targeting of excitatory afferents onto striatal medium spiny
  neurons to depotentiate synapses and reduce compulsive cocaine self-administration;
  the lasting behavioral effect of the 1-Hz/10-min light delivery is illustrated181'
article_title: Roadmap for direct and indirect translation of optogenetics into discoveries
  and therapies for humans
