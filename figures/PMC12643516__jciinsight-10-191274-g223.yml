figure_title: Gene expression meta-analysis and WGCNA for target prediction in CAD
caption: (A) Selection process for eligible mRNA microarray datasets for meta-analysis
  of the gene signatures in CAD, according to PRISMA flow diagram. (B) Schematic of
  gene expression meta-analysis representing the number of human samples included
  and differentially expressed genes (DEGs). We integrated 10 datasets and a total
  of n = 247 samples from individuals acting as healthy controls and n = 356 samples
  from patients with CAD for the meta-analysis. (C) Bubble plot of KEGG pathway enrichment
  analysis of DEGs; x axis represents enrichment score. Count indicates the number
  of DEGs enriched in pathway; P values were corrected by Benjamini-Hochberg method.
  (D) Gene set enrichment analysis representation of chemokine signaling between CAD
  and control groups. (E) WGCNA-based clustering dendrogram of genes, with dissimilarity
  based on topological overlap, together with assigned module colors. (F) Visualizing
  the gene network using a heatmap plot, which depicts the topological overlap matrix
  (TOM) among all genes in the analysis. Light color represents low overlap, and progressively
  darker red color represents higher overlap. Blocks of darker colors along the diagonal
  are the modules. (G) Interaction network between lncRNAs and miRNAs involved in
  CAD; yellow highlighted nodes show interaction between SPANXA2-OT1 and miR-338.
  (H and I) Violin plot representation of raw intensity expression of SPANXA2-OT1
  (H) and IL-8 (I) from dataset GSE113079. The plot includes expression data from
  n = 48 individuals acting as controls and n = 93 patients with CAD. (J) Violin plot
  representation of raw intensity expression of miRNA-338 across GSE59421 and GSE105449.
  The plot includes expression data from n = 79 individuals acting as controls and
  n = 71 patients with CAD. Statistical analysis was performed using Welch’s t test.
  ****P < 0.0001
article_title: A systems approach to target discovery identifies the role of lncRNA-SPANXA2-OT1
