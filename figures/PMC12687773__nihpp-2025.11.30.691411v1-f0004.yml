figure_title: CHIR stimulation context influences HAQER gene regulatory effects in
  developing cortex
caption: a. Schematic of the study design. Cells are transduced at an MOI of 1 sgRNA
  per cell and CHIR stimulated prior to single cell capture. Schematic of differential
  chromatin accessibility dependent on the context. Volcano plot showing differential
  gene expression of cells transduced with NTC exposed to CHIR stimulation compared
  to DMSO vehicle.b. Scatter plot of HAQER-gene linkages in DMSO Baseline (X axis)
  vs under CHIR stimulation (Y axis) for human samples. Each dot represents a HAQER-gene
  linkage (log2FC for targeting- sgRNA vs NTC in each condition). Colors of the dots
  represent significance of the linkage in baseline, CHIR, both, or none.c. Heatmap
  of normalized expression of genes linked with Wnt pathway, VISTA, HAQER and cell-type
  markers, in cells containing NTC sgRNA in the DMSO baseline condition. Human and
  rhesus panels displayed side by side.d. CHIR responsive expression level changes
  of Wnt, VISTA, and HAQER - linked genes in human and rhesus samples. Z-statistic
  notes the direction of the gene expression change compared to DMSO.e. Cell type-specific
  gene expression level changes of HAQER linked genes in the context of DMSO or CHIR
