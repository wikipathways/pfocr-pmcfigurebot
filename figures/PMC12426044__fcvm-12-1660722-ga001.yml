caption: This graphical abstract illustrates the diagnostic pathway of a highly mobile,
  filamentous mass in the ascending aorta, incidentally found during routine transthoracic
  echocardiography. 3D transesophageal echocardiography (3D-TEE) played a crucial
  role in defining the lesion’s morphology and attachment site, leading to surgical
  excision. Histopathological analysis confirmed a large, calcified atheroma. This
  case highlights the central role of 3D-TEE imaging in the detection and management
  of rare aortic abnormalities
article_title: 'Case Report: Hidden in motion: a challenging aortic mass unveiled
