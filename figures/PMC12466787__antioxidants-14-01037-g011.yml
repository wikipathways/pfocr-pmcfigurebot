figure_title: Validation of combination treatment effects and cell death mechanisms
  in BT-549 and MCF-10A cells.
caption: Validation of combination treatment effects and cell death mechanisms in
  BT-549 and MCF-10A cells. Effects of paclitaxel, cephalomannine, and their combination
  on cell viability in BT-549 and MCF-10A cells, and mechanistic investigation using
  pathway-specific inhibitors (A–F). Effect of paclitaxel, cephalomannine, and their
  combination at different concentrations on BT-549 cell viability (A). Effect of
  the same treatments on MCF-10A cell viability (B). Effect of the ROS scavenger NAC
  on cell viability under different treatments (C). Effect of the pyroptosis inhibitor
  Disulfiram on cell viability under different treatments (D). Effect of the apoptosis
  inhibitor Z-VAD-FMK on cell viability under different treatments (E). Effect of
  the necroptosis inhibitor Necrostatin-1 on cell viability under different treatments
  (F). P represents paclitaxel (P1 = 1 ng/mL); C represents cephalomannine (C1 = 1
  ng/mL). Cell viability was measured using the MTT assay after 48 h of treatment.
  Data are expressed as mean ± standard deviation (SD) from biological replicates
  (n = 5). *** p < 0.0001, *** p < 0.001, ** p < 0.01, * p < 0.05
