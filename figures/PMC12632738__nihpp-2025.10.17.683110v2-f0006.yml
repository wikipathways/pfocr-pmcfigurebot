figure_title: PAN-specific pathway and LR analysis
caption: (A) One-vs-all testing of MEs in PAN relative to the rest of the tumor. Circles
  marked “x” where FDR > 0.05. (B) Coefficients from mixed effect modeling of ME against
  IVY region assignment, ME change shown in relation to PAN level. “*” where FDR <
  0.05. (C) Top pathway terms for 5 most upregulated modules in the PAN. (D) Top drugs
  by significance of gene target enrichment for 5 most upregulated modules in PAN.
  (E) CellChat communication scores for top LR pairs whose spatial co-expression is
  associated with PAN. Note, as score is dependent on expression values, scoring is
  relative across cell type combinations and LR pairs. (F) T-values from lr-module
  regression specific to PAN LR pairs. Modules shown are differentially expressed
  in PAN. (G) Spatial plots of IVY region assignment and select LR coexpression and
  ME scores. (H) Network visualization of top 10 hub genes for the 5 most upregulated
  modules in PAN
article_title: Spatial transcriptomics of glioblastoma defines biologically and clinically
  significant reprogramming patterns across unique spatial microenvironments
