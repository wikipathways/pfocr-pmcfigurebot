figure_title: Signaling pathways regulating IL-10 expression in macrophages and DCs.
caption: Signaling pathways regulating IL-10 expression in macrophages and DCs. In
  macrophages and mDCs, the expression of IL-10 is primarily mediated by TLRs, particularly
  TLR2, TLR4, and TLR9. Upon TLR engagement, signaling cascades are activated via
  MYD88, which triggers downstream MAPK and NF-κB pathways. MAPKs, including ERK1/2
  and p38, regulate IL-10 expression through transcription factors, such as CREB,
  MSK1/2, and c-Fos. The PI3K/Akt pathway also modulates IL-10 expression. Metabolic
  reprogramming towards glycolysis influences IL-10 production in response to LPS
  stimulation. TIM-3 can enhance IL-10 expression in DCs via the TIM-3-BTK-STAT3 signaling
  axis
