caption: 'Graphic abstract of BPA-induced apoptosis, necroptosis and neurobehavioral
  deficient of brain of mature rats and the protective effect of ASX: it is proposed
  that BPA pass the cell membrane increase the ROS formation and cause lipid peroxidation
  (MDA) [36] this cause oxidative damage, depleting cellular antioxidants (GSH, GST,
  SOD &CAT), inhibition of AchE enzyme, increasing levels of neurotransmitters (dopamine,
  serotonin and norepinephrine) that responsible for anxiety behaviors [32]. ROS also
  cause DNA damage that activates p53 that declines anti-apoptotic Bcl-2 and enhances
  BAX that activate mitochondria to release cytochrome c then caspase-9 is activated
  that activates caspase-3 and then apoptosis process [44]. On the other hand, BPA
  induced increase of inflammatory cytokines that activates death receptors, activating
  RIPK1, RIPK3 and MLKL that activating programmed necrosis (necroptosis) [38]. Beside
  this RIPK1 extrinsic apoptosis pathway by activating FADD that in turn activates
  caspase cascade till caspase-3. ASX reverting this process by decreasing oxidative
  stress and inflammation [48]'
article_title: Astaxanthin ameliorates necroptosis through bisphenol-A exposure by
  regulating brain RIPK1/FADD/RIPK3/MLKL pathway in adult male rats
