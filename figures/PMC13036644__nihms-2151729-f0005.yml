figure_title: Accommodative eye vergence is stronger and less ON dominated in myopia
caption: '(A) Accommodative change in eye vergence (100% contrast minus baseline)
  measured in emmetropes (E in black) and myopes (M in green) by averaging the responses
  to light and dark stimuli. Each circle is one subject, error bars are standard errors,
  bars are means. Text labels at top: averages ± SD and p value from Wilcoxon test
  comparing medians.(B and C) Same as (A) for eye vergence measured at baseline and
  with 100% contrast.(C) Correlation between eye vergence measured at baseline and
  with 100% contrast. Text labels at the top report the linear equation and the goodness
  of fit (R2).(D) ON pathway dominance of accommodative eye vergence is reduced in
  myopia (measured at 25%–100% contrast). Same text labels as (A).(F–H) Same as (A)–(C)
  for pupil diameter.(I and J) Same as (D) and (E) for pupil diameter. All error bars
  are standard errors. Bold text indicates statistical significance'
article_title: Human accommodative visuomotor function is driven by contrast through
  ON and OFF pathways and is enhanced in myopia
