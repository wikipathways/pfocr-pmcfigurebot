figure_title: GO enrichment analysis of common predicted target genes of etoposide
  and curcumin.
caption: GO enrichment analysis of common predicted target genes of etoposide and
  curcumin. GO enrichment analysis was performed on the shared predicted target gene
  set of etoposide and curcumin to identify statistically overrepresented functional
  categories rather than experimentally validated pathway activation. Bar plots illustrate
  the most significantly enriched terms in BP, CC, and MF categories based on FDR-adjusted
  p-values (< 0.05). Enriched biological processes include positive regulation of
  apoptotic process, negative regulation of cell proliferation, response to drug,
  and cell cycle-related processes. Cellular component analysis revealed enrichment
  in cytoplasm, nucleus, mitochondrion, and membrane-related compartments, while molecular
  function analysis highlighted protein binding, kinase activity, transcription factor
  binding, and enzyme binding. The x-axis represents the number of genes associated
  with each GO term. These enrichment results reflect statistical overrepresentation
  within a computationally predicted target set and should therefore be interpreted
  as hypothesis-generating rather than as direct mechanistic evidence of pathway modulation
