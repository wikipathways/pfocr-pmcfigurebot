figure_title: Bulk RNA-seq shows dysregulation of neuronal migration pathways in Upf2cKO
  cortex
caption: '(A) PCA of gene expression values for control and Emx1-Upf2cKO bulk RNA-seq
  samples.(B) Volcano plot showing DEGs between control and Emx1-Upf2cKO samples.(C)
  Number of upregulated and downregulated DEGs.(D) GSEA plot of neuron migration signature
  (Gene Ontology [GO]: 0001764) in the Upf2cKO transcriptome.(E) Bar plot of fold-change
  of neuron migration genes (GO: 0001764) exhibiting significant expression changes
  in bulk RNA-seq (adjusted p < 0.05). Green and magenta bars represent genes with
  log2 fold change smaller than −1 and greater than 1, respectively. Red and blue
  arrowheads indicate genes related to Reelin-mediated signaling pathway (GO:0 038206)
  and microtubule (GO: 0005874), respectively.(F) The intersection between upregulated
  genes in Emx1-Upf2cKO cortices, upregulated genes in Upf2cKO NPCs, genes with UPF1
  eCLIP-seq peaks, and genes whose ChIP-seq peaks were enriched in the promoters of
  genes downregulated in both Emx1-Upf2cKO cortices and NPCs.(G) Left: TPM values
  of Ino80 in control and Upf2cKO samples from bulk RNA-seq data of E18.5 Emx1-cre
  cortices. Right: TPM values of Ino80 in control and Upf2KO NPCs.(H) UCSC Genome
  Browser track of Ino80 gene locus shown with the coverage of UPF1 eCLIP-seq reads
  (IN: input, IP: immunoprecipitated) in NPCs. Reads mapped to plus and minus strands
  are shown. The pink arrowhead indicates a strong peak of eCLIP-seq signals at the
  3′ UTR locus.See also Figures S2 and S5'
article_title: Nonsense-mediated mRNA decay orchestrates neuronal migration and cortical
  lamination while modulating Reelin and ciliary gene regulatory networks
