caption: Tumor cells produce lactate through glycolysis, resulting in local acidification,
  further affecting tumor growth and spread. As a signaling molecule, lactate regulates
  tumor growth, invasion, metastasis and therapeutic response. Lactylation participates
  in various activities, affects the function of various immune cells in the tumor
  microenvironment and regulates the biological behavior of tumors. α-KG, α-ketoglutarate;
  DC, dendritic cell; GLUD, glutamate dehydrogenase; HDAC, histone deacetylase; Kla,
  lysine lactylation; LDHA, lactate dehydrogenase A; NK, natural killer; PDH, pyruvate
  dehydrogenase; PPP, pentose phosphate pathway; TCA, tricarboxylic acid; TAM, tumor-associated
  macrophage; Treg, regulatory T
