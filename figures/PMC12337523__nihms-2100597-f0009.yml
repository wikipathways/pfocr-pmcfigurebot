figure_title: Proteomic analysis of kidney tissue under different treatment and transplantation
  conditions
caption: 'Proteomic profiling was performed on kidney samples from four groups: Sham,
  NaHCO3 treatment alone (BC), kidney transplantation alone (KTX), and NaHCO3 treatment
  followed by transplantation (BCKTX) (n = 3 per group). (A) Volcano plot illustrating
  differentially expressed proteins, with upregulated proteins (log₂FC > 1) shown
  in red and downregulated proteins (log₂FC < −1) shown in blue. (B) Heatmap displaying
  the top 80 most significantly regulated proteins across all groups. (C, D) Pathway
  enrichment analyses of differentially expressed proteins, highlighting the biological
  processes and signaling pathways impacted by transplantation and NaHCO3 treatment'
