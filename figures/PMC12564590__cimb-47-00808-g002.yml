figure_title: Molecular mechanism of 17β-estradiol degradation by immobilized laccase
  on silver nanoparticles and its impact on apoptosis in hormone-sensitive MCF-7 breast
  cancer cells.
caption: Molecular mechanism of 17β-estradiol degradation by immobilized laccase on
  silver nanoparticles and its impact on apoptosis in hormone-sensitive MCF-7 breast
  cancer cells. Immobilized laccase on silver nanoparticles (AgNPs) catalyzes the
  degradation of 17β-estradiol, reducing its availability for estrogen receptor (ER)
  activation. This leads to downregulation of the PI3K/Akt signaling pathway, which
  in turn decreases the expression of anti-apoptotic BCL-2 and pro-survival NF-κB,
  while simultaneously upregulating the tumor suppressor gene p53. The resulting shift
  in gene expression promotes apoptosis and inhibits proliferation, migration, and
  invasion of hormone-sensitive MCF-7 breast cancer cells
