figure_title: Comparison of fecal metabolites of mice colonized with neonatal stool
caption: A. PCA plot of fecal metabolite signals identified from mice colonized with
  VD, CS, or CS+VS neonate stool B. Volcano plots show metabolites that were differentially
  abundant in pairwise comparisons of groups as indicated. Statistical significance
  was assessed using Student’s t-test and metabolites with a log2 fold change >1 and
  adjusted p < 0.05 are labeled and colored (with a log2 fold change > 0.5 only colored)
  based on pathways or molecular families as shown in the key. C. Abundances of metabolites
  in the tryptophan pathway were compared between VD and CS mice using Student’s t-test.
  For each metabolite, log2 fold change and p-value were calculated and mapped as
  shown. Red and blue circles indicate increases and decreases in VD mice in comparison
  to CS mice respectively. The size of each circle reflects statistical significance.
  D-E. z-scale values of histamine and acetylcholine (D) and arginine cycle metabolites
  (E). Each dot represents a mouse and is coded as shown in the key. Statistical signifcance
  was assessed by one-way ANOVA with Tukey’s multiple comparison test and only statistically
  signficant comparisons are shown (not shown, p > 0.05; * p < 0.05; ** p < 0.01;
  ***p < 0.001; ****p < 0.0001)
