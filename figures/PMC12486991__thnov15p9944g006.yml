figure_title: Possible approaches for targeting GM-CSF+ Th cells.
caption: 'Possible approaches for targeting GM-CSF+ Th cells. This figure outlines
  a three-stage framework for therapeutically targeting the GM-CSF⁺ Th cell pathway,
  from initial development to final effector function. Stage 1 (Induction & Differentiation):
  This stage can be targeted by blocking the initial cytokine signals (e.g., IL-2,
  IL-7, IL-15) that drive the differentiation of naive T cells into the GM-CSF⁺ lineage.
  Stage 2 (Amplification & Stabilization): Intervention at this stage focuses on disrupting
  the transcriptional machinery and autocrine feedback loops (e.g., NLRP3/IL-1β) that
  reinforce and stabilize the pathogenic cell state. Stage 3 (Effector Function &
  Tissue Damage): The final stage offers therapeutic opportunities to neutralize the
  key effector molecule, GM-CSF (e.g., with Otilimab), or its receptor (e.g., with
  Mavrilimumab), thereby preventing the activation of myeloid cells and subsequent
  inflammatory tissue damage. Created in BioRender. Meng, X. (2025) https://BioRender.com/o6m32us'
