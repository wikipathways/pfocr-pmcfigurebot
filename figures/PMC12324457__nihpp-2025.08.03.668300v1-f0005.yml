figure_title: Transcriptomic profiling of EN1033
caption: THP1 cells were stimulated with R848 (10 μM) and treated with DMSO vehicle
  or EN1033 (50 μM) for 24 h, after which RNA from cells was subjected to RNA sequencing
  and quantification. Shown in (a) are significantly altered transcripts with EN1033
  treatment, with representative IRF5 and IRF8 target genes designated with gene names.
  Pathway analysis from significantly downregulated genes is shown in (b). Full data
  are presented in Table S5. Data are from n=3 biologically independent replicates
  per group. P-values less than 1e-500 were capped at 1e-500
