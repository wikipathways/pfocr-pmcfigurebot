figure_title: Chromatin landscape in hESC and decidualized hESC assessed through H3K27ac
  HiChIP
caption: (A) H3K27ac HiChIP protocol in hESC treated with Veh or EPC. Raw contact
  matrices for Veh or EPC samples (n=2 merged independent samples per matrix) and
  significant differential loop interactions around genes of interest. Labeled black
  lines indicate genes of interest from transcription start site to transcription
  end site. (B) Pie charts showing the percentage of loops with at least one anchor
  at the promoter of a gene (orange) in EPC-activated and repressed loops. (C) Comparison
  between genes with a differential promoter-targeting loop in hESC and genes differentially
  expressed in response to EPC from previously published RNA-seq (GSE205481). (D)
  Heatmap generated via unsupervised clustering of genes differentially expressed
  in response to EPC that contain an EPC-repressed promoter targeting loop or (E)
  EPC-activated promoter targeting loop. (F) Select pathways from IPA pathway analysis
  of 141 genes differentially expressed in response to EPC with a differential promoter-targeting
  loop. EPC = 10 nM E2, 1 uM medroxyprogesterone acetate, and 100 uM cAMP; IPA = ingenuity
  pathway analysis
