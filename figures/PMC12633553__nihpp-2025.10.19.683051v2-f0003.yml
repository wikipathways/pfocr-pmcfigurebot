caption: (A-B) Percentage of hTSC (A) or hESC (B) positive for DNMT1 after nucleofection
  with CRISPR/Cas9 and sgRNA targeting DNMT1 (DNMT1 KO) or non-targeting sgRNA (Non-target)
  (C) Immunofluorescent staining for DNMT1 in a bulk population of hTSCs 4 to 10 days
  after nucleofection with CRISPR/Cas9 and sgRNA targeting DNMT1. hTSCs that underwent
  nucleofection with a non-targeting sgRNA are shown as a control.(D) Global CpG methylation
  in bulk population of hTSC targeted with CRISPR/Cas9 and sgRNA targeting DNMT1 (DNMT1
  KO) or non-targeting sgRNA (Non-target)(E) Volcano plot comparing expression of
  hTSCs 7 days after targeting with DNMT1 sgRNA compared with cells nucleofected with
  non-targeting sgRNA.(F) Gene ontology analysis of genes upregulated in DNMT1 KO
  bulk population hTSCs four days after nucleofection relative to cells undergoing
  control nucleofection.(G) Volcano plot comparing expression of hESCs 2 days after
  targeting with DNMT1 sgRNA compared with cells nucleofected with non-targeting sgRNA.(H)
  GSEA analysis comparing expression of P53 pathway genes in day 2 DNMT1 KO hESCs
  and controls.(I) Percentage of WT and TP53−/− hESCs positive for DNMT1 between 2
  and 14 days after nucleofection with DNMT1 sgRNA.(J) Volcano plot comparing expression
  of hESCs 4 days after targeting with DNMT1 sgRNA compared with cells nucleofected
  with non-targeting sgRNA.(K) Gene ontology analysis of genes upregulated in TP53−/−
  DNMT1 KO hESCs four days after nucleofection relative to TP53−/− hESCs undergoing
  control nucleofection (n=2 replicates).(L,M) Percentage of transposon-derived reads
  in hTSC (L) and TP53−/− hESCs (M) after nucleofection with sgRNA targeting DNMT1
  or non-targeting sgRNA (n=2 replicates per genotype and timepoint)
