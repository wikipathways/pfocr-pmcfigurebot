figure_title: Gene set enrichment analysis of significant differential gene expression.
caption: Gene set enrichment analysis of significant differential gene expression.
  (A) The R package cnetplot (plot linkages of genes and enriched gene ontology pathways)
  shows the top 3 biological process pathways with significantly down-regulated genes
  (blue dots). (B) The Gene Set Enrichment Analysis (GSEA) plot displays significant
  (p.adjust < 1.713 × 10−8) enrichment scores (y-axis) peaking at the end of the ranked
  (x-axis) gene list from 3 biological process-related pathways (listed in the panel).
  (C) The boxplot shows expression levels of top genes related to mitochondrial functions
  and extracellular matrix remodeling between exertional rhabdomyolysis (ER) cases
  and healthy controls. The y-axis, labeled with Log2(TPM), refers to the logarithm
  base 2 transformation of Transcripts Per Million (TPM) values. (D) The GSEA plot
  presents significant (p.adjust < 1.047 × 10−8) enrichment scores (y-axis) of 2 molecular
  function-related pathways (listed in the panel) peaking at the end of the ranked
  (x-axis) gene, and the extracellular matrix structural constituent network peaking
  at the beginning of the ranked (x-axis) gene
