figure_title: EPSs activate angiogenic pathways.
caption: EPSs activate angiogenic pathways. After binding VEGFR (vascular endothelial
  growth factor receptor) and FGFR (fibroblast growth factor receptor), EPSs initiate
  downstream pathways that converge on the modulation of transcription factors and
  the expression of genes involved in endothelial cell function and vessel formation.
  Several EPSs can interact with VEGFR-2, triggering the activation of the SOS response,
  which stimulates the Ras-MEK-ERK cascade. ERK1/2 activates transcription factors,
  such as Elk-1, leading to the expression of immediate–early genes, including c-jun
  and c-fos. This activation promotes the proliferation and differentiation of endothelial
  cells. Parallel signaling through p38 MAPK also contributes to transcriptional activation
  and cell survival. Glucan-type EPSs engage VEGFR and activate the PI3K-Akt-mTOR
  signaling pathway. Akt phosphorylation leads to mTOR activation, which promotes
  cell growth and modulates the activity of NF-κB and AP-1, thereby facilitating the
  transcription of genes involved in angiogenesis. Sulfated EPSs interact with FGFR,
  initiating a Ras-dependent cascade that activates MEK and subsequently ERK1/2. In
  the cytoplasm, ERK1/2 phosphorylates HDAC5 (histone deacetylase 5), leading to its
  inactivation and allowing the transcription factor MEF2 (myocyte enhancer factor
  2). MEF2 promotes the expression of specific target genes critical for endothelial
  cell migration, differentiation, and vascular remodeling
