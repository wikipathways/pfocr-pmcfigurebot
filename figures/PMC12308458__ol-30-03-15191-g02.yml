figure_title: Key genes associated with p53-WT and TP53-MT in patients with prostate
  cancer.
caption: Key genes associated with p53-WT and TP53-MT in patients with prostate cancer.
  (A) Top mutated genes between the high and low TP53 expression groups in the TCGA-PRAD
  cohort. (B) Top mutated driver genes with TP53 as hub gene in the TCGA-PRAD cohort.
  GSEA was performed using the R programming 3.3.4. packages ‘clusterProfiler’ based
  on the top mutated driver genes between the (C) TP53-MT and TP53-WT groups, as well
  as between the (D) high and low TP53 expression groups in the TCGA-PRAD cohort.
  KEGG pathway enrichment analysis demonstrated that significantly enriched pathways
  included (E) ‘Ribosome’, (F) ‘Herpes simplex virus 1 infection’ and (G) ‘Transcriptional
  misregulation in cancer’, which were potentially associated with TP53 mutations
  or altered expression. WT, wild-type; TP53, tumor protein 53; MT, mutated; TCGA,
  The Cancer Genome Atlas; PRAD, prostate adenocarcinoma; GSEA, gene set enrichment
  analysis; KEGG, Kyoto Encyclopedia of Genes and Genomes; TSG, tumor suppressor gene;
  ATM, ataxia telangiectasia mutated; MDM2, mouse double minute 2 homolog; CDKN2A,
  cyclin-dependent kinase inhibitor 2A; CCND1, cyclin D1; CDKN1A, cyclin-dependent
  kinase inhibitor 1A; FBXW7, F-Box and WD repeat domain containing 7; CCNE1, cyclin
  E1; RB1, retinoblastoma 1; E2F3, E2F transcription factor 3; cGMP, cyclic guanosine
  monophosphate; PKG, protein kinase G; PPAR, peroxisome proliferator-activated receptor
