figure_title: Multifocal HCC in a patient with HBV/HDV/alcohol-related cirrhosis (BCLC
  stage B) treated with DEB-TACE using BioPearl (Tokyo, Japan).
caption: Multifocal HCC in a patient with HBV/HDV/alcohol-related cirrhosis (BCLC
  stage B) treated with DEB-TACE using BioPearl (Tokyo, Japan). (A,B) Pre-treatment
  CT shows two subcapsular lesions (~3 cm) in segments VI and IV with (A) arterial
  hyperenhancement and (B) venous washout (red circles), consistent with HCC. (C,D)
  Emboguide (Version 1.2.1, Philips) software and CBCT mapping of the arterial pathway
  from the right hepatic artery to the target lesion in segment IV. (E) Angiographic
  image showing the lesion in segment IV supplied by the left hepatic artery. (F,G)
  Emboguide (Philips) software and CBCT mapping of the right hepatic artery pathway
  to the lesion in segment VI before chemoembolization, showing enhancement of the
  target area. (H,I) Post-treatment CT in (H) arterial and (I) venous phases demonstrates
  hypodense areas (~3.5 cm) in segments VI and IV, consistent with treated lesions
  (red arrows)
