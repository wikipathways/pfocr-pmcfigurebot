figure_title: SATB1 regulates the epigenetic landscape of the TPRO subset
caption: a, PCA of ATAC-seq data generated from sgCtrl (control; orange) and sgSatb1
  (SATB1-deficient; blue) P14 cells sorted on day 21 p.i. of LCMV Cl13 (n = 4 in each
  group). b, Venn diagram showing the overlapping and condition-specific chromatin
  accessible regions identified by occupancy analysis. c, Dot plot depicting the most
  significantly enriched motifs in sgCtrl and sgSatb1 peak sets identified in the
  occupancy analysis in panel b. Dot size shows the percentage of condition-specific
  sequences that contain the motifs. The dot color indicates the normalized enrichment
  score. d, Heatmap showing unsupervised clustering of differentially accessible chromatin
  regions (log2FoldChange >1.5) between sgSatb1 and sgCtrl1. e, KEGG pathway analysis
  showing the top 9 upregulated and top 9 downregulated pathways in the differentially
  accessible chromatin regions presented in Panel d. f, GSEA analysis depicting the
  indicated signatures’ enrichment in the differentially accessible chromatin regions
  presented in panel d. g-i, Heatmaps showing accessibility for the specified population
  at the CD8+ T cell subset-specific enhancer regions identified through H3K27ac CUT&TAG
  (GSE149769; GSE149810). g, TPRO enhancer ATAC peaks identified in TPRO subset, sgCtrl,
  and sgSatb1 P14 cells. h, TEFF enhancer ATAC peaks identified in TEFF subset, sgCtrl,
  and sgSatb1 P14 cells. i, TEXH enhancer ATAC peaks identified in TEXH subset, sgCtrl,
  and sgSatb1 P14 cells. j-k, Sequencing tracks of ATAC (sgCtrl, sgSatb1, TPRO) and
  CUT&TAG (H3K27ac and H3K4me3 of TPRO subset) at the indicated gene locus are displayed
  using the WashU Epigenome Browser. The numbers at the top represent chromatin position
  in base-pairs. TSS indicates the transcription start site. Red bars highlight the
  differentially accessible peaks between sgCtrl and sgSatb1
