figure_title: SR1 Diminishes Intracellular ROS and Regulates Metabolic Pathways via
  Altering AHR-Protein Interactions
caption: a. Representative pictures (from 3 independent experiments) showing the distribution
  of AHR in vehicle or SR1 treated HUVECs. Mitochondria was visualized by Mitotracker.b.
  Western blot showing nuclear and cytosolic AHR in vehicle or SR1 treated HUVECs.
  GAPDH and lamin A/C as cytosolic and nuclear marker proteins.c. Quantification of
  Fig. 4B. Data represent mean ± s. d. p values, two-way ANOVA. (n=3 experiments).d.
  GO Biological Process (GOBP) pathway analysis for up-regulated AHR binding proteins
  in HUVECs treated with SR1. Pathways with multiple comparison adjusted FDR<0.05
  are shown.e. GO Biological Process (GOBP) pathway analysis for down-regulated AHR
  binding proteins in HUVECs treated with SR1. Pathways with multiple comparison adjusted
  FDR<0.05 are shown.f. Relative LDH activity in HUVEC lysate with SR1 treatment compared
  to untreated controls. Data represent mean ± s. d. p values (n=4 experiments).g.
  Representative flow cytometry analysis of ROS level in vehicle or SR1 treated HUVECs.h.
  Quantitation of ROS level in vehicle or SR1 treated HUVECs. Data represent mean
  ± s. d. p values, pairwise two-tailed t-test. (n=9 independent experiments).i. Cell
  expansion of HUVECs in response to SR1 and NAC. For each condition, 2,000 ECs were
  plated and cultured for 8 days. Data represent mean ± s. d. p values, RM one-way
  ANOVA with the Geisser-Greenhouse correction, Tukey’s multiple comparisons test,
  with individual variances computed for each comparison. (n=8 independent experiments)
