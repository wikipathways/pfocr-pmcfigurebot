figure_title: KEGG pathway overrepresentation analysis and core gene expression differences.
caption: 'KEGG pathway overrepresentation analysis and core gene expression differences.
  (A) Dot plot comparing KEGG pathway enrichment from differentially expressed genes
  (DEG; FDR < 0.05) in response to AET (green) and AET+MET (red) relative to sedentary
  controls. Each row represents a KEGG pathway enriched in at least one condition.
  Dot color reflects the condition in which the pathway was significantly enriched,
  with gray indicating no significant enrichment. Dot size corresponds to the number
  of DEG contributing to pathway enrichment. (B) Heatmap of z-scored expression values
  for 41 core enrichment genes that were significantly differentially expressed between
  AET and AET+MET. Genes are ordered by hierarchical clustering. Overlaid horizontal
  bar plots show the log2 fold change of each gene in AET (green) and AET+MET (red)
  compared to sedentary controls. (C) Bar plot of TMM-normalized log2 counts per million
  (CPM) for individual genes related to mTORC1 and FOXO1 signaling. Genes shown include
  Ddit4, Itfg2, Eif4ebp1, Eif3m, Cebpb, Cebpd, Acvr1b, and Arrdc2. Bars represent
  group mean expression for SED (gray), AET (green), and AET+MET (red) groups. Statistical
  significance is based on FDR-adjusted p-values from the full RNA-Seq differential
  expression analysis. *P<0.05 vs SED; #P<0.05 vs. AET'
