figure_title: Obtaining of CAF-like cells.
caption: Obtaining of CAF-like cells. (A) The morphological images of NFs and CAF-like
  cells, scale bars, 50 µm. CAF-like cells were treated with HOS-CM, while NFs were
  cultured in MEM. (B) Relative mRNA expression of CAF biomarkers in WI-38 and HELF
  cells by q-PCR, the indicated results represent the mean ± SD (n=4), * P < 0.05,
  ** P < 0.01, *** P < 0.001. WI-38 and HELF cells were treated with HOS-CM and 143B-CM,
  while the control group was the MEM group. (C) The protein level of CAF biomarkers
  in WI-38 and HELF cells by western blotting analysis. (D) The expression of α-SMA
  in normal WI-38 and CAF-like cells were assayed by immunofluorescence staining,
  scale bars, 100 µm. (E) Proliferation ability of NFs and CAF-like cells by CCK-8
  assay was displayed as OD value at 450 nm. (F) Migration ability of NFs and CAF-like
  cells were analyzed by wound-healing assays and expressed as area recovery rate,
  scale bar, 200 µm. (G) Relative mRNA expression of inflammatory factors in WI-38
  by q-PCR, the indicated results represent the mean ± SD (n=3), * P < 0.05, ** P
  < 0.01, *** P < 0.001. (H) The protein level of IL-6/STAT3 and TGF-β receptor pathways
  in WI-38 by western blot analysis
