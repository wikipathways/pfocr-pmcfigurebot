figure_title: IUGR results in a sex-specific decrease in ETC gene and protein expression
  at P14.
caption: IUGR results in a sex-specific decrease in ETC gene and protein expression
  at P14. A) All 5 complexes of the ETC had either measured decreases (green) in genes
  or had predicted inhibition (blue) of genes and/or proteins by Ingenuity Pathway
  Analysis based on observed expression changes in our gene data set. B) Expression
  of genes from ETC Complexes I-V (ndufa1, uqCR10, cox4i2, ATP5e, and Shdb) from IUGR
  vs control (n=4). Decreased Complex I ndufa1 expression in Control F vs IUGR F,
  *p=0.039; Control F vs IUGR M, ***p=0.0007; Control F vs Control M, *p=0.01; IUGR
  F vs IUGR M, *p=0.02. Decreased Complex IV cox4i2 expression in IUGR F vs Control
  M, **p=0.004. Decreased Complex V expression in Control F vs IUGR F, *p=0.018; Control
  F vs IUGR M, ***p =0.006; Control F vs Control M, **p=0.006; IUGR F vs IUGR M, *p=0.02.
  C) Decreased Complex I NDUFB8 protein expression in Control F vs IUGR M, **p=0.002;
  IUGR F vs IUGR M, *p=0.03, Control F vs Control M, **p=0.005). Decreased Complex
  V α-subunit protein expression in Control F vs IUGR M, **p=0.004; IUGR F vs IUGR
  M, *p=0.045; Control F vs Control M, *p=0.02. D) No difference in densitrometric
  ratio of VDAC to total protein between controls and IUGR (n=5-6, p=0.75)
