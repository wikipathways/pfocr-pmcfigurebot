figure_title: Loss of NUDT5 causes increased de novo purine synthesis in the presence
  of salvageable adenosine
caption: (A) Quantification of fractional abundance of heavy isotope labeled metabolites
  in WT, NUDT5KO, and HPRT1KO cells supplemented with 50 µM 15N5-labeled adenosine
  (ADO) for 24 h (n = 2, mean ± SD). (B) Schematic overview of the purine de novo
  synthesis and salvage pathways indicating labeled precursors used in isotope tracing
  experiments. WT, NUDT5KO, MTHFD1K56R and MTHFD1K56RNUDT5KO cells were grown in DIA
  with 1 mM labeled formate or with 1 mM labeled formate and 50 µM labeled adenosine
  (ADO) for 24 h. (C) Peak areas of mass spectrometry signals for metabolites AICAR,
  IMP, AMP and GMP, labeled by detected isotope indicating metabolites derived from
  purine de novo synthesis in shades of red and those derived from salvaged adenosine
  in shades of blue. (D) Peak areas corresponding to dA and dG obtained from hydrolyzed
  DNA, colored as in panel (C). (E) Quantification of fractional abundances of most
  abundant purine de novo synthesis-derived isotopologs from panel (C) (mean ± SD)
article_title: A non-enzymatic role of Nudix hydrolase 5 in repressing purine de novo
