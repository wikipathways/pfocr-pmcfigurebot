figure_title: The expression of key proteins associated with the EMT pathway following
  treatment with shell extract was investigated by Western blotting.
caption: 'The expression of key proteins associated with the EMT pathway following
  treatment with shell extract was investigated by Western blotting. Representative
  immunoblot images showing the protein expression levels of MMP2, MMP9, N-cadherin,
  and GAPDH (as a loading control) in both untreated and shell-treated cells are provided
  (A). Protein band intensities were quantitated and normalized against GAPDH to demonstrate
  the influence of shell extract on the abundance of these target proteins (B). Data
  in the histograms were presented as the mean ± SD from three independent experiments
  (n = 3). Statistical analysis was performed using a paired t-test compared to untreated
  control cells. Asterisks indicate p-values: *, p < 0.05'
