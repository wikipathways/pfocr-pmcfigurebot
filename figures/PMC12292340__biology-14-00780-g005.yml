figure_title: RNA-seq and differential gene enrichment analysis results.
caption: RNA-seq and differential gene enrichment analysis results. (A) A volcano
  plot illustrating the differential gene expression following RNA sequencing in HCT15
  cells with stable PAQR3 knockdown compared with the control group. (B) A heat map
  comparing the expression profiles of differential genes between the PAQR3 knockdown
  and control groups. (C) KEGG classification diagram summarizing the pathways associated
  with differential genes that were impacted by PAQR3 knockdown. The red dashed frame
  indicates the enrichment of the PI3K-AKT signaling pathway. (D) A KEGG bubble plot
  highlighting the enrichment of differential genes that were affected by PAQR3 knockdown.
  (E) A GSEA plot demonstrating the biological functions that were influenced by PAQR3
  knockdown
