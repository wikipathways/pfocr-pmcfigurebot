figure_title: Regulatory mechanism of the Wnt/β-catenin pathway in bone metabolism.
caption: 'Regulatory mechanism of the Wnt/β-catenin pathway in bone metabolism. Wnt
  proteins bind to Frizzled receptors and low-density lipoprotein receptor-related
  proteins 5/6 (LRP5/6), activating the β-catenin signaling cascade. This pathway
  promotes bone marrow mesenchymal stem cell differentiation toward osteoblasts while
  enhancing osteogenic activity. The inhibitory molecules DKK1 and SOST antagonize
  Wnt signaling by blocking LRP5/6 coreceptor engagement. DKK1, Dickkopf-1; SOST,
  sclerostin; LRP5/6, low-density lipoprotein receptor-related protein 5/6; GSK-3β,
  glycogen synthase kinase-3β. TCF/LEF, T-cell factor/lymphoid enhancer-binding factor.
  The arrows indicate the direction of change: ↑, increased expression/activity; ↓,
  decreased expression/inhibition'
