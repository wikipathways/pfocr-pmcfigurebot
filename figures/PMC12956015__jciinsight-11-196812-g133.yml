figure_title: Bleomycin-induced lung inflammation impairs the CNP/GC-B signaling pathway
  in resident lung myofibroblasts
caption: (A–D) Schematic illustrations of the CNP/GC-B/cGMP signaling cascade (A)
  and of the animal protocol (B) used for these studies in control (Npr2fl/fl) mice
  3 days (C) and 7 days (D) after bleomycin or vehicle administration. Lungs were
  digested with dispase and the isolated pulmonary PDGFR-α+ fibroblasts were enriched
  for immunoblot studies. Due to low cell yield, eventually, lung fibroblasts from
  2 mice had to be combined for target protein determinations. The expression levels
  of α-SMA, GC-B, cGKI, PDE2A, PDE3A, and NPR-C were normalized to β-tubulin and calculated
  as the average value from vehicle-treated (saline-treated) mice (n = 3–4 samples
  from 6–8 mice per group). Significance was tested by Student’s unpaired t test.
  *P < 0.05 versus vehicle
