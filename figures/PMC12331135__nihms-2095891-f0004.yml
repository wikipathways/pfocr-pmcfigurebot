figure_title: ALSP astrocytes exhibit a stress-response signature
caption: a, UMAP plot of astrocytes (re-cluster from the Astro cluster in Fig. 1a)
  from control individuals (N = 13) and individuals with ALSP (N = 6); n = 6,425 nuclei
  in control individuals, and n = 13,494 nuclei in individuals with ALSP. b, UMAP
  plots of expression of feature genes in the astrocyte subsets. c, Donut plots showing
  nuclei distribution of each astrocyte subset in control or ALSP samples. d, Volcano
  plot depicting DEGs in ALSP versus control astrocytes. e, IPA of pathways predicted
  to be activated or inhibited in ALSP astrocytes. f, Violin plots showing the gene-set
  scores of upregulated DEGs derived from different neurodegenerative diseases (ALSP,
  Alzheimer’s disease and multiple sclerosis) in control and ALSP astrocytes. g, Venn
  diagram of overlapping genes commonly upregulated in ALSP astrocytes and astrocytes
  from human Alzheimer’s disease and multiple sclerosis datasets. h, Heat map depicting
  Pearson correlation coefficients of the top 20 ligands driving the ALSP astrocyte
  signature predicted by NicheNet. i, Circos plot showing ligand–target interactions
  predicted by NicheNet. The orange portion represents targets expressed by astrocytes.
  The bottom half of the circle shows the predicted ligands expressed in other cell
  types. The ligands are catalogized as general (purple) if not expressed by only
  one cell type. j, Violin plots showing APOE expression in the Micro cluster from
  control individuals and individuals with ALSP. P values were determined by two-sided
  Wilcoxon rank-sum test. k, Violin plots showing IL1R1 expression in astrocytes from
  control individuals and individuals with ALSP. P values were determined by two-sided
  Wilcoxon rank-sum test
