figure_title: Dual roles of endo-siRNA in regulating IPR gene expression
caption: (A) Enrichment analysis for AGO-associated sRNAs in pals-22(pig26) differentially
  expressed siRNAs. Endo-siRNA-associated AGOs are divided into four clusters.1(B)
  Overview of the 26G endo-siRNA pathway.(C) Interactions between PALS-22 and RRF-3
  in transgene silencing. n ≥ 25. Statistical significance was determined by Kruskal-Wallis
  test followed by pairwise Wilcoxon rank-sum tests. ****q ≤ 0.0001.(D) Venn diagram
  showing the overlap between 80 canonical IPR genes and genes upregulated in pals-22(pig26)
  and rrf-3(pk1426) mutants compared with wild type. DESeq2 q < 0.1.(E) Hierarchical
  clustergram plot visualizing the expression of IPR genes in wild type, rrf-3 (pk1426),
  rrf-3(pk1426); pals-22(pig26), and pals-22(pig26) using Euclidean distance metric
  and average linkage.(F) Venn diagram showing the overlap between 80 canonical IPR
  genes and genes downregulated in rrf-3(pk1426); pals-22(pig26) double mutants compared
  with pals-22(pig26) single mutants. DESeq2 q < 0.1.(G) Examples of IPR genes upregulated
  in rrf-3 (pk1426) compared with wild type but downregulated in rrf-3(pk1426); pals-22(pig26)
  compared with pals-22(pig26). RLE normalized mRNA read counts are shown. For (C)
  and (G), error represents mean ± SD. See also Figure S4 and Data S2
