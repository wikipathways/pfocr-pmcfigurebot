caption: TGF-β signalling pathway in basal subtype with prognostic implications. The
  TGF-β signalling pathway is differentially expressed in the basal subtype and stratifies
  prognosis according to the WWOX/HIF1A ratio. Good prognosis tumours show higher
  expression of genes involved in oxidative metabolism and tumour suppression. In
  the figure, yellow indicates good prognosis, pink indicates poor prognosis, and
  green indicates genes with unchanged expression
