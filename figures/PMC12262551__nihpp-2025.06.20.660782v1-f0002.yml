figure_title: Dampening Pf-DMS synaptic transmission causes amotivation
caption: '(A) Schematic of the injection paradigm.(B) Histologic verification of injection
  sites in the DMS (AP +0.74 to +0.14 mm from bregma) and Pf (AP −2.18 to −2.46).
  Circles are virus expression from individual mice.(C) Mice injected with the DREADD
  agonist Compound 21 (C21; blue) lever pressed less than vehicle-injected mice (black)
  in the PR+1 task (left; two-way repeated measure (RM) ANOVA, **p = 0.009) and in
  the PR+4 task (right; two-way RM ANOVA, *p = 0.03).(D) The average difference ratio
  between vehicle and C21 injection was −0.22 ± 0.07 in the PR+1 task performance
  and −0.19 ± 0.07 in the PR+4 performance. These ratios were significantly different
  from a theoretical mean of 0 (one-sample t test for PR+1, **p = 0.007; for PR+4,
  *p = 0.01).(E) The number of rewards earned on the PR+1 (left) and PR+4 (right)
  tasks was lower with C21 injection compared to vehicle (two-way RM ANOVA for PR+1,
  **p = 0.006; for PR+4, **p = 0.009).(F) Left: There were significantly fewer lever
  presses in the FR1 choice task after C21 injection compared to vehicle (two-way
  RM ANOVA, *p = 0.02). Right: There was significantly higher ingestion of freely
  available standard rodent chow in the FR1 choice task after C21 injection compared
  to vehicle (two-way RM ANOVA, *p = 0.02).(G) There was no difference in the number
  of lever presses (left) or the rewards earned (right) on the RR task between C21
  and vehicle injection (two-way RM ANOVA for lever presses, p = 0.16; for rewards
  earned, p = 0.07).(H) Mice preferred SCM over standard rodent chow when both were
  freely available regardless of injection type (three-way ANOVA, ****p < 0.0001).
  There was no difference in the amount of SCM consumed based on injection type (Tukey’s
  multiple comparisons, p = 0.97).(I) Schematic of the recording configuration.(J)
  In mice expressing hM4Di in the Pf-DMS pathway, bath application of C21 decreased
  the evoked amplitude of Pf-MSN EPSCs (blue), whereas bath application of artificial
  cerebrospinal fluid (ACSF) did not (black). Shaded area depicts the time of drug
  or ACSF wash.(K) Left: The average Pf-MSN EPSCs in response to ACSF and C21 wash
  were significantly different (unpaired t test, **p = 0.005). The data analyzed are
  from the final 5 min of the experiment. The response to ACSF wash was not different
  from baseline (one-sample t test, μ = 100, p = 0.89). The response to C21 wash was
  different from baseline (one-sample t test, μ = 100, ##p = 0.003). Right, top: Representative
  traces showing the decrease in amplitude after C21 application (2) compared to baseline
  (1). Right, bottom: Representative traces showing no difference in EPSC amplitude
  after ACSF application and at baseline (4 and 3, respectively). The numbers 1–4
  correspond to the timepoints labeled in (J).(L) Schematic of the experimental design
  depicting a WT mouse with no intracranial viral injections.(M) In the absence of
  DREADDs, injection of C21 did not alter performance on PR+1 (left; two-way RM ANOVA,
  p = 0.33) or PR+4 (right; two-way RM ANOVA, p = 0.74).(N) The average difference
  ratio in performance between vehicle and C21 injection was 0.09 ± 0.13 for PR+1
  and 0.006 ± 0.09 for PR+4. These ratios were not different from a theoretical mean
  of 0 (one-sample t test for PR+1, p = 0.51; for PR+4, p = 0.94).(O) Mice injected
  with vehicle or C21 preferred SCM over food chow when both were readily available
  (three-way ANOVA, ****p < 0.0001). There was no difference in the amount of SCM
  consumed based on injection type (Tukey’s multiple comparisons, p = 0.11). The animal’s
  sex affected food preference (three-way ANOVA, *p = 0.02).All data shown are mean
  ± SEM with individual data points overlaid in (C–H), (K), (M–O).Unless noted, there
  were no sex differences.n = the number of cells/number of mice.Lightning bolt (I)
  represents electrical stimulation. Circles (K, right) represent stimulus artifacts.
  n.s.: not significant.See Figure S2 for additional electrophysiology measures of
  Pf neurons'
