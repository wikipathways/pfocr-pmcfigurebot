figure_title: Spatially distinctive DC populations in LPS-treated mouse spleen
caption: '(A) Differential protein expression between the DC inside versus outside
  groups. Proteins upregulated in the DC inside group are highlighted in red, while
  those upregulated in the DC outside group are shown in blue. (B) GO enrichment pathway
  analysis of biological pathways differentially regulated between the DC inside versus
  outside groups. (C-F) Multiplex IF images confirmed increased (C, D) Fscn1 and (E,
  F) Sh3bp1 expression of the DCs inside the TCZ in lower and higher-resolution images.
  Scale bars: 50, 20 μm'
