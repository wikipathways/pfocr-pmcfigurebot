figure_title: Expression of genes related to mitochondrial metabolism and apoptosis,
  and Western blot expression analysis of proteins involved in 1C metabolism.
caption: 'Expression of genes related to mitochondrial metabolism and apoptosis, and
  Western blot expression analysis of proteins involved in 1C metabolism. (A) The
  Ghitm gene was underexpressed in the NPC group. This result is consistent with the
  underexpression observed in the microarray. (B) The Ptpmt1 gene was found underexpressed
  in the cerebral cortex of the NPC mice. (C) No differences in the expression of
  the Ftmt gene were found between WT and NPC mice; therefore, this gene involved
  in ferroptosis does not appear to be altered in the cortex of NPC mice. (D,E) Under-expression
  of the Ppm1f and Sfxn1 genes was observed in the cerebral cortex of NPC mice. (F)
  In contrast to the microarray results, overexpression of the gene Cyp24a1 was observed
  in NPC mice. (G) Under-expression of the MTHFD1 protein in the NPC group. (H) In
  contrast to MTHFD1 expression, overexpression of TYMS was observed. (I) 1C metabolic
  pathway; this image shows the direction of expression of the molecules involved
  in this pathway. Mthfd2l is underexpressed at the RNA level in the microarray. MTHFD1,
  the enzyme responsible for the formation of 5,10-methylene, is also underexpressed
  (Down red arrow). TYMS, the protein that catalyzes the synthesis of dTMP, is overexpressed
  (Up red arrow), probably due to a compensatory effect. Gapdh/GAPDH was used to normalize
  gene and protein expression. A T-Student test was performed to determine statistical
  significance. The normality of the data was determined using the Shapiro–Wilk normality
  test and the Rout outlier test to detect outliers. ** p ≤ 0.01, * p ≤ 0.05, ns:
  not significant'
