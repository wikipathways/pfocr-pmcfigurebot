figure_title: Non-pharmacological modalities predominantly engage multiple NRF2-activating
  pathways.
caption: 'Non-pharmacological modalities predominantly engage multiple NRF2-activating
  pathways. NRF2 can be induced via: (i) non-specific electrophile/ROS generation,
  (ii) disruption of the NRF2–KEAP1 protein–protein interaction, (iii) autophagy-mediated
  KEAP1 degradation, (iv) direct modulation of NRF2 protein stability, and (v) post-transcriptional/post-translational
  modifications. Except for a single intervention, therapeutic hypothermia, every
  non-pharmacological strategy with defined mechanisms employs more than one of these
  routes, most frequently pairing post-translational modification with either protein-stability
  regulation or limited electrophile production. This combinatorial activation elevates
  both NRF2 abundance and transcriptional competence while minimizing the liabilities
  of purely electrophilic agents and circumventing the efficacy limitations reported
  for current single-mechanism, non-electrophilic compounds. (Created with BioRender.com)
  (abbreviations: α7nACHr: alpha7 nicotinic acetylcholine receptor; Akt: protein kinase
  B; AMPK: AMP-activated protein kinase; BDNF: brain-derived neurotrophic factor;
  CB2r: Cannabinoid receptor 2; ERK: extracellular signal-regulated kinase; GSK-3β:
  glycogen synthase kinase 3 beta; miR-144: microRNA-144; p38 MAPK: p38 mitogen-activated
  protein kinase; p62; ROS: reactive oxygen species; SIRT1: sirtuin 1; SIRT3: sirtuin
  3; STAT3: signal transducer and activator of transcription 3; TOPK: T-LAK cell-originated
  protein kinase)'
