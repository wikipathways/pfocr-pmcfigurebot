figure_title: Single-cell transcriptional profiling of Giardia-induced IL-10-producing
  CD4+ T cells
caption: (A) Experimental schematic. Small intestine lamina propria cells were isolated
  from Giardia-infected IL-10 GFP reporter mice (7 d.p.i.), and IL-10-producing CD4+
  T cells were sorted for further analysis by single-cell RNA-seq. (B) Representative
  dot plots of sorted TCRβ+CD4+IL-10+ from naïve and Giardia-infected mice (7 d.p.i.).
  (C) UMAP plots showing the identity of IL-10 producing CD4+ T cell subpopulations
  by RunUMAP and clustering analysis, and PoW plots indicating the frequency of T
  helper and T regulatory cell subpopulations in the naïve or Giardia-infected TCRβ+CD4+IL-10+
  sorted population. (D) Heatmap showing the expression of the most significantly
  20 enriched transcripts in each subpopulation cluster and pathway enrichment analysis
  using the top 25 markers in Th2 cells. (E) and (F) Violin plots indicating IL-4
  and IL-13 transcripts expression in CD4+ T cell subpopulations. Data are representative
  of one experiment using 8 naïve and 12 Giardia-infected mice
