figure_title: Biosynthesis of silver nanoparticles.
caption: Biosynthesis of silver nanoparticles. The first step consists of preparing
  the biomass. For instance, the relevant parts of the plants are directly harvested
  while the microorganisms (bacteria, fungi, microalgae) are cultured ①. Then, the
  biomass is processed according to the envisaged pathway ②. Subsequently, this bioresource,
  that can be made of the crude broth, refined biomolecules, disrupted cells, cell-free
  supernatant, or pristine cultures, is challenged by the precursor (aqueous solution
  of cationic silver in this case) under a set of selected experimental parameters
  (pH, temperature, reaction time, etc.) ③. This gives rise to bio-AgNPs, ④ whose
  features (size, shape, stability, etc.) are studied using a variety of characterization
  techniques ⑤. Then, the biological properties of these NPs are explored ⑥ from which
  some interesting bio-applications may emerge ⑦
article_title: Paradoxical Features Empower Biogenic Silver Nanoparticles
