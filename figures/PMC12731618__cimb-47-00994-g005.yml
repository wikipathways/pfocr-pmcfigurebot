figure_title: Activation of the intrinsic apoptosis pathway due to CHLE.
caption: Activation of the intrinsic apoptosis pathway due to CHLE. The HepG2 cells
  (5 × 104 cells) were treated with CHLE, Q3G, and HHT for 24 h or 48 h. (A) Intracellular
  ROS formation was measured by flow cytometry. (B) Mitochondrial membrane potential
  changes were analyzed by flow cytometry using JC-1 staining. (C) Intracellular BAX
  expression levels were measured by flow cytometry. (D) Schematic diagram of CHLE-dinduced
  apoptosis in HepG2 cells. The histograms and dot blot presented representative experiments,
  and the numbers indicate the mean values. Data are presented as the mean ± SD. Different
  letters (a–g) indicate statistically significant differences (p < 0.05)
