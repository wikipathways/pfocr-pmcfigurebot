figure_title: Transcriptomic profiling of BMDMs trained with HK Kp.
caption: Transcriptomic profiling of BMDMs trained with HK Kp. (A) Volcano plot depicting
  differentially expressed genes between HK Kp-trained and control BMDMs. Significantly
  upregulated or downregulated genes were identified using DESeq2 with an adjusted
  p value (Padj) < 0.05 and |log2 fold change| > 1. (B) KEGG pathway enrichment analysis
  of differentially expressed genes, shown as a dot plot indicating enrichment score,
  gene number, and p value for each pathway. (C) Heatmap of core enrichment genes
  within the glycolysis/gluconeogenesis pathway. (D) Heatmap of core enrichment genes
  within the hematopoietic cell lineage pathway. (E) GSEA plots for glycolysis/gluconeogenesis
  and hematopoietic cell lineage pathways based on the ranked transcriptome. RNA-seq
  was performed on n = 3 independent biological replicates per group, and KEGG and
  GSEA analyses were conducted using standard enrichment settings
