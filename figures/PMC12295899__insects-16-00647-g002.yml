figure_title: Effect of inhibiting mTORC1 signaling pathway on BmE cell cycle.
caption: Effect of inhibiting mTORC1 signaling pathway on BmE cell cycle. (A) The
  expression level changes in cell cycle-related genes after Rapamycin treatment were
  measured by qPCR. Error bars indicate SEM (n = 3). (B) The protein abundances of
  CyclinB and CyclinE after Rapamycin treatment detected by Western blot. (C) Effect
  of Rapamycin on proliferative viability of BmE cells. Error bars indicate SEM (n
  = 6). Statistically significant differences were assessed using Student’s t-test
  (ns > 0.05, * p < 0.05, ** p < 0.01 and *** p < 0.001)
