caption: 'A summary of H. pylori transmission. (1) Intrafamilial transmission: likely
  occurring via the gastro-oral or fecal–oral route. (2) Extrafamilial transmission:
  more common in rural and developing settings. (3) Waterborne transmission. (4) Produce
  contamination: arising from irrigation with contaminated water. (5) Meat and dairy
  contamination: a potential zoonotic source of foodborne transmission through exposure
  to infected livestock. (a) Pathway of water contamination in soil via human or animal
  feces. (b) Pathway of contamination of produce via soil water'
