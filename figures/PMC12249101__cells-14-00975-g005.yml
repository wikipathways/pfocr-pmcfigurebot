figure_title: Elevated BCL2A1 expression in COP1 mutant cells drives resistance to
  MAPK pathway inhibitors.
caption: Elevated BCL2A1 expression in COP1 mutant cells drives resistance to MAPK
  pathway inhibitors. (A) Western blots of A375 cells. (B) Graphs indicate A375 cell
  proliferation. Results are representative of 2 independent experiments. (C) Relative
  viability of A375 cells upon treatment with different inhibitors of the BCL2 pro-survival
  proteins, GDC-0199 targeting BCL2, A-1331852 targeting BCL-XL, and AMG-176 and S63845
  targeting MCL1, alone or in combination with the MEK inhibitors cobimetinib (GDC-0973).
  The black line shows the response to cobimetinib at 0.18 μM, yellow-red shades show
  the response to the BCL2-family inhibitor at respective concentrations (see x-axis),
  and purple-blue shades show the response to the corresponding combination of drugs
