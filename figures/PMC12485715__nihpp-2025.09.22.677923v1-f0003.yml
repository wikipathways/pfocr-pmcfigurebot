figure_title: Dual modes of alteration of gene expression by CDK12 inhibition
caption: A. HCC1954 cells were treated with THZ531 or NVP-2 for 4 hours, after which
  whole cell lysates were harvested for fluorescent immunoblotting. The molecular
  weights of the fluorescent protein markers and clone identities for monoclonal antibodies
  are indicated. Merged images show signals from two primary antibodies raised in
  different species.B. Volcano plots of gene expression. HCC1954 cells were treated
  for 4 h with THZ531 (200 nM), or NVP-2 (200 nM), or vehicle control. Total RNA was
  extracted and subjected to library construction and deep sequencing. Dotted lines
  in the volcano plots (left) indicate the thresholds used for log-transformed fold
  change (1, −1). The Tukey box plots (right) illustrate the comparison between the
  magnitudes of change in significantly up- or down-regulated genes. **** p < 0.0001;
  ns, not significant (Mann-Whitney test).C. Analysis of gene size among groups of
  genes impacted by CDK12 or 9 inhibition. **** p < 0.0001; ns, not significant (Mann-Whitney
  test).D. Traces of RNA-seq coverage over the gene BLM. Note that CDK12 inhibition
  decreases coverage over exons, but concomitantly produces reads at positions known
  to harbor intronic polyadenylation. The boxed regions are also displayed with re-scaled
  y-axis (bottom).E. Metagene profile plots of genes that are commonly downregulated
  in HCC1954 cells treated with THZ531, NVP-2, or THZ1 and that have been segmented
  by gene size. Note that CDK12 inhibition is uniquely associated with a size-dependent
  elongation defect.F. Overrepresentation analysis of significantly downregulated
  genes in HCC1954 cells that were treated as indicated in the x-axis. Gene sets in
  the KEGG and Reactome pathway databases were evaluated. Dot color denotes the statistical
  significance of gene set enrichment within the group of downregulated genes (−log
  q) and dot size denotes the fraction of downregulated genes corresponding to that
  gene set.G. Summary plot of normalized enrichment scores (NES) for gene sets that
  are significantly downregulated in HCC1954 cells treated with CDK12 inhibitor (nominal
  p-value < 0.05). Blue dots denote gene sets implicated in the DNA damage response.H.
  Venn diagram for gene sets that are downregulated by CDK12, CDK9, and CDK7 inhibition.
  Note that gene sets involved in the DNA damage response are specific to CDK12 inhibition.
  The right bottom illustrates metagene profile plots of genes in the gene set Reactome_
  Homologous DNA Pairing and Strand Exchange in HCC1954 cells treated with THZ531,
  NVP-2, or THZ1 and that have been segmented by gene size
