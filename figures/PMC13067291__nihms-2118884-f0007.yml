figure_title: Pediatric and adult hypertrophic cardiomyopathy (HCM) comparisons
caption: 'A, Uniform manifold approximation and projection (UMAP) embedding of integrated
  data. B, Left: Network diagrams for gene ontology (GO)pathways enriched in pediatric
  hypertrophic cardiomyopathy (HCM). Right: Enriched Kyoto Encyclopedia of Genes and
  Genomes (KEGG) pathways with adjusted P<0.05 with common genes annotated. C, Violin
  plots illustrating collagen and laminin module expression in adult (red) and pediatric
  (blue) HCM. D, Left: UMAP embedding of integrated data stratified by cluster. Violin
  plot illustrating activated fibroblast module expression in clusters. Right: Pediatric-specific
  re-embedded UMAP, labeled by original clusters. Bar plots illustrating enriched
  GO and KEGG pathways with adjusted P<0.05. * indicates a Wilcoxon rank-sum test
  P<0.001. ** indicates a Kruskal-Wallis test P< 0.001'
