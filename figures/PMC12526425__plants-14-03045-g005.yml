figure_title: 'Putative flavonoid pathways in medicinal plants: (A) shikimate pathway,
  (B) phenylpropanoid pathway, and (C) flavonoid pathway.'
caption: 'Putative flavonoid pathways in medicinal plants: (A) shikimate pathway,
  (B) phenylpropanoid pathway, and (C) flavonoid pathway. (D) Examples of flavonoids.
  (E) Presence of some of the flavonoids in Bulbine species, with or contributing
  to anti-inflammatory and injury healing activity, and (F) Bulbine natalensis Baker.
  Initially, the acetate pathway (generating ring A) and the shikimic pathway (generating
  ring B) merge to form a heterocyclic pyran ring C, yielding the C6-C3-C6 flavonoid
  skeleton [51,52]. This originates with the aldol condensation reaction of phosphoenolpyruvic
  acid and D-erythrose 4-phosphate [53]. Chorismic acid is converted into phenylalanine
  by prephenate-aminotransferase (PhAT) and arogenate-dehydratase (ADT) enzymes [54,55].
  The phenylpropanoid pathway initiates from phenylalanine in the presence of phenylalanine
  ammonia-lyase (PhAAL) which deaminates phenylalanine to form trans-cinnamic acid
  [52,54,55]. The cinnamate-4-hydroxylase (C4L) hydroxylates trans-cinnamic acid into
  4-coumaric acid (p-coumaric acid), from which the enzymatic action of 4-coumarate-(C4CoAL)
  mediates the biosynthesis of 4-coumaroyl-CoA to produce coumarin skeleton [54].
  A step-by-step condensation of 4-coumaroyl-CoA under mediation by chalcone-synthase
  activity, ultimately produces 2′, 4′, 6′, 4-tetrahydroxy chalcones [53,55]. Chalcone
  isomerase converts chalcone to flavanone/naringenin from which flavonoid subclasses
  are then synthesised [53]'
