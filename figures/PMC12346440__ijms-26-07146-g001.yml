figure_title: Metabolic pathways and physiological roles of vitamin D.
caption: Metabolic pathways and physiological roles of vitamin D. (A) Vitamin D synthesis
  in the skin, where 7-dehydrocholesterol is converted to vitamin D3 by ultraviolet
  B (UVB) radiation (Panel Aa). Dietary intake also contributes to vitamin D levels
  (Panel Ab). (B) Liver hydroxylation, catalyzed by enzymes CYP27A1 and CYP2R1, converts
  vitamin D into 25(OH)D3, the primary circulating form (Panel Ba). Kidney hydroxylation
  by CYP27B1 transforms 25(OH)D3 into its active form, 1,25(OH)2D3, which is crucial
  for various physiological functions (Panel Bb). The autocrine/paracrine pathway
  enables vitamin D to act locally within tissues (Panel Bc). (C) Vitamin D signaling
  involves the interaction between 1,25(OH)2D3 and its receptor, VDR, initiating molecular
  events. (D) The VDR-RXR complex, along with co-activators, regulates gene transcription
  within the nucleus, influencing target gene expression. (E) Vitamin D’s clinical
  relevance includes roles in bone health, immune function, cardiovascular health,
  neurological function, respiratory health, and cancer prevention
