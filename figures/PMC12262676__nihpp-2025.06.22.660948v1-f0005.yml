figure_title: Prediction output of Tabular GhostBuster on Parkinson’s disease, cross-matching
  the TCGA and STRING unbiased channels, in the test dataset prediction
caption: 'Tabular GhostBuster was trained to recognize 125 genes in the Parkinson’s
  disease pathway from the Kyoto Encyclopedia of Genes and Genomes (KEGG), utilizing
  the TCGA channel or the STRING channel as its training input. At the end of the
  training, a gene prioritization list was assembled by concatenating the rank-transformed
  test dataset predictions, for both models. Additionally, GhostBuster’s GPT control
  group was utilized to obtain GPT-4o mini-derived association scores between each
  gene and Parkinson’s Disease, in a standardized scale from 1 to 10 (color code).
  Finally, genes were organized in a scatter plot based on their rank in the TCGA
  channel (x-axis), versus their rank in the STRING channel (y-axis).(Left) Density
  plot, decomposed in three parts: namely (a) the 125 target genes (blue genes), (b)
  the non-target genes with a GPT score of 6 or higher (cyan genes), and (c) the non-target
  gene with a GPT score of 5 or less (green genes). In all three plots, agreement
  between the two channels can be observed in the top hits (top-right corner).(Right)
  (d) Scatter plot detail of the top 4 percentiles, at gene-level resolution. The
  green genes depicted here were simultaneously selected by both the TCGA and the
  STRING channel as top hits in the test dataset, despite their involvement in Parkinson’s
  Disease was largely unexplored in the scientific literature: this makes them the
  “interesting” hits for the sake of our prediction'
article_title: 'GhostBuster: A Deep-Learning-based, Literature-Unbiased Gene Prioritization
  Tool for Gene Annotation Prediction'
