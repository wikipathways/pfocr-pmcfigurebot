caption: In cancer cells, MYC upregulates ASS1 expression, enhancing arginine biosynthesis
  and elevating its levels in the TME. This process effectively suppresses the antitumor
  function of CD8+ T cells, outweighing any potential arginine-mediated enhancement
  of their cytotoxic activity. Mechanistically, arginine is metabolized into polyamines
  within TAMs, which then promote their protumor polarization through TDG (thymine
  DNA glycosylase)-dependent DNA demethylation—a pathway modulated by p53 signaling.
  Arrows denote upregulation or an increase in expression levels, whereas other types
  of indicator lines represent inhibition
