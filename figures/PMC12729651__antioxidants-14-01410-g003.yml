figure_title: Reactome pathway enrichment analysis of lysine-acetylated differentially
  expressed proteins (DEPs) in idiopathic infertile patients (IIP) compared to fertile
  donors (FD).
caption: Reactome pathway enrichment analysis of lysine-acetylated differentially
  expressed proteins (DEPs) in idiopathic infertile patients (IIP) compared to fertile
  donors (FD). The dot plot shows the top significantly enriched Reactome pathways
  associated with the acetylated DEPs. The x-axis represents the gene ratio (proportion
  of DEPs involved in each pathway), while the y-axis lists the enriched pathways.
  The size of each dot indicates the number of DEPs mapped to the pathway (gene count),
  and the color gradient represents the statistical significance based on the False
  Discovery Rate (FDR), with darker shades indicating higher significance. Key enriched
  pathways include detoxification of reactive oxygen species, cellular response to
  stress, and pyruvate metabolism, highlighting the role of dysregulated protein acetylation
  in redox homeostasis and energy metabolism in idiopathic male infertility
