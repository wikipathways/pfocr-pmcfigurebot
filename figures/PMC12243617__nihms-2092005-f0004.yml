figure_title: Modulation of effective surface protein spacing on E. coli produces
  a threshold effect on complement response and alternative pathway C3 adhesion to
  the microbe surfaces
caption: '(A) Scheme for chemically blocking nucleophiles on E. coli with methyl-terminated
  poly(ethylene) glycol (PEG) groups to effectively increase average protein-protein
  spacing on the E. coli.(B) Effective mean protein spacing on E. coli vs. methyl-PEG
  groups added to the E. coli. Inset: number of amines detected by Ninhydrin assay
  per E. coli vs. methyl-PEG groups added to the E. coli (n = 3 E. coli preparations).(C)
  C3a production in serum + modified E. coli vs. effective protein spacing on E. coli
  (n = 6 E. coli-serum preparations).(D and E) Micrographs of modified E. coli after
  incubation with serum + fluorescent C3 (n = 4 E. coli-serum preparations).(F and
  G) Quantification of C3 deposition on E. coli vs. effective protein spacing on E.
  coli, measured in images as in (D) and (E), showing C3 deposition via the alternative
  pathway vs. all pathways. *p < 0.05, **p < 0.01, two-way ANOVA with Tukey’s correction.See
  also Figure S7'
