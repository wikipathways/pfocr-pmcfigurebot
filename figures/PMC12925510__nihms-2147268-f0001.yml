figure_title: Study design overview.
caption: 'Study design overview. (A) Patient cohort details describing the number
  of patients with juvenile dermatomyositis (JDM) with baseline (BL) and 6-mo follow-up
  (6 mo) plasma samples and number of paediatric controls (CTL). (B) The Olink proximity
  extension assay (PEA) Explore 3072 Panel was utilised for simultaneous measurement
  of 3072 proteins in JDM and CTL plasma samples. Olink PEA technology harnesses antibodies
  labelled to DNA oligonucleotides followed by hybridisation, extension, and quantitative
  PCR amplification for protein quantification. Linear mixed effects model analysis
  identified: (C) proteins and biological pathways enriched in JDM BL or JDM 6-mo
  groups as compared to CTL. It also lists the physician global activity (median [IQR]),
  which is an overall disease activity measure on a 0 to 10 visual analogue scale
  (VAS). (D) Proteins associated with the global activity (PGA) in all patients with
  JDM at both time points. Proteins were also evaluated for either muscle, skin, or
  endothelial-enrichment/enhancement based on the Human Protein Atlas and evaluated
  for cell-type specificity in JDM muscle and skin single-nuclei and single-cell transcriptomic
  datasets. (E) Proteins were associated with myositis-specific autoantibody (MSA)
  subtype (MDA5, NXP2, TIF1γ) in BL patients with JDM. CARRA, Childhood Arthritis
  and Rheumatology Research Alliance; HC, healthy control; MDA5, melanoma differentiation-associated
  protein 5; NGS, next-generation sequencing; NXP2, nuclear matrix protein 2; PCR,
  polymerase chain reaction; TIF1-γ, transcription intermediary factor 1-gamma; UCSF,
  University of California San Francisco; U-M, University of Michigan'
article_title: Discovery of tissue-specific proteomic signatures in juvenile dermatomyositis
  highlights pathways reflecting persistent disease activity, clinical heterogeneity,
  and myositis-specific autoantibody subtype
