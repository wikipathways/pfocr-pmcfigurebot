caption: 'Geneformer predicts AMPD2 is dysregulated by APOBEC3B knockout in severe
  COVID-19 infection: (A) In silico deletion of APOBEC3B in airway epithelial cells
  of severe COVID patients revealed gene embedding predictions on 14,498 genes. AMPD2
  is circled in red. (B) Pathway through which AMPD2 dysregulation could impact SARS-CoV-2
  pathology. (C) Bulk RNA Seq shows that APOBEC3B expression is induced by SARS-CoV-2
  infection and knocked down by siA3Bs (left). AMPD2 is knocked out with SARS-CoV-2
  infection and has expression restored with APOBEC3B knockdown (right). (D) AMPD2
  expression is reduced in severe relative to mild COVID-19 BALF (right); corresponding
  increase in APOBEC3B in severe relative to mild COVID (from Figure 1A, left). Bar
  graphs show mean ± SEM. Statistical significance was calculated by Student’s t-test,
  corrected for multiple comparisons. Statistical analyses were performed from data
  obtained from 3 experiments. * p < 0.05, ** p < 0.01'
