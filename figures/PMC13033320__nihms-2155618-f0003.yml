  across the IM and the dedicated pathway for delivery across the OM.
caption: The secretion systems presented in the upper panel (A) translocate substrates
  via a two-step translocation pathway that rely on the Tat or Sec pathways for delivery
  across the IM and the dedicated pathway for delivery across the OM. (B) The lower
  panel delivers proteins in one step from the bacterial cytoplasm to the cell surface,
  either for delivery of proteins to the milieu or into target cells [93,111]. Specifically,
  Type I secretion system (T1SS) allows direct export to the extracellular space using
  an ATP-binding cassette transporter. T2SS transports proteins from the periplasms
  to extracellular space, while T3SS employs-like structure to inject straight into
  host cells. T4SS can transport DNA to the host cell, which is important for virulence
  and horizontal gene transfer [85–87,89,92,96,97,99,103,107,108,112–122]. The cartoons
  were generated using BioRender
