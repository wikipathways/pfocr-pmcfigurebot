figure_title: MiR-193a-3p modulates the E2-regulated PI3K/Akt pathway.
caption: MiR-193a-3p modulates the E2-regulated PI3K/Akt pathway. (A,B) The representative
  blots and bar graphs of Akt phosphorylation (pAkt) after treatment with or without
  10 nM E2 for 45 min or transfection with the control mimic (MC) and miR-193a-3p
  mimic (M193a). Total Akt and β-actin were used as loading controls. (C,D) The phosphoinositide-3-kinase
  (PI3K) inhibitor LY294002 (LY, 5 µM) abrogates the inducing effect of E2 and miR-193a-3p
  antimir on tube formation. Untransfected HUVECs and cells transfected with the control
  antimir (AC) and miR-193a-3p antimir (A193a) were pre-treated for 30 min with LY
  and subsequently for 30 min with or without 10 nM E2 and plated on the Matrigel.
  Tube length was measured after 16–18 h. Photomicrographs show representative images
  for each treatment. n = 3; * p < 0.05 compared to the respective control; § p <
  0.05 as indicated
