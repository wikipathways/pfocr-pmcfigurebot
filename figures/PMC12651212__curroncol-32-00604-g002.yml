figure_title: The mechanism underlying anti-GDF-15/GFRAL therapy in cancer.
caption: The mechanism underlying anti-GDF-15/GFRAL therapy in cancer. An anti-GDF-15
  antibody binds to GDF-15 and inhibits its effects on the immune system and CNS,
  whereas an anti-GFRAL antibody blocks GFRAL, the specific receptor for GDF-15. The
  anti-GFRAL antibody can interfere with the GFRAL-mediated pathway. Preclinical data
  suggest that the aberrant expression of GFRAL on tumour cells and the peripheral
  nervous system modulates tumour immunity; this can be influenced by GFRAL antagonism
  (not illustrated here). Chemotherapy, such as cisplatin, induces GDF-15 overproduction
  and leads to nausea and vomiting via the CNS. Anti-GDF-15/GFRAL inhibitors are expected
  to alleviate chemotherapy-related symptoms. This figure was created using BioRender
  (https://BioRender.com). CNS, central nervous system; GDF-15, growth differentiation
  factor 15; GFRAL, glial cell line-derived neurotrophic factor family receptor alpha-like;
  ICIs, Immune Checkpoint Inhibitors; MDSC, Myeloid-Derived Suppressor Cell; Treg,
  Regulatory T cell. Arrows indicate the direction of biological effects or signalling
  flow, whereas T-shaped lines represent inhibitory interactions
