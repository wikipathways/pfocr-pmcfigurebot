figure_title: Biosynthesis of ceramide 1-phosphate (C1P) in mammalian cells.
caption: Biosynthesis of ceramide 1-phosphate (C1P) in mammalian cells. C1P is mainly
  synthesized in the Golgi apparatus from ceramide that is transported by ceramide
  transfer protein (CerT) from the endoplasmic reticulum, where ceramides are synthesized
  de novo. Alternatively, ceramides can be generated by the SMase pathway from direct
  degradation of sphingomyelin (SM) or by the salvage pathway from the metabolism
  of complex sphingolipids. C1P is also present in the perinuclear membrane. Once
  synthesized, C1P can be transported by ceramide 1-phosphate transfer protein (CPTP)
  to the plasma membrane and other organelles. Also, C1P can be secreted to the extracellular
  milieu and bind to a putative Gi/o protein-coupled receptor located in the plasma
  membrane of cells. CDase, ceramidase; CerS, ceramide synthase; CER, ceramide; CerT,
  ceramide transfer protein; CPP, C1P phosphatase; DEGS, dihydroceramide desaturase;
  KDR, ketosphinganine reductase; LPP, lipid phosphate phosphatase; SMase, sphingomyelinase;
  SMS, sphingomyelin synthase; SphK, sphingosine kinase; SPP, S1P phosphatase; SPT,
  serine palmitoyl transferase
