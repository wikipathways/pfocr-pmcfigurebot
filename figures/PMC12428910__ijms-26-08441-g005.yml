figure_title: The proteomics result caused by MPs and co-exposure with SMZ, BDE153
  at 8 d (n = 6).
caption: The proteomics result caused by MPs and co-exposure with SMZ, BDE153 at 8
  d (n = 6). (a) KEGG pathway enrichment among the comparisons. X and Y axes showed
  different enrichment scores and different enriched KEGG pathways after selection
  based on the values for lists and adjusted p values. (b) The selected DEPs in the
  enriched pathways for finding out the synergistic or antagonistic effect when in
  co-exposure with MPs. In a different comparison, like “SMZ+MP vs. SMZ group”, the
  term pathways of endocytosis, protein processing in the endoplasmic reticulum, and
  regulation of the actin cytoskeleton were enriched and selected. The selected target
  DEPs and their revealed descriptions are based on log2(fold change) and p-value.
  Green and red accession numbers stand for the down- and up-regulated DEPs
article_title: Multi-Omics Platforms Reveal Synergistic Intestinal Toxicity in Tilapia
