figure_title: The iEC profiling of the resting-state human brain
caption: a, The modular structure of iEC is unveiled by organizing it according to
  the 7 different functional networks of Yeo-Krienen atlas96 (the left cortex presented
  only for visualization purposes). b, The edge distribution of iEC shows a characteristic
  heavy-tail distribution. c, Profiling of the positive-negative ratio of outdegree
  connections (see Supplementary Fig. 9c for the indegree plot) based on the 7 functional
  networks. Note that the dichotomized pattern between positive and negative connections
  in the unimodal regions gradually converges into a form with a more balanced ratio
  in higher-order heteromodal areas. d, Signal propagation based on a linear dynamical
  system18 across 22 modules of the MMP-360 atlas. Modules are categorized into functionally
  specialized subnetworks for easier interpretation of the signal flow patterns. Edge
  thickness indicates signal strength, and color represents positive (red) and negative
  (blue) signal flows, respectively. e, Stratification of signal propagation based
  on the proportion of positive and negative signal flows within and between unimodal
  and heteromodal systems. Positive signal flow prevails within and between the systems,
  whereas negative signal flow is primarily observed in hetero-to-unimodal pathways
  during resting-state fMRI
article_title: In vivo cartography of state-dependent signal flow hierarchy in the
