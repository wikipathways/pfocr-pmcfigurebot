figure_title: 'Summary: This study investigated how late-gestation heat stress (HT)
  affects extracellular vesicle (EV) protein profiles in dairy cows at parturition.'
caption: 'Summary: This study investigated how late-gestation heat stress (HT) affects
  extracellular vesicle (EV) protein profiles in dairy cows at parturition. Plasma
  EV were isolated from heat-stressed and cooled (CL) cows and analyzed by mass spectrometry.
  A total of 684 proteins were identified, of which 20 differed significantly between
  treatments. The EV from cooled cows were enriched in extracellular matrix and coagulation
  proteins, including laminins, collagen IV, fibrinogen, and von Willebrand factor.
  The presence of these proteins in CL cows suggests that cooling enhances molecular
  pathways involved in tissue repair and postpartum recovery. Conversely, immunoglobulin-related
  proteins and specific receptors were reduced in cooled cows, potentially reflecting
  lower immune stress. These findings indicate that HT during late gestation alters
  EV-mediated signaling related to metabolism, immune modulation, and tissue remodeling
  at parturition. The identified proteins may serve as potential biomarkers for assessing
  maternal adaptation and recovery, emphasizing the importance of environmental cooling
  during the dry period. NTA = nanoparticle tracking analysis; trt = treatment'
article_title: Characterization of extracellular vesicles at parturition in dairy
  cows with late-gestation heat stress
