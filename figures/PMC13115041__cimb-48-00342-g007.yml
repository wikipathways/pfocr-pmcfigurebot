caption: '(A) The effect of DHA on the induction of the colony formation in cancer
  cells. (B) The SA-β-GAL staining results of HCT116 cells after exposure to 20 μM
  DHA for 7 days or 50 μM DHA for 1 day. The scale is 10 μm. (C) Transcriptome expression
  levels of genes related to the aging pathway. Data are presented as mean ± SD from
  n = 3 independent biological replicates. Statistical analysis was performed using
  one-way ANOVA followed by Tukey’s post hoc test and two-way ANOVA compared to the
  control group. * p < 0.05, ** p < 0.01. Light gray bars: Control group (ConT); Medium
  gray bars: 10 μM or 20 μM DHA treatment group; Dark gray bars: 50 μM DHA treatment
  group'
