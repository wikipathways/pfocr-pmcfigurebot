figure_title: Differential glycogen metabolism results in Sertoli cell-specific accumulation
caption: (A) Immunofluorescence for glycogen (green) and male (AMH) or female (FOXL2)
  supporting cell markers (magenta) in E12.5 and E13.5 gonads. White arrowheads indicate
  Glycogen deposition in Sertoli cells. Samples were counterstained with DAPI (blue).
  (B) Schematic representation of the glycogen synthesis (right) and glycogen degradation
  (left) pathway (created with BioRender.com). (C) Dot plot representation of the
  expression of glycogen pathway related genes in male (right) and female (left) supporting
  cells at different developmental timepoints. * indicate adjpvalue<0.05, Wilcoxon
  Rank Sum test. (D) Immunofluorescence for PPP1R3C (green) and supporting cell markers
  SF1, AMH or FOXL2 (magenta) in transverse (E11.5) or longitudinal (E12.5 and E13.5)
  gonadal sections. (E) Immunofluorescence for PYGB (green) and supporting cell markers
  SF1, AMH or FOXL2 (magenta) in E12.5 and E13.5 gonads. Samples were counterstained
  with DAPI (blue). Scale bars are 50 μm
