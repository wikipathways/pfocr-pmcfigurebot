figure_title: Pyrrolobenzodiazepine natural products and K. oxytoca PBD synthesis
caption: A. Examples of PBD natural products. B. Pyrrolobenzodiazepine natural product
  structure scaffold. C. NRPS pathway to synthesize aldehyde, 2-hydroxy-5-(2-oxo-3-(pyrrolidin-3-ylcarbamoyl)amino)benzamide,
  involving 1. the adenylation and loading of 3HA substrate onto the PCP ThdA catalyzed
  by the adenylation domain NpsA, 2. adenylation and PCP loading of L-proline catalyzed
  by adenylation domain of NpsB, 3. condensation reaction between 3HA and L-proline,
  and 4. release of the final aldehyde product through an NADPH-dependent reduction
  reaction performed by NpsB terminal reductase domain. D. NRPS-independent cyclization
  reaction forms the PBD tilimycin, followed by a spontaneous electrophilic aromatic
  substitution of indole to form tilivalline
article_title: Protein Engineering of Biosynthetic Enzymes Unlocks Libraries of Bioactive
