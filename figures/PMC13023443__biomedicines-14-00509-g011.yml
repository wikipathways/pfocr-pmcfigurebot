caption: A STRING database–derived protein–protein interaction network constructed
  from the shared predicted targets of etoposide and curcumin, showing a highly interconnected
  network with significant enrichment (PPI enrichment p < 1.0 × 10−16). Hub genes
  identified by topological analysis, including p53, AKT1, CASP3, MAPK1, EGFR, STAT3,
  and ESR1, are highlighted in red and displayed with larger node sizes, reflecting
  their high degree of connectivity within the predicted network rather than confirmed
  functional dominance. Blue nodes represent other interacting proteins, while edges
  denote protein–protein interactions. This network provides a systems-level, hypothesis-generating
  overview of molecular pathways potentially relevant to apoptosis, cell cycle regulation,
  and cancer-related processes, without implying direct experimental validation or
  causal involvement
