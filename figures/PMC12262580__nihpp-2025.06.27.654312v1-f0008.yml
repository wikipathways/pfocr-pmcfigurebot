figure_title: SGLT2 inhibition restores mitochondrial function and reduces inflammatory
  signaling in aged killifish kidneys
caption: (A) UMAP plot of single-nucleus RNA-seq data from aged SGLT2i-treated killifish
  kidneys, showing conserved renal cell populations across conditions.(B) Venn diagram
  depicting shared and condition-specific expressed genes; 385 genes were uniquely
  detected in SGLT2i-treated aged samples, while 97 were unique to untreated aged
  samples.(C) Bar plot showing relative proportions of major renal cell types. No
  major differences were observed in endothelial and perivascular cells counts between
  the SGLT2i group and the untreated group.(D) Heatmap displaying expression (Z-score)
  of key inflammatory genes, including NF-κB, CRP, TNFα, and IL-6, which were downregulated
  in treated kidneys.(F) Gene set enrichment analysis (GSEA) of major renal cell types
  showing normalized enrichment scores (NES) for the top 10 gene sets combining biological
  processes, molecular functions, and cellular components. Positive enrichment (blue)
  highlights restored expression of mitochondrial and electron transport-associated
  pathways in SGLT2i-treated animals, particularly in tubular, endothelial, and perivascular
  cells
