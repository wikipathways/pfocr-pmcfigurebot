figure_title: Conserved pathogenic mechanism in mouse models and humans
caption: a, b, qRT–PCR of Lpl mRNA in adipose tissue (a) and liver (b) B6 mice injected
  with LLC cells with (n = 4) or without (n = 5) and IL-6 expression. c,d, Relative
  levels of adipose (c) and liver (d) TG species of B6 mice injected with LLC cells
  with or without IL-6 expression (n=5). e-h, Relative levels of liver lipid species
  with C18:1 (e), C18:2 (f), C18:3 (g), and C16:0 (h) acyl chains of B6 mice injected
  with LLC cells with or without IL-6 expression (n=5). i-k, qRT–PCR of CerS4 (i),
  CerS5 (j), CerS6 (k) mRNA in liver of B6 mice injected with LLC cells with or without
  IL-6 expression (n = 7). i, Western blot showing forms of CtsL, LAMP2, LC3, and
  P62 in liver of B6 mice injected with LLC cells with or without IL-6 expression,
  with the loading control GAPDH. m,n, Correlation plots showing the positive relationship
  between liver CerS4 (m) and CerS5 (n) expression (n = 10) versus weight loss of
  KL mice. o-r, Correlation plots showing the positive relationship between expression
  of STAT3 and CerS5 (o), CPR and CerS5 (p), STAT3 and CerS6 (q), CPR and CerS6 (r)
  in non-diseased liver samples of 226 participants in the GTEx Project. TPM, transcript
  per million. s, Pathway map showing de novo ceramide synthesis pathway in human.
  t-w, Kaplan–Meier survival curves displaying the estimated survival probabilities
  of people with hepatocellular carcinoma with low (bottom third) and high (top third)
  hepatic expression of LPL (t), CERS5 (u), CERS6 (v), and DEGS1 (w). *p < 0.05, **p
  < 0.01, ***p < 0.001, ****p < 0.0001, ns indicates not significant. Error bars indicate
  SDs. n indicates the number of biological replicates in each experiment
