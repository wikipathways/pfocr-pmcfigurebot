figure_title: Potential mechanism by which EE regulates endogenous H2S biosynthesis.
caption: Potential mechanism by which EE regulates endogenous H2S biosynthesis. (A)
  Sample cluster analysis of transcriptomic sequencing. (B–F) Gene Set Enrichment
  Analysis (GSEA) plots for dopamine biosynthetic process, dopamine secretion, response
  to dopamine, oxidative stress pathway, and caspase pathway in mouse cerebral tissues
  (n = 3). (G) Volcano plot demonstrating upregulated expression of calmodulin-associated
  gene Calm1, H2S-synthesizing enzyme genes Cbs and Cth, dopamine receptor gene Drd1,
  along with enhanced expression of mitophagy-related genes Pink1 and Prkn (encoding
  parkin), and mitochondrial fusion gene Mfn2 in the EE group versus the model group.
  Conversely, EE intervention markedly suppressed apoptosis-related gene Casp3 expression
  (n = 3, |log2FC| > 1.5, p < 0.05). (H,I) Representative co-immunoprecipitation (Co-IP)
  blot images
