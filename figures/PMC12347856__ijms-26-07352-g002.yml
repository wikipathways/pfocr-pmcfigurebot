figure_title: 'Inflammation-induced retinal degeneration: a shared pathway with neurodegeneration.'
caption: 'Inflammation-induced retinal degeneration: a shared pathway with neurodegeneration.
  This figure illustrates the structural and molecular changes in the retina associated
  with chronic inflammation, paralleling mechanisms seen in cerebral neurodegeneration.
  On the left, a healthy retina is shown, with organized retinal layers including
  photoreceptors, Müller cells, bipolar cells, and ganglion cells. On the right, chronic
  inflammation—marked by elevated IL-6, TNF-α, and TLR4 signaling—leads to increased
  oxidative stress and downregulation of Reelin, a crucial extracellular matrix protein
  involved in neuronal stability. These molecular changes promote the accumulation
  of amyloid-β plaques and tau tangles, not only in the brain but also in retinal
  neurons, particularly affecting ganglion and bipolar cells. Over time, these pathological
  processes contribute to the formation of drusen deposits beneath the retinal pigment
  epithelium and retinal thinning, hallmarks of retinal degenerative conditions such
  as age-related macular degeneration (AMD). This leads to progressive vision loss
  in advanced stages, reflecting a shared inflammatory–neurodegenerative axis between
  the retina and brain'
