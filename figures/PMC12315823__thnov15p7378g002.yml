figure_title: Factors that drive TAM differentiation and polarization.
caption: 'Factors that drive TAM differentiation and polarization. (A) TAMs can originate
  either from embryonic precursors in yolk sac and fetal liver, or from bone marrow-derived
  monocytes. Many factors, including CSF-1, IL-34, IL-10, IL-4Rα signals, CSF-2, GM-CSF
  and unknown factors, promote monocyte-to-macrophage differentiation. In contrast,
  CD244 inhibits the differentiation of anti-tumor macrophages. Human monocytes can
  be divided into the classical CD14++CD16-, intermediate CD14++CD16+, and non-classical
  CD14+CD16++ monocytes. (B) IFN-γ, LPS, ginseng-derived nanoparticles and arenobufagin
  drive M1 TAM polarization, metabolically characterized by aerobic glycolysis, whereas
  IL-4, IL-10, IL-13, hypoxia and lactate drive M2 TAM polarization, characterized
  by oxidative metabolism. Intrinsic signaling pathways, including PI3K, mTORC1, HIF-1α
  and Notch signals, are involved in M1 TAM polarization, whereas mTORC2, HIF-2α,
  AMPK, PPARs, glutamine, lactate and C/EBPβ signals are involved in M2 TAM polarization.
  Moreover, M2 TAMs can be divided into 4 subgroups: M2a macrophages induced by IL-4
  and IL-13, M2b macrophages induced by immune complexes, IL-1β and TLR agonists,
  M2c macrophages induced by IL-10, TGF-β and glucocorticoids, and M2d macrophages
  induced by leukemia inhibitory factor and IL-6'
