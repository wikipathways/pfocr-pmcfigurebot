figure_title: Dual pathways of tryptophan (Trp) metabolism and their neuropsychiatric
  implications.
caption: 'Dual pathways of tryptophan (Trp) metabolism and their neuropsychiatric
  implications. Trp crosses the blood–brain barrier (BBB) via LAT1 transporters and
  follows two competing metabolic routes. One route converts Trp to serotonin (5-HT)
  through tryptophan hydroxylase (TPH), which subsequently gives rise to melatonin,
  regulating circadian rhythms and mood. Impaired 5-HT synthesis contributes to depression
  and sleep disturbances. Alternatively, Trp is metabolized through the kynurenine
  (KYN) pathway, primarily via indoleamine 2,3-dioxygenase (IDO). This generates metabolites
  with opposing actions: quinolinic acid (QA), a neurotoxic N-Methyl-D-Aspartate (NMDA)
  receptor agonist that promotes excitotoxicity, oxidative stress, and cognitive dysfunction,
  and kynurenic acid (KYNA), a neuroprotective NMDA receptor antagonist that counterbalances
  QA’s toxicity. Dysregulation of the Trp–5-HT–KYN axis disrupts neurotransmission,
  neuroprotection, and circadian control, ultimately contributing to depression, memory
  problems, and neurodegeneration'
