figure_title: LAMP3-Gly388Arg variant induces activation of caspase-3 and ER stress
caption: A. Representative immunofluorescence image shows staining for galectin-3
  (green). *; Intracellular is defined as the LAMP3 positive cells in the intracellular
  space. †; Extracellular and cell membrane is defined the LAMP3 positive cells in
  the extracellular space and cell membrane. B. Bar chart shows the percentage of
  galectin-3 (Gal3) puncta-positive cells (n = 8). Percentage of cells expressing
  Gal3 intracellularly out of total cells between negative control (empty vector),
  positive control (LAMP3-WT), LAMP3 variants (LAMP3-Gly288Arg or LAMP3-Gly388Arg).
  *P < .05, **P < .01, n.s.; nonsignificant. C. Percentage of cells expressing Gal3
  extracellularly and within the cell membrane per total cell between empty vector,
  LAMP3-WT, LAMP3-Gly288Arg, and LAMP3-Gly388Arg. n.s.; nonsignificant. D. Caspase-3
  (Cas3), cleaved-Caspase-3 (cCas3), Caspase-8 (Cas8), cleaved-Caspase-8 (cCas8),
  and βactin protein expression levels were measured by WB analysis in cells that
  express empty vector, LAMP3-WT, or LAMP3-Gly288Arg plasmids. E. WB analysis was
  performed to measure. cCas3/Cas3, Cas3/βactin and Cas8/βactin normalized by control.
  n = 6, n = 6, and n = 3. n.s.; nonsignificant based on Student’s t test. F. WB analysis
  for cells that express empty vector, LAMP3-WT, or LAMP3-Gly388Arg plasmids. G. WB
  analysis was performed to measure cCas3/Cas3, Cas3/βactin and Cas8/βactin normalized
  by control. n = 6, n = 6, and n = 3. *P < .05. H. ER stress related protein expression
  levels were measured by WB analysis in cells that express empty vector, LAMP3-WT,
  or LAMP3-Gly288Arg plasmids. I. WB analysis was performed to measure and normalized
  by control, n = 3. n.s.; nonsignificant based on Student’s t test. J. ER stress
  related protein expression levels were measured by WB analysis in cells that express
  empty vector, LAMP3-WT, or LAMP3-Gly388Arg plasmids. K. WB analysis was performed
  to measure and normalized by control, n = 3. *P < .05, **P < .01, n.s.; nonsignificant
  based on Student’s t test. L. Schematic diagram of pathways from ER stress to the
  intrinsic apoptotic signaling pathway. These pathways converge at the activation
  of Cas3
