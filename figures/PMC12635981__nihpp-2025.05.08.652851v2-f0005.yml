figure_title: IGF1-driven translational programs in human neural progenitors are mediated
  by mTOR activation and regulated by 5’UTR-dependent mechanisms
caption: (A) Gene Ontology and pathway enrichment analysis identifies translational
  programs regulated by IGF1, including nervous system development, axon guidance,
  ribosome biogenesis, cytoplasmic translation, lipoprotein metabolism, and neuronal
  maturation pathways (e.g., SLIT–ROBO signaling).(B-C) Polysome fractionation analysis
  shows that IGF1 promotes GSX1 and ACTB mRNA association with heavier polysome fractions,
  indicating enhanced translational engagement, while Torin1 treatment shifts transcripts
  toward lighter fractions.(D) Bar graph quantifying polysome-to-monosome ratios reveals
  that IGF1 significantly enhances global translational output, while mTOR inhibition
  (Torin1) suppresses this effect.(E) 5’UTR reporter assays demonstrate that luciferase
  reporters bearing the GSX1, eEF2, or ACTB 5’UTRs exhibit reduced translation upon
  Torin1 treatment, with GSX1 5’UTR showing the greatest sensitivity, indicating 5’UTR-dependent
  mTOR control.(F-G) Immunofluorescence images and quantification show that expression
  of a GSX1 5’UTR–luciferase reporter reduces BrdU incorporation compared to control
  reporters, suggesting translational repression impairs progenitor proliferation.(H-I)
  Brightfield and GFP imaging reveal that GSX1 5’UTR–GFP constructs significantly
  reduce GFP intensity compared to control, confirming strong 5’UTR-mediated translational
  repression affecting protein output in neural progenitor colonies
article_title: Spatially Organized IGF1–mTOR Signaling Controls Human Forebrain Progenitor
  F ate Through Coordinated Transcriptional and Translational Programs
