caption: Sex-specific transcriptional programs and perturbagen predictions in glioma.
  Schematic representation of sex-stratified molecular changes from low-grade glioma
  (LGG) to high-grade glioma (HGG, top) and glioblastoma (GBM, bottom). Within each
  comparison, the left hemisphere depicts female-specific changes, and the right hemisphere
  depicts male-specific changes. Upregulated (green) and downregulated (red) genes
  and pathways are shown alongside directional arrows. Discordant perturbagens predicted
  to reverse sex-specific transcriptional signatures are listed below each panel,
  along with associated mechanisms of action (MOAs). This framework highlights divergent
  molecular trajectories in male and female gliomas and prioritizes candidate drug
  classes for sex-informed therapeutic repurposing
article_title: Integrative Transcriptomic and Perturbagen Analyses Reveal Sex-Specific
