figure_title: aa-mTORC1 signaling regulates global PDX1 DNA-binding activities in
  pancreatic β cells
caption: MIN6 cells were starved of aa for 24 h and restimulated with 1×aa for 3 h
  in the absence or presence of 100 nM rapamycin (Rap). Profiling of PDX1’s global
  DNA binding was carried out by anti-PDX1 ChIP-seq.(A) The most enriched motif discovered
  by de novo motif analysis resembles the known PDX1 consensus binding motif.(B) Venn
  diagram showing overlap in PDX1-bound regions between aa restimulation group (−aa
  versus re+aa) and aa stimulation + Rap group (re+aa versus re+aa+Rap). Select PDX1-bound
  target genes are annotated in the overlap groups.(C) Functional categories of PDX1
  target genes as revealed by pathway enrichment analysis. The top 20 enriched pathways
  in the overlapped PDX1 ChIP-seq targets are shown.(D) ChIP-seq signal tracks of
  PDX1 on select target genes in MIN6 cells
