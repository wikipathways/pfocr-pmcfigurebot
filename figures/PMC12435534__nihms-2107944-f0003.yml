figure_title: 'BAR proteomic analysis of E1E2-expressing geCHO cell clones: differential
  protein expression and pathway enrichments'
caption: (A) Pre-processing of the BAR data involved plotting total biotinylated proteins
  across all samples and their replicates to ensure consistent proteins across replicates.
  Nonproducer cell lines showed a lower number of biotinylated proteins compared to
  the producer cell lines, indicating that the BAR method successfully labeled numerous
  proximate proteins of E1E2. Replicate samples contained relatively consistent protein
  numbers within their respective groups. (B) Principal Component Analysis (PCA) of
  the normalized proteomic dataset demonstrated clear separation between nonproducer
  (parental) cell lines and E1E2 producer clones. PC1 captured 70% of the total variation,
  effectively distinguishing between the producer and nonproducer cell lines. (C)
  Welch’s t-test was performed to compare proteomic data from BAR between producer
  and nonproducer cell lines, using respective parental cell lines as controls. Volcano
  plots visualize the statistical analysis, revealing proteins that are differentially
  expressed in the producer cell lines (red dots) vs the parental cell lines (blue
  dots) with statistical significance (p-adjusted < 0.05 and Log2(fold-change) > 0).
  (D) Biological pathway enrichment analysis was performed using STRING on the approximate
  600 protein interactors that were either observed exclusively in the producer cell
  lines or differentially expressed, focusing on biological processes. The analysis
  revealed a comprehensive profile of cellular mechanisms, highlighting proteins involved
  in RNA processing, cell cycle regulation, and protein folding/transport/regulatory
  pathways
