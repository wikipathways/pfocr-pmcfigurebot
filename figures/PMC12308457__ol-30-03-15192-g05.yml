figure_title: AR is a target gene of miR-590-3p.
caption: AR is a target gene of miR-590-3p. (A) Downstream signaling pathway of miR-590-3p,
  predicted using the miRPathDB database. (B) Potential target genes of miR-590-3p,
  identified using the Targetscan and miRPathDB databases, cross-referenced with key
  breast cancer genes from the GeneCards database and genes involved in the post-translational
  protein modification pathway, with intersecting genes visualized in a Venn diagram.
  (C) Predicted miR-590-3p binding site in AR 3′UTR, along with a diagrammatic depiction
  of the AR 3′UTR wild-type or mutant reporter constructs. (D) A luciferase reporter
  assay was performed to measure the activity of the wild-type or mutant AR 3′UTR
  vector in MDA-MB-453 cells that were co-transfected with either miR-590-3p mimics
  or a negative control vector. (E) Expression of AR mRNA in 1,085 breast cancer specimens
  and 291 normal specimens, determined based on the Gene Expression Profiling Interactive
  Analysis database. (F) Mice were injected with MDA-MB-453 cells stably transfected
  with either pLC5-ciR + miR-NC, circEFR3A + miR-NC or circEFR3A + miR-590-3p. The
  mRNA expression levels of AR were measured in tissues from three groups of nude
  mice. *P<0.05; **P<0.01. AR protein expression in MDA-MB-453 cells transfected with
  (G) miR-590-3p or miR-NC and (H) miR-NC or miR-590-3p + circEFR3A or pLC5-ciR+miR-NC
  was assessed using western blotting. AR, androgen receptor; miR, microRNA; circ,
  circular; NC, negative control
