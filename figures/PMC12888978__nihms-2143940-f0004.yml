figure_title: Pathway-selective DBS locations.
caption: Pathway-selective DBS locations. A) Pathway selectivity map for the subthalamic
  region for cathodic 60 μs DBS. DBS locations associated with preferential activation
  of either the pallidothalamic (PT) (blue dots), motor hyperdirect (mHD) (pink dots),
  or cerebellothalamic (CT) (orange dots) pathway are labeled with color gradients
  indicating the selectivity index value for each dot. Black circles identify the
  most selective location for each pathway. For each black circle location (B - PT;
  C - mHD; D - CT) the full recruitment curves for all pathways are displayed along
  with a snapshot of the activated axons from a −1.5 mA 60 μs stimulus at that location
  (dotted line in the recruitment curves)
article_title: Comprehensive map of axonal pathway activation as a function of subthalamic
  deep brain stimulation location and parameter settings
