caption: (A) MEF of OGT2115-treated (1000 nM) Hpa2 LOF larvae (0.58 pmol Hpa2 MO)
  at 96 hpf. Representative images of each group below the bar. Scale bar = 20 μm.
  (B) Ratio of MEF after OGT2115 treatment compared to control counterparts. (C) MEF
  of LY294002-treated (1000 nM) Hpa2 LOF larvae (0.58 pmol Hpa2 MO) at 96 hpf. (D)
  Ratio of MEF after LY294002 treatment compared to MEF of control counterparts. (E)
  MEF of brinvanib-treated (10 nM) Hpa2 LOF larvae (0.58 pmol Hpa2 MO) at 96 hpf.
  (F) Ratio of MEF after brivanib treatment compared to control counterparts. (G)
  MEF of SU5402-treated (250 nM) Hpa2-LOF larvae (0.58 pmol Hpa2 MO) at 96 hpf. (H)
  Ratio of MEF after SU5402 treatment compared to control counterparts. (I) MEF of
  U0126-treated (100 nM) Hpa2 LOF larvae (0.58 pmol Hpa2 MO) at 96 hpf. (J) Ratio
  of MEF after U0126 treatment compared to MEF of control counterparts. Multiple comparisons
  by one-way ANOVA and Tukey multiple comparison tests (A, C, E, G, I). Pairwise comparisons
  by paired t-test (B, D, F, H, J)
