figure_title: 3-oxo-LCA Inhibits HCT116 Cell Growth by Activating FXR Signaling and
  inducing apoptosis
caption: '(A) HCT116 cells were treated with increasing doses of LCA, 3-oxo-LCA, 6-oxo-LCA
  and IsoalloLCA for 24 hours. Cell growth was then measured by quantifying ATP production,
  using Celltiter-Glo kit.(B-C) HCT116 cells were treated with increasing doses of
  LCA, 3-oxo-LCA, 6-oxo-LCA and IsoalloLCA for 24 hours. Cell growth were measured
  by Crystal Violet staining and representative bright field images were displayed
  (B), Scale bar 100μm. Quantitative data were measured as OD570nm readings (C).(D)
  HCT116 cells were treated with indicated doses of 3-oxo-LCA, 6-oxo-LCA and IsoalloLCA
  for 24-48 hours. Representative phase-contrast images of wound closure images are
  presented, Scale bar 100μm. Wound healing capabilities were quantified by relative
  cell migration distances in between.(E-F) HCT116 cells were treated with 20μM of
  3-oxo-LCA for 24 hours. Subsequently, the expression levels of FXR and its target
  genes (SHP, FGF19, IBABP, OSTα, OSTβ) (E), genes involved in the Wnt signaling pathway
  (CTNNB1, AXIN2, CD44), as well as those related to cell cycle regulation (CCND1)
  and cell proliferation (SOX9, CMYC) (F), were analyzed using RT-qPCR.(G) HCT116
  cells were treated with 20μM of 3-oxo-LCA for 24 hours. The expression levels of
  Apoptosis signaling pathway genes (CASP8, BCL2, BAK1, BAX, CASP9, CASP3, CASP7)
  were analyzed using RT-qPCR.(H) HCT116 cells were treated with 20μM of 3-oxo-LCA
  for 48 hours. The protein levels of Apoptosis signaling pathway (BCL2, Cleaved CASP3,
  CASP3, Cleaved CASP7, CASP7) were measured by Western Blot. Band intensities were
  quantified by image J and presented on the left.All experiments were repeated three
  times independently, and representative data are shown as the mean ± SEM. For two-group
  comparison, Student’s unpaired t-tests were applied. For more than two group comparisons,
  the one-way ANOVA test followed by multiple comparisons was applied. *p<0.05; **p<0.01;
  ***p<0.005; ns: not significant'
