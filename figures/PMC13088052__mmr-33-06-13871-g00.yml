figure_title: Biogenesis, composition and molecular cargo of EVs.
caption: Biogenesis, composition and molecular cargo of EVs. EVs are generated through
  the endocytic pathway, beginning with early sorting endosomes that mature into late
  sorting endosomes and subsequently form MVBs. Upon fusion of MVBs with the plasma
  membrane, intraluminal vesicles are released as exosomes, whereas fusion with lysosomes
  leads to cargo degradation. The schematic highlights the diverse molecular cargo
  carried by EVs, including nucleic acids (DNA, mRNA, miRNA, siRNA, piRNA and lncRNA),
  proteins and membrane-associated molecules. EV membranes are enriched with tetraspanins
  (CD9, CD63, CD81 and CD82), HSPs (HSP70/90), flotillin-1, MHC-I/II and adhesion
  molecules such as ICAM-1, E-selectin and β1-integrin. The ESCRT, including Alix,
  TSG101, VPS4 and CHMP4, are involved in EV biogenesis and cargo sorting. EVs, extracellular
  vesicles; MVBs, multivesicular bodies; miRNA, microRNA; siRNA, small interfering
  RNA; piRNA, Piwi-interacting RNA; lncRNA; HSP, heat shock protein; MHC-I/II, major
  histocompatibility complex class I and II; ICAM-1, intercellular adhesion molecule-1;
  ESCRT, endosomal sorting complexes required for transport; Alix, ALG-2-interacting
  protein X; TSG101, tumor susceptibility gene 101 protein; VSP4, vacuolar protein
  sorting-associated protein 4; CHMP4, charged multivesicular body protein 4
