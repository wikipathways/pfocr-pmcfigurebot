figure_title: A, Neural regions active during cognitive flexibility tasks (e.
caption: A, Neural regions active during cognitive flexibility tasks (e.g., set-shifting;
  95% CI) include the cingulate cortex, several areas of the orbitofrontal and frontal
  cortex, in addition to the putamen, caudate, and striatum. The complete list of
  implicated regions derived from the term meta-analysis can be found in B. The underlying
  white matter structure of the cognitive flexibility function (top row) was found
  to be composed of 38 independent tracts, which are also listed in Table 2. The intricacy
  of this wiring is illustrated by the common convergency of the left cingulum bundle,
  the cortico-striatal pathway, and the corpus callosum into distinct regions of the
  cingulate, prefrontal, and frontal cortex and across the various neural areas of
  cognitive flexibility. Twenty million tracts were traced by q-space diffeomorphic
  reconstruction (DSI-studio.labsolver.org)10 using the quantitative anisotropy tractography
  data from the Human Connectome Project atlas of the adult white matter
