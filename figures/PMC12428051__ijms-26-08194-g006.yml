figure_title: 'FSTL1, expressed by skeletal muscle during training, can act in two-fold
  ways: it can protect cardiomyocytes during ischemia, but also can act as a profibrotic
  factor.'
caption: 'FSTL1, expressed by skeletal muscle during training, can act in two-fold
  ways: it can protect cardiomyocytes during ischemia, but also can act as a profibrotic
  factor. Through Akt and AMPK signaling, it prevents muscle apoptosis through the
  AKT/eNOS/NO pathway, and through mTORC2 it promotes muscle proliferation. By acting
  through TGF-β1 (which also promotes FSTL1 expression) it activates fibroblasts and
  promotes their diversification, which leads to muscle fibrosis. It does this by
  activating the SMAD2/3 pathway, and MAPK, which promotes ERK, JNK, and p38 signaling.
  FSTL1 is an inhibitor of myostatin. Akt: kinase B protein; AMPK: AMP-activated kinase
  protein; eNOS: endothelial nitric oxide synthase; mTORC2: mTOR Complex 2; MAPK:
  mitogen-activated protein; ERK: extracellular signal-regulated kinase; JNK: c-Jun
  N-terminal kinase'
