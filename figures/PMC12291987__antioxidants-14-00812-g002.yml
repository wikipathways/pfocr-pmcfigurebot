figure_title: Role of Nrf2 in cellular metabolic/bioenergetic pathways.
caption: 'Role of Nrf2 in cellular metabolic/bioenergetic pathways. Nrf2 has the capability
  to activate and modulate multiple cellular components that are involved in energy
  production, among them the glucose receptor Glut1, enzymes associated with glycolysis,
  the pentose phosphate pathway, the TCA cycle, anaplerosis, and fatty acid oxidation,
  as well as elements regulating ATP production at the mitochondrial electron transport
  chain ( ) (red star symbol). Notably, many of these integral components, including
  the transcription factor Nrf2 itself with its concomitant downstream antioxidant
  response, have been reported downregulated in AD () (yellow star symbol). Thus,
  enhancing Nrf2 expression and/or upregulation may constitute an attractive translational
  approach in the field of neurodegeneration and AD, with potential to exert a positive
  impact not only in the metabolic aspects of the disease but also in boosting the
  antioxidant response and reducing the detrimental effects of oxidative stress on
  proteins, lipids and nucleic acids. Complex V of the respiratory chain, also known
  as ATP synthase, is represented in light blue while Complexes I-IV are illustrated
  in color beige to differentiate their function. Complex V catalyzes the synthesis
  of ATP using the proton gradient generated by the complexes I-IV. Abbreviations:
  G6P, Glucose 6 phosphate; PEP, phosphoenolpyruvate; PK, pyruvate kinase; ME1, malic
  enzyme 1; PDH, pyruvate dehydrogenase; ICDH, isocitrate dehydrogenase; αKG, alpha
  ketoglutarate; KGDH, ketoglutarate dehydrogenase; SDH, succinate dehydrogenase;
  OxalAc, oxaloacetate; CS, citrate synthase; FAs, fatty acids; FATP, fatty acid transport
  proteins; FAO, fatty acid oxidation; GScx, glutathione synthase complex; MMP, mitochondrial
  membrane potential; TCA; tricarboxylic acid; CoQ; coenzyme Q; AcCoA; acetyl-coenzyme
  A; MDH; malate dehydrogenase 6PGD; 6-phosphogluconate dehydrogenase; G6PDH; glucose-6-phosphate
  dehydrogenase; R5P; ribose 5-phosphate; CPT1, carnitine palmitoyltransferase 1'
