figure_title: Key differential metabolites in hepatic metabolomics of NASH mice indicate
  potential therapeutic targets of PCP.
caption: 'Key differential metabolites in hepatic metabolomics of NASH mice indicate
  potential therapeutic targets of PCP. (A,B) Regulation patterns of hepatic metabolites
  and key differential metabolites in each group under positive and negative ion modes
  (based on p < 0.05, VIP > 1, log2FC ≥ 1 or ≤−1; red dots represent up-regulated
  metabolites, green dots represent down-regulated metabolites, and purple stars represent
  key differential metabolites). (C–E) Levels of key differential metabolites 20-hydroxyprostaglandin
  e2, ophiobolin a, and taurocholate in the three groups. (F–I) Changes in upstream
  metabolites (3-Sulfino-L-alanine, hypotaurine, taurine, and cholic acid) of the
  key differential pathway taurine and hypotaurine metabolism. Normality was assessed
  using the Shapiro–Wilk test, and homogeneity of variance was evaluated using the
  Brown–Forsythe test. Data are presented as mean ± SD (n = 5). * p < 0.05, ** p <
  0.01, *** p < 0.001 (ND vs. WDC); # p < 0.05 (WDC vs. WDC_PCP). p-values for taurocholate
  and cholic acid were determined by Kruskal–Wallis test with Dunnett’s multiple comparisons
  test; p-values for 20-hydroxyprostaglandin e2, ophiobolin a, and taurine were determined
  by Brown–Forsythe and Welch ANOVA with Dunnett’s T3 multiple comparisons test; p-values
  for 3-Sulfino-L-alanine and hypotaurine were determined by one-way ANOVA with Dunnett’s
  multiple comparisons test'
