figure_title: Kaplan–Meier curves illustrating overall survival stratified by JAK-STAT
  pathway mutation status in colorectal cancer (CRC) across age-, ancestry-, and treatment-defined
  subgroups.
caption: Kaplan–Meier curves illustrating overall survival stratified by JAK-STAT
  pathway mutation status in colorectal cancer (CRC) across age-, ancestry-, and treatment-defined
  subgroups. Survival outcomes are displayed separately for (a) early-onset (EOCRC)
  Hispanic/Latino (H/L) patients who received FOLFOX, (b) EOCRC H/L patients who did
  not receive FOLFOX, (c) late-onset (LOCRC) H/L patients treated with FOLFOX, (d)
  LOCRC H/L patients not treated with FOLFOX, (e) EOCRC Non-Hispanic White (NHW) patients
  treated with FOLFOX, and (f) EOCRC NHW patients not treated with FOLFOX. Each panel
  contrasts individuals harboring JAK-STAT pathway alterations with those lacking
  mutations, highlighting potential survival differences within each clinical and
  demographic group. Confidence bands (95%) are shown around the survival curves,
  and accompanying risk tables provide the number of patients remaining under observation
  at successive time points
