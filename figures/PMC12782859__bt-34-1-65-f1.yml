figure_title: The Wnt signaling network is broadly divided into the canonical (β-catenin
  dependent) and non-canonical (β-catenin independent) pathways.
caption: The Wnt signaling network is broadly divided into the canonical (β-catenin
  dependent) and non-canonical (β-catenin independent) pathways. In the absence of
  Wnt ligands, β-catenin levels in the cytoplasm are tightly controlled by a multiprotein
  “destruction complex” composed of glycogen synthase kinase-3β (GSK-3β), adenomatous
  polyposis coli (APC), and Axin. Within this complex, β-catenin is sequentially phosphorylated
  and subsequently targeted for ubiquitination and proteasomal degradation, preventing
  its nuclear accumulation. Activation of the canonical pathway occurs when Wnt ligands,
  such as Wnt1 or Wnt3a, bind to frizzled (FZD) receptors together with the co-receptors
  LRP5/6. This ligand-receptor interaction disrupts the destruction complex, inhibits
  GSK-3β, and allows β-catenin to accumulate in the cytoplasm. The stabilized β-catenin
  then translocates into the nucleus, where it interacts with TCF/LEF transcription
  factors and cofactors such as CBP to activate downstream target genes involved in
  cell proliferation, differentiation, and survival. In contrast, the non-canonical
  pathways triggered by ligands such as Wnt5a utilize FZD receptors or FZD/Ror1/2
  receptor complexes but function independently of β-catenin. These branches regulate
  processes including planar cell polarity and intracellular calcium signaling. The
  extracellular regulation of Wnt signaling is also critical. The co-receptor LRP5/6
  contains four β-propeller (BP) domains that serve as Wnt ligand-binding sites. Inhibitors
  such as Dickkopf-1 (DKK1) and sclerostin can bind to LRP5/6 and block ligand access,
  thereby suppressing canonical signaling. DKK1 specifically interacts with the BP1
  and BP3 domains of LRP5/6 and, in association with Kremen, induces receptor internalization.
  Sclerostin preferentially binds to the BP1 domain of LRP5/6, and its inhibitory
  activity is enhanced by interaction with LRP4. Additional modulators further fine-tune
  signaling. The secreted frizzled-related protein (sFRP) family acts as a decoy receptor
  by binding Wnt ligands through their cysteine-rich domains, preventing ligand interaction
  with FZD. The ubiquitin ligases ZNRF3 and RNF43, which are themselves Wnt target
  genes, mediate degradation of FZD receptors, establishing a negative feedback loop.
  Conversely, the R-spondin (RSPO) family of secreted proteins enhances signaling
  by binding to LGR receptors and promoting the degradation of ZNRF3/RNF43, thereby
  stabilizing FZD and amplifying pathway activity. Through this intricate interplay
  of activators, inhibitors, and feedback regulators, the Wnt/β-catenin system maintains
  a delicate balance that is essential for normal tissue development and homeostasis,
  while its dysregulation underlies diverse pathological conditions
article_title: Roles of Wnt/β-Catenin Signaling in Osteoporosis, Disease Pathogenesis,
