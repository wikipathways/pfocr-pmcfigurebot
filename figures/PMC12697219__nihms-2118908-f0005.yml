figure_title: Bulk ATAC sequencing analysis of ISO- and LPS-treated bone marrow-derived
  hematopoietic stem and progenitor cells (HSPCs)
caption: (A) Mice were injected i.p. with 300 mg/kg isoproterenol (ISO), 2.5 mg/kg
  lipopolysaccharide (LPS), or diluent control (PBS). Bone marrow-derived HSPCs were
  collected at day 7 for bulk ATAC sequencing. (n=3/group) (B) Volcano plots showing
  peaks with significantly increased and decreased accessibility in the ISO and LPS
  groups relative to control. (C) Venn diagrams showing the number of common and unique
  peaks with increased or decreased accessibility between the ISO and LPS groups on
  day 7 (adjusted P<0.05, log2 fold change >2/<−2). (D) Pathway enrichment analysis
  of genes associated with peaks of increased or decreased accessibility in the ISO
  and LPS groups; the top 5 pathways are shown
