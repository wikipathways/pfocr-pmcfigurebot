caption: 'L. paracasei ZJUZ2-3 was isolated from a GC patient normal tissue. (A) The
  abundance of Lactobacillus in patients with GC (N=49). (B) The relative abundance
  of L. paracasei in tumor tissues and normal tissues of GC patients. (C) Representative
  FISH images of gastric tissue sections from GC patients (blue: nuclear, green: L.paracasei
  probe); scale bars, 100 μm. (D) Isolation of a novel L.paracasei strain from a GC
  patient''s normal tissue. (E) The whole genome map of L.paracasei ZJUZ2-3. The circle
  chart displays GC content, sequencing depth, gene element display, and COG function
  display from the outside to the inside. (F) Phylogenetic tree of L.paracasei ZJUZ2-3.
  A phylogenetic tree based on core single copy genes constructed using Neighbour
  joining clustering. (G) Functional annotation of L.paracasei ZJUZ2-3 genome using
  KEGG metabolic pathway. Data in A and B were analyzed by t tests; Means ± SD. ns
  ≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
