figure_title: Comparative metabolomic analysis of Paenibacillus polymyxa strains JX-1,
  JX-2 and YPDA.
caption: Comparative metabolomic analysis of Paenibacillus polymyxa strains JX-1,
  JX-2 and YPDA. (A) Principal component analysis (PCA) score plot of metabolic profiles
  derived from the fermentation broths of strains JX-1 and JX-2. Each point represents
  an independent biological replicate. (B) Volcano plot depicting differentially accumulated
  metabolites between JX-1 and JX-2. Each point represents a metabolite. Red points
  indicate significantly upregulated metabolites in JX-1 (fold change > [threshold]
  and p-value < 0.05), blue points indicate significantly downregulated metabolites,
  and gray points represent non-significant changes. The dashed lines mark the thresholds
  for statistical significance and fold change. (C) KEGG pathway enrichment analysis
  of metabolites upregulated in strains JX-1 and JX-2 relative to a YPDA medium control.
  The top enriched pathways are shown. The color scale represents the −log10 (p-value),
  and the dot size corresponds to the enrichment ratio. (D) Hierarchical clustering
  heatmap of metabolites significantly upregulated in JX-1 compared to JX-2 after
  stringent filtering (confident database match and MS/MS score ≥ 70). The color scale
  from blue to red indicates relative abundance from low to high across samples (JX-1,
  YPDA and JX-2 replicates). Key annotated antimicrobial compounds or peptide classes
  are indicated on the right
