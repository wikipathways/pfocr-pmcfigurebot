figure_title: Inactivation of an A46 to A32 pathway reduces appetitive motivation
  with this effect blocked by a ketamine infusion in A25
caption: '(A) Schematic of A46 terminal pathway manipulations through DCZ infusion
  (100nM) in A32, A32v or A25 of the marmoset. (B) DCZ infusion into A32 reduced the
  total responses marmosets made in comparison to the previous day, with DCZ into
  A32v and A25 showing no effect (n=6, rmANOVA, region*treatment interaction, F(1.73,
  8.63)=33.17, p<0.001, η2= 0.869; post-hoc: A32 Veh vs DCZ, p=0.001, d=2.77; A32
  DCZ vs A32v DCZ, p=0.003, d=2.78; A32 DCZ vs A25 DCZ, p=0.004, d=2.65). (C) Schematic
  for assessing A25’s involvement in A46 to A32 pathway induced motivational deficits
  through A25 ketamine infusion. (D) Intra-A25 ketamine infusion blocked the ability
  of an A32 DCZ infusion from reducing responses (n=4, rmANOVA, pretreat x treat interaction,
  F(1,3)=15.31, p=0.030, η2= 0.836; post-hoc: Sal/Veh vs Sal/DCZ, p=0.014, d=2.60;
  Sal/DCZ vs Ket/DCZ, p=0.019, d=2.32; Sal/Veh vs Ket/Veh, p=0.461). Data are displayed
  as mean ± SEM and individual data points with significant Sidak corrected post-hoc
  comparisons indicated by *'
article_title: Dysfunction in primate dorsolateral prefrontal area 46 affects motivation
  and anxiety
