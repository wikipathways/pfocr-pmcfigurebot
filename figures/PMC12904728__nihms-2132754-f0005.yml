figure_title: DEC1 sustains mitochondrial integrity and bioenergetics in maturing
  SC-β cells
caption: (A) DEC1-ablated SC-β cells exhibit mitochondria with increased autophagy
  and reduced membrane potential, along with lower reactive oxygen species generation
  and glucose import. Data are distributions, normalized to mode, of flow cytometry
  for mitophagy (Mtphagy staining), mitochondrial membrane potential (tetramethylrhodamine
  ethyl ester [TMRE] staining), cellular reactive oxygen species (CellROX staining),
  and glucose uptake (2-NBDG staining) in CD49a-gated day 14 SC-β cells (N = 1 differentiation
  [2 more independent differentiations in Figure S4D], n ≥ 1,000 cells).(B) DEC1 loss
  stifles oxygen consumption rate (OCR; left) and extracellular acidification rate
  (ECAR; right). Data are from day 14 DEC1+/+ and DEC1−/− SC-islets in response to
  20 mM glucose and a physiological amino acid mixture (G20+AAM); oligomycin; FCCP;
  and rotenone with antimycin A. Data are the mean ± SEM from N = 4 differentiations,
  each with n = 3–4 replicate measurements of 8 similar-sized day 14 SC-islets.(C)
  ATP production-linked respiration (left) and glycolysis (right) rates are impaired
  in DEC1−/− SC-islets. Data are from (B).(D) Glucose-stimulated insulin secretion
  defect in DEC1-knockout SC-islets is not rescued by in vivo kidney capsule transplant.
  Data are serum human insulin secreted into the blood of fasted immunodeficient mice
  transplanted with DEC1+/+ or DEC1−/− SC-islets before and 30 and 60 min after intraperitoneal
  glucose injection 4 months post-transplant. Data are the mean ± SEM from N = 4 differentiations
  with n = 11–12 mice each.(E) Pathway of glucose metabolism and downstream signaling
  targeted by insulinotropic agents screened for GSIS rescue experiments.(F and G)
  Glucose-independent PKC activator PMA, muscarinic receptor agonist carbachol, and
  metabolic flux enhancers (oxamate with methyl-pyruvate, DCA, and dorzagliatin) restore
  insulin secretion in day 14 DEC1−/− SC-islets under sequential static glucose incubations
  (F) (2.8–20 mM glucose) or dynamic conditions for PMA (G) relative to DEC1+/+ day
  14 SC-islets. Data are from N = 3 differentiations, each with n = 2–3 replicate
  measurements of 50–100 SC-islets. Data are the mean ± SEM.*p < 0.05, **p < 1E–2,
  ***p < 1E–3, and ****p < 1E–4, Wilcoxon test (A), and unpaired Welch’s t tests (B–D,
  F and G)
