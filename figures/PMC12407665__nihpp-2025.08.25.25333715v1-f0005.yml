figure_title: MOFA+ integration of spatial proteomics and transcriptomics reveals
  molecular drivers of fallopian tube lesion progression
caption: (A-D). MOFA+ analysis24 excluding FOXJ1-positive (FOXJ1pos) and metastasis.
  The first two MOFA factors for epithelial (A) and stromal (C) samples with points
  representing samples; colored by cell type/lesion state. Black and red vectors show
  the percentage of variability of the deep visual proteomics (DVP) and Nanostring
  GeoMx transcriptomics (Nanostring) datasets captured by each MOFA factor. Box plots
  of MOFA factor 1 values across epithelial (B) and stromal (D) cell states. FT, fallopian
  tube. FOXJ1neg, FOXJ1-negative. P53, p53 signature.(E-F) GSEA using MOFA Factor
  1 feature weights as a ranked list for proteins and transcripts in the epithelium
  (E) and stroma (F), excluding FOXJ1-positive (FOXJ1pos) and metastasis (Table S5I,
  J). Circle size is proportional to −log10 (FDR). Red, DVP. Blue, Nanostring. NES,
  normalized enrichment score. A positive NES indicates proteins/gene-driven pathways
  which are increased, and a negative NES indicates proteins/gene-driven pathways
  which are decreased
