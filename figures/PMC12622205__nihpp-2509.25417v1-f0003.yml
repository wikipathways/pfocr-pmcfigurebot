figure_title: Computational Drug Repurposing for Alzheimer’s Disease via Sheaf Theoretic
  Population-Scale Analysis of snRNA-seq Data
caption: a. UMAP plot of the microglial state transitionary cells taken from Sun et.
  al. Cells are colored by their activation status. b. Schematic overview of the interactions
  between disease associated microglia cells and the BBB in AD. c. UMAP plots of the
  early Inflammatory and Phagocytic microglia cells, with up-regulated DEGs in the
  phagocytic state being used to construct a PPI complex. Top dysregulated genes in
  terms of logFC are labeled. d. Focused analysis of PPI structures surrounding our
  top scoring topologically significant genes from the PSL analysis. The largest connected
  component made up of topological genes is extracted and its structure reveals four
  primary axes joined by a central HIF1A / PPARG / APOE backbone. e. The topological
  genes and their surrounding PPI structures were then used to conduct a pathway analysis
  via the GO databases in GSEApy, revealing coherent and coordinated pathways driving
  different aspects of phagocytosis as well as hypoxia, antigen presentation, and
  outside immune recruitment
