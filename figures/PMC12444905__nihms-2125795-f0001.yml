figure_title: Yeast Saccharomyces cerevisiae as a model system to study the in vivo
  role of PS
caption: (A) Aminoglycerophospholipid biosynthetic pathways in yeast. PS is biosynthesized
  by condensation of CDP-DAG and serine in the endoplasmic reticulum (ER) via a reaction
  catalyzed by Cho1. PS is then transported to mitochondria or endosome, where it
  acts as a precursor for PE biosynthesis. In situ decarboxylation of PS by Psd1 and
  Psd2 generates PE in mitochondria and endosome, respectively. PE can also be biosynthesized
  in the ER via the Kennedy pathway from the endogenous pool of Etn phosphate generated
  from the breakdown of sphingolipids or the exogenously supplied Etn. PE undergoes
  sequential methylation reactions to form PC in the ER. Phospholipid exchange between
  the ER and mitochondria occurs at the mitochondria associated ER membranes (MAM-ER).(B)
  An iodine-stained two-dimensional thin layer chromatography image of phospholipids
  extracted from the wild-type (WT), and ethanolamine (Etn) supplemented WT, psd1∆psd2∆,
  cho1∆ cells. The lack of a PS spot in cho1∆ + Etn cells is outlined in a red circle.(C)
  Targeted lipidomic analysis of the PS in lipids extracted from the indicated yeast
  cells.PA, Phosphatidic acid; PI, Phosphatidylinositol; PS, Phosphatidylserine; PE,
  Phosphatidylethanolamine; CDP-DAG, Cytidine diphosphate diacylglycerol; PMME, Phosphatidylmonomethylethanolamine;
  PDME, Phosphatidyldimethylethanolamine; PC, phosphatidylcholine; CL, cardiolipin
article_title: Mitochondrial dysfunction and lipid dysregulation in yeast lacking
