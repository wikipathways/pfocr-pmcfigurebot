figure_title: A model for the role of U4 in antagonizing and promoting Brr2p destabilization
  of U4/U6 stems I and II, as well as the intervening 5’SL.
caption: A model for the role of U4 in antagonizing and promoting Brr2p destabilization
  of U4/U6 stems I and II, as well as the intervening 5’SL. Panel A through panel
  F outlines a pathway for how Brr2p binds and likely pulls on U4 snRNA to unwind
  first stem I, which leads to formation of U4-ISL1 to prevent reannealing, and then
  further pulls to destabilize the U5–5’SL and stem II. (See Discussion for details.)
article_title: Brr2p-mediated unwinding of U4/U6 is promoted by a mutually exclusive
  intra-molecular stem loop in U4 and involves destabilization of the 5’ stem-loop
  of U4
