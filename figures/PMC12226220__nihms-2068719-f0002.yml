figure_title: 15-Deoxy-Delta-12,14-prostaglandin J2 (15d-PGJ2) levels mediate cell-cycle-dependent
  SG heterogeneity
caption: A) Schematic of signaling pathways leading to SG formation. B) Western blot
  of various SG pathway regulators in Asynchronous and G2-phase MiaPaCa-2 cells as
  in 1F.C) ELISA for secreted 15d-PGJ2 levels in Asynchronous and G2-phase HPAC, MiaPaca-2,
  and NCI-H747 cells as in 1F. Data are mean +/− SEM, n=3, and individual average
  values (circles) are shown for each experiment.D) Schematic of the experimental
  approach used to assess the effect of 15d-PGJ2 on SG formation in asynchronous and
  G2-phase cells.E) Left panel-Representative immunostaining of G3BP1 and DAPI in
  Asynchronous and G2-phase MiaPaCa-2 cells treated with the indicated concentrations
  of 15d-PGJ2 for 30 min prior to oxidative stress as in 1A. Right panel-Quantification
  of SG index of cells treated as in D. SG index was derived as in 1G. Data are mean
  SG index +/− SEM, n=3.F) Schematic of 15d-PGJ2 production pathwayG) Representative
  immunostaining of MiaPaCa-2 cells treated with either vehicle (Asynchronous) or
  Ro-3306 (G2-phase), and the L-PGDS inhibitor (300 μM for 16 h) and stained with
  G3BP1 antibody and DAPI. For the final hour of these treatments, cells were subjected
  to oxidative stress as in 1A.H) Quantification of SG index in MiaPaCa-2 and HPAC
  cells treated as in G. Data are mean SG index +/− SEM from at least 3 independent
  experiments, and individual average values (circles) are shown for each experiment.Scale
  bar, 10μm. *p<0.05, **p<0.01, ****p<0.0001 by unpaired t-test for C, E and One-Way
  Anova with Tukey’s posthoc test for H
