figure_title: Signaling pathways linked to cytoprotection and PGC-1α protein in adult
  cortical astrocytes after melatonin incubation (300 µM, 24 h).
caption: 'Signaling pathways linked to cytoprotection and PGC-1α protein in adult
  cortical astrocytes after melatonin incubation (300 µM, 24 h). Expression of genes
  encoding: (A) Nrf2, (B) HO-1, (C) AMPK, (D) SIRT1 (E) PGC-1α. Protein content: (F)
  PGC-1α. Orange bars represent control group, and blue bars represent melatonin-treated
  group. Data are expressed as mean ± SD (n = 7 independent biological replicates
  for gene expression evaluations; n = 6 independent biological replicates for Western
  blotting analysis). Each biological replicate represents an independent culture
  (with each culture derived from a pooled preparation of cortices from two animals).
  Statistical differences between control and melatonin groups were analyzed using
  Student’s t-test for independent samples. p < 0.05 was considered statistically
  significant (p-values were described for each parameter in the Results section).
  * Indicates difference in relation to the control condition'
