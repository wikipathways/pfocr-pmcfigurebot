figure_title: Immunolabeling with cell death pathway antibodies for control (CT) and
  pneumonia-induced groups (G2, G3, G4).
caption: Immunolabeling with cell death pathway antibodies for control (CT) and pneumonia-induced
  groups (G2, G3, G4). In the negative control, the primary antibody was substituted
  with tris-buffered saline (TBS) (first row). From the control group to group 4,
  Beclin-2 (Bcl-2) granular cytoplasmic labeling (second row) occurs in the apical
  portion of the bronchiole cells. For cathepsin D antibodies (third row), the marking
  is more concentrated in the bronchiole, covering the base of the cell to its apical
  portion, with a granulated appearance in all groups analyzed. For Bax (fourth row),
  uniform and diffuse labeling was observed throughout the bronchiole, with a gradual
  increase in intensity throughout the analyzed groups. Anti-caspase-3 labeling (fifth
  row) was more concentrated in the apical region of the bronchiole cells
