figure_title: SIINFEKL-based MHC I antigen presentation assay for evaluating PSI activity.
caption: SIINFEKL-based MHC I antigen presentation assay for evaluating PSI activity.
  Viral antigens are fused in-frame to eGFP and the SIINFEKL peptide (derived from
  chicken ovalbumin) and transfected into H2Kb-expressing 293 cells. eGFP fluorescence
  serves as a readout of antigen expression (Q2 + Q3), while SIINFEKL is processed
  and presented via the endogenous MHC I pathway. Surface presentation of SIINFEKL-H2Kb
  complexes is detected using a conformation-specific anti-SIINFEKL- H2Kb monoclonal
  antibody, enabling quantification of MHC I presentation (Q2). The antigen presentation
  efficiency is calculated as the ratio, Q2/(Q2 + Q3). This assay can be followed
  by functional validation using OT-1 CD8+ T cells, which recognize the SIINFEKL-H2Kb
  complex, to assess cytokine production or target cell lysis. Secondary functional
  screening can be performed with an SIINFEKL-specific tetramer
