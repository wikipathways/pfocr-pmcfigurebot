figure_title: Stable isotope tracing and genetics identify pathway intermediates in
  anaerobic bacterial uric acid metabolism
caption: (A) Schematic showing the gene cluster for C. sporogenes, and the workflow
  for stable isotope tracing and identification of labeled and 13C-labeled feature
  pairs. Arrows indicate ClosTron mutants and asterisks indicate genes that were deleted
  by CRISPR due to polar effects of ClosTron mutants. (B) Extracted ion chromatograms
  from HILIC LC-MS for the most abundant unlabeled and 13C-labeled feature pairs in
  each of the mutants. (C) Combining enzyme family level predictions of mass differences
  with patterns of intermediate accumulation (by HILIC LC-MS) to place intermediates
  and genes within the pathway. For B, three replicates were performed, and representative
  data are shown. For C, data represent means ± standard deviations from three replicates
