caption: 'Pri-MP elicits antitumor effects in vivo through activation of the p53 signaling
  pathway. (A) TUNEL assay (scale bar: 30 μm) and quantification of WERI-Rb1 tumor
  sections. Representative IHC images of Ki-67, HDMX, and p53 and statistical analysis
  (scale bar: 40 μm). (B, C) Volcano plot (B) and heatmap(C) of differentially expressed
  genes between Pri-MP and the control group. (D, E) GSEA and hierarchical clustering
  of genes results showing the p53 signaling (D) and Apoptosis(E) pathway differentially
  expressed in response to Pri-MP and the Control group (n = 3). * p < 0.05, **, p
  < 0.01, ***, p < 0.001, ns. not significant'
