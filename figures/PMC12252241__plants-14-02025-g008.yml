figure_title: Integrated pathways of differentially accumulated metabolites (DAMs)
  and differentially expressed genes (DEGs) involved in flavonoid biosynthesis.
caption: Integrated pathways of differentially accumulated metabolites (DAMs) and
  differentially expressed genes (DEGs) involved in flavonoid biosynthesis. The pathway
  was reconstructed based on k00941, k00942, k00943, and k00944 in the KEGG database.
  Red and blue colors denote upregulated and downregulated genes, respectively. The
  red and green colors represent high and low relative contents of flavonoids, respectively.
  Key genes include PAL (phenylalanine ammonia-lyase), 4CL (4-coumarate CoA ligase),
  DFR (flavanone 4-reductase), CHS (chalcone synthase), FLS (flavonol synthase), F3H
  (flavanone 3-dioxygenase), CHI (chalcone-flavonone isomerase), anthocyanidin 3-O-glucosyltransferase,
  LAR (leucoanthocyanidin reductase), C4H (trans-cinnamate 4-monooxygenase), and F3′H
  (flavonoid 3′-hydroxylase), ANS (anthocyanidin synthase), F3′5′H (flavonoid 3′,5′-hydroxylase),
  and anthocyanidin 3-O-glucosyltransferase
