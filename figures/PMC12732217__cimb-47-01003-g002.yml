figure_title: Visualization of KEGG Database Signaling Pathway Enrichment.
caption: Visualization of KEGG Database Signaling Pathway Enrichment. Gene Set Enrichment
  Analysis (GSEA) was performed using the ShinyGO database (https://bioinformatics.sdstate.edu/go/,
  accessed on 1 May 2025). All 71 proteins with protein–protein interactions (PPIs)
  with CRP curated by BioGrid (https://thebiogrid.org) from published data were used
  and the KEGG Legacy (Kyoto Encyclopedia of Genes and Genomes) database was queried.
  Signaling pathways are listed by fold enrichment and ranked in descending order.
  Enrichment is determined based on the number of CRP PPIs input that overlap with
  the total number of proteins in each dataset/signaling pathway. Color indicates
  false-discovery rate (FDR) q-value, with red indicating highly significant (FDR
  q < 0.000000005) and blue indicating somewhat significant (FDR q < 0.005). Size
  of node indicates the number of genes, ranging from 5 to 12 CRP PPIs identified
  in the gene set. The top 5 most statistically significant enriched signaling pathways
  observed were involved in biosynthetic processes related to glycosaminoglycans (Keratan
  Sulfate, Chondroitin Sulfate, Heparan Sulfate) and glycosphingolipids as well as
  the “ECM–Receptor Interactions” dataset. The highest number of proteins associated
  with specific pathways included “ECM–Receptor Interactions”, “Pathways in Cancer”,
  “Metabolic Pathways”, “Focal Adhesions”, “Small Cell Lung Cancer”, “PI3K–Akt Signaling
  Pathway”, “HPV Infection”, “Amoebiasis”, and “Taxoplasmosis”
