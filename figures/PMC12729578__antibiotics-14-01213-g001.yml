figure_title: Schematic overview of lipopolysaccharide (LPS) modification pathways
  contributing to polymyxin resistance in Gram-negative bacteria.
caption: Schematic overview of lipopolysaccharide (LPS) modification pathways contributing
  to polymyxin resistance in Gram-negative bacteria. Gram-negative bacteria can detect
  a variety of environmental signals—such as exposure to polymyxins and other cationic
  antimicrobial peptides, low Ca2+ or Mg2+ availability, high Fe3+ concentrations,
  or acidic pH—which stimulate the histidine kinases PmrB and PhoQ (denoted by star
  symbols). Phosphorylation-dependent activation steps are indicated with dashed arrows,
  while thick arrows illustrate the downstream effects. Signal transduction through
  the PmrA–PmrB and PhoP–PhoQ two-component systems triggers expression of the pmrCAB
  and arnBCADTEF operons, respectively. The pmrCAB encodes enzymes that attach pEtN
  to lipid A, while arnBCADTEF operon mediates the synthesis and transfer of 4-amino-4-deoxy-L-arabinose
  (L-Ara4N) to lipid A. These chemical modifications, carried out by pEtN transferase
  and L-Ara4N formyltransferase (thick arrows), reduce the binding affinity of colistin
  for the bacterial membrane. Loss-of-function mutations in mgrB, a negative regulator
  of PhoP–PhoQ, abolish feedback inhibition, causing constitutive phoP–phoQ expression
  and overproduction of L-Ara4N. In addition, plasmid-borne mcr genes encode pEtN
  transferases that replicate the chromosomal pEtN modification pathway but enable
  its rapid dissemination between bacterial species via horizontal gene transfer
