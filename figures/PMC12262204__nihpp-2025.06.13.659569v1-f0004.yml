figure_title: Energetic and structural characteristics of peptide (27-37) segment
  unbinding obtained from REVO simulations.
caption: Energetic and structural characteristics of peptide (27-37) segment unbinding
  obtained from REVO simulations.(a) NEFE profiles of CGRP(27-37) (green) and ssCGRP(27-37)
  (blue) along the tail (32-37) RMSD of peptides. The RMSD points where conformation
  snapshots are chosen are shown in corresponding colors to the peptide for the rest
  and mean RMSD value for the unbound conformations shown in red. (b) (left) Evolution
  of the beta-turn distance between the main oxygen atom of G33 and the hydrogen atom
  in the main nitrogen of A36 as a function of ligand tail RMSD for both peptides
  computed from REVO simulations. The shaded areas show the standard deviation of
  distances. (right) The NEFE profiles along beta-turn distance are shown for both
  peptides. (c) The representative unbinding pathway trajectories from REVO simulations
  for CGRP(27-37) (left) and ssCGRP(27-37) (right). The residue 34 on peptides is
  selected as middle point of the tail region (shown as ball representation) to show
  the unbinding pathways along the trajectory and is color-mapped from blue (bound)
  to red (unbound) to reflect progression along the unbinding coordinate. The weight
  change along the trajectories are shown in the graph for both peptides
