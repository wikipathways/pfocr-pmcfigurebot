caption: 'Analysis of TFAM expression in astrocytomas: (A) q-PCR analysis of TFAM
  expression in astrocytomas of different grades of malignancy showing a significant
  decrease in TFAM expression with increasing malignancy. (B) In silico analysis of
  the TCGA astrocytoma database confirming a significant decrease in TFAM expression
  in GBM relative to AG2 and AG3. GBM subtype according to the metabolic axis, based
  on Garofano pathway-based classification, shows lower TFAM expression in GPM than
  in MTC. (C) Representative images of TFAM immunostaining in AG2, AG3, and GBM showing
  lower expression in GBM (magnification 400×). (D) Immunolabelling analysis showing
  TFAM intensity label score and a significant decrease in GBM cases compared to AG2
  and AG3 on Dunn’s post hoc test. Dots represent each case analyzed, and the line
  represents mean ± SD. AG2, astrocytoma grade 2; AG3, astrocytoma grade 3; GBM, glioblastoma;
  MTC, mitochondrial subtype; GPM, glycolytic/plurimetabolic subtype; SD, standard
  deviation; TCGA, The Cancer Genome Atlas. Statistically significant differences
  represented by asterisks: * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
