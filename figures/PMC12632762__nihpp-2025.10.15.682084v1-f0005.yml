caption: (A)CXCL12 and CXCL13 expression in situ within select EBV+ and EBV− HIV-NHLs
  by COO.(B) Tissue-stratified CXCL12 and CXCL13 expression grouped by HIV-NHL COO
  and EBV.(C) Stratified expression of GAS6, TAM-family receptors (AXL, TYRO3), and
  CXCL12 within tissues across EBV+ (red) and EBV− (blue) HIV-NHLs (left panel); EBV+
  HIV-NHL enrichment of GAS6-AXL cell-cell communication network with sending and
  receiving phenotypes denoted by chord arrows (right panel).(D) Enrichment of TNFSF13B-TNFRSF13C
  (BAFF-BAFFR) interactions in GC and EBV-negative non-GC HIV-NHLs (left panel); dotplot
  of BAFF pathway genes in tumor and stromal tissue stratified by COO and EBV status
  (right).(E) Expression signature scores for GC B cell states (DZ = dark zone; LZ
  = light zone) and follicular dendritic cell (FDC) states (DZ and LZ) in GC-derived
  HIV-NHLs.(F) Scoring of T-B border reticular cell (TBRC) expression signature within
  stromal phenotypes of COO- and EBV-stratified HIV-NHLs
