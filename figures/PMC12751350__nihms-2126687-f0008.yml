figure_title: HSATII-RNP complexes impact RNA splicing in DUX4-expressing cells
caption: '(A) RNA processing consequences and fraction of genes with indicated consequence
  in control depleted (CTRL) −DOX or +DOX iDUX4 cells or in +DOX iDUX4 cells with
  control (CTRL KD) or HSATII depletion (HSATII KD). RNA-sequencing was performed
  in biological duplicate. UTR: untranslated region; SE: skipped exon; IR: intron
  retention; MES: mutually exclusive splicing; ATSS: alternative transcription start
  site; MEE: mutually exclusive exon; ATTS: alternative transcription termination
  site; FDR: false discovery rate. (B) Top enrichment of Biological Processes of significantly
  affected genes between +DOX iDUX4 CTRL KD compared to HSATII KD. Ratio indicated
  number of genes within pathway. (C) UCSC genome browser tracks showing RNA-seq reads
  which map to gene Trip12 from −DOX iDUX4 cells with Ctrl (blue) or HSATII-depletion
  (green) or +DOX iDUX4 cells with Ctrl (red) or HSATII-depletion (purple). +DOX Ctrl
  cells have increased intron retention (highlighted region, orange bar). HSATII depletion
  decreases intron retention. (D) Expression of Trip12 with intron retention in −DOX
  or +DOX iDUX4 cells with (HSATII KD) or without (CTRL KD) HSATII depletion. N= 3.
  Data represent means ± SD. Statistical differences between groups were analyzed
  employing 2-way ANOVA Tukey’s multiple comparison test. (E) UCSC genome browser
  tracks showing RNA-seq reads which map to gene Slc25a44 from −DOX iDUX4 cells with
  Ctrl (blue) or HSATII-depletion (green) or +DOX iDUX4 cells with Ctrl (red) or HSATII-depletion
  (purple). +DOX Ctrl cells have decreased exon 2 and intron inclusion (highlighted
  region, orange bar). HSATII depletion increases exon 2 retention and intron inclusion.
  (F) Expression of Slc25a44 containing exon 2 (left panel) or intron retaining (right
  panel) isoforms −DOX or +DOX iDUX4 cells with (HSATII KD) or without (CTRL KD) HSATII
  depletion. N= 3. Data represent means ± SD. Statistical differences between groups
  were analyzed employing 2-way ANOVA Tukey’s multiple comparison test'
