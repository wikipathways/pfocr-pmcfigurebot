figure_title: The mechanism of action of PGE₂ in tissue regeneration. PGE₂ orchestrates
  tissue regeneration by modulating inflammation and immunity via spatiotemporally
  restricted EP2/EP4-cAMP signaling. It suppresses NF-κB, promotes M2 macrophage polarization,
  attenuates neutrophil infiltration, and expands Tregs. Concurrently, PGE₂ directly
  activates stem cells, enhancing expansion, homing, and differentiation, and synergizes
  with growth factors such as Wnt, VEGF, and BMP to establish a regenerative niche.
  Its concentration-dependent effects resolve inflammation and promote repair across
  tissues, with dysregulation contributing to pathology. (Arrows of the same color
  indicate the same pathway or axis.)
