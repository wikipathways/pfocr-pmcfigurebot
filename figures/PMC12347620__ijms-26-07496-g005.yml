figure_title: Using CRISPR-Cas gene editing technology to improve starch quality.
caption: 'Using CRISPR-Cas gene editing technology to improve starch quality. The
  starch biosynthetic pathway is shown (left panel). In wild type potato (right upper
  panel), the StFtsZ1 gene is involved in starch granule size; the StSS5 and StSS6
  genes are involved in starch granule formation; the StGWD1 gene catalyzes the phosphorylation
  of the glucose chain of starch; the StGBSS and StGBSSI genes are responsible for
  amylose content; the StSBE1, StSBE2, and StSBE3 genes regulate amylose content.
  In CRISPR-Cas edited plants (right lower panel), knockout of target genes included
  the following: ΔStFtsZ1 gene altered starch granule size; ΔStSS5 and ΔStSS6 genes
  increased formation of multiple starch granules; ΔStGWD1 reduced phosphorylation;
  ΔStGBSS and ΔStGBSSI decreased amylose content; and ΔStSBE1, ΔStSBE2, and ΔStSBE3
  genes increased amylopectin content'
