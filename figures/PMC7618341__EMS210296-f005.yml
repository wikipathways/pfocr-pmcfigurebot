figure_title: Wnt-releasing Stromal 2 cell population was reduced in the colon of
  HSCR patients
caption: (A) Dot plot visualizing the interaction strength between ligands expressed
  by other cell types with receptors expressed by epithelial cells. (B) UMAP plot
  visualizing clusters of stromal cell subtypes. (C) Heatmap visualizing gene expression
  of stromal cell subtype specific markers. (D) Proportion of stromal cell subtypes
  in control and HSCR samples. (E) Representative histomicrographs of Stromal 2 cell
  marker F3 of the distal colon and rectum from control and HSCR samples. (F) Protein
  expression of Stromal 2 cell marker BMP4 of control and HSCR samples (n=3). (G)
  Dot plot of WNT signaling gene expression in different stromal cell subtypes. (H)
  Dot plot of ligand-receptor pairs in WNT signaling between stromal cells and epithelial
  cells. (I) GSEA analysis shows WNT signalling is impaired in stem cells/TAs in HSCR
  group. (J) Quantification of tissue expression of Wnt pathway genes in the distal
  and rectum from control and HSCR. (K) Representative micrographs of fluorescence
  ISH staining for Wnt5a in the proximal, distal, and rectum from 2 weeks old wildtype
  and Ednrb-/- mice, with DAPI nuclei counterstaining and quantification of ISH of
  Wnt5a positive dots per cells. (L) Representative micrographs of fluorescence ISH
  staining for Wnt5a and quantification of ISH of Wnt5a positive dots per cell in
  the proximal colon, distal colon and rectum from 3 weeks old wildtype and Ednrb-/-
  mice. Scale bars are shown in all the images. HSCR patients n=6 and control patients
  n=3. Wildtype mice n=6 and Ednrb-/- mice n=6. Experiments were repeated independently
  3 times, with similar results. Each dots represented average value of each individual.
  Data are presented as mean ± SD and compared using nonparametric unpaired Student’s
  t-tests or one-way ANOVA with post-hoc tests as appropriate. The primary p-value
  is indicated directly on the graph
article_title: Impairment of stromal-epithelial regenerative cross-talk in Hirschsprung
  disease primes for the progression to enterocolitis
