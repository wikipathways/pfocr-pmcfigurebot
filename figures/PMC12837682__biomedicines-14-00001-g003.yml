figure_title: Schematic model illustrating cellular mechanisms of MP/NP-induced carcinogenesis.
caption: Schematic model illustrating cellular mechanisms of MP/NP-induced carcinogenesis.
  MPs penetrate the epithelial barrier and are internalized by host cells, where they
  initiate a cascade of harmful events. In the oxidative stress pathway, MPs/NPs trigger
  excessive production of ROS, leading to mitochondrial dysfunction, NF-κB activation,
  and inflammasome stimulation via NLRP3. In parallel, chronic inflammation arises
  from DAMP production and TLR4 disruption, promoting the release of proinflammatory
  cytokines (IL-8, IL-6, TNF-α, IFN-γ, TGF-β) and activation of the STAT pathway,
  which inhibits apoptosis and supports tumor-promoting signaling. Simultaneously,
  genotoxic effects emerge as MPs/NPs and ROS reach the nucleus, inducing DNA strand
  breaks, impairing repair mechanisms, and fostering genomic instability. These converging
  processes facilitate EMT, cancer cell migration, and ultimately, tumor proliferation.
