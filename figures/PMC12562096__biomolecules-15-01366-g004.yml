figure_title: Expression profiles of representative hormone signaling genes in D.
caption: 'Expression profiles of representative hormone signaling genes in D. nobile
  from four cultivation sites. (A) DELLA (GA pathway) expression: three DELLA-encoding
  genes were significantly upregulated in CY01Y (p < 0.05). (B) PYR/PYL receptors
  (ABA pathway): all seven PYR/PYL genes presented significantly increased expression
  in CY01Y (p < 0.05). (C) SnRK2 (ABA pathway): Both SnRK2 genes were significantly
  upregulated in CY01Y (p < 0.05). (D) COI1 (JA pathway): One COI1 gene was significantly
  upregulated in CY01Y (p < 0.05). (E) JAZ (JA pathway): expression in CY01Y was elevated
  but not statistically significant (p > 0.05). (F) MYC2 (JA pathway): gene expression
  tended to be greater in CY01Y but is not significantly (p > 0.05). (G) NPR1 (SA
  pathway): elevated expression was observed in CY01Y but is not significantly (p
  > 0.05). The meaning of “*” is significantly higher than other groups. The diamonds
  represents data points'
