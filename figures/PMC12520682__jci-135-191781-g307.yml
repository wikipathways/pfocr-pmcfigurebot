figure_title: Induction of antigen presentation pathways in BRAFV600E ATC in response
  to MAPK inhibition
caption: 'Thyroid volume measurements (A) by MRI of dox-inducible BRAF/p53 GEMM on
  (n = 27) and off (n = 27) dox for 3–4 weeks and (B) by ultrasound in mice orthotopically
  injected with TBP3743 cells and treated 1 week after engraftment with 30 mg/kg dabrafenib
  and 3 mg/kg trametinib (n = 15) or vehicle (n = 15) for 2 weeks. Ingenuity pathway
  analysis of sorted thyrocytes of BRAF/p53 ATCs on and off dox (C) and orthotopic
  Braf/p53 ATCs treated with vehicle or dab/tram for 4 days (D). (E–G) RT-PCR of the
  indicated MhcII complex mRNAs, Ciita, and Cd74 in sorted thyrocytes from Braf/p53
  orthotopic ATCs treated with vehicle or dab/tram in vivo for 4 days. A, B, and E–G:
  Multiple Mann-Whitney tests. Data are presented as mean ± SEM. GEMM, genetically
  engineered mouse model'
