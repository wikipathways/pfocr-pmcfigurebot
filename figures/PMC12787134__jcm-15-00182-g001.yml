figure_title: An overview of the Notch/ADAM17 signaling pathway.
caption: An overview of the Notch/ADAM17 signaling pathway. Representation of key
  events involved in activation of the Notch/ADAM17 pathway. Binding of ligands by
  a signal-sending cell leads the Notch receptor to a conformational change that undergoes
  the first proteolytic cleavage by ADAM17; subsequently, a second proteolytic cleavage
  by γ-secretase occurs that permits a nuclear translocation of the remaining NICD.
  This process leads to the association with the transcription factor CSL and transcriptional
  co-activator MAML to form a transcriptional activation complex. ADAM 17 (A Disintegrin
  And Metalloproteinase); CSL (suppressor of hairless); DLL4 (delta-like ligand 4);
  JAG (jagged); MAML (mastermind-like); NICD (Notch intracellular domain)
