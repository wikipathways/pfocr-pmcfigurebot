figure_title: Evolution of PCa management towards precision medicine.
caption: 'Evolution of PCa management towards precision medicine. Starting at diagnosis,
  next-generation profiling that combines genomics, transcriptomics, proteomics, and
  radiomics (top left) guides biopsy decisions and risk stratification. Depending
  on the molecular risk, patients enter either (1) an active-surveillance pathway
  (serial PSA, MRI, and repeat biopsy; top center) or (2) receive definitive local
  therapy with radical prostatectomy and/or radiotherapy (middle left). Post-treatment,
  multi-omics surveillance, including PSMA-PET imaging and comprehensive tissue or
  liquid-biopsy panels such as FoundationOne CDx, is used to detect molecular or radiological
  signs of recurrence (top right). Progression to advanced disease (bottom right)
  triggers a second round of omics-guided selection of systemic therapies: DNA-repair
  defects (e.g., BRCA1/2 loss) nominate PARP inhibitors; PSMA expression enables lutetium-177-PSMA-617
  radionuclide therapy; and other actionable alterations similarly funnel patients
  to mechanism-matched agents (bottom left). Created in BioRender. Fatima, Y https://BioRender.com/2550wdt
  (accessed on 30 June 2025)'
