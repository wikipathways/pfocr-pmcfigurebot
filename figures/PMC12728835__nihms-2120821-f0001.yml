figure_title: P-body-seq permits comprehensive profiling of P-body contents
caption: '(a) Schematic for the purification and transcriptomic profiling of P-bodies
  from HEK293T cells based on the expression of GFP-LSM14A. (b) Representative IF
  imaging of GFP-LSM14A puncta (green), colocalizing with EDC4 puncta (red) in HEK293T
  cells. Nuclei were counterstained with DAPI (blue) (scale: 10μm). n=3 independent
  experiments. (c) Representative flow cytometry plots showing gating for GFP-LSM14A+
  P-bodies in HEK293T cells. (d) Representative imaging of GFP-LSM14A puncta (green)
  in control and DDX6 KO HEK293T cells. Nuclei were counterstained with DAPI (blue)
  (scale: 10μm) (left panel). P-body number in control (n=50 cells) and DDX6 KO (n=50
  cells) HEK293T cells (right panel). Unpaired two-sided Student’s t-test, mean ±
  s.d., ****: p<0.0001. (e) Representative flow cytometry plots showing gating for
  GFP-LSM14A+ P-bodies in control and DDX6 KO HEK293T cells. (f) MA plot of RNA-seq
  data depicting P-body enriched genes in red and cytoplasm enriched genes in blue
  in HEK293T cells (n=2 biological independent samples per group, p<0.05). (g) GO
  pathway analysis of P-body enriched mRNAs in HEK293T cells, using expressed genes
  as background. Enrichment was tested by two-sided Fisher’s exact test with multiple
  testing correction (Benjamini–Hochberg FDR). (h) GO pathway analysis of cytoplasm
  enriched mRNAs in HEK293T cells, using expressed genes as background. Enrichment
  was tested by two-sided Fisher’s exact test with multiple testing correction (Benjamini–Hochberg
  FDR). (i) Representative FISH imaging of POLK RNA molecules (red) combined with
  imaging of GFP-LSM14A puncta (green). Nuclei were counterstained with DAPI (blue)
  (scale: 10μm). n=3 independent experiments. (j) Quantification of POLK mRNA molecules
  in P-bodies based on FISH (n=50 cells; right) and P-body sequencing (right), mean
  ± s.d. (k) Read coverage distribution over the gene body of the longest annotated
  isoforms for genes enriched in P-bodies or cytoplasm in HEK293T cells. (l) PolyA
  tail length as determined in51 compared to P-body enrichment based on SMART-Seq
  and SnapTotal-Seq, Pearson correlation test. (m) Translation efficiency (log2 (Ribo-seq
  counts/RNA-seq counts)) negatively correlates with mRNA enrichment in P-bodies in
  HEK293T cells, Pearson correlation test (two sided), p=3.94e-98'
article_title: Selective RNA sequestration in biomolecular condensates directs cell
