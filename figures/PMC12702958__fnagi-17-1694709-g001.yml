figure_title: This schematic summarizes the mechanistic link between stroke and subsequent
  sleep disorders via gut-brain axis dysregulation.
caption: This schematic summarizes the mechanistic link between stroke and subsequent
  sleep disorders via gut-brain axis dysregulation. Following a stroke, brain damage
  induces HPA axis activation and autonomic dysfunction, which in turn disrupts the
  intestinal barrier and microbiota balance. The resulting gut leakage permits LPS
  translocation, triggering systemic inflammation through the TLR4/NF-kB pathway.
  This inflammation ultimately causes astrocyte dysfunction and sleep disturbances.
  The graphic also highlights potential intervention points, such as microbiota reconstitution
  and anti-inflammatory strategies
article_title: Research progress on the role of microbiome-immune-neurotransmitter
