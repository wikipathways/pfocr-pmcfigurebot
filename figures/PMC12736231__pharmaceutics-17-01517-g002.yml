caption: Basic structural model for GB-5001A population pharmacokinetic modeling and
  simulation. Structural model describing the pharmacokinetic disposition of GB-5001A
  following intramuscular administration. The model includes two intramuscular depot
  compartments, from which drug absorption into the central compartment occurs via
  first-order processes (KA3 and KA4), as well as a zero-order absorption pathway
  defined by the fraction absorbed (F1). The central compartment is connected to a
  peripheral compartment through intercompartmental clearance (Q/F), and systemic
  clearance is represented by CL/F. Arrows represent the modeled structural flow (absorption,
  distribution, and elimination) and the associated pharmacokinetic parameters
