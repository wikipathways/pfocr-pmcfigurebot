figure_title: Effect of JNK signaling pathway modulation on RB1CC1 localization and
  ferroptosis in DU145 cells.
caption: Effect of JNK signaling pathway modulation on RB1CC1 localization and ferroptosis
  in DU145 cells. (A) Immunofluorescence analysis of the intracellular localization
  of RB1CC1 following treatment with MPD alone or in combination with SP600125. (B)
  Histograms representing the quantification of the intracellular localization of
  RB1CC1 from (A). (C–E) Determination of CHCHD3, SLC25A32, and RB1 expression levels
  by RT-qPCR. (F–I) GSH, MDA, and ROS levels in DU145 cells following treatment with
  MPD alone or in combination with the SP600125. (J) Immunoblot analysis of ACSL4,
  GPX4, and SLC7A11 expression levels in DU145 cells following treatment with MPD
  alone or in combination with SP600125. (K) Histograms representing the quantifications
  of the ACSL4, GPX4, and SLC7A11 bands from (J). Data are presented as the mean ±
  standard error of the mean (n = 3). Statistical significance of differences was
  analyzed using ANOVA. Significantly different values are indicated by distinct letters
  (p < 0.05). Original images can be found in the Supplementary Materials
