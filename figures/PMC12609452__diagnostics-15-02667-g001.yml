figure_title: Platelet role in coagulation.
caption: Platelet role in coagulation. The figure summarizes the mechanisms through
  which platelets influence coagulation. Platelets release several coagulation factors—including
  factor VIII, V, XI, XIII, von Willebrand factor, and fibrinogen—from their alpha
  granules. In addition, they express tissue factor on their surface and stimulate
  its expression by other inflammatory cells. Platelets also shed extracellular vesicles
  containing procoagulant substances and expose phosphatidylserine, thereby providing
  a catalytic surface for the initiation of the coagulation cascade. Furthermore,
  platelets interact with neutrophils, inducing the release of neutrophil extracellular
  traps (NETs), which, in turn, activate blood clotting through various mechanisms
  and activate the intrinsic pathway of coagulation through the release of polyphosphates
  from their dense granules
