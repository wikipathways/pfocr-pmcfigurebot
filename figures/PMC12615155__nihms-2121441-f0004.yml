figure_title: The chaperone-usher pathway machineries for pili biogenesis and the
  bacterial flagellum that drives cellular motility
caption: 'A) The Pap (PDB ID: 7LHG) and Fim (PDB ID: 9BOG) chaperone-usher pathway
  machineries mediate the biogenesis of pili in E. coli. The subunits that make up
  the tip (PapE, PapF, PapG and PapK; FimF, FimG and FimH) and rod (PapA; FimA) of
  the pili interact with the chaperones (PapD; FimC) to orchestrate the handoff of
  structural components to the usher proteins (PapC; FimD) during their translocation
  across the OM. Membrane (top) and periplasmic (bottom) views are shown. B) A structural
  overview of the assembly of the bacterial flagellum. The filament section is composed
  of the filament cap (FliD, mint green; PDB ID: 6SIH), the filament core (~30,000
  copies of FliC, grey), and the filament hook junction (FlgL, purple; FlgK, pink).
  The hook (PDB ID: 7CGO) is composed of ~120 copies of FlgE (light blue; also PDB
  ID: 6K3I). The basal body comprises the L-ring (FlgH, yellow), the P-ring (Flgl,
  orange), the MS-ring (FliF, red) and the C-ring (FliG, lime green; FliM, cyan; FliN,
  turquoise). The rod is formed by FlgG, FlgF, FlgB, FlgC and FliE (not shown). The
  export apparatus contains FliR, FliP, FlhB, FliQ, FliJ (not shown), FlhA (white,
  shown behind the C-ring; PDB ID: 7AMY), FliH (slate) and Flil (pink) (PDB ID: 5B0O).
  Finally, the stator unit comprises MotA and MotB (dark blue and forest green) (PDB
  IDs: 6YKM, 2ZVY). Panel B created in BioRender by Bush, M., 2025. https://biorender.com/8vzjnpi.
  This figure was sublicensed under CC-BY 4.0 terms'
