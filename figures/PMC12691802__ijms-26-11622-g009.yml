figure_title: Simplified diagram of the JAK–STAT pathway.
caption: Simplified diagram of the JAK–STAT pathway. Ligand binding to cytokine or
  growth factor receptors (e.g., ILs, IFNs, Epo, growth hormones) induces receptor
  dimerization and activates receptor-associated JAKs. Activated JAKs phosphorylate
  receptor tyrosine residues, creating docking sites for STAT proteins. Phosphorylated
  STATs dimerize via Src homology 2 (SH2) domains and translocate to the nucleus,
  where they bind DNA and regulate transcriptional programs controlling immunity,
  proliferation, and differentiation. The arrow indicates a stimulating effect. The
  lines ending with perpendicular bars indicate an inhibition
