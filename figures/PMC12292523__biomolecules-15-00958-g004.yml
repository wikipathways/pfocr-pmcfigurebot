figure_title: Identification of Differentially Expressed Proteins in Parkin-Deficient
  and Parkin-Overexpressing Rat Nucleus Accumbens.
caption: Identification of Differentially Expressed Proteins in Parkin-Deficient and
  Parkin-Overexpressing Rat Nucleus Accumbens. (A,B) Venn diagrams showing numbers
  of overlapping DEPs between PKO and PO rats detected by Qlucore Explorer at p <
  0.01 (A) or p < 0.05 (B). (A) At p < 0.01, there were 58 DEPs unique to the PKOs,
  41 DEPs unique to the POs, and no shared DEPs. (B) At p < 0.05, there were 196 DEPs
  unique to the PKOs, 145 DEPs unique to the POs, and 32 shared DEPs. (C) Top 20 pathways
  altered by parkin loss in the nucleus accumbens (q < 0.05, ShinyGO). (D) Top 20
  pathways altered by parkin overexpression in the nucleus accumbens (q < 0.05, ShinyGO).
  (E) Pathways to which DEPs shared by PKOs and POs belong (q < 0.05, ShinyGO). (F)
  GSEA analysis of the shared DEPs (p < 0.05)
