figure_title: Structural projection of allosteric pathways on the EGFR surface.
caption: Structural projection of allosteric pathways on the EGFR surface. Representative
  shortest paths (corresponding to Figure 7) are mapped onto the 3D structures of
  WT and mutant EGFR. Residues from the A-loop (green), P-loop (blue), and N-lobe
  (pink) define the source and target regions; gray lines trace the spatial propagation
  paths. (a) WT shows a compact intra-core trajectory. (b) T790M mutation displaces
  the path outward. (c) L858R induces pathway redirection and endpoint shift. (d)
  The double mutant exhibits widespread spatial redistribution and path expansion
