figure_title: 'Proposed schematic pathway of ectopic OR2H1 in sperm: the binding of
  methional to the OR2H1 receptor leads to the interaction of the receptor with a
  GTP-binding protein, Golf.'
caption: 'Proposed schematic pathway of ectopic OR2H1 in sperm: the binding of methional
  to the OR2H1 receptor leads to the interaction of the receptor with a GTP-binding
  protein, Golf. This interaction, in turn, leads to the release of a GTP-coupled
  Gαolf subunit, which then stimulates adenylyl cyclase III (ACIII) to produce elevated
  levels of cyclic AMP (cAMP). The increase in cyclic AMP opens the Ca2+ channel (CatSper?),
  leading to an increase in intracellular Ca2+ concentration and depolarization of
  the cell membrane. This intracellular cascade modulates sperm chemotaxis. LIN: the
  linearity parameter; STR: the straightness parameter; WOB: the wobble index parameter'
