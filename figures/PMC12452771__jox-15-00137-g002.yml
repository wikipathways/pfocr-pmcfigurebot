figure_title: SiNPs caused ER damage, induced ER stress, and further activated the
  SIRT1/HSF1 signaling pathway.
caption: 'SiNPs caused ER damage, induced ER stress, and further activated the SIRT1/HSF1
  signaling pathway. (A) The ER structure was observed by TEM after SiNPs treatment
  in BEAS-2B cells. Scale bar: 500 nm. Red arrow, ER. N, nucleus. (B) Measurement
  of ER stress and SIRT1/HSF1 signaling pathway-related proteins after 24 h of SiNPs
  treatment in BEAS-2B cells by Western blot. The GAPDH was used as an internal control
  to assess the equal loading of the samples. (a) Representative protein bands of
  BIP, CHOP, SIRT1, SIRT1 (ser47), SIRT1 (ser27), and HSF1 were detected by Western
  blot. (b–g) Grayscale values of the expression of ER stress and SIRT1/HSF1 signaling
  pathway-related proteins affected by SiNPs, as analyzed by ImageJ. n = 3. Data were
  expressed as mean ± S.D., * p < 0.05 and ** p < 0.01, SiNP-treated group compared
  with the control group. (C) The acetylated HSF1 was detected by immunoprecipitation
  after SiNPs treatment for 24 h. (D) The localization and quantitative analysis of
  HSF1 in the nucleus of BEAS-2B cells after SiNPs treatment, which was detected by
  IF. Blue: DAPI; red: HSF1, scale bar: 10 μm'
