figure_title: Personalized medicine approaches for identifying clinically relevant
  and targetable pathogenic mutations causing bAVM.
caption: Personalized medicine approaches for identifying clinically relevant and
  targetable pathogenic mutations causing bAVM. (A) Somatic tissue acquisition via
  endoluminal or liquid biopsy of perilesional or peripheral blood for detection of
  somatic KRAS (or other pathogenic) driver mutations. (B) Detection of pathogenic
  somatic driver mutations in sporadic bAVM and Mendelian, pedigree analysis of bAVM
  patient and family where ‘second hit’ mutations occur in bAVMs associated with hereditary
  hemorrhagic telangiectasia (HHT) and capillary malformation AVM (CM-AVM) syndrome.
  (C) KRAS, BRAF, and MEK signaling pathway in bAVMs with annotation of commercially
  available pharmacologic modulators. (D) Design and delivery of bespoke gene editing
  tools to correct bAVM pathogenic mutations in situ
