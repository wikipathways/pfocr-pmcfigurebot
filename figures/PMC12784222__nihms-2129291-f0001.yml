figure_title: |-
  The Wnt signaling pathway and the Dishevelled (DVL) PDZ domain dual
  binding mode switching mechanism.
caption: |-
  The Wnt signaling pathway and the Dishevelled (DVL) PDZ domain dual
  binding mode switching mechanism.(A) A simplified schematic of the canonical and non-canonical branches
  of the Wnt signaling pathway. The Frizzled co-receptors LRP5/6 and ROR2 are
  depicted. Adapter proteins such as GSK, CK and DAAM1 can interact with DVL alone
  or when in complex with Frizzled.(B) The dual-binding mode switching mechanism found in the DVL PDZ
  domain.(C) A possible mechanism for the regulation of DVL activity by PDZ
  domain dual mode switching. Dual mode switching allows for C-terminus
  availability to post-translational modifications such as polyglutamylation and
  phosphorylation, which may allosterically regulate transition into the DVL
  active state
