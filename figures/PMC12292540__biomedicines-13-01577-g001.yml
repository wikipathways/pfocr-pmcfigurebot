figure_title: Differential expression of MAPK pathway-related genes in thyroid lesion
  samples analyzed by PCR array.
caption: 'Differential expression of MAPK pathway-related genes in thyroid lesion
  samples analyzed by PCR array. Out of the 84 genes examined, 46 genes showed significant
  differential expression (fold change ≥ 2 for upregulation or ≤0.5 for downregulation,
  with p < 0.05). (a) Analysis 1: malignant tumors (PTC and FTC) (group 2) vs. normal
  thyroid and benign tumors samples (group 1); (b) Analysis 3: PTC samples (group
  4) vs. group 1; (c) Analysis 4: FTC samples (group 5) vs. group 1; (d) Analysis
  5: FTC (group 5) vs. PTC samples (group 4). Bars represent the average fold change,
  with min (minimum) and max (maximum) values indicating variability among samples.
  The exact fold-change values and statistical details for each gene are provided
  in Supplementary Table S1'
