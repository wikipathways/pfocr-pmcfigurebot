figure_title: Characterization of factor 8 functional enrichment and feature contributions
caption: (a) Gene Set Enrichment Analysis of factor 8, showing the most significant
  terms for each view. P-values were corrected using Benjamini-Hochberg (BH) method
  to address multiple comparisons. Terms were selected based on the lowest adjusted
  P values for each view. ‘GO’ and ‘Reactome’ comprise terms from Gene Ontology and
  Reactome databases, respectively. ‘Modules’ include relevant co-expression protein
  modules from 46. ‘Cell Types’ refers to subpopulations of cell lineages as determined
  by 47. The color scale shows the normalized enrichment score (NES) direction and
  strength from negative (blue) to positive (red). (*) = −log10 (adj. P < 0.05); (**)
  = −log10 (adj. P < 0.01); (***) = −log10 (adj. P < 0.001). (b) Top five positive
  and negative feature weights in each view. Weights are scaled to each view. Positive
  weights indicate that the feature has higher levels in the cells with positive factor
  values, and vice versa. Metabolites shown as ‘X –’ have not been characterized.
  (c) Jitter plot showing genes with weights in each view scaled across all views
  (cell types and metabolomics are not shown). Genes from selected pathways and with
  an absolute weight greater than 0.3 are highlighted (colored by category)
