caption: 'Overview of gene expression changes in Fusarium graminearum PH-1 after treatment
  with strain FXJ. (A) Bar chart showing the number of up- and down-regulated differentially
  expressed genes (DEGs) in pairwise comparisons. (B) Volcano plot of DEGs between
  the control and FXJ-treated groups. Red dots represent up-regulated DEGs, blue dots
  represent down-regulated DEGs, and gray dots indicate non-DEGs. GO functional classification,
  KEGG classification of DEGs for Control vs. FXJ and Heatmap of the KEGG pathway.
  (C) Histogram of GO functional classification. The DEGs were assigned to three categories:
  biological process, cellular component, and molecular function. (D) GO functional
  classification map of the first five terms with small q value in biological process,
  molecular function, and cellular component. The color of the points reflects the
  p value, and the red indicates the more significant enrichment. The size of the
  dots represents the count of DEGs enriched. (E) Histogram of KEGG classification.
  (F) Heatmap of DEGs in glycolysis/gluconeogenesis pathway (ko00010). (G) Heatmap
  of DEGs in fatty acid degradation pathway (ko03008). (H) Heatmap of DEGs in amino
  acid biosynthesis pathway (ko01230). (I) Heatmap of DEGs in ribosome biogenesis
  in eukaryotes pathway (ko00071). (J) Heatmap of DEGs in RNA polymerase pathway (ko03020)'
