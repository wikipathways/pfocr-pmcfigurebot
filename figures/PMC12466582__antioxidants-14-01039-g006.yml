caption: 'KEGG enrichment maps of differential metabolites in different pairwise comparisons:
  (A) S2 vs. S1, (B) S3 vs. S2, and (C) S4 vs. S3. (A–C) The abscissa represents the
  enrichment factor of the pathway and the ordinate shows the names of pathways. The
  dot color represents the p-value, with darker red indicating stronger enrichment
  effects. The dot size represents the number of metabolites enriched in the pathways.
  (D–F) The DA score reflects the overall change in all metabolites in a metabolic
  pathway (DA = (number of upregulated differential metabolites − number of downregulated
  differential metabolites)/number of all metabolites annotated in this pathway)'
