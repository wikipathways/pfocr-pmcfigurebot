figure_title: Skeletal Muscle Nuclei Proteomics
caption: A) Immunohistochemistry images of isolated skeletal muscle nuclei (DAPI;
  blue) and cytoplasmic debris (Phalloidin; green) prior to (left panels) and after
  (right panels) the sucrose cushion. Top and bottom panels were taken with 10X (Scale
  bar = 10 μm) and 20X (Scale bar = 25 μm) objectives, respectively. B) Venn diagram
  of proteins found in whole muscle homogenate (blue) (taken from (24)), pre-sucrose
  (red), and post-sucrose (green). C-D) Pathway enrichment for Gene Ontology biological
  processes (C; blue bars) and KEGG (D; black bars) of the 620 common proteins between
  all comparisons in A. E-G) Pathway enrichment analysis using biological processes
  and KEGG of proteins unique to whole muscle (E), shared between whole muscle and
  “post-sucrose” nuclei (F), and proteins found exclusively in the “post-sucrose”
  nuclei (G). Pathways are noted as biological process (BP) or KEGG (K) with the number
  of proteins in each pathway beside the respective bar
article_title: Alterations of the skeletal muscle nuclear proteome after acute exercise
  reveals a post-transcriptional influence
