figure_title: KEGG pathway enrichment analysis of differentially expressed genes following
  cisplatin treatment.
caption: KEGG pathway enrichment analysis of differentially expressed genes following
  cisplatin treatment. (A) Pathways enriched in upregulated genes (Z ≥ 2). (B) Pathways
  enriched in downregulated genes (Z ≤ −2). Pathways are ranked by false discovery
  rate (FDR), with rightward position indicating greater fold enrichment. Dot color
  represents −log10(FDR), and dot size indicates the number of genes in each pathway.
  Complete KEGG/GO pathway lists (name, ID, gene count, fold enrichment, raw P, FDR)
  are provided in Supplementary Table S1 (significant at FDR ≤ 0.05; suggestive at
  0.05–0.10)
