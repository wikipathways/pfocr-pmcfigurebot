figure_title: Butyrolactol A (BLA) potentiates the fungicidal activity of caspofungin
  against Cryptococci by inhibiting the Apt1–Cdc50 complex
caption: '(A) Schematic illustrating the proposed mechanism of action for BLA. The
  misloading of BLA blocks the entrance of the phospholipid substrate, resulting in
  impaired membrane asymmetry, which disrupts membrane organization and vesicle budding,
  ultimately blocking secretory and endocytosis pathways. Color coding is indicated
  within the figure. (B) Susceptibility of FK506 against C. neoformans H99 and flippase-deficient
  (cdc50Δ, apt1Δ, and apt1Δ cdc50Δ). A broth microdilution assay was performed in
  RPMI 1640 medium, and growth was measured by absorbance at 530 nm after 48 hours
  at 30 °C. Results are analyzed and depicted as described in Figure 5F. (C) Susceptibility
  of caspofungin against C. neoformans H99 wild type, apt1Δ, cdc50Δ and apt1Δ cdc50Δ
  mutants. Dose-response assays were performed, and data were analyzed as described
  in Figure 5F. Relative growth is represented quantitatively by color (see bar for
  scale). (D) Relative caspofungin accumulation in C. neoformans H99 wild type, with
  or without BLA, and in apt1Δ and cdc50Δ mutants after 15 minutes of treatment. All
  experiments were performed in biological triplicates, and data are presented as
  mean ± SEM. Significance was determined using multiple unpaired t-tests, comparing
  the wild-type without BLA to each group; p-value: *< 0.05, ** < 0.01. (E) The synergistic
  effect of caspofungin and BLA was assessed against C. neoformans H99 wild type,
  apt1Δ, cdc50Δ, and apt1Δ cdc50Δ mutants. Checkerboard assays were performed in SDB
  medium at 30 °C, and growth was measured by absorbance at 530 nm after 48 hours.
  Biological duplicates were averaged, and measurements were normalized to no-drug
  controls and depicted as heatmaps. Relative growth is represented quantitatively
  by color (see scale bar at the bottom right)'
