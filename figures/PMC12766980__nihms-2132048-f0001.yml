figure_title: Potential Pathways By Which Hyperglycemia or Visceral Adiposity Might
  Promote the Development and Progression of Heart Failure With a Preserved Ejection
  Fraction
caption: 'Heightened environmental glucose may stimulate flux through specific pathways:
  1) the hexosamine biosynthetic pathway leading to protein modification by O-GlcNAcylation;
  2) the polyol pathway leading to depletion of antioxidants and osmotic cellular
  stress; 3) the pentose phosphate pathway, leading to activation of nicotinamide
  adenine dinucleotide phosphate oxidase, yielding reactive oxygen species; and 4)
  advanced glycation end products, which can cause crosslinks or can interact with
  the receptor for advanced glycation end products, leading to adipokine imbalance,
  cardiac steatosis, and fibrosis. Visceral adiposity can also promote the synthesis
  of advanced glycation end products and can augment O-GlcNAcylation, but more importantly,
  leads to an imbalance in the secretion of protective and deleterious adipokines
  that have been demonstrated to cause ventricular hypertrophy and fibrosis as well
  as cardiac lipotoxicity, leading to heart failure with a preserved ejection fraction
  (HFpEF). There is no defined role for insulin resistance in the development of HFpEF.
  GLUT4 = glucose transporter 4'
