figure_title: Mechanism of quazolinone compounds inducing cell death through ferroptosis.
caption: Mechanism of quazolinone compounds inducing cell death through ferroptosis.
  i) System Xc− is responsible for importing extracellular cysteine into cells for
  GSH synthesis, maintaining GPX4 activity to clear lipid peroxides PL-PUFA-OOH. When
  cysteine uptake is blocked or GSH is depleted, GPX4 becomes inactive, leading to
  the accumulation of lipid peroxides and triggering ferroptosis (Erastin inhibits
  SLC7A11, prevents Cys entry, reduces GSH synthesis, weakens GPX4 activity and enhances
  lipid peroxidation, thereby inducing ferroptosis; BODIQPy-TPA directly acts on the
  GPX4/GSH axis, inhibits GPX4, depletes GSH, blocks lipid peroxide clearance and
  promotes ferroptosis). ii) After transferrin-bound Fe3+ enters the cell, it is reduced
  to Fe2+, promoting ROS generation and inducing lipid peroxidation. The Keap1-Nrf2
  signaling axis regulates the downstream antioxidant gene NQO1, which helps buffer
  ferroptosis stress to a certain extent (CQ-Mito generates ROS under light, inhibits
  GPX4, reduces Keap1 and activates the Nrf2 antioxidant pathway). iii) PUFA is acylated
  to form PuFA-CoA, and under the influence of iron and ROS, lipid peroxides PL-PUFA-OOH
  are generated, which are direct molecular effectors of ferroptosis. ROS, reactive
  oxygen species; GSH, glutathione; TF, transcription factors; GCL, glutamate cysteine
  ligase; GGC, gamma-glutamylcysteine; GSS, glutathione synthetase; SLC40A1, solute
  carrier family 40 member 1; system Xc−, cystine/glutamate antiporter system; αKG,
  α-ketoglutaric acid; TCA-cycle, tricarboxylic acid cycle; VDAC, voltage-dependent
  anion channel; OXPHOS, oxidative phosphorylation; PuFA, polyunsaturated fatty acid;
  CoA, coenzyme A; Cys, cysteine; Met, methionine; PuFA-PL, polyunsaturated-fatty-acid-containing
  phospholipids; IPP, Isopentenyl pyrophosphate; FPP, farnesyl pyrophosphate; HSP90,
  heat shock protein 90; GPX4, glutathione peroxidase 4; DFO, deferoxamine; Keap1,
  Kelch-like ECH-associated protein 1; Nrf2, nuclear factor erythroid 2-related factor
  2; NQO1, quinone oxidoreductase
