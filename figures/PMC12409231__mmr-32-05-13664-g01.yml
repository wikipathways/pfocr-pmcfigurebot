figure_title: Molecular mechanism of PI3K/AKT/mTOR and AMPK pathway-mediated mitophagy
  in NAFLD.
caption: Molecular mechanism of PI3K/AKT/mTOR and AMPK pathway-mediated mitophagy
  in NAFLD. In the development of NAFLD, the PI3K/AKT/mTOR and AMPK signaling pathways
  are perturbed and ROS levels are elevated due to a high-fat diet and insulin resistance.
  The PI3K/AKT pathway activates mTOR, while AMPK responds to AMP/ATP changes to influence
  mTOR. Dysregulated mTOR impacts ULK1/Atg13 and TFEB, disrupting phagophore formation
  and mitophagy. Impaired mitophagy triggers inflammasome activation, apoptotic bodies
  and hepatic stellate cell activation, exacerbating NAFLD progression. This figure
  was created using Biorender software (https://app.biorender.com/). AMPK, AMP-activated
  protein kinase; NAFLD, non-alcoholic fatty liver disease; ROS, reactive oxygen species;
  ULK1, Unc-51 like autophagy activating kinase 1; Atg13, autophagy-related protein
  13; TFEB, transcription factor EB; LC3, microtubule-associated protein 3; ATG, autophagy-related
  genes; P, phosphorylation
