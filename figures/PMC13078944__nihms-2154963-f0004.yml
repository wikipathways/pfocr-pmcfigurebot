figure_title: Somatosensory cortex to lSuC pathway drives mechanical hypersensitization
caption: |-
  a, b, Representative images (a) and quantification (b) of monosynaptic inputs onto lSuCRVM neurons (n = 4). Scale Bar: 500 μm. Inset: 3D reconstruction of cortical input neurons. Dashed circle: anterior motor cortex (MOa) and SS. MO: motor cortex; ZI: zona incerta; SS: somatosensory cortex; MRN: midbrain reticular nucleus; SNr: substantia nigra; APN: anterior pretectal nucleus; PAG: periaqueductal gray; LHA: lateral hypothalamus; GRN: gigantocellular reticular nucleus; VNC: vestibular nuclei; VM: ventral medial thalamus; PRNc: caudal-pontine reticular nucleus; PB: parabrachial nucleus; RSP: retrosplenial area. c, d, Mechanical thresholds of saline (black, n = 6 for c, n = 7 for d) and CLZ (blue, n = 6 for c, n = 7 for d) infusion into the lSuC of mice expressing hM4D in MOa (c) or SS (d,
  P = 0.8438, 0.0156, 0.0156) for chemogenetic silencing. e, Locomotor traces and CPA score in mCherry (white, n = 6) but not hM4D (blue, n = 7) expressed in SS after SNI (P = 0.0012). f, Mechanical thresholds of non-injured mice expressing hM3D in SS after 7 daily CLZ infusion (23 h before test, shaded) into lSuC of control mice (red, n = 7) or mice with OPRM1+ RVMSC neurons ablated (black, n = 8). g, Locomotor traces and CPA score in hM3D (red, n = 7) but not in mCherry (white, n = 6) mice after repetitive CLZ infusion into lSuC (P = 0.0012). See supplementary Table 1 for detailed statistics. Two-sided Wilcoxon signed-rank test (c, d); Two-sided Mann-Whitney test (e, g, f Control vs. ablation); Before vs. after CLZ: Dunn’s multiple comparisons test (f). * P < 0.05, ** P < 0.01, *** P < 0.001; # P < 0.05, ## P < 0.01, ### P < 0.001. Mean ± SEM
