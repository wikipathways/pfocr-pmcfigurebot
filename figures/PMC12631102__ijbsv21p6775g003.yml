figure_title: SYT4 is involved in regulating the Wnt/β-catenin signaling pathway.
caption: SYT4 is involved in regulating the Wnt/β-catenin signaling pathway. A and
  B GSEA enrichment analysis focused on KEGG pathways enriched in differentially expressed
  genes that related to SYT4 level. C The potential downstream pathway-related proteins
  detected by protein array analysis. D Wnt pathway was detected by GSEA analysis,
  with the normalized enrichment score (NES) of 1.63 and false discovery rate (FDR)
  of 0.13. E SYT4 expression increased the levels of p-GSK-3β/GSK-3β and β-catenin,
  and SYT4 knockdown showed the opposite effect on these markers. F In the SYT4-OE
  group, the β-catenin levels in the cell nucleus were notably elevated compared to
  those in the control group. GAPDH was used as the internal control for cytoplasmic
  proteins, whereas Histone-H3 for nuclear proteins. Alterations in the levels of
  the downstream target protein c-Myc were observed following SYT4 silencing/overexpression
