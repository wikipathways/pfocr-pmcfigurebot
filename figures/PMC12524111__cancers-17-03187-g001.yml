figure_title: Inflammation-related pathways are downregulated in NEPC.
caption: Inflammation-related pathways are downregulated in NEPC. (A) Gene set enrichment
  analysis (GSEA) comparing CRPC and NEPC transcriptomes demonstrates significant
  downregulation of IFNγ response, IFNα response, IL6-JAK-STAT3 signaling, and inflammatory
  response pathways in NEPC (FDR < 0.005). (B) Heatmaps show decreased expression
  of genes associated with each pathway in NEPC compared to CRPC. (C) Venn diagram
  illustrating overlap of downregulated genes among the four pathways. (D) Heatmap
  showing the expression of overlapping genes from four inflammatory signaling pathways
  commonly repressed in NEPC. (E) Box plots showing reduced expression of STAT3, IRF1,
  FAS, IL7, and IL4R in NEPC versus CRPC. Data are presented as mean ± SEM. * p <
  0.05, ** p < 0.01
