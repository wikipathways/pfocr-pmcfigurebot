figure_title: CPT1 (carnitine palmitoyl transferase 1) a expression changes induce
  differences in overall gene expression measured by RNA-seq
caption: A, Diagram showing the number of genes altered by cardiac-specific CPT1a
  knockout (csCPT1a ko; n=4) or cardiac-specific CPT1a overexpression (adeno-associated
  virus serotype 9 [AAV9].cTnT (cardiac troponin T).Cpt1a; n=3 PBS sham and n=4 AAV9.cTnT.Cpt1a
  sham) and heatmap of changes in gene expression that occurred in the 82 overlapping
  genes that were altered by both the loss of CPT1a and AAV9.cTnT.Cpt1a. B, Individual
  changes in expression (log2FC) for the 82 overlapping genes altered in A are plotted
  for the indicated comparisons. C, Pathway enrichment for the 82 overlapping genes
  identified in B. The number of genes enriched in each pathway is indicated, and
  related pathways were grouped together. D, Diagram of genes altered by AAV9.cTnT.Cpt1a
  in either sham or transverse aortic constriction (TAC) hearts (8 weeks post-TAC)
  and a heatmap for the 133 overlapping genes for which the expression was changed
  by CPT1a overexpression vs both PBS sham and PBS TAC. E, Motif analysis of csCPT1a
  ko TAC vs floxed (f/f) TAC, showing top enriched motifs in upregulated and downregulated
  gene sets, with the predicted TF (transcription factor) binding that motif. An enriched
  motif indicates the differentially expressed genes containing that motif in the
  promoter region. Highlighted in blue are the KLF (Krüppel-like factor) family of
  TF strongly enriched. P value (1-tailed Fisher exact [hypergeometric] test). F,
  Gene expression of KLF genes in the data set. KLFs are downregulated by Cpt1a overexpression
  and upregulated in CPT1a ko in both sham and TAC conditions. Statistical significance
  indicated by P<5.0×10−2 (<0.05) by the unpaired 2-tailed t test (B) and adjusted
  P value from the Benjamini-Hochberg procedure (F)
article_title: Increased CPT1a Expression Is a Critical Cardioprotective Response
  to Pathological Stress that Suppresses Gene Programs for Remodeling and Enables
  Rescue by Gene Transfer
