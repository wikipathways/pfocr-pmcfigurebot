figure_title: Parental and mutant A375 cellular response to treatment with cyclometallated
  gold(III) compounds.
caption: 'Parental and mutant A375 cellular response to treatment with cyclometallated
  gold(III) compounds. Top left: A375 GPx4 WT response to treatment (72h) with each
  cyclometallated gold(III) compound, shown as viability curves (from 0 to 30 μM)
  and IC50 values obtained from 3 independent experiments using resazurin (alamarBlue).
  Also shown are viability curves of A375 GPx4 WT in co-treatment with buthionine
  sulfoximine (BSO), which depletes GSH. Center: Proliferation and clonogenic capacity
  of A375 WT treated after an initial 24h growth period with [Au(bnpy)Cl2] (at 3 μM)
  and [Au(Mephpy)Cl2] (at 2 μM), either without or with 50 nM (Sec)2 supplementation.
  Bottom: Proliferation and clonogenic capacity of A375 GPX4 WT and A375 GPx4 U46C
  cells treated after an initial 24h growth period [Au(Mephpy)Cl2] (at 2 μM). Confluency
  was measured every 6-8 h over 6 days using an Incucyte S3 (Sartorius) system. Top
  right: Schematic representation of possible pathway for selenoprotein inhibition
  by the gold(III) compounds. Each experiment was repeated in triplicate (n = 3).
  (For interpretation of the references to colour in this figure legend, the reader
  is referred to the Web version of this article.)'
article_title: What lies beyond thioredoxin reductase? Cyclometallated gold compounds
  reveal Sec selectivity in glutathione peroxidases
