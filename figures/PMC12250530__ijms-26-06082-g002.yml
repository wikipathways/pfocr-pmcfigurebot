figure_title: Metabolic modeling of muscle samples of ME/CFS patients.
caption: Metabolic modeling of muscle samples of ME/CFS patients. (A) Volcano plot
  of differentially changed metabolic fluxes between ME/CFS patients and controls
  (p-value < 0.05, |log2fc| > 0.2). Red, blue, and gray points represent significantly
  increased, decreased, and non-significant pathways, respectively. (B) Pathway analysis
  differential changed metabolic fluxes between ME/CFS patients and controls (FDR
  < 0.05 and |DAscroe| > 0.2). Red, blue, and gray points represent significantly
  up-regulated, down-regulated, and non-significant pathways, respectively. (C) Metabolite
  knockout analysis in ME/CFS. Effective scores greater than 0 indicate agonist metabolites,
  while scores less than 0 indicate antagonist metabolites. Administering an agonist
  metabolite, e.g., ASP, could potentially rescue the changes observed in patients.
  (D) Metabolic map of representative pathways and metabolic fluxes. The down-regulated
  reactions are enriched in alanine and aspartate metabolism in patients. In addition,
  the down-regulated reactions include reduced urea secretion and a potential increase
  in NH4 secretion
