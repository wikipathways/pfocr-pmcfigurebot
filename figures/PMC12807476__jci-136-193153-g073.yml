figure_title: Molecular disruption of the LCOR-ERα interaction restores LCOR immunogenic
  activity in HR+ BC
caption: '(A) RT-qPCR analysis of MHC-I in MCF-7 cells treated with the indicated
  anti-ER drugs. Data are represented as log2(fold change) of the normalized expression
  of the vector control condition. n = 3 individual biological replicates; data represents
  the mean. (B) Flow cytometric analysis of HLA-ABC and β2m levels in MCF-7 cells
  under the same conditions in A. n = 5 independent biological replicates. Data represent
  the MFI relative to the isotype control ± SEM. (C) Flow cytometric analysis of the
  OVA peptide SIINFEKL presented by H2-K1b in AT3-OVA vector control (Empty) or ER-OE
  (AT3-ER) cells in the different conditions: control, LCOR-OE, and LSKAA-OE cells
  treated with regular (E2+) or E2-depleted media (–E2, charcoal-stripped FBS). n
  = 3 independent biological replicates; data represent the MFI relative to the isotype
  control ± SEM. (D) RT-qPCR analysis of HLA-A, TAP1, and PSMB9 genes in vector control
  (pLKO.1) and LCOR-KD MCF-7 cells treated with vehicle or the respective anti-ER
  drugs (1 μM) or 10% charcoal medium for 24 hours. n = 3 independent biological replicates.
  Data show the mean ± SEM. (E) Pathway analysis of LCOR-coexpressed transcripts for
  pre- and post-letrozole therapy groups of patients with BC (46). Pathways are ranked
  on the basis of the OR and P value. (F) ISH images of specimens from patients with
  BC. ISH stratification of LCORhi and LCORlo HR+ tumors treated with endocrine therapy
  (aromatase inhibitor letrozole). The tumor fraction was detected by DAPI and KRT8
  staining. Scale bars: 200 μm. IHC staining of the corresponding high and low CD8+
  T cell–infiltrated tumors. TMA samples were stratified by LCOR mRNA levels into
  low, medium, and high expression of LCOR from ISH staining and the corresponding
  CD8+ T cell tumor infiltration score. *P < 0.05, **P < 0.01, and ***P < 0.001, by
  1-way ANOVA (F) and 2-way ANOVA (B–D. Cells were gated from P3 (Supplemental Figure
  8A) in B and C'
