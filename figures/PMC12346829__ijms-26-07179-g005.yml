figure_title: Analysis of NRF-2 pathway in immature monocyte-derived dendritic cells
  (iDCs) treated with Lupeol.
caption: Analysis of NRF-2 pathway in immature monocyte-derived dendritic cells (iDCs)
  treated with Lupeol. (A) Representative Western blot results for NRF2 and NQO1 (i),
  and for KEAP1 and HO-1 (ii) in the whole-cell lysates of iDCs treated with 7KCh
  or Lupeol or both for 18 h. (B) Densitometric analysis of NRF2 and NQO1 panel (i)
  and KEAP1 and HO-1 panel (ii) in iDCs. Analyses were performed with National Institutes
  of Health ImageJ 1.62 software and normalized to the appropriate housekeeping proteins
  β-tubulin or β-actin. Normalized band intensities are expressed as the ratio of
  target protein to housekeeping control as mean ± SD of 3 independent experiments.
  Significance was determined by one-way ANOVA followed by Tukey’s post hoc analysis;
  * p < 0.05; ** p < 0.01; *** p < 0.001
