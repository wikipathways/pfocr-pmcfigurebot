figure_title: ERK, PKA, YAP, and SHH signaling drives mammalian cortical lineage diversification
caption: '(A, B) Schematic of cortical RG subtypes in P3 ferret and GW22 human cortex,
  primarily consisting of oRGs, E-tRGs, and T-tRGs. (C) During corticogenesis, ERK/PKA
  activation in oRGs promotes sustained neurogenesis while suppressing gliogenesis;
  YAP/TAZ upregulation in E-tRGs drives ependymal cell production; SHH signaling in
  T-tRGs generates Tri-IPCs that differentiate into astrocytes, oligodendrocytes,
  and olfactory bulb interneurons. Notably, cortical evolution establishes ERK/PKA
  as the dominant oRG pathway through a self-reinforcing loop that actively inhibits
  both YAP and SHH signaling. This evolutionary adaptation provides two key advantages:
  (1) enhanced oRG self-renewal and (2) prolonged oRG neurogenesis, which drive the
  expanded neuronal output and neocortical volume, characteristic of human brain evolution.
  This demonstrates that cortical neurogenesis, gliogenesis, and evolutionary expansion
  constitute a unified biological program coordinated by ERK/PKA/YAP/SHH signaling'
