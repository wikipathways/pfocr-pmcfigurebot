caption: The glycolytic metabolic pathway in the characteristics of single-cell transcriptomics.
  (A) UMAP plot illustrating cell type distribution based on canonical marker genes.
  (B) Heatmap displaying the top two marker genes for each identified cell cluster.
  (C) Dot plot demonstrating significant differences in glycolysis-related metabolic
  pathway activity between control and MAFLD groups. (D) UMAP plot showing glycolysis/gluconeogenesis
  pathway activity across various cell types in MAFLD samples. (E) Box plot depicting
  glycolysis/gluconeogenesis activity levels among different cell types. (F) Circle
  plot indicating the number of intercellular interactions between immune cells and
  hepatocytes in high-glycolysis versus low-glycolysis groups. ****, p < 0.0001
