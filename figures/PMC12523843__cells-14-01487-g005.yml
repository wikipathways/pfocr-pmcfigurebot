figure_title: Kuwanon A repressed the MAPK pathway by inducing the depolymerization
  of YWHAB.
caption: Kuwanon A repressed the MAPK pathway by inducing the depolymerization of
  YWHAB. (A) The Blue-Native PAGE Running assay was used to detect the level of YWHAB
  dimer in HCC cells (MHCC97 H and SMMC 7721) after treatment with the indicated concentration
  of KA. The expression level of YWHAB and α-Tubulin was detected through SDS-PAGE
  Running assay. The DMSO groups were used as controls. (B) The Blue-Native PAGE Running
  assay was used to detect the level of YWHAB dimer in HEK 293T cells, which overexpressed
  FLAG-YWHAB, after treatment with a gradient concentration of KA. The DMSO group
  was used as a control. (C) The 25 μM and 30 μM of KA were used to treat the HEK
  293T cells, which overexpressed MYC-YWAHB and FLAG-YWHAB. The FLAG-YWHAB was pulled
  down by anti-FLAG antibody and immunoblotted with anti-MYC antibody. The DMSO group
  was used as a control. (D) The 25 μM and 30 μM of KA were used to treat the HEK
  293T cells, which overexpressed MYC-YWHAB and FLAG-Raf 1. The FLAG-Raf 1 was pulled
  down by anti-FLAG antibody and immunoblotted with anti-MYC antibody. The DMSO group
  was used as a control. (E) Western blot assays were used to determine the level
  of MEK, pMEK, ERK, pERK, and c-Myc in HCC cells (MHCC97 H and SMMC 7721), which
  were treated with the indicated concentration of KA for 48 h. The DMSO groups were
  used as controls. (F) Western blot assays were used to determine the level of MEK,
  pMEK, ERK, pERK, and c-Myc in HCC cells (MHCC97 H and SMMC 7721), which were treated
  with KA (15 μM) for 24 or 48 h. The DMSO groups were used as controls. (G) The amount
  of ERK in the cytoplasm and the nucleus was analyzed, respectively, through the
  Nuclear and Cytoplasmic Protein Extraction assay after HCC cells were treated with
  the indicated concentration of KA for 48 h. The DMSO groups were used as controls.
  (H) The localization of ERK was investigated by immunofluorescence staining and
  observed by confocal microscope after HCC cells were treated with KA (10 μM) or
  DMSO for 48 h. The DMSO groups were used as controls. Scale bars = 10 μm. All data
  are shown as the means ± SD; * p < 0.05, ** p < 0.01, *** p < 0.001
