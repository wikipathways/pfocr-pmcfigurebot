caption: (A) Relative BCL-2 mRNA expression in cell lines HFL-1 (human lung fibroblast),
  HepG2 (human hepatic carcinoma), and MCF-7 (human breast cancer). (B) DNAzyme-mediated
  BCL-2 mRNA downregulation in HepG2 and MCF-7 cell lines in 24 hrs by DNAzymes 15
  and 35a at a concentration of 200 nM. (C) Upregulation of BCL-2 pathway proteins
  PUMA and BFL-1 in HepG2 cells after treatment with DNZ15 (200 nM). (D) BCL-2 mRNA
  expression levels in cultured 4T1 cells transfected with 200 nM of DNZ15 and DNZ35a.
  mRNA levels in (B), (C), and (D) are expressed relative to the control (mock-transfected)
  set to 1. Error bars represent the mean ± SD from three separate experiments performed
  in triplicates. Significance levels are indicated as *** p < 0.001 significant and
  **** p < 0.0001 highly significant
