figure_title: Schematic diagram of the anticancer mechanism of cepharanthine in cervical
  cancer through the AMPK/P53 and Nfr2/Keap1 pathways.
caption: Schematic diagram of the anticancer mechanism of cepharanthine in cervical
  cancer through the AMPK/P53 and Nfr2/Keap1 pathways. Cepharanthine has an anticancer
  effect on human cervical cancer cells that is dependent on mitochondria-mediated
  intrinsic apoptosis through the modulation of the phosphorylating-AMPK/P53 pathway,
  upregulation of Bax expression, downregulation of Bcl-2 expression and induction
  of ROS production. Concurrently, cepharanthine increased ROS accumulation to induce
  oxidative stress by regulating the Nrf2/Keap1 pathway. NAC, an ROS scavenger, inhibited
  the ROS accumulation and reversed the apoptotic cell death of cepharanthine-treated
  cervical cancer cells. The chart drawing was performed using https://ailog.tw/lifelog/2021/06/10/picture-manager/
  (accessed on 18 April 2025)
article_title: Cepharanthine Induces Oxidative Stress and Apoptosis in Cervical Cancer
