figure_title: Protein expression levels in the BMP signaling pathway of HPLFs and
  the inhibition of BMP.
caption: Protein expression levels in the BMP signaling pathway of HPLFs and the inhibition
  of BMP. SMAD-1/5/9 and phospho-SMAD-1/5/9 were qualitatively detected by Western
  blot analysis. Stimulation of HPLFs with 100 ng/mL BMP-7 resulted in the phosphorylation
  of SMAD-1/5/9, but the addition of LDN-193189, an inhibitor of BMP signaling, qualitatively
  decreased the band intensity of phospho-SMAD-1/5/9 as its concentration increased.
  Representative qualitative results are shown
