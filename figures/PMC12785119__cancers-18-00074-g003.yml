figure_title: Signaling activation library screening reveals candidates as resistance-promoting
  pathways for FAK inhibition.
caption: 'Signaling activation library screening reveals candidates as resistance-promoting
  pathways for FAK inhibition. (A) FAKi screen shows cell viability responses of individually
  virally transduced cell populations in 92.1 cells. Resistance mutations identified
  include AKT E17K, mTOR S2215Y, PTEN R130Q, JAK3 L527R, p53 R157H, BCL2, and KRAS
  G12V, exceeding the control threshold. CTL + 3SD: mean viability of control samples
  plus three times the standard deviation used as a cutoff for resistance. (B) Dose–response
  curves for FAKi (VS-4718) in 92.1 cells demonstrate resistance phenotypes driven
  by AKT E17K, BCL2 R98H, LATS K697R, and KRAS G12V compared to parental cells. (C)
  Dose–response curves for FAKi (VS-4718) in MP46 cells confirm resistance driven
  by LATS K697R, BCL2, FAK Y180/M183A, and MEK5-DD compared to parental MP46 cells.
  Two-way ANOVA followed by Tukey post hoc, **** p < 0.0001'
article_title: 'Unraveling Resistance Mechanisms to Gαq Pathway Inhibition in Uveal
