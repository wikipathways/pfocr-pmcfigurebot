figure_title: Transcriptomic analysis of oocytes using Smart-seq2.
caption: 'Transcriptomic analysis of oocytes using Smart-seq2. Panel (A): Volcano
  plot depicting differentially expressed genes (DEGs). The x-axis represents log2
  fold change, indicating the magnitude of expression difference; the y-axis represents—log10
  (p value), reflecting statistical significance. Red dots indicate upregulated DEGs,
  blue dots downregulated DEGs, and gray dots non-significant genes. Panel (B): KEGG
  pathway enrichment scatter plot. The x-axis shows the Rich Factor (number of DEGs
  enriched in a pathway divided by total gene number in that pathway), and the y-axis
  lists KEGG pathways. Dot color intensity (red to yellow) reflects increasing enrichment
  significance (lower p/q values), and dot size is proportional to the number of DEGs
  mapped to each pathway. Panel (C): GO enrichment bar chart categorized into three
  domains: Biological Process (BP), Cellular Component, and Molecular Function. The
  x-axis displays GO terms, and the y-axis indicates the number of associated DEGs.
  Red and blue bars represent upregulated and downregulated genes, respectively. Panel
  (D): Hierarchical clustering heatmap of DEG expression profiles. Rows represent
  individual DEGs, columns represent samples, with red and blue shades indicating
  high and low relative expression levels, respectively'
