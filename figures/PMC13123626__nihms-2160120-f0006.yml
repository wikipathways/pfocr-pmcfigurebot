figure_title: SETD8 T140 phosphorylation alters H4K20me1 localization
caption: (A) k-means clustering of H4K20me1 distribution within gene bodies in WT
  and T140D tumoroids (n = 2).(B) Log2FC of H4K20me1 between WT and T140D tumoroids
  across k-means clusters.(C) Overlap between cluster 3 genes and genes significantly
  downregulated in T140D tumoroids (padj < 0.001 and log2FC < −1.0). Statistical significance
  was assessed by a hypergeometric test.(D) Log2FC of H4K20me1 between WT and T140D
  tumoroids of genes in enterocyte cholesterol gene set (WikiPathway WP5333) compared
  to all other genes. *p < 0.05, Student’s t test (n = 2).(E and F) Overlap between
  cluster 3 genes and genes in the fetal intestinal gene signature (E) or YAP target
  gene set (F).(G) Venn diagram showing overlap between YAP/TEAD CUT&RUN target genes
  and genes from H4K20me1 ChIP-seq cluster 3.(H) Representative genome browser tracks
  for H4K30me ChIP-seq and YAP/TEAD CUT&RUN at two cluster 3 genes.(I) CUT&RUN-qPCR
  for YAP at the indicated target loci. ***p < 0.001
