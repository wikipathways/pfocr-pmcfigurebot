figure_title: Impact of methionine reduction and supplementation on liver methionine
  metabolites and enzymes.
caption: Impact of methionine reduction and supplementation on liver methionine metabolites
  and enzymes. (A) The Pathway illustrating the metabolism of Met to glutathione (GSH)
  in the MR + LPS group; (B) The Pathway illustrating the metabolism of Met to GSH
  in the MS + LPS group; (C) The content of GSH in the liver; (D) The figure illustrates
  methionine adenosyltransferase (MAT), glycinamide ribonucleotide transformylase
  (GNMT), S-adenosylhomocysteine hydrolase (AHCY), 5,10-methylenetetrahydrofolate
  reductase (MTR), cystathionine β-synthase (CBS), and GSH correlations. CON, birds
  received a basal diet (0.55%; marked as 100%Met) without LPS challenge; LPS, birds
  received a basal diet (0.55%; marked as 100%Met) but were exposed to LPS; MR + LPS,
  birds received a diet lacking methionine (0.35%; marked as 60%Met) and were also
  subjected to LPS; MS + LPS, birds received a diet rich in methionine (0.75%; marked
  as 140%Met) and were challenged with LPS. Statistical significance was analyzed
  using one-way ANOVA followed by the Tukey test. n = 6/group. * Correlations deemed
  significant are within the range of 0.01 to 0.05, with red denoting positive correlations
  and green indicating negative correlations
