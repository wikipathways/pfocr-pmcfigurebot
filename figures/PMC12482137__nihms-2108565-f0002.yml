figure_title: Identification of IPMN- and grade-associated proteins and their detections
  in cyst fluids
caption: A. Comparison of 64 IPMNs and 76 normal duct tissues (NDs). Proteins with
  immunochemistry labeling are in pink. The p-values were computed using two-sided
  Wilcoxon rank sum test and adjusted (false discovery rate, FDR) using Benjamini-Hochberg
  method. B. KEGG pathway enriched by using upregulated and downregulated proteins
  in IPMN tissues relative to NDs. C. IHC labeling results of S100P, SERPINB5, and
  THBS2 in ND, low-grade (LG) IPMN, and high-grade (HG) IPMN. D. Significantly upregulated
  (red) and downregulated (blue) proteins in 34 HG IPMNs relative 30 to LG IPMNs and
  76 NDs. Proteins associate with glycosylation/cancer progression are named in red.
  E. Individual proteins show potential clinical utilities for HG IPMN detection based
  on the ROC analysis. F. Multi-protein panels improve the performance of distinguishing
  HG IPMNs from LG IPMNs. The proteins and multi-protein panels in E and F are selected
  as examples. A comprehensive ROC results can be found in the corresponding supplementary
  table. Also see Figure S2 and Table S2
