figure_title: FTY720 improves folliculogenesis, oocyte quality, and mitochondrial
  function in aged female mice.
caption: 'FTY720 improves folliculogenesis, oocyte quality, and mitochondrial function
  in aged female mice. (A) Schematic of FTY720 administration in reproductively aged
  mice. (B) H&E staining of ovarian sections from vehicle- and FTY720-treated mice.
  (C-F) Quantification of follicle numbers at different stages: primordial (C), primary
  (D), secondary (E), and antral (F). (G-H) Immunohistochemical staining and quantitative
  analysis of AMH and BMP15 expression in ovarian tissue sections. (I-J) Immunofluorescence
  staining and quantitative analysis of oxidative stress markers 8-OHdG and 4-HNE.
  (K) Fluorescence imaging of ovulated MII oocytes stained with DCFDA and MitoTracker.
  (L-N) Quantification of (L) polar body extrusion number, (M) DCFDA fluorescence
  intensity, and (N) MitoTracker fluorescence. (O) RNA-sequencing and pathway enrichment
  analysis of ovarian tissues. (P) Western blot analysis of mitochondrial trafficking
  and biogenesis markers in ovaries from aged mice treated with vehicle or FTY720.
  (Q) Representative immunofluorescence images of ovarian sections stained for Miro1
  and DAPI in tertiary follicles. Pseudocolor LUT was applied to quantify Miro1 intensity.
  (R) Quantification of Miro1 fluorescence intensity in oocytes and cumulus cells
  from (Q). (S) OCR tracing of whole ovaries measured by Seahorse assay. (T-W) Quantification
  of basal respiration (T), maximal respiration (U), ATP-linked respiration (V), and
  spare respiratory capacity (W). (X) Serum AMH levels measured by ELISA. (K) Scale
  bar = 20 µm. (B, I, Q) Scale bar = 200 µm. *p < 0.05, **p < 0.01, ***p < 0.001'
