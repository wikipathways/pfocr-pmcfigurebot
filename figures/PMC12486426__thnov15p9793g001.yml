figure_title: General pathophysiologic features across the progression of Alzheimer's
  disease.
caption: 'General pathophysiologic features across the progression of Alzheimer''s
  disease. Schematic overview of key selected pathophysiologic features present in
  AD. Genetics, environmental factors, aging, and the presence of other disease states
  (diabetes, stroke, traumatic brain injury, etc.) strongly influence these key factors
  in clinical populations and animal models. (Bottom left) Accumulation and propagation
  of pathological proteoforms of tau protein and Aβ peptides has been a long-appreciated
  mechanism underlying AD. Initial histological studies in human cadavers revealed
  neurofibrillary tangles (NFTs) and extracellular β-amyloid plaques as characteristic
  features of AD 203. However, advances in structural biology, proteomics, neuroimaging,
  and the use of transgenic animal models have provided a richer perspective of these
  two central molecular features. Shown here, smaller oligomeric forms such as paired
  helical filaments (PHF) of tau and Aβ fibrils isolated from AD cadavers, available
  on Protein Data Bank. (Top right) While the vast majority of neuronal populations
  are excitatory or inhibitory, a smaller minority of neurons comprising neuromodulatory
  systems appear highly relevant to early AD pathogenesis. Shown here, cholinergic
  neurons in the basal forebrain, also known as the basal forebrain cholinergic system
  (BFCS), histaminergic neurons whose cell bodies reside in the tuberomammillary nucleus
  (TMN) in the hypothalamus, and noradrenergic neurons in the locus coeruleus (LC).
  These neuromodulatory populations send projections to the hippocampal formation
  and broadly innervate cortical regions, where they influence cognition and memory.
  Importantly, these neurons are unmyelinated, have large projection fields and extensive
  metabolic requirements, which may make them uniquely susceptible to oxidative stress
  and neurodegeneration. Additionally, evidence suggests these brain regions, especially
  the LC, provide a neuroanatomical site for the early formation, accumulation, and
  eventual spread of tau pathology 204, 205. Characteristically, tau pathology has
  been observed early in the LC prior to spread to the entorhinal cortex (EC), hippocampus,
  and neocortex. Whereas early Aβ pathology is often observed in the EC prior to detection
  in other brain regions. (Bottom Right) The trisynaptic circuit in the hippocampus
  is essential for encoding, retrieval and other aspects of memory. Projections from
  the EC to the dentate gyrus (DG) form the perforant pathway (PP). Subsequently,
  DG neurons project to CA3 via mossy fiber pathway (MF)—which in turn, sends projections
  to CA1 via the Schaffer collateral pathway (SC). Unique cell types (e.g. place cells,
  grid cells, etc.) occupy regions of the hippocampal formation (HiF) and functionally
  support aspects of memory 206. Synaptic plasticity, such as long-term potentiation
  and long-term depression and neural oscillations such as theta rhythmicity represent
  critical neural mechanisms across the trisynaptic circuit that support memory and
  are compromised in various animal models of AD 207. Adult neurogenesis represents
  a rather unique mechanism occurring in subgranular zone (SGZ). Nascent adult neurons
  from the SGZ migrate to granular layer in the DG and send projection to CA3. This
  effect supports memory processes and is compromised in AD models 208 . Each of these
  hippocampal neural mechanisms is also supported by an array of neuromodulatory inputs,
  like the BFCS. Taken together, these key selected pathophysiologic factors facilitate
  synaptic dysfunction and neurodegeneration of the hippocampal formation which corresponds
  with the emergence of memory dysfunction in animal models. (Unshown) In late stages
  of AD, these hallmark pathological features extend broadly through the neocortex,
  which is accompanied by significant atrophy, synaptic loss, ventricular dilation
  and profound cognitive impairment as seen in patients and animal models 209, 210.
  Molecular structures are available via PDB: The Protein Data Bank H.M. Berman, J.
  Westbrook, Z. Feng, G. Gilliland, T.N. Bhat, H. Weissig, I.N. Shindyalov, P.E. Bourne
  (2000) Nucleic Acids Research, 28: 235-242. Created in BioRender. Wohlfeld, C. (2025)
  https://BioRender.com/x43y595'
