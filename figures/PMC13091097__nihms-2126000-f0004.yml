figure_title: E. coli colonization temporally regulates neuroimmune activation
caption: 'The immune cell cluster identified in Figure 2 was further sub-clustered
  to distinguish microglia from non-microglia immune cells (Table S5; NIH GEO: GSE289589).(A)
  Shows cell clustering UMAP and % of all nuclei within each cell type by treatment
  group.(B and C) Markers defining each cell cluster are overlaid upon the immune
  UMAP, with (B) representing microglia markers and (C) representing non-microglia
  markers. Differential gene expression analysis was performed on both cell clusters.(D)
  Shows violin plots of the two differentially expressed genes (DEGs) that reached
  significance (p < 0.05) in the low-powered non-microglia immune cluster.(E) Shows
  the number of DEGs that reached significance (log fold change > |1|, p < 0.001)
  in the microglia cluster at each time point.(F and G) (F) Pathway analysis of microglia
  DEGs after 2 weeks of E. coli mono-colonization and (G) after 4 weeks.(H) Flow cytometry
  was used to evaluate the uptake of fluorescent amyloid by microglia (CD45+, CD11b+,
  Ly6C−, and CD38−), BAM (CD45+, CD11b+, LY6C−, and CD38+), and infiltrating myeloid
  cell (CD45+, CD11b+, and Ly6C+) populations.(I) Quantification of CD11c+ microglia,
  a marker of DAMs.(J and K) Quantification of CD4+ and CD8+ T cells (CD45+ and CD3+)
  within (J) the blood and (K) the brain. For (A–G), cells represent 4 mice per treatment.
  For (H–I) n = 8, dots represent individual mice, and error bars represent mean ±
  SEM. * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
article_title: Indigenous gut microbes modulate neural cell state and neurodegenerative
