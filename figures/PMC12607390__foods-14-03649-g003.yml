figure_title: The effects of butyrate and amino acid catabolites in healthy population
  and colon cancer population.
caption: 'The effects of butyrate and amino acid catabolites in healthy population
  and colon cancer population. Compared with protein anaerobic fermentation, butyrate
  fermentation in healthy individuals is the predominant process, exerting a beneficial
  influence on the host. In colon cancer patients, the butyrate fermentation pathway
  is absent or impaired, and protein anaerobic fermentation is dominant, which promotes
  cancer progression. The effect of H2S on colonocytes: When the concentration of
  H2S is low, mitochondria are effectively oxidized to thiosulfate (S2O32−), and oxygen
  consumption and ATP production are increased. When the concentration of H2S is too
  high and exceeds the detoxification capacity of the cell, cytochrome C oxidase activity
  is inhibited, resulting in a decrease in oxygen consumption and ATP production.
  High concentrations of intracytoplasmic H2S induces the expression of inflammation-related
  genes. Meanwhile, nitric oxide (NO) impairs the detoxification process of H2S and
  may exacerbate its harmful effects'
