figure_title: Decision flow chart for which method to use to study cancer metabolism
  based on experimental parameters and stage of the project.
caption: Decision flow chart for which method to use to study cancer metabolism based
  on experimental parameters and stage of the project. Starting at the top of the
  chart, one must identify if their project is hypothesis-generating or hypothesis-testing.
  Untargeted metabolomics/lipidomics allows for the generation of many hypotheses
  by providing a top–down view of the metabolome. Once a hypothesis is generated,
  it can be tested based on which readouts the phenotype can be detected with, such
  as extracellular or intracellular measurements. Extracellular measurements can be
  made with the Seahorse metabolic flux assay, while intracellular measurements can
  be performed with isotope tracing and metabolic flux analysis to test specific pathways,
  or with fluorescent dyes and genetically encoded fluorescent biosensors if spatiotemporal
  dynamics are desired. The icons next to each method indicate if they are applicable
  in vitro (cell culture dish), ex vivo (tissue), in vivo (mice), or in vivo (human).
  Created in BioRender [11]
