figure_title: Increased functional glycolysis in CF jejunum and ileum
caption: Extracellular Acidification Rate (ECAR) from duodenum (A-B), jejunum (C-D),
  and ileum (E-F) ex vivo intestinal biopsy punches derived from WT (n=7–11) and CF
  (n=7–11) mice. Data presented as average over the course of 10 measurements (A,
  C, E) and cumulative average per mouse (B, D, F). Simplified glycolysis pathway
  (G). Media lactate measurements from ex vivo intestinal biopsy punches presented
  as fold change relative to wildtype within the respective intestinal regions from
  WT (n=6) and CF (n=6) mice (H). Data represent mean ± SEM. Comparisons between groups
  were performed using an unpaired, 2-tailed Student’s t test with Welch’s correction
  or using a repeated measures two-way ANOVA with the Geisser-Greenhouse correction.
  For repeated measurements, the p-value for genotype is displayed and was found to
  be p<0.0001, F (1, 20) = 26.63 for the jejunum and p<0.0001, F(1, 12) = 56.06 for
  the ileum. There was not a significant difference for genotype in the duodenum,
  p=0.2821, F (1, 12) = 1.268. For time, F (1.017, 13.22) = 238.2, p<0.0001 for the
  duodenum, F (1.107, 23.24) = 2.910, p=0.0983 for the jejunum, and F (1.365, 17.74)
  = 6.047, p=0.0171 for the ileum. * p<0.05, ** p<0.01, ***p<0.001, **** p<0.0001
article_title: Intestinal adaptations increase basolateral intestinal glucose uptake
  and glycolysis in a mouse model of Cystic Fibrosis
