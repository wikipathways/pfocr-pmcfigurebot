caption: 'Protective effects of fisetin against aging in chicken SYFs were inhibited
  by the concurrent blockade of the Nrf2 and β-catenin signaling pathways. (A,B) BrdU
  staining of SYFs from D580 hens in control, fisetin group, fisetin and ML385 combined
  treatment group, fisetin and IWR-1 combined group, ML385 alone, and IWR-1 alone
  group. Scale bar: 100 µm. (C–F) WB analysis of CDK2, CDK1, and Cyclin B1 in SYFs
  from the indicated treatment groups. Different lowercase letters indicate significant
  differences (p < 0.05)'
