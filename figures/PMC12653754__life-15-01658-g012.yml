caption: 'Genetic environmental factors: This diagram depicts the multifactorial relationships
  that contribute to overall health status. Exercise influences gene expression and
  intermediate phenotypes (e.g., metabolic rate, cardiovascular function), which in
  turn affect health outcomes. Genetic factors interact bidirectionally with intermediate
  phenotypes, modulating the effects of both exercise and environmental exposures.
  Note: Solid red arrows: Indicate direct effects or influences (e.g., exercise directly
  affecting gene expression or health status). Thick black arrows: Represent strong
  causal pathways or major determinants of health (e.g., genetic and environmental
  effects on health status). Dashed arrows: Depict indirect or feedback interactions
  (e.g., how genes and intermediate phenotypes mutually influence each other or how
  environmental factors affect gene–phenotype relationships). Bidirectional arrows:
  Show reciprocal interactions where both components influence each other (e.g., gene–phenotype
  or gene–environment feedback loops)'
