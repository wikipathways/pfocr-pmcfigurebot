figure_title: Gm39822 is an anti-inflammatory lncRNA in non-diabetic endothelial cells
  (db mECs).
caption: Gm39822 is an anti-inflammatory lncRNA in non-diabetic endothelial cells
  (db mECs). (A–H) The expression of inflammatory signaling pathways as detected using
  Western blot analysis (A) for (B) p-p65, (C) p65, (D) p50, (E) p-ERK1/2, (F) ERK1/2,
  (G) p-p38, and (H) p38 expression after knockdown of Gm39822 in diabetic endothelial
  cells (mECs) under basal conditions or Il-1β stimulation (20 ng/mL; n = 2/group)
  at the indicated time points. Quantification of cytokines (I) IL-12p70, (J) G-CSF,
  (K) GM-CSF, (L) IL-1A, (M) IP-10, (N) LIX, (O) MCP-1, (P) MIP-2, and (Q) RANTES
  in the supernatants from diabetic ECs after Gm39822 knockdown, n = 3/group. The
  data are represented as the mean ± SEM, and statistical significance was determined
  with an unpaired two-tailed Student t-test. * p < 0.05, ** p < 0.01, *** p < 0.001
