caption: 'The role of cholesterol biosynthesis pathway on the modulation of oncogenic
  signaling. (A) Effect of simvastatin on cytosolic Ras, after being treated with
  simvastatin for 24 h. (B) Band density was quantified using ImageJ and presented
  as a histogram. (C) Effect of simvastatin on expression levels of phosphorylated
  and non-phosphorylated forms of cellular Akt, mTOR, and GSK3 signaling proteins,
  after being treated with simvastatin for 24 h. (D) Band density was quantified using
  ImageJ and presented as a histogram. The Western blot results are representative
  of three independent experiments. Effect of cholesterol levels on SaOS-2 cell viability
  during treatment with cisplatin (E) or doxorubicin (F). Exogenous cholesterol was
  added to cells co-treated with cisplatin and simvastatin or doxorubicin and simvastatin.
  Cell viability was assessed using MTT assay. All experiments were performed in triplicate.
  * p < 0.05, ** p < 0.01, and *** p < 0.001 (compared within experimental groups).
  # p < 0.05, ## p < 0.01, and ### p < 0.001 (compared to control group)'
