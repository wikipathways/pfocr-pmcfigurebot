figure_title: NR-targeted strategies and RNA-based therapeutics in BCa.
caption: NR-targeted strategies and RNA-based therapeutics in BCa. (A) Schematic highlighting
  major therapeutic approaches directed at NRs implicated in BCa progression. AR antagonists
  (e.g., enzalutamide), PPARγ agonists, SERMs, SARMs, and next-generation NR inhibitors
  have demonstrated potential in modulating tumor cell proliferation and survival.
  RNA-based therapies, including miRNA mimics (e.g., miR-34a targeting HNF4G) and
  siRNA knockdown of AR, offer a complementary strategy involving interference with
  NR expression and activity. Additional miRNAs, such as miR-145, miR-124, and miR-27b,
  have been shown to modulate NR-related pathways, including PPARγ, VDR, and NR4A1
  signaling, thus affecting inflammation, apoptosis, and therapeutic resistance. (B)
  Combining strategies integrating NRs and RNA-based tools may increase therapeutic
  efficacy and offer avenues for personalized BCa management. Solid straight black
  arrows indicate direct activation, curved dashed black arrows indicate indirect
  inhibition, dashed black arrows indicate indirect activation. Created with BioRender.com
  (accessed on 1 May 2025)
