figure_title: The CBP/β-catenin pathway is involved in melanoma drug resistance.
caption: The CBP/β-catenin pathway is involved in melanoma drug resistance. (A) Venn
  diagram illustrating the intersection of genes associated with ‘CREBBP’, ‘CTNNB1′,
  and ‘melanoma drug resistance’, as identified by the GeneCards database. The intersection
  includes 594 common genes, representing more than 30% of all genes involved in melanoma
  drug resistance. A list of 594 genes was underwent over-representation analysis
  using GO categories (B) and KEGG pathways (C) to identify enriched biological processes
  and pathways. The top 30 over-represented GO and KEGG terms were illustrated using
  the clusterProfiler package in R, respectively. (D) The GSE95704 GEO dataset was
  reanalyzed to find differentially expressed genes in oral squamous cell carcinoma
  cell lines treated with ICG-001, applying thresholds of |Fold Change| ≥ 1.5 and
  Benjamini–Hochberg adjusted p-value ≤ 0.05 (blue dots). The volcano plot was generated
  using the pathlinkR package in R. Red dots represent previously identified 594 genes
  linked to the CBP/β-catenin pathway and melanoma drug resistance. Grey dots represent
  statistically insignificant genes. GO (E) and KEGG (F) enrichment analyses were
  performed on the differentially expressed genes identified in GSE95704. The top
  10 activated and suppressed annotations were visualized using the clusterProfiler
  package in R, with an adjusted p-value cutoff of 0.05. Activated and suppressed
  annotations were identified according to positive and negative values of normalized
  enrichment score (NES), respectively. GeneRatio represents the number of input genes
  in the specific KEGG or GO term, divided by total number of input genes
