figure_title: Effect of early-life antibiotic treatment and cecal material transplant
  (CMT) on fecal bacterial lipid metabolism pathways in mouse feces and subsequent
  design of lipidomic studies
caption: 'Analyses based on fecal metagenomic sequencing of P23 male NOD mice in three
  treatment groups (C, Control; 1P, 1PAT; CMT, CMT following 1PAT). Bray-Curtis distances
  for pathways identified in the metagenomic analysis with pairwise PERMANOVA analysis:
  A) 1501 metabolic pathways; B)36 lipid metabolic pathways; C) Heatmap of the 23
  identified high-prevalence lipid metabolism pathways. In unsupervised hierarchical
  clustering, the 1P samples were significantly overrepresented in Cluster 2 (p=0.014;
  FET). D) Study designs for lipidomic analyses and for administering defined lipid
  compounds to NOD mice. Experiment 1: Cecal contents of 6-week-old C57BL/6J and NOD/ShiLtJ
  Germ Free (GF) and conventional mice and their dietary materials. Experiment 2:
  Cecal contents from male NOD mice at P23 in C, 1P, CMT mouse-groups (n=6/group).
  Experiment 3: Fecal samples from human volunteers during treatment in the MIME Study,
  who received one week of (i), azithromycin (AZM), (ii), amoxicillin (AMX), or (iii),
  no antibiotic (Control). Experiment 4: in vitro assays of the defined lipids: with
  macrophage Raw blue cells to assay expression of key immune regulator NFkB, with
  intestinal epithelial cells (HT29 colonic cells & mouse small intestinal epithelial
  cells) to assay immune gene expression, and with HT29 cells to assay mitochondrial
  respiration. Experiment 5: in vivo experiments to assess restoration by administration
  of specific lipids after early-life antibiotic exposure. 1PAT-exposed pups were
  gavaged with specific lipids or solvent only for 7 days. Control mice received solvent
  only. Male pups were sacrificed at P19 for analyses of gut microbiome and intestinal
  gene expression'
article_title: Gut microbiota phospholipids regulate intestinal gene expression and
  can counteract the effects of antibiotic treatment
