figure_title: Venn diagrams and Kyoto Encyclopedia of Genes and Genomes pathway enrichment
  analyses of suppressed and enhanced genes in PT and TAL
caption: (A) Venn diagram illustrating the overlap of genes suppressed in the PT and
  TAL. The intersection contains 863 suppressed genes, where 1,542 genes are uniquely
  suppressed in PT and 320 are uniquely suppressed in TAL. (B) Venn diagram showing
  the overlap of genes enhanced in PT and TAL. The intersection includes 222 enhanced
  genes, with 155 genes uniquely enhanced in PT and 1,211 uniquely enhanced in TAL.
  (C) Kyoto Encyclopedia of Genes and Genomes (KEGG) 2011 pathway enrichment analysis
  of the suppressed gene intersection. The top pathways related to metabolism include
  oxidative phosphorylation, glycolysis, the TCA cycle, and glutathione metabolism.
  (D) KEGG 2011 pathway enrichment analysis of the shared enhanced genes. The top
  pathways include ubiquitin-mediated proteolysis, neurotrophin signaling, FOXO signaling,
  and AMPK signaling. (E) Expression levels of protein kinase AMP-activated catalytic
  subunit α2 (PRKAA2) and forkhead box O3 (FOXO3) in the PT along with representative
  genes related to apoptosis like BCL2 (BCL2, P < 0.05); death associated protein
  kinase 1 (DAPK1, P < 0.05); autophagy, including WD repeat and FYVE domain containing
  3 (WDFY3, P < 0.05) and WD repeat domain 72 (WDR72, P < 0.05); insulin receptor
  signaling (INSR, P < 0.05); insulin-like growth factor 1 receptor (IGF-1R, P < 0.05);
  and resistance to oxidative stress, including oxidation resistance 1 (OXR1, P <
  0.05). (F) Same set of genes in the TAL
