figure_title: Differential gene expression and pathway changes in TNF-mediated PH
caption: (A) Genes significantly altered across pseudotime in TNF-Tg mice. After trajectory
  analysis using Slingshot, pseudotime was calculated and genes expressing significantly
  altered pseudotime in TNF-Tg versus WT were calculated using tradeSeq. Heatmap demonstrates
  genes that vary over pseudotime. (B) Pathway analysis of genes with altered pseudotime
  in TNF-Tg conditions. Volcano plots demonstrate genes that are most differentially
  over- and underexpressed in TNF-Tg versus WT mice in (C) gCAP1 cells, (D) A/V endothelial
  cells, (E) VSMCs, and (F) collagen 13+ fibroblasts. (G) Dot plot indicating the
  most differentially regulated pathways in TNF-Tg versus WT cells in each of these
  4 populations. Dot plots colors indicate the pathway database and the x axis indicates
  significance (P value, Fisher’s exact test) of overrepresentation of the pathway
  gCAP1 cells (blue), A/V endothelial cells (lime green), VSMCs (purple), and collagen
  13+ fibroblasts (lime green)
