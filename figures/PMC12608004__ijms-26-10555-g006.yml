caption: Comparison of signaling pathways associated with genes involved in the circRNA-microRNA-mRNA
  network in the IR-f vs. SO-f and IR-s vs. SO-s comparisons. (a) Venn diagram showing
  the number of common and specific signaling pathways identified in the IR-f vs.
  SO-f and IR-s vs. SO-s comparisons. (b) Top 5 signaling pathways by significance
  level (Padj) identified for both IR-f vs. SO-f and IR-s vs. SO-s comparisons. (c)
  Signaling pathways identified for the IR-f vs. SO-f comparison, but not IR-s vs.
  SO-s. (d) Top 5 pathways by significance level identified for the IR-s vs. SO-s
  comparison, but not IR-f vs. SO-f. For each pathway, the number of up- and down-regulated
  DEGs associated with that pathway and the pathway significance level (Padj, Benjamini–Hochberg
  correction) are shown
