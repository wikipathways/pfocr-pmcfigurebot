figure_title: Signaling pathways impacting lifespan in rodent models
caption: A) Multiple manipulations to the growth hormone signaling pathway result
  in enhanced longevity. Tissues and pathway components are bolded and referenced
  manipulations are in blue font. Growth hormone releasing hormone (GHRH) is released
  by specialized neurons in the hypothalamus, and the release of this hormone is abrogated
  in Ghrh knockout animals25. Cells in the anterior pituitary express growth hormone
  releasing hormone receptor (GHRH-R), which is encoded by the Ghrhr gene that is
  mutated in Ghrhrlit/lit animals23. The development of the anterior pituitary is
  controlled by the transcription factors encoded by the genes Prop1 and Pit1, which
  are mutated in two long-lived dwarf strains21,22. The growth hormone receptor (GHR)
  is expressed widely throughout the body, including in the liver, which produces
  IGF-1107. Ghr disruption causes dwarfism and enhanced lifespan24. Liver-specific
  knockout of the gene encoding IGF-1 results in enhanced female, but not male, longevity32.
  B) Manipulations to the IGF-1/AKT/TOR signaling axis enhance longevity and target
  hallmarks of aging. Pathway components are bolded and referenced manipulations are
  in blue font underneath. Binding of the ligand to either the insulin-like Growth
  Factor 1 Receptor (IGF-1 Receptor) or insulin receptor (IR) results in phosphorylation
  of members of the insulin receptor substrate family. Global haploinsufficiency of
  Igf1r results in enhanced longevity in females, but not males30, while a fat specific
  deletion of the insulin receptor (FIRKO) mouse model has enhanced longevity in both
  male and female animals26. Likewise, knockout of Irs1 which encodes a member of
  the IRS adapter protein family, enhanced lifespan in both male and female animals27,100.
  Canonically, Insulin-like growth factor 1 (IGF-1) and insulin converge at the PI3K/AKT
  (pictured) and Ras/MAP kinase (not pictured) pathways108. AKT refers to the three
  mammalian isoforms of the protein kinase AKT, which signal to downstream targets
  of the insulin/IGF1 signaling pathway109. Mechanistic target of rapamycin (mTOR,
  encoded by the gene Mtor) is a serine/threonine protein kinase, which forms two
  distinct protein complexes110. As part of mechanistic target of rapamycin complex
  2 (mTORC2) it phosphorylates AKT110. Akt1 haploinsufficiency extends mean lifespan
  in male and female mice28. The FOXO family of transcription factors are key regulators
  of cellular quality control, and are inhibited upon phosphorylation by AKT109. FOXOs
  regulate cellular proteostasis, autophagy, mitophagy, and preservation of the stem
  cell niche in a variety of tissues111,112. Disruption of these processes are considered
  hallmarks of aging113 AKT additionally phosphorylates TSC2, preventing the GTPase-activating
  protein activity of the TSC1–TSC2 complex on the GTPase Rheb114. This results in
  the activation of mechanistic target of rapamycin complex 1 (mTORC1)114. Through
  downstream effectors, mTORC1 regulates lipid synthesis, glycolysis and negatively
  regulates autophagy115. Additionally, mTORC1 phosphorylates S6K1, resulting in the
  initiation of protein synthesis115. An mTor hypomorphic mutation enhanced lifespan
  in male and female mice, whereas knockout of S6k1 (encoding Ribosomal protein S6
  kinase, S6K1) robustly increased median lifespan in female but not male animals29,31
