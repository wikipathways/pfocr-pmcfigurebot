figure_title: Physiological role of Nrf2 in intestinal development, epithelial homeostasis,
  and barrier maintenance.
caption: 'Physiological role of Nrf2 in intestinal development, epithelial homeostasis,
  and barrier maintenance. During embryogenesis (E14.5–E18.5), Nrf2 regulates villus–crypt
  formation, epithelial lineage balance, and developmental pathways including Notch1,
  Math1, and Wnt/β-catenin. In the adult intestine, Nrf2 maintains homeostasis by
  supporting tight-junction (TJ) integrity through the ERK/Nrf2/HO-1 pathway (ERK:
  extracellular signal-regulated kinase; HO-1: heme oxygenase-1), promoting autophagy
  and limiting apoptosis, protecting mitochondrial DNA, and reducing ROS (reactive
  oxygen species). Nrf2 also enhances ATP production and transepithelial electrical
  resistance (TEER) while regulating acetylcholine signaling and Ca2+ flux in smooth
  muscle to ensure proper motility'
