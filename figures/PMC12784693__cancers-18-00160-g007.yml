figure_title: Immune infiltration patterns and immune-regulatory gene landscapes across
  NMRS risk groups.
caption: Immune infiltration patterns and immune-regulatory gene landscapes across
  NMRS risk groups. (A) Integrated heatmap illustrating multiple immune cell infiltration
  signatures, immune-related functional pathways, and immune activity scores between
  high- and low-NMRS-risk groups, derived using ssGSEA, GSVA, and additional immune-profiling
  approaches. (B) Correlation of NMRS risk scores with ESTIMATE-derived stromal, immune,
  ESTIMATE, and tumor purity indices, highlighting differences in tumor microenvironment
  composition between the two risk groups. (C) Expression patterns of diverse immune-regulatory
  gene categories—including immunostimulatory factors, immunosuppressive molecules,
  chemokines, chemokine receptors, and antigen presentation-related genes—shown for
  high- and low-NMRS groups
