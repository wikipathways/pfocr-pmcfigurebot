figure_title: Profiling of snRNA-seq and snATAC-seq in neonatal patients who underwent
  CPB
caption: (A) Schematic of PBMC sampling from congenital neonatal patients who underwent
  CPB. PBMC samples from four stages were collected from each patient. Pre represents
  before heart surgery; Post represents after heart surgery; and 8 and 24 h represent
  recovery stages.(B) Uniform manifold approximation and projection (UMAP) plot for
  cell clustering and cell type annotation of 124,526 cells based on snRNA-seq. Thirteen
  cell types were annotated.(C) Distribution of cell fractions of annotated cell types
  based on snRNA-seq across four stages. The proportion of classical monocytes, CD8+
  NKT-like cells, and naive CD4+ T cells are labeled, with values in parentheses representing
  the percentage increase in classical monocytes.(D) UMAP plot for cell clustering
  of 102,673 cells based on snATAC-seq and cell type annotation mapping from snATAC-seq.
  Eleven cell types were annotated.(E–G) DEGs were identified at Post, 8 h, and 24
  h time points as compared to the baseline stage (Pre), respectively. The topportion
  represents the count of DEGs. The bottom portion represents the distribution of
  average log2FoldChange of these DEGs in each cell type.(H) Functional enrichment
  results of these DEGs detected at Post, 8 h, and 24 h sampling points. Gradient
  yellow to blue color represent the value of −Log(P). The size of the dots represents
  the count of genes in each pathway. Statistical significance was accepted at p <
  0.01. Res, response; Immu, immune; Acti, activity; Pos, positive; and Reg, regulation.(I)
  Heatmap showing the count of open and closed ATAC-seq peaks identified at Post,
  8 h, and 24 h time points across all cell types in PBMCs from patients exposed to
  CPB.(J) Structure annotation of snATAC-seq peaks detected in all cell types among
  PBMCs from patients who underwent CPB. Over 60.07% peaks were located in promoter
  regions
