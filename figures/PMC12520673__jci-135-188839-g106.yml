figure_title: Synergistic inhibition of persister cell development and resistance
  by combined CDK4/6i and CDK7i
caption: (A) Dot plot of enriched reactome gene sets in persister versus non-persister
  MDA-MB-231 cells after 14 days of palbociclib (1 μM) treatment. Significant enriched
  pathways were defined as adjusted P < 0.05 and FDR < 0.25. Dot size indicates gene
  count, and color indicates adjusted P values. (B) GSEA plot showing increased RNA
  polymerase II signaling in persister cells relative to non-persister cells. Normalized
  enrichment score (NES) and q values are shown. (C) Synergy analysis of palbociclib
  and SY5609. Synergy scores ± 95% CIs were calculated using the Bliss independence
  model (n = 3 biological replicates). (D and E) Heatmaps of single-cell CDK4/6 and
  CDK2 activity traces in MDA-MB-231 cells treated with palbociclib (1 μM) alone (D)
  or in combination with SY5609 (50 nM) (E). Percentages denote the proportion of
  persister cells (CDK2 activity > 1.0 for over 4 h during 30–48 h after treatment).
  (F) Quantification of persister cells in MDA-MB-231 and MCF-7 cells across treatment
  conditions. Data are shown as means ± SD (n = 3 biological replicates). P values
  were calculated by 1-way ANOVA with post hoc Tukey’s test (*P ≤ 0.05; ***P ≤ 0.0001).
  (G) Immunoblot analysis of Rb and β-actin in cells treated with DMSO, palbociclib
  (1 μM), or palbociclib + SY5609 (50 nM) for 48 h. (H) Representative clonogenic
  assay showing colony formation after 28-day treatment with palbociclib (1 μM), SY5609
  (50 nM), or their combination (n = 3 biological replicates). (I) Quantification
  of colony area (%) across treatments. Data are shown as means ± SD (n = 3 biological
  replicates). P values were calculated by 1-way ANOVA with post hoc Tukey’s test
  (*P ≤ 0.05; **P ≤ 0.001; ***P ≤ 0.0001)
