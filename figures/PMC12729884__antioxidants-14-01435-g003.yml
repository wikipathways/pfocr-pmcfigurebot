figure_title: Communication and metabolism in HOX population.
caption: 'Communication and metabolism in HOX population. (A) Interaction network
  diagram illustrating the number and intensity of cellular communications among HOX,
  LOX, DTOX, and other cell types within AMI tissues. Each node represents a cell
  type, distinguished by a unique color: HOX (pink), LOX (light purple), DTOX (green),
  Fibroblast (orange), Endothelial (purple), Cycling cells (cornflower blue), Myeloid
  (navy blue), Lymphoid (brown), Pericyte (light green), Adipocyte (red), Mast (sky
  blue), vSMCs (yellow) and Neuronal (forest green). (B) Ligand-receptor interactions
  between HOX, LOX, DTOX cells, and various other cell types. (C) Enrichment of HOX
  cells in various metabolic pathways. The pathways are ranked based on their significance,
  with positive values indicating enrichment in HOX and negative values in LOX. (D)
  Significant changes in AMI-related metabolic pathways involving HOX cells. The bubbles’
  size represents the pathways’ value, and the color gradient indicates the activity
  level for each metabolic pathway in different groups'
