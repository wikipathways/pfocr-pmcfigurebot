figure_title: Comparison of effects between apelin-13 gene transfer and continuous
  infusion approaches.
caption: Comparison of effects between apelin-13 gene transfer and continuous infusion
  approaches. (Aa) After implanting apelin-13 osmotic mini-pumps or delivering AAV2-apelin-13
  to the PVN, MI was induced and heart and brain tissues collected at 3-, 7-, 14-
  and 28-days post-MI (n=6 in each group). Location of the stained PVN brain sections
  shown in (b) and (c), based on the rat brain atlas of C. Watson and G. Paxinos (24).
  (c) Fluorescence micrograph (magnification, ×10) demonstrating the localization
  of apelin-13 within the PVN. 3v is the third ventricle. (d) Overlap of (e), (f)
  and (g), showing that the green fluorescence is neuronally located. (e) Fluorescence
  micrograph (magnification, ×40) indicating the localization of apelin-13 in PVN
  cells immunostained with an anti-apelin antibody (green). (f) Same field of cells
  as in panel (e), immunostained with anti-NeuN antibodies (red). (g) DAPI staining
  of the same field of cells in panel (e). (B) Molecular pathways regulating apoptotic
  and inflammatory pathways were assessed through western blotting of the expression
  of Bax, Bcl-2, TGF-β1 and Smad2 over time in MI model rats and the expression of
  the V1a receptor and GARγ2 induced by apelin-13 overexpression in the PVN. (C and
  I) Quantification of the fold change in target gene expression vs. GAPDH expression.
  The data (n=6 rats per group, 3 technical replicates) in (C-I) are shown as mean
  ± SEM and were analyzed via an unpaired two-tailed t test. *P<0.05; **P<0.01; ***P<0.001.
  Post-hoc power exceeded 80% for all key comparisons. PVN, paraventricular nucleus;
  MI, myocardial infarction; GT, gene transfer; CI, continuous infusion
article_title: Apelin-13 in the paraventricular nucleus (PVN) attenuates myocardial
