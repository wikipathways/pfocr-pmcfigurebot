figure_title: Q901 disrupts MYC-E2F-DNA damage repair transcriptional axis
caption: '(A) GSEA of pan RNAPII ChIP-seq data following Q901 treatment (n = 2; fgsea
  p-value ≤ 0.05). (B) Average MYC ChIP-seq signal plot of MYC targets V1 gene set.
  (C) Average E2F1 ChIP-seq signal plot of E2F targets V1 gene set. (D) Heatmap showing
  log2FC values of MYC and E2F1 expression from mRNA-seq data and western blot showing
  MYC and E2F1 protein levels with or without Q901 treatment (right; n = 3; two-way
  ANOVA followed by Šidák''s multiple comparison, data represent mean ± SD; ***: p
  < 0.001). (E) Average plots and heatmaps showing MYC ChIP-seq signals for MYC-clustered
  genes (left), and E2F1 ChIP-seq signals for E2F1-clustered genes (right). (F) Average
  plots of MYC and E2F1 ChIP-seq signals for MYC cluster 1 and E2F1 cluster 1 genes.
  (G) Venn diagram showing the overlap between MYC cluster 1 and E2F1 cluster 1 protein-coding
  genes. (H) GO analysis of protein-coding genes commonly present in MYC cluster 1
  and E2F1 cluster 1. (I) Volcano plot of mRNA-seq signals after Q901 24h treatment
  (n = 3; blue dot indicates p-value ≤ 0.05 and log2FC ≤ −0.58; red dot indicates
  p-value ≤ 0.05 and log2FC ≥ 0.58). DNA damage pathway genes indicated by a red dot
  and labeled. (J) Western blot data of total H2AX and its phosphorylated form of
  H2AX (γH2AX) after Q901 treatment for indicated times (n = 4; ordinary one-way ANOVA
  followed by Šidák''s multiple comparison, data represent mean ± SD; **: p < 0.01,
  ***: p < 0.001)'
