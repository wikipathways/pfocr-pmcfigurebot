figure_title: Schematic representation of the molecular pathways linking exercise-induced
  myokines (irisin, IL-6, and BDNF) and adipokines (adiponectin) to KP regulation
  and neuroprotection.
caption: Schematic representation of the molecular pathways linking exercise-induced
  myokines (irisin, IL-6, and BDNF) and adipokines (adiponectin) to KP regulation
  and neuroprotection. Adiponectin inhibits NF-κB signaling via AMPK/SIRT1 activation,
  reducing the levels of proinflammatory cytokines (IL-6, TNF-α, IL-1β, and COX-2)
  and downregulating IDO, thereby limiting peripheral KYN accumulation. AMPK, which
  is activated by adiponectin, irisin and IL-6, stimulates PGC-1α and PPARα, which
  enhance KAT activity and favor the production of KYNA over QA. Through PI3K/Akt
  and Ras/Raf/MEK/ERK signaling, irisin and BDNF promote cell survival, neuroprotection,
  and mitochondrial biogenesis and reduce oxidative stress while also indirectly sustaining
  KAT activity. Crosstalk between AMPK, Akt, ERK1/2, and CREB integrates metabolic
  and neurotrophic signals, leading to increased cellular resilience, protein synthesis,
  and neuroprotection. Collectively, these pathways remodel the KP toward a neuroprotective
  profile (↑ KYNA/QA ratio) and reduce neurotoxic drive in the brain. (AMPK—AMP-activated
  protein kinase, Akt—Protein kinase B, BDNF—Brain-derived neurotrophic factor, COX-2—Cyclooxygenase-2,
  CREB—cAMP response element-binding protein, ERK1/2—Extracellular signal-regulated
  kinases ½, GSK3—Glycogen synthase kinase 3, IDO—Indoleamine 2,3-dioxygenase, IL-1β—Interleukin-1
  beta, IL-6—Interleukin-6, IRF1—Interferon regulatory factor 1, KAT—Kynurenine aminotransferase,
  KP—Kynurenine pathway, KYNA—Kynurenic acid, mTOR—Mechanistic target of rapamycin,
  NF-κB—Nuclear factor kappa B, NRF1—Nuclear respiratory factor 1, PGC-1α—Peroxisome
  proliferator-activated receptor gamma coactivator 1-alpha, PI3K—Phosphatidylinositol-3-kinase,
  PPARα—Peroxisome proliferator-activated receptor alpha, QA—Quinolinic acid, Raf—Rapidly
  accelerated Fibrosarcoma kinase, Ras—RBat sarcoma oncogene family GTPase, SIRT1—Sirtuin
  1, TFAM—Mitochondrial transcription factor A, TNF-α—Tumor necrosis factor alpha,
  TrkB—Tropomyosin receptor kinase B, down arrow ↓ indicate decrease, up arrow ↑ indicate
  increase, an X on a line indicates blocking)
