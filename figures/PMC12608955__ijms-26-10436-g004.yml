figure_title: Schematic representation of the cGAS–STING pathway in CUMS-induced neuroinflammation
  and its modulation by Vitamin D3.
caption: Schematic representation of the cGAS–STING pathway in CUMS-induced neuroinflammation
  and its modulation by Vitamin D3. Chronic stress triggers cGAS–STING signaling,
  elevating pro-inflammatory cytokines and activating microglia, resulting in reduced
  BDNF expression and neuronal impairment. Vitamin D3 counteracts these effects by
  suppressing cGAS–STING activation, limiting inflammation, and restoring BDNF levels.
  (↑) indicate an increase or activation, whereas (↓) indicate a decrease or suppression
  and T-bar symbols (├) represent inhibition
