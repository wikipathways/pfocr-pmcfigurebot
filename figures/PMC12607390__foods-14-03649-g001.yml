caption: 'This figure illustrates the relevant pathways involved in the fermentation
  of AAs, such as glutamate and lysine, as well as the fermentation of polysaccharides
  to produce butyrate within the metabolism of gut microbiota. It integrates the Wood–Ljungdahl
  pathway, highlighting the material transformations and interactions among various
  metabolic routes. Different colored dashed boxes represent distinct metabolic pathways:
  the blue dashed box encompasses amino acid metabolism pathways; the green dashed
  box indicates the Wood–Ljungdahl pathway; and the central section depicts the fermentation
  of polysaccharides by gut microbiota to produce butyrate'
