figure_title: The protective effects of the drug-free nanodevice CSE-P12 on DNA virus
  HAdV4-induced lung injury in mice.
caption: The protective effects of the drug-free nanodevice CSE-P12 on DNA virus HAdV4-induced
  lung injury in mice. (A) The viral pneumonia mouse model by HAdV4 infection through
  intranasal administration (5×106 PFU per mouse); mice were treated with PBS or CSE-P12
  (500 nM, 50 μL) through intratracheal (i.t.) injection at 1 h before and on Day
  2 and Day 4 after infection. (B) Immunoblots showing the expression of STING and
  phosphorylated TBK1 (p-TBK1) and IRF3 (p-IRF3) in the cGAS-STING pathway in the
  lung tissues; β-actin or GAPDH as the internal control. (C-E) The densitometry analysis
  on the expression of STING (C), p-TBK1 (D), and p-IRF3 (E) in the immunoblots in
  (B). (F, G) The mRNA levels of Ifnb1 (F) and Isg15 (G) in the mouse lung on Day
  5 by RT-qPCR. (H) The H&E images of mouse lung sections from uninfected (PBS), HAdV4
  infected, and HAdV4+CSE-P12 groups; scale bar = 2 mm (top) or 200 μm (bottom); black
  arrows indicated the perivascular and interstitial infiltration of inflammatory
  cells and the lung consolidation; red arrows indicated infiltrated neutrophils.
  (I) Histological scores of the H&E images in (H); N = 3 for the PBS group, N = 6
  for the HAdV4 and HAdV4+CSE-P12 groups. *p < 0.05, **p < 0.01, ***p < 0.001, ****p
  < 0.0001
article_title: Attenuation of cGAS-STING signaling-mediated lung inflammation during
  infection through autophagy induction by bioactive nanodevices
