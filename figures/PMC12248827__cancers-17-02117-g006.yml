figure_title: Spatial transcriptomics analysis of osteosarcoma.
caption: Spatial transcriptomics analysis of osteosarcoma. (A) Estimated fractions
  of major classes of cell types per spot as determined by deconvolution using RCTD
  and the single cell reference dataset. The immune class was aggregated from values
  inferred for 12 subtypes of immune cells. Osteosarcoma, endothelial, and osteoclast
  were calculated directly. (B) Estimated fractions of 13 immune cell subtypes per
  spot inferred by deconvolution showed variability between patients. (C) H&E images
  overlayed with spot cluster membership determined by unsupervised clustering of
  gene expression defining regional patterning. (D) Cluster membership information
  depicted as a UMAP plot (left) and as a percent of total spots for each patient
  (right). (E) Heatmap with z-scores based on the median cell type fraction per cluster.
  (F) Heatmap with z-scores based on the median PROGENy scores per cluster. These
  scores of relative pathway activity based on weighted gene expression levels were
  calculated per spot. Asterisks indicate the adjusted significance level for enrichment
  determined by one-sided Wilcoxon rank sum test. Spots in a single cluster were compared
  to all other spots. *, p < 0.05; **, p < 0.01; ***, p < 0.001
