figure_title: Steroid metabolism is altered during HSC senescence.
caption: Steroid metabolism is altered during HSC senescence. (A) Dot plot showing
  Gene Ontology (GO) metabolic pathway enrichment of the differentially expressed
  genes (DEGs) during human HSC aging. (B) Workflow of GEMs constructed from RNA-seq
  (Young n = 10, Old n = 10) and scRNA-seq (Young n = 5, Old n = 3) data to prioritize
  metabolic changes in aging HSCs. (C) Comparison of relative subsystem coverage between
  young and aged human HSCs GEMs, showing only subsystems with top deviation between
  the two models, based on RNA-seq (left) and scRNA-seq data (right). (D) Top 10 metabolic
  reactions within the steroid metabolism pathway exhibiting the largest increase
  in reaction ratio in aged compared to young HSCs, based on GEM simulation results
