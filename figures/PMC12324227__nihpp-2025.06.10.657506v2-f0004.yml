caption: Connectivity score distributions for pathways across cells under different
  treatments This figure presents z-scores derived from generalized Jaccard scores,
  comparing single-cell transcriptomic profiles to pathway signatures. (A) Boxplots
  illustrate the distribution of z-scores for various chemicals (rows) across different
  concentrations, focusing on adaptive stress response pathways (columns), including
  apoptosis (APO), autophagy (AUT), DNA damage response (DDR), heat shock response
  (HSR), hypoxia response (HPX), oxidative stress response (OSR), senescence response
  (SEN), and unfolded protein response (UPR). (B) A heatmap summarizes the z-scores,
  capturing the activation levels of stress response pathways (SRPs) (columns) across
  the different chemical treatments (rows). These visualizations reveal the dose-dependent
  activation of specific pathways in response to chemical exposures
