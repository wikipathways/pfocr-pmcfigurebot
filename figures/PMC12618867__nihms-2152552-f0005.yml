figure_title: The problems and innovative ex vivo solutions to study fibrosis.
caption: The problems and innovative ex vivo solutions to study fibrosis. (A) Studies
  have shown a dysregulation between ECM and collagen synthesis and its degradation
  and uptake/recycling by macrophages and fibroblasts during pulmonary fibrosis. These
  processes are reduced with age and as fibrosis progresses, leading to matrix accumulation.
  (B) The usual interstitial pneumonia/IPF fibroblastic focus is a collagen biosynthesis
  factory embedded in a distinct ECM with unique spatial components and signaling
  pathways highlighting the complexity of targeting matrix components as a therapeutic
  pathway for treatment in IPF. (C) Novel in vitro bio-click ECM systems can be generated
  to encompass multiple unique ECM components to replicate tissue- and cell-specific
  cell–ligand interactions and stiffness-associated mechanical properties and have
  degradable properties to understand matrix resolution. (A) Figure created in Biorender.
  (B) Modified from Herrera et al. (94). (C) Modified from Kristi Anseth and created
  in Biorender. APOE = apoliporotein E; DRD1 = dopamine receptor D1; ECM = extracellular
  matrix; FAP = fibroblast activation protein; MRC = mannose receptor C-type; MFGE8
  = milk fat globule EGF and factor V/VIII domain; MMP = matrix metalloproteinase;
  UIP = usual interstitial pneumonia
