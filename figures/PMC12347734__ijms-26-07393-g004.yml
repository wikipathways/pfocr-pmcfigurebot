caption: 'Schematic of M1 muscarinic receptor (M1R) signaling via the Gq protein pathway.
  When acetylcholine (ACh) binds to M1R, the Gq heterotrimeric protein (α, β, γ) becomes
  activated, exchanging GDP for GTP on the α-subunit. The activated Gqα then stimulates
  phospholipase Cβ (PLCβ), which cleaves the membrane lipid phosphatidylinositol 4,5-bisphosphate
  (PIP2) into two second messengers: inositol 1,4,5-trisphosphate (IP3) and diacylglycerol
  (DAG). IP3 diffuses through the cytosol and binds to IP3 receptors on the endoplasmic
  reticulum (ER), triggering Ca2+ ion (Ca2+) release into the cytosol. Increased cytosolic
  Ca2+, along with DAG, mediate downstream signaling events that lead to various cellular
  responses. Created with BioRender. Sanjana Chauhan. (2025) https://BioRender.com/akv9wt9
  (accessed on 28 May 2025)'
