figure_title: TFPI2 enhances HCC sensitivity toward sorafenib in vitro and in vivo.
caption: 'TFPI2 enhances HCC sensitivity toward sorafenib in vitro and in vivo. (A)
  RNA-seq was performed to sequence TFPI2-overexpressing cells, followed by GSEA enrichment
  analysis of related pathways. (B) A CCK8 assay measured HCC cell viability after
  TFPI2 overexpression and sorafenib treatment at various concentrations. Data are
  shown as the mean ± SEM of n = 3 biological replicates. *p < 0.05. (C) Mice were
  divided into sorafenib and vehicle groups after being injected with MHCC97H with
  TFPI2 overexpressing or control for two weeks. Sorafenib was administered at 30
  mg/kg via gavage, with tumor volumes measured every other day. After two weeks,
  mice were sacrificed, and xenografts were harvested. Tumor volume and tumor size
  data are presented as mean ± SEM. *p < 0.05. (D) IHC detected Ki67 and PARP expression
  in tumor sections. IHC staining was evaluated using histochemical scoring. Data
  are presented as mean ± SEM. *p < 0.05. Scale bars: 250 µm (LM), 50 µm (HM). (E)
  TUNEL staining assessed apoptosis in tumor sections. TUNEL-positive cells were counted
  with ImageJ. Data are presented as mean ± SEM. *p < 0.05. Scale bar: 100 µm. (F)
  HCC organoids were generated to verify TFPI2 overexpression effects on sorafenib
  sensitivity, with sensitivity measured after one week using a 3D cell viability
  assay kit and presented as a histogram. Data are presented as mean ± SEM. *p < 0.05.
  Scale bar: 50 µm'
