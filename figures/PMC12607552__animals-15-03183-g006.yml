caption: KEGG pathway annotation of transcriptomic and proteomic data from gastrocnemius
  muscle of Wuding hens at 160 days of age. (A) KEGG pathway enrichment of differentially
  expressed genes (DEGs) from transcriptome analysis. (B) KEGG pathway enrichment
