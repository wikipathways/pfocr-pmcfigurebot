  KEGG pathways from transcriptomic data along with associated gene sets. (D) Top
  enriched KEGG pathways from proteomic data along with corresponding gene sets. (E)
  KEGG pathways commonly enriched in both transcriptomic and proteomic datasets. (F)
  Representative gene sets enriched in the overlapping pathways; pink indicates upregulation
  and green indicates downregulation
