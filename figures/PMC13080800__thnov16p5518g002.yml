figure_title: Clinical relevance of the HIF-1α/ATR axis in LUAD and the rationale
  for dual-targeting radiosensitization.
caption: Clinical relevance of the HIF-1α/ATR axis in LUAD and the rationale for dual-targeting
  radiosensitization. (A) Differential mRNA expression of HIF-1α and ATR in LUAD and
  adjacent normal tissues from TCGA cohort. (B, C) Overall survival (OS) of patients
  stratified by high versus low expression of (B) HALLMARK_HYPOXIA and (C) HALLMARK_DNA_REPAIR
  gene signatures using the median value as a cut-off, with hazard ratios (HRs) and
  95% confidence intervals (CIs) estimated using Cox proportional hazards models.
  (D) Spearman correlation analysis between HIF-1α and ATR mRNA levels in LUAD tumors.
  (E, F) Enrichment analyses were performed on DEGs identified between irradiated
  and non-irradiated LUAD samples in the GEO dataset GSE239495, including (E) KEGG
  pathway analysis and (F) GO biological process analysis. (G) Schematic illustration
  of integrating clinical transcriptomic data from TCGA and radiation-response transcriptomic
  data from GEO to reveal the interplay between hypoxia and ATR-associated signaling
  and guide the design of a co-delivery nanotherapeutic strategy for radiosensitization
article_title: Synergistic nanomedicine overcomes hypoxia-driven DNA repair to potentiate
  radiotherapy for lung adenocarcinoma
