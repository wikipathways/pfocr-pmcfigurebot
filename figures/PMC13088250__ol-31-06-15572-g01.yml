figure_title: Enzymatic machinery of protein lactylation.
caption: 'Enzymatic machinery of protein lactylation. Lactylation is dynamically regulated
  by three classes of enzymes: writers (green boxes), which install lactyl groups;
  erasers (orange boxes), which remove lactylation; and readers (purple boxes), which
  recognize lactylated substrates to trigger downstream effects. Lactylation regulatory
  enzymes in cancer (including p300, AARS1/2 and HDACs) achieve precise and context-dependent
  control through multiple mechanisms, such as substrate competition between lactyl-CoA
  and acetyl-CoA, differential subcellular localization and crosstalk with metabolic
  and oncogenic signaling pathways. These coordinated layers of regulation govern
  both histone and non-histone lactylation, ultimately shaping tumor-associated outcomes
  illustrated in the lower panel, including proliferation, migration and invasion,
  metabolic reprogramming and therapy resistant. AARS1/2, alanyl-tRNA synthetase 1/2;
  HDACs, histone deacetylases; SIRT, sirtuins; La, lactate; KATs, lysine acetyltransferases;
  PDH, pyruvate dehydrogenase; NAA10, N-alpha-acetyltransferase 10; GTPSCS, succinyl-CoA
  synthetase (GTP-forming); MYSTs, MYST family of histone acetyltransferases; OXOPHOS,
  oxidative phosphorylation; PDC, pyruvate dehydrogenase complex; CPT2, carnitine
  palmitoyltransferase 2; KAT2A, lysine acetyltransferase 2A; KAT7, lysine acetyltransferase
  7; Brg1, Brahma-related gene-1; TRIM33, tripartite motif-containing 33; DPF2, double
  PHD fingers 2; RRAS2, related RAS viral oncogene homolog 2; EMT, epithelial-mesenchymal
  transition; VCAM1, vascular cell adhesion molecule 1; EGR1, early growth response
  1; NNMT, nicotinamide N-methyltransferase; ALDH3A1, aldehyde dehydrogenase 3 family
  member A1; CCND1, cyclin D1; GCLC, glutamate-cysteine ligase catalytic subunit;
  HR, homologous recombination; ASH2L, absent small and homeotic 2-like; YAP, Yes-associated
  protein; BLM, Bloom syndrome helicase; METTL3, methyltransferase-like 3; NHEJ, non-homologous
  end joining; XLF, XRCC4-like factor; AK2, adenylate kinase 2; PFKFB4, 6-phosphofructo-2-kinase/fructose-2,6-biphosphatase
  4; PTBP1, polypyrimidine tract binding protein 1'
