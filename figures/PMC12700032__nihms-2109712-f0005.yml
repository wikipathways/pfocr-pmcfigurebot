figure_title: DDR2 modulates ferroptosis resistance through the non-canonical p62-KEAP1-NRF2
  pathway in human ovarian CAF68 cells
caption: (A) Schematic of the canonical and non-canonical NRF2 regulatory pathways.
  (B) Western blot of DDR2, S349 phosphorylated (phospho-) and total p62 in shSCR
  and shDDR2 CAF68 cells. Ticked numbers indicate molecular weights (kDa). (C) Expression
  of SQSTM1/p62 mRNA in shSCR and shDDR2 CAF68 cells determined by quantitative qPCR.
  (D) Western blot of DDR2, NRF2, and p62 expression in shSCR and shDDR2 CAF68 cells
  treated (48 hours) with the specific NRF2 inhibitor ML385 (10μM) or NRF2 activator
  TBHQ (10μM). (E) Western blot of DDR2, FTH1, KEAP1, NRF2, p62, and xCT expression
  in shSCR CAF68 cells transfected with control non-targeting siRNA (siNT) or siRNA
  against p62 (sip62). (F) Quantification of xCT and FTH1 relative expression determined
  by densitometric analysis of western blot bands in panel E. Data are mean ± SEM
  (n=6 biological replicates). (G) Viability of shSCR CAF68 cells transfected with
  non-targeting siRNA (siNT) or siRNA against p62 (sip62) and treated with Erastin
  (10μM; 16h). (E-G) Cells were collected or treated at least 72 hours post siRNA
  transfection. (C, F, G) Data are mean ± SEM (n=6 biological replicates). (C, F)
  One sample t-test; ns no significance, * p < 0.03, ** p < 0.002; two-tailed. (G)
  t-test; * p < 0.03; paired, two-tailed
article_title: DDR2 confers ferroptosis resistance to cancer-associated fibroblasts
  and attenuates PARPi sensitivity of ovarian tumor cells
