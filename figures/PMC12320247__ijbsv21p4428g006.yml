figure_title: FGF19 induces changes in the Wnt/β-catenin signalling pathway.
caption: FGF19 induces changes in the Wnt/β-catenin signalling pathway. a. Pie chart
  showing the specific proportions of enriched signalling pathways. b. KEGG analysis
  based on RNA sequencing data showing that high proportions of the targets that interact
  with FGF19. c. Heatmap showing the relative gene changes in the Wnt signalling pathway
  based on RNA sequencing. d. Protein‒protein interactions showing the interaction
  network of Wnt signalling pathways surrounding these candidates, including SFRP1,
  WIF1 and DKK2, induced by FGF19. e. Representative western blots showing that FGF19
  (200 ng/ml) increased the levels of SFRP1, WIF1, and DKK2 and decreased the level
  of β-catenin in chondrocytes in the presence of KLB (200 ng/ml). f. Quantitative
  analysis of the changes in the levels of SFRP1, WIF1, DKK2 and β-catenin shown in
  (e). g. Representative immunofluorescence images showing the reduced nuclear localisation
  of β-catenin in BMSCs induced by FGF19 with KLB. Cytoskeleton (F-actin), green;
  β-catenin, red; Nucleus (DAPI), blue. h. Quantification of the linear fluorescent
  protein β-catenin showing the intracellular distribution of β-catenin in the BMSCs
  in (g). The data in f and h are presented as the means ± SD. The significance analysis
  in f was based on two-tailed Student's t tests. All the results in e and g were
  obtained from three independent experiments (n = 3)
