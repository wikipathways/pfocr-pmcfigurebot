figure_title: Proposed mechanistic pathway illustrating the role of Vitamin E in modulating
  neuroinflammation, oxidative stress, and neurodegeneration.
caption: Proposed mechanistic pathway illustrating the role of Vitamin E in modulating
  neuroinflammation, oxidative stress, and neurodegeneration. Inflammatory stimuli
  initiate a cascade involving increased reactive oxygen species (ROS), elevated pro-inflammatory
  cytokines (e.g., TNF-α, IL-6, IL-1β), oxidative damage, and microglial activation.
  These processes contribute to neuronal damage, white matter loss, hippocampal atrophy,
  and ultimately cognitive impairment. Downstream consequences include protein misfolding,
  tau pathology, and amyloid plaque deposition, which collectively drive neurodegenerative
  diseases such as Alzheimer’s and Parkinson’s disease. Vitamin E acts at multiple
  levels of this pathway, reducing oxidative stress (↓ MDA, ↑ catalase and glutathione),
  inhibiting inflammatory signaling (↓ NF-κB activation), attenuating microglial activation,
  preserving brain volume and white matter integrity, and supporting cognitive performance
