figure_title: Molecular mechanisms of vitamin D on uterine fibroid cells.
caption: Molecular mechanisms of vitamin D on uterine fibroid cells. Vitamin D can
  reduce uterine fibroid size by over- or downregulating the expression of various
  molecules involved in fibroid pathogenesis, resulting in decreased cellular proliferation
  and fibrosis, induction of apoptosis and DNA damage reversal. γ-H2AFX, γ-H2A histone
  family member X; AKAP13, A-kinase anchor protein 13; Bcl-2, B-cell lymphoma 2; CDK,
  cyclin-dependent kinase; COMT, catechol-O-methyltransferase; ER-α, estrogen receptor-α;
  FEN1, flap endonuclease 1; MMP, matrix metalloproteinase; MRE11, meiotic recombination
  11; mTOR, mammalian target of rapamycin; NBS1, nibrin; PAI-1, plasminogen activator
  inhibitor-1; PCNA, proliferating cell nuclear antigen; PR, progesterone receptor;
  TGF-β3, transforming growth factor-β3; TIMP-2, tissue inhibitor of metalloproteinases-2;
  WISP-1, WNT1-inducible-signaling pathway protein 1. Created with BioRender.com
