figure_title: Proposed mechanism of Rubicon-mediated autophagy suppression and follicular
  growth impairment in aged mouse ovary.
caption: Proposed mechanism of Rubicon-mediated autophagy suppression and follicular
  growth impairment in aged mouse ovary. Environmental stressors, such as hypoxia,
  chronic inflammation, iron deposition, and endocrine-disrupting chemicals (EDCs),
  increase reactive oxygen species (ROS) in granulosa cells (GCs). In aged ovaries,
  the autophagy inhibitor, Rubicon, is upregulated; independently of the autophagy
  pathway, Rubicon binds the NADPH oxidase subunit p22phox in macrophages to further
  elevate ROS. Elevated ROS downregulates Sirtuin 1 (SIRT1) expression, thereby promoting
  Rubicon association with the class III PI3K complex (BECN1–hVps34–p150) and suppressing
  autophagy. Trehalose has been shown to decrease Rubicon expression and may therefore
  attenuate Rubicon-mediated autophagy inhibition. Concurrently, autophagy inhibition
  stabilizes ATP citrate lyase (ACLY), which is normally degraded by autophagy, leading
  to its pathological accumulation; ACLY buildup in GCs depletes follicular citrate,
  resulting in the impairment of oocyte maturation
