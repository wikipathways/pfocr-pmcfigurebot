figure_title: 'Key mechanisms involved in regulation of vascular tone: (A).'
caption: 'Key mechanisms involved in regulation of vascular tone: (A). Hydrogen sulfide
  (H2S) is produced endogenously by direct enzymatic desulfhydration of L-cysteine,
  catalyzed by cystathionine-γ-lyase (CSE). H2S can increase cyclic guanosine monophosphate
  (cGMP) levels by inhibiting phosphodiesterase A5 (PDE5), the enzyme that is involved
  in its catabolism. The activation of Nox (NADPH oxidase) generates hydrogen peroxide
  (H2O2), causing oxidative stress and stimulating the vasodilatatory-H2S-dependent
  pathway. Low concentrations of cGMP can inhibit phosphodiesterase A3 (PDE3), leading
  to increased cAMP through decreasing conversion into 5′-AMP, and enhanced barrier
  function, while higher concentrations of cGMP can activate phosphodiesterase A2
  (PDE2), which may increase permeability. (B). Prostacyclin (PGI2) is synthesized
  by cyclooxygenase-2 (Cox-2) from arachidonic acid (aa) and increases the second
  messenger cyclic adenosine monophosphate (cAMP) in smooth muscle cells. Its action
  is mediated through specific cell-surface, 7-membrane-spanning, G protein-coupled
  receptors (CGRP-Receptors) that activate adenylate cyclase (AC), which catalyzes
  the conversion of adenosine triphosphate (ATP) into cAMP. (C). EDHF (endothelium-derived
  hyperpolarization factor) causes hyperpolarization of the underlying vascular smooth
  muscle via a mechanism involving increased potassium (K+) conductance resulting
  in a reduction in intracellular K+ through ATP-ase pump involved in the exchange
  of potassium (2K+) and sodium (3Na+) ions with the subsequent repolarization of
  the cell and relaxation. (D). Nitric oxide (NO) is synthesized by nitric oxide synthase
  (eNOS) in endothelial cells (ECs) from L-arginine. NO diffuses across biological
  membranes and stimulates a soluble guanylyl cyclase (sGC), leading to an increase
  in intracellular cGMP within the adjacent smooth muscle cells (SMCs), thus resulting
  in their relaxation and consequent vasodilation. (E). Endothelin-1 (ET-1) generated
  by the endothelin-converting enzyme (ECE)-mediated cleavage of a larger precursor
  (big ET-1). Endothelin receptors Eta and ETb are expressed on vascular SMCs and
  mediate vasoconstriction. Gq, a type of G protein, plays a crucial role in initiating
  intracellular calcium release by activating phospholipase C, which hydrolyzes phosphatidylinositol
  4,5-bisphosphate (PIP2) into inositol 1,4,5-trisphosphate (IP3) that binds to IP3
  receptors on the endoplasmic reticulum, triggering the release of calcium (Ca2+)
  into the cytosol. ETb is also expressed on ECs where its activation results in vasodilation
  mediated by PGI2 and NO release. (F). All components of the RAS (the renin–angiotensin
  system), except for renin, are produced in the vasculature. Angiotensin-converting
  enzyme (ACE) converts angiotensin I (Ang I) to active angiotensin II (Ang II). The
  latter exerts its activities through binding to Ang II type 1 (AT1) or type 2 (AT2)
  receptors, causing vasoconstriction'
