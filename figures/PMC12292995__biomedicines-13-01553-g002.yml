figure_title: Hypothesized mechanistic network of Urolithin A.
caption: 'Hypothesized mechanistic network of Urolithin A. UA exerts biological activities
  including promotion of mitophagy, antioxidant stress, anti-inflammation, anti-senescence,
  and anti-apoptosis through mechanisms involving activation of PINK1/Parkin, BNIP3,
  AMPK, SIRT1, and SIRT3, as well as inhibition of PI3K/Akt and Keap1. Activation
  of PINK1/Parkin, BNIP3, and AMPK promotes mitophagy, while SIRT3/FOXO3 activation
  can indirectly regulate mitophagy through PINK1/Parkin pathway activation. Activated
  AMPK can inhibit MAPK and NF-κB pathway activity, thereby reducing inflammatory
  responses. SIRT1 activation and Keap1 inhibition suppress cellular oxidative stress
  through PGC-1α deacetylation and Nrf2/ARE pathway activation, respectively. Additionally,
  SIRT1 can directly inhibit the PI3K/Akt pathway, thereby suppressing NF-κB pathway
  activation. Mitophagy, oxidative stress, inflammation, cellular senescence, and
  apoptosis are closely interconnected. Mitophagy promotes clearance of dysfunctional
  mitochondria, reducing mtDNA release and ROS production, thereby diminishing cGAS/STING
  pathway and NF-κB pathway activation as well as oxidative stress. Furthermore, clearance
  of dysfunctional mitochondria and alleviation of oxidative stress can ameliorate
  cellular senescence. UA’s ameliorative effects on oxidative stress reduce the occurrence
  of apoptosis. UA can also promote autophagy by inhibiting PI3K/Akt/mTOR pathway
  activity, thereby reducing apoptosis. →: indicates activation; ┤: indicates suppression'
