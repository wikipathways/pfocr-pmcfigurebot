caption: Comparison of the conventional diagnostic pathway relying solely on histopathological
  examination with the ROSE-enhanced pathway. The steps within the light blue box
  occur during the endoscopic procedure, whereas those outside the box take place
  in the postprocedural period. ROSE enables intraoperative tissue assessment, reducing
  the need for repeated procedures when samples are inconclusive, which is often required
  in the conventional pathway. The figure highlights key points at which AI-powered
  solutions can further improve the modern diagnostic workflow following bronchoscopy
  or EBUS-derived tissue analysis. Created with BioRender.com
