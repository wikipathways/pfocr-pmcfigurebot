figure_title: Molecular mechanisms of T-cell-mediated rejection (TCMR) and antibody-mediated
  rejection (ABMR).
caption: Molecular mechanisms of T-cell-mediated rejection (TCMR) and antibody-mediated
  rejection (ABMR). TCMR involves migration of dendritic cells (DCs) to lymph nodes
  and spleens, where they activate T cells to initiate cellular immune responses against
  the graft. ABMR is primarily driven by donor-specific antibodies, leading to Fc
  receptor-mediated engagement and complement pathway activation, which collectively
  lead to graft endothelial injury. Created with BioRender.com
