figure_title: The mechanism of RP.
caption: The mechanism of RP. Ionizing radiation induces DNA damage through direct
  and indirect pathways, with the direct pathway causing DNA damage (e.g., SSB and
  DSB) that leads to vascular endothelial cell injury and alveolar epithelial cell
  injury, apoptosis, increased cytokine secretion, and EMT/ EndMT, ultimately resulting
  in increased vascular permeability, pulmonary edema, pulmonary fibrosis, epithelial
  barrier damage, and alveolar dysfunction, while the indirect pathway involves ionization
  of water molecules in irradiated cells to generate reactive oxygen species (ROS)
  that damage DNA, activate the NF-κB pathway to promote cytokine secretion and participate
  in the development of RP, and disrupt junction proteins to further increase vascular
  permeability, with these radiation-induced changes collectively driving the pathogenesis
  of RP and RIPF
