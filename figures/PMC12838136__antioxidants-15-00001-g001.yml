figure_title: Retinal Iron Overload in Diabetic Retinopathy.
caption: Retinal Iron Overload in Diabetic Retinopathy. Hyperglycemia initiates a
  vicious cycle in the retina involving iron overload and activation of the local
  renin-angiotensin system (RAS), ultimately leading to retinal damage. The pathological
  process begins with hyperglycemia, which directly induces heme breakdown, increasing
  free iron levels. Concurrently, high glucose stimulates initial expression of Angiotensin-II
  (Ang-II) in Müller cells. This initial surge of Ang-II upregulates key iron metabolism
  genes (e.g., tfrc, dmt1), further enhancing cellular iron import. The resulting
  retinal iron overload then activates the G-protein coupled receptor 91 (GPR91) signaling
  pathway in retinal pigment epithelial cells (RPECs), promoting renin expression.
  Increased renin activity catalyzes the RAS cascade, leading to a substantial secondary
  production of Ang-II within the retinal tissue. This newly generated Ang-II, in
  turn, exacerbates iron dysregulation, creating a self-amplifying local vicious cycle
  between Ang-II and iron overload that operates across Müller and RPECs, ultimately
  accelerating retinal injury
