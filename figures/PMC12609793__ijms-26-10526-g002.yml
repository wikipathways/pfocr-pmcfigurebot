figure_title: The synaptic changes at MSN in NAc during repeated and chronic opioid
  use and withdrawal.
caption: 'The synaptic changes at MSN in NAc during repeated and chronic opioid use
  and withdrawal. MSNs make synapses with DArgic neurons from the VTA. They also receive
  glutamatergic inputs from several brain regions, including the PFC, BLA, ventral
  Hipp, the paraventricular nuclei of the thalamus, and the VTA. GABAergic inputs
  reach the MSNs from local inhibitory interneurons and from the projecting VP neurons
  (for more details, see Figure 1). Several of these glutamatergic and GABAergic inputs
  are under the presynaptic control of MORs. MORs are expressed in VgluT2+ glutamatergic
  neurons, and these MORs are essential in the development of naloxone-precipitated
  withdrawal symptoms. During repeated opioid administration, the activity of presynaptic
  and postsynaptic NMDAR, as well as their coupling with calcium channels, increases
  in the MSNs. The concentration of extracellular glutamate could increase, especially
  during opioid withdrawal. The reason behind this could be that the activity of GLT1
  is decreased in astrocytes during OUD, and glutamate release is increased in OUD
  as well. In the NAc, GluN2B-containing NMDARs play a crucial role in the development
  of OUD. The elevated glutamate level increases the release of glycine via glycine
  heterotransporters located on the glutamatergic axon terminals. Glycine is capable
  of modulating GPR158, which is expressed on MSNs. As a recent finding, GPR158 is
  a metabotropic glycine receptor that activates PKA-ERK signalling in the presence
  of glycine. As a result of the activation of the GPR158/PKA/ERK pathway, the expression
  of Kv7.2 is downregulated. The downregulation of the Kv7.2 potassium channel and
  the increased activity of NMDARs contribute to the hyperexcitability of MSNs, which
  is observed during repeated opioid administration and withdrawal. During withdrawal,
  DA release decreases from VTA DArgic neurons due to the increased activity of GABAergic
  neurons projecting to the VTA DArgic neurons. In the NAc, the GABA release is increased
  in acute withdrawal. In accordance with this, it was shown that the excitability
  of MSNs decreased during acute opioid withdrawal, and hyperexcitability of MSNs
  could be detected during long-term opioid withdrawal. ↑: increase; ↓: decrease.
