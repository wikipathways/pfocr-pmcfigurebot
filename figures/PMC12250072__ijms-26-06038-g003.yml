figure_title: Quinazolinedione derivatives modulate apoptosis-related protein expression
  in MCF-7 cells.
caption: 'Quinazolinedione derivatives modulate apoptosis-related protein expression
  in MCF-7 cells. (A) Fulvestrant (5 µM), (B) compound 7 (50 µM), and (C) compound
  8 (50 µM) treatments regulate key apoptosis-related protein expressions in MCF-7
  cells compared to untreated controls. Prote in levels were measured using the MILLIPLEX®
  Early Apoptosis 7-Plex Magnetic Bead Kit and detected via the Luminex® system. p-JNK,
  p-Akt, p-Bad, p-Bcl-2, and p-p53 phosphorylation levels were assessed. Active caspase-8
  and active caspase-9 were analyzed to determine apoptotic pathway activation. Statistical
  significance: * p < 0.05 compared to untreated controls'
