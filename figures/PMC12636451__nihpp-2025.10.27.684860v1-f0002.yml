figure_title: Tau0N3R expression drives coordinated upregulation of glycolytic genes
  and proteins in Drosophila brains and neurons
caption: '(A) Schematic of glucose and trehalose metabolism pathways (left), and heatmap
  (right) showing log2 fold changes of genes encoding sugar transporters, glycolytic
  enzymes, lactate dehydrogenase (Ldh), pentose phosphate pathway (PPP) enzymes, and
  gluconeogenic enzymes in tau0N3R-expressing brains. Color scale: magenta (upregulated),
  green (downregulated), gray (not significant). Genes encoding sugar transporters
  and trehalase (Glut1, Tret1, Treh), all glycolytic enzymes and LDH show upregulation.
  Genes encoding rate-limiting enzymes of the oxidative arm of the PPP (Zw, Pgd) and
  gluconeogenesis (Pepck2, Fbp) are downregulated.(B) Quantitative RT-PCR validation
  of glycolytic gene expression in larval brains. Log2 expression levels relative
  to tubulin-GAL4/+ control mean are shown. Tubulin-GAL4/+ (buff), UAS-tau0N3R/+ (blue),
  and tubulin>tau0N3R (magenta). Values represent mean ± SEM from n ≥ 3 biological
  replicates. Statistical comparisons were pairwise t-tests with Bonferroni post hoc
  corrections. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001.(C) Representative
  pseudocolored confocal images of larval brains from control (left column) and tau0N3R-expressing
  animals (d42>tau0N3R, right column) carrying endogenous GFP knock-in reporters for
  LDH (LDH-GFP, top row) or GAPDH2 (GFP-GAPDH2, bottom row). Pseudocolor represents
  intensity of GFP fluorescence.(D) Quantification of GFP fluorescence intensity from
  endogenous reporters in larval brains. Left, LDH-GFP; right, GFP-GAPDH2. All values
  are normalized to control means. Each point represents one brain; bars show mean
  ± SEM. Statistical comparison by unpaired t-test. **P < 0.01, ***P < 0.001'
article_title: Neuronal glycolytic reprogramming drives lethality via accelerated
  aging in a Drosophila model of tauopathy
