figure_title: Roles of miRNA-128 in neuronal dynamics, controlling key neuronal processes.
caption: 'Roles of miRNA-128 in neuronal dynamics, controlling key neuronal processes.
  miR-128 plays a regulatory role across multiple functional domains in neuronal dynamics.
  This figure highlights eight key processes influenced by miR-128, arranged clockwise:
  cortical neuron migration, neurogenesis, synaptic plasticity, Wnt signaling pathway,
  neuronal death, unfolded protein response, apoptosis, and autophagy. miR-128 directly
  or indirectly modulates these processes, emphasizing its critical role in brain
  function and neuronal homeostasis'
