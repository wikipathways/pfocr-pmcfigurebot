figure_title: Overview of one-carbon metabolism.
caption: 'Overview of one-carbon metabolism. Abbreviations: 5-MTHF, 5-methyltetrahydrofolate;
  B12, cobalamin/methylcobalamin; B2, riboflavin; B6, pyridoxal phosphate (pyridoxine/pyridoxal/pyridoxamine);
  BAD, betaine aldehyde dehydrogenase; BHMT, betaine–homocysteine methyltransferase;
  CBS, cystationine-β synthase; CHD, choline dehydrogenase; CSE, cystathionine γ-lyase;
  DMG, dimethylglycine; UMFA, unmetabolized folic acid; MAT, methionine adenosyltransferase;
  MS, methionine synthase; MTHFR, methylenetetrahydrofolate reductase; MTRR, methionine
  synthase reductase; SAH, S-adenosylhomocysteine; SAHH, S-adenosylhomocysteine hydrolase;
  SAM, S-adenosylmethionine; SHMT, serine hydroxymethyltransferase; THF, tetrahydrofolate.
  Lines are color-coded to represent specific metabolic pathways: green for folate
  metabolism, blue for the choline metabolic pathway, red for the methionine cycle,
  and orange for the transsulfuration pathway. The alphabetical labels in the diagram
  correspond to the metabolic processes and enzymatic reactions discussed in main
  the text, A–D: The folate cycle, representing the metabolism of ingested folic acid
  (FA) to 5-methyltetrahydrofolate (5-MTHF), E–F: Remethylation of homocysteine to
  methionine by 5-MTHF (E) or betaine (F), G–I: The methionine cycle and S-adenosylmethionine
  (SAM)-dependent transmethylation reactions, J–L: The transsulfuration pathway, leading
  from homocysteine to the synthesis of cysteine and taurine. This metabolism diagram
  is reprinted from our previous article [14]'
