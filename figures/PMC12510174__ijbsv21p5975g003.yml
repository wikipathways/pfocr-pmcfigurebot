figure_title: Pri-MP exerts antitumor effects via activation of the p53 pathway in
  vitro.
caption: Pri-MP exerts antitumor effects via activation of the p53 pathway in vitro.
  (A) Dose-dependent growth inhibition of WERI-Rb1 and Y79 cells treated with Pri-MP
  or Pri-C, as determined by AlamarBlue assays (n=3). (B, C) Flow cytometric analysis
  reveals apoptosis induction in Pri-MP-treated WERI-Rb1/Y79 cells(B) and 661W (C)
  cells. Annexin V⁺/PI⁻ staining indicated early apoptotic cells, and Annexin V⁺/PI⁺
  staining denoted late apoptotic cells. (D, E) The cell cycle distribution of RB
  cells following Pri-MP/Pri-C treatment for 24h was analyzed through PI staining
  and flow cytometry. (F, G) Western blot analysis (F) and quantification (G) of HDMX,
  p53, p21 and PUMA protein expression levels in WERI-Rb1 and Y79 cells (n=3). *,
  p < 0.05, **, p < 0.01, ***, p < 0.001, ns, not significant
