figure_title: Mechanism of Action of cRGD/IGM-3 Alginate Hydrogel on MSCs
caption: A) Resazurin reduction quantification in MSCs cultured in serum-free medium
  across different hydrogel formulations (alginate, alginate + rhIGF-1 [500 ng/mL],
  cRGD-alginate, cRGD-alginate + rhIGF-1, and alginate modified with IGM peptides
  [IGM-1, IGM-2, IGM-3] each combined with cRGD) on Day 7, normalized to Day 1 values.
  B) Comparison of resazurin reduction in MSCs encapsulated in cRGD-alginate, or varied
  peptide density of cRGD and IGM-3 on Day 7, normalized to Day 1 values. C) Akt phosphorylation
  levels (pAkt / Total Akt) measured two hours post-cell attachment on cRGD-alginate
  supplemented with rhIGF-1 (500 ng/mL), indicating activation similar to cRGD/IGM-3
  alginate. D) IGF-1 receptor blocking of cRGD-alginate +rhIGF-1 or cRGD/IGM-3 demonstrates
  similar phosphorylation level. IGF-1 receptor small molecule inhibitor (AZ7550 Mesylate,
  20μM) attenuated Akt phosphorylation to a greater extend compared to antibody blocking
  of IGF-1 receptor. E-F) Effect of IGF-1 receptor inhibitor (AZ7550 Mesylate, 20μM)
  and IGF-1 & insulin receptor inhibitor (GSK1904529A, 3μM) on Akt activity in hydrogels
  containing rhIGF-1 or IGM-3, demonstrating receptor-specific binding of IGM-3. G)
  Impact of PI3K/Akt pathway inhibition (LY294002, 10μM) on Akt phosphorylation in
  hydrogels supplemented with rhIGF-1 and cRGD/IGM-3 after 2 hours. H) ERK activity
  modulation by the ERK 1/2 pathway inhibitor (U0126, 10μM) in MSCs cultured on cRGD/IGM-3
  alginate, showing pathway involvement in IGM3-mediated effects. Data points represent
  biological replicates with error bars indicating ±SD. Data normalized to cRGD-alginate
  +rhIGF-1 in C-H. Statistical analyses were performed using one-way ANOVA with Tukey’s
  multiple comparisons test; non-significant results are indicated by the same letter,
  while significant differences are marked with different letters at p < 0.05
