caption: Contact activation of FXII leads to its conversion to activated FXII (FXIIa),
  initiating the intrinsic coagulation pathway via conversion of factor XI (FXI) to
  factor XIa (FXIa), which in turn converts factor IX (FIX) to factor IXa (FIXa).
  FIXa activates downstream pathways in the common coagulation pathway and ultimately
  leads to fibrin clot formation (blue). FXII facilitates the conversion of plasma
  prekallikrein (PK) to kallikrein (PKa), leading to the release of bradykinin, which
  promotes inflammation and increases vascular permeability (purple). FXII also links
  to fibrinolysis by facilitating plasminogen activation to plasmin, resulting in
  fibrin degradation (green). Together, FXII functions as a molecular hub integrating
  coagulation, inflammatory signalling, and fibrinolysis
