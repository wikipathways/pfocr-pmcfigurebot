figure_title: Contact activation of FXII leads to its conversion to activated FXII
  (FXIIa), initiating the intrinsic coagulation pathway via conversion of factor XI
  (FXI) to factor XIa (FXIa), which in turn converts factor IX (FIX) to factor IXa
