figure_title: SPI1 promotes transcription of Ythdf2 in the context of IR
caption: '(A) Volcano plot of differential expressed genes from upregulated (red)
  and downregulated (blue) transcription pathways of tumor-infiltrating DCs (WT+IR
  versus WT+control). (B) Bar chart showing the MACS2 score of top-20 ranked transcription
  factors binding to Ythdf2. A higher MACS2 score indicating the higher capability
  of TF binding to Ythdf2. (C) Integrated volcano plot of MACS2 score and differential
  expressed TF genes, upregulated (red) and downregulated (blue), for Ythdf2 transcription
  in DCs. (WT+IR versus WT+control). (D) ChIP-qPCR results showing SPI1 binding to
  the promoter region of Ythdf2 (n = 3). (E) Ythdf2 mRNA expression in Spi1 KD DCs
  co-cultured with control or irradiated tumor cells (n = 3). (F) SPI1 protein level
  in tumor-infiltrating DCs at different days post IR (20 Gy). Statistical analysis
  was performed using two-sided unpaired Student’s t test (D-E); **P <0.01; ***P<0.001.
  Data are represented as mean ± SEM. Source data are available for this figure: SourceData
  Fig2'
