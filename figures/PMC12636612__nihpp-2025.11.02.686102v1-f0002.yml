figure_title: Bidirectional optogenetic manipulation reveals opposite and dissociable
  roles of direct and indirect pathways in counting and steering
caption: a-h) For inhibition, D1-cre (n = 6) and A2a-cre (n = 7) mice were injected
  with a Cre-dependent inhibitory opsin SIO.GtACR2. For excitation, D1-cre (n = 8)
  and A2a-cre (n = 8) mice were injected with a Cre dependent excitatory opsin DIO.ChR2.
  Controls received injections eYFP (n = 6). Unilateral inhibition (500ms, 3–5mW,
  continuous) or excitation (500ms train duration, 10ms pulse width, 20–30hz, 5–7mW)
  of the hemisphere ipsilateral to the port was triggered by the second press. a)
  Direct pathway inhibition caused ipsiversive steering towards the reward port. The
  percentage of 2nd presses that led to ipsiversive steering was increased by inhibition
  (Two-way ANOVA, significant interaction F (1,10) = 16.54, p = 0.002. Fisher’s LSD
  post hoc comparison revealed that inhibition of dSPNs led to more ipsiversive steering
  (p < 0.0007)). b) Indirect pathway inhibition caused contraversive steering towards
  the lever. The percentage of 2nd presses that led to contraversive steering was
  increased by inhibition (Two-way ANOVA, significant interaction F (1,11) = 9.96,
  p = 0.0118. Fisher’s LSD post hoc comparison revealed that inhibition of iSPNs led
  to more contraversive steering (p < 0.0006)). c) Direct pathway excitation led to
  contraversive steering towards the lever. The percentage of 2nd presses that led
  to contraversive steering was increased by excitation (Two-way ANOVA, significant
  interaction F (1,12) = 63.84, p = 0.0001. Fisher’s LSD post hoc comparison revealed
  that excitation of dSPNs led to more contraversive steering (p < 0.0001)). d) Indirect
  pathway excitation led to ipsiversive steering towards the port. The percentage
  of 2nd presses that led to ipsiversive steering was increased by excitation (Two-way
  ANOVA, significant interaction F (1,12) = 28.98, p = 0.0002. Fisher’s LSD post hoc
  comparison revealed that excitation of iSPNs led to more ipsiversive steering (p
  < 0.0001)). e) Direct pathway inhibition reduced the number of presses (Two-way
  ANOVA , significant interaction F (1,10) = 33.38, p = 0.0002. Fisher’s LSD post
  hoc comparison revealed that inhibition of dSPNs reduced pressing (p < 0.0001)).
  On the next trial after stimulation, the press count was reset and was no different
  than the press counts without stimulation (Paired t-test, p = 0.230). f) Indirect
  pathway inhibition increased press count (Two-way ANOVA, significant interaction
  F (1,11) = 13.20, p = 0.00039. Fisher’s LSD post hoc comparison revealed that inhibition
  of iSPNs led to more pressing (p < 0.0001)). On the next trial after stimulation,
  the press count was reset and was no different than control trials (Paired t-test,
  p = 0.73). g) Direct pathway excitation did not change the number of presses (Two-way
  ANOVA, asignificant main effect of virus F (1, 12) = 12.31, p = 0.004, no significant
  main effect of laser stimulation, F (1,12) = 0.008, p = 0.92 and no significant
  interaction F (1,12) = 2.8, p = 0.12). On the next trial after stimulation, the
  press count remained unchanged (p = 0.95). h) Indirect pathway excitation reduced
  the number of presses (Two-way ANOVA, significant interaction F (1, 12) = 29.97,
  p = 0.0001. Fisher’s LSD post hoc comparison revealed that excitation of iSPNs reduced
  press count (p < 0.0001)). On the next trial after stimulation, the press count
  was reset and was no different than control trials (Paired t-test, p = 0.8529).
  Bars represent the mean. ** p < 0.01, *** p < 0.001, **** p < 0.0001
