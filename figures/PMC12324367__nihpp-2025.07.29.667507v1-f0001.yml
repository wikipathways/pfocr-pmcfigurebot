figure_title: Nuclear protein levels change in early replicative aging
caption: (A) -Log fold change in protein expression for nuclei isolated from moderately
  aged (~6-7 buds) yeast (BY4743) relative to young (~0-2 buds) controls obtained
  using TMT-Mass spectrometry (n=5, -log10 p-values comparing change between old and
  young cells were calculated for each protein by ANOVA with corrections for multiple
  comparisons). (B) Hsp104-13xMyc protein expression in whole cell extracts from young
  and aged (~8-9 generations) MD188 cells (two-tailed student’s t-tests, p=0.2460
  and **p=0.0013, n=3). The loading control Vma2 does not significantly change during
  replicative aging (78). (C) GO term enrichment for age-depleted proteins using the
  molecular function (top) or biological pathway (bottom) models using G-profiler
  (34). (D) Significant GO term enrichment for upregulated proteins
