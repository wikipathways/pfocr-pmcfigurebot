figure_title: Integrative schematic linking key signaling pathways and intervention
  points of fibroblast-targeted NDDSs.
caption: Integrative schematic linking key signaling pathways and intervention points
  of fibroblast-targeted NDDSs. Representative NDDS platforms, including nanoparticles,
  hydrogels, liposomes, and nanofibers, enable targeted delivery to fibroblasts and
  promote the transition from quiescent to activated states. YAP-mediated mechanotransduction
  regulates fibroblast transcription via YAP–TEAD complex formation, while ROS-activated
  MAPK signaling controls p38 phosphorylation and HIF-1α-dependent balancing of LC3-II
  (microtubule-associated protein 1 light chain 3-II)-associated autophagy and Bax-mediated
  apoptosis, thereby determining fibroblast proliferation, survival, or cell death.
  In addition, NDDS-mediated immunomodulation promotes M2 macrophage polarization
  through TGF-β–associated Smad2/3 and PI3K/AKT signaling, indirectly supporting fibroblast
  activation and tissue repair. Created in BioRender. Huang, Q. (2026) https://BioRender.com/ghlfwlx
