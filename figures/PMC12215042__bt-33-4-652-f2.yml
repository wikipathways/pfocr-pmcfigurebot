figure_title: Influence of OZ-001 on activation of the caspase-dependent apoptotic
  pathway in MDA-MB-231 and MIA PaCa-2.
caption: 'Influence of OZ-001 on activation of the caspase-dependent apoptotic pathway
  in MDA-MB-231 and MIA PaCa-2. (A) Immunoblotting using antibodies against cleaved
  PARP-1, C-caspase-9, C-caspase-3, Bcl-2, BAX, and BAK in OZ-001–treated 0, 5, 10,
  20 μM MDA-MB-231 cells. Respective quantification of proteins is on the right. (B)
  Immunoblotting using antibodies against cleaved PARP-1, C-caspase-9, C-caspase-3,
  Bcl-2, BAX, and BAK in OZ-001–treated (0, 5, 10, 15 μM) MIA PaCa-2 cells. Respective
  quantification is on the right. (C) Viability of MDA-MB-231 cells co-treated with
  50 μM Z-VAD-FMK and 10 μM OZ-001 for up to 24 h (upper panel). Viability of MDA-MB-231
  cells co-treated with 50 μM Z-VAD-FMK and different doses of OZ-001 for 24 h (lower
  panel). Blue bars represent varied concentrations of OZ-001 treatments without Z-VAD-FMK
  (vehicle: DMSO), while the red bars represent varied concentrations of OZ-001 treatments
  with 50 µM Z-VAD-FMK pre-treatment for 1 h. (D) Viability of MIA PaCa-2 cells co-treated
  with 50 μM Z-VAD-FMK and different doses of OZ-001 for 24 h. Data represent the
  mean ± SD. Statistical differences were detected with a one-way ANOVA followed by
  Tukey’s post hoc test. *p<0.05; **p<0.01, ***p<0.001, ****p<0.0001 vs. untreated
  control group'
