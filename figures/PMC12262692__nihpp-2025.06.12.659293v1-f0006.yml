figure_title: Accumulation of IPP through the mevalonate pathway activates BTN3A1
  and coordinates Vγ9Vδ2 T-cell and NK-cell interferon gamma responses during Toxoplasma
  infection
caption: 1.Toxoplasma infection upregulates host-cell mevalonate-pathway enzymes,
  leading to the accumulation of host cell isopentenyl pyrophosphate (IPP) promoting
  activation of BTN3A1/2A1 dual receptor. 2. Vγ9Vδ2 T cells recognize IPP-activated
  BTN3A1/2A1 leading to their activation and secretion of IFNγ and TNFα. 3. IFNγ stimulates
  infected cells by binding to the IFNγ receptor leading to upregulation of multiple
  interferon-stimulated genes that encode anti-parasitic effectors. 4. IL-12 and IL-1β
  get secreted by infected cells 5. IL-12 and IL-1β synergize with TNFα from Vγ9Vδ2
  T cells to activate NK cells. 6. Activated NK cells secrete additional IFNγ thereby
  amplifying the anti-parasite response. Model was created in BioRender. Rodriguez,
  F. (2025) https://BioRender.com/8i8ocqt
article_title: The early human interferon gamma response to Toxoplasma gondii is driven
  by Vγ9Vδ2 T-cell sensing of host phosphoantigens and subsequent NK-cell activation
