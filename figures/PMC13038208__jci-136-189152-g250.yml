figure_title: FGFR1N546K renders Ba/F3 cells sensitive to pharmacological FGFR inhibition
caption: '(A) Relative cell viability of IL-3–dependent Ba/F3 cells (parental, empty
  vector, FGFR1 WT, FGFR1D623A, FGFR1D623A;N546K, FGFR1N546K) and 3 IL-3–independent
  FGFR1N546K-transduced Ba/F3 cell clones (blue) after treatment with various concentrations
  (conc.) of futibatinib (in μM: 0.0001, 0.001, 0.01, 0.0398, 0.0631, 0.1, 1, 10,
  and 100) and DMSO as control for 72 hours. Mean cell viabilities ± SD of 3 (FGFR1
  WT, FGFR1D623A, FGFR1D623A;N546K, FGFR1N546K) or 4 (parental, empty vector, FGFR1N546K
  IL-3–independent cells) independent experiments conducted in triplicate each are
  plotted. (B) IC50 of futibatinib in IL-3–dependent Ba/F3 cells and 3 IL-3–independent
  FGFR1N546K-transduced Ba/F3 cell clones, derived from 3 (FGFR1 WT, FGFR1D623A, FGFR1D623A;N546K,
  FGFR1N546K) or 4 (parental, empty vector, FGFR1N546K IL-3–independent cells) independent
  experiments consisting of triplicates each. P values were calculated in pair-wise
  comparisons to Ba/F3 parental cells using a 1-sided Wilcoxon rank-sum test and adjusted
  for multiple testing using the Benjamini–Hochberg method. (C) Levels of total and
  phosphorylated proteins of the FGFR pathway in IL-3–dependent Ba/F3 cells (parental,
  empty vector, FGFR1 WT, FGFR1D623A, FGFR1D623A;N546K, FGFR1N546K) and 3 IL-3–independent
  FGFR1N546K transduced Ba/F3 cell clones (blue) after treatment with DMSO or 10,
  50, or 100 nM futibatinib (experiment was conducted 3 times)'
