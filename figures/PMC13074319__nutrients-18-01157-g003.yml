figure_title: Mechanistic effects of OFIF-derived flavonoids and betalains in metabolic
  syndrome.
caption: 'Mechanistic effects of OFIF-derived flavonoids and betalains in metabolic
  syndrome. This schematic illustrates the principal molecular mechanisms associated
  with flavonoids (e.g., quercetin, kaempferol, isorhamnetin) and betalains (e.g.,
  betanin, indicaxanthin) derived from Opuntia ficus-indica fruits. These bioactive
  compounds modulate key components of the redox–inflammatory–metabolic network, including
  activation of NRF2-mediated antioxidant responses, attenuation of NF-κB and NLRP3-dependent
  inflammatory signaling, and regulation of insulin-related pathways such as IRS-PI3K-AKT
  and AMPK. Additional effects include modulation of lipid metabolism through SREBP-1c
  downregulation and PPAR-α activation, as well as potential interactions with gut
  barrier integrity and microbiota-related signaling. Shared downstream pathways are
  simplified to highlight compound-specific mechanisms. Most evidence derives from
  preclinical models, and the extent of translation to human metabolic syndrome remains
  to be established. Abbreviations: OFIF, Opuntia ficus-indica fruits; MetS, metabolic
  syndrome; NF-κB, nuclear factor kappa B; MAPKs, mitogen-activated protein kinases;
  NLRP3, NLR family pyrin domain containing 3; ROS, reactive oxygen species; NRF2,
  nuclear factor erythroid 2–related factor 2; AMPK, AMP-activated protein kinase;
  IRS, insulin receptor substrate; PI3K, phosphoinositide 3-kinase; AKT, protein kinase
  B; GLUT4, glucose transporter type 4; SREBP-1c, sterol regulatory element-binding
  protein 1c; PPAR-α, peroxisome proliferator-activated receptor alpha; LPS, lipopolysaccharide.
  Upward (↑) and downward (↓) arrows indicate upregulation and downregulation of the
  indicated processes, respec-tively. Color coding is used to distinguish functional
  domains: blue denotes flavonoids, red betalains and inflammatory pathways, green
  lipid metabolism, orange the gut–barrier axis, and light blue glucose homeostasis'
