figure_title: Dynamic, but not static, strain activates the Hippo pathway
caption: MSC were switched into 2% serum medium 24 h prior to application of 2% DS
  (200 cycles over 20 min) or SS (2% and hold tension). (A) Cells were stained at
  3 h with anti-YAP (red) and nucBlue (blue), and fluorescence intensity of nucleus/cytoplasm
  of YAP1 was analyzed by ImageJ program. Statistical significance indicated by ****,
  p < 0.0001. Scale bar = 25 μm. (B) Western blot for p-MST and p-YAP by densitometry,
  and four separate experiments quantified showing that DS increased and SS decreased
  phosphorylation of MST and YAP, while (n = 4; a vs b p < 0.005; a vs c p < 0.0001;
  b vs c p < 0.0005)
