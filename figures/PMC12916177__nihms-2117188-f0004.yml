figure_title: β-Glucan attenuates heme and bacteria-induced macrophage pyroptosis.
caption: 'β-Glucan attenuates heme and bacteria-induced macrophage pyroptosis. (A)
  Propidium Iodide (P.I.) staining of THP-1 cells treated with control, Heme (10 μM),
  heat-killed E. coli (MOI:10), Heme + E. coli, or β-glucan + Heme + E. coli for 24
  h (n = 6–9/group) Scale bars: 400 μm. (B) Quantitative analysis of cell death (PI/Hoechst
  33342) in THP-1 cells across the indicated groups (n = 6–9/group). (C) Cyquant analysis
  of THP-1 cells treated with control, Heme (10 μM), heat-killed E. coli (MOI:10),
  Heme + E. coli, or β-glucan + Heme + E. coli for 24 h (n = 5/group). (D) Propidium
  Iodide (PI) staining of BMDMs treated under the same conditions (n = 9/group) Scale
  bars: 400 μm. (E) Quantitative analysis of cell death (PI/Hoechst 33342) in BMDMs
  across the indicated groups (n = 9/group). (F) Cyquant analysis of BMDMs treated
  under the same conditions (n = 5/group). (G) Western blot analysis of pyroptosis
  cell death pathway in THP-1 cells treated with control, β-glucan, Heme + E. coli,
  or β-glucan + Heme + E. coli for 3 h. (H) Western blot analysis of pyroptosis cell
  death pathway in BMDMs cells treated under the same conditions. (I, J) Quantification
  of protein expression by band volume for NLRP3 and c-GSDMD in THP-1 cells (n = 4/group).
  (K, L) Quantification of protein expression by band volume for NLRP3 and c-GSDMD
  in BMDMs (n = 4/group). (M) Representative immunostaining of ASC (green) in BMDMs
  treat with control, heat-killed E. coli (MOI:10), Heme (10 μM) + E. coli, or β-glucan
  + Heme + E. coli for 3 h (n = 4–5). Scale Bars = 100 μm (N) Quantification of percent
  of BMDMs with ASC specks in the indicated groups (n = 4–5/group). Data are presented
  as mean ± SEM. Statistical significance: *p < 0.05, **p < 0.01, ***p < 0.001'
