caption: Model results for the competing reaction network after acute treatment with
  opioids. (A) Reaction network of the competing pathway. Protein complexes labeled
  in text and reactions represented by arrows. To keep the reaction network more concise
  S12, O10, and C3 have been omitted. (B) Simulation results of 5HT presented as concentrations
  (μM) over time (in hours). (C) Simulation results of 5HTR4:5HT are presented as
  percentages over time (in hours). (D) Simulation results of peak AC:αSGTP are presented
  as percentages over time (in days) for different drugs. Morphine is represented
  by a solid green line, Methadone by a blue dashed line, Fentanyl by a red dotted
  line and Endomorphin-2 by an orange dash–dot line. (E) Simulation results of OL
  are presented as concentrations (μM) over time (in days) for different drugs. Morphine
  is represented by a solid green line, Methadone by a blue dashed line, Fentanyl
  by a red dotted line, and Endomorphin-2 by an orange dash-dop are presented at line.
  (F) Simulation results for MOR:OL are presented as percentages over time (in days)
  for different drugs. Morphine is represented by a solid green line, Methadone by
  a blue dashed line, Fentanyl by a red dotted line, and Endomorphin-2 by an orange
  dash–dot line. (G) Simulation results for AC:αIGTP are presented as percentages
  over time (in days) for different drugs. Morphine is represented by a solid green
  line, Methadone by a blue dashed line, Fentanyl by a red dotted line, and Endomorphin-2
