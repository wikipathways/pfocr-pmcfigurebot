figure_title: The SYT4 and PSMC6 complex plays an oncogenic role in GC by regulating
  Wnt/β-catenin signaling.
caption: The SYT4 and PSMC6 complex plays an oncogenic role in GC by regulating Wnt/β-catenin
  signaling. A The upregulated expression of p-GSK3β/GSK3β and β-catenin was significantly
  downregulated by attenuation of PSMC6. B PSMC6 knockdown partially abrogated the
  SYT4-mediated activation of the Wnt/β-catenin pathway, as evidenced by a dual luciferase
  reporter assay. C The inhibitory effects on cell proliferation were reversed in
  SYT4-OE-siPSMC6 cells transfected with a constitutively active β-catenin mutant
  (S33Y). D and E The effects on cell cycle progression and apoptosis were rescued
  when β-cateninS33Y was overexpressed
