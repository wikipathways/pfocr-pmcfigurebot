figure_title: Silencing of ALOX15 mitigates acute coronary syndrome progression in
  vitro through the FGFR2/PI3K/AKT signaling pathway.
caption: Silencing of ALOX15 mitigates acute coronary syndrome progression in vitro
  through the FGFR2/PI3K/AKT signaling pathway. (A) The expression of FGFR2 in HCAECs
  after transfection with OE-FGFR2 or OE-NC was detected by RT-qPCR. (B) The mRNA
  expression of ALOX15 and FGFR2 in HCAECs following different treatments was detected
  by RT-qPCR. (C) The protein levels of FGFR2, PI3K, p-PI3K, AKT and p-AKT in HCAECs
  following various treatments were determined by western blotting. (D, E) The migration
  of HCAECs following different treatments was assessed by scratch wound healing assays.
  Scale bar, 100 µm. (F) The viability of HCAECs following various treatments was
  measured by Cell Counting Kit-8 assays. *P<0.05, **P<0.01 and ***P<0.001. ALOX15,
  12/15-lipoxygenase; FGFR2, fibroblast growth factor receptor 2; HCAECs, human primary
  coronary artery endothelial cells; OE, overexpression; NC, negative control; RT-qPCR,
  reverse transcription-quantitative PCR; siRNA, small interfering RNA; p-, phosphorylated;
  NS, not significant
