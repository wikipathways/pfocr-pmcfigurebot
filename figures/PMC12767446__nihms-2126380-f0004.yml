figure_title: miRNA signatures of human plasma CKD-EVs
caption: A, Schematic of study design. B, Principal component analysis (PCA) of miRNA
  sequencing data from hCtr/CKD EVs. C and D, Volcano plot and heatmap showing differentially
  expressed miRNAs in hCKD-EVs compared with hCtr-EVs (control, n=6; CKD, n=13). 16
  upregulated and 36 downregulated miRNAs in hCKD-EVs were identified. E, Analysis
  of significantly expressed miRNAs with high logFold change and high abundance in
  hCKD-EVs compared with hCtr-EVs. Among the 16 upregulated miRNAs in hCKD-EVs, three
  exhibited the highest log-Fold changes (miR-320a-3p, 4454, 2110) and seven (miR-22–5p,
  423–5p, 320b, 484, 193a-5p, 130b-3p and 378a-3p) showed the most abundant expression
  in hCKD-EVs. F, KEGG pathway analysis showing the top six most enriched pathways
  in highly expressed hCKD-EV-miRNAs. G, qPCR analysis of miRNA expressions in hCKD-EVs
  compared with hCtr-EVs (Ctr, n=15; CKD, n=20). Data in panel D are present as median
  with interquartile range and were analyzed with Mann-Whitney U test
