figure_title: Hypothetical neuronal mechanisms underlying inhibitory control of movements
caption: The interconnection between the PAG and AMY could play a key role in the
  inhibitory control of movements via dopamine neurons in the SNc and VTA. This pathway
  could enable dopamine neurons to integrate tonic signals from the PAG with phasic
  signals from the LHb. Furthermore, the PAG could be essential for integrating emotional
  information from the AMY and LHb, thereby orchestrating movement control through
  additional interactions with brain regions such as the forebrain, cerebellum, and
  other brainstem areas. This figure was created with BioRender.com
