figure_title: Somatic mutation landscape of PI3K pathway genes in colorectal cancer
  (CRC) stratified by age, ancestry, and FOLFOX treatment status.
caption: Somatic mutation landscape of PI3K pathway genes in colorectal cancer (CRC)
  stratified by age, ancestry, and FOLFOX treatment status. Oncoplots displaying gene-level
  mutation profiles of PI3K pathway components in colorectal cancer, stratified by
  age of onset (early vs. late) and ancestry (Hispanic/Latino vs. Non-Hispanic White).
  Panels show mutation types, tumor mutational burden (TMB), and FOLFOX treatment
  status across (a) Early-onset Hispanic/Latino (H/L) patients, (b) Late-onset H/L
  patients, (c) Early-onset Non-Hispanic White (NHW) patients, and (d) Late-onset
  NHW patients. Across all subgroups, PIK3CA is the most frequently mutated gene,
  with a predominance of missense variants, followed by alterations in PTEN, MTOR,
  and other pathway regulators such as TSC1/2, PIK3R1, and RICTOR. The data reveal
  pervasive disruption of PI3K-AKT-mTOR signaling in CRC, with variation in alteration
  frequency and spectrum by age and ancestry, and no distinct clustering associated
  with FOLFOX treatment
