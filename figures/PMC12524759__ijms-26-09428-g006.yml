figure_title: The expressions of several genes in tryptophan synthesis pathway were
  affected by OsPAT1 expression.
caption: The expressions of several genes in tryptophan synthesis pathway were affected
  by OsPAT1 expression. (a) Heat maps of the expressions of tryptophan synthesis pathway
  genes in RNA-seq analysis. AS, anthranilate synthase; PAT, phosphoribosylanthranilate
  transferase; PAI, N-(5′-phosphoribosyl)anthranilate isomerase; IGPS, indole-3-glycerolphosphate
  synthase; TSA, tryptophan synthase α subunit; TSB, tryptophan synthase β subunit.
  (b) Relative expression levels of tryptophan synthesis pathway genes in WT, lmm9,
  and transgenic plants. Data were shown as means ± SD of three replicates. (c–f)
  Relative contents of chorismate (c), anthranilate (d), tryptophan (e), and tryptamine
  (f) in WT, lmm9 and related transgenic plants. The significance compared with WT
  was determined by Student’s t-test at p < 0.05 (*) and p < 0.01 (**)
