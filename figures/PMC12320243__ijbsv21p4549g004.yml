figure_title: SLC7A11AR promotes SLC7A11 expression at the transcriptional level and
  inhibits ferroptosis.
caption: SLC7A11AR promotes SLC7A11 expression at the transcriptional level and inhibits
  ferroptosis. a Pathway enrichment analysis of the transcriptomic data upon SLC7A11AR
  knockdown in H1299 cells. b Morphological changes in cells after SLC7A11AR knockdown
  and treatment with ferroptosis inducers (erastin), ferroptosis inhibitors (Fer-1),
  autophagy inhibitors (3-MA), and apoptosis inhibitors (Z-VAD). Scale bar=25μm. c
  Transmission electron microscopy showing mitochondrial morphological changes after
  SLC7A11AR knockdown with or without erastin (10µM) treatment. Scale bar =2μm. d-g
  Flow cytometry detecting lipid peroxidation levels (d-e) and reactive oxygen species
  (ROS) levels (f-g) in H1299 cells after SLC7A11AR depletion, with (e) and (g) showing
  the statistical results. h-j Changes in glutathione (GSH) (h), ferrous ions (Fe²⁺)
  (i), and malondialdehyde (MDA) (j) levels in H1299 cells after SLC7A11AR knockdown,
  respectively. k-l Immunoblots (k) and Real-time RT-PCRs (l) to detect the protein
  and RNA expressions of the key factors involved in ferroptosis following SLC7A11AR
  knockdown in indicated cells. * P < 0.05, ** P < 0.01, *** P < 0.001
