figure_title: Regulation of glucose metabolism pathways and the insulin pathway by
  NAGylation.
caption: 'Regulation of glucose metabolism pathways and the insulin pathway by NAGylation.
  (A) Glucose-6P (G6P) fates: glycogen synthesis and pentose phosphate pathway (PPP);
  Fructose-6P (F6P) fates: glycolysis to pyruvate/lactate and hexosamine biosynthesis
  pathway (HBP), where UDP-GlcNAc is synthesized. The cycle between the N-acetylglucosamine
  transferase (OGT) enzyme that adds NAG (represented by an asterisk in a red circle)
  and the O-GlcNAcase (OGA) enzyme that removes NAG from proteins is shown below.
  Key regulatory enzymes in these pathways regulated by NAGylation are indicated:
  glycogen synthase (GS), glycogen synthase kinase 3 (GSK3), glucose -6-phospate dehydrogenase
  (G6PD), and phosphofructokinase 1 (PFK1). (B) Key proteins of the insulin signaling
  pathway that are regulated by NAGylation (represented by an asterisk in a red circle):
  insulin receptor substrate (IRS), phosphatidyl inositol 3 kinase (PI3K) and PIP3
  dependent kinase (PDK)'
