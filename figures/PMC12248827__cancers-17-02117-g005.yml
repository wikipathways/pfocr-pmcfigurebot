caption: Upregulated ligand–receptor interactions from S2C2, separated by ligand-expressing
  cell type. (A) (left) A chord diagram from ligand–receptor interaction network between
  tested cell types. (right) A chord diagram highlighting the interaction originating
  from myeloid-derived suppressor cells (MDSCs). Width of links are proportional to
  the number of ligand–receptor interactions identified. (B) Ligand–receptor interactions
  and downstream pathway expression originating from myeloid-derived suppressor cells
  (MDSCs). Only identified ligand–receptor interactions with significant enrichment
  of the downstream pathway are shown. (left) Ligand and receptor expression, annotated
  by receiver cell type. (right) Boxplot showing the expression of genes in pathways
  downstream of the ligand–receptor interaction in the receiver cell type, with outliers
  shown as circles. (C) Summary of the selected interactions between immune cell types
  and osteosarcoma
