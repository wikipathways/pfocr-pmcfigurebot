figure_title: Metabolic characteristics of G.
caption: Metabolic characteristics of G. lucidum cultivated under different CO2 conditions.
  (a) Statistical analysis of DAMs. (b) The heatmap of metabolic data. Each column
  and row represent a sample and a DAM, respectively. The color gradient indicates
  the normalized relative abundance, with red representing high abundance and blue
  representing low abundance. (c–e) KEGG enrichment analysis of the DAMs in J vs.
  M (c), K vs. N (d), and L vs. O (e). The x-axis represents the richness factor and
  the y-axis indicates the KEGG pathways. The size of the bubble represents the number
  of DAMs in the pathway, and the color corresponds to the p-value (redder colors
  indicate higher significance)
