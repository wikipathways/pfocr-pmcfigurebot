caption: Effects of inoculating P. putida on microbial functions. (A) KEGG pathway
  enrichment analysis in top 20 enriched pathways. Microbial gene functions were changed
  after inoculating P. putida. Blue, enriched in CK group; red, enriched in AP group.
  Asterisk denotes reporter score of pathways  >  1.65 or  <−1.65. * p value < 0.05.
  (B) KEGG name levels of these several enzymes during four periods of CK and AP groups.
  S-adenosylmethionine synthetase (2.5.1.6), 1-aminocyclopropane-1-carboxylate synthase
  (4.4.1.14), aminocyclopropanecarboxylate oxidase (1.14.17.4), and 1-aminocyclopropane-1-carboxylate
  deaminase (3.5.99.7) (C) Relative abundance map of species producing ACC deaminase.
  (D) Metabolic pathway of L-methionine resulted in ethylene and 2-Oxobutanoate. (E)
  Correlation between Pseudomonas and enzyme 3.5.99.7
