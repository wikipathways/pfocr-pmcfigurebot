figure_title: Changes in inflammatory genes and functions in MaR1-treated rats
caption: Heatmaps of top genes (−1>log2FC>1) related to inflammation in the heart
  (A) and kidney (B). (C) The network diagram highlights the predicted regulatory
  network and interactions involved in the differentiation of T lymphocyte subtypes,
  as determined by IPA analysis in the heart. Inhibitory interactions (blue arrows)
  and activating connections (green and yellow pathways). Below are the top enriched
  biological functions and pathways related to immune cell migration and infiltration,
  as determined by IPA analysis in the kidney. The colors indicate predicted downregulation
  (blue) and upregulation (orange). (D) Western blot analysis of NOTCH protein. Each
  line represents 1 rat. summary graphs showing the average relative density of the
  bands (normalized to loading controls) in the studied groups. Quantification of
  protein expression was performed by normalizing to the corresponding loading control.
  Data are shown as mean ± SEM
