figure_title: Pathway enrichment analysis using GSEA
caption: The input datasets for pathway enrichment analysis are the predictions of
  prostate cancer (CRPC), and breast cancer (MBC) cohorts, and the RNA-seq expressions
  from a panel f healthy controls. Significant enrichment was defined as NOM p-value
  ≤ 0.05, FWER p-val ≤ 0.05, and FDR q-value ≤ 0.05. (a) Pathways enriched in CRPC-Adeno
  compared to the other cohorts when using cfOncoXpress, where TCGA_ANDROGEN_RESPONSE
  (CRPC-AR) is significantly positively enriched. (b) Pathways enriched in CRPC-NE
  relative to the others when using cfOncoXpress, where BELTRAN_NEPC_UP (CRPC-NE)
  is significantly positively enriched. (c) Pathways enriched in the ER+/HER2− MBC
  cohort compared to the rest when using cfOncoXpress, where SMID_BREAST_CANCER_LUMINAL_A_UP
  is significantly positively enriched. (d) A comparable pathway enrichment analysis
  was performed using predictions from a model trained on controls and LuCaP PDX data;
  however, this analysis failed to detect significant enrichment in MBC as BELTRAN_NEPC_UP
  (CRPC-NE) is positively enriched here
