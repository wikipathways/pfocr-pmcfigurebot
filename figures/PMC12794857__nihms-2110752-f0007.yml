figure_title: Pharmacological blockade of all fast amino acid-mediated synaptic transmission
  did not prevent SLDs, although SLD duration and frequency were typically altered
  by the synaptic blockers
caption: A. Schematic diagram showing the time course of the experimental protocol.
  B. Effect of aCSF containing a mixture of the four receptor antagonists (AMPA/KA
  [DNQX, 50 μM], NMDA [AP-5, 50 μM], GABAA [bicuculline, 30 μM], and GABAB [SCH50911,
  10 μM]) on synaptic responses. B1. A typical evoked synaptic response (as described
  in Figure 3) in CA1 was observed in control aCSF. B2. After 15 min in the low [Ca2+]ex
  and high [K+]ex solution containing the mixture of four receptor antagonists, electrical
  stimulation of the Schaffer collateral pathway no longer evoked responses with PSPs
  and a population spike, thus indicating a complete blockade of synaptic transmission.
  The same stimulus intensity (300 μA) was used for the responses in B1 and B2. C.
  Spontaneous SLDs were still present after bath application of all four receptor
  antagonists blocked the evoked synaptic responses. C1. Bath application of the low
  [Ca2+]ex and high [K+]ex solution led to spontaneous SLDs in the CA1 area. C2. After
  addition of the mixture of the four glutamate- and GABA-receptor antagonists, repetitive
  SLDs still occurred, thus confirming that non-synaptic mechanisms were responsible
  for these prolonged SLDs (n = 56–70 SLDs, 6 slices, 6 rats). Traces below in C1
  and C2 show the expansion of the boxed parts. D-E. Quantification of duration and
  frequency of SLDs before and after addition of the GABAergic and glutamatergic blockers.
  Plots in D show SLD duration data from all SLDs (D1; n = 56–70 SLDs, 6 slices, 6
  rats; mixed effects model), animal averages (D2), and percent change (D3). A mixed-effects
  model was conducted to examine the effect of the pharmacological blockade of all
  fast amino acid-mediated synaptic transmission on seizures. The results revealed
  a significant main effect of Treatment, F (1,121.26) = 65.68, p < 0.001, indicating
  that both glutamatergic and GABAergic blockers had an effect on seizure duration.
  The plots in E show the frequency of SLDs (E1) and the percent change (E2) in SLD
  frequency. Note that the graph in D1 represents every SLD for all animals (56–70;
  6 slices, 6 rats). Also, each color and symbol in panels D and E represents data
  from a single individual animal included in the study. In panel D1, every data point
  corresponds to a single SLD event, with all events from the same animal plotted
  using that animal’s unique color and symbol combination. Panels D2, D3, E1, and
  E2 show averages or percent changes per animal, retaining the same color/symbol
  identifiers to link data across plots. Asterisks represent a significant difference,
  ***p < 0.001
