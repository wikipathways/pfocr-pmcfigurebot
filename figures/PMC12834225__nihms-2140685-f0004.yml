figure_title: Updated view of the yeast secretory and endocytic pathways.
caption: Updated view of the yeast secretory and endocytic pathways. Compared to Figure
  3, the symbols and abbreviations are the same but five concepts are different. (1)
  Transport from the Golgi to PVE compartments, and AP-3-dependent transport from
  the Golgi to the vacuole (not shown), begin about halfway through cisternal maturation,
  well before biosynthetic cargo proteins are sorted into secretory vesicles. (2)
  Endocytic vesicles fuse with maturing Golgi cisternae, which function as early endosomes.
  This fusion of endocytic vesicles occurs about halfway through cisternal maturation.
  Internalized protein cargoes then move rapidly from the Golgi to PVE compartments.
  (3) PVE compartments are long-lived organelles. They undergo transient kiss-and-run
  fusion events with the vacuole, delivering a portion of their contents each time.
  (4) AP-1 and Ent5 act at the late Golgi, where they mediate recycling of resident
  TGN transmembrane proteins. (5) Unlike Vps10, which cycles between the Golgi and
  PVE compartments, Kex2 and Ste13 recycle within the Golgi in the AP-1/Ent5 pathway
