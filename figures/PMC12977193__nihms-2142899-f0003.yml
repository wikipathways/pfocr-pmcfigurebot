figure_title: Evidence for widespread liver dysfunction in Down syndrome
caption: '(A) Bar plot summarizing Ingenuity Pathway Analysis of plasma SOMAscan proteomics
  from individuals with DS (n = 316) versus controls (n = 103). Dashed line indicates
  the significance threshold of p < 0.05.(B) Sina plots displaying the relative abundance
  of various plasma proteins in D21 versus T21.(C) Enrichment plots showing enrichment
  scores for gene set enrichment analysis signatures of fibrosis and steatosis in
  plasma proteomics of individuals with DS. NES, normalized enrichment score.(D) Sina
  plots displaying the relative abundance of plasma proteins in D21 and T21.(E) Sina
  plots showing the concentration of biomarkers of liver function in wild-type (n
  = 8–11, 3–6 females) and Dp16 (n = 9–11, 3–6 females) plasma.(F) Representative
  images of H&E-stained liver sections from wild-type and Dp16 mice. Arrows indicate
  the following features: red, enlarged periportal sinusoids; blue, bile duct; yellow,
  hepatic artery branches; green, periportal inflammatory cells. PV indicates portal
  vein, and CV indicates central vein. Scale bars, 100 μm.(G) Sina plots displaying
  metrics of liver pathology scoring from adult wild-type (n = 12, 6 females) and
  Dp16 (n = 11, 5 females) mice.For (B and D), boxes represent interquartile ranges
  and medians, with notches approximating 95% confidence intervals. Benjamini-Hochberg
  adjusted p values (q values) are indicated.For (E and G), individual data are presented
  with a bar at the median, and p values, as determined by Mann-Whitney U test, are
  shown'
