figure_title: Molecular and cellular mechanisms underlying age-related thymic involution
  and its impact on T-cell development.
caption: 'Molecular and cellular mechanisms underlying age-related thymic involution
  and its impact on T-cell development. In the young thymus, lymphoid progenitors
  from the bone marrow enter the thymic cortex and progress through distinct stages
  of thymocyte maturation: double-negative (DN1–DN4), double-positive (DP), and ultimately
  into mature CD4+ and CD8+ T cells in the medulla. Protective factors, such as transcription
  factors (Foxn1, E2F3, myc), miR-181a-5p, growth factors (FGF21, IGF-1, KGF), cytokines
  (IL-7, IL-22), and hormones like leptin, growth hormone, and ghrelin, along with
  Wnt4 signaling and Lamin-B1, maintain thymic structure and function. In contrast,
  age-related thymic involution is driven by promoting factors such as sex hormones,
  obesity, miR-125a-5p, miR-205-5p, inflammatory cytokines (IL-6, SCF, IL-1β, LIF),
  Wnt signaling component Axin, and other molecules, including OSM and Follistatin.
  Thymic involution results in reduced naïve T-cell output, the expansion of memory/senescent
  T cells, impaired central tolerance, weakened vaccine responses, delayed T-cell
  recovery post-insult, altered T-cell phenotypes, and increased susceptibility to
  infection and cancer. (DN: double-negative thymocyte (CD4−CD8−); DP: double-positive
  thymocyte (CD4+CD8+); CD: cluster of differentiation; FGF21: fibroblast growth factor
  21; IGF-1: insulin-like growth factor 1; KGF: keratinocyte growth factor; IL: interleukin;
  SCF: stem cell factor; LIF: leukemia inhibitory factor; OSM: oncostatin M; Foxn1:
  forkhead box N1; E2F3: E2F transcription factor 3; myc: proto-oncogene c-Myc; GHSR:
  ghrelin receptor; Wnt: wingless/integrated signaling pathway)'
