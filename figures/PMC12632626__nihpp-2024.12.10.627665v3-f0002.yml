figure_title: ProCyon accurately retrieves proteins from flexible phenotypes
caption: a) In protein retrieval, ProCyon receives a phenotype as input and outputs
  a ranked list of proteins, domains, peptides, or polypeptides. b) Benchmarking ProCyon’s
  retrieval capabilities against other approaches across distinct knowledge domains.
  x axes show Fmax, the maximum F1 score across any cutoff. Error bars show bootstrapped
  95% confidence intervals. One retrieval task corresponds to retrieving proteins
  for one phenotype. c) ProCyon’s retrieval performance across splits of ProCyon-Instruct.
  d) Illustration of pleiotropic protein functions. The FOXC1 protein is implicated
  in heart development, regulation of HPSC differentiation, and regulation of the
  mitotic cell cycle. e) Percentiles of potentially pleiotropic proteins ranked by
  ProCyon using composite prompts composed of two, three, and four pathways, in comparison
  with aggregated individual ranks. Also compared with ProtST. All comparisons have
  p-value < 0.001; two-sided Wilcoxon signed-rank test. f) External validation of
  disease-associated protein retrieval across different lines of evidence for association.
  y axis shows median retrieval percentile scores for each disease across different
  lines of evidence. g) Protein retrieval with different disease descriptions. Left,
  example texts for prompts with gradually increasing information (Disease, Diagnostics,
  Associated Features supporting Diagnosis and their combinations) for Autistic Spectrum
  Disorder. Right, median retrieval percentile scores derived for each disease with
  increasingly informative prompts. h) Left, retrieval percentile of STING as more
  precise prompts are provided as input. Right, UMAP of unified latent space of phenotypes
  and proteins, highlighting prompt embeddings and STING protein embedding. Dashed
  contours indicate distance from STING protein embedding; thicker lines denote closer
  distance. * p-value < 0.05, ** p-value < 0.005; two-sided Mann-Whitney U test
