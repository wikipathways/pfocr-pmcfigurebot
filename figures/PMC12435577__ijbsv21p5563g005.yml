figure_title: METTL3 promotes hepatocyte pyroptosis in acute liver injury by regulating
  DLGAP5.
caption: 'METTL3 promotes hepatocyte pyroptosis in acute liver injury by regulating
  DLGAP5. (A, B) Protein levels of METTL3, DLGAP5 and NLRP3 in liver tissues and primary
  hepatocytes from mice treated with or without CCl4 (n = 3 per group). (C) Co-IF
  staining of METTL3 and DLGAP5, DLGAP5 and NLRP3 in liver sections with CCl4 treatment
  (Scale bar: 50μm). (D) Molecular docking of the DLGAP5 protein to the METTL3 and
  NLRP3 protein. (E) Correlation analysis of mRNA levels between Dlgap5 and Mettl3,
  Dlgap5 and Nlrp3 in acute liver injury. (F) Interaction of DLGAP5 with METTL3 or
  NLRP3 was evaluated by Co-IP in primary hepatocytes and AML12 cells. (G) Protein
  levels of METTL3, DLGAP5, NLRP3, GSDMD-N and Cleaved CASPASE1 in primary hepatocytes
  transfected with si-Mettl3, si-Dlgap5 or si-Nlrp3 are determined. (H) PROGENy function
  profiling of NF-κB pathway in CCl4 group compared to control group. (I) GSEA enrichment
  plot and heatmap showing the enrichment of NF-κB pathway in CCl4 group compared
  to control group. (J) Correlation analysis of the expression of Dlgap5 and NF-κB
  pathway in ALI. (K) Protein levels of NLRP3, ASC, Cleaved CASPASE1, GSDMD-N, mature
  IL-1β and mature IL-18 from indicated groups (n = 3 per group). (L) The relationship
  among the NLRP3, ASC and pro-CASPASE1 protein domains during the structural assembly
  process of NLRP3 inflammasome. (M) Interaction of NLRP3-PYD with ASC-PYD or ASC-CARD
  with Caspase1-CARD was evaluated by Co-IP in Dlgap5-overexpressed primary hepatocytes
  and control primary hepatocytes. All results are shown as mean ± SEM. *p < 0.05,
  #p < 0.05'
