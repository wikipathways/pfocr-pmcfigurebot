caption: Changes in gene expression associated with (a) major cell death pathways,
  (b) immune response, and (c) stress response following photodynamic treatment with
  free phthalocyanine (Pc) and Pc encapsulated in albumin nanoparticles (Pc/ANP) were
  assessed after a 12 h treatment at a fluence of 0.7 J/cm2 irradiation. Measurements
  were taken without irradiation (0) and at 3, 6, 12, and 24 h post-irradiation. Each
  experiment included three biological and three technical replicates. Data are presented
  as mean ± standard deviation (SD)
