figure_title: Identification of the acetylation site of BDH1 protein in dairy goats
  and its effect on protein stability.
caption: Identification of the acetylation site of BDH1 protein in dairy goats and
  its effect on protein stability. (A) Flag-BDH1 was immunoprecipitated from HEK293T
  cells treated with HDAC inhibitor, and 40 kDa bands were separated and cut by SDS-PAGE
  for in-gel trypsin digestion, and the presence of acetylation modification at the
  K91, K116 and K122 sites was confirmed by LC-MS/MS analysis. (B) After transfecting
  HEK293T cells with the constructed mutant vectors of K91, K116 and K122 Q/R and
  wild type respectively, WB assay revealed that the mutation of K116 caused protein
  degradation of the structure of BDH1 protein. (C) The K116Q/R mutant was transfected
  into HEK293T cells and treated with the proteasome inhibitor MG132 (50nM, 6h), and
  the WB assay showed that the protein degradation was effectively reversed, demonstrating
  that the degradation pathway was proteasome-dependent. (D) After transfecting HEK293T
  cells with the constructed mutant vectors of Q/R at K91, K116 and K122 sites and
  the wild type respectively, and comparing the protein levels of all the mutants
  before and after treatment with MG132, the WB analysis confirmed that only the acetylation
  status of the K116 site (Q/R) directly regulated the stability of BDH1 through the
  proteasome pathway, and the K91/K122 mutation had no significant effect
