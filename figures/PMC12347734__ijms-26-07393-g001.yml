figure_title: Hyperglycemia-driven pathways contributing to DSPN.
caption: Hyperglycemia-driven pathways contributing to DSPN. Under hyperglycemic conditions,
  excess glucose passively enters cells through glucose transporters and is shunted
  into multiple metabolic pathways. Glucose is converted into sorbitol and fructose
  via the polyol pathway, generating reactive oxygen species (ROS) and redox imbalance.
  Increased glucose also promotes the formation of advanced glycation end-products
  (AGEs), activating their receptor and stimulating NADPH oxidase, NF-κB, and pro-inflammatory
  cytokines. The hexosamine pathway modifies transcription factors (e.g., Sp1), altering
  gene expression of factors such as TNF-β. Elevated diacylglycerol (DAG) activates
  protein kinase C (PKC), influencing cellular responses. Collectively, these intertwined
  mechanisms lead to oxidative stress, inflammation, and disrupted cellular function.
  Reprinted/Adapted from ref. [34]
