figure_title: Cardiomyocyte metabolic genetic programming was altered by PAB but partially
  rescued with SC144 treatment
caption: (A) UMAP displaying 8 subgroups of cardiomyocytes (CM). (B) Percent of CM
  nuclei from each pig across subgroups. Medians shown, values displayed below graph.
  (C) UMAP visualizing changes in cardiomyocyte subclusters between experimental groups.
  (D) Correlation analysis of relative abundance of cardiomyocyte subclusters and
  ejection fraction (EF). CM3 was negatively correlated to EF and CM2 was positively
  correlated to EF. Pathway analysis of DEGs (E) increased and (F) decreased in PAB-Veh
  nuclei compared to control. Pathways of DEGs (G) elevated and (H) decreased in PAB-SC144
  compared to control. Metabolic pathways were altered by PAB and treatment with SC144,
  and downstream GP130 signaling was reduced in PAB-SC144 compared to control. (I)
  Pathway analysis of DEGs upregulated in PAB-SC144 compared to PAB-Veh. There were
  no enriched pathways comparing DEGs downregulated in PAB-SC144 and PAB-Veh
