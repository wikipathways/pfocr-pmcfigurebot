figure_title: Effect of gefitinib on H358-Scr and H358-BRG1-KO cells and its influence
  on the EGFR signaling pathway both in vitro and in vivo.
caption: Effect of gefitinib on H358-Scr and H358-BRG1-KO cells and its influence
  on the EGFR signaling pathway both in vitro and in vivo. (A) The effect of gefitinib
  treatment on cell viability and signaling pathways in H358-Scr and H358-BRG1-KO
  cells. Cells treated with varying concentrations of gefitinib (0.5–20 µM GEF) were
  assessed for cell viability, morphological changes, and expression levels of selected
  markers by Western blot analysis. DMSO-treated cells served as controls. Cell viability
  is depicted in a bar graph for 24 and 48 h post-treatment. Representative images
  of crystal violet-stained cells are shown at 20X magnification; Scale bar, 100 µm.
  α-Tubulin was used as a loading control for Western blotting. (B) H358-Scr and H358-BRG1-KO
  cells were treated with either DMSO or gefitinib (2 µM and 20 µM GEF) and the average
  number of migrated (upper panel) and invaded (lower panel) cells was determined
  at 24 and 48 h after treatment. Representative images of migrated and invaded cells
  are shown at 10X magnification; Scale bar, 100 µm. (C) Western blot analysis of
  selected markers at 24 h following PMX-BRG1 and gefitinib combination treatment
  of H358-BRG1-KO cells in vitro. DMSO, PMX-empty, and a combination of PMX-empty
  and gefitinib-treated cells were used as controls. NCI-H358 cells were utilized
  for comparison to BRG1-KO cells. α-Tubulin was used as loading control. Representative
  field pictures of crystal violet-stained cells are shown at 20X magnification; Scale
  bar, 100 µm. Cell viability is shown in the bar graph for 24 h and 48 h post-PMX-BRG1
  + GEF treatment. (D) Tumor growth curve in nude mice bearing contralateral H358-Scr
  tumor xenografts treated with either DMSO (vehicle) or gefitinib (100 mg/kg). Representative
  images of mice bearing H358-Scr tumors from the vehicle or gefitinib treatment are
  displayed. All original Western blot images are provided in the Supplementary Figure
  S6. Error bars denote SD; NS = not significant; * p < 0.05; ** p < 0.01
