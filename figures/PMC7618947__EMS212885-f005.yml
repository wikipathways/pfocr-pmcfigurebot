figure_title: Multiple myeloma-engrafted comBOs capture hallmarks of complex disease
  pathology
caption: (A) Gene set enrichment analysis using hallmark gene sets and comparing myeloma-engrafted
  MM-comBO with control organoids reveals an extensive dysregulation, most evident
  in MSC, osteolineage cells, and lymphoid progenitors in MM-comBOs.(B) Representative
  GSEA plots highlight inflammatory response, fatty acid metabolism, and unfolded
  protein response genes as some of the major upregulated pathways in key clusters.(C)
  Volcano plots identifying key genes involved in inflammation, osteo/adipo-lineage
  fate, and fatty acid metabolism in key myeloma-associated cell types. (D and E)
  Heatmap of DEGs in specific pathways highlighted by GSEA in (D) hematopoietic and
  (E) stromal cells.(F) (i) Confocal imaging of BODIPY- and CD271-stained control
  and MM-comBOs demonstrates an increase in BODIPY+ cells (scale bar, 100 μm) and
  (ii) H&E staining of un-engrafted and MM-comBO confirmed a significant increase
  in adipocyte number (scale bar, 20 μm). Quantification across three donors vs. control
  confirmed a significant increase in (iii) BODIPY mean fluorescence intensity (MFI)
  (p = 0.0254) and in (iv) adipocyte number (p < 0.0001). Error bars represent standard
  deviation.(G) CellChat analysis identifies a dysregulation of cell-cell interactions
  across key clusters, identifying upregulated interactions in MM-comBO.(H) Analysis
  of net outgoing and ingoing signals reveals a substantial change in outgoing cell
  signals in MM-comBO, consistent with a remodeling of the organoid because of engraftment
