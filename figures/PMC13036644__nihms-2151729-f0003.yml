figure_title: Stimulus contrast increases accommodative pupil constriction
caption: '(A) Left: accommodative pupil constriction in an example emmetrope (AP,
  in black) measured with the fixating eye at different contrasts of light stimuli
  driving ON pathways (in red) and dark stimuli driving OFF pathways (in blue). To
  facilitate comparison, the baseline for light stimuli adjusted to match dark stimuli.
  Right: contrast-response functions (C50, contrast at half maximum; n, exponent).(B)
  From left to right, normalized contrast-response function for emmetrope average,
  increase in accommodative pupil constriction with contrast, and stronger accommodative
  pupil constriction for dark than light stimuli at 3%–6% contrast.(C) Same as (A)
  for a myope (MF in green, spherical equivalent: −6.25 D).(D) Same as (B) for myopes.
  All error bars are standard errors. Same format as Figure 2'
article_title: Human accommodative visuomotor function is driven by contrast through
  ON and OFF pathways and is enhanced in myopia
