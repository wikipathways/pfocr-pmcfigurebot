figure_title: RNA expression profiles of TECs isolated 48 h after IR from MC38 murine
  colon carcinomas receiving local IR to the tumors while the mice were restrained
  in (a) a lead shield and only the tumors were exposed to the IR.
caption: RNA expression profiles of TECs isolated 48 h after IR from MC38 murine colon
  carcinomas receiving local IR to the tumors while the mice were restrained in (a)
  a lead shield and only the tumors were exposed to the IR. Significantly enriched
  pathways in irradiated compared with non-irradiated control samples. (b) IR-induced
  significantly up-regulated genes related to changes in ECM and immune response.
  Genes with adjusted p-values of <0.05 and a log2FC of >0.5 were considered as significantly
  up-regulated. (c) Significantly differentially expressed genes involved in the cytosolic
  DNA-sensing pathway (red—up-regulation, blue—down-regulation). n = 5 per group.
  TECs—tumor endothelial cells. FC—fold change. ECM—extracellular matrix. IR—irradiation.
  See also Supplementary Figure S5 and Table S9
