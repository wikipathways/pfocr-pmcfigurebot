figure_title: Disease-specific pathological cascades driven by mitochondrial ion channel
  and transporter dysfunction.
caption: 'Disease-specific pathological cascades driven by mitochondrial ion channel
  and transporter dysfunction. (A) Heart failure: High sodium/pressure stress induces
  upregulation of TRPC6 channels. This drives pathological Ca2+ influx into cardiomyocytes,
  leading to mPTP opening. mPTP opening collapses ΔΨm, reduces ATP production, and
  ultimately triggers cardiomyocyte apoptosis. (B) Ischemic heart disease: I/R injury
  causes hyperactivity of TRPC3 and TRPC6 channels. This results in excessive Ca2+
  influx, inducing MCU hyperactivity. MCU overload elevates miROS production, culminating
  in myocardial necrosis. (C) Cardiomyopathies: Hyperglycemia upregulates TRPM7 channels.
  Increased Ca2+ influx through TRPM7 activates CaMKII signaling. This pathway stimulates
  TGF-β1 expression, promoting excessive collagen deposition and resulting in myocardial
  fibrosis. (D) Atherosclerosis: Uptake of oxLDL by cells triggers oligomerization
  of VDAC1 in the mitochondrial outer membrane. VDAC1 oligomerization facilitates
  mtDNA release into the cytosol. Cytosolic mtDNA activates the cGAS-STING pathway,
  provoking a robust inflammatory response (“inflammatory storm”) that contributes
  to atherosclerotic plaque instability. (E) Coronary heart disease: Metabolic stress
  induces two major mitochondrial defects: (1) Downregulation of VDAC3 impairs mitochondrial
  GSH transport, weakening the organelle’s antioxidant defense system. (2) Downregulation
  of MICU1 leads to dysregulation of the MCU complex, causing pathological Ca2+ imbalance
  within the mitochondria. This Ca2+ dysregulation disrupts ATP synthesis and contributes
  to myocardial ischemia. (F) Myocardial infarction: Acute myocardial infarction causes
  severe ischemia, leading to a collapse of ΔΨm and consequent mPTP opening. mPTP
  opening permits the release of cytochrome c from mitochondria into the cytosol,
  activating pathways of apoptosis and necrosis. Dysfunction of NCLX further exacerbates
  mitochondrial Ca2+ overload, amplifying cell death. ATP, Adenosine triphosphate;
  Ca2+, Calcium ion; CaMKII, Calcium/calmodulin-dependent kinase II; cGAS-STING, cyclic
  GMP-AMP synthase-stimulator of interferon genes; I/R, Ischemia–reperfusion; MCU,
  Mitochondrial calcium uniporter; MICU1, Mitochondrial calcium uptake 1; miROS, Mitochondrial
  reactive oxygen species; mPTP, Mitochondrial permeability transition pore; mtDNA,
  Mitochondrial DNA; NCLX, Mitochondrial Na+/Ca2+ exchanger; oxLDL, Oxidized low-density
  lipoprotein; TGF-β1, Transforming growth factor-beta 1; TRPC, Transient receptor
  potential canonical; TRPM, Transient receptor potential melastatin; VDAC, Voltage-dependent
  anion channel; ΔΨm, Mitochondrial membrane potential'
