caption: Overview of Lp. pentosus-specific pathways. (A) Malonate decarboxylase system,
  which catalyzes the decarboxylation of malonate to acetate, playing a role in energy
  metabolism; (B) leucine biosynthesis pathway, essential for the synthesis of the
  branched-chain amino acid leucine; and (C) the oxoprolinase system, involved in
  the metabolism of 5-oxoproline, contributing to amino acid turnover and glutathione
  metabolism. Blue arrows indicate the direction of metabolic flow
