figure_title: Differential gene expression and pathway enrichment analysis in the
  amygdala of prenatally fentanyl-exposed rats.
caption: Differential gene expression and pathway enrichment analysis in the amygdala
  of prenatally fentanyl-exposed rats. (A) Volcano plot showing differentially expressed
  genes (DEGs) in the central nucleus of the amygdala (CeA) of adult rats exposed
  to fentanyl in utero compared to vehicle controls. Genes significantly regulated
  (FDR < 0.1) are highlighted in red, while non-significant genes (NS, FDR ≥ 0.1)
  are shown in green. (B) Gene set enrichment analysis (GSEA) highlighting significantly
  enriched pathways (FDR < 0.1). The normalized enrichment score (NES) is plotted,
  with positive values indicating upregulation and negative values indicating downregulation
