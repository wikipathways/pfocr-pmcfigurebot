figure_title: Inflammatory stimuli can induce the JAK/STAT and SMAD signaling pathways.
caption: Inflammatory stimuli can induce the JAK/STAT and SMAD signaling pathways.
  (A) Inflammatory cytokines, such as IL-6 and IL-22, induce hepcidin synthesis via
  the JAK/STAT3 pathway. Interleukins attach to the gp130 protein receptor complex.
  This induces the phosphorylation of the transcription factor STAT3. JAK1/2 tyrosine
  kinase plays a crucial role in this process. (B) Another inflammatory pathway may
  be activated by the activin B. It can also induce synthesis through the SMAD pathway.
  This interaction induces the phosphorylation of SMADs, which are activated by receptors.
  The phosphorylated SMAD1/5/8 complex subsequently binds to SMAD4 and translocates
  to the nucleus, where it regulates HAMP transcription
