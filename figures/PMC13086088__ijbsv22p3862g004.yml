figure_title: Detailed characterization of endothelial cells (ECs) and angiogenesis
  features during LSCC progression.
caption: Detailed characterization of endothelial cells (ECs) and angiogenesis features
  during LSCC progression. A UMAP plot of ECs within each subset. B Dot plots showing
  the expression of canonical marker genes across each EC subset. C Bar plots showing
  the frequency (left) and proportion (right) of each EC subset in different tissues.
  D Heatmap displaying GSVA-based activity scores of Hallmark pathways across different
  EC subsets. E Comparison of interaction strength between different cell types and
  ECs in LSCC. F Heatmap representing the number of predicted ligand-receptor pairs
  between each fibroblast and EC subset in LSCC. G Heatmaps showing the regulatory
  patterns between POSTN+ fibroblasts and venous ECs based on NicheNet analysis. H
  Enriched GO and KEGG pathways among the NicheNet-predicted target genes in venous
  ECs. I Representative images showing the angiogenic capacity of HUVECs following
  4 h culture in different CM (n = 3 per group). Scale bar = 200 μm. *p < 0.05; **p
  < 0.01; ***p < 0.001
