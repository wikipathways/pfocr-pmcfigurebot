  to untreated control.
caption: Network and enrichment analysis of signaling pathway-related genes overexpressed
  during injury-induced inflammation in zebrafish larvae treated with TnP compared
  to untreated control. (A) Protein-protein interaction (PPI) networks of 66 differentially
  overexpressed genes (padj < 0.05). The PPI network was performed in STRING on Cytoscape,
  and each subnetwork was evaluated in the software to provide the main functional
  enrichment term through STRING. The bigger the circle, the lower the adjusted p-value.
  Singletons were omitted from the network. (B) Functional enrichment analysis focusing
  on the overexpressed genes list (62 DAVID IDs) related to signaling pathways using
  the DAVID software. Terms were considered significant if the adjusted p-value was
  less than 0.05 and the gene count at least 3
