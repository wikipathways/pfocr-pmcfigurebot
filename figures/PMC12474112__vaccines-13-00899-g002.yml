figure_title: Overview of Antigen Presentation and T-cell Activation Pathway in Cancer
  Vaccination.
caption: Overview of Antigen Presentation and T-cell Activation Pathway in Cancer
  Vaccination. This figure illustrates the key steps involved in the immune response
  triggered by mRNA or DNA-based cancer vaccines. After administration, the nucleic
  acid vaccine is taken up by antigen-presenting cells (APCs), such as dendritic cells,
  which translate the genetic material into tumor-associated antigens. These antigens
  are processed into peptides and loaded onto major histocompatibility complex (MHC)
  class I and II molecules. Peptide–MHC complexes are then presented on the surface
  of APCs to prime and activate CD8+ cytotoxic T lymphocytes (via MHC I) and CD4+
  helper T cells (via MHC II). Activated CD8+ T cells recognize and kill tumor cells
  expressing the same antigen. However, the immune response can be negatively regulated
  by immunosuppressive mechanisms, including regulatory T cells (Tregs) and immune
  checkpoint molecules (e.g., PD-1/PD-L1 and CTLA-4), which may limit the efficacy
  of the vaccine-induced antitumor response
