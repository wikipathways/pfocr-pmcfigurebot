figure_title: Molecular Genetics of Human Obesity (Leptin–Melanocortin Pathway).
caption: Molecular Genetics of Human Obesity (Leptin–Melanocortin Pathway). Leptin
  (LEP), secreted by adipose tissue, binds to its receptor (LEPR) in the arcuate nucleus
  of the hypothalamus, leading to activation (*) of POMC neurons and subsequent release
  of α-MSH. α-MSH binds to MC4R receptors on paraventricular nucleus (PVN) neurons,
  promoting appetite suppression and increased energy expenditure, and arrows (↑)
  indicate the direction of signal transduction or biological effect
