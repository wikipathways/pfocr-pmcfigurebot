figure_title: Structure and biogenesis of exosomes and their hijacking by orthoflaviviruses.
caption: Structure and biogenesis of exosomes and their hijacking by orthoflaviviruses.
  Exosomes’ biogenesis begins with the formation of early endosomes, which mature
  into MVBs that contain ILVs formed by ESCRT-dependent or independent pathways. Orthoflavivirus
  exploits this pathway by incorporating viral proteins, genomes, and immune modulators
  into exosomes. Viral replication complexes interact with the endosomal system, allowing
  virions or viral components to be secreted within exosomes. This hijacking facilitates
  viral dissemination, immune evasion, and persistence in the host
