caption: Microgliosis in Visual pathway and Hippocampus from 3-, 6- and 9-month-old
  WT and APP/PS1 mice. (a) Immunofluorescent staining for Iba-1 (red) in the Visual
  pathway and Hippocampus of mice (WT group, APP/PS1 group) at 3, 6, and 9 months
  old. Scale bar, 20 μm (white), 100 μm (green). (b) Iba-1+ positive cell density
  (cell per mm2) in V1 for WT group (black), APP/PS1 group (red). (c) Iba-1+ positive
  cell density (cell per mm2) in LGN for WT group (black), APP/PS1 group (red,). (d)
  Iba-1+ positive cell density (cell per mm2) Retina for WT group (black), APP/PS1
  group (red). (e) Iba-1+ positive cell density (cell per mm2) in Hippocampus for
  WT group (black), APP/PS1 group (red). Iba-1 immunoreactivity (red) labels microglia,
  and DAPI (blue) stains nuclei. Arrows point to microglial cells in the retina. n
  = 6–7 per group. * p < 0.05, ** p < 0.01, **** p < 0.0001
