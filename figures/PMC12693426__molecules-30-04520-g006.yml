figure_title: Pathway analysis.
caption: Pathway analysis. (A) KEGG mapping of identified metabolites. Metabolic pathways
  (y-axis) with more than two mapped metabolites are represented with the corresponding
  number of mapped metabolites (x-axis). The statistical significance of enrichment
  of metabolites for each pathway is given by an asterisk (* p < 0.05; ** p < 0.01;
  *** p < 0.001). (B) Reconstruction of KEGG metabolic pathways. Identified metabolites
  are represented as coloured nodes for different metabolite pathways assigned in
  the map; donut diagrams around each node represent the fold change ratio between
  plants grown in the field and in pots inside, according to the colour bar. The upper
  part of the diagram corresponds to cv. ‘Caerulea’ and the lower part to cv. ‘Alba’
  is shown for the upper node in the left column
