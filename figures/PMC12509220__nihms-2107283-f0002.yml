figure_title: PARP7 deficiency and inhibition increase IFN-I signaling with dsDNA
  treatment
caption: (A) The expression level of the CXCL10 (left) and IFNβ (right) genes (measured
  by qPCR) with or without the PARP7 inhibitor RBN-2397 (RBN; 500 nM) after dsDNA
  (2.5 ng/mL) treatment in MEF Parp7+/+ cells. Statistical significance was determined
  using an unpaired t test (data presented as mean ± SEM, n = 4, **p < 0.005, ****p
  < 0.0001).(B) Gene expression levels of CXCL10 and IFNβ (measured by qPCR) with
  or without dsDNA (2.5 ng/mL) treatment in Parp7+/+ and Parp7−/− MEF cells. Statistical
  significance was determined using an unpaired t test (data presented as mean ± SEM,
  n = 2 or 4, *p < 0.05, **p < 0.01).(C) Immunoblot analysis of type I IFN signaling
  pathway in Parp7+/+ and Parp7−/− MEF cells with or without dsDNA (2.5 ng/mL) treatment.All
  experiments were repeated three times. See also Figure S1
