caption: 'Illite suppresses IL-6-related pathways and p-STAT3 expression during hair
  regrowth. (A,B) GSEA of BP gene sets showing significant downregulation of multiple
  IL-6 production-related pathways in the (A) Illite (alone) vs. Control and (B) Minoxidil/Illite
  vs. Control groups. (C,D) Enrichment plots for the “Interleukin-6 production” pathway
  in the (C) Illite (alone) vs. Control (NES = −2.25, adjusted p < 0.001) and (D)
  Minoxidil/Illite vs. Control (NES = −2.02, adjusted p < 0.001) groups. (E) Representative
  IHC images and expression of p-STAT3 in dorsal skin sections on day 10 post-treatment.
  ** p < 0.01. Scale bar: 100 µm. NES, normalized enrichment score'
