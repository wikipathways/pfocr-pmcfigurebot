figure_title: Pathways to inflammation mediated by EP2 and CCR2.
caption: 'Pathways to inflammation mediated by EP2 and CCR2. Activation of CCR2 and
  EP2 receptors by their respective ligands triggers multiple intersecting biochemical
  pathways that converge in both the cytoplasm and nucleus to drive inflammatory gene
  transcription. Abbreviations: Akt, protein kinase B; AP1, activator protein 1; CCL2,
  chemokine ligand 2; CCR2, C-C chemokine receptor type 2; COX-2, cyclooxygenase-2;
  CREB, cAMP response element–binding protein; EP2, prostaglandin E2 receptor; EPAC,
  exchange protein directly activated by cAMP; ERK, extracellular signal–regulated
  kinase; IκBα, nuclear factor of kappa light polypeptide gene enhancer in B cells
  inhibitor alpha; IKKβ, IκB kinase; JAK, Janus kinase; MAPK, mitogen-activated protein
  kinase; MEK, mitogen-activated protein kinase kinase; NF-κB, nuclear factor κB;
  PGE2, prostaglandin E2; PI3K, phosphoinositide 3-kinase; PKA, protein kinase A;
  RAF, rapidly accelerated fibrosarcoma; RAS, rat sarcoma virus; STAT, signal transducer
  and activator of transcription. Figure created in BioRender; Varvel N. 2025. https://BioRender.com/bzee9od'
