figure_title: Population-level asymmetry at key lifespan milestones is highly specific
  to anatomical pathway and structural feature
caption: 'Heatmaps depict the population-median Lateralization Index (LI) for six
  key features at four discrete age points (3, 12, 30, and 50 years) across 30 major
  white matter tracts. The color scale reflects the direction and magnitude of the
  median asymmetry (red: rightward; blue: leftward), highlighting that distinct patterns
  of lateralization are already established in early life and continue to evolve across
  the lifespan'
