figure_title: Alveolar macrophage gene expression is partially distinct between skin-like
  and oral-like pneumotypes
caption: (A) Variation in the alveolar macrophage transcriptome associates with pneumotypeOL
  and pneumotypeSL. Permutational multivariate analysis of variance analysis (PERMANOVA)
  performed by comparing host gene expression profiles of a given pneumotype to the
  remaining samples with known pneumotypes (N total = 106 samples, N pneumotypeSL
  = 45 samples, N pneumotypeM = 25 samples, N PneumotypSP = 15 samples, N pneumotypeOL
  = 19 samples). Percentages and color represent variance explained (R2). (* FDR P
  < 0.05, ** FDR P < 0.01, *** FDR P < 0.001)(B) Volcano plots showing results of
  host differential gene expression analysis comparing pneumotypeSL (top) and pneumotypeOL
  (bottom) to remaining samples with known pneumotypes. Analysis performed using DESeq2
  with raw read counts. Red points indicate genes with FDR P < 0.05 and log2 fold
  change with an absolute value greater than 0.5 (n=99 host genes overexpressed in
  pneumotypeOL and n=47 host genes underexpressed in pneumotypeSL). Full table of
  results available in Table S4.(C) Venn diagram showing overlap fraction of host
  genes underexpressed in pneumotypeSL and overexpressed in pneumotypeSL from figure
  5B.(D) Zero log ridge plot showing the top 10 most differentially expressed host
  genes by FDR P in pneumotypeSL and pneumotypeOL, respectively.(E) Gene ontology
  enrichment analysis of host biological processes underexpressed in pneumotypeSL
  (top) and overexpressed in pneumotypeOL (bottom). Top 15 enriched pathways selected
  by highest fold enrichment (FDR P < 0.05, count of at least 5 differentially expressed
  host genes in that pathway). Full table of GO term enrichment results available
  in Table S4
