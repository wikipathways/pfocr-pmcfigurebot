figure_title: Sex-specific proteomic differences in human epilepsy.
caption: Sex-specific proteomic differences in human epilepsy. (A) Principal component
  analysis (PCA) of the overall dataset. PCA of epileptic female (F-E, red) and epileptic
  male (M-E, blue) cases shows similar protein expression profiles. Each point represents
  an individual case. (B) PC1 and PC2 bar plots indicate no significant separation
  between F-E and M-E cases. (C) Volcano plot displays protein expression differences
  for all identified proteins. Proteins highlighted in red showed significantly altered
  expression when comparing F-E and M-E cases. Significance was determined using Student’s
  t-test. P-values for significantly altered proteins are provided in the Supplementary
  Table 1. (D) Heatmap of scaled protein expression values (z-scores), color-coded
  according to the legend on the right, for significantly changed proteins used in
  clustering analysis. (E) Expression levels of selected proteins of interest with
  significant sex-specific differences. Each point represents an individual case.
  *p < 0.05; **p < 0.01; ***p < 0.001. (F) KEGG pathway analysis of significantly
  altered proteins. The top 10 pathways are shown
