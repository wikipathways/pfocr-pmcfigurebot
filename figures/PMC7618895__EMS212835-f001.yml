figure_title: Workflow for Lung Cancer Screening, Risk Stratification, and Management
caption: This figure illustrates a streamlined clinical pathway for evaluating pulmonary
  nodules identified through lung cancer screening or incidentally on diagnostic imaging,
  with an emphasis on risk-adapted management strategies. High-risk individuals undergo
  screening using low-dose computed tomography (LDCT). Emerging biomarkers from novel
  technologies such as radiomics, liquid biopsy (LB), and volatile organic compound
  (VOC) analysis may improve risk stratification. Risk assessment incorporates clinical,
  radiologic, and molecular data to stratify patients and guide management decisions.
  Low-risk nodules are monitored through active surveillance; suspicious nodules undergo
  additional diagnostic imaging and biopsy as needed to confirm malignancy; and high-risk
  precancerous nodules may be candidates for interception strategies aimed at preventing
  progression to invasive disease. Symptomatic individuals or patients with incidental
  chest CT findings are evaluated using the same risk-based approach
