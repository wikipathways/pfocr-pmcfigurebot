figure_title: Successful disruption of the arginine to proline pathway
caption: '(A) Schema of the arginine to proline pathway.(B) Clonal parasites with
  an ARG (Dd2ΔARG) or ornithine-δ-aminotransferase (Dd2ΔOAT) deletion do not have
  a growth defect compared to the parental line (Dd2). Shown is the relative growth
  of Dd2ΔARG C1 (clone 1), Dd2ΔOAT C1 (clone 1), and Dd2 normalized to the initial
  signal measured by SYBR Green to stain DNA as a proxy for parasite growth. Shown
  are the average and standard deviation of three biological replicates.(C) Dd2ΔARG
  C1 and Dd2ΔOAT C1 parasites show similar sensitivity to halofuginone (HFG) as the
  parental Dd2 line. Shown is a representative dose-response plot showing sensitivity
  to HFG for the three cell lines (HFG EC50s: Dd2 = 0.472 nM, Dd2ΔARG C1 = 1.4 nM,
  and Dd2ΔOAT C1 = 0.758 nM). Individual data points represent the average response
  of technical triplicates plus/minus standard deviation and are plotted along with
  a non-linear regression curve fit for each cell line tested.(D and E) Parasites
  were incubated with multiplexed isotope media for 10 h, after which metabolites
  were extracted and analyzed by LC-MS. Proline (D) and ornithine (E) levels for the
  different metabolite species were normalized to total signal of all detected metabolites
  per sample and subsequently compared to the Dd2 parental line. Shown is the average
  and standard deviation of the fold change to Dd2 (at least two biological replicates).
  Statistical analysis: unpaired Student’s test between Dd2 and KO parasites for each
  species: *p < 0.05, ***p < 0.001, ****p < 0.0001.See also Figure S2 for cloning
  strategy and genetic confirmation of KO lines, Table S1 for complete metabolomics
  dataset, and Table S2 for dose-response data'
