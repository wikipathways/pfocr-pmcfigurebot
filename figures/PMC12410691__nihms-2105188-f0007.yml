figure_title: Statistical Comparison between Sedentary and Exercise Nuclear Proteomes
caption: A) Line graph displaying the number of differentially abundant proteins increasing
  (blue) or decreasing (red) compared to sedentary mice (Padj < 0.1). B) Line graph
  displaying differentially abundant proteins increasing (blue) or decreasing (red)
  compared to preceding timepoint (Padj < 0.1). C) Functional cluster analysis (FDR
  < 0.05) of differentially abundant proteins between sedentary (Sed) and immediate
  post-exercise (IPE). Colored bars show proportion of proteins in respective pathways
  that decrease (red) or increase (blue) immediate post-exercise D) Functional cluster
  analysis (FDR < 0.05) of differentially abundant proteins between immediate post-exercise
  (IPE) and 1-Hour post-exercise. Colored bars show the proportion of proteins in
  respective pathways that decrease (red) or increase (blue) 1-Hour post-exercise.
  E) Heatmap of z-scored proteins related to mRNA Splicing (n = 35). F) Heatmap of
  z-scored proteins related to Nucleocytoplasmic Transport (n = 19). Sed = sedentary
  (n=5); IPE = immediate post-exercise (n=5); 1-Hour Post-Ex = 1-Hour post-exercise
  (n=5); 4-Hour Post-Ex = 4-Hour post-exercise (n=5). G) Images of skeletal muscle
  nuclei (DAPI; blue), z-line proteins myomesin or α-actinin (red), and nuclear proteins
  paraspeckle protein component 1 (PSPC1), polypyrimidine tract binding protein 2
  (PTBP2), and RNA polymerase II (RNA pol II) (white) in longitudinal sections of
  gastrocnemius muscle from sedentary (Sed), immediate post-ex (IPE), 1-hour post-ex
  (1-Hour), and 4-hour post-ex (4-Hour) mice. Scale bar = 10 μm. BP = Biological Process;
  CC = Cellular Compartment; MF = Molecular Function; R = Reactome; K = Kegg
