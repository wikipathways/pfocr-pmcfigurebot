figure_title: Loss of Nf1 alters a behavioral phenotype, grooming, via effects on
  MEK, but not Akt
caption: '(A) Diagram of the open field arena containing a fly, with a camera recording
  above. (B) Diagram showing Nf1-Ras signaling and the downstream Raf/MEK and PI3K/Akt
  signaling pathways. Green arrows represent the direction of signaling change following
  loss of Nf1. Red X marks show the molecules targeted for in vivo genetic analyses
  in panels C-D. (C) Quantification of grooming in flies harboring RNAi targeting
  Nf1,MEK, or both, along with controls. ***p < 0.001; n.s.: not significant (Šidák,
  n = 12–16). (D) Quantification of grooming in flies harboring RNAi targeting Nf1,
  Akt, or both. ***p < 0.001; n.s.: not significant (Šidák, n = 9–13). (E) Nf1 knockdown
  efficiency (log fold change normalized to Gal4/+ controls) in flies harboring RNAi
  targeting Nf1 or Nf1 + MEK, measured with quantitative PCR. n.s.: not significant
  (p = 0.42, Mann-Whitney, n = 5). (F) Representative western blot of total ERK and
  phosphorylated ERK in controls (nSyb-Gal4/+), and flies with pan-neuronal MEK knockdown,
  Nf1 knockdown, or Nf1 + MEK knockdown. Samples derived from the same experiment
  and processed in parallel, with β-tubulin as loading control. Representative blot
  shown from one of two experiments'
article_title: Metabolic and behavioral effects of neurofibromin result from differential
  recruitment of MAPK and mTOR signaling
