figure_title: Longitudinal KEGG pathway expression and enrichment in cervical bacterial
  metatranscriptome by BV recurrence status
caption: '(a) Line plots showing mean Z-score trends for selected KEGG pathways significantly
  enriched in bacterial transcripts, plotted over three timepoints: baseline (T0),
  1 month (T1), and 6 months (T2). Participants were stratified by BV recurrence status
  at 6 months (nonrecurrent: blue solid line; recurrent: red dashed line). Pathways
  were selected based on relevance to metabolism, microbial adaptation, and quorum
  sensing. Each point represents the mean normalized expression (Z-score) of all genes
  in the pathway per participant; asterisks indicate significance levels comparing
  recurrence groups at each timepoint (*p < 0.05; **p < 0.01; ***p < 0.001, adjusted).
  (b) Dot plot of KEGG pathway enrichment based on differentially expressed bacterial
  genes at 1 month (T1) between recurrence groups. The x-axis represents the gene
  ratio (hits/total tested), dot size reflects the number of genes contributing to
  the enrichment, and color indicates adjusted p-value. Key enriched pathways include
  ribosome biogenesis, diverse metabolic processes, and microbial signaling systems
  such as quorum sensing'
