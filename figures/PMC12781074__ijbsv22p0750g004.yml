figure_title: Impact of microbial dysbiosis on inflammatory response and immune system.
caption: Impact of microbial dysbiosis on inflammatory response and immune system.
  Microbial dysbiosis leads to the accumulation of uremic toxins and LPS, which affect
  the immune system and inflammatory response via two pathways. Harmful metabolites
  interact with intestinal epithelial cells, leading to activation of NF-κB signaling
  pathway. Harmful metabolites cross the gut intestinal barrier, activate immune cells,
  including dendritic cells, macrophages, and neutrophils, and produce pro-inflammatory
  cytokines, such as IL-1β and TNF-α, leading to inflammatory reactions. Harmful metabolites
  also promote antigen presentation and initiate host adaptive immune responses by
  affecting the inflammatory factors. Microbial dysbiosis exacerbates renal fibrosis
  by increasing the levels of uremic toxins and LPS and by regulating the immune system
  and inflammatory response
