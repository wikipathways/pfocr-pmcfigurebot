figure_title: NETs inhibition modulates inflammatory and tight junction protein expression
  in the TBI.
caption: NETs inhibition modulates inflammatory and tight junction protein expression
  in the TBI. (A) KEGG pathway enrichment analysis of differentially expressed genes
  from RNA-Seq of NETs-treated and vehicle-treated HUVECs. (B to G) Western blot analysis
  and densitometric quantification were performed to measure the expression levels
  of TLR4, NLRP3, P-NF-κB, TREM1, ET-1 and GAPDH in the damaged cortex of TBI or sham
  group mice. (n = 6/group). (H to M) Representative images of double immunofluorescence
  staining for P-NF-κB (red), NLRP3 (red), or ZO-1 (red) and CD31 (green), along with
  quantitative analysis of mean fluorescence intensity, in the cortical injury sites
  of mice on day 3 post-TBI following different treatments. Nuclei were stained with
  DAPI (blue). White scale bar = 50 µm. Red scale bar = 20 µm. (n = 6/group). (N to
  Q) Western blot analysis and densitometric quantification were performed to measure
  the expression levels of ICAM-1, Occludin, Claudin-5, and GAPDH in the cortical
  injury sites of mice on day 3 post-TBI following different treatments. (n = 6/group).
  Data are presented as mean ± S.D. and analyzed by one-way ANOVA with Bonferroni's
  multiple comparison test. *p < 0.05, **p < 0.01, ***p < 0.001
