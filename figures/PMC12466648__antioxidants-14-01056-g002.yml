figure_title: Comparative transcriptomic and functional analysis of DEGs.
caption: Comparative transcriptomic and functional analysis of DEGs. (A) Principal
  component analysis (PCA) of expressed genes for each sample of the LK and OD groups.
  (B) Volcano plot of significantly differentially expressed genes (DEGs); red dots
  represent significantly upregulated genes, green dots represent significantly downregulated
  genes, and blue dots indicate genes without significant differential expression.
  (C) Heatmap clustering analysis of expressed genes within each sample of the LK
  and OD groups. (D) Gene Ontology (GO) enrichment pathway analysis of DEGs. (E) Kyoto
  Encyclopedia of Genes and Genomes (KEGG) functional analysis of DEGs. (F) GO enrichment
  top 10 chord diagram. The right side represents the classification composition,
  and the left side represents the classification and gene correspondence
