figure_title: 'Shared and distinct pathways linking particulate matter and aircraft
  noise to cardiovascular dysfunction. Particulate matter exposure (left) increases
  pulmonary oxidative stress (NOX-2, HO-1), inflammation (MCP-1, CD68), and ACE-2
  expression, leading to the release of circulating cytokines and downstream vascular
  effects. Aircraft noise exposure (right) induces endothelial dysfunction in cerebral
  and retinal arterioles via NOX-2 and P-MARCKS activation, triggering sympathetic
  activation and increased circulating catecholamines (adrenaline, noradrenaline).
  Both exposures converge on excessive formation of reactive oxygen species (ROS),
  which impair endothelial function, increase blood pressure, and activate oxidative
  stress markers (3-NT, Cu/Zn-SOD, Mn-SOD, HO-1). Transcriptomic analyses reveal distinct
  pathway signatures: apoptosis, inflammation, ferroptosis, metabolic pathways, and
  cell cycle disruption in particulate matter exposure, versus insulin signaling,
  MAPK signaling, calcium signaling, PI3K–Akt signaling, and tight junction disruption
  in noise exposure. Additive risk with COVID-19 is mediated by enhanced ACE-2 expression
  and systemic inflammatory activation. Collectively, particulate matter and aircraft
  noise share ROS-driven mechanisms that compromise vascular homeostasis and promote
  cardiovascular disease. Reused from (Kuntic et al., 2023) with permission'
