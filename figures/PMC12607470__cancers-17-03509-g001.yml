figure_title: Workflow of the multi-stage feature selection and analysis framework.
caption: Workflow of the multi-stage feature selection and analysis framework. The
  pipeline begins with data acquisition, preprocessing, and the generation of a high-dimensional
  mRNA feature set. Initial unsupervised reduction is performed using variance thresholding,
  correlation filtering, and K-best selection to derive a partially reduced feature
  set. This is followed by a hybrid supervised feature selection stage integrating
  random forest feature importance, recursive feature elimination (RFE), and LASSO
  regression with stratified k-fold cross-validation, resulting in an optimal feature
  set. The selected features are then used for downstream analyses, including gene
  co-expression similarity network construction, enriched pathway analysis, model
  training, and model validation, enabling robust subtype characterization and biological
  interpretation of ovarian cancer
