figure_title: This schematic diagram depicts the core amino acid metabolic reprogramming
  and interconnected regulatory networks driving hepatocellular carcinoma (HCC) progression.
caption: This schematic diagram depicts the core amino acid metabolic reprogramming
  and interconnected regulatory networks driving hepatocellular carcinoma (HCC) progression.
  Key amino acids (lysine, methionine, arginine, cystine, tryptophan, glutamine, aspartate,
  proline, BCAAs) modulate HCC malignant phenotypes. Glutamine is avidly taken up
  by HCC cells via SLC1A5/SLC38A1 transporters, and hydrolyzed to glutamate by GLS;
  glutamate further participates in the TCA cycle (via GLUD-mediated conversion to
  α-KG) or acts as a signaling molecule to activate calcium-dependent PLC-γ/PKC pathway
  (through NR2B) and promote CCL2 expression, thereby recruiting tumor-associated
  macrophages. Tryptophan catabolism (catalyzed by IDO1/IDO2) generates metabolites
  that activate AhR, suppressing T cell function and fostering an immunosuppressive
  microenvironment; methionine metabolism (regulated by MAT2A) produces SAMe to drive
  histone methylation, while also enhancing CD8+ T cell cytotoxicity via inhibiting
  NR1I2/PCSK9 signaling.Cystine uptake through SLC7A11 supports GSH synthesis, which
  collaborates with GPX4 to inhibit ferroptosis; BCAAs are transported via SLC7A5/SLC3A2
  (LAT1) and regulate HCC survival under nutrient stress through AMPK/mTOR pathway
  or BCKDH-mediated catabolism to replenish the TCA cycle. Arginine (transported by
  SLC7A1) activates mTORC1/S6K1 signaling, with ASS1 expression dictating arginine
  auxotrophy or nitric oxide production; lysine uptake by HCC via SLC3A2 induces T
  cell lysine deficiency, reducing STAT3 levels and impairing T cell function. Oncogenic
  signaling pathways (Wnt/β-catenin, PI3K/Akt, HIF-1α, c-Myc) and key enzymes (GOT2,
  PYCR1, ALDH18A1, ACC) synergistically regulate amino acid metabolism, while processes
  such as macropinocytosis (under nutrient starvation) and proline-driven extracellular
  matrix (ECM) production further support HCC progression
