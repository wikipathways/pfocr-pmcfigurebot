figure_title: Furin drives CRC chemoresistance through the TGF-β/ERK signaling pathway.
caption: Furin drives CRC chemoresistance through the TGF-β/ERK signaling pathway.
  (A,B) The 5-FuR CRC cell lines exhibit enhanced proliferation. Parental and 5-FuR
  cells were subjected to clonogenic assays (n = 3). (C) The 5-FuR CRC cell lines
  show complete resistance to 5-Fu treatment (50 μM), as assessed by Annexin V/PI
  apoptosis analysis (n = 3). (D) The 5-FuR cells display increased expression of
  furin, TGF-β1, and ERK1/2 phosphorylation, as determined by immunoblotting. (E)
  Furin knockdown restores 5-Fu sensitivity (50 μM), as shown by apoptosis analysis
  (n = 3). * p < 0.05 compared with controls
article_title: Furin Drives Colorectal Cancer Progression and Chemoresistance Through
