caption: 'Molecular mechanisms of action of TGF-β pathway antagonists. TGF-β pathway
  antagonists can be classified into seven types: antibodies that inhibit ligand/receptor
  interactions, small-molecule inhibitors, antisense oligonucleotides, ligand traps,
  vaccines, natural products and conventional drugs with new applications. TGF-β:
  transforming growth factor-β; TβR: TGF-β receptor; SMAD: suppressor of mothers against
  decapentaplegic; AMPK: adenosine monophosphate-activated protein kinase; RAS: rat
  sarcoma; RAF: rapidly accelerated fibrosarcoma; MEK: mitogen-activated protein kinase
  kinase; ERK: extracellular signal-regulated kinases'
