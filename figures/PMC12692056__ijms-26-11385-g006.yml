caption: Comparison of signal transduction pathway (STP) activity scores of normal
  (healthy donor) pancreas (GSE71989) with tumor-adjacent normal pancreas (GSE16515).
  (A) Estrogen receptor (ER) pathway activity is shown as a control, since its activity
  is not altered in PDAC. (B) TGFβ STP activity is increased in tumor-adjacent tissue.
  (C) Pathways with no differences in STP activity. A p-value > 0.01 is considered
  non-significant (ns). Values are depicted in numbers if p ≤ 0.05
