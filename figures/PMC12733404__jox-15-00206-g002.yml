figure_title: AhR signaling pathways.
caption: AhR signaling pathways. In its unliganded state, AhR is located in the cytosol
  in a complex with two HSP90s, chaperones (XAP-2), the cochaperone p23, and other
  partners, as well as the tyrosine kinase c-Src. A ligand-binding changes AhR’s conformation,
  the complex dissociates, and AhR translocates to the nucleus, where it forms a dimer
  with ARNT (canonical pathway) or (non-canonical pathway) with non-ARNT partner proteins
  such as KLF6, NF-κB, pRb, or nuclear receptors (e.g., ERα). The dimer binds to XRE
  or NC-XRE in DNA and induces transcription of AhR target genes. In nongenomic signaling
  AhR dissociated from the c-Src complex and AhR can interact with epidermal growth
  factor receptor (EGFR) involved in focal adhesion kinase FAK pathway and mitogen-activated
  protein kinase (MAPK) pathways. ARNT, aryl hydrocarbon receptor nuclear translocator;
  CYP, cytochrome P450; ENO1, alpha-enolase; ERα, Estrogen receptor alpha; Fgf21,
  fibroblast growth factor 21; GLUT, glucose transporter; HSP90, heat shock proteins
  90; KLF6, transcription factor Krüppel-like factor 6; NC-XRE, nonconsensus XRE;
  NF-κB, transcription factors of the nuclear factor kappa B family; PPARα, peroxisome
  proliferator-activated receptor α; pRb, retinoblastoma protein; XAP-2, hepatitis
  B virus X-associated protein 2; XRE, a xenobiotic-responsive element
