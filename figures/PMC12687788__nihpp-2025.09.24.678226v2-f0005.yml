figure_title: Mutator foci, but not Z granules, are required for HRDE-1–mediated repression
caption: a, Schematic of the perinuclear condensates present in C. elegans germlines,
  where 22G-RNA biogenesis occurs, highlighting the main components analyzed in this
  study. ENDO, endonucleases (RDE-8, NYN-1, NYN-2); RdRP, RNA-dependent RNA polymerase.
  b, chematic of polyUGylation assay, based on oligo-specific reverse transcription
  (RT primer shown in grey) of polyUGylated mRNAs and PCR amplification using reverse
  primers complementary to adaptor sequences in the RT primer (rv1 and rv2) and gene-specific
  primers (fw1 and fw2). c,e, PolyUGylation assay for HRDE-1–repressed genes that
  lose 22G-RNAs transgenerationally, analyzed across different genetic backgrounds.
  gsa-1 serves as a control. Genes are grouped by their dependence on the piRNA pathway
  for 22G-RNA biogenesis20. d, RT–qPCR analysis of HRDE-1–repressed genes in hrde-1,
  rde-8;nyn-1;nyn-2 triple mutants (“endo”), and mut-16 mutants at the L4 stage (44
  hours post-hatching, hph). Expression values are normalized to act-3. Bars show
  mean log2 fold change (FC), dots represent biological replicates (n = 3). f, RT–qPCR
  analysis of selected HRDE-1–repressed genes in control and znfx-1 mutant backgrounds
  following G0 or G1 HRDE-1 depletion at the L4 stage, normalized to act-3. Bars show
  mean log2FC; dots represent biological replicates (n = 4-5). Genes are grouped as
