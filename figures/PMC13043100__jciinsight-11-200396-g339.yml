figure_title: Downregulation of oxidative phosphorylation and angiogenesis pathway
  in cachectic myofibers
caption: '(A) Enrichment analysis of downregulated genes in cachectic myonuclei highlighting
  significantly enriched pathways. (B) Heatmap displaying the expression of the top
  50 downregulated genes in cachectic nuclei compared with all the myonuclei of control
  mice. (C) Violin plots showing module scores for the OXPHOS and angiogenesis processes
  across different myonuclear clusters from GA muscle of control and KPC tumor–bearing
  mice. Each violin represents the distribution of pathway scores within a fiber type.
  (D) Heatmap showing the expression of representative genes related to OXPHOS and
  Angiogenesis from bulk RNA-seq analysis of GA muscle of control and KPC tumor–bearing
  mice. (E and F) Immunoblots showing protein levels of MyHC (E), and OXPHOS (F) complexes
  I–V in skeletal muscle of control and KPC tumor–bearing mice. (G and H) Representative
  photomicrographs (G) and quantification of CD31+ cells (H) per unit area after immunostaining
  for CD31 (pink) and Laminin (white) protein in soleus muscle from control and KPC
  tumor–bearing mice. Scale bar: 50 μm. n = 3–4 per group. All data are presented
  as mean ± SEM. *P ≤ 0.05, values significantly different from control mice analyzed
  by unpaired Student’s t test'
article_title: Fiber-type vulnerability and proteostasis reprogramming in skeletal
  muscle during pancreatic cancer cachexia
