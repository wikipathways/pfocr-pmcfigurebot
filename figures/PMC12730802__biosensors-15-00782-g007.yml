figure_title: Chord diagrams revealing gene–function associations based on GO and
  KEGG enrichment analyses in the RA model and treatment groups.
caption: 'Chord diagrams revealing gene–function associations based on GO and KEGG
  enrichment analyses in the RA model and treatment groups. Chord plots depict the
  relationships between differentially expressed genes and their corresponding biological
  processes or signaling pathways, with colored arcs representing specific GO terms
  (a–d) or KEGG pathways (e–h). Each chord illustrates a gene enriched in one or more
  functional categories, highlighting the multifaceted roles of hub genes in RA pathogenesis
  and therapeutic response. GO enrichment-based diagrams: (a) RA Day 18 group vs.
  healthy control, showing strong associations between immune system processes, cell
  adhesion, chemotaxis, and osteoclast differentiation. (b) RA Day 28 group vs. healthy
  control, indicating expanded functional engagement in defense response, bone resorption,
  and macrophage fusion. (c) Tofacitinib-treated group vs. healthy control, showing
  a distinct shift in GO term associations with marked reduction in immune and inflammatory
  signatures. (d) NAC-treated group vs. healthy control, revealing more restricted
  GO engagement, yet retaining some immune-related functions. KEGG pathway-based diagrams:
  (e) RA Day 18 group vs. healthy control, with key genes enriched in cytokine-cytokine
  receptor interaction, chemokine signaling, and NF-κB pathways. (f) RA Day 28 group
  vs. healthy control, reflecting continued enrichment in pro-inflammatory signaling
  such as Th17 differentiation and Toll-like receptor signaling. (g) Tofacitinib-treated
  group vs. healthy control, showing extensive suppression of immune-related signaling,
  particularly JAK-STAT and MAPK pathways. (h) NAC-treated group vs. healthy control,
  with moderate attenuation of inflammatory pathway activity, including JAK-STAT and
  B cell receptor signaling'
