figure_title: Radiotherapy-mediated metabolic shifts within the TME.
caption: 'Radiotherapy-mediated metabolic shifts within the TME. Radiotherapy triggers
  tumor metabolic rewiring to enhance survival. Glycolysis fuels ATP, while PKM2 inactivation
  diverts intermediates to the PPP and SSP. Glutamine metabolism supports nucleotide
  and glutathione synthesis via GLS. Enhanced lipogenesis and lipid scavenging from
  stromal cells (e.g., CAFs and adipocytes) aid membrane repair. Tumor-secreted ROS
  and lactate suppresses immune activity, while stromal cells supply nutrients, fostering
  therapy resistance. Abbreviations: PKM2, pyruvate kinase M2; PPP, pentose phosphate
  pathway; SSP, serine synthesis pathway; GLS, glutaminolysis; CAF, cancer-associated
  fibroblast; ROS, reactive oxygen species'
article_title: 'Radiotherapy elicits immunogenic cell death and metabolic shifts in
  the tumor microenvironment: implications for immunotherapy'
