figure_title: PI3K is widely activated in sarcomas
caption: (A) The Cancer Genome Atlas (TCGA) data (cBioPortal online) for PI3K signaling
  alterations in sarcomas (n = 253) demonstrating the incidence of mutations in the
  PI3K signaling pathway. (B) TCGA data demonstrating the frequency of genetic alterations
  of PTEN in sarcomas (n = 253). (C) H&E and IHC performed for PTEN, TAZ, and YAP
  on adult-type rhabdomyosarcoma from tissue microarray. Inset for PTEN shows vascular
  positive control. Insets for activated (nuclear) TAZ and YAP. (D) H-scores from
  clinical tissue microarray panel of various sarcoma histological subtypes. See supplemental
  materials for abbreviations used. Histology, H&E staining, and IHC for PTEN, TAZ,
  and YAP in a sample of alveolar rhabdomyosarcoma (ARMS). (E) Number of sarcomas
  exhibiting low PTEN/high TAZ expression relative to high PTEN/high TAZ expression
  (left) and composition of sarcomas exhibiting low PTEN/high TAZ profile according
  to histological type (right). (F) Number of sarcomas exhibiting low PTEN/high YAP
  expression relative to high PTEN/high YAP expression (left) and composition of sarcomas
  exhibiting low PTEN/high YAP profile according to histological type (right). Two-tailed
  P values for IHC counts were evaluated using the χ2 test with 1 degree of freedom.
  **P < 0.01, ***P < 0.001
article_title: PI3K regulates TAZ/YAP and mTORC1 axes that can be synergistically
  targeted
