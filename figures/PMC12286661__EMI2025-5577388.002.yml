figure_title: A 43-year-old male presented with blunt hepatic injury following a motorcycle
  accident.
caption: A 43-year-old male presented with blunt hepatic injury following a motorcycle
  accident. (a) Contrast-enhanced (CE) axial computed tomography (CT) during the portal
  phase reveals extensive ill-defined low-density lesions involving both lobes of
  the liver, indicative of blunt liver injury. (b) CE axial CT during the arterial
  phase demonstrates celiac axis stenosis (indicated by arrow) attributed to compression
  by the median arcuate ligament. (c) Selective angiography of the aberrant right
  hepatic artery originating from the superior mesenteric artery shows retrograde
  contrast material filling of the celiac branches (denoted by asterisk) through interlobar
  (open arrow) and intrahepatic (solid arrow) collateral vessels connecting the right
  and left hepatic arteries. Active hemorrhage (arrowhead) is also observed in segment
  IV of the liver. (d) Following the inability to advance the microcatheter to the
  site of bleeding through the intrahepatic collateral pathway (illustrated in the
  white-bordered box in the lower left), a decision was made to cannulate the stenotic
  segment of the celiac axis using a 5-Fr RHR catheter (open arrow). The microcatheter
  (solid arrow) was successfully advanced coaxially into the common hepatic artery
  and selective angiography of the hepatic artery revealed active bleeding (arrow),
  which was effectively managed with embolization using a 1:2 mixture of N-butyl cyanoacrylate
  and iodized oil
article_title: Efficacy of Transcatheter Arterial Embolization for Hemorrhage Control
  in Traumatic Hepatic Injury With Celiac Axis Stenosis
