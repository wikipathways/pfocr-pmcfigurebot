caption: PI3K-Akt-mTOR signaling pathway in tumor cells and JAK-STATs-PDL1 signaling
  axis in oligodendrocytes were activated respectively after co-culture or secretory
  ERBB3 treated. (A) Flowchart depicting the cell sequencing process. (B) Volcano
  diagram showing differential genes in tumor cells. (C-D) GO and KEGG enrichment
  analysis of differential genes in tumor cells. (E) Validation of key proteins in
  the signaling pathway in tumor cells stimulated by the conditioned medium (CM)of
  oligodendrocytes. (F) Validation of key proteins in the signaling pathway in tumor
  cells stimulated by ERBB3 recombinant protein. (G) Cluster analysis of differential
  genes in oligodendrocytes. (H) GSEA enrichment analysis of differential genes in
  oligodendrocytes co-cultured with tumor cells. (I) Validation of key proteins in
  the signaling pathway in oligodendrocytes after co-culture with tumor cells. All
  experiments were repeated three times
