figure_title: Players involved in each step of cellular mechanotransduction
caption: Mechanical forces can be intercepted by a variety of mechanosensors and mechanotransducers
  (green). Piezo channels and two-pore domain potassium (K2P) channels (such as TREK-1)
  are ion channels that are activated by mechanical force. When activated, Piezo channels
  allow for calcium ions (Ca2+ to flow into cells, while activated K2P channels transport
  potassium ions (K+) out of cells (top left). The cell adhesion molecules, integrins
  and cadherins, also function as mechanosensors capable of transmitting mechanical
  signals into the cell via the actin cytoskeleton, though microtubules have also
  been implicated in integrin mechanotransduction (top middle). Mechanotransduction
  initiated by integrin receptors is propagated by focal adhesion (FA) complexes.
  Furthermore, the ECM component fibronectin acts as a mechanosensor due to its ability
  to undergo mechanically regulated conformational changes, which in turn trigger
  integrin signaling (top right). After a mechanical stimulus is intercepted by a
  mechanosensor, several intracellular mechanosensitive signaling pathways (blue)
  are activated downstream (mechanotransduction). Integrin receptors and FA molecules
  participate in the Hippo signaling pathway, which ultimately leads to the activation
  of the co-transcriptional activator molecules YAP1 and TAZ (YAP1/TAZ complex). When
  activated, YAP1/TAZ complexes translocate from the cytosol to the nucleus, where
  they interact with TEAD transcription factors to drive changes in gene expression.
  NF-κB activation and regulation of transcription also respond to mechanical forces.
  Further, the MAPKs extracellular signal-regulated kinase (ERK) and c-jun N-terminal
  kinase (JNK) are both activated by mechanical forces. Upon activation, ERK and JNK
  are shuttled from the cytosol to the nucleus, where they phosphorylate and activate
  target transcription factors, which in turn drive changes in gene expression
