figure_title: Lipid-associated macrophages in adipose tissue.
caption: 'Lipid-associated macrophages in adipose tissue. (A) Schematic representation
  showing a monocyte—pre-lipid-associated macrophage (pre-LAM)—LAM trajectory. Pre-LAMs
  appear in early obesity with gene expression levels intermediate between those of
  monocytes and LAMs. Monocyte markers (e.g., C-X3-C motif chemokine receptor 1 [Cx3cr1],
  lymphocyte antigen 6C2 [Ly6c2]) decline along the trajectory, whereas LAM markers
  (e.g., galectin 3 [Lgals3], triggering receptor expressed on myeloid cells 2 [Trem2],
  and cathepsin L [Ctsl]) increase. In chronic obesity, LAMs diversify into adaptive
  states enriched for lysosomal/metabolic programs (e.g., peroxisome proliferator-activated
  receptor gamma [Pparg], lysosomal acid lipase [Lipa]) and maladaptive states enriched
  for inflammatory pathways (e.g., NLR family pyrin domain containing 3 [Nlrp3], toll-like
  receptor 2 [Tlr2], major histocompatibility complex [MHC] II, triggering receptor
  expressed on myeloid cells 1 [Trem1]), which increase in obesity and correlate with
  metabolic dysfunction. (B) Model of brown adipocyte-LAM interaction: Metabolically
  stressed brown adipocytes release lipidladen extracellular vesicles (EVs) containing
  damaged mitochondria. CD36+ LAMs capture these vesicles/debris and secrete transforming
  growth factor β1 (TGFβ1), which induces aldehyde dehydrogenase 1A1 (Aldh1a1) in
  neighboring brown adipocytes, compromising brown-adipocyte identity and promoting
  a shift toward a white adipocyte-like phenotype'
