caption: 'A. Viral strategy to dual label PS and DMS -originating SN disynaptic pathways.
  B. Expression of DMS-innervated eYFP-labeled cells in the SNc and SNr. C. Expression
  of PS-innervated tdTom-labeled cells in the SNl and PP. D-E. Fluorescence density
  maps for cells and associated axons postsynaptic to the PS (D) and DMS (E). Grayscale
  represents the % of pixels within a 50 by 50 um area that exceed one standard deviation
  of z-scored fluorescent intensity (black = 100%). F-L, O-P. Terminal expression
  of PS→SN (tdTom) and DMS→SN (eYFP) cells in thalamus and midbrain. M-N, Q-R. Density
  maps of PS or DMS -initiating direct pathway terminal innervation of the superior
  colliculus (SC). Scale bars: 500 μm. Abbreviations: FG (Fluorogold)'
