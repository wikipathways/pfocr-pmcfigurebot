figure_title: ERK1/2 pathway is activated and involved in BTXA-induced upregulation
  of claudin-1.
caption: ERK1/2 pathway is activated and involved in BTXA-induced upregulation of
  claudin-1. (A–C) Western blot analysis of ERK1/2 (A), p38 (B), and JNK (C) phosphorylation
  in BTXA-treated SMG-C6 cells. (D) Western blot analysis of ERK1/2 phosphorylation
  in rat SMGs. (E) BTXA-induced increase in TER was reversed by preincubation with
  U0126. (F,G) BTXA-induced decrease in paracellular flux of 4 kDa (F) and 40 kDa
  FITC-dextran (G) was reversed by preincubation with U0126. (H) BTXA-induced upregulation
  of Cldn1 was reversed by preincubation with U0126, as detected by Western blot.
  (I,J) BTXA-induced upregulation of Cldn3 and Cldn4 remained unchanged after preincubation
  with U0126, as detected by Western blot. SMG-C6 cells treated with 50 U/mL BTXA
  for 24 h. TER, transepithelial electrical resistance; Cldn, claudin. Data are presented
  as mean ± SEM; n = 3–7, * p < 0.05; ** p < 0.01 compared with control group
