figure_title: Chronic cardiac transcriptomes at 5 weeks post-cessation reveal persistent
  alterations to cellular assembly and energy homeostasis in aged mice
caption: (A) Multivariate analysis (PLS-DA) reveals persistent divergence of cardiac
  transcriptomes induced by laparotomy and isoflurane exposure (ISO/OP). (B) Volcano
  plot of differentially expressed genes (DEGs) comparing 20m ISO/OP vs. 20m Sham.
  (C-D) Enriched GO molecular processes (C) and KEGG pathways (D) for upregulated
  DEGs. (E-F) Enriched GO molecular processes (E) and KEGG pathways (F) for downregulated
  DEGs. Heatmaps of representative genes contributing to the top enriched GO term
  pathways (G, H). (I–J) Bar plots illustrating expression of selected DEGs linked
  to the top three enriched pathways in up- (I) and down- (J) regulated DEGs. n=5
  mice/group
article_title: Isoflurane and Surgical Stress Disrupt Fatty Acid and Carbon Metabolism
