figure_title: Genomic selection signals and pathway analysis between Wanyue Black
  pigs (WYB) and Huoshao Black pigs (HS).
caption: 'Genomic selection signals and pathway analysis between Wanyue Black pigs
  (WYB) and Huoshao Black pigs (HS). (a) FST Manhattan plot: Genome-wide distribution
  of FST calculated with a 50 kb sliding window and 25 kb step. Peaks represent regions
  with significant genetic differentiation between WYB and HS. (b) Nucleotide diversity
  ratio (πHS/πWYB) Manhattan plot: Distribution of πHS/πWYB under the same parameters.
  Higher ratios indicate genomic regions in WYB with reduced nucleotide diversity
  due to selective sweeps. (c) Correlation plot between FST and nucleotide diversity
  ratio: Positive correlation between FST and πHS/πWYB supports the reliability of
  the identified candidate regions. (d) Density distribution plot: Density curves
  of FST and πHS/πWYB values showing the characteristic pattern of “a few genomic
  regions under strong selection.” (e) KEGG enrichment plot: Fifteen significantly
  enriched pathways of candidate genes. Bubble size represents the number of genes,
  and color indicates the GeneRatio'
