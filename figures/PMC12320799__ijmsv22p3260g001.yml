figure_title: The role of primary cilia in preeclamptic placental cells.
caption: The role of primary cilia in preeclamptic placental cells. Some angiogenic
  factors or inflammatory cytokines can bind to their corresponding receptors located
  on the primary cilia, blocking the signaling transduction served by primary cilia.
  The blocked signaling pathway further abnormally regulates the transcription and
  protein translation of genes for cell function regulation, such as cell proliferation,
  migration, tube formation, etc. Abnormalities in primary cilia have been proposed
  to promote the pathology of preeclampsia
