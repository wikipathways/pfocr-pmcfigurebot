figure_title: GLP-2 therapy promotes nutrient-absorptive epithelial lineages while
  suppressing immune-associated enterocyte subtypes
caption: '(A) Uniform manifold approximation and projection (UMAP) embedding of epithelial
  cells identified by EPCAM expression from the total cell population. Cells from
  all 4 patients across 3 time points (0 months [0M], 6M, and 12M) are included, with
  a total of 6,636 cells (5,112 from case 1, 244 from case 2, 936 from case 3, and
  344 from case 5). Cells are clustered into 7 groups, colored by metadata as indicated
  in the figure. (B) Expression patterns of key marker genes for each cluster. Each
  dot represents a gene, where color saturation indicates scaled expression levels,
  and dot size represents the percentage of cells expressing that gene. (C) UMAP embedding
  of epithelial cells across 3 time points: 0M, 6M, and 12M (505 cells at 0M, 2,076
  cells at 6M, and 4,055 cells at 12M). (D) Proportions of epithelial cell clusters
  at 0M, 6M, and 12M. (E) Heatmap of Z-score normalized gene expression for key intestinal
  mucosal pathways across clusters. Columns represent clusters (indicated by color
  and label), and rows represent genes categorized by pathway. To compare gene expression
  between clusters, the Wilcoxon rank-sum test was used'
