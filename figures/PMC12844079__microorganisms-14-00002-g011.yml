figure_title: ANCOM-BC analysis of differential metabolic pathways among oral sites.
caption: ANCOM-BC analysis of differential metabolic pathways among oral sites. Metabolic
  pathways predicted by PICRUSt2 were compared across saliva, plaque, and tongue coating
  using ANCOM-BC. Only pathways showing significant differences (q < 0.05) and with
  an absolute log2 fold change (|LFC|) ≥ 1.0 are displayed. Each bubble represents
  one pathway; red indicates enrichment and blue indicates depletion, and bubble size
  corresponds to the magnitude of the LFC
