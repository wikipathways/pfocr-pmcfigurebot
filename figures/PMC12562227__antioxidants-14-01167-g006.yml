figure_title: Proposed mechanism of pequi extract to decrease ROS production in diabetic
  human coronary artery endothelial cells (D-HCAECs) subjected to oxidative stress
  conditions.
caption: Proposed mechanism of pequi extract to decrease ROS production in diabetic
  human coronary artery endothelial cells (D-HCAECs) subjected to oxidative stress
  conditions. Oxidative stress, promoted by H2O2, hypoxia, or diabetes, stimulates
  the Nrf2 pathway, an effect that is enhanced when pequi extract is added to the
  media. Nrf2 uncouples from the Nrf2-Keap1 complex, translocates to the nucleus,
  binds to ARE, and promotes the transcription of mRNA for antioxidant enzymes, thereby
  decreasing ROS levels. Nrf2—nuclear factor (erythroid-derived 2)-like 2; ARE—antioxidant
  response element; ROS—reactive oxygen species; HO-1—phase II detoxifying enzyme
  heme-oxygenase-1; SOD—superoxide dismutase; GPx—glutathione peroxidase
