figure_title: Myostatin expression is seen in patients with heart failure, but there
  is conflicting data on whether sarcopenia is a promoting or inhibiting factor on
  myostatin expression.
caption: 'Myostatin expression is seen in patients with heart failure, but there is
  conflicting data on whether sarcopenia is a promoting or inhibiting factor on myostatin
  expression. FSTL1 is a known myostatin inhibitor. In ischemic conditions, myostatin
  may act in opposition to IGF-1 and prevent cardiac muscle hypertrophy and therefore
  prevent heart failure worsening. However, if overexpressed, acting through Smad2/3
  and TAK-1-MKK3/6-p38 pathways it promotes fibroblast activation and differentiation
  leading to fibrosis, which in turn worsens heart failure; ?: unknown relation'
