figure_title: Activation of the intrinsic apoptosis pathway by CPT.
caption: Activation of the intrinsic apoptosis pathway by CPT. The stabilization of
  the DNA–Topoisomerase I complex by CPT causes double-strand breaks during replication,
  which activates the p53-mediated DNA damage response. Activation of p53 regulates
  the expression of proapoptotic proteins of the Bcl-2 family, promoting mitochondrial
  permeabilization and the release of cytochrome c. This associates with Apaf-1 and
  procaspase-9 to form the apoptosome, which triggers the activation of effector caspases
  and ultimately leads to cell apoptosis
