figure_title: Semaglutide Downregulates Extracellular Matrix and TGFβ1 Signalling
  in Fibroblasts
caption: (A) Unsupervised re-clustering of fibroblasts within the integrated dataset.
  Representative markers of each subcluster are labeled. (B) Extracellular matrix
  (ECM) related genes in semaglutide-treated HFpEF fibroblasts compared to untreated
  HFpEF controls. Aggregate expression in fibroblasts from each sample is mapped and
  scaled per gene. Differentially expressed genes were derived from the intersection
  of genes significantly changed in a DESeq2 pseudobulk differential gene expression
  test and a Wilcoxon rank sum single-cell differential gene expression test. (C)
  Literature derived signalling pathway of TGFβ1, mapped with changes in fibroblast
  genes after semaglutide treatment. Nodes are colored by log2fold expression in fibroblasts
  from HFpEF hearts after semaglutide as compared to HFpEF control
