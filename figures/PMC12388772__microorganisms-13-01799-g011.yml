figure_title: Mechanisms of interaction between HMs and microorganisms.
caption: 'Mechanisms of interaction between HMs and microorganisms. Microorganisms
  engage with HMs through five primary pathways that facilitate their transformation,
  immobilization, or accumulation: biosorption (binding of metals to cell surface
  components), bioaccumulation (active transport and intracellular storage), biomineralization
  (conversion into mineral compounds such as sulfides or carbonates), biotransformation
  (modification of oxidation states, such as reduction to less toxic forms), and microbially
  mediated chemo adsorption (formation of complexes with phosphates, leading to immobilization)'
