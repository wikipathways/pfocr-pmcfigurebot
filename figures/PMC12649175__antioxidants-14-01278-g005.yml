figure_title: 'Targeting the redox–mitochondria–autophagy–inflammation axis: novel
  strategies for the treatment of CVDs.'
caption: 'Targeting the redox–mitochondria–autophagy–inflammation axis: novel strategies
  for the treatment of CVDs. Activating or inhibiting redox-mediated signaling pathways
  provides a unique opportunity to develop novel therapeutic targets for the prevention
  and treatment of various CVDs. MitoQ and CoQ10 neutralize ROS such as superoxide
  (O2•−) and the hydroxyl radical (•OH) to prevent pathological redox signaling. Small
  molecules such as micheliolide, bardoxolone methyl and dimethyl fumarate (DMF) bolster
  Nrf2 levels to drive Nrf2-mediated responses that include upregulated antioxidant
  defenses (superoxide dismutase (SOD), glutathione peroxide (GPx), thioredoxin (Trx)
  and heme-oxygenase-1 (HO1)). Additionally, metformin, berberine and melatonin stimulate
  autophagy via activation of AMPK, ULK1, HIF-1α and LC3 to lessen inflammatory responses.
  SS-31 inhibits mitochondrial ROS production, thereby improving mitochondrial biogenesis,
  whilst Mdivi-1 blocks both inflammation and mitochondrial dysfunction. These are
  some of the newer strategies to lessen oxidative stress and inflammation in the
  quest for more targeted approaches to lessen CVD. Created in BioRender. Pervin,
  M.; de Haan, J.B. (2025) https://BioRender.com'
