caption: Graphic abstract. Following spinal cord injury (SCI), activated microglia
  in the lesioned area release abundant extracellular vesicles (EVs) containing miR-152-3p.
  These microglia-derived EVs systemically transport miR-152-3p to hippocampal neural
  stem cells (NSCs), which subsequently disrupt hippocampal neurogenesis and cognitive
  function through targeting the WNT10b/β-catenin signaling axis. Mechanistically,
  the miR-152-3p/WNT10b/β-catenin regulatory circuit constitutes a key pathological
  mediator in SCI-induced cognitive impairment. Importantly, pharmacological activation
  of the WNT pathway in hippocampal NSCs post-SCI effectively rescues neurogenesis
  deficits and improves cognitive behavioral outcomes in murine models. This study
  elucidates a novel pathological pathway linking remote spinal cord lesions to hippocampal
  dysfunction, revealing potential therapeutic targets for SCI-related cognitive deficits
article_title: Extracellular vesicle-mediated spinal cord-brain crosstalk induces
  hippocampal neurogenesis impairment and cognitive deficits post-spinal cord injury
