figure_title: Sex-specific change in transcription factor (TF) out-degree with age
  in normal thyroid.
caption: Sex-specific change in transcription factor (TF) out-degree with age in normal
  thyroid. (A-C) The plot shows TF out-degree (sum of all outgoing edge weights from
  the TF to the aging-related genes) of (A) estrogen receptor 1 (ESR1), (B) estrogen
  receptor 2 (ESR2) and (C) androgen receptor (AR). The x-axis shows age, and the
  y-axis shows targeting score or the TF out-degree. The grey shaded region around
  each curve is the pointwise 95% confidence band. (D-E) Subnetwork of the most significant
  aging-associated edges connected to ESR1, ESR2 and AR in (D) females and (E) males.
  Edges marked red and blue significantly (p-value < 0.05) increase and decrease in
  weight with age, respectively. Edges that do not change significantly with age are
  marked grey. TFs are represented by white triangles and genes are represented by
  colored squares. Gene nodes are marked by their pathway membership in the KEGG database
