figure_title: HIV-1 Env-mediated cell-to-cell fusion-initiated apoptosis in uninfected
  CD4+ T cells.
caption: 'HIV-1 Env-mediated cell-to-cell fusion-initiated apoptosis in uninfected
  CD4+ T cells. HIV-infected T cells expressing Env gp120/gp41 engage uninfected CD4+
  T cells through three sequential steps: (1) Env binding to CD4, (2) co-receptor
  (CXCR4/CCR5) engagement and viral synapse formation, and (3) membrane fusion (A).
  This fusion event generates two downstream pathways: (B) mitochondrial apoptosis
  characterized by BAX activation, BCL-2 suppression, cytochrome c release, and caspase-3/7
  activation, and (C) syncytial instability in fused cells that finally progress to
  apoptotic death. Both pathways culminate in extensive uninfected CD4+ T-cell apoptosis.
  BCL-2, B-cell lymphoma 2; BAX, Bcl-2-associated X; Cyt c, Cytochrome c'
