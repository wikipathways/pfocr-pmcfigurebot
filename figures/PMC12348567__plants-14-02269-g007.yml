figure_title: Analysis of metabolic pathways associated with root pruning and photosynthesis.
caption: Analysis of metabolic pathways associated with root pruning and photosynthesis.
  (A) Analysis of DEGs associated with the photosynthetic pathway. The data presented
  in the heatmap is the average of three biological replicates. Enzyme reactions associated
  with gene expression involving each step are presented on the corresponding arrows
  containing cytochrome c6 and Pet J. The gene expression involved in this process
  was Pet J (Vadar_g7406). (B) Analysis of DEGs associated with carbon metabolism
  and tricarboxylic acid cycle pathways. The data presented in the heatmap are the
  average of three biological replicates. Enzyme reactions associated with gene expression
  involving each step are presented on the corresponding arrows, containing aldose
  1-epimerase (GALM), dihydrolipoyl dehydrogenase (DLD), and malate dehydrogenase
  (MDH2). The genes involved were GALM (Vadar_g20155 and Vadar_g20154), DLD (Vadar_g11578),
  and MDH2 (Vadar_g46714). CK, non-root pruning; CT, root pruning
