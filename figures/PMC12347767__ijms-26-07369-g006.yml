figure_title: Comparative pathway analysis of proteomic responses to combination vs.
caption: 'Comparative pathway analysis of proteomic responses to combination vs. monotherapies
  in HKB-11 cells. Ingenuity Pathway Analysis (IPA) was used to compare significant
  proteomic changes in HKB-11 lymphoma cells treated with a combination of nisin (N)
  and urolithin B (UB) (7:3 ratio; 5750 µM) versus monotherapies (N: 5600 µM; UB:
  150 µM). Three categories of enrichment are shown: (A) Canonical pathways were selected
  based on Benjamini–Hochberg (BH)-corrected p values ≤ 0.001 and an absolute activation
  Z-score ≥ 2. (B) Upstream regulators (genes/proteins) were inferred using the same
  statistical threshold (p ≤ 0.001) and an absolute Z-score ≥ 3. (C) Enriched diseases
  and biological functions were filtered by p ≤ 0.001 and an absolute Z-score ≥ 2.
  The colour intensity represents the activation Z-score of predicted activation (orange)
  or inhibition (blue), while dotted entries indicate terms with low predicted activation/inhibition
  (|Z| ≤ 1)'
