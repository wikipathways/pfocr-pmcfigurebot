figure_title: Overview of inflammation-induced muscle atrophy in LGMDR1.
caption: Overview of inflammation-induced muscle atrophy in LGMDR1. Inflammation may
  play an essential role in driving muscle atrophy in LGMDR1 patients. The current
  study showed a significant increase in the expression of pro-inflammatory cytokines—TNF-α,
  IL-1β, and IL-6 in muscle biopsies of LGMDR1 patients, as measured by qRT-PCR. Among
  these, only TNF-α expression was significantly increased in muscle tissue (qRT-PCR)
  and serum samples (by ELISA) of these patients, compared to controls. However, IL-1β
  level was not statistically significant in these patients. Additionally, IL-6 level
  was not significantly detectable in serum samples of these patients. This may be
  because of a lack of correlation between mRNA and protein abundance due to post-transcriptional
  regulation. Thus, the data suggest that TNF-α is a muscle-wasting factor in LGMDR1
  patients. Blue indicates the NFκB pathway, pink indicates the AKT/FOXO signaling
  pathway, “P” denotes phosphorylation, and “p-” indicates the phosphorylated form
  of the indicated protein
