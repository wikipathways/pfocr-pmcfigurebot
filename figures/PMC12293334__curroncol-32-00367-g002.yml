figure_title: Key targets and modulators in the DDR pathway that regulate resistance
  to radio- and chemotherapy.
caption: 'Key targets and modulators in the DDR pathway that regulate resistance to
  radio- and chemotherapy. NSCLC primarily utilizes three DNA repair pathways: Homologous
  recombination, non-homologous end joining, and nucleotide excision repair. Each
  pathway is categorized into three functional components: sensors (damage recognition),
  transducers (signal amplification/kinase activation), and effectors (repair execution).
  P53 and P21 interact to regulate cell cycle progression and apoptosis. Key regulatory
  factors and their functions are mapped to their respective components. Red indicates
  radiotherapy-associated regulators, while blue represents chemotherapy-associated
  regulators. These factors target core DDR components, influencing NSCLC resistance
  to radiotherapy and chemotherapy'
