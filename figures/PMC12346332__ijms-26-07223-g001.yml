caption: Illustrates the cholinergic anti-inflammatory pathway, in which afferent
  signals from inflammatory cytokines, such as TNF-α and IL-1, activate the vagus
  nerve. This activation is processed through the nucleus tractus solitarius (NTS)
  and dorsal motor nucleus (DMN) in the brainstem. The efferent vagus nerve subsequently
  releases acetylcholine, which binds to nicotinic receptors on macrophages, inhibiting
  cytokine production. By suppressing neuroinflammatory pathways, this mechanism has
  the potential to attenuate ICP elevation caused by cytokine-mediated disruption
  of the blood–brain barrier and glymphatic dysfunction
