caption: 'Cluster 3 and 6 pathway and molecular process assignments and linked gene
  network analysis: (A) circos plot showing significant genes in Cluster 3 as per
  Bonferroni-adjusted p values and pathway assignment visualization; (B) circos plot
  showing biological processes assignments in Cluster 3; (C) gene network containing
  genes overlapping between chromatin condensation and remodeling biological processes;
  (D) gene network containing overlapping genes in response to stress, defense, and
  immune response processes. Connectors indicate interactions based on activation,
  binding, catalysis, inhibition and reaction. Pink nodes indicate genes with increased
  FC, and blue nodes indicate decreased FC in relation to average expression; (E)
  circos plot showing Cluster 6 pathway assignments for significant genes; (F) circos
  plot showing Cluster 6 biological processes; (G) Clusters 3 and 6 directional intersect,
  indicating a dominant Cluster 3 pattern; and (H) Clusters 3 and 6 distributions
  unique to U1 latent cells stimulated by DA'
