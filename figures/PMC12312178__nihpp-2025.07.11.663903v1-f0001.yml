figure_title: Activation of CDK4/6 and mTORC1 pathways in trcc
caption: (A) Schematic depicting activation CDK4/6 and mTORC1 signaling linked to
  the driver TFE3 fusion in tRCC.(B) Gene set enrichment analysis (GSEA) for tRCC
  versus adjacent normal kidney samples in Sun et al., 2021 (14), highlighting the
  top 30 enriched pathways (n= 63 tRCC, n= 14 normal)(C) GSEA enrichment plot for
  E2F targets (top) and mTORC1 signaling (bottom) from analysis in (B) from Sun et
  al., 2021 (14).(D) Heatmap depicting gene expression for CDK4, CDK6, and D-type
  Cyclins in tRCC versus normal samples. Data obtained from Sun et al., 2021, Qu et
  al., 2022, (n= 88 tRCC, n= 30 normal) (13,14).(E) Kaplan Meier survival plot for
  tRCC patients from Qu et al., 2022 (13), stratified based on median-dichotomized
  E2F signature score, p value by log-rank test (top); forest plot for hazard ratio
  for overall survival with multivariable Cox model using E2F pathway score and early
  or advanced disease stage (bottom).(F) IGV tracks for TFE3 fusion ChIP-seq peaks
  from Li et al., 2025 (35) at the CDK4, CDK6, CCND1 and RHEB loci across three tRCC
  cell lines
article_title: Dual Inhibition of CDK4/6 and mTORC1 Establishes a Preclinical Strategy
