figure_title: CES1 enhances TG synthesis through a PPARγ pathway.
caption: CES1 enhances TG synthesis through a PPARγ pathway. pNeo and CES1 cells were
  incubated with 0.4 mM [3H]OA complexed with 0.5% BSA for 12 h ± PPARγ antagonist
  GW9662 and incorporation of OA into TG was determined following lipid extraction
  and TLC using Bioscan radio-TLC Imaging Scanner. Cells incubated with non-labeled
  OA ± GW9662 were used for mRNA isolation and for protein analysis. Results are presented
  as the ratio of expression of a given gene to cyclophilin with the expression in
  pNeo cells set at a value of 1. Protein expression was determined by immunoblotting.
  Data are means ± SEM of three independent experiments performed in triplicate. ns,
  not significant, * p < 0.05, ** p < 0.01, *** p < 0.001 and **** p < 0.0001. (A)
  TG synthesis from [3H]OA in the presence or absence of PPARγ antagonist GW9662.
  (B) mRNA expression of Dgat1, Dgat2, Acsl1 and Plin2 in pNeo and CES1 cells ± treatment
  with PPARγ antagonist GW9662. (C) Immunoblot analysis of PLIN2 and ACSL1 in pNeo
  and CES1 cells ± treatment with PPARγ antagonist GW9662. GAPDH immunoblotting was
  used as a loading control
