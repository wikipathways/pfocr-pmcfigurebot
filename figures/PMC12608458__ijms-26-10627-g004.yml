figure_title: EV miRNA expression and target gene networks in inner ear organoid differentiation.
caption: EV miRNA expression and target gene networks in inner ear organoid differentiation.
  (A) Heatmap showing 35 differentially expressed miRNAs in extracellular vesicles
  isolated from differentiation-stage organoids (case) compared to proliferation-stage
  organoids (control). (B) Heatmap displaying the number of significant pathways in
  five major categories (morphogenesis, differentiation, axon/projection guidance,
  neurogenesis, and development) regulated by 21 differentially expressed EV miRNAs.
  Pink and blue colors indicate up and downregulation in the case group, respectively.
  (C) Protein–protein interaction network of target genes regulated by differentially
  expressed EV miRNAs. The network is centered around TP53 (highest connectivity degree
  ~480) and shows key interaction partners including EZH2, ZBTB4, and other regulatory
  proteins, with node colors indicating log2 fold-change. (D) Dot plot showing enriched
  biological processes (GO terms) in the protein interaction network, including cell
  population proliferation, stem cell differentiation, and Wnt receptor catabolic
  process. Dot size represents gene count and color intensity indicates FDR significance.
  (E) Box plots showing expression levels of 18 differentially expressed genes between
  early differentiation (ED) and late differentiation (LD) stages from bulk gene expression
  datasets, including downregulated genes (Trp53 and Ezh2) and upregulated genes (Zbtb4,
  Sox4, and Ctnnb1). Significance levels are indicated by asterisks (* p < 0.05, **
  p < 0.01, *** p < 0.001, and **** p < 0.0001)
