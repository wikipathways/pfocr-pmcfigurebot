figure_title: Pathway-level responses to BPGM silencing and HDAC inhibition in A498
  ccRCC cells.
caption: 'Pathway-level responses to BPGM silencing and HDAC inhibition in A498 ccRCC
  cells. (a,b) Gene set enrichment analyses (GSEA) showing significantly regulated
  pathways following siRNA-mediated BPGM knockdown in A498 cells, based on the Hallmark
  (a) and WikiPathways (b) gene sets (n = 6 biological replicates per condition).
  (c,d) Gene set enrichment analyses showing significantly regulated pathways following
  Vorinostat treatment (4 µM, 48 h) in A498 cells, based on the Hallmark (c) and WikiPathways
  (d) gene sets (n = 6 biological replicates per condition). Pathways were plotted
  according to their normalized enrichment score (NES), indicating the direction and
  magnitude of regulation (NES > 0: positive enrichment; NES < 0: negative enrichment).
  Dot size reflects the number of genes contributing to each pathway, and color indicates
  adjusted p-values derived from GSEA using DESeq2-ranked gene lists. Only significantly
  enriched pathways are shown. Control conditions represent cells transfected with
  non-targeting siRNA and treated with the vehicle (DMSO). Vorinostat-treated cells
  were transfected with non-targeting siRNA to maintain identical transfection conditions
  across experimental groups'
