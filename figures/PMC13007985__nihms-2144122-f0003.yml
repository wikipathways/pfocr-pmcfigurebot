figure_title: UVB-exposed C/EBPβ deficient keratinocytes display an enriched type
  I interferon response
caption: A) Wild type and C/EBPβ −/− primary keratinocytes were treated with 10 mJ/cm2
  UVB. 8 hours post-UVB total RNA was isolated and subjected to RNA sequencing. Gene
  set enrichment analysis with statistically significant (adj. p-value < 0.05) positively
  enriched pathways is shown. B) TaqMAN Real-Time PCR analysis for various ISGs. Data
  are expressed as the mean normalized to Gapdh ±SD n=3. C) BALB/MK2 keratinocytes
  were transfected with control, IFNAR1, or C/EBPβ targeting siRNA. 48 hours post-transfection
  cells were treated with 10 mJ/cm2 UVB. 16 hours post-UVB cells were stained with
  Annexin V and PI and subjected to flow cytometric analysis. Plotted data are mean
  percentage of cells staining Annexin V+/PI−, ±SD n=3. Knockdown was confirmed by
  TaqMAN Real-Time PCR. D) Wild type and C/EBPβ −/− primary keratinocytes were pre-treated
  with 25 μM BMS986165 for 1 hour, then treated with 10 mJ/cm2 UVB. 8 hours post-UVB
  cells were collected and TaqMAN Real-Time PCR analysis for Xaf1 and Isg15 was conducted.
  Data are expressed as the mean normalized to Gapdh ±SD n=3. E) Wild type and C/EBPβ
  −/− primary keratinocytes were pre-treated with 25 μM BMS986165 for 1 hour prior
  to exposure to 10 mJ/cm2 UVB. 16 hours post-UVB cells were stained with Annexin
  V and PI and subjected to flow cytometric analysis. Plotted data are mean percentage
  of cells staining Annexin V+/PI−, ±SD n=3. Statistical analysis was done using student
  t-test for paired data with the significance level set to p < 0.05. * denotes p-value
  < 0.05, ** denotes pvalue < 0.01
