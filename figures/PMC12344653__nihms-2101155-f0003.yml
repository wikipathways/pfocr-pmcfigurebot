figure_title: Reconstruction of the biosynthetic pathway for glycosaminoglycans (GAGs)
  using GlycoMaple.
caption: Reconstruction of the biosynthetic pathway for glycosaminoglycans (GAGs)
  using GlycoMaple. (A) Analysis of GAG content in recombinant decorin, biglycan,
  and fibromodulin. Purified proteins were untreated or treated with 0.5 U/mL of chondroitinase
  ABC or 7 U/mL of heparanase III for 2 h at 37 °C. (B) GAG biosynthetic pathway in
  suspension-adapted HEK293-F. Reaction arrows are scaled and color-coded based on
  the normalized gene expression (transcripts per million; TPM) of the governing enzymes
  analyzed by RNA-Seq If several enzymes have overlapping function in a reaction,
  the maximum TPM value among the values of overlapped genes was used. When several
  gene products make a complex for a reaction, the minimum TPM value of the subunit
  genes was used. GAG structures are drawn using the standard symbol nomenclature
  for glycans (SNFG). (C) Analysis of pathways for additional modification of chondroitin
  sulfate and dermatin sulfate in 293-F
