figure_title: Endocannabinoid system-Extracellular vesicles interface.
caption: Endocannabinoid system-Extracellular vesicles interface. Endocannabinoid
  signaling is mediated by stimuli in the postsynaptic neuron. The two major endocannabinoid
  compounds—Anandamide (AEA) and 2-acyl-glycerol (2-AG)—are synthesized by NAPE-PLD
  and DAGL, respectively. Classically, both AEA and 2-AG can interact with cannabinoid
  receptors in presynaptic neurons without the need to be packed in vesicles. However,
  recent studies have shown the presence of different endocannabinoids in extracellular
  vesicles released by neuronal cells, highlighting the endocannabinoid-extracellular
  vesicles interface as an important cellular communication pathway
