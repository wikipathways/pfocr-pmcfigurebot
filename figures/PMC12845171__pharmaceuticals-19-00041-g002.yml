figure_title: Resveratrol (RSV) prevents breast cancer cell metastasis by inhibiting
  epithelial–mesenchymal transition (EMT) mediated by the Wnt/β-catenin signaling
  pathway.
caption: Resveratrol (RSV) prevents breast cancer cell metastasis by inhibiting epithelial–mesenchymal
  transition (EMT) mediated by the Wnt/β-catenin signaling pathway. (A,B) Representative
  immunoblots (A) and quantification (B) of Snail and Vimentin expression in 4T1 cells
  treated with RSV for 48 h. (C,D) Representative immunoblots (C) and quantification
  (D) of nuclear or cytoplasmic β-catenin expression in 4T1 cells treated with RSV
  for 48 h, n = 4 independent experiments. (E–G) Representative immunoblots (E) and
  quantification (F,G) of β-catenin, Snail, and Vimentin expression in 4T1 cells treated
  with β-catenin knockdown for 48 h. (H,I) Representative images (H) and quantitative
  analysis (I) of migrating cells in purple treated with RSV for 20 h after 48 h of
  β-catenin knockdown or no knockdown in 4T1 cells (100× magnification). NC, negative
  control. Scale bar 100 μm. Data are presented as mean ± SD. Student’s t-test or
  one-way ANOVA, Tukey’s post hoc test, not significant (n.s.), * p < 0.05, ** p <
  0.01, *** p < 0.001, **** p < 0.0001, n = 3 independent experiments
