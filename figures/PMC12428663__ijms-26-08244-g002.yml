figure_title: 'BAIAP3 variants cause an anomalous primary cilium morphology and induce
  an aberrant activation of SHH pathway (A) Structural model of the wild-type BAI1-associated
  protein 3 (AlphaFold DB entry: O94812).'
caption: 'BAIAP3 variants cause an anomalous primary cilium morphology and induce
  an aberrant activation of SHH pathway (A) Structural model of the wild-type BAI1-associated
  protein 3 (AlphaFold DB entry: O94812). The protein backbone is shown in gray. Nitrogen
  and oxygen atoms relative to lateral chains of relevant amino acid residues are
  in blue and red, respectively. Location of residues Arg186 and His1033, within the
  N-terminal and C-terminal C2 domains, are shown. Salt-bridging between Arg186 and
  Glu137 is highlighted (black dashed line). (B) Confocal images showing the altered
  primary cilium morphology in patient-derived fibroblasts compared to control cells.
  Primary cilia are labeled with ARL13B (red), while basal bodies and nuclei are labeled
  with pericentrin (green) and DAPI (blue), respectively. Scale bar is 20 µm left
  and 2 µm right (zoomed images). (C) The scatterplot representing the cilium lengths
  measured in μm documents the occurrence of statistically significant longer cilia
  in patient-derived fibroblasts compared to control cells. Cells were analyzed for
  each line over three independent experiments (30 cells/line each) for a total of
  60 cells/line scored. p values were calculated by one-way ANOVA with Tukey’s correction
  for multiple testing. Graph bars show mean ± SEM. (D) Representative images of the
  cilium morphology observed in patient-derived and control cells. Scale bar is 2
  µm. (E) Graphed data indicating the fold change of target genes of the SHH pathway
  (GLI1 and SMO) in fibroblasts from the patient carrying biallelic BAIAP3 variants
  compared to control cells. Fibroblasts were serum starved for 48 h and treated with
  Smo agonist (SAG) 100 nM for 24 h. The pool of the controls is set as 1. GAPDH mRNA
  was used as endogenous control. Histograms show mean values ± SEM of two independent
  experiments, each performed in triplicate. The analysis of the expression was performed
  calculating the fold change using the 2−ΔΔCt formula and the results were statistically
  analyzed by PRISM7. p values were calculated by one-way ANOVA with Tukey’s correction
  for multiple testing. Graph bars show mean ± SEM. ns = not significant; *** = p
  < 0.001; * = p < 0.1'
