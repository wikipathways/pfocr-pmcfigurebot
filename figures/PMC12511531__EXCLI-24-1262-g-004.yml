figure_title: Modulation of neurotrophic factors by dietary polyphenols. Dietary polyphenols
  modulate the expression of BDNF in the brain, particularly in regions involved in
  learning and memory, such as the hippocampus. This regulation of BDNF contributes
  to the growth, maintenance, and survival of neurons and promotes neuroplasticity,
  which is crucial for cognitive function. The specific mechanisms through which polyphenols
  exert these effects depend on the class of polyphenol, with flavonoids, phenolic
  acids, and stilbenes activating different signaling pathways such as CREB, SIRT1,
  and ERK/PI3K. Furthermore, polyphenols' antioxidant and anti-inflammatory effects
  may also indirectly support BDNF expression, particularly in the context of neurodegenerative
  diseases
