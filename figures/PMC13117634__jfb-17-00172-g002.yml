caption: Schematic diagram of spinal cord injury and electrical stimulation-promoted
  regeneration. (A) Descending motor and ascending sensory signal transmission under
  normal conditions and pathway interruption after spinal cord injury. (B) Aligned
  axons in the normal spinal cord enable ascending and descending signal conduction,
  but following injury, axons are transected, and regeneration becomes disordered,
  failing to cross the lesion. Electrical stimulation effectively promotes axonal
  alignment and regeneration
