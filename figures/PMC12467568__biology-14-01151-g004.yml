figure_title: Focal adhesion signalling pathway in basal subtype with prognostic implications.
caption: Focal adhesion signalling pathway in basal subtype with prognostic implications.
  The focal adhesion signalling pathway also varies according to the WWOX/HIF1A ratio.
  Activation of oncogenic pathways such as PI3K-Akt, MAPK, Ras, and ErbB promotes
  cell survival and proliferation, exacerbating tumour progression. Poor prognosis
  tumours display elevated expression of genes involved in glycolysis, mesenchymal
  transition, and immune evasion. Yellow denotes good prognosis, pink denotes poor
  prognosis, and green indicates genes with unchanged expression
