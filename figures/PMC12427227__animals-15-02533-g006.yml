caption: KEGG pathway enrichment analysis of WCC–specific and RWFC–specific DEGs following
  E. tenella infection. (A–C) Illustrates the significantly enriched pathways for
  WCC–specific DEGs at 2 dpi (A), 4 dpi (B), and 7 dpi (C). (D–F) Depicts the significantly
  enriched pathways for RWFC–specific DEGs at 2 dpi (D), 4 dpi (E), and 7 dpi (F).
  At each time point, pathways common to both breeds are marked with red arrows. In
  the pathway diagrams, red represents metabolism-related pathways, green represents
  environmental information processing-related pathways, blue represents cellular
  processes-related pathways, and orange represents organismal systems-related pathways.
  The specific DEGs analyzed in this study were derived from comparisons between the
  WCC−T group and the RWFC−T group
