figure_title: L-lactate regulates astroglial glutamate uptake and glycolysis through
  the L-lactate-sensitive receptor (LLR)-cyclic adenosine monophosphate (cAMP)/protein
  kinase A (PKA) pathway.
caption: L-lactate regulates astroglial glutamate uptake and glycolysis through the
  L-lactate-sensitive receptor (LLR)-cyclic adenosine monophosphate (cAMP)/protein
  kinase A (PKA) pathway. (A) Astroglial L-lactate is transported into the intercellular
  space via monocarboxylate transporters (MCTs). L-lactate triggers LLR, which couples
  Gs-proteins and activates the adenylate cyclase (AC)/cAMP/PKA pathway. This signaling
  ① promotes glycogen degradation, ② glycolysis, and increased L-lactate production.
  Importantly, L-lactate regulates ③ glutamate uptake of astrocytes and ④ neuronal
  glutamate transmission by mediating the glutamine (Gln)-glutamate (Glu) cycle between
  astrocytes and neurons. (B) In cerebral ischemia, the regulation of L-lactate and
  its downstream LLR-cAMP/PKA signaling pathway is impeded, which aggravates neuronal
  glutamate excitotoxicity
