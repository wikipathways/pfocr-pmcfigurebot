figure_title: GSEA of high LGR4 expression in non-small cell lung cancer datasets.
caption: GSEA of high LGR4 expression in non-small cell lung cancer datasets. (A)
  KEGG non-small cell lung cancer pathway was significantly enriched in the high LGR4
  expression group, indicating high LGR4 expression was associated with overall upregulation
  of genes in the KEGG non-small cell lung cancer pathway compared with low LGR4 expression.
  (B) The Wnt signaling pathway was significantly enriched in the LGR4 high-expression
  group. (C) The PI3K/AKT/mTOR signaling pathway showed significant positive enrichment
  in the LGR4 high-expression group. (D) The TGF-β signaling pathway was enriched
  in high LGR4-expressing NSCLC samples. LGR4, Leucine-rich repeat-containing G-protein
  coupled receptor 4; GSEA, Gene Set Enrichment Analysis; KEGG, Kyoto Encylopedia
  of Genes and Genomes; NES, Normalized Enrichment Score; FDR, False Discovery Rate
