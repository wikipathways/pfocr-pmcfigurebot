figure_title: Neuroendocrine pathways linking peripheral signals of energy balance
  (leptin and ghrelin) to hypothalamic regulation of appetite and food intake in obesity.
caption: 'Neuroendocrine pathways linking peripheral signals of energy balance (leptin
  and ghrelin) to hypothalamic regulation of appetite and food intake in obesity.
  The green arrow represents the action of leptin on anorexigenic and orexigenic neuropeptide
  expression. The red arrow represents the action of ghrelin on these pathways. The
  orange arrow indicates central leptin resistance, reducing activation of the anorexigenic
  pathway. A solid line indicates stimulation (+), whereas a dashed line indicates
  inhibition (−). CART: cocaine- and amphetamine-regulated transcript; POMC: pro-opiomelanocortin;
  α-MSH: alpha-melanocyte-stimulating hormone; MCH: melanin-concentrating hormone;
  NPY: neuropeptide Y; AgRP: agouti-related peptide. Adapted from: Dâmaso et al.,
  2024 [11]'
