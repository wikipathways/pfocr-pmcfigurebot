figure_title: Macrophage migration to the meningeal lymphatic vessel relies on the
  CCL2-CCR2 signaling pathway.
caption: 'Macrophage migration to the meningeal lymphatic vessel relies on the CCL2-CCR2
  signaling pathway. (A) Single-cell transcriptomic visualization (t-SNE) of Ccr2
  gene expression in macrophages. (B) Schematic of the indirect co-culture system
  modeling post-stroke. Conditioned medium from lymphatic endothelial cells subjected
  to oxygen-glucose deprivation/recovery (OGD/R) was collected and applied to macrophages
  to model the paracrine effects of meningeal lymphatic-derived factors following
  cerebral ischemia. (C) Representative Western blot images and corresponding quantitative
  analysis of CCR2 expression in macrophages. NC-CM group: n = 4, OGD/R-CM group,
  n = 4. NC-CM: Conditioned medium of lymphatic endothelial cell from normal oxygen,
  OGD/R-CM: Conditioned medium of lymphatic endothelial cell from the oxygen-glucose
  deprivation/recovery. (D) Representative images of macrophage scratch analysis and
  quantitation of wound closure in NC-CM (Conditioned medium of lymphatic endothelial
  cell from normal oxygen), OGD/R-CM (Conditioned medium of lymphatic endothelial
  cell from the oxygen-glucose deprivation/recovery), CCR2 antagonist, OGD/R-CM +
  CCR2 antagonist. NC-CM group: n = 4, OGD/R-CM group, n = 4; CCR2 antagonist group:
  n = 4; OGD/R-CM+ CCR2 antagonist group n = 4. Scale bar = 50 μm, magnification,
  ×20. Data in (C) were presented as mean ± SEM and an unpaired t test was performed
  to calculate significance between two groups. Data in (D) are presented as mean
  ± SEM and ordinary one-way ANOVA was performed to calculate significance between
  four groups. * p < 0.05, ** p < 0.01, *** p < 0.0001'
