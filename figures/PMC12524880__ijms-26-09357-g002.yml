figure_title: Dynamic gene expression pattern in node I during the reproductive growth
  stage.
caption: Dynamic gene expression pattern in node I during the reproductive growth
  stage. (a) Principal component analysis (PCA) of gene expression profiles in node
  I at seven reproductive growth stages. Each data point represented an independent
  biological replicate. (b) Short Time-series Expression Miner (STEM) analysis of
  genes in node I at seven reproductive growth stages. Five significant profiles with
  color background are shown. p-values were represented below each profile, and gene
  numbers in each profile are shown on the top. The tree map on the right side of
  each profile is GO enrichment analysis. The functional categories with false discovery
  rates ≤ 0.05% were summarized using REVIGO. The grey color indicates the significance
  of the GO terms, and the aggregate size indicates the gene numbers of the GO terms.
  (c) KEGG pathway enrichment analysis of genes in profile 4. The top 20 KEGG pathways
  with the lowest p-values are shown
