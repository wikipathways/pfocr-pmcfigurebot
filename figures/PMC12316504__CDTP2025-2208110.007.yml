figure_title: Effects of RIV on the expression levels of hub genes and MAPK pathway-related
  genes in SU-induced cardiomyocytes.
caption: Effects of RIV on the expression levels of hub genes and MAPK pathway-related
  genes in SU-induced cardiomyocytes. (a–h) After treating AC16 cells and primary
  cardiomyocytes with 6 μM SU and/or 10 μg/mL RIV for 24 h, the mRNA expression levels
  of (a) CASP3, (b) STAT3, (c) SRC, (d) ABCG2, (e) ABCB1, (f) MAPK1, (g) MAPK8, and
  (h) MAPK14 were detected by qPCR. (i, j) Protein expression levels of p-ERK1/2,
  p-JNK, and p-p38 were detected by Western blot. All of the experiments were performed
  in triplicate and repeated for at least three times. The dots in the graphs are
  representative of three independent biological experiments. ∗, ∗∗, and ∗∗∗ represent
  p < 0.05, p < 0.01, and p < 0.001, respectively
