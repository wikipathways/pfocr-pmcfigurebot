figure_title: Transcriptional profiling of ACSL4 and ACSL5 in an experimental murine
  model of MASH-HCC
caption: (A) Graphical representation of diet-induced MASH-HCC preclinical mouse model.
  Mice were fed a Western diet plus sugar water and injected weekly with CCl4 intraperitoneally
  for 24 weeks. (B) Gross images of livers highlighting the formation of dysplastic
  nodules (yellow circles) in the indicated experimental groups. Scale bar represents
  50mm. (C) Representative H&E staining of liver tissues for the indicated experimental
  groups (top, scale bars represent 100μm) and immunohistochemical staining of HCC
  marker HepPar-1 (bottom, scale bars represent 60μm). (D) UMAP plot of liver/tumor
  cell transcriptomes colored according to group (n= 2 mice/group). (E) UMAP plot
  of liver/tumor cell clusters colored according to their identified cell type. (F)
  Relative cell count normalized on total count of each cell cluster in the indicated
  experimental groups. A two-sample proportion test was used for statistical analysis.
  *p<0.05, **p<0.01, ***p<0.001, ****p<0.0001. (G) Top enriched cellular processes
  pathways in dysplastic cells compared to hepatocytes by KEGG pathway enrichment
  analysis. (H) Pathview figure illustrating individual gene expression changes within
  the ferroptosis pathway in dysplastic cells compared to hepatocytes. (I) Expression
  levels and percentage of cells within each cluster expressing the ACSL4 and ACSL5
  genes in the indicated experimental groups
