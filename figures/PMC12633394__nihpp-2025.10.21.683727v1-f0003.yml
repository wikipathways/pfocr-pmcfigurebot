figure_title: Arginine restriction impairs Burkitt de novo pyrimidine biosynthesis
caption: (A) Analysis of arginine restriction effects on the Burkitt B cell metabolome.
  Volcano plot of LC/MS metabolomic analysis of EB3 Burkitt cells cultured arginine
  free vs arginine-replete media for 5 days, from n=5 replicates. Higher foldchange
  values indicate higher levels in cells grown under arginine free conditions. Arginine
  cycle metabolites are highlighted in pink; pyrimidine and purine related metabolites
  are highlighted in blue. (B) KEGG metabolic pathway analysis of LC/MS data as in
  (A). Metabolites were selected by FDR < 0.05 and pathway impact values were computed
  by MetaboAnalyst 3.0 topological analysis. (C) Schematic of arginine cycle and de
  novo pyrimidine synthesis pathways. Shown at right are abundances of indicated metabolites
  in EB3 cells grown under arginine replete (100% Arg) versus Arginine free (0% Arg).
  (D) Rug plots of sgRNA levels targeting arginine metabolism genes from a human genome-wide
  CRISPR screen for host factors that maintain EBV latency in P3HR-1 cells (73). Shown
  are the Log2 transformed Foldchange abundances in gp350+ sorted P3HR-1 versus in
  the input library, where the magenta lines represent values for each of the four
  independent sgRNA targeting the specified gene. The overall distribution of human
  genomewide Brunello library sgRNAs are shown in gray in the background for reference,
  where most sgRNAs did not perturb EBV latency. Higher values indicate sgRNA enrichment
  in reactivated gp350+ cells versus in the input library as a whole. (E) CAD activity,
  as read out by the ratio of the CAD product carbamoyl-aspartate to the CAD precursor
  carbamoyl-phosphate in EB3 cells, as in (A). P-values were calculated by Student’s
  T-test. ****P < 0.0001. (F) Pyrimidine abundance from EB3 cells as in (A). (G) Abundance
  of pyrimidine metabolites from P3HR-1 cells cultured in 10% methionine vs 100% methionine
  media for 72 hours (74). (H) Rug plots highlighting foldchange abundances of the
  indicated de novo pyrimidine synthesis gene targeting sgRNAs in gp350+ cells shown
  in teal (four independent sgRNAs per gene) in a human genome-wide CRISPR screen
  for P3HR-1 factors that maintain EBV latency, as in (D)(73)
