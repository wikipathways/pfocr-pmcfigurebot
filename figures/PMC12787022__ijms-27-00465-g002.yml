figure_title: 'Tryptophan (Trp) metabolism through the kynurenine (KYN) pathway: balancing
  neuroprotection and neurotoxicity in depression.'
caption: 'Tryptophan (Trp) metabolism through the kynurenine (KYN) pathway: balancing
  neuroprotection and neurotoxicity in depression. This figure illustrates how immune-mediated
  activation of the KYN pathway disrupts Trp metabolism, linking inflammation with
  depression-related neuropathology. The stress hormone cortisol stimulates tryptophan
  2,3-dioxygenase (TDO). Pro-inflammatory cytokines [interferon (IFN)-alpha (α), IFN-beta
  (β), IFN-gamma (γ), tumor necrosis factor alpha (TNF-α)] and lipopolysaccharide
  (LPS) induce indoleamine 2,3-dioxygenases (IDOs), diverting Trp away from serotonin
  (5-HT) synthesis toward KYN production. In contrast, anti-inflammatory cytokines
  [interleukin (IL)-4, IL-10] and superoxide dismutase (SOD) counteract this process.
  Oxygen molecule (O2), IFN-β, IFN-γ, and TNF-α stimulate and IL-4, IL-10, and SOD
  suppress kynurenine 3-monooxygenase (KMO). Furthermore, IDOs, TDO, and KMO activities
  are influenced by positive and negative feedback loops. Peripheral KYN crosses the
  blood–brain barrier, where it undergoes two competing fates: (i) conversion into
  kynurenic acid (KYNA), a putative neuroprotective N-Methyl-D-Aspartate (NMDA) receptor
  antagonist with putative antioxidant properties, or (ii) metabolism into 3-hydroxykynurenine
  (3-HK) and quinolinic acid (QA), which promotes reactive oxygen species (ROS), NMDA
  receptor overstimulation, mitochondrial dysfunction, and neuronal apoptosis, ultimately
  leading to neurodegeneration. The dashed inhibitory arrow indicates that enhanced
  KYN metabolism reduces 5-HT and melatonin synthesis, impairing neurotransmission
  and neuroprotection. The balance between KYNA and QA determines whether the KYN
  pathway promotes resilience or vulnerability to depression. Abbreviations: ↑, Increase'
