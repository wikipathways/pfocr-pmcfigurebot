figure_title: The second wave of increase in pRSK was repressed by inhibition of PKA
  or TrkB, but not by inhibition of ERK.
caption: The second wave of increase in pRSK was repressed by inhibition of PKA or
  TrkB, but not by inhibition of ERK. A, Partial circuit diagram showing pathways
  targeted with inhibitors. B1, Representative confocal images of pRSK in SNs at 5
  h after Standard protocol of 5-HT, in the absence or presence of inhibitor U0126.
  B2, Summary data. U0126 did not reduce pRSK induced by 5-HT. C1, Representative
  confocal images of pRSK in SNs at 5 h after 5-HT, in the absence or presence of
  PKA inhibitor KT5720. C2, Summary data. KT5720 significantly decreased pRSK induced
  by 5-HT. D1, Representative confocal images of pRSK in SNs at 5 h after Standard
  protocol of 5-HT, in the absence or presence of TrkB inhibitor TrkB Fc. D2, Summary
  data. TrkB Fc significantly decreased pRSK induced by 5-HT. * p < 0.05
