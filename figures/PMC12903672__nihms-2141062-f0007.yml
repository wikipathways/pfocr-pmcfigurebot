figure_title: B cell lymphoma accelerates aging in young T cells and other tissues
caption: (A and B) Cdkn2a and Tnfa expression in aorta and kidney tissues (n = 3–5).(C
  and D) Cdkn2a expression in the aorta and kidney tissues of young control and PPMBC
  lymphoma-bearing Rag2−/− mice (n = 3–5).(E) Gene set enrichment analysis of the
  SenMayo pathways in young CD4+ T cells derived from lymphoma-bearing mice early
  vs. late following Eμ-Myc lymphoma transplant (GSE183693).(F) Relative gene expression
  of SenMayo pathway in CD4+ T cells from bulk RNA-seq data (GSE183693).(G) Cdkn2a
  and Grem2 gene expression in CD4+ T cells from RNA-seq data (GSE183693).(H) CDKN2A
  gene expression in human T cells from healthy PBMCs (young, aged) or from apheresis
  products of young or aged R/R LBCL patients (n = 4–5).(I–M) ATAC-seq tracks of the
  (I) Cdkn2a, (J) Serpine1, (K) Timp2, (L) Ifng, and (M) Tnfaip2 loci and the accessibility
  index for the highlighted regions.(N) TNFα production in mouse CD4+ and CD8+ T cells
  (n = 3–7).(O) TNFα production in human CD4+ T cells and CD8+ T cells (n = 5–6).(P
  and Q) NIAD4 staining in (P) CD4+ and CD8+ T cells (n = 5–8) or (Q) OT-II CD4+ T
  cells (n = 6).(R and S) ER Tracker in (R) CD4+ and CD8+ T cells (n = 5–8) or (S)
  OT-II CD4+ T cells (n = 6).YC, YL, AC, AL are defined in Figure 1. YL-E = young
  with lymphoma early (day 7); YL-L = young with lymphoma late (day 14). Data in (A–D),
  (G), (H), and (N–S) are mean ± SEM and each solid dot represents a biological replicate.
  Data in (A–D), (N), and (P–S) are compiled from at least 2 independent experiments.
  For (A–D), (G), (H), (N–S), statistical significance was determined by Student’s
  t test. *p < 0.05; **p < 0.01; ***p < 0.001; and ****p < 0.0001; n.s. = not significant.
  See also Figure S7
