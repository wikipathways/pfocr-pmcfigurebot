figure_title: IPA supplementation restores hepatic immune defense against bloodstream
  bacterial infection in Hamp1–/– mice
caption: '(A) Hepcidin deficiency downregulated metabolites involved in the tryptophan
  metabolism pathway. n = 4 per group. (B) Volcano plot showing the fold change and
  P value of gut microbiota–derived metabolites in portal blood from Hamp1–/– and
  WT mice. n = 4 per group. (C) Diagram of tryptophan metabolized by the gut microbiota
  to ILA, IA, and IPA. (D and E) Portal blood levels of ILA, IA, and IPA in Hamp1–/–
  and WT mice treated with either antibiotic cocktail (4Abx) or sterile water (control)
  (D) and in Hamp1–/– and WT mice that received fecal microbiota transplantation (E).
  n = 6 per group; data are presented as mean ± SEM. (F) Portal blood level of IPA
  in Hamp1–/– mice pretreated with IPA or sterile PBS. n = 5 per group; data are presented
  as mean ± SEM. (G) Representative intravital microscopy (IVM) images showing KCs
  (red) capturing circulating E. coli–GFP (yellow) in Hamp1–/– mice pretreated with
  IPA or sterile PBS. Scale bars: 20 μm. (H) Number of E. coli–GFP captured per KC.
  n = 6 per group; data are presented as mean ± SEM. (I–L) IVM images (I) combined
  with 3-dimensional reconstruction (J) to analyze KC volume (K) and surface area
  (L) in Hamp1–/– mice pretreated with IPA or sterile PBS. Scale bars: 20 μm. n =
  6 per group; data are presented as mean ± SEM. *P < 0.05, ****P < 0.0001, by 1-way
  ANOVA followed by Šidák’s multiple-comparison test (D and E) or 2-tailed Student’s
  t test (F–L). Data presented are from 2 (D and E) and 4 (G–L) independent experiments.
  Each symbol represents an individual mouse (D–H). Symbols represent individual KCs
  from 6 mice with 5 fields of view per mouse (K and L). Trp, tryptophan'
