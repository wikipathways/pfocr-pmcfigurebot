figure_title: Single cell RNA-Seq (scRNA-Seq) analyses reveal enrichment in interferon
  pathways and viral sensing pathways in mice vaccinated with mRNA
caption: (A) Experimental outline for gene expression analysis of immune cells (CD45+)
  from draining lymph nodes. C57BL/6 mice were immunized intramuscularly with each
  respective vaccine, and at 24 h post-immunization, draining lymph nodes were enriched
  for CD45+ cells using magnetic beads. (B) Venn diagram showing the overlap of significant
  differentially expressed genes (DEGs) among each vaccine group compared to naive
  controls. Significance was defined as FDR < 0.05 and absolute log2 fold change >
  0.5. (C) Bar plot depicting the proportions of annotated cell types in each vaccination
  group. (D) UMAP visualization of single-cell transcriptomes, with cells colored
  and labeled by cell identity. UMAPs are shown separately for each vaccination group.
  (E-G). Volcano plots displaying DEGs for Ad5 vs. naive, mRNA vs. naive, and protein
  vs. naive comparisons. Vertical lines indicate log2 fold change of 0.5; horizontal
  lines indicate FDR of 0.05. Genes upregulated in the vaccine group are shown in
  red, downregulated in blue, and non-significant genes in grey. (H) UMAP plots showing
  the expression of Ifit3 across each vaccination group and naive mice. (I–L) Dot
  plots of enriched pathways identified by GSEA in B cells (I), CD4 T cells (J), CD8
  T cells (K), and dendritic cells (L) for each vaccine group compared to naive. The
  y-axis lists pathway names, dot size represents −log10(adjusted p-value), and color
  corresponds to the normalized enrichment score (NES). A black ring denotes significant
  enrichment (FDR < 0.05); a grey ring indicates non-significance
article_title: Dosing and Serostatus Shape the Efficacy of Adenovirus, mRNA, and Protein
  Vaccines
