figure_title: Metabolome analysis in mock and PEDV-infected groups.
caption: 'Metabolome analysis in mock and PEDV-infected groups. (A) Partial least
  square analysis of sample distribution based on identified metabolites. Red: mock
  group, green: PEDV-infected group, blue: quality control samples. (B) Hierarchical
  clustering analysis of differential metabolites between the mock group and the PEDV
  group. The color scale represents the Z-score normalized abundance of metabolites,
  ranging from green (low) to red (high). (C) Volcano plot of differential metabolites
  between two groups. Red and blue points represent significantly up-regulated and
  down-regulated metabolites, respectively. (D) KEGG pathway enrichment analysis of
  differential metabolites'
