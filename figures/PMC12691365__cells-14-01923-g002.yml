caption: Schematic representation of the interplay between impaired mitophagy, oxidative
  stress, and AIM2 inflammasome activation; 1. mtROS and ox-mt DNA prime and activate
  AIM2 inflammasome and c-GAS/STING pathway simultaneously in the early activation
  stage (blue arrow); 2. INF-β activates the JAK-STAT pathway, increasing AIM2 transcriptional
  priming through ISGs and supplies pro-IL1-β (NfKB pathway); 3. JAK/STAT signaling
  pathway product (IL-6/IL-23–STAT3; IFNAR–STAT1/2) stabilizes the inflammatory cell
  state and maintains mitochondrial stress (via high metabolic/ROS set-point). These
  events appear in long term activation stage (brown arrow) (Created in 2025 BioRender.
