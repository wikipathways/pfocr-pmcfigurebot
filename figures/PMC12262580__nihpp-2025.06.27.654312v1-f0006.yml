figure_title: Aging disrupts cell–cell communication networks in the killifish kidney
caption: CellChat analysis was performed on single-nucleus RNA-seq data from kidneys
  of young and old killifish.(A) Circle plots visualize global intercellular communication
  networks in young (left) and old (right) kidneys. Each node represents a cell type,
  and each connecting line a significant interaction, with width proportional to communication
  strength. Cell types of interest are colored, non-renal cell types displayed in
  gray. The total number of interactions decreases from 83 in young to 30 in old kidneys.(B)
  Bar graph shows relative information flow of individual signaling pathways in young
  (yellow) and old (gray) renal cells, highlighting selective retention or loss of
  pathway activity with age.(C, E) Heatmaps show outgoing (left) and incoming (right)
  signaling patterns in young (C) and old (E) kidneys. Pathways are sorted by signaling
  in young kidneys. Aging reduces both the diversity and magnitude of signaling activities
  across cell types. (D, F) Sankey plots illustrate dominant outgoing signaling pathways
  in young (D) and old (F) renal cells, demonstrating diminished pathway complexity
  and redistribution of signaling roles with age
