figure_title: Cross-domain coupling among Daqu-associated pests, microorganisms, and
  flavor.
caption: Cross-domain coupling among Daqu-associated pests, microorganisms, and flavor.
  The central circle represents the continuous pest life cycle, indicating that all
  developmental stages may act as recurrent disturbance sources during Daqu production
  and storage. The upper-right sector shows insect–microbe–metabolite interactions,
  highlighting pests as both substrate consumers and potential vectors or modifiers
  of microbial communities. The lower-right sector indicates that such disturbances
  may alter flavor profiles and can be monitored by high-throughput sequencing and
  flavor analysis. The left sector represents the system-level feedback layer linking
  community dynamics, environmental factors, and the Daqu microecosystem model. Overall,
  the figure illustrates a directional pathway from pest persistence to microbial
  and metabolic perturbation, flavor variation, and mechanistic interpretation for
  process control
