figure_title: LRRC59 enhances colorectal cancer progression in mouse models.
caption: LRRC59 enhances colorectal cancer progression in mouse models. (A and B)
  Western blot analysis of LRRC59 expression in sh-NC and sh-LRRC59 LoVo cells. (C
  and D) Images of mice and tumors from sh-NC and sh-LRRC59 groups. (E and G) Tumor
  volumes measured every 3 days; final tumor weights recorded after 34 days. (F) Body
  weight trends remained unchanged. (H and I) Immunohistochemistry analysis of PERK
  pathway activation. Scale bar, 200 µm. *P<0.05, **P<0.01 and ***P<0.001. ER, endoplasmic
  reticulum; PERK, protein kinase RNA-like ER kinase; sh-, short hairpin; NC, negative
  control; p-, phosphorylated; ns, non-significant
