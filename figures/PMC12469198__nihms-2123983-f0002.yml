figure_title: Comparison of proportions of urinary metabolites between NIC and 6MN.
caption: 'Comparison of proportions of urinary metabolites between NIC and 6MN. A.
  Metabolite level; B. Pathway level. For panel A, the proportion of each metabolite
  was calculated by dividing its response by the total signal from all detected metabolites.
  In panel B, metabolite signals within the same metabolic pathway were summed to
  obtain pathway-level proportions. *: p < 0.05 by T-test between 6MN metabolite and
  its corresponding NIC metabolite'
