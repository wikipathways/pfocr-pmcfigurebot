figure_title: Permeation pathway density in an open CP-AMPAR ion channel
caption: A) CP-AMPAR (Q607) open ion channel (M2 and M3 helices) at 2.65 Å resolution.
  Cryo-EM map shows density within the pore (shown in cyan) at 4 important positions,
  labeled by varying colored boxes. B) Clear density is seen at the channel gate,
  at Thr617. C) Density is seen below channel gate at Ser614. C) Density is seen at
  the selectivity filter, corresponding to the Gln586 side chains (also referred to
  as Gln607). D) Density seen at Gln587 backbone (also referred to as Gln608)
