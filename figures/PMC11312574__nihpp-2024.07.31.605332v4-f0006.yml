figure_title: STZ-HFD IVD Invokes Unique Inflammatory Signaling Pathways in Networks
  of Cytokine Expression
caption: (A) The STZ-HFD model shows a distinct network structure, demonstrating the
  unique up-regulation of various inflammatory pathways (B) The STZ-HFD and db/db
  networks each rely on a number of unique (red/blue) and shared (purple) cytokines,
  indicating both leptin-dependent and leptin-independent inflammatory signaling cascades
  (C) The STZ-HFD mouse model displays a fragmented and modular cytokine network,
  indicating the parallel signaling of multiple signaling pathways
