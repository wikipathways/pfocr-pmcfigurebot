figure_title: BACH2 shapes tissue resident memory programs in CD4+ T cells in human
  gut
caption: (A) WNN UMAP plot of distinct cell subsets in human gut (n = 17,642 cells
  in PLWH and 22,422 cells in HIV− individuals). (B) Proportions of gut cell subsets
  in PLWH and HIV− individuals. (C) WNN UMAP plot of distinct CD4+ T cell subsets
  in human gut (n = 43,113 cells in PLWH and 6,092 cells in HIV− individuals), including
  CD4+ T cells from gut cell aliquots and CD3+ enriched aliquots. (D) Proportions
  of gut CD4+ T cell subsets PLWH and HIV− individuals. (E) Mean regulation scores
  (signed, −log10 scale) across domains of regulatory chromatin (DORC) per transcription
  factor (TF) for all significant TF-DORC interactions determined in PLWH (top) and
  HIV− individuals (bottom). Top TF activators (left) and top TF repressors (right)
  are highlighted. (F) WNN UMAP plot (top) and violin plots (bottom) of BACH2 motif
  accessibility in gut CD4+ T cells. (G) WNN UMAP plot (top) and violin plot (bottom)
  of per cell RNA module scores in gut CD4+ T cells. The module score was built on
  DORC genes that had upregulated gene expression in PLWH and were predicted to be
  activated by BACH2 (BACH2 regulation scores > 0). (H) Heatmap indicating differential
  transcription factors binding motifs accessibility between CD4-Trm-BACH2high, CD4-Trm-BACH2low,
  and Tem-Th1 cells. False discovery rate (FDR)-adjusted P < 0.05, average Z-score
  difference > 0.2. (I) Heatmap indicating differentially expressed genes between
  CD4-Trm-BACH2high, CD4-Trm-BACH2low, and Tem-Th1 cells. FDR-adjusted P < 0.05, min.pct.
  > 0.25, log2FC > 0.6. (J) Heatmap indicating differentially expressed surface proteins
  between CD4-Trm-BACH2high, CD4-Trm-BACH2low, and Tem-Th1 cells. FDR-adjusted P <
  0.05, min.pct. > 0.15, log2FC > 0.2. Significantly enriched negative regulation
  of immune effector process (K) and TCR calcium pathway (L) were identified using
  GSEA with leading-edge genes shown. * P < 0.05, ** P < 0.01, *** P < 0.001, Wilcoxon
  rank-sum test. See also Figure S1 – S2
