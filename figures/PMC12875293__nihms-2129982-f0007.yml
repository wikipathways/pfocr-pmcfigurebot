figure_title: Engineered drug delivery systems targeting the gut microbiota to enhance
  cancer therapy and reduce toxicity.
caption: Engineered drug delivery systems targeting the gut microbiota to enhance
  cancer therapy and reduce toxicity. These systems – including polymeric, inorganic,
  lipid-based biomaterials, and extracellular vesicles – improve the intestinal delivery
  and bioavailability of prebiotics, probiotics, and postbiotics. By overcoming physiological
  barriers, they modulate the intestinal immune system through activation of antigen-presenting
  cells, CD4+ and CD8+ T cells, and natural killer (NK) cells, thereby restoring microbial
  balance, enhancing immune checkpoint inhibitor efficacy, and minimizing treatment-related
  toxicities. Short-chain fatty acids (SCFAs) exert additional immunomodulatory effects
  within the tumor microenvironment (TME) by activating signal transducer and activator
  of transcription 3 (STAT3) and mammalian target of rapamycin (mTOR)–ribosomal S6
  kinase (S6K) pathways. They promote interleukin-10 (IL-10), IL-12, and IL-2 production
  in T cells, enhance cytotoxic responses via histone deacetylase (HDAC) inhibition,
  and downregulate immune evasion markers such as poliovirus receptor (PVR)/CD155
  through phosphoinositide 3-kinase (PI3K)/protein kinase B (AKT) inhibition. These
  effects involve regulators such as euchromatic histone-lysine N-methyltransferase
  2 (EHMT2), tumor necrosis factor-α-induced protein 1 (TNFAIP1), and protein arginine
  methyltransferase 1 (PRMT1), highlighting the potential of microbiome-targeted interventions
  in reshaping antitumor immunity. This figure was created with BioRender.com
article_title: Strategic modulation of the gastrointestinal microbiome to enhance
