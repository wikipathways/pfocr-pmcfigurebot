figure_title: Major proinsulin proteoforms and their specific signature peptides generated
  by Lys-C digestion.
caption: 'Major proinsulin proteoforms and their specific signature peptides generated
  by Lys-C digestion. (A) Proinsulin processing pathway. Intact proinsulin undergoes
  selective cleavage at the B–C or A–C junctions by various proteases, forming des-31,32
  or des-64,65 proinsulin. These forms are subsequently processed into mature insulin
  and C-peptide. PC1/3: Prohormone convertase 1/3; PC2: Prohormone convertase 2; CPE:
  Carboxypeptidase E. (B) Signature peptides (underlined) produced by Lys-C digestion,
  representing each proteoform and C-peptide'
