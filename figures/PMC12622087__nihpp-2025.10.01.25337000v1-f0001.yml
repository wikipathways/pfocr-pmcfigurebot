figure_title: BSS treatment results in profound short-term changes in gut microbiome
  composition
caption: a, Alpha diversity of fecal microbiome as measured by observed species at
  each time point. Statistically significant differences in observed species between
  timepoints are shown with p values adjusted for multiple comparisons from Dunn’s
  test. b, Principal Coordinates Analysis of fecal microbiome beta diversity depicting
  differences in microbial community composition at each timepoint, as measured by
  the Bray-Curtis dissimilarity metric. Ellipses are drawn around 95% percent of the
  samples for each timepoint. Statistically significant (p < 0.05) differences between
  timepoints are displayed from pairwise PERMANOVA. c, Differentially abundant species
  at day 2 compared to day 0. P values were adjusted for multiple comparisons with
  Benjamini-Hochberg procedure (BH). Dotted lines indicate significance threshold
  of 0.05 and fold change thresholds of 1 and −1. d, Top significant differentially
  abundant genera. P values were adjusted for multiple comparisons with BH and differences
  with effect size < −2.25 or > 2.25 are shown. e, Top differentially abundant functional
  pathways in metagenome of fecal microbiome at day 2 compared to day 0. Differences
  with an effect size of > 1 or < −1 and p value < 0.05 after adjustment for multiple
  comparisons with BH are shown. Effect size (panels c-e) represents coefficient produced
  from MaAslin2, representing strength and direction of relationship
