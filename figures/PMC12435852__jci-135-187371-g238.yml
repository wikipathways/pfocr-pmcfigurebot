figure_title: Spatial profiling uncovers unique transcriptional programs in the dark
  and light zones of GCs
caption: '(A) Representative immunohistochemistry/immunofluorescence (IHC/IF) micrographs
  showing Ki-67 (green signal), NGFR (pink signal), CD4 (blue signal), and CD8 (brown
  signal) expression. Ki-67 highlights proliferative DZ regions; NGFR marks the LZ.
  Original magnification, ×200. Scale bar: 100 μm. (B) Representative IF images of
  CD3+ (green signal) and AID+ (red signal) cells within GCs. Original magnification,
  ×200. Scale bar: 100 μm. (C) Cumulative distribution functions (CDFs) of CD3+–AID+
  nearest-neighbor distances in observed samples (pink curve) versus randomized controls
  (black curve). Statistical analysis: Wilcoxon’s test. (D) CDFs of CD68+–AID+ nearest-neighbor
  distances in observed versus randomized samples. Statistical analysis: Wilcoxon’s
  test. (E) DSP analysis of ROIs from DZ (n = 5) and LZ (n = 5) regions defined by
  CD20 and NGFR expression. (F) Volcano plot showing differentially expressed genes
  (adjusted P < 0.05) between DZ and LZ regions. (G) Heatmap of differentially expressed
  genes with unsupervised hierarchical clustering across ROIs. (H) Pathway enrichment
  of 169 DZ-upregulated genes using the Reactome Pathway database. (I) Pathway enrichment
  of 201 LZ-upregulated genes using Reactome'
