figure_title: 'CMV encodes different proteins to evade host immune responses: (a)
  HCMV evades the host’s innate antiviral immune response mediated by pattern recognition
  receptors by encoding US7, US8, and UL31 proteins that promote the degradation of
  Toll-like receptors, inhibit the cGAS-STING signaling pathway, and subsequently
  suppress the expression of downstream antiviral cytokines; (b) HCMV employs multiple
  viral proteins to inhibit antigen presentation and evade immune clearance: US3,
  US11, US2, and US6 suppress MHC-I-mediated antigen presentation; US2, US3, and pp65
  impair MHC-II presentation to escape T cell recognition; UL40, UL16, UL18, UL20,
  and viral IL-10 interfere with NK cell-mediated cytotoxicity; (c) HCMV interferes
  with host cell death pathways through multiple mechanisms to achieve immune evasion.'
caption: 'CMV encodes different proteins to evade host immune responses: (a) HCMV
  evades the host’s innate antiviral immune response mediated by pattern recognition
  receptors by encoding US7, US8, and UL31 proteins that promote the degradation of
  Toll-like receptors, inhibit the cGAS-STING signaling pathway, and subsequently
  suppress the expression of downstream antiviral cytokines; (b) HCMV employs multiple
  viral proteins to inhibit antigen presentation and evade immune clearance: US3,
  US11, US2, and US6 suppress MHC-I-mediated antigen presentation; US2, US3, and pp65
  impair MHC-II presentation to escape T cell recognition; UL40, UL16, UL18, UL20,
  and viral IL-10 interfere with NK cell-mediated cytotoxicity; (c) HCMV interferes
  with host cell death pathways through multiple mechanisms to achieve immune evasion.
  The viral UL37 protein inhibits intrinsic apoptosis, while UL36 functions as a dual-action
  cell death suppressor that blocks both apoptosis and necroptosis. The IE1 protein
  suppresses necroptosis by inhibiting the functions of RIPK3 and MLKL. In addition,
  the autophagy-inhibiting protein TRS1 interacts with Beclin 1 to effectively block
  the autophagic process'
