figure_title: 'Mechanisms of action of polyphenols on cognitive health. The neuroprotective
  effects of polyphenols occur through multiple mechanisms, including: (A) Antioxidant
  activity: polyphenols neutralize free radicals and reactive species, including ROS,
  counteracting oxidative stress; (B) Anti-inflammatory effects: polyphenols modulate
  inflammatory signaling pathways, including the inhibition of pro-inflammatory cytokines
  and enzymes such as cyclooxygenase-2 (COX-2) and inducible nitric oxide synthase
  (iNOS); (C) Modulation of neurotrophic factors: polyphenols have been shown to enhance
  the expression of brain-derived neurotrophic factor (BDNF), a protein that promotes
  neurogenesis and synaptic plasticity. BDNF is crucial for the growth, maintenance,
  and survival of neurons, particularly in areas involved in memory and learning,
  such as the hippocampus; (D) Improved vascular health: polyphenols can improve endothelial
  function and promote vasodilation, which enhances blood flow to the brain. Better
  cerebrovascular health may improve the delivery of oxygen and nutrients to brain
  cells, contributing to cognitive function and reducing the risk of ischemic-related
  cognitive decline; (E) Inhibition of protein aggregation: some polyphenols have
  been shown to inhibit the aberrant aggregation of proteins, thereby potentially
  inhibiting the progression of disease such as AD'
