figure_title: Discovery of a pathway for CET alkaloid biosynthesis, from phenethylisoquinoline
  (3) to cephalotaxinone
caption: (a) Natural accumulation of CET biosynthetic intermediates in the native
  plant, C. harringtonia, harvested in May 2023. The data are reported as mean ± SD
  of the extracted ion abundance (n = 4 biological replicates for YSt, ON, and Rt,
  and n = 2 for YIN, YON, and OSt) for the exact ion mass [M + H]+ corresponding to
  each compound. For quantification of cephalotaxinone, a 200-fold dilution was performed
  to the extracted samples to avoid saturation of the parent isotope peaks in LC-MS.
  Young inner needles (YIN), young outer needles (YON), Young stems (YSt), old needles
  (ON), old stems (OSt), and root tips (Rt). (b) Proposed biosynthetic pathway of
  CET reconstituted in N. benthamiana through transient co-expression of five identified
  biosynthetic genes from C. harringtonia, illustrating the stepwise conversion from
  compound 3 to cephalotaxinone (10). All the structures are supported by LC-MS/MS
  analyses, with the first and final intermediates (3 and cephalotaxinone) further
  supported by authentic synthesized and purified standards, including NMR analyses.
  (c) Gray boxes to the left of the graphs indicate biosynthetic genes that are co-expressed
  in N. benthamiana leaves; blue box represents the final acting enzyme. For each
  intermediate, the data are reported as mean ± SD of the extracted ion abundance
  (n = 3) for the exact ion mass [M + H]+ (for 6, both [M + H]+ and [M + Na]+) corresponding
  to each compound. While the overall biosynthetic pathway of CET is linear as shown,
  the final steps involving ChCYP805A13 and Ch2OGD-1 may occur in bifurcated sequence
  (Supplementary Fig. 16)
article_title: Discovery of homoharringtonine pathway enzymes reveals a whole plant
  model for coordinated biosynthesis
