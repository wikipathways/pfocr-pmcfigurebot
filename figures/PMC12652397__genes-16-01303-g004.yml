figure_title: Fibrotic Pathways as a Cornerstone of CRS.
caption: 'Fibrotic Pathways as a Cornerstone of CRS. Multi-omics studies consistently
  implicate fibrosis and extracellular matrix (ECM) remodeling as central pathways
  in CRS pathogenesis. Differentially expressed genes and proteins include fibronectin-1
  (FN1), periostin (POSTN), collagens, and cytoskeletal proteins such as vimentin,
  alongside signaling mediators in the transforming growth factor-β (TGF-β) pathway.
  Matrix metalloproteinases (MMPs) and related protease inhibitors reflect active
  ECM turnover and remodeling. Biomarkers of collagen degradation (e.g., urinary fragments,
  circulating procollagen peptides) may enable early detection of CRS prior to functional
  decline. Therapeutic targeting of fibrosis through anti-fibrotic drugs, anti-TGF-β
  strategies, and microRNA modulation is a promising translational direction. Abbreviations:
  FN1, fibronectin-1; POSTN, periostin; TGFβ, transforming growth factor beta; ECM,
  extracellular matrix; MMP, matrix metalloproteinase; PRIDE accessions listed in
  Table S1)'
