figure_title: 'Integrated oxidative stress network of mycotoxins: ROS overproduction
  coupled with Keap1-Nrf2 signaling suppression.'
caption: 'Integrated oxidative stress network of mycotoxins: ROS overproduction coupled
  with Keap1-Nrf2 signaling suppression. AFB1, OTA, and ZEN trigger ROS overproduction
  via mitochondrial ETC, ER, and NOX pathways. When ROS generation exceeds homeostatic
  thresholds, they disrupt redox balance, causing damage to biological macromolecules
  and mitochondrial function. Additionally, these mycotoxins suppress the activation
  of Keap1-Nrf2 signaling pathway and block the expression of downstream cytoprotective
  genes, ultimately impairing endogenous antioxidant detoxification pathways'
