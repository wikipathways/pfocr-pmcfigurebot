figure_title: |-
  Fitted model recapitulates signaling dynamics measured in EGF-treated HeLa
  cells
caption: |-
  (A) Schematic of the EGFR-ERK signaling pathway model. The
  dynamic model describes signaling initiated by epidermal growth factor (EGF)
  binding to its receptor, leading to EGFR dimerization and phosphorylation of a
  representative C-terminal tyrosine on each receptor. Phosphorylated EGFR is
  bound by the adapter protein growth factor receptor-bound protein 2 (GRB2) and
  the guanine nucleotide exchange factor Son of Sevenless (SOS) to catalyze the
  exchange of guanosine diphosphate (GDP) to guanosine triphosphate (GTP) on
  membrane-bound RAS. GTP-loaded RAS (RAS-GTP) recruits RAF1 to the plasma
  membrane and induces an ‘open’ conformation for RAF1 to become
  phosphorylated, hetero- or homodimerize with BRAF. Catalytically active,
  phosphorylated RAF1 dimers recruit and phosphorylate mitogen-activated protein
  kinase (MEK), which catalyzes phosphorylation of extracellular signal-regulated
  protein kinase (ERK). Phosphorylated ERK participates in negative feedback
  loops, wherein ERK phosphorylates active and sorafenib-inhibited RAF1/BRAF
  (iRAF1, iBRAF), causing their release from RAS-GTP at the membrane, and SOS,
  disrupting its association with GRB2. Negative feedback regulations are
  indicated by dotted arrows. Reaction network was built in VCell, and model
  schematic was created with Biorender.com. (B) Model rate constants were fitted
  against immunoblot measurements for RAS-GTP in HeLa/HRAS-mVenus cells reported
  by Pinilla-Macua et al. (55) and live-cell imaging of membrane RAF1 with or without 10
  μM sorafenib and immunoblot measurements for pMEK and pERK in
  HeLa/RAF1-mVenus reported by Surve et al. (10). Time points at which 5% of RAF1 remained active
  at the plasma membrane are indicated by vertical dotted lines. Throughout the
  panels, the means of model outputs generated from 1751 parameter sets are
  indicated by dotted lines, best-fit model outputs are indicated by bold lines,
  68% confidence intervals (CI) about the means are represented by shaded areas,
  data are indicated by colored dots, and standard errors of data are indicated by
  bars. (C) Predicted maximum and time-averaged concentrations of the
  indicated proteins in response to 10 ng/mL EGF for 60 min with or without 10
  μM sorafenib from the best-fit model are shown. pEGFR includes pEGFR,
  pEGFR bound to GRB2, and pEGFR bound to GRB2-SOS, RAS-GTP includes all RAS-GTP
  bound species, membrane RAF1 indicates all RAF1-bound species at the plasma
  membrane. Vertical cross bars indicate whether the dataset was included in model
  fitting. Model fitting was performed in SloppyCell
