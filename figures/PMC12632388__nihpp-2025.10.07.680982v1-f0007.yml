figure_title: Paralogous protein kinases have distinct binding partners
caption: '(A) Venn diagram showing the number of proteins significantly enriched in
  the Tpk1- Tpk2- and Tpk3-TurboID strains. Percentages: number of grouped proteins
  / total proteins × 100%. (B) Venn diagrams showing the number of enriched GO terms
  for Tpk1- Tpk2- and Tpk3-interactors. Percentages: number of grouped GO terms /
  total terms × 100%. (C) Bubble plots showing the top 10 significant biological processes
  in Tpk1 and Tpk2, ranked by the adjusted p-values in each strain. (D) Top: protein-protein
  interaction network for Tpk1, Tpk2 and Tpk3. Yellow nodes represent Tpk1/2/3, blue
  circles represents binding partners. Sizes of nodes are scaled according to the
  number of interactors. Thicknesses of edges are scaled according to fold change
  in binding partner abundance compared to wildtype. Bottom: table listing a pathway
  enriched from integration analysis. (E) Simplified glycerophospholipid pathway and
  key enzymes are shown. Unique protein interactor highlighted in red'
