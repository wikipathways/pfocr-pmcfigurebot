figure_title: The structure, activation and downstream signaling pathways of receptor
  RTK RET.
caption: 'The structure, activation and downstream signaling pathways of receptor
  RTK RET. Its extracellular region encompasses four cadherin-like domains and a cysteine-rich
  domain. The protein also includes a single segment that spans the plasma membrane.
  Internally, RET contains an intracellular domain, which features a large tyrosine
  kinase (TK) domain embedded within its structure. RET is activated by GFLs or GDNF
  family ligands, such as GDNF, NRTN, ARTN, and PSPN, which bind to GFRα1, GFRα2,
  GFRα3, and GFRα4, respectively. The GDNF/GFRα1/RET signaling complex is crucial
  for spermatogonial stem cell self-renewal, survival, and development of the kidney,
  urinary tract, and enteric nervous system. The cytokine GDF15, which responds to
  stress, engages with GFRAL and initiates RET activation, playing a role in the regulation
  of food intake and body mass. RET 51, the longer isoform consisting of 658–1114
  amino acids, and RET 9, the shorter isoform comprising 1072 amino acids, exhibit
  identical sequences for the initial 1063 amino acids at their N-terminal ends. The
  sole distinction between these two isoforms lies in their C-terminal regions. Red
  circles indicate sites of tyrosine autophosphorylation, whereas blue circles indicate
  the location of serine 696. The summary and abbreviations of the adapter molecules
  linked to each phosphorylation site are given below. Src homology 2 domain containing
  transforming protein (SHC); fibroblast growth factor receptor substrate 2 (FRS2);
  insulin receptor substrate 1/2 (IRS1/2); Grb2; phospholipace C γ (PLCγ); Src homology
  region 2 domain-containing protein tyrosine phosphatase-2 (SHP2); growth factor
  receptor-bound protein 7 and 10 (Grb7 and Grb10), signal transducer and activator
  of transcription 3 (STAT3); protein kinase A (PKA); protein kinase C (PkC); STAT;
  mitogen-activated protein kinase (MAPK); extracellular signal-regulated kinase (ERK),
  phosphoinositide 3 kinase (PI3K); multiple ankyrin repeat domains 3 (SHANK3); c-Jun
  N-terminal kinase (JNK); growth differentiation factor-15 (GDF15); GDNF family receptor
  α-like (GFRAL); GDNF; neurturin (NRTN); artemin (ARTN); persephin (PSPN); CRD; and
  CLD. Adapted from Mechanisms of Disease: cancer targeting and the impact of oncogenic
  RET for medullary thyroid carcinoma therapy/RET Proto-Oncogene/Intracellular RET
  signaling pathways activated by GDNF'
