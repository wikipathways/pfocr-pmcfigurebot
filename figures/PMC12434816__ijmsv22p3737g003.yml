caption: Association between FAM174B expression and immune characteristics in BLCA.
  (a) Immunohistochemical analysis of CD8, PD-L1, and FAM174B across three distinct
  immune phenotypes (scale bars = 250 μm). (b-c) Comparative distribution of PD-L1
  immunohistochemical scores and FAM174B positivity among immune phenotype groups.
  (d-e) Correlation assessments between FAM174B positivity and (d) CD8+ T cell infiltration
  (immunofluorescence-based) or (e) PD-L1 expression levels. (f) Differential expression
  patterns of FAM174B among immune phenotypes in the IMvigor210 cohort. (g-h) PD-L1
  expression variations on tumor and immune cells stratified by FAM174B expression
  in IMvigor210. (i) Enrichment differences in immunotherapy-related pathways between
  high and low FAM174B expression groups (TCGA-BLCA). Statistical significance was
  determined by Mann-Whitney U test (*P < 0.05, **P < 0.01, ***P < 0.001, ****P <
  0.0001)
