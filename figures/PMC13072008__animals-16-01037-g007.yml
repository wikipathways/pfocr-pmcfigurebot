figure_title: The effect of PGE2 treatment on IFNT receptor expression in bEEC.
caption: The effect of PGE2 treatment on IFNT receptor expression in bEEC. (A) PPI
  network analysis of DAPs involved in cellular response to type I interferon. (B)
  GSEA analysis of cellular response to the type I interferon pathway. (C) GSEA analysis
  of the JAK-STAT signaling pathway. (D) Analysis of IFNAR1 expression in bEECs after
  PGE2 treatment with different concentrations (10−8, 10−7, and 10−6 M). (E) Analysis
  of IFNAR2 expression in bEECs after PGE2 treatment with different concentrations
  (10−8, 10−7, and 10−6 M). (F) Representative images of PTGER2, IFNAR1, STAT1, and
  p-STAT1 protein expression in bEECs after interference with PTGER2. (G–I) Analyses
  of PTGER2, IFNAR1, and p-STAT1 protein expression in bEECs after interference with
  PTGER2, respectively. (J) Representative images of PTGER4, IFNAR1, STAT1, and p-STAT1
  protein expression in bEECs after interference with PTGER4. (K–M) Analyses of PTGER4,
  IFNAR1, and p-STAT1 protein expression in bEECs after interference with PTGER4,
  respectively. (N–P) Analysis of ISG15, MX2, and GRP expression in bEECs after interference
  with PTGER4, respectively. “**” represents p < 0.01; “*” represents p < 0.05; “ns”
  represents p > 0.05
