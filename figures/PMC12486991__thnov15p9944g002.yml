figure_title: The differentiation pathway, subtype heterogeneity, and phenotype plasticity
  of GM-CSF+ Th cells, plus a collection of related driving and suppressing factors,
  as well as associated diseases.
caption: The differentiation pathway, subtype heterogeneity, and phenotype plasticity
  of GM-CSF+ Th cells, plus a collection of related driving and suppressing factors,
  as well as associated diseases. Illustrated in the diagram the generation and functional
  specialization of GM-CSF⁺ Th cells, beginning in the lymph organs where naive CD4⁺
  T cells differentiate into Th1, Th17, or “GM-CSF only” Th lineages, driven by distinct
  cytokine signals (e.g., IL-12, IL-6, IL-2). After entering circulation, these cells
  migrate to peripheral tissues where they exhibit significant plasticity. In the
  inflammatory tissue microenvironment, Th1 and Th17 cells can be induced to produce
  GM-CSF, becoming pathogenic GM-CSF⁺ Th1 and GM-CSF⁺ Th17 cells. A further shift
  can occur where GM-CSF⁺ Th17 cells also gain the ability to produce IFN-γ, creating
  a highly inflammatory hybrid phenotype. Shown the specific cytokines and transcription
  factors that promote (red arrows) or suppress (blue T-bars) these states, and the
  resulting pathogenic cell subtypes were linked to a spectrum of human inflammatory
  and autoimmune diseases, including multiple sclerosis, rheumatoid arthritis, and
  psoriasis. Created in BioRender. Meng, X. (2025) https://BioRender.com/o6m32us
