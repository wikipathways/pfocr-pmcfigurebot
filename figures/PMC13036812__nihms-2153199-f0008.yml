figure_title: Dysregulated expression signatures of inflammation-related genes in
  the hippocampus
caption: A. Inflammation-related genes that are differentially expressed after 9 weeks
  of Cd exposure in the hippocampus are shown in a heatmap. The colors of the heatmap
  represent the log2-fold change of hippocampus genes of the Cd-exposed mice as compared
  with the control group. Red indicates upregulated, and Blue indicates downregulated
  from Cd-exposed mice (Bonferroni-adjusted p-value < 0.05). B. Examples of differentially
  regulated genes associated with inflammation. Asterisks represent statistically
  significant differences between Cd and Control groups. n = 5 in each group. * p
  < 0.05. C. Pathway analysis of Cd-regulated inflammation related genes in hippocampus.
  D. Cd exposure decreased T-UDCA in the brain. n=7-8 in each group. * p < 0.05
