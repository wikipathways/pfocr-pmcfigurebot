caption: Melatonin alleviates hepatocyte ferroptosis via modulating the KEAP1/NRF2/HO-1
  pathway. (A) Relative protein levels of NRF2, HO-1, and GPX4 in HepG2 cells. (B)
  Relative mRNA levels of KEAP1, NRF2, HO-1, and GPX4 in HepG2 cells. (C) Immunofluorescence
  analysis of NRF2 localization in HepG2 cells (scale bar=20 μm). (D-F) The levels
  of MDA, GSH, and SOD in liver tissues. (G) Histological analysis of liver sections
  stained with H&E (scale bar=50 μm). The levels of iNOS, NRF2, HO-1, and GPX4 in
  liver tissues were measured by Western-blotting assay (H) and qRT-PCR assay (I).
  (J) Melatonin prevents the progression of MASLD via inhibiting FFAs-induced ferroptosis
  through KEAP1/NRF2/HO-1 pathway. Data are presented as mean ± SD from three independent
  experiments (n=3). *p<0.05, **p<0.01, and ***p<0.001, compared to FFAs or HFD group.
  FFAs+M=Free Fatty Acids+Melatonin, HFD+M=High Fat Diet+Melatonin
