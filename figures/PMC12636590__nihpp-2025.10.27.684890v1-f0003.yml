figure_title: Gene regulatory changes associated with age.
caption: Gene regulatory changes associated with age. (A) Volcano plot of genes that
  are differentially (increasingly or decreasingly) targeted by transcription factors
  (TFs) over varying age in normal thyroid tissue samples from GTEx. The x-axis represents
  log fold change (logFC), defined as the change in gene in-degree with a unit change
  in age. The y-axis represents negative logarithm of p-values (−log10(P.Value)).
  (B) Boxplot of the t-statistics of the age coefficients associated with the oncogenes
  and tumor suppressor genes (COSMIC database) from limma models in GTEx. Genes with
  positive (and negative) values of t-statistics are targeted more (and less) by TFs
  with age. (C) Bubble plot showing the normalized enrichment scores (NES) of biological
  pathways that are significantly (false discovery rate-adjusted p-value < 0.05) increasingly
  (marked red) or decreasingly (marked blue) targeted by TFs with age. NES are obtained
  from ranked gene set enrichment analysis. The x-axis shows the adjusted p-values,
  and the y axis shows the names of the pathways. Bubble size is proportional to the
  number of genes in specific pathways
