figure_title: Modeling SAC silencing and its relation to spindle architecture and
  cell size
caption: '(A) Spatiotemporal model for SAC silencing. Left panel: Difference in phosphorylation
  level at the attached versus unattached kinetochores causes differences in SAC protein
  recruitment and regulation of their transport activity. Right panel: Once all kinetochores
  are attached, all SAC proteins become transport-active, resulting in a sharp increase
  in their poleward transport. The consequent accumulation of SAC proteins at the
  spindle poles then triggers the SAC silencing pathway. (B) Model-predicted SAC protein
  concentration at the spindle poles (i.e., spindle pole signal) before and after
  the final kinetochore attachment, and the resulting timing of SAC silencing. t0:
  time of final kinetochore attachment. t1: time when the spindle pole signal exceeds
  the threshold and triggers SAC silencing. Solid curves: deterministic simulations.
  Dashed curves: stochastic simulations. High spindle pole signals result in earlier
  and more precise timing of SAC silencing (magenta), while low spindle pole signals
  lead to later and more variable timing of SAC silencing (purple). (C) Spindle architectural
  features and cell size expected to affect timing of SAC silencing. (D) Model-predicted
  metaphase durations based on measurements of the features in (C). The metaphase
  duration is defined as the sum of the “triggering time” required for the spindle
  pole signal to reach the trigger threshold (t1 − t0) and the “propagation time”
  required for SAC silencing to propagate from the spindle pole throughout the cell.
  The propagation time depends on cell size and is minimally stochastic [28]. (E)
  Experimentally measured metaphase durations. Figures adapted from [28]'
