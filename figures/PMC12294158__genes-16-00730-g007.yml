figure_title: The PI3K/AKT/AQP7 pathway regulates antioxidant activity in GV-stage
  oocyte vitrification.
caption: The PI3K/AKT/AQP7 pathway regulates antioxidant activity in GV-stage oocyte
  vitrification. Reduced AQP7 levels compromised mitochondrial function, disturbed
  cellular redox homeostasis, and disrupted spindle assembly, ultimately triggering
  early apoptosis and impairing polar body extrusion. In vitrified oocytes, PI3K/AKT-mediated
  phosphorylation upregulated AQP7 protein expression, which maintained intracellular
  calcium homeostasis and proper mitochondrial distribution, thereby enhancing cryotolerance
  during vitrification
