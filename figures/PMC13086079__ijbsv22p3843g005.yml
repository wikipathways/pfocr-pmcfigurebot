caption: Depletion of Frmd5 inhibits the activation of Stat3 and regulates apoptosis-related
  genes. (A) Multicolor immunofluorescence staining showing the localization of Frmd5,
  CK14, and components of the Jak2-Stat3 in vaginal tissues of 2-month-old Cdh16-Cre-;
  Frmd5flox/flox and Cdh16-Cre+; Frmd5flox/flox mice. (B-F) Quantitative analysis
  of fluorescence intensity for each target protein shown in panel A using the Visiopharm
  image analysis system (n = 10 fields of view at random per genotype). Statistical
  testing was performed by unpaired t-test. Data are presented as mean ± SD. *P <
  0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. (G) Correlation analysis between
  Frmd5 and p-Stat3 (Y705) fluorescence intensity in individual epithelial cells.
  (H) Correlation analysis between Frmd5 and p-Stat3 (S727) fluorescence intensity
  in individual epithelial cells. (I) RT-qPCR of Frmd5, Jak2, Stat3, Bcl2, Bcl-XL,
  Casp3, and Casp8 in vaginal tissues from 2- and 4-month mice with or without Frmd5
  deletion. Experiments were independently repeated at least three times. Data are
  presented as mean ± SEM. *P < 0.05; **P < 0.01. (J) Schematic diagram illustrating
  the role of Frmd5 in regulating the Jak2-Stat3 signaling pathway and epithelial
  apoptosis
article_title: Loss of Frmd5 Inhibits Jak2-Stat3 Signalling Pathway and Impairs Cell
  Apoptosis During Vagina Luminal Formation in Puberty Mice
