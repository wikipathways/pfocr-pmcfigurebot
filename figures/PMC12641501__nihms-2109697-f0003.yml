figure_title: Impaired lipid metabolism in colon TRM CD8+ T cells in PWH on ART.
caption: |-
  Impaired lipid metabolism in colon TRM CD8+ T cells in PWH on ART.A. Gene ontology pathway analysis showing gene counts that are enriched
  in colon TRM CD8+ T cells in PWH compared to those who are HV-uninfected.
  Benjamini-Hochberg-corrected p values: *p < 10−2, **p
  < 10−5.B. Log(transcripts per million) expression of PPARγ downstream
  target genes integral to lipid droplet (LD) biogenesis in colon TRM CD8+ T cells
  from HIV-uninfected individuals (blue, n = 10) and PWH on ART (brown, n =
  9).C. Schematic of SeaHorse substrate oxidation assay used to assess
  metabolic pathways in colon TRM CD8+ T cells.D. Oxygen consumption rate (OCR; pmol/min/cells) of sorted colon TRM
  CD8+ T cells from HIV-uninfected individuals was performed by SeaHorse assay to
  evaluate their metabolic profile. The OCR was measured during the mitochondrial
  stress test with the addition of oligomycin, carbonyl cyanide p-trifluoromethoxy
  phenylhydrazone (FCCP), and rotenone and antimycin A (RAA) drugs. Results were
  normalized with the cell count. n=5 per group.E. Schematic showing assessment of fatty acid oxidation (FAO) by
  radioactive tracing of tritiated palmitic acid.F. FAO activity (counts per minute [cpm]) of metabolized
  3H-palmitic acid normalized to colon TRM CD8+ T cell count from
  HIV-uninfected individuals and PWH on ART, accompanied by the FAO activity
  calculated from 4mM Etomoxir treated colon TRM CD8+ T cells. n=10 (HIV-), n=7
  (HIV+ART+) and n=5 (Etomoxir treated CD8+ T cells from HIV).(B, D, J) Data shown as mean ± SEM. Each point, one
  individual
