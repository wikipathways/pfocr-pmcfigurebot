figure_title: Proposed model for HDAC11 regulation of the MAPK pathway.
caption: Proposed model for HDAC11 regulation of the MAPK pathway. (A) BRAF acetylated
  (Ac) at K473, K601, and K680 displays elevated catalytic activity that is at least
  partially due to enhanced dimerization with ARAF, BRAF, or CRAF and association
  with partner proteins, such as KSR, which results in phosphorylation (P) of MEK
  and ERK and ultimately cell proliferation. (B) HDAC11 and SIRT1 deacetylate BRAF
  to suppress BRAF kinase activity, resulting in reduced cell proliferation without
  activation of MEK and ERK via phosphorylation. Pharmacological activation of HDAC11
  and SIRT1 would maintain BRAF in the deacetylated state to diminish cell proliferation
article_title: HDAC11 Deacetylates BRAF to Regulate Kinase Activity and Cell Proliferation
