figure_title: PAK4 knockout upregulated ICAM-1, CD11b, CD11c, and antigen presentations
  and induced changes in leukocyte trans-endothelial migration.
caption: PAK4 knockout upregulated ICAM-1, CD11b, CD11c, and antigen presentations
  and induced changes in leukocyte trans-endothelial migration. The tumour tissues
  from wild-type (WT) and PAK4-knockout (PAK4KO) were subjected to proteomic analysis.
  A volcano plot showed the differential expression of protein profiles in PAK1KO
  tumours compared to WT tumours (A). The red and blue colours represent up- and down-regulation
  of protein expression, respectively. Protein interaction network analysis of global
  proteomic data suggested alterations in endothelial cell regulation, upregulation
  of dendritic cell activation pathway, and enrichment in KEGG pathways involved in
  leukocyte trans-endothelial migration and antigen processing and presentation (B).
  The expression of ICAM-1, CD11b, and CD11c were significantly higher in PAK4KO tumour
  (C). In addition, MHC class I molecules (H2-D1 and H2-K1) and MHC class II components
  (H2-Aa, H2-Ab1, H2-Eb1, and H2-DMb1) were significantly upregulated in PAK4KO tumour
  (C). *, p < 0.05, **, p < 0.01, ***, p < 0.001, ****, p < 0.0001
