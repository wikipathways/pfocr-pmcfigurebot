figure_title: Reprogramming of the brain endothelial cell epigenome is linked to inflammation,
  thrombosis, and endothelial dysfunction in Pdcd10BECKO mice
caption: 'A) Number of DEGs between Pdcd10BECKO and Pdcd10fl/fl in each BEC subtype.
  Red lines indicate upregulated genes; blue lines indicate downregulated genes. Significance
  is defined as |log2 FC| > 0.5 and FDR < 0.05. B) Number of DARs between Pdcd10BECKO
  and Pdcd10fl/fl in each BEC subtype. Red lines indicate regions with gained CA;
  blue lines indicate lost CA. Significance is defined as |log2 FC| > 1 and FDR <
  0.05. C) Integrated heatmaps summarizing transcriptional and epigenetic changes
  between Pdcd10BECKO and Pdcd10fl/fl across BEC subtypes. For each subtype: left
  panels show gene expression of up- and downregulated genes; right panels show chromatin
  accessibility of linked putative enhancers. Gene expression and chromatin accessibility
  are shown as row-wise Z-scores of log2 (CPM + 1). Z-scores were calculated independently
  for each gene (RNA) and each enhancer (ATAC) within each BEC subtype, across genotypes.
  Each row represents a matched gene–enhancer pair. D) KEGG pathway enrichment analysis
  of up-regulated genes and more accessible putative enhancers in Pdcd10BECKO across
  BEC subtypes. Color scale represents −log10 p-values; circle size indicates the
  number of genes per term'
