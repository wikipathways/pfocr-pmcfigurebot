figure_title: Single-nucleus transcriptomics confirms accelerated neuronal differentiation
  of PLXNB2−/− cells
caption: a) UMAP embedding of snRNA-seq data from D9 cells (n = 3 replicates per genotype).
  WT cells segregated into clusters enriched for radial glia (RG), neural progenitors
  (NPCs), and ESC-like states, whereas KO cells aligned with differentiated neuronal
  clusters.b) Feature plots showing expression of NPC and neuronal markers.c) Expression
  of representative marker genes across D9 subclusters.d) Volcano plot of differentially
  expressed genes (DEGs; PLXNB2−/− vs. WT), with selected genes highlighted.e) Bubble
  plot of enriched pathways upregulated in D9 PLXNB2−/− cells.f) ENRICHR GO enrichment
  analysis of DEGs for categories of biological process (BP), cellular component (CC),
  and molecular function (MF), color-coded by theme.g) Violin plots showing downregulation
  of actin cytoskeleton–associated genes in PLXNB2−/− cells.h) Heatmap of DEGs grouped
  by functional categories, across three replicates per genotype.i) Ingenuity Pathway
  Analysis (IPA) network summary. Growth factor signaling pathways were broadly suppressed,
  while PTEN was activated in PLXNB2−/− cells.j) Predicted upstream regulators (IPA)
  of DEGs in PLXNB2−/−vs. WT cells.k) Developmental stage scoring against human cortex
  gene signatures (Velmeshev et al., 2023). D9 WT cells aligned with 2nd-3rd trimester
  profiles, whereas PLXNB2−/− cells shifted toward postnatal signatures
