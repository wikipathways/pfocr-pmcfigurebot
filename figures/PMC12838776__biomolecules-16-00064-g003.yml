figure_title: Mechanism of action of S.
caption: Mechanism of action of S. baicalensis against RF. Baicalein, baicalin, and
  wogonin were found to modulate the progression of RF through synergistic effects
  across multiple pathways. Baicalein can inhibit fibroblast proliferation and ECM
  deposition via TGF-β/Smad, PI3K/Akt, and MAPK. Baicalin suppresses RF by regulating
  TGF-β-mediated Smad and Notch1, microRNA-124/TLR4/NF-κB and Galectin-3/Akt/GSK-3β/Snail
  signaling pathways. Wogonin and its glycoside derivatives exhibit a potent inhibitory
  effect on RF via the inhibition of the TGF-β-associated p38MAPK and Smad branches
  as well as the NF-κB axes
