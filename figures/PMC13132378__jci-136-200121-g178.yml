figure_title: Early activation of stress and cell death pathways in Csf1r+/– mice
  and effects of transgenic overexpression of MT1
caption: (A and B) IPA-based prediction of pathways (A) and biological processes (B)
  affected in glial and endothelial lineage cells of young Csf1r+/– mice. (C) IPA-based
  prediction of pathways (upper panel) and biological processes (lower panel) affected
  in neurons of young Csf1r+/– mice. The small gray spots indicate lack of significance
  (Z score < 2 and/or P > 0.05). (D) Heatmap showing the expression of cell death–related
  transcripts. Asterisks mark the position of Mt1, Fth1, and Mt3 gene transcripts
  encoding proteins involved in metal ion homeostasis. (E) Heatmap showing the expression
  of EIF2 pathway-related transcripts. AS, astrocytes; OL, oligodendrocytes; μG, microglia,
  EC, endothelial cells. (F) qRT-PCR validation of selected changes in gene expression
  in mouse brains. Means ± SEM; 1-tailed Student’s t tests. Each symbol on the chart
  represents 1 mouse. (G) Expression of cell death and EIF2 pathway genes in patients
  with CRL. Each circle on the charts represents 1 patient. One-tailed Student’s t
  tests. (H–L) Proteomic analysis of the effects of Csf1r heterozygosity and Mt1 overexpression
  in brain macrophages and oligodendrocytes of 3-month-old mice. Data from 5 mice/condition.
  (H–J) Macrophages. IPA-generated predictions of biological processes (H), pathways
  (I), and proteins involved in regulation of mitochondrial function and superoxide
  production (J). (K and L) Oligodendrocytes. (K) IPA-generated predictions of biological
  processes affected. (L) Changes in the expression of anti- and pro-apoptotic proteins.
  **Proteins involved in the inhibition (DNAJC3) and activation (EIF2AK4) of the integrated
  stress response
