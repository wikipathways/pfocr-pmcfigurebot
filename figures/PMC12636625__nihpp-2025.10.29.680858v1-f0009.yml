figure_title: Summary schematic of proposed mechanism
caption: Activation of Gq signaling in macrophages through the GqD/GPR18 pathway,
  increased phosphorylation of AMPK leading to the stimulation and release of sphingolipids
  and their derivatives into the extracellular environment. These bioactive sphingolipids
  act as signaling molecules that enter pancreatic β-cells via the CD36 transporter,
  where they inhibit insulin secretion through alternative intracellular signaling
  cascades
article_title: Acute activation of Gq-signaling in islet macrophages inhibits β-cell
  insulin secretion through AMPK-sphingolipid axis
