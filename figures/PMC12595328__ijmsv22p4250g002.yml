figure_title: Structural Classes and Mechanisms of BsAbs.
caption: Structural Classes and Mechanisms of BsAbs. This figure summarizes BsAbs'
  key structural types and three bridging-based mechanisms. As single molecules binding
  two distinct epitopes, BsAbs comprise Fc-less non-IgG-like formats and full-length
  IgG-like structures. Their antitumor effects include immune cell redirection, dual
  checkpoint blockade (e.g., PD-1/CTLA-4), and co-blockade of signaling pathways (e.g.,
  EGFR/c-MET)
