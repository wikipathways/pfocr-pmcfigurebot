figure_title: IIS pathway and CRH-1/CREB1 differentially regulate feeding-dependent
  reversal of CO2-attraction in distinct life stages
caption: 'Each circle represents the chemotaxis index calculated from a single chemotaxis
  assay. Violin plots represent the distribution, black horizontal solid lines represent
  the median and horizontal dotted lines represent the quartiles. Mann–Whitney U tests
  p values for each comparison: n.s., nonsignificant, *p < 0.05, **p < 0.01, ***p
  < 0.001, ****p < 0.0001.(A) Feeding on E. coli OP50 can reverse CO2-attraction of
  L1-arrested animals within 15 minutes.(B) Reversal of CO2-attraction of dauer animals
  requires feeding on E. coli OP50 for 16 hours(C) daf-2(e979), pdk-1(sa709), akt-1(ok525)
  and akt-2(ok393) mutant fed-L1 animals show CO2-attraction, opposite to N2 Fed-L1
  animals, which show CO2-avoidance. age-1(m333); daf-16(m26) double-mutant fed L1
  animals show weak CO2-avoidance.(D) akt-1(ok525) mutant dauers fail to induce CO2-avoidance
  upon feeding.See also Figure S3'
article_title: Distinct Molecular Mechanisms Regulate Feeding State-Dependent CO2
  Chemotaxis Plasticity During Different Life Stages in Caenorhabditis elegans
