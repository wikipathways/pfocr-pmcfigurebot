figure_title: Impact of PBPH on inflammation in colon tissue.
caption: Impact of PBPH on inflammation in colon tissue. (A) Inflammatory cytokine
  levels. This panel illustrates the influence of PBPH treatment on mRNA levels of
  key inflammatory cytokines such as TNF-α, IL-6, and IL-1β. (B) Inflammatory pathway
  activation. These graphs demonstrate the TLR4-mediated inflammation-related markers.
  (C) Histological evaluation. The representative HE-stained colon tissue displays
  the level of tissue inflammation. Arrows indicate normal crypt structures, scale
  bar = 50 μm. (D) Immunohistochemistry staining of inflammatory markers (TLR4 and
  AP-1) in colon tissue. The representative pictures show inflammation-related markers.
  All data are presented as mean ± SD (n = 6 mice per group). Statistical significance
  was determined by Student’s t-test or one-way ANOVA followed by Tukey’s post hoc
  test. * p < 0.05, ** p < 0.01, *** p < 0.001
