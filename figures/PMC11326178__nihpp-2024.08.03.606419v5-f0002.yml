figure_title: Splicing-based clustering reveals heterogeneous tumor groups with distinct
  histologies, pathway activities, and clinical outcomes
caption: (A) Hierarchical clustering heatmap of PSI values for top 5,000 most variable
  SE splice events across tumors. (B) Kaplan-Meier curve of EFS for patients by cluster
  membership. (C) Stacked barplot showing histology sample membership fraction for
  each cluster. (D) Heatmap of top cancer-related pathways by cluster (GSVA scores
  represented by blue/orange color). (E) Heatmap of protein abundance for top 30 most
  variable proteins within the KEGG spliceosome pathway (GSVA scores denote KEGG spliceosome
  scores) (F) Forest plot of cox proportional hazards multivariate interaction EFS
  model for cluster and KEGG spliceosome GSVA score, including covariates for tumor
  resection and age at diagnosis. Black and white diamonds indicate statistically
  significant and not significant hazard ratios (HRs), respectively, with intervals
  denoting 95% confidence intervals. Gray diamonds indicate reference levels of factor
  covariates
