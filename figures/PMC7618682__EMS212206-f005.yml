figure_title: Host physiology selects for conserved metabolism despite wide variation
  in microbiota composition and nutrients
caption: 'In the mammalian gut, diverse nutrient sources such as sugars (yellow hexagon
  chains) or amino acids can be used as both carbon and energy sources by diverse
  microbes. Despite this variability, common outputs from these pathways are acetate,
  butyrate, and propionate. Acetate is produced from acetyl-coenzyme A (CoA) via 3
  main pathways: the acetate kinase (ackA) and phosphotransacetylase reactions pathway,
  the succinyl-CoA:Ac-CoA transferase (SCACT) and succinyl-CoA synthetase pathway,
  or the pyruvate:menaquinone oxidoreductase (poxB) pathway.98 Diverse species can
  perform these reactions, with examples listed and color-coded by phyla99–105 (Bacillota,
  formerly Firmicutes, in red; Bacteroidota, formerly Bacteroidetes, in blue; Actinomycetota,
  formerly Actinobacteria, in green; Verrucomicrobiota in purple; Pseudomonadota,
  formerly proteobacteria, in yellow). Acetate serves as a carbon and energy source
  for colonocytes (beige cells), regulates inflammation, and acts as a carbon and
  energy source for other microbes via cross-feeding.98,106 Butyrate is produced by
  two main pathways from butyryl-CoA, exclusively by Bacillota: the butyrate kinase
  (butK) pathway and the butyryl-CoA:acetate CoA-transferase (CoAT) pathway.107 Propionate
  is produced by phylogenetically diverse bacteria via 3 main pathways: from succinate
  via the succinate (Suc) pathway, from lactate via the acrylate (Acr) pathway, or
  from 1,2-propendiol via the propendiol (Pdu) pathway.107,108 Both butyrate and propionate
  serve as host energy sources via beta-oxidation, although butyrate provides more
  energy.11,12,109 Butyrate11 and, to a lesser extent, propionate109 also signal via
  the transcription factor PPAR-γ to reduce nitric oxide synthase expression and consequently
  nitrate availability in the gut, as well as shift colonocyte metabolism to beta-oxidation
  from anaerobic glycolysis. Beta-oxidation consumes oxygen and thus reduces the availability
  of electron acceptors so that facultative anaerobes do not bloom. Full species names:
  Lactiplantibacillus plantarum, Bacteroides thetaiotaomicron, Bifidobacterium adolescentis,
  Escherichia coli, Cutibacterium granulosum, Akkermansia muciniphila, Coprococcus
  eutactus, Subdoligranulum variabile, Faecalibacterium prausnitzii, Agathobacter
  rectalis (formerly Eubacterium rectale), Roseburia intestinalis, Holdemanella biformis,
  Dialister invisus, Bacteroides uniformis, Coprococcus catus, Blautia obeum, Anaerobutyricum
  hallii (formerly Eubacterium hallii), and Roseburia inulinivorans'
