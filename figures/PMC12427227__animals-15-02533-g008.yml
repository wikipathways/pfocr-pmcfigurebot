figure_title: Analysis of overlapping DEGs following E.
caption: Analysis of overlapping DEGs following E. tenella infection in the WCC. (A)
  Venn diagram illustrating the overlap of DEGs in the WCC at 2 dpi (light orange,
  n = 829), 4 dpi (light blue, n = 2980), and 7 dpi (light green, n = 3990), resulting
  in 93 intersecting genes. (B) Fuzzy c-means clustering revealed eight distinct temporal
  expression patterns among the intersecting genes. The x-axis represents the three
  time points post-infection, while the y-axis shows log2-transformed and normalized
  intensity ratios. (C) The top 20 most significantly enriched GO pathways. (D) The
  Sankey plot illustrates the top 10 pathways with significantly enriched intersection
  genes in the WCC. A dot plot illustrates the proportion of WCC−T genes in relation
  to the total number of genes within each significantly enriched pathway (p ≤ 0.05).
  Genes marked with asterisks in the heatmap were selected for subsequent qRT−PCR
  validation
