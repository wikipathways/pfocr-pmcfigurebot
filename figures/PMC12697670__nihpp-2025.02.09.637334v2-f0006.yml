figure_title: Lateralized DA pathway tracks internal nutrients
caption: a–b, Unilateral recordings in left or right BLA. a. Mean DA release during
  Ensure IG infusion is greater in left BLA (left, mean traces; right, summary plots).
  b, DA release during the first lick bout is greater in right BLA.c–d, Simultaneous
  recordings in left and right BLA. c. Example from one mouse showing DA activity
  in left and right BLA during Ensure IG infusion. d, Example ae, In humans, PET imaging
  (11C-raclopride) shows left-lateralized DA release after milkshake, strongest in
  anterior BLA.f, fMRI shows greater left BLA activation after glucose vs water consumption.g,
  Left dominance may arise from (1) asymmetric vagal input, or (2) lateralized feedback
  circuitry.h, Bilateral BLA dopamine recordings after unilateral vagotomy (VGX).i,
  Neither left nor right vagotomy abolishes lateralization.j, Polysynaptic retrograde
  tracing mapped inputs to left vs right VTA→BLA dopamine pathways.k, Left pathway
  receives stronger input from insular cortex.l, Top fifteen regions showing greater
  labeling after left vs right BLA injection (normalized to VTA labeling; n = 8 left
  injections, 6 right injections).m, Force-directed graph illustrating strong connectivity
  among regions in (l).Brains shown in neurological orientation (left = subject’s
  left). Full list of abbreviations in Ex. Fig. 16.ns P > 0.05; *P < 0.05; **P < 0.01;
  ***P < 0.001. See Extended Data Tables 2, 4
