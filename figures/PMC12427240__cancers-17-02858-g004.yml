figure_title: DEG sets between CAFs and NFs.
caption: 'DEG sets between CAFs and NFs. (A) Heatmap of GSVA scores in selected DEG
  sets among well-known pathway databases (e.g., HALLMARK, BIOCARTA, KEGG, REACTOME,
  and WIKI pathway). (B) Boxplot of GSVA scores in selected DEG sets comparing CAFs
  and NFs. Gene sets related to hypoxia responses (Hallmark Hypoxia) and EMT (Hallmark
  EMT) were upregulated in CAFs compared with NFs (all FDR, p ≤ 0.0001). Conversely,
  the gene set related to mismatch repair (Reactome Mismatch Repair) exhibited significantly
  higher GSVA scores in NFs than in CAFs (FDR, p ≤ 0.0001). (C) Boxplot of GSVA scores
  in selected DEG sets comparing LN-CAFs, Lung-CAFs, and NFs. LN-CAFs showed higher
  GSVA scores for gene sets such as Hallmark Hypoxia and Hallmark EMT, compared with
  Lung-CAFs (FDR, p ≤ 0.0001). Adjusted p-values (FDR): ns, p > 0.05; ****, and p
  ≤ 0.0001. CAF, cancer-associated fibroblast; EMT, epithelial–mesenchymal transition;
  NF, normal fibroblast; and GSVA, gene set variation analysis'
