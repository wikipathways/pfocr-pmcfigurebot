figure_title: NUDT21 deletion promotes proinflammatory protein expression through
  APA.
caption: NUDT21 deletion promotes proinflammatory protein expression through APA.
  BMMs from LysmCre or Nudt21f/f LysmCre mice were treated with LPS for 3 hours. (A)
  Scatterplot from RNA-Seq revealed 1470 genes had shortened 3’ UTRs. (B) Pathway
  enrichment of genes with 3’UTR shortening. (C) Western blot showed increased protein
  levels of CCL2, IFNAR1, MMP9, and NFKB1 in Nudt21 knockout BMMs. (D) ELISA measured
  the TFNA levels in the supernatant of cultured BMMs. (E) RT qPCR showed the transcript
  levels of proinflammatory cytokines, including Il1b, Il6, Mmp1, and Inos. (F-G)
  Thp-1-derived macrophages were transfected with GFP or NUDT21 mRNA (250 ng/ml) using
  using MessengerMAX™. (F) Western blot showed the protein levels of NUDT21 and Actb.
  (G) RT-qPCR analysis of CCL2 and IL6 mRNA levels in cells treated with 1 ug/ml LPS
  for 3 hours. N=4. *p<0.05, ** P<0.01, *** P<0.001 vs control mice based on a two-tailed
  student t-test
