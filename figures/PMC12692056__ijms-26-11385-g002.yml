figure_title: (A) Schematic interpretation of the PI3K pathway.
caption: (A) Schematic interpretation of the PI3K pathway. When PI3K is activated,
  FOXO activity is blocked and FOXO translocates to the cytoplasm. Oxidative stress
  induces alternative activation of FOXO, with the function of protecting against
  reactive oxygen species (ROS). Schematic representation of how PI3K STP activity
  is determined from FOXO activity and SOD2 expression. (B) Signal transduction pathway
  (STP) activity of FOXO in pancreatic ductal adenocarcinoma (PDAC) compared with
  normal pancreas (unpaired, GSE71989 and GSE32676) and normal adjacent pancreas (paired,
  GSE16515 and GSE15471). (C) Correlation of FOXO STP activity with Ki67 expression
  of individual PDAC tumor samples from three combined datasets (GSE71989, GSE32676,
  and GSE16515) and GSE15471. p-value > 0.01 is considered non-significant (ns). p-values
  ≤ 0.05 are depicted in numbers. * GSE15471 failed quality control
