figure_title: Poor sleep triggers inflammation in PAH-diseased mice
caption: '(A) Scatter plot of top 30 gene ontology (GO) terms enriched by differentially
  expressed genes (DEGs) in Su/Hx+SF vs Su/Hx lungs (n=4 mice/group). ‘padj’ is the
  P-value adjusted using the Benjamini-Hochberg procedure. ‘Count’ is the number of
  genes enriched in a GO term. ‘GeneRatio’ is the percentage of total DEGs in the
  given GO term. (B) KEGG pathway enrichment analysis.The significant pathway for
  differentially expressed genes in Su/Hx+SF vs Su/Hx lungs. (C) CD68+ cells (red)
  in the respective lungs with quantification. Scale bar: 20 μm. (D) Experimental
  design of the study. (E) Right ventricular systolic pressure (RVSP) of the indicated
  groups. (F) Fulton index of the indicated groups. (G) (Left) Representative WGA-stained
  RV sections to assess hypertrophy of cardiac myocytes. Scale bar: 50 μm. (Right)
  Quantitative analysis. (H) (Left) Representative H&E-stained pulmonary arteries
  sections from the indicated groups. Scale bar: 25 μm. (Right) Percentage of arteries
  medial thickness. (I) Percentage of occluded pulmonary arteries of the indicated
  groups. n= 10–15 mice/group. * P<0.05, ** P<0.01, ***P<0.001. Data were analyzed
  by 1-way ANOVA'
