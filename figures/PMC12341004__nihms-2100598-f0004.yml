figure_title: Network representation of nine prioritized miRNAs and their putative
  target genes
caption: The miRNA and target gene regulatory network was constructed based on combined
  predictions from miRWalk and multiMiR tools. The target genes were filtered for
  pathways known to influence neuronal function, autonomic regulation, and hypertension
  development. The pathway-filtered gene set was further pruned based on the abundance
  of expression in one of the three brainstem regions. The nodes representing the
  genes are colored according to pathway annotation derived from literature and gene
  ontology. The size of a gene node is scaled to the number of miRNAs predicted to
  target that gene
article_title: Dynamic rewiring of microRNA networks in the brainstem autonomic control
  circuits during hypertension development in the female spontaneously hypertensive
  rat
