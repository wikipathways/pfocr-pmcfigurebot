figure_title: Bisphenols exposure induces changes in genes linked to the endocannabinoid
  pathway in osteoblasts
caption: (A) Heat map of the top 30 differentially expressed up- and down-regulated
  genes. The Y axis shows the differentially expressed gene names, and the X axis
  represents the exposed embryos (left) and the control embryos (right) with the genes
  that are differentially upregulated (Top Left; Red), and downregulated (Bottom left;
  Blue) following 200 nM BPA treatment. These top 100 genes have a ****p adj. < 0.0001.
  (B) Volcano plot of top 50 up-regulated and down-regulated differentially expressed
  genes demonstrates genome-wide alterations in expression at an environmentally relevant
  BPA concentration. The Y axis shows the p-adjusted values, and the X axis represents
  the log2Fold change. The blue dots (left) mark genes that were down regulated by
  200 nM exposure as compared to the control groups while the red dots (right) mark
  upregulated genes as compared to the control groups. Any unchanged genes are marked
  by green dots. Genes plotted with p adj. < 0.1. All top 100 genes marked by their
  name have a ****p adj. < 0.0001. (C) Volcano plot of differentially expressed genes
  associated with the Gαi signaling pathway as identified by KEGG analysis. The top
