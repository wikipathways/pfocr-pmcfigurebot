figure_title: Schematic diagram illustrating the proposed mechanisms by which ACh
  induces smooth muscle relaxation in human adipose arterioles of non-CAD and CAD
  patients (created in BioRender. Drachuk, K. (2025) https://BioRender.com/n9ra9df)
caption: In non-CAD patients, ACh-induced dilation is equally mediated by NO, H2O2
  and unknown EDH factor with the involvement of NOX4 in the dilatory response. In
  CAD arterioles, the contribution of both NO and H2O2 is diminished while an NO/H2O2-independent
  hyperpolarizing pathway becomes predominant. Mechanistically, the change in vasodilator
  mechanisms during CAD is associated with reduced NO release as well as an increased
  expression of NOX2. SOD mimetic tempol improves both NO and H2O2 contribution to
  the dilation in adipose arterioles from CAD subjects. Black text and lines represent
  findings obtained in the present study, while grey elements represent mechanisms
  derived from previously published articles. Green highlights indicate the effects
  of tempol observed in our experiments. Line thickness reflects the relative contribution
  of each pathway to ACh-induced dilation, as determined in our experiments
article_title: The role of NO, H2O2, and non-NO/H2O2 mechanisms in acetylcholine (ACh)-induced
  dilation of human arterioles in the absence and presence of coronary artery disease
