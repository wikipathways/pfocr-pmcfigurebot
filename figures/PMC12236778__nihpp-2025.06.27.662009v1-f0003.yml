figure_title: Young, Aged and Irg1−/− mBEDOs, have stark differences in their metabolic
  profiles
caption: (A) PCA plot where the red dots denote the aged mBEDO samples and the blue
  dots denote those in the young group. The ellipses illustrate the range of sample
  variability per group. (B) Volcano plot displaying overall metabolites that were
  differentially and significantly (p<0.05) altered between young and aged samples.
  Red indicates higher relative abundance and blue indicates lower relative abundance
  for each metabolite. (C) Pathway impact map displaying metabolite pathways that
  were significantly represented in the metabolomics data. Size of the circles directly
  corelates to the number of metabolites representing a pathway. (D) Relative abundances
  of metabolites from the glycerophospholipid pathway. Red color indicates aged while
  blue indicates young samples. (E) Relative abundances of metabolites from the purine
  metabolism pathway. Red color indicates aged while blue indicates young samples.
  (F) Relative abundance of a metabolite mapped to glycine, serine, threonine metabolism.
  Red color indicates aged while blue indicates young samples. (G) Relative abundance
  of Mannose in young (blue) and aged (red) samples. Red color indicates aged while
  blue indicates young samples. (H) Relative abundance of 1-Methoxy-4-(2-propenyl)
  benzene in young (blue) and aged (red) samples. Red color indicates aged while blue
  indicates young samples. (I) Relative abundance of 13,14-Dihydroretinol in young
  (blue) and aged (red) samples. Red color indicates aged while blue indicates young
  samples. (J) Relative abundance of gamma Butyrolactone in young (blue) and aged
  (red) samples. Red color indicates aged while blue indicates young samples. (K)
  Relative abundance of Iditol in young (blue) and aged (red) samples. Red color indicates
  aged while blue indicates young samples. (L) PCA plot where the red dots denote
  the aged mBEDO samples, blue dots denote those in the young group, and green are
  the Irg1−/− mBEDOs. The ellipses illustrate the range of sample variability per
  group. (M) Heatmap displaying overall metabolites that were differentially and significantly
  (p<0.05) altered between young, aged, and Irg1−/− samples. Red indicates higher
  relative abundance and blue indicates lower relative abundance for each metabolite.
  (N) Pathway impact map displaying metabolite pathways that were significantly represented
  in the metabolomics data. Size of the circles indicate more metabolites representing
  a pathway. (O) Relative abundances of metabolites from the purine metabolism pathway.
  Red color indicates aged, blue indicates young and green indicates Irg1−/− samples.
  (P) Relative abundance of a metabolite mapped to glycine, serine, threonine metabolism.
  Red color indicates aged, blue indicates young and green indicates Irg1−/− samples.
  (Q) Relative abundance of a metabolite mapped to galactose metabolism. Red color
  indicates aged, blue indicates young and green indicates Irg1−/− samples. (R) Relative
  abundance of NAM. Red color indicates aged, blue indicates young and green indicates
  Irg1−/− samples. (S) Relative abundance of o-cresol sulfate. Red color indicates
  aged, blue indicates young and green indicates Irg1−/− samples. (T) Relative abundance
  of 13,14-Dihydroretinol. Red color indicates aged, blue indicates young and green
  indicates Irg1−/− samples. (U) Relative abundance of Docosahexaenoic acid. Red color
  indicates aged, blue indicates young and green indicates Irg1−/− samples. Data presented
  as mean ± SEM, n = 3 each group
