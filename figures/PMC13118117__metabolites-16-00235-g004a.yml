caption: 'Metabolomics analysis of KMLC group fermented milk: (A) PCA; (B) PLS-DA;
  (C) PLS-DA permutation test plot; (D) differential metabolite clustering heat map
  analysis; (E) Kyoto encyclopedia of genes and genomes (KEGG) pathway analysis of
  key metabolites. Notes: S0–S8 represented the samples from 0 h to 8 h in the fermentation
  process of KMLC fermented milk, respectively. (E) The horizontal coordinates indicate
  the negative logarithmic transformation of the p-value, and the vertical coordinates
  indicate the pathway name. The size of the circle indicates the count, i.e., the
  number of metabolites annotated to the pathway; the color of the circle corresponds
  to the corrected p-value, with red to blue being the more significant. Metabolites
  mapped to metabolic pathways were primarily classified under metabolism'
