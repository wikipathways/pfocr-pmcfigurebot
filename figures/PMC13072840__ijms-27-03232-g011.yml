figure_title: p53 activates caspase-3 via the mitochondrial pathway, which cleaves
  RelB.
caption: p53 activates caspase-3 via the mitochondrial pathway, which cleaves RelB.
  (a,b) Nutlin-3 (20 µM, 4 h) treated iMK2-KO cells have reduced levels of full-length
  Pro-caspase-3 and increased levels of cleaved Caspase-3 protein. (c,d) The appearance
  of RelB cleavage products (arrows) after Nutlin-3 (20 µM, 4 h) treatment in iMK2-KO
  cells can be blocked by the caspase-3 inhibitor z-DEVD-fmk (100 µM, 1 h), the pan-caspase
  inhibitor z-VAD-fmk (25 µM, 1 h), and (e,f) the inhibitor of p53 mitochondrial translocation
  Pifithrin-µ (10 µM, 1 h), but not by the p53 transcriptional inhibitor Pifithrin-α
  (10 µM, 1 h) in iMK2-KO cells. (b) Student’s t test, (d–f) 1W-ANOVA followed by
  Dunnett’s Multiple Comparison Test, mean ± SEM, ** p < 0.01, *** p < 0.001
