figure_title: Immunolabeling with inflammatory pathway antibodies for the control
  (CT) and pneumonia-induced groups (G2, G3, G4).
caption: Immunolabeling with inflammatory pathway antibodies for the control (CT)
  and pneumonia-induced groups (G2, G3, G4). In the negative control, the primary
  antibody was substituted with tris-buffered saline (TBS) (first row). In the CT
  (first column), concentrated and uniform labeling is visible in the apical portion
  of the bronchiole cells for the three antibodies, with only tumor necrosis factor-alpha
  (TNF-α) marking the alveoli. From infected group 2 onwards (second to fourth columns),
  uniform and diffuse labeling with anti-nuclear factor kappa B (NF-κB) (second row)
  was observed in the cytoplasm of bronchiole cells. Only from group 3 onwards is
  NF-κB marking visible in the alveoli. Anti-interleukin (IL)-6 (third row) starts
  to mark the alveoli from group 2 onwards, and continues to mark the apical section
  of the bronchiole cells up to group 4. TNF-α (fourth row) continues to mark both
  the bronchiole and alveoli in all groups analyzed
