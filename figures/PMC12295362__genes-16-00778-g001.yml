figure_title: Overview of the pathogenesis of aldosterone-producing adenomas (APAs)
  associated with somatic mutations KCNJ5 (1), ATP1A1 (2), ATP2B3 (3), CLCN2 (4),
  SLC30A1 (5), CACNA1D (6), CACNA1H (7), GNA11/Q (8), CTNNB1 (9), PRKACA (10), and
  CADM1 (11).
caption: Overview of the pathogenesis of aldosterone-producing adenomas (APAs) associated
  with somatic mutations KCNJ5 (1), ATP1A1 (2), ATP2B3 (3), CLCN2 (4), SLC30A1 (5),
  CACNA1D (6), CACNA1H (7), GNA11/Q (8), CTNNB1 (9), PRKACA (10), and CADM1 (11).
  Somatic mutations in KCNJ5, ATP1A1, and ATP2B3 impair ion transport, resulting in
  membrane depolarization and elevated calcium concentrations, which are the key drivers
  of aldosterone synthesis. Similarly, mutations in CLCN2 and SLC30A1 alter chloride,
  zinc, and sodium ion transport, indirectly potentiating calcium signalling. Calcium
  influx is also enhanced by activating mutations in voltage-gated calcium channels,
  CACNA1D and CACNA1H, contributing to the sustained stimulation of CYP11B2 expression.
  The constitutive activation of G-protein signalling due to GNA11 and GNAQ mutations,
  along with aberrant Wnt/β-catenin signalling from CTNNB1 mutations, leads to an
  increased transcription of CYP11B2 and Wnt/β-catenin target genes that promote cellular
  proliferation and differentiation. Likewise, activating mutations in PRKACA enhance
  the cAMP/PKA pathway activity and the transcription factor cAMP-response element-binding
  protein (CREB), leading to increased gene expression of PKA targets. Uniquely, CADM1
  mutations disrupt cell–cell communication via gap junctions, which is thought to
  regulate aldosterone production. Created with BioRender.com
