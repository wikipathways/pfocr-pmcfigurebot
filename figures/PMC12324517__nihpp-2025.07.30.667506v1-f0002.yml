figure_title: Dissecting HB tumor heterogeneity through subclustering and functional
  pathway analysis
caption: A. UMAP showing the Hepatocyte sub-clustering, with the upper-left UMAP colored
  in salmon to show which cells were selected for sub-clustering, and the larger right-hand
  UMAP showing the three sub-clusters that were derived using unsupervised clustering.
  B. Stacked proportional bar plot showing the prevalence of each Hepatocyte sub-cluster
  in background (left) and tumor (right) samples. All clusters add up to 100% for
  each condition. C. Dot plot showing average normalized expression (color) and the
  percentage of cells expressing the gene (dot size) for marker genes used to define
  the Hepatocyte sub-clusters. D. UMAP showing Cycling Hepatocyte sub-clustering,
  with the upper-left UMAP colored in gold to show which Hepatocyte sub-clusters were
  selected for further sub-clustering, and the larger right-hand UMAP showing the
  three resultant Cycling Hepatocyte sub-clusters. E. The same Cycling Hepatocyte
  sub-cluster UMAP plot colored by Seurat- derived S Score (top) and G2M Score (bottom),
  with darker blue indicating higher expression. F. Gene Set Enrichment Analysis (GSEA)
  plots showing a positive enrichment score in tumor cells compared to background
  for the ‘HALLMARK_MITOTIC_SPINDLE’ gene set and a negative enrichment score for
  the ‘HALLMARK_IL6_JAK_STAT3_SIGNALING’ gene set
