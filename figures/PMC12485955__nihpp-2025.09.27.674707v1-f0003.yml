caption: '(A) Heatmaps showing sample-wise correlations between inferred HIF1A activity
  and multiple molecular layers: ligands (L), receptors (R), pathways (P), TFs, target
  genes (TG), and drugs (D). The rightmost panels depict metaprogram proportions for
  each sample, providing spatial context for regulator activity. (B) Sample H&E-stained
  image of a GBM sample and metaprogram assignment (C) Spatial feature plots displaying
  the HIF1A, SOX2 TF activity, Hypoxia activity, mRNA expression of VEGFA, CAV1, and
  LDHA expression and bevacizumab and brolucizumab scores'
