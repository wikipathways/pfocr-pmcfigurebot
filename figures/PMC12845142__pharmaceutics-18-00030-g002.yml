figure_title: Clinical development status of the main cell-based therapies investigated
  for multiple sclerosis.
caption: 'Clinical development status of the main cell-based therapies investigated
  for multiple sclerosis. The figure illustrates the progression through regulatory
  phases (preclinical, Phase 1, Phase 2, and Phase 3) of four therapeutic approaches:
  autologous hematopoietic stem cell transplantation (AHSCT), mesenchymal stem cells
  (MSCs), neural stem cells (NSCs), and oligodendrocyte progenitor cells (OPCs). The
  schematic compares the level of clinical maturity of each strategy, highlighting
  that AHSCT is the most advanced along the regulatory pathway, whereas NSCs and OPCs
  largely remain at early stages of research. Created in BioRender Pro. Gomez Pinedo,
  U. (2025) https://BioRender.com/ybp1w3p'
