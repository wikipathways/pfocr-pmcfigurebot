figure_title: Effects of formulated ‘4-PBA E2 + NAC’ on reversal of PAO-induced unfolded
  protein response signaling pathway.
caption: Effects of formulated ‘4-PBA E2 + NAC’ on reversal of PAO-induced unfolded
  protein response signaling pathway. (A) Expression analysis of UPR signaling proteins
  ATF4, p-eIF2α, and CHOP by Western blot in the skin lysates obtained from the indicated
  treatment groups, showing β-actin was used as an endogenous control. (B) Histogram
  showing densitometry analysis of protein bands calculated by Image J software (version
  1.41o, Java 1.6.0_10) and presented in fold change. N = 3. (C) Immunohistochemistry
  of ATF4 in skin sections obtained from the indicated treatment groups. Scale bar
  50 µm. Red arrows indicated nuclear translocation and enhanced expression of ATF4
  in PAO-exposed skin epidermal cells. Treatment with foam formulated 4-PBA E2 + NAC
  significantly reduced PAO-induced expression and nuclear localization of ATF4 in
  skin epidermis. p < 0.05 *, p < 0.01 **, p < 0.001 ***, p < 0.0001 **** showed significance.
  ns—non-significance
