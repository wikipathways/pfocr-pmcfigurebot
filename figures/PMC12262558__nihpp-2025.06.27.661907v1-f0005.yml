figure_title: Strain-specific transcriptional responses in bystander cells.
caption: 'Strain-specific transcriptional responses in bystander cells. (A) Bar plot
  showing the number of significantly differentially expressed genes (DEGs) between
  EV-D68 strains 18952 and 23089 across bystander neurons, astrocytes, cycling astrocytes,
  and OPCs. DEGs were defined as adjusted p-value < 0.05 and log2FC > 0.25. B–D).
  Volcano plots displaying DEGs between 23089- and 18952-exposed bystander cells in
  neurons (B), astrocytes (C), and cycling astrocytes (D). Genes upregulated in strain
  23089 are shown in green, and those upregulated in strain 18952 are in orange; non-significant
  genes are shown in gray. Dashed lines indicate significance thresholds (adjusted
  p = 0.05 and log2FC = ±0.25). (E) Bar plot showing normalized enrichment scores
  (NES) from GSEA of OPC Oligo. bystander cells, comparing transcriptional profiles
  between strains 23089 and 18952. Despite the absence of individual DEGs meeting
  significance, GSEA revealed pathway-level differences. Bars are colored by the direction
  of enrichment: green for pathways enriched in 23089 and orange for pathways enriched
  in 18952'
