figure_title: P-glycoprotein-mediated lysosomal sequestration of doxorubicin.
caption: P-glycoprotein-mediated lysosomal sequestration of doxorubicin. Doxorubicin,
  a cationic anthracycline, is effluxed by Pgp transporters from the cytosol and redirected
  into the endosomal–lysosomal pathway through endocytosis. As endosomes mature into
  lysosomes (pH 4.5–5), the acidic environment promotes protonation and trapping of
  Doxorubicin, preventing its accumulation in the nucleus where it normally intercalates
  with DNA. This lysosomal sequestration contributes to multidrug resistance by reducing
  the cytotoxic availability of doxorubicin at its nuclear target. Created in BioRender.
