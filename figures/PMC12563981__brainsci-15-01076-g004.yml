figure_title: Potential mechanisms linking common pulmonary diseases to AD.
caption: Potential mechanisms linking common pulmonary diseases to AD. COPD may contribute
  to cerebral pathology through multiple mechanisms, including increased ROS, neuroinflammation,
  lipid metabolism disorders, mTOR pathway activation, DNA damage, mitochondrial dysfunction,
  and activation of the TLR4/NF-κB pathway. Asthma potentially impacts the brain via
  significant oxidative stress and the release of inflammatory mediators such as IL-6,
  IL-8, TNF-α, IL-4, IL-5, and IL-13. OSA could influence brain function through mechanisms
  such as accumulation of Aβ42 and tau protein, chronic hypoxia, neuronal damage,
  metabolic disorders, and dysregulation of miRNAs including miR-132-5p and miR-137-5p.
  Infectious pulmonary diseases (e.g., non-pneumonia, NP) may induce or exacerbate
  AD via pathways involving neuroinflammation, LPS-mediated effects, and aberrant
  expression of AD-related genes
