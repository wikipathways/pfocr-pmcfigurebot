figure_title: KPC tumor growth causes fiber-type remodeling in skeletal muscle
caption: '(A) Proportion of muscle fiber-type nuclei in snRNA-seq dataset. (B) Representative
  cross-sections of TA muscle from control and KPC tumor–bearing mice after immunostaining
  for myosin heavy chain (MyHC) isoforms to distinguish fiber types: Type IIa fibers
  (red), Type IIb fibers (green), and Type IIx fibers (black). Scale bar: 100 μm.
  (C) Quantification of fiber-type composition in TA muscle of control and KPC tumor–bearing
  mice. n = 4 per group. Data are presented as mean ± SEM. *P ≤ 0.05, values significantly
  different from control mice analyzed by unpaired Student’s t test. (D) Augur-based
  analysis of perturbation sensitivity of different fiber-type in skeletal muscle
  of control and KPC tumor–bearing mice. (E) Pseudotime trajectory and annotation
  of myonuclei subpopulations by UMAP. (F) UMAP visualization of module-specific gene
  expression across myonuclear clusters. (G) Enrichment analysis of the pathways associated
  with the preterminal/terminal stage gene modules'
