caption: 'Patient workflow under prostate cancer surveillance incorporating PSE: Illustration
  of a clinical decision-making pathway integrating the EpiSwitch® PSE blood test
  for patients with elevated PSA or abnormal DRE findings. Based on the PSE result,
  patients are stratified into low or high likelihood of prostate cancer (PCa). Those
  with a low-likelihood result may be observed or undergo additional non-invasive
  testing, with reevaluation at one year. Patients with a high-likelihood result are
  referred for multiparametric MRI (mpMRI) and, if indicated, MRI-guided or systematic
  prostate biopsy. This pathway supports shared decision making and more efficient,
  personalized care'
