figure_title: Network pharmacology-based prediction of compounds in JGT effective
  for muscle atrophy.
caption: 'Network pharmacology-based prediction of compounds in JGT effective for
  muscle atrophy. (A) The herb-compound–target network of JGT, where green triangle
  nodes represent herbs (2 nodes), orange diamond nodes represent compounds (16 nodes),
  and light blue circle nodes represent targets (206 nodes). (B) Gene Ontology Biological
  Process (GOBP) enrichment analysis of the 206 JGT-associated targets (top) and the
  compound–target network (bottom), focusing on 35 targets linked to the “Response
  to Oxidative Stress” (GO:0006979) pathway. (C) Overlap between JGT targets and mitochondria-related
  genes (52 overlapping targets) (top), along with the compound–target network of
  JGT compounds interacting with these overlapping mitochondrial targets (bottom).
  (D) Overlap between JGT targets and muscle atrophy-related genes (28 overlapping
  targets) (top), with the corresponding compound–target network of JGT compounds
  interacting with these overlapping muscle atrophy targets (bottom). The node sizes
  represent the degree centrality of each node in networks (B–D). (E) Total degree
  centrality of JGT compounds across the three networks (B–D): oxidative stress, mitochondrion,
  and muscle atrophy. Compounds highlighted in red are present at higher concentrations
  in JGT-E compared to JGT-W'
