figure_title: Interactions between TAMs and lymphoid cells in TME.
caption: 'Interactions between TAMs and lymphoid cells in TME. (A) Crosstalk of TAMs
  and T cells: TAMs inhibit the infiltration of CD8+ T cells, and suppress CD8+ CTLs
  via the inhibitory B7-H4/B7S1 and PD-L1/PD-1 pathways. CD169+ TAMs can recruit Treg
  cells to suppress CTLs. On the other hand, M1 TAMs induce the recruitment of tissue-resident
  memory CD8+ T cells via CXCL9 and fatty acids. M1 TAMs promote the proliferation
  and cytotoxicity of CD8+ CTLs by upregulating granzyme-B, TNF-α and perforin, and
  downregulating PD-1, Tim-3 and Lag-3. In addition, TAMs epigenetically modulate
  tumor-infiltrating T cells into an IL-10high/IFN-γlow, PD-1high phenotype. TAMs
  drive the differentiation of Th2, Th17 and Treg cells, and inhibit the polarization
  of Th1 cells via NLRP3 signals. IL-15Rα+ TAMs reduce the infiltration of CD8+ T
  cells by expressing IL-15Rc, while FOLR2+ TAMs interact with CTLs and prime effector
  CD8+ T cells. Reciprocally, CD4+ Th1 and NK-T cells induce the polarization of M1
  TAMs by secreting IFN-γ. CAR-T cells recruit peripheral F4/80lowLy-6C+ myeloid cells
  to the TME via secreting GM-CSF, and activate NO production and phagocytosis in
  F4/80high macrophages via secreting IFN-γ. In contrast, Treg cells support M2 TAMs.
  (B) Crosstalk of TAMs and B cells: CXCL12+ TAMs recruit PD-L1+ Breg cells via the
  CXCL12/CXCR4 axis. The M2 polarization of TAMs is promoted by B cell-derived GABA,
  Breg cell-secreted TGF-β, and B1 cell-derived IL-10 and TRIF/STAT1 pathway. Meanwhile,
  B cell-derived anti-tumor antibodies bind TAMs'' Fc receptors to induce ADCC towards
  tumor cells. (C) Crosstalk of TAMs and ILCs: TAMs induce ILC3 to produce IL-22 via
  secreting IL-7, thereby promoting tumor development. M1 TAMs promote the proliferation
  of ILC3s via secreting IL-23. TAMs inhibit the function of NK cells by TGF-β-dependent
  mechanisms. MACRO+ TAMs suppress tumoricidal NK cells. Reciprocally, ILC1s, ILC3s
  and NK cells drive M1 TAM polarization, while ILC2s drive M2 TAM polarization'
article_title: 'Focusing on the interplay between tumor-associated macrophages and
  tumor microenvironment: from mechanism to intervention'
