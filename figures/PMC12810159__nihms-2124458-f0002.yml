figure_title: Blocking palmitoylation at C91 allosterically affects C148 and inhibits
  STING in a context-dependent manner
caption: (A) Cartoon illustration of STING’s transmembrane domain with cysteine locations
  in the transmembrane and linker regions.(B) pIRF3 levels in cells pre-trated with
  5μM H-151, then stimulated with 100μM cGAMP for 2h. Jurkat cells show pSTING levels.
  Data normalized to corresponding cGAMP treatment alone across six cell lines (mean
  +/− SEM).(C) Dimer-to-monomer band ratio in U937 cells pre-treated with DMSO or
  5 μM H-151 for 2 h, followed by 100 μM cGAMP for 2 h. Normalized to vehicle +cGAMP,
  averaged over three experiments (mean ± SEM).(D) Blue-Native PAGE of U937 cells
  treated with or without H-151, followed by 100 μM cGAMP for the indicated times.
  Representative of three independent experiments.(E) Schematic of whole-proteome
  reactive cysteine profiling workflow.(F) Chemical structures of four cysteine-reactive
  stereoisomers, compounds 57–60.(G) C91 reactivity in THP-1 cells relative to DMSO
  control upon treatment with 10 μM of the indicated compound alone or with 100 μM
  cGAMP. Data (mean ± SEM) from two biological replicates.(H) C148 reactivity in THP-1
  cells under different compound and cGAMP treatments (mean ± SEM, two replicates).(I)
  STING pathway activation via pIRF3 in U937 cells pre-treated with 10 μM of compounds
  57–60, then stimulated with cGAMP. Representative of three independent experiments,
  dotted line indicates omitted irrelevant data.(J) RT-qPCR of cytokine mRNA levels
  in PBMCs treated with cGAMP for ≥8 h before RNA extraction (mean ± SEM, three replicates).(K)
  IFNb-luciferase assay for interferon response in HEK293T-Dual reporter cells transfected
  with STING variants and stimulated with cGAMP for 20 h (mean ± SEM, ≥three replicates).(L)
  Palmitoylation assay in HEK293T cells transfected with STING variants, stimulated
  with cGAMP for 2 h. Representative of at least three independent experiments, dotted
  line indicates omitted irrelevant data
