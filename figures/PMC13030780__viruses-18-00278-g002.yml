figure_title: L-HDAg-associated pathogenic mechanisms.
caption: L-HDAg-associated pathogenic mechanisms. (A) L-HDAg increases serum response
  factor (SRF) expression that leads to improved recognition of serum response element
  (SRE) and therefore, transcription of c-fos proto-oncogene. (B) Upregulation of
  IKK-α by L-HDAg leads to nuclear factor-κB light polypeptide gene enhancer in B-cells
  inhibitor alpha (IκBα) phosphorylation and nuclear factor-κB (NF-κB) pathway activation.
  (C) Binding of L-HDAg to sterile alpha motif domain containing 3 (SMAD3) to activate
  the transcription of TWIST protein, promoting epithelial–mesenchymal transition
  (EMT) and consequently fibrosis. (D) Upregulation of casein kinase 2 alpha 1 (CSNK2A1),
  the catalytic subunit of casein kinase 2 (CK2). This activation participates in
  the dysregulation of major signaling pathways. (E) L-HDAg induces NADPH oxidase
  4 expression, leading to increased reactive oxygen species (ROS) production. Figure
  created in BioRender. Lupberger, J. (2026) https://BioRender.com/ixoylxf (accessed
  on 1 January 2026)
