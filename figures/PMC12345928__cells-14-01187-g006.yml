figure_title: A schematic representation of CaMKII participation in the mechanism
  underlying the antidepressant-like effects of ketamine/melatonin.
caption: A schematic representation of CaMKII participation in the mechanism underlying
  the antidepressant-like effects of ketamine/melatonin. Melatonin (MEL) activates
  MT1 and MT2 receptors, leading to the production of inositol triphosphate (IP3)
  and diacylglycerol (DAG). These molecules, in turn, increase intracellular Ca2+
  concentrations and activate protein kinase C (PKC), respectively. Ca2+ binds to
  calmodulin (CaM), activating it. PKC phosphorylates CaM, enabling its translocation
  to other subcellular compartments to interact with target proteins. One such target
  is calmodulin kinase II (CaMKII). CaM binds to CaMKII and activates it, inducing
  autophosphorylation. Activated CaMKII phosphorylates proteins such as MAPs or associates
  with actin to enhance dendrite growth and neuroplasticity. Melatonin (MEL) also
  induces CaMKII translocation to the nucleus, where CaMKII expression is upregulated.
  On the other hand, ketamine (KET) acts by antagonizing NMDA receptors on GABAergic
  interneurons, promoting glutamate release. This glutamate release depolarizes the
  postsynaptic membrane, allowing Ca2+ entry and increasing intracellular Ca2+ levels,
  which activate CaM. CaM binds to α-CaMKII, and the active α-CaMKII remains in the
  cytoplasm, contributing to dendrite growth, neurogenesis, and neuronal connectivity.
  In the presence of luzindole (LUZ), a non-selective MT1 and MT2 antagonist, nuclear
  translocation and the increase in the relative amount of CAMKII are blocked. Black
  continuous arrows depict the common downstream protein activation. The red continuous
  and dashed arrows indicate protein nuclear translocation. A vertical line head arrow
  means inhibition of a downstream pathway. A gray dashed rectangle illustrates the
  general signaling pathway with ketamine in the neuron. And the red dashed rectangle
  illustrates the specific MT2 receptor signaling pathway
