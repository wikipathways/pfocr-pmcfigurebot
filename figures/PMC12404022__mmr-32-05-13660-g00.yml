figure_title: Mechanism of DNA damage repair by the FA pathway.
caption: Mechanism of DNA damage repair by the FA pathway. By targeting FANCM, FAAP24
  forms the FANCM-FAAP24 complex, which recognizes DNA ICL and promotes the recruitment
  of the FA core complex to the DNA damage site. Subsequently, the FA core complex
  and FANCT mediate monoubiquitination of the ID2 complex. Mono-ubiquitinated ID2
  activates the downstream FA gene to coordinate nucleolytic incision, TLS and HR,
  the three key DNA repair processes that ultimately complete DNA damage repair. By
  Figdraw (www.figdraw.com). FA, Fanconi anemia; ICL, interstrand cross-linking; ID2,
  FANCI-FANCD2; TLS, trans lesion synthesis; HR, homologous recombination
