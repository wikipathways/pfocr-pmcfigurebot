figure_title: GATA2 specifically regulates the NF-kB signaling pathway by enhancing
  transcription of IL-1β in KRAS-mutated BTC cells.
caption: GATA2 specifically regulates the NF-kB signaling pathway by enhancing transcription
  of IL-1β in KRAS-mutated BTC cells. (A) qRT-PCR was performed in control or GATA2
  in siRNA-transfected RBE, NOZ, CCLP1, GBC-SD and HIBEC cells for IL-1β. (B) ChIP
  was performed for IgG and GATA2 in RBE and NOZ cells and PCR was performed using
  primers targeting IL-1β promoter region. (C) Dual-Luciferase assays were performed
  in RBE and NOZ cells with different treatments. (D) RBE, NOZ, CCLP1, GBC-SD and
  HIBEC were transfected with control siRNA, or GATA2 siRNA and processed 72 hours
  later for western blotting for GATA2, IL-1β, NF-kB p50, NF-kB p65, IkB, β-actin
  and Lamin B1 in the cytoplasm and/or nucleus. (E) B6-Kras-LSL-G12D mice that have
  extensive tumor burden were intravenously injected with disulfiram or PBS. After
  4 weeks of treatments, animals were sacrificed, and western blotting was performed
  on tumor tissues for GATA2, IL-1β, NF-kB p50, NF-kB p65, IkB, β-actin, and Lamin
  B1 in the cytoplasm or/and nucleus. (F) IL-1β content in tumor tissues of mice treated
  with disulfiram or PBS for 4 weeks was analyzed by ELISA. Error bars represent SD
  (n=3 in vitro, n=5 in vivo). BTC, biliary tract cancer; HIBEC, human intrahepatic
  biliary epithelial cell line; IL-1β, interleukin-1β; PBS, phosphate buffer saline.
  All **P<0.01
