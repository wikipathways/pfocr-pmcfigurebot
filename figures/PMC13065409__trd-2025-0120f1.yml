figure_title: Illustration of post-tuberculosis (TB) sequelae and their interrelationships.
caption: 'Illustration of post-tuberculosis (TB) sequelae and their interrelationships.
  This diagram depicts the range of potential long-term health consequences following
  TB, including pulmonary, cardiovascular, neurological, and musculoskeletal complications.
  The unidirectional arrows indicate possible causal or contributory pathways between
  conditions; for example, post-TB lung damage and chronic obstructive pulmonary disease
  (COPD) may exacerbate cardiovascular strain, while cardiovascular impairment may
  promote atherosclerotic changes in cerebral vessels, contributing to secondary cerebrovascular
  disease. Neurological impairment can further limit mobility and functional capacity.
  Together, these overlapping sequelae contribute to impaired psychological, social,
  and economic wellbeing in TB survivors. The figure highlights the interconnected
  and multisystemic nature of post-TB disease and underscores the need for comprehensive,
  multidisciplinary follow-up care. MTBc: Mycobacterium tuberculosis complex'
