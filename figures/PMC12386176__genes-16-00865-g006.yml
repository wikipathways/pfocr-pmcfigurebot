figure_title: Expression of genes and proteins related to fatty acid metabolism.
caption: 'Expression of genes and proteins related to fatty acid metabolism. (A) No
  differences were detected in the expression of Gpam in the cerebral cortex of NPC
  mice. (B,C) The genes Smpd1 and Abcd1 were found under-expressed in the NPC group.
  (D,E) The SGPL1 and SPHK1 proteins did not differ in NPC mice from those of the
  WT mouse group. (F,G) Elevated levels of the proteins ACOX1 and ACAA1 were found
  in the cerebral cortex of NPC mice. (H) Altered fatty acid beta-oxidation pathway
  in NPC. Overexpression (Up red arrow), Underexpression (Down red arrow). Gapdh/GAPDH
  was used as a normalization gene and protein expression. A T-Student test was performed
  to determine statistical significance. The normality of data was determined using
  the Shapiro–Wilk normality test and the Rout outlier test to detect outliers. **
  p ≤ 0.01, * p ≤ 0.05. ns: not significant'
