figure_title: NAD+ biogenesis and its transcriptional regulation in S.
caption: NAD+ biogenesis and its transcriptional regulation in S. sobrinus. Pathway
  diagram showing biochemical transformations (arrows) of precursors and intermediates
  (shown via the same abbreviations as in the text). In the Nam salvage pathway (salvage
  I pathway), NaMN is synthesized from NA and Nam precursors that are taken up by
  the niacin transporter (NiaY). The Universal NaMN-to-NAD pathway utilizes nicotinate
  mononucleotide adenylyltransferase (nadD) and NAD synthetase (nadE). In the salvage
  III pathway, NAD+ is synthesized from the exogenous RNam precursor delivered by
  the RNam transporter (pnuC) via consecutive reactions catalyzed by two separate
  domains of NadR, nicotinamide mononucleotide adenylyltransferase (nadRAT), and nicotinamide
  riboside kinase (nadRK). The purple lines point to regulated genes (NrtR regulon
  members)
article_title: 'Regulation of NAD+ Homeostasis by SsNrtR in Streptococcus Sobrinus:
