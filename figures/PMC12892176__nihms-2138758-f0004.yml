figure_title: Adenosine restores injury resistance in mtDNA mutated animals via adenylate
  kinase
caption: '(A) Schematic depicting time points for evaluation after kidney ischemia
  reperfusion injury (IRI) in PolgD257A mice vs. littermate wildtype control Polg+/+
  mice receiving adenosine (Ado, 17.5 mg/kg IP × 1) ± adenylate kinase inhibitor (AP5A,
  5mg/kg IP × 1) at the time of surgery. (B) PAS (left 2 columns) and picrosirius
  red (right 2 columns) stained representative photomicrographs of kidney cortex from
  indicated conditions with scale bar 50 μm. (C) blinded quantification of histological
  tubular injury. (D) serum creatinine (SCr). (E) blinded quantification of histological
  fibrosis. (F) PCR of kidney cortex mRNA for fibrosis markers fibronectin (Fn), collagen1α1
  (Col1α1), and α-smooth muscle actin (αSMA). (G) UMAP plots of single nucleus RNA
  sequencing from the following kidneys: Polg+/+ undergoing sham surgery and treated
  with vehicle (left); PolgD257A undergoing IRI and treated with vehicle (middle);
  and PolgD257A undergoing IRI and treated with adenosine (right). (H) Cell population
  proportions from G: CD, collecting duct; IC intercalated cell; PC principal cell;
  DCT distal convoluted tubule, Endo endothelial cell; LOH Loop of Henle; Macro, macrophage;
  Mesan, mesangial; Podo, podocyte; PT, proximal tubule; RV, renal vesicle. (I) Pathway
  analysis results with net enrichment score (NES) PT population from kidneys: PolgD257A
  undergoing IRI and treated with adenosine vs. PolgD257A undergoing IRI and treated
  with vehicle. *p < 0.05, **p < 0.01, ***p < 0.001 as indicated'
article_title: Reversible compromise of physiological resilience by accumulation of
  heteroplasmic mtDNA mutations
