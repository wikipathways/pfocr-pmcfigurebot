figure_title: Immune microenvironment of HCC.
caption: 'Immune microenvironment of HCC. APCs serve as an important link between
  the innate and adaptive immune responses. Dendritic cells are specialised APCs,
  which take up tumour antigens as peptide fragments. Antigen is displayed on MHC
  and recognised by TCR on CD4+ T cells. Interaction between B7 protein (CD80/86)
  on dendritic cells and CD28 on CD4+ T cells produces a costimulatory signal, whereas
  binding B7 protein with CTLA-4 results in an inhibitory response. CTLA-4 is also
  constitutively expressed on Tregs and helps maintain immune tolerance. A CTLA-4-blocking
  antibody would enhance CD4+ T cell activation and suppress the activity of Tregs.
  CD8+ T cells recognise tumour antigens presented by MHC. CD8+ T cells mediate cytotoxicity
  through exocytosis and the Fas/FasL pathway. Activated CD8+ T cells display PD-1
  on their surface, which interacts with PD-L1 and PD-L2 on tumour cells to generate
  coinhibitory signals. PD-1- and PD-L1-blocking antibodies enhance the activity of
  CD8+ T cells in peripheral tissues and inside HCC. VEGF activation promotes angiogenesis,
  leading to HCC progression and metastasis. CTNNB1-mutated HCC with Wnt/β-catenin
  pathway activation has been reported to be resistant to immunotherapy. Dysregulated
  Wnt/β-catenin signalling is a major contributor to MASLD-HCC pathogenesis. Aberrant
  activation of PI3K-AKT-mTOR and RAS-MAPK pathways is implicated in HBV-related HCC.
  Treg, MDSC, and TAM (the M2 subtype) are responsible for the immunosuppressive tumour
  microenvironment in HCC. Abbreviations: antigen-presenting cell (APC), anti-vascular
  endothelial growth factor (anti-VEGF), cytotoxic T lymphocytes (CD8+ T cells), cytotoxic
  T-lymphocyte-associated protein 4 (CTLA-4), helper T cells (CD4+), myeloid-derived
  suppressor cells (MDSC), natural killer cells (NK cells), programmed cell death
  ligands 1 (PD-L1), programmed cell death protein-1 (PD-1), regulatory T cell (Treg),
  tumour-associated macrophage (TAM). Created 2025. https://BioRender.com/27hw1dt
  (accessed on 18 November 2025)'
