figure_title: TC with fAD neurons reduces spine density and exacerbates inflammatory
  signatures in microglia
caption: (A–C) fAD or isogenic wild-type (WT) iNs were co-cultured with WT iAs and
  iMGs. (B and C) Representative immunostaining of iNs (TUJ1, magenta), iMGs (IBA1,
  cyan), iAs (CD44, green), and nuclei (DAPI, blue). Scale bars, 50 μm. See Figures
  S5A–S5F for cell-type proportions and additional images across WT and fAD TCs.(D
  and E) Secreted Aβ42 and Aβ40 (normalized to TUJ1) in WT versus fAD TC and iN MC,
  relative to WT TC (N = 2 genetic backgrounds for glia, 3 differentiations, and 2–4
  wells/differentiation).(F and G) Representative WB (one genetic background, technical
  replicates from a single differentiation) of phosphorylated tau (PTAU202/205) and
  total tau in WT and fAD TCs and MCs, with PTAU:TAU ratios normalized to WT TC (N
  = 2 genetic backgrounds for glia, 3 differentiations, and 2–4 wells/differentiation).(H)
  scRNA-seq of WT and fAD iNs in TCs with WT iAs/iMGs. UMAP plots of iMGs, iAs, and
  iNs are colored by WT versus fAD culture identity (one genetic background). See
  Figures S6A and S6B for labeling by cluster index and fraction of each cluster based
  upon culture identity.(I) Dot plot showing significantly enriched GO pathways in
  iAs and iMGs comparing fAD iN TC and WT iN TC within each cell type. Input data
  are DEGs identified in each cell type, comparing fAD to WT iN TCs. Dots are sized
  based on the number of DEGs in the indicated pathway and colored based on adjusted
  p value. Complete dataset can be found in Table S6.(J) Dendritic spine density in
  WT versus fAD iN TCs labeled with DiI. Data are normalized to WT TCs (N = 3 differentiations,
  2 genetic backgrounds, and 2–3 wells/differentiation), with blinded analysis. Each
  dot represents the average of five dendrites per well. Scale bar, 5 μm.(K) Gene-concept
  network of leading-edge genes in the ‘‘inflammatory response’’ pathway, upregulated
  in microglia co-cultured with fAD iNs (from scRNA-seq in H and I).Data are the mean
  ± SEM; mixed-effects analysis. ****p < 0.0001, **p < 0.01, *p < 0.05, and ns, not
  significant
article_title: Astrocyte induction of disease-associated microglia is suppressed by
  acute exposure to fAD neurons in human iPSC triple cultures
