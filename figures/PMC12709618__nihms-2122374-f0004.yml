figure_title: NAT10 depletion decreases global histone acetylation
caption: (A) Schematic of LC-MS-based identification of NAT10 interaction partners
  and acetylated lysine enrichment analysis in Nat10 KO 4T1 cells. Created with Biorender.com.
  (B) GSEA analysis of NAT10 coimmunoprecipitating proteins in 4T1 cells. (C) Key
  GSEA pathways enriched among NAT10-interacting proteins. (D) Volcano plot of nuclear
  proteome-normalized acetylated peptides in Nat10 KO 4T1 cells. (E) Venn diagram
  of NAT10 interaction partners and proteins with decreased acetylation in Nat10 KO
  4T1 cells. (F) Co-IP of acetylated histones in Nat10 KO 4T1 cells. (G) Western blot
  of various histone modifications in Nat10 KO 4T1 cells. In vitro histone acetyltransferase
  (HAT) assay of (H) histone H4 and (I) H3 variants acetylation in the presence of
  recombinant human NAT10 and p300. (J) Western blot of H3K27ac and H4K20ac in 4T1
  cells treated with either A-485) or dCBP-1
