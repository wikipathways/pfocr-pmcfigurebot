figure_title: Cytoskeletal tension and the non-canonical NF−κB pathway regulate matrix
  stiffness-dependent inflammatory responses in gingival fibroblasts (GFs)
caption: '(A) Representative confocal immunofluorescence images showing F-actin organization
  (Phalloidin, green) and nuclear morphology (DAPI, blue) in GFs cultured on hydrogels
  with increasing stiffness (G′: 0.75, 1.5, and 2.0kPa). (B) Quantification of nuclear
  sphericity confirms the stiffness-dependent nuclear condensation observed in GFs.
  (C) Representative images and (D) quantification of cell length in GFs following
  treatment with the non-muscle myosin II inhibitor Blebbistatin (Blebb) or the ROCK
  inhibitor Y-27632. (E) ELISA quantification of IL−6, IL−8, and CCL−2 secretion from
  TLR2-activated GFs treated with cytoskeletal inhibitors. (F) Schematic representation
  of the proposed mechanism: ECM stiffness and TLR2 signaling converge to regulate
  non-canonical NF−κB signaling in GFs. (G) Representative immunofluorescence images
  and (H) quantification of the Mean Fluorescence Intensity (MFI) of nuclear-localized
  phosphorylated RelB (Ser552) in cells cultured in soft versus stiff hydrogels. (I)
  ELISA quantification of IL−6, IL−8, and CCL−2 secretion from TLR2-activated GFs
  cultured in soft or stiff matrices with or without IKK inhibition. Scale bars are
  as indicated. Data are shown as mean ± SD. P-values from statistical tests are indicated'
article_title: Matrix Stiffness Governs Fibroblast-Driven Immune Homeostasis in Gingival
  Tissues
