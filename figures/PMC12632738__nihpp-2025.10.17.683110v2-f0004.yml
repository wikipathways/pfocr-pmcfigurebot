figure_title: CT specific pathway and LR analysis
caption: (A) One-vs-all testing of MEs in CT relative to the rest of the tumor. Circles
  marked “x” where FDR > 0.05. (B) Coefficients from mixed effect modeling of ME against
  IVY region assignment, ME change shown in relation to CT level. “*” where FDR <
  0.05. (C) Top pathway terms for 5 most upregulated modules in the CT. (D) Top drugs
  by significance of gene target enrichment for 5 most upregulated modules in CT.
  (E) CellChat communication scores for top LR pairs whose spatial co-expression is
  associated with CT. Note, as score is dependent on expression values, scoring is
  relative across cell type combinations and LR pairs. (F) T-values from lr-module
  regression specific to CT LR pairs. Modules shown are differentially expressed in
  CT. (G) Spatial plots of IVY region assignment and select LR coexpression and ME
  scores. (H) Network visualization of top 10 hub genes for the 5 most upregulated
  modules in CT
article_title: Spatial transcriptomics of glioblastoma defines biologically and clinically
