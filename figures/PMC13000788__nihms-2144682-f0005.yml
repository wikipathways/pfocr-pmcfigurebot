figure_title: Senescent hepatocytes lose mature functions and promote maladaptive
  repair in patients with ALD
caption: '(A, B) GSVA enrichment scores of AHGS and SHGS gene signatures across bulk
  RNA-seq datasets: GSE167308 (5 Ctrl, 7 AC, 7 AH), GSE142530 (12 Ctrl, 6 AC, 10 AH),
  GSE143318 (7 Ctrl, 5 AC, 13 AH), and GSE155907 (4 Ctrl, 5 AH). (C) UMAP plots showing
  SHGS+ hepatocytes in unaffected, AC, and SAH livers. (D) Pathway enrichment analysis
  of SHGS+ hepatocytes, highlighting activated and suppressed Hallmark pathways. (E)
  Representative IHC staining of p21 and p16 in healthy, AC, and AH livers. (F) Western
  blot analysis of p16 in normal and AH livers. Boxplots show the upper quantile (75%),
  median (50%), and lower quantile (25%) of the overall data distribution. p-values
  were calculated using two-sided Wilcoxon’s rank-sum test in (A, C, D, E, G), Pearson’s
  correlation test in (B), and paired t-test in (F). Boxplots show the upper quantile
  (75%), median (50%), and lower quantile (25%) of the overall data distribution.
  p-values were calculated using two-sided Wilcoxon’s rank-sum test in (A, B), and
  two-sided permutation test, then adjusted for multiple comparison testing using
  the Benjamini-Hochberg method in (D),'
