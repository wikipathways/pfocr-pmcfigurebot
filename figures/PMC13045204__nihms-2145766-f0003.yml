figure_title: Comparative analysis between MD and JPS
caption: '(A) Ingenuity pathway analysis (IPA) performed using genes that are expressed
  higher than NL in both MD and JPS groups (485 genes with log2 (fold change) > 1).
  (B) Volcano plot of differentially expressed genes between MD and JPS (cutoff range:
  −1 < log2 (fold change) < 1). (C) Graphical network summary of the upregulated genes
  involved in canonical signaling pathways (marked as CP) from MD. Orange-colored
  nodes and lines show predicted activation in the network. (D) KEGG 2021 human canonical
  signaling pathway analysis for genes upregulated in MD (Enrichr: https://maayanlab.cloud/Enrichr/).
  Orange-colored bars represent signaling pathways that are not shown in common canonical
  pathways in Figure 3A. NL, normal; MD, Ménétrier’s disease; JPS, juvenile polyposis
  syndrome'
