caption: Functional validation of THPO in gastric cancer cell migration and EMT pathway.
  (a) Western blot confirming the knockdown efficiency of THPO in MKN-45 cells after
  transient transfection with siRNA targeting THPO. (b) Transwell migration assay
  demonstrating that THPO knockdown significantly reduces the migratory capacity of
  MKN-45 cells. (c–f) Results of qPCR reveal that THPO knockdown leads to a marked
  decrease in the expression of key EMT-related genes
