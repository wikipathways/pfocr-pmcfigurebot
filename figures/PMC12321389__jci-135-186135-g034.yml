figure_title: Excessive CXCL10 secreted by SPRY1-deficient keratinocytes promotes
  psoriatic arthritis–like inflammation
caption: '(A) Network of representative terms of all epidermal DEGs and all dermal
  DEGs (Spry1-cKO vs. control) commonly enriched by Metascape (P < 0.01). (B) Heatmap
  of top 10 upregulated chemokine genes in epidermis and dermis of Spry1-cKO mice
  (adjusted P < 0.05 and |log2FC| > 0.5, n = 3). (C–E) CXCL10 gene expression in human
  datasets: normal vs lesional epidermis (psoriasis, GSE166388); lesional vs nonlesional
  skin (PsA, GSE205748); and comparison across psoriasis, PsA, and ankylosing spondylitis
  (GSE186063). (F–H) ELISA quantification of CXCL10 in plasma, periarticular tissue,
  and epidermis of back skin from control and Spry1-cKO mice (n = 4). (I) Relative
  mRNA expression of Cxcl10 in mouse keratinocytes (n = 4). (J) Flow cytometric histograms
  and quantification of CXCL10 MFI of CD45–K14+ mouse keratinocytes (n = 4). (K) ELISA
  quantification of CXCL10 in supernatant of mouse keratinocytes (n = 4). (L) Immunoblotting
  analysis of protein levels associated with JAK1/2/STAT1 pathway in keratinocytes
  (left) or NHEKs transfected with siSPRY1 (right), both treated with 50 ng/mL recombinant
  IFN-γ for 24 hours (n = 3). ELISA quantification of CXCL10 in the supernatant of
  keratinocytes (n = 3). (M–P) Representative macroscopic views (M), H&E staining
  (scale bar: left, 500 μm; right, 250 μm) (N), Safranin O-Fast green staining (scale
  bar: 100 μm) (O), and TRAP staining (scale bar: 100 μm) (P) of paws from age- and
  sex-matched Spry1-cKO mice treated with anti-CXCL10 antibody and isotype antibody
  (IgG). Quantification shown below (n = 4). Data are shown as mean ± SEM. P values
  determined using 2-tailed unpaired Student’s t test (C, right panel of E and F–K,
  lower left panel of L, and M–P), 2-tailed paired Student’s t test (D, middle panel
  of E, lower right panel of L), and 1-way ANOVA (left panel of E). *P < 0.05, **P
  < 0.01, ***P < 0.001, ****P < 0.0001'
article_title: CXCL10 secreted by SPRY1-deficient epidermal keratinocytes fuels joint
  inflammation in psoriatic arthritis via CD14 signaling
