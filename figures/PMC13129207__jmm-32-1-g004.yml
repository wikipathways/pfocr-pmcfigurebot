figure_title: 'Cross-domain feedback loops connecting menopausal symptoms to healthspan
  outcomes. Vasomotor symptoms can contribute to sleep disruption and mood distress,
  which may reduce activity and adherence to healthy behaviors. These shifts can worsen
  cardiometabolic risk and reinforce overall symptom burden during the menopausal
  transition. Converging pathways may impair function and QoL, underscoring the rationale
  for integrated care targeting symptoms, sleep, mood, and lifestyle simultaneously.
  VMS: vasomotor symptoms, QoL: quality of life'
