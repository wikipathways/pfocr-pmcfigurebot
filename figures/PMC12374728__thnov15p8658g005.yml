figure_title: Proteomic analysis and pathway validation.
caption: Proteomic analysis and pathway validation. (A) Volcano plot of the differentially
  expressed proteins in HK-2 cells after stimulation with H2O2 and treatment with
  FD@BSA. (B) Localization analysis of the differentially expressed proteins in HK-2
  cells after stimulation with H2O2 and treatment with FD@BSA. (C) Pathway enrichment
  analysis. (D) The most significant module, which included 7 hub genes. (E) Heatmap.
  (F, G, H, I, J) WB analysis of the expression of key proteins involved in mitochondrial
  autophagy and several inflammation-related signaling pathways and the corresponding
  quantitative analysis. The data are presented as the means ± SD (n = 3). Statistical
  significance was determined by ANOVA. *p < 0.05, **p < 0.01, ***p < 0.001; ns, not
  significant
