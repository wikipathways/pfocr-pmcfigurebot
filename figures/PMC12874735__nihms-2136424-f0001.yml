figure_title: Comparison of machine learning model performance across evaluation metrics.
caption: Comparison of machine learning model performance across evaluation metrics.
  Panels A and B present the results of four models-Support Vector Machine (SVM),
  Random Forest, XGBoost, and Multi-Layer Perceptron (MLP)-evaluated using Precision,
  F1-Score, Ranking Loss, and ROC-AUC metrics. For each model, results from cross-validation
  (green bars) and independent test sets (orange bars) are shown. (A) Performance
  on the dataset containing 10 pathways. (B) Performance on the dataset after categorizing
  the 10 pathways into three branches
