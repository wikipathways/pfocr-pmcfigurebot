figure_title: Indirect and direct reprogramming pathways.
caption: Indirect and direct reprogramming pathways. Indirect reprogramming involves
  the conversion of mature cells (eg, fibroblasts) into an intermediate iPSC. iPSCs
  are then treated with reprogramming factors to differentiate into a desired target
  cell type (eg, endothelial cells and neurons). Direct reprogramming, or transdifferentiation,
  methods harness reprogramming factors to convert mature cells into target cell types
  without inducing a pluripotent intermediate state. Direct reprogramming is considered
  safer than indirect reprogramming because it bypasses the generation of intermediary
  pluripotent stem cells, which are inherently unstable and difficult to control in
  vivo. This reduces the risk of unintended differentiation, tumor formation, or other
  adverse effects, making direct reprogramming a more targeted and predictable therapeutic
  strategy
