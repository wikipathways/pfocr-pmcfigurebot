caption: Transcriptomic and proteomic profiling of gastrocnemius muscle in ovariectomized
  and control Wuding hens at 160 days of age. (A,B) Differentially expressed genes
  (DEGs) identified by transcriptomic analysis (A) and their normalized expression
  levels (B). (C,D) Differentially expressed proteins (DEPs) identified by proteomic
  analysis (C) and their relative abundance (D). (E) Selection of key genes based
  on cross-omics integration. (F) Protein–protein interaction (PPI) network analysis
  of 16 representative genes. (G) Enrichment of signaling pathways associated with
  key genes. (H) Correlation analysis among the enriched pathways
