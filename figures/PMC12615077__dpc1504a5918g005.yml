figure_title: GRWD1 promotes the ability of proliferation, survival and invasion in
  melanoma cells through the activation of NF-κB pathway.
caption: GRWD1 promotes the ability of proliferation, survival and invasion in melanoma
  cells through the activation of NF-κB pathway. Proposed mechanism underlying GRWD1-mediated
  melanoma progression. GRWD1 enhances NF-κB signaling, which transcriptionally upregulates
  Bcl-2 and activates Src. NF-κB also induces MDM2 expression, promoting p53 degradation.
  The downregulation of p53 relieves transcriptional repression of Bcl-2, further
  supporting cell survival and proliferation. This GRWD1–NF-κB–MDM2/p53–Bcl-2 axis
  contributes to melanoma pathogenesis. Arrows represent activation (solid) and inhibition
  (dashed)
