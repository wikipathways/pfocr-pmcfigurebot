caption: Transcriptomic profiling and functional enrichment of differentially expressed
  genes (DEGs) in JG88 and T608 under drought stress. (a,b) Venn diagrams illustrating
  the distribution of DEGs in (a) T608 and (b) JG88 across three time points. (c,d)
  KEGG pathway enrichment analysis of DEGs in (c) T608 and (d) JG88. (e,f) The top
  10 significantly enriched KEGG pathways for (e) T608 and (f) JG88. Red boxes highlight
  pathways common to both genotypes. (g,h) Gene Ontology (GO) term enrichment analysis
  for (g) T608 and (h) JG88
