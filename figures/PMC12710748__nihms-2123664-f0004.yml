figure_title: Roles of LpxC and RfaE in the biosynthesis of lipopolysaccharide (LPS)
caption: LpxC catalyzes the first committed step in Lipid A biosynthesis from UDP-GlcNAc.
  Lipid A then undergoes a series of modifications that include the addition of 3-deoxy-D-manno-octulosonic
  acid (Kdo) and heptose residues which together are components of the LPS core oligosaccharide.
  LPS biosynthesis is completed by the addition of the O-antigen to the core oligosaccharide.
  Heptose sugars are added from the precursor ADP-L-glycero-D-manno-heptose which
  is synthesized through a pathway that includes the bifunctional enzyme RfaE. Defects
  in the biosynthesis of the precursor or its incorporation into LPS result in the
  deep-rough phenotype.32
