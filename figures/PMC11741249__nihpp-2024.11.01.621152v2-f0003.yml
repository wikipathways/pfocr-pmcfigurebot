figure_title: Pathway analysis suggests differential involvement of TM cell subtypes
  in extracellular matrix regulation, growth factor signaling, and actin-binding
caption: (A-B) Molecular comparison of all three TM cell subtypes to all other sequenced
  cells using gene ontology (GO) of differentially expressed genes (DEGs). The top
  five most significant pathways as well as three additional pathways of interest
  are shown for each indicated comparison (adjusted P values, X-axis was cutoff at
  P < 1E-10). GSEA analysis was also used to assess the enrichment or underrepresentation
  of these GO pathways with GSEA scores color coded on the GO charts above. Pathways
  significantly different by GSEA analysis are indicated by asterisks. Overall, TM
  cells have over-representation of various extracellular matrix (ECM) molecules/
  pathways including collagens, glycosaminoglycans, and integrins compared to non-TM
  cells. Growth factor signaling is also enriched in TM cells compared to other cell
  types. (C-D) When comparing TM cell subtypes, TM1 cells are further enriched for
  ECM molecules such as collagens, glycosaminoglycans, and integrins as well as TGF-β
  signaling. (E-F) TM2-enriched ECM pathways include glycosaminoglycan binding and
  the laminin complex. TM2 cells are also enriched for receptor-ligand signaling and
  insulin growth factor binding. (G-H) Actin-binding and mitochondrial metabolism
  genes are enriched in TM3 cells. ECM = extracellular matrix. ECS = extracellular
  structure. ER = endoplasmic reticulum. IMM = inner mitochondrial membrane
