figure_title: POLR2L function in TGF-β, WNT and PI3K/AKT signaling pathways.
caption: POLR2L function in TGF-β, WNT and PI3K/AKT signaling pathways. POLR2L enhances
  cell survival and metabolism through the PI3K/AKT pathway and facilitates the transcription
  of target genes in the nucleus by promoting Smad2/3 phosphorylation via the TGF-β
  pathway. Additionally, POLR2L contributes to the activation of β-catenin through
  the WNT pathway, thereby increasing EMT, a process also influenced by TGF-β signaling.
  By promoting ETM through these pathways, POLR2L plays a significant role in enhancing
  cancer proliferation, metastasis, invasion and drug resistance. EMT, epithelial-mesenchymal
  transition; POLR2L, RNA polymerase II, I and III subunit L
