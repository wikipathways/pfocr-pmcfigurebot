caption: The graphical abstract of this paper. OGD/R stimulates cardiomyocyte pyroptosis
  and oxidative damage, which is manifested by increased expression of NLRP3, N-GSDMD,
  Caspase-1, and IL-1β; increased levels of SOD, MDA, and ROS, and decreased levels
  of GSH-Px, leading to cell damage. Micheliolide can alleviate OGD/R-induced pyroptosis
  and oxidative stress through the AMPK signaling pathway
article_title: Micheliolide reduces the damage, pyroptosis and oxidative stress of
  cardiomyocytes caused by OGD/R by regulating the AMPK signaling pathway
