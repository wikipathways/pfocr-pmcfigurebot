figure_title: Signaling pathways linking CRP and mCRP to inflammation, BBB disruption,
  and neurodegeneration.
caption: Signaling pathways linking CRP and mCRP to inflammation, BBB disruption,
  and neurodegeneration. This schematic illustrates how CRP and mCRP act as proinflammatory
  mediators through distinct but overlapping signaling cascades. Shear-induced mechanical
  stress promotes the dissociation of pentameric CRP (pCRP) into its monomeric form
  (mCRP), thereby linking vascular biomechanics with localized inflammatory signaling
  and endothelial activation. CRP activates CD32/CD64-mediated NF-κB-dependent proinflammatory
  signaling pathways, promoting systemic inflammation and tissue remodeling. Upon
  dissociation, mCRP exerts stronger pathogenic effects, including the inhibition
  of autophagy via mTOR signaling, the activation of TGF-β and, ultimately, SMAD-associated
  inflammation. mCRP also impairs endothelial homeostasis and contributes to blood-brain
  barrier (BBB) breakdown, partly through the downregulation of tight junction proteins
  such as claudin-5. The resulting BBB dysfunction facilitates neuroimmune activation,
  promotes amyloid-beta (Aβ) accumulation, and contributes to neurocognitive decline
  and Alzheimer’s disease (AD) pathology. The diagram highlights the central role
  of mCRP in linking chronic inflammation to neurodegenerative disease risk (down
  black arrow means decrease)
article_title: Monomeric [CRP] and CRP-Controlled Stress and Pain Hypersensitization
  as Novel Predictors of Cognitive Disturbance and AD in Chronic Inflammatory Disease
