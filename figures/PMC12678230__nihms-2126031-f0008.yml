figure_title: Biosynthesis of 5ILD in parnafungin A (1).
caption: Biosynthesis of 5ILD in parnafungin A (1). (A) Proposed 5ILD formation catalyzed
  by ParB and ParF. The more prominent diastereomers at C15a of compounds 1, 2 and
  17 are fully characterized by NMR and HRMS. The stereochemistry of C5 is assigned
  based on the reported stereochemistry of the same carbon in 1.5 The stereochemistry
  of C15a in all compounds is not determined. (B) Heterologous reconstitution of 1
  upon coexpression of ParEGI/OJD/PT/BF in ScRC01 with 11 and anthranilate feeding.
  ParEGI/OJD/PT convert 11 and anthranilate to 15 which is subsequently converted
  to 1 and 2 by ParB and ParF. Omitting either one of these two enzymes from the expression
  system, or mutating the proposed catalytic nucleophile C138 of ParF completely abolished
  production of 1 and 2. (C) In vitro enzymatic assay of ParT, ParB and ParF. Compound
  5 (500 μM) was incubated with NADPH (3 mM), ParT (10 μM), ParB (10 μM) and ParF
  (10 μM) for 30 min at pH 7.4 and 25 °C. The production of 1 and 2 from the reaction
  shows that all enzymes are active under in vitro conditions. In the absence of ParF,
  the coupled in vitro reaction of ParT and ParB produced a new product 17 which is
  the overoxidation shunt product of the proposed on-pathway intermediate 16
