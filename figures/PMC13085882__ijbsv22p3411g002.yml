figure_title: KIF26A inhibits DNA damage repair.
caption: KIF26A inhibits DNA damage repair. (A) The heatmap illustrates the top 10
  genes in the DNA repair pathway significantly enriched by GSEA (left). Verification
  of the expression changes of the differentially expressed genes in the DNA repair
  pathway in HCT116 cell (right)(n = 3). (B) DNA damage in KIF26A-modulated HCT116cells
  after CRT treatment was assayed by comet assay (n = 10). Scale bars, 100 µm. (C)
  C, D. DNA double-strand breaks expressed by γ-H2AX level in KIF26A knockdown or
  overexpressing HCT116 cells treated with or without CRT. (C) Shows γ-H2AX by western
  blot analysis. (D) Shows images of γ-H2AX foci in cells at various time points of
  IR as indicated (n = 3). Scale bars, 10 µm. (E) Expression changes of KIF26A with
  increasing CRT treatment duration in HCT116 and RKO cells (n = 3). (F) Expression
  of KIF26A in HCT116 parental cells (HCT116) and HCT116 chemoradiotherapy-resistant
  cells (HCT116-R) (n = 3). (G) Western blot analyses of the levels of γH2AX in the
  indicated cells treated with or without CRT. A, C and G, CRT group treated with
  radiation (8 Gy) and chemotherapy (2 μg/mL of Oxaliplatin). E, treatment by radiation
  (4 Gy) and chemotherapy (1 μg/mL of Oxaliplatin).A, B and D-F, *P < 0.05, **P <
  0.01, ***P < 0.001 or ****P < 0.0001; ns, not significant; A, D and F, determined
  by Student's t-test; B and E, determined by one-way ANOVA; P value of less than
  0.05 indicates a statistical difference. Error bars, mean ± SD. For all panels,
  three biological independent replicates were performed
