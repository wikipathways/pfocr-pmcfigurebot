figure_title: A potential combination therapeutic approach, involving AIs and HDACI,
  at suboptimal doses for HR+ BC.
caption: A potential combination therapeutic approach, involving AIs and HDACI, at
  suboptimal doses for HR+ BC. AIs block the aromatase enzyme activity and inhibit
  estrogen/E2 production. HDACIs reduce E2 synthesis by downregulating the function
  of StAR, involving acetylation, along with cholesterol transport. The bottom panel
  illustrates the estrogen biosynthetic pathway. A combination therapy is expected
  to effectively suppress intra-tumoral E2 accumulation, reduce toxicity, and limit
  endocrine resistance, offering a promising new approach for alleviating hormone-dependent
  BC
