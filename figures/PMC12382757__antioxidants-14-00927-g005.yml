caption: 'Proteomics analysis of tissue revealed both tissue- and genotype-specific
  differences. (A) Muscle tissues (spleen, liver, and kidney) were isolated from hG6PDND
  and hG6PDA− mice for proteomics analysis. (B) Relative levels of G6PD show significant
  decreases in these three organs. (C–E) Significant genotype specific differences
  were observed for each tissue type, as measured by ANOVA. Protein abundances were
  grouped as being significantly increased or significantly decreased. (F–H) Pathway
  enrichment analysis of significant proteins. Significance: **: p < 0.01, ***: p
  < 0.001, ****: p < 0.0001'
