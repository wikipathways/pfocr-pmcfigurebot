figure_title: The non-canonical NF-κB pathway is activated in iMK2-KO cells.
caption: The non-canonical NF-κB pathway is activated in iMK2-KO cells. RNA sequencing
  revealed increased levels of mRNA for components of the IL-1β and non-canonical
  NF-κB pathways, as well as for targets of the non-canonical NF-κB pathway, in iMK2-KO
  +GFP cells. This finding was reinforced by IL-1α treatment (5 ng/mL, 1 h)
