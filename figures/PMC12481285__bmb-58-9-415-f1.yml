caption: Ilimaquinone (IQ) increases the lifespan of the C. elegans. (A) Molecular
  structure of the IQ. (B) Survival plots of C. elegans treated with indicated concentration
  of IQ (1, 10, 50 and 100 μM). (C) Changes in genes by IQ are shown as a heat map
  of hierarchical analysis, based on RNA sequencing analysis. (D) The gene expression
  values, the log transformations of fold changes, and statistical significance of
  each sample in the list of important DEG, have been visualized as a volcano plot.
  (E) Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis of genes significantly
  regulated by IQ are represented. (F) The KEGG map of the pathway for longevity regulation
  by IQ treatment is illustrated. Results are presented based on three independent
  experiments
