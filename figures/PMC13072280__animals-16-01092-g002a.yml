caption: Microbial community structure and functional analysis of liquid fermented
  feed. Ctrl, soybean meal; RSM, rapeseed meal, FRSM, fermented rapeseed meal. (A–D)
  Alpha diversity indices, including Chao 1, Shannon, Pielou, and Simpson indices;
  (E) Venn diagram showing shared and unique amplicon sequence variants among groups;
  (F) Principal coordinate analysis (PCoA) of microbial community structure; (G) Relative
  abundance of bacterial phyla; (H) Relative abundance of bacterial genera; (I) Linear
  discriminant analysis (LDA) score distribution (LDA > 3.5); (J) LEfSe multilevel
  species hierarchical tree diagram; (K) Kyoto Encyclopedia of Genes and Genomes 1-level
  pathway analysis; (L) Kyoto Encyclopedia of Genes and Genomes 2-level pathway analysis.
  a,b Different superscript letters indicate significant differences between mean
  values for a given parameter (p < 0.05)
