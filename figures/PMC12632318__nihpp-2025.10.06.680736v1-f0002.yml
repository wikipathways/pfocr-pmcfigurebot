figure_title: Age and Sex Pathway Analysis
caption: (A). IPA analysis showed upregulation of pathways in the young mice compared
  to older mice. Pathways analysis of PMN-MDSCs are shown as a representative and
  showed upregulation of pathways regarding transcription/translation and mitochondrial
  assembly and function while downregulated pathways included mitochondrial dysfunction.
  Immune and inflammatory pathways displayed a more complex pattern with some upregulated
  pathways (i.e., neutrophil degranulation and ID3 signaling) and some downregulated
  (i.e., innate-adaptive immune communication, TRIM21 signaling, and IL-7) in the
  young adult septic mice compared to older. (B) IPA analysis for female sepsis vs
  male sepsis was performed and showed a mixture of up and down regulation. In PMN-MDSCs,
  as shown in this figure, more of the pathways were downregulated in the MDSCs from
  septic females compared to septic males. These included pathways associated with
  immune function and the cell cycle as shown in this volcano plot of pathways from
  PMN-MDSCs
