figure_title: Schematic overview of the n-6 polyunsaturated fatty-acid (PUFA) metabolic
  pathway and definitions of desaturase-related indices used in this study.
caption: 'Schematic overview of the n-6 polyunsaturated fatty-acid (PUFA) metabolic
  pathway and definitions of desaturase-related indices used in this study. Linoleic
  acid (LA) is converted to γ-linolenic acid (GLA) by Δ6-desaturase (D6D), elongated
  to dihomo-γ-linolenic acid (DGLA), and further converted to arachidonic acid (AA)
  by Δ5-desaturase (D5D). The D5D index was defined as AA/DGLA. Because GLA was not
  measured in this study, the D6D proxy index was defined as DGLA/LA. Abbreviations:
  PUFA, polyunsaturated fatty acid; LA, linoleic acid; GLA, γ-linolenic acid; DGLA,
  dihomo-γ-linolenic acid; AA, arachidonic acid; D5D, Δ5-desaturase; D6D, Δ6-desaturase;
  FADS1, fatty acid desaturase 1; FADS2, fatty acid desaturase 2; ELOVL5, elongation
  of very long-chain fatty acids protein 5; BDHQ, Brief-type Self-Administered Diet
  History Questionnaire'
