figure_title: DNA vaccines activate immune responses through the I-IFN signaling pathway.
caption: DNA vaccines activate immune responses through the I-IFN signaling pathway.
  C57BL/6J wild-type (WT) and IFNαR1−/− mice were DNA immunized with a single antigen
  (pVAX-GRA28 or pVAX-GRA83), multi-antigen (pVAX-IL-28B + pVAX-GRA28) vaccines or
  cocktailed vaccines with pVAX-IL-28B + pVAX-GRA28 + pVAX-GRA83. The mice were injected
  with PBS as a control group (n = 5 per group). Mouse splenic lymphocytes were isolated
  14 days post the last immunization for flow cytometry analysis. (A,B) The numbers
  of CD4+, CD8+ T cells and DCs and the expressions of MHCI and MHCII in activated
  DCs in C57BL/6J wild-type (WT) (A) and IFNαR1−/− mice (B). (C) qPCR was used to
  detect the expression levels of interferon-stimulated genes (ISGs) in splenic lymphocytes
  of WT and IFNαR1−/− mice at 14 days post the last immunization. *** p < 0.001. **
  p < 0.01. * p < 0.05. Data are presented as the means ± SD
article_title: Protective Efficacy of Two Novel DNA Vaccine Candidates Encoding TgGRA28
  and TgGRA83 with an IL-28B Molecular Adjuvant Against Acute and Chronic Toxoplasmosis
