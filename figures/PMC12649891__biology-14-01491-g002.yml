figure_title: Direct effects of anaphylatoxins C3a and C5a on tumor cell progression.
caption: Direct effects of anaphylatoxins C3a and C5a on tumor cell progression. (a)
  Interaction between C5a/C5aR signaling and the MAPK/p38 pathway results in the inhibition
  of p21/p-p21 expression, which was found to enhance tumor growth in breast cancer.
  (b) C5a stimulation triggers the activation of the RGC-32 gene by Akt1 leading to
  an increased proliferation of breast cancer cells. (c) Both C3a and C5a activate
  the MEK/ERK pathway, resulting in an increased nuclear translocation of NrF2 that
  induces the increased migration, invasion, and adhesion of multiple myeloma (MM)
  cells. (d) C5a is produced within the TME through the cleavage of C5 by Cathepsin
  D, a non-canonical pathway. Interaction between C5a and C5aR1 triggered the formation
  of a complex with KCTD5, Cullin3, and ROC-1, which stabilized and accumulated -catenin
  in tumor cells. This leads to a poor outcome, and progression of colorectal cancer.
  The figure was created with BioRender.com
