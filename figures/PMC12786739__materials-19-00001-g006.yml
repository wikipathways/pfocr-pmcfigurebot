caption: Schematic illustration of the photoelectrochemical (PEC) system coupling
  a Z-scheme Fe2O3/g-C3N4 heterojunction with C. necator H16. Under simulated sunlight
  and external DC power, photogenerated electrons follow a Z-scheme transfer pathway
  (red arrows) from the conduction band of Fe2O3 to the valence band of g-C3N4. This
  facilitates efficient charge separation to reduce protons into H2 (green arrows),
  which subsequently drives the bacterial Calvin Cycle to fix CO2 (blue arrow) into
  PHB
