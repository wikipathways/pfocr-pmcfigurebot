figure_title: Impaired glutamate uptake in YAP-/- astrocytes exacerbates glutamate
  excitotoxicity in primary cultured neurons and the YAP/β-catenin/EAAT2 signaling
  pathway is activated in astrocytes in ALS in vitro model.
caption: |-
  Impaired glutamate uptake in YAP-/- astrocytes exacerbates glutamate excitotoxicity in primary cultured neurons and the YAP/β-catenin/EAAT2 signaling pathway is activated in astrocytes in ALS in vitro model.
  (A) Flowchart of the glutamate uptake assay. (B) Quantitative analysis of the relative extracellular glutamate levels in YAP+/+ and YAP-/- astrocytes (n = 4 each group, Student's t-test). (C) Representative images of immunostaining of primary cultured neurons transduced with AAV-GFP-GA5 virus or AAV-GFP-GA100 virus. The arrows indicated neurons that expressed GFP-GA5 or GFP-GA100. GFP-GA5 and GFP-GA100, green; MAP2, red; DAPI, blue. (D) Flowchart of conditioned medium collected from YAP+/+ (YAP+/+ ACM) and YAP-/- (YAP-/- ACM) astrocytes and applied to primary cultured neurons transduced with AAV-GFP-GA100 virus for relevant experiments. (E) Neuronal viability was assessed by CCK-8 assay in primary cultured neurons transduced with AAV-GFP-GA100 virus and treated with YAP+/+ ACM or YAP-/- ACM (n = 5 each group, Student's t-test). (F) Western blot analysis of Bcl-2 and Bax expression in primary cultured neurons transduced with AAV-GFP-GA100 virus and treated with YAP+/+ ACM or YAP-/- ACM. (G) Quantitative analysis of the relative Bax/Bcl-2 expression level in primary cultured neurons as shown in (F) (n = 4 each group, normalized to GA100-YAP+/+ACM, Student's t-test). (H) Flowchart of conditioned medium collected from primary cultured neurons transduced with AAV-GFP-GA5 virus (GA5 CM) or AAV-GFP-GA100 virus (GA100 CM) and applied to YAP+/+ and YAP-/- astrocytes for relevant experiments. (I) Western blot analysis of YAP, β-catenin and EAAT2 expression in YAP+/+ and YAP-/- astrocytes treated with GA5 CM or GA100 CM. (J-L) Quantitative analysis of the relative YAP (J, n = 4 each group, normalized to YAP+/+-GA5 CM), β-catenin (K, n = 4 each group, normalized to YAP+/+-GA5 CM) and EAAT2 (L, n = 3 each group, normalized to YAP+/+-GA5 CM) expression levels in astrocytes as shown in (I). (M) Double immunostaining of EAAT2 (green) and GFAP (red) in YAP+/+ and YAP-/- astrocytes treated with GA5 CM or GA100 CM. (N) Quantitative analysis of the relative intensity of EAAT2 as shown in (M) (n = 14 each group). Scale bars, 50 µm. Data were presented as mean ± SEM. Two-way ANOVA with Tukey's multiple comparisons test unless otherwise indicated, n.s., not significant (p > 0.05),*p < 0.05, **p < 0.01
