  pAgs IPP and DMAPP, the inhibitor lovastatin and the inhibitor as well as indirect
  pAg risedronate. C. The chemical synthetic pAg prodrug pro-C-HMBP and its active
  form C-HMBP. D. Workflow for isolation, purification and coculture of γ9δ2 T cells.
  PBMCs were isolated from donor buffy coat, followed by a 2-week culture to obtain
  γ9δ2 T cells, which were tested for secondary T cell activation in coculture experiments
