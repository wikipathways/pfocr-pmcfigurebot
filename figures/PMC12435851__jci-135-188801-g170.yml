figure_title: RCOR2 activates Wnt/β-catenin by repressing RNF43 and inhibits immune
  response by repressing CIITA and MHC-II
caption: '(A and B) Volcano plots of RCOR2 target genes in MDA-MB-231 cells (n = 2).
  (C and D) Venn diagrams of RCOR2 activated (C) and repressed (D) gene numbers in
  MDA-MB-231 cells (n = 2). (E and F) Reactome pathway analysis of RCOR2 target genes
  in MDA-MB-231 cells (n = 2). (G) RT-qPCR analysis of indicated mRNAs in parental,
  RCOR2-KO, and RCOR2-rescue MDA-MB-231 cells (n = 3). (H) Flow cytometry analysis
  of RNF43 protein in parental and RCOR2-KO1 or -KO2 MDA-MB-231 cells. (I) RT-qPCR
  analysis of indicated mRNAs in parental and RCOR2-KO1 or -KO2 MDA-MB-231 cells treated
  with 0.1 ng/mL IFN-γ for 24 hours (n = 3). (J) Immunoblot analysis of indicated
  proteins in parental and RCOR2-KO1 or -KO2 MDA-MB-231 cells treated with 0.1 ng/mL
  IFN-γ for 24 hours. (K) Immunoblot analysis of indicated proteins in parental, RCOR2-KO1,
  CIITA-KO, and RCOR2/CIITA–DKO TUBO cells treated with 1 ng/mL IFN-γ for 24 hours.
  (L) Immunoblot analysis of indicated proteins in parental, RCOR2-KO1, CIITA-KO,
  and RCOR2/CIITA–DKO MC38 cells treated with 5 ng/mL IFN-γ for 24 hours. (M) Representative
  immunostaining of I-A/I-E in parental, RCOR2-KO1, CIITA-KO, and RCOR2/CIITA–DKO
  MC38 cells treated with 5 ng/mL IFN-γ for 24 hours. Scale bars: 10 μm. Data represent
  mean ± SEM. P values were determined by 1-way ANOVA with Tukey’s test (G) or Dunnett’s
  test (I). *P < 0.05; **P < 0.01; ***P < 0.001; ****P < 0.0001'
