figure_title: Visualisation of genes in the autophagy–lysosomal pathway of RPE cells
  following exposure to photoreceptor outer segments (POS).
caption: Visualisation of genes in the autophagy–lysosomal pathway of RPE cells following
  exposure to photoreceptor outer segments (POS). Cytoscape was used to map the autophagy–lysosomal
  network, where differentially expressed genes (DEGs) are colour-coded to highlight
  their relative extent of upregulation (red) or downregulation (blue) in sliding
  levels of intensity (see colour scale bar). Genes within the network but without
  any changes are indicated as white circles. (A) DEGs are shown at 4 h (B), 6 h (C),
  24 h and (D) 48 h following synchronised internalisation of POS cargos
