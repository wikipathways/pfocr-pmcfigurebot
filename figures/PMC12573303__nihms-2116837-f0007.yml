figure_title: Regulatory networks linking epigenomic information dynamics to AD pathology
  progression, cognitive function, and resilience
caption: (A) Overview of DEGs, DARs, AD-GWAS risk genes, TFs, histone modifications,
  and chromatin states associated with epigenomic information dynamics and their links
  to AD pathology progression, cognitive function, and resilience.(B) GO term and
  pathway enrichment for DEGs associated with higher (red) or lower (blue) epigenomic
  information across brain regions and cell types. (C) Network of TFs and histone
  modifications enriched in DEGs with lower epigenomic information. Circles represent
  brain regions by cell class; diamonds indicate enriched factors. Edge thickness
  reflects enrichment significance −log10(p value).(D) Representative differential
  expression of AD-GWAS genes associated with epigenomic information dynamics across
  brain regions and cell classes.(E) Chromatin-state enrichment of DARs associated
  with higher (top) or lower (bottom) epigenomic information.(F) Correlation between
  sample-level epigenomic information and AD pathology, cognitive function, and resilience.(G)
  Heatmap showing the Spearman correlations of log2(fold change) for DARs and DEGs
  linked to epigenomic information dynamics, AD pathology progression, and cognitive
  measures.See also Figures S7, S8, S9, and S10 and Data S1, page 6
