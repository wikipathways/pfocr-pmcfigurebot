figure_title: Vocal repertoire following activation of NE+ A2 to L-PBN pathway or
  LiCl administration.
caption: 'Vocal repertoire following activation of NE+ A2 to L-PBN pathway or LiCl
  administration. (A) Emission of vocalizations did not significantly differ between
  TH-Cre+ and TH-Cre− animals at baseline. (B) However, CNO-induced activation of
  a NE+ A2 to L-PBN pathway significantly increased the emission of MFVs in TH-Cre+
  mice relative to TH-Cre− mice over a 30-minute vocal recording. No other vocal type
  differed between TH-Cre+ and TH-Cre− animals. (C) Emission of vocalizations did
  not significantly differ between male and female C57BL/6J mice at baseline. (D)
  Relative to saline, the emission of MFVs was significantly increased following the
  injection of the aversive agent, LiCl, over a 30-minute recording. No other vocal
  type differed between LiCl- and saline-treated animals. Data are represented as
  mean ± SEM. TH-Cre+: 7 males; TH-Cre−: 5 males; saline: n = 12 males; n = 12 females;
  LiCl: n = 12 males; n = 12 females. For LiCl experiments, black data points represent
  males and red data points represent females. * p < 0.05'
article_title: Chemogenetic Activation of an A2 Nucleus of the Solitary Tract to Lateral
  Parabrachial Nucleus Noradrenergic Pathway Blunts Binge-Like Ethanol Intake and
  Promotes Aversive Unconditioned Responses in Male and Female Mice
