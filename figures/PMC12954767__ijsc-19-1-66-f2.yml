caption: 'Transcriptomic alterations in BLM-induced lung fibrosis highlight ECM remodeling
  and selective gene induction. (A) Functional categorization of biological processes
  enriched in BLM-treated lungs (n=3) compared with controls (n=2). (B) Quantitative
  enrichment analysis of functional categories. Red indicates significantly upregulated
  pathways, and green indicates significantly downregulated pathways. (C) Radar plot
  illustrating relative expression changes of ECM- and fibrosis-associated genes (normalized
  log2 values) between control (CTL) (blue, n=2) and BLM-treated (red, n=3) lungs.
  (D) Sample-level distribution of normalized expression values (log2) for representative
  ECM and fibrosis-related transcripts in CTL (red, n=2) and BLM (blue, n=3) groups.
  (E) Volcano plot of differentially expressed genes in BLM vs. CTL lungs. (F) Paired
  comparison of normalized expression values for COL1A1 and MMP12 across individual
  BLM-treated samples. BLM: bleomycin, ECM: extracellular matrix'
