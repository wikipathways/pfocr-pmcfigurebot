figure_title: TIM-4+ smRTM shows distinct susceptibility to ferroptosis (A) UMAP visualization
  of macrophage subsets.
caption: |-
  TIM-4+ smRTM shows distinct susceptibility to ferroptosis (A) UMAP visualization of macrophage subsets. (B) Marker genes used for cluster annotation. (C) KEGG pathway enrichment analysis of up-regulated differentially expressed genes (DEGs) identified ferroptosis-related genes highly expressed in TIM-4 cluster. (D) Heat maps illustrate the expression of genes related to iron ion metabolism, lipid metabolism, and oxidant metabolism in each cluster, based on single-cell RNA-seq. (E) Flow cytometry was used to monitor the frequency of TIM-4+ smRTM in EHS mice during recovery at 0 h, 6 h, and 12 h (n = 3 mice/group). (F) Representative immunofluorescence images of F4/80 (red), TIM-4 (green), and DAPI (green) in in skeletal muscle. (G) FerroOrange staining of TIM-4⁺ smRTMs following io+hs exposure. (H) Lipid peroxidation in TIM-4⁺ smRTMs detected by flow cytometry (n = 3). (I-J) MDA and 4-HNE levels in TIM-4⁺ smRTMs (n = 3-4). (K)
  Ptgs2 mRNA expression in TIM-4⁺ smRTMs (n = 4). Summary data are presented as the mean ± SEM. Significance was calculated using the Student's t-test. (*P<0.05, **P<0.01, ***P<0.001, ****P<0.0001)
