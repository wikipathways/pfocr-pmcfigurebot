figure_title: Conceptual framework illustrating the pathophysiological links between
  rheumatoid arthritis (RA) and chronic kidney disease (CKD).
caption: Conceptual framework illustrating the pathophysiological links between rheumatoid
  arthritis (RA) and chronic kidney disease (CKD). This figure summarizes the major
  mechanisms contributing to renal injury in RA, encompassing immune-mediated pathways
  (such as chronic systemic inflammation and autoantibody- or immune-complex-mediated
  glomerular injury) as well as non-immunologic mechanisms, including endothelial
  dysfunction, hemodynamic stress, and cardiometabolic factors. The framework highlights
  the bidirectional interaction between RA disease activity and CKD progression, integrating
  inflammatory and hemodynamic processes within a unified conceptual model. In addition,
  proteinuria is depicted as an active pathogenic mediator, whereby excessive albumin
  uptake by tubular epithelial cells induces the release of extracellular vesicles,
  including exosomes, which amplify local inflammation and fibrotic responses within
  the tubulointerstitium
