figure_title: Adipocyte Dnmt1 deletion upregulates Esr1 expression and reduces adipose
  tissue inflammation in female mice fed HFD
caption: (A-B) Esr1 promoter DNA methylation level (A) and mRNA expression level (B)
  in female AD1KO and fl/fl mice fed HFD, n=6/group. *p<0.05 vs. fl/fl by Student’s
  t test. (C-E) Volcano plot (C), pathway analysis (D) and heat map (E) analyzed from
  RNAseq data from gWAT of female AD1KO and fl/fl mice fed HFD. (F) CD68-immunostaining
  of gWAT of female AD1KO and fl/fl mice fed HFD. (G) FACS analysis of F4/80+CD11C+
  ATMs in gWAT of female AD1KO and fl/fl mice fed HFD. (H) Percentage of F4/80+ ATMs,
  F4/80+CD11C+ ATMs, CD8+ T lymphocytes and CD45R/B220+ B lymphocytes in gWAT of female
  AD1KO and fl/fl mice fed HFD, n=5/group. *p<0.05 vs. fl/fl by Student’s t test.
  All data are expressed as mean ± SEM
