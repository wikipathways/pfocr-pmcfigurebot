figure_title: Effects of quercetin against TGEV infection and target network-based
  mechanistic insights.
caption: Effects of quercetin against TGEV infection and target network-based mechanistic
  insights. Unless otherwise specified, IPEC-J2 cells were pretreated with quercetin
  (80 μM) for 1 h before infection with TGEV (MOI = 1) for 24 h. (A) Flow cytometric
  analysis of intracellular TGEV-N protein in IPEC-J2 cells infected with TGEV for
  24 h. The virus was pre-incubated with or without quercetin (80 μM) at 4 °C for
  24 h prior to cell infection (n = 3). (B) Immunofluorescence staining and quantification
  of intracellular TGEV-N protein (green) and nuclei (DAPI, blue) in IPEC-J2 cells
  treated under standard quercetin pretreatment conditions (n = 3). Scale bar = 100 μm.
  (C) Quantitative RT-PCR analysis of TGEV-N mRNA levels in IPEC-J2 cells following
  quercetin treatment and TGEV infection (n = 4). (D) Live/dead staining using Calcein-AM
  (green) and propidium iodide (PI, red) in IPEC-J2 cells (n = 3). Scale bar = 100 μm.
  (E) Volcano plot showing differentially expressed genes (DEGs) in TGEV-infected
  intestinal organoids from GEO dataset GSE182240 (F) Venn diagram illustrating 82
  overlapping genes among TGEV-related genes (GeneCards), quercetin targets (TCMSP),
  and DEGs from GSE182240. (G) Protein-protein interaction (PPI) network of the overlapping
  genes constructed using the STRING database. (H) Compound-target-pathway network
  visualizing quercetin and its putative host targets in the context of TGEV infection.
  (I) KEGG pathway enrichment analysis of the overlapping genes. (J) Gene Set Enrichment
  Analysis (GSEA) of transcriptomic data (GSE182240) showing enrichment of inflammatory
  signaling pathways including NF-κB, TNF, and JAK-STAT pathways in TGEV-infected
  organoids (K) GO cellular component enrichment. (L) GSEA analysis indicating suppression
  of mitochondrial protein-containing complex-related genes in TGEV-infected organoids.
  (M) Chord diagram depicting associations between GO terms and core target genes.
  Data were expressed as mean ±SEM. **p < 0.01, ***p < 0.001
