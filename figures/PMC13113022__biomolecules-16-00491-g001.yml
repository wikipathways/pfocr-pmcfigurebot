figure_title: The relationship of canonical NF-κB signaling pathway and cardiovascular
  diseases.
caption: The relationship of canonical NF-κB signaling pathway and cardiovascular
  diseases. This figure shows three steps about the relationship between the canonical
  NF-κB pathway and cardiovascular diseases. First, oxidized low-density lipoproteins
  (ox-LDLs) and lipopolysaccharides (LPSs) affect endothelial cells and macrophages
  to start signaling. Then, the TLR4/MyD88-dependent axis transmits signaling, activates
  IKKβ, phosphorylates and degrades IκBα. p65 nuclear translocation happens. Activated
  NF-κB boosts adhesion molecules and chemokines. They drive immune cell recruitment,
  vessel lining damage, and artery clogging. These are the key steps in heart disease
  development
