figure_title: Comparison of amino acid metabolism reprogramming of macrophages under
  physiological and sepsis conditions.
caption: 'Comparison of amino acid metabolism reprogramming of macrophages under physiological
  and sepsis conditions. Under physiological conditions (left), amino acid metabolism
  maintains dynamic balance: Try regulates immune homeostasis by producing a small
  amount of KYN through low activity IDO. Gln maintains TCA cycle energy supply, produces
  Glu through glutaminase and supports antioxidant (GSH synthesis). Arginine produces
  appropriate amounts of NO (antibacterial) and ornithine (tissue repair) through
  the balance of NOS and Arg, respectively. In a sepsis state (right), amino acid
  metabolism is disrupted. IFN-γ induces high expression of IDO and accelerates the
  metabolism of Try along the KYN pathway. Phe metabolism is closely related to SA-AKI
  and can also cause toxicity to antibodies. The increase in Gln consumption enhances
  glycolysis and pro-inflammatory M1 polarization through mTOR activation. The TLR4/EGFR
  mTOR axis drives metabolic imbalance in sepsis, leading to M1 polarization dominance
  and the release of pro-inflammatory cytokines. Inhibition of EGFR can partially
  activate PPARγ to enhance Gln uptake and promote M2 repair. Overactivation of iNOS
  leads to depletion of arginine and excessive production of NO, and may inhibit the
  mTOR signaling pathway. When the glycolysis or lipid pathways are damaged, the metabolic
  flux of amino acids, especially the generated glutamine, can serve as an energy
  buffer to maintain mitochondrial integrity. Try, tryptophan; KYN, kynurenine; IDO,
  indoleamine 2,3-dioxygenase; Gln, glutamine; Glu, glutamate; GSH, glutathione; NO,
  nitric oxide; NOS, nitric oxide synthase; Arg, arginine; IFN-γ, interferon-γ; NF-κB,
  nuclear factor κB; Phe, phenylalanine; SA-AKI, sepsis associated-acute kidney injury;
  TLR4, toll-like receptor 4; EGFR, epidermal growth factor receptor; mTOR, mammalian
  target of rapamycin; PPARγ, peroxisome proliferator activated receptor γ; iNOS,
  inducible nitric oxide synthase; ETC, electron transfer chain; ROS, reactive oxygen
  species; Pro, proline; TNF-α, tumor necrosis factor-α; a-KG, α-ketoglutaric acid;
  TCA, tricarboxylic acid'
