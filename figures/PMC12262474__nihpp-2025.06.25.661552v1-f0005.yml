figure_title: OCM-FISH data provide cell type-specific insights into long-range circuit
  connectivity
caption: (a) Motor cortex PSPs resulting from activation of MThal inputs, grouped
  across all cell types by laminar depth (top), and across excitatory cell types by
  cell subclass for excitatory cells found in L5a-6a (bottom). Line shows mean PSP
  trace, shaded area shows SEM. (b) Laminar position of the four most abundant excitatory
  supertypes in the 006 L4/5 IT, 005 L5 IT, and 022 L5 ET subclasses localized to
  L5a and upper L5b (left), alongside average PSPs for each supertype (right; ***
  = p < 0.001, **** = p < 0.0001 by two-tailed t-test). (c) Motor cortex PSPs resulting
  from activation of contra motor cortex inputs, grouped across all cell types by
  laminar depth (top), and across excitatory cell types by cell subclass for cells
  found in L5a-6a (bottom). (d) Laminar position of the 0020 L5 IT3, 0090 L5 ET1,
  0091 L5 ET2, and 0114 L6 CT1 supertypes (left), alongside average PSPs for each
  supertype (right; **** = p < 0.0001, ** = p 0.001). (e) Probability density distributions
  (left) of CheRiff-EGFP signal across all OCM-FISH imaged sections in the MThal-to-motor
  cortex circuit (orange), and the Contra-to-motor cortex circuit (blue; line shows
  mean, shaded area shows 95% CI), alongside average PSPs of cell supertypes shown
  in b and d, colored based on activated pathway (MThal in orange, Contra in blue;
  line shows mean PSP trace, shaded area shows SEM; **** = p < 0.0001; n.s. = not
  significant)
article_title: A scalable, all-optical method for mapping synaptic connectivity with
