figure_title: Regulatory mechanism of mechanical loading on bone metabolism.
caption: 'Regulatory mechanism of mechanical loading on bone metabolism. Mechanical
  stimulation promotes bone formation through the activation of key pathways: IGF-1/PI3K/Akt/mTOR
  signaling enhances osteoblast activity; RANKL/RANK/OPG axis modulation favors bone
  formation over resorption; the COX-2/PGE2 cascade stimulates osteogenesis; and Wnt/β-catenin
  pathway activation drives osteogenic differentiation. Conversely, mechanical unloading
  suppresses these pro-osteogenic signals while upregulating bone-resorbing pathways
  (for example, increasing the RANKL/OPG ratio and increasing DKK1/SOST expression),
  ultimately leading to bone loss. RANKL, receptor activator of nuclear factor-kappaB
  ligand; OPG, osteoprotegerin; DKK1, Dickkopf-1; SOST, sclerostin; LRP5/6, low-density
  lipoprotein receptor-related protein 5/6; COX-2, cyclooxygenase-2; PGE2, prostaglandin
  E2; IGF-1, insulin-like growth factor 1; PI3K, phosphatidylinositol 3-kinase; mTOR,
  mechanistic target of rapamycin; AKT, protein kinase B; NFATc1, nuclear factor of
  activated T cells 1. The arrows indicate the direction of change: ↑, increased expression/activity;
  ↓, decreased expression/inhibition'
