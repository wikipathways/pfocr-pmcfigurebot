figure_title: Pathway activity impacts overall survival in uveal melanoma.
caption: Pathway activity impacts overall survival in uveal melanoma. Gene Set Enrichment
  Analysis (GSEA) of the TCGA UVM cohort (n = 80) using Hallmark and Reactome gene
  sets from MSigDB reveals clinical relevance of key pathways identified in resistance
  mechanisms under FAK or MEK inhibition. (A) High activity of the PI3K/AKT/mTOR pathway
  is associated with significantly worse overall survival (p = 0.0051). (B) Elevated
  mTORC1 signaling correlates with poor survival outcomes (p = 0.0021). (C) High anti-apoptosis
  pathway activity is linked to reduced survival (p = 0.0076). (D) Increased IL6/JAK/STAT
  signaling is associated with worse survival (p < 0.0001). (E) High YAP signature
  activity predicts poorer survival outcomes (p = 0.0019)
article_title: 'Unraveling Resistance Mechanisms to Gαq Pathway Inhibition in Uveal
