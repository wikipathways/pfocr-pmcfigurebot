caption: PTP4A1 interacts with PTEN and regulates the activation of the PI3K/AKT/GSKα
  pathway. (A) Venn diagram showing the potential PTP4A1-interacting proteins screened
  by co-IP-MS based on the screening criteria of ‘1-PTP4A1-flag and 2-PTP4A1-flag
  not 1-PTP4A1-IgG not 2-PTP4A1-IgG’. (B) PTP4A1 colocalized with PTEN in RBE cells.
  (C and D) Co-IPs were performed to confirm the association between PTP4A1 and PTEN.
  (E) PTP4A1 regulated the activation of the PTEN/PI3K/AKT/GSKα signaling pathway
  in RBE and HCCC-9810 cells. PTP4A1, protein tyrosine phosphatase 4A1; PTEN, phosphatase
  and tensin homolog; co-IP, co-immunoprecipitation; OE, overexpression; KD, knockdown;
  NC, negative control; EV, empty vector; p-, phosphorylated
