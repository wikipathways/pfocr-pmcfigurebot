figure_title: Influence of EP2 and EP4 receptor antagonists on MAPK and NF-κB pathway
  stimulation in bovine neutrophils exposed to S.
caption: 'Influence of EP2 and EP4 receptor antagonists on MAPK and NF-κB pathway
  stimulation in bovine neutrophils exposed to S. aureus. Bovine neutrophils were
  pretreated with either (A) the EP2 receptor antagonist AH6809 or (B) the EP4 receptor
  blocker AH23848. Protein phosphorylation status was evaluated through immunoblotting
  for: (A1,B1) Extracellular signal-regulated kinase (ERK), (A2,B2) P38 MAP kinase,
  and (A3,B3) NF-κB p65 subunit. (C) Summary graph of WB bands. Results are expressed
  as mean ± standard deviation of three independent experiments. To evaluate the interaction
  effects between different treatment groups and time points, two-way ANOVA was applied,
  followed by the Tukey method for multiple comparisons. Significant differences between
  the experimental group and the control group were indicated with the #: ns for p
  > 0.05 (no significant difference), # for p < 0.05, ## for p < 0.01, and ### for
  p < 0.001. Comparisons showing significant differences between two designated groups
  were marked with the *: ns for p > 0.05, * for p < 0.05, ** for p < 0.01, and ***
  for p < 0.001. Abbreviations: MAPK, Mitogen-Activated Protein Kinase; NF-κB, Nuclear
  Factor kappa-light-chain-enhancer of activated B cells; EP2 receptor, Prostaglandin
  E2 receptor EP2 subtype; EP4 receptor, Prostaglandin E2 receptor EP4 subtype; ERK,
  Extracellular signal-regulated kinase; P-ERK, Phosphorylated extracellular signal-regulated
  kinase; p38, p38 mitogen-activated protein kinase; P-p38, Phosphorylated p38 mitogen-activated
  protein kinase; p65, Nuclear factor kappa-B subunit p65; P-p65, Phosphorylated nuclear
  factor kappa-B subunit p65; GAPDH, Glyceraldehyde-3-phosphate dehydrogenase. Original
  figures can be found in Supplementary Materials'
