figure_title: Activation of ATF4 and one-carbon metabolism enzymes in the brain of
  Sel1LSynCre mice
caption: '(A) Western blot analysis of ATF4 in cortical and hippocampal tissues from
  Sel1Lf/f and Sel 1LSynCre mice at 5 weeks of age, with quantitation shown in B (n
  = 6 mice per group). (C) Relative mRNA abundance of one-carbon metabolism genes
  based on single-nucleus RNA sequencing of cortical and hippocampal tissue from Sel1Lf/f
  and Sel1LSynCre mice at 5 weeks of age. (D) Proposed model illustrating the role
  of ERAD in neurons. Proper ERAD function is essential for maintaining growth, motor
  function, behavior, and lifespan in mice by preserving ER proteostasis under basal
  conditions and preventing activation of the integrated stress response (IRS). Loss
  of ERAD leads to phosphorylation of eIF2α, increased ATF4 levels, and activation
  of one-carbon metabolism pathways. Positive and inhibitory regulatory effects are
  indicated by red arrow and blunt-ended line, respectively. Data in (B) are presented
  as mean ± SEM and differences between Sel1Lf/f and Sel1LSynCre groups were analyzed
  using a Student’s t test. The data presented (C) was analyzed using a two-way ANOVA
  with FDR correction. Significance levels are indicated as follows: *p < 0.05; **p
  < 0.01; ***p < 0.001'
article_title: Neuronal SEL1L-HRD1 ERAD regulates one-carbon metabolism and is essential
  for motor function and survival
