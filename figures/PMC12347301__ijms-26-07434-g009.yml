figure_title: Model of desensitization of insulin signaling pathway by RSV in C9 cells.
caption: 'Model of desensitization of insulin signaling pathway by RSV in C9 cells.
  When hepatic cells are treated with RSV, classical PKC isoforms are activated, which
  in turn interact with the insulin receptor (IR) and phosphorylate it on serine residues
  (Ser). Subsequently, PTP1B dephosphorylates the receptor and causes uncoupling with
  IRS, impairing insulin actions, such as hepatic glycogen synthesis. The numbered
  circles indicate the process of inhibition of the PI3K/Akt pathway by RSV: (1) RSV
  activates classic isoforms of PKC that phosphorylate Ser/Thr residues in IR; (2)
  previous phosphorylation of Ser/Thr in IR facilitates the interaction of PTP1B with
  IR and dephosphorylates it; (3) inhibition of IR causes uncoupling of IRS; and (4)
  downstream of the PI3K/Akt pathway is inhibited. Green arrows indicate normal insulin
  regulation, and red arrows indicate the inhibition of RSV-regulated processes. The
  diagram indicates hypothetical processes in red letters that could contribute to
  the negative regulation of the PI3K/Akt pathway, such as the activation of other
  PKC isoforms and the PP2A phosphatase. Ins, insulin; GCK, glucokinase; pSer, serine
  phosphorylation; pThr, threonine phosphorylation; pTyr, tyrosine phosphorylation;
  RSV, resveratrol. Figure created using BioRender.com (2024)'
article_title: Resveratrol Impairs Insulin Signaling in Hepatic Cells via Activation
