figure_title: Coordinated pathway networks drive cortical development.
caption: 'Coordinated pathway networks drive cortical development. (A) Heatmap showing
  the relative transcript levels of all differentially expressed genes (DEGs, rows)
  across developmental stages (columns). Columns are grouped into three major developmental
  time points: E16, P5, and P10. Red indicates high gene expression, and blue indicates
  low expression. (B) Dot plot depicting the biological processes enriched within
  the six clusters (numbered 1 to 6) identified by hierarchical clustering of the
  expression data (p adj < 0.05)'
