figure_title: The examples of the major signaling pathways that proteoglycans interact
  with in prostate cancer.
caption: The examples of the major signaling pathways that proteoglycans interact
  with in prostate cancer. (1) Endostatin inhibits the androgen receptor (AR) signaling
  pathway, just like (3) decorin, which also inhibits the epidermal growth factor
  receptor (EGFR) pathway. The interaction of (2) betaglycan with AR is hypothesized.
  The (4) perlecan-semaphorin 3A-plexin A1-neuropilin-1 (PSPN) complex leads to focal
  adhesion kinase (FAK) inhibition and integrin deactivation. During PC progression,
  MMPs can cleave perlecan and/or Sema3A, which re-activates the integrin signaling,
  leading to progression to metastasis. (5) Glypican 1 was suggested to interact with
  WNT3A, while glypican 5 was suggested to inhibit signaling that leads to β-catenin
  activation. Betaglycan (6) was shown to increase WNT5A (considered to be a non-canonical
  WNT ligand) levels and β-catenin signaling. Finally, asporin (7) was shown to increase
  the expression of β-catenin and its accumulation in the nucleus
