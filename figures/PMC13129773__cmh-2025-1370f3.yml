figure_title: Correlation patterns, expression, and pathway analyses of TACC3 and
  associated factors in HCC.
caption: Correlation patterns, expression, and pathway analyses of TACC3 and associated
  factors in HCC. (A) Circular heatmap visualization of nonparametric correlation
  patterns across different conditions. Heatmaps represent the correlation of the
  TACC3 isoform with KAT2A, cell type markers, and EMT markers in non-tumor (NT) (outer
  circle) and tumor (T) (inner circle). Significant differences are presented by black
  dots whereas row-wise standard deviations are given by innermost red/blue circles.
  (B) TACC3 expression in HCCs and non-tumoral tissues (MASLD-HCC cohort). (C) TACC3
  expression from normal and across HCC tumor AJCC stages (TCGA-LIHC). (D) Violin
  and box plots showing cell cycle (G1, S, and G2/M) phase-dependent nascent expression
  of TACC3 in single-nucleus RNA sequencing data. Statistical significance was assessed
  using Wilcoxon test. AJCC, American Joint Committee on Cancer; EMT, epithelialmesenchymal
  transition; HCC, hepatocellular carcinoma; HCC.NT, tumor-adjacent normal liver;
  HCC.T, tumor; MASLD, metabolic dysfunction-associated steatotic liver disease; MASH,
  metabolic dysfunction-associated steatohepatitis
