caption: KEGG pathway enrichment—shared upregulated pathways from SARDS and CAR retinas.
  The most enriched pathway is cell adhesion molecules (CAMs), followed by immune-related
  pathways including graft-versus-host disease, allograft rejection, autoimmune thyroid
  disease, type I diabetes mellitus, and viral myocarditis. Observed changes are potentially
  indicative of shared T-cell co-stimulation and antigen presentation mechanisms dominating
  pathways in SARDS and CAR retinas
