figure_title: Transcriptomic analysis of N.
caption: Transcriptomic analysis of N. lugens females after NlMATH3 silencing. (A)
  The number of differential genes at 3 and 7 days after RNA interference. (B,C) Kyoto
  Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis of differentially
  expressed genes (DEGs) that were upregulated (B) and downregulated (C) by RNA interference
  for 7 days. (D) Heatmap of expression levels of fecundity-related genes in N. lugens
  at 3 and 7 days after RNA interference. (E) The expression levels of six DEGs associated
  with immune pathways and circadian rhythm regulation in N. lugens at 3 and 7 days
  after RNA interference validated by qRT-PCR. Data are means ± SD (n = 3 biological
  replicates). Asterisks indicate significant difference between two groups conducted
  by t-test, * p < 0.05, ** p < 0.01
