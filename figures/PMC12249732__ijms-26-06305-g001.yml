figure_title: The trigeminal nociceptive sensory pathway comprises lateral and medial
  systems.
caption: The trigeminal nociceptive sensory pathway comprises lateral and medial systems.
  While the lateral system transmits information related to the sensory-discriminative
  aspects of pain, the medial system conveys information about the emotional aspects.
  Orofacial noxious stimuli are relayed from Aδ- and C-trigeminal ganglion neurons
  to the spinal trigeminal nucleus caudalis (SpVc) and the upper cervical dorsal horn
  (C1–C2). Neurons in the SpVc and C1–C2 project axons to the somatosensory cortex
  via the ventral posteromedial nucleus of the thalamus (lateral pathway) and also
  to the anterior cingulate cortex and the insular cortex via limbic structures such
  as the amygdala (medial pathway). TP = tooth pulp, TMJ = temporomandibular joint
