figure_title: All-atom molecular dynamics simulations of murine Tlr4 and Tlr4-Lig
  systems and conformational landscape analysis of murine Tlr4-DB03476 complex.
caption: 'All-atom molecular dynamics simulations of murine Tlr4 and Tlr4-Lig systems
  and conformational landscape analysis of murine Tlr4-DB03476 complex. (A) Potential
  energy of the Tlr4 system over time with (blue) and without (orange) the inhibitor.
  Both systems reach similar stable energy levels, with the inhibitor-bound system
  achieving a slightly more negative potential energy, indicating a more stable state.
  (B) RMSD comparison between Tlr4 in the presence and absence of the small-molecule
  inhibitor. The Tlr4-inhibitor complex (blue) shows a lower and more stable RMSD
  than Tlr4 alone (orange), indicating enhanced overall structural stability with
  ligand binding. (C) RMSF per-residue profiles for Tlr4 with (blue) and without (orange)
  the inhibitor. Overall fluctuations are similar, but the inhibitor-bound Tlr4 shows
  slightly reduced flexibility at certain residues, suggesting a minor stabilizing
  effect on local regions. (D) Radius of gyration (Rg) of Tlr4 over time in the presence
  (blue) and absence (orange) of the inhibitor. The Rg stabilizes at comparable values
  in both simulations, with the ligand-bound Tlr4 initially slightly more compact.
  This indicates that the inhibitor does not significantly alter the overall size
  of Tlr4, preserving the protein’s global conformation. (E) Projection of molecular
  dynamics trajectories onto the PC2 vs. PC1 subspace. Early simulations (blue) transition
  toward late-stage conformations (red) along a well-defined pathway (PC1: 58.9%;
  PC2: 17.0%). (F) Trajectory distribution in PC2 vs. PC3 subspace (PC2: 17.0%; PC3:
  5.9%). (G) Conformational sampling in PC3 vs. PC1 projection (PC1: 58.9%; PC3: 5.9%).
  (H) Variance contribution of principal components (cumulative variance: 81.8%)'
