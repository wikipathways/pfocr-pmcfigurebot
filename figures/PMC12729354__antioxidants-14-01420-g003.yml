figure_title: Overview of metabolic pathways for torularhodin and unsaturated fatty
  acid biosynthesis in R.
caption: Overview of metabolic pathways for torularhodin and unsaturated fatty acid
  biosynthesis in R. evergladensis CXCN-6. This schematic illustrates the central
  carbon metabolism and its branching into carotenoid and lipid biosynthetic routes.
  Glucose enters the glycolytic (EMP) and tricarboxylic acid (TCA) pathways to generate
  acetyl-CoA, a key metabolic precursor. Acetyl-CoA serves as the starting substrate
  for both the mevalonate pathway—leading to isoprenoid intermediates (IPP, FPP, GGPP)
  and downstream carotenoids including phytoene, lycopene, β-carotene, torulene, and
  torularhodin—and the fatty acid synthesis pathway generating long-chain and polyunsaturated
  fatty acids (PUFAs). Enzymes and intermediates involved in the metabolic pathways
  are highlighted in red. The interconnection between torularhodin and PUFA production
  reflects shared carbon flux and redox cofactor balance, forming the biochemical
  basis for co-production of pigments and lipids in R. evergladensis CXCN-6
article_title: A Novel Rhodotorula evergladensis CXCN-6 Rich in Torularhodin and PUFAs
  with Potent Antioxidant and Anti-Inflammatory Activities
