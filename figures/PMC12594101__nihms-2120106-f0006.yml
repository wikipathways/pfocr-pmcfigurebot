figure_title: mTOR inhibition induces immune genes in SU-DHL-4 and primary B cells
caption: (A) DEGs in rapamycin-treated SU-DHL-4 cells were analyzed with STRING and
  MCL clustered. Pie charts represent cluster sizes, and functional enrichment for
  the top 5 clusters is denoted.(B) Gene set enrichment analysis for rapamycin-treated
  SU-DHL-4 cells. False discovery rates (FDR) based on permutation testing are indicated.(C)
  List of leading-edge genes from the “adaptive immune response” gene set detected
  in (B).(D) Schematic experimental overview to assess the transcriptome of rapamycin-treated
  human primary B cells. Illustration from the NIAID NIH BIOART source (bioart.niaid.nih.gov/bioart/238).(E)
  Gene set enrichment analysis for rapamycin-treated primary B cells.(F) List of leading-edge
  genes from the “cytokine-mediated signaling pathway” detected in (E).(G) Principal
  component analysis of RNA-seq samples derived from rapamycin- or DMSO-treated SU-DHL-4
  and primary B cells.(H) Venn diagram showing the overlap between significantly down-
  or upregulated genes in rapamycin-treated SU-DHL-4 and primary B cells
