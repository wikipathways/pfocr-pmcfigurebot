figure_title: Differential expressed of proteins in mouse lymphatic endothelial cells.
caption: Differential expressed of proteins in mouse lymphatic endothelial cells.
  (A) Principal Component Analysis (PCA) of four biological replicates of pooled mouse
  lymphatic endothelial cells revealed initial clustering based on experimental condition,
  with control samples surrounded in blue and decorin-treated samples surrounded in
  red. One sample per condition was removed to enhance downstream analysis. By removing
  one replicate per condition, we increased the variance captured by the principal
  components 1 and 2 from 64% to a total of 71.6%. Investigation of the remaining
  three samples per group presented 3,126 quantified proteins. (B) Volcano plot of
  proteomic analysis revealing 126 quantifiable proteins, of which 78 qualified for
  further investigation with a log2 fold-change > 0.05 and a p< 0.05, Down-regulated
  proteins are shown in blue, up-regulated proteins shown in red, and all genes that
  did not meet our criteria for significance are unnamed with gray icons. Dashed lines
  represent intersecting limits of log2 fold-change = |0.05| and p = 0.05. (C) STRING
  network analysis provides visual representation for protein-protein interactions
  amongst the 78 proteins identified for further investigation. Proteins with no known
  interactions are shown without any attachments. (D) Metascape pathway analysis reveals
  the functional implications of certain proteins identified in previous analyses,
  with lysosomal and transcription initiation pathways highlighted for further investigation
