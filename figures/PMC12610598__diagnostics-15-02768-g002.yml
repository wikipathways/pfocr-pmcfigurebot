caption: Aβ distribution in visual pathway and hippocampus of 3-, 6- and 9-month-old
  WT and APP/PS1 mice. (a) Immunofluorescent staining for Aβ (red) in the Visual pathway
  and Hippocampus of mice (WT group, APP/PS1 group) at 3, 6, and 9 months of age.
  Scale bar, 200 μm (white), 50 μm (yellow). (b) Percentage of positive area of Aβ
  plaque per mm2 in V1 for WT group (black), APP/PS1 group (red). (c) Aβ plaque area
  per mm2 in the Hippocampus for WT group (black), APP/PS1 group (red). (d) Aβ plaque
  area per mm2 in the LGN for WT group (black), APP/PS1 group (red). (e) Aβ plaque
  area per mm2 in the Retina for WT group (black), APP/PS1 group (red). The LGN region
  is outlined by a white dotted line. Red indicates Aβ plaques, and arrows point to
  representative plaques. n = 6–7 per group. ** p < 0.01
