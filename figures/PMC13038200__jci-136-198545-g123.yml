figure_title: Integrated signaling pathways regulating intrarenal mTORC1 and JAK/STAT
  signaling in response to reduced insulin, relative energy stress, and reduced circulating
  ligands that activate the JAK/STAT pathway
caption: Reduced insulin availability leads to diminished activation of Ras and PI3K,
  subsequently decreasing signaling through the Raf/MEK/ERK/RSK and Akt branches.
  Both ERK/RSK and Akt negatively regulate the TSC1/2 complex. Reduced ERK/RSK and
  Akt signaling enhances TSC1/2 activity, which attenuates activation of Rheb-GTP
  and consequently inhibits mTORC1, thereby suppressing cell growth and proliferation.
  Under conditions of lowered blood glucose and relative energy stress (elevated AMP/ATP
  ratio) post-VSG, AMPK can be activated and inhibits mTORC1 directly, as well as
  indirectly via activation of TSC1/2. mTORC1 can inhibit AMPK in a reciprocal feedback
  loop. AMPK activation further promotes FOXO3, which drives transcriptional programs
  that enhance autophagy, mitophagy, apoptosis, and ROS defense while suppressing
  metabolic activity. Thus, mTORC1 and AMPK/FOXO3 pathways exhibit opposing responses
  to energy and growth factor signals, coordinating anabolic and stress-adaptive cellular
  programs. Additionally, reduced levels of circulating cytokines, interleukins, prolactin
  (PRL), and growth hormone (GH) result in decreased activation of their respective
  receptors and the downstream intrarenal JAK/STAT signaling cascade. The JAK/STAT
  pathway can also interface with the Ras/MAPK and PI3K/Akt pathways (dashed horizontal
  line), further modulating the integrated cellular response. BioRender. Naik, A.
