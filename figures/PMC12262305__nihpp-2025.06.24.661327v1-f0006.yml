figure_title: Validation of upregulated genes in STICs and HGSCs
caption: (A) H&E-stained and immunostained images for SOX4, MCM7, KIFC1, and DBN1
  in selected STIC and HGSC samples. (B) Quantification of protein expression using
  the QuPath program. Violin plots display IHC scores for the selected markers across
  different diagnostic groups and morphologic categories. (C) Schematic illustration
  of the progression from normal fallopian tube epithelium (NFT) through serous tubal
  intraepithelial carcinoma (STIC) to high-grade serous carcinoma (HGSC). The possible
  genes and the pathways in which they are involved are listed
