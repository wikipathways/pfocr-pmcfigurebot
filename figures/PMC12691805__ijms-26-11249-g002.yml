caption: 'Transcriptomic profiling of E. purpurea leaves in response to biochar amendment.
  (a) Functional annotation statistics of unigenes across seven public databases.
  (b) Species distribution of homologous sequences. (c) Sequence similarity distribution
  of annotated unigenes. (d) Volcano plot identifying DEGs between biochar-amended
  and control groups. The red, green, and blue dots represent the up-regulated, down-regulated,
  and non-significant differentially expressed genes, respectively. (e) Gene Ontology
  (GO) functional classification of DEGs. (f) Kyoto Encyclopedia of Genes and Genomes
  (KEGG) pathway enrichment analysis of DEGs. Abbreviations in (a): NR, Non-Redundant
  Protein Sequence Database; NT, Nucleotide Sequence Database; KO, KEGG Orthology;
  Pfam, Protein Families Database; GO, Gene Ontology; KOG, euKaryotic Orthologous
  Groups'
