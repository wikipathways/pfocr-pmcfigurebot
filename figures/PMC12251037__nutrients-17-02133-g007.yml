figure_title: Graphical illustration of the hotspots of the FA non-responder group.
caption: Graphical illustration of the hotspots of the FA non-responder group. The
  mutations occurring in at least 50% of the non-responder group can be seen in the
  figure. The main components of folic acid-related pathways are represented by central
  nodes, which correspond to pathways like transferring one-carbon groups, folate
  cycle, folate biosynthesis, methionine cycle, cysteine and methionine metabolism,
  and glycine, serine, and threonine metabolism. The surrounding nodes stand for the
  pathway-related gene-mutation pairs. In four cases, the central and surrounding
  nodes are connected by a red dashed line. These highlighted parts represent those
  pathway-related group-specific mutations that occur in at least 70% of FA non-responder
  patients, and were found in less than 50% of FA responders
