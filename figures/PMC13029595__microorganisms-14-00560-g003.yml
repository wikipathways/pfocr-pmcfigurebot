figure_title: Functional analysis of the seminal microbiota and composition/differential
  analysis of metabolites across storage time points.
caption: Functional analysis of the seminal microbiota and composition/differential
  analysis of metabolites across storage time points. (A) Predicted microbial metabolic
  functions based on KEGG pathways. (B) Temporal trends of significantly altered microbial
  functional pathways during storage, Different lowercase letters (a, b, c) represent
  significant differences between groups at the same storage time point (p < 0.05).
  (C) Line plot showing changes in metabolism of cofactors and vitamins over time.
  (D) Venn diagram illustrating the origins of detected metabolites (host-derived,
  microbial-derived, or shared). (E) KEGG pathway enrichment analysis of metabolites
  grouped by origin. (F,G) Orthogonal partial least-squares discriminant analysis
  (OPLS-DA) score plots in negative-ion (F) and combined positive-/negative-ion (G)
  modes. (H) Random forest analysis ranking the most influential metabolites across
  storage intervals
