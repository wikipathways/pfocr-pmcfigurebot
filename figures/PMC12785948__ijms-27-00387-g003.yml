caption: 'The activation effect of lathyrol on the PPARγ signaling pathway. (A) GSEA
  enrichment analysis after lathyrol treatment. (B) Differentially expressed PPARγ-related
  genes after lathyrol treatment. (C,D) WB detection of nuclear translocation and
  expression of PPARγ. (E) RT-qPCR detection of mRNA expression levels of PPARγ. (F)
  Immunofluorescence detection of nuclear translocation and expression levels of PPARγ
  (scale bar: 50 um). Data are presented as mean ± standard deviation. All experiments
  were independently repeated at least three times. * p < 0.05, ** p < 0.01, *** p
  < 0.001, **** p < 0.0001'
