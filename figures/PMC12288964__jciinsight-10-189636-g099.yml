caption: (A) Venn diagram of detected proteins in the IPF epithelia overlying FF as
  compared with IPF and nonfibrotic control alveoli. (B, C, and E) Volcano plots comparing
  (B) IPF epithelia overlying the FF and IPF alveoli, (C) the subset of proteins associated
  with “eIF2 signaling,” and (E) the subset of significantly changed proteins in B
  reassessed for the MUC5B promoter variant, showing the negative natural log of adjusted
  P values plotted against the log2(fold change) for each protein. (D) A heatmap displaying
  z scores of the significantly changed “eIF2 signaling” proteins comparing IPF epithelia
  overlying FF, IPF alveoli, and nonfibrotic control alveoli. n = 12 per group (6
  WT and 6 MUC5B promoter variant)
