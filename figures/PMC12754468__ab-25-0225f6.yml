caption: Schematic illustration of the proposed mechanism by which IAld ameliorates
  intestinal barrier dysfunction. IAld activates the AhR/AMPK signaling pathway, which
  in turn maintains mitochondrial homeostasis in intestinal epithelial cells and alleviates
  intestinal barrier dysfunction in colitis mice. This schematic diagram was created
  with BioGDP.com. IAld, indole-3-carboxaldehyde; TNF-α, tumor necrosis factor-alpha;
  AMPK, AMP-activated protein kinase; AhR, aryl hydrocarbon receptor
