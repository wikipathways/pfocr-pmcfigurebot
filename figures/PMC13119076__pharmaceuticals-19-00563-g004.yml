  plasma metabolomics for rats in each group. (B) OPLS-DA score plot for the positive
  mode: Con-Mod-PBM plasma metabolomics. (C) Volcano plots showing differential metabolites
  between Con vs. Mod and Mod vs. PBM. (D) Pathway enrichment analysis of differential
  plasma metabolites. (E) Statistical analysis of 14 key differential metabolites.
  Data are presented as mean ± SD. Comparisons between groups were made using one-way
  ANOVA with post hoc analysis. * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
  versus the Con group. # p < 0.05, ## p < 0.01, ### p < 0.001, #### p < 0.0001 versus
