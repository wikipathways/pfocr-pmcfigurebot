figure_title: Distinct protein dynamics and enriched pathways in N-Terminal and C-Terminal
  interactors of Kv1.
caption: Distinct protein dynamics and enriched pathways in N-Terminal and C-Terminal
  interactors of Kv1.3 channel. (A) DEA of N-Terminal-TurboID and Control JTC, illustrates
  1946 interactors of Kv1.3 channel’s N-terminal. (B) DEA of C-Terminal-TurboID and
  Control JTC, highlights 1304 proteins enriched at Kv1.3 channel’s C-terminal. (C)
  Intersection of N-terminal (1946) and C-terminal (1304) interactors reveal 672 unique
  proteins associated with N-terminal and 30 with C-terminal. (D) DEA of N-terminal-TurboID
  and C-terminal-TurboID JTCs shows distinct N- (390) and C-terminal (41) interactors
  of Kv1.3 channel. (E) Venn diagram analysis intersecting N-terminal or C-terminal
  specific proteins identified in Fig. 3C and D, shows 908 and 66 unique proteins
  for N-terminal and C-terminal, respectively. (F) GO term enrichment analysis for
  unique N- and C-terminal interactors identified in Fig. 3E identifies protein processing
  function of N-terminal and cell signaling function of C-terminal. (G) Intersection
  of DEPs from N-terminal and C-terminal DEA at AP and bulk level shows 314 proteins
  differentially expressing only in AP proteome. Further analysis showed 310 and 4
  are interactors of N-terminal and C-terminal, respectively. (H) GO term enrichment
  analysis for only AP proteome N-terminal interactors shows terminal role in transcription.
  (I) DEA between C-terminal and C-terminal with PDZ-binding domain removed shows
  5 proteins increased and 7 decreased with domain deletion. All analyses are given
  in detail in Supp. Datasheet 5
