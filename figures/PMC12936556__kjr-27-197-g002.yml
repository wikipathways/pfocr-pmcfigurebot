figure_title: Patient care pathway across integrated academic and community healthcare
  settings. This schematic illustrates the coordinated flow of patient care within
  an integrated healthcare network. Patients receive advanced surgical or chemotherapeutic
  treatments at academic hospitals and specialist centers. Post-treatment, they return
  home and continue longitudinal monitoring through community clinics or primary care
  physician. Routine blood work and infusions are performed at local community blood
  draw and infusion centers, while imaging studies such as CT and MRI are conducted
  at community imaging centers
