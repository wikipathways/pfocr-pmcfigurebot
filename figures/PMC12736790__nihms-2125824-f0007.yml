figure_title: Stra8 regulates neuromodulator genes
caption: '(A) Uniform manifold approximation and projection (UMAP) plots of snRNA-seq
  data from the hippocampus of 3-month-old wild-type (n = 2) and Stra8-cKO (n = 2)
  mice, with annotated cell identities: ExN, excitatory neuron; InN, inhibitory neuron;
  EC, endothelial cell; oligo, oligodendrocyte; MG, microglia; OPC, oligodendrocyte
  precursor cell; PC, pericyte; Ast, astrocyte.(B) Bar plot showing the proportion
  of each cell type identified in the snRNA-seq data from wild-type and Stra8-cKO
  mouse hippocampus.(C and D) Feature plot and violin plot showing relative Pvalb
  expression in InNs from wild-type and Stra8-cKO hippocampus.(E) Venn diagrams with
  genes bound by Stra8 in InNs and representative genes that are upregulated and downregulated
  in wild-type and Stra8-cKO hippocampus.(F and G) Immunostaining for Npas4 in indicated
  genotypes with PBS or KA treatment or in primary hippocampal neuronal culture of
  indicated genotypes.(H) Bar graph showing the proportion of InNs contributing to
  changes in the number and strength of cell-cell interactions in the Stra8-cKO hippocampus
  compared to wild type.(I) Circle plots showing the number of all cell-cell interactions
  (top) or the representative FGF signaling pathway (bottom) among cell clusters in
  the wild-type and Stra8-cKO hippocampus.(J) Pseudotime trajectory plots showing
  the differentiation of OPC, pre-oligo, and oligo in the wild-type and Stra8-cKO
  hippocampus.(K) UMAP plots of MG in the wild-type and Stra8-cKO hippocampus with
  cell-state annotation.See also Figure S9-S14'
article_title: Stra8 links neuronal activity to inhibitory circuit protection in the
  adult mouse brain
