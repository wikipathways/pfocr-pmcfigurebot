figure_title: Integrated plasma metabolomics analysis reveals differential metabolic
  signatures between LNTB patients and healthy controls.
caption: Integrated plasma metabolomics analysis reveals differential metabolic signatures
  between LNTB patients and healthy controls. (A) The relative intensity of differentiated
  plasma metabolites was depicted by the heatmap between the Health group and LNTB
  group. (B) Volcano plot of differential metabolites. (C) Variable importance in
  projection (VIP) plot from OPLS-DA analysis displaying key differentially metabolites
  discriminating LNTB from controls. (D) KEGG pathway enrichment analysis of differential
  plasma metabolites. (E) The chord diagram illustrating correlation coefficients
  among differential metabolites. (F) KEGG regulatory network illustrating the intersections
  among metabolic pathways
