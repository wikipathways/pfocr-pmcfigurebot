figure_title: Metabolic remodeling precedes the development of left ventricular contractile
  dysfunction in hearts of mice overexpressing NR4A2
caption: (A) Pathway enrichment analysis of differentially regulated genes (DRG) from
  the left ventricle of mice at 3, 6 and 12 days after NR4A2 induction. The top 5
  pathways are represented for each comparison. Results are based on the analysis
  of 3438 DRG (day 3 vs day 0), 357 DRG (day 6 vs day 3), 1379 DRG (day 12 vs day
  6), 4550 DRG (day 6 vs day 0), and 4958 DRG (day 12 vs day 0) with n = 4 mice per
  group (2 males/2 females). ETC, electron transport chain; FA, fatty acid. (B) Echocardiographic
  assessment of left ventricular ejection fraction (LVEF), fractional shortening (LVFS),
  and internal diameter at end systole (LVIDs) and end diastole (LVIDd) in Nr4a2-icTg
  mice and Cre control littermates at 3, 6, and 12 days after tamoxifen injection.
  Mean ± SEM of n = 15 to 20 mice per group per timepoint (6 to 10 males/9 to 10 females).
  Data analyzed by mixed effect ANOVA followed by Tukey’s test. *p < 0.05, **p < 0.01,
  and ****p < 0.0001
article_title: Nuclear Receptor Subfamily 4 Group A Member 2 (NR4A2) Induces a Warburg-like
