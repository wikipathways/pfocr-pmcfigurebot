figure_title: Genome-wide CRISPR dropout screens implicate PTPA in DNA interstrand
  cross-link repair
caption: a, Model of replication-coupled ICL repair by the FA pathway.b, Schematic
  describing CRISPR dropout screens using human FANCD2+/+ or FANCD2−/− RPE-1 cells.c,
  Biplot of normZ scores relating viability in psoralen and UVA treated FANCD2+/+
  (y-axis) and FANCD2−/− (x-axis) RPE-1 cells.d, Immunoblot demonstrating efficiency
  of PTPA depletion in FANCD2+/+ and FANCD2−/− RPE-1 CRISPR knockout cell pools. Cells
  were transduced with lentivirus carrying non-targeting (NT) and PTPA-targeting sgRNAs.e,
  Relative RPE-1 cell proliferation after cisplatin treatment was measured using CellTiter-Glo
  reagent. FANCD2+/+ and FANCD2−/− RPE-1 cells were transduced with sgRNAs as in d,
  and cell proliferation was measured after 5 days. Data represent the mean ± standard
  deviation from three technical replicates
