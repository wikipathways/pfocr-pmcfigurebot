caption: Effects of EVs and the SIRT1-overexpressing recombinant adenovirus on SIRT1/SREBP-1c/PGC−1α
  pathway-related proteins and enzyme activities. (a,b) Immunofluorescence assay showing
  the effect of EVs and SIRT1 overexpression on SREBP−1c and PGC−1α proteins in normal
  and 2.4 mM NEFA-treated hepatocytes. (c–f) Effects of EVs and SIRT1 overexpression
  on SIRT1/SREBP−1c/PGC−1α pathway related enzyme activities in normal and hepatocytes
  receiving NEFAs at 2.4 mM. NK, Non-ketosis. CK, Clinical ketosis. Results are presented
  as the mean ± SD (n = 3). * p < 0.05 and ** p < 0.01 vs. the blank group (BG). Empty
  carrier group (EG); SIRT1−overexpression group (SG); 40 μg/mL NK−derived EVs (NK40);
  CK40, 40 μg/mL CK−derived EVs (CK)
