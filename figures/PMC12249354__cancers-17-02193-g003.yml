figure_title: Scaled icon array of biopsy avoidance rate of models A and B.
caption: Scaled icon array of biopsy avoidance rate of models A and B. Displayed is
  the predicted biopsy avoidance rate of models A and B if PSE was used as a triage
  tool. Each graph displays 100 icons, with each icon representing approximately 1%
  of the 134-patient cohort. Blue icons indicate the proportion of patients predicted
  to avoid biopsy, and black icons represent the rest of patients who would continue
  down PCa screening pathways. This figure highlights the differential impact of the
  two models on clinical decision-making pathways depending on how the clinician classifies
  Gleason 3 + 3
