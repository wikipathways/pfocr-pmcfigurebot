figure_title: Single cell RNAseq analysis of manganese treated 100-day cerebral organoids
caption: A) UMAP embedding of all samples (12 organoids aged 100 days) integrated
  and normalized with SCT transform. Cells are colored by cluster assignment. B) Proportion
  of cells assigned to each cluster from individual organoids. Color scheme is the
  same as in A). C) Dot plot of cell identity marker and inflammatory gene expression
  in cell clusters shown in A) (Supplementary Information Dataset S4). Dot size is
  proportional to percentage of cells expressing the gene and color reflects average
  expression level. D) Volcano plot of the manganese differentially regulated genes
  in astrocytes (Supplementary Information Dataset S5). Cut off is p<0.05 and 0.5<
  average log2FC <−0.5. Highlighted genes belong to the categories identified by gene
  enrichment analysis (e) or describing astrocyte function. E) Main up and down regulated
  pathways in manganese treated astrocytes when comparing the genes curated in Molecular
  Signatures Database employing EnrichR tool for gene ontology analysis (Supplementary
  Information Dataset S6). Triangles are up-regulated genes. Circles are downregulated
  genes. F) Heatmap of the scaled gene counts in the astrocyte cluster for individual
  organoids (Supplementary Information Dataset S7). G) Feature plot depicting the
  cells expressing CXCL8 and CXCL10 in control and manganese treated organoids. H)
  UMAP embedding of the subclustered astrocyte population from all organoids. J) Differential
  expression of genes belonging to the interferon response, mitochondrial transcripts
  and RNA processing in the three astrocytes subclusters in response to manganese
  (Supplementary Information Dataset S8). K) Immunofluorescence for dsRNA in manganese
  treated 100-day organoids and in iPSC derived astrocytes. 1) 100-day organoids stained
  for GFAP (red), DNA (blue) and dsRNA (green). Scale bar= 25μm. 2) Quantification
  of the percentage of GFAP cells that were positive for dsRNA in (1) and dsRNA in
  mitochondria in iPSC derived astrocytes shown in (3).1.9x refers to fold of increase,
  Mann Whitney test 3) Human astrocytes derived from iPSC treated or not with 250μM
  Manganese for 24h and stained for dsRNA (green) and the mitochondrial marker TOM20
  (red). Scale bar =10μm
