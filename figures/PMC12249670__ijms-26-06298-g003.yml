figure_title: Endothelial cell transport pathways.
caption: 'Endothelial cell transport pathways. Red small circles—lipophilic drugs
  (passive diffusion); Yellow small circles—cations (ex: sodium) through tight junctions
  (paracellular); Red shape—transport protein (ex GLUT-1 or Glucose Transporter 1,
  aminoacid transporter) and brown shape—glucose, aminoacids; Blue shape—insulin molecule
  binding to a cell surface receptor (Pink shape) and transported across the endothelial
  cell (receptor mediated transcytosis); Starred shape—albumin molecule can be transported
  in this way (adsorptive transcytosis); Dark red circles—cellular proteins which
  can actively transport molecules (efflux pumps); Purple ovals—nuclei of endothelial
  cell.ECs share many molecular pathways and biological mechanisms in a coordinated
  and cooperative manner [28]. In the context of endothelial cell biology, any imbalance
  of endothelial cell activation and inflammation, or activation and dysfunction,
  exerts diverse biological effects by acting on various targeted signaling pathways
  via multidimensional mechanisms. These responses involve a multitude of clinically
  relevant effects, persisting until the balance between production and degradation
  is lost [28]'
