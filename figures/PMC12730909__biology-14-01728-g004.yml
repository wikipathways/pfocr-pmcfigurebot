figure_title: Interactions between the mitochondrion and nucleus.
caption: Interactions between the mitochondrion and nucleus. (1) The proteins encoded
  by the nuclear genome that enter the mitochondria (the red part of the complex)
  are essential for the construction of all complexes of the electron transport chain
  (red dashed lines). The proteins encoded by the mitochondrial genome (the blue part
  of the complex) are very important for Complex I, III, IV, and V (blue dashed lines).
  In addition, the proteins encoded by both genomes are also important for the ribosomes
  in the mitochondria. (2) Anterograde (nucleus to mitochondria) signaling pathway
  regulates mitochondrial gene expression through the nuclear-encoded transcription
  factors (TFs, TFAM and TFB that bind the mtDNA), nuclear receptors (NRs) and ncRNAs.
  (3) Retrograde (mitochondria-to-nucleus) signaling pathway enables the nucleus to
  sense mitochondrial health through retrograde signals such as Ca2+, ROS, acetyl
  coenzyme A (Acetyl-CoA), mitochondria microRNAs (mitomiRs), mitochondria long non-coding
  RNAs (mitolncRNAs), humanin (HN), fibroblast growth factor 21 (FGF21) and mitochondrial
  unfolded protein response (mtUPR). (4) Cytoplasmic translation of mitochondrial
  mRNA (mPACT) can generate new peptides (such as CYTB-187AA), which regulate SLC25A3
  and affect ATP production
