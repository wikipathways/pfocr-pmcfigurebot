figure_title: Differential pathway gene expression in WT and fat-1 mice in response
  to OIR at P17
caption: '(A) Volcano plots of global response to OIR in WT (left) and fat-1 mice
  (right). Highlighted are genes with maximal response in WT mice, with dampened or
  not significant response in fat-1 mice. The x-axis represents log2 fold changes
  between OIR and RA mice and has the same scale in both plots. The y-axis represents
  -log10 adjusted p-values. Note the scale is different for both genotypes given the
  more marked statistical significance in WT mice. (B) Functional enrichment results
  of whole retina RNA sequencing. Significantly regulated genes in response to OIR
  as compared to RA were strongly enriched in inflammation, angiogenesis, and microglial
  activation pathways in wild type (WT) mice (left column in heatmap). These same
  pathways are less significant in fat-1 mice (right column). (C) Differential regulation
  of key pathway genes in response to OIR in WT and fat-1 mice. Shown are results
  for genes that exhibited strong up-regulation in WT mice and dampened or no up-regulation
  in fat-1 mice in response to OIR. Top: bar plot of log2 fold changes (y axis) in
  OIR conditions as compared to RA for P17 mice in both genotypes. Genes are sorted
  by increasing fold change in WT mice (x axis). Middle: position of genes annotated
  in pathways significantly associated with OIR upregulation. Selected gene names
  are shown below. Bottom: bar plot of WT vs. fat-1 log2 fold-change ratios'
