figure_title: JCAD activates the Wnt/β-catenin pathway by promoting an increase in
  downstream FZD1 expression, which mediates the EMT process and thus promotes the
  progression of breast cancer.
caption: 'JCAD activates the Wnt/β-catenin pathway by promoting an increase in downstream
  FZD1 expression, which mediates the EMT process and thus promotes the progression
  of breast cancer. A: qRT‒PCR and Western blot analysis of FZD1 mRNA and protein
  levels in stable FZD1-KD JCAD-OE MDA-MB-231, BT549 and LM2 cells and control cells.
  B: Transwell migration experiments verified that interference with FZD1 expression
  significantly inhibited the migration ability of JCAD-OE MDA-MB-231, BT549 and LM2
  cells (10×). C: Western blot analysis of the protein levels of key molecules involved
  in EMT and the Wnt/β-catenin pathway in stable FZD1-KD and FZD1-shNC JCAD-OE MDA-MB-231,
  BT549 and LM2 cells and control cells. D: Schematic diagram of exosomal JCAD promoting
  the progress of breast cancer'
