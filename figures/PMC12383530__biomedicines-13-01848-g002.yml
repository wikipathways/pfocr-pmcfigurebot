figure_title: Hormonal and endocrine dysregulation of lactogenesis in obesity.
caption: Hormonal and endocrine dysregulation of lactogenesis in obesity. Under physiological
  conditions, infant suckling activates sensory pathways that stimulate the hypothalamus
  to release prolactin and oxytocin. These hormones are essential for initiating milk
  synthesis (prolactin) and milk ejection (oxytocin) from the mammary glands. In the
  context of obesity, multiple disruptions impair this finely tuned process. Prolactin
  signaling and insulin sensitivity are reduced, hindering the initiation and maintenance
  of adequate milk output. Additionally, altered circadian rhythms associated with
  obesity lead to hormonal imbalances that negatively affect lactation. Elevated leptin
  levels—commonly found in obesity—have been implicated in limiting the mammary gland’s
  ability to sustain robust lactation. Furthermore, excess adipose tissue acts as
  a hormonal reservoir for progesterone and estrogen, delaying the necessary postpartum
  decline in these hormones that is crucial for a successful onset of milk secretion
article_title: Etiology of Delayed Lactogenesis in Obesity
