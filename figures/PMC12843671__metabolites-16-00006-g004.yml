caption: 'The BAs synthesis pathway is a key downstream effector of taurine-induced
  HCC. (A–E) Representative liver images, LW/BW ratio, total BA levels, Western blot
  verification of HA-tagged Cyp7a1, HA-tagged Baat overexpression (GAPDH: loading
  control) from mice injected with control plasmids, Cyp7a1-overexpressing plasmids,
  or Baat-overexpressing plasmids (control: n = 6, Cyp7a1 OE: n = 5, Baat OE: n =
  5). (F–I) Representative liver images, LW/BW ratio, total BA levels, Western blot
  verification of HA-tagged Baat overexpression (GAPDH: loading control) from mice
  injected with control plasmids, or Baat-overexpressing plasmids, which were administered
  taurine intraperitoneally every two days (control: n = 4, Baat OE: n = 6). (J–L)
  Representative liver images, LW/BW ratio, liver weight from mice injected with control
  plasmids, or Cyp7a1-overexpressing plasmids, which were administered taurine intraperitoneally
  every two days (n = 4). Bars, SD; * p < 0.05; ** p < 0.01; ns p > 0.05'
