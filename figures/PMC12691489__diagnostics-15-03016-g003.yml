figure_title: GSEA and visualization of the PPI network.
caption: 'GSEA and visualization of the PPI network. (A) The Venn diagram of genes
  among the two DEG lists and the two lists of co-expression genes. A total of 39
  overlapping differential co-expression genes are detected; (B) Functional enrichment
  analysis of differential co-expression genes (C–E) The GO enrichment analysis circular
  network plot presents a network of relationships between genes and their associated
  signaling pathways. The color of the node represented its cluster identity. Gene
  Ontology terms are significantly enriched in biological processes related to mitotic
  regulation and spindle organization, as well as molecular functions involving microtubule
  binding. KEGG pathway analysis reveals strong associations with cell cycle regulation
  and HTLV-1 infection pathways. (F) PPI network of overlapping genes constructed
  using the STRING database and visualized in Cytoscape. Isolated nodes were excluded
  from the analysis. (G) Hub gene identification using the Maximum Clique Centrality
  algorithm revealed eight central genes: TROAP, TPX2, TOP2A, KIF2C, AURKA, CDC20,
  PRC1, and AURKB. (H) Univariate Cox regression analysis of OS of hub genes in BCa.
  Overall survival analysis of the eight candidate hub genes was performed using the
  TCGA dataset. Univariable Cox regression analysis demonstrated that among all candidates,
  only elevated CDC20 expression showed a statistically significant correlation with
  reduced overall survival (p < 0.05), identifying it as a prognostic biomarker for
  bladder cancer patients'
