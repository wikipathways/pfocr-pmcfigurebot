figure_title: Optoactivation of the ZI–RVM circuit alleviates pain hypersensitivity
  of CCI mice.
caption: 'Optoactivation of the ZI–RVM circuit alleviates pain hypersensitivity of
  CCI mice. (A) Schematic of the strategy for optogenetic activation of RVM-projecting
  ZIGABA terminals. (B) Representative images of DIO-ChR2-EGFP expression in the ZIGABA
  (left) and RVM with the fiber track above (right). Scale bar, 200 μm. White linear
  demarcations define the extent of the associated brain areas, while the rectangular
  white delineations designate the site of the insert core. (C) Effects of optogenetic
  activation of the ZIGABA-RVM circuit on mechanical thresholds of injured hind paws
  (n = 8 mice for the EGFP group and n = 7 mice for the ChR2 group). (D–H) Effects
  of optoactivation of the ZIGABA-RVM pathway on locomotion activity and anxiety level:
  example tracts (D), total distance (E), and time spent in the center (F) in the
  open field test (OFT), and example tracts (G) and time in open arms (H) in the elevated
  plus maze (EPM) test. ns p > 0.05, ** p < 0.01. Repeated-measures two-way ANOVA
  followed by Sidak post hoc test for (C) and unpaired t-test for (E,F,H). Data were
  presented as mean ± SEM'
