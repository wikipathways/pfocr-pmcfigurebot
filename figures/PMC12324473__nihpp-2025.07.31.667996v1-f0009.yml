figure_title: SmoM2 tumors lacking Pten have altered neurogenesis and immune signaling
caption: '(A) Volcano plot showing differentially expressed genes in GCP-like tumor
  cell clusters (3, 4, 8) (red: adjusted p-value <0.05, ab[log2fold-change]>0.5),
  in SmoM2-Ptenfl/fl tumors compared to SmoM2. (B) Gene set enrichment analysis (GSEA)
  plots (Hallmark terms) showing that mTORC1 signaling pathway is significantly unregulated
  in SmoM2-Ptenfl/fl tumors compared to SmoM2. (C) Violin plots showing expression
  levels of mTORC1 signaling pathway genes in the two genotypes. (D) GSEA plots (Hallmark
  terms) showing that Interferon alpha response is significantly downregulated in
  SmoM2-Ptenfl/fl tumors compared to SmoM2. (E) Violin plots showing expression levels
  of Interferon alpha response genes in the two genotypes. (F) GSEA plots of Gene
  ontology (GO) terms (biological processes) showing that regulation of neural differentiation
  is significantly upregulated in SmoM2-Ptenfl/fl tumors compared to SmoM2. (G) Violin
  plots showing expression levels of neural differentiation genes in the two genotypes,
  indicating an early stage of neurogenesis is enhanced. (H) Volcano plot showing
  differentially expressed genes in early GC-like cluster 1 compared to GCP-like cell
  clusters (3, 4, 8) in SmoM2-Ptenfl/fl tumors (red: adjusted p-value <0.05, ab[log2fold-change]>0.5).
  (I) GSEA plots of Gene ontology (GO) terms (biological processes) confirmed upregulation
  of neural differentiation in cluster 1 compared to the GCP-like cell clusters. (J)
  Violin plots showing expression levels of neural differentiation genes in the two
  cell types. (K) GSEA plots of Gene ontology (GO) terms (biological processes) showed
  downregulation of ‘positive regulation of programmed cell death’ in cluster 1 compared
  to the GCP-like cell clusters. (L) Violin plots showing expression levels of programmed
  cell death genes in the two cell types. (M-R) Lateral sagittal sections of tumors
  from SmoM2 mice (P22, M, O, Q) or SmoM2-Ptenfl/fl mice (P16, N, P, R) stained for
  RNA in situ analysis of Cdkn1a, Vldr, Asns, indicating upregulation of mTORC1 signaling
  pathway in Pten mutant tumors'
article_title: PTEN restrains SHH medulloblastma growth through cell autonomous and
  nonautonomous mechanisms
