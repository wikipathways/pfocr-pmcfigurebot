figure_title: Temperature Regulation of Anthocyanin Biosynthesis via MYB-bHLH-WD40
  Complex in Apple.
caption: 'Temperature Regulation of Anthocyanin Biosynthesis via MYB-bHLH-WD40 Complex
  in Apple. (A) Low temperature promotion pathway: Low temperature and UV-B radiation
  induce phosphorylation of MdbHLH3, enhance MdBBX20 expression, and promote MdHY5-MdBBX20
  interaction. These signals converge to enhance the activity of MBW complex (e.g.,
  MdMYB1-MdbHLH3-WD40), which activates structural genes (MdDFR, MdUFGT, CHS, ANS)
  and transcription factors (MdMYBPA1). MdbHLH33 binds to the Low-Temperature Response
  (LTR) element in MdMYBPA1 promoter, shifting biosynthesis from proanthocyanins to
  anthocyanins. Concurrently, MdMYB23 activates MdCBF1/2 and MdANR, enhancing proanthocyanin
  biosynthesis and cold tolerance. (B) High temperature suppression pathway: High
  temperature induces expression of repressors MdBZR1 and MdLBD37, which form a positive
  feedback loop to reinforce each other’s expression. This repressor complex inhibits
  anthocyanin pathway genes and potentially disrupts MBW complex stability. High temperature
  also suppresses key activators (MdMYB10) and accelerates anthocyanin degradation,
  leading to reduced pigmentation'
