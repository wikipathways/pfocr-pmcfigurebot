figure_title: ROS/Hypoxia-responsive cascade self-uncloaking nanoassembly (SRC) for
  precise CRISPR/Cas13a RNP delivery.
caption: ROS/Hypoxia-responsive cascade self-uncloaking nanoassembly (SRC) for precise
  CRISPR/Cas13a RNP delivery. (A) Schematic illustration of cascade self-uncloaking
  and payload release of SRC. (B) left) Release profiles of CH1055 with different
  concentrations of H2O2. right) Release profiles of SN38 and Cas13a/RNP under hypoxic
  environment. (C) tumor images and (D) tumor weight after treatment with different
  formulations, respectively. (E) The activation of the cGAS-STING pathway was evaluated
  by the mRNA expression. (F) The NIR-II tumor fluorescent images of mice after intravenous
  injection at 2, 4, 8, 12, and 24 h, and the fluorescence images of major organs
  and tumors after the sacrifice of mice. Scale bar = 2 cm. (G) The quantitation of
  the percent of corresponding cells. Adapted with permission from 194, copyright
