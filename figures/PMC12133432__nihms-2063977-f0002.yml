figure_title: A population of glycolytic neutrophils expressing the CD71 receptor
  is expanded in brain tumors where it acquires a hypoxic signature
caption: (A). Schematic representation of the step-by-step process to isolate and
  sequence neutrophils from brain tumor-bearing mice for single-cell RNA sequencing
  with 10x Genomics. Created in https://BioRender.com. (B). UMAP projection of Neutrophils
  with cells colored by clusters N1, N2, and N3 (left) and cluster composition in
  Tumor vs. Blood samples (right). (C). Heatmap of signature genes exclusively expressed
  in each Neutrophils cluster. Shown are Z-scales gene expression levels. (D). Gene
  set enrichment analysis showing enriched Hallmark pathway in each neutrophils cluster,
  including both blood and tumor clusters. Shown are normalized enrichment scores.
  (E). CD71 (Tfrc), LDHA (Ldha), GLUT-1 (Slc2a1), glycolysis and hypoxia expression
  on UMAP, separating blood from tumor clusters. Glycolysis and hypoxia overall expression
  were derived using Glucose_metabolism gene set in REACTOME and Hypoxia gene set
  in HALLMARK database, respectively
article_title: Functional reprogramming of neutrophils within the brain tumor microenvironment
  by hypoxia-driven histone lactylation
