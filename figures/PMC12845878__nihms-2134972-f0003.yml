figure_title: RNA containing the modified base acp3U stimulates innate immune responses
caption: a, IFNβ ELISA of peritoneal macrophage supernatants 6 h posttransfection
  with small RNA derived from WT and two single cell clones of DTWD2 KO U2OS cells
  treated with or without PNGase F, RNase cocktail or PNGase F + RNase cocktail. b,
  IFNβ ELISA of peritoneal macrophage supernatants 24 h poststimulation with apoptotic
  WT, DTWD2 KO1 and DTWD2 KO2 U2OS cells treated with or without PNGase F or PNGase
  F + RNase cocktail at a 1:4 macrophage to U2OS cell ratio. c, IFNβ ELISA of peritoneal
  lavages from WT mice (n = 4) 24 h after i.p. injection with 10 million apoptotic
  WT or DTWD2 KO U2OS cells treated with or without PNGase F or PNGase F + RNase cocktail.
  d,e, IL-6 ELISA of THP1 macrophage supernatants 6 h poststimulation (d) or posttransfection
  (e) with synthetic unmodified RNA or synthetic RNAs modified with acp3U (acp3U-8C
  and acp3U-8D). f,g, Bubble plots of ingenuity pathway analysis (IPA) analysis of
  RNA-seq of THP1 macrophages stimulated with acp3U-8C-RNA (f) or PNGase F-treated
  small RNAs (g). Activation or repression of pathways is represented by z-score (x
  axis and colour) and pathway enrichment by −log-P (y axis). Dot size is the ratio
  of the differentially expressed gene (DEG) hits within the total pathway from IPA.
  h, Schematic of the hypothesis in which acp3U exposed on RNA is immunostimulatory,
  which is attenuated by modifying the carboxylic acid with an amide or GlcNAc. i,
  TNF ELISA of THP1 macrophage supernatants 6 h postaddition or posttransfection with
  uridine, acp3U, acp3U-modified with an N-acetylglucosamine (acp3U-GlcNAc), acp3U
  + uridine or acp3U-GlcNAc + uridine. Data are represented as mean ± s.e.m. (a–e,i).
  Pooled data from three (a,b,d,e,i) or four (c) independent experiments are shown.
  *P < 0.05; **P < 0.01; ***P < 0.001; ****P < 0.0001; two-way ANOVA with Tukey’s
  test (a,b,d,e,i) or one-way ANOVA with Šídák’s test (c). nt, nucleotide(s)
