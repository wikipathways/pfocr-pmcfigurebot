figure_title: Sequential changes in the probing behaviour of M.
caption: 'Sequential changes in the probing behaviour of M. persicae on sucrose diets
  with different concentrations of nemertide α-1 (1 µM, 10 µM, and 100 µM) during
  4-h EPG experiments. The mean proportion of time spent on different stylet activities
  was measured: pathway (d-C), salivation into the diet (d-E1), active ingestion of
  the diet (d-G), non-penetration—aphid stylets remaining outside of the diet (d-np).
  Measurements for all individual aphids were included in the analysis. Values represent
  the means of n replicates per treatment (n = 19: control, n = 19: 1 µM, n = 19:
  10 µM and n = 20: 100 µM)'
