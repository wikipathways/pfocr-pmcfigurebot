figure_title: SC144 counteracted mTORC1-associated autophagic alterations
caption: '(A) Schematic of phosphoproteomics analysis. (B) Two (MAPK, PRKCZ, italicized,
  red stars) of the top 10 kinases identified in PAB-Veh were downstream of GP130.
  The mTORC1 subunit, RPS6KB1 (red italics) was also predicted to be enriched. (C)
  In PAB-SC144 RVs, polo-like kinases (PLK, red italics), which antagonize mTORC1
  were predicted to be enriched. (D) Primary steps in autophagy. Contents are isolated
  in an autophagosome, which fuses with a lysosome where the products are degraded
  and recycled. mTORC1 inhibits the initiation of autophagy. The autophagy inhibitor,
  bafilomycin (BAF), prevents lysosome and autophagosome fusion. Light chain 3 (LC3)
  is a component of autophagosomes. Porcine RV proteomics of the (E) autophagy, (F)
  mitophagy, and (G) lysosome pathways revealed many proteins were downregulated in
  PAB-Veh, but normalized with SC144 treatment. (H) Human PAH patients with decompensated
  RV function (dRV) had mostly decreased abundances of autophagy pathway proteins.
  (I) Mitophagy pathway proteins were mostly upregulated in dRV patients. (J) dRV
  patients had primarily decreased abundances of lysosome pathway proteins. Transcriptionally,
  similar numbers of genes had reduced expression between dRV, and compensated RV
  (cRV) patients in the (K) autophagy and (L) mitophagy pathway, but hierarchical
  cluster analysis clustered cRV and control groups together. (M) Lysosome pathway
  transcripts were mostly increased in cRV patients compared to dRV and control. (N)
  Representative confocal micrographs of human induced pluripotent stem cells differentiated
  into cardiomyocytes (iPSC-CMs) showed treatment with the autophagy inhibitor BAF
  or the GP130 ligand oncostatin M (OSM) increased LC3 positive puncta (white arrows:
  representative LC3 puncta; green: LC3; blue: DAPI) quantified as (O) the percent
  area occupied by LC3 puncta (Kruskal-Wallis ANOVA with Dunn’s post-hoc, medians
  shown). (P) Representative confocal micrographs of subsequent iPSC-CMs treated with
  either BAF or OSM with SC144 demonstrated SC144 treatment prevented LC3 accumulation
  (white arrows, green: LC3, blue: DAPI) quantified as (Q) the percent area occupied
  by LC3 (Mann-Whitney U-test, medians shown). In E-M scale bars show z-score of protein
  abundance or gene expression between all 3 groups'
