figure_title: MiR-193a-3p modulates the E2-regulated ALK1/ID1 pathway.
caption: MiR-193a-3p modulates the E2-regulated ALK1/ID1 pathway. (A–D) Representative
  blots and bar graphs of Activin receptor-like kinase 1 (ALK1) and inhibitor of differentiation
  1 (ID1) after treatment with or without 10 nM E2 for 45 min or transfection with
  the control mimic (MC) and miR-193a-3p mimic (M193a). Total Akt and β-actin were
  used as loading controls. (E,F) ALK1-specific antagonizing antibody (ALK1fc, 100
  ng/mL) abrogates the effects of E2, transforming growth factor (TGF)-β and miR-193a-3p
  antimir on tube formation. Untransfected HUVECs and cells transfected with the control
  antimir (AC) and miR-193a-3p antimir (A193a) were pre-treated with ALK1fc for 30
  min and subsequently with or without 10 nM E2 or TGF-β1 (1 ng/mL) for 30 min and
  plated on the Matrigel. Tube length was measured after 16–18 h. Photomicrographs
  show representative images for each treatment. n = 3; * p < 0.05 compared to the
  respective control; § p < 0.05 as indicated
