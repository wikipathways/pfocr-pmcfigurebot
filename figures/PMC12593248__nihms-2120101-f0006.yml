figure_title: IGF2BP3 loss of function impacts glycolytic metabolism and m6A RNA modifications
  in vivo
caption: (A) ELISA measurement of m6A modification from murine bone marrow isolated
  following transplantation with Lin− MLL-Af4 bone marrow (see Lin et al.13) (n =
  6, NT; n = 7, I3sg2; one-way ANOVA with Bonferroni’s test; *p < 0.05).(B) Chemical
  structure of I3IN-002.(C) Representative Seahorse XF extracellular acidification
  rate (ECAR) kinetic trace in SEM cells treated with vehicle or I3IN-002, a small-molecule
  inhibitor of IGF2BP3 (n = 4).(D) Aggregate lactate efflux rates from Seahorse XF
  analysis in SEM cells treated with the vehicle of I3IN-002 (n = 3).(E) ELISA measurement
  of m6A RNA modifications in SEM cells treated with vehicle, STM2457, and I3IN-002;
  n = 3.(F) Heatmap depicting significantly altered metabolites from DMSO-treated
  versus I3IN-002-treated SEM cells by LC/MS. The common metabolites that are downregulated
  both after IGF2BP3 deletion and after treatment with I3IN-002 are marked in purple;
  n = 3.(G) MetaboAnalyst-based pathway enrichment analysis of differentially regulated
  metabolites in the DMSO-treated versus I3IN-002-treated SEM cells. The common pathways
  that change after IGF2BP3 deletion and after treatment with I3IN-002 are marked
  in purple.Unless otherwise noted, all data are represented as mean ± standard deviation
  (SD), compared by two-sided unpaired t test; *p < 0.05, **p < 0.01, and ***p < 0.001.
  All experiments were repeated at least twice for consistency. Refer also to Figure
  S6
