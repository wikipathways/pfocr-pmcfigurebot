figure_title: ET-1 stimulated visceral HWP growth through the JAK2/STAT3 pathway.
caption: 'ET-1 stimulated visceral HWP growth through the JAK2/STAT3 pathway. We pretreated
  cells with the JAK2/STAT3-specific inhibitor AG490 for 1 h and then incubated them
  with ET-1 for an additional 48 h. AG490 prevented ET-1-induced increases in both
  the number and viability of HWPs (A and B). Western blot analysis revealed that
  AG490 prevented ET-1-stimulated STAT3 phosphorylation (C). All the data are expressed
  as the mean ± standard error of the mean (SEM) of three independent experiments.
  *p < 0.05 vs. the control; #p < 0.05, ET-1 vs. AG490 + ET-1'
