caption: Comparative analysis of anti-diabetic differentially abundant metabolites
  (DAMs) from ML, SG, and MLSG. (a) Venn diagram showing the distribution of 26 bioactive
  DAMs with reported anti-hyperglycemic potential, classified into ML-specific, SG-specific,
  shared, and MLSG-unique metabolites. (b) Hierarchical clustering heatmap of the
  26 DAMs, illustrating distinct metabolic profiles between MLSG and the individual
  extracts. (c) KEGG pathway enrichment of the 26 DAMs, highlighting predominant involvement
  in phenylpropanoid biosynthesis, flavonoid/flavone biosynthesis, and terpenoid pathways
