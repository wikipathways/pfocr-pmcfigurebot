figure_title: Phosphoproteomics profile of SUM-149 WT and SC3KO cells.
caption: 'Phosphoproteomics profile of SUM-149 WT and SC3KO cells. (A) Volcano plots
  showing differentially phosphorylated sites for four comparisons: (A) upper-left
  panel: wild-type (WT) cells treated with MK-8353 vs. untreated (NT) (WT: MK vs.
  NT); upper-right panel: SCAMP3-knockout (SC3KO) cells treated with MK-8353 vs. NT
  (SC3KO: MK vs. NT); lower-left panel: untreated cells, comparing SC3KO vs. WT (NT:
  SC3KO vs. WT); lower-right panel: MK-8353-treated cells, comparing SC3KO vs. WT
  (MK: SC3KO vs. WT). Volcano plot shows the effects on phosphorylated sites expression
  analyzed at −1.5 ≥ 1.5 log2-fold change (vertical black lines). Down-regulated phosphosites
  are to the left of the vertical black line while up-regulated phosphosites are to
  the right. Phosphosites with significant changes (p ≤ 0.05) are plotted above the
  horizontal line. (B,C) Functional analysis of regulated differentially phosphorylated
  nuclear proteins in (B) untreated and (C) MK-8353-treated conditions. (D) Venn diagram
  illustrating the overlap of significantly regulated phosphoproteins among the different
  comparisons. Statistical analysis was performed using MetaboAnalyst 6.0 with a significance
  threshold of p ≤ 0.05 and a Log2 fold change (FC) ≥ 1.5. Functional analysis was
  performed using Ingenuity Pathway Analysis (IPA) software version 24.0.1'
