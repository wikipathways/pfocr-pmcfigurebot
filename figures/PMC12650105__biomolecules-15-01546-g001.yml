figure_title: Schematic of microbial-metabolite-mediated regulation of ferroptosis
  in CRC.
caption: 'Schematic of microbial-metabolite-mediated regulation of ferroptosis in
  CRC. Short-chain fatty acids (SCFAs) downregulate key antioxidant genes (GPX4 and
  SLC7A11) and upregulate the lipid-metabolizing enzyme ACSL4, thereby promoting lipid
  peroxidation and ferroptosis. Polyamines enhance GPX4 protein stability, increasing
  cellular resistance to ferroptosis. Conversely, indole-3-acrylic acid (IDA) activates
  the AHR signaling pathway, leading to ALDH1A3 upregulation and increased NADH production,
  which fuels the FSP1/CoQ10 antioxidant axis and confers ferroptosis resistance.
  This schematic highlight how microbial metabolites directly target critical nodes
  in ferroptosis regulation. Red arrows represent inhibitory effects, and green arrows
  represent promotive effects. Abbreviations: AHR, Aryl Hydrocarbon Receptor; GPX4,
  Glutathione Peroxidase 4; LPO, Lipid Peroxidation; ROS, Reactive Oxygen Species;
  DCA, Deoxycholic Acid; TFRC, Transferrin Receptor; Ferroportin, Iron Export Protein;
  NCOA4, Nuclear Receptor Coactivator 4; SLC7A11, Solute Carrier Family 7 Member 11;
  RSL3, RAS-Selective Lethal compound 3 (a known ferroptosis inducer); FSP1, Ferroptosis
  Suppressor Protein 1; CoQ10, Coenzyme Q10; ALDH1A3, Aldehyde Dehydrogenase 1 Family
  Member A3; NADH, Nicotinamide Adenine Dinucleotide (reduced form); IDA, Indole-3-Acrylic
  Acid; DAMPs, Damage-Associated Molecular Patterns'
