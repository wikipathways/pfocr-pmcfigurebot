caption: 'Molecular Pathways in Postmenopausal Osteoporosis: From Estrogen Deficiency
  to Therapeutic Targets. This figure illustrates the molecular pathways linking estrogen
  deficiency to bone loss and therapeutic intervention points. Arrows indicate the
  direction of signaling cascades and their downstream cellular effects. Color coding:
  Light blue represents the central initiating event (estrogen deficiency); Light
  pink/red indicates pro-resorptive pathways (RANKL/OPG axis and cytokine cascade)
  leading to increased osteoclast activity; Light green indicates the anti-anabolic
  sclerostin/Wnt pathway leading to decreased osteoblast function; Darker pink/salmon
  shows cellular consequences (osteoclast activation and T-cell activation); Darker
  green shows osteoblast suppression; Yellow represents net bone loss; Dark blue-gray
  indicates therapeutic targets with corresponding drug classes. Abbreviations: IL,
  interleukin; M-CSF, macrophage colony-stimulating factor; OPG, osteoprotegerin;
  PTH, parathyroid hormone; PTHrP, PTH-related protein; RANKL, receptor activator
  of nuclear factor-κB ligand; SOST, sclerostin gene; TNF, tumor necrosis factor'
