figure_title: Semaglutide Improves Hepatic Metabolism and Reduces Fibrotic Signalling
caption: (A) UMAP of all nuclei, colored by cell type. (B) Dot Plot of top marker
  genes of each cell type, where dots are sized by percent nuclei expressing the gene
  in each cell type and colored by average normalized expression per cell, scaled
  per gene. (C) UMAP of all hepatocyte nuclei, colored by subcluster and labeled with
  markers of each cluster. (D) Heatmap depicting scaled aggregated expression of the
  top 50 differentially upregulated (left) or downregulated (right) transcripts in
  hepatocytes of semaglutide-treated animals compared to untreated HFpEF animals.
  (E) GProfiler’s g:GOSt KEGG pathway enrichment analysis of genes significantly (p-adj.
  < 0.05 by Wilcoxon rank-sum test) up- (AvgLog2FC > 0.5) or downregulated (AvgLog2FC
  < −0.5) in hepatocytes, endothelial cells, immune cells, or mesenchymal cells from
  livers of semaglutide-treated animals. Dot intensity is colored by fold enrichment
  (percent of input genes in a given pathway/percent of input genes in the background
  gene set), with red gradient indicating pathways enriched in upregulated genes and
  blue gradient indicating pathways enriched in downregulated genes in semaglutide-treated
  animals compared to untreated controls. Dot size indicates the size of the intersection
  between input genes and genes in the KEGG term. (F) HOMER motif analysis of genes
  significantly (p-adj. < 0.05 by Wilcoxon rank-sum test) up- (AvgLog2FC > 0.5) or
  downregulated (AvgLog2FC < −0.5) in hepatocytes of semaglutide-treated animals.
  (G) Heatmap illustrating the downregulation of extracellular matrix protein transcripts
  in hepatic mesenchymal cells of semaglutide-treated animals compared to untreated
  HFpEF animals. Scaled aggregate expression is depicted in a gradient from low (blue)
  to high (red)
