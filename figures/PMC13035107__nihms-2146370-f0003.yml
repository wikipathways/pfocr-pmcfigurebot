figure_title: Temporal transcriptomic profiling and therapeutics prediction in an
  anti-CD40 murine colitis model
caption: 'a. Experimental scheme showing injection of anti-CD40 antibody into Rag1−/−
  on Day 0 [n = 8] and co-injection of anti-p19 for the therapeutic group [n = 7].
  Fecal samples were collected from Day 0 to Day 10. Primer set mPS3, including mPS2
  and 48 previously reported genes related to the anti-CD40 model, was used for Foli-seq
  quantification.b. Schematic illustration of IL-23 signaling pathway involving STAT3
  and STAT4 and subsequent induction of IL-22 production. Anti-p19 antibody targets
  the p19 subunit of IL-23 and prevents subsequent IL-23 induced production of IL-22.c.
  Day 10 colitis scores from tissues of isotype control (anti-CD40 only) [n = 8, biological
  replicates] and anti-p19 treatment groups [n = 7, biological replicates]. Definition
  of box-plot elements: center line: median; box limits: upper and lower 25th quartiles;
  whiskers: 1.5× interquartile range. *, **, *** indicate significance levels from
  a two-sided Wald test with Benjamini-Hochberg FDR correction: * q < 0.05; ** q <
  0.01; *** q < 0.001.d. Plot of mouse body weight over time showing significant weight
  drop in first 4 days and differential rebound between control [n = 8, biological
  replicates] and therapeutic groups [n = 7, biological replicates]. Definition of
  box-plot elements: center line: median; box limits: upper and lower 25th quartiles;
  whiskers: 1.5× interquartile range. *, **, *** indicate significance levels from
  a two-sided Wald test with Benjamini-Hochberg FDR correction: * q < 0.05; ** q <
  0.01; *** q < 0.001.e. Heatmap showing temporal expression profiles of key immune-related
  genes, reflecting immediate, early, and late response patterns in isotype control
  and anti-p19 therapeutic groups.f-h Gene expression profiles of key components of
  IL-23 signaling pathway: IL-23A ligand (f), STAT3 signaling molecule (g), and downstream
  cytokine IL-22 (h) for control [n = 8, biological replicates] and therapeutic groups
  [n = 7, biological replicates]. Definition of box-plot elements: center line: median;
  box limits: upper and lower 25th quartiles; whiskers: 1.5× interquartile range.
  *, **, *** indicate significance levels from a two-sided Wald test with Benjamini-Hochberg
  FDR correction: * q < 0.05; ** q < 0.01; *** q < 0.001.i. Correlation of body weight
  on Day 10 versus Ccl3 and Cd52 expression levels on Day 0. The q-value was calculated
  by performing two-sided t-test followed by FDR correction using Benjamini-Hochberg
  procedure on the linear regression to test if co-efficient of the variable equals
  to zero in the regression. Ribbon on the curve indicates the 95% confidence interval
  around the fitted regression line'
