figure_title: The H&E Retrieval Engine (HERE)
caption: 'The framework comprises two modules: Development and Retrieval.a, The engine
  development has two stages: model training and index generation. Stage 1 trains
  a prediction model composed of an image encoder, attention map, and decoder using
  TCGA data from 32 tumor types. The input to the image encoder is H&E whole-slide
  images, and the decoder output includes a binary indication of gene mutation functions
  in cancer progression and average expression of pathway gene sets. Stage 2 indexes
  patch vectors encoded from the whole slide images from the NCI Lab of Pathology,
  TCGA, CPTAC, and spatial transcriptomics studies.b, Two retrieval applications.
  For a query H&E image patch or region, the Image-to-Image retrieval returns similar
  image patches and associated whole slides from the indexed database. If users select
  images with spatial transcriptomics (ST) data, HERE returns images that closely
  match the query and the corresponding gene expression profiles from ST detection
  spots. The Transcriptomics-to-Image retrieval finds H&E slides with paired ST data
  where the query gene has high expression levels in ST detection spots associated
  with specific image feature clusters from those slides'
