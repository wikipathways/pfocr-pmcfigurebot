figure_title: A ketogenic diet modulates intratumoral metabolism in GBM
caption: (A and B) Global metabolic profiling was performed on MES83 tumors extracted
  from mice fed a standard diet (SD; n = 7) or KD (n = 7) and visualized by partial-least-squares
  discriminant analysis (PLS-DA) score plot (A) and hierarchical clustering (B). (C)
  Significantly altered metabolites (P ≤ 0.05; Wilcoxon’s rank-sum test) in KD-fed
  mice were classified into major metabolic categories and the differential abundance
  (DA) scores of each pathway plotted. Metabolic categories having more than 3 metabolites
  were used in the DA plot. Sizes of the bubbles are relative to the number of metabolites
  in each category. (D) Identified fatty acids for indicated metabolic categories
  (phosphatidylcholines [PC], sphingomyelins [SM], triacylglycerides [TG]) were classified
  as saturated or unsaturated fatty acids based on fatty acid chain
article_title: Enhanced lipid metabolism serves as a metabolic vulnerability to polyunsaturated
