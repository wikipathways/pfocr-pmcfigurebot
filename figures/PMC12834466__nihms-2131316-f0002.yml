figure_title: Proposed evolution of pain-related mechanisms in neurons and glia from
  ancient unicellular responses to injury
caption: This model emphasizes Ca2+- and depolarization-dependent activation of intracellular
  and extracellular signaling (illustrating the common use of two DAMPs – ATP and
  glutamate) in neurons and glia. (A) Membrane rupture in ancient unicellular organisms
  causes release of intracellular molecules (DAMPs), depolarization, and Ca2+ influx
  that triggers rapid closing of the breach through localized actomyosin contraction
  and vesicle plugging, followed by repair and protective alterations involving changes
  in gene expression that change cellular state (Δ state). (B) In early aneural animals,
  voltage-gated Ca2+ channels link depolarization to Ca2+-dependent exocytosis (secreting
  molecules that also are DAMPs) while linkage of DAMPs to receptors coupled to Ca2+-permeable
  ion channels and to GPCRs (often increasing free intracellular Ca2+) enables coordinated
  multicellular responses to tissue injury and other biologically significant events.
  (C) After the evolution of neurons and glia, fundamental Ca2 - dependent, DAMP-related,
  and cellular stress-related mechanisms are conserved in diverse cells in mammalian
  nociceptive pathways in the periphery (Ci), spinal cord (Cii), and brain (Ciii,
  cell types not shown). These include nociceptors, diverse interneuronal types, Schwann
  cells, astrocytes, and microglia, which collectively enable nociceptive information
  processing, large bidirectional alterations in gain, and in some species pain. Red
  arrows indicate entry of extracellular Ca2+ into cells. Blue arrows represent release
  of intercellular signals and detection by plasma membrane receptors. The dashed
  blue line indicates the polysynaptic pathway from spinal dorsal horn neurons to
  the brain. Inhibitory and projection neurons are not shown. ATP, adenosine triphosphate;
  DAMP, damage-associated molecular pattern; Glu, glutamate; GPCR, G protein-coupled
  receptor; LTP, long-term synaptic potentiation; TRPA1, TRPV1 – types of transient
  receptor potential ion channels
