figure_title: Host-directed therapeutic mechanisms of metformin, rapamycin, and glutathione
  (GSH) in enhancing immunity against Mycobacterium tuberculosis.
caption: Host-directed therapeutic mechanisms of metformin, rapamycin, and glutathione
  (GSH) in enhancing immunity against Mycobacterium tuberculosis. Positive signs (+)
  indicate enhancement, Flat head arrows indicate inhibition. Crosses (x) over flat
  head arrows indicate loss of inhibition. Metformin promotes phagosome–lysosome fusion
  and autophagy, enhancing intracellular bacterial clearance. Rapamycin inhibits the
  mTORC1 pathway, suppressing protein synthesis and promoting autophagy via TSC1/2–Rheb
  signaling. Glutathione (GSH), through its reduced (L-GSH) and oxidized forms, modulates
  oxidative stress by scavenging reactive oxygen species (ROS), supported by enzymes
  like GCLC and GR. Together, these agents amplify IFN-γ and TNF-α mediated immune
  responses and regulate redox balance to contain infection. Created in BioRender.
  Sasaninia, K. (2025). https://BioRender.com/7ss6pc1 (accessed on 3 July 2025)
