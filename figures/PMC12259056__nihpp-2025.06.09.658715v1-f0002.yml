figure_title: A live imaging reporter reveals dynamic BMP signaling activity
caption: A) Schematic of the Drosophila BMP signaling pathway. BMP ligands (Dpp and
  Scw) bind to a receptor complex (Tkv, Sax, and Put), leading to phosphorylation
  and nuclear translocation of SMAD proteins (Mad and Medea), which activate transcription
  of target genes. GFP-Med reporter lines were generated by endogenously tagging the
  co-SMAD Medea on the protein’s C-terminus by CRISPR/Cas9 mediated integration.B)
  Example of gradient quantification from a live embryo expressing GFP-Medea. Nuclei
  were segmented via His-iRFP (not shown), and BMP signaling was measured as from
  nuclear GFP-Medea levels (color-coded, darker shades indicate higher signal). BMP
  gradients were fit along the dorsal-ventral axis at each time point in nuclear cycle
  14 to extract amplitude and width at half-maximum.C–D) Time-resolved dynamics of
  nuclear GFP-Medea accumulation in wild-type (C, n=8) and sog mutant (D, n=3) embryos.
  Data shown are average nuclear intensity in 5 μm spatial bins from the dorsal midline,
  with 1-minute temporal resolution.E–F) Temporal evolution of BMP gradient amplitude
  (E) and width at half-maximum (F) in wild-type and sog mutant embryos.G–H) Rate
  of change in GFP-Medea levels across the dorsal-ventral axis in wild-type (G) and
  sog mutant (H) embryos. In wild-type embryos, the BMP gradient grows most rapidly
  at the midline; in sog mutants, the gradient evolves more uniformly across space
