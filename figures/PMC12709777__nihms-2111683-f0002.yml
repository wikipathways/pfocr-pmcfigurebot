figure_title: |-
  Compositional differences and cell type-specific differential expression in
  scRNA-seq data
caption: |-
  (a) Barplots show significant differences in cell type
  frequency for non-IBD control (green) and non-stricture (blue) samples relative
  to stricture (red) samples in immune, stromal and epithelial compartments.
  *padj. < 0.05, **padj. < 0.01 (Wald test
  from Dirichlet regression with FDR correction; Methods). Blue asterisks indicate overrepresentation
  in stricture or non-stricture samples vs. non-IBD controls, while red asterisks
  indicate underrepresentation. Error bars are SEM. The total number of cells
  contributing to each bar is also shown. (b) Similar to
  (a), only using paired stricture and non-stricture samples
  (Methods). (c) Number of
  differentially expressed genes (DEGs) between stricture and non-IBD control
  samples (left) and between stricture and non-stricture samples (right),
  displayed by cell type (discrete component of the MAST model; FDR < 0.05;
  Methods, Supplementary Table 2).
  (d) Relationship between stricture vs. non-IBD and stricture
  vs. non-stricture samples within each cell compartment. The 1:1 line is
  represented in orange. DE coefficient is the discrete coefficient from the MAST
  model (p-value from Spearman ρ statistic. Methods). (e) Fractions of cell types in which KEGG
  pathways are significantly enriched (FDR < 0.05; Methods) within each compartment and by each
  comparison, split by enrichment direction. The number of significant pathways
  per cell type for each comparison is also shown. All pathway enrichment results
  are provided in Supplementary
  Table 3
