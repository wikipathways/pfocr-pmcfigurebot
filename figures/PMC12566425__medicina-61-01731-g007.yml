figure_title: Compounds 6 and 7 regulate autophagy in MDA-MB-435 cells.
caption: 'Compounds 6 and 7 regulate autophagy in MDA-MB-435 cells. (a,b) Western
  blot membranes illustrate the activation of the autophagy pathway in MDA-MB-435
  cells treated with compounds 6 and 7. (c,d). Bar graphs illustrating the LC3 A/B
  I and II protein levels when MDA-MB-435 cells were treated with compounds 6 and
  7. (e,f) Bar graphs showing GBL protein levels in MDA-MB-435 cells treated with
  compounds 6 and 7. The test performed was one-way ANOVA, with a Holm–Šidák post
  hoc test. Each bar represents the average of n ≥ 2 independent experiments ± SEM.
  Statistical significance is indicated as follows: p = 0.033 (*), p = 0.002 (**),
  and p < 0.001 (***) vs. control cells'
