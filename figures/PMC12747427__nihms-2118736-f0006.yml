figure_title: Altered Expression of ADM2-ADM2R in IBD Patient Tissues
caption: Violin plots of ADM2-ADM2R associated genes in ulcerative colitis patients
  (A) or Crohn’s disease patients (B). Violin plot of ADM2 in IBD Patients which are
  anti-TNF treatment-naïve or failing anti-TNF treatment (C). Heatmap of genes associated
  with the ADM2-ADM2R pathway in non-IBD patients or IBD patients (UC and CD) failing
  anti-TNF (αTNF) treatment (D). Violin plots of select ADM2-ADM2R-associated genes
  in IBD Patients which failing αTNF (E). UMAP plot of immune cells sorted from an
  IBD patient including cells collected from both inflamed and noninflamed tissue
  (F). Dot plot of ADM2R genes in ILC2s and T cells (G). qPCR of ADM2R genes in sorted
  ILC2s, ILC3s, and CD4+ T cells from intestinal biopsy samples (H). Frequencies of
  AREG+ ILC2s after 24 hours of ADM2 treatment (I). Data are pooled from 2 independent
  experiments with (H) (ILC2 n=3, ILC3 n=3, CD4+ T cell n=13) and (I) (Vehicle n=6,
  ADM2 n=6). Data are Mean ± SEM. P values were calculated using two-sided, Student’s
  t-tests. (A, left to right) ****P<0.0001, ****P<0.0001, ****P<0.0001, (B, left to
  right) **P=0.0029, ***P=0.0006, (C) *P=0.0197, **P=0.0064, (E) **P=0.0080, (H, left
  to right) ***P=0.0001, ****P<0.0001, *P=0.0258, (I) *P=0.0137
