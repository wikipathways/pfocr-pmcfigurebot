figure_title: Mechanism of the electroactive co-culture sensing system (e−COSENS)
caption: The e−COSENS system comprises a “sender” and a “receiver” bacterial strain.
  The sender synthesizes 1,4-dihydroxy-2-naphthoic acid (DHNA, precursor of vitamin
  K2) from the substrate chorismate through the seven-enzyme Men pathway. The menD
  gene was knocked out from the genome and expressed on plasmids under the control
  of analyte-inducible promoters to conditionally turn on DHNA biosynthesis for sensing
  purposes. The menA gene was also knocked out to prevent the prenylation of DHNA
  by prenyl diphosphate (PP). The secreted DHNA activates extracellular electron transfer
  (EET) in the receiver strain by mediating electron cycling between the membrane-bound
  type-II NADH:quinone oxidoreductase Ndh2 and the terminal electron acceptors, such
  as iron(III) oxide or an electrode. This results in the generation of electrical
  signals. The present system uses Lactiplantibacillus plantarum as the receiver strain
article_title: Synthetic microbial co-cultures for modular bioelectronic sensing in
  diverse environments
