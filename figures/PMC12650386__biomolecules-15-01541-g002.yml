figure_title: Structural characteristics of flavonoid and non-flavonoid polyphenols.
caption: 'Structural characteristics of flavonoid and non-flavonoid polyphenols. (A–E)
  Flavonoid polyphenols (C6-C3-C6 benzopyran ring framework). (A) Cyanidin (anthocyanin):
  contains multiple hydroxyl groups (-OH) on the B-ring, which enhance its affinity
  for ACE and AT1R [78]. (B) Epicatechin (flavanol): the 3′-OH group on the B-ring
  contributes to its inhibitory effect on renin activity [40]. (C) Quercetin (flavonol):
  the C3-OH and C5-OH groups are critical for modifying thiol-containing transmembrane
  proteins (e.g., A disintegrin and metalloproteinase 17, (ADAM17)) [79]. (D) Hesperetin
  (flavanone): lacks a C2-C3 double bond, improving its metabolic stability in vivo
  [68]. (E) Puerarin (isoflavone): the isoflavone skeleton structure enables it to
  suppress renal AGT expression via antioxidant activity [80]. (F–I) Non-flavonoid
  polyphenols. (F) Hydroxybenzoic acid (phenolic acid): the carboxyl group (-COOH)
  can form hydrogen bonds with the active site of ACE, enhancing inhibitory activity
  [81]. (G) Resveratrol (stilbene): the trans-stilbene structure is essential for
  upregulating ACE2 expression via the Sirtuin 1 pathway [82]. (H) Sesame lignans
  (lignan): the diphenylpropane skeleton enhances its bioavailability and ability
  to regulate gut microbiota-mediated polyphenol metabolism [38]. (I) Coumarin (tannin):
  the lactone ring structure contributes to its inhibition of AT1R expression [68]'
