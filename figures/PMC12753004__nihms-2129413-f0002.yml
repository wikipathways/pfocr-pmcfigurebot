figure_title: State-specific transcriptomic changes in the female SCN during opioid
  exposure, with lasting stress and repair signatures in abstinence
caption: Volcano plots show differentially expressed (DE) genes in females comparing
  (A) naïve vs. intoxication, (B) naïve vs. withdrawal, and (C) naïve vs. abstinence.
  Genes with p < 0.01 and |fold change|>0.26 are highlighted; upregulated genes are
  in red, downregulated in blue. (D) Polar plot depicts the average peak phase of
  rhythmic DE genes for each comparison. (E) Heatmap displays log2 fold changes for
  genes DE in at least one drug-exposed group relative to naïve, with shared DE status
  indicated on the left (dark gray boxes). Selected enriched pathways are shown for
  (F) naïve vs. intoxication, (G) naïve vs. withdrawal, and (H) naïve vs. abstinence,
  with the x-axis representing −log10(p-value), where higher values indicate greater
  significance
article_title: Sex-specific transcriptional signatures of oxycodone persist during
  withdrawal and abstinence in the suprachiasmatic nucleus of heterogeneous stock
  rats
