figure_title: STAMBP is associated with the activity of ERα signaling in BRCA.
caption: STAMBP is associated with the activity of ERα signaling in BRCA. (A,B) The
  mRNA data of patients with ERα-positive BRCA were divided into 2 different groups
  according to the STAMBP expression levels. DEGs between the high-expression group
  and the low-expression group were identified. GO (A) and KEGG (B) analyses were
  performed to explore potential biological mechanisms correlated with STAMBP according
  to these DEGs. (C,D) GSEA analysis based on DEGs showed the expression of STAMBP
  in Erα-positive BRCA was correlated with the ER signaling pathway (C) and EMT (D).
  (E) Western blot exhibited EMT markers levels in MCF-7 and T47D cells with STAMBP
  knockdown. (F–I) The protein levels of STAMBP and ERα in ERα-positive BRCA cells
  were examined by WB. BRCA cells were transfected with lentiviral vectors encoding
  shRNA or shControl and then added with the control vector or 10 nM estradiol for
  6 h (F,G). BRCA cells were transfected with Flag-STAMBP overexpression plasmid and
  then added with the control vector or 10 nM estradiol for 6 h (H,I). (J,K,N,O) The
  expression levels of three downstream genes of ER signaling were determined through
  qRT-PCR in ERα-positive BRCA cells. BRCA cells were transfected with lentiviral
  vectors encoding shRNA or shControl and then added with control vector or 10 nM
  estradiol for 6 h. (L,M,P,Q) The activities of ERE luciferases were examined through
  luciferase experiments in ERα-positive BRCA cells. BRCA cells were transfected with
  lentiviral vectors encoding shRNA or shControl and then added with control vector
  or 10 nM estradiol for 6 h. *** p < 0.001, **** p < 0.0001. Original western blots
  can be found at Supplementary Materials
