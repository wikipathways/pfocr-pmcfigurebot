caption: Gut microbial metabolites play a multifunctional role in oncogenesis and
  cancer therapy by not only modulating key signaling pathways and reshaping the tumor
  immune microenvironment, which influences tumor initiation and progression, but
  also by altering radiotherapy efficacy and mitigating treatment-related adverse
  effects. Moreover, these metabolites provide a foundation for developing novel therapeutic
  strategies aimed at enhancing radiotherapeutic outcomes while reducing toxicity
