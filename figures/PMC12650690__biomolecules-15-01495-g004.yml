figure_title: Role of exercise-induced myokines in counteracting cisplatin-induced
  muscle atrophy.
caption: 'Role of exercise-induced myokines in counteracting cisplatin-induced muscle
  atrophy. The schematic illustrates how exercise promotes the release of multiple
  myokines from skeletal muscle, including Irisin, IL-15, BDNF, FGF21, Apelin, Decorin,
  CTRP15 (Myonectin), and Musclin. These myokines exert distinct biological effects
  by regulating mitochondrial biogenesis, protein turnover, metabolic flexibility,
  angiogenesis, and regenerative processes. Downstream, they converge on six protective
  mechanisms: inflammation and oxidative stress, protein synthesis, protein degradation,
  regeneration, angiogenesis, and metabolic flexibility, ultimately leading to reduced
  cisplatin-induced muscle atrophy and preserved muscle mass and function. ↑ indicate
  stimulation or increase; ↓ indicate reduction or suppression; ⊣ represent inhibition
  of signaling pathways. IL-15, interleukin-15; BDNF, brain-derived neurotrophic factor;
  FGF21, fibroblast growth factor 21; CTRP15, C1q/TNF-related protein 15 (Myonectin);
  AMPK, AMP-activated protein kinase; PGC-1α, peroxisome proliferator-activated receptor
  gamma coactivator-1α; TGF-β, transforming growth factor-beta'
