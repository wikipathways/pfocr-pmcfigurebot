caption: Simplified diagram of the Hippo pathway. Phosphorylation of LATS1/2, thanks
  to the activity of MST1/2 and SAV1, leads to phosphorylation of YAP/TAZ, which retains
  this complex in the cytoplasm. Inhibition of Hippo signaling leads to translocation
  of unphosphorylated YAP/TAZ to the nucleus, binding TEADs, and initiating the expression
  of genes regulating proliferation, apoptosis, and EMT. The arrow indicates a stimulating
