figure_title: Osteocytes regulate brain function.
caption: Osteocytes regulate brain function. Osteocytes participate in brain regulation
  through the involvement of RANKL, FGF23, and OC-young-EVs. Firstly, RANKL and RANK
  combine to activate brain regions involved in thermoregulation and induce fever
  through the COX2-PGE2/EP3R pathway. Secondly, the RANKL and RANK combine to inhibit
  the neurite outgrowth of superior cervical ganglion neurons promoted by NGF. RANKL-RANK-OPG
  then attenuates microglial/macrophage-derived inflammatory responses in ischemic
  brain tissue while participating in microglial activation. In addition, RANKL could
  directly reduce food intake in mice through the hypothalamic neuropeptide Y (NPY)/CART
  pathway. FGF23 also regulates the brain through various mechanisms. FGF23 inhibits
  inflammatory responses through the KL-FGF23-VD pathway. FGF23 enhances hippocampal
  function by increasing the number of neurites and reducing dendrites. In addition,
  OCyoung-EVs reduced cell apoptosis and promoted neuronal survival in APP/PS1 mice.
  The green arrow indicates promotion, while the red arrow indicates inhibition
