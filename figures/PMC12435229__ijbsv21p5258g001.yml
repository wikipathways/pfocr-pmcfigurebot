figure_title: TI-related signaling pathways and metabolic processes.
caption: TI-related signaling pathways and metabolic processes. Immune inducers such
  as β-glucan, BCG, LPS, and oxLDL can enter the cytoplasm through different receptors
  and then activate the Akt-mTOR-HIF1α axis to initiate a series of intracellular
  cascades that trigger upregulation of various metabolic pathways. These pathways
  include glycolysis, tricarboxylic acid cycling, OXPHOS, and glutamine decomposition.
  Metabolites obtained from these pathways, such as fumarate and acetyl-CoA (acetyl-CoA),
  can in turn mediate epigenetic remodeling of histones; This remodeling left behind
  epigenetic marks such as H3K4me3, H3K9me3, and H3K27ac. Acetyl-coa also regulates
  the cholesterol synthesis pathway through mevalonate. BCG, Bacille Calmette-Guérin;
  LPS, Lipopolysaccharides; oxLDL, oxidized low-density lipoprotein; mTOR, mammalian
  target for rapamycin; OXPHOS, oxidative phosphorylation; PI3K, Phosphoinositide
  3-Kinase; NF-κB, nuclear factor kappa-B; ROS, Reactive oxygen species; ATP, adenosine
  triphosphate; TCA, tricarboxylic acid cycle
