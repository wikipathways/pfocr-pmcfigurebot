figure_title: Expression of genes and proteins in HIF signaling pathway in EC-Control
  and EC-CTEPH under hypoxia.
caption: Expression of genes and proteins in HIF signaling pathway in EC-Control and
  EC-CTEPH under hypoxia. (A) mRNA relative expression of genes EGLN1, EGLN3 and HIF1AN
  in 4 independent experiments with n = 3 EC-Control and n = 3 EC-CTEPH. Statistical
  significance was indicated as p < 0.05 *, p < 0.01 ** (2-way ANOVA and Tukey’s post
  hoc test). Each data point represents mean ± SD of relative fold change with respect
  to EC-Control normoxia basal levels (21% O2) normalized to reference gene ACTB.
  (B) Protein expression of HIF-2α and HIF-1α in four independent experiments (n =
  3 EC-Control and n = 4 EC-CTEPH, passages 4–6). Each data point represents mean
  ± SD of relative fold change normalized to reference protein β-ACTIN. Representative
  blots are shown from four independent experiments. Quantification was performed
  by densitometry. Statistical significance was indicated as p < 0.05 *, p < 0.001
  *** (2-way ANOVA and Tukey’s post hoc test). (C) Western blot images showing detection
  of target proteins HIF-2α and HIF-1α and their loading control β-ACTIN in EC-Control
  and EC-CTEPH under normoxic and hypoxic conditions
