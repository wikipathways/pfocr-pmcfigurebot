figure_title: Analysis of the altered SLOS proteome
caption: 'Volcano plots were displayed for comparisons between all SLOS individuals
  and controls (A) and between SLOS individuals without simvastatin treatment and
  controls (B). Blue circles represent significantly downregulated proteins, and red
  circles represent significantly upregulated proteins. (C) A Venn diagram is presented
  to compare differential protein overlaps between A and B. KEGG Pathway (D) and GO:
  Molecular Function (E) analyses were carried out on the altered SLOS proteome. GO:
  MF analysis shows the top 20 ranked biological functions. A false discovery rate
  threshold of 5% was applied for both analyses'
