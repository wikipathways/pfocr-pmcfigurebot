figure_title: ALKBH8 and CTU1 knockdown individually impairs SARS-CoV-2 and ZIKV infection.
caption: ALKBH8 and CTU1 knockdown individually impairs SARS-CoV-2 and ZIKV infection.
  (A) Schematic showing shRNA-mediated knockdown approach targeting U34 ALKBH8 and
  CTU1 components of U34 modification pathway. The Western blot analysis of ACE2 expression
  in A549 cells with and without lentiviral vector expressing ACE2 (VLPACE2). (B)
  Western blot validation of ALKBH8 and CTU1 knockdown efficiency with corresponding
  actin loading controls. Numbers indicate relative protein levels. (C) SARS-CoV-2
  infection levels measured by RT-qPCR following knockdown of the indicated genes
  24 h post-infection. (D) ZIKV infection levels measured by RT-qPCR following knockdown
  of the indicated genes 48 h post-infection
