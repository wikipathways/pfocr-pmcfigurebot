figure_title: Osmotic stress tolerance of rict-1(ft7) is dependent on the transsulfuration
  and propionate catabolic pathway
caption: (A) A schematic view of the B12-dependent metabolic pathways in C. elegans.
  Apart from the METR-1, the MMCM-1 (methylmalonyl-CoA mutase-1) uses B12 as a cofactor.
  In the presence of low levels of B12, the shunt pathway is used for propionate catabolism,
  where ACDH-1 (acyl-CoA dehydrogenase-1) is the rate-limiting enzyme. Created in
  BioRender. (B) Knockdown of cbs-1 (cystathionine beta-synthase), pcca-1 (propionyl
  coenzyme A carboxylase alpha subunit), and mce-1 (methylmalonyl-CoA epimerase) using
  HT115i reduced the OST of srict-1(ft7) worms. One of three biologically independent
  replicates is shown. P-value determined using Ordinary Two-way ANOVA with Tukey’s
  multiple comparisons test. (C) Knockdown of mmcm-1 using HT115i resulted in a decrease
  in OST of the rict-1(ft7) worms, while wild-type worms remained unaffected. One
  of three biologically independent replicates is shown. P-value determined using
  Ordinary Two-way ANOVA with Tukey’s multiple comparisons test. (D) The rict-1(ft7)
  worms showed a reduction in lifespan on knockdown of mmcm-1 using HT115i, while
  wild-type worms remained unaffected. One of three biologically independent replicates
  is shown. P-value determined using Mann-Whitney U test. P-value ≥0.05 was considered
  not significant, ns. All experiments were performed at 20 °C. All data and analysis
  are provided in the Source Data file
