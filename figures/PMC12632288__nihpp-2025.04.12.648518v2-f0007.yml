figure_title: Cartoon of the primary iron homeostasis pathways in P.
caption: Cartoon of the primary iron homeostasis pathways in P. aeruginosa and their
  relationships to BqsRS. Under oxic conditions, chelated Fe3+-siderophore complexes
  such as pyoverdine are shuttled into the periplasm by outer membrane proteins such
  as FpvA and FptA. Fe3+-citrate uptake is accomplished by FecA. Iron protoporphyrin
  IX (heme b) is sensed and imported by the HasR/PhuR system. These chelated iron
  complexes are typically brought into the cytosol via ABC transporters, although
  other mechanism may strip the chelates of the iron itself. Under anoxic conditions,
  Fe2+ is thought to diffuse into the periplasm through outer membrane porins or may
  be generated in the periplasmic space by ferric reductases. The Feo system then
  transports Fe2+ into the cytosol. The Fe2+-specific TCS BqsRS directly senses Fe2+
  and dynamically regulates feo (among other genes), which is shown here for the first
  time
article_title: The response regulator BqsR/CarR controls ferrous iron (Fe2+) acquisition
  in Pseudomonas aeruginosa
