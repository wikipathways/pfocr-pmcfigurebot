figure_title: Effects of Botryosphaeria dothidea inoculation on morphological and
  physiological characteristics of Populus davidiana × P.
caption: 'Effects of Botryosphaeria dothidea inoculation on morphological and physiological
  characteristics of Populus davidiana × P. alba var. pyramidalis. (A) Plant phenotypic
  progression. Left to right: Phenotypes at T0 (0 h), T1 (6 h), T2 (12 h), T3 (24
  h), T4 (48 h), and T5 (96 h) post-inoculation (three plants per group). (B) Expression
  levels of two defense-related genes (NPR1 and PR1) from salicylic acid signaling
  pathway and four genes (JAR1, COI1, JAZ, and ORCA3) from jasmonic acid signaling
  pathway in plants. (C) Relative fresh weight and relative root length. (D) H2O2
  content, SOD (superoxide dismutase) activity, POD (peroxidase) activity, and MDA
  (malondialdehyde) content in plant leaves. Error bars indicate standard deviation
  of three independent biological replicates. Significant differences between groups
  (p < 0.05), determined by Student’s t-test, are denoted by different lowercase letters'
