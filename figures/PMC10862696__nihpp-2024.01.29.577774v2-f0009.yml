caption: 'Drawings representative of enrichment patterns of (A) FGF and (B) BMP signaling
  pathway genes in H. exemplaris embryos at elongation, endomesodermal pouch formation
  (E.P.), and ectodermal segmentation (E.S.) stages, shown from lateral and ventral
  views. From top to bottom, images show surface to internal views (and dorsal surface
  below ventral views). Anterior (A) is up and Posterior (P) is down in all drawings.
  Dorsal (D) and (V) are to the left and right, respectively, in the lateral views.
  Representative summaries of expression patterns are shown as follows: in the top
  embryos (A), fgf8 in green, fgfrl1 in magenta; in the bottom embryos (B), dpp in
  green, sog in magenta, tld in orange'
