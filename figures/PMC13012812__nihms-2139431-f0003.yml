figure_title: Aging associates with different immune cell frequencies and reduced
  expression of innate immunity genes in samples from patients with SLE versus controls
caption: (A) Uniform Manifold Approximation and Projection (UMAP) plot of immune cell
  types identified by scRNA-seq of PBMCs (n=148 patients with SLE, n=48 healthy controls).
  (B) Bar plots depicting change in the percentages of immune-related blood cell types
  with age, including those that are significantly (Padj < 0.05) increased (orange
  for SLE, red for controls) or decreased (purple for SLE, blue for controls). Statistical
  significance (indicated by filled bars) was determined based on an adjusted P value
  < 0.05, calculated using linear modeling with Benjamini-Hochberg correction. (C)
  GSEA demonstrating changes in immune-related signaling pathways from the Reactome
  database in samples from patients with SLE and in healthy controls for NKdim and
  CD4+ TEM cells. A positive normalized enrichment score represents up-regulation
  of the pathway with older age, and a negative value represents down-regulation with
  older age. Filled circles represent significant pathways with a Benjamini-Hochberg
  adjusted P value < 0.05. (D) Dot plots depicting the normalized enrichment score
  of four immune-related signaling pathways from (C) for each cell type for patients
  with SLE (left) or healthy controls (right). For each group, up-regulation (orange
  for SLE and red for controls) or down-regulation (purple for SLE and blue for controls)
  of the pathway was determined based on the normalized enrichment score. Black outlines
  on dots indicate significant (Padj< 0.05) regulation. cDC, conventional dendritic
  cell; cM, classical monocyte; ncM, non-classical monocyte
