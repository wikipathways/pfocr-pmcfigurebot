figure_title: Tumor suppressor-like properties of PALI1 in human cancers.
caption: Tumor suppressor-like properties of PALI1 in human cancers. A Higher PALI1
  expression levels are associated with improved overall survival (OS) in patients
  with the indicated cancer. B Functional pathways of the genes positively and negatively
  correlated with PALI1 in human lung cancer. C Negative correlation of PALI1 with
  the indicated genes associated with cancer stem-like cells (CSCs). D PALI1 expression
  status in different stages of lung cancer, which showed significantly reduced PALI1
  expression in stage IV lung cancer. E Reduced PALI1 expression in primary tumor
  tissues, with further decreases observed in metastatic tumors of the indicated cancer
  types
