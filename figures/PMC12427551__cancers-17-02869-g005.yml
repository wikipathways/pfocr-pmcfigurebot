figure_title: Overview of MAPK and PI3K/AKT signaling pathways in thyroid tumorigenesis.
caption: 'Overview of MAPK and PI3K/AKT signaling pathways in thyroid tumorigenesis.
  Mutations in genes such as BRAF, RAS, PIK3CA, and PTEN dysregulate these cascades,
  promoting cell proliferation, differentiation, and survival. The dotted line represents
  schematic nuclear boundary, drawn to indicate that the signaling pathways activated
  in the cytoplasm ultimately exert their effect within the nucleus. Abbreviations:
  RTK, receptor tyrosine kinase; RAS, rat sarcoma viral oncogene homolog; PI3K, phosphoinositide
  3-kinase; AKT, protein kinase B; PTEN, phosphatase and tensin homolog; mTOR, mechanistic
  target of rapamycin; BRAF, B-Raf proto-oncogene; MEK, mitogen-activated protein
  kinase; ERK, extracellular signal-regulated kinase'
