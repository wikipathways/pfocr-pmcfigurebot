figure_title: Correlation between central carbon metabolism genes and viral community
  temperateness
caption: Spearman’s rho correlation coefficients (ρs) are shown from 1,000 bootstrapped
  simulations correlating central carbon metabolism gene frequency as a percentage
  of known genes vs viral community temperateness. Panels are ordered by pathway,
  including Embden-Meyerhof-Parnas glycolysis (EMP), Entner-Doudoroff glycolysis (ED),
  pentose phosphate (PP), and tricarboxylic acid cycle pathways. Viral community temperateness
  was calculated as the percentage of integrase and excision genes in the known genes
  in each virome. Enzymes with rho values significantly different to zero are indicated
  by asterisks. Genes are labeled by EC numbers; see Table 1 for gene names and summary
  statistics
article_title: Central carbon metabolism switching in lytic versus temperate coral
  reef viral communities
