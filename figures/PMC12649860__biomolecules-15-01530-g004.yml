figure_title: Intracellular trafficking pathways of furin in different cellular compartments.
caption: 'Intracellular trafficking pathways of furin in different cellular compartments.
  The schematic illustrates three distinct trafficking routes of furin, each color-coded
  to represent specific cellular processes: The red pathway depicts endocrine/neuroendocrine
  cell-specific trafficking, where AP-1 mediates furin budding from the trans-Golgi
  network (TGN) to immature secretory granules (ISGs). In this pathway, phosphofurin
  acidic cluster sorting protein 1 (PACS-1) functions as an adaptor, linking CK2-phosphorylated
  furin to the AP-1/clathrin machinery for TGN retrieval. Alternatively, furin-containing
  vesicles may progress to mature secretory granules (MSGs) for hormone processing.
  The green pathway represents basolateral targeting, where AP-4 directs furin transport
  from either the TGN or endosomal compartments to the basolateral membrane. At the
  membrane, filamin (ABP-280) anchors furin to the actin cytoskeletal network. The
  blue pathway encompasses complex bidirectional trafficking between multiple compartments.
  Furin internalization from the plasma membrane occurs via clathrin and dynamin-dependent
  endocytosis, primarily mediated by tyrosine-based motifs interacting with AP-2.
  During endosomal transit, PX domain-containing phosphoinositide-binding proteins
  modulate furin sorting. Early endosomes serve as decision points (1). PP2A-mediated
  dephosphorylation targets furin for TGN return via late endosomal intermediates,
  with phosphate release (2). CK2-phosphorylated furin undergoes PACS-1-dependent
  recycling to the plasma membrane. Dashed lines indicate the putative PP2A-dependent
  route from post-TGN endosomal compartments to the cell surface. Throughout these
  pathways, CK2 and PACS-1 participate at multiple trafficking nodes, highlighting
  their central role in furin localization dynamics. This integrated model demonstrates
  how post-translational modifications (phosphorylation and dephosphorylation) together
  with adaptor protein interactions coordinate furin’s subcellular distribution and
  functional specialization across different cell types. Figure Modified from Thomas
  et al. (2002) [55]'
