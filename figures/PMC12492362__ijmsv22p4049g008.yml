figure_title: Schematic diagram of THC regulation in P.
caption: Schematic diagram of THC regulation in P.a. LPS-induced NLRP3 inflammasome
  led to pyroptosis in BV-2 cells. THC regulates the NLRP3 inflammasome signaling
  pathway at different levels. P.a. LPS induction NLRP3 inflammasomes-associated proteins
  through the MAPK/NFκB signaling pathway and inhibits GSH activity, thus raising
  intracellular H2O2 levels causing ROS accumulation. Additionally, the induction
  of lysosomal dysfunction release of cathepsin B triggers the activation of the NLRP3
  inflammasome leading to pyroptosis, resulting in the release of IL-1β, and IL-18.
  However, THC inhibited NLRP3 inflammasome activation leading to pyroptosis by inhibiting
  the p38/JNK/NFκB signaling pathway and inducting GSH activation alleviated ROS production
  within cells through the signaling pathway Nrf-2/HO-1, thus inhibiting pyroptosis
article_title: Tetrahydrocurcumin Protects Microglial Cells Against Pseudomonas aeruginosa
  Lipopolysaccharide-Induced Reactive Oxygen Species Production and Cathepsin B to
  Activate NLRP3 Inflammasome-Mediated Pyroptosis Via the HO-1 and p38/JNK Pathway
