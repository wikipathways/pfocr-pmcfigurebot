figure_title: Impact of gut microbiota on colorectal cancer progression.
caption: Impact of gut microbiota on colorectal cancer progression. Healthy gut microbiota
  maintains epithelial integrity and energy balance, prevents inflammation, provides
  essential nutrients and vitamins, produces short-chain fatty acids (SCFAs), and
  protects against pathogen invasion. In contrast, dysbiotic gut microbiota increases
  intestinal permeability, promotes chronic inflammation and oxidative stress, induces
  DNA damage, activates oncogenic pathways, and reduces SCFA production, all of which
  contribute to colorectal cancer development (Created in BioRender. Isidoro, C. (2025)
  https://BioRender.com/pzq0dhg)
