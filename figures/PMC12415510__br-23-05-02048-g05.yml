figure_title: Mechanism of apoptosis.
caption: 'Mechanism of apoptosis. Apoptotic signaling primarily occurs via two pathways:
  the extrinsic death receptor pathway and the intrinsic mitochondrial pathway. In
  T24 cells, PRF induces apoptosis predominantly by activating FAS and TNFR1, thereby
  initiating the death receptor pathway. This ultimately leads to the activation of
  CASPASE3, resulting in characteristic biochemical and morphological changes characteristic
  of programmed cell death. Concurrently, NF-κB participates in the regulation of
  this apoptotic pathway. TNFR, tumor necrosis factor receptor; TRAF, TNFR-Associated
  Factor; TRADD, TNFR-associated death domain; RIP, receptor-interacting protein;
  IKK, IκB kinase; tBid, truncated Bid; PRF, Puerariae radix flavone'
article_title: 'Puerariae radix flavones induce apoptosis in bladder cancer T24 cells
  via the FAS/TNFR1 pathway: A potential therapeutic candidate'
