figure_title: Schematic representation of CRP and mCRP-induced inflammatory signaling
  in fibroblast-like synoviocytes in rheumatoid arthritis.
caption: Schematic representation of CRP and mCRP-induced inflammatory signaling in
  fibroblast-like synoviocytes in rheumatoid arthritis. This diagram illustrates the
  proposed mechanisms by which CRP and its monomeric form (mCRP) contribute to synovial
  inflammation in RA. In the RA synovium, FLSs express elevated levels of CRP receptors,
  including CD32 (Fc gamma receptor II) and CD64 (Fc gamma receptor I), both of which
  are minimally expressed in healthy controls. Locally produced CRP and mCRP interact
  with these receptors on FLSs, triggering intracellular signaling cascades. Specifically,
  CRP binding to CD32 and/or CD64 leads to the activation of the p38 mitogen-activated
  protein kinase (p38 MAPK) pathway and the NF-κB pathway. Activation of these signaling
  intermediates results in the phosphorylation of downstream targets and the transcription
  of pro-inflammatory genes. This cascade promotes the secretion of pro-inflammatory
  cytokines and chemokines and enhances the proliferative and invasive phenotype of
  RA-FLSs. These cellular responses contribute to the amplification of synovial inflammation
  and joint destruction characteristic of RA. Pharmacologic inhibition of NF-κB, for
  example, with pyrrolidine dithiocarbamate (PDTC), has been shown to suppress CRP-induced
  FLS proliferation, further supporting the relevance of this pathway. The figure
  highlights the pathogenic role of CRP and mCRP in mediating synovial inflammation
  through receptor-mediated activation of p38 MAPK and NF-κB in RA
article_title: 'Beyond the Biomarker: Monomeric CRP as a Driver of Multisystem Pathology
