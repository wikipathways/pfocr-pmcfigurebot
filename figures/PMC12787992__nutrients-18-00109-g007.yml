figure_title: Summary of iron metabolism, regulatory pathways, and diseases.
caption: Summary of iron metabolism, regulatory pathways, and diseases. The figure
  shows the absorption mechanisms of non-heme and heme iron within the intestinal
  tract. The co-administration of vitamin C can enhance iron absorption, whereas certain
  compounds, such as polyphenols, may inhibit this process. Once absorbed, iron binds
  to transferrin and is transported to the liver via the TfR1 receptor, where it modulates
  HAMP transcription within the nucleus. The resultant hepcidin subsequently inhibits
  the liver’s FPN receptor, thereby preventing iron efflux
