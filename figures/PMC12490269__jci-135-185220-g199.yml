figure_title: Identification of differentially expressed genes and pathways in ICB-resistant
  melanoma
caption: (A) Heatmap of supervised analysis of RNA-Seq results from untreated metastatic
  melanoma specimens versus tumors obtained from patients progressing on PD-1 blockade.
  The z scores of upregulated (B) and downregulated (C) biological processes (as determined
  by Fisher’s exact test) identified by Gene Ontology analysis. (D and E) WikiPathways
  analysis of differentially expressed genes in ICB-resistant melanomas involved in
  angiogenesis (D) and MAPK pathway (E). (F) qRT-PCR analysis of expression of various
  differentially expressed genes in ICB-resistant patient samples; *P < 0.05 by Student’s
  t test. (G) Western blot analysis of expression of various proteins in pathways
  identified by RNA-Seq analysis
