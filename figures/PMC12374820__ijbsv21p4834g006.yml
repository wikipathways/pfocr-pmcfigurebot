figure_title: Lnc-CRAT40 recruits YBX1 to co-activate RelA transcription.
caption: 'Lnc-CRAT40 recruits YBX1 to co-activate RelA transcription. A, B. Genome-wide
  distribution of YBX1-binding sites in HCT15 cells identified by ChIP-seq, with 60.7%
  located at promoter regions. C. Motif analysis of YBX1 binding sequences. D. ChIP-seq
  tracks showing YBX1 peaks at the RelA promoter. E. Schematic of PCR-amplified regions
  within the RelA promoter for ChIP-qPCR. F. ChIP-qPCR confirming specific YBX1 binding
  to the P2 region of the RelA promoter; IgG as negative control. G, H. ChIP-qPCR
  showing reduced YBX1 enrichment at the RelA promoter after YBX1 knockdown or lnc-CRAT40
  knockout. I. Western blot showing decreased p65 protein after YBX1 knockdown. J,
  K. Functional rescue assays: RelA knockdown inhibits proliferation, migration, and
  invasion, which are reversed by YBX1 overexpression. L. Western blot analysis of
  p65 following YBX1 overexpression in RelA-silenced cells. M. Western blot of NF/κB
  and EMT pathway-related proteins, including Bcl-2 and E-cadherin, after YBX1 knockdown
  and lnc-CRAT40 knockout. ChIP-seq, chromatin immunoprecipitation sequencing; KD,
  knockdown; NC, negative control; TSS, transcription start site; ns, not significant.
  *P<0.1, **P<0.01, ***P<0.001'
article_title: Methylation-mediated LncRNA CRAT40 promotes colorectal cancer progression
  by recruiting YBX1 to initiate RelA transcription
