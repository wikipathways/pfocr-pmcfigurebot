figure_title: Collagen and ligand-receptor binding ability, and chondrocyte proliferation
  of CBD-CNP
caption: '(A) Collagen-binding ability and thermal stability of CBD-CNP. Unbound CBD-CNP
  was assessed by SDS-PAGE. M, molecular weight marker; B, buffer control; No heat,
  no preheating; Heat, preheating at 56°C 30 minutes; (–), no collagen powder was
  added; (+), collagen powder was added. (B) Surface plasmon resonance analysis of
  CBD-CNP binding to recombinant NPR-B immobilized on a CM5 chip. The Kd value was
  calculated from sensorgrams as described under the experimental procedures. (C)
  Ligand-receptor binding assay with CBD-CNP and NPR-B, the receptor for CNP. (D)
  Inhibitory effect of FGF2-FGFR3 downstream signaling pathway of RCS cells owing
  to the binding of CNP to NPR-B. Phosphorylation of ERK1/2 in RCS cells was assessed
  by FGF2 alone and combined treatment with CNP-22 or CBD-CNP. (E) Cell proliferation
  assessment of RCS cells after treatment with FGF2 alone or in combination with CNP-22
  or CBD-CNP (n = 5). The cell proliferation rate was calculated based on the cell
  count with no drug treatment as 100%. (F) Alcian blue staining of RCS cells in each
  group. Scale bars: 200 μm in F. Statistical analysis was performed by using 1-way
  ANOVA followed by Tukey post hoc tests. SDS-PAGE, sodium dodecyl sulfate polyacrylamide
  electrophoresis; RU, response unit; IP, immunoprecipitation; IB, immunoblot; NPR-B,
  natriuretic peptide receptor B; CNP, C-type natriuretic peptide; FGF2, fibroblast
  growth factor 2; FGFR3, fibroblast growth factor receptor 3; RCS, rat chondrosarcoma;
  ERK, extracellular signal-regulated kinase; P-ERK, phospho-extracellular signal-regulated
  kinase'
