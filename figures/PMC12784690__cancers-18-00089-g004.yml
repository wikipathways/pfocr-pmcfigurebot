figure_title: Molecular Mechanisms Underlying SMARCA4/BRG1 Loss-Mediated Therapeutic
  Response in Cancer.
caption: 'Molecular Mechanisms Underlying SMARCA4/BRG1 Loss-Mediated Therapeutic Response
  in Cancer. Upper panel: Chromatin organization in normal versus SMARCA4-deficient
  cell nuclei. The SMARCA4/BRG1 complex maintains euchromatin-heterochromatin balance
  in normal cells (left). SMARCA4 loss (right) causes global heterochromatin accumulation
  and reduced chromatin accessibility. Pathway 1 (left): Heterochromatin accumulation
  and replication stress. SMARCA4 deficiency promotes excessive heterochromatin formation
  (purple clusters), causing replication fork stalling and DNA damage. Persistent
  replication stress activates ATR signaling, creating oncogenic addiction to ATR-mediated
  DNA damage response and conferring sensitivity to ATR inhibitors. Pathway 2 (center):
  Enhancer reprogramming and transcriptional rewiring. SMARCA4 loss induces enhancer
  reprogramming, converting active enhancers to closed or aberrantly activated states.
  This activates MYC signaling and alters DNA damage response (DDR) gene expression,
  conferring vulnerability to PARP inhibitors. Pathway 3 (right): Suppression of apoptosis-related
  genes. SMARCA4 deficiency downregulates pro-apoptotic genes, disrupting ER-to-mitochondria
  Ca2+ transfer. Impaired mitochondrial Ca2+ uptake compromises apoptotic signaling,
  reducing sensitivity to chemotherapy and FGFR-targeted therapy'
