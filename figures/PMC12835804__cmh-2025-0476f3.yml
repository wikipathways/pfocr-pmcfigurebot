figure_title: The effect of gut microbiota-related mechanisms on hepatobiliary malignancy
  treatments.
caption: The effect of gut microbiota-related mechanisms on hepatobiliary malignancy
  treatments. (1) Post-operative albumin level is positively related to proteolytic
  bacteria Bacteroides and Pentoea. (2) CCA patients under PTCD showed no clinical
  benefit from combination therapy including chemotherapy and ICIs. (3) High radiation
  induced dysbiosis in patients with high-fat diet, leading to fat accumulation in
  liver, thus promoting cancer growth through AKT pathway. (4) Lenvatinib administration
  improves gut permeability by increasing probiotic abundance such as Faecalibacterium
  and Bifidobacterium, thus restoring gut microbiota balance. (5) Patients who respond
  to immunotherapy showed an increased abundance of Akkermansia. muciniphila, enhancing
  therapy efficacy by promoting CD8+ T cell expansion. AKT, protein kinase B; CCA,
  cholangiocarcinoma; GPCRs, G-protein-coupled receptors; ICI, immune checkpoint inhibitor;
  IFN, interferon; OS, overall survival; PIP, phosphatidylinositol phosphates; PTCD,
  percutaneous transhepatic cholangial drainage; PTEN, phosphatase and tensin homolog
  ; TKIs, tyrosine kinase inhibitors; TNF, tumor necrosis factor; TSC1/2, tuberous
  sclerosis complex1/2
