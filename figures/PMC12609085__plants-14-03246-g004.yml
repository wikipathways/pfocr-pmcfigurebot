figure_title: The gibberellin biosynthesis metabolic pathway in Pinus massoniana cuttings.
caption: The gibberellin biosynthesis metabolic pathway in Pinus massoniana cuttings.
  Green boxes represent enzymes, yellow boxes represent undetected gibberellins (GAs),
  and the detected GAs are highlighted with blue and red boxes in this work. Blue
  boxes represent inactive precursor GAs, and red boxes represent active GAs. This
  study focused on GA4 because its content was significantly elevated under paclobutrazol
  treatment (200 mg·L−1 NAA + 100 mg·L−1 PBZ) at 20 days after cutting—a stage associated
  with the arrest of root development and onset of suberization—while other active
  GAs (GA1, GA3, GA7) levels remained unchanged compared to the control treatment
  (200 mg·L−1 NAA) (Table S1). This implicates GA4 as a potential key regulator of
  the rooting difficulty phenotype. The simplified pathway is based on well-established
  routes in plants, and arrows indicate multiple enzymatic steps
