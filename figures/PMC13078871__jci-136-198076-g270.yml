figure_title: Lipidomics reveals increased intramuscular TAG enrichment in the absence
  of Gsdme
caption: '(A) Experimental design for untargeted lipidomics analysis using ultraperformance
  liquid chromatography–mass spectrometry in injured muscle of WT and KO mice at D14.
  (B) OPLS score plots assessing robustness of the mass spectrometry–based lipidomics
  model. (C) Lipid species identified in injured muscle of WT and KO mice: TAGs, PC,
  and phosphatidylethanolamine (PE). (D) Volcano plot showing the upregulated and
  downregulated lipid species in KO mouse muscle versus WT muscle. (E) KEGG pathway
  analysis of lipid-associated functions based on differential lipid species between
  WT and KO injured muscle; upregulated species are in red, and downregulated species
  are in blue. (F) Heatmap of differential lipid species in injured skeletal muscle
  from WT and KO mice. (G) Levels of saturated and unsaturated fatty acids in TAG
  species. (H) TAG levels of long-chain fatty acids with 47, 48, 49, 50, and 51 carbon
  atoms. Data are presented as mean ± SEM and were analyzed by unpaired 2-tailed Student’s
  t test. *P < 0.05, **P < 0.01'
