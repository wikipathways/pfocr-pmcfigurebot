figure_title: Transcriptomic and metabolomic profiles under the XZ1606 treatment of
  liver fibrosis in the CCl₄-induced fibrosis model.
caption: Transcriptomic and metabolomic profiles under the XZ1606 treatment of liver
  fibrosis in the CCl₄-induced fibrosis model. (A-D) Transcriptomic analysis (n =
  4 for each group). (A) Hierarchical clustering of transcript expression data showing
  differential gene expression patterns across control, CCl4, and XZ1606 treatment
  groups. (B) Volcano plots showing differential gene expression between the CCl4
  model vs. control and XZ1606 treatment vs. CCl4 model. Upregulated genes are shown
  in red and downregulated genes in blue. (C) KEGG pathway enrichment analysis of
  upregulated genes in the CCl4 model vs. control group, highlighting fibrotic pathways.
  (D) KEGG pathway enrichment analysis of downregulated genes in the XZ1606 treatment
  group vs. CCl4 model, showing the reversal of fibrotic pathways by XZ1606. (E-G)
  Metabolomic analysis (n = 4 for each group). (E) Volcano plots showing differential
  metabolite expression between the CCl4 model vs. control. (F) Volcano plots showing
  differential metabolite expression between the XZ1606 treatment vs. CCl4 model.
  (G) Hierarchical clustering of metabolomics data showing differential metabolite
  expression patterns across the groups
