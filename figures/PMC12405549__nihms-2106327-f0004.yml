figure_title: Patient CSF and in vitro results
caption: a TLR-4 pathway schematic showing activation causing downstream inflammation.
  b Western blots showing increase expression of TLR-4 and downstream components in
  prospective GBM LMD patient CSF samples compared to CSF of controls of GBM, diffuse
  intrinsic pontine glioma (DIPG), LMD from melanoma and breast from our institution.
  c ELISA results demonstrating increased IL-6 cytokine levels in GBM LMD patient
  CSF samples compared to CSF of controls of GBM, diffuse intrinsic pontine glioma
  (DIPG), LMD from melanoma and breast. d Demonstration of TLR-4 expression across
  all tested GBM cell lines, including two patient derived cell lines (U87 and A172)
  and one murine cell line (SB28). E Survival curves demonstrating the IC50 of TAK-242
  directly antagonizing TLR-4 in the range of 10–100 mM across these cell lines. f
  Comparative measurements of extracellular cytokines IL-6 collected from cell media
  in triplicate across these cell lines before and after treatment with TAK-242. Significant
  values are represented with (*)
article_title: Elucidating the association between TLR-4 expression and the clinical
