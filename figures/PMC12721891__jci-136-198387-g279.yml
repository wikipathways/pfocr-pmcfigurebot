figure_title: Biopsies from patients with FPLD2 have no change in adipocyte size,
  but bulk RNA-sequencing suggests decreased metabolism and increased inflammation
  in patient adipose tissue
caption: '(A) Representative adipose tissue histological images and Picrosirius red–stained
  tissue for collagens from biopsies across patient groups in abdominal biopsies.
  Scale bar: 200 μm. (B) Frequency distribution of adipocyte size and (C) frequency
  of adipocytes less or greater than 2,500 μm2 from abdominal biopsies. (D) Histological
  images and Picrosirius red analyses on upper neck biopsies. (E) Frequency distribution
  of adipocyte size and (F) frequency of adipocytes less or greater than 2,500 μm2
  from upper neck biopsies. Bulk RNA-sequencing (RNA-Seq) on patient biopsies. Biopsies
  from group A and B were combined to compare with group C. n = 4–5 samples (upper
  neck and abdomen combined) per group. Gene set enrichment analysis (GSEA) identified
  (G) upregulated pathways with normalized enrichment scores (NES) and (H) leading-edge
  genes for the monocyte chemotaxis pathway. (I) Downregulated GSEA pathways and leading-edge
  genes for (J) mito protein complex and (K) fatty acid metabolism pathways. Data
  are represented as mean ± SD. Statistical analyses were performed using 2-way ANOVA,
  followed by Bonferroni’s post hoc test'
article_title: Altered lipid metabolism and inflammatory programs associate with adipocyte
  loss in familial partial lipodystrophy 2
