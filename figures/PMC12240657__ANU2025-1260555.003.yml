figure_title: The relative expression of glucose metabolism-related genes in hepatopancreas
  and mesenteric adipose tissue of Nile tilapia fed NFD and HFD for 6-, 8-, and 10-week.
caption: The relative expression of glucose metabolism-related genes in hepatopancreas
  and mesenteric adipose tissue of Nile tilapia fed NFD and HFD for 6-, 8-, and 10-week.
  (A, E) Genes related to glycolysis (pfk and hk) in hepatopancreas and mesenteric
  adipose tissue, respectively. (B, F) Genes related to gluconeogenesis (g6pdase and
  pepck) in hepatopancreas and mesenteric adipose tissue, respectively. (C) Gene related
  to pentose phosphate pathway (g6pd) in hepatopancreas and mesenteric adipose tissue,
  respectively. (D) Gene related to glucose transport (glut2) in hepatopancreas and
  mesenteric adipose tissue, respectively. D, diets; D × F, interaction between diets
  and feeding time; F, feeding time; HFD, high-fat diet; NFD, normal-fat diet. Data
  are presented as means ± SEM (n = 3); asterisks indicate significant differences
  between fish fed HFD and NFD at the same duration of feeding, ⁣∗p < 0.05, ⁣∗∗p <
  0.01. Different letters on columns for the same diet indicate significant differences
  due to duration of feeding (p < 0.05); g6pase, glucose-6-phosphatase; g6pd, glucose-6-phosphate
  dehydrogenase; glut2, glucose transport 2; hk, hexokinase; pepck, phosphoenolpyruvate
  carboxy kinase; pfk, phosphofructokinase
