caption: Network analysis of Hallmark gene sets reveals central regulatory pathways
  in RPE dysfunction. The network representation of hallmark gene sets illustrates
  the interconnections and relationships among key gene targets implicated in RPE
  pathology. Each node represents a gene set, and edges denote functional associations
  or co-regulation. Prominent nodes such as MYC_targets, E2F_targets, G2M_checkpoint,
  and MTORC1_signaling reflect central hubs in cell cycle regulation, proliferation,
  and stress signaling. Node size corresponds to connectivity, with larger nodes indicating
  higher degrees of interaction
