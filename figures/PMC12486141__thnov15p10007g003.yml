figure_title: Functions of miRNAs in osteoblasts subtypes-derived EVs.
caption: Functions of miRNAs in osteoblasts subtypes-derived EVs. (A) GO analysis
  of pathways and biological processes for differentially expressed miRNAs in three
  EVs. (B) KEGG analysis of pathways and biological processes for differentially expressed
  miRNAs in three EVs. (C) Venn analysis between differentially expressed miRNAs in
  three EVs. (D) Heatmaps for intersect 34 miRNAs in three EVs and unique 10 miRNAs
  in Min-EVs. (E) GO enrichment analysis suggests potential functions for the target
  genes of the 34 intersecting miRNAs. (F) GO enrichment analysis indicates possible
  functions of target genes associated with 10 miRNAs found in Min-EVs. (G) Analysis
  of KEGG pathways reveals the top 10 pathways linked to the target genes of the 34
  intersecting miRNAs. (H) KEGG pathway analysis identifies the top 10 pathways associated
  with the target genes of 10 miRNAs in Min-EVs. (I) Bar plot showed the mRNA expression
  level 10 miRNAs in Min-EVs
