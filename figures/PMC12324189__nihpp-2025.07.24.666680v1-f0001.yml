figure_title: ERK responds to and promotes Ca2+ oscillations in MIN6 cells
caption: '(A) Left: Representative single-cell timecourse of EKAREV emission ratio
  (ERK, dark blue curve) and RCaMP1d fluorescence intensity (Ca2+, red curve) in MIN6
  cells sequentially treated with 20 mM tetraethylammonium chloride (TEA) and 5 mM
  calcium chloride (CaCl2). Curves representative of n = 53 cells from 3 independent
  experiments. Additional representative traces shown in Fig. S1. Right: Quantification
  of maximum TEA-stimulated EKAREV emission ratio change (ΔR/R) in MIN6 cells before
  (−) and after (+) CaCl2 addition. n = 53 cells from 3 independent experiments. Data
  analyzed using paired, two-tailed Student’s t-test. Solid and dashed lines in violin
  plot show median and quartiles, respectively. (B) ERK pathway inhibition disrupts
  Ca2+ oscillations. Left: Representative single-cell timecourses of Fura-2-stained
  MIN6 cells sequentially treated with TEA and either 20 μM U0126 (upper) or 20 μM
  PD98059 (lower) to inhibit MEK. Curves representative of n = 92 (U0126) and 69 (PD98059)
  cells from 4 experiments each. Additional representative traces are shown in Figs.
  S2 and S3. Right: Quantification of disrupted TEA-induced Ca2+ oscillations following
  MEK inhibitor treatment in MIN6 cells. Loss: cessation of oscillatory Ca2+ dynamics
  following inhibitor treatment, with Ca2+ either remaining steadily elevated or dropping
  back to baseline levels. Attenuation: continuation of Ca2+ oscillations, but with
  greatly reduced amplitude, after inhibitor treatment'
