figure_title: KEGG functional classification of differential metabolites and proteins
  in OFTu cells infected with ORFV-CL24.
caption: KEGG functional classification of differential metabolites and proteins in
  OFTu cells infected with ORFV-CL24. (A) Statistical plots of significantly enriched
  pathways of differential metabolites in ORFV-infected cells. The abscissa represents
  the number of metabolites, and the ordinate represents the name of the pathway.
  (B–D) KEGG functional classification of differential proteins. The horizontal axis
  represents the number of differential proteins in each classification, while the
  vertical axis represents the secondary functional classification within KEGG’s primary
  categories. Different colors are used to distinguish the primary categories of KEGG.
  The main enriched pathways from the KEGG enrichment analysis at 12 hpi (B), 24 hpi
  (C), and 48 hpi (D)
