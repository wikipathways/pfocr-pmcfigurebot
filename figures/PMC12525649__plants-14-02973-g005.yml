caption: Metabolomic profile analysis. Detection of metabolites in positive ion modes
  (A) and negative ion modes (B). The horizontal axis represents the retention time,
  while the vertical axis represents intensity. (C) Principal component analysis (PCA)
  results of all samples (FL1–FL5), QC represents the quality control sample. Percentages
  are the variance explained by each principal component. (D) KEGG enrichment analysis
  of differential metabolites (DMs). The horizontal axis represents the rich factor,
  while the vertical axis represents the enriched pathway name. The color scale indicates
  different thresholds of the p value, and the size of the dot indicates the number
  of metabolites corresponding to each pathway. The top 20 pathways ranked by p-value
  are displayed
