figure_title: NTG-induced astrocytic heterogeneity and expansion of distinct reactive
  subtypes.
caption: NTG-induced astrocytic heterogeneity and expansion of distinct reactive subtypes.
  (A) UMAP visualization of six transcriptionally distinct astrocytic subclusters
  (A1–A6). (B) Separate UMAP plots show astrocyte distribution in CON (left) and NTG
  (right) groups. (C) Ro/e ratios quantify the enrichment or depletion of each astrocyte
  subtype in NTG relative to CON. +++, Ro/e > 1; ++, 0.8 < Ro/e ≤ 1; +, 0.2 ≤ Ro/e
  ≤ 0.8. (D) Stacked bar plot displays the relative abundance of astrocytic subtypes
  between groups, highlighting the expansion of A2 and A4 under NTG. (E) Heatmap of
  top ranked genes delineates the molecular identity and specialization of each subtype.
  (F) GSVA-based KEGG pathway enrichment showing the top five functional pathways
  associated with each astrocytic subtype
