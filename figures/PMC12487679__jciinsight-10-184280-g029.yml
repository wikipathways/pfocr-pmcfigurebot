figure_title: Splice variant of Nfatc1 activates the mTOR pathway and MYC expression
caption: (A) Volcano plot shows percentage of spliced-in (ΔPSI) versus log10 (FDR
  P value) of all splicing changes identified by rMATS between CLL and normal B cells
  with DM. Events with the absolute percentage of spliced-in (|ΔPSI|) > 10% and FDR
  < 0.05 were considered significant and color-coded. (B) RNA splice variants derived
  from A were plotted out as 5 different splicing types, and statistical significance
  was measured by the |ΔPSI| multiplied by the negative log (FDR). Nfatc1 is one of
  the most consistent changed splice variants and is indicated with an arrow. (C)
  Direct interactors with mTOR and MYC were identified from overlapped genes from
  panel A based on the STRING database. (D) Isoforms of Nfatc1 genes. Primers for
  the quantitative PCR (qPCR) were indicated with arrows. TAD-N, N-terminal transactivation
  domain (aa 1–108); NHR, NFAT homology region (aa 108–426); DBD, DNA-binding domain
  (aa 426–696); TAD-C, C-terminal transactivation domain (aa 696–939). (E and F) Nfatc1
  short isoform 5 is highly expressed in DM CLL cells measured by 2 different reverse
  transcription PCR assays. *P < 0.05, ***P < 0.001, ****P < 0.001; 2-way ANOVA, Šídák
  corrected. Data presented as SD. (G) Nfatc1 isoform 5 overexpression promotes IL-3
  independence in Ba/F3 cells with MYC overexpression. Dead cells were measured over
  27 days with a flow cytometry–based assay upon a staggered IL-3 withdrawal. (H)
  Overexpression of Nfatc1 isoform 5 leads to mTOR pathway activation and upregulation
  of MYC in Ba/F3 cells. (I and J) Overexpression of Nfatc1 isoform 5 results in the
  activation of the mTOR pathway measured by phosphorylation of mTORC1, 4E-BP1, while
  overexpression of isoform 2 leads to the activation of AKT pathway and phosphorylation
  of S6 in human CLL HG3 cell line. (K) Overexpression of Nfatc1 isoform 5 promotes
  more cell growth than isoform 2 in HG3 cells. *P < 0.05, **P < 0.01, 1-way ANOVA.
  Cell proliferation is measured by CCK-8 assay based on colorimetric absorbance at
  450 nm over 3 days of culture. (L and M) SF3B1 mutation promotes the expression
  of NFATC1 isoform 5 and mTOR pathway upregulation in CLL cell lines HG3 and MEC1.
  Isogenic CLL cell lines with SF3B1-K700E are evaluated for NFATC1 expression, MYC
  and mTOR pathway activation by immunoblot
article_title: SF3B1 mutation accelerates the development of CLL via activation of
  the mTOR pathway
