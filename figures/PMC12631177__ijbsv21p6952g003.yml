figure_title: Metabolic and immunoregulatory treatment strategies targeting AAs.
caption: 'Metabolic and immunoregulatory treatment strategies targeting AAs. (a) A
  ferroptosis therapy with enhanced IDS endocytosis. The IDS loaded with V9302 enters
  the cells through endocytosis. The V9302 released by IDS can downregulate Gln metabolism
  reprogramming by inhibiting SLC1A5 and further stimulate the uptake of IDS by inducing
  KRAS-mediated macropinocytosis. The enhanced endocytosis resulting from the synergistic
  action of Gln and V9302 enables efficient delivery of iron and BSO to tumor cells,
  achieving tumor ferroptosis therapy. (b) Curcumin combined with GEM therapy. Curcumin
  can enhance the efficacy of GEM by downregulating the SLC7A8/Gln pathway. (c) Tumor
  starvation therapy. Normal cells synthesize Arg through the urea cycle, but many
  cancer cells lack ASS1 and rely on exogenous Arg to maintain metabolic energy. ADI-PEG
  20 can decompose Arg in the blood, blocking the synthesis of proteins in tumor cells
  by downregulating Arg, while having no effect on normal cells. (d) A novel metal-polyphenolic-based
  multifunctional nanomedicine. This innovative formulation contained Pluronic F127-stabilized
  ferric ion-crosslinked EGCG nanoparticles loaded with the GLS-1 inhibitor BPTES
  and DOX. It can enhance ROS therapeutic sensitivity by decreasing GSH production
  in tumor cells, synergize with DOX to exacerbate DNA damage, promote apoptosis,
  and significantly inhibit tumor cell proliferation. (e) A biomimetic nano-system.
  R-CM@MSN@BC integrates mesoporous organosilicon nanoparticles with ROS-responsive
  diselenide bonds for controlled release of the Gln metabolism inhibitor BPTES and
  the photosensitizer Ce6. Upon laser irradiation, R-CM@MSN@BC executed both photodynamic
  and Gln-metabolic therapies, inducing necroptosis in tumor cells and triggering
  significant immunogenic cell death. R-CM@MSN@BC remodels the tumor immune microenvironment
  by increasing M1-like TAM polarization, reducing M2-like TAMs infiltration and T-cell
  depletion. (IDS: iron-delivery system; BSO: buthionine-sulfoximine; Gln: glutamine;
  Glu: glutamate; GLS: glutaminase; GS: glutamine synthetase; SLC: solute carrier;
  GSH: glutathione; ROS: reactive oxygen species; DNA: deoxyribonucleic acid; KRAS:
  Kirsten rat sarcoma viral oncogene homolog; IDH: isocitrate dehydrogenase; GEM:
  gemcitabine; Arg: Arginine; ASS: argininosuccinate synthase; ASL: argininosuccinate
  lyase; ARG: arginase; Orn: ornithine; ADI-PGE20: pegylated arginine deiminase; OTC:
  ornithine transcarbamylase; TAMs: tumor-associated macrophages; BPTES: bis-2-(5-phenylacetamino-1,3,4-thiadiazole-2-yl)
  ethyl sulfide; EGCG: epigallocatechin gallate; DOX: doxorubicin; Fe-DBEF: novel
  metal-polyphenolic-based multifunctional nanomedicine; RIPK: receptor interacting
  protein kinase)'
