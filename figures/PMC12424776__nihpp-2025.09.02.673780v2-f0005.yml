figure_title: Functional Validation of BCL2 Inhibition and Autophagy-Lysosomal Modulation
caption: (A) Merged fluorescent images of TFEB (green) co-stained with Hoechst (blue),
  showing nuclear localization changes after drug treatments. The bar chart quantifies
  nuclear TFEB fluorescence differences across four treatments. (B) Merged fluorescent
  images of DQ-BSA (red) lysosomal proteolysis co-stained with Hoechst, showing lysosomal
  activity; bar chart quantifies fluorescence intensity differences. (C) Bar chart
  showing lysosomal pH changes after drug treatments. (D) Cell proliferation assay
  of colorectal cancer cells treated with TAS-102 and the lysosomal inhibitor Bafilomycin
  A1. (E) Schematic workflow of high-throughput LysoTracker-based ORFeome overexpression
  screen with FACS sorting. (F) Diagram of TGF-β signaling pathway highlighting lysosomal
  activator and repressor ORFs identified in the LysoTracker-FACs screening. (G-H)
  Kaplan-Meier survival curves depicting overall survival for patients with (G) GHSR
  and (H) CCDC86 expression across multiple cancer types from the TCGA PanCancer Atlas,
  accompanied by stacked bar graphs showing the number of cancer patients stratified
  by expression levels, with studies denoted by the study abbreviations. Data in bar
  graphs are shown as mean ± Standard Deviation (SD). Statistical analysis was performed
  using one or two-way ANOVA with Tukey’s multiple comparisons; * p ≤ 0.05, ** p ≤
  0.01, *** p ≤ 0.001, **** p ≤ 0.0001. Survival curve comparisons were performed
  using the log-rank test
