figure_title: Heatmap of Expression Dynamics of Key Downstream Pathway Genes After
  HbcircARF3/SCSA1/ARFGAP8 and Their Homologous HbLinearRNA Treatments.
caption: 'Heatmap of Expression Dynamics of Key Downstream Pathway Genes After HbcircARF3/SCSA1/ARFGAP8
  and Their Homologous HbLinearRNA Treatments. This figure is an expression heatmap
  illustrating the relative expression levels of key genes across three core pathways
  at 1, 3, 5, and 7 dpi following E. quercicola infection, under two distinct dsRNA
  treatments: HbcircRNA-dsRNA (a silencing treatment targeting HbcircARF3, HbcircSCSA1,
  and HbcircARFGAP8) and HbLinearRNA-dsRNA (a silencing treatment targeting the homologous
  HbLinearRNAs corresponding to these HbcircRNAs). The heatmap is divided into three
  independent modules, each corresponding to one of the HbcircRNAs and its regulated
  pathway; for each module, the x-axis denotes the time points after treatment (in
  dpi), the y-axis lists the key genes of the relevant pathway, and the color bar
  positioned to the right of each module serves as a reference for relative expression
  levels—where the values on the color bar indicate the range of expression levels,
  and a darker color corresponds to a higher relative expression level of the gene'
