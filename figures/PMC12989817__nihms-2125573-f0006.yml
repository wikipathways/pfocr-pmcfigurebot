figure_title: Comparative molecular analyses between Kv1.
caption: Comparative molecular analyses between Kv1.3 interactors and autoimmune diseases
  associated risk genes (A) Intersection of autoimmune diseases associated risk genes
  and Kv1.3 interactors shows 178 Kv1.3 enriched proteins in JTCs are risk factor
  for autoimmune conditions. (B) GO term enrichment analysis of 178 Kv1.3 interacting
  autoimmune risk genes highlights their role in immune response and signaling. STRING
  analyses illustrating protein-protein interactions shows (C) T-cell receptor complex,
  (D) Cytokine-mediated signaling pathway and (E) Actin filament bundle assembly or
  lymphocyte migration functional clusters in Kv1.3 interacting autoimmune risk genes
  found in JTCs. (F) Western blot following co-immunoprecipitation showing Kv1.3 direct
  interaction with STIM1 and no physical interaction with CD3E, using V5-tag fused
  to TurboID. (IP-Immunoprecipitation) (n=3). Table showing details of each analysis
  is given in Supp. Datasheet 8
