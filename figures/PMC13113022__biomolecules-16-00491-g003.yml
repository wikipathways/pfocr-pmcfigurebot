figure_title: Crosstalk between NF-κB and other pathways in cardiovascular diseases.
caption: Crosstalk between NF-κB and other pathways in cardiovascular diseases. Figure
  3 provides a picture about how NF-κB interacts with other pathways in cardiovascular
  diseases. NF-κB plays a key role in regulating inflammatory responses. MAPKs enhances
  the activity of IKK and the stability of p65. NF-κB upregulates the expression of
  MAPK components. The PI3K/Akt pathway directly phosphorylates IKK and p65. TLR4/MyD88
  serves to initiate NF-κB activation
