figure_title: The diagram illustrates the five primary mechanisms by which NPs exhibit
  their antibacterial properties.
caption: The diagram illustrates the five primary mechanisms by which NPs exhibit
  their antibacterial properties. (I) The NPs stick to and attach to the surface of
  the microbial cell, which in turn causes damage to the cell membrane and changes
  in its transport activity. (II) NPs infiltrate microbial cells and engage with intracellular
  biomolecules, thereby influencing the corresponding cellular machinery. (III) The
  presence of NPs induces the generation and amplification of ROS, resulting in cellular
  damage. (IV) The NPs manipulate the cellular signal pathway and induce cell death.
  (V) NPs effectively inhibit the movement of ions into and out of microbial cells
  [61]
