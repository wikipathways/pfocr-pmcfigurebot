figure_title: Transforming growth factor-β signalling in aortic aneurysms and dissections.
caption: 'Transforming growth factor-β signalling in aortic aneurysms and dissections.
  TGF-β ligands are produced as part of a large latent complex composed of mature
  TGF-β, a LAP, and an LTBP. TGF-β signals through both canonical and non-canonical
  pathways. In the canonical pathway, TGF-β binds to its type II receptor (TβRII),
  which recruits and phosphorylates the type I receptor (TβRI). Activated TβRI then
  phosphorylates receptor-regulated SMADs (R-SMADs), primarily SMAD2 and SMAD3. These
  SMADs translocate to the nucleus, where they bind to the promoters of target genes
  and regulate transcription. Canonical TGF-β signalling supports normal aortic development
  and maintains vascular homeostasis. Mutations in genes encoding TGF-β ligands, receptors,
  or SMAD proteins can cause thoracic aortic aneurysms and dissections. In non-canonical
  pathways, the activated TGF-β receptor complex initiates signalling cascades via
  mediators such as TGF-β-activated kinase 1 (TAK1), p38 mitogen-activated protein
  kinase (p38 MAPK), extracellular signal-regulated kinase (ERK), JUN N-terminal kinase
  (JNK), and nuclear factor-κB (NF-κB). These non-canonical pathways contribute to
  aortic wall degradation and the pathogenesis of AAD. LAP: latency-associated peptide;
  LTBP: latent TGF-β-binding protein; TGF-β: Transforming growth factor-β. Reproduced
  from Shen and LeMaire [23] with permission from Elsevier'
