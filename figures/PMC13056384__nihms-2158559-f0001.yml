figure_title: Interplay of players involved in the progression of MASLD and ALD.
caption: Interplay of players involved in the progression of MASLD and ALD.Consumption
  of high nutrients diets and alcohol converge in common mechanisms that synergize
  to induce the overall phentypic changes of MASLD and ALD, as well as MetALD. The
  ingestion of dietary fats and the oxidative metabolism of ethanol alter ER inducing
  ER stress, which emerges as a critical trigger to cause increased de novo lipogenesis,
  including free fatty acids and cholesterol via activation of transcription factors
  SREBP1c and SREBP2, respectively, with the ultimate impact in the onset of hepatic
  steatosis. ER stress in turn induces STARD1 expression, which translocates cholesterol
  to the mitochondrial inner membrane for metabolism by CYP27A1 to generate the oxysterol
  27-hydroxycholesterol that acts as the precursor of the primary bile acid, chenodeoxycholi
  acid (CDCA). ER stress blocks the expression of CYP7A1, the rate-limiting step in
  the synthesis of bile acids through the classic pathway, causing the reprogramming
  of bile acid metabolism from the classic to the alternative pathway. Besides the
  stimulation of CDCA, the translocation of cholesterol to mitochondria, impairs mitochondrial
  function and antioxidant defense stimulating the generation of reactive oxygen species
  (ROS). Defects in autophagy by alterations of the function of lysosomes in part
  by changes in their physico-chemical properties lead to impairment of lipophagy
  and mitophagy, perpetuating the induction of steatosis and mitochondrial dysfunction.
  In addition, the increase in cholesterol content impairs the function of immune
  cells particularly CD8+ lymphocytes.The figure was generated by BioRender under
  the agreement number SN298QD1XP
