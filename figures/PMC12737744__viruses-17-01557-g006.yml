figure_title: Mongolia as a migratory pathway for several bird species.
caption: Mongolia as a migratory pathway for several bird species. Mongolia’s distinctive
  geographic and ecological features make it an ideal setting to investigate the epidemiology
  of avian paramyxoviruses (APMVs) in wild bird populations. The country lies at the
  intersection of four major migratory flyways—East Asia/Australasia, Central Asia/India,
  West Asia/Africa, and the Mediterranean/Black Sea—placing it at a strategic crossroads
  for studying avian movement and pathogen transmission. An estimated 391 migratory
  bird species pass through or breed in Mongolia, which functions as a vital stopover,
  refueling site, and breeding ground for diverse species, including cranes, geese,
  egrets, eagles, and falcons. Created in BioRender. Trujillo Vargas, C. (2025) https://BioRender.com/6r2ncj1
