figure_title: Role of Rubicon in the autophagy pathway.
caption: Role of Rubicon in the autophagy pathway. Autophagy is initiated by phagophore
  nucleation and elongation to form the double-membrane autophagosome, which then
  fuses with lysosomes to generate the autolysosome, where enclosed cargo is degraded.
  Following cargo degradation, p62 dissociates from the isolation membrane, and LC3-II
  is delipidated to LC3-I and released from the membrane. The class III PI3K complex,
  which is composed of Beclin-1 (BECN1), hVps34, and p150, acts as an autophagosome-formation
  driver when bound to Atg14L, whereas its association with UVRAG promotes autophagosome
  maturation. Rubicon binds to the PI3K complex and directly interacts with Rab7,
  thereby inhibiting the Rab7–HOPS (homotypic fusion and protein sorting) machinery
  and suppressing autophagosome formation, which contributes to overall autophagy
  inhibition
