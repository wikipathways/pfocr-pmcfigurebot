figure_title: RNA-seq analysis of reversal of TGF-β-mediated gene modulation by CEL
  and ExoCEL.
caption: RNA-seq analysis of reversal of TGF-β-mediated gene modulation by CEL and
  ExoCEL. (A) Principal component analysis (PCA) of normalized gene expression profiles
  from untreated cells and TGF-β-treated cells subsequently exposed to CEL or ExoCEL,
  where each point represents an individual sample. (B1-B5) Volcano plots showing
  differentially expressed genes across the indicated comparisons. (C1-C2) Clustered
  heatmaps illustrating differential expression of genes associated with the TGF-β
  signaling pathway and EMT. First, the genes modulated by TGF-β treatment were identified
  and then compared with the respective expression patterns in CEL or ExoCEL treated
  H1299 cells. Blue and red color indicate relative upregulation and downregulation,
  respectively, based on log fold change (logFC). Statistical significance is indicated
  as p < 0.05, p < 0.01, p < 0.001
