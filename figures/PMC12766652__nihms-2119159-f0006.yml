figure_title: Anticipatory behavioral defense against dietary AA-derived ammonia toxicity
  during recovery from catabolic states relayed by a gut-to-brain pathway
caption: (A) Schematic illustration of the interorgan circuit limiting dietary protein
  intake via intestinal sensing of dietary ammoniagenesis. We propose that this mechanism
  serves as an anticipatory, first-line defense against accumulation of harmful levels
  of ammonia (B) Simplified dose-response curve highlighting the proposed relationship
  between dietary AA (QKT) ingestion and activation of the TRPA1-dependent gut-to-brain
  pathway. During recovery from catabolism, the activation threshold is shifted to
  the left because the host’s detoxification capacity operates close to maximum capacity
  due to muscle proteolysis-driven ammoniagenesis during the preceding insult. The
  liability of ingesting exogenous sources of ammonia (QKT) is thus enhanced and countered
  by set point adjustment
article_title: Gut-to-brain signaling restricts dietary protein intake during recovery
  from catabolic states
