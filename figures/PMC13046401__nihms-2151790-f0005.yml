figure_title: Absolute Metabolite Associations with Sleep and Circadian Disruption
  in Human Translational Models
caption: A. Absolute metabolites were annotated at the level of subclass, human/clinical
  studies were classified based on the sleep pathology diagnosis or sleep characteristics,
  and metabolites were stratified by sample type. B. A subset of metabolites was also
  annotated at the level of group/category, classified by sleep pathology diagnosis
  or sleep characteristics, and stratified by sample type in human clinical research.
  Red circles indicate a significant increase in concentration or expression and blue
  indicate a significant decrease in concentration or expression. The size of the
  circle is scaled so metrics that are more frequently mentioned appear larger, and
  observations were required to be mentioned two or more times to appear in the figure.
  Please see Supplemental Figure S3 for absolute metabolite and metabolic pathway
  responses by sleep pathology group (defined in methods) in human studies, and Supplemental
  Table S4 for tabulated absolute metabolite results used to make figures, as well
  as Class 1, 2, and 3 (with selected metabolites) hierarchical categorizations of
  metabolites
