figure_title: Single-Cell RNA sequencing of Kupffer Cells during early EtOH feeding
caption: FACS sorted KCs were prepared from mice fed a chow, day 3 EtOH, or day 10
  EtOH and single cell RNAseq was performed as described in the methods. A. Clustree
  analysis of the reclustered myeloid cell data set is shown. Resolution 0.04 best
  differentiated different myeloid cell types. Myeloid cell subsets were identified
  based on SingleR prediction and expression of CD68. B. tSNE representation of re-clustered
  macrophage subset of the data. Data from all mice were clustered together. C. Heatmap
  representation of the top differentially expressed genes (up to 10) in each of the
  myeloid clusters represented in Panel B. The full list of genes names is available
  in Supplemental Table 1. D. Relationships of the macrophage/myeloid cluster groups
  based on phylogenetic tree analysis. Two related groups were identified. E. Bar
  graph representation of functional pathways predicted by the Database for Annotation,
  Visualization and Integrated Discovery (DAVID) for the myeloid clusters based on
  comparative analyses of group 1 (clusters 1, 2, 5, and 6) and group 2 (clusters
  0, 3, 4, 7, and 8). The color of bar represents category of biological annotation.
  The horizontal axis represents the enrichment score based on the -log(P-Value) from
  the DAVID analysis. F. Predicted activated (red) and inhibited (blue) upstream regulators
  from Ingenuity Pathway Analysis (IPA) of differentially expressed genes from myeloid
  cluster group 1 compared to group 2. The horizontal axis and bubble size represent
  the enrichment score based on the -log(P-Value) and Z-score, respectively
