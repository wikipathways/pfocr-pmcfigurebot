figure_title: Sialylation pathway in cells.
caption: Sialylation pathway in cells. The nucleotide glycan UDP-GlcNAc, the product
  of hexosamine pathway, is converted into ManNAc by UDP-GlcNAc 2-epimerase (whose
  encoding gene is GNE in humans). ManNAc is metabolic precursor for the synthesis
  of sialic acid and produces Neu5Ac in the cytosol, which then enters the nucleus
  to produce CMP-Neu5Ac. CMP-Neu5Acs are transported into Golgi where they are used
  by sialyltransferase to produce glycoproteins or glycolipids, respectively. Finally,
  sialic acids are recycled by neuraminidases, regenerating sialic acid monomers that
  can be re-used. The figure shows three types of sialylated glycans, which involve
  sialylated N-glycans, sialylated O-glycans and gangliosides
