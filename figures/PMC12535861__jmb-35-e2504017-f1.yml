figure_title: Reduced gut microbiota species richness in women with GO
caption: '(A) α-diversity analysis of gut microbiota in normal and obesity pregnancy
  groups. The figure shows three indicators: ACE (left) and Chao1 (middle). The normal
  group exhibited significantly higher ACE and Chao1 values than the obesity group
  (p = 0.0022), indicating greater species richness in the normal group. (B) Simpson
  index distribution analysis revealed significant intergroup differences (r = 0.659,
  p = 0.002), indicating significant differences in species evenness between the two
  groups. (C-E) Taxonomic analysis: (left) Relative abundance at phylum/genus/ species
  levels; (right) LDA-identified differential taxa (Firmicutes/Synergistota highlighted).
  (F) KEGG pathway heatmap revealed functional divergence (color gradient: relative
  abundance)'
