figure_title: Mechanisms of MC-LR-induced sepsis.
caption: Mechanisms of MC-LR-induced sepsis. Upon entering the bloodstream, MC-LR
  activates immune cells, triggering the release of inflammatory factors and promoting
  the adhesion of neutrophils to vascular endothelial cells, directly damaging endothelial
  cells and increasing vascular permeability and microthrombosis formation. By inhibiting
  PP1 and PP2A, it activates multiple pathways, induces mitochondrial apoptosis, generates
  a large number of inflammatory factors, triggers a cytokine storm, and leads to
  systemic inflammation and multi-organ damage
