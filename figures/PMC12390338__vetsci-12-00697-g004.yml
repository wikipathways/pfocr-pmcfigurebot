  derived from the metabolic datasets for prediction of pathways associated with serum
  metabolite sets. Metabolite sets (SMPDB; 99 metabolite sets based on normal human
  metabolic pathways) were used as a metabolite set library in the enrichment analysis.
  The colors and the bar length represent the metabolites with different levels of
  significance according to enrichment analysis
