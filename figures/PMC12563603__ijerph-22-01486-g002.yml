caption: 'Flowchart illustrating the main ways that climate change could affect the
  incidence of breast cancer. Breast cancer is thought to be potentially impacted
  by climate change through several different processes. Note: The relationships considered
  in this scoping review are indicated by black arrows in the diagram. Unestablished
  associations are shown by yellow arrows. Relationships with dashed black arrows
  may be changed with the right help. Related ideas that are not covered in this examination
  are indicated by blue arrows. In parentheses is the total number of publications
  that provided evidence for each pathway. (For an explanation of the color references
  in this legend, the reader is referred to the article’s online version)'
