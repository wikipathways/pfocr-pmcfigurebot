figure_title: Diagram illustrating the regulated mechanisms of calycosin in atherosclerosis.
caption: Diagram illustrating the regulated mechanisms of calycosin in atherosclerosis.
  Calycosin shows potential protective effects on the different layers of vessels,
  ranging from endothelia to perivascular adipose tissue. Calycosin prevents the progression
  of atherosclerosis by strengthening autophagy and cholesterol efflux to reduce cell
  apoptosis through the KLF2-MLKL pathway; it also enhances endothelial function,
  enacts an anti-contractile effect and restrains vascular calcification mainly by
  AMPK activation. AMPK—adenosine 5′-monophosphate (AMP)-activated protein kinase;
  Drp1—dynamin-related protein 1; eNOS—endothelial nitric oxide synthase; KLF2-MLKL—krüppel-like
  factor 2-mixed lineage kinase domain-like protein; mTOR—mammalian target of rapamycin;
  PVAT—perivascular adipose tissue; and SNARE—soluble N-ethylmaleimide-sensitive factor
  attachment protein receptor. The red upward arrows indicate increases, the green
  downward arrows indicate decreases, and cross marks represent inhibition
