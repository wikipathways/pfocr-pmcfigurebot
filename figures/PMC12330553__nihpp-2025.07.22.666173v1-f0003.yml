figure_title: LINE1 activation as a clinical indicator for MM progression
caption: A, Kaplan-Meier survival analysis of MM patients stratified by number of
  active L1s (Q1-Q4). B, Overlap between patients in the PR subtype and top 5% patients
  by number of active L1PAs. Among the top 5% of MM patients (n = 36) ranked by L1PA2
  activation, 22 patients overlapped with the PR subtype (n = 51), which is associated
  with a high proliferation index. C, Unsupervised clustering of differentially expressed
  genes in MM patients based on L1PA2 activation scores, revealing E2F pathway activation
  and inhibition of IFN and P53 pathways in patients with high L1PA2 activation. D,
  Pathway analysis for PMM samples also revealed inhibition of TNF, P53, and NF-κB
  pathways in PMM samples with increased LINE1 activation compared to BMPCs
