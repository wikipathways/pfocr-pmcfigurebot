figure_title: 'Research Hypothesis Illustration: SCAP and complement C3 play a role
  in cholesterol-driven astrocyte responses in diabetes-associated cognitive impairment.'
caption: 'Research Hypothesis Illustration: SCAP and complement C3 play a role in
  cholesterol-driven astrocyte responses in diabetes-associated cognitive impairment.
  Astrocytic SCAP expression is abnormally increased in HFD/STZ-induced diabetic mice,
  impairing neuronal synaptic plasticity by activating the IκBα/NF-κB/C3 signalling
  pathway. Upregulated SCAP in astrocytes directly binds to IκBα, increasing its activation
  in the Golgi apparatus, which promotes NF-κB nuclear translocation and triggers
  complement C3 transcriptional activation and inflammatory immune responses, ultimately
  leading to neuronal and cognitive damage'
article_title: Cholesterol-driven pathological astrocytic responses in diabetes-associated
  cognitive impairment through astrocytic SCAP accumulation and NF-κB–C3 signaling
  modulation
