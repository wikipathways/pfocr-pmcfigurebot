figure_title: Exogenous IL-6, alone or with sIL-6Rα (trans-signaling), does not significantly
  alter renal transporter mRNA expression in PTECs
caption: 'Primary human PTECs cultured on Transwells were treated for 48 h (media
  replaced every 24 h) with 1 ng/mL IL-6, 1 ng/mL IL-6 + 100 ng/mL sIL-6Rα + the inhibitor
  cocktail (consist of PD98059 [ERK, 10 μM], SB203580 [p38MAPK, 10 μM], SP600125 [JNK,
  10 μM], and PDTC [NF-κB, 30 μM]), 100 ng/mL sIL-6Rα alone (to probe the trans-signaling
  with endogenously secreted IL-6), and 100 ng/mL sIL-6Rα + the inhibitor cocktail
  (for background sIL-6Rα effects and inhibition of MAPK/NF-κB crosstalk). IL-6 and
  the inhibitor cocktail were added to both apical and basal chamber of Transwells,
  while sIL-6Rα was only added to the basal chamber of Transwells as apical sIL-6Rα
  exposure is not physiologically relevant owing to its greater molecular weight (~50–70
  kDa) and minimal renal filtration in vivo. Panels: (A) OAT1, (B) OAT2, (C) OAT3,
  (D) OCT2, (E) OAT4, (F) OCTN1, (G) PEPT2, and (H) UGT2B7. Expression is shown relative
  to the respective IL-6 free or sIL-6Rα-free controls within each inhibitor condition
  (dotted line = 1), as these inhibitors alone without cytokines affected the mRNA
  expression of transporters (Supplemental Figure S7). Data are mean ± SD from three
  donors (denoted by points, each quantified in triplicate). Statistical significance
  was assessed using repeated-measures two-way ANOVA with Dunnett’s multiple comparisons
  against the corresponding IL-6-free or sIL-6Rα-free baselines (*p≤0.05, **p<0.01,
  ****p <0.0001). Across transporters, exogenous IL-6 (classic signaling) and IL-6
  + sIL-6Rα (trans-signaling) produced no significant transcriptional changes. Statistically
  significant downregulation of PEPT2 and UGT2B7 was observed when 1 ng/mL exogenous
  IL-6, 100 ng/mL sIL-6Rα, and the inhibitor cocktail were added in combination. However,
  this was not observed when PTECs were exposed to 100 ng/mL sIL-6Rα alone, suggesting
  differences in signaling activity between exogenous and endogenous IL-6. Data for
  additional transporters, DMEs, and endocytic receptors tested are in Supplemental
  Figures S7 and S10. Pathway engagement/marker genes assessing inhibitor activity
  are shown in Supplemental Figure S9'
