figure_title: Tn-Seq identifies genes required for antibiotic tolerance in Mabs
caption: (A) Experimental design. (B-E) Tn-Seq analysis showing relative abundance
  of individual genes under the indicted conditions. Genes depleted relative to the
  input population have negative values. All cultures were fully aerated throughout
  the experiment and cultures without antibiotics received and equal volume of DMSO.
  For (B-D) gene abundance in the indicated condition is measured relative the input
  log-phase population. In (E) an additional comparison is made for PBS with antibiotics
  relative to the PBS condition. Genes with significant decreases in abundance are
  shown in color (p-adj. < 0.05 and log2 fold-change > 0.5) using the Benjamini–Hochberg
  adjustment for multiple hypothesis testing. (F) Number of genes essential in each
  condition relative to the input population. (G) Pathway enrichment analysis of the
  essential genes in each condition using the DAVID knowledgebase (p <0.05). Screens
  were run as 3 independent experiments and the combined results analyzed. Antibiotic
  conditions were as described above
