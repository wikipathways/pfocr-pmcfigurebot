  dehydrogenase [EC:1.1.1.42], Glucose-6-phosphate 1-dehydrogenase [EC:1.1.1.49],
  Glutathione S-transferase [EC:2.5.1.18], Ornithine decarboxylase [EC:4.1.1.17],
  5-oxoprolinase (ATP-hydrolyzing) [EC:3.5.2.9] and Ribonucleoside-diphosphate reductase
  subunit M1 [EC:1.17.4.1]. DEGs: differentially expressed genes; CK: control group;
  VP-AsA: vacuum packaging combined with 0.5% (w/v) ascorbic acid treatment'
