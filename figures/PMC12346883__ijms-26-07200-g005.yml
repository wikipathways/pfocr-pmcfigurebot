figure_title: Effect of BSA-E2 on MDR1 expression with the Src/EGFR signaling pathway.
caption: Effect of BSA-E2 on MDR1 expression with the Src/EGFR signaling pathway.
  Cells were treated with 100 nM of BSA-E2 for 5−60 min (A) or BSA-E2 (10, 50, 100)
  for 5 min (B). p-Src and p-EGFR protein levels were determined by Western blot.
  (C) Cells were pretreated with 10 µM of PP2 and 10 µM of AG1478 for 1 h, followed
  by treatment with 100 nM of BSA-E2 for 24 h. MDR1 protein levels were assessed by
  Western blot. (D) Cells were pretreated with 10 µM of AG1478 and 10 µM of PP2 for
  1 h and then treated with 100 BSA-E2 for 30 min. Phosphorylation of Akt, ERK, NF-κB,
  and CREB was detected by Western blot
