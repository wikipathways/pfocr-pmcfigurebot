figure_title: Glutamine deprivation alters mitochondrial morphology and suppresses
  glycolysis, inducing a Poised Metabolic Arrest (PMA) state in myoblasts
caption: (A) Live-cell imaging of freshly isolated primary myoblasts after culturing
  in normal growth media with glutamine (+Q) or glutamine-free media (−Q) for 24 hours,
  stained with MitoView Green to visualize mitochondria. Scale bar = 20 μm. (B) Quantification
  of mitochondrial length in primary myoblasts under +Q and −Q conditions. Data represent
  mean ± SD from 10 cells per condition. Statistical significance was determined using
  Student’s t-test. (C) Immunofluorescence microscopy images of proliferating C2C12
  cells stably expressing MitoTag-mCherry cultured in +Q or −Q media, highlighting
  mitochondrial morphology. Scale bar = 10 μm. (D) Quantification of mitochondrial
  length in C2C12 cells under +Q and −Q conditions. Data represent mean ± SD from
  10 cells per condition/experiment. At least three independent biological replicates
  were analyzed. Statistical significance was determined using Student’s t-test. (E)
  Measurement of oxygen consumption rate (OCR) in C2C12 cells cultured in +Q or −Q
  conditions using the Seahorse XF Analyzer. Data represent mean ± SD from 6 replicates
  per condition. Statistical analysis was performed using Student’s t-test. (F) Fluorescence
  microscopy images showing mitochondrial membrane potential (ΔΨm) in proliferating
  C2C12 cells cultured in +Q or −Q media, assessed using JC-1 dye. Scale bar = 20
  μm. (G) Quantification of ΔΨm in C2C12 cells under +Q and −Q conditions. ΔΨm was
  quantified by calculating the ratio of fluorescence intensity at 488 nm (green monomers)
  to 568 nm (red aggregates) from JC-1 staining using FIJI software. Data represent
  mean ± SD from n = 3 independent experiments. Statistical significance was determined
  using Student’s t-test. (H) Fluorescence microscopy images showing mitochondrial
  superoxide levels in proliferating C2C12 cells cultured in +Q and −Q conditions,
  assessed using MitoSOX Red staining. Scale bar = 100 μm. (I) Quantification of mitochondrial
  superoxide levels in C2C12 cells under +Q and −Q conditions, calculated as the ratio
  of MitoSOX Red fluorescence (superoxide indicator) to MitoView Green fluorescence
  (mitochondrial marker). Data represent mean ± SD from n = 3 independent experiments.
  Statistical analysis was performed using Student’s t-test. (J) Uniform Manifold
  Approximation and Projection (UMAP) analysis of whole-cell mRNA sequencing data
  from proliferating C2C12 cells cultured in +Q or −Q media, highlighting upregulated
  and downregulated gene ontology pathways under glutamine-free conditions. (K) Heatmap
  displaying the expression levels of the top 51 downregulated glycolysis pathway
  genes in C2C12 cells under −Q conditions compared to +Q, generated using k-means
  clustering. (L) Gene Set Enrichment Analysis (GSEA) of glycolysis pathway genes
  in C2C12 cells cultured in −Q versus +Q conditions, indicating significant downregulation
  of glycolytic genes upon glutamine deprivation.(M) Measurement of OCR in C2C12 cells
  cultured in normal growth media containing glucose (+Glc) or glucose-free media
  (−Glc), treated with BPTES (a glutaminase inhibitor) or vehicle control (DMSO),
  using the Seahorse XF Analyzer. Data represent mean ± SD from n = 6 replicates per
  condition. Statistical significance was assessed using Student’s t-test. (N) Measurement
  of OCR in C2C12 cells cultured in +Q or −Q media, treated with UK5099 (an inhibitor
  of the mitochondrial pyruvate carrier) or vehicle control (DMSO), using the Seahorse
  XF Analyzer. Data represent mean ± SD from 6 replicates per condition. Statistical
  significance was assessed using Student’s t-test. Statistical significance is indicated
  as P<0.05(*) and P<0.05(#), determined by Student’s t-test. Data presented as mean
  ± SD
