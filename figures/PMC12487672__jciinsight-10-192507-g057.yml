figure_title: Elevated DGAT2 secretion enhances CD8+ T cell activation, proliferation,
  and survival
caption: (A) Western blot analysis showing reduced intracellular DGAT2 expression
  in PSO compared with NOR, while secreted DGAT2 levels are paradoxically increased.
  n = 3 samples per group. (B) ELISA quantification of DGAT2 levels in cell lysates
  and supernatants from Spry1ΔEpi and WT keratinocytes (n = 5 per group) and from
  psoriatic keratinocytes compared with normal controls (n = 3 per group). (C) Flow
  cytometry analysis of epidermal CD8+ T cells from PSO and NOR. (D) GSEA of RNA-sequencing
  data from Spry1ΔEpi and WT mice epidermis that shows significant enrichment of immune-related
  pathways, particularly those associated with CD8+ T cells. NES, normalized enrichment
  score; NOM, nominal. (E) Flow cytometry analysis that reveals increased TNF-α, IFN-γ,
  and CD25 expression in CD8+ T cells treated with recombinant DGAT2 protein compared
  with controls. n = 6 samples per group. (F and G) CFSE proliferation assay that
  shows enhanced cell division in DGAT2-treated CD8+ T cells, as indicated by reduced
  fluorescence intensity. n = 7 samples per group. (H and I) Annexin V/PI staining
  indicates reduced apoptosis in DGAT2-treated CD8+ T cells. n = 6 samples per group.
  Paired 2-tailed Student’s t test was performed. *P < 0.05, **P < 0.01, ***P < 0.001
article_title: DGAT2 reduction and lipid dysregulation drive psoriasis development
  in keratinocyte-specific SPRY1-deficient mice
