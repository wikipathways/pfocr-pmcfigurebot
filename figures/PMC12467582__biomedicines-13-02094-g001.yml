figure_title: Ulcerative colitis is characterized by a suppression of mitochondrial
  genes.
caption: Ulcerative colitis is characterized by a suppression of mitochondrial genes.
  (A). Identification of altered pathways in human rectal UC biopsies by KEGG pathway
  term enrichment analysis. Data derives from [23] and was reanalyzed using 5296 significantly
  altered genes (|fold change| ≥ 1.5, FDR < 0.001) from the comparison of ulcerative
  colitis (UC) (206 patients) and non-IBD controls (20 patients) stated in supplementary
  data 1 of [23]. Terms with padj < 0.05 were considered significantly over-represented.
  The x-axis represents the number of over-represented gene symbols from the input
  data within stated KEGG terms. Circle size represents the term’s gene ratio (the
  percent of gene symbols from input data in reference to all gene symbols annotated
  in a given KEGG term). Color-coding of circles represents the significance of term
  enrichment (p-value). (B). KEGG metabolic pathway term enrichment analysis of over-represented
  genes from the ‘Metabolic pathway’ term from (A). X-axis represents the gene ratio
  of stated KEGG terms. Color-coding indicates fold-enrichment of over-representation.
  (C). Venn diagram of gene symbols annotated in the top six-fold-enriched metabolic
  pathway terms of (B). Selected gene symbols annotated within indicated pathways
  are stated. (D). log2 fold change of up (red)- and downregulated (blue) genes from
  the KEGG pathway term “Oxidative phosphorylation”, comparing UC patients with age-
  and sex-matched non-IBD controls [23], identified in (B). (A–D). Original RNA-seq
  data used for re-analyses were published in [23]
