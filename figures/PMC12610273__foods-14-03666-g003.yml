figure_title: Effect of FpVeA and FpVelB on conidiation in F.
caption: Effect of FpVeA and FpVelB on conidiation in F. proliferatum. (A) Quantification
  of conidiospores of ΔFpveA and ΔFpvelB. After being cultured in YEPD media at 28
  °C for 3 days, the conidia were harvested and counted. (B) Morphology of macroconidia
  of ΔFpveA and ΔFpvelB. Macroconidia were harvested from mung bean media, stained
  with 10 μg/mL CFW and photographed under a fluorescence microscope. Scale = 5 μm
  (red line). (C) Relative expression levels of spore-specific genes in ΔFpveA and
  ΔFpvelB. After being cultured in YEPD media at 28 °C for 3 days, the conidia were
  harvested for qRT-PCR. FpflbC encoded C2H2 zinc finger transcription factor, FpflbD
  encoded Myb-like transcription factor and FpbrlA-, FpabaA- and FpwetA-encoded regulators
  were involved in the central development pathway. (D) Trehalose contents in the
  conidia of ΔFpveA and ΔFpvelB. After being cultured in YEPD media at 28 °C for 3
  days, the conidia were collected for the measurement of trehalose contents. (E)
  Relative expression levels of trehalose synthetic genes in ΔFpveA and ΔFpvelB. After
  being cultured in YEPD media at 28 °C for 3 days, the conidia were harvested for
  qRT-PCR. FptpsA, FptpsB and FptpsC encoded α,α-trehalose phosphate synthases. Error
  bars denote standard deviations of three replicates. Different letters above bars
  represent significant differences determined using ANOVA with Student’s t-test (p
  < 0.05). Each experiment was performed in triplicate
