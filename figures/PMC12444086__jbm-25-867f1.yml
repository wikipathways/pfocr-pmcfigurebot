figure_title: Molecular mechanisms underlying sarcopenia.
caption: Molecular mechanisms underlying sarcopenia. Macroautophagy and YouTH Optimizer
  (Mytho) plays a dual role in muscle health. Acute Mytho knockdown during conditions
  such as starvation or cancer cachexia mitigates muscle atrophy and preserves muscle
  function. Prolonged knockdown leads to pathological hypertrophy due to chronic mechanistic
  target of rapamycin complex 1 (mTORC1) activation and reduced autophagosome formation,
  resulting in mitochondrial dysfunction. Activation of the ectodysplasin A2 receptor
  (EDA2R)-nuclear factor-κB-inducing kinase (NIK) pathway accelerates muscle degradation
  by upregulating E3 ubiquitin ligases atrogin-1 and muscle ring finger 1 (MuRF1),
  while HECD1 stabilizes sarcomeric proteins like nebulin and its dysregulation causes
  sarcomeric instability and nemaline myopathy
