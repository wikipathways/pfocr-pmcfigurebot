figure_title: PSAP and cancers.
caption: 'PSAP and cancers. PSAP regulates tumor progression through diverse signaling
  pathways and molecular interactions. (A) In breast cancer, PSAP upregulates ERα
  expression via the MAPK signaling pathway, enhancing its intranuclear translocation
  and transcriptional activity to drive estrogen-dependent breast cancer growth. Cancer-associated
  fibroblasts (CAFs), differentiated under rigid extracellular matrix (ECM) conditions,
  secrete PSAP to activate the Akt pathway, supporting breast cancer cell proliferation
  while inhibiting metastasis. Additionally, the miR-23b/27b/24 cluster promotes aggressive
  breast cancer metastasis by directly suppressing PSAP expression. PSAP exhibits
  dual roles in breast cancer progression: promoting tumorigenesis in grade I tumors
  and suppressing metastasis in grade III tumors, highlighting its context-dependent
  regulatory function. (B) In ovarian cancer, inhibition of PSAP (prosaposin) by the
  tumor microenvironment leads to decreased secretion of thrombospondin-1 (TSP-1),
  enabling tumors to achieve immune evasion. The therapeutic cyclic PSAP peptide restores
  TSP-1 production by activating bone marrow-derived monocytes. TSP-1 binding to CD36
  induces apoptosis, inhibits angiogenesis, inhibits angiogenesis, promotes macrophage
  infiltration, significantly suppressing tumor growth and metastasis. (C) Role of
  PSAP in other cancers. In prostate cancer (PCa), PSAP upregulates activity of hormone
  receptor (AR) and prostate-specific antigen (PSA) expression and phosphorylation,
  and promotes tumor growth, migration, and invasion through the integrin pathway
  (via β1A-integrin, Cathepsin D [CTSD], and ceramide). Sap C further stimulates urokinase-type
  plasminogen activator (uPA)/uPA receptor (uPAR) and c-Jun, activates the p42/44
  mitogen-activated protein kinase (MAPK) and stress-activated protein kinase/c-Jun
  N-terminal kinase (SAPK/JNK) pathways, and suppresses apoptosis via Akt-mediated
  inhibition of caspase-3/7/9, thereby stimulating proliferation, migration, and invasion
  of PCa cells. (D) In gliomas and glioblastoma (GBM), PSAP promotes tumor invasion
  and epithelial–mesenchymal transition (EMT) through TLR4/NF-κB and TGF-β1/Smad pathways.
  In gastric cancer (GC) and colorectal cancer (CRC), high PSAP expression correlates
  with advanced tumor stages and poor prognosis, potentially promoting progression
  via immune microenvironment modulation. In gallbladder cancer (GBC), PSAP upregulation
  promotes proliferation and serves as an early diagnostic biomarker. In hepatocellular
  carcinoma (HCC), PSAP drives tumor proliferation via the circVAPA/miR-377-3p axis.
  In pancreatic ductal adenocarcinoma (PDAC), PSAP suppresses CD8+ T-cell infiltration
  to accelerate progression. In malignant pleural mesothelioma (MPM), PSAP supports
  tumor survival by resisting oxidative stress. In fibrosarcoma, PSAP enhances Matrix
  Metalloproteinase-2 (MMP-2) activity to promote invasion. Created with BioRender.com'
