figure_title: ApoE allele-specific regulation of synaptic protein expression in forebrain
  after SCI
caption: '(A) Heatmap showing normalized gene expression changes associated with translation
  and synapse organization GO terms from pathway enrichment analysis performed on
  excitatory neurons SCI-RAGs depicted in Fig. 5D and 5E, and listed Supplemental
  Table S2.(B) Protein interaction network of the GO: synapse organization associated
  genes shown in A. Protein associations (edges) are color-coded based to the evidence
  source of their protein-protein association.(C) Photomicrographs of L5 from M1 brain
  cortex stained for Efnb2, Synpo, Tsc1, and Homer1 in green and NeuN in red, 42 days
  after SCI compared to age-matched naïve controls for respective genotypes. Scale
  bar, 100 μm.(D) Mean signal intensity of Efnb2 in L5 of M1 cortex for E2 naive (n
  = 8), E4 naive (n = 8), E2-SCI (n = 9) and E4-SCI (n = 9) mice.(E) Mean signal intensity
  of Synpo in L5 of M1 cortex for E2 naive (n = 7), E4 naive (n = 7), E2-SCI (n =
  7) and E4-SCI (n = 7) mice.(F) Mean signal intensity of Tsc1 in L5 of M1 cortex
  for E2 naive (n = 7), E4 naive (n = 8), E2-SCI (n = 8) and E4-SCI (n = 9) mice.(G)
  Mean signal intensity of Homer1 in L5 of M1 cortex for E2 naive (n = 6), E4 naive
  (n = 7), E2-SCI (n = 7) and E4-SCI (n = 7) mice.(H) Immunoblot analysis of selected
  top four candidates with total protein extracted from motor cortex and subcortical
  regions of respective genotype with actin as loading control.(I) Densitometry analysis
  of Tsc1 immunoblot.(J) Densitometry analysis of Efnb2 immunoblot.(K) Densitometry
  analysis of Homer1 immunoblot.(L) Densitometry analysis of Synpo_L immunoblot.(M)
  Densitometry analysis of Synpo_s immunoblot.Data shown as mean ± SEM. p values calculated
  by one-way ANOVA with Tukey’s multiple comparisons test for (D): F = 32.61, dF =
