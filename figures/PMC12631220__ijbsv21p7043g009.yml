figure_title: The combination of the two drugs was used to inhibit neuroendocrine
  tumor progression in a PI3K/AKT/mTOR pathway-dependent pathway.
caption: The combination of the two drugs was used to inhibit neuroendocrine tumor
  progression in a PI3K/AKT/mTOR pathway-dependent pathway. (A,B) Analysis of KEGG
  enrichment of different genes that were induced by CON in comparison with the combination
  of BON-1 or QGP-1. (C)Western blotting results of PI3K/AKT/mTOR signaling pathway
  proteins expression in BON-1 and QGP-1 cells 24 hours after treatment with PBS,
  Kaempferol, Sulfatinib, and the combination therapy. (D,E) Western blotting assay
  to evaluate the expression levels of genes associated with the PI3K/AKT/mTOR signaling
  pathway in BON-1 and QGP-1 cells. These cells had been transiently transformed with
  NC Vector, CALCA overexpression plasmid, and CALCA knockdown plasmid. (F) Western
  blotting to detect the expression of PI3K/AKT/mTOR signaling pathway related genes
  in BON-1 cells transfected with NC Vector, CALCA knockdown plasmid, NC co-drug group
  and CALCA knockdown plasmid co-drug group
