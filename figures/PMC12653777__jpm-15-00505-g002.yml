figure_title: Hepatic metabolism and excretion of tamoxifen.
caption: Hepatic metabolism and excretion of tamoxifen. Tamoxifen undergoes N-demethylation
  by CYP3A4/5 to form the major metabolite N-desmethyltamoxifen (NDM-TAM) and 4-hydroxylation
  by CYP2D6, CYP2C9, and CYP2C19 to produce the minor but highly active metabolite
  4-hydroxytamoxifen (4-OH-TAM). Further metabolism of these intermediates, particularly
  by CYP2D6, generates endoxifen, the most potent metabolite. Phase II metabolism,
  mediated by UDP-glucuronosyltransferases (UGTs) and sulfotransferases (SULTs, especially
  SULT1A1), converts these metabolites into soluble conjugates excreted via bile and
  urine. Single or multiple genetic variations, together with drug interactions in
  one or more pathways, may influence metabolite levels and potentially affect therapeutic
  response. Created in BioRender (https://BioRender.com/p64b205, accessed on 28 February
  2025)
article_title: Impact of Complex Genetic and Drug–Drug Interactions on Tamoxifen Metabolism
