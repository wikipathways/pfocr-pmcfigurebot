figure_title: NLRC5 high expression is associated with immune escape and T cell exhaustion
  pathways in ESCC.
caption: 'NLRC5 high expression is associated with immune escape and T cell exhaustion
  pathways in ESCC. (A,B) Violin plots showing Tumor Immune Dysfunction and Exclusion
  (TIDE) analysis in the TCGA cohort (A) and CancerCell cohort (B). Tumors with high
  NLRC5 expression exhibited higher T-cell dysfunction scores and immune escape-related
  signatures compared with the NLRC5-low group. (C) NLRC5 expression across four ESCC
  molecular subtypes in the CancerCell cohort. Tumors were classified into four subtypes
  as previously reported: CCA (cell cycle activation, n = 39), NRFA (NRF2 oncogenic
  activation, n = 38), IS (immune suppression, n = 30), and IM (immune modulation,
  n = 48). NLRC5 expression was significantly higher in the IS subtype compared with
  the IM subtype, suggesting a potential association between NLRC5 expression and
  an immunosuppressive tumor microenvironment. (D,E) Gene Set Enrichment Analysis
  (GSEA) in the TCGA (D) and CancerCell (E) cohorts, showing significant upregulation
  of T cell exhaustion pathways in the NLRC5 high expression group. (F) Venn diagram
  illustrating overlapping differentially expressed genes (DEGs) between NLRC5 high
  and low expression groups in the TCGA and CancerCell cohorts. (G) A protein–protein
  interaction (PPI) network constructed from the overlapping DEGs, highlighting the
  key gene interactions potentially driven by NLRC5 expression, with several immune-related
  genes showing strong connectivity. (H–J) Representative flow cytometry histograms
  showing the expression of exhaustion markers TIM-3 (H), LAG-3 (I), and PD-1 (J)
  in control (CTRL) and NLRC5 knockout (KO) primary human T cells following co-culture
  with tumor cells. The y-axis indicates normalized cell counts, and the x-axis represents
  mean fluorescence intensity (MFI). Data shown are representative of three independent
  biological replicates (n = 3) (ns, p > 0.05, * p < 0.05, *** p < 0.001, **** p <
  0.0001)'
