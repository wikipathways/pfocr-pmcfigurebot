figure_title: Investigation of intracellular ROS levels and the expression of proteins
  involved autophagy and apoptotic signaling pathways.
caption: Investigation of intracellular ROS levels and the expression of proteins
  involved autophagy and apoptotic signaling pathways. (A) Evaluation of intracellular
  ROS production in MDA-MB-231 cells treated with BKS-112, demonstrating a dose-dependent
  increase compared to both the control group and SAHA-treated cells. (B) Microscopic
  images of DCFDA staining used to assess ROS expressions in cells following BKS-112
  treatment. All images were captured at ×400 magnification, and scale bars represent
  20 μm. (C) Flow cytometry analysis showing the percentage of rhodamine 123 accumulation
  in cells treated with BKS-112 and SAHA. (D) Bar graph depicting the rhodamine 123
  accumulation ratio as a percentage relative to the control group. Statistical analysis
  is presented as mean ± standard deviation (*** p < 0.001). (E) Western blot analysis
  revealing the expression of proteins involved in the ROS and apoptosis-associated
  autophagy pathway, including mTOR, p-mTOR, AMPK, p-AMPK, ERK, p-ERK, p38, and JNK,
  with β-actin used as the loading control. (F) Western blot analysis showing the
  expression of proteins related to the apoptotic pathway in the context of ROS and
  autophagy, such as PI3K, p-PI3K, AKT, and p-AKT, with β-actin serving as the loading
  control
