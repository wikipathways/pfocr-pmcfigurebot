figure_title: The PPBP-ZNG1F-mitochondrial axis links psoriatic skin inflammation
  to vascular dysfunction and atherosclerosis
caption: In patients with psoriasis, adipose tissue–derived CD14+ macrophages in lesional
  skin produce pro-platelet basic protein (PPBP), which enters the circulation and
  signals through CXCR2 on coronary artery endothelial cells (ECs). This signaling
  suppresses the zinc finger protein ZNG1F, leading to mitochondrial stress and EC
  dysfunction. The resulting endothelial activation promotes vascular inflammation
  and contributes to atherosclerotic plaque development. Targeting this pathway using
  anti-PPBP antibodies or the mitochondrial antioxidant Mito-TEMPO mitigates mitochondrial
  dysfunction and may attenuate psoriasis-associated cardiovascular risk. Created
  in BioRender. Ward, N. (2025) https://BioRender.com/0aqw9l2
article_title: 'PPBP/CXCL7: A Novel Chemokine Linking Psoriasis to Atherosclerosis
  Through Endothelial Mitochondrial Dysfunction'
