figure_title: The EtOAc fraction induces neuronal dendritogenesis by activating PI3K/Akt
  and ERK 1/2 signaling pathways.
caption: 'The EtOAc fraction induces neuronal dendritogenesis by activating PI3K/Akt
  and ERK 1/2 signaling pathways. Neurons were seeded at a density of ~2 × 104 cells/well,
  in 24-well plates with 8 mm coverslips previously treated with poly-D-lysine. On
  day DIV6, neurons were treated with EtOAc fraction at a concentration of 0.3 μg
  mL−1 and the inhibitors. Inh.ERK: ERK inhibitor PD98059 (MEK1 Inhibitor), Inh.PI3K:
  PI3K pathway inhibitor LY294002 (PI3K inhibitor), 0.04% DMSO: vehicle control for
  the inhibitors, Control: untreated neurons, EtOAc + Inh: co-treatments of the EtOAc
  fraction 0.3 μg mL−1 with the inhibitors. Immunocytochemical analysis was performed
  by labeling the microtubule-associated protein 2 (MAP-2). Fluorescence images of
  MAP-2 labeling were obtained, and dendritic complexity was quantified by Sholl analysis.
  (A) Area under the curve (AUC), (B) Representative images of neurons from each treatment
  group are also shown, (C) Western blotting detection of activated proteins, ERK
  1/2 kinase activation. (D) Relative differences in the expression of phosphorylated
  protein p-ERK 1/2, (E) Detection of activated proteins by Western blot, activation
  of Akt 1/2 kinase, (F) Relative differences in the expression of phosphorylated
  protein p-Akt 1/2. Phosphorylated protein expressions were normalized to control
  (untreated neurons) and loading control (GAPDH). MW: protein molecular weight markers.
  n = 85, CI 95.00%, *** p < 0.0002, **** p < 0.0001 (Tukey’s test)'
