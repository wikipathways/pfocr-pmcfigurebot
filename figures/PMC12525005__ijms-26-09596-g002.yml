figure_title: TGF-β intracellular pathways.
caption: 'TGF-β intracellular pathways. Following release of TGF-β from its large
  latent complex, TGF-β links with its receptor, causing heterodimerization and activation
  of two main different pathways: (1) The canonical pathway is that in which the heterodimeric
  TGF-β receptor phosphorylates Smad2 and Smad3, which will form a complex with Smad4,
  allowing for nuclear translocation and inducing transcription of ECM molecules and
  other myofibroblast-activating molecules. (2) The non-canonical pathway is that
  in which the activated TGF-β receptor induces phosphorylation of tyrosine residues
  that are able of recruiting Grb2/Sos to activate Erk through Ras, Raf, and MAPK
  cascades. Intranuclearly, Erk regulates target gene transcription in conjunction
  with Smads, resulting in increased ECM production. Another very relevant non-canonical
  pathway is activated by the TGF-β receptor phosphorylation of Src and stimulates
  a fibrotic response mediated by C-Abl/Smad pathways'
