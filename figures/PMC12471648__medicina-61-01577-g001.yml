figure_title: Antitumor mechanism of metformin.
caption: Antitumor mechanism of metformin. Metformin exerts indirect effects by lowering
  insulin and suppressing the IGFR-TK–PI3K–AKT–mTOR pathway. Directly, it activates
  LKB1–AMPK, inhibits TSC2, mTOR, HIF-α, and Cyclin D, and enhances P53, leading to
  reduced cell proliferation, angiogenesis, metastasis, and anti-apoptotic signaling
