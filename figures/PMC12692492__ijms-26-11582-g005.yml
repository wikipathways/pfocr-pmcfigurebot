figure_title: Screening and validation of anti-metastatic drugs.
caption: 'Screening and validation of anti-metastatic drugs. (A) Schematic diagram
  of the metastasis-related drug screening model, illustrating the overall workflow
  from input data to drug screening model construction and subsequent drug scoring.
  (B) Network diagram showing the top 10 ranked drugs and their corresponding targets
  in each cancer type, highlighting both shared and cancer-specific drug-target relationships.
  (C) Heatmap of the top 10 candidate drugs across cancers, showing Drug Score (color
  intensity), regulatory effect on metastasis (red: inhibition; blue: promotion),
  and overall drug ranking; Fostamatinib ranks highest in nine cancers, indicating
  broad anti-metastatic potential. (D) Bar plots showing KEGG pathway enrichment of
  targets for Fostamatinib, Mesalazine, Tamoxifen, and Minocycline, highlighting significant
  enrichment in metastasis-related pathways. (E) Boxplots comparing MPS between drug-treated
  (Drug) and control (Ctrl) groups in HNSCC and PRAD, demonstrating that Fostamatinib
  treatment significantly reduces MPS, with statistical significance indicated (****
  p < 0.0001)'
