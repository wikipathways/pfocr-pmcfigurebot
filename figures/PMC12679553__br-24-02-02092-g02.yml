figure_title: Effects of ALOX15 on the FGFR2/PI3K/AKT signaling pathway in HCAECs.
caption: Effects of ALOX15 on the FGFR2/PI3K/AKT signaling pathway in HCAECs. (A)
  Co-immunoprecipitation assays of ALOX15 and FGFR2 in HCAECs. (B) The mRNA expression
  of ALOX15 and FGFR2 in HCAECs after transfection with OE-ALOX15/OE-NC or siRNA ALOX15/siRNA
  NC was detected by reverse transcription-quantitative PCR. ***P<0.001. (C) The protein
  levels of ALOX15, FGFR2, PI3K, p-PI3K, AKT and p-AKT in HCAECs after transfection
  with OE-ALOX15/OE-NC or siRNA ALOX15/siRNA NC were determined by western blotting.
  ***P<0.001. ALOX15, 12/15-lipoxygenase; FGFR2, fibroblast growth factor receptor
  2; HCAECs, human primary coronary artery endothelial cells; OE, overexpression;
  NC, negative control; siRNA, small interfering RNA; p-, phosphorylated; NS, not
  significant
