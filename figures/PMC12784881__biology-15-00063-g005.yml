figure_title: KEGG pathway enrichment of metabolites produced by W.
caption: KEGG pathway enrichment of metabolites produced by W. viridescens Wv2365.
  Bubble size represents the number of identified metabolites enriched in each pathway,
  and color coded heatmap indicates the enrichment p value. Colors are mapped to −log10
  (p) values for visualization. Gene ratio refers to the proportion of identified
  metabolites mapped to a given pathway relative to the total number of annotated
  metabolites in that pathway, expressed as a percentage. The p values shown are raw
  p values derived from Fisher’s exact test; the corresponding adjusted p values (FDR)
  controlling for multiple testing are provided in Supplementary Table S6
