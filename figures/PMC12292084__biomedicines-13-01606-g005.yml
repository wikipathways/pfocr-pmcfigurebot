figure_title: Cell—cell communications in early and late stage of LUAD.
caption: Cell—cell communications in early and late stage of LUAD. (a) Differential
  cell—cell communication number (left) and strength (right). Blue arrows represent
  a decrease in the number or strength of interactions in the late stage of LUAD compared
  with the early stage of LUAD, while red arrows represent an increase in interactions
  in the late stage of LUAD. (b) Differential cell—cell communication number (left)
  and strength (right). (c) Significant signaling pathways in the early and late stages
  of LUAD (p < 0.05). The active pathways in the early stage are represented by red
  bars, while those in the late stages are shown in purple bars. (d) Contribution
  of ligand—receptor pairs in the ncWNT pathway (upper) and PTN pathway (bottom).
  (e) Significant ligand—receptor interactions (p < 0.01), represented by dots, contribute
  to cellular communication in late—stage LUAD
