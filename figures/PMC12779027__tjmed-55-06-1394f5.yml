figure_title: Results of GO and pathway analysis.
caption: Results of GO and pathway analysis. The top 10 enriched GO terms are presented
  for (a) upregulated genes and (b) downregulated genes in response to relcovaptan,
  as well as (c) the top 10 differentially regulated pathways after relcovaptan treatment.
  Correspondingly, the top 10 enriched GO terms are shown for (d) upregulated genes
  and (e) downregulated genes in response to tolvaptan, as well as (f) the top 10
  differentially regulated pathways after tolvaptan treatment. Blue bars indicate
  biological processes, and orange bars indicate molecular functions. The degree of
  enrichment of each GO term and pathway is indicated by −log(p-value) (x-axis)
