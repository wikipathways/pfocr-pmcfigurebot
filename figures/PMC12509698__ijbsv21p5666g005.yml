figure_title: Key factors contribute to the immunotherapy resistance in MASLD-HCC.
caption: 'Key factors contribute to the immunotherapy resistance in MASLD-HCC. RNA
  m6A reader protein YTHDF1 is increased, which recruits and activates MDSCs to cause
  cytotoxic CD8+ T cells dysfunction. CXCR2+ neutrophils secrete pro-tumorigenic cytokines
  and immunosuppressive molecules, inhibiting the function of CD8+ T cells. The formation
  of NETs recruits naïve CD4+ T cells and drives their differentiation into Tregs
  in a TLR4-dependent manner, establishing an immunosuppressive microenvironment.
  Enriched SCFAs increase Tregs and attenuate CD8+ T cells response, resulting in
  an immunosuppressed response. IL-21R-STAT1-c-Jun/c-Fos-IgA regulatory pathway is
  also activated, which leads to the induction of immunosuppressive IgA+ cells. These
  cells suppress CD8+ T cells by upregulating the expression of PD-L1 on the cell
  surface and producing the immunosuppressive cytokine IL-10, impairing tumor surveillance
  function. Accumulated CTNNB1 mutations elevate TNFRSF19 levels, suppressing the
  secretion of SASP-like cytokines, such as IL-6 and CXCL8, inhibiting the effect
  of CD8+ T cells. In addition, impaired motility and mitochondrial fitness in CD8+
  T cells are observed, along with a low infiltration rate. CXCR6+PD-1+CD8+ T cells
  are also increased, which causes hepatocyte apoptosis through Fas/FasL interaction,
  generating an adverse effect in MASLD-HCC immunotherapy. Abbreviations: CXCR, C-X-C
  motif chemokine receptor; CXCL8, C-X-C motif chemokine ligand 8; CTNNB1, catenin
  beta 1; Fas, factor associated with suicide; FasL, Fas ligand; HCC, hepatocellular
  carcinoma; ICIs, immune checkpoint inhibitors; IL-6, interleukin 6; IL-10, interleukin
  10; PD-1, programmed death receptor 1; PD-L1, programmed death ligand 1; m6A, N6-methyladenosine;
  MDSCs, myeloid-derived suppressor cells; MASLD-HCC, metabolic dysfunction associated
  steatotic liver disease-related hepatocellular carcinoma; NETs, neutrophil extracellular
  traps; SASP, senescence-associated secretory phenotype; SCFAs, short-chain fatty
  acids; TNFRSF19, tumor necrosis factor receptor superfamily 19; Tregs, regulatory
  T cells; YTHDF1, YTH N6-methyladenosine RNA binding protein F1'
