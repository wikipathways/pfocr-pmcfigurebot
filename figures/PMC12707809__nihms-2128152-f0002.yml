caption: 'Conceptual diagram of estuarine mercury (Hg) cycling processes considered
  in the model. Each arrow color represents a distinct pathway in the Hg cycling process:
  orange arrows indicate external inputs into the water column, purple arrows show
  outputs from the water column, light green arrows represent methylation, dark green
  arrows depict demethylation, and gray arrow illustrate redox reactions among the
  major Hg species (divalent: HgII, elemental: Hg0, monomethylmercury: MMHg, and dimethylmercury:
  DMHg). Brown arrows represent the bidirectional net tidal exchange (tidal inflow
  and ocean export), while yellow arrows highlight physical forcing and estuarine
  mixing mechanisms'
