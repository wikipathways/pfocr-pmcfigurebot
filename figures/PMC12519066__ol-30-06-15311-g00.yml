figure_title: Role of β-catenin in the canonical Wnt signaling pathway.
caption: Role of β-catenin in the canonical Wnt signaling pathway. In the absence
  of the Wnt ligand, cytosolic β-catenin binds to the destruction complex, leading
  to its degradation. During this state, TCF/LEF transcription factors are bound to
  co-repressor proteins and cannot initiate transcription. When Wnt ligands bind to
  Frizzled receptors and LRP5/6, Dvl is activated, which inactivates the destruction
  complex. This inhibits β-catenin phosphorylation and degradation, allowing cytoplasmic
  β-catenin to accumulate and translocate into the nucleus. There, it can bind TCF/LEF
  transcription factors, thereby activating the transcription of Wnt target genes
  and promoting cell proliferation and epithelial-mesenchymal transition. TCF/LEF,
  T-cell factor/lymphoid enhancer factor; LRP5/6, low-density lipoprotein receptor-related
  protein 5/6; Dvl, Dishevelled; co-repressor pro, co-repressor protein; EMT, epithelial-mesenchymal
  transition; CK1, casein kinase-1; APC, adenomatous polyposis coli; βTrCP, β-transducin
  repeat-containing protein; DKK1, Dickkopf-1
