figure_title: Nascent immunogenic sarcoma cells acutely undergoing T cell immunoediting
  have enrichment of interferon γ (IFNγ) response/PD-L1 (Cd274) and elevated proliferation
caption: (A) Uniform manifold approximation and projection (UMAP) plots of unsupervised
  clustering of scRNA-seq data from dissociated and sorted Tomato+ cells (pregated
  on live singlet CD45− CD31− TER119−) in plots stratified by Cluster IDs, 0–7. (B-D)
  Unbiased pathway enrichment using the MSigDB2020 signature on the Enrichr tool to
  define transcriptional signatures overrepresented (B) globally (pseudo-bulk) that
  are driven by T cells, (C) specifically in muscle satellite cells (Cav1+) from KP
  mice that are driven by T cells, and (D) specifically in muscle satellite cells
  from KP mice relative to P only mice. All hits displayed show an adjusted P-value
  of >0.05. (E) Gene expression heatmaps (color displaying normalized expression z-score)
  of markers to define major cluster labels seen in (A) including Ptprc (CD45; immune
  cells), Tnni2 (troponin I2; mature myofibers), and Cav1 (caveolin 1; satellite cells).
  (F) Gene expression heatmaps of proliferation markers, Mki67, Pclaf, and Cenpa.
  (G) Gene expression heatmaps of IFNγ-responsive genes that modulate T cell interactions,
  Cd274 (PD-L1; ligand for the T cell checkpoint receptor, PD-1), H2-D1 (MHC Class
  I complex gene), and B2m (MHC Class I complex gene). (H) Violin plots of Cd274/PD-L1,
  Mki67, and H2-D1 stratified by Cluster ID. (I) Proportionate representation of cells
  from each sample group within cluster 2 (KI67+), cluster 3 (Cd274/PD-L1+), and cluster
  4 (Tnni2+). (J) Pseudobulk expression analysis of MHC Class I complex genes, H2-D1
  and B2m, of cells from KP mice with and without T cells. P value determined by Wilcoxon
  test. (K) quantitation of total Tom+ cells, PD-L1+ cells, and Ki67+ cells (pregated
  on live singlet CD31−CD45−TER119−tdTomato+ cells) at day 7 post initiation ± the
  GFP-GP33/66 neoantigens (Lenti-Flpo-mCl-GP33/66 vs. Lenti-Flpo) and ± T cells (Rag+
  vs. Rag KO). P value determined by Mann-Whitney test. Horizontal line represents
  mean values and individual dots represent biological replicates.See also Figures
  S8–S10
article_title: Distinct T cell functions enable efficient immunoediting and prevent
  tumor emergence in developing sarcomas
