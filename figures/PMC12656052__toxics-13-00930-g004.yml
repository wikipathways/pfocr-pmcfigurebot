caption: Gene Ontology (GO) pathway diagram of Ni treatment at different concentrations.
  (a) GO enrichment analysis of DEGs for 8 μg/L of Ni2+ exposure group. (b) GO enrichment
  analysis of DEGs for 0.8 μg/L of Ni2+ exposure group. In Figures a and b, only the
  top 15 GO terms for each of the three major categories—BP, CC, and MF (if there
  are fewer than 15 GO terms, all are displayed)—are shown. BP, biological process;
  CC, cellular component; MF, molecular function. (c) Multi-combination GO enrichment
  and scatter point diagram; only the top 10 GO terms (if there are fewer than 10
  GO terms, all are displayed) are shown. The abscissa is the comparative combination;
  the ordinate is the enrichment pathway; the size of the point represents the number
  of differential genes enriched in the pathway; the larger the point, the more genes
  enriched in the pathway; the color of the point represents the significance value
  of enrichment for the pathway; the color of the point represents the significant
  value of enrichment for the pathway; and the redder the color of the point, the
