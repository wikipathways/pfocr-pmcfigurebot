figure_title: DEGs from pathway analyses of key Venn regions and candidate DEGs identify
  potential transcriptomic drivers of pathology exacerbation
caption: 'A-I) Specific DEGs from mRNA sequencing of LV tissue (n = 5 per sex, per
  group) in normalized counts that were significantly enriched in pathway analysis
  of Figure 7. A-B) Specific DEGs from pathways associated with extracellular matrix/fibrosis/collagen:
  Connective tissue growth factor (CTGF) (Ccn2), and Periostin (Postn). C-E) Specific
  DEGs from pathways associated with heart contraction/function and ion transport:
  potassium channels (Kcnd2), subunit of a voltage-gated sodium channel (Scn10), and
  corticotropin-releasing hormone receptor 2 (Crhr2). F-G) Specific DEGs from pathways
  associated with glycosylated proteins: β-1A adrenergic receptor for catecholamine
  binding (Adra1b), and hyperpolarization-activated cyclic nucleotide-gated potassium
  channel 4 (Hcn4). D-I) Specific DEGs associated with calcium signaling: sarcoplasmic/endoplasmic
  reticulum Ca2+-ATPase 2a (SERCA2a) (Atp2a2), and stromal interaction molecule 1
  (Stim1). Statistical significance was based on Wald test (A-I) (= p < 0.05, + q
  < 0.1, and ++ q < 0.05). All calculated and analysis data are mean ± S.E.M'
