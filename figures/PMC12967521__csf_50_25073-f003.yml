figure_title: FAK inactivation as a downstream event of the ExStx4-triggered signaling
  pathway(A) The relative ratio of phosphorylated FAK (pFAK) to total FAK (t-FAK)
  in mESCs cultured with or without stemness factors.
caption: 'FAK inactivation as a downstream event of the ExStx4-triggered signaling
  pathway(A) The relative ratio of phosphorylated FAK (pFAK) to total FAK (t-FAK)
  in mESCs cultured with or without stemness factors. Left, Representative Western
  blot images. Right, Quantification. n = 3, *: p<0.05. FAK phosphorylation decreased
  upon removal of stemness factors. (B) Upper, Representative western blot image of
  pFAK and t-FAK in mESCs-ExStx4 cultured in 2i/LIF medium, with or without FAK activator
  ZINC40099027 (FAK act.). Lower, Quantification of relative mRNA expression of Nanog,
  T (brachyury), and CDH3 (P-cadherin). n = 3, **: p<0.01, ***: p<0.001. (C, D) Upper,
  Amount of pFAK and t-FAK in mESCs cultured in 2i/LIF medium, with or without FAK
  inhibitor VS4718 (FAK inh.) (C), and in LIF-only medium with or without FAK activator
  ZINC40099027 (FAK act.) (D). Middle, Morphology of mESCs. Bars, 100 μm. Lower, the
  mRNA expression of Nanog, T (brachyury), and CDH3 (P-cadherin). n = 3, *: p<0.05,
  ***: p<0.001'
