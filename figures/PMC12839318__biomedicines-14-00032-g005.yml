figure_title: CDKN2B regulates TGF/Smad and SRF/MYOCD signaling pathways and inhibits
  the transformation of VSMCs from contractile to secretory phenotype.
caption: CDKN2B regulates TGF/Smad and SRF/MYOCD signaling pathways and inhibits the
  transformation of VSMCs from contractile to secretory phenotype. (a) qRT-PCR quantitative
  analysis of phenotype transformation related regulatory genes of urethral corpus
  spongiosum smooth muscle cells screened after lentivirus transfection; wherein TGF-β1,
  Smad2, Smad3, SRF and MYOCD were significantly different. But there was no significant
  difference between Foxo4 and KLF4 genes. (b) Western blot results of TGF/Smad pathway
  related to the phenotypic switching of urethral corpus spongiosum smooth muscle
  cells after lentiviral transfection. The expression of TGF/Smad pathway was down
  regulated after CDKN2B ablation, and increased after CDKN2B over-expressed. (c)
  Western blot results of CDKN2B related to the connection between CDKN2B and TGF-β1.
  The expression of CDKN2B was upregulated after TGF-β1 induced. (hypospadias group
  vs. hypospadias + TGF-β1 group p = 0.0451). (d) the volcano map of differentially
  expressed genes of samples. Red dots are significantly upregulated genes, and blue
  dots are significantly downregulated genes. KEGG (e) and GO (f) and Reactome (g)
  enrichment analyses of the Control group of VSMCs and the ko-CDKN2B group. (h) The
  phenotype switch of urethral corpus spongiosum VSMCs was potentially mediated by
  the CDKN2B-TGF/SMAD signal pathway concluded in this study. Values are the mean
  ± standard deviation. The asterisks indicate statistical significance (* p < 0.05,
  ** p < 0.01, *** p < 0.001, and **** p < 0.0001)
