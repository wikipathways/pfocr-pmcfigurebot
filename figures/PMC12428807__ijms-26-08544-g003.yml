figure_title: The interplay between oxidative stress, lipid intermediates, inflammation,
  and insulin resistance in obese adipocytes.
caption: The interplay between oxidative stress, lipid intermediates, inflammation,
  and insulin resistance in obese adipocytes. In hypertrophic adipocytes, chronic
  excess of SFAs and glucose induces mitochondrial dysfunction, NOX4 overactivation,
  and ERE, collectively promoting ROS production. ROS trigger inflammatory signaling
  pathways, including NF-κB, MAPKs (ERK, JNK, p38), and NLRP3 inflammasome, leading
  to the increased expression of pro-inflammatory cytokines (IL-1β, IL-6, TNF-α) and
  chemokines (MCP-1) and impaired insulin signaling through IRS-1 inhibition. These
  processes contribute to low-grade chronic inflammation and insulin resistance. Additionally,
  alterations in adipocyte lipid composition, including triglyceride accumulation
  and increased saturation of membrane phospholipids, enhance lipid peroxidation,
  generating intermediates such as 4-HNE that activate NF-κB, reduce adiponectin secretion,
  and stimulate HSL, increasing fatty acid release, which further amplifies inflammation.
  TNF-α and palmitic acid promote ceramide accumulation via sphingomyelinase activation
  and TLR4-NF-κB signaling, respectively. Ceramides worsen mitochondrial dysfunction,
  impair lipolysis, and inhibit insulin signaling via PKCζ. Meanwhile, antioxidant
  plasmalogens are depleted as oxidative stress overwhelms protective mechanisms,
  reinforcing metabolic and inflammatory dysfunction. Arrows with a pointed tip indicate
  activation or induction of the target pathway or molecule, whereas arrows with a
  flat end indicate inhibition or suppression of the target. 4-HNE, 4-hydroxynonenal;
  AKT, protein kinase B; CD36, cluster of differentiation 36; ERK, extracellular signal-regulated
  kinase; ERS, endoplasmic reticulum stress; GLUT4, glucose transporter type 4; HSL,
  hormone-sensitive lipase; IL, interleukin; IR, insulin receptor; IRS-1, insulin
  receptor substrate-1; JNK, c-Jun N-terminal kinase; LPS, lipopolysaccharide; MAPK,
  mitogen-activated protein kinase; MCP-1, monocyte chemoattractant protein-1; NF-κB,
  nuclear factor kappa B; NOX4, NADPH oxidase 4; NLRP3, nucleotide-binding domain,
  leucine-rich-containing family, pyrin domain-containing-3; PC-PUFA, polyunsaturated
  phosphatidylcholine; PI3K, phosphoinositide 3-kinase; PKCζ, protein kinase C zeta;
  ROS, reactive oxygen species; SFAs, saturated fatty acids; Smase, sphingomyelinase;
  TG-PUFA, polyunsaturated triglyceride; TLR4, Toll-like receptor 4; TNF-α, tumor
  necrosis factor-alpha
