figure_title: Transcriptomic analysis reveals significant changes in host gene expression
  following AIV infection.
caption: 'Transcriptomic analysis reveals significant changes in host gene expression
  following AIV infection. (a) Volcano plot showing the differentially expressed genes
  (DEGs: |log2 fold change| ≥ 2, p ≤ 0.05) in A549 cells 8 h post-infection with highly
  pathogenic avian influenza virus (AIV) compared to controls. Red dots indicate significantly
  upregulated genes, blue dots indicate significantly downregulated genes, and gray
  dots indicate genes with no significant change. (b) The heatmap of DEG hierarchical
  clustering. A representative gene forms each row, and a separate sample forms each
  column. After the normalization, there is red, meaning that it is highly expressed,
  and blue, meaning that it is low. (c) GO enrichment analysis of upregulated DEGs
  with BP, CC or MF groups. The sizes of bars represent the number of genes that are
  enriched in a given term. (d) KEGG pathway enrichment analysis of DEGs that are
  upregulated. The number of genes that are considered in every pathway is known as
  the dot size; color is the statistical significance of enrichment. (e) Those are
  downregulated DEGs in GO analysis. (f) Downregulated DEGs in KEGG pathway analysis'
