figure_title: Myt1 mediates the mitotic Chk1-CDK1 pathway
caption: (A) Western blot quantification of total Myt1 abundance in nocodazole-arrested
  U2OS cells that were treated with DMSO or Chk1i (CHIR-124) for 1 h.(B) p-Myt1 S83
  abundance over total Myt1 levels in nocodazole-arrested U2OS cells treated as in
  (A).(C) Western blot quantification of p-CDK1 Y15 level over total CDK1 level in
  nocodazole-arrested U2OS cells treated with DMSO, Chk1i (CHIR-124), or combination
  of Chk1i and Wee1i (Wee1 inhibitor II) for 1 h.(D) Western blot quantification of
  p-CDK1 Y15 abundance over total CDK1 level in nocodazole-arrested U2OS cells treated
  with DMSO, Chk1i (CHIR-124), or Chk1i and Myt1i (RP-6306) for 1 h.(E) Western blot
  quantification of p-CDK1 Y15 level over total CDK1 level in U2OS cells treated with
  Myt1 siRNA for 48 h and subsequently arrested in nocodazole prior to isolation and
  treatment for 1 h with DMSO or Chk1i (CHIR-124).(F) Western blot quantification
  of p-CDK1 Y15 level over total CDK1 level in an in vitro kinase assay performed
  with untagged Chk1 (Chk1), Myc-DDK Myt1 (Myt1), and His-cyclinB1-CDK1 (CDK1). Myt1
  was pre-incubated with Chk1 or heat-inactivated Chk1 (HI Chk1) for 1 h prior to
  the addition of heat-inactivated CDK1 for 20 min. For all western blot quantifications
  (A-F), the fold change for each replicate was normalized to the DMSO-treated control,
  n = 2–3 biological replicates, shown by data points on each graph. Error bars in
  all panels represent SD. *p ≤ 0.05 by Student’s t test (A-C) or one-way ANOVA with
  Tukey’s correction (D-F) of replicate averages. Scale bars = 10 μm. See also Figure
  S2
