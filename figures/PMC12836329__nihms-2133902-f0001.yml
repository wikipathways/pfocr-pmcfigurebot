caption: Illustration of overall experimental materials and methods. Human bone marrow
  stromal cells stably transfected with telomerase reverse transcriptase (hBMSCs-TERT)
  were used to induce osteogenic differentiation. FGF2 was added at various concentrations
  and for various durations during osteogenic differentiation. Results were then analyzed
  by alizarin red staining for detecting mineralization, RT-qPCR for detecting relevant
  gene expression, immunofluorescent staining for protein detection, and bioinformatic
  analyses for predicting pathway and protein interactions
