figure_title: Gut-kidney axis and its impact on kidney health.
caption: Gut-kidney axis and its impact on kidney health. The gut-kidney axis elucidates
  the relationship between the composition of the gut microbiota and kidney health.
  Kidney damage, including fibrosis and glomerular sclerosis, can lead to an imbalance
  in the gut microbiota, thereby affecting the permeability of the intestinal barrier.
  Concurrently, dietary intake and medication use also contribute to microbial dysbiosis.
  A disturbance in microbiota composition has been demonstrated to result in heightened
  levels of uremic toxins, including IS, PCS, and TMAO, along with a decline in LPS
  and beneficial short-chain fatty acids. Furthermore, compromised intestinal integrity
  facilitates the entry of uremic toxins into the systemic circulation. These harmful
  metabolites travel through the bloodstream to the kidneys, activating the corresponding
  pathways and triggering inflammation and immune responses, leading to kidney damage.
  Therapies such as microbial therapeutics, fecal microbiota transplantation, and
  natural products have been shown to influence kidney health by improving the imbalance
  in gut microbiota
