figure_title: Bioinformatics analysis of ESRP1 expression and function.
caption: 'Bioinformatics analysis of ESRP1 expression and function. (A) ESRP1 and
  ESRP2 expression levels in BA patients (n = 171) compared with normal controls (n
  = 6) from the GSE122340 dataset. BA patients were stratified based on ESRP1 expression
  into three groups: ESRP1high, ESRP1medium and ESRP1low (comparable to normal). (B)
  GO analysis of differentially expressed genes (DEGs) in the ESRP1high group with
  respect to normal subjects. The top enriched categories for (i) Biological Process
  (BP), (ii) Cellular Component (CC), (iii) Molecular Function (MF), and (iv) KEGG
  pathway analysis are shown'
