caption: Summary of the main difference in human fucosylation pathways and patterns
  compared to animal models. GMDS catalyzes the rate-limiting step reaction step for
  de novo synthesis pathway for GDP-fucose endogenous production in cells, followed
  by GFUS/FX. The salvage GDP-fucose synthesis pathway is initiated by dietary L-fucose
  conversion to Fucose 1-phosphate and then to GDP-fucose by FPGT. Salvage pathway
  GDP-fucose synthesis enzymes have not been identified in invertebrate animal models
  such as fruit flies and roundworms
