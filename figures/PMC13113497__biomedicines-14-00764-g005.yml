figure_title: Integrated neuro-metabolic model of the bidirectional relationship between
  epilepsy, obesity, and metabolic syndrome.
caption: Integrated neuro-metabolic model of the bidirectional relationship between
  epilepsy, obesity, and metabolic syndrome. The figure illustrates six interconnected
  pathological domains—epilepsy, neuroinflammation, insulin resistance, intestinal
  dysbiosis/gut-brain axis disruption, obesity, and autonomic dysfunction—converging
  on a central hub of oxidative stress and mitochondrial dysfunction. Bidirectional
  arrows denote mutually reinforcing pathogenic relationships. Epilepsy drives microglial
  and astrocytic activation, releasing pro-inflammatory cytokines and compromising
  BBB integrity, which heightens neuronal excitability via glutamatergic upregulation
  and GABAergic suppression. Obesity promotes fat accumulation, adipokine and free
  fatty acid (FFA) dysregulation, and hypothalamic dysfunction, while peripheral insulin
  resistance induces lipolysis and lipotoxicity. Gut dysbiosis reduces short-chain
  fatty acid (SCFA) production, increases intestinal permeability, activates TLR4
  signaling, and suppresses BDNF expression. Chronic activation of the hypothalamic-pituitary-adrenal
  (HPA) axis via the vagus nerve sustains cortisol and cytokine elevation, amplifying
  autonomic dysfunction. Indoleamine 2,3-dioxygenase (IDO) activation redirects tryptophan
  metabolism toward quinolinic and kynurenic acid, further modulating neuronal excitability.
  The ketogenic diet is depicted as a therapeutic modulator of the gut-brain axis.
  Collectively, these pathways establish a self-perpetuating neuro-metabolic continuum
  in which neurological and systemic metabolic dysfunction are mechanistically inseparable.
