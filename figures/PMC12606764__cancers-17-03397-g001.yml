figure_title: Current model of oncogenic signaling in CALR-mutant clones.
caption: 'Current model of oncogenic signaling in CALR-mutant clones. CALRwt contributes
  to protein folding, Ca2+ homeostasis in ER, and PLC-mediated MHC-I assembly. TPO-dependent
  activation of MPL drives ligand-mediated JAK/STAT signaling that support proliferation,
  survival, differentiation and migration. CALRwt assists proper MPL folding while
  remaining ER-retained. CALRmut lacks the C-terminal KDEL retention signal, enabling
  its dislocation into the Golgi and secretory pathway. The mutant C-terminus, generated
  by a frameshift, induces conformational changes in the N-domain, increasing accessibility
  to the lectin-binding pocket and facilitating aberrant interactions with immature
  N-glycans and the D1 domain of MPL. This interaction occurs in the ER and Golgi
  and allows the CALRmut-MPL complex to traffic to the cell surface, where CALRmut
  acts as a cytokine, inducing ligand-independent MPL dimerization and constitutive
  JAK/STAT activation. Additional consequences include abnormal UPR activation, disrupted
  Ca2+ homeostasis, and immune escape due to defective MHC-I assembly. Created in
  BioRender. Costa, A. (2025) https://BioRender.com/6cdrn75. Abbreviations: CALR,
  calreticulin; ER, endoplasmic reticulum; MHC-I, major histocompatibility complex
  class I; MPN, myeloproliferative neoplasm; PLC, peptide-loading complex; sTFR1,
  soluble transferrin receptor 1; TPO, thrombopoietin; UPR, unfolded protein response'
