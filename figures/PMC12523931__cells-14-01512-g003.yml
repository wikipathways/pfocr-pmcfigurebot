figure_title: Functional enrichment analyses of differentially expressed proteins.
caption: 'Functional enrichment analyses of differentially expressed proteins. (A–E)
  DEPs in the control and terahertz radiation groups were analyzed using Gene Ontology
  (GO) enrichment analysis. In the DAVID database, these DEPs were employed for functional
  annotation clustering. The number of enriched proteins was used to reorder biological
  processes, cellular components, and molecular functions after annotation clusters
  with the same “cellular component” were combined. (A) ribosomes, (B) mitochondria,
  (C) intermediates of the golgi apparatus, (D) cytoskeleton, and (E) chromatin; (F,G)
  Disease enrichment and Kyoto Encyclopedia of Genes and Genomes (KEGG) analyses for
  the DEPs were performed using the DAVID database (https://davidbioinformatics.nih.gov/,
  access Date: 2 June 2025); The enrichment scores for the top 5 disease annotation
  clusters are as follows: 2.04 (red), 1.94 (orange), 0.54 (green), 0.22 (cyan) and
  0.01 (purple). The enrichment scores for the two signal pathway annotation clusters
  are: 5.39 (blue) and 0.62 (green). The y-axis shows the GO, KEGG and Disease functional
  categories, while the x-axis shows the number of DEPs corresponding to each function'
