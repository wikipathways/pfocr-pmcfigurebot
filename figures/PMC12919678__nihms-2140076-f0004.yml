caption: 'Characterization of key markers of OS progression and invasion across four
  scaffolds in 3D and in vivo.Gene expression was measured via qRT-PCR on day 7 post-encapsulation
  for the following genes: (A-D) cancer stem cell (CSC) markers Nanog, SOX2, OCT4,
  and CD133, respectively; (E-H) EMT transcription factors Snail, Slug, TWIST1, and
  ZEB1, respectively; (I-L) PI3K/Akt pathway members PIK3CA, AKT1, mTOR, and SGK1,
  respectively. All groups are n = 3. Data are presented as mean ± SD, n ≥ 3. All
  statistics are one-way ordinary ANOVA with Tukey’s multiple comparisons test: *p
  < 0.05; **p < 0.01; ***p < 0.001; ****p < 0.0001'
