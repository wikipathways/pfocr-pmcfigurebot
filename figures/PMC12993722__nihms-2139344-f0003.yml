figure_title: Disruption of CoA biosynthesis pathway does not enhance ferroptosis
  sensitivity in PDAC Cells
caption: '(A) Schematic illustration of key enzymes and metabolites involved in the
  CoA biosynthesis pathway.(B-C) Flow cytometry analysis of the effects of 100 μM
  CoA supplementation or 100 μM 4′-PPT supplementation on cystine deprivation-induced
  ferroptosis in PANC-1 (16 hrs) and MiaPaCa-2 (18 hrs) transfected with control siRNA
  or COASY siRNA.(D) REMSA analysis of IRP–IRE binding activity in cystine-deprived
  MiaPaCa-2 cells following COASY knockdown with or without CoA supplementation.(E-F)
  Effects of PANK2 knockdown on TFRC expression and ferroptosis in cystine-deprived
  cells with or without 100 μM CoA or pantethine (Pan) supplementation, as determined
  by immunoblotting and flow cytometry with PI staining.(G) Flow cytometry analysis
  of cystine deprivation-induced ferroptosis in MiaPaCa-2 cells following PPCS knockdown,
  using PI staining.(H) REMSA analysis of IRP–IRE binding activity with siRNA-mediated
  knockdown of PANK2, PPCS, or COASY under basal or cystine-deprived conditions.For
  B-C, E-G significance was determined one way ANOVA followed by Dunnett’s multiple
  comparison test. ns = not significant: p>0.05; *, p ≤0.05; **, p ≤0.01; ***, p ≤0.001;
  ****, p ≤0.0001'
