figure_title: Estrogen (17β-estradiol, E2) provides comprehensive protection for the
  liver.
caption: 'Estrogen (17β-estradiol, E2) provides comprehensive protection for the liver.
  This diagram illustrates the main ways in which estradiol (ER) counteracts the three
  stages of fatty liver disease. Anti-steatotic effects: ERα/ERβ signaling suppresses
  the lipogenic program (↓ SREBP-1c, FAS, ACC), enhances fatty acid oxidation and
  mitochondrial biogenesis (↑ PPARα, PGC-1α, CPT-1, AMPK), and promotes VLDL export
  (↑ MTTP, apoB), collectively reducing triglyceride accumulation. Anti-inflammatory
  effects: Estradiol reduces oxidative stress (Nrf2-driven induction of SOD, CAT,
  GPx), inhibits NF-κB, AP-1, TLR4, and inflammasome pathways, decreases Kupffer cell/neutrophil
  recruitment, and lowers pro-inflammatory cytokines (TNF-α, IL-6, IL-1β), preventing
  progression from simple steatosis to MASH. Anti-fibrotic effects: Direct ER-mediated
  inhibition of hepatic stellate cell activation (↓ α-SMA, TGF-β1, p-Smad2/3, CTGF),
  re-balancing extracellular-matrix turnover (↑ MMP-1/9, ↓ TIMP-1), and limiting collagen
  I/III deposition. Overall, estradiol slows or reverses hepatic steatosis, inflammation,
  and fibrosis, providing a basis for sex differences and estrogen-based treatments
  in MASLD/MASH. Abbreviations used: α-SMA, α-smooth muscle actin; ERα/β, estrogen
  receptor α/β; ACC, acetyl-CoA carboxylase; AMPK, AMP-activated protein kinase; apoB,
  apolipoprotein B; CAT, catalase; CPT-1; carnitine palmitoyltransferase I; CTGF,
  cellular communication network 2; FAS, fatty acid synthetase; GPx, glutathione peroxidase;
  IL-1β, interleukin-1β; IL-6, interleukin 6; MMP, matrix metalloproteinase; MTTP,
  microsomal triglyceride transfer protein; NF-κB, nuclear factor ‘kappa-light-chain-enhancer’
  of activated B-cells; Nrf2, Nuclear factor erythroid 2-related factor 2; p-Smad2/3,
  phosphorylated Smad 2 and Smad3; PPARα, Peroxisome proliferator-activated receptor-α;
  SOD, superoxide dismutase; SREBP-1c, sterol regulatory element-binding protein-1c;
  TGF-β1, transforming growth factor-β1; TIMP-1, tissue inhibitor of metalloproteinases-1;
  TLR4, toll-like receptor 4; TNF-α, tumor necrosis factor-α'
