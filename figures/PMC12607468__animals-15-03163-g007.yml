figure_title: PS-MPs induce oxidative stress, mitochondrial damage, and inflammatory
  responses via the NF-κB/Nrf2/JNK MAPK signaling pathway.
caption: PS-MPs induce oxidative stress, mitochondrial damage, and inflammatory responses
  via the NF-κB/Nrf2/JNK MAPK signaling pathway. (A) Representative images of nuclear
  factor-protein (NF-κB) levels in oocytes from the control, 30 µg/mL PS-MPs, and
  MT (0.001 μM) groups. Scale = 100 µm. (B) Relative fluorescence intensity analysis
  of NF-κB levels after treatment with control, 30 µg/mL PS-MPs, and 0.001 μM MT.
  *, p < 0.05, ***, p < 0.001. (C) Representative images of nuclear factor—erythrocyte
  factor 2-associated factor 2 (Nrf2) protein levels in oocytes from the control,
  30 µg/mL PS-MPs, and MT (0.001 μM) groups. Scale = 100 µm. (D) Relative fluorescence
  intensity analysis of Nrf2 protein levels after treatment with control, 30 µg/mL
  PS-MPs, and 0.001 μM MT. ***, p < 0.001. (E) Representative images of C-Jun n-terminal
  kinase (JNK) protein levels in oocytes from the control, 30 µg/mL PS-MPs, and MT
  (0.001 μM) groups. Scale = 100 µm. (F) Relative fluorescence intensity analysis
  of JNK protein levels after treatment with control, 30 µg/mL PS-MPs, and 0.001 μM
  MT. ***, p < 0.001. Each oocyte’s average fluorescence intensity was statistically
  analyzed. Error bars indicated the mean ± SEM. p-values were calculated using the
  ANOVA test. The experiment of each group was repeated three times
