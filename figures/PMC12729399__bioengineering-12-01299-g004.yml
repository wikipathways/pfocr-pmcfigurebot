caption: 'RNA sequence analysis of UE7T-9 and UE7T-9 SRRM4 UE7T-9 cells. (A) Left:
  Volcano plot identified upregulated and downregulated genes, including mild downregulation
  of CXCL12 and upregulation of HOXB2, but no obvious differentiation factors or growth
  factors were identified. However, no obvious differentiation factors or cell growth
  factors were identified. Right: GO Gene ontology analysis showed upregulation of
  factors such as chemotaxis and extracellular matrix. KO cell. (B) Pathway enrichment
  analysis shows the pathways to which the differential genes are most related, with
  reference to the Gene Ontology database. (C) Heat map of the upregulated genes and
  downregulated genes between UE7T-9 cell control and UE7T-9 SRRM4 KO cell'
