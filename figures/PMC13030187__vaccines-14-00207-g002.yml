figure_title: Schematic representation of the potential neuroprotective pathways through
  which influenza vaccination may reduce the risk of cognitive decline and dementia.
caption: Schematic representation of the potential neuroprotective pathways through
  which influenza vaccination may reduce the risk of cognitive decline and dementia.
  Influenza vaccination may confer neuroprotection through multiple, partially overlapping
  mechanisms. First, by preventing influenza infection or reducing disease severity,
  vaccination limits direct viral invasion of the central nervous system and immune-mediated
  neuronal injury, thereby lowering the risk of acute encephalopathy and long-term
  cognitive impairment. Second, vaccination can induce trained immunity and reduce
  systemic inflammation, counteracting age-related chronic low-grade inflammation
  (“inflammaging”) and creating a more balanced neuroimmune environment that supports
  cognitive function. Third, influenza vaccination may modulate microglial activity,
  promoting amyloid-β plaque clearance and reducing neuroinflammation, processes implicated
  in Alzheimer’s disease pathogenesis. Collectively, these mechanisms may contribute
  to improved cognitive function and a reduced risk of dementia in vaccinated individuals.
