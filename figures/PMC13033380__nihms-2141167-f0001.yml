figure_title: Hedgehog family members are expressed in developing NCCs
caption: (A) Plots using an embryonic chick RNA-seq dataset showing expression of
  neural crest induction genes, neural crest specification genes and HH pathway genes.
  GLI3 expression is shown in both NCCs and whole embryos (WE). (B) Heatmap of RNA-seq
  dataset from human ESCs during neural crest differentiation showing expression of
  neural crest induction genes, neural crest specification genes and HH pathway genes.
  (C) Reads per kilobase million (RPKM) of GLI TFs from the heatmap in B. (D) Dot
  plot of a murine embryo scRNA-seq dataset re-analyzed to show expression of neural
  crest induction genes, neural crest specification genes and HH pathway genes. Colors
  of dashed boxes in B,D correspond to categories of genes as in the key in A. Animal
  model schematics were created using Biorender.com
