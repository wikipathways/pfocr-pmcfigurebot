figure_title: GIV is required for the emergence of healing niColAMs in MDP-treated
  WT mice
caption: '(A) Study design of DSS-induced acute, chronic, and recovery phases in mouse
  models of colitis (C57/BL6; all WT). (B) Line graphs display the temporal patterns
  of the emergence of iColAMs and niColAMs in the colon samples in A. The gray dotted
  line indicates the composite scores of iColAM and niColAM genes in the control mice.
  (C) Study design for DSS-induced colitis in WT versus GIV mice (n = 3 each). See
  also Figure 5, A–E, for the detailed study design and disease pathology. (D) Bar
  plots show the classification accuracy of composite scores derived from iColAM and
  niColAM gene signatures in DSS-challenged mouse samples, comparing with or without
  L18-MDP treatment groups. Classification strength within each cohort is measured
  using receiver operating characteristic AUC analyses. (E) Violin plots show composite
  scores for niColAMs (for blue border in D) in WT and iColAMs (for brown border in
  D) in GIV-KO mice, treated with or without L18-MDP. (F and G) Gene Ontology Biological
  Process (GOBP) pathway enrichment analyses of genes downregulated in WT (F) or GIV-KO
  (G) mice treated with L18-MDP compared to their respective untreated controls. (H
  and I) GOBP (H) and Go Molecular Function (GO MF; I) analyses of genes downregulated
  in L18-MDP-treated WT vs GIV-KO samples. (J and K) Schematic (J) of bulk RNA sequencing
  in silico deconvolution analysis of distal colons from DSS-treated mice in C. Bar
  plots (K) show normalized percentage abundances of M1 and M2 macrophages in WT and
  GIV-KO mice, with and without MDP treatment. Statistics: P-values were calculated
  using an unpaired multiple t-test (K). P-value ≤ 0.05 is considered as significant.
  GOBP, Gene Ontology biological process; proc, processes; Reg, regulation; veh, vehicle'
