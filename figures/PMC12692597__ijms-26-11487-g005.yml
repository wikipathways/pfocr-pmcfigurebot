figure_title: IL-4 and IL-13 membrane receptor complexes and intracellular signaling
  pathways.
caption: 'IL-4 and IL-13 membrane receptor complexes and intracellular signaling pathways.
  IL-4 signals through two receptor complexes: the Type I IL-4 receptor complex, comprising
  IL-4Rα and the common gamma chain (γc or IL-2Rγ), and the Type II IL-4 receptor
  complex, comprising IL-4Rα and IL-13Rα1. IL-13 primarily signals through the Type
  II receptor complex but can also interact with IL-13Rα2, which serves as a decoy
  receptor with limited downstream potential [40]. Type I IL-4 receptor complex is
  primarily expressed on hematopoietic cells [33,34]. Additionally, this receptor
  is also expressed on human conjunctival epithelial cells and corneal fibroblasts,
  where it induces the production of mucins by globet cells and other immune-modulatory
  functions, contributing to the pathophysiology of allergic conjunctivitis and other
  ocular surface disorders [41,42]. Therefore, the type II IL-4 receptor complex is
  the primary receptor involved in the pathogenesis of AD, contributing to barrier
  dysfunction and the recruitment of Th2 cells due to its widespread expression on
  non-hematopoietic cells, including keratinocytes, fibroblasts, and immune cells
  [34,43,44]. Activation of the type II IL-4 receptor complex leads to the phosphorylation
  of Janus kinases (JAK1, bound to the IL-4Rα chain, and TYK2, associated with the
  IL-13Rα1 chain) and subsequent activation of signal transducer and activator of
  transcription (STAT) 6, which regulate the expression of genes driving type 2 inflammation.
  IL-13Rα2 exists in both membrane-bound and soluble forms, acting as a high-affinity
  decoy receptor for IL-13. Unlike the IL-4Rα/IL-13Rα1 receptor complex that transmits
  pro-inflammatory signals, IL-13Rα2 binds IL-13 with high affinity but does not activate
  downstream inflammatory pathways, thereby modulating the excessive immune responses
  characteristic of AD. Silencing IL-13Rα2 in the HaCaT keratinocyte cell line significantly
  amplifies IL-13-mediated STAT6 activation compared to cells treated with control
  small interfering RNA, further supporting the role of IL-13Rα2 as a decoy receptor
  for IL-13 [45]. In human keratinocytes, IL-13Rα2 expression is upregulated by IL-13,
  IL-4, and TNF-α, but not by IFN-γ (which does upregulate this receptor in bronchial
  epithelial cells), whereas IL-13Rα1 expression remains stable and unaffected by
  these cytokines [44,45,46,47]. Therefore, its expression is significantly upregulated
  in the lesional skin and serum of patients with AD and is permanently induced by
  mechanical scratching and pro-inflammatory cytokines as a compensatory mechanism
  against the overwhelming effects of IL-13, sequestering IL-13 and inhibiting further
  action [44,45]. Apart from withdrawing IL-13 without transmitting pro-inflammatory
  signals, it is also believed to attenuate fibrosis through reducing collagen and
  TGF-β production [44]. Studies have shown that IL-13 upregulated collagen and TGF-β1
  production in fibroblasts but not in IL-13 Rα2-adenovirally transfected fibroblasts
  [48]. Despite being intended to reduce TGF-β, the same IL-13Rα2 and IL-13 have also
  been described to increase TGF-β1 through pathways involving the TMEM219 molecule,
  a similar mechanism used by other ligands such as chitinase 3-like 1 (CHI3L1) (also
  known as human homolog YKL-40) [49,50]. This still must be further elucidated but
  it is becoming clear that this receptor has various roles beyond its decoy function.
  What is clear is that despite mechanical scratching and inflammation enhancing IL-13Rα2
  expression and mitigating some IL-13-mediated effects, it is not enough to fully
  prevent local disease'
