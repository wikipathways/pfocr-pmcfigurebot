figure_title: Schematic representation of canonical and non-canonical Wnt signaling
  pathways and their functional roles in leukemia.
caption: 'Schematic representation of canonical and non-canonical Wnt signaling pathways
  and their functional roles in leukemia. Wnt signaling cascade is divided into two
  major branches: canonical (β-catenin-dependent) and non-canonical (β-catenin-independent)
  pathways. Left Panel: Canonical Wnt signaling: In presence of Wnt ligands (e.g.,
  Wnt3a), binding to FZD and co-receptors LRP5/6 leads to DVL activation and inhibition
  of β-catenin destruction complex (composed of APC, CK1, GSK3β, and Axin). Stabilized
  β-catenin translocates into nucleus, where it interacts with TCF/LEF transcription
  factors to promote transcription of Wnt target genes such as c-Myc, Cyclin D1, Axin2,
  and Survivin, which drive cell proliferation, survival, and stemness, which are
  processes often hijacked by leukemic stem cells in ALL. Right Panel: Non-canonical
  Wnt signaling: Wnt5a-class ligands activate β-catenin-independent signaling. Wnt/Ca2+
  pathway elevates intracellular calcium levels, activating CaMKII and PKC, which
  in turn stimulate NFAT-mediated transcriptional programs involved in migration and
  invasion. Planar cell polarity (PCP) pathway involves Dvl-mediated activation of
  small GTPases RhoA and Rac1, triggering downstream effectors ROCK and JNK. These
  pathways regulate cytoskeletal dynamics and directional migration which are features
  linked to leukemic progression'
