figure_title: Graphical summary of HuR’s roles in liver homeostasis and MASLD pathogenesis.
caption: Graphical summary of HuR’s roles in liver homeostasis and MASLD pathogenesis.
  HuR plays a multifaceted role in maintaining hepatic homeostasis and regulating
  key processes implicated in MASLD development. These include electron transport
  chain activity and mitochondrial function, hepatic stellate cell (HSC) activation
  and fibrogenesis, insulin signaling via the phosphoinositide 3-kinase (PI3K)/AKT
  serine/threonine kinase 1 (AKT1) pathway, lipoprotein assembly and VLDL secretion,
  and bile acid synthesis and metabolism. HuR directly or indirectly regulates the
  expression of a wide array of target transcripts involved in these pathways, including
  NADH ubiquinone oxidoreductase subunit B6 (Ndufb6), ubiquinol–cytochrome c reductase
  binding protein (Uqcrb), cytochrome C (Cytc), osteopontin (Opn), H19, phosphatase
  and tensin homolog (Pten), apolipoprotein b (Apob), apolipoprotein e (Apoe), cytochrome
  P450 family 7 subfamily A member 1 (Cyp7a1), and cytochrome P450 family 7 subfamily
  B member 1 (Cyp7b1). Collectively, these regulatory activities position HuR as a
  key post-transcriptional mediator in both physiological liver function and MASLD
  progression. Created in BioRender V2. https://BioRender.com/qshr340. (accessed on
  1 July 2025)
