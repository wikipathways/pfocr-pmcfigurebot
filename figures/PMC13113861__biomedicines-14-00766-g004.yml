figure_title: Co-expression profile, protein interaction network, and functional enrichment
  analyses of ST3GAL4.
caption: 'Co-expression profile, protein interaction network, and functional enrichment
  analyses of ST3GAL4. (A) Heatmap showing the top five genes most strongly correlated
  with ST3GAL4 mRNA expression across TCGA cancer types, accompanied by representative
  scatter plots illustrating gene-level correlations. Red: positive correlation; light
  blue: negative correlation; color intensity indicates correlation strength; boxes
  with “×” denote no statistical significance (p > 0.05). (B) Protein–protein interaction
  network for ST3GAL4, constructed using the STRING database, displaying experimentally
  supported and predicted interacting proteins. (C) Gene Ontology (GO) enrichment
  analysis of ST3GAL4-interacting proteins, including biological process (BP), cellular
  component (CC), and molecular function (MF) categories. (D) Reference publication
  enrichment (PubMed) of ST3GAL4-associated proteins, showing the top enriched publications
  based on gene co-occurrence. (E) KEGG pathway enrichment and Reactome pathway enrichment
  analyses of ST3GAL4-interacting proteins'
