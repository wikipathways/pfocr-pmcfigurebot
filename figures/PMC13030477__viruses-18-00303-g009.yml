figure_title: UV light induced SOCS1 mRNA in UV-irradiated uninfected tumor epithelial
  cells while reducing it in the case of RV-infected cells within 72 h.
caption: UV light induced SOCS1 mRNA in UV-irradiated uninfected tumor epithelial
  cells while reducing it in the case of RV-infected cells within 72 h. (a) Schematic
  illustration of the inhibitory effect of SOCS1 in the JAK/STAT pathway in airway
  epithelial cells after RV1B infection. Created in BioRender.com. (b) SOCS1 expression
  in untreated and UV-irradiated RV-infected A549 epithelial cells measured within
  48 h. Data represents six independent repeats per group, representative of three
  independent experiments. (c) SOCS1 expression in untreated and UV-irradiated RV-infected
  A549 epithelial cells measured within 72 h. Data represents three independent repeats
  per group, representative of one independent experiment. (d) Comparison between
  SOCS1 mRNA expression levels in untreated and UV light post-treated conditions within
  48 h and 72 h. The immune responses in RV-infected airway epithelial cells were
  reduced after UV 72 h treatment, which were higher in uninfected cells. The mRNA
  levels of each condition were determined using real-time polymerase chain reaction.
  One-way ANOVA analysis with Tukey’s post hoc test was performed to test statistical
  significance. p values * p < 0.05; **** p < 0.0001. Each circular dot represents
  one independent sample per experiment and the number of dots per group corresponds
  to the sample size
