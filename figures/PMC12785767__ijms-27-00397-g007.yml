figure_title: Stage-specific regulation of lipid metabolism genes in human oocytes.
caption: 'Stage-specific regulation of lipid metabolism genes in human oocytes. (a)
  Heatmap of lipid metabolism gene expression. Z-score normalized expression of genes
  grouped by Fatty Acid Biosynthesis (FAB), Elongation (FAE), and Degradation (FAD).
  Shared genes are highlighted at the module interfaces. (b) Pathway activity scores.
  Module scores in human oocytes showed a reduction in the 3 lipid modules from GV
  to MII. (c) Effect-size analysis (Cohen’s d). GV-enriched: (d > 0; filled in circle);
  MII-enriched: (d < 0; hollow circle). (d–i) Shared gene dynamics. Box plots confirm
  downregulation in all of them through the transition from the GV to MII stage. (j)
  CPT1C expression, showing a significant reduction in MII. (k) CPT2 stability. No
  change (ns; p = 0.21), maintaining basal β-oxidation capacity. Statistical significance
  is indicated as * p < 0.05, ** p < 0.01, *** p < 0.001; ns, not significant (p >
  0.05)'
