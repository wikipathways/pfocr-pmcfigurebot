figure_title: Distinct protein expression profile in ESCs from different EM lesions.
caption: 'Distinct protein expression profile in ESCs from different EM lesions. Protein
  was isolated from ESCs from eutopic endometrium (n = 5), superficial (SF, n = 5),
  or deep (DE, n = 4) endometriotic lesions, or endometrioma (OMA, n = 5), and subjected
  to proteomics analyses. (A) Principal component analysis plot. (B) Venn diagram
  of differentially expressed genes in the comparisons SF vs. eutopic, DE vs. eutopic,
  and OMA vs. eutopic. (C) Heat map for the 29 proteins that were significantly altered
  in all three comparisons; each column represents one individual. (D) Volcano plots
  for the three comparisons: log2 fold change > 0.5 and q < 0.05 (corrected p-values
  for false discovery rate (FDR)) were considered significantly up- or downregulated.
  (E,F) Pathway analyses for significantly altered proteins in the indicated comparisons.
  The graphs show the top 10 significantly altered pathways, pathways of specific
  interest are highlighted in bold font. Y-axis: enrichment scores. ((E), right side)
  Pathway analysis for the proteins that were uniquely altered in ESCs from endometrioma
  but not in those from superficial or deep endometriotic lesions. Y-axis: enrichment
  scores'
