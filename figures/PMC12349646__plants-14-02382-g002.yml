figure_title: Effects of bamboo biochar (Bc) and sodium silicate (Si) on reactive
  oxygen species (ROS) accumulation and antioxidant enzyme activities in tobacco under
  oxybenzone (OBZ) stress.
caption: Effects of bamboo biochar (Bc) and sodium silicate (Si) on reactive oxygen
  species (ROS) accumulation and antioxidant enzyme activities in tobacco under oxybenzone
  (OBZ) stress. (A) Proposed model of the antioxidant defense system, including the
  enzymatic and non-enzymatic pathways for ROS scavenging. (B) Histochemical detection
  of ROS using DAB and NBT staining in leaves under different treatments (visually
  discernible differences). (C) The generation rate of superoxide anion (O2−). (D)
  The content of hydrogen peroxide (H2O2). (E) Superoxide dismutase (SOD) activity.
  (F) Catalase (CAT) activity. (G) Peroxidase (POD) activity. (H) Ascorbate peroxidase
  (APX) activity. (I) The content of ascorbic acid (AsA) content. (J) The content
  of reduced glutathione (GSH). (K) Glutathione peroxidase (GPX) activity. Data are
  presented as means ± standard deviation (SD, n = 3). Different lowercase letters
  indicate significant differences among treatments (p < 0.05) according to one-way
  ANOVA followed by Duncan’s test
article_title: Bamboo Biochar and Sodium Silicate Alleviate Oxybenzone-Induced Phytotoxicity
