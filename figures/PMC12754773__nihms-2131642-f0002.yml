figure_title: Proposed mechanism for CD8 T cell-enhanced immune infiltration and blood–brain
  barrier disruption
caption: (A) Endothelial cells cross-present antigens on MHC class I molecules to
  CD8 T cells in a process that enables further infiltration of leukocytes into the
  brain through paracellular or transcellular routes. (B) CD8 T cell recognition of
  microvessel endothelial cell MHC class I results in tight junction alterations through
  a perforin-dependent pathway. The result is vascular leakage and hemorrhage in the
  brain parenchyma, as well as recruitment of additional immune cell types, including
  myeloid cells. Figure created in BioRender
