figure_title: Polyamine biosynthesis pathway with structures of human enzymes.
caption: Polyamine biosynthesis pathway with structures of human enzymes. In the co-first
  steps, S-adenosylmethionine (AdoMet) and L-ornithine are converted to decarboxylated
  S-adenosylmethionine (dcAdoMet) and putrescine by AdoMetDC (magenta PDB ID 1JEN)
  and ODC (red/gray PDB ID 1D7K), respectively. Putrescine is then converted to spermidine
  using dcAdoMet as the aminopropyl donor by SPDS (blue/gray PDB ID 2O07). Spermidine
  is then converted to spermine using a second dcAdoMet as an aminopropyl donor by
  SPS (orange/gray PDB ID 3C6K). Gray structures indicate the second chain of homodimer
  pairs
