figure_title: A volcano plot illustrating differential gene expression associated
  with neck disability.
caption: A volcano plot illustrating differential gene expression associated with
  neck disability. Each point represents a gene, plotted by it log2 fold change (x-axis)
  and −log10 adjusted p-value (y-axis). Genes with both statistically significant
  expression changes and substantial fold changes are highlighted in red, while those
  with either significant p-values (blue) or fold changes (green) alone are also marked.
  Non-significant genes are shown in grey. Notable genes such as KLRF1, ZNF600, PRICKLE2,
  and NEFL are labeled for emphasis. This visualization enables rapid identification
  of genes most affected by neck disability, supporting downstream pathway and functional
  enrichment analysis
