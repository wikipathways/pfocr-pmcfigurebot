figure_title: ANXA1 inhibits astrocyte immune responses
caption: a–c, RNA-seq of astrocytes from GL261 sgFpr1 or sgRandom-bearing mice. Volcano
  plot (a) and pathway analysis (b,c) are shown (n = 3 sgFpr1 and n = 4 sgRandom mice).
  d–f, Immunofluorescence of ASC (d,e) and nuclear NF-κB (f) in peritumoral GFAP-positive
  luciferase-negative astrocytes. Each point represents one mouse (n = 3 mice per
  group). g–j, Co-culture of primary human astrocytes with CellTrace-labelled primary
  GBM cultures in the presence or absence of LPS and poly(I:C) ± FPR1 inhibitor (FPR1i)
  T-0080 (g, top right arm), followed by immunofluorescence staining for ASC (h,i)
  or cleaved IL-1β (j) (n = 3 replicate wells per group). k, Co-culture of primary
  human astrocytes with CellTrace-labelled primary GBM cultures in the presence or
  absence of TNF and IL-1β, FPR1 inhibitor T-0080 and neutralizing anti-FPR1 antibody
  (g, schematic, bottom right arm), staining for nuclear NF-κB. l,m, AAV construct
  and GBM mouse model timeline for survival, RNA-seq and immunofluorescence analysis
  (l). Kaplan–Meier survival plot of GL261-bearing mice, transduced with sgRosa or
  sgAnxa1 AAV-PHP.eB under the GFAP promoter (m); n = 8 mice per group, log rank.
  n, Immunofluorescence staining of ASC, GFAP and DAPI in peritumoral regions from
  GL261-bearing mice from day 24. Each point represents one mouse; n = 3 mice per
  group. o, Immunofluorescence staining of pMLKL and DAPI in tumour-cell regions from
  mice that underwent genetic inactivation of Anxa1, followed by implantation of GL261.
  Each point represents a different mouse; n = 3 mice per group. In e,f,i,j,k,m,n
  and o, there was one replicate experiment, which was performed three times with
  similar results. ***P < 0.001, **P < 0.005, *P < 0.05. P values were from unpaired
  two-tailed t-tests (e,f,i,j,k,n and o). Data are mean ± s.e.m. (e,f,i,j,k,n and
  o). Scale bars, 25 μm. Illustrations in g created in BioRender (Lee, J. https://BioRender.com/0bkvepw;
  2025)
