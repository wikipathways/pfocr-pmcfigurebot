figure_title: CENPU enhances furin activity by inhibiting its degradation via the
  lysosomal pathway.
caption: CENPU enhances furin activity by inhibiting its degradation via the lysosomal
  pathway. (A) CENPU and furin were subjected to co-immunoprecipitation. (B) Furin
  and proNGF were subjected to co-immunoprecipitation. (C) MDA-MB-231-shCENPU cells
  and their corresponding controls were treated with CHX (20 μM) for the specified
  duration, and protein levels were measured by western blotting. (D) Relative expression
  of furin. (E) MDA-MB-231 cells were treated with MG132 (10 μM) for 12 h, and then
  also treated with CHX (20 μM) for the indicated times. Protein levels were detected
  by western blotting. (F) Relative expression of furin. (G) MDA-MB-231 cells were
  treated with CQ (100 μM) for 12 h, and then treated with CHX (20 μM) for the indicated
  times. Protein levels were detected by western blotting. (H) Relative expression
  of furin. (I) Cal51-shCENPU cells and their corresponding controls were treated
  with CHX (20 μM) for the specified duration, and protein levels were measured by
  western blotting. (J) Relative expression of furin. (K) Cal51 cells were treated
  with MG132 (10 μM) for 12 h, and then treated with CHX (20 μM) for the indicated
  times. Protein levels were detected by western blotting. (L) Relative expression
  of furin. (M) Cal51 cells were treated with CQ (100 μM) for 12 h, and then treated
  with CHX (20 μM) for the indicated times. Protein levels were detected by western
  blotting. (N) Relative expression of furin. *P<0.05 vs. DMSO or CON313 group. The
  experimental and control groups in panels C-M were run on the same gel/membrane
  and incubated with the corresponding primary antibodies simultaneously. CENPU, centromere
  protein U; sh, short hairpin RNA; NS, not significant; proNGF, nerve growth factor
  precursor; CHX, cycloheximide; CQ, chloroquine
