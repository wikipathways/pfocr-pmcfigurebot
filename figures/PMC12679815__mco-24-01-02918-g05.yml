caption: Biological Function Differences between patients with high-risk and low-risk
  glioma. (A) Gene Ontology enrichment analysis showing involvement in the cell cycle,
  nuclear division, and protein kinase activity. (B) Kyoto Encyclopedia of Genes and
  Genomes pathway analysis highlighting enrichment in the cell cycle, senescence,
  p53 and FoxO signaling pathways. (C) Gene set variation analysis showing the upregulation
  of KRAS signaling and the inflammatory response in the high-risk group and oxidative
  phosphorylation and DNA repair in the low-risk group
