figure_title: High expression of Linc01559 is positively correlated with an acidic
  environment and the STAT3-cMYC pathway in duodenal adenocarcinoma.
caption: High expression of Linc01559 is positively correlated with an acidic environment
  and the STAT3-cMYC pathway in duodenal adenocarcinoma. (a) The volcano plot shows
  significantly overexpressed lncRNAs in duodenal adenocarcinoma tumor tissues; (b)
  qPCR of RNA expression ofdifferentially expressed lncRNAs described in Figure 2a;
  (c) mRNA expression levels of acidic environmental markers in Linc01559 high and
  Linc01559 low expression group; (d–f) heatmap of genes co-expressed with Linc01559
  (e) and the cancer hallmark signaling pathways associated with these genes (d,f)
  between normal and tumor tissues are shown; (g) mRNA expression of HIF1α, STAT3
  and c-MYC in normal and tumor tissues; (h) correlation analysis of the expression
  between Linc01559 and HIF1α, STAT3, c-MYC. Three independent experiments were performed
  to obtain the data in (b); The data are shown as the mean ± SD; the Pearson correlation
  coefficient (r) and p-values are shown * p < 0.05, ** p < 0.01, and *** p < 0.001
