figure_title: Possible mechanisms of maternal inheritance and bottleneck effects.
caption: 'Possible mechanisms of maternal inheritance and bottleneck effects. (A)
  Maternal mitochondrial quality control: mtDNA copy number first contracts and then
  expands, enabling selective removal of defective mitochondria via PINK1–Larp-mediated
  suppression of replication and programmed germline mitophagy (PGM), which involves
  BNIP3, Drp1/Tango11, and Atg1-dependent autophagic activation. Mitochondrial clustering
  structures such as the Balbiani body may further facilitate quality-based selection.
  (B) Paternal mitochondria and mitochondrial genome elimination: (1) Paternal mtDNA
  clearance involves EndoG (CPS-6), PolG1, and POLDIP2 (D. melanogaster), or TFAM
  blockade (mammals). (2) In C. elegans, CPS-6 (EndoG) degrades mtDNA after loss of
  membrane potential; ALLO-1 and PHB-2 recruit LGG-1/2 to form allophagosomes. (3)
  Degradation pathways: PHB-2 can bind to LC3 to mediate recognition and clearance
  (a); FNDC-1 (FUNDC1 homolog) selectively marks paternal mitochondria (e); PINK1/Parkin
  promotes ubiquitination and recruits p62 and LC3 (b); VDAC1 and mitofusin serve
  as ubiquitination targets (c); p62 recognizes ubiquitinated cargo and interacts
  with LC3 (d); NIX and BNIP3 achieve autophagy through non-ubiquitin-dependent pathways
  (e). (4) D. melanogaster sperm mitochondria are degraded through a phagocytosis-like
  pathway. (5) The ubiquitin-proteasome system (UPS) and the protein dislocase VCP/p97
  contribute to elimination (mammals). P: phosphorylation modification; OM: outer
  membrane; IM: inner membrane; “?” indicates the mechanism remains unclear'
