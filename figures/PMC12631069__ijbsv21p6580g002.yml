figure_title: Functional and metabolic characteristics of alveolar macrophages (AMs)
  under homeostatic conditions.
caption: Functional and metabolic characteristics of alveolar macrophages (AMs) under
  homeostatic conditions. Under steady-state conditions, AMs maintain immune tolerance
  and regulate pulmonary surfactant—a lipoprotein complex produced by respiratory
  epithelial cells to lubricate the lungs and facilitate frictionless expansion/contraction—through
  anti-inflammatory signaling and lipolytic metabolism. Equipped with robust phagocytic
  capacity, AMs efficiently clear apoptotic/senescent cells and inhaled particles,
  serving as the first line of defense against airborne pathogens. Their energy metabolism
  primarily relies on oxidative phosphorylation (OXPHOS) and fatty acid oxidation
  (FAO), a process governed by peroxisome proliferator-activated receptor-γ (PPARγ)-driven
  transcriptional programs and modulated by epithelial-derived signals such as granulocyte-macrophage
  colony-stimulating factor (GM-CSF). Impaired cholesterol handling, including deficiencies
  in liver X receptor (LXR) and its downstream transporter ABCG1 (ATP-binding cassette
  subfamily G member 1), can lead to pathological surfactant accumulation, as observed
  in pulmonary alveolar proteinosis. Furthermore, oxygen-sensing pathways such as
  the von Hippel-Lindau (VHL)-HIF axis shape AM identity and metabolic states, highlighting
  the critical role of tightly regulated lipid metabolism in maintaining pulmonary
  homeostasis. BACH2, BTB and CNC homology 2; HDL, high-density lipoprotein; INSIG,
  insulin-induced gene; SREBP1, sterol regulatory element-binding protein 1. This
  figure was substantially revised and repurposed based on Figure 2A from Wculek SK
  et al., Cell Mol Immunol. 2022;19:384-408
