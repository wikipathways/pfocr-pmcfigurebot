figure_title: Genetic and signaling pathways in thyroid carcinogenesis.
caption: Genetic and signaling pathways in thyroid carcinogenesis. The left panel
  illustrates the normal thyroid gland anatomy, including follicular cells arranged
  in follicles surrounding colloid, parafollicular cells, and associated blood capillaries.
  Within the follicular cell, key signaling pathways are depicted. The cyclic AMP
  (cAMP) pathway, activated by thyroid-stimulating hormone (TSH) binding to its receptor
  (TSH-R) and subsequent G-protein (Gsp) activation of adenylyl cyclase, promotes
  cell proliferation. The mitogen-activated protein kinase (MAPK) pathway is activated
  by growth factors binding to receptor tyrosine kinases (e.g., rearranged during
  transfection/papillary thyroid carcinoma [RET/PTC] fusions, B-Raf proto-oncogene
  [BRAF]). It is crucial for protein synthesis, cell growth, and proliferation. The
  PAX8/PPARγ gene fusion is shown as a chromosomal translocation t(2;3)(q13;p25) leading
  to the expression of the PAX8/PPARγ fusion protein (PPFP), which increases proliferation
  and causes a loss of differentiation by impacting differentiation and growth genes.
  The right panel illustrates the progression of thyroid carcinomas driven by specific
  genetic alterations, including RAS proto-oncogene (RAS) and BRAF mutations, culminating
  in aggressive anaplastic carcinoma often characterized by an additional p53 inactivating
  mutation. Hyperfunctioning adenomas and follicular carcinomas can arise from RAS
  mutations or PAX8/PPARγ rearrangements. Papillary carcinoma is frequently associated
  with RAS, BRAF, or RET/PTC mutations, with a follicular variant of papillary carcinoma
  also linked to the PAX8/PPARγ fusion. Notably, the development of aggressive anaplastic
  carcinoma is often characterized by the acquisition of a p53 inactivating mutation,
  in addition to pre-existing RAS or BRAF mutations, highlighting a crucial step in
  dedifferentiation and malignancy. Created with BioRender.com (accessed on 1 August
  2025)
