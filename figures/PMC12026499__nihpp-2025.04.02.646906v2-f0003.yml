figure_title: Interfaceome disease pathways on ATOMICANets
caption: 'a Set up of the modality specific networks based on ATOMICA embedding similarity
  of protein interfaces with ions, small molecules, lipids, nucleic acids, and proteins.
  b Cosine similarity of ATOMICA embeddings of protein interface pairs across five
  interacting modalities compared to the probability of the protein pair being involved
  in the same disease. c Relative size of largest pathway component across diseases
  for each modality network. We display only the diseases which have statistically
  larger pathway components than expected in at least one ATOMICANet modality. The
  three largest pathway components for: d asthma in ATOMICANet-Lipid, e myeloid leukemia
  in ATOMICANet-Ion, f hypertrophic cardiomyopathy in ATOMICANet-Small-Molecule'
