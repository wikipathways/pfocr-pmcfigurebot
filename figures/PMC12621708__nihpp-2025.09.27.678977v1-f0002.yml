figure_title: homeRNA captures LPS-induced immune response.
caption: 'homeRNA captures LPS-induced immune response. A) Volcano plot of differentially
  expressed genes (DEGs) between LPS-stimulated and unstimulated homeRNA-stabilized
  samples. The measured 943 DEGs (30% change in expression, FDR ≤ 0.05) are represented
  by the negative log10 of the adjusted p-value on the y-axis and log2 fold change
  on the x-axis. Red points represent up-regulated genes and blue points represent
  down-regulated genes with LPS stimulation. The top 10 highly expressed up-regulated
  and down-regulated genes are labeled. B) Gene ontology (GO) enrichment chord diagram
  visualizing the top 10 DEGs present in each of the top six biological processes.
  Genes are positioned around the circle and colored by their log2 fold change (red
  for up-regulated, blue for down-regulated). Biological processes are labeled A-F
  around the outer ring. Connecting ribbons link genes to their associated biological
  processes, with ribbon colors corresponding to a biological process. C) All up-
  and down-regulated DEGs (n=29 DEGs) in the toll-like receptor signaling pathway
  (KEGG: 04060) ranked based on their absolute value of log2 fold change. Up-regulated
  genes are shown in red; down-regulated genes are shown in blue. The box and whisker
  plot on the left summarizes the distribution of all DEGs in this pathway with outliers
  represented by circles. p-values were adjusted for multiple comparisons by controlling
  for the false discovery rate (FDR) using the Benjamini-Hochberg (BH) procedure41'
