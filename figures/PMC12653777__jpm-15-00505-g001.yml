figure_title: Pharmacokinetic pathway of tamoxifen and its clinical implications.
caption: Pharmacokinetic pathway of tamoxifen and its clinical implications. After
  intestinal absorption mediated by transporters, tamoxifen undergoes hepatic metabolism
  through phase I and II drug-metabolizing enzymes, generating both active metabolites
  and inactive compounds destined for elimination in urine and bile. Active metabolites
  circulate systemically and reach their cellular targets, where they are imported
  by influx transporters and expelled by efflux transporters. Genetic polymorphisms
  and drug–drug interactions affecting drug-metabolizing enzymes or transporters can
  alter their function, disrupting the balance of activation, transport, and clearance,
  and thereby potentially modulating treatment efficacy. Sites marked with an asterisk
  (*) indicate points influenced by genetic polymorphisms or drug–drug interactions,
  which may change enzyme or transporter activity and affect tamoxifen efficacy or
  toxicity. The symbols ↓ and ↑ denote downregulation and upregulation, respectively.
  This pathway highlights potential key points that might underlie variability in
  treatment outcomes and, if proven clinically relevant, could guide future personalization
  of therapy. Created in BioRender (https://BioRender.com/p65t300, accessed on 28
  February 2025)
