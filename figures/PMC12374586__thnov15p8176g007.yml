figure_title: Wnts secreted by degenerating neurons transfected with GFP-GA100 and/or
  astrocytes activate the YAP/β-catenin/EAAT2 signaling pathway in astrocytes.
caption: Wnts secreted by degenerating neurons transfected with GFP-GA100 and/or astrocytes
  activate the YAP/β-catenin/EAAT2 signaling pathway in astrocytes. (A-F) qPCR analysis
  of the relative mRNA levels of Wnt1 (A), Wnt2 (B), Wnt3a (C), Wnt4 (D), Wnt5a (E)
  and Wnt7a (F) in primary cultured neurons transduced with AAV-GFP-GA5 virus or AAV-GFP-GA100
  virus (n = 4 each group, Student's t-test). (G-L) qPCR analysis of the relative
  mRNA levels of Wnt1 (G), Wnt2 (H), Wnt3a (I), Wnt4 (J), Wnt5a (K) and Wnt7a (L)
  in YAP+/+ astrocytes treated with GA5 CM or GA100 CM (n = 4 each group, Student's
  t-test). (M) Western blot analysis detected YAP, β-catenin and EAAT2 expression
  in YAP+/+ astrocytes 20 h after treatment with GA5 CM, GA100 CM or GA100 CM supplemented
  with 10 µM MSAB. (N-P) Quantitative analysis of the relative YAP (N), β-catenin
  (O) and EAAT2 (P) expression levels in YAP+/+ astrocytes as shown in (M) (n = 3
  each group, normalized to YAP+/+-GA5 CM). Data were presented as mean ± SEM. One-way
  ANOVA with Tukey's multiple comparisons test unless otherwise indicated, n.s., not
  significant (p > 0.05),*p < 0.05,**p < 0.01
article_title: An unrecognized mechanism of self-protection in degenerating neurons
  mediated by astrocytic YAP through Wnts/β-catenin/EAAT2 signaling in C9orf72-poly-GA
