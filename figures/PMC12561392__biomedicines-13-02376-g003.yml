  in AT-IR.'
caption: 'Molecular mechanisms of adipose tissue insulin resistance: Schematic illustrating
  the interplay of ER stress, mitochondrial dysfunction, and inflammation in AT-IR.
  Under normal conditions (left), insulin signaling promotes glucose uptake and lipid
  storage. In insulin resistance (right), ER stress initiates the cascade by activating
  UPR and stress kinases (JNK, IKK-β), leading to inflammation via M1 macrophage recruitment
  and cytokine production. Mitochondrial dysfunction, driven by ROS, sustains chronic
  impairment, forming a feedback loop with ER stress. Solid arrows indicate direct
  molecular signaling pathways and temporal progression, while dashed arrows represent
  feedback mechanisms. “X” on the right panel indicates the condition when the connection
  between insulin and its’ receptors is impaired. In both panels, arrows pointing
  up indicate the upregulation and arrows pointing down indicate the downregulation'
