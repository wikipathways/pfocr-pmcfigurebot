figure_title: DC-centric immune recognition and mechanisms against zoonotic DNA and
  RNA viruses.
caption: DC-centric immune recognition and mechanisms against zoonotic DNA and RNA
  viruses. The envelope proteins of DNA and RNA viruses activate TLR4, leading to
  the direct recruitment of MYD88. MYD88 recruits and activates TRAF6 through IRAKs.
  IRF7 is activated directly or indirectly by TARF6 in pDCs to induce IFN-I. After
  DNA viruses infect cells, their genomic dsDNA is degraded or released in lysosomes
  and endosomes. When TLR9 detects dsDNA, it changes shape and uses its intracellular
  TIR domain to recruit MYD88. The TLR9-MYD88 pathway can also induce IFN-I expression
  by activating IRF1 through TRAF6 and IKKα. TLR9 recognition also mediates the activation
  of NF-κB, leading to the upregulation of MHC I and MHC II. After RNA viruses infect
  cells, TLR3 and TLR7 recognize dsRNA and ssRNA, respectively, leading to the activation
  of IRF3 and IRF7. Upon recognizing dsRNA, TLR3 recruits TRIF, which triggers a kinase
  cascade involving TBK1, leading to the phosphorylation of IRF3. RIG-I and MDA5 recognize
  short and long dsRNA, respectively. Next, MAVS aggregation induces IRF3 phosphorylation,
  leading to the production of IFN-I. The activation of RIG-I and MDA5 increases the
  expression of MHC I and MHC II in DCs
