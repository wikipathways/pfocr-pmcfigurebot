figure_title: SOX2 and FOXA1 share a cistrome in NEPC and co-regulate key genes implicated
  in cell proliferation and lineage plasticity
caption: A) Binding motif enrichment near FOXA1 and SOX2 peaks in NCI-H660 NEPC cells.
  Both MEME and STREME motif discovery analyses were included. Full lists of motifs
  discovered can be found in Supplementary Table 1. B) Venn diagram of SOX2 and FOXA1
  ChIP-seq peaks in NCI-H660 cells grown in complete 5% FBS HITES media. Shared regions
  represent called peaks with >= 1bp of overlap. C) Venn diagram of SOX2 and FOXA1
  potential target genes. NCI-H660 ChIP-seq peaks were analyzed using Cistrome-GO
  to identify genes that had AR, FOXA1, and/or SOX2 transcription factor peaks less
  than 10kb from a TSS and an adjusted regulatory potential (RP) score of >0.01. D-F)
  Gene Ontology (GO) pathway analyses for the unique and shared FOXA1 and SOX2 candidate
  target genes in NCI-H660. GO enrichment was performed using Enrichr. G-N) Track
  plots of SOX2 and FOXA1 ChIP-seq peaks near oncogenic/NEPC genes in NCI-H660. Peaks
  visualized using IGV and mapped to the human hg38 chromosome build
article_title: SOX2 utilizes FOXA1 as a heteromeric transcriptional partner to drive
  proliferation in therapy-resistant prostate cancer
