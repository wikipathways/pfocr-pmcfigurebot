figure_title: SuMMIT-SRS imaging uncovers cell-type–specific metabolic pathway in
  developing brain
caption: '(a) Cartoon depicting the anatomic structure of a Drosophila adult brain.
  CB: central brain, OL: optical lobe. The outermost layer of the brain is covered
  by the neural lamella (NL), an extracellular matrix that provides mechanical protection.
  Beneath the NL, perineurial glia (PG) form the surface layer, followed by subperineurial
  glia (SPG), which establish the blood–brain barrier through septate junctions (SJ)
  and adherens junctions (AJ). Within the brain cortex, cortex glia (CG) extend elaborate
  processes to enwrap neuronal cell bodies (N) and neuroblasts (NB), forming protective
  chambers and supporting neuronal metabolism. Cortex glia are also enriched in lipid
  droplets (LD), reflecting their role in energy storage and lipid homeostasis. Deeper
  within the neuropil, neuropil glia (NG) associate with neuronal processes and axons
  (ax), contributing to neurotransmitter clearance and metabolic support. Lipid droplets
  (LD) are mainly localized to glial cells, particularly cortex glia that enwrap neuronal
  stem cell niche.(b-c) Stimulated Raman Scattering Hyperspectral Imaging (SRS-HSI)
  combined with unsupervised K-means clustering applied to the C─D spectral region
  to analyze cell-type-specific metabolic activity. Each cluster, identified by a
  distinct color, corresponds to a unique chemical profile derived from the spectral
  data. The spatial localization of each color in the image reveals the distribution
  of these chemical features across the tissue. The spectral plot displays the average
  Raman spectra for each cluster, with the curve color matching the corresponding
  spatial region, thereby enabling direct correlation between chemical composition
  and tissue morphology or anatomic subregions. C, cluster. Each clustering image
  represents 10 brains from 3 independent experiments. A neuronal stem cell niche
  was highlighted in (c)'
