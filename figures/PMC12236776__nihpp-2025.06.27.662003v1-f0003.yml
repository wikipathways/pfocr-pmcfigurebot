figure_title: 1D umbrella sampling of Na+, Ca2+, and Zn2+
caption: A) PMF of Na+ in CP-AMPARs (Q607) and patient mutant AMPARs (Q607E). In the
  Q607 channel, the ion encounters a free energy barrier of 7.4 kcal mol−1 to enter
  the channel and is stabilized at 2 local minima corresponding to site G (position
  ~17 Å) and the Q/R site (position ~23 – 24 Å) along its permeation pathway. In the
  Q607E channel, there is a smaller free energy barrier to enter the channel of 6.2
  kcal mol−1 and a single local minimum at the Q/R/E site during permeation. B) PMF
  of Ca2+. In Q607, the ion encounters a free energy barrier at χ ≈ 18 Å and is stabilized
  at the position corresponding to site G via a hydrogen bonding network during permeation.
  In Q607E, the PMF suggests that the ion favorably enters the pore, descends to the
  Q/R/E site and is displaced by a second Ca2+ ion to finish permeation through the
  channel. C) PMF for Zn2+. In the Q607 channel, Zn2+ encounters a significant barrier
  to enter the pore, suggesting that entrance is voltage dependent. In the Q607E channel,
  Zn2+ favorably enters the pore and remains coordinated at the Q/R/E site without
  permeating through. Additionally, the trend suggests there is less voltage-dependence
  to enter the pore. D) Representation of AMPAR ion channel with only M2 and M3 helices.
  χ = 0 Å and 46 Å, indicated by the ion at the central pore axis
