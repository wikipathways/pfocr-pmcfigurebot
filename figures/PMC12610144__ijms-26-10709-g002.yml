figure_title: 'Multifunctionality of factor VII-activating protease (FSAP): schematic
  representation of FSAP involvement in clot formation and lysis.'
caption: 'Multifunctionality of factor VII-activating protease (FSAP): schematic representation
  of FSAP involvement in clot formation and lysis. Procoagulant functions include
  the activation of factor VII (FVII) to active factor VII (FVIIa) in the cardiolipin
  surface, elevated messenger RNA (mRNA) and protein expression of tissue factor (TF)
  in human macrophages, the inhibition of tissue factor pathway inhibitor (TFPI),
  and clot formation on polyethylenimine (PEI) surface. Profibrinolytic activities
  are represented by fibrinogen alterations leading to the lysis-susceptible blood
  clot as well as the activation of urokinase plasminogen activator (uPA) and tissue-type
  plasminogen activator (tPA) to two-chain uPA (tcuPA) and two-chain tPA (tctPA),
  respectively. Created in Biorender. Iga Schachta and Artur Słomka. (2025), https://BioRender.com'
