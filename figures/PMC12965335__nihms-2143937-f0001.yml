figure_title: Manipulation of hyperdirect pathway synaptic weights affects DLEP latency
  and amplitude dynamics
caption: A. DLEPs decrease in amplitude and increase in latency over the course of
  minutes during continuous 130 Hz DBS in participants with PD. B. The model includes
  excitatory subthalamic nucleus (STN), inhibitory globus pallidus pars externus (GPe),
  and excitatory cortical axons (CTX) representing the hyper-direct pathway. Reprinted
  from Schmidt et al., 2020. C. The original model simulated over 120 s of 130 Hz
  DBS yields DLEPs (above) that do not change over time (below). Each DLEP waveform
  line (above) is a 10-s average, and each dot on the scatter plot (below) represents
  the DLEP peak-to-peak amplitude and latency for each 1-s bin over 120 s. D. When
  hyperdirect pathway synapse weights are incrementally decreased each second over
  120 s of DBS, DLEP parameters change similar to empirical DLEPs. Line and dot colors
  for A, C, and D follow the colorbar at the bottom of the figure
