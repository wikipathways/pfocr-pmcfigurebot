figure_title: Visuospatial Task Performance and Visual Field Activation Maps
caption: (A) ECP’s Scaled Block Design score of 10 (red) compared with 31 RH stroke
  survivors (blue, median = 7), with a population mean of 10 ( ± 3) (dashed line).
  (B) ECP’s Behavioral Inattention Test (BIT) composite score of 143 (red) falls clearly
  above the cutoff (dashed line), demonstrating no evidence of hemispatial neglect.
  (C, top) fMRI of visual field test showing robust left occipital activations in
  response to right visual field stimuli and right occipital activations in response
  to left visual field stimuli in 18 healthy controls. Maps are thresholded at t >
  3 and display only the largest activation cluster for stimulation in the color-coded
  quadrant. (C, bottom) ECP’s activation maps (also thresholded at t > 3 in combination
  with cluster-size threshold to control the family-wise error rate) shows similarly
  robust response in the right hemisphere but no significant activation in the left
  hemisphere in response to right visual field stimuli, suggesting a right field cut.
  The sagittal view of the left hemisphere also reveals damage to the visual pathway
  (red oval). fMRI = functional MRI; RH = right hemisphere
article_title: When a Large Left Hemisphere Stroke is All Right for Language, Praxis,
