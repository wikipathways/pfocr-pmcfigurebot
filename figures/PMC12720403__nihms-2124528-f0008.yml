figure_title: GSEA shows an overrepresentation of genes related to NOD-like Receptor
  Signaling Pathway and the NLRP3 inflammasome has a role in IL-1β production.
caption: GSEA shows an overrepresentation of genes related to NOD-like Receptor Signaling
  Pathway and the NLRP3 inflammasome has a role in IL-1β production. (A) left, GSEA
  of CES1KD M0 cells in relation to Control M0 cells; right, heat map of the 20 most
  overrepresented genes in the GSEA of CES1KD M0 cells ordered as a function of GSEA
  ranked metric score (high to low signal to noise ratio). (B) left, GSEA of Control
  M1 cells in relation to Control M0 cells; right, heat map of the 20 most overrepresented
  genes in the GSEA in Control M1 cells ordered as a function of GSEA ranked metric
  score (high to low signal to noise ratio). Genes in red font indicate those that
  overlap in CES1KD M0 cells and Control M1 cells. Data represents n = 4 biological
  replicates. NES, normalized enrichment score; FDR, false discovery rate. Heat maps
  represent z-transformed FPKM values of genes. Treatment of CES1KD M0 cells (C) and
  CES1KD M1 cells (D) with the NLRP3 inhibitor glibenclamide (25 μM, 24 h) attenuated
  the amount of mature IL-1β secreted into the culture media. Data represents n =
  3 biological replicates; **p < 0.01, ***p < 0.01; unpaired t-test (C, D)
article_title: Transcriptomics and Targeted Metabolomics Reveal That CES1 Ablation
  in Macrophages Confers a Distinct Inflammatory Phenotype Involving Altered Interleukin-1β,
  Citrate, and Lipid Levels
