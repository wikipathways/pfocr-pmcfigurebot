figure_title: Metabolic circuit driving adipocyte inflammation.
caption: Metabolic circuit driving adipocyte inflammation. Nutrient overload induces
  local hypoxia in adipose tissue, leading to activation of HIF-1α (1) and the acquisition
  of a fibro-inflammatory adipocyte phenotype. This state is characterized by the
  overexpression of inflammatory genes, including CXCL12, which is secreted by adipocytes
  and binds to its receptor CXCR4 expressed on NK cells, thereby promoting IFN-γ production
  (2). Concomitantly, adipocytes undergo metabolic reprogramming marked by increased
  expression of glutaminase (GLS), enhancing glutamine hydrolysis to glutamate. Glutamate
  is then exported via the xCT transporter and activates NK cells through mGluR5,
  further stimulating IFN-γ production (3). IFN-γ subsequently promotes macrophage
  activation and the secretion of pro-inflammatory mediators. In parallel, glutamine
  depletion in adipocytes, together with increased glycolysis, leads to elevated protein
  O-GlcNAcylation, which enhances inflammatory gene expression. As a result, adipocytes
  secrete pro-inflammatory cytokines that further activate immune cells (4). Together,
  these pathways illustrate that adipocytes are not merely passive targets but are
  key active drivers of inflammation within adipose tissue. HIF-1α, hypoxia-inducible
  factor 1 alpha; CXCL12, C–X–C motif chemokine ligand 12; CXCR4, C–X–C chemokine
  receptor 4; NK cells, natural killer cells; IFN-γ, interferon gamma; GLS, glutaminase;
  xCT, cystine/glutamate antiporter (SLC7A11); mGluR5, metabotropic glutamate receptor
  5; O-GlcNAcylation, O-linked β-N-acetylglucosamine modification; IL-6, interleukin
  6; TNFα, tumor necrosis factor alpha; IL-1β, interleukin 1 beta. Created in BioRender.
