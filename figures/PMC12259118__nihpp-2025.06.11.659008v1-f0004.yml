figure_title: Transcriptomic profiling reveals distinct molecular responses to HSV-1
  and TBEV infection in COs
caption: (A) Principal component analysis of transcriptomic data from WT iPSC-derived
  COs harvested at D60 following 7-day infection with HSV-1 or TBEV and NTR controls.
  Four individual organoids per cell line per condition were combined into 9 pooled
  samples and analyzed. See also Table B for reference on a specific number of samples,
  replicates, and cell line details used in these experiments. (B) Volcano plots displaying
  DEGs (p.adj<0.1, log2FC>|0.5|) after HSV-1 (top) and TBEV (bottom) infection when
  compared to non-infected controls. The top 20 significantly altered genes are labelled
  with their gene name. (C) Top deregulated pathways enriched upon viral infection
  (HSV-1, TBEV) based on DEGs. (D) Targeted pathway analysis of DEGs (WT HSV-1-infected
  COs vs. corresponding non-infected controls) based on literature-defined AD-associated
  mechanisms ([40–43]; Table E)
