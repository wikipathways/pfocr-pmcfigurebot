figure_title: ROS-amplified photoimmunotherapy via IDO inhibition suppresses tumor
  margins beyond effective PTT and induces systemic antitumor immunity.
caption: ROS-amplified photoimmunotherapy via IDO inhibition suppresses tumor margins
  beyond effective PTT and induces systemic antitumor immunity. (a) Scheme of the
  preparation pathway of NLG919(IODI)/IR780 coloaded micelles and the mechanism by
  which the NLG919/IR780-micelle-mediated PTT, combined with immunotherapy, suppressed
  the growth of the tumor margin beyond effective PTT and the distal (or secondary)
  tumor. Arrows indicate the relationships and processes described in the schematic;
  their meanings are specified by the accompanying labels. (b) Tumor volume of the
  mice treated with saline and with PTT (partially treated). (c) Tumor volume of primary
  tumor and secondary tumor versus time, respectively (n = 6). (Adapted from [196],
  licensed under CC BY 4.0.)
