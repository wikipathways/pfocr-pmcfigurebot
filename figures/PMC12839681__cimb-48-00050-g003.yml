figure_title: Effects of BRC on skin barrier function and antioxidant enzyme activities
  in UV-irradiated HaCaT cells.
caption: Effects of BRC on skin barrier function and antioxidant enzyme activities
  in UV-irradiated HaCaT cells. (A) Representative Western blot images showing protein
  levels of NF-κB signaling pathway components (p-IκBα, IκBα, p-NF-κB, NF-κB), COX-2,
  and CerS4 (LASS4). (B–E) Quantification of Western blot results for key signaling
  molecules. (F–H) Production of pro-inflammatory cytokines TNF-α, IL-1β, and IL-6
  measured by ELISA. (I–K) Activities of antioxidant enzymes SOD, CAT, and GPx. Data
  are presented as mean ± SD (n = 3). Different letters indicate significant differences
  (p < 0.05). NC, normal control; C, UVB irradiation; PC, UVB irradiation + 100 μg/mL
  of L-ascorbic acid; BRC50, UVB irradiation + 50 μg/mL of BRC; BRC100, UVB irradiation
  + 100 μg/mL of BRC; BRC200, UVB irradiation + 200 μg/mL of BRC
