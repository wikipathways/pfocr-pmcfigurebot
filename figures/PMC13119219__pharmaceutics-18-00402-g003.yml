figure_title: Combinatorial therapeutic strategies targeting mitotic kinases (PLK1,
  AURKA, AURKB, MPS1) and kinesins (CENP-E, Eg5) in lung cancer.
caption: 'Combinatorial therapeutic strategies targeting mitotic kinases (PLK1, AURKA,
  AURKB, MPS1) and kinesins (CENP-E, Eg5) in lung cancer. Co-inhibition of these targets
  with chemotherapy, radiotherapy, tyrosine kinase inhibitors, BCL-2 family inhibitors,
  MEK and PI3K pathway inhibitors, immunotherapy, and tumor microenvironment modulators
  promotes antitumor efficacy through multiple mechanisms, including spindle and chromosome
  segregation disruption, DNA damage amplification, PARP-mediated repair impairment,
  caspase-dependent apoptosis, modulation of PI3K/AKT/mTOR and RAF/MEK/ERK signaling,
  AP-1 transcriptional regulation, suppression of ABC transporters, and activation
  of STING/TBK1/STAT1-driven inflammatory and interferon responses with enhanced MHC-I-mediated
  CD8+ T-cell recognition. These effects collectively lead to mitotic destabilization,
  cytotoxic cell death, reduced proliferation, altered metabolic stress, and potentiated
  immune-mediated tumor suppression. Abbreviations: ABC: ATP-binding cassette transporters;
  AKT: protein kinase B; AP-1: activator protein 1; BIM: BCL-2–interacting mediator
  of cell death; BRCA1: breast cancer gene 1; CAIX: carbonic anhydrase IX; c-FOS:
  FBJ murine osteosarcoma viral oncogene homolog; c-JUN: Jun proto-oncogene, AP-1
  transcription factor subunit; C-MYC: MYC proto-oncogene, bHLH transcription factor;
  CXCL1: C-X-C motif chemokine ligand 1; ERK: extracellular signal-regulated kinase;
  FOXO1/3: forkhead box O1/O3; IFN-β: interferon beta; MEK: MAPK/ERK kinase; MHC-I:
  major histocompatibility complex class I; mTOR: mechanistic target of rapamycin;
  p21: cyclin-dependent kinase inhibitor 1A; PARP: poly(ADP-ribose) polymerase; PD-L1:
  programmed death-ligand 1; PI3K: phosphoinositide 3-kinase; PRC1: protein regulator
  of cytokinesis 1; PUMA: p53 upregulated modulator of apoptosis; RAF: rapidly accelerated
  fibrosarcoma kinase; STAT1: signal transducer and activator of transcription 1;
  STING: stimulator of interferon genes; TBK1: TANK-binding kinase 1; TCR: T-cell
  receptor; VEGFR-A: vascular endothelial growth factor receptor A. Created in BioRender.
  Silva, P. (2026) https://BioRender.com/ghm4y8w (accessed on 22 January 2026)'
