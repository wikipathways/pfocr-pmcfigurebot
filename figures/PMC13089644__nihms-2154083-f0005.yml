figure_title: Loss of Ets1 in the endocardium suppresses the Notch1 signaling pathway
caption: '(A and B) (A) Feature and (B) dot plots showing the expression of Dlk1 and
  Dll4 in control and Ets1 endothelial conditional knockout (eKO) mice. (C-F) Representative
  confocal images of RNAscope in situ hybridization (ISH) for (C) Dlk1 and (E) Dll4,
  and quantification graphs of signal intensity for (D) Dlk1 and (F) Dll4 in the endocardium,
  showing the expression levels in control and Ets1 eKO mouse hearts at E14.5 (Control,
  n=6; eKO, n=6, respectively). Scale bars: 20 μm. (G) Schematic illustrating the
  culture of E9 mouse embryos. (H and I) (H) Representative confocal images of Notch1
  intracellular domain (N1ICD) immunofluorescence and (I) quantification graph of
  signal intensity for N1ICD in the endocardium of control and Dlk1-treated embryos
  (Control, n=6; Dlk1, n=6). C, chamber. Scale bars: 20 μm. (J and K) (J) Representative
  confocal images of N1ICD immunofluorescence and (K) quantification graph of signal
  intensity for N1ICD in the endocardium, showing the expression levels in control
  and Ets1 eKO mouse hearts at E14.5 (Control, n=6; eKO, n=6). Scale bars: 20 μm.
  (L) Dot plot showing the expression of Nrg1 and Rbpj. cvEC, coronary vascular endothelial
  cell; mEndo, mural endocardial cell; vEndo, valve endocardial cells; CZ, compact
  zone; TA, trabecular layer. For (D), (F), (I) and (K), data are presented as mean
  ± SEM and P values were calculated using an unpaired twotailed Student’s t-test'
article_title: Ets1-regulated endothelial-secreted factors promote compact myocardial
  growth and contribute to the pathogenesis of ventricular non-compaction
