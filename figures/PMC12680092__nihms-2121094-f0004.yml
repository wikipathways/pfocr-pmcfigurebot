figure_title: Timeline of key milestones in the microbial biosynthesis of therapeutic
  terpenoids, spanning from traditional medicinal use (500s) and early pharmacological
  discovery (1950s) to current achievements and future directions (2050s).
caption: 'Timeline of key milestones in the microbial biosynthesis of therapeutic
  terpenoids, spanning from traditional medicinal use (500s) and early pharmacological
  discovery (1950s) to current achievements and future directions (2050s). The timeline
  highlights advances for five plant-derived terpenoids: artemisinin (Artemisia annua),
  taxol (multiple Taxus species), vinblastine (Catharanthus roseus), QS-21 (Quillaja
  saponaria), and cyclopamine (multiple Veratrum species). Milestones are color-coded
  to indicate traditional medicinal use (gray), discovery of bioactivity (orange),
  elucidation of biosynthetic pathways (red), refactoring in engineered microbes (teal),
  and enabling technological developments (blue). Refactoring encompasses complete
  biosynthesis in microbes, high-titer achievements, and the production of key precursors
  and intermediates, such as artemisinic acid (artemisinin), taxadiene (taxol), and
  verazine (cyclopamine). Technological developments include advances in automation
  and biofoundries, as well as the application of machine learning to metabolic engineering.
  Dashed outlines denote future milestones, including complete microbial biosynthesis
  of taxol and cyclopamine, AI-aided optimization of an entire metabolic pathway,
  self-driving laboratory platforms, and the first FDA-approved, designed therapeutic
  terpenoid. Together, these milestones illustrate the accelerating pace of microbial
  terpenoid biosynthesis, driven by nearly a century of emerging advances and technological
  innovation since the first discovery of the therapeutic bioactivity of a plant terpenoid'
