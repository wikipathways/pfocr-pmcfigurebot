figure_title: Transient MR enhances the function of CD8+ T cells through the inhibition
  of the polyamine synthesis pathway.
caption: 'Transient MR enhances the function of CD8+ T cells through the inhibition
  of the polyamine synthesis pathway. A, Heat map showing the top 50 differentially
  abundant metabolites in activated mouse CD8+ T cells cultured in methionine-restricted
  (MR; 5 μM methionine) versus control medium (Ctrl; 100 μM methionine) for 40 hours
  (n=3, biological replicates). B, Pathway enrichment analysis reveals the most affected
  pathways under MR medium (5 μM methionine) for 40 h compared with those cultured
  in control medium (Ctrl, 100 μM methionine) for 40 hours (n=3, biological replicates).
  C, Schematic diagram showing the methionine cycle and the polyamine synthesis pathway.
  D-H, TIC-normalized concentration of metabolites in CD8+ T cells cultured under
  MR medium (5 μM Met) for 40 hours compared with those cultured in control medium
  (Ctrl, 100 μM Met). I, IFNγ expression in activated CD8+ T cells cultured under
  the following conditions: Ctrl (100 μM methionine), MR (5 μM methionine), SPM (30
  μM spermine), or MR + SPM (5 μM methionine + 30 μM spermine) (n=6). J, IFNγ expression
  in CD8+ T cells treated with MAT2A inhibitor (1 μM AGI-24512) with or without spermidine
  (SPD; 50 μM); vehicle control: 0.1% DMSO (n=9, biological replicates). K, IFNγ expression
  in CD8+ T cells electroporated with PBS (Ctrl) or CRISPR-Cas9 ribonucleoproteins
  targeting Amd1 (sgRNA1, sgRNA2) (n=3, biological replicates). Unpaired Student’s
  t-test (D-H) or one-way ANOVA with Holm-Šídák tests (I-K) were performed to determine
  statistical significance. *p ≤ 0.05, **p ≤ 0.01, ***p ≤ 0.001, ****p ≤ 0.0001. Error
  bars indicate standard deviation (SD)'
