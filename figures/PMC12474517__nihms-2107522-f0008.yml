figure_title: Ceramide signaling is associated with ECM remodeling in patients with
  MASLD
caption: (A) GSEA of MASLD-associated pathways in response to ceramide. The plot shows
  the top enriched pathways in the MASLD dataset associated with the CRS from a GSEA
  analysis using the GO BP gene sets. The top 20 path-ways both positively and negatively
  associated based on the NES for the pathways are shown. Bars represent individual
  pathways, with the length indicating the magnitude of the NES. The color gradient
  from blue to red represents the −log10(P value), with darker red indicating higher
  statistical significance. Positive NES values (right side) indicate up-regulation,
  and negative values (left side) indicate down-regulation. Collagen-related pathways
  are highlighted in bold. UV, ultraviolet; cAMP, cyclic adenosine 3′,5′-monophosphate.
  (B) IPA of top pathways associated with MASLD ceramide responsiveness. The plot
  displays pathways in the MASLD dataset associated with the CRS in an IPA pathway
  analysis ranked by their activation z-score, predicting the activation state of
  the pathway (activated or inhibited). Bars represent individual pathways, with the
  length corresponding to the absolute z-score. Color gradient from blue to red indicates
  the −log10(P value) of the enrichment, with darker red signifying higher statistical
  significance. Collagen-related pathways are highlighted in bold. GTPases, guanosine
  triphosphatases; MHC, major histocompatibility complex; L1CAM, L1 cell adhesion
  molecule; ER, endoplasmic reticulum; NAP1L1, nucleosome assembly protein 1-like
  1; PKR, RNA-activated protein kinase; cGAS-STING, cyclic GMP-AMP synthase–stimulator
  of interferon genes; HER-2, human epidermal growth factor receptor 2; REM, Rad and
  Gem-related GTP-binding protein; RHOGDI, rho guanine nucleotide dissociation inhibitor;
  CREB, cAMP response element–binding protein; AMPK, adenosine monophosphate-activated
  protein kinase; VEGF, vascular endothelial growth factor; eNOS, endothelial nitric
  oxide synthase; CDX, caudal type homeobox; TOB, transducer of ERBB2
