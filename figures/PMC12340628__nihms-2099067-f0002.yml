figure_title: IgA effector mechanisms against malaria parasites.
caption: 'IgA effector mechanisms against malaria parasites. This schematic illustrates
  three key IgA-mediated defense strategies. 1. First, IgA neutralizes Plasmodium
  sporozoites by binding surface antigens such as the circumsporozoite protein (CSP),
  thereby blocking liver-cell invasion. 2. Second, IgA triggers complement activation
  via the lectin and alternative pathways: IgA-coated parasites recruit mannose-binding
  lectin (MBL), leading to opsonization and membrane attack complex (MAC) formation,
  while properdin and C3b stabilize the alternative pathway. 3. Third, IgA’s Fc region
  binds FcaRI (CD89) on neutrophils and macrophages, promoting phagocytosis and respiratory
  burst. Source: Created with BioRender.com'
article_title: 'Targeting mucosal immunity in malaria control: the underexplored role
  of IgA'
