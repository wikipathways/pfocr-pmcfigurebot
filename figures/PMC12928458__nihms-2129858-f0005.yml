figure_title: Pathway enrichment analyses of proteomic data identify disrupted oxidative
  phosphorylation and Complex I dysfunction as key features of hyperoxia-induced injury
  in neonatal airway epithelial cells
caption: (A) Gene Ontology (GO) Biological Process enrichment analysis of all significant
  DEPs reveals significant overrepresentation of pathways involved in oxidative phosphorylation,
  NADH dehydrogenase activity, ATP biosynthesis, and electron transport. (B) Reactome
  pathway enrichment analysis of DEPs identifies significantly affected metabolic
  and mitochondrial processes, including respiratory electron transport, aerobic respiration,
  and Complex I biogenesis. Pathways are ranked by gene ratio and adjusted p-value.
  (C) Ingenuity Pathway Analysis (IPA) of DEPs highlight significantly altered biological
  functions and canonical pathways with activation z-scores indicating predicted directionality
  of pathway regulation
article_title: Quantitative Proteomics Links Mitochondrial Dysfunction to Metabolic
