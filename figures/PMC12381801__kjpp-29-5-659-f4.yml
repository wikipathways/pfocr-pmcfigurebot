figure_title: The inhibitory effect of AMP-activated protein kinase (AMPK) siRNA transfection
  on procyanidin B2 (PB2)-decreased cell proliferation
caption: 'Cells were transfected with control or AMPK siRNA for 48 h. After pre-treatment
  with PB2 (20 μM) for 1 h, cells were stimulated with platelet-derived growth factor-BB
  (PDGF-BB) (10 ng/ml) for 24 h. (A, B) Results of Western blot analysis indicated
  that AMPK activation inhibited the mammalian target of rapamycin (mTOR) signaling
  pathway. (C) PB2-activated AMPK decreased cell proliferation. (D) Cells were stained
  with anti-p- mTOR (green) and DAPI (blue). PDGF-BB-induced mTOR phosphorylation
  was inhibited by PB2 and transfection with AMPK siRNA restored the mTOR phosphorylation.
  Representative results are shown from three independent experiments (×200). *p <
  0.05 vs. control, **p < 0.05 vs. PDGF-BB alone, #p < 0.05 vs. PDGF-BB + PB2'
article_title: Procyanidin B2-induced LKB1-AMPK activation mitigates vascular smooth
  muscle cell proliferation through inhibition of mTOR signaling
