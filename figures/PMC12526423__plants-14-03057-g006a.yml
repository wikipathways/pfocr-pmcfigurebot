caption: 'Expression analysis of DEGs (FDR < 0.05, |log2Fold Change| ≥ 1) related
  to the plant-pathogen interaction pathway. Heatmaps show the Z-score normalized
  expression of genes that were significantly differentially expressed (False Discovery
  Rate, FDR < 0.05 and |log2Fold Change| ≥ 1) at one or more time points during A.
  alternata infection (3, 12, 19 dpi) compared to the uninoculated control (0 dpi).
  (A): DEGs encoding pattern recognition receptors (PRRs). (B): DEGs associated with
  the hypersensitive response (HR). (C): DEGs involved in cell wall reinforcement
  and cell death regulation. (D): DEGs related to defense-related gene induction,
  phytoalexin accumulation, and miRNA production'
