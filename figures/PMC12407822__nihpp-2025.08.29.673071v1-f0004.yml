figure_title: METTL13 knockdown caused dysregulation of pathways involved in malignant
  transformation and cancer progression
caption: 'A) Volcano plot of differentially expressed genes following METTL13 knockdown
  (shMETTL13, n=4) compared to the control (shCTRL, n=5) in human CD34+ HSPCs. Significance
  was calculated using unpaired two-tailed t-test, results are displayed as L2FC and
  negative log10 p-value (p <0.05).B) ORA of the top enriched KEGG pathways in shMETTL13
  compared to shCTRL. Created in R, with packages clusterprofiler and enrichPlot,
  statistics was set to: q.value <0.1, L2FC cutoff = 1, p-adjust method = BH.C) Network
  plot of the KEGG gene set pathways in cancer in shMETTL13 compared to shCTRL, nodes
  are colored by L2FC.D) ORA of disease ontologies focused on hematological malignances.
  Created in R, packages with clusterprofiler, DOSE and enrichplot, statistics were
  set to: q.value ≤ 0.1, L2FC cutoff = 1, p-adjust method = BH'
