figure_title: Tryptophan metabolic pathway.
caption: Tryptophan metabolic pathway. The schematic illustrates key enzymatic branching
  points. Tryptophan is initially converted to N-formylkynurenine by indoleamine 2,3-dioxygenase
  (IDO) or tryptophan 2,3-dioxygenase (TDO), then hydrolyzed to kynurenine (KYN) by
  formamidase. KYN undergoes KMO-mediated hydroxylation to form 3-hydroxykynurenine
  (3-HK), which is further metabolized to neurotoxic metabolites, including 3-hydroxyanthranilic
  acid (3-HANA) and quinolinic acid (QUIN). Alternatively, KYN is transaminated by
  kynurenine aminotransferases (KATs) to generate kynurenic acid (KYNA), conferring
  neuroprotection. A minor branch yields neurotransmitters such as serotonin and melatonin
