figure_title: IGFBPs’ role in vascular homeostasis and cardiovascular disease.
caption: 'IGFBPs’ role in vascular homeostasis and cardiovascular disease. (A) Angiogenesis—IGFBP-2
  is pro-angiogenic and promotes VEGF transcription. IGFBP-4, 5, and 6 inhibit angiogenesis;
  however, IGFBP-4 promotes VEGF-mediated angiogenesis in myocardial infarction. IGFBP-3
  and 5 inhibit VEGF signaling. IGFBP-7 binds to Activin A and inhibits angiogenesis.
  (B) Vasodilatation—IGFBP-3 contributes to the secretion of nitric oxide by binding
  to the scavenger receptor class B, type 1, thereby regulating vascular tone. (C)
  Cell differentiation—IGFBP-4 enhances cell differentiation by inhibiting β-catenin
  signaling. (D) Hypoxia—IGFBP-2 binds to IGF-1R and promotes HIF-1α transcription.
  HIF-1α regulates the expression of IGFBP-1, 2 and 6. IGBP-7 inhibits FOXO3a expression
  via the PI3K/AKT pathway, inducing senescence. (E) Apoptosis—IGFBP-1 is upregulated
  by HIF-1α, which in turn contributes to their apoptosis. IGFBP-3 is involved in
  ICAM1 suppression, preventing monocyte adhesion and limiting endothelial apoptosis.
  IGFBP-6 increases monocyte adhesion and apoptosis. (F) Inflammation—IGFBP-6 is pro-inflammatory.
  Via the JNK and NF-kB signaling, it is known to increase inflammation in the endothelial
  cells. Note: dashed lines represent signaling interactions. Arrows mean positive
  regulation and blunt arrows mean inhibition. STAT3 = Signal Transducer and Activator
  of Transcription 3; FOXO3a = Forkhead box O3; SMAD2/3 = Mothers Against Decapentaplegic
  Homolog 2/3; IGF-1R = Insulin-Like Growth Factor 1 Receptor; HIF-1α = Hypoxia-Inducible
  Factor 1-alpha; JNK = c-Jun NH-2 terminal kinase; MEKK = mitogen-activated protein
  kinase (MEK) kinase; VEGF = Vascular Endothelial Growth Factor; Sck = SH3 Domain-Containing
  Kinase-Binding Protein 1; VRAP = VEGF Receptor-Associated Protein; SRC = Sarcoma
  protein kinase; SR-B1 = scavenger receptor class B, type 1'
