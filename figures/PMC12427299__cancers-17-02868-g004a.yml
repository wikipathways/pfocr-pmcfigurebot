figure_title: PM promotes VEGFA overexpression through the MAPK pathway in the A549-PM
  cell line.
caption: PM promotes VEGFA overexpression through the MAPK pathway in the A549-PM
  cell line. A549-PM cells were treated with siRNA of different proteins of the MAPK
  pathway. (a) Cells were treated as indicated and expression of VEGFA mRNA was verified
  by qPCR. (b) Western blot shows VEGFA expression in differently treated cells. (c,d)
  Tube formation by EPCs treated with different CMs is shown with quantification of
  tube formation using ImageJ software. (e) ELISA result of VEGFA concentration in
  CM after treatment as indicated. (f–i) Tissues from xenograft tumors obtained from
  sacrificed mice and IHC-stained with VEGFA, CD133, and CD31. Red arrows are pointing
  to blood vessels. (* for p < 0.05, ** for p < 0.01, *** for p < 0.001, **** for
  p < 0.0001, ns for not significant). Original, uncropped Western blot images show
  in Supplemental Materials
