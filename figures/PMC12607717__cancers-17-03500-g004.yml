figure_title: Therapeutic mechanism of PARP inhibitors.
caption: Therapeutic mechanism of PARP inhibitors. PARP inhibitors disable the single-strand
  break repair mechanism via Ligase III, in normal cells and tumor cells alike. This
  leads to progression to double-strand DNA breaks. In normal cells, the BRCA-mediated
  pathway activates and repairs the damage via homologous recombination, mediated
  by Ligase I. In tumor cells with inactivated BRCA, this mechanism cannot initiate
  the repair, which leads to further DNA degradation and inevitably apoptosis; PARP—poly
  (ADP-ribose) polymerase, HR—homologous recombination, PCNA—proliferating cell nuclear
  antigen, MRN—MRE11-RAD50-NBS1 complex (created with Biorender.com accessed on 20
  September 2025)
