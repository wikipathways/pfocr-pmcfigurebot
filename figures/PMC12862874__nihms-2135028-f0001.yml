figure_title: Electrotransfection of DNA vaccine promotes EV secretion via activating
  the HSP90-p53-TSAP6 signaling pathway
caption: '(A) The numbers of EVs per mL of the C2C12 cell culture medium at 24 h post
  ET, n = 3. (B) Typical histograms of EV size distributions in the same medium samples.
  The samples were adjusted so that the total numbers of EVs in different groups were
  approximately the same. Cells in the “Sham” group received neither DNA nor ET. (C)
  The concentration of EVs in mouse gastrocnemius muscle at the indicated time points
  post ET. Sham muscle was injected with PBS without DNA and was not treated with
  electric pulses, n = 3–4. (D) Typical histograms of EV size distribution in the
  muscle at 24 h post ET. Samples in Sham and “DNA alone” groups were diluted 300-fold,
  and samples in “ET alone” and “DNA+ET” groups were diluted 3,000-fold prior to the
  size measurement. (E) Schematic illustration of the signal transduction pathways
  evolved in EV secretion post ET. (F) Western blot analysis showed increased HSP90,
  P53, and TSAP6 protein expression in C2C12 cells triggered by ET. Cells in the Sham
  or ET groups were collected and lysed at 12 h after the corresponding treatment,
  and proteins were extracted from each cell sample. Ten micrograms of protein was
  loaded into each lane in the gel for electrophoresis. (G) Western blot analysis
  shows increased expression of EV biogenesis-related proteins in cells, including
  HRS, STAM1, TSG101, CD9, and CD63, on EVs from C2C12 cells at 24 h post ET. The
  method for protein sample preparation is the same as that in (F). Cells in the Sham
  group did not receive DNA or ET. (H) qPCR analysis of the mRNA levels of Hsp90aa1
  (gene for HSP90), Trp53 (gene for P53), and Steap3 (gene for TSAP6) in cells at
  6 and 24 h after ET. n = 3. The data were normalized by that in the control group,
  in which cells were not treated with ET (dashed line). (I) C2C12 cells were treated
  with DMSO, tanespimycin (50 nM), or pifithrin-α (PFTα) HBr (10 μM) for 24 h before
  ET. Then, the cells were electrotransfected, followed by culturing in the medium
  supplemented with the same chemicals (DMSO, tanespimycin, or PFTα HBr) for another
  24 h. At the end of the culture, the numbers of EVs secreted to the medium were
  measured. n = 3. The bar and error bar represent the mean and the SEM, respectively.
  Statistical analysis: Student’s t test for (A), and one-way ANOVA for (C) and (I).
  p values are shown at each comparison'
