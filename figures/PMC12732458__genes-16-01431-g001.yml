figure_title: Workflow of the current study.
caption: Workflow of the current study. Individuals of European ancestry were genetically
  identified from the UK Biobank. Following imputation using a European reference
  panel and quality control, gender- and age-matched cases and controls were defined
  based on ICD-10 codes for both association analysis and polygenic risk score (PRS)
  evaluation. Common variants and selected high-impact rare variants were analyzed
  using genome-wide association study and variant collapsing analysis, respectively.
  Subsequently, lead SNPs and tag genes associated with ulcerative colitis (UC) were
  identified through gene function proximity analysis. The most significantly associated
  pathway was then determined using Ingenuity Pathway Analysis (IPA, version 01-23-01)
  on the resulting gene set. To develop a discriminative PRS, we applied multiple
  filtering conditions to SNPs from a large-scale UC genome-wide association study
  (GWAS), conducted by the International Inflammatory Bowel Disease Genetics Consortium
  (IIBDGC). The PRS was then evaluated in our UC cohort. Using the Mount Sinai BioMe
  Biobank, we further utilized significant variants and PRS results from our UC cohort
  to conduct variant-based and PRS-based phenome-wide association studies (PheWASs),
  aiming to identify potential comorbidities of UC. Finally, we assessed genetic correlations
  between UC and co-occurring conditions with UC identified from PheWASs
article_title: Unveiling Novel Traits Associated with Ulcerative Colitis via Phenome-Wide
  Associations Enhanced by Polygenic Risk Statistics
