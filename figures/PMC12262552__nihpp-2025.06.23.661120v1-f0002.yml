figure_title: Transcriptional profiling uncovers coupling of p53-R270H, but not R172H,
  to redox regulation
caption: '(A) Bulk RNA sequencing analysis was performed on four ID8 derivatives:
  WT, p53-KO, p53-R172H and R270H. Shown are differentially expressed genes (DEGs)
  and their hierarchical clustering. (B) The presented Volcano plot shows all top
  DEGs that differed between WT and p53-R270H cells. The vertical lines mark log2
  fold change of −1 and +1. (C) A comparative PROGENy analysis, which infers pathway
  activities from transcriptomics, was performed on the data shown in B. Note activation
  of the JAK/STAT and TGFβ signaling, as well as downregulation of Cdh1 (encoding
  E-cadherin) and the TNF-related apoptosis-inducing ligand (TRAIL) in ID8 p53-R270H
  cells. (D and E) The histogram on the left side indicates the top six canonical
  activated or inhibited pathways (absolute z-scores of 1 and −1, respectively) in
  ID8 p53-R270H as compared to wildtype ID8 cells. The right panel shows chord plots
  representing the same set of significant canonical pathways and displaying the relationship
  between individual pathways and relevant genes. (F) Immunoblotting analysis was
  performed with the indicated derivatives of ID8 cells to validate differential expression
  of the indicated EMT markers. GAPDH was used as the loading control. (G) Gene set
  enrichment analysis (GSEA) was applied on the DEGs of p53-R175H and p53-R273H mutated
  OvCa patients included in the TCGA dataset with both the KEGG pathways, as well
  as Hallmark gene sets. Shown is a positive enrichment score of the EMT related genes
  indicating that EMT related gene sets are altered at the top of the ranked list
  in the R273H cohort when compared to the R175H cohort. The grey lines are for individual
  hits, and the blue line represents the overall trend. (H) The indicated derivatives
  of ID8 cells were tested for ROS levels using either DCFH-DA or DHE, which quantify
  H2O2 and O2−, respectively. Shown are representative photomicrographs for one out
  of three experiments. Original magnification, 20x. Scale bar: 100-pixel size. The
  histograms summarize ROS quantification. *, p<0.05, **, p<0.01, ***, p<0.001'
