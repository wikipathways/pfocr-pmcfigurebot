figure_title: ETV4/LOXL2/NID1 promotes EMT aggressive phenotype in CRC by activating
  ERK signaling pathway.
caption: ETV4/LOXL2/NID1 promotes EMT aggressive phenotype in CRC by activating ERK
  signaling pathway. a-b. Silencing NID1 in stable ETV4 overexpression HCT116 and
  RKO cells, or upregulating NID1 in stable ETV4 knockdown HCT116 and RKO cells. The
  cell lysates were subjected to immunoblot analysis for detecting the expression
  of NID1, p-ERK, ERK, EMT markers. c-d. Immunoblotting was performed to determine
  ETV4, ERK1/2 and p-ERK1/2 in stable ETV4 overexpression and knockdown HCT116 and
  RKO cells. e. Silencing LOXL2 in stable ETV4 overexpression HCT116 and RKO cells,
  and immunoblotting was conducted to determine the protein expression of LOXL2, p-ERK
  and ERK. f. Overexpressing LOXL2 in stable ETV4 knockdown HCT116 and RKO cells,
  and immunoblotting was conducted to determine the protein expression level of LOXL2,
  p-ERK and ERK. g. Immunoblotting was performed to determine the protein expression
  of p-ERK, ERK, E-cadherin and Vimentin after U0126 (ERK inhibitor) treatment in
  stable ETV4 overexpression HCT116 and RKO cells
