figure_title: Joint analysis of metabolome and proteome of DEPs and DAMs.
caption: Joint analysis of metabolome and proteome of DEPs and DAMs. (A) Venn diagram
  of common KEGG pathway for DAMs and DEPs. (B) Top 20 common KEGG pathways of DAMs
  and DEPs enrichment. (C) Correlation network analysis was conducted on the top 30
  absolute value log2FC of proteome and metabolome; those exhibiting the maximum and
  minimum FC values were excluded to prevent potential distortion of the visualization
  results caused by extreme values. Each node denotes either a protein or a metabolite,
  with red circles representing metabolites and green circles representing proteins.
  Each line signifies the interaction between proteins and metabolites, where red
  lines denote positive correlations and green lines denote negative correlations
  and the width of the lines reflects the p-value
