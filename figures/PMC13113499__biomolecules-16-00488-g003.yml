figure_title: Anticancer mechanisms of ginkgetin (GK).
caption: Anticancer mechanisms of ginkgetin (GK). GK suppresses tumor cell proliferation,
  survival, migration and invasiveness by inhibiting oncogenic signaling pathways,
  including JAK2/STAT3, MAPK and FAK/STAT3/AKT. Meanwhile, GK triggers mitochondrial-dependent
  apoptosis through modulation of Bcl-2 family proteins and activation of caspases.
  Moreover, GK enhances the anticancer efficacy of cisplatin by promoting ferroptosis
  via suppression of the Nrf2/SLC7A11/GPX4 axis, thereby enhancing chemosensitivity
  and overcoming drug resistance. Created with BioRender. Sun, Z. (2026) https://app.biorender.com/illustrations/696f4198a93f5e17600f3c3a?slideId=f83d8a3d-b04f-4cfd-8f2c-3d76a99bbc30
