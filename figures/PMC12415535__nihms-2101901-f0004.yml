figure_title: Gene expression changes of cellular functions at the sample level across
  species and disease states
caption: '(a) CellSpectra p-values as an estimation of functional gene expression
  coordination changes in individual samples compared to a reference. Diseased humans
  and rodents were compared to a cross-species refence.(b) Gene expression coordination
  changes (R2, y-axis) in PT cells in “Response to ischemia” pathway. Diabetic mice
  (DKD, n = 26) and mouse acute ischemia injury (AKI) samples over time were plotted
  (x-axis). Red dots indicate padj < 0.05, blue dots > 0.05.(c) Boxplots showing the
  number of significantly changed gene sets (padj < 0.05) in PT cells, per samples
  over the AKI time course (n = 3 biological replicates per time point, with some
  having two libraries from the same sample).(d) Radar plots: the axes represent cell
  types, the data points represent the number of pathways with significant coordination
  changes (padj < 0.05), the max scale is 1200 gene sets, left: db/db; right: db/db
  + Renin AAV mouse. Cell types with less than 10 cells are not included into the
  analysis (highlighted in red).(e) Boxplots showing the number of significant gene
  sets with coordination changes (padj < 0.05) per sample in diabetic rats (DKD) and
  diabetic rats treated with soluble guanyl cyclase activator (sGCact) or stimulator
  (sGCstim) in each cell type (n = 3 biological replicates per group).(f) Scatter
  plots with group comparison. Experimental groups or conditions (x-axis) including
  diabetic rats (DKD), treated with soluble guanyl cyclase activator (sGCact) or stimulator
  (sGCstim). Change in coordination as R2 (y-axis). Examples include Podocyte “SMAD
  protein signal transduction” and PT “Smooth muscle cell differentiation”. Dots show
  individual samples (n = 3 biological replicates per group), red dots indicate padj
  < 0.05. Bars indicate the mean R2 per group.Statistics in (b)–(f) were obtained
  from the CellSpectra sample-level analysis and FDR-corrected for multiple pathway
  testing. Box plots in (c) and (e) show the median (center line), quartiles (box
  limits), and whiskers, which extend to the minimum and maximum values within 1.5×IQR.
  Data points outside this range are plotted as outliers'
