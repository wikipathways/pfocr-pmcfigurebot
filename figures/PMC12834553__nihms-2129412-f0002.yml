figure_title: Influence of phytochelatin 2 (PyC) on the liver metabolome.
caption: Influence of phytochelatin 2 (PyC) on the liver metabolome. A) Heat map of
  unsupervised, two-way hierarchical clustering of metabolic features found significantly
  differentially abundant between mice with (PyC) or without (Ctrl) dietary PyC supplementation.
  Normalized metabolic feature intensities are repre- sented by z-score, and dendrograms
  across feature and sample axes provided. Major clusters (C1–3) formed by clustering
  of metabolic features are highlighted to the right of the map. B-C) Selenometabolites
  found differentially abundant in the liver following PyC supplementation, B) Selenosugar
  3 (m/z 334.9434, 60 s, M + 2K-H, Schymanski Level 4) and C) selenomethionine (m/z
  261.0113, 59 s, M+ACN+Na, Schymanski Level 1). Bars represent mean ± SEM. D) Pathways
  found significantly affected by PyC supplementation using pathway enrichment analysis.
  The ratio of selected metabolites mapped to the listed pathway over the number of
  total pathway metabolites detected is provided to the right of each pathway name.
  * denotes p < 0.05. n = 10 for all panels. Individual measures supplied as black
  dots for panels B-C
