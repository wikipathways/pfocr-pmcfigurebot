figure_title: Schematic illustration of the mRNA export pathway
caption: 'This can be subdivided into four stages: (i) generation of mature messenger
  ribonucleoproteins (mRNPs) involving 5′ capping, 3′ polyadenylation, splicing, and
  with the addition of Yra1, the TREX complex, SR proteins, and Nab2. Although these
  modifications mostly take place co-transcriptionally, some also take place subsequently.
  (ii) Generation of an export-competent mRNP in which Yra1 and the TREX complex are
  removed and the Mex67-Mtr2 nuclear export factor is attached. (iii) Export to the
  cytoplasm though the NPC transport channel facilitated by the interaction between
  Mex67–Mtr2 and the FG-nucleoporins that overcomes their barrier function. Finally,
  (iv) disassembly of the mRNP at the NPC cytoplasmic face mediated by Dbp5, Gel1,
  and IP6 removes Mex67–Mtr2 and Nab2, and releases the transcript into the cytoplasm
  for translation and prevents its return to the nucleus. Figure modified from [2].
  Abbreviations: CTD, C-terminal domain; IP6, inositol hexakisphosphate; NPC, nuclear
  pore complex; SR proteins, Ser/Arg-rich proteins; TREX complex, transcription-export
  complex'
article_title: 'From transcription to export: mRNA’s winding path to the cytoplasm'
