figure_title: Summary of differential analysis of gene expression data in seven major
  cell-type families, highlighting the neurodegenerative impact of HIV even in virally
  suppressed individuals.
caption: Summary of differential analysis of gene expression data in seven major cell-type
  families, highlighting the neurodegenerative impact of HIV even in virally suppressed
  individuals. (a) Genes with maximum significant changes in the seven cell-type families.
  (b) Total number of significant (filtered at p-value 0.05) DEGs (differentially
  expressed genes) found in each cell-type family. A predominant downregulation was
  observed, particularly in vascular cells and neurons, suggesting a broad inhibitory
  effect on gene expression. (c) Intersection of the overall set of genes in the neurons,
  glia, immune cells (microglia, macrophages, T-cells, B-cells and myeloid cells)
  and vascular cells. Neurons had the maximum number of genes unique to them while
  glia had a relatively smaller percentage of genes unique to them (700 out of 2360).
  (d, e, f, g, h) GSEA pathways that are commonly dysregulated in all cell-type classes
  (FDR <= 0.05). (d) Gene Ontology Biological Processes; (e) Gene Ontology Cellular
  Component; (f) Gene Ontology Molecular Function; (g) Kyoto Encyclopedia for Genes
  and Genomes; (h) Wiki Pathways; (i, j, k, l) GSEA plots indicative of the downregulation
  of pathways of neurodegeneration in excitatory neurons, the GSEA algorithm was employed
  using the differential expression signature of all the excitatory neurons’ subtypes
  and for genes dysregulated in multiple subtypes we retained the signature indicative
  of maximum dysregulation - (i) Alzheimer’s Disease, (j) Parkinson’s Disease, (k)
  Huntington’s Disease, and (l) Prion Disease. The leading edge genes that drive the
  pathways in (i) through (l) are shown in Supplementary Figure-1
article_title: Single-Cell Multi-Modal Differential Analysis of the Human Neo-Cortex
  in HIV Infection Reveals Similarities with Hallmarks of Alzheimer’s Disease
