figure_title: Pgr+ fibroblasts may communicate with Pgr– fibroblasts and mesothelial-like
  cells to promote profibrotic behavior
caption: '(A–C) Visualization of cell-cell communication between Pgr+ fibroblasts,
  Pgr– fibroblasts, and mesothelial-like cells using CellChat, comparing communication
  networks between Vehicle (Veh), E2 + P4 (EP), and E2 + P4 + RU486 (EPR) LAM. Circle
  plots with (A) Pgr+ fibroblasts, (B) Pgr– fibroblasts, and (C) mesothelial-like
  cells as the central outgoing nodes. Interactions between pairs of cell types are
  depicted by a line connecting the 2 cell types, with line thickness indicating the
  strength of the interaction. (D) Signaling pathways enriched within the Pgr+ fibroblast,
  Pgr– fibroblast, and mesothelial-like communication network of Veh, EP, and EPR
  LAM. Black arrow emphasizes the TGF-β pathway. (E) Relative contribution of TGF-β
  pathway ligand-receptor pairs in Veh (red), EP (green), and EPR (blue) LAM. Upregulated
  Tgfb2-(Tgfbr1+Tgfbr2) interaction in EP LAM is highlighted (black arrow). (F) Xenium-based
  spatial transcriptomics showing localization of Tgfb2-expressing Pgr+ fibroblasts
  (Fbn1+ or Itgbl1+, Pgr+; red dashed circle) with Tgfbr2-expressing Pgr– fibroblasts
  (Fbn1+ or Itgbl1+, Pgr–; light gray dashed circle), and mesothelial-like cells (Wt1+;
  cyan dashed circle) in EP LAM, but not in the Veh or EPR LAM controls. The software
  uses DAPI to determine the extent of the nucleus (light blue staining). Colored
  dots, each representing an individual mRNA transcript of a gene, are emphasized
  with similarly colored arrows. (G and H) Comparison of Tgfb2 and Tgfbr2 expression
  in Veh, EP, and EPR LAM for (G) Pgr– fibroblasts and (H) mesothelial-like cells
  on Xenium-based spatial transcriptomics. Scale bars: 20 μm. n = 3–4/group'
