figure_title: Amelioration of SR-Gut-aGVHD by Ceacam1 deficiency in IECs is associated
  with distinct CD4+ Tcon cells and pTreg subsets and gene signaling pathways in MLN
  cells
caption: WT and IEC-Ceacam1–/– (CC1–/–) chimeras were engrafted with donor cells and
  treated with 4-DEX as described for Figure 3. On day 25, CD4+ T cells from MLNs
  of WT or IEC-CC1–/– recipients were sorted for scRNA plus ATAC sequencing. (A) Subclustering
  t-SNE of all CD4+ T cells. The 15 clusters are indicated. (B) t-SNE plot of cell
  cycle. (C) Comparison of percentage of individual cluster of cell cycle. (D) Dot
  plot of immunomodulatory genes across all clusters. (E) Heatmap showing the differential
  transcription factor motif accessibility. (F) t-SNE showing the lineage trajectory
  ordered from naive cells to Tregs (cluster 14) or effector T cells (other clusters).
  The diagram shows changes in CD4+ T clusters in Ceacam1–/– chimeras compared with
  WT chimeras. ↑, increase; ↓, decrease; C1, naive T cells; C3, cycling CD4+ T cells
  (Ceacam1–/– chimera only); C5, G1 resting Th17; C7, Th1-, Th2-, Th17-, and Th22-like;
  C8, Th2; C11, G2M/S proliferating Th17; C12, anergic Th1; C13, Th1; C14, pTregs.
  (G) Comparison of percentages of individual clusters. (H) Bubble plot showing enriched
  KEGG, REACTOME, and HALLMARK signature pathways by comparing IEC-CC1–/– and WT.
  (I) Dot plot of immunomodulatory genes of clusters 5, 12, and 14, comparing IEC-CC1–/–
  and WT. (J and K) GSEA plot of HALLMARK apoptotic pathway (J) and BP_GO oxidative
  phosphorylation pathway (K) of cluster 14 by comparing IEC-CC1–/– recipients with
  WT recipients. abs(NES), absolute value of normalized enrichment score
