caption: Network visualization of target genes associated with DE miRNAs in the (A)
  p53, (B) TGF-β, (C) PI3K-Akt and (D) Hippo signaling pathways. The network visualization
  represents the results of pathway enrichment analysis conducted using DIANA-miRPath
  (v3.0) to identify target genes associated with the six-miRNA signature. DE miRNAs
  and their target genes involved in the p53, TGF-β, PI3K-Akt and Hippo signaling
  pathways were selected and visualized using Cytoscape (v3.10.3). In the network,
  edges represent the miRNA–gene interactions
