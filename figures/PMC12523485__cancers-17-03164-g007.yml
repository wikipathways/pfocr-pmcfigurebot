caption: 'Observation of the spatial distribution of T cells, Hh-activated fibroblasts,
  and gastric cancer cells via spatial transcriptomics and mIHC. (A) Spatial transcriptomics
  data of T cells, MMP1 + FIB, and gastric cancer cells in gastric cancer pathological
  sections. (B) mIHC staining of 3 gastric cancer tissue sections. Cell nuclei: DAPI
  (blue fluorescence). T cells: CD3 (green fluorescence), CD8 (white fluorescence).
  Fibroblasts: α-SMA (yellow fluorescence). Molecular marker for Hedgehog signaling
  pathway activation: GLI1 (red fluorescence). (C) Fluorescence intensity distribution
  curve showing the spatial distribution relationship between GLI1-positive fibroblasts
  and T cells. (D) Fluorescence intensity distribution curve showing the spatial distribution
  relationship between GLI1-negative fibroblasts and T cells. FIB, fibroblast'
