figure_title: Knockdown of POSTN blocks the JAK-STAT signaling pathway in KFs.
caption: Knockdown of POSTN blocks the JAK-STAT signaling pathway in KFs. (A) JAK-STAT
  pathway was revealed to be associated with POSTN knockdown in KFs by gene set enrichment
  analysis. (B) Heatmap showing DEGs related to the JAK-STAT pathway in si-POSTN and
  si-CTL KFs. Three independent RNA-sequencing experiments are shown in each group.
  (C) Reverse transcription-quantitative PCR analysis was performed to validate the
  DEGs related to the JAK-STAT pathway in si-POSTN- and si-CTL-transfected KFs (n=3).
  (D) Representative western blotting and semi-quantification of the protein levels
  of p-STAT1 (Tyr701) and p-STAT1 (Ser727) in KFs transfected with si-POSTN and si-CTL
  in the presence or absence of IFNα +β treatment (n=3). Data are presented as the
  mean ± SEM. ***P<0.001, **P<0.01, *P<0.05. DEGs, differentially expressed genes;
  KFs, keloid fibroblasts; NS, not significant; p-, phosphorylated; POSTN, periostin;
  si, small interfering
