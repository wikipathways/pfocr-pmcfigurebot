figure_title: The relationship between the non-canonical NF-κB pathway and cardiovascular
  diseases.
caption: 'The relationship between the non-canonical NF-κB pathway and cardiovascular
  diseases. (A) Key signaling steps in the non-canonical NF-κB pathway: NIK stabilization
  promotes the phosphorylation of the p100 precursor, which is mediated by IKKα. Then,
  it leads to p100 processing into the mature p52 subunit. p52 with RelB forms a heterodimer
  and does downstream transcription. (B) The results of pathway activation are to
  induce inflammation and promote chronic endothelial activation and vascular remodeling.
  This will cause cardiovascular diseases'
