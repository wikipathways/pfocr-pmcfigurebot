caption: ANGII Modulation of IL-6 via AT1R and AT2R Pathways, adapted from prior studies.
  AT1R-driven signaling via PKC, STAT1, and NF-κB promotes IL-6 and COX-2 expression,
  whereas AT2R-mediated PPARγ activation and NF-κB suppression counteract inflammation.
  Although current evidence highlights these opposing mechanisms, further mechanistic
  mapping and disease-specific studies are needed to fully delineate these pathways
