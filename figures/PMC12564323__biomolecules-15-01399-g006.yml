caption: Predicted canonical pathways associated with the differentially expressed
  proteins in the female cohort are shown in (a). The activated pathways include cachexia
  signaling pathway, neutrophil degranulation pathway, class I MHC-mediated antigen
  processing and presentation pathway, integrin signaling pathway, and ribosomal quality
  control pathway. (b,c) present the key upstream transcription regulators and related
  diseases and functions identified in the female cohort. Orange color depicts activation,
  while blue represents inhibition. (d) displays boxplots highlighting several significantly
  altered proteins involved in the pathways, diseases, and functions in the female
  cohort (*—p-value < 0.05; **—p-value < 0.01)
