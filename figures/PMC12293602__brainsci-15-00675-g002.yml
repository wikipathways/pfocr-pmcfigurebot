figure_title: Inflammatory signaling pathways involved in microglial regulation by
  APOEε4.
caption: Inflammatory signaling pathways involved in microglial regulation by APOEε4.
  In microglia, LPS binding to TLR4 activates NF-κB and p38 MAPK signaling pathways,
  driving pro-inflammatory cytokine release (TNF-α, IL-1β, IL-6) and NLRP3 inflammasome-dependent
  IL-1β secretion—processes significantly exacerbated by APOEε4. Additionally, APOE4
  disrupts mitochondrial autophagy, leading to ROS accumulation, which amplifies inflammatory
  signaling through NF-κB positive feedback, while mitochondrial damage releases DAMPs
  that further activate inflammasomes. Furthermore, the APOE4 proteolytic fragment
  nAPOE41–151 directly binds the TNF-α-promoter to enhance its expression, and APOE4-LilrB3
  interaction promotes microglial activation and pro-inflammatory polarization. Notably,
  APOEε4 also enhances HIF-1α activity, inducing glycolytic reprogramming that sustains
  microglial inflammatory responses
