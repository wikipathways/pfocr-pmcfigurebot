figure_title: Inhibition of Hm-mediated p-tau accumulation by UA is not reproduced
  by xanthine or allantoin.
caption: |-
  Inhibition of Hm-mediated p-tau accumulation by UA is not reproduced by xanthine or allantoin. (a) Simplified metabolic pathway of purine degradation with the chemical structures of UA, XANT, and ALTN. DMUA is a synthetic analog of UA. * In humans, the presence of ALTN reflects the non-enzymatic oxidative catabolism of UA. ROS: reactive oxygen species. (b) Estimation of p-tau accumulation (AT8) in div10 cortical cultures treated repeatedly at div7, 8, and 9 with Hm (3 µM) in the presence or not of UA (30 µM), XANT (30 µM), ALTN (30 µM), or DMUA (30 µM). (c) ROS emission in div10 cortical cultures undergoing the same treatments as in (b). The oxidizer H2O2 (50 µM) applied acutely for 4 h to the cultures is used as a positive control for ROS emission. (b,c) Data expressed in numbers of p-tau+ somas/cm2 (b) or ROS levels (c) in div10 cultures are presented as the mean ± SEM. One-way ANOVA followed by post hoc Tukey’s test: *** p < 0.001 vs. NT, ###
  p < 0.001 vs. Hm. (d) Upper panel: Representative microphotographs showing the impact of test treatments on p-tau accumulation in div10 cortical cultures exposed to 3 µM Hm in the presence or not of the different purine derivatives. Lower panel: Same cell culture field where the p-tau immunosignal is combined with MAP-2 immunolabeling. White arrows point to cortical neurons accumulating p-tau in their somas. The white dotted line shows the boundaries of neuronal cell bodies with a near absence of p-tau immunostaining
