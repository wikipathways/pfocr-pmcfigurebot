figure_title: The product derived from dybA is a RiPP-lipoprotein
caption: 'a Sequence and SignalP 6.0 prediction of DybA, showing the N-terminal positively
  charged sequence, the hydrophobic helix, the lipobox motif, the invariant internal
  cysteine, and the cargo peptide. The modified CPACGMG motif is bolded at the end
  of the peptide. b Proposed biosynthetic pathway for DybA maturation via the gram-negative
  bacterial lipoprotein pathway. DybA is first modified by cytosolic DybH before modification
  with a diacylglyceryl group (blue) by prolipoprotein diacylglyceryl transferase
  (Lgt), signal peptide cleavage by lipoprotein signal peptidase (LspA/SPII), N-acylation
  (red) by apolipoprotein N-acyltransferase (Lnt), and potential transport to the
  outer membrane and extracellular space. Inset: Structure of the modified N-terminal
  Cys in a triacylated lipoprotein containing an S-diacylglycerol and N-acyl group.
  c Ponceau S stained nitrocellulose membrane showing the eluate from lipo-DybAH IMAC
  purification, following transfer from a 16.5% tris-tricine gel. An arrow points
  to the band corresponding to lipo-DybAH, which was excised for LysC digestion and
  MS/MS identification. d MALDI-TOF MS of lipidated DybAH purified from E. coli using
  Ni-affinity chromatography. The eluate precipitated and both the soluble (upper
  trace) and insoluble fraction (lower trace) were desalted and analyzed by mass spectrometry.
  e Isolated lipo-DybA shows the presence of at least four differently lipidated species,
  with the major species containing C16:1, C16:0, C16:0 acyl chains. f LysC-digest
  of the lipoprotein-enriched fraction shows that lipidated DybA is partially unmodified
  (tan) and partially modified (teal) by DybH. g MALDI-TOF MS/MS tandem mass spectrum
  of the excised lipo-DybAH nitrocellulose band following LysC digestion, showing
  the triacylated form of lipo-DybAH [C16:1, C16:0, C16:0]. A fragmentation ion corresponding
  to loss of a C2H2S group, and the immonium ion (Im.) of histidine were also detected'
