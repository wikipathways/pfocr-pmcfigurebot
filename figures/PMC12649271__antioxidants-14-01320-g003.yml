figure_title: Role of PPARα/γ signaling in CHA-enhanced fatty acid metabolism and
  reduced inflammation in the skin of a photoaged mouse model.
caption: 'Role of PPARα/γ signaling in CHA-enhanced fatty acid metabolism and reduced
  inflammation in the skin of a photoaged mouse model. (A) Heatmap showing represented
  DEGs involved in fatty acid biosynthesis and β-oxidation according to the KEGG pathways.
  Each column represents the mean expression of a single gene from three independent
  biological replicates per condition (n = 3). Red represents a higher level of gene
  expression. Blue represents a lower level of gene expression. (B) Gene set enrichment
  analysis (GSEA) plot for the PPAR signaling pathway (CHA vs. MC). ES: enrichment
  score. NES: normalized enrichment score. FDR: false discovery rate. (C) DEGs involved
  in the CoA biosynthesis pathway. (D,E) Western blot analysis of PPARα and PPARγ
  protein expression in the mouse skin from NC, MC, and CHA groups. The results are
  normalized to GAPDH and shown as mean ± SD (n = 3). (F) Heatmap of downregulated
  DEGs related to skin inflammation according to the KEGG pathways. (G) Western blot
  analysis of p38 MAPK activity in mouse skin from NC, MC, and CHA groups. Quantification
  data (normalized to p38 MAPK) are presented as mean ± SD (n = 3). (H,I) Validation
  of DEGs by qRT-PCR. Gene expression levels were quantified using qRT-PCR and normalized
  to GAPDH. Data are presented as mean ± SD from three independent experiments (n
  = 3). * p < 0.05, ** p < 0.01, *** p < 0.001, compared to the MC group'
