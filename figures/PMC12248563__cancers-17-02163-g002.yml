figure_title: Cell Line Mapping of Colorectal Cancer Progression Through Driver Mutations.
caption: Cell Line Mapping of Colorectal Cancer Progression Through Driver Mutations.
  This diagram illustrates the progression of CRC from healthy colon epithelium to
  metastasis, highlighting key driver mutations and the cell lines best suited to
  model each stage. It connects specific mutations to pathway activations described
  in Figure 1. Notably, the signaling pathways detailed in Figure 1 are central to
  this progression, as mutations in genes like APC initiate the process via Wnt/β-catenin
  activation, followed by KRAS mutations driving further progression through MAPK
  signaling. Accumulation of mutations, including TP53 loss, ultimately leads to metastasis,
  demonstrating the interconnected roles of these pathways in the multistep development
  of CRC. The figure provides a resource for selecting appropriate cell lines when
  studying the chronological molecular events in CRC tumorigenesis
