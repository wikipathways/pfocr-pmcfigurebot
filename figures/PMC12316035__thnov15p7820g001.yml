figure_title: Cisplatin chemotherapy induces ferroptosis in human and mouse granulosa
  cells.
caption: Cisplatin chemotherapy induces ferroptosis in human and mouse granulosa cells.
  A-B Volcano plot (A) and KEGG pathway enrichment analysis (B) of DEGs identified
  by RNA-seq in cisplatin-treated human primary granulosa cells. C-D Heatmap of differentially
  expressed genes (C) and proteins (D) identified by RNA-seq and LC-MS analysis, respectively,
  in mouse ovaries treated with or without cisplatin for 14 days. E-F Venn diagram
  analysis (E) and representative protein-protein interaction (PPI) networks (F) for
  136 overlapping differentially expressed genes and proteins, highlighting key pathway
  underlying cisplatin-induced ovarian injury. G EdU staining and statistical analysis
  of KGN cells. H Lipid peroxidation measured using BODIPY 488/561 C11 staining. I
  Measurement of MDA content using the Lipid Peroxidation MDA Assay Kit. J-K Evaluation
  of Fe²⁺ content using Phen GreeTMSK. L Mitochondrial staining of KGN cells using
  Mito-Tracker Red. M Categorization of mitochondria within KGN cells. N Analysis
  of mitochondrial footprint. O Intracellular ROS levels in KGN cells measured using
  the Reactive Oxygen Species Assay Kit. P Assessment of mitochondrial membrane potential
  using the JC-1 assay kit
