caption: RT-qPCR validation of key defense-related gene expression in GhSTZ-silenced
  plants. (a) Expression levels of genes involved in the pentose and glucuronate interconversion
  pathway. (b) Expression levels of genes involved in the phenylpropanoid biosynthesis
  pathway. (c) Expression levels of genes involved in the plant–pathogen recognition
  pathway. pTRV2::00 plants served as the control (CK), while pTRV2::GhSTZ plants
  represented the silenced group (S). Data are presented as mean ± SD (n = 3 biological
  replicates). Different lowercase letters indicate statistically significant differences
  (p < 0.05)
