figure_title: The mechanism of AhR mediating lipid peroxidation-ferroptosis via CYP1,
  SLC7A11/GPX4 axis, or HMOX1 heme metabolism by different ligands in different disease
  states.
caption: The mechanism of AhR mediating lipid peroxidation-ferroptosis via CYP1, SLC7A11/GPX4
  axis, or HMOX1 heme metabolism by different ligands in different disease states.
  AhR modulates the expression of diverse target genes across various contexts, consequently
  influences ferroptosis in distinct disease processes. IS triggers ferroptosis in
  MC3T3-E1 cells by activating the SLC7A11/GPX4 signaling pathway via AhR. In renal
  tubular epithelial cells and liver I/R injury, suppression of the AhR signaling
  pathway mitigates the extent of damage. Under the condition of oxidative stress
  of intestinal epithelial lymphocytes, inhibition of AhR signaling can alleviate
  intestinal epithelial lymphocytes ferroptosis by reducing ROS production. Butylphthalide
  exerts an inhibit effect on neuronal ferroptosis in traumatic brain injury by inhibiting
  the AhR-CYP1A-ROS axis. AhR, aryl hydrocarbon receptor; SLC7A11, solute carrier
  family 7 member 11; GPX, glutathione peroxidase; HMOX1, heme oxygenase 1; I/R, ischemia/reperfusion;
  ROS, reactive oxygen species
