figure_title: FA diminishes ferroptosis susceptibility of HSCs.
caption: FA diminishes ferroptosis susceptibility of HSCs. (A,B) Transcriptomic profiling
  of BM HSCs of Ctrl and l-FA-treated mice. (C) Downregulated signaling pathways as
  revealed by KEGG pathway enrichment analysis in BM HSCs of l-FA-treated versus Ctrl
  mice. (D) Membrane lipid peroxidation as reflected by BODIPY 581/591 C11 staining
  in BM HSCs of Ctrl and l-FA-treated mice. Scale bar, 10 μm (upper panel). Scale
  bar, 5 μm (down panel). (E,F) Flow cytometric quantification of membrane lipid peroxidation
  (E) and cell death (F) in BM HSCs of Ctrl and l-FA-treated mice (n = 6). (G,H) Ferroptosis
  susceptibility analysis of BM HSCs in Ctrl and l-FA-treated mice (n = 4). Data represent
  mean ± SD. ** p < 0.01, ns, no significance. Two-tailed unpaired Student’s t-test
