caption: Graph of differentially expressed genes analyzed in group B\A. (a) the Venn
  diagram of gene co-expression. The graphs showed the number of genes uniquely expressed
  in each group, and the overlapping areas showed the number of genes co-expressed
  in two groups. (b) the volcano map of differential genes. The X-axis was the log2Fold
  Change value, and the Y-axis was the −log10 padj or −log10 p-value. The blue dashed
  line indicated the threshold line for the differential gene screening criteria.
  (c) the scatter plot of GO pathway enrichment. (d) the scatter plot of KEGG pathway
  enrichment. In (c,d), the X-axis was the Gene Ratio, and the Y-axis was the name
  of the pathway. The size of the padj was indicated by the color of the dots. The
  smaller the padj was, the closer the color was to red. The number of differential
  genes contained under each pathway was indicated by the size of the dots
