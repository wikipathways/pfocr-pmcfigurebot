figure_title: Role of IGF2-mediated signaling pathways in CKD.
caption: Role of IGF2-mediated signaling pathways in CKD. This figure delineates the
  dual roles of IGF2 signaling in CKD, encompassing both primary and hyperglycemia-induced
  secondary mechanisms. In primary CKD, IGF2 binding to IGF1R activates PI3K/Akt and
  MAPK pathways, promoting podocyte detachment, mesangial cell hypertrophy and excessive
  ECM accumulation, ultimately compromising glomerular filtration barrier integrity.
  Furthermore, IGF2 synergizes with TGF-β to upregulate fibronectin and type I collagen,
  accelerating renal fibrosis. Conversely, signaling through IGF2R activates the GSK3
  pathway, inducing anti-inflammatory macrophage differentiation and modulating mitochondrial
  metabolism, which may confer protective effects. In hyperglycemia-induced CKD, IGF2
  binding to IGF1R and IR-A drives pathological mesangial cell proliferation and ECM
  accumulation. This process is exacerbated by loss of PTEN-mediated negative feedback.
  Concurrently, SPARC is upregulated as a compensatory repair mechanism. Additionally,
  hyperglycemia enhances autocrine IGF2 secretion by CD34+ TIP cells, facilitating
  phenotype maintenance and angiogenesis. These findings underscore the multifaceted
  role of IGF2 in CKD pathophysiology, highlighting its potential as a therapeutic
  target. IGF, insulin-like growth factor; CKD, chronic kidney disease; IGF1R/IGF2R,
  IGF1/2 receptor; OXPHOS, oxidative phosphorylation; v-ATPase, vacuolar-type ATPase;
  TIP cell, tip endothelial cell; SPARC, secreted protein acidic and rich in cysteine;
  IR-A, insulin receptor isoform A; ECM, extracellular matrix; PTEN, phosphatase and
  tensin homolog on chromosome 10
