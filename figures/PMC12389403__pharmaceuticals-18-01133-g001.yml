figure_title: Schematic representation of cardiomyocyte metabolic maturation.
caption: Schematic representation of cardiomyocyte metabolic maturation. In immature
  cardiomyocytes, GLUT1 (yellow) is the major glucose transporter in the plasma membrane,
  and glycolysis is the main metabolic pathway. In adult cardiomyocytes, the oxidative
  phosphorylation of fatty acids is the primary energy source, and CD36 (light blue)
  mediates fatty acid uptake. The uptake of glucose in adult cardiomyocytes is mediated
  by the insulin-dependent transporter GLUT4 (purple). Image created with Canva.com
