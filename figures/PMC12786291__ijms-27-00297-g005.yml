figure_title: AAE inhibited polyol pathway activity and glycogen accumulation in HFD/STZ
  mice.
caption: |-
  AAE inhibited polyol pathway activity and glycogen accumulation in HFD/STZ mice. The levels of aldose reductase (a), fructose (b), methylglyoxal (c), and carboxymethyl-lysine (d) were detected by a commercially available ELISA kit. (e) Pathological changes were evaluated by periodic acid–Schiff (PAS) staining, showing glycogen accumulation and abnormal polysaccharides (400× magnification). (f) PAS-positive areas in kidney tissues were quantified. Data were collected per group and are presented as the mean ± SD (n = 5), derived from five independent biological replicates. #
  p < 0.05, ##
  p < 0.01 versus the control group; * p < 0.05, ** p < 0.01 versus the model group. AAE: Artemisia indica Willd. aqueous extract; HFD: high-fat diet; PAS: periodic acid–Schiff; STZ: streptozotocin
