figure_title: Differential expression of enzymes and small molecules in the KEGG flavonoid
  biosynthesis pathway (71–73) upon treatment with jasmonic acid or jasmonic acid
  and bloodworm homogenate)
caption: 'bottom: The log2FC for enzyme expression with jasmonic acid alone are visualized
  by blue to red colored rectangles. Blue/red coloration represents the average log2FC
  of all significant genes assigned the specified EC number. The log2FC for small
  molecule expression with the jasmonic acid alone and jasmonic acid + bloodworm homogenate
  are visualized in cyan to magenta splitcircles; five small molecules were identified
  in this pathway: galangin, kaempferol, quercetin, luteolin, and myricetin. EC numbers
  in grey were found in the transcriptome, but were not assigned to any significant
  genes. EC numbers in white were not found in the transcriptome. top: Structures
  of the five identified molecules are shown along with close-ups of their positions
  in the pathway, highlighting the split circles illustrating the differential abundance
  of each metabolite depending on whether the plant was treated with jasmonic acid
  alone or with bloodworm homogenate'
