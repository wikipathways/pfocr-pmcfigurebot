figure_title: Structural modifications of the M1C cytoplasmic domain drive signaling
  pathways in wound healing and malignant transformation.
caption: Structural modifications of the M1C cytoplasmic domain drive signaling pathways
  in wound healing and malignant transformation. The M1C/CD is an intrinsically disordered
  72 aa region as is often found in proteins that function as nodes in integrating
  signaling pathways. The CQC motif acts as a sensor of redox balance and is necessary
  for forming M1C homodimers, as well as M1C heterodimers with downstream effectors
  that include MYC, TCF4, TAK1 and JAK1. M1C/CD is modified by RTKs and TKs (ABL,
  SRC). As a result, the corresponding pY sites function as binding motifs for effectors
  with SH2 domains, such as SHP2, PI3K, SHC, PLCγ, SRC and GRB2, that contribute to
  RTK→RAS signaling. M1C/CD integrates the proliferative RTK→RAS pathway with effectors,
  such as NF-κB and STAT1/3 that drive inflammatory signaling in wound healing and
  malignant transformation. Modified from Kufe, 2022 [62]
