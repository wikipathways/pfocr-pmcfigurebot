figure_title: Temporal regulation of innate immune signaling pathways by baicalin
  at the protein level.
caption: 'Temporal regulation of innate immune signaling pathways by baicalin at the
  protein level. Protein expression and phosphorylation of key signaling molecules
  in the interferon pathway (viral sensor MDA5, adaptor MAVS, and STAT1) as well as
  major components linking interferon and NF-κB pathways (IRF3, p65, and IκBα) were
  analyzed by Western blot in CEK cells across different treatment schedules at 24
  and 48 h post-infection. The experimental groups included: (a) Mock group, (b) BA
  (20 µg/mL) group (baicalin only), (c) IBV group (infection only), (d) Baicalin +
  2 h → IBV group (Pre-treatment), and (e) IBV + 2 h → Baicalin group (Post-infection
  treatment). Baicalin was found to sustain the activation of the MDA5–MAVS–STAT1
  axis, while exerting a biphasic effect on the phosphorylation of IRF3, p65, and
  IκBα in a time- and treatment-dependent manner'
