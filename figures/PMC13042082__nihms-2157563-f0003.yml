figure_title: Arrayed CRISPR/Cas9 screening revealed that the vesicle organization
  pathway was important for the cell entry of CTSG.
caption: Arrayed CRISPR/Cas9 screening revealed that the vesicle organization pathway
  was important for the cell entry of CTSG. (A) Cas9-expressing HCT116 cells were
  infected with 50 μL of arrayed gRNA lentivirus targeting 141 human membrane trafficking
  genes, RAGE, and a NC. Infected cells were selected with puromycin for 3 days. The
  cells were then reseeded and treated with 5 ng/μL of CTSG for 16 h. Cleaved PARP
  and Actin were detected with Western blot assay. Cleaved PARP levels were normalized
  with Actin, and the relative ratio of cleaved PARP in CTSG-treated wells against
  vehicle control wells to NC was calculated and plotted. (B, C) The enrichment of
  the top 40 genes was analyzed using Metascape (http://metascape.org/) [34]. The
  pathway enrichment list is shown in B, and the relationships of the enriched pathways
  are shown in C
