figure_title: Transcriptomic analysis of Diaporthe nobilis under CFS treatment.
caption: 'Transcriptomic analysis of Diaporthe nobilis under CFS treatment. (A) Volcano
  plot of differentially expressed genes identified from mycelium treated with 2%
  CFS for 12 h. Significantly down- and up-regulated genes are shown in blue and red,
  respectively. (B) Gene Ontology classification of differential genes across three
  major functional categories. BP: Biological Process; CC: Cellular Component; MF:
  Molecular Function. (C) Heatmap analysis of differentially expressed genes in D.
  nobilis under Bacillus velezensis A4 treatment, with color intensity indicating
  relative abundance changes. (control: CK-1, CK-2, CK-3; treatment: T-1, T-2, T-3).
  (D) KEGG pathway enrichment scatter plot displaying the top 20 significantly enriched
  pathways (Padj < 0.05). The vertica axis indicates pathway names, and the horizontal
  axis represents the rich factor. Point size corresponds to the number of enriched
  genes, and color intensity reflects the Padj value'
