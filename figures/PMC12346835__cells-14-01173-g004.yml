caption: 'Swertiamarin exerts comprehensive anti-diabetic effects through multiple
  mechanisms: (1) Glucose uptake and metabolism: SW enhances glucose metabolism by
  promoting GLUT4 expression and activating the PI3K/Akt pathway to improve insulin
  sensitivity while stimulating pancreatic islet regeneration. (2) Insulin secretion
  sensitivity: SW improves insulin secretion and sensitivity by upregulating PPARγ
  and adiponectin expression and inhibiting HMG-CoA reductase activity. (3) Lipid
  Metabolism: SW modulates lipid metabolism by reducing TG, TC, and LDL levels while
  increasing high-density lipoprotein (HDL) and regulates key enzymes, including ACC
  and FAS. (4) Antioxidant Effects: SW elevates SOD, CAT, GSH, and GPx while decreasing
  MDA through Nrf2/HO-1 pathway activation to reduce ROS. (5) Swertiamarin demonstrates
  anti-inflammatory effects by suppressing TNF-α, IL-6, IL-1β, NF-κB signaling, and
  the NOX4/ROS/NLRP3 inflammasome. (6) Complication management: SW manages diabetic
  complications by inhibiting RAGE/MAPK/TGF-β pathways, reducing neuro-inflammation,
  MMP-9, MMP-3, NEFA, and glucose levels'
