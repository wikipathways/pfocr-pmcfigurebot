figure_title: Combining host transcriptomic and microbial metagenomic data predicts
  in-hospital mortality in patients with sepsis, and host signatures of sepsis are
  validated in external datasets
caption: '(A) Classifier performance for prediction of in hospital mortality based
  on area under the receiver operator characteristic (ROC) curve. Classifiers were
  developed using: host gene expression + microbial metagenomic data, host gene expression
  data alone, microbial metagenomic data alone, APACHE-III score, or SRSq score. Error
  bars represent standard deviation from 10-fold cross validation. (B) Classifier
  performance for prediction of in hospital mortality comparing the host transcriptomic
  classifier developed from this cohort (EARLI host classifier) as compared to four
  previously published host transcriptomic classifiers (7). Classifier 1 = Duke, 2
  = Sage LR, 3 = Sage RF, 4 = Stanford, as described in reference (7). Error bars
  represent standard deviation from 10-fold cross validation. (C) Over-representation
  analysis (ORA) of DE genes based on mortality in the COMET cohort. (D) Over-representation
  analysis (ORA) of DE genes based on mortality in the GAinS cohort. Pathways represent
  the top 15 most significant pathways enriched at an adjusted p value <0.05. DE genes
  were calculated using Benjamini-Hochberg corrections (n = 22,271 genes in COMET;
  n = 16,339 genes in GAinS). DE genes based on mortality from COMET are provided
  in Supp. Data 12 and ORA results in Supp. Data 13. DE genes based on mortality from
  GAinS and the associated ORA are provided in Supp. Data 14-15'
