figure_title: Spatial patterns of expression upon immune challenge occur in a variety
  of antimicrobial peptides
caption: '(A) Simplified schematic of the main immune signaling pathways in Drosophila.
  Bacterial peptidoglycan is sensed through the Immune deficiency (Imd) pathway, which
  leads to activation of Diptericins (including DptA), Cecropins (including CecA1),
  Attacins (including AttA), Defensin (Def), and Drosocin (Dro). Fungal β-glucan is
  sensed through the Toll pathway and leads to activation of Drosomycin (Drs) and
  Metchnikowin (Mtk). There is cross-talk between the pathways (dashed gray arrows).
  (B) Fraction of larvae exhibiting partial (subset of fat body cells GFP+), complete
  (all fat body cells GFP+), or no response of GFP-reporters of various antimicrobial
  peptides following challenge with E. coli or S. cerevisiae. Responses were scored
  based on images taken on a low-magnification widefield microscope 24 hours post
  infection, except for DptA, which were taken from the light sheet fluorescence microscopy
  data from Fig. 1. All larvae were staged to 18h post-L3 molt at 18°C (Methods: Larva
  collection). Sample sizes (number of larvae) for each gene, left to right: N = 7,
  14, 20, 11, 12, 8, 11. (C)-(E) Maximum intensity projections of light sheet fluorescence
  microscopy image stacks of larvae carrying GFP reporters for Drosocin (C), Defensin
  (D), and Metchnikowin (E), with the microbial stimulus used noted to the right of
  each image. Fat body nuclei are marked using UAS-His-RFP; r4-Gal4. Image contrast
  was adjusted for each panel separately for visual clarity'
article_title: Spatial microenvironments tune immune response dynamics in the Drosophila
  larval fat body
