figure_title: Transcriptionally Heterogenous AT2 cells Associate with Distinct Alveolar
  Fibroblast Subsets
caption: (A) UMAP embedding of the early postnatal alveolar epithelium (51,300 nuclei)
  showing high-resolution subclustering of AT2 cells, AT2 to AT1 transitional cells,
  and AT1 cells.(B) Dot plot showing expression of marker genes defining AT2, AT2
  to AT1 transitional, and AT1 states. The gradual loss of AT2 markers and acquisition
  of AT1 markers places transitional subclusters along an AT2-to-AT1 differentiation
  trajectory but does not account for transcriptional heterogeneity among AT2 subclusters.(C)
  Feature plots showing mutually exclusive module-score expression of the top 50 genes
  enriched in AT2-c1 and AT2-c2.(D) Dot plot summarizing differential expression across
  AT2 subclusters. AT2-c1 is enriched for genes involved in lipid metabolism, whereas
  AT2-c2 is enriched for genes associated with inflammatory and immune signaling.
  Both subclusters also display additional pathway enrichments not directly related
  to these categories, indicating broader transcriptional divergence between lipogenic
  and immune-responsive AT2 states.(E) Fluorescence in situ hybridization for FMO5
  and CFTR combined with immunostaining for the AT2 marker SFTPC confirms spatial
  separation of AT2 subtypes in situ. Red arrows indicate CFTR-high/FMO5-low cells,
  green arrows indicate FMO5-high/CFTR-low cells, and yellow arrows denote cells co-expressing
  both genes.(F) UMAPs highlighting specimen-specific enrichment of AT2 subtypes.
  Cells from each specimen classification are colored, with all other cells shown
  in gray.(G) Weighted composition of alveolar epithelial cell types across specimen
  categories based on AT2 subtype prevalence. AT2 to AT1 transitional 1 and AT1-c3
  cells are over-represented in specimens enriched for AT2-c2 (blue stars), whereas
  AT1-c1 and AT1-c2 cells are over-represented in specimens enriched for AT2-c1 (red
  stars).(H) UMAP of subclustered mesenchymal nuclei showing the relationship between
  epithelial subtype enrichment and fibroblast composition. Specimens enriched for
  AT2-c1 (red) contain predominantly alveolar fibroblast-c1 and alveolar fibroblast-c2
  populations, while specimens enriched for AT2-c2 (blue) contain mostly alveolar
  fibroblast-c3 cells.(I) Dot plot showing differential gene expression among alveolar
  fibroblast subclusters, highlighting distinct pathway enrichments related to FGF,
  WNT, HIPPO, NF-κB, and fibrosis-associated signaling
