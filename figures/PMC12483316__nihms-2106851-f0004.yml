figure_title: On-person evolution drives sensitivity to multiple antimicrobials
caption: (A) Two lineages show significant intra-lineage variation, each containing
  isolates with sensitivity to the same producers, depicted using a section of the
  isolate-level heatmap (from Extended Data Fig. 3). Isolates from the same lineage
  are indicated by decimals and color. Intensity indicates AUC for the ZOI. The two
  idiosyncratic isolates depicted (denoted by *) have different sensitivity profiles
  from the rest of their lineages and also have loss-of-function mutations in the
  vraFG pathway, as labeled. (B) The phylogeny of isolates in lineage 37 indicates
  that the vraF frameshift and associated sensitivity was acquired, not ancestral.
  Lineage 20 has a similar pattern of recently acquired sensitivity (see Extended
  Data Fig. 10a). (C) By selecting on polymyxin B, we cultivated revertant isolate
  37.3-r1 which corrected the vraF frameshift and has an ancestral resistance profile.
  Genome sequencing confirmed this reversion (Methods). (D) Isolates with vraFG mutations,
  but not their ancestors or the revertant, are sensitive to cationic antimicrobials,
  lysostaphin, and filtered supernatant from isolate 35.1. Minimum Inhibitory Concentration
  (MIC) assay results were normalized to isolate 35.1 and raw values are available
  in Extended Data Fig. 10g
