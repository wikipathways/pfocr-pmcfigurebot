figure_title: Differentially expressed proteins and their distribution over biological
  processes, cellular compartments, molecular functions, and KEGG pathways in HAECs
  versus HDMVECs
caption: HAECs and HDMVECs were cultured, and protein lysates were subjected to proteomic
  analysis. Both HAECs and HDMVECS were from 5 donors. A. Volcano plot shows the overview
  of all the proteins identified, with non-significant proteins in gray and 126 proteins
  that met our selection criteria highlighted either in red (high abundance in HDMVECs)
  or in blue (low abundance in HDMVECs). The best targets are above the horizontal
  lines (set at p <0.05) and the outside of vertical lines (fold change > 1.5 or <
  0.67). The proteins with gene names were the candidates that we further studied.
  B-D. Proteins were analyzed for their distribution in biological processes (B),
  cellular compartments (C), and molecular functions (D) revealed by DAVID analysis.
  These enriched categories are shown on the Y-axis. The smaller the p-value (listed
  top right), the more likely a pathway is significantly enriched. The size of the
  dots indicates protein numbers (listed top right). E. KEGG pathways of the most
  upregulated vs downregulated proteins. F. Selected KEGG pathways closely associated
  with wound healing and diabetes. Proteins highlighted in red are higher in HDMVECs
  and proteins highlighted in blue were low in HDMVECs, compared with HAECs
