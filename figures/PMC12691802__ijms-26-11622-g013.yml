figure_title: Simplified diagram of the Wnt/β-catenin pathway.
caption: Simplified diagram of the Wnt/β-catenin pathway. In the absence of Wnt ligands,
  β-catenin is targeted for phosphorylation and proteasomal degradation by the destruction
  complex composed of APC, Axin, CK1α, and GSK3β. Upon Wnt binding to Fzd receptors
  and LRP5/6 co-receptors, the destruction complex is inhibited, allowing β-catenin
  stabilization and nuclear translocation. Nuclear β-catenin associates with TCF/LEF
  transcription factors replacing Groucho/TLE to activate target gene expression.
  The arrow indicates a stimulating effect
