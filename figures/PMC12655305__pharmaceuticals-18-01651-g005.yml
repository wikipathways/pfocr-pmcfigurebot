figure_title: Schematic representation of theoretical working hypothesis for molecular
  effect of LGG administration in UC patients’ mucosa involving vitamin D/VDR pathway
  activation.
caption: Schematic representation of theoretical working hypothesis for molecular
  effect of LGG administration in UC patients’ mucosa involving vitamin D/VDR pathway
  activation. LGG promotes VDR expression, leading to enhanced vitamin D signalling
  and subsequent modulation of mucosal immune responses. This activation may create
  a positive feedback loop in which VDR stimulation strengthens the intestinal barrier,
  downregulates pro-inflammatory pathways, and regulates microbiota composition. In
  particular, VDR activation has been linked to the production of antimicrobial peptides,
  which may reduce the concentration of certain commensal bacterial species while
  facilitating the mucosal colonization of LGG. The enhanced colonization of LGG,
  in turn, may further stimulate VDR expression and activate downstream anti-inflammatory
  pathways, contributing to an overall reduction in disease activity
article_title: 'Lactobacillus rhamnosus GG Administration Is Associated with Stimulation
  of Vitamin D/VDR Pathway and Mucosal Microbiota Modulation in Ulcerative Colitis
  Patients: A Pilot Study'
