caption: (A, B) Correlation between PRKDC gene expression levels and NB tumor progression
  to stage 4. (C) Heatmap of differential expression of DNA replication and repair
  pathway (KEGG) genes in PTCs (green) at diagnosis and DTCs (red) at relapse. Color
  intensity represents expression level. Heatmap of KEGG pathways involved in DNA
  replication and repair in primary tumor cells (PTCs) at diagnosis (green) and in
  disseminated tumors cells (DTCs) at relapse (red). (D) PRKDC gene expression in
  PTCs at diagnosis, DTCs at diagnosis and in DTCs at relapse (Ambros study, n=86)
  revealed a significant upregulation of PRKDC in DTCs at relapse. (E) Western blot
  analysis in MYCN-amplified (BE(2)-C, LAN-1, IMR-32 and SK-N-DZ) and MYCN-non-amplified
  (SK-N-AS, SK-N-SH) NB cell lines (*p<0.05, ***p<0.001, ****p<0.0001)
