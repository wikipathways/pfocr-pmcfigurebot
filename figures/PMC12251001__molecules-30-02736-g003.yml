caption: Glucagon impacts BON-1, QGP-1, and α-TC1 cells differently; pancreatic neuroendocrine
  tumour (pNET) cell lines consume more glucose than non-cancer α-TC1 cells, which
  are efficient producers of glucose stimulated by glucagon. (A,D,G) Heatmaps showing
  glucose and glucagon pathway clustering for BON-1, QGP-1, and α-TC1, respectively.
  (B,E,H) Principal component analysis (PCA) to infer the influence of glucose and
  glucagon on clustering patterns in BON-1, QGP-1, and α-TC1, respectively. (C,F,I)
  Partial least-squares discriminant analysis (PLS-DA) to infer glucose and glucagon
  influence on clustering patterns, in BON-1, QGP-1, and α-TC1, respectively. (J)
  BON-1, QGP-1, and α-TC1 cell lines’ glucose consumption. (K) BON-1, QGP-1, and αTC1
  cell lines’ percentage of glucose consumption. (L) BON-1, QGP-1, and α-TC1 glucose
  production in glucose-deprived medium. Statistical analysis was performed using
  one-way ANOVA
