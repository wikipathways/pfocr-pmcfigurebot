figure_title: Elongator complex loss reduces SARS-CoV-2 and ZIKV infection.
caption: Elongator complex loss reduces SARS-CoV-2 and ZIKV infection. (A) Schematic
  representation of U34 tRNA modification pathway in FD (ELP1-deficient) cells. The
  Western blot shows ACE2 receptor and actin levels in cells transduced by ACE2-expressing
  lentivector (VLPACE2). (B) Quantification of U34 modification levels (ncm5U, mcm5U,
  and mcm5s2U) in wild-type (wt) versus FD cells determined by mass spectrometry on
  tRNA-enriched RNA fractionations. (C) SARS-CoV-2 infection levels measured by RT-qPCR
  in wt and FD cells at different multiplicities of infection (MOI) 24 h post-infection.
  (D) ZIKV infection levels measured by RT-qPCR in wt and FD cells at different MOIs
  48 h post-infection
