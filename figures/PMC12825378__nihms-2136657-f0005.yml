figure_title: Pathway-centric mapping of differentially enriched proteins in the presynaptic
  and postsynaptic terminals following methamphetamine (Meth) exposure.
caption: 'Pathway-centric mapping of differentially enriched proteins in the presynaptic
  and postsynaptic terminals following methamphetamine (Meth) exposure. The proteomic
  data were overlaid onto a schematic of canonical synaptic processes and cellular
  components, including dopamine biosynthesis and packaging, the synaptic vesicle
  cycle, mitochondrial energy metabolism, proteasome-mediated protein degradation,
  and endoplasmic reticulum organization. The proteins with significant enrichment
  in Meth-treated samples are highlighted in green, while those reduced are in purple.
  Proteins lacking a significant concentration change detected are in gray. The node
  labels indicate gene names. These depictions reflect changes in protein abundance
  rather than direct measurements of neurotransmitter concentrations. Gene names are
  provided in the text or Table S2. Key: DA, dopamine; ER, endoplasmic reticulum;
  TCA, tricarboxylic acid cycle'
