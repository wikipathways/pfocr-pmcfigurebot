figure_title: Markers of NF-κB activation are not significantly different in Western
  or control diet fetuses and juveniles—levels of IL-12, IL-18, and IL-23 were assessed
  as markers of NF-κB pathway activation.
caption: 'Markers of NF-κB activation are not significantly different in Western or
  control diet fetuses and juveniles—levels of IL-12, IL-18, and IL-23 were assessed
  as markers of NF-κB pathway activation. IL-12 showed no significant differences
  in fetuses or juveniles (P = 0.858 and P = 0.3163, respectively). There was no significant
  difference between juveniles or fetuses (from L to R: P = 0.956, P = 0.998, P =
  0.505, and P = 0.706, respectively). IL-18 showed no significant differences in
  fetuses or juveniles (P = 0.461 and P = 0.263, respectively). There was no significant
  difference between juveniles or fetuses (from L to R: P = 0.755, P = 0.964, P =
  0.995, and P = 0.777, respectively). IL-23 showed no significant differences in
  fetuses or juveniles (P = 0.763 and P = 0.104, respectively). There was no significant
  difference between juveniles or fetuses (from L to R: P = 0.169, P = 0.987, P =
  0.999, and P = 0.095, respectively). ns, not significant'
article_title: Maternal Western diet increases inflammatory markers and decreases
