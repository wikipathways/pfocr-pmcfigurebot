figure_title: Network analysis of CaA–ChA.
caption: Network analysis of CaA–ChA. (A) The Venn diagram of the intersection targets.
  The blue circle represented the number of targets affected by ChA, the yellow circle
  represented the number of targets affected by CaA, and the green circle represented
  the number of targets related to oxidative stress. (B) Network diagram of targets
  of CaA–ChA and oxidative stress. The red triangle represents the common antioxidant
  targets of CaA–ChA, the green circle represents the antioxidant targets of CaA and
  ChA, respectively, and the gray line represented the interaction between the targets.
  (C) PPI network diagram of targets of CaA–ChA and oxidative stress. The larger the
  degree value, the larger the label. (D) GO function enrichment analysis results.
  (E) KEGG pathway enrichment analysis results
