figure_title: Schematic representation of the pathway by which anti-miR-1 oligonucleotide
  (AMO-1)–loaded nanoparticles exert their effects on cardiomyocytes.
caption: Schematic representation of the pathway by which anti-miR-1 oligonucleotide
  (AMO-1)–loaded nanoparticles exert their effects on cardiomyocytes. The nanoparticles
  protect the oligonucleotides from enzymatic degradation. The exact mechanism by
  which nanoparticles (AT1-PEG-DGL) cross the vascular endothelium remains unclear;
  however, receptor-mediated transcytosis via angiotensin II type 1 (AT1) receptors
  (indicated by blue ellipses) or paracellular passive diffusion through disrupted
  tight junctions between capillary endothelial cells are considered plausible pathways.
  Moreover, the mechanism of endosomal escape following AT1 receptor–mediated endocytosis
  also remains to be elucidated. AMO-1 is indicated by a red circle, and miRNA is
  represented by a magenta ellipse
