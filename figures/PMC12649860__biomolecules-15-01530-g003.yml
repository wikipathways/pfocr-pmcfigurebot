figure_title: Schematic representation of the furin activation pathway.
caption: 'Schematic representation of the furin activation pathway. The maturation
  process of furin is depicted in four sequential stages: (a) full-length profurin
  containing the inhibitory propeptide domain; (b) after proper folding in the endoplasmic
  reticulum (ER), profurin undergoes initial autocatalytic cleavage at R107↓. The
  liberated propeptide remains non-covalently associated as an inhibitor, leading
  to transient accumulation within the ER-Golgi intermediate compartment (ERGIC) and
  cis-Golgi network (CGN); (c) subsequent transport to late secretory compartments
  (trans-Golgi network [TGN] or endosomes) facilitates the second autocatalytic processing
  event at R75↓, which occurs under specific environmental conditions, including acidic
  pH and elevated calcium concentrations; (d) the final dissociation of inhibitory
  propeptide fragments yields the fully active furin protease, capable of substrate
  recognition and cleavage (e) giving a final and active form of the protein. Figure
  Modified from Thomas et al. (2002) Preprofurin (UniProt: AF-P09958-F1) [55]'
