caption: Schematic representation of the wound-healing mechanism modulated by C. nutans
  extract and schaftoside. HSV-2 infection or LPS stimulation activates macrophages
  (RAW 264.7), triggering NF-κB signaling and upregulation of pro-inflammatory mediators,
  including COX-2, iNOS, IL-6, TNF-α, and PGE2. These mediators amplify inflammation
  and contribute to endothelial dysfunction. C. nutans extract and schaftoside inhibit
  this pathway by suppressing NF-κB activation, reducing inflammatory gene expression,
  and inhibiting COX-2 activity. Additionally, the extract exhibits anti-cell death
  effects in CCL-209 endothelial cells and suppresses HSV-2 infection, supporting
  vascular function and preventing infection-related delays. These actions collectively
  promote wound healing
article_title: Integrative Wound-Healing Effects of Clinacanthus nutans Extract and
  Schaftoside Through Anti-Inflammatory, Endothelial-Protective, and Antiviral Mechanisms
