figure_title: Kelp impairs the EREG-EGFR signaling axis.
caption: 'Kelp impairs the EREG-EGFR signaling axis. A. The network target analysis
  was performed based on the holistic targets of kelp and the four gene sets. B. KEGG
  enrichment was conducted to find the significantly enriched pathways in either the
  four gene sets or targeted by kelp. C. Immunofluorescence staining of colon with
  EREG (green), α-SMA (Red) and DAPI (blue). Scale bar: 50 μm or 5μm. D. Workflow
  of scRNA-seq analysis for colon tissue. E-F. UMAP plots showing the distribution
  of cell types (E) or groups (F). G. Dotplot showing the expression of marker genes
  in cell types. H. Expression of Ereg in cell types. I. Expression of putative functional
  genes identified in Figure 5A across groups. J. EREG content in serum from indicated
  mice. K. MAPK pathway activity scores of MKI67⁺ epithelial cells in each group.
  L. Phosphorylation levels of EGFR and ERK expression of colon tissues from mice'
