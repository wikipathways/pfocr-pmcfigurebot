figure_title: Bilateral imaging of dmPFC activity during postnatal development
caption: '(A) Schematic of CBGT loops showing direct (dSPN, blue) and indirect (iSPN,
  magenta) pathway neurons in DMS—the globus pallidus externus (GPe), subthalamic
  nucleus (STN), and substantia nigra pars reticulata (SNr). Cre-driver lines for
  dSPNs (D1-Cre) and iSPNs (A2A-Cre) are shown.(B) Timeline of experimental approach.
  AAV-DIO-Casp3 was injected unilaterally into the DMS of D1-Cre or A2A-Cre mice at
  P1–P2 to induce selective ablation of dSPNs or iSPNs, respectively. At P7–P8, AAV9-hSyn-GCaMP8s
  was bilaterally injected into the dmPFC, followed by cranial window implantation
  and acute two-photon imaging at P14–P18.(C) tdTomato (Tom+)-labeled SPNs in the
  DMS of the control (left) hemisphere and loss of SPNs restricted to the Casp3-ablated
  (right) hemisphere in D1-Cre (top) and A2A-Cre (bottom) mice crossed with Ai9 reporter.
  CTX, cortex; CC, corpus callosum; LV, lateral ventricle. Scale bars: 0.5 mm.(D)
  Quantification of Tom+ cell density in the DMS confirms that (top) ablation significantly
  reduced dSPNs relative to the untreated hemisphere (control: mean ± SEM = 1,386
  ± 31; Casp3: mean ± SEM = 992 ± 52). Similarly, (bottom) Casp3-ablation reduced
  iSPN density relative to the control hemisphere (control: mean ± SEM = 1,118 ± 12;
  Casp3: mean ± SEM = 922 ± 22). Repeated measures (RM) two-way ANOVA detected the
  main effects of cell type (p = 0.0168), treatment (p < 0.0001), and their interaction
  (p = 0.0054). Both dSPN (***p = 0.0002) and iSPN (**p = 0.0031) effects survived
  Bonferroni correction. Means of n = 9 sections from N = 3 mice/group.(E) Bilateral
  imaging of GCaMP8s in dmPFC of awake P15 mouse.(F) Representative GCaMP8s ΔF/F traces
  from neurons recorded in (E).(G) Spatial maps of calcium event frequency (left)
  and amplitude (right) from (E)'
