figure_title: Experiment I. Cocaine-administering rats displayed significantly increased
  drug-seeking behavior than saline controls; differential gene expression detected
  within experimental group comparisons
caption: 'A) Timeline for behavior and immunoprecipitation experiments. B) Active
  lever presses for both saline and cocaine groups shown across self-administration.
  C) Number of infusions shown for each treatment group throughout self-administration.
  (p-value < 0.05). Volcano plots showing number of significant differentially expressed
  genes (DEGs) in experimental comparisons including cocaine vs. saline at withdrawal
  day (WD1) (D), cocaine vs. saline at WD45 (E), saline WD45 vs. saline WD1 (F), cocaine
  WD45 vs. cocaine WD1 (G) (nonsignificant: gray, significant downregulated DEGs:
  blue, and significantly upregulated DEGs: red). No DEGs were detected between saline
  and cocaine groups at WD45 (FDR p-value cutoff of < 0.05). (H) Pathway enrichment
  analysis displaying most significant cellular pathways between saline- and cocaine-administering
  rats at withdrawal day 1. Downregulated pathways shown in blue and upregulated pathways
  shown in red (adjusted p-value < 0.05). (I) Venn diagram showing the total number
  of significant DEGs detected within saline and cocaine groups across time (WD45
  vs. WD1)'
article_title: Investigating cocaine- and abstinence-induced effects on astrocyte
