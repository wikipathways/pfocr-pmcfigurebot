figure_title: Anticancer mechanisms of pinocembrin.
caption: Anticancer mechanisms of pinocembrin. Pinocembrin suppresses cancer development
  by inhibiting the growth and spread of cancer cells via upregulation of PTEN, thereby
  inhibiting the PI3K/AKT/mTOR pathway. Additionally, it prevents TGF-β1-triggered
  cancer progression by interacting with αvβ3 integrin, thereby activating FAK and
  p38α. This activation enables p50 and p65 to move into the nucleus, increasing MMP-2
  and MMP-9 levels that support cancer growth and metastasis. This figure is reproduced
  from Elbatreek et al. [176], an open access article published by Elsevier BV, under
  Creative Commons Attribution license 4.0 (CC BY 4.0)
