figure_title: Context-dependent genetic essentiality and transcriptional consequences
  of perturbation across neuronal types
caption: '(A) Heatmap of cell type depletion showing log odds ratio for significantly
  depleted perturbation–cell type pairs across six binned neuronal classes. (B) Top:
  density plot of log2(cell fraction/library fraction) across all non-control perturbation-cell
  type pairs. (C) gRNA-level depletion consistency for selected perturbation–cell
  type pairs, showing individual gRNA log odds ratios (colored dots) and mean (red
  square) relative to neutral expectation (dashed line). (D) Pathway composition of
  DEGs among the top 422 perturbations, with representative genes listed for each
  category. (E) Stacked bar plot of DEG counts across cell types for the top 50 perturbations
  ranked by total DEG number. (F) Jaccard similarity of DEG sets among proteostasis-related
  perturbations, showing high overlap among proteasome and ubiquitin pathway components.
  (G) Heatmap of log fold-changes for 174 shared DEGs across proteostasis perturbations,
  organized by functional category (stress/UPR/chaperone, UPS feedback/translation,
  neuronal/synaptic). (H) Scatter plot of DEG log fold-changes for Tsc1 versus Tsc2
  perturbations (Pearson R = 0.894), with shared DEGs colored by pathway (mTOR/PI3K,
  cholesterol biosynthesis, lysosome, synaptic signaling). Cell-type-specific effects
  highlighted for MB Glut and TH Prkcd Grin2c Glut. (I) Heatmap of log fold-changes
  for SWI/SNF complex perturbations (Smarcb1, Smarcc2, Arid2, Arid1a) in TH Prkcd
  Grin2c Glut neurons, showing DEGs significant in two or more perturbations (n =
  146), organized by functional category (intrinsic excitability, identity and transcription,
  synaptic transmission)'
