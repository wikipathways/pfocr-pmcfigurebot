caption: sFgl2 amplified MSCs’ immunosuppression on BMDNs via TGF-β -Smad2/3 pathway.
  (a) In BMDNs undergoing various treatment conditions, WB was carried out to detect
  the protein levels of TGF-β1, p-Smad2/3, and Smad2/3, using GAPDH as an internal
  reference. (n = 3 independent experiments). Data are mean ± standard deviation.
  Statistical comparisons were performed using one-way ANOVA followed by Tukey’s post-hoc
  test (for multiple groups), as detailed in Methods. n.s., p > 0.05, *p < 0.05, **p
  < 0.01, and ***p < 0.001. MSCs, mesenchymal stem cells; sFgl2, soluble fibrinogen-like
  protein 2; BMDNs, bone marrow-derived neutrophils
