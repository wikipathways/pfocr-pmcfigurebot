figure_title: Joint correlation analysis of genes and metabolites.
caption: 'Joint correlation analysis of genes and metabolites. (A) Heatmap of gene
  and metabolite correlations showing the relationship between genes and metabolites
  in the KEGG pathway significantly enriched by combined transcriptomic and metabolomic
  analyses of the LK and OD groups. The clustered heatmap visualizes the strength
  of the correlations and the direction of regulation. Blue color indicates positive
  correlations and red shows negative correlations. Note: p < 0.05 with *, p < 0.01
  with **, and p < 0.001 with *** highlighting the significant level between key genes
  and metabolites. (B) Sankey graph between upregulated genes and metabolites with
  a correlation r > 0.97. (C) Sankey graph between down-regulated genes and metabolites
  with a correlation r > 0.97'
