caption: Metabolic pathway of adenosine generation and consequent immunosuppression.
  Hydrolysis of ATP by the ectonucleotidases CD39 and CD73 ultimately leads adenosine
  generation. Adenosine potentiates the immune-suppressive actions of Tregs, type
  1 regulatory T cells, macrophages, and myeloid-derived suppressor cells, and also
  facilitates antigen tolerance, as well as blocking memory T cells from becoming
  effector cells
