figure_title: Impact of truncated Ppm1d on transcriptomic state and p53 pathway in
  primary mouse gliomas
caption: '(a) Tumor-bearing brains collected from wild-type (Ppm1d wt/wt) and truncated
  Ppm1d (Ppm1d flex-6/wt) mice were analyzed by single-cell RNA sequencing (scRNA-seq)
  analysis.(b) scRNA-seq of >10,000 cells from tumor-bearing brains of Ppm1d wt/wt;
  p53 fl/wt and Ppm1d flex-6/wt; p53 fl/wt mice visualized with UMAP plots, with normal
  and neoplastic clusters annotated.(c) Scatterplots of neoplastic clusters show gene
  program similarity scores to late excitatory neurons (nEN.late) vs. dividing major
  ganglionic eminence neurons (MGE.div), colored by condition. Violin plots display
  nEN.late score distributions stratified by genotype (Ppm1d wt/wt; p53 fl/wt vs.
  Ppm1d flex-6/wt; p53 fl/wt).(d) Significant hits from pre-ranked gene set enrichment
  analysis (GSEA) of neoplastic tumor cells performed using ranked log2 fold changes
  between genotypes (Ppm1d wt/wt; p53 fl/wt vs. Ppm1d flex-6/wt; p53 fl/wt). MSigDB
  Hallmark, Reactome, and GO collections were tested, retaining pathways at FDR <
  0.05. Enrichment results were visualized as bar plots and summarized by normalized
  enrichment score (NES) direction.(e) Schematic of Ppm1d flex-6; p53 fl/wt and Ppm1d
  wt/wt; p53 fl/fl mice generation. All mice contained NestinTVA.(f) Kaplan-Meier
  analysis showing tumor-free survival of littermate-controlled mice with either tumoral
  p53 loss (p53 fl/fl) or tumoral Ppm1d truncation (Ppm1d flex-6/wt). Log Rank test
  P = 0.032, Genotypes: Ppm1d flex-6/wt; p53 fl/wt n=18, Ppm1d wt/wt; p53 fl/fl n=22(g)
  Schematic of the generated and genotyped mouse models: Ppm1d wt/wt; p53 fl/fl and
  Ppm1d flex-6/wt; p53 fl/fl(h) Kaplan-Meier analysis showing tumor-free survival
  for littermate mice with tumoral p53 loss and truncated Ppm1d (vs. p53 loss alone).
  Log Rank p= 0.8144, Genotypes: Ppm1d flex-6/wt; p53 fl/fl n=25, Ppm1d wt/wt; p53
  fl/fl n=11, N.S., not significant'
article_title: Oncogenic Ppm1d mutations deregulate the p53 pathway in primary mouse
  gliomas
