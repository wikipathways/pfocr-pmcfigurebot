figure_title: SOX2 co-occupies sites on DNA with both FOXA1 and AR in CRPC adenocarcinoma
  cells, specifically near genes that promote cell proliferation
caption: A) Binding motif enrichment near AR, FOXA1, and SOX2 peaks in CWR-R1 cells.
  Both MEME and STREME motif discovery analyses were included. Full lists of motifs
  discovered can be found in Supplementary Table 1. B) C) Venn diagram of AR, FOXA1,
  and SOX2 ChIP-seq peaks in CWR-R1 cells grown in whole media. Shared regions represent
  called peaks with >= 1bp of overlap. D) Venn diagram of AR, FOXA1, and SOX2 potential
  target genes. CWR-R1 ChIP-seq peaks were analyzed using Cistrome-GO to identify
  genes that had AR, FOXA1, and/or SOX2 transcription factor peaks less than 10kb
  from a TSS and an adjusted regulatory potential (RP) score of >0.01. E-H) Gene Ontology
  (GO) pathway analyses for the unique and shared AR, FOXA1, and SOX2 candidate target
  genes in CWR-R1. GO enrichment was performed using Enrichr. I-K) Track plots of
  AR, FOXA1, and SOX2 ChIP-seq peaks in CWR-R1 undergoing AR pathway modulation. Peaks
  visualized using IGV and mapped to the human hg38 chromosome build
article_title: SOX2 utilizes FOXA1 as a heteromeric transcriptional partner to drive
  proliferation in therapy-resistant prostate cancer
