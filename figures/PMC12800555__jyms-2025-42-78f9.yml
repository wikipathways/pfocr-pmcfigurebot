figure_title: Short hairpin (sh) RNA of ETS-related gene (ERG) offsets the effect
  of curcumin on energy metabolism in LNCaP cells.
caption: 'Short hairpin (sh) RNA of ETS-related gene (ERG) offsets the effect of curcumin
  on energy metabolism in LNCaP cells. (A) shERG reverses the effect of curcumin on
  the rate of glycolysis in prostate cancer cells. (B, D) shERG reverses the effect
  of curcumin on glycolysis-related proteins and in pathways associated with prostate
  cancer cells. (C, E) Bar graphs showing the protein expression in B and D. Data
  are presented as the mean±standard error of the mean of three independent experiments.
  GLUT1, glucose transporter type 1; PKM2, pyruvate kinase M2; HK2, hexokinase 2;
  GAPDH, glyceraldehyde-3-phosphate dehydrogenase; p-AKT, phosphorylated AKT; HIF-1α,
  hypoxia-inducible factor-1α. *p<0.05, **p<0.01 compared to untreated; #p<0.05, ##p<0.01compared
  to shNc+20 µM (n=3)'
