figure_title: Inhibition of NLRP3 blocks macrophage M1 polarization and metabolic
  reprogramming.
caption: 'Inhibition of NLRP3 blocks macrophage M1 polarization and metabolic reprogramming.
  (A) IF staining of F4/80 (Scale bar: 50μm, 25μm) and iNOS (Scale bar: 50μm) in liver
  sections of Nlrp3-WT and Nlrp3-KO mice treated with or without CCl4. And iNOS fluorescence
  in primary macrophages from above groups (Scale bar: 25μm). (B) mRNA levels of F4/80,
  Cd68 and Nos2 in primary macrophages from indicated group (n = 3 per group). (C)
  KEGG analysis of DEGs generated from primary macrophages of Nlrp3-KO and Nlrp3-WT
  mice under CCl4 treatment. (D) Top 10 up-regulated and down-regulated pathways related
  to metabolism enriched in Nlrp3-KO group compared to Nlrp3-WT group. (E) mRNA levels
  of Glut1, Hk1, Hk2 and Ldha in primary macrophages from indicated group (n = 3 per
  group). (F) Protein expression of GLUT1, HK1, HK2 and LDHA in primary macrophages
  from above groups (n = 3 per group). (G) Glucose uptake, lactate production and
  ATP production in primary macrophages from indicated group (n = 5 per group). (H)
  Measurement of ECAR and OCR from above groups. All results are shown as mean ± SEM.
  *p < 0.05, #p < 0.05'
