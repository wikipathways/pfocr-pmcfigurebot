figure_title: Schematic diagram of the proposed model.
caption: Schematic diagram of the proposed model. TAC induces early neutrophil infiltration,
  characterized by high expression of S100A8/A9. This response triggers inflammation
  and adaptive cardiac hypertrophy via the p38 MAPK/JNK/AP-1 axis, which induces release
  of CCL2 and CCL6. These secreted chemokines subsequently promote infiltration of
  the BM-derived CCR2+ macrophages, which also present elevated S100A8/A9 expression.
  Mechanistically, S100A8/A9 activates ER stress/NF-κB/NLRP3 signaling, which promotes
  the polarization of macrophages toward the M1 phenotype, while concurrently stimulating
  the AKT/Calcineurin A and TGF-β/Smad2/3 pathways. This cascade ultimately exacerbates
  maladaptive cardiac hypertrophy and accelerates HF progression
article_title: Single-cell RNA sequencing reveals that myeloid S100A8/A9 is a novel
  regulator of the transition from adaptive hypertrophy to heart failure after pressure
  overload
