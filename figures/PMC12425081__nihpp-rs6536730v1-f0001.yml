figure_title: Example workflows enabled by mSigSDK.
caption: 'Example workflows enabled by mSigSDK. Users can import the SDK using JavaScript
  ES6 standards and pursue three main pathways: (1 - Left) Explore and export data
  from existing repositories like mSigPortal and TCGA, (2 - Middle) Extend the SDK
  by integrating additional APIs or developing new workflows, or (3 - Right) Analyze
  their own mutation data by providing MAF files. The pathway on the right illustrates
  the process of converting user-provided MAF files into mutational spectra, querying
  reference signatures through mSigPortal APIs, performing NNLS fitting to estimate
  signature contributions, and generating interactive visualizations. All visualizations
  can be exported in JSON or PNG formats for further use'
