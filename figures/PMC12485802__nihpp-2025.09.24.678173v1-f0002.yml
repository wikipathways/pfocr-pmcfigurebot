figure_title: Potential sender and receiver candidates are widespread, and cell-free
  supernatants from phylogenetically distinct bacteria can activate EET in L. plantarum
caption: |-
  a, phylogenetic tree of bacteria with a complete DHNA biosynthesis pathway. A full list is provided in Supplementary Table 1. b, Phylogenetic tree of Firmicutes possessing an EET locus24 with orange-colored range indicating those with an incomplete or missing DHNA pathway. A full list is provided in Supplementary Table 2. c, Ndh2-dependent EET in L. plantarumR can be activated by cell-free supernatants (CFS) from phylogenetically distinct bacteria with either glucose or mannitol as the carbon source. The chemically defined medium (CDM) and CFS from Caulobacter crescentus (which lacks the DHNA pathway) serve as negative controls. CDM containing 2 μM DHNA serves as the positive control. Results were reported as the Fe2+ concentration reduced by L. plantarumR
  ndh2 knockout subtracted from that of ndh2 wild-type. Data represent mean ± s.d. of three biological replicates. P-values were determined by one-way ANOVA with Tukey’s post hoc test. ****, P < 0.0001 vs. CDM media control; ns, not significant
