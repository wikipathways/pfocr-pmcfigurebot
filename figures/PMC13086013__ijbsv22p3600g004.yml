figure_title: ZCCHC4 activates the Wnt pathway by enhancing the transcription of TMEM97
  to promote metastasis of HCC.
caption: 'ZCCHC4 activates the Wnt pathway by enhancing the transcription of TMEM97
  to promote metastasis of HCC. A. Western blotting analysis showing the effect of
  ZCCHC4 on the expression of TMEM97, GSK3β, phospho-GSK3β, and β-catenin. B. Western
  blotting analysis showing the effect of TMEM97 overexpression on the expression
  of GSK3β, phospho-GSK3β, and β-catenin in HCC cells transduced with shScramble or
  ZCCHC4 shRNA. C. Wound healing assay showing the effect of TMEM97 overexpression
  on migration in HCC cells transduced with shScramble or ZCCHC4 shRNA. Scale bar,
  100 μm. D. Transwell assay (Matrigel-uncoated or Matrigel-coated) showing the effect
  of TMEM97 overexpression on the migration and invasion abilities of HCC cells transduced
  with shScramble or ZCCHC4 shRNA. Scale bar, 100 μm. E Representative in vivo images
  (left panel) and quantification of metastatic lung nodules (right panel) illustrating
  the effect of TMEM97 overexpression in HCC cells transduced with shScramble or ZCCHC4
  shRNA. F. H&E staining of lung tissues from mice injected with HCC cells of different
  groups: shScramble, ZCCHC4 knockdown, ZCCHC4 knockdown plus empty vector, and ZCCHC4
  knockdown plus TMEM97 overexpression. Scale bar, 1000 μm (upper panels); scale bar,
  50 μm (lower panels). Error bars represent the means ± SD. Statistical significance
  was determined using two-tailed unpaired Student''s t-test for panels(C-E)'
