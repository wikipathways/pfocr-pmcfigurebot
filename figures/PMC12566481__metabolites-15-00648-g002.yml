figure_title: Functional classification and pathway enrichment of MS2-annotated metabolites.
caption: 'Functional classification and pathway enrichment of MS2-annotated metabolites.
  (A) HMDB super class classification of annotated metabolites. The x-axis represents
  different HMDB superclasses, while the y-axis indicates the number of features (top:
  all features; bottom: MS2-identified metabolites) falling into each category. (B)
  KEGG pathway classification at the Level 2 category. The x-axis shows secondary
  KEGG pathway terms, grouped by KEGG Level 1 categories (colored). The y-axis denotes
  the number of metabolites involved in each pathway. (C) KEGG pathway enrichment
  of MS2-identified metabolites. The x-axis shows the enrichment factor, and the y-axis
  lists enriched pathways. Dot size indicates the number of hits, and color represents
  the p-value of enrichment. (D) Heatmap of MS2-annotated metabolite intensities across
  all samples. The rows represent individual MS2-level metabolites, and columns are
  sample replicates. The metabolite classes (MS2 superclass) are indicated with color
  labels. Sample groups are shown in the top bar (A1, A2, J1, J2, M1, M2, QC)'
