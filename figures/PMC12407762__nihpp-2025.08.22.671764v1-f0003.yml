figure_title: Sex differentially affects B cells in LS carriers
caption: (A) wnn-UMAP projection (left) and bar graph showing relative abundance (right)
  of B cell subtypes in CON, LS, and LS-CRC.(B) Top DEGs per B cell subtype comparing
  LS vs CON, LS-CRC vs CON, and LS-CRC vs LS. Rows represent genes and columns represent
  B cell subtypes. Color intensity denotes logFC values, with upregulation in red
  and downregulation in blue. Non-significant genes (p-value > 0.05) are shaded in
  gray. Full statistical results including adjusted p-values (Benjamini-Hochberg correction)
  are provided in Table S4.(C) PCA plot based on transcriptional profiles of B cells.
  Each dot represents an individual.(D) Frequency of B memory cells and IgA2 plasma
  cells stratified by sex comparing CON, LS, and LS-CRC. Bars represent mean ± SEM.
  Statistical significance was determined by two-way ANOVA (Holm-Šidák post hoc test,
  *p < 0.05, **p < 0.001).(E) GSEA of B cells stratified by sex comparing CON, LS,
  and LS-CRC. Each dot represents an enriched pathway for a given B cell subtype,
  with color indicating the normalized enrichment score (NES) and dot size reflecting
  the number of genes contributing to the differential regulation (Gene count). Enrichment
  was performed using curated gene sets related to immune and signaling pathways.(F)
  Bar graph showing the number and size of clones in each B cell subtypes across groups
  after downsampling (2,477 cells per group) to normalize cell numbers across groups
