figure_title: Dual mechanisms of ZDHHC13-mediated melanoma metastasis suppression
caption: '(A) 2 × 105 B16 stably expressing WT or C618S CTNND1 in 100 μl PBS were
  injected into C57BL/6 mice or C57BL/6 Mmp12 knockout (KO) mice via the tail vein.
  Pulmonary metastases were assessed 14 days after tumor cell injection. Data are
  mean ±SD (n = 6). *P < 0.05, **P < 0.01, ***P < 0.001, group comparisons were performed
  using Dunnett’s test. (B) H&E staining of lungs displayed in A. Scale bars: 185
  μm. (C) ZDHHC13 regulates melanoma metastasis via 2 parallel and partially overlapping
  pathways: (a) by enhancing CTNND1 palmitoylation and stabilizing E-cadherin (Figures
  1–3), and (b) by modulating the immune microenvironment through macrophage-mediated
  mechanisms (Figures 5–7)'
article_title: S-acyl transferase ZDHHC13 modulates tumor microenvironment interactions
  to suppress metastasis in melanoma models
