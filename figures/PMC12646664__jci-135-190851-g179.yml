figure_title: GIV dampens inflammation and promotes bacterial clearance in MDP-stimulated
  macrophages
caption: '(A) Immunoblot of control (shC) or shGIV RAW 264.7 cells. (B and C) Workflow
  of the NF-κB reporter assay in RAW 264.7 cells (B). Bar graphs display the fold
  change in NF-κB activity (C). (D) Immunoblot of WT (control) and GIV-KO THP1-NF-kB
  SEAP reporter cell line–derived macrophages. (E–G) Workflow of the NF-κB reporter
  assay in CRISPR-depleted human THP-1 cells expressing an NF-κB activity–tracking
  reporter (E). Line graphs (F) and AUC bar graphs (G) display the fold change in
  NF-κB activity relative to WT control. (H) Workflow of the bacterial clearance assay
  (H). (I) Line graphs show the viable bacterial counts in the peritoneal macrophages.
  (J) Immunoblot of WT or GIV-KO THP1 monocyte–derived macrophage. (K) Workflow of
  the gentamicin protection assay in THP1 cells. (L) Bar graphs show the viable bacterial
  counts in the THP1 monocyte–derived macrophage. (M) Immunofluorescence images display
  representative fields of TGPMs challenged with live AIEC-LF82 (MOI 1:30) for 1 hour.
  Scale bar: 20 μM. Bar graphs display quantification of intracellular AIEC-LF82;
  n = 4–6. (N) Workflow for multiplexed proteomics analyses. (O and P) Bar graphs
  showing biological process as determined by Gene Ontology biological process (GOBP)
  analysis (red indicates the pathways cited in the text). (Q and R) Schematics summarizing
  findings in cells with GIV (Q) and without GIV (R). All results are displayed as
  mean ± SEM (n = 3 biological replicates). Significance was tested using 1-way ANOVA
  with Tukey’s test (C and G), 2-way ANOVA with Tukey’s test (F and I), and 2-tailed
  Student’s t test (L and N). P ≤ 0.05 is considered significant. Luc, luciferase;
  Reg, regulation'
