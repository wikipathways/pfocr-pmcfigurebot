caption: Diagram of the regulatory network of the plant hormone signal transduction
  pathway. Some key genes on the endogenous IAA, CTK, GA, ABA, and BR signaling pathways
  were screened, and the expression heat map was performed using the FPKM values of
  transcriptome sequencing data, with high expression in red and low expression in
  blue. Solid arrows indicate direct facilitation, dashed arrows indicate indirect
  facilitation, and solid horizontal lines indicate direct inhibition. Different colored
  dashed boxes indicate key genes on different endogenous hormone signaling pathways
