figure_title: Inhibition of the TWEAK/Fn14/NF-κB/NLRP3 pathway enhances the functional
  properties of iPDLSCs.
caption: Inhibition of the TWEAK/Fn14/NF-κB/NLRP3 pathway enhances the functional
  properties of iPDLSCs. (A) Expression profile of surface markers in iPDLSCs quantified
  using flow cytometry. (B) Levels of TWEAK, Fn14, NF-κB, P-NF-κB and NLRP3 in PDLSCs,
  iPDLSCs, and iPDLSCs after the downregulation of Fn14, NF-κB and NLRP3, and (C)
  statistical analysis of the band density values (n=3). (D) Apoptosis levels in PDLSCs,
  iPDLSCs, and iPDLSCs after downregulation of Fn14, NF-κB and NLRP3 were detected
  using the TUNEL assay, and (E) statistical analysis of the average fluorescence
  intensity of TUNEL was performed (n=5). Scale bar, 200 μm. (F) A Cell Counting Kit-8
  assay was used to assess the proliferative potential of PDLSCs, iPDLSCs, and iPDLSCs
  after the downregulation of Fn14, NF-κB and NLRP3, and (G) statistical analysis
  of the OD450 values on day 5 of the experiment was performed (n=6). (H) Transwell
  migration assay evaluating the migratory potential of PDLSCs, iPDLSCs, and iPDLSCs
  after Fn14, NF-κB or NLRP3 downregulation, with (I) quantification of the number
  of migrated cells (n=6). Scale bar, 400 μm. (J) Wound healing assay evaluating the
  migratory potential of PDLSCs, iPDLSCs, and iPDLSCs after Fn14, NF-κB or NLRP3 downregulation,
  with (K) quantification of the percentage of wound closure (%) (n=16). Scale bar,
  1 mm. (L) ALP staining was used to evaluate the mineralization potential of PDLSCs,
  iPDLSCs, and iPDLSCs after downregulation of Fn14, NF-κB or NLRP3, with (M) quantification
  of the integral optical density of the ALP-stained images (n=6). Scale bar, 400
  μm. (N) Alizarin Red staining was used to evaluate the mineralization potential
  of PDLSCs, iPDLSCs, and iPDLSCs after downregulation of Fn14, NF-κB or NLRP3, with
  (O) quantification of the integral optical density of the Alizarin Red-stained images
  (n=6). Scale bar, 400 μm. (P) Reverse transcription-quantitative PCR was used to
  evaluate the mRNA expression levels of RUNX2, SP7, ALP and OPG in PDLSCs, iPDLSCs,
  and iPDLSCs after the downregulation of Fn14, NF-κB and NLRP3 (n=4). (Q) Western
  blotting was used to detect the expression levels of RUNX2, SP7, ALP and OPG in
  PDLSCs, iPDLSCs, and iPDLSCs after the downregulation of Fn14, NF-κB and NLRP3,
  and (R) statistical analysis of the band density values was performed (n=3). Statistical
  analysis was performed using a one-way ANOVA. *P<0.05; **P<0.01; ***P<0.001; ****P<0.0001.
  Data are presented as the mean ± SD. ALP, alkaline phosphatase; Fn14, fibroblast
  growth factor-inducible 14; IOD, integral optical density; iPDLSC, inflammatory
  PDLSC; NLRP3, NOD-like receptor thermal protein domain-associated protein 3; ns,
  not significant; OD450, optical density at 450 nm; OPG, osteoprotegerin; P-, phosphorylated;
  PDLSC, periodontal ligament stem cell; RUNX2, runt-related transcription factor
  2; sh, short hairpin RNA; SP7, Sp7 transcription factor; TWEAK, tumor necrosis factor-like
  weak inducer of apoptosis
