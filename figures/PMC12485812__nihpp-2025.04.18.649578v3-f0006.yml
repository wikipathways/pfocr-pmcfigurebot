figure_title: A pathway from the cerebellar nuclei via the zona incerta and thalamic
  nucleus POm to S1 cortex
caption: '(A) Schematic of dual-injection strategy to label outputs of zona incerta
  (ZI) neurons receiving input from contralateral cerebellar nuclei. (B) EYFP expression
  in the left hemisphere (left; scale bar: 1mm) with higher magnification images taken
  in the same slice. Center: EYFP expression in the ZI. Right: labeled axons in the
  posterior medial nucleus (POm; bottom; scale bar: 20µm) and S1 cortex (top; scale
  bar: 10µm). (C) Quantification of cerebellar nuclei projections to the ZI. Curves
  show terminal density distribution from dorsal ZI (dZI) to ventral ZI (vZI). Color
  of curves correspond to images taken along the rostro-caudal axis (green: top (rostral)
  image; navy: center image; light blue: bottom (caudal) image. Scale bars: 500µm.
  (D) Labeling strategy for electrophysiological recordings shown in (E-F). Scale
  bar: 1mm. (E) Whole-cell patch-clamp recordings from POm-projecting ZI neurons receiving
  input from cerebellar nuclei. Top: responses to depolarizing current pulses in the
  absence (left) and presence (right) of TTX (1µM). Bottom: Responses in ZI cells
  to photostimulation of ChR2-expressing terminals from cerebellar nuclei neurons
  in the absence (let) and presence (right) of TTX. (F) Amplitude (left) and latency
  (right) of photostimulation-evoked EPSPs before (n=5) and after (n=3) wash-in of
  TTX. (G) Experimental configuration for recordings from mice expressing inhibiting
  hM4D(Gi) receptors in PV-expressing ZI interneurons. (H) In the presence of DCZ,
  the suppressive effect of CF co-activation on acute whisker responses of L2/3 pyramidal
  neurons is blocked (n=80 cells; N=3 mice). (I) Bar graphs: analysis by neuron. Box:
  25th and 75th percentiles; line: median; whiskers: range. Trace scale bars: 0.1
  ∆F/F; 0.5s'
