figure_title: Differential gene expression and pathway analysis in LMOD1-deficient
  SMCs
caption: (A) Volcano plot illustrating differential gene expression between siCON
  and siLMOD1-transfected SMCs. The y-axis represents the -log10 adjusted p-value,
  and the x-axis represents the log2 fold change. Differentially expressed genes that
  are significantly up- or down regulated (adjusted p-value < 0.05) are color coded.
  Triangles were used to represent any values greater than the displayed x-axis cutoffs
  to improve visualization and interpretation. (B) Disease Class enrichment from The
  Database for Annotation, Visualization, and Integrated Discovery (DAVID) for significantly
  differentially expressed genes in LMOD1-deficient SMCs are shown and ranked by count,
  with the CARDIOVASCULAR term labeled in red. Pathway enrichment analysis using KEGG
  (C), Biocarta (D), and Reactome (E) databases, showing the top enriched pathways
  of differentially expressed genes that are significantly up- or down regulated in
  LMOD1-deficient SMCs. (n=5 siCON vs. n=4 siLMOD1). Cell cycle-related enriched terms
  are labeled in red
