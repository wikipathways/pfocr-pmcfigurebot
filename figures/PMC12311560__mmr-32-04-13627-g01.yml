figure_title: OMT mitigates PF by activating the APE1 and PINK1/Parkin pathways, and
  promoting autophagy and mitochondrial function restoration.
caption: OMT mitigates PF by activating the APE1 and PINK1/Parkin pathways, and promoting
  autophagy and mitochondrial function restoration. (A) RT-qPCR of the relative expression
  of APE1 mRNA following APE1 silencing in LLC cells. (B) Western blotting of the
  relative expression of APE1 protein following APE1 silencing in LLC cells. (C) IHC
  staining of APE1, PINK1 and Parkin expression in the lung tissue of C57BL/6 mice
  (scale bar, 100 µm). Semi-quantitative analysis of (D) APE1, (E) PINK1 and (F) Parkin
  IHC staining. Data are presented as the mean ± SD. Statistical significance was
  analyzed using one-way ANOVA. ***P<0.001. OMT, oxymatrine; NAC, N-acetylcysteine;
  APE1, apurinic/apyrimidinic endonuclease-1; PINK1, PTEN-induced kinase 1; KD, knockdown;
  mdivi-1 mitophagy inhibitor mitochondrial division inhibitor-1, RT-qPCR, reverse
  transcription-quantitative PCR; LC-3, microtubule-associated proteins 1A/1B light
  chain 3; TOM20, outer membrane translocase 20; NC, negative control; IHC, immunohistochemical
