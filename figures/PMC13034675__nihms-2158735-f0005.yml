figure_title: Preclinical and clinical evaluation of Hh signaling and ciliogenesis-targeted
  therapies
caption: 'The schematic summarizes the preclinical and clinical landscape of Hh pathway
  and ciliogenesis-based therapeutic strategies in PCa. Preclinical findings: Constitutive
  activation of the Shh–Ptch1–SMO–Gli cascade promotes tumor initiation, invasion,
  and metastasis in PCa models. Inhibition of Hh signaling with small-molecule inhibitors,
  along with genetic or pharmacologic modulation of ciliogenesis regulators (IFT88,
  KIF3a, Aurora A kinase, NEK2), effectively suppresses epithelial–mesenchymal transition
  (EMT), cancer stemness, and tumor growth. Clinical evaluation: Several SMO/Gli inhibitors
  have advanced to clinical trials but demonstrated limited efficacy in PCa treatment'
