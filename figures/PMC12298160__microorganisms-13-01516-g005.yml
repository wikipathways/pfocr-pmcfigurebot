figure_title: CsrA modulates genes involved in ABC transporters, the bacterial secretion
  system, the outer membrane, and transcription factors.
caption: 'CsrA modulates genes involved in ABC transporters, the bacterial secretion
  system, the outer membrane, and transcription factors. (A) The expression of genes
  of amino acid transporters, peptide transporters, and siderophore-related genes
  by qPCR in wildtype and csrA mutant strains. Blue represents genes of amino acid
  transport (proX, aotP, braF, putP, argT, artI, artP, artI, ousX, and ousV), purple
  represents genes of oligopeptide transport (oppF, oppD, oppA, oppC, dppC, gsiA,
  yejF, dppB, oppF, and mppA), and green represents genes of iron transport (fiu,
  hgbA, fecA, feoA, and viuB). (B) (left panel) The GSEA of the ABC transporter pathway
  in the csrA mutant compared to the wildtype. The normalized enrichment score (NES)
  and false discovery rate (FDR) are indicated. Significant enrichment (FDR = 0.05)
  suggests an altered ABC transporter pathway in the csrA mutant. (right panel) A
  heatmap of the gene expression levels for selected key genes involved in the ABC
  transporter. Rows represent genes, and columns represent samples. Expression levels
  are normalized and color-coded (red: upregulation; blue: downregulation). Data are
  derived from RNA-seq analysis (n = 3). (C) The expression of genes involved in bacterial
  secretion systems in wildtype and csrA mutant strains by qPCR. Orange represents
  genes involved in T6SS (tagH, tssC1, tssC2, tssB1, tssA, tssL, tssM1, and hcp).
  Blue represents genes involved in T3SS (cesT, BAU10_07795, yopD, sctC, and hopJ).
  (D) The expression of genes involved in outer membrane proteins (ompV, ompN1, ompW,
  ompA2, oprF, ompA3, ompA, ompP1, ompT, and ompN2) in the wildtype and csrA mutant
  strains by qPCR. (E) The expression of genes involved in outer transcription (nhaR,
  hlyU, crl, yeaG, lrp, csgD, rpoS, dctD, dmlR, rsd, rpoE, rbcR, and cspD) in the
  wildtype and csrA mutant strains by qPCR. The relative expression of the ZJ-T-csrAR6H
  strain is divided by that of the WT. The data are presented as the mean ± SD. Statistical
  significance was determined using Student’s t-test, p value: ns, p > 0.05; *, p
  < 0.05; **, p < 0.01; ***, p < 0.001; ****, p < 0.0001'
