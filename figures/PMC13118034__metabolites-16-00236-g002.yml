figure_title: Annotation coverage and structural composition of EHMN 2026.
caption: 'Annotation coverage and structural composition of EHMN 2026. (A) GPR coverage:
  of 22,642 total reactions, 9638 (42.6%) carry explicit gene–protein–reaction associations;
  13,004 reactions (57.4%) include exchange, sink/demand, transport, and legacy reactions
  for which no enzymatic gene is expected by design. (B) Gene and pathway integration:
  EHMN 2026 encodes 3996 gene products mapped to 2887 unique Ensembl gene identifiers
  (ENSG) and 2194 unique Reactome pathway annotations spanning 642 leaf-level events.
  (C) Metabolite annotation density: of 14,321 species, 80.6% are matched to MetaNetX
  MNXref identifiers and 53.6% carry validated ChEBI annotations, reflecting systematic
  identifier harmonisation across all 11 compartments'
