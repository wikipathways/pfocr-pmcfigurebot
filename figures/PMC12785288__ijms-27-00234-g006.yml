caption: 'Gene expression involved in the (A) upstream Hippo and (B) downstream epithelial–mesenchymal
  transition (EMT) cancer pathways following shell extract treatment of the colon
  cancer cell lines HCT116 and HT29. The blue and red bars represent the level and
  intensity of gene expression. EMT and MET are non-binary reversible processes that
  emphasise the plasticity of cells to transit between these two states. Statistical
  analysis was performed using a paired t-test compared to untreated control cells.
  Asterisks indicate p-values: *, p < 0.05'
