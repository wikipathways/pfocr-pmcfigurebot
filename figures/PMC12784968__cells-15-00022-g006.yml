caption: 'Phenotype reversal in the presence of MEK, mTOR and Rho/ROCK pathway inhibitors.
  (A) Representative brightfield and fluorescent images of control (left) or mutant
  (right) spheroids 18 days after addition of vehicle (DMSO, 0.1%), MEK inhibitor
  (UO126, 10 µM), mTOR inhibitor (Rapamycin, 10 µM), or Rho/ROCK inhibitor (Y27632,
  10 µM). (Incucyte SX5, scale bar = 400 µm). (B) Representative live-imaging data
  of a single experiment (mean ± SD, 3–6 technical replicates per group) demonstrating
  typical spheroid growth curve responses over 18 days after 10 µM inhibitor addition.
  Left graph: control spheroids. Right graph: mutant KRAS spheroids. Spheroid size
  was determined by mask creation and normalized to time zero (Incucyte SX5). (C)
  The area of mutant KRAS spheroids treated with vehicle or Y27632 were independently
  measured using the freehand drawing tool in Image J. (mean ± SD, n = 15 spheroids
  per group obtained from 3 independent experiments). Data were analyzed using Student’s
  t-test (unpaired), ** p < 0.01. (D) The fraction of mutant KRAS spheroids that demonstrated
  blebbing after treatment with vehicle or Y27632. Data were inserted into a 2 × 2
  contingency table and analyzed using Fisher’s Exact Test, **** p < 0.0001. (E) After
  18 days of inhibitor treatment spheroids were transferred to adhesive flat-bottom
  tissue culture plates to assess outgrowth (EVOS FL, scale bar = 200 µm; higher magnification
  images can be found at Supplementary Figure S5)'
