caption: 'Comparison of differential metabolites among the control group, HHcy hypertension
  group, and FA treatment group in rats. (A,B) Bar plots displaying the fold change
  of differential blood metabolites in the HCY (A) and FA (B) groups compared with
  the control group. Key altered metabolites such as linoleic acid, arachidonic acid
  (peroxide free), all cis-(6,9,12)-linolenic acid, citraconic acid, and 20-hydroxyarachidonic
  acid are highlighted. (C) KEGG enrichment analysis showing that arachidonic acid
  metabolism and linoleic acid metabolism are significantly enriched pathways. Dot
  size indicates the number of involved metabolites, and color reflects the adjusted
  p-value. (D) Relative expression of key metabolites in plasma, including fatty acids
  (linoleic acid, γ-linolenic acid, arachidonic acid), 20-HETE, and HCY-related compounds.
  Data are presented as mean ± SD; * p < 0.05, ** p < 0.01, and *** p < 0.001. NS:
  not significant'
