figure_title: Parallel spinothalamic tract (STT) pathways drive mechanical hypersensitization
caption: 'a, Representative images of transsynaptically labeled neurons in the thalamus
  and their terminals in the SS. Transsynaptic AAV1-Cre was injected in the spinal
  cord (SC), and AAV8-FLEX-mScarlet was injected in the thalamus. Po: posterior complex
  of the thalamus; VPL: ventral posterolateral nucleus. Scale Bar: 500 μm. b, Functional
  connectivity between Po, VPL with retrogradely labeled lSuC projecting neurons in
  layer 5 and neighboring layer 4 neurons in SS. Upper panel: representative traces
  of optical EPSC (oEPSC). Lower panel: Quantification of connectivity. Number in
  bar graph: cell with oEPSC/total recorded cells. Scale bar: 50 ms, 50 pA. c, Quantification
  of mechanical thresholds after saline (black, n = 5–7) and CLZ (blue, n = 5–7) injection
  into mice expressing hM4D in the SC→VPL pathway (left) or SC→Po pathway (right),
  respectively. CLZ: clozapine. d, Quantification of mechanical thresholds after saline
  (black, n = 7) and CLZ (blue, n = 7) injection into mice expressing hM4D in both
  the SC-VPL and SC-Po pathways. Wilcoxon matched-pairs signed rank test, * P < 0.05.
  e, Quantification of CPA after silencing SC-VPL (n = 6) or SC-Po (n = 5) pathway
  along or SC→VPL + SC→Po pathways together (n = 5). One-way ANOVA, * P < 0.05, ***
  P < 0.001. f, Quantification of mechanical thresholds of non-injured mice after
  repetitive CLZ injection into mice expressing hM3D in SC→Po (left, n = 5) or SC→VPL
  (right, n = 5). Black, before CLZ infusion; red, after CLZ infusion. Mechanical
  thresholds: Dunn’s multiple comparisons test, * P < 0.05, ** P < 0.01, *** P < 0.001.
  g, Quantification of CPA after repetitive activation of SC-VPL (n = 5) or SC-Po
  (n = 5) pathway. Control (Black, n = 5). Non-parametric ANOVA, * P < 0.05. h, Diagram
  (left) and quantification (right) of silencing the SC→VPL + SC→Po pathways together
  (yellow, n = 5) or the DCN-VPL pathway (white, n = 6) or wildtype mice without manipulation
  (WT, gray, n = 5) on texture discrimination score. Black, saline; blue, CLZ. Wilcoxon
  matched-pairs signed rank test, * P <0.05. i, Diagram (left) and quantification
  (right) of silencing the SC→VPL + SC→Po pathways together (yellow, n = 6) or the
  DCN→VPL pathway (white, n = 6) or wildtype mice without manipulation (WT, gray,
  n = 5) on novel object with novel texture. One-way ANOVA, *** P < 0.001. Mean ±
  SEM'
