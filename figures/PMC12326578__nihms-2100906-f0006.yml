figure_title: Deletion of Ptprs shows no change in the protection or recovery of the
  nigrostriatal pathway from the 6-OHDA unilateral injection model.
caption: Deletion of Ptprs shows no change in the protection or recovery of the nigrostriatal
  pathway from the 6-OHDA unilateral injection model. (A) Mouse model (left) used
  for DatIRES-Cre-Ptprswt/wt (WT) and DatIRES-Cre-Ptprsfl/fl (cKO) in the experimental
  timeline (right) for the 6-OHDA unilateral partial lesion model. (B) Representative
  images of the SN showing the contralateral and ipsilateral sides for WT and cKO
  mice 31 days after 6-OHDA injection. (C) Unbiased stereological quantification of
  TH+ cells in the contralateral and ipsilateral SN and VTA. (D) Representative images
  of the striatum with TH DAB staining on the contralateral and ipsilateral sides
  31 days after the 6-OHDA injection. Quantification of (E) TH+ fiber area for contralateral
  and ipsilateral sides and (F) % TH+ fibers remaining. (G) Schematic showing the
  rotation test methodology. (H) Methamphetamine-induced rotation test showing the
  number of net rotations 30 days following 6-OHDA injection. n = 5–6 per group. Two-way
  ANOVA with Tukey’s post hoc pairwise analysis, or student’s t-test was used for
  statistical analysis. Mean ± SEM. ****p < 0.0001, ns = not significant
article_title: Inhibition of PTPRS function does not affect the survival or regeneration
  of dopaminergic neurons but alters synaptic function in the nigrostriatal pathway
