caption: Analysis and function annotation of DE miRNAs during goose feather follicle
  primordium development. (A) Volcano plot illustrating the distribution of DE miRNAs
  between pre-primordium (V0) and post-primordium (V1) stages. Red points indicate
  significantly upregulated miRNAs, blue points represent significantly downregulated
  miRNAs, and gray points denote miRNAs without significant expression changes. (B–D)
  The top 20 highly enriched terms in biological processes, molecular functions, and
  cellular components are displayed by GO enrichment analysis of miRNA target genes.
  The y-axis lists the individual GO terms, and the x-axis shows the number of miRNAs
  enriched in each term. (E) KEGG pathway enrichment analysis showing the top 20 significantly
  enriched pathways. The color gradient represents the enrichment significance from
  red (most significant) to green (least significant). The color gradient indicates
  enrichment significance, ranging from red (most significant) to green (least significant),
  while the size of the dots reflects the quantity of miRNAs associated with each
  pathway. miRNAs mapped to each pathway. Color intensity represents normalized expression
  levels, where red denotes high expression and blue signifies low expression in relation
