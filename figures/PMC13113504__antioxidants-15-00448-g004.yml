figure_title: Transcriptional induction of the Nrf2/HO-1 signaling pathway by mud
  extract.
caption: Transcriptional induction of the Nrf2/HO-1 signaling pathway by mud extract.
  Relative mRNA expression levels of (A) Nrf2 and (B) HO-1 were determined by RT-qPCR
  in L929 and RAW 264.7 cells 12 h after treatment with various concentrations (0,
  10, 100, and 1000 μg/mL) of mud extract. Values were normalized to GAPDH and are
  expressed as fold changes relative to the untreated control (0 μg/mL). While L929
  fibroblasts showed a modest increase in antioxidant gene expression, RAW 264.7 macrophages
  exhibited a robust, dose-dependent upregulation of both Nrf2 and HO-1. The data
  are presented as the mean ± SD (n = 3). Asterisks indicate statistically significant
  differences compared with the 0 μg/mL group (* p < 0.05, ** p < 0.01, *** p < 0.001)
