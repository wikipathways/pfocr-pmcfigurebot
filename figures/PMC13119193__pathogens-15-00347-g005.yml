figure_title: Angiogenesis and immune modulation in trypanosomatid infections.
caption: Angiogenesis and immune modulation in trypanosomatid infections. Trypanosoma
  spp. regulate vascular responses through both proangiogenic (VEGF, MMPs, and inflammatory
  cytokines) and antiangiogenic (e.g., calreticulin and P21) factors, influencing
  tissue remodeling and fibrosis. Hypoxia, HIF-1α, and nitric oxide pathways contribute
  to parasite survival and disease progression, highlighting the context-dependent
  balance between vascular damage and repair
