caption: 'Metabolomics (LC-MS) pathway analysis in fecal samples from NHPs (N = 8).
  Panel A: Peak to pathway enrichment analysis using the mummichog program for day
  3. The number of significant pathway hits (indicated by size) are organized by gamma-adjusted
  P values (darker shading indicates more significance). Panel B: Cytoscape networks
  for bile acid biosynthesis, C-21, and C-18 steroid hormone pathways. Putatively
  identified nodes that were significantly dysregulated in each pathway are shown
  as filled nodes. The remaining nodes (no fill) were retained for connectivity'
