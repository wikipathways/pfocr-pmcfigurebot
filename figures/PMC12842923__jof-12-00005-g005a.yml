figure_title: Transcriptomic characteristics of G.
caption: Transcriptomic characteristics of G. lucidum cultivated under different CO2
  conditions. (a) Statistical analysis of DEGs.; (b) The heatmap of transcriptomic
  data. The rows represent individual DEGs and the columns represent the sample groups.
  The color gradient indicates the relative expression level, with red signifying
  high expression and blue signifying low expression; (c–e) GO enrichment bubble plot
  for DEGs in J vs. M (c), K vs. N (d), and L vs. O (e). The x-axis shows the ratio
  of the number of DEGs to the total number of genes annotated within a specific GO
  term (representing enrichment level) and the y-axis represents the GO term, respectively.
  The size of the bubble represents the number of DEGs in the term, and the color
  corresponds to the q-value (redder colors indicate higher significance). Terms highlighted
  in red text are significantly enriched (q < 0.05); (f–h) KEGG enrichment bar plot
  for the DEGs in J vs. M (f), K vs. N (g), and L vs. O (h). The y-axis lists the
  KEGG pathways and the number at the end of each bar represents the count of DEGs
  enriched in that pathway. Terms highlighted in red text are significantly enriched
  (q < 0.05)
