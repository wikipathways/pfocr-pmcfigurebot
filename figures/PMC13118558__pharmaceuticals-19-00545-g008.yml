figure_title: KEGG Pathway Enrichment Analysis of Molecular Pathways Associated with
  the MMC–Quercetin Combination.
caption: KEGG Pathway Enrichment Analysis of Molecular Pathways Associated with the
  MMC–Quercetin Combination. KEGG pathway enrichment analysis was conducted using
  STRING-derived protein–protein interaction data to identify molecular pathways associated
  with the combined effects of MMC and quercetin. Significantly enriched pathways
  were determined based on false discovery rate (FDR) values. Among the most prominently
  enriched categories were the p53 signaling pathway, apoptosis, and cell cycle-related
  pathways. Bar plots depict the number of genes mapped to each pathway, whereas the
  dashed line indicates −log10(FDR) values. Pathways with FDR < 0.05 were considered
  statistically significant. These analyses were performed to support mechanistic
  interpretation and do not constitute direct experimental validation
