figure_title: Pathophysiological process in the development of vulvovaginal candidiasis.
caption: Pathophysiological process in the development of vulvovaginal candidiasis.
  The onset of VVC is triggered by the secretion of cytotoxic proteins of C. albicans
  (proteolytic enzymes and candidalysin) and the activation of the NLRP3 inflammasome
  signaling pathway, which leads to an inflammatory response (production of cytokines
  and chemokines by epithelial cells). The recruitment of cells belonging to the innate
  immune system (polymorphonuclear cells and macrophages) within the vaginal canal
  is the primary cause of the clinical symptoms associated with C. albicans infection.
  The transition from yeast to hyphae triggers NLRP3 activation, rendering the NLRP3
  inflammasome a crucial contributor to host immunopathology
