figure_title: Genome-wide patterns of repair by the nucleotide excision repair (NER)
  pathway in wild-type yeast incubated in the dark.
caption: Genome-wide patterns of repair by the nucleotide excision repair (NER) pathway
  in wild-type yeast incubated in the dark. (A) Percentage of cyclobutane pyrimidine
  dimers (CPDs) repaired in UV-irradiated yeast cells after 1 h repair in the dark.
  Schematic from data derived from T4 endonuclease V digestion of yeast genomic DNA
  followed by alkaline gel analysis.13 (B) Schematic showing fraction of unrepaired
  CPDs in UV-irradiated yeast cells after 1 h repair in the dark along the non-transcribed
  strand (NTS; depicted in red) and transcribed strand (TS; depicted in blue) for
  ~5000 yeast genes. The left dotted vertical line indicates the approximate location
  of the transcription start site (TSS), while the right dotted line indicates the
  approximate location of the transcription end site (TES). There are fewer unrepaired
  CPDs along the TS, consistent with fast repair by the TC-NER pathway. (C) Schematic
  showing high-resolution analysis of unrepaired CPDs relative to the transcription
  start sites (TSS) of yeast genes after 1 h repair in the dark along the non-transcribed
  strand (NTS; depicted in red) and transcribed strand (TS; depicted in blue). Repair
  of the NTS (but not the TS) is slower at positioned nucleosomes (dyad positions
  indicated in gray), resulting in a higher fraction of unrepaired CPDs at these positions.
  Schematics for panel B and C derived from published data.13,36,87
