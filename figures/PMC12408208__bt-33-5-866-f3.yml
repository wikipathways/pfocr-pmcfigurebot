figure_title: Effect of AMPamide on the expression of TLR4 and TLR6.
caption: 'Effect of AMPamide on the expression of TLR4 and TLR6. (A) The mRNA expression
  levels of TLR4 and TLR6 were quantified via RT-qPCR using extracts from HaCaT cell
  cultures. Cells were pretreated with 12.5, 25, or 50 µM AMPamide for 2 h, followed
  by stimulation with LPS for 24 h. (B) Western blot analysis was performed to assess
  the effects of AMPamide on the TLR signaling pathway in HaCaT cells. Cells were
  treated with 12.5, 25, or 50 µM AMPamide for 24 h, followed by LPS stimulation for
  3 h. (C) Band intensities were quantified using ImageJ. The relative intensities
  of TLR4, TLR6, and MyD88 were normalized to β-actin, which served as the internal
  control. (D) NF-κB-positive cells in keratinocyte cultures were visualized following
  a 24-h AMPamide treatment and subsequent LPS stimulation for 3 h. Nuclei were identified
  via DAPI staining. (E) The histogram represents the percentage of NF-κB-positive
  cells, quantifying NF-κB activation. Scale bar: 50 μm. Data are expressed as the
  mean ± SEM from at least three independent experiments. #p<0.05, ##p<0.01 compared
  with the untreated control; *p<0.05, **p<0.01 compared with the LPS-stimulated control
  group'
