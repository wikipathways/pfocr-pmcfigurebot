figure_title: The two missense p53 mutants differentially control redox potential
  and Nrf2 activation
caption: (A) Transcriptional profiles of redox regulatory genes displayed by the indicated
  ID8 sublines, including derivatives expressing p53-R270H and p53-R172H. The enzymatic
  antioxidant genes are functionally segregated, and all genes are classified according
  to their control by Nrf2. (B) The indicated ID8 sub-lines were seeded on coverslips
  and incubated overnight. Thereafter, the cells were fixed and probed using phalloidin
  or an anti-Nrf2 antibody, followed by a secondary antibody. DAPI was used to stain
  nuclei. Shown are representative images corresponding to Nrf2 immunofluorescence
  (green), phalloidin (red) and DAPI (blue). Bar, 20 μm. Images were captured using
  a confocal microscope. Nrf2 staining was quantified and normalized using ImageJ.
  *, p< 0.05, **, p< 0.01, ***, p<0.001. (C) Whole extracts of the indicated ID8 sublines
  were analyzed using immunoblotting for redox and autophagy markers. Vinculin was
  used as a gel loading control. (D) (left panel) The indicated ID8 derivatives (3×103
  cells) were seeded in 96-well plates and treated for 72 hours with increasing concentrations
  of Cisplatin. Cell viability was measured using the MTT (3(4,5 dimethylthiazol-2-yl)-2,5diphenyltetrazolium
  bromide) assay. Averages +S.D. of quadruplicates are shown. This experiment was
  repeated thrice. (right panel) ID8 derivatives were seeded in 96-well plates (500
  cells/well) and treated with Cisplatin (3 μM). Media were refreshed once every three
  days. After nine days, cells were fixed and stained with crystal violet. The results
  of one of three experiments are shown. Note that the p53−/− and the R270H lines
  gained resistance to CDDP. (E) Shown are the results of a Gene Set Enrichment Analysis
  (GSEA), which was applied on the differentially expressed genes between p53-R175H
  and p53-R273H ovarian tumors of the TCGA patient dataset (with both the KEGG pathways
  and the Hallmark gene sets). Note upregulation of the NF-κB pathway, mediated by
  TNF-alpha signaling, in the p53-R273H patients
