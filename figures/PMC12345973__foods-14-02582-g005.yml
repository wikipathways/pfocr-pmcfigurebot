caption: 'Compound-level visualization of anthocyanin-related metabolites in napier
  grass. (A) Reference pathways of major flavonoids’ and anthocyanins’ biosynthesis
  used for compound annotation. The pathway diagram was constructed based on the KEGG
  reference pathways for flavonoid biosynthesis (ko00941) and anthocyanin biosynthesis
  (ko00942), accessed on 18 April 2025. Only the major metabolic branches relevant
  to the detected compounds are presented. Background colors indicate different sections:
  phenylpropanoid and chalcone branch (yellow), core flavonoid pathway (green), and
  anthocyanin branch (purple). Solid black arrows represent known biochemical conversions;
  dashed arrows indicate multi-step transformations. Gray arrows denote routes to
  compounds that were not detected in this study. (B) Heatmap showing the relative
  abundance of flavonoids and anthocyanin-related metabolites mapped in (A). This
  heatmap was generated using OriginPro 2021 with the Clustergram App, applying logarithm
  transformation and column-wise hierarchical clustering based on the Euclidean distance
  and average linkage. Each value in the heatmap represents the mean of three technical
  replicates derived from pooled tissue samples, as described in Section 2.1'
