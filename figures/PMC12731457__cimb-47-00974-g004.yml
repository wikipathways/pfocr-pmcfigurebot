figure_title: USP30-AS1 promotes breast cancer cell invasion and migration by enhancing
  WNT transcriptional activity.
caption: 'USP30-AS1 promotes breast cancer cell invasion and migration by enhancing
  WNT transcriptional activity. (A) Transwell migration and invasion assays evaluating
  the effect of stable USP30-AS1 knockdown with shRNA in breast cancer cells. Scale
  bar: 100 μm. (B) Quantitative analysis of the number of migrated and invaded cells.
  (C) Correlation analysis between USP30-AS1 expression and Wnt pathway-related genes
  (TCF7, WNT1, WNT10, MMP7) in breast cancer using cBioPortal. (D) Dual-luciferase
  reporter assay assessing TCF/LEF transcriptional activity in MDA-MB-231 and MCF-7
  cells treated with control, Wnt inhibitor, non-targeting control siRNA, or USP30-AS1-targeting
  siRNA. (E) Luciferase reporter assay evaluating the effect of vector or USP30-AS1
  overexpression on Wnt pathway transcriptional activity in MDA-MB-231 and MCF-7 cells.
  * p < 0.05, ** p < 0.01, *** p < 0.001, and **** p < 0.0001 versus shNC, Ctrl, siNC
  or Vector'
