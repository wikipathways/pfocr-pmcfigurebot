figure_title: Classical complement pathway activation with immune complexes composed
  of serum IgG and E.
caption: Classical complement pathway activation with immune complexes composed of
  serum IgG and E. coli and/or L. paracasei. The ability of paired sera samples collected
  from two pediatric patients with UC (PAIR-1 and PAIR-3) during active and remission
  stages to activate the classical complement pathway was compared after incubation
  with E. coli (EC; orange bars), L. paracasei (LPC; light blue bars), or both (dark
  blue bars). Data are expressed as the mean ± standard error of the mean (SEM) from
  three independent experiments. Within each serum sample, statistical comparisons
  among the three conditions were performed using a one-way ANOVA followed by Tukey’s
  post hoc test. Asterisks indicate statistically significant differences (*, p <
  0.05; **, p < 0.01)
