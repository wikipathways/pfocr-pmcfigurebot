figure_title: A schematic model for polypeptides-gold nanoparticles targeting c-Myc
  and inhibiting malignant tumor progression.
caption: A schematic model for polypeptides-gold nanoparticles targeting c-Myc and
  inhibiting malignant tumor progression. In BRAF and TERT dual-mutant tumors, BRAF
  can phosphorylate ERK to transcriptionally activate TERT by promoting Sp1 phosphorylation
  or GABP complex formation. Additionally, the transcription factor c-Myc protein
  is stabilized in three ways. Firstly, c-Myc can transcriptionally active BRAF to
  trigger hyperactivated ERK signaling which in turn phosphorylate Ser62 to stabilize
  c-Myc. Secondly, TERT which is transcribed by c-Myc can tightly combine with pS62-c-Myc,
  protecting c-Myc from degradation through inhibiting dephosphorylation at Ser62
  by PP2A. Therefore, BRAF can also be indirectly positively regulated by TERT. Thirdly,
  c-Myc can negatively regulate the transcription of PP2Ac to suppress the activity
  of PP2A, preventing c-Myc ubiquitination degradation pathway. Conclusively, there
  are positive feedback loops between BRAF, TERT and c-Myc in cancer cells for enhancing
  c-Myc stabilization in cascade. The exogenous polypeptides-gold nanoparticles are
  designed to compete with pS62-c-Myc on targeted binding with TERT, and polypeptides-gold
  nanoparticles possess potent anticancer ability through speeding c-Myc degradation
  and breaking c-Myc related feedback loops in BRAF and TERT dual-mutant tumor cells
