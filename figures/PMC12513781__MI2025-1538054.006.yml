figure_title: Interaction networks of mRNA–miRNA and mRNA–TF.
caption: Interaction networks of mRNA–miRNA and mRNA–TF. (a) The mRNA–miRNA interaction
  network illustrates regulatory relationships between key genes and their associated
  miRNAs. Purple circles represent mRNA molecules, while green rectangles indicate
  miRNAs predicted to interact with them, supported by evidence from at least three
  independent platforms. (b) The mRNA–TF interaction network depicts transcriptional
  regulation of key genes. Purple circles represent mRNA molecules, while orange rectangles
  indicate TFs predicted to regulate them. (c) A functional association network generated
  by GeneMANIA platform (http://genemania.org), illustrating relationships between
  key genes and other genes with similar functions. The inner circle contains eight
  key genes, while the outer circle displays functionally related genes identified
  through coexpression, protein–protein interactions, and pathway analyses. Edges
  colors represent different types of predicted associations. TF, transcription factor
