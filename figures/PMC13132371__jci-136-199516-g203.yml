figure_title: CD138+ TAMs promote the polarization and migration of Siglec-F+ neutrophils
  through the actions of SAA3 and CXCL1
caption: (A) Schematic illustrating the culture of BMDNs treated with CM derived from
  CD138+ or CD138– TAMs isolated from orthotopic tumors, as well as with SAA3 and/or
  CXCL1. (B and H) Representative images depicting the frequencies of Siglec-F+ in
  Ly6g+ neutrophils in BMDN cultures upon treatment with CM (B) or CXCL1 and/or SAA3
  (H). (C) Quantification of data from B (n = 3 per group). (D) Images revealing the
  percentages of SIGLEC-8+ in CD66B+ neutrophils in human peripheral blood–derived
  neutrophil (PBDN) cultures exposed to CM derived from CD138+ or CD138– TAMs in patients
  with PDAC. (E) Quantification of data from D (n = 4 per group). (F) Experimental
  approach to evaluate the cell migration capacity of BMDNs through a transwell culture
  system exposed to CM derived from CD138+ or CD138– TAMs isolated from orthotopic
  tumors, as well as to SAA3 and/or CXCL1. (G and J) Quantification of the number
  of migrated cells in the transwell culture system exposed to CM (G) or CXCL1 and/or
  SAA3 (J) (n = 3 per group). (I) Quantification of data from H (n = 3 per group).
  (K) Representative images depicting the frequencies of Siglec-F+ in Ly6g+ neutrophils
  in BMDN cultures exposed to CD138+ TAM-CM with or without anti-SAA3 neutralizing
  antibodies. (L) Quantification of data from K (n = 3 per group). (M) KEGG enrichment
  analysis of DEGs between Siglec-F+ and Siglec-F– neutrophils derived from orthotopic
  tumors. (N) Images displaying the frequencies of Siglec-F+ in Ly6g+ neutrophils
  in BMDN cultures exposed to SAA3 with or without WRW4 (a FPR2 antagonist) or p38
  MAPK-IN-1 (a p38 MAPK pathway inhibitor). (O) Quantification of data from N (n =
  3 per group). *P < 0.05 and **P < 0.01 by Kruskal-Wallis test with Dunn’s multiple-comparison
  test (C, E, and I) and by unpaired 2-tailed Student’s t test (L). Data represent
  mean ± SEM
article_title: A CD138+ tumor-associated macrophage/Siglec-F+ neutrophil feed-forward
  loop promotes immune evasion in pancreatic cancer
