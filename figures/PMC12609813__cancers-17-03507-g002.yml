figure_title: PFOS-mediated induction and progression of PCa.
caption: 'PFOS-mediated induction and progression of PCa. PFOS mediates the transition
  from normal prostate epithelium to clinical adenocarcinoma. A: The mechanisms of
  tumor initiation by PFOS involve oxidative stress, DNA damage, inflammation, and
  telomere shortening, leading to prostatic intraepithelial neoplasia (PIN). B: The
  formation of PIN can be driven by the activation of other signaling nodes, such
  as PI3K/Akt/NF-κB. C: Progression is driven by activation of oncogenes such as c-MYC
  and the repression of PTEN by PFOS. D: PFOS-mediated increase in the expression
  of IL-8, MMP-2, MMP-9, and VEGF then mediates the transformation of occult adenocarcinoma
  to clinical adenocarcinoma. E: Other signaling pathways, such as WNT/β-catenin,
  N-Cadherin and vimentin further facilitate the metastasis of PCa to distant organs
  Generated with BioRender (https://app.biorender.com, accessed on 28 October 2025)'
