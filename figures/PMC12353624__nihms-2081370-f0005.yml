figure_title: Transcriptomic clustering identifies unique lineage-specific features
  and vulnerabilities
caption: (A) Heatmap showing normalized mRNA expression corresponding to the unsupervised
  clustering of BTC (n=56) and HCC (n=23) cell lines. The top 50 genes enriched in
  each cluster are displayed. Wilcoxon rank-sum test; q<0.1. Pathway enrichment analysis
  for each cluster is indicated on the right.(B) Joint plot showing grouping of cell
  lines based on hepatocyte and bile-duct marker scoring. Hepatocyte scores (x-axis)
  and biliary scores (y-axis) were assigned based on ssGSEA. RNA cluster R1 corresponds
  to EMT subtype, R2-Hepatocyte-like, R3- Bi-lineage and R4-Ductal.(C-D) Volcano plot
  showing differential dependencies enriched in Bi-lineage (R3) (C) and Ductal (R4)
  (D) BTC cell lines relative to other clusters. Significant genes with at least 2
  dependent cell lines in the in-group are highlighted in Red. Unpaired t-test; q<
  0.1.(E) Swarm plot showing HNF1B expression across RNA clusters. Horizontal line
  segments indicate the mean. Wilcoxon rank-sum; ns, not significant; ***q<0.001,
  ****q<0.0001(F) Bar plots showing relative viability after HNF1B knockout in ductal
  ICC and Bi-lineage ICC cell lines. Unpaired t-test. ***p<0.001, ****p<0.0001(G-H)
  Swarm plot showing enrichment of R3 transcriptional signature in WT or MT (IDH1/2,
  FGFR2, BAP1 alterations) patients (G) or R4 transcriptional signature in WT or MT
  (KRAS, BRAF and SMAD4 alterations) patients in the FU-CCA cohort (H). Horizontal
  line segments indicate the mean. Wilcoxon rank-sum; ns, not significant; **p<0.01,
  ***p<0.001(I) Stacked bar plot showing percentage of R3, R4 or overlapping genotypes
  in groupings based on R3 signature enrichment (upper quartile) (top) or in groupings
  based on R4 signature enrichment (upper quartile) (bottom) in the FU-CCA cohort.
  Fisher’s exact test; **p<0.01.(J) Swarm plot showing HNF1B expression levels in
  R3 enriched patients versus Rest in FU-CCA cohort. Horizontal line segments indicate
  the mean. Wilcoxon rank-sum test. ****p<0.0001.(K-L) Kaplan-Meier curves showing
  overall survival in FU-CCA patients (n=114) grouped based on enrichment of R3 transcriptional
  signature (K) or R4 transcriptional signature (L).(M) Swarm plot showing SULT1A1
  mRNA expression in Bi-lineage (R3) (n=21) versus Ductal ICC (R4) (n=12) BTC cell
  lines. Horizontal line segments indicate the mean. Wilcoxon rank-sum test; *p<0.05.(N)
  Swarm plots showing SULT1A1 mRNA expression in R3 enriched (n=46) patients versus
  Rest (n=136) in the ICGC cohort. Horizontal line segments indicate the mean. Wilcoxon
  rank-sum test. ****p<0.0001(O) Dose-response curves of Bi-lineage (red) (n=3) versus
  Ductal (grey) (n=2) BTC cell lines after 72 hours of treatment with NCGC600764.(P)
  Schematic describing characteristics of Bi-lineage (R3) and Ductal (R4) CCA. (Created
  with BioRender.com)
