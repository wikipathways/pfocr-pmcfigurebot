figure_title: The analysis of the endogenous serum metabolites in PSO.
caption: The analysis of the endogenous serum metabolites in PSO. (a) Principal component
  analysis. (b) Volcano plot. (c) Relative abundance of the differential metabolites
  between the control and PSO−treated groups. Data are presented as mean ± SD. p <
  0.01 was considered statistically significant in the PSO−treated group compared
  with the control group. (d) Bubble chart of KEGG enrichment. (e) Comprehensive analysis
  heatmap of the differential metabolite pathways. The color of the square indicates
  the p-value of the enrichment analysis (expressed as −ln(p)); deeper colors correspond
  to smaller p-values, indicating greater enrichment significance
