figure_title: Cytokine release and inflammatory pathways in adult cortical astrocytes
  after melatonin incubation (300 µM, 24 h).
caption: 'Cytokine release and inflammatory pathways in adult cortical astrocytes
  after melatonin incubation (300 µM, 24 h). Extracellular cytokines: (A) IL-6, (B)
  IL-10, (C) IL-1β, (D) TNF-α. Expression of genes encoding: (E) NLRP3, (F) NFκB p65,
  and (G) COX-2. Orange bars represent control group, and blue bars represent melatonin-treated
  group. Data are expressed as mean ± SD (n = 8 independent biological replicates
  for ELISA assays; n = 7 independent biological replicates for gene expression evaluations).
  Each biological replicate represents an independent culture (with each culture derived
  from a pooled preparation of cortices from two animals). Statistical differences
  between control and melatonin groups were analyzed using Student’s t-test for independent
  samples. p < 0.05 was considered statistically significant (p-values were described
  for each parameter in the Results section). * Indicates difference in relation to
  the control condition'
