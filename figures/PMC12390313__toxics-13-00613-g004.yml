figure_title: Comparison of genes across different EC clusters.
caption: Comparison of genes across different EC clusters. (A) The heatmap shows GO
  terms associated with DEGs, with color coding based on the enrichment level of genes.
  The color variation of the circles indicates the significance of enrichment, and
  the size of the circles represents the gene count. The specific p values can be
  found in the figure legend. (B) The upset plot of significant KEGG pathways (FDR
  < 0.05) shows the enrichment of differentially expressed genes. The horizontal bars
  (set size) represent the total number of pathways for each cluster in each plot.
  In the upset plot, the dots point to specific EC clusters, where vertical bars show
  the pathway counts, and vertical lines between dots represent the intersections
  between two or more clusters
