figure_title: TBK1 overexpression ameliorates MASH progression in vivo
caption: '(A) Experimental scheme for intravenous administration of AAV8-TBK1 in the
  MASH mouse model. (B) Immunoblot analysis of phosphorylated TBK1 (p-TBK1) and total
  TBK1 in liver tissues following AAV8-TBK1 overexpression (n = 4). (C–E) Body weight
  gain (C), liver weight (D), and epididymal white adipose tissue (eWAT) weight (E)
  in AAV8-GFP and AAV8-TBK1 groups (n = 6). (F) Fasting blood glucose levels (n =
  6). (G) Representative H&E-stained liver histological images from each group. Scale
  bar, 200 μm. (H) KEGG pathway enrichment analysis of RNA-seq data from liver tissues
  of each group. (I) Relative mRNA expression of fibrosis-related collagen genes in
  liver tissues (n = 3). (J–L) qPCR analysis of Col1a1 (J), Col6a1 (K), and Bax/Bcl2ratio
  (L) in liver tissues (n = 6). (M,N,O) Mitochondrial DNA copy number normalized to
  hexokinase-2 (HK2) in liver tissues (n = 6). (P) Transmission electron microscopy
  (TEM) images of liver tissues. Scale bar, 200 nm. (Q-T) Quantification of mitochondrial
  morphology by TEM: mitophagy-associated vesicular mitochondria per area (Q), mitochondrial
  circularity (R), angle (S), and aspect ratio (T) (n = 6). * p < 0.05, **p < 0.01,
  ***p < 0.001, ***p < 0.0001, ns. no significance; p > 0.05. Data are presented as
  mean ± SEM. Statistical significance was determined using unpaired two-tailed Student’s
  t-test'
article_title: Tank-Binding Kinase 1 protects against MASH progression via mitochondrial
