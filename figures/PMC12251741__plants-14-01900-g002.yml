figure_title: A scheme of ERECTA signaling regulates BRs transduction pathway to activate
  BZR1 transcription factor to inhibit companion cells fate transition.
caption: A scheme of ERECTA signaling regulates BRs transduction pathway to activate
  BZR1 transcription factor to inhibit companion cells fate transition. EPFLs-ERECTA
  signaling is involved in the regulation of the BRs-BRI1 signal transduction pathway
  to activate the BZR1 transcription factor family. By dephosphorylating BZR1 into
  the nucleus and instantaneously activating WRKY23 and NSN1 expression, companion
  cells are inhibited from acquiring MMC fate. This results in only one MMC but does
  not regulate entry into meiosis. SWR1 and H3K4me3 histone modification SDG2 activates
  BZR1 to promote the deposition of H2A.Z at downstream target genes SE, HYL1, and
  DCL1 to activate the expression of these genes. This regulation ensures that only
  a single cell in the ovule primordium acquires the MMC fate and limits only one
  MMC to enter the decelerating division to form an FM. cc, companion cells
