figure_title: Hierarchical clustering of intracellular protein concentrations in response
  to metabolite treatments
caption: (a) Intracellular proteins were hierarchically clustered by their respective
  z-scores. Significant pathway proteins (FDR q < 0.10) were denoted with a star as
  determined by a Kruskal-Wallis test adjusted by the Benjamini-Hochberg method. (b)
  Mann-Whitney pairwise testing of the log2 fold change (metabolite/vehicle) of significant
  proteins identified by the Kruskal-Wallis test. Significance between different metabolite
  condition pairs was established with a p < 0.05
article_title: Metabolites associated with type 2 diabetes and Alzheimer’s disease
