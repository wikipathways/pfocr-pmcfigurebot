caption: 'Platelet MCF over the first ten days after trauma in polytraumatized patients
  over the first 10 days after trauma, calculated by subtraction of FIB-TEM® MCF (representing
  the extrinsic coagulation pathway with inhibition of platelet coagulation through
  cytochalasin) from EX-TEM® MCF (representing the extrinsic coagulation pathway),
  both assessed via ROTEM® analysis. Blood was drawn at nine different time points:
  in the ER, after 6 and 12 h, and after 1, 2, 3, 5, 7, and 10 days. Each dot represents
  a single patient and time point. The grey lines represent single patients’ courses.
  The blue fit line represents the linear mixed-effects model. There was a significant
  decrease in the platelet MCF during the first 10 days after trauma (−27.1% from
  ER to day 10, m = −0.03516, 95% CI [−0.04878 to −0.02154], p < 0.001, k = 40.01503,
  95% CI [37.29247 to 42.73758], p < 0.001)'
