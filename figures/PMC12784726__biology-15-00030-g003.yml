figure_title: 'Cutibacterium acnes: An Emerging Prostate Cancer Pathogen'
caption: 'C. acnes can exhibit pro/tumorigenic effects on host cells through multiple
  mechanisms. (a) Activation of macrophage activity. C. acnes can stimulate macrophages
  through toll-like receptors (TLR), leading to release of tumour necrosis factor
  (TNF) and Interferon gamma (IFN-γ), as well as upregulation of immunosuppressive
  genes PD-L1 and CCL17/18. (b) DNA damage and DNA repair pathway dysregulation. When
  localised in perinuclear vesicles, intracellular presence of C. acnes was associated
  with DNA damage as indicated by increased γH2AX, as well as impaired DNA repair
  pathway regulation through downregulation of BRCA2. (c) Modification of the extracellular
  matrix. Direct changes can be exhibited by C. acnes through its hyaluronate lyase
  activity, which degrades hyaluronic acid. Indirectly, C. acnes can also lead to
  increased host cell MMP production during infection, which can lead to collagen
  degradation and subsequent decrease in ECM tissue stiffness. (d) Release of extracellular
  vesicle cargo. C. acnes release EVs containing PAMPs and virulence factors, which
  can be internalised by host cells to lead to increased invasiveness, or access circulation.
  Illustration created using NIAID NIH BIOART. Source: https://bioart.niaid.nih.gov/
  (accessed on 30 September 2025)'
