figure_title: Taurine enhanced the level of bile acids.
caption: 'Taurine enhanced the level of bile acids. (A) Schematic of bile acid synthesis:
  primary bile acids (BA) are synthesized from cholesterol by the classic pathway
  or the alternative pathway. BA-CoA: amino acid N-acyltransferase (BAAT) then catalyse
  BA conjugation with glycine or taurine to form bile salts. (B) Total BA levels in
  the serum of mice intraperitoneally injected with normal saline or taurine (Taurine,
  i.p., 100 mg/kg, every other day; Control: n = 5; taurine: n = 4). (C) Total BA
  levels in the serum of mice with Slc6a6 overexpression (n = 3). (D) Box plot of
  the expression of CYP7A1 in HCC tissues and adjacent normal tissues (red represents
  tumor tissues, gray represents normal tissues). (E) Box plot of the expression of
  BAAT in HCC tissues and adjacent normal tissues (red represents tumor tissues, gray
  represents normal tissues). Bars, SD; * p < 0.05; *** p < 0.001'
