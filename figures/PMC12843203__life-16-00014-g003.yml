figure_title: Aortic dissection pathogenesis.
caption: Aortic dissection pathogenesis. Injured vascular smooth muscle cells secrete
  chemokines, promoting inflammatory cell infiltration into the aortic wall, including
  T lymphocytes and monocytes. Activated dendritic cells release chemotactic mediators
  that recruit macrophages and CD4+ T cells. These immune cells secrete proinflammatory
  cytokines, resulting in elastic fiber fragmentation and medial degeneration. Imbalance
  between proteases and their inhibitors enhances proteolytic activity, impairing
  extracellular matrix remodeling. The TGF-β signaling pathway regulates cell proliferation,
  apoptosis, and matrix homeostasis through the Smad2/3-Smad4 complex, while its noncanonical
  pathways (ROCK and MAPK) also participate in aortic aneurysm progression and dissection
  pathogenesis, ultimately leading to structural deterioration of the aortic wall.
  (Figure 3 is an original schematic based on published literature)
