figure_title: Metabolic profile of HT-1 patients reveals patterns consistent with
  HCC-associated metabolic reprogramming.
caption: Metabolic profile of HT-1 patients reveals patterns consistent with HCC-associated
  metabolic reprogramming. Deficiency of FAH leads to the accumulation of several
  toxic metabolites. Delayed diagnosis and treatment initiation induce chronic liver
  damage and, consequently, malignant liver cell transformation. Metabolomic analysis
  of these patients reveals distinctive alterations in lipid homeostasis, similar
  to those in HCC, driven by activation of the WNT/β-catenin signaling pathway (dashed
  red lines). These results suggest that despite NTBC therapy, HT-1 patients with
  late diagnoses may have an ongoing metabolic carcinogenic status
