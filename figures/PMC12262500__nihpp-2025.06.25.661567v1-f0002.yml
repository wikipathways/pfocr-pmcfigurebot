figure_title: Kiss1ARC neurons activate Cart/Lepr neurons in the DMH to regulate BAT
  thermogenesis
caption: '(A) Schematic of AAV9-hSyn-DIO-hM3D(Gq)-mCherry injection in the ARC of
  Kiss1Cre/+ mice. (B) photomicrographs depicting the expression of the AAV9-hM3D(Gq)-mCherry
  in the ARC. 3V= third ventricle. Scale bar = 100μm. (C) Representative expression
  of Kiss1ARC neurons projections in the DMH. (D) Representative expression of cFos
  in AAV-hM3D(Gq) vs AAV-mCherry mice (Scale bar = 100 μm) and quantification of cFos
  positive neurons in the DMH showing a significant increase in cFos expression in
  the AAV-hM3D(Gq) group (242.2±38.80) vs the AAV-mCherry (91.17±17.58) group. Student’s
  t test: **p=0.0053, t=3. n=6/group. (E) Schematic of AAV9-hSyn-DIO-hM3D(Gq)-mCherry
  injection in the ARC and green retrobeads in the RPa of Kiss1Cre/+ mice (n=3) to
  map the ARC-DMH-RPa pathway. (F) Representative photomicrographs depicting mCherry
  expression in Kiss1ARC neurons, retrobeads expression in the RPa, and Kiss1 axonal
  projections contacting retrobeads positive neurons in the DMH. Inset shows a zoom
  in of the boxed region, illustrating contact and close apposition of Kiss1 fibers
  and RPa projecting neurons. Scale bar = 100 μm. G) Schematic of AAV9-hSyn-DIO-hM3D(Gq)-mCherry
  injection in the ARC in Kiss1Cre/+ mice (n=3). (H) Representative photomicrographs
  depicting mCherry expression in Kiss1ARC neurons (Scale bar 100 μm), projecting
  to (I) the DMH, where they form close apposition with STAT3 (Lepr expressing) neurons.
  The insets provide a zoom in of the boxed regions highlighting two populations of
  STAT3 neurons: those contacted by Kiss1 fibers (empty arrows) and those that are
  cFos positive (full arrows). Scale bar = 100 μm. (J) Schematic of the in vitro optogenetic
  stimulation of Kiss1ARC fibers in the DMH. Viral injection of AAV-ChR2 was used
  to drive expression of excitatory opsin (ChR2) and mCherry in Kiss1ARC neurons.
  Recordings were made in DMH neurons in response to optogenetic stimulation. (K)
  Widefield image of Kiss1ARC mCherry expression. Scale bar = 200 μm. (L) High-power
  brightfield image of the DMH near the 3V. Scale bar = 40 μm. (M) Fluorescent widefield
  image of the same region from (K). (N) Postsynaptic response in DMH neuron following
  optogenetic stimulation of Kiss1ARC neurons. Cytosol of recorded neurons was harvested,
  underwent RT-PCR, and tested for expression of Cart. (See also Figure S5). (O) Schematic
  of the in vivo optogenetic stimulation of Kiss1ARC fibers in the DMH in Kiss1Cre/+
  mice implanted with temperature transponders above the iBAT pad. Viral injection
  of AAV-eOPN3 was used to drive expression of inhibitory opsin (eOPN3) and mCherry
  in Kiss1ARC neurons. (P) Representative expression of AAV-eOPN3 in the ARC and location
  of optic fiber above the DMH. Scale bar 100 μm. (Q) The iBAT temperature was recorded
  30 min before, 1 hour during and 30 min after photoinhibition (INHIB). (R) The mean
  temperature change (Δ. iBAT) during the STIM period (1 hour) was significantly different
  between SHAM (−0.01500±0.02096, n=5) and INHIB (−0.1167±0.04499, n=6) mice. Student’s
  t test: *p=0.0454, t=1.960. Blue transparent area represents STIM period. See figure
  S1 for the mapping of Kiss1 neurons projections in the male mouse brain'
