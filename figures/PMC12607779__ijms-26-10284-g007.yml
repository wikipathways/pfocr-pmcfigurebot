caption: 'Activin B regulates fibroblast proliferation and migration via the JNK and
  ERK signaling pathways. (A) Western blot analysis of JNK, ERK, p38, and their phosphorylation
  levels, and GAPDH in the MAPK signaling pathway of HDFs. (B–D) Quantification of
  the relative levels of p-JNK, tot-JNK, p-ERK, tot-ERK, p-p38 and tot-p38, n = 5.
  (E) CCK8 assay quantifying proliferation of HDFs, n = 10. (F) Representative images
  of the scratch wound-healing assay in HDFs. (G) Quantification of HDFs scratch wound-healing
  rate, n = 10. (H) Representative images of the Transwell migration assay. (I) Quantification
  of migrated HDFs in the Transwell assay, n = 10. Con: Control group. ACT: Activin
  B group. SP: SP600125. SL: SL327. HPF: High Power Field; HDF, human dermal fibroblasts
  * p < 0.05,** p < 0.01,*** p < 0.001'
