figure_title: Ubiquitin regulated steps during DNA replication in human cells.
caption: 'Ubiquitin regulated steps during DNA replication in human cells. (A) Pre-replicative
  complex formation and origin licensing. ORCA facilitates ORC1–6 complex recruitment.
  RFWD3, an E3 ubiquitin ligase, directly interacts with ORC1 and ORC2 subunits of
  the complex and ubiquitinates ORCA, thereby stabilizing the pre-RC at the origin.
  CDC6 and CDT1 are recruited to the origin via the ORC1–6 complex, and together they
  function as loaders of the MCM2–7 double hexamer. The double hexamer adopts an inactive,
  open conformation. ORC facilitates the passage of DNA between MCM2 and MCM5, a process
  that possibly promotes the closure of the complex. CDT1 and CDC6 are subsequently
  polyubiquitinated by CRL4Cdt2 (not shown) and degraded by the proteasome. (B) Replication
  origin firing. During the G1/S phase transition, the MCM2–7 double hexamer becomes
  phosphorylated (red squares) by CDK2 and DDK (not shown). This phosphorylation in
  concert with MCM10 promotes the recruitment of GINS and CDC45 to each MCM complex
  within the double hexamer, resulting in the formation of a “double” CMG helicase.
  OBI1, an E3 ubiquitin ligase, multi-monoubiquitinates ORC3 and ORC5, which facilitates
  origin firing. Activation of the CMG helicase causes the double MCM2–7 hexamer to
  dissociate and the two CMG complexes bypass each other before they move bidirectionally
  along the DNA. The directionality of CMG progression is indicated by pink arrows.
  (C) Replication termination. Two CMG complexes converge (the directionality of CMG
  progression is indicated by pink arrows), which trigger CMG removal from DNA. MCM10
  and phosphorylations on MCM2–7 are not shown for simplicity. Pathway 1 is shown
  on the left: the MCM7 subunit of MCM2–7 complex is polyubiquitinated by K63-linked
  chains by CRL2Lrr1 in higher eukaryotes. Polyubiquitinated MCM7 is a target of p97
  segregase, which helps to dissociate CMG from the DNA. Pathway 2, shown on the right,
  depicts the facte of CMG complexes that are not unloaded (e.g., at stalled forks:
  when CMG remains chromatin bound, phosphorylated (red squares) TRAIP polyubiquitinates
  MCM7 or MCM3 at mitotic entry to facilitate p97-dependent CMG dissociation'
