figure_title: Expression of JAK2 under normal conditions.
caption: Expression of JAK2 under normal conditions. In the normal JAK-STAT activation
  pathway, the JH2 pseudokinase domain of JAK can inhibit the JH1 catalytic domain
  through hydrophobic interaction and hydrogen bonding. When the extracellular ligand
  (EPO/TPO) binds to the transmembrane receptor, the receptor dimerizes, leading to
  the proximity of adjacent JAK2 molecules to each other and phosphorylation activation,
  followed by phosphorylation of STAT, so that it forms a dimer and enters the nucleus,
  binds to the gas sequence on the DNA, and activates Pro proliferation/differentiation
  genes (such as MYC, GATA1)
