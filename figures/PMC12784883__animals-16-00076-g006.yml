figure_title: LPS-induced inflammatory response in RTgill-W1 cells mediated by OmTRIM25.
caption: 'LPS-induced inflammatory response in RTgill-W1 cells mediated by OmTRIM25.
  (A) RTgill-W1 cells were incubated with 50 nM siOmTRIM25 for 14 h and then stimulated
  with 10 µg mL−1 LPS for 8 h. The gene expression of OmTRIM25 and cytokines (TNF-α2,
  IL-1β and type I IFN was quantitatively measured using RT-qPCR). Results were expressed
  as the mean ± SEM of six experimental replicates (*: p < 0.05). (B) Schematic pathway
  representing the proposed mechanism of action of OmTRIM25'
