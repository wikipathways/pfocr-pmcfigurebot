figure_title: Poly IC increased neuroinflammation and impaired neurobehavioral parameters
caption: Mice (n=5) were injected with poly (I:C) (2Omg/Kg) and control mice (n=4)
  were injected with PBS through IP for alternative days in a week, on day 5, T-Maze
  and open field (OF) were performed, and on day 6 grip strength and rotarod was carried
  out and animal sacrificed afterwards. Figures 5a & 5b demonstrate illustrative examples
  of control and poly (I:C) treated mice’s travel pathway on the open field test (5c),
  the total distance travelled (5d), the average speed (5e), time freeze and central
  distance (5f). The spontaneous alternation rate in the T-maze (5g), grip strength
  test (5h), the latency to fall (time in seconds) was measured in the rotarod (5i).
  Data are presented as the means ± standard error of the mean (SEM). Statistical
  significance and significant difference were determined by an unpaired t-test (P
  < 0.05 *, **P <0.01, ns, non-significant)
