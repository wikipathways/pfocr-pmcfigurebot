caption: 'Analysis of differential gene expression: Enrichment of Gene Ontology (GO)
  terms and Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways. (A) Bubble plot
  illustrating significantly enriched GO biological processes. (B) Bubble plot depicting
  significantly enriched KEGG metabolic pathways. In each panel, every dot corresponds
  to a particular GO term or KEGG pathway. The Y-axis represents functional terms
  or pathways, while the X-axis denotes the enrichment factor. The Rich factor is
  determined by dividing the proportion of DEGs associated with a specific term by
  the proportion of all genes linked to that term. A higher rich factor signifies
  a greater degree of enrichment for the term or pathway. Dot color corresponds to
  the q-value (i.e., adjusted p-value), with lower q-values signifying heightened
  significance and reliability of the enrichment signal. On the other hand, dot size
  reflects the count of genes enriched within each pathway, such that larger dots
  are indicative of a greater number of genes involved in the respective enrichment
  event'
