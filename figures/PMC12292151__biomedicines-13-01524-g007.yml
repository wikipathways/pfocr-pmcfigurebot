figure_title: Effects of BTEX-K on NF-κB signaling pathway in LPS-induced RAW 264.
caption: Effects of BTEX-K on NF-κB signaling pathway in LPS-induced RAW 264.7 cells.
  (A) RAW 264.7 cells were pretreated with various concentrations of BTEX-K (0–20
  µg/mL) for 30 min and then stimulated with LPS (1 µg/mL) for 30 min. Total cell
  lysates were analyzed by Western blotting to determine the expression levels of
  IκBα. Relative levels were quantified by densitometry and protein expression was
  normalized to β-actin. (B) Under the same pretreatment conditions, cells were stimulated
  with LPS for 6 h, and the expression of NF-κB was analyzed via Western blotting.
  Densitometric quantification was performed and normalized to β-actin. Data are expressed
  as mean ± SEM (n = 4). * p < 0.05 and ** p < 0.01 compared with positive control
  value stimulated by LPS alone
