figure_title: Differential effects of extracellular adenosine metabolism on immune
  suppression and immune response in the tumor microenvironment.
caption: 'Differential effects of extracellular adenosine metabolism on immune suppression
  and immune response in the tumor microenvironment. The left panel illustrates a
  state of Immune Suppression. Extracellular ATP (eATP) is hydrolyzed by CD39 to ADP
  and subsequently by CD73 to adenosine (Ado). Adenosine binds to the A2A adenosine
  receptor (A2AR) on immune cells, activating downstream signaling pathways such as
  PKA and MAPK. This activation leads to the suppression of anti-tumor immune responses,
  promoting tumor survival through mechanisms like activation of Akt/mTOR and the
  transcription of anti-apoptotic genes, pro-angiogenic factors, and genes involved
  in cell proliferation via NF-κB. Reactive oxygen species (ROS) may also contribute
  to this suppressive environment. The right panel illustrates the therapeutic goal:
  using agents like phenolic compounds to inhibit CD73 and/or immune checkpoint inhibitors
  (ICIs) like anti-programmed cell death protein 1 (PD-1) antibodies to block the
  PD-1/programmed death-ligand 1 (PD-L1) axis. This combined intervention “heats up”
  the tumor, allowing immune cells to recognize and eliminate thyroid cancer cells.
  This shift promotes an active immune response, potentially leading to increased
  ROS production and the expression of pro-apoptotic genes (e.g., via altered NIS
  gene expression or other mechanisms, though the specific link to NIS requires further
  context from the broader study) and other molecules that favor tumor cell death
  and an effective anti-tumor immune response. Created with BioRender.com (accessed
  on 1 August 2025)'
article_title: Targeting the Purinergic Axis with Phenolic Compounds to Disrupt the
  Oxidative-Inflammatory Cycle in Thyroid Cancer
