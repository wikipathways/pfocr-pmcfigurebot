figure_title: Omics Technologies in Delirium Research.
caption: 'Omics Technologies in Delirium Research. This figure depicts the application
  of multi-omics approaches to delirium research across biological scales in both
  human patients and animal models. The central node represents delirium, surrounded
  by four major omics technologies: (1) Genomics, including GWAS, whole-exome sequencing,
  and transcriptomics, which has identified 200–700 differentially expressed genes
  and inflammatory pathway enrichment, with specific examples of APOE ε4 genotype
  and IL-6 polymorphisms shown; (2) Proteomics using mass spectrometry and antibody
  arrays to detect altered inflammatory proteins and post-translational modifications,
  with examples of S100β protein (40–120% increase) and neurofilament light chain
  as neuronal injury markers; (3) Metabolomics employing LC-MS/MS and NMR to identify
  30–150 altered metabolites and disrupted energy pathways; and (4) Systems Biology
  integrating network analysis and machine learning approaches, improving prediction
  accuracy by 15–25%. Arrows from each omics approach to the central delirium node
  show their individual contributions, while dotted lines between genomics, proteomics,
  metabolomics, and systems biology illustrate the integration of these approaches.
  Feature boxes around each major node provide specific biomarker examples with quantitative
  data. The bottom section shows clinical applications of these integrated approaches,
  which include biomarker development, risk stratification, personalized interventions,
  treatment monitoring, and drug target identification. References: [101,144,145,146,147,148,149,150,151,152,153]'
