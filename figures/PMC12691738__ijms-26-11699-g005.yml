figure_title: Effect of CCK-BR-KO on murine PSC on protein signaling pathways involved
  in the pancreatic tumor microenvironment.
caption: 'Effect of CCK-BR-KO on murine PSC on protein signaling pathways involved
  in the pancreatic tumor microenvironment. (A) Expression of key target proteins
  in the pancreatic cancer signaling pathway, analyzed by Reverse Phase Protein Array
  (RPPA), that are downregulated when the CCK-BR is decreased by CRISPR in murine
  pancreatic stellate cells. (B) Selective stellate cell proteins that increase by
  RPPA with CCK-BR-KO. (C) Colagen1α1 and αSMA protein expression by western blot
  of wild-type and CCK-BR-KO PSCs grown alone or co-cultured with mT3 pancreatic cancer
  cells, with GAPDH as the normalizer. The protein ladder marker is shown to the right.
  (D) Densitometry of the western blot shows collagen1α1 protein expression in wild-type
  or CCK-BR-KO PSCs cultured alone or co-cultured with mT3 pancreatic cancer cells;
  * p < 0.05. (E) Densitometry of the western blot for αSMA protein expression in
  wild-type or CCK-BR-KO PSCs cultured alone or co-cultured with mT3 pancreatic cancer
  cells. WT: wild-type; KO: knockout; mPSC: mouse pancreatic stellate cells * p <
  0.05; ** p < 0.01; ns = not significant'
article_title: Downregulation of the CCK-B Receptor in Pancreatic Stellate Cells Blocks
  Molecular Proliferative Pathways and Increases Apoptosis to Decrease Pancreatic
  Cancer Growth In Vitro
