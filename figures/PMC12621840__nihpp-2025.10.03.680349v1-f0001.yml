figure_title: Overview of metabolic STAMP (Synchronized Temporal-Spatial Analysis
  via Microscopy and Phosphoproteomics) to decipher GPCR-kinase signaling network
  governing insulin secretion
caption: '(A) Murine β cells or human islet cells were treated by high glucose alone
  or together with GPCR agonists to stimulate insulin secretion. During secretion,
  the following time-controlled samples were collected for metabolic STAMP: cell media,
  cell lysates, live cells, and fixed cells.(B) Cell medium was analyzed for hormone
  secretion levels like ELISA and/or bioluminescence based high-throughput assays.(C)
  Cell lysates were processed for DDA-PASEF phosphoproteomics to map phosphorylation
  sites of GPCR signaling pathways. Putative kinases were nominated based on in silico
  analysis and then validated using kinase inhibitor assays.(D) Paired live and fixed
  cell analysis via confocal microscopy were used to assess context specific changes
  in the following cellular compartments: microtubule cytoskeleton, mitochondria,
  Golgi and endosomal traffic, and primary cilia'
article_title: Metabolic STAMP for deciphering GPCR-regulated insulin secretion by
