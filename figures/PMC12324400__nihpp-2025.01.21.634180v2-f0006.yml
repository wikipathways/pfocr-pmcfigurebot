figure_title: GIV is required for the emergence of healing niColAMs in MDP-treated
  WT mice
caption: 'A. Study design of DSS-induced acute, chronic and recovery in mouse models
  of colitis (C57/BL6; all WT).B. Line graphs display the temporal patterns of the
  emergence of iColAMs and niColAMs in the colon samples in A. The grey dotted line
  indicates the composite scores of iColAM and niColAM genes in the control mice.C-E.
  Study design (C) for DSS-induced colitis in WT vs. GIV mice (n=3 each). See also
  Figure 5A-E for the detailed study design and disease pathology. Bar plots (D) show
  the accuracy of sample classification of individual DSS-challenged mouse samples—treated
  or not with vehicle (Veh) vs. MDP---using iColAM and niColAM gene sets. Classification
  strength within each cohort is measured using ROC-AUC analyses. Violin plots (E)
  show composite scores for niColAMs (left, blue border) in WT and iColAMs (right,
  brown border) in GIV-KO mice treated with or without MDP.F-G. Gene Ontology Biological
  Process (Go-BP) pathway enrichment analyses of genes downregulated in WT (F) or
  GIV-KO (G) mice treated with L18-MDP compared to their respective untreated controls.H-I.
  GoBP (H) and Go Molecular Function (GoMF; I) analyses of genes downregulated in
  L18-MDP-treated WT vs. GIV-KO samples.J-K. Schematic (J) of bulk RNA sequencing
  in silico deconvolution analysis of distal colons from DSS-treated mice in C. Bar
  plots (K) show normalized percentage abundances of M1 and M2 macrophages in WT and
  GIV-KO mice, with and without MDP treatment.Statistics: p values were calculated
  using one-way ANOVA, followed by Tukey’s test for multiple comparisons and indicated
  with p-values shown above bars. p-value ≤ 0.05 is considered significant'
