figure_title: Deletion or mutational inactivation of COP1 mediates resistance to MAPK
  pathway inhibitors.
caption: Deletion or mutational inactivation of COP1 mediates resistance to MAPK pathway
  inhibitors. (A) DNA sequence of the COP1K539E missense mutation. (B) Domain organization
  of the COP1 protein indicating the mutations found in melanoma patients treated
  with Vemurafenib. (C) Western blots of A375 cells (COP1WT) and two COP1-deficient
  clones generated using CRISPR/Cas9 technology (COP1KO.1 and COP1KO.2). (D) Chemical
  genomic screen strategy using COP1WT and COP1KO A375 cells. (E) The graph indicates
  the mean viability (MV) differential (y axis) between COP1WT and COP1KO A375 cells
  treated with the compounds in (d; x axis). (F) The graph shows the qIC50 for different
  MAPK pathway inhibitors in A375 cells. (G) Western blots of A375 cells. (H) The
  graphs indicate A375 cell proliferation. The results are representative of 3 independent
  experiments
