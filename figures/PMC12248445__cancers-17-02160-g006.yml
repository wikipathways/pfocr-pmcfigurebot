figure_title: Lipid metabolism network associated with lung epithelial malignization.
caption: Lipid metabolism network associated with lung epithelial malignization. WGCNA
  was used to identify co-expressed genes representative of lung epithelium malignization
  based on the gene dataset GSE168466. (a,b) tSNE plot summarizing sample distribution
  according to (a) their co-expression module profile and pathological state (healthy
  group, green dots; Tumor group, red dots), and (b) lung region and epithelial tissue
  of origin; (c) hierarchical-clustering heatmap of module eigengene highlighting
  the association of the module to epithelial malignancy; (d) modules more differentially
  expressed in healthy or tumor samples were selected based on ranked ANOVA score,
  representing profiles that better described epithelial transformation; (e) pathway
  enrichment analysis computed using EnrichR for healthy (green plot) and tumor modules
  (red plot) describing the top 10 p-value ranked Reactome pathways; (f) STRING network
  representing the overall interaction of genes involved in lipid metabolism
