figure_title: Schematic representation of alterations in glycosylation and their impact
  on synaptic dysfunction associated with ASD.
caption: Schematic representation of alterations in glycosylation and their impact
  on synaptic dysfunction associated with ASD. (A) The enzyme ST8SIA2 catalyzes the
  polysialylation of NCAM1, modulating its adhesive function, axonal dynamics, and
  synaptic remodeling. Beyond cell adhesion, NCAM1 forms a complex with EphA3, whose
  activation by EphrinA5 triggers the RhoA–Rock1/2 pathway and promotes axonal retraction
  and synaptic pruning. NCAM1 also influences neuroinflammatory responses by modulating
  NF-κB and MAPK signaling in astrocytes. Reduced expression of NCAM1 and ST8SIA2
  in ASD diminishes polysialylation and disrupts synaptic plasticity and stability.
  Glycosylation defects also impair neuroligin (NLGN), where mutations hinder ER-to-Golgi
  trafficking or enhance ADAM10-mediated cleavage, reducing functional NLGN at the
  synaptic membrane. Loss of the HNK-1 epitope on specific proteoglycans interferes
  with Slit/Robo signaling, compromising axonal guidance, while anti-HNK-1 antibodies
  may further disrupt the blood–brain barrier and extracellular matrix interactions.
  Decreased EXT1 expression impairs heparan sulfate (HS) chain elongation in glypicans,
  adding further deficits to axonal navigation and circuit formation during neurodevelopment.
  (B) Representative glycan structures associated with these mechanisms, including
  N-glycans and polysialylated chains present in NCAM1, O-glycans characteristic of
  neuroligin and neurexin, and HS/heparan sulfate motifs found in proteoglycans and
  glypicans
article_title: Does Altered Membrane Glycosylation Contribute to Neurodevelopmental
  Dysfunction in Autism Spectrum Disorder?
