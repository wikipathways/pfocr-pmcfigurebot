figure_title: Discovered uEV mRNAs detail distinctly altered functional pathways between
  MIBC and NMIBC
caption: A. Functional enrichment analysis was performed using HumanBase’s28 Bladder
  Tissue network to determine gene connectivity connections specific to MIBC and NMIBC.
  Utilizing a 0.7 confidence cutoff and removing non-connected genes, we visualized
  the network using Cytoscape41. Each node’s color corresponds to its association
  to MIBC, NMIBC, if the genes are shared, and discovered signaling. B. Functional
  gene ontology analysis was performed with gProfiler242 (FDR < 0.05) on each gene
  set specific to MIBC and NMIBC, visualized as a chord plot. Each edge corresponds
  to the number of genes associated with the identified pathway
