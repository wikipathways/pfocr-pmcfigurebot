figure_title: Repurposed drugs inhibit the AKT pathway and EMT markers.
caption: 'Repurposed drugs inhibit the AKT pathway and EMT markers. (A) Relative mRNA
  expression of CXCL10, CXCL11, PODXL, and OAS1 after 12-h treatments of Efavirenz
  (E), Ouabain (O), Vinburnine (V), and combinations in MDA-MB-231 and SUM159 (n=3).
  (B) Western blot of p-AKT (Ser473) and total AKT and densitometric quantifications
  of p-AKT relative to total AKT and GAPDH levels after 24-h treatments in MDA-MB-231
  and after 72-h SUM159 cell lines. (C) Western blot of EMT markers (Snail, Slug,
  and Vimentin) and densitometric quantifications relative to GAPDH levels after 24-h
  treatments in MDA-MB-231 and SUM159 cell lines. Results were normalized to the vehicle
  control (C). Statistically significant differences with the vehicle: * P ≤ 0.05,
  ** P < 0.01. Statistically significant differences with E: # P ≤ 0.05, ## P < 0.01.
  Statistically significant differences with O: $ P ≤ 0.05, $$ P < 0.01. Statistically
  significant differences with V: && P < 0.01. Data are presented as mean ± SD'
