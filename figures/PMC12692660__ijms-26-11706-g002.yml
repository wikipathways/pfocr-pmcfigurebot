figure_title: The vagal cholinergic anti-inflammatory pathway and neuroendocrine regulation
  of the HPA axis.
caption: 'The vagal cholinergic anti-inflammatory pathway and neuroendocrine regulation
  of the HPA axis. The afferent fibres of the vagus nerve detect proinflammatory cytokines
  (e.g., TNF-α and IL-1β) and pathogen-associated molecular patterns in peripheral
  tissues. This information is transmitted to the nucleus of the solitary tract (NTS)
  in the brainstem, where it is integrated and efferent (motor) fibres of the vagus
  nerve are activated. These efferent endings then release acetylcholine (ACh) into
  inflamed tissues. This binds to α7 nicotinic acetylcholine receptors located on
  macrophages and other immune cells. Activation of these receptors inhibits the transcription
  of proinflammatory cytokine genes (such as TNF-α, IL-1β and IL-6), partly by suppressing
  the transcription factor NF-κB. The vagus nerve also modulates neuroendocrine stress
  responses by influencing the hypothalamic–pituitary–adrenal axis. Vagal afferent
  input to the NTS can regulate the activity of the paraventricular nucleus of the
  hypothalamus, either suppressing or enhancing its output. This, in turn, modulates
  the secretion of corticotropin-releasing hormone (CRH), which stimulates the anterior
  pituitary gland to secrete adrenocorticotropic hormone (ACTH). Ultimately, this
  leads to the synthesis and release of cortisol from the adrenal cortex. Abbreviations:
  Ach—acetylcholine; ACTH—adrenocorticotropic hormone; α7nAChRs—α7 nicotinic acetylcholine
  receptors; β2AR—beta-2 adrenergic receptor; CAP—cholinergic anti-inflammatory pathway;
  CRH—corticotropin-releasing hormone; DVMN—dorsal motor nucleus of the vagus; FoxP3+Treg—FoxP3+
  regulatory T cells (Tregs)—subset of T lymphocytes characterized by the expression
  of the transcription factor FoxP3; HPA—hypothalamic–pituitary–adrenal axis; HPT—hypothalamus;
  IL-1β–interleukin 1β; IL-6—interleukin 6; IL-18—interleukin 18; NTS—nucleus of the
  solitary tract; NE—noradrenaline; PAMPs—pathogen-associated molecular patterns;
  Th17—Th17 cells—subset of CD4+ T; TNF-α—tumor necrosis factor-alpha. This figure
  was created using Servier Medical Art (available at https://smart.servier.com/)
  (accessed on 1 May 2025)'
