caption: This figure shows the regular activity of Wnt signaling pathways during normal
  cell cycles, maintaining proper microtubule dynamics as well as proper chromosome
  alignment during cell division. The Wnt/STOP signaling mechanism takes precedence
  over Wnt transcriptional control to execute its new regulatory function in human
  somatic cells. The proper formation of mitotic microtubules together with correct
  chromosomal separation results from Wnt-mediated protein stabilization events, i.e.
  the foundational level of Wnt signaling is crucial for the proper assembly of mitotic
  microtubules, the absence of basal Wnt signaling results in improper formation of
  mitotic spindles and chromosome misalignment, leading to aneuploidy, and the Wnt/STOP
  mechanism activates proteins at the G2/M stage to maintain chromosomal integrity
  in the karyotype
