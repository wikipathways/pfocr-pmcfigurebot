figure_title: TCFE stimulates hair regrowth in AGA mice through multi-pathway activation.
caption: TCFE stimulates hair regrowth in AGA mice through multi-pathway activation.
  (A) Immunofluorescence staining of hair follicle sections from the alopecic skin
  area in AGA mice, demonstrating DAPI (blue) and PCNA (red). The white arrowhead
  marks the site of PCNA enrichment (Scale bar = 75 μm). (B) Quantitative analysis
  of PCNA signal intensity (mean gray value). (C) Effects of TCFE on the expression
  of Ki67, Casp3, DKK2, TGF-β3, AKR1C1, and AKR1C3 in dermal cells of AGA mice. In
  B and C, statistical comparisons were performed between the indicated groups (Blank
  vs. AGA-Model, and AGA-Model vs. Finasteride/TCFE 0.5%). Data are presented as the
  mean ± SEM, * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001
