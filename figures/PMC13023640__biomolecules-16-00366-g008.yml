figure_title: Analysis of KEGG pathway enrichment for genes with altered expression
  in ESCC cells treated with apigenin.
caption: Analysis of KEGG pathway enrichment for genes with altered expression in
  ESCC cells treated with apigenin. Pathway enrichment analysis using KEGG was performed
  to compare apigenin-treated and control (DMSO-treated) (A) TE-1 cells (B) Eca-109
  cells. The bubble plots display the top enriched KEGG pathways, with the x-axis
  representing the GeneRatio and the y-axis indicating pathway names. Bubble size
  corresponds to the number of genes enriched in each pathway, while color reflects
  the enrichment significance. Enrichment significance was calculated using a hypergeometric
  test and adjusted for multiple comparisons using the Benjamini–Hochberg false discovery
  rate (−log10 adjusted p-value). In both cell lines, apigenin treatment was mainly
  associated with pathways related to cancer signaling, protein kinases, ubiquitin-mediated
  processes, membrane trafficking, and cell adhesion signaling
