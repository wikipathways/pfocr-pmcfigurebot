figure_title: '“Menopause healthspan check” pathway. The pathway starts with a rapid
  multidomain screen (VMS and sleep, mood/distress, cardiometabolic risk, bone risk,
  and contextual constraints), followed by burden–risk stratification. Layered interventions
  combine a base lifestyle package for all, symptom-targeted therapy (including menopausal
  hormone therapy when appropriate and evidence-based non-hormonal options), and psychosocial/cognitive
  supports. Short-term (8–12 weeks) and longer-term (6–12 months) monitoring anchors
  care to patient-centered outcomes and objective risk markers. VMS: vasomotor symptoms,
  MHT: menopausal hormone therapy, GSM: genitourinary syndrome of menopause, BP: blood
  pressure, BMD: bone mineral density, CBT-I: cognitive behavioral therapy for insomnia,
  QoL: quality of life'
