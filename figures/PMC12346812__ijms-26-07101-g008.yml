figure_title: Sex hormone-mediated regulation of immune responses contributing to
  female-biased autoimmunity.
caption: Sex hormone-mediated regulation of immune responses contributing to female-biased
  autoimmunity. This schematic diagram illustrates how estrogens, progesterone, and
  androgens differentially modulate immune pathways implicated in the pathogenesis
  of autoimmune diseases such as SLE and pSS. Estrogens enhance B cell survival, promote
  T helper 2 (Th2) and Th17 polarization, and increase pDC-driven IFN-I production
  by upregulating transcription factors (e.g., IRF5, STAT1), cytokines (e.g., IL-21),
  and microRNAs (e.g., miR-10b, miR-26a) through estrogen receptor (ER)-mediated signaling.
  Estrogens also induce epigenetic modifications, including histone acetylation and
  DNA hypomethylation, that amplify inflammatory gene expression. Progesterone supports
  Treg function and suppresses Th1 and Th17 responses, particularly during pregnancy.
  In contrast, androgens attenuate IFN-I and NF-κB signaling, downregulate activation-induced
  cytidine deaminase (AID) and TLR7 expression, and promote immune tolerance through
  expansion of FoxP3+ Tregs and regulation of immunosuppressive factors such as miR-26a
  and IL-10. Collectively, these hormone-mediated mechanisms contribute to enhanced
  immune activation and reduced tolerance in females, thereby increasing their susceptibility
  to autoimmune diseases. All one-way arrows indicate activation and forward progression
  along the pathway, while truncated lines indicate inhibition. Arrows and truncated
  lines are highlighted in red for estrogen-dependent pathways, in blue for androgen-dependent
  pathways, and in purple for progesterone-dependent pathways
