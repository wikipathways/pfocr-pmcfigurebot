figure_title: Gene interaction network and pathway enrichment analysis of differentially
  expressed genes in achalasia patients.
caption: Gene interaction network and pathway enrichment analysis of differentially
  expressed genes in achalasia patients. The figure presents a STRING-based interaction
  map of genes with significantly altered expression in achalasia compared to healthy
  volunteers (HVs). The lower panel lists the top 10 enriched pathways based on KEGG
  annotation. The analysis was conducted using a medium confidence threshold (interaction
  score ≥ 0.400), and results are ranked by false discovery rate (FDR)
