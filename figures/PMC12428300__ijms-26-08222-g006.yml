figure_title: SIRT3 alleviated DON-induced mitophagy.
caption: SIRT3 alleviated DON-induced mitophagy. (A). Cell membrane potential detected
  by fluorescence microscopy. At high mitochondrial membrane potential, JC-1 (an ideal
  fluorescent probe widely used to detect the ∆Ψm of mitochondrial membrane potential)
  could produce red fluorescence. At low mitochondrial membrane potential, JC-1 could
  produce green fluorescence, (B). Cell membrane potential detected by flow cytometry,
  (C). Gene expression of the mitophagy-related proteins LC3, P62, PINK and Parkin,
  (D). Protein expression of the mitophagy-related proteins of LC3, P62, PINK and
  Parkin, and a statistical analysis graph depicting these protein expression levels
  was generated using Image J software (1.53r) expression at the protein levels. Data
  are presented as mean ± SE (n = 3). Significance compared with control (ns p > 0.05,
  * p < 0.05 and ** p < 0.01). The same applies in subsequent figures. (E). DEPs linked
  to the mitophagy pathway, highlighting those upregulated in red, highlighting those
  downregulated in blue (n = 3)
