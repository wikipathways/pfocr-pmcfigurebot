caption: Primary sequence-intrinsic viral immune evasion (PSI) mechanisms targeting
  the MHC I presentation pathway. (1) The central repeat (CR) region of KSHV LANA
  forms G-quadruplex (G4) RNA structures that recruit nucleolin, leading to nuclear
  of the transcript and reduced cytoplasmic translation, (2) G4 structures in the
  mRNAs of KSHV LANA and EBV EBNA1 impede translation elongation by inducing ribosomal
  stalling, thereby limiting protein synthesis and promoting proper protein folding,
  (3) Human cytomegalovirus (HCMV), hepatitis A virus (HAV), and EBV exploit rare
