caption: A model of non-canonical ‘third messengers’ regulating the p53-MDM2 nexus.
  PITPs transport PI from the membrane into the nucleus, initiating the PIPylation
  process. PI4KIIα, PIPKIα, and IPMK sequentially convert PI into various PIPn species.
  These nuclear PIPns modulate the p53-MDM2 nexus and, consequently, regulate several
  critical cancer-related biological processes. Question marks indicate pathways that
  have not yet been experimentally validated
