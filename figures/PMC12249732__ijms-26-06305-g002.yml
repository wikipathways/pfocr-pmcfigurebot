figure_title: Trigeminal nociceptive sensory transduction involves a precise signaling
  cascade.
caption: Trigeminal nociceptive sensory transduction involves a precise signaling
  cascade. When noxious mechanical stimulation is applied to the tissue, it activates
  a generator potential in the peripheral terminal of trigeminal ganglion (TG) neurons.
  This depolarization subsequently opens Nav and Kv channels, thereby generating action
  potentials. These action potentials are conducted through primary afferent TG neurons
  to the central terminal in nociceptive neurons within the spinal trigeminal subnucleus
  caudalis (SpVc). Here, presynaptic Cav channels open, leading to the release of
  neurotransmitters into the synaptic cleft. These neurotransmitters then bind to
  postsynaptic ionotropic glutamate receptors, activating excitatory postsynaptic
  potentials (EPSPs). If the EPSP amplitude surpasses the action potential threshold,
  a barrage of action potentials is conducted to higher centers in the pain pathway,
  resulting in pain perception. TG = trigeminal ganglion, Nav = voltage-gated sodium
  channel, Kv = voltage-gated potassium channel, Cav = voltage-gated calcium channel,
  SpVc = spinal trigeminal nucleus caudalis, EPSP = excitatory postsynaptic potential,
  ASIC = acid-sensing ion channel, TRPA1 = transient receptor potential ankyrin 1
