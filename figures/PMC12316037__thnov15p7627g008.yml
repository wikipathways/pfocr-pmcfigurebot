figure_title: In vivo scarless healing of wounds.
caption: 'In vivo scarless healing of wounds. (A) Schematic representation of the
  experimental procedures for treating infected wounds in mice with PCCUR combined
  with laser irradiation. (B) Representative photographs and simulation images depicting
  the wound healing process in mice. (C) Wound closure percentage at different time
  points. ELISA analysis of the expression levels of (D) IL-6, (E) TNF-α, (F) IL-4,
  and (G) IL-10 inflammatory factors in wound tissues on day 3. (H) H&E staining of
  wound tissues on day 10 posttreatment. Scale bar: 200 μm at the top and 50 μm in
  the enlarged images. (I) Masson''s trichrome staining of wound tissues on day 14.
  Scale bar: 50 μm. (J) Immunofluorescence staining of α-SMA in wound tissues on day
  14. Scale bar: 20 μm. (K) GO and (L) KEGG enrichment analyses of DEGs. (M) Changes
  in the expression levels of DEGs associated with the IL-17 signaling pathway following
  treatment with PCCUR + L-1. The data are presented as the means ± SDs (n = 5). ns
  (not significant), *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. Laser-1
  (L-1, 660 nm, 0.5 W/cm2), Laser-2 (L-2, 660 nm, 0.3 W/cm2)'
