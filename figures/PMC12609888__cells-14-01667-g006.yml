figure_title: Schematic showing the roles of specific Leloir pathway enzymes that
  facilitate galactose metabolism.
caption: Schematic showing the roles of specific Leloir pathway enzymes that facilitate
  galactose metabolism. Lactose can be converted to galactose, which in turn can be
  converted to glucose via multiple possible paths. GALM and GALK1 activity convert
  galactose into galactose-1-phosphate, which is then metabolized by GALT to glucose-1-phosphate.
  Glucose-1-phosphate can either be converted via PGM1 and PGM2 to glucose-6-phosphate
  (which can then enter the pentose phosphate pathway (PPP) and glycolysis pathway),
  or it can be metabolized via PGM2L1 to glucose-1,6-P2, which acts as an allosteric
  inhibitor of enzymes HK and PGM2, thereby also inhibiting PPP and glycolysis. Dotted
  arrows indicate negative feedback regulation. Enzymes GALK1 and UGP2 are highlighted
  in the schematic with heavy black outlines
