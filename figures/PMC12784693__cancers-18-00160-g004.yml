figure_title: Pseudotime trajectory reconstruction and differentiation-associated
  programs in epithelial cells.
caption: Pseudotime trajectory reconstruction and differentiation-associated programs
  in epithelial cells. (A) Monocle2 trajectory of epithelial cells, with cells assigned
  to distinct transcriptional states (State 1–3) along the inferred lineage. (B) Distribution
  of nucleotide metabolism groups projected onto the trajectory, showing the positioning
  of nucleo_low and nucleo_high cells across the developmental continuum. (C) Mapping
  of epithelial cells from normal and tumor tissues onto the trajectory, illustrating
  their placement within the reconstructed differentiation landscape. (D) Pseudotime-colored
  trajectory revealing the gradual transition from early to late differentiation stages.
  (E) Heatmap depicting temporally regulated gene modules along pseudotime, accompanied
  by enrichment analysis summarizing the major biological processes associated with
  each module. (F) Branch-related gene modules identified around the State 1 bifurcation
  point, together with pathway enrichment profiles that outline the transcriptional
  programs underlying trajectory divergence
