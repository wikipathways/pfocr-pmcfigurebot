figure_title: CYP-derived eicosanoids are decreased in colons of obese CRC mice compared
  with lean CRC mice
caption: '(A) Principal component analysis (PCA) shows clear separation of eicosanoid
  profiles between LFD and HFD groups. (B) Volcano plot of colonic eicosanoids. Fold
  change reflects metabolite levels in HFD-fed mice relative to LFD-fed mice. Statistical
  significance was determined using FDR-adjusted P values (Benjamini–Hochberg correction).
  (C) Schematic of the CYP/sEH pathway: polyunsaturated fatty acids (PUFAs) are metabolized
  by CYP monooxygenases (primarily CYP2C/2J isoforms) to generate fatty acid epoxides,
  which are further converted into fatty acid diols by soluble epoxide hydrolase (sEH).
  (D) Heatmap of CYP-derived fatty acid epoxides and their corresponding diols (LFD,
  n = 12; HFD, n = 13). Abbreviations: CRC, colorectal cancer; CYP, cytochrome P450;
  LFD, low-fat diet; HFD, high-fat diet'
