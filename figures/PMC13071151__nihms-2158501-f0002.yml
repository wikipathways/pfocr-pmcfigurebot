figure_title: TSC2/mTORC1 is a key but not exclusive downstream signal of mTORC2/AKT
  in c-Met/β-cateninΔ90 driven HCC in vivo
caption: |-
  (A) Schematic representation of the mTORC2/AKT/mTORC1 signaling pathway. The knockout of RICTOR and TSC2 leads to the activation of mTORC1 in the absence of mTORC2/AKT signaling. (B) Study design. Rictorflox/flox;Tsc2flox/flox mice were hydrodynamically injected with either c-Met/β-cateninΔ90/pCMV or c-Met/β-cateninΔ90/Cre plasmids. (C) The survival curves of Rictorflox/flox;Tsc2flox/flox mice injected with c-Met/β-cateninΔ90/pCMV (N=7) and c-Met/β-cateninΔ90/Cre (N=7). (D) Comparison of liver weight. Data are presented as the mean ± SEM. (E) Survival curves of Rictorflox/flox;Tsc2flox/flox and Rictorflox/flox mice injected with c-Met/β-cateninΔ90/pCMV and c-Met/β-cateninΔ90/Cre, respectively. Survival comparison was performed between Rictorflox/flox;Tsc2flox/flox mice injected with c-Met/β-cateninΔ90/Cre and Rictorflox/flox mice injected with c-Met/β-cateninΔ90/Cre.
  (F) Representative gross liver images, H&E staining, and immunohistochemistry of Ki67, β-catenin, Myc-tag, and GS. Scale bars: 100 μm. (G) Western blot analysis of the AKT pathway proteins and c-MET in normal liver (NL), c-Met/β-cateninΔ90/pCMV liver tumors, and c-Met/β-cateninΔ90/Cre liver tumors. GAPDH was used as the loading control. Abbreviations: H&E, hematoxylin and eosin staining; w.p.i., weeks post-injection
