figure_title: Proof-of-concept gene-editing and peripheral-labeling experiments using
  FIVI
caption: '(A) CRISPR-Cas9-mediated genome editing in the rat through co-transduction
  with rAAV9-EFS-SpCas9 (5 μL) and rAAV9-rActin-EGFP-donor (5 μL).(B) FIVIs at PC19
  with dual-rAAV CRISPR-Cas9 system led to sparse gene editing of neurons in the cerebral
  cortex at PC44 (insets b and c). The EGFP reporter fused to actin fills the neurons
  and accumulates in dendritic spines, such as those highlighted in the insets (d)
  and (e). The inset (f) highlights edited cells in the choroid plexus. Scale bars:
  (a) 1 mm, (b) 500 μm, and (c–f) 10 μm. The diagram was adapted from Nishiyama and
  colleagues.36(C) Transduced retinal ganglion cells (RGCs) labeled with a PC19 rAAV9-CAG-GFP
  (2 μL) injection into the right eye socket (red arrow). RGC axons decussate in the
  chiasma (open arrowhead) and project to targets in the contralateral hemisphere.
  Note the lack of a label in the contralateral optic tract (closed arrowhead).(D)
  Sequential coronal sections (rostral to caudal) at PC44 showing the pathway and
  the central targets of RGC projections, such as the dorsal lateral geniculate nucleus
  (dLGN), the ventral LGN (vLGN), the intergeniculate leaflet (IGL), the medial terminal
  nucleus (MTN), and the olivary pretectal nucleus (OPN). Scale bar: 500 μm.(E) FIVIs
  lead to both central and peripheral nervous system labeling. Optical clearing of
  a PC19 transduced fetus, injected at PC15 with rAAV9-CAG-tdTomato (5 μL), enables
  3D visualization of reporter gene expression in the central (e.g., olfactory bulbs
  [OBs], cortical plate [CP], and spinal cord) and peripheral nervous system (e.g.,
  dorsal root ganglion [DRG], trigeminal ganglion [TG], and vibrissal nerves [VNs]).
  This approach facilitates investigation of the spatial and temporal development
  of cell-type-specific projection pathways. The image was partially created in BioRender.
  Scale bar: 2 mm'
