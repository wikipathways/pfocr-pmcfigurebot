figure_title: Parasites with a disrupted arginine to proline pathway can still mount
  an APR
caption: 'Dd2ΔOAT parasites were exposed to a low dose of HFG, and recrudescent parasites
  showed the hallmarks of the APR.(A) Example of a dose-response curve to HFG for
  the parental Dd2ΔOAT C1, bulk selected Dd2ΔOATAPR2, and three clonal lines of Dd2ΔOATAPR2
  (Dd2ΔOATAPR2 C1, Dd2ΔOATAPR2 C2, and Dd2ΔOATAPR2 C3) (HFG EC50s: Dd2ΔOAT = 0.758
  nM, Dd2ΔOATAPR2 bulk = 5.03 nM, Dd2ΔOATAPR2 C1 = 5.4 nM, Dd2ΔOATAPR2 C2 = 5.2 nM,
  and Dd2ΔOATAPR2 C3 = 5.0 nM). Individual data points represent the average response
  of technical triplicates plus/minus standard deviation and are plotted along with
  a non-linear regression curve fit for each cell line tested.(B) Parasites were incubated
  with multiplexed isotope media for 10 h, after which metabolites were extracted
  and analyzed by LC-MS. Amino acid levels for the different metabolite species were
  normalized to total signal of all detected metabolites per sample and subsequently
  compared to the Dd2ΔOAT parental line. Shown is the average and standard deviation
  of the fold change of each amino acid species to Dd2ΔOAT (six biological replicates).
  Statistical analysis: multiple unpaired Student’s test with two-stage step-up method
  of Benjamini, Krieger, and Yekutieli between Dd2ΔOAT and bulk and clonal Dd2ΔOATAPR2
  parasites for each species: ****p < 0.0001.See Table S1 for complete metabolomics
  dataset and Table S2 for dose-response data'
