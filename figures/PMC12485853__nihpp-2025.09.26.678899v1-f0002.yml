figure_title: Assessment of PGLYRP1’s role in pulmonary inflammation and transcriptional
  responses during Bordetella pertussis infection
caption: Semi-quantitative scoring of hematoxylin and eosin (H&E) stained lung sections
  from wild-type BALB/c (black dots) and PGLYRP1 knockout (red dots) mice at 4- and
  7- days post-infection with B. pertussis (A). Data represents average scores of
  3 blinded investigators scoring degree and percentage of peribronchial infiltration
  and alveolar consolidation. Bulk RNA sequencing was performed on lung homogenates
  collected from WT and PGLYRP1 KO mice at 4DPI to assess differential gene expression.
  Volcano plots (B,D) and heat-maps (C,E) showing total (B,D) and immune-related (C,E)
  differentially expressed genes between B. pertussis challenged BALB/c (WT) and PGLYRP1
  KO mice (B,C) or PGLYRP1 KO mice challenged with parental wild-type B. pertussis
  (WT) or TCT-under releasing strain TCT(−). (F) KEGG enrichment pathway analysis
  was performed on differentially expressed genes from lung tissue isolated from mice
  challenged with WT or TCT(−) B. pertussis. Data represent the mean of biological
  replicates; statistical analyses were performed using adjusted p-values as indicated
  in the main text. *, p-value < 0.05, **, p-value < 0.01
article_title: A dual role for PGLYRP1 in host defense and immune regulation during
  B. pertussis infection
