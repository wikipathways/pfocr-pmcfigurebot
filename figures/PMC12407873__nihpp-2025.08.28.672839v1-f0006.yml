  A, Growth of T4+, T4 5.4am, and T4 K10 38am 51am on B178 (WT) and hldD::Tn10 bacteria. Phage stocks produced on sup+ (BE), supF (NM538) or supD (CR63) bacterial strains were diluted and spotted onto the indicated bacterial lawns. Results are representative of three independent experiments.B, The hldD-waaL operon of E. coli K12 and the biosynthesis pathway of the core LPS, adapted from [61].C, Silver-stained Tris-tricine SDS-PAGE analysis of LPS extracted from the indicated strains.D, Growth of T4+ and T4 5.4am on hldD::Tn10 transformed with an empty vector (pCA24N) or plasmids (p-) expressing hldD (pCA24N-hldD) and rfaC (pCA24N-rfaC). Top agar plates were inoculated with exponentially growing cultures induced with 100μM IPTG for 1 hour and spotted with dilutions of phage stocks produced on a sup+
