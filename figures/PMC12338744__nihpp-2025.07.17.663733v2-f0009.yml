figure_title: SARS-CoV-2 infectivity and HBE culture host responses as a function
  of age
caption: (A) Box plots depicting mean titers in SARS-CoV-2 infected cultures separated
  into age groups. No significant differences were found among ages at any timepoint
  measured. (Ai) Titers 1–3 dpi; (Aii) titers 3–14 dpi. (Aiii) Slopes of viral titers
  from 3, 7, and 14 dpi as a function of age. M = mature; Y = young; E = elderly.
  Shaded areas represent the 95% confidence intervals. (B) PCA of global bulk RNAseq
  transcriptomics colored by age group. Ellipses are drawn at 95% level assuming normal
  distributions of samples per group. (C) Pathways selected from bulk RNAseq data
  by the Reactome + custom pathway annotation describing differentially regulated
  pathways in mock treated cultures between the age groups shown at the dpi indicated.
  (D) Selected differentially regulated pathways in virus-treated samples between
  the age groups shown at the indicated. For (C-D), NES=normalized enrichment score.
  (E) Replication Protocol 2 data for titer plotted by age. (F) Ridge plots representing
  (Fi) ISGs and (Fii) DNA methylation signatures between age groups and times dpi
