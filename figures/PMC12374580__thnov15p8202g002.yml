caption: Identification of key mutations related to gastric cancer (GC) with ovarian
  metastasis (OM). (A) Heatmap of specifically driver mutations in GC with OM compared
  to peritoneal metastasis (PM). 0, non-mutation. 1, mutation. (B) Gene Ontology (GO)
  enrichment analysis of driver mutations in GC with OM. (C) Kyoto Encyclopedia of
  Genes and Genomes (KEGG) pathway analysis of driver mutations in GC with OM. (D)
  Schematic of two driver mutated genes and their mediated genes, thereby regulating
  actin organization and the ovarian microenvironment through related signaling pathways.
  Mutated components are indicated by the colored boxes. (E) Heatmap of significantly
  recurrent mutations from primary tumor (PT) sites and OM sites. (F) Mutation frequencies
  of genes identified from OM sites in the TCGA-STAD and TCGA-OV cohorts
