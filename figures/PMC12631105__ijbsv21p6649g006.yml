figure_title: IFN-γ signalling drives the expression of MHC-II on cancer cells.
caption: IFN-γ signalling drives the expression of MHC-II on cancer cells. (A) UMAP
  visualization of cancer cells, colored by the expression levels of four MHC-II genes.
  (B) Dot plot showing expression of all MHC-II molecule genes in MHC-II+ and MHC-II-
  cancer cells. (C) Proportional abundance (percentage) of cancer cell subsets across
  pathological and molecular subtypes. (D) Comparison of the average percentage of
  MHC-II+ cancer cells across pathological and molecular subtypes. (E) Immunofluorescence
  staining of nuclei (DAPI, blue), pan-cytokeratin (pan-CK) (green), HLA-DRA (red),
  and CD68 (gray) in non-muscle-invasive (NMI) and muscle-invasive (MI) UC tumors.
  Colocalization of pan-CK and HLA-DRA appears yellow in merged images (white arrows).
  (F, G) Heatmaps of pathway activity scores from PROGENy analysis in cancer cells,
  grouped by MHC-II expression (F) and by pathological and molecular subtype (G).
  (H) PROGENy analysis of JAK/STAT pathway activity in spatial transcriptomic sections.
  (I) Western blot analysis of HLA-DRA expression in T24 cells treated with IFN-γ
  (0, 5, 10, 20 ng/mL) for 72 hours. (J) Volcano plot showing differentially expressed
  genes between T24 cells treated with or without IFN-γ (10 ng/ml). (K) Western blot
  analysis of T24 (left) and 5637 (right) cell lines demonstrates that IFN-γ-induced
  HLA-DRA expression is mediated through the JAK1/STAT1 signaling. IFN-γ-induced increases
  in JAK1 and STAT1 phosphorylation, as well as the expression of total STAT1 and
  HLA-DRA were suppressed by treatment with the JAK1/2 inhibitor ruxolitinib
