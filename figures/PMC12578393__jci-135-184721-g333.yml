figure_title: IGFBP6 impairs macrophage antibacterial functions via Akt pathway inhibition
caption: '(A) Experimental workflow for proteomic analysis of rIGFBP6- versus PBS-treated
  macrophages. (B) KEGG pathway analysis of DEPs between rIGFBP6-treated versus PBS-treated
  macrophages, with PI3K-Akt signaling highlighted (red). (C) Western blot analysis
  of PI3K/Akt, JAK/STAT, MAPK, and NF-κB pathway activation in PMs treated with rIGFBP6
  (200 ng/mL) ± heat-killed P. aeruginosa. Phosphorylated proteins detected using
  specific antibodies: p-Akt, p-STAT1, p-STAT3, p-P38MAPK, p-ERK1/2, p-JNK, and p-p65.
  Representative blots from triplicate experiments shown. (D and E) PMs (n = 5/group)
  pretreated with or without rIGFBP6 (200 ng/mL, for 3 h), followed by Akt agonist
  SC79 incubation (25 μM, for 1 h), were assessed for phagocytosis (D) and killing
  (E) of P. aeruginosa. (F) IL-1β secretion determined in PMs pretreated with or without
  rIGFBP6 (200 ng/mL, for 3 h), followed by SC79 incubation (25 μM, for 1 h) and P.
  aeruginosa challenge (6 h, n = 4/group). (G–I) SC79-mediated recovery of antimicrobial
  functions in HMDMs (from 5 healthy volunteers, treated with rhIGFBP6 (200 ng/mL,
  for 3 h) ± SC79 (25 μM), followed by P. aeruginosa challenge). Phagocytosis (G)
  and killing (H) of P. aeruginosa; IL-1β secretion (I; n = 5/group). (J) Survival
  analysis of CLP-induced septic mice treated with SC79 (10 mg/kg) ± rIGFBP6 (n =
  20/group). All data are representative of 3 independent experiments. Dots indicate
  biological replicates (culture wells); 1-way ANOVA in D–I; log-rank test in J; NS,
  not significant. CLP, cecal ligation and puncture; HMDMs, human monocyte–derived
  macrophages; PMs, peritoneal macrophages'
