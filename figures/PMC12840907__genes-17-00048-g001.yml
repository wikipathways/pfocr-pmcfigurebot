caption: 'Discernment of candidate genes and exploration of their biological functions
  (a) Volcanic map of differentially expressed genes in PAADvsNormal. The red dots
  represent the top ten up-regulated genes, while the green dots represent the top
  ten down-regulated genes. (b) Heatmap of differentially expressed genes. Blue: control
  group; Red: PAAD group. (c) Venn diagram of candidate genes revealed 25 candidate
  genes. (d–f) BP CC and MF pathway in GO functional enrichment analysis of candidate
  genes. The annotation of the corresponding molecule and corresponding entry in the
  connection description indicates that the larger the node, the more molecules the
  entry contains. (g) PPI network construction diagram. Circles represent candidate
  genes, while lines represent interactions. (h) Visualization of Cytoscape in PPI
  Network. Circles represent candidate genes, while lines represent interactions'
