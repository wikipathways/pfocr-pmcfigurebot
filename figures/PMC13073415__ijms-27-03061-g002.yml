figure_title: Stress signaling pathways connecting therapy exposure to canonical ICD
  hallmarks.
caption: Stress signaling pathways connecting therapy exposure to canonical ICD hallmarks.
  Anticancer therapies, including but not limited to chemotherapy, radiotherapy, and
  photodynamic therapy (PDT), can induce reactive oxygen species (ROS) and endoplasmic
  reticulum (ER) stress, engaging PERK-eIF2α signaling and downstream processes that
  drive CARL exposure, ATP secretion (often coupled to autophagy-related mechanisms),
  and HMGB1 release at later stages. ATP-P2RX7 and HMGB1-TLR4 sensing, together with
  type I interferon signaling, converge on dendritic cell maturation and efficient
  antigen cross-presentation, ultimately enabling tumor-specific T-cell priming
