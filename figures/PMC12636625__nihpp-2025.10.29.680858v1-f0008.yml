figure_title: Human PBMC GPR18-Gq–AMPK pathway to promote sphingolipid metabolism
caption: '(A) Violin plot of scRNA seq data showing GPR18 expression across pancreatic
  islet cell types. (B) Correlation of GPR18 mRNA expression in M0 macrophages with
  body mass index (BMI). (C) GPR18 mRNA expression in PBMC-derived macrophages under
  M0 and M1 polarization, showing higher levels in M1 macrophages. (D) Western blot
  analysis of pAMPK activation upon NAGly treatment in PBMCs (n=4). (E) Schematic
  of Gpr18 activation via NAGly and downstream inhibition of Gaq with UBO and AMPK
  with CpdC. (F) Volcano plots of differential lipid species (log2 fold change vs
  log10 p-value) after NAGly treatment in PBMC: 0 hour vs 1 hour NAGly(left); 0 hour
  vs UBO+NAGly (middle); (H) 0 hour vs CpdC+NAGly (right). (G-I) Pathway analysis
  of differential lipid species (log2 fold change vs −log10 p-value) after NAGly treatment
  in PBMC: 0 hour vs 1 hour NAGly(G); 0 hour vs UBO+NAGly (H); (H) 0 hour vs CpdC+NAGly
  (I).(D-I) Lipidomic experiments were done in 3 biological replicates and 2 technical
  replicates. Data are mean ± s.e.m. using one-tailed unpaired t-test (A-D); *p <
  0.05, **p < 0.01'
article_title: Acute activation of Gq-signaling in islet macrophages inhibits β-cell
  insulin secretion through AMPK-sphingolipid axis
