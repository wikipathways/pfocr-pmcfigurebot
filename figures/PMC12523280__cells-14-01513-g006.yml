figure_title: KLFs in WNT signaling.
caption: KLFs in WNT signaling. WNT signaling is classified into canonical and non-canonical
  pathways. The canonical pathway operates through the stabilization and nuclear translocation
  of β-catenin whereas non-canonical Wnt signaling executes its action independently
  of β-catenin and relies on calcium signaling as a central mediator. The roles of
  KLFs in modulating Wnt/β-catenin signaling is complex and context dependent. KLF1
  and KLF3 act upstream of Wnt/β-catenin to promote EMT in gastric cancer, while loss
  of KLF3 enhances Wnt1 and β-catenin activity. KLF2 functions as a downstream effector
  of Wnt signaling in pluripotent stem cells but inhibits Wnt activity in a mutant
  p53–dependent manner. KLF4 suppresses Wnt signaling by preventing β-catenin acetylation
  and nuclear translocation, whereas KLF5 enhances β-catenin/TCF4 transcriptional
  activity and promotes proliferation. KLF6 and KLF10 generally repress Wnt signaling
  and stemness, although under chemotherapy resistance conditions KLF6 can cooperate
  with TAF6L to enhance nuclear β-catenin. KLF8 acts both downstream and upstream
  of Wnt/β-catenin. KLF9 inhibits Wnt signaling via downregulation of Frizzled-5,
  KLF11 cooperates with β-catenin to promote stemness genes. KLF12 activates Wnt signaling
  through DVL2 induction. KLFs exert oncogenic or tumor-suppressive effects on Wnt
  signaling in a highly context-dependent manner. Created with BioRender.com
