figure_title: Pipeline of software BioMedGraphica.
caption: "Pipeline of software BioMedGraphica. (A) Entity matching. Two strategies
  are used: a hard match that retrieves entities via standardized identifiers from
  curated nomenclatures, and a soft match that embeds both entity names and user-provided
  feature names into a shared representation space with a pre-trained LM, selecting
  the highest-similarity candidate. (B) Schematic of embedding spaces for entity names
  and feature names, illustrating their vectorized representations by pretrained LM.
  (C) Cosine similarities yield a top k candidate set, and user confirmation finalizes
  a one-to-one mapping for each feature to generate mapping dictionary \U0001D49F.
  (D) BioMedGraphica pipeline begins with user input files (with sample integration).
  For standardized-ID entities—promoter, gene, transcript, protein, pathway, metabolite,
  microbiota—BioMedGraphica performs hard matching against curated nomenclatures.
  For free-text entities—exposure, phenotype, disease, drug—it applies soft matching
  with a pre-trained LM for semantic alignment. Matched items are consolidated into
  a feature dictionary with contextual attributes; relation selection and auto-completion
  then produce structured outputs (TNG subsets). The workflow combines curated-ID
  precision with LM-based semantics to generate AI-ready biomedical graphs enriched
  with textual annotations"
