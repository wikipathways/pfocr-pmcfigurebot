figure_title: AhR-CYP1A pathway induced by PAHs and interference in the HPGL axis.
caption: AhR-CYP1A pathway induced by PAHs and interference in the HPGL axis. After
  crossing the cell membrane, PAHs bind to the aromatic hydrocarbon receptor (AhR),
  activating the transcription of the Cyp1a gene in the nucleus. The CYP1A enzyme
  metabolizes PAHs into reactive and toxic compounds, which promote the generation
  of reactive oxygen species (ROS), leading to oxidative stress and cellular damage.
  In parallel, these metabolites negatively interfere with the expression and function
  of aromatase (CYP19A1), the enzyme responsible for the conversion of androgens into
  17β-estradiol (E2). The reduction in E2 synthesis compromises hormonal signaling
  and results in dysregulation of the hypothalamic-pituitary-gonad-lobe (HPGL) axis,
  negatively affecting the reproductive function of exposed fish
