figure_title: CDK4/6i maintenance induces an ineffective Rb inactivation pathway
caption: (A) Immunoblot of phosphorylated Rb (S807/811; p-Rb), total Rb (t-Rb), and
  β-actin protein levels in MCF-7 cells. Drug-resistant cells were harvested two weeks
  after drug withdrawal. (B) Singe-cell traces of CDK2 activity aligned to mitosis
  in proliferating (red) and quiescent (blue) MCF-7 cells. Circles indicate the time
  of fixation and staining (n = 200 cells). (C) Scatter plot of EdU intensity versus
  time since mitosis in parental cells. The red dotted line marks the threshold for
  S phase (n = 2,000 cells). (D, E) Percentage of S-phase cells as a function of time
  since mitosis in proliferating (D) and quiescent (E) cells. Data represent mean
  ± SD (n = 2 biological replicates). (F) Representative immunostaining of Hoechst,
  p-Rb, t-Rb, and E2F1 mRNA FISH (top). Processed images showing nucleus segmentation,
  p-Rb classification, and mRNA puncta detection (bottom). (G) Histogram of cells
  with p-Rb normalized to t-Rb. (H, I) Percentage of cells with p-Rb (H) and E2F1
  mRNA levels (I) as a function of time since mitosis. Data represent mean ± SD (H,
  n = 3 biological replicates) or mean ± 95% confidence intervals (I, n > 2,500 cells/condition).
  (J, K) E2F1 mRNA (J) and EdU (K) levels as a function of CDK2 activity. Data represent
  mean ± 95% confidence intervals (n > 2,500 cells/condition). (L, M) Averaged traces
  of CDK4/6 (left) and CDK2 (middle) activities and Cdt1-degron intensity (right)
  (L) and percentage of S-phase cells (M). MCF-7 cells were released after synchronizing
  with nocodazole (250 nM, 14 hr)
article_title: Therapeutic benefits of maintaining CDK4/6 inhibitors and incorporating
