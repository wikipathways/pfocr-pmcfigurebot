figure_title: 'Nuclear CaMKII in pathology: context-specific misregulation across
  disease domains.'
caption: 'Nuclear CaMKII in pathology: context-specific misregulation across disease
  domains. Schematic representation of isoform- and pathway-specific consequences
  of nuclear CaMKII dysfunction. In cancer, CaMKIIγ sustains proliferation and survival
  via NF-κB, BCL-2, cyclin D1, MDR1, and BRCA1 signaling. In chemoresistance, CaMKIIγ
  maintains pro-survival transcriptional programs (NF-κB, HIF-1α, MDR1) and suppresses
  apoptosis, while tool inhibitors such as KN-93 partially restore chemosensitivity.
  In heart failure, CaMKIIδ isoforms drive maladaptive remodeling via RyR2 hyperphosphorylation,
  Ca2+ mishandling, NF-κB activation, KCNIP2 repression, and repolarization defects,
  promoting inflammation and apoptosis. In developmental disease, pathogenic CAMK2G
  mutations (CaMKIIγ) disrupt CREB/BDNF signaling and dendritic development, while
  CaMKIIδ mis-splicing alters cardiac gene programs (e.g., Nppa, Myh7), leading to
  early-onset cardiomyopathy. Collectively, these mislocalized or mistimed nuclear
  CaMKII signals convert adaptive decoding into maladaptive transcriptional reprogramming'
