figure_title: The role of netrin-1 in acute lung injury.
caption: 'The role of netrin-1 in acute lung injury. When local inflammation occurs,
  the NF-κB pathway is activated, inhibiting the transcription of NTN1 and increasing
  the recruitment of monocytes and neutrophils. Meanwhile, the expression of CCL2
  in macrophages increased, and NK cells were recruited. (↑: increased; ↓: decreased.)'
