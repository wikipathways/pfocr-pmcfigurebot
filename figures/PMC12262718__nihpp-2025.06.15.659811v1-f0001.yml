figure_title: Whole brain proteomics in male and female APOE3 and APOE4 TR mice
caption: A. Study schematic showing male and female APOE3 and APOE4 targeted replacement
  (TR) mice. Whole brain lysate or isolated brain mitochondria were used for proteomic
  (n=3 per group). B. Violin plot of APOE protein expression from whole brain in male
  and female APOE3 and APOE4 mice. C. The number of differentially expressed (DE)
  proteins in male and female APOE4 vs. APOE3 mice. D. Volcano plot showing up and
  down regulated proteins in female APOE4 vs. APOE3 mice. E. IPA showing up and down
  regulated pathways in female APOE4 mice. F. Volcano plot showing up and down regulated
  proteins in male APOE4 vs APOE3 mice. G. IPA showing up and down regulated pathways
  in male APOE4 mice. H. Venn diagram of upregulated protein overlap in male and female
  APOE4 vs. APOE3 mice. I. Venn diagram of down regulated protein overlap in male
  and female APOE4 vs. APOE3 mice. G=main effect of genotype
