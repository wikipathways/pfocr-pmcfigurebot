figure_title: BfaGC is necessary and sufficient to modulate colonic NKT cells
caption: a) Sphingolipid biosynthesis pathway of B. fragilis confirmed with individual
  gene knockout strains. CerS produces 3-keto-4,5-dihydro-ceramide (ketoCer) as a
  transient intermediate, which is further reduced by CerR to produce dihydroceramide
  (Cer) and complex sphingolipids such as BfaGCs. Extracted ion chromatograms (XICs)
  of 3-keto-dihydrosphingosine (KDS) (17:0), ketoCer (34:0), Cer (34:0), and alpha-galactosylceramides
  (aGC) (34:0) from B. fragilis wild type (WT), Δspt, ΔcerS, ΔcerR, and ΔagcT were
  shown.b) Deleting individual genes involved in BfaGC biosynthesis abolishes CD1d-mediated
  IL-2 induction in NKT cells elicited by B. fragilis total lipids. NKT cell hybridomas
  (24.7) were incubated with CD1d-lipid complex and IL-2 secretion was measured by
  ELISA (biologically independent replicates, n = 4 per group). KRN700017 (n=3) was
  included as a positive control.c) Heterologous expression of agcT in ceramide-producing
  species (biologically independent replicates, n=4 for each group) enabled induction
  of IL-2 in NKT cell hybridomas (24.7).d) BfaGC production in vivo depends on agcT.
  C34:0 BfaGC levels were measured in stool samples from 5-week-old female C57BL/6
  mice monocolonized with B. fragilis wild-type (n=3) or agcT mutant strains (n=4)
  and compared to GF (n=4).f) Selective loss of BfaGC by deletion of agcT or its upstream
  regulator Δ3069 abrogated colonic NKT cell modulation by B. fragilis. At 6 weeks
  of age, colonic NKT cell frequencies were analyzed in male and female Swiss Webster
  mice monocolonized from birth with B. fragilis wild type (n=5), Δ3069 (n=4), or
  ΔagcT (n=5), alongside SPF (n=13) and GF (n=6) mice. The representative gating strategy
  is shown in Fig. S3c-d.a-d) Each dot indicates a biologically independent replicate.
  Results represent two independent experiments showing similar trends. Statistical
  analysis was performed using one-way ANOVA followed by Dunnett’s multiple comparisons
  test in a-c, andone-way ANOVA followed by Tukey’s multiple comparisons test in d.
  Bars and error bars represent the mean ± s.e.m
