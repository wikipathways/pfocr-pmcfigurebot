figure_title: Effect of LIPUS on tau protein modification and possible molecular interventions.
caption: Effect of LIPUS on tau protein modification and possible molecular interventions.
  LIPUS application balances the kinases and phosphorylation to regulate tau modification.
  LIPUS triggers the ROCK/Cot/Tpl2 to reduce oxidative stress in CTE via ERK signaling.
  This can decrease the formation of neurofibrillary tangles. LIPUS induces GSK-3β
  to promote neuronal growth and survival via β-catenin and CDK5. LIPUS application
  in CTE activates the TGF-beta1, which in turn activates the PP2 to decrease the
  dephosphorylation of tau, and reduce the tau protein tangle. LIPUS can also activate
  the PI3K/AKT pathway to influence Nrf-2 signaling and promote GSH production, thereby
  reducing oxidative damage in the CTE brain. Additionally, LIPUS application triggers
  anti-apoptotic proteins, such as Bcl-2, which can inhibit CHOP and caspase-12. Furthermore,
  LIPUS can trigger the CamKII to induce CREB for neuronal growth and survival, whereas
  CamKII inhibits the CREB for triggering inflammation
