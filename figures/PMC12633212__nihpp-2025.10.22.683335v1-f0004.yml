figure_title: Comparative pathway analysis reveals dysregulated cellular programs
  in T2D β cell subtypes
caption: a, Schematic overview of pathway over-representation analysis (ORA) comparing
  1) ND β2–4 to ND β1, 2) T2D β2–4 to ND β1 and, 3) T2D β2–4 to ND β2–4 clusters.
  Arrows indicate the direction of comparison for identifying differentially regulated
  biological pathways between disease states and β cell subtypes. b, Dot plots summarizing
  representative pathways found to be significantly upregulated (left) or downregulated
  (right) in β2–4 versus β1 clusters (top panels) and in T2D versus ND β2–4 clusters
  (bottom panels). Dot size reflects −log10(FDR), with statistical significance determined
  by FDR-adjusted p < 0.05. c, Sankey diagrams depicting the distribution of dysregulated
  pathways (UP, left; DOWN, right) in T2D β2–4 clusters compared to ND β2–4 clusters
  male (top) and female (bottom). Pathway groups are color-coded as indicated; width
  of each stream reflects the strength of statistical significance (−log10[FDR] +
  1). d, Violin and dot plots showing pathway module scores and select pathway specific
  gene expression of 5 genes, for unfolded oxidative phosphorylation (OXPHOS) and
  mitophagy gene sets for β-cell clusters by disease and sex. e, Sankey diagrams depicting
  the distribution of dysregulated pathways (UP, left; DOWN, right) in T2D β2–4 clusters
  compared to ND β1 clusters male (top) and female (bottom). Pathway groups are color-coded
  as indicated; width of each stream reflects the strength of statistical significance
  (–log10[FDR] + 1). f, Violin and dot plots showing pathway module scores for inflammation,
  mitophagy, oxidative stress/death and UPR for β cell clusters by disease and sex.
  Bars represent −log10(FDR) comparing each cluster to its β1 counterpart. g, Regression
  analysis for inflammation, mitophagy, oxidative stress/death and UPR within β cell
  clusters by disease and sex comparing module score and mean disease score. Details
  of ORA methodology and statistical testing are provided in Methods
