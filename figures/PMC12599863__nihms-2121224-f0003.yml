figure_title: Biochemical activity assays to evaluate analog inclusion into the TM
  pathway
caption: A. NADPH oxidation values for each substrate with either wild-type, N207A,
  N207T, or N207S mutant NpsA. Values are plotted in triplicate and depicted as mean
  ± standard deviation. Oxidation activity was monitored by measuring the negative
  slope at 340 nm, indicating NADPH consumption. B. Spontaneous conversion of tilimycin
  into tilivalline with the introduction of 2mM indole in the biochemical reaction.
  C. Superimposed extracted ion chromatograms (EIC) traces of wild-type NpsA favoring
  substrates, 3HA and 3FA, showing the reconstituted tilimycin (black) and tilivalline
  (pink) analog products, obtained in reactions in the absence and presence of indole,
  respectively. D. Superimposed EIC traces of N207A NpsA favoring substrates, 3Methxy,
  3MA, and AA, showing the reconstituted tilimycin (black) and tilivalline (pink)
  analog products obtained in reactions in the absence and presence of indole, respectively.
  E. Superimposed EIC traces of N207T NpsA favoring substrates, 4HA, 5HA, and 5FA,
  showing the reconstituted tilimycin (black) and tilivalline (pink) products obtained
  in reactions in the absence and presence of indole, respectively
