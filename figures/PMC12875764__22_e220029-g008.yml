figure_title: Light-triggered activation process in OLPVR1.
caption: 'Light-triggered activation process in OLPVR1. In the dark state (PDB ID:
  7AKX [1]), there are two hydrogen-bonding networks, one from retinal Schiff base,
  D76, and D200, and another from S11, E51, and N205 (SEN triad). In the primary intermediate,
  the hydrogen-bonding interaction of E51 with S11 and N205 is disrupted (this study),
  leading to channel opening of OLPVR1. Ion-pathway in the open state is schematically
  drawn based on the open-state structure [7]'
