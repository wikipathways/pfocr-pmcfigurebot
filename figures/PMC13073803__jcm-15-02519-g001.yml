figure_title: Proposed synergistic mechanism of action of the myo-inositol (MI) and
  α-Lactalbumin (ALA) combination.
caption: Proposed synergistic mechanism of action of the myo-inositol (MI) and α-Lactalbumin
  (ALA) combination. In conditions of chronic low-grade inflammation typical of GDM
  and the postpartum period, the intestinal absorption of inositols may be impaired
  due to altered tight junction permeability and downregulated transporters. ALA peptides
  act on intestinal tight junctions, transiently increasing permeability and enhancing
  the paracellular bioavailability of orally administered MI. Once into the bloodstream,
  MI could reach target tissues (skeletal muscle and the liver), where it acts as
  a crucial second messenger for insulin signaling, facilitating PI3K/Akt pathway
  activation and GLUT4 translocation to the cell membrane, thereby improving glucose
  uptake
