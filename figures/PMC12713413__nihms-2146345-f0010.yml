  Ste20-Ste11-Ste7-Fus3 kinase cascade in S. cerevisiae and the Cst20-Ste11-Hst7-Cek1/Cek2
  kinase cascade in C. albicans. The Ste12 (Cph1 in C. albicans) transcription factor,
  downstream of the MAPK pathway, is then phosphorylated and activates the expression
