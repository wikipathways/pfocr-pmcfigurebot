figure_title: Bhlhe40 supports glycolytic and oxidative phosphorylation in CD8 T cells
  in a therapy-dependent manner
caption: (A) Dot plot showing expression of select glycolytic genes (Aldoa, Gapdh,
  Eno1, etc.) in all CD8 T cell clusters. (B) GSEA showing enrichment of Hallmark
  glycolysis pathway in PD1hi_Eff/Ex and Nr4a1hi_Eff/Ex cluster between Bf/f vs BΔCD8
  mice with anti-PD-1 treatment. (C) XF real-time ATP production rate comparing glycolytic
  and mitochondrial ATP on ex vivo intratumoral CD8 T cells in Bf/f and BΔCD8 mice
  treated with control Ab, anti-PD-1, or anti-CTLA-4. (D) XF real-time ATP seahorse
  assay showing ECAR and OCR on ex vivo intratumoral CD8 T cells in Bf/f and BΔCD8
  mice treated with control Ab, anti-PD-1, or anti-CTLA-4. For (C) and (D) (**p <
  0.01; ***p < 0.001; ****p < 0.0001; ns, not significant, unpaired t test or 2-way
  ANOVA)
article_title: Bhlhe40 Coordinates T Cell Programs with Distinct CD4 and CD8 T Cell
  Requirements for Anti-PD-1 Versus Anti-CTLA-4
