caption: 'Functional enrichment results of the turquoise module. (A) GO Biological
  Process (BP): protein catabolism, mitochondrial organization, and cellular respiration
  were highly enriched. (B) GO Cellular Component (CC): enrichment in mitochondrial
  structures, including the inner membrane and the oxidoreductase complex. (C) GO
  Molecular Function (MF): translational regulation and acyltransferase activity.
  (D) KEGG pathway analysis revealed that oxidative phosphorylation, thermogenesis,
  and neurodegenerative disease pathways were the most dominant'
