figure_title: SCoR2 regulates carbohydrate metabolism, including polyols, to provide
  antioxidative protection from injury via the pentose phosphate shunt pathway (PPP)
caption: '(A): Human heart samples (IRB# Pro00005621, N=9 with diagnosis of ischemic
  cardiomyopathy (ICM) and N=10 without known cardiac pathophysiology (healthy)) subjected
  to SNORAC measuring SNO-PKM2 relative to loading control (SNO-p97 ATPase). Representative
  SNORAC/Western blot gels shown in Fig. S3G,H. (B-J): Metabolites quantified by ion
  abundance in SCoR2+/+ (+/+) and SCoR2−/− (−/−) mouse heart and plasma by LC/MS-based
  untargeted metabolite profiling; N=5 each condition. (B) Heart lactate. (C-K) Metabolites
  organized by relationship to the PPP, as inputs (C,D), products (E-H), or polyol
  compounds that are categorized as downstream end products of the PPP (I,J). NADPH
  measured in heart lysate after 2 hr reperfusion, erythrose 4-phosphate measured
  after 4 hr reperfusion. (K): Recombinant SCoR2 activity quantified via NADPH consumption
  by spectrophotometer in the presence of canonical substrate (100μM SNO-CoA) or carbohydrates
  (1mM); [SCoR2] = 186nM, [NADPH] = 100μM. Results presented as specific activity
  of SCoR2 (μM substrate consumed/min/mg protein). Assay performed in triplicate.
  (L): Summary model showing SCoR2-mediated regulation of carbohydrate metabolism,
  including PPP and polyol compounds, to generate NADPH and phosphocreatine in the
  mouse heart. Green arrows indicate pathway upregulation in the absence of SCoR2
  and red arrows indicate downregulation. Blue boxes indicate metabolic pathways,
  tan boxes indicate metabolites, and pink boxes indicate metabolites of particular
  significance. Thick black arrows indicate directions of SCoR2-regulated metabolic
  changes. Image created with Biorender.com. Statistical significance in (A) determined
  by Student’s t-test; (B-H,J) determined by multiple independent Student’s t-tests
  performed between genotypes in each condition; (I) determined by two-tailed Mann-Whitney
  test; (K) determined by two-tailed Mann-Whitney test between SNO-CoA condition and
  each carbohydrate condition (N = 3-8 independent replicates per condition). * p
  ≤ 0.05 , ** p ≤ 0.01 , *** p ≤ 0.001 , **** p ≤ 0.0001'
