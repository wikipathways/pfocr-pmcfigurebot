figure_title: Endothelial-specific analyses
caption: 'A, Uniform manifold approximation and projection embedding of endothelial
  (EC) clusters. B, Proportion of major cell types within control and hypertrophic
  cardiomyopathy (HCM) subjects and pooled cohorts. C, Top: Embedding derived from
  differential abundance (DA) analysis in HCM (blue) vs control (red). Bottom: Beeswarm
  plots derived from DA testing stratified by cluster, where each point represents
  a neighborhood. D, Heatmap of differentially expressed genes (DEGs) in EC clusters.
  E, Violin plot illustrating expression for RGCC and NOTCH4 in HCM vs control with
  adjusted P<0.001. F, Enrichment map stratified by EC cluster for proportional gene
  ontology pathway analysis with adjusted P<0.05'
