figure_title: Loss of STIM2 leads to transcriptional reprogramming of CRC cells
caption: '(A to D) Volcano plot showing a comparison of differentially expressed genes
  between STIM2 KO #15 and parental HCT116 cells (A), STIM2 KO #31 and parental HCT116
  cells (B), STIM DKO #22 and parental HCT116 cells (C), and STIM DKO #34 and parental
  HCT116 cells (D). The X-axis shows log2 fold changes, and the Y-axis shows -log10
  (P-value). The threshold in the plot corresponds to P- value <0.05 and log 2-fold
  change <−1.0 or > 1.0. The significantly downregulated genes are black and upregulated
  genes are blue or green. n= 3 biological replicates per group.(E and F) Pathway
  analysis showing plot between normalized enrichment score and nominal p-value. The
  positive enrichment score represents upregulated pathways, and negative enrichment
  shows downregulated pathways in STIM2 KO #15 clone compared to parental HCT116 cells
  (E) and in STIM DKO #22 clone compared to parental HCT116 cells (F).(G and H) GSEA
  analysis reveals enrichment of the hallmark of Myc target version 1 gene set in
  STIM2 KO #15 HCT116 clone (G) and STIM DKO #22 HCT116 clone (H) compared to parental
  HCT116 cells.(I and J) GSEA analysis reveals enrichment of the hallmark of Myc target
  version 2 gene set in STIM2 KO #15 HCT116 clone (I) and STIM DKO #22 HCT116 clone
  (J) compared to parental HCT116 cells.(K and L) GSEA analysis reveals enrichment
  of the hallmark of unfolded protein response (UPR) gene set in STIM2 KO #15 HCT116
  clone (K) and STIM DKO #22 HCT116 clone (L) compared to parental HCT116 cells'
article_title: Loss of STIM2, but not of STIM1, drives colorectal cancer metastasis
  through metabolic reprogramming and the ATF4 ER stress pathway
