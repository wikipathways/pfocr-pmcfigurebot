figure_title: Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis
  of DEGs following irradiation.
caption: Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis
  of DEGs following irradiation. (A,B) Bubble plots showing significantly enriched
  KEGG pathways based on DEGs identified by limma-voom (A) and DESeq2 (B). The x-axis
  represents the GeneRatio, while bubble size corresponds to the number of genes mapped
  to each pathway. Color intensity indicates the adjusted p-value (padj), reflecting
  enrichment significance. Across both analytical approaches, cytokine–cytokine receptor
  interaction and hematopoietic cell lineage pathways emerged as dominant features,
  with additional enrichment of key signaling pathways, including JAK–STAT, PI3K–Akt,
  extracellular matrix–receptor interaction, and complement and coagulation cascades,
  highlighting coordinated inflammatory, hematopoietic, and microenvironmental responses
  to irradiation
