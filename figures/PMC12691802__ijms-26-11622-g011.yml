figure_title: Simplified diagram of the HIF-1α pathway.
caption: Simplified diagram of the HIF-1α pathway. Under normoxic conditions, HIF-α
  subunits are hydroxylated by PHDs, enabling recognition by the pVHL ubiquitin ligase
  complex and proteasomal degradation (upper part). During hypoxia, hydroxylation
  is suppressed, stabilizing HIF-α, which translocates to the nucleus, dimerizes with
  HIF-1β, and binds HREs to activate genes essential for cellular adaptation to low
  oxygen (lower part). The arrow and line indicate a stimulating effect
