figure_title: Investigating association of pathways, cell types and brain regions
  by Gene Set Burden Analysis (GSBA)
caption: Gene sets were derived for Pathway (from GO, KEGG, REACTOME, and BioCarta),
  Cell type (from single cell study, Velmeshev et al.), and Cortical regions (from
  Glasser parcellation of the Allen Brain Atlas). Case-control association of CNV
  burden collapsed across gene sets, was then tested by logistic regression and meta-analysis
  was performed across genotyping platforms. Functional gene set associations were
  tested for 6 major psychiatric conditions (ASD, ADHD, SCZ, PTSD, MDD, BD)
article_title: Psychiatric disorders converge on common pathways but diverge in cellular
  context, spatial distribution, and directionality of genetic effects
