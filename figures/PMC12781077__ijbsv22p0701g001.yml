figure_title: Crosstalk between the Hh Pathway and Other Signaling Pathways.
caption: Crosstalk between the Hh Pathway and Other Signaling Pathways. The Hh pathway
  can be persistently activated through crosstalk with other signaling pathways, including
  EGFR, PI3K-Akt, and TGF-β. EGFR signaling induces Gli activation via the MAPK cascade.
  The PI3K-Akt pathway directly activates Gli transcription factors and concurrently
  enhances Hh signaling by suppressing PKA, a key negative regulator of the pathway.
  TGF-β further promotes the transcriptional upregulation of GLI
