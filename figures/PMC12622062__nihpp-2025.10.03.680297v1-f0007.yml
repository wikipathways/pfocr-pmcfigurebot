figure_title: Schematic summary
caption: 'A. Schematic overview of annuli embedding in the T. gondii IMC, relative
  to other cytoskeleton structures. PCR: pre-conoidal ring; APR: apical polar ring.B.
  Schematic representation of apical annuli architecture and the connection between
  the pore through the IMC and LMDB3 embedded in the plasma membrane mediated by AAP7.
  Relative position of components is based on each component’s measured diameter as
  in Fig 1G.C. Depletion of AAP7 disrupts targeting of LMDB3 to the plasma membrane,
  which accumulates in an area in close proximity to secretory pathway organelles
  residing apical of the nucleus. ELC: endosome-like compartment; PLV: plant-like
  vacuole.D. Depletion of AAP7 results in bubble vacuoles through reduced GRA17 secretion,
  which disrupts the exchange of small molecules across the PVM causing osmotic swelling.
  PVM: parasitophorous vacuole membrane.E. Schematic representation of TgAAP7 and
  sequence features identified on ToxoDB [77] (experimentally validated Arginine mono-methylation
  [78] and Ser/Thr phosphorylation [79] sites; predicted palmitoylation sites [80]),
  SMART analysis [50] (coiled coils and d1gw5b-box). The putative MUNC13 homology
  was detect by SMART analysis in the Porospora gigantea ortholog of AAP7, and partially
  overlaps with d1gw5b-box, which is found in clathrin adaptor core protein family
  (AP).F. Putative AAP7 orthologs found in representative apicomplexan and chromerid
  genomes by BLASTP searching VEuPathDB [81] using TgAAP7 as bait. Orthologs found:
  Hh, Hammondia hammondi: HHA_242780; Nc, Neospora caninum: NCLIV_017770; Sn, Sarcocystis
  neurona: SN3_00401130; Em, Eimeria maxima: EMWEY_00011300; Et, Eimeria tenella:
  ETH2_0841300; Cc, Cyclospora cayetanensis: cyc_05092; Pf, Plasmodium falciparum:
  PF3D7_1349500; Pb, Plasmodium berghei: PBANKA_1362300; Pv, Plasmodium vivax: PVP01_1205300;
  Pk, Plasmodium knowlesi: PKNH_1251400; Pf Porospora gigantea: KVP18_002524; Gn Gregarina
  niphandrodes: GNI_178520; Vb, Vitrella brassicaformis: Vbra_702. Purple box highlights
  the MUNC13/AP homology region. Alignment by Clustal Ω, processing for presentation
  by Geneious; %identity: red 0–25%; yellow 25–50%; green 100% (marks the unique C-tail
  of TgAAP7); aligned areas represented by black boxes, gaps by lines'
