figure_title: Inhibition of UPR pathways.
caption: Inhibition of UPR pathways. The inhibitor effects on PERK or IRE1α pathways
  were assayed through viral titer and RT-qPCR in VERO infected cells in both conditions,
  not treated (NT) and in the presence of PERK (GSK) or IRE1α (4µ8c) inhibitors. (A)
  Viral progeny of EAV obtained with TCID50/mL assay after the infection of VERO cells
  in NT, GSK and 4µ8c conditions. (B) Quantification of viral RNA obtained in the
  same conditions with a focus on the viral N transcript. The values were normalized
  to the GAPDH gene and relativized to the MOCK experiment. The bars indicate the
  mean ± SD of three independent experiments. * p < 0.05, ** p < 0.01
