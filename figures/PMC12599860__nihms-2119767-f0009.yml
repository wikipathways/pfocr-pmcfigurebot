figure_title: Ribosomal collisions activate quality control pathways.
caption: Ribosomal collisions activate quality control pathways. Collided ribosomes
  are ubiquitinated on the 40S subunit of the leading ribosome by ZNF598, which recruits
  the Cue2 endonuclease to cleave the mRNA between the collided ribosomes. The leading
  ribosome is resolved by the Ribosome Quality Trigger (RQT) complex. The lagging
  ribosome is processed by No-Go Decay (NGD) factors Pelota and Hbs1, which bind to
  the A site and GTPase site (respectively). Hbs1 is then exchanged for ABCE1, which
  drives removal of the 60S subunit. The timing of NGD factor dynamics, mRNA cleavage,
  and subunit dissociation remains unclear. The polypeptide is subsequently cleared
  from the 60S subunit via the Ribosome Quality Control (RQC) pathway
article_title: Synergistic methods to investigate eukaryotic translation and its quality
