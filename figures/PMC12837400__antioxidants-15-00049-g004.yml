figure_title: NPAE protects endothelial cells against IR-induced damage by suppressing
  the pyroptosis pathway through downregulation of key executioner proteins.
caption: 'NPAE protects endothelial cells against IR-induced damage by suppressing
  the pyroptosis pathway through downregulation of key executioner proteins. Schematic
  representation of NPAE pretreatment experiments (A). Caspase-1/PI dual staining
  quantifying early (Q2: caspase-1 +/PI −) and late (Q3: caspase-1 +/PI +) pyroptotic
  populations at 72 h post-irradiation (B). Western blot detection of pro-caspase-1,
  its activated fragment cleaved caspase-1 and GSDMD proteolytic processing quantification
  at 72 h post-irradiation (C). ELISA analysis of IL-18 secretion (D) and IL-1β secretion
  (E) 96 h post-irradiation. * p < 0.05, ** p < 0.01, *** p < 0.001 vs. IR group;
  ns indicated non-significant; GAPDH served as loading control for immunoblotting'
