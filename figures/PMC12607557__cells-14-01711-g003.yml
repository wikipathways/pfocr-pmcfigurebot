figure_title: Regional distribution of kynurenine (KYN) pathway metabolites in wild-type
  (WT) and kat2−/− mouse brains.
caption: Regional distribution of kynurenine (KYN) pathway metabolites in wild-type
  (WT) and kat2−/− mouse brains. (a) Tryptophan (Trp), (b) Kynurenic acid (KYNA),
  (c) Quinaldic acid (QAA), (d) Anthranilic acid (AA), (e) 3-hydroxykynurenine (3-HK),
  (f) Xanthurenic acid (XA), and (g) 3-Hydroxyanthranilic acid (3-HAA) concentrations
  measured in striatum (STR), cortex (CTX), hippocampus (HIPP), cerebellum (CER),
  and brainstem (STEM). Trp was significantly lower in STR, CTX, and HIPP. While KYNA
  increased in STR, its concentration lowered in CTX and HIPP. QAA’s concentration
  was significantly lower in CER and STEM. The level of AA was higher in CTX. The
  concentration of 3-HK increased in every brain region. XA decreased in CTX, HIPP,
  CER, and STEM. The level of 3-HAA increased in CTX. Wild-type (WT, light green)
  and kat2−/− (dark green) groups are shown. Data are expressed as mean ± SD. ●, outlier;
  ▲, far out. *, p < 0.05; **, p < 0.01; ***, p < 0.001. The figure was created with
  LabPlot 2.9.0 (KDE, Berlin, Germany) and BioRender.com. 3-HAA, 3-hydroxyanthranilic
  acid; 3-HK, 3-hydroxykynurenine; AA, anthranilic acid; CER, cerebellum; CTX, cortex;
  HIPP, hippocampus; KYNA, kynurenic acid; QAA, quinaldic acid; STEM, brainstem; STR,
  striatum; Trp, tryptophan; WT, wild-type mice; kat2−/−, kynurenine aminotransferase
  II knockout mice; XA, xanthurenic acid
