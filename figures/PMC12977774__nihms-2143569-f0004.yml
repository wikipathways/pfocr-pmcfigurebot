figure_title: Signaling changes in NN-01-195-treated cells resemble those induced
  by AURKA inhibitor VIC-1911
caption: 'A., B. FaDu cells were exposed to vehicle, VIC-1911, NN-01-195, or NN-01–148
  at the indicated concentrations for 24 hours, and RPPA analysis performed. Protein
  expression values for each protein were normalized to protein expression values
  for the vehicle treated control. Graphs overlay scatterplots for VIC-1911 and NN-01-195
  (A) or NN-01–148 and NN-01-195 (B), with proteins associated with the AURKA pathway
  that are induced by both VIC-1911 and NN-01-195 relative to vehicle-treated cells
  circled and labeled in red; proteins that are induced by VIC-1911 alone are circled
  in blue. n = 2. Proteins associated with HSP90 that are induced by both NN-01–148
  and NN-01-195 relative to vehicle-treated cells are circled and labeled. n = 2.
  C. Selected proteins relevant to HSP90 were validated via Western Blot analysis
  in FaDu and NCI-H1975 cell lines. Protein expression normalized to vehicle and quantified.
  Representative of n = 3. D. pAURKA (T288) protein expression was validated via immunoprecipitation,
  followed by Western Blot analysis. Protein expression normalized to vehicle and
  quantified. E. Additional proteins that are known to be inhibited by SNX2112 were
  validated by Western blot. Representative of n = 3. * p < 0.05, ** p < 0.01, ***
  p <0.001, # p < 0.0001 for all graphs'
article_title: NN-01-195, a novel conjugate of HSP90 and AURKA inhibitors effectively
  targets solid tumors
