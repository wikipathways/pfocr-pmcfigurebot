figure_title: Modulation of the TLR9 pathway in neurons following melatonin intervention.
caption: Modulation of the TLR9 pathway in neurons following melatonin intervention.
  (a) Quantitative analysis of malondialdehyde (MDA) levels in neurons (n = 10); (b)
  Quantitative analysis of 8-hydroxy-2′-deoxyguanosine (8-OHdG) levels in neurons
  (n = 10); (c) Western blot analysis of γH2A.X, TLR9, c-Fos, and NMDAR in neurons
  (n = 4), with β-Tubulin serving as the loading control; (d–g) Quantitative analysis
  of γH2A.X, TLR9, c-Fos, and NMDAR expression; (h) Quantitative analysis of 5-HT
  levels in neurons (n = 10); Compared with the control group, *** p < 0.001, ****
  p < 0.0001; “ns” indicates no statistically significant difference. Individual symbols
  (●) represent single samples within each group. Quantitative results were normalized,
  and data in bar graphs are presented as M ± SD
