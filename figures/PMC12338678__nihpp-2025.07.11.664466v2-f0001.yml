figure_title: Aging upregulates repetitive elements, including Alu transposons, in
  primary human fibroblasts
caption: '(A) A diagram illustrating the transcriptomic time course analysis carried
  out using a publicly-available mRNA-sequencing dataset (GSE113957) for N = 76 aging
  primary human fibroblasts. (B) Gene expression heatmap for significant (FDR < 0.05)
  differentially expressed repeat subfamilies across age. (C) Scatterplots for the
  library size-normalized counts across age for the total AluJb subfamily expression,
  the AluJb subfamily expression from intergenic loci within 5 kilobases from a gene,
  and the AluJb subfamily expression from loci overlapping gene exons. All three differential
  expression results were significant at an FDR < 0.05. Females are represented by
  pink dots, and males are represented by blue dots. Differential gene expression
  analysis across total endogenous AluJb expression was carried out, followed by gene
  set enrichment analysis, and the top 5 significant (FDR < 0.05) (D) GO Biological
  Process and (E) Reactome pathway gene sets were plotted. FDR: False Discovery Rate'
