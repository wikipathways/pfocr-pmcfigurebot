  among differentially expressed genes in U87MG-siTFAM (A) and A172-siTFAM (B) cells.'
caption: 'Enrichment analysis of RNA-seq from TFAM-silenced U87MG and A172 cell lines:
  (A,B) Dot plots showing top five Gene Ontology (GO) Biological Process terms among
  differentially expressed genes in U87MG-siTFAM (A) and A172-siTFAM (B) cells. Shapes
  indicate direction of regulation: triangles = upregulated processes; circles = downregulated
  processes. The color gradient reflects statistical significance (-log10 p-value;
  darker = more significant). Symbol size corresponds to the number of genes in each
  term. (C,D) Gene-pathway interaction networks for U87MG-siTFAM (C) and A172-siTFAM
  (D), illustrating connections between enriched GO terms and their associated genes.
  Node color represents z-score of expression; node size reflects adjusted p-value
  significance (larger = more significant); border width indicates magnitude of log2
  fold change. These networks highlight the interplay between upregulated and downregulated
  pathways, and identify central regulators driving transcriptional responses to TFAM
  silencing in each cell line'
