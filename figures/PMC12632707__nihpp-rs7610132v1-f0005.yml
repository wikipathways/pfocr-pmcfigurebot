figure_title: Environmental exposures induce shared KEGG pathway alterations in both
  blood and liver
caption: a)KEGG pathways enriched by exposure-responsive DEGs in both blood and liver
  across multiple exposures. Each circle represents a KEGG pathway enriched in either
  tissue, with colors indicating different exposures. Squares mark KEGG pathways enriched
  in both blood and liver. Red and blue lines trace KEGG pathways identified in female
  and male samples, respectively. b) Shared enrichment of the Coronavirus disease–COVID-19
  KEGG pathway in both blood and liver, observed across four distinct exposures. The
  left heatmap displays the log2fold-change of DEGs encoding ribosomal proteins in
  these exposures. The right panel shows the protein–protein interaction (PPI) network
  of non-ribosomal DEGs within the same KEGG pathway. Red and blue denote up- and
  down-regulated DEGs, respectively. Each row in the heatmap and each node in the
  network corresponds to a DEG. In the network diagram, the left half of each circle
  represents gene expression in the liver, and the right half represents blood, in
  response to exposure to BPA10mg in females, PM2.5-CHI in males, PM2.5-JHU in males,
  and As in females (top-down order)
