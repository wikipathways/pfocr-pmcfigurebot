figure_title: Single agent targeted therapy with heterogeneity within each tumor mass
caption: 'Tumor growth in part of the tumor is driven by the PDGFR pathway while tumor
  growth in other parts are dependent on FGFR pathway activation.A. Administration
  of a PDGFR inhibitor alone leads to tumor shrinkage in a portion of the tumor which
  appears as a radiographic response initially then progression.B. Administration
  of an FGFR inhibitor alone leads to tumor shrinkage in a portion of the tumor which
  appears as a radiographic response initially then progression.C. Simultaneous administration
  of a PDGFR and an FGFR inhibitor leads to tumor response throughout the tumor.Note:
  Depending on the tumor growth dynamics, inhibiting only one of the two pathways
  could result in initial response followed by progression as shown above, or in progression
  with no obvious response (if the inhibited pathway was not as critical a growth
  driver as the second pathway)'
