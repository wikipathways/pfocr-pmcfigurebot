caption: 'Auxin-related pathways in E. purpurea leaves in response to biochar amendment.
  Diagrams show auxin (a) biosynthesis, (b) transport, and (c) signal transduction.
  Gene expression heatmap (color bar: −4→0→4): Blue indicates low gene expression
  levels, while red indicates high expression levels (with 0 representing the baseline
  level); the colored blocks adjacent to the genes represent the relative expression
  levels of these genes across different samples. Abbreviations: ASA2, anthranilate
  synthase alpha 2; PAI, polyamide-imide; TIR1, transport inhibitor response 1; TSB1/2,
  tryptophan synthase beta 1/2; TAA1, tryptophan aminotransferase of Arabidopsis 1;
  YUC, YUCCA; GH3, Gretchen Hagen 3; ARF, auxin response factors; ILR1, IAA-leucine
  resistant 1; PIN, PIN-FORMED; AUX1, Auxin permease 1; PGP1, P-glycoprotein 1; PILS,
  PIN-LIKES; ABCB, ATP-binding cassette B; SAUR, small auxin up RNA'
