figure_title: Solute carrier family 25 member 33 (SLC25A33) knockdown and VDAC1-based
  inhibitory tool 4 (VBIT-4) treatment inhibit vascular smooth muscle cell (VSMC)
  proliferation and migration by suppressing the cytosolic mitochondrial DNA (mtDNA)-mediated
  cyclic GMP-AMP synthesis (cGAS)-stimulator of interferon genes (STING)-TANK-binding
  kinase 1 (TBK1)-nuclear factor kappa B (NF-κB) pathway.
caption: Solute carrier family 25 member 33 (SLC25A33) knockdown and VDAC1-based inhibitory
  tool 4 (VBIT-4) treatment inhibit vascular smooth muscle cell (VSMC) proliferation
  and migration by suppressing the cytosolic mitochondrial DNA (mtDNA)-mediated cyclic
  GMP-AMP synthesis (cGAS)-stimulator of interferon genes (STING)-TANK-binding kinase
  1 (TBK1)-nuclear factor kappa B (NF-κB) pathway. (A, B) Effect of SLC25A33 (A) or
  solute carrier family 25 member 36 (SLC25A36) (B) knockdown on the phosphorylation
  of TANK-binding kinase 1 (TBK1), p65, and interferon regulatory factor 3 (IRF3)
  in platelet-derived growth factor (PDGF)-treated VSMCs. (C, D) Effect of SLC25A33
  knockdown (C) or 2’,3’-dideoxycytidine (ddC) treatment (D) on voltage-dependent
  anion-selective channel 1 (VDAC1) oligomerization in PDGF-treated VSMCs. (E) Effect
  of VBIT-4 on the phosphorylation of TBK1, p65, and IRF3 in PDGF-treated VSMCs. (F,
  G) Representative images showing the effects of VBIT-4 on VSMC proliferation (F)
  and migration (G) (upper panel), with quantification of cell number, migration,
  and wound area (lower panel). (H) Effect of p65 knockdown on p65 protein expression
  in PDGF-treated VSMCs. (I, J) Representative images illustrating the effects of
  p65-targeting small interfering RNA (siRNA) on VSMC proliferation (I) and migration
  (J) (upper panel), with quantification of cell number, migration, and wound area
  (lower panel). Asterisks indicate nonspecific bands. siSLC25A33 and siSLC25A36 are
  referred to as siA33 and siA36, respectively. Data in the bar graphs represent the
  mean±standard error of the mean of three independent measurements. Scale bar=40
  μm. EGS, ethylene glycol bis; sc, scrambled. aP<0.05, bP<0.01, cP<0.001
