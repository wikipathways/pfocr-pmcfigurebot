figure_title: Alveolar macrophages are less inflammatory in smoke-treated A1KO mice.
caption: Alveolar macrophages are less inflammatory in smoke-treated A1KO mice. (A)
  Gene set enrichment analysis (GSEA) pathway analysis matched to the Kyoto Encyclopedia
  of Genes and Genomes enrichment category was performed on significant differentially
  expressed gene lists (DEGs) generated by comparing AMs from smoke-exposed WT versus
  Ant1 KO mice at 2- or 6-month timepoints (n = 3 mice per treatment group and timepoint,
  individually sequenced). Pathways significantly enriched in smoke-treated wildtype
  (WT) or Ant1 knockout (A1KO) mice are colored in dark blue and dark orange, respectively
  (false discovery rate [FDR] < 0.05), whereas nonsignificant pathways are in light
  blue and light orange, respectively (FDR > 0.05). Pathways significantly enriched
  in smoke-treated WT mice were primarily inflammatory pathways. Normalized enrichment
  scores (NES) were calculated by GSEA on fold-change ranked genes. (B) Genes in the
  “Toll-like receptor signaling pathway” are plotted for WT and Ant1 KO mice exposed
  to air or smoke for 2 or 6 months (n = 3 mice per treatment group and timepoint,
  individually sequenced). Circle size represents the percentage of cells expressing
  the gene, and color gradient represents the average expression in cells. (C) Pseudo-bulk
  GSEA was performed on DEGs from the alveolar macrophages of 2- and 6-month smoke-exposed
  WT and Ant1 KO mice. Enrichment plots for the proinflammatory MSigDB Hallmark pathways
  “IL6 JAK Stat3 Signaling” and “TNFa Signaling via NFKB” are depicted with NES and
  P values listed. (D) Reactive oxygen species levels in WT and Ant1 KO bone marrow–derived
  macrophages (BMDMs) in response to cigarette smoke extract (CSE) challenge were
  measured by MitoSOX (n = 8 wells per group). Data are shown as mean ± SEM. Statistics
  by two-way ANOVA with Tukey’s post hoc test. P values are noted. (E) Level of secreted
  IL6 was determined by ELISA in media collected from WT and Ant1 KO BMDMs treated
  with LPS (10 ng/ml) for 4 hours. Data are shown as mean ± SEM. Statistics by two-way
  ANOVA with Tukey’s post hoc test. P values are noted. (F) Quantitative PCR (qPCR)
  was performed on WT and Ant1 KO BMDMs treated with media (Ctrl) or CSE for 24 hours
  and probed for inflammatory markers IL1B, iNos, and TNF. Data are shown as mean
  ± SEM. Statistics by two-way ANOVA with Tukey’s post hoc test. P values are noted
