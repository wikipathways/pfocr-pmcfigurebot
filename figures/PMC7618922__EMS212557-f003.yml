figure_title: Schematic representation of proposed oxygen-sensing mechanisms in the
  hepatic lobule and their potential contribution to the zonated vulnerability of
  the pericentral region
caption: 'Zone 3 of the lobule represents the most hypoxic area, where hepatocytes
  preferentially perform lipogenesis rather than β-oxidation, the degree of lipid
  saturation is increased, and fibrotic lesions typically arise; all of which are
  key processes in MASLD pathogenesis. Further investigation of these oxygen-sensing
  pathways is required to clarify their location in the pericentral region and their
  role in the development of MASLD. Abbreviations: ADO, aminoethanethiol dioxygenase;
  FA, fatty acid; MASLD, metabolic dysfunction-associated steatotic liver disease;
  PNPO, pyridoxine 5′-phosphate oxidase. Figure created with BioRender'
