figure_title: Overview of altered metabolic pathways in OSCC and their therapeutic
  targeting.
caption: 'Overview of altered metabolic pathways in OSCC and their therapeutic targeting.
  The figure illustrates key metabolic processes supporting OSCC cell growth and survival,
  including glycolysis, PPP, the TCA cycle, and de novo lipogenesis. Glucose uptake
  via GLUT1 fuels glycolysis, with HK-II catalyzing the first step; inhibition by
  2-deoxyglucose disrupts this pathway. The PPP, regulated by G6PD, generates ribose-5-phosphate
  for nucleotide biosynthesis and is targeted by polydatin. The PI3K/AKT/mTOR/SREBP1
  signaling axis promotes de novo lipogenesis through upregulation of ACC and FASN,
  FASN can be inhibited by an agent such as orlistat, thereby reducing fatty acid
  synthesis, proliferation, and metastasis. Glutamine metabolism, mediated by ASCT2
  and glutaminases (GLS1/GLS2), feeds into the TCA cycle to support energy production
  and biosynthesis. Pharmacological inhibition at these metabolic nodes is highlighted
  as a strategy to suppress tumor growth and metastatic progression in OSCC. [Abbreviations:
  HK-II, hexokinase; 2-DG, 2-deoxyglucose; GLUTs, glucose transporters; G6PD, glucose-6-phosphate
  dehydrogenase; PPP, pentose phosphate pathway; 3PG, 3-phosphoglycerate; GA3P, glyceraldehyde-3-phosphate;
  DHAP, dihydroxyacetone phosphate; aKG, alpha ketoglutarate; TCA, tricarboxylic acid
  cycle; α-KGDH, alpha-ketoglutarate dehydrogenase; ACC, acetyl-CoA carboxylase; FASN,
  fatty acid synthase; GLS1, glutaminase 1 and GLS2, glutaminase 2]'
