figure_title: Plant–microorganism interactions mediated by signaling molecules and
  communication mechanisms.
caption: Plant–microorganism interactions mediated by signaling molecules and communication
  mechanisms. Plants release chemical compounds that influence microbial behavior
  in the rhizosphere through processes such as quorum sensing (QS) and antibiosis.
  In response, microorganisms produce specific signaling molecules, including AHLs
  and other chemical signals, which can induce plant resistance, modulate root development,
  and shape the surrounding microbiota. Additionally, quorum quenching (QQ) serves
  as a regulatory mechanism that degrades or interferes with QS signals, modulating
  inter-organism interactions and controlling processes such as virulence and microbial
  competition. Colored bars and spheres in the figure represent distinct signaling
  pathways and microbial interactions associated with QS, antibiosis, and QQ processes.
  Color coding is used to visually differentiate interactions and does not correspond
  to specific compounds or taxa
