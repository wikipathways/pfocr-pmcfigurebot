figure_title: Proposed apoptotic signaling pathways modulated by quinazolinedione
  derivatives in MCF-7 cells.
caption: Proposed apoptotic signaling pathways modulated by quinazolinedione derivatives
  in MCF-7 cells. The molecular pathways affected by compound 7 (yellow arrows) and
  compound 8 (purple arrows) are based on protein expression profiles obtained from
  the MILLIPLEX® Early Apoptosis 7-Plex Magnetic Bead Kit. Both compounds downregulate
  phosphorylated Akt (p-Akt), leading to reduced anti-apoptotic Bcl-2 activity and
  dephosphorylation of Bad, thereby promoting mitochondrial dysfunction and cytochrome
  c release. Activation of p53 and caspase-9 further supports intrinsic (mitochondrial)
  apoptosis. Compound 7 uniquely reduces phosphorylated JNK (p-JNK), while compound
  8 increases p53 levels. Arrows indicate pro-apoptotic pathways (red) or anti-apoptotic
  pathways (green). (Created by BioRender.com/Mahidol University) (Version 1.0.0.4)
