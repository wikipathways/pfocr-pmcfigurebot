caption: 'Swertiamarin attenuated 3-NPA-induced oxidative stress levels and enhanced
  NRF2/HO-1 pathway in mouse ovaries exposed to 3-NPA. (A) Detection of ROS levels
  in ovaries of different groups (n = 3). (B) Detection of MDA levels in ovaries (n
  = 3). (C) Relative mRNA levels of antioxidant genes Nrf2, Ho-1, Sod1, and Cat in
  ovaries of different groups (n = 3). (D) Protein expression of antioxidant proteins
  NRF2, HO-1, and SOD1 in ovaries of Control, NPA, and NPA + MSE groups (n = 3). (E)
  Optical density analysis of (D). (F) Immunostaining of HO-1 and SOD1 in ovarian
  sections (n = 3). Bar: 40 μm. * p < 0.05, ** p < 0.01. and *** p < 0.001; one-way
  ANOVA (with Tukey’s multiple comparisons test as the post-hoc test)'
