figure_title: Labeled glutamine metabolic flux in FXS neurons
caption: '(A) FXS and iControl neurons at week 4 of maturation were incubated in [13C5,
  15N2]-glutamine for 8 h before cell pellets and culture media were analyzed by LC-MS
  (see Table S2). Left: diagram of glutamine flux into the TCA cycle via oxidative
  or reductive pathways (blue labels), with filled circles indicating carbons derived
  from labeled [13C5, 15N2]-glutamine. Right: integration of peak area measurements
  of metabolites in FXS and iControl neurons, showing fractions of labeled glutamine-derived
  metabolites for each cell line. The percentage of enrichment of labeled extracellular
  Glu fractions is shown. Data are represented as the mean ± standard deviation (SD)
  of three replicates.(B) Glu and Gln levels as detected by LC-MS in the indicated
  samples. In each set, the FXS sample is normalized to either the TD or iControl
  set at 1 (dotted horizontal line).(C) Illustration of conversion of Gln to Glu by
  glutaminase (GLS) and the reverse catalyzed by glutamine synthetase (GLUL). Two
  GLS1 RNA isoforms, KGA and GAC, are shown on the bottom. Western blot data for the
  indicated samples for the GLS1 isoforms KGA and GAC and for GLUL relative to GAPDH
  are shown. The bottom image shows the quantification of RNA by RT-qPCR and protein
  levels by western blots for the indicated genes.All data are analyzed using an unpaired
  t test with Šídák’s multiple-comparisons testing (C) or a two-way ANOVA with multiple
  comparisons (A). Error bars represent the SD of three replicates. *p < 0.05, **p
  < 0.01, ***p < 0.001, and ****p < 0.0001.(D) Model depicting impaired Glu-Gln cycle
  in FXS due to changes in expression of the genes and metabolites in the pathway
  (from Figures 5, 6, and 7). Impaired Gln flux in week 4 FXS neurons may be due to
  a block in GLS1 via reduction of the high catalytic GAC isoform. The impact of these
  perturbations on FXS mitochondrial function is illustrated'
