figure_title: Multidimensional analysis of soil microbial KEGG pathway abundances,
  environmental factor associations, and community structure under different treatments.
caption: 'Multidimensional analysis of soil microbial KEGG pathway abundances, environmental
  factor associations, and community structure under different treatments. (A) Stacked
  bar plot of the relative abundances of KEGG functional pathways. Different colors
  represent distinct functional pathways. (B) Mantel correlation heatmap between KEGG
  pathways and environmental factors. In the heatmap, squares represent correlations
  among soil physicochemical properties: the size of each square reflects the significance
  level (larger squares indicate more significant correlations), while the color indicates
  the direction (positive/negative) and magnitude of the correlation. The color and
  thickness of lines represent the significance and strength of the associations between
  functional pathways and physicochemical properties. Significance levels are denoted
  by asterisks: * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001. (C) Venn
  diagram showing the number of genes assigned to KEGG pathways. (D) PCoA plot of
  KEGG functional pathways. (E) NMDS plot of KEGG functional pathways. The value at
  the top-right corner of the plot is the stress value. (F) RDA plot between KEGG
  pathways and environmental factors. Black arrows represent various soil physicochemical
  properties, and red arrows represent distinct KEGG functional pathways'
