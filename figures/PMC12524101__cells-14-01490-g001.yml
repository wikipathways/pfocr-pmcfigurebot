figure_title: The three main patterns of non-angiogenic tumours, observable both in
  primary tumours and metastases (A–C), and the generic scheme for angiogenic ones
  (D), also present in primary and metastatic lesions.
caption: 'The three main patterns of non-angiogenic tumours, observable both in primary
  tumours and metastases (A–C), and the generic scheme for angiogenic ones (D), also
  present in primary and metastatic lesions. (A) The main pattern in the lung is called
  Alveolar, because the neoplastic cells fill the alveoli, taking oxygen from the
  alveolar vessels. The alveolar walls are covered by type I pneumocytes. Over time,
  the pneumocytes can be eliminated by the neoplastic cells, which then come into
  direct contact with the vessels. (B) The pattern of co-option, called replacement,
  is present in the liver. The tumour cells take the place of, or “replace,” the hepatocytes.
  It is not yet clarified what happens to the displaced hepatocytes. There are two
  main opinions: one is that they undergo apoptosis, and the other is that they are
  “phagocytosed” by the advancing tumour cells. (C) In the brain, the neoplastic cells
  arrange themselves along the pre-existing vessels, advancing inside the extracellular
  neural matrix. In primary tumours, the cells move towards the vessel along a gradient
  of bradykinin produced by the endothelium. Primary tumour cells reaching the vessel
  can then “fuse” with the pericytes. Metastatic cells extravasate and are protected
  from neuroserpin, as this molecule inhibits plasminogen activator, which would otherwise
  cause apoptosis of the tumour cells via FasL. (D) Angiogenic tumours, regardless
  of the organ in which they originate, cause destruction of the original tissue,
  including the vessels. Having destroyed the tissue, the overgrowing neoplastic cells
  become hypoxic and trigger the traditional pathway of angiogenesis, leading to the
  formation of new vessels'
