figure_title: Single-cell transcriptomic profiling of CS-treated HSCs.
caption: Single-cell transcriptomic profiling of CS-treated HSCs. (A) Schematic workflow
  outlining the process of scRNA-seq (n = 3, each group), phenotypic characterization,
  and mechanistic validation following CS injection in aged mice. (B) UMAP visualization
  of LSK cells from aged and CS-treated aged mice, colored by group (top). UMAP visualization
  of LT-HSC, ST-HSC, and MPP subpopulations based on their transcriptional profiles
  (bottom). (C) Distribution of cell cycle phases (G1, S, and G2/M) across indicated
  HSC subsets, quantified via bar charts (chi-square test). (D) Pseudotime trajectory
  of HSCs from combined scRNA-seq data, colored by pseudotime. Pseudotime-ordered
  analysis of HSCs from the aged and CS-treated aged samples. (E) Heatmap showing
  dynamic changes of highly variable genes along the pseudotime (cataloged hierarchically
  into four gene modules). Adjusted p value < 0.05 was considered statistically significant
  for GO enrichment analysis. (F) Comparison of relative subsystem coverage between
  aged and CS-treated aged HSCs GEMs, based on scRNA-seq and RNA-seq data. (G) Heatmap
  of enriched pathways from RNA-seq (n = 3, each group). Differential pathway enrichment
  between CS-treated and control aged HSCs was determined via GSEA against the MSigDB
  collection (*P < 0.05, permutation test)
