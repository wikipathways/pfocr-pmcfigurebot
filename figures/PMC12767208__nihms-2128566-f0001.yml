figure_title: Single-agent copanlisib treatment results in significant response in
  multiple models of PIK3CA-mutant colorectal cancer.
caption: Single-agent copanlisib treatment results in significant response in multiple
  models of PIK3CA-mutant colorectal cancer. A, APPK MDCOs were treated for 48 hours
  with copanlisib (12.5–200 nmol/L), and a significant response was determined using
  change in diameter at the organoid level, three replicates. B, Representative Western
  blot images. C–E, Inhibition of the PI3K pathway was seen as early as 6 hours following
  treatment and was found to be inhibited to a greater extent with higher induction
  of apoptosis compared with a panel of PI3K pathway inhibitors (alpelisib, pictilisib,
  and sapanisertib; 200 nmol/L) with Western blot analysis (Student t test), three
  replicates. F and G, This was confirmed in vivo with treatment of APPK mice for
  8 days (10 mg/kg). H, Representative Western blot images of treated APPK tumors.
  I and J, Additionally, isogenic pair SW48 (PIK3CA WT) and SW48PK (PIK3CAH1047R/+)
  cells also responded to copanlisib even at single-nanomolar doses as assessed by
  a WST-1 proliferation assay, three replicates. *, P ≤ 0.05; **, P ≤ 0.01; ***, P
  ≤ 0.0001 (Wilcoxon rank-sum test). GΔ ≥1.25 indicates sensitive, GΔ ≤0.75 indicates
  resistance, and GΔ >0.75 and <1.25 indicate an intermediate response. p-AKT, phosphorylated
  AKT; p-RPS6, phosphorylated RPS6; NA, not applicable
