figure_title: Proposed mechanism for bicarbonate-acetone coupling via acetone carboxylase.
caption: 'Proposed mechanism for bicarbonate-acetone coupling via acetone carboxylase.
  Steps occurring at the Mn(II) site (α subunit) are depicted inside the circle. Steps
  occurring at the ATP-binding active site (β subunit) are in the area shaded tan.
  A red solid line indicates that the channel connecting the two sites is proposed
  to be closed, while the dashed green line indicates that it is open. In this model,
  ATP binding triggers E89 coordination to Mn(II). E89 coordination to Mn(II) controls
  channel opening, in turn. Species along the pathway include: (1) ligand-free AC
  (resting state) with a 5CN Mn(II) and closed interior channel; (2) three substrates
  bind, phosphoryl transfer follows, and the phosphorylated intermediates to migrate
  to a 6CN Mn(II); (3) the intermediates encounter species 2, displacing the E89 side
  chain, and closing the interior channel, and the Mn(II) remains 6CN; (4) departure
  of all products from 6CN Mn(II) in species 4 re-establishes the 5CN starting material'
