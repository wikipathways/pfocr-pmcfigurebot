caption: Simplified diagnostic and staging pathway for localized gastroesophageal
  cancer. This figure outlines the sequential steps in the diagnostic and staging
  process for localized gastroesophageal cancer, beginning with clinical presentation
  and proceeding through endoscopy with biopsy, imaging, and staging evaluations,
  multidisciplinary tumor board review, and treatment planning. Arrows indicate the
  recommended direction of workflow. Biomarker testing for HER2, PD-L1, and MSI-H/dMMR
  should be performed where indicated, and staging laparoscopy is recommended for
  gastric or gastroesophageal junction tumors
