figure_title: Immunopathogenesis of SS.
caption: 'Immunopathogenesis of SS. The development of SS in genetically predisposed
  individuals appears to be triggered by external stimuli (e.g., viral infections)
  that cause cellular apoptosis in the salivary glands, resulting in a massive release
  of antigens, including NIS, that are scavenged by the pDCs. The pDCs activate the
  cDCs, which present the antigens and activate naïve CD4+ and CD8+ T cells. The latter
  are responsible for direct cellular damage via the apoptotic pathway. CD4+ T cells
  may instead differentiate into Th1, Th2, Th17, Tfh and Treg cells. The B cells act
  as APCs by capturing the autoantigens released after apoptosis of the salivary gland
  epithelial cells, presenting them to the Tfh cells and differentiating into plasma
  cells that produce autoantibodies. Treg cells produce TGF-β1, which polarizes macrophages
  from a pro-inflammatory phenotype (M1) to an anti-inflammatory phenotype (M2) and
  stimulates fibrosis. Abbreviations: APC, antigen-presenting cell; BAFF, B-cell activating
  factor; CD, cluster of differentiation; cDC, classical dendritic cell; IFN, interferon;
  IL, interleukin; M-CSF, macrophage colony-stimulating factor; NIS, sodium-iodine
  symporter; pDC, plasmacytoid dendritic cell; Tfh, T follicular helper cell; TGF-β1,
  transforming growth factor-β1; Th, T helper cell; Treg, T regulatory cell. Created
  with BioRender.com'
