figure_title: Single-Cell Expression of Key Genes and Functional Enrichment Analysis
  in the Prefrontal Cortex of ASD.
caption: Single-Cell Expression of Key Genes and Functional Enrichment Analysis in
  the Prefrontal Cortex of ASD. (A–E) Visualization of the expression of five key
  genes (CCR2, CTNNB1, PTEN, AKT1, and mTOR) at the single-cell level. For each gene,
  the UMAP plots (left) display the spatial distribution of gene expression across
  all cell types in control and ASD samples (higher expression shown with more intense
  red). The violin plots (right) compare the overall expression levels of each gene
  between control (blue) and ASD (red) groups. (F) GO enrichment analysis of differentially
  expressed genes between ASD and control samples (Top 30 terms). (G) KEGG pathway
  enrichment analysis of differentially expressed genes between ASD and control samples
  (Top 30 pathways). * p < 0.05, ** p < 0.01
