figure_title: Changes in MAPK, AKT, and STAT signaling pathways are present during
  infection
caption: (A) qRT-PCR analysis of gene transcripts associated with the EGFR signaling
  pathway at 180 dpi. Each dot is an individual infection for which 4 organoids were
  sampled and averaged, shown relative to the NBH control. (B) qRT-PCR analysis of
  gene transcripts associated with MAPK, AKT, and STAT signaling at 180 dpi. Each
  dot is an individual infection for which 4 organoids were sampled and averaged,
  shown relative to the NBH control. (C) Bioplex detection of phosphorylated signaling
  proteins at 90 (n = 3) and 180 (n = 6) dpi relative to the respective time point
  NBH control. Shown are the mean and standard deviation, lines/colors indicate the
  same infection sampled at each time point. *P < 0.05, **P < 0.01, student’s t test
  (A and B), 2-way ANOVA with Dunnett’s secondary test (C, colors indicate the significant
  infections). NBH controls are indicated by the dotted lines
