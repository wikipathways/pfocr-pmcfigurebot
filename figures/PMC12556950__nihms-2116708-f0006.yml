figure_title: Characterization of the club lineage cell populations.
caption: Characterization of the club lineage cell populations. (A) UMAP plot of the
  2,469 nuclei from subset club lineage cluster of the human adenoids (dim. = 11,
  res. = 0.9). (B) Dot plot of the average expression of top DEGs for each nucleus
  cluster in this lineage. (C) Trajectory analysis with Monocle 3 of the clusters
  identified in this lineage. The black line represents the trajectory identified
  by the pipeline. (D) Nucleus clusters organized by pseudotime setting as root node
  the one specified in the Sup. Fig2B. The black bar inside each box represents the
  median value of the data. (E) Percentage of maximum expression of a representative
  DEG of each cluster through the differentiation pathway. (F) Club cell lineage hierarchy
  obtained from the analysis of the DEG and trajectory results
article_title: Single cell transcriptional analysis of human adenoids identifies molecular
