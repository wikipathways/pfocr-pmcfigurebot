figure_title: Temperature regulates the expression of hundreds of distinct genes in
  P. aeruginosa at both exponential and stationary phases
caption: A) Diagram of experimental setup for RNA-seq of P. aeruginosa PAO1 grown
  at two temperatures and sampled at two growth phases. PAO1 was grown overnight at
  37°C and then subcultured in parallel at 37°C and 25°C. At exponential phase, RNA
  was extracted from ~109 cells and the populations allowed to continue growing until
  stationary phase, when RNA was extracted again from the same number of cells. RNA
  was then sequenced on an Illumina NextSeq2000. Created with BioRender.com. B, C)
  Volcano plots showing the thermoregulation of PAO1 transcripts at exponential phase
  (B) and stationary phase (C). Differential gene expression analysis (DESeq2) was
  used to compare gene expression at 37°C to 25°C. Transcripts with an absolute value
  of fold change greater than 2 (vertical dashed lines) and an adjusted p-value <
  0.05 (horizontal dashed line) were considered thermoregulated, with transcripts
  upregulated at 37°C represented by red points and transcripts upregulated at 25°C
  represented by blue points. Transcripts that did not change by an absolute value
  of fold change greater than 2 or were not statistically significant (adjusted p-value
  > 0.05) are depicted in gray. Genes of interest are annotated. D, E) Metabolic pathways
  significantly enriched (adjusted p-value < 0.05) at exponential phase (D) and stationary
  phase (E) at 25°C (left panel for each D and E) and 37°C (right panel for each D
  and E). Enrichment was determined by gene set enrichment analysis using KEGG metabolic
  pathways for P. aeruginosa. F) The fold thermoregulation (expression at 37°C/25°C)
  of statistically significant transcripts was plotted at exponential phase (x-axis)
  versus stationary phase (y-axis). Transcripts are colored according to how growth
  phase affected thermoregulation, with genes of interest annotated. Linear regression
  with 95% confidence intervals is shown. G) Venn diagram showing at which growth
  phase (exponential, stationary, or both) statistically significant transcripts were
  thermoregulated
article_title: The interplay between temperature and growth phase shapes the transcriptional
