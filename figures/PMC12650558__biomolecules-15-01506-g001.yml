figure_title: The NKG2D Receptor Complex and Species-Specific Signaling Pathways.
caption: 'The NKG2D Receptor Complex and Species-Specific Signaling Pathways. The
  NKG2D activating receptor recognizes a diverse family of stress-induced ligands
  (e.g., MICA/B, ULBPs, RAE-1, H60, MULT1) presented on target cells. NKG2D associates
  with different signaling adapter proteins in a species-specific manner: it couples
  exclusively with DAP10 in humans but can associate with both DAP10 and DAP12 in
  mice. Engagement of the NKG2D-DAP10 complex recruits the GRB2-VAV1 complex and the
  p85 subunit of PI3K [15]. This signaling axis promotes cell survival, proliferation,
  and cytokine production. In mice, the NKG2D-DAP12 complex signals through the Syk
  and ZAP70 tyrosine kinases [15]. This pathway potently activates the cytotoxic response.
  The integration of signals from these distinct pathways leads to the full activation
  of NK cells, enabling them to eliminate stressed, infected, or transformed target
  cells. Created with BioGDP.com [16]'
