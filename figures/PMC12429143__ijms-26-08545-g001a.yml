figure_title: Network pharmacology analysis of TCM active constituents (VT, PM, AVF,
  EF) and their interactions with AD-related targets.
caption: 'Network pharmacology analysis of TCM active constituents (VT, PM, AVF, EF)
  and their interactions with AD-related targets. (A) Venn diagram analysis showing
  the overlap and cross-talk between target genes of VT, PM, AVF, EF, and AD. (B)
  Network topology diagram illustrating the relationships between TCM active ingredients
  (VT, PM, AVF, EF) and AD molecular targets. Blue ovals represent AD-related molecular
  targets, red triangles represent diseases, green diamonds represent the four TCM
  compounds (VT, PM, AVF, EF), orange rectangles represent active ingredients, and
  connecting lines represent interactions between TCM active ingredients and their
  molecular targets. The network demonstrates the multi-target therapeutic potential
  of the TCM compounds against AD. (C) Protein–protein interaction (PPI) network data
  retrieved from the STRING database, showing detailed molecular interactions among
  the identified targets. (D) Constructed PPI network for the combined targets of
  VT, PM, AVF, EF, and AD. Node size and color corresponds to degree centrality (DC)
  values, with larger and blue color nodes indicating higher connectivity. Edges represent
  interactions between molecular targets. (E) Bubble chart showing Gene Ontology (GO)
  functional enrichment analysis of core targets for VT, PM, AVF, EF, and AD. The
  x-axis represents the number of enriched genes, the y-axis lists the functional
  categories, bubble size indicates enrichment significance, and color intensity represents
  the degree of enrichment (redder colors indicate higher enrichment and lower p-values).
  (F) Bubble chart displaying KEGG pathway enrichment analysis of core targets for
  VT, PM, AVF, EF, and AD. Red-highlighted pathways represent critical molecular targets
  for the anti-AD therapeutic effects of VT, PM, AVF, and EF. The x-axis shows the
  number of enriched genes, the y-axis lists pathway names, and bubble characteristics
  (size and color) indicate enrichment significance and degree (larger, redder bubbles
  represent higher enrichment and lower p-values). Network pharmacology analysis was
  performed using Cytoscape 3.8.2 (http://www.cytoscape.org; 12 August 2024). KEGG
  pathway analysis was conducted using the KEGG database from Kanehisa Laboratories,
  Kyoto University, Japan (https://www.kegg.jp/; 21 August 2024). Abbreviations: AD,
  Alzheimer’s disease; AVF, Apocyni Veneti Folium; DC, degree centrality; EF, Eucommiae
  folium; GO, Gene Ontology; KEGG, Kyoto Encyclopedia of Genes and Genomes; PM, Plantago
  major; PPI, protein–protein interaction; STRING, Search Tool for the Retrieval of
  Interacting Genes/Proteins; TCM, traditional Chinese medicine; VT, Vitex trifolia'
