figure_title: A working model of ARHGEF12 mutation promotes gastric cancer ovarian
  metastasis.
caption: A working model of ARHGEF12 mutation promotes gastric cancer ovarian metastasis.
  In gastric cancer cells, ARHGEF12 mutation activates GTPases, including RhoA and
  Rap1A. RhoA-GTP promotes actin cytoskeleton organization, thereby enhancing migration
  ability of cancer cells. Rap1A-GTP upregulates integrin gene expression through
  Rap1 signaling pathway. Tumor-derived exosomes enriched with ITGA6 and ITGB2 proteins
  are predominantly uptaken by ovarian normal fibroblasts. These exosome-educated
  fibroblasts transform into cancer-associated fibroblasts, which promote metastasis
  tumor cell proliferation, thereby initiating the early stage of pre-metastatic niche
  formation
article_title: Comprehensive exome profiling identifies ARHGEF12 mutation as a driver
  in gastric cancer with ovarian metastasis
