figure_title: Hypoxia-induced tRNA-Asp-GTC-3’tDR enhances autophagic flux
caption: (A) Volcano plot shows significantly regulated tDRs in HEK cells upon hypoxia
  treatment, with the top 2 significantly upregulated tDRs labeled. (B) Northern blotting
  validates the upregulation of 5’tDR and 3’tDR of tRNA-Asp-GTC in HEK cells upon
  hypoxia. (C) Schematic illustration of tDR biogenesis reporter design. BHQ1, black
  hole quencher 1; FITC, fluorescein. (D) Live imaging of fluorescent signals from
  the tRNA-Asp-GTC-3’tDR biogenesis reporter in HEK cells with or without hypoxia
  treatment. (E) Quantification of FITC-positive signals per cell from D. (F) Immunoblot
  analysis of different protein markers involved in ER stress, mitophagy, and autophagy
  pathways in HEK cells transfected with control (Ctrl) and tRNA-Asp-GTC-5’tDR and
  tRNA-Asp-GTC-3’tDR mimics. (G) Quantification of protein levels in F. (H) Live imaging
  of fluorescent signals in RFP-GFP-LC3B autophagy reporter HEK cells transfected
  with Ctrl or tRNA-Asp-GTC-3’tDR mimics. (I) Quantification of the number of autophagosomes
  (GFP+ & RFP+) and autolysosomes (GFP− & RFP+) per cell in H. (J) Immunoblot analysis
  of autophagic protein levels in HEK cells transfected with Ctrl or tRNA-Asp-GTC-3’tDR
  mimics and treated with DMSO or Bafilomycin A1 (BafA1) for 6 hours. (K) Quantification
  of protein levels in J. Data are shown as means ± SEM of at least three independent
  experiments. The Mann-Whitney test was used in (E) and (I). The unpaired two-tailed
  Student’s t-test was used in (G) and (K). *p < 0.05, **p < 0.01, ***p < 0.001. Scale
  bar 50μm
article_title: A hypoxia-responsive tRNA-derived small RNA confers renal protection
