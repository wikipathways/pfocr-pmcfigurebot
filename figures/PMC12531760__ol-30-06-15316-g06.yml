figure_title: Differential expression and functional enrichment analysis of FBXL22-associated
  genes in prostate cancer.
caption: Differential expression and functional enrichment analysis of FBXL22-associated
  genes in prostate cancer. (A) Volcano plot illustrating differential expression
  analysis between high-FBXL22 and low-FBXL22 expression groups in PCa, which highlights
  the genes that were significantly upregulated or downregulated in association with
  FBXL22 expression levels. The results of KEGG and GO enrichment analysis are depicted
  using (B) heat map and (C) Enrichment Map Analysis Platform, respectively. (D) The
  analysis of GO/KEGG combined log(fold change) is represented by a chordal diagram.
  The mountain maps display the pathways (E) significantly negative or (F) significantly
  positive associated with expression levels of FBXL22 in GSEA analysis results. Error
  bars represent standard deviation. FBXL22, F-box and leucine rich repeat protein
  22; PCa, prostate cancer; KEGG, Kyoto Encyclopedia of Genes and Genomes; GO, Gene
  Ontology; GSEA, Gene Set Enrichment Analysis; E2F, E2 DNA-binding factor; PLK1,
  polo-like kinase 1; NES, nuclear export sequence; FDR, false discovery rate; BP,
  biological process; CC, cellular component; MF, molecular function
