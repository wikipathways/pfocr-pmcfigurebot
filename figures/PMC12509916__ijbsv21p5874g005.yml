figure_title: TPL2 was involved in the regulation of HIF1α/PPARδ pathway.
caption: TPL2 was involved in the regulation of HIF1α/PPARδ pathway. 5A. Dual-luciferase
  reporter assays were performed in SCM1/shTPL2 cells with eight typical signaling
  pathway reporter systems as indicated (n = 6). *p < 0.05. 5B. Dual-luciferase reporter
  assays were presented in MKN45/shTPL2 cells with eight typical signaling pathway
  reporter systems as indicated (n = 6). *p < 0.05. 5C. Dual-luciferase reporter assay
  for HIF1α/PPARδ pathway in AGS/ovTPL2 cells after hypoxia treatment (n = 6). *p
  < 0.05. 5D. Dual-luciferase reporter assay for HIF1α/PPARδ axis in N87/ovTPL2 cells
  after hypoxia exposure (n = 6). *p < 0.05. 5E. Expression pattern of input genes
  (MAP3K8, HIF1A, PPARD, BCL2, MYC, CCND1, ABCB1, ABCC1, CD44) in gastric cancer adenocarcinoma.
  5F. Relative mRNA expression of BCL2, c-MYC, Cyclin D1, ABCB1, ABCC1 and CD44 in
  AGS/ovTPL2 cells by RT-qPCR (n = 6). *p < 0.05. 5G. Relative mRNA expression of
  BCL2, c-MYC, Cyclin D1, ABCB1, ABCC1 and CD44 in N87/ovTPL2 cells by RT-qPCR (n
  = 6). *p < 0.05. 5H. GSEA analysis comparing the gene sets of hypoxia pathway with
  TPL2 expression. Data were obtained from TCGA database. I. GSEA analysis (GSE2865)
  comparing the gene sets of peroxisome pathway with TPL2 expression. Data were obtained
  from TCGA database
