figure_title: Schematic representation of the antitumor mechanisms of melatonin across
  different types of cancer.
caption: Schematic representation of the antitumor mechanisms of melatonin across
  different types of cancer. In head and neck squamous cell carcinoma (HNSCC), melatonin
  enhances the infiltration of cytotoxic CD8+ T lymphocytes and suppresses epithelial-to-mesenchymal
  transition (EMT). In ovarian cancer, melatonin attenuates the Warburg effect by
  restoring metabolic flux toward acetyl-CoA and enhancing tricarboxylic acid (TCA)
  cycle activity, thereby improving cellular bioenergetic efficiency. In the pancreatic
  cancer cell line PANC-1, melatonin increases markers of cell death. In hepatocellular
  carcinoma, melatonin downregulates PD-L1 expression in tumor cells, preventing T
  cell inhibition mediated by the PD-1/PD-L1 pathway. In breast cancer, its anti-angiogenic
  effects restrict nutrient and oxygen supply to the tumor microenvironment, thereby
  strengthening its overall antineoplastic potential. Created in BioRender. Garcia-Macia,
  M. (14/11/2024) https://BioRender.com/v72fvv9 (accessed on 27 December 2025)
