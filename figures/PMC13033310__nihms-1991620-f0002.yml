figure_title: PA14 can utilize the PPP and its phosphoketolase to catabolize glucose
  to acetate.
caption: PA14 can utilize the PPP and its phosphoketolase to catabolize glucose to
  acetate. (A) Abridged central carbon metabolism diagram of PA14 showing initial
  incorporation/assimilation of 1-13C1-glucose to acetate either via the EDP (glucose
  → 6P-gluconate → G3P + pyruvate) and lower EMPP (G3P → pyruvate → acetate) or via
  the PPP (glucose → glucose 6-P → fructose 6-P → X5P) and Xfp activity (X5P → G3P
  + acetyl-P → acetate). Acetate via the EDP and lower EMPP would be unlabeled while
  acetate via the PPP and Xfp could be labelled in the first position. Red dots represent
  13C label. Black boxes = carbon from the 4,5,6 C atoms of 6P-gluconate. Red boxes
  = carbon from X5P.(B) Percent of 13C labelled acetate in the parent strain and xfp
  mutant during of anaerobic survival on 20 mM 1-13C1-glucose. (C) Relative abundance
  of acetate in the xfp mutant by day 3 of anaerobic survival on 20 mM glucose, normalized
  to the parent strain. (B,C) Points show individual biological replicates, n = 3.
  Grey = Δphz, blue = ΔphzΔxfp. (B) Bars show means of each group. (C) Bar shows mean
  of ΔphzΔxfp metabolite intensities normalized to the mean of Δphz levels. (A) PPP
  = pentose-phosphate pathway. DHAP = dihydroxyacetone phosphate. G3P = glyceraldehyde-3-phosphate.
  PEP = phosphoenolpyruvate. E4P = erythrose-4-phosphate. F6P = fructose-6-phosphate.
  X5P = xylulose-5-phosphate. R5P = ribose-5-phosphate. S7P = sedoheptulose-7-phosphate
