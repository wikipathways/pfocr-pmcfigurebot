figure_title: Chemical structures, predicted target class distribution, and network-based
  analysis of major Mentha spicata essential oil constituents.
caption: Chemical structures, predicted target class distribution, and network-based
  analysis of major Mentha spicata essential oil constituents. Chemical structures
  of carvone, limonene, and α-pinene are shown alongside the distribution of predicted
  target protein classes derived from SwissTargetPrediction analysis. Target prediction
  was performed for Rattus norvegicus. The workflow illustrates the integration of
  target prediction, STRING-based protein–protein interaction (PPI) network construction,
  Reactome pathway enrichment analysis, and hub protein identification using CytoHubba.
  Color coding for chemical structures follows standard CPK rules, where red indicates
  oxygen atoms
