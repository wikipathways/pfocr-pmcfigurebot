figure_title: Chk1 promotes faithful chromosome segregation through Aurora B and CDK1
caption: (A) Percentage of mitotic U2OS cells undergoing anaphase with lagging chromosome
  after treatment with either DMSO, Chk1i (CHIR-124), or 0.5 μM CDK1i (RO-3306).(B)
  Percentage of mitotic HeLa cells undergoing anaphase with lagging chromosomes treated
  as in (A).(C) Representative images of mitotic U2OS anaphase cells treated with
  Chk1i.(D) Immunofluorescence quantification of p-H3 S28 (left) and p-H3 S10 (right)
  of U2OS cells that were treated with STLC for 4 h and subsequently treated with
  DMSO, Chk1i (CHIR-124), or low-dose CDK1i (RO-3306) for 1 h. Representative images
  of quantifications are shown on the right.(E) Quantification (left) and representative
  image (right) of the total p-INCENP T59 intensity along the chromosome in U2OS cells
  treated as in (A). Scale bars = 5 μm.(F) Schematic of our working model for the
  rewired Chk1-CDK1 pathway in mitosis. The ATR-Chk1 pathway inhibits Myt1 activity
  through Chk1’s direct phosphorylation of S143 on Myt1, decreasing its kinase activity
  and consequently decreasing p-CDK1 T14 and p-CDK1 Y15 levels on CDK1. This results
  in increased CDK1 activity, which promotes faithful chromosome segregation through
  the Aurora B kinase and the error correction machinery. For all the western blot
  quantifications, the fold change for each replicate was normalized to the DMSO-treated
  control. For immunofluorescence imaging quantifications, each data point for each
  replicate was divided by the mean integrated density of the DMSO-treated control.
  Statistical testing was performed on the mean integrated densities for each replicate.
  n = 3 biological replicates for all experiments. Error bars in all panels represent
  SD. *p ≤ 0.05 by one-way ANOVA with Tukey’s correction (B-D). Scale bars = 10 μm,
  unless indicated otherwise. See also Figure S6
