figure_title: Functional role of STXBP1 in endothelial cells.
caption: Functional role of STXBP1 in endothelial cells. (A) Violin plots showing
  STXBP1 expression across major cell types. (B) Comparison of STXBP1 expression in
  endothelial cells between UC and HC groups. (C) t-SNE plot of endothelial cells
  colored by STXBP1 expression level (high vs. low, grouped by median expression).
  (D) Violin plots showing the expression levels of differentially expressed genes
  between STXBP1-high and STXBP1-low endothelial cells. (E) Hallmark pathway enrichment
  analysis in STXBP1-high vs. STXBP1-low endothelial cells. (F) Results of cell trajectory
  and pseudotime analysis of STXBP1 high- and low-expression groups in endothelial
  cells. ** p < 0.01, *** p < 0.001, **** p < 0.0001; ns, not significant
