figure_title: Roles of PPARγ and PPARα in BCa.
caption: Roles of PPARγ and PPARα in BCa. (a) The formation of the PPARγ heterodimer
  with RxRa (S427/Y) regulates the tumor microenvironment by inhibiting the expression
  of inflammatory cytokines, leading to a state of immune evasion. (b) PPARγ point
  mutants transform cells into PPARγ-dependent cells by activating the pathway without
  the need for a ligand. (c) PPARγ transcriptionally activates the VEGF promoter via
  an indirect mechanism. (d) Through the microRNA miR30a-3p, the lncRNA UCA1 increases
  the expression of PPARα, which accumulates lipids that prevent epirubicin-induced
  apoptosis. Solid straight arrows indicate activation, dashed black and blue arrows
  indicate indirect activation, up black and red arrows indicate increased expression,
  red arrows represents inhibition process. Figure created with BioRender.com (accessed
  on 1 May 2025)
