  groups. (C) For upregulated genes, 188 are shared between two groups, while 510
  are unique to StromalScore and 689 to ImmuneScore. (D) For downregulated genes,
  156 are common to both, with 431 exclusive to StromalScore and 91 to ImmuneScore.
  (E,F) GO and KEGG pathway enrichment analysis of 344 DEGs, with a significance threshold
