figure_title: Nitrite-induced dopamine-dependent α-syn aggregation in enteroendocrine
  cells (EECs) is reduced in the presence of an inhibitor of dopamine biosynthesis
caption: '(A) Putative dopamine biosynthesis pathway within EECs. (B) Representative
  images of fixed STC-1 cells incubated for 24 h with 50 mM nitrate, 50 mM nitrite,
  and/or 0.01 mM benserazide (Benz), probed with anti-α-syn aggregate primary antibody
  MJFR-14. α-Syn aggregate signal is in green, and DAPI-stained nuclei are in blue.
  (C) Mean fluorescence intensity per cell was quantified from maximum intensity projections
  acquired by structured illumination microscopy (n = 3 independent biological replicates,
  3–4 technical replicates for each, bars denote mean ± S.E.M.; significance determined
  by one-way ANOVA with Sidak’s multiple comparison test, ****: P < 0.0001, ***: P
  = 0.0002)'
