figure_title: Diagram of Unfolded Protein Response (UPR)-mediated signaling in tumor
  cells, highlighting how IRE1 (inositol-requiring enzyme 1), PERK (double-stranded
  RNA-activated protein kinase (PKR)–like ER kinase), and ATF6 (activating transcription
  factor 6) pathways facilitate cancer survival, progression and resistance to treatment.
caption: 'Diagram of Unfolded Protein Response (UPR)-mediated signaling in tumor cells,
  highlighting how IRE1 (inositol-requiring enzyme 1), PERK (double-stranded RNA-activated
  protein kinase (PKR)–like ER kinase), and ATF6 (activating transcription factor
  6) pathways facilitate cancer survival, progression and resistance to treatment.
  XBP1s (X-box binding protein 1 spliced) upregulates SCD1 (stearoyl-CoA desaturase
  1), to prevent lipotoxic stress, stimulates the hexosamine biosynthetic pathway
  (HBP) to support survival under starvation, and cooperates with HIF1α (hypoxia inducible-factor
  1 alpha) to sustain cell survival under hypoxia. Regulated IRE1-dependent decay
  (RIDD) aids adaptation to nutrient deprivation, while ATF6 upregulates PLA2G4A (cytosolic
  phospholipase A2)-mediated arachidonic acid metabolism, to promote resistance to
  ferroptotic cell death. During invasion and metastasis, PERK drives epithelial–mesenchymal
  transition (EMT) and metastasis through cytoskeletal remodeling, while XBP1s induces
  EMT by downregulating E-cadherin and upregulating N-cadherin and upregulates MMP9
  to support extracellular matrix remodeling and invasion. Moreover, IRE1 directly
  interacts with filamin A to enhance invasiveness. To promote angiogenesis, ATF4
  (activating transcription factor 4), XBP1s and ATF6 upregulate VEGF-A, while IRE1
  augments IL6 (interleukin 6) and IL8 (interleukin 8) expression. Chemoresistance
  involves all three branches: PERK promotes multidrug resistance, while XBP1s enhances
  drug efflux via ABCB1 (ABC subfamily B member 1), ABCC1 (alias, MRP1, multidrug
  resistance-associated protein 1—through SREBP1 (sterol regulatory element-binding
  protein 1)) and ABCG2 (ABC subfamily G member 2). AFT6 contributes to radio- and
  chemoresistance, while BiP (binding immunoglobulin protein) drives chemoresistance
  by regulating fatty acid synthesis, mitochondrial transportation and oxidation.
  Finally, UPR activation fosters immune evasion, as XBP1s drives a tolerogenic tumor
  microenvironment via cholesterol-rich small extracellular vesicles, while transmissible
  ER stress (TERS) reprograms myeloid dendritic cells and macrophages to produce tumorigenic
  and pro-inflammatory cytokines and suppress T-cell responses'
article_title: 'The Unfolded Protein Response in Sarcomas: From Proteostasis to Therapy
  Resistance'
