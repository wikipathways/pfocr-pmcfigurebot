figure_title: Palmitic acid inhibits LOX maturation in HASMCs and aortas
caption: 'A, Two-sample mendelian randomization to detect the causal effects of TG
  on circulating total fatty acid, palmitic acid (PA, 16:0), stearic acid (18:0),
  palmitoleic acid (16:1n-7), and oleic acid (18:1n-9) levels. B, Untargeted metabolomics
  was applied to measure the ethyl palmitate levels in plasma from 14–18-week-old
  male hAPOC3 Tg (heterozygous) mice (n = 7) and littermate controls (n = 7). C-H,
  Human aortic smooth muscle cells (HASMCs) were starved in OptiMEM-reduced serum
  medium for 24 hours, followed by incubation with palmitic acid (250 μM; PA) or vehicle
  (BSA) for another 24 hours. Total RNA was extracted for RNA sequencing (n = 3/group)
  or qRT-PCR. C, Reactome pathway enrichment analysis of down-regulated genes in the
  PA group. Dot size represents the number of downregulated genes associated with
  each Reactome pathway. Dot color indicates the statistical significance, shown as
  the Benjamini–Hochberg adjusted p-value derived from over-representation analysis
  using the hypergeometric test. The gene ratio is defined as the number of downregulated
  genes annotated to a given pathway divided by the total number of downregulated
  genes analyzed. D, Top 5 downregulated Reactome pathways identified from Gene Set
  Enrichment Analysis (GSEA). The GSEA enrichment plot shows whether a gene set (pathway)
  is concentrated at the top or bottom of a ranked gene list. Each line represents
  the running enrichment score, with a peak on the right indicating enrichment in
  downregulated genes. Vertical bars mark the positions of the gene set within the
  ranked list. The bottom displays the ranking metric (log2 Fold change). E, Heatmap
  of gene expression levels involved in elastic fiber formation and maturation. Color
  represents the Z-score of each gene’s expression, with red indicating higher and
  blue indicating lower expression relative to the gene’s mean across samples. qRT-PCR
  analysis of LOX (F) and BMP1 (H) (n = 8/group, data from 4 independent experiments).
  G, LOX activity in the conditioned medium (n = 6/group, data from 2 independent
  experimennts). I, Correlation between liver APOC3 expression level and aortic BMP1
  expression level among 131 donors in the GTEx project. Correlation coefficient was
  calculated using Pearson’s method. The fitted lines represent the linear regression,
  with shaded bands indicating the 95% confidence intervals.J-K, HASMCs were starved
  in OptiMEM for 24 hours, then incubated with PA (250 μM) or vehicle along with TGF-β
  (10 ng/ml) or vehicle for another 24 hours; Or, HASMCs were transfected with adenovirus
  GFP or LOX (30 MOI) for 6 hours in a growth medium, then starved in OptiMEM for
  another 24 hours. Cells were incubated with PA (250 μM) or vehicle for an additional
  24 hours. Conditioned medium was collected for Western blot analysis. Cell total
  DNA was used for normalization. J, Representative Western blot image of mature LOX
  in conditioned medium (n = 5/group). K, Quantification analysis of mature LOX protein
  abundance (n = 5/group). L-M, HASMC were transfected with siBMP1 at 1 nM or siCtr
  with RNAimax for 6 hours in OptiMEM-reduced serum medium, then transfected with
  adenovirus GFP or LOX (30 MOI) for another 23 hours in OptiMEM-reduced serum medium.
  The conditioned medium was used for Western blot analysis, and whole cells were
  used for RNA extraction or DNA extraction. L, qRT-PCR analysis of BMP1 (n = 4/group).
  M, Representative LOX expression in conditioned medium (upper) and quantification
  analysis (bottom, n = 6/group). N, Eight-week-old male C57BL/6J mice were given
  saline, vehicle, or ethyl palmitate (600 mg/kg) for 5 consecutive days via intraperitoneal
  injection. On day 6, mice were euthanized, suprarenal abdominal aortas were isolated,
  and total protein was extracted and analyzed by Western blot to detect LOX abundance
  in suprarenal abdominal aortas, with corresponding quantifications for mature LOX
  (n = 5/group). O, Twelve- to 16-week-old hAPOC3 Tg mice and littermate control mice
  were infused with saline or AngII (1,000 ng/kg/min) for 7 days. On day 8, mice were
  euthanized, suprarenal abdominal aortas were isolated, and total protein was extracted
  and analyzed by Western blot to detect LOX expression in suprarenal abdominal aortas,
  with corresponding quantifications for mature LOX (n = 3 or 4/genotyping/treatment).
  P, Fourteen- to 20-week-old hAPOC3 Tg mice and littermate control mice were infused
  with saline or AngII (1,000 ng/kg/min) for 7 days. On day 8, mice were euthanized,
  suprarenal abdominal aortas were isolated, and LOX activity was measured (n = 4–6/genotyping/treatment).
  Data are presented as dots and Mean ± SEM (B, F-H, K-P). Statistical analyses were
  conducted as follows: Student’s t-test for B, F-H; Mann-Whitney U test followed
  by Bonferroni correction for K, M; Two-way ANOVA followed by Sidak post hoc analysis
  for L, P; One-way ANOVA followed by Sidak post hoc analysis for N'
