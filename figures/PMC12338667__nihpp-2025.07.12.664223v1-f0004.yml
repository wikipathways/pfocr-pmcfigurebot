figure_title: 10Hz AV flicker mitigates stress-induced transcriptional changes in
  neurons
caption: (A) Volcano plot showing differential gene expression of cortical neurons
  in stressed males following 10Hz AV flicker compared to stress no stimulation (threshold
  set. log2fc>1 and p<0.05). Genes involved in the regulation of stress signaling
  are highlighted in bold. (B) Gene ontology (GO) enrichment analysis for genes downregulated
  (blue) and upregulated (red) after 10Hz AV flicker exposure in stressed males compared
  to no stimulation stressed males. (C) Venn diagram demonstrating unique and shared
  (pink) modifiable enriched genes associated with stress following 10Hz (blue) AV
  flicker compared to 40Hz (green) AV flicker. (D) and (E) as in A and B for 40Hz
  AV flicker exposure in stressed males compared to no stimulation stressed males.
  (F) Enrichment scores for specific biological processes (i.e. stress response and
  synaptic signaling) in stressed male mice under different flicker exposure conditions.
  Box plots show the distribution of scores across samples (median ± Interquartile
  range; n = 3 pooled samples from 6 animals per group). Transcriptional profile at
  gene expression level without FDR adjustment p<0.05, Wald test. GO terms pathway
  analysis FDR-adjusted, p < 0.05. See Supplemental Table 11 for statistical details
