  pathway enrichments for the up- and down-regulated genes in 80D muscle, respectively.
  Upregulated genes predominantly mediated angiogenesis (VEGF), immune regulation
  (Jak-STAT/Toll/IL), and growth signaling (FGF/PDGF), while downregulated genes were
  enriched in cell adhesion (integrin), nucleotide metabolism (pyrimidine), and neural
