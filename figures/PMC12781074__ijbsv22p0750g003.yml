figure_title: The molecular mechanism of kidney diseases mediated by microbial dysbiosis
  and the renal protective effect of gut microecological preparations.
caption: The molecular mechanism of kidney diseases mediated by microbial dysbiosis
  and the renal protective effect of gut microecological preparations. Dysbiosis,
  characterized by a reduction in beneficial SCFAs and an increase in uremic toxins
  (IS, PCS, TMAO, and IAA), damages the intestinal barrier and elevates LPS and pro-inflammatory
  cytokines (TNF-α, IL). These toxins and signals activate multiple inflammatory pathways
  and oxidative stress, collectively aggravating renal inflammation and fibrosis.
  Conversely, treatment with specific beneficial bacteria enhances their protective
  effects, such as producing SCFAs and lowering uremic toxins, leading to the suppression
  of NF-κB and TGF-β/Smad pathways, reducing oxidative stress, and activating the
  Nrf2 pathway. Thus, dysbiosis drives kidney damage through toxin release, barrier
  failure, and inflammation, while gut microecological preparations weaken the key
  mechanisms that regulate renal inflammation and fibrosis
