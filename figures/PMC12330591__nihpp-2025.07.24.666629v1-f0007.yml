figure_title: Restoring mtDNA repair activity in a Drosophila model of HD improves
  mtDNA integrity, and mitochondrial function and motor defects
caption: |-
  (A). PNKP activities in MEs are isolated from the control STHdhQ7 cells (lane 3; Q7), mutant STHdhQ111 cells (Q111; lane 4) and STHdhQ111 cells overexpressing exogenous wtHTT (Q111 + wtHTT; lane 2); Lane 1: no protein was added to the DNA substrate as negative control. The DNA substrate and released phosphate bands shown with arrowheads.(B). Relative mitochondrial PNKP activities (in terms of % product) in STHdhQ7, STHdhQ111 and STHdhQ111 cells overexpressing wtHTT. Three biological and three technical replicates were used in this study. Data represent mean ± SD; ****p<0.0001; ***p<0.001.(C). Total genomic DNA isolated from STHdhQ7 (lanes 1 to 3), STHdhQ111 (lanes 4 to 6) and STHdhQ111 cells overexpressing wtHTT (lanes 7 to 9), and 10.6 kb and 0.2-kb segments of mouse mtDNA PCR amplified; and the PCR products electrophoresed on agarose gels and stained with EtBr (red arrowheads). Lane 10: 1-kb DNA ladder.(D). Relative PCR amplification of mtDNA in STHdhQ7, STHdhQ111, and STHdhQ111 cells overexpressing wtHTT. Three technical replicates were used for the calculation. Data represents mean ± SD, ***p<0.001; ns = not significant.(E). Control wildtype STHdhQ7 cells, mutant STHdhQ111 cells, and mutant STHdhQ111 cells expressing exogenous wtHTT treated with JC-10 dye, and mitochondrial membrane potential measured. Five technical replicates were used for calculations. Data represent mean ± SD; *p<0.05. **p<0.01; ****p<0.0001.(F). Total genomic DNA isolated from wildtype fly heads (WT; lanes 1 to 3), HD transgenic UAS-128QhttFL fly heads (lanes 4 to 6) and the UAS-128QhttFL fly heads expressing human wtHTT (lanes 7 to 9), and 14.2 kb and 0.15-kb segments of Drosophila mtDNA PCR amplified; and the products analyzed on agarose gels (red arrowheads). Lane 10: 1-kb DNA ladder.(G). Relative PCR amplification of mtDNA in control wildtype flies (WT), mutant UAS-128QhttFL, and mutant UAS-128QhttFL
  Drosophila flies ectopically expressing human wtHTT. Twenty-five biological replicates and three technical replicates were used for this measurement. Data represent mean ± SD; *p<0.05; ***p<0.001; ****p<0.0001.(H). Total protein isolated from wildtype (WT) Drosophila heads (n=30; lane 2), and transgenic Drosophila heads expressing human PNKP, and effective expression of PNKP assessed by WBs. Transgenic line (PNKP-OE2; lane 4) showing effective transgenic expression of human PNKP in heads. Lane 3: Transgenic line PNKP-OE1 does not show effective expression of human PNKP. Lane 1: Protein molecular weight marker in kDa.(I). Total DNA isolated from wildtype fly heads (WT; lanes 1 to 3), HD transgenic UAS-128QhttFL fly heads (lanes 4 to 6) and the UAS-128QhttFL fly heads expressing human PNKP (lanes 7 to 9), and 14.2 kb and 0.15-kb sections of Drosophila mtDNA PCR amplified; and the PCR products analyzed on agarose gels (red arrowheads). Lane 10: 1-kb DNA ladder.(J). Relative PCR amplification of mtDNA in control wildtype flies (WT), mutant UAS-128QhttFL, and mutant UAS-128QhttFL flies ectopically expressing human PNKP. Twenty-five biological replicates and three chemical replicates were used for this measurement. Data represent mean ± SD; ***p<0.001; ****p<0.0001; ns = not significant.(K). Climbing properties of 20-day-old Drosophila that reflect the motor coordination in wildtype, UAS-128QhttFL and UAS-128QhttFL flies expressing exogenous wtHTT measured by standard climbing properties of flies. Relative motor function of wildtype (WT), UAS-128QhttFL, and UAS-128QhttFL Drosophila expressing exogenous wtHTT are shown. *p<0.001 (UAS-128QhttFL vs. WT) and <00.1 (mutant flies expressing exogenous wtHTT vs. mutant flies).(L). Relative motor function of wildtype control (WT), HD transgenic (UAS-128QhttFL) and in HD transgenic flies ectopically expressing human PNKP. *p<0.001 (UAS-128QhttFL vs. WT) and # p<00.1 (mutant flies expressing exogenous PNKP vs. mutant flies).(M). Schematic diagram of our hypothesized mechanism by which mHTT with polyQ expansions compromises mtDNA repair and integrity, and function in HD. Wildtype native HTT forms a mtDNA repair complex with POLRMT, TFAM, DNA POLGA, CSB, TFB1M/TFB2M, and PNKP, and this multi-protein complex edits mtDNA lesions during transcription to preserve mtDNA integrity, replication, and transcription. In HD, mHTT impairs the normal function of this complex, leading to persistence of mtDNA damage. This putative pathway explains how mHTT adversely impacts mtDNA repair, and perturbs mtDNA gene transcription to disrupt mitochondrial homeostasis and function to trigger early neurotoxicity in HD
