figure_title: Effects of vitamin C on BBB disruptions and activation of microglia
  and astrocytes after cardiac surgery.
caption: Effects of vitamin C on BBB disruptions and activation of microglia and astrocytes
  after cardiac surgery. Following cardiac surgery under CPB, neutrophils are activated
  due to systemic inflammatory response and ischemia–reperfusion. Activated neutrophils
  adhere to tight junctions of the BBB, as well as to pericytes and the basement membrane,
  releasing large amounts of inflammatory cytokines and reactive oxygen species, thereby
  causing BBB disruption. Through a disrupted BBB, excessive ROS and cytokines infiltrate
  the brain parenchyma and activate microglia and astroglia. Activated microglia and
  astrocytes further induce inflammatory mediators and ROS, which cause mitochondrial
  dysfunction and activate the apoptosis signaling pathway. These processes ultimately
  lead to neuronal damage. BBB, blood–brain barrier; CBP, cardiopulmonary bypass;
  ROS, reactive oxygen species. T-shaped lines indicate inhibition
