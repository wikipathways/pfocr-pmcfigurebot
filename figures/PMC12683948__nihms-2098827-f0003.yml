figure_title: Metabolomic profiling of mouse fecal communities identifies a reduced
  TUA metabolite
caption: (A) EGT-d9, TMA-d9, and TUA content of cultures containing fresh JAX, TAC,
  or CR feces (9-week-old mice) or of media alone treated with EGT-d9 for 48 h.(B)
  Untargeted metabolomic analysis of culture supernatants from CR fecal cultures (11-week-old
  mice) incubated with or without EGT-d9 for 48 h (n = 3; m/z ≤239.1523, ion intensity
  >100,000). Horizontal dashed lines, p ≤0.05; vertical dashed lines, Log2(fold change)
  ≥3 or ≤−3. Significantly upregulated features are highlighted in red. Asterisks
  denote probable fragments of m/z 173.0379. Hollow circle denotes a nonspecific feature
  that lacked valid chromatographic peaks.(C) Representative LC-MS/MS analysis of
  m/z 173.0379 from a 3-(2-thione-imidazol-4-yl)-propionic acid standard and from
  the culture supernatant of a CR fecal culture (11-week-old mouse) incubated with
  EGT-d9 for 48 h.(D) Proposed fragment ion structures of m/z 173.0379.(E) Proposed
  enzymatic pathway for TUA reduction to 3-(2-thione-imidazol-4-yl)-propionate.(F)
  EIC spectra (m/z 173.0379) of culture supernatants from CR fecal cultures (11-week-old
  mice) treated with or without EGT-d9 for 48 h (CR + EGT-d9; CR), media alone supplemented
  with or without EGT-d9 for 48 h (EGT-d9; Media), a 3-(2-thione-imidazol-4-yl)-propionic
  acid standard, and a 1:1 (v/v) mixture of CR + EGT-d9 and 3-(2-thione-imidazol-4-yl)-propionic
  acid standard (co-injection).(G) TUA and 3-(2-thione-imidazol-4-yl)-propionic acid
  content of cultures containing fresh JAX, TAC, or CR feces (23-week-old mice) or
  of media alone treated with TUA for 48 h.For (A) and (G), ***p <0.001; ****p <0.0001;
  n.s., not significant, by one-way ANOVA followed by Šídák's multiple comparisons
  tests. Error bars represent means ± standard deviation of biological replicates.
  See also Figure S2
