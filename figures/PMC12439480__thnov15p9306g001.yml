figure_title: Illustration of the design and mechanism of action of the dimeric CCK2R-targeted
  radiotracer combined with an mTOR inhibitor.
caption: Illustration of the design and mechanism of action of the dimeric CCK2R-targeted
  radiotracer combined with an mTOR inhibitor. (A) Schematic of the structure of the
  [68Ga/177Lu]DOTA-CCK2R-dimer radiotracer. The DOTA-CCK2R dimer was designed on the
  basis of the DOTA-CCK-66 monomer structure. Two CCK-66 monomers were symmetrically
  linked via a γ-D-Glu residue and a flexible PEG3 spacer, yielding the dimeric structure.
  This design ensures appropriate spacing between the two pharmacophores, matching
  the distance between the binding sites of the CCK2R receptor dimer, thus enabling
  efficient multivalent binding and enhanced tumor-targeting capability. The N-terminus
  of the L-Glu residue is conjugated to the chelator DOTA, facilitating coordination
  with radionuclides and allowing radiolabeling with 68Ga for PET imaging or 177Lu
  for targeted radionuclide therapy (TRT). (B) Proposed mechanism of the selective
  elimination of high-proliferation, low-differentiation (HP-LD) tumor cell populations
  by [177Lu]Lu-DOTA-CCK2R-dimer. After binding to CCK2R-positive tumor cells, 177Lu
  emits β-rays that induce the production of intracellular reactive oxygen species
  (ROS), triggering oxidative stress and activation of the DNA damage response (γ-H2AX).
  The mTOR inhibitor downregulates GSTK1, disrupts the glutathione (GSH)-mediated
  detoxification pathway, and impairs cellular antioxidant defenses, thereby enhancing
  radiosensitivity and ultimately promoting tumor cell apoptosis
article_title: Dimeric CCK2R radiotheranostic tracers synergize with mTOR inhibition
  for enhanced tumor therapy
