caption: The images are taken from a human heart scanned using HiP-CT at the European
  Synchrotron Radiation Facility and made available at 6.51 um from the heart of the
  body donor S20-29. (A) Panel A shows the transition between the compact node and
  the rightward extension into the right atrial vestibule, together with the merge-point
  between the rightward extension and working myocardium. (B) Panel B shows the input
  to the compact node from the atrial septum, in other words the fast-pathway, with
  minor infiltration by fat separating it from the right atrial vestibule. (C) Panel
  C shows the much smaller leftward extension from the compact node and the merge-point
  with the working myocardium of the left atrial vestibule
