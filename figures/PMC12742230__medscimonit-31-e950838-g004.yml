figure_title: SAM and EBAM feature selection, intersection, and pathway enrichment.
caption: |-
  SAM and EBAM feature selection, intersection, and pathway enrichment. (A) SAM delta plot of standardized scores (d-values) versus within-group standard deviations; diagonal lines at ±1.3 denote significance thresholds, with significant features highlighted in green (n=24). (B) EBAM scatter plot of z-values (x-axis) versus posterior probability (y-axis); a solid horizontal line at 0.90 marks the significance cutoff, with significant features highlighted in green (n=62). (C) Venn diagram illustrating the intersection of significant oxylipin lists from Wilcoxon, SAM, and EBAM analyses, yielding 14 high-confidence candidates. (D) Metabolic pathway enrichment of the 14-metabolite panel, showing -log10
  P-values for Kyoto Encyclopedia of Genes and Genomes pathways; glycolysis/gluconeogenesis displayed the greatest pathway impact. EBAM – empirical Bayes analysis of microarrays; SAM – significance analysis of microarrays
