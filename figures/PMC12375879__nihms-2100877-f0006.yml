figure_title: Exercise-specific genes enrich for similar transcription factors across
  species and exercise modalities.
caption: 'Exercise-specific genes enrich for similar transcription factors across
  species and exercise modalities. Bar graph displaying the top 10 transcription factors
  enriched among genes exclusively differentially expressed between exercise and sedentary
  or baseline, but not exercise+metformin for (A) aerobic exercise training (AET;
  Mus musculus, current study), or (B) progressive resistance exercise training (plaPRT;
  Homo sapiens, reanalysis of MASTERS trial data, PMID: 33071237). Boxplots of the
  log2FC for BCL6B enriched genes from (A; 71 genes) and (B; 97 genes) in their response
  to (C) AET and AET+MET (Mouse), or (D) plaPRT and metPRT (Human). (E) Cell-type
  enrichment for BCL6B-enriched genes for AET (Mouse, green) and plaPRT (Human, orange),
  shown as scatterplots of the odds ratio versus −log10(p_adj) from the Fisher’s exact
  test using the Human Protein Atlas RNA single-cell type data. (E) KEGG pathways
  significantly enriched by over-representation of BCL6B enriched genes for AET (Mouse,
  green) and plaPRT (Human, orange)'
