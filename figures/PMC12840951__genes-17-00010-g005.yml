figure_title: The gene set enrichment analysis of STX17-DT overexpression versus control
  THP-1 cells.
caption: The gene set enrichment analysis of STX17-DT overexpression versus control
  THP-1 cells. GSEA plots demonstrate significant positive enrichment of the immune-related
  sets (innate immune response (a), inflammatory response (b), Toll-like receptor
  signaling pathway (e), and TNF signaling pathway (f) in the STX17-DT group), and
  negative enrichment of gene sets involved in translation-related sets (“translation”
  (c) and “cytoplasmic translation” (d)). In each plot, the green curve depicts the
  enrichment score (ES), black vertical lines mark member genes in the ranked gene
  list, and the bottom heatmap shows the expression level of the core genes. NES,
  normalized enrichment score; FDR, false discovery rate
