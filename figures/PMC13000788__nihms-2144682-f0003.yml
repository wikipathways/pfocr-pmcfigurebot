figure_title: ZFP36L1 directly destabilizes p21 and JAG1 to regulate NOTCH signaling
  and senescence
caption: (A, B) mRNA stability curves showing prolonged half-lives of Jag1 and Cdkn1a
  (p21) transcripts in Zfp36l1HKO hepatocytes. (C) Schematic of the Jag1 3′ UTR with
  AU-rich element motifs highlighted. (D) RNA gel shift assay confirming direct binding
  of ZFP36L1 to Jag1 3′ UTR probes. (E) RNA-seq demonstrating increased Jag1 expression
  in liver tissue and isolated hepatocytes from Zfp36l1HKO mice. (F) siRNA-mediated
  Zfp36l1 knockdown in AML12 hepatocytes increased JAG1 protein and upregulated Notch1,
  Notch2, Notch3, and Hes1. (G) Zfp36l1 overexpression suppressed Jag1 and downstream
  Notch pathway gene expression in AML12 hepatocytes. Data are presented as mean ±
  SEM. p values were calculated using a two-tailed Student’s t-test in (E, F, G).
  * Indicates statistical significance (p < 0.05)
