figure_title: 'Integrated multi-omics framework in aquatic toxicology: pathway from
  molecular perturbations to phenotypic responses.'
caption: 'Integrated multi-omics framework in aquatic toxicology: pathway from molecular
  perturbations to phenotypic responses. Pollutants elicit toxicity through sequential
  molecular perturbations along the central dogma axis—from genomic alterations to
  metabolic dysregulation—culminating in adverse phenotypic outcomes. This cascade
  is interrogated by layer-specific omics technologies: genomics identifies toxicity-associated
  genetic variants and host–microbiome dynamics; transcriptomics pinpoints differentially
  expressed genes responsive to contaminant exposure; proteomics screens mechanistic
  biomarkers and characterizes functional protein networks; and metabolomics ultimately
  delineates biochemical pathway disruptions underlying toxic effects'
