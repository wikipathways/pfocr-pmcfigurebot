figure_title: Pathways of amino acid metabolism.
caption: Pathways of amino acid metabolism. Most amino acids undergo catabolic processes
  in the liver, primarily through deamination to form α-keto acids and ammonia (NH3/NH4+).
  The resulting α-keto acids are oxidized in the mitochondria for energy production,
  converted into glucose and fatty acids, or resynthesized into NEAAs. Ammonia is
  predominantly detoxified via the ornithine cycle to form urea and ultimately excreted
  by the kidneys. Moreover, certain amino acids can be decarboxylated to yield carbon
  dioxide and amines. The arrows in the figure represent either the transport of substances
  or the course of biochemical processes
