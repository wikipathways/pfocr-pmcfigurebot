figure_title: 'Neuroendocrine dysregulation in obesity: molecular, hormonal, and systemic
  mechanisms.'
caption: 'Neuroendocrine dysregulation in obesity: molecular, hormonal, and systemic
  mechanisms. Obesity is associated with hypothalamic inflammation characterised by
  microglial and astrocytic activation, resulting in impaired leptin and insulin signalling.
  Leptin resistance arises, despite elevated leptin secretion, from adipose tissue,
  due to reduced blood–brain barrier transport and intracellular inhibition of the
  JAK2–STAT3 pathway via SOCS3. Similarly, central insulin resistance develops through
  impaired IRS-1 and PI3K–AKT signalling, leading to defective energy homeostasis
  and satiety control. Hormonal imbalances further contribute to the decrease in active
  ghrelin, which blunts appetite regulation. At the same time, chronic activation
  of the hypothalamic–pituitary–adrenal (HPA) axis elevates cortisol, promoting central
  adiposity, systemic inflammation, and metabolic dysfunction. Disruption of the hypothalamic-pituitary-gonadal
  (HPG) axis results in hypogonadism, infertility, and abnormal pubertal development'
