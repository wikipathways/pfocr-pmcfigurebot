caption: '(A) GSEA of basal alpha- vs beta-cell transcriptomes from HPAP-young (T1D
  control) donors; (B) GSEA of basal alpha- vs beta-cell transcriptomes from HPAP-older
  (T2D control) donors; (C) GSEA of basal alpha- vs beta-cell transcriptomes from
  the dataset Szymczak et al. iPSC stage 7; (D) GSEA of basal alpha- vs beta-cell
  transcriptomes of Chandra et al. iPSC stage 6 dataset; (E) GSEA of basal alpha-
  vs beta-cell transcriptomes from the dataset Sintov et al. (hESC-derived alpha-
  and beta-like cells matured in vivo); (F) GSEA of basal alpha- vs beta-cell transcriptomes
  from the dataset Sintov et al. (hESC-derived alpha- and beta-like cells differentiated
  in vitro). Bars represent the NES, with positive values indicating alpha-cell enriched
  pathways and negative values indicating beta-cell enriched pathways. Color intensity
  reflects the significance level (−log10 adjusted p-value). GSEA: Gene set enrichment
  analysis, HPAP: Human Pancreas Analysis Program, NES: normalized enrichment score'
