caption: Integration of EjaWRKY regulatory networks with anthocyanin biosynthesis
  in E. japonica. (A) Correlation analysis (cor > 0.75) was performed between 87 EjaWRKY
  genes and 57 anthocyanin synthesis-related genes in E. japonica. Blue indicates
  EjaWRKYs; yellow represents anthocyanin synthesis-related genes. (B) Schematic diagram
  of the anthocyanin biosynthesis pathway. (C) Co-expressed anthocyanin synthesis
  pathway genes containing at least one WRKY binding site in their promoter region.
  (D,E) Expression dynamics of the co-expressed EjaWRKYs (D) and anthocyanin synthesis
  pathway genes (E) during E. japonica fruit maturation, analyzed by qPCR
