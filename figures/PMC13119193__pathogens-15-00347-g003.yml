figure_title: Context-dependent modulation of angiogenesis by Toxoplasma gondii.
caption: Context-dependent modulation of angiogenesis by Toxoplasma gondii. Under
  hypoxic conditions, the parasite promotes proangiogenic signaling through the HIF-1α,
  VEGF, and MAPK pathways, supporting intracellular survival. In contrast, Th1-driven
  immune responses (IFN-γ and TNF-α) and oxidative stress (NO and ROS) can inhibit
  angiogenesis and tumor growth. Additionally, extracellular matrix remodeling (MMP,
  CD44) and immune cell modulation contribute to vascular and tissue alterations
