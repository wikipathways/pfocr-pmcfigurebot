caption: 'Heme biosynthesis pathway and its role in emerging applications of protoporphyrin
  IX (PpIX). The top section shows the key steps of the heme biosynthesis pathway,
  highlighting PpIX (represented as a black serrated ring) and heme (represented as
  a black serrated ring with Fe2+ at its center) production. The branches below illustrate
  the mechanisms in applications of exogenous aminolevulinic acid (5-ALA), administered
  with or without ferrous iron, including liquid biopsy; targeted photodynamic therapy
  of resistant cancer cells; and maintenance of neurological and mental health. HO-1:
  Heme oxygenase-1, PBGS: Porphobilinogen Synthase, PBGD: Porphobilinogen Deaminase,
  UROS: Uroporphyrinogen III Synthase, UROD: Uroporphyrinogen Decarboxylase, CPOX:
  Coproporphyrinogen Oxidase, PPOX: Protoporphyrinogen Oxidase, FECH: Ferrochelatase'
