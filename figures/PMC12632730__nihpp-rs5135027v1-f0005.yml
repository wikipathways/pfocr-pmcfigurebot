figure_title: Exarafenib Resistance Involves an Adaptive Switch from BRAF to ARAF-KSR1
  Complex-Dependent MAPK Signaling
caption: a, Cell viability IC50 heatmap showing RAF isoform dependency in parental
  and exarafenib-resistant cell lines calculated from Supplementary Fig. 8a. NCI-H2405,
  NCI-H1755, and NCI-H1666 parental and resistant (−ER) cells were transfected with
  scrambled control (SCR), siARAF, siBRAF, or siCRAF and treated with exarafenib.
  Lighter shades indicate lower IC50 values and greater sensitivity. b, Western blot
  analysis showing differential RAF isoform dependency for MAPK pathway maintenance
  under drug-free and drug treatment conditions. NCI-H2405 parental and resistant
  (NCI-H2405-ER) cells were transfected with scrambled control (SCR) or siRNAs targeting
  ARAF, BRAF, or CRAF, then treated with DMSO (−) or exarafenib (500 nM, +) for 48
  hours. c, Time-course analysis of MAPK pathway reactivation following exarafenib
  treatment in resistant cells. NCI-H2405-ER cells were transfected with scrambled
  control (SCR) or siARAF, then treated with exarafenib (500 nM) for the indicated
  time points (0, 1, 4, 24 hours). d, Serum dependency of MAPK pathway reactivation
  in exarafenib-resistant cells. NCI-H2405-ER cells were transfected with scrambled
  control (SCR) or siARAF and cultured in low (3%) or high (10%) serum conditions,
  then treated with DMSO (−) or exarafenib (500 nM, +) for 24 hours. e, Co-immunoprecipitation
  analysis of ARAF protein interactions in parental and resistant cells. NCI-H2405
  parental and NCI-H2405-ER cells were treated with DMSO (−) or exarafenib (500 nM,
  +) for 24 hours. ARAF was immunoprecipitated and co-precipitating proteins (BRAF,
  CRAF, KSR1) were detected by immunoblotting. Whole cell lysates (WCL) show input
  protein levels. f, Co-immunoprecipitation analysis demonstrating growth factor regulation
  of ARAF-KSR1 interaction. NCI-H2405-ER cells were treated with or without EGF (100
  ng/ml) and DMSO (−) or exarafenib (500 nM, +) simultaneously for 24 hours. EGF stimulation
  enhances ARAF-KSR1 interaction in resistant cells under drug treatment conditions.
  g, Proximity ligation assay (PLA) analysis of ARAF-KSR1 spatial interaction in parental
  versus resistant cells. NCI-H2405 parental and NCI-H2405-ER cells were treated with
  DMSO (−) or exarafenib (500 nM, +) for 24 hours. PLA signals (red dots) indicate
  ARAF-KSR1 proximity. Nuclei are stained with DAPI (blue). Scale bar, 20 μm. Quantification
  confirms significantly increased ARAF-KSR1 proximity in resistant cells following
  drug treatment (***p<0.001, unpaired t-test). h, Heat map representation of IC50
  values for exarafenib treatment in parental NCI-H2405 and resistant NCI-H2405-ER
  cells following scrambled control (SCR) or KSR1 siRNA (siKSR1) treatment. IC50 values
  were calculated from dose-response curves shown in Supplementary Fig. 8f
