figure_title: Enzalutamide treatment promotes interferon responsiveness at early stages.
caption: 'Enzalutamide treatment promotes interferon responsiveness at early stages.
  (A) RT-qPCR analysis shows downregulation of IFNγ target in C4-2B cells after enzalutamide
  treatment (20 μM) for 2 days. Data are presented as mean ± SEM. (B,C) Growth curve
  and colony formation assays show that C4-2B-1M cells proliferate more slowly than
  both parental C4-2B and resistant C4-2B MDVR cells, and remain sensitive to continued
  enzalutamide treatment. (D) Western blot analysis of p-STAT1 and p-STAT3 levels
  in C4–2B and C4-2B-1M cells following 1-h treatment with the indicated concentrations
  of IFNγ or IL-6. (E) Western blot analysis of p-STAT1 and p-STAT3 levels in C4-2B
  and C4-2B-1M cells following treatment with IFNγ (20 ng/mL) or IL-6 (10 ng/mL) for
  the indicated time points. (F) Volcano plot of differentially expressed genes between
  C4-2B-1M and C4-2B parental cells. (G) GO enrichment analysis of upregulated pathways
  in C4-2B-1M highlights activation of interferon pathways. (H) GSEA shows upregulation
  of interferon-α and interferon-γ response signatures in C4-2B-1M versus parental
  C4-2B cells. (I) Heatmap of selected upregulated genes associated with interferon
  pathways in C4-2B-1M cells. * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001,
  ns: not significant'
