figure_title: 'The p53-Mediated Bifurcation: Temporal SASP Evolution and Divergent
  Senescence Fates.'
caption: 'The p53-Mediated Bifurcation: Temporal SASP Evolution and Divergent Senescence
  Fates. (A) Timeline of SASP Evolution: The schematic illustrates the dynamic progression
  of the Senescence-Associated Secretory Phenotype (SASP) over time. Following an
  initial acute phase characterized by TGF-β secretion and extracellular matrix (ECM)
  remodeling, the p53/NF-κB axis functions as a molecular gatekeeper. Under functional
  p53 signaling (blue trajectory), the SASP transitions toward resolution, enabling
  immune clearance and tissue repair. In contrast, p53 mutation or a tumor-promoting
  environment (red trajectory) drives the SASP into a chronic, malignant state characterized
  by persistent inflammation and high levels of IL-6, IL-8, and proteases. (B) The
  Fate Divergence: This panel details the immunological outcomes of the p53-mediated
  bifurcation, where the color scheme distinguishes between tumor-suppressive (blue)
  and tumor-promoting (red) pathways: Scenario 1 (p53-WT → Immunogenic Senescence):
  Functional p53 induces an immunogenic phenotype in Therapy-Induced Senescent (TIS)
  cells. Upregulation of NKG2D ligands and MHC Class I molecules, combined with a
  pro-inflammatory SASP (IFN-γ, chemokines), recruits NK cells and CD8+ T cells for
  effective cell clearance. Scenario 2 (p53-Mutant → Malignant Senescence): Loss of
  functional p53 leads to genomic instability and a persistent DNA damage response
  (DDR). These cells secrete an immunosuppressive SASP (IL-6, TGF-β, CXCL1/2) that
  recruits Tregs and MDSCs, allowing senescent cells to escape immune surveillance
  and persist'
