figure_title: Changes in lipid metabolism throughout the menstrual cycle.
caption: 'Changes in lipid metabolism throughout the menstrual cycle. Schematic representation
  of phase-dependent regulation of lipid metabolism. During the estradiol (E2)-dominant
  follicular phase, increased insulin sensitivity, enhanced lipid oxidation flexibility,
  and improved lipoprotein metabolism (increased high-density lipoprotein [HDL], reduced
  low-density lipoprotein [LDL], and lower postprandial lipemia) are observed, supported
  by estrogen receptor (ER)-mediated signaling and increased mitochondrial oxidative
  capacity. In contrast, the progesterone (P4)-dominant luteal phase is characterized
  by increased lipolysis, elevated free fatty acids (FFAs), higher resting energy
  expenditure (REE), increased triglycerides, and mild insulin resistance, driven
  in part by hormone-sensitive lipase (HSL) activation and sympathetic tone. At the
  cellular level, hepatocytes regulate lipoprotein metabolism and very-low-density
  lipoprotein (VLDL) secretion; adipocytes increase lipolytic activity via HSL-mediated
  triglyceride breakdown; and skeletal muscle enhances fatty acid uptake and β-oxidation
  through carnitine palmitoyltransferase 1 (CPT1)-dependent mitochondrial pathways.
  Abbreviations: E2, estradiol; P4, progesterone; HDL, high-density lipoprotein; LDL,
  low-density lipoprotein; VLDL, very-low-density lipoprotein; FFAs, free fatty acids;
  REE, resting energy expenditure; ER, estrogen receptor; HSL, hormone-sensitive lipase;
  CPT1, carnitine palmitoyltransferase 1'
