figure_title: Signaling Pathway Activity in the Crypt-Villus Axis
caption: The signaling pathways governing intestinal stem cell differentiation exhibit
  a gradient of activity along the crypt-villus axis, with differential expression
  of receptors and ligands either in the crypts (stem cell compartment) or the villi
  (mature cells), contingent upon the specific pathway involved. Notably, the endocannabinoid
  signaling pathway is difficult to characterize as there are receptors in both the
  crypts and the villi; cannabinoid receptor type 1 (CNR1) is expressed in the crypt,
  as well as in goblet and absorptive cells of the villi, while CNR2 is predominantly
  expressed in Paneth cells
