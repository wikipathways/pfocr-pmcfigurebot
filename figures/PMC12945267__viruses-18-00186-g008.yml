figure_title: Carbohydrate metabolism altered by ORFV−CL24 infection.
caption: 'Carbohydrate metabolism altered by ORFV−CL24 infection. (A) Clustering heat
  map of differentially expressed metabolites belonging to carbohydrate metabolic
  pathways. Each row represents a metabolite, and each column represents a sample.
  Red indicates upregulation and blue indicates downregulation. (p−adjusted value
  < 0.05). (B) KEGG bubble plots of differential metabolites. The abscissa represents
  the corresponding enrichment factor for each pathway, the ordinate is the pathway
  name, and the color of the dot corresponds to a different −log10 (Q value). (C)
  Histogram showing the differentially expressed proteins related to carbohydrate
  metabolic pathways. The ordinate represents the log2 expression of the protein,
  and the abscissa represents the time of infection with ORFV-CL24. (* p−value < 0.05,
  ** p−value < 0.01, **** p−value < 0.0001; ns: no significant differences)'
