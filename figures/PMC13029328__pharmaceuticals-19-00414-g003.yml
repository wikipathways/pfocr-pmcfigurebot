caption: Effect of celecoxib and etoricoxib on the mRNA expression of EET-metabolizing
  and inflammatory pathway genes. The relative mRNA expression levels of (A) Ephx2,
  (B) Cox2, and (C) Alox12 were quantified by qPCR and expressed as fold change relative
  to the control group. Mice were treated with low or high doses of celecoxib (C Low,
  C High) or etoricoxib (E Low, E High) for 28 days. Data are presented as mean ±
  SD (n = 7 mice per group). * indicates a statistically significant difference compared
  with the control group (p < 0.05)
