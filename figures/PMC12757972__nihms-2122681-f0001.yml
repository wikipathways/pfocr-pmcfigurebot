figure_title: Overview of neurological responses in substance use disorders (SUD).
caption: Overview of neurological responses in substance use disorders (SUD). Dopaminergic
  pathways involved in SUD originate at the ventral tegmental area (VTA) and transmit
  to the cortex, nucleus accumbens (NAc), and striatum, as indicated by the respective
  colors. A hypothetical synapse is shown from a VTA neuron to a NAc neuron, with
  molecular details in the right panel. Substances can directly act on the cell membrane
  via cell surface receptors, such as the nicotinic acetylcholine receptor (nAChr),
  the opioid receptor, the cannabinoid receptor, and the GABA receptor. Some of these
  receptors are also ion channels that stimulate influx of sodium or calcium ions.
  These stimuli converge on the transmission of dopamine neurotransmitter at the synapse,
  which activates the dopamine receptor on the receiving cell, followed by ERK pathway
  activation, which leads to CREB phosphorylation and nuclear translocation. In concert
  with CBP, downstream genes are activated, including BDNF, EGR1, FOS, FOSB, and miR-212/132,
  which binds and represses translation of MECP2 mRNA. MECP2 generally leads to histone
  methylation and target gene repression, which can be disrupted in response to substance
  use. Created in BioRender
