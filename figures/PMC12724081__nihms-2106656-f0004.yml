figure_title: RNA-sequencing analysis reveals conditional Treg IL-6RaKO mice display
  altered IEC regulation compared to WTcre controls
caption: (A)IECs were harvested from Treg WTcre and Treg IL-6RaKO mice treated with
  H2O and 2% DSS, and RNA-sequencing performed. (Created in BioRender. Klatt, E. (2025)
  https://BioRender.com/y4ws91i). (B) Volcano plot displaying downregulated (blue)
  and upregulated (red) differentially expressed genes in IECs from conditional Treg
  IL-6RaKO and Treg WTcre mice treated with H2O. (C) Panther pathway analysis highlighting
  downregulated genes in the IECs from the IL-6RaKO Treg mice treated with H2O are
  associated with STAT3 and epithelial pathways. (D) Volcano plot displaying downregulated
  (blue) and upregulated (red) differentially expressed genes in conditional Treg
  IL-6RaKO and WTcre murine IECs treated with DSS. (E) KEGG pathway analysis highlighting
  downregulated genes in IECs from the IL-6RaKO Treg mice treated with DSS are associated
  with inflammatory pathways. (F) Gene set enrichment analysis reveals positive regulation
  of IL-6 production and IL-6 and JAK/STAT3 signaling in the IECs from the WTcre in
  the DSS-treated condition
