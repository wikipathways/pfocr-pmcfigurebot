figure_title: MSMO1 regulated glutamine metabolism via Wnt/β-catenin pathway.
caption: MSMO1 regulated glutamine metabolism via Wnt/β-catenin pathway. (A–C) The
  influence of MSMO1 in glutamine synthetase (A), glutaminase (B), and α-Ketoglutarate
  (C). (D–F) The expression of c-MYC (D), Wnt (E), and β-catenin (F). GAPDH served
  as loading control. The different shades in the bar chart represent different experimental
  groups and treatment conditions, including human normal osteoblasts cells (hFOB1.19)
  and OS cells (U2OS), as well as the U2OS control group and the U2OS cell group expressing
  sh-MSMO1. Statistical analyses were conducted using unpaired two-tailed Student’s
  t-tests and one-way ANOVA with least significant difference (LSD) post hoc tests,
  * p < 0.05, ** p < 0.01, *** p < 0.001
