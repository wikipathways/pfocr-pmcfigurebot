figure_title: Pyrimidine biosynthesis in P. falciparum
caption: This figure illustrates the enzymatic reactions involved in the de novo biosynthesis
  of pyrimidines in P. falciparum. The pathway begins with the conversion of glutamine
  and bicarbonate into carbamoyl phosphate by the enzyme carbamoyl phosphate synthetase
  II (PfCPSII). Subsequent steps catalyzed by aspartate transcarbamoylase (PfATC)
  and dihydroorotase (PfDHO) lead to the formation of dihydroorotate. Dihydroorotate
  is then oxidized to orotate by dihydroorotate dehydrogenase (PfDHODH), a mitochondrial
  enzyme that can be inhibited by a class of triazolopyrimidine compounds including
  DSM1 (20). Orotate is subsequently converted to orotidine-5’-monophosphate (OMP)
  by orotate phosphoribosyltransferase (PfOPRT), and OMP is decarboxylated to uridine
  5’-monophosphate (UMP) by orotidine-5’-monophosphate decarboxylase (PfODC). UMP
  is a precursor for the synthesis of all pyrimidine nucleotides, which are essential
  for DNA and RNA synthesis
article_title: Genetic analysis of pyrimidine biosynthetic enzymes in Plasmodium falciparum
