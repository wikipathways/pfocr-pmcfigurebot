figure_title: Differential responses to shear stress in PAH versus control PAECs
caption: (a) Differentially expressed genes (DEGs) in PAH vs control PAECs under three
  shear conditions. (b) Volcano plot highlighting DEGs in the high shear condition;
  selected genes of interest labeled. (c) Gene set enrichment analysis comparing PAH
  to Control PAECs across static, low, and high shear. The top 50 enriched pathways
  for each condition were clustered into pre-specified themes and represented as pie
  charts showing the proportion of pathways in each theme. Representative enriched
  pathways from each theme are shown below, quantified by normalized enrichment score
  (NES). All analyses used FDR < 0.05 for significance and pathway annotation from
  Hallmark (H), KEGG (K), Reactome (R), Wikipathways (WP), and GO Biological Process
  (GO). Pathway names abbreviated for space where appropriate
