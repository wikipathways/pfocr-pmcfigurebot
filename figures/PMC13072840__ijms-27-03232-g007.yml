figure_title: p38α inactivates the non-canonical NF-κB pathway independent of the
  kinase activity.
caption: p38α inactivates the non-canonical NF-κB pathway independent of the kinase
  activity. (a–c) Overexpression of p38α in iMK2-KO cells increases basal TRAF2 and
  reduces basal RelB protein levels. (d) Overexpression of p38α and kinase inactive
  mutant p38-AGF reduce basal Il1b and (e) Map3k14 mRNA and (f) increase basal Traf2
  mRNA in resting iMK2-KO cells. (g) Relb and (h) Nfkb2 mRNA are reduced in IL-1α-treated
  (5 ng/mL, 1 h) iMK2-KO+p38α and +p38-AGF cells. (b,c) Student’s t-test, (d–h) 1W-ANOVA
  followed by Tukey’s Multiple Comparison Test, mean ± SEM, * p < 0.05, ** p < 0.01,
  *** p < 0.001
