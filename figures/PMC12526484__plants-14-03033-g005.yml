caption: 'Genome-wide polymorphism landscape and promoter divergence of UDP-Glc and
  ADP-Glc biosynthesis pathways genes. (A) Circos visualization of variants between
  Xian133 and Chang15. Tracks from outermost to innermost: indel heat-maps (outer,
  Xian133; inner, Chang15) and SNP density line plots (outer, Xian133; inner, Chang15);
  centermost ring indicates the 12 chromosomes. A total of 5,590,317 SNPs and 931,335
  indels were identified, 45.04% of SNPs and 43.08% of indels being cultivar-specific.
  (B) Detailed view of promoter SNPs in OscPGM. (C) Detailed view of promoter SNPs
  in OsAGPL1. Promoter regions were defined as the 2 Kb sequence immediately upstream
  of the transcription start site'
