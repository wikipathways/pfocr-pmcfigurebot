figure_title: |-
  Overrepresented biological pathways (GO:BP) populated by genes with
  differential splicing events as a result of iAs exposure, miR-186 overexpression
  and joint effect of iAs exposure and mir-186 overexpression at 12 and 29-week
  time points.
caption: |-
  Overrepresented biological pathways (GO:BP) populated by genes with
  differential splicing events as a result of iAs exposure, miR-186 overexpression
  and joint effect of iAs exposure and mir-186 overexpression at 12 and 29-week
  time points. (A) Venn diagram showing the number of overrepresented
  biological pathways at 12-week time point due to iAs exposure (DAS1), miR-186
  overexpression (DAS2) and joint effect of iAs exposure and mir-186
  overexpression (DAS3) as well as their overlap. (B) Heat map of
  overrepresented biological pathways at 12-week time point stratified by effect
  of iAs exposure (DAS1), miR-186 overexpression (DAS2) and joint effect of iAs
  exposure and mir-186 overexpression (DAS3). The overrepresented biological
  pathways are presented in the same order as in Supplementary Table 1 (Sheet
  1-GOBP-12W). (C) Venn diagram showing the number of overrepresented
  biological pathways at 29-week time point due to iAs exposure (DAS4), miR-186
  overexpression (DAS5) and joint effect of iAs exposure and mir-186
  overexpression (DAS6) as well as their overlap. (D) Heat map of
  overrepresented biological pathways at 29-week time point stratified by effect
  of iAs exposure (DAS4), miR-186 overexpression (DAS5) and joint effect of iAs
  exposure and mir-186 overexpression (DAS6). The overrepresented biological
  pathways are presented in the same order as in Supplementary Table 1 (Sheet
  2-GO:BP-29W). For panels (B) and (D), overrepresented
  biological pathway is determined by log10(padj)>1.3. The color code bar
  on the right refers to the log10(padj) values. Absence of a bar (represented by
  white) signifies that the biological pathway was not overrepresented for that
  comparison at that time point
