figure_title: Radial-out interactions most strongly impair decoding in the feedforward
  pathway
caption: Decoding performance from broad-spiking neurons in each layer in the target-only
  condition and each of the three context conditions. Points in the upper section
  of each plot show the decoding performance for each of the 20 different cross-validations.
  The lower section for each layer shows the bootstrapped estimation of the difference
  between decoding performance in each context condition compared to the target-only
  condition. Half-violin plots show the bootstrapped distribution of the difference,
  and black dots and bars represent the mean and 95% confidence intervals of the difference
  in decoding performance
