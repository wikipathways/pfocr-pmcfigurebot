caption: 'The schematic genetic regulation pathways induced with de novo FA substrates
  increasing the formulation of triglycerides, phospholipids, and cholesterol esters
  in the goose, induced with supplementation with carbohydrates; glucose and free
  fatty acids enter the hepatic cytosol, beginning glycolysis and providing Acetylo-CoA,
  an essential substrate for the citric acid cycle, which takes place in mitochondria;
  FASN (fatty acid synthase) activity is induced with SREBP1 (sterol regulatory element-binding
  protein 1); and FASN (belongs to the FAS enzymatic complex) catalyzes the de novo
  synthesis of palmitic acid (C16:0) from acetyl-CoA, using NADPH as a reducing equivalent.
  It acts as the entry point into the lipid synthesis network, providing saturated
  fatty acids (SFAs) that serve as substrates for downstream elongation and desaturation.
  FASN activity is tightly linked to ME1; ACSL1 converts free fatty acids into fatty
  acyl-CoA esters, activating them for further elongation and desaturation or incorporation
  into TG (lipid storage purposes) and phospholipids (membrane synthesis). Blue boxes—genes
  upregulated during overfeeding; ME1—malic enzyme 1; ACSL1—acyl-CoA synthetase long-chain
  family member 1; SCD1—stearoyl-CoA desaturase 1. The activity of the genes marked
  with a wide frame is modulated with ACSL1 and SCD1 activity: ELOVL6 and ELOVL1—elongation
  of very-long-chain fatty acids protein 6 and 1, respectively; ACAT2 (Acyl-CoA:Cholesterol
  Acyltransferase 2)—with a dark green colour, marks the cholesterol esters’ synthesis
  pathway; ELOVL1—light purple colour, marks the phospholipids’ synthesis pathway;
  yellow boxes—substrates for glycolysis, biosynthesis of unsaturated fatty acids,
  and triglyceride synthesis (created in https://BioRender.com)'
