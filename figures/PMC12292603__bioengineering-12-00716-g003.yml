caption: '(A) Results of nuclear hepatobiliary imaging of the gallbladder of guinea
  pigs in the SHAM group (0–90 min); (B) results of nuclear hepatobiliary imaging
  of guinea pigs in the LIPUS group (0–90 min). (C,D) Trends in the radioactivity
  counts of gallbladder 99mTC-HIDA in the biliary system of the SHAM and LIPUS groups.
  (E) Gallbladder-emptying fraction in the SHAM and LIPUS groups (p < 0.05), with
  statistically significant differences. Circles in the figure highlight the metabolic
  pathway of bile between the liver and gallbladder. These marked areas emphasize
  the critical transport routes involved in bile metabolism, secretion, and storage.
  LIPUS: low-intensity pulsed ultrasound group; SHAM: sham irradiation group. Statistical
  significance is indicated as follows: *** p < 0.001 compared to control group or
  as indicated by bars'
