figure_title: Functional enrichment analysis of gDTUs in 293T and A549 cells.
caption: 'Functional enrichment analysis of gDTUs in 293T and A549 cells. (A) Distribution
  of alternative splicing (AS) events by type in 293T and A549 cells under baseline
  conditions. (B) Distribution of AS events in 293T cells overexpressing ADORA3 and
  A549 cells overexpressing P2RY12. (C) Blue dots show genes with down-regulated expression,
  and red dots show genes with up-regulated expression; GO enrichment analysis of
  gDTUs between 293T and A549 cells under baseline conditions. (D) GO enrichment analysis
  of gDTUs in 293T cells overexpressing ADORA3 and A549 cells overexpressing P2RY12.
  (E) KEGG pathway enrichment analysis of gDTUs in 293T and A549 cells. (F) KEGG pathway
  enrichment analysis of gDTUs in cells overexpressing ADORA3 and P2RY12. (G) Overlap
  of gDEGs and gDTUs by splicing event type in baseline 293T and A549 cells. (H) Distribution
  of overlapping gDEG-gDTUs by splicing type in cells overexpressing GPCRs. (Gene
  ratio: The color gradient indicates different ranges of p.adjust values, reflecting
  the significance of enrichment. Count: The range of counts displayed is 50 to 200,
  representing the number of genes enriched in each pathway; larger circles indicate
  a higher number of enriched genes.)'
article_title: Long-Read Sequencing Reveals Cell- and State-Specific Alternative Splicing
  in 293T and A549 Cell Transcriptomes
