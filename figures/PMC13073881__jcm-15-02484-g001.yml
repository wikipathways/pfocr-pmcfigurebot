figure_title: Overview of clinical challenges and artificial intelligence applications
  across the hepatocellular carcinoma care pathway.
caption: 'Overview of clinical challenges and artificial intelligence applications
  across the hepatocellular carcinoma care pathway. The upper panel depicts the four
  principal challenges facing AI development in HCC: late presentation in the setting
  of pre-existing chronic liver disease, atypical imaging appearance, imaging mimics
  including intrahepatic cholangiocarcinoma, combined hepatocellular-cholangiocarcinoma,
  and metastases, and histological heterogeneity. The lower panel maps the four major
  AI application domains: risk stratification integrating EHR, laboratory, and imaging
  inputs to generate individualized risk scores; imaging surveillance across ultrasound,
  CEUS, and multiphase CT and MRI for lesion detection and characterization; pathology
  AI incorporating histology and biomarkers for tumor classification, molecular inference,
  and staging; and therapy response prediction using multimodal inputs to estimate
  recurrence and survival across clinically meaningful risk strata. Abbreviations:
  AI, artificial intelligence; CEUS, contrast-enhanced ultrasound; cHCC-CCA, combined
  hepatocellular-cholangiocarcinoma; CT, computed tomography; EHR, electronic health
  record; HCC, hepatocellular carcinoma; iCCA, intrahepatic cholangiocarcinoma; MRI,
  magnetic resonance imaging'
