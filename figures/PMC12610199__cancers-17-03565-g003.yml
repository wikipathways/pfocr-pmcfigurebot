figure_title: Differentially expressed genes regulated by epigenetic–transcriptomic
  mechanisms in inflamed and non-inflamed groups.
caption: Differentially expressed genes regulated by epigenetic–transcriptomic mechanisms
  in inflamed and non-inflamed groups. (a) Volcano plot illustrating gene expression
  differences between inflamed group and non-inflamed group, which represent the most
  distinct immune environments (log2FC > 2, FDR < 0.001). (b) Venn diagram displaying
  the number of genes specifically expressed in each group. (c) Bar plot presenting
  pathway enrichment analysis of genes expressed in the inflamed and non-inflamed
  groups. The intensity of the bar color increases with higher enrichment scores.
  (d) Heatmap of expression patterns for immune gene sets in the two groups. (e) Volcano
  plot illustrating probes with the greatest differences in methylation levels between
  inflamed group and non-inflamed group, representing the most distinct immune environments
  (log2FC > 2, FDR < 0.001). (f) Venn diagram displaying the number of genes identified
  as significant in both DEG and DMP analyses
