figure_title: The influence of vitamin B1 on the level of oxidative stress (according
  to [30,40,54]).
caption: The influence of vitamin B1 on the level of oxidative stress (according to
  [30,40,54]). Thiamine deficiency inhibits PDC activity and contributes to the accumulation
  of pyruvate and the deficiency of acetyl-CoA. The latter is used to convert oxaloacetate
  to citrate in the Krebs cycle. Pyruvate accumulation causes activation and stabilization
  of HIF-1, thereby increasing NF-κB and TNF-α levels and the inflammatory response.
  Thiamine deficiency also inhibits TKT activity, which, by blocking the supply of
  non-oxPPP metabolites to ox-PPP, decreases NADPH levels. This NADPH is used to maintain
  normal GSH and TRX levels, and its deficiency impairs the ability of cells to neutralize
  ROS and RNS. The decrease in αKGDH activity caused by B1 deficiency limits NADH
  production, leading to increased ROS and activates eNOS, which increases RNS. Inhibition
  of 2-HALC activity in the α-oxidation process during vitamin B1 deficiency contributes
  to the accumulation of phytanic acid, which stimulates eNOS activity, while increasing
  RNS levels use glutathione reserves. ROS—reactive oxygen species, RNS—reactive nitrogen
  species, eNOS—endothelial nitric oxide synthase, 2-HACL—2-hydroxyacyl-CoA Lyase,
  NAD+/NADH—nicotinamide adenine dinucleotide, NADP+/NADPH—nicotinamide adenine dinucleotide
  phosphate, αKGDH—α-ketoglutarate dehydrogenase, CoA—coenzyme A, acetyl-CoA-acetyl
  coenzyme A, PDC—pyruvate dehydrogenase, HIF-1—hypoxia-induced factor-1α, NF-κB—nuclear
  factor kappa-B, TNF-α—tumor necrosis factor-α, GPI—glucose-6-phosphate isomerase,
  oxPPP—oxidative branch of the pentose–phosphate pathway, Non-oxPPP—non-oxidative
  branch of the pentose–phosphate pathway, G6PD—glucose-6-phosphate dehydrogenase,
  6PGD—6-phosphogluconate dehydrogenase, GR—glutathione reductase, GSH—glutathione,
  GSSG—glutathione disulfide, TRX—thioredoxin, TRX(ox)—oxidized thioredoxin, TRXR—thioredoxin
  reductase, TKT—transketolase; Red color—chemical compounds whose deficiency occurs
  with vitamin B1 deficiency
