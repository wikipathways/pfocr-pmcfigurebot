figure_title: TM treatment decreases H3K4me3 occupancy at key developmental genes
  and oncogenes
caption: A. Genome wide Heat maps for H3K4me3, H3K27ac and H3K27me3 with and without
  TM treatment. TM treatment decreases H3K4me3 occupancy (left panel), slightly increases
  H3K27ac occupancy and has little effect on H3K27me3 occupancy. B. Pathway analysis
  of genes associated with H3K4me3 depletion and enrichment of H3K27ac after TM treatment.
  C. Peak visualization at MYC and MEF2A showing depletion of H3K4me3 at promoters.
  D. Peak visualization at SMARCA4 and NFIB show enrichment of H3K27ac at promoters
  of these pro-differentiation genes
