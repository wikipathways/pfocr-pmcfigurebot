figure_title: Network pharmacology analysis of TQ in the treatment of AMS.
caption: Network pharmacology analysis of TQ in the treatment of AMS. (a) Venn diagram
  showing the overlapping targets between AMS-related genes and TQ-related targets.
  (b) KEGG pathway enrichment analysis of the 70 overlapping targets. The top 15 enriched
  signaling pathways are shown. (c) PPI network of overlapping targets. Node size
  and color reflect degree centrality, with hub genes highlighted. (d) Core gene subnetwork
  extracted from the PPI network, identifying key genes with the highest degree values.
  (e) Compound–target interaction network. Blue nodes represent active compounds,
  yellow nodes indicate potential therapeutic targets, and gray edges denote predicted
  interactions. For clarity of presentation, chemical components are labeled with
  numbers in the figure; detailed information is provided in Table S1
