figure_title: Metabolite Profiles of F.
caption: Metabolite Profiles of F. violacea Samples. (A) Relative abundance of natural
  product biosynthetic pathways. The intensities of metabolites within each biosynthetic
  pathway were grouped and summed. Metabolites classified into more than one biosynthetic
  pathway were grouped under their primary pathway classification and labeled as hybrids.
  (B) Relative abundance of terpenoid superclasses. (C) Relative abundance of amino
  acid and peptide superclasses. (D) Relative abundance of alkaloid superclasses.
  For each superclass, the intensities of metabolites within the respective superclass
  were grouped and summed. Metabolites classified into more than one superclass were
  grouped under their primary superclass classification and labeled as hybrids. NP
  = natural product
article_title: Untargeted Metabolomics Reveals Organ-Specific and Extraction-Dependent
