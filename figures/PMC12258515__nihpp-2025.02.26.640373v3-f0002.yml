figure_title: Profiling the interactomes of wild-type SHP2
caption: '(A) Schematic diagram of SHP2-TurboID experiments. TurboID generates reactive
  biotin derivatives, which label substrates, interactors, and co-localized proteins.
  MS/MS can be used to detect and quantify the interactome. (B) top: Comparison of
  SHP2WT-TurboID with a TurboID-only control, in absence of EGF stimulation. Several
  known SHP2 interactors were identified, including proteins that are completely absent
  from the TurboID control. Gaps in the x-axis exclude non-significant points. Points
  at extreme x-values reflect proteins that were abundant in all SHP2-TurboID replicates
  and completely absent (imputed) in the TurboID-only control, or vice versa. Bottom:
  Analysis of the total number of potential phosphoproteins, as identified by PhosphoSitePlus,
  per total number of observed proteins above each fold-change threshold. (C) Same
  as (B) but with EGF stimulation. (D) top: Comparison of SHP2WT-TurboID in unstimulated
  and EGF-stimulated conditions. Proteins involved in transcription, spliceosome,
  and the EGF pathway are indicated. Bottom: Analysis of the total number of potential
  phosphoproteins, as identified by PhosphoSitePlus, per total number of observed
  proteins above each fold-change threshold, for SHP2WT-TurboID with and without EGF
  stimulation. (E) Heatmaps depicting position-specific weight matrices for peptide
  recognition by the SHP2 N-SH2 and C-SH2 domains. (F) Predicted scores for binding
  to the N-SH2 and C-SH2 domains for all phosphotyrosine sites in PhosphoSitePlus
  (gray dots). Phosphosites on several known interactors are labeled (red dots). (G)
  Predicted scores for binding to the N-SH2 and C-SH2 domains for all phosphosites
  on proteins in our proteomics dataset (gray dots). Phosphosites on proteins in the
  SHP2WT interactomes are colored in blue (no EGF) and dark red (+EGF)'
