figure_title: ERα36 is involved in BSA-E2-induced activation of the Wnt/β-catenin
  pathway to modulate MDR1 expression.
caption: ERα36 is involved in BSA-E2-induced activation of the Wnt/β-catenin pathway
  to modulate MDR1 expression. (A) Cells were pretreated with 100 nM of BSA-E2 for
  6−24 h, and the β-catenin protein level was determined by Western blot. (B) MDR1
  expression was evaluated in cells pretreated with the Wnt/β-catenin inhibitor, FH-535
  (1 µM) for 1 h and 100 nM of BSA-E2 for 24 h. (C) Cells were treated with 100 nM
  of BSA-E2 for 5−60 min, and the phosphorylation of GSK3β was determined by Western
  blot. (D) Control and ERα36-knockdown cells were treated with 100 nM of BSA-E2 for
  24 h. p-GSK3 and GSK3β protein levels were analyzed by Western blot
