figure_title: mRNA vaccination induces coordinated transcriptional responses at the
  injection site.
caption: 'mRNA vaccination induces coordinated transcriptional responses at the injection
  site. (A) Overview of the experimental design (see also Figure 1A and Figure 2A).
  Macaca fascicularis fed a regular chow diet (RMF) received three mRNA vaccine doses
  at 14-day intervals and were sacrificed 2 days after the final injection. Mice on
  either a regular chow diet (RCD; RMM) or a Western diet (WD; WMM) received two vaccine
  doses and were sacrificed 48 h after the second injection. (B) Principal component
  analysis (PCA) of pre- and post-vaccination transcriptomes in RMF, RMM, and WMM
  groups. Only pathways with p < 0.01 were included. (C) Enrichment map showing KEGG
  pathways across groups; nodes represent significantly enriched pathways (p < 0.01),
  edges indicate shared DEGs. Pathways are color-coded by category: immune (yellow),
  mitochondrial (green), cardiomyopathy-related (blue), and metabolic (violet). (D)
  Pathway analysis showing upregulated immune and apoptosis genes, and downregulated
  mitochondrial electron transport chain (ETC) genes. In KEGG annotations, pro- and
  cleaved caspases are annotated separately; in our dataset, transcripts for CASP1
  and CASP9 were grouped due to shared identifiers. (E)'
article_title: ApoE deficiency protects from mRNA vaccine-induced mitochondrial dysfunction
