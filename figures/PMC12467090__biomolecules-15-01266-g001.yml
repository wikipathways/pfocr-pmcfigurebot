figure_title: IPMK’s biochemical and enzymatic function.
caption: IPMK’s biochemical and enzymatic function. (A) IPMK exhibits lipid kinase
  activity, facilitating the conversion of PIP2 to PIP3 [15], which can also be catalyzed
  by class I PI3Kinase (PI3K). (B) In the HOIP pathway, Ins(1,4,5)P3 is generated
  from PIP2 via PLC [16]. This InsP3 can be further converted into Ins(1,4,5,6)P4
  by IPMK or into Ins(1,3,4,5)P4 by IP33K [16]. Additionally, glucose-6-phosphate
  can be transformed into Ins3P, which is subsequently utilized by ITPK1 to produce
  Ins(1,3,4,5)P4 [16]. Both Ins(1,4,5,6)P4 and Ins(1,3,4,5)P4 are then processed by
  IPMK to form Ins(1,3,4,5,6)P5 [16]. Finally, IPPK converts Ins(1,3,4,5,6)P5 into
  Ins(1,2,3,4,5,6)P6, which serves as a substrate for IP6K to generate 5-InsP7. The
  5-InsP7 can subsequently be converted into 1,5-InsP8 [16]
