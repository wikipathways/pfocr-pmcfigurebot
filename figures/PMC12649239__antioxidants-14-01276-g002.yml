figure_title: The cGAS–STING pathway mediates priming signals for NLRP3 inflammasome
  activation.
caption: The cGAS–STING pathway mediates priming signals for NLRP3 inflammasome activation.
  THP-1-derived macrophages were co-treated with rotenone (100 µM) in the presence
  or absence of the STING inhibitor H151 (10 µM) for 6 h. (A) Nuclear fractionation
  was performed, and nuclear NF-κB levels were analyzed by Western blotting. Lamin
  B1 was used as a nuclear loading control. (B) NLRP3 mRNA expression was analyzed
  by qRT-PCR and normalized to GAPDH. (C) Protein levels of cGAS, p-STING, NLRP3,
  ASC, p-TBK1, and GSDMD were analyzed by Western blotting. Quantification of band
  intensities is shown in the right panels. (D) Nuclear NF-κB levels were assessed
  by Western blotting using nuclear extracts. Lamin B1 was used as a nuclear loading
  control. (E) NLRP3 mRNA expression was quantified by qRT-PCR and normalized to GAPDH.
  (F) IL-1β secretion was measured by ELISA. Data are presented as the mean ± SD (n
  = 3). Statistical significance was determined by one-way ANOVA followed by Tukey’s
  post hoc test. * p < 0.05, ** p < 0.01, *** p < 0.001
