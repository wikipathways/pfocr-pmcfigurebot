figure_title: Colocalized eQTL-GWAS networks reveal directed regulatory cascades and
  convergence on disease genes
caption: a, Trait-specific dependence of eQTL-GWAS colocalization counts, highlighting
  the strongest overlap for immune and cell-type-composition traits. b, Distribution
  of GWAS signal colocalizations across major trait categories for cis- and trans-eQTLs.
  c, A cis-eQTL for EEPD1 colocalizes with trans-eQTLs for ABCA1, SREBF1, and SQLE,
  which are key regulators of lipid metabolism. Colocalization posterior probabilities
  (PP4) and Mendelian randomization analyses (MR α) support a directional effect from
  EEPD1 to its targets. d, The product of zinc transporter encoding gene SLC39A10
  regulates SLC30A1 and the metallothionein-encoding genes MT1X and MT2A through trans-eQTLs,
  forming a zinc homeostasis network. e, The signal transducer encoding gene STAT2
  exerts trans-effects on multiple interferon-stimulated genes (OAS2, OAS3, IFI6,
  and IFI44), reconstructing the canonical interferon pathway. f, Example of LDL cholesterol
  (LDL-C)-associated variants converging on ABCA1 through direct cis-eQTL-mediated
  and indirect trans-eQTL-mediated regulatory paths. Where available, edges are annotated
  with the most significant concordant single-cell eQTL Z-score and cell type from
  sc-eQTLGen23
