figure_title: Potential model for persulfide delivery regulation by ATP
caption: Pathway A represents a scaffold model where DTT reduces the SufB persulfide
  to generate sulfide locally. This sulfide could then be used with exogenous iron
  to assemble a cluster on the SufBC2D scaffold while bypassing any in vivo mechanistic
  requirements. Pathway B represents a possible catalytic model where ATP and FADH2
  are required for sulfide transfer to the cluster assembly site within the SufB cavity
article_title: Characterization of a mechanistic connection between persulfide transfer
  and ATP hydrolysis in the SufBC2D scaffold of the Suf Fe-S cluster assembly pathway
