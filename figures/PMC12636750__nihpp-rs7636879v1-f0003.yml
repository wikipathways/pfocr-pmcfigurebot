figure_title: Summary of energy metabolism in neuronal and glial cells.
caption: 'Summary of energy metabolism in neuronal and glial cells. Each enrichment
  test has the number of DEGs in parentheses in the full list, the normalized enrichment
  score is negative for all comparisons. (a, b, e, f, g): enrichment plots in glia
  and neurons of the WikiPathway for Glycolysis and Gluconeogenesis in (a) Astrocytes,
  (b) Oligodendrocytes, (e) L3–5 IT neurons, (f) Lamp5 neurons, and (g) Pvalb neurons.
  (c, d, h): enrichment plots in glia and neurons of the curated Glycolysis only genes
  in, (c) Astrocytes, (d) Oligodendrocytes, and (h) Pvalb neurons. (i) through (o):
  enrichment plots of TCA cycle genes (p-value <= 0.05), (i) Excitatory neurons, (j)
  Inhibitory neurons, (k) Glia cells, (l) L3/5-IT neurons, (m) Lamp5 neurons, (n)
  Pvalb neurons, (o) Vip neurons. The maximally significant enrichment of the TCA
  cycle gene-set was seen in the inhibitory neurons, when considered altogether, followed
  by glial cells when considered altogether'
