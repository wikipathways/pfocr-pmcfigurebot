figure_title: Cest-2.1 is required for octopamine glucosides and octopamine-dependent
  behaviors
caption: a, Structures of a subset of modular glucosides identified in C. elegans
  with emphasis on the 1° head group moieties. b, Cartoon depicting measurement of
  aversive olfactory latency in C. elegans, referred to as the “smell-on-a-stick”
  SOS assay. Animals are presented with an odorant in front of the nose and the time
  until a reversal behavior occurs is recorded. Monoamine pathways that either promote
  reversals (dopamine, serotonin) or inhibit reversals (octopamine) are depicted.
  c, e, f, SOS reversal latency of animals of the indicated genotypes in response
  to 33% octanol following 20 minutes of food removal. Each dot indicates an independent
  assay performed on separate days with at least 20 animals each. Error bars are SEM.
  Top *** and *, p<0.001 and p<0.05 relative to WT, respectively. Bottom in (f) ***,
  p<0.001 relative to WT in the genetic background of the indicated monoamine biosynthesis
  mutant. n.s. not significant. ANOVA with TUKEY post hoc correction. d, Relative
  abundance of various putative modular glucosides identified via HPLC-MS in animals
  of the indicated genotypes. Each bar indicates the abundance (area under the HPLC-MS
  curve) of an individual metabolite in either cest-1.2 mutants (top) or cest-2.1
  mutants (bottom), relative to levels found in WT animals. Color indicates the putative
  molecular identity of the ‘head group’ or the chemical group linked to the anomeric
  (1°) carbon of glucopyranose. Error bars indicate SEM of 4 independent replicates
