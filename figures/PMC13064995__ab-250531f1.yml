figure_title: Functional enrichment analysis of heat stress-induced transcriptomic
  changes in reproductive cells of female cattle.
caption: Functional enrichment analysis of heat stress-induced transcriptomic changes
  in reproductive cells of female cattle. Heat stress-induced transcriptional and
  functional responses across the female reproductive tract were analyzed using an
  integrated re-analysis of publicly available multi-omics datasets (GSE66057, GSE221895,
  GSE235170, and GSE235171) along with published data [97–101]. Functional enrichment
  analyses were performed on differentially expressed genes (DEGs) identified in each
  cell type under heat stress conditions. (A) Upregulated functions in cumulus cells
  following heat stress, highlighting pathway enrichment related to cytoskeletal remodeling
  (actin filament-based processes, cell projection organization), integrin-mediated
  adhesion, and ephrin signaling, including key GTPase cycles (RHOA, RAC1, CDC42)
  that may impact cumulus-oocyte complex (COC) integrity. (B) Upregulated functions
  in oviductal epithelial cells under heat stress, showing prominent activation of
  innate immune responses, such as neutrophil chemotaxis, defense response, IL-17,
  and TNF signaling pathways. (C) Downregulated functions in oviductal epithelial
  cells upon heat stress, indicating broad suppression of molecular chaperones (HSP70,
  HSP90, α-crystallin) and their upstream regulators (HSF1, TP53, NRF2), as well as
  reduced steroid hormone receptor signaling, with potential impairment of protein
  homeostasis and epithelial integrity. (D) Upregulated functions in endometrial epithelial
  cells exposed to heat stress, demonstrating pronounced activation of inflammation
  (TNF, IL-17 signaling), cell death pathways, and immune activation, ultimately compromising
  epithelial homeostasis. (E) Downregulated functions in endometrial epithelial cells
  following heat stress, including pathways related to angiogenesis, cellular differentiation,
  extracellular matrix remodeling, and hormone signaling, which are associated with
  impaired endometrial receptivity and increased risk of implantation failure. Each
  node represents an enriched biological subfunction defined by DEGs, and each edge
  indicates a functional connection based on shared genes between subfunctions. Network
  was generated by Metascape (https://metascape.org/)
