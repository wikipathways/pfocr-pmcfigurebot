figure_title: Mesenchymal progenitors in CDH upregulate genes for ECM composition
  and molecules involved in pathways important for branching morphogenesis in CDH
  lung.
caption: Mesenchymal progenitors in CDH upregulate genes for ECM composition and molecules
  involved in pathways important for branching morphogenesis in CDH lung. (A) Heatmap
  of mesenchymal progenitors at E17 highlighting differential gene expression between
  CDH and normal lung. (B-C) In CDH, mesenchymal progenitors have increased production
  of ECM composition molecules such as laminins, decorin, elastin, fibrin, fibrillin,
  integrins, lumican, and multiple collagens. (D) Proteins important in TGFβ regulation
  and signaling (Smad1 and Ltbp3/4), (E) Robo pathway (Robo2 and Slit 2/3), and (F)
  Wnt and NOTCH signaling (Sfrp1/2, Fzd1, Dlk). (G) Representative images of H&E,
  Verhoeff’s Van Gieson (EVG), and Masson’s Trichrome (Masson Tri) for normal and
  CDH tissue at E17. E17 CDH tissue displays a more pronounced elastin composition
  as demonstrated by the darker appearance of the stain, compared to normal. The same
  is demonstrated for trichrome staining, with E17 CDH tissue showing an upregulation
  in collagen fibers (blue). Scale bars for individual images and respective insets
  are reported on each panel
