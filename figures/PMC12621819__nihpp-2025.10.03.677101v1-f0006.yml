figure_title: IFNLR1 variants differentially influence constitutive and IFNL3-induced
  ISG expression
caption: Heat map of RNA-seq data showing column-normalized expression for the 35
  IFNL3-induced DEGs identified in the “Interferon alpha beta signaling” pathway in
  WT-iHeps expressing FLAG-Iso1 relative to EV (−dox, + IFNL3) shown in (A) WT and
  (B) KO iHep samples with dox and IFNL3 treatment as indicated. Rows depict individual
  biological duplicate samples clustered by cell line and treatment; red indicates
  higher expression and blue represents lower expression (C-D) Relative expression
  of select genes (MX1, IFITM1, IFITM3) evaluated by qRT-PCR relative to GAPDH in
  WT (C) and KO (D) iHeps showed correlation with RNA-seq data. Data are representative
  of two biological replicates assayed in technical duplicates relative to GAPDH.
  Mean ± SEM, *p≤0.05 by Student’s t-test
