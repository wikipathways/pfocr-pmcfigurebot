figure_title: The HPA axis stress pathway and its epigenetic regulation.
caption: The HPA axis stress pathway and its epigenetic regulation. Solid black arrows
  indicate excitatory endocrine signaling along this cascade. Early-life stress (ELS)
  activates paraventricular nucleus (PVN) neurons in the hypothalamus to release corticotropin-releasing
  hormone (CRH) and arginine vasopressin (AVP) to the anterior pituitary, where they
  promote adrenocorticotropic hormone (ACTH) secretion. ACTH then stimulates glucocorticoid
  (cortisol) release from the adrenal cortex. Cortisol then acts on glucocorticoid
  receptors (GRs) and mineralocorticoid receptors (MRs) throughout the body, leading
  to increased transcription of stress response genes. Blunt-ended lines represent
  negative feedback. Transcriptional regulation direction is indicated by up and down
  arrows beside the effected protein. This is shown as eventually rising cortisol
  via GRs/MRs in the hypothalamus and anterior pituitary, which inhibits further CRH
  and ACTH release, regulating the stress response. FKBP5 demethylation is an epigenetic
  modification seen in both ASD and ELS. It leads to increased FKBP5 binding protein
  levels, increasing its negative feedback (blunted line) on GR in the limbic and
  cortical regions. This reduces GR sensitivity and GABAergic inhibition of the PVN,
  increasing CRH and ACTH release and contributing to dysregulation of the stress
  response
article_title: The Convergence of Early-Life Stress and Autism Spectrum Disorder on
  the Epigenetics of Genes Key to the HPA Axis
