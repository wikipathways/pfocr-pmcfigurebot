figure_title: TMM expression varies with stemness at the single-cell level.
caption: TMM expression varies with stemness at the single-cell level. (A) t-SNE plots
  illustrating the distributions of T cells, macrophages, tumor cells, and oligodendrocytes,
  with stemness levels inferred using the StemID algorithm for the adult GBM dataset.
  UMAP-based clustering of tumor cells from adult and pediatric samples, highlighting
  stemness-enriched populations. Dimensionality reduction and unsupervised clustering
  were performed on single-cell transcriptomic data from adult (left) and pediatric
  (right) tumor samples. Each point represents a single cell, colored by cluster identity
  (numerical labels indicate cluster numbers). Notably, clusters highlighted in royal
  blue correspond to populations with the highest stemness scores, indicating elevated
  self-renewal and plasticity. These royal-blue clusters are positioned centrally
  in the adult cohort and more dispersed yet interconnected in the pediatric group,
  suggesting distinct topological organizations of stem-like cell populations between
  age groups. (B) t-SNE plots showing the same cell types and inferred stemness levels
  for the pediatric GBM dataset. (C) Box plots comparing the SIG100 and telomere maintenance
  mechanism (TMM) activity across the StemID clusters for the adult samples. (D) Box
  plots of the SIG100 and TMM activity across the StemID clusters for the pediatric
  samples. (E) Gene-ontology network diagrams of the pathways enriched in the high-entropy
  cells for the adult (left) and pediatric (right) datasets
