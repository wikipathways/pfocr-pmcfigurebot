figure_title: Cellular responses to mitotic errors
caption: Mitotic error response pathways. Mitotic clocks (top) respond to abnormally
  short or long mitotic durations. The PIDDosome (top right) identifies whole-genome
  doubling by detecting supernumerary centrioles. The DNA-damage response (bottom
  right) recognizes DNA insults caused by both mechanical stress (ie. cytokinesis
  damage) or replication stress induced by protein-dosage imbalances. Multiple innate
  immunity and proteotoxic pathways (bottom left) respond to both protein misfolding
  and cytosolic DNA. Cell death is driven by loss of essential genes (top left) resulting
  from severe aneuploidy
article_title: Biological clocks keep mitosis on watch
