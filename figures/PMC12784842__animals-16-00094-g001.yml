figure_title: Putative mechanisms of cellular stress due to nanoplastics (NPs) exposure
  in fish sperm cells.
caption: 'Putative mechanisms of cellular stress due to nanoplastics (NPs) exposure
  in fish sperm cells. NPs may cross the blood–testis barrier, triggering oxidative
  stress, inflammation, and the activation of intracellular necrotic and apoptotic
  pathways, ultimately impairing spermatogenesis. In fish, research on the cytotoxic
  effects of NPs in sperm cells remains limited and is generally restricted to a few
  laboratory model species (see Table 1). Furthermore, although canonical stress-related
  signaling pathways are broadly conserved across vertebrates, key components and
  their effectiveness may vary among fish species. From the studies in fish and mammalian
  model species, the minimum common set of molecular alterations in fish sperm cells
  in response to internalized NPs, as illustrated in the figure, includes: (i) the
  generation of reactive oxygen species (ROS) and pro-inflammatory mediators; (ii)
  the activation of PPARγ/RIPK3 signaling pathways involved in necrotic and apoptotic
  signaling; and (iii) the participation of p53, and JNK/p38 MAPK signaling in pro-apoptotic
  pathways. Upon NPs exposure, nuclear factor-κB (NF-κB) enhances the synthesis of
  pro-inflammatory cytokines (such as interleukin 1, IL-1β; and tumor necrosis factor
  alpha, TNFα) which may induce oxidative stress, DNA damage (with concomitant p53
  activation), and malformations in mature sperm cells. ROS production further upregulates
  p53 expression, which in turn activates genes encoding cell cycle arrest factors
  and mediates Bax/Bcl-2-dependent permeabilization of the mitochondrial outer membrane,
  leading to mitochondrial damage and cytochrome c (Cyt C) release to initiate caspase-dependent
  apoptotic signaling. Additionally, p53 activation facilitates Ca2+ accumulation
  in the endoplasmic reticulum, augmenting the pro-apoptotic calcium effects in the
  mitochondria. JNK/p38 MAPK signaling pathways, primarily activated by environmental
  stressors and oxidative stress, regulate cellular responses to inflammatory factors,
  and may also induce the apoptosis machinery by modulating the expression of other
  apoptotic regulators, including p53, Bcl-2, and caspases. NPs exposure usually alters
  the metabolism of lipids and steroidogenic hormones mediated by the activation of
  the peroxisome proliferator-activated receptor (PPAR) signaling pathway, potentially
  inducing dysgenesis during sperm-cell development. The reciprocal regulation between
  receptor-interacting protein kinase 3 (RIPK3) and PPARγ influences the onset of
  programmed necrotic or apoptotic signaling cascades, contributing to inflammatory
  processes. Combined with endocrine disruptors and other contaminants, the exposure
  to NPs may also alter the epigenome of germ cells, impairing the developmental pathways'
