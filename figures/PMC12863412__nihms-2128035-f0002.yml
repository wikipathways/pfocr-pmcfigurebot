figure_title: Fatty acids are incorporated into cell envelope proteins via the lipoprotein
  processing pathway
caption: (A) Following export, primarily by the Sec secretion system, proteins are
  targeted for lipoprotein processing via a lipobox motif (dark grey fill) containing
  a conserved cysteine. In the first committed step, Lgt modifies the Cys sidechain
  with a diacylglyceryl group via a thioether linkage (blue). LspA cleaves the signal
  peptide, leaving the Cys as the N-terminal residue (green). Lnt couples the amino
  terminus to a fatty acid (red), yielding the final N-terminally triacylated protein.
  The lipobox motif and phosphatidylglycerol (for Lgt) and phosphatidylethanolamine
  (for Lnt) donors are presumed based on the canonical bacterial lipoprotein biosynthesis
  pathway32. Fatty acid chains (16:0; 19:0) are shown as reported for phosphatidylglycerol33
  and presumed for phosphatidylethanolamine. One of two possible configurations for
  glycerol modification is displayed and tuberculostearic acid is depicted as the
  most likely assignment for 19:0. (Signal peptide, chemical structures, and proteins
  are not to scale relative to the plasma membrane.) (B) Structures of modified fatty
  acids used in this study with commercial names and in-text abbreviations (bold)
