figure_title: Direct pathway inhibition shifts ACC activity towards ipsilateral-evidence
  representations
caption: 'a, Average evidence vs. laser coefficients across cue and delay positions
  in the task for all ACC neurons in direct pathway mice (grey dots; n = 1449 neurons
  from 14 sessions). Black line: Spearman rank correlation; r = 0.12; p < 0.001. b,
  Averaged laser coefficients at each position in the task for all ACC neurons that
  showed significant tuning for ipsilateral evidence (salmon; n = 111), contralateral
  evidence (aqua; n = 130), or neurons without significant tuning to evidence or choice
  (black, n = 750). c, Evidence tuning curves for all ACC neurons with significant
  evidence-tuning, parsed by ipsilateral- (left) or contralateral (right) preference.
  For each neuron, z-scored activity was averaged in all cue and delay positions across
  trials binned by sensory evidence level, separately for laser off (black) or on
  (orange) trials. Statistics reflect significance of a linear mixed-effects model
  (ipsilateral: plaser<0.01; contralateral: plaser=0.72). d, Cross-validated projection
  of ACC population activity onto a one-dimensional evidence decoding axis at each
  position in the maze (n = 12 sessions with more than 50 neurons), and then averaged
  across laser off trials binned by their sensory evidence level. e, Same as d, but
  for the averaged evidence-axis projection across all held-out laser off (black)
  or on (orange) trials. Positive (or negative) values (a.u., arbitrary unit) indicate
  greater ipsilateral (or contralateral) evidence representation. f, Similar to c,
  but evidence tuning curves from population activity projected onto the evidence-axis
  (left) or first principle component (PC1)-axis (right). Tuning curves were constructed
  by averaging projected population activity across positions in the cue region and
  trials binned by sensory evidence level (#ipsilateral - #contralateral cues), separately
  for laser off (black) or on (orange) trials. Statistics reflect significance of
  a linear mixed-effects model; evidence axis: plaser<0.001; PC1 axis: plaser=0.46.
  Data are presented as mean ± s.e.m'
