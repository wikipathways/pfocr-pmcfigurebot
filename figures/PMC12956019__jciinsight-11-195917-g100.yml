figure_title: scRNA-Seq suggests that SPP1 neutralization stalls tSC state transitions
  after nerve injury
caption: '(A) UMAP of whole-muscle scRNA-Seq at 7 dpi (IgG vs. SPP1-nAb combined),
  annotated by major cell types, including terminal Schwann cells (tSCs) and an Spp1+
  phagocytic population. (B) Dot plot of canonical markers across annotated populations.
  (C and D) Density maps of IgG-treated (C) and SPP1-nAb–treated (D) cells projected
  onto the same manifold; dashed lines highlight the Spp1+ cells. (E) Reclustering
  of the tSC subset identifies 4 transcriptional states (1 to 4). (F) Pseudotime ordering
  of tSCs with inferred trajectory (black arrow), indicating progression toward a
  late state and return toward a homeostatic node. (G) Pseudotime distributions by
  treatment reveal a significant left shift in SPP1-nAb–treated cells (2-tailed unpaired
  Student’s t test; P < 0.001), consistent with a stall in state progression. (H)
  GO pathway heatmap (z scored within term) across tSC states. Early Cluster 1: axon/neuron
  guidance and PI3K/AKT; Cluster 3: ECM organization/adhesion and TGF-β; Cluster 4:
  glial maturation/ensheathment; Cluster 2: neural-crest/motility. Purple ticks indicate
  pathways unique to a single state. (I) Aggregated, scaled expression heatmap (genes
  × clusters) for state-defining markers with callout labels'
