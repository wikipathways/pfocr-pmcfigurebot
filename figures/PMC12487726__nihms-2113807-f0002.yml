figure_title: Previously proposed role, currently proposed role, phylogeny, and structural
  analysis of PKAL-1
caption: a, The previously proposed model for the trafficking step in the nemamide
  pathway in which PKAL-1 was proposed to load the β-amino-containing nematide A (3)
  onto NRPS-1. Only a portion of PKS-1 and NRPS-1 are shown, and the domains are numbered
  according to the order of their appearance in PKS-1 and NRPS-1. b, A possible alternative
  model for the role of PKAL-1 in the pathway based on the data obtained in the current
  work. a, b, * In the proposed models, we hypothesize that nematide B (4) is likely
  also produced, but this metabolite has not yet been isolated or characterized. c,
  Phylogenetic analysis of PKAL-1 and other members of the ANL superfamily. d, Active
  site in the AlphaFold model of the PKAL-1 structure, with the ABA-AMP intermediate
  from the IdnL1 crystal structure modeled into the active site. e-g, Active sites
  of crystal structures of adenylation enzymes that load β-amino substrates, including
  VinN with L-aspartate (e), IdnL1 with the ABA-AMP intermediate bound (f), and CmiS6
  crystal structure without a bound ligand (g)
