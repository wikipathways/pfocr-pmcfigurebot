figure_title: Effects of hyperglycaemic microenvironment on the activation of microglia.
caption: 'Effects of hyperglycaemic microenvironment on the activation of microglia.
  Diabetes leads to elevated blood glucose levels, which activate several metabolic
  pathways: the polyol pathway, hexosamine pathway, PKC-β/δ pathway, AGE accumulation
  and ANG-II signalling. These pathways converge to activate NF-κB and increase ROS
  production. The interplay between NF-κB and ROS creates a positive feedback loop,
  further amplifying the inflammatory response. This results in the release of pro-inflammatory
  cytokines such as IL-6, TNF-α and IL-1β, ultimately promoting M1 polarization of
  immune cells and impairing M2 polarization. AGE, advanced glycation end products;
  ANG-II, angiotensin II; ROS, reactive oxygen species'
