caption: 'Partial metabolic and cellular signaling pathways in ferroptosis: Reactive
  oxygen species (ROS) production and lipid peroxidation are important biochemical
  features of ferroptosis. It is characterized by the accumulation of intracellular
  iron ions, which complement each other. Further, cells have various antioxidant
  systems, which together with lipid peroxidation constitute a dynamic balance and
  control the occurrence of ferroptosis'
