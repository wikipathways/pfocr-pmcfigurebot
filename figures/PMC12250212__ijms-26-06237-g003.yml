figure_title: Schematic overview of current and emerging therapeutic strategies for
  patients with AD or schizophrenia, emphasizing the role of personalized medicine.
caption: Schematic overview of current and emerging therapeutic strategies for patients
  with AD or schizophrenia, emphasizing the role of personalized medicine. The diagram
  is divided into two main sections. The upper section (blue and peach boxes) summarizes
  established and experimental treatments for AD and schizophrenia. On the left (blue),
  cholinesterase inhibitors are shown to enhance cholinergic transmission and provide
  symptomatic relief in AD, while antipsychotics block dopamine D2 receptors to alleviate
  positive symptoms in schizophrenia, with limited efficacy for cognitive and negative
  symptoms. The right side (peach) highlights emerging molecular targets, including
  mTOR and SYK pathways. mTOR inhibition aims to restore autophagy and promote amyloid
  and tau clearance, while SYK regulates microglial phagocytosis; its overactivation,
  especially via the S100B-RAGE axis, can trigger neuroinflammation. The lower section
  (green) illustrates a personalized medicine approach. It begins with consideration
  of glutamate excitotoxicity, which refers to neuronal damage caused by the excessive
  activation of glutamate receptors, primarily NMDARs, leading to pathological calcium
  influx, oxidative stress, and cell death. This is a central mechanism involved in
  neurodegeneration in AD and contributes to synaptic dysfunction in Schizophrenia.
  NMDAR antagonists and modulators are agents that selectively inhibit the activity
  of NMDARs, which are critical for synaptic plasticity, learning, and memory, but
  are involved in excitotoxic neuronal injury when excessively activated. Genomic
  and biomarker assessment is performed to identify the patient’s molecular profile,
  guiding therapy selection. Potential targeted treatments include mTOR inhibitors,
  RAGE inhibitors, metformin, and anti-inflammatory agents. The goal is to optimize
  patient care by tailoring interventions to individual molecular characteristics
