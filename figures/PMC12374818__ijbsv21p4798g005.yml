figure_title: MAZ transcriptionally regulates SETD1B expression in LCSCs.
caption: |-
  MAZ transcriptionally regulates SETD1B expression in LCSCs. (A) Screening of transcription factors that can regulate SETD1B using the JASPER database. (B) NES and p-value of transcription factors associated with stemness enrichment. (C)
  SETD1B enrichment at MAZ binding sites (reads per million). (D) mRNA expression of MAZ in HCCLM3/HepG2 cells and LCSCs. (E) Expression of MAZ proteins in HCCLM3/HepG2 cells and LCSCs. (F) Quantification of MAZ proteins in HCCLM3/HepG2 cells and LCSCs. (G) Enrichment of MAZ in stemness signaling pathway. (H) Expression MAZ in single-cell data (GSE125449). (I) The JASPAR database predicted the binding motif of MAZ. (J) Schematic diagram of dual flourescenece reporter plasmid mutation sites for MAZ and SETD1B. (K) Effects of MAZ on transcriptional activity in wild-type SETD1B versus mutant-type SETD1B. (L) Correlation between SETD1B and MAZ expression levels. (M)-(O) IF staining of MAZ and SETD1B in HCC tissue and LCSCs. ** p < 0.01, *** p < 0.001, ns: no significant difference
