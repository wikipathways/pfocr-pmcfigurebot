figure_title: Metabolic pathway of urea cycle in the liver mitochondria.
caption: 'Metabolic pathway of urea cycle in the liver mitochondria. The sources of
  ammonia in the mitochondria include free ammonia and ammonia generated through the
  catabolism of glutamine and glutamate via the enzymes GLS2 and GDH, respectively.
  Glutamate is transported into the mitochondria through the mitochondrial carriers
  SLC25A22 and Citrin. GDH is activated by ADP and leucine, while it is inhibited
  by GTP. The α-ketoglutarate produced from the GDH reaction enters the TCA cycle.
  CPS1 catalyzes the formation of carbamoyl phosphate from bicarbonate and ammonia,
  a reaction that is activated by NAG. NAG is synthesized by the enzyme NAGS and is
  regulated by the amino acid arginine. OTC facilitates the conversion of ornithine
  and carbamoyl phosphate into citrulline. Additionally, the SLC25A15 (or its paralog
  SLC25A2) transporter (ORNT1) exchanges citrulline and ornithine to maintain the
  continuity of the urea cycle. Final reaction of urea cycle is catalyzed by ARG1
  hydrolyzing arginine into ornithine and urea. OMM: Outer mitochondrial membrane;
  IMM: Inner mitochondrial membrane; NAG: N-acetylglutamate; NAGS: N-acetylglutamate
  Synthase; Leu: Leucine; ADP: Adenosine diphosphate; GDH: Glutamate Dehydrogenase,
  GTP: Guanosine triphosphate; TCA: tricarboxylic acid; CPS1: Carbamoyl Phosphate
  Synthetase 1; OTC: Ornithine transcarbamylase; GDH: Glutamate Dehydrogenase, GLS2:
  Glutaminase 2, ARG1: Arginase 1; ARG2: Arginase 2; ASS: Argininosuccinate synthase;
  ASL: Argininosuccinate lyase'
