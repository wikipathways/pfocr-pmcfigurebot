caption: (A) PCA analysis of the transcriptome of TFH cells isolated from SLE patients
  and HCs.(B) Volcano plot of DEGs upregulated in SLE patients (red) or HC (blue)
  TFH cells.(C and D) Pathways enriched in SLE compared to HC TFH cells, with the
  corresponding heatmap.(E) Overlap of human and murine ortholog DEGs between SLE
  vs. HC (x axis) and W.Yaa vs. B6 (y axis) TFH cells.(F) Overlap of human and murine
  ortholog DEGs in TFH cells from both human and mouse lupus vs. controls (x axis)
  and from 2DG-treated vs. control W.Yaa mice (y axis).See also Figure S10
