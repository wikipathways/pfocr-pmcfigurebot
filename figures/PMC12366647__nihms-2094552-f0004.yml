figure_title: Proteomic analysis identifies numerous networks associated with metabolic
  impairment including decreased oxidative phosphorylation and increased fatty acid
  concentration in the left ventricle of swine with MYH7 R403Q mutation
caption: The number of downregulated (green) and upregulated (red) differentially
  expressed proteins present in the LV of MYH7-HCM swine versus Yucatan control (n=3/group)
  are shown in the volcano plot and Venn diagram (A). DEPs present in the sample predict
  significantly altered pathways in swine with MYH7 R403Q mutation related to energy
  metabolism and mitochondrial function ranked by z-score (B). Predicted proteins
  predicting activation of concentration of fatty acids and inhibition of energy homeostasis
  and quantity of carbohydrate (C). z-score ≤ −2 and ≥ 2 represents significance
article_title: Heterozygous MYH7 R403Q mutation impairs left atrial mitochondrial
  function in a Yucatan mini-pig model of genetic non-obstructive hypertrophic cardiomyopathy
