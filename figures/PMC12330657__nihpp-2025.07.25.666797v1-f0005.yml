figure_title: Transportation of EXOC6A-associated vesicles to the M-centriole occurs
  via a dynein-, actin-, and MT-dependent pathway
caption: (A) Schematic showing the protocols of siRNA (left) or drug (right) treatment.
  (B) RPE1 cells were treated with siControl or siGolgin160 and analyzed via confocal
  fluorescence microscopy or immunoblotting using the indicated antibodies. (C) RPE1
  cells were treated with ciliobrevin D (i) or nocodazole (ii) and analyzed via confocal
  fluorescence microscopy using the indicated antibodies. (D-F) Cells with EXOC6A-associated
  CVs (D), a positioned Golgi (E), or a cilia ratio (F) were analyzed via 3D-SIM and
  quantified. Cells with a positioned Golgi were defined as those showing all GM130-labeled
  Golgi signals concentrated within a 7 μm radius surrounding the Glu-tub-labeled
  centrioles. (G) RPE1-based mCherry-myosin-Va-GTD-inducible cells were treated with
  siARP2 as described in A (left) and analyzed via confocal microscopy or immunoblotting
  using the indicated antibodies. (H, I) Quantifications of the cilia ratio (H) and
  EXOC6A-associated CVs (I) is shown. (J) RPE1 cells were treated with CK666 or high-dose
  (10 μM) CytoD as described in A (right panel) and analyzed via confocal microscopy
  using the indicated antibodies. Quantification of the cilia ratio (H) and EXOC6A-associated
  CVs (I) is shown. * in (B, right panel) indicates non-specific bands. Error bars
  represent mean ± s.d. from at least 3 independent experiments with 100 randomly
  selected cells. P-value was determined with two-tailed Student’s t-test. P < 0.05
  was considered statistically significant. NS, not significant. Scale bars are 1
  μm
