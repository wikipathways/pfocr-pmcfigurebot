figure_title: PRPK mediates solar UV–induced photocarcinogenesis by mediating PD-L1
  expression and enhancing CD8+ T-cell infiltration
caption: (a) This study illustrates the pivotal role of PRPK in promoting solar UV–induced
  photocarcinogenesis by regulating immune and inflammatory pathways within the tumor
  microenvironment. PRPK drives PD-L1 expression through the activation of transcription
  factors NF-κB, c-Jun, c-Myc, and AP-1, facilitating an immunosuppressive environment.
  (b) Deletion of PRPK disrupts this pathway, leading to enhanced CD8+ T-cell infiltration
  and a significant reduction in proinflammatory and proangiogenic mediators, including
  IL-6, MIP-2, and VEGF. These findings highlight PRPK as a critical regulator of
  tumor immune evasion and a potential therapeutic target for improving antitumor
  immunity. AP-1, activator protein 1
