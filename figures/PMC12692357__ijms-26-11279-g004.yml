figure_title: Pathways linking psychological stress to blood-brain barrier disruption
  and Alzheimer’s disease, highlighting molecular and cellular mediators.
caption: Pathways linking psychological stress to blood-brain barrier disruption and
  Alzheimer’s disease, highlighting molecular and cellular mediators. This schematic
  illustrates how chronic psychological stress and associated neuropsychiatric conditions
  (e.g., anxiety and depression) contribute to systemic inflammation and cerebrovascular
  dysfunction. Stress-induced upregulation of mCRP and proinflammatory cytokines leads
  to blood-brain-barrier (BBB) disruption, which is characterized by reduced tight
  junction protein expression (notably claudin-5) and increased permeability. Disruption
  is driven in part by elevated matrix metalloproteinases (MMPs) and tumor necrosis
  factor-alpha (TNF-α), which degrade endothelial integrity and exacerbate inflammatory
  signaling. Experimental evidence from iPSC-derived brain microvascular endothelial
  cells shows that decreased transepithelial/transendothelial electrical resistance
  (TEER) is a BBB-deficit subtype, that is mechanistically linked to MMP-1 and TNF-α
  activity. These alterations facilitate neuroimmune crosstalk and loss of vascular
  protection, thereby increasing the risk of Alzheimer’s disease (AD)-related pathology
  (down black arrows mean decrease)
