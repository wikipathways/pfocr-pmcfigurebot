figure_title: |-
  Proposed biosynthetic route from glucose to tagatose by reversing the Leloir
  pathway
caption: |-
  (A) Pathway schematic showing six enzymatic steps and the relevant
  genetic modifications. Enzymes are labeled with both their common name and
  corresponding gene: Glk (hexokinase), Pgm (phosphoglucomutase), GalT
  (galactose-1-phosphate uridylyltransferase), Gal1Pase (galactose-1-phosphate
  phosphatase), LAI (L-arabinose isomerase), and GalE (UDP-glucose 4-epimerase).
  Red “X” marks indicate deleted genes: pgi
  (phosphoglucose isomerase) and galK (galactokinase).(B) Approximate standard Gibbs free energy change for each reaction step
  numbered in (A) between glucose and tagatose using the reverse Leloir pathway.
  y-axis values represent the net change in free energy due
  to each reaction starting from glucose as a basis.(C) Table of enzymes catalyzing each step represented in (A) and the
  corresponding free energy change in kJ/mol for the reaction direction shown in
  (A). ΔrG′° represents the change in Gibbs free
  energy due to the indicated reaction under standard conditions. The values for
  hexokinase and LAI were taken directly from Meurer et al.26 and Hong et al.,27 respectively. Others were calculated
  using the eQuilibrator tool (http://equilibrator.weizmann.ac.il).28See also Figure
  S5
