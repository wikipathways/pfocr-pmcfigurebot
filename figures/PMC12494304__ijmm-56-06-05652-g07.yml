figure_title: Graphical model summarizing the hypothesized pathway.
caption: Graphical model summarizing the hypothesized pathway. Overexpression of apelin-13
  in the PVN promotes upregulation of V1a receptors in both the PVN and NTS, while
  downregulating GARγ2 in the NTS. These neural modifications collectively enhance
  parasympathetic outflow. Furthermore, paraventricular endocrine system secretes
  circulating neurohumoral factors that systemically mediate cardioprotection. PVN,
  paraventricular nucleus; V1a, Vasopressin 1a; MI, myocardial infarction; NTS, nucleus
  tractus solitarii; GAR, GABAA receptor; SST, isomatostatin; CCK, cholecystokinin;
  GLP-1, glucagon-like peptide 1; VIP, vasoactive intestinal peptide
article_title: Apelin-13 in the paraventricular nucleus (PVN) attenuates myocardial
  ischemia through V1a receptors in PVN/nucleus tractus solitarii (NTS) and GARγ2
  in NTS
