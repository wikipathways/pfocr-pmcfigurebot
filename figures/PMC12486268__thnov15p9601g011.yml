figure_title: Se@LNT attenuates orbital adipose hyperplasia and immune dysregulation
  in TED mice via suppression of the STING inflammatory pathway.
caption: 'Se@LNT attenuates orbital adipose hyperplasia and immune dysregulation in
  TED mice via suppression of the STING inflammatory pathway. (A) Schematic of TED
  mouse model establishment and therapeutic regimen. (B) Comparative visualization
  of orbital morphology in mice. (C) Coronal MRI imaging with Gray/Rainbow pseudo-coloring
  (scale bar: 5 mm). (D) HE staining of orbital adipose tissue (scale bar: 100 μm).
  (E) Oil Red O staining of orbital adipose lipid deposition (scale bar: 100 μm).
  (F-G) STING immunofluorescence staining and quantification in orbital adipose tissue
  (scale bar: 50 μm). (H-M) Immunofluorescence staining and quantification of infiltrating
  immune cells: (H-I) CD3+ T cells, (J-K) IBA-1+ macrophages, and (L-M) LY6G+ neutrophils
  in periocular adipose tissue (scale bars: 50 μm). (*p < 0.05; **p < 0.01; ***p <
  0.001; mean ± SE, n = 5)'
