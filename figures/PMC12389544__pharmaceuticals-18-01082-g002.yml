figure_title: Distinct Roles and Functions of M1 and M2 Macrophages.
caption: Distinct Roles and Functions of M1 and M2 Macrophages. This image was created
  in Biorender. Turner, L. (2025) https://app.biorender.com/illustrations/684359509b3f24b278204c4a?slideId=bf028f10-1653-44be-892b-db982d377b95.
  This figure shows an overview of M1 and M2 macrophage polarization and their roles
  in the TME. M1 macrophages (left) are anti-tumor and pro-inflammatory, activated
  by Th1 cytokines (tumor necrosis factor-alpha (TNF-α), colony-stimulating factor
  2 (CSF2), toll-like receptors (TLRs), and lipopolysaccharide (LPS)), leading to
  interferon-gamma (IFN-γ), nuclear factor kappa B (NF-κβ), and miR155 activation.
  M1 macrophages increase interleukin (IL)-6, TNF, IL-12, and IL-23 while decreasing
  IL-10, promoting enhanced CD8+ T cell activity and apoptosis. They are associated
  with iron uptake, high reactive oxygen species (ROS), and STAT1 and STAT3 pathway
  activation. M2 macrophages (right) are pro-tumor and anti-inflammatory, induced
  by IL-4, IL-13, and miR21, leading to increased IL-10 and transforming growth factor-beta
  (TGF-β), which in turn enhance arginase expression and regulatory T cell (Treg)
  development. M2 macrophages are associated with iron release, folate metabolism,
  and activation of STAT3 and STAT6 pathways
