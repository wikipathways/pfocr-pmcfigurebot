figure_title: GNLY-high dNKs in rhesus macaques and humans share gene signatures and
  biological pathways related to immune defense and immunoregulation
caption: (A and B) Heatmaps showing the scaled expression of genes in cluster signatures
  of (A) rhesus and (B) human dNK subsets, with selected genes of interest from each
  cluster shown to the left of the heatmap and genes shared by human C1/rhesus C1
  and/or rhesus C2 in bold. Color coding of clusters corresponds to Figure 2.(C) The
  total number of named genes associated with each cluster signatures is shown in
  the Venn diagram, and of those, the 17 genes shared by human C1 and rhesus C1 are
  listed next to the green bar. The 13 genes shared by human C1 and rhesus C2 are
  listed next to the yellow bar, and the 7 genes shared by all three clusters are
  listed in bold.(D) Selected significantly enriched (padj < 0.05) and non-redundant
  Gene Ontology (GO) terms (biological processes and cellular components) and pathways
  (from Elsevier Pathway Collection and MSigDB Hallmark databases) from human cluster
  C1 are shown in order of increasing p value, and those also enriched in rhesus C1
  or rhesus C2 (padj < 0.15) are shown in bold.See also Tables S2 and S3A–S3C for
  full gene signatures and enrichment analysis
article_title: Granulysin-high decidual NK cells in macaques and humans share signatures
  of immune defense
