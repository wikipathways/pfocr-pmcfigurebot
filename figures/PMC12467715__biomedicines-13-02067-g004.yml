figure_title: Iron regulation at the cellular level in cardiomyocytes and CNS.
caption: 'Iron regulation at the cellular level in cardiomyocytes and CNS. (Left Panel):
  In cardiomyocytes, iron binds to transferrin receptor 1 (TFR1). Non-transferrin-bound
  iron (NTBI) uptake in the heart is primarily facilitated by the ZIP metal ion transporter
  SLC39A14. Additional NTBI transporters in cardiac cells include L-type and T-type
  calcium (Ca2+) channels. Hepcidin regulates iron levels by promoting ferroportin
  (FPN) degradation. Ferroptosis is suppressed by hypoxia-inducible factors (HIFs),
  SLC7A11, and glutathione peroxidase 4 (GPX4)—through enhanced iron uptake and upregulation
  of TFR1 expression. (Right Panel): Iron uptake in CNS occurs via two main pathways:
  Fe2+ is imported by divalent metal transporter 1 (DMT1) after extracellular Fe3+
  is reduced by ferrireductase STEAP3, while transferrin-bound Fe3+ is taken up through
  TFR-mediated endocytosis. Intracellularly, Fe3+ is converted to Fe2+ by STEAP3,
  and heme-bound iron is released by heme oxygenases (HO-1 and HO-2), contributing
  to the labile iron pool. Excess Fe2+, however, generate reactive oxygen species
  (ROS), leading to oxidative stress. To prevent this, cells store Fe3+ in ferritin,
  which is mobilized during high energy demand via NCOA4-mediated ferritinophagy.
  Lastly, iron is exported extracellularly as Fe2+ through the iron exporter ferroportin.
  (Illustration by the authors)'
