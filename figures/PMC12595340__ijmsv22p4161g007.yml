figure_title: ET-1 stimulated visceral HWP growth through the AMPK pathway.
caption: 'ET-1 stimulated visceral HWP growth through the AMPK pathway. We pretreated
  cells with the AMPK-specific inhibitor compound C for 1 h and then incubated them
  with ET-1. Compound C prevented ET-1-induced increases in both the number and viability
  of HWPs (A and B). Western blot analysis indicated that compound C prevented the
  ET-1-induced increase in AMPK phosphorylation (C). All the data are expressed as
  the mean ± standard error of the mean (SEM) of three independent experiments. *p
  < 0.05 vs. the control; #p < 0.05, ET-1 vs. compound C + ET-1'
