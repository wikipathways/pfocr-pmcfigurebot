caption: 'Expression patterns of differentially expressed genes (DEGs) involved in
  the JA and jasmonate (MeJA) biosynthesis and JA signal transduction pathways. (A)
  Expression patterns of transcripts involved in the JA and MeJA biosynthesis and
  JA transduction pathways; (B) simplified JA biosynthesis and JA signal transduction
  pathways. The treatment groups were defined as follows: Yan_CK and You_CK: the seedlings
  of ‘Jinyan No 4’ and Jinyou No. 1 were pretreated with distilled water once daily
  for two days and then grown under normal conditions for 24 h, respectively; Yan_LT
  and You_LT: the seedlings of ‘Jinyan No 4’ and Jinyou No. 1 were pretreated similarly
  with distilled water but then exposed to low temperature for 24 h, respectively;
  Yan_SNP and You_SNP: the seedlings of ‘Jinyan No 4’ and Jinyou No. 1 were pretreated
  with exogenous SNP (200 μmol · L−1) once daily for two days, then grown under low
  temperature for 24 h, respectively'
