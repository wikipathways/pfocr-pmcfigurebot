figure_title: Spatial and functional profiling of CD8+ T cells in infarcted cardiac
  tissue.
caption: Spatial and functional profiling of CD8+ T cells in infarcted cardiac tissue.
  (A) Spatial transcriptomics map showing CD8+ cell spots across infarcted cardiac
  tissue. Each spot represents a Visium spot, capturing transcripts from a group of
  neighboring cells. Control samples were patients who underwent for cardiac transplantation.
  (B) Quantification of CD8+ spatial spots at days 2 and 6 post-MI. (C) Percentage
  of CD3+ CD8+ cells within total PBMCs across days 2 and 6 in peripheral blood. (D)
  CD8A GO biological processes pathway enrichment analysis. In the graph, * and **
  depicts p < 0.05 and p < 0.01, respectively
