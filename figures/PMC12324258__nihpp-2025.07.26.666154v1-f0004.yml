figure_title: GRM-SEM model in ALSPAC (with rGE)
caption: '(a) Path diagram with standardised factor loadings and corresponding standard
  errors based for the best-fitting GRM-SEM IP model allowing for rGE (N=6,543). Here,
  the best-fitting IP model assuming the independence of A and E (Figure 3b) was extended
  with rGE parameters, and re-fitted. (b,c) Different representations of the same
  standardised genetic and residual variance contributions from model (a): (b) Combined
  standardised genetic and residual variance contributions, including A, Cov(A,E)
  (G related), as well as E and Cov(A,E) (E-related) contributions. (c) Individual
  standardised genetic and residual variance contributions shown for A, E and 2Cov(A,E)
  (i.e. G and E-related), respectively, allowing for different directions of effect.The
  GRM-SEM IP model consists of genetic (A), specific genetic (AS), residual (E), and
  specific residual (ES) factors, as well as the covariance between genetic and residual
  factors, i.e. Cov(A,E) either with respect to genetic (striped red) or residual
  (striped green) contributions. Observed measures are represented by squares and
  latent variables by circles. Single-headed arrows (paths) define relationships between
  variables, and double-headed arrows correlations. The variance of latent variables
  is constrained to unit variance. Estimates in panels (b) and (c) were derived from
  the model in (a). Note that SEs for GRM-SEM variance contributions (b,c) have been
  omitted for clarity.ALSPAC - Avon Longitudinal Study of Parents and Children; E
  – Non-genomic/residual factors; rGE – Gene-environment correlation; IP - Independent
  pathway; LGC - Listening comprehension (Wechsler objective language dimension);
  PIQ - Performance intelligence quotient (Wechsler intelligence scale for children
  III); PP - Peer problems (Strengths-and-difficulties questionnaire); PRC - Pragmatic
  composite scores (Children''s communication checklist); rev – reverse-coded; SCD
  – social communication difficulties (Social communication disorders checklist);
  VIQ - Verbal intelligence quotient (Wechsler intelligence scale for children III);
  Y - Years'
