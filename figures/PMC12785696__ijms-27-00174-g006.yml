figure_title: Molecular docking validation of medicarpin with ESR1 and CASP3.
caption: 'Molecular docking validation of medicarpin with ESR1 and CASP3. (A) Docking
  visualization of medicarpin bound to ESR1 (PDB: 6VPF). The inset shows the electrostatic
  surface of the binding pocket (green = hydrogen-bond acceptors; magenta = donors).
  Two-dimensional interaction mapping illustrates hydrogen bonding with GLU353 and
  hydrophobic contacts with LEU346, LEU387, LEU349, and PHE404, stabilizing the ligand
  within the receptor pocket. (B) Docking visualization of medicarpin bound to CASP3
  (PDB: 7RN9). Medicarpin forms hydrogen bonds with SER209 and LYS210, as well as
  additional interactions with ARG207, ASN208, and PHE247. Insets display surface
  electrostatics and 2D interaction networks. These findings confirm strong and specific
  binding of medicarpin to ESR1 and CASP3, supporting its dual modulation of estrogen-responsive
  and apoptotic pathways'
article_title: Network Pharmacology and Molecular Docking Identify Medicarpin as a
  Potent CASP3 and ESR1 Binder Driving Apoptotic and Hormone-Dependent Anticancer
  Activity
