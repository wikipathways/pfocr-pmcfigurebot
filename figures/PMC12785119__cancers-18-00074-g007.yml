figure_title: Activation of YAP and AKT pathways promotes resistance to apoptosis
  induced by MEK and FAK inhibitors.
caption: Activation of YAP and AKT pathways promotes resistance to apoptosis induced
  by MEK and FAK inhibitors. (A) Quantification of live cells and (B) apoptotic cells
  treated with FAKi or MEKi in parental cells and myr-AKT cells. FAKi (VS-4718) 0.3
  and 1 μM; MEKi (trametinib) 3 and 10 nM. One-way ANOVA followed by Tukey post hoc;
  ns, not significant, ** p < 0.01, *** p < 0.001, **** p < 0.0001. (C). Quantification
  of live cells, (D) apoptotic cells treated with FAKi or MEKi in parental cells and
  YAP-5SA cells. FAKi (VS-4718) 0.3 and 1 μM; MEKi (trametinib) 3 and 10 nM. One-way
  ANOVA followed by Tukey post hoc; ns, not significant, * p < 0.05, *** p < 0.001,
  **** p < 0.0001. (E) Caspase-3/7 activity assays in parental, myr-AKT, and (F) YAP-5SA
  cells treated with MEKi (10 nM, trametinib) and FAKi (1 μM, VS-4718). One-way ANOVA
  followed by Tukey post hoc; ns, not significant, * p < 0.05, ** p < 0.01, *** p
  < 0.001, **** p < 0.001. (G) Western blot of cl-PARP in myr-AKT and (H) YAP-5SA
  expressing cells treated with MEKi (10 nM, trametinib) by 24 h. The uncropped blots
  are shown in Figure S3
