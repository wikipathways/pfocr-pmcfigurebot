figure_title: Neutrophil proteases exacerbate lung epithelial thickening
caption: 'Mice were e.c. exposed to S. aureus + CrA for 7 days, followed by i.t. CrA
  administration on days 10–12. BAL and lungs were harvested on day 13 (n ≥ 8 per
  group). In some experiments with WT mice, protease inhibitors or vehicle controls
  were also administered i.t. on days 10, 11, and 12.(A) Venn diagram of unique and
  overlapping DEGs from RNA-seq of K14-IL-36R−/− and Nkx-IL-36R−/− lungs compared
  to WT lungs (n = 5 per group).(B) GO molecular function enrichment pathway analysis
  of overlapping DEGs from (A). inhib., inhibitor; act., activity.(C) Timeline of
  the atopic march model using WT mice with administration of protease inhibitors.(D)
  Weight change (%) from day 0 to 13 (±SEM).(E) Representative lung histology (H&E,
  scale bars: 1 mm and 100 μm).(F) Lung inflammation (±SEM) from histologic sections
  as measured by ImageJ software analysis as the percentage of the density of H&E
  staining.(G) Mean bronchiole epidermal thickness (±SEM).(H) Mean number of BAL PMNs
  (±SEM) as measured by FACS.(I–M) WT and NSP−/− mice were e.c. exposed to S. aureus
  + CrA for 7 days, followed by i.t. CrA administration on days 10–12. BAL and lungs
  were harvested on day 13 (n ≥ 8 per group).(I) Weight change (%) from day 0 to 13
  (±SEM).(J) Representative lung histology (H&E, scale bars: 1 mm and 100 μm).(K)
  Lung inflammation (±SEM) from histologic sections as measured by ImageJ software
  analysis as the percentage of the density of H&E staining.(L) Mean bronchiole epidermal
  thickness (±SEM).(M) Mean number of BAL PMNs (±SEM) as measured by FACS.ns, not
  significant; *p < 0.05, ***p < 0.001, and ****p < 0.0001 as calculated by a two-tailed
  Student’s t test (D, F–I, and K–M). Results are combined from at least 2 independent
  experiments. See also Figure S4'
