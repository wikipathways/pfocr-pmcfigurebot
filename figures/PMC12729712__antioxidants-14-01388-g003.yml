figure_title: Positive effects of SHP2 in growth factor receptor tyrosine kinase signaling.
caption: Positive effects of SHP2 in growth factor receptor tyrosine kinase signaling.
  The activation of growth factor receptor tyrosine kinases (RTKs) leads to the phosphorylation
  of intracellular components of the receptor, which in turn recruits SHP2 through
  its SH2 domain. The binding of SHP2 to RTKs facilitates the formation of complexes,
  such as GAB1/GRB2 and GAB1/p85/PI3-K, which subsequently activate downstream signaling
  pathways, including RAS/RAF/MAPK and AKT signaling. These pathways regulate critical
  cellular processes, including cell growth, survival, and angiogenesis. Additionally,
  the oncogene V-Src phosphorylates GAB1 and recruits SHP2, further promoting the
  GAB1/GRB2 signaling axis. This enhances MAPK signaling, leading to increased cell
  proliferation. SHP2 also upregulates AMP-activated protein kinase (AMPK), which
  plays a key role in regulating cellular metabolism. By activating AMPK, SHP2 promotes
  autophagy and mitophagy through the inhibition of mTORC1 signaling, contributing
  to cellular homeostasis and adaptation to stress. These findings highlight SHP2’s
  critical role in enhancing growth factor signaling and its impact on various cellular
  processes essential for tumorigenesis and tissue regeneration. Created in BioRender.
  Paniagua Bojorges, A. (2026) https://BioRender.com/u9fqpst
