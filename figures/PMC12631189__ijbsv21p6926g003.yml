figure_title: Metabolic reprogramming of prostate cancer.
caption: Metabolic reprogramming of prostate cancer. Androgens produced through the
  hypothalamic pituitary gonadal axis act on AR. AR can directly regulate ACSM1/3
  and promote the entry of fatty acids into mitochondria for β-oxidation. Silencing
  ACSM1/3 can lead to ferroptosis of prostate cancer cells. AR signals can regulate
  SREBP expression and promote lipid deposition. After ADT therapy, the Wnt/β - catenin
  pathway is reflexively upregulated, leading to continued tumor progression
