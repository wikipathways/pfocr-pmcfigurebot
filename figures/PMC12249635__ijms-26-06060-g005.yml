figure_title: Illustration of the framework.
caption: Illustration of the framework. (a) Amygdala grey matter density (GMD) and
  genotyping data from the ADNI cohort are used to conduct GWAS analysis. Tissue-free
  PPI network is obtained from the iRefIndex database. Summary statistics from two
  AD meta-GWAS are collected for AD-module identification. (b) Amygdala-specific PPI
  network is constructed by assigning GWAS results of amygdala GMD to the iRefIndex
  PPI network. (c) Amygdala modules are identified through hierarchical network analysis
  of the amygdala-specific PPI network. (d) Module-level polygenic risk score (MPRS)
  is calculated for each amygdala module by integrating the ADNI genotyping data and
  AD meta-GWAS statistics. Modules that exhibit significantly different MPRS between
  AD and control groups were identified as AD-relevant modules (ADMs). (e) Functional
  annotation of the ADMs evaluates their specificity to the amygdala, sensitivity
  to AD and its progression, pathological pathway via the mediation effect of the
  amygdala, and the functional relevance of module genes
