figure_title: ZCCHC4 directly activates the genes encoding the rate-limiting enzymes
  for cholesterol and fatty acid biosynthesis and regulates the transcription of TMEM97.
caption: ZCCHC4 directly activates the genes encoding the rate-limiting enzymes for
  cholesterol and fatty acid biosynthesis and regulates the transcription of TMEM97.
  A. Genomic distribution of ZCCHC4 binding sites. B. KEGG pathway enrichment analysis
  of ZCCHC4 target genes. C. Volcano plot illustrating differentially expressed genes
  (DEGs) in HCC cells transduced with shScramble or ZCCHC4 shRNA. D. Gene Ontology
  (GO) enrichment analysis of downregulated genes upon ZCCHC4 knockdown. E. Heatmap
  showing the expression profiles of genes involved in cholesterol and fatty acid
  biosynthesis in HCC cells transduced with shScramble or ZCCHC4 shRNA. F. Venn diagram
  depicting the overlap among ZCCHC4 target genes, genes downregulated by ZCCHC4 knockdown,
  and genes upregulated in HCC tissues. G. KEGG pathway enrichment analysis of the
  “core ZCCHC4 target gene set”. H. Meta tracks showing ZCCHC4 CUT&Tag signal occupancy
  at the promoter regions of SQLE, HMGCR, FASN, and SCD. I. Pearson correlation analysis
  between ZCCHC4 mRNA expression and the mRNA levels of genes encoding rate-limiting
  enzymes of cholesterol or fatty acid synthesis. J. Luciferase reporter assay to
  evaluate the effect of ZCCHC4 on the transcriptional activity of genes encoding
  rate-limiting enzymes of cholesterol and fatty acid synthesis. K. Western blotting
  analysis to determine the effect of ZCCHC4 on the protein expression levels of SQLE,
  HMGCR, SCD, and FASN. L. Meta tracks showing ZCCHC4 CUT&Tag signal occupancy at
  the promoter regions of TMEM97. M-N. Chromatin immunoprecipitation quantitative
  polymerase chain reaction (ChIP-qPCR) analysis to verify the binding of ZCCHC4 to
  the promoter sequence of TMEM97. O. Luciferase reporter assay to assess the effect
  of ZCCHC4 on TMEM97 transcriptional activity. Error bars represent the means ± SD.
  Statistical significance was determined using a two-tailed unpaired Student's t-test
  (for panels J, N and O)
