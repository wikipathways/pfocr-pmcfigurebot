figure_title: CXCL8 is induced by the PERK and IRE1α pathways of the unfolded protein
  response in esophageal squamous cell carcinoma cells.
caption: 'CXCL8 is induced by the PERK and IRE1α pathways of the unfolded protein
  response in esophageal squamous cell carcinoma cells. Evaluation of the indicated
  (A) mRNA and (B) protein expression levels in siRNA-transfected KYSE-150 and TE-1
  cells, which were treated with 100 nM TG or DMSO for 24 h. Evaluation of (C) mRNA
  and (D) protein expression levels of CXCL8 in transfected KYSE-150 and TE-1 cells
  by reverse transcription-quantitative PCR and western blot analysis. Dual-luciferase
  reporter assays were conducted in KYSE-150 cells to verify the direct binding effects
  of (E) XBP1 and (F) ATF4 on the CXCL8 promoter. All data are expressed as mean ±
  SD, n=3/group. *P<0.05, vs. siNS + DMSO group, siNS + TG group or pcDNA3.1 group;
  #P<0.05 vs. siNS + TG group. n.s., not significant; IRE1α, inositol-requiring enzyme
  1α; PERK, protein kinase R (PKR)-like endoplasmic reticulum kinase; si, small interfering;
  ERN, endoplasmic reticulum to nucleus signaling; EIF2AK3, ATF, eukaryotic translation
  initiation factor 2 alpha kinase 3; TG, thapsigargin; NS, non-silencing; CXCL, C-X-C
  motif chemokine ligand'
