figure_title: Combined lipidomics and metabolomics analyses identified altered RV
  metabolism
caption: '(A) PAB-Veh and PAB-SC144 had a reduction in the total percentage of triacylglycerols
  (TAG, control: 21%, PAB-Veh: 1%, PAB-SC144: 3%), and an increase in phosphatidylcholines
  (PC, control: 32%, PAB-Veh: 41%, PAB-SC144: 40%) and phosphatidylethanolamines (PE,
  control: 37%, PAB-Veh: 45%, PAB-SC144: 44%). (B) Hierarchical cluster analysis of
  lipidomics clustered PAB-Veh and PAB-SC144 groups together. (C) Random forest classification
  identified the top 15 lipids in distinguishing between experimental groups. 9 of
  15 are TAG species. (D) Lipid Ontology enrichment analysis revealed triacylglycerols,
  glycerolipids, and fatty acids were the most enriched pathways. Bar color is scaled
  by enrichment from gray (low) to red (high). (E) Hierarchical cluster analysis of
  metabolomics data clustered PAB-Veh and PAB-SC144 groups together. (F) Pathway analysis
  of metabolomics data identified amino acid metabolism pathways account for many
  of the most enriched pathways. Scale bars show z-scores of lipid/metabolite abundances
  between all 3 groups in B,E'
