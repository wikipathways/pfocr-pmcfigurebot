figure_title: Lineage differentiation dynamics and molecular characteristics of the
  MMP1 + FIB regulatory network.
caption: Lineage differentiation dynamics and molecular characteristics of the MMP1
  + FIB regulatory network. (A) CytoTRACE analysis reveals the differentiation levels
  of each fibroblast subset. (B) Monocle trajectory analysis deduces the lineage differentiation
  structure and sequence of fibroblast subsets. (C) UMAP shows the expression profiles
  of Hh core genes (PATCH1, GAS1, WNT5A, GLI1) in different fibroblast subsets. (D)
  Slingshot trajectory analysis deduces the lineage differentiation structure and
  sequence of fibroblast subsets. (E) Expression profiles of Hh core genes (PATCH1,
  GAS1, WNT5A, GLI1) in different differentiation stages. (F) ScMetabolism analysis
  reveals the metabolic patterns of the three fibroblast subsets. (G) irGSEA analysis
  reveals the pathway activation statuses of the three fibroblast subsets. (The area
  marked by the red box is exactly the Complement pathway as described in the text.)
  (H) Activation status of the complement system in each fibroblast subset. (I) UMAP
  shows the activation status of the complement system in fibroblasts. (The fibroblasts
  marked by the red box are exactly those with the highest activation level of the
  Complement pathway)
