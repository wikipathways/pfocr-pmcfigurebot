figure_title: QSER1 regulates developmental signaling pathways in hESC-derived 2D
  gastruloids
caption: '(A) Graph shows QSER1 mRNA levels in hESCs transfected with siRNA control
  and siRNA against QSER1 for 72h. (n=3) Data presented as mean ± SEM. Statistical
  analysis: Student’s t-test, ***p<0.001(B) Western blot of QSER1 protein levels,
  same conditions as A.(C) Graphs show ChIP-qPCR analysis of RNA polymerase II protein
  on the indicated genomic regions in sicontrol and siQSER1 hESCs. QSER1 BS: QSER1
  binding site NegC: Negative control region. (n=3) Data presented as mean ± SEM.
  Statistical analysis: Student’s t-test, **p<0.01 and *p<0.05(D) H1 hESCs were transfected
  with control or QSER1 siRNAs and left untreated or treated with Activin (=mesoderm
  inductor) for 24h. Graphs show RT-qPCR analysis of NODAL and WNT3 genes. (n=3) Data
  presented as mean ± SEM. Statistical analysis: Student’s t-test, ****p<0.0004, ***p<0.001,
  **p<0.01, *p<0.05(E) Representative images of hESC-derived 2D-gastruloids with the
  genotypes indicated on the top are shown. To label the spatial expression of NODAL
  protein, an engineered line containing dual NODAL-citrine and H2B-RFP reporters
  was used (from Liu et al., 2022). A YAP1 inhibitor (0.5μM Dasatinib) was used to
  disrupt YAP1 activity (YAP1i).(F) Graphs show two types of quantification of citrine-Nodal
  levels (cNODAL). The plot on the left shows the intensity from the colony edge to
  the center of the micropattern, and the right plot shows the average intensity for
  cNODAL expression levels. (n=35) Data presented as mean ± SEM. Statistical analysis:
  Student’s t-test, ****p<0.0004(G) Same as F, but quantification of immunostaining
  signal of Brachyury (BRA), a mesodermal fate marker.(H) UMAP from scRNAseq datasets
  of E7 embryos showing Qser1 mRNA expression in control and cYap1 KO embryos. Dotted
  circles highlight the epiblast cluster (see Figure 1). Differential Qser1 expression
  in the epiblast of Yap1 cKO versus control embryos is indicated.(I) Violin plot
  of Qser1 from scRNAseq of E7 embryos showing expression levels in all clusters (Adjusted
  p-value is based on Bonferroni correction, *p < 0.05, **p < 0.001, ***p < 0.0001.)(J)
  WT and YAP1 KO H1 hESCs were differentiated toward ectoderm (ecto), mesoderm (meso),
  or endoderm (endo) fates followed by RNAseq analysis (Stronati et al., 2022). Graph
  shows the expression of QSER1 from these datasets in the indicated conditions. (n=3)
  Data presented as mean ± SEM. Statistical analysis: Student’s t-test, ****p<0.0004
  and ***p<0.001, **p<0.01).(K) Cooperative mechanism of YAP1 and QSER1 modulating
  gene expression of signaling genes in the mammalian epiblast. Two developmental
  stages are shown. QSER1 expression decreases as the epiblast transitions to PS,
  which allows RNAPII recruitment and increased transcription of genes, including
  Nodal. PS: primitive streak. Pr: proximal, A: anterior, P: posterior, D: Distal'
