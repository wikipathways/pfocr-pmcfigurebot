caption: 'Differential expression of genes associated with type I interferon and c-GAS/Sting
  signaling pathway 24 h post-irradiation in both cell lines, comparing irradiated
  versus non-irradiated controls: (A) ACHN cell line and (B) Caki-2 cell line. Histograms
  show the 2−ΔΔCT expression levels of the genes of interest. Data represent four
  independent experiments performed in triplicate, expressed as means ± SEM (n = 4)
  and normalized to each cell line’s untreated control condition (0 Gy). Statistical
  differences were analyzed using a non-parametric Mann–Whitney multiple comparison
  test. * p < 0.05, ** p < 0.01, **** p < 0.0001'
