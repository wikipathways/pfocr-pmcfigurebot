figure_title: Lactate catabolism regulates longevity
caption: 'A) Lifespan curves of N2 animals under control (black line) and lactate-supplemented
  (colored lines) diets.B) Schematic representation of metabolic pathways associated
  with the lactate dehydrogenase reaction and subsequent pyruvate oxidation to acetyl-CoA.C)
  Lifespan curves of N2 animals treated with ldh-1 RNAi, under control (black) or
  lactate- (blue) and pyruvate-supplemented (red) diets. 90 animals were scored per
  condition. Treatments were applied from the embryonic stage until death.D) Schematic
  representation of the LbNOX-dependent mechanism.E-F) Lifespan curves for animals
  expressing LbNOX in the cytoplasm (E) or in the mitochondria (F). Animals were grown
  on control (black) or lactate-enriched diet (blue).G-H) Lifespan curves of N2 animals
  under control diet (black) or different temporal lactate supplementation. Full treatment
  refers to continuous lactate exposure from the embryonic stage until death. Other
  conditions refer to stages when lactate supplementation was initiated and continued
  until the death of the animals tested.I) Quantification gst-4p::GFP fluorescence
  in day 1 adult animals treated with ldh-1 RNAi. Animals were grown under control
  (grey), lactate- (blue) or pyruvate-supplemented (red) diet.J) Experimental design
  for mid-developmental stages. For the Lac to Ctl condition, L4 animals were transferred
  from lactate-supplemented to control diet. For the Ctl to Lac condition, L4 animals
  were transferred from control to lactate-supplemented diet. gst-4p::GFP expression
  was quantified in day 1 adult animals, and each dot represents one animal.Statistics
  for lifespan curves were done using log-rank (Mantel–Cox) method. For each condition,
  90 animals were analyzed (in triplicate), and each experiment was repeated at least
  twice. P values for fluorescence measurements were calculated by unpaired, two-sided
  t-test with Welch correction. *P<0.05; **P<0.01; ****P<0.0001. ns: Not significant.
  Each fluorescence experiments were performed at least 3 times, and between 25-40
  animals were measured per condition'
