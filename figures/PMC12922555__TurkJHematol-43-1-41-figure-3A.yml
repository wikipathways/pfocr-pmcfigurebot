figure_title: NRXN2 mRNA was regulated by IGF2BP3 through an m6A-dependent pathway.
caption: 'NRXN2 mRNA was regulated by IGF2BP3 through an m6A-dependent pathway. A)
  Prediction of m6A modification sites on NRXN2 mRNA using the online SRAMP tool.
  B, C) NRXN2 expression in cells transfected with wild-type NRXN2 (NRXN2-wt) or an
  m6A site mutant (NRXN2-mut [c.1770A>T]) was detected by real-time polymerase chain
  reaction (B) and western blotting (C). D) The m6A modification level of NRXN2 mRNA
  in the NRXN2-wt and NRXN2-mut (c.1770A>T) groups was detected by real-time polymerase
  chain reaction using the Magna MeRIP m6A Kit. E) RNA stability of NRXN2 mRNA in
  the NRXN2-wt and NRXN2-mut (c.1770A>T) groups was assessed by actinomycin D assay.
  F) The interaction between IGF2BP3 and NRXN2 mRNA in the NRXN2-wt and NRXN2-mut
  (c.1770A>T) groups was determined by RNA immunoprecipitation-real-time polymerase
  chain reaction. G, H) IGF2BP3 and NRXN2 expression levels in HL-60 cells transfected
  with control siRNA (si-NC) or IGF2BP3-specific siRNA (si-IGF2BP3) were detected
  by real-time polymerase chain reaction (G) and western blotting (H). I, J) IGF2BP3
  and NRXN2 expression levels in HL-60 cells from the oe-NC, oe-IGF2BP3, and oe-IGF2BP3+NRXN2-mut
  (c.1770A>T) groups were detected by real-time polymerase chain reaction (I) and
  western blotting (J). K) RNA stability of NRXN2 mRNA in the oe-NC, oe-IGF2BP3, and
  oe-IGF2BP3+NRXN2-mut (c.1770A>T) groups. L) m6A modification level of NRXN2 mRNA
  in the oe-NC, oe-IGF2BP3, and oe-IGF2BP3+NRXN2-mut (c.1770A>T) groups was detected
  by real-time polymerase chain reaction using the Magna MeRIP m6A Kit.*: p<0.05,
  **: p<0.01, ***: p<0.001'
