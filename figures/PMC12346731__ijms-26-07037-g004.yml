caption: Pathway enrichment analysis results generated using the functional enrichment
  visualization tool in The Search Tool for Recurring Instances of Neighboring Genes
  (STRINGv12.0) with the Kyoto Encyclopedia of Genes and Genomes (KEGGv112.1) pathways
  database for 112 differentially expressed proteins (DEPs) in the (A). right parotid
  and 89 DEPs from all gland sites with (B). proteins of analytical interest including
  known involvement in the oral cavity, neurological disorders, glyoxalase system,
  or oxidative stress. Pathway enrichment was determined by STRINGv12.0 using a hypergeometric
  test for over-representation, with p-values corrected for multiple testing using
  the Benjamini–Hochberg correction for the false discovery rate (FDR). Pathways are
  ranked by strength, with bubble size representing the number of DEPs mapped to the
  pathway and bubble color representing the FDR
