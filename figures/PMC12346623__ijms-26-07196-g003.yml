caption: Gene ontology network for all known targets of the most downregulated in
  CRC, adiponectin pathway-targeting miRNAs. Using miRTarBase, 1587 genes were found
  to be targeted by the four selected downregulated miRNAs, meaning that the expression
  of those genes and the activity of their associated pathways should be upregulated
  in CRC tissues. Circle sizes indicate number of mapped genes to pathway, while color
  indicates p values. Generated via Cytoscape’s ClueGO application, using the WikiPathways
  database
