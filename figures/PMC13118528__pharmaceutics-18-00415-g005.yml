caption: 'The effect of tetracycline analogues on the JAK2/STAT3 pathway in K562 cells
  using WB: (A) Expression levels of JAK2 protein following treatment with COL-3 (12.5
  µg/mL, 25 µg/mL), DOX (100 µg/mL, 200 µg/mL), and MIN (100 µg/mL, 200 µg/mL). (B)
  Expression levels of P-JAK2 after treatment with COL-3, DOX, and MIN. (C) Expression
  levels of STAT3 protein in response to COL-3, DOX, and MIN. (D) Expression levels
  of P-STAT3 following treatment with COL-3, DOX, and MIN. (E) Expression levels of
  pro-apoptotic protein BAX after treatment with COL-3, DOX, and MIN. (F) Expression
  levels of anti-apoptotic protein BCL-2 in response to COL-3, DOX, and MIN. Bar graphs
  represent fold changes in protein expression from at least three independent experiments
  (mean ± SD). Statistical significance is determined using one-way ANOVA followed
  by Dunnett’s multiple comparison test (ns (nonsignificant), * p < 0.05, ** p < 0.01,
  *** p < 0.001, **** p < 0.0001)'
