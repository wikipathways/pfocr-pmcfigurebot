figure_title: Stereoselective activation of the Nrf2 pathway by compound 1a, but not
  its enantiomer 1b.
caption: Stereoselective activation of the Nrf2 pathway by compound 1a, but not its
  enantiomer 1b. Compound 1a selectively binds to Keap1, disrupting the Keap1–Nrf2
  interaction and promoting Nrf2 nuclear translocation. Activated Nrf2 enhances the
  expression of antioxidant defenses, including glutathione (GSH), thereby reducing
  reactive oxygen species (ROS) levels. In contrast, compound 1b exhibits minimal
  Keap1 binding and fails to activate Nrf2
