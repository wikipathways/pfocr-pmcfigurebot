figure_title: GO enrichment analysis of candidate genes in the C.
caption: 'GO enrichment analysis of candidate genes in the C. canephora Premature
  population. The analysis was performed using genes associated with the top 100 predictive
  SNPs from the Bootstrap Forest models for different trait combinations. The plots
  illustrate the most significantly enriched biological pathways. (a) Enriched GO
  terms for genes associated with green bean yield, highlighting pathways related
  to the internal space of organelles. (b) Enriched terms for the combined traits
  of coffee bean production and green bean yield, which include the addition of a
  ‘cellular macromolecule biosynthetic process’. (c) Enriched terms for the combination
  of all three traits (coffee bean production, green bean yield, and leaf rust incidence),
  identifying ‘lipid modification’ as another key pathway. In all plots, the x-axis
  represents the fold enrichment of the term, the size of each point corresponds to
  the number of genes associated with the term, and the color indicates the statistical
  significance based on the −log10(FDR). Abbreviations used: reg., regulation; proc.,
  process'
