figure_title: The OCT4-DUSP6 axis promotes the migratory and invasive capability of
  A549 cells.
caption: 'The OCT4-DUSP6 axis promotes the migratory and invasive capability of A549
  cells. (A) OCT4-DUSP6 axis upregulates the expression of MMP2 and MMP9. A549 cells
  were transduced with lentiviral vectors encoding OCT4 or GFP (control), followed
  by puromycin selection. Subsequently, the cells were further transduced with lentiviral
  vectors encoding shRNA specific to DUSP6 (shDUSP6 #2 and shDUSP6 #4) or luciferase
  (shLuc). Detection and quantification of OCT4, DUSP6, MMP2, and MMP9 protein expression
  levels were examined by immunoblotting (n=3). Expression of β-actin served as the
  loading control. (B) The OCT4-DUSP6 axis regulates MMP2 and MMP9 expression independently
  of the inhibition of ERK1/2-MAPK activity. OCT4 or GFP-transduced A549 cells were
  treated with DMSO or ERK inhibitor (LY3214996, 2μM) for 48 h. Total protein extracts
  were detected and quantified for OCT4, DUSP6, NICD, MMP2, and MMP9 expression (n=3).
  (C) The OCT4-DUSP6 axis regulates MMP2 and MMP9 expression through the Notch pathway.
  A549 cells were transduced with lentiviral vectors encoding OCT4 or GFP, followed
  by further transduction with lentiviral vectors encoding shRNA specific to NOTCH
  (shNOTCH) or luciferase (shLuc). Detection and quantification of OCT4, DUSP6, NICD,
  MMP2, and MMP9 protein expression levels were examined by immunoblotting (n=3).
  (D) Migratory and invasive capabilities of DUSP6-knockdown and Luc control A549/OCT4
  cells. Cells that migrated through the membrane to the lower surface in the Boyden
  chamber were stained with Giemsa solution and visualized by light microscopy (×
  200 magnification, scale bar = 200 μm) (B) and quantified (C). Migratory cells in
  three fields in each membrane were counted. All quantification values and error
  bars shown were mean ± SEM, and P-values less than 0.05 were shown in the quantitative
  charts. NICD, Notch intracellular domain; SEM, standard error of the mean'
