caption: Alzheimer’s disease (AD) is a neurodegenerative condition that worsens over
  time and affects the brain’s cholinergic function, leading to oxidative stress in
  the brain, which is largely seen in AD patients. By interfering with cholinergic
  transmission in the central nervous system (CNS), the tropane alkaloid medication
  scopolamine (scop) demonstrated competitive antagonism within muscarinic acetylcholine
  receptors (mAChRs). The scopolamine injection causes dysregulation of the cholinergic
  neuronal pathway and memory circuits in the CNS. In addition, it lowers the expression
  of BDNF and cAMP-response element-binding (CREB) in the CNS. Therefore, BDNF and
  CREB may operate as innovative therapies to address memory pathological conditions
  and neurodegenerative illnesses like AD, the hippocampal proteins BDNF and CREB
  are crucial for developing long-term memory
article_title: Trazodone modulates behavioral alterations in scopolamine-induced cognitive
  deficit by targeting brain-derived neurotropic factor and cAMP response element-binding
  protein signaling
