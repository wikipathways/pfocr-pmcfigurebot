figure_title: IR 72 h treatment induces antiviral response in RV-infected nasal epithelial
  cells.
caption: IR 72 h treatment induces antiviral response in RV-infected nasal epithelial
  cells. (a) Schematic illustration of RV1B infection in the viral recognition capability
  and antiviral response of airway epithelial cells. (b) Effects of viral sensing
  capability in untreated and IR-irradiated RV-infected NECs measured within 72 h.
  Data represents three patients per group, representative of one independent experiment.
  (c) Effects of antiviral response in untreated and IR-irradiated RV-infected NECs
  measured within 72 h. Data represents three patients per group, representative of
  one independent experiment. (d) Schematic illustration of the inhibitory effect
  of SOCS1 in JAK/STAT pathway in airway epithelial cells after RV1B infection. (e)
  SOCS1 expression in untreated RV mRNA and IR-irradiated RV mRNA in NECs measured
  within 72 h. Data represents three patients per group, representative of one independent
  experiment. The mRNA levels of each condition were determined using real-time polymerase
  chain reaction. Each circular dot represents one independent sample per experiment
  and the number of dots per group corresponds to the sample size. (a,d) Created by
  BioRender.com
