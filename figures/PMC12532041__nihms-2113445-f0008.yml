figure_title: HSPCs demonstrate unique cell-type-specific transcriptional changes
  during aging
caption: (A) Workflow for analysis of aging HSPCs.(B) UMAP of integrated HSPCs with
  confident cell annotations.(C) Enrichment analysis was performed using informative
  genes identified from cell-type-specific Spearman correlation analysis for aging
  and youth. Bar plots show the number of significant terms for each cell-type-specific
  analysis.(D) RF model performance metrics after RFE for predicting cell-type-specific
  age on the test data.(E–G) Expression of gene modules associated with DNA repair
  and processing in HSCs (E) and RNA splicing and processing in HSCs (F) and MPPs
  (G).(H) Correlation between the predicted age from the RF model after RFE and true
  age on the test data.(I) Cell-type-specific aging scores for healthy and cancer
  cells annotated using the mixed-model classifier.Statistical significance was tested
  using a t test with multiple comparison adjustments. All scores are significantly
  different unless marked not significant (NS). DDR, DNA damage response; DSBR, double-stranded
  break repair; ELN, elastic net; GO, Gene Ontology; GOBP, GO biological processes;
  GOCC, GO cellular component; GOMF, GO molecular functions; NHEJ, non-homologous
  end joining; PE, pathway enrichment (Reactome); RF, random forest; RFE, recursive
  feature elimination
