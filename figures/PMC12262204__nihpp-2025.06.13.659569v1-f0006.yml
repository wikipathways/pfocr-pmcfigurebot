figure_title: Residue-level interaction analysis for CGRP(27–37) and ssCGRP(27–37)
  with the CLR:RAMP1 ECD receptor complex along their unbinding pathways.
caption: Residue-level interaction analysis for CGRP(27–37) and ssCGRP(27–37) with
  the CLR:RAMP1 ECD receptor complex along their unbinding pathways. (a) Heatmaps
  of contact frequencies (top and middle rows) and their differences (bottom row)
  between peptide residues and either CLR (left panels) or RAMP1 (right panels) for
  the bound and near-bound ensembles. Warmer colors indicate more frequent contacts,
  while cooler tones indicate lower contact frequency. Contact difference maps use
  a diverging color scale to reflect the enrichment of specific interactions in CGRP
  (negative, green) or ssCGRP (positive, blue). Regions selected for further structural
  analysis in panel (b) are boxed in orange. (b) Representative structural snapshots
  from bound and near-bound bins depict key interaction interfaces for CGRP (green)
  and ssCGRP (blue) with CLR (ice blue, top) and RAMP1 (purple, bottom). Key peptide-receptor
  contacts are shown with dashed orange line and hydrophobic cores on the residues
  are marked with ball representation. (c) Schematic residue interaction networks
  for CGRP and ssCGRP illustrate differences in contacts with CLR and RAMP1. Key peptide-receptor
  residue contacts with frequencies above 0.2 are shown as dashed orange lines, with
  line thickness proportional to contact frequency (thicker lines indicate stronger
  interactions). Contacts unique to a specific peptide system are highlighted in dark-orange
