figure_title: Wnt signaling is a key regulator of cell growth, differentiation, polarity,
  and tissue maintenance, and it takes two main forms, the canonical (Wnt-proliferative
  and wound-healing pathways).
caption: Wnt signaling is a key regulator of cell growth, differentiation, polarity,
  and tissue maintenance, and it takes two main forms, the canonical (Wnt-proliferative
  and wound-healing pathways). In the non-canonical form, the Wnt signal does not
  lead to the accumulation of β-catenin. By contrast, in the canonical pathway, ligands
  of Wnts dock to Frizzled receptors as well as LRP5/6 co-receptors and result in
  the inhibition of the catabolic complex of 8-catenin, consisting of APC, Axin, CK1,
  and GSK3. This leads to accumulation of β-catenin into the cytoplasm and translocation
  into the nucleus together with TCF/LEF transcription factors thereby activating
  gene expression of Wnt-responsive elements that are related to cell growth and differentiation.
  The non-canonical Wnt pathway in contrast does not depend on the stabilization of
  β-catenin. Rather, it controls cytoskeletal dynamics, mitotic spindle formation
  as well as cell polarity. The binding act of Wnt leads to the activation of alternative
  mediators YAP/TAZ that in conjunction with transcription factors TEADs activates
  the target genes, whereas the mitotic proteins stability maintains the appropriate
  organization of microtubules during cell division. Cumulatively, these two contrasting
  branches of Wnt signaling coordinate extracellular signals to precisely regulate
  gene expression, cytoskeleton reorganization, and cell fate assignments, and altered
  balance connects these functions to cancer, developmental pathologies, and tissue
  disorders
