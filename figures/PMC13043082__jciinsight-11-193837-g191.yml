figure_title: CD9+ adipose tissue macrophages have increased expression of extracellular
  matrix remodeling and adhesion genes
caption: 'Bulk RNA-Seq analysis of CD9+ and CD9– adipose tissue macrophages (ATMs)
  sorted from epididymal white adipose tissue (eWAT) of WT male mice fed an HFD for
  12 weeks (n = 3–5). (A) Volcano plot of gene expression in CD9+ versus CD9– ATMs
  showing the log2 fold-change (FC; x axis) and adjusted P value (–log10 FDR; y axis)
  of genes. Significantly differentially expressed genes (log2 FC > 0.58 and FDR <
  0.05) are shown in purple. (B) Differential expression of genes previously associated
  with CD9+ macrophages (log2 FC of CD9+ ATMs/CD9– ATMs). Genes are listed in order
  from highest to lowest log2 FC. (C) Gene set enrichment analysis showing all Reactome
  pathways significantly upregulated in CD9+ ATMs compared with CD9– ATMs. (D) Heatmap
  of differentially expressed genes (FDR > 0.1) from Extracellular Matrix Organization
  Pathway (Reactome: R-MMU-1474244). P2RY1, p2Y purinoreceptor 1'
