figure_title: DNA in body fluids and allergens
caption: (A) The DNA level in BAL in DC participants (n = 12), patients with N-NA
  (n = 17), and those with NA (n = 17). (B) The DNA level in serum in the DC (n =
  14), N-NA (n = 16), and NA (n = 16) groups. (C) Correlation analyses between the
  DNA and PMN in BAL (n = 31). Statistical comparisons are between reads from individuals
  in the DC group and patients with NA. (D) Comparison of DNA in BAL, serum, and sputum
  from patients with asthma (n = 6). (E) The presence of DNA in allergen extracts
  and PM2.5 (n = 3 per group). (F) Nuc-bound DNA in BAL from patients in the DC (n
  = 10), N-NA (n = 16), and NA (n = 16) groups. (G) MPO-bound DNA in BAL from patients
  in the DC (n = 10), N-NA (n = 21), and NA (n = 21) groups. (H) The inflammasome
  cytokine IL-1β in BAL from patients with NA or N-NA, and those in the DC group (n
  = 20 from each type). (I) The innate cytokine IL-6 in BAL from patients with NA
  (n = 17) or N-NA (n = 17), and those in the DC group (n = 17). (J) The STING pathway
  cytokine CXCL10 in BAL from participants in the NA (n = 32), N-NA (n = 17) and DC
  (n = 18) groups. (K) The type 3 cytokine IL-17A in BAL from participants in the
  NA, N-NA, and DC groups (n = 16 with each type). (L) Expression of mRNA for DNA
  sensors in bronchial mucosa and epithelial cells from another cohort of 60 patients
  with NA versus 30 with N-NA was assessed by microarray, as reported previously (16).
  The inset (M) shows a dot plot of expression of IFI16 mRNA in NA and N-NA. (N and
  O) BAL CXCL9 and IFN-β from patients with NA (n = 36) or N-NA (n = 20) and those
  with DC (n = 14). Data are shown as mean ± SEM. Statistical differences in A, B,
  D, E–K, N, and O were tested using the Mann-Whitney U test. Statistical significance
  (P values) of difference between the groups are shown above the bar graphs. Padj,
  adjusted P value
article_title: Allergens abrogate antiinflammatory DNA effects and unmask macrophage-driven
  neutrophilic asthma via ILC2/STING/TNF-α signaling
