figure_title: RNA-Seq analysis of the ΔFvcon7 mutant.
caption: 'RNA-Seq analysis of the ΔFvcon7 mutant. (a) Volcano maps for differential
  expression genes (DEGs) identified by |log2_fold change| > 1.2; the fold change
  was obtained by calculating the ratio of the ΔFvcon7/WT to the FKPM values. DEG
  analysis was conducted using cuffdiff v2.1.1 with the following parameters: FDR
  (False Discovery Rate) ≤ 0.05, --library–norm-method = classic-fpkm --/-multi-read-correct,
  and--frag-bias-correct. Red dots: significantly up-regulated genes. Green dots:
  significantly down-regulated genes. Blue dots: non-differentially expressed genes.
  (b,d) The bubble maps for the enriched genes of down-regulated DEGs by GO analysis
  and KEEG analysis; (b) x-axis displays the number of genes in GO terms and the right
  y-axis shows GO terms; (d) x-axis displays the number of genes in the KEEG pathway
  and the right y-axis shows the KEEG pathway; (c,e) bubble maps for the enriched
  genes of up-regulated DEGs by GO analysis rate and KEEG analysis; (c) x-axis displays
  the rate of genes in GO terms and the right y-axis shows GO terms; (e) x-axis displays
  the number of genes in the KEEG pathway and the right y-axis shows the KEEG pathway.
  The size of the dot indicates the number of genes, and the different colors represent
  different Padj in (b–e)'
