figure_title: Inhibitors of the cGAS-STING pathway.
caption: 'Inhibitors of the cGAS-STING pathway. These inhibitors are primarily divided
  into two categories: cGAS inhibitors and STING inhibitors. cGAS inhibitors include
  DNA binding inhibitors and catalytic site inhibitors. STING inhibitors function
  through four main mechanisms: interference with the CDNs-binding pocket, suppression
  of STING oligomerization, inhibition of palmitoylation, and inhibition of TBK1 activation.
  By targeting key proteins within this pathway, these inhibitors offer promising
  therapeutic alternatives for the treatment of pulmonary diseases'
