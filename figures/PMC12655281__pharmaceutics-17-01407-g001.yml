figure_title: Schematic illustration of nasal-to-brain anatomical pathways.
caption: 'Schematic illustration of nasal-to-brain anatomical pathways. Intranasally
  administered siRNA nanocarriers can be transported to the brain via two major anatomical
  routes: (i) the olfactory pathway, where carriers cross the olfactory epithelium
  and reach the olfactory bulb, and (ii) the trigeminal pathway, where carriers penetrate
  the respiratory epithelium and are transported through trigeminal nerve branches.
  These pathways bypass the BBB and allow direct access to CNS tissue. Abbreviations:
  BBB, blood–brain barrier; CNS, central nervous system. [Created by Figdraw (www.figdraw.com,
  Accessed on: 12 September 2025), ID: ATROIdfdbb]'
