figure_title: Spinal cord circRNA alterations associated with ongoing allodynia in
  morphine-treated minor nerve-injured PAE male mice
caption: DE circRNAs between the PAE + minor CCI + morphine vs. Control mice + minor
  CCI + morphine group. A. The volcano plot displays the log2(fold-change) on the
  x-axis and −log10(FDR-corrected p-value) on the y-axis. Based on the FDR-corrected
  p-value <0.05 and a log2(fold-change)>|0.25|, there were 199 DE circRNAs (106 upregulated
  and 93 downregulated). CircRNAs were color-coded, with red representing significantly
  upregulated and downregulated circRNAs. Blue circles indicate circRNAs that met
  the p-value criteria but not the log2(fold-change) criteria, green circles indicate
  circRNAs that met the log2(fold-change) criteria but not the log10(FDR-corrected
  p-value), and gray circles are circRNAs that are not significant. Notable circRNAs
  of interest are labeled on the volcano plot. B. Top upregulated and top downregulated
  circRNAs of interest in spinal cord data. C. Top network pathways from DE circRNAs.
  A total of 14 networks were identified as significant networks. Among the significant
  networks, the top two networks with z scores of 20, and 13, respectively, are demonstrated.
  D. Bubble plot output of IPA canonical pathways in the circRNA dataset to identify
  pathways directly involved in the molecular dysregulation occurring from prenatal
  alcohol exposure and morphine. E. Diseases and biological functions associated with
  spinal cord circRNAs, with the same criteria as the mRNA dataset in Fig. 3
article_title: Prenatal alcohol exposure induces circular and linear long non-coding
  RNAs, and protein-coding genes linked to proinflammatory neuroimmune function, promoting
  nerve injury-induced allodynia following morphine treatment
