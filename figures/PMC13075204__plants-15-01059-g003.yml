figure_title: BTB proteins function as central regulators in plant responses to temperature
  stress.
caption: 'BTB proteins function as central regulators in plant responses to temperature
  stress. (A) Heat Stress: In Arabidopsis, BPM1 targets the transcriptional activator
  DREB2A for degradation to prevent growth retardation associated with its constitutive
  accumulation. Under heat stress, this degradation persists despite the transcriptional
  induction of DREB2A, establishing a dynamic equilibrium. Although heat-responsive
  genes (HSFA3, HSP70/90) are strongly induced after heat treatment, BPM1 overexpression
  suppresses the induction of HSFA2 and ONSEN. LFH1 promotes early flowering by degrading
  the repressor SVP. Additionally, NPR1 oligomers act as molecular chaperones to prevent
  protein aggregation. (B) Cold Stress: (1) Flowering: Cold-induced WRKY34 activates
  the CRL3-LRB1/2 complex to degrade FRIGIDA (FRI), leading to the silencing of FLC
  to promote vernalization. (2) CBF Pathway: SlBTB19 (tomato) and MdBT2 (apple) negatively
  regulate cold tolerance by degrading the positive regulators SlWRKY2 and MdMYB23,
  respectively, thereby attenuating downstream CBF expression. (3) Physiology: CaBPM4
  (pepper) enhances cold tolerance by reducing MDA levels and increasing POD activity.
  Solid lines indicate direct regulation; dashed lines represent indirect associations
  or physiological outcomes; T-bars indicate inhibition; U denotes ubiquitination.
  This schematic represents a proposed working model synthesized from established
  literature. This figure was drawn using Microsoft PowerPoint'
