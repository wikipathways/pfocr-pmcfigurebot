figure_title: Synthesis of ceramides.
caption: 'Synthesis of ceramides. (A) Chemical structure of ceramide. (B) De novo
  synthesis occurs in the endoplasmic reticulum (ER) by the activation of several
  enzymes, such as SPT: serine palmitoyl transferase; 3KSR: 3-ketosphinganine reductase;
  CerS: ceramide synthases; and DES: dihydroceramide desaturase. The salvage pathway
  is the synthesis of ceramide from sphingosine that occurs in endo/lysosomes by the
  action of SMPD: sphingomyelin phosphodiesterase; SMS: sphingomyelin synthases; and
  ceramidase. The sphingomyelin pathway is a catabolic pathway on the cellular membrane
  and occurs by the hydrolysis of sphingomyelin (SM) in the presence of sphingomyelinases
  (Smases); Smsases: sphingomyelin synthases. R* = represent the acyl chain that determines
  the ceramide species, which are highly diverse in chain length, hydroxylation, and
  saturation, particularly within the skin’s stratum corneum'
