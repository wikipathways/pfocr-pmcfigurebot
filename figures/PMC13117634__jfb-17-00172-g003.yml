figure_title: Key gene-level changes following electrical stimulation.
caption: Key gene-level changes following electrical stimulation. (left panel) In
  neurons, electrical stimulation triggers Ca2+ influx through VGCCs, activating the
  transcription factor CREB, which upregulates neuroregeneration-associated genes
  such as BDNF and GAP43. (right panel) In NSCs, electrical stimulation activates
  the PI3K/Akt/GSK-3β signaling pathway, upregulating proneural factors (NeuroD1,
  Ascl1) and downregulating the Notch effector Hes1 via β-catenin nuclear translocation
