figure_title: Lipid classification based on structure and biosynthesis.
caption: Lipid classification based on structure and biosynthesis. Lipids are categorized
  into eight major classes. Lipid classes derived from the condensation of ketoacyl
  subunits (orange block) include fatty acyls (hexadecanoic acid), glycerolipids (1-dodecanoyl-sn-glycerol),
  glycerophospholipids (1-hexadecanoyl-2-(9Z-octadecenoyl)-sn-glycero-3-phosphocholine),
  sphingolipids (N-(tetradecanoyl)-sphing-4-enine), saccharolipids (UDP-N-acetyl-αD-glucosamine),
  and polyketides (griseorhodin A). In contrast, sterol lipids (cholesterol) and prenol
  lipids (vitamin A) (purple block) originate from the condensation of five-carbon
  (C5) isoprene units through the mevalonate or methylerythritol phosphate pathways.
  Representative structures are shown for each class to highlight fundamental backbone
  architectures. The aforementioned grouping is based on LIPID MAPS classification
  framework
