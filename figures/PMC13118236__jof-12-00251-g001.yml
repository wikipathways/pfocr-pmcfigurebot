caption: 'Metabolic engineering strategy for α-bisabolol production in Saccharomyces
  cerevisiae. The engineered pathway depicts key steps from central carbon metabolism
  (glucose) to α-bisabolol biosynthesis. Black arrows represent reactions catalyzed
  by the core endogenous mevalonate (MVA) pathway. Red arrows indicate heterologously
  introduced or enhanced enzymatic steps specific to bisabolol production. Abbreviations:
  Pdc, pyruvate decarboxylase; Ald, aldehyde dehydrogenase; Acs, acetyl-CoA synthetase;
  Erg10, acetyl-CoA C-acetyltransferase (thiolase); Erg13, hydroxymethylglutaryl-CoA
  synthase (HMG-CoA synthase); tHMG1, truncated hydroxymethylglutaryl-CoA reductase
  (HMG-CoA reductase); Erg12, mevalonate kinase; Erg8, phosphomevalonate kinase; Erg19,
  diphosphomevalonate decarboxylase; Idi, isopentenyl diphosphate isomerase; Erg20,
  farnesyl diphosphate synthase; OsTPS1, Oryza sativa α-bisabolol synthase (heterologous
  terpene synthase); IPP, isopentenyl diphosphate; DMAPP, dimethylallyl diphosphate;
  GPP, geranyl diphosphate; FPP, farnesyl diphosphate'
