caption: Analysis of DAMs that are common to all three stress comparisons (C vs. SHT,
  S vs. SHT, and HT vs. SHT). (a) Venn diagram showing the overlap of DAMs among the
  three comparisons (the center subset represents metabolites shared by all three).
  (b) Cluster analysis of the metabolites shared among all three comparisons, revealing
  three distinct clusters (Class I, II, and III) with different accumulation patterns.
  (c–e) KEGG enrichment analyses for the metabolites in Class I, Class II, and Class
  III, respectively. Red dashed lines in (c–e) highlight key modules or enriched pathways
  related to glutathione and flavonoid metabolism under stress conditions
