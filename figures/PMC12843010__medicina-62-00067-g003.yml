caption: Risk-adapted screening pathway for PDAC detection in patients ≥50 years with
  NOD. The flowchart illustrates a pragmatic, stepwise approach based on initial clinical
  risk enrichment, model-based risk stratification (e.g., ENDPAC), and targeted imaging
  (MRI/CT and EUS) for high-risk individuals, while low-risk patients continue standard
  diabetes care. The pathway reflects current evidence and requires prospective validation.
