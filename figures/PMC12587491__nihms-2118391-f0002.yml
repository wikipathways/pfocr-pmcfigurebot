figure_title: SAT retains insulin-sensitizing resident ATMs in obesity
caption: (A-E) Single cell RNA-seq analysis of ATMs in VAT and SAT of mice fed NCD,
  HFD, and HFDNCD switch diet, and HFD mice treated with rosiglitazone. (A) UMAP representation
  of six different ATM and three different monocyte clusters. (B) Heatmap showing
  cluster-specific marker gene expression in each of adipose tissue monocytes and
  macrophages. (C) Heatmap showing pathways enriched in each of five different ATM
  clusters. (D) UMAP representation of six different ATM and three different monocyte
  clusters in different diet and/or treatment conditions. (E) Proportion of each of
  six ATM clusters among total ATMs in different diet and/or treatment conditions.
  (F) Flow cytometry analysis of CD11c+ (recruited) or CD301b+ (resident) ATMs in
  VAT and SAT of HFD mice (n=12 mice per group). (G) Effect of sEVs derived from SAT
  and VAT ATMs of HFD mice on insulin sensitivity in normal and PA-treated, insulin
  resistant L6 myotubes. Effects of sEVs released from CD11c− CD206+ ATMs from visceral
  adipose tissue were compared in parallel (n=6 wells/group). ns, not significant.
  *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. All data are mean +/− SEM.
  Statistical analysis was performed by unpaired Student’s t-tests or 2-way ANOVA
  with Tukey’s multiple comparison tests. See also Figure S2
