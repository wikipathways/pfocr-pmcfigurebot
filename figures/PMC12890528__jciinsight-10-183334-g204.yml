figure_title: Single-cell analysis identifies cardiac LPIN1
caption: (A) Uniform Manifold Approximation and Projection (UMAP) plot of single-cell
  transcriptomes of cardiomyocytes and noncardiomyocytes from 3 patients with heart
  failure (HF) and 3 control (CTRL) patients. The heart tissue cells were divided
  into 6 clusters which are color-coded by cell type. Cardiac LPIN1 is mainly expressed
  in cardiomyocytes. (B) Feature plots of expression distribution for cardiomyocytes
  (clusters 0 and 2). The expression level of LPIN1 is color-coded. (C) Pathway analysis
  indicated significant changes in gene expression related to lipid and fatty acid
  metabolism pathways between HF and CTRL cardiomyocytes. (D) The expression level
  of cardiac LPIN1 was decreased in patients with HF compared with the CTRL
article_title: Myocardial lipin1 protects the heart against ischemic injury by preserving
