figure_title: Experimental validation of key gene expression in a mouse MASH model.
caption: 'Experimental validation of key gene expression in a mouse MASH model. (A)
  The successful establishment of the MASH mouse model confirmed by HE and Oil Red
  O staining (n = 4). WT + MCS: Wild-type mice on MCS diet; WT + MCD: Wild-type mice
  on MCD diet. (B) Volcano plot showing differential gene expression between the MASH
  and control groups, including key genes. (C) GSEA reveals enrichment of the glycolysis
  pathway in MASH model mice. (D) Bar chart showing expression differences of CDK1,
  SOX9, and HKDC1 between MASH and control groups. **, p < 0.01. (E) Heatmap showing
  differential expression of key genes between MASH and control groups. (F) Protein
  expression levels of SOX9 in MASH and control groups'
