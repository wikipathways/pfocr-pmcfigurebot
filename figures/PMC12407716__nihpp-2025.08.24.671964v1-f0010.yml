figure_title: Differentially Abundant Metabolites Between F.
caption: Differentially Abundant Metabolites Between F. violacea Extracts and Juices.
  Dendrogram and intensity heatmap of differentially abundant metabolites (log2-fold
  change > 1 and FDR < 0.05) between sample processing methods with intensities greater
  than 1 million. The dendrogram was constructed using Tanimoto dissimilarity based
  on PubChem fingerprints. Leaf labels indicate the PubChem CID of each metabolite
  (if available), with natural product biosynthetic pathway classification shown in
  parentheses. Black heatmap tiles indicate metabolites that were not detected in
  the respective sample (intensity < 10,000). A bar graph of log2-fold change is displayed
  to the right of the heatmap, with colors representing the group in which each compound
  is enriched. M = million
