figure_title: An overview of pathways involved in urinary sensation.
caption: An overview of pathways involved in urinary sensation. Lines indicate general
  pathways involved in taking information from the lower urinary tract (LUT) through
  the nervous system. Hypothesized regions encoding low-intensity or innocuous mechanosensory
  inputs from filling are represented in blue, and hypothesized high-intensity or
  nociceptive sensory information is shown in red. In the brain, LUT bladder filling
  information travels through multiple regions that process these cues, conveyed by
  the blue line without specific anatomical connections drawn. Boxes denote identified
  functions of brain regions in processing lower urinary tract sensory information
  and in shaping urinary behaviors. Efferent pathways that drive urination are shown
  in green.Bar, Barrington’s nucleus; CeA, central nucleus of amygdala; dACC, dorsal
  anterior cingulate cortex; DGC, dorsal gray commissure; dlPAG, dorsolateral periaqueductal
  gray; DRG, dorsal root ganglion; Ins.Ctx, insular cortex, IML, intermediolateral
  cell column; lcp, lateral collateral pathway; LC, locus coeruleus; LHA, lateral
  hypothalamic area; mPFC, medial prefrontal cortex; NTS, nucleus of the solitary
  tract; ON, Onuf’s nucleus (dorsolateral nucleus is the rodent equivalent of Onuf’s
  nucleus); PBN, parabrachial nucleus; PGN, pre-ganglionic neurons; SPN, sacral parasympathetic
  nucleus; vlPAG, ventrolateral periaqueductal gray
