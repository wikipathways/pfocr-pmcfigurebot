figure_title: (a) Viability assay of Ba/F3_Cas9_N1A1 (1.
caption: (a) Viability assay of Ba/F3_Cas9_N1A1 (1.) and Ba/F3_Cas9_2GN1A1 (2.) cells
  treated with the indicated concentrations of the Alk inhibitor (NVP-TAE648). Viability
  was monitored via flow cytometry after 24 and 48 h (data in technical triplicates).
  Ba/F3_Cas9 cells grown in the presence of IL-3 were used as control (3.). Statistical
  significance of the viability differences Npm-Alk rearranged cells at each concentration
  compared to the untreated control are highlighted p < 0.01 (**) or p < 0.001 (***).
  (b) Volcanoe plot of differentially regulated genes in Ba/F3 control, Ba/F3 MIG-NA
  and Ba/F3 Cas9-2GN1A1 cells determined by microarray gene expression analysis. The
  graph shows log2 fold up- or downregulation plotted against the FDR-adjusted p-value
  (−log10) in Ba/F3 Cas9-2GN1A1 cells compared to Ba/F3-MIG-NA cells. The horizontal
  dashed line indicates the statistical significance threshold at −log10(p) = 1.3
  (corresponding to p = 0.05). (c) Heatmap of gene expression changes showing the
  top 40 differentially expressed genes between Npm-Alk overexpressing cells (MIG)
  and Npm-Alk rearranged cells (eCAS9). (d) Gene set enrichment analysis (GSEA) of
  differentially expressed genes between MIG and eCAS9 cells based on the REACTOME
  [38] pathway database
