figure_title: Summary flow chart of potential pathway through which reductions in
  Jmjd3 expression could reduce expression of key genes that affect myogenesis, as
  indicated by RNA-seq and QPCR data in the present investigation.
caption: Summary flow chart of potential pathway through which reductions in Jmjd3
  expression could reduce expression of key genes that affect myogenesis, as indicated
  by RNA-seq and QPCR data in the present investigation. Increased H3K27 methylation
  of Pax7 is associated with reductions in Pax7 expression and reduced expression
  of 17 genes that are directly activated by Pax7. Reduced expression of two of those
  Pax7 targets, Myf5 and Myod1, is associated with down-regulation of genes that are
  activated by Myf5 and / or Myod1, including Myog. Myog down-regulation is then associated
  with down-regulation of the expression of 27 additional Myog target genes that are
  not also targets of Myod1. Gene names that are underlined are genes that were identified
  as down-regulated by RNA-seq and their down-regulation was verified by QPCR. Gene
  names that are shown in red type were identified as down-regulated by RNA-seq or
  QPCR and their down-regulation confirmed by western blot and immunohistochemistry.
  * indicates that many genes that are regulated by MyoD are also regulated by Myf5
  although MyoD is generally a stronger transcriptional activator (45)
article_title: Hemizygous mutation of Jmjd3 in muscle stem cells increases H3K27 methylation
  on Pax7 leading to impaired myogenesis
