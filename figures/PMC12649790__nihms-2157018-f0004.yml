caption: The repression in pRSK increase immediately after the Standard protocol was
  relieved by inhibition of RSK (B) or p38 MAPK (C). A, Partial circuit diagram showing
  pathways targeted with inhibitors. B1, Representative confocal images immediately
  after 5-HT, in the absence or presence of RSK inhibitor BI-D1870 (BID). B2, Summary
  data. BID significantly increased pRSK induced by 5-HT. C1, Representative confocal
  images of pRSK in SNs immediately after 5-HT, in the absence or presence of p38
  MAPK inhibitor SB203580 (SB). C2, Summary data. SB significantly increased pRSK
  induced by 5-HT. * p < 0.05. In B2 and subsequent plots, circles with the same color
  indicate the results are from the same animal
