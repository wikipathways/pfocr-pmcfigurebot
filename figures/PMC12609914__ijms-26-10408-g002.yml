figure_title: Inflammatory signaling pathway between the IFP and articular cartilage.
caption: Inflammatory signaling pathway between the IFP and articular cartilage. The
  IFP contains adipocytes, macrophages, and T cells within a highly vascularized environment.
  Upon activation, these cellular components release pro-inflammatory cytokines including
  TNF-α, IL-6, VEGF, and PGE2. These inflammatory mediators target the articular cartilage,
  potentially affecting chondrocyte metabolism and contributing to cartilage degradation
  [53]. The proximity of the IFP to the cartilage-subchondral bone interface facilitates
  this paracrine signaling mechanism in knee joint pathophysiology. Figure created
  with the assistance of artificial intelligence and scientifically validated by the
  authors
