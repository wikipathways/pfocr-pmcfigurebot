caption: rGE. Schematic representation of GRM-SEM model structures as illustrated
  for a six-variate trait shown for (a) an Independent Pathway model (with a 2-factor
  genetic and a 2-factor residual structure) without rGE and (b) an Independent Pathway
  model (with a 2-factor genetic and a 2-factor residual structure) with rGE. For
  (a), ΛA and ΛE capture genetic and residual factor loadings, and ΦA and ΦE genetic
  and residual factor (co)variance, with each factor variance constrained to one (i.e.
  a diagonal of 1).For (b), Φ*A and Φ*E are extended ΦA and ΦE matrices including
  gene-environment covariance Φcov(AE). White squares indicate values of zero and
  black squares values of one.G – Genetic Relationship Matrix; GRM-SEM - Genetic-Relationship-Matrix
  Structural Equation Modelling; I – Identity matrix; k - Degrees of freedom; nA -
  Number of genetic factor; nE - Number of residual factors
