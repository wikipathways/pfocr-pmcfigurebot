figure_title: NVP-BHG712 downregulates TGF-β1–induced expression of genes related
  to ECM organization, protein trafficking, and ER cargo concentration regulation
caption: (A) Lungs were isolated from WT mice, and fibroblasts were cultured. Fibroblasts
  were then simultaneously treated with the profibrotic cytokine TGF-β (20 ng/mL;
  or PBS as control) and the EphB4 inhibitor NVP-BHG712 (250 nM; or DMSO as inhibitor
  control) for 24 hours (n = 9). RNA was isolated and NanoString was performed on
  a 47 gene CodeSet to examine the expression of downregulated DEGs identified by
  RNA-Seq in bleomycin-challenged Ephb4-CKO lung fibroblasts. (B) Transcript levels
  of a subset of the CodeSet of genes that were significantly upregulated with TGF-β1
  treatment and downregulated with NVP-BHG712 treatment and were associated with ECM
  organization, protein trafficking, and ER cargo concentration regulation (remaining
  genes can be found in Supplemental Figure 6). Gene expression was normalized to
  housekeeping genes Rplp0 and Acad9 and displayed as log2 transformed gene expression
  (mean ± SD). Wilcoxon signed rank test with FDR q ≤ 0.05 was used to identify significant
  changes in gene expression. Legend colors indicate the gene-associated pathDIP-identified
  pathways. *q < 0.05
