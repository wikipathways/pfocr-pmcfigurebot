caption: Ipriflavone inhibits PRRSV replication by promoting the activation of RIG-I/IRF3
  signaling pathway. Marc-145 cells were mock treated or treated with ipriflavone
  and then infected with PRRSV (MOI = 0.1) for different time periods (0, 9, 12, and
  24 hpi). (A) The RIG-I, MAVS, pIRF3, IRF3, pSTAT1, STAT1, and PRRSV N protein were
  detected by Western blot. (B–F) The relative expression levels of RIG-I, MAVS, pIRF3,
  pSTAT1, and N protein were quantified using Image J software. The asterisks in the
  figures indicate significant differences (*** p < 0.001)
