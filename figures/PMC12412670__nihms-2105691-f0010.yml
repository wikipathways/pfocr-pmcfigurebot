figure_title: Metabolomics analysis of week 2 human hepatocyte spheroid samples (lot
  HUM191501) treated with 50 μM CBD and 1 mM VPA individually or in combination
caption: A) PCA plot using all peaks in the metabolomics dataset for week 2 samples
  treated with DMSO (vehicle control), 50 μM CBD alone, 1 mM VPA alone, or 50 μM CBD
  and 1 mM VPA in combination. Analysis was performed using SIMCA. B) Pathway analysis
  plot of DMSO-treated samples versus samples treated with 50 μM CBD plus 1 mM VPA
  in combination. Pathway analysis was conducted using the “Functional Analysis” module
  in MetaboAnalyst software 6.0 using all peaks with their respective p-values calculated
  using Students’ t-test. A p-value cutoff using the default top 10% of peaks by p-value
  was used, and the Homo sapiens (human) [KEGG] pathway library was selected. C) Heatmap
  of in-house matched metabolites with a significant ANOVA p-value across all groups.
  Heatmaps were generated using Euclidean distance measures and the Ward clustering
  method. Heatmaps are auto-scaled (mean-centered and divided by standard deviation)
  for each metabolite. MetaboAnalyst software 6.0 was used for data analysis and visualization
