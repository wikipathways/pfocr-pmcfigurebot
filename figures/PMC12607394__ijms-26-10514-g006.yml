caption: Comparative expression of the genes involved in upstream and downstream cancer
  pathways following husk extract treatment on cancer cell lines. Expression of genes
  in the (A) upstream EGFR pathway and the (B) downstream EMT pathways for HCT116
  and HT29 cells treated with the husk extract. The blue and red bars represent the
  level and intensity of gene expression, respectively. EMT and MET are non-binary,
  reversible processes that emphasize the plasticity of cells to transition between
  these two states. Data were compared using a paired t-test. * p < 0.05
