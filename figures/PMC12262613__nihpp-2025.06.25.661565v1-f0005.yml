figure_title: Relieving autoinhibition of the Mtw1 subcomplex with dsn1–2D improves
  assembly of CCAN components
caption: (A-F) Percentages of CEN3 DNAs with colocalized GFP-tagged inner kinetochore
  proteins after assembly in DSN1 and dsn1–2D lysates. All DSN1 data are replotted
  from Figure 2A for comparison. GFP-tagged proteins in the dsn1–2D background include
  Ndc10 (SBY22905), Cse4 (SBY22193), Ame1 (SBY22117), Ctf19 (SBY22114), Iml3 (SBY22197),
  and Ctf3 (SBY22201).(A) Percentages of CEN3 DNAs with colocalized GFP tagged inner
  kinetochore proteins after assembly in dsn1–2D lysates, including the same data
  from Figure 4A–F, plus data for Mif2-GFP (SBY22092) and Wip1 (SBY22205).(B) Schematic
  model illustrating the change in assembly order of the inner kinetochore in dsn1–2D
  lysates (right pathway) compared to wild type (left pathway, from Figure 2B). (i)
  Ndc10 binds to CEN3 DNA to initiate kinetochore assembly. (ii) The Cse4 centromeric
  nucleosome forms. (iii) Mif2 binds to the centromeric nucleosome. (iv) Ame1 and
  the rest of non-essential CCAN proteins (not included) assemble.All error bars represent
  the standard deviation over three biological repeats. At least 3,000 DNA molecules
  were imaged for each time point from each biological replicate
article_title: Direct observation of interdependent and hierarchical kinetochore assembly
  on individual centromeres
