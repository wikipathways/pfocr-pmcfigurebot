caption: 'Typical patient journey from symptom onset to follow-up in gastrointestinal
  disease. (A) Community and primary care pathway: the patient develops symptoms (1),
  consults a general practitioner (GP) (2), and is referred to secondary care (3).
  (B) Hospital pathway: The patient is reviewed in gastroenterology outpatient clinic
  (1), referred for endoscopy and imaging (2), and undergoes endoscopy-guided biopsies
  for histological confirmation of diagnosis (3). Treatment is initiated based on
  findings (4), followed by regular follow-up (5). Image created with BioRender.com.
  https://app.biorender.com/user/ (accessed on 1 January 2026)'
