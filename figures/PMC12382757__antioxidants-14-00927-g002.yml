figure_title: Metabolic alterations detected in blood pre- and post-exercise.
caption: 'Metabolic alterations detected in blood pre- and post-exercise. (A) RBC
  and (B) plasma heat maps of top 25 metabolites significantly different (ANOVA) between
  hG6PDND and hG6PDA− taken from the post/pre-fold-change (AC = acylcarnitines, FA
  = fatty acids). (C) Glycolysis, pentose phosphate pathway, and TCA intermediates
  before and after CS tests. Metabolite name is color coded according to fraction:
  plasma (blue) and RBC (red) and lines coded according to G6PD status hG6PDND (gray)
  and hG6PDA− (aqua). (D) Post/pre-fold-change of 2,3-BPG. (E) Trace metal analysis
  of RBCs before and after exercise. (F) Scanning electron microscopy images of RBC
  morphology pre- and post-run to exhaustion (Significance: *: p < 0.05, **: p < 0.01)'
