figure_title: The dysregulation of the STING pathway in GBM.
caption: 'The dysregulation of the STING pathway in GBM. A: The dysregulated STING
  signaling pathway in GBM tumor cells. STING promoter hypermethylation (cg16983159)
  decreases STING expression in GBM cells, leading to insufficient STING activation.
  LncRNA FAM131B-AS2 facilitates the repair of replication stress-induced DNA damage
  by recruiting USP7 to stabilize RPA1 and activate the ATR pathway, thereby diminishing
  DNA accumulation-mediated STING activation. Similarly, PP2A serves as a negative
  regulator for STING activation by suppressing cytosolic dsDNA accumulation through
  enhancing DNA repair and genetic stability. B: The dysregulated STING signaling
  pathway in GBM-associated macrophages. The PP2A/STRN4-Hippo-YAP/TAZ axis can suppress
  STING-driven type I IFN production in macrophages. Besides, a hypoxic environment
  promotes the release of EVs from GBM cells and increases miR-25/93 expression in
  EV cargos. When macrophages take up these EVs, the contained microRNAs hinder the
  expression of the cGAS protein. Together, these dysregulations blunt STING-mediated
  immune surveillance. USP7: ubiquitin-specific peptidase 7; RPA1: replication protein
  A1; ATR: Ataxia Telangiectasia and Rad3-related; PP2A: protein phosphatase 2A; YAP:
  Yes-associated protein; TAZ: Transcriptional co-activator with PDZ-binding motif;
  EVs: extracellular vesicles'
