figure_title: GO and KEGG analysis of FDR P value significant miRNAs in the LBD versus
  AD comparison
caption: 'GO and KEGG pathway analyses were performed via DIANA miRPath v4.0 using
  the TarBase v8.0 database. FDR P values were calculated using a one-sided Fisher’s
  exact test. The top 10 (ranked by number of target genes) terms within each of the
  three GO categories (BP, CC, MF) and top 10 (ranked by number of target genes) KEGG
  pathways were identified for each pulldown. (A) Top 10 terms within each GO category
  for GluR2+ EV miRNAs. (B) Top 10 KEGG pathways for GluR2+ EV miRNAs. (C) Top 10
  terms within each GO category for GLAST+ EV miRNAs. (D) Top 10 KEGG pathways for
  GLAST+ EV miRNAs. In all panels, each bar is labeled to the right with the number
  of differentially expressed miRNAs associated with the given GO term or KEGG pathway.
  Abbreviations: LBD, Lewy body disease; AD, Alzheimer’s disease; EV, extracellular
  vesicle; FDR, false discovery rate; GO, Gene Ontology; KEGG, Kyoto Encyclopedia
  of Genes and Genomes; BP, biological process; CC, cellular component; MF, molecular
  function'
