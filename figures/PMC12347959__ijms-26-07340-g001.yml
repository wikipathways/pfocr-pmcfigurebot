figure_title: Interplay between NRs and miRNAs in bladder homeostasis and cancer.
caption: Interplay between NRs and miRNAs in bladder homeostasis and cancer. NRs regulate
  gene expression by binding to specific ligands and modulating transcriptional programs
  involved in cell differentiation, contraction, and metabolism, contributing to normal
  bladder functions (1,2). miRNAs, which are synthesized through canonical biogenesis
  pathways involving Dicer and the RNA-induced silencing complex (RISC), fine-tune
  gene expression posttranscriptionally (3). Cross-regulation occurs as NRs modulate
  miRNA biogenesis and transcription, whereas miRNAs regulate NR expression, establishing
  feedback loops. Dysregulation of these interactions contributes to BCa pathophysiology
  by increasing proliferation, metastasis, inflammation, and evasion of apoptosis
  (4). Solid black straight arrows indicate direct sequential processes, red and black
  up arrows indicate increased activity, while dashed arrow represents inhibition
  process. Created with BioRender.com (accessed on 1 May 2025)
