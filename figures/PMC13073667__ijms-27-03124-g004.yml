figure_title: Enrichment of inflammatory and tumor microenvironment signaling of aqueous
  humor proteins in advanced-stage uveal melanoma.
caption: Enrichment of inflammatory and tumor microenvironment signaling of aqueous
  humor proteins in advanced-stage uveal melanoma. (A) Canonical pathway analysis
  of aqueous humor proteomics comparing AJCC Stage I–II and Stage III–IV tumors reveals
  the enrichment of inflammatory and tumor microenvironment-related pathways. Bars
  indicate activation z-scores, dots represent −log (p-value), and circle size reflects
  the number of molecules per pathway. (B) Upstream regulator analysis predicts the
  activation of VEGFA and CCL2. Red bars represent activation z-scores, and dots indicate
  −log (p-value). (C) Estimated concentrations of aqueous humor VEGFA and CCL2 are
  compared between Stage III–IV and Stage I–II tumors. Concentrations are presented
  on a logarithmic scale. (D) Expression levels of selected VEGFA downstream targets
  (FLT1, FGF2, LAG3, MMP1, KDR, CXCL8, CXCL10, and PDCD1) are elevated in advanced-stage
  disease, consistent with the activation of angiogenic and immune-modulatory signaling
  networks. Estimated concentrations are shown on a logarithmic scale. Statistical
  significance is indicated as * p < 0.05, ** p < 0.01, and *** p < 0.001
