figure_title: IPA-derived gene–function interaction networks following pioglitazone
  exposure.
caption: IPA-derived gene–function interaction networks following pioglitazone exposure.
  (A) Functional interaction map linking differentially expressed genes with inferred
  biological outcomes, highlighting pathways related to fibrosis of liver and cellular
  accumulation, with predicted directional effects based on IPA knowledgebase inference.
  (B) Gene interaction network of significantly altered genes after exposure, illustrating
  curated functional/physical relationships among “focus molecules” used to build
  the network. Node colour reflects expression change direction (up/down), while edge
  styles indicate interaction type/direction as defined by IPA. The meaning of IPA
  node colours, edge types, and molecule-shape codes is provided in Supplementary
  Figure S1
