figure_title: Plant hormones involved in the regulation of epicotyl dwarfing.
caption: Plant hormones involved in the regulation of epicotyl dwarfing. (A) KEGG
  enrichment analysis of the signal transduction pathway of plant hormones. (B) GA
  and CTK contents on different days of PBZ treatments. Different letters indicate
  significant differences (p ≤ 0.05) according to Duncan’s test. (C) Regulatory patterns
  and DEG changes for plant hormone signal transduction pathways. (D) DEG expression
  was identified and verified on different days of PBZ treatment. The left Y-axis
  represents the basic level of DEGs in the transcriptome, and the right Y-axis represents
  the relative expression of DEGs, as determined using RT-qPCR. Data represent the
  means of three biological replicates (±SD)
