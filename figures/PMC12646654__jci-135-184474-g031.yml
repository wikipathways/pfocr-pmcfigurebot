  diphosphate; GDI, Guanine Nucleotide Dissociation Inhibitor; Pi, dihydrogen phosphate.
  (B and C) Schematic diagrams of ARHGAP19 gene (B) and protein (C). Introns are not
  to scale. Exon numbers are according to the canonical transcript (NM_001136035).
  Amino acid changes are according to the reference sequence NP_001129507
