figure_title: Major Signaling Cascades Downstream of FGFR Activation.
caption: 'Major Signaling Cascades Downstream of FGFR Activation. A schematic representation
  of three major signaling cascades activated by FGFR: the RAS-MAPK/ERK pathway (purple)
  regulating transcription and mediating cell migration and stress responses, the
  PI3K-AKT pathway (blue) controlling cell survival, growth, and metabolism, and the
  PLCγ-PKC pathway (orange) mediating differentiation, transcription, and membrane
  receptor function. Detailed pathway descriptions and abbreviations are provided
  in the main text'
