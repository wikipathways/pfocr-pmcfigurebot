caption: 'KEGG pathway enrichment analysis of differential metabolites identified
  between fermented and control pomegranate juice samples (Fermented_vs_Control),
  with the background comprising “Set_Origin” and 1309 annotated metabolites. The
  bubble chart displays the top enriched metabolic pathways. The x-axis represents
  the Rich Factor, defined as the ratio of the number of differential metabolites
  annotated in a given pathway to the total number of annotated metabolites in that
  pathway. The size of each bubble corresponds to the number of differential metabolites
  involved, while the color gradient indicates the statistical significance (p-value),
  with darker red representing higher significance. Different shapes denote metabolite
  classes: circles (M), triangles (EIP), and squares (GIP)'
