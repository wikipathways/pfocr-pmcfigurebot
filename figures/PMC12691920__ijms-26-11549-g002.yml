figure_title: Biosynthesis pathway of hyaluronic acid in bacteria.
caption: Biosynthesis pathway of hyaluronic acid in bacteria. Glucose enters the cell
  via an ABC transporter and is subsequently phosphorylated to glucose-6-phosphate,
  which is then processed through two parallel branches. In one branch of the pathway,
  phosphoglucomutase and HasC/HasB convert glucose-1-phosphate into UDP-glucuronic
  acid. In the second branch, fructose-6-phosphate is transformed by GlmS, GlmM, and
  HasD/GlmU into UDP-N-acetyl-glucosamine. These two substrates are transferred to
  the membrane-bound synthase HasA, which alternately polymerizes them into a linear
  HA chain. The polymer is secreted outside the cell [7,48]. Created by BioRender.com
  [51]
