figure_title: (A) Circular genome map of NQ01.
caption: '(A) Circular genome map of NQ01. From outer circle to inner, Circle 1: The
  genomic sequence information. Circle 2: GC content profile of the genome. Circle
  3: GC skew profile of the genomic sequence. Circle 4: The second-generation sequencing
  (illumina) depth and coverage profile. Circle 5: The third-generation sequencing
  (nanopore) depth and coverage profile. Circle 6: Annotation of coding sequences
  (CDS) and non-coding RNA regions (rRNA, tRNA) in the reference genome. (B) GO annotation
  and classification of NQ01. The bar plot shows the number of genes assigned to GO
  terms within the three GO domains: biological process (salmon), cellular component
  (green), and molecular function (blue). The cellular component panel is dominated
  by intracellular terms, most notably cytoplasm (383 genes), cytosol (337), and ribosome
  (109), with additional contributions from plasma membrane (64) and membrane-associated
  compartments. In molecular function, the leading terms are structural constituent
  of ribosome (276 genes), metal-ion binding (216), and ATP binding (134), alongside
  several DNA/RNA-binding and transporter activities. Biological process terms are
  more dispersed; higher counts occur for transmembrane transport (63 genes) and multiple
  metabolism-, translation-, and cell-division-related processes (generally 20–40
  genes each). The x-axis lists GO terms; the y-axis indicates gene counts. (C) KEGG
  pathway distribution of annotated genes. Horizontal bars show the number of genes
  assigned to each pathway; colors indicate the higher-level KEGG class (see legend).
  Metabolism dominates the annotation set, with the largest counts in carbohydrate
  metabolism (252 genes), global/overview maps (221), amino acid metabolism (159),
  membrane transport (159), energy metabolism (102), and nucleotide metabolism (101).
  Fewer genes fall under organismal systems and cellular processes (e.g., endocrine
  system, 15; cell growth and death, 12; cell motility, 7; immune and nervous systems,
  2 each). The x-axis reports gene counts. (D) COG functional classification of annotated
  genes. Bars show the number of genes assigned to each COG category (A-X). The most
  represented groups are J: Translation, ribosomal structure and biogenesis (203 genes),
  E: Amino acid transport and metabolism (157), D: Cell cycle control, cell division,
  chromosome partitioning (153), N: Cell motility (132), and C: Energy production
  and conversion (129). Moderate counts include P: Posttranslational modification,
  protein turnover, chaperones (95), L: Replication, recombination and repair (93),
  S: Function unknown (91), and K: Transcription (75), whereas categories such as
  A: RNA processing and modification (1), Q: Secondary metabolite biosynthesis, transport
  and catabolism (13), and O: Cell wall/membrane/envelope biogenesis (7) are least
  represented. The y-axis indicates gene counts; category definitions are given in
  the legend'
