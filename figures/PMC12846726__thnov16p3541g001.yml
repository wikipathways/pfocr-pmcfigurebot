figure_title: RNA sequencing analysis of gene expression modulation in OT.
caption: RNA sequencing analysis of gene expression modulation in OT.I mRNA-Luc and
  OT.I mRNA-IL-33 T cells. OT.I T cells were electroporated with mRNA-Luc or mRNA-IL-33
  (1 µg/million cells), and total RNA was extracted 24 h post-electroporation for
  transcriptomic analysis by RNA sequencing (RNA-seq). (A) Volcano plot displaying
  differentially expressed genes in mRNA-Luc and mRNA-IL-33 T cells. Genes with a
  false discovery rate (FDR) < 0.05 are highlighted in red (upregulated) and blue
  (downregulated). (B) Gene Set Enrichment Analysis (GSEA) illustrating the top 25
  significantly upregulated and downregulated Gene Ontology Biological Process (GO:BP)
  terms (adjusted p value < 0.05). (C) GSEA plot of pathways of interest to reflect
  the effect of IL-33 stimuli over them. (D) Pathway-gene linked node plot reflecting
  common genes across these pathways of interest
