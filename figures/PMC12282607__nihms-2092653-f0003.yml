figure_title: Triculture enhances neuronal spine density and mean firing rate
caption: (A and B) scRNA-seq was performed on monocultures (MCs) of each cell type
  and on tricultures (TCs) after 6 days of co-culture (total 58,322 cells). UMAP plots
  show clustering by marker expression, with clusters labeled by cluster index in
  (A) and by cell/culture type in (B). For all scRNA-seq data, one genetic background
  was used. See Figures S2A–S2G for differentiation markers.(C) Proportional composition
  of each cluster, color coded to match (A).(D–F) Microglial cell, astrocyte, and
  neuron populations were isolated, re-clustered, and colored by culture condition
  (MC, orange; TC, green).(G) Dot plot of significantly enriched Gene Ontology (GO)
  pathways in iNs, iAs, and iMGs (DEGs from Figure S2H). Dot size reflects the number
  of DEGs in each pathway; color indicates adjusted p value. See Table S3 for additional
  details.(H) DiI(1,1’-dioctadecyl-3,3,3’,3’-tetramethylindocarbocyanine perchlorate)
  labeling of neuronal dendritic spines in MC and TC. Spine density was measured by
  reconstructing dendritic cables and counting spines per dendrite length; two genetic
  backgrounds for glial cells; n = 3 independent co-cultures and 3 wells per co-culture,
  with blinded analysis. Each dot represents the average of five dendrites per well;
  *p < 0.05 by mixed-effects model. Scale bar, 5 μm.(I) Synaptic vesicle (SV) release
  was assessed in MC and TCs using live-cell imaging of SypHy, a pH-sensitive fusion
  protein that fluoresces upon vesicle fusion and exposure to extracellular pH (7.4)
  after KCl stimulation. iNs were transduced with SypHy-expressing lentivirus on day
  19, with iAs added on day 20 and iMGs on day 21. On day 27, iNs were imaged before
  and during KCl stimulation, followed by NH4Cl treatment to unquench SypHy fluorescence
  and identify responsive puncta (≥2-fold fluorescence increase). Shown are representative
  traces from BR33 MCs and TCs depicting the average SypHy signal (±SEM) of all NH4Cl-responsive
  puncta over time. Quantifications show the rate of SV release immediately after
  KCl stimulation (11–26 s) and the maximum SV pool released. N = 2 genetic backgrounds,
  3 independent co-cultures, and 1–3 wells per co-culture. ***p < 0.001 and *p < 0.05,
  mixed-effects model.(J) Mean firing rate (spikes/s) of neurons from day 11 to day
  49 in MC versus TC, recorded on Axion multielectrode arrays (MEAs) (64 electrodes/well,
  4 wells/condition, and 1 differentiation). BR33 glia cells were used; see Figure
  S3A for BR24 glia. Mixed-effects analysis with Sidak’s multiple comparisons, ****p
  < 0.0001, ***p < 0.001, **p < 0.01, and *p < 0.05.(K) Representative immunostaining
  of MEA wells at iN day 50 (after 28 days of co-culture) showing CD44 (astrocytes),
  IBA1 (microglia), MAP2 (neurons), and DAPI (nuclei). Scale bar, 200 μm.(L) Mean
  edge weight (a measure of connectivity strength) on iN day 35 comparing TC to MC.
  BR33 glia cells were used; see Figure S3B for BR24 glia. N = 64 electrodes/well,
  4 wells/condition, and 1 differentiation. Dots correspond to each individual well.
  Unpaired Student’s t test, **p < 0.01.(M) Representative network graphs on iN day
  35 illustrating microscale network organization in MC and TC. Node strength (circle
  size) represents the influence of individual electrodes, edge weight (line thickness)
  indicates connection strength, and node color reflects average controllability,
  which quantifies the ability of individual nodes to facilitate transitions between
  different network states
