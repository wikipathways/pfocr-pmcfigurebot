figure_title: Association Between Global Autism Spectrum Disorder (ASD) Burden and
  Air Pollution.
caption: Association Between Global Autism Spectrum Disorder (ASD) Burden and Air
  Pollution. (A) World map showing the age-standardized Disability-Adjusted Life Year
  (DALY) rate of Autism Spectrum Disorder per 100,000 population (ages 0–14), based
  on Global Burden of Disease 2021 data. (B) Spearman correlation analysis between
  country/regional PM2.5 concentrations and age-standardized DALY rates for ASD. (C)
  Mendelian Randomization of the forest plot evaluating the potential relationship
  between air pollution exposures (PM2.5, PM2.5–PM10, PM10, and NOx) and ASD risk.
  (D) Scatter plot of Mendelian Randomization instrumental variables, illustrating
  the potential positive effect of PM2.5 exposure on ASD symptoms. (E) Gene Ontology
  (GO) molecular function enrichment analysis based on single nucleotide polymorphisms
  (SNPs) used as instrumental variables in the Mendelian Randomization analysis using
  SNPnexus database. (F) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment
  analysis based on SNPs used as instrumental variables in the Mendelian Randomization
  analysis using SNPnexus database(https://www.snpnexus.org/v4/, accessed on 25 September
  2025)
