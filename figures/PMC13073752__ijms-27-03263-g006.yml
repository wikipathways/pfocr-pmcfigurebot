figure_title: Effect of sodium arsenite and NAC on p53 pathway.
caption: 'Effect of sodium arsenite and NAC on p53 pathway. (A) Sodium arsenite (200
  mg/L) or NAC (1 mM), alone or in combination, does not alter p53 gene expression
  in hb9-GFP transgenic zebrafish embryos (n = 3/treatment group) (p = 0.12). For
  each treatment group, RNA was isolated from 100 pooled embryos; (B) The p53 inhibitor
  dicoumarol (250 nM) does not inhibit sodium arsenite-induced apoptosis in zebrafish
  embryos (n = 10/treatment group); Scale bar: 430 μm. (C) Quantification of whole-body
  (excluding the yolk sac and yolk extension) relative fluorescence is shown. Data
  are presented as mean ± SEM. An * indicates a significant difference (p < 0.05)
  from the control. N-acetylcysteine = NAC; dicoumarol = DIC; sodium arsenite = arsenic'
article_title: 'N-Acetylcysteine Prevents Arsenic-Induced Apoptosis but Not Supernumerary
  Motor Neuron Development in Zebrafish Embryos: Assessment of Protein Carbonylation
  and the p53 Pathway'
