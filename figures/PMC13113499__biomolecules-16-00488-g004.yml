figure_title: 'Therapeutic potential of ginkgetin (GK) across disease systems: (1)
  Metabolic disorders: GK suppresses adipogenesis, hepatic steatosis and fibrosis
  by inhibiting STAT5 and STAT1/STAT3 signaling, regulating macrophage polarization,
  and reduces oxidative stress, inflammatory responses and extracellular matrix deposition
  via the AMPK/mTOR pathway; (2) Cardiovascular diseases: GK improves lipid metabolism,
  attenuates vascular inflammation and oxidative stress, reduces cardiomyocyte apoptosis,
  and promotes angiogenesis through modulation of MMP-2/9, VEGF-A and caspase-3; (3)
  Neurological disorders: GK alleviates neuroinflammation by inhibiting NF-κB, JAK/STAT
  and TLR4 pathways, preserves mitochondrial integrity and iron homeostasis, and promotes
  peripheral nerve regeneration via the PlGF/p38 MAPK axis; (4) Skeletal disease:
  GK suppresses IL-1β-induced inflammation and extracellular matrix degradation, restores
  autophagic balance, inhibits chondrocyte apoptosis and osteoclast differentiation,
  reduces bone resorption, and preserves bone mass.'
