figure_title: G4451 effectively blocks MASH in mice
caption: '(A) Timeline for the experimental procedure on mice fed an HFHC diet and
  treated with vehicle or G4451 (60 mg/kg). (B) Liver weight and liver weight/body
  weight ratio in mice treated with vehicle or G4451. n = 6 mice. (C) Representative
  images of H&E, CD11B, and Picrosirius red (PSR) staining on mouse liver sections
  in G4451- and vehicle-treated mice. Scale bars: 100 μm. n = 5 mice. (D) Western
  blot showing the effect of G4451 on MAPK signaling pathway in HFHC-fed mice liver.
  n = 5 mice. (E) KEGG pathway enrichment analysis in G4451-treated mouse liver tissues
  suggest suppressive effects on inflammation, lipid metabolism, cell death, and the
  fibrosis process by G4451. n = 4 mice. (F) Heatmaps showing differentially expressed
  genes in pathways of cell death, lipid metabolism, inflammatory response, and fibrosis
  in liver tissues from HFHC mice treated with vehicle or G4451. n = 4 mice. Data
  are shown as mean ± SEM. *P < 0.05; ***P < 0.001; NS, no significance, P > 0.05'
