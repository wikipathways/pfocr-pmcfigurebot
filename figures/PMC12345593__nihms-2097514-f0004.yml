figure_title: Oxidative pathways of hepatic ethanol metabolism
caption: 'There are three enzymatic pathways involved in oxidative ethanol metabolism.
  A) Alcohol dehydrogenase (ADH) pathway, the primary pathway for hepatic ethanol
  metabolism: Ethanol is oxidized to acetaldehyde mainly by Class I ADH in the cytosol.
  Acetaldehyde is subsequently converted to acetate by aldehyde dehydrogenase 1 (ALDH1)
  in the cytosol or ALDH2 in the mitochondria. In the mitochondria, acetate is converted
  to acetyl-CoA by acetyl-CoA synthetase and then enters the tricarboxylic acid (TCA)
  cycle as acetyl-CoA. B) Microsomal ethanol oxidizing system (MEOS), a secondary
  pathway that plays a more important role after binge drinking, and its activity
  can be upregulated after weeks of heavy drinking: The enzyme Cytochrome P-450 2E1
  (CYP2E1) oxidizes ethanol to acetaldehyde in the endoplasmic reticulum, generating
  reactive oxygen species as byproducts. (C) Catalase pathway, minimal contributor
  to hepatic alcohol metabolism: Catalase, located within peroxisomes, metabolizes
  ethanol to acetaldehyde using hydrogen peroxide (H2O2) as a cofactor. When mitochondrial
  acetyl-CoA is abundant, acetate can be shuttled out of the hepatocyte as a fuel
  source for other tissues. Excess acetyl-CoA exits the TCA as citrate via the solute
  carrier family 25 member 1 (SLC25A1). ACLY: ATP citrate lyase; ACOT12: Acety-CoA
  thioesterase 12. Created with BioRender.com'
