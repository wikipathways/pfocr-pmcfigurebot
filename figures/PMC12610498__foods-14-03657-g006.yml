figure_title: Histogram of pathway annotation and expressed enzymes by metaproteomics.
caption: 'Histogram of pathway annotation and expressed enzymes by metaproteomics.
  (A) The Y-axis represents the KEGG functional classification entries and the X-axis
  represents the number of proteins in this functional classification. The metabolic
  pathways of different branches are distinguished by color. The KEGG metabolic pathway
  contains seven branches: Cellular Processes, Environmental Information Processing,
  Genetic Information Processing, Human Diseases, Metabolism, Organic Systems and
  Drug Development. (B) The vertical axis represents the CAZy function classification,
  and the horizontal axis represents the number of enzymes in the function classification.
  (C) The cluster analysis of the expressed carbohydrate esterase in the fermentation
  process of Baobaoqu, and the range of variation was −2 to +2. (D) The cluster analysis
  of the expressed glycoside hydrolases in the fermentation process of Baobaoqu, and
  the range of variation was −3 to +3'
