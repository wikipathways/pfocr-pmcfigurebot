figure_title: Sex-linked genetic factors contributing to female-biased autoimmunity.
caption: Sex-linked genetic factors contributing to female-biased autoimmunity. Escape
  from X chromosome inactivation (XCI) in females results in the biallelic expression
  of immune-related genes such as TLR7, CD40L, and FoxP3, thereby amplifying immune
  activation. The presence of two X chromosomes also promotes elevated expression
  of female sex hormones, particularly estrogens. Estrogen signaling further upregulates
  immune-related gene expression and enhances immune responses, such as TLR7-mediated
  IFN-I production. Estrogens also exacerbate autoimmunity by inducing epigenetic
  modifications, including repression of anti-inflammatory microRNAs (e.g., miR-98
  in B cells) and inhibition of DNA methyltransferase 1 (DNMT1), which leads to DNA
  hypomethylation and heightened inflammatory gene expression. In contrast, androgens
  exert predominantly immunosuppressive effects by promoting DNA methylation to silence
  proinflammatory genes and by promoting the expansion of FoxP3+ Treg cells. Together,
  X-linked gene dosage imbalance and hormone-driven epigenetic dysregulation contribute
  to the increased susceptibility of females to autoimmune diseases. All one-way arrows
  indicate activation and forward progression along the pathway, while truncated lines
  indicate inhibition. Arrows and truncated lines are highlighted in black for XCI-dependent
  pathways, in red for estrogen-dependent pathways, and in blue for androgen-dependent
  pathways
