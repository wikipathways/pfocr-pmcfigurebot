figure_title: Proposed metabolic pathway of 7-hydroxy-CBD.
caption: Proposed metabolic pathway of 7-hydroxy-CBD. 7-Hydroxy-CBD undergoes metabolism
  to 7-formyl-CBD through the action of NAD(P)+-dependent alcohol oxidoreductases
  in the human liver S9 and microsomes. The aldehyde intermediate is then irreversibly
  oxidized to 7-carboxy-CBD by aldehyde dehydrogenase
