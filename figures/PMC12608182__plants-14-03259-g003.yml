figure_title: The overexpression of SlMADS48 influences the content of endogenous
  gibberellin in sepals and the transcript levels of genes involved in gibberellin
  and cell division.
caption: The overexpression of SlMADS48 influences the content of endogenous gibberellin
  in sepals and the transcript levels of genes involved in gibberellin and cell division.
  (A) Examination of endogenous gibberellin in sepals of WT and OE lines. Data are
  the mean ± SE of three biological replicates. * indicates significant difference,
  Student’s t-test p < 0.05, ** p < 0.01. (B) Transcript level of genes involved in
  the gibberellin pathway, including biosynthesis genes such as GA20ox1, GA20ox2,
  GA3ox1, CPS, and KAO, and the signaling transduction gene GID1. Data are the mean
  ± SE. * indicates significant difference, Student’s t-test p < 0.05, ** p < 0.01.
  (C) Detection of expression level of genes involved in the cell cycle, including
  cycA3;1, cycB1;1, cycD3;1, krp4, and CDKI1. Data are the mean ± SE. * indicates
  significant difference, Student’s t-test p < 0.05, ** p < 0.01. (D–F) Heatmap of
  DEGs (differentially expressed genes) from RNA-seq data involved in the cell cycle,
  cell division (D), the gibberellin pathway (E), and cell expansion (F)
