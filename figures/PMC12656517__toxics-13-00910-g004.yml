figure_title: PERK pathway contributes to Mn-induced neurotoxicity in mice and primary
  astrocytes.
caption: 'PERK pathway contributes to Mn-induced neurotoxicity in mice and primary
  astrocytes. (A) Western blot analysis of PERK/p-PERK, EIF2α/p-EIF2, and ATF4 protein
  levels in primary astrocytes after Mn exposure (6 h, 12 h, and 24 h). β-actin was
  used as loading control (n = 4). (B) Quantitative grayscale analysis of p-PERK/PERK
  ratios (* p < 0.05 vs. Con, *** p < 0.001 vs. Con). (C) Quantitative grayscale analysis
  of p-eIF2α/eIF2α ratios (n = 4, ** p < 0.01 vs. Con, *** p < 0.001 vs. Con). (D)
  Quantitative grayscale analysis of ATF4 levels (n = 4, *** p < 0.001 vs. Con). (E)
  Global protein synthesis in control and Mn-exposed astrocytes was assessed using
  a puromycylation assay followed by Western blotting, with β-actin as a reference.
  (F) Quantitative grayscale analysis of puromycinylated proteins (n = 4, *** p <
  0.001 vs. Con). (G–I) Western blot analysis of protein expression in the substantia
  nigra (SN) of mouse brains after Mn exposure: (H) P-PERK/PERK and (I) p-EIF2α/EIF2αratios
  (n = 4, ** p < 0.01 vs. Con)'
