figure_title: Transcriptomic and pathway analysis of HTR-8/SVneo cells transfected
  with miR-7151-5p mimic versus negative control (mimic_NC).
caption: Transcriptomic and pathway analysis of HTR-8/SVneo cells transfected with
  miR-7151-5p mimic versus negative control (mimic_NC). To investigate the global
  transcriptomic changes induced by miR-7151-5p overexpression in trophoblast cells,
  RNA-seq was performed on HTR-8/SVneo cells transfected with either a miR-7151-5p
  mimic or mimic-NC. DEGs were identified and subjected to functional enrichment analysis,
  which was used to explore the underlying biological pathways potentially regulated
  by miR-7151-5p. (A) DEGs in the mimic_NC group, the thresholds for statistical significance
  were set at an adjusted p < 0.05 and |log2FC| ≥ 1. (B) KEGG pathway enrichment analysis
  for the mimic_NC group, pathways with adjusted p < 0.05 (Benjamini–Hochberg corrected),
  which were considered significantly enriched
