figure_title: Dynamic pathway communications among malignant samples.
caption: Dynamic pathway communications among malignant samples. A) Conserved and
  context-specific relative information flow alterations for highly significant (p<0.01)
  pathways. Pathways colored gray are enriched in Veh-M, blue is enriched in EZH2i-M,
  and text colored black indicates an enriched pathway in both groups. Red stars are
  markers for pathways highlighted in remaining sub-figures. B) Major network signaling
  roles of MHC-I between TME components. C&D) Chord diagrams showing signaling for
  CEACAM and FN1 (respectively) between cell groups, where inner thinner bar colors
  represent the targets that receive signal from the corresponding outer bar. Inner
  bar size is proportional to the signal strength received by the targets
