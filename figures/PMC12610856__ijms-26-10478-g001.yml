figure_title: Heme biosynthesis pathway showing porphyrin intermediates, enzymes,
  and disruptions by heavy metals and oxidative stress.
caption: Heme biosynthesis pathway showing porphyrin intermediates, enzymes, and disruptions
  by heavy metals and oxidative stress. The sequential conversion from uroporphyrinogen
  III to coproporphyrinogen III, protoporphyrinogen IX, and heme is mediated by UROD,
  CPOX, PPOX, and FECH enzymes (solid arrows). Red “X” markers indicate inhibitory
  effects of lead (Pb) and mercury (Hg) on specific enzymatic steps. Lightning symbols
  denote oxidative stress (ROS)–induced oxidation of porphyrinogens to urinary porphyrins.
  Dashed arrows represent the oxidation and urinary excretion of porphyrin intermediates,
  which are measured as biomarkers in this study. Measured urinary porphyrins (uP,
  7cxP, 6cxP, 5cxP, and cP) are color-coded, representing the stepwise decarboxylation
  of the heme synthesis pathway relevant to ASD biomarker analysis
