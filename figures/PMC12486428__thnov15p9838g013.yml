figure_title: Mechanisms of CTP + NIR treatment to accelerate diabetes wound healing.
caption: Mechanisms of CTP + NIR treatment to accelerate diabetes wound healing. (A)
  Volcano plot of differentially expressed genes in the control and CTP + NIR groups
  on day 7. (B) Heatmap of differentially expressed genes associated with wound healing.
  (C) Relative expression of genes associated with inflammation, cell migration and
  wound healing, and angiogenesis in the control and CTP + NIR groups on day 7. (D)
  KEGG pathway analysis of up-regulated genes in the control and CTP + NIR groups
  on day 7. (E) GO enrichment analysis of up-regulated genes in the control and CTP
  + NIR groups on day 7. (F) GO enrichment analysis of down-regulated genes in the
  control and CTP + NIR groups on day 7. (G) Relative expression of genes associated
  with follicle morphogenesis in the control and CTP + NIR groups on day 7 (mean ±
  SD, n = 3)
