figure_title: Pgr+ fibroblasts, Pgr– fibroblasts, and mesothelial-like cells may contribute
  to atrophy of myofibers in EP LAM
caption: '(A–C) Visualization of cell-cell communication using CellChat, comparing
  communication networks between Vehicle (Veh), E2 + P4 (EP), and E2 + P4 + RU486
  (EPR) LAM. Circle plots visualizing networks with outgoing communication from (A)
  Pgr+ fibroblasts, (B) Pgr– fibroblasts, and (C) mesothelial-like cells to type I/IIa/IIb
  myofibers. Interactions between pairs of cell types are depicted by a line connecting
  the 2 cell types, with line thickness indicating the strength of the interaction.
  (D) Signaling pathways enriched in Veh, EP, and EPR LAM within the communication
  network between non-myofibers (Pgr+ fibroblasts, Pgr– fibroblasts, mesothelial-like
  cells) and type I/IIa/IIb myofibers. Black arrow emphasizes the TGF-β pathway. (E)
  Relative contribution of TGF-β pathway ligand-receptor pairs in Veh (red), EP (green),
  and EPR (blue) LAM. Upregulated Tgfb2-(Tgfbr1+Tgfbr2) interaction in EP LAM is highlighted
  (black arrow). (F) Xenium-based spatial transcriptomics of Veh, EP, and EPR LAM
  showing expression of Tgfbr2 and muscle atrophy markers (Fbxo32, Trim63) in type
  I (Myh7+; pink dashed circle) and type II myofibers (Myh2+, orange dashed circle).
  Upper row images show expression of cell-type marker genes, while lower row images
  show expression of Tgfbr2 and muscle atrophy marker genes (Fbxo32, Trim63). The
  software uses DAPI to determine the extent of the nucleus (light blue staining).
  Colored dots, each representing an individual mRNA transcript of a gene, are emphasized
  with similarly colored arrows. Scale bars: 20 μm. n = 3–4/group'
