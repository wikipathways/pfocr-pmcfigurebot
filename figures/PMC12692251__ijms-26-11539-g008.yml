figure_title: Transcriptomic and molecular validation of dysregulated pathways in
  Prom1-KO mRPE cells.
caption: 'Transcriptomic and molecular validation of dysregulated pathways in Prom1-KO
  mRPE cells. Multi-panel analysis of gene expression and protein changes in Prom1-KO
  mRPE cells. (A) Volcano plot of bulk RNA-seq data showing significantly dysregulated
  genes in Prom1-KO mRPE cells. Pathways of interest are color-coded: general dysregulated
  genes (red), ROS (red), phagocytosis (blue), UPR (green), and TNF signaling (purple).
  (B) qPCR validation of PINK1 in KO22 and KO26.4, compared to WT mRPE (** p < 0.01).
  (C) Western blot analysis of MerTk protein with actin as a loading control, quantification
  of MerTK and actin ratio (* p < 0.05), and (D) qPCR of MerTK gene in WT and Prom1-O
  samples (**** p < 0.0001). (E–H) qPCR validation of additional dysregulated genes:
  Slc7a11, Ablim1, OGN, and Aldh1a1 fold changes with statistical significance (*
  p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001)'
