figure_title: Host cell autonomous response to Mycobacterium tuberculosis infection
caption: The M. tuberculosis factors implicated in the various response pathways are
  shown in brown, whereas host factors are shown in blue. During phagocytosis, M.
  tuberculosis can directly induce membrane damage mediated by the type VII secretion
  system, ESX-1. Plasma membrane damage can also occur following phagocytosis. In
  both cases, this leads to necrotic cell death163. Once in the phagosome, the activity
  of M. tuberculosis ESX-1 and the presence of M. tuberculosis lipids such as phthiocerol
  dimycocerosates (PDIMs) trigger damage of this organelle. This membrane damage triggers
  the lipidation of LC3 from LC3-1 to LC3-II as part of canonical and non-canonical
  autophagy responses that are primarily protective for the host. ESX-1-dependent
  activities have also been associated with other types of macrophage death including
  pyroptosis, ferroptosis and apoptosis7,21. A secreted M. tuberculosis effector,
  the phosphatase, PtpA, will induce ferroptosis172. M. tuberculosis can also block
  cell death pathways, and effectors such as the serine/threonine kinase, PknF, and
  the phosphatase, PtpB, can inhibit pyroptosis115, 168. ESX-1 activities can also
  trigger Type I interferon (IFN-I) responses from infected macrophages, the formation
  of granulomas, and the recruitment of other immune cells including eosinophils and
  neutrophils. Paradoxically, eosinophils seem to be protective, whereas neutrophils
  appear to be detrimental in the immunopathogenesis of tuberculosis. It is not known
  how eosinophils are protective (denoted by?), but in the case of neutrophils, IFN-I
  responses mediated by the M. tuberculosis proteins, EsxA and Rv0888, elicit the
  formation of neutrophil extracellular traps (NETs) which are associated with tuberculosis
  pathology132. IFN-Is also drive CD101-negative (CD101-ve) neutrophil recruitment
  to the lungs, which exacerbates tissue damage and pathology198. LC3, microtubule-associated
  protein 1A/1B-light chain 3; LC3-II, LC3-phosphatidylethanolamine conjugate
