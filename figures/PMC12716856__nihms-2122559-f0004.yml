figure_title: Nherf2−/− mice have smaller bile acid pool size under chow-diet condition
caption: (A and B), Daily food intake (A) and rectal temperature (B) measured in male
  control and Nherf2−/− groups. (C), The concentration of lipophilic TBA were tested
  in liver. (D), Schematic diagram of BA biosynthesis pathways in the live, the shaded
  area indicates the alternative pathway. (E), Relative expression level of genes
  involved in hepatic bile acid synthesis (n = 4 per group). (F), Relative expression
  level of bile acid related genes in liver (n = 4 per group). (G and H) Image (G)
  and the quantified content (H) of gallbladder in fasted mice. (I), Concentration
  of lipophilic TBA in the gallbladder. (J), Relative expression level of genes in
  the bile acid signal pathway in ileum (n = 4 per group). (K and L), TBA Concentration
  in feces (K) and serum (L) of male mice. (M), Fecal TC level in each group (n =
  4 per group). All data shown are from male mice. Data are expressed as mean ± SD.
  White dot represent C57BL/6 (control) mice, and solid red dot represent Nherf2−/−
  mice. Each dot represents data from an individual mouse. All data presented in this
  figure were generated in mice maintained on chow-diet. The sample size of each group
  is indicated in parentheses above X-axis or denoted in legends. Two-way-ANOVA followed
  by Tukey’s HSD test was used to compare between groups in (A, B and M). Two-tailed
  unpaired nonparametric Mann-Whitney U test was used to compare control and Nherf2−/−
  in (C, and E-L). Exact P values are shown for significant difference (P < 0.05)
  TBA, total bile acid, TC, total cholesterol; C4, 7α-hydroxy-4-cholesten-3-one; 27-HC,
  27-hydroxycholesterol; CA, Cholic acid; CDCA, Chenodeoxycholic acid
