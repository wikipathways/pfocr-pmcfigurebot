figure_title: Basic mechanisms of cellular trafficking.
caption: Basic mechanisms of cellular trafficking. The endocytic pathway (A) and the
  exocytic pathway (B) form the basis of vesicular and organelle trafficking. The
  AP1-5 subtypes of adapter proteins are involved in the different phases of these
  pathways. Rab5c is responsible for the early endosome, Rab7 for the late endosome
  and Rab11 for the recycling endosome. The coat protein COPI is involved in the pathway
  from the Golgi to the endoplasmic reticulum (ER), while COPII acts in the opposite
  direction. Membrane contact site between the mitochondria and the ER (C). Dynein
  and kinesins are motor proteins that act in different directions on microtubules
  in cytoskeleton traffic (D). The autophagy pathway by which proteins are degraded
  (E). ERGIC, ER-Golgi intermediate compartment (created with BioRender.com)
