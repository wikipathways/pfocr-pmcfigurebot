figure_title: Loss of Lsm1 promotes metabolic reprogramming and antioxidant responses.
caption: 'Loss of Lsm1 promotes metabolic reprogramming and antioxidant responses.
  (A) The NAD+/NADH ratio of WT, lsm1Δ/Δ, and lsm1Δ/Δ+LSM1 strains, with or without
  rotenone treatment (10 μg/mL). (B) The NADP+/NADPH ratio of WT, lsm1Δ/Δ, and lsm1Δ/Δ+LSM1
  strains, with or without rotenone treatment (10 μg/mL). (C) Superoxide dismutase
  (SOD) activity of WT, lsm1Δ/Δ, and lsm1Δ/Δ+LSM1 strains, with or without rotenone
  treatment (10 μg/mL). (D) The GSH/GSSG ratio in WT, lsm1Δ/Δ, and lsm1Δ/Δ+LSM1 strains,
  with or without rotenone treatment (10 μg/mL). (E) Relative expression levels of
  genes involved in the pentose phosphate pathway and gene encoding glycerol kinase
  between WT and lsm1Δ/Δ strains, depicted as Log2 fold change and percentages. Color
  of genes indicate the direction and statistical significance of expression changes:
  significant downregulation (p < 0.05, blue), significant upregulation (p < 0.05,
  orange). Genes involved in other energy metabolism pathways with significant expression
  changes are shown. (F) Growth of the WT, lsm1Δ/Δ, and lsm1Δ/Δ+LSM1 strains on media
  containing 2% glucose, 3% glycerol or 2% ethanol as the carbon source. Statistical
  significance is indicated as follows: *, p < 0.05; ***, p < 0.001; ns, not significant'
