figure_title: The working model of the cooperation of PR55α/PP2A with KRAS signaling
  in driving tumorigenesis
caption: Oncogenic mutations in the KRAS oncogene cause KRAS activation, which is
  present in 90–95% of PC and serves as the driver of PC. The Raf/MEK/ERK oncogenic
  pathway is the major downstream effector of KRAS [45]. PR55α/PP2A was shown to facilitate
  the activation of the Raf/MEK/ERK signaling pathway by dephosphorylating the inhibitory
  sites in Raf and KSR1 [16, 17]. Raf1 activation can block MST activity in activating
  LATS1/2. Conversely, the activation of LATS1/2 can suppress Raf1 [36–38]. YAP oncogene
  activation is required for KRAS-driven PC progression [26–28]. Our studies show
  that PR55α-associated PP2A promotes YAP activation by inhibiting the LATS/MOB1 auto-activation
  loop and dephosphorylating YAP, thus stabilizing YAP protein [19]. Our previous
  studies also identified a positive feedback regulation of the MST/LATS cascade by
  PR55α expression [19]. However, this PR55α-stimulated MST/LATS signaling was abolished
  by oncogenic KRASG12D
article_title: PR55α subunit of protein phosphatase 2A supports KRASG12D-driven tumorigenesis
  that requires YAP activation
