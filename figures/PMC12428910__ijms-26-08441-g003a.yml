figure_title: KEGG pathway enrichment caused by MP, SMZ, and BDE153 co-exposure at
  2, 4, and 8 d (n = 6).
caption: KEGG pathway enrichment caused by MP, SMZ, and BDE153 co-exposure at 2, 4,
  and 8 d (n = 6). (a), the upregulated (red) and downregulated (blue) DGEs in the
  comparisons from AI2 to FI8. The annotations for each were CK (control, group A),
  SMZ (100 ng·L−1, group B), MP (75 nm, 1.6 × 1011 particles·mL−1, group C), MP+SMZ
  (1.6 × 1011 particles·mL−1 MP plus 100 ng·L−1 SMZ co-exposure, group D), BDE (5
  ng·L−1 BDE153, group E), BDE+MP (1.6 × 1011 particles·mL−1 MP plus 5 ng·L−1 BDE153
  co-exposure, group F), “I” stands for intestine, and 2/4/8 named as exposure for
  2, 4, 8 days, respectively; i.e., “AI2_vs. AI4” stands for the comparison in group
  A between 2 and 4 days. The black arrows showed the larger upregulated and downregulated
  comparison groups. (b) The enriched pathways among the different comparisons. The
  X and Y axes show different comparisons and different enriched KEGG pathways, and
  the red boxes show the enriched comparison groups and KEGG pathways. (c) The selected
  DEGs in pathways of endocytosis, herpes simplex virus 1 infection, MAPK signaling
  pathway, phagosome, and regulation of actin cytoskeleton among different comparisons.
  The black dot means the enriched pathway in this comparison; i.e., 8-day exposure
  named as AI8, BI8, CI8, DI8, EI8, and FI8 for 8 days, respectively, intestine for
  transcriptome; from AI8 to FI8 for group A and F, intestine for proteome and fecal
  contents for metabolome; “I” stands for intestine. In the Y axis, the length of
  the black rectangles stands for the values for the enriched DEGs, while the black
  spot means the hit for this enriched KEGG pathway
