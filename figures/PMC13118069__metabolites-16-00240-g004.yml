figure_title: Lipidomic profiling reveals heterogeneity among ATAAD, ATAAD-MMPS, and
  healthy control groups.
caption: 'Lipidomic profiling reveals heterogeneity among ATAAD, ATAAD-MMPS, and healthy
  control groups. (A) Principal component analysis (PCA) of control (Ctr), ATAAD,
  and ATAAD-MMPS groups. (B–D) Volcano plot comparisons: ATAAD vs. Ctr (B), ATAAD-MMPS
  vs. Ctr (C), and ATAAD vs. ATAAD-MMPS (D). In each plot, individual lipids are displayed
  with log2 (fold change) on the x-axis and −log10(p-value) on the y-axis. Dashed
  lines extending from the horizontal and vertical axes delineate thresholds for defining
  differential lipids (p < 0.05 and FC ≠ 0). The top ten upregulated and downregulated
  lipids are listed for each comparison, ranked by absolute log2(FC) in descending
  order. For all volcano plots (B–D), log2FC values are calculated as (first named
  group)/(second named group) (e.g., ATAAD/Control), where positive values indicate
  higher levels in the first group and negative values indicate lower levels in the
  first group. (E) Linear regression plot comparing log2(FC) of intersecting differential
  lipids (IDLs) between ATAAD vs. Ctr (x-axis) and ATAAD-MMPS vs. Ctr (y-axis). Each
  point represents an IDL, with colors indicating lipid class according to the legend.
  Circle outline colors denote differential status: red represents upregulation, blue
  represents downregulation in ATAAD compared to controls. Gray indicates no significant
  change. The top five upregulated and downregulated lipid class are listed separately
  for each comparison, ranked by absolute log2(FC). Total IDLs are listed separately.
  The regression equation, r2, and p-value are displayed adjacent to the plot. (F)
  Comparison of overall lipid content between ATAAD and ATAAD-MMPS groups. Bar height
  represents lipid content, with colors indicating lipid classes according to the
  legend. Only classes with significant overall differences between groups are shown;
  others are categorized as “other”. Data are presented as mean ± SEM. (G) Comparison
  of relative lipid content distribution between groups by Class II category. Bar
  length represents relative lipid content, with colors indicating lipid classes.
  Only the top nine lipid categories with statistically significant differences in
  both ATAAD vs. controls and ATAAD-MMPS vs. controls (p < 0.05) are shown. Data are
  presented as mean ± SEM. Statistical tests were performed as described in panel
  (F). (H) KEGG pathway enrichment analysis of differential lipids. Bar plot displays
  significantly enriched pathways, with bar length representing the number of differential
  lipids enriched in each pathway. Only pathways with false discovery rate (FDR)-adjusted
  p-value < 0.05 are shown'
