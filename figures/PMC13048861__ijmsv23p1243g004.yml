figure_title: Defects in fatty acid metabolism exacerbate ES-induced cytotoxicity.
caption: Defects in fatty acid metabolism exacerbate ES-induced cytotoxicity. (A)
  Metabolic flux analysis between the untreated grouP and the ES-treated grouP of
  the HL-60 cells, focusing on the pathways related to fatty acid (even-chain). (B)
  Measurement of fatty acid uptake in HL-60 cells with or without 100 nM ES treatment
  for 3 days by flow cytometry. (C) GSEA of DEGs comparing 19 AML samples with IDH1
  mutations to 311 AML samples with wild-type IDH1 from the GSE24505 dataset, focusing
  on the enrichment of the “REACTOME_FATTY_ACID_METABOLISM” pathway. (D-E) HL-60/THP-1
  WT or IDH1m cells were resuspended in either standard or delipidated medium and
  seeded. Time zero was defined at seeding; cck-8 reagent was added at 0, 24, 48 and
  72 h, and absorbance was recorded. (F-G) HL-60/THP-1 WT or IDH1m cells were treated
  with or without 20 nM ES for 48 h in either standard or delipidated medium; cell
  number was assessed by cck-8 assay. (*, P < 0.05; **, P < 0.01; ***, P < 0.001.)
article_title: IDH1 mutation creates a dependency on fatty acid metabolism that underlies
  sensitivity to cuproptosis in acute myeloid leukemia cells
