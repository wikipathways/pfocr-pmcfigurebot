figure_title: Mechanistic schema of hypercapnia/hypercapnic acidosis in experimental
  lung injury.
caption: 'Mechanistic schema of hypercapnia/hypercapnic acidosis in experimental lung
  injury. Hypercapnia, modulated by PaCO2, exposure time, pH (buffered vs. unbuffered),
  and context (infectious vs. non-infectious), can transiently dampen inflammatory
  tone (potentially protective) but also disrupt the alveolar epithelial barrier and
  compromise innate immunity. In infection and/or with prolonged exposures or high
  PaCO2, detrimental pathways dominate with bacterial proliferation and dissemination.
  Solid arrows: primary relationships; dashed arrows: context-contingent protective
  links'
