figure_title: Peak enrichment analysis reveals regulation of atypical ECM genes under
  FA-rich conditions
caption: (A) Pathway enrichment analysis of differential peak-associated genes using
  the Reactome database (Benjamini-Hochberg multiple testing correction and adjusted
  p-value cutoff of 0.01). Note that pathways with more than three gene differences
  between FA and vehicle are included. (B) Schematic depiction of the gene expression
  assay using qRT-PCR. (C-D) mRNA abundance was determined using qRT-PCR. Data were
  normalized to 18s and gene expression calculated using the 2−ΔΔCt method. Data are
  presented as mean±SEM, n=3–6; *p<0.05, **p<0.01, ****p<0.0001 vs. respective groups
  (as shown in the plots) as determined by one-way ANOVA with Tukey’s multiple comparisons
  test
