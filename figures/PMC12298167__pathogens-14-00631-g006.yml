figure_title: Proposed model for the effects of 3-Bromopyruvate on Trypanosoma cruzi
  metabolism.
caption: 'Proposed model for the effects of 3-Bromopyruvate on Trypanosoma cruzi metabolism.
  3-BrPA stimulates ecto-phosphatese activity (brown protein), which hydrolyzes phosphorylated
  substrates (R-P), releasing Pi and the dephosphorylated product (R). Pi is taken
  up by a specific transporter (pink protein) and incorporated into metabolic pathways.
  At the intracellular level, 3-BrPA inhibits GAPDH, disrupting glycolysis and interfering
  with mitochondrial function. As a compensatory mechanism, the accumulation of glucose-6-phosphate
  may be redirected to other metabolic pathways, such as the pentose phosphate pathway
  (PPP), indicated by question marks. Red arrows: stimulation by 3-BrPA. Dashed red
  lines: inhibition by 3-BrPA. The figure was designed using Canva and icons from
  NIH Bioart'
