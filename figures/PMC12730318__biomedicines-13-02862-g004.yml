figure_title: Integration between Plan Classes, Health Indicators, and Strategic Objectives.
caption: Integration between Plan Classes, Health Indicators, and Strategic Objectives.
  The figure illustrates how the five classes of the Integrated Implementation Plan
  in Precision Radiotherapy (IIPPR) connect across three levels. Blue nodes (left)
  represent the operational classes. Green nodes (center) correspond to measurable
  health indicators. Red nodes (right) denote broader public health objectives. The
  network visualizes the translation pathway from technical and scientific actions
  to clinical and societal outcomes. These actions include DNA repair characterization,
  genomic and proteomic modeling, individualized radiosensitivity assessment, targeting
  of radioresistance mechanisms, and the adoption of advanced radiotherapy technologies.
  Together, these processes generate quantifiable outputs such as overall survival
  (OS), progression-free survival (PFS), local and systemic control, incidence of
  severe toxicity (G ≥ 3), and cost per controlled case. These indicators converge
  toward collective health objectives within the Brazilian Unified Health System (SUS).
  They support equitable access to care, reduced cancer mortality, and improved quality
  of life. They also reinforce cost-effectiveness in oncology, data-driven decision-making,
  technological innovation, and the reduction in regional disparities
