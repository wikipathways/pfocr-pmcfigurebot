figure_title: Striatal pathway inhibition has opposing influence over decisions but
  not overall ACC activity
caption: 'a, Schematic of the cortico-basal ganglia-thalamic loop. b, Schematic of
  experimental setup: Cre-dependent viral expression of halorhodopsin (NpHR) and a
  tapered optical fiber were targeted to the dorsomedial striatum (DMS) of the right
  hemisphere in D1R-Cre (direct pathway) or A2a-Cre (indirect pathway) mice; Neuropixels
  2.0 probes were targeted to the anterior cingulate cortex (ACC) and striatum of
  the same hemisphere. c, Left, Registration to the Allen Common Coordinate Framework
  (CCF) of all Neuropixels 2.0 shank and optical fiber trajectories (n = 14 mice).
  Right, Registration of fiberoptic and recording sites targeting ACC (grey) or DMS
  (blue) for an example mouse. d, Schematic of the virtual reality based accumulation-of-evidence
  task. Laser was delivered to the DMS during the cue region on a random subset (10–20%)
  of trials. e, Behavioral performance during the task as a function of the difference
  in visual cues relative to the laser hemisphere (#ipsilateral - #contralateral)
  during laser off (black) or on (orange) trials, shown separately for mice receiving
  indirect (left, n = 6 mice) or direct (right, n = 6 mice) pathway inhibition. Thick
  lines: mean across mice. Transparent lines: mean of individual mice. f, Position-binned
  activity (Hz) during the task for four example ACC neurons averaged across laser
  off (black) or on (orange) trials. Example neurons are from mice receiving indirect
  (left column) or direct (right column) pathway inhibition. g, Trial averaged activity
  for all ACC neurons during the task (left two plots) or off-task (right two plots),
  with indirect (n = 1698 neurons from 12 sessions) or direct (n = 1220 neurons from
  15 sessions) pathway inhibition. Activity is z-score normalized and sorted by the
  magnitude of laser modulation in each task condition and inhibition group. h, Proportion
  of significantly excited (red) or inhibited (blue) ACC neurons as a function of
  task (left three bars: on-task; right three bars: off-task) and inhibition group
  (indirect pathway; direct pathway; or, no opsin control: n = 573 neurons from 2
  mice across 5 sessions). Data are presented as mean ± s.e.m'
article_title: Striatal pathways oppositely shift cortical activity along the decision
  axis
