  Blue. Left: Ontologies impacted within 1 hour of nigericin treatment. Right: Ontologies
  impacted after 1 hour of nigericin treatment. Merged K-node identifications are
  depicted in brackets for each heat map. Heat maps are accompanied by kinetic graphs
  of representative members of associated ontologies'
