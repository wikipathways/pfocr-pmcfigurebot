figure_title: Mechanistic overview of eriodictyol-induced intrinsic and extrinsic
  apoptotic pathways in cancer cells.
caption: Mechanistic overview of eriodictyol-induced intrinsic and extrinsic apoptotic
  pathways in cancer cells. Eriodictyol activates both extrinsic and intrinsic apoptotic
  pathways. In the extrinsic pathway, eriodictyol promotes death receptor-mediated
  recruitment of FADD and activation of caspase-8/10, leading to direct executioner
  caspase activation and cleavage of BID to truncated BID (tBID). tBID translocates
  to mitochondria, where eriodictyol simultaneously modulates BCL-2 family proteins
  by suppressing BCL-2, BCL-XL, and MCL-1 and activating BAX/BAK, resulting in mitochondrial
  outer membrane permeabilization. This process releases cytochrome c and Second Mitochondria-derived
  Activator of Caspases (SMAC), triggering APAF1 oligomerization, apoptosome formation,
  caspase-9 activation, and downstream caspase-3/7 execution. Controlled ROS elevation
  further amplifies mitochondrial dysfunction and apoptotic commitment. Crosstalk
  between extrinsic and intrinsic pathways ensures efficient apoptosis and suppression
  of cancer cell survival. Created in BioRender. Mumtaz, S. (2026) https://BioRender.com/opmijwq
