figure_title: Redox regulation of autophagy.
caption: 'Redox regulation of autophagy. The complex autophagy process initiates with
  the formation of a phagophore, followed by its elongation, autophagosome formation,
  fusion with the lysosome to form an autolysosome, and degradation and recycling
  of cellular components. ROS regulate autophagy in a context-dependent manner and
  can either promote or inhibit this process. Distinct mechanisms are denoted by numbered
  circles. (1) Excessive ROS trigger the activation of AMPK, which phosphorylates
  TSC2. This activates the tuberous sclerosis complex 1/2 (TSC1/TSC2), leading to
  the inhibition of mTORC1 and subsequent activation of ULK1, which promotes autophagy
  initiation and progression. ROS also directly oxidize and activate AMPK; (2) ROS-mediated
  activation of the PI3K -AKT pathway promotes mTORC1 activity, which in turn inhibits
  autophagy initiation, and depending on the cellular and pathophysiological context,
  ROS induce autophagy through activation of the PI3K/AKT/mTORC1 signaling pathway;
  (3) ROS activate Beclin1-dependent autophagy, and during oxidative stress, activated
  JNK directly phosphorylates Bcl-2 and enhances the dissociation of Bcl-2 from Beclin
  1, which allows Beclin1 to interact with the Vps34 complex to activate autophagy;
  (4) ROS promote the activation of the ATG12-ATG5 complex, which facilitates autophagy
  activation. ATM: ataxia-telangiectasia mutated, LKB1: liver kinase B1. The black
  arrows indicate the process of autophagy. The brown arrows indicate the PI3K-AKT
  pathway. The blue arrows indicate the AMPK-mTOR and ROS-JNK-mediated autophagy pathways.
  Created in BioRender. Pervin, M.; de Haan, J.B. (2025) https://BioRender.com'
