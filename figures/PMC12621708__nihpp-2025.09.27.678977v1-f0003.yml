figure_title: homeRNA-stabilized samples capture a similar LPS-induced inflammatory
  response to that of venous blood stabilized with RNAlater or PAXgene.
caption: 'homeRNA-stabilized samples capture a similar LPS-induced inflammatory response
  to that of venous blood stabilized with RNAlater or PAXgene. Overlapping A) differentially
  expressed genes (DEGs) between the LPS stimulated and unstimulated conditions of
  the homeRNA-stabilized, RNAlater-stabilized venous blood, and PAXgene-stabilized
  venous blood samples. B) Enriched gene ontology (GO)-derived biological processes
  and C) KEGG pathways from the DEGs. D) All up-regulated DEGs (n=33 DEGs) in the
  toll-like receptor signaling pathway (KEGG: 04060) from each LPS-stimulated and
  unstimulated comparison. DEGs are ranked based on their average log2 fold change
  across all three groups. E) LPS-stimulated response of IFNγ in each comparison.
  F) Top 20 overlapping GO-derived biological processes pathways between all three
  LPS-stimulated collection/stabilization groups. Biological processes are ranked
  based on their average adjusted p-value across all three groups. G) Top 20 overlapping
  KEGG pathways between all three LPS-stimulated collection/stabilization groups.
  Pathways are ranked based on their average adjusted p-value across all three groups.
  VPI stands for viral protein interaction. p-values were adjusted for multiple comparisons
  by controlling for the false discovery rate (FDR) using the Benjamini-Hochberg (BH)
  procedure41'
article_title: 'From Home to Transcriptome: Comparing the transcriptomic profile of
