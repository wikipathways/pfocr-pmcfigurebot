figure_title: Integrative analysis across different individuals and technologies to
  build a robust spatial community atlas
caption: (a) Cross-modality comparison of the ten communities identified for each
  of Visium, CosMx and Xenium. The 4 colored bars represent super-communities (or
  meta-communities), which group the 10 finer communities based on their dominant
  cell type composition. Each row shows a community identified from one of the three
  spatial platforms. The left heatmap shows similarity across communities within and
  between technologies, measured by pairwise Pearson correlation values between communities
  based on their cell type composition. This allows similar communities across technology
  platforms and samples to be grouped to form meta-communities. The right heatmap
  shows the cellular makeup of each community (i.e. proportion of each cell type per
  community), providing information to label the groups of communities. The central
  annotation shows the broad classification of communities into immune, KC, stromal
  or tumour-related communities, based on the cellular makeup of each.(b) Spatial
  localisation of cells belonging to communities CosMx_6 (left) and Xenium_2 and Xenium_7
  (right). Together with Visium_2, these communities form a meta-community that is
  enriched for melanocytes.(c) Inter-community communication within melanoma CosMx_6.
  The chord plot visualises cell-cell communication mediated by Collagen signaling
  pathways, using the CellChat pathway database. Lines connect communicating cell
  types; line thickness represents greater communication between cell pairs.(d) Ligand-receptor
  interactions between pairs of cell types within the melanoma community CosMx_6.
  Top significant L-R pairs and corresponding cell type pairs are shown.(e) Cell type
  co-occurrence in CosMx samples between melanocytes and either other melanocytes
  (brown), Treg cells (blue), fibroblasts (green) or other cells (black). Each line
  plots the co-occurrence score (y-axis) between melanocytes and the test cell type
  calculated over increasing spatial distances (x-axis). The samples from left to
  right are melanoma 23346–105P, 30037–07BR and 6475–07FC.(f-g) Cell type proportions
  of communities identified in Xenium (f) and CODEX (g) for adjacent sections from
  the same sample (48974–2B). The melanoma community in both datasets is enriched
  with melanocytes.(h) Joint pathway analysis using upregulated genes or proteins
  of the melanocyte communities in Xenium and CODEX data (shown in f and g), and highly
  expressed glycans of the melanocyte community in MALDI data (shown in Fig S12a).
  The proteins, genes, metabolites are mapped to KEGG metabolic pathways. The X-axis
  shows the number of genes/proteins from Xenium and CODEX data found in the pathway,
  while the Y-axis shows glycans in the same pathway
article_title: Integrating 12 Spatial and Single Cell Technologies to Characterise
  Tumour Neighbourhoods and Cellular Interactions in three Skin Cancer Types
