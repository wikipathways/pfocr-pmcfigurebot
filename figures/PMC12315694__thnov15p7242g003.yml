figure_title: Fluoride exposure disrupts the absorption of enterocytes while activating
  their antimicrobial activity.
caption: Fluoride exposure disrupts the absorption of enterocytes while activating
  their antimicrobial activity. (A) Bubble chart showing the expression features of
  enterocyte zonation markers at the bottom and top of the villus in enterocyte subtypes.
  (B) Heatmap indicating the expression of selected gene sets in enterocyte subsets.
  (C) Heatmap showing the differential expression of selected gene sets in control
  and fluoride-exposed enterocyte subsets, including the transport of peptides, carbohydrates,
  apolipoproteins, amino acids, bile acids, and microbiota-host interaction components.
  (D) Volcano plot showing differentially expressed genes between control and fluoride-exposed
  enterocyte subtypes. The names of the most significant genes are shown in the plots.
  Representative immunofluorescence staining images for APOA1 (E), APOA4 (F), and
  REG3G (G) in ileum tissues from control and fluoride-exposed mice (n = 3 biological
  replicates). (H) Two-sided bar graph showing the inhibition and activation pathways
  enriched in enterocytes in the F group according to KEGG based on downregulated
  (left) or upregulated (right) genes upon switching to fluoride exposure. The selected
  KEGG pathways were used to identify the genes involved
