figure_title: Expression and general biological functions in the cervical cancer cell
  lines C-33 A (in green), SiHa (in blue), and Ca Ski (in pink).
caption: Expression and general biological functions in the cervical cancer cell lines
  C-33 A (in green), SiHa (in blue), and Ca Ski (in pink). In (a) differential gene
  expression between C-33 A, SiHa, and Ca Ski is depicted in the heat map. Panel (b)
  represents GO analysis from differentially expressed genes in C-33 A, SiHa, and
  Ca Ski. The colored bars represent the Gene Ontology for molecular functions (MF),
  molecular components (MC), and biological processes (BP). In (c), the cnetplot corresponding
  to the pathways mainly enriched by genes expressed in C-33 A, SiHa, and Ca Ski is
  represented. The colored lines correspond to the categories of each pathway, and
  the genes involved in each enriched pathway are shown. In (d), a score dotplot is
  shown representing the metabolic pathways enriched by genes expressed in C-33 A,
  SiHa, and Ca Ski cell lines. The size and color of the circles represent the proportion
  of enrichment. Graphs were obtained from analysis in the KEGG, GO, and GSA databases.
  The plots were obtained from SRplot. Significant enrichments were defined as |NES|
  > 1, NOM p. adjust < 0.05, and FDR q value < 0.25
