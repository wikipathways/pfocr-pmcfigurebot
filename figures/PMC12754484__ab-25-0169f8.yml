figure_title: Effects of garlic skin on rumen microbial metabolomics in goats.
caption: Effects of garlic skin on rumen microbial metabolomics in goats. (A) Volcano
  plot of differential metabolites. Red dots represent upregulated metabolites in
  the GAS group, blue dots represent downregulated metabolites, and gray dots represent
  non-significant metabolites. The x-axis indicates log2 (FC) values, and the y-axis
  indicates −log10 (p-value). (B) Lollipop chart of the top 10 significantly upregulated
  and downregulated metabolites with the smallest p-values. The x-axis shows log2
  (FC), and the y-axis represents differential metabolites. (C) Classification of
  differential metabolites. (D) KEGG bubble plot of the top 20 enriched pathways.
  The x-axis represents the enrichment score, while the y-axis lists the pathway information.
  Larger bubbles indicate more differential metabolites within the pathway, and the
  bubble color gradient (blue to red) reflects the p-value, with smaller values indicating
  higher significance. CON, control group fed the basal diet; GAS, fed the basal diet
  supplemented with 16% garlic skin. KEGG, Kyoto Encyclopedia of Genes and Genomes
