caption: Functional analysis of differential metabolites and correlation with gut
  microbiota in UC mice. (A) Upset plot visualizing intersections of differential
  metabolites across comparisons. (B) Heatmap bubble chart depicting the relative
  abundance patterns of 12 key differential metabolites. (C) KEGG pathway enrichment
  analysis of identified differential metabolites. (D) Pearson correlation analysis
  between the top 30 gut microbiota genera and UC-related indicators. Asterisks denote
  significant correlations (* p < 0.05, ** p < 0.01). Data are presented as mean ±
  SEM (n = 5)
