figure_title: Nitrosamines and Nitro-PAHs/PAHs carcinogens promote different cancer-relevant
  pathways
caption: A. Canonical pathway activation (activating z-score >1, adj. p<0.05) based
  on Ingenuity Pathway Analysis of proteins differentially expressed (Fisher's exact
  test, adj. p<0.05) in tumors from patients in the PAHs/nitro-PAHs and nitrosamine
  carcinogen signature groups.B. Differential protein expression profiles demonstrate
  the impact of specific carcinogens on LUAD tumors. Comparison between tumors manifesting
  high or absence of nitrosamine signatures (upper panel) or between high, low, or
  absence of PAHs/nitro-PAHs signatures (lower panel; Table S6) reveal activation
  of organonitrogen/aromatic compound metabolic processes, immune response, tumor
  progression and metastasis (activating z-score >1; Fisher's exact test, adj. p<0.05).
  Specific enriched proteins and phosphosites (Fisher's exact test, adj. p<0.05) underpinning
  shared carcinogenic processes are color-coded for the associated carcinogen signature
  (nitrosamine, green; PAHs, light blue; nitro-PAHs, dark blue). Vertical tracks annotate
  smoking status and key driver mutations (EGFR and KRAS) for the carcinogen groups.
  Asterisks represent p-values (Wilcoxon rank sum test, * p< 0.05, ** p<0.01, ***p<0.001
  and ****p<0.0001).C. Protein biomarker candidates differentially upregulated in
  tumors with HSS or LSS from self-reported smokers or never-smokers (Kruskal Wallis
  tests, adj. p<0.05) further filtered for the ability to distinguish between any
  two groups (Wilcoxon rank sum test, adj. p<0.05). The vertical tracks annotate proteins
  as kinases, glycosylation-regulated enzymes, oncogenes, tumor suppressors, or immune
  response markers (ONC, oncogene; TSG, tumor suppressor gene.)D. Metacore pathway
  analysis of differential proteomic and phosphoproteomic profiles of 1-NP- (5 uM)
  or BaP- (5 uM) treated A549 and PC9 cells. The differential protein numbers in the
  enriched pathways (Fisher's exact test, adj. p<0.05) are presented by the bubble
  plot.E. Selected proteins or phosphosites from differential expression profiles
  of 1-NP- and BaP-treated A549 and PC9 cells, with tracks showing enriched functions
  in metabolism, EGFR signaling, cell cycle and proliferation, metastasis or EMT from
  Metacore pathway analysis. Asterisks indicate proteins consistently regulated in
  nitro-PAHs and PAHs tumor signatures.F. Migration ability of lung cancer cells treated
  with carcinogens 1-NP and BaP. For panels F, G, and H, at least two independent
  experiments were performed, data are presented as mean ± SD, and p-values were determined
  by one-way ANOVA followed by Dunnett's multiple comparisons test. Asterisks indicate
  p< 0.05.G. Invasion ability of lung cancer cells treated with carcinogens 1-NP and
  BaP. Asterisks indicate p< 0.05.H. Cell proliferation assay for lung cancer cells
  treated with carcinogens 1-NP and BaP. Asterisks indicate p< 0.05.See also Figure
  S6 and Table S6
