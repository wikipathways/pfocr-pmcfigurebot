figure_title: IL-1β causes overexpression of Bcl-2 and cIAP1 in RS4:11 leukaemic lymphoblasts
  through the PI3K/AKT/NF-κB pathway.
caption: IL-1β causes overexpression of Bcl-2 and cIAP1 in RS4:11 leukaemic lymphoblasts
  through the PI3K/AKT/NF-κB pathway. (A,E) Representative flow cytometry histograms
  showing Bcl-2 and cIAP1 levels at 24, 48, and 72 h after IL-1β treatment. (B,F)
  MFI analysis of Bcl-2 and cIAP1 at those same time points with IL-1β. (C,G) Histogram
  of Bcl-2 expression at 48 h with IL-1β, in the presence of inhibitors JSH23, wortmannin
  and PP2. (D,H) MFI analysis of Bcl-2 at 48 h and cIAP1 at 24 h under the same conditions.
  All data represents three independent experiments performed in triplicate. *** p
  < 0.01 vs. control, ** p < 0.02 vs. control
