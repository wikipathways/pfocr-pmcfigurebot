caption: Pathway enrichment and pro-angiogenic subpopulation analysis in VHL-engineered
  cell lines. (A) Hallmark pathway enrichment analysis across cell lines. Dot plot
  shows enriched pathways analyzed by GSVA. Circle size represents the fraction of
  cells with pathway activity in each group (WT, mutVHL, mutVHL-restored, mutVHL-control);
  color intensity indicates mean enrichment score. Key pathways (e.g., hypoxia, glycolysis,
  angiogenesis) show genotype-specific activation patterns. (B) Cell fractions of
  normal and pro-angiogenic cellular subpopulations across experimental groups. Bar
  plot demonstrates the relative proportions of cells exhibiting pro-angiogenic signatures.
  (C) Subpopulation-specific Hallmark pathway enrichment. Dot plot displays pathway
  activation patterns within distinct cellular subpopulations (normal vs. pro-angiogenic)
  across genotypes. Circle size and color represent fraction of active cells and mean
  enrichment score, respectively, highlighting conserved pro-angiogenic pathway activation
  regardless of VHL status
