figure_title: Cage change activates CD8 T cells, leading to downstream epithelial
  ISG responses and virus clearance
caption: a, UMAP visualization of major immune cell clusters in scRNA-Seq data combining
  mock-CC, mock+CC, MuAstV-CC, and MuAstV+CC. Cells from 2 mice were pooled per condition.
  b, Proportion of immune cell clusters shown in A in each condition. c, Cd69 expression
  in indicated T cell clusters. d, UMAP visualization of major epithelial cell clusters
  in scRNA-Seq data. e, Pathway enrichment analysis of genes upregulated in both CC
  conditions showing the six most upregulated pathways in mock (top) and MuAstV (bottom)
  in the EpCAM+ cells with GeneRatio for each. f, heatmap for Z-scores of genes in
  the ‘response to virus’ pathway in EpCAM+ cells. g, Expression levels of individual
  ISGs in goblet cells. h, Heatmap showing changes in gene expression of ISGs and
  Tnfa over time in ileal epithelial layer measured by RT-qPCR. Values are normalized
  to 0h post CC. FC fold change. n = 3–10 mice. i, MuAstV levels from the mice used
  to generate (h) measured by RT-qPCR. n = 3–10 mice. j, normalized Ifit2 RNA levels
  in mock infected WT, MuAstV infected WT and MuAstV infected Cd8−/− mice 24h +/−CC
  measured by RT-qPCR. n = 4–14 mice. k, MuAstV levels from Cd8−/− mice in (j) measured
  by RT-qPCR. n = 5–10 mice. Square (□) in (j+k) indicates the same mouse that behaved
  as an outlier. l, MuAstV levels in Ctr and Stat1 ΔIEC mice before and after CC measured
  by RT-qPCR. Stat1 deletion was induced through tamoxifen feed for 7d before CC.
  n = 3 mice. SPF mice were used for all experiments. Each dot represents data from
  one animal in panels. (i-k) and the data are represented as mean ±SEM from at least
  two independent experiments. ns = not significant, *p≤0.05, **p≤0.01, ***p≤0.001,
  ****p≤0.0001 by two-sided Student’s T-test compared to no CC for panels (h) and
  (j-k). For panel (h) ‘+’ denotes FC with p≤0.05
