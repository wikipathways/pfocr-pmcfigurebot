figure_title: Degradation pathway of homogentisic acid.
caption: 'Degradation pathway of homogentisic acid. The step affected in alkaptonuria
  is the ring opening of homogentisic acid (1) by homogentisate-1,2-dioxygenase (HGD),
  which, in pathological variants, prevents the enzyme from processing the substrate
  to 4-maleylacetoacetic acid. The substrate then accumulates and transforms into
  ochronotic pigment. HGD: homogentisate 1,2-dioxygenase; GSTZ1: glutathione S-transferase
  zeta 1; FAH: fumarylacetoacetate hydrolase'
