figure_title: Immunomodulatory and antitumoral mechanisms of curcumin and its derivatives,
  demethoxycurcumin, bisdemethoxycurcumin, and cyclocurcumin.
caption: Immunomodulatory and antitumoral mechanisms of curcumin and its derivatives,
  demethoxycurcumin, bisdemethoxycurcumin, and cyclocurcumin. These compounds modulate
  immune responses by neutralizing reactive oxygen species (ROS), activating Nrf2
  to induce cytoprotective proteins, and stimulating antioxidant enzymes (SOD, CAT,
  GPx, GST, GCL, PKC, PI3K, PERK, MAPK). They suppress pro-inflammatory kinases (PKA,
  mTOR, MAPKs), inhibit transcription factors (NF-κB, STAT3, AP-1), and downregulate
  inflammatory mediators (TNF-α, IL-1β, IL-6, COX-2). Curcumin also regulates the
  JAK/STAT pathway via SOCS1/3, blocks cyclin D1 and HER2-TK, and promotes antitumoral
  effects including cell cycle arrest, apoptosis, inhibition of tumor initiation and
  angiogenesis, and downregulation of adhesion molecules. Curcumin and its derivatives
  also exert chemosensitizing effects, in part through inhibition of thioredoxin reductase
  and restoration of an anti-inflammatory profile, further enhancing their antitumoral
  activity. These actions contribute to therapeutic potential in autoimmune diseases
  such as rheumatoid arthritis, multiple sclerosis, autoimmune thyroiditis, systemic
  lupus erythematosus, and uveitis
