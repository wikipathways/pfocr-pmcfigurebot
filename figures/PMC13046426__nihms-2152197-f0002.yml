figure_title: JNK Signaling pathway in metabolic inflammation
caption: The c-Jun N-terminal kinase (JNK) signaling cascade is activated by metabolic
  stressors such as reactive oxygen species (ROS), hormones, and proinflammatory cytokines.
  These stimuli trigger upstream kinases that phosphorylate JNK isoforms (JNK1, JNK2,
  JNK3), resulting in the phosphorylation of the transcription factor c-Jun. Activated
  c-Jun becomes part of the activator protein-1 (AP-1) complex, which promotes the
  transcription of proinflammatory cytokines
