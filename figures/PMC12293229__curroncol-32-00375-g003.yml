figure_title: The impact of cannabidiol on serotonin pathway and the development of
  colorectal cancer.
caption: The impact of cannabidiol on serotonin pathway and the development of colorectal
  cancer. In addition to other molecular actions that cannabidiol may impose on the
  development of colorectal cancer, such as the endocannabinoid system, immune system,
  and microbiome, serotonin signaling represents one of the crucial pathways by which
  cannabidiol may have critical impact on the hallmarks of cancer. The impacts are
  complex and not yet to be fully delineated. It appears that cannabidiol may prevent
  tumor initiation in the early stages but promote progression and invasion/metastasis
  in the later stages of colorectal tumorigenesis
