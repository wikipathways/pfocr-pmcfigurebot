figure_title: Regional enzyme activity alterations in tryptophan- and serotonin (5-HT)-associated
  pathways in WT and kat2−/− mice.
caption: 'Regional enzyme activity alterations in tryptophan- and serotonin (5-HT)-associated
  pathways in WT and kat2−/− mice. Box plots showing enzyme activities across striatum
  (STR), cortex (CTX), hippocampus (HIPP), cerebellum (CER), and brainstem (STEM)
  in wild-type (WT, light green) and kat2−/− (dark green) mice. Activities were calculated
  as product-to-substrate ratios for: (a) KATs (KYNA/KYN), (b) KMO (3-HK/KYN), (c)
  KYNU (3-HAA/3-HK), (d) KAT III (XA/3-HK), (e) TPHs (5-HTP/Trp), (f) AADC (5-HT/5-HTP),
  (g) MAOs + ALDH (5-HIAA/5-HT), (h) TMO [TrD, ArAT] (IAA/Trp), (i) MAOs (DOPAC/DA),
  (j) COMT (HVA/DOPAC). Enzyme activity of KATs decreased in STR. KMO’s activity significantly
  increased in every brain region. KYNU’s activity decreased in HIPP. KAT III enzyme
  activity decreased in CTX, HIPP, CER, and STEM. Activity of TPH enzymes decreased
  in CTX and CER. AADC’s activity decreased in STR, CTX, and CER. MAOs + ALDH decreased
  in CTX. TMO’s activity decreased in HIPP and CER. Activity of MAOs in the tyrosine-dopamine
  pathway significantly decreased in CER. COMT’s activity increased in CER. Data are
  shown as mean ± SD. Symbols: •, outlier; ▲, far out. Statistical significance: *,
  p < 0.05; **, p < 0.01; ***, p < 0.001. Figures were created with LabPlot 2.9.0
  (KDE, Berlin, Germany) and BioRender.com. 3-HAA, 3-hydroxyanthranilic acid; 3-HK,
  3-hydroxykynurenine; 5-HIAA, 5-hydroxyindoleacetic acid; 5-HT, serotonin (5-hydroxytryptamine);
  5-HTP, 5-hydroxytryptophan; AADC, aromatic L-amino acid decarboxylase; ALDH, aldehyde
  dehydrogenase; ArAT, aromatic amino acid aminotransferase; CER, cerebellum; COMT,
  catechol-O-methyltransferase; CTX, cortex; DA, dopamine; DOPAC, 3,4-dihydroxyphenylacetic
  acid; HIPP, hippocampus; HVA, homovanillic acid; IAA, indole-3-acetic acid; KAT
  III, kynurenine aminotransferase III; KATs, kynurenine aminotransferases; kat2−/−,
  kynurenine aminotransferase II knockout; KMO, kynurenine-3-monooxygenase; KYN, kynurenine;
  KYNU, kynureninase; MAOs, monoamine oxidases; STEM, brainstem; STR, striatum; TMO,
  tryptophan-2-monooxygenase; TPHs, tryptophan hydroxylases; TrD, tryptophan decarboxylase;
  Trp, tryptophan; WT, wild-type mice; XA, xanthurenic acid'
