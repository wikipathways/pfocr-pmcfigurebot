figure_title: Relationships between Wnt pathway and mitophagy in OB subtypes.
caption: Relationships between Wnt pathway and mitophagy in OB subtypes. (A) Genes
  shown by heat map of top 40 DEGs in three OB subtypes. (B-C) Relative mRNA expression
  level and protein level of Wnt proteins and autophagy-related genes showed the dynamic
  changes in Wnt pathway and autophagy activity. (D) KEGG analysis of unique different
  expressed genes in OBs subtypes. (E) TEM images and EDX elemental mapping show no
  electron-dense granules in Mdivi-1 and Wnt agonist-1 treated-EVs. (F) miRNA expression
  level of 10 miRNAs in Mdivi-1 and Wnt agonist-1 treated Min-EVs (n = 3). (G-H) The
  expression levels of osteogenic maker genes in BMSC after treated with Mdivi-1 and
  Wnt agonist-1 treated-EVs
