figure_title: USP30-AS1 modulates the expression of Wnt-related genes.
caption: USP30-AS1 modulates the expression of Wnt-related genes. (A) qPCR analysis
  of mRNA expression levels of key Wnt pathway-related factors in MDA-MB-231 cells
  stably transfected with shRNA targeting USP30-AS1. Data are presented as mean ±
  SD. (B) Western blot analysis of Wnt-related proteins in stable USP30-AS1-knockdown
  MDA-MB-231 cells. GAPDH was used as a loading control. (C) qPCR detection of Wnt
  pathway gene expression following transient transfection with siRNA against USP30-AS1.
  Data are presented as mean ± SD. (D) Western blot validation of Wnt signaling components
  after transient siRNA-mediated knockdown of USP30-AS1. (E) qPCR evaluation of Wnt
  target genes in MDA-MB-231 cells overexpressing USP30-AS1. Data are presented as
  mean ± SD. (F) Western blot analysis confirming upregulation of Wnt pathway factors
  upon USP30-AS1 overexpression.* p < 0.05, ** p < 0.01, *** p < 0.001, and **** p
  < 0.0001 versus shNC, siNC or Vector
