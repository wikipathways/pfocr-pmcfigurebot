figure_title: Impaired fatty acid oxidation and mitochondrial respiration are linked
  to AMPK signaling
caption: '(A) Graphical representation of AMPK as a key regulator of many cellular
  processes, including mitochondrial biogenesis, autophagy, and fatty acid oxidation
  (FAO). (B) Increased ATP accumulation in freshly isolated AT2I73T cells at 7 days
  and 14 days after in vivo tamoxifen induction (mean± SEM; 25,000 cells, n = 5–9
  mice per condition). (C) Western blot and densitometric quantification (mean± SEM;
  n = 3 biological replicates) of key enzymes in AMPK signaling pathway demonstrates
  reduced AMPK signaling and FAO in AT2I73T cells. (D and E) Reduced OCR in AT2I73T
  cells isolated at 14 days and 28 days after tamoxifen induction and cultured overnight
  in media supplied with endogenous fatty acids (mean± SEM; n = 9–19 mice per condition).
  (F and G) OCR in AT2I73T cells isolated at 28 days after in vivo tamoxifen induction
  and cultured for 48 hours in the presence of the following small molecules: rosiglitazone
  (25 μM, n = 8) to stimulate PPAR-γ, PF-06409577 (100 nM, n = 7) to activate AMPK,
  and Torin 1 (100 nM, n = 4) to inhibit mTOR (mean±SEM). *P < 0.05, **P < 0.005,
  ***P < 0.0005, ****P < 0.00005 by ordinary 1-way ANOVA'
article_title: Impaired AMPK control of alveolar epithelial cell metabolism promotes
