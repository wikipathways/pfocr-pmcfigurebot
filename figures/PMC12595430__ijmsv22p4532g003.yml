figure_title: Evodiamine induces apoptosis in human anaplastic thyroid carcinoma cells.
caption: Evodiamine induces apoptosis in human anaplastic thyroid carcinoma cells.
  (A) ARO and (B) SW579 cells were incubated with evodiamine, and the apoptotic cells
  were determined with flow cytometry. (C) The expressions of caspase-3, -9, and PARP
  protein were assessed using western blotting in cells treated with evodiamine. (D)
  DNA fragmentation was detected in the cells under evodiamine treatment. (E) Confirmation
  evodiamine mediated apoptosis was via caspase-dependent pathway in ARO and SW579
  cells and determined with western blotting after 72 h treatment. DMSO was used as
  negative control. Three independent experiments each were conducted for flow cytometry
  and western blotting; Western blots and flow cytometry dot plots of a representative
  experiment were shown. * compared with the control group
