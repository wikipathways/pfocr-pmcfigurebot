figure_title: EBV DNAemia gene associations at cell and pathway resolutions
caption: '(a) UMAP embedding of 211,000 peripheral blood mononuclear cells. The broad
  cell type annotation (Azimuth L173) annotates major cell types. (b) Module score
  of EBV ExWAS associations, highlighting populations with the highest enrichment.
  (c) Summary of EBV ExWAS scores in major populations. *** indicate statistical significance
  (P < 2.2 × 10−16 relative to held-out cell types; one-sided Wilcoxon rank-sum test).
  Boxplots: center line, median; box limits, first and third quartiles; whiskers,
  1.5× interquartile range. (d) Summary of top 5 terms from gene set analysis (GSA)
  of GO Biological Processes Pathways enrichment. (e) Same as (d) except excluding
  annotated HLA genes. (f) Same as (d) but excluding all genes mapping to chromosome
  6'
