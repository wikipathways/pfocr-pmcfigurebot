figure_title: 'Porphyromonas gingivalis-mediated multimodal hepatocyte death: apoptosis,
  PANoptosis, necroptosis, and pyroptosis.'
caption: 'Porphyromonas gingivalis-mediated multimodal hepatocyte death: apoptosis,
  PANoptosis, necroptosis, and pyroptosis. Distinct death models are color-coded,
  as follows: purple lines (apoptosis), yellow lines (autophagy inhibition and PANoptosis),
  green lines (necroptosis), and blue lines (pyroptosis). In this figure, arrows indicate
  cascade reactions or downstream products, and lines with termination bars represent
  inhibitory effects.(1) Apoptosis (in order to maintain the stability of the internal
  environment, cells controlled by genes die spontaneously and in an orderly manner).
  P. gingivalis induces oxidative stress, triggering Bcl-2-mediated Bax activation,
  mitochondrial membrane damage, cytochrome c release, and caspase activation to orchestrate
  hepatocyte apoptosis; P. gingivalis activates the MKK-JNK cascade to promote Bax
  phosphorylation, while TNF-α and TNFR interaction forms the DISC, promoting hepatocyte
  apoptosis. (2) Autophagy (a process in which cells engulf cytoplasmic proteins or
  organelles, package them into vesicles, and fuse with lysosomes to form autolysosomes
  for degradation of the sequestered contents inhibition) and PANoptosis (an inflammatory
  form of programmed cell death regulated by the PANoptosome complex, featuring key
  characteristics of pyroptosis, apoptosis, and/or necroptosis). P. gingivalis-LPS
  binds TLR2/4, activating the NF-κB/MAPK pathways to upregulate pro-inflammatory
  cytokines while suppressing autophagy initiation via LC3 downregulation; P. gingivalis-derived
  proteases degrade LAMP1/2, preventing autophagosome–lysosome fusion and terminating
  autophagic flux; P. gingivalis-induced inflammatory cascades trigger ER stress,
  activating the PERK/eIF2α pathway to transcriptionally repress autophagy-related
  genes. (3) Necroptosis (when apoptosis is blocked, necroptosis is the process of
  self-destruction of cells activated by extracellular signals or intracellular signals).
  P. gingivalis-LPS specifically binds to TLR2/TLR4, activates NF-κB, releases inflammatory
  mediators, upregulates Complex IIB, and promotes necroptosis; P. gingivalis inhibits
  caspase-8, activates the necrosome, upregulates ROS, regulates the ASK1/JNK pathway,
  phosphorylates MLKL, and promotes necroptosis. (4) Pyroptosis (programmed cell death
  mediated by gasdermin protein and characterized by cell membrane perforation, content
  release, and inflammatory response activation). P. gingivalis activates the TLR4/NF-κB
  pathway and inducing ROS production, which triggers mitochondrial dysfunction and
  mtDNA release. The leaked mtDNA activates the NLRP3 inflammasome, leading to caspase-1
  cleavage. Active caspase-1 then incises GSDMD, releasing pro-inflammatory mediators
  and executing pyroptosis. Abbreviations: TNFR, tumor necrosis factor receptor; MEKK,
  mitogen-activated protein kinase kinase kinase; MKK4, mitogen-activated protein
  kinase kinase 4; MKK7, mitogen-activated protein kinase kinase 7; MKK3, mitogen-activated
  protein kinase kinase 3; MKK6, mitogen-activated protein kinase kinase 6; Rgp, Arg-gingipain;
  RIPK3, receptor-interacting protein kinase 3; RIPK1, receptor-Interacting protein
  kinase 1; Bcl-2, B-cell lymphoma 2; Bax, BCL2-associated X protein; JNK, c-Jun N-terminal
  kinase; DISC, death-inducing signaling complex; p38, p38 mitogen-activated protein
  kinase; MAPK, mitogen-activated protein kinase; LC3, microtubule-associated protein
  1 light chain 3; LAMP-1/2, lysosomal-associated membrane protein 1/2; PERK, protein
  kinase R-like ER kinase; eIF2α, eukaryotic translation initiation factor 2α; MLKL,
  mixed lineage kinase domain-like protein; ASK1, apoptosis signal-regulating kinase
  1; mtDNA, mitochondrial DNA; GSDMD, gasdermin D. Created with BioRender.com and
  based on the work of [125,127,130,132,133,134,135,136,137,138]'
