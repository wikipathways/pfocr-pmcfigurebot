figure_title: 5-HT2A receptor signaling pathways
caption: 'Signaling components stemming from 5-HT2A receptor activation include (a)
  Gq/11 signaling pathways that activate PLC, leading to IP3 and DAG generation, followed
  by PKC activation; (b) β-arrestin recruitment, leading to internalization, which
  is implicated in neuritogenesis and neuroplastic potential and may be due to intracellular
  sustained signaling; and (c) alternative pathways such as AA generation, which may
  be due to a pertussis toxin–sensitive or –insensitive Gi/o/z pathway. Abbreviations:
  5-HT, 5-hydroxytryptamine; AA, arachidonic acid; DAG, diacylglycerol; ER, endoplasmic
  reticulum; IP3, inositol-1,4,5-trisphosphate; PKC, protein kinase C; PIP2, phosphatidylinositol
  4,5-bisphosphate; PLA2, phospholipase A2; PLC, phospholipase C. Figure created in
  BioRender; McCorvy J. 2025. https://BioRender.com/zkdc0c4'
