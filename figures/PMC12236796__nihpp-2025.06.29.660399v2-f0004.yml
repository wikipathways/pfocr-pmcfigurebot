figure_title: A Wnt-dependent gene program that corresponds to cell cycle exit is
  identified by GeneTrajectory
caption: (A) UMAPs of control and ActSMO colored by indicate genes. (B) GT analysis
  of E13.5 ActSMO and paired control dermal scRNA-seq data showing four GTs and DC
  GT of ActSMO mutant which is not present in control. Exit GT of ActSMO colored by
  GT stage or indicated genes. (C) Pathway analysis of Exit GT. UMAPs of control and
  ActSMO colored by indicate genes. (D) FISH showing indicated genes of E13.5 control
  or ActSMO mutant skin; corresponding quantification of Trp53inp1 or Cdkn1a levels.
  (E) Label transfer of E13.5 ActSMO Exit GT onto indicated E13.5 mutants. (F) EdU
  pulse-chase experiments of E13.5-E14.5 ActSMO mutant and corresponding quantification
  of %EdU positive of Trp53inp1+ cells. (G) Cartoons depict the interpretation of
  cell cycle dynamics of Trp53inp1+ cells which represent cells that are immediate
  progeny of a division. Data as mean ± SEM, one-way ANOVA. Scale bars, 50 μm. Related
  to Figure S4
