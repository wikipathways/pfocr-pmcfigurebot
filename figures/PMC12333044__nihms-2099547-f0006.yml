figure_title: Neural and rhabdomyosarcoma gene signatures are transcriptionally activated
  in PAX3::FOXO1-injected embryos
caption: (A) PCA on normalized RNA-seq reads in CNTL versus PAX3::FOXO1-injected (P3F)
  embryos compared to publicly available RNA-seq during zebrafish blastulation and
  gastrulation according to hpf, from White et al.48(B) Volcano plot of differentially
  expressed genes in P3F versus CNTL embryos. Significant genes (red) had an adjusted
  p < 0.05 and average fold change (FC) ≥ 1.5. Highlighted are manually selected genes
  related to rhabdomyosarcoma, tumorigenesis, myogenesis, and neural development.(C)
  Enriched rhabdomyosarcoma gene sets from the Molecular Signatures Database (MSigDB)
  from gene list pathway analysis with up and downregulated differentially expressed
  genes in P3F embryos.(D) The top five enriched GO biological processes with DAVID
  analysis for downregulated (left) and upregulated (right) genes in P3F embryos.(E)
  Gene set enrichment analysis (GSEA) for upregulated pathways in the Reactome pathway
  database on MSigDB.(F) GSEA for upregulated GO biological processes.(G) GSEA for
  upregulated GO cellular compartments.(H) GSEA to markers of the developing zebrafish
  central nervous system, identified from scRNA-seq analysis from Saunders et al.57(I
  and J) GSEA to PAX3::FOXO1-driven rhabdomyosarcoma cell population markers identified
  from scRNA-seq analysis in Danielli et al.58
