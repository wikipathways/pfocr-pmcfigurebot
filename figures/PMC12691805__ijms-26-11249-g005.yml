figure_title: Gene expression and metabolite accumulation associated with the JA pathway
  in E.
caption: 'Gene expression and metabolite accumulation associated with the JA pathway
  in E. purpurea leaves in response to biochar amendment. Gene expression in the JA
  (a) biosynthesis, (b) metabolism, and (c) signaling pathways. (d–f) Accumulation
  levels of JA-related metabolites (JA (d), JA-Ile (e), and 12OH-JA-Ile (f)). Values
  are presented as mean ± SD (n = 3). Gene expression heatmap (color bar: −5→0→5):
  Blue indicates low gene expression levels, while red indicates high expression levels
  (with 0 representing the baseline level); the colored blocks adjacent to the genes
  represent the relative expression levels of these genes across different samples.
  Solid arrows indicate direct enzyme-catalyzed biochemical conversion steps; dashed
  arrows rep-resent regulatory/associative interactions. Asterisks indicate significant
  differences compared to the control: * p < 0.05, ** p < 0.01. Scheme of JA biosynthesis
  and catabolism made based on the works Huang et al. (2017) [26] and Delgado et al.
  (2021) [27]. Abbreviations: α-LeA, α-Linolenic acid; LOX, Lipoxygenase; AOS, Allene
  oxide synthase; AOC, Allene oxide cyclase; OPDA, 12-oxo-phytodienoic acid; OPR,
  OPDA reductase; OPCL, OPC-8:0 CoA ligase; ACX, Acyl-CoA oxidase; MFP2, Multifunctional
  protein 2; KAT, 3-ketoacyl-CoA thiolase; JA-CoA, Jasmonoyl-CoA; JA, Jasmonic acid;
  JAR1, Jasmonate resistant 1; JA-Ile, Jasmonoyl-L-isoleucine; MeJA, Methyl jasmonate;
  JMT, Jasmonate methyltransferase; COI1, Coronatine insensitive 1; JAZ, Jasmonate
  ZIM-domain protein; MYC2, MYC2 transcription factor; IAR3/ILL6, IAA-Ala Resistant
  3/IAA-Leu Resistant-Like 6; CYP94B3, Cytochrome P450 94B3; CYP94C1, Cytochrome P450
  94C1; CYP94B3/C1, Cytochrome P450 94B3/94C1'
