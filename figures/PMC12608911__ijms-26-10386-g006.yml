figure_title: 'Mechanistic pathway depicting TREM-1–mediated inflammatory signaling
  in ligature-induced periodontitis: PGLYRP1 from plaque/bacterial infection serves
  as ligand to activate the TREM-1 signaling in neutrophils and macrophages.'
caption: 'Mechanistic pathway depicting TREM-1–mediated inflammatory signaling in
  ligature-induced periodontitis: PGLYRP1 from plaque/bacterial infection serves as
  ligand to activate the TREM-1 signaling in neutrophils and macrophages. This initiates
  epigenetic activation of TREM-1-PGLYRP1-IL1β signaling pathway with downstream phosphorylation
  cascades, involving SYK, SRC, activating STAT3 and promoting nucleated IL1β and
  IL17A expression. Concurrently, IL-17A induces increase in RANKL/OPG ratio, leading
  to dysregulated bone homeostasis. STATs activation and PGLYRP1-induced inflammation
  contribute to dysregulated bone resorption and alveolar bone loss'
article_title: 'Triggering Receptor Expressed on Myeloid Cells-1 (TREM-1) in Inflammation
  and Disease: Mechanisms, Therapeutic Potential, and Future Directions'
