figure_title: ChIP-qPCR analysis of H3K4me3 at CHGA and UCHL1 promoters following
  pathway inhibition in HCT-OxR cells.
caption: ChIP-qPCR analysis of H3K4me3 at CHGA and UCHL1 promoters following pathway
  inhibition in HCT-OxR cells. HCT-OxR cells were treated with specific inhibitors
  targeting the NF-κB, ERK, or Rho signaling pathways. Chromatin immunoprecipitation
  (ChIP) was performed using an antibody against H3K4me3, followed by quantitative
  PCR (qPCR) to measure H3K4me3 enrichment at the CHGA and UCHL1 promoter regions.
  Results are expressed as fold enrichment relative to the untreated HCT-OXR group
  (set as 1.0 fold). Data represents the mean ± SD. * p < 0.05, as compared to the
  untreated control group
