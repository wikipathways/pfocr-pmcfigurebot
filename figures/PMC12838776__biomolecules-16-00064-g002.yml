figure_title: Mechanism of action of S.
caption: Mechanism of action of S. baicalensis against AKI. Baicalin, baicalein, and
  wogonin have been identified to inhibit AKI through multiple molecular pathways.
  Baicalin attenuates AKI by modulating oxidative stress via the miR-223-3p-TXNIP/NLRP3
  pathway, suppressing TLR-induced inflammation, and activating the Nrf2/ARE, PI3K/Akt,
  and JAK2/STAT3 signaling cascades. Baicalein ameliorates AKI predominantly by inhibiting
  MAPK and NF-κB signaling, enhancing the Nrf2/HO-1-mediated antioxidant response,
  reducing reactive oxygen species (ROS) production, and modulating apoptosis via
  the Bcl-2/Bax and SIRT1 pathways. Wogonin exerts protective effects against AKI
  via dual-level regulation of the NF-κB and RIPK1 signaling axes
