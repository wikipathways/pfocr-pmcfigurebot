figure_title: Regulation of hemoglobin levels under hypoxic stress.
caption: 'Regulation of hemoglobin levels under hypoxic stress. (A) Hypoxia promotes
  the increased activity of 2,3-DPG isomerase in red blood cells, inducing the production
  of the glycolytic byproduct 2,3-DPG. Elevated levels of 2,3-DPG adjust the affinity
  of hemoglobin for oxygen, thereby increasing the levels of P50 and enhancing oxygen
  release to peripheral hypoxic tissues. This mechanism helps to prevent hypoxia-induced
  tissue inflammation and damage. (B) Hypoxia promotes the nuclear translocation of
  HIF-α, which then binds with HIF-β to mediate the transcription of downstream genes
  such as EPO. The increased expression of EPO binds to its receptor, EPOR, subsequently
  inducing hemoglobin expression and promoting the proliferation and differentiation
  of erythroid precursor cells. 2,3-DPG: 2,3-diphosphoglycerate, DPGM: phosphoglycerate
  mutase, HIF-α: hypoxia-inducible factor subunit α, HIF-β: hypoxia-inducible factor
  subunit β, EPO: erythropoietin, EPOR: erythropoietin receptor, EPC: erythroid precursor
  cell. “↑”: hypoxia promotion pathway, “↓”: hypoxia inhibition pathway'
