figure_title: A hypothetical model of the anti-inflammatory mechanism of HCX3.
caption: 'A hypothetical model of the anti-inflammatory mechanism of HCX3. In this
  model, HCX3 acts on the TLR4/MyD88/NF-κB signaling pathway: the compound inhibits
  the activation of TLR4 (the primary receptor for LPS), thereby reducing the recruitment
  of MyD88 to TLR4. This downstream effect further inhibits the activation of signaling
  proteins such as IκBα and NF-κB p65, as well as the production of inflammatory cytokines.
  The downward arrow (↓) associated with ‘degradation of IκB-α’ indicates the process
  by which phosphorylated IκB-α is degraded. The same symbol (↓) in relation to ''MyD88''
  signifies inhibition of downstream signaling pathways'
article_title: HCX3 Mitigates LPS-Induced Inflammatory Responses in Macrophages by
  Suppressing the Activation of the NF-κB Signaling Pathway
