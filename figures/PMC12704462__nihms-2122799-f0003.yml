figure_title: Hierarchical gene clustering analysis suggested VEGF-induced pathway
  changes in male and female mice.
caption: Hierarchical gene clustering analysis suggested VEGF-induced pathway changes
  in male and female mice. (A) RNA-seq analysis pipeline. (B) Heatmap of Log2 fold
  change (VEGF vs saline) showing distinct expression pattern of nociceptive genes,
  immune genes, ECM-related genes, and genes related to cell survival and growth.
  (C) The numbers of male and female VEGF-induced enriched pathways identified by
  gene set enrichment analysis (GSEA) in lumbosacral DRG. (D) A list of VEGF-induced
  enriched signaling pathways in male and female DRG. Grey color boxes represent no
  significance. Glial function related signaling pathways and lipid metabolism related
  signaling pathways are enriched in male DRG from VEGF-instilled mice, whereas signaling
  pathways related to immune system and ECM functions are enriched in VEGF-instilled
  female mice DRG (P≤0.02, enrichment score >4.0)
