caption: The investigation of the STAT pathway in AML cell lines exposed to PRI5202
  or/and Fludarabine. SOCS1 (A) and RASA4 (B) gene expression, normalized to GAPDH
  expression within samples, was tested using the RT-qPCR method in all U937 sublines
  and HL60 cells exposed to vehicle or 10 nM PRI5202 or/and 315 nM Fludarabine for
  48 h. The data are represented as mean ± SEM from 4 biological replicates, with
  statistical analyses of Treatment Vs. Control samples. Significant differences are
  represented as * (p < 0.033), ** (p < 0.002) or *** (p < 0.001)
