figure_title: Functional and transcriptomic recapitulation of an original tumor tissue
  signature in ETBF-treated, 18Co/THP-1 co-cultured model.
caption: 'Functional and transcriptomic recapitulation of an original tumor tissue
  signature in ETBF-treated, 18Co/THP-1 co-cultured model. (A) Spearman correlation
  matrix heatmap comparing gene expression profiles of CMS-associated genes among
  five groups: untreated PDO co-cultured with ETBF-treated TME (18Co and THP-1 cells),
  untreated PDO and untreated 18Co/THP-1 (control), PDOs without co-culture and ETBF
  treatment, ETBF-treated PDO with treated 18Co/THP-1, and the original tumor tissue.
  Color scale represents the degree of correlation (r), with red indicating higher
  and blue indicating lower correlations. Hierarchical clustering was performed to
  group samples based on similarity. The matrix includes pairwise Spearman correlation
  coefficients for each condition. (B) Top 10 KEGG pathways significantly upregulated
  in PDOs co-cultured with stromal (18Co) and immune (THP-1) cells and treated with
  Bacteroides fragilis, compared with untreated co-cultured PDOs. (C) Top 10 KEGG
  pathways enriched in the original patient tumor tissue compared to the ETBF-untreated
  PDOs without co-culture, derived from that tumor. Enrichment analysis was performed
  using differentially expressed genes, with pathway significance assessed by FDR
  adjusted p-value thresholds'
