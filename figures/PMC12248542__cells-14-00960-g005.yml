figure_title: The function of APOL1 as an ion pore.
caption: The function of APOL1 as an ion pore. APOL1 pathomechanism includes ion pore
  functions of the APOL1 renal risk variants. The first possibility could be that
  the TM-helices of APOL1 themselves form a pore within the PM (a). Pores could also
  be built by homodimerization of APOL1 subunits (b), or by heterodimers composed
  of APOL1 and a second protein (c). As a APOL1clustering at the surface has been
  reported, numerous APOL1 proteins could also be subunits in a multimerized assembly
  into a megapore (d). Some studies suggest a pH-dependent formation of the pore,
  which would require involvement of the endolysosomal pathway to acidify and open
  the APOL1 pore (e). Several experiments hint towards a pore selectivity for cations
  which could for example facilitate Ca2+ flux or K+ efflux combined with Na+ influx
  (f). Indirect effects due to activation of nearby ion channels could also be possible
  (g). All mechanisms bear the possibility that APOL1 not only serves as pore at the
  PM, but also at other membrane-containing compartments leading to lysosomal or mitochondrial
  dysfunction or ER stress
