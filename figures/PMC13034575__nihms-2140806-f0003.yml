figure_title: PUFA excess in a Western diet induces transcriptional RXRα activity
  in mouse IECs
caption: (A) Illustration of experimental design. Gpx4+/−IEC mice and WT controls
  were fed a PUFA-enriched Western diet for 3 months. Single cells were extracted
  from small intestinal tissue and analyzed by single-cell RNA sequencing.(B and C)
  UMAP projection depicting different cell populations (B) and Rxra expression (C)
  of small intestinal samples from Gpx4+/−IEC mice and WT controls (WT, n = 3; Gpx4+/−IEC,
  n = 4).(D) Heatmap showing differential transcription factor activity inferred by
  transcription factor regulons in mucosal cell populations from Gpx4+/−IEC mice compared
  with WT controls (WT, n = 3; Gpx4+/−IEC, n = 4), computed using CollecTRI. Red color
  indicates upregulation of a transcription factor regulon relative to WT controls.
  The white dot indicates statistical significance (FDR < 0.1).(E) Heatmap showing
  differential pathway activity in mucosal cell populations from Gpx4+/−IEC mice compared
  with WT controls (WT, n = 3, Gpx4+/−IEC, n = 4), computed using PROGENy. Red color
  indicates an increased pathway activity relative to WT controls. The white dot indicates
  statistical significance
