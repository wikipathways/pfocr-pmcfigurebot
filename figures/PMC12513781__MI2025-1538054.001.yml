figure_title: Schematic representation of the study workflow.
caption: Schematic representation of the study workflow. Datasets GSE40611 and GSE127952
  were downloaded from GEO and integrated for analysis. DEGs were identified and intersected
  with PRGs to obtain PRDEGs. The main enriched pathways were analyzed by GO and KEGG
  enrichment analyses. Key genes were identified through the intersection of LASSO
  and SVM analyses. A logistic regression model was constructed to assess the predictive
  value of key genes. mRNA–miRNA and mRNA–TF interaction networks were established.
  The ICI profile was analyzed using CIBERSORT and ssGSEA. The expression of key genes
  was quantified in NOD mice by RT-qPCR and further validated in submandibular glands
  via immunofluorescence and western blot analyses. Labial gland biopsy samples from
  patients with pSS were also used for validation through immunofluorescence. DEGs,
  differentially expressed genes; GO, Gene Ontology; ICI, immune cells infiltration;
  KEGG, Kyoto Encyclopedia of Genes and Genomes; LASSO, least absolute shrinkage and
  selection operator; PRDEGs, pyroptosis-related differentially expressed genes; PRGs,
  pyroptosis-related genes; SVM, support vector machine; TF, transcription factors
