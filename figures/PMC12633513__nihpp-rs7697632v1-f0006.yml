figure_title: Prenatal estrogen treatment induces nipple formation in male mice through
  activation of Wnt signaling pathway genes
caption: '(a, b), The nipples of male (a) and female (b) newborn mice that received
  DES prenatally are visible. Note that no nipples were detected in newborn mice that
  did not receive DES. (Figure 1c and d). (c, d), LysoTracker Red signal was not detected
  in E15 MGs of DES-treated (E13.5 and E14.5 once daily) male (c, n=3) and female
  (d, n=3) mice. Note that the signal was detected in MGs of control male and MT-treated
  female mice (Figure 4a, c). (e-i), Relative mRNA expression of Wnt pathway genes
  in MGs of mice and guinea pigs at sex differentiation. (e), Relative mRNA levels
  in MGs of DES-treated and control E15 male mice. (f, g), Relative mRNA levels in
  MGs of DES-treated and control male and female mice and guinea pigs. (h, i), Relative
  mRNA levels in MGs of control guinea pigs (h) and DES-treated mice (i). Note that
  the expression levels of Wnt signal genes in MGs of control E30 guinea pigs (E30
  male GPs) were similar to those in DES-treated E15 mice (f, g). No sexually dimorphic
  expression of selected Wnt pathway genes was detected in MGs of control E30 guinea
  pigs (h) and DES-treated E15 mice (i). Data are shown as mean ± SE, n=4. *p≤0.05,
  ** p≤0.01, *** p≤0.001, **** p≤0.0001. ns indicates no significant difference. ni
  is the same as in Figure 1, gt is the same as in Figure 5. Scale bars: a and b,
  1mm; c and d, 500μm'
