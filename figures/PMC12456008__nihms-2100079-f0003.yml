figure_title: Apoptosis and cell proliferation related gene programs are differentially
  activated in the lungs of WT (B6) and Trem2 deficient (T2KO) mice
caption: (a) RNA-seq in whole lung tissues of WT (B6) and T2KO mice at P14. Heatmap
  shows the 756 differentially expressed genes (FC > 2; p-adj < 0.05) comparing hyperoxia-exposed
  WT and T2KO mice with the normoxic controls (B6 Nx, n = 4; B6 Hprx, n = 3; T2KO
  Nx, n = 4; T2KO Hprx, n = 4).(b) Scatterplots of RNA-seq data from whole lung tissues
  showing hyperoxia-regulated gene expression in WT (B6) and T2KO mice. Left panel
  displays genes significantly regulated by hyperoxia in WT (B6) mice. Dark red dots
  indicate genes significantly upregulated by hyperoxia; light red dots indicate genes
  significantly downregulated (FC > 2; p-adj < 0.05). The right panel shows a comparison
  of hyperoxia induced genes between WT (B6) and T2KO mice. Dark red dots represent
  genes significantly downregulated in T2KO mice; dark blue dots represent genes significantly
  upregulated T2KO mice (FC > 2; p-adj < 0.05). The Venn diagram shows the overlap
  between hyperoxia-induced genes in WT mice (n = 253) and hyperoxia-suppressed genes
  in T2KO mice (n = 125).(c) KEGG pathway (left panel) and Gene Ontology enrichment
  (right panel) analysis of the 90 genes that were induced in WT and suppressed in
  T2KO by hyperoxia. P-values were calculated from hypergeometric distribution.(d)
  Bar plots for expression of representative genes belonging to the p53 signaling
  pathway. Data are mean ± SEM. DSeq2 was used for comparisons. **p-adj < 0.01 and
  ***p-adj < 0.001 reported by DESeq2 using the Benjamini–Hochberg method for the
  multiple-testing correction (B6 Nx, n = 4; B6 Hprx, n = 3; T2KO Nx, n = 4; T2KO
  Hprx, n = 4).(e) Caspase 3 activity measured in cytosolic fractions from whole lung
  tissues from B6 and T2KO mice harvested on P14. Data are mean ± SEM (n = 3 for each
  group). ANOVA was performed followed by Tukey’s post hoc comparison. *p < 0.05.(f)
  Lung tissues were stained for DAPI and CC3 and the number of CC3 positive cells
  was counted. Bar graphs show mean ± SEM (WT (B6) Nx, n = 5; WT (B6) Hprx, n = 5;
  T2KO Nx, n = 6; T2KO Hprx, n = 5). ANOVA was performed followed by Tukey’s post
  hoc comparison. *p < 0.05 and **p < 0.01.(g) Bar plots for expression of representative
  genes belonging to the cell proliferation pathway. Data are mean ± SEM. DSeq2 was
  used for comparisons. *p-adj < 0.05 and ***p-adj < 0.001 reported by DESeq2 using
  the Benjamini–Hochberg method for the multiple-testing correction (B6 Nx, n = 4;
  B6 Hprx, n = 3; T2KO Nx, n = 4; T2KO Hprx, n = 4).(h) Bar plots for expression of
  representative inflammatory genes. Data are mean ± SEM. DSeq2 was used for comparisons.
  ***p-adj < 0.001 reported by DESeq2 using the Benjamini–Hochberg method for the
  multiple-testing correction (B6 Nx, n = 4; B6 Hprx, n = 3; T2KO Nx, n = 4; T2KO
  Hprx, n = 4). Each dot represents one mouse (d, e, f, g, h). See also Extended Data
  Fig. 3
