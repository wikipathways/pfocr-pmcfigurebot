figure_title: Neuroinflammatory Mechanisms in Postoperative Delirium.
caption: 'Neuroinflammatory Mechanisms in Postoperative Delirium. This figure illustrates
  the bidirectional communication between peripheral inflammatory responses to surgical
  trauma and central neuroinflammatory processes. The diagram shows: (1) Surgical
  trauma inducing systemic inflammation with release of pro-inflammatory cytokines,
  (2) Three pathways of peripheral-to-central inflammatory communication (neural via
  vagus nerve, humoral via BBB transporters, and cellular via immune cell migration),
  (3) Microglial activation in the brain leading to local cytokine release, (4) Effects
  on neurotransmitter systems, particularly acetylcholine and dopamine, (5) Resulting
  neural network dysfunction and clinical manifestations of delirium. The figure also
  highlights the critical role of aging (“inflammaging”), shown at the bottom, with
  its primed inflammatory phenotype, elevated baseline cytokines, and increased susceptibility
  to inflammatory challenges, creating vulnerability to peripheral inflammation and
  central microglial activation. Bidirectional arrows between peripheral and central
  compartments indicate the complex feedback loops that can amplify and sustain the
  inflammatory cascade. Quantitative relationships are marked by showing approximately
  2–4-fold increases in peripheral cytokines following surgery, 25–40% increased microglial
  activation (measured via TSPO binding), and 30–50% decreases in cholinergic function
  during delirium episodes. References: [42,43,44,46,47,48,49,50,51,52]'
