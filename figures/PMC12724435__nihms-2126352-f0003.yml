figure_title: Overview of the toxic mechanisms of action for mustards and lewisites
caption: Despite their distinct chemistry and generally non-overlapping molecular
  targets, the mustards and lewisites converge to produce cytotoxic effects of mustard
  alkylation and lewisite coordination converge to activate cell death pathways. (Left)
  Mustards cyclize to short-lived onium ions that undergo SN2 attack to yield DNA
  mono-adducts, interstrand (ICL) and intrastrand crosslinks, and DNA:protein crosslinks
  (DPC), with concurrent protein alkylation of enzymes and cytoskeletal elements.
  These primary lesions trigger checkpoint failure (ICL) pathways, overstimulate PARP-1,
  deplete NAD+, constrain glycolysis, and depress ATP. (Right) Lewisites coordinate
  with cellular thiolates and selenolates with preference for vicinal 1,2-dithiols
  and selenocysteine, targeting lipoyl domains on pyruvate and α-ketoglutarate dehydrogenase
  complexes and thioredoxin reductase. Coordination at these sites blocks substrate
  entry into the tricarboxylic acid cycle, collapses ATP supply, and shifts the cellular
  redox setpoint toward oxidative stress without a genotoxic latency. (Center) The
  vesicant families functionally converge to elicit a shared set of cytotoxic effects
  that trigger cell death and barrier failure
