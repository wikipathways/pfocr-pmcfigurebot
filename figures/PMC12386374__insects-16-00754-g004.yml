figure_title: Functional enrichment of predicted target genes of differentially expressed
  miRNAs in Sarcophaga peregrina pupae.
caption: Functional enrichment of predicted target genes of differentially expressed
  miRNAs in Sarcophaga peregrina pupae. (a) Gene Ontology (GO) enrichment of P3 vs.
  P1 target genes, showing the top 30 significant terms across biological processes
  (BP), molecular functions (MF), and cellular components (CC). (b) KEGG pathway enrichment
  for P3 vs. P1 targets, highlighting involvement in MAPK, Wnt, Hippo, and ecdysone
  signaling pathways, as well as glycolysis/gluconeogenesis. (c) GO enrichment of
  P5 vs. P3 target genes, emphasizing roles in redox balance, hypoxia response, and
  autophagy. (d) KEGG pathway enrichment for P5 vs. P3 targets, with strong enrichment
  in HIF-1, FoxO, autophagy, and oxidative phosphorylation pathways
