figure_title: KEGG-GSEA enrichment analysis of SP-infected FCA-L2 cells.
caption: KEGG-GSEA enrichment analysis of SP-infected FCA-L2 cells. (A) Bubble plot
  of enriched KEGG pathways in SP vs. NC. The y-axis represents enriched pathways,
  the x-axis shows the ES, where positive values indicate upregulation and negative
  values indicate downregulation. Bubble size reflects the number of enriched genes
  and color represents the false discovery rate (q-value). (B-D) GSEA enrichment plots
  and heatmaps of core genes in significantly enriched pathways, including (B) aminoacyl-tRNA
  biosynthesis, (C) endocytosis and (D) glycerophospholipid metabolism. Upper panels
  show the ES curve with the peak corresponding to the pathway's ES value. Lower panels
  display hierarchical clustering heatmaps of leading-edge core genes in each pathway.
  KEGG, Kyoto Encyclopedia of Genes and Genomes; GSEA, gene set enrichment analysis;
  SP, Streptococcus pneumoniae; NC, negative control; ES, enrichment score
