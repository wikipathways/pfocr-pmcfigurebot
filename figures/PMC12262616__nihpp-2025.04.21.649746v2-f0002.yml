figure_title: Both tracer and dMRI tracking showed a dorsal pathway between vPFC and
  pSTG
caption: (A) Do marmosets have an arcuate fasciculus that dorsally interconnects the
  vPFC and pSTG? (B) Both retrograde and anterograde tracer data were collected from
  the marmoset brain. The retrograde tracing experiments showed connections between
  A45 and AuCM and Tpt. (C) The anterograde tracer injected into the A45 revealed
  a clear dorsal pathway above the insula, connecting the AuCM and Tpt. (D) A dorsal
  pathway connecting A45 and Tpt/AuCM was clearly observed in high-resolution dMRI
  images of marmosets, with this pathway being stronger than the ventral counterpart.
  A45, area 45; AuCM, auditory cortex caudomedial area; Tpt, temporoparietal transitional
  area; AC, auditory cortex; af, arcuate fasciculus; lf, lateral fissure; sts, superior
  temporal sulcus
article_title: Evolutionary Convergence of the Arcuate Fasciculus in Marmosets and
