caption: 'Comparison of phytohormone levels in leaves between diploid and autotetraploid
  jujubes. (A) Differentially accumulated phytohormones between ‘Longzao’ and ‘Boguang’
  jujubes; (B) Differentially accumulated phytohormones between ‘Yueguang’ and ‘Hongguang’
  jujube. Percent (%): the ratio between the number of differentially expressed metabolites
  mapped to a particular metabolic pathway and the total number of KEGG-annotated
  differential metabolites detected in the experiment. The same below. (C) KEGG enrichment
  analysis of differentially accumulated phytohormones between ‘Longzao’ and ‘Boguang’
  jujubes; the pink bars represent metabolism, the blue-violet bar represents genetic
  information processing, and the green bars represent environmental information processing.
  (D) KEGG enrichment analysis of differentially accumulated phytohormones between
  ‘Yueguang’ and ‘Hongguang’ jujubes; the blue-violet bars represent metabolism, and
  the green bars represent environmental information processing. (E) The contents
  of 6 differentially accumulated phytohormones in ‘Longzao’ and ‘Boguang’ jujubes;
  (F) The contents of 6 differentially accumulated phytohormones in ‘Yueguang’ and
  ‘Hongguang’ jujubes'
