figure_title: The regulatory network of cuproptosis in vascular calcification (VC).
caption: 'The regulatory network of cuproptosis in vascular calcification (VC). The
  cuproptosis and VC are linked by cuprooptosis-specific and related expressed genes,
  atherosclerosis, ferroptosis, and reactive oxygen species (ROS). Copper ions enter
  cells via copper transporter 1 (CTR1) and can activate multiple signaling pathways
  that lead to cuproptosis. Cuproptosis directly contributes to VC through two primary
  downstream pathways: (i) Mitochondrial proteotoxic stress driving osteogenic signaling:
  Copper-induced aggregation of lipoylated proteins and Fe-S cluster destabilization
  trigger mitochondrial proteotoxic stress. This results in a burst of mitochondrial
  ROS, which directly activates pro-osteogenic pathways (BMP-2); (ii) Direct activation
  of pro-calcific kinases: Intracellular copper ions directly activate key signaling
  cascades, including MAPK/ERK1/2 and PI3K/Akt/mTOR, which are known to phosphorylate
  and activate transcription factors driving the osteogenic transition of vascular
  smooth muscle cells (VSMCs)'
