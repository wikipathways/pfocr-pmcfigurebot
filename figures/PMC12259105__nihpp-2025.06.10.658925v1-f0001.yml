figure_title: BCAAs feed the TCA cycle in healthy pancreatic acinar cells but not
  in PDA cells
caption: a, Pathway of BCAA catabolism, highlighting key enzymes (BCAT2, BCKDH Complex
  including DBT, BCKDK) and a pharmacological BCKDK inhibitor, BT2. b, Diagram depicting
  PanIN formation via KRAS mutation following acinar-to-ductal metaplasia (ADM), followed
  by a second genetic mutation like Trp53 that leads to the development of frank PDA.
  c, Tracing schematic for [U-13C]-BCAA incorporation into TCA cycle intermediates
  showing entry of labelled carbons can via acetyl-CoA (red circles) and succinyl-CoA
  (blue circles). d-i. Molar percent enrichment (MPE) of malate and citrate in a panel
  of PDA murine and human PDA cell lines and primary mouse acinar cells after 6-hour
  incubation of either [U-13C]-BCAAs (valine, isoleucine, leucine), [U-13C]-glutamine,
  or [U-13C]-glucose, measured by GC-MS (n=3 biological replicates per cell line).
  MPE refers to the % of each isotopologue relative to the total metabolite pool after
  correcting for 13C natural abundance. Data are presented as mean ± s.e.m
article_title: Opposing effects of systemic and pancreas-specific inhibition of BCKDK
  on pancreatic carcinogenesis
