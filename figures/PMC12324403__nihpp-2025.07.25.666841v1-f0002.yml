figure_title: Loss of Nf1 affects metabolism via a neuronal MEK/ERK-dependent mechanism
caption: '(A) Diagram of the respirometry setup used to measure metabolic rate via
  CO2 production. (B) Normalized CO2 production in genomic nf1P1 mutant and wCS10
  control males and females. **p < 0.05, ***p < 0.001 (Šidák, n = 6 males; n = 5 females).
  (C) Normalized CO2 production in flies with Nf1 knockdown in metabolism-regulating
  PCB-Gal4+ neurons compared to heterozygous Gal4/+ and UAS/+ controls. ***p < 0.001
  re: both controls (Šidák, n = 5). (D) Diagram showing the MAPK arm of the Nf1/Ras
  signaling pathway. Green arrows represent the direction of signaling change following
  loss of Nf1. Red X marks show the molecules targeted for in vivo genetic analyses
  in panels E-F. (E) CO2 production (arbitrary units; AU) in flies harboring RNAi
  targeting Nf1, MEK, or both, along with controls. ***p < 0.001; n.s.: not significant
  (Šidák, n = 8). (F) CO2 production in flies harboring RNAi targeting Nf1, ERK, or
  both, along with controls. **p < 0.01, ***p < 0.001; n.s.: not significant (Šidák,
  n = 10–12)'
article_title: Metabolic and behavioral effects of neurofibromin result from differential
  recruitment of MAPK and mTOR signaling
