figure_title: MEN1 gene knockout and the menin-MLL1 interaction inhibition affect
  similar signaling pathways in HCC
caption: (A) Immunoblotting against menin and β-Actin proteins in HLF and PLC/PRF/5
  knockout (KO) and NTC cells.(B) Logarithmic fold changes between MEN1 KO relative
  to NTC and SNDX-5613 treatment relative to DMSO from RNA-seq of HLF or PLC/PRF/5
  cells.(C) Heatmap of differentially expressed genes in HLF and PLC/PRF/5 cells with
  MEN1 or NTC KO or treated with SNDX-5613 or DMSO.(D) UpSet diagrams showing commonly
  up- and downregulated genes in HLF and PLC/PRF/5 cells treated with SNDX-5613 or
  upon MEN1 KO.(E) GSEA ontologies with hallmark gene set as a reference affected
  by SNDX-5613 treatment and MEN1 KO in HLF and PLC/PRF/5 cells.(F) GSEA analysis
  of gene expression changes in HLF or PLC/PRF/5 cells treated with SNDX-5613 with
  PI3K/AKT/mTOR signaling pathway from the hallmark gene set.(G) Logarithmic fold
  changes in gene expression and in menin and MLL1 binding to these genes in HLF cells
  treated with SNDX-5613.(H) Logarithmic fold changes in gene expression depending
  on menin-MLL1 binding in HLF cells treated with SNDX-5613
