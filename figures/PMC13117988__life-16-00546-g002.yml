figure_title: Proposed perioperative risk assessment and management pathway for adverse
  events associated with oral 5-ALA guided PDD-TURBT.
caption: 'Proposed perioperative risk assessment and management pathway for adverse
  events associated with oral 5-ALA guided PDD-TURBT. The flowchart summarizes practical
  evaluation and mitigation strategies for the main clinically relevant adverse events
  reported with oral 5-ALA during TURBT, including hypotension, transient hepatic
  enzyme elevations, and photosensitivity. Key patient and perioperative factors (for
  example, advanced age, baseline blood pressure, antihypertensive regimens such as
  renin-angiotensin system inhibitors, and anesthesia plan) are incorporated to guide
  perioperative planning and postoperative monitoring. The overall goal is to optimize
  perioperative safety and facilitate timely discharge in the short-stay TURBT setting.
  Abbreviations: 5-ALA, 5-aminolevulinic acid; PDD, photodynamic diagnosis; TURBT,
  transurethral resection of bladder tumor; AE, adverse event; BP, blood pressure;
  SBP, systolic blood pressure; RAS, renin-angiotensin system; ACEi/ARB, angiotensin-converting
  enzyme inhibitor/angiotensin receptor blocker; LFTs, liver function tests'
