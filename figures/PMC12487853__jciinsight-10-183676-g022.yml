figure_title: CEACAM1 restrains the suppressive function of human Tregs in vivo
caption: (A) The in vitro suppressive activity of scramble and CEACAM1KO Tregs on
  day 5 after electroporation (n = 3; mean ± SEM). (B–D) Irradiated NSG mice were
  adoptively transferred with PBMCs or in combination with scramble or CEACAM1KO Tregs
  (n = 10–14). xGVHD was assessed by body weight (B), clinical scores (C), and survival
  (D). (E and F) Blood was collected on day 7, 14, 21, and 28 after transplantation.
  CEACAM1 expression (E) and human Treg number (F) were measured by flow cytometry
  (n = 14). (G and H) On day 36, spleens were analyzed for CEACAM1 expression by Tregs
  and cell numbers of the indicated cell populations (G) and Ki67 expression by human
  Tregs (H) (n = 5). (I and J) RNA-Seq of donor control and CEACAM1KO human Tregs
  before transplantation. (I) Volcano plot illustrating CEACAM1-activated and -repressed
  genes. DEGs with an expression difference of ≥1.25-fold and FDR value of <0.05 are
  colored in red. (J) Hallmark pathway analysis of DEGs. Data (B–H) are from 2 independent
  experiments and are analyzed using AUC with 1-way ANOVA (B and C), log-rank (Mantel-Cox)
  test (D), 2-way ANOVA with multiple comparisons (E and F), and unpaired 2-sided
  t test (G and H); *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001
article_title: BLIMP-1 and CEACAM1 cooperatively regulate human Treg homeostasis and
  function to control xenogeneic GVHD
