caption: HWE suppressed LPS-induced inflammatory responses via the JAK1/STAT3 pathway.
  RAW 264.7 macrophages were pre-treated with 2.5 mg/ml of HWE or 5 μM DEX for 1 h,
  followed by stimulation with 500 ng/ml of LPS. (A) Representative western blot images
  for p-JAK1, JAK1, p-STAT3, STAT3, and α-tubulin. (B) Relative protein expression
  levels of p-JAK1 and p-STAT3 were quantified using densitometry and normalized to
  their total protein levels (JAK1 and STAT3). The normalized values are presented
  relative to the LPS-stimulated group. The error bars represent the mean ± SD (n
  = 3). **P < 0.01 vs. LPS-stimulated group
article_title: Anti-inflammatory effects of Hericium erinaceus hot water extract via
