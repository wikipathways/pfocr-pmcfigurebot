figure_title: Sensory input pathways to Output and MG cells
caption: 'A, Main cell types synapsing onto Output and MG cells (excluding MG cells
  and synapses formed in the molecular layer). B, Visualization of the soma locations
  of all reconstructed Output (42 OFF and 46 ON) and MG (67 MG− and 69 MG+) cells
  in the EM volume. Plane shows the boundary between the plexiform (plex) and ganglion
  (ggl) layers. Arrows show the locations of the 4 cells used for targeted reconstructions
  of presynaptic partners shown in C and D. C, Left: locations of example Output ON
  and OFF cells used for targeted reconstructions of presynaptic partners. Middle:
  all categorized presynaptic partners (excluding MG) to the Output ON cell (n = 240
  total synapses from SG−, SP−, and EAF neurons; 574 total synapses were annotated,
  with 15% of those synapses from MG cells that will be analyzed separately and 43%
  unclassified). Right: all categorized presynaptic partners (excluding MG) to the
  Output OFF cell (n = 363 total synapses from SG+ and Gr+ neurons; 530 total synapses
  were annotated, with 8% of those synapses from MG cells that will be analyzed separately
  and 23% unclassified). D, Left: locations of the MG+ and MG− cells used for targeted
  reconstructions of presynaptic partners. Middle: all categorized presynaptic partners
  (excluding MG) to the MG+ cell (n = 238 total synapses from SG−, SP−, and EAF neurons;
  460 total synapses were annotated, with 11% of those synapses from MG cells that
  will be analyzed separately and 37% unclassified). Right: all categorized presynaptic
  partners (excluding MG) to the MG− cell (n = 217 total synapses from SG+ and Gr+
  neurons; 355 total synapses were annotated, with 10% of those synapses from MG cells
  that will be analyzed separately and 29% unclassified). E, Number of synapses from
  each cell type onto individual Output and MG cells (n = 2838 total synapses from
  925 SG, SP−, Gr+, and EAF neurons; 5003 total synapses were annotated, with 10%
  of those synapses from MG cells that will be analyzed separately and 33% unclassified).
  Cells are ordered along the horizontal axis by the number of inputs from Gr+ (decreasing)
  and then SP− (increasing). Complete reconstructions of all presynaptic partners
  were made for one cell of each type. Reconstruction of a random subset of presynaptic
  partners were performed for additional example cells of each type. Pie charts show
  the fraction (and total number) of synapses from each cell type onto all ON, OFF,
  MG+ and MG− cells represented in the bar graphs. F, Observed connectivity from EAF,
  Gr+, SP−, SG+, and SG− to Output cells compared with that expected from random connectivity
  applied to the 10 output cells (5 ON, 5 OFF) shown in E. Each entry corresponds
  to input from the cell type shown on the horizontal axis given that the postsynaptic
  cell receives at least one synapse from the cell type shown on the vertical axis
  (see Methods). Presynaptic cell types are grouped along these axes according to
  their responses inferred from connectivity and/or known from previous in vivo recordings.
  Two clusters (illustrated with dotted lines) are observed among the input cell types,
  corresponding to the ON and OFF pathways. G, same as in F for the 10 MG cells (5
  MG−, 5 MG+) shown in E'
