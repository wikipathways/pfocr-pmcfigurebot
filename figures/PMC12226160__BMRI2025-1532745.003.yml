figure_title: Potential target and target cells for cervical cancer treatment.
caption: Potential target and target cells for cervical cancer treatment. Cervical
  cancer treatment involves a multifaceted approach targeting various cells and pathways.
  Targeted therapy focuses on blocking CEACAM5 on HPV-related cancer cells and inhibiting
  immune checkpoints (PD-L1, CTLA4, LAG3, and PDCD1) on CD8+ T cells. The NRG1/ERBB3
  pathway and cancer stem cells (CSCs) are also targeted. Immunotherapy strategies
  include blocking TIGIT and PD-1 on CD8+ T cells for ADC and inhibiting CD96 on T
  cells for SCC. Radioresistance is addressed by targeting USP7 on cervical cancer
  cells. Antiangiogenesis is achieved by inhibiting FLT-1 and VEGF on cancer cells.
  Metastasis is prevented by targeting C1QA + MRC1High macrophages. Immune modulation
  involves stimulating CTSH and IL-17A on TH17 cells to enhance antitumor immunity.
  (Red arrows represent stimulation, blue arrows represent inhibition, and black arrows
  indicate direction or movement.)
