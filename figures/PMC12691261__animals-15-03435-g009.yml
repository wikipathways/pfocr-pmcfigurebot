figure_title: Joint analysis of differential genes and differential metabolites.
caption: Joint analysis of differential genes and differential metabolites. (A) Clustered
  heatmap of correlation coefficients between differentially expressed genes (DEGs)
  and differential metabolites (DMs). The heatmap visualizes the Pearson correlation
  coefficients, demonstrating coordinated changes between the transcriptomic and metabolomic
  profiles. (B) Venn diagram identifying shared KEGG pathways. The diagram illustrates
  the intersection of KEGG pathways significantly enriched by DEGs and DMs, highlighting
  biological processes commonly perturbed at both molecular levels. (C) Bar plot of
  KEGG pathway enrichment. The bar chart displays the top significantly enriched KEGG
  pathways common to both DEGs and DMs. The x-axis represents the rich factor, while
  the y-axis lists the pathway names. (D) Correlation network of DEGs and DMs within
  four key pathways. The network depicts the interactions between DEGs (rectangular
  nodes) and DMs (circular nodes) within four selected pathways. Edges represent significant
  correlations, highlighting potential regulatory relationships. Solid blue lines
  indicate negative correlations and solid red lines indicate positive correlations
