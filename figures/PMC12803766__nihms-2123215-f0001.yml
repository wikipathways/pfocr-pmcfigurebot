figure_title: STMN2 undergoes rapid turnover in two cellular systems, primarily via
  the ubiquitin-proteasome pathway
caption: 'A. Design of doxycycline-inducible STMN2 constructs with a V5 tag. Top:
  Canonical STMN2 amino acid sequence (Q93045) with the Stathmin-like domain (SLD)
  in blue, palmitoylatable cysteines (C22, C24) in bold green, and phosphorylatable
  serines (S50, S62, S73, S97) in bold orange. Bottom: Schematic of constructs. Palmitoylation
  sites are shown in green; abolished palmitoylation sites (C→S) in muted magenta.
  Phosphorylation sites are indicated by vertical orange lines. Non-phosphorylatable
  mutants (S→A, “4A”) are in magenta; phosphomimetic mutants (S→D, “4D”) are in blue.B.
  Western blot of CHX chase assay in U2OS cells with inducible STMN2-V5 expression.
  Expression was induced overnight with doxycycline, then media was replaced with
  fresh or CHX-containing media (time 0). ~35 μg of whole cell lysate loaded per lane.
  Left: STMN2 detected with anti-V5 antibody. Right: Background-subtracted band intensities
  normalized to time 0 and plotted vs. chase time (n = 4, mean ± SD).C. Peptide coverage
  map of STMN2 from ~23 kDa (upper) and ~21 kDa (lower) gel bands following V5 IP
  from U2OS lysates. Expression was induced for 16 hours. The IP sample was separated
  by SDS-PAGE, and two bands at approximately 21 kDa and 23 kDa were excised and submitted
  for proteomic analysis. Each residue is a vertical bar; color intensity indicates
  normalized peptide spectral intensity (XCorr). The top and bottom rows correspond
  to peptides from the upper (23 kDa) and lower (21 kDa) bands, respectively. Yellow
  highlights the fragment absent from the 21 kDa band.D. Timeline for stem-cell-derived
  neuron experiments. Neuronal transcription factor NGN1 was induced for 3 days with
  doxycycline; CHX chase assay performed on day 3 post-plating.E. CHX chase assay
  of endogenous STMN2 in transcription-factor-induced iPSC-derived neurons (iNs).
  Time 0 = CHX addition. ~70 μg lysate loaded per lane. Left: STMN2 detected with
  home-made polyclonal rabbit anti-STMN2 antibody. Right: the intensity of STMN2 bands
  was measured after background subtraction, plotted vs. chase time (n = 4, mean ±
  SD).F, H. Westen blot of CHX chase assay along with 10 μM Autophinib, 200 nM Bafilomycin
  A1, 5 μM MG132, or 200 nM TAK-243 in STMN2-V5 expressing U2OS cells (F) or iNs(H).
  CHX-only controls (left/right) are from the same experiment and loaded twice.G,
  I. Quantification of STMN2-V5 in U2OS cells (G) or endogenous STMN2 in iNs (I) from
  three independent replicates per drug treatment. For each experiment, band intensities
  were normalized to time 0 hr; treatments compared to CHX-only by t-test (*P < 0.05,
  **P < 0.005). Error bars = SD'
