caption: 'Comparative effects of 1, 4, and 5 in U87 cells determined by RNA-Seq: (a)
  Comparative analysis of DEGs across all three treatments. Top downregulated genes
  relevant to lipid metabolism and cholesterol biosynthesis are colored white. (B)
  Analysis of genes in the mevalonate pathway revealed that several genes are significantly
  downregulated by 4 and 5. These included FDPS, a result verified by q-PCR. Error
  bars represent standard error, n = 3. Statical significance was determined using
  ordinary one-way ANOVA, **** = p-value <0.0001. (C) Analysis of significant gene
  ontology terms and pathways down-regulated by 4 and 5'
