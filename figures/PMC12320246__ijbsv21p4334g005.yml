figure_title: OLFML1 promotes the proliferation and stemness of colorectal cancer
  cells by activating the hedgehog signaling pathway.
caption: 'OLFML1 promotes the proliferation and stemness of colorectal cancer cells
  by activating the hedgehog signaling pathway. A Western blots assays demonstrate
  the effect of silencing OLFML1 on expression of Hedgehog pathway markers in CRC
  cells. B The GLI1 protein expression in nuclear of the indicated CRC cells was detected
  by western blotting. The quantification of nuclear GLI1 was normalized to H3. C,
  D Colony formation assays were performed in CRC cells treated with Vector, OLFML1
  overexpression, and both OLFML1 overexpression and GLI1 inhibitors (GANT61). E,
  F The in vitro limiting dilution assay showed that OLFML1 increases the formation
  proportion of CSC spheres, simultaneously treat with GANT61 reverses this effect
  (n = 12), likelihood ratio test. G Tumor sphere formation assays indicate that OLFML1
  enhances the formation of CSC spheres, simultaneously treat with GANT61 reverses
  this effect (n = 3). Data information: Graphs report mean ± SD. Significance was
  assessed using 2-tailed Student''s t-test. ***P< 0.001, **P< 0.01, *P< 0.05'
