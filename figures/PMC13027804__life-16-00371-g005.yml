figure_title: Trastuzumab–bemcentinib combination significantly downregulates hedgehog
  and stemness genes in SKBR3 parental and resistant cell lines.
caption: Trastuzumab–bemcentinib combination significantly downregulates hedgehog
  and stemness genes in SKBR3 parental and resistant cell lines. Hedgehog pathway-responsive
  gene expressions in the presence of trastuzumab, bemcentinib monotherapy, and combination
  therapy (A) in SKBR3 parental cells and (B) resistant cells. Stemness-responsive
  gene expressions in the presence of trastuzumab, bemcentinib monotherapy, and combination
  therapy (C) in SKBR3 parental cells and (D) in resistant cells. Hedgehog pathway-responsive
  gene expressions in the presence of trastuzumab, bemcentinib monotherapy, and combination
  therapy (E) in SKBR3 parental cells and (F) in resistant cells. Stemness-responsive
  gene expressions in the presence of trastuzumab, bemcentinib monotherapy, and combination
  therapy (C) in SKBR3 parental cells, (D) in resistant cells, (G) in HCC1954 parental
  cells, and (H) in resistant cells. Two-way ANOVA followed by Tukey’s multiple comparisons
  post hoc test was used to determine statistical significance. Parental (P) and resistant
  (R) cell lines are indicated. Data are presented as mean ± SD (n = 3). * p ≤ 0.05
