figure_title: Quantitative mechanistic attribution analysis for the S.
caption: 'Quantitative mechanistic attribution analysis for the S. baicalensis  →
  NLRP3 prediction. The bar chart ranks the contribution of different signaling pathways
  based on the model′s internal attention weights (α). Color intensity reflects the
  magnitude of contribution: dark blue bars represent primary high-confidence driver
  pathways (e.g., NF-κB, α=0.852), while light blue bars indicate secondary supporting
  pathways (e.g., IL-17 signaling, α=0.450). These prioritized pathways align with
  the established anti-inflammatory mechanisms of Huangqin. Light grey bars denote
  noise pathways receiving negligible attention (e.g., ribosome biogenesis, α=0.021).
  The dashed line represents the noise threshold, highlighting the model′s discriminative
  power in isolating specific therapeutic mechanisms'
