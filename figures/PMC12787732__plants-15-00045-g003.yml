figure_title: Genes encoding enzymes in the jasmonate pathway are wound-induced.
caption: 'Genes encoding enzymes in the jasmonate pathway are wound-induced. At the
  four true leaf stage, individual pepper (Capsicum annuum) plants were either left
  undamaged (n = 4) or wounded (n = 4) on the second set of fully unfurled leaves
  using a hole-punch, removing approximately 12% of the leaf, avoiding the midvein.
  Foliar gene expression over a 6 h time course was measured by RNA-Seq, and wound-induced
  genes were identified by DESeq2 (Padj ≤ 0.05). (Supplemental Table S3A,B). (A) General
  jasmonate biosynthetic pathway; (B) Heatmaps visualizing wound-induced expression
  of genes encoding jasmonate biosynthetic enzymes. Heatmaps represent the Z-score,
  with red indicating highly expressed genes. Abbreviations: phospholipases (PLA),
  lipoxygenase (LOX), allene oxide synthase (AOS), allene oxide cyclase (AOC), (12S-13S)-epoxy-octadecatrienoic
  acid ((12S-13S)-EOT), 12-oxo-phytodienoic acid reductase (OPR). Figure created with
  BioRender (https://www.biorender.com/)'
