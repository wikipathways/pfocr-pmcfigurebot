figure_title: Wnt and SHH ligands are secreted from epidermal cells, creating gradients
  of pathway activation in underlying dermal cells.
caption: Wnt and SHH ligands are secreted from epidermal cells, creating gradients
  of pathway activation in underlying dermal cells. SHH activation in the dermis further
  accelerates Wnt signaling, resulting in loss of GLI3 chromatin binding which is
  sufficient to cause cell cycle arrest. Concurrently, SHH activation in these high
  Wnt activity cells can induce DC marker genes, thereby coupling DC differentiation
  and cell cycle exit below the hair placode
article_title: Interaction of Wnt and SHH gradients synchronizes cell cycle exit and
  differentiation
