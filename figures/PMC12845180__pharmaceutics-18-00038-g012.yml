figure_title: Bioinformatic enrichment analysis of Sitagliptin and Doxorubicin targets.
caption: Bioinformatic enrichment analysis of Sitagliptin and Doxorubicin targets.
  (A) GO Biological Process enrichment of shared Sitagliptin–Doxorubicin target genes,
  demonstrating significant enrichment in apoptosis, cell migration, invasion, and
  oxidative stress processes. Dot size represents the number of genes associated with
  each term, and the x-axis indicates −log10(p-value). (B) KEGG pathway enrichment
  analysis showing PI3K/Akt, MAPK, and ECM–receptor interaction as major pathways
  regulated by both drugs. Dot size corresponds to gene count within each pathway.
  These analyses support that Sitagliptin and Doxorubicin synergistically modulate
  key signaling networks involved in proliferation, survival, and metastasis. In both
  panels (A,B), the x-axis represents the −log10-transformed p-values, where higher
  values indicate greater statistical significance
article_title: Sitagliptin Potentiates the Anticancer Activity of Doxorubicin Through
