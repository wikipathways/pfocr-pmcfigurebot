caption: A multifunctional MOF-based nanocomposite (ICG@Uio-66-UBI) was developed
  by modifying MOFs (Uio-66-NH2) with an antimicrobial peptide (UBI29-41) to remove periodontal
  plaque biofilms. UBI29-41 could target both lipopolysaccharide (LPS) and lipoteichoic
  acid (LTA) on the surface of bacteria through electrostatic interactions. Meanwhile,
  the MOFs generated ROS under 808-nm near-infrared irradiation, disrupting bacterial
  cell membranes and inhibiting biofilm formation. Subsequently, the interaction between
  UBI29-41 and LPS could inhibit NF-κB signaling pathway activation. Furthermore,
  the nanocomposite significantly down-regulated the activity of the LuxS/AI-2 quorum
  sensing system and the expression of related genes
article_title: Antimicrobial peptide-targeted photodynamic therapy for preventing
  periodontal plaque biofilm formation through the disruption of quorum sensing system
