figure_title: The lack of CD301b is associated with a strong inflammatory immune signature
  in the breast TMEA
caption: Heatmap showing differentially expressed genes (DEGs) identified by RNA-seq
  from tumors in Mgl2 KO and WT mice. The blue and red bands indicate low and high
  gene expression quantity, respectively. Biological replicates showed the highest
  degree of correlation. B. Gene Set Enrichment Analysis (GSEA) of Hallmark pathways
  reveals immune-related and cancer-associated pathways, all of which are upregulated
  in Mgl2 KO. C. GSEA of KEGG pathways shows immune-related and cancer-associated
  pathways, and they are all upregulated in Mgl2 KO. D. Volcano plot showing the pathway-associated
  genes (from panels B and C). The genes with a log₂ fold change of 2 or greater are
  highlighted in purple. The X-axis represents log₂-transformed fold change, and the
  Y-axis represents −log10-transformed significance. The VENN diagram shows the distribution
  of genes between Hallmark and KEGG gene sets. E. Volcano plot of DEGs between tumors
  from Mgl2 KO and WT mice. Red points indicate upregulated DEGs, blue points indicate
  downregulated DEGs, gray points represent non-significant genes, and purple points
  indicate the pathway-associated genes (from panel D). All the genes with a log₂
  fold change ≥ 2 are labeled
