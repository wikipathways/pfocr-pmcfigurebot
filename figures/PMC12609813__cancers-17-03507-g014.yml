figure_title: Mechanism of PFOS-mediated epigenetic perturbation in BCa.
caption: Mechanism of PFOS-mediated epigenetic perturbation in BCa. The figure illustrates
  how PFOS exposure induces epigenetic reprogramming through alterations in DNA methylation
  (5mC) and histone modifications. These changes disrupt the expression of genes regulating
  cell adhesion molecules such as β-integrin, E-cadherin, and occludin, compromising
  extracellular matrix integrity. The resulting epigenetic dysregulation hijacks cell
  growth signaling pathways such as ERK, AP-1, Cylin D1, and CDK4, promoting uncontrolled
  proliferation and contributing to BCa progression. Generated with BioRender (https://app.biorender.com,
  accessed on 29 October 2025)
