caption: Gene Ontology enrichment analysis of medicarpin targets in ovarian cancer.
  (A) Biological process enrichment showing significant modulation of phosphorylation,
  apoptosis, and cellular response pathways. (B) Cellular component enrichment indicating
  localization to PI3K and CDK complexes, membrane rafts, and chromosomal regions.
  (C) Molecular function enrichment highlights kinase activity, ATP binding, and nucleotide
  binding as key molecular features. Bubble size represents the number of genes, and
  the color scale indicates −log10(FDR)
