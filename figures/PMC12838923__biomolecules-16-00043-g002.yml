figure_title: Neuroprotective effects of exercise-induced lactate and related mechanisms.
caption: 'Neuroprotective effects of exercise-induced lactate and related mechanisms.
  (A) The activation of the lactate/GPR81 pathway by physical exercise has been demonstrated
  to promote neurogenesis [43]. This process may be related to the Akt/PKB signaling
  pathway. Furthermore, the process of exercise-induced lactate shuttling has been
  demonstrated to regulate histone lactylation, thereby influencing the proliferation
  of NSCs through the MDM2-p53 signaling pathway [9]. (B) Physical exercise has been
  observed to activate the lactate/GPR81/ERK1/2 pathway, thereby enhancing synaptic
  plasticity [44]. In addition, lactate has been observed to induce the activation
  of the SIRT1/PGC-1α/FNDC5/BDNF pathway, which further contributes to improved synaptic
  plasticity [45]. (C) The lactate/GPR81/ERK1/2 signaling pathway, which is activated
  by exercise, has been demonstrated to increase the number of hippocampal mitochondria.
  This phenomenon has been demonstrated to support oxidative phosphorylation, ATP
  production, mitochondrial biogenesis, and fusion [44]. Furthermore, the activation
  of PGC-1α by exercise has been linked to lactate signaling [46]. (D) Physical exercise
  has been shown to induce H3 histone lactylation in microglia, thereby suppressing
  their pro-inflammatory polarization [47]. (E) Physical exercise has been observed
  to stimulate lactate/GPR81/ERK1/2-PI3K/Akt signaling in brain outer membrane fibroblasts,
  thereby promoting cerebral angiogenesis [48]. Additionally, it has been demonstrated
  that physical exercise enhances angiogenesis through the activation of pathways
  such as Akt/eNOS/VEGF, which are critical for vascular development and repair [49].
  This figure was created using BioRender (https://app.biorender.com/, accessed on
  24 November 2025). Abbreviations: ↑, increase or activation; ⊥, decrease or inhibition;
  Akt, protein kinase B; Arc, activity-regulated cytoskeleton-associated protein;
  ARG1, Arginase-1; ATP, adenosine triphosphate; ATP5A1, ATP synthase, H+ transporting,
  mitochondrial F1 complex, α subunit 1; BDNF, brain-derived neurotrophic factor;
  c-Fos, c-fos proto-oncogene; COX5B, cytochrome c oxidase subunit 5B; DCX, doublecortin;
