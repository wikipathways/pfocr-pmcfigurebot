  receptor 81; IL, interleukin; MCT, monocarboxylate transporters; NDUFS8, NADH dehydrogenase
  (ubiquinone) Fe-S protein 8; NRF1, nuclear respiratory factor 1; NSC, neural stem
  cell; PGC-1α, peroxisome proliferator-activated receptor γ coactivator 1α; PI3K,
