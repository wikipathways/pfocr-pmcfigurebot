figure_title: FPR1 mediates AKT and ERK1/2 phosphorylation to enhance NK cell efficacy
caption: '(A) Tumor growth curves and weights in PARPi-treated tumor-bearing mice
  coadministered with CypA inhibitor CsA and FPR1 inhibitors CsH and HCH6-1; N = 6
  per group; scale bars: 1 cm (B) Tumor growth curves and weights in C57BL/6 mice
  bearing RM-1 tumors treated with FPR1 agonist fMIFL or inhibitor HCH6-1; N = 5 per
  group; scale bars: 1 cm (C and D) IFN-γ and GZMB expression levels in TINKs (C)
  and their quantification (D) under HCH6-1 or fMIFL treatment; N = 5 per group. (E)
  Western blot analysis of ERK- and AKT-related pathway activation in NK cells treated
  with CypA, CsA, CsH, or HCH6-1 in vitro. (F and G) Flow cytometry analysis of IFN-γ
  and GZMB expression (F) and quantification (G) in NK cells treated with FPR1 inhibitor
  CsH, AKT inhibitor MK-2206, or ERK inhibitor SCH772984; N = 5 per group. (H) Transmission
  electron microscopy images showing mitochondrial structure and crista alterations
  in NK cells stimulated with CypA. Scale bars: 1 μm. (I) Statistical analysis of
  mitochondrial number (N = 10) and crista count (N = 15) in NK cells. Tumor growth
  curve data are presented as mean ± SD and were analyzed by 2-way ANOVA with Tukey’s
  multiple-comparison test. Other data are presented as mean ± SEM and were analyzed
  by 1-way ANOVA (A, B, D, and G) and Welch’s t test (I)'
article_title: PARP inhibitors restore NK cell function via secretory crosstalk with
  tumor cells in prostate cancer
