figure_title: Lipid A biosynthesis and non-radioactive LpxH activity assays
caption: (A) The Raetz pathway of lipid A biosynthesis. (B) Accumulation of lipid
  X in psgA-/psgB1-deficient E. coli. Left panel shows lipids from WT strain, whereas
  the right panel shows lipids from the psgA-/psgB1-deficient strain. Accumulation
  of lipid X is indicated with a red circle. Adapted from the original image by Nishijima
  et al. (ref. 10). (C) LpxH activity can be detected either through phosphate release
  via an AaLpxE-coupled malachite green assay (purple path) or through detection of
  UMP using the Promega UMP/CMP-Glo™ Glycosyltransferase Assay (green path). Modified
  from the original image by Lee et al. (ref. 30)
