figure_title: Mechanism of FNDC-5 cleavage and subsequent irisin-mediated effects
  on muscle cells.
caption: 'Mechanism of FNDC-5 cleavage and subsequent irisin-mediated effects on muscle
  cells. FNDC-5, a transmembrane protein, undergoes proteolytic cleavage to release
  the myokine irisin. Irisin then acts on muscle cells to promote mitochondrial biogenesis
  (mitogenesis) and enhance protein synthesis, contributing to improved muscle function
  and metabolic regulation. Myostatin, a negative regulator of muscle growth, inhibits
  this pathway, counteracting irisin’s anabolic effects. This schematic highlights
  the interplay between FNDC-5-derived irisin signaling and myostatin-mediated inhibition
  in skeletal muscle physiology. Abbreviations: FNDC-5, fibronectin type III domain-containing
  protein 5'
