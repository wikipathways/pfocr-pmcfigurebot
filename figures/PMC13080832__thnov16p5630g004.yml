caption: 'Transcriptome sequencing analysis of macrophages in an inflammatory microenvironment,
  with and without MTZ coculture. (A) Schematic diagram of the establishment of the
  LPS-induced inflammatory model and the subsequent experimental design. (B) PCA analysis.
  (C) Volcano plot of DEGs in macrophages. (D) Heatmap of DEGs between the control
  and MTZ groups. (E) GO enrichment analysis of DEGs. (F) Heatmap analysis of DEGs
  across various pathways. (G) KEGG enrichment analysis of DEGs. (H) GSEA analysis
  of significant DEGs in the control and MTZ groups. (I) Schematic diagram illustrating
  the potential mechanism by which MTZ modulates the immune microenvironment and promotes
  bone defect repair. A: Control group. B: MTZ group'
