figure_title: (A) Beta-catenin (green fluorescence) and non-phospho beta-catenin (red
  fluorescence) staining in the cornea of WT versus CD44KO mice.
caption: (A) Beta-catenin (green fluorescence) and non-phospho beta-catenin (red fluorescence)
  staining in the cornea of WT versus CD44KO mice. Wnt pathway seems to be downregulated
  in the absence of CD44. (B) Lrig1 (green fluorescence) is still expressed in CD44KO
  mouse cornea (upper panel). (C) Cell lineage tracing experiments in WT versus CD44KO
  mice. Red = Tomato was activated in Lrig1+ cells upon tamoxifen treatment (lower
  panel). Note that 100% of cells are red (Lrig1-derived cells) in WT animals already
  after 3 days, however in CD44KO animals only 70% of cells are red (Lrig1-derived
  cells) after 3 days, and 100% red after 7 days (Lrig1-derived compartment is in
  blue). No difference was observed after 14 days. WT and CD44KO transgenic mice expressing
  an inducible form of the Cre recombinase under the control of the Lrig1 promoter
  and a Cre reporter transgene coding for the tomato fluorescent protein were injected
  twice with 2 mg of tamoxifen in the first 24 h in order to induce the recombinase
  activity and to remove the codon stop that prevents the constitutive expression
  of the tomato protein in Lrig1 expressing corneal epithelial cells. Animals were
  killed at each timepoint after the tamoxifen injections. Eyes were fixed overnight
  in formalin and then included in Tissue-Tek OCT compound, Sakura Finetek Europe
  Alphen aan den Rijn, The Netherlands, and stored frozen. Cornea sections were further
  prepared with a cryostat (−20 °C), dried, and mounted on histological slides with
  the DAPI fluoromount -G(c) (SouthernBiotech, Birmingham, AL, USA). Scale bars =
  87 µm
article_title: Identification of Two Distinct Stem Cell Clusters, Lrig1-Derived and
  Wnt/CD44-Dependent, in Corneal Epithelium
