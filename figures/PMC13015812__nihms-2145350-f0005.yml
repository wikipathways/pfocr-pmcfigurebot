figure_title: Performance comparison of AI models for pathway information curation
  using precision, recall, and F1-score across 200 images.
caption: Performance comparison of AI models for pathway information curation using
  precision, recall, and F1-score across 200 images. (a) T-I evaluates correct predictions
  without considering the directionality of tumor signaling pathway images using the
  first evaluation data (60 images). (b) T-II assesses correct predictions while considering
  directionality using first evaluation data (60 images). (c) T-I evaluates correct
  predictions without considering directionality using the second evaluation data
  (140 images). (d) T-II assesses correct predictions while accounting for directionality
  using second evaluation data (140 images). The performance metrics highlight the
  predictive capabilities of GPT-4ov, Claude-3.5v, Gemini-1.5v, and Llama-3.2v across
  first and second evaluation image scenarios
