figure_title: Reactome pathway enrichment of histone phosphorylation-associated DEGs.
caption: Reactome pathway enrichment of histone phosphorylation-associated DEGs. (A)
  Upregulated histone phosphorylation-associated DEGs in D7 duodenum were enriched
  in metabolic regulation (pregnenolone biosynthesis), cell survival signaling (CD28-dependent
  PI3K/Akt, mTORC1), and apoptosis. (B) Downregulated histone phosphorylation-associated
  DEGs primarily involved DNA replication fidelity (polymerase switching, lagging
  strand synthesis, replication initiation), telomere dynamics (maintenance, C-strand
  extension), and mitotic control (APC/C phosphorylation, metaphase-anaphase transition).
  DEG, differentially expressed genes
