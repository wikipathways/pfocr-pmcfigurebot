  leads to a decrease in expression of eIF2B, and (B) an upregulation of ATF4, GADD34,
  and CHOP expression. (C) Pathway overview in which SARS-CoV-2 infection induces
  an upregulation of APOBEC3B, driving an increase in p-PKR and p-eIF2⍺, leading to
  a decrease in eIF2B and increases in ATF4, GADD34, and CHOP'
