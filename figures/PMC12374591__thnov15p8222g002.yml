caption: Roles of LILRBs in innate immunity, adaptive immunity, and tumor-immune crosstalk.
  (A) Distribution of LILRBs across innate immune cells (left; including dendritic
  cells (DCs), macrophages, myeloid-derived suppressor cells (MDSCs), neutrophils,
  and natural killer (NK) cells) and adaptive immune cells (right; including T and
  B lymphocytes). The diagram highlights associated ligands, signaling pathways, and
  immunomodulatory outcomes. (B) LILRB-mediated tumor-immune crosstalk. The left panel
  depicts tumor cell-derived ligands engaging LILRB-expressing immune cells, modulating
  anti-tumor responses. The right panel illustrates how tumor cells, upon stimulation
  by exogenous ligands, activate intracellular signaling pathways (e.g., SHP2/CaMK1,
  PI3K/AKT, MAPK, NF-κB, and JAK/STAT) to regulate tumor progression and immune evasion
