figure_title: Surface molecules and cargo composition of CAR-NK cell-derived exosomes.
caption: Surface molecules and cargo composition of CAR-NK cell-derived exosomes.
  The exosomal surface contains the chimeric antigen receptor (CAR) involved in tumor
  antigen recognition, along with activating receptors such as NKG2D and CD56, and
  pro-apoptotic ligands, TNF-related apoptosis-inducing ligand (TRAIL), and Fas ligand
  (FasL), which contribute to immune effector functions. Major histocompatibility
  complex class I (MHC I) and tetraspanins (CD9, CD63, CD81) are also expressed, common
  to exosome membranes and important for antigen presentation and cargo sorting. The
  internal cargo includes cytotoxic proteins granzyme A/B and perforins alongside
  immune cytokines TNF-α and IFN-γ, mediators of inflammation and tumor cell killing.
  The exosomes carry microRNAs (miRNAs) such as let-7b-5p, miR-146a-5p, miR-10b-5p,
  miR-92a-3p, and miR-99a-5p, which regulate multiple signaling pathways by downregulating
  ATM/ATR, Akt/mTOR, and JAK/STAT pathways, leading to cell cycle arrest via CDK6
  inhibition. Additionally, miR-186 enhances NKG2D and DNAM1 signaling, boosting NK
  activation. Therapeutic cargo loading of chemotherapeutics was previously explored,
  using paclitaxel, sorafenib, cisplatin, and doxorubicin, alongside miRNAs let-7a
  and miR-30 [229,246,248,249,250,251]
