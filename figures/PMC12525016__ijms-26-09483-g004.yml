figure_title: Translational pathway in monochorionic complications.
caption: Translational pathway in monochorionic complications. The flowchart shows
  the progression from molecular lesions (VEGF/RAS dysregulation, hypoxia/oxidative
  stress, maladaptive angiogenesis) to morphological features (vascular anastomoses,
  unequal placental sharing, regional perfusion imbalance). These changes lead to
  clinical consequences such as twin-to-twin transfusion syndrome (TTTS), twin anemia-polycythemia
  sequence (TAPS), and selective intrauterine growth restriction (sIUGR). Biomarkers
  include imaging markers (Doppler flow, middle cerebral artery peak systolic velocity
  [MCA PSV]) and candidate plasma microRNA panels under evaluation
