figure_title: Protective effects of exercise intervention against cisplatin-induced
  muscle atrophy.
caption: 'Protective effects of exercise intervention against cisplatin-induced muscle
  atrophy. Endurance exercise enhances mitochondrial biogenesis via PGC-1α, reduces
  ROS and inflammation, and restores metabolic balance. Resistance exercise activates
  Akt/mTOR signaling, promotes protein synthesis, inhibits degradation and excessive
  autophagy, leading to anabolic dominance. Combined exercise exerts synergistic benefits
  by integrating metabolic restoration and anabolic signaling. Together, these effects
  preserve muscle mass and attenuate cisplatin-induced atrophy. Arrows indicate regulation:
  ↑ upregulation/activation; ↓ downregulation/inhibition. Blue lines represent endurance
  pathways, green lines resistance pathways, and purple dashed lines synergistic interactions.
  PGC-1α, peroxisome proliferator-activated receptor gamma coactivator 1-alpha; ROS,
  reactive oxygen species; Akt, protein kinase B; mTOR, mechanistic target of rapamycin'
