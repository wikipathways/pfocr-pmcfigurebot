figure_title: A schematic model of HSV-1 infection in the RPE.
caption: 'A schematic model of HSV-1 infection in the RPE. (A) The viral replication
  cycle. (B) The viral infection induces ROS (reactive oxygen species). ROS promote
  NF-κB and β-secretase activation. NF-κB translocation to the nucleus induces IL-6
  synthesis and increases the synthesis of β-secretase. This enzyme cleaves APP (amyloid
  peptide), and Aβ is released. HSV-1 replicates in the RPE cell, and then the viruses
  are released. Solid line: pathway present in RPE. Dashed line: possible pathway
  for β-secretase activation'
