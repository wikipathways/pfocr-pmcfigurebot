caption: Simplified diagram of the MAPK pathway. Ligand binding RTKs (1) induces dimerization
  and autophosphorylation, recruiting adaptor proteins such as Grb2 and SOS to activate
  Ras (2). Active Ras triggers the Raf–MEK–ERK cascade (3), culminating in ERK activation
  and nuclear translocation, where ERK regulates transcription factors to drive gene
  expression for proliferation, differentiation, and metabolism (4). The arrow indicates
  a stimulating effect. The line ending with perpendicular bar indicates an inhibition
