figure_title: Mitochondrial DNA Repair Mechanisms in Response to Oxidative and Methylation-Induced
  Base Modifications
caption: 'Schematic representation of mitochondrial DNA repair pathways that address
  base modifications resulting from oxidative stress and methylation damage. (a) The
  mitochondrial base excision repair (BER) pathway featuring key components: bifunctional
  glycosylase OGG1, monofunctional glycosylase MUTYH, DNA polymerase gamma (POLG),
  Exonuclease G (EXOG), and DNA ligase 3 (LIG3). The sequential enzymatic steps of
  damage recognition, base excision, end processing, gap filling, and ligation are
  illustrated. (b) Differential susceptibility of mitochondrial DNA to oxidative damage
  based on nucleoid compaction status. Highly compact mitochondrial nucleoids demonstrate
  enhanced protection against oxidative lesions, highlighting the structural basis
  for genomic integrity maintenance in mitochondria under oxidative stress conditions'
