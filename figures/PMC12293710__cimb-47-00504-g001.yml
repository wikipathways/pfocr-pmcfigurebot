caption: Overview of the oxidative phosphorylation (OXPHOS) pathway within the mitochondrial
  inner membrane, highlighting the five multi-subunit enzyme complexes (I–V) responsible
  for ATP production. Electrons derived from NADH and FADH2 are transferred through
  complexes I–IV, generating a proton gradient that drives ATP synthesis at complex
  V (ATP synthase). Molecular oxygen (O2) serves as the terminal electron acceptor,
  forming water (H2O) at complex IV. Below each complex, nuclear and mitochondrial
  genes most commonly associated with mitochondrial disorders are listed. Mutations
  in these genes disrupt specific steps in the OXPHOS pathway, impairing ATP production
  and leading to energy deficits that particularly affect high-demand tissues such
  as the brain. Created with BioRender.com
