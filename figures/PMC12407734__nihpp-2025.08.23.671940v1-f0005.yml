figure_title: Loss of SMAD7 causes cell type-specific alterations in gene expression
caption: (A) The total number of differentially expressed genes (DEGs) up- and down-regulated
  in E11.5 endothelial cells (ECs), IAHC (other) cells, and pre-HSCs. (B) Venn diagrams
  showing overlap of up- and down-regulated genes in Smad7Δ/Δ cells for EC, IAHC (other),
  and pre-HSC populations. (C) Top 25 DEGs up- and down-regulated in Smad7Δ/Δ pre-HSCs.
  (D) Ribosome biogenesis score for Smad7f/f and Smad7Δ/Δ pre-HSCs using the average
  expression level of the ribosome biogenesis program and calculating a score using
  AddModuleScore in Seurat. (E) Pathways enriched in genes up- and down-regulated
  in Smad7Δ/Δ pre-HSCs determined by Reactome analysis
