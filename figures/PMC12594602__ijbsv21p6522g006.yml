figure_title: IAA inhibit NF-kB signaling pathway through AHR.
caption: 'IAA inhibit NF-kB signaling pathway through AHR. The representative tumor
  and mice morphologies. (A) Schematic diagram shows the experimental design, time
  line and treatment of the GC xenograft mice. (B) Representative FISH images of tumor
  tissues from PBS- and L. paracasei,-injected mice. (blue: nuclear, green: FITC,
  red: L. paracasei probe); scale bars, 100 μm. (C) Tumor growth curve of mice from
  mice injected PBS, IAA, CH223191 and CH223191+IAA. (D) The body weight curve of
  HGC27 xenograft injected with PBS, L. paracasei, IAA, CH223191 and CH223191+IAA.
  (E) Tumor weight of HGC27 xenograft. (F) Representative images of H&E staining of
  tumor tissues of HGC27 xenograft injected PBS, IAA, CH223191 and CH223191+IAA. scale
  bars, 100μm. (G) Ki-67 staining showed decreased proliferation rates in L. paracasei
  and IAA injected mice compaired with PBS, CH223191 and CH223191+IAA. scale bars,
  100μm. Lp, L. paracasei. (H) Western blot analysis of the inhibition of NF-kB of
  AGS and HGC27 treated with L. paracasei, and IAA. (I) Gene set enrichment analysis
  (GSEA) showing the enrichment of NF-kB signaling pathways. (J) The relative mRNA
  expression levels of IL-6 and TNF-ɑ in GC cells treated with PBS, L. paracasei,
  IAA (10μM) and Lp|ΔTrpA. (K) The relative protein expression levels of NF-kB signaling
  pathway. Lp, L. paracasei. Data in D, F, H, K and L were analyzed by two-way ANOVA;
  Means ± SD. ns p≧0.05, *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001'
