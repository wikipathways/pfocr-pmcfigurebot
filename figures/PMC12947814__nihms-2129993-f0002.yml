figure_title: The IL15 axis is upregulated in colonic Crohn’s disease (CD).
caption: The IL15 axis is upregulated in colonic Crohn’s disease (CD). (A) Bulk RNA
  sequencing data from 4 independent datasets showing that the expression of IL15
  (top row), IL15RA (middle row), and IL2RB (bottom row) are upregulated in the colon
  in CD. Patient groupings are presented at the bottom of each figure and cover active
  CD, healthy control subjects, and inflamed and uninflamed areas of the rectum. The
  Gene Expression Omnibus series numbers (GSE) for each dataset are shown. All P values
  are Bonferroni corrected. These datasets are available via a web interface (https://abbviegrc.shinyapps.io/ibdtransdb)
  that curates IBD sequencing datasets and generates figures based on queried genes
  and pathways of interest. W, week
