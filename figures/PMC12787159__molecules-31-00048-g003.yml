figure_title: Antioxidant mechanisms of flavonoids via single-electron transfer (SET)
  and hydrogen-atom transfer (HAT) pathways.
caption: Antioxidant mechanisms of flavonoids via single-electron transfer (SET) and
  hydrogen-atom transfer (HAT) pathways. Schematic representation of the major redox
  mechanisms by which flavonoids neutralize free radicals. In the SET mechanism, an
  electron (e−) is transferred from the flavonoid (F:H) to the radical (R), forming
  a protonated radical intermediate (F−H+) that subsequently donates a proton. In
  the HAT mechanism, the flavonoid directly donates a hydrogen atom (H) to neutralize
  the radical. The predominant pathway depends on the flavonoid’s ionization potential
  (IP) and bond dissociation enthalpy (BDE). Created with BioRender.com
