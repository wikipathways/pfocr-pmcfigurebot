figure_title: scRNA-Seq of aortas from Serpine1TA700/+ and Serpine1+/+ mice
caption: (A) UMAP plot showing the clustering of all cells sequenced from aortas of
  4 Serpine1TA700/+ mice (n = 2 males and n = 2 females) and 6 Serpine1+/+ mice (n
  = 3 males and n = 3 females). (B) UMAP plot showing the composition of sequenced
  cells from mice of each genotype. (C) Pathway enrichment analysis was done on genes
  overrepresented in total Serpine1TA700/+ and Serpine1+/+ cells using KEGG. (D–O)
  Violin plots showing log-normalized gene expression of Serpine1, Ccn1, and Itgb1
  in total cells, ECs, SMCs, and fibroblasts from mice of the 2 genotypes. The Mann-Whitney
  U test was used to test for significance in the differential expression of genes
  (D–O)
