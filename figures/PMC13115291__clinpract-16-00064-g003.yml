figure_title: CMV latency drives immunosenescence and systemic inflammaging through
  sustained immune remodeling.
caption: CMV latency drives immunosenescence and systemic inflammaging through sustained
  immune remodeling. This schematic illustrates the pathway linking latent cytomegalovirus
  (CMV) infection to immune aging and chronic inflammatory outcomes. Panel 1 (pale
  yellow) depicts CMV latency within myeloid and endothelial reservoirs, characterized
  by episomal persistence, low-level viral gene expression, and continuous antigenic
  stimulation that primes long-term immune engagement. Panel 2 (mustard) represents
  the central immune-remodeling hub, where persistent CMV exposure promotes expansion
  of senescent CD8+CD28− T cells (“memory inflation”) and functional immunosenescence.
  Viral immune-evasion mechanisms—including MHC-I downregulation (US2/3/6/11), UL18-mediated
  inhibitory signaling, and reduced NKG2D activation—modulate NK-cell responses and
  promote expansion of adaptive NKG2C+ NK cells. Together, these processes sustain
  chronic immune activation while limiting effective viral clearance. Panel 3 (deep
  amber) illustrates downstream systemic consequences, including elevated inflammatory
  mediators (IL-6, TNF-α, CRP), chronic low-grade inflammation, and increased risk
  of frailty, cardiometabolic dysfunction, and cognitive vulnerability. The left-to-right
  color gradient (pale yellow to deep amber) reflects progression from latent viral
  persistence to immune remodeling and inflammaging phenotypes. Arrows indicate the
  direction of progression and feedback interactions within the CMV-driven pathway.
  Downward (↓) arrows denote increases and decreases in expression or activity, respectively.
