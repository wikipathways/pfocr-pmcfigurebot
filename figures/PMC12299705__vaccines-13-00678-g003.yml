caption: A schematic diagram illustrating the proposed patomechanism of MF onset/progression
  induced by the SARS-CoV-2 mRNA vaccine. mRNA carried in the mRNA vaccine enters
  cells by endocytosis. After release from the endosome, mRNA is translated into proteins
  by ribosomes that are also secreted extracellularly. Spike (S) proteins bind to
  Toll-like receptors (TLRs), which are expressed on the cell surface, and subsequently
  activate the nuclear factor kappa-light-chain-enhancer of activated B cells (NF-κB)
  pathway and its target genes, resulting in the production of proinflammatory cytokines.
  Single-stranded RNA (ssRNA) and double-stranded RNA (dsRNA) vaccines, likewise,
  bind to TLRs in the endosome and activate the NF-κB signaling pathway and target
  genes. Various cytokine secretions, including IL-6, are initiated via the NF-κB
  pathway. IL-6 subsequently binds to its surface receptors, which results in activation
  of the JAK/STAT3 signaling pathway, leading to the transcription of STAT3 target
  genes that potentially promote cell proliferation, inflammation, cell survival,
  and angiogenesis
