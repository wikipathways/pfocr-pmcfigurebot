figure_title: Pathway dysfunction across AA subtypes and scalp regions.
caption: 'Pathway dysfunction across AA subtypes and scalp regions. The heatmap shows
  normalized enrichment scores (NES) for selected pathways across scalp comparisons:
  AAP NL vs. NC, LS vs. NL, LS vs. NC, and AT/AU LS vs. AAP LS. Red indicates activation,
  and blue indicates suppression in the listed comparisons. Asterisks denote significance
  (**** FDR < 0.001, *** FDR < 0.01, ** FDR < 0.05, and * FDR < 0.1). Pathways are
  color-coded by function: keratinization (green), immune (blue), regulatory (red),
  other (black) and metabolic (khaki)'
