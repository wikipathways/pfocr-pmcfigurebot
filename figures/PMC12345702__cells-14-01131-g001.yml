figure_title: Physiological and Pathological Functions of PSAP.
caption: 'Physiological and Pathological Functions of PSAP. The C-terminus of PSAP
  interacts with Sortilin in the cell, transporting PSAP to the lysosome to activate
  Cathepsins, where it is hydrolyzed and processed by Cathepsins into four sphingolipid-activating
  proteins, known as Sap A–D. In terms of physiological functions, PSAP can promote
  synaptic growth and development through regulating α-synuclein (α-Syn) homeostasis.
  It inhibits cAMP/PKA signaling via binding to GPR37/GPR37L1 receptors, which plays
  a neuroprotective role in the nervous system. PSAP/Sap C binds to LRP receptors
  and Gα-coupled receptors to activate ERK, sphingosine kinase (SK), and PI3K/Akt
  signaling pathways, which inhibit TNFα expression and exert anti-apoptotic effects.
  PSAP may regulate M2 macrophage function and facilitate lysosomal antigen processing.
  PSAP also contributes to the regulation of the reproductive system: the C-terminal
  domain of PSAP interacts with Rhox5 via MAPK and PI3K/Akt signaling pathways, participating
  in prostasomal development, spermatogenesis, and regulation of fertilization capacity.
  In terms of pathological functions, PSAP inhibits Gaucher disease (GD). It affects
  the progression of degenerative diseases such as Parkinson’s disease (PD) and Alzheimer’s
  disease (AD), atherosclerosis (AS), and tumor development. Created with BioRender.com.
  (Arrows indicate promotive effects. Blunted arrows indicate inhibitory effects.
  Blue arrows and blue blunted arrows indicate the biological roles of PSAP. Red arrows
  and red blunted arrows indicate pathological roles of PSAP)'
