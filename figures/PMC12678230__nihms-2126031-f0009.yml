figure_title: Heterologous reconstitution of parnafungin C (3) and parnafungin D (4).
caption: Heterologous reconstitution of parnafungin C (3) and parnafungin D (4). (A)
  The proposed biosynthetic pathway of 3 and 4. The more prominent diastereomers at
  C15a of compounds 3, 4 and 8 are fully characterized by NMR and HRMS. Compound 7
  could not be obtained in sufficient quantity for NMR characterization, but its HRMS,
  UV-vis spectrum (Figure S7), and biosynthetic relationship with 3 support its structural
  assignment. The stereochemistry of C5 is assigned based on the reported stereochemistry
  of the same carbon in 1.5 The stereochemistry of C15a in all compounds is not determined.
  (B) Heterologous reconstitution of 3 upon coexpression of ParTBF and ParX in ScRC01
  with 5. ParTBF converts 5 to 1 which is subsequently converted to 3 by ParX. (C)
  Heterologous reconstitution of 4 upon coexpression of ParTBF, ParX and ParU in ScRC01
  with 5. ParTBF converts 5 to 1 which is subsequently converted to 4 by ParX and
  ParU
