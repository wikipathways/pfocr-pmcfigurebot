figure_title: SERCA2 dysfunction causes mitochondrial impairment.
caption: SERCA2 dysfunction causes mitochondrial impairment. (A) The main signaling
  pathways from the Kyoto Encyclopedia of Genes and Genomes pathway enrichment analysis
  in aorta samples of WT and SKI mice under ldlr-/- background. (B) Heatmap for all
  the DEGs in oxidative phosphorylation pathway. (C) Representative western blots
  from WT and SKI SMCs and quantification of band intensities in graph. (D) mRNA levels
  of mt-CO3, mt-Nd3, mt-Atp6 and mt-Atp8 in SMCs from WT and SKI mice. (E) Mitochondrial
  copy numbers of WT and SKI SMCs. (F) Mitochondrial membrane potential (Δψm) assessment
  of WT and SKI SMCs. (G) Representative fluorescent images and associated quantification
  of WT and SKI SMCs incubated with s-GQDs. *p < 0.05 SKI vs. WT, n = 5-6 in each
  group. Data represent the mean of experiments±SEM, unpaired Student t-test
