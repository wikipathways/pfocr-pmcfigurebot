figure_title: Analysis of CD74high microglial morphology, associations with cell subtype
  distributions, and implicated pathways
caption: '(A) Box plots illustrating the association between the proportion of rounded
  microglia and CD74high microglia in both cohorts. As each individual contributed
  one value to the CD74high group and another to the CD74low group, the p-values were
  computed with Wilcoxon signed rank tests for paired samples. Center line: median;
  box limits: upper and lower quartiles; whiskers: the most extreme data point which
  is not more than 1.5 times the interquartile range from the box. (B) Volcano plots
  showing the association between CD74high microglia proportion and cell subtype propotions
  in our previous snRNA-seq study. Each point represents a specific cell subtype,
  colored by cell type: microglia (Mic), astrocytes (Ast), endothelial cells (End),
  excitatory neurons (Exc), inhibitory neurons (Inh), oligodendrocytes (Oli), and
  oligodendrocyte precursor cells (OPC). The effect sizes and p-values were computed
  using linear models adjusted for dichotomized background staining level. Dashed
  horizontal and vertical lines indicate p = 0.05 and effect size = 0, respectively.
  (C) Functional enrichment of differentially expressed genes in CD74high microglia.
  Microglia from a glioblastoma sample was profiled using CITE-seq, which simultaneously
  measures transcriptome and surface protein levels at single-cell resolution. The
  CD74high subset was defined based on surface CD74 expression levels. Differentially
  expressed genes between the CD74high and CD74low subsets were identified, and their
  Gene Ontology enrichment are displayed. (Left) Pathways enriched among genes positively
  associated with CD74high cells, and (right) pathways enriched among genes negatively
  associated with CD74high cells. Dot size represents the number of genes in each
  pathway, and color indicates adjusted p-value (p. adjust)'
