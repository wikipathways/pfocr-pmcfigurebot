caption: This figure illustrates novel pharmacological agents targeting the renin–angiotensin–aldosterone
  system and their mechanisms of action. Angiotensin II type 1-receptor blockers (ARBs)
  inhibit angiotensin II from binding to its type 1 receptor (AT1-R), thus counteracting
  its primary effects. Angiotensin II type 1-receptor–neprilysin inhibitors (ARNIs)
  combine the action of an ARB, i.e., blocking AT1-R, with the inhibition of neprilysin.
  Aminopeptidase A inhibitors (APAis) prevent aminopeptidase A (APA) from converting
  angiotensin II into angiotensin III. Mineralocorticoid-receptor antagonists (MRAs)
  block the mineralocorticoid receptor (MR), which is where aldosterone normally binds
  to induce increased sodium and water reabsorption. Additionally, Endothelin-receptor
  antagonists (ERAs) act by blocking the binding of the vasoconstrictive Endothelin-1
  (ET-1) to Endothelin-receptors A and/or B on smooth muscle cells. The pathway targeted
  by this mechanism is related to, but distinct from, direct RAAS cascade
