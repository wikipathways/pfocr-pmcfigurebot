figure_title: Proposed biosynthetic route from glucose to tagatose by reversing the
  Leloir pathway
caption: (A) Implementation of this pathway involves 6 reactions and inactivation
  of 2 native genes. (B) Approximate standard Gibbs free energy change for each reaction
  step numbered in A between glucose and tagatose using the reverse Leloir pathway.
  Y-axis values represent the net change in free energy due to each reaction starting
  from glucose as a basis. (C) Table of enzymes catalyzing each step represented in
  A, and the corresponding free energy change in kJ/mol for the reaction direction
  shown in A. ΔrG’° represents the change in Gibbs free energy due to the indicated
  reaction under standard conditions. The values for hexokinase and LAI were taken
  directly from the literature (Meurer et al., 2017) and (Hong et al., 2007) respectively.
  Others were calculated using the eQuilibrator tool (http://equilibrator.weizmann.ac.il)
  (Beber et al., 2022)
