figure_title: An SAQ-integrated clinical pathway for patients with chronic coronary
  syndromes.
caption: An SAQ-integrated clinical pathway for patients with chronic coronary syndromes.
  Patients presenting with angina undergo baseline SAQ assessment, initial diagnostic
  testing, and phenotyping into obstructive vs. ANOCA/INOCA categories. Obstructive
  CAD is typically assessed with FFR/iFR ± IVUS/OCT, whereas ANOCA/INOCA phenotypes
  require microvascular or vasospasm testing (CFR, IMR, acetylcholine). Therapy is
  tailored to the identified mechanism. Follow-up SAQ assessment is performed at predefined
  timepoints (4–12 weeks, 6–12 months) to evaluate clinically meaningful improvements.
  An increase of ≥5 points in any SAQ domain represents the minimal clinically important
  difference (MCID). A lack of improvement triggers re-phenotyping and therapy escalation
