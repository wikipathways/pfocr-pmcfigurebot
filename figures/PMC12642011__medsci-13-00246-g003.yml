figure_title: Isoform-specific nuclear targets of CaMKII in cardiomyocytes.
caption: 'Isoform-specific nuclear targets of CaMKII in cardiomyocytes. CaMKIIδ9 activates
  the NF-κB pathway by phosphorylating the IKK complex, leading to IκB degradation
  and p65/p50 nuclear translocation, thereby promoting inflammatory and injury-responsive
  gene expression [6,7]. In parallel, nuclear CaMKIIδB phosphorylates transcriptional
  regulators: it enhances GATA4-dependent activation of the BCL2 promoter and modifies
  HSF1 at Ser230, inducing iHSP70 expression and cytoprotection [37,38] By contrast,
  cytosolic CaMKIIδC phosphorylates calcineurin A, restraining NFAT nuclear translocation
  and thereby antagonizing maladaptive hypertrophy [40] Together, these isoform-specific
  programs couple calcium signals to pro-survival, inflammatory, and anti-hypertrophic
  transcriptional outputs in the stressed heart'
article_title: 'Nuclear CaMKII Isoforms as Regulators of Transcription: From Developmental
  to Pathological Persistence'
