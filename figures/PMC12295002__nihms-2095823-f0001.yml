figure_title: Modeling spinal muscular atrophy with patient-specific induced pluripotent
  stem cell derived-skeletal muscle
caption: 'A, (i) Timeline of iPSC-SKM differentiation from progenitors (Pax3+), myoblasts
  (Myod1+), and myotubes (MF20+) (scale bar = 320 μm). (ii-v) Quantification of markers
  during differentiation: Pax3, Myod1, MyoG, and MF20. (vi-vii) Western blot of SMN
  protein in SMA and healthy iPSC-SKMs. (viii-x) Myotube size and fusion index comparison
  in healthy control (HC) versus SMA. B, (i) Principal component analysis (PCA) of
  spectral counts. (ii) MA-plot representing protein expression differences. (iii-iv)
  Gene ontology of downregulated proteins and (v-vi) upregulated proteins in SMA.
  (vii-viii) Normalized ROS intensity in HC and SMA iPSC-SKMs after DTDP treatment
  using CellROX green dye (N = 3). (ix) KEGG pathway analysis and (x) related gene
  heatmap of upregulated proteins in SMA. C, (i) Venn diagram of upregulated proteins
  associated with skeletal muscle oxidases. (ii-iv) High MAOA level confirmation using
  LC-MS spectral analysis and Western blot. (v-ix) MAOA knockdown effects on protein
  levels, ROS measurements, and myotube sizes. D, (i) MAOA activity in iPSC-SKMs treated
  with genistein (Gen, 10 uM) or vehicle (Veh). (ii-iii) ROS levels and myotube diameter
  measurements under genistein at 10 uM and/or risdiplam (Ris) at 150 nM treatment
  in SMA iPSC-SKMs. (iv-viii) SMA mice survival, body weight, and muscle H&E staining
  post-treatment (Gen 10 mg/kg, Ris 3 mg/kg) (N = 5 mice, scale bar = 520 μm). In
  Cix, Di, Dii, Diii, Dvi, Dviii, one-way ANOVA was performed to confirm the difference
  (p<0.0001, In Di, p = 0.0003) within groups followed by post-hoc analysis for pair-wise
  comparison. Data presented as mean ± s.d'
