figure_title: Mechanistic conclusion.
caption: Mechanistic conclusion. SXC employs a dual therapeutic strategy against VVC
  by simultaneously addressing symptomatic relief and treating the root causes. For
  symptomatic management, SXC exhibits direct antifungal activity through inhibiting
  Candida replication, hyphal development and biofilm formation. At the same time,
  it mitigates host inflammation, to alleviate mucosal irritation. Beyond symptom
  control group, SXC targets root causes by disrupting fungal energy metabolism—reducing
  riboflavin availability to starve pathogens, downregulating Ras1-mediated hyphal/biofilm
  pathways, and counteracting oxidative stress and pyroptosis in host cells. This
  dual-action approach offers a comprehensive therapeutic profile that combines rapid
  symptom alleviation with sustained anti-relapse potential, making SXC a potential
  remedy for clinical refractory VVC
