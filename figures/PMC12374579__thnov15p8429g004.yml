figure_title: Temporal proteomic profiling of hippocampal tissue reveals synaptic
  alterations and pathway changes following chromic cerebral hypoperfusion (CCH).
caption: 'Temporal proteomic profiling of hippocampal tissue reveals synaptic alterations
  and pathway changes following chromic cerebral hypoperfusion (CCH). Heatmaps showing
  differentially expressed proteins in response to CCH (BCAS) at day 1 (A), day 7
  (C), day 14 (E), and day 30 (G), with colours representing z-score normalized protein
  abundances (red: higher abundance; green: lower abundance). Boxplots illustrating
  changes in key proteins involved in synaptic transmission at, day 1 (B), day 7 (D),
  day 14 (F), and day 30 (H) in response to CCH compared the control sham. Pathway
  enrichment and molecular network analyses were conducted using Ingenuity Pathway
  Analysis (IPA). (I-L) Bar plots are showing significantly enriched canonical pathways
  in response to CCH at different time points. The Y-axis represents -log(p-value),
  and each bar corresponds to a pathway, with colour indicating predicted activation
  state based on the z-score, orange indicates predicted activation (positive z-score).
  Longer bars indicate greater statistical significance, with pathways ranked by significance.
  n = 5 mice in each experimental group. *P < 0.05, **P < 0.01'
