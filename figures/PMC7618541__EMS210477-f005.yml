figure_title: Adenosine mediated toxicity is mediated by the interaction of NUDT5
  with PPAT
caption: (A) Results of BFP-pulldown in MTHFD1K56RNUDT5KO cells reconstituted with
  BFP-NUDT5. Enriched proteins from BFP-NUDT5 pulldown were normalized to NUDT5KO
  control and ranked according to log2FC. Hits with log2FC >4 are highlighted in blue.
  (B) Immunoprecipitation of endogenous PPAT following treatment of WT cells with
  100 nM dNUDT5, dNUDT5nc (37) or TH5427 for 20 h. (C) HA-Pulldown of MTHFD1K56RNUDT5KO
  cells transfected with HA2-NUDT5wt (representative blot from two independent experiments).
  Cells were cultured in DIA or ADO for 3 h (in – input, – elution). (D) CellTiterGlo
  viability assay of MTHFD1K56R cells that were transduced at a high MOI with lenti-EF1alpha-EGFP
  or lenti-EF1alpha-PPAT and treated for 2 d in ADO (n = 2, mean ± SD). (E) AlphaFold3
  model of the NUDT5-PPAT complex with the interaction site depicted in detail. (F)
  Results of fluorescence competition assay to test the effects of NUDT5 mutations
  on adenosine mediated toxicity in MTHFD1K56R cells. Cells were cultured in DIA (control)
  or ADO for 72 h. The population of mCherry expressing cells in ADO was normalized
  to cells in DIA. Dashed lines indicate NUDT5wt and mCherry control values (values
  are mean ± SEM from two independent experiments) (G) Pulldown of MTHFD1K56RNUDT5KO
  cells transfected with indicated HA2-NUDT5 variants (representative blot from two
  independent experiments). (H) Results of PPAT activity assay together with NUDT5wt
  or NUDT5Y74E (n = 3, mean ± SEM, values are normalized to baseline control). (I)
  Depiction of the AlphaFold3 NUDT5-PPAT interaction surface highlighting NUDT5 amino
  acids that maintain PPAT binding when mutated (blue) or that result in lost PPAT
  binding capacity when mutated (magenta). (J) Proposed model of the NUDT5-PPAT dependent
  purine de novo synthesis pathway regulation at high and low purine conditions
article_title: A non-enzymatic role of Nudix hydrolase 5 in repressing purine de novo
  synthesis
