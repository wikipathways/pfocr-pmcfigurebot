  and angiogenesis.
caption: Schematic representation of the role of O-GlcNAcylation in CCA-relevant oncogenic
  pathways, including cell proliferation, metastasis, metabolic reprogramming and
  angiogenesis. Oncogenic regulators that exhibit a positive feed-forward relationship
  with OGT and/or O-GlcNAcylation, contributing to CCA progression and survival, are
  highlighted in red. Figure constructed using BioRender (biorender.com/). CCA, cholangiocarcinoma;
  OGT, O-GlcNAc transferase; MDM2, mouse double minute 2 homolog; PDK, pyruvate dehydrogenase
  kinase; PDH, pyruvate dehydrogenase; OxPhos, oxidative phosphorylation; TCA, tricarboxylic
  acid cycle; PGK, phosphoglycerate kinase; PPP, pentose phosphate pathway; PKM2,
  pyruvate kinase M2; G6PD, glucose-6-phosphate dehydrogenase; PFK, phosphofructokinase;
  AGER, advanced glycosylation end product-specific receptor; UAP1, UDP-N-acetylglucosamine
  pyrophosphorylase 1; HBP, hexosamine biosynthesis pathway; IDH, isocitrate dehydrogenase;
  Glut, glucose transporter; FASN, fatty acid synthase; SREBP-1, sterol regulatory
  element-binding protein 1; ACSL4, acyl-CoA ligase 4; SRPK2, serine/arginine-rich
  protein kinase 2; GFAT, glutamine fructose-6-phosphate amidotransferase; RACK1,
  ribosomal receptor for activated C-kinase 1
