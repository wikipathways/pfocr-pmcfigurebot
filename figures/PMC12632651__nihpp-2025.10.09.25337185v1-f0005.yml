figure_title: Transcriptomic and metabolomic profiling of DCD hearts
caption: (A) Volcano plot of differentially expressed genes (DEGs) between NRP + HOPE
  24h and NRP + SCS 2h. (B) Heatmap of top 50 DEGs shows distinct expression patterns.
  (C) KEGG enrichment of upregulated DEGs highlights inflammation-related pathways
  (FDR < 0.01). (D) Volcano plot of metabolomic analysis shows significantly altered
  metabolites (red). (E) Supervised clustering heatmap of 33 significant metabolites
  shows no consistent pathway-level shifts
