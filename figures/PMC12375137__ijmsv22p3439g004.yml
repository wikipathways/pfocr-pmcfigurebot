figure_title: Estrogen-mediated aldosterone production in the adrenocortical zona.
caption: Estrogen-mediated aldosterone production in the adrenocortical zona. Estrogen
  mediates vascular endothelial cell relaxation by acting on ERα and ERβ. Estrogen
  dimerizes with ERβ and binds to ERE in the nucleus, inhibiting the transcription
  of CYP11B2, thereby reducing aldosterone synthesis. GPER1 induces the expression
  of aldosterone synthase through the AC/PKA signaling pathway, which ERβ-mediated
  effects can physiologically inhibit. E, estrogen; ERα, estrogen receptor type α;
  ERβ, estrogen receptor type β; GPER1, G protein-coupled estrogen receptor type 1;
  eNOS, nitric oxide synthase; NO, nitric oxide;cGMP, cyclic guanosine monophosphate;
  ERE, estrogen response element; AC, adenylate cyclase; ATP, adenosine triphosphate;
  cAMP, cyclic adenosine monophosphate; PKA, protein kinase A
