figure_title: Nanopore long-read sequencing in Rrp40 mutant head tissue reveals rRNA
  biogenesis defects
caption: (A) Overview of the Drosophila melanogaster ribosomal RNA (rRNA) biogenesis
  pathway.50,51 The sizes of rRNA intermediates are indicated in dark gray. Red arrows
  denote external or internal spacer regions, which are cleaved and excised to produce
  mature 18S, 5.8S, 2S, 28Sa, and 28Sb rRNA. A 5.8S probe (dark blue arrow) was used
  in near-infrared northern (irNorthern) blots in this study.(B) irNorthern blot analysis
  of 5.8S rRNAs in brain-enriched tissue from Rrp40 mutants and WT controls.(C) “Nanoblot”
  generated by targeting mature 5.8S rRNA with a 5.8S nanoprobe using Nanopore-based
  RNA sequencing data from Rrp40 mutants and WT controls. Note the similarity to the
  irNorthern blot in (B).(D) IGV browser screenshots showing single-track read coverage
  mapping to 5.8S rRNA, 2S rRNA, and ITS2 in Rrp40 mutants and WT controls. The blue
  asterisk (*) labels 5.8S species extending into ITS2, while the red asterisk (*)
  denotes 2S-ITS2 transcripts resulting from impaired degradation.(E) Quantification
  of the ratio of extended 5.8S rRNA and 2S rRNA species to mature 5.8S in Rrp40 mutants
  and WT controls, shown as a bar graph. Values represent the mean ± SD for 3 biological
  replicates.(F) Nanoblot generated by targeting mature 2S rRNA with a 2S nanoprobe
  using the Nanopore-based RNA sequencing data from Rrp40 mutants and WT controls
article_title: The RNA exosome maintains cellular RNA homeostasis by controlling transcript
  abundance in the brain
