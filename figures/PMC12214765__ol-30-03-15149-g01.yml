figure_title: Establishment and biological characteristics of glutamine metabolism-related
  clusters.
caption: Establishment and biological characteristics of glutamine metabolism-related
  clusters. (A) A total of eight prognostic genes were selected using univariate Cox
  regression analysis. (B) Consensus clustering matrix for K=2. (C) Principal component
  analysis of clusters A and B. (D) Kaplan-Meier overall survival curves for patients
  with LIHC in clusters A and B. (E) Heatmap analysis of gene expression and clinical
  correlation between clusters of LIHC. (F) KEGG pathway enrichment of DEGs between
  clusters A and B. The enriched items were analyzed using gene counts, gene ratios
  and adjusted P-values. (G) Gene Ontology functional annotation analysis of DEGs
  between clusters A and B, and enriched BPs, CCs and MFs. (H) gene set variation
  analysis enrichment analysis, showing the biological pathways associated with distinct
  glutamine metabolic modification patterns. Heatmap analysis was used to visualize
  these BPs, with red representing activated pathways and blue representing inhibited
  pathways. (I) Sample distribution of different gene clusters. (J) Heatmap analysis,
  showing gene expression and clinical correlation among different gene clusters of
  LIHC. (K) Kaplan-Meier curves for patients with LIHC in gene clusters A and B. (L)
  Expression differences of 21 glutamine metabolism-related genes between gene clusters
  A and B. *P<0.05; ***P<0.001. LIHC, liver hepatocellular carcinoma; DEGs, differentially
  expressed genes; KEGG, Kyoto Encyclopedia of Genes and Genomes; BP, biological process;
  CC, cellular component; MF, molecular functions; HR, hazard ratio; CI, confidence
  interval; T, tumor; N, lymph node; M, metastasis
