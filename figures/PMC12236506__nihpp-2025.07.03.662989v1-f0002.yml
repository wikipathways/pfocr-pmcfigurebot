figure_title: The granule cell input pathway
caption: A, Apical dendrites in the molecular layer (~100 μm from the surface of the
  ganglion layer) corresponding to all of the Output, MG, and SG cells located in
  a 60 × 60 × 60 μm subregion of the EM volume. Pie chart shows the estimated fraction
  of spines per cell type (and estimated total spine count) corresponding to the 6
  Output, 13 MG, and 93 SG cells within the selected subvolume. B, A GCA (magenta)
  synapsing onto the spines of an Output ON (red) and MG− (blue) cell and onto the
  swelling of a smooth apical dendrite (gray) (arrows show synapse locations). C,
  Number of synapses formed by each reconstructed and synapse-annotated GCA onto different
  postsynaptic cell types (indicated by colors) (n = 676 synapses from 64 GCA onto
  312 Output, MG, SG, and MLI neurons). GCA fibers are ordered along the x-axis by
  the number of synapses onto MG− (decreasing) and then MG+ (increasing). An additional
  321 GCA synapses were onto unclassified elements
