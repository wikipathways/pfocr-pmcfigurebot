figure_title: TTM treatment increases intracellular Mo and decreases Cu leading to
  activation of the Cu-stress response pathway in C. albicans
caption: A) Intracellular metal content measured by ICP-MS of C. albicans untreated
  (NT) or treated for 90 min. Data shown are an average of 3 technical replicates
  for 3 biological replicates. Error bars are SEM. After initial significance was
  shown with a one-way ANOVA, significance between individual treatments was determined
  using a student’s pooled t-test; “c” is a p-value <0.0001. In-gel Sod activity assays
  and immunoblots of CuZnSod1, mitochondrial MnSod2, and cytosolic MnSod3 after treatment
  for B) 90 min or C) 24 h
