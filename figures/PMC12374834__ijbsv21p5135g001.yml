figure_title: Multidimensional regulatory network of SIRT3 in cellular homeostasis.
caption: Multidimensional regulatory network of SIRT3 in cellular homeostasis. (A)
  As a central redox regulator, SIRT3 orchestrates mitochondrial antioxidant defense
  through dual mechanisms. It regulates key antioxidant enzymes, including MnSOD2
  and CAT, to counteract oxidative damage induced by ROS. Furthermore, SIRT3 modulates
  the activities of GPX and PRDX, thereby maintaining cellular redox homeostasis.
  (B) SIRT3 contributes to the regulation of epigenetic processes, particularly in
  DNA repair mechanisms via the NHEJ pathway. It interacts with critical DNA repair
  proteins, such as PARP1, Ku70/80, XRCC1, and DNA ligase 4, and facilitates the repair
  of mtDNA damage. (C) SIRT3 modulates apoptotic commitment through dynamic acetylation
  networks. SIRT3 regulates mitochondrial dynamics by deacetylating Bcl-2, thus preventing
  mitochondrial outer membrane permeabilization. Additionally, SIRT3 delays Cyt-C
  release kinetics the subsequent activation of caspases, thereby modulating apoptotic
  signaling pathways. (D) SIRT3 integrates metabolic flux through substrate channeling,
  exerting significant effects on the TCA cycle and promoting fatty acid oxidation.
  It regulates critical enzymes, such as AMPK, SOD2, and acetyl-CoA, and also modulates
  glucose metabolism by controlling the conversion of pyruvate to lactate. Moreover,
  SIRT3 supports the production of ketone bodies, which are essential for maintaining
  energy balance under conditions of metabolic stress
