caption: '(A) A dot plot illustrating Gene Ontology (GO) pathway enrichment analysis
  of the differentially expressed genes (DEGs; the established criteria: padjusted
  < 0.05; log2 fold change (log2FC) ≥ 1.0/log2FC ≤ −1.0; determined by DESeq2 package
  [version 1.42.0] within R statistical software (version 4.4.2) identified in equine
  endometrial fibroblasts (n = 5) after 96 h of TNFα treatment (10 ng/mL). The dot
  color depends on pathway enrichment significance, while the size of dots depends
  on the number of target genes assigned to particular processes. BP: biological process;
  CC: cellular components; MF: molecular function. (B) A dot plot illustrating Kyoto
  Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis of the DEGs
  identified in equine endometrial fibroblasts (n = 5) after 96 h of TNFα treatment
  (10 ng/mL). The dot color depends on pathway enrichment significance, while the
  size of dots depends on the number of target genes assigned to particular processes.
  Please note that the numbers inside the dots indicate the number of DEGs assigned
  to particular process'
