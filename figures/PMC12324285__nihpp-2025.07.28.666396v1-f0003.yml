figure_title: Early neurodevelopmental transcripts with protein counterparts and neural
  signaling pathways emerge due to loss of chd7 at 3 dpf.
caption: Early neurodevelopmental transcripts with protein counterparts and neural
  signaling pathways emerge due to loss of chd7 at 3 dpf. Volcano plot of Differentially
  Expressed Genes (DEGs) comparing A. 3 dpf Heterozygous (HT) compared to 3 dpf Wild
  Type (WT) samples and B. 3 dpf Homozygous Mutant (MUT) compared to 3 dpf WT samples.
  Volcano plot of Differentially Expressed Proteins (DEPs) comparing C. 3 dpf HT compared
  to 3 dpf WT samples and D. 3 dpf MUT compared to 3 dpf WT samples. Ingenuity Pathway
  Analysis (IPA) pathway enrichment by patterns of DEGs from E. 3 dpf HT compared
  to WT samples and F. 3 dpf MUT compared to WT samples. IPA pathway enrichment by
  patterns of DEPs from G. 3 dpf HT compared to WT samples and H. 3 dpf MUT compared
  to WT samples. I. Overlap of DEGs with p-value < 0.05 from 3 dpf HT v WT and 3 dpf
  MUT v WT. J. Overlap of DEPs with p-value < 0.05 from 3 dpf HT v WT and 3 dpf MUT
  v WT. K. Overlap of DEGs with p-value < 0.05 from 3 dpf HT v WT and MUT v WT (purple)
  and DEPs with p-value < 0.05 from 3 dpf HT v WT and MUT v WT (green). L. Overlap
  of 3 dpf DEGs from I. and DEPs from J. and Neuro-GO list. M. Log2 Fold Change for
  all DEGs and DEPs from MUT v WT comparison from overlap in K. and selected from
  overlap in L. are underlined
article_title: Multi-omic analyses identify molecular targets of Chd7 that mediate
  CHARGE syndrome model phenotypes
