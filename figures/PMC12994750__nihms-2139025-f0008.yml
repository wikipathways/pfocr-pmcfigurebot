figure_title: CLN3 forms a lysosomal chloride channel that mediates chloride efflux
  from the lumen to the cytosol.
caption: CLN3 forms a lysosomal chloride channel that mediates chloride efflux from
  the lumen to the cytosol. Under physiological conditions, CLN3 is critical for maintaining
  lysosomal homeostasis by regulating luminal chloride levels, lysosomal pH, enzyme
  activity, and degradation capacity. The TFEB-specific activator, Curcumin analog
  C1, enhances CLN3-mediated chloride currents, indicating a functional interaction
  between TFEB signaling and CLN3 channel activity. Notably, CLN3 serves as both a
  downstream effector of TFEB and a key regulator required for TFEB activity, establishing
  a bidirectional regulatory relationship between CLN3 and the TFEB pathway
