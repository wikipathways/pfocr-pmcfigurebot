figure_title: Enrichment analysis of 18 genes screened based on SMAD4 expression levels.
caption: Enrichment analysis of 18 genes screened based on SMAD4 expression levels.
  (A) GO biological process analysis results, presented as a bar graph of the top
  10 enriched processes sorted by the combined score. (B) Pathway analysis results
  are presented as a clustered heatmap with a dendrogram, showing genes significantly
  associated with multiple pathways. Only genes associated with two or more pathways
  and those showing significant enrichment were included in the visualization. Clustering
  was performed using Euclidean distance calculation and the average linkage method
  between clusters. Red blocks indicate the association of genes (shown along the
  bottom axis) with the corresponding pathways
