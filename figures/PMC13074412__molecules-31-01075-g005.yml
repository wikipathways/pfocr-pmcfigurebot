caption: (A) Path diagram of the sesquiterpene biosynthesis pathway. Red and pink
  letters represent the key enzymes involved in sesquiterpene and triterpene biosynthetic
  pathways. Solid lines indicate direct catalytic reactions, and dotted lines indicate
  indirect catalytic reactions. (B) qRT-PCR analysis of four significant DEGs in sesquiterpene
  and triterpene biosynthetic pathways. The relative expression level of A.M. in Hebei
  was taken as the control. These values represent three biological repeats. * indicates
  significant (p ≤ 0.05); *** indicates highly significant (p ≤ 0.001); **** indicates
  extremely significant (p ≤ 0.0001). (C) The chemical structures of key metabolites
  and the chromatograms of A.M. root extract before and after stress obtained by HPLC
  analysis
