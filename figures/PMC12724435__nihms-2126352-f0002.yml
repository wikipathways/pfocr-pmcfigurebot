figure_title: Structure and representative molecular targets of Schedule 1 vesicants
caption: '(A)Top: structures of sulfur mustard and nitrogen mustards. Bottom: schematic
  of intramolecular cyclization to three-membered onium ring for sulfur mustard and
  subsequent fates in physiological media. Hydrolysis by water yields non-alkylating
  products, whereas nucleophilic attack on the β-carbon yields covalent alkylation
  of DNA bases and protein side chains. The schematics depict reaction classes and
  targets rather than exhaustive stoichiometries. Reactions are equivalent for nitrogen
  mustards. “nu” indicates hydrolysis or alkylation of additional targets by remaining
  2-chloroethyl arm(s). (B) Top: structure of lewisites. Bottom: schematic of As(III)
  coordination chemistry. In aqueous biological media, chloride ligands are substituted
  stepwise by cellular thiolates and selenolates. Shown are representative targets:
  the vicinal Cys–Cys dithiol on the E2 dihydrolipoamide acetyltransferase component
  of the pyruvate dehydrogenase (PDH) complex, which forms a stable bidentate chelate
  that arrests acyl transfer, and the Cys–Sec redox center of thioredoxin reductase
  1 (TrxR1), whose coordination inhibits electron transfer and shifts the cellular
  redox setpoint. Hydrolysis pathways are shown for completeness but are kinetically
  minor relative to thiol or selenol substitution'
