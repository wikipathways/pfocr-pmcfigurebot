figure_title: PRKDC-dependent NHEJ pathway is essential for SOX2-mediated in vivo
  reprogramming
caption: (A) Experimental design to determine the effect of PRKDC deficiency on reprogramming.
  Adult wild-type (WT) or Prkdcscid mice were injected with viruses and analyzed 4
  weeks later.(B) Representative confocal images showing expression of the indicated
  markers surrounding the virus-injected striatal regions. Scale bar, 50 μm.(C) Quantification
  of DCX+ new neurons in the injected striatal regions. n=3 for WT mice and n=4 for
  Prkdcscid mice per group.(D) Schematic diagram illustrating the NHEJ pathway for
  repairing DNA double-strand breaks.(E) Representative confocal images showing expression
  of the indicated markers surrounding the virus-injected striatal regions. Scale
  bar, 50 μm.(F) Quantification of DCX+ new neurons. n=3 mice for each group.See also
  Supplemental Figures S2 and S3
