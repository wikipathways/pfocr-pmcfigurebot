figure_title: Keap1–Nrf2–ARE signaling pathway and downstream antioxidant gene activation.
caption: Keap1–Nrf2–ARE signaling pathway and downstream antioxidant gene activation.
  Under basal conditions, Nrf2 is bound to Keap1, a redox-sensitive adaptor protein
  that recruits Cullin 3 (Cul3)–based E3 ubiquitin ligase complexes, leading to ubiquitination
  and proteasomal degradation of Nrf2. Upon exposure to ROS or electrophilic stress,
  critical cysteine residues of Keap1 undergo covalent modifications, preventing Nrf2
  degradation. Stabilized Nrf2 accumulates in the cytoplasm, translocates into the
  nucleus, and heterodimerizes with small Maf proteins to bind antioxidant response
  elements (AREs) in DNA. This induces the transcription of a wide range of cytoprotective
  genes, including glutathione peroxidase 2 (GPx2), peroxiredoxin 1 (Prdx1), thioredoxin
  1 (Txn1), sulfiredoxin 1 (Srx1), glutamate–cysteine ligase catalytic subunit (GCLC)
  and modifier subunit (GCLM), glutathione S-transferases (GSTs), NAD(P)H quinone
  dehydrogenase 1 (NQO1), cytochrome P450 2A6 (CYP2A6), multidrug resistance–associated
  protein 2 (MRP2), and heme oxygenase 1 (HO-1). Collectively, these enzymes mitigate
  oxidative damage, detoxify xenobiotics, and maintain redox homeostasis
