figure_title: Effects of Abeliophyllum distichum extracts (AD) on the AMPK/SIRT1 signaling
  pathway in 3T3-L1 adipocytes.
caption: 'Effects of Abeliophyllum distichum extracts (AD) on the AMPK/SIRT1 signaling
  pathway in 3T3-L1 adipocytes. 3T3-L1 preadipocytes were differentiated in the presence
  of 0.5 mM 3-isobutyl-1-methylxanthine, 1 µM dexamethasone, and 1 µg/mL insulin (MDI)
  cocktail and treated with AD (0－200 µg/mL). (A) Western blot analysis of phosphorylated
  AMPK, ACC, and SIRT1 protein levels. (B-E) Quantification of phosphorylated AMPK,
  ACC, and SIRT protein levels. (F) qPCR analysis of ACC mRNA level. Data are presented
  as the mean±standard deviation of three independent experiments. #P<0.05 compared
  with the undifferentiated blank (without MDI); *P<0.05 compared with the differentiated
  control (with MDI). AMPK, AMP-activated protein kinase; SIRT1, sirtuin 1; ACC, acetyl-CoA
  carboxylase; qPCR, real-time polymerase chain reaction'
