caption: S100A14 is upregulated in colorectal cancers arising from the serrated pathway.
  (A) S100A14 expression levels (log2 expression levels) in colorectal tumors with
  BRAFV600E mutations (GEO microarray dataset GSE75317) and (B) in colorectal tumors
  grouped based on microsatellite instability status (GEO microarray dataset GSE24550).
  (C) S100A14 IHC expression scoring based on BRAFV600E mutations and MSI/MSS status.
  (D) Representative IHC image of S100A14 staining in each type of tumor. p-values
  are represented with * ≤ 0.05, and *** ≤ 0.001, (median ± range)
