figure_title: Cell-intrinsic glutaminolysis dominates macrophage restorative functions
  in atherosclerosis.
caption: Cell-intrinsic glutaminolysis dominates macrophage restorative functions
  in atherosclerosis. a, To identify the regulation of specific transcriptional pathways
  between PCMΔGls1 and PCMCtl from Ldlr−/− recipient mice transplanted with BM cells
  from MyeΔGls1 and control mice, differentially expressed genes quantified by RNAseq
  were subjected to GSEA analysis. The top four upregulated and downregulated pathways
  are displayed. b, The gating strategy (left) and efferocytic index (right) in TIM-4−
  and TIM-4+ PCMs isolated from atherosclerosis-prone Ldlr−/− or Ldlr−/−Gls2−/− recipient
  mice transplanted with BM cells from control and MyeΔGls1 mice at the end of the
  study period after 45 min of ex vivo AC exposure. Data from individual mice are
  shown and values are presented as the mean ± s.e.m. (n = 5 mice transplanted with
  BMDMCtl, n = 6 BMDMΔGls1 into Ldlr−/− mice and n = 7 BMDMΔGls1 into Ldlr−/−Gls2−/−
  mice). c, A Venn diagram highlighting the common and specifically regulated matrisome
  transcripts quantified by RNAseq across the different PCMs, as indicated in the
  figures. d, A radar chart representation of matrisome module enrichment across these
  different PCMs. Eight radii of the radar chart are devoted to matrisome and KEGG
  specific modules indicated in the figures. e, A schematic representation of the
  potential impact of Gln flux on macrophagemediated matrix remodelling and efferocytosis
  in Ldlr−/− and Ldlr−/−Gls2−/− animals. f, Representative sections (left) and quantification
  (right) of necrotic cores and fibrous cap thickness (mircometre) from Ldlr−/− and
  Ldlr−/−Gls2−/− recipient mice that received BM from control and MyeΔGls1mice (n
  = 13 mice transplanted with BMDMCtl and n = 14 mice transplanted with BMDMΔGls1).
  The dotted lines in representative sections show aortic plaque limits. Scale bar,
  200 μm. Data from individual mice are shown and values are presented as the mean
  ± s.e.m. Significance was determined ANOVA with Fisher’s LSD post hoc analysis.
  Images in e from Servier Medical Art (https://smart.servier.com/)
