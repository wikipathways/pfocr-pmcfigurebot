figure_title: Glutamic acid secreted by L.j. WXY attenuates colitis by promoting Treg
  expansion through enhanced IL-2R signaling
caption: '(A–E) WT mice were orally administered l-glutamic acid (L-Glut.) or stachydrine
  daily for 3 days, followed by DSS treatment with continued daily metabolite administration
  sacrifice on day 10. Body weight loss (A), DAI (B), gross colon morphology and length
  (C), distal colon histology (D), and cLP neutrophil and Treg frequencies (E) (A–C,
  and E, PBS n = 9, stachydrine n = 8, l-glutamic acid n = 10; D, n = 6/group). P,
  PBS; S, Stachydrine; L, L-glutamic acid. (F–H) CD62L+ naive CD4+ T cells isolated
  from WT spleen and lymph nodes were polarized toward Treg differentiation and simultaneously
  stimulated with l-glutamic acid. After 6 days, Treg frequencies were assessed by
  flow cytometry (F), and mRNA expression of Tgfb1 and Il10 (G), as well as Il2ra
  and Il2 (H), was quantified by qPCR after stimulation with 400 μg/mL l-glutamic
  acid (n = 6 biological replicates/group). (I) CD62L+ naive CD4+ T cells were activated
  with anti-CD3 and anti-CD28 Abs and treated with 400 μg/mL l-glutamic acid. After
  4 days, proportions of IL-2+ and CD25+ cells among CD4+ T cells were analyzed by
  flow cytometry (n = 6 biological replicates/group). (J–M) CD62L+ naive CD4+ T cells
  were polarized toward Treg differentiation in the presence of 400 μg/mL l-glutamic
  acid for 6 days. The proportions (J and K) and absolute numbers (L) of CD25+Foxp3+
  and CD25+Foxp3– cells, as well as the MFI of CD25 in CD25+CD4+ and IL-2 in IL-2+CD4+
  cells (M) were determined by flow cytometry (n = 6 biological replicates/group).
  (N and O) CD62L+ naive CD4+ T cells were polarized toward Th1 or Th17 differentiation
  in the presence of l-glutamic acid. After 5 days, the frequencies of IFN-γ+ and
  IL-17+ CD4+ T cells were measured by flow cytometry (N), and Ifng and Il17a mRNA
  expression was quantified by qPCR (O) (n = 6 biological replicates/group). (P) KEGG
  pathway annotation highlighting amino acid metabolism in L.j. WXY based on whole-genome
  sequencing. (Q) Chemical structural formula illustrating the metabolic conversion
  of l-glutamine to l-glutamic acid involving glutaminase. (R) Relative expression
  of the bacterial glutaminase-encoding gene glsA in the indicated Lactobacillus strains,
  normalized to 16S rDNA by qPCR (n = 6 technical replicates/group). (S) Indicated
  Lactobacillus strains (1 × 107 CFU) were cultured in MRS medium for 24 hours, and
  glutamic acid concentrations in culture supernatants were measured using a glutamic
  acid assay kit (n = 2 replicates/group). (T and U) Clec4n–/– mice were administered
  anti-CD25 neutralizing Ab or isotype control IgG intraperitoneally every other day
  for 3 doses, followed by 7 days of DSS treatment with continued Ab administration
  for an additional 5 doses. Body weight loss (T) and DAI (U) were monitored daily
  (control IgG, n = 6; anti-CD25 Ab, n = 8; WT, n = 7). Data in A–O, R, T, and U are
  pooled from 2 independent experiments. Data in A–I, K–O, and R–U are presented as
  mean ± SD. Statistical analysis: 1-way ANOVA with Bonferroni’s multiple-comparison
  test (A, B, T, and U); 1-way ANOVA with Tukey’s multiple-comparison test (C–F),
  or 2-tailed unpaired Student’s t test (G–I and K–O)'
