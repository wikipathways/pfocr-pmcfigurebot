figure_title: 'Mechanisms of radiation-induced DNA damage: direct and indirect effects.'
caption: 'Mechanisms of radiation-induced DNA damage: direct and indirect effects.
  Ionizing radiation damages DNA through two primary mechanisms. In direct damage,
  radiation interacts directly with DNA molecules, causing strand breaks and base
  modifications. In indirect damage, radiation interacts with cellular water to generate
  reactive oxygen species (ROS), which then chemically damage DNA. Both pathways contribute
  to the cytotoxic effects of radiation therapy. Created in BioRender. Derbowka, R.
