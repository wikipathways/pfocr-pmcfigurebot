figure_title: Pathway Dysregulation in Male and Female Mice During Cancer Progression
caption: KEGG pathway enrichment analysis of downregulated genes across groups. The
  top 10 pathways (FDR<0.05) are shown, with the number of annotated genes and -log10(FDR)
  values indicated for A) C26F25D, B) C26M25D, C) APCF, and D) APCM. KEGG pathway
  enrichment analysis of upregulated genes across groups. The top 10 pathways (FDR
  < 0.05) are shown, including annotated gene counts and -log10(FDR) values for E)
  C26F25D, F) C26M25D, G) APCF, and H) APCM. Pathways commonly dysregulated across
  groups are mark with a circle. C26F20D = female C26 mice, 20 days post-implantation;
  C26F25D = female C26 mice, 25 days post-implantation; C26M20D = male C26 mice, 20
  days post-implantation; C26M25D = male C26 mice, 25 days post-implantation; APCM
  = male mice from the APC model (ApcMin/+); APCF = female mice from the APC model
  (ApcMin/+). No significant pathways were annotated in male or female C26 mice at
  20 days post-implantation
