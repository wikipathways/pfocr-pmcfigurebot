figure_title: SCD1 inhibition modulates the expression of metabolic pathways and leads
  to suppression of salt-inducible kinase genes in KRAS/STK11/KEAP1 co-mutant LUADs
caption: A) Venn diagram showing the differentially regulated genes in different NSCLCs
  with different de novo mutation status. Also showing the genes which are uniquely
  downregulated in KRASmutSTK11mutKEAP1mut H2122 cell line up on CVT-11127 treatment.
  B) Most notable downregulated pathway analysis. C) Heat map showing the most important
  downregulated genes in STK11/KEAP1 co mutation cell line H2122, after CVT-11127
  treatment (10μM, 96 hours). D) Box plots depict the gene expression of SIK1 gene
  in H358 vs H2122 in +/− CVT-11127 condition (10μM, 96 hours). E) Box plots depict
  the gene expression of SIK1B gene in H358 vs H2122 in +/− CVT-11127 condition (10μM,
  96 hours). F) Bar graph showing the mRNA expression levels SIK1, CREB, and SCD1
  in H358 cells after +/− CVT-11127 treatment G) Bar graph showing the mRNA expression
  levels SIK1, CREB, and SCD1 in H2122 cells after +/− CVT-11127 treatment. H) mRNA
  expression of SIK1 gene in STK11/KEAP1 CRISPR KO H358 cell line. I) mRNA expression
  of SIK1 before and after CVT-11127 treatment for 24 to 96 hours of treatment (10μM).
  For comparisons among multiple groups, one-way analysis of variance (ANOVA) and
  between two groups, student t-test followed by the Dunnett’s post-hoc test were
  performed. The p<0.05 (*), p<0.01 (**), p<0.001 (***) were considered as significant
  (p>0.05 was considered as non-significant (ns)). The results are representation
  of n= 3 experiments. Error bar represents the ±standard error of the mean (SEM)
