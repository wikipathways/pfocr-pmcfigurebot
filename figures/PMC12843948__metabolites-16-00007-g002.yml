figure_title: (A) Methodology for identifying food-derived antioxidants and substances
  that inhibit lipid droplet accumulation.
caption: '(A) Methodology for identifying food-derived antioxidants and substances
  that inhibit lipid droplet accumulation. (1) Evaluation of direct antioxidant properties
  and antioxidant activity index. (2) Assessment of LDAI/oxLDAI under fatty acid loading
  conditions in relation to Keap1-Nrf2 pathway regulation. (3) Cellular imaging: LD/oxLD
  staining. (4) Metabolome analysis was performed using NMR. (B) (B-1) Cytotoxicity
  and lipotoxicity of clove extracts (CE-MeOH and CE-CHCl3) in HepG2 cells. Cytotoxicity
  (CC50) was expressed as the concentration at which 50% of the cells died in DMEM
  without fatty acids (−LA). Lipotoxicity (LC50) was expressed as the concentration
  at which 50% of the cells died, especially in DMEM loaded with fatty acids (+LA).
  (B-2) The graph illustrates the mean LDAI/oxLDAI values (four replicates) for CE-MeOH
  in LA-loaded HepG2 cells, demonstrating their LDAI/oxLDAI activity. Statistical
  significance was assessed using one-way analysis of variance (ANOVA) with Tukey’s
  multiple comparison test against the untreated control, where **** p < 0.0001, ***
  p < 0.001, and. (B-3). Bioactive clove extracts (CE-MeOH and CE-CHCl3): % inhibition
  of DPPH by CE-MeOH and CE-CHCl3. (B) Antioxidant activity index values for CE. Graph
  showing the AAI values. Individual AAI values for each sample were calculated. The
  activity criteria based on the IC50 values were classified as very strong, strong,
  moderate, and weak. (C) Cells treated with CE-MeOH were visualized using phase-contrast
  and Oil Red O staining'
