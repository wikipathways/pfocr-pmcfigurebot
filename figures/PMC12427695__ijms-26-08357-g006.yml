figure_title: PAK1 knockout upregulated ICAM-1 and VCAM-1 and induced changes in leukocyte
  trans-endothelial migration.
caption: PAK1 knockout upregulated ICAM-1 and VCAM-1 and induced changes in leukocyte
  trans-endothelial migration. The tumour tissues from wild-type (WT) and PAK1-knockout
  (PAK1KO) were subjected to proteomic analysis. A volcano plot showed the differential
  expression of protein profiles in PAK1KO tumours compared to WT tumours (A). The
  red and blue colours represent up- and down-regulation of protein expression, respectively.
  Protein interaction network analysis of global proteomic data suggested significant
  alterations in processes involved in endothelial cell migration, dendritic cell
  function, and MHC-II antigen presentation, and enrichment of the KEGG leukocyte
  trans-endothelial migration pathway (B). The expression of ICAM-1 and VCAM-1, CD11b,
  and MHC class I molecules (H2-D1 and H2-K1) were increased while CD31 and CD34,
  CD11c, and MHC class II molecules (H2-Ab1, H2-Eb1, H2-DMa, and H2-DMb1) were significantly
  downregulated in PAK1KO tumours (C). *, p < 0.05, **, p < 0.01, ***, p < 0.001,
  ****, p < 0.0001
