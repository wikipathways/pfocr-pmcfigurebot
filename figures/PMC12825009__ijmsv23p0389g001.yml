caption: 'Identification of differentially expressed genes (DEGs) between RA and HC.
  (A, B) Volcano map and heatmap of DEGs. The top twenty significantly up-regulated
  DEGs (logFC > 1 and adj.p-value < 0.05) were labeled in red, and the top twenty
  significantly down-regulated DEGs (logFC < -1 and adj.p-value < 0.05) were labeled
  in blue. The color degree of the heatmap grid represents the gene expression. (C,
  D) GO and KEGG enrichment analysis of DEGs. GO ONTOLOGY displayed the top ten enrichment
  items. The top twenty enriched KEGG pathways were displayed. (E) Venn diagram of
  intersection of fatty acid metabolism-related (FAM-) genes and DEGs. (F) PPI network
  of DEGs related to fatty acid metabolic pathway. (G) Calculation of Hub candidate
  gene network based on CytoHubba method in Cytoscape. Node size represented connection
  number (degree) and node color represented mediated number centrality (blue: low
  mediated number centrality, red: high mediated number centrality)'
