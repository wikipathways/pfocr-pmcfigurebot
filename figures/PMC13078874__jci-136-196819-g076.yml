figure_title: Upregulation of one-carbon metabolism pathways in the brain of Sel1LSynCre
  mice
caption: '(A) KEGG pathway enrichment analysis of differentially expressed genes in
  Sel1LSynCre mice, separated by neuronal subtypes isolated from the cortex and hippocampus
  at 5 weeks of age. (B) Diagram illustrating one-carbon metabolism, including folate,
  methionine, and transsulfuration pathways. Key metabolites analyzed include methionine
  (Met), serine, S-adenosyl-homocysteine (SAH), S-adenosyl methionine (SAM), methylthioadenosine
  (MAT), cystathionine, and glutathione. (C–J) Metabolomics analysis of cortex and
  brain stem tissues isolated from Sel1Lfl/fl (WT) and Sel1LSynCre (KO) mice at 5
  weeks of age. Panel D highlights selected regions showing changes in metabolites
  related to one-carbon metabolism. (E–J) Fold-change plots showing individual metabolites
  from the cortex and brain stem of Sel1Lfl/fl and Sel1LSynCre mice (n = 3 animals
  per brain region). The data presented are shown as mean ± SEM and were analyzed
  using a 2-way ANOVA with FDR correction. Significance levels are indicated as follows:
  **P < 0.01; ***P < 0.001. NS, not significant'
