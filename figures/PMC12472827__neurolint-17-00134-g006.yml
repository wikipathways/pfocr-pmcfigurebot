figure_title: Clinical utility of GFAP as a biomarker in TBI and AD.
caption: Clinical utility of GFAP as a biomarker in TBI and AD. Neuronal damage induced
  during TBI and AD pathogenesis will provoke astrocyte migration and morphological
  transformation. Studies speculate that there are different morphological phenotypes
  of astrocytes in TBI and AD. These multiple phenotypes of astrocytes will be instrumental
  in neuronal repair and healing. As a part of astrogliosis, there will be overproduction
  and concomitant release of GFAP into the neuronal extracellular space. GFAP will
  transverse through peri-arterial, capillary, peri-venous, and glymphatic pathways
  and will ultimately escape into the systemic circulation. The fluctuations of GFAP
  in the blood can be used as a premonition to forecast clinical severity and prognosis
  of TBI and AD. Unfortunately, due to TBI- and AD-induced encumbrances blocking the
  excretory pathway, smooth sailing of GFAP from brain circulation into systemic circulation
  should not be expected. Future research studies are needed to ascertain these impediments
  in the disease context before we can safely rely on GFAP for presaging disease-related
  changes in TBI and AD
