figure_title: Functional rescue of MICAL1/P-ERK pathway by Trem2 in T.
caption: 'Functional rescue of MICAL1/P-ERK pathway by Trem2 in T. gondii antigen-stimulated
  macrophage. (A) Overexpression of Trem2-Tyrobp in Raw264.7 cells: WB analysis of
  Trem2, MICAL1, P-ERK, and total ERK expression in pcSLenti-empty vector (control)
  and pcSLenti-Trem2-Tyrobp transfected cells, with or without TgAg (5 μg/mL, 48 h)
  treatment. (B) Overexpression of MICAL1 in Raw264.7 cells: WB analysis of MICAL1,
  P-ERK, total ERK, and Trem2 expression in pcSLenti-empty vector and pcSLenti-MICAL1-transfected
  Raw264.7 cells, with or without TgAg stimulation (5 μg/mL, 48 h). (C) WB analysis
  of MICAL1, P-ERK, and total ERK expression in BMDMs from wildtype and Trem2−/− mice
  (CON and TgAg). CON: Untreated control group; TgAg: Soluble T. gondii antigens;
  n = 3 per group; Statistical analysis was performed using two-way ANOVA with Sidak′s
  multiple comparisons test (A–C). Western blot bands were quantified using ImageJ,
  normalized to GAPDH'
