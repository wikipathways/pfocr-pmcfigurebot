figure_title: SiNPs induced EMT in BEAS-2B cells through the HSF1/HSPs signaling pathway.
caption: SiNPs induced EMT in BEAS-2B cells through the HSF1/HSPs signaling pathway.
  (A) Western blot results of EMT and HSF1/HSPs pathway-related proteins in BEAS-2B
  cells after 24 h of SiNPs exposure. (a) Representative images of Western blot. (b–g)
  Grayscale analysis of EMT-related proteins and the HSF1/HSPs signaling pathway affected
  by SiNPs using ImageJ, including HSF1, HSP90, HSP70, HSP27, E-cadherin, and N-cadherin,
  n = 3–4, and the data were expressed as mean ± S.D. (B) PCR results of EMT-related
  genes in BEAS-2B cells after 24 h of SiNPs exposure. (a–d) E-cadherin, Twist, MMP-3,
  and MMP-9. * p < 0.05 and ** p < 0.01, SiNP-treated group compared with the control
  group
