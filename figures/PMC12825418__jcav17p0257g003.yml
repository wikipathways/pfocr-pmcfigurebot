caption: RAS mutations in RMS and the corresponding drugs that target RAS signaling
  cascades. Activation of RTK leads to RAS switch to the active RAS-GTP. RAS-GTP activates
  RAF/MEK/ERK and PI3K/AKT pathways leading to increased cell proliferation and cell
  death escape. FDA approved RAF inhibitors and MEK inhibitors can inhibit RAS signaling
  cascades. The green stars label the mutations identified in RMS patients
