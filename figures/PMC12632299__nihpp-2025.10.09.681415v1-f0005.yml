figure_title: Liver versus muscle metabolomic responses to chronic alcohol
caption: 'Panel A: Volcano plots for differential metabolite analysis (Alcohol versus
  Control) in the liver and muscle. Red and blue shading denote significant upregulation
  and downregulation, respectively (adjusted P ≤ 0.1). Annotated metabolites are those
  significant metabolites ranked in top 10 upregulated/downregulated based on t-score.
  Panel B: Venn diagrams showing degree of overlap between metabolites upregulated/downregulated
  by chronic alcohol use in the liver and muscle. Panel C: Bubble plot depicting results
  from over-representation analysis of metabolite final class, super pathway and sub
  pathway annotations for metabolites commonly/uniquely dysregulated by chronic alcohol
  use in the liver and muscle (as per panel B). Circle size is proportional to the
  number of metabolite hits as a % of the total number of annotated metabolites for
  a given overlap. Red and blue shading denote significant over-representation in
  upregulated and downregulated metabolites, respectively (adjusted P ≤ 0.05, enriched
  for ≥ 2 metabolites)'
article_title: Chronic alcohol intake elicits distinct multi-omic profiles in the
  liver versus skeletal muscle of mice
