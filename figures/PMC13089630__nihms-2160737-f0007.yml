figure_title: Ingenuity Pathway Analysis (IPA) revealed that the dysregulated genes
  were associated with HIF-1α signaling and lung lipid metabolism, as well as with
  IL-15 and B cell receptor signaling in ENDS-exposed male and female mice, respectively
caption: A & B) The molecular signatures associated with the toxicological effects
  evaluated immediately after the 6-month exposure were associated with hypoxia signaling
  (HIF-1α), whereas the molecular changes following the 2-month recovery period were
  associated with lung lipid metabolism in ENDS-exposed male mice. C & D) In ENDS-exposed
  female mice, the dysregulated signaling pathways associated with IL-15 and B cell
  receptor signaling were conserved following the 2-month recovery period
article_title: Altered lung function in mice is a sensitive indicator of lung damage
  following 6 months of electronic nicotine delivery system (ENDS) aerosol exposure
