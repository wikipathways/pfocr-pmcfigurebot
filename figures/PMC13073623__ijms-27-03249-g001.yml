figure_title: Schematic diagram illustrating the interplay between metabolic reprogramming
  and epigenetic regulation in the pathogenesis of Takayasu arteritis (TAK).
caption: Schematic diagram illustrating the interplay between metabolic reprogramming
  and epigenetic regulation in the pathogenesis of Takayasu arteritis (TAK). In vascular
  smooth muscle cells, mutations in the ANK2 gene lead to mitochondrial stress and
  hyperpolarization of the mitochondrial membrane potential, inducing the accumulation
  of reactive oxygen species (ROS) and mitochondrial antiviral-signaling protein (MAVS)
  oligomerization. Mitochondrial metabolic reprogramming, through metabolites such
  as acetyl-CoA and lactate, affects epigenetic modifications of DNA and histones,
  thereby promoting the proliferation and migration of vascular smooth muscle cells.
  The release of mitochondrial DNA (mtDNA) activates the cGAS-STING signaling pathway,
  which in turn activates the downstream nuclear factor kappa B (NF-κB) signaling
  pathway, ultimately leading to increased expression of the pro-inflammatory cytokines
  IL-6 and IL-8. These pro-inflammatory factors recruit immune cells, such as T cells,
  neutrophils, and macrophages, causing infiltration of the vessel wall. T cells,
  regulated by the mTOR signaling pathway, undergo metabolic reprogramming toward
  glycolysis; their metabolic products are released into the microenvironment and
  may act on vascular smooth muscle cells to influence their epigenetic modifications.
  Activated and proliferating T cells release interferon-gamma (IFN-γ), which upregulates
  6-phosphofructo-2-kinase/fructose-2,6-bisphosphatase 3 (PFKFB3) activity in macrophages,
  promoting glycolysis and thereby diminishing oxidative phosphorylation. The persistent
  crosstalk between vascular smooth muscle cells and immune cells within the vessel
  ultimately leads to sustained inflammatory cell infiltration, wall thickening, luminal
  narrowing, and increased vascular permeability
article_title: 'Metabolic–Epigenetic Crosstalk in Takayasu Arteritis: The ANK2–MAVS–IL-8
  Axis as a Novel Therapeutic Paradigm'
