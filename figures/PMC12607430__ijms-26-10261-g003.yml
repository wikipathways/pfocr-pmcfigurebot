caption: 'Gene set enrichment analysis on the genes showing differentially methylated
  CpGs between ALL patients and controls using ingenuity pathway analysis (IPA). Plot
  shows the most significant terms for cellular components, biological processes,
  and molecular functions from the IPAs of DMC-annotated genes (p-values  <  0.05).
  X-axis: Statistical significance (−log10(p)), where higher values indicate greater
  relevance. Bubble size represents the number of genes involved in each pathway.
  Color indicates the IPA z-score, which predicts the direction of regulation. Orange:
  significant activation (z-score > 2). Blue: significant inhibition (z-score < −2).
  Gray: statistically significant pathways (p < 0.05) with no predicted direction
  of change'
