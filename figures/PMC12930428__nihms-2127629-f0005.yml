figure_title: Gene Expression Levels Associated with Cortical Surface Area and Growth
  Rate
caption: 'a, Heatmap showing the distribution of gene counts associated with brain
  growth rate (left) and surface area (right) across subclusters and time points in
  our regression model. Color intensity indicates the number of associated genes.
  In the subsequent panels, we focus on genes associated with CPN_sc_22 at day 14
  for growth rate (6–12) and surface area at 12 months (N=8 participants). b, UpsetR
  plot summarizing gene overlaps, c, Pathway enrichment analysis of associated genes,
  with key pathways such as “RHO GTPase effectors”, “Cell Cycle”. d, Scatter plots
  demonstrating correlations between sex-corrected growth rate and gene expression
  (three examples from RHO GTPase effectors). Family history and diagnostic status
  are indicated by color for each participant: HL-ASD (yellow), HL (red), LL (blue).
  e, PCA of gene expression from subset major cell types (Upper layer neuron (ULN),
  Inhibitory neuron (IN), cortical projection neuron (CPN), newborn deep layer projection
  neuron (DPLN), outer radial glia (oRG), apical radial glia (aRG)) colored by cell
  class (left). Extracted cells from CPN_sc_22 on the same dimension in the left panel.
  Color intensity indicates cell count density (right). Three lineages (ULN: purple,
  newborn neuron: blue, RG: red) were annotated using inferred pseudotime. f, CPN_sc_22
  genes positively associated with brain growth or surface area were enriched in microcephaly
  and ASD related genes'
