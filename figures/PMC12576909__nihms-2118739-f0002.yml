figure_title: Possible mechanisms by which fibrinolytic factors promote cancer progression
  and metastasis
caption: Plasmin releases growth factors bound to the extracellular matrix, such as
  fibroblast growth factor (FGF)-2, hepatocyte growth factor (HGF), and transforming
  growth factor (TGF)-β1. These growth factors can enhance tumor growth. Plasmin also
  degrades basement membrane proteins, resulting in increased cancer cell migration.
  Furthermore, plasmin activates pro-matrix metalloproteinases, which degrade extracellular
  matrix and enhance cancer cells migration and invasion into tissues. Plasmin activates
  vascular endothelial growth factor (VEGF)-C and VEGF-D, which stimulate lymphangiogenesis
  and angiogenesis in tissues and tumors by activating the receptor tyrosine kinases
  VEGF receptor (R)-2 and VEGFR-3. These lymphangiogenic growth factors promote metastasis
  via the lymphatic system. Tissue plasminogen activator (tPA) binds to and activates
  lipoprotein receptor-related protein (LRP) 1, which enhances tumor growth, recruitment
  of mesenchymal stem cells into the tumor bed, and metastasis. Urokinase plasminogen
  activator (uPA) activates ERK signaling, which is a pro-survival pathway in cancer
  cells, possibly via urokinase plasminogen activator receptor (uPAR). uPAR interacts
  with integrin α5β1 and this leads to activation of the focal adhesion kinase signaling,
  which increases tumor growth
