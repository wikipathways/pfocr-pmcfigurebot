figure_title: Quantitative real-time PCR of grass carp muscle.
caption: 'Quantitative real-time PCR of grass carp muscle. CON: control group; FB:
  faba bean group; VIC: vicine group. (A) Gene expression of ROS metabolism pathways:
  COX1, COX2, CuZnSOD, GST, CAT. (B) Expression of caspase-dependent apoptosis pathway
  genes: Caspase-3, Caspase-8, Caspase-9, Cyto-C, Apaf-1. (C) Gene expression of muscle
  proliferation and differentiation pathways: Pax-7, STK-3, CAD, MyoD, MyoG. (D) Expression
  levels of myofibrillar protein-encoding genes: MyHC, Troponin, Tubulin. For each
  treatment group, three tanks were used, with three fish per tank pooled to generate
  three biological replicates. Data are presented as means ± SDs, and one-way ANOVA
  followed by Duncan’s test was performed to determine statistical significance, ***
  p < 0.001, ** p < 0.01, or * p < 0.05'
