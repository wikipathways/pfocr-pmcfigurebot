figure_title: Proposed mechanisms for the beneficial impact of PDA NPs on cognitive
  function.
caption: Proposed mechanisms for the beneficial impact of PDA NPs on cognitive function.
  After systemic administration, PDA NPs cross the BBB and are subsequently degraded
  by cells, influencing brain function. In the short term, PDA NPs elevate brain dopamine
  (DA) levels, which improves cognitive performance. In the long term, PDA NPs enhance
  hippocampal acetylcholine (ACh) levels by activating cholinergic projections from
  the medial septal nucleus (MS) to the hippocampus, partly through DA D2 receptor-mediated
  pathways
article_title: Polydopamine nanoparticles restore cognition via targeted dopamine
