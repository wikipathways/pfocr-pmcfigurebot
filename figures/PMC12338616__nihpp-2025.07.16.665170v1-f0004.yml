figure_title: The var2csa uORF is responsible for degradation of var2csa transcripts
  in the switcher clones
caption: (A) Model for var gene switching and the role of var2csa as a sink-node.
  Wild type switcher parasites transiently activate var2csa (red) in the beginning
  of the cell cycle. The uORF present upstream of the gene is recognized as a premature
  stop codon and var2csa mRNAs are destabilized through the nonsense mediated decay
  (NMD) pathway. This results in parasites that either continue to express the same
  var gene transcribed in the previous cell cycle (blue) or switch to a new var gene
  (purple). (B) Model for switching in NMD-deficient lines. In absence of NMD, the
  var2csa mRNA is stabilized despite the presence of the uORF, resulting in parasite
  unable to switch away from expressing var2csa. (C) Pie charts representing var expression
  profiles of a switcher clone (upper) and a non-switcher clone (bottom) before and
  after disruption of the gene encoding UPF3B, a protein required for the NMD pathway.
  Expression of each var gene was determined by quantitative RT-PCR and represented
  as relative to seryl-tRNA synthetase (PF3D7_0717700). (D) Pie charts representing
  var expression profiles of a switcher clone (upper) and a non-switcher clone (bottom)
  before and after uORF elimination. Expression of each var gene was determined by
  quantitative RT-PCR and represented as relative to seryl-tRNA synthetase (PF3D7_0717700).
  The schematic shows the point mutation (M>I) that eliminates the start codon and
  disrupts the uORF
