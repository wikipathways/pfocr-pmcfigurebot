figure_title: 'HCC surveillance: summary and future outlook.'
caption: 'HCC surveillance: summary and future outlook. (A) The current challenges
  and future strategies for hepatocellular carcinoma (HCC) surveillance are illustrated.
  On the left, the limitations of standard surveillance methods—such as low patient
  adherence and reduced sensitivity, especially in populations with metabolic-associated
  steatotic liver disease (MASLD)—are highlighted. The central section presents the
  three pillars of future strategy: (1) advanced imaging technologies, (2) novel biomarkers,
  and (3) AI-assisted detection, all aimed at improving diagnostic accuracy and early
  detection. Below, implementation strategies, including adherence strategies such
  as outreach and nudges, and a focus on health equity, are emphasized to address
  socio-economic and geographic disparities. The right section shows the integrated
  future solution, which aims to maximize early detection, improve survival, and achieve
  optimal cost-effectiveness while ensuring equitable access to HCC surveillance globally.
  (B) A cost-effective surveillance protocol for HCC based on annual risk assessment,
  incorporating current evidence. The left side depicts a decision pathway for surveillance,
  while the right side provides four supplementary points to enhance the understanding
  of the protocol. AFP, alpha-fetoprotein; AI, artificial intelligence; AMRI, abbreviated
  magnetic resonance imaging; CT, computed tomography; HBV, hepatitis B virus; HCV,
  hepatitis C virus; MRI, magnetic resonance imaging; NAFLD, non-alcoholic fatty liver
  disease; US, ultrasound'
