figure_title: Ciliogenesis model and comparison between WT and EXOC6A KO cells
caption: EXOC6A is located at the PCV/CV/ciliary sheath, and Myo-Va mediated the transportation
  of EXOC6A vesicles to the mother centriole via a dynein-, microtubule-, and actin-dependent
  pathway. EXOC6A-associated vesicles are continuously recruited and fused or excreted
  from the CVs or ciliary membrane. Depletion of EXOC6A impairs ciliogenesis, and
  most cells are arrested at the CV stage. There is a lack of MKS module proteins
  of the TZ in cilia with defects in EXOC6A KO cells. PCV, preciliary vesicle; CV,
  ciliary vesicle; DA, distal appendage; sDA, subdistal appendage
