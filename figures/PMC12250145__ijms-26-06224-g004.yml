figure_title: Regulatory role of bile acid metabolites on host skeletal muscle transcript
  expression.
caption: Regulatory role of bile acid metabolites on host skeletal muscle transcript
  expression. (A) Two-way orthogonal PLS (O2PLS) loadings plot for metabolome–transcriptome
  integration, identified associations between 15 key bile acid (BA) metabolites and
  longissimus dorsi differentially expressed genes (DEGs), while gray dots denote
  other unmarked common data points, which provides a comprehensive landscape of multi-omics
  interactions. (B) Bipartite zoom plot of loadings highlighted core interactions,
  where red dots (BAs) and blue triangles (DEGs) were positioned by covariance strength.
  Node spacing reflects r, with distant layouts denoting strong negative correlations.
  (C) Network diagram illustrated Spearman correlation between differential BA metabolites,
  DEGs, and significant enrichment pathway (|r| > 0.8, p < 0.05)
