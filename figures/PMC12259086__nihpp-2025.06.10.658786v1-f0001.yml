figure_title: Activity of RAS(ON) multi-selective inhibitor RMC-7977 in AML cell lines
caption: 'A-C: Concentration-response curves representing relative proliferation of
  AML cell lines driven by FLT3 (A), KIT (B), NRAS or KRAS mutations (C) after 48
  h of exposure to serial doses of RMC-7977. Data represent the mean ± SD of three
  replicates. D: Western blot analysis of seven AML cell lines exposed for 2 hours
  to indicated concentrations of RMC-7977; β-actin was used as loading control. E-F:
  Bubble plots showing enrichment of GSEA Hallmark gene sets expression in Molm-14
  and OCIAML-3 cell lines after exposure for 24 hours to RMC-7977 (25 nM). The size
  of the bubbles represents statistical significance, and the colors indicate upregulated
  (red) or downregulated (blue) expression. G-H: PROGENy pathway activity scores in
  Molm-14 and OCIAML-3 cells after exposure for for 24 hours to RMC-7977 (25 nM)'
article_title: Multi-selective RAS(ON) Inhibition Targets Oncogenic RAS Mutations
