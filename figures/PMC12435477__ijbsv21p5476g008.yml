figure_title: WDR74 knockdown disrupts the interaction between p53 and MDM2.
caption: WDR74 knockdown disrupts the interaction between p53 and MDM2. A. Western
  blot analysis of p53 and MDM2 protein expression in WDR74-knockdown and WDR74 overexpressing
  HCC cells. B. HCC cells were transfected with siWDR74 for 48 hours. Co-immunoprecipitation
  (Co-IP) analysis was performed to assess the interaction between p53 and MDM2. Cell
  lysates were immunoprecipitated using anti-p53 or anti-MDM2 antibodies, followed
  by immunoblotting with the indicated antibodies. C. WDR74 promotes p53 ubiquitination.
  Cells were transfected with Ub-HA plasmids and treated with 10 μM MG132 for 3 hours.
  p53 Immunoprecipitated using anti-p53 antibodies, and ubiquitinated p53 was detected
  by anti-HA immunoblotting. D-I. Relative lipid ROS levels (D, E), MDA levels (F,
  G), and GSH levels (H, I) in CAPG-knockdown cells with or without WDR74 overexpression
  and in CAPG-overexpressing cells with or without WDR74 knockdown. J, K. Western
  blot analysis of proteins involved in the WDR74-p53-SLC7A11 pathway in 97H and Huh7
  cells. *P < 0.05, **P < 0.01, ***P < 0.001, ns = not significant
