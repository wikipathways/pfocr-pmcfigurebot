caption: 'Ferulic acid extensively regulated the expression of genes involved in ferroptosis.
  (A) The volcano plot showed all genes detected from the LPS and control groups.
  (B) KEGG pathways of differential genes between the LPS and control groups. (C)
  The relative mRNA levels of ACSL4 were determined by real-time PCR. (D) The volcano
  plot showed all genes detected from the FA and LPS groups. (E) KEGG pathways of
  differential genes between the FA and LPS groups. (F) The relative mRNA levels of
  GCLC were determined by real-time PCR. Control: control group; LPS: LPS group; FA:
  LPS + FA750 group. Statistical significance is indicated by * p < 0.01'
