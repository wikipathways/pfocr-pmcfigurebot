figure_title: Enriched neuronal pathways and corresponding interaction structure.
caption: Enriched neuronal pathways and corresponding interaction structure. (A) Top
  enriched neuronal pathways derived from the 44 neuronal-related genes. Bars indicate
  the number of genes mapped to each KEGG pathway, highlighting glutamatergic synapse,
  retrograde endocannabinoid signaling, and oxytocin signaling as the most represented
  pathways. (B) STRING protein–protein interaction network of genes mapped to the
  three enriched pathways. Nodes represent genes and edges denote predicted functional
  associations. The network illustrates the overall connectivity among pathway members.
  Red = Glutamatergic synapse; Green = Retrograde endocannabinoid signaling; Blue
  = Oxytocin signaling pathway
