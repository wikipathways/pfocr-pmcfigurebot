figure_title: Protein-protein interaction and enrichment analysis among proteins showing
  a significant association with MACE or hard MACE
caption: (A) Confidence-based protein interaction network using all available interactions
  sources. The width of the edges between the proteins represents the overall confidence
  score. The average number of connections between the protein nodes is 6.21, while
  IL-6 and IL-8 are connected to 21 and 18 proteins, respectively. (B) Gene Ontology
  and Reactome functional enrichments analysis. Gene Ontology biological processes,
  molecular function, and Reactome pathway enrichment all indicated increased representation
  of cytokine and chemokine processes and pathway functions within our significant
  proteins. CCR, chemokine-chemokine receptor
