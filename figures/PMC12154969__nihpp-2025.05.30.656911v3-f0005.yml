figure_title: Overlapping miRNAs matched between maternal milk-derived extracellular
  vesicles (MEVs) and the hippocampus of their nursing male and female neonatal offspring
caption: '(A, C, E, G) Venn diagrams showing the number of miRNAs found in MEVs at
  P11 (yellow) and the hippocampus of male (blue) and female (red) offspring at P12,
  and their overlapping miRNA in groups (A) SD-Saline, (C) SD-LPS, (E) EE-Saline,
  and (G) EE-LPS. (B, D, F, H) The bubble plots show the -Log (p-value) of the top
  5 enriched miRWalk pathways identified for the overlapping miRNA in (B) Figure A,
  (D) Figure C, (F) Figure E, and (H) Figure G, using the miRNA Enrichment Analysis
  and Annotation Tool (ccbcompute2.cs.uni-saarland.de/mieaa). miRNA count per pathway
  is indicated by bubble size. LPS: lipopolysaccharide; P: postnatal day; SD: standard
  housing; EE: environmental enrichment; n = 6'
