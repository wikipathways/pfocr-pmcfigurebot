figure_title: CRS Increases miR-17-5p Levels in vHPC and Its Impact on Synaptic Function.
caption: CRS Increases miR-17-5p Levels in vHPC and Its Impact on Synaptic Function.
  (A) CRS does not alter the relative normalized levels of miR-92a-3p in the vHPC,
  (B) while it significantly increases those of miR-17-5p; both members of the miR-17–92
  cluster. Data were analyzed by 2-Δ(ΔCt) using miR-103–3p as normalizer and then
  by a two-tailed t-test. *P<0.05. Graph bars represent the mean ± SEM. (C) Functional
  enrichment analysis conducted using SynGO. The graph represents the top ten processes
  in which validated miR-17-5p targets are involved. The bubble size indicates the
  ratio between the number of targets and the total number of molecules in the pathway.
  CC = Cellular Component, BP = Bioprocess
