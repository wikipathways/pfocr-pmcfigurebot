figure_title: Frmd5 depletion suppresses apoptosis in mice vaginal epithelium.
caption: 'Frmd5 depletion suppresses apoptosis in mice vaginal epithelium. (A) RNA-seq
  analysis of total RNA extracted from vaginal tissues of Cdh16-Cre-; Frmd5flox/flox
  and Cdh16-Cre+; Frmd5flox/flox mice at 2 months of age. Genes exhibiting a fold
  change ≥ 2 between the two groups (Cdh16-Cre+; Frmd5flox/flox vs. Cdh16-Cre-; Frmd5flox/flox)
  are shown in blue (downregulated) or orange (upregulated). P value < 0.05. (B) GO
  analysis of biological process enriched among genes regulated by Frmd5. (C) KEGG
  pathway enrichment analysis of genes regulated by Frmd5. (D) Heatmap illustrating
  the expression levels of apoptosis-related genes among the differentially expressed
  genes, with color ranging from blue to red indicating low to high gene expression
  levels. (E) Validation of mRNA expression changes in apoptosis-related genes using
  qPCR, using Gapdh as an internal control. (F) TUNEL staining analysis of epithelial
  cell apoptosis in the vagina before and after Frmd5 knockout. (G) Quantification
  of TUNEL-positive cells among vaginal epithelial cells. (H) Immunostaining of Casp3
  to assess epithelial cell apoptosis in the vagina before and after Frmd5 knockout.
  (I) Quantification of Casp3-positive cells among vaginal epithelial cells. (J) BrdU
  staining analysis of epithelial cell proliferation in the vagina before and after
  Frmd5 knockout. (K) Quantification of BrdU-positive cells among vaginal epithelial
  cells. The scale bars in F, H, and J: original images 50 μm, magnified images of
  the highlighted regions 20 μm. Experiments were independently repeated at least
  three times and statistical significance was determined by t-tests. Data are presented
  as mean ± SEM. * P < 0.05, ** P < 0.01'
