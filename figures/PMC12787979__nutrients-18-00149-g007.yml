caption: 'In silico analysis of miRNAs and their target genes associated with beer
  consumption. (A) Tissue sources of miR-144-5p and miR-19a-3p were obtained using
  the miTED database. WBC: white blood cells. PBMNC: peripheral blood mononuclear
  cells. (B) Number of target genes (protein-coding RNA) obtained from miRWalk and
  the Cytoscape platform. (C) The target genes were analyzed using the ShinyGO database
  (KEGG and PANTHER) to obtain the signaling pathways involved with the miRNA regulation.
  (D) In silico analysis by Cytoscape showed the target genes with molecular interactions'
