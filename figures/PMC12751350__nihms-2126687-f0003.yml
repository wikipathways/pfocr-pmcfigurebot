figure_title: Identification of HSATII RNA interacting proteins
caption: '(A) Experimental schematic showing ChIRP protocol (Chu et al., 2012). (B)
  RT-qPCR showing enrichment of RPL27, ZSCAN4 or HSATII RNA in ChIRP pulldowns using
  either control ASOs or HSATII-specific ASOs in +DOX iDUX4 cells. N=3 biological
  replicates per experiment (small black points). A total of three independent experimental
  replicates were performed (colored points). (C) Immunoblot showing enrichment of
  known HSATII interacting proteins MeCP2 and eIF4A3 in ChIRP pulldowns (PD) using
  either control ASOs (CTRL) or HSATII-specific ASOs (HSATII) in −DOX or +DOX iDUX4
  cells. GAPDH used as loading control for inputs and negative control for PD samples.
  5% input was removed prior to RNA pulldown. Immunoblot shows two biological replicates.
  N=2 per condition. A total of three experimental replicates were performed. Quantification
  of immunoblot is shown below. (D) Biological process pathway analysis of HSATII
  RNA associated RNPs (HSATII-RNP) proteomics filtered protein hits (>2 unique peptide
  matches and >1.5 difference) ran through Enrichr. HSATII-RNP complexes were isolated
  from −DOX or +DOX iDUX4 cells harvested at the 24-hour time point using the “ChIRP”
  approach (Chu et al., 2012). Protein was purified from isolated HSATII-RNP complexes
  using antisense oligonucleotides (ASO) targeting HSATII or control sequences and
  was subjected to mass-spectrometry. Proteomics was performed in biological triplicate.
  (E) Validation of selected proteins identified through HSATII-RNP proteomics: m5C-related
  factors YBX-1 and m6A-related factors YTHDC1, WTAP, and VIRMA. Proteins were isolated
  as stated in Fig. 3B. GAPDH was used as a loading control for inputs and negative
  control for pulldown samples. 5% input was removed prior to RNA pulldown. N=1 per
  condition. A total of three independent experimental replicates were performed.
  CTRL, Control ASO; HSATII, HSATII-specific ASO; PD, pulldown. Quantification of
  immunoblot is shown right'
