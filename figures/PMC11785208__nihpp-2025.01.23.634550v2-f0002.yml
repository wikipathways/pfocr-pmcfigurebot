figure_title: (A) UMAP embedding of the mouse GI tract at E14.
caption: |-
  (A) UMAP embedding of the mouse GI tract at E14.5 colored by the 7 major cell types detected. (B) Homozygous loss of mcs+9.7 has no significant effect on any cell type at E14.5 (p=0.18; hypergeometric test). (C) ENS cells cluster into 6 major cell types/states with (D) a clear differentiation pathway along a defined developmental trajectory (using Monocle). (E)
  Ret gene expression is significantly diminished only in the ENS. (F) Differential gene expression shows significant loss of expression of key neuronal genes in the Δmcs+9.7/Δmcs+9.7; +/+ embryos compared to wildtype. (G) Loss of mcs9.7 activity significantly affects Ret gene expression in differentiating neurons, glia and inhibitory motor neurons (** p<0.01), however, (H) there is no loss in cell numbers in any ENS cell type/state in Δmcs+9.7/Δmcs+9.7; +/+ embryos as compared to the wildtype. The data are presented as means with standard errors (** p<0.01; Wilcoxon rank sum test for gene expression and hypergeometric test for cell counts)
article_title: Synergistic effects of Ret coding and enhancer loss-of-function alleles
  cause progressive loss of inhibitory motor neurons in the enteric nervous system
