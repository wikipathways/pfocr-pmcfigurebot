figure_title: 'Requirement of cilia in Hh signal processing and transmission and its
  impact on PCa:'
caption: A. Cilia are essential for the proper processing and transmission of Hh signals.
  Ligand absence inhibits the Hh pathway via inhibiting Smo. In the presence of Hh
  ligands, SMO is activated and translocates to the ciliary membrane. This leads to
  the degradation of Ptch1 and posttranslational modification and processing of Gli
  proteins and subsequent activation of Hh target genes. B. The presence and functionality
  of cilia are crucial for modulating Hh signaling pathways. Disruptions/loss of ciliary
  function can lead to aberrant Hh signaling, contributing to tumor growth and progression
