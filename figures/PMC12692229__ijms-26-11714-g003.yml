figure_title: The schematic illustration of the controversial roles of Kruppel-like
  transcription factor 4 (KLF4) in atherosclerosis.
caption: The schematic illustration of the controversial roles of Kruppel-like transcription
  factor 4 (KLF4) in atherosclerosis. KLF4 has both beneficial and hazardous roles
  in atherosclerosis. Regarding beneficial effects, KLF4 restores autophagy to prevent
  vascular smooth muscle cell (VSMC) dysfunction, suppresses endothelial-to-mesenchymal
  transition (EndMT) via suppressing transforming growth factor (TGF-β) activity,
  suppresses proinflammatory cytokines to inhibit monocyte-EC adhesion, and attenuates
  ferroptosis by upregulating glutathione peroxidase 4 (GPX4) and solute carrier family
  7 member 11 (SLC7A11), and represses NOD-like receptor protein 3 (NLRP3) inflammasome,
  thereby mitigating pyroptosis. Additionally, KLF4 promotes M1-to-M2 macrophage polarization
  via the cholesterol 25-hydroxylase (Ch25h)/liver X receptor (LXR) axis and peroxisome
  proliferator-activated receptor gamma (PPARγ)/signal transducer and activator of
  transcription 6 (STAT6) pathway. Regarding hazards, KLF4 induces a switch of VSMCs
  from a contractile to a mesenchymal-like phenotype and drives SMC differentiation
  into Lgals3+ cells, which contribute to plaque formation. In the diagram, red “+”
  symbols (promotion) and green “−“ symbols (inhibition) are used to indicate how
  KLF2 influences various biological processes involved in atherosclerosis
