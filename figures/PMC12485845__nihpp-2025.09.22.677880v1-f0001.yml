  right, BPhe; bottom right, menaquinone QA; bottom center, iron atom; bottom left,
  menaquinone QB. Arrows show the pathway of electron transfer. Image is based on
  the R. castenholzii structure 5YQ7.pdb [1]. Image created using Chimerax [2]
