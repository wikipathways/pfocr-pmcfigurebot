figure_title: Exogenous Recombinant col8a1 Exposure Enhances Endothelial Phenotype
caption: '(A) Brightfield images, showing the phenotypic changes, of HAECs seeded
  on plate surfaces coated with either PBS, recombinant col8a1 (rcol8a1), gelatin,
  BSA, or collagen type I (col1). In the rcol8a1 Treatment, cells were seeded directly
  onto the non-coated surfaces, and rcol8a1 was added directly to the culture medium.
  Culture duration was for 24 hours (Scale bar: 100μm).(B) Gene Ontology (GO)-biological
  process (BP) analysis of HAECs cultured on BSA or rcol8a1-coated plates for 24 hours,
  showing the pathway enrichments based on the RNA sequencing data.(C) Gene Set Enrichment
  Analysis (GSEA) of HAECs cultured on BSA or rcol8a1-coated plates for 24 hours,
  showing the positively enriched pathways in rcol8a1 group and the differentially
  expressed gene list based on the bulk RNA-seq analysis. Statistical analysis by
  two-tailed Student’s t-test, and the values are expressed as mean±SEM.(D) Brightfield
  images of HAECs seeded on plate surfaces coated with either rcol8a1 or BSA following
  with TNF-α treatment for 4 days (Scale bar: 100μm).(E) RT-qPCR analysis of PECAM1
  and CDH2 expression in HAECs cultured on BSA or rcol8a1-coated plates following
  with TNF-α treatment (n = 6). Statistical analyses by two-tailed Student’s t-test,
  and the values are expressed as mean±SEM'
