figure_title: Chemogenetic inhibition of the PL → PVT pathway attenuates cued heroin
  seeking.
caption: Chemogenetic inhibition of the PL → PVT pathway attenuates cued heroin seeking.
  A, A schematic of the viral strategy employed in our experiment. An AAVrg expressing
  Cre or Cre-eGFP was injected into the PVT, and an AAV expressing hM4Di-mCherry or
  mCherry control was bilaterally injected into the PL. B, Experimental timeline for
  heroin self-administration, abstinence, and cued seeking testing. C, Active and
  inactive lever presses and (D) heroin infusions during self-administration for the
  hM4Di and mCherry control groups. E, Active and inactive lever presses during the
  cued heroin seeking test. In vehicle-treated groups, active lever responding did
  not differ between mCherry controls and hM4Di animals (left). Chemogenetic inhibition
  of PL → PVT neurons significantly reduced active lever presses in hM4Di animals
  compared with mCherry controls (right). F, Representative images showing mCherry
  fluorescence in PL neurons from mCherry control animals. G, Representative ex vivo
  whole-cell recording from an hM4Di mCherry-labeled PL neuron (top) shows current-evoked
  action potentials before and after J60 (10 μM) application (bottom). DIC, differential
  interference contrast. H, Bath application of J60 significantly reduced the number
  of action potentials (n = 15 cells/4 rats). I, Representative images showing (from
  left to right) a wide-field view of hM4Di-mCherry expression in the PL (red), retrogradely
  labeled Cre-eGFP (green), hM4Di mCherry-expressing neurons (red), and the overlap
  (merge; yellow) of hM4Di mCherry-labeled neurons and Cre-eGFP in the PL. J, Representative
  images showing (from left to right) a wide-field view of Cre-eGFP expression in
  the PVT (green; 3V, third ventricle), Cre-eGFP expression (green), hM4Di mCherry-labeled
  PL terminals (red), and the overlap (merge; yellow) of hM4Di mCherry-labeled PL
  terminals and Cre-eGFP in the PVT (yellow). Data are shown as mean ± SEM and individual
  data points. **p < 0.01, ***p < 0.001
article_title: Chemogenetic Inhibition and Optogenetic Depotentiation of the Prelimbic
  Cortex to Paraventricular Thalamus Pathway Attenuate Abstinence-Induced Plasticity
