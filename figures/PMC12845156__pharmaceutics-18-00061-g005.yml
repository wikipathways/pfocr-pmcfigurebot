caption: Biological Process (BP) and KEGG pathway charts derived from GO and KEGG
  analyses of clusters identified via PPI analysis in STRING. Specifically, panels
  (A,B) pertain to Cluster 1; panels (C,D) illustrate Cluster 2; and panels (E,F)
  show Cluster 3. Panel (G) displays the BP of Cluster 4, and panel (H) presents the
  KEGG analysis of Cluster 9. For clarity and consistency, the color associated with
  each cluster corresponds to the color assigned by the STRING software, as indicated
  in Supplementary Table S3. All data were filtered using a Benjamini–Hochberg adjusted
  p-value ≤ 0.01. The dots in the legend represent the gene count for each specific
  term identified
