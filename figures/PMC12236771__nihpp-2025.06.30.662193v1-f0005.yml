figure_title: Functional distribution of genetic interactions
caption: (A) (i) Schematic of genetic interactions within the functional hierarchy
  of the HAP1 genetic interaction profile similarity network, showing genetic interactions
  that occur within the same complex/pathway, biological process, or cellular compartment,
  and distant interactions between compartments (see Fig. 2). (ii) Line graph showing
  the observed genetic interaction density for genes within the same hierarchy level
  for negative (blue) and positive (yellow) genetic interactions (|qGI| > 0.3, FDR
  < 0.1). Pie charts indicate the total number of gene pairs examined at each level
  of the functional hierarchy. Horizontal dashed line show background density of negative
  and positive interactions. Analysis includes ~1600 genes with high-confidence profiles
  but excludes mitochondrial-related genes (right). (B) Functional distribution of
  all negative (blue) and all positive (yellow) interactions (|qGI| > 0.3, FDR< 0.1)
  in the genetic network hierarchy. Genes with mitochondrial-related function are
  excluded from this analysis. (C) Fraction of negative (blue) and positive (yellow)
  interactions within specified qGI score ranges connecting genes within different
  functional levels. Different shades of blue and yellow correspond to levels of functional
  relatedness shown in B. Analysis includes ~1600 genes with high-confidence profiles,
  excluding mitochondrial-related genes. (D) Network density of genetic interactions
  (|qGI| >0.3, FDR < 0.1) within and across biological processes for 14 enriched gene
  sets, as defined in Fig. 1B. Diagonal nodes represent interactions within bioprocesses,
  off-diagonal nodes represent interactions between bioprocesses. Node size reflects
  the fraction of interacting gene pairs. The average density of negative and positive
  interactions observed within and between bioprocesses is shown in the box plots.
  (E) (i) Network map showing regions of the HAP1 profile similarity network enriched
  for genes with negative (blue) or positive (yellow) consensus genetic interactions
  with a VPS52 query gene (n=5 biological replicates). (ii) Genes encoding members
  of vesicle tethering complexes showing coherent genetic interactions with VPS52.
  (iii) Most genes with roles in the cholesterol biosynthesis pathway show positive
  interactions with the VPS52 query gene
