figure_title: Functional enrichment analysis of the high- and low-risk groups based
  on the palmitoylation-related model.
caption: Functional enrichment analysis of the high- and low-risk groups based on
  the palmitoylation-related model. (a) GSVA analysis of hallmark gene sets, showing
  distinct pathway enrichments between the high- and low-risk groups. High-risk patients
  are enriched in pathways related to heme metabolism, PI3K/AKT/mTOR signaling, adipogenesis,
  and fatty acid metabolism, while low-risk patients show enrichment in pathways such
  as allograft rejection and coagulation. (b, c) GO functional enrichment analysis
  highlighting significant differences in biological processes between the high- and
  low-risk groups. (d) KEGG pathway analysis comparing enriched pathways between the
  high- and low-risk groups, demonstrating key differences in amino acid metabolism,
  infectious diseases, cell growth and death, and signal transduction
