figure_title: COLEC12high TAMs drive lenvatinib resistance through paracrine-mediated
  stemness reprogramming.
caption: 'COLEC12high TAMs drive lenvatinib resistance through paracrine-mediated
  stemness reprogramming. (A) Workflow schematic: THP-1–derived macrophages, MDMs,
  or TAMs expressing COLEC12 (COLEC12OE) or vector control produce CM, which is applied
  to Huh7 and Hep3B cells. (B) Lenvatinib sensitivity in Huh7 cells (n=3): up, proliferation
  by CCK-8 under 2.5 µM lenvatinib; down, colony formation at 0, 2.5, and 5 µM. (C)
  Subcutaneous xenograft (n=6): tumor images, growth curves, final weights with intratumoral
  CM+lenvatinib or PBS. Orthotopic liver model: Liver-to-body weight ratios with intraperitoneal
  CM+lenvatinib or PBS. (D) Bulk RNA-seq of Huh7 cells treated with COLEC12OE CM or
  Vector CM, followed by pathway enrichment. Stemness assays (n=3): qRT–PCR for SOX2/OCT4/CD44/CD133;
  limiting dilution; immunofluorescence of tumors (scale bar, 100 µm); sphere formation
  (scale bar, 100 µm). (E) In vivo limiting dilution assay in subcutaneous models
  (n=6), with tumor-initiating cell frequencies shown in the chart and table. Data
  are presented mean±standard error of the mean. Two-group: Student’s t-test; multiple
  groups: one-way ANOVA; limiting dilution: Kruskal–Wallis. COLEC12, Collectin Subfamily
  Member 12; TAMs, tumor-associated macrophages; MDMs, monocyte-derived macrophages;
  COLEC12OE, COLEC12-overexpressing; CM, conditioned medium. *P<0.05, **P<0.01, ***P<0.001.
  Source data are available'
