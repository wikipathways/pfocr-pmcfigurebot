caption: Activation of the PERK signaling pathway in astrocytes promoted MANF expression,
  upregulated synaptic proteins expression, and enhanced cell viability, while knockdown
  of MANF reversed these effects. (A) Grouping and experimental procedure. (B, C)
  Western blot analysis of MANF in astrocytes (n = 5). (D) CCK8 detected neuronal
  viability (n = 6). (E–G) Western blot analysis of synaptic proteins PSD95 and SYP
  in neurons (n = 5). ns, Not significant. ⁣∗p < 0.05, ⁣∗∗p < 0.01, ⁣∗∗∗p < 0.001,
  ⁣∗∗∗∗p < 0.0001
