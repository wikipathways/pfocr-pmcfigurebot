figure_title: Integrated Pathogenic Pathways Linking Mitochondrial Dysfunction, Epithelial
  Damage, Fibroblast Activation, and Tumor Progression in the Tumor Microenvironment.
caption: Integrated Pathogenic Pathways Linking Mitochondrial Dysfunction, Epithelial
  Damage, Fibroblast Activation, and Tumor Progression in the Tumor Microenvironment.
  Mitochondrial stress increases mitoROS, triggering ATM/ATR–p53 signaling, cell-cycle
  arrest, senescence, and NF-κB-mediated chronic inflammation. In epithelial cells,
  DNA damage and p53 activation enhance EMT transcription factors (SMADs, SNAIL, TWIST,
  ZEB1), MMP production, and ECM degradation, driving invasion and metastasis. TGF-β-induced
  fibroblast activation generates α-SMA+ CAFs, which promote ECM remodeling and immunosuppressive
  cytokine release (IL-6, TGF-β, CXCL12). Tumor cells amplify NF-κB/STAT3 signaling,
  increase PD-L1 expression, recruit Tregs, and induce M2 macrophage polarization,
  collectively fostering an immunosuppressive, pro-tumorigenic microenvironment
