figure_title: Nf1 metabolic effects require mTOR in addition to MAPK signaling mechanisms
caption: '(A) Diagram highlighting the mTOR arm of the Nf1/Ras signaling pathway.
  Green arrows represent the direction of signaling change following loss of Nf1.
  Red X marks show the molecules targeted for in vivo genetic analyses in panels B-E.
  (B) CO2 production (arbitrary units; AU) in flies bearing an RNAi targeting Nf1,
  Akt, or both, along with controls. *p < 0.05, **p < 0.01; n.s.: not significant
  (Dunn’s test, two-sided; n = 8–9). (C) CO2 production in flies bearing an RNAi targeting
  Nf1, Raptor, or both, along with controls. **p < 0.01, ***p < 0.001; n.s.: not significant
  (Šidák, n = 9–10). (D) CO2 production in flies bearing an RNAi targeting Nf1, S6K,
  or both, along with controls. ***p < 0.001; n.s.: not significant (Šidák, n 8–10).
  (E) CO2 production in flies bearing an RNAi targeting Nf1, 4E-BP, or both, along
  with controls. *p < 0.05, **p < 0.01; n.s.: not significant (Šidák, n = 10)'
article_title: Metabolic and behavioral effects of neurofibromin result from differential
