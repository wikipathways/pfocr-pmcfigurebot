figure_title: Far UV CD spectra (A) and Differential scanning calorimetry (B) of WT-ThaPK
  () and (C) of ECTS truncated-ThaPK ().
caption: Far UV CD spectra (A) and Differential scanning calorimetry (B) of WT-ThaPK
  () and (C) of ECTS truncated-ThaPK (). In (A), the spectra were obtained in mixtures
  containing 100 μg/mL of the WT-ThaPK or truncated-ThaPK in 20 mM NaH2PO4-NaOH, pH
  7.0, at 25 °C in a 0.1 cm cell pathway. CD is expressed as θMRE (molar residue ellipticity).
  In (B,C), the protein concentrations were 1.0 mg/mL, 16.3 μM monomer of the wild
  type, and 19.41 μM monomer of the ECTS-truncated enzyme. The enzymes were diluted
  in 50 mM MOPS-(CH3)4NOH, pH 6.5, containing 0.3 mM oxalate, 0.1 mM ATP, and 1.05
  mM Mg2+. The scan rate was 1.5 °C/min. The Tms were 79.2 and 78.4 °C for WT-ThaPK
  and truncated-ThaPK, respectively. ∆H (cal/mol °C) were 230,946.6 and 46,845.8 for
  the WT-ThaPK and truncated-ThaPK, respectively
