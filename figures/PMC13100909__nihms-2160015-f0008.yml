caption: A. Gene ontology terms associated with the gene set enrichment analysis of
  adult tendon cells, treated with either adult or neonatal-derived supernatant from
  stimulated cells. B. decoupleR package signaling pathway inference of adult and
  neonatal tendon cells. Negative changes indicate specific upregulation by adult
  T cell supernatants while positive changes indicate upregulation by neonatal T cell
  supernatants. N=3 samples per group, adjusted p value<0.01, Bonferroni correction
  for multiple comparisons
