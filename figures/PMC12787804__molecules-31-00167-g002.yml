figure_title: Effects of chlorogenic acid on cell cycle checkpoint pathways.
caption: |-
  Effects of chlorogenic acid on cell cycle checkpoint pathways. Here, 3T3-L1 adipocytes were treated with H2O2 (100 μM) on days 5, 6, and 7 of the differentiation process for three hours, followed by CGA exposure (5, 10, or 20 μM). Cells cultured with the differentiation medium containing the CGA vehicle alone (0.1% v/v DMSO) were used as controls. (A,B) Phospho-p53, p21, phosphorylated p38, and pERK1/2 protein expression was analyzed by Western blot. The densitometry results are reported as fold changes compared to control cells. The values were normalized to the corresponding β-actin value. All results are reported as the mean ± S.D. of three independent experiments (n = 3 biological replicates). Error bars represent S.D. a
  p < 0.01 vs. control cells; b
  p < 0.05 vs. control cells; c
  p < 0.05 vs. H2O2; d
  p < 0.01 vs. H2O2; e
  p < 0.01 vs. H2O2 + CGA 5 μM; f
  p < 0.01 vs. H2O2 + CGA 10 μM; g
  p < 0.05 vs. H2O2 + CGA 5 μM
