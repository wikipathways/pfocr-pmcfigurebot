figure_title: Impact of ON-pathway activity upon DUSP4 expression
caption: 'A: Quantification of Dusp4 mRNA by RT-qPCR performed on isolated adult retinas
  from two cCSNB mouse models (Gpr179−/− and Lrit3−/, n=6 each−) and their corresponding
  wild-type littermates (n=6 each). B: Quantification of DUSP4 protein by western
  blotting performed on isolated adult retinas from two cCSNB mouse models (Gpr179−/−
  and Lrit3−/−, n=5 each) and their corresponding wild-type littermates (n=5 each).
  C and D: Co-immunostaining of DUSP4 (green) with SCGN (red) performed on adult retinal
  slices from either Gpr179−/− (C, lower image) or Lrit3−/− (D, lower image) and their
  corresponding wild-type littermates (upper images). E and F: Co-immunostaining of
  DUSP4 (green) with ISLET1 (red) performed on adult retinal slices from either Gpr179−/−
  (E, lower image) or Lrit3−/− (F, lower image) and their corresponding littermates
  (upper images). Scale bars= 50μm. Arrowheads= cone ON-BCs (DUSP4 positive, SCGN
  or ISLET1 positive, upper part of the INL), stars= RBCs (DUSP4 positive or negative,
  SCGN negative, ISLET1 positive, upper part of the INL), arrows= potential ACs (DUSP4
  positive, SCGN negative, ISLET1 positive, lower part of the INL), circles= potential
  OFF-BCs (SCGN positive, ISLET1 negative, DUSP4 positive or negative, lower part
  of the INL). *: P≤ 0.05, **: p-value≤ 0.01 ***: P≤ 0.001'
article_title: Increased sensitivity to myopia and altered retinal ON/OFF balance
  in a mouse model lacking Dusp4
