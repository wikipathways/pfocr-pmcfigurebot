figure_title: Propagation of immunolabeling with inflammatory pathway antibodies for
  control (CT) and pneumonia-induced groups (G2, G3, G4).
caption: Propagation of immunolabeling with inflammatory pathway antibodies for control
  (CT) and pneumonia-induced groups (G2, G3, G4). The top row of images shows the
  negative control for the reaction using tris-buffered saline (TBS). Limited spread
  of anti-nuclear factor kappa B (NF-κB) labeling (second row) is visible in the bronchioles;
  initially, labeling does not extend throughout the entire area (CT, G2), but subsequently
  expands in the bronchioles and alveoli (G3, G4). The presence of anti-interleukin
  (IL)-6 (third row) is noted in the bronchiole (CT), followed by marking of the alveoli
  (G2) and intensification of these markings (G3), ending with more limited labeling
  in the bronchiole and alveoli (G4). Limited labeling for tumor necrosis factor-alpha
  (TNF-α) (fourth row) was present in the bronchioles and alveoli (CT, G2), followed
  by pronounced propagation of the labeling in the bronchioles and alveoli (G3), and
  a return to sporadic labeling in some regions of the bronchiole and of the alveoli
  (G4)
