figure_title: 'Three dysregulated signaling pathways in MPNs: JAK-STAT, PI3K/AKT/mTOR
  and MAPK/ERK.'
caption: 'Three dysregulated signaling pathways in MPNs: JAK-STAT, PI3K/AKT/mTOR and
  MAPK/ERK. Mutant JAK2 persistently activates STAT3/5. STAT5 upregulates the expressions
  of pro proliferative genes (such as cyclin D1 and MYC) and anti-apoptotic genes
  (such as BCL-XL and MCL-1). The PI3K/AKT/mTOR pathway synergizes with JAK-STAT signaling.
  JAK2 phosphorylates the insulin receptor substrate (IRS) protein, recruits the PI3K,
  catalyzes phosphatidylinositol diphosphate (PIP2) to generate inositol triphosphate
  (PIP3), and activates 3-phosphoinositide-dependent protein kinase 1 (PDK1) and AKT.
  Activated AKT drives glycolysis (upregulation of GLUT1 and HK2) and protein synthesis
  (activation of S6K) by phosphorylating the pro apoptotic protein BAD. JAK2 phosphorylates
  SOS1 and promotes RAS (KRAS/NRAS) to bind GTP, which triggers RAF-MEK-ERK cascade.
  Asterisk represents mutation'
