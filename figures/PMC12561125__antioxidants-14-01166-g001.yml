caption: Neuroimmune IL-1β–COX-2–PGE2 pathway in spinal nociceptive sensitization.
  Immune cells, microglia, and astroglia release IL-1β, which triggers NF-κB and MAPK
  signaling, leading to COX-2 induction and prostaglandin E2 production. PGE2 engages
  E-type prostanoid receptors on neurons to increase neuronal firing and synaptic
  transmission, sustaining central sensitization and chronic pain
