figure_title: Integrated neuroimmune–metabolic network in host–microbiota homeostasis.
caption: 'Integrated neuroimmune–metabolic network in host–microbiota homeostasis.
  This network involves the modulation of inflammation (via NF-κB inhibition), the
  maintenance of redox balance (via Nrf2, or nuclear factor erythroid 2-related factor
  2) and the control of mitochondrial quality (autophagy/mitophagy) through nitric
  oxide (NO) signalling, via both NOS-dependent (nitric oxide synthase) and microbiota-mediated
  pathways. The cholinergic anti-inflammatory reflex (α7 nAChR; alpha-7 nicotinic
  acetylcholine receptor), GABAergic and serotonergic neurotransmission, polyamine
  metabolism (spermidine) and the nuclear receptor PPARγ (peroxisome proliferator-activated
  receptor gamma) coordinate immune tolerance, metabolic adaptation and microbiota–host
  interactions, particularly under oxidative or inflammatory stress. Abbreviations:
  ACh—acetylcholine; α7nAChRs—α7 nicotinic acetylcholine receptors; GABA—γ-aminobutyric
  acid; HO-1—heme oxygenase-1; NF-κB—nuclear factor-kappa B; NO—nitric oxide; Nrf2—nuclear
  factor erythroid 2-related factor 2; NQO1—NAD(P)H:quinone oxidoreductase 1; NOS—nitric
  oxide synthase; PPARγ—peroxisome proliferator-activated receptor gamma. This figure
  was created using Servier Medical Art (available at https://smart.servier.com/)
  (accessed on 1 May 2025)'
