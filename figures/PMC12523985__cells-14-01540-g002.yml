caption: Extracellular matrix-related intercellular interactions are associated with
  GBM pathogenesis. (A,B) Bubble plots showing significant ligand–receptor (LR) pairs
  in the context where GBM cells serve as receivers (A) and senders (B), respectively.
  Bubble size indicates p-value and color indicates the probability of CCIs. (C,D)
  Bar plots indicating the top 10 significantly enriched Reactome pathway of the identified
  96 LR pairs (C) and 78 LR pairs (D), respectively. The bar color represents p-value,
  and the size represents gene enrichment ratios. (E) Kaplan–Meier survival analysis
  for high ECM_signature (n = 182) and low (n = 182) GBM samples in The Cancer Genome
  Atlas dataset. (F,G) Gene Set Enrichment Analysis of epithelial–mesenchymal transition
  (HALLMARK_EPITHELIAL_MESENCHYMAL_TRANSITION) (F) and mesenchymal subtype (VERHAAK_GLIOBLASTOMA_MESENCHYMAL)
  (G), respectively
