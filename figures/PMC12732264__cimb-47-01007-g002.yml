caption: Pathway Commons GLP1R gene–gene functional interactions determined via binding
  (blue lines), co-expression (orange lines), and other interactions (gray lines).
  Multiple orange lines for ESR1 and PDE4B genes represent multiple co-expression
  patterns. The GLP1R gene is highly related to G-protein-coupled receptor signaling
  and activation of adenylate cyclase. This involves increased intracellular cAMP.
  Of the 24 genes associated with GLP1R, 15 showed binding ability, 16 showed modification
  or co-expression patterns, and 7 showed other interactions. (https://apps.pathwaycommons.org/interactions/?source=GLP1R).
