figure_title: PAX-FOXO1/N-Myc positive feedback loop drives global transcriptional
  reprogramming in RMS
caption: '(A) Identification of a Hallmark gene signature coregulated by PAX3-FOXO1+N-Myc.
  GSEA was performed on transcriptomic data from RD cells comparing the PAX3-FOXO1+N-Myc
  group versus N-Myc– or P3F1-alone groups. Significantly enriched Hallmark pathways
  (FDR < 0.05, |NES| > 1) from both comparisons are displayed in the scatter plot.
  NES, normalized enrichment score. The coregulated signature was defined as the intersection
  of significant pathways from the 2 comparisons. n = 3. (B) Combined bar and line
  graph representing the 11 overlapping Hallmark pathways. Bars show the NES, and
  the line shows the –log10(FDR) for each pathway. (C) Heatmap displaying gene expression
  clusters. Cluster A denotes genes specifically activated in the PAX3-FOXO1+N-Myc
  group. n = 3. (D) Immunoprecipitations (IP) by anti-FLAG beads from HEK-293T cells
  transfected with vector or N-Myc-HA along with vector or P3F1-FLAG for 48 hours
  were analyzed by immunoblot (IB). (E) IPs by anti-FLAG beads from HEK-293T cells
  transfected with vector or P3F1-HA along with vector or N-Myc-Flag for 48 hours
  were analyzed by IB. (F) IPs by anti-FLAG beads from RD cells transfected with vector
  or N-Myc-HA along with vector or P3F1-FLAG for 48 hours were analyzed by IB. Data
  are representative of 3 independent experiments. (G) Immunofluorescence analysis
  showing subcellular colocalization of P3F1 (green) and N-Myc (red) in HeLa and RD
  cells. HeLa was used as a tool cell. Cells were infected with GFP-P3F1 and N-Myc-HA
  for 48 hours. Nuclei were stained with DAPI (blue). Colocalization was analyzed
  using ImageJ. Scale bar: 10 μm'
