figure_title: Differential abundance of microbial metabolic functions from the phyllosphere
  and rhizosphere of symptomatic northern corn leaf blight (NCLB)-infected plants
  (Hi-Brix 3) and asymptomatic resistant plants (Insee 2).
caption: 'Differential abundance of microbial metabolic functions from the phyllosphere
  and rhizosphere of symptomatic northern corn leaf blight (NCLB)-infected plants
  (Hi-Brix 3) and asymptomatic resistant plants (Insee 2). (A) Heatmap analysis of
  the abundance of predicted Kyoto Encyclopedia of Genes and Genomes (KEGG) pathways
  across all samples. (B) Principal coordinate analysis of predicted KEGG pathways
  compositions across all samples. Extended error bar plot of significantly different
  KEGG pathways in the phyllosphere (C) and rhizosphere (D). Bar plots on the left
  display the mean proportion of each KEGG pathway, while dot plots on the right show
  differences in mean proportions between the two groups based on P-values. Only pathways
  with P-values < 0.05 (Welch’s test) are shown. The samples were categorized as follows:
  the asymptomatic resistant phyllosphere (CPH), asymptomatic resistant rhizosphere
  (CRH), NCLB - symptomatic phyllosphere (CPD), and NCLB symptomatic rhizosphere (CRD)'
