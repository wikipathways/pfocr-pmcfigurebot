figure_title: Mechanism of lactate-mediated epigenetic regulation.
caption: Mechanism of lactate-mediated epigenetic regulation. Lactate metabolism facilitates
  protein lactylation through two separate pathways. Lactate is converted to lactyl-CoA
  in the enzymatic pathway, serving as a substrate for ‘writer’ enzymes that modify
  histone and non-histone proteins. A non-enzymatic pathway concurrently employs the
  glycolysis byproduct MGO to produce LGSH, enabling direct lactylation of proteins
  without enzymatic involvement. Both mechanisms directly convert the metabolic state
  of the cell into epigenetic modifications that regulate gene expression and promote
  malignant progression. MGO, methylglyoxal; LGSH, S-d-lactoylglutathione; GRP, glucose-regulated
  protein; MCT, monocarboxylate transporter; La, lactate; KL-la, L-lactylation; HIF-1α,
  hypoxia-inducible factor 1-alpha; GSH, glutathione; GLO, glyoxalase; Kce, N-ε-(carboxyethyl)lysine;
  KD-la, D-lactylation; TCA, tricarboxylic acid cycle
