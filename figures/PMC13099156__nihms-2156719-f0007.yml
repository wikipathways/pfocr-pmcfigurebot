figure_title: Plasminogen activator pathway, extracellular matrix proteins, and matrix
  metalloproteinases (MMPs) in Flt4CreERT2;Kras+/G12D mice
caption: Representative whole-mount immunostaining of postnatal day (P)21 mesenteries
  (A-C), P21 diaphragms (D), and P21 ear skins (E) from Flt4CreERT2 controls and Flt4CreERT2;Kras+/G12D
  mice with PROX1 (prospero homeobox protein 1; green), PECAM1 (platelet and endothelial
  cell adhesion molecule 1; magenta), uPAR (urokinase-type plasminogen activator receptor;
  cyan; A, D), GFP (green fluorescent protein), PECAM1 (red), laminin α5 (white; B,
  E), PROX1 (green), and fibronectin (red; C). Scale bars are 100 μm and n=3 for each
  tissue for A-E. F-G, Plasma from Flt4CreERT2 controls and Flt4CreERT2;Kras+/G12D
  mice at P21 were collected. F, Western blot analysis of MMP-1 and MMP-10 from mouse
  plasma. G, Gelatin zymography performed with mouse plasma indicates the presence
  of activated MMP-2 (62 kDa) and MMP-9 (82 kDa)
