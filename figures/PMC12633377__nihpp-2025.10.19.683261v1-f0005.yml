figure_title: Early CPF exposure induced sustained overexpression of key circadian
  genes
caption: (A) Gene Set Enrichment Analysis (GSEA) of RNA-seq data using Gene Ontology’s
  (GO) Biological Process (BP) terms. Showing the top 20 upregulated pathways in CPF-treated
  samples as compared to the DMSO control samples, among which 5 are related to circadian
  regulation (green arrows). Significantly upregulated pathways (p < 0.05) are ranked
  by Normalized Enrichment Score (NES). (B) Volcano plot showing the RNA-seq result
  comparing gene expression in CPF-treated samples and DMSO control samples. 11 of
  the top 21 significantly upregulated genes (ranked by adjusted p value) are circadian
  genes. (C) Quantitative PCR analyses conducted using samples from an independent
  experimental replicate validated RNA-seq results by confirming upregulation of key
  circadian genes following embryonic exposure to CPF. CPF-treated fish and DMSO control
  fish were dissected at the exact same time during the day by two experimenters working
  side-by-side. Significance was calculated by two-tailed Student’s t test. *p< 0.05,
  **p<0.01, ***p<0.001, ****p<0.0001
