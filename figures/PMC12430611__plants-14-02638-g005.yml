caption: '(a) Volcano plot of DEGs. Red dots represent significantly upregulated genes,
  green dots represent downregulated genes, and gray dots represent genes with no
  significant change in expression. (b) GO enrichment analysis of DEGs in pTRV2::00
  vs. pTRV2::GhSTZ cotton plants. Significantly enriched terms are shown within the
  categories biological process (BP), cellular component (CC), and molecular function
  (MF). (c) KEGG pathway enrichment analysis of DEGs is shown, with the pathway highlighted
  in pink representing the one containing the most enriched genes. (d) PPI network
  analysis of DEGs. Nodes represent proteins encoded by DEGs; edges represent predicted
  interactions—red nodes: upregulated genes; green nodes: downregulated genes'
