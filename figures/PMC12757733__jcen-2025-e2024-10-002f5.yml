caption: Schematic illustration of a hypothetical drainage pathway to cortical veins
  in dural arteriovenous fistula (DAVF). During maturation of the arteriovenous shunt,
  occlusive change of the drainage site might occur in the channel between the parasinus
  and superior sagittal sinus (SSS) (arrowheads). The parasinus may become isolated
  from SSS, and consequently shunt flow might be directed from the diploic vein toward
  cortical veins via the parasinus
