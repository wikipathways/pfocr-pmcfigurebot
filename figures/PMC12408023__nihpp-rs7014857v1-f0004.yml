figure_title: FDXR deficiency aggravates steatosis and oxidative stress in the liver
caption: (a) Study design. Control antisense oligonucleotide (ASO) or Fdxr ASO was
  administered to C57BL6J mice for 3 weeks. Mice were fed regular chow for 2 weeks,
  followed by a choline-deficient, L-amino acid-defined, high-fat diet (CDAHFD) for
  1 week. (b) Hematoxylin and eosin staining of liver sections from Fdxr ASO- and
  control ASO-treated mice. (c) Hepatic triglyceride content in Fdxr ASO- and control
  ASO-treated mice; control ASO (n = 8), Fdxr ASO (n = 8). *P < 0.05 (Unpaired one-sided
  Student’s t-test). (d) Levels of hepatic thiobarbituric acid-reactive substances
  (TBARS) in Fdxr ASO- and control ASO-treated mice; control ASO (n = 7), Fdxr ASO
  (n = 8). *P < 0.05 (Unpaired one-sided Student’s t-test). Transcriptomic changes
  based on RNA-seq analysis of hepatic Fdxr knockdown in CDAHFD-fed mice are shown
  in (e) and (f). (e)MA plot showing differentially expressed genes (DEGs) between
  Fdxr ASO and control ASO groups. (f)Gene set enrichment analysis (GSEA) illustrating
  pathway enrichment based on DEGs in the Fdxr ASO group. (g) The role of FDXR in
  metabolic dysfunction-associated steatotic liver disease (MASLD). FDXR deficiency
  leads to mitochondrial dysfunction and increased hepatic labile iron, followed by
  oxidative stress and MASLD progression
article_title: Hepatic ferredoxin reductase modulates mitochondrial function and iron
  homeostasis in metabolic dysfunction-associated steatotic liver disease
