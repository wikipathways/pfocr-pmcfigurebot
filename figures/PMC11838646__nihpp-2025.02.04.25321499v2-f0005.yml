figure_title: Germline P/LP variants in DNA repair genes are associated with distinct
  molecular profiles in high-grade glioma (HGG)
caption: |-
  A. Count of DNA repair variant P/LP carriers within CNS tumor histology cohorts by DNA repair pathway, with Fisher’s exact test-derived odds ratios in parentheses. Cells are colored by odds ratio weight. *=FDR<0.05, ^=p<0.05. BER=base excision repair, HR=homologous recombination, MMR=mismatch repair, NER=nucleotide excision repair, NHEJ=non-homologous end joining. “Other” indicates genes in the DNA repair list that are not in any of the five pathways. B. SBS3 mutational signature exposure weights in HR gene P/LP carriers versus non-carriers with H3-wildtype HGG. C-D. MMR deficiency mutational signatures exposure weights (C) and tumor mutation burden (D) in MMR gene P/LP carriers versus non-carriers with H3-wildtype HGG. E. SBS30 exposure weights in BER gene P/LP carriers versus non-carriers with mesenchymal tumors. F. Mean beta value from all probes on Infinium MethylationEPIC array in MMR gene P/LP carriers versus non-carriers with H3-wildtype HGG, with constitutional mismatch repair deficiency (CMMRD) syndrome patient indicated by label. P-values are derived from Wilcoxon rank sum tests. G. Clustering of H3 wildtype HGG samples by 20k most variable promoter-annotated probes on the Infinium MethylationEPIC array. Gene symbols above heatmap indicate annotation of germline P/LP variants, and MSH6/MSH6 indicates homozygous P/LP carrier. Hierarchical clustering was performed using the Euclidean distance measure and ward D2 clustering method. H-I. A germline P/LP deletion in MSH2
  (H) and P/LP SNP in MSH6
  (I) are associated with significant hypermethylation of respective promoter probes in H3-wildtype HGG cases. The red box and asterisk in gene models indicate positions of germline P/LP deletion and SNP, respectively. **=|beta value z-score| ≥ 2
