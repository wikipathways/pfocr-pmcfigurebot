figure_title: Comprehensive molecular profiling of PCD-associated gene expression
  patterns in PDAC.
caption: Comprehensive molecular profiling of PCD-associated gene expression patterns
  in PDAC. (A) Unsupervised hierarchical clustering analysis and heat map visualization
  of DEPRGs comparing PDAC specimens with adjacent non-neoplastic pancreatic tissue.
  (B) Volcano plot analysis demonstrating the distribution of DEPRGs; downregulated
  genes depicted in blue, upregulated genes in red, and nonsignificantly altered genes
  in gray. Significantly dysregulated DEPRGs (adjusted p  < 0.05, |log2FC| > 1) are
  annotated. (C) Genome-wide chromosomal distribution analysis of DEPRGs identified
  in the TCGA cohort. (D) KEGG pathway enrichment analysis revealing significantly
  enriched biological pathways associated with DEPRGs. (E) Gene Ontology (GO) functional
  annotation analysis demonstrating enriched biological processes, molecular functions,
  and cellular components associated with DEPRGs. (F) Comprehensive genomic alteration
  landscape of PCD-related genes across TCGA PDAC specimens visualized through oncoplot
  representation
