caption: Schematic representation of RHAMM signaling pathways and intracellular functions.
  Extracellularly, RHAMM interacts with HA and proteoglycans through its association
  with the cell surface receptor CD44, facilitating the activation of downstream signaling
  cascades such as the Ras–Raf–MEK–ERK pathway. This activation promotes cell growth,
  survival, and angiogenesis, and enhances migration and invasion capabilities. Additionally,
  growth factor receptors and G-protein-coupled receptors (GPCRs) further modulate
  ERK signaling through GRB2, SOS, and β-arrestin-mediated pathways. Intracellularly,
  RHAMM functions as a microtubule-associated protein (MAP), playing a pivotal role
  in mitotic spindle assembly and stabilization. It forms complexes with TPX2, Aurora
  kinase A (AurA), NEDD1, and γ-TuRC, ensuring proper spindle formation and chromosome
  segregation during cell division. RHAMM also interacts with proteins such as BRCA1,
  influencing centrosome dynamics, genomic stability, and cell cycle progression.
  Together, these extracellular and intracellular roles underscore RHAMM’s multifaceted
  contributions to tumor progression and metastasis
