figure_title: Latent HIV-1 infection activates STING-cGAS pathway in brain pericytes
caption: 'Stimulator of IFN genes (STING) and cyclic GMP-AMP synthase (cGAS) mRNA
  (Aand C) and protein (B and D) levels were analyzed 3 and 7 days post infection
  with HIV-1. STING (A-B) had a significant increase at 7 dpi, and cGAS had a reduction
  at 3 dpi (D), followed by an increase at 7 dpi (D). Representative blots for STING
  and cGAS are shown in the right panels. *: p<0.05; **: p<0.01, Two-way ANOVA with
  Bonferroni post-test. Each dot in graphs corresponds to an independent cell culture
  well'
