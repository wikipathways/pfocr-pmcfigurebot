figure_title: Activation of the innate immune response by mtRNA.
caption: Activation of the innate immune response by mtRNA. Key steps of the process
  are presented on the simplified diagram. Mitochondrial dysfunction triggers stress
  signals that activate BAX/BAK, which oligomerize and insert into the outer mitochondrial
  membrane, forming pores that increase MOMP and release mtRNA into the cytoplasm,
  thereby activating the innate immune response. RIG-I and MDA5 recognize and bind
  mtRNA, interacting with MAVS to recruit kinase complexes such as TBK1/IKKε, which
  activate downstream signaling pathways. RIG-I activates IRF3/7 to promote IFN-β
  expression, while MDA5 activates NF-κB and IRF3/IRF7, inducing the transcription
  of TNF-α and IL-6, as well as IFN-β expression. mtRNA activates immune cells through
  the TLR8-mediated pathway, triggering the NF-κB signaling pathway and promoting
  the secretion of TNF-α and IL-6. This process relies on Unc93B1 to deliver TLR8
  to the endosome. mtRNA interacts with PKR, activating NF-κB and IRF3/IRF7-mediated
  pathways, which upregulate TNF-α, IL-6, and IFN-β. The NLRP3 inflammasome, composed
  of NLRP3, ASC, and pro-caspase-1, is indirectly activated by mtDAMPs such as mtDNA
  and mtRNA released into the cytoplasm due to mitochondrial damage. These mtDAMPs
  bind to the PYD domain of ASC or promote ASC speck formation, ultimately enhancing
  the expression of IL-1β and IL-18. MOMP; outer mitochondrial membrane permeability,
  BAX/BAK; BCL-2-associated X protein/BCL-2 antagonist or killer, TLR8; Toll-like
  receptor 8, MDA5; melanoma differentiation-associated protein 5, PKR; protein kinase
  R, RIG-I; retinoic acid-inducible gene I, NF-κB; nuclear factor-κB, IRF3/7; interferon
  regulatory factor 3/7, mtDAMPs; mitochondrial damage-associated molecular patterns,
  ASC; apoptosis-associated speck-like protein containing a CARD
