figure_title: Gene Ontology (GO) and KEGG Pathway Enrichment Analysis in D.
caption: Gene Ontology (GO) and KEGG Pathway Enrichment Analysis in D. melanogaster
  and H. axyridis. (A) GO enrichment analysis for D. melanogaster, showing enriched
  terms in the biological process, cellular component, and molecular function categories
  for comparisons between wandering larvae (WL), prepupa (PP), and pupa (P). Dot size
  indicates gene count, and color intensity reflects p-value significance. (B) GO
  enrichment analysis for H. axyridis, displaying enriched terms in the biological
  process, cellular component, and molecular function categories for comparisons between
  second-instar larvae (L2), (L4), prepupae (PP), and pupae (P). Dot size indicates
  gene count, and color intensity reflects p-value significance. (C) KEGG pathway
  enrichment in D. melanogaster, with bar heights representing gene counts for WL
  vs. P, PP vs. P, and P vs. L2 comparisons. (D) KEGG pathway enrichment in H. axyridis,
  with bar heights representing gene counts for L2 vs. P, L4 vs. P, PP vs. P, and
  P vs. L2 comparisons. Colors distinguish between comparison groups
