figure_title: DSR32 and DSR4 cells are resistant to T-DXd.
caption: DSR32 and DSR4 cells are resistant to T-DXd. (A) HER2-expressing H2170 cells
  and their clone DSR32 cells were treated with T-DXd at the indicated concentrations.
  The percentage of viable cells is shown relative to untreated controls (median with
  a 95% CI of six independent experiments). (B) HER2-expressing N87 cells and their
  clone DSR4 cells were treated with T-DXd at the indicated concentrations. The percentage
  of viable cells is shown relative to untreated controls (median with a 95% CI of
  six independent experiments). (C,D) H2170 and DSR32 cells were treated with T-DXd
  (1 μg/mL) for 5 days. (C) N87 and DSR4 cells were treated with T-DXd (1 μg/mL) for
  5 days. (D) Proteins were detected by Western blot. The pixel density of the indicated
  protein was shown as bar graphs relative to actin expression. (E,F) T-DXd internalization
  was measured by labeling with pH-sensitive fluorescent dye. H2170 and DSR32 cells
  (E) or N87 and DSR4 cells (F) were treated with T-DXd (1 μg/mL) for the indicated
  times and evaluated at each point. MFI with a 95% CI of three independent experiments
  is shown. Two-way ANOVA; * p < 0.0001, ** p = 0.25. (G) The schematic diagram of
  the intracellular signaling pathway associated with T-DXd is shown. 1. Binding to
  HER2; 2. Internalization; 3. Transport to lysosome; 4. Cleavage of linker in lysosomes;
  5. Topoisomerase 1 inhibition
