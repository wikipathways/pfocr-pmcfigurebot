figure_title: Areg expression in recipient Foxp3+ cells regulates the fate of type
  II alveolar epithelial cells in lung allografts.
caption: Areg expression in recipient Foxp3+ cells regulates the fate of type II alveolar
  epithelial cells in lung allografts. (A) Uniform Manifold Approximation and Projection
  (UMAP) plot of type II alveolar epithelial cells combining Balb/c → B6 Foxp3-YFP-Cre
  Aregfl/fl (KO) and Balb/c → B6 Foxp3-YFP-Cre (WT) allografts 14 days after transplantation,
  colored by cell state. Recipients received peri-operative costimulatory blockade.
  (B) Cell state composition plot split by WT and KO animals. (C) Dotplot of key marker
  genes for type II alveolar epithelial cell states. (D) Dotplot of the gene set score
  for Krt8, Itgb6, Itgav, Cdh1, Cldn18, Anxa1, Icam1, Ilk, and Tgfb2 grouped by cell
  state. (E) Gene ontology pathway analysis using the marker genes for the injury-associated
  state. (E) The adjusted P value is computed using the Benjamin–Hochberg method for
  correction of multiple hypotheses. KO, knockout; WT, wildtype. Data are derived
  from 2 pooled grafts per condition.19
