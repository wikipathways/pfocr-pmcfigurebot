figure_title: Molecular Mechanisms Underlying Mitochondrial Transport Protein Dysfunction
  in Cardiovascular Pathogenesis.
caption: 'Molecular Mechanisms Underlying Mitochondrial Transport Protein Dysfunction
  in Cardiovascular Pathogenesis. ↓ indicates down-regulation; ↑ indicates up-regulation.
  Yellow text denotes channel or carrier proteins; blue text indicates key mechanisms;
  red text signifies downstream effects and consequences. (A) Calcium dysregulation:
  Hyperactivity of the MCU complex induces mitochondrial Ca2+ overload, triggering
  prolonged opening of mPTP. Deficiency in NCLX impairs Ca2+ efflux, exacerbating
  Ca2+ overload and oxidative stress in heart failure. and subsequent apoptosis. Dysfunction
  of VDACs disrupts sarcoplasmic reticulum (SR)-mitochondria Ca2+ coupling, leading
  to impaired excitation-contraction coupling and contractile dysfunction. (B) Redox
  imbalance: Oligomerization of VDAC1 on the OMM increases permeability, facilitating
  ROS leakage and contributing to endothelial damage. Downregulation of UCP2/3 elevates
  ΔΨm, promoting reverse electron transfer (RET)-dependent ROS bursts, particularly
  from complex I. (C) Metabolic reprogramming: Dysfunction of ANT reduces ADP/ATP
  exchange across the IMM, impairing OXPHOS efficiency and contributing to bioenergetic
  failure in heart failure. Deficiency in SLC25A20 suppresses mitochondrial fatty
  acid β-oxidation, leading to toxic lipid intermediate accumulation in diabetic cardiomyopathy.
  Dysregulation of MCU complex shifts cardiac energy metabolism towards less efficient
  glycolysis, promoting pathological hypertrophy. (D) Inflammation: VDAC1 oligomerization
  facilitates mtDNA leakage into the cytosol. Cytosolic mtDNA activates the cyclic
  GMP-AMP synthase (cGAS)-stimulator of interferon genes (STING) pathway, driving
  NLRP3 inflammasome activation, pro-inflammatory cytokine release, and vascular inflammation,
  destabilizing atherosclerotic plaques. (E) Vascular dysfunction: Reduced activity
  of the MCU complex lowers mitochondrial matrix Ca2+ levels. This inhibits Ca2+-dependent
  activation of PDH, suppressing the TCA cycle. ADP, Adenosine diphosphate; ANT, Adenine
  nucleotide translocator; ATP, Adenosine triphosphate; Ca2+, Calcium ion; cGAS, Cyclic
  GMP-AMP synthase; CypD, Cyclophilin D; ΔΨm, Mitochondrial membrane potential; eNOS,
  Endothelial nitric oxide synthase; HF, Heart failure; IMM, Inner mitochondrial membrane;
  MCU, Mitochondrial calcium uniporter; MICU, Mitochondrial calcium uptake; mtDNA,
  Mitochondrial DNA; mPTP, Mitochondrial permeability transition pore; NCLX, Mitochondrial
  Na+/Ca2+ exchanger; NLRP3, NLR family pyrin domain containing 3; NO, Nitric oxide;
  O2−, Superoxide; OMM, Outer mitochondrial membrane; OXPHOS, Oxidative phosphorylation;
  PDH, Pyruvate dehydrogenase; RET, Reverse electron transfer; ROS, Reactive oxygen
  species; SLC25A20, Solute carrier family 25 member 20 (Carnitine-acylcarnitine translocase);
  SR, Sarcoplasmic reticulum; STING, Stimulator of interferon genes; TCA, Tricarboxylic
  acid cycle; UCP, Uncoupling protein; VDAC, Voltage-dependent anion channel'
