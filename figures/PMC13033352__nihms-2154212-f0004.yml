figure_title: Kiss-shrink-pause pathway of SV exocytosis
caption: (A) Example tomographic slices showing semifused (left) and pore-opened (right)
  SVs of large (top row) and small (bottom row) sizes. (B) Normalized number of the
  four subtypes of SVs per synapse at different time points post-AP. (C to F) Central
  slices of the subtomogram averages for the four subtypes of SVs. Red arrows indicate
  the putative SNARE complex. (C1) to (F1) present 3D renderings of the subtomogram
  averages shown in (C) to (F), respectively. Atomic models of the SNARE protein coiled
  coils [Protein Data Bank (PDB) ID 3HD7 in (D1) and (E1); PDB ID 1SFC in (F1)] are
  presented as cylinder diagrams, fitted into the cryo-ET density. (G) Schematic diagram
  illustrating the kiss-shrink model of vesicle exocytosis. Data are presented as
  mean ± SEM. Statistical significance was evaluated using the Mann-Whitney test;
  *p < 0.05, **p < 0.01, and ***p < 0.001. The number of synapses, vesicles, and specific
  p values for these comparisons are provided in table S3
article_title: “Kiss-shrink-run” unifies mechanisms for synaptic vesicle exocytosis
  and hyperfast recycling
