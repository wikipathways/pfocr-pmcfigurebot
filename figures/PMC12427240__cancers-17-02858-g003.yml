figure_title: Six selected DEGs between CAFs and NFs.
caption: 'Six selected DEGs between CAFs and NFs. (A) Heatmap of six selected DEGs
  between CAFs and NFs. (B) Boxplot of DEGs comparing CAFs and NFs. Adjusted p-values
  (FDR) from generalized linear model. COL11A1 and TNC, known fibroblast markers;
  GREM1, BMP pathway; CD36, antigen processing machinery pathway; CXCL2, chemokine
  pathway; and GAS6, hypoxia pathway. (C) Boxplot of DEGs comparing LN-CAFs, Lung-CAFs,
  and NFs. (D) Western blot analysis (left) and densitometry-based quantification
  (right) of GREM-1 and GAS6 in LN-CAFs, Lung-CAFs, and NFs derived from squamous
  cell carcinomas, adenocarcinomas, and non-tumorous lungs. Adjusted p-values (FDR):
  *, p ≤ 0.05; ***, p ≤ 0.001; ****, and p ≤ 0.0001. CAF, cancer-associated fibroblast;
  NF, normal fibroblast; SqCC, squamous cell carcinoma; and ADC, adenocarcinoma'
