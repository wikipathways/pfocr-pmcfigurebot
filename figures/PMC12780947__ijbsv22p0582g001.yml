caption: 'Activation of pyroptosis, apoptosis, and necroptosis pathways in RTECs in
  human CAD allografts. A) Representative H&E, Masson''s trichrome, and PAS staining
  of renal tissue from normal controls and CAD patients. B) Western blot analysis
  of fibronectin, E-cadherin, and α-SMA protein levels in renal tissue from normal
  controls and CAD patients. C-E) Western blot analysis of: (C) NLRP3, full-length/cleaved
  GSDMD, and full-length/cleaved CASP1 (p55/p20); (D) full-length/cleaved CASP3 (p35/p17)
  and full-length/cleaved CASP8 (p55/p18); (E) RIPK1, RIPK3, total MLKL (t-MLKL),
  and phosphorylated MLKL (p-MLKL) protein levels in renal tissue from normal controls
  and CAD patients. F-H) Representative immunohistochemistry (IHC) images (200× magnification)
  showing: (F) cleaved-GSDMD and full-length/cleaved CASP1 (p55/p20); (G) cleaved
  CASP8 (p18) and full-length/cleaved CASP3 (p35/p17); (H) RIPK1, RIPK3, and p-MLKL
  expression in renal tissue from normal controls and CAD patients'
