figure_title: Tracer clearance and tumour visualization.
caption: 'Tracer clearance and tumour visualization. (A) Clinical example: the use
  of the hy-brid PSMA-targeting tracer 68Ga-P3 in robotic surgery (Red arrow: tumor
  location on PSMA-PET/CT; * : reference point for white light and fluorescence imaging;
  white dashed stripe: tumor location prostate, (adapted from ref. [66])). (B) schematic
  rep-resentation of the renal clearance pathway. (C) Dislocation prostate from tracer-containing
  bladder during prostatectomy (left image) and contamination with fluorescent dye-containing
  urine in the surgical field after prostatectomy in a prostate cancer patient (right
  image; images obtained from ref. [37]). (D) Prostate cancer (left image) and fluorescence-based
  discrimination between lesions and surrounding tissue (right image; fluorescence
  image obtained from ref. [67], dashed = location tu-mor). Anatomical images created
  using Biodigital.com'
