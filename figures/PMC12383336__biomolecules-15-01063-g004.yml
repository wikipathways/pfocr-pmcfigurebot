figure_title: 'Complex 1: NADH dehydrogenase.'
caption: 'Complex 1: NADH dehydrogenase. The figure shows the long path for electron
  currents, >20 Å. FMN and FMNH2 are flavin mononucleotides. NAD and NADH2 are nicotinamides.
  SDHB, sometimes called SDH, is a subunit of succinate dehydrogenase as defined in
  the extensive literature of that enzyme. The intramolecular flow of electrons obeys
  (quantitatively) the Maxwell equations, including the generalized Kirchhoff current
  laws, and thus depends on other pathways for current flow (Appendix B): the HHK
  Equation (1) and Figure 2B. That dependence is not evident in classical expositions
  in the chemical tradition'
