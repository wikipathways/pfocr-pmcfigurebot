figure_title: Main signalling routes along the liver–brain axis during Iiver disease
caption: 'Schematic provides an overview of the main signalling routes along the liver–brain
  axis during liver disease. Physiological or pathophysiological shifts of liver function
  can lead to changes in the concentration of metabolites, nutrients, hepatokines,
  toxins and Inflammatory-associated molecules, which can signal to the brain and
  alter mood and behaviour via one or more of the following routes: signalling via
  hepatic vagal afferent neurons that innervate the liver parenchyma (1), hepatic
  vagal afferent neurons that innervate the hepatoportal vasculature (2), the gastroduodenal
  branch of the common hepatic branch (3) and humoral pathways (4). The effects of
  duration, severity and aetiology of liver disease on these liver–brain axis signalling
  pathways are currently unknown and require further investigation'
article_title: Mechanistic insights into the liver–brain axis during chronic liver
  disease
