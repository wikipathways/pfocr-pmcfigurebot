figure_title: Effects of 15KPF binding on the biological functions of PKM2.
caption: 'Effects of 15KPF binding on the biological functions of PKM2. (A) Increased
  formation of PKM2 tetramer. After treatment with 15KPF, the cell lysates were cross-linked
  with 2.5 mM disuccinimidyl suberate and blotted with anti-PKM2 antibody. (B & C)
  Inhibition of PKM2 phosphorylation against LPS stimulation. RAW264.7 cells were
  treated with 15KPF and LPS as indicated and blotted with specific antibodies. n
  = 5 from 5 independent experiments. The data were expressed as means ± SD and analyzed
  by one-way ANOVA, followed by Dunnett''s multiple comparisons test. ***, p<0.001.
  (D) Enhanced enzyme activity of PKM2. The cells were treated with 15KPF at the indicated
  concentrations and assayed for PKM2 activity using commercial colorimetric assay
  kit. n = 3 from 3 independent experiments. The data were expressed as means ± SD
  and analyzed by one-way ANOVA, followed by Dunnett''s multiple comparisons test.
  *, p < 0.05; **, p < 0.01. (E& F) Reduced nuclear translocation of PKM2. Following
  the treatment with 15KPF and LPS, RAW264.7 cells were lysed and fractionated into
  the cytosolic and nuclear proteins. The protein preparations were blotted with anti-PKM2
  antibody. Lamin b indicated the loading of nuclear proteins whereas GAPDH indicated
  the loading of cytosolic proteins. n = 3 from 3 independent experiments. The data
  were expressed as means ± SD and analyzed by one-way ANOVA, followed by Dunnett''s
  multiple comparisons test. Control vs LPS, #p<0.05, ##, p<0.01, ###, p<0.001; LPS
  vs 15KPF treatment, *, p < 0.05; **, p < 0.01; ***, p<0.001. (G and H) Inhibition
  of HIF-1α pathway and STAT3 pathway. Following the treatment with 15KPF and LPS,
  RAW264.7 cells were lysed and blotted with antibodies against HIF-1α, p-STAT3, and
  STAT3. GAPDH indicated protein loading. n = 3 from 3 independent experiments. The
  data were expressed as means ± SD and analyzed by one-way ANOVA, followed by Dunnett''s
  multiple comparisons test. Control vs LPS, #p<0.05, ##, p<0.01; LPS vs 15KPF treatment,
  *, p<0.05, **, p<0.01'
