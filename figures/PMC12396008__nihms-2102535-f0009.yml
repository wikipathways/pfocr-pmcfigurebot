figure_title: Role of the NF-κB signaling pathway in mediating the inhibitory effect
  of IL-1β on levels of expression of PACs MTPPT protein (A), mRNA (B), and on cellular
  level of ATP (C)
caption: PAC 266–6 cells were pretreated with NF-κB pathway inhibitor (celastrol)
  as described in “Methods”. The expression levels of total cellular MTPPT protein
  (analyzed via Western blotting) and MTPPT mRNA (quantified by RT-qPCR) were normalized
  relative to PDHA1 and β-actin, respectively. In measuring cellular ATP levels, total
  cell lysates were prepared as described in “Methods”. Data represent the means ±
  SE from four independent experiments. Statistical analysis was evaluated using ANOVA
  (Dunnett’s post hoc test) in GraphPad Prism software. **P < 0.01
