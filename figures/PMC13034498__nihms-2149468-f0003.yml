figure_title: Flt3L+αCD40 synergistically increase T cell number and activation
caption: '(A-D) KPPC mice treated with vehicle, single-agent, or Flt3L+αCD40. (A)
  Tumor weights (Vehicle: n = 107, Flt3L: n = 16, αCD40 IgG: n = 21, and Flt3L+αCD40
  IgGs: n = 54). (B) Representative 10X mpIHC images of tumor T cell subsets: CD8α
  (yellow), CD4 (cyan) and FOXP3 (magenta) amongst CK19 (white) tumor ducts. (C) mpIHC
  quantification of CD8+ T cells, CD4+/FOXP3− Th cells, and CD4+/FOXP3+ Tregs per
  tumor area (n=7–8/group). (D) T cell CD44/Ki-67 expression (flow cytometry, n=6–26/group).
  (E-H) ScRNAseq of tumor sorted CD45+ leukocytes from KPPC mice treated with vehicle,
  single-agent, or Flt3L+αCD40. (E) UMAP of T cell and NK cell subsets with fractions
  of total. (F) Proportional overlap of DEGs (P.adj < 0.05) in T cell subsets compared
  to vehicle. (G) Selected GSEA pathways enriched by Flt3L+αCD40 vs vehicle in CD8+
  T cells (P.adj < 0.05) from “H”=Hallmark, “K”=KEGG, “R”=Reactome, “B”=Biocarta,
  “P”=PID, and GO Databases. (H) Selected DEGs (P.adj < 0.05) in CD8+ T cells (Flt3L+αCD40
  vs vehicle). (I-J) CyTOF analysis of CD8+ T cells from KPPC mice treated with vehicle
  or Flt3L+αCD40. (I) UMAP of CD8+ T cell clusters at day 12 split by treatment arm.
  (J) Cluster differential abundance (n=5/group). (K-M) Tumor analysis of female KP2OVA
  bearing C57BL/6 mice treated with vehicle or Flt3L+αCD40. (K) Tumor weights (n=9/group).
  (L) CD8+ T cell and CD4+ Th cell IFN-γ production after ex-vivo stimulation with
  PMA/Ionomycin (flow cytometry, n=7–8/group). (M) Protein expression in tumor infiltrating
  H2Kb-SIINFEKL dextramer+ CTLs (flow cytometry, n=6/group). All bar graphs depict
  mean +/− SEM. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001 by one-way ANOVA
  with Holm-Sidak multiple comparisons test (A,D), Brown-Forsythe and Welch ANOVA
  with Dunett T3 multiple hypothesis testing (C), multiple unpaired t test with Holm-Sidak
  method (J), and unpaired Student’s t test (K-M). ns, not significant'
