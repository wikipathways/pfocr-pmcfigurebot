figure_title: Blood-based R signature in anti–mouse CD3 R mice and its cellular origin
caption: (A) Volcano plot illustrating DEGs comparing the peripheral blood leukocytes
  of R and NR samples. Red dots and labels indicate upregulated genes, while gray
  dots and labels indicate downregulated genes that were statistically significant
  (P < 0.05). The log-transformed FC values are reported on the x axis, and the –log10-transformed
  values of the adjusted P values are shown on the y axis. P values were obtained
  by Wilcoxon rank-sum test with Bonferroni correction (Seurat function FindMarkers).
  (B) hypeR pathway analysis performed on upregulated DEGs in circulating leukocytes
  of Rs. Assessment of relevant pathways was done utilizing the hallmark gene sets
  from the MSigDB as a reference. (C) Heatmap presenting the normalized expression
  levels of the top 50 genes comprising the R signature, represented using the z score.
  (D) Box plots representing the R signature score calculated in peripheral blood
  (left) and pancreas (right) RO, R, and NR samples. The mean expression of the genes
  comprising the R signature in each individual cell was calculated using the Seurat
  function AddModuleScore. Boxes represent the median (center line) and extend from
  the 25th to 75th percentiles (bottom and top lines, respectively); whiskers extend
  from the minimum to the maximum value. (E) UMAP plot displaying the expression of
  the R signature in the main immune cell types in peripheral blood and pancreas.
  (F) Dot plot showing the expression of individual genes comprising the R signature
  in the main immune cell types in peripheral blood and pancreas. (G) Dot plot showing
  the average expression of the R signature in the main immune cell types in peripheral
  blood and pancreas. (H) Violin plots comparing the expression levels of the R signature
  in the main immune cell types in peripheral blood and pancreas. In D, the Mann-Whitney
  U test was used for statistical comparison
article_title: Neutrophil-enriched gene signature correlates with teplizumab therapy
  resistance in different stages of type 1 diabetes
