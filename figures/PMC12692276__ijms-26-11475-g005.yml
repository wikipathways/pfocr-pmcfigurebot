figure_title: Melatonin reprograms central carbon metabolism under heat stress.
caption: 'Melatonin reprograms central carbon metabolism under heat stress. (A) Comparison
  between Control and HS groups: MPE of selected metabolites from [U-13C6] glucose
  in central carbon metabolism pathways. (B) Comparison between HS and HS + Melatonin
  groups: Melatonin pretreatment does not reverse but further attenuates the MPE of
  TCA cycle intermediates and glycolytic precursors. Data are presented as mean ±
  SD from three independent experiments (n = 3). * p < 0.05, ** p < 0.01, *** p <
  0.001. M0 = unlabeled metabolite (no 13C incorporated); M + n = isotopologue containing
  n labeled carbon atoms'
