figure_title: Molecular interactions of NPM1.
caption: 'Molecular interactions of NPM1. (a) NPM1 is a DNA repair factor. Phosphorylation
  of NPM1 (-P) at T199 is mediated by CDK1/2 in the S phase and leads to NPM1 recruitment
  to DNA double-stranded breaks (DSBs), where the proteins participate in the initiation
  of repair by homologous recombination (HR): SUMOylation of NPM1 by Arf at K263 helps
  recruit HR factors, including CTIP, BRCA1, and RAD51. In single-stranded break (SSB)
  repair, NPM1 interacts with APE1 to facilitate the base excision repair (BER) pathway.
  (b) NPM1 is abundantly found in nucleoli and interacts with SURF6, DDX4, and ZNF692
  for ribosome biogenesis and the formation of nuclear condensates. (c) NPM1 regulates
  MDM2 and is involved in the PIDDosome complex with caspase 2, resulting in cell
  cycle arrest and apoptosis. (d) NPM1 monomers and pentamers of wild-type (or mutated)
  NPM1 are exported to the cytoplasm via XPO1. There, NPM1 interacts with MAPK31 (part
  of the MAPKKK pathway), thereby impacting proliferation and differentiation'
