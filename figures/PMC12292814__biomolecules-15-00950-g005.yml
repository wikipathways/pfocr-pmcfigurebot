figure_title: Differentially expressed genes (DEGs) in Nocardia farcinica-infected
  C57BL/6J mice after intratracheal aerosolization (ITA) obtained by RNA-seq compared
  to intranasal inoculation (IN) and intratracheal instillation (ITI).
caption: Differentially expressed genes (DEGs) in Nocardia farcinica-infected C57BL/6J
  mice after intratracheal aerosolization (ITA) obtained by RNA-seq compared to intranasal
  inoculation (IN) and intratracheal instillation (ITI). (A) Principal component analysis
  (PCA) of normalized RNA sequencing results for each infection route. (B) Numbers
  of DEGs in each infection route. (C) Heatmap displayed the expression patterns of
  57 differential genes associated to 5 related diseases. (D) The protein-protein
  interactions of 3 dpi DEGs [ITA vs Phosphate-buffered saline (PBS) control] were
  analyzed using Cytoscape software. GO analysis of lung tissues infected with N.
  farcinica via (E) IN, (F) ITI, and (G) ITA at 3 dpi. DEGs KEGG pathway analysis
  of lung tissues infected with N. farcinica via (H) IN, (I) ITI, and (J) ITA at 3
  dpi
article_title: Intratracheal Aerosolization of Nocardia farcinica in Mice Optimizes
  Bacterial Distribution and Enhances Pathogenicity Compared to Intranasal Inoculation
  and Intratracheal Instillation
