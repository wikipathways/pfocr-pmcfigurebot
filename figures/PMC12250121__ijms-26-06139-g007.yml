figure_title: Combined inhibition of JAK, AKT/PI3K, and MEK pathways synergistically
  reduces TNBC cell viability.
caption: Combined inhibition of JAK, AKT/PI3K, and MEK pathways synergistically reduces
  TNBC cell viability. (A–D) Cell viability of TNBC cells treated with cerdulatinib
  (JAKi, 10 μM), ipatasertib (AKTI, 5 μM), and cobimetinib (MEKi, 5 μM) alone or in
  combination 72 h. (E,F) MDA-MB-231 cells were treated with cerdulatinib (5 μM),
  alpelisib (PI3Ki, 10 μM), and trametinib (MEKi, 10 μM) alone or in combination for
  72 h. (G,H) HS578T cells were treated with cerdulatinib (10 μM), alpelisib (2.5
  μM), and trametinib (10 μM) alone or in combination for 72 h. Cell viability was
  assessed by MTT assay. Data represent mean ± SEM from three independent experiments.
  ** p < 0.01 and *** p < 0.005
