figure_title: Summary picture.
caption: Summary picture. In Parkinson’s disease, cell-free mitochondrial DNA (cf-mtDNA)
  is released by cell death pathways as a result of oxidative stress, mitochondrial
  membrane depolarization and impaired mitophagy. Downregulation of key mitochondrial
  quality-control proteins (PINK1, PARKIN, LRRK2) further contributes to mitochondrial
  damage and promotes mtDNA release, which activates neuroinflammatory signaling (see
  text and Figure 4). mtDNA may be liberated either as cf-mtDNA or within endosomal
  structures. In the serum or plasma of PD patients, cf-mtDNA levels are elevated
  compared to cf-nDNA and healthy controls, whereas total cf-mtDNA in cerebrospinal
  fluid (CSF) is significantly reduced in PD patients relative to controls. This discrepancy
  may reflect differences in the sources and mechanisms of mtDNA release. Created
  in BioRender. Ambrosius, F. (2025). https://biorender.com/3uf7kvw (accessed on 23
  November 2025)
