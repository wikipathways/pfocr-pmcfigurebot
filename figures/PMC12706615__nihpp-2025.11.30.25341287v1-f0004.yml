figure_title: Digital spatial profiling analyses using GeoMx of 4 KS samples from
  patients with KS and KAD (2 patients with MCD and KS and 2 patients with KICS and
  KS)A.
caption: 'Digital spatial profiling analyses using GeoMx of 4 KS samples from patients
  with KS and KAD (2 patients with MCD and KS and 2 patients with KICS and KS)A. Representative
  KS tissue section prepared for GeoMx analysis showing areas of interest (AOIs).
  Immunofluorescent staining identified distinct cellular compartments: CD45 (yellow)
  marking hematopoietic cells, CD31 (red) labeling endothelial cells, and LANA-1 (turquoise)
  highlighting nuclei of KSHV-infected cells. The inset (right) illustrates a KSHV-infected
  tumor AOI (outlined in solid white) adjacent to an uninfected vessel AOI (outlined
  in dashed yellow).B. Cell type deconvolution analyses from GeoMx showing increased
  abundance of lymphatic endothelial cells in tumor areas (LANA-1+) vs vessel and
  immune areas.C. Double volcano plot showing increased expression of LYVE1 and TSPAN15
  in LANA-1+AOIs within tumor AOIsD. Gene ontology pathway analysis demonstrating
  enrichment of cytokine pathways in vessel and immune areas vs. LANA-1+ areas and
  in vessel vs. LANA-1+ areas'
article_title: Spatial and Bulk Transcriptomics Reveal Distinct Molecular Signatures
