figure_title: Galactose metabolism via the Leloir pathway is essential for its protective
  effect against glucose-induced DNL activation and cellular TAG accumulation
caption: (A) Schematic of the Leloir pathway. (B - G) AML12 cells were treated with
  5 mM galactose either by isocaloric replacement or extra supplementation under high-glucose
  conditions with GALK1 inhibitor. (B & D) DNL-related gene mRNA levels. (C & E) Intracellular
  TAG levels. (F) Immunoblots for protein O-GlcNAcylation with quantification. (G)
  Immunoblots for protein N-linked glycosylation with quantification. (H) Galt and
  Gale knockdown efficiency. (I-L) AML12 cells were treated with 5 mM galactose either
  by isocaloric replacement or extra supplementation under high-glucose conditions
  with Galt siRNA or Gale siRNA. (I & K) DNL-related gene mRNA levels. (J & L) Intracellular
  TAG levels. Data were expressed as mean ± SD. Statistical comparisons were made
  using one-way ANOVA and two-way ANOVA with Tukey’s post hoc test, *p < 0.05, **p
  < 0.01, ***p < 0.001 versus the corresponding control. Glu, glucose; Gal, galactose;
  GALK1-IN, GALK1 inhibitor
article_title: Low-Dose Galactose Rebalances HBP-mTORC1-SREBP-1c Signaling to Suppress
