figure_title: oVV-Smac induces apoptosis in pancreatic cancer cells in vitro.
caption: oVV-Smac induces apoptosis in pancreatic cancer cells in vitro. (A) Apoptosis
  analysis using Annexin V-FITC/PI double staining. SW1990 cells were infected with
  oVV or oVV-Smac (MOI=5) for 24 h. The florescence was analyzed by flow cytometry.
  Data are presented as mean ± SD of three separate experiments. **P<0.01, ***P<0.001.
  (B) SW1990 cells were infected with oVV-Smac or oVV (5 MOI) for 24 h. Whole cell
  extracts were prepared and immunoblotted for the detection of activation of caspase
  and IAP pathway. GAPDH was used as a loading control. oVV, oncolytic vaccinia virus;
  oVV-Smac, Smac-armed oncolytic vaccinia virus
