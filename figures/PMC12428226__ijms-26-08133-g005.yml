figure_title: Relative expression patterns of SUMOylation pathway genes in leaf explants
  of Medicago truncatula non-embryogenic (M9) and embryogenic (M9-10a) lines during
  the induction phase.
caption: 'Relative expression patterns of SUMOylation pathway genes in leaf explants
  of Medicago truncatula non-embryogenic (M9) and embryogenic (M9-10a) lines during
  the induction phase. Gene expression was normalized to ACTIN2 and presented relative
  to the lowest observed transcript level, set as 1. Bars represent mean values ±
  standard deviation (SD) of three independent biological replicates, each with three
  technical replicates. Solid and dotted lines indicate the M9 and M9-10a lines, respectively.
  Statistical analysis was performed using two-way ANOVA followed by Tukey’s HSD post
  hoc test. Asterisks indicate significance levels: * p  <  0.05, ** p  <  0.01, ***
  p  <  0.001, **** p  <  0.0001'
