figure_title: Tumour-anchored RABID-seq detects astrocyte–glioma communication
caption: a, Schematic of taRABID-seq to study the TME. b, UMAP of cells analysed by
  taRABID-seq (n = 6 mice, n = 21,189 cells). c, Circos plot showing connectome captured
  by taRABID-seq. d, Circos plot of astrocyte–GL261 connections divided by ANXA1 signature
  expression (n = 307 tumour cells, n = 83 astrocytes). e, Volcano plot and ingenuity
  pathway analysis of DEGs in ANXA1 signature-positive astrocytes comparing astrocytes
  connected to GL261 cells with astrocytes not connected to GL261 cells. f, Volcano
  plot and ingenuity pathway analysis of DEGs comparing GL261 cells connected to ANXA1
  signature-positive astrocytes with GL261 cells that are not connected. Illustrations
  in a created in BioRender (Lee, J. https://BioRender.com/0bkvepw; 2025)
