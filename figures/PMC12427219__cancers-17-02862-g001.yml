caption: 'Growth factors and chemokines activate receptor tyrosine kinases (RTKs)
  and G-protein-coupled receptors (GPCRs), engaging class I PI3K (p85/p110) to convert
  PIP2 to PIP3 at the membrane. PIP3 recruits AKT, which is phosphorylated (Thr308
  by PDK1, Ser473 by mTORC2) to drive mTORC1 dependent protein synthesis and survival.
  The lipid phosphatase PTEN reverses this step (PIP3 to PIP2) and hence restrains
  AKT-mTOR signalling. Reduced PTEN activity elevates PIP3 and amplifies the pathway.
  In the nucleus, PTEN also supports genomic stability and DNA repair. Conventions:
  green arrows, activation; dashed lines, inhibition. Abbreviations: RTK, receptor
  tyrosine kinase; GPCR, G-protein-coupled receptor; PI3K, phosphoinositide 3-kinase;
  p85/p110, PI3K regulatory/catalytic subunits; PIP2, phosphatidylinositol-4,5-bisphosphate;
  PIP3, phosphatidylinositol-3,4,5-trisphosphate; PTEN, phosphatase and tensin homologue;
  AKT, protein kinase B; mTOR, mechanistic target of rapamycin; Ser/Thr, serine/threonine;
  P, phosphate'
