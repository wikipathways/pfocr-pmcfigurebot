figure_title: Nobiletin Activates the AMPK/SIRT1/PGC-1α Pathway and Enhances Antioxidant
  Defenses in 5XFAD Mice.
caption: 'Nobiletin Activates the AMPK/SIRT1/PGC-1α Pathway and Enhances Antioxidant
  Defenses in 5XFAD Mice. Protein expression levels in the cortical (a–f) and hippocampal
  (g–l) regions were analyzed by Western blotting using biological replicates from
  individual mice (n = 4). Phospho-AMP-activated protein kinase (pAMPK)/AMPK (a,g);
  sirtuin 1 (SIRT-1, (b,h)); peroxisome proliferator-activated receptor gamma coactivator
  1-alpha (PGC-1α, (c,i)) nuclear factor erythroid-2-related factor 2 (NRF2, (d,j));
  heme oxygenase-1 (HO-1, (e,k)); superoxide dismutase 2 (SOD2, (f,l)). Nobiletin
  effectively restored oxidative balance and reduced neuronal oxidative stress. Mice
  were divided into four groups: non-transgenic control (NC), 5XFAD vehicle-treated
  (5XFAD), and 5XFAD mice treated orally with nobiletin at 20 mg/kg/d (5XFAD_NOB20)
  or 40 mg/kg/d (5XFAD_NOB40). The β-actin blots were derived from the same membrane
  after stripping and reprobing with different primary antibodies. Statistical significance
  was represented as **** p < 0.0001; bars represent mean ± SE. The upregulation of
  total NRF2 protein indicates increased NRF2 expression; however, NRF2 pathway activation
  cannot be conclusively determined because nuclear translocation was not assessed'
article_title: Nobiletin Ameliorates Alzheimer’s Disease Pathology by Reducing Oxidative
  Stress and Neuroinflammation Through the AMPK/SIRT1/PGC-1α and PI3K/Akt–CREB–BDNF
  Pathways in 5XFAD Mice
