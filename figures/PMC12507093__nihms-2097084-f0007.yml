figure_title: Loss of STIM2 activates the ATF4-dependent ER stress pathway
caption: (A and B) Representative Western blot for BiP and GAPDH (A) and densitometric
  analysis of BiP normalized to GAPDH (B) in parental HCT116 or DLD1 cells or STIM1
  KO, STIM2 KO, or STIM DKO HCT116 and DLD1 clones. n=4 biological replicates per
  group.(C and D) Representative Western blot for ATF4 and GAPDH (C) and densitometric
  analysis of ATF4 normalized to GAPDH (D) in parental HCT116 cells or STIM1 KO, STIM2
  KO, or STIM DKO HCT116 clones. n=4 biological replicates per group.(E and F) Representative
  Western blot for IRE1α and GAPDH (E) and densitometric analysis of IRE1α normalized
  to GAPDH (F) in parental HCT116 cells or STIM1 KO, STIM2 KO, or STIM DKO HCT116
  clones. n=3 biological replicates per group.(G and H) Representative Western blot
  for ATF6 and GAPDH (G) and densitometric analysis of ATF6 normalized to GAPDH (H)
  in parental HCT116 cells or STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones. n=3 biological
  replicates per group.(I and J) Representative Western blot for phospho-eIF2α, eIF2α,
  and GAPDH (I) and densitometric analysis of phospho-eIF2α normalized to eIF2α (J)
  in parental HCT116 cells or STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones. n=3 biological
  replicates per group.(K and L) Representative Western blot for phospho-PERK, PERK,
  and GAPDH (K) and densitometric analysis of phospho-PERK normalized to PERK (L)
  in parental HCT116 cells or STIM1 KO, STIM2 KO, or STIM DKO HCT116 clones.(M and
  N) Representative Western blot for ATF4, tubulin, and GAPDH (M) and densitometric
  analysis of ATF4 normalized to GAPDH (N) in parental HCT116 cells and STIM2 KO HCT116
  clones with ATF4 silencing. n=3 biological replicates per group.(O to Q) Measurement
  of spheroid size (O), migration (P), and invasion (Q) of parental HCT116 cells and
  STIM2 KO HCT116 clones with ATF4 silencing. n=4 biological replicates per group.(R
  and S) TCGA data obtained from UALCAN analysis portal showing ATF4 mRNA levels (p<
  0.00000000000375 by t-test considering unequal variance) (R) and BiP protein levels
  (p<0.0000000000216 by t-test considering unequal variance) (S) in the tumor and
  unmatched adjacent normal tissue of COAD patients.(T) Kaplan plot correlating ATF4
  mRNA expression to survival of COAD patients.(U) Loss of STIM2 leads to increased
  ER Ca2+ though increased SERCA2 levels, causing ATF4-dependent ER stress, which
  leads to transcriptional reprogramming and metabolic transformation to increase
  tumorigenesis and metastasis
article_title: Loss of STIM2, but not of STIM1, drives colorectal cancer metastasis
  through metabolic reprogramming and the ATF4 ER stress pathway
