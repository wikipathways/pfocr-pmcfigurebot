figure_title: Targeting RNA splicing and the mTORC1 pathway has therapeutic effects
  in DM CLL cells
caption: (A–C) Cell viability of Mdr MT CLL, DM CLL, and DM normal B cells treated
  with either H3B-8800 or temsirolimus or in combination over 24 hours. (D–F) Survival
  curve of Mdr MT CLL mice, with DM CLL mice treated with either single-drug H3B-8800
  (4 mg/kg, 5 days, oral gavage) or temsirolimus (15 mg/kg, 5 days, intraperitoneal
  injection) or in combination. Gray shaded area indicates treatment time. CLL mice
  were established by engrafting Mdr MT CLL or DM CLL cells into NSG mice. Treatment
  started with detectable 3%–5% circulating CLL based on flow cytometry. (G) Cell
  viability of human CLL cells with or without SF3B1 mutation, in the presence or
  absence of del(13q) after 24 hours of treatment with increasing concentrations of
  temsirolimus (0.1 nM to 10 μM) combined with 0.1 mM H3B-8800. Black dotted line
  indicates the dosage used for statistical calculation. Two-way ANOVA with Tukey’s
  test was used to compare del(13q) with SF3B1 mutation with other groups. (H) Schematic
  summary of the mechanism of DM CLL development
article_title: SF3B1 mutation accelerates the development of CLL via activation of
