figure_title: Mechanism of podocyte injury induced by mechanical stretch.
caption: 'Mechanism of podocyte injury induced by mechanical stretch. Mechanical stress
  activates Piezo1 and TRPC6 channels, leading to Ca2+ influx and subsequent remodeling
  of the F-actin cytoskeleton. Concurrently, mechanical stretch stimulates arachidonic
  acid metabolism via COX-2, generating PGE2, which binds to the EP4 receptor, activating
  the PKA signaling pathway and thereby disrupting the actin cytoskeleton. Ang II
  activates AT1R, thereby initiating the MAPK, TGF-β, and PI3K signaling cascades,
  ultimately resulting in the downregulation of nephrin, induction of apoptosis, and
  reorganization of the cytoskeleton. The downregulation of KLF15 leads to the alleviation
  of inhibition on both the Wnt/β-catenin and TGF-β signaling pathways, resulting
  in the activation of the fibrotic pathway. Mechanical stress leads to increased
  SPARC expression, which can inhibit podocyte proliferation and facilitate ECM deposition.
  Mechanical stress also enhances actin polymerization through fascin-1 dephosphorylation
  while simultaneously disrupting focal adhesions, thereby compromising cell–matrix
  adhesion. The translocation of zyxin to actin-rich regions, along with the destabilization
  of integrin-associated proteins talin-1 and vinculin, accelerates focal adhesion
  disassembly. These molecular changes collectively result in impaired integrity of
  the glomerular filtration barrier, characterized by protein leakage, foot process
  effacement, and podocyte detachment. Overall, these pathophysiological alterations
  contribute to the progression of renal fibrosis. TRPC6: transient receptor potential
  canonical 6; PGE2: prostaglandin E2; COX-2: cyclooxygenase-2; EP4: E-prostanoid
  receptor 4; PKA: protein kinase A; Ang II: angiotensin II; AT1R: angiotensin II
  type 1 receptor; MAPK: mitogen-activated protein kinase; TGF-β: transforming growth
  factor-β; PI3K: phosphatidylinositol 3-kinase; KLF15: Krüppel-like Factor 15; SPARC:
  secreted protein acidic and rich in cysteine; ECM: extracellular matrix. The solid
  arrow denotes promotion; the dashed arrow represents the direction of force transmission
  or zyxin translocation; the bidirectional arrow indicates interaction; and the T-shaped
  arrow signifies inhibition'
