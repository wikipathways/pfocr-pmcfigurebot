figure_title: Schematic representation of autophagy mechanism.
caption: 'Schematic representation of autophagy mechanism. Plastics are durable, low-cost
  synthetic polymers used widely, but once in the environment, they degrade physically,
  chemically, and biologically. Factors like UV light, abrasion, microbes, and oxidation
  break plastics into smaller pieces, eventually forming nanoplastics (NPs). These
  NPs, due to their tiny size and large surface area, are more reactive and can more
  easily interact with biological membranes. NPs can cross cellular barriers, be internalized
  by endocytosis or passive diffusion, and accumulate within cells. This internalization
  may trigger cellular stress responses, as NPs can carry chemicals, heavy metals,
  and other pollutant agents on their surface. Moreover, NPs have a more reactive
  surface, which may generate reactive oxygen species (ROS) and induce oxidative stress,
  including the activation of the autophagy pathway. Autophagy is a lysosomal-mediated
  degradation process that primarily degrades damaged cells and dysfunctional organelles
  to recycle damaged or dysfunctional cellular contents, thereby providing the energy
  for nascent cells. The initiation of autophagy is regulated by two main sensors:
  AMPK and mTOR. mTOR and AMPK in the initial steps of the autophagy process through
  phosphorylation interaction with the ULK1 complex, respectively, whereas AMPK inhibits
  mTOR activity. AMPK: AMP-activated protein kinase; Atg: autophagy-related gene;
  LC3: microtubule-associated protein 1A/1B-light chain 3; mTOR: mammalian target
  of rapamycin; P: phosphate; ROS: reactive oxygen species; ULK1: Unc-51 like autophagy;
  NPs: nanoplastics; UV: ultraviolet. Created with Bioicons (https://bioicons.com/,
  accessed on 5 May 2025), licensed under CC BY 4.0'
