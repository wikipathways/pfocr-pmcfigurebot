caption: Spatially distinct gene expression in nodal tissues during the grain filling
  stage. (a) PCA analysis on seven tissues at the grain filling stage. Each data point
  represents an independent biological replicate. (b) Venn diagrams showing genes
  specifically expressed in node I, node II, or in both nodes. (c,d) GO enrichment
  analysis (c) and KEGG enrichment analysis (d) of genes specifically expressed in
  both node I and node II. The top 20 GO terms or KEGG pathways with the lowest p-values
  are shown. (e–g) Heat map showing genes specifically expressed in both node I and
  node II that were involved in mineral nutrient transpornt (e), reproductive growth
  (f) and signal transduction (g). The red color in the heatmaps in (e–g) represents
  higher expression levels, while blue represents lower expression levels. NPN, neck-panicle
  node; NDI, node I; IN, internode I; NDII, node II; FLB, flag leaf blade; FLS, flag
  leaf sheath; RT, root
