figure_title: A hybrid network processes oscillatory Ca2+ signaling in MIN6 cells
caption: (A) Simplified schematic of the ERK cascade in MIN6 cells. Vertical arrows
  indicate information flow down the cascade. Branching arrows highlight additional
  targets that can be activated by upstream pathway components. The dashed arrow indicates
  feedback regulation of the Ca2+ signal by ERK activation. At each step of the cascade,
  temporal information is filtered out, decreasing the frequency range (shading).
  (B-D) Representative single-cell timecourses showing TEA-stimulated emission ratio
  (black curves) and fluorescence intensity (red curves) responses in MIN6 cells co-expressing
  (B) the PKA sensor AKAR4, (C) the PKC sensor CKAR2, or (D) the Rac1 sensor RaichuEV-Rac1
  plus the Ca2+ sensor RCaMP1d. Data are representative of (B) n = 21, (C) 26, and
  (D) 19 cells from 6, 3, and 5 independent experiments, respectively. Additional
  representative traces are shown in Fig. S7. (E) Our data suggest that the ERK cascade
  in MIN6 cells combines the parallel signal processing of a “fan-like” signaling
  network (left) with the sequential processing of a hierarchical cascade (middle)
  into a hybrid signaling network architecture (right) to decode oscillatory signaling
  inputs into robust and diverse cellular responses
