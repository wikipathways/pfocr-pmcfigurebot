caption: Endoplasmic reticulum stress, leading to the activation of three UPR factors.
  The sarcoplasmic reticulum is an organelle that can be divided into rough and smooth
  regions. Under physiological conditions, the smooth endoplasmic reticulum (ER) is
  responsible for detoxification and lipid synthesis, while the rough ER is involved
  in protein synthesis. When the environmental conditions of the cell deteriorate,
  such as exposure to excessive heat or lack of oxygen, it leads to ER stress, resulting
  in the misfolding of proteins. This triggers the activation of the unfolded protein
  response (UPR), which, through three signaling pathways—IRE1, PERK, and ATF6—aims
  to either initiate apoptosis due to chronic ER stress or reduce misfolded proteins
  to restore balance, depending on the prevailing conditions. Factors such as nicotine
  present in cigarettes can influence the pathway taken by the UPR
