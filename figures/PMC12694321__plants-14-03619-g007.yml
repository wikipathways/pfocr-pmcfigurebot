caption: The effect of boron on other hormone signaling-related gene expression in
  the ovaries of ‘Kuerle Xiangli’ at different stages. (A) Heatmap representation
  of differentially expressed genes in the other hormone signaling pathway. Purple
  represents upregulated genes, while green represents downregulated genes. The provided
  heatmap is based on log2(FC) values. The plasma membrane is shown as two gray solid
  lines, and the nuclear boundary is demarcated by a gray dashed line. (B) Major differential
  gene expression in the other hormone signaling pathway under boron treatment. Data
  are the means ± SEs of three replicates. Asterisks represent significant differences
  (* p < 0.05; ns, not significant)
