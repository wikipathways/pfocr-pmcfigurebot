figure_title: Summary of the integration of the strategies for MCFA increase in rice.
caption: Summary of the integration of the strategies for MCFA increase in rice. Figure
  shows the deployment of breeding and engineering tools such as CRISPR/Cas9, and
  marker-assisted selection (MAS), to target important genes and QTLs for MCFA biosynthesis.
  These new lines have the potential to be used for biofuel and bio-based products,
  as they overcome the natural low MCFA content that currently limits rice development
  by altering both genetic and enzymatic pathways
