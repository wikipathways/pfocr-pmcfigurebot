figure_title: Role of YY1 in EMT-mediated tumor drug resistance.
caption: Role of YY1 in EMT-mediated tumor drug resistance. YY1, acting as a downstream
  effector of the NF-κB/SNAIL pathway, represses RKIP expression to drive tumor epithelial–mesenchymal
  transition (EMT). Concurrently, the long non-coding RNA LINC00668 competitively
  binds to miR-532-5p to upregulate YY1, further enhancing EMT progression. Mechanistically,
  YY1 promotes tumor drug resistance via epigenetic regulation by recruiting HDAC5
  to suppress IFFO1 for metastasis and cisplatin resistance. In addition, YY1 collaborates
  with E2F3 proteins to activate the expression of microtubule-related genes, thereby
  mediating drug resistance in tumors. This integrated network highlights YY1 as a
  key mediator linking EMT to therapeutic resistance. Arrows are used to show activation;
  arrows terminated with a bar represent inhibition
