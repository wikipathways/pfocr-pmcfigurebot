caption: 'GO and KEGG enrichment analysis of DEGs in co-expression trend modules across
  different treatment groups. (a,b) show the GO enrichment analysis of DEGs in the
  modules of ZCT vs. ZTS” and “DCT vs. DTS”, respectively; (c,d) represent the KEGG
  enrichment analysis of DEGs in ZCT vs. ZTS” and “DCT vs. DTS”, respectively. In
  the bubble chart, the x-axis represents the enrichment factor, and the y-axis represents
  the KEGG pathway. A larger enrichment factor indicates a higher degree of enrichment;
  a larger point indicates a greater number of DEGs in the pathway; and a redder point
  indicates more significant enrichment. ZCT: control treatment of ZD958; ZTS: TS
  treatment of ZD958; DCT: control treatment of DMY1; DTS: TS treatment of DMY1; MF:
  molecular function; CC: cellular component'
