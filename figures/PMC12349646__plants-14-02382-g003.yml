caption: 'Effects of bamboo biochar (Bc) and sodium silicate (Si) on chlorophyll synthesis
  and chlorophyll-related metabolites in tobacco under oxybenzone (OBZ) stress. (A)
  Schematic diagram of the chlorophyll biosynthesis pathway, showing chlorophyll precursors
  and intermediate metabolites. (B–J) Determination of chlorophyll precursors and
  pigment contents: (B) glutamic acid, (C) δ-aminolevulinic acid (ALA), (D) uroporphyrinogen
  III (Uro III), (E) protoporphyrin IX (Proto IX), (F) magnesium protoporphyrin IX
  (Mg-Proto IX), (G) protochlorophyllide (Pchlide), (H) chlorophyll a (Chl a), (I)
  chlorophyll b (Chl b), and (J) total chlorophyll (Chl a + b). Data are presented
  as means ± standard deviation (SD, n = 3). Different lowercase letters indicate
  significant differences among treatments (p < 0.05) according to one-way ANOVA followed
  by Duncan’s test'
