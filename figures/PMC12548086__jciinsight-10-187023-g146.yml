figure_title: 'Transcriptome data analysis of PM2.5-exposed BAT: differential expression
  and associated functional analyses'
caption: '(A) PCA plot of biological replicates from FA (n = 4) and PM2.5 (n = 4)
  in the transcriptome data of BAT. (B) Hierarchical clustering and heatmap plot of
  statistically significant differentially expressed genes (DEGs: 663, of which 409
  are upregulated and 269 are downregulated) in PM2.5-exposed BAT. (C) GSEA of transcriptome
  data in specific pathways of interest. Left: ROS and Glutathione Metabolism. Middle:
  Circadian Rhythm. Right: BAT Metabolism. Red: upregulated; Blue: downregulated in
  PM2.5. NES, normalized enrichment score. Most of the genes in these pathways were
  downregulated. (D–G) GO and KEGG pathways of DEGs by overrepresentation analysis
  (ORA) and GSEA. (D) Dot plot of top regulated KEGG pathways of DEGs analyzed by
  ORA (left) and GSEA (right). (E) Tree plot views of significant (ORA enriched) top
  regulated GO terms. Left: Upregulated GO terms. Right: Downregulated GO terms. (F)
  Gene-concept network of top KEGG pathways (smallest pathways’ P values from B) and
  associated genes in DEGs. Left: ORA. Right: GSEA. (G) Enrichment map of top KEGG
  pathways in DEGs. Left: ORA. Right: GSEA. The thickness of an edge between any 2
  KEGG pathways is proportional to the overlap between the 2 pathways'
