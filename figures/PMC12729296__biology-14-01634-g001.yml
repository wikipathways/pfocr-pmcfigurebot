figure_title: The effect of anisomycin treatment on various stress signaling proteins
  of wtPC12 and p143p53PC12 cells.
caption: The effect of anisomycin treatment on various stress signaling proteins of
  wtPC12 and p143p53PC12 cells. Cell cultures were treated with high (1 µg/mL) or
  low (10 ng/mL) concentrations of anisomycin for the periods indicated in the headings
  of the figure. Cell extracts were subjected to Western-blot analysis as described
  in Materials and Methods using antibodies against proteins of the mitogen-activated
  protein kinase pathways (a) and the PKR-eIF2α pathway (b). Anti-GAPDH was used as
  a loading control. Densitometric quantification of Western blot bands is shown in
  the Supplementary Materials (File S2)
