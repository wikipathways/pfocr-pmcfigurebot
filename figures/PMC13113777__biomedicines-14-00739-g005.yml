caption: Protein–protein interaction network, Reactome pathway enrichment, and hub
  protein identification for predicted targets of M. spicata monoterpenes. The PPI
  network was constructed using STRING with a minimum interaction confidence score
  of ≥0.4. Reactome pathway enrichment analysis highlights GPCR-related signaling
  pathways, with dot size representing gene count and color indicating FDR-adjusted
  significance levels ranging from 1.0 × 10−08 to 1.0 × 10−27. The target symbols
  in the enrichment plot denote the precise signal position for each pathway. Hub
  proteins were identified using the maximal clique centrality (MCC) algorithm in
  CytoHubba, and the top-ranked hub nodes are visualized in the network diagram where
  the color gradient (red to yellow) indicates the ranking of nodes based on their
  MCC scores
