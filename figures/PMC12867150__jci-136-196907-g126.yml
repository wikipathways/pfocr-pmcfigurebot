figure_title: EpA enhances metabolic fitness in Th9 cells
caption: '(A) GSEA of RNA-seq data showing enrichment of glycolysis-related gene signatures
  in EpA-treated Th9 cells compared with controls. (B–D) Real-time extracellular acidification
  rate (ECAR) measurement using a Seahorse XF analyzer with sequential injection of
  glucose, oligomycin, and 2-deoxyglucose (2-DG) (B), followed by quantification of
  basal glycolysis (C) and glycolytic capacity (D) (n = 6). (E) GSEA of oxidative
  phosphorylation–associated gene sets in EpA-treated Th9 cells. (F–H) Oxygen consumption
  rate (OCR) analysis using a Seahorse XF analyzer with sequential addition of oligomycin,
  FCCP, and rotenone/antimycin A (F), followed by quantification of basal (G) and
  maximal respiration (H) (n = 5). (I) Pathway enrichment analysis of upregulated
  genes highlighting mitochondrial function–related categories. (J and K) Transmission
  electron microscopy (TEM) analysis of mitochondrial ultrastructure showing representative
  images and quantification of mitochondrial number per cell (J) and mitochondrial
  diameter (K). Scale bars: 1 μm (low magnification); 500 nm (high magnification)
  (n = 13 randomly selected microscope fields). (L) Intracellular ATP levels measured
  by a luminescence-based assay normalized to cell number (n = 4). (M and N) Flow-cytometric
  assessment of mitochondrial mass using MitoTracker Deep Red (M) and mitochondrial
  membrane potential using TMRM (N) (n = 5). Statistical significance was determined
  using 2-tailed unpaired Student’s t test (C, D, G, H, and J–N). Data are presented
  as mean ± SEM. *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001'
