caption: Differential expression of genes and gene enrichment analysis in WT vs. Prom1-KO
  mRPE cells. (A) Volcano plot illustrating the top 15 differentially expressed genes
  (DEGs) in Prom1-KO vs. WT mRPE cells by bulk RNA sequencing. Significantly upregulated
  (in red) and downregulated (in blue) are labeled; n = 3/group. Selected notable
  genes are labeled for reference. (B) The normalized gene enrichment score (NES)
  of Hallmark gene sets from the Molecular Signature Database reveals up- and downregulated
  pathways in Prom1-KO vs. WT mRPE cells (n = 3/group). Dot size corresponds to the
  number of genes in each set, while color reflects adjusted p-value with a gradient
  from blue (less significant) to red (highly significant)
