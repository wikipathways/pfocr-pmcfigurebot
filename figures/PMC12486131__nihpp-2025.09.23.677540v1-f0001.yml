figure_title: TBCK mutations disrupt ribosomal gene expression and impair translational
  capacity –
caption: 'RNA-seq and functional analyses of TBCK−/− fibroblasts (n = 3 individuals;
  n = 3 controls): A) Dot plot showing the top 40 significantly enriched gene ontology
  pathways (MSigDB C5), categorized by ribosomal function, RNA splicing, and non-coding
  RNA regulation. B) Principal component analysis (PCA) depicting transcriptomic separation
  between TBCK−/− and control samples. Each biological replicate was sequenced with
  technical triplicates. C) Ingenuity Pathway Analysis (IPA) identifying top dysregulated
  pathways in TBCK−/− cells. D) Puromycin incorporation (SUnSET) assay following 3hr
  serum starvation and 10% FBS refeeding in the presence of puromycin. Loading control,
  vinculin, is represented in red, and puromycin in green. E) Violin plot quantifying
  puromycin incorporation (AUC/fluorescence) in control vs. TBCK−/− samples. F) Predicted
  upstream regulators identified by IPA based on differentially expressed genes. G)
  Western blot validation of protein expression, for key translational regulators
  identified in IPA. H) RT-qPCR analysis of transcript levels for upstream regulators
  showing reduced levels in TBCK−/− cells'
