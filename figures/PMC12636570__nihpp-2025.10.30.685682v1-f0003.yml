figure_title: Glycolysis can support higher cellular ATP demands needed for fast growth
caption: a-c, Empirical cumulative distribution functions (ECDFs) of measured ATP
  production rates (μmol mg protein−1 hr−1) for E. coli (a), S. cerevisiae (b), and
  mammalian cells (c). Each point is a ATP production rate measurement with point
  shading indicating the growth rate. Vertical dashed lines represent estimates of
  maximal respiration capacity (blue) and maximal glycolytic capacity (red), assuming
  complete allocation of the ATP-producing proteome to a single pathway. The corresponding
  shaded bands denote their 95% confidence intervals
article_title: Glycolytic ATP production enables rapid mammalian cell growth
