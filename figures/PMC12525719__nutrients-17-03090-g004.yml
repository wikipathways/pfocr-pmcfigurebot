caption: Salecan ameliorated the proliferation of pancreatic cancer cells by targeting
  necroptosis. (A) The volcano plot shows the total expression of mRNAs in PANC-1
  cells. Orange indicates the mRNAs with non-significant differences; red and blue
  indicate those with significant differences. (B) Analyzed mRNA expression levels
  of several crucial apoptosis-related factors (CASP3, CASP8, CASP9, BCL2, and BAX)
  between the Ctrl and Salecan-treated group in PANC-1 cells using transcriptome data,
  with FPKM as the normalization method for gene expression levels. (C) Top KEGG pathways
  are shown for Salecan versus Ctrl derived from (A). (D) Heat maps demonstrating
  necroptosis gene expression in Salecan versus Ctrl derived from (A)
