figure_title: The translational pathway for combining gene therapy with a medical
  device depends on regionally varying governmental regulations
caption: In the US, the FDA approaches the topic with a dedicated combined therapy
  route (Office of Combination Products)185,186. In Europe, the European Medicines
  Agency (EMA) considers two parallel avenues with a notified body (medical device)
  and the Committee for Advanced Therapies (gene therapy)187–190. As combined therapies
  may be developed in the future, these current regulatory pathways will undoubtedly
  evolve in parallel, and regulatory convergence should be promoted to accelerate
  the international development of modern complex therapies
