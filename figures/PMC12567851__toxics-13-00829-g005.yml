caption: MuSK basal activity is involved in modulating surface AChE in C2C12 cells.
  (A) MuSK canonical pathway is induced by the binding of presynaptic agrin to the
  coreceptor LrP4, as well as the subsequent intracellular trans-autophosphorylation
  and full activation of the receptor. The activated receptor phosphorylated the adapter
  protein Dok7, which modulates the formation of clusters of the nicotinic Acetylcholine
  receptors (nAChR). (B) In muscle cells, extracellular AChE directly interacts with
  the MuSK extracellular domain. Our results suggest that inhibition of basal MuSK
  activity by Pz-1 induces the removal of aged AChE from the cell membrane of C2C12
  cells. Created in BioRender. Moncada-Restrepo, M. (2025) https://BioRender.com/q380i59,
  accessed on 31 July 2025
