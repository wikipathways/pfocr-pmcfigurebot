caption: 'Lymphatic-mediated macrophage recruitment fuels inflammatory exacerbation
  after stroke. (A) tSNE dimensionality reduction analysis displayed clusters of meninges
  in Sham and MCAO C57BL/6 mice. (B) The dotplot of top marker gene in all cell types.
  (C) Frequency distribution of all clusters in Sham and MCAO C57BL/6 mice. (D) GO
  Biological Process enrichment analysis of macrophages. (E) Cell–cell communication
  analysis reveals CCL signaling pathway networks coordinated by macrophages. (F)
  Cell–cell communication analysis reveals CXCL signaling pathway networks coordinated
  by macrophages. (G) Representative images of F4/80 and LYVE-1 immunofluorescence,
  with quantification of F4/80 + Immunofluorescence and lymphatic diameter of the
  meninges in the indicated mice. Scale bar: 50 μm, magnification, ×20, Sham group:
  n = 6; MCAO group: n = 6. (H) Representative images of Evans blue in superficial
  cervical lymph nodes (sCLNs) and deep cervical lymph nodes (dCLNs) from Sham and
  MCAO C57BL/6 mice, along with quantification of Evans blue are presented. Sham group:
  n = 6; MCAO group: n = 6. Data in (G,H) are presented as mean ± SEM and an unpaired
  t test is performed to calculate significance between two groups. ** p < 0.01, ***
  p < 0.0001'
