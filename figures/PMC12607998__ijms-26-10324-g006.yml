caption: MetPA indicating matched pathways. Pathway enrichment versus log10 with p
  < 0.05 cut-off comparison of Plasmodium berghei-infected and non-infected control
  Sprague Dawley male rats. All matched pathways represented as circles, where the
  size of the node correlates with the enrichment ratio. Red and yellow depict p-values
  from highest to lowest. The size and color of each node are based on the impact
  value and p-value, respectively. The most impacted pathways, having high statistical
  significance scores, are labelled with alphabets, with the key descriptions on the
  right side of the graph
