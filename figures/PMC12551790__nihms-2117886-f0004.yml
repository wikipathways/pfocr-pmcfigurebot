figure_title: Sample multiplexing across platforms
caption: '(A) Layout of multiplexed conditions profiled with the STAMP-C (top) and
  STAMP-X (bottom), each with replicates.(B) Pearson correlations comparing the number
  of counts, features, and cell area across replicates for STAMP-C (top) and STAMP-X
  (bottom). p < 0.05.(C) Gene-wise aggregated counts showing high Pearson correlations
  across samples and replicates. (D) Overlap of genes between the Xenium Prime 5K
  Human Pan Tissue & Pathways Panel and the CosMx Human 6K Discovery Panel, demonstrating
  complementary profiling capabilities.(E) Principal-component analysis (PCA) plots
  of unintegrated data (left) and integrated data (right), colored by technology (top),
  replicate uniqueness (middle), and sample identity (bottom).(F) Local inverse Simpson’s
  index (LISI) scores calculated by technology (left) and replicate (right), illustrating
  improved data integration performance.(G) AUCell scores for the Biocarta lymphocyte
  pathway across Xenium replicates.(H) Scatterplot of AUCell scores for Hallmark Hypoxia
  (x axis) and Hallmark Glycolysis (y axis). Each point represents a sample (point
  size: AUCell GOBP lactate metabolic process)'
