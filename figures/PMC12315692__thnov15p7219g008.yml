figure_title: Proposed PSAT1 induced molecular and metabolic signaling pathway in
  cardiac repair.
caption: Proposed PSAT1 induced molecular and metabolic signaling pathway in cardiac
  repair. PSAT1 induces CM proliferation and cardiac repair in the heart by two different
  pathways. At the molecular level, PSAT1 induces the YAP1-β-catenin molecular axis,
  and metabolically it activates the SSP. YAP1 transactivates PSAT1, PSAT1, in turn,
  stabilizes β-catenin by phosphorylating Ser9 of GSK3β, and β-catenin translocate
  to the nucleus and interacts with YAP1, resulting in CM proliferation and cardiac
  repair. SSP induces CM proliferation by activating the nucleotide synthesis pathway
  and inhibiting oxidative stress, CM apoptosis, and DNA damage response by generating
  higher glutathione (GSH) levels
article_title: Phosphoserine aminotransferase 1 promotes serine synthesis pathway
  and cardiac repair after myocardial infarction
