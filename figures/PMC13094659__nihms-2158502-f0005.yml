figure_title: Pachyman modulated EcoHIV-induced alterations in fecal metabolites.
caption: Pachyman modulated EcoHIV-induced alterations in fecal metabolites. (A) Heatmap
  of differentially abundant fecal metabolites across Control + vehicle, EcoHIV +
  vehicle, and EcoHIV + pachyman groups (n = 6 per group). (B-E) Relative levels of
  4-(2-aminophenyl)-2,4-dioxobutanoate, 5-HIAA, 5-PRA and palmitoyl-aspartate (n =
  6 per group). (F) Correlation matrix (Spearman) among SIR, recognition memory index,
  the relative abundance of Malassezia globosa, the frequency of dectin-1+ macrophages
  in colonic LP, and representative metabolites (combined across all mice; total n
  = 18). (G) Pathway enrichment analysis of the significantly altered metabolites
  in feces of Control + vehicle vs. EcoHIV + vehicle groups, and EcoHIV + vehicle
  vs. EcoHIV + pachyman groups. The x-axis represents the pathway impact, and the
  y-axis represents the pathway enrichment. Data were presented as mean ± SEM. (B-E)
  Statistical significance was determined using one-way ANOVA with Benjamini–Hochberg
  FDR. *p < 0.05, **p < 0.01, ***p < 0.001
