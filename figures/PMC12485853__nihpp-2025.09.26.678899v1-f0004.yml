figure_title: TCT inhibits PGLYRP1 signaling via TREM-1
caption: Violin plot generated from single-cell RNA sequencing (scRNA-seq) displaying
  TREM-1 expression on neutrophils (green), alveolar macrophages (AM, gold), and inflammatory
  monocytes (IM) at 4DP1 (A). TREM-1 activation measured via NFAT-driven luminescence
  (relative luminescence units, RLU) in TREM-1 reporter cells treated with recombinant
  human PGLYRP1 with or without 5μg/mL of Lys-type peptidoglycan derived from Staphylococcus
  aureus, tracheal cytotoxin (TCT) or a DAP-type PGN from Bacillus subtilis (5 μg/mL)
  (B). Diagram depicting proposed model of exogenous PGLYRP1 boosting NOD1 and TREM-1
  signaling, but dampening NOD2 signaling. Diagram further depicts B. pertussis co-opting
  these pathways via release of TCT to block TREM-1 signaling and bias NOD signaling
  (C). All TREM-1 activation assays were performed with biological triplicates (n
  = 3). Statistical analyses were performed using unpaired two-tailed Student’s t-test.
  *, p-value < 0.05, **, p-value < 0.01, *** p-value < 0.005, **** p-value < 0.001
article_title: A dual role for PGLYRP1 in host defense and immune regulation during
