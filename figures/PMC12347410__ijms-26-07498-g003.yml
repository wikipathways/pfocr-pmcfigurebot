figure_title: This illustrates the Nrf2-Keap1 pathway activation and Nrf2 nuclear
  translocation in response to oxidative stress.
caption: This illustrates the Nrf2-Keap1 pathway activation and Nrf2 nuclear translocation
  in response to oxidative stress. Under normal conditions, Nrf2 is sequestered in
  the cytoplasm by its inhibitor, Keap1, which facilitates Nrf2 degradation. However,
  upon exposure to elevated levels of ROS, oxidative modifications to Keap1 result
  in the release of Nrf2. Freed from Keap1, Nrf2 translocates to the nucleus, where
  it forms a complex with small Maf (sMaf) proteins and binds to the antioxidant response
  element (ARE) within the promoter regions of target genes. This binding initiates
  the upregulation of antioxidant proteins such as SOD, catalase, GPx, and heme oxygenase-1
  (HO-1), which collectively neutralize ROS and restore redox homeostasis
