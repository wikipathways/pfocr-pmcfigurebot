figure_title: Transcriptomic Analysis of PBMCs in Rabbits Infected with MPXV.
caption: Transcriptomic Analysis of PBMCs in Rabbits Infected with MPXV. Transcriptomic
  analysis was conducted on the PBMCs of rabbits at 0, 6 and 14 dpi. (A) Principal
  component analysis (PCA). (B,C) Volcano plots of DEGs in PBMCs at 6 dpi (B) and
  14 dpi (C) after MPXV infection compared to the normal group. (D) KEGG pathway analysis
  of DEGs. The top 12 pathways were shown. (E) DEGs were analyzed according to gene
  ontology terms related to their biological processes (BP), cellular components (CC),
  and molecular functions (MF). The top 5 pathways in each category were shown
