figure_title: Detection of metabolites in glioma in brain tissue samples.
caption: Detection of metabolites in glioma in brain tissue samples. (A) The composition
  of the cohort of brain tissues. (B) Number of metabolites identified from brain
  tissue samples by different scan methods. (C) Comparison of the number of differential
  metabolites by different scan methods. Volcanic plot and significantly differential
  metabolites that distinguish (D) glioma and normal tissues, and (G) IDH mutant and
  IDH wildtype gliomas using segment scan. ROC and AUC values for classification of
  (E) glioma versus normal tissues and (H) IDH mutant versus IDH wildtype gliomas
  with training set, and ROC of (F) glioma versus normal tissues and (I) IDH mutant
  versus IDH wildtype gliomas with training set using test set. Bubble plots of pathway
  enrichment in (J) glioma and normal tissues, and (K) IDH mutant and IDH wildtype
  gliomas
