figure_title: KIF18B drives OS cell progression through SKP2.
caption: KIF18B drives OS cell progression through SKP2. (A) PrimeView human gene
  expression array (3 v 3) was performed to identify differentially expressed genes
  in MNNG/HOS cells. (B) A volcano plot illustrates the differentially expressed genes
  in KIF18B knockdown OS cells compared to control cells. The green dots signify downregulated
  genes (n = 1896), whereas the red dots denote upregulated genes (n = 1053). (C)
  Statistical analysis of classical pathway enrichment revealed significant enrichment
  of differential genes within classical pathways. (D) Statistical analysis of disease
  and function enrichment demonstrates the significant enrichment of differential
  genes in specific diseases and functional categories. (E) IPA was performed to produce
  the KIF18B-related interaction network. (F) Q-PCR and (G) Western blot were utilized
  to detect the expression levels of SKP2 in OS cell lines (n = 3). (H) Independent
  validation of KIF18B and SKP2 expression using the GEO dataset GSE16091. (I) Changes
  in protein expression after knockdown of KIF18B were detected via WB (n = 3). (J)
  Detection of background gene expression via qRT-PCR (n = 3). (K) The effect of knockdown
  of KIF18B on MNNG/HOS and U-2OS cell proliferation was examined using the Celigo
  cell counting experiment (n = 3; scale bar = 200 μm). (L) Transwell assays were
  performed using equal initial cell numbers, and migrated cells were quantified after
  a fixed incubation time (24 h) (n = 3; scale bar = 200 μm). The data were expressed
  as mean ± SD (n ≥ 3). * p < 0.05, ** p < 0.01, and *** p < 0.001
