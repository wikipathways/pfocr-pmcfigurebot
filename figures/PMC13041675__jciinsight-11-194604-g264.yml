figure_title: MYO1C mediates HGHF-induced podocyte injury via the p38/p-CREB pathway
caption: '(A) Representative kidney tissue images showing PAS staining (scale bar:
  20 μm) and TEM (scale bar: 2 μm) in different mouse groups. (B) Quantitative analysis
  of kidney pathology, including mean glomerular tuft area, percentage of PAS+ area
  relative to glomerular tuft area, mean glomerular basement membrane (GBM) thickness,
  and number of foot processes per μm of GBM. Data are presented as mean ± SEM (n
  = 6–10 per group). Statistical comparisons were performed using 1-way ANOVA with
  Dunnett’s multiple-comparison test. (C) Immunoblots of specified proteins in HPCs
  treated with Ad-MYO1C and the p38 inhibitor SB203580. (D) Densitometric analysis
  of protein expression, normalized to GAPDH from immunoblotting data, presented as
  mean ± SEM. Statistical comparisons: “*” indicates significance compared with NGs+siControl,
  and “#” indicates significance compared with HG+siControl. *P < 0.05, **P < 0.01,
  #P < 0.05, ##P < 0.01. (E) Immunoblots of specified proteins in HPCs under HGHF
  conditions, following MYO1C knockdown via siRNA and treatment with the p38 agonist
  Dehydrocorydaline'
