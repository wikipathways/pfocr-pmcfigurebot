  101 genes correlated with CIPC. These interactions are based on coexpression data,
  physical interactions, genetic alterations, co-localization, shared protein domains,
  genomic neighborhood, and gene ontology annotation. A network analysis was performed
  on this network to identify the main clusters involved in the CIPC pathway'
