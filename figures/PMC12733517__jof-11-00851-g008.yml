figure_title: Metabolomic profiling of Diaporthe nobilis under CFS stress.
caption: 'Metabolomic profiling of Diaporthe nobilis under CFS stress. (A) Statistical
  plot of differential metabolite classification. The vertical coordinate is the secondary
  classification category of compounds, and the horizontal coordinate is the number
  of metabolites annotated to that category. (B) Heatmap representation of phospholipid
  metabolites, with color intensity indicating relative abundance changes. (control:
  CK-1, CK-2, CK-3; treatment: T-1, T-2, T-3). (C) KEGG enrichment analysis of differential
  metabolites, displaying the top significantly altered pathways with bubble size
  representing the number of enriched metabolites. (D) Schematic representation of
  key enzymatic regulation in linoleic acid metabolism under Bacillus velezensis A4
  treatment. Blue downward arrow denotes down-regulation of phospholipase A2, suppressing
  linoleic acid synthesis. Red upward indicate up-regulation of linoleate 8R-lipoxygenase
  and 9,12-octadecadienoate 8-hydroperoxide 8S-isomerase, enhancing degradation pathways'
