figure_title: KEGG pathway heatmaps and enrichment analyses for NRVMs treated with
  SLU-PP-332, BE5112, or BE2180 for 72 h.
caption: 'KEGG pathway heatmaps and enrichment analyses for NRVMs treated with SLU-PP-332,
  BE5112, or BE2180 for 72 h. Gene-wise z-scores were computed from FPKM values for
  visualization purposes only across retained samples following quality control. Differential
  expression and pathway enrichment analyses were performed using raw count data with
  DESeq2-based normalization. Heatmaps show oxidative phosphorylation (A), mitochondrial
  genes (B), and TCA cycle (C). Dot plots display −log10(p-value) of top 20 KEGG pathways
  enriched among upregulated genes for SLU-PP-332 (D) and BE5112 (E) (Orange: Significant
  in BE5112/SLU-PP-332; Blue: Not significant in BE5112/SLU-PP-332; p-value ≤0.05)'
