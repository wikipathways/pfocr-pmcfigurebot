figure_title: Assessment of hydrocarbon degradation potential in S70T and 12 closely
  related strains by Hmmer.
caption: 'Assessment of hydrocarbon degradation potential in S70T and 12 closely related
  strains by Hmmer. KofamKOALA HMMs (e-value cutoff 10−50) and CANT-HYD HMM (scores
  ≥ noise cutoff) was used to filter results. Each bubble represents the number of
  KO/CANT-HYD HMM hits (x-axis) per genome (y-axis), with bubble size corresponding
  to the number of gene hits. The color-coded bubbles represent genes associated with
  distinct degradation pathways: blue for aerobic alkane, green for aerobic aromatic,
  yellow for anaerobic alkane, and orange for anaerobic aromatic degradation. The
  black circle indicates the hit of CANT-HYD HMM. All HMMs are grouped by substrate
  type and degradation pathway. Details of the HMMs and underlying data are provided
  in Tables S4 and S5'
