caption: The potential circRNA-miRNA-mRNA regulatory network of each gene was constructed
  by Cytoscape. Within this network, mRNA nodes are represented in red, miRNA nodes
  in yellow, and circRNA nodes in blue. (a) CircRNA-miRNA-mRNA regulatory pathways
  of HSPA8 were demonstrated using network diagram. (b) CircRNA-miRNA-mRNA regulatory
  pathways of EGR2 were demonstrated using network diagram. (c) CircRNA-miRNA-mRNA
  regulatory pathways of SOCS3 were demonstrated using network diagram. (d) CircRNA-miRNA-mRNA
  regulatory pathways of ZNF527 were demonstrated using network diagram. (e) CircRNA-miRNA-mRNA
  regulatory pathways of CXCR4 were demonstrated using network diagram. (f) CircRNA-miRNA-mRNA
  regulatory pathways of HSPA1B were demonstrated using network diagram. (g) CircRNA-miRNA-mRNA
  regulatory pathways of NOTCH3 were demonstrated using network diagram
