figure_title: Overview of the main findings described herein.
caption: Overview of the main findings described herein. (a) Although hydration is
  well-documented for trifluoromethyl ketones, its presence is infrequently noted
  within the 19F NMR literature when BTFA (1) is used.1-3 (b) A novel reaction pathway
  of probe 1 has been revealed when the targeted Cys is at the N-terminus that leads
  to undesired side products, such as dihydro-1,4-thiazine (3). (c) Probe design inspired
  by iodoacetamide (IAA, 4) led to the demonstration that 2-iodo-N-(2,2,2-trifluoroethyl)acetamide
  (ITFEA, 5) is a suitable 19F biomolecular NMR probe
