figure_title: 'Mismatch repair pathway in human cells: (1,2) Mismatch Recognition
  the MutSα (MSH2-MSH6) or MutSβ (MSH2-MSH3) complexes recognize base–base mismatches
  or insertion–deletion loops, binding to the mismatched DNA and cleaves the DNA at
  a distance from the mismatch; (3) PCNA, loaded onto DNA by RFC, acts as a sliding
  clamp to facilitate the coordination of downstream repair events; excision of the
  Mismatched DNA Segment and Resynthesis Exonuclease 1 (EXO1), in conjunction with
  PCNA excises the DNA segment containing the mismatch; (4) Replication protein A
  (RPA) binds to the single-stranded DNA to protect it from further degradation and
  to prevent secondary structure formation.'
caption: 'Mismatch repair pathway in human cells: (1,2) Mismatch Recognition the MutSα
  (MSH2-MSH6) or MutSβ (MSH2-MSH3) complexes recognize base–base mismatches or insertion–deletion
  loops, binding to the mismatched DNA and cleaves the DNA at a distance from the
  mismatch; (3) PCNA, loaded onto DNA by RFC, acts as a sliding clamp to facilitate
  the coordination of downstream repair events; excision of the Mismatched DNA Segment
  and Resynthesis Exonuclease 1 (EXO1), in conjunction with PCNA excises the DNA segment
  containing the mismatch; (4) Replication protein A (RPA) binds to the single-stranded
  DNA to protect it from further degradation and to prevent secondary structure formation.
  DNA polymerase δ, with the aid of PCNA, synthesizes the replacement strand using
  the undamaged template as a guide; (5) DNA Ligation DNA ligase I seals the remaining
  nick, completing the repair and restoring the integrity of the DNA molecule'
