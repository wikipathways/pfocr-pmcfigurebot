figure_title: Schematic Representation of a Proposed Working Model Based on Transcriptional
  and Bioinformatic Analyses.
caption: Schematic Representation of a Proposed Working Model Based on Transcriptional
  and Bioinformatic Analyses. A schematic model illustrating a hypothesis-generating
  working model underlying the synergistic effects of MMC and quercetin is presented.
  Based on KEGG pathway enrichment analysis and experimental qRT-PCR data, combination
  treatment is associated with transcriptional changes consistent with p53-related
  signaling pathways, thereby contributing to coordinated regulation of cell cycle
  arrest and apoptotic responses. Upregulation of CDKN1A (p21) is associated with
  induction of cell cycle arrest, whereas increased expression of BAX and CASP3, together
  with suppression of BCL-2, suggests transcriptional patterns compatible with mitochondrial
  apoptotic signaling. This model integrates in silico pathway analyses with experimentally
  observed transcriptional changes and should be interpreted as a conceptual framework
  rather than a direct experimental validation of signaling mechanisms
article_title: 'Quercetin Sensitizes Retinoblastoma Cells to Mitomycin C Through Transcriptional
  Modulation of p53-Regulated Apoptotic Genes: A Preclinical Study'
