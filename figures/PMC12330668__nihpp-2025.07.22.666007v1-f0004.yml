figure_title: Cebpa_ASKO iWAT is dysfunctional
caption: A. Number of differentially expressed genes in bulk RNA-seq of control and
  Cebpa_ASKO iWAT total tissue RNA. B. Volcano plot of DESeq2 analysis of bulk RNA-seq
  data from Cebpa_fl/fl and Cebpa_ASKO iWAT (n=3). C. Gene set enrichment analysis
  for GO terms from bulk iWAT RNA-seq data. D. Taqman qPCR for Adipoq in iWAT from
  Cebpa_fl/fl and Cebpa_ASKO mice (n=5-7). E. Adiponectin measured via ELISA in plasma
  of 4hr-fasted Cebpa_ASKO mice (n=5-7). F. Adiponectin (Acrp30) protein levels measured
  via western blot in lysates from Cebpa_fl/fl and Cebpa_ASKO iWAT. G. Identification
  of upstream regulators most likely to contribute to differences in gene expression
  using Ingenuity Pathway Analysis. H. Taqman qPCR for Pparg in whole iWAT (n=5-6).
  I. Western blot analysis of PPARg in homogenates of whole iWAT (n=4). J. Densitometry
  analysis of I, normalized to vinculin. K. Non-esterified fatty acid concentration
  measured in media from iWAT SVF-derived adipocytes treated with vehicle or CL-316,243,
  normalized to triglyceride mass of each sample (n=2). L. Western blot analysis of
  lipolysis markers in homogenates of SVF-derived adipocytes from G after 2h of stimulation.
  All mice were 10-12-weeks-old and chow-fed. Student’s t-test was used to analyze
  results (*p<0.05, **p<0.01, ****p<0.0001)
