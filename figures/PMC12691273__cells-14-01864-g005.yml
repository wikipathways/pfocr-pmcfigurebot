figure_title: Effects of FSH-induced FOXO1 nuclear exclusion on GC proliferation and
  apoptosis via PI3K/Akt signaling pathway.
caption: Effects of FSH-induced FOXO1 nuclear exclusion on GC proliferation and apoptosis
  via PI3K/Akt signaling pathway. (a) The subcellular localizations of FOXO1 protein
  in cultured GCs under FSH or/and Ly294002 treatment by immunofluorescence assay.
  The red line segment at the bottom right corner of the image is the scale bar (Leica,
  400×; scale bar = 5 µm). (b) The expression levels of BCL mRNA in cells under FSH
  or/and LMB treatment by RT-qPCR assay. (c) The expression levels of CASP3 mRNA under
  the same treatment as (b). (d) The expression levels of CCND1 mRNA. (e) The expression
  levels of PCNA mRNA. (f–k) The GC proliferation and apoptosis under FSH or/and LMB
  treatment by flow cytometry assay. All data are presented as means ± SEM. n = 3.
  For each group, the superscript symbol above the bar indicates that the difference
  was significant compared to the control group, ** p  <  0.01, * p  <  0.05
