figure_title: MAVS plays a central role in integrating RLR signaling and metabolism
caption: 'RLR activation by virus infection or immunostimulatory dsRNA promotes glucose
  uptake into cells. Furthermore, activated RIG-I displaces HK2 from MAVS, thereby
  inhibiting glycolysis, which leads to lower lactate levels and reverses lactate-mediated
  inhibition of MAVS. MAVS regulates glucose metabolism in multiple ways. MAVS diverts
  glucose flux from the glycolytic pathway to the pentose-phosphate pathway (PPP)
  through an interaction with G6PD at peroxisomes, and to the hexosamine biosynthesis
  pathway (HBP) through binding to GFPT at MAMs. HBP-generated UDP-GlcNAc enhances
  MAVS signaling through O-linked GlcNAcylation (G) of MAVS. The metabolic intermediates
  succinyl-CoA and fumarate promote MAVS activation through succinylation (SucK) at
  K7 and succination (2SC) at C46 and C283, respectively. The TCA cycle derivative
  itaconate promotes RLR signaling through inhibition of SDH, which induces the release
  of mtRNA, which is subsequently sensed by RLRs. Low glucose levels can promote IFN
  induction through AMPK-mediated phosphorylation (P) of TBK1 at S511. AAS: aspartate-argininosuccinate
  shunt; AMPK: AMP-activated kinase; F6P: fructose-6-phosphate; G6P: glucose-6-phosphate;
  G6PD: G6P dehydrogenase; GFPT: glutamine-F6P transaminase; HK1/2: hexokinase 1 or
  2; OGT: protein O-GlcNAc transferase; SDH: succinate dehydrogenase; UDP-GlcNAc:
  uridine diphosphate N-acetylglucosamine; mtRNA: mitochondrial RNA'
