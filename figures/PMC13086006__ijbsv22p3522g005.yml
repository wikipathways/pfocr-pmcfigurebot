figure_title: Research progress of UCPs in multisystem diseases.
caption: Research progress of UCPs in multisystem diseases. UCPs are involved in the
  development and progression of various metabolic diseases, including obesity and
  diabetes, cardiovascular disease, neurological diseases, and cancer. UCP1-3 combats
  obesity and diabetes by improving insulin resistance and fatty acid metabolism.
  In cardiovascular disease, UCP1 improves atherosclerosis by mediating lipid metabolism
  and inhibiting the NLRP3-LI-1β inflammatory pathway. Similarly, UCP2 inhibits atherosclerosis
  by reducing lipid accumulation and oxidative stress. In myocardial infarction and
  ischemia-reperfusion injury, UCP1 promotes the cardioprotective factor BMP3b to
  reduce IR, while UCP3 improves mitochondrial function to exert vascular protection.
  Furthermore, UCP3 mediates aspartate metabolism and regulates protein kinase G signaling
  to alleviate cardiac hypertrophy and HFpEF. In neurological diseases, UCPs target
  calcium homeostasis and mitochondrial function to alleviate neurodegenerative diseases,
  including Alzheimer's and Parkinson's disease. UCP2 inhibits ferroptosis and inflammatory
  responses, effectively improving neurovascular disease. Additionally, UCPs are widely
  involved in tumorigenesis and progression. UCP2 promotes melanoma through Akt/mTOR
  and ERK and also mediates KRAS to affect PDAC. Furthermore, studies have found that
  UCP1-mediated thermogenesis is associated with acute leukemia, and increased UCP1
  expression can serve as a biomarker for early-stage PDAC. These findings strongly
  suggest that UCPs-guided targeted therapies or multi-target combination therapies
  will become innovative treatments in the future. NLRP3, NOD-like receptor protein
  3 inflammasome; PCI, percutaneous coronary intervention; HFpEF, heart failure with
  preserved ejection fraction; mPTP, mitochondrial permeability transition pore; AMPKα,
  AMP-activated protein kinase alpha; NRF1, nuclear factor E2-related factor 1; PDAC,
  pancreatic ductal adenocarcinoma; mTOR, mammalian target of rapamycin; ERK, Extracellular
  signal regulated kinases; KRAS, Kirsten rat sarcoma viral oncogene
