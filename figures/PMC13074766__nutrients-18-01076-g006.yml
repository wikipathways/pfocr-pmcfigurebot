figure_title: KEGG pathway enrichment analysis of core miRNA target genes.
caption: 'KEGG pathway enrichment analysis of core miRNA target genes. Bubble plots
  show KEGG pathway enrichment of core upregulated miRNA target genes (a) and core
  downregulated miRNA target genes (b). In each panel, phase-related (Phase) core
  targets are shown at the top, and exercise-related (Exercise) core targets are shown
  at the bottom ((a): Phase, n = 303; Exercise, n = 303; (b): Phase, n = 70; Exercise,
  n = 107; n indicates the number of genes used for DAVID KEGG enrichment analysis).
  The x-axis represents fold enrichment. Dot size indicates the number of genes in
  each KEGG pathway (Count), and dot color represents the −log10 (FDR). KEGG pathway
  enrichment analysis was performed using DAVID 2025 (v2025_1) with Mus musculus used
  as the reference background in DAVID. For upregulated genes, significance was defined
  as FDR < 0.05; for downregulated genes, a more permissive threshold of FDR < 0.10
  with Count ≥ 3 was applied. KEGG, Kyoto Encyclopedia of Genes and Genomes; FDR,
  false discovery rate; DAVID, Database for Annotation, Visualization and Integrated
  Discovery'
