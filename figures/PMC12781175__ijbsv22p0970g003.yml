figure_title: The scRNA-Seq analysis of MRPS7 and MRPS23 in NPC.
caption: The scRNA-Seq analysis of MRPS7 and MRPS23 in NPC. (A) The t-SNE visualization
  of single-cell RNA sequencing data from NPC_GSE150430. (B) MRPS7 expression profile
  across single-cell clusters in NPC_GSE150430. (C) MRPS23 expression profile across
  single-cell clusters in NPC_GSE150430. (D) The t-SNE visualization of single-cell
  RNA sequencing data from NPC_GSE162025. (E) MRPS7 expression profile across single-cell
  clusters in NPC_GSE162025. (F) MRPS23 expression profile across single-cell clusters
  in NPC_GSE162025. (G) GSEA identified significant enrichment of EMT pathway genes
  in MRPS7/23-high expressing malignant cells from NPC_GSE162025. (H) GSEA identified
  significant enrichment of beta-catenin pathway genes in MRPS7/23-high expressing
  malignant cells from NPC_GSE162025. (I) GSEA revealed positive correlation between
  MRPS7/23 expression and the Hallmark EMT pathway in scRNA-Seq data of NPC_GSE150430.
  (J) GSEA revealed positive correlation between MRPS7/23 expression and the Hallmark
  Wnt-β-catenin pathway in scRNA-Seq data of NPC_GSE150430. (K) Cells enrichment of
  MRPS7 expression in scRNA-Seq data of NPC_GSE162025 and NPC_GSE150430. (L) Cells
  enrichment of MRPS23 expression in scRNA-Seq data of NPC_GSE162025 and NPC_GSE150430
