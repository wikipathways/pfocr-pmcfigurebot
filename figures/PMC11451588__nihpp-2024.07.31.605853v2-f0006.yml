figure_title: PS direct pathway bias of visual decisions depends on visual context
  and reward reinforcement
caption: 'A. Left: Schematic of visual displays and timing of light delivery for two-patch
  (late delay) and sequence-arrested one-patch and pink noise control trials. Right:
  Lick probability observed following PS D1-MSN stimulation paired with the different
  visual conditions on contralaterally cued trials (N = 6 mice). B. Left: Schematic
  of operant extinction session structure, with change event paired or unpaired with
  PS D1-MSN stimulation Right: Omitting rewards for correct detection responses resulted
  in similar extinction rates for PS D1-MSN stimulation (blue) and non-stimulation
  (gray) trials. Extinction rates derived from trial hits and misses (open circles;
  combined sessions of 4 mice). One-way repeated measures ANOVA (A). Error bars represent
  s.e.m. (A); dashed lines represent 95% confidence intervals (CIs) (B)'
article_title: A distinct circuit for biasing visual perceptual decisions and modulating
  superior colliculus activity through the mouse posterior striatum
