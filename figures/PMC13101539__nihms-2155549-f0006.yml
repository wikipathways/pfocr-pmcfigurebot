figure_title: Genistein mitigates cytokine-induced myocardial injury in mice
caption: '(A) Experimental design: wild-type BALB/c mice pretreated with genistein
  [50 mg/kg, oral gavage (p.o.), 7 days] before intravenous (iv) injection of CXCL10
  and IFN-γ (0.1 mg/kg each). (B) Serum cTnI amounts 4 hours after cytokine injection
  (n = 6 mice per group). (C) Immunofluorescence staining showing neutrophil infiltration
  in hearts. Heart tissue sections were stained for MLC-2 V (magenta, cardiomyocyte
  marker), LY6G (green, neutrophil marker), and DAPI (blue, nuclei). Scale bars, 150
  μm. (D) Quantification of LY6G+ cells in mouse heart sections. n = 6 mice per group.
  (E) Immunofluorescence staining showing macrophage infiltration in hearts. Heart
  tissue sections were stained for MLC-2 V (magenta, cardiomyocyte marker), CD68 (green,
  macrophage marker), and DAPI (blue, nuclei). Scale bars, 150 μm. (F) Quantification
  of CD68+ cells in mouse heart sections. n = 6 mice per group. (G) Immunoproteasome
  activity in heart tissue lysates (n = 6 mice per group). (H and I) KEGG pathway
  analysis from bulk RNA-seq of heart tissues (n = 6 mice per group): control versus
  cytokine (H) and cytokine versus cytokine and genistein (I). A complete list of
  affected pathways is provided in data file S6. For multiple comparisons in (B),
  (D), (F), and (G), statistical significance was determined using ANOVA with Holm-Šidák’s
  post hoc test. Error bars represent ± SEM. Statistical significance is defined as
  not significant (n.s.), *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001. cAMP,
  cyclic adenosine 3′,5′-monophosphate; PKG, cGMP (cyclic guanosine 3′,5′-monophosphate)–dependent
  protein kinase; TGF-β, transforming growth factor–β; PPAR, peroxisome proliferator–activated
  receptor; ECM, extracellular matrix; ROS, reactive oxygen species'
