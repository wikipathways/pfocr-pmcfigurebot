caption: 'Biosynthesis pathway of STX [1,59]: Steps 1–3, Claisen condensation: Acetyl-CoA
  transfers an acetate group to the SxtA complex (subunits: MTF, ACP, ACTP, and AONS);
  methyl donation from SAM generates propionyl-SxtA, which undergoes Claisen condensation
  with arginine. Step 4, amidino group transfer: SxtG transfers an amidino group from
  arginine to the SxtA-derived intermediate, forming 4,7-diguanidino-3-oxoheptane.
  Steps 5–7, cyclization and double bond formation: Step 5, SxtB mediates cyclization
  of the amidino intermediate, forming the first heterocycle; Step 6, SxtD introduces
  a C1–C5 double bond; Step 7, SxtS catalyzes epoxidation of the new double bond,
  and epoxide ring opening generates aldehydes, triggering bicyclization. Steps 8–9,
  reduction and hydroxylation: Step 8, SxtU reduces the terminal aldehyde to an alcohol;
  Step9, SxtH/SxtT catalyze C12 dihydroxylation, with O2 and succinate as co-substrates.
  Step 10, carbamoyl transfer: the SxtI/SxtJ/SxtK complex transfers a carbamoyl group
  to the dihydroxylated intermediate (dsSTX), yielding saxitoxin (STX)'
