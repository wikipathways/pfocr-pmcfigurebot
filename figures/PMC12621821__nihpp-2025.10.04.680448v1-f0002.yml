figure_title: Functional characterisation of the gC2 constructs
caption: A) Schematic of the alternative pathway. B) ELISA to determine C3b binding
  of the gC2 constructs. Data are from 2 biological repeats (n=2), each measured in
  triplicate (3 technical repeats). C) Assay to determine inhibition of the alternative
  pathway by the different gC constructs. GVB was used as a positive control for haemolysis.
  Data are from 3 biological repeats (n=3). D) Assay to determine inhibition of the
  classical pathway by the different gC constructs. GVB was used as a positive for
  haemolysis and compstatin as a known inhibitor. Data are from 4 biological repeats
  (n=4), except for compstatin, which are from 3 biological repeats (n=3). E) Assay
  to determine if inhibition of the alternative pathway by the gC constructs occurs
  prior to C5 convertase activity or after. Data are from 5 biological repeats (n=5),
  except for N-t/D1-2 C5-/gC+C3-/gC which is from 4 biological repeats (n=4). For
  all panels, data points are presented as mean values and bars represent standard
  deviation
