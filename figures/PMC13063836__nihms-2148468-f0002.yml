figure_title: Proposed mechanisms of supraspinal involvement in poststroke plasticity
caption: Schematic shows some of the descending motor control pathways and their potential
  interaction with intraspinal circuits. The corticospinal tract (red) controls fine
  motor activity by direct activation of spinal motor neurons (green) as well as indirect
  activation through excitatory and inhibitory interneurons. Extrapyramidal tracts
  control muscle tone and posture through an indirect pathway that involves motor
  nuclei in the brainstem. The schematic shows the corticoreticular tract (purple),
  with axons derived from sensory and motor cortex, which synapse on brainstem reticular
  nuclei, which in turn send reticulospinal axons to spinal neurons. At each spinal
  cord level, intraspinal circuits include 1a and 1b (not shown) afferents, spinal
  interneurons, and α motor neurons. Stroke-induced interruption of the corticospinal
  tract causes acute weakness and subsequent spasticity on the opposite side of the
  face and body. The features of spasticity reflect abnormal hyperactivity in intraspinal
  reflex arcs and overactivation of descending pathways, such as the reticulospinal
  tract
