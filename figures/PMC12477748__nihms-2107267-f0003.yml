figure_title: Transcriptomic changes associated with T1D and experimental models and
  TF regulatory landscape of pancreatic cell types
caption: (A) Significantly enriched scRNA-seq DEG pathways in experimental models
  in β cells. The column colors reflect the significance values in the y axis.(B)
  scRNA-seq DEG effect size correlation (Spearman) between experimental models and
  AAB+ islets. Triangles indicate points outside the plotting range. The bottom plot
  indicates the fraction of the agreement of the plots above.(C) TF chromatin information
  overview.32 Briefly, the V-plots encode the distribution of snATAC-seq signals around
  predicted bound TF motif instances for each TF. The chromatin information metric
  at the bottom quantifies the degree of information encoded in the V-plot. Higher
  values mean the TF motif is associated with more ordered chromatin than expected
  by chance.(D) V-plots showing snATAC-seq fragment distribution around predicted
  bound sites for three TFs (top facets) and their associated chromatin information
  (bottom facets) in β cells and immune cells.(E) TF chromatin information Z scores
  across all cell types indicate cell-type-specific regulatory activity for a subset
  of TF motifs. Data from all conditions combined.(F) Similar to (E), but directly
  comparing across conditions for β and immune cells, in the top 15 motifs with respect
  to differences in chromatin information compared to baseline. Square brackets indicate
  motif ID numbers when more than one motif of the same family was included. Z scores
  are calculated separately for each heatmap in (E) and (F)
