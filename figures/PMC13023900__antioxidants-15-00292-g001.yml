figure_title: 'DUOX2 expression is upregulated and correlates with mucosal inflammation
  in patients with CD: (A) Expression profiles of the NADPH oxidase family members
  based on transcriptomic data from the FAH-SYS cohort.'
caption: 'DUOX2 expression is upregulated and correlates with mucosal inflammation
  in patients with CD: (A) Expression profiles of the NADPH oxidase family members
  based on transcriptomic data from the FAH-SYS cohort. NC, normal control; IM, ileal
  mucosa; CM, colonic mucosa; inf, inflamed tissue; non-inf, non-inflamed tissue.
  (B) Relative expression levels of DUOX2 in intestinal mucosal samples from three
  groups: patients with CD with non-inflamed mucosa (CD, non-inflam; n = 16), patients
  with CD with inflamed mucosa (CD, inflam; n = 16), and normal controls (NC; n =
  12). (C) DUOX2 expression in endoscopic specimens from patients with CD (n = 69)
  and NC (n = 32) detected by immunohistochemical (IHC) staining. Left, representative
  IHC images; right, quantitative analysis of IHC scores. (D) Cellular localization
  of DUOX2 based on single-cell RNA-Seq of colonic biopsies from patients with CD
  (n = 14) and controls (CON; n = 13) obtained from the Single Cell Portal. Left,
  uniform manifold approximation and projection (UMAP) plot; right, DUOX2 expression
  across single colonic populations. (E) Correlation analysis between DUOX2 expression
  and SES-CD, CRP, and ESR in patients with CD (n = 69). (F) KEGG pathway analysis
  of RNA-Seq data from normal control intestinal mucosa with high DUOX2 expression
  and low DUOX2 expression. Color intensity represents the p.adjust value (Benjamini–Hochberg
  multiple-testing correction), with p.adjust < 0.05 considered significantly enriched.
  (G) KEGG pathway analysis comparing RNA-Seq data from inflamed and non-inflamed
  intestinal regions in patients with CD; all pathways are upregulated (p.adjust <
  0.05). Note: * p < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001'
