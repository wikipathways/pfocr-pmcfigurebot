caption: (A) UMAP representation illustrating distinct cell cluster phenotypes within
  injured skin (n = 3 animals per group). (B) Distribution of cells from groups treated
  with DHT p.o. + FeCl3 s.c. and vehicle p.o. + H2O s.c. across these clusters. (C)
  Proportions of cell types in DHT p.o. + FeCl3 s.c. and vehicle p.o. + H2O s.c. (D)
  KEGG pathway analysis demonstrating the upregulation of inflammatory pathways in
  macrophages of DHT p.o. + FeCl3 s.c. versus vehicle p.o. + H2O s.c. (E) Dot plot
  highlighting DEGs of IL-17 signaling pathway between DHT p.o. + FeCl3 s.c. and vehicle
  p.o. + H2O s.c. (F) KEGG analysis demonstrating principal pathways upregulated in
  T cells of DHT p.o. + FeCl3 s.c. versus vehicle p.o. + H2O s.c. (G) Dot plot illustrating
  DEGs associated with the Th17 cell differentiation pathway in groups treated with
  DHT p.o. + FeCl3 s.c. and vehicle p.o. + H2O s.c. (H) Violin plot showing TNAP expression
  in specific cell populations in skin of DHT p.o. + FeCl3 s.c. and vehicle p.o. +
  H2O s.c
