caption: Expression pattern of the genes involved in treatment in the (A) GABAergic
  synapse and (B) Circadian signaling pathway in B. mori. R software (4.0.3) was used
  to construct the heatmap; the transcriptome data was dimensionalized using log2.
  Expression changes of (C) GAD and (D) Tim mRNA level in B. mori pupae SG after KK-42
  (n = 3). The relative expression level was normalized to the rp49 gene. The lowest
  expression value was set at 1. The values are the mean ± SEM of three repeat experiments
  using qRT-PCR. Asterisks indicate significant differences for that group compared
  with the control group (by Student t-test, ns means no significant difference, *
  p < 0.05; *** p < 0.001; **** p < 0.0001)
