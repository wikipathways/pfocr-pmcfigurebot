figure_title: Conceptual mediation models illustrating the standardized path coefficient
  of pain intensity on pain disability through psychological variables.
caption: Conceptual mediation models illustrating the standardized path coefficient
  of pain intensity on pain disability through psychological variables. (A) Resilience
  showed a significant indirect association linking pain intensity to pain disability,
  while the direct association between pain intensity and disability also remained
  statistically significant. (B) Psychological inflexibility demonstrated a significant
  indirect association between pain intensity and pain disability, whereas the direct
  association was no longer statistically significant when psychological inflexibility
  was included in the model. (C) Distress was positively associated with pain disability;
  however, the indirect pathway linking pain intensity to disability through distress
  was not statistically significant. (D) Pain catastrophizing showed an indirect-only
  association between pain intensity and disability, underscoring its salient association
  within the cognitive–affective context of pain. Dashed arrows represent non-significant
  paths. *P < .05, **P < .01, ***P < .001
