figure_title: Brain region-specific co-expression analysis of KNCN and MKNK1-AS1 and
  functional pathway enrichment
caption: (a) Pearson correlation coefficients between KNCN and MKNK1-AS1 expression
  levels across 13 brain regions from the GTEx v10 dataset. Brain regions are ordered
  by correlation strength. Dark red bars indicate strong positive correlations (r
  > 0.7), while gray bars indicate moderate to weak correlations (r ≤ 0.7). The dashed
  red line marks the r = 0.7 threshold. Significance levels are denoted as *P<0.05,
  ***P<0.001. (b) Gene Ontology (GO) enrichment analysis of biological processes for
  genes showing strong positive correlation (r > 0.7) with both KNCN and MKNK1-AS1
  in the four brain regions with highest co-expression (nucleus accumbens, putamen,
  caudate, and hypothalamus). Circle size represents fold enrichment, and color intensity
  indicates −log10(FDR) values, with darker blue representing more significant enrichment
