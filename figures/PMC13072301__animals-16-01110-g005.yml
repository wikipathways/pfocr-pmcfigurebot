figure_title: KEGG enrichment bubble plots of the plasma metabolome in yaks (n = 6)
  from the grazing, supplementary-fed, and stall-fed groups.
caption: 'KEGG enrichment bubble plots of the plasma metabolome in yaks (n = 6) from
  the grazing, supplementary-fed, and stall-fed groups. (A) KEGG enrichment analysis
  of differential metabolites in positive ion mode between the grazing group and the
  supplementary-fed group; (B) KEGG enrichment analysis of differential metabolites
  in positive ion mode between the grazing group and the stall-fed group; (C) KEGG
  enrichment analysis of differential metabolites in positive ion mode between the
  supplementary-fed group and the stall-fed group; (D) KEGG enrichment analysis of
  differential metabolites in negative ion mode between the grazing group and the
  supplementary-fed group; (E) KEGG enrichment analysis of differential metabolites
  in negative ion mode between the grazing group and the stall-fed group; (F) KEGG
  enrichment analysis of differential metabolites in negative ion mode between the
  supplementary-fed group and the stall-fed group. Bubble size represents the number
  of differential metabolites enriched in the pathway, bubble color depth represents
  the significance of enrichment (−log10(p-value)), and the horizontal axis represents
  the enrichment factor. The pathways are classified into six functional categories:
  high-altitude adaptation and antioxidant, energy metabolism, amino acid and nitrogen
  metabolism, lipid metabolism, xenobiotic metabolism and detoxification, and vitamin
  and secondary metabolism. Different lowercase letters indicate significant differences
  in pathway enrichment among groups (p < 0.05). Group A is the grazing group, Group
  B is the supplementary-fed group, and Group C is the stall-fed group'
