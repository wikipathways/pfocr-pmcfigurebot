figure_title: NOTCH3 promoted progression of GC through regulating SOD2 activity.
caption: 'NOTCH3 promoted progression of GC through regulating SOD2 activity. (A)
  GO enrichment analysis of DEGs of E2-treated GC cells. (B) Venn diagrams displaying
  the overlap genes between TCGA-STAD (green), removal of superoxide radicals signaling
  (GO: 0019430, pink) and intrinsic apoptotic signaling pathway in response to oxidative
  stress (GO: 0008631, blue), highlighting SOD2. (C) Expression of NOTCH3 in tumor
  tissue (TCGA-STAD). (D,E) Analysis of correlation between NOTCH3 and SOD2 in TCGA-STAD
  and GSE26253 databases. (F) Detecting the effects of E2 on NOTCH3, SOD2 and cytochrome
  complex in GC cell lines with WB. (G) Detecting the effects of E2 and NOTCH3 OE
  on SOD activity in GC cells with SOD activity kit (n = 6). (H) Detecting the effects
  of NOTCH3 KD on SOD2 in GC cell lines with WB. (I) Representative images of DCFH-DA
  staining in HGC-27 cells (scale bar = 50 μm). (J,K) Comparison of ROS intensity
  in the HGC-27 cells of the 4 groups with flow cytometry (NC, E2, NOTCH3 OE and E2
  + NOTCH3 OE, n = 3). (L,M) Mitochondrial membrane potential was measured using the
  JC-1 probe by flow cytometry (n = 3). **** p < 0.0001'
