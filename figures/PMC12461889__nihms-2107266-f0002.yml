figure_title: Epicutaneous S. aureus induces systemic immune responses
caption: 'WT and IL-36R−/− mice dorsal skin was naive or e.c. exposed to S. aureus
  (1 × 108 CFU) for 7 days. Photographs and disease score were taken on day 7, and
  skin biopsies (10 mm), and lungs were harvested on day 10 (n ≥ 9 per group).(A)
  Representative skin photographs.(B) Mean disease score (±SEM).(C) Representative
  lung and bronchiole histology (H&E, scale bars: 1 mm and 100 μm).(D) Lung inflammation
  (%) ±SEM from lung sections as measured by ImageJ software analysis as the percentage
  of the density of H&E staining.(E) Mean bronchiole epidermal thickness (±SEM).(F)
  GO biological process enrichment pathway analysis of RNA-seq from day 10 naive and
  e.c.-exposed (WT) lungs (n = 5 per group). resp, responses; reg., regulation; pos.,
  positive; leuk., leukocyte; migr., migration; sig., signaling.(G) Mean number of
  lung PMNs, monocytes, and eosinophils (±SEM) in day 10 lungs as measured by fluorescence-activated
  cell sorting (FACS).ns, not significant; **p < 0.01, ***p < 0.001, and ****p < 0.0001
  as calculated by a two-tailed Student’s t test (B, D, and E) or one-way ANOVA multiple
  comparisons test with Tukey correction (G). Results are combined from at least 2
  independent experiments. See also Figure S1'
