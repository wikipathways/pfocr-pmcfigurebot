figure_title: Identification of biological processes enriched by DHA+DEX cotreatment
  using PLIER analysis
caption: (A) Functional enrichment analysis using the pathway-level information extractor
  (PLIER) method was used to identify significantly enriched biological processes
  associated with DHA+DEX treatment. PLIER was used to identify high-confidence latent
  variables (LVs; AUC >= 0.7 and FDR <= 0.05) mapped to Gene Ontology (GO) and KEGG
  gene sets. (B) LV estimates for high-confidence LVs are shown for each treatment
  group. Treatment groups were assessed by 3-way ANOVA, and different letters indicate
  significant differences (p <= 0.05). (C) Heat maps of the top 40 genes enriched
  by cotreatment were determined using PLIER. The color scale corresponds to the scaled
  expression value, with red being highly expressed genes and blue corresponding to
  downregulated genes
