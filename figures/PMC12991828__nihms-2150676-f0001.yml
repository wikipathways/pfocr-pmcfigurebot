figure_title: Chronic ethanol intake downregulates CHRM4 and related genes in humans
  and mice
caption: a–f, RNA-seq analysis of bulk duodenal RNA from patients with AUD (n = 44)
  and controls (n = 16). a, Differentially expressed genes (DEGs) in AUD versus control.
  Genes with negative log2-transformed fold changes (FC) are shown in blue (down in
  AUD), and those with positive log2-transformed changes are shown in orange. b, Differential
  CHRM4 expression represented as log2-transformed counts per million (CPM). c, The
  total averages of log2[CPM] representing mAChR4-pathway-related DEGs in AUD versus
  control. d, GSEA of mAChR4-related genes in AUD versus control (top) and AUD with
  elevated ALT levels versus AUD with normal ALT levels (bottom; using a 40 U l−1
  cut-off). e, log2[CPM] of CHRM4 expression in patients with AUD with liver disease
  (n = 32) versus AUD patients without liver disease (n = 12). Liver disease is defined
  by ALT ≥ 40 or liver stiffness measurement (LSM) ≥ 7.8 kPa (ref. 47). f, The −log10[P]
  of some of the top enriched downregulated terms (false-discovery rate (FDR)-adjusted
  P < 0.05) in patients with AUD versus control individuals. The blue arrows show
  pathways associated with GAP formation and neuronal regulation. ECM, extracellular
  matrix. g,h, WT mice were fed control (n = 6–8) or ethanol-containing (n = 6) Lieber
  DeCarli diets for 10 weeks. n = 3 independent experiments. g, Duodenal GAPs per
  villus and representative SI sections showing GAPs (arrowheads) as tetramethylrhodamine
  (TMR)–dextran-filled (red) columns traversing the nucleated epithelium (DAPI, blue)
  positive for MUC2 (green). Scale bar, 25 μm. h, Quantitative PCR (qPCR) analysis
  of duodenal Chrm4 mRNA. Diagonal ticks indicate a break in the y-axis scale (b,
  e, g, h). For a, the volcano plot is based on Limma (eBayes); threshold, −log10[P]
  = 1.31 ⇒ P = 0.049. For d, normalized enrichment scores (NES) represent the strength;
  q values were defined as the maximum Benjamini–Hochberg-adjusted P value across
  Fisher’s test, fGSEA, Camera and GSVA/limma. P values were calculated using unpaired
  Student’s t-tests (c (ITPR1, GNG7, GNB5) and g) or Mann–Whitney U-tests (b, c (rest
  of the genes), g and h), unpaired Welch’s t-tests (e and h) and Fisher’s exact tests
  with the Benjamini–Hochberg method (FDR) (f). Data are mean ± s.e.m. *P (or q) <
  0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001
