figure_title: Metabolic and epigenetic functions of Kpr.
caption: Metabolic and epigenetic functions of Kpr. Propionate-derived propionyl-CoA
  supports lysine propionylation on histones and non-histone proteins in the nucleus
  and mitochondria. Histone propionylation at enhancers and promoters modulates chromatin
  accessibility and gene expression programs linked to lipid metabolism, circadian
  rhythm, proliferation, inflammation, senescence, stress responses, and cancer. Propionylation
  of the transcriptional cofactor POU2AF1 enhances SLC7A11 transcription, whereas
  lysine substitution diminishes this activity. Propionylation of chromatin-associated
  repair factors tunes DNA damage responses. Sirtuin-dependent depropionylation influences
  protein stability through ubiquitin proteasome turnover, exemplified by HIF-1α control.
  In mitochondria, SOD2 propionylation reduces antioxidant function, increases ROS,
  and affects cell fate. Propionate catabolism links methylmalonate and methylcitrate
  pathways, providing a metabolic conduit to nuclear signaling and genome maintenance.
