figure_title: Comprehensive effects of natural products on kidney diseases by regulating
  gut microbiota.
caption: Comprehensive effects of natural products on kidney diseases by regulating
  gut microbiota. Natural products, including TCMs and plant extracts, are important
  therapies for intervening in diverse kidney diseases, including AKI and CKD. They
  retard renal fibrosis in a gut microbiome-dependent pathway. They attenuated AKI
  by increasing levels of SCFAs and decreasing levels of LPS, inhibiting NF-κB and
  TGF-β/Smad signaling pathways, and upregulating GSH, GPX4, and SLC7A11 expression.
  They improved renal fibrosis and inflammation by increasing levels of SCFAs and
  IAld, decreasing levels of uremic toxins, inhibiting TGF-β/Smad signaling pathway,
  as well as inflammatory factors, reducing tryptophan transport and indole synthesis
