caption: Flowchart of the research design. The core objective is to eliminate reverse
  causal interference through bidirectional MR analysis, while integrating pathway
  enrichment, database validation, and drugability assessment to ensure that the selected
  protein markers possess both “causal association” and “clinical translational value”.
  Some steps (such as instrumental variable selection and MR analysis) have been repeatedly
  verified to reduce bias
