caption: Distributions of differentially methylated positions (DMPs) relative to genomic
  structures within nuclear genes that encode mitochondrial pathway proteins. DMPs
  were distributed in gene structures in MCI vs. CU (A), AD vs. CU (B), and AD vs.
  MCI (C) pairwise comparisons of cognitive status. Promoter regions displayed above
  encompass the annotatr-defined promoter region (i.e., <1kB DNA sequence upstream
  of the transcription start site) and the 1–5 kB region upstream of the promoter.
  Because we defined promoter regions as up to 5 kB in the 5’ direction of the transcription
  start site, we combined the annotatr-defined promoter region and 1–5 kB regions
  upstream of the promoter for the purpose of consistency
