figure_title: A model of pollen grain hydration during the functioning of hybridization
  barriers in Brassicaceae.
caption: A model of pollen grain hydration during the functioning of hybridization
  barriers in Brassicaceae. (a)—Stages of male and female gametophyte interaction
  in the pollen-pistil system; (b)—Unpollinated pistil. In the absence of pollen on
  the surface of the papilla, the transport of water and reproductive materials is
  suppressed. This is achieved through the continuous secretion of autocrine signaling
  ligands RALF23 and RALF33, which are perceived by the stigmatic ANJEA/FERONIA signaling
  complex; (c)—Self-compatible pollination. In the case of compatible pollination,
  the PCP-B protein from the pollen coat competitively binds to the LLG1/ANJEA/FERONIA
  signaling complex on the papilla surface. This competitive inhibition switches off
  RBOHD-dependent ROS production, resulting in decreased intracellular ROS levels,
  which allows the transport of water and reproductive materials to facilitate pollen
  hydration; (d)—Self-incompatible pollination. Upon attachment of incompatible pollen,
  the transport of water and reproductive materials within the stigmatic papilla is
  suppressed. This is achieved through the continuous secretion of autocrine signaling
  ligands RALF23 and RALF33, which are perceived by the stigmatic LLG1/ANJEA/FERONIA
  signaling complex. This interaction activates the membrane-localized NADPH oxidase
  RBOHD via the Rop2 GTPase pathway, subsequently promoting ROS production in the
  cell wall, which are transported back into the cytoplasm of the stigmatic papilla,
  blocking the transport of water and reproductive materials; (e)—Model of preventing
  pollen hydration during interspecific/unilaterally incompatible (UI) cross-pollination.
  In interspecific or unilaterally incompatible pollen, SRK activates FER-mediated
  ROS production and an ARC1-dependent degradation pathway, inhibiting pollen hydration;
  (f)—Model of the effect of pollen-specific RALFs on female tissues located in the
  FER, ANJ, and HERK1 receptor complexes for the coordinated establishment, maintenance,
  and removal of the polytubey block during fertilization
