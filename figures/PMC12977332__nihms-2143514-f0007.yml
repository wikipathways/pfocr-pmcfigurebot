figure_title: HBP contributes to glucose-induced SREBP-1c activation via O-GlcNAcylation-dependent
  mTORC1 activation
caption: AML12 cells were treated with low-glucose (5 mM) and high-glucose (25 mM)
  for 16 hours. (A) Protein abundance of phosphorylated and total S6 was detected
  by Western blot with quantification. The same loading control (actin) was used as
  presented in Fig. 4C as they were from the same Western blot membrane. (B & C) AML12
  cells were treated with low-glucose (5 mM) and high-glucose (25 mM) for 16 hours
  in the presence of rapamycin, an mTORC1 inhibitor. (B) DNL-related gene mRNA levels.
  (C) Intracellular TAG levels. (D) HepaRG cells were treated with low-glucose (5
  mM) and high-glucose (25 mM) for 16 hours. Protein abundance of phosphorylated and
  total S6 was detected by Western blot with quantification. (E) HepaRG cells were
  treated with low-glucose (5 mM) and high-glucose (25 mM) for 16 hours with rapamycin
  pretreatment. DNL-related gene mRNA levels. (F) AML12 cells were treated with low-fructose
  (5 mM) and high-fructose (25 mM) for 16 hours. Protein abundance of phosphorylated
  and total S6 was detected by Western blot with quantification. The same loading
  control (actin) was used as presented in Fig. 4I as they were from the same Western
  blot membrane. (G & H) AML12 cells were treated with low-fructose (5 mM) and high-fructose
  (25 mM) for 16 hours with rapamycin pretreatment. (G) DNL-related gene mRNA levels.
  (H) Intracellular TAG levels. (I & J) AML12 cells were transfected with siRNAs targeting
  GFPT1 or treated overnight with azaserine (AZA), a pharmacological inhibitor of
  GFPT1, prior to exposure to low-glucose (5 mM) and high-glucose (25 mM) media for
  16 hours. Protein abundance of phosphorylated and total S6 was detected by Western
  blot with quantification. (K) A schematic of UDP-GlcNAc utilization in protein glycosylation
  pathways. (L & M) AML12 cells were treated with low-glucose (5 mM) and high-glucose
  (25 mM) for 16 hours in the presence of OSMI or Tunicamycin. Protein abundance of
  phosphorylated and total S6 was detected by Western blot with quantification. Data
  were expressed as mean ± SD. Statistical comparisons were made using one-way ANOVA
  and two-way ANOVA with Tukey’s post hoc test. *p < 0.05, **p < 0.01, ***p < 0.001
  versus the corresponding control. Glu, glucose; Fru, fructose; Rapa, rapamycin;
  AZA, azaserine; Tuni, tunicamycin
