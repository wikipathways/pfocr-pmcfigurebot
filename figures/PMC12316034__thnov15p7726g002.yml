figure_title: THM induced autophagic cell death in pancreatic cancer cells.
caption: THM induced autophagic cell death in pancreatic cancer cells. (A) Venn diagram
  of THM versus control group in SW1990 and PANC-1 cells. (B) Pathways enrichment
  based on 715 differential genes expressed using Metascape in pancreatic cancer cell
  lines. (C-D) Transcriptome sequencing of SW1990 and PANC-1 cells with or without
  THM treatment and GSEA enrichment analysis showed high enrichment in the autophagy
  pathway. (E) Western blot analysis of the expression of the autophagy-related proteins
  following THM treatment for 24 h. (F-G) The effect of THM on the induction of autophagy
  in pancreatic cancer cells was analyzed by transfection of mCherry-GFP-LC3 labelled
  plasmids in SW1990 and PANC-1 cells by using laser confocal microscopy. Scale bars:5
  μm. (H-I) Quantification of representative fluorescence micrographs, including AP
  (autophagosome) and AL (autolysosome). (J-K) Representative electron micrographs
  of DMSO or THM treatment SW1990 and PANC-1 cells. Red arrows indicate AL, and white
  arrows indicate AP. (L-M) Quantification of AVs (autophagic vesicles, including
  AP and AL)
article_title: Tetrahydromagnolol induces autophagic cell death by targeting the m6A
  reader protein YTHDF2 and enhances the efficacy of anti-PD-1 immunotherapy in pancreatic
  cancer cells
