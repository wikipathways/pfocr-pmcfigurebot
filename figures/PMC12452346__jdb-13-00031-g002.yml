figure_title: The non-canonical Wnt/Ca2+ signaling pathway.
caption: The non-canonical Wnt/Ca2+ signaling pathway. Wnt ligand binding to the Frizzled
  receptor activates G proteins and Dvl, triggering PLC to produce IP3 and DAG from
  PIP2. Profilin1 can interact with phosphoinositide lipids, PIP2/IP3. IP3 induces
  Ca2+ release from the endoplasmic reticulum, activating multiple downstream effectors,
  including Calcineurin/NFAT and CAMKII/TAK1/NLK pathways, while DAG activates PKC/CDC42
  signaling. These pathways ultimately regulate distinct cellular processes, including
  morphogenesis and cell transition
