figure_title: Mutations and main epigenetic regulators in B cell malignancies.
caption: 'Mutations and main epigenetic regulators in B cell malignancies. The most
  common epigenetic regulators and their mutations are listed in colored boxes representing
  the most frequent mature B cell malignancies: (blue = DLBCL; orange = FL; red =
  CLL). Arrows indicate the functional consequences of mutations or deregulated non-coding
  RNAs on signaling pathways. Colored stars define the disease context in which each
  alteration occurs. Numbers identify the genes and the epigenetic regulators involved.
  Their impact on different cell pathways is reported by colored stars which define
  the disease; numbers identify the genes and the epigenetic regulators involved.
  CREBBP loss of function mutations result in overactivation of NOTCH and BCR pathways
  in DLBCL and FL. KMT2D mutations significantly impact on JAK-STAT and BCR signaling
  in FL. RAS-ERK and MYC pathways are activated in DLBCL. Increased mi-21 and mi-125
  levels activate mTOR and NF-kB pathways in DLBCL, thus promoting proliferation.
  Mi-150 promotes FOXP1 expression, mediating B cell transformation in DLBCL, FL and
  CLL. ARID1A mutations result in increased tumor progression in FL and CLL. Hypermethylation
  of SFRP1 induces its own downregulation as well as the hyperactivation of WNT signaling
  in CLL. Increased mi-155 levels enhance BCR pathway, mi-101 downregulation leads
  to EZH2 overexpression and deletion of mi-15/16 increases BCL-2 expression promoting
  survival in CLL cells. Created in BioRender.com. Gaidano G. (2025) https://BioRender.com/nufxqjt
  (accessed on 19 August 2025). DLBCL, diffuse large B cell lymphoma; FL, follicular
  lymphoma; CLL, chronic lymphocytic leukemia'
