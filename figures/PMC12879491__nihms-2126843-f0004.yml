figure_title: Interplay between disulfidptosis and antitumor immunity.
caption: 'Interplay between disulfidptosis and antitumor immunity. SLC7A11 imports
  cystine into CD8+ T cells, where NADPH generated by the PPP reduces it to cysteine,
  preventing disulfide stress and preserving cytoskeletal integrity. During CD8+ T
  cell exhaustion, chronic T cell receptor signaling activates STAT3, which induces
  LDHB expression. LDHB inhibits G6PD, the rate-limiting enzyme in the PPP that converts
  G6P to 6-phosphogluconolactone while generating NADPH, thereby suppressing PPP-derived
  NADPH. When NADPH is depleted, cystine accumulates, causing aberrant disulfide bonding
  in ACPs, actin network collapse, and disulfidptosis in CD8+ T cells. This accelerates
  T cell exhaustion and weakens antitumor immunity. Created in BioRender. SLC7A11:
  solute carrier family 7 member 1; NADPH: reduced nicotinamide adenine dinucleotide
  phosphate; STAT3: signal transducer and activator of transcription 3; LDHB: lactate
  dehydrogenase B; G6PD: glucose-6-phosphate dehydrogenase; G6P: glucose-6-phosphate;
  PPP: pentose phosphate pathway; ACPs: actin cytoskeleton proteins'
