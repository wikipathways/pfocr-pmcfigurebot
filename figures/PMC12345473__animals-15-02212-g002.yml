figure_title: Reactions and enzymes of the three major methanogenic pathways (i.
caption: 'Reactions and enzymes of the three major methanogenic pathways (i.e., hydrogenotrophic,
  methylotrophic, and acetoclastic) in the rumen. Hydrogenotrophic (green arrows):
  1. Free CO2 is reduced by ferredoxin (Fdred, reduced form; Fdox, oxidized form).
  Methanofuran (MFR) is attached to the resulting CHO molecule via ligation of formylmethanofuran
  dehydrogenase. 2. The formyl group is transferred via formylmethanofuran–tetrahydromethanopterin
  N-formyltransferase to tetrahydromethanopterin (H4MPT), forming formyl-H4MPT and
  releasing MFR. 3. Formyl-H4MPT is hydrolyzed by N5, N10 methenyltetrahydromethanopterin
  cyclohydrolase, resulting in methenyl-H4MPT and H2O. 4. Methenyl-H4MPT is reduced
  to methylene-H4MPT by N5, N10-methylenetetrahydromethanopterin dehydrogenase with
  electrons from coenzyme F420. 5. Methylene-H4MPT is further reduced to methyl- H4MPT
  by N5, N10-methylenetetrahydromethanopterin reductase with electrons from coenzyme
  F420. 6. H4MPT is removed by N5-methyltetrahydromethanopterin, and the methyl group
  is transferred to coenzyme M (CoM) by coenzyme M-methyltransferase, forming methyl-S-CoM.
  7. Reduction via methyl–coenzyme M reductase forms CH4, coenzyme B, and coenzyme
  M (CoB and CoM). 8. Heterodisulfide reductase reduces the sulfur groups on CoB and
  CoM, which are recycled back into the pathway. Methylotrophic (blue arrows): 1.
  Methyl groups from methanol/methylamines (CH3-R), carried by cognate corrinoid proteins,
  are transferred to CoM-SH via substrate-specific methyltransferases. 2. In the presence
  of H2, CH3-SCoM is reduced to CH4, or the lack of H2 triggers oxidation of CH3-ScoM,
  subsequently resulting in CO2, via the reverse hydrogenotrophic pathway previously
  described. Acetoclastic (orange arrows): 1. Acetate (CH-COOH) is activated into
  acetyl-CoA via acetyl-CoA synthetase and ATP. 2. Carbon monoxide dehydrogenase/acetyl-CoA
  synthase converts acetyl-CoA to methyl and carbonyl groups, then the carbonyl group
  is oxidized by ferredoxin while the methyl group is transferred to H4MPT. 3. CH4
  is produced following the last two steps of the hydrogenotrophic pathway. Adapted
  from Lyu et al. [23] and Lessner [24]. Created in BioRender. Youngmark, E. (2025)
  https://BioRender.com/r19u943 (accessed on 16 May 2025)'
