figure_title: (A) Volcano plot displaying proteins differentially expressed in n =
  14 patients with anti-NXP2 antibodies at baseline (BL) using a linear mixed effects
  (lme) model with post-hoc testing.
caption: (A) Volcano plot displaying proteins differentially expressed in n = 14 patients
  with anti-NXP2 antibodies at baseline (BL) using a linear mixed effects (lme) model
  with post-hoc testing. Significance was defined as P-adj < .1 in the lmer and P-adj
  < .05 in post-hoc lme. Colour represents significance and red indicates proteins
  falling within the GOBP (Gene Ontology Biological Process) term ‘blood vessel development’.
  (B) Dotplot displaying pathway enrichment analysis terms associated with NXP2-associated
  proteins using GOBP references where dot size represents the percentage of DEPs
  within that term and colour represents significance defined by the FDR (false discovery
  rate). (C, D) Dotplots displaying normalised gene expression (indicated by colour)
  and per cent of cells (indicated by size of dot) expressing the genes of NXP2-associated
  proteins from (C) single nuclei RNA sequencing from muscle (n = 7 JDM, n = 6 CTL,
  26,638 total nuclei) and from (D) single-cell RNA sequencing from skin (n = 12 JDM,
  n = 4 control, 91,216 total cells). (E) Volcano plot displaying proteins differentially
  expressed in n = 9 patients with MDA5 antibodies at BL using an lme model with post-hoc
  testing. Significance was defined as P-adj < .1 in the lme and P-adj < .05 in post-hoc
  lme. Colour represents significance and type III IFN proteins are in red and surfactant
  proteins in yellow for emphasis. (F) Point range plots of IFN proteins where the
  dot represents the fixed effect NPX estimate and the line the 95% CI summarised
  the NPX difference between JDM BL patients positive for MDA5 antibodies and those
  negative for MDA5 antibodies. (G) Same plots as E but for surfactant proteins. DEP,
  differentially expressed proteins; IFN, interferon; JDM, juvenile dermatomyositis;
  MDA5, melanoma differentiation-associated protein 5; NPX, normalised protein expression;
  NXP2, nuclear matrix protein 2
