figure_title: DHCR24 knockdown induces mitochondrial dysfunction and activates senescence-related
  cGAS-STING pathway.
caption: 'DHCR24 knockdown induces mitochondrial dysfunction and activates senescence-related
  cGAS-STING pathway. (A, B) Experimental workflow for (A) studies in Dhcr24-cKO mice
  and (B) in vitro experiments in DHCR24-knockdown SZ95 sebocytes. (C) Transmission
  electron microscopy (TEM) revealed mitochondrial swelling and altered cristae structure
  in meibomian glands (MGs) of Dhcr24-cKO mice compared to Dhcr24fl/fl controls. Scale
  bars: 10 μm. (D, E) Gene set enrichment analysis (GSEA) revealed significant enrichment
  of cGAS-STING signaling pathway in Dhcr24-cKO mice, with (E) differentially expressed
  genes (DEGs) shown by a heatmap. (F) Heatmap revealed significant enrichment of
  DEGs associated with cellular senescence. (G) Western blot (WB) and relative protein
  levels of (H) cGAS, (I) STING, and (J) p-STING in Dhcr24-cKO vs. Dhcr24fl/fl MGs.
  (K) Representative immunofluorescence (IF) images of STING in Dhcr24-cKO vs. Dhcr24fl/fl
  MGs. Scale bars: 50 μm. (L) Relative DHCR24 mRNA expression in SZ95 sebocytes treated
  with control siRNA (siNC) and siDHCR24. (M, N) qPCR measurement of (M) cytosolic
  mitochondrial DNA (mtDNA) normalized to total cellular nuclear DNA (nDNA) and (M)
  cytosolic mtDNA normalized to total cellular mtDNA in SZ95 sebocytes treated with
  siNC and siDHCR24. (O) IF for Tom20 and double-stranded DNA (dsDNA) in SZ95 sebocytes
  treated with siNC and siDHCR24. Scale bars: 10 μm. (P) WB for SZ95 sebocytes treated
  with siNC, siDHCR24, or siDHCR24 plus the STING inhibitor H-151, and relative protein
  levels were quantified, including (Q) DHCR24, (R) cGAS, (S) STING, (T) p-STING,
  and (U) phospho-NF-κB p65 and NF-κB p65. (V-Y) Relative mRNA expression of (V) IFNB1,
  (W) TNF-α, (X) CXCL10, and (Y) CCL5 in SZ95 sebocytes treated with siNC, siDHCR24,
  or siDHCR24 plus H-151'
