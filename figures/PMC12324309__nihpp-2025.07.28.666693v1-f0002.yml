figure_title: Shear stress effects on endothelial cell transcription
caption: (a) Differentially expressed genes across shear conditions (n = 18, combining
  diseased and control subjects). (b) Heatmaps of log2-fold change showing expected
  trend in select genes previously implicated in endothelial shear responses. (c)
  Gene set enrichment analysis - selected significant pathways shown, quantified by
  normalized enrichment score (NES). (d) Network of enriched gene sets in high shear
  (red) vs static (blue), clustered by theme. Node size reflects NES and line thickness
  indicates the number of overlapping genes. (e) Short Time-series Expression Miner
  (STEM) analysis identified six significant gene expression profiles. Each graph
  represents one expression profile, with individual lines corresponding to single
  genes within that profile. Profiles were functionally annotated using Gene Ontology
  Biological Process (GO), Kyoto Encyclopedia of Genes and Genomes (K), Reactome (R),
  and WikiPathways (WP). Selected pathway annotations are shown to the right, with
  names abbreviated for space where appropriate. Adjusted P < 0.05 used throughout
