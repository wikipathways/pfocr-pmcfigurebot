figure_title: RICTOR is required for Liprin-α1-mediated regulation of AKT phosphorylation
caption: (A) Scatterplots showing the correlation between PPFIA1, which encodes Liprin-α1,
  and RICTOR, as well as the correlation between PPFIA1 and RICTOR-AKT pathway genes
  (VEGF, GLUT1, SREBP1, and CCND1), based on Pearson correlation analysis using GEPIA2.(B)
  WB analysis of protein lysates from RKO and HCT116 cells transfected with either
  control siRNA or Liprin-α1 siRNA, using the specified antibodies.(C) HCT116 cells
  were transfected with either RICTOR siRNA or control siRNA for 24 h, followed by
  transfection with either FLAG-control vector or FLAG-Liprin-α1 for an additional
  48 h. WB analysis was then performed using the specified antibodies.(D) Schematic
  representation of signaling axis involving Liprin-α1, PHLDB3, and mTORC2 (RICTOR)
  that is critical for AKT phosphorylation at Ser473 in CRC cells
article_title: Liprin-α1 enhances PHLDB3 oncogenic function in colorectal cancer via
  activation of mTORC2-AKT1 pathway
