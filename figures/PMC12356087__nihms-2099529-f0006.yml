figure_title: Transcriptomic analysis of BLIMP1 KO and WT GCBC
caption: (A) Heatmap showing unbiased hierarchical clustering of differentially expressed
  genes (false discovery rate [FDR] of <0.05, log2 fold-change = 1) in BLIMP1 KO compared
  with WT samples (three replicates).(B) Volcano plot showing top differentially expressed
  genes in BLIMP1 KO compared with WT GCBC. The x axis shows the log2 fold-change
  and the y axis shows −log10 of the FDR. Each dot is a gene. Blue dots highlight
  significantly differentially expressed genes (FDR < 0.05). Square shape represents
  TFs and triangles are genes encoding surface proteins.(C and D) Bubble plots show
  the top 20 (C) TF motifs and (D) pathways enriched among upregulated (magenta) and
  downregulated (blue) genes from cluster 8 (BLIMP1hi GCBCs) from our previously published
  scRNA-seq.11 The x axis shows the −log10 FDR for the enriched terms displayed on
  y axis. Bubble size reflects the number genes in the pathway that are differential
  in cluster 8 versus the other clusters (from Luo et al.11)
