figure_title: AhR regulation of ECM production in airway
caption: AhR activation suppresses airway fibrosis by modulating profibrotic TGF-β
  signaling pathways. TGF-β activates its receptor (TGFβR), leading to the phosphorylation
  and nuclear translocation of SMAD2/3, which promotes transcription of ECM components
  including collagen I/III, fibronectin, elastase, and plasmin. Activated AhR inhibits
  SMAD2/3 activity, thereby reducing ECM synthesis. Concurrently, AhR may enhance
  MEK/ERK pathway activation, which promotes MMP1 transcription via NF-κB and AP-1,
  contributing to ECM degradation. This dual mechanism highlights AhR’s antifibrotic
  role by simultaneously downregulating ECM production and upregulating matrix degradation
