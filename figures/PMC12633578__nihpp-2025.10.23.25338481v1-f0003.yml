figure_title: Distribution of 14 selected integrase mutations across INSTI resistance
  pathways
caption: Fisher’s exact test was performed for each identified mutation across four
  major INSTI resistance pathways (G118R, Q148X, N155H, R263K) in sequences with DTG
  resistance. Q148X refers to Q148HKR pathways. Sequences with each mutually exclusive
  pathway were included (n = 86), while those with more than two mixed pathways were
  excluded. Mutation status is categorized as absent (red) and present (blue), and
  the size of each rectangle is proportional to the number of sequences in each category.
  The number of sequences in each rectangle is shown, except when it is 0. Panel titles
  display the mutation name and the p-value from Fisher’s exact test, indicating whether
  the distribution differs significantly among pathways. INSTI = integrase strand
  transfer inhibitor. DTG = dolutegravir
article_title: 'Novel integrase mutations linked to genotypic DTG resistance in non-B
