figure_title: Introduction of a pyrimidine salvage enzyme in P. falciparum demonstrates
  that PfDHO is essential for blood-stage growth
caption: (A) The yeast enzyme FUR1 (uracil phosphoribosyltransferase) transfers a
  phosphoribosyl group from 5-phosphoribosyl-α−1-pyrophosphate (PRPP) to uracil to
  yield uridine 5’-monophosphate (UMP), the same product generated by the pyrimidine
  biosynthetic pathway. (B) Live fluorescence microscopy confirmed the expression
  of the mCherry-tagged FUR1 (mCh-FUR1) protein in PfMevFUR1 parasites. Images represent
  fields that are 10 μm long by 10 μm wide. (C) Growth of PfMevFUR1 parasites in the
  presence or the absence of uracil and DSM1 was measured by flow cytometry for 8
  days. Growth inhibition from DSM1 treatment was averted when PfMevFUR1 parasites
  were supplemented with uracil. (D) Growth measurements of the ΔPfDHO line across
  an 8-day period showed that the parasites relied on uracil salvage for survival.
  Removal of uracil from the culture medium led to rapid parasite death. Growth curves
  in (C) and (D) were generated from two biological experiments conducted in quadruplicate.
  Data were plotted on a logarithmic Y-axis. Error bars represent standard deviations
  from the mean. Statistical analysis was conducted using GraphPad Prism 10 (GraphPad
  Software, Inc). Two-way ANOVA was followed by Bonferroni’s correction (**, P ≤ 0.01;
  ***, P ≤ 0.001; ****, P ≤ 0.0001). Asterisks in (C) depict significant differences
  between +DSM1 - Uracil and +DSM1 +Uracil conditions
