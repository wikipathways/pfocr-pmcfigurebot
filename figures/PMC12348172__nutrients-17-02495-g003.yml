figure_title: The methyl groups of choline and betaine are highly conserved and used
  to replenish the methyl reservoir.
caption: The methyl groups of choline and betaine are highly conserved and used to
  replenish the methyl reservoir. The methyl groups of choline are marked with different
  colors. Each choline molecule that is oxidized to betaine can theoretically convert
  three homocysteine molecules to form three S-adenosylmethionine (SAM) molecules;
  one SAM is formed directly from betaine via the BHMT pathway, while the other two
  SAMs are synthesized through the formation of 5-methyl-THF (one from dimethylglycine
  and the other from sarcosine). The two 5-methyl-THF molecules then augment SAM via
  the methionine synthase pathway. This could explain why betaine supplementation
  causes a rise in plasma folate in a methyl-deficient animal model [78]
article_title: The Shuttling of Methyl Groups Between Folate and Choline Pathways
