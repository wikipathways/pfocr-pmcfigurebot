figure_title: The PI3K/Akt pathway plays a crucial role in PLK4-mediated differentiation.
caption: 'The PI3K/Akt pathway plays a crucial role in PLK4-mediated differentiation.
  A. Results of a pathway analysis obtained from RNA sequencing (RNA-seq) in the PLK4-knockdown
  group (|Log2 fold change| > 1 and adjusted p value < 0.05). B. Western blotting
  analysis demonstrating the effect on different signaling pathway activation following
  PLK4-knockdown in SK-N-SH and SK-N-AS. C. Protein expression levels of various signaling
  pathways were quantified. Data represent mean ± SEM from 3-4 independent experiments.
  D. PLK4-overexpression NB cells were pretreated with LY294002. Western blotting
  analysis of the protein levels of p-Akt308, Akt, and differentiation-associated
  protein. E. Quantification of above protein expression in 3D. The mRNA (F) and protein
  (G) levels of PLK4, differentiation protein and Akt signaling pathway components
  assessed in murine tumor tissues by RT-PCR and Western blotting. H. IHC analysis
  of PLK4 and differentiation protein expressions in two groups. (KD1: PLK4-knockdown1,
  KD2: PLK4-knockdown2, OE: PLK4 overexpression). *p < 0.05, **p < 0.01, ***p < 0.001,
  ****p < 0.0001, ns: no significance'
