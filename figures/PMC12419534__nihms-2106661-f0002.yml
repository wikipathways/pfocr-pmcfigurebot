figure_title: Pleotropic effects of estrogen-deficiency on vascular dysfunction
caption: Estrogen modulates endothelium-dependent dilation specifically through the
  interaction of 17-β-estradiol (E2) binding to ERα, ERβ, and GPER-1 to activate the
  tyrosine kinase Src, ERK1/2, and via the PI3K-Akt signaling pathway leading to eNOS
  phosphorylation and subsequent release of NO. E2 also regulates endothelial function
  through the prostacyclin (PGI2) and EDH-related signaling pathways. Binding of E2
  to ERα stimulates PGI2 production and cyclooxygenase signaling whereas EDH is a
  process that compensates for NO loss under pathological conditions but is less prevalent
  in postmenopausal women. Decreases in E2 also lead to increases in reactive oxygen
  species production, decreased antioxidant defense mechanisms and decreases in NO
  bioavailability, ultimately leading to oxidative stress, inflammation, and vascular
  dysfunction marked by endothelial dysfunction and large elastic artery stiffening.
  AKT, protein kinase B; eNOS, endothelial nitric oxide synthase; EDH, endothelium-derived
  hyperpolarization; ERα, estrogen receptor 1 alpha; ERβ, estrogen receptor 1 beta;
  ERK, extracellular signal-regulated kinase; GPER-1, G-protein-coupled estrogen receptor
  1; MnSOD, manganese superoxide dismutase; NO, nitric oxide; O2−, superoxide; PI3K,
  phosphoinositide 3-kinase; PGI2, prostacyclin. Created in BioRender
