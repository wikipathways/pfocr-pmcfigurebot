figure_title: Epicutaneous sensitization pathway.
caption: Epicutaneous sensitization pathway. Food allergens penetrate the skin barrier
  and are taken up by dendritic cells, which, under the influence of IL-25, IL-33,
  and TSLP, promote Th2 polarization and the secretion of IL-4, IL-5, and IL-13. These
  cytokines drive B cell class switching to allergen-specific IgE, which binds to
  FcεRI on mast cells and basophils, priming them for activation upon re-exposure
  to the allergen. Created in BioRender. Dumycz, K. (2025) https://BioRender.com/tan3wmm
