figure_title: The delta variant N protein is highly pro-inflammatory regardless of
  stimulation
caption: (A-B). The transcription factor predictions of N-mediated gene upregulations
  in TLR7/8 and TLR3 pathways. The 69 N-upregulated genes (Fig. 2B left, genes with
  delLog2 FC >1) after TLR7/8 stimulation and 140 N-upregulated genes (Fig. 2B middle,
  genes with delLog2 FC >1) after TLR3 stimulation are analyzed for responsible transcription
  factors through TRRUST, a manually curated database of human and mouse transcriptional
  regulatory networks. The top 10 predicted transcription factors based of enrichment
  significance (FDR) are listed. The gradient colors correspond to combined enrichment
  scores. The size of the dots corresponds to the overlap ratio of the N-upregulated
  genes in transcription factor-target genes in the database. The line segments exceeding
  -log10(FDR) cutoff (red line, FDR=0.05) shows significant enrichments.(C). The Mutation
  sites of delta and omicron variants in corresponding N domains. The domains of N
  protein can be divided into intrinsically disordered regions (IDRs) and conserved
  structural regions. The conserved structural regions consist of N terminal domain
  (NTD) and C terminal domain (CTD). The NTD and CTD are connected by an IDR, named
  linker region (LKR), and flanked by the other two IDRs, named N-arm and C-tail.
  The delta variant has D63G mutation in its NTD, R203M mutation in its LKR and D377Y
  mutation in its C-tail. The omicron variant has P13L and a three amino acid deletion
  (aa31-aa33) in its N-arm, R203K and G204L in its LKR.(D). The phosphorylation of
  NF-kB modulated by different coronavirus N proteins after PRR stimulations. The
  dox-inducible THP-1 derived macrophage cell lines that express different N proteins
  were treated with dox (2 mg/ml) for 48 hours to stimulate the N protein expressions
  of SARS-CoV-2 Wuhan strain, SARS-CoV2 delta variant, SARS-CoV-2 omicron variant,
  SARS-CoV-1, MERS. The parental THP-1 macrophages were also treated with dox(2 mg/ml)
  for 48 hours to serve as a control. The cells were sequentially stimulated with
  different PRR agonists, including CL097 incubation for TLR7/8 activation, poly (I:C)
  incubation for TLR3 stimulation, poly (I:C) transfection for RIG-I/MDA5 stimulation,
  for 4 hours. The cell lysates were then collected to detect the phosphorylation
  at Ser 536 in NF-kB p65 subunit by western blot
