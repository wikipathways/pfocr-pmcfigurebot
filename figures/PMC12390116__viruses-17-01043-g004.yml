figure_title: GO and KEGG pathway analysis of the putative effectors involved in NDV
  oncolysis.
caption: GO and KEGG pathway analysis of the putative effectors involved in NDV oncolysis.
  (A) Hierarchical clustering analysis of the genes differentially expressed between
  NDV-treated cells and control cells at p < 0.05, |log2 fold change| > 1.0. Columns
  indicate samples and rows indicate genes. Blue indicates repression and red indicates
  promotion. (B,C) GO analysis was applied to (B) 1402 upregulated genes and (C) 593
  downregulated genes, and functional annotation was performed from the biological
  process, cellular component, and molecular function. The items were ranked in ascending
  order of p-value, and the top ten from each group were presented. (D,E) KEGG pathway
  analysis was applied to (D) 1402 upregulated genes and (E) 593 downregulated genes.
  The items were ranked in ascending order of p-value, and the top ten from each group
  were presented
