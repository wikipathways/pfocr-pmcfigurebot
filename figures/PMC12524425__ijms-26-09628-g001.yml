figure_title: Complement activation pathways and the mechanism of action of vilobelimab.
caption: Complement activation pathways and the mechanism of action of vilobelimab.
  Classical, lectin, and alternative complement activation pathways converge on the
  generation of active complement split products and the MAC. In this pathway, C5
  convertases bind via the MG7 domain of C5, cleaving C5 into its components, C5a
  and C5b. The extrinsic pathway represents an additional route of complement activation.
  In this pathway, proteolytic enzymes such as thrombin or plasmin bind to and cleave
  C5 at or near its scissile bond, to generate C5a. Overactivation of C5a amplifies
  the innate immune response, contributing to cytokine storm, tissue damage, and multi-organ
  dysfunction. Vilobelimab blocks C5a generated through both the extrinsic pathway
  as well as conventional complement pathways, interrupting this inflammatory cascade,
  while also allowing C5b to be generated as part of MAC formation. By interrupting
  the inflammatory cascade (X), vilobelimab presumably decreases coagulation, NET
  formation, ROS generation, granular enzymes release, vascular injury, the cytokine
  storm, and tissue injury. MAC graphic adapted from Serna et al. [29] licensed by
  CC BY 4.0. MAC, membrane attack complex; NETs, neutrophil extracellular traps; ROS,
  reactive oxygen species
