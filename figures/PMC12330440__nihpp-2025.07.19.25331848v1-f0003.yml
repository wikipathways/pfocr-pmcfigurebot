figure_title: TME changes by spatial transcriptomics upon Ivosidenib plus nivolumab
caption: (A) Clusters by UMAP showing distinct cellular neighborhoods with biological
  interpretation. (B) Representative examples of pathology tumor/stroma annotation
  and spatial clusters from pre- and on-treatment samples. (C) Immune-related pathway
  enrichment in each spatial cluster (FDR-adjusted P<0.01). Clusters without significant
  pathways are not shown. (D) Gene expression heatmap of two immune pathways from
  C, showing that in tumor core (C04), on-treatment sample has significantly higher
  pathway gene expression compared to pre-treatment sample (FDR-adjusted P<0.01).
  Two-sided hypergeometric test was used in C, two-sided Wilcoxon rank-sum test was
  used in D. BH-FDR adjustment of p-values was used in multiple comparisons
