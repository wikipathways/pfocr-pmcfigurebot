figure_title: Nucleocapsid enhances TLR-driven inflammation and suppresses RLR-mediated
  antiviral signaling
caption: '(A). The Venn diagrams of differentially expressed genes (DEGs) in parental
  macrophages and N-expressing macrophages after PRR stimulations. The gene expression
  fold changes induced by TLR7/8, TLR3, RIG-I/MDA5 stimulation are compared in either
  parental macrophages or N-expressing macrophages. The genes are considered as DEGs
  with a filtration of FDR <0.05, regardless of values of Log2 Fold Changes (PRR-stimulated
  macrophages vs untreated macrophages). Overall, the DEGs are classified into 3 categories:
  1) DEGs unique to N-expressing macrophages, 2) DEGs unique to parental macrophages,
  or 3) DEGs shared by N-expressing and parental macrophages. CL097 incubation (TLR7/8
  stimulation) induced significant expression changes of 1974 genes in both N-expressing
  macrophages and parental macrophages, and 1422 genes only in N-expressing macrophages.
  Poly(I:C) incubation (TLR3 stimulation) induced significant expression changes of
  1583 genes in both N-expressing macrophages and parental macrophages, and 2827 genes
  only in N-expressing macrophages. Poly(I:C) transfection (RIG-I/MDA5 stimulation)
  induced significant expression changes of 3691 genes in both N-expressing macrophages
  and parental macrophages, and 1979 genes only in N-expressing macrophages.(B). The
  histograms of N-induced gene expression changes. The histograms from left to right
  show N influence on induction changes of DEGs in TLR7/8, TLR3 or RIG-I/MDA5 stimulation
  by evaluating the delLog2Fold Change distribution in each condition. To obtain delLog2FC,
  the N log2 Fold Change of DEGs (PRR-stimulated N-expressing macrophages vs unstimulated
  N-expressing macrophages) is compared to the WT log2 Fold Change of DEGs (PRR-stimulated
  parental macrophages vs unstimulated parental macrophages).(C). The biological process
  (BP) analysis of N-induced DEGs in TLR7/8, TLR3 and RIG-I/MDA5 stimulations. Left:
  Top 10 enriched gene ontology terms of 69 N-upregulated DEGs (delLog2FC>1) in macrophages
  after TLR7/8 stimulation. Middle: Top 10 enriched gene ontology terms of 140 N-upregulated
  DEGs (delLog2FC>1) in macrophages after TLR3 stimulation. Right: Top 10 enriched
  gene ontology terms of 144 N-downregulated DEGs (delLog2FC<1) in macrophages after
  RIG-I/MDA5 stimulation. The bars exceeding -log10(FDR) cutoff (red line, FDR=0.05)
  shows significant enrichments. (D-F). Fold change bar graphs of representative DEGs
  dramatically regulated by N in PRR-stimulated macrophages. Log2 fold changes of
  DEGs exhibiting enhanced expression in both parental and N-expressing macrophages
  to different extents, and those selectively upregulated in N-expressing macrophages
  after TLR7/8 stimulation (D), TLR3 stimulation (E) or RIG-I/MDA5 stimulation (F).(G).
  Heatmap of DEGs associated with the innate immune response, showing N-induced expression
  changes across all PRR stimulation conditions. The DEGs in parental macrophages
  and N-expressing macrophages in all PRR-stimulated conditions are selected and filtered
  with innate immune response-related BP and KEGG pathway terms (GO:0140374, GO:0051607,
  GO:0009615, GO:0032728, GO:0070106, GO:0006954, GO:0045071, GO:0050729, GO:0045087,
  GO:0060337, GO:0032760, GO:0050728). The innate immune response-related DEGs are
  then plotted into heatmap colored with delLog2 Fold Changes of different PRR stimulation.
  The delLog2 Fold Changes are calculated as described in Figure 2B which are the
  comparison of N log2 Fold Change of DEGs to WT log2 Fold Change of DEGs under the
  same PRR stimulation condition. Red: DEGs upregulated by N after PRR stimulation.
  Blue: DEGs downregulated by N after PRR stimulation'
