figure_title: Routes of administration, lesion-associated PK barriers, and delivery
  strategies for next-generation anti-TB therapies.
caption: Routes of administration, lesion-associated PK barriers, and delivery strategies
  for next-generation anti-TB therapies. Next-generation agents, including BTZ043
  (DprE1 inhibition), SQ109 (MmpL3 inhibition), bedaquiline (ATP synthase inhibition),
  and pretomanid (nitroimidazole prodrug), target essential pathways in M. tuberculosis.
  Following administration, drug distribution is strongly influenced by pulmonary
  lesion architecture. Granulomas commonly contain caseous necrosis, lipid-rich regions,
  hypoxia, and low pH, all of which limit drug penetration and reduce exposure at
  intracellular and intralesional bacterial sites. The schematic illustrates how delivery
  approaches such as nanocarriers, inhalable formulations, and long-acting injectables
  are designed to overcome these PK barriers by improving lung targeting, macrophage
  uptake, and sustained local drug release. These strategies aim to enhance therapeutic
  efficacy while reducing systemic toxicity and supporting shorter, safer, and more
  accessible treatment regimens
article_title: Advancing Tuberculosis Treatment with Next-Generation Drugs and Smart
