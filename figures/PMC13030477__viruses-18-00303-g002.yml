figure_title: IR treatment shows low induction of antiviral response in lung carcinoma
  epithelial cell line A549 at 48 h.
caption: IR treatment shows low induction of antiviral response in lung carcinoma
  epithelial cell line A549 at 48 h. (a) Schematic illustration of RV1B infection
  in the viral recognition capability and antiviral response of airway epithelial
  cells. (b) Effects of viral sensing capability in untreated and IR-irradiated RV-infected
  A549 epithelial cells measured within 48 h. Data represents six independent repeats
  per group, representative of two independent experiments. (c) Effects of viral recognition
  in untreated and IR-irradiated RV-infected A549 epithelial cells measured within
  72 h. (d) Effects of antiviral response in untreated and IR-irradiated RV-infected
  A549 epithelial cells measured within 48 h. Data represents six independent repeats
  per group, representative of two independent experiments. (e) Effects of antiviral
  response in untreated and IR-irradiated RV-infected A549 epithelial cells measured
  within 72 h. (f) Schematic illustration of the inhibitory effect of SOCS1 in JAK/STAT
  pathway in airway epithelial cells after RV1B infection. (g) SOCS1 expression in
  untreated and IR-irradiated RV-infected A549 epithelial cells measured within 48
  h. Data represents six independent repeats per group, representative of three independent
  experiments. (h) SOCS1 expression in untreated and IR-irradiated RV-infected A549
  epithelial cells measured within 72 h. The mRNA levels of each condition were determined
  using real-time polymerase chain reaction. Each circular dot represents one independent
  sample per experiment and the number of dots per group corresponds to the sample
  size. (a,f) Created in BioRender.com
