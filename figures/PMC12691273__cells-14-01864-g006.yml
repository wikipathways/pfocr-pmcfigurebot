figure_title: Crosstalk of PI3K/Akt and P62/Keap1/Nrf2 pathways in regulating GC proliferation
  and apoptosis mediated by FOXO1.
caption: 'Crosstalk of PI3K/Akt and P62/Keap1/Nrf2 pathways in regulating GC proliferation
  and apoptosis mediated by FOXO1. (a) Expression levels of P62 mRNA under FOXO1 overexpression
  or/and P62 knockdown examined by RT-qPCR assay. NC: negative control, OE: overexpression,
  SR: siRNA. The mRNA expression was normalized to that of the 18S rRNA gene; the
  values of the bar graphs represent the mean  ±  SEM of 3 hens (n  = 3) from a representative
  experiment. (b) The expression levels of Keap1 mRNA under the same condition as
  (a). (c) The expression levels of Nrf2 mRNA under the same conditions as (a). (d)
  The expression levels of p62 mRNA under 740-Y-P or/and LMB treatment by RT-qPCR
  assay. (e) The expression levels of BCL2 mRNA under 740-Y-P treatment or/and P62
  knockdown by RT-qPCR. (f–h) The expression level results of CASP3, CCND1, and PCNA
  mRNA under the same conditions as (e). (i–m). GC proliferation and apoptosis under
  treatment with FSH or/and P62 knockdown by flow cytometry assay. All data are presented
  as the means ± SEM. n = 3. For each group, the superscript symbol above the bar
  indicates that the difference was significant compared to the control group, **
  p  <  0.01, * p  <  0.05'
