figure_title: NAM and NR treatments increase the AMPK signaling pathway.
caption: 'NAM and NR treatments increase the AMPK signaling pathway. Primary rat cardiac
  myocytes were exposed for 7 days to control condition (BSA), NAM, FA, or FA + NR.
  Cardiomyocytes were then stimulated for 10 min with 1 μM insulin (blue bars), for
  20 min with 1 μM oligomycin (red bars), or left unstimulated (black bars). Relative
  phosphorylation of (a) T172 AMPK, (c) S792 raptor, and (e) AS160 on S/T residues.
  Results are mean ± SD. *: significant (q < 0.05) effect of insulin/metabolic stress;
  △: significant effect of NR; §: effect of NAM. (b,d,f) representative Western blots'
