figure_title: Structural organization of mammalian VGICs (NaV, Kv, and CaV).
caption: Structural organization of mammalian VGICs (NaV, Kv, and CaV). VGICs adopt
  a conserved modular scaffold consisting of six transmembrane helices (S1–S6) subdivided
  into the voltage-sensing domain (VSD; S1–S4), anchored by the positively charged
  S4 helix, and the pore domain (PD; S5–S6 + P-loop), which hosts the ion-selective
  filter and permeation pathway. Depolarization-induced motions within the VSD are
  transmitted allosterically to the PD to open the channel. This shared framework
  underpins NaV, Kv, and CaV channels alike, whereas subtype-specific architectural
  features fundamentally shape their physiological functions and pharmacological modulation.
  (A) NaV channels—The α-subunit consists of a single polypeptide containing four
  homologous domains (DI–DIV), each organized as a VSD–PD module. Inactivation occurs
  via the intracellular linker between domains III and IV, and auxiliary β subunits
  (β1/β2) modulate trafficking and gating. (Model based on human NaV1.7; PDB 7W9L.)
  (B) Kv channels—A functional pore is formed by the tetrameric assembly of four individual
  α-subunits, each contributing one VSD–PD module. The cytoplasmic N-terminal tetramerization
  domain organizes subunit assembly, allowing homo- or heterotetramer formation and
  extensive functional diversity. (Model based on human Kv3.1; PDB 7PQT). (C) CaV
  channels—A single α1 subunit contains four homologous VSD–PD modules, similar to
  NaV channels, but requires three auxiliary subunits (β, α2δ, γ) that fine-tune gating,
  trafficking, and membrane localization. The selectivity filter in the PD coordinates
  Ca2+ to ensure CaV-specific ion permeation. (Model based on human CaV2.3; PDB 7XLQ)
