figure_title: Bulk RNA sequencing of cholangiocytes identifies the differentially
  expressed genes during injury and recovery
caption: Volcano plots were generated to compare the differentially expressed genes
  between (A) DDC vs control, (B) DDC vs R15, and (C) R15 vs control. Upregulated
  genes are displayed on the right and downregulated genes are shown on the left of
  each volcano plot. IPA analysis was performed for each of these comparisons and
  the top twenty regulated pathways are shown. D) The number of upregulated genes
  that were differentially expressed in the Pathogen Induced Cytokine Storm Signaling
  (PICSS) pathway in DDC and R15 cholangiocytes as compared to control is presented.
  E) The top ten upregulated differentially expressed genes in the PICSS pathway in
  the DDC mice versus control cholangiocytes are listed
