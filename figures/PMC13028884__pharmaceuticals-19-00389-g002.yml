figure_title: The riboflavin biosynthetic pathway (RFBP, yellow box) and interconnected
  metabolic pathways in microorganisms.
caption: The riboflavin biosynthetic pathway (RFBP, yellow box) and interconnected
  metabolic pathways in microorganisms. Glycolysis (green box); non-oxidative pentose
  phosphate pathway (NOPPP, red box); oxidative pentose phosphate pathway (OPPP, blue
  box); tricarboxylic acid (TCA) cycle (pink circle); purine network, including biosynthesis,
  salvage, degradation, and interconversion pathways (gray box); biosynthesis of amino
  acids required for the PBP (white box). The dashed white boxes represent the pyrimidine
  network and folate biosynthesis pathways, which are metabolically competitive with
  RF biosynthesis because they share key cofactors and intermediates. G6P, glucose-6-phosphate;
  F6P, fructose-6-phosphate; F1,6-P, fructose-1,6-biphosphate; G3P, glyceraldehyde-3-phosphate;
  Pyr, pyruvate; AcCoA, acetyl-CoA; OAA, oxalacetate; AKG, α-ketoglutarate; TCA cycle,
  tricarboxylic acid cycle; 6PGL, 6-phosphogluconolactone; 6PG, 6-phosphogluconate;
  Ru5P, ribulose-5-phosphate; R5P, ribose-5-phosphate; X5P, xylulose-5-phosphate;
  E4P, erythrose-4-phosphate; S7P, sedoheptulose-7-phosphate; PRPP, phosphoribosyl
  pyrophosphate; Gly, glycine; L-Gln, L-glutamine; L-Asp, L-aspartate; AMP, adenosine
  monophosphate; IMP, inosine monophosphate; XMP, xanthosine monophosphate; GMP, guanosine
  monophosphate; ATP, adenosine triphosphate; GTP, guanosine triphosphate; DHBP, 3,4-dihydroxy-2-butanone-4-phosphate;
  NH3, ammonia; L-Ser, L-serine; L-Thr, L-threonine; L-Glu, L-glutamate. Dotted arrows
  represent abbreviated reactions; solid arrows denote direct reactions. Green arrows
  denote purine interconversion reactions, red arrows indicate purine salvage reactions,
  and blue arrows represent purine nucleotide and nucleoside degradation reactions.
  The figure was constructed based on information from references [70,105,126,127,128,129]
