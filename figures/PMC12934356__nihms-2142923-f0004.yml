figure_title: Thyroid-klf9-atp1a1a.4 pathway regulates D. cerebrum schooling
caption: '(A and B) Whole-mount HCR-FISH experiments revealed the spatial mRNA expression
  of klf9 (magenta) and atp1a1a.4 (green) in two-week-old (A) and adult (B) D. cerebrum
  (dorsal view). Scale bars, 50 μm. A zoomed-in (yellow dashed boxes) view of the
  anterior parvocellular nucleus of the preoptic area shows cells co-expressing klf9
  and atp1a1a.4 (white, right panels in B). FB, forebrain; MB, midbrain; and HB, hindbrain.(C
  and D) Relative mRNA expression levels of klf9 and atp1a1a.4 in 6 dpf pTol2-hsp70:klf9+TP
  mRNA-injected (N = 6) and TP mRNA-injected larvae (N = 6), following heat shock.(E
  and F) Relative mRNA expression levels of klf9 and atp1a1a.4 in NaOH- (N = 6) and
  T3-treated (N = 6) WT 6 dpf larvae.(G–J) Thyroid hormone administration (T3 [50
  nM, 100 nM] or vehicle control [5 × 10−6 M NaOH]) reduces schooling behavior.(H)
  Mean speed. Individual data points are the means of the four fish in the group.(I)
  Mean group area, comparing groups of four fish (Pre-T3: 315.7 ± 41.2 mm2; Post-T3:
  1063.64 ± 141.4 mm2, t = −11.3, p = 9 × 10−5).(J) Mean of pairwise heading direction
  correlation coefficients among all fish, comparing between groups of four fish (Pre-T3:
  r = 0.32 ± 0.07; Post-T3: r = 0.008 ± 0.019, t = 9.2, p = 0.0002).(K–N) atp1a1a.4
  crispants exhibit reduced schooling behavior compared to Cas9-only injected fish
  (control).(L) Mean speed, individual data points are means of the four fish in the
  group (control: 52.5 ± 5.7 mm/s, atp1a1a.4: 58.23 ± 5.1 mm/s, t = −2.2, p value
  = 0.046).(M) Mean group area, comparing groups of four fish (control: 129.0 ± 8.9
  mm2, atp1a1a.4: 294.6 ± 86.5 mm2, t = −4.6, p value = 0.0005).(N) Mean of pairwise
  heading direction correlation coefficients among all fish, comparing between groups
  of four fish (control: r = 0.39 ± 0.14, atp1a1a.4: r = 0.2 ± 0.07, t = 2.9, p value
  = 0.013). N = 6 for (C–F), 6 T3-and 5 NaOH-treated fish in (H–J), and 7 for both
  groups in (L–N). *p < 0.05 and **p < 0.001, determined by unpaired two-sample t
  test (C–F, L, and N) or paired t test (H–J). Boxplots (C–F) or Mean ± SEM (H–J and
  L–N) with individual points are shown'
