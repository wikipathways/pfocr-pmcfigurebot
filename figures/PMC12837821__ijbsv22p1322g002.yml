figure_title: The Th2-Mediated Allergic Cascade in Allergic Rhinitis.
caption: The Th2-Mediated Allergic Cascade in Allergic Rhinitis. This diagram shows
  the classic allergic cascade initiated by allergens like pollen. A dendritic cell
  (DC) presents the allergen to a T cell (TC), inducing its differentiation into a
  Th2 cell. The Th2 cell then orchestrates two main pathways. First, it releases IL-4
  and IL-13, which cause B cells (BC) to become plasma cells (PC) that produce IgE.
  IgE sensitizes mast cells (MC), and subsequent allergen exposure triggers their
  degranulation, releasing histamine and causing symptoms like rhinorrhea. Second,
  the Th2 cell secretes IL-5, which activates eosinophils (EOS). These eosinophils
  infiltrate nasal tissue and release toxic granules, leading to tissue damage
