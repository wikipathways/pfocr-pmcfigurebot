figure_title: Paralogous protein kinases have distinct roles in metabolism
caption: '(A) Venn diagrams for differentially regulated metabolites (DRMs) in cells
  expressing Tpk1, Tpk2 or Tpk3 alone. Percentages: number of grouped DRMs / total
  DRMs × 100%. TPK1: Tpk1 only; TPK2: Tpk2 only; TPK3: Tpk3 only. High glucose: SC
  medium with 2% glucose; Low glucose: SC medium with 0.05% glucose. (B) and (C) Pathway
  analysis of enriched DRMs for TPK1 and TPK3 in high glucose condition. Left: scatter
  plots showing pathway impact calculated using MetaboAnalyst’s pathway topology analysis,
  which employs relative-betweenness centrality to assess the importance of matched
  DRM in each pathway. −log10p: adjusted p-values (false discovery rate calculated
  by Benjamini-Hochberg method) transformed by negative log10 for each pathway. Right:
  tables listing metabolites for significantly enriched pathways. FC: fold change
  calculated by comparing medians of all three TPKs and wildtype in six biological
  replicates (negative value means the abundance of DRM in wildtype is higher than
  that in TPKs)'
