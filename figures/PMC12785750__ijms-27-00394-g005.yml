figure_title: MFAP5 promotes ERK signaling by regulating ITGA5 expression.
caption: 'MFAP5 promotes ERK signaling by regulating ITGA5 expression. (A) Volcano
  plot showing the comparison of differentially expressed genes between control and
  shMFAP5 hDPSCs, with MFAP5 highlighted. (B) Heatmap of differentially expressed
  genes between control and knockout groups. (C) Sankey diagram of the top 10 enriched
  GO biological processes (BP) among DEGs. (D) MFAP5 knockdown decreases ITGA5 protein
  abundance, revealed by Western blot. (E) MFAP5 overexpression increases ITGA5 protein
  levels as shown by Western blot. (F) Co-IP assay indicating interaction between
  MFAP5 and ITGA5 proteins. (G) Circle chart of KEGG pathway enrichment analysis of
  DEGs. (H) Western blot showing that MFAP5 knockdown and overexpression modulate
  ERK phosphorylation. (I) Rescue of ERK phosphorylation by ITGA5 overexpression in
  shMFAP5 hDPSCs demonstrated by Western blot. Quantitative data are presented as
  mean ± SD (n = 3). Statistical significance is indicated as: * p < 0.1, ** p < 0.01'
