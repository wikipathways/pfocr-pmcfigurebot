caption: (A) Scatter plot comparing NPX difference of 196 common DEPs in BL compared
  to CTL (x-axis) and FU compared to CTL (y-axis). (B) Heatmap displaying the NPX
  difference between BL JDM and CTL and FU JDM and CTL for select DEPs at BL JDM of
  interest grouped by biological processes to highlight change in these proteins from
  BL to FU. Asterisks are used to indicate significance for the FU compared to CTL
  analysis. Of note, IL1B is not differentially expressed in BL JDM but was included
  to highlight the increase in NPX difference at 6 months. (C) Heatmap displaying
  NPX z-score expression of select proteins in 24 paired samples (and 8 CTL samples)
  grouped by biological pathways of interest. (D) Dot plot representing Metacore process
  networks enriched in the set of nonsignificant proteins in a paired analysis of
  n = 24 samples with BL and FU measurements, where dot size represents the protein
  ratio of DEP within each pathway and the colour of the dot represents significance
  as defined by the FDR (false discovery rate). BL, baseline; CTL, control; DEP, differentially
  expressed protein; FU, follow-up; IFN, interferon; IL, interleukin; JDM, juvenile
  dermatomyositis; NPX, normalised protein expression
article_title: Discovery of tissue-specific proteomic signatures in juvenile dermatomyositis
  highlights pathways reflecting persistent disease activity, clinical heterogeneity,
  and myositis-specific autoantibody subtype
