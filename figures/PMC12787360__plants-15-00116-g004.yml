figure_title: Structural prediction and molecular docking of NnUXS protein.
caption: 'Structural prediction and molecular docking of NnUXS protein. (A) Schematic
  diagram of the biosynthetic pathway for UDP-sugar donors. (B–F) Molecular docking
  analyses of key functional domains of NnUXS with its optimal substrate UDP-GlcA;
  each subplot is divided into two panels: the left panel displays the full-length
  protein–ligand complex structure, and the right panel provides an enlarged view
  of the binding interface, with yellow dashed lines indicating hydrogen bonds and
  negative binding energy (BE) values (annotated in dashed boxes) quantifying binding
  affinity (larger absolute values correspond to stronger molecular interactions).
  The right section of the figure shows predicted secondary and 3D structures of the
  five NnUXS proteins: the top row displays 3D structural models, and the bottom row
  shows secondary structure diagrams, where blue, purple, and brown represent α-helices,
  extended strands, and random coils, respectively, in the secondary structure diagrams,
  and in the 3D structure visualizations, blue indicates ≥ 70% structural confidence,
  yellow represents 60–70% confidence, and red signifies < 50% confidence'
