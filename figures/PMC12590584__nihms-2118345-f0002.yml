figure_title: 'Vitamin D: mechanisms of actions and downstream effects.'
caption: 'Vitamin D: mechanisms of actions and downstream effects. (a) Genomic pathway.
  As a fat-soluble molecule, 1,25-dihydroxyvitamin D, freely enters the cell and binds
  to the vitamin D receptor (VDR) in the cytoplasm. The 1,25(OH)2D-VDR complex then
  moves to the nucleus, where it forms a heterodimer with the retinoid X receptor
  (RXR). This VDR-RXR complex binds to vitamin D response elements (VDREs) within
  the promoter regions of target genes, recruiting coactivators like SARC1, SARC2,
  SARC3, and DRIP205. Depending on the target gene, the binding of the complex leads
  to either activation or repression of transcription. (b) Non-genomic pathway. Vitamin
  D also triggers rapid, non-genomic effects through membrane-bound VDR (mVDR). This
  interaction can activate various signaling pathways, such as the phosphoinositide
  3-kinase (PI3K)/Akt, the mitogen-activated protein kinase (MAPK), the protein kinase
  C (PKC) and the Wnt/β-catenin downstream pathways, leading to transcriptional induction
  of VDRE-independent target genes. Created with BioRender.com'
