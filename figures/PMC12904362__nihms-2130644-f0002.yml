figure_title: Targetable Lineage-Specific Signaling Vulnerabilities in Blood Cancers
caption: Two examples of lineage-restricted signaling pathway modulators in CLL and
  AML highlight how small-molecule inhibitors can selectively impair cell growth in
  a disease-specific context. In CLL, BTK functions as a prosurvival mediator upstream
  of ERK and the NF-κB pathway. Selective inhibition of BTK disrupts these downstream
  prosurvival signals, leading to targeted killing of CLL cells. In AML, PI3Kγ uniquely
  regulates AKT signaling in an isoform-specific manner. Inhibiting PI3Kγ with small-molecule
  inhibitors such as IPI-549 or PROTAC degraders like ARM-165 blocks AKT signaling,
  resulting in the selective elimination of AML cells
