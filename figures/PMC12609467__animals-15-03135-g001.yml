figure_title: Transcriptomic analysis of DEGs in skin from the black vs.
caption: 'Transcriptomic analysis of DEGs in skin from the black vs. white rex rabbits.
  Reference gene source: Oryctolagus_cuniculus; Reference genome version: OryCun2.0.
  The experimental group and the control group had three replicates each. (A) Expression
  distribution of transcriptome data across all six samples (n = 3 per group). The
  box plots illustrate the overall gene expression consistency within and between
  groups. (B) The number of upregulated (344) and downregulated (764) DEGs identified
  between black and white rex rabbit skin tissues in transcriptome data. (C) Volcano
  plot visualizing the distribution of DEGs. (D) GO analysis of DEGs across biological
  process, cellular component, and molecular function categories. The top 20 significantly
  enriched terms are shown. (E) KEGG analysis of DEGs. The top 20 significantly enriched
  pathways are displayed'
