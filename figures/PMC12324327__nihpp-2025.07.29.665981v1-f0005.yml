figure_title: MD and QM/MM analysis of DdGal1Pase
caption: Gal1P demonstrates closer interactions with active site residues and Mg2
  ions compared to G1P. The derived enzyme substrate (ES) complex of DdGal1Pase with
  substrates (A) Gal1P (grey) and (B) G1P (yellow). (C) The plausible reaction mechanism
  of DdGal1Pase, highlighting the essential role of water molecules in the phosphate
  hydrolysis reaction mechanism with two Mg2+ ions. The 1Mg2+ and 2Mg2+ ions and water
  molecules are numbered according to their involvement in catalysis. (D) The calculated
  energy profile for the phosphate hydrolysis of substrates Gal1P and G1P with their
  optimized structures of transition states (TS) and intermediates (INT1) along the
  reaction pathway. Non-polar hydrogen atoms have been omitted for clarity. The Gal1P
  (grey) and G1P (yellow) substrates are shown as ball and stick models, the Mg2+
  ions are shown as green spheres, and key active site residues are shown in light
  sea green. The atomic interactions are shown with black dotted lines with distances
  in Å. G1P = glucose-1-phosphate, Gal1P = galactose-1-phosphate
