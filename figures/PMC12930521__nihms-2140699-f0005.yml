figure_title: Effects of motor skill training and isometric resistance training on
  synaptic spinal excitability and spinal motor neuron excitability
caption: '(a) Peripheral nerve stimulation setup, response pathways, and representative
  responses. (1) Two 3.2 cm diameter surface electrodes were positioned on the popliteal
  fossa over the common peroneal nerve, with the anode placed 2 cm proximal to the
  cathode. (2) The M-wave arises from the direct activation of motor axons, leading
  to a short-latency response. The H-reflex follows stimulation of Ia afferent fibers,
  which synapse monosynaptically onto alpha motor neurons in the spinal cord, producing
  a long-latency, reflex-mediated response. The F-wave results from antidromic activation
  of alpha motor neurons, leading to depolarization of the soma and a recurrent orthodromic
  response via the same efferent motor pathway. (3) Representative H-reflex, M-wave,
  and F-wave responses are shown from participant MS018. The M-wave has been removed
  from the F-wave response for visualization purposes. (b) H-reflex and M-wave recruitment
  curves of participant MS018. (c-e, g, h) Group-level data are presented as mean
  values with error bars representing the standard deviation. (c) Percent change in
  H/M ratio. (d) Percent change in Mmax amplitude. A significant increase in Mmax
  was observed following isometric resistance training. (e) Percent change in Hmax.
  (f) Representative F-wave responses of participant MS014. (g) Percent change in
  F-wave persistence. (h) Percent change in F-wave amplitude. Asterisks above the
  group averages in (c-e) and (g, h) denote Bonferroni-corrected statistical significance
  from paired comparisons between training types: *p < 0.05, **p < 0.01. (Sig.) ‘X’
  markers below the plot indicate Bonferroni-corrected significant training effects
  within each condition of percent change based on one-sample tests against μ = 0
  (‘X’ p < 0.05, ‘XX’ p < 0.01, ‘n.s.’ p > 0.05)'
