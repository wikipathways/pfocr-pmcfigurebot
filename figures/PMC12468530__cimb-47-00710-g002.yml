figure_title: Proposed mechanisms of N-acetylcysteine action on redox regulation and
  glutamatergic signaling via Nrf2–ARE pathway activation.
caption: Proposed mechanisms of N-acetylcysteine action on redox regulation and glutamatergic
  signaling via Nrf2–ARE pathway activation. NAC enhances nuclear translocation of
  Nrf2 by disrupting Keap1-mediated degradation, either directly under oxidative stress
  or indirectly through increased mitochondrial hydrogen sulfide (H2S) production
  from 3-mercaptopyruvate metabolism. H2S modifies cysteine residues on Keap1, impairing
  its repressive function and releasing Nrf2. Once in the nucleus, Nrf2 activates
  antioxidant response element (ARE)-driven gene transcription, upregulating key antioxidant
  systems including GSH, GPx, NQO1, GSTs, Trx, and TrxR. This contributes to redox
  homeostasis and may also enhance NADPH production through the pentose phosphate
  pathway. NAC further promotes cystine uptake via xCT (System x−), facilitating both
  GSH biosynthesis and glutamate efflux. The extracellular glutamate stimulates presynaptic
  inhibitory mGlu2/3 receptors, reducing glutamate release and excitotoxicity. In
  parallel, NAC increases astrocytic GLT-1 expression, supporting glutamate clearance
  and maintaining synaptic stability
