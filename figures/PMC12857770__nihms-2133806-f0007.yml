figure_title: Schematic representation of how the loss of Scly leads to BAT whitening
  and mild impairment of adaptive thermogenesis
caption: Loss of Scly decreases selenoprotein synthesis of the ones participating
  in adaptive thermogenesis (DIO2, GPX1, and GP4), which directly contribute to lower
  active thyroid hormone input to synthesize UCP1 and redox regulation. Inhibition
  of the mevalonate pathway also contributes to BAT whitening. Dashed lines indicate
  pathways in which the direct effects of GPXs are still unclear
