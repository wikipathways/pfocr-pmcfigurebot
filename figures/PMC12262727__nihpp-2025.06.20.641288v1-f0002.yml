figure_title: Whole-blood RNA sequence analysis of patients with LN demonstrates increased
  platelet activation in patients with R.
caption: Whole-blood RNA sequence analysis of patients with LN demonstrates increased
  platelet activation in patients with R. gnavus intestinal blooms. (A) Patients with
  LN (all class III and/or IV) in the pilot cohort were dichotomized based on levels
  of anti-LG serum antibodies. (B) Principal component analysis (PCA) of gene expression
  in whole-blood RNAseq libraries with top 25% variance among control, SLE without
  LN (SLE non-renal), LN without R. gnavus bloom (LN without dysbiosis), and LN with
  R. gnavus gut bloom (LN with RG bloom). PCA1 40.9%, PCA2 19.1%, and PCA3 7.8%. (C)
  Scatter plot of Log2-fold change (gene expression) comparing LN patients with RG
  blooms (LN with RG bloom) vs. controls to LN patients without RG blooms vs. controls.
  217 genes are significantly differentially expressed between LNRG and LN without
  bloom (Waldtest, qvalue<0.05), with 202 upregulated and 15 downregulated. (D) GSEA
  pathway analysis results of ranked genes based on LNRG vs. LN without bloom, showing
  significantly overrepresented pathways from genes increased in LNRG (right) or instead
  increased in LN without bloom (left). Myeloid cell development (NES=2.05, padj=3.2E-5),
  platelet degranulation (NES=1.9; padj=3.2E-5), myeloid cell homeostasis (NES=1.94,
  padj=7.9E-5), platelet activation (NES=1.93; padj=2.3E-4), platelet alpha granule
  (NES=1.93; padj=3.8E-4), neutrophil chemotaxis (NES=1.70; padj=2.6E-2), myeloid
  leukocyte migration (NES=1.70, padj=1.2E-2), myeloid leukocyte activation (NES=1.55,
  padj=1.5E-3), and neutrophil degranulation (NES=1.5; padj=7.8E-3). B cell activation
  (NES=−1.8; padj=2.9E-2), humoral immune response (NES=−2.6; padj=1.4E-7), and complement
  activation (NES=−2.1; padj=5.7E-3). (E) LN with RG bloom is devoid of B cell activation
  and classical complement pathway; instead, these pathways are associated with LN
  without bloom. Gene expression of LNRG vs. LN without bloom, with genes related
  to platelet activation (right) and B cell activation (left), noted. (F) Heatmap
  of gene expression in platelet activation in SLE non-renal LN, LN without bloom,
  and LN with RG patients. (G) Singscore module assessment of platelet activation
  pathway in LN patients with and without gut dysbiosis. (H) Gene expression of genes
  related to neutrophil degranulation (right) and Type I interferon (left), with (I)
  heatmap of gene expression in SLE non-renal, LN without bloom, and LN RG patients,
  and (J) Singscore module of neutrophil degranulation genes in LN patients with and
  without gut dysbiosis. Unpaired, non-parametric t-test
