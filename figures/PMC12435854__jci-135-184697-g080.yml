figure_title: Propionate supplementation increases local histamine levels in patients
  with RA or MS
caption: '(A) Histamine levels in stool extracts from patients with RA before and
  after 28 days of propionate supplementation. (B) Histamine levels in stool extracts
  from patients with MS before and after 90 days of propionate supplementation. (C)
  Volcano plot of RNA-Seq data from ex vivo colon culture infused with stool samples
  from patients before and after 90 days of propionate supplementation. Overlay with
  pathway genes of H1R and H2R activation (GSEA pathway: pos histamine response network).
  (D) Example images of histology staining of ileum biopsies from healthy controls
  or patients with RA stained for H3R. (E) Quantification of histological H3R staining
  of ileum biopsies from patients and healthy controls. (F) Histamine levels in stool
  processed into fecal microbiota transplants (FMTs) from healthy donors (107). FMTs
  were given to patients with active arthritis despite ongoing treatment with a steady-state
  dose of methotrexate. After 26 weeks, patients were categorized as being either
  treatment failures or treatment responders, according to the European psoriatic
  arthritis recommendations (108). FMT products of donors 1, 2, 3, and 4 were given
  to 6, 4, 3, and 2 patients, respectively. (G) Histamine was measured from the stool
  of patients with psoriatic arthritis at baseline before FMT. Data are expressed
  as mean ± SD. Statistical difference was determined by paired t test (A and B) and
  Student’s t test (E). *P < 0.05, ***P < 0.001'
article_title: Gut-specific histamine 3 receptor signaling orchestrates microglia-dependent
  resolution of peripheral inflammation
