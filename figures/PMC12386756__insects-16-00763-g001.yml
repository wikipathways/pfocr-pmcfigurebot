figure_title: The expression of genes related to IIS/TOR signaling pathway in different
  developmental stages of T.
caption: The expression of genes related to IIS/TOR signaling pathway in different
  developmental stages of T. molitor. (A–D) Expression of insulin-like peptide (ILP)-1/2/3/4;
  (E,F) expression of insulin receptor (InR)-1/2; (G) expression of insulin receptor
  substrate (CHICO); (H) expression of phosphatidylinositol 3-kinase (PI3K); (I) expression
  of phosphoinositide-dependent protein kinase (PDK); (J) expression of protein kinase
  B (AKT); (K) expression of phosphatase and tensin homolog (PTEN); (L) expression
  of transcription factor forkhead box class O (FOXO); (M,N) expression of ras homolog
  enhanced in brain (RHEB)-1/2; (O) expression of target of rapamycin (TOR); (P,Q)
  expression of stimulating ribosomal protein S6 kinase (S6K)-1/2; (R) expression
  of translational repressor 4e-binding protein (4EBP); (S) expression of GATA transcription
  factor (GATA) in different developmental stages. EE, early egg; ME, middle egg;
  LE, later egg; EL, early larvae; ML, middle larvae; LL, later larvae; PP, prepupae;
  EP, early pupae; MP, middle pupae; LP, later pupae; A1, adult after 1 day of emergence;
  A4, adult after 4 days of emergence; A8, adult after 8 days of emergence; A12, adult
  after 12 days of emergence; A16, adult after 16 days of emergence; A20, adult after
  20 days of emergence; A24, adult after 24 days of emergence. Means ± standard error
  (means ± SE) corresponding to different letters within a same gene was significantly
  different (p < 0.05, Tukey’s multiple comparison test), while solid circles indicate
  values for individual biological replicates
