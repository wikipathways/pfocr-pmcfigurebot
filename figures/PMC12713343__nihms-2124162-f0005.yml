figure_title: GLP1R Expression is Associated with Negative Notch Signaling in Advanced
  Prostate Cancer
caption: '5A. GSEA was performed on advanced prostate cancer samples (Mets, CRPC,
  NEPC, n=441), comparing GLP1R high (top quartile, n=110) vs. GLP1R low (bottom quartile,
  n=110). Four pathways were significantly enriched in GLP1R high samples vs. GLP1R
  low: Hedgehog Signaling Pathway (NES=2.14, p=0.00), Notch Signaling Canonical, Non-Canonical
  (NES=1.69, p=0.03), Osteoblast Differentiation and Related Diseases (NES=1.48, p=0.05),
  and Neural Crest Differentiation (NES=1.43, p=0.05). 5B. Leading edge analysis was
  performed from each enriched pathway to determine if there were any overlapping
  genes associated with GLP1R expression. A heatmap of the 24 leading edge genes that
  were shared between at least 2 pathways reveals significant crossover and redundancy
  in the Notch, Hedgehog, and Neural Crest Differentiation pathways. Leading edge
  genes for each pathway are colored in yellow and non-leading edge genes are colored
  in purple. 5C. mRNA signature scores for “positive” and “negative” regulators of
  Notch signaling have recently been identified in prostate cancer. Heatmaps of this
  dichotomy shows GLP1R expression is primarily associated with “negative” Notch regulation.
  5D. Expression of “negative” Notch regulators ASCL1, DLL1, DLL3, and DLL4 were all
  significantly higher in GLP1R high (red) vs. GLP1R low (blue) samples. 5E. In GSE32269,
  primary prostate cancer samples showed a positive, but insignificant, correlation
  between GLP1R and the negative Notch signature (R2 = 0.02714, p = 0.4638), while
  the bone metastatic prostate cancer samples had a significant positive correlation
  between GLP1R and the negative Notch signature (R2 = 0.4996, p <0.0001). 5F. In
  DbGaP NEPC samples, there was a significant positive correlation between GLP1R and
  the negative Notch signature (R2 = 0.3397, p = 0.0287). NES = normalized enrichment
  score, TPM = transcripts per million, * p<0.05, **** p<0.0001'
