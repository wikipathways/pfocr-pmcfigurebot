figure_title: ER quality control (QC) pathways
caption: 'The ER hosts a network of QC mechanisms that ensure proper protein folding
  and maintain proteostasis. (1) Nascent proteins undergo folding and maturation with
  the assistance of molecular chaperones and folding enzymes before proceeding along
  the secretory pathway. Given the error-prone nature of protein folding and the high
  demand for protein synthesis, the ER relies on several robust QC mechanisms, including
  (2) ER-associated degradation (ERAD), (3) ER-phagy or ER-to-lysosome-associated
  degradation (ERLAD), and (4) unfolded protein response (UPR). (2) ERAD identifies
  misfolded or unassembled proteins, retrotranslocates them across the ER membrane,
  and targets them for ubiquitin-proteasomal-mediated degradation. (3) ER-phagy or
  ERLAD mediates the clearance of misfolded protein aggregates and/or damaged ER subdomains
  via lysosomal degradation, particularly when substrates are resistant to ERAD. (4)
  The UPR, triggered by activation of UPR sensors IRE1α, PERK or ATF6, aims to restore
  ER homeostasis by attenuating protein translation, inducing chaperone expression,
  and enhancing degradation pathways. Importantly, the UPR and ERAD pathways are functionally
  interconnected: UPR signaling upregulates the expression of ERAD components, while
  ERAD regulates UPR activity by mediating the degradation of key UPR sensors, such
  as IRE1α and ATF6. Together, these pathways coordinate to fine-tune the ER folding
  environment and preserve cellular proteostasis. Created in BioRender'
