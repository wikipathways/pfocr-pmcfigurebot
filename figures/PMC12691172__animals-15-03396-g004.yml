figure_title: Time-dependent modulation of key NF-κB downstream effector proteins
  by baicalin.
caption: Time-dependent modulation of key NF-κB downstream effector proteins by baicalin.
  Protein expression levels of the pattern recognition receptor TLR7, its adaptor
  protein MyD88, and downstream pro-inflammatory effector cytokines (IL-1β, IL-6,
  TNF-α) were analyzed by Western blot in CEK cells under different baicalin treatment
  schedules at the indicated time points. Baicalin promoted the expression of these
  factors at 24 h but suppressed them by 48 h post-infection, demonstrating a biphasic
  regulatory effect on the NF-κB pathway’s downstream output
