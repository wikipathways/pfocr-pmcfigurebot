caption: 'Schematic illustration of the proposed mechanism (by Figdraw). Note: Figure
  4 Schematic diagram of the HGF/c-Met signaling pathways involved in osteogenic differentiation.
  Binding of HGF to its receptor c-Met activates downstream PI3K/AKT/mTOR and MAPK
  pathways, thereby regulating the transcription of osteogenic differentiation genes
  (RUNX2, OSX, OCN, OPN, ALP, COL1A1). P indicates phosphorylation; arrows indicate
  activation. Gene/protein abbreviations (e.g., HGF: hepatocyte growth factor; c-Met:
  mesenchymal-epithelial transition factor; PI3K: phosphatidylinositol 3-kinase; Akt:
  protein kinase B; mTOR: mammalian target of rapamycin; ERK: extracellular signal-regulated
  kinase; MEK: MAPK/ERK kinase; RAF: rapidly accelerated fibrosarcoma) are described
  in the text'
