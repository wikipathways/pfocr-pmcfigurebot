figure_title: Functional annotations and network analysis
caption: A. Dotplot of enriched pathways of biomarkers with an AUC value > 0.750.
  The top 30 clustered signaling pathways were plotted. Dot size indicates the number
  of proteins and colors represent fold enrichment. Pathways were ordered by the significance
  level of the representative pathway terms. RCT, Reactome; KEGG, Kyoto Encyclopedia
  of Genes and Genomes, PID, Pathway Interaction Database; BCT, Biocarta; WP, Wikipathways.
  B. Integrated functions of biomarker candidates in the top 30 pathways shown in
  panel A. The Z-score of the heatmap showed the relative expression levels of the
  proteins that were top-ranked based on their AUC values for both controls (Ctl)
  and sarcoidosis (Case). Three groups of pathways and corresponding biomarkers were
  marked with red, blue, and green color for endocytosis, responses to external stimuli,
  and transcription, respectively. C. Integrated networks of the top 10 enriched pathways
  shown in panel B. Proteins were connected with their respective pathways
