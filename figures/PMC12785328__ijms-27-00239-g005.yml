caption: Metabolic pathway analysis of proteins identified in the root system of Herat-740
  under T2 stress. The changes in abundance of proteins grouped into functional categories
  related to primary metabolism were visualized using MapMan software. Significantly
  changed categories were magnified. Each square and color indicates the log2 ratio
  value of differentially changed proteins. Red, green, and white colors indicate
  an increase, decrease, or no change, respectively, in the Log2 ratio values for
  the T2 treatment compared to the control roots
