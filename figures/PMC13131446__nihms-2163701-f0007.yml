figure_title: Analysis of differential correlation between gene expression in skeletal
  muscle from HSD and RSD samples
caption: '(a) pie chart depicting the number of genes in each differential correlation
  category. Categories are listed at the bottom of the figure (‘0’ = non-significant
  correlation, ‘+’ = significant positive correlation, ‘−’ = significant negative
  correlation). (b) Examples of differential correlation between genes in major correlation
  categories. Gene-pair expression are on the x- and y-axis respectively. For each
  plot, the line of best fit, the 95% confidence interval of the fit, the correlation
  coefficient (R), and the significance of the correlation are indicated. Gene-pairs
  and correlation categories (HSD/RSD) are as follows: CCL2-CRYBG3 (+/−), KCNMB4-SLC37A1
  (−/+), BCHE-UMPS (0/+), GRAMD2B-KLHL30 (−/0). (c) KEGG pathway overrepresentation
  analysis for the ‘+/−’ correlation category. Analysis was conducted via Enrichr.
  The x-axis shows the coverage (proportion of pathway genes present in the query)
  and the y-axis shows the pathway names. Points in the plot are color-coded by the
  significance of pathway enrichment (−log10 adjusted p-value) with deeper colors
  indicated stronger significance. (d) Overrepresentation analysis of transcription
  factor targets. The x-axis refers to the proportion of transcription factor target
  genes present in the query for each transcription factor listed on the y-axis. Analysis
  is performed on the dataset available from ENCODE-ChEA database. Points in the plot
  are color-coded by the significance of pathway enrichment (−log10 adjusted p-value)
  with deeper colors indicated stronger significance'
