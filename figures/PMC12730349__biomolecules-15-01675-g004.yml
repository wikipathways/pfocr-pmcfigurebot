figure_title: Therapeutic strategies of targeting lipid rafts in CRC.
caption: 'Therapeutic strategies of targeting lipid rafts in CRC. Figure legend: Gut
  microbiota-derived SCFAs and statins modulate cholesterol biosynthesis via the HMG-CoA
  pathway, while MβCD depletes membrane cholesterol, all of which impact tumor cell
  lipid raft structures. LNPs can be designed to selectively target raft-enriched
  molecules and modulate raft-dependent signaling. Notably, lipid rafts vary in abundance,
  distribution, and protein composition across CMS subtypes of CRC, highlighting the
  need for personalized raft-targeting strategies'
