caption: Principle mechanisms of post-radiotherapy tumor cell fate regulation and
  the associated molecular pathways. Radiotherapy could act as a multifaceted trigger
  that drives tumor cell fate towards different decisions including apoptosis, necrosis/necroptosis,
  pyroptosis, ferroptosis, autophagy and senescence through distinct pathways, leading
  to significant changes in the eventual treatment outcome through leveraging tumor
  cell survival and tumor-immune cell interactions
