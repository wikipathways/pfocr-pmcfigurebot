figure_title: Nuclear Cdk5 regulates gene expression through dual mechanisms.
caption: Nuclear Cdk5 regulates gene expression through dual mechanisms. Once in the
  nucleus, Cdk5 controls gene expression programs via two main pathways. (i) It directly
  phosphorylates transcription factors, such as p53 and MEF2, to modulate their activity.
  (ii) It targets the epigenetic machinery, including HDAC complexes and DNMT1, to
  alter chromatin state through histone acetylation (Ac) and DNA methylation (Me).
  The dotted arrow indicates a regulatory link requiring further validation
