figure_title: Identification of α-hederin binding proteins.
caption: 'Identification of α-hederin binding proteins. (A) Chemical structure of
  α-hederin and Bio-α-hederin. (B) Schematic showing steps for identifying α-hederin
  binding proteins using microarrays fabricated with recombinant human proteins. (C)
  Representative image of protein array showing positive (red arrow), negative control
  (blue arrow) spots, and spots for USP5 (yellow arrow). The left panel shows the
  microarray scan of Bio-α-hederin, the right panel shows the microarray scan of D-biotin,
  and the center panel shows the partial enlargement of the microarray of Bio-α-hederin
  (top) and D-biotin (bottom), respectively. (D) The top 3 potential binding targets
  of α-hederin were identified by proteome microarray. (E) Magnified image of Bio-α-hederin
  and D-biotin binding to USP5 spot on the protein array. The values of NOR-SNR and
  FC were showed. (F) Three- and two-dimensional docking of α-hederin and USP5. (G)
  CETSA was performed to assess the effect of α-hederin on the thermal stability of
  USP5 in HCT116 cells, n = 3. (H) DARTS assay measured the impact of α-hederin on
  the proteolytic stability of USP5 in HCT116 cells, n = 3. (I) Streptavidin‒biotin
  pull-down assay was performed on the protein mixture extracted from HCT116 cells
  and colon tissues of CRC-mice. (J) Pathway analysis of potential proteins in the
  KEGG database. (K, L) The effects of α-hederin treatment on cell proliferation,
  apoptosis, and related processes through in vivo (K) and in vitro (L) experiments.
  (M) GO enrichment analysis of the proteins interacting with α-hederin based on the
  GO database. Data are presented as means ± SD. *p < 0.05, **p < 0.01 versus DMSO
  group or control group, #p < 0.05, ##p < 0.01 versus pronase E group or model group'
