figure_title: Intercellular communication suggests an SPP1 signaling dynamic between
  mSCs and tSCs
caption: '(A) Heatmap showing the common significantly enriched secretion signaling
  pathways across WT, Sod1–/–, 7 dpi, and Denervation (combined Sod1–/– + WT 7 dpi)
  targeting tSCs. Coloring of the heatmap is based on the normalized (z score) communication
  probabilities. (B) Circle plots displaying the SPP1 signaling network across cell
  clusters for S100GFP-tg, S100GFP-tg Sod1–/–, and S100GFP-tg (7 dpi) mice. The thickness
  of connecting lines represents the communication likelihood between paired cell
  clusters, with arrowheads demarcating communication directionality. (C) Representative
  immunofluorescence images of NMJs stained for SPP1 (red), GFP (green), AChRs (BTX,
  white), and nuclei (DAPI, blue). Scale bars: 20 μm'
article_title: Decoding muscle-resident Schwann cell dynamics during neuromuscular
