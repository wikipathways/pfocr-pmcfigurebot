figure_title: Effect of AAE in modulating metabolic dysregulation.
caption: Effect of AAE in modulating metabolic dysregulation. HPLC–ESI–MS/MS identified
  4,5-dicaffeoylquinic acid as the primary constituent, plausibly associated with
  improved glucose and cholesterol homeostasis. AAE administration was associated
  with attenuated oxidative stress and polyol pathway modulation, alongside ameliorated
  cholesterol imbalance. Collectively, these findings suggest that AAE possesses the
  potential to modulate multiple pathways involved in mitigating early-stage metabolic
  dysregulation
