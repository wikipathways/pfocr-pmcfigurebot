figure_title: A hypothetical model of drug access to the PKD2L1 lateral fenestration
  binding site
caption: (A) LA-AA receptor access to the lateral fenestration binding site preferentially
  occurs via the inner gate (IG), as evidenced by enhanced inhibition of PKD2L1 during
  high-frequency opening events. For drugs with high lipid solubility, the lateral
  fenestrations (LF) present an additional hydrophilic access path to the LF receptor,
  as in Navs. (B) Membrane-impermeable local anesthetics (QX-314) show bilateral access
  to the local anesthetic binding site, with intracellular treatment producing near
  instantaneous inhibition, while extracellular treatment produces exceedingly slow
  inhibition. Due to QX-314’s inability to traverse through the cell membrane, this
  extracellular inhibition indicates a path through the tetragonal opening for polycystins
  (TOP) and selectivity filter (SF) to access the LF receptor. Due to the delayed
  inhibition produced by extracellular QX-314, this SF pathway is likely much less
  chemically favorable than the intracellular hydrophilic pathway
