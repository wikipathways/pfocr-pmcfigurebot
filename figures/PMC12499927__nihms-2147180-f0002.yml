figure_title: Biased agonism.
caption: 'Biased agonism. β2AR activation leads to two distinct signaling pathways:
  Gαs-G-protein mediated PKA activation and β-arrestin mediated internalization. (A)
  A balanced ligand activates both arms of the pathway equally. (B) A Gαs-biased ligand
  preferentially augments the Gαs arm of the pathway while (C) a β-arrestin-biased
  ligand preferentially augments β-arrestin-mediated signaling'
