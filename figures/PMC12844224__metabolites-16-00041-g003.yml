  of post- versus pre-exercise under BCAA supplementation. For each comparison, the
  left panel represents positive-ion mode and the right panel represents negative-ion
  mode. Values in bars indicate counts (percent in parentheses). Abbreviations: KEGG,
  Kyoto Encyclopedia of Genes and Genomes. BCAA, branched-chain amino acid'
