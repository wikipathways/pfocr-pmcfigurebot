caption: '(a) mRNA volcano plot, where blue indicates down-regulation and red indicates
  up-regulation; (b) mRNA GO enrichment circle diagram: First circle: Top 20 enriched
  GO terms. The scale outside the circle represents the number of differentially expressed
  genes, with different colors representing distinct Ontologies. Second circle: The
  number of differentially expressed genes relative to the background count for each
  GO term, along with the Q-value. Longer bars indicate a higher background count,
  while redder colors correspond to lower Q-values. Third circle: Bar chart showing
  the proportion of up- and down-regulated differentially expressed genes. Dark purple
  represents up-regulated genes, while light purple represents down-regulated genes;
  specific values are shown below. Fourth circle: RichFactor values for each GO term
  (calculated as the number of differentially expressed genes in that GO term divided
  by the total number of genes in that term), with background grid lines where each
  grid represents 0.1. (c) KEGG enrichment circle diagram for mRNA: First circle:
  Top 20 enriched pathways, with the scale outside the circle indicating the number
  of differentially expressed genes. Different colors represent different pathway
  classes. Second circle: The number of differentially expressed genes in the background
  for each pathway and its Q-value. Longer bars indicate a larger number of differentially
  expressed genes in the background, and redder colors indicate smaller Q-values.
  Third circle: Bar chart showing the proportion of up- and down-regulated differentially
  expressed genes. Dark purple represents up-regulated genes, while light purple represents
  down-regulated genes; specific values are displayed below. Fourth circle: RichFactor
  values for each pathway (calculated as the number of differentially expressed genes
  in the pathway divided by the total number of genes in the pathway), with background
  grid lines where each grid represents 0.1'
