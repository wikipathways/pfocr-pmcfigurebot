figure_title: Molecular basis of SLPI in osteoarthritis (OA).
caption: Molecular basis of SLPI in osteoarthritis (OA). This schematic illustrates
  the interplay between osteoarthritis-associated genes and the biological functions
  of Secretory Leukocyte Protease Inhibitor (SLPI) relevant to OA’s pathology. Key
  OA-related genes (COL2A1, MMP13, GDF5, SMAD3, ASPN, RUNX2, IL1RN, DVWA, PTGS2, CHST11)
  regulate cartilage structure, inflammation, and bone metabolism. SLPI, as a serine
  protease inhibitor, counteracts cartilage matrix degradation by inhibiting neutrophil
  elastase, cathepsin G, and proteinase 3, and it modulates inflammation through sequestration
  of inflammatory mediators like serum amyloid A and leukotriene B4. Together, these
  molecular pathways highlight SLPI’s potential role in preserving joint integrity
  and regulating inflammation, making it a promising target in OA research. Created
  in BioRender. Kim, W. (2025) https://BioRender.com/379fyp0
