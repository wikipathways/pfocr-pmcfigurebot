figure_title: Muscle mass homeostasis is bidirectionally controlled by anabolic and
  catabolic cues.
caption: Muscle mass homeostasis is bidirectionally controlled by anabolic and catabolic
  cues. Nutrients and growth factors stimulate the PI3K-AKT-mTOR pathway, in cooperation
  with MAPK and BMP-SMAD1/5/8 axes, to enhance transcription and protein synthesis.
  In cachexia, tumor- and immune-derived inflammatory cytokines activate NF-κB, upregulating
  UPS and ALS pathways. Additionally, activin/myostatin-ActRIIB-SMAD2/3, glucocorticoid-GR,
  and AngII-AT1R pathways similarly activate UPS/ALS, collectively driving myofibrillar
  degradation. Dashed lines indicate inhibited routes
