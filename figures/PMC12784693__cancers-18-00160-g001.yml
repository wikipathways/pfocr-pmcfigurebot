caption: Single-cell clustering, annotation, marker validation, and functional characterization.
  (A) UMAP visualization showing unbiased clustering of cells into distinct transcriptional
  populations. (B) Distribution of cells across individual samples, illustrating the
  contribution of each dataset to the integrated atlas. (C) Annotation of major cell
  lineages based on canonical marker genes, including T cells, B cells, NK cells,
  macrophages, monocytes, epithelial cells, fibroblasts, endothelial cells, mast cells,
  and proliferating cells. (D) Dot plot displaying representative marker genes for
  each cell type, with dot size indicating the proportion of expressing cells and
  dot color reflecting expression intensity. (E) Relative abundance of major cell
  types across patients. (F) Functional enrichment analysis of each annotated cell
  population, including GO Biological Process, KEGG pathways, and WikiPathway signatures
