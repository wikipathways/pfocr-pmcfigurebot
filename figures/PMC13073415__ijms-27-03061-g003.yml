figure_title: Practical checklist of common pitfalls and minimal experimental standards
  for ICD attribution.
caption: Practical checklist of common pitfalls and minimal experimental standards
  for ICD attribution. Frequent sources of misclassification include equating individual
  DAMP measurements with ICD, relying solely on in vitro DC activation markers, and
  insufficient controls for timing, dose, and contamination. Minimal standards emphasize
  functional immune validation in immunocompetent settings (ideally vaccination/protection
  assays), antigen-specific T-cell endpoints, and mechanistic controls that test the
  requirement of sensing pathways and antigen presentation
