figure_title: The Leloir pathway of galactose metabolism and the proposed pathobiology
  of galactose-1-phosphate uridylyltransferase (GALT) deficiency.
caption: The Leloir pathway of galactose metabolism and the proposed pathobiology
  of galactose-1-phosphate uridylyltransferase (GALT) deficiency. Galactose, absorbed
  via diet or produced endogenously in a cell, is phosphorylated to form galactose-1-phosphate
  (Gal-1P). In the absence of GALT, the build-up of Gal-1P is thought to induce abnormal
  integrated response (ISR), which plays a role in the pathophysiology of the disease.
  Administration of GALT mRNA (green arrow) is expected to restore expression of GALT
  enzyme, thus effectively eliminating the Gal-1P accumulation
