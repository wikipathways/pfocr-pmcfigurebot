figure_title: DPA4 and CUC2 regulate DNRR in a common genetic pathway.
caption: 'DPA4 and CUC2 regulate DNRR in a common genetic pathway. (A) Leaf explants
  cultured on B5 medium at 14 DAC from Col-0, cuc2-1D, dpa4-2, and cuc2-1D dpa4-2;
  scale bars indicate 500 µm. (B) Rooting rate of leaf explants from Col-0, cuc2-1D,
  dpa4-2, and cuc2-1D dpa4-2 (c2 d4) on B5 medium. (C) Rooting capacity of leaf explants
  from Col-0 (C), cuc2-1D (c2), dpa4-2 (d4), and cuc2-1D dpa4-2 (c2 d4) on B5 medium
  at 10 DAC. (D) RT-qPCR analysis of gene expression levels in Col-0, cuc2-1D, dpa4-2,
  and cuc2-1D dpa4-2 (c2 d4) leaf explants, 4 HAC on B5 medium, N = 4. (B,C) Average
  values are shown (N ≥ 40 leaves from 5 individual plates for each single experiment),
  ±SEM. Statistical significance was determined by Student’s t-test: * p < 0.05, **
  p < 0.01, and *** p < 0.001 and a–d mark groups of significant differences (p ≤
  0.05). 0, 1, 2, and ≥3 represent AR numbers per leaf explant'
