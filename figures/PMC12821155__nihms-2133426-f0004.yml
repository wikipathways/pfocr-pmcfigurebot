figure_title: Transcriptomic responses related to autophagy and inflammation are altered
  in the injured spinal cord tissues of Becn1F121A/F121A mice 10 weeks after SCI.
caption: 'Transcriptomic responses related to autophagy and inflammation are altered
  in the injured spinal cord tissues of Becn1F121A/F121A mice 10 weeks after SCI.
  (A) The volcano plot displayed genes identified through differential expression
  analysis of the interaction between genotype (BMut vs. WT) and injury (SCI vs. Sham).
  Each point represents a gene, plotted by its fold change and statistical significance
  (p-value). Genes with the most significant p-values or largest fold changes were
  highlighted and labeled. (B) The DEGs showing significant interaction effects from
  (A) were subjected to GO enrichment analysis, and the top 10 enriched terms are
  displayed. (C-D) Enriched GO terms related to the autophagy process were shown,
  based on DEGs with significant expression changes and fold changes in BMut/SCI compared
  to WT/SCI. (E-F) The gene set ‘Protein Targeting to Vacuole Involved in Autophagy’
  was activated in the gene set enrichment analysis (GSEA) comparing BMut/SCI to WT/SCI,
  and representative genes with significant upregulation were highlighted. NES: normalized
  enrichment score. (G-H) Bar graphs displayed top 10 GO terms enriched in neuroinflammation-related
  process (G) and top 30 DEGs involved (H). (I) The Venn diagram illustrated the DEG
  sets associated with GO terms related to Inflammation and Autophagy, highlighting
  7 genes common to both. (J) The predicted protein interaction network (PIN) revealed
  potential hub genes linking autophagy and inflammation signaling pathways, based
  on DEGs from (I). n = 5 mice (Sham) and 4 mice (SCI) each group'
article_title: Autophagy activation by the Becn1F121A mutation reprograms neuroinflammation
  and promotes neurological recovery after spinal cord injury
