figure_title: Stage-specific cholesterol dependence and life-history trade-offs in
  D.
caption: Stage-specific cholesterol dependence and life-history trade-offs in D. melanogaster.
  Cholesterol functions as a pleiotropic, stage-dependent resource across the Drosophila
  life cycle, with distinct physiological outcomes determined by developmental timing
  and nutritional context. During larval development, dietary sterols are essential
  to support membrane biogenesis and somatic growth, Hedgehog-dependent developmental
  patterning through cholesterol modification, and repeated ecdysteroid pulses that
  drive molting. In parallel, excess dietary sterols are accumulated as reserves that
  support subsequent developmental stages; limitation of sterol availability during
  larval growth leads to developmental arrest or lethality. The pupal stage represents
  a strict metabolic bottleneck, as feeding ceases and all endocrine signaling and
  metamorphic remodeling depend exclusively on sterol reserves acquired during larval
  life, rendering survival sensitive to reserve availability through ecdysteroid-dependent
  metamorphosis. In adults, cholesterol is continuously allocated among competing
  physiological demands, including ecdysteroid-dependent reproductive processes, neural
  membrane maintenance, and synaptic function, giving rise to allocation trade-offs
  rather than further growth. During aging, dietary cholesterol interacts with macronutrient
  balance and nutrient-sensing pathways, including TOR and insulin signaling, producing
  non-linear effects on healthspan that reflect trade-offs between somatic maintenance
  and reproduction
