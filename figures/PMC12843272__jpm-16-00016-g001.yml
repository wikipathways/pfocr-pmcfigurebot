figure_title: Schematic representation of GDF-15 biosynthesis, maturation, and secretion.
caption: 'Schematic representation of GDF-15 biosynthesis, maturation, and secretion.
  (a) GDF-15 is synthesized as pre-pro-GDF-15, consisting of a signal peptide (blue),
  a pro-domain (yellow), and a mature C-terminal domain (red). Removal of the signal
  peptide generates pro-GDF-15, which rapidly dimerizes; (b) In the Golgi apparatus,
  pro-GDF-15 dimer is cleaved by PCSK3, PCSK5, and PCSK6 at the RXXR site, producing
  mature GDF-15; (c) Mature GDF-15 homodimers are secreted through the classical secretory
  pathway and released into circulation, while in specific cells pro-GDF-15 dimers
  may remain bound to the extracellular matrix until further cleavage by MMP26 or
  PCSKs. GDF-15: Growth Differentiation Factor-15; PCSK: proprotein convertase subtilisin–kexin;
  MMP26: matrix metalloproteinase 26'
