figure_title: Liver transcript-/metabolomic analysis
caption: A. Volcano plot representation of DEG’s in liver of hPHB1-KD males compared
  with WT. Annotated genes on the plot represent DEG’s that are significantly up-
  (red) or downregulated (blue) in hPHB1-KD mice. The Y-axis shows statistical significance,
  expressed as −log10 p-value while the X-axis denotes the beta value (natural log
  of fold change) between groups. B. KEGG pathway enrichment analysis performed using
  BioJupies software. Bar graph was prepared using GraphPad prism 10 software to show
  upregulated pathways involved in liver metabolism C. Joint pathway analysis by integrating
  transcriptomic (DEGs with p value <0.05 and beta value > 0.35 (one-fold change))
  and metabolomic (metabolites with p-value <0.1) data using KEGG pathway on MetaboAnalyst
  software version 5. The plot represents the pathway impact with its significance
  presented as −1og10 p-value
