figure_title: Non-reference genome-based transcriptome analysis for liver under warming
  (n = 3).
caption: 'Non-reference genome-based transcriptome analysis for liver under warming
  (n = 3). (a) Principal component analysis (PCA) scatter diagram. The 9, 15, and
  21 °C groups were represented by green squares, orange circles and blue triangles,
  respectively. (b) Volcano map of the distribution trends of differentially expressed
  genes (DEGs) between 15 and 9 °C. Each dot represents one gene. Blue and red dots
  represent DEGs. Gray dots represent non-differentially expressed genes. (c) Volcano
  map of the distribution trends of differentially expressed genes (DEGs) between
  21 and 9 °C. (d) Bar chart showing the significantly enriched GO terms in 15 °C
  vs. 9 °C. (e) Bar chart showing the significantly enriched GO terms in 21 °C vs.
  9 °C. The results for 15 vs. 9 °C and 21 °C vs. 9 °C are divided into three main
  categories: cellular components, biological process, and molecular. The X-axis at
  the bottom indicates the number of unigenes. The Y-axis indicates the subcategories.
  (f,g) Bar chart of enriched KEGG pathways of up-regulated and down-regulated genes
  of 15 °C vs. 9 °C. (h,i) Bar chart of enriched KEGG pathways of up-regulated and
  down-regulated genes of 21 °C vs. 9 °C. Con: control group (9 °C); C15: 15 °C group;
  C21: 21 °C group'
