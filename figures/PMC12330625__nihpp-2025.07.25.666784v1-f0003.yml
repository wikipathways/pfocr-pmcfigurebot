figure_title: Atlanta plots show that a subset of peaks explain gene expression.
caption: Atlanta plots show that a subset of peaks explain gene expression. Atlanta
  plots of GWAS tagged genes from IBD, SLE and RA which have been grouped by pathway
  analysis. The gray bars represent the total number of peaks within the gene’s cis-regulatory
  region, and the green bars represent the number of peaks in the region used to trained
  on for gene expression prediction. The blue bars represent the amount of gene expression
  explained, as the ensembled R2 value from k-fold cross validation. Genes are clustered
  by pathways and arranged from left to right according to the ratio of the proportion
  of peaks included to the amount of variance explained
