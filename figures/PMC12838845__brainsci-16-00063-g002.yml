figure_title: Molecular Mechanism Underlying Microglial Activation Following CVA.
caption: 'Molecular Mechanism Underlying Microglial Activation Following CVA. TLRs
  play critical roles in the activation of microglia during the neuroinflammatory
  response induced by damage-associated molecular patterns (DAMPs) in stroke. MyD88
  recruits IRAK family kinases through its death domain (DD). IRAK proteins interact
  with TRAF-6, allowing TRAF-6 to activate the MAPKKK TAK1. TAK1 phosphorylates the
  IKK complex, activating it. The activated IKK complex phosphorylates IκB, marking
  it for degradation and thereby releasing NF-κB (p50/p65). Once released, it translocates
  into the nucleus, where it promotes the transcription of specific target genes.
  Additionally, TAK1 can stimulate the AP-1 pathway by activating the pathway of MAP
  kinases. TNF-α receptor activation induces the canonical pro-inflammatory transcriptional
  factors such as NF-κB and subsequent production of inflammatory mediators. Abbreviations:
  BBB, blood–brain barrier; DAMPs, damage-associated molecular patterns; TLR4, toll-like
  receptor 4; TNF-α R, tumor necrosis factor-alpha receptor; TAK1, transforming growth
  factor-beta-activated kinase 1; MyD88, adapter protein myeloid differentiation factor
  88; IRAK, interleukin receptor associated kinase; TRAF6, tumor necrosis factor receptor-associated
  factor 6; TIRAP, toll-interleukin 1 receptor domain containing adaptor protein;
  MAP3K, mitogen-activated protein kinase kinase kinase; IKKs, IκB kinases; PI3K,
  phosphoinositide 3-kinase; IkBa, inhibitor of kappa light chain gene enhancer in
  B cells, alpha; Akt, v-akt murine thymoma viral oncogene homolog; Mek1/2, mitogen-activated
  protein kinase kinases 1/2; Mkk4/7, mitogen-activated protein kinase kinase 4/7;
  Mek3/6, mitogen-activated protein kinase kinases 3/6; ERK1/2, extracellular regulated
  kinase 1/2; JNK, c-Jun NH2-terminal kinase; AP-1, activator protein 1; TNF-α, tumor
  necrosis factor alpha; IL-1B, interleukin-10; iNOS, inducible nitric oxide synthase.
  Created with BioRender'
