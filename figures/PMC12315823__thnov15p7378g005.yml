figure_title: Interactions between TAMs and tumor cells.
caption: Interactions between TAMs and tumor cells. TAM-derived exosomal circ-0020256
  promotes tumor proliferation, while exosomal miR-628-5p and ADAM15 inhibit tumor
  proliferation. TAM-derived exosomal miR-21-5p and miR-155-5p promote tumor invasion
  and metastasis, compared to PROS1, which inhibits tumor metastasis. Exosomal ApoE
  from TAMs promotes tumor migration via activating PI3K-Akt pathway. GATA3 from TAM-derived
  EVs induces tumor immune evasion via upregulating CD24 and Siglec-10. TAM-derived
  TGF-β1 and lncRNA CRNDE drive tumor resistance to cisplatin through HLF and NEDD4-1-mediated
  PTEN ubiquitination, respectively. TAM-secreted GPNMB and CXCL7 restore the stemness
  of differentiated tumor cells. TAM-derived IL-6, exosomal lncMMPA, and HISLA promote
  glycolysis in tumor cells via PDPK1, ALDH1A3, and HIF-1α, respectively. Reciprocally,
  tumor cells recruit circulating monocytes via secreting IL-6, IL-34, CSF-1 and CSF-2.
  Tumor cell-derived IL-4, IL-10, CSF-1, lactic acid, succinate and TDEs induce M2
  TAM polarization. TDEs also induce PD-L1 expression in monocyte-derived TAMs. At
  last, metastatic TDEs can reduce the phagocytosis, efferocytosis and cytotoxicity
  of macrophages on tumor cells through TGFB2 signals
