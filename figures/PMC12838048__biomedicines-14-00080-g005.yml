figure_title: V-125 and bexarotene enrich distinct pathways in tumors.
caption: V-125 and bexarotene enrich distinct pathways in tumors. Bar graphs display
  the top differentially enriched pathways identified by GO Biological Process 2025
  analysis in Enrichr. (A) Upregulated and downregulated pathways altered in V-125-treated
  vs. control tumors, and (B) upregulated and downregulated pathways altered in bexarotene-treated
  vs. control tumors. Pathway enrichment is plotted as −log10(p-value). Pink bars
  indicate pathways that are upregulated, and blue bars indicate pathways that are
  downregulated. Pathways are ranked by significance
