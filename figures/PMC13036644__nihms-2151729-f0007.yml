figure_title: U-shape relation between blink duration and pupil constriction
caption: '(A) Correlation between blink duration and pupil constriction for an example
  emmetrope at the top (EG, in black) and an example myope at the bottom (HR, in green).
  Lines are linear regressions. Labels are squared correlation coefficients (R2),
  chance probability (p), and linear slopes (s).(B) U-shape relation between blink
  duration and pupil constriction at three different contrast ranges in groups of
  emmetropes (top) and myopes (bottom). The U-shaped relation is more pronounced in
  emmetropes than myopes (p = 0.005, mixed-effect model).(C) U-shaped relation between
  blink duration and pupil constriction in a single subject that voluntarily generated
  a wide range of blink durations. From left to right, U-shaped function, pupil diameter
  after different blink durations (blue: shortest, orange: intermediate, red: longest),
  and pupil constriction triggered by blinks (top) and defocus (bottom). The pupil
  constriction triggered by blinks is driven by ON-dominated pupillary light reflexes.
  The pupil constriction triggered by −5 D defocus is driven by both ON and OFF pathways.(D)
  Average U-shaped relations measured with this method in two emmetropes (left) and
  two myopes (right). All error bars are standard errors'
article_title: Human accommodative visuomotor function is driven by contrast through
  ON and OFF pathways and is enhanced in myopia
