figure_title: Changes in amino acid and protein metabolism throughout the menstrual
  cycle.
caption: 'Changes in amino acid and protein metabolism throughout the menstrual cycle.
  Schematic representation of phase-dependent regulation of protein metabolism. During
  the estradiol (E2)-dominant follicular phase, anabolic processes are enhanced, including
  increased muscle protein synthesis, mechanistic target of rapamycin (mTOR) activation,
  and cellular growth, mediated by estrogen receptor (ER) signaling. In contrast,
  the progesterone (P4)-dominant luteal phase is characterized by a shift toward catabolic
  processes, including increased protein oxidation, amino acid breakdown, and elevated
  nitrogen excretion. At the cellular level, E2 promotes mTOR pathway activation and
  muscle protein accretion, whereas in the luteal phase, increased amino acid oxidation
  occurs at the mitochondrial level, involving branched-chain amino acid (BCAAs) metabolism,
  leucine signaling, and ATP production. Abbreviations: E2, estradiol; P4, progesterone;
  mTOR, mechanistic target of rapamycin; ER, estrogen receptor; BCAA, branched-chain
  amino acids; ATP, adenosine triphosphate'
