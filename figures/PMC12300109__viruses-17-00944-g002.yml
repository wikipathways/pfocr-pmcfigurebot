figure_title: Functional classification of proteins involved in cellular processes.
caption: Functional classification of proteins involved in cellular processes. The
  proteins DUSP26 (dual-specificity phosphatase 26), APBB2 (amyloid beta precursor
  protein-binding family B, member 2), SCARA3 (scavenger receptor class A, member
  3), and the prolactin receptor (PRLR) are involved in several interconnected cellular
  processes that are critical for maintaining cellular homeostasis and responding
  to environmental signals. DUSP26 plays a significant role in the regulation of the
  cell cycle, apoptosis, and tumorigenesis. Its activity is modulated by the signal
  transduction pathway initiated by growth factors. Similarly, APBB2 is involved in
  the regulation of cell migration, cellular function, intracellular trafficking,
  tumorigenesis, and chemoresistance. APBB2 is regulated by both PRLR and growth factor-mediated
  signal transduction pathways. SCARA3 contributes to the regulation of tumorigenesis,
  chemoresistance, cell adhesion, and lipid metabolism. The PRLR, in turn, regulates
  the expression of APBB2 and is itself involved in the control of the cell cycle,
  DNA replication, apoptosis, and cell death. PRLR is also regulated by growth factor
  signaling pathways. Collectively, these proteins participate in essential processes
  related to cell proliferation, survival, and the response to various stressors,
  including oxidative and oncogenic stress
