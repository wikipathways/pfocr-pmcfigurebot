figure_title: Artificial intelligence augmentation across the hepatocellular carcinoma
  clinical care pathway.
caption: Artificial intelligence augmentation across the hepatocellular carcinoma
  clinical care pathway. The left column depicts the sequential clinical workflow
  for at-risk patients, beginning with identification of the at-risk population (cirrhosis
  of any etiology, chronic hepatitis B virus infection, or select patients with advanced
  fibrosis), proceeding through risk stratification using clinical factors, laboratory
  data, and longitudinal electronic health record inputs, and advancing to semiannual
  surveillance with ultrasound with or without alpha-fetoprotein. When no focal liver
  lesion is detected, patients continue routine surveillance at six-month intervals.
  When a focal lesion is identified, the pathway advances to diagnostic characterization
  with multiphase CT, contrast-enhanced MRI, or contrast-enhanced ultrasound interpreted
  using LI-RADS criteria, followed by staging and prognostication using the Barcelona
  Clinic Liver Cancer system with assessment of liver function and performance status,
  treatment selection across curative (resection, ablation, transplantation), locoregional
  (TACE, TARE, SBRT), and systemic therapy options, and finally post-treatment assessment
  and monitoring including response assessment and recurrence surveillance. The right
  column maps the corresponding AI augmentation opportunity at each step, with evidence
  maturity graded as more mature (A), emerging (B), or proof-of-concept (C). All current
  AI applications in HCC—spanning risk prediction, ultrasound quality assessment and
  lesion detection, imaging characterization, staging and prognosis, and treatment
  response prediction—are classified as emerging (B), while follow-up intensity planning
  remains at the proof-of-concept stage (C), reflecting the absence of prospectively
  validated, workflow-integrated tools across the entire continuum
