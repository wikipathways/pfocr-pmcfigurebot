figure_title: Enrichment analysis of DEGs in response to shading treatment.
caption: 'Enrichment analysis of DEGs in response to shading treatment. (a) Gene Ontology
  (GO) enrichment analysis bubble chart. The chart displays the most significantly
  enriched GO terms across the three ontologies: Biological Process (BP), Cellular
  Component (CC), and Molecular Function (MF). The size of the bubble represents the
  number of DEGs in that term, and the color indicates the level of statistical significance
  (−log10(adjusted p-value)). (b) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway
  enrichment analysis bubble chart. The chart shows the most significantly enriched
  metabolic and signal transduction pathways. Bubble size corresponds to the number
  of DEGs mapped to the pathway, and color represents the enrichment significance
  (−log10(adjusted p-value))'
