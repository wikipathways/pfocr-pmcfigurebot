figure_title: mTOR and GSK3 opposingly regulate cell cycle and immune response gene
  expression
caption: (A) Schematic experimental layout to identify regulators required for rapamycin-mediated
  induction of BTG2, CD79B, and OCAB.(B) Venn diagram showing the regulator overlap
  among the 3 rapamycin-treated screens (left). STRING network analysis of the 18
  regulators detected in all three screens (middle). Regulators identified specifically
  in the rapamycin-treated conditions, but not in normal conditions, are boxed and
  highlighted in bold. The table on the right indicates the screens in which regulators
  were detected under normal conditions.(C) Bar graph showing relative reporter MFI
  ± SEM of inhibitor treatments (rapamycin alone or combined with 2 different GSK3
  inhibitors) vs. DMSO.(D) Venn diagram showing the DEG overlaps of down- and upregulated
  genes comparing GSK3 inhibitor-treated vs. rapamycin-treated SU-DHL-4 cells. STRING
  functional enrichment was performed for genes reduced by GSK3 inhibition but increased
  by rapamycin. Gene Ontology term and false discovery rates (Benjamini-Hochberg)
  are indicated for the largest STRING cluster.(E) RNA-seq PCA analysis of SU-DHL-4
  cells treated with inhibitors or DMSO.(F) Gene expression heatmap and hierarchical
  clustering of all differentially expressed genes derived from indicated inhibitor-
  or DMSO-treated SU-DHL-4.(G) Reactome pathway enrichment analysis of genes in the
  three main clusters detected in (F). Gene counts and adjusted p values (Benjamini-Hochberg)
  are indicated
article_title: Biphasic control of the B cell transcriptome by mTORC1 and GSK3
