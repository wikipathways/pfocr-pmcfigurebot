figure_title: αSyn pathology is independent of PLEKHM1 overexpression.
caption: αSyn pathology is independent of PLEKHM1 overexpression. (A) Wild-type mice
  received unilateral stereotactic injections of recombinant adeno-associated virus
  into the substantia nigra pars compacta. Neuronal transduction was achieved using
  a 1:1 mixture of the indicated viral vectors. Eight weeks post-injection, synuclein
  pathology, nigrostriatal pathway integrity, neuroinflammation, and astrogliosis
  were evaluated via immunohistochemistry and immunofluorescence. (B) Representative
  brightfield image of immunohistochemical staining for HA-tagged PLEKHM1 in the SN
  confirming transgene expression after transduction with rAAV-PLEKHM1. Scale bar
  = 300 µm. Inset indicated by the pink dotted square in the non-magnified image.
  Scale bar = 10 µm. (C) Representative slide scan showing EGFP expression in neurons
  of the SN following transduction with rAAV-EGFP. Scale bar = 300 µm. Inset indicated
  by the white dotted square in the non-magnified image. Scale bar = 20 µm. (D,E)
  Representative slide scans depicting the SN in animals transduced with rAAV-αSyn
  + rAAV-EGFP and rAAV-αSyn + rAAV-PLEKHM1. H-αSyn-positive (D) and P-αSyn-positive
  cells (E) were visualized by immunofluorescence. Scale bar = 200 μm. (F,G) Quantification
  of H-αSyn-positive cells (F) and P-αSyn-positive cells (G) in the SNc. Dots represent
  individual animals (n = 5 in rAAV-αSyn + rAAV-EGFP, n = 6 in rAAV-αSyn + rAAV-PLEKHM1).
  Non-significant results are annotated with “ns”
