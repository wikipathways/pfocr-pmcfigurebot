figure_title: Functional enrichment analysis of common MLSG–T2DM targets.
caption: 'Functional enrichment analysis of common MLSG–T2DM targets. (a) GO enrichment
  analysis of 213 common targets shared between T2DM and MLSG, categorized into biological
  processes (red), cellular components (blue), and molecular functions (green), with
  the top 10 terms from each category ranked by significance (p < 0.05). (b) KEGG
  pathway enrichment bubble plot showing the top 20 significantly enriched pathways
  ranked by p-value, with bubble size representing the number of enriched genes and
  color scale indicating significance. (c) KEGG critical pathway–target network highlighting
  the top five pathways most closely associated with T2DM pathogenesis: PI3K–Akt signaling
  (hsa04151), lipid and atherosclerosis (hsa05417), HIF-1 signaling (hsa04066), EGFR
  tyrosine kinase inhibitor resistance (hsa01521), and AGE–RAGE signaling in diabetic
  complications (hsa04933), mapped to their associated targets'
