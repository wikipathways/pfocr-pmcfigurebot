figure_title: GPX4/SLC7A11 is a key pathway in ferroptosis.
caption: GPX4/SLC7A11 is a key pathway in ferroptosis. Homocysteine inhibition of
  the GPX4/SLC7A11 pathway leads to lipid peroxidation and promotes ferroptosis. Ginsenoside
  Re can attenuate lipid peroxidation by increasing the expression of GPX4 and protecting
  endothelial cells from ferroptosis. The red symbols indicate inhibition and the
  green symbol indicates promotion. GPX4, glutathione peroxidase 4; SLC7A11; solute
  carrier family 7 member 11; ROS, reactive oxygen species; GSH, glutathione
article_title: Ginsenoside Re attenuates homocysteine-induced endothelial cell ferroptosis
  through upregulation of GPX4/xCT signaling
