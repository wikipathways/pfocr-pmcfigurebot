figure_title: Unsupervised hierarchical clustering analysis of selected genes in endometriosis
  and unaffected tissue based on the EndometDB.
caption: Unsupervised hierarchical clustering analysis of selected genes in endometriosis
  and unaffected tissue based on the EndometDB. (A) Unsupervised hierarchical clustering
  analysis of mRNA expression of selected differentially expressed genes with regards
  to tissues and lesions. (B) Unsupervised hierarchical clustering analysis of mRNA
  expression of selected differentially expressed genes with regards to tissues and
  lesions, patient age, cycle stage/phase, and endometriosis stage. The different
  clinical features of the samples (lesion/tissue type, age of patients with pre-selected
  grouping, hormonal stage, and Endometriosis stage) are presented in the heatmap.
  The Canberra distance metric, combined with Ward’s clustering method, was applied,
  revealing clusters corresponding to lesions and tissue types. The dendrogram on
  the x-axis shows the hierarchical relationship between the tissues and lesions,
  as well as the cycle phase and disease stage. The dendrogram on the y-axis shows
  the measure of similarities in the activation levels of the respective signaling
  pathway genes. The colors represent different tissues and lesions from both healthy
  controls and patients with endometriosis
