figure_title: Histone Kl-la pathways
caption: a, An overview of the two Lys l-lactylation (Kl-la) pathways mediated by
  GTP-specific succinyl-CoA synthetase (GTPSCS) and acetyl-CoA synthetase 2 (ACSS2).
  Both can translocate into the nucleus and catalyse the formation of l-lactyl-CoA
  from l-lactate, coenzyme A (CoA) and, respectively, GTP or ATP. In the nucleus,
  GTPSCS and ACSS2 form complexes with p300 and Lys acetyltransferase 2A (KAT2A),
  respectively, to mediate histone Kl-la through an l-lactyl-CoA-dependent mechanism.
  Histone Kl-la can be removed by eraser enzymes such as histone deacetylases (HDACs)
  and sirtuins (SIRTs). b, The compartmentalized activities of GTPSCS and alanyl-tRNA
  synthetase 1 (AARS1) and AARS2 (AARS1/2). In mitochondria, GTPSCS catalyses the
  reversible conversion of succinate (Succ) to succinyl-CoA. Following translocation
  to the nucleus, GTPSCS synthesizes l-lactyl-CoA from l-lactate (Lac) and coenzyme
  A for histone Kl-la. By contrast, the spatial regulation of AARS1 and AARS2, particularly
  in the nucleus, remains less defined. These enzymes mediate Kl-la through an alternative,
  l-lactyl-CoA-independent pathway that bypasses canonical lactyltransferases. Moreover,
  the canonical enzymatic activity of AARS1 drives alanyl-tRNA synthesis in the cytoplasm,
  whereas AARS2 fulfils this role in mitochondria. G1, G1 subunit in GTPSCS; Pi, phosphate;
  PPi, pyrophosphate
