figure_title: scRNA-seq of primary human islets reveals unique transcriptional responses
  to CVB3 and poly(I:C) treatment
caption: '(A) Workflow schematic for scRNA-seq data generation from cadaveric islets
  (n = 4).(B) Real-time qPCR of viral genome expression confirming whole-islet infection
  (n = 9; patient 01, triangle; patient 02; square, patient 03, circle). Error bars
  represent SEM.(C) Uniform manifold approximation and projection (UMAP) of cell populations
  identified from scRNA-seq data integration.(D) Heatmap of genetic marker expression
  per cluster.(E–H) Volcano plots showing whole-islet gene expression differences:
  (E) control vs. CVB3 24 h (total variables = 1,284), (F) control vs. poly(I:C) 24
  h (total variables = 69), (G) control vs. CVB3 48 h (total variables = 651), (H)
  control vs. poly(I:C) 48 h (total variables = 237).(I) Venn diagrams comparing statistically
  significant DEGs in whole islets (treatment vs. control) for poly(I:C) or CVB3 at
  24 h and 48 h.(J) Progeny analysis of 14 major pathways, showing scaled pathway
  activity scores across conditions over time (negative values, decreased pathway
  activity; positive values, increased activity).(K) Heatmap depicting marker expression
  differences across conditions over time; ***ordinary one-way ANOVA with Tukey’s
  multiple comparisons; non-significant (ns) p > 0.05, ****p < 0.0001. DEG statistical
  significance: Wilcoxon rank-sum test with Bonferroni correction'
article_title: Coxsackievirus B infection invokes unique cell-type-specific responses
  in primary human pancreatic islets
