caption: A schematic view of the flavonoid biosynthesis pathway. The flavonoid biosynthesis
  pathway was revised from the flavonoid biosynthesis pathway of KEGG. Rectangles
  represent metabolites. Yellow and red rectangles represent metabolites that are
  more abundant in Ype and Rpe, respectively. Ovals represent enzymes (genes) in the
  biosynthesis pathway. The expression levels of the genes and the abundances of metabolites
  in Ype, Mpe, and Rpe were shown beside them. The source data are available in Table
