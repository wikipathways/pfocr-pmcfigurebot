figure_title: AnxA5 inhibited TGF-β/Smad2 signaling pathway.
caption: AnxA5 inhibited TGF-β/Smad2 signaling pathway. (A) The protein expression
  of p-Smad2, p-Smad3, and Smad2/3 was detected in HFBs co-cultured with AnxA5 for
  1 h. Quantitative analysis of p-Smad2 and p-Smad3 protein levels relative to Smad2/3.
  (B) Representative images of immunofluorescence anti-p-Smad2 staining performed
  in HFBs co-cultured with AnxA5 for 1 h. Quantitative analysis of fluorescence intensity
  of anti-p-Smad2. Data are presented as mean ± SEM. Statistical analyses were performed
  by comparing to the TGF-β + 0 group, where * p < 0.05, ** p < 0.01, *** p < 0.001,
  **** p < 0.0001
