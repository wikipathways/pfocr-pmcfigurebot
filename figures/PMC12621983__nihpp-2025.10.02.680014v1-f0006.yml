figure_title: XJ-4–85 destabilizes cancer cell glycolysis and signaling
caption: (A) KEGG pathway analysis of untargeted LC-MS/MS metabolomics profiling showing
  metabolic pathways significantly enriched following the treatment of XJ-4–85 (5
  μM, 2h) in B16-F10-Luc2 cells. Size of circles denotes the number of metabolites
  in each respective category. Coloring of circles shows the degree of significance
  in changes from XJ-4–85 treatments (enrichment P values). (B) Alterations in glycolysis-related
  metabolites following XJ-4–85 treatment in B16-F10-Luc2 cells. Data are shown as
  mean ± SEM, n = 3 biological replicates. (C) Waterfall plot showing protein abundance
  changes in B16-F1-Luc2 cells treated with XJ-4–85 (5 μM, 2 h) relative to DMSO vehicle,
  n = 3 biologically independent replicates. (D) Volcano plot showing phosphorylated
  sites that were significantly up- or down-regulated in B16-F10-Luc2 cells treated
  with XJ-4–85 (5 μM, 2 h) relative to DMSO vehicle, n = 3 biologically independent
  replicates. Phosphorylation sites with a P value of ≤ 0.05 and |Log2(fold change)|
  ≥ 0.5 relative to DMSO vehicle treatment are highlighted in color. Associated datasets
  are provided in Table S4
