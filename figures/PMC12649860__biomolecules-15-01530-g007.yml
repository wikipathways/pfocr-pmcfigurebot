figure_title: Schematic overview of viral entry and furin-mediated processing of viral
  proteins in the trans-Golgi network (TGN).
caption: 'Schematic overview of viral entry and furin-mediated processing of viral
  proteins in the trans-Golgi network (TGN). The diagram depicts the cis- and trans-Golgi
  compartments, emphasizing the localization of furin within the TGN, where it cleaves
  viral precursor proteins at specific basic motifs. Representative viruses utilizing
  this pathway include: HIV (gp160 → gp120/gp41), measles virus (F0 → F1/F2), human
  papillomavirus (HPV L2 protein), influenza virus (hemagglutinin HA0 → HA1/HA2),
  and herpesviruses [glycoprotein B (gB) precursor]. These proteolytic events, occurring
  during transit through the TGN, are essential for viral maturation, membrane fusion
  capacity, and infectivity, Furin (PDB: 5JXG)'
