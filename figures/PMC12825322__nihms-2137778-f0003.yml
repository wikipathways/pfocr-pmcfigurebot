figure_title: Epigenetic modifications participate in the regulation of PNDs.
caption: Epigenetic modifications participate in the regulation of PNDs. Anesthesia/surgery
  promotes the recruitment of DNMT and MECP2, promoting DNA methylation and inhibiting
  the expression of neurodevelopmental factors, synaptic proteins, and neurotransmitter
  receptors. HATs mediate acetylation of NF-κB, Tau, and HMGB1, exacerbating neural
  damage, and HDACs mediate deacetylation of BDNF and EPHB2, promoting neurocognitive
  disorders. HSP90 deacetylation promotes binding to NLRP3 and enhances NLRP3 protein
  stability and resistance to proteolysis. Surgery induces microtubule disintegration
  and tau phosphorylation, and the ectopic distribution of free p-tau exacerbates
  neuronal damage. Overexpression of smad7 inhibits smad2/3 phosphorylation and hinders
  the anti-inflammatory effect of the downstream TGF-β/TGF-βR signaling pathway. CXCL13/CXCR5
  signaling activation promotes ERK/JNK phosphorylation, exacerbating neuroinflammation
  and cell apoptosis
