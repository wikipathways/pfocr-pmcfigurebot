figure_title: Glutathione metabolism pathway in rice seeds after sprouting treatment.
caption: 'Glutathione metabolism pathway in rice seeds after sprouting treatment.
  Heatmap shows the expression of DEGs under different sprouting durations. Gene expression
  is presented as Z-score. The abbreviated enzymes are defined as follows: GGCT, γ-glutamyl
  cyclotransferase; OPLAH, 5-oxoprolinase; PepA, probable aminopeptidase P; GGT, γ-glutamyltransferase;
  GSS, glutathione synthetase; GR, glutathione reductase; IDH, isocitrate dehydrogenase;
  G6PD, glucose-6-phosphate 1-dehydrogenase; GPX, glutathione peroxidase; ORDX6, oxidoreductase
  6; DHAR, dehydroascorbate reductase; GST, glutathione S-transferase; RRM1, ribonucleoside-diphosphate
  reductase large subunit; APX, ascorbate peroxidase. The glutathione metabolism pathway
  is presented based on the KEGG reference map (map00480), following the style of
  Zhang et al. [23]. The heatmap displaying gene expression Z-scores is original data
  from this study'
