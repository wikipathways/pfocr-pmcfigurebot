figure_title: Increased mitochondrial pyruvate transport rewires metabolism and redox
  status to reduce protein synthesis and cell size in rat primary hepatocytes
caption: a. Western blot analysis of MPC overexpression in cultured rat primary hepatocytes.b.
  Representative confocal images of rat primary hepatocytes expressing exogenous GFP
  or MPC. DIC images and DAPI staining of nuclei are also shown. Cell boundaries are
  marked with dotted lines. The scale bar represents 20 μm.c. Quantification of the
  areas of GFP and MPC expressing primary hepatocytes. Data is presented as mean ±
  s.d. of six biological replicates, with 20 hepatocytes analyzed for GFP and MPC+.d.
  Fluorescence intensity of puromycin-labeled nascent proteins in GFP and MPC+ primary
  hepatocytes. Data is presented as mean ± s.d. of six biological replicates, with
  20 hepatocytes analyzed for each condition.e. Quantification of glucose in the culture
  media of primary hepatocytes transfected with GFP or MPC constructs, conditioned
  with 20 mM lactate and 2 mM pyruvate for four hours. 10 μM UK5099 was used to inhibit
  MPC’s downstream impact on gluconeogenesis. Data is presented as mean ± s.d. of
  3 biological replicates.f. NADH/NAD+ ratios in the cytoplasmic and mitochondrial
  fractions of GFP or MPC+ primary hepatocytes. Data is presented as mean ± s.d. of
  three biological replicates.g. Schematics illustrating the metabolic consequences
  of excess mitochondrial pyruvate in hepatocytes. Under normal conditions, mitochondrial
  pyruvate fuels the TCA cycle, maintaining redox balance and generating sufficient
  amino acids for cellular homeostasis. However, when mitochondrial pyruvate transport
  is increased and excess pyruvate is metabolized, both mitochondrial and cytoplasmic
  redox states are altered. This excess pyruvate enhances the activities of pyruvate
  carboxylase (PC), pyruvate dehydrogenase (PDH), and the TCA cycle, leading to an
  elevated NADH/NAD+ ratio. The oxaloacetate produced by PC is converted into phosphoenolpyruvate
  via PEPCK2, promoting gluconeogenesis. This shift reduces the availability of aspartate
  and related amino acids necessary for protein synthesis, ultimately resulting in
  a reduction in cell size without impacting the canonical cell growth signaling pathways
article_title: The fate of pyruvate dictates cell growth by modulating cellular redox
  potential
