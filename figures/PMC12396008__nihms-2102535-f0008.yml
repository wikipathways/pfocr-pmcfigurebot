figure_title: Role of the NF-κB, p38, and ERK1/2 intracellular signaling pathways
  in mediating the effects of IL-1β on PACs mitochondrial TPP uptake process
caption: 'PAC 266–6 cells were pretreated with specific pathway inhibitors as described
  in “Methods”. Mitochondrial TPP uptake was assessed following treatment with celastrol
  (NF-κB pathway inhibitor) (A), SB203580 (p38 pathway inhibitor) (B), and PD98059
  (ERK1/2 pathway inhibitor) (C). Data represent the means ± SE from four independent
  experiments. Statistical analysis was evaluated using one-way ANOVA (Dunnett’s post
  hoc test) in GraphPad Prism software. **P < 0.01; NS: no significant'
article_title: 'Effect of IL-1β on pancreatic acinar cells mitochondrial TPP carrier-mediated
  uptake: Inhibition mediated via the intracellular NF-κB signaling pathway'
