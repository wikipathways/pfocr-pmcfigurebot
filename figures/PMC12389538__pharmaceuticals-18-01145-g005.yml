figure_title: The anti-tumor effect induced by menadione in colorectal cancer cells
  was mediated through MAPK8.
caption: The anti-tumor effect induced by menadione in colorectal cancer cells was
  mediated through MAPK8. (A) Number of up/down-regulated DEGs in pathways of apoptosis,
  necroptosis, and autophagy after menadione treatment. (B) Venn diagram of DEGs in
  pathways of apoptosis, necroptosis, and autophagy after menadione treatment. (C)
  Core hub genes of menadione groups. Cytohubba was used to predict hub genes of 47
  DEGs. The MCC algorithm was applied, and top 10 hub genes were displayed. (D) PPI
  network of DEGs after menadione treatment, visualized by Cytoscape. The nodes in
  red represent up-regulated DEGs after menadione treatment, and nodes in blue indicate
  down-regulated DEGs. The node size represents the extent of the gene’s interaction
  with other genes, with larger nodes indicating a greater number of interacting genes.
  The edge thickness represents the combined score between two genes, with thicker
  lines indicating a higher score. The boxed region emphasizes MAPK8 as a core gene
  in the network. (E) Heatmap of DEGs among menadione and TSZ groups. The color of
  the heatmap squares represents gene expression level, with darker colors indicating
  a higher gene expression level. (F) GO and KEGG pathways involving the hub gene
  MAPK8. Node size and node color represent the number of enriched DEGs in each pathway,
  with larger sizes and darker colors indicating a higher number of DEGs. (G) PPI
  network of DEGs that participate in necroptosis, apoptosis, and autophagy pathways.
  The node color represents the pathways each gene participates in, and the edge indicates
  protein interaction between two genes
