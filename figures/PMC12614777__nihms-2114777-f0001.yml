figure_title: Overview of single-cell proteomics (SCarP) study on isolated cardiomyocytes
  from 4 wild-type hearts
caption: 'A) Schematic of SCarP strategy capturing the proteome heterogeneity of isolated
  cardiomyocytes. CellenONE was used for cell sorting (with photographs and dimensions
  collections) and for miniaturized sample preparation prior LC-MS analysis. HeLa
  digests were used for real-time monitoring. Trypsin digestion followed by data-independent
  acquisition on TimsTOF scp (MS) and data analysis with Spectronaut, allows the determination
  of cell clusters using t-SNE strategy. B) Cell lengths ranged from 35μm to 147μm
  (median: 66.57μm). C) Dynamic range covers 5 orders of magnitude. The median protein
  intensities (black dots) and observation rates (grey bars) represent the proteome
  coverage of SCarP dataset. Myosin heavy chains (Myh6, Myh7 and Myh7b) and light
  chains (Myl2 and Myl3) are amongst the highest intensities (red diamonds). D) Four
  cell clusters determined by proteome signatures included between 86 and 126 cells
  each. E) Heatmaps of protein intensity in 425 isolated cardiomyocytes (top) and
  the median values (bottom) in the four cell clusters, for cardiac markers (left)
  and calcium signaling proteins (right). Color code represents the relative intensity
  of a protein (dark green: highest, dark red: lowest, white: missing value, vertical
  dimension). F) Visualization of DAVID Enrichment results (≥10% of observations,
  FDR<5%), on a selection of 21 metabolism-related KEGG pathways in cell clusters
  and the combined data (“sudo tissue”). Bubble diameter: proportional to the fold
  enrichment; opacity: proportional to the percentage of proteins involved in the
  pathway from SCarP dataset'
article_title: 'SCarP: Proteome Heterogeneity Characterization of Primary Mouse Cardiomyocytes'
