figure_title: In situ validation of rH174 and rH146 nanoribbon assembly pathway
caption: (a) Time-lapse liquid AFM characterizations of rH174 nanoribbons after 8
  days of incubation. Yellow arrows demonstrate that short nanoribbons propagate as
  local clusters. Scale bar, 500 nm. (b) Time-lapse liquid AFM characterizations of
  rH146 nanoribbon assembly showing progressive aggregation and structural organization
  after 1 day of incubation. Light green dashed boxes highlight further connections
  of oligomeric aggregates, whilst blue and red arrows indicate the emergence of ordered
  nanoribbons from disordered aggregates. Scale bars, 500 nm. The AFM height (z) scale
  spans −2.0 to 7.0 nm for (a) and −1.5 to 5.5 nm for (b)
