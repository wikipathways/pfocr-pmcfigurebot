figure_title: Schematic representation of exosome-mediated transfer of tRNA-derived
  fragments (tRFs).
caption: Schematic representation of exosome-mediated transfer of tRNA-derived fragments
  (tRFs). The figure illustrates how a donor cell (bottom) packages and delivers molecular
  cargo (tRFs) to a target cell (top) via exosomes. The process begins in the cytoplasm
  of the donor cell, where tRFs and RBPs are located. This cargo is enclosed within
  vesicles inside a multivesicular body (MVB). Black arrows show the pathway direction.
  The MVB then fuses with the donor cell’s plasma membrane, releasing the vesicles
  into the extracellular space. These vesicles are now called exosomes. The exosomes,
  containing the tRFs and RBPs, travel toward and are taken up by a nearby target
  cell. Inside the target cell, the exosomes release their contents into the cytoplasm,
  delivering the molecular cargo from the donor cell, which can influence cellular
  processes such as gene regulation, signaling, and homeostasis
