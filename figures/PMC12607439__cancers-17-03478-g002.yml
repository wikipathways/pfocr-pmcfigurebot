figure_title: The role of Porphyromonas gingivalis in the initiation and progression
  of oral cancer, including pathogen-induced intracellular signalling pathways.
caption: The role of Porphyromonas gingivalis in the initiation and progression of
  oral cancer, including pathogen-induced intracellular signalling pathways. The colonization
  by P. gingivalis induces epithelial-to-mesenchymal transition (EMT) with its virulence
  factors, i.e., fimbiare (FimA) and Arg- and Lys-gingipains (HRgpA and RgpB). The
  invasiveness of P. gingivalis-infected OSCC cells was characterized by the higher
  production of matrix metalloproteinases MMP-1, -2, -7,-9, and -10, which was stimulated
  by the release of IL-6 and IL-8, ERK1/2, p38, and Hsp27. The oral cells exhibited
  higher levels of cytokines TGF-β1, TNF-α, and EGF, as well as reduced integrity
  of the cultured epithelial layer. In addition, the TLR2 and TLR4 receptors in OSCC
  also demonstrated altered expression and functionality. The cells infected with
  P. gingivalis underwent neoplastic transformation following an increase in the expression
  of p-GSK3β and the EMT-related transcription factors Slug, Snail, ZEB1, Twist, and
  vimentin. The activity of GSK3β led to increased PI3K/Akt pathway activation, and
  subsequent upregulation of transcription factors. These intracellular changes facilitate
  the loss of E-cadherin expression and nucleocytoplasmic accumulation of β-catenin.
  P. gingivalis infection affected the activity of signalling cascade ERK1/2-ETS1,
  p38/HSP27, and protease activated receptor PAR2 and transcription nuclear factor
  NF-κB
