figure_title: Metabolomic profiling of AAV-GFP and AAV-PERM1 hearts subjected to Sham
  or TAC
caption: A–C, Metabolomic profiles of AAV-GFP Sham and AAV-GFP TAC hearts. The principal
  component analysis (PCA) plot shows a distinct separation between TAC and Sham groups,
  indicating altered metabolomic profiles in response to TAC (A, p<0.05). Pathway
  analysis (B) and enrichment analysis (C) highlight specific metabolic pathways affected
  by TAC. D–E, Comparison of AAV-PERM1 Sham and AAV-PERM1 TAC hearts. The PCA plot
  shows no significant separation between the two groups (D, p>0.05), suggesting that
  AAV-PERM1 preserves a metabolomic profile in TAC hearts comparable to Sham. F–H,
  Comparison of AAV-GFP TAC and AAV-PERM1 TAC hearts. A distinct separation in metabolomic
  profiles is observed (F). TAC-induced accumulation of TCA cycle intermediates (malate,
  fumarate, succinate) and spermidine is attenuated in AAV-PERM1 hearts (G–H)
