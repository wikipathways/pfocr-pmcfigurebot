figure_title: PKA-dependent HFS-LTP requires intracellular S845 phosphorylation
caption: 'Field EPSPs (fEPSPs) were recorded from acute hippocampal slices from wild-type
  (WT) and S845A KI mice before and after a single 100-Hz, 1-s tetanus at time point
  0. Plots show the time courses of the initial slopes. Drug application, if indicated,
  started 10 min prior to tetanus and terminated with tetanus. Top left insets: sample
  traces of fEPSP recordings 5 min prior to tetanus (black lines) and 40 min post-tetanus
  (gray lines). Right insets: bar graphs of potentiation of fEPSPs 40–45 min after
  tetanus. Shown are means ± SEM. The exact values of the level of fEPSP after potentiation
  are given inside bars. Paired t test was used to determine significant differences
  of fEPSP slope averages from 5 to 0 min prior to tetanus and 40–45 min post-PTT
  (#p < 0.05 and ###p < 0.001).(A) HFS-LTP was strongly blunted in S845A KI versus
  WT mice (****p < 0.0001, t test).(B) The membrane-permeant β2AR-selective antagonist
  ICI118551 (100 nM) but not the membrane-impermeant, general βAR antagonist sotalol
  (100 μM) blocked induction of HFS-LTP (*p < 0.05 and **p < 0.01; one-way ANOVA followed
  by Dunnett’s multiple comparisons test).(C) D22 (100 nM) blocked induction of HFS-LTP
  but did not affect baseline control responses, which were recorded in parallel,
  alternating with potentiated pathway in a two-pathway configuration, over the full
  time period (*p < 0.05 and **p < 0.01; one-way ANOVA followed by Dunnett’s multiple
  comparisons test)'
