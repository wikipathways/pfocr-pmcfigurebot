figure_title: Genomic landscape according to gross types.
caption: 'Genomic landscape according to gross types. (A) Frequency of genomic alterations
  of 20 key genes in patients with advanced HCC, including non-synonymous mutations
  and copy number variations, ranked by their prevalence. (B) Pathway-level representation
  of genomic alterations across different gross types. The diagram illustrates the
  proportion of samples harboring alterations in key oncogenic pathways: p53–RB, RTK–RAS–PI3K,
  telomerase, WNT, and chromatin modifiers. Each gene is annotated with four percentages
  corresponding to the frequency of activation (red) or inactivation (blue) across
  the gross types of advanced HCC. HCC, hepatocellular carcinoma'
article_title: Integrative multi-omics profiling identifies infiltrative hepatocellular
  carcinoma as an immunotherapy-resistant subtype with distinct molecular features
