figure_title: BAC-STAU1 mouse spinal cord transcriptomes
caption: Two independent RNA-seq experiments were performed using 25 wk old and 57
  wk old BAC-STAU1 mice. A) 30 and 44 DEGs were identified (FDR=10), including 22
  up- and 8 downregulated DEGs in the 25 wk group, and 31 up- and 13 downregulated
  DEGs in the 57 wk group. Three DEGs upregulated in both are marked by an asterisk.
  B) Volcano plots showing distribution of up- and downregulated DEGs showing Smg5
  as the most upregulated DEG in both experiments. C) Hallmark and KEGG pathway analyses
  showing an increased number of significant annotated pathways in the 57 wk group,
  and VENN diagrams indicating the numbers of shared pathways between the 25 and 57
  wk groups
article_title: A human Staufen1 BAC transgenic mouse exhibits abnormal autophagy and
