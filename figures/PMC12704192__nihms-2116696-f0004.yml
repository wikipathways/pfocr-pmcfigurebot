caption: Transport across the skin can take place via two pathways- transepidermal
  (which is further divided into paracellular and transcellular) and transappendageal
  (further subdivided into delivery via hair follicles or sweat glands). Follicular
  melanocytes can be targeted via the transappendageal pathway whereas epidermal or
  dermal melanocytes must be targeted via transcellular or paracellular routes
