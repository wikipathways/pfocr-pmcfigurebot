figure_title: Estrogen receptor-mediated genomic and non-genomic signaling pathways.
caption: 'Estrogen receptor-mediated genomic and non-genomic signaling pathways. The
  mechanism by which estrogen regulates intracellular signal transduction and gene
  expression through different receptor pathways. It is broadly divided into three
  signaling pathways: the genomic classical pathway, the genomic non-classical pathway,
  and the non-genomic pathway. a. Genomic Classical Pathway (Yellow arrows): Estrogen
  binds to ERα or ERβ within the cell nucleus, forming a homodimer or heterodimer,
  which then binds to ERE (Estrogen Response Elements) on DNA, activating gene transcription.
  b. Genomic Non-Classical Pathway (Red arrows): After estrogen binds to ERα or ERβ,
  the receptors can interact with other transcription factors (TFs), influencing gene
  expression without direct dependence on ERE binding. c. Non-Genomic Pathway (Green
  arrows): Estrogen activates downstream signaling pathways such as MAPK, PI3K, NF-κB,
  TGF-β1, cAMP, and Ca²⁺ through GPER on the cell membrane, facilitating rapid cellular
  signaling. Additionally, ERα and ERβ are also involved in non-genomic signaling
  pathways, indirectly affecting gene expression through phosphorylation and protein
  interactions'
