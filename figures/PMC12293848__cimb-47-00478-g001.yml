figure_title: IGFBP2 is downregulated in the preeclamptic placenta, and the EMT pathway
  is inhibited in the preeclamptic placenta.
caption: IGFBP2 is downregulated in the preeclamptic placenta, and the EMT pathway
  is inhibited in the preeclamptic placenta. (A) A Western blot analysis was used
  to determine the IGFBP2 protein level and EMT-related protein regarding E-cadherin,
  N-cadherin, and Vimentin in preeclamptic or normal pregnancy placentae (n = 20).
  (B) An RT-PCR analysis was used to determine IGFBP2 mRNA levels in preeclamptic
  or normal pregnancy placentae (n = 20). (C) A Western blot analysis was used to
  determine the EMT-related protein regarding E-cadherin, N-cadherin, and Vimentin
  in preeclamptic or normal pregnancy placentae (n = 20). (D) An RT-PCR analysis of
  EMT-related genes about E-cadherin, N-cadherin, and Vimentin mRNA level in preeclamptic
  or normal pregnancy placentae (n = 20). PE represents the patients with preeclampsia
  pregnancies. NC represents individuals with normal pregnancies. The data is expressed
  as mean ± SD. * indicates p < 0.05, ** indicates p < 0.01, **** indicates p < 0.0001
