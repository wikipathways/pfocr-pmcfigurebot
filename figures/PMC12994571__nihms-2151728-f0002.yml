figure_title: OMR rate is attenuated during tachycardia
caption: (A) Schematic cartoon of experimental rig for recording tail and heart activity
  moving gratings (optometer response [OMR]) and salt-pulses via the odor delivery
  pencil.(B) Example data collected from the tail (blue) during threat versus during
  OMR trials. During salt pulses, the fish tail responds with more rigorous (high
  cumulative tail angle) swims, aka “struggles,” compared to the routine swims during
  the OMR trials. Inset from OMR trial shows tail deflections during the swim.(C)
  Sample experiment where heart-rate is recorded (red) while observing the fish’s
  tail (blue) respond (solid lines) or not (dashed lines) to optomotor trials interspersed
  with salt pulses (orange).(D) Probability of detecting a swim during an OMR trial
  as a function of time since the most recent salt pulse (n = 17, p = 0.0004, paired
  t test). Error bars are SEM.(E) Probability to respond to OMR during an 8-s whole-field
  motion trial as a function of heart rate immediately preceding the trial. Light
  gray lines indicate individual fish (n = 17). Error bars are SEM.(F) Among trials
  where the fish swims, response time or latency is plotted as a function of heart
  rate. Light gray lines indicate individual fish (n = 17). Error bars are SEM.(G)
  Schematic illustrating two alternative neural pathways, a central pathway or an
  interoceptive pathway that could synchronize tachycardia and OMR suppression
