figure_title: The cellular processes mediated by HSP27, HSP70, and HSP90 proteins
  in carcinoma.
caption: 'The cellular processes mediated by HSP27, HSP70, and HSP90 proteins in carcinoma.
  (A) Inhibition of apoptosis: HSP27 inhibits apoptosis by interacting with AKT, activating
  NF-κβ, blocking Bax, cytochrome c, caspase-3, caspase-9, and suppressing FAS, TNF,
  and TRAIL receptors. HSP70 blocks apoptosis by the activation of the STAT3, BCL-2,
  and PI3K/AKT/mTOR pathways and suppression of the p38/MAPK pathway, Bax, AIF-1,
  ASK1, APAF-1 proteins, caspase-3, caspase-9, and Apo-2L/TRAIL. HSP90 inhibits apoptosis
  by the activation of the PI3K/AKT/mTOR pathway, NF-қβ, survivin, BCL-2 and the suppression
  of cytochrome c, Bax, XIAP, p53, caspase-3, caspase-8, FAS, and TNF receptors. (B)
  Epithelial–mesenchymal transition (EMT): HSP27 mediates EMT by the activation of
  EGF/β-catenin, β-catenin/MMP-3, β-catenin/Slug, NF-κβ, AKT, STAT3, and Twist and
  the decrease in E-cadherin expression. HSP70 regulates EMT by the activation of
  MAPK, MMP-2, pSTAT3, N-cadherin, vimentin and downregulation of E-cadherin. HSP90
  controls EMT by the activation of the p38/MAPK and PI3K/AKT/mTOR signaling pathways,
  TNFα, NF-қβ, vimentin, and the inhibition of WNT/β-catenin pathways, and E-cadherin
  expression. (C) Tumor progression/metastasis: HSP27 promotes tumor progression and
  the formation of metastasis by the activation of NF-қβ, c-Myc, MMP-2, and MMP-9
  and the downregulation of the p53 protein. HSP70 influences tumor progression and
  formation of metastasis by the activation of RHOA, WNT/β-catenin pathway, STAT3,
  and MMP-2 and the downregulation of p53 expression. HSP90 effects tumor progression
  and formation of metastasis by the activation of the RAS/RAF/ERK, PI3K/AKT/mTOR,
  and MAPK signaling pathways, MMP-2, MMP-9, and telomerase upregulation. (D) Angiogenesis:
  HSP27 increases angiogenesis by the upregulation of VEGFR2, IL-8, NF-қβ, and HIF-1α.
  HSP70 promotes angiogenesis by the upregulation of HIF-1α/VEGF activity and IL-5
  secretion. HSP90 increases angiogenesis by the activation of HIF-1α, NF-қβ, AKT,
  VEGF/VEGFR signaling pathway and the upregulation of FLT3, IL-8, and EGFR2'
