caption: Transcriptome analysis of malignant cells based on the NS-associated signature.
  (a) UMAP plot showing the classification of malignant subtypes based on the NS-associated
  signature, with different colors representing different subtypes. (b) UMAP plot
  showing the distribution of sample types, with different colors representing different
  sample types. (c) The UMAP plot shows the NS-associated signature distribution;
  (A) the color depth represents the signature value, and (B) the violin plot shows
  the NS-associated signature in the malignant subtypes. (d) Representative CNV heat
  map with hierarchical clustering of results from inferCNV analysis in the malignant
  subtypes. (e) The violin plots and box plots show the CNV score in the malignant
  subtypes, with different colors representing different malignant subtypes. (f) The
  UMAP plot shows the CytoTrace-inferred score distribution; the color depth represents
  the signature value. (g) Heatmap showing the average activity of hallmark pathways
  in the malignant subtypes. (h) UMAP plot showing the distribution of G1, G2/M, and
  S phases, (A) with different colors representing cell cycle phases, and the proportion
  of the cell cycle phases in the malignant subtypes is shown in bar plots, (B) with
  different colors representing different cell cycle phases. (i) Differential expressing
  genes analysis between high- and low-NS subgroups. (j) Heatmap showing the enriched
  KEGG pathways in the malignant subtypes
