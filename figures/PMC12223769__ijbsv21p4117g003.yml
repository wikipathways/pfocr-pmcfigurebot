figure_title: MAPK pathway is regulated apelin-induced integrin expression and prostate
  cancer migration.
caption: 'MAPK pathway is regulated apelin-induced integrin expression and prostate
  cancer migration. (A&B) IPA pathway enrichment figure showing pathways that were
  changed in the GSE7930 dataset (Orange color indicated upregulated gene profile;
  blue color indicated downregulated gene profile). (C-H) Cells were treated with
  ERK (ERK II inhibitor; 10 μM), p38 (SB203580; 10 μM) and JNK (SP600125; 10 μM) inhibitors
  or transfected with ERK, p38 and JNK siRNA for 24 hours then with apelin, the wound
  healing, cell migration and integrin mRNA expression was examined (n=3). (I) PC3
  cells were stimulated with apelin and ERK, p38 and JNK phosphorylation was examined
  by Western blotting (n=3). * p < 0.05 compared with the control group. # p < 0.05
  compared with the apelin-treated group'
article_title: Apelin facilitates integrin αvβ3 production and enhances metastasis
  in prostate cancer by activating STAT3 and inhibiting miR-8070
