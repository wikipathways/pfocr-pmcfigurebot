figure_title: CmCPEB2 was regulated by the juvenile hormone pathway.
caption: CmCPEB2 was regulated by the juvenile hormone pathway. Transcriptional dynamics
  of CmKr-h1 (A) and CmHR3 (B) following hormonal treatment. Ethyl alcohol (ETH) was
  used as a control. (C) Transcription dynamics of CmCPEB2 in vitro hormonal-cultured
  ovaries. (D) The knockdown efficiency of CmKr-h1 was validated in ovarian tissue.
  (E) CmCPEB2 transcriptional response to CmKr-h1 knockdown. The 2−∆∆Ct method was
  adopted to calculate the relative expression level. Data are presented as mean ±
  standard deviation (SD). The asterisks indicate the significant differences (* p
  < 0.05, ** p < 0.01, *** p < 0.001, **** p < 0.0001)
