figure_title: BBEA inhibits mRNA expression levels of inflammatory cytokines and the
  protein expression contents of PI3K/AKT signaling pathway in RA.
caption: 'BBEA inhibits mRNA expression levels of inflammatory cytokines and the protein
  expression contents of PI3K/AKT signaling pathway in RA. mRNA expression of (A)
  IL-6, (B) TNF-α, (C) IL-17, and (D) IL-1β genes identified by RT-qPCR in the synovial
  tissue of rat ankle joints. mRNA expression of (E) IL-6, (F) TNF-α, (G) IL-17, and
  (H) IL-1β genes identified by RT-qPCR in LPS-induced RAW264.7 cells. (I–K) Western
  blotting was used to detect the protein bands and quantitative densitometric analysis
  of proteins in the synovial tissue of rat ankle joints. (L–N) Western blotting was
  used to detect the protein bands and quantitative densitometric analysis of proteins
  in LPS-induced RAW264.7 cells. Data are presented as mean ± SD (n = 3). Symbols
  #, ##, ###, ####, *, **, ***, **** indicate p < 0.05, p < 0.01, p < 0.001, and p
  < 0.0001 compared with the normal group and the CIA group, respectively'
