caption: Workflow and transcriptomic profiling of CYP genes in HCC. Overall workflow
  of the study. CYP gene family members (n = 57) were defined based on HGNC annotation.
  Data were collected from multiple sources, including GepLiver and TCGA, followed
  by transcriptomic analysis to identify differentially expressed genes, validation
  using external resources (HPA, scRNA-seq, spatial transcriptomics), and functional
  characterization through pathway and immune analyses
