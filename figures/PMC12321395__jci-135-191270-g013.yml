figure_title: Model of distinct neural circuits that drive pain hypersensitivity and
  comorbid depressive-like behaviors in mice
caption: Nerve injury produced activation of AM glutamatergic neurons projecting to
  the mNAcSh D2 neurons, which selectively inhibited LHA orexinergic neurons and induced
  pain hypersensitivity. GABAergic neurons input from the LS to D2 neurons within
  the mNAcSh, which disinhibit VP glutamatergic neurons by inhibiting somatostatin-expressing
  interneurons. Notably, this identified pathway is specifically involved in the comorbid
  depressive-like behaviors in mice with chronic pain. Created with BioRender.com
article_title: Distinct nucleus accumbens neural pathways underlie separate behavioral
  features of chronic pain and comorbid depression
