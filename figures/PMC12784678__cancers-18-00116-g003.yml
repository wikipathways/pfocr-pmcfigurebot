caption: Gene Ontology (GO), KEGG, and Reactome enrichment analyses of the differential
  genes in THP1 cells contacted with MDA-MB-231 directly (A) or via MDA-MB-231 pre-conditioned
  media indirect THP1 contact. (B) In the results of the GO enrichment analysis, the
  most significant 30 terms were selected for display. KEGG pathways with padj < 0.05
  indicate significant enrichment. The most significant 20 Reactome pathways were
  selected for display. In the figure, the abscissa is the ratio of the number of
  differential genes linked with the Reactome pathway to the total number of differential
  genes, and the ordinate is Reactome pathway. The size of a point represents the
  number of genes annotated to a specific Reactome pathway, and the colors from red
  to purple represent the significant size of the enrichment. When the results were
  less than 30, all terms were drawn, as shown in the following figure. In this figure,
  the abscissa is the GO term. The ordinate is the significance level of GO term enrichment.
  Higher values correspond to higher significance
