figure_title: LILRB4 enhances immunosuppressive activity of MDSCs
caption: a, T cell proliferation in BM-MDSC–T cell coculture assay. Carboxyfluorescein
  succinimidyl ester (CFSE)-labeled CD3+ T cells were cocultured with WT or LILRB4+
  BM-MDSCs in 96-well plates coated with BSA or SCG2 (10 μg ml−1). The positive control
  (PC) indicated only T cells with anti-CD3/CD28 beads (n = 3 biological replicates).
  T cell proliferation was analyzed by flow cytometry (same as below). b, T cell proliferation
  in BM-MDSC–T cell coculture assays treated with anti-LILRB4 or isotype control (n
  = 3 biological replicates). c, T cell proliferation in splenic MDSC–T cell coculture
  assays. Splenic MDSCs (5 × 104) from MC38-Vec or MC38-SCG2 tumor-bearing LILRB4-Tg
  mice were cocultured with CFSE-labeled CD3+ T cells (either 2.5 × 105 (1:5) or 5×
  105 (1:10)) for 2.5–3 days (n = 3 biological replicates); NC, negative control.
  d, T cell proliferation in splenic MDSC–T cell coculture assays. Splenic MDSCs (5
  × 104) from MC38 tumor-bearing LILRB4-Tg or LILRB4-Tg Scg2−/− mice were cocultured
  with CFSE-labeled CD3+ T cells (either 2.5 × 105 (1:5) or 5 × 105 (1:10)) for 2.5–3
  days (n = 3 biological replicates). e, IFNγ production in the coculture supernatant
  from d, measured by ELISA (n = 3 biological replicates). f, Volcano plot showing
  differentially expressed genes in M-MDSCs isolated from MC38 tumors in WT or LILRB4-Tg
  mice, based on RNA sequencing of M-MDSCs sorted by FACS. g,h, KEGG (g) and GO (h)
  pathway enrichment analysis of differentially expressed genes in M-MDSCs from LILRB4-Tg
  versus WT tumor-bearing mice; TH17, IL-17-producing helper T cells; TH1, type 1
  helper T cells; TH2, type 2 helper T cells. i, GSEA of the JAK–STAT signaling pathway
  comparing M-MDSCs from WT and LILRB4-Tg mice; NES, normalized enrichment score.
  j, Relative mRNA expression levels of the indicated genes in M-MDSCs from WT, LILRB4-Tg
  or LILRB4-Tg Scg2−/− MC38 tumor-bearing mice (n = 8 or 9 biological replicates).
  k, Flow cytometry analysis of p-STAT3 levels in M-MDSCs from both tumors and spleens
  of MC38-Vec or MC38-SCG2 tumor-bearing LILRB4-Tg mice (n = 6 biological replicates).
  Data are presented as mean ± s.d. P values were determined by one-way ANOVA with
  Holm–Sidak’s multiple comparisons test (a–e and j), Wald’s test (f) or two-tailed
  unpaired Student’s t-test (k); MFI, mean fluorescence intensity
