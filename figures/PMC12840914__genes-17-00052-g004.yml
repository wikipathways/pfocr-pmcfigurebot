figure_title: Passive and active mechanisms for PEVs to traverse the walls of plant
  cells.
caption: 'Passive and active mechanisms for PEVs to traverse the walls of plant cells.
  (A) Passive mechanism 1: The inherent dynamic and viscoelastic properties of plant
  cell walls allow for transient rearrangements of structural components (i.e., cellulose
  microfibrils, glycans, pectin polysaccharides, and lignin) to facilitate PEV extracellular
  release. (B) Passive mechanism 2: Structural properties of the PEV itself may be
  modified to transform the spherical or cupular shape of a PEV into an elongated
  tubular structure to allow the PEV to passage through narrow pores of the plant
  cell wall. (C) Active mechanism 1: Cell-wall-modifying enzymes are released across
  the plasma membrane along with the PEVs which could locally modify cell wall composition
  to facilitate the construction of a transient pathway for PEVs to exist plant cells.
  (D) Active mechanism 2: PEVs themselves may harbour (internally) or express (external
  surface) the cell-wall-modifying enzymes required to reduce the integrity of the
  cell wall to allow for the PEV to traverse the walls which surround plant cells
  for their extracellular release'
