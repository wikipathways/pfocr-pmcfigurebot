figure_title: Anti-TNF decreases TH1-associated cell states, but TH17-associated cytokine
  expression is persistent in post-treatment cCD partial responders
caption: 'a, Violin plot of TNF pathway scores in all cell groups. Cells were scored
  using decoupler multivariate linear model. PROGENy “TNFa” pathway genes and weights
  were used as input, filtered to genes with p-value < 1e-10 (225 genes). b, Pre-
  and post-treatment TNF scores in cCD, excluding cCD participants who did not receive
  anti-TNF. FGID and pre-treatment iCD included as reference. Biopsies used had ≥
  10 cells in each cell type (Myeloid: FGID, n = 22; iCD, n = 7; Pre-Tx cCD, n = 24;
  Post-Tx cCD, n = 9. TNKILC: FGID, n = 23; iCD, n = 7; Pre-Tx cCD, n = 25; Post-Tx
  cCD, n = 9). c, UMAP of TNF pathway score for myeloid (top) and TNKILC (bottom)
  cell groups among pre-treatment (left) and post-treatment (right) cCD biopsies.
  d, Differential expression analysis among myeloid cells and TNKILCs, comparing pre-treatment
  and post-treatment cCD (Pre-tx, n = 25; Post-tx, n = 9). Pseudobulk differential
  expression calculated with DESeq2. Genes labeled if adjusted p-value ≤ 0.01. e,
  Enriched terms from gene set enrichment analysis of differential expression between
  pre- and post-treatment cCD patients. Gene ranks computed using DESeq2 Wald test
  “stat” value (log2FC/SE(log2FC)). Ranked genes were tested using Reactome 2023 v2
  gene sets with 15 ≤ number of genes ≤ 100 and sorted for normalized enrichment score.
  Terms enriched in pre-treatment cCD with the 5 lowest adjusted p-values are shown.
  f, Changes in cell frequencies among TH1-associated cell states, as well as MNP
  and TH17 cell states (FGID, n = 23; iCD, n = 7; Pre-Tx cCD, n = 24 for stromal and
  myeloid cell states, n = 25 for TNKILC cell states; Post-cCD, n = 9). g-j, pre-
  and post-treatment cell frequency of inflammatory macrophages (g), TH1 cells (h),
  mononuclear phagocytes (i), and TH17 cells (j), relative to their respective cell
  type, among cCD full responder and partial responder biopsies with at least 10 cells
  in relevant cell type (cCD FR Pre, n = 15; cCD FR Post, n = 6; cCD PR Pre, n = 9
  for Myeloid, n = 10 for TNKILC; cCD PR Post, n = 3). k, Mean module score of canonical
  TH1 and TH17 cytokine gene expression (module input genes: IFNG, TNF, IL17A, IL17F,
  IL21, IL22, IL26), grouped into timepoint and response categories for cCD biopsies
  with at least 10 TH cells (cCD FR Pre-Tx, n = 15; cCD FR Post-Tx, n = 5; cCD PR
  Pre-Tx, n = 9; cCD PR Post-Tx, n = 2). l, Mean log-normalized expression of genes
  used as input for module score in (k) among TH cell subtype, grouped into timepoint
  and response categories for cCD biopsies with at least 10 TH cells. All error bars
  denote standard error of the mean. Mann-Whitney U test, two-tailed, used for pairwise
  comparisons. Lines connect pre- and post-treatment biopsies from the same study
  participant'
