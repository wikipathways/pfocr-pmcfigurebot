figure_title: Schematic cross-sections of uterine arteries illustrating reactive oxygen
  species (ROS) generation and its impact on vascular remodeling during pregnancy.
caption: 'Schematic cross-sections of uterine arteries illustrating reactive oxygen
  species (ROS) generation and its impact on vascular remodeling during pregnancy.
  Left panel: Physiological pregnancy: Moderate ROS production originating from mitochondrial
  respiration, NADPH oxidases, and xanthine oxidase activates redox-sensitive transcription
  factors (NF-κB, Nrf2, HIF-1α). These, in turn, upregulate pro-angiogenic and matrix-remodeling
  mediators (VEGF, PlGF, MMPs), driving angiogenesis, extracellular-matrix reorganization,
  and vasodilation. The net result is outward hypertrophic remodeling, marked by a
  wider lumen without a change in wall thickness. Right panel: Pathological pregnancy
  (preeclampsia, IUGR): Chronic hypoxia, elevated angiotensin II (Ang II), and inflammatory
  cytokines induce mitochondrial dysfunction and excessive ROS accumulation. Via the
  miR-210–sFlt-1 signaling pathway, this oxidative stress triggers endothelial dysfunction
  and vascular injury, leading to inward eutrophic remodeling, characterized by a
  narrowed lumen and increased wall thickness. Hydrogen peroxide (H2O2); Hypoxia-Inducible
  Factor 1-alpha (HIF-1α); Matrix-metalloproteinase (MMP); MicroRNA-210 (miR-210);
  Mitochondria (); NADPH oxidase (NOX); Nuclear Factor Erythroid 2-Like 2 (NRF2);
  Nuclear factor-kappa B (NF-κB); Placental growth factor (PlGF); Superoxide (O2•−);
  Soluble fms-like tyrosine kinase-1 (sFlt-1); Vascular endothelial growth factor
  (VEGF); Xanthine oxidase (XO)'
