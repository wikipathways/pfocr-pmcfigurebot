figure_title: Analysis of Antigen Presentation and Inflammatory Responses in BMDCs
  Treated with MC3- and SM-102 sLNPs-OVA.
caption: Analysis of Antigen Presentation and Inflammatory Responses in BMDCs Treated
  with MC3- and SM-102 sLNPs-OVA. (A-D) Flow cytometry analysis of SIINFEKL-APC (A),
  CD80-FITC (B), CD86-PE (C), and MHC-II-APC-Cy7 (D) expression in BMDCs treated with
  PBS (G1), MC3 sLNPs-OVA (G2), SM-102 sLNPs-OVA (G3), or LPS (G4). (E-H) Quantitative
  analysis of MFI of H-2Kb bound to SIINFEKL (E), CD80 (F), CD86 (G), and MHC-II (H)
  in the respective groups (n = 3 independent biological samples). (I-J) Relative
  mRNA expression of IL-1β (I) and IL-6 (J) in the treated BMDCs (n = 3 independent
  biological samples). (K) Schematic diagram of the innate immune activation of LNPs-based
  mRNA vaccine through TLR4-NF-κB signaling pathway (Created in https://BioRender.com
  ). (L) Western blot analysis of TLR4, MyD88, p65, p-p65, IL-1β, IL-6, and β-actin
  in BMDCs treated with different formulations. (M-Q) Relative protein levels of TLR4
  (M), MyD88 (N), p-p65/p65 (O), IL-1β (P), and IL-6 (Q) in the respective groups
  (n = 3 independent biological samples). Statistical significance was determined
  by one-way ANOVA with Tukey' s multiple comparisons test for (E-J) and (M-Q)
