figure_title: Profiling metabolites and key enzyme activities in nitrogen and amino
  acid pathways of G.
caption: 'Profiling metabolites and key enzyme activities in nitrogen and amino acid
  pathways of G. uralensis in response to different nitrogen forms: modified Hoagland
  solution (control, CK); 0.25, 0.5, 1.25 mmol/L (15NH4)2SO4 (treatments N1, N2, N3);
  0.5, 1.0, 2.5 mmol/L K15NO3 (treatments X1, X2, X3). The uptake of NH4+ and NO3−
  into root cells is mediated by AMT and NRT transporters, respectively. While ammonium
  can be directly assimilated, nitrate is first reduced to ammonium by the sequential
  action of NR and NiR. Ammonium assimilation occurs primarily via the GS/GOGAT cycle,
  with GS incorporating NH4+ into Gln, while GDH provides a secondary pathway to Glu.
  The required α-ketoglutarate (KGA) is furnished by the TCA cycle—a central respiratory
  pathway that regenerates carbon skeletons through the sequential oxidation of citrate
  to KGA, succinate, fumarate, and malate. These nitrogen assimilation products are
  fundamental precursors for the synthesis of amino acids, proteins, and other growth-related
  metabolites. A color gradient (blue to red) represents the levels of key enzyme
  gene expression and metabolite abundance, with red indicating higher values normalized
  to the control group (set as 1). Note: glutamic acid (Glu), glutamine (Gln), aspartic
  acid (Asp) and asparagine (Asn)'
