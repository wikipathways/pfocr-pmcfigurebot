figure_title: Overview of One-Carbon Metabolism.
caption: 'Overview of One-Carbon Metabolism. One carbon metabolism, which includes
  the folate and methionine cycles, involves (1) reduction of folic acid by dihydrofolate
  reductase (DHFR) to dihydrofolate (DHF) and then to (2) tetrahydrofolate (THF).
  THF is a central molecule in this pathway, involved in the synthesis of (3) 5,10-methylene-THF,
  which is crucial for (4) deoxythymidylate (dTMP) synthesis (via thymidylate synthase,
  TS) and ultimately (5) DNA synthesis. 5,10-Methylene-THF also serves (6) as a one-carbon
  unit donor in de novo purine synthesis and is converted to (7) 5-methyl-THF by methylenetetrahydrofolate
  reductase (MTHFR). (8) Serine hydroxymethyltransferase 1 (SHMT1), assisted by vitamin
  B6, interconverts serine and glycine simultaneously, interconverting THF and 5,10-methylene-THF.
  (9) Methionine synthase (MS), aided by vitamin B12, regenerates methionine from
  homocysteine with the help of a methyl group donated by 5-methyl-THF that is simultaneously
  converted to THF. Methionine can be further converted to (10) S-adenosylmethionine
  (SAM), which is a universal methyl group donor in multiple biological processes
  including the (11) methylation of histones and cytosine residues in DNA. One-carbon
  metabolism enzymes are targets for chemotherapeutics: (12) methotrexate (MTX) inhibits
  DHFR, and (13) 5-fluorouracil (5-FU) inhibits TS. Red font: micronutrients. Created
  in BioRender. Arczewska, K. (2025) https://BioRender.com/0x2ez7c (accessed on 16
  June 2025)'
