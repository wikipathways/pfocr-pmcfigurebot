figure_title: Canonical Wnt signaling pathway.
caption: 'Canonical Wnt signaling pathway. The canonical Wnt cascade functions in
  two modes I.e; “off” and “on.” In the absence of Wnt ligands, β-catenin stability
  is regulated by the multiprotein destruction complex, ensuring its continuous phosphorylation
  and degradation. Pathway activation occurs when Wnt ligands engage frizzled (FZD)
  receptors and LRP co-receptors, leading to disassembly of the destruction complex
  and stabilization of β-catenin. The accumulated β-catenin subsequently translocates
  into the nucleus, where it associates with TCF/LEF transcription factors to regulate
  downstream gene expression. Key components include: LRP (low-density lipoprotein
  receptor-related proteins), Dvl/Dsh (dishevelled), GSK3β (glycogen synthase kinase-3β),
  CK1α (casein kinase-1α), APC (adenomatous polyposis coli), PP2A (protein phosphatase
  2A), β-TrCP (β-transducin repeat-containing E3 ubiquitin ligase), TCF/LEF (T cell
  factor/lymphoid enhancer factor), TNKS (tankyrases), CBP (CREB-binding protein),
  VEGF (vascular endothelial growth factor), EGFR (epidermal growth factor receptor),
  and SOX family transcription factors'
