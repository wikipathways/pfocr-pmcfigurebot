figure_title: SOS signalling pathway (salt overly sensitive).
caption: SOS signalling pathway (salt overly sensitive). Salt stress is perceived
  at the membrane level (PM, plasmatic membrane), leading to an increase in cytosolic
  Ca2+ concentration ([Ca2+](cyt)), which is detected by the calcium sensor SOS3.
  SOS3 both recruits the SOS1 antiporter to the membrane and forms the SOS3/SOS2 kinase
  complex, which, upon phosphorylation, activates the membrane-bound SOS1 antiporter.
  SOS2 can also regulate the activity of the NHX1 antiporter by promoting Na+ efflux
  in exchange for H+. AKT1, Arabidopsis K+ Transporter 1
