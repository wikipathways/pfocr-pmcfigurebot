figure_title: Cept1 promotes Vegfa, p-AKT, and p-eNOS signaling pathways in a Pparα-dependent
  manner
caption: |-
  A-B) HUVECs were transfected with siRNA targeting Pparα or siRNA control (si-Ct) for 72 h, and the expression of Pparα was confirmed through RT-PCR. Relative gene expression of Cept1 and Pparα was performed using RT-PCR (n=3 per group). C-D) Representative cell migration assay images at t= 0, 6, and 16h were taken from HUVEC Cept1 cDNA, Cept1 cDNA + siPparα, and siPparα. A quantitative graphical representation of cell migration was shown (n=3 per group). E-G) Representative images and quantitative analysis of tubule formation of HUVEC with different conditions after 6h of incubation of Matrigel (n=3–7 per group). H-I) EC from Cept1fl/fl
  Cre+ were treated with GW6471 (10uM), ZM323881 (80nM), LY294002 (30uM), and L-NAME (0.5uM), and cell migration at t = 0, 6, and 16h was assessed and quantified, relative to EC from Cept1fl/fl
  Cre+ and control (n=3 per group). J-K) HUVEC were treated with GW6471 (10uM), ZM323881 (80nM), LY294002 (30uM), and L-NAME (0.5uM), and cell migration at t = 0, 6, and 16h was assessed and quantified, relative to control (n=3 per group). Data are presented as mean ± SEM. Statistical analysis in panels A, B, F, and G was performed using a 1-way ANOVA followed by Tukey’s or by a 2-stage linear step-up procedure of Benjamini, Krieger, and Yekutieli for multiple comparison testing. Statistical analysis in panels D, I, and K was performed using a 2-way ANOVA followed by Tukey’s multiple comparison testing
