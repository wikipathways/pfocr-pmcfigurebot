figure_title: EVs display differential enrichment of proteins and pathways by subtype
caption: a) Volcano plot comparing protein expression in EVs from AR+ cell lines to
  AR−, where significant proteins (q-value < 0.05) are colored for enrichment in AR+
  (blue) or AR− (yellow). b) Gene set enrichment analysis (GSEA) of top enriched KEGG
  pathway in EVs from AR+ compared to AR−. c,d) As in (a,b), indicate enrichment of
  proteins in AR−/NE− EVs compared to the rest, with enrichment in AR−/NE− (red) and
  rest (teal) and most significant GSEA Hallmark pathway. e,f) As in (a-d), indicate
  enrichment of proteins in AR−/NE+ EVs compared to the rest, with enrichment in AR−/NE+
  (green) and rest (purple) and most significant GSEA Hallmark pathway
article_title: Proteomic profiling of extracellular vesicles distinguishes prostate
