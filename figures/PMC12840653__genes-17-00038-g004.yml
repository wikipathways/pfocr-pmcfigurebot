figure_title: Ectopic Expression of Immunoglobulin Genes in Non-B Cells Reveals TNBC-Specific
  Immune Mimicry Signatures.
caption: 'Ectopic Expression of Immunoglobulin Genes in Non-B Cells Reveals TNBC-Specific
  Immune Mimicry Signatures. (A–E) Bi-volcano plots for TNBC vs. HER2+ (x-axis) and
  TNBC vs. ER+ (y-axis) comparisons across five cell populations: T-cells (A), myeloid
  (B), endothelial (C), PVL (D), and CAFs (E). Red dots mark genes significantly upregulated
  in TNBC in both comparisons. (F) Dot plot displaying GO enrichment analysis associated
  with the top TNBC-upregulated genes in CAFs. Color indicates adjusted p-value; dot
  size reflects gene count per term. (G) cnetplot of upregulated TNBC gene sets in
  CAFs and their pathway associations. Only pathways with an adjusted p-value (FDR)
  < 0.05 were retained. (H) Dot plot showing pseudo-bulk average expression (color),
  and percent of cells expressing (dot size) immunoglobulin genes across all major
  cell types. (I) Boxplots comparing immunoglobulin gene expression in plasmablasts
  across subtypes (HER2+, TNBC, ER+), showing significantly higher expression of IGLV3-25,
  IGLV1-40, and IGKV1-9 in TNBC'
