caption: Atf3 knockout reversed Smad7 transcription reduction in UUO kidney by non-transcriptional
  manner. (A) GSEA analysis of TGF-β signaling pathway between WT UUO and sham kidneys,
  between Atf3 KO UUO with WT UUO kidneys. (B) Quantitative real-time PCR analysis
  of Smads in mouse kidneys. (C) Immunoblot of SMAD7 in kidneys. (D) The UCSC genome
  browser database showed ATF3 was found to bind to Smad7 gene in multiple cell lines
  of mouse origin. (E) ChIP-qPCR results of ATF3 to the SMAD7 promoter in 293T cells.
  (F) Luciferase reporter gene assay results of ATF3 on SMAD7 transcriptional activity.
  *p<0.05, **p<0.01
