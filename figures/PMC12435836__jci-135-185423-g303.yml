figure_title: NOTCH1 reverses silencing of antigen presentation in SCLC through reactivation
  of STING
caption: '(A) Immunoblot analysis in COR-L88 cells treated either short-term (7 days)
  or long-term (28 days) with DMSO, TAS1440, and TAS1440 plus GSI (BMS-708163, 2 μM).
  (B) RNA-Seq expression of STING1 at the indicated time points in H82 cells overexpressing
  N1ICD. Immunoblot analysis showing Sting expression in (C) H446 cells overexpressing
  N1ICD and (D) mouse KP1 SCLC cells treated long-term with TAS1440, with or without
  Notch1 KO. (E) RNA-Seq expression of Sting1 in WT, Notch1-KO, and Notch2-KO tumors
  from the Hong et al. (47) dataset. (F) Immunoblot analysis of the indicated proteins
  in COR-L88 cells after NOTCH1-ICD or human NOTCH2-ICD overexpression. (G) STING1
  expression stratified by NOTCH1 expression among NE-enriched tumors in IMpower133.
  (H) Visualization of H3K27ac peaks across the 5′ STING1 locus in H82 cells overexpressing
  N1ICD and COR-L88 cells treated with DMSO, TAS1440, and TAS1440 plus GSI (BMS-708163,
  2 μM). Normalized total reads are shown in top left of each condition shown (data
  representative of n = 2 independent experiments). (I) RNA-Seq expression of APM
  genes in H82 cells overexpressing N1ICD and COR-L88 cells treated with DMSO, TAS1440,
  and TAS1440 plus GSI (BMS-708163, 2 μM) with or without STING1 KO. (J and K) COR-L88
  and/or KP1 cells treated long-term (≥28 days) with DMSO, TAS1440, and TAS1440 plus
  GSI (COR-L88: BMS-708163, 2 μM; KP1: DBZ, 10 μM). Data are representative of n =
  3 independent experiments. (J) Immunoblot analysis of STING pathway proteins with
  STING agonist treatment conditions as shown (COR-L88: diABZi, 500 nM for 4 hours;
  KP1: MSA-2, 30 μM for 1.5 hours). (K) CXCL10 quantification in cell supernatants
  by ELISA. P values were calculated using an unpaired 2-tailed Student’s t test.
  P values less than 0.05 were considered significant'
