figure_title: Integrative summary of ICD modalities, hallmarks, and therapeutic strategies
  to enhance antitumor immunity.
caption: Integrative summary of ICD modalities, hallmarks, and therapeutic strategies
  to enhance antitumor immunity. (A) Multiple regulated cell-death modalities, including
  immunogenic apoptosis, necroptosis, and ferroptosis, have been reported to elicit
  ICD in a context-dependent manner. Importantly, none of these modalities should
  be considered uniformly immunogenic or non-immunogenic solely on the basis of morphology
  or inflammatory features. (B) Canonical ICD hallmarks (CARL exposure, ATP release,
  HMBG1 release, and type I IFN signaling) promote dendritic cell-mediated antigen
  uptake and cross-presentation. (C) Therapeutic strategies to exploit ICD include
  ICD-inducing therapies and rational combinations with immunomodulators (e.g., immune
  checkpoint blockade; STING/TLR/CD40 agonism) and tumor microenvironment interventions
  (e.g., adenosine pathway inhibition, suppression of Treg/MDSC activity, vascular
  normalization), collectively reinforcing antigen-specific T-cell immunity and durable
  tumor control. Key experimental standards required to claim ICD are highlighted
