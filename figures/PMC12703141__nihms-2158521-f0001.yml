figure_title: O-GlcNAcylation stabilizes METTL3 to bridge metabolic flux and m6A-driven
  splicing reprogramming in MDS/AML.
caption: O-GlcNAcylation stabilizes METTL3 to bridge metabolic flux and m6A-driven
  splicing reprogramming in MDS/AML. O-GlcNAc transferase (OGT) catalyzes the O-GlcNAcylation
  of METTL3 at Ser184 and Ser243, enhancing METTL3 protein stability and its m6A writer
  activity. Stabilized METTL3 promotes m6A modification and IGF2BP2-dependent stabilization
  of SRSF1 mRNA, leading to increased SRSF1 expression. Elevated SRSF1 facilitates
  alternative splicing of MCL-1 to favor the anti-apoptotic MCL-1L isoform, thereby
  suppressing apoptosis and promoting leukemic cell survival. Pharmacologic targeting
  of this pathway using the METTL3 inhibitor STM2457, OGT inhibitor OSMI-1, or O-GlcNAc
  site competitive peptides CPPtat1S and CPPtat2S synergistically disrupts the oncogenic
  m6A-SRSF1-MCL-1 circuit and restores apoptosis in MDS/AML cells. (Created with BioRender.com)
article_title: O-GlcNAcylation Locks the m6A-SRSF1-MCL1 axis in Myeloid Malignancies
