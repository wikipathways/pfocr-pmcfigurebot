figure_title: Network pharmacology prediction of Shentong Zhuyu Decoction (STZYD)
  in the treatment of NPP.
caption: Network pharmacology prediction of Shentong Zhuyu Decoction (STZYD) in the
  treatment of NPP. (A) Venn diagram showing the overlap between STZYD and NPP. (B)
  Compound–target–pathway–disease network. Inverted triangles represent the herbal
  components, circles represent the active-ingredient targets, and squares represent
  disease nodes. (C) Protein–protein interaction (PPI) network of candidate targets
  obtained from the STRING database and visualized using Cytoscape 3.7.2. (D) Top
  30 enriched Gene Ontology (GO) terms of STZYD candidate targets, including biological
  processes (BPs), cellular components (CCs), and molecular functions (MFs). (E) Top
  10 enriched KEGG pathways of STZYD candidate targets. The x-axis represents the
  enrichment ratio, the circle sizes indicate the numbers of enriched genes, the y-axis
  denotes the KEGG pathways, and the different colors represent the adjusted p values
