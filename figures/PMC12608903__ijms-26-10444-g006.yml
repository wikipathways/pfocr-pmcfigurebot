caption: 'Amino acid biosynthesis pathway and corresponding heatmaps of gene expression
  and metabolite abundance. Rectangles colored from green to yellow indicate gene
  expression intensity from low to high, while rectangles shifting from blue to red
  depict increasing metabolite abundance. Refer to Figure 1 for abbreviations CK,
  LS, MS and HS. Enzyme abbreviations: PGDH, Phosphoglycerate dehydrogenase; SHM,
  serine hydroxymethyltransferase; THA, L-threonine aldolase; PGM, phosphoglycerate
  mutase; PKP, pyruvate kinase isozyme; ASA, anthranilate synthase alpha; PDC, pyruvate
  decarboxylase; CM, chorismate mutase; ACLA, ATP citrate-lyase; GAD, glutamate decarboxylase;
  IDH, isocitrate dehydrogenase; FUM, fumarate hydratase. T1 and T2 denote the two
  sampling times, which correspond to 15 and 30 days after treatment, respectively.
  CK, LS, MS and HS indicate the non-, low-, mid-, and high-salinity treatments'
