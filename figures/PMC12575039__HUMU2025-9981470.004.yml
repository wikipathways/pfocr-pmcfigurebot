caption: ICOS signaling network analysis reveals enhanced DC–T cell communication
  in the tumor microenvironment. (a–c) Analysis of the complete tissue dataset (GSE138709).
  (a) Circle plot visualization comparing ICOS signaling networks between adjacent
  and tumor tissues. (b) Quantitative analysis of ICOS signaling strength showing
  enhanced DC–T cell interactions. (c) Expression patterns of ICOS pathway components
  across cell types. (d–f) Analysis of the immune-focused dataset (GSE171899). (d)
  Immune cell–specific ICOS signaling network visualization. (e) Role analysis identifying
  key senders and receivers. (f) Detailed expression analysis of ICOS and ICOSL across
  immune cell populations
