figure_title: SR1 Modulates Non-Canonical AHR Pathway to Promote EC Expansion through
  A Polyamine Dependent Mechanism
caption: 'a. Metabolic analysis using Seahorse XF Mito Fuel Flex Test kit, with palmitate
  acid added. Etomoxir: blocks LCFA oxidation; UK5099: blocks glucose and/or pyruvate
  metabolism; BPTES: blocks glutamine oxidation. Data represent mean ± s. d. p values
  (n represents replicates. For UK5099+Vehicle, n=10; UK5099+SR1 and Etmoxir+SR1,
  n=12; the rest of groups, n=11).b. Basal respiration rates from the assay described
  in Fig. 5A. Data represent mean ± s. d. p values, one way ANOVA. (n represents replicates.
  For UK5099+Vehicle, n=10; UK5099+SR1 and Etmoxir+SR1, n=12; the rest of groups,
  n=11).c. Spare respiration rates from the assay described in Fig. 5A. Data represent
  mean ± s. d. p values, one way ANOVA. (n represents replicates. For UK5099+Vehicle,
  n=10; UK5099+SR1 and Etmoxir+SR1, n=12; the rest of groups, n=11).d. Volcano plot
  showing the differences in metabolites between HUVECs cultured in vehicle or SR1
  for 24 hours (differentially present metabolites, based on p value and adjusted
  FDR from two-sided t-test, n = 6 replicates).e. Cell expansion of HUVECs in response
  to SR1, DFMO, and rescuing with putrescine. For each condition, 2,000 ECs were plated
  and cultured for 8 days. Data represent mean ± s. d. p values, RM one-way ANOVA
  with the Geisser-Greenhouse correction, matched values are both stacks and spread
  across a row. (n=7 independent experiments).f. Cell expansion of HUVECs in response
  to SR1, DFMO, and NAC. For each condition, 2,000 ECs were plated and cultured for
  8 days. Data represent mean ± s. d. p values, RM one-way ANOVA with the Geisser-Greenhouse
  correction, matched values are both stacks and spread across a row. (n=6 independent
  experiments)'
