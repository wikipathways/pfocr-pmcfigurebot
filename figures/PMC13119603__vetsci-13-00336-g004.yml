figure_title: Effects of dietary yeast culture (YC) supplementation on the rumen fluid
  metabolome in late-lactation dairy cows.
caption: 'Effects of dietary yeast culture (YC) supplementation on the rumen fluid
  metabolome in late-lactation dairy cows. (A,B) Principal component analysis (PCA)
  score plots derived from untargeted metabolomics data in (A) negative and (B) positive
  ionization modes. (C) Validation plot of the orthogonal partial least squares discriminant
  analysis (OPLS-DA) model via permutation testing (200 iterations). (D) OPLS-DA score
  plot showing separation between the CON and YC groups. (E) Volcano plot displaying
  differentially abundant metabolites (criteria: fold change > 1.5 or <0.67, p < 0.05).
  Metabolites upregulated in the YC group are shown in red, downregulated in blue,
  and non-significant in gray. (F) Bubble chart of Kyoto Encyclopedia of Genes and
  Genomes (KEGG) pathways significantly enriched by the differential metabolites (p
  < 0.05). Bubble size represents the number of metabolites mapped to the pathway;
  color intensity represents the enrichment significance [−log10(p-value)]'
