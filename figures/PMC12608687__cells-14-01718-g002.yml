figure_title: The roles of HOPX in various types of tumors and its mechanisms of action
  in lung cancer cells.
caption: 'The roles of HOPX in various types of tumors and its mechanisms of action
  in lung cancer cells. (A) The tumor-suppressive function (highlighted in blue) and
  the oncogenic function (highlighted in red) of HOPX in tumors. The association between
  HOPX and clinical sensitivity to anticancer drugs in SKCM and lung cancer is indicated.
  The mechanisms of action of HOPX in (B) lung squamous cell carcinoma (SCC) cells
  and (C) lung adenocarcinoma cells. HOPX inhibited SCC cell proliferation by increasing
  Ras-induced cellular senescence, inactivating the AKT pathway, and enhancing the
  p53/p21 activity. HOPX interacting with GATA6 inhibits the ADC cell metastasis and
  promotes alveolar type II (AT2) cell differentiation, accompanied by downregulation
  of metastasis-associated genes and upregulation of lung differentiation-associated
  genes. GBM: glioblastoma multiforme; CRC: colorectal cancer; SKCM: skin cutaneous
  melanoma; ESCC: esophageal squamous cell carcinoma; NPC: nasopharyngeal carcinoma;
  HCC: hepatocellular carcinoma; AML: acute myeloid leukemia; MEK: mitogen-activated
  protein kinase kinase; EGFR-TKI: epidermal growth factor receptor (EGFR)–tyrosine
  kinase inhibitor; ADC: adenocarcinoma'
