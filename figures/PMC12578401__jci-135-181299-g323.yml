figure_title: Persulfidome remodeling in SuoxKO/KO mice
caption: (A) Setup for the detection of protein-bound persulfides in the assay described
  by Zivanovic et al. (18). Crude extract from liver was treated with 4-chloro-7-nitrobenzofurazan
  (NBF-Cl), which reacts with persulfides, free thiols, sulfenic acids, and amine
  groups. The NBF-blocked persulfides undergo nucleophilic attack by the DAz-2 moiety,
  which in turn is cross-linked to a fluorescent Cy5 moiety via click chemistry. (B)
  Representative Cy5 (persulfonate) and NBF-Cl (control) fluorescence signals measured
  by a fluorescence scanner (Cy5, red; NBF-Cl, green). (C) Quantification of a specific
  rectangular area identical for all lanes. All Cy5 signals were normalized to their
  respective NBF-Cl signals and further normalized to the mean of SuoxWT/WT signals
  (n = 3). Error bars indicate SD. One-way ANOVA was performed. (D) Heatmap showing
  the significant changes of protein persulfidation in SuoxKO/KO mouse livers compared
  with WT animals (Welch’s test, P < 0.05). (E) Volcano plot depicting statistical
  significance plotted against the log2 fold change of persulfidated proteins in SuoxKO/KO
  mouse liver relative to WT animals. Significance was established using Welch’s t
  test (2 sided), with a P value threshold of <0.05. Fold change cutoffs were established
  at 30%. The numbers of proteins with significantly altered persulfidation states
  are indicated. (F) KEGG pathway enrichment analysis using DAVID. The graph shows
  the top 30 significant (Benjamini’s adjusted P value < 0.01) and most enriched terms,
  with color gradient signifying the adjusted P value and circle size the number of
  proteins. (G) GO (Biological Process) term enrichment analysis of the 441 proteins
  found to have decreased persulfidation levels in SuoxKO/KO mice. REVIGO was used
  to plot the enrichment analysis performed in DAVID. Circle dimensions denote the
  protein count within specific GO terms, while color gradients depict the degree
  of significance. Similar biological processes are grouped together with a dashed
  line. (H) AlphaFold model of human ABCB7 protein with the C-terminal helix pointing
  into the transport pore. The C-terminal Cys residues are highlighted in a spheres
  model. (I) Determination of cytosolic Aco2 activity, (J) molybdopterin (MPT)/Moco
  content via HPLC Form A analysis, and (K) urinary uric acid/xanthine (UA/XA) ratio.
  ***P < 0.001; **P < 0.01; *P < 0.05
