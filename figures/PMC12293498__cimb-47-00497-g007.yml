caption: DMRTA2 inhibits the malignant phenotype of p53 wild-type lung cancer cells
  by regulating the p53 pathway. (A) GSEA enrichment analysis showed that the expression
  of DMRTA2 was correlated with the p53 pathway (FDR q-value= 0.018, p < 0.05). (B)
  Western blot analysis of the effects of overexpression of DMRTA2 in A549 and the
  knockout of DMRTA2 in H460 on p53 pathway-associated proteins. p < 0.05 was statistically
  significant; ** p < 0.01, and *** p < 0.001, ns means not significant
