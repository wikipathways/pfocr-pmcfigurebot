figure_title: Pathways for acetate consumption and energy conservation across the
  Class Methanosarcinia
caption: '(A) Pathways of carbon (solid arrows) and electron (dashed arrow) flow during
  acetoclastic methanogenesis. Acetate is first activated in an ATP-dependent manner
  to acetyl-CoA, which is dismutated into its methyl and carbonyl groups. The methyl
  group enters the methanogenesis pathway via the C1-carrier tetrahydromethanopterin
  (H4MPT) [or a derivative in select methanogens, tetrahydrosarcinopterin (H4SPT)]
  and is subsequently transferred to another C1 carrier, coenzyme M (CoM). The carbonyl
  group is oxidized to carbon dioxide and reducing equivalents from the oxidation
  (e−) pass through the electron transport chain. The electron transport chain provides
  the electrons necessary for the reduction of the methyl group to methane, while
  simultaneously generating the ATP necessary for substrate activation (solid teal
  arrow). For simplicity, the carbon and electron flow steps do not show cofactors
  and/or electron carriers as substrates/products. Empty boxes labeled “Acetate Activation”
  and ‘Electron Transport Chain Complexes” note where proteins catalyzing these functions
  differ between methanogens. (B) Schematics of acetate activation in different acetoclastic
  methanogens. In Methanosarcina spp., acetate is activated in an ATP-dependent manner
  to acetyl-phosphate (acetyl-P) by acetate kinase (Ack), which is then converted
  to acetyl-CoA through the activity of a second enzyme, phosphotransacetylase (Pta).
  The single ATP spent during activation is regenerated to ATP likely through the
  activity of ATP synthase or other ADP-dependent enzymes. In Methnothrix spp., acetate
  is activated directly to acetyl-CoA in a single, ATP-dependent step catalyzed by
  acetyl-CoA synthetase (Acs) coupled to the production of AMP and pyrophosphate.
  AMP is then regenerated to ADP through the hydrolysis of a second equivalent of
  ATP. The pyrophosphate is hydrolyzed by a soluble pyrophosphatase (PPase) and can
  be used to regenerate the two equivalents of ADP to two ATP. (C) Schematics of the
  electron transport chain complexes involved in energy conservation during acetoclastic
  methanogens. In Methanosarcina spp., reduced ferredoxin generated by acetoclastic
  methanogenesis (Fdred) is re-oxidized via either the proton-translocating Ech (energy
  converting hydrogenase) complex coupled to hydrogen gas (H2) production, or the
  sodium-translocating Rnf (Rhodobacter nitrogen fixation) complex coupled to methanophenazine
  (MP) reduction (MPH2). In Methanothrix, re-oxidation of Fdred coupled to MP reduction
  is thought to be catalyzed by a proton-translocating F420:phenazine oxidoreductase
  homolog that lacks the coenzyme-F420 active site-containing subunit (Fpo’). (D)
  Presence/absence of acetate activation and electron transport modules in four representative
  methanogen species across the Methanosarcinia. Categories “Acetate Activation” and
  “Electron Transport Complexes” refer to the genes shown in parts A and B, respectively.
  For each species, the presence or absence of the protein(s) is indicated by a color-filled
  or empty box, respectively: Ack + Pta (acetate kinase + phosphotransacetylase),
  green; Acs (acetyl-CoA synthetase [AMP-forming]), yellow; Fpo’ (F420:phenazine oxidoreductase
  lacking FpoF subunit), light blue; FpoF (coenzyme F420 active site-containing subunit
  of F420:phenazine oxidoreductase), dark blue; Rnf (Rhodobacter nitrogen fixation
  complex), red; Ech (energy converting hydrogenase), purple'
article_title: Genus-specific remodeling of carbon and energy metabolism facilitates
  acetoclastic methanogenesis in Methanosarcina spp. and Methanothrix spp.
