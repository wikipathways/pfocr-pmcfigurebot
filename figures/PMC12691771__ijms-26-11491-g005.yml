figure_title: Proposed model illustrating the cellular and molecular mechanisms of
  E-Cig-induced skeletal muscle damage.
caption: Proposed model illustrating the cellular and molecular mechanisms of E-Cig-induced
  skeletal muscle damage. The skeletal myocytes of mice exposed to E-Cig 2.4% show
  dephosphorylation of AMPK and ATGL, with increases in micro-myosteatosis. E-Cig
  2.4% increases oxidative stress with activation of p-p38 MAPK. These imbalances
  of metabolism (AMPK) and stress (p38 MAPK) pathways lead to autophagy deregulation,
  resulting in accumulation of damaged mitochondria
