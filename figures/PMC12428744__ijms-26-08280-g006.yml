figure_title: Lotus alkaloids exert neuroprotection by promoting neurogenesis.
caption: Lotus alkaloids exert neuroprotection by promoting neurogenesis. Pronuciferine
  and nuciferine increase brain-derived neurotrophic factor (BDNF) levels by activating
  the TrkB receptor, which in turn triggers key signaling pathways such as mitogen-activated
  protein kinase (MAPK), extracellular signal-regulated kinase (ERK), and Phosphatidylinositol
  3-kinase (PI3K/Akt). This subsequently activates the transcription factor cAMP Response
  Element-Binding Protein (CREB), which promotes the expression of neurogenic genes,
  including microtubule-associated protein 2 (MAP-2) and Myelin basic protein (MBP),
  thereby enhancing neurogenesis
