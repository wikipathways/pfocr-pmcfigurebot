figure_title: Integrated analysis of metabolic pathways and component-metabolite correlations.
caption: Integrated analysis of metabolic pathways and component-metabolite correlations.
  (A) Interaction networks of key metabolic pathways, including arachidonic acid,
  purine, linoleate, glycerophospholipid, and tryptophan metabolism. In the network
  diagrams, circles, diamonds, hexagons, and rounded rectangles represent genes, reactions,
  metabolites, and proteins, respectively. (B) Heatmap visualizing the correlation
  analysis between the constituents of CF absorbed into the blood (X-axis) and differential
  endogenous metabolites (Y-axis). The color scale indicates the correlation coefficient
  (red for positive correlation, blue for negative correlation). * p < 0.05 and **
  p < 0.01 indicate statistical significance The red arrows indicate blood components
  and their secondary metabolites exhibiting significant correlations
