figure_title: Schematic overview of lung ischemia–reperfusion injury.
caption: Schematic overview of lung ischemia–reperfusion injury. Ischemia with ventilation
  (left; mechanotransduction) and without ventilation (middle; oxygen debt) are shown
  with their respective pathways and links to reperfusion (right). Dashed boxes/lines
  indicate latent processes expressed on reperfusion; ❄ marks cold-sensitive processes.
  Reperfusion combines start-of-flow–induced NOX2 activation with O2-dependent bursts
  from succinate oxidation/reverse electron transport (RET) at complex I and from
  xanthine oxidase (XO). Reactive oxygen species (ROS) drive lipid peroxidation, protein
  nitration/carbonylation, and DNA breaks and activate NF-κB/AP-1, leading to cytokine/chemokine
  release, type II pneumocyte injury with ↓surfactant and alveolar collapse, increased
  vascular permeability, platelet/complement activation, pulmonary edema, and impaired
  gas exchange. AP-1, Activator Protein-1; ATP, adenosine triphosphate; CXCL1, CXC
  ligand 1; eNOS, endothelial nitric oxide synthase, GM-CSF, Granulocyte-macrophage
  colony-stimulating factor; IL, interleukin; KATP, ATP-sensitive potassium channel;
  MCP-1, Monocyte chemoattractant protein-1; MIP, Macrophage inflammatory protein;
  NADPH, nicotinamide adenine dinucleotide phosphate; NF-κB, nuclear factor kappa-B;
  NO, nitric oxide; NOX2, NADPH oxidase-2; PECAM-1, platelet endothelial cell adhesion
  molecule-1; PI3K–Akt, Phosphoinositide 3-kinase → Akt pathway; RANTES, “Regulated
  on Activation, Normal T-cell Expressed and Secreted”; ROS, reactive oxygen species;
  SDH, succinate dehydrogenase; TNF, tumor necrosis factor; VE-cadherin, vascular
  endothelial cadherin; VEGFR2, vascular endothelial growth factor receptor-2; XO,
  xanthine oxidase
