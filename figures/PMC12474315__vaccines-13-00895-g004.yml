figure_title: Schematic summary of Torque Teno Virus (TTV) biology, immune modulation
  mechanisms, and potential implications for vaccine responsiveness.
caption: 'Schematic summary of Torque Teno Virus (TTV) biology, immune modulation
  mechanisms, and potential implications for vaccine responsiveness. (A) TTV is a
  highly prevalent anellovirus with >90% global prevalence, transmitted early in life
  and persistent lifelong in blood and lymphoid tissues. (B) Mechanistic interactions
  include NF-κB signaling suppression (by ORF2 protein), CpG motif-TLR9-mediated type
  I interferon induction, and antiviral pathway modulation by TTV-encoded microRNAs.
  (C) TTV load serves as an immunocompetence surrogate marker, with elevated plasma
  titers found to be linked to compromised vaccine response in immunosuppressed persons
  (e.g., transplant recipients, HIV-infected patients). (D) Clinical uses include
  the application of TTV levels to stratify individuals for customized vaccine regimens,
  to define booster intervals directly, or to optimize immunosuppressive therapy.
  This dual role of TTV as an immune modulator and biomarker illustrates the regulation
  that commensal components of the virome exert on vaccine effectiveness. Abbreviations:
  NF-κB, nuclear factor kappa-light-chain-enhancer of activated B cells; TLR9, Toll-like
  receptor 9; HIV, human immunodeficiency virus'
