  3 per diet per time point, mean ± SEM.(F) Liver free fatty acid (FFA) concentration;
  n = 3 per diet per time point, mean ± SD. Statistical analysis was performed with
  two-way ANOVA, p <0.05 for a, ALversus CR; b, AL versus F; c, CR versus F.(G) Liver
  lipid droplet staining images'
