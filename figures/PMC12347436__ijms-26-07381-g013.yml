caption: Mechanisms of flavonoid-loaded nanocarriers targeting cancer signaling pathways.
  Nanocarriers enhance the targeting delivery of flavonoids to specific sites via
  passive and active mechanisms. Passive targeting utilizes the EPR effect, while
  active targeting engages receptor-mediated endocytosis. The uptake of isorhamnetin
  by cancer cells interferes with crucial signaling pathways related to cell proliferation,
  angiogenesis, metastasis, and apoptosis, thus producing anticancer effects [62,96,144,166,229,269,275,276,277].
  The arrows ‘↑’ and ‘↓’ represent activation and suppression, respectively
