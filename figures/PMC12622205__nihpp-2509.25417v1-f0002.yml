figure_title: Computational Drug Repurposing for Alzheimer’s Disease via Sheaf Theoretic
  Population-Scale Analysis of snRNA-seq Data
caption: a. Depiction of the human brain vasculature structure and the place of capillary
  endothelial cells and perictye cells in that structure. These cells play a primary
  role in persistent BBB breakdown in AD which is a significant pathological driver.
  b. UMAP plots of the human brain vasculature atlas taken from Yang et. al. On the
  left cells are colored by their disease status and on the right cells are colored
  by their cell type. c. UMAP plots of diseased versus healthy endothelial and pericyte
  cells, as well as the respective PPI complexes of their up-regulated DEGs with the
  top genes in terms of log-fold changes labeled. d. Focused analysis of PPI structures
  surrounding our top scoring topologically significant genes from the PSL analysis.
  Cliques and connected components containing topological genes from endothelial and
  pericyte cells are extracted and their structure reveals a potential cross-compartment
  signaling cascade between protective adhesion modules and MMP inducing CA2+ / cAMP
  / PKA machinery. e. The topological genes and their surrounding PPI structures were
  then used to conduct a pathway analysis via the GO databases in GSEApy, revealing
  coherent and coordinated pathways driving different aspects of BBB leakage pathology.
  A schematic diagram is also presented illustrating the proposed ERBB4-DLG2 mechanistic
  bridge
