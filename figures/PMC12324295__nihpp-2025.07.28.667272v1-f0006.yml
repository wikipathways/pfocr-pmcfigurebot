figure_title: Cholesterol metabolism genes in dopaminergic neurons following acute
  amphetamine and methylphenidate treatment
caption: '(A) Schematic illustrating the Th-cre:RiboTag mouse approach used to isolate
  bulk RNA from dopaminergic neurons for qPCR and RNA-seq analysis.(B) Expression
  of marker genes in RNA isolated using the RiboTag RNA-seq method. LY, tissue lysate;
  DA, dopaminergic neurons; F, female; M, male.(C) qPCR validation of cholesterol
  metabolism–associated genes in RiboTag-isolated RNA from dopaminergic neurons following
  acute saline or methamphetamine administration. Statistical significance was assessed
  by unpaired t-test with two-stage step-up FDR correction; **q < 0.01, ***q < 0.001;
  error bar: standard deviation.(D, E) RNA-seq analysis of genes in the SREBP signaling
  pathway associated with cholesterol metabolism in dopaminergic neurons after acute
  amphetamine (D) and methylphenidate (E) treatment in Th-cre:RiboTag mice. Statistical
  significance was determined by unpaired t-test with two-stage step-up FDR correction;
  **q < 0.01, ***q < 0.001, ns = not significant; error bar: standard deviation.(F)
  Metascape functional enrichment analysis of upregulated differentially expressed
  genes (DEGs) in dopaminergic neurons from RiboTag RNA-seq following acute amphetamine
  treatment'
article_title: Dynamic Regulation of Cholesterol Metabolism Genes in Dopaminergic
