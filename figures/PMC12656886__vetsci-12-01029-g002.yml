caption: Schematic representation illustrating how the selected miRNAs act as inhibitory
  nodes within the enriched pathways identified by DIANA-miRPath v3.0 analysis. The
  miRNAs investigated in this study (blue, left) are shown interacting with their
  predicted target gene groups (orange, center) involved in the main enriched signaling
  pathways (gray right), including TGF-β, PI3K–Akt, MAPK, ECM–receptor interaction,
  and focal adhesion. Together, these regulatory networks highlight how the selected
  miRNAs modulate extracellular matrix remodeling and fibrotic processes in canine
  MMVD
