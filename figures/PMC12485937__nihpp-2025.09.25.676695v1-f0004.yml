figure_title: Correlations between viral community temperateness and central carbon
  gene frequency across pathways and gene function
caption: '(a) Spearman’s rho correlation coefficients (ρs) for genes in the Embden-
  Meyerhof-Parnas glycolysis (EMP), gluconeogenesis (GNG), pentose phosphate (PP),
  Entner-Doudoroff glycolysis (ED, and tricarboxylic acid cycle (TCA) pathways are
  shown with median values marked by horizontal bars in each pathway. (b) Coefficients
  are also shown for genes involved in building up central intermediate metabolite
  pools like pyruvate and glyceraldehyde-3-phosphate (anaplerotic reactions) or consuming
  general metabolites to make specialized pools of precursors and cellular energy
  (cataplerotic reactions) in central carbon metabolism, compared with genes involved
  in neither anaplerosis nor cataplerosis, also with median values shown. Oxidoreductase
  genes are colored by their electron acceptor: blue for NADP+ electron acceptors
  involved in biomass generation, and red for NAD+ electron acceptors involved in
  cellular energy generation. Dashed horizontal lines indicate ρs = 0. Note, although
  anaplerotic and cataplerotic reactions often refer to steps in the TCA, we are using
  the term more generally here to refer respectively to the generation (‘filling up’;
  anaplerotic) of flexible general intermediate metabolites and the consumption of
  general metabolites towards precursor and cellular energy production (‘drawing down’;
  cataplerotic) more generally33'
