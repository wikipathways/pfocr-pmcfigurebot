figure_title: The proposed role of Ang-2-Tie2 and VEGF-A signaling in diabetic nephropathy.
caption: 'The proposed role of Ang-2-Tie2 and VEGF-A signaling in diabetic nephropathy.
  VEGF-A, released by podocytes, signals through VEGFR2 on glomerular endothelial
  cells and contributes to endothelial homeostasis (blue dashed arrow), whereas Ang-1/Tie2
  signaling stabilizes the endothelium and Ang-2 antagonizes this pathway (orange
  dashed arrows). Dysregulation of these pathways may contribute to endothelial destabilisation,
  increased permeability, albuminuria, proteinuria, and the development of diabetic
  nephropathy, as indicated by the solid downward arrows. Legend: Ang-1: angiopoietin-1;
  Ang-2: angiopoietin-2; Tie2: endothelial tyrosine kinase receptor; VEGF-A: vascular
  endothelial growth factor A; VEGFR2: vascular endothelial growth factor receptor
  2'
