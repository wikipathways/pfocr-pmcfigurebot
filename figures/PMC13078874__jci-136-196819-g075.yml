figure_title: Partial UPR activation in Sel1L-deficient neurons
caption: (A) Western blot analysis of IRE1α in cortical tissues of Sel1Lfl/fl and
  Sel1LSynCre mice at 5 weeks of age. (B) Quantitation is shown (n = 6 mice per group;
  molecular weight in kDa). (C) RT-PCR analysis of Xbp1 mRNA splicing in cortical
  tissue from 5-week-old mice; u and s indicate the unspliced and spliced Xbp1, respectively.
  (D) Quantitation of spliced Xbp1 (Xbp1s) is shown (n = 6 mice per group). (E) Western
  blot analysis of PERK and phosphorylated eIF2α (p-eIF2α) in cortical tissue, with
  quantitation shown in F (n = 6 mice per group). (G) Representative TEM images from
  Sel1Lfl/fl and Sel1LSynCre mice at 5 weeks of age. ER (red) and mitochondria (M,
  green) are indicated. (H) Quantitation of ER luminal width is shown (200–250 measurements
  from 3 mice per group). (I) Uniform manifold approximation and projection (UMAP)
  visualization of cell types identified by unsupervised clustering of snRNA-seq data
  from combined cortex and hippocampus. Each dot represents 1 nucleus. (J) Relative
  abundance of major cell types between genotypes. Cell types include neurons, oligodendrocytes
  (Oligo), microglia and perivascular cells (Micro-PVM), oligodendrocyte precursor
  cells (OPC), astrocytes (Astro), vascular and leptomeningeal cells (VLMC), inflammatory
  mononuclear cells (IMO), and endothelial cells (Endo). (K) Differential expression
  of ER quality control–related genes (ERAD, chaperones, and the UPR pathways) based
  on snRNA-seq data, shown as log2 fold change. Excitatory and inhibitory neuronal
  subtypes were defined using established markers. Data in B, D, F, and H are mean
  ± SEM and analyzed by 2-tailed Student’s t test; data in K were analyzed by 2-way
  ANOVA with FDR correction. ***P < 0.001
