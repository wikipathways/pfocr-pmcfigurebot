figure_title: Mechanism of glutamate excitotoxicity via NMDA receptors in AD.
caption: Mechanism of glutamate excitotoxicity via NMDA receptors in AD. The diagram
  compares NMDA receptor function under physiological and AD conditions. Solid arrows
  represent ion fluxes and direct activation, while dashed arrows indicate multi-step
  signaling pathways leading to downstream effects. Under physiological conditions
  (left), NMDA receptor activation is regulated by magnesium (Mg2+) blockade, allowing
  controlled calcium (Ca2+) influx essential for synaptic plasticity and learning.
  In AD (right), chronic glutamate exposure and membrane depolarization lead to persistent
  Mg2+ displacement from the NMDA receptor channel. This results in receptor overactivation
  and uncontrolled Ca2+ influx. The sustained elevation of intracellular Ca2+ triggers
  downstream signaling cascades that activate necrotic and apoptotic pathways, culminating
  in permanent excitotoxic damage, synaptic loss, and neuronal death—key events in
  AD-associated neurodegeneration
