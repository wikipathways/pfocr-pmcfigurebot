figure_title: Metformin enhances AT2 cell transcriptional program and reduces fibrotic
  fibroblast population
caption: (A) Schematic of experimental design and UMAP visualization of 39,327 lung
  cells from WT (age-matched C57B6/J; n = 2) and SftpcI73T mice, treated with either
  metformin (n = 1) or vehicle control (n = 1), collected at 28 days after tamoxifen
  induction, profiled by scRNA-Seq, and color-coded by cell lineage. Subset analysis
  of 4,040 distal epithelial cells is shown. (B) UMAPs color-coded by genotype and
  time point and frequency table showing the distribution of each cluster within treatment
  groups. (C) Dendrogram of top 50 DEGs and their associated log2FC for each cluster
  as determined by FDR. A subset of cluster-defining genes is highlighted. (D) KEGG
  pathway enrichment analysis of DEGs (FDR < 0.05, log2FC > 1 and <–1) comparing vehicle
  versus metformin treatment. (E) Gradient dot plots demonstrating expression of select
  gene modules (Supplemental Table 1) in alveolar epithelium and transitional cell
  clusters and fibrosis-associated genes in activated AT2 cells. (F) Subclustering
  of the mesenchymal compartment (24,853 cells) identifies 8 mesenchymal clusters,
  defined by marker genes, depicted in a gradient dot plot. (G) UMAPs color-coded
  by genotype and time point, with a frequency table highlighting a decrease in the
  fibrotic fibroblast population after metformin treatment
article_title: Impaired AMPK control of alveolar epithelial cell metabolism promotes
