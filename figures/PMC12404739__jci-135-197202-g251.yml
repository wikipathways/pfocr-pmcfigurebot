figure_title: Rerouting of CSF drainage after cauterization of the deep cervical lymph
  nodes
caption: In healthy rats (left), cerebrospinal fluid (CSF) efflux pathways generally
  follow a carotid artery pathway (red) from the internal and external carotid arteries
  (iCA and eCA, respectively) toward the common carotid artery (CCA), accompanied
  by drainage by the lymphatic system (green), with accumulation in the deep and superficial
  cervical lymph nodes (dcLN and scLN, respectively). Following cauterization of the
  dcLN (dotted outlines), young rats (middle) exhibited a rerouting of efflux (highlighted
  in pink) towardsthe posterior facial veins (blue), in addition to existing carotid
  artery pathways. In middle-aged rats (right), efflux increased along the eCA, while
  no change was observed along the cervical veins. Omics analysis indicated elevated
  neuroinflammatory markers in both young and middle-aged rats following dcLN cauterization
  (depicted as darker brain color). Efflux of CSF contrast agent is depicted in pink
