figure_title: Gut-brain axis as a connection between epilepsy and obesity.
caption: 'Gut-brain axis as a connection between epilepsy and obesity. 1. In epilepsy,
  intestinal dysbiosis is present, with lower microbial diversity of beneficial genera
  and a higher prevalence of pro-inflammatory taxa. 2. Microbial dysbiosis induces
  systemic inflammation and compromises the intestinal barrier, allowing bacterial
  endotoxins such as LPS to enter the bloodstream. 3. Circulating LPS activates TLR4
  receptor signaling in endothelial cells (BBB), leading to a decrease in tight junction
  proteins, which facilitates infiltration of immune cells into the CNS. 4. Activation
  of TLR4 receptor signaling by LPS in microglia and astrocytes leads to the synthesis
  of pro-inflammatory cytokines, perpetuating neuroinflammation. 5. In obesity and
  epilepsy, the synthesis of SCFA such as butyrate, propionate, and acetate is significantly
  reduced, leading to: a. Reduction in its inhibitory function of histone deacetylases
  (HDAC), which decreases the transcription of neuroprotective and anti-inflammatory
  genes. b. Reduced activation of GPR41 and GPR43 receptors in enterocytes, preventing
  key signaling pathways in gut-brain communication, and consequently reducing neuronal
  survival. c. The altered signaling of SCFA decreases the expression of PGC-1α, interfering
  with mitochondrial biogenesis and oxidative metabolism by decreasing oxidative phosphorylation
  and increasing ROS production, ultimately perpetuating oxidative stress. d. Furthermore,
  the decrease in microbial metabolites leads to lower brain-derived neurotrophic
  factor (BDNF) expression, resulting in reduced synaptic plasticity. 6. Microbial
  dysbiosis promotes an imbalance in neurotransmitter production towards an excitatory
  predominance, with decreased GABA synthesis and increased glutamatergic activity
  7. In obesity and epilepsy, vagal tone is reduced, decreasing parasympathetic control
  and the cholinergic anti-inflammatory reflex. 8. Dysautonomia increases activation
  of the HPA axis, leading to cortisol secretion. Chronic dysregulation of this axis
  exacerbates visceral fat accumulation, insulin resistance, and increased cytokine
  release. 9. In microbial dysbiosis and inflammatory states, enterocytes and immune
  cells produce excess IDO, promoting the diversion of tryptophan metabolism from
  serotonin synthesis to kynurenine biosynthesis. 10. The neuroactive metabolites
  quinolinic acid and kynurenic acid cross the blood-brain barrier and influence glutamatergic
  transmission. Quinoline acid acts as an NMDA receptor agonist. Decreased serotonin
  levels lead to depressive and cognitive symptoms. 11. Adipokines (ghrelin, leptin,
  adiponectin) regulate the gut-brain axis (GBA). 12. Ketogenic diet modulates the
  intestinal microbiota. Created in BioRender. downward arrows (↓) indicate decreased
  expression, activity, or downregulation. Created in BioRender. Carpinteyro, S. (2026)
  https://BioRender.com/jntugks (accessed on 23 March 2026)'
