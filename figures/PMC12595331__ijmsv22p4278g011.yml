figure_title: A schematic illustration of the molecular mechanism of erinacine S-mediated
  inhibition of proliferation, aggressiveness and cell cycle of chemoresistant human
  colorectal cancer HCT-116/5FUR cells.
caption: A schematic illustration of the molecular mechanism of erinacine S-mediated
  inhibition of proliferation, aggressiveness and cell cycle of chemoresistant human
  colorectal cancer HCT-116/5FUR cells. Erinacine S treatment regulated histone H3K9K14ac
  of the TRAIL, TNFR1, and DR5 promoters through multiple PAK/FAK/p300 pathways, resulting
  in the elevation of their protein level. Subsequently, the activation of TNFR1 and
  TRAIL by erinacine S was critical for an apoptotic pathway to either activate or
  downregulate caspase-3 and 9, or to inhibit the Bcl-2 protein. On the other hand,
  the repression of CXCR4/PI3K/AKT/ERK and NFκB/HIF1α/P-gp signaling pathways by the
  erinacine S treatment may lead to the repression of chemoresistant of HCT-116/5FUR
  cells
article_title: A Novel Erinacine S Derivative from Hericium erinaceus Overcomes Chemoresistance
  in Colorectal Cancer Cells by Enhancing TRAIL/TNFR1/DR5 Expression through Histone
  Acetylation
