figure_title: CAV2 Modulates Cetuximab Sensitivity in HNSCC by Targeting the PACT-PKR
  Signaling Axis.
caption: CAV2 Modulates Cetuximab Sensitivity in HNSCC by Targeting the PACT-PKR Signaling
  Axis. (A). Scatter plots showing the expression correlation of CAV2 with representative
  molecules of the EGFR signaling pathway from a public transcriptomic database GEPIA
  (Gene Expression Profiling Interactive Analysis). Pearson correlation coefficient
  (r) and p-value are indicated. (B). IC50 values of Cetuximab were determined at
  24 h, 48 h, and 72 h in (Left panel) SCC15 and (Right panel) SCC25 cell lines using
  CCK-8 assays. (C,D). Dose–response curves of Cetuximab after 48 h treatment in SCC15-shCAV2
  and SCC15-shCtrl cells (C). Bar graph comparing the IC50 values between the two
  groups (D). Data are presented as mean ± SD (n = 3). **** p < 0.0001 by unpaired
  Student’s t-test. (E,F). Representative bioluminescence images of mice bearing SCC15-Ctrl-luci
  or SCC15-shCAV2-luci tumors at the experimental endpoint after treatment with either
  PBS (control) or Cetuximab (F). Mice were randomly assigned to treatment groups
  (n = 5 per group). Data are presented as mean ± SD from three independent experiments.
  Bar graph showed the final tumor volumes measured from the four experimental groups
  described in (E). Data are presented as mean ± SEM (n = 5). * p < 0.05, ** p < 0.01,
  **** p < 0.0001 by one-way ANOVA with Tukey’s post hoc test. (G,H). Dose–response
  curves of Cetuximab after 48 h treatment in SCC15-Ctrl, SCC15-shCAV2, SCC15-shCAV2
  + shPKR and shCAV2+shPACT cells (G). Bar graph comparing the IC50 values among the
  four groups (H). Data are presented as mean ± SD (n = 3). *** p < 0.001, **** p
  < 0.0001 by one-way ANOVA with Tukey’s post hoc test
