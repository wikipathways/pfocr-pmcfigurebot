caption: PEBR is fabricated using a facile one-step ultrasonic method, generating
  stable squalene-in-water emulsion droplets. It enables efficient clearance of MSU
  crystals, significantly attenuates oxidative stress, and inhibits the NF-κB/NLRP3
  signaling pathway. Consequently, PEBR promotes a shift toward the reparative M2
  macrophage phenotype and remodels the inflammatory microenvironment in gouty arthritis,
  providing a potent and integrated therapeutic strategy
article_title: Enzymes assembled pickering emulsion as self-cascade bioreactor to
  reprogram inflammatory microenvironment for gouty arthritis therapy
