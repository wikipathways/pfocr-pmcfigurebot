figure_title: Sex-difference in neuronal cells as shown in component 74
caption: (A) Box plots (median ± IQR; whiskers extend to 1.5 × IQR) of sample scores
  for Component 74, showing significant separation between male and female individuals
  (FDR-adjusted p = 7.9 × 10−44). (B) Cell-type loadings, showing strong positive
  contributions from excitatory (Exc) and inhibitory (Inh) neurons, contrasted by
  a strong negative contribution from oligodendrocytes (Oli). (C) Scatter plot showing
  near-perfect anti-correlation (r = −0.982) between ROSMAP Component 74 and the corresponding
  sex component in the SEA-AD dataset. (D) Gene expression loadings are dominated
  by canonical X- and Y-chromosome genes. (E) H3K9ac ChIP-seq peak loadings are concentrated
  on the sex chromosomes and are enriched for a binding motif of the stem-cell-related
  transcription factor PRDM4. (F) DNA methylation loadings show widespread, sex-biased
  differences across all autosomes. (G) KEGG pathway enrichment for genes near sex-differentiated
  CpG sites
article_title: Aged brain multi-omic integration captures immunometabolic and sex
