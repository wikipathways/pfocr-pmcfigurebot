figure_title: Effect of inhibition of the tumor necrosis factor-like weak inducer
  of apoptosis/Fn14/NF-κB/NLRP3 pathway on the microenvironmental regulatory ability
  of iPDLSCs.
caption: Effect of inhibition of the tumor necrosis factor-like weak inducer of apoptosis/Fn14/NF-κB/NLRP3
  pathway on the microenvironmental regulatory ability of iPDLSCs. (A) Immunofluorescence
  staining was used to detect the expression levels of RANKL and OPG in PDLSCs, iPDLSCs,
  and iPDLSCs after the downregulation of Fn14, NF-κB and NLRP3, followed by statistical
  analysis of the average optical density values of (B) RANKL and (C) OPG, and (D)
  the RANKL/OPG ratio (n=5). Scale bar, 200 μm. (E) Immunofluorescence staining was
  used to detect the expression levels of CD68 and CD163 in macrophages cocultured
  with PDLSCs, iPDLSCs, and iPDLSCs after the downregulation of Fn14, NF-κB and NLRP3,
  followed by statistical analysis of the average optical density values of (F) CD68
  and (G) CD163 (n=5). Scale bar, 200 μm. Statistical analysis was performed using
  a one-way ANOVA. *P<0.05; **P<0.01; ****P<0.0001. Data are presented as the mean
  ± SD. Fn14, fibroblast growth factor-inducible 14; iPDLSC, inflammatory PDLSC; MOD,
  mean optical density; NLRP3, NOD-like receptor thermal protein domain-associated
  protein 3; ns, not significant; OPG, osteoprotegerin; PDLSC, periodontal ligament
  stem cell; RANKL, receptor activator of nuclear factor-κB ligand; sh, short hairpin
  RNA
