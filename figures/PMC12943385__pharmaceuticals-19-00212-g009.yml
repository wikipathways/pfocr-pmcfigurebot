figure_title: Mechanism of Qingfei Tongluo Jiedu formula (QTJD) in the treatment of
  Mycoplasma pneumoniae pneumonia (MPP).
caption: Mechanism of Qingfei Tongluo Jiedu formula (QTJD) in the treatment of Mycoplasma
  pneumoniae pneumonia (MPP). (a) MP infection reduces the abundance of butyrate-producing
  bacteria, leading to decreased butyrate concentrations. This failure to effectively
  activate GPR109A results in M1 macrophage polarisation, release of inflammatory
  cytokines, and exacerbated pulmonary inflammatory responses. QTJD increases the
  abundance of beneficial gut bacteria, particularly butyrate-producing strains, elevates
  butyrate levels, and activates the GPR109A receptor. (b) By elevating butyrate concentrations,
  QTJD activates GPR109A to inhibit the MAPK pathway, specifically suppressing ERK1/2
  expression. This converts macrophages towards an anti-inflammatory M2 phenotype,
  diminishing pro-inflammatory cytokine release and thereby mitigating inflammatory
  responses
article_title: Qingfei Tongluo Jiedu Formula Regulates M2 Macrophage Polarization
  via the Butyric Acid-GPR109A-MAPK Pathway for the Treatment of Mycoplasma pneumoniae
  Pneumonia
