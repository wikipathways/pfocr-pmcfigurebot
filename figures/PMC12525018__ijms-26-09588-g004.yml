  F3′H (flavonoid 3′-hydroxylase), F3′5′H (flavonoid 3′,5′-hydroxylase), DFR (dihydroflavonol
  4-reductase), ANS (anthocyanidin synthase), UFGT (UDP-glucose: flavonoid 3-O-glucosyltransferase),
  and GST (glutathione S-transferase)'
