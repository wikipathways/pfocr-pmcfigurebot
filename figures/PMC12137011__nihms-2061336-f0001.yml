figure_title: Loss of PTEN activates PI3K pathway in HNSCC
caption: (A) PTEN protein expression in PTEN knockout (PTEN KO) Cal27 and FaDu human
  cell lines was significantly reduced compared to parental cells in conjunction with
  increased expression of phosphorylated AKT (pAKT). (B) PTEN protein expression in
  PTEN KO MOC1 or MOC22 murine cells was significantly reduced compared to parental
  cells in conjunction with increased expression of phosphorylated AKT (pAKT). (C)
  PTEN mRNA expression is significantly reduced in PTEN KO compared to parental MOC1
  and MOC22 cells (p<0.0001, as determined by the student’s t-test). The data presented
  is a mean of triplicate measurements and SD of each group. The experiment was conducted
  twice with representative data from one experiment is shown. (D) Protein expression
  of FLAG-tagged proteins in amplified WT PIK3CA, PIK3CA-E545K, or PIK3CA-H1047R MOC1
  tumors confirmed the presence of genetically engineered expression constructs. PI3K
  activation, as measured by pAKT expression, consistently increased in engineered
  MOC1 tumors compared to parental tumors (p<0.0001 for all groups). Each lane represents
  a distinct xenograft tumor derived from the engineered cell lines as indicated.
  The mean densitometry measurement and SEM of pAKT level is shown. *** p< 0.001 determined
  by the Dunnett’s method
article_title: Blockade of the PGE2 pathway inhibits the growth of PTEN deficient
