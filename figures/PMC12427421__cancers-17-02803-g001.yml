figure_title: KRAS signaling pathway, adaptation and resistance mechanisms to G12C-specific
  inhibitors.
caption: KRAS signaling pathway, adaptation and resistance mechanisms to G12C-specific
  inhibitors. (A). KRAS G12C-mutant cancers display an increased downstream activation
  of the survival pathways through the RAS-MAPK and the RAS-PI3K axes. (B) In the
  presence of selective G12C inhibitors (sotorasib, adagrasib, and divarasib), the
  KRAS G12C protein is locked in the GDP-bound inactive state, leading to a dramatic
  reduction in downstream signaling. (C) On-target resistance mechanisms, consisting
  of KRAS amplification and/or the emergence of additional KRAS variants that are
  insensitive to the activity of the G12C-specific inhibitor, restore the downstream
  signaling pathways. (D) Off-target resistance mechanisms consist of the activation
  of bypass signaling pathways upstream or downstream of the KRAS G12C protein through
  acquired gene amplification or mutation (sparks). See the text for details. Figure
  generated with BioRender™
