caption: Effect of 20% ethanolic extract from Stewartia pseudocamellia Maxim. Leaves
  (ESP) on hypothalamic-pituitary-adrenal (HPA) axis-related pathway of brain tissue
  in CUMS-induced mice. Western blot images of protein bands (a). Relative protein
  expression of CRF, ACTH, CYP11B1, GR, and BDNF (b) was normalized to β-actin. Values
  are presented as the mean ± SD (n = 3). Different lowercase letters (a, b) above
  the bars indicate statistically significant differences between groups (p < 0.05).
  Bars marked with the same letter indicate no statistically significant differences
  between groups. One-way ANOVA followed by Tukey’s post hoc test was applied for
  statistical analysis
