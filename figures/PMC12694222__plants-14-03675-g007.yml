figure_title: GO enrichment analysis of candidate genes from the combined Premature
  and Intermediate populations.
caption: 'GO enrichment analysis of candidate genes from the combined Premature and
  Intermediate populations. The analysis was performed on pooled gene lists associated
  with up to the top 100 predictive SNPs from the Bootstrap Forest models in both
  populations. (a) The combined analysis for leaf rust resistance reveals a strong
  enrichment for defense-related pathways, including ‘chitinase activity’ and ‘immune
  response’. (b) For the combined green bean yield trait, the analysis is characterized
  by a strong enrichment for pathways related to ‘actin cytoskeleton regulation’.
  (c) The addition of coffee bean production traits retains the dominant actin regulation
  theme while also introducing pathways related to ‘salicylic acid-mediated signaling’.
  (d) When all three traits (yield, green bean, and rust) are combined, the enrichment
  profile highlights pathways involved in ‘phosphatidylinositol metabolism’ and ‘sulfate
  transmembrane transport’. In all plots, the x-axis represents the fold enrichment,
  the point size corresponds to the number of genes, and the color indicates statistical
  significance based on the −log10(FDR). Abbreviations used: reg., regulation; proc.,
  process'
