figure_title: C/EBPβ deficient keratinocytes activate extrinsic apoptotic pathways
  following UVB exposure
caption: A) BALB/MK2 keratinocytes were transfected with control or C/EBPβ targeting
  siRNA. 48 hours post-transfection cells were treated with 10 mJ/cm2 UVB. Cells were
  collected 4, 8, 12, and 16 hours post-UVB. Immunoblot analysis for cleaved Caspase-8,
  C/EBPβ, and β-actin was conducted. B) BALB/MK2 keratinocytes were transfected with
  control, Bid, or C/EBPβ targeting siRNA. 48 hours post-transfection cells were treated
  with 10 mJ/cm2 UVB. Cells were collected 8 hours post-UVB. Immunoblot analysis for
  cleaved Caspase-3, Bid, C/EBPβ, and β-actin was conducted. C) BALB/MK2 keratinocytes
  were transfected with control or C/EBPβ targeting siRNA. 48 hours post-transfection
  cells were pre-treated with 10 or 50 μM BI-6C9 for 30 minutes. BALB/MK2 mouse keratinocytes
  were then treated with 10 mJ/cm2 UVB and were collected 8 hours post-UVB. Immunoblot
  analysis for cleaved Caspase-3, C/EBPβ, and β-actin was conducted
