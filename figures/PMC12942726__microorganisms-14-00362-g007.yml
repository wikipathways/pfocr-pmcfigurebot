figure_title: Metagenomic functional profiling of the pseudotumor tissue.
caption: 'Metagenomic functional profiling of the pseudotumor tissue. (A): KEGG pathway
  composition calculated from CPM-normalized gene abundances, where the bolded terms
  represent the dominant pathways in each secondary KEGG pathway category by relative
  abundance, and the red-labeled pathways are the key pathways focused on in this
  study; notable enrichment was observed in cancer-related pathways (e.g., Viral carcinogenesis)
  and metabolic pathways. (B): KEGG gene composition based on CPM-normalized abundances,
  identifying highly represented genes such as myo3 and cancer-associated markers
  (e.g., fam83). (C): Gene correlation network constructed using genes with high CPM
  values, illustrating the association of myo3 with multiple tumor-related genes'
