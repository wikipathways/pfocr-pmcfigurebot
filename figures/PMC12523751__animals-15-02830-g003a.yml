caption: Metabolomic profiling of sericin-treated cryopreserved semen in Chengde hornless
  goats. (a) OPLS-DA score plots illustrating metabolic separation between groups.
  (b) Permutation validation plots for OPLS-DA models. The dashed lines represent
  the trend lines for the R2Y (green) and Q2 (blue) permutation data, respectively.
  (c) Volcano plot of differential metabolite screening. (d) Hierarchical cluster
  heatmap of significantly altered metabolites, conD1–conD6” denote six biological
  replicates of the untreated control group. “serD1–serD6” represent six biological
  replicates treated with 0.6% sericin. (e) KEGG pathway enrichment analysis of differential
  metabolites. (f) Correlation analysis between key metabolites. * represents significant
  difference, ** represents extremely significant difference, and *** represents more
  extremely significant difference. (g) ROC curve analysis of glutamine (h) ROC curve
  analysis of taurine
