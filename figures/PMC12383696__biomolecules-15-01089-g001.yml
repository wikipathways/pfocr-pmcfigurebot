figure_title: The molecular framework for hormone- and age-mediated adventitious root
  (AR) formation in cuttings.
caption: The molecular framework for hormone- and age-mediated adventitious root (AR)
  formation in cuttings. MicroRNA 156 (miR156), the hub regulator of juvenility, regulates
  the jasmonic acid (JA)-mediated wound signaling pathway, subsequently promoting
  auxin synthesis in angiosperms. DAL1, an age marker gene in gymnosperms, might be
  involved in AR formation by modulating auxin behavior. JA, acting as a wound signal,
  directly promotes auxin synthesis to enhance AR formation in cuttings. Under stress
  conditions, JA and ABA collaboratively amplify ABA signals to protect rooting in
  cuttings
