figure_title: The FGF-MAPK pathway is unaffected by PLCγ1 inactivation
caption: '(A) Expression of Fgf10 in the periocular mesenchyme and Fgfr2 in the lacrimal
  gland epithelium was unchanged in PLCγ1 mutants. Scale bar: 50 μm.(B) Heterozygous
  deletion of Fgfr2 and homozygous deletion of Fgfr1 failed to rescue the ectopic
  branching defects in PLCγ1 mutants (arrowheads). Scale bar: 1 mm.(C) Quantification
  of lacrimal gland branches at P1. One-way ANOVA, n = 10 for control, n = 6 for Le-Cre;PLCγ1flox/flox;Fgfr2flox/+
  and n = 5 for Le-Cre;PLCγ1flox/flox; Fgfr1flox/flox;Fgfr2flox/+; N.S., not significant.(D)
  PLCγ1 deletion did not affect the expression of FGF response genes Etv4 and Etv5
  and ERK phosphorylation (dotted lines). Scale bar: 50 μm.(E) Relative pERK intensity
  in the lacrimal gland bud normalized against the retina. Student’s t test, n = 3;
  N.S., not significant.(F) Excessive lacrimal gland branching was not alleviated
  after the removal of one copy of Shp2 in PLCγ1 mutants or induced by activation
  of MAPK signaling in Le-Cre;MEK1DD/+ animals. Scale bar: 1 mm.(G) Quantification
  of lacrimal gland branches at P1. One-way ANOVA, n = 12, *p < 0.0001; N.S., not
  significant.Data are represented as mean ± SEM'
article_title: FGF-induced phospholipase Cγ signaling regulates lacrimal gland branching
  by competing with PI3K in phosphoinositide metabolism
