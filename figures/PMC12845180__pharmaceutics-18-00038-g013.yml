figure_title: Proposed mechanistic model of the synergistic anticancer effects of
  sitagliptin and doxorubicin in HeLa cells.
caption: Proposed mechanistic model of the synergistic anticancer effects of sitagliptin
  and doxorubicin in HeLa cells. Sitagliptin treatment leads to transcriptional downregulation
  of Akt and ERK mRNA, resulting in decreased expression of MMP-1/2 and TIMP-1/2,
  which collectively suppress cell migration and invasion. Doxorubicin induces reactive
  oxygen species (ROS) generation, triggering caspase-8/9 activation and subsequent
  apoptosis. In parallel, doxorubicin also contributes to ERK mRNA downregulation,
  consistent with qRT-PCR findings. The combination of sitagliptin and doxorubicin
  produces a synergistic anticancer effect (CI < 1), amplifying apoptotic signaling
  and anti-metastatic outcomes. This model is based on transcriptional and functional
  data obtained in the present study and illustrates the integrated pathways underlying
  migration/invasion inhibition and metastasis suppression
article_title: Sitagliptin Potentiates the Anticancer Activity of Doxorubicin Through
  ROS-Driven Apoptosis and MMP/TIMP Regulation in HeLa Cells
