figure_title: Host transcriptomic and proteomic signatures of sepsis mortality
caption: '(A) Volcano plot highlighting DE genes based on in-hospital mortality from
  whole-blood transcriptomics of sepsis patients. Genes in gold (upregulated) or blue
  (downregulated) were significant (FDR <0.1, corrected for multiple testing using
  the Benjamini-Hochberg method; n = 18,354 genes). (B) Normalized expression of exemplary
  DE genes based on sepsis mortality. Each dot is a patient, and lines represent median
  and quartile ranges. (C) Over-representation analysis (ORA) of DE genes demonstrating
  pathways enriched in sepsis patients with in-hospital mortality (gold) versus survival
  (blue). Pathways represent the top 15 most significant up or down-regulated pathways
  identified at a padj <0.05. (D) Concentrations of plasma inflammatory cytokines
  based on sepsis mortality. P values in D are derived from Wilcoxon tests, adjusted
  for multiple comparisons using the Benjamini-Hochberg method (8 cytokines). Complete
  results of DE analyses are available in Supp. Data 1, and ORA results in Supp. Data
  2. Legend: * = padj < 0.05, ** = padj < 0.01, *** = padj < 0.001, **** = padj <
  0.0001. Host data available for n = 123 patients'
article_title: Host-microbe multiomic profiling predicts mortality in sepsis
