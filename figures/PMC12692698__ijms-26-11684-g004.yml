caption: Analysis of Stemness-Related lncRNA Interacting Proteins and Drug Sensitivity.
  (a) GO enrichment analysis of the mRNAsi-lncRNA interactome in LGG. (b) KEGG pathway
  enrichment analysis of the mRNAsi-lncRNA interactome in LGG. (c) GO enrichment analysis
  of the mDNAsi-lncRNA interactome in LGG. (d) KEGG pathway enrichment analysis of
  the mDNAsi-lncRNA interactome in LGG. the color of the bars (or dots) represents
  the statistical significance of the enrichment, often indicated by the adjusted
  p-value, where a darker color indicates a smaller (more significant) p-value. The
  length of the bars represents the Gene Count. (e,f) Sankey diagrams illustrating
  potential lncRNA–protein–drug interaction axes. These diagrams show the flow from
  core lncRNAs (left) to their interacting proteins (middle) and associated potential
  drugs (right) for (e) the mRNAsi-related network and (f) the mDNAsi-related network
