figure_title: ATP2B1 deficiency regulates Norrin/Frizzled4 signaling through the calcineurin/NFAT
  pathway
caption: (A-B) bEnd.3 cells were transfected with the indicated siRNAs and analyzed
  with RT-qPCR for Erg3 or Nr4a2 after stimulation with vehicle 1 μg/ml cyclosporin
  A, a calcineurin inhibitor. Two technical replicates per biological replicate were
  averaged, n=2 biological replicates, graphs represent mean +/− SEM, one-way ANOVA
  with Tukey’s post hoc. (C) Stable bEnd.3 TOPFlash cells were transfected with the
  indicated siRNAs and stimulated with vehicle, Norrin or Norrin and 1 μg/ml cyclosporin
  A. n=9 biological replicates, graphs represent mean +/− SEM, one-way ANOVA with
  Tukey’s post hoc. (D-E) bEnd.3 cells were infected with CA-NFAT2 lentivirus and
  selected with blasticidin. mRNA expression of Erg3 and Nr4a2 was assessed by RT-qPCR
  in parental bEnd.3 cells vs. CA-NFAT2 expressing cells. Two technical replicates
  per biological replicate were averaged, n=2 biological replicates, graphs represent
  mean +/− SEM, unpaired t-test. (F-G) Parental or CA-NFAT2 expressing bEnd.3 cells
  were stimulated with vehicle or Norrin and Axin2 and P2ry1 mRNA expression was assessed
  by RT-qPCR. Two technical replicates per biological replicate were averaged, n=2
  biological replicates, graphs represent mean +/− SEM, one-way ANOVA with Tukey’s
  post hoc
