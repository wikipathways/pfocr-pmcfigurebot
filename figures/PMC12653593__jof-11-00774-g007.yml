caption: Amino acid sequence identity and similarity matrices of bioluminescence pathway
  genes in the species of the Omphalotus, Armillaria, and Mycenoid lineages. Data
  on top right are the percent similarity and the bottom left are the percent identity.
  The species used in the analysis are M. citricolor (mci), M. chlorophos (mch), P.
  stipticus (ps), A. mellea (am), A. fuscipes (af), Omphalotus olearius (oo), N. nambi
  (nm), and N. gardneri (ng). Genes that encode enzymes involved in the bioluminescence
  pathway are hispidin synthase (hisps), luciferase (luz), and hispidin 3-hydroxylase
  (h3h)
