figure_title: Auxin signaling pathways in Arabidopsis.
caption: Auxin signaling pathways in Arabidopsis. The ABLs and ABP1 proteins physically
  interact with TMK1, forming a complex on the PM to sense auxin, which facilitates
  the interaction between TMK1 and PIN2, resulting in the phosphorylation of PIN2
  and the asymmetric auxin flow. High concentration of auxin facilitates the cleavage
  of the TMK1 C-terminal domain (TMK1C). TMK1C then enters the nucleus, where it inhibits
  ARF-mediated gene expression by phosphorylating and stabilizing IAA proteins. In
  the nucleus, auxin binds to TIR1/AFBs via its auxiliary LRR domain while its F-box
  domain interacts with SCF through ASK1 protein, which subsequently mediates the
  degradation of Aux/IAA, thereby releasing the ARF to regulate the expression of
  down-stream genes. TIR1/AFB auxin receptors possess AC activity, thereby generating
  cAMP upon auxin binding. Local production of cAMP within the Aux/IAA-ARF regulatory
  niche circumvents auxin perception, promotes the degradation of Aux/IAAs, and activates
  ARF-mediated transcription. Auxin also binds to nucleus SKP2a, facilitating its
  interaction with cell cycle-related proteins E2Fc and DPB, which subsequently triggers
  the degradation of these proteins, thereby activating the expression of cell cycle-related
  genes. Auxin also enhances the interaction between GLP1 and PTRE1, facilitating
  PTRE1 retention at the plasma membrane. This redistribution of PTRE1 reduces nuclear
  26S proteasome activity, leading to decreased degradation of Aux/IAA proteins. Auxin
  enters the plant cell through AUX1. In the cytoplasm, AFB1 triggers a rapid auxin
  response that relies on CNGC14-mediated Ca2+ signaling. PM, plasma membrane. Dashed
  arrows denote processes that have yet to be clearly elucidated
