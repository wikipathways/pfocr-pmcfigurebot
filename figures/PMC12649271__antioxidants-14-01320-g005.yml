figure_title: Promoting effects of CHA on non-essential amino acid (NEAA) metabolism
  in the skin of a photoaged mouse model.
caption: Promoting effects of CHA on non-essential amino acid (NEAA) metabolism in
  the skin of a photoaged mouse model. (A) Schematic representation of the NEAA metabolism
  pathway in CHA-treated mouse skin. Metabolites labeled in red and green were detected
  by UPLC-MS/MS. Red indicates upregulation, while green indicates downregulation
  in the CHA group compared to the MC group. Arrows indicate enzymatic conversions
  within the pathway. (B) The relative intensity of indicated NEAAs is presented as
  mean ± SD (n = 6). * p < 0.05, ** p < 0.01, *** p < 0.001, compared to the MC group.
  ns indicates no significant difference when compared to the MC group. N-acetyl-L-aspartic
  acid, arginine, sarcosine, glutathione, glutamic acid, and proline were identified
  as Level 1 (i.e., matching their retention time and accurate mass with the standards
  and MS/MS fragment score > 45); aspartic acid, serine, and cystathionine were identified
  as Level 2 (i.e., matching their retention time and accurate mass with the standards
  and MS/MS fragment score < 45). The detailed identification of N-acetyl-L-aspartic
  acid, arginine, sarcosine, glutathione, glutamic acid, and proline can be seen in
  Table S3
