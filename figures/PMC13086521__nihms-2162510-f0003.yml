figure_title: Transition rates and coupling; to a membrane potential.
caption: "Transition rates and coupling; to a membrane potential. (Top) Schematic
  representation of the PMF governing the i→j and j→i transitions. The PMF in the
  absence (solid lene) and in the presence (dashed line) of the membrane potential
  is shown, with W(x;Vmp)=W0(x)—\U0001D4AC(x)Vmp. (Bottom) The quantity \U0001D4AC(x)
  is the effective charge which provides the coupling of the system to the membrane
  potential Vmp along the reaction coordinate x along the transition pathway between
  adjacent states of the transport cycle, as defined by Eq. (11). Increasing \U0001D4AC(x)
  is associated with the forward movement of a positive charge in the x direction
  toward the extracellular side"
