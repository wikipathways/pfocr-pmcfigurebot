figure_title: (a) Relationship between scattering in the object plane and crosstalk
  at the lens array.
caption: '(a) Relationship between scattering in the object plane and crosstalk at
  the lens array. For non-scattering (1) or modestly scattering samples (2), all light
  ends up in the correct channel. For more diffusive samples where the transport mean-free
  path length approaches the beam spacing (3), scattering crosstalk occurs. Scattering
  crosstalk was measured by a CMOS image sensor in the detection pathway for a non-scattering
  sample [(b), (d), and (f)] and a scattering tendon specimen [(c), (e), and (g)]
  when illuminated with a single beam corresponding to the SiPM #3 detection path.
  Both samples are imaged close to the superficial surface of the specimen (~0 μm).
  (b), (c) CMOS images show crosstalk onto adjacent channels and (d), (e) show the
  corresponding contrast enhanced images. (f), (g) Light collected across the 4 SiPM
  active areas is plotted, showing increased crosstalk as scattering increases'
