figure_title: Functional clustering of significantly enriched pathways for interactor
  miRNAs in HPV-16.
caption: Functional clustering of significantly enriched pathways for interactor miRNAs
  in HPV-16. The heatmap displays pathways (rows) clustered by functional similarity
  (Euclidean distance) based on miRNA target gene overlap. Pathways were determined
  with Fisher’s exact test, and statistical significance was defined as P < .05. Color
  intensity represents enrichment strength |–log10FDR|, with red indicating the highest
  significance. FDR, false discovery rate; HPV, human papillomavirus; KEGG, Kyoto
  Encyclopedia of Genes and Genomes; miRNA, micro RNA
