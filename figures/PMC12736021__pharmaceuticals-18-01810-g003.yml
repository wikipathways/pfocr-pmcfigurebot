caption: EMO inhibits RSG-induced adipogenesis via the SREBP1 pathway in ob/ob mice.
  (A–E) Relative mRNA levels of Srebp1 and downstream adipogenic targets (Acc1, Acc2,
  Fasn, and Scd1) in iSAT. (F,G) Western blot analysis of SREBP1 and phosphorylated
  ACC (inactive form) in iSAT, with densitometric densitometry. (H–L) Relative mRNA
  expression of Srebp1 and downstream adipogenic targets (Acc1, Acc2, Fasn, and Scd1)
  in eWAT. (M,N) Western blot analysis of SREBP1 and phosphorylated ACC in eWAT, with
  densitometry. All Western blots were performed in triplicate. Data are presented
  as mean ± SEM (n = 3–5 per group). * p < 0.05, ** p < 0.01, *** p < 0.001, and ****
  p < 0.0001 vs. indicated group
