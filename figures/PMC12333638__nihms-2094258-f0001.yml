figure_title: Critical events implicated in NET formation and its role in various
  pathophysiological conditions.
caption: 'Critical events implicated in NET formation and its role in various pathophysiological
  conditions. Atherosclerosis risk factors can trigger NETosis within blood vessels
  (listed in the yellow circle). NADPH oxidase produces ROS, such as superoxide anion
  (O2−) and hydrogen peroxide (H2O2), which subsequently affect PAD4. PAD4 catalyses
  the deimination of arginine residues in histones, producing citrulline. The citrullination
  of histones leads to chromatin decondensation, a crucial step in NET formation.
  Additionally, MPO promotes NE release from the azurophilic granules in a ROS-dependent
  manner. NE is further involved in histone degradation, thus contributing to chromatin
  decondensation and NET formation. Simultaneously, NE mediates the proteolytic activation
  of the pyroptosis-associated protein gasdermin D, which, together with caspase-11,
  also mediates NETosis. TLRs are important activators of NET, acting through various
  signalling pathways (such as ERK and p38) (missing steps are depicted with dotted
  arrows), promoting NET formation. High levels of LDL and oxLDL, associated with
  HFD and hypercholesterolaemia, have been shown to promote NETosis, whereas HDL suppresses
  it. Moreover, hypercholesterolaemia has been shown to suppress DNase activity, thereby
  impairing NET clearance. NOD1 represents another NET-promoting mechanism activated
  by HFD. MiR-146a promotes NET formation by targeting SOD2, thereby enhancing ROS
  production. Finally, NET participates in the development of other diseases. Positive
  regulation is depicted with green arrows, while negative regulation is indicated
  with red blunt lines. Abbreviations: Nicotinamide adenine dinucleotide phosphate
  (NADPH); reactive oxygen species (ROS); peptidyl arginine deiminase 4 (PAD4); myeloperoxidase
  (MPO); neutrophil elastase (NE); toll-like receptors (TLRs); extracellular signal-regulated
  kinases (ERK); oxidised low-density lipoprotein (oxLDL); high-fat diet (HFD); high-density
  lipoproteins (HDL); superoxide dismutase (SOD); nucleotide-binding oligomerisation
  domain 1 (NOD1)'
