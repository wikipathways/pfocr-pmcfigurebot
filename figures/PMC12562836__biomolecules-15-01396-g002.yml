figure_title: EC359 inhibits LIFR downstream signaling and reduces tumor growth in
  vivo.
caption: EC359 inhibits LIFR downstream signaling and reduces tumor growth in vivo.
  (A) RT-qPCR analysis showing reduced expression of LIFR downstream target genes
  in Ras/Raf mutant cell lines following EC359 (100 nM-7 h) treatment compared to
  control. (B) Western blot analysis demonstrating decreased levels of phosphorylated
  STAT3 and other LIFR pathway effectors in EC359-treated cell lines. (C) Tumor volume
  measurements over time show significant reduction in tumor growth in EC359-treated
  mice compared to vehicle-treated controls bearing OVCAR8 xenografts. (D) Final tumor
  weight at the end of the treatment period was significantly lower in the EC359 group
  compared to vehicle. (E) Body weight of mice treated with EC359, or vehicle remained
  unchanged throughout the study, indicating lack of overt systemic toxicity. Data
  presented as mean ± SEM; significance was determined by two-way ANOVA; ** p < 0.01;
  *** p < 0.001; **** p < 0.0001
