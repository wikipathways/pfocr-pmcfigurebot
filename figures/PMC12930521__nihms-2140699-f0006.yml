figure_title: Reticulospinal tract excitability assessed via the StartReact paradigm
  remains unchanged following motor skill and resistance training
caption: '(a) StartReact paradigm to assess RST excitability. Participants sat in
  a Biodex chair and performed a rapid isometric dorsiflexion reaction task in response
  to visual and auditory cues. Real-time torque biofeedback was provided during testing
  to guide performance. (b). Schematic of the auditory startle pathway. The StartReact
  response assesses RST output gain non-invasively. Auditory signals from the cochlear
  nucleus activate giant neurons in the pontomedullary reticular formation, which
  then transmit signals via the RST to motoneurons for rapid motor responses. (c)
  Representative StartReact trial and RST gain calculation for representative participant
  ASR001. Torque (top) and tibialis anterior EMG profiles (bottom) show responses
  to each cue type: visual, visual + auditory (80 dB), and visual + startling stimulus
  (120 dB). The target contraction was set to 30% of MVC. (d) Individual reaction
  times from the trial shown in (c), plotted for each cue condition. Reaction times
  and variability decrease in response to the startling auditory cue, reflecting a
  startle response. (e, f) Group-level data are presented as mean values with error
  bars representing the standard deviation. (e) Reticulospinal tract gain. Group-level
  RST gain values before and after motor skill and resistance training. ‘X’ marker
  below plots indicates Bonferroni-corrected significant contribution of the RST at
  each timepoint based on one-sample tests against μ = 1 (‘X’ p < 0.05, ‘XX’ p < 0.01,
  ‘n.s.’ p > 0.05). (f) Training-induced percent changes in RST gain. Neither training
  protocol measurably altered the influence of the reticulospinal tract on the rapid
  initiation of a prepared movement in response to a startling stimulus'
article_title: Transient effects in corticospinal and reticulospinal tract excitability
  induced by motor skill and isometric resistance training
