figure_title: Schematic overview of gut microbiota-derived metabolites regulating
  peripheral and central pain sensitization through neural, immune, and endocrine
  pathways.
caption: Schematic overview of gut microbiota-derived metabolites regulating peripheral
  and central pain sensitization through neural, immune, and endocrine pathways. Created
  with BioRender.com. At the bottom of Figure 6, microbial fermentation produces microbial
  metabolites like SCFAs, BAs, and neurotransmitters (e.g., serotonin, GABA), while
  structural components of microbes provide PAMPs such as LPS and peptidoglycans.
  On the left (neural pathway), vagal and spinal pathways convey microbial signals,
  with epithelial mediators such as serotonin from enterochromaffin cells and acetylcholine
  from neuropods, together with cytokines, directly modulating dorsal root ganglion
  excitability via different receptors. Mast cell-derived histamine also activates
  vagal/spinal pathways, stimulating spinal microglia to release pro-inflammatory
  cytokines, thereby bridging peripheral inputs and central sensitization. In the
  center (immune pathway), LPS and other microbial products activate immune cells,
  inducing TNF-α, IL-1β, and IL-6 that amplify nociceptive signaling. Anti-inflammatory
  regulation occurs through SCFAs acting on GPR43/41/109A and inhibiting HDACs, as
  well as kynurenic acid acting on GPR35. On the right (endocrine pathway), chronic
  pain results in a dysfunctional HPA axis with hyper- or hypocortisolism. Acute cortisol
  exerts anti-inflammatory effects, whereas chronic dysregulation promotes gut permeability.
  This promotes LPS translocation and alters bile acid and polyamine metabolism, which
  act on immune cells to drive pro-inflammatory cytokine release. In parallel, tryptophan
  metabolism is shifted toward serotonin and melatonin pathways, linking endocrine
  signaling with immune responses, sleep regulation, and nociceptive sensitivity.
  At the top (central sensitization), pro-inflammatory cytokines disrupt the blood–brain
  barrier, activating microglia to release glutamate, ATP, and PGE2, enhancing NMDA
  receptor phosphorylation, reducing GABAergic tone, and sustaining neuroinflammation
  and nociceptive hypersensitivity
