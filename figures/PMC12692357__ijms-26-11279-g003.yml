caption: 'Genetic and epigenetic regulation of IL-6 and mCRP/CRP expression in response
  to stress and mechanical stimuli: This schematic illustrates the multifactorial
  regulation of interleukin-6 (IL-6) and C-reactive protein (CRP) expression, integrating
  genetic, epigenetic, mechanical, and psychological inputs. Single nucleotide polymorphisms
  (SNPs) in the IL6 and CRP genes (left) modulate transcriptional responsiveness to
  internal and external stimuli. Mechanical forces such as shear stress activate mechanosensitive
  pathways (e.g., PIEZO1/2 ion channels, integrins, and shear stress–responsive elements
  [SSREs]) that induce IL-6 and CRP expression. Stress activates the hypothalamic–pituitary–adrenal
  (HPA) axis, and its regulation is influenced by genetic variants in NR3C1 (glucocorticoid
  receptor gene), which in turn modulate the feedback of inflammatory cytokine expression.
  Epigenetic modifications, including histone acetylation and DNA methylation, further
  fine-tune the transcriptional landscape of the IL-6 and CRP genes and are influenced
  by early-life stress, environmental exposure, and chronic psychological load. MicroRNAs
  (e.g., miR-146a and miR-155) act as posttranscriptional regulators of the IL-6/CRP
  pathway and are also responsive to stress-induced epigenetic reprogramming. The
  convergence of these regulatory layers culminates in increased IL-6 and CRP expression,
  promoting systemic inflammation and contributing to stress-related pathologies.
  The solid arrows represent direct regulatory relationships; the dashed arrows indicate
  inductive or modulatory effects'
