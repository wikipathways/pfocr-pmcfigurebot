figure_title: Global transcriptomic analysis reveals minor impacts of GSDME during
  H1N1 IAV infection
caption: A-G WT and Gsdme−/− mice were mock-infected or infected with 50 TCID50 of
  PR8 intranasally, and bulk lung RNA was isolated at day 7 post-infection for sequencing.
  A Principal component analysis of bulk lung transcriptomes. Open circles indicate
  mock-infected mice, and closed circles indicate PR8-infected mice. Color indicates
  genotype. B Volcano plots of differential gene expression results comparing (left)
  mock-infected Gsdme−/− to mock-infected WT lungs and (right) PR8-infected Gsdme−/−
  to PR8-infected WT lungs. Significant DEG are indicated by color, with blue indicating
  downregulation and red indicating upregulation (log2fc |0.58|; p-value adj 0.01).
  For the mock comparison (left), there are 8 downregulated and 8 upregulated DEG.
  For the infected comparison (right), there are 3 downregulated DEG and 116 upregulated
  DEG. C-D Differential gene expression results comparing PR8-infected lungs with
  mock-infected lungs for each genotype. 7494 DEG were identified (log2fc |0.58|;
  p-value adj 0.01). C Venn diagram comparing DEG overlap. D Differential expression
  heatmap of the 7494 DEG arranged by hierarchical clustering using Euclidean distance.
  Blue indicates downregulation during infection, and red indicates upregulation during
  infection. Colored bar (left) indicates gene clusters. E Violin plot showing log2fc
  values of interferon (IFN) stimulated genes for the indicated comparisons. Significance
  determined by one-way ANOVA with Tukey’s HSD test. F Bar graph of top GO term enrichment
  results for the gene sets from the Venn diagram in panel C. Blue indicates pathways
  enriched for the 2012 DEG unique to WT lungs; pink for the 534 DEG unique to Gsdme−/−
  lungs; green for the 4948 DEG shared between genotypes. X-axis indicates significance
  of enrichment. G Selected antiviral and inflammatory gene set enrichment analysis
  (GSEA) results for each genotype. Bubble size indicates significance, and color
  indicates pathway enrichment score
