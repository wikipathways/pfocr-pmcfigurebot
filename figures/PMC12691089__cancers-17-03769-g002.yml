figure_title: Therapeutic targets for chromatin remodeling genomic alterations, mismatch
  repair deficiency, microsatellite instability, and germline DNA damage repair pathway
  mutations in WT-KRAS PDAC.
caption: 'Therapeutic targets for chromatin remodeling genomic alterations, mismatch
  repair deficiency, microsatellite instability, and germline DNA damage repair pathway
  mutations in WT-KRAS PDAC. The figure summarizes three molecular vulnerability categories
  in KRAS–WT PDAC: chromatin remodeling alterations with two therapeutic targets:
  ARID1A and SMARCA4; mismatch repair deficiency phenotype prone to effective PD-1
  blockade; and germline DDR-mutated tumors exhibiting synthetic lethality with PARP
  inhibition and sensitivity to platinum-based chemotherapy or ATR inhibition. Abbreviations:
  dMMR—mismatch repair deficient; MSI—microsatellite instability; DDR—DNA damage repair;
  PARP—poly ADP ribose polymerase; ATR—ataxia telangiectasia and Rad3-related; SWI/SNF—switch/sucrose
  non-fermentable complex; EZH2—enhancer of zeste homolog 2; ICI—immune checkpoint
  inhibitor; PI3K—Phosphoinositide 3-Kinase; AKT—Protein Kinase B; mTOR—Mechanistic
  Target of Rapamycin; CT—chemotherapy; SMARCA4—SWI/SNF-Related, Matrix-Associated,
  Actin-Dependent Regulator of Chromatin, Subfamily A, Member 4; ARID1A/ARID1B—AT-Rich
  Interaction Domain 1A/1B; PROTAC—Proteolysis-Targeting Chimera; CDK4/6—cyclin-dependent
  kinase 4/6; AURKA—Aurora Kinase A; HRD—homologous recombination deficiency; PD-1
  and PD-L1—programmed death-1 and -ligand 1; BRCA1/2—Breast Cancer Type 1/2 Susceptibility
  Protein; ATM—ataxia telangiectasia mutated; BAP1—BRCA1-Associated Protein 1; RAD50—RAD50
  Double-Strand Break Repair Protein; FANCE—Fanconi Anemia Complementation Group E
  Protein; PALB2—partner and localizer of BRCA2; CHEK2—checkpoint kinase 2'
