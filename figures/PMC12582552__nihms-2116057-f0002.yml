figure_title: CME disruption but not CIE disruption induced endodermal suberization
caption: (a) (Left) Boxplot of root endodermal suberin occupancy values from Col-0
  WT and mutants defective in the clathrin mediated endocytosis (CME) pathway, (right)
  representative images of 6 days old Col-0 WT, chc 1–3, chc 2–1 and the tamoxifen(tam)
  inducible CHC-HUB1 line showing FY suberin staining endodermal pattern. Tamoxifen-inducible
  CHC-HUB1 plants were treated with 2μM tamoxifen for 48 h. Data are the mean ± SD
  (N = 10–12 roots), ordinary one-way ANOVA followed by a Tukey–Kramer test; (****)
  p < 0.0001, (ns) non-significant differences. Results are representative of two
  independent experiments showing similar results. Asterisks indicate significant
  differences between Col-0 and genotypes/treatments. Box = interquartile range between
  the lower and upper quartiles, center line = median, + = mean, whiskers = min and
  max values. Scale bars = 1 mm.(b) (Left) Boxplot of root endodermal suberin occupancy
  values from untreated and treated flot1 mutant plants with 30μM of ES9–17 or ES-2,
  Col-0 WT untreated was included as internal control. (Right) representative images
  of 6 days old flot1 mutant plants showing FY suberin staining endodermal pattern.
  Data are the mean ± SD (N = 10–14 roots), one-way ANOVA followed by a Tukey–Kramer
  test; (****) p < 0.0001. Results are representative of two independent experiments
  showing similar results. Asterisks indicate significant differences between untreated
  and treated plants. Box = interquartile range between the lower and upper quartiles,
  center line = median, + = mean, whiskers = min and max values. Scale bars = 1 mm
