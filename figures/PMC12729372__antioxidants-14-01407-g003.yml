figure_title: The Nrf2–Keap1 signaling pathway in oxidative and electrophilic stress.
caption: The Nrf2–Keap1 signaling pathway in oxidative and electrophilic stress. Under
  normal conditions, nuclear factor erythroid 2–related factor 2 (Nrf2) remains bound
  to Kelch-like ECH-associated protein 1 (Keap1) in the cytoplasm, where Keap1 targets
  Nrf2 for ubiquitination and proteasomal degradation. Upon exposure to oxidative
  or electrophilic stress, structural modification of Keap1 cysteine residues causes
  Nrf2 release and nuclear translocation. In the nucleus, Nrf2 forms heterodimers
  with small Maf proteins and binds to antioxidant response elements (AREs), initiating
  transcription of cytoprotective and antioxidant genes, including heme oxygenase-1
  (HO-1), NAD(P)H:quinone oxidoreductase 1 (NQO1), superoxide dismutase (SOD), glutamate–cysteine
  ligase (GCL), and glutathione peroxidase. Activation of Nrf2 also suppresses pro-inflammatory
  mediators (TNF-α, IL-1β, IL-6, iNOS), inhibits NF-κB and MAPK signaling, preserves
  epithelial barrier integrity, and promotes mucosal healing
article_title: Nrf2 as a Molecular Guardian of Redox Balance and Barrier Integrity
