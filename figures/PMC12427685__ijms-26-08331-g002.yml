figure_title: Transcriptional reprogramming of lncRNAs and PCGs during pathogen challenge.
caption: 'Transcriptional reprogramming of lncRNAs and PCGs during pathogen challenge.
  (a) The number of DElncRNAs/DEPCGs across genotypes (WT vs. MPK6SR) under different
  infection conditions (|log2FC| ≥ 1, p value ≤ 0.05). (b) Schematic of plant immunity
  activation by Pst DC3000 and Pst DC3000 hrcC−, along with counts of DElncRNAs and
  DEPCGs under distinct pathogenic stimulations in WT and MPK6SR plants. (c) Intersectional
  relationships of MPK3/6-dependent and -independent transcript sets. (d) Proportional
  representation of DElncRNAs to DEPCGs in immune-related pathways. (ns: p > 0.05,
  Fisher’s exact test). (e,f) Comparative expression magnitude analysis of DElncRNAs
  and DEPCGs. Expression levels in each sample are computed in log2 (FPKM + 1) units.
  (**: p < 0.01, ****: p < 0.0001, Mann–Whitney U test)'
