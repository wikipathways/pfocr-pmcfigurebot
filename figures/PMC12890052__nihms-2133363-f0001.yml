figure_title: Overview of the dfPPI platform
caption: (A) The dfPPI (dysfunctional Protein-Protein Interactome) platform enables
  the identification of disease-specific PPI network dysfunctions through a chemoproteomic
  workflow. Section 1 involves sample preparation and interactome capture using epichaperome-targeting
  chemical probes immobilized on affinity matrices (e.g., PU-beads). Sections 2 and
  3 outline two compatible digestion workflows-on-bead or in-gel-followed by label-free
  LC-MS/MS for interactome identification. Computational analyses, including statistical
  modeling and pathway enrichment, are performed using the dfPPI bioinformatics pipeline,
  which is not covered in this protocol but is freely available at https://epichaperomics.mskcc.org/.
  (B) Principle of dfPPI. In disease-relevant contexts, endogenous epichaperomes form
  supramolecular scaffolds that reorganize PPI networks. Epichaperome-directed chemical
  probes (e.g., PU-beads or equivalent) capture these scaffolds together with their
  bound interactors directly from intact cells or from native lysates, yielding a
  multi-bait pull-down in a single experiment. Matched controls (e.g., inert-bead
  control and/or competition with free probe) can be processed in parallel. Captured
  material is eluted and digested on-bead or in-gel, analyzed by LC-MS/MS, and proteins
  are quantified (intensity or MS/MS spectral counts). The resulting interactome is
  used to compute differential interactors across conditions and to perform pathway/network
  enrichment, revealing context-specific PPI dysfunction at the systems level. The
  workflow requires no genetic tagging or overexpression, is compatible with both
  cells and tissues, and scales to cohort studies. Conversely, traditional affinity-purification-MS
  centers on one tagged bait at a time, producing a local neighborhood per construct
  and typically requiring many constructs/runs to sample a network. In contrast, dfPPI
  uses endogenous epichaperomes as the bait, capturing many dysfunctional PPIs simultaneously
  from the native system, which accelerates the discovery of disease-specific network
  rewiring and provides pathway-level readouts from a single capture. Please click
  here to view a larger version of this figure
