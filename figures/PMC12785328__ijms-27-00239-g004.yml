figure_title: Functional categorization of proteins identified in the root system
  of the tolerant winter-type KAWLR genotype Herat-740.
caption: Functional categorization of proteins identified in the root system of the
  tolerant winter-type KAWLR genotype Herat-740. Eight-day-old wheat seedlings were
  treated without or with T2 stress for 5 weeks. Proteins were extracted from the
  whole root system, and significantly changed proteins (p < 0.05) were identified
  using a gel-free proteomic technique. A total of 828 identified proteins were functionally
  categorized using MapMan bin codes. PS, photosynthesis-related proteins; CHO, carbohydrate;
  TCA, tricarboxylic acid; OPP, oxidative pentose pathway
