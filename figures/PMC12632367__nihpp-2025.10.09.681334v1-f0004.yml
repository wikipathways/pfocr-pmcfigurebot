figure_title: RHY-1 functions in an autoinhibitory feedback loop to protect from thiol
  toxicity and physically interacts with CYSL-1
caption: (a) Representative fluorescence images of rips-1p::GFP and rips-1p::GFP;rhy-1p::rhy-1
  worms after exposure of synchronized gravid adults to 0 mM, 5 mM, 7.5 mM, and 10
  mM DTT for 12 hours. Scale bar = 200 μm.(b) Quantification of fluorescence levels
  of rips-1p::GFP and rips-1p::GFP;rhy-1p::rhy-1 worms after exposure of synchronized
  gravid adults to 0 mM, 5 mM, 7.5 mM, and 10 mM DTT for 12 hours. ***P < 0.001, **P
  < 0.01, and *P < 0.05 via the t‐test. n.s., nonsignificant (n = 20–21 worms each).(c)
  Representative fluorescence images of worms expressing the indicated BiFC plasmid
  combinations with or without a 2-hour heat shock. Scale bar = 200 μm.(d) Quantification
  of fluorescence intensity in worms expressing empty pCE-BiFC-VN173 and pCE-BiFC-VC155
  vectors with or without heat shock. ns, nonsignificant via the t‐test (n = 35 worms
  each).(e) Quantification of fluorescence intensity in worms expressing RHY-1::VN173
  and CYSL-1::VC155 with or without heat shock. ***P < 0.001 via the t‐test (n = 35
  worms each).(f) Model for the autoinhibitory feedback loop of the hypoxia response
  pathway that protects from thiol toxicity
article_title: An acyltransferase protects Caenorhabditis elegans from thiol reductive
  stress through an autoinhibitory hypoxia response pathway
