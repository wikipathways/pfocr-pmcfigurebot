figure_title: Knockdown of DUSP6 in OCT4-overexpressing A549 cells decreases tumor
  growth and metastasis in mice.
caption: Knockdown of DUSP6 in OCT4-overexpressing A549 cells decreases tumor growth
  and metastasis in mice. (A) Tumor volumes of mice bearing DUSP6-knockdown or vector
  control A549/OCT4 tumors. NOD/SCID mice were subcutaneously inoculated with 1 ×
  106 cells of DUSP6-knockdown (n=6 for OCT4_shDUSP6#2; n=7 for OCT4_shDUSP6#4) or
  vector control A549/OCT4 cells (n=7 for OCT4_shLuc). Tumor volumes of the mice were
  measured. (B) Number of metastatic nodules in the lung of individual mice. (C) Representative
  gross and histologic (hematoxylin and eosin stain, × 200 magnification, scale bar
  = 1.0 mm) appearances of lungs on day 86. Arrows denote tumor nodules. (D) A schematic
  representation of the OCT4-DUSP6 axis involved in lung cancer progression. OCT4
  overexpression in NSCLC cells upregulates DUSP6. DUSP6 has been shown to function
  as a phosphatase for Notch1, thereby regulating Notch1 transmembrane/intracellular
  region (NTM) stability and Notch1 intracellular domain (NICD) transcriptional activity,
  resulting in driving tumor aggressiveness through MMP2 and MMP9 upregulation. The
  pathways in gray color have been reported previously
article_title: OCT4-mediated upregulation of DUSP6 promotes metastasis in non-small-cell
  lung cancer
