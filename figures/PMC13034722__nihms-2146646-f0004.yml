figure_title: Cell fate change of Rnf2WT/R70H NPCs into glial and microglia cells
caption: (A) Protocol to generate and differentiate NPCs.(B) Heatmap of DEG from ESCs
  vs. NPCs vs. differentiated NPCs (log2fold > 4, q < 0.01) and between WT and two
  clones of Rnf2WT/R70H ESCs, NPCs, and 12-day-old differentiated NPCs (log2fold >
  2, q < 0.01). n = 2 independent experimental replicates.(C) IFs of neuronal markers
  in WT and Rnf2WT/R70H differentiated NPCs. n = 3 independent experimental replicates.
  Scale bar, 10 μm.(D) WBs of PRC1 subunits from WT ESCs and Pcgf2 KO and Rnf2WT/R70H
  with and without Pcgf2.(E) Pictures of NPCs derived from cells in (D). n = 4 independent
  experimental replicates. Scale bar, 400 μm.(F) Strategy to generate NPCs expressing
  Ring1bWT, Ring1bR70H, or Ring1bI53A/D56K in PRC1CKO cells.(G) WBs of HA and Ring1b
  in PRC1CKO cells expressing Ring1bWT, Ring1bR70H, or Ring1bI53A/D56K in the presence
  and absence of OHT treatment for 48 h. Vinculin was used as a loading control.(H)
  Pictures of NPCs derived from cells in (G) in a constant presence of OHT treatment.
  n = 2. Scale bar, 400 μm.(I) WBs of Nanog, Pax6, and H2AK119ub in NPCs derived from
  PRC1CKO cells expressing Ring1bWT, Ring1bR70H, or Ring1bI53A/D56K. Vinculin was
  used as a loading control.(J) UMAP plots of scRNA-seq from 16-day-old WT and two
  clones of Rnf2WT/R70H differentiated NPCs. n = 2 independent experimental replicates.(K)
  Cell type proportions of cells from (E). *p < 0.05. ANOVA test.(L) KEGG pathway
  of WT and two clones of Rnf2WT/R70H NPCs.See also Figure S4
