caption: 'Diagram illustrating the role of the S100B protein, primarily produced and
  secreted by astrocytes, in neurological diseases, focusing on implications in AD
  and schizophrenia. The concentration of S100B rules the effects: low concentrations
  are neurotrophic, while high concentrations initiate neurotoxic and neuroinflammatory
  cascades. The neurotoxic pathway involves the activation of the RAGE receptor, subsequent
  MAPK and NFκB signaling, and, ultimately, the production of pro-inflammatory cytokines.
  These cytokines modulate the BBB by altering tight junction proteins and aquaporin-4
  expression, impacting the glymphatic system and leading to BBB disruption. The diagram
  then describes how high concentrations of S100B and BBB dysfunction contribute to
  AD (pink area and boxes) and schizophrenia (blue area and boxes). In both conditions,
  elevated S100B levels in CSF and serum lead to RAGE upregulation and further pro-inflammatory
  cytokine production, leading to cognitive impairment and psychiatric manifestations.
  Specific to AD, endothelial glycocalyx shedding contributes to BBB disruption. In
  schizophrenia, BBB disruption is linked to white matter and oligodendrocytes, with
  a feedback loop potentially enhancing further S100B production. Both pathways lead
  to neuropsychological assessments and therapeutic interventions. S100B: S100 calcium
  protein-B; CSF: cerebrospinal fluid; RAGE: receptor for advanced glycation end-products;
  MAPK: mitogen-activated protein kinase; NF-κB: nuclear factor-kappa B; BBB: blood–brain
  barrier; AD: Alzheimer’s disease'
article_title: 'The Inflammatory Nexus: Unraveling Shared Pathways and Promising Treatments
  in Alzheimer’s Disease and Schizophrenia'
