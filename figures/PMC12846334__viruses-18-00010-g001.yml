figure_title: Tyrosine kinase-driven regulation of antiviral innate immune sensing.
caption: Tyrosine kinase-driven regulation of antiviral innate immune sensing. Toll-like
  receptors (TLRs) located at the cell surface or on endosomal membranes require ligand-induced
  tyrosine phosphorylation on their cytoplasmic domains to activate intracellular
  signaling. Multiple tyrosine kinases, including Src-family kinases, Syk, and EGFR,
  phosphorylate specific TLR residues to regulate receptor activation, adaptor recruitment,
  and cytokine production. Syk and EGFR also phosphorylate STING, facilitating its
  trafficking and IRF3 activation during cytosolic DNA sensing. Our findings further
  identify scavenger receptors (SR-A) as upstream regulators that prime TLR9 activation
  by initiating a Lyn-Syk kinase cascade. The tyrosine kinase axis can also either
  directly or indirectly activate the Ser/Thr kinases to initiate the intracellular
  signaling pathway. Numbered steps indicate key biochemical events within these regulated
  kinase cascades
article_title: A Novel Tyrosine Kinase Axis in Innate Immune Signaling
