figure_title: Schematic overview of the implemented multimodal pipeline
caption: 'The final Classifier (purple) integrated three different feature sets: Network-based
  features derived from Whole Exome Sequencing (PBSEQ), Common Variation derived features
  of Valproic Acid (VPA) associated pathways (PBSNP) from two Gene Sets (GS_1, GS_2).
  Newly generated data (dark gray) and published data (light gray) were included to
  define these Gene Sets. The pipeline was implemented and trained on a Train-Discovery
  cohort. Parameters and Models were then tested in the Test-Discovery cohort and
  finally validated in an independent Validation cohort. CLIN: Clinical Features;
  DB: Database; DEX genes: Differentially Expressed Genes; eQTL: Expression Quantitative
  Trait Loci; GS: Gene Set; LGD: Likely Gene-Disrupting (variants); PBSEQ: Pathway-Based
  Sequencing Features; PBSN: Pathway-Based SNPs; VPA exp. Neurons: Valproic Acid Exposed
  Neurons; XGB Classifier: eXtreme Gradient Boosting Classifier (XGBoost)'
