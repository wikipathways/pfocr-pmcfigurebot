figure_title: Molecular pathways in HPV-negative and HPV-positive HNSCC. In HPV-negative
  HNSCC (top panel), chronic exposure to carcinogens such as tobacco and alcohol leads
  to the accumulation of somatic mutations in key oncogenes (PIK3CA, HRAS) and tumor
  suppressor genes (TP53, CDKN2A, NOTCH1). These genetic alterations disrupt normal
  cellular regulation by inhibiting apoptosis, promoting cell cycle progression, and
  enhancing proliferation, ultimately resulting in malignant transformation of epithelial
  cells. In contrast, HPV-positive HNSCC (bottom panel) is driven by infection with
  high-risk HPV (e.g., HPV-16/18). Following viral entry into epithelial cells, the
  HPV genome integrates into the host DNA or persists as episomal DNA, leading to
  the expression of viral oncoproteins E6 and E7. E6 promotes proteasomal degradation
  of the tumor suppressor p53. E7 protein inactivates pRB, releasing E2F transcription
  factors and triggering unregulated transcription and uncontrolled cell cycle progression,
  driving tumorigenesis
