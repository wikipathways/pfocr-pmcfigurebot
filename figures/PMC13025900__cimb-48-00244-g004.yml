caption: The metabolites of ex-ATP increased in the culture medium by 1000-fold (16.7
  h) during osteogenic induction. Metabolomic analyses were performed using liquid
  chromatography and mass spectrometry on the conditioned medium from TT-D6 cells
  during osteogenic induction with or without hydrogen peroxide treatment (0.3 mM).
  (A) The hydrolysis pathway of ex-ATP and cellular responses to the metabolites are
  schematically presented. (B–E) Time series analysis of nucleotides and nucleosides
  over 0, 1, 10, 100, and 1000 min was performed with duplicate samples. The horizontal
  axis is the time, and the vertical axis is the concentration. The data plot represents
  the mean duplicate values (n = 2). Statistical analysis was conducted using a 2-way
  ANOVA, and the interaction p-value was evaluated. (F) Adenosine levels in the osteogenic
  medium with or without hydrogen peroxide treatment (0.3 mM) were statistically analyzed
  at 12 and 24 h. The number of wells in each setting was 5 (n = 5). N.S. not significant,
  *** p < 1.0 × 10−5, ** p < 0.001, determined by Student’s t-test
