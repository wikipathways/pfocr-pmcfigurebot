figure_title: Single cell sequencing reveals changes in canonical pathways at 120
  dpi
caption: (A) Uniform Manifold Approximation and Projection (UMAP) of cell clusters,
  with their identification and split by group (B). (C) Number of cells per identified
  cell cluster for each group. (D) Ingenuity pathway analysis (IPA) showing changed
  canonical pathways across each cell type and infection when compared with NBH controls.
  The size of the node denotes the –log(B-H P value) where the lowest value is set
  to 1.30 (P = 0.05), thus, only conditions that met the threshold for significance
  have visible nodes, and the color indicates the IPA prediction of pathway activation
  (orange), deactivation (blue), or neutral/no calculated activity pattern (gray).
  Shown are up to 10 most significantly changed pathways relating to neuronal function,
  mitochondria, autophagy, cell structure and other highly significant pathways. Signal
  transduction pathways related to the data in Figure 4 and Supplemental Figure 7
  were selected for presentation. Complete data can be found in Supplemental Table
  3
