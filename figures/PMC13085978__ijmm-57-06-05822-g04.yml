figure_title: OE-TUBB4B upregulates STMN1 and activates the ERK pathway.
caption: OE-TUBB4B upregulates STMN1 and activates the ERK pathway. (A) Effect of
  TUBB4B on GH3 cell cycle progression. (B) Cell cycle distribution. (C) Reverse transcription-quantitative
  PCR was used to assess the effects of OE-TUBB4B. (D) Transcriptomic sequencing showing
  Kyoto Encyclopedia of Genes and Genomes pathway enrichment of differentially expressed
  genes. (E) Transcriptomic sequencing showing the protein-protein interaction network
  of proteins that interact with TUBB4B (red box indicates key pathway proteins that
  interact with TUBB4B). (F) Interaction diagram between the TUBB4B and STMN1 proteins
  from STRING. (G) Cell Counting Kit-8 assay was used to assess the viability of GH3
  cells treated with U0126. In GH3 cell lines treated with U0126, the protein expression
  levels of (H) STMN1, (I) p-STMN1 (I), and cPLA2 (J) were assessed by western blotting
  (K), and levels of p-cPLA2 (L), ERK (M), p-ERK (N), CCND1 (O), JNK (P), and p-JNK
  (Q) were also assessed. ****P<0.0001, ***P<0.001, **P<0.01, *P<0.05 vs. vector.
  OE, overexpression; TUBB4B, tubulin beta 4B class IVb; STMN1, stathmin 1; p-, phosphorylated;
  cPLA2, cytosolic phospholipase A2; CCND1, cyclin D1; KD, knockdown; OD, optical
  density; ns, not significant
