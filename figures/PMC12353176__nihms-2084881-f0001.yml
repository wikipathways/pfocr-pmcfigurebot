figure_title: Mechanism of CD137 agonists.
caption: Mechanism of CD137 agonists. A.) Urelumab binds to the CRD1 domain of CD137
  and does not compete with soluble or membrane-associated CD137L. Binding of CD137L
  clusters CD137 and leads to its activation. Due to the IgG4 structure of urelumab,
  CD137 clusters are hyper cross-linked via a FcyIIB receptors leading to super agonism
  of CD137. On the other hand, utomilumab binds within the CRD2/CRD3 domains of CD137
  and competes with CD137L. Competitive inhibition of CD137 and lack of FcyIIB receptor
  hyper-crosslinking by utomilumab prevents clustering of CD137 resulting in mild
  agonism of CD137. B.) Multi-specific molecules targeting a tumor expressing surface
  protein cross-link CD137 agonism on effector T-cells leading to CD137 agonism, T-cell
  costimulation, and activation of the NF-kB pathway. Many next generation multi-specific
  CD137 agonists have altered Fc regions preventing FcyIIB-induced hyper-crosslinking
  with the goal of limiting systemic toxicity
