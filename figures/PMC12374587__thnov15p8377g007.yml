figure_title: iEV-150 interacts with NF2, leading to the inactivation of LATS1 kinase
  and promoting ferroptosis in cells.
caption: 'iEV-150 interacts with NF2, leading to the inactivation of LATS1 kinase
  and promoting ferroptosis in cells. A, B GST pulldown (A) and co-IP (B) assays showing
  decreased NF2-LATS1 binding after iEV-150 treatment. C Immunofluorescence detection
  of NF2-LATS1 interaction in melanoma cells after iEV-150 co-culture (scale: 30 μm).
  D Western blot analysis of ACSL4, CHAC1, and Hippo pathway components in A375 and
  A875 cells after iEV-150 treatment or NF2 overexpression. E Lipid ROS levels analyzed
  by C11-BODIPY staining and flow cytometry. F Western blot of ferroptosis-related
  proteins in A375 cells treated with Erastin (15 μM), iEV-150, NF2 overexpression,
  or combinations. G-L Quantification of Fe²⁺ (G), MDA (H), GSH/GSSG ratio (I), mitochondrial
  membrane potential (J, K), and mitochondrial morphology (L) under different treatments.
  Mean ± SD, *p < 0.05; **p < 0.01; ***p < 0.001'
