figure_title: Maternal OUD impacts communication networks in the placenta
caption: A) Scatterplot of the incoming and outgoing interaction strength of each
  cell population in control and OUD groups. The size of the node represents the total
  number of interactions in each type of cells. B) Heatmap displaying the overall
  signal strength of each signaling pathway in each cell population among control
  (left) and OUD (right) groups. Color bar plot (top) displays total signaling strength
  of specific cell clusters for all pathways. Gray bar plot (right) displays total
  signaling strength of specific pathways for all cell clusters. C) Scatter plot of
  the communication probability of select significant ligand-receptor pairs ligand-receptor
  pairs between control (left) and OUD (right) placenta, which contribute to the signaling
  from CTB to all other cell type clusters identified by our Visium spatial transcriptomics
  data. Dot color reflects communication probabilities and dot size represents computed
  p-values. Empty space indicates a communication probability of zero. (D-E) Circle
  plot of the inferred D) VEGF and E) FN1 signaling networks between cell types where
  the thickness of the line indicates greater number/communication probability and
  color of the line indicates origin of the signal
