figure_title: Summary of glial dysregulation in HIV.
caption: Summary of glial dysregulation in HIV. (a, b) Selected statistically significant
  (filtered at FDR corrected p-value of 0.05) up (a) and down (b) regulated GSEA pathways
  in glial cells; (c, d) Selected differentially regulated pathways in glial cells
  that are exclusive to glial cell-types. (e, f) Two significant microglial clusters
  in RNA-seq (e) data and ATAC-seq (f) data. (g) DEGs significantly dysregulated in
  at least one of the two RNA-seq clusters that also drive the most significantly
  perturbed pathways in the two RNA-seq clusters, * denotes that the gene is significantly
  differentially expressed in the corresponding cluster. ‘Cluster 0’ in RNA-seq data
  has more inflammatory pathways and ‘Cluster 1’ has more cell-death related pathways.
  (h) Genes that encompass at least one DAR in one of the two ATAC-seq clusters
