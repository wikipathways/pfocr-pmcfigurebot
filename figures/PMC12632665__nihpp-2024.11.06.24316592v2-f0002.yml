figure_title: Lifespan transcriptomic trajectories
caption: 'a, Schematic of the workflow illustrating the steps: data preprocessing,
  model selection for final trajectory analysis, clustering, visualization and validation
  of trajectories. b, Ten characteristic trajectories were identified, derived from
  the average gene expression of cellular subclasses within each cluster. The trajectories
  are organized by upward and downward trends. c,f, Stratification of development
  aDEGs (c) and late adulthood aDEGs (f) across the trajectories. Colors indicate
  the number of genes within each class. Trajectory names colored in red and blue
  indicate upregulation and downregulation, respectively, during development (c) and
  late adulthood (f). d, h, Pathway enrichment for genes from trajectory 2 and 10
  highlighting subclasses significantly enriched for GO biological processes with
  an adjusted p-value < 0.05. Pathways in blue text in the d panel denote synaptic
  and glutamatergic signaling processes, which were specifically enriched in EN and
  IN subclasses. e, g, MAGMA enrichment of genes within development and late adulthood
  aDEGs highlighting their relevance to neuropsychiatric and late age diseases. *
  and # indicate nominal p-value < 0.05 and FDR < 0.05 from MAGMA enrichment. i, Bar
  plot showing the predicted median R2 of aging trajectories across all genes within
  each cluster, separately for the lifespan DLPFC discovery (black) and replication
  (gray) datasets j, Scatter plot displaying the the ratio of housekeeping genes in
  each trajectory, and median tau score (cell specificity) per trajectory. Point size
  corresponds to the number of genes in the trajectory, and color indicates fisher
  test enrichment (–log10P value) for housekeeping genes in each trajectory cluster'
