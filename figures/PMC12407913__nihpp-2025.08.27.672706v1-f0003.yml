figure_title: Differential proteomics of STC-1 enteroendocrine cells (EECs) exposed
  to nitrite—the product of bacterial nitrate respiration
caption: (A–B) Volcano plots showing differential expressed proteins (cyan = downregulated,
  coral = upregulated) in enteroendocrine STC-1 cells treated with 50 mM nitrite,
  50 mM nitrate, or vehicle. The P-value cutoff was 0.05. (A) In the nitrite group,
  3708 proteins were identified; 73 were downregulated and 85 were upregulated as
  compared with the untreated group. (B) In the nitrite group, 3708 proteins were
  identified; 111 were downregulated and 49 were upregulated as compared with the
  nitrate-exposed group. (C) Venn diagram showing uniquely altered proteins in nitrite-treated
  cells as compared with the differential proteome of nitrite-treated relative to
  untreated cells and that of nitrate-treated relative to untreated cells (D) Pathway
  enrichment analysis of differential proteins of nitrite-treated STC-1 cells. Proteins
  unique to nitrite-treated STC-1 cells were identified after comparison between significantly
  altered proteins in both the nitrite-treated vs untreated cells and the nitrate-treated
  vs untreated cells
