figure_title: Overall study approach
caption: A subset of participants in the IMPROVE-T2D cohort (n = 5) underwent research
  kidney biopsies before and 1 year after VSG. Transcriptomic data from these biopsies
  were used to identify molecular pathways associated with weight loss and improved
  metabolic and kidney function parameters post-VSG. The Teen-Longitudinal Assessment
  of Bariatric Surgery (Teen-LABS) cohort (n = 64) with data available on changes
  in serum proteins associated with MBS allowed the linkage of intrarenal molecular
  pathways to the circulating proteome. Created in BioRender. Subramanian, L. (2025)
  https://BioRender.com/s2l15o2
