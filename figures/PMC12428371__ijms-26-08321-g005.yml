figure_title: Treatment with erythropoietin (EPO) tends to increase the signal transducer
  and activator of transcription (STAT)3 pathway in the kidney of sucrose-induced
  insulin resistance model rats.
caption: 'Treatment with erythropoietin (EPO) tends to increase the signal transducer
  and activator of transcription (STAT)3 pathway in the kidney of sucrose-induced
  insulin resistance model rats. The protein expression of phospho-Akt (Ser473, (A))
  and phospho-STAT3 (Tyr705, (B)) in the kidneys of the control, sucrose-treated,
  and EPO-treated groups was assessed by immunoblotting. A: The expression of phosphorylated
  Akt was normalized to that of total Akt. B: The expression of phosphorylated STAT3
  was normalized to that of total STAT3 (upper) and actin (lower, left). Total STAT3
  was normalized by actin (lower, right). While there were no significant differences
  in the expression of phospho-Akt (Ser473) among all groups (A), treatment with EPO
  reduced the phosphorylation ratio of STAT3 (Tyr705)/total STAT3 in the sucrose-induced
  insulin resistant rat kidney ((B), upper). On the other hand, the protein levels
  of phospho-STAT3 (Tyr705) and total STAT3, normalized with actin, were increased
  in the EPO-treated rat kidney. Immunoblot bands were developed by enhanced chemiluminescence
  and quantified by densitometry. Values are expressed as means ± SEM (n = 6/group).
  One-way analysis of variance ANOVA followed by Tukey’s multiple comparisons test
  was used for comparisons among groups. * p < 0.05 vs. control, # p < 0.05 vs. sucrose'
