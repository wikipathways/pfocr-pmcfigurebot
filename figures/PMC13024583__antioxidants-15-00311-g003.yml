figure_title: Illustration of the anti-tumor mechanisms of PDVLNs in cancer therapy.
caption: 'Illustration of the anti-tumor mechanisms of PDVLNs in cancer therapy. (A)
  Regulated cell death: PDVLNs induce cytotoxic effects by mediating regulated cell
  death (e.g., apoptosis by the activation of the caspase pathway); (B) Cell cycle
  arrest: PDVLNs inhibit tumor proliferation by inducing G1/G0, G1/S, or G2/M phase
  arrest; (C) Gut microbiota balance: PDVLNs regulate the proportion of gut microbiota
  or mediate related metabolites (e.g., DHA, EPA, and PLC); (D) Tumor immune microenvironment:
  PDVLNs alter macrophage polarization state or alleviate T-cell exhaustion to change
  cold tumor into hot tumor. DHA, docosahexaenoic acid; EPA, eicosapentaenoic acid;
  PLC, bacterial phospholipase C. Red arrows indicate upregulation or downregulation,
  while black arrows serve as indicators'
