caption: The Verbal–Cognitive Scaffold (VCS) Model illustrating pathways to Computational
  Thinking (CT). The figure depicts the primary verbal–cognitive pathway through which
  InSp facilitates CT. Solid orange arrows trace the predominant pathway, showing
  how InSp dimensions and functions (blue box) enable cognitive mechanisms of scaffolding
  (purple box), which in turn support the four key CT components (green box). Dashed
  orange arcs represent debugging as an iterative metacognitive loop that can recur
  across components. The lower route in gray acknowledge alternative, theorized non-verbal
  cognitive architectures (e.g., visual–spatial or embodied reasoning) that may achieve
  similar CT outcomes but are not modeled in detail here, as empirical research on
  these pathways remains limited
