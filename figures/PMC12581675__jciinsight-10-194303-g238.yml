figure_title: Macrophage function and metabolism
caption: '(A) Summary of experimental design. (B and C) Phagocytic capacity of BMDMs
  from old and young mice isolated at 4 days (4d) of recovery from hind limb unloading
  (n = 6) and representative image (cell: purple, beads: green, DAPI: blue). Original
  magnification, ×20. Scale bars: 20 μm. Each data point in B represents cells from
  an individual mouse, presented as mean ± SD. **P < 0.01 by 1-way ANOVA with Dunnett’s
  test for difference from young control; #P < 0.05 for difference from young hypoxia.
  Red color indicates hypoxia exposure, white color indicates control. Asterisks over
  a line in B indicate a difference between groups at that time point. (D–G) Metabolomics
  analysis of old BMDMs isolated at 4d of recovery (n = 4–6), including metabolite
  content, PCA distribution, summary of increased glycolytic/TCA-related metabolites,
  and key enriched metabolic pathways (KEGG and SMBPD). (D and E) Heatmap and PCA
  clustering (log2[fold change]). (F) Significantly increased metabolites (log2[fold
  change] ≥ 1.5, Padj ≤ 0.05). (G) Significant pathway enrichment (normalized enrichment
  score ≥ 2, P ≤ 1.3 log2). P < 0.05 or P ≤ 1.3 log2 was considered significant'
