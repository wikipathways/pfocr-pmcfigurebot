caption: Schematic overview of the reconstruction and refinement workflow leading
  to EHMN 2026. The process begins with the original EHMN framework and proceeds through
  systematic identifier harmonisation (MetaNetX, ChEBI), reaction consolidation, thermodynamic
  directionality refinement, pathway integration via Reactome, and final SBML Level
  3 FBC2 encoding. The workflow emphasises refinement and standardisation rather than
  reaction inflation
