caption: Dysferlin pathway proteins and wildtype AD proteins in the SG and neural
  elements, continued. (A) Ryanodine receptor 1 (green) on cell membrane extending
  inward (arrow) and dysferlin (red) in type 1 cell bodies of SG; scale bar = 10 µm.
  (B) RYR1 (green) on cell membrane and FKBP8 (light blue) in type I cell bodies of
  SG. Note circular FKBP8 figures (mitochondria, arrow); scale bar = 10 µm. (C) Ryanodine
  receptor 2 (green) on cell membrane extending inward (short arrow) and rows of dysferlin
  puncta (red) in type I cell bodies of SG (long arrows); scale bar = 10 µm. (D) P-RYR2
  (green, arrow) on cell membrane and FKBP8 (blue) in type I cell bodies of SG plus
  brightfield; scale bar = 10 µm. (E) BCL2 (red) and RYR3 (green). BCL2 was localized
  to outer membranes of SG type I cell bodies (arrows); scale bar = 10 µm. (F) APP
  (red) and BACE1 (green) co-aggregated (yellow, arrows) in the interiors of SG type
  I cell bodies; scale bar = 10 µm
