figure_title: Regulation model of miR-2c on EcR/RXR pathway.
caption: Regulation model of miR-2c on EcR/RXR pathway. The ecdysone-mediated signaling
  pathway, through the EcR/RXR heterodimer, activates PmRunt, AP-1, and other downstream
  biomineralization-related genes, including CHS, KRMP, and TYR2. miR-2c negatively
  regulates multiple genes within this signaling pathway, including EcR, RXR, and
  PmRunt, thereby affecting the expression of various effector genes responsible for
  exoskeleton formation
