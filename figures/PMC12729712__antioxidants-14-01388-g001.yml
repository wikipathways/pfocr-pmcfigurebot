figure_title: The two-step activation mechanism of SHP2 and its role as both a phosphatase
  and scaffold protein.
caption: The two-step activation mechanism of SHP2 and its role as both a phosphatase
  and scaffold protein. (A) SHP1 and SHP2 are 68 kDa, multidomain enzymes that share
  similar sequences and functions. Both consist of two in-tandem Src Homology 2 domains
  (N-SH2 and C-SH2), a catalytic protein tyrosine phosphate domain (PTP), and a regulatory
  C-tail with main phosphorylation sites that vary for SHP1 (Y536 and Y564) and SHP2
  (Y542 and Y580). More specifically, SHP1 is a 595 amino acid non-receptor protein
  tyrosine phosphatase that is encoded by the PTPN6 gene. SHP1 is highly expressed
  in hematopoietic cells while its expression in other cells such as epithelial cells,
  astrocytes, and microglia can vary. Similarly, SHP2 is a 593 amino acid non-receptor
  protein tyrosine phosphatase that is encoded by the PTPN11 gene. SHP2 is a broadly
  expressed cytoplasmic enzyme found in many different cell types. Both SHP1 and SHP2
  exist in an autoinhibited basal conformation in which the N-SH2 domain tightly binds
  the PTP domain. Activating signals such as growth factors, cytokines, and tyrosine
  phosphorylated proteins like RTKs bind phosphopeptides to the C-SH2, with a conformational
  change occurring where N-SH2 releases from PTP domain and the enzyme is activated.
  (B) (Step 1) In its resting or quiescent state, the N-SH2 domain of SHP2 blocks
  its phosphatase domain (PTP), inhibiting access to catalytic site. When phosphotyrosine
  motifs such as adaptor protein GAB1 bind to the N-SH2 domain, the N-SH2 domain is
  pulled away from the C-terminal, which reveals the catalytic phosphatase domain.
  This conformational change allows SHP2 to adopt its catalytically active, open state.
  (Step 2) Once fully activated, SHP2’s PTP domain selectively dephosphorylates tyrosine
  residues on target substrates. This dephosphorylation event facilitates the release
  of signaling complexes such as GAB1/GRB2/SOS, thereby promoting downstream signaling
  cascades, including the activation of the RAS/MAPK pathway. Created in BioRender.
