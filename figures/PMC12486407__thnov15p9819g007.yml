caption: Graphical abstract. SDF-1α, secreted by ECs, activates the CXCR4-mediated
  AKT/NF-κB signaling pathway. This activation results in the direct transcriptional
  activation of GLI1 by the p50 subunit within the promoter region, thereby establishing
  a link between the NF-κB and Hedgehog signaling pathways. Furthermore, SDF-1α influences
  the turnover of GLI1 protein in GBM cells by modulating GLI1-associated polyubiquitin
  chains through the phosphorylation of the deubiquitinase USP28 at serine 67. In
  conclusion, the SDF-1α-CXCR4-AKT/NF-κB signaling axis enhances the stemness-maintaining
  properties of GLI1 through both transcriptional regulation and protein quality control
  mechanisms. Additionally, the combination of the CXCR4 antagonist AMD3100 and the
  AKT inhibitor GSK690693 demonstrates a synergistic effect in inhibiting GBM cell
  progression both in vitro and in vivo
article_title: Endothelial cell-derived SDF-1α elicits stemness traits of glioblastoma
  via dual-regulation of GLI1
