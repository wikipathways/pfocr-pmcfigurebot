figure_title: Model for functional organization of SNX27-Retromer and SNX17-Retriever
  pathways at excitatory synapses
caption: SNX17-Retriever and SNX27 Retromer define distinct pathways for recycling
  internalized protein cargo back to the cell surface. These pathways likely emanate
  from the same endosome and selectively traffic at least some cargos (e.g., β1-integrin
  via SNX17-Retriever and AMPARs via SNX27-Retromer). Disrupting SNX17 and SNX27 in
  isolation or together reveals that these plays work in parallel to maintain excitatory
  synapses, and their combinatorial action is required for diverse forms of long-term
  synaptic plasticity. Figure 9 was created in BioRender. Chavis, G. (2025) https://BioRender.com/t46imzd;
  Chavis, G. (2025) https://BioRender.com/gbu5kxu; Chavis, G. (2025) https://BioRender.com/q7qxsc3
article_title: Dual endomembrane recycling pathways function in parallel to support
  synapse maintenance and plasticity
