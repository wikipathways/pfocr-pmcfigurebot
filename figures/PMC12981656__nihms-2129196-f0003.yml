figure_title: Ordered transcripomics data form the scRNA-Seq data from Colon Cancer
  sample of FFPE human specimen (adenocarcinoma stage IIA).
caption: Ordered transcripomics data form the scRNA-Seq data from Colon Cancer sample
  of FFPE human specimen (adenocarcinoma stage IIA). a) Typical cell type clustering
  analysis of the data shows 6 cell types/custers. Figure panels (b) i) and ii) show
  the GO-term enrichment of Cell Types 5 (yellow, ECM) and 2 (light blue, Goblet Cells)
  respectively. (c) The heatmap’s dendrogram reflects the order reconstruction by
  our algorithm using the gene programs from the colon cancer progression pathway
  as defined by KEGG pathways database. Two top color bars show the Progression Groups
  in the first/top color bar - 3 progression groups (orange, light blue and red) -
  followed by cell type clusters (Cluster 1 to 7) in the second color bar of the heatmap.
  (d) shows the composition of the identified progression groups and how they map
  to the cell types identified in the upstream analysis, Cell Types 5 (yellow, ECM)
  and 2 (light blue, Goblet Cells) are mostly found in the most activated progression
  groups (groups 2 and 3)
article_title: Inference of Tumor Progression Patterns in Colon Cancer Using Optimal
