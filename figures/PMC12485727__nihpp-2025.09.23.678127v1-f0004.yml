figure_title: IFN-γ-based genome-wide in vivo CRISPR screen identifies key regulators
  of T cell function in solid tumors
caption: 'a. Schematic of the in vivo genome-wide CRISPR IFN-γ screen in tumor infiltrating
  T cells.b. Volcano plots showing enriched (red) and depleted (blue) gene candidates
  associated with IFN-γ expression in TILs, as identified by MAGeCK analysis comparing
  IFN-γ high vs. low populations. The screen was performed using T cells from two
  human donors. Genes meeting the significance threshold (FDR < 0.25 and abs (Log2FC)⩾
  0.25) are highlighted. Boxed genes represent known negative regulators of human
  T cell function.c. Comparison of primary human T cell IFN-γ screens: in vivo screen
  versus published in vitro screen from Schmidt et al39, colored by direction and
  specificity of effect between the two screens. Genes meeting the significance threshold
  (FDR < 0.25 and abs (Log2FC)⩾ 0.25) are colored.d. Rank plot of the in vivo IFN-γ
  screen hits colored by gene association with GPCR binding pathways. The pathway
  annotation in this figure specifically includes genes were selected based on their
  association with the GPCR pathway from literature as well as genes in the msigdbr
  gene list.e. Tumor growth of CD19-A549 tumor-bearing NSG mice treated with CD19
  CAR T cells 9 days after tumor injection (left) and tumor size at day 90 post CAR
  T cell infusion (right) (n = 6 mice for each group).f. Schematic of selected GPCR(s)-Gαs
  signaling pathways in T cells in the solid tumor microenvironment. Four of the known
  suppressive ligands found in the TME that bind GPCRs upstream of Gαs are indicated
  (schematic is representative, not comprehensive).g. Incucyte-based killing assay
  comparing GNAS KO and AAVS1 control CD19 CAR T cells against CD19 expressing A375
  tumor cells, in the presence or absence of the indicated agonist or combination
  of all four agonists. Data are representative of one of three donors.h-k. AAVS1
  and GNAS KO T cells were treated with a combination of the four agonists shown in
  (g) for 2 days in the presence of CD3/CD28 activation and in the absence of IL-2.
  Assessed outcomes include: T cell expansion rate on day 2 relative to day 0 (day
  0 = day of bead stimulation) (h), cell viability on day 2 (i), log2 fold change
  (day 2/day 0) of cytokine secretion in culture supernatant (j), and metabolic activity
  on day 2 (k). n = 2 donors for h-j, and data are representative of one of three
  donors for k.l. sgRNA z-scores for selected genes of interest and gene rank from
  the in vivo IFN-γ screen and previously published in vitro screens treated with
  vehicle or Adora2a agonist, as reported by Shifrut et al, Cell, 2019.m. Incucyte-based
  killing assay comparing GNAS KO and AAVS1 control HER2 CAR TILs in the presence
  or absence of the four-agonist combination shown in (g). TILs were isolated from
  the ascites of an ovarian cancer patient and engineered to express HER2 CAR (other
  patient replicate shown in Extended Data Fig 5i).P values were determined by two-tailed
  unpaired Student’s t-test (e, h, i). *P < 0.05, **P < 0.01, ***P < 0.001, and ****P
  < 0.0001. Data are presented as mean ± s.e.m'
