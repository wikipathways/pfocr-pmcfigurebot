caption: 'Current model for VirS/VirR:Agr-like QSS regulation of toxin production:
  AgrD is transcribed from the agr operon and then processed to a 5-mer thiolactone
  ring and secreted by, at minimum, AgrB. This AIP then binds to VirS which leads
  to VirS activation by autophosphorylation; this activation then allows VirS to phosphorylate
  the VirR transcriptional regulator. VirR ~ P then binds to VirR boxes in the promoter
  regions of the pfoA, cpb and netB genes, increasing production of PFO, CPB and NetB.
  VirR ~ P also binds to VirR boxes upstream of the vrr gene, leading to transcription
  of VR-RNA. This RNA increases levels of cpa and cpb2 mRNA, boosting production of
  CPA and CPB2. Other regulators such as EutV/EutW can impact transcription of virS/virR
  and the agr operon to affect toxin production, although the precise pathway is not
  yet clear [42]. Updated from Ref. [1]'
