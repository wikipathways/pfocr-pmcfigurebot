figure_title: A model for the regulation of interneuron subtype composition by local
  pyramidal neurons
caption: 'In the developing cortex, the subtype composition of local interneurons
  is quantitatively coupled to that of the surrounding pyramidal neuron (PN) population.
  In a Fezf2 mutant where deep-layer PNs are altered, this balance is maintained through
  two divergent mechanisms: SST interneurons adjust their numbers via programmed cell
  death, while PVALB interneurons undergo a cell fate transformation. This regulation
  is mediated by distinct PN-derived signals; the PVALB fate switch depends on spontaneous,
  tetanus toxin (TeNT)-sensitive vesicular release, while SST interneuron survival
  relies on TeNT-insensitive signals. Our analysis identifies the Wnt5a pathway as
  a top candidate for regulating PVALB interneurons and integrin-mediated signaling
  for SST interneurons'
article_title: Pyramidal neurons proportionately alter the identity and survival of
  specific cortical interneuron subtypes
