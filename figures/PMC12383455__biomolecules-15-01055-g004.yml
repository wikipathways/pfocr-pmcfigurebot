figure_title: Antiaging Effects of PDVLNs.
caption: 'Antiaging Effects of PDVLNs. Panel I: ADVLNs exerted anti-inflammatory effects,
  downregulating NF-κB pathway genes (A,B) and IL-1 family factors/receptors (C),
  with KEGG analysis showing IL-1β/NF-κB pathway changes (D). Adapted with permission
  from Ref. [114]. Panel II: Cucumber-DVLNs (Cu-DVLNs) enhanced skin permeation, varying
  by formulation (A), and doubled penetration depth of lipophilic substitutes vs.
  buffer (B). Adapted with permission from Ref. [115]. Panel III: ADVLNs doubled collagen
  protein levels, reduced integrin/adhesion molecule expression threefold (A), decreased
  metalloproteinase expression (B), and doubled collagen chain expression (C). Adapted
  with permission from Ref. [114]. Created in Biorender. Wang, Q. (2025) https://BioRender.com/3hdbiqe'
