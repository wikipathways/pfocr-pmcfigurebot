figure_title: Secretory stimuli cause shifts in ISG spatial distribution
caption: '(A) Cartoon of the ISG maturation pathway with the ISGs color coded based
  on location with respect to cell membrane. Normalized EDT on the right indicates
  where the ISG is located (EDT: 0 –Cell membrane; EDT: 1 - furthest from the cell
  membrane). Different ISG subpopulations are defined based on spatial localization
  through the normalized EDT: Docked ISGS (EDT: 0 – 0.02), Readily Releasable Pool
  (RRP) (EDT: 0.02 – 0.10) and Internal ISGs or Reserve Pool (EDT: 0.1 – 0.6). (B-E)
  ISG LAC distribution for each 0.1 EDT zone across the cell. The last EDT zone is
  from 0.6 to 1.0. Each point represents the mean LAC of the ISGs for the corresponding
  condition in that specific EDT range. Error bars represent 95% CI. As compared to
  ISGs from glucose-only treated (red) cells, ISGs from: (B) Glimepiride treated cells
  (yellow) mostly show no significant change in ISG LAC values or trends as compared
  to ISGs from glucose-only treated cells (red). (C) GKA-50 treated cells (green)
  show a significant difference in LAC values (D) TAK-875 treated cells (purple) show
  a significant difference in LAC values and an upward trend in LAC going towards
  the membrane. (E) GIP treated cells (cyan) show no significance in LAC and Ex-4
  treated cells (blue) show a significant increase in LAC. Two-way ANOVA used as a
  statistical test for (B-E). *p<0.05; **p<0.01: ***p<0.001; ****p<0.0001'
article_title: Secretory stimuli distinctly regulate insulin secretory granule maturation
  through structural remodeling
