figure_title: Processing of amyloid precursor protein (APP), not drawn to scale.
caption: 'Processing of amyloid precursor protein (APP), not drawn to scale. Full
  length APP has three components: a large extracellular domain (light blue and brown)
  representing around 85% of protein mass, a short transmembrane sequence (brown and
  dark blue) and a small cytoplasmic domain (dark blue). APP is first cleaved extracellularly.
  In the non-amyloidogenic pathway (left), α-secretase (α-s) releases a soluble peptide,
  APPs-α. The 83-residue membrane-bound fragment is then cleaved by γ-secretase (γ-s)
  in its transmembrane domain releasing a soluble N-terminal fragment, P3 peptide
  and an intracellular C-terminal fragment (ICTF). In the amyloidogenic pathway (right),
  β-secretase (β-s, β-APP-cleaving enzyme 1, BACE) cleaves APP at a more proximal
  site, releasing an N-terminal peptide (light blue). The 99-residue membrane-bound
  fragment is then cleaved by γ-secretase, possibly at more than one site. ICTF is
  released into the cytoplasm; Aβ peptides with 39 to 42 residues are discharged extracellularly.
  They may aggregate, oligomerize, and form fibrils [34,49,249]'
