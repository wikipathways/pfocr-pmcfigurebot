figure_title: CDX-301 + CDX-1140 enhances T cell activity in human PDAC
caption: '(A-H) ScRNAseq analysis of whole tissue digests from pathological tumor
  or liver met samples obtained from patients undergoing pancreaticoduodenectomy under
  Clinical Trial (NCT04536077). Libraries were generated from 8 patients (4 tumor
  libraries from arm-1 (CDX-1140), and 2 tumor and 2 liver met libraries from arm-2
  (CDX-301+CDX-1140). Tumor libraries generated from historical standard-of-care (SOC)
  treated patients served as controls (n=19). Multiple repositories were accessed
  for GSEA analysis including “H”=Hallmark, “K”=KEGG, “R”=Reactome, “B”=Biocarta,
  “P”=PID and GO Databases. (A) UMAP of T/NK cell subsets. (B-C) GSEA pathways significantly
  enriched in the CD8+ T cell cluster (P.adj < 0.05) in (B) CDX-301+CDX-1140 vs. SOC
  treated patients and (C) CDX-301+CDX-1140 vs. CDX-1140 treated patients. (D) Expression
  heatmap of the Biocarta: IL-12 Pathway gene set in CD8+ T cells, split by treatment
  arm. (E) Selected DEGs (P.adj < 0.05) in the CD8+ T cell cluster when comparing
  CDX-301+CDX-1140 to SOC treated patients. (F-G) GSEA pathways significantly enriched
  in the CD4+ Th cell cluster (P.adj < 0.05) in (F) CDX-301+CDX-1140 vs. SOC treated
  patients and (G) CDX-301+CDX-1140 vs. CDX-1140 treated patients. (H) Selected DEGs
  (P.adj < 0.05) in the CD4+ Th cell cluster when comparing CDX-301+CDX-1140 to SOC
  treated patients'
article_title: Combined Flt3L and CD40 agonism restores dendritic cell-driven T cell
  immunity in pancreatic cancer
