figure_title: Effects of AS on key protein expression in the MAPK/FOS signaling pathway
  in kidneys of db/db mice.
caption: 'Effects of AS on key protein expression in the MAPK/FOS signaling pathway
  in kidneys of db/db mice. (A) Western blot analysis and quantification of upstream
  MAPK pathway activation markers: phosphorylated MEK4 (p-MEK4) and phosphorylated
  JNK1 (p-JNK1). (B) Western blot analysis and quantification of downstream MAPK pathway
  transcription factors: c-Jun and FOS. All data are presented as mean ± SD, n = 3
  mice per group. Intergroup comparisons: * p < 0.05, ** p < 0.01, *** p < 0.001,
  **** p < 0.0001'
