caption: Interactions between key miRNAs (miR-122, miR-145, miR-221, miR-483-3p, miR-519d,
  miR-1228) and the p53 pathway, including its regulators (MDM2, PTEN, cyclin G1).
  The figure illustrates their roles in apoptosis, cell-cycle control, and viral modulation
  (HBV/HCV), showing how miRNAs either suppress or enhance p53 activity. Green arrows
  indicate gene induction or protein activation, whereas red lines denote gene repression
  or protein inhibition. BMF—B-cell lymphoma 2 modifying factor; HBV—hepatitis B virus;
  HCV—hepatitis C virus; MDM2—murine double minute 2; miR—microRNA; p21—cyclin-dependent
  kinase inhibitor 1A; p53—tumor protein p53; PTEN—phosphatase and tensin homolog;
  PUMA—p53 upregulated modulator of apoptosis
