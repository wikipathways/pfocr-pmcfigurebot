caption: (A) Differentially expressed genes (DEGs) induced by waterborne Cd exposure
  at 2.5 μg L−1 (low concentration, LC), 5.0 μg L−1 (medium concentration, MC), and
  50 μg L−1 (high concentration, HC) in Anodonta woodiana for 10 d compared to the
  control group (0 μg L−1, CK); (B) RNA-Seq and (C) RT-qPCR validation of relative
  expression levels for the genes TubB (Tubulin beta chain), PhoA (Phospholipase A1
  magnifin), PheT (Phenylalanine-tRNA ligase), and ProH (Protein henna); and (D) KEGG
  pathway analysis of DEGs. Superscript asterisks indicate significant differences
  between the Cd-treated and control groups (p < 0.05)
