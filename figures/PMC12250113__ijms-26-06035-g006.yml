figure_title: STRING analysis of 35 downregulated proteins, 32 of which are functionally
  related, including PCYT1A and PCYT2.
caption: STRING analysis of 35 downregulated proteins, 32 of which are functionally
  related, including PCYT1A and PCYT2. The analysis also included ASPSCR1, QARS1,
  and REPS1, which were downregulated in all exposed samples (A). Biological processes
  (Gene Ontology) involving these proteins include T Cell Costimulation (GO:0031295),
  Cell Activation (GO:0001775), and Immune System Process (GO:0002376) (B). Reactome
  pathway enrichment analysis using the 35 downregulated proteins identified pathways
  such as Late Endosomal Microautophagy, Platelet Adhesion to Exposed Collagen, and
  Cell Surface Interactions at the Vascular Wall (C). KEGG pathway enrichment analysis
  revealed enrichment in Phosphonate and Phosphinate Metabolism, Epithelial Cell Signaling
  in Helicobacter Pylori Infection, Natural Killer Cell-Mediated Cytotoxicity, and
  Platelet Activation (D)
