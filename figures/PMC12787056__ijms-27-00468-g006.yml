figure_title: GPR43 is involved in PPA-induced activation of the Ca2⁺–CAMKII–ATGL
  pathway in HepG2 cells.
caption: 'GPR43 is involved in PPA-induced activation of the Ca2⁺–CAMKII–ATGL pathway
  in HepG2 cells. (A) After a 24 h incubation with 500 μM OA or BSA, HepG2 cells were
  exposed to 0.5 or 1 mM PPA with or without 1 μM GLPG0974, after which cytosolic
  Ca2⁺ levels were measured. (B–D) Protein extracts were assessed for p-CAMKII, t-CAMKII,
  p-ATGL and t-ATGL via Western blotting. Groups are denoted by color: control (gray),
  OA alone (green), OA + PPA (orange), and OA + PPA + GLPG0974 (lime green). PPA concentrations
  are as indicated. All groups are labeled on the x-axis. Data represent mean ± SEM;
  n = 3. * p < 0.05, ** p < 0.01; ns represents no significant difference'
