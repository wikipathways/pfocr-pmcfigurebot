figure_title: Forced Notch2 endows early transcriptional changes associated with activation,
  plasma cell differentiation, and TLR-responsiveness
caption: Purified FO B cells were co-cultured with OP9 or OP9-DL1 for 20, 44, or 68h
  +/− 10 μg/mL LPS and approximately 25,000 cells were subsequently sorted out of
  triplicate cultures for viability and purity directly into Trizol for bulk RNA sequencing.
  Shown is a heat map of differentially expressed genes over time, generated by all
  genes with a log2 fold change greater than or equal to 1 and less than or equal
  to −1 for each timepoint, then combining the 3 lists and excluding any duplicates,
  and normalizing gene expression per row (1482 genes total). Heat maps are expressed
  as a z score (A). Gene set enrichment analysis was performed using hallmark pathway
  analyses for indicated signatures comparing LPS stimulated FO B cells on OP9-DL1
  to OP9 alone after 20h (B) or 44h (C). FDR-q values were generated using a 1000-geneset
  permutations. Log2 TPM expression magnitude of indicated genes is shown as a mean,
  75% confidence interval (box) and 95% confidence interval (whisker) as well as individual
  data points, comparing FO B cells on OP9 + LPS (black) to OP9-DL1 + LPS (green)
  (D). RNA sequencing reflects one experiment with 3 technical replicates for each
  condition
article_title: Notch2 signaling instructs viral and bacterial TLR responsiveness in
