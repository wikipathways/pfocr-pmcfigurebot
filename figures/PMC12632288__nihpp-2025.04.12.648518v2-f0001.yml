figure_title: The signal transduction pathway of a canonical two-component system
  (TCS).
caption: The signal transduction pathway of a canonical two-component system (TCS).
  Membrane-bound His kinases (HK) generally function as homodimers; when activated
  by an extracytoplasmic signal, the cytosolic kinase catalytic core of one HK monomer
  phosphorylates the same subunit of the neighboring dimer by transferring the γ-phosphate
  of ATP to the conserved His residue located in the dimerization and His phosphotransfer
  (DHp) domain. Upon the completion of this autophosphorylation event, the linked
  cytosolic response regulator (RR) accepts the transfer of the phosphate group to
  a conserved Asp within its N-terminal regulatory domain. As a result, the phosphorylated
  RR undergoes dynamical and conformational changes (generally dimerization) that
  modify the affinity of the RR to particular genes, ultimately leading to an altered
  transcriptional response
article_title: The response regulator BqsR/CarR controls ferrous iron (Fe2+) acquisition
  in Pseudomonas aeruginosa
