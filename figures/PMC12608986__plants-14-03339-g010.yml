caption: 'Joint pathway analysis of DEGs and DEMs in non-bagging vs. bagging Fuji
  apple peels: (a) Flavonoid biosynthesis pathway, (b) Flavone and flavonol biosynthesis
  pathway. The gene expression levels of differentially expressed genes (DEGs) are
  represented by rectangles, and adjacent heatmaps (red to green scales) show the
  expression values of the samples. Differentially expressed metabolites (DEMs) are
  represented by solid circles, with yellow indicating upregulation and blue indicating
  downregulation. The color scale represents the level of expression (log2 (FoldChange)).
  The key enzyme steps have now been fully labeled (e.g., 1.141482: CYP75B2 (flavonoid
  3′-hydroxylase)), directly linking DEGs to metabolic pathways'
