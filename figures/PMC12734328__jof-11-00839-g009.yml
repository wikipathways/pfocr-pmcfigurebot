caption: Expression profiles of genes in ROS detoxification-, ergosterol biosynthesis,
  and ergosterol-supplemented phenotypical tests of ∆BbSlt2. (A) Relative expression
  of catalases, SODs, and GSTs in ∆BbMpk1 and the WT strain under MND stress. (B)
  Differential expression patterns of genes in the ergosterol biosynthesis pathway
  under heat stress; four rectangles beside gene names refer to the expression pattern
  under 30 min heat stress (WT, ∆BbSlt2) and 12 h heat stress (WT, l ∆BbSlt2). Red,
  black, and green indicate upregulation, no change, and downregulation, respectively,
  as compared to non-stress conditions. (C) Phenotypical growth of the WT and ∆BbSlt2
  strains on the indicated medium supplemented with 2.5 mM ergosterol (bar indicates
  10 mm)
