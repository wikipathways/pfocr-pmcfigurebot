figure_title: Effects of Zileuton on the HMGB1 pathway in RI-AKI mice model.
caption: Effects of Zileuton on the HMGB1 pathway in RI-AKI mice model. A renal extract
  was prepared 24 h after glycerol injection. Quantitative analyses of HMGB1, RAGE,
  and TLR4 were performed, mRNA expression levels of each factor were measured by
  quantitative real-time-PCR, and the results were normalized to the levels of GAPDH.
  Sham (n = 3), received 0.9% saline intraperitoneally (IP). Z (n = 3), received a
  dose of 30 mg/kg body weight. Gly (glycerol n = 3), received a single dose of 50%
  glycerol (8 mL/kg) into a hind limb intramuscularly. Z + Gly (glycerol plus Zileuton,
  n = 4). Statistical analysis was performed using the Shapiro–Wilk test for normality,
  followed by the Kruskal–Wallis test and Dunn’s post hoc test due to non-normal distribution.
  Data are presented as mean ± SEM to indicate the precision of the estimated group
  mean in comparisons between experimental groups (* p < 0.05). Opened circles (◦)
  represent the Sham group, closed circles (●) represent the Zileuton group, red triangles
  (▲) represent the Gly group, and blue squares (■) represent the Z + Gly group. *
  p < 0.05 vs. indicated groups
article_title: Zileuton Attenuates Acute Kidney Injury in Glycerol-Induced Rhabdomyolysis
