figure_title: scRNA-seq analyses of hMAN chimeric brain
caption: |-
  (A) Uniform manifold approximation and projection (UMAP) plot of scRNA-seq data (n = 23,994 human cells) from 3-month-old Rag2−/− IL2rγ−/−
  hCSF1KI hMAN chimeric brains.(B) Dot plot showing expression of key marker genes of each annotated human cell type. NPC, neural progenitor cell; GPC, glial progenitor cell; Astro, astrocyte; VLMC, vascular leptomeningeal cell.(C) Dot plot showing expression of marker genes of macroglia human cell types. OPC, oligodendrocyte precursor cell; Oligo., oligodendrocyte.(D) Heatmap showing the significant overlap of marker genes between human cortical macroglia73 and this study. Jaccard score represents the percentage of pairwise overlapping genes. Fisher’s exact test is used to evaluate the significance of overlapping. The significance levels are represented by asterisks. N.S., not significant.(E) Representative images of hN+ and ETV4+ cells from 2-month-old Rag2−/− IL2rγ−/−
  hCSF1KI hMAN chimeric brains. Arrows, ETV4+/hNu+ human GPCs. Scale bar: 20 μm.(F) UMAP plot of astrocyte subclusters (n = 11,100 cells).(G) UMAP plot of astrocyte subclusters; each cell is colored by its pseudotime trajectory assignment.(H) Dot plot showing expression of marker genes of each astrocyte subcluster.(I) Heatmap showing the significant overlap of marker genes between astrocyte subtypes of human hippocampus astrocytes75 and this study. Jaccard score represents the percentage of pairwise overlapping genes. Fisher’s exact test is used to evaluate the significance of overlapping. The significance levels are represented by asterisks (*p < 0.05; **p < 0.01; ***p < 0.001; ****p < 0.0001).(J) Chord diagram showing inferred cell-cell interaction weights/strengths between cell types. The thickness of the line represents the weight of ligand-receptor pairs scaled by cell-type population.(K) Bubble plot showing the ligand-receptor interactions between neurons and glia.(L) Heatmap showing the interaction weight between cell types of the APP signaling pathway.(M) Chord diagram showing the interaction weight between cell types of the NRXN signaling pathway.(N) Bubble plot showing the ligand-receptor interactions between glial cell types.(O) Heatmap showing the centrality scores/importance of cell groups as senders, receivers, mediators, and influencers in the PTN signaling pathway and MK signaling pathway.(P) Chord diagram showing the significant interaction pairs involved in the NOTCH signaling pathways
