figure_title: Dynamic changes in immune responses in pleural mesothelioma patients
  treated with Ad-SGE-DKK3 and nivolumab
caption: (A) Representative IMC images highlight significant intratumoral and peritumoral
  infiltration of B and T cells, especially notable in patients achieving a partial
  response.(B) UMAP analysis reveals that tumors with durable clinical benefits (DCB)
  exhibit higher frequencies of intratumoral T cells in both pre-treatment and post-treatment
  compared to those with progressive disease.(C) Post-treatment analysis shows an
  increase in tumor-infiltrating CD8 T cells following a combination of Ad-SGE-DKK3
  and nivolumab.(D) The frequency of intratumoral total CD8 T cells, effector memory
  CD8 T cells re-expressing CD45RA (CD8 Temra), and memory CD8 T cells (CD8 Tmem)
  increased in on-treatment tumor samples of patients with DCB.(E) Differential plasma
  protein expression analysis was performed using Olink HT Explore proteome data.
  A paired t-test was conducted to compare pre-treatment and post-treatment samples.
  36 plasma proteins were identified with significant differential expression (P <
  0.01), including 20 upregulated and 16 downregulated proteins following treatment.(F)
  Alterations in plasma proteins following combination therapy in trial patients included
  increased DKK3, increased IFN-γ, and increased IFN-γ-induced chemokines (CXCL9,
  CXCL10, and CXCL11), while CSF1 levels decreased.(G) Hallmark pathway analysis of
  upregulated proteins after treatment further identified key immune activation pathways,
  including IL-6/JAK/STAT3 signaling, IFN-γ response, and IFN-α response.(H) Cell
  marker analysis of the 20 differentially upregulated proteins using Enrichr (https://maayanlab.cloud/Enrichr/)
  revealed increased activation of CD8+ T cells and M1-like tumor-associated macrophages,
  consistent with our preclinical findings in mouse tumors.(I) Patients with DCB had
  lower pre-treatment serum levels of IL-6 and CSF1 compared to those with PD. Serum
  mesothelin (MSLN) levels remained consistently low during treatment in the DCB group,
  contrasting with elevations in the PD group
