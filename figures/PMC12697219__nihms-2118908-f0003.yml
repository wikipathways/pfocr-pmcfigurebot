figure_title: Multiome analysis of ISO-treated hearts
caption: (A) Mice were injected i.p. with 300 mg/kg isoproterenol (ISO) or diluent
  (PBS/CTRL). Whole hearts were collected at baseline (day 0) and on day 7 for multiome
  single-nuclei RNA+ATAC sequencing. (pooled n=3/group) (B) UMAP showing the identified
  cell clusters from sequencing. (C) Frequencies of the identified cell types in ISO
  and CTRL hearts. (D) Number of differentially expressed genes (adjusted P<0.05,
  log2 fold change >0.25/<−0.25) and (E) differentially accessible peaks across different
  cell types in the ISO group, relative to control (P<0.005, log2 fold change >0.25/<−0.25).
  Pathway enrichment analysis on lists of genes linked to accessible chromatin regions
  in (F) fibroblast, (G) endocardium, (H) TNK cell, (I) cardiac myocyte, (J) myeloid,
  (K) pericyte, and (L) endothelium cell types; the top 5 pathways are shown
