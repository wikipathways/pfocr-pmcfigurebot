figure_title: CFDP1 interacts with TPX2 and is essential for chromatin mediated microtubule
  nucleation.
caption: CFDP1 interacts with TPX2 and is essential for chromatin mediated microtubule
  nucleation. A) CFDP1 interacting proteins related to the chromosomal microtubule
  nucleation pathway identified by Mass Spectrometry analysis. B) CFDP1 interacts
  with TPX2 in cytosolic and chromatin extracts prepared from mitotic NIH3T3 cells.
  A control immunoprecipitation was performed using mouse IgG to determine the efficiency
  of pull-downs. C) Immunoprecipitation analysis of CFDP1 and TPX2 in mitotic HeLa
  cell extracts. CFDP1 interacted with TPX2 and α-tubulin but did not interact with
  Aurora A or its phosphorylated form (pT288 Aurora A). D) Representative immunofluorescence
  co-localization of CFDP1, TPX2 and tubulin in mitotic NIH3T3 cells released from
  nocodazole wash-out at the 1 min, 5 min, and 10 min time points. CFDP1 immunostaining
  (green) was closely associated with TPX2 (red) at the tubulin (blue) nucleation
  sites after 1 minute and at the later time point was localized to the centrosomes
  and tubulin. E) Changes in relative fluorescence signal intensity along the perforated
  line indicated in panel D for CFDP1 (green), TPX2 (red) and tubulin (blue) at 1
  minute (left panel, nucleation phase) and 10 minutes (right panel, after spindle
  bi-orientation) after nocodazole washout. F) Representative immunofluorescence images
  visualizing microtubule (red) nucleation after nocodazole washout in control and
  CFDP1 siRNA treated NIH3T3 cells at the indicated time points. The Tubulin/DNA panel
  is a merge of both tubulin immunostaining with the corresponding DAPI staining for
  DNA. G) Number of MT asters per cell in control and CFDP1 siRNA treated cells 5
  minutes after nocodazole washout. n = 80 cells for each condition. P valued was
  determined using unpaired student’s t test. H) Chromatin associated levels of select
  proteins from the microtubule nucleation pathway in control and CFDP1 siRNA treated
  NIH3T3 cells during interphase and mitosis (left panel). Total protein levels were
  assayed in whole cell extracts (right panel). Scale bars = 5 µm. Western blots are
  representative of 2–3 independent experiments
