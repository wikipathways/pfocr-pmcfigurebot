figure_title: Neuronal deterioration due to cerebral insulin resistance.
caption: Neuronal deterioration due to cerebral insulin resistance. 1. Under conditions
  of insulin resistance and neuroinflammation, TNF-α and IL-6 facilitate serine phosphorylation
  and IRS-1 inactivation, with decreased IR expression and consequent reduction in
  GLUT3 and GLUT4 translocation in neurons and astrocytes. 2. Reduced sensitivity
  to IR activation results in decreased intracellular signaling of neurons, astrocytes,
  and microglia, affecting PI3K-AKT and MAPK/ERK pathways, causing insulin to lose
  its neuromodulatory functions. 3. Through dysfunction of the PI3K-AKT pathway, Nrf2
  and PGC-1a transcriptional activity is decreased, leading to lower production of
  antioxidant enzymes (Superoxide dismutase (SOD), catalase (CAT) and glutathione
  peroxidase (GPx), consequently the accumulation of ROS and lipid peroxidation byproducts,
  thus inducing oxidative stress and mitochondrial dysfunction. 4. The metabolic overload
  associated with insulin resistance causes ER stress due to the accumulation of ROS
  and misfolded and unfolded proteins, activating the UPR through the PERK, IRE1,
  and ATF6 pathways. This chronic UPR activation results in overexpression of C/EBP
  homologous protein (CHOP), inducing mitochondrial dysfunction and caspase-dependent
  cell death. 5. Cerebral insulin resistance modifies neurotransmission, decreasing
  inhibitory GABAergic action due to lower expression of GAD67 and vesicular GABA
  transporters, while increasing excitatory glutamatergic transmission with greater
  phosphorylation of NMDA receptors. Upward arrows (↑) indicate increased expression,
  activity, or upregulation, whereas downward arrows (↓) indicate decreased expression,
  activity, or downregulation. The black box delineates the dendritic region and its
  associated synapses. Colored circles represent the release of different molecules,
  such as IL-6 and GABA.Created in BioRender. Carpinteyro, S. (2026) https://BioRender.com/ugvy52c
  (accessed on 23 March 2026)
