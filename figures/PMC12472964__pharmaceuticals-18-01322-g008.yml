figure_title: Effects of paeonol on gene expression in prostate tissues.
caption: 'Effects of paeonol on gene expression in prostate tissues. Relative mRNA
  expression levels of BPH-related genes determined by qRT-PCR. (A) 5AR1; (B) 5AR2;
  (C) AR; (D) TGF-β1; (E) FGF-1; (F) SOD1; (G) CAT; (H) GR; (I) Akt1; (J) BCL-2; (K)
  CASP3; (L) TNF; (M) NF-κB. Androgen signaling: 5AR2 and AR were significantly upregulated
  in the BPH group compared with NC, and markedly downregulated by paeonol and finasteride.
  Growth factors: TGF-β1 and FGF-1 were elevated in BPH and significantly suppressed
  by paeonol. Oxidative stress regulator: GR expression was increased in BPH but reduced
  in the Pae200 group. Inflammatory pathway: NF-κB was significantly suppressed by
  paeonol in a dose-dependent manner, while TNF showed no significant changes. Other
  targets: Expression of 5AR1, SOD1, CAT, BCL-2, and CASP3 showed minimal or insignificant
  changes. Data are represented as mean ± SEM (n = 5). * p < 0.05, ** p < 0.01, ***
  p < 0.001. NC, normal control group; BPH, TP-induced BPH group; Pae100, Pae-treated
  BPH group (100 mg/kg, p.o.); Pae200, Pae-treated BPH group (200 mg/kg, p.o.); Fin,
  Finasteride-treated BPH group'
