caption: Schematic of the three complement activation pathways (classical, lectin,
  and alternative) [14,16]. All converge at C3 convertase, producing C5 convertase,
  C5a, and the MAC. The alternative pathway is shown separately due to its distinct
  convertase components. HCMV, like other pathogens, can initiate complement through
  multiple routes, including C1q, mannose-binding lectin, or spontaneous C3 hydrolysis
  [14,16]
