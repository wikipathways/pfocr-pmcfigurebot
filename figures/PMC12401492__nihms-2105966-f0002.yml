figure_title: The antiviral RNAi pathway and conserved kinase signaling regulate the
  expression of repetitive transgenes
caption: (A) IPR and RNAi defense against viral pathogens in C. elegans.(B) pig26
  allele contains a 253-bp deletion in pals-22, indicated by the red bar.(C) mRNA
  and antisense siRNA reads mapped to otIs356 [rab-3p(prom1)::2xNLS::TagRFP] repetitive
  transgene in wild-type and pals-22(pig26) animals. RPM, reads per million.(D and
  E) Requirement of DRH-1 and RRF-1 for transgene silencing in pals-22(pig26).(F and
  G) Interactions between SID-3, SID-4, and PALS-22 in transgene silencing. For (D)–(G),
  each data point represents an animal. n ≥ 14. Statistical significance was determined
  by one-way ANOVA followed by pairwise two-tailed unpaired t tests. ns, not significant
  (q > 0.05); ***q ≤ 0.001; ****q ≤ 0.0001. Error represents mean ± SD. See also Figure
  S1
