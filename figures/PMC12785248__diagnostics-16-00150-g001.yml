figure_title: Reusable scope processing and single-use bronchoscopy.
caption: 'Reusable scope processing and single-use bronchoscopy. (A) Pathway depicting
  reprocessing step for a reusable bronchoscope. Steps at risk for contamination and
  cleaning failure are indicated by the red exclamation mark and warning triangle.
  (B) Five commercially available single-use bronchoscopes, from left to right: Pentax®
  Medical ONE Pulmo™, Ambu® aScope 4 Large (Tokyo, Japan), The Surgical Company Broncoflex©
  Vortex (Amersfoort, The Netherlands), Vathin® H-Steriscope™ Large (Xiangtan, Hunan
  Province, China)and Boston Scientific® EXALT™ Model B. C Ambu® single-use bronchoscopes
  (Marlborough, MA, USA). Reprinted with permission from (C). On the left is the Ambu®
  aScope™ 5 Broncho Large (Ballerup, Denmark). On the right is the Ambu® aScope 4
  Large. Note the progression in scope handle design with ability to rotate 120° left
  and right. (D) Axess Vision Single-Use Flexible 2.8 mm Channel Vortex with the Screeni®
  viewing system placed in a mannequin used for bronchoscopic training. Reproduced
  with permission [8]'
