figure_title: TFEB reduces DOX-induced autophagosome accumulation
caption: (A-B) HUVECs stably overexpressing TFEB and control ECs (A), and MCMECs from
  WT and EC-Tfeb Tg mice (B), were treated with either vehicle or DOX (1 μM) for 24
  hours, followed by incubation with LysoTracker (50 nM, red) for 4 hours. Cells were
  immunostained for LC3 (gold). Pearson’s correlation coefficients of LC3 and LysoTracker
  colocalization were used to assess the intensity correlation between LC3 and lysosomes,
  analyzed using ImageJ. N = 10–12 per group, scale bar = 20 μm in (A); n = 7–8 per
  group, scale bar = 50 μm in (B). (C) HUVECs stably expressing mCherry-EGFP-LC3 (C-G-LC3-EC)
  were transfected with either siCtrl or siTFEB (20 nM) for 48 h, followed by DOX
  (1 μM) treatment for 24 hours. Representative ratiometric flow cytometry images
  of autophagic flux are shown (left panel), and quantification of autophagic flux
  (mCherry/GFP) in ECs is shown in the right panel (n = 12). (D) GSEA enrichment plot
  of the KEGG_LYSOSOME pathway comparing TFEB_DOX to Ctrl_DOX. (E) GSEA enrichment
  plot of the KEGG_ENDOCYTOSIS pathway comparing TFEB_DOX to Ctrl_DOX. N = 5 per group
  in D and E. (F) Lysosome- and endocytosis-related genes were validated by qPCR (n
  = 5). Data in panels A, B, C, and F were analyzed by two-way ANOVA followed by Tukey
  post hoc test. Data are presented as mean ± SEM, *P < 0.05, **P < 0.01, ***P < 0.001
