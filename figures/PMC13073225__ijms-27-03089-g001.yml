figure_title: The physiological mechanisms of the SV trafficking cycle at the presynaptic
  terminal.
caption: 'The physiological mechanisms of the SV trafficking cycle at the presynaptic
  terminal. ① Vesicle Clustering and Pool Maintenance: Under resting conditions, Synapsin
  I undergoes liquid–liquid phase separation (LLPS), forming droplet-like condensates
  that cluster SVs into a reserve pool, thereby restricting their diffusion. ② Docking,
  Priming, and SNARE Assembly: SVs are recruited to the active zone membrane. Orchestrated
  by scaffold proteins RIM, Munc13, and Munc18, the vesicular v-SNARE (VAMP2) and
  plasma membrane t-SNAREs (Syntaxin-1/SNAP-25) assemble into a “half-zippered” state,
  preparing the vesicle for rapid release. ③ Calcium-Triggered Fusion: Upon action
  potential arrival, voltage-gated calcium channels open, allowing Ca2+ influx. Ca2+
  binds to the C2 domains of Synaptotagmin-1 (Syt1), triggering its insertion into
  the plasma membrane. This action catalyzes the full zippering of the SNARE complex
  (“Full-zippered” state), forcing the fusion pore open for neurotransmitter release.
  ④ Endocytosis and Recycling: Following fusion, vesicle membranes are retrieved.
  The diagram depicts the ultrafast “Kiss-Shrink-Escape” pathway, where vesicles form
  a transient pore, shrink in surface area, and rapidly detach. The traditional Clathrin-mediated
  endocytosis (CME) pathway (coated pit) is shown as an alternative mechanism'
