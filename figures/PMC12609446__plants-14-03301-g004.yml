caption: Quantitative–qualitative composition of differentially spliced events (DSEs)
  across Panax. (a) Total numbers of DSEs for root vs. leaf comparisons in each species.
  (b) P. notoginseng, (c) P. stipuleanatus, (d) P. ginseng, (e) P. quinquefolius,
  and (f) P. japonicus. Blue represents DAS, green represents gain ASE, and purple
  represents lost ASE. (g) Enrichment analysis of ASG in three allotetraploid Panax
  species (P. ginseng, P. quinquefolius, and P. japonicus). Circle size represents
  GeneRatio (N/M), the number of genes from our gene list found in a specific pathway
  (N) to the total number of genes annotated to that same pathway in the genomic background
  (M); color depth indicates statistical significance (−log10(p-adjust))
