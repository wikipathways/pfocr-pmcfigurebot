figure_title: Mechanisms of Cancer Pain Development.
caption: 'Mechanisms of Cancer Pain Development. (A) The complex ecosystem surrounding
  tumor cells collectively forms the TME, which releases inflammatory mediators such
  as NGF, TNF-α, GM-GSF, IL-6, IL-1β, CCL2, ATP, and ET-1. These mediators convert
  the COX-2 substrate AA to PGs, thereby modulating EP and IP receptors on the cell
  membrane and regulating TRPV1, VGSC, and VGCC ion channels. (B) The TME activates
  the release of 5-HT from mast cells and platelets in peripheral injury receptors
  and activates 5-HT3R in the CNS, which produces pain mediators such as NE, 5-HT,
  SP, Glu, and activates NMDA receptors. (C) Tumor signals activate microglia in the
  brain to release inflammatory factors including NO, ATP, MMP, and ROS, which in
  turn activate microglia and astrocytes to release inflammatory cytokines, forming
  a positive feedback loop. (D) When tumors metastasize to the bone, PTHrP, TNF-α,
  IL-1β, and IL-6 are released, which stimulate RANK ligand RANKL synthesis on osteoclasts,
  and RANKL competitively binds to OPG on osteoblasts, activating the RANKL/RANK pathway.
  This induces osteoclast differentiation and maturation, leading to bone destruction
  and the release of large amounts of H+ ions, acidifying the bone microenvironment.
  Pain signals are transmitted from the DRG to the brain, resulting in pain perception.
  “Created in BioRender. Ying, L. (2025) https://BioRender.com/d04hkrx”. 5-HT: 5-Hydroxytryptamine;
  5-HT3R: 5-Hydroxytryptamine receptor 3; AA: Arachidonic Acid; ATP: Adenosine Triphosphate;
  CCL2: C-C Motif Chemokine Ligand 2; CNS: Central Nervous System; COX-2: Cyclooxygenase-2;
  DRG: Dorsal Root Ganglia; EP: Prostaglandin E receptor; ET-1: Endothelin-1; Glu:
  Glutamate; IL-1β: Interleukin-1 beta; IL-6: Interleukin-6; IP: Prostaglandin I2
  receptor; MMP: Matrix Metalloproteinases; NE: Norepinephrine; NGF: Nerve Growth
  Factor; NMDA: N-Methyl-D-Aspartate; NO: Nitric Oxide; OPG: Osteoprotegerin; PGs:
  Prostaglandins; PTHrP: Parathyroid Hormone-related Protein; RANK: Receptor Activator
  of Nuclear Factor Kappa-B; RANKL: RANK Ligand; ROS: Reactive Oxygen Species; SP:
  Substance P; GM-GSF: Granulocyte-macrophage colony-stimulating factor; TME: Tumor
  Microenvironment; TNF-α: Tumor Necrosis Factor alpha; TRPV1: Transient Receptor
  Potential Vanilloid 1; VGCC: Voltage-Gated Calcium Channels; VGSC: Voltage-Gated
  Sodium Channels'
