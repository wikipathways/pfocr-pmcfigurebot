figure_title: Pathogenic mutations in proteins involved in the visual cycle
caption: The complexity of the retinoid isomerization metabolic pathway contributes
  to the diversity of inherited retinal diseases caused by inactivating mutations
  in its molecular components. Specific diseases associated with particular proteins
  are abbreviated and highlighted in red, including Leber congenital amaurosis (LCA),
  retinitis pigmentosa (RP), age-related macular degeneration (AMD), Stargardt disease
  type 1 (STGD1), FA, rod dystrophy (RD), congenital stationary night blindness (CSNB),
  Matthew-Wood syndrome (MWS), and Bothnia dystrophy (BD). Molecules that can be pharmacologically
  targeted to treat some of these diseases are highlighted in green. Created in part
  with BioRender (https://BioRender.com/6m2flsr)
article_title: 'Retinoid dynamics in vision: from visual cycle biology to retina disease
