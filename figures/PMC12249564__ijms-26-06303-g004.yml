figure_title: Analysis of the GSE142025 dataset.
caption: Analysis of the GSE142025 dataset. (A) The 2D PCA distribution trends of
  all groups. Green, blue, and pink ellipses represent the 95% confidence intervals
  for the advanced DN, early DN, and control groups, respectively. (B) Transcriptional
  profile differences between early DN and control visualized by volcano plot. (C)
  Transcriptional profile differences between advanced DN and early DN visualized
  by volcano plot.Red, blue, and gray dots represent significantly upregulated differentially
  expressed genes (DEGs), significantly downregulated DEGs, and non-significant DEGs,
  respectively. (D) KEGG pathways of differentially expressed gene (DEGs) in early
  DN vs. control. (E) KEGG pathways of DEGs in advanced DN vs. early DN (p-value <
  0.05). The cytosolic DNA-sensing pathway (highlighted by a red box) is one of the
  pathways unique to advanced-stage DN. (F) Gene expression heatmap of the cytosolic
  DNA-sensing pathway. (G) Venn diagram showing 26 pathways unique to advanced-stage
  DN (p-value < 0.05)
