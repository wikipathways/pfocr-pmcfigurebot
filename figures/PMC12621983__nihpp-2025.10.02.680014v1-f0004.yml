figure_title: XJ-4–85 treatment induces rapid alterations in glycolytic metabolism
  and signaling
caption: (A) Schematic of glycolytic pathway. Image was created with BioRender. Quantification
  of the HYlight sensor ratio for THP1 (B), Jurkat (C) and MOLM-14 (D) cells treated
  with DMSO, XJ-4–85 or XJ-4–97. (E) Left - a representative image in SH-SY5Y illustrates
  the sensor’s response to fructose-1,6-bisphosphate (FBP) detection following 2 hours
  of treatment with either DMSO vehicle or XJ-4–85. Right - the fluorescence ratios
  (488/405 nm) were statistically analyzed across the same fields. Data are presented
  as mean ± SEM, n = 24. (F) Upregulation of glycolysis in THP1 cells by Seahorse
  assay. (G) Volcano plot showing metabolomic changes in Jurkat cells treated with
  XJ-4–85 compared to DMSO vehicle (2 h). Down- or up-regulated metabolites are shown
  in blue (log2(fold change) < −1) or red (log2(fold change) > 1), respectively. Significance
  was calculated using a two-tailed Student’s t-test (n = 4 biologically independent
  replicates). (H) Enhanced expression of proinflammatory cytokine TNF-α and IL-1β
  in THP1 M0 cells pretreated with DMSO vehicle, NA-11 or XJ-4–85 (5 μM, 2 h) followed
  by 4 h stimulation with LPS (n = 3 biologically independent samples). See Table
  S3 for details
