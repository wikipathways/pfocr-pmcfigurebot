figure_title: Hcy accelerates endothelial senescence via MARS1-HTL-protein K-Hcy pathway.
caption: 'Hcy accelerates endothelial senescence via MARS1-HTL-protein K-Hcy pathway.
  A. Schematic representation of Hcy-induced protein lysine-homocysteinylation (K-Hcy).
  B-C. Age-dependent accumulation of Hcy (B) and HTL (C) in corpus cavernosum of naturally
  aged rats (n=4/group). D-E. Representative immunofluorescence images (D) and semi-quantification
  (E) of K-Hcy in naturally aged rat penile sections. Scale bars: 100 μm. F. Representative
  immunofluorescence images of K-Hcy and MARS1 co-localization in human corpus cavernosum
  from physiological Hcy donors. Scale bars: 50 μm. G. Representative immunoblot of
  K-Hcy in passage 2 (P2) rat primary corpus cavernosum endothelial cells (CCECs)
  treated with Hcy (200 μM) or HTL (100 μM) for 12 h. H. Representative immunoblot
  of MARS1 and K-Hcy in CCECs across population doublings (P1, P3, P6, P9). I-J. Western
  blot analysis of MARS1 and senescence markers (LAMINB1, p53, p21, p16) in HCMECs
  with MARS1 knockdown (P10-15) (I) or MARS1 overexpression (P3-P8) (J) treated with
  200 μM Hcy for 96h. Band intensities were quantified relative to the untreated group
  (n=3). K. Representative images and semi-quantification of SA-β-gal activity in
  MARS1-knockdown or -overexpression HCMECs treated with 200 μM Hcy for 96h (n=3).
  Scale bars: 50 μm'
