figure_title: Functional consequences of PSMB5 knockout in human THP-1 cells.
caption: 'Functional consequences of PSMB5 knockout in human THP-1 cells. (A) Ten-year
  survival analysis of low (bottom 75% of TPM) and high (top 25% of TPM) PSMB5 expressing
  HCC patients using GEPIA: a web server for cancer and normal gene expression profiling
  and interactive analyses [27]. (B) PSMB5KO cells accumulate ubiquitinated proteins
  due to decreased protein degradation. Western blot analysis showing accumulation
  of ubiquitinated proteins in PSMB5-deficient (KO) THP-1 cells compared with wild-type
  (WT) controls on day 7. (C) Flow cytometric analysis of MHC I surface expression
  in WT and PSMB5KO THP-1cells at days 7 and day 14 post-transduction. (D) Relative
  mRNA expression levels of antigen-processing pathway genes in WT (n = 3) and PSMB5-KO
  (n = 3) THP-1 cells. WT: wild-type control; KO: PSMB5 knockout. * p < 0.05'
