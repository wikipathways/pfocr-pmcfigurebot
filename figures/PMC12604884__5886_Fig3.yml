figure_title: Proposed mechanism linking NGLY1 dysfunction to neuroinflammation.
caption: Proposed mechanism linking NGLY1 dysfunction to neuroinflammation. In the
  normal state A) misfolded glycoproteins within the endoplasmic reticulum (ER) are
  processed by NGLY1 which removes N-linked glycans and activates the transcription
  factor nuclear factor erythroid 2 related factor 1 (NFE2L1). Active NFE2L1 translocates
  to the nucleus and induces proteasome gene expression, promoting degradation of
  misfolded proteins and preservation of cellular homeostasis. In the presence of
  B) a pathogenic NGLY1 variant, defective deglycosylation leads to accumulation of
  inactive NFE2L1 and reduced proteasome activity, resulting in protein aggregation
  and cellular stress. Misfolded proteins may activate intracellular sensors such
  as melanoma differentiation-associated protein 5 (MDA5), which stimulates the Janus
  kinase/ signal transducer and activator of transcription (JAK/STAT) signalling cascade
  and upregulates type I interferons and pro-inflammatory cytokines. This pathway
  may contribute to neuroinflammation and dopaminergic neuronal dysfunction implicated
  in PD
