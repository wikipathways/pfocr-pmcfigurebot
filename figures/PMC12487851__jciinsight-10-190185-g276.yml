figure_title: Transcriptomic origins of cellular injury patterns during NMP on single-nuclear
  level point toward mitochondrial and ER injury in PT subclusters
caption: (A) Cell number analyzed using snRNA-Seq of kidneys before and after consensus
  buffer perfusion. (B) Cluster identity. (C) An enrichment score of the curated gene
  sets of the molecular signatures database (MsigDB) applied toward cell types returned
  PTs as the main affected cell type. (D) The top 5 up- and downregulated pathways
  in PTs show mitochondrial and ER stress. (E) Top 10 GO:term analysis of cellular
  components predicted to be involved in PTs solely returned mitochondrial or ER signals.
  cc, cellular components. (F) Pseudotime analysis in PTs returned 1 lineage significantly
  altered during NMP with consensus buffer. (G) Analysis of the one top signal for
  5 different means of analysis (GO:biological process, GO:molecular function, GO:cellular
  component, pathway and gene family) in subclusters of the affected lineage showed
  mitochondrial injury in subcluster 2 and ER injury in subcluster 4. Volcano plots
  of the main individual results for clusters 2 and 4
