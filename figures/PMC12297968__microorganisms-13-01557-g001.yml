caption: 'PROTAC’s mechanism of action: PROTAC is a small molecule composed of two
  active domains and a linker. One of the domains binds to the target protein. In
  contrast, the other binds to the E3 ligase enzyme, bringing the two proteins into
  proximity, which causes the ubiquitination of the target protein, followed by its
  degradation through the proteasomal pathway. This can enable us to eliminate target
  proteins selectively (Ub: ubiquitin)'
