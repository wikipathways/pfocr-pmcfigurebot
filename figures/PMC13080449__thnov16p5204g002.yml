figure_title: The effects of CSE-P12 on the transcriptomic profile and cGAS-STING
  signaling pathway in THP-1 cell-derived macrophages under cGAMP stimulation.
caption: 'The effects of CSE-P12 on the transcriptomic profile and cGAS-STING signaling
  pathway in THP-1 cell-derived macrophages under cGAMP stimulation. (A-C) Physicochemical
  characterization of the bare GNPs, P12 and CSE-P12 by the TEM imaging for size and
  morphology (A), DLS analysis for the hydrodynamic sizes (B), and Zeta potential
  measurement for the surface charges (C); scale bar = 50 nm, N = 3. (D, E) The GSEA
  enrichment analysis of the differential expression genes (DEGs) for the top 20 up-regulated
  (D) and down-regulated (E) pathways for P12, CSE, and CSE-P12 treatments; the red
  check marks indicated the pathways of interest affected by CSE-P12; all pathways
  were significantly enriched with p < 0.05. (F) The heatmap showing top 91 DEGs of
  5 experimental groups: Unstim, cGAMP, cGAMP+P12, cGAMP+CSE and cGAMP+CSE-P12; p
  < 0.0001 and log2 (fc) > 3 as the threshold; N = 4. (G, H) The effects of CSE-P12
  on the activation of IRF (G) and NF-κB/AP-1 (H) upon cGAMP stimulation in the THP-1
  reporter cell-derived macrophages; N = 3. (I, J) The effects of CSE-P12 on the mRNA
  levels of MX1 (I) and ISG15 (J) by RT-qPCR upon cGAMP stimulation for 24 h in THP-1-derived
  macrophages; N = 4. (K) Immunoblots showing the inhibitory effect of CSE-P12 on
  the STING expression and phosphorylation of TBK1 (p-TBK1), IRF3 (p-IRF3), and p65
  (p-p65) as well as the degradation of IκBα in THP-1 cell-derived macrophages stimulated
  by cGAMP for 4 h; β-actin or GAPDH as the internal control; N = 3 for STING and
  p-TBK1, N = 4 for p-IRF3 and p-p65. (L) A scheme summarizing the inhibitory effect
  of CSE-P12 on the cGAS-STING pathway in macrophages. cGAMP = 5 μg/ mL, P12 = 100
  nM, CSE = 1%, CSE-P12 = 100 nM. ns: not significant, *p < 0.05, **p < 0.01, ***p
  < 0.001, ****p < 0.0001 vs. cGAMP stimulation group unless otherwise indicated'
