figure_title: Overall survival by RTK-RAS pathway alteration status across age- and
  gemcitabine-stratified PDAC subgroups.
caption: Overall survival by RTK-RAS pathway alteration status across age- and gemcitabine-stratified
  PDAC subgroups. Kaplan–Meier curves compare overall survival between patients whose
  tumors harbored RTK-RAS pathway alterations and those without detectable RTK-RAS
  alterations, stratified by age at diagnosis and gemcitabine exposure. Panels depict
  (a) early-onset PDAC (<50 years) treated with gemcitabine, (b) early-onset PDAC
  not treated with gemcitabine, (c) late-onset PDAC (≥50 years) treated with gemcitabine,
  and (d) late-onset PDAC not treated with gemcitabine. Shaded bands indicate 95%
  confidence intervals, and tables beneath each panel show numbers at risk over time
