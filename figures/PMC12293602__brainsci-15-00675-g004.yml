figure_title: APOEε4 disrupts microglial lipid metabolism, linking it to inflammation
  and phagocytic deficits.
caption: APOEε4 disrupts microglial lipid metabolism, linking it to inflammation and
  phagocytic deficits. APOEε4 disrupts microglial lipid metabolism by increasing ACSL1-mediated
  triglyceride synthesis while simultaneously promoting cholesterol uptake and biosynthesis
  but suppressing cholesterol degradation and efflux, ultimately leading to intracellular
  cholesterol accumulation and lipid droplets (LDs) formation. The resulting lipid-laden
  microglia exhibit elevated ROS production, which induces neuronal lipid release,
  thereby further exacerbating microglial LDs accumulation, establishing a vicious
  cycle. Moreover, LDs accumulation promotes NF-κB pathway activation with consequent
  pro-inflammatory cytokine release, whereas cholesterol accumulation impairs lysosomal
  function and compromises Aβ clearance. These pathological changes collectively drive
  sustained neuroinflammation, Aβ plaque deposition, and, ultimately, neuronal degeneration
  and death
