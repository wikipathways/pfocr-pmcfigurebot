caption: A-NVs protect hESCs from oxidative stress via the SIRT1/PGC-1α/Nrf2 pathway.
  (A) KEGG pathway enrichment analysis based on the metabolomic profile of the A-NVs.
  (B,C) Western blot analysis of SIRT1, PGC-1α, and Nrf2 protein levels in hESCs exposed
  to H2O2 (200 μM) and subsequently treated with A-NVs. (D,E) Western blot analysis
  of the protein levels of SIRT1, PGC-1α, and Nrf2 in hESCs after exposure to H2O2
  followed by treatment with A-NVs and the SIRT1 inhibitor EX-527. (F) Immunofluorescence
  staining of SIRT1 and Nrf2 in hESCs across different treatment groups. (Data were
  shown as mean ± SD; * p < 0.05, ** p < 0.01, *** p < 0.001, n = 3)
