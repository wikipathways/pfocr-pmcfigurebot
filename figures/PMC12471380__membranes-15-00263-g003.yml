figure_title: Lipid trafficking pathways at the mitochondria-associated membrane (MAM)
  interface and their dysregulation in AD and PD.
caption: Lipid trafficking pathways at the mitochondria-associated membrane (MAM)
  interface and their dysregulation in AD and PD. Adapted from Agrawal et al., Neurobiol.
  Dis., 2020 [11], under the terms of the Creative Commons Attribution 4.0 International
  License (http://creativecommons.org/licenses/by/4.0/). Lipid trafficking pathways
  at the mitochondria-associated membrane (MAM) interface and their dysregulation
  in AD and PD. The illustration depicts the endoplasmic reticulum (ER, green), the
  MAM interface (beige), and the mitochondrion (orange), with lipid transfer routes
  indicated by arrows. Key lipid species, including phosphatidylserine (PS), phosphatidylethanolamine
  (PE), phosphatidylinositol (PI), and phosphatidylcholine (PC), are shown. Solid
  arrows represent normal trafficking routes across the MAM interface, and red arrows
  indicate altered lipid metabolism associated with AD/PD, such as decreased PS and
  mitochondrial PE and increased PI and PC. Tethering proteins facilitate close ER–mitochondria
  contacts, which are essential for lipid exchange and signaling. This figure highlights
  the crucial role of lipid homeostasis at the MAM and its disruption in neurodegenerative
  diseases [11]
