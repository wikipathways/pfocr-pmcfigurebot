figure_title: CuF activates the Nrf2–Keap1 pathway in FFA-treated HepG2 cells.
caption: 'CuF activates the Nrf2–Keap1 pathway in FFA-treated HepG2 cells. (A) Western
  blot analysis of total Nrf2 and Keap1 protein levels in whole-cell lysates following
  the indicated treatments. (B) Western blot analysis of nuclear Nrf2 and Keap1 protein
  levels. (C) IF staining of Nrf2 (red) and nuclei (DAPI, blue) in HepG2 cells, scale
  bar = 50 μm. (D) Co-IP analysis of the interaction between Nrf2 and Keap1. Color
  coding: In panels (A–C), black bars denote the control group or the FFA + CuF co-treatment
  group, and red bars denote the FFA-treated group. Data are representatives of three
  independent experiments and are shown as mean ± SD. * p ≤ 0.05, ** p < 0.01 versus
  control group; # p ≤ 0.05 versus FFA-treated group'
