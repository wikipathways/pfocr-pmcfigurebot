figure_title: Key proteins in IFNγ signaling pathway are expressed at lower levels
  in MNC1
caption: (A) Analysis of RNA-seq dataset GSE288567 revealed that IFNγ signature genes
  are expressed at lower levels in MNC1 compared with AM and MNC2 (28 dpi). 10,000
  live cells from each subset were sorted from the lungs of C57BL/6 mice infected
  with Mtb H37Rv-mCherry (n = 7–8).(B) A schematic diagram shows the key signaling
  proteins regulating the response to IFNγ and representative IFNγ-responsive genes.(C)
  Messenger RNAs encoding key signaling proteins regulating the response to IFNγ and
  representative IFNγ-responsive genes are differentially expressed in AM, MNC1, and
  MNC2. Shown are mRNA normalized read counts for different cell subsets (28 dpi)
  (n=7–8).(D) Key signaling proteins regulating the response to IFNγ and protein products
  of representative IFNγ-responsive genes are differentially expressed in AM, MNC1,
  and MNC2. Flow cytometry was used to measure median fluorescent intensity (MFI)
  of proteins in different lung cell subsets from mice infected with H37Rv-ZsGreen
  (n=4–5).Results are presented as mean ± SD. *p<0.05, **p<0.01, ***p<0.0001, ****p<0.0001
  by Wald test via DESeq2 for (C) and one-way ANOVA for (D); ns = not significant
article_title: Impaired IFNγ responsiveness of monocyte-derived lung cells limits
  immunity to Mycobacterium tuberculosis
