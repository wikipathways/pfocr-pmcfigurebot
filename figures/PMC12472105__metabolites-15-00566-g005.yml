figure_title: The association between metabolic pathways and differentially abundant
  metabolites.
caption: The association between metabolic pathways and differentially abundant metabolites.
  (a) The predicated activities of metabolic pathways derived from the metabolome
  of biopsy and tape stripping samples. Black dots represent the adjusted metabolic
  activities in the normal group (set to 0), while red dots represent levels in the
  LSC group compared to the normal group. The differences in metabolite levels are
  represented using a log2 scale. The dot size corresponds to the pathway’s metabolite
  count, whereas its color reflects the p-value. (b) A Sankey diagram visually representing
  the connections between metabolites (left), their biochemical classes (middle),
  and various metabolic pathways (right) in both biopsy and tape stripping samples,
  offering a comprehensive view of how metabolites are linked to different metabolic
  pathways
