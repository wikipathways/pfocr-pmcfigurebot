figure_title: TRAF2 promoted HSC activation, profibrogenic phenotype and glycolysis
  in vitro.
caption: 'TRAF2 promoted HSC activation, profibrogenic phenotype and glycolysis in
  vitro. (A) Schematic illustration of primary mouse HSCs cultured at specified time
  intervals. (B) Livers from normal mice underwent perfusion and enzyme digestion
  for isolating primary HSCs and culturing these cells in vitro for 3, 7, 14 days,
  and then determination of the transcriptional levels of TRAF2 and ACTA2 was done
  on the cultured HSCs. (C) Comparison of double immunofluorescence results of primary
  mouse HSCs cultured for 6 h, 3, 7 and 14 days. Fluorescent α-SMA was displayed in
  green and fluorescent TRAF2 was shown in red. Scale bars = 10 µm. (D) TRAF2, COL1A1,
  PDGFRβ and α-SMA levels in LX-2 cells cultured on Matrigel were detected using immunoblotting.
  (E) Transcript levels of TRAF2 and indicated fibrosis-related markers in LX-2 cells
  cultured on Matrigel. (F) Immunoblotting analyses of TRAF2, COL1A1, PDGFRβ and α-SMA
  protein levels in LX-2 cells with TRAF2 inhibition or not. (G) Immunoblotting analyses
  of TRAF2, COL1A1, PDGFRβ and α-SMA expression in LX-2 cells with TRAF2 overexpression
  or not. (H) KEGG pathway enrichment analysis based on the identified proteins which
  were differentially expressed in LX-2 cells. (I) Flow cytometry analyses of the
  cell uptake of 2-NBDG. (J) The cell uptake of 2-NBDG was determined using immunofluorescence.
  (K) The cell supernatants collected were processed to assess glucose concentration.
  (L) The cell supernatants collected were processed to examine lactate concentration.
  All data are represented as the means ± SD. *, P<0.05; **, P<0.01; ***, P<0.001;
  ****, P<0.0001. Abbreviations: HSC: Hepatic stellate cell; TRAF2: Tumor necrosis
  factor receptor-associated factor 2; α-SMA: α-smooth muscle actin; COL1A1: Collagen
  type 1; PDGFRβ: Platelet-derived growth factor receptor β; KEGG: Kyoto Encyclopedia
  of Genes and Genomes; 2-NBDG: 2-(N-(7-nitrobenzen-2-oxa-1, 3- diazol-4-yl) amino)-2-deoxyglucose'
