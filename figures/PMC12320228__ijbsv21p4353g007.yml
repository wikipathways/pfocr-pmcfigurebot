figure_title: Undercarboxylated OCN activates the HIF-1α Pathway via GPRC6A to upregulate
  TIMP3 expression and enhance autophagy in chondrocytes.
caption: Undercarboxylated OCN activates the HIF-1α Pathway via GPRC6A to upregulate
  TIMP3 expression and enhance autophagy in chondrocytes. (A) Statistical analysis
  of RNA-Seq results of primary chondrocytes from WT mice treated with or without
  recombinant ucOCN under inflammatory environment, shown by volcanic map. (B) KEGG
  enrichment analysis of RNA-Seq results. (C, D) Gene expression analysis of HIF-1α
  and TIMP3 of WT chondrocytes treated with mouse IgG, IL-1β, IL-1β + recombinant
  ucOCN, IL-1β + OCN antibody respectively for 24 hours. (E) IF analysis of HIF-1α
  accumulation and nuclear translocation in WT chondrocytes treated with mouse IgG
  (CON), IL-1β, IL-1β + recombinant ucOCN, IL-1β + OCN antibody respectively for 24
  hours. Scale bar, 100 μm. (F) Western blotting analysis of MMP13, HIF-1α, p-AKT,
  p-mTOR, p-4EBP1, p-PS6, P62 and LC3b levels of WT chondrocytes treated with mouse
  IgG, IL-1β, IL-1β + recombinant ucOCN, IL-1β + OCN antibody respectively for 24
  hours. (G) Electron microscopy observation of autophagosomes in IL-1β-stimulated
  WT chondrocytes treated with recombinant ucOCN, OCN antibody and recombinant ucOCN
  + LW6 for 24 hours respectively. (H) ATP content of WT chondrocytes treated with
  mouse IgG, IL-1β, IL-1β + recombinant ucOCN, IL-1β + OCN antibody respectively for
  24 hours. (I) Western blotting analysis of PGC1α levels of WT chondrocytes treated
  with mouse IgG (CON), IL-1β, IL-1β + recombinant ucOCN, IL-1β + OCNAb respectively
  for 24 hours. (J) Western blotting analysis of HIF-1α levels of WT chondrocytes
  treated with scrambled control for siGPRC6A (Scr-siGPRC6A), IL-1β, IL-1β + recombinant
  ucOCN, IL-1β + recombinant ucOCN + 60 μM GPRC6A siRNA respectively. (K) Western
  blotting analysis of MMP13, p-AKT, p-mTOR, HIF-1α, TIMP3 levels of WT chondrocytes
  treated with mouse IgG, IL-1β, IL-1β + recombinant ucOCN, IL-1β + recombinant ucOCN
  + LW6 respectively for 24 hours. (L) Gelatin zymography analysis of bioactive MMP2
  and MMP9 accumulation in supernatants of WT chondrocytes treated with mouse IgG,
  IL-1β, IL-1β + recombinant ucOCN, IL-1β + recombinant ucOCN + LW6 respectively for
  24 hours. Ultrafiltration tubes were used to concentrate the supernatants to 5×
  and 10× before tested. (M) Western blotting analysis of TIMP3, COL10a1 and MMP13
  accumulation in WT chondrocytes treated with scrambled control for siTIMP3 (Scr-siTIMP3),
  IL-1β, IL-1β + recombinant ucOCN, IL-1β + recombinant ucOCN + 60 μM TIMP3 siRNA
  respectively. Student's t-test for two groups, one-way ANOVA for three or more.
  *p < 0.05. **p < 0.01. ***p < 0.001. Cells were maintained under monolayer culture
  conditions
