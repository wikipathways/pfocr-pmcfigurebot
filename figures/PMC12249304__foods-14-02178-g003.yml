caption: This diagram illustrates the temperature response mechanism of enzymes and
  genes involved in starch and storage protein synthesis. (a) Biosynthesis pathway
  of endosperm starch in wheat grains; (b) synthesis process of storage protein; (c)
  effect of high temperature on enzyme activity during both starch and storage protein
  synthesis process. The large red arrow in (a,b) represents the common effect of
  high and low-temperature stress on protein and starch metabolism; The small arrows
  in (a,b) represent gene upregulation or downregulation, different colors correspond
  to the different temperature conditions, which are listed in (c), with the arrow
  pointing up/down indicating positive/negative effects
