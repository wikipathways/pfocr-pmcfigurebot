figure_title: Schematic overview of the reaction pathway leading to magnetite (Fe3O4)
  nanoparticles (NPs).
caption: Schematic overview of the reaction pathway leading to magnetite (Fe3O4) nanoparticles
  (NPs). The mechanism is elucidated using a combination of in situ techniques made
  possible by the versatile reactor setup. ATR-IR spectroscopy monitors the evolution
  of organic species throughout the reaction. XAS and PDF analyses reveal the conversion
  of the initial iron(III) acetyl­acetonate complex to the intermediate ferric acetate
  complex, followed by the formation of the magnetite phase. PXRD measurements track
  the emergence of the magnetite crystal structure and NP growth
article_title: Modular reactor for in situ X-ray scattering, spectroscopy and ATR-IR
  studies of solvothermal nanoparticle synthesis
