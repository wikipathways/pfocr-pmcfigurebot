figure_title: Regulatory characteristics of exercise on metabolic pathways.
caption: Regulatory characteristics of exercise on metabolic pathways. (A) Correlation
  network diagram of differential metabolites. Nodes represent the top 30 differential
  metabolites ranked by VIP, analyzed using Spearman’s correlation analysis (after
  FDR correction, p < 0.05, absolute correlation coefficient |corr| > 0.6). Node color
  represents metabolite class (Superclass); edges’ color (red/blue) and thickness
  correspond to the direction of correlation (positive/negative) and the magnitude
  of the correlation coefficient (|corr| value), respectively; (B) KEGG pathway enrichment
  bubble plot. Red dots represent pathways with p < 0.05; (C) DA score plot of metabolic
  pathway activity. The differential abundance (DA) score reflects the overall regulatory
  trend of exercise on different metabolic pathways, ranging from −1 to 1 (−1 indicates
  an overall decrease in metabolite levels in the pathway, while 1 indicates an overall
  increase). The size of the dots represents the number of annotated metabolites in
  the pathway
