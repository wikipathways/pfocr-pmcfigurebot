figure_title: Loss of SEPT9 induces transcription reprogramming of intestinal epithelial
  cells in mice
caption: (A) Principal Component Analysis (PCA) of gene expression profiles in colonic
  and ileal epithelial cells isolated from SEPT9-KO and control mice. (B and C) Volcano
  plots showing gene expression in colonic (B) and ileal (C) epithelium of SEPT9-KO
  as compared with control mice. Significant differentially (P value and log2FC cut-off)
  expressed genes are highlighted by red inverted triangles. (D and E) Bubble plots
  representing pathway enrichment analysis of genes with statistically significant
  differences in expression between the SEPT9-KO and control mice in the colonic (D)
  and ileal (E) epithelium. Each bubble corresponds to a specific pathway, with size
  indicating the gene ratio and color representing the significance of the enrichment.
  The analysis was performed using isolated IEC from 5 mice/group
article_title: The septin cytoskeleton is a regulator of intestinal epithelial barrier
