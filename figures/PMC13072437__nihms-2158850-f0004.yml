figure_title: HDAC5-3SA acts selectively in the PrL, during acquisition of drug-taking
  behavior, to reduce context associated seeking
caption: (A) Experiment 5 timeline showing pathway specific chemogenetic viral strategy
  with hM4d(Gi) expression in NAc-projecting PrL neurons to assay the circuitry underlying
  context associated seeking. (B) Representative expression of GFP-tagged AAVrg-cre
  in NAc projecting PrL neurons, mCherry tagged hM4D+ neurons, and overlay(C) There
  were no group differences in IVSA behavior (n= 20[14 mCherry, 15 hM4D-Gi], 2-way
  RM ANOVA n.s.). (D) Following 7 days of abstinence, CNO-mediated inhibition of NAc-projecting
  neurons failed to alter context associated seeking behavior (n= 29[14 mCherry, 15
  hM4D-Gi], unpaired two tailed t test, n.s.) but (E) did significantly suppress cue-induced
  reinstatement following extinction to criteria (n= 20[14 mCherry, 15 hM4D-Gi], unpaired
  two tailed t test, *** p<0.001.). (F) Experiment 6 timeline with cocaine self-administration
  acquisition prior to viral expression. 24-48 hours following the last day of stable
  cocaine SA, animals were infused with AAV-HDAC5-3SA and underwent three weeks of
  forced abstinence to allow for sufficient AAV expression. (H) HDAC5-3SA expressed
  following acquisition did not suppress context associated cocaine seeking n= 31[16
  eGFP, 15 HD5-3SA], unpaired two tailed t test, n.s.), (I) with no effects observed
  across the full 2-hour session (in 15 min bins) (2-way RM ANOVA n.s.) and (J) no
  effect on cue reinstatement (unpaired two tailed t test, n.s.), indicating that
  HDAC5-3SA works during drug-acquisition to dampen context-drug associations
article_title: Histone deacetylase 5 in prelimbic prefrontal cortex limits context-associated
  cocaine seeking
