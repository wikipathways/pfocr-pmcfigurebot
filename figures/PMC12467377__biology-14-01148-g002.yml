figure_title: The effect of LIPUS on promoting drug delivery by opening the BBB.
caption: The effect of LIPUS on promoting drug delivery by opening the BBB. LIPUS
  with atorvastatin enhances angiogenesis in CTE by modulating the signaling pathways
  of VEGF, AKT, and eNOS. LIPUS with dexamethasone activates the GLUT1 signaling pathway,
  which further activates BDNF and its downstream targets, such as CaMKII and AKT,
  via TrkB and PI3K, thereby decreasing vasogenic edema. Resveratrol with LIPUS activates
  the SIRT signaling pathway to decrease edema and reduce pro-inflammatory mediators,
  thereby decreasing neuroinflammation. Paclitaxel activates the Wnt/beta-catenin
  to promote neuronal development, axonal regeneration, and synapse formation. Additionally,
  it can decrease TLR4 expression to reduce neural inflammation in CTE. Immunotherapy
  with LIPUS promotes the repair mechanism and decreases the inflammatory process
