figure_title: SCI-induced forebrain gene expression changes dependent on ApoE and
  linked to axon regeneration
caption: (A) Schematic describing comparative analysis to identify SCI-induced regeneration-associated
  genes (SCI-RAGs. Genes are deemed as SCI-RAGs if they are differentially expressed
  post-SCI (E2 vs E2-SCI) and are associated with the post-SCI regenerative phenotypes
  of E2 (E4-SCI vs E2-SCI).(B) Gene count of identified SCI-RAGs across multiple cell
  types. The identified SCI-RAGs for pooled excitatory and inhibitory neurons listed
  in Supplemental Table S1.(C) Heatmap showing the relative normalized expression
  of SCI-RAGs of excitatory neurons.(D) Pathway enrichment analysis of excitatory
  neurons SCI-RAGs depicted in B and C. Enrichment terms (nodes) are organized into
  functional groups linked by shared gene associations (edges). Nodes are color-coded
  according to their respective gene ontology (GO) source and scaled in size by the
  number of gene-term associations. Intra-group significant terms (leading terms),
  in bold, are selected based on their respective p-values. A complete list of enriched
  pathway terms can be found in Supplemental Table S2.(E) Bar plot of the leading
  terms, their p-values and associated gene counts, for the pathway enrichment analysis
  of excitatory neuron SCI-RAGs shown in D
