figure_title: Transcriptomic analyses of BmS-LAP mutants.
caption: Transcriptomic analyses of BmS-LAP mutants. (A) Dysregulated genes in ΔBmS-LAP
  animals individuals. Scatter plot analysis revealed differentially expressed genes
  between mutants and WT controls, with red, blue and green points representing up-regulated,
  down-regulated and non-changing genes, respectively. (B) Gene Ontology (GO) terms
  significantly enriched in differentially expressed genes between BmS-LAP mutants
  and wild-type (WT). (C) Top enriched KEGG pathways. (D) Relative expression of genes
  in N-glycosylation pathway. (E) Relative expression of genes in Amino sugar and
  nucleotide sugar metabolism pathway. (F) Relative expression of genes in Fructose
  and mannose metabolism pathway. (G) Content of ATP in testis of WT and ΔBmS-LAP
  silkworm at wandering stage. (H) Relative expression of BmIFT genes. Abbreviations
  of genes are shown in Table S2. Yellow five-pointed stars indicate the pathways
  we are focusing on. “ns”, “*”, “**” and “***” represents non-significant difference,
  “p < 0.05”, “p < 0.01” and “p < 0.001” respectively
