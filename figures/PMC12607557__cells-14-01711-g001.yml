figure_title: 'Host–microbiota co-metabolism of aromatic amino acids: tryptophan (Trp)
  and phenylalanine routes to neuroactive and redox-active metabolites.'
caption: 'Host–microbiota co-metabolism of aromatic amino acids: tryptophan (Trp)
  and phenylalanine routes to neuroactive and redox-active metabolites. (a) Kynurenine
  pathway (green): tryptophan enters the kynurenine axis via TDO/IDOs to N-formyl-L-kynurenine
  → kynurenine, branching through KMO to 3-hydroxykynurenine and 3-hydroxyanthranilic
  acid (→ quinolinic acid) or through KATs to kynurenic acid. 2-amino-3-carboxymuconic-6-semialdehyde
  cyclizes/oxidizes toward quinolinic acid, which is converted by QPRT → nicotinic
  acid mononucleotide and onward to NAD+ (via NMNAT/NAD synthetase). This pathway
  balances neurotoxic (3-hydroxykynurenine, quinolinic acid) and neuroprotective (kynurenic
  acid) signals while supplying cellular NAD+. (b) Serotonin pathway (rose): tryptophan
  is hydroxylated by TPHs to 5-hydroxytryptophan and decarboxylated by aromatic L-amino
  acid decarboxylase (AADC) to serotonin. Serotonin is catabolized by MAOs/ALDH to
  5-hydroxyindole-3-acetic acid, or acetylated/methylated by AANAT → N-acetylserotonin
  and HIOMT/ASMT → melatonin. This route links gut/brain serotonin tone with circadian
  signaling. (c) Indole-pyruvate pathway (blue; microbiota–host): bacterial TNA converts
  tryptophan to indole, which is oxidized to indoxyl and sulfated in the host to indoxyl
  sulfate. Parallel microbial transamination/reduction/oxidation steps yield indole-3-pyruvic
  acid → indole-3-lactic acid/indole-3-acetic acid, indole-3-acetaldehyde, 3-indoleacrylic
  acid, and indole-3-propionic acid. These ligands engage AhR, fortify epithelial
  barriers, and shape systemic immunity. Note: microbiome composition/function was
  not assessed here; indole readouts are interpreted as central metabolic signatures
  rather than direct measures of microbial activity. (d) Tyrosine (Tyr)–dopamine (DA)
  pathway (yellow): phenylalanine → tyrosine (PAH) → levodopa (TH) → dopamine (AADC)
  → noradrenaline (DBH) → adrenaline (PNMT), with COMT/MAOs/ALDH producing 3,4-dihydroxyphenylacetic
  acid, 3-methoxytyramine, homovanillic acid, vanyllilmandelic acid, and 3-methoxy-4-hydroxyphenylglycol.
  In parallel, microbial fermentation of phenylalanine/tyrosine generates p-Hydroxyphenylacetic
  acid and p-Cresol, further host-conjugated to p-Cresyl sulfate—an impactful uremic/toxic
  metabolite. The enzymes AADC, ArAT, MAOs, ALDH, and SULTs are involved not only
  in the Tyr–DA pathway but also participate in the 5-HT or indole–pyruvate metabolic
  pathways. Black arrows: the host routes; red arrows: the gut microbiota routes;
  white arrows: host and microbiota routes with the same enzyme. 3-HAA, 3-hydroxyanthranilic
  acid; 3-HAO, 3-hydroxyanthranilate oxidase; 3-HK, 3-hydroxykynurenine; 3-MT, 3-methoxytyramine;
