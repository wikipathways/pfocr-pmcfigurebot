figure_title: Effect of XZ1606 on fibrosis markers in TGF-β-activated LX-2 cells.
caption: Effect of XZ1606 on fibrosis markers in TGF-β-activated LX-2 cells. (A) Western
  blot analysis showing the protein expression of the fibrotic marker Col1A1 in LX-2
  cells treated with 5 ng/mL and 10 ng/mL of XZ1606. (B-D) mRNA expression levels
  of fibrotic markers Col1a1, α-sma, and Mmp2 in LX-2 cells treated with 5 ng/mL and
  10 ng/mL TGF-β, measured by qRT-PCR. Data are expressed as fold change relative
  to the control group, normalized to GAPDH expression (n = 3). (E) Western blot analysis
  showing the degradation of BRD2, BRD3, BRD4, and the downregulation of Col1A1 in
  LX-2 cells treated with 5 ng/mL TGF-β and 100 nM XZ1606. (F-I) Quantification of
  BRD2, BRD3, BRD4, and Col1A1 protein levels, normalized to β-actin, in control,
  TGF-β (5 ng/mL), and XZ1606 (100 nM) treatment groups (n = 6). (J-L) mRNA expression
  of Col1a1, Mmp2, and Pdgf in LX-2 cells treated with TGF-β (5 ng/mL) and XZ1606
  (100 nM) (n = 3). (M) Hierarchical clustering of transcript expression data showing
  differential gene expression patterns across control, TGF-β, and XZ1606 treatment
  groups (n = 3). (N) Volcano plots showing differential gene expression between the
  TGF-β model vs. control and XZ1606 treatment vs. TGF-β model. Upregulated genes
  are shown in red and downregulated genes in blue. (O) KEGG pathway enrichment analysis
  of upregulated genes in the TGF-β model vs. control group, highlighting fibrotic
  pathways. (P) KEGG pathway enrichment analysis of downregulated genes in the XZ1606
  treatment group vs. TGF-β model, showing the reversal of fibrotic pathways by XZ1606.
  Data are represented as the mean ± SEM, with statistical significance determined
  by one-way ANOVA followed by post-hoc comparisons (p < 0.05)
