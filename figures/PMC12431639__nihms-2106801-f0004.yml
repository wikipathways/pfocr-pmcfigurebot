figure_title: Chromatin accessibility evaluation of macrophages associated with spherical
  or discoidal particles in vitro
caption: (A) Principal component analysis of global accessibility profile of Mφ, Mφ-S,
  and Mφ-D. Each point represents one independent replicate. Axes represent the percent
  of variance explained by the respective principal components (PC1, PC2); (n = 4).
  (B) Volcano plots of differentially accessible chromatin regions with pairwise sample
  group comparisons. Genes of interest are labeled. Threshold for adjusted p value
  was 0.05. For each volcano plot, data from the former group was normalized by the
  reference condition in the latter; for example, Mφ-S vs. Mφ indicates the differential
  gene expression of Mφ-S is normalized to that of Mφ. Therefore, a positive binary
  logarithm represents gene upregulation in the Mφ-S condition compared to Mφ, but
  conversely, a negative value represents downregulation. (C) Pathway overrepresentation
  enrichment analysis results for upregulated differentially accessible peaks between
  sample conditions. Generated using Enrichr, focusing on the MSigDB Hallmark 2020
  database. The color scale represents the transition from high (pink) to low (blue)
  values of significance. (D) Correlation plots of significantly shared genes in RNA-Seq
  and ATAC-Seq analyses. Colored points indicate regions overlapping known promoter
  regions. (A-D) Differential peak analysis was performed using the csaw R package.
  Significant associations were identified at a Benjamini-Hochberg adjusted FDR of
  ≤ 5%
