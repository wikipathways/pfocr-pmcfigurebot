figure_title: Macrophage type-specific roles of itaconate on Mtb control and inflammatory
  responses
caption: |-
  (A) Mtb colony forming units (CFUs) quantified from wild type (green symbols) and Irg1−/− (gold symbols) MCDM (shaded bars) and AM-L macrophages (clear bars), infected at an MOI of 3, by day of infection(B) Relative concentration of CXCL1 or CCL4 produced by WT or Irg1
  −/− MCDM (shaded bars) and AM-L (clear bars) macrophages on day 3 of a Mtb infection.(C) Relative concentration of IL1-β and IL-1RA produced by WT and Irg1−/− MCDM and AM-L macrophages on day 3 of a Mtb infection.(D) Itaconate negatively regulates the Type I interferon response to Mtb in MCDM but not AM-L macrophages. Heatmap depicting z-score of hallmark Type I interferon gene expression in MCDM and AM-L macrophages in the presence or absence of Mtb. Partitioning is based on k-means clustering.(E) Hyperinduction of the Type I IFN pathway in itaconate deficient macrophages is due to phagosomal permeabilization by esx-1. RT-qPCR quantifying Trim5, Isg20, and Cxcl11 transcripts, normalized to GAPDH, in MCDM macrophages in response to infection by wildtype Mtb or MtbΔrv3877 (lacking the esx-1 secretion system) for four hours.** P value <0.01 **** P value <0.0001 by two-way ANOVA. Error bars are SD
article_title: Human iPSC derived alveolar macrophages reveal macrophage subtype specific
