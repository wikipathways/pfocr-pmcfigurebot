figure_title: Matrix stiffness drives a pro-anabolic phenotype, while reduced stiffness
  supports TLR2-mediated inflammatory responses in human GFs
caption: '(A) Bubble plot showing the gene set enrichment of pathways significantly
  upregulated in GFs cultured on stiff hydrogels (G′~2kPa) compared to soft hydrogels
  (G′~0.75kPa). Pathways are predominantly related to ECM production and organization.
  The gene ratio (x-axis) is the proportion of differentially expressed genes in a
  pathway. Bubble size indicates the count (number of genes in the pathway), and the
  color scale represents the p-value (Benjamini-Hochberg corrected) for enrichment.
  (B) Heatmap illustrating the relative expression of differentially expressed genes
  in the stiff versus soft hydrogel environments. (C) ELISA quantification of secreted
  pro-inflammatory mediators IL-6, IL-8, and CCL-2 from GFs cultured in hydrogels
  of varying stiffness (G′: 0.75, 1.5, and 2kPa) following TLR2 activation. (D) Cell
  viability assay showing that neither hydrogel stiffness nor TLR2 agonist stimulation
  significantly impacted GF viability over the culture period. (E) Bubble plot showing
  the gene set enrichment of inflammatory signaling pathways regulated in GFs cultured
  in stiff hydrogels compared to soft, both with TLR2 agonist stimulation. Bubble
  size corresponds to the count, and color scale indicates the −log10(p value) of
  the pathway. Circles indicate downregulation, and triangles indicate upregulation
  in stiff hydrogels. (F) Heatmap showing the relative expression of differentially
  expressed genes in GFs cultured in soft versus stiff hydrogels, following TLR2 agonist
  stimulation. Data are presented as mean ± SD; P-values from statistical tests are
  indicated'
