figure_title: Microbiome–Gut–Brain Axis in Postoperative Delirium.
caption: 'Microbiome–Gut–Brain Axis in Postoperative Delirium. This figure illustrates
  the bidirectional communication between gut microbiota and brain function in postoperative
  delirium. (A) depicts the normal homeostatic state with a diverse microbial ecosystem
  dominated by beneficial bacteria (Bifidobacterium, Lactobacillus), intact intestinal
  and blood–brain barriers, and balanced neural, immune, and metabolic signaling pathways
  connecting the gut and brain. (B) demonstrates perioperative disruption following
  surgery and anesthesia, characterized by gut dysbiosis with 30–50% reduced microbial
  diversity, compromised intestinal barrier integrity, increased inflammatory signaling,
  blood–brain barrier disruption, and subsequent neuroinflammation. The correlation
  between gut dysbiosis and systemic inflammation (r = 0.48–0.65, p < 0.01) illustrates
  the mechanistic relationship underlying postoperative delirium development. (C)
  shows how therapeutic interventions targeting the gut microbiome (probiotics/prebiotics)
  can restore microbial diversity, repair intestinal barrier function, normalize gut–brain
  communication pathways, reduce neuroinflammation, and ultimately improve cognitive
  outcomes with a 15–28% reduction in delirium incidence. The timeline demonstrates
  the progression from baseline through perioperative disruption (24–72 h post-surgery)
  to intervention-mediated improvement. This microbiome–gut–brain axis represents
  a promising mechanistic target for preventing and treating postoperative delirium
  in elderly surgical patients. References: [158,159,160,161,162]'
