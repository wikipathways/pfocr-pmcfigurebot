figure_title: 'Mechanisms by which the gut microbiota mediates stress and depression:
  Neurotransmitter, Immune, and Endocrine Pathways.'
caption: 'Mechanisms by which the gut microbiota mediates stress and depression: Neurotransmitter,
  Immune, and Endocrine Pathways. Note: The figure illustrates the mechanism of action
  of the gut microbiota between stress and depression, which is mediated by three
  key pathways: neurotransmitter, immune, and endocrine. (1) Neurotransmitter pathway:
  TRP in the gut is involved in the synthesis of 5-HT under the action of the TPH1
  enzyme. Bifidobacterium, Clostridium ramosum and others regulate TPH1. Intestinal
  5-HT affects the central TPH2 enzyme through the blood–brain barrier, ultimately
  influencing the level of 5-HT in the brain and regulating emotions, and abnormalities
  in this protein can lead to depressive behavior. (2) Immune pathway: Dysbiosis triggers
  intestinal barrier disruption, and endotoxin translocation leads to systemic inflammation.
  Proinflammatory factors (such as IFN-γ and TNF-α) induce neuroinflammation, whereas
  anti-inflammatory substances such as SCFAs (such as butyric acid) exert anti-inflammatory
  effects. Histamine (a microbial metabolite) activates H1/H3 receptors, exacerbating
  inflammation. Chronic inflammation activates microglia, ultimately leading to depressive
  symptoms. (3) Endocrine pathway: Gut microbes regulate enteroendocrine cells, affecting
  the secretion of hormones such as CRH, ACTH, and cortisol. Dysbiosis leads to neuroendocrine
  disorders, overactivation of the HPA axis, increased cortisol levels, triggering
  a stress response, and ultimately leading to depressive behavior. The figure clearly
  shows the interactions of key substances and links in each pathway, revealing the
  complex mediating mechanisms of the gut microbiota in the stress–depression association.
  (The red arrow signifies an upward trend, whereas the blue arrow denotes a downward
  trend.)'
