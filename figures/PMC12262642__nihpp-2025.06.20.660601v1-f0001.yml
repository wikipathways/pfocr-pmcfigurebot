figure_title: Increased antibiotic resistance occurs due to loss of MMR genes and
  not increased mutation rates
caption: '(A) Five transductants of ΔmutL::kan and ΔmutS::kan into a ΔyhdP strain
  were assayed and had comparable levels of vancomycin resistance as demonstrated
  by efficiency of plating assays (EOPs). (B) Kirby-Bauer tests show increased levels
  of antibiotic resistance in ΔbamE ΔmutL strains as compared to the ΔbamE strain
  as demonstrated by smaller zones of clearance. In contrast, black arrows indicate
  colonies that have acquired spontaneous resistance within the zone of clearance.
  Scale bars: 2 mm. (C) Quantification of Kirby-Bauer tests demonstrates increased
  resistance in the ΔmutL ΔbamE strain compared to the ΔbamE strain. Mean of five
  biological replicates ± SEM. * p<0.05 and ** p<0.01 by Student’s T test. (D) Loss
  of MMR genes at different steps in the MMR pathway confers varying degrees of antibiotic
  resistance. Inhibition of ΔmutL and ΔmutS causes higher levels of antibiotic resistance
  than wild type. ΔmutH is consistently less resistant than ΔmutL and ΔmutS, while
  the degree of resistance with ΔuvrD differs between antibiotics. However, Δdam,
  which causes the same increase in mutations as loss of MMR, does not confer resistance.
  EOP images are representative of at least three independent experiments'
article_title: Loss of DNA mismatch repair genes leads to acquisition of antibiotic
  resistance independent of secondary mutations
