figure_title: The mechanism of AhR mediating lipid peroxidation-ferroptosis through
  the SLC7A11/GPX4 axis or the ALDH1A3/FSP1 axis under different ligand binding or
  cytosolic lysosomal cystine deficiency states.
caption: The mechanism of AhR mediating lipid peroxidation-ferroptosis through the
  SLC7A11/GPX4 axis or the ALDH1A3/FSP1 axis under different ligand binding or cytosolic
  lysosomal cystine deficiency states. AhR modulates the expression of diverse target
  genes across different contexts, thereby influencing ferroptosis in various disease
  states. Specifically, lysosomal cystine deficiency triggers ATF4 expression via
  the AhR signaling pathway, leading to the activation of the SLC7A11/GPX4 antioxidant
  system, which in turn inhibits ferroptosis in tumors. I3P inhibits ferroptosis by
  activating the AhR-mediated SLC7A11/GPX4 axis antioxidant system in bronchial epithelial
  cells and non-small cell lung cancer. In colorectal cancer, intestinal metabolites
  regulate the IDA-AhR-ALDH1A3 pathway and affect the level of NADPH to promote the
  production of FSP1-mediated reduced ubiquinone, thereby inhibiting tumor cell ferroptosis
  and promoting tumor progression. AhR, aryl hydrocarbon receptor; SLC7A11, solute
  carrier family 7 member 11; ALDH1A3, aldehyde dehydrogenase 1 family, member A3;
  FSP1, ferroptosis suppressor protein 1; GPX, glutathione peroxidase; IDA, trans-3-indoleacrylic
  acid; ATF4, activating transcription factor 4; CoQ10, coenzyme Q10; NADP+, nicotinamide
  adenine dinucleotide phosphate
