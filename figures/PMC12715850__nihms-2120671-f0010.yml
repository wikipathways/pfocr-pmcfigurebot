figure_title: A model showing the non-canonical roles of CDK1, PLK1, and Aurk proteins
caption: We propose that CDK1 affects EMT in the blastula stage potentially by regulating
  ΔNp63α (H. Chen et al., 2022). PLK1 affects EMT in the blastula stage by regulating
  ERK (Fig. 9) (J. Wu et al., 2016). During the gastrula stage, CDK1 and PLK1 inhibit
  apoptosis in PCs (Fig. 8D), potentially by phosphorylation of Cas-9 (Allan and Clarke,
  2007) and YBX1 (Li et al., 2023), respectively. Aurk and PLK1 inhibition resulted
  in significantly decreased pERK (Fig. 9). Aurk may activate PLK1 to impact the ERK
  signaling pathway (Macůrek et al., 2008). PLK1 can directly lead to activation of
  ERK signaling (J. Wu et al., 2016), which has been shown to impact gastrulation,
  skeletogenesis, and PCs development (Fernandez-Serra et al., 2004; Kumano and Foltz,
  2003). Dashed arrow indicates a potential interaction. Solid arrows and bars are
  based on our findings
