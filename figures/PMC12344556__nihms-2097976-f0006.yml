figure_title: Pkm2➔1 splice variant switching increases the abundance of 3‑carbon
  glycolytic intermediates in myofibroblasts.
caption: Pkm2➔1 splice variant switching increases the abundance of 3‑carbon glycolytic
  intermediates in myofibroblasts. Cardiac fibroblasts were isolated from Pkm2fl/fl
  mice and treated with adenoviruses encoding iCre or LacZ (control). After 48 h,
  the fibroblasts were treated with bFGF (20 ng/ml) or TGFβ (10 ng/ml) for 48 h. Cells
  were then cultured with [U-13C]-glucose for 12 h. Polar fractions were subjected
  to liquid chromatography/mass spectrometry analysis. (A) Schematic displaying glycolytic
  pathway (schematic made in BioRender). (B–F) Total 13C fractional enrichment (left
  panels) and relative pool abundance (right panels). 13C enrichment values were transformed
  via logit transformation prior to statistical analysis. Relative pool abundance
  values were normalized to total protein prior to statistical tests. n = 4 male mice
  per group. For statistical analyses, two-way ANOVA with Sidak’s post-hoc test was
  performed. Data are shown as means ± SEM. Hexose-1,6-BP, hexose-1,6-bisphosphate;
  DHAP, dihydroxyacetone phosphate; 3-PG, 3-phosphoglycerate; PEP, phosphoenolpyruvate
