figure_title: Transcriptomic analysis of GLP-2 treatment in HepG2 cells.
caption: 'Transcriptomic analysis of GLP-2 treatment in HepG2 cells. (A) Venn diagram
  presenting 76 overlapping DEGs between the FFAs vs. control and the 1000 nmol/l
  GLP-2 + FFAs vs. FFAs groups. (B) Volcano plot demonstrating DEGs between the 1000
  nmol/l GLP-2 + FFAs and FFAs groups. Red: upregulated genes; green: downregulated
  genes; gray: non-significant genes. (C) GO enrichment analysis (n=3) depicting gene
  distribution across biological processes, cellular components, and molecular functions
  in the GLP-2-treated group. (D) KEGG pathway enrichment analysis (n=3) indicating
  activation of adipokine signaling, AMPK, and PPARα pathways in the GLP-2-treated
  group'
