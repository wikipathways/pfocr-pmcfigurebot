caption: MicroRNA-mediated regulation of immune responses in common bacterial infections.
  This schematic illustrates representative microRNA-regulated signaling pathways
  involved in host immune responses to Salmonella (S), Listeria monocytogenes (LM),
  Mycobacterium tuberculosis (MTB), and Helicobacter pylori (HP). Specific miRNAs
  modulate key innate and adaptive immune pathways, including TLR/NF-κB signaling,
  cytokine production (IL-1β, IL-6, TNF-α), metabolic reprogramming, and T-cell differentiation.
  Through targeting transcription factors, signaling adaptors, and metabolic regulators,
  miRNAs fine-tune inflammatory intensity, immune cell activation, and host pathogen
  interactions during bacterial infection
