figure_title: Proposed pathway diagram linking uric acid to CTGF expression and prostate
  cancer risk through TGF-β/SMAD signaling in the tumor microenvironment.
caption: 'Proposed pathway diagram linking uric acid to CTGF expression and prostate
  cancer risk through TGF-β/SMAD signaling in the tumor microenvironment. Soluble
  uric acid (a metabolic DAMP) activates the NLRP3 inflammasome, causing IL-1β release
  and ROS generation, which in turn converts latent TGF-β to its active form. Active
  TGF-β signals through SMAD2/3 to induce CTGF (CCN2) transcription. CTGF is a matricellular
  factor that strongly induces fibroblast (CAF) activation and ECM deposition and
  has been implicated in promoting tumor angiogenesis. These stromal changes create
  a reactive tumor microenvironment (with CAFs, dense ECM, and new vessels) that fosters
  prostate cancer cell motility and metastatic spread. Experimental studies and reviews
  describe UA as an inflammasome-activating DAMP, TGF-β/SMAD-driven induction of CTGF,
  and CTGF’s roles in fibrosis and angiogenesis. The pro-metastatic effects of CTGF
  in prostate cancer are supported by reports of enhanced prostate cancer cell migration
  and bone metastasis. Preclinical efficacy of TGF-βR inhibitors in prostate cancer
  models is documented. All pathways and interventions shown are grounded in these
  references.Abbreviations: CAF: Cancer-associated fibroblast; CTGF: Connective tissue
  growth factor; DAMP: Damage-associated molecular pattern; ECM: Extracellular matrix;
  IL-1β: Interleukin-1 beta; ROS: Reactive oxygen species; TGF-β: Transforming growth
  factor beta'
article_title: 'Association between serum uric acid and prostate cancer risk: The
