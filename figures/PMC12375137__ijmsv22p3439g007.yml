figure_title: The regulation of renin in the macula densa and collecting ducts.
caption: The regulation of renin in the macula densa and collecting ducts. AVP can
  bind to the V1aR of macula densa cells and the V2R of principal cells. AVP/V1aR
  stimulates the expression of nNOS and COX-2, leading to NO and PGE2 production by
  macula densa cells, which stimulates renin production by juxtaglomerular cells and
  subsequently induces an increase in Ang II and aldosterone levels to promote water
  reabsorption. AVP/V2R promotes renin gene expression by enhancing CREB phosphorylation
  through the cAMP/PKA pathway, and PKA also reduces ENaC degradation by phosphorylating
  Nedd4-2. AVP, arginine vasopressin; nNOS, neuronal nitric oxide synthase; COX-2,
  cyclooxygenase-2; NO, nitric oxide; PGE2, prostaglandin E2; AGT, angiotensinogen;
  Ang I, angiotensin I; Ang II, angiotensin II; ACE, angiotensin-converting enzyme;
  AC, adenylate cyclase; ATP, adenosine triphosphate; cAMP, cyclic adenosine monophosphate;
  PKA, protein kinase A; CREB, cAMP response element binding protein; V1aR, vasopressin
  receptor type 1a; V2R, vasopressin receptor type 2; AT1R, angiotensin II receptor
  type 1; ENaC, epithelial Na+ channel; Nedd4-2, neural precursor cell expressed,
  developmentally down-regulated 4-2; P, phosphorylated
