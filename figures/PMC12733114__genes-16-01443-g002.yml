figure_title: Kinase-centered intracellular networks as therapeutic targets in TRD
  Schematic representation of intracellular kinase-dependent signaling pathways involved
  in neuroplastic regulation and antidepressant response.
caption: Kinase-centered intracellular networks as therapeutic targets in TRD Schematic
  representation of intracellular kinase-dependent signaling pathways involved in
  neuroplastic regulation and antidepressant response. Under physiological conditions,
  antidepressant therapy activates kinase cascades including Akt–mTOR, MAPK/ERK, and
  eEF2K–eEF2, which promote synaptic protein synthesis, energy metabolism, and neuronal
  survival. In contrast, chronic stress and TRD are associated with inhibition of
  mTOR and ERK signaling, activation of GSK-3, and increased REDD1 and TSC expression,
  leading to impaired neuroplasticity, synaptic dysfunction, and cellular atrophy.
  Pharmacological activation of mTOR or inhibition of GSK-3 reverses these maladaptive
  changes, restoring dendritic spine formation and synaptogenesis. Molecular processes
  regulated by these pathways include gene transcription, apoptosis, autophagy, cell-cycle
  progression, protein synthesis, and inflammatory response. Collectively, these kinase
  networks integrate metabolic, structural, and transcriptional mechanisms that converge
  on neuronal plasticity, regeneration, and resilience in TRD. Akt, protein kinase
  B; eEF2, eukaryotic elongation factor 2; eEF2K, eukaryotic elongation factor 2 kinase;
  ERK, extracellular signal-regulated kinase; GSK-3, glycogen synthase kinase 3; JNK,
  c-Jun N-terminal kinase; MEK, mitogen-activated protein kinase kinase; MKP-1, mitogen-activated
  protein kinase phosphatase-1; mTOR, mechanistic target of rapamycin; PDK1, 3-phosphoinositide-dependent
  protein kinase-1; p38, p38 mitogen-activated protein kinase; REDD1, regulated in
  development and DNA damage response 1; RHEB, Ras homolog enriched in brain; SK6,
  ribosomal protein S6 kinase beta-1; TSC, tuberous sclerosis complex
