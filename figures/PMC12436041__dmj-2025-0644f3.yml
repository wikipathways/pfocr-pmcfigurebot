figure_title: Lipid flux related to hepatic TG accumulation in MASLD and changes in
  lipid flux through the liver following weight reduction by dietary intervention
  in obese subjects with low and high liver fat.
caption: 'Lipid flux related to hepatic TG accumulation in MASLD and changes in lipid
  flux through the liver following weight reduction by dietary intervention in obese
  subjects with low and high liver fat. (A) FA sources contributing to hepatic and
  VLDLTG: Donnelly et al. [67]. reported that in patients with MASLD, hepatic TG originates
  primarily from FFAs, followed by DNL and dietary fat. DNL was elevated even in the
  fasting state and showed no diurnal variation. The figure highlights the significant
  roles of peripheral lipolysis and hepatic DNL in MASLD pathogenesis and underscores
  the need to consider all four pathways—FFAs, DNL, dietary spillover, and chylomicron
  remnants—in understanding hepatic fat accumulation. Three major boxed pathways indicate
  the metabolic routes from FFAs to intrahepatic TG and VLDL-TG. (B) Summary of changes
  in the contribution of the three major lipid fluxes to hepatic VLDL-TG palmitate
  following dietary intervention in a study conducted by Lambert et al. [60]. In the
  study, overweight adults with H-LF (hepatic TG ≥ 5.6%) or L-LF (hepatic TG < 5.6%)
  received dietary counseling for six months. For additional information, please refer
  to the literature [60,67]'
