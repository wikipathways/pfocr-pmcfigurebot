caption: Overview of the retrovirus (HIV-1) life cycle. This figure illustrates key
  stages from viral entry and reverse transcription to integration, replication, assembly,
  and budding of the mature virion. HIV-1 is shown here as a model system due to its
  extensively studied replication pathway and the availability of data on plant-derived
  compounds targeting various stages. Created using a template retrieved from Goldman-Israelow.
