figure_title: DECIPHAER predicts latent features and transcriptional responses from
  morphological measurements of Mtb treated with model-unseen drugs
caption: (A, E, I) UMAP plots (left) and dendrograms (right) of DECIPHAER latent embedded
  morphological profiles for which there was no available RNA-seq data (test and red
  in the dendrogram), along with the training compounds’ latent embeddings (train).
  The hierarchical clustering was performed on the median latent feature values for
  each drug using Manhattan distance and Ward2 clustering. Colors indicate the cellular
  target of the drug.(B,F,J) Jaccard similarity coefficient (unitless) between morphological
  data of drug morphological data translated to RNA-seq and all training-set RNA-seq
  (Methods).(C,D,G,H,K,L) Up- and down-regulated pathway enrichments from RNA-seq
  predicted from morphological data. Differential expression testing for enrichment
  analysis in C,D; G,H; and K,L; was performed on the translated data from the clusters
  in A, E and I, respectively, against all other training-set translated RNA-seq using
  Wilcoxon-rank sums. The color of the bubble plot indicates the highest -log10(p-value)
  among the differentially expressed genes in the pathway and the x-axis indicates
  the fold enrichment of the pathway (PathFindR)
article_title: Integration of multi-modal measurements identifies critical mechanisms
