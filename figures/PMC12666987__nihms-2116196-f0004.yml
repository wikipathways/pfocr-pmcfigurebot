figure_title: Anaerobic purine degradation represents a widely distributed third selenium
  utilization trait in bacteria
caption: (A) Overview of selenium utilization traits in bacteria. (B) Uric acid consumption
  by C. sporogenes wild-type during growth in defined M9 media with or without the
  trace elements, molybdenum (Mo; sodium molybdate) and selenium (Se; sodium selenite).
  (C-E) Hypoxanthine, xanthine, and uric acid consumption by wild-type and mutant
  strains of C. sporogenes. (F) Enzyme activity of 2,8-dioxopurine dehydrogenase (DOPDH;
  encoded by the xdhAC gene) purified from either wild-type or selD mutant in the
  forward reaction, catalyzing the reduction of uric acid to 2,8-dioxopurine. (G)
  Overview of the purine metabolism pathway in gut bacteria. XDH and DOPDH are selenium-dependent
  molybdenum hydroxylases. The pathway generates ATP and culminates in pyruvate production,
  which can either be used for anabolic pathways or further catabolized to short-chain
  fatty acids. For B-F, metabolites were analyzed by Poroshell positive LC-MS and
  data represent means ± standard deviations from three replicates
article_title: Gut bacteria degrade purines via the 2,8-dioxopurine pathway
