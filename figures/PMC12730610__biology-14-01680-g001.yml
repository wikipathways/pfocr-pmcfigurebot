figure_title: Apoptotic pathways activated in HIV-infected CD4+ T helper cells encompass
  both the extrinsic (death receptor–mediated) and intrinsic (mitochondria-dependent)
  mechanisms.
caption: Apoptotic pathways activated in HIV-infected CD4+ T helper cells encompass
  both the extrinsic (death receptor–mediated) and intrinsic (mitochondria-dependent)
  mechanisms. Key viral proteins driving apoptosis include the Evn gp120 subunit,
  the Nef, Tat, and Vpr. The Evn gp120 subunit protein binds to the CD4 receptor and
  engages either the CCR5 or CXCR4 chemokine coreceptors to facilitate viral entry.
  Beyond entry, this interaction induces FasL expression on the T-cell surface, thereby
  activating the extrinsic apoptotic pathway. The soluble extracellular Nef protein
  also interacts with the CXCR4 receptor to amplify apoptotic signaling. Additionally,
  Evn gp120 subunit interaction with CCR5/CXCR4 upregulates Fas and FasL expression
  while downregulating anti-apoptotic Bcl-2 family proteins, tipping the balance toward
  cell death. Simultaneously, the Tat protein reinforces Fas/FasL signaling and activates
  caspase-8, accelerating apoptotic cascade propagation. Intracellular Tat, Nef, and
  Vpr disrupt mitochondrial integrity by inhibiting Bcl-2 family members, promoting
  cytochrome c release, apoptosome assembly, and downstream caspase activation. Moreover,
  Vpr induces G2 cell-cycle arrest, further impairing T-cell survival. Caspases 3/7,
  together with kinases p38 MAPK and JNK, act on the nucleus, causing DNA fragmentation.
  CCR5, C–C chemokine receptor type 5; CXCR4, C–X–C chemokine receptor type 4; FasL,
  Fas ligand; Bcl-2, B-cell lymphoma 2; Vpr, viral protein R; Tat, transactivator
  of transcription; Nef, negative regulatory factor; MAPK, mitogen-activated protein
  kinase; JNK, c-Jun N-terminal kinase; G2, gap 2 phase of the cell cycle
