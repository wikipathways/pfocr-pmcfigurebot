figure_title: RANKL stimulates the NAD salvage pathway which is attenuated by estrogen
caption: (a) Schematic illustration of NAD+ biosynthetic pathways. In the de novo
  pathway the essential amino acid tryptophan (TRP) from the diet is utilized to produce
  NAD+ via several reactions (dashed arrow). The salvage pathway recycles NAM, which
  is generated as a by-product of NAD+-dependent enzymes such as SIRT3; PA=Phthalic
  Acid. (b-h) BMMs were isolated from young female C57BL/6 mice and cultured with
  M-CSF and RANKL, in the presence or absence of FK866 or PA for 24 h. (b) NAD+ levels
  in whole cells. (c) Representative images and quantification of TRAP-positive osteoclasts
  after 5 days. (d) NAD+ levels in mitochondrial-enriched fractions. (e) SIRT3 activity.
  (f) Oxygen Consumption Rate. (g) ATP levels. (h) Apoptosis by caspase-3 activity.
  (i-j) Human BMMs were cultured with M-CSF and RANKL in the presence or absence of
  FK866, as above. (i) NAD+ levels after 24 h and (j) representative images and quantification
  of TRAP-positive osteoclasts after 7 days. (k) mRNA levels of the indicated enzymes
  in BMMs cultured with M-CSF and RANKL the presence or absence of E2 for the indicated
  timepoints. P values in grey indicate comparisons with time 0. P values in red indicate
  comparison of RANKL vs RANKL+E2 within the same time point. (l) BMMs were isolated
  from young female C57BL/6 mice and cultured with M-CSF and RANKL the presence or
  absence of E2 for 24 hours, representative Western blot images and quantification
  of the indicated proteins in mitochondrial enriched fractions; β-actin in cytosol
  and VDAC in mitochondria indicate efficacy of cellular compartment isolation. (m)
  mRNA levels in BMMs transduced with Nmnat1 and Nmnat3 sh or control sh lentivirus
  particles. (n) NAD+ levels after 24 h and (o) representative images and quantification
  of TRAP-positive osteoclasts after 5 days. Scale bar 500 μm. Line and error bars
  represent mean ± SD. P values using two-tailed Student’s t-test, 1-way ANOVA followed
  by Dunnett’s multiple comparisons test, or 2-way ANOVA followed by Šídák’s multiple
  comparisons test
