figure_title: Diagnostic and management algorithm for suspected Primary Failure of
  Eruption (PFE).
caption: Diagnostic and management algorithm for suspected Primary Failure of Eruption
  (PFE). The flowchart outlines a structured clinical pathway beginning with delayed
  or incomplete eruption of posterior teeth and evaluation of characteristic features,
  including posterior open bite, multiquadrant involvement, and a distal molar pattern.
  Panoramic radiograph and high-resolution CBCT are used to exclude mechanical obstruction
  and primary ankylosis before establishing clinical suspicion of PFE. When clinical
  and radiological findings are consistent, molecular analysis of PTH1R and related
  genes may support the diagnosis. The algorithm highlights key management considerations,
  including multidisciplinary planning and the reported risk of orthodontic traction
  failure and secondary ankylosis in confirmed cases
