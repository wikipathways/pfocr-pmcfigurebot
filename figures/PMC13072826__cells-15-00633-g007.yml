figure_title: BPGM depletion is associated with ER stress-related and ferroptosis-associated
  signaling and increased lipid peroxidation in A498 ccRCC cells.
caption: BPGM depletion is associated with ER stress-related and ferroptosis-associated
  signaling and increased lipid peroxidation in A498 ccRCC cells. (a) Heatmap of genes
  associated with endoplasmic reticulum stress, redox regulation, and ferroptosis-related
  pathways following siRNA-mediated BPGM knockdown or Vorinostat treatment (n = 6
  biological replicates per condition). Expression values are shown as z-scores. (b–d)
  qPCR analysis of ATF4 (b), DDIT3 (c), and CHAC1 (d) mRNA expression normalized to
  ACTB. (b,d) n = 6 per condition. (c) n = 4 (si-mock; two outliers removed) and n
  = 6 (si-BPGM). (e) Lipid peroxidation assessed by BODIPY-C11 staining, expressed
  as ratio of oxidized to reduced fluorescence and normalized to DAPI intensity (n
  = 12 per condition). Data are presented as box plots (median with interquartile
  range; whiskers indicate min–max). Each data point represents one biological replicate.
  Statistical analysis was performed using Welch’s t-test (b,d), Mann–Whitney U test
  (c), and one-way ANOVA with Tukey’s multiple comparisons test (e). Details on test
  selection and normality assessment are provided in Methods. Exact p-values are indicated
  in the figure
