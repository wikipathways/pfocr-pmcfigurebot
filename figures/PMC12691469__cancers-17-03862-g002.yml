figure_title: Illustration demonstrating NK cell-induced anticancer activity through
  direct cytotoxicity, ADCC, tumor recognition, activation of immune cells, and differentiation
  of tumors.
caption: 'Illustration demonstrating NK cell-induced anticancer activity through direct
  cytotoxicity, ADCC, tumor recognition, activation of immune cells, and differentiation
  of tumors. NK cells take down tumor cells through the perforin/granzyme pathway,
  releasing perforin to punch holes in the tumor cell membrane and granzyme B to trigger
  caspase-driven apoptosis. They also carry out antibody-dependent cellular cytotoxicity
  (ADCC) when their receptors bind to the Fc portion of IgG antibodies attached to
  antigens on tumor cells, prompting granule release and cell lysis. Activating receptors
  on NK cells drives the cytotoxic response against tumors expressing ligands for
  those receptors. Cytokines from NK cells can affect tumor differentiation, reduce
  tumor growth, and make the tumors more sensitive to standard cancer treatments.
  Abbreviations: TRAIL: tumor necrosis factor (TNF)-related apoptosis-inducing ligand;
  CD: cluster of differentiation; MHC-1: major histocompatibility class I; IFN-γ:
  interferon-gamma. Created in BioRender. Kaur, K. (2025) https://BioRender.com/xfq9xu3
  (accessed on 17 October 2025)'
