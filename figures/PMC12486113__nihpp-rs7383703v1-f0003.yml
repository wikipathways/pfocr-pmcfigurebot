figure_title: Transcriptomic changes in primary microglia following rIfi27l2a stimulation
caption: 'Primary microglia treated with either vehicle or 100 ng/ml of rIfi27l2a
  were used for RNA sequencing. (a) The PCA plot shows distinct transcriptomic profiles
  between the vehicle and rIfi27l2a-treated cells (n=5 per group). (b) 460 down-regulated
  genes and 548 up-regulated gene by rIfi27l2a were identified (cutoff: log2fold change
  −0.6< and >0.6, adj. p <0.05). Volcano plot revealed the highly differentially expressed
  genes, including Cxcl2, Cxcl3, Ptgs2, Il7, Tnf, Ccl2, and Il6. (c) Gene ontology
  (GO) analysis using g:Profiler reveals that differentially expressed genes (DEGs)
  altered by Ifi27l2a treatment are involved in several key biological processes and
  cellular pathway. (d) Heatmap shows increased expression of inflammatory genes,
  including genes for proinflammatory cytokines, chemokines, receptors. (e) Heatmap
  for Mmps. (f)Violin plots show an increased expression pattern of genes related
  to cellular senescence such as Cdkn1a (* p<0.05) and Cdkn2a(p=0.076)'
article_title: Ifi27l2a acts as a cytokine that promotes a pro-inflammatory phenotype
  in microglia and enhances neuroinflammation
