figure_title: FCRL1 knockdown impairs B-cell lymphoma growth by disrupting pro-survival
  signaling.
caption: FCRL1 knockdown impairs B-cell lymphoma growth by disrupting pro-survival
  signaling. In B-cell malignancies driven by BCR-ABL and MYC oncogenic signaling,
  FCRL1 overexpression sustains cancer cell proliferation via activation of the PI3K-AKT-mTOR
  pathway, leading to elevated Cyclin D1 expression and unchecked tumor growth. Following
  FCRL1 knockdown, malignant B-cells exhibit reduced PI3K-AKT-mTOR signaling (low
  pAKT), resulting in downregulation of Cyclin D1 and subsequent G1 cell cycle arrest.
  This suppression of proliferative drivers correlates with significantly reduced
  tumor growth, highlighting FCRL1 as a potential therapeutic target in B-cell malignancies.
  This figure was created using Biorender software (version 201)
