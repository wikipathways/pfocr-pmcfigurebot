figure_title: Loaded HISMCs have increased synthetic gene expression and activation
  of NF-κB signaling
caption: '(A) STRING diagram of KEGG NF-κB pathway analysis. Input included mRNA more
  abundant in loaded HISMCs with log2 fold change (log2FC) > 0.48 based on bulk RNA-Seq.
  (B) Representative sum-of-slices Z-projections of confocal images (63× oil objective)
  showing NF-κB antibody staining (magenta) and Sytox green nuclear staining. Top:
  Unloaded HISMCs grown on aligned scaffold. Bottom: Loaded HISMCs grown on aligned
  scaffold. Scale bar: 20 μm. (C) Quantitative analysis of antibody staining demonstrated
  increased NF-κB nuclear to cytoplasmic ratio in loaded compared with unloaded HISMCs
  (median [interquartile range] unloaded 1.152 [0.4651], loaded 1.336 [0.8271] (P
  = 0.0081, Mann Whitney), n = 79 cells for both groups. (D and E) qPCR analyses for
  mRNA levels of smooth muscle synthetic genes (Amphiregulin, Epiregulin) showed increased
  Amphiregulin and Epiregulin expression in loaded HISMCs. Amphiregulin (median [interquartile
  range], unloaded: 0.01114 [0.006101], loaded: 0.4518 [0.1364], P = 0.0286, n = 8).
  Epiregulin (median [interquartile range], unloaded: 0.0002173 [0.000219], loaded:
  0.005386 [0.01303], P = 0.0286, n = 8). (F) Representative sum-of-slices Z-projections
  of confocal images (63× oil objective) of MKL2 stained HISMCs (red) and Sytox green
  nuclear staining. Top: Unloaded HISMCs grown on aligned scaffold. Bottom: Loaded
  HISMCs grown on aligned scaffold. Scale bar: 20 µm. (G) Quantitative analysis of
  antibody staining demonstrated an increased MKL2 nuclear to cytoplasmic ratio in
  unloaded compared with loaded HISMCs (median [interquartile range] unloaded 2.435
  [1.066], loaded 1.820 [0.731], P < 0.0001, Mann Whitney, n = 65 cells for unloaded
  and n = 70 cells for loaded HISMCs). (H and I) qPCR analyses for mRNA of smooth
  muscle contractile genes showed decreased CARMN and MKL2 expression in loaded HISMCs.
  CARMN (median [interquartile range], unloaded: 0.001717 [0.003256], loaded: 0.0003141
  [0.0003979], P = 0.0286, n = 8). MKL2 (median [interquartile range], unloaded: 0.001717
  [0.003256], loaded: 0.0003141 [0.0003979], P = 0.0286, n = 8). *P < 0.05, **P <
  0.01'
article_title: Rapid cyclic stretching of cultured human visceral smooth muscle cells
  promotes a synthetic, proinflammatory phenotype
