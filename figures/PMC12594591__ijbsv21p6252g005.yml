figure_title: The role of m6A writer and eraser proteins in HCC.
caption: 'The role of m6A writer and eraser proteins in HCC. Methyltransferases: Mettl3
  activates cholesterol synthesis via Scap mRNA translation to promote tumor growth;
  Wtap regulates P27 through Ets1 mRNA for HCC oncogenesis; Virma degrades Rnd3 mRNA
  to drive migration/invasion. Demethyltransferases: Fto generates Cxcl5 via Cebpa
  mRNA translation to facilitate HCC cell growth; Alkbh5 degrades Lypd1 mRNA to enhance
  migration, and activates tumor-associated macrophages (TAM) via Map3k8 mRNA, exacerbating
  migration/invasion through Jnk/Erk pathway and elevated Il10/Tgf-β, collectively
  demonstrating how m6A modifications influence HCC development and tumor microenvironment'
article_title: Unveiling the dynamics and therapeutic potential of m6A methyltransferases
  and demethylases in liver diseases
