figure_title: (a) Lysine degradation pathway.
caption: '(a) Lysine degradation pathway. Enzymes in bold are implicated in human
  disease. AASS: Alpha-Aminoadipate Semialdehyde Synthase; LKR: Lysine Alpha-Ketoglutarate
  Reductase; SDH: Saccharopine Dehydrogenase; ALDH7A1: Aldehyde Dehydrogenase Enzyme
  7A1; AADAT: Aminoadipate Aminotransferase; DHTKD1: Dehydrogenase E1 and Transketolase
  Domains-Containing Protein 1; GCDH: Glutaryl-CoA Dehydrogenase; ECHS1: Enoyl-CoA
  Hydratase, Short-Chain, 1; HADH: Hydroxyacyl-CoA Dehydrogenase, AACA2: Acetyl-CoA
  Acyltransferase 2. (b) Oxidation pathway of propionyl-CoA. Propionyl-CoA is generated
  through the catabolism of specific amino acids, including isoleucine, valine, threonine,
  and methionine, as well as from the oxidation of odd-chain fatty acid cholesterol
  side chains. The first step in the metabolism of propionyl-CoA involves its carboxylation
  to form D-methylmalonyl-CoA, a reaction catalyzed by PCC which requires biotin as
  a cofactor. Subsequently, D-methylmalonyl-CoA is isomerized to L-methylmalonyl-CoA,
  and then L-methylmalonyl-CoA undergoes a rearrangement to yield succinyl-CoA, which
  can enter the TCA cycle. This rearrangement is catalyzed by methylmalonyl-CoA mutase
  and necessitates vitamin B12 as a cofactor. In cases of excess propionyl-CoA, propionyl-CoA
  may be esterified to carnitine, facilitating its transport out of the mitochondria
  via the carnitine shuttle. The CACT protein mediates the export of propionylcarnitine
  while concurrently importing free carnitine. ADP: Adenosine diphosphate; ATP: Adenosine
  triphosphate, Pi: inorganic phosphate, TCA: tricarboxylic acid; CACT: Carnitine-Acylcarnitine
  Translocase'
