caption: 'In vitro mechanistic model of M. bovis XJ01-induced apoptosis via the Gadd45/XIAP-Bax/Bcl-2
  axis in BoMac cells. This integrative schematic, based on findings from our cell
  culture model, delineates the apoptotic pathway initiated by M. bovis XJ01 infection:
  Upon invading host cells, the pathogen activates cellular stress signaling, which
  concurrently upregulates pro-apoptotic Gadd45 expression and suppresses anti-apoptotic
  XIAP expression. This transcriptional reprogramming promotes the activation of pro-apoptotic
  effector Bax while inhibiting anti-apoptotic regulator Bcl-2, thereby disrupting
  the Bcl-2/Bax stoichiometric equilibrium. The resultant mitochondrial outer membrane
  permeabilization (MOMP) triggers the caspase cascade, ultimately executing apoptosis
  to facilitate intracellular pathogen clearance. (The proposed model requires further
  validation in vivo.) (Mechanistic diagram created with FigDraw 2.0). In the diagram,
  red downward arrows indicate inhibition (suppression of protein expression), and
  green upward arrows indicate promotion (activation or enhancement of protein expression)'
