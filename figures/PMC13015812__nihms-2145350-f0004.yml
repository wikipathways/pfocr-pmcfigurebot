caption: 'Evaluation of gene interaction predictions using the Genetic Prompt Vision
  (GPV) approach. (a) shows the pathway diagram utilized for extracting gene interactions.
  (b) provides the GPV-generated prompt with detailed instructions for identifying
  activation and inhibition relationships. (c) presents a performance table comparing
  the predictions of GPT-4oV, Claude-3.5V, Gemini-1.5V, and Llama-3.2V across two
  evaluation tasks: T-I, which assesses the identification of gene interactions without
  considering directionality, and T-II, which requires the identification of both
  the interaction and its direction (e.g., activation or inhibition). Predictions
  are categorized as Correct (C) in yellow, Incorrect (I) in turquoise, and Missing
  (M) in gray. (d) summarizes the total correct, incorrect, and missing predictions
  for each model in a tabular format'
