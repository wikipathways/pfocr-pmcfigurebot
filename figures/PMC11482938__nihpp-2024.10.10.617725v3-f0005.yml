figure_title: Evolution of cancer risk and resistance in Myotis and other mammals
caption: A, B) Cophylo plot of the evolution of body size (A) and lifespan (B) across
  Eutheria. Branch lengths in A-B are scaled proportional to the rate of change of
  the trait over time. C) Diagram illustrating the relationship between changes in
  body size and lifespan with changes in cancer risk and resistance. D) Relative Intrinsic
  Cancer Risk (RICR) for every node in Eutheria, ranked from greatest reduction in
  cancer risk to greatest increase in cancer risk. RICR relative to the most recent
  ancestor of select nodes are highlighted, as well as the average RICR across for
  all nodes within select clades. E) The phylogeny of Nearctic Myotis species with
  inset pie charts representing the proportion of the top 100 Reactome pathways overrepresented
  among genes under selection at each node that are associated with cancer-related
  processes. Below, pie chart indicates expected proportion of pathways are cancer-associated
  after 1000 random samples of 100 pathways from the full Reactome database. Asterisks
  represent nodes with proportions greater than the expected value at p≤0.05 using
  Fisher’s exact test. F) Proportion of the top 100 Reactome pathways overrepresented
  among genes under selection across all nodes in a species’ evolutionary history
  that are associated with cancer-related processes. G) Volcano plot of overrepresented
  pathways in Reactome among the union set of genes under selection across all nodes
  in the evolutionary history for M. lucifugus. H) Viability and Apoptosis fold-change
  in 5 bat species in response to different doses of neocarzinostatin (NCS), a potent
  inducer of DNA double-strand breaks. Points represent individual replicates normalized
  to each species’ control, while bars represent mean ± 95% confidence intervals
