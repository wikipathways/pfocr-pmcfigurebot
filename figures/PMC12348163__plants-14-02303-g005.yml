figure_title: Distribution of differentially accumulated metabolites (DAMs) in D.
caption: Distribution of differentially accumulated metabolites (DAMs) in D. huoshanense
  under salt, high-temperature, and combined stress. (a) Principal component analysis
  (PCA) of the metabolome under control and stress conditions. (b) Numbers of metabolites
  that show increased accumulation (upregulated, left) or decreased accumulation (downregulated,
  right) under each stress condition. Red represents control vs. combined stress,
  blue represents salt vs. combined stress and yellow represents high temperature
  vs. combined stress (c) Classification and proportional representation of DAMs by
  metabolic category. (d–f) KEGG pathway enrichment analyses for metabolites in the
  comparisons of control vs. combined stress, salt vs. combined stress, and high-temperature
  vs. combined stress, respectively
article_title: Integrated Transcriptomic and Metabolomic Analyses Reveal Key Antioxidant
