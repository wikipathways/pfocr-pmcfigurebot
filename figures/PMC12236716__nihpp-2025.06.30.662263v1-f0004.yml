figure_title: Entry pathways preference of MERS-CoV spike variants
caption: Treatment of cells with camostat targeting the cell surface TMPRSS2 pathway
  and E64d targeting the endocytic cathepsin L pathway was used to block infectious
  virus entry via each pathway. Experiments with infectious virus (A) or pseudovirus
  (B) is shown for the different spike variants in VeroE6/TMPRSS2 cells. (A) Relative
  viral load was measured the RNA copies of MERS-CoV using the UpE assay in the cell
  supernatant at 48 hpi. (B) Relative cell entry was measured by RLU. (A-B) 2015/GD01
  was the reference for comparison. Figures show the representative data from 2 independent
  experiments each with two biological replicates for each experiment each drug dose.
  An inhibition curve was fitted using the Hill equation with inhibition in Graphpad
  Prism
article_title: The impact of clade B lineage 5 MERS coronaviruses spike mutations
  from 2015 to 2023 on virus entry and replication competence
