figure_title: Venn diagrams of up-regulated and down-regulated differentially expressed
  genes, GO enrichment analysis and KEGG enrichment analysis.
caption: Venn diagrams of up-regulated and down-regulated differentially expressed
  genes, GO enrichment analysis and KEGG enrichment analysis. Panels (A1,A2) denote
  the Venn diagrams of up- and down-regulated DEGs in the three comparison groups,
  with different colors indicating DEGs from different comparison groups. Panels (B1,B2)
  denote the results of GO enrichment analysis for up-regulated and down-regulated
  DEGs, respectively, with different colored bar graphs indicating the number of genes
  enriched in biological processes (BP), cellular components (CC), and molecular functions
  (MF). Panels (C1,C2) denote the results of KEGG pathway enrichment analysis for
  up-regulated and down-regulated DEGs, respectively. The size of the dots indicates
  the number of genes associated with the pathway, and the color of the dots indicates
  the p-value, with red indicating higher significance. The ‘ratio’ in (C1,C2) refers
  to the proportion of differentially expressed genes (DEGs) enriched in a specific
  pathway relative to the total number of genes annotated in that pathway within the
  reference genome
