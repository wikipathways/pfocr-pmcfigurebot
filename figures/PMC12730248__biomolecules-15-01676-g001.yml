caption: 'Schematic of the classical visual cycle, highlighting the key enzymes and
  transport proteins in the chromophore regeneration pathway and their relationship
  to various retinal diseases. (A) The classical visual cycle. (B) Metabolic disruptions
  in retinal diseases. Solid arrows indicate the normal metabolic flow, whereas dotted
  arrows represent pathological routes. “x” marks enzymes or transport proteins whose
  function is impaired or absent in specific disease conditions. Abbreviation explanation:
  LRAT, retinol: lecithin acyltransferase; PR65, RPE-specific 65 kDa protein, RDH5,11-cis-retinol
  dehydrogenase 5; RDH11, 11-cis-retinol dehydrogenase 11; RDH8, all-trans-retinol
  dehydrogenases 8; RDH12, all-trans-retinol dehydrogenases 12; ABCA4, ATP-binding
  cassette subfamily A member 4; A2E, N-retinyl-N-retinylidene ethanolamine; A2PE,
  N-retinylidene-N-retinyl-phosphatidylethanolamine; ROS, reactive oxygen species;
  atARL, all-trans-retinal; RP, Retinitis pigmentosa; LCA, Leber congenital amaurosis;
  FA, Fundus albipunctatus; AMD, Age-Related Macular Degeneration; STGD1, Stargardt
  disease type 1'
