caption: 'Integrated analysis of EV-derived miRNA and proteomic data reveals a key
  hsa-miR-1-3p-LRP1 regulatory axis in CC. (A) Heatmap showing Spearman correlation
  between differentially expressed miRNAs and proteins (red: positive correlation;
  blue: negative correlation). (B) Differential miRNA target gene enrichment pathway
  and differential protein enrichment pathway and their shared metabolic pathways.
  (C) Protein-protein interaction network of DEPs. (D) Interaction network map of
  differentially expressed miRNAs and DEPs. (E) Tissue-specific expression profile
  of LRP1. (F) Reverse transcription-quantitative PCR validation of EV-derived hsa-miR-1-3p
  (left) and LRP1 (right) expression levels in HC and patients with CC (n=3) *P<0.05
  and **P<0.01. EV, extracellular vesicle; miR or miRNA, microRNA; CC, cervical cancer;
  DEPs, differentially expressed proteins; HC, healthy controls; KEGG, Kyoto Encyclopedia
  of Genes and Genomes'
