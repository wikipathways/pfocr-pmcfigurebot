figure_title: GK alleviates DOX-induced HF in mice by improving mitochondrial dysfunction
  through the AMPK/Sirt1/NF-κB signaling pathway.
caption: 'GK alleviates DOX-induced HF in mice by improving mitochondrial dysfunction
  through the AMPK/Sirt1/NF-κB signaling pathway. (a, b) To elucidate GK’s cardioprotective
  mechanisms against DOX-induced HF, four treatment groups were analyzed: Control,
  DOX, DOX + GK, and DOX + GK + Com C. Protein expression profiles of AMPK/Sirt1/NF-κB
  pathway components (AMPK, p-AMPK, Sirt1, NF-κB p65, p-NF-κB p65) were examined in
  cardiac tissues by immunoblotting. (c, d) Nuclear translocation of p-NF-κB p65 was
  visualized through immunofluorescence to determine NF-κB pathway activation status.
  Scale bar 50 μm. (e, f) Mitochondrial DNA damage was evaluated by quantifying γ-H2AX
  foci formation using immunofluorescence microscopy. Scale bar 50 μm. (g) Myocardial
  bioenergetic status was determined by measuring ATP production across experimental
  groups. (h-j) Transcript abundance of mitochondrial metabolic regulators (MDH, NNT,
  PDH) was quantified using RT-qPCR analysis. n = 6. ***p < 0.001 vs. Control; ###p
  < 0.001 vs. DOX; &&&p < 0.001 vs. DOX + 100 mg/kg GK. DOX, doxorubicin; GK, ginkgetin;
  HF, heart failure; NF-κB, nuclear factor-κB; AMPK, adenosine monophosphate–activated
  protein kinase'
