figure_title: Increased ECM stiffness activated integrin/PI3K-AKT signaling
caption: '(A) Gene Ontology analysis of differentially expressed genes from RNA-Seq
  between Col7a1 siRNA and control groups in PMCs. BP: biological process; CC: cellular
  component; MF: molecular function. (B) KEGG pathway analysis based on data of differentially
  expressed genes identified by RNA-Seq. (C and D) PI3K-AKT pathway signaling protein
  expressions in PMCs cultured in substrates of different stiffness. As described
  in Methods, soft and stiff substrate was made by polyacrylamide hydrogels with elastic
  moduli of about 1 kPa (soft) and about 30 kPa (stiff). PMCs were cultured in medium
  with these soft or stiff substrates for 24 hours, then harvested for Western blotting.
  (D) Bar graphs showing changes of proteins according to C. Data are expressed as
  mean ± SD. Statistical significance was determined by unpaired Student’s t tests.
  n = 3. ***P < 0.001. (E–H) Effect of Col7a1 siRNA on PI3K-AKT signals in PMCs. After
  transfection of control siRNA or Col7a1 siRNA for 36 hours, PMCs were cultured with
  or without BLM and TBPE for 24 hours, then harvested for Western blotting. (F and
  H) Bar graphs showing changes of proteins according to E and G. Data are expressed
  as mean ± SD. Statistical significance was determined by 1-way ANOVA. n = 3. *P
  < 0.05, **P < 0.01, ***P < 0.001. (I and J) Effect of cilengitide on PI3K-AKT signals
  in PMCs. Soft and stiff substrate in PMC-cultured medium was made in the same manner
  as in C. PMCs were cultured with or without cilengitide (10 μg/mL) for 24 hours,
  then harvested for Western blotting. (J) Bar graphs showing changes of proteins
  according to I. Data are expressed as mean ± SD. Statistical significance was determined
  by 1-way ANOVA. n = 3. *P < 0.05, **P < 0.01. siNC, control siRNA; siCOL7A1, Col7a1
  siRNA'
