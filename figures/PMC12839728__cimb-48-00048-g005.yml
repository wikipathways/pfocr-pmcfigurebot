figure_title: Schematic illustration of the effects of KYNA on murine BM-MSCs.
caption: Schematic illustration of the effects of KYNA on murine BM-MSCs. KYNA, an
  endogenous metabolite of the tryptophan–IDO pathway, binds and activates Ahr. This
  activation upregulates the downstream target genes Cyp1a1, Cyp1b1 and Il-6. The
  combined transcriptional changes enhance BM-MSC proliferation by ~1.2-fold relative
  to that of untreated controls while maintaining the MSC phenotype (Sca-1+/CD90+/CD45−)
  and preserving multipotency toward adipogenic, osteogenic, and chondrogenic lineages
article_title: Activation of the Ahr–IL-6 Axis by Kynurenic Acid Promotes Bone Marrow-Derived
  MSC Expansion
