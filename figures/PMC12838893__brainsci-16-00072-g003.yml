figure_title: Chemoinhibition of the ZI–RVM circuit induces mechanical allodynia.
caption: 'Chemoinhibition of the ZI–RVM circuit induces mechanical allodynia. (A)
  Schematic of the strategy for chemogenetic inhibition of ZI–RVM neurons. (B) Representative
  images of scAAV2/1-hSyn-Cre (mixed with CTB 647) expression in the ZI (left) and
  DIO-hM4Di-EGFP in the RVM (right). Scale bar, 200 μm. White linear demarcations
  define the extent of the associated brain areas. (C) Effects of chemogenetic inhibition
  of the ZI–RVM circuit on mechanical thresholds of ipsilateral hind paws (n = 6 mice
  per group). (D–H) Effects of chemoinhibition of the ZI–RVM pathway on locomotor
  activity and anxiety level: example tracts (D), total distance (E), and time spent
  in center (F) in the open field test (OFT), and example tracts (G) and time in open
  arms (H) in the elevated plus maze (EPM) test. ns p > 0.05, ** p < 0.01. Repeated-measures
  two-way ANOVA followed by Sidak post hoc test for (C) and unpaired t-test for (E,F,H).
  Data were presented as mean ± SEM'
