figure_title: Astrocytes regulate both glutamatergic and GABAergic neuronal functions.
caption: Astrocytes regulate both glutamatergic and GABAergic neuronal functions.
  Activation of the astrocytic phospholipase C/inositol trisphosphate (PLC/IP3) pathway
  through mGluR5 and purinergic P2Y1 receptors leads to an increase in astrocytic
  Ca2+ levels. This increase in Ca2+ triggers the release of gliotransmitters, including
  GABA, glutamine (Gln), and D-serine, which are essential for glutamatergic and GABAergic
  neuronal activity. D-serine, a co-agonist of the NMDA receptor (NMDAR) localized
  at the postsynaptic surface, is synthesized in astrocytes from glucose supplied
  by nearby capillaries. In contrast, glutamine, a metabolic precursor of glutamate
  (Glu), is also produced in astrocytes, and Ca2+ activation facilitates its release
  from astrocytes. The released glutamine is then taken up by neurons through the
  sodium-coupled neutral amino acid transporter (SNAT), where it is converted into
  glutamate by the enzyme glutaminase 1 (GLS). The glutamate is then released into
  the synaptic cleft via presynaptic vesicles to activate AMPA receptor (AMPAR) and
  NMDAR, both of which are critical for synaptic plasticity, learning, and memory.
  Additionally, Na+/K+ ATPases polarize astrocytes by actively pumping 3 Na+ ions
  out and 2 K+ ions in, maintaining a negative resting membrane potential. P2X7R,
  purinergic P2X7 receptor; VRAC, volume-regulated anion channel; Best1, bestrophin-1;
  TREK-1, TWIK-related K+ channel 1; EAATs, excitatory amino acid transporters
