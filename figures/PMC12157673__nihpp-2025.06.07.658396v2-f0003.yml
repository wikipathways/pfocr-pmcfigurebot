figure_title: Notch and WNT signaling are predicted to be altered in ISO+sFRP1 rats
  and in paediatric DCM hearts via Next generation sequencing.
caption: 'Notch and WNT signaling are predicted to be altered in ISO+sFRP1 rats and
  in paediatric DCM hearts via Next generation sequencing.(A) Schematic of the experimental
  plan for next generation sequencing (bulk RNA-seq and Single nuclei RNA-seq.)(B)
  Heatmap representing unsupervised hierarchical clustering of the top 50 significantly
  differentially expressed genes (DEGs) in bulk RNA sequencing. n = 6/group; Welch’s
  t test p < 0.05.(C) Pathway analysis using the 113 upregulated genes in ISO+sFRP1
  vs Control rats using Reactome pathway analysis tool (left) and Hallmark pathway
  analysis tool (right).(D) Representative UMAP plot from single-nuclei RNA sequencing
  of LV tissue from Controls, ISO-, sFRP1- or ISO+sFRP1-treated rats, n = 3/group.
  A total of 9214 nuclei in control, 11588 nuclei in ISO-, 13758 nuclei in sFRP1-,
  and 11127 in ISO+sFRP1-treated rats were identified after cells were pooled. 26
  distinct cell clusters were identified including 8 CMs and 5 FBs.(E) Reactome pathway
  analysis using upregulated genes in Ventricular cardiomyocyte sub-cluster 2 of ISO+sFRP1
  vs Control rats (left). Enrichr analysis identifies transcription factors predicted
  to control expression of upregulated genes in ventricular cardiomyocyte sub-cluster
  2 (right).(F) Reactome pathways analysis using upregulated genes in ventricular
  cardiomyocyte sub-cluster 6 of ISO+sFRP1 vs Control rats (left). Enrichr analysis
  identifies transcription factors predicted to control expression of upregulated
  genes in ventricular cardiomyocyte sub-cluster 6 (right).Clusters were annotated
  into major cell populations, and the ventricular cardiomyocyte cluster was sub-clustered
  into eight different sub-clusters using R statistical software. Differentially expressed
  genes for each cluster were calculated with the FindAllMarkers function. UMAP: uniform
  manifold approximation and projection, CM: cardiomyocytes; FB: fibroblast; NK: Natural
  Killer cells; B/T: B cells and T cells. DCM, dilated cardiomyopathy; ISO-Isoproterenol,
  sFRP1- secreted frizzled protein 1; NRVMs, neonatal rat ventricular myocytes; LV,
  left ventricle'
