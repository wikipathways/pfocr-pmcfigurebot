figure_title: Single-cell transcriptomics of lymphocyte subpopulations shows regulatory
  T-cell dysfunction and increased JAK/STAT signaling in GBS.
caption: Single-cell transcriptomics of lymphocyte subpopulations shows regulatory
  T-cell dysfunction and increased JAK/STAT signaling in GBS. (A) Differential analysis
  of regulatory T-cells (Treg) shows (B) the differential expression of 27 genes (Padj
  < 0.05 and log2FC > |±0.5|). (C) In addition to viral infection, other pathways
  associated with the detected changes in Tregs included apoptosis and pathways of
  neurodegeneration. Pathways were generated using iPathwayGuide. (D) Top 10 statistically
  significant (P < 0.05) predicted upstream regulators of the differentially expressed
  genes included multiple STATs. STAT3 was the upstream regulator with the highest
  predicted log2FC (0.681). (E) Differentially expressed genes in CD4+ effector memory
  T-cells (Tem), (F) CD8+ Tem, (G) CD8+ naïve T-cells, and (H) natural killer (NK)
  cells
