figure_title: The potential physiological functions of Equol.
caption: The potential physiological functions of Equol. Indole-3-acetic acid plays
  a role in alleviating intestinal inflammation by promoting the production of equol
  by Bifidobacterium pseudolongum in mice [19]; S-equol can inhibit osteoclast differentiation
  and stimulate apoptosis of mature osteoclasts via inducing caspase-3/7 activity
  in BMCs and RAW 264.7 cells [21]; S-equol can alleviate the depressive-like behavior
  and neuroinflammation induced by LPS via the TLR4/NF-κB signaling pathway in mice
  [20]; S-equol can lower the fasting blood sugar level and inhibit the gene expression
  of liver enzymes related to glucose metabolism in mice, showed a potential anti-diabetic
  roles [18]; S-equol showed an anti-breast cancer role via up-regulating miR-10a-5p
  and inhibiting the PI3K/AKT pathway [22]. This Figure was created in BioRender.
