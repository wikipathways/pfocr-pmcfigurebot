figure_title: GAB2 links initiating mutations and progression signaling in myeloid
  leukemogenesis
caption: AMLs arising in a mouse model expressing two common initiating mutations
  (Dnmt3aR878H and Npm1cA) frequently acquire a single-copy amplification of chromosome
  7, which includes the Gab2 gene locus. Overexpression of Gab2, driven by genetic
  amplification and/or the PML:RARA fusion protein, can accelerate AML development
  and promote the survival of fully transformed AML cells. The unique GAB2 interactome
  formed in the presence of mutant NPM1 activates downstream AKT and ERK signaling
  in a posttranscriptional manner, highlighting a critical role for GAB2 as a potentially
  targetable “missing link” between AML-initiating mutations and RTK/RAS pathway mutations
  associated with AML progression
article_title: GAB2 couples genetic drivers and signaling networks in acute myeloid
  leukemia
