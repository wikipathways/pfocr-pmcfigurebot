caption: Pooled genome-wide CRISPR/Cas9 screening showed that nucleus export pathways
  and nuclear transport pathways were enriched by GO analysis. (A) Cas9-expressing
  DLD1 cells were infected with genome-wide pooled gRNA lentivirus. Infected cells
  were selected with puromycin for 3 days. The cells were then reseeded and treated
  with NETs condition medium or DLD1 condition medium for 16 h. Genomic DNA was extracted
  from DLD1 cells after treatment, and gRNA sequences were amplified by PCR. PCR products
  were purified and subjected to next-generation sequencing. The enriched genes were
  subjected to GO analysis. The data presented are the enriched pathways
