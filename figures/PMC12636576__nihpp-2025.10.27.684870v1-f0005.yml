figure_title: Overlap of transcriptional profiles derived from isogenic heterozygous
  iN with POGZ, MEF2C or SCN2A gene deletions
caption: '(A) Heatmap indicating statistical significance for overlap between DEG
  (FDR<0.1) from heterozygous iN with POGZ, MEF2C, or SCN2A gene deletions. (B) Statistical
  significance for enrichment of pathways among DEG overlaps from two-way comparisons
  of heterozygous iN with POGZ, MEF2C or SCN2A gene deletions. Numbers in parentheses
  indicate the total number of genes in a given gene list. Colors represent pathway
  categorization according to the nature of the functional categories related to the
  enriched term. Groups of functional categories: IMMUNE: immune system and inflammation,
  MIG: cell migration, MIT: mitosis and cell proliferation, STEROID: steroid metabolism,
  SIG: intracellular signaling pathways, ECM: extracellular matrix. BH: Benjamini-Hochberg
  adjusted p-values. Numbers in parentheses indicate the total number of genes in
  a given gene list'
