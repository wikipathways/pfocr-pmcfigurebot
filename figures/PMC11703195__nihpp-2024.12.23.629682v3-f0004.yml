figure_title: Example of applications as tools and workflows available in the Microbiology
  Galaxy Lab in health, disease, and ecosystem research
caption: (A) Phylogenetic and genetic analysis of Klebsiella pneumoniae ST512, illustrating
  its genotypic evolution under treatment with ceftazidime/avibactam, meropenem/vaborbactam,
  and cefiderocol (Figure 2 in Arcari et al 202328). (B) Comparative distribution
  of dominant bacterial and eukaryotic orders in cloudy versus clear-atmosphere metagenomes,
  with hierarchical clustering (Figure 1 in Péguilhan et al. 202529). (C) Glycolysis/Gluconeogenesis
  pathway of a Tissierellia-class bacterium, built as a Metagenomics Assembled Genome
  from metagenomics data and annotated with metaproteomic abundance (Figure 3 in Schiml
  et al 202330). (D) Heatmap of 30 differentially expressed biochemical pathways in
  traumatic brain injury (TBI) versus control fecal metatranscriptomes (Figure 3 in
  Pyles et al 202431)
