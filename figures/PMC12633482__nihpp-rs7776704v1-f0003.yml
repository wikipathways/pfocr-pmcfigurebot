figure_title: Piezo1/Wnt/Rac1 mechano-signaling pathway regulates CAR T cell mechano-metabolism
  and function
caption: (a) Schematic showing mechano-metabolic signaling pathway in CAR T cell activation.
  (b) Representative confocal immunostaining images showing the spatial distributions
  of actin and myosin, and (c) FRET images showing spatial distribution of Rac1 in
  activated CAR T cells upon CD19 activation on a CD19/ICAM-1-functioned glass substrate
  and nonactivated cultured on substrate functionalized with ICAM-1 without CD19.
  (d) Linear correlation between Rac1 activity and synaptic force. Linear regression
  fit shown with 90% CI (n = 58 cells, from 3 independent experiments). (e) RT-qPCR
  analysis showing differential expression (log2) and p value of mechanosensitive
  channel transcripts between activated and nonactivated CAR T cells. Cells were collected
  after 1-hour contact with the CD19/ICAM-1 and ICAM-1 functioned glass substrates.
  (f) Representative confocal immunostaining images showing the spatial distributions
  of Piezo1 in activated and nonactivated CAR T cells 30 min after in contact with
  the CD19/ICAM-1 and ICAM-1 functioned glass substrates. (g) Time course measurement
  of Ca2+ change as CAR T cells contact with the ICAM-1/CD19-coated glass substrates
  (n = 30 cells). Data was normalized to T = 0 min. The thick line represents the
  mean and the shaded area represents s.e.m. (h) Peak calcium response as activated
  and nonactivated CAR T cells cultured on CD19/ICAM-1 and ICAM-1 functioned substrates
  (n = 30 cells). (−) Piezo1 group is CAR T cells cultured on CD19/ICAM-1 functionalized
  substrates and pre-treated with 2.5μM GsTMx4 for 30 mins. (i) RT-qPCR quantification
  showing relative expression of mechano-metabolic regulator in response to Piezo1
  inhibition with GsMTx4 ((−) Piezo1) and Piezo1 enhancement by pre-treatment with
  0.3 μM Yoda1 for 30 mins ((+) Piezo1) (n = 3 technical replicates). (j) RT-qPCR
  quantification showing relative expression of Wnt signaling regulators in CAR T
  cells under inhibition of Piezo1 by pre-treatment with 2.5μM GsTMx4 for 30 mins
  (n = 3 technical replicates). (k) Quantification of maximum Rac1 FRET signal across
  nonactivated, activated, and pharmacologically treated CAR T cells (2.5 μM GsMTx4
  for 30 mins Piezo1 inhibition, 25 μM IWP2 for 24 hours for Wnt inhibition, 100 μM
  NSC23766 for 24 hours Rac1 inhibition; n = 8 cells, 3 independent experiments).
  (l) Synaptic force dynamics of pharmacologically treated CAR T cells (n = 8 cells,
  2 independent experiments). Data in was normalized to the baseline force at T =
  0 min. (m) Untargeted LC-MS metabolomics analysis of non-transduced T cells (NTD)
  and CAR T cells with and without treatment with GsMTx4. Log2 fold change < 0 means
  a metabolite is downregulated in the inhibitor-treated groups MS (n = 4 for NTD,
  n = 3 for NTD (−) Piezo1, CAR, CAR (−) Piezo1). Cutoff for significance is chosen
  at |log2FC|>0.5 and p-value <0.05. Points in red are upregulated, while points in
  blue are downregulated metabolites of significance according to the criteria above.
  (n)Heatmaps of differentially abundant metabolites between among groups. Data are
  normalized within each row (compound) using z-score normalization. (o) OCR trace
  and (p) energy phenotypic profile shows metabolic changes in CAR T cells upon inhibition
  of Piezo1 by GsTMx4 ((−) Piezo1, n = 4). (q) On-chip response curves of leukemia
  burden per 20X field under treatment of CAR T cells or GsMTx-4 treated CAR T cells
  ((−) Piezo1) at a dose of 1,250 cell per chip (n = 4 technical replicates). (r)
  Composite mechanical and functional indices of CAR T cells in control and Piezo1-inhibited
  group ((−) Piezo1). The mechanical index comprises instantaneous force frequency
  (n = 8 cells), free energy (n = 8 cells), and peak calcium change (n = 20 cells).
  The CAR T cell function index comprises surface activation markers CD69 after on-chip
  interaction with leukemia blasts for 2 days (n = 37 from 3 technical replicates),
  ELISA measured secretions of TNF-α, INF-γ, and Granzyme B from leukemia chips (n
  = 3 technical replicates). All data was normalized to the average measured values
  of the control healthy group. All data are shown as mean ± s.e.m. Statistical tests
  in h, i, k, l used one-way ANOVA with Tukey’s post hoc test, and in q used unpaired
  two-tailed Student’s t-test. * denotes p<0.05, ** denotes p<0.005, *** denotes p<0.0005,
  **** denotes p<0.00005
