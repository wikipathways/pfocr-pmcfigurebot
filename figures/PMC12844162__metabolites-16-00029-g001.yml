figure_title: Pathways of metabolite action as nutrients, structural components, and
  signaling molecules.
caption: Pathways of metabolite action as nutrients, structural components, and signaling
  molecules. Metabolites derived from diet or gut microbiota—including succinate,
  lactate, basic amino acids, and aromatic amino acids—can serve not only as energy
  or structural substrates but also as ligands for GPCRs, thereby activating their
  corresponding receptors and potentially regulating multiple aquaculture-relevant
  physiological mechanisms including stress response, flow endurance, energy balance
  and metabolism, and immunomodulation
