figure_title: Proposed mechanism of GOP-mediated longevity regulation in C.
caption: Proposed mechanism of GOP-mediated longevity regulation in C. elegans. GOPs
  may inhibit the insulin-like signaling pathway via suppression of ins-7 and activation
  of stress-responsive JNK-1 signaling, thereby promoting DAF-16 nuclear translocation.
  Activated DAF-16 upregulates antioxidant genes (gst-4, mtl-1) and lipolytic genes
  (lipl-4, lips-17), enhancing oxidative stress resistance and lipid metabolism to
  extend lifespan. Solid arrows indicate experimentally validated regulatory relationships
  observed in this study, whereas dashed arrows represent putative pathways inferred
  from KEGG analysis that have not been experimentally validated. Arrowheads indicate
  activation, while bar-headed lines indicate inhibition
article_title: Ginseng Oligopeptides Promote Longevity and Enhance Stress Resistance
  in Caenorhabditis elegans via the DAF-16/FOXO Pathway
