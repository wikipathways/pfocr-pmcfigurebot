figure_title: Axonal growth parameters are promoted by BMEE.
caption: 'Axonal growth parameters are promoted by BMEE. (A) Network construct illustration
  showing BMEE’s involvement in axonal growth pathways. The green hexagons denote
  the compounds, the circular nodes denote the targets, and the square boxes represent
  the signaling pathways. The lines represent the interconnection among compound–target–signaling
  pathways. The degree of connectivity is indicated by the darkness of the target
  and signaling pathway symbols. (B) Fluorescent images of neurons immunostained with
  Ankyrin–G (red, axonal marker) and α–Tubulin (green, cytoskeleton marker) antibody.
  Here, primary hippocampal neurons were grown until DIV 5, fixed, and immunostained
  as described in Figure 1, in the presence of vehicle and/or BMEE (2.5 μg/mL). Cell
  morphology is visualized by tubulin, and white arrows mark axons. Scale bar = 20
  μm for all images. Morphometric analysis of axonal development in BMEE–and vehicle-treated
  neurons showing (C) axon length, (D) number of axon collateral branches at different
  branching orders (primary, secondary, or tertiary), and (E) length of axon collateral
  branches at different branching orders (primary, secondary, or tertiary). Sholl
  analysis is shown in (F) for the number of axon collateral branching points and
  in (G) for axonal intersection points. Data are expressed as mean ± SEM from three
  independent experiments (n = 3), with 5–10 neurons analyzed per experiment. Statistical
  significance was determined using a two-tailed Student’s t-test (* p < 0.05, ***
  p < 0.001). In (F,G), # denotes the “number of”'
