caption: dsRNA and/or siRNA can be applied on virus-infected plants by different approaches
  such as infiltration, spray, and microinjection. dsRNA is processed by DCL and then
  associates with RISC, triggering transcriptional gene silencing via the RdDM pathway,
  so the plant shows no symptoms of virus infection. In contrast, siRNA bypasses DCL,
  directly binds to RISC, and causes epigenetic gene silencing
