figure_title: DEC1 regulates β cell maturity-linked effectors of glucose metabolism
  and insulin secretion
caption: (A) DEC1 ablation in SC-β cells results in 2,622 differentially expressed
  genes. Heatmap shows row-normalized (Z scored) expression of differentially expressed
  genes (p < 0.05, DESeq test) in CD49a-sorted SC-β cells in parental, no single guide
  RNA (sgRNA), and DEC1−/− line 1 on days 1 and 14 of in vitro maturation.(B) SC-β
  maturity-linked genes are depleted in DEC1−/− SC-islets. Volcano plot shows the
  average differential expression across SC-islets on days 1, 7, and 14 for all differentially
  expressed genes on either day. Genes with ≥2-fold change and p < 0.05 are in black.
  Genes of interest are highlighted.(C) Mitochondrial reorganization genes are enriched
  in DEC1−/− SC-β cells, whereas glycolysis and β cell maturity-linked genes are enriched
  in DEC1+/+ SC-β cells. Gene set enrichment analysis shows genes ranked by fold change
  in DEC1−/− vs. DEC1+/+ SC-β cells on day 14. NES, normalized enrichment score.(D)
  DEC1 ablation disrupts induction of glucose-stimulated insulin secretion (GSIS),
  glucose import, and redox homeostasis genes and suppression of lipid metabolism
  genes in SC-β cells. Gene set enrichment analysis shows pathways enriched in DEC1−/−
  vs. DEC1+/+ SC-β cells on day 14.(E) Relative expression of selected genes from
  (B). Data are qPCR from day 21 SC-β cells. N = 3 differentiation, n = 2–3 technical
  replicates each. Data are the mean ± SEM. *p < 0.01, **p < 1E–2, and ***p < 1E–3,
  Wilcoxon test.(F) DEC1 ablation leads to upregulation of genes disallowed in mature
  β cells and downregulation of key glucose metabolism genes and insulin secretion
  genes. Shown are the fold changes of genes in the indicated gene sets in day 14
  SC-β cells
