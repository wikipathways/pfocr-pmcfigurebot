figure_title: M1C integrates inflammatory and proliferative stress responses with
  chromatin remodeling in regulating gene expression and the CSC state.
caption: M1C integrates inflammatory and proliferative stress responses with chromatin
  remodeling in regulating gene expression and the CSC state. The inflammatory M1C
  → NF-κB pathway drives (i) DNMTs and global DNA methylation, (ii) PRC2/EZH2 and
  H3K27 methylation, and (iii) COMPASS and H3K4 methylation. COMPASS counteracts PRC2
  regulation of gene expression. The proliferative M1C → E2F1 pathway activates the
  SWI/SNF BAF and PBAF chromatin remodeling complexes. M1C → E2F1 signaling also regulates
  EZH2, which is counteracted by the SWI/SNF complexes. M1C-induced activation of
  the inflammatory/NF-κB and proliferative/E2F1 pathways thus has the capacity to
  fine-tune the intersection of PRC2, COMPASS and SWI/SNF in regulating gene expression
  patterns. Of significance and in addition to driving transcription of PRC2 and SWI/SNF
  genes, M1C forms direct complexes with EZH2 and BAF/PBAF proteins and thereby regulates
  enhancer-like sequences (ELS) and expression of genes that contribute to stemness
  and the CSC state
