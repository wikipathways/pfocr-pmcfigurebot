figure_title: Functional enrichment analysis of DELs and their target DEGs in IR25
  and LTH after rice blast infection.
caption: Functional enrichment analysis of DELs and their target DEGs in IR25 and
  LTH after rice blast infection. (A) Bar charts showing the number of DEGs and differentially
  expressed lncRNAs (DELs), with upregulated genes in red and downregulated genes
  in blue. (B) Venn diagrams of differentially expressed lncRNAs (DELs) between LTH
  and IR25 before and after inoculation (fold change > 1.5, p-value < 0.05). (C–E)
  Functional analysis of putative target genes predicted for uniquely expressed DELs
  in IR25 and LTH, including GO enrichment analysis (D,F) and KEGG pathway enrichment
  analysis. The top 20 significant GO terms were selected based on a p.adjust < 0.05
  cutoff, and the top 10 KEGG pathways were selected with the same significance threshold
