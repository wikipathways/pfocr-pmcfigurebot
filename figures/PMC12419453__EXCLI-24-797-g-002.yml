figure_title: Sources of Cd exposure in the maternal body. There are numerous sources
  of Cd that lead to exposure to the maternal body. In addition, all these sources
  have different pathways for entry into the body, such as inhalation, ingestion and
  skin absorption. Tobacco is one of the major causes of Cd exposure and is inhaled
  via active or passive smoking. On the other hand, foods enriched with Cd, such as
  meat, fish, and vegetables, enter through the ingestion pathway. Another less recognized
  route of Cd exposure is skin absorption. This happens when pregnant women come in
  contact with Cd-contaminated areas such as industrial or mining sites
