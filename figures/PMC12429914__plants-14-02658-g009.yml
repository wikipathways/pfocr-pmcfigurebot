figure_title: KEGG analysis of DEGs in Chinese fir root tips.
caption: KEGG analysis of DEGs in Chinese fir root tips. KEGG pathway enrichment analysis
  of DEGs between Al vs. Al+AIP (A) and Al vs. Al+MJ (C). The x-axis and y-axis represent
  the enrichment factor and metabolic pathways, respectively. The size of the circles
  indicates the number of genes enriched in the pathway; larger circles indicate more
  genes. The smaller the q-value, the redder the color, indicating that the enrichment
  significance of DEGs in that pathway is more reliable. Triangles represent upregulated
  DEGs, inverted triangles represent downregulated DEGs, and circles represent both
  up- and down-regulated DEGs. KEGG classification analysis of DEGs between Al vs.
  Al+AIP (B) and Al vs. Al+MJ (D). Different colors represent different pathway types
