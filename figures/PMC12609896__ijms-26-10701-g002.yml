figure_title: MASLD is a spatially organized disease.
caption: MASLD is a spatially organized disease. In a healthy liver, pericentral hepatocytes
  are preferentially involved in glycolysis, bile acid synthesis, xenobiotic metabolism,
  glutamine synthesis, glucose uptake, lipogenesis and ketogenesis, whereas periportal
  hepatocytes are enriched in gluconeogenesis, cholesterol synthesis, fatty acid metabolism,
  amino acid metabolism, oxidative metabolism, urea formation, and drug metabolism.
  Midlobular hepatocytes manage lipid turnover and glycogen synthesis. During MASLD,
  this physiological zonation becomes altered, and distinct regions of the hepatic
  lobule undergo different molecular adaptations to metabolic stress. Pericentral
  hepatocytes undergo lipogenic and xenobiotic pathways, whereas periportal ones show
  downregulation of mitochondrial β-oxidation genes and activation of inflammatory
  signaling, thus acquiring a more pericentral-like phenotype. Spatial omics further
  highlighted the accumulation of triglycerides, ceramides, and reactive lipid species
  predominantly in the pericentral zone, reflecting localized hypoxia and redox imbalance.
  This metabolic heterogeneity parallels distinct microenvironments of injury, inflammation,
  and fibrogenesis, providing mechanistic insight into disease progression. Green
  arrows represent normal (physiological) expression, while red arrows indicate altered
  expression either upregulated or downregulated in MASLD. It has been described that
  portal inflammation is present in 60% of adult MASLD patients, and it is associated
  with more severe disease and adverse outcomes. Portal inflammation does not correlate
  with lobular inflammation, thus eluding the NAS scoring system [68]. Accordingly,
  another study demonstrated that patients without portal fibrosis were protected
  against cirrhosis complications [69]
article_title: 'Hepatic Zonation in MASLD: Old Question, New Challenge in the Era
