figure_title: Effects of CR and IF on cardiac metabolism.
caption: Effects of CR and IF on cardiac metabolism. CR and IF transiently activate
  AMPK-SIRT1 and inhibit mTOR, promoting mitochondrial biogenesis, redox balance,
  and enhanced cellular stress resistance. These coordinated metabolic and epigenetic
  adaptations contribute to long-term cardioprotection. Green arrows indicate activation
  or upregulation of pathways, whereas red arrows indicate downregulation of signaling.
  CR (Calorie Restriction); IF (Intermittent Fasting); AMPK (AMP-activated protein
  kinase); SIRT1 (Sirtuin1); Nrf2 (nuclear factor erythroid 2-related factor 2); mTOR
  (Mammalian target of rapamycin)
