figure_title: MaR1 dampens ferroptosis via activating the PKA/LATS1/2/YAP pathway
  in LIRI.
caption: MaR1 dampens ferroptosis via activating the PKA/LATS1/2/YAP pathway in LIRI.
  (A) The protein expression levels of the PKA/LATS1/2/YAP pathway were determined
  by western blotting. (B) Quantification analysis of the protein expression levels
  of p-PKA. (C) Quantification analysis of the expression levels of p-LATS1/2 and
  p-YAP protein. (D) Representative H&E staining of lung tissues (original magnification,
  ×200). (E) Acute lung injury score and wet/dry ratio of each group, and the relative
  contents of the proinflammatory cytokines TNF-α and IL-1β in lung tissue. (F) Representative
  western blotting results of TFRC and ACSL4 expression. (G) Quantification analysis
  of TFRC and ACSL4 expression levels. (H) Relative values of Fe2+, MDA, 4-HNE, and
  GSH concentrations. (I) Representative TEM images of each group. The white arrow
  indicates ferroptotic mitochondria, magnification ×8000. Data are presented as the
  mean ± SD, n = 6. * p < 0.05
