figure_title: Mediation analysis using diabetes severity grades stratified by HbA1c
  as the exposure.
caption: Mediation analysis using diabetes severity grades stratified by HbA1c as
  the exposure. (a) Hazard ratios and 95% confidence intervals for the associations
  between different diabetes grades and 18 secondary diseases; only statistically
  significant associations are shown. (b) Number of plasma proteins mediating each
  diabetes-to-secondary disease pathway under different diabetes grades. (c) Comparison
  of mediation effects of proteins across different diabetes grades. (d) Dot plot
  showing the top five plasma proteins with the strongest mediation effects in each
  disease path associated with different diabetes grades. (e, f) Nonlinear associations
  between HbA1c levels and the risk of Alzheimer’s disease (e) and valve disorders
  (f), estimated using generalized additive models. For Alzheimer’s disease, the vertical
  lines indicate two inflection points beyond which disease risk increases rapidly.
  For valve disorders, the vertical line marks the HbA1c level associated with the
  lowest estimated risk
