figure_title: Mechanisms of action of currently approved targeted therapies for AML.
caption: Mechanisms of action of currently approved targeted therapies for AML. BCL-2
  inhibitors (e.g., venetoclax) promote mitochondrial apoptosis by inhibiting anti-apoptotic
  BCL-2 and facilitating activation of pro-apoptotic proteins BAX and BAK. Isocitrate
  dehydrogenase (IDH) inhibitors (enasidenib, ivosidenib, and olutasidenib) block
  mutant IDH1/2 enzymes, reducing the oncometabolite 2-hydroxyglutarate (2-HG) and
  restoring normal TCA cycle and epigenetic function. Hypomethylating agents (HMAs)
  such as azacitidine and decitabine are incorporated into DNA/RNA as nucleoside analogs,
  leading to inhibition of DNA methyltransferases (DNMTs) and reactivation of silenced
  genes, including pro-apoptotic mediators like BIM. FLT3 inhibitors (e.g., midostaurin,
  gilteritinib, quizartinib) target aberrant FLT3 signaling driven by internal tandem
  duplications (ITDs) or tyrosine kinase domain (TKD) mutations, blocking downstream
  activation of JAK/STAT, PI3K/Akt/mTOR, and RAS/MAPK pathways, reducing leukemic
  cell proliferation and survival. Menin inhibitors (e.g., revumenib) disrupt the
  interaction between menin and KMT2A fusion proteins, leading to transcriptional
  repression of leukemogenic target genes. Together, these therapeutic strategies
  target metabolic, epigenetic, and signaling dependencies in AML cells, illustrating
  the rationale for pathway-specific treatment approaches
