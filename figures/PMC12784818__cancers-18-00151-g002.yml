figure_title: 'Illustrations of three CAF-centered, actionable hubs that support prostate
  cancer progression and therapy resistance under AR pathway inhibition: (3) CAF-derived
  NRG1 activates tumor-cell HER3 (HER2/HER3 heterodimer) to trigger PI3K–AKT, promoting
  survival and antiandrogen resistance (targetable via anti-NRG1/anti-HER3 or PI3K/AKT
  blockade); (2) CAF-derived FGFs/FGF9 signal through tumor FGFR1–FRS2, branching
  to RAS–MAPK/ERK and PI3K–AKT to drive proliferation/survival and resistance (targetable
  at FGFR or downstream nodes such as FRS2/MAPK/PI3K); and a tumor deacetylated KLF5→TNF-α
  module reinforces CAF activation.'
caption: 'Illustrations of three CAF-centered, actionable hubs that support prostate
  cancer progression and therapy resistance under AR pathway inhibition: (3) CAF-derived
  NRG1 activates tumor-cell HER3 (HER2/HER3 heterodimer) to trigger PI3K–AKT, promoting
  survival and antiandrogen resistance (targetable via anti-NRG1/anti-HER3 or PI3K/AKT
  blockade); (2) CAF-derived FGFs/FGF9 signal through tumor FGFR1–FRS2, branching
  to RAS–MAPK/ERK and PI3K–AKT to drive proliferation/survival and resistance (targetable
  at FGFR or downstream nodes such as FRS2/MAPK/PI3K); and a tumor deacetylated KLF5→TNF-α
  module reinforces CAF activation. In CAFs, (1) nuclear YAP1 induces ECM genes (e.g.,
  COL1A1, CCN2, CD248) and desmoplastic matrix formation while suppressing IKKα/β–NF-κB;
  YAP1 inhibition releases NF-κB signaling to upregulate inflammatory/chemotactic
  factors (CXCL9/10/11, IL33, TNFAIP6), enhancing CD8+ T-cell recruitment/activation,
  supporting YAP1 as a stromal reprogramming target (often in combination with immunotherapy).
  Figures were created with BioRender.com and publication rights have been obtained'
