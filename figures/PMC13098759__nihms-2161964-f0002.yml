figure_title: Transcriptomic and functional evidence of mitotic stress upon DHX9 inhibition
caption: 'GSEA of RNA-seq data from DHX9i-sensitive (AN3CA, KLE, OVCAR3, PEO4) and
  -resistant (MFE296, MFE280, ARK2, OVCAR8) HGSOC and EC models treated with or without
  DHX9i (10 μM, 72 hours). Gene count represents the number of leading-edge genes
  contributing to each pathway. Circle size reflects gene count, with larger circles
  indicating more genes. Red indicates significantly upregulated pathways (positive
  NES), and blue indicates significantly downregulated pathways (negative NES). Shown
  are pathways related to mitosis, DNA repair, apoptosis, anti-apoptosis, and microtubule-actin
  dynamics (all |NES| > 1.5, padj < 0.05).Abbreviations: DHX9i, DHX9 inhibitor; EC,
  endometrial cancer; GSEA, gene set enrichment analysis; HGSOC, high-grade serous
  ovarian cancer; NES, normalized enrichment score'
article_title: DHX9 inhibition enhances paclitaxel sensitivity by inducing mitotic
  failure in ovarian and endometrial cancers
