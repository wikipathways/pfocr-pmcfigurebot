figure_title: GO and KEGG enrichment analysis for hub genes.
caption: GO and KEGG enrichment analysis for hub genes. (A) Bar chart depicting the
  results of GO and KEGG pathway enrichment analyses of hub genes, categorized into
  biological processes (BP), cellular components (CC), molecular functions (MF), and
  KEGG pathways. The x-axis represents GO and KEGG terms. (B–E) Network diagrams illustrating
  the GO and KEGG enrichment analysis results for hub genes, with panels corresponding
  to BP (B), CC (C), MF (D), and KEGG pathways (E). In these networks, light yellow
  nodes represent enriched terms, orange nodes denote hub genes, the size of the black
  nodes corresponds to the count value, with larger dots representing higher counts,
  and connecting lines indicate their relationships. The screening criteria for GO
  and KEGG enrichment analysis were adj.p < 0.05, FDR value (q value) < 0.235, and
  the p-value correction method was Benjamini–Hochberg (BH)
