figure_title: Transcriptomic profiles of HUVECs associated with EC activation after
  2 Gy and 5 Gy of IR.
caption: Transcriptomic profiles of HUVECs associated with EC activation after 2 Gy
  and 5 Gy of IR. Transcriptomic changes in irradiated HUVECs, analyzed in comparison
  with their respective controls (no IR) and across experimental conditions (varying
  dose and time after IR). Specific transcriptomic profiles related to cell cycle
  (a–c), ECM remodeling (d–f), and immune response activation (g–i). (a,d,g) Dot plots
  displaying pathways enriched in irradiated HUVECs compared with the control, identified
  through KEGG pathway analysis. Up/Down Ratio represents a proportion between up-
  and down-regulated genes in each pathway. Up-regulated pathways are defined with
  Up/Down ratio >1, and down-regulated with Up/Down ratio <1. Pathways with p-values
  of <0.05 were considered as statistically significant. (b) Top 30 significantly
  cell cycle-associated differentially expressed genes in irradiated samples compared
  with the control. (c,f,i) Heatmaps illustrating significantly differentially expressed
  genes related to the cell cycle (c), ECM (f), and immune response (i) at 72 vs.
  24 h after IR. (e,h) Heatmaps of significantly differentially expressed genes in
  irradiated samples relative to the control, related to ECM (e) and immune response
  (h). Genes were considered significantly differentially expressed if the adjusted
  p-value was <0.05 and fold change (FC) was >1.5 (up-regulation) or FC was <0.67
  (down-regulation). n = 5 per group. IR—irradiation. EC—endothelial cell. KEGG—Functional
  Kyoto Encyclopedia of Genes and Genomes
