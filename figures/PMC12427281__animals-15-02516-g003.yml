figure_title: Overview of Candidate Gene GO and KEGG Enrichment Analysis.
caption: 'Overview of Candidate Gene GO and KEGG Enrichment Analysis. (A) GO Enrichment
  Analysis Bubble Plot: The three categories of GO terms (Biological Process, Cellular
  Component, and Molecular Function) are shown. The x-axis represents the-log10 (p-value),
  and the y-axis lists the significant GO terms. The color of the bubbles ranges from
  red to blue, indicating p-values from large to small (dark blue represents more
  significant terms). The size of each bubble reflects the number of candidate genes
  enriched in that GO term. (B) KEGG Pathway Enrichment Bubble Plot: The x-axis is
  also-log10 (p-value), and the y-axis represents significant pathways. The size of
  the bubbles indicates the number of candidate genes involved, and the color represents
  the significance of the enrichment. (C) GO Pathway–Gene Network Diagram: Yellow
  solid circular nodes represent the GO pathways, and gray solid circular nodes represent
  the genes. The connecting lines show the participation of genes in the corresponding
  GO terms. The term “response to unfolded protein” is highlighted in red to emphasize
  its key role in the candidate gene set. (D) KEGG Pathway–Gene Network Diagram: Yellow
  solid circular nodes represent KEGG pathways, and gray solid circular nodes represent
  genes. Connecting lines indicate participation relationships. The “Butanoate metabolism”
  pathway is highlighted in red, with the ACSM family gene region prominently displayed,
  underscoring its potential functional role in milk fat metabolism'
