caption: Comparison of the transcription changes in genes in the dorsolateral prefrontal
  cortex predicted by TWAS (A) and obtained by transcription analysis (B) that are
  involved in protein processing in the endoplasmic reticulum. The color of pathway
  nodes depends on either TWAS z-scores (A) or logFC values (B). The colors of the
  left and right parts of the pathway nodes depend on logFC values obtained for males
  and females, respectively (B). Generally, red and blue colors refer to up- and down-regulated
  genes, respectively. Part (A) of the figure was created using TWAS z-scores obtained
  using GTEx cortex data, while part (B) was created using logFC values obtained by
  analysis of dorsolateral prefrontal cortex data from the GSE80655 dataset
