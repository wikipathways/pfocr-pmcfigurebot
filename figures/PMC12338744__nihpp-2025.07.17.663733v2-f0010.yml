figure_title: Relationship of failed repair to COVID-19 disease
caption: A repair index score as a function of (A) viral gene expression (TPM) at
  3 dpi, (B) peak LDHB protein in secretions at 7 dpi, (C) sex, and (D) age. All comparisons
  depict the repair index at 14 dpi. (E-G) Failed repair genes are enriched in GSEA
  analyses for (E) a reported autopsy (~ 30 d post-SARS-CoV-2 symptom initiation)
  with early pulmonary fibrotic histologic changes (46); (F) GeoMX spatial transcriptomics
  studies of conducting airway epithelia of five subjects 6–12 mo post-initiation
  of SARS-CoV-2 symptoms who exhibited persistent CT abnormalities and required VATS
  biopsies, again with fibrotic changes evident on histology; and (G) transbronchoscopic
  epithelial biopsies of subjects exhibiting a long pulmonary COVID phenotype that
  manifests as chronic cough, sputum production, and chest congestion persistently
  for ~ 18 mo post-SARS-CoV-2 infection vs. subjects who resolved symptoms post-SARS-CoV-2
  (46). (H) Relationship between ISGs and viral TPM at 14 dpi (slope=0.68 SE 0.14,
  p<0.0001). (I) Selected pathways over-represented (enriched) in failed repair gene
  set. Shaded areas in A, B, and H represent the 95% confidence intervals
