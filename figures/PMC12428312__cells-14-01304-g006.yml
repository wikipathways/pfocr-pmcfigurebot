figure_title: hASC-derived EVs modulated astrocyte upstream regulators linked to TBI-induced
  inflammation at 30 dpi.
caption: hASC-derived EVs modulated astrocyte upstream regulators linked to TBI-induced
  inflammation at 30 dpi. EVs shift key upstream regulators (e.g., NFKBIA, TNF, and
  IL1B) toward the sham level in aged TBI mice at 30 dpi. Heat maps annotated by IPA
  core analysis based on trend and z-score represent comparison analysis of upstream
  regulators represented in TBI + PBS/sham, TBI + 20 µg EVs/sham, and TBI + 20 µg
  EVs/TBI + PBS. (A) Three-month mice showed that TBI + PBS/sham had no dramatic change
  in upstream regulators based on injury effect; similarly TBI + 20 µg EVs/TBI + PBS
  had no significant changes in upstream regulators based on EV treatment. (B) Fifteen
  months (C) and twenty months, where TBI + PBS/sham had upstream regulators that
  were activated due to the injury, and TBI + 20 µg EVs/sham and TBI + 20 µg EVs/TBI
  + PBS had upstream regulators that were inhibited due to EVs treatment. Red indicates
  predicted activation (positive z-score), green indicates predicted inhibition (negative
  z-score). White boxes without a z-score annotation did not meet the p-value cutoff
  for pathway prediction, and thus no activation prediction could be made. Pathway
  activation or inhibition was considered significant with a |z-score| ≥ 2 or ≤−2,
  respectively. IPA analysis shows predicted activation of TCF7L2 at 15 months (D)
  and IL1B at 20 months (F) in TBI groups with a z score of 2.350 and 1.991, respectively.
  The TBI + EVs in the 15-month group (E) and the 20-month group (G) had predicted
  inhibition with a z-score of −2.110 and −1.1863, respectively. Each outer node corresponds
  to an experimentally measured protein, where red signifies up-regulation and green
  denotes down-regulation. Arrows indicate the predicted relationship to the central
  node, with blue representing inhibition and orange representing activation. Each
  experimental group included N = 5 animals across different age groups
