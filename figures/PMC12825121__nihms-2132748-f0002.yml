figure_title: Jub recruits Wts into phase-separated condensates
caption: (A) Schematic illustrating Hippo pathway complexes, including Jub at AJ,
  Ex at apical junctions, and apical-medial Kibra. Jub inhibits Wts; apical junctional
  and medial complexes activate Wts by promoting its phosphorylation by Hpo. Active
  Wts phosphorylates Yki, which inhibits it by promoting cytoplasmic localization;
  unphosphorylated Yki associates with Sd in the nucleus to promote transcription.(B–E)
  (B) Wing disc cells expressing Wts:GFP and Jub:mKate2. (C–E) S2 cells transfected
  to express (C) FLAG:Jub, (D) Jub:Ven, or (E) Wts:V5, with nuclei labeled by Hoechst
  and FLAG:Jub and Wts:V5 visualized by antibody staining.(F) Frames from a video
  showing fusion of Jub:Ven puncta, highlighted by yellow circles.(G) FRAP of Jub:Ven
  puncta (n = 9, from 5 discs, error bars indicate SEM) in wing discs.(H and J–L)
  S2 cells transfected to express Wts:V5 and FLAG:Jub (H), FLAG:Jub-preLIM1,2 (J),
  FLAG:Jub-preLIM1,3 (K), or FLAG:Jub-preLIM2,3 (L), stained with Hoechst to detect
  nuclei and antibodies to detect FLAG and V5. Box in (H) shows a higher magnification
  of the dashed square. (I) Line scan through an FLAG:Jub Wts:V5 condensate (pink
  bar in H).(M) Histogram showing maximum/median Jub signal within individual cells
  expressing Jub with or without Wts (indicated by + or −) or expressing different
  Jub constructs.(N) Histogram showing maximum/median Wts signal within individual
  cells expressing Wts with or without Jub (indicated by −) or expressing different
  Jub constructs. n = 24 (Wts), 30 (Jub), and 33 (Jub + Wts), 28 (JubLIM1,2 + Wts),
  31 (JubLIM1,3 + Wts), and 22 (JubLIM2,3 + Wts). Error bars indicate 95% confidence
  interval (CI), significance of differences by one-way ANOVA relative to expression
  of Jub alone (K) or Wts alone (L) indicated by green symbols.ns p > 0.05, ***p ≤
  0.001, and ****p ≤ 0.0001. Scale bars, 6 μm in (B), 10 μm in (C and H–J), and 4
  μm in (F)
article_title: Jub-induced phosphorylation of Warts inhibits its activity and recruitment
  into biomolecular condensates
