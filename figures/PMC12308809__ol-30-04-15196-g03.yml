figure_title: Roles of key ferroptosis genes in STAD.
caption: Roles of key ferroptosis genes in STAD. (A) Among the 14 key genes in STAD,
  MYB, NOX4, PVT1 and PRR5 expression was increased in STAD tumors compared with normal
  tissue. *P<0.05. (B) Expression trend of each key gene from stages I to IV. (C)
  Risk genes for DFI, DSS, OS and PFS among the 14 key genes. (D) Association between
  key genes and cancer pathways. STAD, stomach adenocarcinoma; DFI, disease-free interval;
  DSS, disease-specific survival; OS, overall survival; PFS, progression-free survival;
  NOX, NADPH oxidase; MYB, MYB proto-oncogene, transcription factor; PRR5, proline-rich
  protein 5; PVT1, Pvt1 oncogene; TF, transferrin; GABARAPL2, GABA type A receptor
  associated protein like 2; GJA1, gap junction protein α1; HCAR1, hydroxycarboxylic
  acid receptor 1; AKR1C2, aldo-keto reductase family 1 member C2; DUOX1, dual oxidase
  1; FXN, frataxin; RBMS1, RNA binding motif single stranded interacting protein 1;
  TPM, transcripts per million; A, activation; I, inhibition
