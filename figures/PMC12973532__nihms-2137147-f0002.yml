figure_title: Comparative analysis of PGRMC1 interactome.
caption: Comparative analysis of PGRMC1 interactome.(a) Venn diagram of identified
  PGRMC1 prey from MEL, HEK293T (HEK), and HepG2 cell lines filtered using the CRAPome
  repository. (b) Heatmap of PGRMC1 interactome common in all three cells lines using
  the normalized FC values, represented by color scale (2.0 to 0.0) with all values
  greater than 0.0. Prey proteins previously identified as candidate proteins of MAMs
  indicated with asterisk (*). (c) Bar graph of biological process enrichment profile
  of 70 proteins found in the core PGRMC1 interactome in MEL, HEK293T (HEK), and HepG2
  cells. X-axis shows −log10 of adjusted p-value (padj) and Y-axis the biological
  process. (d) Bar graph of pathway enrichment profile of proteins found in at least
  two cell lines. Top four biological processes shown for each cell line combination.
  X-axis shows −log10 of adjusted p-value and Y-axis the biological process. (e) Bar
  graph of gene ontology (GO), cellular compartment (CC), biological process (BP),
  and molecular function (MF) of common PGRMC1 and FECH interactome proteins. X-axis
  shows −log10 of adjusted p-value and Y-axis is GO aspect
