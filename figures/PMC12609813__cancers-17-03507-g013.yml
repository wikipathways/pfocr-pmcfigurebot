figure_title: ER signaling pathway in BCa.
caption: ER signaling pathway in BCa. The figure illustrates both genomic and non-genomic
  mechanisms of ER activation. In the genomic pathway, estrogen binds to nuclear ERs,
  leading to receptor dimerization and translocation into the nucleus, where it regulates
  gene transcription. In the non-genomic pathway, estrogen interacts with membrane-associated
  ERs, triggering rapid signaling cascades including Ras/Raf/MEK/ERK, PI3K/Akt, and
  Src-mediated pathways. These cascades promote cell proliferation, survival, inflammation,
  protein synthesis, and metastasis through downstream effectors such as JNK, p38
  MAPKs, NF-κB, and CREB. Generated with BioRender (https://app.biorender.com, accessed
  on 22 June 2025)
