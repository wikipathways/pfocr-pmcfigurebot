figure_title: Role of aryl hydrocarbon receptor (AHR) signaling in maintaining skin
  homeostasis and modulating S.
caption: 'Role of aryl hydrocarbon receptor (AHR) signaling in maintaining skin homeostasis
  and modulating S. aureus colonization: In healthy skin, secreted factors and membrane
  vesicles derived from the skin microbiome activate AHR signaling in keratinocytes.
  This pathway induces the expression of antimicrobial peptides (AMPs), antioxidative
  genes such as HMOX1, and anti-inflammatory mediators that collectively prevent S.
  aureus-induced inflammation and colonization. AHR activation also promotes the expression
  of skin barrier genes, thereby reinforcing epidermal integrity. On the other hand,
  in inflamed skin, impaired AHR signaling diminishes these protective effects. Here,
  microbiome-derived factors can exacerbate inflammation by inducing damage-associated
  molecular pattens (DAMPs) which further compromise the skin barrier and favour S.aureus
  colonization'
article_title: Commensal Staphylococci attenuate Staphylococcus aureus skin colonization
  and inflammation via AHR-dependent signaling
