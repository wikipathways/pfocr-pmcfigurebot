caption: Single-cell transcriptome sequencing analyses identify macrophage markers
  associated with colorectal cancer prognosis. (A) t-SNE plot of scRNA-seq consisting
  of 64 colorectal cancer tissues and 36 normal tissues in the GSE178341 cohort. (B)
  Marker genes expression heatmap across scRNA-seq annotated subclusters. (C) KEGG
  pathway enrichment analysis of macrophage genes up-regulated in tumor tissues compared
  with normal tissues. (D-F) Identification of macrophage genes of CRC through intersection
  of three gene sets and Lasso analysis. (G) Dot plot demonstrating subcluster expression
  patterns of identified genes. (H) Feature plot of all single cells colored by the
  expression level of DPP7
