figure_title: Chemical structures of key therapeutic modulators and the LPO pathway.
caption: 'Chemical structures of key therapeutic modulators and the LPO pathway. The
  figure displays the central regulatory and therapeutic molecules involved in the
  copper-iron-ferroptosis nexus. Top panel: deferoxamine (DFO), deferiprone (DFP),
  and SK4, high-affinity iron chelators used to sequester Fe2+ and inhibit Fenton-driven
  initiation; diacetylbis(N4-methylthiosemicarbazonato)copper(II) (CuII(atsm)), a
  copper-based complex with potent anti-ferroptotic activity; Cuprizone, a copper
  chelator utilized in experimental models of demyelination to induce metal-homeostasis
  disruption, and elesclomol, a novel copper transporter that binds extracellular
  Cu(II) and releases Cu(I) into the cell; GSH, an essential endogenous antioxidant,
  and MMP+, an apoptotic inducer and neurotoxin. Bottom panel: mechanism of LPO and
  lipid priming. The radical chain reaction is illustrated through four stages of
  a substrate-specific process: (1) Priming: the enzymatic activation of polyunsaturated
  fatty acids (PUFAs), specifically arachidonic acid (LH), for membrane incorporation
  via the ACSL4-LPCAT3 axis, which generates the required PUFA-PE context; (2) Initiation:
  the formation of the carbon-centered lipid radical (L•) via iron-catalyzed hydroxyl
  radical (•OH) initiation; (3) Oxygenation: the generation of the lipid peroxyl radical
  (LOO•); and (4) Propagation: the primary toxic product, LOOH, is formed as LOO•
  reacts with adjacent PUFA-PEs in a self-amplifying cycle. The “vicious cycle” concludes
  in membrane rupture when these specific phospholipid substrates are exhausted or
  their repair mechanisms fail'
