figure_title: CellChat-based identification of cell-cell communication networks
caption: (A); Chord plot showing direction and interaction weight indicated by arrows/thickness
  representing aggregated cell-cell communication probability computed using the CellChat
  probabilistic model. (B); Heatmap of communication probabilities between sender
  and receiver cell types (x-axis) mediated by ligand–receptor pathways (y-axis) for
  P0, P5, and P10 neonatal ages. Communication probabilities were calculated based
  on the presence of ligand-receptor factors within cells from the Xenium spatial
  data. Rectangle color corresponds to mean probability score. (C); Heatmap showing
  examples of communication probabilities across ligand-receptor pairs within the
  LAMA4 signaling pathway. Sender–receiver cell type interactions (x-axis) for control
  and ICH samples are shown at the three neonatal ages. Rectangle color corresponds
  to mean probability score. (D); Heatmap of cell-cell communication probabilities
  between sender and receiver cell types (x-axis) mediated by ligand–receptor pairs
  involved in GAS signaling pathways (y-axis) for P10 control and ICH samples. Rectangle
  color corresponds to mean probability score
