figure_title: DGAT2 inhibition and EPA amplify TLR3-mediated inflammatory responses
  in keratinocytes
caption: (A) DGAT2 catalyzes TG synthesis from DG and FAs, like EPA. Spry1ΔEpi mouse
  epidermis shows significantly higher EPA levels. n = 4 mice per genotype. (B) Quantitative
  reverse transcription (qRT-PCR) analysis of cytokine expression (IL-1β, IL-6, IL-23,
  and TNF-α) in keratinocytes treated with poly(I:C), EPA, and DGAT2 inhibitor (DGAT2i).
  n = 3 samples per group. (C) ELISA quantification of IL-23 in keratinocyte supernatants
  showing increased secretion with EPA and DGAT2i. n = 4 samples per group. (D) qRT-PCR
  analysis of cytokine expression in keratinocytes treated with LPS, EPA, and DGAT2i.
  n = 4 samples per group. (E and F) Flow cytometry analysis showing increased proportions
  of IL-1β+IL-22+ keratinocytes following EPA and DGAT2i treatment. n = 6 samples
  per group. (G) Western blot analysis of MAPK pathway activation that shows increased
  phosphorylation of ERK, p38, and JNK with poly(I:C), EPA, and DGAT2i. (H) Western
  blot analysis of NF-κB pathway activation that shows enhanced phosphorylation of
  p65 and IκBα with poly(I:C), EPA, and DGAT2i. For Western blotting, 20 μg of protein
  is loaded per well. n = 3 samples per group. Repeated measures 1-way ANOVA was performed.
  *P < 0.05, **P < 0.01, ***P < 0.001
article_title: DGAT2 reduction and lipid dysregulation drive psoriasis development
  in keratinocyte-specific SPRY1-deficient mice
