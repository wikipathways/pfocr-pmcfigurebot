figure_title: Analysis of functional characteristics, metabolic profiles, and communication
  patterns of cancer stem cells (CSCs).
caption: 'Analysis of functional characteristics, metabolic profiles, and communication
  patterns of cancer stem cells (CSCs). (a) Bar plot showing the proportion of CSCs
  (red) versus ordinary cancer cells (blue) across multiple cancer types. (b) AUCell
  analysis scores for epithelial–mesenchymal transition (EMT) and cell-cycle activity
  in BLCA. CSCs exhibit significantly higher EMT and cell-cycle activity compared
  to ordinary cancer cells (**** p < 0.0001, Wilcoxon rank-sum test). (c) Bar plot
  showing the most significantly different metabolic pathways in CSCs relative to
  ordinary cancer cells in bladder cancer (BLCA). Red indicates pathways upregulated
  in CSCs, while blue represents downregulated pathways. (d,e) Circle plots visualizing
  the cell–cell communication network in the tumor microenvironment, showing (d) the
  total number of interactions and (e) the total interaction strength, respectively.
  (f) Bar plot comparing the aggregated communication probability (strength) of major
  incoming (left) and outgoing (right) signaling pathways for CSCs versus ordinary
  cancer cells in BLCA. CSCs show stronger communication activity in key signaling
  pathways such as COLLAGEN, MIF, and LAMININ. (g,h) Visualization of key signaling
  pathway networks: (g) the LAMININ pathway with CSCs as the core signal sender, and
  (h) the COLLAGEN pathway with CSCs as the core signal receiver'
