figure_title: Brief overview of the canonical lipid synthesis pathway in seed crops.
caption: Brief overview of the canonical lipid synthesis pathway in seed crops. (A)
  Conversion of acetyl-CoA into saturated acyl-ACP (C16:0 and C18:0). (B) Further
  modification of acyl-ACP into acyl-CoA. (C) Assembly of acyl-CoA catalysed by multiple
  acyltransferases to form TG, the main lipid class of oat oil. Enzymes are represented
  in bold black font, while lipid classes are highlighted in gold font. Blue arrows
  indicate the de novo TG synthesis pathway. Green arrows highlight the conversion
  of LPC to PC, while brown arrow indicates conversion of PC to LPC. ACCase, acetyl-CoA
  carboxylase; ACP, acyl carrier protein; DG, diacylglycerol; DGAT, acyl-CoA:diacylglycerol
  acyltransferase; ENR, enoyl-CoA reductase; FAD, fatty acyl desaturase; GPAT, glycerol-3-phosphate
  acyltransferase; HAD, 3-hydroxyacyl-ACP dehydratase; KAR, 3-ketoacyl-ACP reductase;
  KAS, ketoacyl-ACP synthase; LACS, long-chain acyl-CoA synthetase; LPA, lysophosphatidic
  acid; LPAAT, lysophosphatidic acid acyltransferase; LPC, lysophosphatidylcholine;
  LPCT, lysophosphatidylcholine acyltransferase; MCMT, malonyl-CoA:ACP transacylase;
  PA, phosphatidic acid; PAH, phosphatidic acid phosphatase; PC, phosphatidylcholine;
  PDAT, phospholipid:diacylglycerol acyltransferase; PDCT, phosphatidylcholine:diacylglycerol
  cholinephosphotransferase; SAD, stearoyl-ACP desaturase; TG, triacylglycerol; TE,
  fatty acid thioesterase
