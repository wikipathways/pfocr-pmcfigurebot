caption: 'LncRNA H19-mediated cardiac hypertrophy through the miR-141-3p and miR-200a-3p/PTEN
  pathway. (A) Binding site sequences of miR-141-3p, miR-200a-3p, and 3′-UTR of PTEN.
  (B) Targeting relationship of miR-141-3p and miR-200a-3p with PTEN, as determined
  using luciferase reporter assays. (C) qRT-PCR analysis of PTEN levels in the indicated
  groups. Data are normalized to GAPDH levels. (D) Representative blots and quantified
  data showing PTEN levels in the indicated groups. β-actin served as a loading control.
  Experiments were performed using at least three independent biological replicates.
  Uncropped blots are shown in Figure S16. (E-G) qRT-PCR analysis of miR-141-3p, miR-200a-3p,
  and PTEN levels in the indicated groups. Data are normalized to U6 and GAPDH levels.
  (H) Representative blots and quantified data showing protein levels in the indicated
  groups. β-actin served as a loading control. Experiments were performed using at
  least three independent biological replicates. Uncropped blots are shown in Figure
  S16. *Compared with the control group, *P < 0.05, **P < 0.01, ***P < 0.001, ****P
  < 0.0001. #Compared with the siH19-transfected group, ##P < 0.01. WT, wild-type;
  Mut, mutated; NC, negative control; M, mimic; I, inhibitor'
