figure_title: NK−derived EVs modulate the relative mRNA and protein expression levels
  of genes related to the SIRT1/SREBP−1c/PGC−1α pathway in calf hepatocytes.
caption: NK−derived EVs modulate the relative mRNA and protein expression levels of
  genes related to the SIRT1/SREBP−1c/PGC−1α pathway in calf hepatocytes. (a) Effects
  of NK−derived EVs on the relative mRNA expression levels of SIRT1-SREBP−1c/PGC−1α
  pathway-related genes in untreated (normal) calf hepatocytes and those treated with
  NEFAs at 2.4 mM. (b,c) Effects of NK−derived EVs on the relative levels of SIRT1/SREBP−1c/PGC−1α
  pathway-related proteins in normal calf hepatocytes and those treated with NEFAs
  at 2.4 mM. (d,e) The relative protein levels were quantified in normal calf hepatocytes
  and those treated with NEFAs at 2.4 mM NEFA using ImageJ 2.0.0−rc−30. The level
  of β-actin was used to normalize the relative protein expression. NK, Non-ketosis.
  NK-Normal, normal calf hepatocytes treated with NK-derived EVs. NK−2.4 mM NEFA,
  treated with NK−derived EVs and NEFAs at 2.4 mM. Results are presented as the mean
  ± SD (n = 3). * p < 0.05 and ** p < 0.01 vs. 0 μg/mL NK−derived EVs. Typical images
  of Western blotting are shown
