caption: Genome-wide association study and transcriptome-wide association study results
  for pituitary-related traits. (a) Shows the result of integrating GWAS body size
  trait-associated genetic variants with genome-wide gene expression data; only pituitary
  traits exhibit significant variant–gene expression associations among tested tissue-specific
  traits. (b) Presents TWAS analysis results; PTH2R on chromosome 15 has a significant
  Z score, indicating its expression variation is closely linked to pituitary trait
  phenotypic variation. (c) Displays top 20 KEGG pathway enrichments; the p53 signaling
  pathway and VEGF signaling pathway show strong enrichment scores and significance.
  (d) Shows GO functional enrichment results (across biological process, cellular
  component, molecular function categories), including transcriptional regulation,
  organelle membrane, and DNA-binding transcription factor activity. (e) Presents
  bulk tissue gene expression profile of PTH2R (sorted by expression); PTH2R is highly
  expressed in neural system tissues (hypothalamus, cerebral cortex, brain) and reproductive
  endocrine-related tissues (oocytes, pituitary), with pituitary expression among
