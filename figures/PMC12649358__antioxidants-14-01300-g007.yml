caption: 'Resveratrol alleviates the effect of LPS on GCs by activating PPARG/NRF2/HO-1
  pathway. Cells were treated with or without GW9662 (1 μM for 12 h), RES (1 μM for
  6 h), or LPS (4 μg/mL for 12 h). (A) Relative mRNA abundances of PPARG, NRF2, and
  HO-1; (B) representative protein bands of PPARG, NRF2, and HO-1; (C) relative protein
  abundances of PPARG, NRF2, and HO-1. All data are presented as the mean ± SEM. *
  indicates p < 0.05 compared with CON group. # indicates p < 0.05 compared with LPS
  group. & indicates p < 0.05 compared with RES + LPS group'
