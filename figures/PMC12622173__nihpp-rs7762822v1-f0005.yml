figure_title: Epigenetic landscape and transcriptional network regulation of myeloid
  cells in the brain environment
caption: (a) Principal Component Analysis (PCA) plot of ATAC-seq data annotated with
  H3K27ac ChIP-seq signals, illustrating the active enhancer landscape across human
  primary microglia, myeloid cells derived from iHPCs, CD34+ cells, and monocytes
  from both the CNS and periphery, as well as in vitro cultured iHPCs, CD34+ cells,
  and monocytes.(b) ATAC-seq analysis annotated for active H3K27ac, combining CD34
  and monocytes into a single analysis group to compare to iHPCs (n = 2–4 biological
  replicates per group). Differentially acetylated regions (FC > 2, padj < 0.05) enriched
  in CNS iHPCs (blue) and CNS CD34 and monocytes (red) are colored.(c) Metascape pathway
  enrichment analysis of the nearest genes associated with differential peaks upregulated
  in iHPCs-derived (1,357 peaks, blue) and CD34/monocyte-derived (2,433 peaks, red)
  for promoter/promixal regulatory regions (ATAC-seq peaks <1,000 bp from the transcription
  start site [TSS]). Bar plots display pathways with a −log10(p-value) greater than
  5.(d) UCSC genome browser tracts showing expression and corresponding ATAC-seq and
  H3K27ac ChIP-seq data from iHPCs (blue) and CD34+ cells/monocytes (red) engrafted
  in the CNS environment. P2RY12 marks genes upregulated in iHPCs-derived xMGs, while
  HLA-DR and MX2 exhibit higher peaks associated with upregulated genes in CD34/monocyte-derived
  brain myeloid cells, with differential peaks highlighted in grey.(e) De novo motif
  enrichment analysis for differentially acetylated ATAC peaks in iHPCs-derived xMGs
  using genomic background.(f) De novo motif enrichment analysis for differentially
  acetylated ATAC peaks in CD34 and monocyte-derived CNS myeloid cells using genomic
  background.(g) Immunofluorescence for the transcription factor MEF2C. Yellow arrows
  indicate MEF2C-positive nuclei co-localized with IBA1+ cells with quantification.
  Quantification of MEF2C (n = 3 biological replicates per group compared by one-way
  ANOVA with multiple comparison correction). Scale bar = 15 μm.(h) Phosphorylated-STAT1
  expression in transplanted myeloid cells. The intensity of phosphorylated-STAT1
  is compared across groups. Quantification of pSTAT1 (n = 3 biological replicates
  per group by one-way ANOVA with multiple comparison correction). Scale bar = 15
  μm. (i) TIMON analysis of differentially acetylated ATAC peaks. Nodes represent
  transcription factor (TF) motifs, while edges indicate significant co-occurrence
  (p < 0.001) between TF pairs. Blue nodes correspond to TF networks enriched in iHPCs-derived
  xMGs, and red nodes represent those enriched in CD34/monocyte-derived brain myeloid
  cells. The size of the nodes reflects their connectivity (degree), with nodes having
  a degree greater than 10 labeled. Co-occurring motifs with nodes (n ≥ 2) are also
  labeled.(j) The cliques identified in the iHPCs-derived (blue, top) and CD34/monocytes-derived
  brain myeloid cells network (red, top) highlight key transcription factor (TF) interactions.
  The representative cliques, IRF3-FLI1-MEF2A-MAFB (blue), were predominantly observed
  in the iHPCs-derived xMGs, with frequent co-occurrence of TF nodes in the network
  connectivity. SPI1-IRF2-STAT2-TGIF1 cliques (red) were detected in the upregulated
  peaks of the CD34/monocytes-derived brain myeloid cell network. The bar chart at
  the bottom shows the Gene Ontology (GO) terms associated with enhancers of the IRF3-FLI1-MEF2A-MAFB
  (blue) and SPI1-IRF2-STAT2-TGIF1 (red) cliques, with −log10(p-value) greater than
  4.(k) UCSC browser tracks show that SMAD3 is regulated by the co-occurring motifs
  IRF3-FLI1-MEF2A-MAFB. In contrast, MSR1 is upregulated by the SPI1-IRF2-STAT2-TGIF1
  motifs.(l) Linkage disequilibrium score regression analysis showing the enrichment
  of disease-associated risk alleles in xMGs derived from iHPCs and CD34+/monocyte
  precursors, based on differential H3K27ac ChIP-seq peaks. Enrichment significance
  is represented as −log10(p-value), indicated by the color scale
