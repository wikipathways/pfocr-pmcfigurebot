figure_title: Comparison diagram of macrophage lipid metabolism reprogramming between
  physiological state and sepsis states.
caption: Comparison diagram of macrophage lipid metabolism reprogramming between physiological
  state and sepsis states. Under physiological conditions (left), macrophages maintain
  FAO dominated energy metabolism through CD36 and CPT1a mediated lipid uptake, while
  acetyl CoA enters the TCA cycle to support OXPHOS. ABCA1/ABCG1 mediates cholesterol
  efflux to stabilize cell membrane function. Anti-inflammatory factors promote M2
  polarization through PPARγ signaling. In sepsis (right figure), lipid uptake (increased
  CD36) increases while FAO is impaired (especially inhibited by TREM2-SHP1 axis),
  leading to lipid accumulation and lipotoxicity. Cholesterol efflux disorder exacerbates
  lipid raft aggregation and TLR inflammatory signaling. In addition, saturated fatty
  acids and NLRP3 inflammasome activation drive M1 polarization dominant inflammation,
  while anti-inflammatory pathways such as PPARγ/LXR are inhibited. This lipid metabolic
  network is functionally coupled with glucose metabolism, where glycolytic-derived
  acetyl-CoA supports de novo lipogenesis, reflecting a high degree of substrate interdependency.
  FAO, fatty acid oxidation; CD36, cluster of differentiation 36; CPT1a, carnitine
  palmitoyltransferase 1a; TCA, tricarboxylic acid; OXPHOS, oxidative phosphorylation;
  ABCA1, ATP-binding cassette protein A1; ABCG1, ATP-binding cassette protein G1;
  IL, interleukin; PPARγ, peroxisome proliferator activated receptor γ; FFA, free
  fatty acids; TLR, toll-like receptor; TNF-α, tumor necrosis factor-α; NLRP3, NOD-like
  receptor domain-containing protein 3; LXR, liver X receptors; HNF4, hepatocyte nuclear
  factor 4; TREM2, triggering receptor expressed on myeloid cells 2; SHP1, SH2-containing
  protein tyrosine phosphatase-1
