figure_title: Mechanistic spectrum of NRF2 activation.
caption: 'Mechanistic spectrum of NRF2 activation. (A) NRF2 can be activated through
  six principal routes: (1) non-specific electrophile/ROS generation, (2) disruption
  of the NRF2–KEAP1 protein–protein interface, (3) autophagy-driven KEAP1 degradation,
  (4) direct stabilization of NRF2, (5) post-transcriptional regulation, and (6) post-translational
  modification. Despite the fact that only pathway 1 is electrophilic, >90% of currently
  available small-molecule activators exploit electrophilic chemistry. (B) Non-pharmacological
  NRF2 inducers display a markedly different mechanistic distribution: they are enriched
  for non-electrophilic pathways and often engage multiple mechanisms concurrently.
  Of the twelve non-pharmacological interventions assessed in this review—excluding
  the two whose mechanisms have yet to be elucidated—only therapeutic hypothermia
  operates purely through an electrophilic mechanism. The four other interventions
  that exhibit some degree of electrophilicity do so in conjunction with additional,
  non-electrophilic pathways, highlighting their mechanistic divergence from conventional
  electrophile-based activators'
