figure_title: Pedigree structure, genotype and type I interferon signaling status
  in familial and sporadic cases of COPA syndrome and asymptomatic COPA mutation carriers
caption: '(A) Pedigrees comprising both individuals manifesting COPA syndrome and
  clinically asymptomatic individuals, and (B) sporadic cases of COPA syndrome in
  whom STING haplotype data were available. Circles and squares indicate females and
  males respectively; black fill indicates clinical asymptomatic status. Blue, pink,
  green and yellow quadrants indicate lung, joint, kidney and skin involvement respectively.
  COPA genotypes are shown in blue, STING 232 status in green and presence of STING
  HAQ haplotype in red. Diagonal bars indicate deceased individuals. Arrows indicate
  index cases. (C) Kaplan–Meier analysis of age at symptom onset in individuals heterozygous
  for a COPA mutation (log-rank test, p < 0.0001). Affected patients are presented
  in salmon pink, while clinically asymptomatic individuals are presented in blue.
  #The status of patient F3.IV.2, manifesting vitiligo in the absence of other disease
  features at age 18 years, was considered uncertain, so that she was not included
  in our further analysis (D) Type I interferon pathway activation in individuals
  harbouring a pathogenic mutation in COPA as assessed by interferon (IFN) score performed
  by qPCR (left panel) or NanoString (right panel). Horizontal bar indicates median.
  STING HAQ haplotype carriers are circled in black. Mann-Whitney test,*p<0.05, ***p<0.01.
  Dotted lines indicate the upper control values of 2.466 (qPCR) and 2.724 (NanoString)'
