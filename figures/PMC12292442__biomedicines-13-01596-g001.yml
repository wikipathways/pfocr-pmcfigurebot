figure_title: Signaling pathways driving metabolic reprogramming in ADPKD.
caption: Signaling pathways driving metabolic reprogramming in ADPKD. The schematic
  summarizes the major signaling pathways involved in metabolic reprogramming in ADPKD.
  The loss of polycystin function due to PKD1/PKD2 mutations disrupts primary ciliary
  calcium signaling, resulting in cAMP accumulation and protein kinase A (PKA) activation.
  PKA, through the downstream activation of CFTR and the MEK/ERK pathway, promotes
  fluid secretion and epithelial cell proliferation, while modulating glucose and
  lipid metabolism. Concurrently, PI3K/Akt pathway activation and TSC1/2 complex inhibition
  lead to mTORC1 hyperactivation, which enhances glycolysis, lipogenesis, and protein
  synthesis and inhibits autophagy, ultimately impairing mitochondrial function. Activation
  of the Ras/ERK and Wnt pathways induces c-Myc, which upregulates key metabolic enzymes,
  such as hexokinase 2 (HK2), lactate dehydrogenase A (LDHA), and glutaminase (GLS),
  driving aerobic glycolysis and glutaminolysis. Mitochondrial dysfunction and increased
  ROS production stabilize HIF-1α, further promoting glycolytic flux via GLUT1, HK2,
  PFK1, PKM2, and LDHA upregulation. An excess of ROS also accelerates the degradation
  of NRF2, weakening antioxidant defense and exacerbating oxidative metabolic stress;
  these converging pathways orchestrate a profound shift in metabolic programming,
  fueling cystic cell growth, fluid secretion, and disease progression in ADPKD. PKA,
  protein kinase A; CFTR, cystic fibrosis transmembrane conductance regulator; ERK,
  extracellular signal-regulated kinase; PI3K, phosphoinositide 3-kinase; mTORC1,
  mechanistic target of rapamycin complex 1; TSC1/2, tuberous sclerosis complexes
  1 and 2; HK2, hexokinase 2; LDHA, lactate dehydrogenase A; GLS, glutaminase; ROS,
  reactive oxygen species; HIF-1α, hypoxia-inducible factor 1-alpha; NRF2, nuclear
  factor erythroid 2-related factor 2
