figure_title: Disruption of the β-catenin-TCF4 bridge between promoters and CEGRs/ALCDs
  reduces expression of oncogenes in fusion-expressing HEK-293 cells
caption: 'A) Left: QRT-PCR shows expression of the fusion transcript in HEK-293T-A1,
  A9, and A11 cells. Right: QRT-PCR shows expression of HMGA2 and FAP, which are targets
  of J-PKAc-β-catenin-cohesin ring. B) Treatments with PRI-724 reduce expression of
  the fusion J-PKAc kinase. Top: integrity of isolated proteins. Bottom: western blots
  with Abs to native and fusion PKAc. C) Levels of the fusion kinase in HEK-A1 and
  HEK-A9 cells were calculated as ratios to the native PKAc kinase. D) MG132 was added
  to the plates at the time of PRI-724 addition. Western blots show examination of
  the fusion kinase using Abs to native kinase and Fus-Abs. E) Results of an MTT proliferation
  assay in HEK-A9 and in HEK-A1 cells treated with DMSO and with PRI-724. F) Western
  blot shows expression of the J-PKAc and proteins of the ph-S675-β-catenin-TCF4 and
  p300 complexes in PRI-724-treated HEK-A9 and HEK-A1. G) ph-S675-β-catenin was precipitated
  from nuclear extracts of DMSO and PRI-724-treated cells, and the IPs were examined
  by western blot with Abs to ph-S675-β-catenin, TCF4, p300 and Fus-Abs. H) Western
  blot: components of the cohesin ring were determined in DMSO and PRI-724 treated
  HEK-A9 cells. CTCF IP: Examination of the components of the cohesin ring in CTCF
  IPs. I) Examination of downstream targets of the ph-S675-β-catenin-cohesin ring
  pathway and levels of proteins that regulate cell proliferation'
