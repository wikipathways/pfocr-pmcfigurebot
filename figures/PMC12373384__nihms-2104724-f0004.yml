figure_title: The fibroblast epigenomic landscape of skin reveals a transition to
  an open landscape in the remodeling phase compared to the fibrotic phase
caption: (A) UMAP of chromatin accessibility-based cell types identified via scATAC-seq.
  (B) Accessibility of characteristic fibroblast genes on scATAC-seq clusters. (C)
  UMAP of chromatin accessibility-based fibroblast clusters identified via scATAC-seq.
  (D) Coverage plots of top differentially accessible peaks with gene annotations
  for fibroblasts. (E) Gene ontology pathways (Top) and terms (Bottom) associated
  with fibroblasts at Day 0 (Left), Day 21 (Middle) and Day 28 (Right). (F) Highly
  enriched DNA motifs for fibroblasts comparing different timepoints. Red font indicates
  timepoint of enrichment. (G) Immunostaining of DNA motifs at Day 21 (top) and day
  28 (bottom) identified through scATAC-seq. White arrows show positive staining.
  Scale bar (G) 150 μm
