figure_title: Metabolite identification and computational workflow
caption: (a) Metabolites were identified through literature with associations to AD-protective,
  T2D, AD/T2D-protective, and both AD/T2D. A “+” is associated with disease, whereas
  a “–” is associated with protective conditions. Primary neurons were grown in 6-well
  plates and stimulated with metabolites and their respective vehicles and prepared
  for Luminex (b) After data acquisition, multi-pathway and MAPK/SAPK datasets were
  separately processed and combined into an intracellular signaling dataset. We performed
  multivariate analysis by creating partial least squares discriminant analysis models
  on the intracellular data, then correlated our cytokine and intracellular responses
  together with canonical correlation analysis
article_title: Metabolites associated with type 2 diabetes and Alzheimer’s disease
  trigger differential intracellular signaling responses in mouse primary neurons
