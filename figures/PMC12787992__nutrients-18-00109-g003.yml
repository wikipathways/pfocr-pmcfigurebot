figure_title: Iron-mediated signaling pathway.
caption: Iron-mediated signaling pathway. Hepatic cellular iron can increase the expression
  of BMP 2/4/6 and interact with BMPR-I and BMPR-II. This process activates the SMAD
  pathway, which involves the phosphorylation of SMAD1/5/8. The phosphorylated SMAD1/5/8
  complex subsequently binds to SMAD4 and translocates to the nucleus, where it regulates
  HAMP transcription. SMAD 6/7 inhibits SMAD 1/5/8 phosphorylation. HFE interacts
  with TfR2 to form an HFE/TfR2 complex. The HFE/TfR2 complex activates hepcidin transcription
  via the MAPK signaling pathway. Neogenin subsequently activates TMPRSS6. This binding
  activates the proteolytic cleavage of mHJV located on the cell surface. sHJV inhibits
  BMP-induced hepcidin expression
