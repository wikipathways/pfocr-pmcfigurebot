figure_title: Enrichment analysis.
caption: Enrichment analysis. (A) Volcano map showing DEGs between PL and CK. Red
  and green dots indicate genes whose expression significantly up-regulated or down-regulated,
  respectively. (p-adjust < 0.05). (B) Distribution of DEGs based on their predicted
  biological process, cellular component and molecular function upon punicalagin treatment.
  Punicalagin exerts bactericidal effects by targeting MRSA’s intracellular components
  and protein complexes, with this mechanism strongly supported by SEM/TEM-visualized
  ultrastructural damage. (C) GO pathway enrichment analysis of DEGs from punicalagin-treated
  MRSA cells
