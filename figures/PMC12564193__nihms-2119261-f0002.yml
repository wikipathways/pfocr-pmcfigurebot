figure_title: Oxidized DNA (ox-DNA) can act as a ligand for protein complexes in inflammatory
  signaling
caption: (A) In the mitochondria, ox-DNA can bind to 8-oxoguanine glycosylase 1 (OGG1),
  inducing DNA repair and a reduced immune response, or FEN1, inducing cleavage, secretion,
  and an increased immune response. (B) In the nucleus, ox-DNA can bind glycosylases
  in the NEIL family, where repair of DNA induces an increased immune response, or
  OGG1, where DNA repair reduces the immune response. (C) In the cytosol, ox-DNA (red)
  or non-ox-DNA (blue) can drive the proinflammatory proteins cyclic GMP-AMP synthase
  (cGAS), NLRP3, or absent in melanoma 2 (AIM2) to elicit DNA-driven immune responses.
  The relationship between the inflammasomes and cGAS is counterbalanced, such that
  only one pathway is triggered at a time, and the activity of one pathway often inhibits
  the activity of the other. Which pathway is activated is mainly governed by the
  type of activating stimulus. Figure created with BioRender
article_title: How interactions between oxidized DNA and the NLRP3 inflammasome fuel
