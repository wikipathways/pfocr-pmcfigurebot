figure_title: Hormone treatment in early life leads to sex-specific changes in the
  transcriptomic profiles in the aged hippocampus
caption: A) Control males had 541 differentially expressed genes (DEGs) compared to
  females, 246 DEGs were upregulated in males compared to females, 295 had higher
  expression in females. B) In the KEGG pathway analysis, males showed greater expression
  of genes related protein digestion, hepatitis, and the complement and coagulation
  cascade. C) Flutamide treatment resulted in 355 DEGs, 223 DEGs were upregulated
  in control males and 132 were downregulated. D) KEGG pathway analysis revealed that,
  compared to flutamide treatment, control males had higher expression of genes related
  to hepatitis and protein digestion. E) Testosterone treatment in females resulted
  in 493 DEGs – 246 upregulated in control females and 247 downregulated. F) Testosterone
  increased genes related to protein digestion, hepatitis, and the complement cascade,
  demonstrating that hormone treatment recapitulates sex differences in aged transcriptomics.
  N=4–6
article_title: Sex differences in microglia morphology and function across the lifespan
  are mediated by the early hormone environment
