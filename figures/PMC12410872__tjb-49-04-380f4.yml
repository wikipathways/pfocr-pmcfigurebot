figure_title: miR-9-5p regulates the expressions of NF-κB-Nrf2 pathway of CD4+ T cells
  in AAA lesion mice.
caption: 'miR-9-5p regulates the expressions of NF-κB-Nrf2 pathway of CD4+ T cells
  in AAA lesion mice.(A) The protein expressions of the NF-κB-Nrf2 pathway and its
  downstream target genes were evaluated by western blot. (B) The protein level of
  nuclear NF-κB. (C) The protein level of nuclear Nrf2. (D) The protein level of HO-1.
  (E) The protein level of NQO1. (F) Nuclear translocation of Nrf2 and NF-κB were
  determined by immunofluorescent staining (bar = 10 μm). Data represent the mean
  scores ± SEM of at least three independent experiments, *p < 0.05, **p < 0.01, Con
  group vs. AAA group; ##p < 0.01, #p < 0.05, AAA+Ago group vs. AAA+Ago NC group.
  NF-κB, nuclear factor kappaB; Nrf2, NF-E2-related factor 2; NQO1, NAD(P)H quinone
  oxidoreductase 1; HO-1, heme oxygenase-1'
article_title: miR-9-5p alleviates the development of abdominal aortic aneurysm by
  regulating the differentiation of CD4+IL-10+T cells via targeting the crosstalk
  between Nrf2 and NF-κB signaling pathways
