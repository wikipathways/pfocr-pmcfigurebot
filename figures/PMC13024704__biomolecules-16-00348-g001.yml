figure_title: Comparative mechanisms of ferroptosis and cuproptosis.
caption: 'Comparative mechanisms of ferroptosis and cuproptosis. The diagram illustrates
  the distinct biochemical pathways leading to RCD cell death via iron and copper
  accumulation. Left panel (ferroptosis): cell death is driven by the accumulation
  of labile ferrous iron (Fe2+), which catalyzes the production of hydroxyl radicals
  (•OH) via the Fenton reaction. These radicals induce the peroxidation of PUFAs within
  the lipid membrane. This lethal process is physiologically countered by the GSH
  system, regulated by the enzyme GPX4, which coverts LOOH to LOH to maintain membrane
  integrity. Right panel (cuproptosis): copper-induced death occurs primarily within
  the mitochondrial matrix. Excess Cu2+ is reduced to Cu+ by the upstream regulator
  FDX1. The resulting Cu+ promotes the lipoylation and subsequent toxic aggregation
  of DLAT. This proteotoxic “clumping” (DLAT)n, combined with the destabilization
  and loss of Fe-S cluster proteins, leads to catastrophic mitochondrial metabolic
  failure. While both pathways share a reliance on metal-induced oxidative stress
  (highlighted by yellow arrows converging on the final execution of cell death),
  they represent fundamentally different modes of execution: lipid-driven membrane
  failure (ferroptosis) vs. protein-driven metabolic catastrophe (cuproptosis). Experimentally,
  these pathways are distinguished in nanomaterials-based systems by the specific
  detection of FDX1-dependent DLAT oligomerization versus GPX4-regulated lipid peroxidation'
article_title: 'Ferroptosis and Cuproptosis in Cancer and Neurodegeneration: A Comprehensive
  Review of Modulation by Iron and Copper Chelators and Related Agents'
