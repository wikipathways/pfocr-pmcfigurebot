figure_title: RMS models display loss of NAPRT and sensitivity to OT-82 that is not
  rescued through the Preiss-Handler pathway
caption: A. Schematic of NAD+ biosynthesis pathways and “protective rescue” paradigm
  in tumors with loss of NAPRT. B. Plot illustrating the methylation of NAPRT across
  various cancer types. NAPRT is hypermethylated in RMS. C. Plot illustrating NAPRT
  protein expression across various cancer types. Loss of NAPRT protein expression
  is observed in RMS. D. Protein expression of NAPRT in four RMS models by western
  blot. E-G. Cell viability in NAPRT-silenced RD (E) and RH41 (F) cells treated with
  increasing concentrations of OT-82 for 6 days with or without 10 μM NA. G-H. Cell
  viability in NAPRT-expressing RH28 (G) and RH30 (H) treated with increasing concentrations
  of OT-82 for 6 days with or without 10 μM NA. I-L. Total NAD+ quantification post-24
  hours in RD (I), RH41 (J), RH28 (K) and RH30 (L) treated with respective IC50 concentrations
  with or without 10 μM NA. The data is plotted as mean with error bars indicating
  SEM.*p<0.05; ***p<0.001; ****p<0.0001; n.s., not significant. NAPRT, nicotinate
  phosphoribosyltransferase; NAMPT, nicotinamide phosphoribosyltransferase; NA, nicotinic
  acid; GAPDH, Glyceraldyde3phosphate dehydrogenase
