figure_title: IAA inhibited tumor cell growth in vitro and in vivo.
caption: 'IAA inhibited tumor cell growth in vitro and in vivo. (A) KEGG pathway enrichment
  analysis of DEGs from RNA sequencing dataset of GC patients. Size of circles represents
  the ratio of DEGs in pathways. Red: upregulated, blue: downregulated. (B) The abundance
  of IAA in GC patients. (C) Correlation analysis between bacteria and indole derivatives.
  (D) The concentration of IAA in GC cells supernatant co-cultured with L. paracasei
  ZJUZ2-3 were detected by ELISA. (E) Cell viability at OD450nm of human GC cells
  (AGS, HGC27) treated with PBS or IAA. (F) Colony formation of GC cells under treatment
  of PBS or IAA (10 μM). (G) The representative stomach morphologies of mouse. (H)
  The number of orthotopic tumor. (I) Representative HE and Ki-67 staining images
  of tumor tissues from mice administrated with PBS, L. paracasei ZJUZ2-3 and IAA.
  (J) Proportion of tumor area in HE staining images and Ki-67 staining showed decreased
  numbers of Ki-67+ cells in the tumor tissues of IAA and L. paracasei ZJUZ2-3 treated
  groups. (K) Schematic diagram shows the experimental design, time line and treatment
  of the GC xenograft mice (Lp: L. paracasei ZJUZ2-3). (L) The representative tumor
  morphologies. (M) L. paracasei ZJUZ2-3 colonization was confirmed by FISH. (N) Tumor
  weight compared between IAA-, L. paracasei ZJUZ2-3- or PBS-treated groups. (O) Tumor
  growth curve of IAA-, L. paracasei ZJUZ2-3- and PBS-treated groups. (P) The mouse
  body weight curve of IAA-, L. paracasei ZJUZ2-3- and PBS-treated groups. (Q) Representative
  H&E image of tumor tissues from mice administrated with PBS, IAA and L. paracasei
  ZJUZ2-3. Data in D, E, J, N, O and Q were analyzed by two-way ANOVA, Data in B,
  F and H were analyzed by t tests; Means ± SD. ns ≧0.05, *p < 0.05, **p < 0.01, ***p
  < 0.001, ****p < 0.0001'
