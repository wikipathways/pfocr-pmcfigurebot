figure_title: LINC01235 regulates the NOTCH pathway via NFIB
caption: a. qRT-PCR shows >50% reduction of NOTCH1 upon treatment of 2 independent
  ASOs targeting LINC01235 in MDA-MB-468 cells after 48 hours of incubation compared
  to mock and ScrASO treated cells. n=3 biological replicates. b. qRT-PCR shows >40%
  reduction of NOTCH3 upon treatment of 2 independent ASOs targeting LINC01235 in
  MDA-MB-468 cells after 48 hours of incubation compared to Mock and ScrASO treated
  cells. n=3 biological replicates. c. qRT-PCR of LINC01235 knockout clones shows
  ~50% reduction in NOTCH1 levels. n=3 biological replicates. d. qRT-PCR of LINC01235
  knockout clones shows ~50% reduction in NOTCH3 levels. n=3 biological replicates.
  e. qRT-PCR of selected clones with ectopic expression of NFIB or vector controls
  shows the rescue of expression of NFIB. n=3 biological replicates. f. qRT-PCR of
  selected clones with ectopic expression of NFIB or vector controls shows the rescue
  of expression of NOTCH1 and NOTCH3. n=3 biological replicates.Data are plotted as
  mean ± SEM using GraphPad Prism. ns, not significant, (***) P<0.001 by Student’s
  t-test
article_title: LINC01235 is an Upstream Regulator of the NFIB Gene and the NOTCH Pathway
  in Triple Negative Breast Cancer
