figure_title: Transplanting a Defined Synthetic Microbial Community With or Without
  Genetically Deleted Trimethylamine Production Capacity (ΔcutC) Alters Host Circadian
  Rhythms
caption: Germ-free C57Bl/6 mice (recipients) were gavaged with the core community
  (B. caccae, B. ovatus, B. thetaiotaomicron, C. aerofaciens, E. rectale) with TMA
  producing wild-type (WT) C. sporogenes (produces TMAO) or C. sporogenes ΔcutC. Gnotobiotic
  mice were then necropsied at 4-hour intervals to collect tissues including plasma
  (A and C) and olfactory bulb (B). (A) Plasma levels of TMAO pathway metabolites
  (choline, L-carnitine, betaine, γbutyrobetaine, trimethylamine (TMA), and trimethylamine
  N-oxide (TMAO)) were quantified by liquid chromatography tandem mass spectrometry
  (LC-MS/MS). (B) PCR was performed on olfactory bulb to examine key circadian clock
  regulators. (C) Plasma levels of metabolic hormones (insulin, GLP-1, and leptin)
  and select cytokines including interleukins (IL-1β, IL-2, and IL-33) were measured
  as described in the methods section. Data shown represent the means −/+ S.E.M. for
  n= 5–6 individual mice per group. Differences between WT-cutC and ΔcutC groups were
  determined using cosinor analyses p-values are provided where there were statistically
  significant differences between group for circadian statistics. The complete cosinor
  statistical analysis for circadian data can be found in Table 1. Significant differences
  between WT-cutC and ΔcutC groups were also analyzed by student’s t-tests within
  each ZT time point (* = p<0.05 and ** = p<0.01)
