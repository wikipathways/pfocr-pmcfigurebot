figure_title: Significant metabolic changes observed after BSS treatment
caption: a, Bubble plot of metabolomics and short chain fatty acids. Fold changes
  were calculated using paired time point samples, Day 2/Day 0. Bubble color reflected
  the log2 transformed fold changes. Significant difference between paired time point
  samples were calculated using the Wilcoxon test. Bubble size reflected the −log10
  transformed adjusted p-values. Metabolites included in the plot passed an FDR 10%
  significance threshold after adjustment using the Benjamini-Hochberg method. Metabolites
  were arranged by their associated pathway. b, Bubble plot of bile acids, and c,
  calculated bile acid ratios. Bubble color reflected paired Day2/Day0 fold changes,
  and size reflected significance as described in (a). Displayed molecules and ratios
  pass FDR filter of 20%. d, Sankey diagram depicting positive correlations between
  genus level eigengene modules to metabolites, arranged by their associated pathway.
  Genus eigengene module to metabolite connections displayed in the Sankey diagram
  had a correlation estimate (Pearson method) greater than or equal to 0.4 with p-value
  less than 0.05
