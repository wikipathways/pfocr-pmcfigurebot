figure_title: Multi-Modal profiling of SAVI iECs identifies transcriptional drivers
  of STING-mediated EndMT
caption: 'A. Top pathways enriched in SAVI P5 vs. P1 (iso-SAVI_SAVI cohort) by Ingenuity
  Pathway Analysis (IPA). Positive z-scores indicate pathway activation. Additional
  HC vs. SAVI analysis is shown in Figure S3A–B. B. EndMT signature heatmap in parental
  SAVI and isogenic iECs, with box-and-whisker plots of representative endothelial,
  mesenchymal, and previously reported EndMT-associated genes. Asterisks mark genes
  upregulated under TGFβ-induced EndMT 25 but downregulated in SAVI iECs. C. IPA-derived
  transcription factor network of significant upstream regulators in the iso-SAVI_SAVI
  cohort (orange = activated; blue = inhibited). D. Heatmap of activation z-scores
  for the same transcription factors in panel C, showing similar patterns in SAVI
  vs. HC iECs and SAVI vs. HC lung tissue. E. Constitutive STAT3 nuclear translocation
  in SAVI iECs. STAT3 immunofluorescence (red) with DAPI (blue) at P5 from one SAVI
  and matched isogenic control line; white arrows indicate nuclear STAT3 (scale bar:
  20 μm). Quantification reflects STAT3+ nuclei per total DAPI+ cells across 7–11
  fields from 3–4 wells (mean ± SEM; *p < 0.05, two-tailed unpaired t-test). F. STAT3
  activation in SAVI lung biopsies. Lung sections from 4 HC and 3 SAVI patients were
  stained for p-STAT3Y705 (red) and CD31 (green) with DAPI (blue). Representative
  images (scale bar: 20 μm) and quantification of p-STAT3 Y705/DAPI ratios (≥5 images
  per patient) show increased STAT3 activation in SAVI (mean ± SEM; ***p < 0.001,
  two-tailed unpaired t-test)'
