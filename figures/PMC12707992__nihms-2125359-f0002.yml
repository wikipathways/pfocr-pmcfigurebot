figure_title: Schematic representation of potential mechanisms linking obesity and
  T2DM to early-onset colorectal cancer
caption: Key pathways include insulin resistance and hyperinsulinaemia, chronic inflammation,
  and altered microbiome in the gut. Excess adiposity promotes insulin resistance,
  leading to chronic hyperinsulinaemia and impaired glucose metabolism. Insulin stimulates
  cell proliferation and inhibits apoptosis through the phosphatidylinositol 3-kinase
  (PI3K)–AKT–mTOR and RAS–mitogen-activated protein kinase (MAPK) signalling pathways,
  creating a pro-tumorigenic environment. Hyperglycaemia further contributes to carcinogenesis
  by promoting the production of reactive oxygen species, causing DNA damage and aberrant
  gene expression. Obesity and type 2 diabetes mellitus (T2DM) induce low-grade inflammation,
  characterized by elevated levels of cytokines and altered adipokine secretion. Chronic
  inflammation can drive colorectal cancer by promoting DNA damage through oxidative
  stress and dysfunction of the intestinal epithelial barrier. Macrophage polarization
  towards the pro-inflammatory M1 phenotype in adipose tissue promotes cytokine release,
  contributing to insulin resistance and systemic inflammation. Obesity and T2DM alter
  the composition of the gut microbiota, with reduced numbers of butyrate-producing
  bacteria and increased numbers of opportunistic pathogens, stimulating oncogenic
  signalling and promoting inflammation and suppression of antitumour immune responses.
  Microbial metabolites, such as short-chain fatty acids (SCFAs) and secondary bile
  acids, modulate inflammation and gut barrier function. Impaired barrier integrity
  allows bacterial components to infiltrate into surrounding tissues, activating inflammatory
  and immune responses and promoting tumorigenesis. Additionally, gut dysbiosis associated
  with obesity or T2DM might also influence colorectal tumorigenesis through gut–brain
  axis signalling or the insulin–PI3K pathway. Collectively, these interconnected
  mechanisms highlight how metabolic dysfunction, chronic inflammation and altered
  gut microbial composition might accelerate colorectal tumorigenesis, with potential
  age-specific differences contributing to the rising incidence of early-onset colorectal
  cancer. CRP, C-reactive protein; IGF, insulin-like growth factor; TNF, tumour necrosis
  factor
