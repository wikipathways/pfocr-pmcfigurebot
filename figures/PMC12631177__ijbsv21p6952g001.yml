figure_title: Common AA metabolic reprogramming in tumor cells.
caption: 'Common AA metabolic reprogramming in tumor cells. AA metabolic reprogramming
  is widely involved in the malignant progression of tumors. With the assistance of
  SLC1A5, Gln is transported intracellularly and catalyzed by GLS to Glu. Then, Glu
  can not only generate α-KG under the catalysis of GDH and participate in the TCA
  cycle, but also regenerate Gln under the catalysis of GS. And BCAAs mediated by
  LAT also generates Glu in the catalysis of BCAT. Arg is transported to cells mediated
  by CAT. iNOS and ARG are key enzymes in the catabolism of Arg and exert a double-edged
  effect on the driving of TAMs phenotype and the malignant progression of tumors
  by competing for the substrate Arg and generating multiple metabolites. Arg generates
  Orn under the influence of ARG. Orn can not only participate in the urea cycle to
  generate citrulline, and reproduce the synthesis of Arg under the action of ASS
  and ASL, but also be catalyzed by ODC to PAs. For Trp metabolic reprogramming, it
  is involved in the initiation and progression of tumors through the Kyn, 5-HT and
  indole metabolic pathways. Most Trp is catabolized through the Kyn metabolic pathway.
  Kyn is formed by TDO and IDO-catalyzed Trp, which is not only an endogenous agonist
  of AhR, but also further produces 3-HAA and 3-HK to exert biological effects. And
  5-HT produced by the breakdown of Trp transduces cellular signals by binding to
  5-HTR and is catabolically metabolized by MAO. Exogenously ingested Trp is typically
  converted to IAA and enters the TME through the bloodstream under the catalysis
  of the gut microbiota. Met is catalyzed by MAT to produce SAM, and SAM is converted
  to SAH after the methyl group is delivered to the receptor substrate. SAH can be
  hydrolyzed to Hcy under the catalysis of adenosine homocysteinase. And Hcy is re-methylated
  and generates Met through a variety of pathways. Finally, ferroptosis is regulated
  by iron metabolism, lipid metabolism and the system Xc-/GPX4 pathway. System Xc-
  regulates GSH synthesis mainly by mediating cystine uptake and Glu output. GPX4
  is able to utilize GSH to reduce PUFA-OOH to nontoxic PUFA-OH, thereby protecting
  cells from ferroptosis. In summary, AA metabolism reprogramming is complex and diverse,
  and it actively participates in the occurrence and development of tumors. (Gln:
  glutamine; GLS: glutaminase; GS: glutamine synthetase; SLC: solute carrier; Glu:
  glutamate; α-KG: α-ketoglutarate; TCA: tricarboxylic acid; GDH: glutamate dehydrogenase;
  BCAAs: branched-chain amino acids; BCKAs: branched-chain keto acids; BCAT: branched-chain
  amino acid aminotransferase; LAT: L-type amino acid transporter; Arg: Arginine;
  ASS: argininosuccinate synthase; ASL: argininosuccinate lyase; CAT: cationic amino
  acid transporter; ARG: arginase; iNOS: inducible nitric oxide synthase; NO: nitric
  oxide; Orn: ornithine; PAs: polyamines; ODC: ornithine decarboxylase; Met: Methionine;
  MAT: methionine adenosyltransferase; SAM: S-adenosylmethionine; SAH: S-adenosylhomocysteine;
  Hcy: homocysteine; AHCY: adenosylhomocysteinase; Trp: tryptophan; Kyn: kynurenine;
  5-HT: 5-hydroxytryptamine; TDO: tryptophan 2,3-dioxygenase; IDO: indoleamine 2,3-dioxygenase;
  AhR: aryl hydrocarbon receptor; 3-HAA: 3-hydroxyanthranilic acid; 3-HK: 3-hydroxykynurenine;
  TPH: ryptophan hydroxylase; 5-HTR: 5-hydroxytryptamine receptor; s; 5-HTP: 5-hydroxytryptophan;
  MAO: monoamine oxidase; IAA: indole-3-acetic acid; IPYA: indole-3-pyruvic acid;
  5-HIAA: 5-hydroxyindole acetic acid; GSH: glutathione; GPX: glutathione peroxidase;
  Cys: cysteine; Gly: glycine; GSSG: glutathione disulfide; PUFA: polyunsaturated
  fatty acid; AA: amino acid; TME: tumor microenvironment; TAMs: tumor-associated
  macrophages; ROS: reactive oxygen species)'
