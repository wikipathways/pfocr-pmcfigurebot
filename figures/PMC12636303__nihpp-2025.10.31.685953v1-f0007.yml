figure_title: Sex differences in human spinal cord microglia and astrocytes
caption: a. UMAP of 14 single nuclei sequencing astrocyte clusters in the dorsal horn.
  b Stacked bar plot showing differences in astrocyte cluster proportions between
  males and females c. UMAPs highlighting sex-specific expression patterns in astrocyte
  clusters; black circles indicate clusters, predominantly reactive, in males. d.
  Spatial organization of astrocytes in representative male and female Xenium samples
  e. UMAP of astrocytes annotated by biological pathway categories, showing male-enriched
  clusters involved in endoplasmic reticulum (ER) protein signalling and interferon
  signalling. f. UMAP of 16 microglia clusters in the dorsal horn. g. Stacked bar
  plot showing differences in microglia cluster proportions between males and females.
  h. UMAPs showing sex-specific expression patterns in microglia clusters; black circles
  indicate clusters predominantly corresponding to disease-associated microglia (DAM)
  in females i. Spatial organization of microglia in representative male and female
  Xenium samples. j. UMAP of microglia annotated by biological pathway categories,
  showing female-enriched clusters involved in TNFα signaling
article_title: A molecular map of the human spinal dorsal and ventral horn defines
