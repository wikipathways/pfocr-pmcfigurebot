caption: 'GK influences inflammation in KCs via inhibiting the PKCε/p38/STAT3 pathway.
  (A) PKC protein expression after siGK treatment in KCs. (B) PKC protein expression
  after OE GK treatment in KCs. (C) MAPK protein expression after siGK treatment in
  KCs. (D) MAPK protein expression after OE GK treatment in KCs. (E) STAT3, NF-κB,
  and c-Jun protein expressions after siGK treatment in KCs. (F) STAT3, NF-κB, and
  c-Jun protein expressions after OE GK treatment in KCs. (G) IL-1β, NLRP3, iNOS,
  and COX2 protein expressions after p38 inhibitor treatment in KCs. (H) STAT3 protein
  expression after p38 inhibitor treatment in KCs. In the graph, the data represent
  the means ± SEMs; * p < 0.05 compared with the NC group; # p < 0.05 compared with
  the NC + LPS group; ** and ## indicated p-value < 0.01, *** and ### indicated p-value
  < 0.001; and n = 3'
