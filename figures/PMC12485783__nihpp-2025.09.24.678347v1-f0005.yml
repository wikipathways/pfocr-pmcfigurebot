figure_title: HDM Exposure Alters Signaling Pathways in Tumors and Normal Adjacent
  Lung Tissues
caption: Pathway enrichment analysis of DEGs identified in tumor and normal adjacent
  lung tissues based on KEGG, Reactome, and MouseCyc pathway databases. The dot plots
  display curated pathways that are either A) upregulated or B) downregulated in normal
  lung tissues or tumors following HDM exposure compared to VEH. C) Common pathways
  modulated by HDM in both normal lung tissues and tumors. Dot size represents the
  number of DEGs associated with each pathway, while dot color indicates statistical
  significance (q-value, calculated using the Benjamini-Hochberg false discovery rate)
