figure_title: Upstream regulation of Cdk5 activity in physiological and pathological
  states.
caption: Upstream regulation of Cdk5 activity in physiological and pathological states.
  (A) In physiological settings, Cdk5 activity is transient and tightly controlled.
  Its activity is modulated by phosphorylation (e.g., at Tyr15 by Fyn, though this
  remains debated) and terminated via a negative feedback loop where Cdk5 phosphorylates
  p35, leading to its proteasomal degradation. (B) In pathology, this regulation is
  bypassed, leading to chronic hyperactivation. In cancer, oncogenic signaling can
  drive p35 overexpression. In neurodegeneration, neurotoxic insults trigger calpain-mediated
  cleavage of p35 into the hyperstable p25 fragment. Both pathways result in sustained,
  aberrant Cdk5 activity
article_title: 'The Duality of Cdk5: A Master Regulator in Neurodevelopment and a
