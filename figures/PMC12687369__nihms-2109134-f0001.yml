figure_title: C9-NRE i3Neurons display aberrant levels of synaptic transcripts
caption: (A) Schematic of the metrics from multi-electrode array recordings. (B) There
  are no differences in the weighted mean firing rate of Control and C9-NRE i3Neurons
  at DIV 25. Network Burst Frequency measured in Hertz (Hz) over the time of the recording
  shows a nearly significant increase in C9-NRE i3Neurons. The total number of Network
  Bursts is trending upward in the C9-NRE i3Neurons. Synchrony of C9-NRE i3Neurons,
  as plotted by the Synchrony Index, shows a nearly significant increase compared
  to Controls. For each experiment, n = 3 biological replicates, m = 4–9 MEA plates,
  o = 4–6 wells per plate. Each biological replicate is indicated by a unique shape.
  Replicates on each plate were collapsed. Unpaired t-tests were performed to determine
  significance. Error bars represent the SEM. (C) Volcano plot of differentially expressed
  genes (DEGs) in the comparison between untreated Control i3Neurons and untreated
  C9-NRE i3Neurons. For each experiment n = 3 biological replicates, m = 2 technical
  replicates. (D) Enriched Gene Ontology (GO) terms and KEGG pathways for genes upregulated
  in C9-NRE and Controls are plotted. The log2 fold change of synaptic genes identified
  to be upregulated in C9-NRE i3Neurons is plotted. Predicted regulators of DEGs in
  Control i3Neurons are plotted. (E) Selected synaptic genes upregulated in C9-NRE
  i3Neurons compared to Control i3Neurons with known NPAS4-regulated genes denoted
  by an asterisk (*). (F) Predicted transcription factor activity is based on differentially
  expressed genes downregulated in C9-NRE i3Neuron
