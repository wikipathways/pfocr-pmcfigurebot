figure_title: TrkA inhibitor GW441756 could affect ZNF662-NGF axis in TNBC cells.
caption: 'TrkA inhibitor GW441756 could affect ZNF662-NGF axis in TNBC cells. (A)
  Effect of GW441756 on MB231 and YCCB1 cell proliferation was determined by CCK-8
  assay. (B) Effect of GW441756 on MB231 and YCCB1 cell migration and invasion was
  determined by Transwell assay. (C) Effect of GW441756 on downstream signaling pathways
  was examined by Western blot. GW441756 was purchased from MCE (HY-18314, Shanghai,
  China) and used at a concentration of 1 μM. p-value was assessed by Student''s t-test.
  Scale bars: 100 μm. All data are presented as the mean ± SD. SD, standard deviation.
  *p < 0.05, **p < 0.01, ***p < 0.001'
