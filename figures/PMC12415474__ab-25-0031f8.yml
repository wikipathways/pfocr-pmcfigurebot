figure_title: Effects of Lactobacillus rhamnosus GR-1on the expression of mitochondrial-mediated
  apoptosis pathway protein in Escherichia coli-treated BENDs.
caption: Effects of Lactobacillus rhamnosus GR-1on the expression of mitochondrial-mediated
  apoptosis pathway protein in Escherichia coli-treated BENDs. BENDs (90%–100%) were
  treated with L. rhamnosus GR-1 (5×106 CFU/mL), E. coli (5×105 CFU/mL) alone or a
  combination of L. rhamnosus GR-1 (5×106 CFU/mL), E. coli (5×105 CFU/mL) for 9 h.
  (A) Bcl-2, Bax, Caspase-3 and Cyt-c and β-actin (internal control) protein levels
  were detected using Western blot. (B) Quantification of Bcl-2 expression of three
  independent experiments and normalized to β-actin and represented in the bar graph.
  (C) Quantification of Bax expression of three independent experiments and normalized
  to β-actin and represented in the bar graph. (D) Quantification of Caspase-3 expression
  of three independent experiments and normalized to β-actin and represented in the
  bar graph. (E) Quantification of Cyt-c expression of three independent experiments
  and normalized to β-actin and represented in the bar graph. Data represented are
  means±standard errors of means (SEMs) from triplicate experiments. a,b If the same
  letter appears on the bars, the difference is not significant (p>0.05). If there
  is no common letter among the bars, the difference is significant (p<0.05). BENDs,
  bovine endometrial epithelial cells
