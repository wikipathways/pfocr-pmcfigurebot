figure_title: Tuft cell hyperplasia and cecal butyrate level changes in response to
  “unrepaired” gut luminal ecosystem
caption: A. Quantification of tuft cell density across different intestinal regions
  (duodenum, jejunum, and ileum) based on whole-slide scanned images of DCLK1-immunostained
  sections. Data are presented as whisker box plots for each donor and intestinal
  segment. *, P < 0.05 (Mann-Whitney U test). B. Lollipop plot illustrating the normalized
  enrichment score (NES) for mcSEED metabolic pathways with significantly altered
  expression from microbial RNA-seq data, as identified from GSEA. The length of each
  lollipop represents the NES, the color indicates the arm (unrepaired” or repaired)
  in which the pathway is enriched, and the size of the dots reflects the level of
  statistical significance of the enrichment (adjusted P-value). C. Cecal butyrate
  levels (μmol/g cecal contents). D. Fecal butyrate levels (μmol/g feces) in samples
  obtained from donor 1 and donor 2 prior to MDCF-2 treatment (unrepaired) and at
  the conclusion of the 3-month intervention (repaired)
