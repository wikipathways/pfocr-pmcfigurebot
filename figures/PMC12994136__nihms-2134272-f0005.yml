figure_title: Estrogen increases SCFA detection in L-cells and engages a potent gut
  pain pathway
caption: '(A) evMAR responses (left) and total spikes (right) in OVX females under
  four conditions: baseline, PYY1–36 (30 nM) treatment only, alosetron (ALS) treatment
  only (10 μM), and PYY1–36 + ALS. n = 9 to 10 afferents. Two-way repeated measures
  ANOVA followed by Bonferroni multiple comparisons test (left) and one-way ANOVA
  followed by Tukey’s multiple comparisons test (right). **P < 0.01, ***P < 0.001,
  ****P < 0.0001; n.s., not significant. (B) VMR responses and total AUC in OVX controls
  at baseline or treated with EB (1 μg per mouse) or EB + ALS (0.1 mg/kg). n = 5 to
  7 mice. Two-way repeated measures ANOVA followed by Šidák’s multiple comparisons
  test (left), and one-tailed, paired t-test (right). *P < 0.05, **P < 0.01, ****P
  < 0.0001. (C) Volcano plot showing changes in mRNA expression profile of L cells
  in response to 4 hours of EB treatment, upregulated genes (red), downregulated genes
  (blue). (D) Quantification of percent of cells coexpressing Pyy and Olfr78 in distal
  colons of OVX mice treated with vehicle (Veh) or estradiol benzoate [(EB), 1 μg
  per mouse]. n = 3 mice per group. Nested unpaired two-tailed t-test. ***P < 0.001.
  (E) Representative images of distal colons showing Olfr78 receptor expression in
  L cells from OVX mice treated with vehicle or EB. Cells expressing primarily Pyy
  (yellow arrowheads), solely Olfr78 (red arrowheads), and overlapping Pyy/Olfr78
  (white arrowheads). Scale bars, 100 μm. (F) Normalized fluorescent responses from
  L cells expressing GCaMP5g at baseline (10 mM NaCl), and after application of acetate
  (10 mM), and high KCl in colonoids derived from PyyCre;Polr2a(GCaMP5g-IRES-tdTomato)
  female mice preincubated with vehicle or estradiol (E2, 100 nM) for 6 hours. n =
  16 to 19 cells. Bar graphs for matched pairs of cells before and after treatment.
  Two-way ANOVA, mixed effects analyses. *P < 0.05, ***P < 0.001, ****P < 0.0001;
  n.s., not significant. (G) Estrogen initiates paracrine signaling between L and
  EC cells in the female colonic epithelium, affecting visceral sensitivity. Estradiol
  acting through ERa in L-cells upregulates Olfr78 expression, increasing its response
  to bacterial acetate produced from fermentable oligosaccharides (FOS) and leading
  to PYY1–36 release (32). PYY1–36 then acts on NPY1R in EC cells, resulting in activation
  of 5-HT3R-expressing sensory nerve fibers to transduce pain information to the central
  nervous system. Data are presented as mean ± SEM. VMRs were normalized to maximal
  responses to OVX females (B). The model in (G) was partially rendered using BioRender.com'
