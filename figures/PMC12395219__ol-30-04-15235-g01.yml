figure_title: Isoimperatorin treatment affects gene expression profiles in AML cells.
caption: Isoimperatorin treatment affects gene expression profiles in AML cells. (A)
  Principal component analysis was performed to show inter-group differences and intra-group
  consistency. (B) Two-way cluster analysis of DEGs between isoimperatorin-treated
  and untreated THP-1 cells was performed using the pheatmap package. (C) Volcano
  plot indicating DEGs between isoimperatorin-treated and untreated THP-1 cells. (D)
  Scatter plot of the top 20 most significantly enriched GO terms (biological processes,
  cellular components and molecular functions) for DEGs in THP-1 cells after treatment
  with 12.5 µM isoimperatorin for 24 h. (E) Scatter plot of the top 20 most significantly
  enriched KEGG signaling pathways obtained from the RNA sequencing data of THP-1
  cells after treatment with 12.5 µM isoimperatorin for 24 h. The degree of enrichment
  was indicated by the rich factor, FDR and number of genes. AML, acute myeloid leukemia;
  DEGs, differentially expressed genes; THP-1, Tohoku Hospital Pediatrics-1; GO, Gene
  Ontology; KEGG, Kyoto Encyclopedia of Genes and Genomes; FDR, false discovery rate;
  C represents the control; T represents THP-1 cells treated
