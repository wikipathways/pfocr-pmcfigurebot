figure_title: Emergence and diversification of salicylic acid (SA) as a hormone module.
caption: Emergence and diversification of salicylic acid (SA) as a hormone module.
  The figure maps the emergence of SA via the phenylpropanoid pathway, from trans-cinnamic
  acid (t-CA) through benzoic acid (BA), highlighting its ancestral link to stress
  defense and its subsequent regulatory specialization. The evolution of multiple
  SA receptors and biosynthetic routes reflects its dual role in biotic and abiotic
  stress adaptation
