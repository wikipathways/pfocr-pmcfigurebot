figure_title: Pathway analysis of amino acid profiles in follicular fluid from EM
  and control patients.
caption: Pathway analysis of amino acid profiles in follicular fluid from EM and control
  patients. Glycine, serine, and threonine metabolism was the most significantly altered
  pathway (p = 0.047, PI = 0.47). Other notable pathways with high significance or
  impact included the one-carbon pool by folate, lipoic acid, porphyrin, glutathione,
  beta-alanine, sphingolipid, and cysteine and methionine metabolism. In the figure,
  the color intensity (from yellow to red) and the size of the dots indicate pathway
  significance, with deeper red and larger dots representing more statistically significant
  pathways
