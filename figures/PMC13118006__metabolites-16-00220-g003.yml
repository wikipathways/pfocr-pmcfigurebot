figure_title: Sterol auxotrophy drives divergent cholesterol-regulatory strategies
  in mammals and Drosophila.
caption: 'Sterol auxotrophy drives divergent cholesterol-regulatory strategies in
  mammals and Drosophila. Mammals regulate cholesterol through an internally buffered
  network involving de novo synthesis, dietary input, systemic transport, intracellular
  trafficking, and sterol-responsive control. In mammals, circulating low-density
  lipoprotein (LDL) is internalized through low-density lipoprotein receptor (LDLR)-mediated
  uptake and trafficked to lysosomes, thereby contributing to the functional cholesterol
  pool. Cholesterol can also be exchanged through high-density lipoprotein (HDL) and
  scavenger receptor class B member 1 (SR-BI), esterified by acyl-CoA: cholesterol
  acyltransferase 1/2 (ACAT1/2; also known as sterol O-Acyltransferase 1/2, SOAT1/2)
  for storage, or exported through ATP-binding cassette subfamily G member 5 and member
  8 (ABCG5/ABCG8) for biliary or intestinal excretion. Sterol-responsive regulation
  is further coordinated by sterol regulatory element-binding protein 2 (SREBP2),
  SREBP cleavage-activating protein (SCAP), and insulin-induced gene proteins (INSIG)
  within the mevalonate pathway. In contrast, D. melanogaster lacks de novo cholesterol
  synthesis and depends entirely on dietary sterols. In insects, sterol homeostasis
  is therefore organized around external acquisition, lipophorin (Lpp)-mediated systemic
  delivery, Niemann–Pick type C1a (Npc1a)/Niemann–Pick type C2 (NPC2)-dependent intracellular
  mobilization, Niemann–Pick type C1b (Npc1b)-mediated gut sterol acquisition, and
  Drosophila hormone receptor 96 (DHR96)-dependent transcriptional regulation, which
  together connect environmental sterol supply to organismal physiological outputs'
