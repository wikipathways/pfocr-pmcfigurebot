figure_title: Schematic representation of the pathway by which drug-loaded nanoparticles,
  equipped with targeting vectors, exert their effects on cardiomyocytes, illustrating
  the concept of drug delivery specificity described in this review.
caption: Schematic representation of the pathway by which drug-loaded nanoparticles,
  equipped with targeting vectors, exert their effects on cardiomyocytes, illustrating
  the concept of drug delivery specificity described in this review. Primarily, vector-functionalized
  nanoparticles cross the capillary endothelium via receptor-mediated transcytosis
  along the transcellular route. Subsequently, these nanoparticles enter cardiomyocytes
  through receptor-mediated endocytosis and release their cargo following endosomal
  escape. The released drugs then exert their biological activity. During myocardial
  infarction (MI) and chronic heart failure (CHF), disruption of tight junctions allows
  moderately sized nanoparticles to penetrate the capillary endothelium via the paracellular
  route. Additionally, drugs released into the cardiac interstitium may enter cardiomyocytes
  by passive diffusion. Red circles indicate drugs; light blue and green circles represent
  vectors; blue and orange ellipses indicate receptors
