figure_title: Diverse cellular stress responses and homeostatic regulatory programs
  mediated by FOXO transcription factors.
caption: Diverse cellular stress responses and homeostatic regulatory programs mediated
  by FOXO transcription factors. FOXO transcription factors have been shown, through
  studies using a variety of cellular models, to integratively regulate multiple cellular
  programs involved in stress resistance and the maintenance of cellular homeostasis.
  FOXO promotes antioxidant defense through the regulation of genes such as SOD2,
  CAT, GPX1, and PRDX3, while inducing cell cycle arrest by modulating Cyclin D, CDK4,
  CDKN1A (p21), and CDKN1B (p27). In addition, FOXO supports DNA repair via GADD45
  and regulates cell death signaling through the transcriptional activation of apoptosis-related
  genes, including BIM, FASL, TRAIL, and PUMA. Furthermore, FOXO controls autophagy
  through BNIP3, LC3 (MAP1LC3), and members of the ATG family, and also participates
  in the activation of stress response pathways, including the induction of HSP and
  SESN. Through these integrated and comprehensive networks, FOXO functions as a central
  hub that coordinates oxidative stress responses, cell cycle control, survival–death
  decision-making, and the maintenance of proteostasis. We note that the cells depicted
  in “Cell Differentiation” and “Apoptosis,” the autophagy diagram, the DNA in “DNA
  Repair” and “Stress Response” in Figure 1, and the SASP diagrams in Figure 2, Figure
  3, and Figure 7 are similar to those in our previous publication [10]
