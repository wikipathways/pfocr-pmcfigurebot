figure_title: This figure summarizes the genomic context, functional annotation and
  effect sizes of regions uniquely identified by ReMeDy.
caption: This figure summarizes the genomic context, functional annotation and effect
  sizes of regions uniquely identified by ReMeDy. Panel A shows GO biological process
  enrichment derived from region-based analysis using goregion()88, where genomic
  regions were directly used to identify enriched functional terms; point size indicates
  the number of genes associated with each term and the x-axis shows −log10(p – values).
  Panel B shows the distribution of these regions relative to CpG islands, including
  islands, shores, shelves and open sea regions. Panel C shows the genic annotation
  of CpGs within these regions, categorized by promoters, regions 1–5 kb upstream
  of transcription start sites, exons, introns, untranslated regions and intergenic
  regions. Panel D shows the log2FC of the top 10 regions ranked by effect size, with
  positive and negative values indicating upregulated and downregulated regions, respectively.
  Panel E shows GO biological process enrichment based on genes associated with ReMeDy-specific
  regions, obtained using genelevel enrichment analysis (enrichGO89), with bar lengths
  representing the number of genes contributing to each pathway
