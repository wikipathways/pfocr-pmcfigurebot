figure_title: GC-MS profiles of the oxylipins (Me/TMS) observed after preincubating
  F.
caption: 'GC-MS profiles of the oxylipins (Me/TMS) observed after preincubating F.
  distichus thalli homogenate with a mixture of exogenous linoleic and α-linolenic
  acids. (A), TIC chromatogram. (B), Superimposed SIC chromatograms of the selected
  ion currents at m/z 171 (black), m/z 173 (pink), m/z 259 (blue), and m/z 131 (green).
  The structural formulae of products are present in the Figure 2: 2, α-ketol 12-oxo-13-hydroxy-9,15-octadecadienoic
  acid; 4, plasmodiophorol A; 7, α-ketol 12-oxo-13-hydroxy-9-octadecenoic acid. Compound
  7 (Me/TMS) was not endogenously detected. Its mass spectrum exhibited M+ at m/z
  398 (0.1%), [M − Me]+ at m/z 383 (2%), [M − C12/C18 + TMS]+ at m/z 270 (12%), [M
  − C1/C12]+ at m/z 173 (100%), m/z 159 (3%), m/z 129 (2%), [Me3Si–O+=CH2] at m/z
  103 (32%), m/z 83 (27%), m/z 75 (12%), and [SiMe3]+ at m/z 73 (58%). The spectrum
  matched that of α-ketol, 12-oxo-13-hydroxy-9-octadecenoic acid (Me/TMS), an AOS
  product derived from the 13(S)-hydroperoxide of linoleic acid (13-HPOD) via the
  short-lived allene oxide [30]. The NaBH4 reduction in compound 7, followed by methylation
  and trimethylsilylation, resulted in vic-diol 3 (Me/TMS), which was composed of
  threo and erythro isomers in a ca. 2:1 ratio. This result supported the identification
  of compound 7 as an α-ketol. The NaBH4 reduction in compound 7, followed by catalytic
  hydrogenation, methylation, and trimethylsilylation, resulted in vic-diol 12,13-dihydroxystearic
  acid (Me/TMS). Overall, the data obtained showed that compound 7 is the α-ketol,
  12-oxo-13-hydroxy-9-octadecenoic acid. Thus, products 2 and 7 were α-ketols biosynthesized
  through the AOS pathway from 13-HPOT and 13-HPOD, respectively'
