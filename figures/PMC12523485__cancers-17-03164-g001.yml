figure_title: Activation levels of the Hh pathway in different cell subsets within
  the gastric cancer tumor microenvironment.
caption: Activation levels of the Hh pathway in different cell subsets within the
  gastric cancer tumor microenvironment. (A) UMAP shows the distribution of seven
  cell types in the GSE163558 dataset. (B) Marker genes of each cell type. (C) Heatmap
  presenting the activation levels of the Hh gene set in the seven cell subsets based
  on three enrichment analysis methods (UCell, AddModuleScore, and Aucell). (D) UMAP
  shows the distribution of three subsets of fibroblasts after secondary clustering.
  (E) Heatmap presenting the activation levels of the Hh gene set in the three fibroblast
  subsets based on three enrichment analysis methods (UCell, AddModuleScore, and Aucell).
  (F) UMAP shows the activation level of the Hh gene set in fibroblasts. (G) UMAP
  shows the activation status of the Hh pathway in fibroblast populations from samples
  at different lesion stages (carcinoma in situ, paracancerous tissues, and metastatic
  tumors). (H) UMAP shows the subset distribution of fibroblasts from samples at different
  lesion stages (carcinoma in situ, paracancerous tissues, and metastatic tumors)
  in the GSE183904 dataset after secondary dimensionality reduction and clustering.
  (I) UMAP shows the activation status of the Hh gene set in fibroblast populations
  from samples at different lesion stages in the GSE183904 dataset. (J) UMAP shows
  the activation status of the top 50 differentially expressed genes in the MMP1 +
  FIB subset among fibroblast populations from samples at different lesion stages
  in the GSE183904 dataset. CA, gastric cancer; N, normal gastric tissue; M, metastatic
  tumor
