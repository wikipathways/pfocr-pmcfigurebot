figure_title: Molecular immunomodulatory mechanism of Coriolus versicolor (CV) bioactive
  compounds in the tumor microenvironment.
caption: Molecular immunomodulatory mechanism of Coriolus versicolor (CV) bioactive
  compounds in the tumor microenvironment. CV-derived protein-bound polysaccharides
  (PSK, PSP, PBP) modulate immune responses by inhibiting TLR4/NF-κB signaling, reducing
  pro-inflammatory cytokines (IL-6, IL-8), and suppressing angiogenesis and metastasis
  via downregulation of VEGF, MCP-1, and MMP-9. CV promotes apoptosis in cancer cells
  through the p38 MAPK pathway and enhances M1 macrophage polarization (↑TNF-α, IL-6,
  iNOS), while inhibiting M2 phenotype markers (↓IL-10, TGF-β, Arg-1). Additionally,
  it stimulates adaptive immunity by increasing IL-2, IL-12, IFN-γ, and the activity
  of CD8+ T cells, B cells, and NK cells, collectively reshaping the tumor microenvironment
  toward antitumor immunity
