figure_title: Integration of bulk transcriptome and single-cell multiome data highlight
  subclusters of exTh17 cells whose signature is found in RA synovium
caption: (A) Venn diagram showing different intersections of differential upregulated
  genes from bulk RNA-seq after pairwise analysis of joint Th17 cells (Joint_exTh17)
  vs joint exTh17 cells (Joint_exTh17) and Joint_exTh17 vs lymph node Th17 cells (LN_Th17).
  Intersection A and B in total include 214 genes upregulated in the Joint_exTh17samples.
  Each group (Joint_exTh17, Joint_Th17 and LN_Th17) represents a sorted population
  from female arthritic Rag2-KO-CD4 mice with a N=4 replicates per group (each replicate
  representing a pool of 7–8 arthritic mice).(B) Heatmaps of relevant genes from the
  214 upregulated genes in Joint_exTh17.(C) Pathway analysis on 214 upregulated genes
  in Joint_exTh17 vs Joint_Th17.(D) Network layout from the entire set of 214 upregulated
  genes in Joint_exTh17 vs Joint_Th17 visualized using Cytoscape with “force-directed”
  layout and with edge bundled for clarity. Sub-pathways of each network are represented
  by circle nodes. The size of each circle is proportional to the number of genes
  within a pathway. Nodes with same color belong to the same main pathway from panel
  C. The network analysis shows the genes that are found highly expressed and involved
  in interactions between pathways.(E) UMAP plot on data from 10x Multiome experiment
  performed on sorted exTh17 cells from arthritic joints of Rag2-KO-CD4 mice. Clusters
  were obtained using the weighted nearest neighbor (WNN) analysis in Seurat that
  utilizes both the RNA-seq and the ATAC-seq component for each cell. Clusters 8 and
  9 with less than 100 cells were removed from downstream analysis.(F) Feature plots
  showing single-cell level expression of selected genes among 214 that were identified
  as upregulated in Joint_exTh17 vs Joint_Th17 from bulk RNA-seq data.(G) UMAP visualization,
  clustering and dot plots for selected genes of T cells from Wu et al. 2022 (PRJNA725073
  – left panel – Human data 1 [Hu1]) (52) and human RA synovium CD4+ T cells extracted
  from a single-center cohort (right panel – Human data 2 [Hu2], GEO Accession ID
  GSE303539). ~1800 and 3400 different CD4+ T cells were computationally extracted
  (more details in Fig. S5C), respectively from each study.(H) Feature plots showing
  expression of selected genes using UMAP visualizations of scRNA-seq data for Hu1
  and Hu2.(I) Feature plots showing expression of exTh17 cell signature genes CD44
  and S1PR4 using UMAP visualizations of scRNA-seq data for Accelerating Medicines
  Partnership (AMP) cohort(53)
