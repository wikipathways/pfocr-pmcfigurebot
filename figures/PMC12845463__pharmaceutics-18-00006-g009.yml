figure_title: Schematic diagram of nerve–cancer crosstalk blocking strategy induced
  by LAD for metastatic bone cancer pain treatment.
caption: Schematic diagram of nerve–cancer crosstalk blocking strategy induced by
  LAD for metastatic bone cancer pain treatment. (i) LAD consumed the excessive H+
  to inhibit the activation of H+-sensitive channels, thus decreasing the excitation
  of sensory nerves. (ii) AZ-23 was released from the degraded LAD that blocked the
  NGF/TrkA pathway to avoid neurogenesis and subsequent pain sensitization. (iii)
  Suppressing neuroexcitation and neurogenesis prevented pain formation, resulting
  in pain relief. (iv) As positive feedback of pain relief, the Ca2+ concentration
  was downregulated, (v) further restraining the Ca2+-crosstalk-induced cancerous
  cell cycle change, and finally inhibiting the tumor proliferation. Reproduced with
  permission from reference. Advanced materials (Deerfield Beach, Fla.) vol. 34,17
  (2022) [233]. Creative Commons Attribution 4.0 International License. Copyright
