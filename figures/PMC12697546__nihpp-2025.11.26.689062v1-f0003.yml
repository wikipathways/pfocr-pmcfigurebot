figure_title: Isoform-level transcriptomic changes with retinal organoid differentiation
caption: A) Histogram showing the number of isoforms detected per gene for each organoid
  sample. Line indicates overall mean across all organoid samples. B) Number of significant
  isoform switches (|dIF| >= 0.1 & qval < 0.05) occurring at different stages of organoid
  differentiation. C) Number of genes with significant isoform switches. D-F) Volcano
  plots highlighting differentially used transcripts between D) Stage 1 and Stage
  2, E) Stage 1 and Stage 3, and F) Stage 2 and Stage 3 retinal organoids. Dashed
  lines indicate significance cut-offs used for DTU analysis. G-I) GO pathway analysis
  showing enriched biological processes for genes with significant isoform switches.
  Heatmap indicates adjusted p-value for enrichment, and dot size represents the number
  of significant genes found within each GO term. J-K) Upset plots showing the number
  of shared J) genes with significant isoform switches and K) differentially used
  isoforms between comparisons. L) Types and enrichment of alternative splicing events
  found in genes with significant isoform switches. Dot size indicates the number
  of significant switches. Red = significant skew of an alternative splicing event
  (qval < 0.05)
