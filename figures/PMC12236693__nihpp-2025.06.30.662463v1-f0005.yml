figure_title: Coarse-grained SNARE fusogens generate entropic forces that drive membrane
  fusion along the same pathway as that for model rod-like fusogens.
caption: 'Coarse-grained SNARE fusogens generate entropic forces that drive membrane
  fusion along the same pathway as that for model rod-like fusogens. (A) Entropic
  forces (blue arrows) push seven SNAREs outwards into a ring, squeeze vesicles into
  a flat interface, nucleate a stalk at the interface edge, expand the stalk into
  a HD, and rupture the HD for fusion (see also Fig. S7A). (B) Top: Fusion is catalyzed
  by local membrane thinning (green arrows) by TMDs with staple beads (black arrows).
  Bottom: Thinning is abolished with mutants having neutral staples. No hemifusion
  or fusion occurred in ~ 40 ms simulation. (C) Total pre-hemifusion squeezing force
  and pressure versus number of SNAREs (n = 10 simulations for each value). (D) Mean
  radial entropic force per SNARE during unhemifused and stalk phases (n = 10 simulations,
  seven SNAREs). (E) Mean first hemifusion and fusion times versus number of SNAREs.
  (F) Cumulative waiting time distributions for (E) (n = 30 simulations per distribution).
  (G) Mean number of reversible stalks during ~ 2 ms of simulation versus number of
  SNAREs (n = 30 simulations per value). (H) Mean irreversible hemifusion-to-fusion
  time versus number of SNAREs (among ~ 2ms simulations where fusion occurred). (I)
  Fusion time distribution for seven SNAREs (see Fig. S9). Error bars: SEM for (E),
  (H); SD for (C), (G). Shaded regions in (F): 95% confidence intervals. SDs in (D):
  31.3 pN (unhemifused), 35.1 pN (stalk)'
