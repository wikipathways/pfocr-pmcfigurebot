caption: 'Integrated heat map and interaction network analysis of radiation-responsive
  transcriptional programs in irradiated human dermal fibroblasts: (a) Heat map summarizing
  relative gene expression changes across all experimental conditions and timepoints
  (24 h, 3 d, and 5 d post-irradiation). Expression values represent mean log2-transformed
  relative quantification (RQ) normalized to GAPDH and scaled per gene to highlight
  temporal and treatment-associated expression patterns. (b) Functional interaction
  network constructed using the ReactomeFI plugin in Cytoscape based on genes included
  in the qPCR panel. Nodes represent individual genes (black text = genes in qPCR
  panel; red text = linker genes not in qPCR panel). Edges indicate curated functional
  interactions derived from Reactome pathway knowledge (solid edges = direct or well-established
  interactions; dashed edges = predicted interactions)'
