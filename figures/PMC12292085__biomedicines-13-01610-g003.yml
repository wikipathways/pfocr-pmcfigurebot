figure_title: Mechanism of action of GLP-1 in skeletal muscle.
caption: Mechanism of action of GLP-1 in skeletal muscle. GLP-1/GLP-1RA binds to GLP-1R
  coupled to G-αs and exerts physiological effects through both AKT/PI3K and cAMP/PKA/AMPK-α
  signaling pathways. Increased AKT/PI3K signaling primarily increases glycogen synthesis
  by inhibiting GSK3 and increasing GLUT4 vesicle translocation to the cell membrane
  by phosphorylation of TBC1D4. The AKT/PI3K pathway is disrupted in T2DM and may
  partially explain decreased effects of GLP-1RA in T2DM. Increased cAMP/PKA/AMPK-α
  signaling increases GLUT4 gene expression through GEF phosphorylation and directly
  inhibits glycogen synthase-alpha. However, increased GLUT4 expression increases
  intracellular glucose uptake and glucose-6-phosphate production, a positive allosteric
  modulator of glycogen synthase-alpha, where current research suggests this effect
  leads to a net increase in glycogen synthase-alpha activity and subsequent glycogen
  synthesis through AMPK-α signaling. Created in biorender.com
