figure_title: Effects of reduced temperature (Section 5.
caption: 'Effects of reduced temperature (Section 5.4) and chemical treatments (Section
  6.1) on UPR activation. The UPR pathways are the same as shown in Figure 1. The
  PERK pathway is indicated in red, the IRE1 pathway is indicated in green, and the
  ATF6 pathway is indicated in blue. Activation of a UPR biomarker is indicated by
  a green arrow. Inhibition of a UPR biomarker is indicated by a blocked red line.
  The effects of temperature downshift are indicated as TDS. The effects of chemical
  treatments are shown using their respective abbreviations, which are as follows:
  3-methyladenine (3-MA); baicalein (BAI); beta alanine (BALA); beta cyclodextrin
  (BCD); betaine (BET); BIP inducer X (BIX); thapsigargin (Tg); tunicamycin (Tm);
  valproic acid (VPA); yeast extract (YEX); copper sulfate (CuSO4); spermidine (SPD);
  trehalose (TREH); linoleic acid (LA); conjugated linoleic acid (CLA); mannose (MAN);
  cottonseed hydrolysate (CSH); maltose (MAL); maltodextrin (MD), sucrose (SUC); proteasome
  inhibitor MG132 (MG132); taurine (TAU), dimethyl sulfoxide (DMSO); hydrogen peroxide
  (H2O2); sodium butyrate (NaBu); cell cycle inhibitor (CCI); and rosmarinic acid
  (RA). * The use of TDS causes increases in HERPUD1 for rh-tPA [90] and decreases
  in HERPUD1 for EPO-Fc [92]. ** Sulaj et al. report downregulation of BIP and PDIA4
  in response to Tm [56]. Figure created with BioRender.com'
