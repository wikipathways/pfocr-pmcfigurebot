figure_title: Lipoprotein delivery of α-toc promotes cancer cell resistance to ferroptosis
caption: 'a. Schematic of focused CRISPR screen in HeLa cells under lipoprotein-depleted
  or -repleted conditions.b. Gene essentiality graph showing changes based on lipoprotein
  availability.c. Rank of genes by change in essentiality; anti-ferroptotic genes
  are highlighted (left). Diagram of the glutathione peroxidase pathway inhibiting
  lipid peroxidation (right).d. Proliferation (log2 doublings, 5 days) of GPX4_KO
  HeLa cells treated with PBS, cholesterol (5 μg/mL), LDL, HDL, or Fer-1 (1 μM).e.
  Heatmap of proliferation (log2 doublings, 5 days) of GPX4/Gpx4_KO cell lines treated
  with PBS, LDL, HDL, or Fer-1 (1 μM).f. Heatmap of proliferation (log2 doublings,
  5 days) in response to ML162 (GPX4 inhibitor) with or without LDL or HDL.g. Representative
  co-autoxidation of STY-BODIPY (1 μM) and liposomal egg phosphatidylcholine-cholesterol,
  initiated by DTUN (0.2 mM), and inhibited by LDL, HDL, reconstituted HDL with Tristearin
  (rHDL-TG(18:0)₃), or PMC (4 μM).h. Rank of significantly altered lipid metabolites
  (detected in positive mode) in B16 cells treated with HDL versus LDL.i. Relative
  peak area for α-toc in B16 cells under depletion or treatment with LDL or HDL.j.
  Schematic depicting dietary depletion of α-toc to evaluate its role in driving tumour
  growth in mice.k. Plasma α-toc levels after 4 weeks on vitamin E-sufficient (100
  IU/kg) or -deficient (7 IU/kg) diets.l. Tumour weights from mice implanted with
  Karpas299, HeLa, or B16 cells under control or low vitamin E diets.For all LDL and
  HDL experiments, 50 μg/mL was used. d, i: Bars represent mean ± s.d.; l, k: Boxes
  represent median, first/third quartiles; whiskers are range. d-f: n=3; h-i: n=5;
  k: n=7; l: n= 12, 12, 9 (respectively). Statistics by two-sided unpaired t-test
  (d, i, k, l) or one-way ANOVA with Kruskal–Wallis post-test (h)'
