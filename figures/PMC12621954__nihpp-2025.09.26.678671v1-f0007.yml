figure_title: IRF2 regulates expression of antimicrobial mediators.
caption: IRF2 regulates expression of antimicrobial mediators. (A-D) Double knockout
  CIMs (transduced with guides for Irf2 or scramble and Irf9 or scramble) were infected
  with WT Lm. Two hours post infection total RNA was collected and used for RNAseq
  analysis. Data are from three independent experiments. (A) Displayed are the average
  log2 fold change, relative to scramble, of genes with differential expression in
  at least one knockout macrophage line. Genes are clustered based on fold change
  in different knockout macrophage lines. (B) Pathway enrichment of gene clusters.
  (C-D) Heat map of (C) GBP family or (D) Il21r and Il2rg gene expression in knock
  out macrophages relative to scramble. Shown are values from three independent experiments.
  (E) Double knockout CIMs (transduced with guides for Irf2 or scramble and Il21r
  or scramble) or (F) WT and Irf2 KO BMMs were prestimulated +/− IL-21 before infection
  with TagRFP-Lm. Five hours post infection Lm growth was analyzed by quantifying
  TagRFP area. Data are representative of two (E) or three (F) independent experiments.
  (G) BMMs loaded with fluorescein-dextran were infected with WT Lm or administered
  silicon dioxide microspheres (SMS) for two hours. Fluorescence was measured after
  excitation at 425nm and 488nm and used to determine the area with pH above 5.5.
  Data are representative of two independent experiments. All data are presented as
  mean +/− SD and were statistically analyzed using two-way ANOVA with Sidak’s multiple
  comparisons test. *P < 0.05, **P < 0.01, ***P < 0.001, **** P < 0.0001
article_title: Genome-wide screen in Mycobacterium tuberculosis infected macrophages
  reveals innate regulation of antibacterial mediators by IRF2
