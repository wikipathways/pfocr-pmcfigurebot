caption: |-
  4A–D. STED imaging of a single ommatidium at 40 hAPF stained for Dlg1 and Inx2 (A, B) or Inx2 and Inx3 (C, D). Insets from (A) and (D) show the red-box regions in (B) and (C), respectively. Scale bars: 2 μm (A, D), 0.5 μm (B, C).4E–I. Immunostaining for Inx1, Inx2, Inx3 at 40 hAPF in control (E), inx1-sKO
  (F), inx2-sKO
  (G), inx3-sKO
  (H), and inx1+3-double sKO
  (I). Green marks Innexins, and magenta marks Dlg1. Images are Z-stacks of the apical retinal layer. Scale bar: 5 μm (E–I).4J–N. Retinal calcium wave activity as 3-min temporal activity maps in control (J), inx1-sKO
  (K), inx2-sKO
  (L), inx3-sKO
  (M), inx1+3-DsKO
  (N) during stage 2. Arrows in (L, N) indicate unsynchronized cone and pigment cell firing. Scale bar: 10 μm (J–N). See also Movie 9.4O. Quantification of vertical pathway frequency in inx mutants during stage 2. n ≥ 5 retinas. Error bars: SD. Detailed statistics in Fig. S4Z.4P. Quantification of lateral pathway frequency in inx mutants during stage 2. n ≥ 5 retinas. ns: p ≥ 0.05, **p < 0.01, ***p < 0.001. Error bars: SD.4Q. Quantification of spontaneous cell-autonomous activity by cell type in inx mutants during stage 1. n ≥ 5 retinas. Error bars: SD. Detailed statistics in Fig. S4Z.4R. Diagram illustrating vertical propagation pathway in inx mutants
