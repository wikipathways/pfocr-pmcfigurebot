figure_title: Membrane protein relocalization driven by Ras-induced lipid and electrical
  changes.
caption: 'Membrane protein relocalization driven by Ras-induced lipid and electrical
  changes. Activation of Ras alters membrane potential and lipid microdomain composition,
  disrupting or enabling specific protein–membrane interactions. This figure shows
  how phospholipid-binding proteins such as phosphatidylethanolamine-binding protein
  1 (PEBP1) can translocate from the cytosol to the plasma membrane in response to
  these biophysical changes. Proteins in this class, including Annexin-like molecules,
  may be guided by lipid dynamics and electric gradients, influencing pathways involved
  in mitogenic signaling or suppression. GTP: guanosine triphosphate. Color coding
  of the lipid bilayer: Orange circles represent general phospholipids that form the
  bilayer. Dark blue circles indicate negatively charged phospholipids (e.g., phosphatidylserine),
  light blue circles denote neutral phospholipids (e.g., phosphatidylethanolamine),
  and green circles mark positively charged or zwitterionic lipid interactions critical
  to domain stability and protein targeting. Black arrows within the bilayer indicate
  Ras-driven reorganization and translocation processes'
