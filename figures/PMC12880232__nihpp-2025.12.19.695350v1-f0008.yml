figure_title: Diversion of carbon into purine pools is a defining feature of neurons
  with impaired survival in the high-oxygen glycolytic state
caption: A) Heatmap of the cluster of genes enriched for dendrite membrane components
  from Fig 4 includes MAPT, KIAA1429, and TDRD3. Knockdown of these genes results
  in a common phenotype of poor survival in the high-oxygen glycolytic state (20G),
  while retaining survival in the high oxygen respiratory state (20R). B) Proposed
  mechanism by which knocking down genes that support various steps in late glycolysis
  results in diversion of glucose to upstream glycolytic branch metabolites, including
  nucleotides. C) Bubble plot of enriched metabolic pathways among metabolites with
  increased or decreased 13C-glucose derived labeling in neurons with genetic knockdowns.
  Bubble radius corresponds to pathway impact, which is a measure of the centrality
  of enriched metabolites. In the high-oxygen glycolytic state, knockdown of these
  three functionally similar genes in neuronal cells was associated with increased
  13C-glucose-derived labeling across purine metabolites, compared to neuronal cells
  expressing a non-targeting sgRNA. In contrast, knockdown of GLO1, a gene less related
  gene by hierarchical clustering, did not increase 13C-glucose-derived labeling in
  purine metabolites. D) UDP, AMP, and ADP metabolites specifically are significantly
  increased 13C-glucose-derived labeling associated with knockdown in MAPT, KIAA1429,
  and TDRD3 but not GLO1 in the high-oxygen glycolytic state. E) TCA cycle metabolites
  are among the metabolites that have less 13C-glucose-derived labeling in the high-oxygen
  glycolytic state
