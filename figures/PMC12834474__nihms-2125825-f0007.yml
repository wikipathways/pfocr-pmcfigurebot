figure_title: KIF18A and CENP-E cooperatively function for the congression of peripheral
  chromosomes at early prometaphase
caption: 'In wild-type K562 and RPE-1 cells with KIF18A depletion (middle: +KIF18A
  KD), although KIF18A depletion enhances microtubule dynamics and increases peripheral
  chromosomes, CENP-E downstream of CENP-C compensates for KIF18A depletion, supporting
  chromosome congression and alignment, albeit with a delay in the congression. By
  contrast, in CENP-E-deficient cells (bottom: K562 CENP-CΔM12BD and RPE-1 CENP-CΔM12BD
  cells), KIF18A depletion disrupts chromosome congression due to weakened CENP-E
  activity downstream of CENP-C at kinetochores, leading to mitotic arrest and subsequent
  cell death. Based on these observations, we propose that the CENP-C pathway plays
  a role in chromosome congression, with KIF18A and CENP-E acting cooperatively to
  promote the congression of peripheral chromosomes during early prometaphase in wild-type
  K562 and RPE-1 cells (upper)'
article_title: KIF18A promotes chromosome congression in cooperation with CENP-E downstream
  of CENP-C
