figure_title: Extracellular vesicle biogenesis.
caption: Extracellular vesicle biogenesis. Two main types of EVs are distinguished
  based on their biogenesis. Exosomes (30–150 nm) are generated through the endocytic
  pathway and are released via exocytosis of the multivesicular bodies (MVBs). Late
  endosomes either fuse with lysosomes for degradation or fuse with the plasma membrane
  to release the intraluminal vesicles that are called exosomes. Microvesicles (100–1000
  nm) are released through budding from the plasma membrane. EVs can be internalized
  by recipient cells through endocytosis, receptor-mediated signaling pathways, or
  membrane fusion
