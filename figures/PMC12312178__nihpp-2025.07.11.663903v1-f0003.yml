figure_title: Combined inhibition of CDK4/6 and mTORC1 pathway shows synergy and inhibits
  tumor growth in vivo
caption: '(A) Heatmap highlighting Bliss synergy index values for combination doses
  of palbociclib and RMC-5552 in FUUR1, STFE, UOK109 and UOK146 cell lines, values
  represent average of three independent biological replicates per cell line.(B) TUNEL
  assay for apoptosis in cells pre-treated with 300nM palbociclib for 48 hours followed
  by 15 hours co-treatment with both palbociclib (300nM) and RMC-5552 (200nM) in FUUR1,
  STFE, UOK109 and UOK146 cell lines, data representative of n=3 biological replicates
  per cell line, unpaired t-test p<0.05*, p<0.01**, p<0.001*** between palbociclib
  and palbociclib + RMC-5552 groups.(C) Schematic of dosing strategy for FUUR1 xenografts
  implanted in NOD.Cg-Prkdcscid/J and treated with a combination of palbociclib and
  RMC-5552 for a total period of 8 weeks (56 days) or alternative endpoint.(D) Survival
  curve for individual mice in four arms of the study (starting n per arm: control,
  n= 9; palbociclib, n=8; RMC-5552, n=10; palbociclib + RMC-5552, n=10). Log-rank
  test p<0.05*, p<0.01**, p<0.001***.(E) Tumor volume per arm during xenograft study.
  Individual tumor measurements are shown by dots with mean connected by line. Number
  of mice in each arm evaluated at measurement time points following survival drops
  are indicated in the table (Note, mice sacrificed in between measurement days are
  captured in survival curve in D). ANOVA test p<0.05*, p<0.01**, p<0.001***.(F) Histologic
  images from a representative FUUR1 xenograft tumor in each treatment group (scale
  bars = 200 μm), upper panel, H&E staining; middle panel, Ki67 staining; lower panel,
  cleaved caspase-3.(G) Quantification of Ki67 staining across n=3 tumors per arm,
  unpaired t-test, p<0.05*.(H) Quantification of cleaved caspase-3 staining across
  n=3 tumors for control, RMC-5552, palbociclib + RMC-5552 and n=2 tumors for palbociclib'
