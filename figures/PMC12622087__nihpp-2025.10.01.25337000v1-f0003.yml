figure_title: Microbiome composition and fecal metabolites predict magnitude of response
  to BSS
caption: a, Bar plot depicting relative abundance of top phyla in the microbiome of
  low and high responders. b, ROC curve of top 12 predictive taxa at day 0 for the
  high responder phenotype. c, Top 12 predictive taxa at day 0 for low vs high responders,
  with sulfur cycling taxa highlighted. d, Metabolomics PCA plot at day 0 and day
  2 of low and high responders. e, U-plot of predictive metabolites at day 0 associated
  with day 2 Pseudomonadota counts. Correlations were performed using the Spearman
  method. The dashed grey line indicated a significance threshold of p=0.05. Metabolite
  point color reflected associated pathways. * p < 0.05, ** p < 0.01, n.s. not significant,
  unpaired t test
