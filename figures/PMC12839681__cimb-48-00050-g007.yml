caption: Effects of BRC on melanogenesis-related signaling pathways in IBMX-stimulated
  B16F10 cells. (A) Representative images showing melanin accumulation. (B) Quantification
  of melanin content. (C–F) Levels of cAMP, NO, tyrosinase activity, and glutathione.
  (G) Western blot images showing cAMP/PKA/CREB/MITF/TRPs pathway proteins. (H–L)
  Quantification of phosphorylated PKA, CREB, MITF, TRP-1, and TRP-2 expression levels.
  Data are presented as mean ± SD (n = 3). Different letters indicate significant
  differences (p < 0.05). NC, normal control; C, UVB irradiation; PC, UVB irradiation
  + 100 μg/mL of arbutin; BRC50, UVB irradiation + 50 μg/mL of BRC; BRC100, UVB irradiation
  + 100 μg/mL of BRC; BRC200, UVB irradiation + 200 μg/mL of BRC
