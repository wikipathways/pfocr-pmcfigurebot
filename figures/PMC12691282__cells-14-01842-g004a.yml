figure_title: Specific expression profiles of the immune-associated genes in each
  of 24 scRNA-Seq clusters of naïve controls (‘Naïve’) and immune challenged (‘Challenge’)
  S.
caption: 'Specific expression profiles of the immune-associated genes in each of 24
  scRNA-Seq clusters of naïve controls (‘Naïve’) and immune challenged (‘Challenge’)
  S. exigua larvae. For the immune challenge (‘Challenge’), each L5 larva was injected
  with 1.4 × 105 heat-killed E. coli, while PBS was injected for Naïve. Heatmaps show
  expression patterns (based on FPKM) in naïve or immune challenge with different
  colors: white bar indicates no expression in either naïve or immune-challenged (“Challenge”)
  larvae. The expressed gene IDs are denoted in the corresponding components in the
  diagram. (a) Differential gene expression profiles of signal components associated
  with the Toll-IMD immune pathway and subsequent AMPs [1]: ‘Lyz’ for lysozyme, ‘Cec’
  for cecropin, ‘Att’ for attacin, ‘Mor’ for moricin, and ‘Spo’ for spodoptericin.
  (b) Differential gene expression profiles of synthetic components associated with
  eicosanoid or epoxyoctadecamonoenoic acid (‘EpOME’) biosynthesis [29,35,36]: ‘PL’
  for phospholipid, ‘LA’ for linoleic acid, ‘AA’ for arachidonic acid, ‘EET’ for epoxyeicosatrienoic
  acid, ‘DiHOME’ for dihydroxyoctadecanoic acid, ‘TX’ for thromboxane, ‘PG’ for prostaglandin,
  ‘HpETE’ for hydroperoxyeicosatetraenoic acid, ‘LT’ for leukotriene, ‘Elo/Des’ for
  elongase/desaturase, ‘Pxt’ for peroxinectin, ‘sEH’ for soluble epoxide hydrolase,
  ‘EPX’ for epoxidase, ‘EH’ for epoxide hydrolase, ‘PGDH/PGR’ for prostaglandin dehydrogenase/reductase,
  ‘LOX’ for lipoxygenase, ‘LTA4H’ for LTA4 hydrolase, and ‘Gpx’ for glutathione peroxidase.
  (c) Differential gene expression profiles of PGE2 signal components [37]: ‘R’ for
  PGE2 receptor, ‘Gαs-f’ for trimeric Gα subunits, ‘AC’ for adenylate cyclase, PLC
  for phospholipase C, ‘IP3’ for inositol-1,4,5-triphosphate, ‘IP3R’ for IP3 receptor,
  ‘ER’ for endoplasmic reticulum, ‘RyR’ for ryanodine receptor, ‘AQP’ for aquaporin,
  ‘PKA’ for protein kinase A, and ‘CICR’ for calcium-induced calcium release. (d)
  Differential gene expression profiles of prophenoloxidase (‘PPO’)-activating signal
  components [38]: ‘PO’ for phenoloxidase, ‘PAP’ for PPO-activating protease, ‘SPH’
  for serine protease homolog, and ‘SPN’ for serpin. (e) Differential gene expression
  profiles of apoptosis signal components [13]: ‘MAPK’ for mitogen-activated protein
  kinase, ‘Cyt C’ for cytochrome C oxidase, ‘APAF’ for apoptotic protease-activating
  factor, ‘Cas’ for caspase, and ‘IAP’ for inhibitor of apoptosis'
