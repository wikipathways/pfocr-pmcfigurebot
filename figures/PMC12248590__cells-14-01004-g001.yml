figure_title: Altered glucose metabolism in asthma.
caption: 'Altered glucose metabolism in asthma. (A) Non-targeted metabolomics pathway
  enrichment analysis in asthma patients. (B,C) Level of α-D-glucose (B) and pyruvate
  (C) in the plasma of asthma. (D,E) The correlation between plasma α-D-glucose and
  PD20 FEV1 (D) as well as the proportion of eosinophils in sputum (E). (F–M) RT-PCR
  analysis of the key enzymes expression involved in glucose metabolism: HK2 (F),
  PFKM (G), PKM2 (H), PDHB (I), PDHA1 (J), PDHA2 (K), PDK1 (L), and SLC2A1 (M) in
  PBMCs from asthma patients and healthy controls. Each group included 20–24 samples.
  HC = healthy controls, PBMCs = peripheral blood mononuclear cells, HK2 = hexokinase
  2, PFKM = phosphofructokinase, muscle type, PKM2 = pyruvate kinase M2, PDHB = pyruvate
  dehydrogenase E1 subunit beta, PDHA1 = pyruvate dehydrogenase E1 subunit alpha 1,
  PDHA2 = pyruvate dehydrogenase E1 subunit alpha 2, PDK1 = pyruvate dehydrogenase
  kinase 1, SLC2A1 = solute carrier family 2 member 1. The data were shown as mean
  ± SEM, statistical differences were determined with a student’s t test for comparison
  between the two groups. * p < 0.05, ** p < 0.01, *** p < 0.001, ns = not significant'
