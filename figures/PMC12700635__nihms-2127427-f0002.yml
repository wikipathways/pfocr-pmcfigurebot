caption: Pathway analysis and functional clustering of differentially expressed genes.
  (A) Heatmap of relative expression for significant DEGs in G2 compared to G1 or
  G3. Cluster 1 contains DEGs that were significantly upregulated in G2, and Cluster
  2 contains DEGs that were significantly downregulated in G2. Z scores for each gene
  were computed from log2(FPKM + 1) contained in the respective clusters. (B) Gene
  ontology (GO) terms representing major biological processes characteristic of Clusters
  1 and 2. (C) Heatmap depicting log2FC for selected transcripts distinctively upregulated
  in G2 that are associated with dietary sugar transport/metabolism, fat absorption/transport,
  bile acid absorption, and gut hormones. (D) Heatmap depicting log2FC for selected
  transcripts distinctively downregulated in G2 that loosely group as factors involved
  in innate immune functions
