figure_title: Sox18 silencing promotes endothelial-to-mesenchymal transition (EndMT)
  by activating the PI3K/Akt signaling pathway.
caption: Sox18 silencing promotes endothelial-to-mesenchymal transition (EndMT) by
  activating the PI3K/Akt signaling pathway. (A) KEGG enrichment analysis of the upregulated
  genes in ECs of AngⅡ+HS group vs. Control group, displaying the top 20 enriched
  signaling pathways. (B) Gene set enrichment analysis (GSEA) supported the activation
  of PI3K/Akt signaling pathway in the AngⅡ+HS group. NES, normalized enrichment score.
  (C-D) Protein levels and quantification of p-PI3K (phosphorylated-PI3K), PI3K (phosphoinositide
  3-kinase), p-AKT (phosphorylated-AKT) and AKT (protein kinase B). n = 5. (E) CCK-8
  assay to measure EC viability after treatment with different concentrations of LY294002.
  (F-G) Protein bands and quantification of VE-cadherin, CD31, α-SMA and vimentin
  (n = 5). (H) Immunofluorescence of CD31 (green) and α-SMA (red) in ECs under different
  treatments. The nuclei were stained with DAPI. Scale bar = 50 μm. (I) Transwell
  permeability assay to detect the leak of FITC-dextran across HAEC monolayers. n
  = 6. ns, not significant. *P < 0.05, **P < 0.01, ****P < 0.0001 by one-way ANOVA
  with Tukey's multiple comparisons test (D, E, G, I)
