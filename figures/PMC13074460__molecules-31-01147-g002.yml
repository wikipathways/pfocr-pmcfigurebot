figure_title: The brain–gut–skin trinary loop.
caption: The brain–gut–skin trinary loop. Psychological stress and gut dysbiosis are
  hypothesized to form a self-reinforcing inflammatory loop involving the brain, gut,
  and skin. At the molecular level, intestinal hyperpermeability may facilitate the
  translocation of lipopolysaccharides (LPS), which bind to TLR4 and activate the
  NF-kappaB pathway, potentially driving systemic inflammaging. This dysregulated
  circuit has been associated with the acceleration of cutaneous aging phenotypes
  (xerosis, pruritus) and may contribute to systemic manifestations, including potential
  hair alterations and body shape changes. “Dashed lines represent proposed bidirectional
  feedback loops and potential molecular interactions between the gut, brain, and
  skin.”
