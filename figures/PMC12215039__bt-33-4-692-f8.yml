figure_title: Illustration of the effect of BRL treatment on a murine model of allergic
  asthma with co-exposure to OVA and LPS.
caption: Illustration of the effect of BRL treatment on a murine model of allergic
  asthma with co-exposure to OVA and LPS. BRL alleviated both eosinophilic and neutrophilic
  inflammation. Notably, BRL attenuated mucus hypersecretion, neutrophil infiltration,
  and the elevated levels of IL-6 and IL-1β, all of which were synergistically amplified
  by both types of inflammation. The illustration was created using smart.servier.com.
  The confirmed signaling pathways in this study were indicated as a solid arrow;
  the potentially expected signaling pathways were presented to a dashed arrow; the
  inhibitory effect of BRL in this asthma murine model were presented as a red bar;
  the main pathogenetic pathway of this asthma murine model associated to the effect
  of BRL were presented to large orange and gray arrows. OVA, ovalbumin; LPS, lipopolysaccharide;
  DC, dendritic cell; Th0, naïve T cell; Th2, type 2 helper T cell; IgE, immunoglobulin
  E; IL, interleukin; NK cell, natural killer cell
