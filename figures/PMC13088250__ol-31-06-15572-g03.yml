figure_title: Crosstalk between lactylation and other PTMs.
caption: Crosstalk between lactylation and other PTMs. Lactylation exhibits intricate
  crosstalk with other acyl-based PTMs. Central metabolic pathways, including glycolysis
  and the TCA cycle, provide the essential acyl-CoA substrates for these modifications.
  The widespread sharing of enzymatic machinery provides the structural and functional
  basis for the acyl-mediated epigenetic regulatory network. Due to this overlap,
  a complex and competitive system is created in which the relative availability of
  each substrate and the metabolic state of the cell determine the balance between
  various PTMs, ultimately influencing the epigenetic and signaling landscape. PTMs,
  post-translational modifications; La, lactate/lactylation; KATs, lysine acetyltransferases;
  AARS1, alanyl-tRNA synthetase 1; ACSS2, acyl-CoA synthetase short-chain family member
  2; HDACs, histone deacetylases; SIRTs, sirtuins; Brg1, Brahma-related gene-1; DPF2,
  double PHD fingers 2; GTPSCS, succinyl-CoA synthetase; TRIM33, tripartite motif-containing
  33; PDC, pyruvate dehydrogenase complex; α-KG, α-ketoglutarate; SCS, succinyl-CoA
  synthetase; ACLY, ATP-citrate lyase; BRDs, bromodomain-containing proteins; TAF1,
  TATA-box binding protein associated factor 1; Ac, acetylation; R-BHB, R-3-hydroxybutyrate;
  ENL, eleven-nineteen leukemia protein; Bhb, β-hydroxybutyrylation; CPT1A, carnitine
  palmitoyltransferase 1A; HAT1, histone acetyltransferase 1; Su, succinylation; GAS41,
  glioma-amplified sequence 41; Cr, crotonylation
