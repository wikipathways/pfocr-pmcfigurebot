figure_title: Role of cholesterol biosynthesis pathway in SaOS-2 cells migration and
  invasion.
caption: Role of cholesterol biosynthesis pathway in SaOS-2 cells migration and invasion.
  (A) PCA score plot showing the association between the expression of cholesterol
  and steroid biosynthesis-related genes and metastasis status in OS tissues. (B)
  Boyden chamber assay was performed to detect the migration of SaOS-2 after treatment
  with simvastatin for 18 h (10× magnifications). (C) Quantification of migrated cells
  represented as a bar graph. (D) The effects of simvastatin on SaOS-2 cell invasion
  were evaluated by using Boyden camber assay after treatment with simvastatin for
  18 h (10× magnifications). (E) Quantification of invaded cells are represented as
  a bar graph. (F) Western blot analysis of epithelial–mesenchymal transition (EMT)-related
  protein expression in SaOS-2 cells following 24 h simvastatin treatment. (G) Densitometric
  quantification of EMT protein bands using ImageJ, presented as histograms. (H) Western
  blot analysis of extracellular matrix (ECM)-degrading enzyme expression in SaOS-2
  cells after 24 h of simvastatin exposure. (I) Quantification of ECM-related protein
  band intensity using ImageJ, presented as a histogram. Results were mean ± S.D.
  of three independent experiments. * p < 0.05, ** p < 0.01, *** p < 0.001 compared
  to control. All data are representative of three independent experiments as mean
  ± SD
