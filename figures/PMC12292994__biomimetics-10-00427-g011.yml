figure_title: Bio-inspiration pathway from flapping animals to tunable-stiffness propulsors.
caption: Bio-inspiration pathway from flapping animals to tunable-stiffness propulsors.
  Three biological models supply four core mechanisms—leading-edge-vortex lift, elastic
  energy recycling, passive membrane compliance, and self-repair—that inform emerging
  rotor, wing, and fin concepts. Promised gains include higher thrust, lower power
  demand, reduced vibration, and quieter operation, but challenges remain in mass,
  fatigue, Reynolds-number scaling, and control authority. Arrows trace the stepwise
  influence from biological archetypes (top) through mechanisms, concepts, and finally
  their challenges (bottom); within the concept boxes, an upward arrow (↑) signifies
  a desired increase, while a downward arrow (↓) signifies a desired decrease
