figure_title: Changes in circadian rhythms in MaR1-treated rats
caption: (A) MAP and (B) HR over time in MaR1-treated and control groups. The left
  panel shows the continuous recording of MAP (mmHg) over multiple days, demonstrating
  circadian fluctuations. The right panel presents box plots quantifying MAP rhythmic
  parameters, including amplitude, acrophase, and mesor, across different days. *p
  < 0.05, t-test. (C) Heatmaps of differentially expressed genes related to the circadian
  rhythm pathway in the heart and kidney. (D) Western blot analysis of PER2 and CRY
  1 proteins in the heart. Each line represents 1 rat. Summary graphs showing the
  average relative density of the bands normalized to loading controls. Quantification
  of protein expression was performed by normalizing to the corresponding loading
  control. (E) RT-qPCR analysis of Prox1 gene identified by RNA-seq in the kidney,
  shows significant upregulated in the MaR1-treated group. Data are shown as mean
  ± SEM, *p < 0.05, **p<0.01, t-test
