figure_title: Differential transcriptional effects of shear stress on male vs female
  PAECs
caption: '(a) Differentially expressed genes (DEGs) in PAECs from females vs. males
  under three shear conditions. Sample groups: All Donors (n = 11 females, n = 7 males),
  Controls (n = 3 females, n = 3 males), and PAH (n = 3 females, n = 3 males). (b)
  Gene set enrichment analysis was used to identify significantly enriched pathways
  in females versus males at static (left) and high (right) shear. Significance was
  determined by an FDR q-value <0.05 and enrichment quantified by the normalized enrichment
  score (NES). Pathways are annotated with gene sets from Hallmark (H), Kyoto Encyclopedia
  of Genes and Genomes (KEGG), Reactome (R), Wikipathways (WP), and Gene Ontology
  Biological Processes (GO), with pathway names abbreviated where appropriate'
