figure_title: A high level of methionine activates the CYP1A1/GPR75/NRAS-MEK1-ERK1
  axis in vascular endothelium.
caption: A high level of methionine activates the CYP1A1/GPR75/NRAS-MEK1-ERK1 axis
  in vascular endothelium. (A) Western blot analysis and densitometric quantification
  of CYP1A1 protein expression in EA.hy926 endothelial cells treated with increasing
  concentrations of methionine (0.5 and 1 mmol/L). Experimental groups include control
  (Con), 0.5% methionine diet (Met0.5), 1% methionine diet (Met1), and folic acid
  treatment (FA). GAPDH was used as a loading control. (B) Quantitative RT-PCR analysis
  showing mRNA expression levels of Cyp1a1 across the four groups. (C) KEGG enrichment
  analysis of differentially expressed genes between the control group and HHcy hypertension
  group in rats. The top 20 significantly enriched pathways are shown, with the x-axis
  indicating the percentage of genes involved in each pathway (gene percentage). The
  number of genes and q-values are displayed in parentheses. A lighter color indicates
  higher statistical significance. (D–G) Bar graphs showing the relative mRNA expression
  levels of Gpr75 (D), Nras (E), Erk1 (F), and Mek1 (G) in EA.hy926 endothelial cells
  under different treatments. Data are presented as mean ± SD; * p < 0.05, ** p <
  0.01, and *** p < 0.001. (H) Schematic diagram illustrating the proposed mechanism
  by which 20-hydroxyeicosatetraenoic acid (20-HETE), a lipid metabolite, binds to
  GPR75 and activates the downstream MAPK cascade, including NRAS, MEK1, and ERK1
