caption: (A) Gene cluster organization of the KZ5 BGC (kalA–kalI), identified in the
  Limnoraphis sp. genome. Genes identified by antiSMASH are color-coded and labeled
  by class. (B) Proposed biosynthetic pathway for KZ5, showing domain organization
  of the modular NRPS enzymes (KalB–KalE) and their corresponding successive incorporation
  of amino acid subunits. Colored circles represent functional domains such as condensation,
  adenylation, epimerase domains. (C) Circular genome map of Limnoraphis sp. generated
  by Proksee (https://proksee.ca/), highlighting the location of the KZ5 BGC as well
  as several other BGCs for natural products.28 Five contigs are indicated by differently
  grayed bars between the forward (outer) and reverse (inner) frames in the map
