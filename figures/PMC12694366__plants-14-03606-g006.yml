caption: Transcript abundance of CtPAL1 and other key flavonoid biosynthetic genes
  in CtPAL1-overexpression lines of Arabidopsis. (A) The representation of step-wise
  flavonoid biosynthetic pathway and their associated enzymes in plants. (B) Relative
  expression of CtPAL1 in 21 transgenic lines (upper panel). The relative transcript
  abundance of four key genes of flavonoid biosynthetic pathway, namely, At4CL, AtCHI,
  AtC4H, and AtANS, using the two high-expression lines—OE10 and OE16 (lower panel).
  Statistical data are presented as mean ± SD for three independent biological replicates.
  Statistical significance relative to WT is shown with asterisks and distinct letters
  above the bars (**** p < 0.1, *** p < 0.05, ** p< 0.01 * p < 0.001, Student’s t-test)
