figure_title: Mechanisms for the development of antibiotic resistance.
caption: Mechanisms for the development of antibiotic resistance. (1) Bacteria can
  produce proteins that protect the antibiotic’s target without directly altering
  it. These protective proteins bind to the target (often ribosomes or enzymes) and
  prevent the antibiotic from interacting with it, while still allowing the target
  to perform its normal function. (2) Antibiotic inactivation is one of the most common
  resistance mechanisms. Bacteria generate enzymes that chemically inactivate the
  antibiotic, rendering it ineffective before it reaches its target. (3) They also
  modify the structure of the molecule (usually a protein or enzyme) to which the
  antibiotic binds. This change reduces or eliminates the antibiotic’s ability to
  bind and inhibit the target. (4) Additionally, bacteria can develop alternative
  metabolic pathways that bypass the step blocked by the antibiotic. Even with the
  antibiotic present, the bacteria find another way to perform the same vital function.
  “A” represents the original antibiotic target while “B” represents a newly acquired
  or modified enzyme or pathway that performs the same essential function as “A” but
  is not inhibited by the antibiotic. Figure made with Biorender
