figure_title: Overall Anticancer Mechanism of Flavonoids.
caption: Overall Anticancer Mechanism of Flavonoids. Flavonoids induce arrest of cells
  in the G2/M phase of the cell cycle and initiate ROS-mediated apoptosis by inhibiting
  cell growth. cell growth. The downregulation is denoted by the orange arrow. The
  red lines denote the check points for mitotic cycle arrest while dashed red line
  represent skipping of M phase. By blocking important signaling pathways, such as
  NF-κB, MAPK, and STAT, flavonoids cause the down regulation of several mediators
  and limit cell growth. P represents phosphorylation which is a process for activating
  or deactivating pathways. Flavonoids also induce mitochondrial apoptosis by activating
  specific signaling pathways, such as the cytochrome c translocation into the cytoplasm,
  which promotes the formation of apoptosomes. When apoptosomes form, caspase 9 is
  activated, followed by caspase 3 and 7, which trigger the cellular components to
  undergo apoptosis. Another flavonoid-mediated apoptotic pathway is depicted in the
  image, which involves the activation of Caspase 8 and 10, followed by the production
  of Caspase 3 and 7, leading to the destruction of cancer cells
