figure_title: Direct and indirect translation of optogenetic circuit discoveries
caption: Basic optogenetic studies guide the development of circuit insights in laboratory
  animals (for example, rodents) for specific neuropsychiatric symptoms (as an example,
  circuitry related to essential tremor is depicted as colored arrows superimposed
  on the mouse brain). When optogenetic methods are directly applied in human treatment
  (top pathway in the figure), this is known as ‘direct translation’. Conversely,
  ‘indirect translation’ (also known as immediate or optogenetically inspired translation)
  occurs when established treatment technologies, such as electrical DBS and/or pharmacological
  interventions, are developed to target the optogenetically defined cell population,
  leading to human applications based on these neuromodulatory and/or medication modalities
  (bottom pathways in the figure)
article_title: Roadmap for direct and indirect translation of optogenetics into discoveries
  and therapies for humans
