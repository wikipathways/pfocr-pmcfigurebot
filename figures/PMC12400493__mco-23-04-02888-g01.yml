figure_title: Changes in the expression level of SMC2 in LUAD tissues and pathology
  grading as well as alterations in signaling pathways.
caption: Changes in the expression level of SMC2 in LUAD tissues and pathology grading
  as well as alterations in signaling pathways. (A) SMC2 protein expression was higher
  in LUAD tissues than normal tissues. (B) Immunohistochemical staining showing SMC2
  expression in LUAD tissues and normal lung tissues. (C) SMC2 protein expression
  in pathological G2 and G3 stages was higher than that in normal group. (D-F) SMC2
  protein expression levels were higher in the mTOR and HIPPO and WNT pathway alteration
  groups than in the normal group. ***P<0.001. SMC2, structural maintenance of chromosomes
  2. LUAD, lung adenocarcinoma; NS, no significance
