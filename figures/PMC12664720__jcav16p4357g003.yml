caption: 'Correlation Analysis of GPT2 with Tumor Microenvironment and Stemness. (A)
  Stratification of GPT2 high- and low-expression groups based on distinct gene signatures
  (immune-related scores, mismatch repair-related scores, stromal-related scores,
  etc.). (B) Correlation between GPT2 expression and tumor purity, stromal score,
  immune score, and combined scores in bladder cancer. (C-D) Correlation of GPT2 with
  bladder cancer stemness indices: methylation stemness index (mDNAsi) and gene expression
  stemness index (mRNAsi). (E) Correlation between GPT2 expression and TGF-β1 signaling
  pathway genes. (F) Correlation between GPT2 expression and key genes in the Wnt/β-catenin
  signaling pathway'
