figure_title: Proteomic profiling of HKB-11 cells reveals distinct molecular responses
  to the synergistic combination of nisin (N) and urolithin B (UB).
caption: 'Proteomic profiling of HKB-11 cells reveals distinct molecular responses
  to the synergistic combination of nisin (N) and urolithin B (UB). (A) An Ingenuity
  Pathway Analysis (IPA) graphical summary illustrating two enriched biological themes
  arising from significantly modulated proteins following treatment with a synergistic
  combination of nisin (N) and urolithin B (UB) in a 7:3 ratio (5750 µM total), compared
  to mono-treatments with N (5600 µM) or UB (150 µM). Nodes represent molecular functions
  or regulators: orange indicates predicted activation, blue indicates predicted inhibition,
  and grey denotes neutral or no prediction. Solid and dashed lines indicate direct
  and inferred molecular interactions, respectively. (B) Volcano plot showing differentially
  expressed proteins unique to the combination treatment versus individual monotherapies.
  Proteins meeting the significance criteria (absolute log2 fold change ≥ 0.58 and
  Q-value ≤ 0.05) are highlighted: red for upregulated and blue for downregulated
  proteins. Grey dots indicate proteins not significantly changed. Labelled proteins
  represent key effectors that may contribute to the enhanced anticancer activity
  observed with the combination therapy'
article_title: Investigating the Cellular Responses to Combined Nisin and Urolithin
