figure_title: Synthetic pathway to DB03476.
caption: Synthetic pathway to DB03476. Methyl 6-cyano-2-naphthoate (1) was reduced
  with CaCl2/NaBH4 in THF/EtOH, worked up with H2O/KHSO3/HCl, DCM-extracted, and recrystallized
  to give 6-(hydroxymethyl)-2-naphthonitrile (2). 2 reacted with CBr4/PPh3 in THF,
  concentrated, flash CC-purified (50% DCM/hexanes) to afford 6-(bromomethyl)-2-naphthonitrile
  (3). 3 in triethyl phosphite was heated to 150 °C, precipitated with ether/hexanes
  to give (6-cyano-2-naphthyl) methylphosphonate (4). 4 was deprotonated by NaH, reacted
  with benzaldehyde, extracted, CC-purified to give diethyl (E)-6-styryl-2-naphthonitrile
  (5). 5 with diazomethane/Pd(OAc)2 gave 6-(2-phenylcyclopropyl)-2-naphthonitrile
  (6). 6 was SFC-purified to 6-((1S,2S)-2-phenylcyclopropyl)-2-naphthonitrile (7).
  7 with AlMe3/NH4Cl in toluene, worked up with HCl, and Prep-HPLC-purified to yield
  6-((1S,2S)-2-phenylcyclopropyl)-2-naphthimidamide (8)
