figure_title: The release of arachidonic acid from membrane phospholipids by cytosolic
  phospholipase A2 (cPLA2) is promoted by stimulation from factors such as mechanical
  injury, cytokines, or growth signals.
caption: 'The release of arachidonic acid from membrane phospholipids by cytosolic
  phospholipase A2 (cPLA2) is promoted by stimulation from factors such as mechanical
  injury, cytokines, or growth signals. Consequently, arachidonic acid is transferred
  to prostaglandin H synthase (PGHS), also known as cyclooxygenase, which exhibits
  two isoforms: COX-1 (a) is responsible for basal prostaglandin synthesis (constitutive),
  and COX-2 (b) is induced under specific conditions. Prostaglandin E2 (PGE2) is the
  prevalent prostaglandin in the human body and contributes to the development of
  atherosclerosis, exerting its effects through a variety of EP receptors involved
  in the formation and stabilization of atherosclerotic lesions. Therefore, PGE2-EP
  signalling could be a promising therapeutic strategy for atherothrombosis. Specifically,
  the activation of the EP2 receptor promotes monocyte/macrophage adhesion to vascular
  endothelial cells, a mechanism associated with the inflammatory process involved
  in the progression of atherothrombosis. The activation of the EP3 receptor, which
  is followed by the inhibition of the cAMP-dependent pathway, results in the promotion
  of platelet aggregation and the development of atherothrombosis, which is mediated
  by PGE2. EP4 modulation involves both autocrine and paracrin activation; indeed,
  EP4 receptor activation promotes macrophage survival through the PI3K/Akt and NF-κB
  signalling pathways. Furthermore, EP4 receptor activation stimulates the cAMP-PKA
  pathway, enhancing the production of MMP-2 and MMP-9 in macrophages of symptomatic
  atherosclerotic plaques, which leads to plaque instability. AA: arachidonic acid;
  COX-1: cyclooxygenase 1; COX-2: cyclooxygenase 2; cAMP: cyclic adenosine monophosphate;
  cPGE2: constitutive prostaglandin E2; iPGE2: inducible prostaglandin E2; PGE2: prostaglandin
  E2; EP2: prostaglandin E2 receptor 2; EP3: prostaglandin E2 receptor 3; EP4: prostaglandin
  E2 receptor 4; PI3K/Akt: phosphatidylinositol 3-kinase/protein kinase B; MMP-2:
  metalloproteinases 2; MMP-9: metalloproteinases 9'
