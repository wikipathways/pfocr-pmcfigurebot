figure_title: Mechanistic pathways involved in cancer cachexia.
caption: Mechanistic pathways involved in cancer cachexia. Elevated phosphoribosylpyrophosphate
  synthetase 1 (PRPS1) expression enhances xanthine oxidase activity, exacerbating
  purine metabolism dysregulation and muscle wasting. Ceramide (CER) species such
  as CER[16:0] and CER[24:1] derived from the de novo pathway impair protein synthesis
  and promote autophagy and apoptosis. Tumor-secreted cytokines including tumor necrosis
  factor (TNF)-α, interleukin (IL)-1, and IL-6 drive systemic alterations targeting
  adipose tissue lipolysis, fibrosis, and browning. Pharmacological interventions
  including CER synthesis inhibitors and phosphodiesterase (PDE) inhibitors like rolipram
  target mitochondrial dysfunction and restore cAMP response element-binding protein
  1 (CREB1) activity
