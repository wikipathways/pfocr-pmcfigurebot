figure_title: The cGAS-STING pathway is crucial for rTSMS-induced microglial modulation.
caption: The cGAS-STING pathway is crucial for rTSMS-induced microglial modulation.
  (A) A volcano plot illustrating the genes differentially expressed in microglia
  following rTSMS treatment. Red and blue dots represented upregulated and downregulated
  genes, respectively. (B) GO analysis of downregulated genes in microglia following
  rTSMS treatment. (C) KEGG analysis of genes downregulated in microglia following
  rTSMS treatment. (D) GSEA indicated that the cytosolic DNA-sensing pathway was inhibited
  by rTSMS. (E) Visualization of cGAS-STING pathway activity on the t-SNE. Each point
  represented a single cell, colored by the cGAS-STING pathway activity score computed
  via module scoring of canonical pathway genes (e.g., Cgas, Sting, Tbk1, Irf3, Nfkb1,
  Rela, Ikbkb, Chuk, Casp1, Ifnb1). Warmer colors (red) indicated higher pathway activation,
  while cooler colors (blue) indicated lower activity. A semi-transparent contour
  highlighted a distinct cellular subpopulation exhibiting elevated cGAS-STING activity.
  (F-G) Representative images of western blotting and quantitative analyses of p-P65,
  p-IRF3, cGAS and STING in injured spinal cord tissue at 21 dpi, n = 3. (H-I) Representative
  immunostaining images and statistical analyses of IBA1 (red), cGAS (green), and
  DAPI (blue) in the center of the injured spinal cord at 21 dpi, n = 5. (J-K) Representative
  images and statistical analyses of IBA1 (red), STING (green), and DAPI (blue) immunostaining
  in the center of the injured spinal cord at 21 dpi, n = 5. **P < 0.01, ***P < 0.001
