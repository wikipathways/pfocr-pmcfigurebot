figure_title: cSCC fibroblast expansion, accumulation and IL-1 signaling.
caption: cSCC fibroblast expansion, accumulation and IL-1 signaling. (A) Representative
  immunofluorescence images of control and cSCC mouse tissue stained for epidermal
  stem cell marker Krt14 (green), myeloid marker CD11b (pink), and fibroblasts markers
  Pdgfrα and vimentin (pink). Dashed lines demarcate location of basement membrane.
  Scale bars, 50 μm. (B) Schematic of inflammasome and IL-1 signaling pathways. Proteins
  in red are analyzed in (C-E). (C) Representative immunofluorescence images of control
  and cSCC mouse tissue stained for epidermal stem cell marker Krt14 (green), fibroblast
  marker Pdgfrα (white), as well as the IL-1 signaling proteins MEK6, Hif1α, and MEK4
  (pink). Dashed gray lines demarcate location of basement membrane. Insets show zoomed-in
  regions corresponding to dashed red boxes. Scale bars, 50 μm (non-zoom) or 10 μm
  (zoom). (D) Scatter dot SuperPlots displaying the percent of epithelial and dermal
  cells staining positive for IL-1 signaling proteins (labeled in red in B) in control
  and cSCC mouse tissue. Error bars represent standard error of the mean. N = 3 mice
  per dot plot. Individual values within each n are displayed in the same color. P-values,
  p > 0.05 (ns, not significant), p < 0.05 (*), p ≤ 0.0001 (****), were calculated
  using ordinary one-way ANOVA with Tukey’s multiple comparison tests. (E) Control
  and cSCC mouse tissue co-stained for multiple IL-1 signaling components, confirming
  the same fibroblast subpopulations co-express all three targets. Dashed gray lines
  demarcate location of basement membrane. Insets show zoomed-in regions corresponding
  to dashed red boxes. Scale bars, 50 μm (non-zoom) or 10 μm (zoom)
