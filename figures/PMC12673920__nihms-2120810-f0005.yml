figure_title: Mixed responses with single-agent targeted therapy
caption: As an example, tumor growth in the lungs is driven by the PDGFR pathway while
  tumor in the liver is dependent on FGFR pathway activation, in the hypothetical
  illustration.A. Administration of a PDGFR inhibitor alone leads to tumor response
  in the lung while the tumor progresses in the liver.B. Administration of an FGFR
  inhibitor alone leads to tumor response in the liver while the tumor progresses
  in the lung.C. Simultaneous administration of a PDGFR and FGFR inhibitor leads to
  tumor response in the lungs and liver
