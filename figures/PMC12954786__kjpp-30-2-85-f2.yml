figure_title: SMK-002 inhibited the activation of EGFR/p-ERK/c-Raf signaling pathway
  induced by EGF
caption: When (A) T24 or (B) J82 cells density reached 70%–80%, cells were treated
  with SMK-002 and then stimulated by EGF. The levels of protein EGFR and its downstream
  signal pathway were detected by Western blot experiment. The data presented here
  represent the findings of three independent experiments. The error bars represent
  the mean ± SD of triplicate experiments. EGFR, epidermal growth factor receptor.
  *p < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001. “ns” denotes no significant
  difference, n = 3
article_title: SMK-002 inhibits the growth of bladder cancer cells and increases their
