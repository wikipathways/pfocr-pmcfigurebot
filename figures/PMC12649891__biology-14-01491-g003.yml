figure_title: Immune-suppressive effects of C3a/C3aR signaling in the TME.
caption: 'Immune-suppressive effects of C3a/C3aR signaling in the TME. (a) C3a in
  the TME attracts M2 macrophages that express the C3aR receptor promoting tumor progression.
  A therapeutic approach would block the signal between C3a and C3aR to decrease the
  migration of M2 macrophages to the TME. (b) Two pathways were displayed through
  which C3a/C3aR signaling enhances the ability of astrocytes to promote tumor growth
  through increased GFAP and TNF-α. A potential treatment, such as SB290157, a C3aR
  antagonist, could be utilized to block C3a/C3aR signaling inhibiting GFAP and TNF-α
  expression from astrocytes. (c) C3a/C3aR and C5a/C5aR signaling inhibit IL-10 production
  by CD8+ T cells. SB290157 and PMX205 inhibited anaphylatoxins’ signaling from blocking
  the IL-10 production of CD8+ T cells, resulting in a potential therapeutic approach.
  (d) C3a/C3aR signaling results in decreased neutrophils and CD4+ T cells within
  the TME and an increased number of macrophages, resulting in tumor growth. A potential
  treatment could be used to inhibit C3a/C3aR signaling, thus increasing the number
  of neutrophils and CD4+ T cells within the TME while decreasing macrophages to diminish
  tumor growth. ↓: decrease; ↑: increase. The figure was created with BioRender.com'
