figure_title: Bulk RNA sequencing analysis of ISO- and LPS-treated hearts
caption: (A) Mice were injected i.p. with 300 mg/kg isoproterenol (ISO), 2.5 mg/kg
  lipopolysaccharide (LPS), or diluent control (PBS). Hearts were collected at baseline
  (day 0) and on days 1 and 7, with the inferior mid-apical region of the left ventricle
  used for bulk RNA sequencing. (n=3–4/group) (B) Principal component analysis plots
  of the ISO- and LPS-treated samples across time points. (C) Number of differentially
  expressed genes (DEGs) across different groups, relative to control (P<0.05, log2
  fold change >/<0). (D) Venn diagrams showing the number of common and unique upregulated
  DEGs between the ISO and LPS groups on days 1 and 7. (E) Pathway enrichment analysis
  of upregulated gene lists in the ISO and LPS groups on day 1 and (F) on day 7
article_title: Comparative Analysis of Isoproterenol and Lipopolysaccharide Mediated
  Cytoprotective Responses in the Heart
