figure_title: Expression of Runx1-R188Q alters Cbfb-MYH11–induced gene expression
  changes in the AMP population
caption: (A–D) RNA-Seq was performed on AMP cells isolated from Mx1-CreCbfb+/56M and
  Runx1+/R188QMx1-CreCbfb+/56M mice 8 weeks after pIpC treatment. N = 3 for each genotype.
  (A) Principal component analysis plot showing clear separation between these 2 genotype
  groups. (B) Heatmap representation of identified DEGs between these 2 groups. Numbers
  and percentages of DEGs in each of the 2 expression clusters (down- and upregulated
  in Runx1+/R188QMx1-CreCbfb+/56M mice) are listed on the left. (C) GSEA (pre-ranked)
  identified curated genes sets significantly enriched in the DEGs shown in B. (D)
  Upstream regulators associated with DEGs shown in B, identified by Ingenuity Pathway
  Analysis
