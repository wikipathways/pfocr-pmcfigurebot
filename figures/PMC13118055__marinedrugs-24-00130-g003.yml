figure_title: Effects of TT-55 treatment on the Nrf2/HO-1 pathway.
caption: Effects of TT-55 treatment on the Nrf2/HO-1 pathway. (A,B) Immunofluorescence
  analysis of Nrf2 nuclear translocation. (C,D) Western blot analysis of Nrf2 protein
  levels. (E) qPCR analysis of Nrf2 mRNA expression in RAW 264.7 macrophages under
  Nrf2 pathway inhibitor treatment. (F) Analysis of HO-1 expression levels in RAW
  264.7 macrophages treated with TT-55 under Nrf2 pathway inhibitor conditions. Each
  experiment was independently performed in triplicate at minimum, and all results
  are presented as mean ± standard deviation. * p < 0.05, ** p < 0.01, and *** p <
  0.001, and **** p < 0.0001compared with the LPS group
