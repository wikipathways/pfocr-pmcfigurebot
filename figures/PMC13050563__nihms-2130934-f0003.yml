figure_title: Hippo signaling pathway versus β-catenin
caption: When the Hippo pathway is active, LATS1/2-mediated phosphorylation retains
  YAP/TAZ in the cytoplasm, preventing their nuclear translocation and downstream
  transcriptional activation. Active Hippo signaling also suppresses Wnt/β-catenin
  activity by inhibiting β-catenin stabilization and transcriptional cooperation.
  In contrast, when Hippo signaling is inactive, dephosphorylated YAP/TAZ translocate
  to the nucleus and bind TEAD transcription factors, while stabilized β-catenin associates
  with TCF/LEF to drive gene transcription and more importantly drives EMT. TEAD also
  transcribes for Myc, CTGF, Cyr61, AREG, and AXL transcription factors, RTK, and
  proteins which also drive EMT. Together, these coordinated transcriptional programs
  regulate proliferation, EMT, and tumor progression
