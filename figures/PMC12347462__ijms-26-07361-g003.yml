figure_title: The PC-PLC pathway is necessary for TCA extension in vivo.
caption: The PC-PLC pathway is necessary for TCA extension in vivo. (A) The expression
  of thalamic glutamatergic marker Gbx2 in a transverse thalamic section at E5. (B)
  In a control bead implant (asterisk), transverse sections show thalamic pioneer
  projections at E5. (C) After a D609 bead implantation (asterisk) for 2 days, pioneer
  projections in the thalamus appear to be disorganized at E5. (D) Schematic showing
  a sagittal view of the E5 forebrain; the right-hand panel shows a high-power view
  of the boxed region. (E) PBS controls show that thalamic TUJ1+ axons (arrow) project
  towards the E5 prethalamus in a sagittal view. (F) With the addition of D609, the
  extension of thalamic axons is chaotic, and some axons (arrows) are outside the
  axonal bundle. TH, thalamus; PTh, prethalamus; M, midbrain; Rh, rhombencephalon;
  T, telencephalon; ZLI, zona limitans intrathalamica. Scale bars (A–C) = 50 µm; scale
  bars (E,F) = 25 µm
