figure_title: Gedunin targets the sonic hedgehog pathway (Shh) in PCSCs.
caption: Gedunin targets the sonic hedgehog pathway (Shh) in PCSCs. HPAC cells were
  treated with GD (25 µM) for 24 h, and CD133+ and LGR5+ PCSC populations were isolated
  and cultured for 21 days. (A) Waterfall plot illustrating GD-induced differential
  gene expression in human Shh signaling pathway. (B,C) List of the top 5 upregulated
  (B) and downregulated (C) genes in response to GD. (D,E) Reactome pathway analysis
  of upregulated (D) and downregulated (E) genes highlighting key signaling processes
  affected by GD treatments in PCSC. (F) Western blot analysis of Shh and Gli1 expression
  in GD-treated PCSCs. Data were normalized with β-actin expression. (G) Expression
  levels of Shh in tumor samples from the TCGA dataset. (H) Kaplan–Meier survival
  analysis demonstrating the effect of Shh expression on patient survival outcomes.
  Data are expressed as means ± SEM
