figure_title: Slc25a39 is a downstream target of the Atf4/Nrf2 network under nutrient
  or redox stress conditions
caption: (A) Schematic diagram illustrating how metabolic pathways contribute to increased
  oxidative stress, leading to Nrf2 stabilization and upregulation of the oxidative
  stress response. (B) Heatmap displaying expression levels of Nrf2 target genes under
  +Q and −Q conditions, generated using k-means clustering. (C) qRT-PCR analysis of
  indicated mRNA levels from cells cultured in +Q or −Q media, transfected with non-targeting
  siRNA (si_NT) or Nfe2l2 siRNA (si_Nfe2l2). Data represent mean ± SD from n = 3 independent
  experiments. Statistical significance was determined using Student’s t-test.(D)
  qRT-PCR analysis of the same genes in cells transfected with si_NT or si_Nfe2l2
  and treated with 6.25μM antimycin A (Ant A) or Veh. Data represent mean ± SD from
  n = 3 independent experiments. Statistical significance was determined using Student’s
  t-test. Statistical significance is indicated as P<0.05(*) and P<0.05(#), determined
  by Student’s t-test. Data presented as mean ± SD
