figure_title: Two different UPR pathways function separately in distinct lineage production
caption: '(A) Quantitative RT-PCR analyses of Xbp1 transcripts upon tunicamycin (Tuni)
  (1.2 μg/ml for 12 hr) or thapsigargin (Thap) (0.05 μM for 6 hr) treatment. Xbp1s:
  spliced Xbp1 transcript; Xbp1u: unspliced Xbp1 transcript; Ratio: ratio of spliced
  over unspliced Xbp1 transcript.(B) Representative images and quantification of nuclear
  ATF4 positive MPP3 cells upon tunicamycin (1.2 μg/ml for 12 hr) or thapsigargin
  (0.05 μM for 6 hr) treatment. Scale bar: 10 μm.(C) Quantification of myeloid colony
  formation upon IXA4 (10 μM) and thapsigargin (Thap; 0.05 μM) treatment for 12 hours
  (n = 4). CFU, colony forming unit; MegE, megakaryocyte/erythrocyte; G (or) M, granulocyte
  or macrophage; GM; granulocyte/macrophage, GEMM, granulocyte/erythroid/macrophage/megakaryocyte.(D)
  Short-term in vitro differentiation of FcγR− MPP3 upon IXA4 treatment. Cells (2,000
  per well) were cultured with IXA4 (10 μM) for 24 hours and then analyzed for HSPC
  markers. Representative FACS plots and quantification of FcγR+ MPP3 production as
  fold change relative to control (Ctrl: DMSO treated FcγR− MPP3) are shown.(E) Quantification
  of nuclear ATF4 positive MPP3 cells from vehicle versus tunicamycin treated control
  and Jak2V617F mice.(F) Experimental scheme and RBC count upon ISRIB injection in
  transplanted Jak2V617F mice. Transplanted Jak2V617F mice were prepared as shown
  in Figure S3D. Mice were injected with ISRIB (1mg/kg) 6 weeks post-induction. Statistical
  significance was assessed by a two-tailed paired Student’s t-test.Data are means
  ± S.D., and statistical significance was assessed by a two-tailed unpaired Student’s
  t-test except for panel F. * p ≤ 0.05; ** p ≤ 0.01; *** p ≤ 0.001.See also Figure
  S4'
