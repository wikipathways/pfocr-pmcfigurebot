figure_title: EV-mediated microglial activation involves TLR7-dependent signaling
  pathway.
caption: EV-mediated microglial activation involves TLR7-dependent signaling pathway.
  Microglia were preincubated with the TLR7 inhibitor chloroquine (10 μM) for 1 h
  before stimulation with NPC- (A) or immature neuron (B) -derived EVs or LPS (10
  ng/mL) (C) for another 10 h (TNF-α) or 24 h (IL-1β and IL-6). Released cytokines
  were measured by ELISA. Data are presented as mean ± SEM for three independent experiments.
  Data were analyzed by paired t-test. * p < 0.05; ** p < 0.01 compared with control.
  (D,E) Microglia were pretreated with 10 μM chloroquine (CQ) for 1 h, then stimulated
  with NPC-derived EVs for 1 h. The levels of phosphorylated and total IκBα (D), p38,
  ERK, and JNK (E) proteins were detected by Western blotting. Data are presented
  as mean ± SEM for three independent experiments. Data were analyzed by paired t-test.
  * p < 0.05; ** p < 0.01 compared with EVs alone
