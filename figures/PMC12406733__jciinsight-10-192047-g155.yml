figure_title: Transcriptomic and proteomic data supported the histological data and
  suggested that BAY preserves skeletal muscle function in part by maintaining molecular
  mediators of the NMJ in aged mice
caption: Heatmaps (A and E), volcano plots (B and F), Gene Ontology plots of protein
  coding genes and biological processes (C and G), and GSEA plots (D and H) and are
  shown. Genes found in the cholinergic synapse pathway (I) were expressed at higher
  levels in the BAY-treated as compared with VEH-treated mice. (J) Proteomics analyses
  of skeletal muscle lysates identified differentially expressed proteins between
  BAY- and VEH-treated mice
