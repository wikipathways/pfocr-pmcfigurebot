figure_title: Hypoinflammatory MEFISTO and mortality-associated signature
caption: Analysis of 153 samples from 80 patients at 2 time points. (A) Proportion
  of total variance explained per MEFISTO factor and per data modality (gene, metabolite).
  (B) Proportion of total variance explained per MEFISTO factor. (C) Association of
  MEFISTO factors with clinical variables at day 0 as determined via Spearman’s correlation
  for continuous predictors and linear regression for categorical predictors (FDR
  < 0.05). (D) The slope of change in factor 1 over time by 90-day mortality. P value
  derived from interaction term of a linear mixed effects regression model with 90-day
  mortality, time point, and their interaction as fixed effects and patient as random
  effect. (E) Top genes in factor 1 by relative scaled weight. (F) Enriched gene expression
  pathways in factor 1. X axis depicts normalized enrichment score (NES). NMD, nonsense-mediated
  decay; APACHE, Acute Physiology and Chronic Health Evaluation III score; BMI, body
  mass index; GFR, glomerular filtration rate; IL, interleukin; metab, metabolite;
  Neut, neutrophil; NMB, neuromuscular blockade; NMD, nonsense-mediated decay; PFRatio,
  PaO2/FiO2 at the time of enrollment; TCR, T cell receptor; VFD, ventilator-free
  days
