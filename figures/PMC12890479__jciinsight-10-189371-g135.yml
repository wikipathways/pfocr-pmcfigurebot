figure_title: ANGPTL8 regulates MSC differentiation via the Wnt/β-catenin signaling
  pathway
caption: '(A) Pathway enrichment analysis in BMMSCs treated with LV-ANGPTL8. (B) qRT-PCR
  analysis of the mRNA expression of Wnt3a, Fzd9, Axin2, and Ctnnb1 after BMMSC transfection
  with LV-GFP and LV-ANGPTL8. n = 3. (C) qRT-PCR analysis of the mRNA expression of
  Wnt3a, Fzd9, Axin2, and Ctnnb1 after BMMSC transfection with siANGPTL8. n = 3. (D)
  ANGPTL8 blunted Wnt3a-induced phosphorylation of Gsk3β and prevented the subsequent
  accumulation of β-catenin in BMMSCs. n = 3. (E) Western blotting of PPARγ, Fabp4,
  Runx2, and Sp7 from BMMSCs treated with Angptl8 and Wnt3a. (F) Wnt3a rescued Oil
  Red O and alizarin red staining of lineage differentiation bias caused by overexpression
  of ANGPTL8 in BMMSCs. n = 3. Scale bars: 100 μm. (G) Quantification of Oil Red O
  staining in F. n = 3. (H) Quantification of calcium mineralization based on alizarin
  red staining in F. n = 3. (I) Immunohistochemical staining of β-catenin in the femurs
  of WT, Angptl8-Nestin-creTg, and Angptl8–/– mice. Scale bar: 50 μm. (J) Western
  blotting of p-Smad3, Smad3, p-Gsk3β, Gsk3β, and β-catenin from BMMSCs treated with
  TGF-β1 and Angptl8-ASO. Data are mean ± SEM. *P < 0.05; **P < 0.01; ***P < 0.001;
  ****P < 0.0001 by 2-tailed Student’s t test (B and C) or 2-way ANOVA followed by
  Tukey’s multiple-comparison test (G and H)'
