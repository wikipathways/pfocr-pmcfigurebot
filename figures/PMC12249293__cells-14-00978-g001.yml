figure_title: Structure of CAR receptors and the downstream intracellular signaling
  pathways triggered upon their activation in CAR T cells.
caption: Structure of CAR receptors and the downstream intracellular signaling pathways
  triggered upon their activation in CAR T cells. Each CAR in CAR T lymphocytes is
  composed of distinct regions that together allow T cells to recognize and attack
  tumor cells more effectively. At the forefront of the CAR structure is the antigen-recognition
  domain, typically a single-chain variable fragment (scFv) derived from a monoclonal
  antibody. The scFv consists of heavy and light antibody chains which are joined
  by a flexible linker to preserve structure and antigen-binding capability. Located
  directly beneath the scFv is the hinge or spacer region, which grants the receptor
  flexibility and spatial reach, optimizing engagement between the CAR T cell and
  the tumor cell. The transmembrane domain acts as an anchor, embedding the CAR into
  the T-cell membrane. At the core of the CAR’s functionality lies the intracellular
  signaling domain, which drives T-cell activation upon antigen engagement. Central
  to this is the CD3ζ chain, which contains immunoreceptor tyrosine-based activation
  motifs (ITAMs) necessary for initiating intracellular signaling cascades. To date,
  researchers have developed four generations of CAR receptors in the generation of
  CAR T lymphocytes. The first-generation CARs included only the basic components
  (scFv, hinge, transmembrane, and CD3ζ) but lacked co-stimulatory domains. To address
  this shortcoming, second-generation CARs were developed by integrating one co-stimulatory
  domain, such as CD28 or 4-1BB (CD137), in addition to the CD3ζ chain. The third-generation
  CARs incorporated two co-stimulatory domains, commonly CD28 and 4-1BB, alongside
  CD3ζ. The fourth and most advanced generation of CARs, known as TRUCKs (T cells
  Redirected for Universal Cytokine-mediated Killing), are engineered to express immune-stimulating
  molecules such as the pro-inflammatory cytokine IL-12. These engineered cytokines
  allow CAR T cells not only to kill cancer cells directly but also to modulate the
  tumor microenvironment. Engagement of CAR receptor initiates a complex intracellular
  signaling cascade which activates multiple pathways in CAR T cells. Phosphoinositide
  3-kinase (PI3K) generates PIP3 and activates AKT, which promotes survival and regulates
  metabolism of activated CAR T cells. Concurrently, DAG, produced by PLC-γ1-mediated
  hydrolysis of PIP2, activates Protein Kinase C (PKC), particularly PKC-θ, which
  is essential for NF-κB activation. DAG also facilitates activation of the Ras–MAPK
  pathway, including Ras, ERK, and JNK, which phosphorylate and activate transcription
  factor AP-1, composed of c-Fos and Jun. CDC42, a Rho-family GTPase, modulates actin
  cytoskeletal rearrangement and contributes to p38 MAPK activation. These signaling
  modules collectively lead to the activation of key transcription factors including
  NFAT, NF-κB, and AP-1, which orchestrate gene expression programs governing T cell
  proliferation and differentiation. Lineage-specific transcription factors such as
  T-bet and GATA3 are subsequently induced, directing differentiation of Th1 and Th2,
  respectively
