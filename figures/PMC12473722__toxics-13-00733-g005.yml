figure_title: Alterations in the circadian rhythm pathway and core gene expression
  in Notch3-knockout mice exposed to O3.
caption: Alterations in the circadian rhythm pathway and core gene expression in Notch3-knockout
  mice exposed to O3. (A) GSEA of the KEGG circadian rhythm pathway (KO04710) in Notch3−/−
  mice versus wild-type controls under filtered air conditions (N3KO_FA vs. WT_FA,
  n = 6). (B) GSEA of the ko04710 pathway in Notch3−/− versus wild-type mice after
  6 h O3 exposure (N3KO_ozone_6h vs. WT_ozone_6h, n = 6). (C) GSEA of the ko04710
  pathway in Notch3−/− versus wild-type mice after 24 h O3 exposure (N3KO_ozone_24h
  vs. WT_ozone_24h, n = 6). (D) GSEA of the ko04710 pathway in Notch3−/− mice versus
  wild-type mice after 48 h O3 exposure (N3KO_ozone_48h vs. WT_ozone_48h, n = 6).
  (E) Box plots showing expression levels of circadian regulators N4KO_FA vs. WT_FA
  (* indicates p < 0.05 vs. WT_FA, n = 6). (F) Box plots of circadian gene expression
  at 6 h O3 exposure (* indicates p < 0.05 vs. WT_ozone_6h, n = 6). (G) Box plots
  of circadian gene expression at 24 h O3 exposure (* indicates p < 0.05 vs. WT_ozone_24h,
  n = 6). (H) Differential expression of circadian genes at 48 h O3 exposure (* indicates
  p < 0.05 vs. WT_ozone_48h, n = 6)
