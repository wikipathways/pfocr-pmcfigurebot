figure_title: Comprehensive metabolism of macrophages in sepsis.
caption: Comprehensive metabolism of macrophages in sepsis. The figure illustrates
  the non-linear interdependencies among carbohydrate, lipid and amino acid metabolism.
  Key regulatory nodes include the citrate-to-acetyl-CoA shunt for lipid accumulation,
  the glutamine-to-α-KG anaplerotic pathway for mitochondrial buffering and the lactate-H3K18la
  axis driving arginine metabolic shifts. Potential therapeutic agents (such as 2-DG,
  metformin and PPAR agonists) are mapped to specific metabolic checkpoints to provide
  a roadmap for precision immunometabolic therapy. Arg1, arginase 1; α-KG, α-ketoglutarate;
  H3K18la, histone H3 lysine 18 lactylation; AMPK, adenosine 5'-monophosphate (AMP)-activated
  protein kinase; mTOR, mammalian target of rapamycin; HIF-1α, hypoxia inducible factor-1α;
  PKM2, pyruvate kinase M2; ETC, electron transport chain; TCA, tricarboxylic acid;
  NADPH, nicotinamide adenine dinucleotide phosphate hydrogen; FFA, free fatty acid;
  PPAR, peroxisome proliferator activated receptor; ABCA1, ATP-binding cassette protein
  A1; ABCG1, ATP-binding cassette protein G1; 2-DG, 2-deoxy-d-glucose
