figure_title: Eight-color flow cytometric analysis.
caption: 'Eight-color flow cytometric analysis. (A–G,I) bone marrow of a patient with
  MDS—Ogata score 3 points plus an abnormal neutrophil maturation pathway. (H,J) Bone
  marrow of a patient with thrombocytopenia of other origin than MDS—Ogata score 0
  points, comparison of neutrophil maturation with a patient with MDS. The gating
  strategy: (A)—discrimination of doublets (FSC-A vs. FSC-H)- singlets constitute
  95% of all bone marrow cells; (B)—discrimination of cells debris and gating cells
  SSC low (FSC-A vs. SSC-A)—SSC low cells constitute 52% of bone marrow cells, after
  excluding debris and doublets; (C)—gating myeloblasts CD117+ and mast cells for
  quality control; (D)—gating B-cell progenitors (CD10 vs. SSC-A)—percentage among
  all bone marrow cells; (E)—gating blast cells CD34+ (CD34 vs. SSC-A)—percentage
  among all bone marrow cells CD45+; (F)—gating of the bone marrow populations with
  particular emphasis on CD45 positive cells (CD45 vs. SSC-A): blue—neutrophils, red—blast
  cells, purple—monocytes, pink—B progenitors, green—lymphocytes, orange—erythroblasts—percentages
  of the presented populations are described among all bone marrow cells; (G)—neutrophils
  with abnormal maturation pathway (CD11b vs. CD13); (H)—neutrophils with normal maturation
  pathway (CD11b vs. CD13); (I)—neutrophils with abnormal maturation pathway (CD11b
  vs HLA-DR); (K)—comparison of neutrophil percentages in specific gates marked on
  (G,H); (L)—comparison of neutrophil percentages in specific gates marked on (I,J),
  #Events—Number of events'
