figure_title: Molecular mechanisms of HPV-mediated cancer initiation
caption: 'Conceptual model illustrating the proposed molecular events driving HPV-induced
  carcinogenesis, from initial infection through immortalization and tumorigenesis.
  (A) HPV Infection: High-risk HPV gains access to basal keratinocytes via epithelial
  disruptions such as micro-abrasions through persistent infections of the cervix,
  vagina, penis, anus, mouth, or throat. (B) Episomal Maintenance: The viral genome
  is maintained as a circular episome, replicating independently of the host genome
  and segregating into daughter cells during cell division. (C) Viral Oncogene Expression:
  The HPV genome contains an early promoter in the long control region (LCR) that
  recruits host transcriptional machinery to express viral genes, including the E6
  and E7 oncoproteins. E6 targets p53 for degradation, inhibiting apoptosis, while
  E7 inactivates pRb, driving uncontrolled cell cycle progression. (D) Viral Genome
  Integration: While HPV oncogenes can be expressed in episomal form, integration
  into the host genome can disrupt both viral and host regulatory mechanisms as well
  as genomic integrity. This leads to increased expression of viral oncogenes, disruption
  of host tumor suppressor genes, and activation of host protooncogenes, promoting
  cellular immortalization. (E) Constitutively Active β-catenin: The E6 and E7 viral
  oncogenes stabilize β-catenin and promote nuclear translocation. From there, β-catenin
  functions as a transcriptional coactivator, upregulating the downstream target genes
  of the Wnt signaling pathway. (F) Aberrant MYC Expression: β-catenin-driven transcription
  activates the MYC proto-oncogene, which is further stabilized by E6. MYC overexpression
  causes uncontrolled cell cycle progression and hyperproliferation. (G) Canonical
  & Noncanonical hTERT/TERC Activity: Through a combination of previously listed mechanisms
  (including viral oncoprotein expression, disruption of host genome and regulatory
  mechanisms, and host oncogene activation), hTERT and TERC-core components of telomerase-are
  reactivated. Canonically, telomerase maintains telomere length, conferring replicative
  immortality. Noncanonically, hTERT/TERC influence gene expression, metabolism, signaling,
  and immune responses. These canonical and noncanonical functions work together to
  promote transformation [58]. (H) Continued Genomic Instability: These oncogenic
  events do not occur linearly but intersect and reinforce one another. Loss of tumor
  suppressors, activation of oncogenes, and sustained proliferative signaling promote
  genomic instability, chromosomal aberrations, and accumulation of driver mutations
  that culminate in tumorigenesis [43]'
