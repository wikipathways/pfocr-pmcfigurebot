caption: |-
  Immunoblot analysis of ACC cells after treatment with fingolimod
  demonstrates targeting of Akt/ERK/NFKB pathways. Fingolimod treatment for 24
  hours results in dose-dependent increases in expression levels of phosphor-ERK
  with downregulation of phosphor-p65 and phosphor-Akt, whereas total ERK, P65,
  and Akt remain unchanged. Actin was used as a loading control.
