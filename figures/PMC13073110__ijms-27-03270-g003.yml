caption: Pathway analysis revealing disease-associated metabolic alterations. Metabolites
  with a VIP score greater than 1 from Figure 2 were included for metabolic pathway
  analysis. Results are shown for (A) PSP vs. control, (B) MSA vs. control, and (C)
  MSA vs. PSP. The x-axis indicates pathway impact, and the y-axis shows statistical
  significance as −log10(p-value). Circle size is proportional to the number of metabolites
  involved in each pathway, and color intensity reflects the p-value, with darker
  red indicating lower p-values and brighter yellow indicating higher p-values
