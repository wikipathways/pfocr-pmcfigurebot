figure_title: BMMs regulate brain function.
caption: BMMs regulate brain function. BMMs transplantation has demonstrated therapeutic
  effects through a variety of mechanisms. First, it significantly increased anti-inflammatory
  cytokines while decreasing pro-inflammatory cytokine markers, inhibiting inflammation
  and oxidative stress in the ischemic brain of mice. Additionally, it upregulated
  the VEGF-VEGFR2 signaling pathway, promoted angiogenesis, and enhanced cerebral
  blood flow. Second, BMMs treatment facilitated axonal sprouting, rewiring damaged
  neuronal circuits, and significantly increased motor performance in mice with cortical
  ischemia. Moreover, BMMs transplantation prevented CMS-induced increases in HMGB-1
  expression in the hippocampus and prevented increases in IL-1β expression in the
  hippocampus, while increasing BDNF expression in the hippocampus. In addition, the
  broken bone cells before the regular expression of PDGF-BB can maintain a steady
  state of the BBB, reduce and promote cell survival, improve microvascular damage
  to the hippocampus, and excessive expression of hippocampus-induced microvascular
  damage, BBB damage, and loss of cells in the hippocampus over weeks. The green arrow
  indicates promotion
