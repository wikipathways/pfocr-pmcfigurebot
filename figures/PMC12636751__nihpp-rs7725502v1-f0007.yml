figure_title: Accelerated neurogenic trajectory in PLXNB2−/− organoids is accompanied
  by lineage instability
caption: 'a) UMAP embedding of snRNA-seq profiles from day 42 cerebral organoids (n
  = 3 replicates per genotype). EN, excitatory neurons; Mes, mesenchymal-like; Epen,
  ependymal-like; SCP, Schwann cell precursor/neural crest-like.b) Stacked bar plots
  show loss of RG (sc0) and expansion of subplate-like (sc3) and maturing EN (sc6)
  populations in PLXNB2−/− organoids, reflecting accelerated neurogenesis and lineage
  imbalance.c) Dot plot showing expression of marker genes across annotated subclusters.d)
  Feature plots highlighting distinctive marker gene expression in WT vs. PLXNB2−/−
  subclusters.e) Volcano plot of DEGs (adj. P < 0.05, log2FC > 1) with selected genes
  labeled.f) GO enrichment analysis of DEGs, grouped by biological process (BP), cellular
  component (CC), and molecular function (MF), color-coded by theme.g) Heatmap showing
  functional gene groups: WT organoids upregulated mature neuronal and synaptic genes,
  whereas PLXNB2−/− organoids upregulated stromal/EMT-associated genes, indicating
  lineage instability and aberrant mesenchymal-like states.h) IPA network analysis
  revealed broad suppression of progenitor/neuronal regulatory pathways in KO organoids,
  with limited activation of developmental branching and stress-response regulators.i)
  Predicted upstream regulators of DEGs, including suppression of proliferation- and
  neurogenesis-associated TFs and activation of senescence and stress regulators.j)
  Transcriptome scoring against human cortical developmental signatures (Velmeshev
  et al., 2023) with WT organoid cells primarily aligning with 2nd trimester signatures,
  whereas PLXNB2−/− organoids also align with postnatal/adult signatures, indicating
  accelerated developmental age.k) Comparative IPA of PLXNB2−/−vs. WT in D36 iNs and
  d42 organoids revealed convergent alterations in neuronal differentiation and brain
  morphology pathways, supporting both models for Plexin-B2-linked neurodevelopmental
  defects.l) Model: Plexin-B2 enforces a cortical mechanical barrier integrated with
  an epigenetic barrier to safeguard the timing of neuronal differentiation. Loss
  of Plexin-B2 lowers this barrier, leading to premature epigenetic reprogramming,
  accelerated neurogenesis, and lineage instability'
article_title: Cortical tension as a mechanical barrier to safeguard against premature
  differentiation during neurogenesis
