figure_title: Functional Gene and Metabolic Pathway Associations with Sleep and Circadian
  Disruption
caption: A. Rodent/Pre-clinical model systems were grouped based on sleep or circadian
  disruption and actual or inferred functional genes and metabolic pathways were stratified
  by sample type. B. Human/Clinical studies were grouped based on the sleep pathology
  diagnosis or sleep characteristics and stratified by sample type. Red circles indicate
  a significant increase in concentration or expression and blue indicate a significant
  decrease in concentration or expression. The size of the circle is scaled so metrics
  that are more frequently mentioned appear larger, and observations were required
  to be mentioned two or more times to appear in the figure. Please see Supplemental
  Figure S5 for functional gene and metabolic pathway responses by sleep pathology
  group (defined in methods), and Supplemental Table S5 for tabulated results for
  functional genes, metabolic pathways and corresponding Class 1 and Class 2 hierarchical
  grouping
