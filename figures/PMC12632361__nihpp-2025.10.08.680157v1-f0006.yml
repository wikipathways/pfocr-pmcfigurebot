figure_title: Model for regulation of reversed fork processing by ATM
caption: See main text for details. Fork reversal (i) generates a regressed arm that
  activates ATM. ATM activation directly or indirectly stimulates nascent strand resection
  by EXO1 and DNA2-WRN. PP2A suppresses ATM activation to constrain resection. Following
  ICL unhooking by the FA pathway (ii), fork restoration (iii) enables completion
  of replication and repair. Potential mechanisms by which resection could promote
  fork restoration are shown
article_title: ATM promotes reversed fork processing during DNA interstrand cross-link
  repair
