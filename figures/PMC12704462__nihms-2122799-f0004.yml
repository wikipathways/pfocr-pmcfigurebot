caption: IPA analysis identified significant sex differences in signaling pathway
  changes associated with visceral hypersensitivity. (A) Comparative analysis was
  performed with genes differentially expressed (>±1.5-fold change, p<0.1) in the
  male and female mice. (B) Significant sex differences in VEGF-induced canonical
  pathways. (C) ) List of pathways upregulated in both sexes following VEGF instillations
  compared to saline-instilled DRG. Female DRG expressed several canonical pathways
  that are less active at baseline, but more activated following VEGF instillations
  compared to male DRG
