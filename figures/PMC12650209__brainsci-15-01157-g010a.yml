figure_title: IRE1α pathway inhibition attenuates high-glucose-induced mitochondrial
  Ca2+ overload.
caption: IRE1α pathway inhibition attenuates high-glucose-induced mitochondrial Ca2+
  overload. (a) Western blot results of p-IRE1α and IRE1α protein expression. (b)
  Quantification of p-IRE1α/IRE1α protein expression. (c) Western blot results of
  Ca2+-transport protein expression. (d–g) Quantification of IP3R, GRP75, MCU, and
  VDAC1 protein expression. (h) Relative mitochondrial Ca2+ amounts determined by
  flow cytometry. (i) Fluorescence showing increased mitochondrial Ca2+ amounts in
  hippocampal neuronal cells exposed to high glucose and improvement after ERS inhibition.
  (Scale bar = 20 μm) (n = 3). (j) Expression levels of synaptic-related proteins.
  (k–m) Expression levels of PSD95, GAP43, and SYP protein in hippocampal neuronal
  cells. Data are presented as mean ± standard deviation. * p < 0.05, ** p < 0.01,
  *** p < 0.001
