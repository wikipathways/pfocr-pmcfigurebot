figure_title: Functional overlap of genes implicated in heritable TAAD.
caption: 'Functional overlap of genes implicated in heritable TAAD. This Venn diagram
  illustrates the distribution and overlap of genes across five major functional categories
  relevant to TAAD pathogenesis: TGF-β signaling, vascular smooth muscle cell (VSMC)
  function and cytoskeletal contractility, extracellular matrix (ECM) remodeling and
  structural integrity, metabolic/ion transport and connective tissue disorders, and
  developmental or transcriptional regulation. Many genes intersect multiple pathways,
  reflecting the complex, pleiotropic mechanisms underlying aortic wall vulnerability.
  Shared nodes, such as FLNA, FBN1, TGFB2, and ZBTB20, highlight genes with multifunctional
  roles that integrate signaling, structural, and regulatory functions in the pathophysiology
  of TAAD [104]'
