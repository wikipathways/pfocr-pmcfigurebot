figure_title: Cell-fate programming responds biphasically to titration of HRASG12V
caption: (A) Simplified diagram of RAS signaling, with a focus on the mitogen-activated
  protein kinase (MAPK) pathway consisting of RAF, MEK, and ERK downstream of RAS.(B)
  Schematic depicting viral delivery strategy of conversion cocktail. NIL (Ngn2, Isl1,
  and Lhx3 neuronal transcription factors) and p53DD (a p53 mutant) are delivered
  on retrovirus. mRuby2-tagged HRASG12V is delivered on lentivirus with expression
  driven by a CAG promoter. A ‘‘filler’’ lentivirus expressing TagBFP is included
  to keep the lentiviral multiplicity of infection (MOI) constant for varying mRuby2-HRASG12V
  amounts. In a twin assay, two identical plates of cells are infected with the conversion
  cocktail. At 4 days post-infection (dpi), mRuby2-HRASG12V expression levels are
  measured, and at 14 dpi, the iMN yield and purity are quantified.(C) Diagram depicting
  expected conversion results with mRuby2-HRASG12V MOI titration.(D) Normalized iMN
  yield at 14 dpi vs. mRuby2-RAS+ geometric mean fluorescent intensity (MFI) at 4
  dpi. Each point represents the mean of n = 3 technical replicates per bioreplicate
  ± standard error of mean (SEM). iMN yield is normalized so the maximum yield for
  each replicate overlays at 1.0 on the y axis, and the mRuby2 levels are normalized
  so the mRuby2+ MFI at the MOI corresponding to the peak iMN yields overlays at 1.0
  on the x axis. n = 4 biological reps per condition
