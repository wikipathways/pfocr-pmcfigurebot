caption: 'Role of TREM-1 in Neuroinflammation and neurodegeneration in SAH: (A) TREM-1
  is activated through ischemic triggers, leading to the downstream activation of
  CARD9 and PAD4 pathways in neutrophils. Activated neutrophils create NETs, which
  further exacerbate neuroinflammation and cause secondary neuronal injury. (B) Ischemic
  triggers lead to activation of microglia, producing excessive proinflammatory cytokines,
  which subsequently impair BBB permeability, infiltration of peripheral immune cells
  and endothelial dysfunction, a major cause of neurodegeneration'
