figure_title: Schematic representation of high glucose-induced effects and resveratrol-mediated
  glioprotection in astroglial cells.
caption: Schematic representation of high glucose-induced effects and resveratrol-mediated
  glioprotection in astroglial cells. High glucose levels induced a pro-inflammatory
  response, characterized by increased cytokine release, likely driven by activation
  of the NFκB pathway. Furthermore, upregulated expression of neuroinflammation-related
  genes, including those encoding TNF-α, IL-1β, NLRP3, COX2, and iNOS, was observed.
  High glucose also increased the expression of genes encoding membrane receptors
  such as TLR4, TNFR1, and IL1R1, which can further activate NFκB, amplifying the
  inflammatory process. Metabolic changes were also observed, including enhanced uptake
  of glucose and glutamate, along with increased lactate production. When cells were
  incubated in high glucose medium in the presence of resveratrol, the inflammatory
  response was notably prevented, possibly through activation of Nrf2 and PGC-1α.
  Under basal conditions, resveratrol also increased HO-1 expression that, along with
  Nrf2, may counteract NFκB-driven inflammation. Created in BioRender. Bobermin, L.
  (2025) https://BioRender.com/hwdl4gj (accessed on 8 September 2025)
