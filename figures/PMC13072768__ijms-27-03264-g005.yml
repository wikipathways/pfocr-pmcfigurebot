figure_title: Enrichment analysis of DEGs between the predicted and experimental groups.
caption: Enrichment analysis of DEGs between the predicted and experimental groups.
  DEGs were identified by comparing predicted or experimental gene expression profiles
  of erlotinib-treated versus untreated lung cancer cell lines. KEGG and Gene Ontology
  (GO) enrichment analyses were performed to assess the biological pathways and processes
  associated with these DEGs. (A) KEGG enrichment of GAN-predicted DEGs after erlotinib
  treatment. (B) GO enrichment of GAN-predicted DEGs after erlotinib treatment. (C)
  KEGG enrichment of actual DEGs after erlotinib treatment. (D) GO enrichment of actual
  DEGs after erlotinib treatment. Both predicted and experimental DEGs show consistent
  enrichment in cell-cycle-related pathways, cellular senescence, and p53 signaling
  pathways, reflecting the known mechanism of erlotinib in inhibiting EGFR signaling,
  inducing G1/S cell-cycle arrest, and suppressing proliferation. The comparison illustrates
  that the model reliably captures the key biological effects of erlotinib treatment
