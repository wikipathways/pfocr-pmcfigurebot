figure_title: Transcriptomic changes and enriched biological processes in Tfap2a-deficient
  OMCD cells revealed by snRNA-seq
caption: (A) Differentially expressed genes in outer medullary collecting duct (OMCD)
  cells. P < 0.05 by Wilcoxon’s rank sum test. (B) Highly enriched biological processes
  identified for 241 genes downregulated in Tfap2a-deficient OMCD cells. Colors represent
  the q value for the depicted process; dot size the number of putative target genes
  associated with the process. The gene ratio (x axis) represents the number of putative
  target genes divided by the total number of genes associated with the respective
  pathway
