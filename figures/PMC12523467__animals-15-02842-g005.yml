figure_title: Effect of tributyrin on SIRT1/NF-κB and JAK2/STAT6 signaling pathways
  in liver of LPS-stressed weanling piglets.
caption: 'Effect of tributyrin on SIRT1/NF-κB and JAK2/STAT6 signaling pathways in
  liver of LPS-stressed weanling piglets. (A–C) The relative gene expression levels
  of SIRT1, NFκBp65, and NFκbiα in the SIRT1/NF-κB signaling pathway. (H–I) The relative
  gene expression levels of JAK2 and STAT6 in the JAK2/STAT6 signaling pathway. (D–J)
  The protein expression levels of key proteins in the SIRT1/NFκB and JAK2/STAT6 signaling
  pathways. (E–G,K–M) The relative expression levels of proteins in the pathways.
  Values with the same lowercase letters indicate no significant difference (p > 0.05),
  and different lowercase letters indicate significant differences (p < 0.05). PT:
  The main effect p-value of tributyrin, PL: The main effect p-value of LPS, PT×L:
  The interaction effect p-value of tributyrin and LPS, and p < 0.05 indicates a significant
  difference. Negative control (NC): Fed with a basal diet and 80 μg/kg of normal
  saline was intraperitoneally injected, Tributyrin (TB): Fed with a basal diet containing
  0.2% tributyrin and 80 μg/kg of normal saline was intraperitoneally injected, Negative
  control LPS treatment (LPS): Fed with a basal diet and 80 μg/kg of LPS was intraperitoneally
  injected, Tributyrin LPS treatment (TL): Fed with a basal diet containing 0.2% tributyrin
  and 80 μg/kg of LPS was intraperitoneally injected'
