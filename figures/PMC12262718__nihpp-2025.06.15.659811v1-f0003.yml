figure_title: Proteomic analysis of isogenic APOE iAstrocytes and iNeurons
caption: A. Study schematic. Two pairs of isogenic iPSCs with either APOE3 or APOE4
  genotype were used to generate iAstrocytes and iNeurons and examine proteomic and
  bioenergetic outcomes. B. S100B (red) and Hoechst (blue) staining in iAstrocytes,
  MAP2 (red) and Hoechst (blue) staining in iNeurons. C. APOE protein expression in
  iAstrocytes and D. APOE protein expression in iNeurons. E. Volcano plot showing
  up and down regulated proteins in iAstrocytes between APOE4 and APOE3. F. Volcano
  plot showing up and down regulated proteins in iNeurons between APOE4 and APOE3.
  G. IPA showing up and down regulated pathways in iAstrocytes between APOE4 and APOE3.
  H. IPA showing up and down regulated pathways in iNeurons between APOE4 and APOE3.
  I. Heatmap of the proteins involved in oxidative phosphorylation comparing APOE
  genotype mediated effects between iAstrocytes and iNeurons. n=5 per group. J. Violin
  plots showing disease associed markers S100A10, S100A6, STAT3, ALDOC, and CD9 in
  iAstrocytes along with BDNF levels in iNeurons. ns=not significant, *p<0.05, **p<0.01,
  ***p<0.001, ****p<0.0001
article_title: Proteomic and metabolic profiling reveals APOE4-dependent shifts in
