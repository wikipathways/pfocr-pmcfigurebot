caption: Metabolomic analysis of ULF in dairy heifers between the CON and PGE2 groups.
  (A) Volcano plots of differential metabolites in ULF between the CON and PGE2 groups.
  (B) The bubble map of differential metabolite pathway enrichment analysis between
  the CON and PGE2 groups. Circles represent metabolic pathways. Darker (redder) circles
  indicate greater changes in metabolites within each pathway, while circle size reflects
  the pathway impact score. Arrows indicate significantly altered pathways. (C) The
  bubble map of metabolite set enrichment analysis between the CON and PGE2 groups.
  (D) KEGG pathway mapping analysis using DAPs and differential metabolites from positive
  ion mode between the CON and PGE2 groups. (E) KEGG pathway mapping analysis using
  DAPs and differential metabolites from negative ion mode
