caption: Diagnostic flow chart from the CTCA group. Diagnostic pathway of patients
  in the CTCA group. Following coronary computed tomography angiography (CTCA), 11
  patients had positive findings, 2 had inconclusive results, and 17 had negative
  findings. Patients with positive or inconclusive results proceeded to invasive coronary
  angiography (ICA). Among those, 8 had positive findings on ICA, leading to percutaneous
  coronary intervention (PCI) in 7 patients and coronary artery bypass grafting (CABG)
  in 1 patient. Patients with negative CTCA results were managed non-invasively
