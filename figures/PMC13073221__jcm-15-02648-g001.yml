figure_title: The measurement-first clinical pathway for identifying patients with
  true resistant hypertension in whom renal denervation may be considered.
caption: The measurement-first clinical pathway for identifying patients with true
  resistant hypertension in whom renal denervation may be considered. The pathway
  emphasizes out-of-office blood pressure (BP) confirmation (preferably ambulatory
  blood pressure monitoring (ABPM)), exclusion of pseudoresistance and secondary hypertension,
  adherence assessment, optimization of pharmacotherapy, shared decision-making, and
  predefined response assessment at 3 and 6 months
