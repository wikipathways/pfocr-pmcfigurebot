figure_title: Schematic diagram of intestinal absorption and transport mechanism of
  butyrate.
caption: Schematic diagram of intestinal absorption and transport mechanism of butyrate.
  This figure shows that butyrate, produced by intestinal microbial fermentation,
  is absorbed by colonic epithelial cells through apical membrane transporters (MCT1,
  SMCT1). It is primarily utilized as an energy substrate to generate ATP via β-oxidation.
  Butyrate functions as a signaling molecule to activate G protein-coupled receptors
  (GPR41, GPR43, GPR109A). This activation regulates the release of anti-inflammatory
  factors (IL-18), energy sensing pathways (AMPK), and inflammatory responses (NF-κB),
  ultimately coordinating local immune cell function and distal organ metabolism
