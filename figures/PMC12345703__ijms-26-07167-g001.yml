figure_title: Crosstalk between reactive oxygen species and reactive nitrogen species
  in plant stress signaling and adaptation.
caption: Crosstalk between reactive oxygen species and reactive nitrogen species in
  plant stress signaling and adaptation. This schematic illustrates the dynamic redox
  signaling network formed by ROS and RNS under stress conditions. In the ROS pathway,
  NADPH oxidase-generated superoxide (O2•−) is converted to hydrogen peroxide (H2O2)
  by superoxide dismutase (SOD), which acts as a signaling molecule inducing oxidative
  stress responses, including gene expression regulation through catalase (CAT) activity.
  In parallel, nitric oxide (NO) in the RNS pathway contributes to redox balance by
  scavenging ROS and modulating protein activity through S-nitrosylation. The interaction
  between O2•− and NO produces peroxynitrite (ONOO−), a reactive species causing oxidative/nitrosative
  stress and macromolecular damage. Importantly, both ROS and RNS affect epigenetic
  regulation by modulating DNA methylation, histone modifications, and chromatin remodeling.
  H2O2 can oxidize histone residues, while NO can S-nitrosylate epigenetic enzymes,
  altering gene expression
