figure_title: Proposed model for biochar-induced coordination of growth and secondary
  metabolism in E.
caption: Proposed model for biochar-induced coordination of growth and secondary metabolism
  in E. purpurea. The biochar-induced improvements in plant growth and nutrient status
  are underpinned by a widespread transcriptional reprogramming, involving the fine-tuning
  of the auxin pathway. This is coupled with a strong activation of JA pathway, which
  is evidenced by the upregulation of biosynthetic genes and the marked accumulation
  of JA, jasmonoyl-isoleucine, and 12-hydroxy-jasmonoyl-isoleucine, leading to the
  upregulation of the key transcription factor MYC2. MYC2 subsequently activates the
  phenylpropanoid pathway, inducing biosynthetic genes and resulting in the accumulation
  of specific phenolic compounds, such as 3 hydroxy 4 methoxycinnamic acid and chlorogenic
  acid methyl ester. This coordinated interplay ultimately enables the simultaneous
  enhancement of plant growth and secondary metabolism. Black arrows indicate the
  direction of process flow; red upward arrows denote upregulated genes; blue/pink
  arrows represent directional connections between functional modules
