figure_title: Molecular basis of thyroid hormone (T3) influence on cardiovascular
  homeostasis.
caption: 'Molecular basis of thyroid hormone (T3) influence on cardiovascular homeostasis.
  T3 binds to the thyroid hormone receptor and triggers both genomic and non-genomic
  actions. Left pathway (genomic): T3–receptor complex activates gene transcription,
  upregulating αMHC, SERCA2, and Na⁺/K⁺ ATPase, which leads to cardiac hypertrophy
  and enhanced cardiovascular function. Right pathway (non-genomic): T3 modulates
  endothelial nitric oxide (NO) production via PI3K/Akt and MAPK signaling, reducing
  systemic inflammation and oxidative stress, which in turn affects mitochondrial
  function. Arrows indicate the direction of molecular signaling and physiological
  consequences of T3 action. Original graphic created by the authors using elements
  and icons licensed under Canva subscription. No third-party copyrighted content
  was used'
