caption: 'Ferroptosis induced by ECH in HCC cells via the TP53/SLC7A11/GPX4 signaling
  pathway. (A) Kaplan-Meier univariate survival analysis of TP53 expression in HCC
  versus normal tissues. (B) The TP53, SLC7A11, and GPX4 mRNA levels in HepG2 and
  Huh7 cells following a 24 h treatment with various concentrations of ECH and Fer-1
  (2 μmol/L). (C) The TP53, SLC7A11, and GPX4 protein expression levels in HepG2 cells
  after 24 h treatment with different concentrations of ECH and Fer-1 (2 μmol/L).
  (D) The protein expression levels of TP53, SLC7A11, and GPX4 in Huh7 cells after
  treatment with different concentrations of ECH and Fer-1 (2 μmol/L) for 24 h. Data
  are represented as mean ± SD (n = 3); ns = no significance, * p < 0.05, ** p < 0.01,
  *** p < 0.001, and **** p < 0.0001 vs. control group. Abbreviations: ECH: echinacoside.
  HCC: hepatocellular carcinoma. TP53: tumor protein 53. Fer-1: ferrostatin-1. SLC7A11:
  solute carrier family 7 member 11. GPX4: glutathione peroxidase 4'
