figure_title: Regulation of FAM134B in diabetes and proinsulin clearance.
caption: Regulation of FAM134B in diabetes and proinsulin clearance. High glucose
  levels in diabetes induce ER stress, activating ER-phagy pathways associated with
  RTN3L and SEC62 while simultaneously inhibiting FAM14B, leading to cell death and
  potential DCM. Chlorogenic acid has been shown to reduce ER stress and cell death
  in DCM models by upregulating FAM134B expression. In DKD, a reduction in ER-phagy
  in renal tubular cells is observed, primarily as a result of decreased levels of
  PACS-2 and FAM134B. PACS-2 plays a crucial role in TFEB nuclear translocation, which
  subsequently enhances FAM134B expression. The absence of PACS-2 exacerbates kidney
  damage in DKD by impairing ER-phagy via the TFEB/FAM134B pathway. UVRAG plays a
  role in proinsulin aggregate clearance, modulating ER-phagy through interactions
  with cargo receptors, including FAM134B, ATL3, and RTN3L. This process facilitates
  Atg8 protein recruitment and promotes receptor oligomerization, enhancing the efficient
  assembly of ER-phagy sites
