caption: 'Apoptotic pathways induced by nanosecond pulse electroporation (nsEP): Apoptosis
  triggered by nsEP primarily follows the intrinsic (mitochondrial) pathway, initiated
  by factors such as intracellular Ca2+ elevation, oxidative and metabolic stress,
  ER disruption, DNA damage, and ROS generation. These signals promote pro-apoptotic
  proteins, suppress anti-apoptotic regulators, collapse mitochondrial membrane potential,
  and induce mitochondrial outer membrane permeabilization (MOMP). Subsequent release
  of cytochrome c enables apoptosome assembly, caspase-9 activation, and downstream
  activation of caspases-3/7, culminating in cell death. In certain cell types, nsEP
  can also activate the extrinsic pathway, where Fas receptor clustering stimulates
  caspase-8. This either directly activates caspases-3/7 (Type I) or engages the mitochondrial
  pathway for amplification (Type II). Adopted from [41]'
