figure_title: Signaling pathways governing the dual regulatory role of PAI-1 in osteogenic
  differentiation.
caption: 'Signaling pathways governing the dual regulatory role of PAI-1 in osteogenic
  differentiation. The schematic illustrates the context-dependent mechanisms by which
  PAI-1 either promotes (left panel, blue arrows) or inhibits (right panel, red arrows)
  osteogenesis. (Left Panel) PAI-1 promotes osteogenesis primarily through the BMP-2/Smad
  signaling pathway (activated by PAI-1 conditioned medium, P-CM) and by stabilizing
  ECM via inhibition of uPA/tPA-mediated proteolysis. Additionally, Metformin (MF)
  enhances osteogenesis by downregulating miR-181a-5p, thereby relieving the suppression
  of PAI-1.(Right Panel) Conversely, under pathological conditions such as diabetes
  (hyperglycemia), glucocorticoid (GC/Dex) administration, or aging, elevated PAI-1
  levels inhibit key osteogenic transcription factors (Runx2, Osterix) and promote
  adipogenesis (via PPARγ). Pharmacological inhibition of PAI-1 (e.g., iPAI-1) or
  genetic knockdown restores osteoblast differentiation by activating MMP-9 and enhancing
  Runx2 expression. Abbreviations: ALP, alkaline phosphatase; BMP-2, bone morphogenetic
  protein-2; BSP, bone sialoprotein; Col1, type I collagen; Dex, dexamethasone; ECM,
  extracellular matrix; GC, glucocorticoids; HIF-1α, hypoxia-inducible factor-1alpha;
  HO, heterotopic ossification; iPAI-1, small molecule PAI-1 inhibitor; JAK-STAT,
  Janus kinase-signal transducer and activator of transcription; MCSF, macrophage
  colony-stimulating factor; MF, metformin; MMP, matrix metalloproteinase; NFATc1,
  nuclear factor of activated T-cells, cytoplasmic 1; NFIC, nuclear factor I C; NF-κB,
  nuclear factor kappa-light-chain-enhancer of activated B cells; OCN, osteocalcin;
  OPG, osteoprotegerin; OSX, osterix; P-CM, PAI-1 transfected cell-conditioned medium;
  PPARγ, peroxisome proliferator-activated receptor gamma; RANKL, receptor activator
  of nuclear factor kappa-B ligand; RANTES, regulated on activation, normal T cell
  expressed and secreted; Runx2, Runt-related transcription factor 2; TGF-β, transforming
  growth factor-beta; tPA, tissue-type plasminogen activator; uPA, urokinase-type
  plasminogen activator; VEGF, vascular endothelial growth factor'
