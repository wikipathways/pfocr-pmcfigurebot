caption: 'Interactions between environmental factors, sex hormones, and immune dysregulation
  in the pathogenesis of sex-biased autoimmune diseases: Environmental triggers—including
  infections, alterations in gut microbiota, exposure to chemicals or pollutants,
  and lifestyle factors—can disrupt immune homeostasis and promote immune dysregulation.
  These effects are further modulated by sex hormones, which influence immune gene
  expression and epigenetic programming in a sex-specific manner. The interplay between
  environmental insults and hormone-mediated regulation contributes to sustained inflammation,
  breakdown of immune tolerance, and heightened susceptibility to autoimmune diseases.
  All arrows indicate activation and forward progression along the pathway'
article_title: 'Understanding Sex Differences in Autoimmune Diseases: Immunologic
