figure_title: Niraparib-induced activation of PI3K-AKT and MAPK pathways is rescued
  by SPHK1 knockdown.
caption: Niraparib-induced activation of PI3K-AKT and MAPK pathways is rescued by
  SPHK1 knockdown. (A) KEGG pathway enrichment analysis of transcriptomic sequencing
  data from MDA-MB-231 cells treated with Niraparib. (B) Western blot analysis of
  the expression levels of Erk and p-Erk pathway proteins in TNBC cell lines (MDA-MB-231
  and MDA-MB-468) treated with Niraparib. (C) Western blot validation showing that
  knockdown of SPHK1 reverses the Niraparib-induced upregulation of SPHK1 and the
  activation of the PI3K/AKT and MAPK signaling pathways in TNBC cells. Statistical
  significance between groups is indicated (*** p < 0.001)
