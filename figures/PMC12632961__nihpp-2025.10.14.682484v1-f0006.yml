figure_title: PARP inhibitor treatment induces aberrant cell cycle progression and
  activation of the ATM/pChk2 pathway
caption: (A) DAPI fluorescent image showing an extreme example of nuclear enlargement
  24 hours after treatment with 15 μM of the PARP inhibitor ABT-888 (right) compared
  to the control (left). B) Average nuclear area (n = 63 wells per condition; unpaired
  t-test) of cells treated with 15 μM ABT-888 compared to control cells. (C) Representative
  ICC images of control (left) and PARP inhibitor-treated (right) hNPCs stained for
  ATM, CHK2, ATR, CHK1, γH2AX, and 53BP1 24 hours after treatment. Scale bar 20 μm.
  (D) The average number of ATM+, CHK2+, ATR+, CHK1+, γH2AX+, and 53BP1+ puncta per
  nucleus is calculated (using the same parameters as used for rAAV described in Figure
  2) and compared for wells infected with PARP inhibitor for 24 hours versus control
  (n = 9 wells per condition; unpaired t-test)
