figure_title: Schematic of six major forms of PCD associated with flap necrosis.
caption: Schematic of six major forms of PCD associated with flap necrosis. Apoptosis,
  pyroptosis, necroptosis, ferroptosis, PANoptosis, and autophagy are major types
  of PCD that have been studied in the context of IRI and flap necrosis. Apoptosis
  is a caspase-dependent programmed cell death process initiated via intrinsic (mitochondrial/Bcl-2
  family-mediated cytochrome c release) or extrinsic (death receptor/FasL-TNFR1-Caspase-8)
  pathways, characterized by cell shrinkage and DNA fragmentation. Pyroptosis is inflammatory
  cell death triggered by Caspase-1/4/5/11 cleavage of gasdermin D, forming membrane
  pores and releasing IL-1β/IL-18, often activated by inflammasomes. Necroptosis is
  a regulated necrosis mediated by RIPK1-RIPK3-MLKL signaling, causing plasma membrane
  rupture and DAMPs release, typically triggered by Caspase-8 inhibition. Ferroptosis
  is an iron-dependent lipid peroxidation-driven death caused by GPX4 inactivation
  or FSP1-CoQ10 axis disruption, linked to redox imbalance and cystine/glutamate antiporter
  (System Xc⁻) inhibition. PANoptosis is a coordinated inflammatory death pathway
  integrating pyroptosis, apoptosis, and necroptosis via ZBP1, AIM2, or NLRP12 sensors,
  engaging caspases, RIPKs, and gasdermins. Autophagy is a lysosome-mediated degradation
  process regulated by ATG proteins to recycle organelles and nutrients that can promote
  survival or death depending on context
