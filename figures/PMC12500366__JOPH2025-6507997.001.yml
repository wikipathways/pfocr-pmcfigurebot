figure_title: (a) Images of the antithrombotic system.
caption: '(a) Images of the antithrombotic system. The vascular endothelium has three
  antithrombotic systems for the most part. Antiplatelet action and vasodilator action:
  angiotensin II is resolved by angiotensin-converting enzyme 2 and produces angiotensin-converting
  enzymes 1–7. Angiotensin-converting enzymes 1–7 activate nitrogen monoxide and prostaglandin
  I2. Anticoagulant action: glycocalyx sprouts on the vascular endothelium. The anticoagulant
  action increases after antithrombin, a plasma protein and tissue factor pathway
  inhibitor, is combined with heparan sulfate on the vascular endothelial cell surface.
  Thrombomodulin shows an anticoagulant action through the activation of protein C.
  Fibrinolytic action: endothelial cells activate fibrinolysis by releasing the tissue
  plasminogen activator. (b) Once vascular endothelial cells are infected by SARS-CoV-2,
  their Weibel–Palade bodies (WPBs) release von Willebrand factor (VWF). VWF assembles
  into unusually large multimers composed of > 200 molecules. Under normal conditions,
  these multimers are rapidly cleaved by ADAMTS13. However, due to the disrupted balance
  between VWF and ADAMTS13 in SARS-CoV-2 infection, the excessively large VWF multimers
  are not efficiently cleaved to the appropriate size, thereby facilitating thrombin
  formation'
