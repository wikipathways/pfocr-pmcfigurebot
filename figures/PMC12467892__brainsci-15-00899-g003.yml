figure_title: Intracellular roles of DJ-1.
caption: Intracellular roles of DJ-1. (1) Under oxidative stress, DJ-1 is translocated
  into the mitochondria to stabilize complex I activity to prevent ROS production.
  (2) DJ-1 can also reduce ROS production by indirectly upregulating SOD1 and Nrf2
  genes via the ERK1/2-Elk1 pathway. (3) DJ-1 protects neurons against toxicity induced
  by glycated α-syn by acting either as a deglycase or glyoxalase or both. (4) DJ-1
  promotes the activity of the enzyme SAHH, leading to detoxifying lipid peroxides
  and inhibiting ferroptosis. (5) DJ-1 modulates neuronal dopamine homeostasis. It
  facilitates dopamine reuptake by increasing the expression of VMAT2 and localization
  of DAT on the terminal ends, thereby inhibiting dopamine-induced toxicity. (6) α-syn
  monomers are efficiently degraded in the presence of DJ-1 by CMA, preventing α-syn
  aggregation and toxicity (created in Biorender.com) [27]
