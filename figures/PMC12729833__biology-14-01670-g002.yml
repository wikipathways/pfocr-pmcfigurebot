caption: 'Transcriptomic analysis of muscle tissue in WT and miR499−/− zebrafish at
  3 months old. (A) Volcano plot showing differentially expressed genes between WT
  and miR499−/− zebrafish (red dots: up—regulated genes; green dots: down—regulated
  genes; blue dots: genes with no significant change); (B) Bubble plot of pathway
  enrichment analysis for differentially expressed genes (Top40). The size of bubbles
  represents gene count, and color represents p–value. Red indicates high expression.
  Green indicates low expression; (C) Hierarchical clustering of the muscle-related
  DEGs in miR499−/− mutants compared with WT; (D) qPCR validation of expression levels
  of selected myosin—related and red muscle—specific genes. ** p < 0.01, * p < 0.05'
