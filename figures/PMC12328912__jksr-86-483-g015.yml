figure_title: Pathway of the oculosympathetic nerve. The schematic diagram shows the
  course of the oculosympathetic nerve from the hypothalamus to the orbit. The first-order
  neurons (blue line) arise from the hypothalamus and descend through the brainstem
  and the spinal cord before synapsing in the ciliospinal center located at C8 to
  T2 levels. The second-order neurons (pink line) exit the spinal cord through the
  ventral roots and ascend through the inferior and middle cervical ganglia toward
  the superior cervical ganglion. The inferior and middle cervical ganglia are connected
  by two or more cords composed of anterior (also known as ansa subclavia) and posterior
  loops. The anterior loops run above the cervical pleura and loop beneath the first
  portion of the subclavian artery. The third-order neurons (green line) originate
  from the superior cervical ganglion and ascend along the internal carotid artery
  to form a nerve plexus. Finally, the nerve enters the orbital fossa through the
  superior orbital fissure, innervating the Müller’s and pupil dilator muscles
