figure_title: Network pharmacology analysis of BDT for depressive disorder treatment.
caption: 'Network pharmacology analysis of BDT for depressive disorder treatment.
  (A) Venn diagram showing 1129 predicted targets of BDT components and 636 depressive-associated
  genes, with 86 overlapping genes identified as potential therapeutic targets. (B)
  Top 20 KEGG pathways enriched among the 86 overlapping genes, ranked by −lg(p-value).
  (C) PPI network of genes from the top 20 enriched pathways. (D) Hub gene identification
  using topological algorithms (BC/CC, Degree) via Cytoscape’s Hubba plugin. The intersection
  of top 10 genes from each metric revealed five core regulators: IL6, HTR1A, HTR2A,
  MAOA, GRIN1. (E) Systems pharmacology network integrating key BDT components (cis-anethole,
  stigmasterol, ferulic acid), their potential protein targets, and regulated pathways
  (serotonergic synapse, tryptophan metabolism). Edge colors denote interaction types:
  green (compound-target), blue (target-pathway)'
