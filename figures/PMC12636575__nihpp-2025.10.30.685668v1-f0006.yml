figure_title: eater mutants have memory deficits and reduced lifespan
caption: 'a. Measurement of short-term memory (STM, left) or long-term memory (LTM,
  right) in wild-type (CantonS) or eater mutants (eater1). eater mutants (eater1)
  exhibited impairments in both STM and LTM. Unpaired t test was performed for data
  analysis.b. Comparison of lifespan between wild-type (CantonS) and eater mutant
  (eater1) flies. eater mutants showed a reduced lifespan relative to wild-type. Log-rank
  (Mantel-Cox) test was performed for data analysis.c. Schematic illustration of hemocyte-glia
  interaction during sleep. Lipid droplets can be eliminated in two distinct pathways.
  One pathway involves lipid catabolism through beta-oxidation in the cortex glia.
  The other pathway involves the uptake of lipid droplets from the cortex glia by
  hemocytes via Eater. When hemocyte-mediated lipid uptake is disrupted, lipid droplets
  accumulate in cortex glia, leading to increased protein acetylation and ROS levels
  while reducing NAD+ levels. This metabolic regulation between glia and hemocytes
  is crucial for maintaining proper brain lipid metabolism. Sleep promotes this metabolic
  regulation and is reduced when the process is disrupted. ns: not significant (p>0.01);
  *p<0.1; **p<0.01, ***p<0.001. ****p<0.0001. Bars in graphs: the median'
