figure_title: GPR31 N-glycosylation at Asn5 is required for GPR31-Gαi3 interaction
  and pro-MASH function
caption: '(A) Illustration of the trafficking of GPR31 onto cytomembrane. (B and C)
  The immunoblot of GPR31 in hepatocytes treated with or without sumoylation inhibitor
  ML-792 (B), or N-linked glycosylation inhibitor tunicamycin or O-linked glycosylation–specific
  inhibitors (benzyl-α-GalNac and OSMI-1) (C). n = 3. (D and E) GPR31 is glycosylated
  in mouse (D) and human (E) liver tissues evidenced by the mobility change after
  PNGase F treatment. n = 3 for D and n = 5 for E. (F) GPR31 is glycosylated in primary
  cultured mouse hepatocytes evidenced by the mobility change after PNGase F treatment.
  n = 3. (G) Illustration of potential GPR31 glycosylation site at Asn5 and Asn158
  based on bioinformatic analysis of conserved glycosylation motif N-X-S/T. (H) Validation
  of Asn5 and Asn158 as the glycosylation sites in GPR31 by using PNGase F treatment.
  n = 3. (I) The colocalization of GPR31 and Na/K ATPase. Scale bars: 10 μm. n = 3.
  (J) Co-IP for the interaction of GNAI3 and GPR31 or its nonglycosylated mutants.
  n = 3. (K) Effect of GPR31 or its nonglycosylated mutants’ overexpression on the
  phosphorylation of key proteins in the MAPK signaling pathway in hepatocytes. n
  = 3. (L) BODIPY staining for quantification by flow cytometry in GPR31-WT and its
  nonglycosylated mutants’ overexpressed hepatocytes. n = 3. (M) KEGG pathway–based
  phenotypic characterization for hepatocytes transfected with GPR31-WT and its nonglycosylated
  mutants. n = 4. Data are shown as mean ± SEM. **P < 0.01; ***P < 0.001'
