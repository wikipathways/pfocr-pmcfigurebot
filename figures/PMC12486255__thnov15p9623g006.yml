figure_title: ASIC1a-CaN-HSP70 axis disrupts SIRT3 mitochondrial import and function.
caption: 'ASIC1a-CaN-HSP70 axis disrupts SIRT3 mitochondrial import and function.
  (A) GSEA results demonstrating the status of calcium signaling pathway by KEGG database.
  (B) The protein levels of HSP70, CaN and β-actin in chondrocytes were determined
  by western blot. (C) The protein levels of SIRT3 and VDAC1 in chondrocytes were
  determined by western blot. (D) Co-IP analysis of the interaction between CaN and
  HSP70. (E) Co-IP analysis of the interaction between SIRT3 and HSP70. (F) Co-IP
  analysis of the interaction between HSP70, SIRT3 and CaN. (G) SIRT3 enzymatic activity
  in chondrocytes was measured using a fluorometric SIRT3 activity assay kit. (H)
  Fluorescent dots transfected with mt-Keima adenovirus were observed by confocal
  microscopy in chondrocytes. The relative ratio of red to green fluorescence was
  quantified. Scale bar: 10 μm. (I) MitoSOX levels in chondrocytes were observed by
  confocal microscopy. Scale bar: 100 μm. (J) The mtDNA copy number in chondrocytes
  was measured using a Mitochondrial DNA Copy Number Quantification qPCR Assay Kit.
  (K) The intracellular ATP production was measured using an ATP production assay
  Kit. (L) The protein levels of Pyrin, ZBP1, ASC and β-actin in chondrocytes were
  determined by western blot. Data were presented as mean ± SD and analyzed by Student''s
  t-test or one-way ANOVA. *p < 0.05, **p < 0.01, ***p < 0.001'
