figure_title: p53 regulates gene expression in the presence of HPV.
caption: p53 regulates gene expression in the presence of HPV. (A) Volcano plot shows
  significant differentially expressed genes (DEGs, blue = downregulated, red = upregulated,
  p < 0.01) in UM-SCC-47 upon p53 knockdown. (B) Volcano plot for DEGs in UPCI-SCC-090
  upon p53 knockdown. (C) Heatmap illustrates average expression levels of shared
  DEGs in both cell lines. Green shades indicate downregulated genes, while red shades
  indicate upregulated genes. Values are represented as log2 fold-change (log2FC),
  with those exceeding |1| capped at +1 or −1 for illustrative clarity. Rows are genes
  and columns are experimental conditions. The cellular processes related to each
  gene are shown on the left. Pwy = pathway, Metab = metabolism. TCEA1P2 is a pseudo-gene
  with no known function. (D) mRNA expression levels of p53 target genes CDKN1A and
  INPP5D decrease upon p53 knockdown and are restored (and elevated) following E6
  knockdown in UM-SCC-47 HPV+ HNSCC cells. (E) Normalized RNA-sequencing read counts
  for CDKN1A, INPP5D, GDF15, ACLY, RNF128, TM7SF3 in isogenic HPV-negative PCI-13
  HNSCC cell lines with either p53-WT or p53G245D (loss-of-function mutant) expression.
  [Color figure can be viewed at wileyonlinelibrary.com]
