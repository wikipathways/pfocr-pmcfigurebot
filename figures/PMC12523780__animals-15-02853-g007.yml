figure_title: Kyoto Encyclopedia of Genes and Genomes (KEGG) enrichment analysis of
  DEGs in the hepatopancreas of gibel carp between the BA600 and BA0 groups.
caption: Kyoto Encyclopedia of Genes and Genomes (KEGG) enrichment analysis of DEGs
  in the hepatopancreas of gibel carp between the BA600 and BA0 groups. Significantly
  enriched KEGG pathways of DEGs (A), up-regulated DEGs (B), and down-regulated DEGs
  (C) in the comparison of BA600 vs. BA0. X-axis represents the proportion of DEGs
  annotated in a certain pathway relative to all DEGs. Y-axis represents the enriched
  KEGG pathway term. The color and area of the bubbles represent the enrichment degree
  and the number of DEGs enriched in one KEGG pathway, respectively. KEGG pathways
  with corrected p-values < 0.05 are screened, and the top 20 significantly enriched
  GO terms are displayed
