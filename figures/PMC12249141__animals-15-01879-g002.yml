figure_title: Differential LincRNAs expression analysis.
caption: Differential LincRNAs expression analysis. (A–C) Volcano plot of gene expression
  in the NC vs. M, NC vs. SI, and SI vs. M comparisons. Numbers of upregulated and
  downregulated differentially expressed LincRNAs. The left blue bars represent the
  numbers of upregulated genes; the orange bars represent the numbers of downregulated
  genes. (D) GO pathway enrichment analysis of the DELincRNAs in the M vs. SI comparison.
  (E) KEGG pathway enrichment analysis of the DELincRNAs in the M vs. SI comparison.
  (F) Based on the comparison of binding sites in the seed region of miR-128-3p, Cytoscape
  software was used for network interaction analysis, and the regulatory network of
  miR-128-3p was mapped. (G) Venn diagrams of DELincRNAs identified by RNA-seq in
  the NC vs. M, NC vs. SI, and SI vs. M comparisons
