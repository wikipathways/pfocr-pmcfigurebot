figure_title: Early-life wheeze trajectory phenotypes and mechanisms.
caption: 'Early-life wheeze trajectory phenotypes and mechanisms.Four phenotypes are
  identified, including infrequent, transient, late-onset, and persistent. Compared
  to the infrequent wheeze trajectory phenotype: the persistent wheeze trajectory
  phenotype has an upregulation of the mast cell activation pathway, type-2 inflammation,
  and ciliated epithelial function; the late-onset wheeze trajectory phenotype has
  a downregulation of glucose metabolism and insulin signaling pathways; and the transient
  wheeze trajectory phenotype has an upregulation of the interferon signaling pathway'
