figure_title: Somatic alteration patterns in JAK-STAT pathway genes among colorectal
  cancer (CRC) patients stratified by ancestry and diagnostic age.
caption: Somatic alteration patterns in JAK-STAT pathway genes among colorectal cancer
  (CRC) patients stratified by ancestry and diagnostic age. This figure presents oncoplots
  illustrating the distribution of mutations affecting major components of the JAK-STAT
  signaling pathway in CRC. Mutation profiles are shown separately for early- (EOCRC)
  and late-onset (LOCRC) disease and for Hispanic/Latino (H/L) and Non-Hispanic White
  (NHW) populations. Each panel depicts mutation classes, tumor mutational burden
  (TMB), and FOLFOX treatment status for (a) 122 H/L patients diagnosed before age
  50, (b) 139 H/L patients diagnosed at or after age 50, (c) 652 EOCRC NHW patients,
  and (d) 1515 LOCRC NHW patients
