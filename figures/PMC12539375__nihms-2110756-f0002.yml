figure_title: The Canonical TGF-β Signaling Pathway
caption: Canonical TGF-β signaling is initiated by binding of the TGF-β ligand to
  a heteromeric complex of type II (TGF-βRII) and type I TGF (TGF-βRI) receptors.
  Activated TGF-βRII phosphorylates and activates TGF-βRI. Activated TGF-βRI in turn
  phosphorylates and activates the receptor-activated Smads, Smad2 and Smad3. Smad7
  acts as a competitive inhibitor for binding with TGF-βRI. Activated (phosphorylated)
  Smad2 and Smad3 detach from TGF-βRI and form a complex with Smad4. The trimeric
  TGF complex then translocates to the nucleus and regulates lung fibrosis, EMT, M1
  macrophage polarization, and endothelial cell regeneration via diverse molecular
  mechanisms. Smad7 can also prevent transcriptional activity of the nuclear TGF complex
