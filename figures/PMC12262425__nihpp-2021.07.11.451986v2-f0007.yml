figure_title: Inhibition of nucleotidase and alkaline phosphatase activity by INAM.
caption: Inhibition of nucleotidase and alkaline phosphatase activity by INAM. A)
  Nucleoside monophosphate breakdown to bases by nucleotidases (Phm8, Sdt1, Isn1),
  alkaline phosphatases (Pho8) to produce nucleosides, followed by the action of purine
  nucleoside phosphorylase (Pnp1) and uridine nucleosidase (Urh1) to release the bases
  and either ribose or ribose-1-phosphate. B) Quantitation of guanosine, cytidine,
  and hypoxanthine levels following 1 hr treatment with 0, 25, or 100 mM INAM. The
  mean of the control samples without INAM was normalized to 1.0. C) Nicotinamide
  mononucleotide (NMN) is broken down to NAM by the same set of enzymes that degrade
  NMPs as part of the NAD salvage pathway. D) Quantitation of NMN and NAD+ levels
  by mass spectrometry following 1 hr treatment with 25 or 100 mM INAM. The control
  was normalized to 1.0. E) INAM inhibition of recombinant Sdt1 and Phm8 nucleotidase
  activity on CMP in vitro. F) INAM inhibition of recombinant Sdt1 nucleotidase activity
  on NMN in vitro. G) INAM inhibition of alkaline phosphatase activity in whole extracts
  isolated from WT, pho8Δ, pho13Δ, and pho8Δ pho13Δ strains using p-nitrophenyl phosphate
  (pNPP) as a substrate. In all graphs, error bars represent standard deviations.
  Significance p-values were *<0.05, **<0.005, ***<0.005, as calculated using 1-way
  Anova
