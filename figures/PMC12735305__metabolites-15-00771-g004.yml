figure_title: Resveratrol attenuated high glucose-induced downregulation of cytoprotective
  anti-inflammatory pathways.
caption: 'Resveratrol attenuated high glucose-induced downregulation of cytoprotective
  anti-inflammatory pathways. Cells were pre-treated with resveratrol (RSV; 10 µM)
  for 24 h and subsequently exposed to high glucose medium (HG; 12 mM) in the presence
  or absence of RSV (10 µM) for an additional 24 h. The mRNA expressions of genes
  encoding Nrf2 (A), HO-1 (B), and PGC-1α (C) were evaluated. The results represent
  the means ± S.D., analyzed by one-way ANOVA. Values of p < 0.05 were considered
  significant (n = 7 independent cultures with at least duplicate treatments, as shown
  by the dispersion of the data points in the graphs). Control: DMEM, 6 mM glucose;
  RSV: DMEM, 6 mM glucose + 10 µM RSV; HG: DMEM, 12 mM glucose; HG + RSV: DMEM, 12
  mM glucose + 10 µM RSV. * indicates a statistical difference between the groups
  (p-values are provided in the Results)'
