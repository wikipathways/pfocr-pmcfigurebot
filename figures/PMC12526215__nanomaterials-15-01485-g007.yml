figure_title: Biomimetic interfacial engineering strategies for enhanced photocatalytic
  nitrogen fixation.
caption: Biomimetic interfacial engineering strategies for enhanced photocatalytic
  nitrogen fixation. (a) Schematic of a purple-membrane (PM)-coated CeO2 nanoparticle
  system mimicking light-driven ATP-free proton/electron coupling for N2 reduction.
  The archaeal PM acts as a bio-light harvester, enabling photogenerated electrons
  to reduce N2 on ceria surfaces via an enzyme-like multi-channel reaction pathway.
  Organic acids (formic acid, lactic acid, glycerol) serve as hole scavengers to maintain
  redox balance. Reproduced with permission [66]. Copyright © 2025 American Chemical
  Society. (b) Comparison of enzymatic and artificial coordination environments. The
  upper panel illustrates the Fe–S–Mo–C cofactor in nitrogenase with ATP-powered electron
  transfer for *N2 reduction, while the lower panel shows a dehydrated Zr6O6-cluster-based
  MOF (UiO-66-(SH)2) with μ-N–Zr binding, enabling visible-light-driven NRR via a
  proton-assisted multi-electron process. Reproduced with permission [81]. Copyright
  © 2025 Wiley-VCH. (c) Schematic of the natural nitrogenase complex comprising the
  Fe protein and MoFe protein. ATP hydrolysis induces conformational changes at the
  docking interface, enabling stepwise electron delivery from the Fe protein to the
  MoFe protein and finally to *N2 for reduction to NH3. Reproduced with permission
  [88]. Copyright © 2018 American Chemical Society. (d) A tandem-interface photocatalyst
  composed of Au nanocrystals anchored on ultrathin TiO2 nanosheets with abundant
  oxygen vacancies (OVs). Hot electrons from surface plasmon resonance (Au) and chemisorption
  activation at OVs synergistically weaken the N≡N bond, facilitating selective NH3
  formation. Apparent quantum efficiency reaches 0.82% at 550 nm, highlighting the
  catalytic advantages of interface synergy and visible-light harvesting. Reproduced
  with permission [88]. 2018 American Chemical Society
