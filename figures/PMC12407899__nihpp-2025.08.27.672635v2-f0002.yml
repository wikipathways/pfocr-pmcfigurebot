caption: 'a) Iterative experimental–computational workflow: a genome-wide pooled CRISPR
  screen produces candidate hits, followed by a focused “glossary” FlexPlex experiment
  to pair protein and transcriptome data, which is then used to build predictive models.
  These models are applied to genome-wide Perturb-seq (GWPS) datasets and validated
  with additional FlexPlex experiments. b) Experimental design for the genome-wide
  pooled CRISPRi screen measuring intracellular phosphorylated RPS6 (pRPS6). c) Volcano
  plot showing fold-change and adjusted p-value for all perturbations, comparing high
  versus low pRPS6 fractions. d) mTOR pathway diagram with components colored by their
  pooled screen enrichment score (RRA rank) in the high or low pRPS6 fractions. e)
  Guide-level fold changes for selected hits, with red lines indicating positive fold
  changes (enriched in high-pRPS6 fraction) and blue lines indicating negative fold
  changes (enriched in low-pRPS6 fraction)'
