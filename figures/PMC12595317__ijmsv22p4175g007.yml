figure_title: Overview of the effect of tripeptide GPE on the PI3K/Akt signaling pathway.
caption: Overview of the effect of tripeptide GPE on the PI3K/Akt signaling pathway.
  Ligand-induced phosphorylation of the RTKs induces recruitment of the regulatory
  subunit of PI3K (p85) to the RTKs, relieving the inhibitory interaction with the
  catalytic subunit (p110) and resulting in activation. The G-protein beta and gamma
  subunits (Gβγ) subunits downstream of G-protein-coupled receptors (GPCRs), also
  trigger activation of p110. Activated PI3K enzymes are brought to the membrane,
  where phosphatidylinositol 4,5-bisphosphate (PIP2) is converted into phosphatidylinositol
  3,4,5-trisphosphate (PIP3). Production of PIP3 enables phosphorylation of Akt at
  threonine 308 (T308) by 3-phosphoinositide-dependent protein kinase-1 (PDK1) and
  at serine 473 (S473) by the mechanistic target of rapamycin complex 2 (mTORC2).
  PIP3 also interacts with proteins possessing a pleckstrin homology (PH) domain,
  such as protein kinases, including Akt and Bruton's tyrosine kinase (BTK). Activation
  of downstream effectors, including the mechanistic target of rapamycin complex 1
  (mTORC1) and ribosomal protein S6 (S6), regulates protein synthesis, cell growth,
  and metabolism. Phosphatase and tensin homolog (PTEN) dephosphorylates PIP3 back
  to PIP2, thereby regulating the pathway. Illustration created with BioRender.com
