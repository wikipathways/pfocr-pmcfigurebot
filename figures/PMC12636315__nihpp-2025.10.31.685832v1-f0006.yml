figure_title: Genome mining for other RiPP-lipoproteins
caption: 'a Diagram for RiPP-lipoprotein maturation. Shown here is an example of the
  triacylated form of the lipoprotein [C16:0, C16:0, C16:0]. b Bioinformatic pipeline
  for RiPP modifying enzyme directed discovery of RiPP-lipoproteins. During the SSN
  generation process, similar sequences can be filtered out using Uniref90 database
  or using a representative node network. c SSN of MNIO-associated lipoproteins (Cytoscape
  file provided as Dataset 2). Ten of the largest clusters are annotated I-X. Clusters
  V-IX correspond to putative non-RiPP lipoproteins that are found in (or adjacent
  to) MNIO-containing gene clusters. V: BON-domain containing protein in bufferin
  BGC. VI: LPS translocon maturation chaperone LptM in bufferin BGC. VII: Glycine
  zipper two transmembrane domain-containing protein in bufferin BGC. VIII: TssQ family
  T6SS-associated lipoprotein in bufferin BGC. IX: Hypothetical protein in bufferin
  BGC. The full list of sequences can be found in Supplementary Table 6. d Representative
  examples of predicted BGCs encoding RiPP-lipoproteins from the different precursor
  peptide clusters. The characterized RiPP families corresponding to chryseobasins,
  bufferins, and oxazolins all show examples of lipidation via the SPII pathway'
