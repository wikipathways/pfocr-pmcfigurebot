figure_title: c-Myc transcriptionally inhibits PP2Ac expression.
caption: 'c-Myc transcriptionally inhibits PP2Ac expression. (A) The effects of c-Myc
  knockdown on the expression of pS62-c-Myc, PP2Ac, p-GSK3β, β-catenin and p-AKTT308
  in 8305C and A375 cells were determined by Western blotting assays. (B) The TERT
  knockdown on the expression of c-Myc, pS62-c-Myc, PP2Ac, p-GSK3β, β-catenin and
  p-AKTT308 in 8305C and A375 cells were determined by Western blotting assays. GAPDH
  was used as a loading control and the western blotting is representative of three
  independently preformed experiments. (C) The effects of c-Myc knockdown on PP2Ac
  expression in 8305C and A375 were determined by qRT-PCR assays. 18S rRNA was used
  as a normalized control. Data were shown as mean ± SD. **, P <0.01; ***, P <0.001
  (n = 3). Results with statistical significance were obtained through the use of
  two-side unpaired Student''s t-tests. (D) Dual-Luciferase Reporter assay system
  was used to test the function of ectopic expression of c-Myc on promoter activity
  of PP2Ac in 8305C and A375 cells. The empty vector was used as the control, and
  all the ratio of the Luc/Renilla activity were shown as means ± SD. ***, P <0.001
  (n = 3). Statistical significance between groups was determined by two-side unpaired
  Student''s t-test. (E) 8305C and A375 cells expressing c-Myc and control cells were
  subjected to ChIP-qPCR assays using c-Myc antibody. P1-P4 indicated four different
  regions of PP2Ac promoter (P1: -143/0; P2: -786/-642; P3: -1161/-941; P4: -1689/-1489)
  (upper panel). Fold enrichment was shown as mean ± SD, **, P <0.01; ***, P <0.001
  (n = 3). Statistical significance between groups was determined by two-side unpaired
  Student''s t-test. (F) c-Myc can transcriptionally inhibits the transcription of
  PP2Ac to suppress the dephosphorylation activity of PP2A on p-ERK, p-AKTT308, and
  p-GSK3β, protecting c-Myc from ubiquitination degradation pathway'
