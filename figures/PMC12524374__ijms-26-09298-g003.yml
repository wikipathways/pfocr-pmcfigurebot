figure_title: Biological Processes GO terms enrichment and The KEGG pathway analysis
  for upregulated and downregulated genes.
caption: 'Biological Processes GO terms enrichment and The KEGG pathway analysis for
  upregulated and downregulated genes. (A) The most enriched Gene Ontology (GO) terms
  for all differentially expressed genes (DEGs) are categorized into three primary
  levels: biological process (BP), cellular component (CC), and molecular function
  (MF). The GO enrichment results have been transformed into negative logarithm scores
  to facilitate interpretation. (B) Enriched KEGG pathways were identified by analyzing
  all differentially expressed genes (DEGs) across various developmental stages using
  the Bioinformatics website (https://www.bioinformatics.com.cn, accessed on 15 June
  2025). In the resulting figure, the columns and rows represent the enriched pathway
  terms and the corresponding rich factor, respectively. The size of the circles indicates
  the number of DEGs enriched within each specified KEGG pathway, while the color
  coding reflects the q-value (Corrected p-value) from the enrichment tests'
