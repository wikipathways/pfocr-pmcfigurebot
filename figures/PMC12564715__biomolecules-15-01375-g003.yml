figure_title: Illustration of the structure and diversity of Siglecs.
caption: 'Illustration of the structure and diversity of Siglecs. There are two main
  groups of Siglecs: those that are highly conserved, as shown on the left, and a
  more diverse group of CD33-related Siglecs, as shown on the right. All Siglecs have
  an extracellular V-type Ig domain and at least one C2-type Ig domain. Many Siglecs
  also contain at least one cytoplasmic ITIM domain, involved in immunosuppressive
  signaling. The 3 Siglecs (Siglecs14/15/16) have a positive charge in their transmembrane
  domains, mediating association with DAP12 to activate immune responses. This causes
  recruitment and activation of SYK, leading to phosphorylation of protein kinases
  of downstream targets resulting in cell activation, while the remaining 9 Siglecs
  carry ITIM motifs, whose domains are phosphorylated by Src family kinases, which
  subsequently lead to the recruitment of SH2 domains containing phosphatases SHP-1
  and/or SHP-2, which dephosphorylate downstream components of the immunostimulatory
  pathway, thereby inhibiting the immune response'
