figure_title: The ways to evaluate efficacy of metabolomics-guided nutrition.
caption: 'The ways to evaluate efficacy of metabolomics-guided nutrition. The proposed
  concept of anti-aging precision nutrition includes three options for assessing individual
  efficacy. Assessing the metapathway state through either: (a) measuring biomarkers
  of metapathway state (BMS) levels or (b) metabolite set enrichment analysis (MSEA)
  based on metabolome profiling. Both are related to surrogate endpoints and are often
  impractical for routine use due to their indirect relationship with age and, in
  the case of MSEA, high analytical complexity. (c) Metabolome fingerprinting—a direct
  and comprehensive method that measures the primary outcome of interest: a change
  in metabolic age. This is the most consistent and promising approach for directly
  evaluating the slowing of aging'
