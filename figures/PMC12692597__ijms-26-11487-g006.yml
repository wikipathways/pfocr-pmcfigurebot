figure_title: OX40/OX40L Axis.
caption: 'OX40/OX40L Axis. These molecules belong to the tumor necrosis factor (TNF)
  α receptor superfamily. OX40 (CD134) is a costimulatory molecule expressed on activated
  T cells, including both effector T cells and Tregs. OX40 displays a dual function
  in health and disease. Under physiological conditions, it modulates Tregs to maintain
  immune balance and prevent autoimmunity. In contrast, in AD, OX40 activation impairs
  Treg function, allowing inflammatory processes to persist unchecked. Its expression
  begins 24–72 h after T cells encounter an antigen, where it becomes essential for
  sustaining T cell activation and survival. The ligand for OX40, OX40L (CD134L/CD252),
  is expressed in various antigen-presenting cells (APCs) such as DCs, Langerhans
  cells, and macrophages. Additionally, activated B lymphocytes and T lymphocytes
  can also express OX40L, further amplifying immune responses through a positive feedback
  loop. Although OX40L expression is not constitutive, it can be induced via multiple
  pathways, including CD40 and TLR signaling, as well as cytokines like IL-18 and
  TSLP, which are released in response to barrier dysfunction or tissue damage. This
  pathway also facilitates the generation of memory T cells, ensuring rapid immune
  responses upon re-exposure to allergens [111]. From left to right: antigen presentation
  acts as the first signal in T cell activation. The interaction occurs between APCs—like
  DCs—and T cells (left panel). Once the T cell is activated, it begins to express
  OX40 (CD134), a costimulatory molecule. The APC expresses the ligand for OX40, known
  as OX40L (CD134L). The binding of OX40 to OX40L provides a second signal, which
  is critical for sustained T cell activation, clonal proliferation, and differentiation
  into effector subtypes (right panel)'
