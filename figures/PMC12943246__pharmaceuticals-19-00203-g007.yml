figure_title: GDL blocked the PDGFRβ/ERK/VEGFA signal axis in LX-2 cells.
caption: 'GDL blocked the PDGFRβ/ERK/VEGFA signal axis in LX-2 cells. (A–C1) Protein
  expression of p-PDGFRβ, PDGFRβ, p-ERK, ERK, and VEGFA in LX-2 cells. (D) mRNA expression
  of VEGFA in LX-2 cells. (E) mRNA expression of PDGFRβ in LX-2 cells after PDGFRβ
  overexpression. (F–H) mRNA expression of α-SMA, collagen I, and VEGFA in LX-2 cells
  after PDGFRβ-OE. (I–K1) Protein expression of α-SMA, p-ERK, ERK, and VEGFA in LX-2
  cells after PDGFRβ-OE. Data were presented as mean SD, n = 3; ** p < 0.01, vs. Normal
  group. # p < 0.05, ## p < 0.01, vs. Model group. && p < 0.01, vs. GDL group. GDL
  reduced PDGFRβ/ERK signal pathway in LX-2 cells, inhibited the expression of messenger
  molecule VEGFA. These data supported PDGFRβ as a functional signaling hub linking
  the HSC activation to VEGFA secretion'
