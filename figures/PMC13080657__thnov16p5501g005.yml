figure_title: CS treatment accelerates DNA repair.
caption: CS treatment accelerates DNA repair. (A) Violin plots showing the UCell scores
  of DNA repair pathway in different cell types of aged-CS and aged groups. (two-sided
  Wilcoxon rank-sum test). (B) Following γ-irradiation, γH2AX staining was performed
  on HSPCs isolated from DMSO- or CS-treated mice at specific intervals (red). DAPI
  (blue) was to indicate nuclei (n = 3, each group). (Scale bar, 5 μm.) (C-F) The
  average number of γH2AX foci (C) and the average MFI intensity value in each sample
  at 1 (D), 2 (E) and 6 h (F) were summarized and indicated. All the data were summarized
  from at least three individual mice and for a total of no less than 80 cells. (G-K)
  The post irradiation alkaline comet results for HSCs from DMSO or CS treated at
  1, 2, 6 h (G). Summary of the percentage of DNA in tails (H) and the olive distance
  (I, J and K) for HSCs from experimental and control mice at each time period (n
  = 3, each group). Error bars indicate the mean ± SEM. Comparisons between groups
  were performed via the Mann-Whitney test. *P < 0.05, **P < 0.01, ***P < 0.001, and
  ****P < 0.0001 were considered statistically significant, whereas 'ns' indicates
  no significance (D-F and H-K)
