figure_title: Kynureninase (KYNU) is highly expressed in glioblastoma (GBM) and strongly
  correlates with complement cascade-related genes.
caption: Kynureninase (KYNU) is highly expressed in glioblastoma (GBM) and strongly
  correlates with complement cascade-related genes. (A) KYNU mRNA expression was compared
  between normal brain tissue (Normal, N = 5) and primary GBM tissue (Primary, N =
  154) using TCGA-GBM data accessed via the GDC portal. Differences in mean expression
  were estimated using nonparametric bootstrap resampling (10,000 iterations). Each
  dot represents an individual sample; large central points indicate group means.
  Bootstrapped 95% confidence intervals (CIs) for the mean difference are reported
  in the main text. Statistical significance was inferred if the 95% CI did not include
  zero. * p < 0.05. (B) Gene set enrichment signature pathways associated with KYNU
  expression in TCGA-GBM samples, categorized by KEGG pathway annotations. (C) Gene
  set enrichment analysis (GESA) and (D) enrichment score plot for the complement
  and coagulation cascade gene set associated with KYNU expression. (E) Correlation
  plot showing genes significantly associated with KYNU expression (p < 0.01). Additional
  details are provided in the Materials and Methods Section
