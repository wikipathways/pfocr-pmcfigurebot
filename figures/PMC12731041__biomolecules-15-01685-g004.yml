figure_title: Immunomodulatory effects of ovarian cancer ascites on the tumour microenvironment
  and the role of HCMV infection.
caption: Immunomodulatory effects of ovarian cancer ascites on the tumour microenvironment
  and the role of HCMV infection. (A) There is an increased frequency of immunosuppressive
  regulatory T-cell (Treg) CD4 + CD25 + CD127- subsets in ascites [1,15,145,146].
  (B) The fluid of ovarian ascites contains high levels of interleukin-10 (IL-10)
  and transforming growth factor-beta (TGF-β) which promotes an immunosuppressive
  profile [1,147]. (C) Findings from a preprint suggest that IL-10 in ascites may
  promote metastasis via the STAT3/ERK1/2 pathway [147]. (D) Infection with HCMV has
  been shown to increase the production of interleukin-6 (IL-6), (E) which has been
  found to act as an inflammatory mediator via its high levels present in ascites
  [1,145,146]. (F) The IL-6 cytokine also contributes to the immunosuppressive nature
  of ascites via the expansion of TNFR2+ Treg subsets which causes a dampened immune
  response [1,145]. This highlights the balance and interactions between pro-inflammatory
  and immunosuppressive components of ascites. Created in https://BioRender.com
