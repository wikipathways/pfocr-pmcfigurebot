figure_title: STING agonist-induced transcriptomic changes in vivo
caption: C57Bl/6 mice were injected intramuscularly with PBS, CDA, diABZI or DMXAA
  and total RNA from draining lymph nodes harvested at indicated time point. A. Levels
  of indicated mRNA transcript in draining lymph nodes at 5 h, 24 h, or 72 h for indicated
  treatment as determined by qPCR. Data presented are mean ± SEM fold changes relative
  to PBS treated control animals. Statistical significance was determined using a
  mixed effects ANOVA with Tukey’s correction for multiple comparisons of log transformed
  fold changes between stimuli at each time point (*p < 0.05; **p < 0.01); B. Number
  of mRNAs significantly up or downregulated more than twofold relative to PBS treatment
  following indicated treatment as determined by hybridization array; C. Principal
  component analysis of transcript fold changes for indicated stimulus and time point;
  D. Venn diagram of transcripts significantly upregulated for indicated stimulus
  at 5 h and 24 h; E. Signaling pathways displaying a predicted Z score > 1 for all
  three stimuli at 5 h and 24 h as determined by Ingenuity Pathway Analysis; F. Pathways
  displaying a predicted Z score > 1 following only DMXAA treatment at 5 h and 24
  h
