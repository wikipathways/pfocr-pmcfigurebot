figure_title: Characterization of fibroblasts during LSCC progression.
caption: Characterization of fibroblasts during LSCC progression. A UMAP plot of fibroblast
  subsets colored by cell type. B Dot plots showing the expression of canonical marker
  genes across each fibroblast subset. C Bar plots showing the frequency (left) and
  proportion (right) of each fibroblast subset in different tissues. D Changes in
  infiltration proportion of POSTN+ fibroblasts (above) and CFD+ fibroblasts (below)
  in different tissues. E Heatmap displaying pathway activities of each fibroblast
  subset, quantified as normalized enrichment scores (NES) from Gene Set Enrichment
  Analysis (GSEA). F Pathway enrichment in POSTN+ versus CFD+ fibroblasts, assessed
  by GSVA score (two-sided unpaired limma-moderated t-test). G Kaplan-Meier curve
  showing disease-free survival (DFS) in the GSE27020 cohort, stratified by the optimal
  cut-off for POSTN+ fibroblast infiltration. H Representative immunofluorescence
  (IF) staining images of POSTN+ fibroblasts (COL1A1+ POSTN+ double positive) in LSCC,
  VCL, and non-malignant samples. Scale bar = 50 μm
