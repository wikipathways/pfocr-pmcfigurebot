figure_title: Differential regulation of actomyosin contractility by Eph/ephrin bidirectional
  signaling.
caption: Differential regulation of actomyosin contractility by Eph/ephrin bidirectional
  signaling. (a) Eph receptor-mediated forward signaling activates the RhoA–ROCK–myosin
  II pathway, increasing MLC phosphorylation and actin polymerization, thereby enhancing
  cortical tension. (b) Ephrin-mediated reverse signaling regulates Rho GTPase activity
  and actin cytoskeletal remodeling through intracellular binding partners, contributing
  to cell repulsion and interfacial tension, but generating weaker contractile forces
  than forward signaling
