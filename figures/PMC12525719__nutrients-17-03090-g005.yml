figure_title: Salecan promoted the RIPK1/MLKL signaling pathway.
caption: Salecan promoted the RIPK1/MLKL signaling pathway. (A,B) qRT-PCR analysis
  of RIPK1 and MLKL mRNA expression in PANC-1 (A) and BxPC-3 (B) cells treated with
  Salecan for 48 h. (C,D) The cell necroptosis signaling pathway molecules were detected
  by Western blotting with Salecan after 48 h in PANC-1 (C) cells and BxPC-3 cells
  (D). Quantitative results were normalized to GAPDH. (E). PANC-1 cells were treated
  with Salecan and 50 μM Nec-1 for 48 h and then harvested for CCK-8 assays. All data
  are presented as the mean ± SEM of three independent experiments. * p < 0.05, **
  p < 0.01, *** p < 0.001
article_title: Salecan Suppresses Pancreatic Cancer Progression by Promoting Necroptosis
  via the RIPK1/MLKL Pathway
