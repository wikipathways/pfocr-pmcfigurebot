figure_title: Host factors and viral proteins that influence cGAS-STING activation
  triggered by HIV-infection.
caption: 'Host factors and viral proteins that influence cGAS-STING activation triggered
  by HIV-infection. Positive regulators are shown in blue, negative regulators are
  shown in red, cGAS-STING pathway components are shown in green. (A) After HIV capsid
  entry into the cell, the viral reverse transcriptase synthesizes a DNA copy of RNA
  genome, which can trigger cGAS. The reverse transcription is inhibited by SAMHD1,
  which depletes the pool of dNTPs, and as a result, inhibits innate immune activation.
  Capsid structure is optimized for preventing viral DNA recognition, but mutations
  of the capsid protein that destabilize capsid (P38A, Q219A) result in elevated innate
  immune activation, whereas stabilizing mutations (R143A) reduce DNA sensing. Premature
  capsid disassembly in cytoplasm activates cGAS-STING pathway; however, TREX1 exonuclease
  antagonizes this pathway by degradation of cDNA. Two capsid-binding factors recruit
  cGAS onto viral cDNA and upregulate innate immunity: PBQP1 promotes DNA sensing
  in the cytoplasm, whereas NONO binds capsid post-nuclear entry and attracts nuclear
  cGAS, facilitating nucleosome-free cDNA sensing right after capsid uncoating. At
  the same time, the sensing of cellular DNA by nuclear fraction of cGAS is inhibited
  by nucleosomes. (B) STING protein undergoes a number of posttranslational modifications
  crucial for cGAS-STING pathway activation. STING ISGylation (covalent attachment
  of ISG15 protein) is required for STING activation and oligomerization, making ISG15
  a negative regulator of HIV-1 infection. Two HIV-1 proteins disrupt STING posttranslational
  modifications: Vif suppresses STING dephosphorylation by SHP-1 tyrosine phosphatase,
  and p6 antagonizes STING ubiquitination at K337 residue. Surprisingly, matrix protein
  p17 of HIV-1 upregulates cGAS-STING signaling by inhibiting the OLA1-STING protein
  interaction. After STING binds to cGAMP, it translocates from ER to Golgi complex,
  where STING attracts TBK-1 kinase. TBK-1 phosphorylates STING, followed by STING-TBK-1
  complex oligomerization. Active TBK-1 phosphorylates IRF3 factor, which forms a
  dimer, translocates to the nucleus, and induces type I IFN and downstream genes.
  STING-TBK-1 interaction is upregulated by a cytosolic DNA sensor IFI16, and is downregulated
  by NLRX1 (NOD-like receptor). Two HIV-1 proteins, Vif and Vpr, antagonize TBK-1
  autophosphorylation, required for TBK-1 activation. Vpr also suppresses IRF3 phosphorylation
  and translocation to the nucleus. Vpr’s interaction with DCAF1 (VprBP), a member
  of E3 ubiquitin ligase complex CRL4-DCAF1, is necessary for Vpr-mediated innate
  immunity inhibition. Thus, the Vpr-DCAF1-mediated inhibition of innate immunity
  may possibly be attributed to the degradation of factors involved in the cGAS-STING
  pathway. Finally, an HIV-1 protein Vpu antagonizes STING-mediated NF-κB signaling,
  independent of TBK-1 signaling. Taken together, the majority of HIV-1 proteins suppress
  STING-mediated innate immunity, when cellular factors serve to finely tune cGAS-STING
  pathway activation and help to recognize the HIV infection. Green arrows—positive
  effect on cGAS-STING pathway. Red blunt arrows—negative effect on cGAS-STING pathway.
  Created in BioRender. Rozina, A. (2025) https://BioRender.com/xs8pnzn (accessed
  on 28 October 2025)'
