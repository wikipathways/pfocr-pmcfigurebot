figure_title: RV-C15 epithelial remodeling is reversed by a Notch signaling inhibitor
caption: 'A. Genes selected from the Notch signaling pathway (GO: 0007219) were compared
  based on log2 fold change vs sham for RV-A16 and RV-C15 infection. B. mRNA expression
  of HES1 and HES2 in cells infected with sham or RV-C15 (n= three donors across two
  independent experiments). C. mRNA expression of DNAI2, FOXJ1 and FOXA3 in cells
  treated with sham, RV-C15, or RV-C15 plus DAPT (N-[N-(3,5-Difluorophenacetyl)-L-alanyl]-S-phenylglycine
  t-butyl ester) (n=three donors across two independent experiments). D. Immunofluorescence
  staining for FOXJ1 (green) and FOXA3 (red) in RV-C15-infected cells treated with
  vehicle or DAPT at 48 h after infection. Data shown are mean ± SEM and were analyzed
  by t test (panel B) or one-way ANOVA (panel C)'
