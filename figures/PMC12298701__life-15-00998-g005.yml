figure_title: Pharmacological inhibition of mitochondrial internalization pathways
  in HT-22 cells during xeno-MTx.
caption: 'Pharmacological inhibition of mitochondrial internalization pathways in
  HT-22 cells during xeno-MTx. (A) Representative fluorescence microscopy images of
  HT-22 neuronal cells exposed to MTDR-labeled donor mitochondria following pretreatment
  with pathway-specific inhibitors. Donor mitochondria are visualized in red (MTDR),
  nuclei in blue (DAPI), and the actin cytoskeleton is pseudo-colored in magenta in
  this figure (note: pseudo-colored green was used in Figure 4). Reduced MTDR fluorescence
  was observed after pretreatment with cytochalasin D (actin polymerization inhibitor),
  methyl-β-cyclodextrin (MβCD; cholesterol-depleting agent), and high-dose EIPA (100
  µM; macropinocytosis inhibitor), compared to untreated controls. Pretreatment with
  nocodazole (microtubule destabilizer) or low-dose EIPA (10 µM) did not markedly
  affect mitochondrial uptake. (B) Quantitative analysis of cellular MTDR signal intensity
  confirms significant reductions in mitochondrial uptake following treatment with
  cytochalasin D, MβCD, and high-dose EIPA. Data represent mean ± SEM (n = 12 per
  group). * p < 0.05, ** p < 0.01 between each group'
