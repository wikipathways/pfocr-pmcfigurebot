figure_title: Genome-wide screen identifies regulators of TRP-induced apoptosis
caption: '(A) Schematic of chemogenetic profiling to identify death regulatory genes.(B)
  Gene-level chemogenetic profiling data. Key death regulatory genes and nontargeting
  controls highlighted.(C) Simplified schematic of the cell-intrinsic apoptotic pathway.
  Bcl-2* denotes anti-apoptotic Bcl-2 family members. BH3* denotes pro-apoptotic BH3-only
  proteins. Regulators in blue/yellow were identified in chemogenetic profiling data.(D)
  Running enrichment scores (ESs) from gene set enrichment analysis on rank-ordered
  death rates, evaluating short-lived RNAs or long-lived RNAs. Nominal p value shown
  (n.s. p > 0.05).(E) Enrichment for stress response pathways among death regulatory
  genes identified by chemogenetic profiling. Significance was determined using a
  false discovery rate (FDR)-corrected one-tailed Fisher’s exact test.(F) Chemogenetic
  profiling data, highlighting genes associated with stress response pathways: Biocarta
  mitochondrial pathway (Mito. Pathway), unfolded protein response (UPR), integrated
  stress response (ISR), and DDR. Odds ratio for one-tailed Fisher’s exact test shown.
  Gray dashed lines: FDR = 0.1.(G) Immunoblot of phosphorylated-H2A.X(Ser139) following
  31.6 μM etoposide or 1 μM TRP in U2OS.(H) LF following TRP in U2OS or U2OS-TP53-KO.
  Data are mean ± SD for 9 biological replicates.See also Figure S4 and Table S5'
