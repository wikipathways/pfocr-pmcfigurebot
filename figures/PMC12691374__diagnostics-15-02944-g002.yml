figure_title: Practical decision pathway for sequencing in suspected BSIs.
caption: Practical decision pathway for sequencing in suspected BSIs. After drawing
  BCs and starting empiric therapy, select the sequencing modality according to the
  clinical context. Plasma mcfDNA supports broad, minimally invasive detection and
  burden trending when cultures are negative or unobtainable, or when early antibiotics
  are likely to depress culture yield (TAT 24–48 h). Direct mNGS of blood or plasma
  enables hypothesis-free discovery, including polymicrobial or unusual pathogens
  (TAT 24–72 h). When a BC flags positive, ONT sequencing from positive broth provides
  same-day species identification and on-target AMR gene calls (TAT 4–12 h). Isolate
  WGS or hybrid sequencing may then follow to define plasmid and resistance context
  and to support epidemiologic investigations (TAT 48–96 h)
