caption: (A) Schematic depicting optic cups and samples used for scRNA-seq including
  control and variant mouse optic cups (n = 3 pooled per genotype). (B) UMAPs of control
  versus Myrf C-terminal variant mouse optic cups demonstrating cell type distributions.
  (C) Feature plot demonstrating expression of Myrf mRNA in both control and variant
  mice within the RPE cluster. (D) Volcano plot of differentially expressed genes
  in MyrfhumdG/humdG mice compared with control (MyrfhumWT/humWT). DEGs were defined
  by a Bonferroni Padj < 0.1. (E) Top 10 Gene Ontology (GO) Biological Pathway terms
  for upregulated and downregulated genes
