caption: 'Predicted functional profiles of microbial communities across the forest–wetland
  transitions. (a) PCoA based on predicted functional profiles showing treatment effects.
  (b) KEGG Level 2 functional category distributions and the number of associated
  Level 3 pathways (CP: Cellular Processes; EIP: Environmental Information Processing;
  GIP: Genetic Information Processing). Note: Colors in panel (b) represent KEGG functional
  categories and are independent of the vegetation-type color coding used in other
  panels, to facilitate visual distinction of functional groupings. (c) Differential
  abundances of KEGG Level 2 pathways among treatments (* p < 0.05). Statistical significance
  was assessed at both KEGG Level 2 and pathway levels using one-way ANOVA followed
  by Tukey’s HSD post hoc test, with p-values adjusted by the false discovery rate
  (FDR); results with adjusted p < 0.05 were considered significant'
