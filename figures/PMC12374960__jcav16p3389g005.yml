  normal samples, as shown by immunohistochemistry. (C) Heatmap illustrating the top
  30 genes positively correlated with HDAC7 in HCC. Red represents high expression,
  and blue represents low expression. (D) PDLIM7 mRNA expression was upregulated in
  HCC compared with normal tissues based on TCGA. (E) The Kaplan-Meier curves show
  that HCC patients with a higher expression of PDLIM7 had a shorter OS time. (P=0.017)
