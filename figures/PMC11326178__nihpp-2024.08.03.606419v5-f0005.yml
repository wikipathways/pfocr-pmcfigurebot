figure_title: Perturbing CLK1 disrupts RNA splicing and impairs oncogenic transcriptional
  programs
caption: (A) Volcano plot illustrating genes differentially-expressed in KNS-42 cells
  treated with CLK1 exon 4 targeting morpholino compared to cells treated with non-targeting
  morpholino. (B) Barplots displaying number of differentially expressed (DE) genes
  or differentially spliced (DS) genes affecting functional sites categorized by gene
  family. (C) Venn diagram depicting overlap of all DS and DE genes (D) Over-representation
  analysis of HALLMARK and KEGG pathways for DS cancer genes (E) Heatmap displaying
  single-sample HALLMARK GSVA scores for DS genes affecting functional sites in cells
  treated with CLK1 exon 4 morpholino or non-targeting morpholino. (F) Barplots illustrating
  the mean GSVA score difference by treatment (n = 3 replicates per treatment). (G)
  Venn diagram depicting overlap of DS and DE genes and significant (Wald FDR < 0.05,
  z-score < −1.5) dependency genes (DG) identified in matched CBTN HGG cell lines
  through CRISPR dependency experiments from the Childhood Cancer Model Atlas (CCMA
  v3). (H) Ranked dotplot of significant CRISPR gene dependency mean zscores for pediatric
  HGG cell lines with CLK1 expression and splicing-based target genes highlighted
  in red and blue, respectively
article_title: Characterization of aberrant splicing in pediatric central nervous
  system tumors reveals CLK1 as a candidate oncogenic dependency
