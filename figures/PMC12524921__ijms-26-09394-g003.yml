caption: Estrogens activate ERα in the anal canal epithelium of women with hemorrhoids
  via genomic and non-genomic pathways, leading to Src activation and downstream signaling
  through PI3K/Akt, MAPK, and p38. This downregulates miR-4729, which results in the
  overexpression of ESR1 and enhances VEGF transcription. Increased VEGF promotes
  angiogenesis and edema in hemorrhoidal tissue (ERα—estrogen receptor alpha, ERβ—estrogen
  receptor beta, ESR1—estrogen receptor 1 gene, VEGF—vascular endothelial growth factor,
  PI3K—phosphoinositide 3-kinase, MAPK—mitogen-activated protein kinase, miR-4729—microRNA-4729,
  SH2/SH3—Src homology 2/3 domains). Created in BioRender. Mazurek, M. (2025) https://BioRender.com/158e9db
