figure_title: Molecular mechanisms by which APOE4 modulates the DAM/MGnD phenotype
  in microglia.
caption: 'Molecular mechanisms by which APOE4 modulates the DAM/MGnD phenotype in
  microglia. In neurodegenerative conditions, phosphatidylserine exposed by apoptotic
  neurons activates the TREM2 receptor on microglia, initiating downstream signaling
  cascades through its interaction with DAP12. This triggers two key pathways: (1)
  SYK kinase phosphorylation directly upregulates DAM/MGnD-related genes and (2) collaboration
  with the APOE signaling pathway promotes DAM/MGnD phenotype acquisition. However,
  APOE4 disrupts this process via multiple mechanisms: (1) upregulating miR-155 to
  suppress IFNγ signaling, thereby impairing DAM activation; (2) increasing the expression
  of the transcription factor Spi-1 (PU.1), which activates the ITGB8-TGF-β pathway
  to antagonize the pro-DAM effects of TREM2-APOE. Notably, APOEε4 neutrophils exacerbate
  this suppression by releasing IL-17F, which engages microglial IL-17RA receptors.
  Separately, the APOE-VCAM1 interaction has been shown to promote DAM/MGnD phenotype
  formation'
