figure_title: DNA-PKcs plays complex and indispensable roles extending far beyond
  its canonical functions, including DNA repair, cell cycle regulation, transcriptional
  control, and immune modulation.
caption: DNA-PKcs plays complex and indispensable roles extending far beyond its canonical
  functions, including DNA repair, cell cycle regulation, transcriptional control,
  and immune modulation. In DNA repair, it is recruited to double-strand breaks (DSBs)
  via the Ku70/Ku80 complex, where phosphorylation at Thr2609/Ser2056 clusters activates
  non-homologous end joining (NHEJ) while competitively inhibiting homologous recombination
  (HR) through BRCA1 and EXO1 phosphorylation. For cell cycle regulation, DNA-PKcs
  attenuates ATM-mediated G1/S arrest by phosphorylating MDC1, ensures proper chromosome
  segregation by modulating Cyclin B1 stability through the Cdh1-APC/C pathway and
  phosphorylating Bub3, and stabilizes replication forks via ATR and PIDD to prevent
  replication stress during S phase. In transcriptional regulation, it enhances RNA
  polymerase II activity and facilitates transcription factor recruitment. In immune
  modulation, it is essential for generating antigen receptor diversity and modulating
  immune factor expression, highlighting its multifaceted roles in cellular homeostasis
