figure_title: Ion channels in brain capillary pericytes
caption: Several K+ channels have been reported in capillary pericytes, among which
  KATP is highly expressed. GsPCR activation in distal pericytes activates KATP channels
  and hyperpolarizes the cell. Pericyte hyperpolarization is transmitted to adjacent
  ECs to activate Kir2.1 channels; retrograde hyperpolarization subsequently dilates
  feeding arterioles. Pericytes also express Kir2, Kv and BKCa channels, but their
  exact roles in CBF regulation are not clear. Pericyte GqPCR activation is associated
  with increased cytosolic [Ca2+], not only through downstream IP3R activation but
  also via several other ion channels (Cav1.2, TMEM16A, TRPC3, Orai). VGCCs are the
  main Ca2+ influx pathway in ensheathing pericytes. TMEM16A and TRPC3 potentiate
  VGCC function, by depolarizing pericytes. TMEM16A is activated via IP3-mediated
  Ca2+ release from the sarcoplasmic reticulum stores, and TRPC3 is likely activated
  downstream of mechanosensitive GqPCR. The role of Cav1.2 in Ca2+ influx is minimal
  in distal thin-strand pericytes, a function that is likely mediated via store-operated
  Ca2+ entry, where STIM1/Orai signaling transduces when Ca2+ stores are depleted.
  Pericyte contraction leading to capillary constriction has been observed in AD and
  ischemic stroke. The excessive contraction involves TMEM16A upregulation, and excessive
  Ca2+ influx via VGCCs. Cav1.2 blockers decrease capillary stalling and enhance CBF
  in AD models, highlighting their involvement in AD pathogenesis
