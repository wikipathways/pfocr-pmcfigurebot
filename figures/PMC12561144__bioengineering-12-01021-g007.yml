caption: 'Schematic illustration of the multifunctional ACIS@MLG platform for periodontitis
  treatment. (A) Synthetic route of ACIS@MLG. (B) After administration into the periodontal
  pocket, ACIS@MLG forms a thermosensitive hydrogel that delivers antibacterial, anti-inflammatory,
  and protective effects to periodontal tissues. (C) Proposed mechanism of ferroptosis
  inhibition: MLG adsorbs free Fe2+ and scavenges ROS to block ferroptosis, while
  modulating lipid peroxidation through the AMPK/Nrf2/SLC7A11 signaling pathway [171].
