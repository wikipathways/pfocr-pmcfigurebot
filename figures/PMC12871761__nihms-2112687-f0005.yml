figure_title: 3-oxo-LCA inhibits tumorigenesis in APCMin/+ mice
caption: '(A) Schematics of 3-oxo-LCA (20 mg/kg BW p.o.) or vehicle (corn oil) were
  administrated in APCMin/+ mice for 5 weeks.(B) Intestinal permeability measured
  after 4 hours of FITC-dextran administration in both 3-oxo-LCA and vehicle-treated
  APCMin/+ mice.(C) Total Bile Acid levels measured in both 3-oxo-LCA and vehicle-treated
  APCMin/+ mice.(D-F) Representative live image (D), colon length (E), and tumor numbers
  (F) of the colon part were displayed.(G-I) Total tumor numbers (G), tumor volumn
  (H), and tumor distribution (I) in small intestine segment of mice in the above
  treatment groups.(J) Representative images of H&E staining of small intestine and
  colon segments of APCMin/+ mice in the above treatment groups, with large tumors
  outlined. Scale bar, 100-200μm.(K) Representative images of immunostaining for proliferation
  gene marker Ki67 (red) in the small intestine of APCMin/+ mice are presented, along
  with the corresponding quantification of each staining. Scale bar, 100μm.(L-M) Relative
  expression of FXR and its target genes (Shp, Fgf15, Ibabp, Ostα, Ostβ) (L), Apoptosis
  signaling pathway (Casp8, Bcl2, Bak1, Bax, Casp9, Casp3, Casp7) (M) in the tumors
  of APCMin/+ mice under above treatment groups, measured by RT-qPCR.(N) Representative
  images of TUNEL assay stained apoptotic cell death in the small intestine of APCMin/+
  mice, along with the corresponding quantification of each staining. Scale bar, 100μm.(O-P)
  Immunostaining images of Apoptotic protein Cleaved Casp3 (O) and Cleaved Casp7 (P)
  (green) in the APCMin/+ mice under above treatments, along with the corresponding
  quantification of each staining. Scale bar, 100μm.(Q) The protein levels of Apoptosis
  signaling pathway (Bcl2, Cleaved Casp3, Casp3, Cleaved Casp7, Casp7) IN APCMin/+
  mice under above treatments, measured by Western Blot. Band intensities were quantified
  by image J and presented on the left.Experiments were independently replicated twice,
  and representative data are shown as the mean ± SEM. For two group comparison, Student’s
  unpaired t-test were applied. For more than two group comparison, the one-way ANOVA
  test was followed by multiple comparisons. *p<0.05; **p<0.01; ***p<0.005; ns: not
  significant'
