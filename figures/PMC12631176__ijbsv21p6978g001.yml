figure_title: GLI2 in PSCs is a key component of Hh signaling in CP.
caption: 'GLI2 in PSCs is a key component of Hh signaling in CP. (A) Workflow illustrating
  for pancreatic snRNA-seq analysis from healthy donors (hNP, n = 6) and CP donors
  (hCP, n = 2). Data are obtained from Tosti and colleagues.29 (B) tSNE plot showing
  pancreatic cells from hNP and hCP donors, color-coded by cell clusters. (C) Dot
  plots visualizing the expression levels (color intensity) and frequencies (dot size)
  of Hh pathway genes across different pancreatic cell clusters from hNP and hCP samples.
  (D) Heatmap showing the expression patterns of Hh pathway genes in qPSCs and aPSCs.
  (E) Schematic diagram illustrating the sources and culture conditions of different
  PSC sample types. Data are derived from Barrera and colleagues.30 (F) Heatmap showing
  expression levels of ACTA2, COL1A1, and PPARγ, indicating varying degrees of activation
  among the four PSC subtypes. (G) Heatmap displaying the expression profiles of Hh
  pathway genes across the 4 PSC types. (H, I) Representative dual immunofluorescence
  images of α-SMA (red) and GLI2 (green) staining in pancreatic tissues from hNP (n
  = 4) and hCP (n = 4) donors. Nuclei are counterstained with DAPI (blue). Scale bar:
  25 µm. (J) Quantification of the proportions of GLI2- and SMO-expressing PSCs in
  hNP and hCP samples. Data are presented as mean ± SEM. Statistical significance:
  *p < 0.05, ****p < 0.0001. ns, not significant'
