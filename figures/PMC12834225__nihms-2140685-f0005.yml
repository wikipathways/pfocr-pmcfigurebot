figure_title: Proposed traffic pathways for Kex2.
caption: Proposed traffic pathways for Kex2. The major pathway, indicated with a solid
  arrow, is AP-1/Ent5-dependent intra-Golgi recycling. Two minor pathways, indicated
  with dashed arrows, involve missorting followed by salvage mechanisms for retrieval.
  Kex2 probably travels occasionally to the plasma membrane, after which it recycles
  to the Golgi in endocytic vesicles. In addition, Kex2 probably travels occasionally
  to prevacuolar endosome (PVE) compartments, after which it recycles to the Golgi
  with the aid of sorting nexins
