figure_title: Tryptophan (Trp)–indole metabolism and its pathological consequences.
caption: Tryptophan (Trp)–indole metabolism and its pathological consequences. Gut
  microbiota such as Escherichia coli and Bacteroides spp. metabolize dietary Trp
  via tryptophanase into indole. Host and environmental factors (genetics, diet, stress,
  aging, physical activity) modulate this pathway. Dysregulated Trp metabolism reduces
  serotonin (5-HT) availability, impairing enteric nervous system (ENS) signaling,
  metabolism, glucose absorption, and intestinal motility, contributing to chronic
  gastrointestinal disorders such as ulcerative colitis. Indole derivatives, particularly
  indoxyl sulfate (IS), accumulate when excretion is impaired, leading to systemic
  inflammation, oxidative stress, and cellular damage in the colon and liver. Overexpression
  of indoleamine 2,3-dioxygenase 1 (IDO1) and tryptophan 2,3-dioxygenase 2 (TDO2)
  further links altered Trp metabolism to carcinogenic processes in the brain, breast,
  and lungs. This highlights the central role of Trp–indole metabolism in the gut–brain–immune
  axis, cancer progression, and systemic disease
