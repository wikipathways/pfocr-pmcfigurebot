figure_title: SESN2 inhibits HK2 cell exosome release by promoting autophagic degradation.
caption: 'SESN2 inhibits HK2 cell exosome release by promoting autophagic degradation.
  (A-B) KEGG pathway analysis according to RNA-sequencing results. (C) Protein expression
  levels of LC3II:I and p62 in the kidney cortices of db/m and db/db mice (n=3). *p
  < 0.05 vs. the db/m group. (D) Protein expression levels of LC3II:I and p62 in the
  kidney cortices of db/m and db/db mice injected with AAV-vector or AAV-SESN2 via
  the tail vein. (n=3) . *p < 0.05 vs. the db/m+AAV-vector group, #p < 0.05 vs. the
  db/db+AAV-vector group. (E) Protein expression levels of LC3II:I and p62 in the
  kidney cortices of db/m and db/db mice injected with AAV-sh-NC or AAV-sh-SESN2 via
  the tail vein. (n=3). *p < 0.05 vs. the db/m+AAV-sh-NC group, #p < 0.05 vs. the
  db/db+AAV-sh-NC group. (F) Kidney cortex electron microscopic images of db/db mice
  injected with AAV-vector or AAV-SESN2 via the tail vein. The autophagosome (red
  arrows) numbers were quantified (n= 3). Scale bars: 5.0 μm. (G) Protein expression
  levels of LC3II:I and p62 in Vector or SESN2 stably overexpressing HK-2 cells treated
  with or without BSA (n=3). *p < 0.05 vs. the Vector group, #p < 0.05 vs. the Vector+BSA
  group. (H) Protein expression levels of LC3II:I and p62 in Si-NC- or Si-SESN2-transfected
  HK-2 cells treated with or without BSA (n=3). *p < 0.05 vs. the Si-NC group, #p
  < 0.05 vs. the Si-NC+BSA group. (I) Si-NC- or Si-SESN2-transfected HK-2 cells were
  infected with RFP-GFP-LC3-expressing adenovirus, and the fluorescence was detected
  by confocal microscopy. Scale bars: 2.0 μm. (J) Vector or SESN2 stably overexpressing
  HK-2 cells treated with or without BSA were infected with RFP-GFP-LC3-expressing
  adenovirus, and the fluorescence was detected by confocal microscopy. Scale bars:
  2.0 μm. (K) Representative immunostaining images of CD63 and LAMP1 in Si-NC- or
  Si-SESN2-transfected HK-2 cells. Scale bars: 50 μm. (L) Representative immunostaining
  images of CD63 and LAMP1 in Vector or SESN2 stably overexpressing HK-2 cells treated
  with or without BSA. Scale bars: 50 μm'
