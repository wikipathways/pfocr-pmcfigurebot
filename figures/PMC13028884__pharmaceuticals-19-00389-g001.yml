caption: The riboflavin biosynthetic pathway (RFBP). GTP, guanosine triphosphate;
  DARPP, 2,5-diamino-6-ribosyl-amino-4(3H)-pyrimidinone 5′-phosphate; DArPP, 2,5-diamino-6-ribityl-amino-4(3H)-pyrimidinone
  5′-phosphate; ARPP, 5-amino-6-ribosyl-amino-2,4(1H,3H)-pyrimidinedione 5′-phosphate;
  ArPP, 5-amino-6-ribityl-amino-2,4(1H,3H)-pyrimidinedione 5′-phosphate; ArP, 5-amino-6-ribityl-amino-2,4(1H,3H)-pyrimidinedione;
  Ru5P, ribulose-5-phosphate; DHBP, 3,4-dihydroxy-2-butanone-4-phosphate; DMRL, 6,7-dimethyl-8-ribityllumazine;
  AFRPP, 2-amino-5-formylamino-6-ribosylamino-4(3H)-pyrimidinone 5′-phosphate. In
  plants and eubacteria, the deamination reaction followed by the reduction reaction
  is shown in red; in archaea, yeasts, and filamentous fungi, the reduction reaction
  followed by the deamination reaction is shown in blue; and the alternative pathway
  described in several archaea and in Sinorhizobium meliloti is shown in green. The
  figure was constructed based on information from references [6,11,17,22,90,106].
  All structures were generated using the PubChem database to ensure chemical accuracy
  and consistent graphical representation
