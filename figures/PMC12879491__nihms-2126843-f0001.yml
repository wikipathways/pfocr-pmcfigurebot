figure_title: A dual role of SLC7A11 in regulating ferroptosis versus disulfidptosis.
caption: 'A dual role of SLC7A11 in regulating ferroptosis versus disulfidptosis.
  SLC7A11 acts as an antiporter that imports extracellular cystine and exports intracellular
  glutamate. Once inside cells, cystine is reduced to cysteine, which supports GSH-
  and GPX4-dependent suppression of lipid peroxidation, thereby inhibiting ferroptosis.
  Therefore, SLC7A11 acts as a negative regulator of ferroptosis. Cystine reduction
  to cysteine consumes the reducing equivalent NADPH, which is mainly generated via
  glucose-fueled PPP. Under disulfide stress conditions, such as glucose deprivation
  or PPP inhibition in SLC7A11-high cells, cystine reduction is impaired, leading
  to aberrant accumulation of cystine and induction of disulfidptosis. Consequently,
  SLC7A11 has a promoting role in disulfidptosis. Created in BioRender. SLC7A11: solute
  carrier family 7 member 1; GSH: synthesis of glutathione; GPX4: glutathione peroxidase
  4; NADPH: reduced nicotinamide adenine dinucleotide phosphate; PPP: pentose phosphate
  pathway'
