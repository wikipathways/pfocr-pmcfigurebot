caption: Inferred microbial functional alterations associated with Kaposi′s sarcoma
  progression. (A) Volcano plots of PICRUSt2-inferred pathway activity comparing progressive
  to nonprogressive disease across the oral cavity, tumor, and blood microbiomes.
  (B) Differential microbial pathways identified in the oral cavity, with emphasis
  on pathways related to denitrification, ubiquinone biosynthesis, and arginine metabolism.
  (C) Microbe-level loadings showing higher relative levels of microbes capable of
  denitrificiation observed in nonprogressive disease
