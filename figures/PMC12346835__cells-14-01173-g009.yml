figure_title: Swertiamarin demonstrates comprehensive bone-protective and immunomodulatory
  effects through multi-target mechanisms.
caption: 'Swertiamarin demonstrates comprehensive bone-protective and immunomodulatory
  effects through multi-target mechanisms. (1) Anti-inflammatory: SW suppresses pro-inflammatory
  cytokines (TNF-α, IL-6, IL-1β) and iNOS/COX-2/PGE2 production and downregulates
  the NF-κB/IκB and JAK2/STAT3 signaling pathways while modulating MMPs/TIMPs balance.
  (2) Anti-osteoclastogenic: SW inhibits osteoclast formation by reducing RANKL/RANK
  signaling and TRAP/ACP activity. (3) Pro-osteoblastic: SW promotes osteoblast growth
  and ALP expression. (4) Immune modulation and pro-apoptotic effect: SW modulates
  immune function by normalizing RBC/WBC counts and ESR levels while enhancing anti-inflammatory
  cytokines (IL-4/IL-10) and activating caspase-3-mediated apoptosis'
