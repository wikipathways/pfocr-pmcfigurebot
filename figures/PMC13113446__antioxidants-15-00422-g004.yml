caption: 'Bar chart and flow cytometry plots showing post-thaw sperm mPTP opening
  levels (n = 3): (a) Bar chart of the effects of different inhibitors (8-M-PDOT:
  10−6 M; 4-P-PDOT: 10−6 M; Luzindole: 10−6 M; LY294002: 10−5 M; SB415286: 10−5 M)
  on post-thaw sperm mPTP opening levels, “−” indicates inhibition of corresponding
  receptors or pathways, different superscript letters indicate significant differences
  (p < 0.05). (b) Left: Flow cytometry histogram of the MT group (0.1 mg/mL) with
  the abscissa representing FITC fluorescence intensity. Right: Flow cytometry histogram
  of the MT1− group with the abscissa representing FITC fluorescence intensity. Green
  FITC fluorescence intensity (indicating mPTP opening level). All inhibitors were
  equilibrated with sperm samples at 4 °C for 10 min before cryopreservation'
