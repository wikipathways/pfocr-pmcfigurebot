figure_title: Western Blotting of Apoptosis Pathway after EV Therapy in BPD Model.
caption: Western Blotting of Apoptosis Pathway after EV Therapy in BPD Model. (A)
  Cleaved-caspase 3 levels were significantly higher in the hyperoxia group compared
  to the normoxia group. After miR-7704-HUCMSCs-Exo treatment, cleaved-caspase 3 levels
  decreased significantly. No significant change in the level of cleaved-caspase 3
  was observed after HUCMSC-Exo treatment. (B) Caspase 7 and FasL levels were significantly
  higher in the hyperoxia group compared to the normoxia group, while Bcl-2 levels
  were significantly lower. After miR-7704-HUCMSC-Exo treatment, cleaved-caspase 7
  and FasL levels decreased significantly, while Bcl-2 levels increased significantly.
  No significant changes in FasL and Bcl-2 levels were observed after HUCMSC-Exo treatment.
  (C) No significant changes were observed in caspase 8 and caspase 9 levels in A549
  cells under hyperoxic conditions
