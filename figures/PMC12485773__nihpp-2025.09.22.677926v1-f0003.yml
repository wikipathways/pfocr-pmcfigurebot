figure_title: LMN-1 and ribosomes act in the same pathway to promote cytoplasmic organization
caption: 'A) Representative particle trajectories color-coded by frame number for
  GEMs tracked in the intestine of the indicated strains. Scale bar: 4 μm. Concentric
  circles indicate 2 μm and 4 μm radii from trajectory origin. B) 2D probability density
  histograms correlating GEM Deff with α in the intestinal cytoplasm for the indicated
  strains at day 1 of adulthood. Marginal distributions shown as frequency histograms
  on top and right axes. Color scale indicates particle count per bin. C) GMM analysis
  of GEM Deff in the intestine of the indicated strains at day 1 of adulthood. Dotted
  lines indicate the center of each distribution (purple: lmn-1(R64P)/hT2;rps-18(RNAi),
  and dark red: lmn-1(R64P); rps-18(RNAi)). D-E) Bootstrap analysis of GMM parameters
  comparing GEM diffusion in the intestine of the indicated strains at day 1 of adulthood.
  The percentage of constrained GEMs (D) and mean ± SD Deff values of unconstrained
  GEMs (E) are shown. F) Representative spinning disc confocal images of GFP-labeled
  hypodermal nuclei in day 1 adults of the indicated strains. Arrowheads indicate
  defective nuclear anchoring; dotted lines outline worm boundaries. Scale bar: 10
  μm. G) Nuclear positioning defects quantified as percentage of touching nuclei per
  worm in day 1 adults of the indicated strains. Left to right: n1=20, n2=33, n3=20,
  n4=19, n5=20, n6=13. Welch’s ANOVA test: W(5, 43) = 115, p < 0.001. H) Representative
  spinning disc confocal images of hypodermal ER organization in the indicated strains
  at day 1 of adulthood. Left panels: ER morphology visualized by mKate2::TRAM-1 fluorescence.
  Right panels: Thresholded images showing ER outline (cyan) and hypodermal boundary
  (red). Scale bar: 10 μm. Zoom-in insets are magnified views of the boxed regions.
  I-J) ER network analysis showing ER occupancy percentage (I) (n=10, 16, 14, 12,
  12 from left to right), Kruskal-Wallis test: H(4)=40, p <0.001, and perimeter complexity
  (J) (n=10, 16, 14, 12, 12 from left to right), Kruskal-Wallis test: H(4)=44, p<0.001,
  across genotypes. Statistical significance is indicated by asterisks (****: p<0.0001,
  ***: p≤0.001,**: p≤0.01, *: p≤0.05, ns: p>0.05) with exact p-values shown above
  each comparison'
article_title: Muscular dystrophy-associated lamin variants disrupt cellular organization
  through a nucleolar-ribosomal axis controlling cytoplasmic macromolecular crowding
