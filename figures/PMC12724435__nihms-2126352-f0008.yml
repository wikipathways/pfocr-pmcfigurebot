figure_title: Sulfur mustard exposure to eyes induces a complex network of signaling
  pathways in the cornea and contributes to inflammation, oxidative stress, fibrosis,
  neovascularization, and repair.
caption: Sulfur mustard exposure to eyes induces a complex network of signaling pathways
  in the cornea and contributes to inflammation, oxidative stress, fibrosis, neovascularization,
  and repair. Key pathways include NF-κB activation, which promotes inflammation through
  increased expression of proinflammatory cytokines such as TNF-α, IL-1β, and IL-6;
  and NRF2 downregulation, which leads to the accumulation of reactive oxygen species,
  contributing to oxidative stress. The TGF-β/Smad signaling pathway is activated,
  driving fibrotic remodeling and stromal scarring via markers such as TGF-β1 and
  Smad2/3. Concurrently, VEGF overexpression facilitates neovascularization through
  the upregulation of VEGF and HIF-1α. Also, PI3K/Akt/mTOR signaling is involved in
  promoting cell survival and tissue repair by regulating downstream molecules including
  Akt, mTOR, and PTEN
