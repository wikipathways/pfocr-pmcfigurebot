figure_title: Functional dissection of the 19-gene panel across tumor cells, T cells,
  and macrophages.
caption: Functional dissection of the 19-gene panel across tumor cells, T cells, and
  macrophages. (A) GeneMANIA network illustrating functional interactions between
  the 19-gene panel and 20 additional related genes. The network reveals dense connectivity,
  with functional clusters annotated based on literature, including tumor malignancy
  (e.g., GRN, SRC), protein expression (e.g., EIF2B1), cell survival and apoptosis
  (e.g., BAX), and immune regulation (e.g., OSCAR, PDE4B). (B) Tumor cell-specific
  pathway mapping based on KEGG and literature review. Genes such as SRC, GRN, RNF135,
  and POLR3G contribute to epithelial-mesenchymal transition (EMT), invasion, and
  survival. LBP engages the CD14-TLR4 axis, potentially activating inflammatory signaling
  within tumor cells. Downregulation of NLRC3 may relieve suppression of mTOR signaling,
  further enhancing tumor aggressiveness. (C) T cell-specific functional diagram showing
  that IL4, IL27RA, and BTNL3 drive Treg/Th2 polarization through JAK-STAT signaling.
  Reduced expressions of HAVCR2, HHLA2, and KIR2DL4 suggests impaired cytotoxic T
  cell function, while BAX upregulation indicates enhanced T cell apoptosis. (D) Macrophage-related
  signaling events indicate activation of NF-κB and inflammasomes by FCGR1A, OSCAR,
  and NOD2, promoting a chronic inflammatory state. LBP enhances these effects by
  activating the CD14-MD2-TLR4 complex, leading to IRF3 and AP-1 signaling and increased
  cytokine release. Suppressed expressions of HAVCR2 and IFNL1 reflect diminished
  antiviral and anti-tumor responses, while GPS2 is involved in transcriptional control
  of inflammatory genes. In panels (B-D), red-colored genes represent those significantly
  upregulated in poor-survival KIRC patients compared to others, while green-colored
  genes are downregulated in the same comparison. Red arrows indicate pathway activation
  (upregulation), and green arrows indicate suppression (downregulation)
