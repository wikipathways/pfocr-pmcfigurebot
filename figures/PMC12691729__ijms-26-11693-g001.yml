figure_title: Complement activating and terminal pathways.
caption: Complement activating and terminal pathways. (A) The classical pathway (CP)
  of complement activation. The CP is initiated by the binding of the C1 complex (C1q,
  C1r, and C1s) to bound antibody. C1r activates C1s which first cleaves C4 and then
  cleaves C2 leading to the formation of the CP C3 convertase (C4bC2a). The C3 convertase
  subsequently cleaves C3 leading to the formation of the C5 convertase (C4bC2aC3b)
  and the release of the anaphylatoxin C3a. The C5 convertase then cleaves C5 into
  C5a and C5b. C5a is the most powerful of the anaphylatoxins and C5b is the first
  component of the terminal pathway of complement. (B) The lectin pathway (LP) of
  complement activation. The LP is initiated by binding of the complex of mannose-binding
  lectin (MBL) and the serine proteases mannose-binding lectin associated proteases
  1 and 2 (MASP-1 and MASP-2) to mannose groups on the surface of invading pathogens.
  Next, MASP-1 activates MASP-2 which acts like C1s in the classical pathway and lead
  to the formation of the C3 convertase. The remaining steps are the same as in the
  CP. (C) The alternative pathway of complement activation. The alternative pathway
  is initiated by the spontaneous hydrolysis of C3 and to form C3(H2O). Then C3(H2O)
  in the fluid phase binds factor B (FB), which is subsequently cleaved by factor
  D (FD). The fluid phase C3 convertase C3(H2O)Bb is formed, and it is this that cleaves
  C3 to C3a and C3b (Green dashed arrow). The C3 convertase cleaves C3 releasing more
  C3a and resulting in the formation of the alternative pathway C5 convertase (C3bBbC3b).
  (D) The terminal pathway of complement. All three pathways of complement activation
  converge in the terminal pathway. The terminal pathway begins when C5 is cleaved
  into C5a and C5b by C5 convertase. C5a is the most powerful of the anaphylatoxins
  and C5b binds to C6. C7 then binds to the C5bC6 complex and the newly formed C5bC6C7
  complex inserts into the target membrane. C8 subsequently binds to the C5bC6C7 complex
  and creates a small pore in the target membrane. The final step in the terminal
  pathway is the binding of C9 molecules (up to 18) to the C5bC6C7C8 complex forming
  the membrane attack complex. The blue arrows indicate the regulation processes
