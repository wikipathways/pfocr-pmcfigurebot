caption: 'WGCNA of genes in HF and LF. (A): Module-trait correlation plot, with each
  row corresponding to a module and each column corresponding to a trait. Each cell
  contains the corresponding correlation and p value. The table is color-coded according
  to the color legend based on correlation. (B): KEGG pathway enrichment analysis
  of genes in red module. (C): The correlation networks of genes in the ‘red’ module,
  in which connected with 7 structural genes (PAL, CHI, DFR, ANS, ANR, FHT and FLS)
  ≥ 0.2 are displayed, and the larger the circle, the higher the connectivity. (D):
  Heatmap of expression of 33 nodes associated with structural genes in Figure 4C'
