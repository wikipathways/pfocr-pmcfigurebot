figure_title: Pathway blockade modulates endogenous and IL-1β–stimulated IL-6 secretion
  from PTECs
caption: Primary human PTECs cultured on Transwells were treated for 48 h (media replaced
  every 24 h) with 1 ng/mL IL-1β in the absence or presence of pathway inhibitors
  (i.e., PD98059 [ERK, 10 μM], SB203580 [p38MAPK, 10 μM], SP600125 [JNK, 10 μM], and
  PDTC [NF-κB, 30 μM]), either individually or as a cocktail, in both chambers of
  Transwells. At the 24 h timepoint, (A) apical and (B) basal media were collected
  and IL-6 concentrations quantified by ELISA. Data are mean (in pg/mL) ± SD of three
  donors (denoted by points, each donor quantified in technical triplicate). Statistical
  significance was assessed using one-way ANOVA with Dunnett’s multiple comparisons
  against the vehicle control (*p≤0.05, **p<0.01, ****p <0.0001). Endogenous IL-6
  secretion was detectable in vehicle-treated group. IL-1β robustly induced IL-6 secretion,
  and this induction was strongly suppressed by the inhibitor cocktail. Each single
  inhibitor partially attenuated IL-1β-stimulated secretion of IL-6, but not to the
  extent of the cocktail. In the absence of IL-1β, single inhibitors had little to
  no effect on endogenous secretion. Overall, across conditions, IL-6 concentrations
  are higher in the apical chamber than in the basal chamber
