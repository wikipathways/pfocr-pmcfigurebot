figure_title: STING-Mediated Innate Immune Signaling Pathway in D.
caption: STING-Mediated Innate Immune Signaling Pathway in D. melanogaster. This schematic
  illustrates the dSTING signaling pathway in the Drosophila melanogaster cell cytosol
  in response to bacterial cyclic dinucleotides (CDNs). Bacterial CDNs (c-di-AMP and
  c-di-GMP) and cyclic GMP-AMP (cGAMP) produced by Drosophila cyclic GMP-AMP synthase-like
  receptors (cGLRs) activate dSTING. Upon activation, dSTING initiates signaling through
  the immune deficiency (Imd) pathway, leading to activation of the NF-κB transcription
  factor, Relish. Activated Relish translocates into the nucleus, where it induces
  the transcription of antimicrobial peptide genes, promoting an effective innate
  immune response
