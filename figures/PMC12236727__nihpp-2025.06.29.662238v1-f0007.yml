figure_title: JUNB contributes to a persistent activated brain endothelial cell state
caption: 'A) Scatter plot showing Pearson correlation of orthologous DEG between mouse
  Pdcd10BECKO large vein BECs and human PDCD10-Knockdown (KD) cells under a CCM-like
  environment (500 μM DMOG and 10 ng/mL TNFα). Mouse values (x-axis) represent log2(CPM+1)
  from Pdcd10BECKO large vein cells. Human values (y-axis) represent log2(CPM+1) from
  PDCD10 KD + CCM environment. The color scale indicates local 2D point density (yellow:
  High-density; purple: low-density). Pearson correlation is R = 0.49, p < 2.2−16.
  B) Correlation of orthologous chromatin accessibility shown as log2(CPM+1) between
  Pdcd10BECKO large vein BECs and human PDCD10-KD under CCM environment. Color scale
  as in (A). Pearson correlation is R = 0.26, p < 2.2−16. C) Scatter plot comparing
  TF motif enrichment −log10(p-value) between Pdcd10BECKO large vein BECs and human
  PDCD10-KD under CCM environment. Each point represents a TF motif. Dashed blue line
  represents the regression line showing a positive correlation. Several conserved
  TFs, including JunB, Fos, Ets1, and ERG, are highlighted in magenta. Pearson correlation
  R = 0.53, p < 2.2e–16.D) KEGG pathway enrichment analysis of upregulated genes and
  more accessible putative enhancers in PDCD10-KD cells ± CCM environment compared
  to PDCD10-WT. Dot size represents the number of genes per term; color indicates
  −log10 p-value. Veh: Vehicle; CCM env: CCM environment. E) Heatmaps showing chromatin
  accessibility, JUNB binding, H3K27ac, and H3K4me1 levels at conserved cis-regulatory
  elements (cCREs) differentially accessible in PDCD10-KD + CCM env. Each row represents
  the same genomic region across all heatmaps. Regions were grouped into JUNB-positive
  (bottom) and JUNB-negative (top) categories based on JUNB binding. Color scale represents
  RPKM. F) Gene expression heatmap (Z-score of RNA log2 [CPM + 1]) for genes linked
  to region classified as putative enhancers from cCREs in (D). Left annotation indicates
  whether the gene is associated with JUNB-dependent (red), JUNB-independent (blue),
  or both (gray) putative enhancer regions. G) WashU Comparative Epigenome Browser
  snapshots of SERPINE1 locus. Tracks show chromatin accessibility, putative enhancer-gene
  linkage, and JUNB motifs in mouse large veins (Pdcd10BECKO and Pdcd10fl/fl), alongside
  aligned human genomic region (hg38) displaying chromatin accessibility and JUNB
  binding in PDCD10 WT under CCM-like environment, PDCD10-KD under CCM-like environment,
  and PDCD10-WT. Shared chromatin-accessible regions between mouse and human are highlighted
  in gray; shared regions containing JUNB motifs are highlighted in orange'
