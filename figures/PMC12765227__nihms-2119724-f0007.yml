figure_title: RNA-seq analysis of Khk knockdown mouse livers under high-fat diet reveals
  disrupted hepatic proteostasis via ubiquitination and apoptosis
caption: (A) Enrichment analysis of liver transcriptomes (GSE278322) identified ubiquitination
  as one of the top upregulated pathways, (B) with significant induction of Fbxo36
  and Synv1, (C) suppression of Bcl2, and (D) upregulation of Derl3. (E)In contrast,
  UPR markers Xbp1 and Grp78 showed no significant change (N=4 for each group). These
  data indicate that KHK loss activates ubiquitination-driven proteotoxic stress and
  apoptosis, consistent with findings in nutrient-stressed HepG2 cells. Data presented
  as mean ± SEM; *p < 0.05, **p < 0.01, ***p < 0.001 by unpaired two-tailed Student’s
  t-test
