figure_title: Sample distribution and RNA-seq of Tibetan sheep.
caption: Sample distribution and RNA-seq of Tibetan sheep. (A) Geographical distribution
  of testicular samples from Tibetan sheep populations; (B) Differential expression
  analysis between Tibetan and Small-tailed Han sheep, identifying 92 TSHDEGs (labeled
  genes represent the top three most significant hits by log2FC); (C) Comparative
  transcriptomics of Tibetan vs. Hu sheep, revealing 235 THDEGs (top three log2FC
  genes annotated); (D) Functional enrichment of TSHDEGs using clusterProfiler (v4.10.0)
  and AnnotationDbi (v1.62.0) with sheep annotation package “AH7526”, with the results
  showing significant association with flagellated sperm motility pathways (adjusted
  p < 0.05; FDR is used for multiple p value testing correction); (E) Cross-species
  functional annotation (human/mouse references) of conserved TSHDEG orthologs generated
  by Metascape [22], highlighting enrichment in reproductive process regulation and
  spermatogenesis; (F) Enrichment profile of THDEGs in cellular homeostasis, stress
  adaptation, and reproductive pathways via clusterProfiler (v4.10.0) (annotation
  package “AH7526”)
