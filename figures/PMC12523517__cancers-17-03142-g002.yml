figure_title: The effect of the JAK2 V617F mutation on MPNs.
caption: The effect of the JAK2 V617F mutation on MPNs. In the signaling pathway under
  the V617F mutation, the collapse of the hydrophobic interface separates JH1 from
  JH2, and the V617F mutation disrupts JH2-JH1 autoinhibition, so that JAK2 can still
  be continuously activated through receptor dimerization without ligand binding,
  catalyzing STAT phosphorylation, and a large number of P-STAT dimers enter the nucleus,
  so that the target genes (such as BCL XL, CYCLIN D1) are continuously highly expressed.
  Asterisk represents mutation
