figure_title: Ingenuity pathway analysis (IPA) identifying significant canonical pathways
  in HIV-1 Tat-treated mouse ECs.
caption: Ingenuity pathway analysis (IPA) identifying significant canonical pathways
  in HIV-1 Tat-treated mouse ECs. (A) Enriched canonical pathways in the IPA (p <
  0.1). Orange bars represent activated pathways with positive z-scores, while blue
  bars represent inhibited pathways with negative z-scores. The ratio (depicted by
  orange dots connected by an orange line) indicates the proportion of genes from
  the dataset that map to a given pathway relative to the total number of genes associated
  with that pathway. (B) Graphical summary of the network diagram in IPA, illustrating
  the significant regulatory effects after HIV-1 Tat treatment in mouse ECs. Orange
  nodes indicate predicted activation, blue nodes indicate predicted inhibition, and
  gray nodes indicate neutral or no prediction
