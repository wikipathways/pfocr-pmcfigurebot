caption: 'Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment analysis
  of significantly differentially expressed genes (DEGs) in sweet potato (Ipomoea
  batatas L.) leaves under drought stress at different developmental stages. Shown
  are the top 30 enriched KEGG pathways identified from the following pairwise comparisons:
  (a) CK (control; soil moisture maintained at 75 ± 5% field capacity (FC) throughout
  the growth period) vs. DS1 (drought stress; soil moisture maintained at 45 ± 5%
  FC for 15 days during the branching and tuber formation stage, 55–70 days after
  planting); (b) CK vs. DS2 (drought stress; soil moisture maintained at 45 ± 5% FC
  for 15 days during the storage root expansion stage, 90–105 days after planting);
  and (c) DS1 vs. DS2. The y–axis indicates the KEGG pathways, and the x–axis represents
  the Rich factor (the ratio of DEGs to the total number of annotated genes in each
  pathway). Dot size reflects the number of DEGs involved in each pathway, while dot
  color indicates the significance level of pathway enrichment (the darker the color,
  the smaller the p-value)'
