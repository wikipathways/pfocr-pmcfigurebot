figure_title: Transcriptomic analysis of the flesh of two pear varieties at five developmental
  stages.
caption: 'Transcriptomic analysis of the flesh of two pear varieties at five developmental
  stages. (A): Results of K-means cluster analysis of time series of the pulp for
  the two pear varieties. HF and LF represent ‘Heqingxiaoshali’ and ‘Lunanhuangpili’,
  respectively. The numbers after “-” indicate 50, 80, 110, 140, and 170 DAFs. (B):
  Statistical analysis of DEGs at different periods after flowering in the two pear
  varieties. The red module represents the total number of DEGs, the blue module represents
  the number of differentially expressed genes in ‘Heqingxiaoshali’ compared to ‘Lunanhuangpili’,
  and the green module represents the number of down-regulated differentially expressed
  genes in ‘Heqingxiaoshali’ compared to ‘Lunanhuangpili’. (C): KEGG pathway enrichment
  analysis of all DEGs. Circle size represents the number of enrichments, and color
  represents the significance of enrichment. Darker colors indicate more significant
  enrichment'
