caption: Differential gene expression profiles between KS and specific KAD diagnoses
  that occur with KS.A. Heat map demonstrating gene expression pattern of KS skin
  lesions among patients with KS alone and KS with other concurrent KADB. Volcano
  plot evaluating differentially expressed genes within KS skin lesion in patients
  with KS alone (reference) as compared to patients with KS and other concurrent KAD
  (condition)C. Gene ontology pathway analyses demonstrating differences in pathways
  between patients with KS and KAD as compared with KS aloneD. Volcano plot demonstrating
  differentially expressed genes within KS skin lesions in 19 patients with KS alone
  and 13 patients with KICS with KS.E. Volcano plot demonstrating differentially expressed
  genes within KS skin lesions in 19 patients with KS alone and 6 patients with MCD
  with KS.F. Selected cytokine gene expression differences between KS lesions from
  patients with KS alone and those with KS and other KAD (PEL, MCD or KICS).G. Cell
  deconvolution data demonstrating cell type differences within KS skin lesions between
  those with KS alone and those with KS and other KAD
