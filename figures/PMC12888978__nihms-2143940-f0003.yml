figure_title: Pathway-activation model.
caption: Pathway-activation model. A) Axonal streamlines of the modeled pathways (colors
  defined in Fig. 2). B) Extracellular voltage distribution applied to each axon model
  for level 3 ring mode cathodic stimulation. C) Activated axon models for a −1.5
  mA (cathodic) 60 μs pulse as calculated by the driving-force predictor. D) The full
  recruitment curve for all nine pathways at the dorsal STN location used in Bower
  et al. [26]. The recruitment curves show the median and interquartile range from
  1 mm of DBS electrode positional uncertainty. PT - pallidothalamic; mHD - motor
  hyperdirect; CT - cerebellothalamic; PST - pallidosubthalamic; STP - subthalamopallidal;
  mIC - motor internal capsule; pIC - prefrontal internal capsule; pHD - prefrontal
  hyperdirect; ML - medial lemniscus
