figure_title: The regulatory network of pyroptosis in vascular calcification (VC).
caption: 'The regulatory network of pyroptosis in vascular calcification (VC). Pyroptosis
  is an inflammatory lytic cell death initiated by multiple convergence points: the
  canonical pathway, the incomplete pyroptosis pathway, and a distinct non-canonical
  pathway. All three cascades culminate in the cleavage of a gasdermin family protein,
  generating pore-forming fragments that induce cell lysis and the release of copious
  inflammatory cytokines. Pyroptosis directly drives VC through the downstream pathway:
  pore formation and pro-calcific factor release. Activated inflammatory caspases
  cleave GSDMD/GSDME, generating N-terminal fragments that oligomerize to form plasma
  membrane pores. This leads to the release of mature IL-1β and IL-18, which act directly
  on vascular smooth muscle cells (VSMCs), activating signaling pathways that directly
  upregulate the expression of key osteogenic master genes such as Runx2, thereby
  initiating the calcification program'
