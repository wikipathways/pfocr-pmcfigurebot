figure_title: Short-chain fatty acids from beneficial microbiota modulate inflammatory
  pathways to prevent mastitis.
caption: Short-chain fatty acids from beneficial microbiota modulate inflammatory
  pathways to prevent mastitis. This diagram illustrates how beneficial microbiota
  species (Bifidobacterium, Parasutterella, Lactobacillus acidophilus, Lactococcus
  piscium, Garcionitricum multicarbonum, Lactococcus raffinolactis, and Lactobacillus
  spp.) produce short-chain fatty acids (propionate-blue dots, butyrate-red dots,
  lactic acid-yellow dots) that modulate immune signaling pathways. These SCFAs interact
  with toll-like receptors (TLR2/TLR4) at the cell membrane (pink dotted line), triggering
  cytoplasmic signaling cascades involving MyD88, TRIF, and other intermediates that
  regulate nuclear transcription factors (NF-κB, IRF) to suppress inflammatory cytokine
  activation, ultimately preventing mastitis in mammary tissue
article_title: Targeting the Gut–Mammary Axis for Understanding Mastitis Pathogenesis
