figure_title: Expression level of key genes involved in the carotenoid biosynthesis
  pathway in Thalassiosira rotula Na90A1 in Exp and Late exp phases.
caption: 'Expression level of key genes involved in the carotenoid biosynthesis pathway
  in Thalassiosira rotula Na90A1 in Exp and Late exp phases. Cultures were grown under
  standard medium (Ctrl), high nitrate medium (HN), low light condition (LL), and
  in a combination of both conditions (LL HN). Abbreviations: PSY, phytoene synthase
  (A,B); PDS, phytoene desaturase (C,D); ZCIS, 15-cis-ζ-carotene isomerase (E); ZDS,
  ζ-carotene desaturases (F); CRTISO, carotenoid isomerase (G,H). Uppercase letters
  indicate significant differences in the Exp phase; lowercase letters indicate significant
  differences in the Late exp phase (Tukey’s test, p < 0.05). Data were analyzed using
  the 2−ΔCt method and represent the mean ± SD; (n = 3)'
