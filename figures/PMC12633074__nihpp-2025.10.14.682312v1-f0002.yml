figure_title: STAT5 activation drives upregulation of the IRG1/itaconate pathway in
  TAMs
caption: 'a, Schematic representation of the metabolic pathway of IRG1-related metabolites.
  b, Heatmap indicates the relative levels of itaconate and its related metabolites
  in CM derived from BP-TAM and control macrophages in the untargeted metabolomic
  analysis. c, RT-qPCR analysis of IRG1 expression in THP-1-Mφ and 436-TAMs. Data
  are presented as mean ± s.d.; unpaired Student’s t-test; n = 3. d, Western blot
  analysis of IRG1 protein expression in THP-1-Mφ and 436-TAMs. e, RT-qPCR analysis
  of IRG1 expression in BMDMs and BP-TAMs. Data are presented as mean ± s.d.; unpaired
  Student’s t-test; n = 3. f, Western blot analysis of IRG1 protein expression in
  BMDMs and BP-TAMs. g, GSEA of RNA-seq data from BMDMs and BP-TAMs. h,i, Western
  blot analysis of STAT5 and phosphorylated STAT5 (p-STAT5) expression in THP-1-Mφ,
  436-TAMs, BMDMs, and BP-TAMs. j, Western blot analysis of IRG1 protein expression
  in THP-1-Mφ and 436-TAMs treated with inhibitors of STAT3, STAT5, and NF-κB. The
  inhibitors were used at the following concentrations: STAT3-IN-1 (10 μM), STAT5-IN-1
  (100 μM), and pyrrolidinedithiocarbamate ammonium (PDTC, 10 μM). k, RT-qPCR analysis
  of IRG1 mRNA expression in THP-1-Mφ and 436-TAMs treated with inhibitors of STAT3,
  STAT5, and NF-κB. Fold changes and P values in IRG1 mRNA levels in TAMs relative
  to THP-1-Mφ are shown. The inhibitors were used at the same concentrations as in
  (j). l, Western blot analysis of IRG1 protein expression in BMDMs and BP-TAMs treated
  with inhibitors of STAT3, STAT5, and NF-κB. The inhibitors were used at the same
  concentrations as in (j). m, RT-qPCR analysis of IRG1 mRNA expression in BMDMs and
  BP-TAMs treated with inhibitors of STAT3, STAT5, and NF-κB. Fold changes and P values
  in IRG1 mRNA levels in TAMs relative to BMDMs are shown. The inhibitors were used
  at the same concentrations as in (j)'
