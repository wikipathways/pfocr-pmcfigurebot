figure_title: Labile iron (Fe2+) plays a central role in oxidative lipid damage due
  to its high reactivity.
caption: 'Labile iron (Fe2+) plays a central role in oxidative lipid damage due to
  its high reactivity. In non-enzymatic lipid peroxidation, Fe2+ reacts with the hydrogen
  peroxide (H2O2) to generate hydroxyl radicals (•OH) via the Fenton reaction. The
  highly reactive hydroxyl radical abstracts hydrogen atoms from phospholipids (PL-H),
  generating the short-lived phospholipid radicals (PL•). The PL• react rapidly with
  oxygen present in their immediate proximity to produce the phospholipid peroxyl
  radicals (PL-OO•). The PLOO• extracts hydrogen from nearby polyunsaturated fatty
  acids (PUFAs), leading to the formation of toxic lipid hydroperoxides (PL-OOH) and
  propagating lipid peroxidation. In the enzymatic pathway, phospholipids such as
  phosphatidylethanolamines (PEs) are oxidized by 15-lipoxygenases (15-LOX) to form
  peroxyl radicals (PL-OO•). Iron catalyzes the conversion of PL-OO• to toxic phospholipid
  hydroperoxides (PL-OOH) leading to ferroptosis. Abbreviation: PE; Phosphatidylethanolamines;
  PL-H; phospholipid; PL-O·; phospholipid alkoxyl radical; PL-OO·; phospholipid peroxyl
  radical; PL-OOH; phospholipid hydroperoxide'
