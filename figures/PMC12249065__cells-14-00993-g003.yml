figure_title: Evaluation of the cholesterol biosynthesis pathway in modulating chemotherapeutic
  response in osteosarcoma cells.
caption: Evaluation of the cholesterol biosynthesis pathway in modulating chemotherapeutic
  response in osteosarcoma cells. (A) Kaplan–Meier curves showing overall survival
  and disease-specific survival of sarcoma patients stratified by HMGCR expression,
  analyzed using cBioPortal. (B) Cell viability of OS cell lines after cisplatin treatment
  for 72 h was assessed using the MTT assay. (C) Cell viability of OS cell lines after
  doxorubicin treatment for 72 h was assessed using the MTT assay. (D) Expression
  of the HMGCR gene in OS cell lines was evaluated using RT-qPCR. Effect of simvastatin
  in combination with cisplatin (E) or doxorubicin (F) on SaOS-2 cell viability, as
  determined by MTT assay. (G) The Heatmap with CI values of a combination between
  cisplatin and simvastatin in SaOS-2 cells. (H) The Heatmap with CI values of a combination
  between doxorubicin and simvastatin in SaOS-2 cells. A CI value of < 0.80 indicates
  synergism, 0.80–1.20 indicates an additive effect, and > 1.20 indicates antagonism.
  Effect of simvastatin in combination with cisplatin (I) or doxorubicin (J) on 143B
  cell viability. All experiments were repeated at least three times. * p < 0.05,
  ** p < 0.01, and *** p < 0.001 compared to the control group
