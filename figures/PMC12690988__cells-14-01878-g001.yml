figure_title: Therapeutic potential of apoptosis in post-TBI cognitive impairment.
caption: 'Therapeutic potential of apoptosis in post-TBI cognitive impairment. Apoptosis
  occurs through two main pathways. The intrinsic pathway initiates when BH3-only
  proteins bind and inhibit Bcl-2, leading to BAX activation, mitochondrial outer
  membrane permeability (MOMP), cytochrome c release, apoptosome formation, and subsequent
  activation of caspase-9 and caspase-3. The extrinsic pathway begins with FasL-Fas
  binding, activating caspase-8, and directly cleaving caspase-3. Pharmacological
  inhibition strategies include: agents that inhibit caspase-3, upregulate Bcl-2,
  and downregulate BAX (COG1410 via Akt/CREB/BDNF; PFT-α via p53 inhibition; Edaravone
  via BDNF/TrkB signaling; ZL006 via nNOS-PSD95 disruption; Azithromycin; Mild hypothermia);
  targeting caspase-3 inhibition (z-DEVD-fmk; HS38 via ZIPK/DEDD; Hyperbaric Oxygen
  Therapy); and other multi-target agents (Lupeol, which inhibits caspase-3, downregulates
  BAX, and reduces cytochrome c release; INO-1001, which inhibits PARP-1/AIF). Together,
  these strategies reduce neuronal death and cognitive impairment'
article_title: 'Regulated Cell Death in Traumatic Brain Injury: Investigating Mechanisms
