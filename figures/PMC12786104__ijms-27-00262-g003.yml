caption: 'Current approaches used for management—alleviation of CRH and levels of
  their action along the nociception pathway. The strategies used for management of
  CRHs are classified into two broad groups: (1) pharmacological and (2) non-pharmacological.
  While the former interferes with the generation and processing of nociceptive signals
  at multiple levels, the latter dampens the pain response at the highest level, i.e.,
  the perception stage. Abbreviations: OTC—over the counter; NSAID–non-steroid anti-inflammatory
  drugs; GABA—γ-aminobutyric acid; SNRI—serotonin-norepinephrine reuptake inhibitors;
  CB—cognitive behavioral; MBSR—mindfulness-based stress reduction'
