figure_title: Epigenetic effects of nutrients on myocardial transcriptional plasticity.
caption: Epigenetic effects of nutrients on myocardial transcriptional plasticity.
  Nutrients such as resveratrol, omega-3 fatty acids, and sulfur-containing compounds
  modulate myocardial epigenetic pathways, enhancing mitochondrial biogenesis, antioxidant
  gene expression, and cardiac adaptive capacity under metabolic and oxidative stress.
  Green and red arrows indicate modulation or changes in biological processes; black
  arrows indicate downstream functional outcomes. SIRT1 (Sirtuin1); PGC-1α (Peroxisome
  proliferator-activated receptor gamma coactivator 1-alpha); FOXO3a (Forkhead box
  O3a)
