figure_title: A diagrammatic depiction outlines three proposed pathways.
caption: A diagrammatic depiction outlines three proposed pathways. Path 1 shows the
  sequential formation of Aβ (a) monomers progressing to (b) oligomers and ultimately
  (c) fibrils. Introducing (d) Cys-Aβ@AuNPs redirects the normal aggregation pathway
  to either path 2a or 2b, depending on the concentration of Aβ monomers, with sub-femtomolar
  or micromolar concentrations leading to these pathways, respectively. Path 2(a)
  predominantly yields AuNP dimers or trimers (e) in solution, resulting in significant
  extinction variations. At the same time, path 2(b) leads to the formation of large
  AuNP aggregates (f), facilitating the detection of early-stage Aβ oligomerization.
  Pathway 3 demonstrates that the supernatant post-centrifugation (g) exhibits reduced
  aggregation propensity due to the decreased Aβ concentration (Adapted with permission
  from Chang et al., 2024 [91] and the American Chemical Society)
