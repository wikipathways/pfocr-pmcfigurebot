figure_title: Enhanced Pathway Disruption in the STZHFD Model Highlights the Complexity
  of T2D Pathophysiology in the IVD
caption: (A) A volcano plot displaying the significantly up-regulated genes. Several
  of the most up-regulated genes to appear in later ontological analyses have been
  labeled for the STZ-HFD model. (B) Venn diagrams comparing up- and down-regulated
  genes in the db/db model and the STZ-HFD model. Only 3 up-regulated genes and 1-down
  regulated gene was shared between the two models. (C) The STZ-HFD (marked with 2)
  model exhibits greater transcriptional alterations in T2D-related pathways than
  db/db (marked with 1) model, particularly in non-enzymatic glycosylation and RAGE
  signaling. (D) Immune response and inflammation pathways, including ubiquitination
  and proteasome degradation, are significantly disrupted in the STZ-HFD model but
  remain unaltered in db/db. ECM remodeling and structural integrity pathways are
  more extensively down-regulated in the STZ-HFD model, suggesting greater tissue
  disruption. Metabolic dysfunction is more pronounced in the STZ-HFD model, with
  additional up-regulation of pathways involved in amino acid metabolism and gluconeogenesis.
  Signal transduction and tissue differentiation pathways show significant alterations
  in the STZ-HFD model, indicating complex changes in cellular communication and development
  processes. (E) Based on ontological pathway analysis and significantly up-regulated
  genes, a suggested mechanistic diagram of T2D-induced intervertebral disc degeneration
  in the STZ-HFD mouse has been provided. Groups of processes have been grouped as
  diabetic symptoms, metabolic changes, immune/inflammatory changes, and matrix changes
article_title: The transcriptome and secreted factors of the intervertebral discs
  in STZ-HFD Type 2 diabetic male mice reveal extensive inflammation
