figure_title: A working hypothesis for CPF’s neurodevelopmental toxicity
caption: '(A) A schematic demonstration of the NO-HDAC hypothesis. Chlorpyrifos (CPF)
  exposure increases the abundance of the denitrifying bacteria Pseudomonas in the
  gut microbiome, enhancing the production of nitric oxide (NO) in the gut through
  the denitrification pathway. CPF is also known to stimulate NO production by activating
  eNOS through acetylcholine (Ach) accumulation and promoting iNOS expression. Elevated
  NO levels result in the selective inhibition of HDAC8 through S-nitrosylation. HDAC1
  and HDAC3 are resistant to S-nitrosylation and thus escape inhibition by NO. This
  selective inhibition skews the balance of class I HDAC activity in the developing
  zebrafish brain, altering histone acetylation patterns in a way that suppresses
  the expression of neuronal genes critical for social behavior, thereby leading to
  social behavioral deficits. Other biological effects of NO production include the
  downregulation of NO-sensitive bacteria of the genus Aeromonas and the upregulation
  of circadian genes, particularly the Per and Cry family genes. Butyrate inhibits
  all members of class I HDACs, including the zebrafish HDAC1, HDAC3, and HDAC8, thereby
  resetting the genome-wide balance of histone acetylation at gene loci targeted by
  class I HDACs. SNO: S-nitrosothiols. (B) Embryonic exposure (0–3 dpf) to the NO
  donor SNAP (10 μM) induced social deficits in Fishbook assay. Significance was calculated
  by two-tailed Student’s t test. *p< 0.05. (C) Embryonic exposure (0–3 dpf) to the
  non-selective PDE inhibitor IBMX (100 μM) did not induce measurable social deficits
  in Fishbook assay. Significance was calculated by two-tailed Student’s t test. ns:
  not significant'
article_title: Butyrate rescues chlorpyrifos-induced social deficits through inhibition
  of class I histone deacetylases
