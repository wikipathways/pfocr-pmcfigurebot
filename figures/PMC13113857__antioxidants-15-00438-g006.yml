figure_title: Pharmacological PTP4A1 inhibition improves pathological characteristics
  of alcoholic injury by impeding the MAPK/NF-κB signaling pathway.
caption: 'Pharmacological PTP4A1 inhibition improves pathological characteristics
  of alcoholic injury by impeding the MAPK/NF-κB signaling pathway. (A) Chemical structure
  of JMS-053. (B) Cell viability of HepG2 and AML12 cells treated with EtOH (400 mM,
  24 h) and JMS-053 (0.1, 0.5, 1 μM, 24 h). (C) Protein levels of MAPK/NF-κB pathway
  components in HepG2 and AML12 cells treated with EtOH (400 mM, 24 h) and JMS-053
  (1 μM, 24 h). (D) Schematic diagram of the JMS-053-treated Gao-Binge model mice.
  (E) Representative images of liver morphology and H&E staining from JMS-053-treated
  Gao-Binge model mice. Scale bar, 2.5 mm (gross morphology) and 200 μm (H&E); n =
  6 per group. (F) Serum ALT, AST, TG, and TP levels in JMS-053-treated Gao-Binge
  model mice (Control, n = 9; EtOH, n = 11; JMS-053 5 mg/kg, n = 11; JMS-053 10 mg/kg,
  n = 9). (G) Flow cytometric analysis of hepatic myeloid cells from JMS-053-treated
  Gao-Binge model mice. Representative density plots (upper) and quantitative analysis
  (bottom) showing the expression of Ly6C+CD11b+ and Ly6G+CD11b+ cells. Cells were
  gated on live, singlet, CD45+ cells. (H) CBC parameters: neutrophil (NEU%) and monocyte
  (MONO%) percentages; lymphocyte (LYMP) counts (×109/L) in JMS-053-treated Gao-Binge
  model mice. (I) Protein levels of MAPK/NF-κB pathway components in livers from JMS-053-treated
  Gao-Binge model mice. Data are represented as the mean ± SD, * p < 0.05, ** p <
  0.01, *** p < 0.001 by one-way ANOVA test (B,F–H)'
