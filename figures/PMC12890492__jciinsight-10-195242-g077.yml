figure_title: Deletion of ETS1 in HSCs promotes liver fibrosis in naive Ets1ΔHSC mice
caption: '(A) UMAP plot of snRNA-Seq data from liver cells of all donors, showing
  identified cell types and a red color-coded UMAP for ETS1 expression. (B) Violin
  plot showing the expression of ETS1 in each subset of liver cells. (C) Violin plot
  showing the expression of ETS1 in human liver samples from human normal (n = 5),
  MASL (n = 4), MASH (n = 9) groups. (D) Livers from Ets1fl/fl mice and Ets1ΔHSC mice
  (n = 3–5 per group) were stained for H&E, Sirius red, αSMA, desmin, and F4/80 (scale
  bar: 200 μm). (E) Positive area was calculated as a percentage. (F) Expression of
  fibrogenic genes and (G) inflammatory genes in the liver tissues were analyzed by
  using qRT-PCR. (H) Fibrogenic genes and (I) inflammatory genes in activated HSCs
  isolated from Ets1fl/fl mice and Ets1ΔHSC mice were measured by qRT-PCR. (J and
  K) Bulk RNA-Seq of mouse HSCs infected with nontargeting shRNA (control) or Ets1
  targeting shRNA (Ets1 knockdown). (J) Volcano plot of control versus Ets1 targeted
  HSCs. Differentially expressed genes (log2FC > 1.5, P < 10–10) are shown in red.
  (K) Reactome pathway enrichment analysis of control versus Ets1-knockdown HSCs.
  Data are expressed as the mean ± SD; *P < 0.05, **P < 0.01, and ***P < 0.001, unpaired
  Student’s t test'
