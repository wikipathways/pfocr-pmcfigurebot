figure_title: KLFs in hepatic and pancreatic physiology.
caption: KLFs in hepatic and pancreatic physiology. In the liver, KLFs modulate metabolic
  homeostasis by regulating genes involved in carbohydrate, lipid, and protein metabolism.
  KLF15 participates in gluconeogenesis, lipid oxidation, and amino acid metabolism;
  KLF10 and KLF11 influence hepatic insulin sensitivity and TGFβ-mediated pathways;
  KLF6 is involved in liver development, injury response, and fibrosis regulation.
  In the pancreas, KLF10 and KLF11—downstream targets of TGFβ—are enriched in islets
  of Langerhans and regulate β-cell mass, insulin gene expression, and β-cell function
  via SERTA Domain-Containing Protein 1 (SEI1) and pancreatic-duodenal homeobox-1
  (Pdx1). KLF6 maintains β-cell identity by upregulating β-cell–specific genes (Ins1,
  Ins2, Pdx1, Mafa) and preventing β-to-α transdifferentiation through meteorin-like
  (METRNL), whereas KLF7 impairs insulin secretion and β-cell gene expression while
  promoting inflammation (IL-6). KLF4 reprograms acinar cells toward ductal cell lineages
  and, in cooperation with NKX2.2, regulates α-cell–specific gene signatures. KLF15
  improves insulin secretion and confers resistance to diet-induced obesity by suppressing
  stearoyl-CoA desaturase 1 (SCD1). Created with BioRender.com
