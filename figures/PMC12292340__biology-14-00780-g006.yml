figure_title: PAQR3 regulates the PI3K-AKT signaling pathway in colon cancer.
caption: PAQR3 regulates the PI3K-AKT signaling pathway in colon cancer. (A) qRT-PCR
  analysis of the mRNA expression levels of differential genes associated with the
  PI3K-AKT signaling pathway in HCT15 cells with stable PAQR3 knockdown compared with
  the control group. (B) A correlation scatter plot comparing the results of RNA sequencing
  and qRT-PCR analyses. (C,D) Western blot (WB) analysis showing changes in protein
  expression levels following the overexpression (C) and knockdown (D) of PAQR3 in
  HCT15 cells, as depicted in the figure. The original images are shown in Figure
  S5. * indicates p < 0.05, ** indicates p < 0.01, and *** indicates p < 0.001
