figure_title: Effect of paracancerous tissue (PT)-resident Prevotella on clinical
  prognosis of NSCLC.
caption: Effect of paracancerous tissue (PT)-resident Prevotella on clinical prognosis
  of NSCLC. (A) Heatmap showing the distribution of clinical parameters across samples
  and their association with the PT-resident Prevotella. (B) Kaplan-Meier curves show
  a longer OS in the high PT-resident Prevotella group than in the low Prevotella
  group in both LUAD and LUSC. Survival differences were assessed using the two-sided
  log-rank test, with P < 0.05 considered statistically significant. (C) Forest plot
  illustrating hazard ratios (HR) of PT-resident Prevotella and other clinical parameters
  based on multivariable Cox regression analysis. (D) Volcano plot showing differential
  gene expression between the Prevotella high- and low-abundance groups, as determined
  by edgeR. Genes with P < 0.05 were considered significantly differentially expressed.
  (E) Functional enrichment analysis of highly expressed genes in high abundance group
  of Prevotella. (F) GSEA analysis showed that the inflammatory response pathway was
  significantly enriched in the high abundance group of Prevotella
