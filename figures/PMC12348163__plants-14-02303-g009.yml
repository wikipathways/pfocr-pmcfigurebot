figure_title: Proposed regulatory mechanism of D.
caption: Proposed regulatory mechanism of D. huoshanense in response to combined salt
  and high-temperature stress. Key stress-response pathways are highlighted in different
  colors in the schematic diagram. Combined stress leads to excessive accumulation
  of reactive oxygen species such as singlet oxygen (1O2), superoxide (O2−), and hydroxyl
  radicals (OH). The elevated ROS levels activate antioxidant defense systems, in
  which enzymes such as SOD, CAT, and POD play a key role in ROS detoxification, accompanied
  by metabolic adaptations including enhanced glutathione metabolism and flavonoid
  biosynthesis
