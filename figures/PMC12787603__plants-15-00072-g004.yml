figure_title: The roles of auxin in leaf morphogenesis.
caption: 'The roles of auxin in leaf morphogenesis. (A) Auxin in initiation of leaf
  primordium. Initiation of leaf primordium occurs in the SAM, which consists of three
  layers: L1, L2, and L3. Auxin accumulates on the flanks of the SAM through PIN1/AUX1-mediated
  transport, triggering primordia development. High auxin levels suppress KNOX1 expression.
  KNOX1 is essential for maintaining stem cell identity; it enhances CK levels and
  inhibits GA signaling via IPT7 and GA20oxidase, respectively. (B) Auxin in establishment
  of leaf polarity. Transcripts of AS1/AS2 accumulate in the adaxial domain of the
  leaf primordium, transcripts of ARF2/3/4, YAB and KAN accumulate in the abaxia domain,
  and WOX1/PRS are expressed in the intermediate domain of the leaf primordium. The
  transcription factors inhibit each other’s expression and control each other. High
  levels of auxin activates ARF, thereby facilitating the expression of YAB and KAN.
  Simultaneously, ARF2/3/4 and KAN were inhibited by AS1/AS2. KAN inhibited the expression
  of WOX1 and PRS, while WOX1 and PRS inhibited the expression of KAN. MP and off-axes
  enrichment of auxin together localized WOX1 and PRS expression in the intermediate
  domain. In addition, YAB promotes the expression of WOX1/PRS with KAN and ARF2/3/4.
  ARF6 and ARF8, induced by auxin, activate the expression of DWF4, thereby initiating
  the synthesis and signal transduction pathways of BRs. (C) For leaf shape formation,
  the feedback between auxin transport by PIN1 and up-the-gradient polar localization
  of PIN1 by auxin creates maxima in auxin concentration. This mechanism requires
  CUC2 for reorienting PINs. Auxin inhibits CUC2, stabilizing auxin maxima. The protrusions
  and indentations of serrations reflect areas of high auxin and CUC2 concentrations,
  respectively. Furthermore, the combination of CIN-TCP and KNOXII exerts a partial
  repressive effect on CUC2. For leaf size formation, Auxin induces the expression
  of ARGOS, which sustains the activity of the transcription factor ANT and a key
  cell cycle regulators, notably CYCD3, to promote cell proliferation, thereby increasing
  cell number. Auxin promotes cell expansion mainly via SAUR genes, which activate
  H+-ATPases in the plasma membrane. This process acidifies the apoplast, activates
  cell wall-loosening enzymes, and facilitates turgor-driven cell growth, ultimately
  determining leaf size. Note: → denotes positive regulation; T-shaped arrows indicate
  negative regulation'
article_title: Auxin Biosynthesis, Transport, Signaling, and Its Roles in Plant Leaf
