figure_title: Hepatotoxicity of PFOA and GenX in WT and PPARα−/− male mice.
caption: Hepatotoxicity of PFOA and GenX in WT and PPARα−/− male mice. (A) Experimental
  design of the exposure conditions in GSE212294, with systems biology approaches
  applied in the present study. (B) Principal component analysis (PCA) of normalized
  gene count across WT and PPARα−/− mice exposed to GenX and PFOA. (C) Heatmaps showing
  normalized and scaled gene count for differentially expressed genes (DEGs) in PPARα−/−
  (KO; knockout) vs. wild-type mice (305 upregulated and 237 downregulated genes).
  (D) Top 10 enriched biological pathways associated with upregulated genes in PPARα−/−
  mice (gold-colored) and downregulated genes (light blue-colored), where the x-axis
  represents the statistical significance of enrichment. (E) Heatmaps showing normalized
  and scaled gene count for DEGs across exposure groups vs. Group 1 (WT-control mice).
  (F) Venn diagrams of upregulated genes (gradient red-colored) and downregulated
  genes (gradient blue-colored) across exposure groups. (G) Top 30 enriched biological
  pathways associated with upregulated genes (gradient red-colored) and downregulated
  genes (gradient blue-colored) across exposure groups. Color intensity represents
  the statistical significance of enrichment (−log10 p-value), and the circle size
  reflects the number of genes associated with the corresponding pathway
