figure_title: Mechanistic details of BMEE in neuronal development are illustrated
  in a schematic diagram.
caption: Mechanistic details of BMEE in neuronal development are illustrated in a
  schematic diagram. Using structural modeling and molecular dynamics (MD) simulations,
  prospective bioactive components interacting with the TrkA extracellular domain
  have been identified. Small molecules from BMEE, such as δ–Tocopherol, O–methyl–,
  can bind to and activate the NGF–binding site of the TrkA receptor. TrkA activation
  upregulates p–Akt, Bcl–2, and Cdc42 and downregulates p-GSK3β expression. Positive
  modulation of these neuronal signaling pathways promotes neurite outgrowth, axonogenesis,
  dendritic arborization, and synaptogenesis. Upward (green) and downward (red) arrows
  denote upregulation and downregulation, respectively
article_title: Bacopa monnieri Promotes Neuronal Development by Regulating the Neurotrophin
  Signaling Pathway
