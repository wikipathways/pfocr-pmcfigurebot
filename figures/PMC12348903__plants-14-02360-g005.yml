caption: 'Effects of SiCML6 overexpression on the expression of low-temperature-responsive
  pathway genes in Arabidopsis. Relative transcript levels of CBF family genes AtCBF1
  (A), AtCBF2 (B), AtCBF3 (C), and the cold-responsive gene AtCOR15a (D) in WT and
  SiCML6-OE lines under normal temperature (23 °C) and 4 °C cold stress were analyzed
  by qRT-PCR. Data are presented as mean ± SE (n = 3). Asterisks indicate significant
  differences: * p < 0.05; ** p < 0.01'
