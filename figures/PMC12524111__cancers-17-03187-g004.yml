figure_title: Enzalutamide treatment upregulates E2F target gene expression.
caption: Enzalutamide treatment upregulates E2F target gene expression. (A) Selected
  hallmark pathways enriched in gene expression profiles comparing C4-2B-1M vs. C4-2B,
  C4-2B vs. MDVR, and C4-2B-1M vs. MDVR cells, highlighting a consistent upregulation
  of E2F target signatures following short-term enzalutamide exposure. (B) GSEA plots
  showing significant enrichment of E2F target gene sets in C4-2B-1M compared to parental
  C4-2B, C4-2B compared to MDVR, and C4-2B-1M compared to MDVR cells (p < 0.005).
  (C) Venn diagram showing overlapping upregulated E2F target genes across three comparisons
  (C4-2B-1M vs. C4-2B, C4-2B vs. MDVR, and C4-2B-1M vs. MDVR). (D) Heatmap showing
  expression patterns of commonly upregulated E2F target genes among the three groups.
  (E) RT-qPCR validation of representative E2F target genes in C4-2B, C4-2B-1M, and
  MDVR cells. Data are presented as mean ± SEM. (* p < 0.05, ** p < 0.01, *** p <
  0.001)
