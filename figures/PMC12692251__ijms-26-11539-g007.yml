figure_title: Prom1 deficiency induces EMT-associated gene expression in mRPE cells.
caption: Prom1 deficiency induces EMT-associated gene expression in mRPE cells. (A)
  Volcano plot of RNA-seq data highlighting differentially expressed genes associated
  with the hallmark EMT pathway. Genes with significant upregulation include Grem1,
  Serpine 2, and Pcolce2. Downregulated genes are Postn, Abi3bp, and Igfbp2. (B) Validation
  of IGFBP2 gene expression by qPCR in KO22 and KO26.4 compared to WT (* p < 0.05,
  ** p < 0.01). (C) POSTN gene expression in KO lines relative to WT (*** p < 0.001).
  (D) Grem1 gene expression in KO22 and KO26.4 compared to WT (** p < 0.01, *** p
  < 0.001). (E) Western blot analysis showing Grem1 protein levels in WT and Prom1-KO
  RPE cells, with Actin used as a loading control. Quantification of Grem1 and actin
  ratio (ns = not significant, * p < 0.05)
