figure_title: GSEA enrichment scores of AD-specific pathways using 7K SomaScan data
  from AD vs control plasma samples
caption: 'Two metrics of pathway enrichment are shown: (a) Enrichment Scores; and
  (b) Normalized Enrichment Scores (designed to account for differences in gene set
  size). For each pathway, SomaModules (red symbols) are compared to the original
  MSigDB counterparts (blue symbols). Pathways are ordered, from top to bottom, in
  decreasing order of SomaModule enrichment. Pathways shown are enriched in controls
  relative to AD patients. Pathway names from MSigDB are followed, in parenthesis,
  by the identifiers used in our repository, which are formed by a collection prefix
  (“WP” for WikiPathways, “KL” for KEGG Legacy, and “CGP” for Chemical and Genetic
  Perturbations) and an integer suffix'
