figure_title: TNF-α pathway activation during CAD progression.
caption: TNF-α pathway activation during CAD progression. A) Volcano plot of differentially
  expressed genes (DEGs) between normal and CAD groups in the GSE76882 dataset. B)
  KEGG pathway enrichment analysis of DEGs between normal and CAD groups. C) Western
  blot and quantification of TNF-α protein levels in renal tissue from normal and
  CAD groups. D) Volcano plot of DEGs between Syn and Allo groups. E) KEGG pathway
  enrichment analysis of DEGs between Syn and Allo groups. F) Western blot and quantification
  of TNF-α protein levels in renal tissue from Syn and Allo groups. G) Representative
  IHC images showing TNF-α expression in renal tissue from the normal, CAD, Syn, and
  Allo groups
