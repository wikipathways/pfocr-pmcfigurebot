figure_title: Single-cell transcriptomic landscape of myeloid cells in CLAD
caption: (A) UMAP visualization of macrophage subsets, separated by CLAD and control
  groups. Arrow shows where the cell type is. (B) Feature plot highlighting the overexpression
  of key genes in the Super.Macro subset. (C) Alluvial plot illustrating the proportion
  of Super.Macro within the IM and MoM populations per sample across different fibrotic
  disease types. Only scRNA-Seq datasets were included in this analysis, excluding
  Adam et al. 2020 due to differences in data processing pipelines. (D) Violin plot
  of pathway enrichment scores across different macrophage subsets
