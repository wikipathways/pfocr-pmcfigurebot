figure_title: AHR-activated macrophages promote embryo resorption in an abortion-prone
  mouse model.
caption: 'AHR-activated macrophages promote embryo resorption in an abortion-prone
  mouse model. (A) Schematic of the in vivo mouse models. CBA/J female mice were mated
  with BALB/c males to generate an NP model, or with DBA/2 males to establish an AP
  model. AP mice received daily intraperitoneal injections of CH223191 (20 μg/kg)
  or vehicle from GD 6.5 to GD 12.5. All mice were euthanized on GD 13.5. (B) Representative
  uterine images with resorbed embryos marked by red arrows. Total embryo resorption
  rates were quantified (n = 6 per group). (C) Representative immunofluorescence images
  showing AHR and CISH expression in decidual tissues from NP, AP, and AP mice treated
  with CH223191 (n = 3 per group). (D) Western blot and quantitative analysis of key
  components of the cGAS-STING signaling pathway, including cGAS, p-STING, STING,
  p-TBK1, TBK1, p-IRF3, and IRF3 protein levels in mouse decidual tissues from NP,
  AP, and AP mice treated CH223191 (n = 3 per group). (E) Representative immunofluorescence
  images showing co-localization of F4/80 and cGAS in mouse decidual tissues from
  NP and AP mice (n = 6 per group). Data are presented as mean ± SD. Statistical significance
  was assessed using the Student''s t-test for two-group comparisons and one-way ANOVA
  for multiple-group comparisons; ns: not significant, *p < 0.01, **p < 0.01'
article_title: Excessive Kynurenine Metabolism Impairs Lysosomal acidification and
