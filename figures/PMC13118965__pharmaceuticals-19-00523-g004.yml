figure_title: LGZG regulates BA profile and hepatic BA synthesis pathways in HFD-induced
  MASLD mice.
caption: LGZG regulates BA profile and hepatic BA synthesis pathways in HFD-induced
  MASLD mice. (A) Stacked composition of hepatic bile acids (BAs) in CON, HFD, and
  HFD + LGZG groups. (B) Stacked composition of serum BAs in CON, HFD, and HFD + LGZG
  groups. (C) Z-score heatmap of hepatic BA species (primary vs. secondary BAs as
  indicated). Heatmaps represent Z-score normalized intensities; differential species
  were screened by VIP > 1 and p < 0.05. (D) Absolute content of overlapping differential
  BAs in the liver (intersection of differential BAs from LGZG vs. HFD and HFD vs.
  CON, mostly non-12α-hydroxylated secondary BAs). (E) Z-score heatmap of serum BA
  species (primary vs. secondary BAs as indicated). (F) Absolute concentrations of
  representative serum BA species showing overlapping differential patterns as defined
  in (D). (G) Hepatic mRNA expression (detected by qPCR) of key enzymes in the classical
  and non-classical BA synthesis pathways. (H,I) Western blot (WB) bands (H) and quantitative
  analysis (I) of key enzymes in the classical hepatic BA synthesis pathway. (J,K)
  WB bands (J) and quantitative analysis (K) of key enzymes in the non-classical hepatic
  BA synthesis pathway. Data are presented as mean ± SEM (n = 6 mice/group for A–F,
  n = 8 mice/group for G, n = 3 mice/group for (H–K)). Statistical significance was
  determined by two-way ANOVA with Dunnett’s test (A,D), unpaired two-tailed Student’s
  t-test (C,F,G), one-way ANOVA with Dunnett’s test (I,K). * p < 0.05, ** p < 0.01,
  *** p < 0.001 vs. HFD group
