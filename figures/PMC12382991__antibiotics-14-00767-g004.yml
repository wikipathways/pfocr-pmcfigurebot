figure_title: Metabolomic profiling changes of H1 and M.
caption: Metabolomic profiling changes of H1 and M. (A,B) PCA distribution plots in
  cationic (A) and anionic modes (B). (C) Top 10 differential metabolite enrichment
  KEGG pathways. The enrichment rate is proportional to the number of metabolites
  annotated to the pathway. The p-value size is shown by a color gradient. (D) Differential
  metabolite distribution volcano plot. The horizontal coordinate is the logarithmic
  value of FC of the metabolite between the two groups, and the vertical coordinate
  is the logarithmic value of the p-value, and the size of the dots in the plots indicates
  the VIP value. (E) Differential metabolite clustering heatmap (left) and VIP bar
  graph (right). The VIP bar graph reflects the size of the VIP value by the length
  of the bar, and the color depth of the bar reflects the size of the metabolite p-value.
  The darker the color, the smaller the p-value. ** or *** represents a p-value <
  0.01 or <0.001, respectively
