figure_title: Graphical mechanism illustrating the role of DHCR24 deficiency in age-related
  meibomian gland dysfunction (ARMGD).
caption: Graphical mechanism illustrating the role of DHCR24 deficiency in age-related
  meibomian gland dysfunction (ARMGD). Deficiency in DHCR24, a key enzyme in cholesterol
  metabolism, contributes to ARMGD through lipid dysregulation and activation of the
  cGAS-STING pathway, resulting in chronic cellular inflammation and gland atrophy.
  Notably, AAV-mediated delivery of DHCR24 restores lipid homeostasis, suppresses
  STING-dependent inflammatory senescence, and reverses age-related pathological changes.
  This highlights its potential as a therapeutic strategy for age-related disorders
  associated with lipid-inflammatory imbalances
article_title: DHCR24 Deficiency Drives Age-Related Meibomian Gland Dysfunction by
  Regulating Lipid Metabolic Imbalance and Cytosolic mtDNA-Induced cGAS-STING Activation
