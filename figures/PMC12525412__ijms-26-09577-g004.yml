figure_title: SCAMP3 loss reverses the pathway response to ERK inhibition.
caption: SCAMP3 loss reverses the pathway response to ERK inhibition. The heatmap
  displays the predicted activity state of key canonical pathways across the four
  comparisons. The color intensity corresponds to the activation z-score. Red bars
  indicate predicted pathway activation (z-score ≥ 1.5), blue indicates predicted
  pathway inhibition (z-score ≤ −1.5), and gray indicates that no significant activity
  pattern was predicted. For this analysis, only statistically significant pathways
  (p ≤ 0.05) with at least five proteins showing directionally consistent changes
  in phosphorylation were considered. Canonical pathway analysis was performed using
  Ingenuity Pathway Analysis (IPA) software version 24.0.1
