figure_title: scRNA-seq and CellChat analysis reveal CD137 signaling as a potential
  pathway driving the abortive lytic phenotype
caption: (A) Hierarchy plot of the CD137 signaling pathway that depicts predicted
  signaling to and from each cluster. Loops denote signaling within the same cluster.
  Thicker bands correspond to stronger predicted overall signaling. (B) UMAP expression
  of CD137 (left) and corresponding validation by protein flow cytometry for CD137
  and gp350 in resting cells and cells treated with panobinostat +/− PAA (right).
  (C) UMAP expression of CD137L (left) and corresponding validation by protein flow
  cytometry for CD137L and gp350 in resting cells and cells treated with panobinostat
  +/− PAA (right). (D) Network centrality scores were computed to visualize which
  clusters were dominant senders (sources) and receivers (targets) in the CD137 signaling
  pathway. (E) Flow cytometry plots of resting cells and cells treated with panobinostat
  for expression of both CD137 and CD137L
