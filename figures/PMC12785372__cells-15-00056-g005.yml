caption: TRPV4 activation regulates matrix remodeling and activates pro-fibrotic pathways.
  TRPV4 activation can regulate matrix remodeling through TGF-β1 or independently.
  TRPV4 regulates mechanosensitive transcription factors YAP/TAZ, MRTF-A, matrix synthesis
  and turnover, focal adhesion stability, EMT, microRNA inhibition of β1 integrin
  cytoskeletal polymerization, and contractility. Adapted from Ji and McCulloch, 2021
  [244]. The interaction between PI3K and TRPV4 is denoted by a dashed arrow, as it
  has not been defined by supported data
