figure_title: Structure and biosynthesis of platensimycin, platencin, and platensilin.
caption: Structure and biosynthesis of platensimycin, platencin, and platensilin.
  (A) The structures of platensimycin (1, PTM), platencin (2, PTN), and platensilin
  (3, PTL), shown together with their nascent products thioplatensimycin (4), thioplatencin
  (5), and thioplatensilin (6). (B) Organization of the ptm BGC from S. platensis
  CB00739, which encodes the biosynthesis of 4–6. (C) Installation of the (7R)-hydroxyl
  group in 1–3 biosynthesis, involving a three-enzyme cascade, as exemplified by the
  conversion of 7 to 10 for 1.17 The steric bulk of the diterpenoid cage precludes
  α-attack at C7, requiring hydroxylation, oxidation, and reduction to occur sequentially
  on the β-face to install the (7R)-hydroxyl group. (D) Role of PtmU1 as a dehydratase
  supported by the isolation of 11, 12, and 13 from the ΔptmU1 mutant strain S. platensis
  sp. SB12055. (E) CoA-mediated substrate promiscuity and dehydration specificity
  of the PTM biosynthetic machinery demonstrated by PtmU1-catalyzed in-vitro conversion
  of 14 and 15 to 16 and 17, respectively. The full biosynthetic pathway for the varying
  diterpenoid-derived cage moieties and their final coupling with the 3-amino-2,4-dihydroxybenzoic
  thiocarboxylic acid to afford 4–6 is available in the Supporting Information (Figure
  S1)
