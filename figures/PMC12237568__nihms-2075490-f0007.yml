figure_title: DKK3-Driven Immune Modulation Combined with Checkpoint Blockade enhances
  antitumor immunity in pleural mesothelioma
caption: '(A) Influence of cancer cell-intrinsic DKK3: The increase of intrinsic DKK3
  expression, induced by Ad-DKK3, activates p53 pathway, IFN-α/γ response, and glycolysis
  in mesothelioma cells. This sequence of events culminates in the upregulation of
  PD-L1 on the surface of cancer cells.(B) The role of cancer cell-extrinsic DKK3:
  The secretion of DKK3, along with the decrease of immunosuppressive extracellular
  vesicles (EV), orchestrates tumor suppression. This process is marked by enhanced
  T cell infiltration, increased surface PD-L1, and the polarization of macrophages
  towards an M1-like, tumor-suppressing phenotype within the tumor-immune microenvironment.(C)
  PD-1/PD-L1 Axis Blockade: The application of anti-PD-1 monoclonal antibodies effectively
  disrupts the immune regulatory signaling between PD-1 and PD-L1. This interruption
  is pivotal in unleashing the cytolytic activity of T cells against tumor cells.(D)
  Synergistic Antitumor Immunity: The strategic combination of DKK3 modulation with
  checkpoint immunotherapy represents a novel approach to overcoming primary immune
  resistance in pleural mesothelioma'
article_title: Ad-SGE-DKK3 Gene Therapy Overcomes Resistance to Immune Checkpoint
  Blockade in Pleural Mesothelioma
