figure_title: Adipocyte FAM20C phosphorylates a distinct set of secreted proteins
caption: (A) Schematic of LC-MS/MS–based unbiased phosphoproteomic analysis of secreted
  proteins from control and Fam20c-deficient primary adipocytes. (B) Volcano plot
  showing top differentially phosphorylated secreted proteins in primary adipocytes
  with and without Fam20c. (C) Motif analysis and sitemap of top identified FAM20C-dependent
  phosphosites in B. (D) Pathway analysis of differentially expressed secreted phosphoproteins
  in primary adipocytes with and without Fam20c. (E) FFA release plotted over time
  and (F) rate of FFA production per hour from VAT explants of HFD-fed control and
  Ad-Fam20c–KO mice treated with either vehicle or 0.5 μM CL-316243 (n = 6 per group).
  (G) Glycerol release plotted over time and (H) rate of glycerol production per hour
  from VAT explants of HFD-fed control and Ad-Fam20c–KO mice treated with either vehicle
  or 0.5 μM CL-316243 (n = 6 per group). *P < 0.05; 2-way ANOVA followed by Šidák’s
  post hoc multiple-comparison test. Data are shown as the mean ± SEM
article_title: Secretory kinase FAM20C triggers adipocyte dysfunction, inciting insulin
  resistance and inflammation in obesity
