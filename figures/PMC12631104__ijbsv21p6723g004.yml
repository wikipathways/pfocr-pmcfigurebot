figure_title: Hcy induces K-Hcy of HMGB1/2 in endothelial cells.
caption: Hcy induces K-Hcy of HMGB1/2 in endothelial cells. A. Subcellular distribution
  of K-Hcy-modified proteins in endothelial cells via anti-K-Hcy proteomics (DeepLoc
  2.1-predicted). B. Sequence conservation analysis of K-Hcy-targeted motifs. C. KEGG
  pathway enrichment of K-Hcy-modified proteins highlights degenerative disease-associated
  pathways. D. GO biological process enrichment of chemoselective labeling-based K-Hcy
  differential proteomics. E. Venn diagram of K-Hcy proteomic overlap among chemoselective
  labeling, antibody-based IP, and Aging Atlas. F-G. Representative MS/MS spectra
  validating lysine-homocysteinylation (K-Hcy) at HMGB1 K65 (F) and HMGB2 K76 (G).
  H. Western blot showed that Hcy (200 μM, 96h) treatment and/or MARS1 overexpression
  enhanced HMGB1/2 K-Hcy in HCMECs, with no effect on acetylation
