figure_title: The expression profiles of differentially expressed genes (DEGs) involved
  in the sucrose and starch metabolism pathway in mesocotyls of Zheng58 seedlings
  was analyzed by RNA-sequencing (RNA-Seq).
caption: 'The expression profiles of differentially expressed genes (DEGs) involved
  in the sucrose and starch metabolism pathway in mesocotyls of Zheng58 seedlings
  was analyzed by RNA-sequencing (RNA-Seq). CK: mesocotyls of Zheng58 seedlings treated
  with 0 μM 24-epibrassinolide (EBR) application at 25 °C normal temperature; CKE:
  mesocotyls of Zheng58 seedlings treated with 2.0 μM 24-epibrassinolide (EBR) application
  at 25 °C normal temperature; LTE: mesocotyls of Zheng58 seedlings treated with 2.0
  μM 24-epibrassinolide (EBR) application at 10 °C low temperature; LT: mesocotyls
  of Zheng58 seedlings treated with 0 μM 24-epibrassinolide (EBR) application at 10
  °C low temperature. FPKM is the fragments per kilobase of transcript per million
  mapped read; FC is the fold change. (A) The expression situation of DEGs in different
  comparisons was explicited by comparing different comparisons of DEGs. The DEGs
  in green background area at the top is up-regulated, and in the pink background
  area at the bottom is down-regulated. (B) Raincloud plot shows the central tendency,
  dispersion degree, outlier and data density of DEG expression (log2(FPKM + 1)) in
  mesocotyls under four treatments. (C) Heatmap shows the significance of the expression
  (log2(FPKM + 1)) of DEGs under different treatments'
