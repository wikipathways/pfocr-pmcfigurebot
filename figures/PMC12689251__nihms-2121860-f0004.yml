figure_title: Dysregulated autophagy pathway in erythrocytes of patients with sickle
  cell disease (SCD).
caption: Dysregulated autophagy pathway in erythrocytes of patients with sickle cell
  disease (SCD). (A) Volcano plots showing the significant upregulation of cathepsin-B
  (CTSB), alpha-synuclein (SNCA), gamma-aminobutyric acid type-A receptor-associated
  protein (GABARAP), GABARAPL2, and MAP1LC3B (upper-right quadrant, p < 0.05) in SCD
  erythrocyte precursor cells. (B) Western blots showing protein expression of GABARAP,
  GABARAPL1 (GEC1), GABARAPL2 (GATE-16), CTSB, and SNCA in circulating erythrocytes
  of patients with SCD compared with controls. β-actin was used as a loading control.
  (C) Fold increases in protein levels of GABARAP, GABARAPL1 (GEC1), GABARAPL2 (GATE-16),
  LC3B, CTSB, and SNCA in circulating erythrocytes of patients with SCD compared with
  controls. HbAA = Hemoglobin-AA genotype; HbSS = hemoglobin-SS genotype
article_title: Mitochondrial retention and autophagy dysregulation drive oxidative
