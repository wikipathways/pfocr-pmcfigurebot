figure_title: Schematic illustration of the role and effects of oxidative stress in
  TTS pathophysiology.
caption: 'Schematic illustration of the role and effects of oxidative stress in TTS
  pathophysiology. In TTS patients, physical or emotional stress events triggers excessive
  catecholamines secretion from the adrenal medulla. Catecholamines stimulate β-adrenergic
  receptors, resulting in increased intracellular calcium influx and enhanced mitochondrial
  workload. Under these conditions, mitochondrial electron transport becomes inefficient,
  promoting electron leakage and the generation of ROS. The resulting redox imbalance
  and oxidative stress promote mitochondrial dysfunction with activation of the Hippo
  pathway associated with YAP-TEAD1 suppression, inflammatory responses with elevated
  CRP levels, and endothelial dysfunction associated with eNOS dysregulation. Altogether,
  this catecholamine-mediated dysregulation exerts multiple detrimental effects on
  the heart through both vascular and cellular mechanisms, ultimately contributing
  to the development of Takotsubo syndrome. BH4: Tetrahydrobiopterin; CRP: C-reactive
  protein; LVEF: left ventricular ejection fraction NO: nitric oxide; ROS: reactive
  oxygen species; ↑: increase; ↓: decrease'
