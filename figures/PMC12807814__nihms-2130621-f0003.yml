figure_title: Identification of CADM1 as a transcriptional target in EMX2-mediated
  RCC suppression
caption: 'A. Volcano Plot illustrating differentially expressed downstream genes in
  EMX2-overexpressing ACHN cells compared to control cells (Log2FC > 1, P < 0.05).
  B. GO biological process analysis in EMX2 overexpressing ACHN cells and control
  cells (Log2FC > 1, P < 0.01). C Heatmap analysis of PI3K/AKT pathway-related genes
  in EMX2 overexpressing ACHN cells and control cells (Log2FC > 1, P < 0.01). D-E:
  Western blot analysis of EMX2-overexpressed and control ACHN cells, using antibodies
  against PI3K, AKT, p-AKT, and BCL-2. Representative images (D) and statistics (E)
  were shown. F-G: Detection of E-cadherin and N-cadherin protein levels in EMX2-overexpressed
  and control ACHN cells through western blotting. Representative images (F) and statistics
  (G) were shown. H. The Venn diagram presenting 21 target genes shared between EMX2
  peak-related genes (−2000~+1000 bp to the TSS of the gene, P < 0.05) and EMX2 downstream
  genes identified by RNA-seq combined with ChIP-seq. I. Correlation analysis of the
  expression between EMX2 and CADM1 in RCC tissues using the Spearman method, revealing
  P < 0.001. J. IGV analysis displaying the binding peaks of EMX2 in regulatory region
  of CADM1 genome. K. Examination of mRNA expression of ATF3, CADM1 and HEG1 genes
  in EMX2-knockdown ACHN cells compared to control cells. L-M: ChIP assay employing
  an anti-Myc antibody or IgG to confirm EMX2 enrichment at binding sites in the promoter
  region of CADM1 in ACHN cells. Representative images (L) and statistics (M) were
  shown. N. Schematic diagram of the regulation of CADM1 promoter by EMX2. O. Luciferase
  reporter assay demonstrating a significant increase in CADM1 promoter-driven luciferase
  reporter activities in EMX2-overexpressing cells. P-Q: Western blot analysis of
  CADM1 levels in EMX2 overexpressing and control cells. Representative images (P)
  and statistics (Q) were shown. Error bars represent the mean ± SD of three biological
  replicates. Two-sided Student’s t test was used for statistical analysis. *P < 0.05,
  **P < 0.01, ***P < 0.001, and ns: not significant'
article_title: Empty spiracles homeobox 2 (EMX2) transcription factor functions as
  a tumor suppressor in renal cell carcinoma by targeting CADM1
