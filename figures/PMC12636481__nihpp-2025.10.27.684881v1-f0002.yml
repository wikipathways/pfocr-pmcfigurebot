figure_title: Elevated CSF fibrinogen levels are associated with increased markers
  of neurodegeneration independent of amyloidopathy
caption: 'a, Patterns of missingness of targeted immunoassay values in the discovery
  cohort (light purple indicates missing; 2.8% for fibrinogen, 22.5% for SNAP25; both
  missing completely at random) and b, multiple imputation of missing SNAP25 values.
  c, Weighted protein co-expression network visualization of the distinct 116-protein
  thromboinflammatory module. Module membership scores reflect the correlation between
  fibrinogen’s expression pattern and the module’s overall expression profile (eigengene):
  discovery cohort (0.36, P = 0.003), Knight ADRC (0.73, P = 1.59e-80), ADNI (0.58,
  P = 2.44e-7). Network preservation scores (0.85 and 0.96) indicate robust maintenance
  of pairwise co-expression relationships within the module across cohorts. Pathway
  enrichment analysis showed significant overrepresentation of: regulation of monocyte
  chemotaxis (P = 1.47e-4), T cell chemotaxis (P = 1.98e-4), lymphocyte chemotaxis
  (P = 9.54e-4), and antimicrobial humoral immune responses (P = 6.33e-4). d-g, Regression
  plots showing associations between CSF levels of fibrinogen and markers of synaptic
  degeneration in cognitively typical, amyloid-negative adults (N = 66): pTau181 (β
  = 0.289, Q = 0.032), NG36 (β = 0.335, Q = 0.029), SNAP25 (β = 0.350, Q = 0.029),
  and GAP43 (β = 0.286, Q = 0.032). h, No significant association was observed between
  fibrinogen and Aβ42/40 ratio (β = 0.124, Q = 0.347). i, A principal component analysis
  of synaptic biomarkers yielded a Neurodegeneration Score (PC1, 86.5% variance explained),
  which was significantly associated with CSF fibrinogen levels (β = 0.303, Q = 0.032).
  j, Regression plot showing the association of CSF Fibrinogen in the Extended Discovery
  Cohort (all subjects enrolled in the UCSF Hillblom cohort regardless of amyloid
  status) with cognitive processing (ms) (β = 0.422, Q = 0.030). Higher processing
  time (ms) indicates worse performance on this task. All CSF immunoassay values are
  log2 transformed and all associations are controlled for age and sex'
