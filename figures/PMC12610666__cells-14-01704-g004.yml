figure_title: The protective effect of fisetin against D-gal-induced oxidative stress
  in SYF-GCs was mediated by the Nrf2/HO-1 signaling pathway.
caption: The protective effect of fisetin against D-gal-induced oxidative stress in
  SYF-GCs was mediated by the Nrf2/HO-1 signaling pathway. (A,B) GCs were pretreated
  with 20 µM fisetin for 24 h and then cultured with 200 mM D-gal for another 24 h.
  The intracellular ROS production was detected by flow cytometry. (C–E) Antioxidative
  levels (CAT and T-SOD) and oxidative product (MDA) in the GCs under the indicated
  treatments. (F,G) WB assay of HO-1, NQO1, p-Nrf2, and Nrf2 in control, D-gal, Fisetin
  + D-gal, ML385 alone and ML385 + fisetin +D-gal groups. β-actin served as an invariant
  control for equal loading. (H) Detection of GSH level. (I) The mRNA levels of the
  SOD, CAT, Mgst, Gsta, Gsr genes in GCs following treatments described in F. (J,K)
  Detection of MMP in flow cytometry. Different lowercase indicated significant differences
  (p < 0.05)
