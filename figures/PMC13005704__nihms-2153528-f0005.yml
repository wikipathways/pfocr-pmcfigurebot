figure_title: Periplasmic biomineralization for photosynthesis
caption: (a) Schematic pathways describing how CdS nanoclusters are synthesized in
  the periplasm of E. coli. (b) Heatmap of transcriptomic study confirming the up-regulation
  of genes related to H2S production and ion efflux pumps. E_1, E_2, and E_3 represent
  three independent experimental groups, while C_1, C_2, and C_3 are the control groups.
  The number of the color bar represents fragments per kilobase of exon per million
  mapped fragments (FPKM). (c) Production of ATP in E. coli cells with biomineralized
  CdS nanoclusters under light. (d) Schematic showing the electron transport chain
  with up-regulated genes highlighted in red letters. (e) Heatmap of transcriptomic
  analysis indicating how CdS biomineralization up-regulated genes related to the
  electron transport chain, including dehydrogenases, terminal reductases and oxidases,
  and ATP synthases. (a-e) are reprinted with permission from ref 17. Copyright 2023
  American Association for the Advancement of Science
