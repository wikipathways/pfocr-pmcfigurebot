figure_title: The miRNA expression profiles in urine exosome.
caption: 'The miRNA expression profiles in urine exosome. (a) Heat map of differentially
  expressed miRNAs. Red color represents high relative expression level, and blue
  color represents low relative expression level. (b) Volcano plot of differentially
  expressed miRNAs. The blue dots represent the downregulated differential miRNAs.
  (c) Validation of four differentially expressed miRNAs by real-time PCR (N = 3).
  ∗∗∗∗p < 0.001 vs. DM group. (d) GO analysis revealed enrichment in biological processes,
  molecular function, and cellular component. (e) KEGG pathway analysis indicated
  associations with PI3K/Akt, MAPK, and p53 signaling pathways. Note: DM: diabetes
  mellitus exosomes; DKD: diabetic kidney disease exosomes'
