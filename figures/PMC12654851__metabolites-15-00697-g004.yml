figure_title: Pathways and bioprocesses represented by and significantly enriched
  in a metabolite-derived protein–protein interaction network.
caption: Pathways and bioprocesses represented by and significantly enriched in a
  metabolite-derived protein–protein interaction network. Proteins identified as interacting
  with three or more of the 13 obesity-related, T2D-relevant metabolites served as
  input to identify protein interactors. The set of proteins interacting with metabolites,
  the protein–protein interactors, and the proteins encoded by the genes identified
  by mQTL analysis were (n = 260) subjected to pathway enrichment analysis (see main
  text for details). Significantly enriched pathways are organized functionally by
  metabolism or bioprocess group. A corrected p value < 0.05 was considered significant
