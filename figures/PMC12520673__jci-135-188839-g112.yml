figure_title: CDK4/6i and CDK7i combination enhances immune-modulatory signaling and
  tumor antigen–specific T cell responses
caption: (A) GSEA plot showing upregulation of IFN-γ and inflammatory response pathways
  in cancer cells isolated from AT3OVA tumors treated in vivo with a combination of
  palbociclib (50 mg/kg) and SY5609 (2 mg/kg). Normalized enrichment score (NES) and
  q values are indicated for each pathway. (B) Volcano plot of differentially expressed
  genes in cancer cells following in vivo combination therapy, highlighting key immune-modulatory
  genes. (C) Flow cytometric quantification of OVA-specific CD8+ T cells in AT3OVA
  tumors following treatment. (D) Flow cytometric quantification of IFN-γ+–producing
  CD8+ T cells in AT3OVA tumors, stratified by OVA tetramer expression. (C and D)
  The middle line indicates the median, with box edges representing interquartile
  ranges (n = 6 mice/group). P values were calculated by unpaired t test (*P ≤ 0.05;
  **P ≤ 0.001)
