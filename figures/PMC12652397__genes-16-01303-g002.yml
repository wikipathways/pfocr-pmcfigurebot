figure_title: 'Chronic CRS (Type 2): Heart Failure-Driven Renal Proteome Remodeling.'
caption: 'Chronic CRS (Type 2): Heart Failure-Driven Renal Proteome Remodeling. In
  a rat model of chronic heart failure induced by volume overload (aorto-caval fistula),
  quantitative proteomics identified 67 differentially expressed renal proteins despite
  near-normal renal function. Among the most upregulated were angiotensin-converting
  enzyme (ACE, >20-fold increase) and intrarenal angiotensin II (AT II, >5-fold increase),
  indicating strong activation of the renin–angiotensin system. Periostin (POSTN),
  a matricellular protein linked to fibrosis, and the receptor for advanced glycation
  end-products (RAGE) were also markedly elevated. These findings highlight that subclinical
  renal injury in chronic CRS is driven by early fibrotic and pro-inflammatory pathways.
  Abbreviations: CRS, cardiorenal syndrome; ACE, angiotensin-converting enzyme; AT
  II, angiotensin II; POSTN, periostin; RAGE, receptor for advanced glycation end-products;
  Renal proteomics in rat ACF model (PRIDE: PXD009296)'
