caption: 'UA induces autophagic degradation of β-catenin through inhibition in PI3K/AKT/mTOR
  pathway. HCT-116 cells were treated with UA at different concentrations (0, 20,
  30, or 40 µM) for 22 h. Western blots for mTOR, phosphorylated mTOR (Ser2448), AKT,
  phosphorylated AKT (Ser473), PI3 kinase p55γ, phosphorylated PI3 kinase p55 (Tyr199),
  ULK1, phosphorylated ULK1 (Ser757), phosphorylated ULK1 (Ser555), 4E-BP1, phosphorylated
  4E-BP1 (Ser65), p70 S6 kinase, phosphorylated p70 S6 kinase (Thr389), and β-catenin
  proteins were obtained. GAPDH was loading control. Left arrowhead denotes the detected
  phosphorylated form of AKT (Ser473). Right arrowhead denotes the detected the PI3
  kinase p55γ. RE: relative expression'
