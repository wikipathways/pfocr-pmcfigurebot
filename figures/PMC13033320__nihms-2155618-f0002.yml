caption: 'Translocation from cytoplasm to periplasmic space by SEC and TAT translocation
  systems. SEC translocation is broadly characterized by two pathways, a SecA-dependent
  pathway and SRP-dependent pathway. The SecA-dependent pathway most commonly acts
  post-translation, and the SRP-dependent pathway typically works co-translationally,
  while there are exceptions to both [87–89]. The TAT system, in contrast, exports
  fully folded proteins that require cytoplasmic assembly or cofactor binding prior
  to translocation. OM: outer membrane; PP: periplasm; IM: inner membrane'
