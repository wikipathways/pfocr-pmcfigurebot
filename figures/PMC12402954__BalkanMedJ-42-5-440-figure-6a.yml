figure_title: In vivo experiment.
caption: In vivo experiment.(a-c) OCSCs were implanted into the intracranial cavity
  of mice, and 740 Y-P, LY294002, Purmorphamine and Cyclopamine were injected intraperitoneally
  twice a week. The tumor volume was monitored weekly, and the tumor was stripped
  and weighed after 4 weeks. Tumor volume and weight increased significantly after
  740 Y-P and purmorphamine intervention, and decreased significantly after LY294002
  and cyclopamine intervention. (d). Ki-67 and CD31 expressions in tumor tissues were
  detected by immunohistochemistry. They increased significantly after 740 Y-P and
  Purmorphamine intervention, and decreased significantly after LY294002 and Cyclopamine
  intervention (× 20, 100 μm). (e, f) PAS staining was used to detect angiogenesis
  in tumor tissues. 740 Y-P and Purmorphamine could promote VM formation, while LY294002
  and Cyclopamine could inhibit VM formation (× 20, 100 μm). (g) PI3K pathway protein
  expressions were detected by Western blot. The expression of p-PI3K and p-AKT increased
  notably when 740 Y-P intervention, and decreased significantly after LY294002 intervention.
  (h) Hedgehog pathway protein expressions were detected by Western blot. The expression
  of Smo, SHH and Gli1 protein increased significantly after Purmorphamine intervention,
  and decreased significantly after Cyclopamine intervention. (i-k) VM formation and
  invasion-related protein levels in tumor tissues were detected by Western blot.
  When 740 Y-P and Purmorphamine treatment, E-cadherin level was significantly decreased,
  N-cadherin, VE-cadherin, MMP2 and MMP9 protein expressions were significantly increased.
  However, after LY294002 and Cyclopamine treatment, the above protein levels were
  significantly reversed.n = 5, data are represented as mean ± SD, *p < 0.05, **p
  < 0.01, ***p < 0.001 vs. control group. Repeated-measures ANOVA was used to analyze
  the tumor growth curve. One-way ANOVA followed by Tukey’s Honest Significant Difference
  as a post-hoc test to determine the corrected significance of comparison between
  multiple groups, or Kruskal-Wallis test followed by Dunn’s test as a post-hoc test
  to ascertain the corrected significance of comparison between multiple groups was
  used where appropriate.OCSCs, ovarian cancer stem cells; HIF-1α, hypoxia-inducible
  factor-1α; PI3K, phosphatidylinositol 3-kinase; PI3K, phosphatidylinositol 3-kinase;
  AKT, protein kinase B; Smo, smoothened; SHH, sonic hedgehog; MMP, matrix metalloproteinase;
  SD, standard deviation
