caption: Post-tuberculosis (TB) care pathway integrating domain-specific assessment
  and management. This diagram illustrates a conceptual framework for post-TB care,
  beginning with initial assessment at the completion of TB treatment. Survivors undergo
  domain-specific evaluations to identify residual morbidity and guide tailored interventions.
  Management plans address comorbidities and lifestyle factors alongside rehabilitation
  and psychosocial support. Long-term follow-up and strategies for social reintegration
  are essential to restore health, dignity, and participation in community life
