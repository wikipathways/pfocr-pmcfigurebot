figure_title: Proposed mechanistic model of CXCL1-induced atrial fibrosis.
caption: Proposed mechanistic model of CXCL1-induced atrial fibrosis. Schematic illustration
  of the pathway through which CXCL1 promotes atrial fibrosis via ERS activation and
  upregulation of TXNDC5. Activation of ATF6 leads to nuclear transcription of TXNDC5,
  enhancing collagen folding and secretion, thereby contributing to atrial remodeling
  and increased susceptibility to atrial fibrillation
