figure_title: rAAV infection induces aberrant cell cycle progression and activation
  of the ATM/Chk1/Chk2 pathway
caption: '(A) DAPI fluorescent image showing an extreme example of nuclear enlargement
  24 hours after treatment with rAAV (MOI = 1E6, right) compared to control (left).
  B) Average nuclear area of cells treated with rAAV compared to control cells (n
  = 63 wells per condition; unpaired t-test). (C) Cells treated with different doses
  of rAAV within a single experiment demonstrate dose-dependent nuclear enlargement
  (n = 6 wells per condition; one-way ANOVA followed by pairwise comparison using
  Tukey’s test). (D) Representative ICC images of control (left) and rAAV-infected
  (right) hNPCs stained for ATM, CHK2, ATR, and CHK1 24 hours after infection. Scale
  bar = 20 μm. (E) The average number of ATM+, CHK2+, ATR+, and CHK1+ foci per nucleus
  are compared for wells infected with rAAV versus control (n = 9 wells per condition;
  unpaired t-test). (F) Total protein expression in hNPCs infected with rAAV was measured
  by western analysis and compared to control conditions (n = 4 experiments; ratio
  paired t-test). All values are normalized by the average control protein expression.
  (G) The average number of CHK2+ foci per cell is plotted at each MOI, exhibiting
  a dose-dependent response (n = 9 wells per condition; one-way ANOVA followed by
  pairwise comparison using Tukey’s test). (H) Left Example of partial rescue of rAAV-induced
  reduction in proliferation in hNPCs treated with and without the CHK2 inhibitor
  (n = 3 wells per condition). Right: Reduction in hNPC proliferation at 72 hours
  is plotted for wells infected with rAAV and compared to those treated with both
  rAAV and CHK2 inhibitor (n = 18 wells per condition; unpaired t-test). (I) Left:
  Example of partial rescue of rAAV-induced cell death in hNPCs treated with and without
  the CHK2 inhibitor (n = 3 wells per condition). Right: Quantification of cell death
  at 72 hours is plotted for wells infected with rAAV and compared to those treated
  with both rAAV and CHK2 inhibitor (n = 18 wells per condition; unpaired two-tailed
  t-test)'
