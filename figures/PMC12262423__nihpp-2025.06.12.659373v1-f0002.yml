figure_title: NBD dimerization captures TAP in the outward-facing state. See also
  Figures S2–S4
caption: '(A) NBD dimerization stabilizes the outward-facing state. (B) Molecular
  model of TAP (EQ) in the NBD-dimerized outward-facing ATP-bound state. TAP1 and
  TAP2 are shown as ribbon and colored in sky blue and gold, respectively. The boundaries
  of the membrane are shown as silver lines. (C-D) TAP2 TM3 is flexible and adopts
  two conformations in the outward-facing state: an outward-facing open (C) and kinked
  (D) state. The molecular model of TAP1 and TM3 are represented as cartoons with
  the side chains represented as sticks. Cryo-EM density corresponding to TAP1 and
  TAP2 TM3 are colored in transparent sky blue and gold, respectively and contoured
  to 0.12 and 0.196 SDs, respectively. The N- and C-pockets of the peptide binding
  sites are labeled. (E) The translocation pathway is open to the membrane (top) and
  endoplasmic reticulum (ER) lumen (bottom). TAP is represented as molecular surface'
