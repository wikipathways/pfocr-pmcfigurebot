figure_title: Analysis of the DEGs in astrocytes and oligodendrocytes in PTHS brains
caption: (A and D) Volcano plots representing the genes that were differentially expressed
  in Cre+ compared to Cre− astrocytes (left) and oligodendrocytes (right) are shown.
  Dots represent differentially expressed genes. The upregulated gene cutoff was log2fold
  change > 0.5 and Bonferroni adjusted p-value (p adj) < 0.05. The downregulated gene
  cutoff was log2fold change < −0.5 and p adj < 0.05. (B and E) Network/pathway analysis
  of the DEGs identified in Cre+ versus Cre− astrocyte (B) and oligodendrocyte (E)
  clusters. (C and F) Box plots showing the most differentially regulated genes identified
  in astrocytes (C) and oligodendrocytes (F). Blue boxes represent Cre− cells, and
  orange boxes represent Cre+ cells. Statistical analysis was done using R-suit. ****p<0.0001.
  Enlarged Figure 7B and E are shown in Supplemental Figure 10
