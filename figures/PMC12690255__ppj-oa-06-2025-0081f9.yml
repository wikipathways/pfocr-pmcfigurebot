figure_title: Pathway analysis of significantly differential metabolites (both primary/intermediary
  metabolites and signaling hormones) implicated in the differential phenotypic cassava
  responses at 1, 3, and 7 days after Sri Lankan cassava mosaic virus (SLCMV) inoculation
  (dai) via viruliferous whitefly infestation.
caption: 'Pathway analysis of significantly differential metabolites (both primary/intermediary
  metabolites and signaling hormones) implicated in the differential phenotypic cassava
  responses at 1, 3, and 7 days after Sri Lankan cassava mosaic virus (SLCMV) inoculation
  (dai) via viruliferous whitefly infestation. Different block colors indicate different
  metabolic pathways: red block represents tryptophan metabolism, green block represents
  phenylalanine metabolism (while green arrows indicate related genes and involved
  activities), blue block represents phenylpropanoid biosynthesis, yellow block represents
  flavonoid, flavone, and flavanol biosynthesis, separated block mentions alpha-linolenic
  acid metabolism (while green arrows indicate related genes and involved activities),
  and violet block and arrows represent the impact of each metabolic/biosynthesis
  pathway. This figure is modified from the Kyoto Encyclopedia of Genes and Genomes
  database-related figures in papers by Peluffo et al. (2010), Li et al. (2023), Mano
  and Nemoto (2012), Sasaki-Sekimoto et al. (2013), Sasaki-Sekimoto et al. (2013),
  Wagner et al. (2012), and Dehghan et al. (2014). HCT, p-hydroxycinnamoyl-CoA shikimate
  hydroxycinnamoyl transferase; C3H, p-coumarate 3-hydroxylase; CCoAOMT, caffeoyl-CoA
  O-methyl transferase; PEP, phosphoenolpyruvate; PAL, phenylalanine ammonia lyase;
  UGCT, UDP-glucose:glycoprotein glucosyltransferase; C4H, cinnamic acid 4-hydroxylase;
  4CL, 4-coumarate; CHS, chalcone synthase; CHI, chalcone isomerase; FNSI, flavone
  synthase I; F3H, flavanone 3-hydroxylase; LAR, leucoanthocyanidin reductase; FLS,
  flavonol synthase; CPY450, cytochrome P450 monooxygenase; NPR1, NONEXPRESSOR OF
  PATHOGENESIS-RELATED GENES 1; PR, PATHOGENESIS-RELATED; COI1, coronatine-insensitive
  1; JAZ, JASMONATE ZIM DOMAIN'
