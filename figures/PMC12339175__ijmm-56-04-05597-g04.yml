figure_title: Pharmacological targeting of AhR to modulate ferroptosis in cancer and
  I/R injury.
caption: 'Pharmacological targeting of AhR to modulate ferroptosis in cancer and I/R
  injury. AhR ligands regulate lipid peroxidation and ferroptosis through different
  molecular axes, demonstrating environment-dependent therapeutic potential. In parenchymal
  organs, such as the heart, liver and kidneys, AhR antagonists CH223191 and SR1 alleviate
  I/R injury by inhibiting the iron-stimulating pathway: CH223191 downregulates CYP1A-driven
  ROS amplification and COX-2-mediated inflammatory signals, while SR1 inhibits HMOX1-dependent
  iron release and IDO1-induced oxidative stress, jointly maintaining the redox balance
  of cells. In tumors, AhR is pharmacologically regulated through AhR ligands, such
  as aminoflavone, ITE, SR1 and CH223191, thereby influencing key molecules in various
  lipid peroxidation and ferroptosis processes, and further inducing ferroptosis in
  tumor cells or enhancing their sensitivity to erastin. This is expected to eliminate
  tumor cells, alleviate tumor progression and enhance the anti-tumor efficacy of
  iron deposition inducers. AhR, aryl hydrocarbon receptor; HMOX1, heme oxygenase
  1; IDO1, indoleamine 2,3-dioxygenase 1; ROS, reactive oxygen species; COX-2, cyclooxygenase-2;
  TCDD, 2,3,7,8-tetrachlorodibenzo-p-dioxin; NQO1, NAD(P)H dehydrogenase [quinone]
  1; GST, glutathione S-transferase; UGT1A1, UDP-glucuronosyltransferase 1-1'
