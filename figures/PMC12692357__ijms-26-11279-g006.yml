figure_title: Schematic representation of the interrelated mechanisms linking pain,
  stress, inflammation, and prognostic outcomes via IL-6 and mCRP/CRP signaling.
caption: Schematic representation of the interrelated mechanisms linking pain, stress,
  inflammation, and prognostic outcomes via IL-6 and mCRP/CRP signaling. This diagram
  illustrates the interconnected biological pathways through which chronic pain and
  emotional distress contribute to systemic inflammation and poor clinical outcomes.
  Pain, modulated by both peripheral nociceptive input and central sensory-emotional
  processing, leads to altered pain perception. This altered perception, especially
  under the influence of chronic psychosocial stress, activates the hypothalamic–pituitary–adrenal
  (HPA) axis, triggering a stress response characterized by cortisol release. Elevated
  cortisol and subsequent activation of nuclear factor kappa-light-chain-enhancer
  of activated B cells (NF-κB) lead to increased transcription of proinflammatory
  genes. This cascade promotes the release of systemic inflammatory mediators, including
  interleukin-6 (IL-6) and C-reactive protein (CRP), with mTOR signaling acting as
  a metabolic and growth regulator under inflammatory stress. The elevated inflammatory
  burden feeds back to sensitize pain pathways (via glial activation and peripheral
  sensitization), further exacerbating pain perception and emotional distress. Over
  time, this cycle contributes to maladaptive inflammatory pathways, which worsen
  overall prognostic outcomes by promoting disease progression, impaired healing,
  or psychiatric comorbidity
article_title: Monomeric [CRP] and CRP-Controlled Stress and Pain Hypersensitization
  as Novel Predictors of Cognitive Disturbance and AD in Chronic Inflammatory Disease
