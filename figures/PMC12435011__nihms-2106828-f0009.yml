caption: Effects of COX4 isoform expression on methionine pathway metabolites in glioma
  cells exposed to hypoxia. Bars represent the levels of key metabolites involved
  in the methionine pathway analyzed in COX4–1-expressing (gray bars) and COX4–2-expressing
  (red bars) glioma cells cultured under hypoxia for 24 hours. The numbers below each
  graph indicate the mean value ± SD for each metabolite, based on five independent
  measurements. *, p < 0.05; **, p < 0.01;***p < 0.001; ****p < 0.0001
