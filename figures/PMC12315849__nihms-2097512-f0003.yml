figure_title: Schematic representation of the potential pathways involved in the effects
  evaluated in the current study.
caption: Schematic representation of the potential pathways involved in the effects
  evaluated in the current study. The dorsal column-median lemniscus pathway, the
  primary pathway activated during SSEP generation, is shown in green. Projections
  carrying non-DN mediated sensory information to and from cerebellar structures are
  shown in purple. Dentate projections to the cortex, including the dentato-thalamo-cortical
  and dentato-rubro-thalamic projections, are shown in red. The rubrospinal tract,
  a descending pathway which modulates the dentate, is shown in black. Thalamic intralaminar
  nuclei and reticular nucleus are not shown for simplicity. Created in BioRender
  (BioRender, Toronto, Canada)
article_title: Timing- and Frequency-Specific Effects of Dentate Nucleus Deep Brain
