caption: The internalization of S. suis EVs induces metabolic changes in macrophages.
  (A) Volcano plot of differential metabolites detected between Raw264.7 cells and
  Raw264.7 cells incubated with 50 μg/mL of EVs. (B) Principal component analysis
  (PCA) of differential metabolites between RAW264.7 cells and Raw264.7 cells incubated
  with EVs. (C) Heatmap analysis of differential metabolites between Raw264.7 cells
  and Raw264.7 cells incubated with EVs (D) KEGG pathway analysis of differential
  metabolites between Raw264.7 cells and Raw264.7 cells incubated with EVs, where
  the red box highlights the differential metabolite enrichment pathway associated
  with the red box highlighting. Data are shown as the means ± SDs
