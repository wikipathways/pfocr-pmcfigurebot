figure_title: 25,000 compound diversity screen in tRCC cells using the TFE3 chromatin
  displacement assay
caption: (A) Screening funnel of 25,000 compounds leading to 4 hits after dose response
  validation studies.(B) Replicate-Replicate scatterplot for run 4 (out of 5 total
  runs) of chromatin displacement screening of 25,000 compounds in in FUUR1 cells.
  Chromatin displacers, red; chromatin retention, green (see methods for hit selection
  from the 5 separate runs). Primary hits from this run are labeled in red or green;
  validated hits are named.(C) Dose-dependent increase in nuclear signal of TFE3 with
  BRD6866 treatment (chromatin retention) in a chromatin displacement assay (CDA)
  in FUUR1 cells. Nuclear signal (DAPI) as well as nuclear IF signal for TFE3 and
  BRD4 were quantified and plotted (mean ± SD, n=3).(D) Dose-dependent decrease in
  nuclear signal of TFE3 with BRD7659 (chromatin displacement) in a CDA in FUUR1 cells.
  Nuclear signal (DAPI) as well as nuclear IF signal for TFE3 and BRD4 were quantified
  and plotted (mean ± SD, n=3).(E) Chemical structure of BRD6866 and BRD7659.(F) RNA
  Seq of UOK109 cells after 16h treatment with BRD6866 at 1μM. Differential transcriptomics
  analysis using a volcano plot is shown. Antiapoptotic genes with known sensitivity
  to CDK9 inhibition, MCL1 and XIAP are labeled (51). RNA Seq schematic created using
  BioRender.com.(G) Hallmark gene set pathway enrichment analysis upon BRD6866 treatment
  was compared to two recent studies with CDK9 inhibition (CDK9i) and CDK9 degradation
  (CDK9d) (21,32).(H) CDK activity profiling assay (Reaction Biology) showing extent
  of inhibition of various CDK/cyclin pairs by BRD6866 (10 μM). Loss of activity for
  each CDK and cyclin pairs by BRD6866 was compared to DMSO control. CDK9/cyclin pairs
  are bolded. The cyclin interacting motif PFTAIRE defines a subgroup of CDKs that
  does not fall under named categories
