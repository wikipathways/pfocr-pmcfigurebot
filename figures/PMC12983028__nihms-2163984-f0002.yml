figure_title: Chronic NKAR stimulation induces a dysfunctional, tissue resident-like
  gene signature on NK cells
caption: (A) Principal component analysis depicting differences in transcriptional
  signatures between the two day 4 groups and the four day 10 groups. (B) Differentially
  expressed genes (DEGs) (log2FC >0.6; FDR < 0.05) between groups at various time
  points. (C) Venn diagrams depicting overlapping and unique DEGs between groups and
  time points. (D and E) Overrepresentation pathway analysis for downregulated genes
  in Control vs NKAR (D) and Control vs. IL-15 (E) comparisons. (F and G) MD plot
  of Control vs. NKAR DEGs (F) and Control vs. IL-15 DEGs (G) (log2FC >0.6; FDR <
  0.05). (H) Scatterplot comparing tumor-infiltrating NK cell signatures (Tang et
  al.) to NKAR (left) and IL-15 (right) signatures. (I) List of top downregulated
  genes in the tumor-infiltrating NK cell gene expression data set (Tang et al.) for
  CD56 bright and CD56 dim NK cells. (J) Heatmap depicting the top 30 downregulated
  DEGs in the Control vs. NKAR comparison (day 10). (K) Gene set enrichment analysis
  (GSEA) comparing the NKAR DEGs (day 10) to lung resident memory CD8 T cell (TRM)
  (bottom, Kumar et al.) and lung resident NK cell (top, Dogra et al.) gene sets.
  RNAseq data are representative of three independent stimulation experiments with
  n = 5 (NKAR and NKAR + IL-15) or n = 7 (Control and IL-15) donors per group. *p
  < 0.05, **p < 0.01, ***p < 0.001, ****p < 0.0001; n.s., not significant
article_title: Chronic NK cell activation results in a dysfunctional, tissue resident-like
