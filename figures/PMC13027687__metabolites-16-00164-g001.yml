figure_title: 'Integrated multi-omics and spatial metabolomics workflows for deciphering
  metabolic interactions: (A) Multi-omics integration workflow combining transcriptomic
  (RNA-seq) and metabolomic (LC-MS/GC-MS) profiles through correlation analysis to
  generate co-expression networks and pathway modules; (B) Spatial metabolomics utilizing
  MALDI-MSI for the in situ visualization of metabolite distribution within plant
  tissue sections; (C) Integration and discovery phase, where the combination of multi-omics
  networks and spatial data enables spatio-temporal mapping, leading to the precise
  localization of metabolites and elucidation of candidate biosynthetic pathways.'
caption: 'Integrated multi-omics and spatial metabolomics workflows for deciphering
  metabolic interactions: (A) Multi-omics integration workflow combining transcriptomic
  (RNA-seq) and metabolomic (LC-MS/GC-MS) profiles through correlation analysis to
  generate co-expression networks and pathway modules; (B) Spatial metabolomics utilizing
  MALDI-MSI for the in situ visualization of metabolite distribution within plant
  tissue sections; (C) Integration and discovery phase, where the combination of multi-omics
  networks and spatial data enables spatio-temporal mapping, leading to the precise
  localization of metabolites and elucidation of candidate biosynthetic pathways.
  Arrows indicate the direction of the workflow and data integration steps. Different
  colors are used to visually distinguish between the transcriptomic, metabolomic,
  and spatial imaging modules'
