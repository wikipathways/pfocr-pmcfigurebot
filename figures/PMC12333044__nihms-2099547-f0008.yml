figure_title: PAX3::FOXO1 directly and epigenetically activates neural-related gene
  targets
caption: (A) Diagram representing the focus on 2,585 genes that are differentially
  expressed according to RNA-seq and regulated by a PAX3::FOXO1-bound enhancer in
  PAX3::FOXO1-injected (P3F) embryos according to the activity-by-contact model.(B)
  Log2FC expression in P3F versus CNTL embryos of differentially expressed genes in
  Figure 7A. A Mann-Whitney test on absolute values was used to determine statistical
  significance.(C) Average ATAC and H3K27ac signal between replicates at the 2,528
  PAX3::FOXO1-bound enhancers that regulate activated genes, respectively.(D) The
  top five enriched GO biological processes with DAVID analysis for genes directly
  upregulated by PAX3::FOXO1; n = 1,668.(E) Top six enriched cell type signatures
  from MSigDB from gene list pathway analysis, with genes directly upregulated by
  PAX3::FOXO1.(F and G) Representative IGV tracks of activation of neural zebrafish
  transcription factors her3 and olig2 in P3F embryos, respectively. Top tracks are
  PAX3::FOXO1 ChIP-seq (purple), middle tracks are ATAC-seq (blue), and lower tracks
  are H3K27ac ChIP-seq (green). Black lines indicate predicted enhancer-promoter interactions.(H)
  GSEA for activated genes from (A) on publicly available RNA-seq between PAX3::FOXO1-patient
  tumors and skeletal muscle RNA-seq from Shern et al.2(I) Average normalized expression
  of genes enriched in patient tumors from (H) in each publicly available patient-derived
  xenografts from Stewart et al.63Data are represented as mean expression and error
  bars represent standard deviation. *p < 0.05; **p < 0.01; ***p < 0.001
