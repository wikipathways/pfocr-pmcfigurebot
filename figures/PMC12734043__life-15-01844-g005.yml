figure_title: KEGG pathway enrichment analysis of genes from co-expression modules
  identified by WGNCA.
caption: KEGG pathway enrichment analysis of genes from co-expression modules identified
  by WGNCA. (A) KEGG pathway enrichment of genes in the pink module. (B) KEGG pathway
  enrichment of genes in the red module. (C) KEGG pathway enrichment of genes in the
  turquoise module. (D) KEGG pathway enrichment of genes in the brown module. (E)
  KEGG pathway enrichment of genes in the blue module. Each dot represents a significantly
  enriched KEGG pathway (adjusted p-value < 0.05). The x-axis indicates the gene ratio
  (the proportion of genes in the module involved in a given pathway), while the size
  of each dot reflects the number of genes associated with that pathway. The color
  gradient represents the adjusted p-value, with darker red indicating higher significance.
  Pathways were identified using enrichment analysis of genes within each module,
  and only the top significant terms are shown
