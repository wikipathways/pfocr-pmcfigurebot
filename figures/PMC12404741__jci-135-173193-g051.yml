figure_title: GPR31 and its glycosylation at N5 are required for MASH progression
  in mice
caption: '(A) Validation of transgenic overexpression of GPR31-WT and GPR31-N5Q mutant
  in mice by Western blot analysis. n = 3 mice. (B) Liver weight and liver weight/body
  weight ratio in GPR31-WT and GPR31-N5Q transgene mice. n = 8 mice. (C) H&E and Oil
  Red O staining of liver sections in GPR31-WT and GPR31-N5Q transgene mice. n = 8
  mice. Scale bars: 100 μm. (D) CD11B and Picrosirius red (PSR) staining of the liver
  sections of the mice in the indicated group. n = 5 mice. Scale bars: 100 μm. (E)
  Effect of GPR31-WT and GPR31-N5Q transgene on serum triglyceride (TG) and total
  cholesterol (TC) levels. n = 7 mice. (F) Effect of GPR31-WT and GPR31-N5Q transgene
  on the phosphorylation of key proteins in the identified MAPK signaling pathway
  in mouse liver. n = 3 mice. (G) Transcriptomic profiling of GPR31-WT and GPR31-N5Q
  transgenic mouse livers. Differentially expressed genes are highlighted. n = 3 mice.
  Data are shown as mean ± SEM. *P < 0.05; **P < 0.01; ***P < 0.001; NS, no significance,
  P > 0.05'
