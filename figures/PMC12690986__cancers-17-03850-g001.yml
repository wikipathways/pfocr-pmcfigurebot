figure_title: From organ cancer tissue to organoid.
caption: From organ cancer tissue to organoid. PDAC primary tissue is isolated from
  the patient’s pancreas and dissociated mechanically and/or enzymatically into single
  cells or small clusters. The cells are then embedded in an extracellular matrix
  (e.g., Matrigel) and overlaid with an organoid growth medium containing key components
  such as mitogens (epidermal growth factor (EGF) and fibroblast growth factor 10
  (FGF10)), Wnt signaling activators (R-spondin-1 and Wnt3a), and inhibitors of the
  BMP/transforming growth factor β (TGF-β) pathway (Noggin and/or A83-01). Under these
  culture conditions, the cells proliferate within the ECM and self-organize into
  patient-derived organoids (PDOs). The PDO are suitable for a wide range of downstream
  applications. Created in BioRender. https://app.biorender.com/illustrations/68babb66fe28a63ab72348b6
  (accessed on 24 October 2025)
