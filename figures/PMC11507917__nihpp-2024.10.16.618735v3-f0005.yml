figure_title: Impaired contingency learning induced by the lever retraction cue is
  associated with attenuated RPE DA signals in the mesolimbic pathway
caption: 'Omission test design for the LI5 task (a) and the LR5 task (b). (c) Total
  number of lever presses during the omission test (two-way ANOVA, task effect: F1,32
  = 17.87, p < 0.001; no task × region interaction: F1,32 < 1, p = 0.529). (d) Response
  rate in lever press per second (LP/s), within the lever press sequence (two-way
  ANOVA, task effect: F1,32 = 40.49, p < 0.001; no task × region interaction: F1,32
  < 1, p = 0.821). (e) Number of sequences completed during the last LI5/LR5 training
  session and the omission test (three-way RM ANOVA, task effect: F1,32 = 18.39, p
  < 0.001; task × session interaction: F1,32 = 34, p < 0.001; no task × session ×
  structure interaction F1,32 = 1.43, p = 0.24). (f) Frequency distribution of sequence
  lengths during the omission session. The grey dashed line represents the “optimal”
  sequence length of 5 lever presses (three-way RM ANOVA, no task effect: F1,32 <
  1, p = 0.585; task × sequence length interaction: F9,288 = 47.06, p < 0.001; no
  task × sequence length × region interaction: F9,288 < 1, p = 0.979; Student Newman-Keuls
  post hoc pairwise comparison). (g) Probability to enter the port within the lever
  press sequence (within-sequence port entry) (two-way ANOVA, task effect: F1,32 =
  155.75, p < 0.001; no task × region interaction: F1,32 = 1.98, p = 0.169). (h) Port
  entry latency following omission of the reward (two-way ANOVA, no task effect: F1,32
  < 1, p = 0.95; no region effect: F1,32 < 1, p = 0.74; task × region interaction:
  F1,32 = 4.41, p = 0.044). (i) Port entry latency following unexpected reward delivery
  (two-way ANOVA, no task effect: F1,32 < 1, p = 0.940; no task × region interaction:
  F1,32 < 1, p = 0.361). (j) Phasic VTA dopamine neuron activity around port entries
  following reward omission. (k) Area under the curves for 1 to 3 seconds after reward
  omission (unpaired two-tailed t-test comparison, t16 = −3.30, p = 0,004). (l) Phasic
  VTA neuron activity around reward retrieval. (m) Area under the curves for 0.5 to
  1 seconds after reward retrieval (unpaired two-tailed t-test comparison, t16= 2.15,
  p = 0.047). (n) Phasic NAc Core DA signal around port entries following reward omission.
  (o) Area under the curves for 1 to 3 seconds after reward omission (unpaired two-tailed
  t-test comparison, t16= −3.07, p = 0,007). (p) Phasic NAc Core DA signal around
  reward retrieval. (q) Area under the curves for 0.5 to 1 seconds after reward retrieval
  (unpaired two-tailed t-test comparison, t16 = 1.36, p = 0.191). Data shown as means
  ± SEM, superimposed with individual data point. LI5 n = 16 (6 males; 10 females);
  LR5 n = 20 (10 males; 10 females). Red horizontal bars indicate significant difference
  between LI5 and LR5 tasks at 95% confidence level. Filled circles: males; Empty
  circles: females. *p < 0.05; **p < 0.01; ***p < 0.001'
