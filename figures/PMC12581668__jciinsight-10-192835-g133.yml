figure_title: Translational defects in primary cilia genes in the CNS of SMA mouse
  embryos
caption: '(A) Bar chart showing the dysregulated genes associated to the cilium assembly
  canonical pathway identified by IPA. Light purple bars represent downregulated DEGs;
  dark purple bars represent upregulated DEGs. (B) Schematic of a primary cilium highlighting
  the main structural components: intraflagellar transport (IFT) proteins complex
  A and B, transition zone and fibers, basal body, and cell membrane. (C) Functional
  enrichment analysis network of cilium assembly DEGs. Downregulated molecules in
  light purple; upregulated molecules in dark purple. Different shapes indicate molecules
  with distinct biological functions. Black arrows show the enrichment of individual
  molecules to the functional terms formation of cilia and assembly of non-motile
  cilium. Blue arrows indicate a predicted inhibition state on the specific functional
  term. Both functional terms are highlighted in blue, indicating an overall inhibition.
  Statistical significance was defined using the following cutoff values: log2FC_thr
  = 0.3 and pval_thr = 0.05. P values were derived using the glmQLFTest function in
  edgeR. *P value ≤ 0.05, **P value ≤ 0.01, ***P value ≤ 0.001'
