figure_title: Doxorubicin modulates the AKT/mTOR/FOXO signaling pathway in C2C12 cells.
caption: Doxorubicin modulates the AKT/mTOR/FOXO signaling pathway in C2C12 cells.
  (A) Western blot analysis showing decreased phosphorylation of p-AKT (Ser473) in
  Dox-treated cells, whereas total AKT levels were unchanged. p-4E-BP1 (Thr37/46)
  slightly increased following Dox exposure, while p-mTOR (Ser2448) and total mTOR
  remained unaltered. (B) Dox treatment reduced phosphorylation of FOXO1 (p-FOXO1;
  Ser256) and FOXO3a (p-FOXO3a; Ser253), indicating their dephosphorylation and activation,
  and concomitantly upregulated the ubiquitin ligases MAFbx and MuRF1. (C) Quantitative
  analysis of FOXO phosphorylation status showing decreased p-FOXO1/FOXO1 and p-FOXO3a/FOXO3a
  ratios in Dox-treated cells. Data represent mean ± SD; p<0.05 vs. control (Tukey’s
  test). Different letters (a, b, c) denote groups significantly different from each
  other; n.s., not significant. Con, control; Dox, doxorubicin; AKT, protein kinase
  B; mTOR, mammalian target of rapamycin; FOXO, forkhead box O; 4E-BP1, eukaryotic
  translation initiation factor 4E-binding protein 1; MAFbx, muscle atrophy F-box;
  MuRF1, muscle RING finger 1; SD, standard deviation; n.s., not significant
