figure_title: Mechanistic illustration of SCFA-mediated neuroprotection via astrocytic
  EAAT2 in Parkinson’s disease.
caption: Mechanistic illustration of SCFA-mediated neuroprotection via astrocytic
  EAAT2 in Parkinson’s disease. Dietary fiber is metabolized by the intestinal microbiota
  to produce short-chain fatty acids (SCFAs), which act on astrocytes to upregulate
  EAAT2 expression. Enhanced EAAT2 function accelerates glutamate (Glu) clearance,
  reducing extracellular Glu-induced reactive oxygen species (ROS) accumulation. This
  decrease in oxidative stress activates the Nrf2-mediated antioxidant pathway, ultimately
  contributing to the protection of dopaminergic neurons against MPTP-induced neurotoxicity.
  Created in BioRender. https://BioRender.com/nqqr282 (accessed on 2 November 2025)
article_title: Short-Chain Fatty Acids Enhance EAAT2-Mediated Glutamate Clearance
