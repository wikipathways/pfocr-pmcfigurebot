figure_title: Enrichment analysis of curated gene-sets and transcription factor targets.
caption: Enrichment analysis of curated gene-sets and transcription factor targets.
  (a, b, c) Along X-axis, we have gene-sets procured from differential analysis of
  HIV data, in the distribution of DEGs in the corresponding cell-types in the three
  AD stages from31. The enrichment was performed for the 24 cell-types in the AD data
  and the two neuronal classes taking all the excitatory and inhibitory subclasses
  together. Except for the manually curated ’dna_repair_uv_neurons’ gene-set, all
  the rest are pre-defined in the databases used for the pathway analysis mentioned
  in the Methods. (d, e, f, g) Enrichment of transcription factor targets in the TRRUST25
  database dysregulated in the two neuron classes. (d, e) Enrichment of transcription
  factor targets in the significantly down (d) and up (e) regulated DEGs in excitatory
  neurons; (f, g) Enrichment of transcription factor targets in the significantly
  down (f) and up (g) regulated DEGs in inhibitory neurons
