figure_title: KEGG pathway enrichment highlights coordinated signaling, cytoskeletal,
  and neurobiological responses to exposure.
caption: KEGG pathway enrichment highlights coordinated signaling, cytoskeletal, and
  neurobiological responses to exposure. Dot plots showing KEGG pathway enrichment
  results derived from differential gene expression analysis. (A) Over-representation
  analysis (ORA) of differentially expressed genes identifies significant enrichment
  of pathways involved in signal transduction and cellular processes, including MAPK
  signaling, regulation of the actin cytoskeleton, neuroactive ligand–receptor interaction,
  and pathways associated with neurodegeneration. (B) Gene set enrichment analysis
  (GSEA) reveals coordinated enrichment of pathways related to neurodegenerative disease,
  intracellular signaling, and metabolism, reflecting shared molecular processes such
  as mitochondrial function, proteostasis, oxidative stress response, and cytoskeletal
  integrity rather than disease-specific mechanisms. In both panels, the x-axis represents
  the gene ratio (proportion of pathway genes represented), dot size corresponds to
  the number of genes contributing to each pathway, and dot color indicates the adjusted
  p-value (FDR). Together, these analyses demonstrate broad, pathway-level transcriptional
  remodeling characterized by integrated effects on signaling cascades, cellular structure,
  and neurodevelopmentally relevant processes rather than isolated gene-level perturbations
