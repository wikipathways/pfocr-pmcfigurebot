figure_title: Isoimperatorin treatment affects gene expression profiles associated
  with the immune response system in AML cells.
caption: Isoimperatorin treatment affects gene expression profiles associated with
  the immune response system in AML cells. Heatmaps indicated that differentially
  expressed genes in THP-1 cells treated with isoimperatorin were involved in (A)
  ‘chemokine signaling pathway’, (B) ‘Th1 and Th2 cell differentiation’, (C) ‘NOD-like
  receptor signaling pathway’ and (D) ‘leukocyte transendothelial migration’. From
  each pathway, two upregulated and downregulated genes in (E) ‘chemokine signaling
  pathway’, (F) ‘Th1 and Th2 cell differentiation’, (G) ‘NOD-like receptor signaling
  pathway’ and (H) ‘leukocyte transendothelial migration’ processes were selected
  and evaluated by reverse transcription-quantitative PCR analysis in THP-1 cells.
  Data are presented as the mean ± SD. Significant differences were examined using
  unpaired two-tailed Student's t-test in panels (E)-(H). **P<0.01 and ***P<0.001.
  THP-1, Tohoku Hospital Pediatrics-1. C represents the control samples, with THP-1_C1,
  THP-1_C2, and THP-1_C3 as biological replicates. THP-1_T represents THP-1 cells
  treated with 12.5 µM isoimperatorin, including THP-1_T1, THP-1_T2, and THP-1_T3
  as biological replicates
