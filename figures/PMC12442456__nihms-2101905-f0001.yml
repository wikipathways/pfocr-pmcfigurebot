figure_title: Specialized Three-way Contact Sites Between Endoplasmic Reticulum, Mitochondria,
  and Lipid Droplets Facilitate Metabolic Coordination
caption: 'Schematic representation of specialized membrane contact sites between endoplasmic
  reticulum (ER), mitochondria, and lipid droplets. The illustration depicts three
  critical processes: calcium signaling pathways, fatty acid exchange mechanisms,
  and mitochondrial nucleoid distribution. Key molecular mediators are highlighted:
  Mitochondrial trifunctional protein (Mtln) interacts with mitochondrial creatine
  kinase (mtCK) to facilitate lipid exchange for cardiolipin maintenance and fatty
  acid oxidation, while mitochondrial fission protein 1 (Mtfp1) regulates cardiolipin
  distribution to coordinate mitochondrial dynamics'
