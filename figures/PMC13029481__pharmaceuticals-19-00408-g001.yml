figure_title: Molecular Mechanism of Action of Glucagon-like Peptide-1 (GLP-1) in
  Pancreatic β-Cells.
caption: Molecular Mechanism of Action of Glucagon-like Peptide-1 (GLP-1) in Pancreatic
  β-Cells. GLP-1 binds to its receptor on the β-cell membrane, activating the G protein-coupled
  signaling pathway by replacing GDP with GTP on the α-subunit. This activates adenylate
  cyclase, leading to the production of cAMP, which in turn activates PKA. The signaling
  cascade causes membrane depolarization and opening of voltage-gated Ca2+ channels,
  resulting in Ca2+ influx that triggers insulin secretion. Concurrently, Ca2+ activates
  CaMKIV, and together with PKA, phosphorylates CREB in the nucleus, enhancing insulin
  gene transcription. This integrated mechanism promotes both rapid insulin release
  and sustained insulin synthesis, supporting glucose homeostasis
