figure_title: Cell Type-Specific Signaling Pathways of GLP-1 Receptor Agonists in
  Cardiovascular Protection.
caption: 'Cell Type-Specific Signaling Pathways of GLP-1 Receptor Agonists in Cardiovascular
  Protection. Schematic representation of the molecular signaling cascades activated
  by GLP-1 receptor (GLP-1R) stimulation in three major cardiovascular cell types.
  (A) Cardiomyocytes: GLP-1R activation triggers dual signaling pathways: (i) Gαs-mediated
  activation of adenylyl cyclase (AC) leading to increased cAMP production and subsequent
  activation of protein kinase A (PKA) and exchange protein activated by cAMP (Epac),
  and (ii) PI3K/Akt pathway activation. These converging pathways ultimately promote
  cardiomyocyte survival (Pro-survival ↑). (B) Endothelial cells: GLP-1R stimulation
  activates both cAMP/PKA and PI3K/Akt signaling cascades. The PI3K/Akt pathway phosphorylates
  endothelial nitric oxide synthase (eNOS), resulting in increased nitric oxide (NO)
  production. PKA activation also contributes to eNOS phosphorylation. These pathways
  collectively enhance vasodilation (Vasodilation ↑). (C) Vascular smooth muscle cells
  (VSMCs): GLP-1R activation in VSMCs primarily leads to Gαs-mediated cAMP/PKA signaling
  while simultaneously inhibiting pro-proliferative pathways including ERK1/2 and
  p38 MAPK (indicated by inhibitory symbols). PKA activation results in suppression
  of NF-κB signaling. These mechanisms collectively reduce VSMC proliferation (Proliferation
  ↓), contributing to the anti-atherosclerotic effects of GLP-1 agonists. Arrows indicate
  activation pathways; blunt-ended lines represent inhibitory signals. The distinct
  signaling profiles across cell types underscore the pleiotropic cardiovascular protective
  effects of GLP-1 receptor agonists'
