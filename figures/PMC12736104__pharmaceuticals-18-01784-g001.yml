caption: Conceptual overview of immune checkpoint pathways highlighting BTLA as an
  emerging therapeutic target. This illustration presents established inhibitory checkpoints—PD-1/PD-L1,
  CTLA-4/CD80-86, LAG-3, TIM-3, and TIGIT—on T cells that interact with tumor or antigen-presenting
  cells. BTLA is emphasized as a distinct member of the CD28 superfamily that engages
  HVEM in a bidirectional signaling manner. This BTLA–HVEM axis contributes to tumor
  immune evasion yet remains an underexplored mechanism and therapeutic opportunity,
  underscoring the rationale for deeper investigation into its biology and translational
  potential in cancer immunotherapy
