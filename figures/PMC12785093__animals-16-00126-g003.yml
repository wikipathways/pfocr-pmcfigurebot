figure_title: Persistent effects of early-life galacto-oligosaccharide (GOS) supplementation
  on fecal microbiota on day 70.
caption: 'Persistent effects of early-life galacto-oligosaccharide (GOS) supplementation
  on fecal microbiota on day 70. (A) Shannon diversity index. (B) Principal coordinates
  analysis (PCoA) based on Bray–Curtis distance. (C,D) Taxonomic composition of the
  fecal microbiome at the phylum (C) and genus (D) levels. (E) Welch’s t-test identifying
  differential microbial taxa between the CON and GOS groups at the genus levels and
  (F) linear discriminant analysis effect size (LEfSe) identifying differential microbial
  taxa between the CON and GOS groups at the genus and species levels. Significantly
  different (G) KEGG level-3 pathways and (H) MetaCyc pathway between groups based
  on Wilcoxon rank-sum test. Asterisks indicate statistical significance: * p < 0.05.
  CON: control group, calves fed a basal diet without GOS supplementation throughout
  the study; GOSS: calves previously supplemented with 10 g GOS from birth to day
  28, with GOS supplementation withdrawn thereafter'
