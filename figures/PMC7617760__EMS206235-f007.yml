figure_title: Sphingolipid-focused lipidomics analysis of B1.1 adapted strain
caption: a) Heatmap representing the relative abundance of SL molecular species in
  the wild type (wt_B) and the adapted strain B1.1. The molecular species exhibiting
  highly significant differences are highlighted in boxes. b) Quantitative comparison
  of three SL classes that showed significant differences between wt_B and B1.1. Bar
  graphs represent %SL (Mean ± SEM of three biological replicates). Reduced levels
  of GlcCer were observed in B1.1 adapted strain, along with the accumulation of its
  precursor, α-OHCer. Additionally, IPC levels were also diminished. Significance
  was calculated using Student’s t-test. *** denotes p ≤ 0.0001, and ** represents
  p ≤ 0.001. c) Schematic representation of part of the SL biosynthesis pathway. The
  enzymes catalyzing various steps of the pathway, are a) serine palmitoyl transferase,
  b) 3-keto dihydro sphingosine reductase, c) ceramide synthases, d) Δ4-desaturase,
  e) α-hydroxylase, f) Δ8-desaturase, g) methyl transferase, h) GlcCer synthase (HSX11),
  i) C4-hydroxylase (LCB hydroxylase), j) ceramide synthase, k) α-hydroxylase, l)
  IPC synthase, m) MIPC synthase, n), M(IP)2C synthase, and o), ceramidase
