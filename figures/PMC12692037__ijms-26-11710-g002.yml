figure_title: Anti-inflammatory effects of resveratrol (RSV) related to its influence
  on the NF-κB-dependent signaling pathways.
caption: Anti-inflammatory effects of resveratrol (RSV) related to its influence on
  the NF-κB-dependent signaling pathways. The canonical NF-κB activation pathway is
  marked in red, while the green color indicates signaling through both signaling
  pathways (canonical and alternative) and/or another pathway(s). The effects of inhibition
  of NF-kB transcription (marked with a crossed x) are summarized in boxes with a
  blue background. COX-2—cyclooxygenase 1; DAPK1—death-associated protein kinase 1;
  IκBα (IKKα)—inhibitory of nuclear factor kappa B kinase alpha; IL-1β, IL-6—interleukins
  1β and 6, respectively; iNOS—inducible nitric oxide synthase; MMP-1, MMP-3, MMP-13—matrix
  metalloproteinases 1, 3 and 13; MMPs—matrix metalloproteinases; MyD88—myeloid differentiation
  primary response 88, an adaptor protein; NEMO—nuclear factor kappa-light-chain-enhancer
  of activated B cells (NF-κB) essential modulator; NFκB—nuclear factor kappa-light-chain-enhancer
  of activated B cells; NLRP3 inflammasome—nucleotide-binding oligomerization domain
  (NOD), leucine-rich repeat (LRR)-containing protein (NLR) family member 3 inflammasome;
  NOS—nitric oxide synthase; p65(RelA)—transcription factor p65, also known as nuclear
  factor NF-κB p65 subunit (RelA proto-oncogene); SIRT1—sirtuin 1; SOCS1– suppressor
  of cytokine signaling 1; TLR2, TLR4—toll-like receptor 2 and 4, respectively; TNF-α—tumor
  necrosis factor alpha; TRAIL—tumor necrosis factor-related apoptosis-inducing ligand.
  Up and down arrows are typical indications of increase or decrease, respectively
