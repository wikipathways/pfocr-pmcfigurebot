figure_title: Disease-specific pathway analysis
caption: (Left)The dot plot presents selected pathways across patients with Alzheimer’s
  disease (AD), dementia with Lewy bodies (DLB), frontotemporal dementia (FTD), and
  Parkinson’s disease (PD). Clustering of these selected pathways is indicated in
  the notation on the left side. The size of each dot represents the number of identified
  genes, while the color reflects the significance adjusted for false discovery rate
  (FDR). (Right) The tile plot highlights differentially expressed genes within each
  pathway. Color coding corresponds to the specific cluster to which each pathway
  belongs
