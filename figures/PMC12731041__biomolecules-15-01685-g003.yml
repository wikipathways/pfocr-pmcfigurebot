figure_title: HCMV-mediated inflammatory signalling pathways to foster a pro-tumour
  microenvironment in cancer.
caption: HCMV-mediated inflammatory signalling pathways to foster a pro-tumour microenvironment
  in cancer. During active infection, HCMV gene US28 constitutively activates NF-κB
  which is a regulator of pro-inflammatory enzymes such as cyclooxygenase-2 (COX-2)
  and 5-lipoxygenase (5-LO) [15,20,60]. Activation of COX-2 by NF-κB results in the
  production of prostaglandins such as PGE2 which can upregulate pro-inflammatory
  cytokines (such as interleukin-6; IL-6) as well as immunosuppressive cytokines (such
  as interleukin-10; IL-10) [15,20]. HCMV-mediated upregulation of COX-2 has been
  observed in various cancers [10,15,20,60,139]. 5-LO expression is also upregulated
  with HCMV infection, resulting in the metabolism of arachidonic acid to form leukotrienes
  which are implicated as pro-inflammatory mediators and contributors to cancer progression,
  immune evasion, and metastasis [15,20]. The upregulation of PGE2 and leukotrienes
  can attract inflammatory cells to the site of infection which promote inflammation
  of the tumour microenvironment (TME) [20]. The inflammatory TME may form favourable
  conditions for tumour progression as well as HCMV replication. In addition, COX-2
  can be induced by inflammatory cytokines such as IL-6 and tumour necrosis factor-alpha
  (TNF-α) [20]. 5-LO is stimulated by transforming growth factor-beta (TGF-β), another
  pro-inflammatory mediator present in the TME [20]. These factors further drive inflammation
  in the TME which can promote reactivation and replication of HCMV. US28 also stimulates
  the activity of vascular endothelial growth factor (VEGF) via its activation of
  NF-κB, which can promote angiogenesis [60]. Further, HCMV can also promote inflammation
  via the prolactin/prolactin receptor (PRLR) axis [140,141,143,144]. Prolactin interacts
  with its receptor, PRLR, to promote activation of the Janus-associated kinase (JAK)/signal
  transducer and activator of transcription (STAT) pathway which is a key pathway
  involved in inflammatory signalling [144]. PRLR may also induce NF-κB which further
  drives inflammation [144]. Therefore, HCMV can directly promote inflammation in
  the TME via a number of pro-inflammatory mediators, which can also act in a positive
  feedback mechanism to further drive inflammation, tumour progression, and viral
  reactivation. Created in https://BioRender.com
