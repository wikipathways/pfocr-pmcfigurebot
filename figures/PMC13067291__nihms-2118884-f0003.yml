figure_title: Fibroblast-specific analyses
caption: 'A, Uniform manifold approximation and projection embedding of fibroblasts
  (FB) clusters. B, Proportion of major cell types by subjects and pooled cohorts.
  C, Top: Embedding derived from differential abundance (DA) analysis in hypertrophic
  cardiomyopathy (HCM; blue) vs control (red).Bottom: Beeswarm plots derived from
  DA testing stratified by cluster, where each point represents a neighborhood. D,
  Heatmap of differentially expressed genes in FB clusters. E, Enrichment map stratified
  by FB cluster for proportional gene ontology pathway analysis with adjusted P<0.05.F,
  Violin plots illustrating activated FB module expression by cluster and in HCM (blue)
  vs control (red). G, Violin plots illustrating FB2 and FB3marker gene scores in
  HCM (blue) vs dilated cardiomyopathy (red). H, Heatmap showing the Jaccard coefficient
  for overlap of gene markers inhuman HCM and murine FB cell states. * indicates a
  Wilcoxon rank-sum test P<0.001. ** indicates a Kruskal-Wallis test P<0.001'
