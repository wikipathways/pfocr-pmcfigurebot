figure_title: LncRNA PCAT1/miR-370-3p/LRAT pathway was randomly chosen to verify the
  feasibility of the constructed lncRNA-miRNA-mRNA network.
caption: LncRNA PCAT1/miR-370-3p/LRAT pathway was randomly chosen to verify the feasibility
  of the constructed lncRNA-miRNA-mRNA network. The mRNA expression levels of PCAT1
  (A), miR-370-3p (B), and LRAT (C) were examined by the qRT-PCR in highly metastatic
  OS cells and the control. The protein expression level of LRAT (D) was examined
  by the WB in highly metastatic OS cells and the control. The mRNA expression levels
  of PCAT1 (E), miR-370-3p (F), and LRAT (G) were examined by the qRT-PCR in the paired
  primary and lung-metastasis OS tissues. (H-I) The correlation between PCAT1 and
  miR-370-3p as well as miR-370-3p and LRAT in OS tissues. (J-K) The qRT-PCR analysis
  of the effect on knockdown of PCAT1 expression by siRNA in the 143B and MG63.2 cell
  lines. (L) The qRT-PCR analysis of the effect on mimics or inhibitors of miR-370-3p
  in the 143B cells. (M-N) Cell viability, migration, and invasion of OS cells were
  regulated by lncRNA PCAT1 and miR-370-3p. (O) LRAT expression was regulated by the
  lncRNA PCAT1 and miR-370-3p. (P) Luciferase activity assay showed that PCAT1 could
  combine with miR-370-3p. (Q) Luciferase activity assay showed that miR-370-3p could
  combine with 3'UTR of LRAT mRNA
