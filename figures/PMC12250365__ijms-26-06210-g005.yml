figure_title: UA acts on either GSK3β or cellular targets downstream of GSK3β in the
  Wnt pathway.
caption: UA acts on either GSK3β or cellular targets downstream of GSK3β in the Wnt
  pathway. (A) UA acted on LRP5 or downstream of LRP5 in the Wnt pathway. P19 cells
  were transfected with pLRP5△N or an empty vector, as well as pGL3-OT and pTK-Renilla,
  and then treated with UA at different concentrations (0–40 µM) for 16 h. The cell
  lysates were collected for a dual luciferase activity assay. (B) UA acts on Dishevelled
  or downstream of Dishevelled in the Wnt pathway. P19 cells were transfected with
  a Dishevelled-2 plasmid or an empty vector, as well as pGL3-OT and pTK-Renilla,
  and then treated with UA at different concentrations (0–40 µM) for 16 h. The cell
  lysates were collected for a dual luciferase activity assay. (C) UA acted on GSK3β
  or downstream of GSK3β in the Wnt pathway. P19 cells were transfected with pGL3-OT
  and pTK-Renilla and then treated with 25 mM LiCl and UA at different concentrations
  (0–40 µM) for 16 h. The cell lysates were collected for a dual luciferase activity
  assay. The values for cells treated with 0 µM UA with no LiCl were set at 1.0, and
  those for all other treatments were calculated accordingly. Three replicates were
  assessed for each treatment. **, p < 0.01. ***, p < 0.001. The numbers are dual
  luciferase activities relative to 0 μM UA with an empty vector or 0 μM UA with no
  LiCl
