caption: Dysregulation of bile acid metabolism and altered cecal morphology in low-birth-weight
  piglets. (a–d) Diagram of the bile acid (BA) synthetic pathway in pigs (a), and
  relative mRNA expression levels of key hepatic enzymes involved in BA synthesis
  (b,c), along with total BA concentrations in liver and serum (d). (e) Representative
  images of cecal morphology at day 7 evaluated by H&E staining (scale bars represent
  1000 μm). (f) BA composition in cecal contents. And Log2 fold change (g) and concentrations
  (h) of individual BA species in the cecum. Data are presented as mean ± SE or median
  (minimum to maximum), n = 8 per group. * p < 0.05, ** p < 0.01, *** p < 0.001
