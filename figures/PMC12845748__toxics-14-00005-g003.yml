figure_title: WBOs whole-transcriptome sequencing.
caption: 'WBOs whole-transcriptome sequencing. (a) Heatmap of DNA damage repair mRNA
  differences. (b) Gene Ontology (GO) Annotations for DNA Damage Repair and Toll-like
  Receptor (TLR) Pathways. (c) The GSEA reveals the enrichment of the DNA damage checkpoint
  signaling pathway (GO:0000077). (d) The GSEA reveals the enrichment of signal transduction
  in response to DNA damage (GO:0042770). (e) The GSEA reveals the enrichment of Toll-like
  receptor 9 signaling pathway (GO:0034162). (f) The GSEA reveals the enrichment of
  MyD88-dependent Toll-like receptor signaling pathway (GO:0002755). (c-f) Middle
  vertical lines (red/blue): Indicate the positions of genes belonging to the signaling
  pathway in the ranked gene list. Vertical dashed line: Marks the “zero cross” in
  the ranked gene list, representing the boundary where the gene-phenotype correlation
  shifts between positive and negative'
