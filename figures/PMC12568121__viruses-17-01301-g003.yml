figure_title: Activation of IRE1α pathway.
caption: Activation of IRE1α pathway. (A) Western blot of IRE1α investigated with
  an antibody that recognizes the phosphorylation state of this sensor (p-IRE1α).
  (Up) A representative photograph of the PVDF membrane is shown, indicating the presence
  of the p-IRE1α and β-actin bands with sizes of ~115 and ~40 kilodalton, respectively.
  (Bottom) The densitometry of the pIRE1α bands was subsequently performed. The values
  were obtained by normalization with the β-actin band as a reference, with a value
  of 1. (B) The processing of XBP1 transcript was assayed through conventional RT-PCR.
  (Up) The representative photograph of 2% agarose gel with the different species
  indicated. (Botton) Densitometry of processed transcript, XBP1. The ratio of XBP1s/XBP1u
  using GAPDH as control with a value of 1. The bars represent the mean ± SD after
  three independent experiments. * p < 0.05, ** p < 0.01, **** p < 0.0001, ns = not
  significant
