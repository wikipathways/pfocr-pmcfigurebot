figure_title: The regulation of ultraviolet (UV) exposure on skin photoaging.
caption: The regulation of ultraviolet (UV) exposure on skin photoaging. UV radiation
  generates reactive oxygen species (ROS), triggers mitogen-activated protein kinases
  (MAPK) activation, leading to activator protein-1 (AP-1)-mediated matrix metalloproteinase,
  such as matrix metalloproteinase (MMP)-1 and MMP-3 upregulation, and then causes
  collagen degradation. TGF-β/Smad signaling promotes collagen synthesis via COL1A1;
  however, UV may downregulate this pathway. UV exposure activates NF-κB, leading
  to the generation of inflammatory cytokines, including interleukin (IL)-6 and IL-8.
  It triggers nuclear factor erythroid 2-related factor 2 (Nrf2) translocation into
  the nucleus, providing antioxidant defense. These processes result in oxidative
  stress, collagen imbalance, inflammation, DNA damage, and cellular senescence, ultimately
  manifesting as wrinkle formation, skin aging, and even skin cancer
article_title: Djulis (Chenopodium formosanum) Extract as a Promising Natural Agent
  Against Skin Aging
