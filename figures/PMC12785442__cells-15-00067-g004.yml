figure_title: Brainstem (BS) metabolomic landscape of P40–50 HETs.
caption: Brainstem (BS) metabolomic landscape of P40–50 HETs. Brainstem tissue was
  collected from P40–50 HET and age-matched WT mice for metabolomic analysis. Metabolite
  concentrations were normalized to tissue weight. (A) KEGG pathway analysis showing
  the top 25 enriched pathways in P40–50 HET brainstem. (B) Metabolites that are significantly
  altered in the HET brainstem. Units on the Y-axis refer to “area under the curve”
  values. TCA cycle intermediate (aconitate) and cellular antioxidant glutathione
  (reduced) are significantly elevated. (C) Glycogen levels and activities of HK and
  G6PD. Glycogen levels and HK and G6PD enzyme activities are unaltered at baseline
  in the brainstem of P40–50 HETs. Data are represented as mean ± SEM (error bars).
  For the KEGG pathway analysis in panel (A), p-values and enrichment ratios are represented
  within the image. The asterisk (*) in panel (A) highlights the pathways in which
  metabolites are significantly altered and shown in panel (C). For metabolites, *
  p < 0.05 versus WT by Student’s two-tailed unpaired t-test. N = 3–5/group (metabolomics),
  3–9/group (glycogen assay), and 6/group (HK and G6PD assays)
