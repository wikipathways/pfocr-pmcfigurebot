figure_title: Molecular mechanism of gonadotoxicity from radiation and chemotherapy.
caption: 'Molecular mechanism of gonadotoxicity from radiation and chemotherapy. Chemotherapeutic
  agents and radiation cause DNA alterations, mainly in DSBs, leading to cell death
  through apoptosis or the activation of repair pathways for cell survival: pATM,
  RAD51, or PARP1. If the repair pathways are insufficient, DNA damage triggers apoptosis
  via TAp63, PUMA, and NOXA, activating proteins such as BAX/BAK'
