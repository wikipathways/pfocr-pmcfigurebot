figure_title: Schematic representation of the necroptosis signaling pathways.
caption: Schematic representation of the necroptosis signaling pathways. The diagram
  illustrates the initiation of necroptosis by ligands (TNF, FASL) binding to their
  respective death receptors (TNFR, FAS). This interaction leads to the formation
  of a complex involving TRAF2, TRADD, cIAPs, and RIPK1. Caspase-8 activation is shown
  as an alternative pathway that can lead to the formation of the necrosome, which
  consists of RIPK1, RIPK3, and MLKL. The phosphorylation of MLKL by RIPK3 results
  in the formation of MLKL pores in the cell membrane, leading to the release of damage-associated
  molecular patterns (DAMPs) and cell death. The diagram also shows the involvement
  of ZBP1 and TLR3/4 in necroptosis, indicating multiple pathways that can trigger
  this form of cell death
article_title: Mechanism of RCD and the Role of Different Death Signaling Pathways
