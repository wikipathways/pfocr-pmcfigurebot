figure_title: Engyodontium exacerbates mouse colitis through the Dectin-2/CARD9 pathway
caption: |-
  (A–G) WT and Clec4n–/– mice were orally administered PBS or Engyodontium sp. every other day for 3 doses and treated with 1.5% DSS for 7 days starting from the second fungal administration. (A) Body weight loss and (B) DAI were monitored daily. (C) Gross colon morphology and length measurements at sacrifice on day 10. (D) Representative H&E-stained distal colon sections. (E and F) Frequencies of cLP neutrophils and Treg cells measured by flow cytometry. (G) Heatmap of immune-related gene expression in colon tissues assessed by qPCR. Neutrophil panel (A–C and F, left): WT n = 9, WT-Engyodontium
  n = 10, Clec4n–/–
  n = 6, Clec4n–/–-Engyodontium
  n = 8; (D) n = 6/group; (F, Treg panel) WT n = 5, other groups n = 4; (G) WT groups n = 5, Clec4n–/– groups n = 3. (H–J) WT and Card9–/– mice were subjected to the same Engyodontium colonization and DSS treatment protocol. Body weight loss (H), DAI (I), and frequencies of cLP neutrophils and Treg cells (J) determined by flow cytometry (WT groups n = 5; Card9–/–
  n = 3; Card9−/−-Engyodontium
  n = 4). Data in A–D and F (neutrophil panel) are pooled from 2 independent experiments. Data in E and F (Treg panel) and G–J are from 1 of 2 independent experiments. Data in A–D, F, and H–J are presented as mean ± SD. Statistical analysis: 1-way ANOVA with Bonferroni’s multiple-comparison test (A, B, H, and I), or 1-way ANOVA with Tukey’s multiple-comparison test (C, D, F, and J). Engyod., Engyodontium
