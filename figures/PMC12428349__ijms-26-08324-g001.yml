figure_title: Inhibition of CHOL biosynthesis pathway in normal differentiating phBECs
  in vitro.
caption: Inhibition of CHOL biosynthesis pathway in normal differentiating phBECs
  in vitro. (A) Schematic overview of the proteomic analysis of normal phBECs differentiated
  at the air-liquid interface (ALI) condition for 28 days. Figure created using Biorender.
  (B) Top 20 deregulated signaling pathways from differentially expressed proteins.
  “Upregulated” or “Downregulated” indicates that the proteins within the pathway
  are either upregulated or downregulated, respectively, suggesting a consistent alteration
  in pathway activity, whereas “No activity pattern” indicates that proteins within
  the pathway are altered, but not in a consistent way that would suggest overall
  up- or downregulation of the pathway. (C) Detailed overview of the cholesterol biosynthesis
  pathway. Proteins involved in the CHOL biosynthesis pathway that were differentially
  expressed and downregulated during normal phBECs differentiation are indicated with
  downward arrows. Undetected proteins within the pathway are shown without any specific
  marking. (D) List of differentially expressed protein profiles involved in the CHOL
  biosynthesis pathway during the entire differentiation phase. Data shown are derived
  from five independent biological replicates (n = 5). Statistical analysis of proteome
  data from normal differentiating phBECs was performed at four timepoints (day 7,
  14, 21, and 28) in comparison to day 0 using the Wald test with Storey correction
  to account for multiple testing to identify differentially expressed proteins (significance
  value q < 0.05)
