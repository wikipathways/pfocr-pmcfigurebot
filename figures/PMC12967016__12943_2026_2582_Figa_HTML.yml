caption: This review provides a comprehensive and systematic overview of the major
  modes of metabolic remodeling in cancer, including glucose, glutamine, lipid, and
  polyamine metabolism; investigates the metabolic crosstalk between cancer cells
  and the microenvironment; and provides potential therapeutic strategies based on
  metabolic pathways. This study contributes to a deeper understanding of the metabolic
  heterogeneity and uniqueness of metabolism in cancer and promotes anticancer therapies
  based on metabolic modalities
