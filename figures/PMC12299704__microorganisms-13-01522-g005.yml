figure_title: The regulatory pathway of EPS on TLR2 and the nuclear receptor PPAR
  gamma.
caption: The regulatory pathway of EPS on TLR2 and the nuclear receptor PPAR gamma.
  EPSs bind to TLR2 at the cell membrane, initiating downstream signaling via the
  adaptor protein MyD88, which activates both the IKK complex and MAPK pathways. This
  leads to the nuclear translocation of NF-κB and AP-1, transcription factors involved
  in inflammatory responses, which are subsequently suppressed by PPARγ activation.
  EPSs also influence fatty acid metabolism, increasing intracellular fatty acid levels,
  which, in turn, further modulate the PPARγ activity. Activated PPARγ, in complex
  with RXR and regulated via SUMOylation, inhibits inflammatory gene expression and
  promotes the transcription of genes involved in lipid metabolism, including the
  upregulation of ATGL, HSL, and CPT1 and the downregulation of Fabp4, aP2, and FAS.
  Additionally, EPSs enhance glucose uptake through increased Glut2 expression and
  the activation of glucokinase (GK) while promoting the activation of the AMPK and
  MAPK pathways, which leads to decreased glucose-6-phosphatase (G6P) activity. EPSs
  also upregulate SIRT1, which contributes to metabolic regulation, and modulate cholesterol
  and fatty acid metabolism through the activation of Cyp7a1 and Cd36, as well as
  the inhibition of HMG-CoA reductase
