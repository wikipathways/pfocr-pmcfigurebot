figure_title: In vitro and in vivo coagulation factor functions in sinusoid-bearing
  HLBOs
caption: a, Heatmap showing the coagulation-associated gene set. b, Time series measurements
  of FVIII in organoid supernatants. Data represent the mean ± s.e.m. (n = 6 biological
  replicates; ****P < 0.0001; one-way ANOVA with Dunnett’s multiple comparisons test
  compared to +iLSEP HLBO). c, APTTs reflecting FVIII activity of organoid supernatants
  at day 11 in FVIII deficient plasma compared to non-cultured media, heat-inactivated
  (56 °C, 1 h) supernatant and NPP. Data represent the mean ± s.e.m. (n = 3 biological
  replicates; ****P < 0.0001; one-way ANOVA with Dunnett’s multiple comparisons test
  compared to +iLSEP HLBO). d, Relative activity of FVIII in +iLSEP HLBO supernatants
  at day 11, inhibitor (−) NPP and recombinant human FVIII (rhFVIII), determined on
  the basis of APTT. Data represent the mean ± s.e.m. (n = 4 biological replicates;
  *P < 0.05; ****P < 0.0001; multiple two-sided paired t-test with controlling FDR
  by within-sample group comparisons). e, Coagulation-associated factor profile in
  2D-EC and 3D-organoid supernatants at day 11. Colour values indicate the z-score
  based on log2 transformed concentration (n = 3 biological replicates). f, Thrombin
  generating activity induced by the intrinsic tenase complex (FVIIIa/FIXa) pathway84.
  Data represent the mean ± s.e.m. (n = 3 biological replicates; *P < 0.05; **P <
  0.01; ****P < 0.0001; one-way ANOVA with Dunnett’s multiple comparisons test compared
  to Sup. +iLSEP HLBO inhibitor (−) within culture supernatant group; Ratio paired
  t-test within NPP group comparison). g, Fibrin clotting images using Alexa Fluor
  488-conjugated fibrinogen. w, with; w/o, without. h, Schematic representation of
  the in vivo efficacy test with an injection of the culture supernatant of HLBO at
  day 11. See Supplementary Video 3 for the bleeding assay. i, Shortening of time
  until bleeding stopped relative to maximum (25 min). Data represent the mean ± s.e.m.
  (n = 6, wild type +PBS group; n = 5, the other groups, biological replicates; *P
  < 0.05; ***P < 0.001; one-way ANOVA with Dunnett’s multiple comparisons test compared
  to FVIII KO mice with HLBO supernatant injection). j, Total blood loss during 25
  min of bleeding evaluated by haemoglobin concentration. Data represent the mean
  ± s.e.m. Dots not displayed indicate that data were not detected (n = 3 biological
  replicates; **P < 0.01; one-way ANOVA with Dunnett’s multiple comparisons test compared
  to FVIII KO mice with HLBO supernatant injection)
