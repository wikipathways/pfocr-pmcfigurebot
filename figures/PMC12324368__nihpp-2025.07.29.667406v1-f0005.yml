figure_title: Striatal pathways have stronger influence over evidence-tuned than choice-tuned
  or untuned ACC neurons
caption: 'a, Average choice vs. laser coefficients across cue and delay positions
  in the task for all ACC neurons recorded with indirect (top; grey dots; n = 2030
  neurons from 12 sessions) or direct (bottom; grey dots; n = 1449 neurons from 14
  sessions) pathway inhibition. Black line: Spearman rank correlation; indirect: r
  = −0.07, p < 0.01; direct: r=−0.05, p=0.11. b, Evidence tuning curves for all ipsilateral-
  (left) and contralateral-preferring (right) choice-tuned ACC neurons with indirect
  (top) or direct (bottom) pathway inhibition. For each neuron, z-scored activity
  was averaged in all cue and delay positions and across trials binned by sensory
  evidence level, separately for laser off (black) and on (orange) trials (indirect:
  n = 401 ipsilateral-choice, n = 415 contralateral-choice neurons; direct: n = 262
  ipsilateral-choice, n = 196 contralateral-choice neurons). Statistics reflect significance
  of a linear mixed-effects model (indirect, ipsilateral: plaser=0.87; indirect, contralateral:
  plaser<0.001; direct, ipsilateral: plaser=0.47; direct, contralateral: plaser=0.82).
  Data are presented as mean ± s.e.m. c, Average laser coefficient across the cue
  and delay regions for all ACC neurons with significant tuning to ipsilateral-evidence
  (indirect: n = 136, direct: n = 111) or ipsilateral-choice (indirect: n = 401, direct:
  n = 262), or neurons without significant tuning to either choice or evidence (un-tuned;
  indirect: n = 938; direct: n = 750) (top). Brown and green bars reflect ACC neurons
  from mice receiving indirect or direct pathway inhibition, respectively. Bottom:
  Same as top, but for ACC neurons with significant tuning to contralateral-evidence
  (indirect: n = 140, direct: n = 130) or contralateral-choice (indirect: n = 415,
  direct: n = 196), or neurons without significant tuning to either choice or evidence
  (un-tuned; same population as in top). P-values reflect significance of a two-way
  ANOVA for an interaction between tuning (choice-, evidence-, or un-tuned) and pathway
  inhibition (direct or indirect). Ipsilateral-preferring neurons: pinteraction<0.01
  (F2,2592=5.289), ptuning<0.05 (F2,2592=3.096), ppathway<0.01 (F1,2592=9.934); contralateral-preferring
  neurons: pinteraction<0.0001 (F2,2563=10.46), ptuning=0.42 (F2,2563=0.8630), ppathway
  <0.0001 (F1,2563=26.14). Asterisks denote significance of post hoc unpaired t-tests
  between groups. Data are presented as a mean ± 95% confidence interval. d, Schematic
  summary of the effects of indirect (brown) and direct (green) pathway inhibition
  on ACC neurons based on single neuron tuning properties. e, Schematic summary of
  the effects of indirect (brown arrow) or direct (green arrow) pathway inhibition
  on population activity projected onto the evidence-axis (black dotted line) versus
  PC1-axis (gray dotted line). *p<0.05, ***p<0.001 and ****p<0.0001'
