figure_title: Dpb11 directs Mec1-Ddc2 to ss-dsDNA junctions
caption: 'A, Representative kymograph of Mec1-Ddc2AF647 on 18,830 bp DNA with a 3
  kb single-stranded gap (5,982–8,997 nt) in the presence of unlabeled RPA. Dashed
  lines indicate gap junctions. Blue arrows indicate the initial Mec1-Ddc2 binding
  position. B, Histogram showing distribution of initial Mec1-Ddc2 binding positions
  on gapped DNA with RPA (n = 74 binding events). ns: p = 1.0 by χ2 test for goodness
  of fit of the Mec1-Ddc2 distribution to the theoretical non-specific RPA/ssDNA-binding
  distribution (dashed line). C, Representative kymograph of Mec1-Ddc2AF647 on gapped
  DNA in the presence of unlabeled RPA and unlabeled Dpb11. Dashed lines indicate
  gap junctions. Blue arrow indicates the initial Mec1-Ddc2 binding position. D, Histogram
  showing distribution of initial Mec1-Ddc2 binding positions on gapped DNA with Dpb11
  (n = 58 binding events). ****: p = 1.9×10−8 by χ2 test for goodness of fit of the
  Mec1-Ddc2 distribution to the theoretical non-specific RPA/ssDNA-binding distribution
  (dashed line). E, Representative kymograph of colocalized Dpb11LD655 and Mec1-Ddc2LD555
  binding to the 5’ junction of 3 kb-gapped DNA. The 532 nm and 638 nm excitation
  lasers were briefly turned off to confirm that red and green signals were coming
  from Mec1-Ddc2LD555 and Dpb11LD655, respectively. Dashed lines indicate gap junctions.
  The merged color image is shown above the separated red and green channels. F, Relative
  frequencies of each type of colocalization pathway at different positions on gapped
  DNA (n = 11 colocalization events). Possible pathways for colocalization of Mec1-Ddc2
  (green) and Dpb11 (red): both proteins interact in solution and bind DNA together
  (as shown in E), Mec1-Ddc2 binds DNA first and then recruits Dpb11, or Dpb11 binds
  DNA first and then recruits Mec1-Ddc2'
