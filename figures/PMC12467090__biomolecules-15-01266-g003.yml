figure_title: IPMK’s lipid kinase, inositol kinase, and kinase-independent function
  in the cells.
caption: 'IPMK’s lipid kinase, inositol kinase, and kinase-independent function in
  the cells. (A) IPMK displays several regulatory functions in various cellular pathways
  using its lipid kinase, inositol kinase, and kinase-independent activities. (B)
  IPMK’s lipid kinase activity influences the following pathways and cellular processes:
  (i) migration [34,53,54,56,57], (ii) proliferation [34,58], (iii) DNA repair [17,59,60],
  (iv) genotoxic stress [61], (v) transcriptional activation [21], and (vi) metabolism
  [58]. (i) In migration, IPMK generates PIP3, which aids in PDK1 membrane localization
  and facilitates migration [34]. (ii) In proliferation, IPMK generates PIP3, which
  activates AKT and leads to proliferation [34,58]. (iii) In DNA repair, IPMK generates
  PIP3, which facilitates actin polymerization in the nucleus, leading to the recruitment
  of proteins essential for DNA repair [17,59,60]. (iv) Genotoxic stress leads to
  the conversion of p53-PIP2 to p53-PIP3 by IPMK, which recruits AKT, mTORC2, and
  PDK1, leading to AKT phosphorylation and activation. The activation of AKT suppresses
  apoptosis [61]. (v) In transcriptional activation, SF-1 binds IPMK-generated PIP3,
  which is essential for SF-1 activation as a transcription factor [21]. (vi) In metabolism,
  free fatty acids (FFAs) decrease IPMK protein levels, leading to a decrease in PIP3
  and lowering AKT activation. This decrease in AKT activation leads to insulin resistance
  [58]. (C) IPMK’s inositol kinase activity influences the following pathways and
  cellular processes: (i) chromatin remodeling [19,20], (ii) mRNA export [62,63],
  (iii) mRNA transcription [22,46], and (iv) necroptosis [45,50]. (i) In chromatin
  remodeling, InsP4 and/or InsP5 generated by IPMK bind to the SWI/SNF and INO80 chromatin
  remodeling complexes, recruiting them to the promoter sites of yeast PHO5 and PHO8
  genes, inducing their transcription [19,20]. (ii) In mRNA export and translation,
  InsP5 generated by IPMK is converted to InsP6 by IPPK. InsP6 binds to Gle1, which
  allows it to activate the ATPase activity of Dbp5, a protein essential for mRNA
  nuclear export [62,63]. (iii) In mRNA transcription, IPMK-generated InsP4 activates
  Arg-MCM1 transcription factor in yeast, regulating genes involved in cell cycle
  and cell type specificity [22,46] (iv) In necroptosis, InsP5 generated by IPMK is
  converted to InsP6 by IPPK. InsP6 then binds to MLKL, which activates the necroptotic
  pathway [50]. (D) IPMK’s kinase-independent activity influences the following pathways
  and cellular processes: (i) autophagy [14,64,65,66], (ii) mTORC1 activation [23,67,68,69],
  (iii) NF-kB activation [29], (iv) p53 activation [48], and (v) AMPK activation [30].
  (i) In autophagy, IPMK, ULK, and AMPK form a complex that leads to AMPK phosphorylation
  and the activation of the autophagic signal [14,64,65,66]. In the nucleus, IPMK
  phosphorylates AMPK, which leads to the activation of SIRT1 and the subsequent transcription
  of autophagy regulatory genes. miR-23b can also bind to IPMK mRNA transcript, suppressing
  its expression and leading to the inhibition of autophagy. (ii) In mTORC1 activation
  [23,67,69], IPMK stabilizes the mTORC1 complex by binding to raptor and mTOR complex
  proteins, which leads to the facilitation of amino acid sensing. (iii) In NF-kB
  activation [29], IPMK binds to TRAF6, stabilizing it and leading to the activation
  of NF-kB. (iv) In p53 activation [48], IPMK binds to p300, which leads to the acetylation
  of p53 and its subsequent DNA recruitment. (v) In AMPK activation [30], IPMK binds
  AMPK and LKB1, leading to the phosphorylation and activation of AMPK'
