figure_title: Methylome data analysis of PM2.5-exposed BAT
caption: '(A) Hierarchical clustering dendrogram and PCA plot of biological replicates
  from FA (n = 3) and PM2.5 (n = 3) in the methylome data of BAT. (B) Scatter plot
  of DNA methylation levels of statistically significant differentially methylated
  regions (DMRs: 881, of which 464 are hypomethylated and 417 hypermethylated) between
  FA- and PM2.5-exposed BAT. The x axis is the mean FA DNA methylation level (0%–100%)
  and the y axis is the mean PM2.5 DNA methylation level (0%–100%). (C) Pie charts
  (%) of global distribution of all CpG sites in predefined genomic partitions by
  PM exposure group. Left: FA samples. Right: PM2.5 samples (binned 100 bp). (D and
  E) Bar plots of GREAT analysis in PM2.5-exposed BAT.(D) Genomic feature distance
  (DMRs to TSSs) distribution and (E) genomic partition distribution of DMRs. (F)
  GO analysis of DMR significant terms (Biological Process) by DNA methylation status.
  Left: Hypermethylated genes. Right: Hypomethylated genes. (G) DNA methylation levels
  in circadian rhythm and NRF2 pathway target genes. (H) Heatmap plot of significance
  of DMR enhancer and regulatory sites predicted by GREAT analysis for the core genes
  associated with circadian rhythm and NRF2 pathways. (I) Predicted DMR target motifs
  and regulatory enhancer sites by GREAT analysis. Comparison of significant transcription
  factor motifs of DMR target genes by DNA methylation status. Left: Hypermethylated
  DMR target genes. Right: Hypomethylated DMR target genes. (J) Illustration of CpG
  differential methylation profiles of DMRs in distal or proximal target sites of
  specific genes and pathways of interest. The y axis shows the DNA methylation level
  (0%–100%) with a smoothing line, and the x axis shows the corresponding CpG genomic
  location. Each x-axis tick denotes a CpG site. Circled “M” symbols denote DMR CpG
  sites. Far left: Distal enhancer site of Tnfrsf10b (Inflammatory Signaling). Middle
  left: Proximal promoter site of Mgst1 (ROS and Glutathione Metabolism). Middle right:
  Promoter site of Prdm16 (BAT Metabolism). Far right: Promoter site of Rora (Circadian
  Rhythm)'
