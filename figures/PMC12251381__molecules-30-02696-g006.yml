figure_title: Proposed model for MOA of SC-62-1 in induction of cancer cell death.
caption: Proposed model for MOA of SC-62-1 in induction of cancer cell death. SC-62-1’s
  anticancer activity is via production of quinone methide which alkylates many target
  proteins. Its downstream effect includes induction of proteasomal degradation of
  MDM4 protein and lysosomal degradation of FTH1 and significant alteration of the
  pathways including RNA metabolism, carbon metabolism, mitochondrial function, protein
  translation and protein degradation. Collectively, induction of changes in these
  pathways by SC-62-1 creates overwhelming cellular stress that cannot be resolved,
  thus leading to p53-independent cell death
article_title: Anticancer Quinolinol Small Molecules Target Multiple Pathways to Promote
  Cell Death and Eliminate Melanoma Cells Resistant to BRAF Inhibitors
