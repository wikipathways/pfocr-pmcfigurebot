figure_title: Swertiamarin demonstrates comprehensive lipid-modulating and metabolic
  regulatory effects through multiple mechanisms.
caption: 'Swertiamarin demonstrates comprehensive lipid-modulating and metabolic regulatory
  effects through multiple mechanisms. (1) Anti-hypercholesterolemic: SW inhibits
  HMG-CoA reductase to reduce total cholesterol (TC), triglyceride (TG), and LDL/VLDL
  levels while simultaneously enhancing bile acid excretion through 17-α-hydroxylase
  activation. (2) Regulation of lipid homeostasis: SW reduces lipid accumulation by
  elevating the kat-1 level. (3) SW reduces pro-inflammatory mediators and chemokines
  by suppressing p38 MAPK/NF-κB pathways. (4) Anti-obesity and metabolic enhancement:
  SW increases the activation of BAT to promote thermogenesis and ameliorates glucose
  intolerance and obesity-related insulin resistance by enhancing insulin signaling'
