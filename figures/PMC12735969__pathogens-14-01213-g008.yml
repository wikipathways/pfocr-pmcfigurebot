figure_title: In Vivo validation of NrtR-mediated repression of the NAD+ salvage pathways.
caption: In Vivo validation of NrtR-mediated repression of the NAD+ salvage pathways.
  (A) NrtR represses transcription of the pnuC operon during mid-logarithmic phase.
  (B) Transcriptional repression is abolished in the ΔnrtR mutant, resulting in upregulation
  of the pncB in stationary phase. (C) Intracellular NAD+ is elevated in the ΔnrtR
  mutant. (D) SsNrtR negatively regulates NADH accumulation. Data are presented as
  mean ± SD from three independent experiments. β-Galactosidase activity and NAD+
  levels were analyzed by one-way ANOVA followed by Tukey’s test. * p < 0.05, ** p
  < 0.01, *** p < 0.001
article_title: 'Regulation of NAD+ Homeostasis by SsNrtR in Streptococcus Sobrinus:
