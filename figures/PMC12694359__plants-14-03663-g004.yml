figure_title: Investigation of 1294 negatively correlated DEGs involved in the metabolic
  responses to mechanical pruning.
caption: 'Investigation of 1294 negatively correlated DEGs involved in the metabolic
  responses to mechanical pruning. (a) Distribution of genes based on Pearson correlation
  between pruning treatments. Genes were classified into three groups according to
  the correlation coefficients: highly positive (r ≥ 0.7), highly negative (r ≤ −0.7),
  and the rest. Among them, 1294 DEGs with strong negative correlation (r ≤ −0.7)
  were selected for further metabolic pathway analysis. (b) Functional categorization
  of negatively correlated DEGs (r ≤ −0.7). Classification of the 1294 negatively
  correlated DEGs (neg-cor DEGs) using Mercator v3.6 based on DNA sequence homology.
  (c–f) Heatmaps of selected genes involved in (c) hormone signaling; (d) flavonoid
  biosynthesis and stress responses; (e) photosynthesis; (f) light signaling, circadian
  clock regulation, and floral transition including B-box (BBX) genes. Differential
  expression patterns across pruning treatments and time points are displayed for
  each category. Asterisks (*) indicates genes that were not found as differentially
  expressed in our transcriptome data'
