figure_title: NAD+ biosynthesis pathways in yeast.
caption: 'NAD+ biosynthesis pathways in yeast. Biosynthesis: the de novo pathway (left
  panel, simplified view) converts L-tryptophan (L-Trp) to quinolinic acid (QA) via
  Bna2, Bna7, Bna4, Bna5, and Bna1. QA is converted to nicotinic acid mononucleotide
  (NaMN) via Bna6. NA-NAM salvage (middle panel) also produces NaMN by conversion
  of nicotinamide (NAM) to nicotinic acid (NA) via Pnc1. Npt1 converts NA to NaMN,
  which is then converted to nicotinic acid adenine dinucleotide (NaAD) by the NMNATs,
  Nma1 and Nma2. NaAD is converted to NAD+ by Qns1. In NR salvage (right panel), nicotinamide
  riboside (NR) is converted to nicotinamide mononucleotide (NMN) by NR kinase Nrk1,
  which is then converted to NAD+ by Pof1, Nma1, and Nma2. Degradation and recycling:
  NAD+ is converted to NAM by the Sir2 family of sirtuins or to NMN by NADases. NMN
  is converted to NR nucleotidases/phosphatases Isn1, Sdt1, and Pho8. NR can be converted
  to NAM via nucleosidases Urh1 and Pnp1, which then enters NA-NAM salvage'
