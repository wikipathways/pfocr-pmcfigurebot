figure_title: Cur and Se promote antioxidant and anti-inflammatory genes expression
  in mice colon tissues.
caption: 'Cur and Se promote antioxidant and anti-inflammatory genes expression in
  mice colon tissues. (a–f) The mRNA expression levels of the Nrf2 and NF-κB pathway-related
  genes in mice colonic tissues were determined by RT-qPCR. (a) Cur and Se mitigated
  the downregulation of Nrf2 gene expression in the colonic tissue of ICR mice induced
  by DSS. (b) Cur and Se reversed the downregulation of HO-1 gene expression in the
  colonic tissue of ICR mice induced by DSS. (c) Cur and Se attenuated the downregulation
  of NQO-1 gene expression in the colonic tissue of ICR mice induced by DSS. (d) Cur
  and Se decreased the elevated IL-1β gene expression in the colonic tissue of ICR
  mice induced by DSS. (e) Cur and Se reversed the upregulated NF-κB gene expression
  in the colonic tissue of ICR mice induced by DSS. (f) Cur and Se reversed the upregulated
  TNF-α gene expression in the colonic tissue of ICR mice induced by DSS. Abbreviation:
  Con, control. DSS, dextran sulfate sodium. Cur, Curcumin. Se, Selenium. L-CS, low-dose
  Cur + Se. M-CS, medium-dose Cur + Se. H-CS, High-dose Cur + Se. The experiment was
  repeated six times (n = 6). *, p < 0.05; **, p < 0.01; ***, p < 0.001'
