figure_title: Pirfenidone (PFD) treatment altered p38 MAPK signalling, reduced proliferation,
  migration and collagen deposition in inner ear fibrocytes.
caption: Pirfenidone (PFD) treatment altered p38 MAPK signalling, reduced proliferation,
  migration and collagen deposition in inner ear fibrocytes. (A) Western blot analysis
  of phosphorylated (p)ERK1/2, -P38, -JNK, -AKT and -SMAD2/3 after stimulation with
  a cocktail of pro-fibrotic factors (FC) or untreated (UN) and following pre-treatment
  with PFD or vehicle (VEH; Images are representative of n = 3 experiments for ERK1/2,
  JNK, AKT and SMAD2/3 and representative of n = 4 for P38). (B–D) Quantitative Western
  blot analysis (Data are presented as mean band intensity relative to total protein
  loading control, (p38 n = 4 experiments, JNK and AKT n = 3)). FC significantly increases
  the induction of p-p38, p-JNK and p-AKT expression at 15 min. PFD-treatment inhibits
  p38 pathway activation at 5 mM but has no effect on JNK or AKT pathway activation.
  (E) Treatment with 5 mM PFD resulted in a significant decrease in metabolic rate
  at 48 h and 72 h (n = 3). (F,G) The effect of PFD on wound healing, assessed using
  the scratch assay, demonstrated reduced wound closure at 36–72 h in fibrocytes treated
  with 5 mM PFD, compared to VEH control (n = 3 experiments with n = 6 replicates/experiment,
  scale bar 300 µm). Representative images are shown in (F). (H–K) Collagen III and
  V deposition is induced in primary inner ear fibrocyte cultures in response to treatment
  with a cocktail of pro-fibrotic factors (FC). PFD-treatment significantly reduced
  FC-induced collagen III deposition in all three experiments and collagen V deposition
  in two of the three experiments (n = 3 independent experiments with n > 5 replicates;
  data from a representative experiment is shown). Representative images are shown
  in H (collagen III, red) and J (Collagen V, green) (Scale bar 250 µm). Data are
  shown as mean ± standard error of the mean (SEM), * p < 0.05, ** p < 0.005
