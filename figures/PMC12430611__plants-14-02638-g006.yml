figure_title: Regulation of metabolic pathway genes by GhSTZ silencing.
caption: 'Regulation of metabolic pathway genes by GhSTZ silencing. (a) Expression
  changes of key genes in the pentose and glucuronate interconversion pathway. Gene
  names are colored to indicate expression change in pTRV2::GhSTZ plants relative
  to pTRV2::00 controls. Purple: bidirectional regulation (significantly upregulated/downregulated
  context-dependently); blue: significantly downregulated. (b) Schematic of the pentose
  and glucuronate interconversion pathway. Arrows indicate metabolic reactions. (c)
  Expression changes of key genes in the phenylpropanoid biosynthesis pathway. Gene
  names are colored to indicate expression change: Red: significantly upregulated;
  purple: bidirectional regulation (significantly upregulated/downregulated context-dependently).
  (d) Schematic of the phenylpropanoid biosynthesis pathway. Arrows represent metabolic
  reactions'
