figure_title: Cellular consequences of aging in muscle stem cells.
caption: Cellular consequences of aging in muscle stem cells. This schematic compares
  a young muscle stem cell with an aged stem cell, highlighting the intracellular
  hallmarks of aging. In youthful cells, mitochondria, protein folding, and autophagy
  pathways are intact, enabling effective energy production, repair, and proteostasis.
  With aging, stem cells accumulate protein aggregates, exhibit impaired autophagy,
  and suffer mitochondrial damage. These changes lead to oxidative stress (↑ Reactive
  Oxygen Species ROS), DNA damage, and reduced regenerative capacity. Dysfunctional
  lysosomes and endoplasmic reticulum contribute to further metabolic decline. Collectively,
  these disruptions impair satellite cell homeostasis, contributing to sarcopenia
  and diminished muscle repair
