figure_title: Chiglitazar induces cell cycle arrest by blocking the FOXM1 signal pathway
  in transformed follicular lymphoma cells.
caption: Chiglitazar induces cell cycle arrest by blocking the FOXM1 signal pathway
  in transformed follicular lymphoma cells. (A) The cell cycle of RL, SC-1, and Karpas
  422 was arrested in the G1 phase after being treated with chiglitazar (5 μM, 10
  μM, 20 μM) for 24 h. (B) Heatmap analysis showed that the expression of cell cycle-related
  genes was down-regulated in SC-1 cells after being treated with 20 μM chiglitazar
  for 24 h, including FOXM1 and its downstream target genes (such as CCNB1, CCNA2
  and CDK4). (C) Western blotting was used to analyze the expression of cell cycle-associated
  proteins (FOXM1, C-MYC, cyclin B1, cyclin D1, and cyclin E1) in RL, SC-1, and Karpas
  422 cells treated with chiglitazar (5 μM, 10 μM, 20 μM, 30 μM) for 24 h. (D) Overexpression
  of PPARα downregulated the FOXM1 gene promoter reporter activity in 293T cells.
  (E) The ChIP assay performed to detect the enrichment of PPARα on the FOXM1 gene
  promoter region in RL and SC-1 cells after treatment with 20 μM chiglitazar for
  24 h. (F) Transcriptome analysis of GSE86613 showed that FOXM1 expression was upregulated
  in t-FL specimens. (G) The FOXM1-knockdown RL and SC-1 cell lines was constructed
  by lentiviral system, and the expression of FOXM1, C-MYC, CyclinB1, CyclinD1, CyclinE1,
  CDK1 and CDK2 was measured by western blotting assay. (H-I) Knockdown of FOXM1 inhibited
  cell viability (H) and induced cell cycle arrest (I) in RL and SC-1 cells, cell
  viability and cell cycle detected by CCK-8 and PI staining assays, respectively.
  (J) Knockdown of FOXM1 significantly enhanced the sensitivity of RL and SC-1 cells
  to chiglitazar. (K) The FOXM1-overexpressed RL and SC-1 cell lines was constructed
  by lentiviral system, and the expression of FOXM1, C-MYC, CyclinB2, CyclinD1, CyclinE1,
  CyclinE2, and CDK1 was measured by western blotting assay. (L) Overexpression of
  FOXM1 impairs the inhibitory effect of chiglitazar on cell viability of RL and SC-1
  cells, the cell viability measured by CCK8 assay in FOXM1-overexpressed RL and SC-1
  cells treated with chiglitazar (10 μM, 20 μM, 30 μM) for 24 h. (M) Overexpression
  of FOXM1 significantly attenuates the cell cycle arrest effect of chiglitazar on
  RL and SC-1 cells, and the cell cycle measured by PI staining assay in wild type-
  or FOXM1 overexpressed- RL and SC-1 cells treated with chiglitazar (10 μM, 20μM)
  for 24 h. (*P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001)
