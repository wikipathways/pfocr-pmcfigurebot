caption: 'MAPK and PI3K/Akt phosphorylation were inhibited after treatment with X.
  strumarium. Washed rat platelets were preincubated with XS (25, 50, or 100 µg/mL)
  for 1 min, followed by stimulation with collagen (2.5 µg/mL) for 5 min. Reactions
  were terminated by adding ice-cold lysis buffer. Protein concentrations were determined,
  and equal amounts of protein were separated by SDS-PAGE and transferred onto PVDF
  membranes. After blocking, membranes were probed with antibodies specific for total
  and phosphorylated forms of ERK, p38, JNK, PI3K, and Akt. Protein bands were visualized
  using enhanced chemiluminescence (ECL). Pathway inhibitors as negative controls:
  PD–ERK inhibitor, SB–p38 MAPK inhibitor, SP–JNK inhibitor, LY–PI3K/Akt pathway inhibitor.
  Quantification of the ratio of phosphorylated to total protein, normalized to vehicle
  control (mean ± SD, n = 3). * p < 0.05, ** p < 0.01, and *** p < 0.001 compared
  with collagen'
