figure_title: Structure-guided directed evolution produced ApexGT6 candidate immunogens
  to prime Apex bnAb-like precursor responses
caption: (A) Somatic hypermutation of bnAbs versus their HCDR3 length. Somatic hypermutation
  was calculated by combining the number of mutations on the heavy and light chain
  variable regions (VH and Vκ/λ), then dividing by their combined length. All calculations
  were based on aa mutations. Each dot represents a bnAb target, colored by its directed
  epitope. (B) The immunogen design pathway starting with previously designed ApexGT
  trimers to ApexGT6 congly gp140 and ApexGT6 L14 gp151. The libraries were designed
  using the high-resolution cryoEM structure of ApexGT2.2MUT (displayed as a grey
  surface) in combination with PCT64 LMCA (depicted as a red cartoon). The mutations
  from each library are represented by blue ribbons or spheres. The enriched mutations
  were combined to produce ApexGT6 (surface representation, gp120 is colored orange,
  gp41 is taupe, and glycans are depicted as beige spheres). (C) Surface plasmon resonance
  (SPR) KDs for MD39 and ApexGT trimer analytes binding to PCT64 and PG9 variants
  as IgG ligands. Pre.15 is a PG9-like NGS precursor and Pre.7 is a PCT64-like NGS
  precursor. Both precursors were designed by incorporating an NGS-derived HCDR3 into
  the corresponding inferred germlines (iGLs). The data were fit using a 1:1 binding
  model. NB, no binding, is the highest concentration (approximately 10 μM) tested.
  (D) Alignment of RM IGHD3–41 alleles, human IGHD3–3, and HCDR3 sequences for one
  inferred germline (iGL.1) and one mature (PCT64.35S) of PCT64. The FWS motif are
  highlighted in yellow. (E) The frequency of PCT64-like HC sequences in 14 human
  donors and 60 RMs. Median was plotted across all donors. (F) Alignment of RM IGHD3–15
  and HCDR3 sequences for RHA1 (labelled as RHA1.V2.01), two mature PCT64s (PCT64.35S
  and PCT64.35M) and PGDM1401. The DDY motif are highlighted in cyan. (G) Zoomed-in
  views of PCT64 (cyan) and RHA1 (red) HCDR3s buried within the ApexGT2 and BG505
  DS-SOSIP trimers, respectively. The DDY motifs are shown as sticks. (H) The frequency
  of Apex bnAb-like heavy chain (HC) sequences (with a DDY motif around the middle
  of the long HCDR3) in 14 human donors and 60 RMs. Median was plotted across all
  donors. Source data can be found in Data file S4
