figure_title: Identification of serum exosomal lncRNA H19 as a biomarker for AF.
caption: Identification of serum exosomal lncRNA H19 as a biomarker for AF. (A) Schematic
  illustration of exosome isolation from human serum. (B) Transmission electron micrographs
  of NAFEXO and AFEXO. Scale bar = 100 nm. (C) Size distribution of NAFEXO and AFEXO.
  (D) Representative blots of TSG101, CD81, and GRP94 in iPSC-aCMs lysates and both
  types of exosomes. Experiments were performed using at least three independent biological
  replicates. Uncropped blots are presented in Figure S16. (E) Schematic illustration
  of RNA sequencing profiles. (F) Heat map of 27 differentially expressed serum exosomal
  lncRNAs between AFEXO (n = 3) and NAFEXO (n = 3). Red indicates relatively higher
  expression, whereas blue indicates relatively lower expression. (G) Volcano plot
  for the comparison of lncRNA expression profiles between NAFEXO and AFEXO. X-axis,
  differential expression profiles, plotting the log2 (fold change); Y-axis, statistical
  significance of differences. (H) Top diseases and biological functions of lncRNA
  H19 identified using Ingenuity Pathway Analysis. (I) qRT-PCR analysis of lncRNA
  H19 levels in the indicated groups (n = 68 per group). Data are normalized to GAPDH
  levels. (J) Correlation analysis of serum exosomal lncRNA H19 levels with LAD. (K)
  ROC curve analysis for prediction of AF by serum exosomal lncRNA H19. ****P < 0.0001.
  NAFEXO, serum-derived exosomes from patients without AF; AFEXO, serum-derived exosomes
  from patients with AF; LAD, left atrial diameter; ROC, receiver operating characteristic;
  AUC, area under the curve; CI, confidence interval
