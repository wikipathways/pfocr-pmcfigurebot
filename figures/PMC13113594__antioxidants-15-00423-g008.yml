figure_title: The role of 2R,3R-trans-dihydroquercetin (DHQ) in the response to ionizing
  radiation at the molecular and cellular level.
caption: 'The role of 2R,3R-trans-dihydroquercetin (DHQ) in the response to ionizing
  radiation at the molecular and cellular level. 1– Neutralization of the hydroxyl
  radical (•OH) formed during radiolysis of the aqueous medium and subsequent reactions
  of reactive oxygen species (ROS) formation, as well as the processes of long-lived
  reactive protein species (LPRS) formation and oxidative DNA damage induced by it
  (using 8-oxoguanine (8-oxoGua) as an example). 2—Participation of DHQ in cellular
  signaling after irradiation. The main processes and their key participants are presented,
  the expression of most of which is subject to the modulating effect of DHQ. 2a—DNA
  damage and the NF-κB pathway. ROS cause DNA damage, which leads to the activation
  of sensor kinases (ATM (ataxia-telangiectasia mutated protein), ATR (ataxia-telangiectasia
  protein and Rad3-related protein)). ATM/ATR phosphorylate proteins (p53 and checkpoint
  kinases), leading to cell cycle arrest and activation of DNA repair pathways. Double-strand
  breaks are primarily repaired through non-homologous end joining, which requires
  the XRCC4, XRCC5, and DNA ligase IV (LigIV) genes. ATM also phosphorylates and activates
  the IKK complex. IKK phosphorylates the NF-κB inhibitor, leading to its degradation
  and the release of NF-κB, which translocates to the nucleus. In the nucleus, NF-κB
  induces the expression of genes responsible for survival (DNA repair) and inflammation,
  including cytokines and chemokines (TNF-α-tumor necrosis factor alpha), which enhance
  the inflammatory response. At the same time, ROS disrupt the binding of NRF2 (nuclear
  factor erythroid 2-related factor 2) to Keap1 (Kelch-like ECH-associated protein
  1), causing its nuclear translocation. NF-κB and NRF2 jointly regulate ARE (antioxidant
  response element: HO-1 (heme oxygenase-1), which destroys the prooxidant heme; ROS
  scavengers—superoxide dismutase (SOD), catalase (CAT); peroxiredoxins (Prx)—multifunctional
  peroxidases with signaling and chaperone functions, involved in thiol balance; etc.
  As a result, DNA damage can be neutralized. Critical DNA damage activates p53 and
  triggers apoptosis, mainly through mitochondrial pathway and activation of the caspase
  cascade (Casp3 is the key effector caspase-3). 2b—ROS activate the transcription
  factor AP-1 via protein kinases JNK (c-Jun N-terminal kinases) and c-Abl (tyrosine
  kinase Abl1). The JNK/AP-1 signaling pathway also stimulates apoptosis, and ATM-mediated
  phosphorylation of c-Abl (tyrosine kinase Abl1) regulates it. Heat shock proteins
  (HSP70 and HSP90) have additional regulatory functions'
article_title: 2R,3R-trans-Dihydroquercetin Has Powerful Antioxidant Properties, Prevents
  DNA and Protein Damage, and Protects Mice from Injury Caused by Radiation-Induced
