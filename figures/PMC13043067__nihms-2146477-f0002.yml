figure_title: Matrix mineralization modulates mechanosensitive signaling in hMSCs.
caption: 'Matrix mineralization modulates mechanosensitive signaling in hMSCs. (A)
  Representative immunofluorescence images showing Phospho-Paxillin (green), actin
  (red), and DAPI (blue) in hMSCs cultured for 2 h on non-mineralized, partially mineralized,
  and fully mineralized scaffolds (scale bar = 20 μm). White dashes outline the cell
  membrane. (B) Schematic of focal adhesion complexes illustrating the roles of paxillin
  in the integrin adhesome signaling. (C) Quantification of Phospho-Paxillin clusters
  per cell shows significantly fewer clusters in partially and fully mineralized scaffolds
  compared to non-mineralized controls (n = 9–16 cells from 3 samples per group).
  (D) Immunofluorescence images of YAP1 (green), actin (red), and DAPI (blue) in hMSCs
  at 2 h reveal increased nuclear YAP1 localization in mineralized conditions (scale
  bar = 25 μm). (E) Schematic of the mechanotransduction pathway showing YAP nuclear
  translocation in response to matrix stiffness and integrin signaling leading to
  osteogenic differentiation. (F) Quantification of YAP1 nuclear fraction shows significantly
  higher nuclear localization in cells on fully mineralized scaffolds (n = 40–56 cells
  from 3 samples per group). Data presented as mean ± SD. **p < 0.01, ***p < 0.001,
  ****p < 0.0001 by one-way ANOVA with Tukey’s post hoc test. Panel B and E created
  in BioRender. hMSCs: human mesenchymal stem cells; Phospho-Paxillin: phosphorylated
  paxillin; YAP1: Yes-associated protein 1; DAPI: 4′,6-diamidino-2-phenylindole; ECM:
  extracellular matrix; SD: standard deviation; ANOVA: analysis of variance'
