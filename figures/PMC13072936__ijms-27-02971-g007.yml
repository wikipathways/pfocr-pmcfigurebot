figure_title: Schematic summary of core gene functions in ccRCC pathways.
caption: Schematic summary of core gene functions in ccRCC pathways. This diagram
  establishes a conceptual framework for elucidating the potential roles of OTA–core
  gene interactions in ccRCC progression, where the five core genes (IGFBP3, ITGA5,
  PYGL, SLC22A8, LTB4R) are mapped to four key biological processes underlying clear
  cell renal cell carcinoma (ccRCC) pathogenesis—extracellular matrix (ECM) remodeling
  and angiogenesis (orange), metabolic reprogramming (green), immune microenvironment
  modulation (blue), and detoxification/transport (gray)—with red upward arrows denoting
  up-regulation in ccRCC tissues, blue downward arrows denoting down-regulation, and
  “OTA” labels indicating molecular docking-predicted stable binding of OTA to all
  five proteins
