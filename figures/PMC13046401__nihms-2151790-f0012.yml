figure_title: Dysregulation of Bile Acid and Tryptophan Metabolism from Sleep and
  Circadian Disruption
caption: 'Bile Acid Metabolism (Left Panel). (A) Under physiological conditions, most
  primary bile acids are reabsorbed via active transport to the enterohepatic circulation
  to be used by hepatocytes in the liver. When bacteria with BSH activity is reduced
  (B) or when dietary substrates are mismatched with microbial BSH capacity, (C) deconjugation
  of primary bile acids is impaired, limiting conversion to secondary bile acids and
  (D) reducing the secondary bile acid pool available for epithelial absorption. This
  reduction has several downstream effects, including: (E) decreased antagonism of
  the RORγt transcription factor due to lower levels of secondary bile acids (e.g.,
  dehydrolithocholic acid, isolithocholic acid, allolithocholic acid), leading to
  (F) increased Th17 activation, neutrophil recruitment, and pro-inflammatory cytokine
  release; (G) diminished TGR5 activation, resulting in lower cAMP signaling and reduced
  inhibition of NF-κB–mediated inflammation; and (H) reduced levels of deconjugated
  bile acids, limiting intestinal FXR activation, leading to decreased expression
  of FGF19 (FGF15 in mice) and downregulation of genes involved in antimicrobial peptide
  production and tight junction maintenance. Processes E-H result in elevated conjugated
  primary bile acids, (I) increased intestinal permeability, increased LPS leakage
  into the systemic circulation, and a robust pro-inflammatory response driving GI
  and systemic inflammation. Tryptophan Metabolism (Right Panel). (A) Increased stress
  and immune signaling mediators such as IFN-γ, TNF-α, and LPS released from activated
  immune cells (e.g., helper T cells, macrophages, dendritic cells) stimulate IDO1
  expression (B) in enterocytes and in antigen-presenting cells. Under homeostatic
  conditions, IDO1 is most prominently expressed in enterocytes throughout the small
  intestine, but highly inducible in response to inflammatory stimuli throughout the
  GI tract including the large intestine. When stimulated, IDO1 (C) preferentially
  shifts tryptophan to the kynurenine metabolism pathway. Byproducts of kynurenine
  metabolism including kynurenic acid (a small, polar anti-inflammatory metabolite)
  and quinolinic acid (a hydrophilic and less membrane-permeable excitotoxic NMDA
  receptor agonist), and the ratio of kynurenic acid to quinolinic acid is tightly
  regulated under physiologic conditions to prevent toxicity. With (D) increased inflammation
  and GI permeability, (E) quinolinic acid can exit immune and gut mucosa cells to
  the circulation, triggering (F) inflammation and (G) dysregulated gut-brain communication
  through vagal afferent signaling and (H) potentially resulting in neurotoxicity.
  Kynurenine pathway predominance also results in (I) decreased tryptophan metabolism
  through the indole pathway. Paired with (J) decreased abundance of bacteria with
  tryptophanase activity secondary to sleep and circadian disruption, leading to (K)
  decreased production of gut-derived indoles and their downstream signaling. Reduced
  activation of indole-responsive receptors increases intestinal permeability and
  promotes inflammation by downregulating key pathways, including (L) AhR (in epithelial
  cells and T cells) and PXR (in enterocytes and endothelial cells). These receptors
  help maintain the intestinal barrier by supporting mucus production, tight junction
  integrity, and by regulating inflammation and oxidative stress. A reduction in indoles
  and their derivatives also (M) diminishes activation of TRPA1 channels, leading
  to decreased calcium-dependent release of serotonin and peptide YY, which in turn
  impairs gut motility, secretion, and vagal gut–brain signaling. Collectively, these
  disruptions contribute to a (N) pro-inflammatory, hyperpermeable intestinal environment
  with downstream effects on systemic physiology. Decreased tryptophan metabolism
  (O) via the serotonin pathway also occurs secondary to increased kynurenine pathway
  activity, resulting in (P) a reduction in GI serotonin and (Q) reduced GI transit
  and increased intestinal permeability via decreased vagal afferent stimulation.
  Impaired vagal afferent serotonin signaling may alter central autonomic activity
  and pineal function, contributing (R) sleep disruption, increased anxiety and reduced
  cognition. Additionally, increased kynurenine pathway activity can deplete (S) GI
  and (T) central tryptophan availability, limiting melatonin synthesis and further
  affecting sleep.Abbreviations. AhR: Aryl hydrocarbon Receptor, BSH: Bile Salt Hydrolase,
  FGF19: Fibroblast Growth Factor 19, FXR: Farnesoid X Receptor, GI: Gastrointestinal,
  IDO1: Indoleamine 2,3-Dioxygenase 1, IFN-γ: Interferon gamma, IL: Interleukin, LPS:
  Lipopolysaccharide, NF‑κB: Nuclear Factor-κB, NMDA: N-methyl-D-aspartate, PXR: Pregnane
  X Receptor, TGR5: Takeda GPCR 5 (also called G-protein-coupled bile acid receptor
  1), TNF-α: Tumor Necrosis Factor alpha, TPH1: Tryptophan Hydroxylase 1, TPH2: Tryptophan
  Hydroxylase 2, TRPA1: Transient Receptor Potential Ankyrin 1. Created in BioRender.
  Maki, K. (2025) https://BioRender.com/jg7yn5b'
