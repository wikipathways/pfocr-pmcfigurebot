figure_title: NF1-depletion correlates with an increase in the CDK4/6-RB pathway activity
  in ER+ breast tumors
caption: (A) Correlation between NF1 protein abundance and kinase activity scores
  in tumors from the CPTAC breast cancer prospective cohort (n = 122). P and Rho values
  by Spearman correlation. The dash line marks P = 0.05. (B) Correlation between NF1
  protein abundance and the ratio of phosphorylated RB1 (median of all quantified
  RB1 phospho-sites) over total RB1 abundance as quantified by global proteomics from
  the same CPTAC breast cancer prospective cohort (n = 122). Trend lines were calculated
  by linear regression model. P value and Rho by Spearman correlation. (C) Indicated
  cell lines were seeded in low-attachment plates, and cultured in medium containing
  5% FBS for 2 weeks. A representative immunoblot is shown on the left. Quantifications
  of relative levels of cyclin D1, normalized phospho-RB (S780) and phospho-CDK4 (T172)
  from three separate experiments (n = 3) are shown on the right. Results are shown
  as mean ± s.e.m., and P values were calculated by two-tailed Student’s t-test. (D)
  Correlation between CCND1 protein abundance (RPPA) and NF1 mRNA expression in the
  Luminal A subset of the TCGA breast cancer cohort (n = 169). Pearson’s correlation
  coefficient and P values are shown. (E) Indicated METABRIC patient cohorts were
  analyzed by Kaplan-Meier plot as Fig. 1C. *, P < 0.05; **, P < 0.01
article_title: NF1-depleted ER+ breast cancers are differentially sensitive to CDK4/6
