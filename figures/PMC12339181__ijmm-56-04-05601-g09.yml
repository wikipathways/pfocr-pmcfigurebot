figure_title: Regulatory mechanism of inflammatory mediators in bone metabolism.
caption: 'Regulatory mechanism of inflammatory mediators in bone metabolism. Inflammatory
  mediators disrupt bone homeostasis through four principal mechanisms: OPG expression
  combined with increased RANK/RANKL activity promotes osteoclast differentiation
  and increases bone resorption; activation of the PPARγ pathway drives the adipogenic
  transformation of bone marrow mesenchymal stem cells; mitochondrial damage coupled
  with cGAS-STING pathway activation induces osteoblast apoptosis; and inhibition
  of Wnt/β-catenin pathway activity-mediated by upregulated DKK1 and SOST expression-suppresses
  osteoblast formation. DKK1, Dickkopf-1; SOST, sclerostin; RANKL, receptor activator
  of nuclear factor-kappaB ligand; OPG, osteoprotegerin. The arrows indicate the direction
  of change: ↑, increased expression/activity; ↓, decreased expression/inhibition'
