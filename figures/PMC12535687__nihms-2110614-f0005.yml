figure_title: Differential gene expression in the BBB of 22qMc after bezafibrate treatment
caption: (A) Venn diagram of differentially expressed genes between untreated and
  bezafibrate-treated 22qMc. (B) Volcano plot of differentially-expressed genes in
  flow-sorted CD31+CD45−PDGFRß− –BBB-ECs isolated from the brain of 22qMc untreated
  (n = 3) and 22qMc receiving bezafibrate (n = 3). Differentially expressed genes
  with an average fold change of 1.301 and were considered significant (P<0.05). The
  570 differentially upregulated genes are shown in green, and the 481 most downregulated
  genes denoted in red. Relevant genes are annotated. (C to E) Representative gene
  set enrichment analysis (GSEA) plots of enriched pathways, protein transmembrane
  import into intracellular organelle (C), mitochondrial transmembrane transport (D),
  protein transport into mitochondrial matrix (E) and ranked list of the 20 most-contributing
  genes (NES = normalized enrichment score). In the bottom portion, red indicates
  high expression in bezafibrate, and blue indicates high expression in untreated.
  Gene sets were considered significant with a false discovery rate (FDR)<0.05. (F
  and G) Pathway analysis of top downregulated (F) and upregulated (G) differentially
  expressed genes using GO enrichment analysis
article_title: Bezafibrate improves mitochondrial function, blood-brain barrier integrity,
  and social deficits in models of 22q11.2 deletion syndrome
