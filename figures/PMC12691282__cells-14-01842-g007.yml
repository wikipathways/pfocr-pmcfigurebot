figure_title: Pseudo-time trajectory analysis of 24 hemocyte clusters (0–23) of S.
caption: 'Pseudo-time trajectory analysis of 24 hemocyte clusters (0–23) of S. exigua.
  Pseudo-time trajectories were reconstructed from pooled hemocytes of naïve and immune-challenged
  larvae using Monocle 3 in R. Prohemocytes were designated as the root state, marking
  the earliest point of the differentiation pathway. Each cluster is color-coded as
  shown in the figure, with individual dots representing single cells positioned along
  the inferred developmental continuum. Hemocyte clusters were organized into three
  distinct lineages (Lineage 1–Lineage 3), with each lineage trajectory subdivided
  into three developmental stages: an early stage, enriched in progenitor-like clusters
  at the root; a mid-stage, consisting of transitional clusters positioned along branching
  trajectories; and a late stage, composed of terminally differentiated hemocyte subtypes
  located at branch termini'
