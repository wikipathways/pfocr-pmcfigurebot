figure_title: DNJ-TF targets PTGS2 or MMP9 in HepG2 cells and improves PA-induced
  inflammation and insulin resistance via the TNFα/AKT/GSK3/GLUT2 signaling pathway.
caption: 'DNJ-TF targets PTGS2 or MMP9 in HepG2 cells and improves PA-induced inflammation
  and insulin resistance via the TNFα/AKT/GSK3/GLUT2 signaling pathway. (A) Inhibition
  rate of COX-2 by DNJ-TFs; (B) expression of inflammatory factors IL-6, IL-1β, and
  TNF-α in HepG2 cells in each group; (C) protein expressions of PTGS2, MMP9, TNF-α,
  RANKL, p-AKT/AKT, p-GSKα/GSKα, p-GSKβ/GSKβ, and GLUT2 in HepG2 cells of each group.
  Model—300 μM PA for 24 h; Metformin—300 μM PA + 10 μg/mL metformin for 24 h; A—300
  μM PA + 10 μg/mL DNJ + 5 μg/mL TFs for 24 h; B—300 μM PA + 20 μg/mL DNJ + 10 μg/mL
  TFs for 24 h. * p < 0.05 and ** p < 0.01 vs. Model; ## p < 0.01 vs. Celecoxib/Con'
