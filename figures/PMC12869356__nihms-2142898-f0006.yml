figure_title: Eos is involved in the migration of recirculating thymic Tregs
caption: (A) Principal component analysis (PCA) to compare bulk RNA-seq samples of
  sorted Eos+ Tregs, Eos− Tregs, and Foxp3− CD4SP cells from the thymus of WT mice.(B)
  Volcano plot showing genes differently expressed comparing bulk RNA-seq samples
  of Eos+ thymic Tregs to Eos− thymic Tregs.(C) Pathway enrichment analysis to show
  pathways down-regulated or up-regulated by comparing bulk RNA-seq samples of Eos+
  thymic Tregs, Eos− thymic Tregs, and Foxp3− CD4SP Tconvs.(D) In vitro migration
  assay using Ccr6+ or Ccr6− thymic Tregs sorted from WT or Eos cKO mice cultured
  in the upper chamber of a 5-μm Transwell plate with the presence of Ccl20 in the
  bottom chamber. After 20 h, the number of cells that migrated to the bottom chamber
  was determined by flow cytometry.(E) Schematic representation of the procedure for
  in vivo migration study of WT and Eos cKO Tregs in 6 wo heterozygous females following
  i.v. injection of α-CD45-BUV737 antibody.(F) Representative plots of i.v.-labeled
  CD45+ cells, Foxp3-RFP+ cells (WT Tregs), and Foxp3-YFP+ cells (Eos cKO Tregs) among
  CD4+ T cells or CD45+ CD4+ T cells from the thymus and spleen of 6 wo heterozygous
  females injected with α-CD45-BUV737 antibody.(G) Quantifications of WT or Eos cKO
  Treg frequencies within CD45+ CD4 T cells from the thymus and spleen of 6 wo heterozygous
  females injected with α-CD45-BUV737 antibody.p values are determined by one-way
  ANOVA (D) and Student’s t test (G). Mean ± SD. *p < 0.05; **p < 0.01; ***p < 0.001;
  ****p < 0.0001
