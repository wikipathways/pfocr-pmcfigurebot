caption: 'A. Sema3A and BDNF are implicated in regulating alveolar bone formation
  on the tension side under orthodontic force. B. Sema3A binding to Nrp1 on PDLCs
  promotes osteogenesis by activating Rac1-β-catenin-Wnt signaling and the RhoA/ROCK2
  pathway for osteoblast genesis. C. BDNF promotes osteogenesis by inhibiting PDLC
  senescence via the Notch3 pathway and may also promotes osteogenesis through binding
  to the TrkB receptor. Abbreviation: PDLC, periodontal ligament cells; OB, osteoblast'
