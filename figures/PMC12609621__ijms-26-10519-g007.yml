figure_title: A schematic model to explain our study.
caption: 'A schematic model to explain our study. MNNG induces parthanatos through
  both BAX/BAK- and Bim-dependent pathways. Meanwhile, MNNG causes PARP-1-dependent
  rapid ATP depletion, leading to the activation of AMPK. Interestingly, activated
  AMPK suppresses the upregulation of Bim induced by MNNG, possibly at the protein
  level, and thereby limits Bim-dependent parthanatos. In the absence of the AMPK
  activation, upregulated Bim individually promotes MNNG-induced MOMP, and therefore
  induces parthanatos independently of BAX and BAK. ATP↓: ATP depletion. ↓ Δψm: Decrease
  in mitochondrial membrane potential'
article_title: AMPK Limits MNNG-Induced Parthanatos by Inhibiting BH3-Only Protein
  Bim
