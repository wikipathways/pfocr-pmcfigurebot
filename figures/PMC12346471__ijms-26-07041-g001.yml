caption: A previously published CVB-infected iBEC RNA sequencing dataset was queried
  and downloaded from Gene Expression Omnibus (GEO) (GSE269413). Whole transcriptome
  analysis was then run using a suite of bioinformatics tools in the “3PodR” package,
  including differential gene expression, pathway analysis, and perturbagen analysis
  [19]. Visualizations were subsequently generated from this analysis. The “3PodR”
  tool package (pre-release, https://doi.org/10.5281/zenodo.8190833, accessed on 8
  August 2024) enabled the interpretation of transcriptomic changes, biomolecular
  pathways, and possible perturbagens were identified, providing a unique transcriptional
  analysis of this dataset. Created in Biorender. Jacob Wood. (2025) https://BioRender.com
  (accessed on 10 January 2025)
