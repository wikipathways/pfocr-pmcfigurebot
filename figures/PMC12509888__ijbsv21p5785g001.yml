figure_title: TM or AMD3100 synergizes with bortezomib to kill solid tumors via immune
  activation.
caption: TM or AMD3100 synergizes with bortezomib to kill solid tumors via immune
  activation. TM or AMD3100 impairs mitochondrial function, resulting in proteasome
  dysfunction. Combination administration of TM or AMD3100 with bortezomib induces
  DNA damage, thereby activating the cGAS/STING pathway. This subsequently triggers
  NF-κB signaling, upregulating MHC class I-related genes and CCL5. Enhanced antigen
  presentation increases CD8+ T cell cytotoxicity, while CCL5 promotes their infiltration,
  collectively converting cold tumor into hot tumor. Created with BioRender.com
