figure_title: CA improves pyroptosis in HF through the Nrf2/ROS/TXNIP pathway.
caption: CA improves pyroptosis in HF through the Nrf2/ROS/TXNIP pathway. (A) Representative
  Nrf2 immunohistochemistry images of each group and their quantitative analysis (n=3).
  (B) Representative images of the expression levels of Nrf2 and TXNIP in myocardial
  tissue of Wistar rats assessed by western blotting. (C) Semi-quantitative analysis
  of Nrf2 and TXNIP expressions (n=3). (D) Representative images of the expression
  levels of NLRP3, ASC, pro- and cleaved-caspase-1, GSDMD, GSDMD-NT in myocardial
  tissue of Wistar rats by western blotting. (E) Semi-quantitative analysis of NLRP3,
  ASC, pro- and cleaved-caspase-1, GSDMD, GSDMD-NT expressions (n=3). (F) Representative
  images of the expression levels of IL-18 and IL-1β in myocardial tissue of Wistar
  rats by western blotting. (G) Semi-quantitative analysis of IL-18 and IL-1β expressions
  (n=3). Data are presented as the mean ± SD, *P<0.05, **P<0.01, ***P<0.001. CA, calycosin;
  HF, heart failure; Nrf2, nuclear factor erythroid 2-related factor; ROS, reactive
  oxygen species; TXNIP, thioredoxin-interacting protein; CA-L, calycosin low-dose;
  CA-H, calycosin high-dose; ASC, apoptosis-associated speck-like protein containing
  a CARD; GSDMD, gasdermin D; GSDMD-NT, GSDMD N-terminal fragments
