figure_title: Integrated regulatory networks governing pubertal mammary gland development.
caption: Integrated regulatory networks governing pubertal mammary gland development.
  Schematic representation illustrating the multifaceted regulatory mechanisms orchestrating
  pubertal mammary morphogenesis. The diagram depicts the hierarchical organization
  of hormonal regulation, initiated by hypothalamic–pituitary–gonadal axis activation,
  which stimulates ovarian secretion of progesterone and estrogen. These hormones,
  in conjunction with pituitary-derived factors, promote terminal end bud (TEB) formation
  and ductal elongation. The central panel illustrates TEB architecture, showing the
  spatial organization of cap cells, body cells, mammary epithelial cells (MECs),
  and mammary stem cells within the proliferative structure. Progesterone and estrogen
  indirectly stimulate insulin-like growth factor 1 (IGF1) production, which synergistically
  regulates mammary development. The right panel depicts Notch signaling pathway activation
  in ovarian tissues, leading to IGF2 production and downstream activation of PI3K-AKT
  and MAPK signaling cascades. Paracrine signaling mechanisms are illustrated through
  stromal cell-mediated communication, whereby stromal cells respond to systemic hormones
  and secrete paracrine factors that promote vascular and lymphatic network development
  through VEGF-C and VEGF-D signaling. The lower panels highlight key gene expression
  programs and dynamic transcriptional regulation during pubertal development, including
  upregulation of serotonin receptor genes (5HTR1A, 5HTR1B) and Notch signaling components
  (Hey1, Hey2, Jagged1, Delta1). This integrative framework emphasizes the coordinated
  interaction between endocrine hormones, paracrine growth factors, and intracellular
  signaling cascades that collectively drive pubertal mammary gland morphogenesis
