figure_title: PbRpt3 interactome analysis.
caption: PbRpt3 interactome analysis. Volcano plot representations of the outcome
  of the PbRpt3 interactome study. PbRpt3 (PBANKA_0715600) is highlighted in red.
  Highlighted in blue are the interacting proteins belonging to the 19S proteasome
  (A) and to the GO enriched “phospholipid binding pathway” (B) List of the proteins
  is included in the tables below the plots, ranked according to their Student’s t-test
  difference. Gene identifiers (Id) and protein descriptions were updated using PlasmoDB
  relapse 68 (May 2024), except for Rpn4 and Rpt2, which have short names attributed
  based on sequence homology
