figure_title: CMA improves mitochondrial homeostasis in M1 macrophages.
caption: 'CMA improves mitochondrial homeostasis in M1 macrophages. Following a 1-h
  pretreatment with CMA (20 μM), RAW 264.7 macrophages were stimulated with LPS (1
  µg/mL) for 24 h. (A, B) Representative images and relative quantification of mitochondria
  from MTG-labeled RAW 264.7 macrophages. Quantification was performed by counting
  mitochondrial fluorescence in all cells in four to eight random fields, respectively.
  Scale bar: 5 μm. (C, D) Representative immunoblot bands and quantification of the
  mitochondrial marker TOMM20 in RAW 264.7 macrophages (n = 5). (E, F) Fluorescence
  microscopy and fluorescence microplate reader analysis of JC-1-labeled MMP in RAW
  264.7 macrophages. Scale bar: 100 μm. (G, H) Flow cytometry and quantification of
  MitoSOX Red-labeled mtROS in RAW 264.7 macrophages (n = 3). (I) Volcano plot shows
  DEGs in the LPS group vs LPS + CMA group. (J) GO enrichment analysis of upregulated
  DEGs in the LPS group vs LPS + CMA group. (K) GO enrichment analysis of downregulated
  DEGs in the LPS group vs LPS + CMA group. (L) Heat map of DEGs related to mitochondrial
  function, ROS detoxification, and oxidative stress pathways in control, LPS and
  LPS + CMA groups (n = 3). Data presented as mean ± SD, *P < 0.05, **P < 0.01'
