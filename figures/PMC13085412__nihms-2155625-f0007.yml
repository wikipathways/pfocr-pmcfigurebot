figure_title: Vav1 is a key target of CD47-mediated inhibition of phagocytosis
caption: (A) TIRF images show IgG (AlexaFluor 488-IgG, green) and mCherry-Vav1 (magenta)
  as BMDMs interact with an IgG (top) or IgG+CD47 (bottom) bilayer. The linescan shows
  the fluorescent intensity of AlexaFluor 488-IgG and mCherry-Vav1 at the indicated
  position (white arrow in images). Intensity was normalized so that 1 is the highest
  observed intensity and 0 is the lowest observed intensity. (B) Images from TIRF
  microscopy timelapse show IgG (black) clustering as BMDMs land and spread on a bilayer
  with IgG (top) or IgG+CD47 (bottom). Graph depicts the average area of contact from
  n≥16 cells pooled from 3 separate experiments. The area of clustered IgG per cell
  (C) and the mean fluorescent intensity of mCherry-Vav1 at IgG clusters (D) was measured
  for n=30 cells landing on IgG or IgG+CD47 bilayers, pooled from 3 independent experiments.
  (E) The Pearson’s Correlation Coefficient was calculated for mCherry-Vav1 and AlexaFluor
  488-IgG in the footprint of n≥38 cells from 3 separate experiments landing on IgG
  or IgG+CD47 bilayers. (F) BMDMs expressing membrane-tethered mCherry (mCherry-CAAX)
  or a hyperactive Vav1 mutant (mCherry-Vav3F) were incubated with unopsonized (--),
  IgG, or IgG+CD47 beads for 30 minutes, then visualized via confocal microscopy.
  (G) BMDMs expressing membrane-tethered mCherry (mCherry-CAAX) or a hyperactive Vav1
  mutant (mCherry-Vav3F) were incubated with CD47KO or WT L1210 mouse leukemia cells
  that had been dyed with CellTrace Far Red. Anti-murine CD20 antibody was used to
  activate phagocytosis. The number of whole cells phagocytosed was quantified by
  timelapse microscopy. In (F) and (G), the average number of beads or cells engulfed
  per macrophage was normalized to the highest average for that experiment, and points
  denote averages from each of 3 replicates comprising at least 100 macrophages. (H)
  Diagram shows the proposed pathway for CD47 signaling. Data was compared using an
  unpaired t test (C, D, E) or one way ANOVA with Holm Sidak multiple comparison test
  (F, G). Line and error bars denote mean and SEM.* denotes p<0.05, ** denotes p<0.005,
  *** denotes p<0.0005. Scale bars are 10μm
