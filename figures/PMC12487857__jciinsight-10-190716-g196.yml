figure_title: FXR inhibits cytokine production and cytotoxic activity of cocultured
  CD8+ T cells through HVEM/BTLA checkpoint pathway
caption: Purified human CD8+ T cells were cocultured with HVEM-overexpressed H1975
  stable cells which were transfected with FXR-siRNAs, or FXR-overexpressed A549 stable
  cells which were transfected with HVEM-siRNAs in the presence or absence of anti-BTLA
  antibody for 3 days. (A and B) The protein levels of FXR and HVEM in the cocultured
  H1975 stable cells (A) and A549 stable cells (B) were examined by Western blotting.
  (C–F) Intracellular TNF-α and IFN-γ expression levels in CD8+ T cells cocultured
  with H1975 stable cells (C and D) or A549 stable cells (E and F) was analyzed by
  flow cytometry. (G and I) The apoptotic rate of CD8+ T cells cocultured with H1975
  stable cells (G) or A549 stable cells (I) was determined by flow cytometry using
  annexin V-FITC/PI staining assay. (H and J) The amounts of LDH released into the
  medium from the cocultured H1975 stable cells (H) or A549 stable cells (J) were
  measured. (K and L) The cell viability of cocultured H1975 stable cells (K) and
  A549 stable cells (L) was measured via crystal violet staining. Each experiment
  was conducted independently at least 3 times. Data are shown as mean ± SD from 3
  biological replicates. Statistical significance was assessed with 1-way ANOVA followed
  by Tukey’s post hoc test (C–J). In C, D, G, and H, *P < 0.05, **P < 0.01, compared
  with NC group. †P < 0.05, ††P < 0.01, compared with mock group. In E, F, I, and
  J, *P < 0.05, **P < 0.01, ***P < 0.001, compared with mock, isotype control, or
  NC group
article_title: FXR shapes an immunosuppressive microenvironment in PD-L1lo/– non-small
  cell lung cancer by upregulating HVEM
