figure_title: Walnut husk extract preserves epithelial barrier.
caption: Walnut husk extract preserves epithelial barrier. (A) HaCaT cells treated
  for 24 h with walnut husk extract (10 µg/mL) showed no morphological alterations
  compared to control. Scale bars 100 μm. (B) Schematic representation of the mTORC2
  pathway. (C) Western blot analysis of junctional proteins (E-cadherin, γ-catenin)
  and proteins involved in barrier regulation (NDRG1, phospho-NDRG1, Filaggrin) revealed
  preserved barrier integrity. GAPDH was used as a loading control. (D) Effects of
  walnut husk extract on the expression of phospho-PKC substrate after 30 min of treatment.
  Ponceau Red used as loading control. Densitometric quantification of Western blots
  is reported in Figure S3
article_title: Phytochemistry and Biological Effects of the Juglans regia “Sorrento”
  Walnut Husk Extract on Human Keratinocyte Cells
