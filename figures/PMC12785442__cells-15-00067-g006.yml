figure_title: Genes involved in synaptic transmission, protein translation, and cellular
  respiration are altered in the brainstem of P40–50 HETs.
caption: 'Genes involved in synaptic transmission, protein translation, and cellular
  respiration are altered in the brainstem of P40–50 HETs. Brainstem tissue was collected
  from P40–50 HET and age-matched WT mice. Single-nuclei suspension of brainstem tissue
  was obtained by gradient physical dissociation and filtration. snRNA-seq was performed
  using the 10× Chromium 3’ gene expression platform. Data was analyzed using SingleR
  and enrichR. (A,B) KEGG pathway analysis: (A) differentially expressed genes (within
  enriched pathways) upregulated in HETs; (B) differentially expressed genes (within
  enriched pathways) downregulated in HETs. Pathway analyses were performed with enrichR
  (3.1), and heatmaps were generated. p-values associated with heatmaps were obtained
  using Fisher’s exact test, followed by the Benjamini–Hochberg multiple testing correction
  for obtaining the adjusted p-values. The scale represents the log (adj p-value)
  with a cutoff of 1 × 10−25 for pathway heatmaps. N = 1/group'
