figure_title: The ISR pathway undergoes dynamic expression changes during adult MuSC
  activation
caption: A. Schematic of single-cell RNA sequencing of freshly FACS sorted (Q=quiescence)
  and 18 hours in vitro activated (A=activation) from adult mouse adapted from Kimmel
  et al., 2020. n=2 mice.B. UMAP projection of transcriptional state space (left)
  and unsupervised clustering showing two transcriptional clusters within the Q-MuSC
  and A-MuSC populations (right).C. Overlay of expression of cell cycle genes and
  ISR-related genes in scaled log (UMI+1) on the UMAP plot.D. Violin plots of ISR-related
  genes significantly different among cluster 3 and cluster 4.E. Representative images
  of single muscle fibers from adult mice (3-6 months) stained for Pax7 (red), p-eIF2α
  (green) and DAPI (blue) immediately after isolation (0 hours) and 24 hours later.
  Scale bar, 20 μm.F. Time course of p-eIF2α mean fluorescence intensities in Pax7+
  MuSCs on adult single muscle fibers at 0, 6, 18 and 24 hours after isolation. Mean±SEM,
  n=3 mice, **p<0.01, ****p<0.001.G. Correlation between CyclinD1 and p-eIF2α (R2=0.4)
  after 18 hours in vitro. n=3 mice.H. Schematic of single-cell RNA sequencing of
  FACS sorted (quiescent and activated) label retaining cells (LRCs) and non label
  retaining cells (nLRCs) from TetO-H2B-GFP transgenic mouse model. n=2 mice.I. UMAP
  projection of unsupervised clustering showing nLRC and LRC transcriptional clusters
  within the quiescent and activated adult MuSC populations.J. Venn diagrams showing
  common genes with statistically significant differentially expressed genes among
  cluster 3 and nLRC (left) and between cluster 4 and LRC (right) (13% and 8% transcriptional
  overlap).K. Violin plots of ISR-related genes differentially expressed among nLRC
  and LRC
