figure_title: CSE-P12 facilitated autophagy-mediated STING degradation by promoting
  energy-dependent AMPK activation.
caption: 'CSE-P12 facilitated autophagy-mediated STING degradation by promoting energy-dependent
  AMPK activation. (A) Immunoblots showing the effect of CSE-P12 on the phosphorylation
  of AMPK (p-AMPK) in THP-1 cell derived macrophages under cGAMP stimulation for 1
  h; β-actin as the internal control; cGAMP = 5 μg/mL, P12 = 100 nM, CSE = 1%, CSE-P12
  = 100 nM. (B) Densitometry analysis of p-AMPK levels in (A); N = 4. (C) Immunoblots
  showing the effects of the pretreatment (1 h) of the AMPK inhibitor Compound C (5
  μM) on the protein levels of p62, LC3-II, and STING in THP-1 cell-derived macrophages
  under cGAMP stimulation for 4 h with or without CSE-P12 co-treatment; β-actin as
  the internal control; cGAMP = 5 μg/mL, CSE-P12 = 100 nM. (D) Densitometry analysis
  of STING levels in (C); N = 3. (E) Immunoblots showing the effects of the addition
  of ATP (10 μM) on the protein levels of p62, LC3-II, and STING in THP-1 cell-derived
  macrophages under cGAMP stimulation for 4 h with or without CSE-P12 co-treatment;
  β-actin as the internal control; cGAMP = 5 μg/mL, CSE-P12 = 100 nM. (F) Densitometry
  analysis of STING levels in (E); N = 4. (G) Representative TEM images showing the
  uptake of CSE-P12 in THP-1 cell-derived macrophages at 37 ℃ or 4 ℃; red arrows indicated
  nanoparticle clusters; CSE-P12 = 100 nM for 1 h; the scale bar = 500 nm. (H) ADP-to-ATP
  ratios measured by LC-MS in THP-1 cell-derived macrophages with or without CSE-P12
  treatment; N = 3. (I) Immunoblots showing the effect of CSE-P12 treatment (1 h)
  on p-AMPK; β-actin as the internal control. (J) A scheme summarizing the inhibitory
  mechanism of CSE-P12 on cGAS-STING pathway through energy-dependent induction of
  autophagy in macrophages. ns: not significant, *p < 0.05, **p < 0.01, ***p < 0.001'
article_title: Attenuation of cGAS-STING signaling-mediated lung inflammation during
  infection through autophagy induction by bioactive nanodevices
