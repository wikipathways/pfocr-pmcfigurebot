figure_title: Endothelial Rest knockout triggers endMT in vivo
caption: A. Experimental groups and outline of experimental procedures. B. UMAP plot
  of snRNAseq data in atherosclerotic aortas of mice with endothelial lineage tracing,
  with and without endothelial Rest knockout. C. Relative proportions of cell clusters
  in the snRNAseq data between endothelial Rest knockout mice and controls. D. UMAP
  plot of snRNAseq split by expression of EGFP. Note that GFP is expressed in endothelial
  cell clusters as expected but also ectopically in VSMC suggesting endMT. E. Relative
  proportions of transition VSMC-like cells among all GFP positive cells in mice with
  endothelial Rest knockout and controls estimated based on the snRNAseq data using
  Speckle. Moderated t-tests are performed as implemented in Speckle to compare relative
  proportions of different cell types between groups and p-values are FDR adjusted.
  F. GFP fluorescence and G. its corresponding quantification within the atherosclerotic
  lesions in ecRestKO mice and controls in aortic root sections. Lesion area (plaque)
  is outlined in white. Quantification of the GFP positive signal from endothelial
  lineage cells migrating in the intima was performed as GFP positive area per cell
  inside the intimal lesions. One outlier sample (based on p < 0.05 on Grubbs test
  in the control group) was removed (p-value without outlier removal remains < 0.05).
  A two-sided t-test was performed to compare between groups. H. Volcano plot and
  I. Reactome pathway analysis of pseudobulk differential expression analysis of endothelial
  cell clusters in mouse aorta snRNAseq between endothelial Rest knockout and control
  mice using DESeq2. Note enrichment in smooth muscle and extracellular matrix pathways,
  along with TGFb signaling in endothelial cells of mice with endothelial Rest knockout
  (red boxes). Groups were compared with a Wald test as implemented in DESeq2 for
  the Volcano Plot. To perform pseudobulk differential expression analysis, the expression
  read counts of each gene were aggregated across all endothelial cells in each mouse
  sample using the AggregateExpression function as implemented in Seurat v5. For the
  pathway analysis, p-values were calculated with a permutation test implemented in
  GSEA and adjusted for all independent pathways present within Reactome using FDR
