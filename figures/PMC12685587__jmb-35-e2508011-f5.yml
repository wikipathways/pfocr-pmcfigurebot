figure_title: Pea sprout extract enhances the Wnt/β-catenin signaling pathway and
  exhibits anti-inflammation in mouse model
caption: The vehicle, PSE (25, or 50 mpk), or MNX (1 mpk) were orally administrated
  5 times per week for 14 days. (A) Protein expression of Wnt/β-catenin pathway–related
  factors including Wnt3a, β-catenin, and GSK3β using western blotting. (B) Protein
  expression of pro-inflammatory cytokines such as IL-1β, IL-6, and TNF-α using western
  blotting. n = 3, The results are presented as the mean ± SD. Statistical analyses
  were performed using one-way ANOVA followed by Tukey’s post hoc test. *P < 0.05,
  **P < 0.01, ***P < 0.001, ****P < 0.0001 vs vehicle
