figure_title: TMAO disrupts transcriptional homeostasis and RNA splicing in the mouse
  brain.
caption: TMAO disrupts transcriptional homeostasis and RNA splicing in the mouse brain.
  (A) Selected significantly enriched terms from gene set enrichment analysis (GSEA)
  based on hallmark gene sets; full results in Supplementary Table 8. (B) The glycolysis
  pathway, annotated with the glycolytic genes upregulated by TMAO. * = genes whose
  products catalyze rate-limiting steps of glycolysis. Base figure adapted from Hu
  et al., 201477. (C) Selected significantly enriched terms from GSEA using the REACTOME
  pathway database; full results in Supplementary Table 8. (D) Percentage of marker
  genes in each brain cell class that are downregulated by TMAO. Neuron = neuronal
  lineage, Astro = astrocyte lineage and stem cells, Epend = ependymal cells, Vasc
  = vasculature cells, Olg = oligodendrocyte lineage, Immune = immune cells. (E) Results
  of differential splicing analysis comparing brains from TMAO-exposed and control
  mice. Each point represents a splicing event. The x-axis represents the inclusion
  level difference (ΔPSI) and the y-axis represents the −log10(FDR), capped at 15
  for visual clarity. Events significantly enriched in control or TMAO are shown in
  purple and teal, respectively; non-significant events are shown in gray. To reduce
  visual clutter, points were filtered to those with −log10(FDR) > 0. RI = retained
  intron, A5SS = alternative 5’ splice site, SE = skipped exon. (F) Unified model
  of TMAO’s neurodegeneration-promoting effects on the brain. Asterisks indicate portions
  of the model that are novel based on insights derived from this study. TMAO induces
  mitochondrial dysfunction, leading to compensatory upregulation of glycolysis and
  increased production of reactive oxygen species (ROS). The resulting oxidative stress
  further promotes neuroinflammation. Perhaps as a result of the rewired bioenergetic
  state, TMAO also promotes synaptic dysfunction, including impairments in GABAergic
  transmission. In addition, it downregulates splicing factors, resulting in changes
  to splicing patterns
