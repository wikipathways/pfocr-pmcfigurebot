figure_title: Deep proteomic profiling of synaptoneurosomes enhanced the detection
  of canonical synaptic components.
caption: 'Deep proteomic profiling of synaptoneurosomes enhanced the detection of
  canonical synaptic components. (A) Two-dimensional (2D) separation (high-pH fractionation
  followed by nanoLC) improved proteome depth (top inset) and sensitivity (bottom
  inset) compared to one-dimensional (1D) nanoLC alone. (B) Gene Ontology (GO) analysis
  of cellular components revealed increased coverage of pre- and postsynaptic membranes
  and synaptic vesicles in fractionated samples. (C) Representative proteins involved
  in adrenaline/noradrenaline biosynthesis (orange), dopamine (blue), and GABA (green)
  receptor signaling (RS) were detected across the full 4-log dynamic range. (D) GO
  pathway analysis confirmed enrichment of major synaptic signaling pathways. Key:
  *, p < 0.05 (Mann–Whitney U test); Act., active; Adren., adrenaline; Bios., biosynthesis;
  Cnt., count; Cytosk., cytoskeleton; Comp., complex; EGF, epidermal growth factor;
  Endos., endosome; FGF, fibroblast growth factor; GABA, γ-aminobutyric acid; Memb.,
  membrane; Noradren., noradrenaline; Postsyn., postsynaptic; Presyn., presynaptic;
  Prot., protein; RI Int., reporter ion intensity; RS., receptor signaling; Sign.,
  signaling; Spec., specification; Syn., synaptic; TCA, tricarboxylic acid; Traff.,
  trafficking; Ves., vesicle'
