figure_title: Intercellular communication landscape of NOP10/NHP2-positive PTCs.
caption: Intercellular communication landscape of NOP10/NHP2-positive PTCs. (A) Distribution
  of NOP10-positive and NOP10-negative proximal tubule cells (PTCs) across ccRCC samples.
  (B) UMAP plots showing the expression levels of key signaling pathways, including
  DNA repair, reactive oxygen species (ROS), and mTORC1 signaling, illustrating cellular
  distribution and density. (C) Intercellular communication analysis showing the number
  of ligand–receptor interactions between NOP10-positive and NOP10-negative PTCs (left
  panel), and between NHP2-positive and NHP2-negative PTCs (right panel). (D) Communication
  networks between NOP10-positive PTCs and other cell types in the ccRCC tumor microenvironment
  (upper panel), and between NHP2-positive and NHP2-negative PTCs (lower panel). The
  thickness of the lines and numbers represent interaction strength. Heatmaps illustrating
  selected ligand–receptor interactions between NOP10-positive PTCs and other cell
  types (E), and between NHP2-positive PTCs and other cell types (F), highlighting
  key signaling molecules. Visualization of the MIF signaling pathway networks, showing
  the direction and strength of communication from NOP10-positive (G) or NHP2-positive
  (H) PTCs to interacting cell types, respectively
