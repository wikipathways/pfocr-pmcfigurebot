figure_title: Proposed mechanism underlying NEDD4 in enhancing reactive astrogliosis
  after SCI.
caption: Proposed mechanism underlying NEDD4 in enhancing reactive astrogliosis after
  SCI. NEDD4 promotes K63-linked ubiquitination of YAP1 at K254, thereby preventing
  the interaction between YAP1 and HSC70 and inhibiting the CMA degradation of YAP1.
  Activation of the ROS-FOXM1 signaling pathway induces NEDD4 transcription, leading
  to increased YAP1 stability and subsequent promotion of reactive astrogliosis, wound
  healing, and functional recovery after SCI. In the absence of NEDD4, YAP1 protein
  becomes unstable, reactive astrogliosis is suppressed, and locomotor functional
  recovery after SCI is impaired
article_title: NEDD4 promotes reactive astrogliosis by enhancing K63-linked ubiquitination
  and inhibiting chaperone-mediated autophagy degradation of YAP1
