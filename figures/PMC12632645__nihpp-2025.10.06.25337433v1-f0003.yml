caption: 'Spearman’s correlations (with 95% confidence interval) between postoperative
  changes in proteins and pathways between the MARBLE and replication cohorts. A)
  Scatterplot of the log2 FC of the 800 proteins (A) that showed a significant temporal
  effect in at least one cohort (426 up-regulated proteins and 374 down-regulated
  proteins). The diagonal dashed line is the identity line. B) Scatterplot of enrichment
  score changes for 900 CSF pathways that showed an FDR-significant change from before
  to 24 hours after surgery at least one cohort (450 up-regulated pathways and 450
  down-regulated pathways). The diagonal dashed line is the identity line. In both
  panels, red dots indicate proteins or pathways that were up- or down-regulated in
  both cohorts; green dots indicate proteins or pathways that were up- or down-regulated
  in the MARBLE cohort only; blue dots indicate proteins or pathways that were up-
  or down-regulated in the Replication cohort only. ES: Enrichment Score'
