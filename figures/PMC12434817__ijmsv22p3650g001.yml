figure_title: Higher levels of RANKL are related to the pro-inflammatory response
  and cartilage tissue catabolism in synovial tissues from OA and RA patients.
caption: Higher levels of RANKL are related to the pro-inflammatory response and cartilage
  tissue catabolism in synovial tissues from OA and RA patients. (A) The expression
  of RANKL in synovial tissue expression profiles was analyzed from the GEO database,
  including healthy tissues (n=28), OA tissues (n=22), and RA tissues (n=152). (B-C)
  The IPA analysis identified enriched biological pathways in the GSE89408 database.
  Colors represent the extent of z-scores, indicating pathway activity based on changes
  in gene expression. A z-score > 2 (orange) suggests significant activation, while
  a z-score < -2 (blue) indicates significant inhibition. (D-E) The interaction network
  between differentially expressed genes, biological functions, and diseases was analyzed
  from the GSE89408 database. (The dotted line means direct connections.) Results
  are expressed as the means ± SD. *p < 0.05 vs. normal SF cells
