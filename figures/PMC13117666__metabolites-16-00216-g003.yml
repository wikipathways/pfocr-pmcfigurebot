caption: 'Pathway Topology Analysis of the identified metabolites deemed significant
  by MW or VIAVC testing for female (A,C,E) and male (B,D) salivary metabolite comparisons
  for high and low composite distress test scores (A,B), depression scores based on
  the PHQ-9 (C,D), and anxiety scores based on the GAD-7 (E). A higher value on the
  y-axis represents a lower p-value and the x-axis gives the pathway impact. A larger
  circle indicates a higher impact, and a deeper red circle indicates a lower p-value.
  Only metabolic pathways with p < 0.1 are labelled. The numbering scheme correlates
  with the following pathways: 1: Sphingolipid metabolism; 2: Glycolysis/Gluconeogenesis;
  3: Glyoxylate and dicarboxylate metabolism; 4: Taurine and hypotaurine metabolism;
  5: Pyruvate metabolism; 6: Glycerophospholipid metabolism; 7: Terpenoid backbone
  biosynthesis; 8: Caffeine metabolism; 9: Amino sugar and nucleotide sugar metabolism;
  10: Fructose and mannose metabolism; 11: Pentose phosphate pathway; 12: Beta-Alanine
  metabolism; 13: Riboflavin metabolism'
