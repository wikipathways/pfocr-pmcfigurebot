figure_title: Proposed model of GcvH-L-mediated resistance to the respiratory burst
  of phagocytic leukocytes
caption: (A) Upon infection, S. aureus is phagocytosed by macrophages and other phagocytic
  leukocytes; it resists respiratory burst in the phagolysosome by (1) inducing LplA2-dependent
  lipoylation of GcvH-L. (2) LA readily becomes oxidized unless (3) ADP-ribosylation
  coupled with interactions with SirTM safeguards lipoyl-GcvH-L from detrimental oxidation
  and prevents LA transfer to E2 subunits.(B) Upon overcoming respiratory burst, S.
  aureus escapes from the phagosome, and replication is initiated by (4) Macro-dependent
  ADP-ribosylhydrolase activity on GcvH-L, allowing (5) LipL-mediated transfer of
  LA from GcvH-L to E2 subunits and reinitiation of lipoylation-dependent metabolic
  pathways
article_title: Staphylococcus aureus exploits lipoic acid salvage to combat host oxidative
  stress
