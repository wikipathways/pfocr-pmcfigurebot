figure_title: BMAL1 deficiency in HBECs increased the HDM-induced inflammatory response.
caption: BMAL1 deficiency in HBECs increased the HDM-induced inflammatory response.
  (A) Western blotting and qPCR showing the knockdown efficiency of BMAL1 siRNA. (B)
  RNA sequencing of HBECs after BMAL1 depletion for 24 h. (C-D) Pathway enrichment
  analysis showing DEGs related to different pathway terms. (E) Heatmap showing the
  targeted cytokine and chemokine related components. (F) GSEA showing the increase
  in the inflammatory response in the BMAL1-silenced background. *P<0.05, **P<0.01,
  ***P<0.001, ****P<0.0001
