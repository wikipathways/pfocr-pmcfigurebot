figure_title: Functional enrichment of carp-zebrafish orthologs (g:Profiler).
caption: 'Functional enrichment of carp-zebrafish orthologs (g:Profiler). Bar plot
  summarizing term enrichment for 614 C. carpio L. genes mapped to D. rerio orthologs.
  The x-axis shows −log10(q), where q is the adjusted p-value; the vertical dashed
  line marks the significance threshold (q = 0.05). Bars represent the top enriched
  terms across annotation namespaces: GO:BP (green)-gene ontology, biological process;
  GO:CC (orange)-cellular component; GO:MF (purple)-molecular function; pathways (olive)-curated
  pathway resources (Reactome, KEGG); TF (magenta)-transcription factor motifs; miRNA
  (brown)-microRNA families'
