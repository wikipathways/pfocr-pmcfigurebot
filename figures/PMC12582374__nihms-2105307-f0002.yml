figure_title: ESR1 E2-dependent and E2-independent transcriptomic regulation in engineered
  THESC
caption: (A) Schematic of comparisons to investigate E2-dependent and independent
  actions in THESC by bulk RNA-seq. (B) Volcano plot representation and (C) IPA pathway
  analysis of differentially expressed genes in response to unliganded ESR1 by comparing
  vehicle-treated THESCESR1 and THESCNT. (D) Volcano plot representation and (E) select
  pathways from IPA pathway analysis of differentially expressed genes in response
  to liganded ESR1 by comparing THESCESR1 treated with 10 nM E2 or vehicle. (F) Bar
  graph showing the number and percentage of E2-independent and dependent DEGs that
  are active (FPKM > 1) in human endometrial biopsies at the proliferative stage from
  published RNA-seq data (GSE132713). THESC = immortalized human endometrial stromal
  cells; THESCESR1 = ESR1 activated cells; THESCNT = control non-targeting cells;
  E2 = 10 nM estradiol; vehicle = 0.1% ethanol; IPA = ingenuity pathway analysis
