figure_title: DDR2 controls the xCT-GSH-GPX4 axis and antioxidant capacity in human
  ovarian CAF68
caption: '(A) Simple schematic of the xCT-GSH-GPX4 pathway: System Xc– is an equimolar
  cystine/glutamate antiporter system composed of light chain subunit SLC7A11/xCT
  and heavy chain subunit SLC3A2/4F2. (B) Western blot of DDR2, xCT and GPX4 expression
  in shSCR, shDDR2, and shDDR2 DDR2-rescued (Rescued) CAF68 cells. Ticked numbers
  indicate molecular weights (kDa). (C) Expression of SLC3A2 (4F2), SLC7A11 (xCT)
  and GPX4 mRNA in shSCR and shDDR2 CAF68 cells determined by qPCR. (D-E) Viability
  of shSCR, shDDR2, and shDDR2 DDR2‑rescued CAF68 cells upon cystine-deprivation (48h).
  (F) Levels of intracellular GSH in shSCR and shDDR2 CAF68 cells determined by ELISA.
  (G) Levels of GSH secreted by primary omental fibroblasts determined by mass spectrometry.
  DDR2 depletion was mediated by two different siRNA (#1 and #2). (H) Detection of
  ROS in non-treated (NT) and H2O2-treated (1mM, 1h) shSCR and shDDR2 CAF68 cells.
  (C-H) Data are mean ± SEM (n≥3 biological replicates). (C) Two-way ANOVA; ns no
  significance, * p < 0.03; Šídák’s multiple comparisons. (D) One-way ANOVA; ** p
  < 0.002, *** p < 0.0002; Tukey’s multiple comparisons. (E) t-test; **** p < 0.0001;
  unpaired, two-tailed. (F) One sample t-test; * p < 0.03, two-tailed. (G) t-test;
  * p < 0.03; unpaired, two-tailed. (H) Two-way ANOVA; ns no significance, * p < 0.03,
  ** p < 0.002; Tukey’s multiple comparisons'
