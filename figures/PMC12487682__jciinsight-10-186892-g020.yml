figure_title: LIPUS treats CKD by regulating the tubular IL-1R signaling pathway
caption: '(A) Study protocol. (B) Serum Cr levels in Pepck-Cre+ Il1r1fl/fl (KO) mice.
  (n = 12 in WT-IR group of Pepck-Cre– Il1r1fl/fl mice, and n = 7 in other groups
  of Pepck-Cre+ Il1r1fl/fl mice.) (C) Tubular injury and tubulointerstitial fibrosis
  scores in Pepck-Cre+ Il1r1fl/fl mice and representative pathological visualizations.
  Scale bar: 50 μm. (n = 5–10.) (D) Protein levels of α-SMA, fibronectin, p-NF-κB,
  and c-Myc in renal tissues and the quantitative analyses (n = 5). (E) The mRNA expressions
  of Havcr1 and Lcn2 in renal tissues (n = 3). Data information: Data are presented
  as mean ± SD, with significance determined by 1-way ANOVA with Tukey’s post hoc
  test. **P < 0.01, ***P < 0.001, ****P < 0.0001'
