figure_title: PSN-induced activation of the p53 signalling pathway and its crosstalk
  with mTOR, PI3K/AKT, NF-kB, and MAPK pathways (Created in BioRender.
caption: PSN-induced activation of the p53 signalling pathway and its crosstalk with
  mTOR, PI3K/AKT, NF-kB, and MAPK pathways (Created in BioRender. Patel, T. (2025)
  https://BioRender.com/dwxczus). This schematic diagram illustrates the potential
  p53 signalling pathway in response to PSN-induced oxidative stress and DNA damage.
  Oxidative stress from PSNs activates JNK and p38 MAPK pathways, which phosphorylate
  p53, enhancing its transcriptional activity. Simultaneously, DNA damage triggers
  ATM/ATR kinases, leading to CHK1/CHK2 phosphorylation and p53 stabilization. Once
  activated, p53 regulates multiple cellular outcomes, including cell cycle arrest,
  apoptosis, senescence, and DNA repair. Cell cycle arrest occurs through p21 (CDKN1A)
  upregulation, which inhibits CDK2, and Cyclin E, preventing G1/S transition. DNA
  damage activates p16INK4a/RB pathway, while p53-induced DNA repair is facilitated
  via DRAM-1-mediated lysosomal activation. If the damage is irreparable, p53 induces
  apoptosis by upregulating pro-apoptotic genes (NOXA, BAD, PUMA, BAX, and BAK), leading
  to MOMP, cytochrome c release, and activation of caspase 9 and caspase 3. Additionally,
  p53 interacts with mTOR signalling, where Sestrin 2 activates AMPK, inhibiting mTOR
  (via TSC1/2) and autophagy. The PI3K/AKT pathway antagonizes p53 by activating MDM2,
  leading to p53 degradation, while also promoting cell survival and proliferation.
  Furthermore, AKT activation stimulates NF-kB, enhancing inflammatory responses and
  counteracting p53-mediated apoptosis. This intricate interplay between p53 and other
  pathways determines cellular fate, balancing repair, survival, or cell death in
  response to PSN exposure
