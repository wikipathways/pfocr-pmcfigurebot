figure_title: Genes associated with autophagy and inflammation, validated by RT-qPCR
  and Western blot, exhibit distinct expression patterns in the hippocampus and somatosensory
  cortex of Becn1F121A/F121A (BMut) mice 10 weeks after SCI.
caption: Genes associated with autophagy and inflammation, validated by RT-qPCR and
  Western blot, exhibit distinct expression patterns in the hippocampus and somatosensory
  cortex of Becn1F121A/F121A (BMut) mice 10 weeks after SCI. (A-B) After normalization
  to the respective sham controls, differential gene expressions in autophagy and
  inflammation pathways derived from RNA-seq dataset in hippocampus were compared
  between BMut/SCI and WT/SCI groups. (C-E) Western blot analysis of protein expression
  in the hippocampus for SQSTM(p62) and LC3-I/II. (F-G) Distinct gene expression patterns
  to SCI associated with autophagy and neuroinflammation were validated in the somatosensory
  cortex. (H-J) The protein expressions of p62 and LC3-I/II were analyzed by Western
  blot with GAPDH and Actin as loading control, respectively. n = 5 mice per group
  for (A-B) and (F-G); statistical analysis was performed using Welch’s t tests. n
  = 6 mice per Sham group and 5 per SCI group for (C-E) and (H-J); data were analyzed
  using two-way ANOVA followed by post hoc Tukey’s multiple comparison tests. *p <
  0.05; **p < 0.01; ***p < 0.001; ****p < 0.0001
article_title: Autophagy activation by the Becn1F121A mutation reprograms neuroinflammation
  and promotes neurological recovery after spinal cord injury
