figure_title: Functional classification of differentially expressed genes in the hypothalamus
  of largemouth bass after crowding stress.
caption: Functional classification of differentially expressed genes in the hypothalamus
  of largemouth bass after crowding stress. (A) Volcano plot of differentially expressed
  genes and top 20 KEGG pathways enrichment based on up-regulated/down-regulated differential-expressed
  genes in the hypothalamus between low- and high-density groups; (B) gene ontology
  (GO) enrichment analysis based on upregulated differential-expressed genes in the
  hypothalamus between low- and high-density groups; (C) gene ontology (GO) enrichment
  analysis based on downregulated differential-expressed genes in the hypothalamus
  between low- and high-density groups. Up, up-regulated differentially expressed
  genes (labeled with red upward arrow). Down, down-regulated differentially expressed
  genes (labeled with green downward arrow). BP, biological process. CC, cellular
  component. MF, molecular function. Top 10 GO terms in each of three groups have
  been listed in (B,C)
