figure_title: Schematic Diagram of ROS Sources, Immunological Roles, and Disease-Associated
  Pathways.
caption: Schematic Diagram of ROS Sources, Immunological Roles, and Disease-Associated
  Pathways. This figure illustrates the mechanistic role of ROS in immunity and disease
  pathogenesis. ROS may originate from the cytosol (Cyto-ROS), mitochondria (MitoROS),
  peroxisomes (PeroxROS), or endoplasmic reticulum (ER-ROS), and include species such
  as superoxide anion (O2−). On one hand, ROS upregulate NLRP3 to promote IL-1β release,
  which is linked to inflammatory diseases. They also contribute to atherosclerosis
  via endothelial dysfunction, diabetes via β-cell damage, and stroke via neuronal
  death. On the other hand, dysregulated NOX activity (CGD) increases infection risk;
  altered ROS levels (in ESRD) impair natural killer (NK) cell cytotoxicity via the
  NKG2D-MIC axis, which can be modulated by catalase. Additionally, ROS participate
  in immune processes such as T-cell proliferation (via the TCR pathway). Created
  with BioGDP.com [16]
