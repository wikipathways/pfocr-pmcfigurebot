figure_title: Timeline of response strategies during a novel viral outbreak, from
  identification to disease control.
caption: Timeline of response strategies during a novel viral outbreak, from identification
  to disease control. The initial response prioritizes public health interventions,
  such as social distancing, masking, and contact tracing, which act as the first
  line of defense to slow transmission and buy time for therapeutic development. The
  proactive therapeutic pathway represents efforts to test and evaluate potential
  antiviral drugs before or early in an outbreak, allowing faster deployment of FDA
  emergency-use medicines and reducing morbidity and mortality. The reactive therapeutic
  pathway illustrates the typical sequence where therapeutic evaluation and drug deployment
  occur after the outbreak has escalated, highlighting delays in controlling disease
  progression. Vaccination rollout, shown as a later-stage intervention, ultimately
  contributes to durable population immunity. The figure was prepared using Microsoft
  PowerPoint with icons adapted from Flaticon (www.flaticon.com) (accessed on 1 September
  2025)
