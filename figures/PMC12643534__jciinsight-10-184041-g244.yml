figure_title: S2808D-RyR2–mediated calcium leak alters proteins in synaptosomes
caption: (A) Schematic paradigm of experimental design. Synaptosomes from the frontal
  cortex and hippocampus were enriched from 3-month-old male WT and S2808D-RyR2 mice
  (n = 3 per group) and analyzed using LC-MS/MS. (B) Immunoblot image validating enrichment
  for synaptic proteins in the synaptosome suspension using Syn-PER reagent. NMDAR2B
  and PSD95 are postsynaptic proteins, while synaptophysin is a presynaptic protein.
  GAPDH is a cytosolic protein. (C and D) Volcano plots highlighting the proteins
  most enriched (red circles) in WT (negative log2[fold change]) and S2808D-RyR2 (positive
  log2[fold change]) synaptosomes in frontal cortex (C) and hippocampus (D) compared
  with WT. The horizontal dotted lines on the volcano plots signify an α of 1.3, or
  a P value of 0.05. The top 10 altered canonical pathways using the proteomic data
  sets as derived by Ingenuity Pathway Analysis (IPA) are represented by bar charts
  adjacent to each volcano plot. SYN, synaptosome; CYT, cytosol fraction; HOM, homogenate
