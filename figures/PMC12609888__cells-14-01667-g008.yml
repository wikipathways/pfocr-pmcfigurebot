caption: Kaplan–Meier survival plots of galactose pathway gene expression correlated
  with breast cancer patient survival. Blue line is over-expression, orange line is
  under-expression. Shaded regions around lines indicate confidence intervals. Over-expression
  of both GALK1 (on left) and UGP2 (on right) is significantly associated with worse
  patient prognosis (p < 0.05)
