figure_title: Therapeutic potential of ferroptosis in post-TBI cognitive impairment.
caption: 'Therapeutic potential of ferroptosis in post-TBI cognitive impairment. Ferroptosis
  proceeds through two primary mechanisms: (1) dysregulated iron metabolism via TF/TfR,
  leading to Fe2+ accumulation and Fenton reaction-mediated lipid peroxidation, and
  (2) impaired system Xc−-GSH-GPX4 antioxidant axis, resulting in unchecked lipid
  peroxide accumulation. Therapeutic strategies to inhibit ferroptosis and improve
  cognitive function include modulation of iron metabolism (via moderate intensity
  of treadmill exercise, asiatic acid (AA), or Ruxolitinib, which inhibit transferrin
  receptor and upregulate GPX4); activation of system Xc− (via AMP through the miR-128-3p/SLC7A11
  axis, intermittent fasting and median nerve stimulation (MNS), or Fisetin by upregulating
  SLC7A11 and GPX4); enhancement of the GPX4 axis (via Netrin-1 activating the UNC5B/Nrf2/GPX4
  pathway or METTL3); and suppression of lipid peroxidation (via Prokineticin-2 and
  TNFAIP3, which inhibit ACSL4/3 to reduce lipid peroxides)'
