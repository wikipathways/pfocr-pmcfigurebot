figure_title: Proteomic profiling of TBCK-deficient fibroblasts reveals dysregulation
  of RNA splicing and other disease-relevant pathways –
caption: A) Principal Component Analysis (PCA) of proteomic data from TBCK−/− fibroblasts
  and controls (n = 3 per group), showing distinct clustering by condition. B) Heatmap
  of protein abundance with unsupervised hierarchical clustering, illustrating consistent
  intra-group similarity and inter-group separation. Color scale represents relative
  protein expression. C) Gene ontology enrichment analysis of dysregulated proteins,
  highlighting pathways related to RNA splicing, ribosome biogenesis, and mitochondrial
  function. Circle size reflects gene count; color indicates adjusted p-value. D)
  Ingenuity Pathway Analysis (IPA) of proteomic data identifying top dysregulated
  canonical pathways in TBCK-deficient cells. E) Upstream regulators predicted by
  IPA to be altered in TBCK−/− samples, ranked by p-value. Regulators shown have known
  roles in transcriptional and post-transcriptional control. F) Summary of molecular
  and cellular functions impacted by TBCK loss, based on IPA categorization. p-value
  ranges reflect the statistical significance of the observed functional disruptions
