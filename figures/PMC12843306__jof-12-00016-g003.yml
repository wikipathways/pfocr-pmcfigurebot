caption: Transcriptomic analysis of P. destructans in response to PCA treatment. (A)
  Principal component analysis of gene expression in P. destructans treated with PCA.
  (B) MA plot of DEGs, with 966 genes downregulated and 281 upregulated. (C) Circular
  plot of GO enrichment analysis. The outer circle displays the top 20 GO terms; the
  middle circle indicates the number of background genes and the enrichment p-value;
  the inner circle represents the numbers of DEGs. (D) KEGG enrichment analysis of
  all significantly enriched pathways. (E) GSEA results based on KEGG pathway data.
  (F) Gene interaction network of selected KEGG pathways
