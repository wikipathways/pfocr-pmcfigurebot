figure_title: Dynamic Feature Refinement (DFR) module architecture.
caption: 'Dynamic Feature Refinement (DFR) module architecture. The module processes
  routed features through two parallel attention branches: (1) Channel Attention Pathway
  employing squeeze-excitation with GAP → 7 × 7 convolution (2048 → 128 → 2048) →
  sigmoid activation to learn inter-channel dependencies; (2) Spatial Attention Pathway
  using max/avg pooling aggregation → 7 × 7 convolution → sigmoid to identify discriminative
  spatial regions. Both pathways are combined with the original features through residual
  connections, producing refined features Frefined that suppress background interference
  while highlighting pest-discriminative patterns'
