caption: 'The changes in the palmitoylated CD36 ratio and the CD36 degradation-recycling
  pathway in HPCs under HG. A-C. Podocytes were transfected with empty vector or APT1
  plasmid, then incubated with or without 30 mM high glucose for 24 hours. The level
  of palmitoylated CD36 in podocytes by IP-ABE and Western blot methods (A); the amount
  of membrane-associated CD36 in podocytes (B) in each group, and semiquantitative
  analysis (C). (*<0.05, **<0.01). D-F. Confocal microscopy images of CD36 and lamp1
  (D), CD36 and Rab7a (E), CD36 and Rab11a (F) in each group: CON, HG, OE-APT1. (scale
  bar: 40 μm). G-I. The respective Pearsonʼs correlation coefficients. (**<0.01)'
