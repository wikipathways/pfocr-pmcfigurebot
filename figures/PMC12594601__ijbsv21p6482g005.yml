figure_title: BMAL1 deletion inhibited the p38MAPK pathway and reduced GR-Ser211 phosphorylation
  in HBECs.
caption: BMAL1 deletion inhibited the p38MAPK pathway and reduced GR-Ser211 phosphorylation
  in HBECs. (A) PhosphoSitePlus prediction suggested the phosphorylation site of GR.
  (B-C) Western blotting and immunofluorescence revealed the phosphorylation of GR-Ser211
  in HBECs (scale bar =10 μm). (D) GPS6.0 predicted the potential kinases that affect
  GR-Ser211 phosphorylation. (E) Sequencing data revealed downregulation of the MAPK
  pathway. (F-G) The protein expression of p-p38MAPK in HBECs was measured by western
  blotting and immunofluorescence (scale bar =10 μm). *P<0.05, **P<0.01, ****P<0.0001
article_title: Disruption of the Clock Component BMAL1 in HDM-induced Asthma Causes
  GC Resistance in Airway Epithelial Cells by Regulating GR Phosphorylation through
  the DUSP4-p38MAPK Pathway
