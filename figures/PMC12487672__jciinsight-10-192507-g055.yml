figure_title: Altered lipid profiles in the epidermis and plasma of Spry1ΔEpi mice
caption: (A) PCA showing distinct clustering of lipidomic profiles in the epidermis
  and plasma between Spry1ΔEpi and WT mice. (B) Heatmap highlighting altered lipid
  classes, including DG, TG, ceramides, phospholipids, and lysophospholipids, in Spry1ΔEpi
  epidermis. (C) Volcano plot identifying 417 significantly upregulated and 369 significantly
  downregulated lipid species in Spry1ΔEpi epidermis. (D) Proportional analysis verifying
  widespread lipid alterations in Spry1ΔEpi epidermis. (E) KEGG pathway enrichment
  analysis that identifies disruptions in glyceride, glycerophospholipid, and sphingolipid
  metabolism in Spry1ΔEpi epidermis. (F) Heatmap of MG, DG, and TG showing notable
  differences in Spry1ΔEpi epidermis compared with WT. (G) Quantitative analysis revealing
  TG reduction and DG elevation in Spry1ΔEpi mice. (H and I) FA profiling that demonstrates
  altered proportions of saturated and unsaturated fatty acids in Spry1ΔEpi mice.
  For lipid profiling, n = 4 mice per genotype
article_title: DGAT2 reduction and lipid dysregulation drive psoriasis development
