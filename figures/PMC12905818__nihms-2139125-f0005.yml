figure_title: 'Conceptual framework: from early adversity to psychopathology'
caption: Representation of hypothesized pathways linking adversity, neurobiological
  changes and psychopathology outcomes. Multiple features (type, context, chronicity
  and severity) of the multiplicity of types of early-life adversity that can be experienced
  by an individual may also be moderated by individual genetic differences and epigenetic
  changes, as well as cultural norms and values. In turn, these exposures can cause
  varying changes in select brain regions that comprise key brain networks including
  the default mode network (DMN), salience network (SN), frontoparietal network (FPN)
  or frontoparietal control network (FCN), and ventral attention network (VAN). Subsequent
  alterations to connectivity patterns within and/or between these networks could,
  thus, provide the pathway in which early-life adversity-driven brain changes heighten
  risk for the development of psychopathology. The hypothesized trajectory by which
  adversity-driven brain changes can lead to psychopathology disorders is depicted,
  with pathways to resilience shown at each step. Importantly, these relations among
  adversity, network changes and psychopathology can be moderated by the timing of
  neurodevelopmental processes and sensitive periods
article_title: Early adversity alters brain architecture and increases susceptibility
  to mental health disorders
