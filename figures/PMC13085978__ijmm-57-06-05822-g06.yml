figure_title: Mechanism by which AS-IV regulates proliferation and apoptosis in pituitary
  tumors by targeting TUBB4B.
caption: Mechanism by which AS-IV regulates proliferation and apoptosis in pituitary
  tumors by targeting TUBB4B. AS-IV is chemically purified from the Chinese herbal
  medicine Astragalus membranaceus. AS-IV interacts with pituitary tumor cells by
  specifically binding TUBB4B, resulting in the formation of a TUBB4B-AS-IV complex.
  This complex formation decreases cytoskeletal stability while suppressing the expression
  of the downstream pathway protein STMN1 and its phosphorylation. Additionally, it
  inhibits the activation of the positive feedback loop of the ERK pathway, suppressing
  pituitary tumor proliferation and promoting apoptosis. AS-IV, astragaloside IV;
  TUBB4B, tubulin beta 4B class IVb; cPLA, cytosolic phospholipase A; STMN1, stathmin
  1; CCN, cyclin
article_title: Astragaloside IV targets TUBB4B to inhibit proliferation and promote
  apoptosis of pituitary tumor cells via the STMN1/ERK pathway
