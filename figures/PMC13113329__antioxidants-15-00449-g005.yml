figure_title: Integrative network analysis reveals potential targets of Chi.
caption: 'Integrative network analysis reveals potential targets of Chi. (A) Construction
  of the drug–disease–target network based on public databases. Different colors represent
  different levels of importance within the network, with highlighted targets indicating
  the core components. (B) GO enrichment analysis of the 99 targets with degree values
  above the mean. (C) KEGG pathway enrichment analysis of the 99 targets with degree
  values above the mean. (D) Expression and distribution of the 99 overlapping DEGs
  in the cornea. Upper: heatmap showing the 99 overlapped DEGs in alkali-burned corneas.
  Lower: dot plot showing the gene expression level and distribution in different
  corneal cells. The single-cell transcriptome data were downloaded from the GEO database:
  GSE199013. The color scale shows the average expression of each gene in each cell
  cluster, with darker colors indicating higher expression. Immune: Immune cells;
  Epi-TA: Corneal epithelium transit amplifying cells; Endo: Corneal endothelium cells;
  Epi-Sup: Corneal superficial epithelium cells; Fibro: Corneal fibroblasts; Epi-Wing:
  Corneal wing epithelium cells; Epi-Basal: Corneal basal epithelium cells'
