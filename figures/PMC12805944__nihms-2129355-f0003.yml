figure_title: (a) Activation of the JAK-STAT pathway in plasmatocytes potentiates
  an immunosurveillant state in which plasmatocytes can distinguish self-tissue from
  parasitoid egg.
caption: '(a) Activation of the JAK-STAT pathway in plasmatocytes potentiates an immunosurveillant
  state in which plasmatocytes can distinguish self-tissue from parasitoid egg. This
  occurs via sensing and responding to PAMPs and suppressing immunity in response
  to sensing SAMPs including N-glycosylated ECM proteins. This results in plasmatocyte
  capsule formation around the parasitoid egg and protects self-tissue from immune
  damage. (b) Lamellocytes form an external capsule around the plasmatocyte inner
  cell layer. The lamellocytes produce melanin, leading to capsule melanization followed
  by capsule consolidation and pathogen killing. Abbreviations: ECM, extracellular
  matrix; JAK-STAT, Janus kinase–signal transducer and activator of transcription;
  PAMP, pathogen-associated molecular pattern; SAMP, self-associated molecular pattern;
  UPD, unpaired. Figure adapted from images created in BioRender; Mortimer, N. 2025,
  https://BioRender.com/7jb86sn'
