figure_title: Pea sprout extract stimulates the hair growth-related gene expression
caption: Cellular and molecular responses of hDPCs after 24-h treatment with PSE and
  MNX. (A) Viability of the hDPCs was measured after treatments with MNX (1 μg/ml)
  and PSE (10 and 50 μg/ml) using the WST-8 assay. (B) Relative mRNA expression levels
  of β-catenin pathway–related genes including β-catenin, and VEGF were measured after
  treatments with MNX (1 μg/ml) and PSE (10, 50 μg/ml) using a qPCR. (C) Relative
  mRNA expression levels of hair growth–promoting factors including IGF-1 and FGF7
  were treated with MNX (1 ug/ml) and PSE (10, 50 μg/ml) using a qPCR. (D) Relative
  mRNA expression levels of hair growth–inhibiting factors such as BMP4, and TGFβ2
  were treated with MNX (1 ug/ml) and PSE (10, 50 μg/ml) using a qPCR. n = 3. The
  results are presented as the mean ± SD. Statistical analyses were performed using
  one-way ANOVA followed by Tukey’s post hoc test. *P < 0.05, ** P < 0.01, *** P <
  0.001, **** P < 0.0001 vs Control
