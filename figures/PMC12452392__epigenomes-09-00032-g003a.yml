caption: Heat maps of the differentially methylated CpG sites before and (A) 3 months,
  (B) 6 months, (C) 9–31 months, and (D) 2 years after metabolic/bariatric surgery
  with the summary of selected genes and pathways where the methylation occurred.
  Data for (A) were obtained from two articles [14,15], for (B) from two articles
  [16,17], for (C) from one article [18], and for (D) from one article [12]. The columns
  of the heat map represent pre- and post-surgery methylation changes, and the rows
  represent CpG sites. Tables below each heat map represent all revealed genes (A,B)
  or pathways with the highest number of methylation changes and associated genes
  found in the selected pathways (C,D)
