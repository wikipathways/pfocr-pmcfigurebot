figure_title: Developmental changes and cell-type specificity of astrocyte regional
  heterogeneity over postnatal development in the marmoset
caption: A, Integrated UMAP embeddings of 103,009 marmoset astrocytes colored by (i)
  assigned brain region (one-hot color encoded in (iv)), (ii) developmental time point
  (one-hot color encoded in (v), and (iii) Leiden cluster assignment. B, Expression
  heatmaps (rows are cells, columns are genes) of regional differentially expressed
  genes (rDEGs) between astrocytes from cortex, striatum, and thalamus at (i) GD135,
  (ii) 7 month, and (iii) 30 month-old marmosets in log counts per million (logCPM).
  The raster plots beneath each heatmap indicate the time point and region(s) of upregulation
  for each rDEG. rDEGs are ordered (same order in (i-iii)) first by time point, then
  by region of highest expression, and are plotted more than once if they are present
  at more than one time point. Striatal astrocytes are ordered by subtype identity
  (see Methods). C, UpSet plot showing the number of unique and overlapping cortex-thalamus
  rDEGs between developmental time points. The colored dots below each vertical bar
  indicate which age(s) share that set of rDEGs, while the colored horizontal bars
  indicate the total number of cortex-thalamus rDEGs for each age. Overlap categories
  with 0 rDEGs are not shown. D, UpSet plot (as in (C)) showing the number of overlapping
  cortex-thalamus rDEGs between OPCs, astrocytes, excitatory neurons, and inhibitory
  neurons for (i) neonate and (ii) adult marmoset. E, Gene ontology (GO) and pathway
  analysis on cortex-thalamus (enriched in either region) astrocyte rDEGs via WebGestalt
  2024 in (i) GD135, (ii) 7 month, and (iii) 30 month marmoset astrocytes. Lollipop
  plots show the enrichment ratio of GO Biological Process and KEGG pathways from
  an over-representation analysis, with tip size inversely proportional to the false
  discovery rate (FDR). See also Figs. S7–9 and Fig. S12
