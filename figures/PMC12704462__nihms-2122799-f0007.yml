figure_title: STRING analysis predicted significant protein-protein interactions in
  lumbosacral DRG associated with visceral hypersensitivity.
caption: STRING analysis predicted significant protein-protein interactions in lumbosacral
  DRG associated with visceral hypersensitivity. (A) STRING analysis was performed
  based on DEG list generated in Partek (p<0.05, >±1.5 fold-changes). (B) In lumbosacral
  DRG in both sexes of mice, Sfrp4 and Angptl4 proteins were dysregulated following
  VEGF instillations. These proteins were found to interact with a key Wnt signaling
  protein beta-catenin and PPARγ signaling protein. (C) During VEGF-induced visceral
  hypersensitivity, male DRG showed decreased expression of Cck, Penk, Agt, Grm3,
  Drd2, Ntsr2, Serpine1, and PPARγ, as well as increased expression of Nts, which
  suggest the dysregulation of pain processing signaling pathway. (D) During VEGF-induced
  visceral hypersensitivity, female DRG showed changes in proteins responsible for
  chemotaxis, differentiation, and activation of peripheral immune cells like Ifi47,
  aif1, Cxcr5, Socs1, Stat1, and Irf7, indicating immune resolution. Color of the
  circles in (b)-(D) were assigned randomly in STRING and do not code any information.
  The colored lines connecting protein names represents the associations between connected
  proteins
