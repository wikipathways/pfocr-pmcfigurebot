caption: 'HuMSC-Exos activated the Nrf2 signaling pathway, upregulated antioxidant
  gene expression, and attenuated inflammation in UVB-irradiated mouse skin. (A, B)
  Western blot analysis and grayscale quantification of Keap1, Nrf2, and HO-1 expression
  in mouse skin after different treatments (n = 3/group). (C) RT-qPCR detection of
  antioxidant genes Cat, Nqo1, and Sod2 in skin tissues (n = 3/group). (D–F) RT-qPCR
  and immunohistochemical analysis of IL-1β, TNF-α, and IL-6 expression, with quantitative
  optical density measurements (n = 4/group; scale bar: 100 μm). (ns: nonsignificant,
  ⁣∗p < 0.05, ⁣∗∗p < 0.01, ⁣∗∗∗p < 0.001, ⁣∗∗∗∗p < 0.0001)'
