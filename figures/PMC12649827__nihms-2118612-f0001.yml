figure_title: Pulmonary EC dysregulation in PH
caption: EC dysregulation in PH has been extensively reviewed elsewhere1,6,38. Briefly,
  environmental stressors, mechanical forces, and genetic perturbations activate abnormal
  inflammatory, metabolic, and epigenetic responses in AECs. These changes promote
  a proliferative, anti-apoptotic, and EndoMT phenotype that contributes to vascular
  remodeling in PH. Hypoxia induces autophagy in capillary (Cap) ECs while promoting
  AEC proliferation, resulting in AECs replacement of Cap ECs during vascular remodeling.
  General Cap cells (gCaps or Cap1) have also been reported to reprogram into AECs
  in SuHx and Egln1-deficient mouse model, a process regulated by the HIF-2α/Notch4
  axis. By contrast, intratracheal delivery of adeno-associated virus-Nr2f2 promotes
  gCaps differentiation into EphB4+ PVECs, suppressing angiogenesis and vascular development,
  thereby mitigating SuHx-induced PH in mouse models. In ACDMPV-PH, FOXF1 deficiency
  impairs gCap differentiation into aCap (Cap2) and compromises aCap survival through
  reduced VEGFA-KDR signaling. In pulmonary veins, group 2 PH is associated with elevated
  shear stress that activates Rho/Rho-kinase and EndoMT signaling pathways, disrupting
  PVECs tight junctions and promoting vascular remodeling. SVECs may serve as a compensatory
  contributor to pulmonary perfusion under obstructed conditions in PH. The solid
  lines represent causal connections, while the dotted lines indicate potential connections.
  The arrows leading to the panel borders suggest that the pathway contributes to
  the development of PH
