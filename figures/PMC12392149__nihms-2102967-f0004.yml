figure_title: Schematic representation of FGF16 signaling pathways via FGFR1c
caption: 'Under pathological conditions, FGF16 protects the heart against acute doxorubicin-induced
  cardiac dysfunction via FGFR1-mediated activation of PKC and mitigates diabetes-induced
  cardiac apoptosis, fibrosis, and inflammation through FGFR1-dependent phosphorylation
  of the PI3K/AKT/GSK-3β pathway. Conversely, under physiological conditions, FGF16
  competes with FGF2 for binding to FGFR1c in neonatal cardiomyocytes, thereby inhibiting
  downstream activation of the ERK and PKC-α/ε signaling pathways. This interference
  reduces the expression of cell-cycle proteins such as Cyclin F and Ki67, ultimately
  suppressing FGF2-induced cardiomyocyte proliferation. Moreover, under pathological
  conditions, this competitive inhibition of FGFR1c by FGF16 also counteracts FGF2-induced
  cardiomyocyte hypertrophy and cardiac fibroblast activation by downregulating TGF-β1
  signaling. In addition, FGF16 secreted by cardiomyocytes modulates fibroblast activity,
  attenuating their pathological activation and fibrotic responses, thereby contributing
  to the overall regulation of cardiac remodeling. Abbreviations: PI3K: Phosphoinositide
  3-kinase; Akt: Protein kinase B; PKC: Protein kinase C; ERK: Extracellular signal-regulated
  kinase'
