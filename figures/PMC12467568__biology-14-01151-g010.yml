figure_title: Differential expression in signalling pathways in luminal A subtype.
caption: Differential expression in signalling pathways in luminal A subtype. Several
  signalling pathways are differentially expressed in the Luminal A subtype, with
  prognostic implications based on the WWOX/HIF1A ratio. Good prognosis tumours predominantly
  show enrichment in ECM receptor, TNF, JAK-STAT, and PI3K-AKT signalling pathways.
  In contrast, poor-prognosis tumours are associated with upregulation of cell cycle
  and genomic damage pathways. Yellow indicates good prognosis, pink signifies poor
  prognosis, and green indicates genes with unchanged expression
