figure_title: Prx2 released from red blood cells after a hemorrhagic stroke causes
  brain injury via multiple pathways.
caption: Prx2 released from red blood cells after a hemorrhagic stroke causes brain
  injury via multiple pathways. Complement C3 is a key upstream regulator of Prx2
  release. Prx2 strongly induces LCN2 expression in neutrophils and astrocytes, activates
  microglia, and enhances IL-1β and IL-6 production via the TLR4/MyD88/NF-κB pathway.
  Inhibiting Prx2 worsens outcomes by increasing oxidative stress and apoptosis through
  the H2O2–ASK1/p38 pathway. Prx2 leads to brain swelling, neuronal death, inflammation,
  and behavioral deficits, which are attenuated by Conoidin A and TAK242. It also
  increases macrophages, T cells, and neutrophils in the choroid plexus, causing ependymal
  damage and hydrocephalus—effects reduced by Conoidin A, minocycline, and clodronate
  liposomes
