figure_title: 'Diagrammatic depiction of the mTORC1 signaling route: Growth factors,
  amino acids, glucose, and glutamine from the extracellular environment all interact
  with cell membrane through specific receptors present on them, these factors directly
  or indirectly activate the mTORC1. When glucose levels are abundant, it leads rise
  in the production of ATP (adenosine triphosphate). Increased ATP levels inform mTORC1
  that enough energy is available for protein synthesis and cell growth. Glucose indirectly
  influences mTORC1 through insulin. When blood glucose levels rise, the pancreas
  releases insulin, triggering the PI3K-Akt pathway, which then influences mTORC1.When
  growth factors adhere to their receptors, a chain of signaling events is initiated
  that activates ERK1/2 (Extracellular Signal-Regulated Kinase 1/2), RSK1 (p90 Ribosomal
  S6 Kinase 1), and PI3K (phosphoinositide 3-kinase) triggering a signaling cascade.
  This process results in the activation of Akt (Protein Kinase B). Akt phosphorylates
  and blocks PRAS40 (a 40 kDa proline-rich Akt substrate). As a result of this action,
  PRAS40 detaches from mTORC1 and reduces its ability to inhibit mTORC1 activity.
  ERK1/2 and RSK1-mediated phosphorylation of the tuberous sclerosis complex (TSC2)
  can inhibit the TSC1-TSC2 complex''s suppressive effect on mTORC1, thereby promoting
  mTORC1 activation. DDIT4 released or activated in response to hypoxia. DDIT4 (DNA
  damage-inducible transcript 4) inhibit TSC1-TSC2 complexes, resulting in the activation
  of mTORC1. When amino acids enter the cell, they activate heterodimeric complexes
  composed of RagA/B paired with GTP and RagC/D paired with GDP. On the lysosomal
  surface, Rag GTPases interact with another protein called Rheb (Ras homolog enriched
  in brain). this process results in the activation of Rheb, which subsequently activates
  mTORC1. Once activated, mTORC1 triggers key signaling molecules like S6K1 (Ribosomal
  S6 kinase 1), 4E-BP1 (Eukaryotic translation initiation factor 4E (eIF4E)-binding
  protein 1), ULK1 (Unc-51-like autophagy-activating kinases 1), PPAR-γ (Peroxisome
  proliferator-activated receptor gamma), and SREBP-1 (Sterol Regulatory Element-binding
  Protein-1)'
