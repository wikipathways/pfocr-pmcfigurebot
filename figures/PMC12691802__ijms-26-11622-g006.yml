figure_title: Simplified diagram of the PI3K/AKT pathway.
caption: Simplified diagram of the PI3K/AKT pathway. Activation of PI3K kinase first
  leads to the phosphorylation of PIP2 and then AKT. Activated AKT phosphorylates
  a broad spectrum of substrates, including p27, FOXO, and BAD, involved in cell cycle
  progression and apoptosis. Furthermore, it also stimulates mTORC1 signaling, which
  stimulates protein and lipid synthesis in cells. PI3K activity can be inhibited
  by the dephosphorylating action of PTEN. The arrow and line indicate a stimulating
  effect. The lines ending with perpendicular bars indicate an inhibition
