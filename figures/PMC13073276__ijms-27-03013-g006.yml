caption: Analysis of key metabolic pathways involving differential metabolites, proteins,
  and genes in strong-gluten wheat grains under salt stress. Blue font represents
  differential expression metabolites, red font represents differential expression
  proteins, and green font represents differential expression genes. In the two panels,
  the left panel displays the Log2FC of metabolites/proteins/genes in the control
  group, while the right panel presents their Log2FC under salt stress treatment.
  The transparent colors in the left panel correspond to the Log2FC values of the
  control group, whereas the colors in the right panel reflect the Log2FC values under
  salt stress. Redder hues indicate a greater upregulation of metabolites/proteins/genes
  under salt stress relative to the control group, while bluer hues denote a greater
  downregulation
