figure_title: Cooperative mechanisms by which aflatoxin B1 (AFB1) and chronic hepatitis
  B virus (HBV) infection promote hepatocellular carcinoma (HCC) through p53 pathway
  disruption.
caption: Cooperative mechanisms by which aflatoxin B1 (AFB1) and chronic hepatitis
  B virus (HBV) infection promote hepatocellular carcinoma (HCC) through p53 pathway
  disruption. AFB1 is metabolically activated in the liver and induces the hotspot
  TP53 R249S mutation, resulting in p53 downregulation. This loss of p53 function
  contributes to cellular stress and pro-fibrotic signaling, leading to fibrosis.
  Independently, chronic HBV infection integrates into the host genome and expresses
  the HBx protein, which functionally suppresses p53 and activates oncogenic signaling
  pathways including PI3K/Akt, Wnt/β-catenin, Ras/MAPK, and NF-κB. These signals promote
  chronic inflammation and further impair apoptosis and cell cycle regulation. The
  combined effects converge on the disruption of the p53 axis and cellular survival
  pathways, facilitating the pathological progression from fibrosis to cirrhosis and
  ultimately HCC
article_title: Cooperation Between Aflatoxin-Induced p53 Aberrations and Hepatitis
