figure_title: PIC increases expression of antiviral interferon signaling proteins
  and alters excitation-contraction coupling in human ventricular and sinoatrial nodal
  myocytes
caption: '(A) Activation of interferon signaling pathway proteins in hiPSC-CM with
  PIC treatment (200 µg/mL for 72 hours). Left panel: Western blot; right panels:
  quantification of proteins after normalizing to total protein. (n = 3; unpaired
  2-tailed t test.) (B) Field potential durations in hiPSC ventricular myocytes were
  significantly increased by 24 hours after PIC treatment (n = 11 for control and
  n = 12 for PIC treated; 2-way repeated measures ANOVA with Holm-Šídák’s multiple-comparison
  test for panels B and D). Multielectrode array measurements were taken at the indicated
  times before and after treatment. (C) Left: Ca2+ transient peak amplitudes were
  significantly reduced 5 days after PIC treatment in monolayers of hiPSC-CM (data
  points represent 20–30 replicates from 3 independent experiments; a nested analysis
  with Mann-Whitney 2-tailed test was used). Right: Ca2+ transient recordings in PIC-treated
  (red trace) and control (black trace) monolayers. (D) In hiPSC-CM atrial/sinoatrial
  nodal cell monolayers, RR intervals significantly increased 96 hours after PIC treatment
  (n = 6,6). IRF3, interferon response factor 3; pIRF3, phosphorylated IRF3; IFN-β1,
  interferon β1; Stat1, signal transducer and activator of transcription 1; pStat1,
  phosphorylated Stat1; OAS1, 2′-5′-oligoadenylate synthase 1; MX1, MX dynamin like
  GTPase 1; IRF9, interferon response factor 9'
