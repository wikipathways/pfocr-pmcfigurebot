figure_title: Effect of CDL-95EE on Nrf2 pathway activation and epigenetic modifications
  in JB6 P+ cells.
caption: Effect of CDL-95EE on Nrf2 pathway activation and epigenetic modifications
  in JB6 P+ cells. (A,B) Western blot analysis of Nrf2 pathway-related antioxidant
  and detoxification enzymes (HO-1, UGT1A1, NQO1) and epigenetic regulators (DNMTs,
  HDACs) following CDL-95EE treatment, respectively. Representative Western blots
  for each protein and the corresponding β-actin loading control from the same experiment
  are shown. (C) Quantitative analysis of mRNA expression levels of HO-1, UGT1A1,
  and NQO1 normalized to β-actin. (D) Quantitative methylation-specific PCR (qMSP)
  analysis of Nrf2 promoter unmethylation levels after treatment with CDL-95EE. Data
  are expressed as mean ± SD (n = 3). Data with different letters (a, b, c) indicate
  statistically significant differences between groups (p < 0.05)
