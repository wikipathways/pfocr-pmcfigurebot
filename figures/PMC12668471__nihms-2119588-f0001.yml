caption: RSPO3 binds to LGR4 and potentiates Wnt/β-catenin signaling through Frizzled
  receptors. RSPO3-LGR4 binding promotes ZNRF3/RNF43 autoubiquitination and membrane
  clearance. Once the ligases are removed from the membrane, more Wnt ligands become
  available to Frizzled receptors, which enhance the signaling pathway of β-catenin
  production. LRP5/6 (low-density lipoprotein receptor-related protein 5/6); GSK3β
  (Glycogen synthase kinase-3 beta); APC (adenomatous polyposis coli); CKI (casein
  kinase I); TCF/LEF (T-cell factor/lymphoid enhancer factor); ZNRF3 (zinc and ring
  finger 3); RNF43 (ring finger 43)
