figure_title: |-
  IFN-Is stimulate MZ B cells to activate TFH cell response to drive
  SjD and possibly other B cell autoimmune diseases
caption: |-
  IFN-Is in response to STING or other PRR activation by experimental,
  endogenous or microbial ligands in local or systemic innate immune cells, such
  as pDCs and monocytes (Mo), stimulates MZ B cell entry into follicles to enhance
  TFH responses which involves the induction of CXCR5 and IL-6
  expression by MZ B cells. This IFN-I–MZ B cell–TFH cell
  pathway is critical for the development of mouse ESS and may have an important
  role in human SjD, although it remains to be studied whether this pathway also
  activates autoreactive FO B cell responses via TFH cells and
  stimulates MZ B cell infiltration into the salivary glands. Co-targeting IFN-I
  production (a) and signaling (b) has synergistic
  efficacy in preventing ESS. In addition, targeting the interaction of B cells
  with TFH cells (c) has shown efficacy in recent SjD
  clinical trials
