figure_title: Integrin αv and α5 expression frequency and transcriptional correlates
  within clinical specimens
caption: '(A) Integrin αv and α5 expression in the metastatic CRPC rapid autopsy tumor
  microarray (UWTMA100) is summarized in the table. (B) Representative images of αv
  and α5 expression in bone metastases from UWTMA100 specimens. Blue arrows indicate
  αv (left) and α5 (right) expression in tumor cells. Red arrows indicate endosteal
  αv expression (left) and endosteal α5 expression (right). (C) Enrichment plots showing
  Myc pathway activation in αv-positive (n=20) versus αv-negative (n=23) UWTMA100
  subsets. UWTMA100 specimens with bulk RNA sequencing data were grouped based on
  IHC-defined αv positivity. Differential expression analysis was used to rank genes
  by fold change and p-value, and pre-ranked GSEA was performed using the MSigDB hallmark
  gene sets. (D) The heat map displays normalized enrichment scores (NES) for each
  pathway derived from GSEA, with red indicating positive enrichment and blue indicating
  negative enrichment. Genes were ranked by Pearson correlation coefficients with
  either ITGAV or ITGA5 transcript expression in three datasets: UWTMA100 (n=43),
  SU2C (n=161), and DKFZ (n=109). Pre-ranked GSEA was performed with the MSigDB hallmark
  gene sets for each dataset (p<0.05 and FDR<0.1 used to define significance)'
