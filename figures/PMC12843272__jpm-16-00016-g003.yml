figure_title: GDF-15–mediated mechanisms of cardiac protection.
caption: 'GDF-15–mediated mechanisms of cardiac protection. In cardiomyocytes, GDF-15
  activates the Smad2/3 and Smad1/5/8 pathways to limit hypertrophy and apoptosis,
  enhances myocardial survival through the PI3K/PKB signaling cascade, and inhibits
  pro-apoptotic pathways involving JNK, Bad, and EGFR, thereby contributing to cardiac
  protection. GDF-15: Growth Differentiation Factor-15; EGFR: epidermal growth factor
  receptor; ERK: extracellular signal-regulated kinase; PKB: protein kinase B; NF-Kb:
  Nuclear Factor kappa B; JNK: c-Jun N-terminal kinase; CAS-3: Caspase-3; PI3K: phosphatidylinositol
  3-kinase; BAD: Bcl-2-associated death promoter'
