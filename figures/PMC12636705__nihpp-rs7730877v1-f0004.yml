figure_title: Periplasmic sulfate reductases promote redox balance and resistance
  to oxidative stress in Salmonella
caption: a. Susceptibility of Salmonella cultured in MOPS-GLC minimal medium supplemented
  with either sulfate or sulfite was evaluated following treatment with 300 μM H2O2.
  Δ4 is a quadruple mutant of all four dmsA paralogs. Bacterial survival was assessed
  by CFU enumeration. The data are the mean ± SD; n = 6 from 2 individual tests. b,c,d,f.
  Quantification of intracellular H2S concentrations in Salmonella grown in MOPS-GLC
  minimal medium under ambient air with shaking (b, c, f) or standing (d). Culture
  media contained either sulfate (b,c,d,f) or sulfite (d) as sole sulfur sources.
  H2S was detected using the WSP5 fluorescent (b, c) or 7-azido-4-methylcoumarin (d,
  f) probes. Relative fluorescent units were normalized to OD600. Data are the mean
  ± SD from 2–4 independent experiments. (b, n=8,6,4,3; c, n=6; d, SO42− n=12, SO33−
  n=8; f, n=8). e. Sulfide production pathway in Salmonella. Survival of single (g)
  or quadruple (Δ4) (h) mutants to after treatment with 200 or 400 μM H2O2 for 2 and
  6 h in PBS (g) and EG medium (h), respectively. Where indicated, the strains carried
  the pWSK29 plasmid expressing the iscS gene that encodes a cysteine desulfurase.
  The data are the mean ± SD from 3–10 independent experiments (g, n=42,18,18,6,6,12,12;
  h, n=6). i. Effect of the addition of 100 μM sulfide (Na2S) on the growth of wild-type
  and Δ4 Salmonella in MOPS-GLC-sulfate minimal medium at 37°C without shaking. Some
  cultures were treated with 100 μM H2O2. The data represent the mean ± SD from 2–3
  individual experiments (control n=8; +H2S n=10). j, NDH-I dehydrogenase activity
  in inverted membranes isolated from Salmonella grown in MOPS-GLC-sulfate medium
  was assessed spectrophotometrically by monitoring the oxidation of deamino-NADH.
  The data are the mean ± SD; n = 6 from 2 independent experiments. k. NADH-dependent
  GOGAT activity in Salmonella grown in MOPS-GLC-sulfate medium was measured spectrophotometrically
  by monitoring NADH oxidation at 340 nm. The data are presented as the mean ± SD;
  n = 3 from 2 independent experiments. Some specimens were treated with 400 μM H2O2
  for 30 min prior to assay (j, k). **, p < 0.01; ***, p < 0.001; ****, p <.0001 by
  two-way ANOVA (a, d, g, i, j), one-way ANOVA (b, f, h), or unpaired t test (c, k)
