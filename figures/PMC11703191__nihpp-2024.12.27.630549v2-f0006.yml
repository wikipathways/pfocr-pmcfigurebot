figure_title: HuR is highly expressed in PDAC orthotopic pancreas and fat tissue.
caption: HuR is highly expressed in PDAC orthotopic pancreas and fat tissue. (A) Selected
  upstream regulator predictions from Ingenuity Pathway Analysis of differentially
  expressed genes in gWAT. (B-D) Representative images and quantification of immunohistochemical
  detection of HuR in tissue from PDAC and sham mice. (B) Pancreas N=4 male and 4
  female mice per group. (C) gWAT N=4 male and 4 female mice per group. (D) iWAT N=3
  female, 2 male sham and 2 female, 3 male PDAC. (E) Western blot analysis of PDAC
  and Sham gWAT protein for HuR. N=5 male mice per group. HuR protein (36 kDa) normalized
  to vinculin protein (124 kDa). Scale bars represent 100 um. Statistically tested
  with t-test. *p<0.05, **p<0.01, ***p<0.001, and ****p<0.0001
article_title: The RNA-binding protein HuR impairs adipose tissue anabolism in pancreatic
