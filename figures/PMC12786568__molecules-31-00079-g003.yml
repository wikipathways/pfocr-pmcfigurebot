caption: |-
  α-Linolenic acid (ALA) ameliorates HG/PA-induced ferritinophagy in H9C2 cells by activating the AMPK signaling pathway. (A) KEGG enrichment bubble plot comparing the NC group versus the HG/PA group (n = 3). (B) KEGG enrichment bubble plot comparing the ALA treatment group versus the HG/PA group (n = 3). (C,D) Representative Western blot and quantitative analysis of p-AMPK and AMPK protein expression in H9C2 cells (n = 3). (E–G) Representative Western blot (E) and quantification analysis (F,G) of p-AMPK, AMPK, p-STAT3, and STAT3 in H9C2 cells treated with HG/PA, ALA, and ALA+ Compound C (n = 3). (H–K) Representative Western blot (H) and quantification analysis (I–K) of NCOA4, FTH1, SFXN1 in H9C2 cells under different treatment conditions (n = 3). (L–O) Representative Western blot (M) and quantification analysis (L,N,O) of autophagy-related proteins (p-ULK1, LC3B, ATG5) in H9C2 cells after indicated treatments (n = 3). (P,Q) Representative Western blot (P) and quantification analysis (Q) of NCOA4, FTH1 in H9C2 cells treated with HG/PA, ALA, and ALA+ Stattic (5 μM, STAT3 phosphorylation inhibitor, n = 3). Note: Data is presented as mean ± SD from three independent experiments. */#/&
