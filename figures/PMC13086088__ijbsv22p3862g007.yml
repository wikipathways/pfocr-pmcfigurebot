figure_title: Characterization of DCs during LSCC progression.
caption: Characterization of DCs during LSCC progression. A UMAP plot of DCs colored
  by cell type. B Dot plots displaying characteristic gene expression within the various
  DC subsets. C Heatmap showing the normalized mean expression of genes associated
  with maturation, activation, migration, chemokines, and immunosuppressive scores
  in each DC subset. D Heatmap displaying pathway activities of each DC subset, quantified
  as NES from GSEA. E Violin plots showing the differentiation, activation, antigen
  presentation, migration, and tolerance scores of each DC subset. F Bar plots showing
  the frequency (left) and proportion (right) of each DC subset across various tissues.
  G Infiltration proportion of LAMP3+ DCs. H Correlation of CD8+ Tex or Treg signature
  with LAMP3+ DC based on bulk RNA-seq data. Each dot represents a patient (Pearson's
  correlations)
