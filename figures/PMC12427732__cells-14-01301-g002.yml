figure_title: Different subcellular localizations and key actions of calpain-1 and
  calpain-2 in neurons.
caption: Different subcellular localizations and key actions of calpain-1 and calpain-2
  in neurons. (A) Subcellular localization of calpain-1. Calpain-1 is downstream of
  synaptic NMDA receptors and is in a complex of proteins linked to PSD-95, which
  includes PHLPP1 and NOS. By cleaving PHLPP1, calpain-1 activation results in ERK
  and Akt activation, which are both involved in synaptic plasticity and in neuronal
  survival. (B) Subcellular localization and major actions of calpain-2. Calpain-2
  is downstream of extrasynaptic NMDA receptors and is in a complex of proteins linked
  to PTPN13, which includes PTEN. Calpain-2 activation results in the cleavage of
  PTEN and of PTPN13, leading to stimulation of dendritic protein synthesis and c-Abl
  activation. This pathway is involved in both synaptic plasticity and in neurodegeneration.
  Calpain-2 also cleaves MEIS2, leading to reduced neurogenesis
