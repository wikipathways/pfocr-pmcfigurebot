figure_title: PTMs on rate-limiting enzymes and their corresponding metabolic pathway.
caption: PTMs on rate-limiting enzymes and their corresponding metabolic pathway.
  Each polygon represents a metabolic pathway and is labeled with its associated rate-limiting
  enzyme(s). Polygon size is proportional to the total number of PTM sites identified
  for that enzyme. Colors indicate the combination of PTM types regulating each rate-limiting
  enzyme (e.g., phosphorylation, acetylation, ubiquitination). The triangular Voronoi
  layout is used to maximize clarity and compact visualization of pathway–enzyme–PTM
  relationships
