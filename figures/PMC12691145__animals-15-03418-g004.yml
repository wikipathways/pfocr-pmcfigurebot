figure_title: Transcriptomic profiling substantiates isomer-specific and receptor-contingent
  regulation.
caption: 'Transcriptomic profiling substantiates isomer-specific and receptor-contingent
  regulation. Transcriptomic profiling elucidates the molecular underpinnings of the
  divergent metabolic influences exerted by conjugated linoleic acid (CLA) isomers
  on goat mammary epithelial cells (GMECs). Cells were subjected to 24 h exposures
  to c9,t11-CLA, t10,c12-CLA, or selective agonists/antagonists targeting GPR40 or
  GPR120, succeeded by RNA sequencing. (A) Volcano plots delineating differentially
  expressed genes (DEGs) across pairwise contrasts: control (CON) versus c9,t11-CLA,
  CON versus t10,c12-CLA, and t10,c12-CLA versus c9,t11-CLA. (B) Venn diagram portraying
  the intersections of DEGs among the aforementioned contrasts (CON versus c9,t11-CLA,
  CON versus t10,c12-CLA, and t10,c12-CLA versus c9,t11-CLA). (C) Hierarchical clustering
  of gene expression signatures spanning the CON, c9,t11-CLA, and t10,c12-CLA cohorts.
  (D) Gene Ontology (GO) term enrichment for DEGs identified in the CON versus c9,t11-CLA
  comparison. (E) GO term enrichment for DEGs in the CON versus t10,c12-CLA comparison.
  (F) Kyoto Encyclopedia of Genes and Genomes (KEGG) pathway enrichment for DEGs in
  the CON versus c9,t11-CLA comparison. (G) KEGG pathway enrichment for DEGs in the
  CON versus t10,c12-CLA comparison. (H) Principal component analysis (PCA) encompassing
  treatments with GPR40 agonists and antagonists. (I) PCA encompassing treatments
  with GPR120 agonists and antagonists'
article_title: Divergent Regulation of Mammary Lipogenesis by trans-10, cis-12 and
  cis-9, trans-11 CLA Isomers Is Determined by Receptor-Specific Signaling
