figure_title: ZNF16 depletion affects expression of genes in cancer-associated pathways
caption: '(A) Top 20 genes differentially expressed in pathways in cancer (KEGG: 05200).
  Upregulated genes shown in red, downregulated genes in blue. (B) Independent confirmation
  of gene expression changes by qPCR for three genes in the pathway shown in (A).
  Box plots represent the results from three experiments. Fold difference normalized
  to the average of the untreated sample. (C) Fold difference in the expression of
  EGFR. Box plot represents the average of three experiments. Fold difference normalized
  to the average of the untreated sample. (D) Top 20 genes differentially expressed
  in the cytokine-cytokine receptor interaction (CCRI) pathway (KEGG: 04060). Upregulated
  genes shown in red, downregulated genes in blue. (E) Independent confirmation of
  gene expression changes by qPCR for three genes in the CCRI pathway shown in (D).
  Box plots represent the results from three experiments. Fold difference normalized
  to the average of the untreated sample. (F) Fold difference in the expression of
  DHRS9. Box plot represents the average of three experiments. Fold difference normalized
  to the average of the untreated sample. *p<0.05, **p<0.01, ***p<0.001'
