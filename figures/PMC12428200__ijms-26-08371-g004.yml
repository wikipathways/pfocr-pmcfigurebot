figure_title: Oxidative and isomerization pathways of periplasmic disulfide bond formation
  (Dsb systems) in Escherichia coli and the model Campylobacterota Campylobacter jejuni
  and Helicobacter pylori.
caption: Oxidative and isomerization pathways of periplasmic disulfide bond formation
  (Dsb systems) in Escherichia coli and the model Campylobacterota Campylobacter jejuni
  and Helicobacter pylori. The figure illustrates the diversity and organization of
  Dsb proteins responsible for the introduction and isomerization of disulfide bonds
  in periplasmic substrates. While E. coli utilizes a well-characterized DsbA–DsbB
  and DsbC–DsbD pathway, C. jejuni and H. pylori exhibit distinct variants of the
  system. In C. jejuni, two periplasmic oxidoreductases DsbA1, DsbA2, and the inner
  membrane protein DsbB mediate disulfide introduction, with the isomerization pathway
  involving periplasmic C8J_1298 and membrane proteins DsbD and DsbI. DsbI is an EcDsbB
  homolog that does not interact with either CjDsbA1 or CjDsbA2 and probably plays
  a role in the reductive pathway. H. pylori lacks the classical oxidoreductase DsbA
  and its redox partner DsbB. Instead, it utilizes the periplasmic protein DsbK (HP0231),
  which resembles EcDsbG/C and its partner DsbI, an atypical homolog of EcDsbB, for
  oxidation, and CcmG (Hp0377) and HP0265 as part of the isomerization system. The
  interactions between proteins are depicted in the figure as arrows. Question marks
  denote interactions whose precise nature remains to be elucidated
