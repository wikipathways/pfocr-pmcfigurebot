figure_title: EGFR/RAS/MAPK signaling profiles in control and LLGL1 KO Huh-7 cells.
caption: 'EGFR/RAS/MAPK signaling profiles in control and LLGL1 KO Huh-7 cells. (A)
  Representative Western blot images showing LLGL1 expression and key components of
  the EGFR–RAS/MAPK pathway proteins in control and LLGL1 KO Huh-7 cells under basal
  conditions and following EGF and/or gefitinib treatment. (B–J) Densitometric quantification
  of Western blot bands, normalized to the corresponding Beta Actin levels and expressed
  relative to untreated control cells. Phosphorylations of EGFR at Tyr1173 (B) EGFR
  at Tyr1068 (C), MEK1/2 at Ser217/Ser221 (H), and ERK1/2 at Thr202/Tyr204 (I) were
  analyzed and presented as log10-transformed fold changes relative to control cells
  to ensure data normality and variance homogeneity. In contrast, total protein levels
  of EGFR (D), pan-RAS (E) and RAF1 (G), as well as RAF1 phosphorylation at Ser338
  (F) and RSK1–3 phosphorylation at Ser380 (J), are shown as relative protein levels
  normalized to control cells. Data are presented as mean ± SEM from three independent
  experiments. Statistical significance was determined by one-way analysis of variance
  (ANOVA) followed by Tukey’s multiple-comparisons post hoc test. *: p < 0.05, **:
  p < 0.01, ***: p < 0.001, ****: p < 0.0001'
