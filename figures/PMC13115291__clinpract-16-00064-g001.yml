figure_title: HSV latency drives a neuroimmune amplification cascade linking viral
  persistence to neuronal sensitization.
caption: HSV latency drives a neuroimmune amplification cascade linking viral persistence
  to neuronal sensitization. This schematic illustrates the pathway by which latent
  herpes simplex virus (HSV) promotes sustained neuroimmune activation and neuronal
  sensitization. Panel 1 (pale lavender) depicts HSV latency within sensory neurons,
  characterized by episomal viral genomes, chromatin-mediated silencing of lytic genes,
  expression of latency-associated transcript (LAT), and non-cytolytic persistence
  that maintains tonic immune engagement. Panel 2 (soft violet to deep purple) highlights
  reactivation and neuroimmune amplification, including immune surveillance by CD8+
  tissue-resident memory T cells (TRM), activation of pattern-recognition receptors
  (PRRs) such as Toll-like receptors, NF-κB–dependent signaling, and induction of
  inflammatory mediators including type I interferons, IL-6, TNF-α, PGE2, and CGRP,
  as well as glial priming and feed-forward interferon loops. Panel 3 (deep violet)
  depicts downstream neuronal outcomes, including ion channel modulation, increased
  excitability, central sensitization, and lowered nociceptive thresholds associated
  with chronic pain and migraine-like phenotypes. The progressive purple gradient
  (lavender to deep violet) reflects progression from viral latency to amplified neuroimmune
  signaling and neuronal dysfunction. Arrows indicate the direction of signaling and
  feed-forward amplification between neuronal, immune, and glial compartments. Upward
  (↑) arrows denote increases and decreases in expression or activity, respectively.
