figure_title: Mechanisms of immunogenic cell death modalities under radiotherapy.
caption: Mechanisms of immunogenic cell death modalities under radiotherapy. The types
  of pyroptosis induced by radiotherapy include the inflammasome-caspase 1-GSDMD pathway
  and the caspase 3-GSDME pathway. Necroptosis elicited by radiotherapy mainly relies
  on a ZBP1-mediated pathway. Ferroptosis, which involves the executive and suppressive
  systems, is driven by lipid peroxidation, which can be facilitated by radiotherapy
  and the consequential increase in ROS. ACSL4 and GPX4 are known targets of radiotherapy.
  DAMPs, damage-associated molecular patterns; ROS, reactive oxygen species; AIM2,
  absent in melanoma 2; NLRP3, NOD-, LRR- and pyrin domain-containing protein 3; ZBP1,
  Z-DNA-binding protein 1; RIPK1, receptor-interacting protein kinase 1; RIPK3, receptor-interacting
  protein kinase 3; MLKL, mixed lineage kinase domain-like protein; TfR1, transferrin
  receptor 1; STEAP, six-transmembrane epithelial antigen of prostate; PUFA-PL, polyunsaturated
  fatty acid-containing phospholipid; ACSL4, acyl-CoA synthetase long chain family
  member 4; LPCAT3, lysophosphatidylcholine acyltransferase 3; GPX4, glutathione peroxidase
  4; GSH, glutathione; GSSG, oxidized glutathione
