caption: 'Content of SCFAs and expression of colitis-related signaling pathway proteins
  in the mice colon. (A) Content of SCFAs. (B) Relative mRNA expression levels of
  AhR. (C) Relative mRNA expression levels of HIF1α. (D) Relative mRNA expression
  of IL-22. (E) Expression of IL-22. (F) Expression of HIF1α and AhR proteins. (G)
  Relative protein levels of AhR. (H) Relative protein levels of HIF1α. (I) Colonic
  AB-PAS staining. (J) Number of goblet cells. (K) Immunohistochemical image of Muc2
  and the 400× magnification view of the area inside the box. (L) Changes in relative
  mRNA expression of colonic Muc2. (M) IHC score of Muc2 protein. The data represent
  the mean ± SD. Note: ** indicates a highly significant difference between the two
  groups compared with the NC group (p < 0.01). # indicates a significant difference
  between the two groups compared with the DSS group (0.01 < p < 0.05)'
