figure_title: Lyngbyapeptin A (1) biosynthetic gene cluster.
caption: 'Lyngbyapeptin A (1) biosynthetic gene cluster. (A) Comparison of lynA with
  the published lynB BGC.24 The biosynthetic genes with >30% sequence identity were
  identified by the black-to-white shades according to their sequence identities.
  PKS: polyketide synthase; NRPS: nonribosomal peptide synthetase; TE-II: type II
  thioesterase. (B) Proposed biosynthetic pathway of lyngbyapeptin A. The predicted
  lynA amino acid building blocks that are different from those in the corresponding
  positions in lynB are highlighted in red. M-CoA: malonyl-CoA; GNAT: GCN5-related
  N-acetyltransferase; T: thiolation; KS: ketosynthase; AT: acyltransferase; MT: N-
  or O-methyltransferase; C: condensation; A: adenylation; TE: thioesterase. (C) Relative
  activity of different amino acids activated by recombinant A domains of LynA4, LynA5,
  and LynA6–1. LA: the native substrates in lyngbyapeptin A; LB: the native substrates
  in lyngbyapeptin B. Ala: alanine; Gly: glycine; Ile: isoleucine; Leu: leucine; Pro:
  proline; Tyr: tyrosine; Val: valine. The data represent means ± s.d. of four independent
  experiments'
