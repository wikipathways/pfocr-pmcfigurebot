figure_title: DNA damage response signaling pathways.
caption: 'DNA damage response signaling pathways. The figure depicts the three DNA
  repair mechanisms: NHEJ, HR, and NER. NHEJ, active in G1, is initiated by Ku70/Ku80
  binding, followed by DNA-PKcs recruitment, ATM activation, and DNA end processing
  by Artemis and DNA polymerases. Ligation is mediated by the XRCC4-XLF complex and
  DNA ligase IV. HR, predominant in S/G2, involves end resection by the MRN complex
  and CtIP, ssDNA stabilization by RPA, and Rad51-mediated strand invasion facilitated
  by BRCA1/BRCA2. DNA ligase I completes repair, ensuring genomic integrity. NER includes
  global genomic NER (XPC-RAD23B) and transcription-coupled NER (CSA-CSB). TFIIH unwinds
  DNA, XPG and ERCC1-XPF excise the lesion, and the gap is filled by DNA polymerases
  and sealed by DNA ligase I. ATM, Ataxia–Telangiectasia Mutated; BRCA, Breast Cancer;
  CtIP, C-terminal Binding Protein-Interacting Protein; DDR, DNA Damage Response;
  DNA-PKcs, DNA-Dependent Protein Kinase Catalytic Subunit; DSB, Double-Strand Break;
  HR, Homologous Recombination; Ku70/Ku80, Ku Autoantigen 70/80 kDa; MRN, Mre11-Rad50-Nbs1
  Complex; NHEJ, Non-Homologous End Joining; Pol, DNA Polymerase; RPA, Replication
  Protein A; ssDNA, Single-Stranded DNA; XLF, XRCC4-Like Factor; NER, Nucleotide Excision
  Repair; TFIIH, Transcription Factor IIH; ERCC1, Excision Repair Cross-Complementation
  Group 1'
