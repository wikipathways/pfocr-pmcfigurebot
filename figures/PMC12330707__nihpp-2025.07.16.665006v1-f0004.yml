figure_title: Primary and SC-β cells exhibit varied hypoxic adaptations affecting
  identity, metabolism, and stress pathways
caption: 'Dot plots comparing gene and regulon expression changes in primary vs. SC-β
  cells over the 48-hour hypoxic time course. All comparisons are relative to the
  0-hour baseline.(A) Divergent β-Cell Identity: Dot plot showing divergent regulation
  of genes and regulons related to β-cell identity. Genes are grouped by their role
  in establishing mature identity, their ectopic expression (e.g., non-β-cell hormones),
  or their association with a progenitor-like state.(B) Metabolic Reprogramming: Dot
  plot highlighting distinct metabolic reprogramming pathways. Genes and regulons
  are grouped by function, including glucose-stimulated insulin secretion (GSIS) and
  oxidative metabolism (OxMet), glycolysis, mitochondrial function (Mito.), and lipid
  metabolism.(C) Stress, Survival, and Signaling: Dot plot comparing the engagement
  of stress, survival, and signaling pathways. Genes are grouped by their involvement
  in the unfolded protein response (UPR) and ER-associated degradation (ERAD), apoptosis,
  redox balance, and key secretion and signaling pathways.For all panels: Dot color
  represents the relative expression change, scaled to the maximum absolute log-fold
  change for each gene/regulon across all conditions (red = up, blue = down). Dot
  size indicates the adjusted p-value'
article_title: Divergent Cell-Type Specific Hypoxia Responses in Human Stem Cell–Derived
