figure_title: LCS1269-induced DNA damage followed by DNA damage response propagation
  through ATM/Chk1/BRCA1/Rad51 pathway.
caption: LCS1269-induced DNA damage followed by DNA damage response propagation through
  ATM/Chk1/BRCA1/Rad51 pathway. (A) Western blot analysis of phosphorylated histone
  p-γH2.AX (Ser139) protein levels in U87, U251, and T98G cells treated with LCS1269
  in indicated concentrations for 24 h. (B) Western blot analysis of p-Chk1 (Ser345),
  p-Chk2 (Thr68), p-ATM (Ser1981), p-ATR (Ser428), and p-BRCA1 (Ser1524) protein levels
  in U251 and T98G cells treated with LCS1269 in indicated concentrations for 24 h.
  (C) Western blot analysis of Rad51, Ku70, and Ku80 protein levels in U251 and T98G
  cells treated with LCS1269 in indicated concentrations for 24 h. β-Actin served
  as a loading control. (D) Representative images of LCS1269 (2.5 µmol/L, 24 h)-induced
  Rad51 foci in U251 and T98G cells (magnification, ×100). Scale bar, 10 µm. Bar charts
  illustrate the percentage of Rad51 foci positive nuclei (with ≥5 Rad51 foci in nucleus)
  expressed from three independent experiments. Data presented as mean ± SD. ** p
  < 0.01 and *** p < 0.001
