figure_title: NAT10 facilitates ac4C modification of RNAs and interacts with a metastasis-associated,
  nuclear pore-bound mechanosensitive protein complex
caption: (A) ac4C RNA dot blot of 4T1 Nat10 KO cells. (B) ac4C site (left) and modification
  levels (right) in 18S rRNA helix 45 of Nat10 KO 4T1 cells. ANOVA with Tukey’s multiple
  comparison test, mean ± s.d. (C) representative ac4C immuno-northern blot analysis
  (left) and densitometric quantification (right) in Nat10 KO 4T1 cells. n=3. ANOVA
  with Tukey’s multiple comparison test, mean ± s.e.m. (D) Western blot of translational
  pathway components in Nat10 KO 4T1 cells. (E) OPP protein production assay in Nat10
  knockdown 4T1 cells. Scale bar = 10 μm. (F) Morphology of Nat10 shRNA knockdown
  (top) and Nat10 KO 4T1 cells grown on different matrices (bottom). Scale bar = 10
  μm. (G) Hypothetical model of the NAT10-NUP210 mechanosensitive protein complex
  at the nuclear pore. (H) Co-IP of NAT10 with Myc-tagged NUP210 and SIPA1 in 4T1
  cells. (I) Co-IP of Flag-tagged NAT10 and BRD4 isoforms in 4T1 cells. (J) Western
  blot of NUP210 and ITGB1 protein in Nat10 KO 4T1 cells. (K) qRT-PCR of NUP210-dependent
  mechanosensitive, inflammatory response genes in Nat10 KO 4T1 cells, multiple t-test,
  mean ± s.e.m. (L) Immunofluorescence of histone H3.1/3.2 and H3K9me3 heterochromatin
  markers in Nat10 KO 4T1 cells. Scale bar = 10 μm. (M) Western blot of NAT10 and
  associated mechanosensitive proteins in 4T1 cells on soft (0.2kPa) and stiff (plastic
  dish, stiffness > GPa) matrices coated with either fibronectin or type I collagen
