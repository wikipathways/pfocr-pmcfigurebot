figure_title: 5G2 acts via the lysosome pathway to prevent tau toxicity and tau seeding
caption: '(A) Experimental design: mixed cortical cultures were incubated with 10
  μg/mL of PHF for 24 h, followed by 10 μg/mL 5G2 or 5G2 in combination with bafilomycin
  (either 0.5 or 0.25 μM) or MG-132 (5 or 2.5 μM) for 96 h (n = 9).(B and C) One-way
  ANOVA showed a significant treatment effect on NeuN (p < 0.0001). 10 μg/mL PHF alone
  induced neurotoxicity as measured by NeuN (control day 5 vs. PHF alone, p = 0.0001).
  5G2 treatment prevented PHF-induced toxicity as measured by NeuN (PHF alone vs.
  PHF + 5G2: p = 0.0488). When incubated with 5G2 and 0.5 μM Baf, there was a decrease
  in NeuN comparable to PHF alone (p = 0.0175).(D and E) Total tau levels were quantified
  and normalized for NeuN. One-way ANOVA showed a significant treatment effect (p
  < 0.0001). Exposure to PHF alone increased intracellular tau levels (control day
  5 vs. PHF alone, p = 0.0256). Samples treated with PHF followed by 5G2 and 0.5 μM
  bafilomycin also had elevated tau levels (p = 0.0062). Statistical significance
  was determined by one-way ANOVA followed by Tukey’s post-hoc test for multiple comparisons,
  n = 9 per group, values are presented as mean ± SEM. *, **, and ***p < 0.05, 0.01,
  and 0.001'
article_title: Clearing truncated tau protein restores neuronal function and prevents
  microglia activation in tauopathy mice
