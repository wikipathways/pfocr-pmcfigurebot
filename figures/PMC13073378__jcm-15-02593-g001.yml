figure_title: The figure illustrates a three-step pathway.
caption: 'The figure illustrates a three-step pathway. (1) Pre-angiography triage
  combines clinical presentation, ECG/echocardiography findings, and early serum biomarker
  interpretation. Troponin magnitude and kinetics, CRP/troponin ratio, NT-proBNP/troponin
  ratio, and selected circulating miRNAs provide early mechanistic clues, allowing
  preliminary differentiation among MINOCA, MI-CAD, myocarditis, and TTS. (2) Coronary
  angiography with biomarker-guided testing establishes the presence or absence of
  obstructive coronary disease and directs subsequent diagnostic testing in patients
  with non-obstructive coronaries. Depending on the suspected mechanism, targeted
  investigations include OCT for plaque disruption, IVUS for suspected SCAD, acetylcholine
  provocation testing for CAS, CFR and IMR assessment for CMD, TEE and thrombophilia
  testing for embolic MI, and CMR for suspected myocarditis or TTS. (3) Final etiological
  classification distinguishes confirmed MINOCA subtypes from non-MINOCA mimickers.
  Abbreviations: AMI, acute myocardial infarction; CAS, coronary artery spasm; CFR,
  coronary flow reserve; CMR, cardiac magnetic resonance; CMD, coronary microvascular
  dysfunction; CRP, C-reactive protein; ECG, electrocardiogram; EMB, endomyocardial
  biopsy; IMR, index of microcirculatory resistance; IVUS, intravascular ultrasound;
  MI-CAD, myocardial infarction with obstructive coronary artery disease; miRNAs,
  microRNAs; NSTEMI, non-ST-elevation myocardial infarction; NT-proBNP, N-terminal
  pro-B-type natriuretic peptide; OCT, optical coherence tomography; SCAD, spontaneous
  coronary artery dissection; STEMI, ST-elevation myocardial infarction; TEE, transesophageal
  echocardiography; TTS, Takotsubo syndrome'
