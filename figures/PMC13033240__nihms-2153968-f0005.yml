figure_title: Reversal of molecular aging phenotypes in 18-month-old 24:5n-3–supplemented
  eyes
caption: '(A) Heatmap showing the changed expression of possible classes of VLC-PUFA–incorporated
  phospholipids in isolated POS after intravitreal supplementation of 24:5n-3 (vehicle:
  n = 17; 24:5: n = 16). (B) Volcano plot showing DEGs in 24:5(n-3)– compared with
  vehicle-injected retinas from 18-month-old mice (n = 3). (C) GSEA enrichment plots
  for complement and oxidative stress and redox pathways. Red indicates enrichment
  in 24:5-injected retinas, and blue indicates enrichment in vehicle-injected retinas
  (n = 3). (D) Metascape analysis demonstrated down-regulation of immune response,
  inflammation, microglial phagocytosis, and cell migration pathways after 24:5n-3
  supplementation. The network plot visualizes functionally grouped enriched terms,
  where each node represents a biological pathway or process. Node size reflects the
  number of genes associated with each term, and node color indicates statistical
  significance, with darker colors representing lower P values. Edges (connecting
  lines) indicate a similarity score > 0.3 between terms, representing shared genes
  or functional overlap (n = 3). (E) STRING functional protein-protein interaction
  network of top 20 TFs involved in gene regulation after 24:5n-3 supplementation.
  (F) Heatmap illustrating changed expression of genes selected from the aging cerebellum
  gene set in the retinas of 18-month-old mice after 24:5n-3 supplementation (n =
  3). (G) Representative immunofluorescence staining of mouse RPE cell layer stained
  for C3d (green), APOE (red), and Hoechst counterstaining (blue) from retinas supplemented
  with 24:5n-3 or vehicle (left). The intensity-based quantification of C3d and APOE
  expression is shown on the right (n = 3). Scale bar, 10 μm. (H) GSEA analysis of
  up-regulated pathways in 18-month-old vehicle and 24:5n-3–supplemented retinas compared
  with 4-month-old retinas (n = 3). Data are presented as mean ± SEM. Unpaired t tests
  [(A), (F), and (G)] were used to evaluate statistical significance. *P < 0.05, **P
  < 0.01, ***P < 0.001, and ****P < 0.0001'
