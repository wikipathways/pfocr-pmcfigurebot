figure_title: Disruption of CME and exocytosis pathways lead to an ectopic root endodermal
  suberization
caption: (a) (Left) Boxplot of root endodermal suberin occupancy values from untreated
  and treated Col-0 WT plants with 30 μM ES9–17 or ES-2, (right) representative images
  of 6 days old treated and untreated Col-0 WT plants showing Fluorol Yellow (FY)
  suberin staining endodermal pattern. Data are the mean ± SD (N = 14–16 roots), ordinary
  one-way ANOVA followed by a Tukey–Kramer test; (****) p < 0.0001. Results are representative
  of two independent experiments showing similar results. Asterisks indicate significant
  differences between untreated and treated plants. Box = interquartile range between
  the lower and upper quartiles, center line = median, + = mean, whiskers = min and
  max values. Scale bars = 1 mm.(b) (Left) Boxplot of the lengths from root tip up
  to first endodermal cell showing endodermal GFP nuclear signal from 30 μM ES9–17
  or ES-2 treated vs untreated GPAT5::NLS-GFP plants, (top right) representative median
  view images of the unsuberized zone from 6 days old treated and untreated GPAT5::NLS-GFP
  plants showing the endodermal nuclear GFP expression pattern (GFP signal in yellow,
  propidium iodide staining in cyan hot), scale bars = 100 μm., (bottom right) zoomed
  images from dotted rectangles on top images showing GFP patterning, ep(epidermis),
  co(cortex), en(endodermis), scale bars= 50 μm. Data are the mean ± SD (N = 5–7 roots),
  ordinary one-way ANOVA followed by a Tukey–Kramer test; (**) p < 0.01, (***) p <
  0.001. Results are representative of two independent experiments showing similar
  results. Asterisks indicate significant differences between untreated and treated
  plants. Box = interquartile range between the lower and upper quartiles, center
  line = median, + = mean, whiskers = min and max values
