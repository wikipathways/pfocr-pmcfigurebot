figure_title: Transcriptomic Profiling of CD11b+ graft cells reveals enhanced fatty
  acid metabolism within MertkCR/CR recipient hearts 30 days post-transplant
caption: (A) Principal component analysis (PCA) shows distinct clustering of CD11b+
  cell transcriptomes between Mertk+/+ and MertkCR/CR graft recipients (n = 3)(B)
  Heatmap of gene set enrichment scores across individual mice highlights differences
  in immune and metabolic pathway activation.(C) Directed significance score plot
  illustrates upregulated pathways in MertkCR/CR graft-infiltrating myeloid cells
  relative to Mertk+/+ controls.(D) Volcano plot depicting differentially expressed
  genes between MertkCR/CR and Mertk+/+ myeloid cells.(E) Top 30 differentially expressed
  genes ranked by fold-change and statistical significance.(F) GAS6 treatment acutely
  increases maximal oxygen consumption rate (OCR) in MertkCR/CR macrophages compared
  to Mertk+/+ controls, indicating enhanced mitochondrial respiration.(G) GAS6 increases
  basal respiration in both Mertk+/+ and MertkCR/CR macrophages.(H) GAS6-induced OCR
  enhancement is dependent on MerTK, as shown using primary peritoneal macrophages
  from wild-type and MerTK-deficient mice. Data in panels F–H represent n = 4–8 wells
  per group, measured using the Seahorse XF24e metabolic flux analyzer
