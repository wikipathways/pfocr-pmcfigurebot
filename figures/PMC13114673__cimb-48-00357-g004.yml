figure_title: Eno-induced ferroptosis is associated with suppression of the p62/Keap1/Nrf2/HO-1
  signaling pathway in HepG2 cells.
caption: 'Eno-induced ferroptosis is associated with suppression of the p62/Keap1/Nrf2/HO-1
  signaling pathway in HepG2 cells. HepG2 cells were treated with Eno (100 μg/mL)
  and/or liprostatin-1 (1 μM) for 24 h, and then the cells were collected for detection.
  (A) The protein expression levels of p62, Keap1, Nrf2 and HO-1 in HepG2 cells were
  evaluated by Western blot analysis. (B) mRNA expression levels of corresponding
  genes were determined by qRT-PCR. n = 3 biologically independent samples. * is the
  comparison between the experimental group and the control group, and # is the comparison
  between the groups, * p < 0.05, ** p < 0.01, *** p < 0.001 and # p < 0.05, ## p
  < 0.01, ### p < 0.001. p values were determined by unpaired two-tailed Student’s
  t-tests or one-way ANOVA'
