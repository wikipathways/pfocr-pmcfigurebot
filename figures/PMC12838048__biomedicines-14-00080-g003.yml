figure_title: RXR agonist V-125 and bexarotene regulate cancer-relevant pathways in
  treated mammary tumors of a HER2+ mouse model.
caption: RXR agonist V-125 and bexarotene regulate cancer-relevant pathways in treated
  mammary tumors of a HER2+ mouse model. Female MMTV-Neu mice with mammary tumors
  measuring ~5 mm in diameter were treated either a control diet, V-125 (100 mg/kg
  diet) or bexarotene (100 mg/kg diet) for 10 days. Differentially expressed genes
  from V-125 and bexarotene treated vs. control tumors were analyzed using Enrichr.
  The top enriched pathways are shown as bar graphs for GO Biological Process 2025,
  WikiPathways Mouse 2024, and Reactome Pathways 2024 databases. Pathway enrichment
  is plotted as −log10(p-value)
article_title: RXR Agonist V-125 Induces Distinct Transcriptional and Immunomodulatory
