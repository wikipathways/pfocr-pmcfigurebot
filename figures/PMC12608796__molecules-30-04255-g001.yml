figure_title: Design of chemical probes for S-2-carboxypropylated protein profiling.
caption: Design of chemical probes for S-2-carboxypropylated protein profiling. (A)
  Proposed pathway for the formation of cellular protein S-2-carboxypropylation. The
  protein can either directly conjugate with methacrylate or react with methacrylyl-CoA
  first and then be hydrolyzed to form S-2-carboxypropylation. (B) The structures
  of methacrylic acid, PMAA, IA, and PIBA. (C) Scheme for the probe PMAA to capture
  cellular S-2-carboxypropylated proteins. The cellular proteins were reacted with
  PMAA and further conjugated with biotin through a click reaction, after which the
  labeled proteins could be visualized through streptavidin detection (red lines signifying
  protein bands)
