figure_title: Transcription of metabolic genes, mitochondrial protein levels, and
  the activity of mitochondrial complexes are reduced in cYY1 KO mice subjected to
  TAC.
caption: Transcription of metabolic genes, mitochondrial protein levels, and the activity
  of mitochondrial complexes are reduced in cYY1 KO mice subjected to TAC. A) Differential
  gene expression analysis from RNA sequencing revealed 1,825 upregulated and 1,752
  downregulated genes in cYY1 knockout (KO) mice compared to MerCreMer controls 10
  days after transverse aortic constriction (TAC) (n = 4). Ingenuity Pathway Analysis
  (IPA) identified metabolic pathways as among the most significantly altered. Specifically,
  pathways such as mitochondrial fatty acid β-oxidation, mitochondrial function, the
  citric acid (TCA) cycle, respiratory electron transport/oxidative phosphorylation,
  AMPK signaling, and PPARα signaling were significantly downregulated in cYY1 KO
  mice. In contrast, pathways including adrenergic receptor signaling, insulin-like
  growth factor signaling, endothelin signaling, and TGF-β receptor complex signaling
  were upregulated. Differentially expressed genes (DEGs) or pathways were defined
  by a fold change >1.5 and a false discovery rate (FDR) of 5%. B) Consistently, quantitative
  RT-PCR demonstrated that the mRNA levels of transcription factors PGC-1α (Ppargc1a),
  PPARα (Ppara), and ERRα (Esrra) were further reduced in cYY1 KO mice following TAC
  (n=6). C) Mitochondrial protein abundance was assessed using Oxphos Western Blot
  cocktail antibodies. With the exception of mitochondrially encoded cytochrome C
  oxidase I (MTCO1), the levels of ATP synthase F1 subunit epsilon (ATP5A), ubiquinol-cytochrome
  C reductase core protein 2 (UQCRC2), succinate dehydrogenase complex iron-sulfur
  subunit B (SDHB), and NADH:ubiquinone oxidoreductase subunit B8 (NDUFB8) were significantly
  decreased in cYY1 KO mice subjected to TAC (n=6). D) In line with the downregulation
  of transcription and protein levels of metabolic genes, the activities of mitochondrial
  complexes I and IV were significantly reduced in TAC cYY1 KO mice (n=10). Statistical
  analysis was performed using Student’s t-test to assess means between two groups
  or two-way ANOVA with Tukey’s test to assess means between multiple groups. Data
  are shown as means±SEM. ٭P<0.05, ٭٭P<0.01, ٭٭٭P<0.001
