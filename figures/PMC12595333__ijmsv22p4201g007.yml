caption: Gene sets and pathways enriched according to the methylation status of cg08558971
  and cg18416251, revealing inverse associations with immune- and metabolism-related
  signaling. Gene Set Enrichment Analysis (GSEA) identified significantly enriched
  signaling pathways associated with differential methylation of cg08558971 and cg18416251.
  (A-B) Enriched pathways in high and low methylation groups of cg08558971. (C-D)
  Enriched pathways in high and low methylation groups of cg18416251. Significantly
  enriched pathways were determined using a nominal p-value < 0.05
