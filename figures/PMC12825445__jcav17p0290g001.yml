figure_title: The role of sialylation in thyroid cancer progression.
caption: 'The role of sialylation in thyroid cancer progression. Sialylation in TC
  is regulated by STs (ST3Gal, ST6Gal, ST8Gal ang ST6GalNAc) and NEUs, which dynamically
  control the addition or removal of sialic acids. Within the cell, sialic acids are
  synthesized from UDP-GlcNAc through the ManNAc-Neu5Ac pathway, subsequently activated
  to CMP-Neu5Ac in the nucleus and utilized in the Golgi apparatus for glycoprotein
  and glycolipid sialylation83. Aberrant sialylation leads to multiple oncogenic effects:
  (1) Altered adhesion and metastasis—sialylated integrins and selectin ligands (E-,
  P-, L-selectins) facilitate interactions with endothelial cells, leukocytes, and
  platelets, promoting tumor dissemination; (2) Activation of signaling pathways—sialylated
  FGFR and integrins activate FAK and ERK cascades, driving proliferation, invasion,
  and angiogenesis; (3) Immune evasion—sialylated ligands engage Siglec receptors
  on NK cells, T cells, dendritic cells, and macrophages, inhibiting cytotoxicity,
  dampening activation, and inducing pro-tumoral polarization; (4) Inflammatory modulation—via
  TLR4-MAPK-NF-κB signaling, sialylation influences cytokine secretion (IL-6, TNF-α)
  and shapes the tumor microenvironment. Collectively, these processes contribute
  to the malignant progression of TC by promoting proliferation, invasion, immune
  suppression, and metastatic spread16,84'
article_title: 'Sialylation in Thyroid Carcinoma: An Overview of Mechanisms, Markers,
