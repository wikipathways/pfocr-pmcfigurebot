figure_title: Proposed mechanisms underlying the biological effects of black chokeberry
  (Aronia melanocarpa).
caption: 'Proposed mechanisms underlying the biological effects of black chokeberry
  (Aronia melanocarpa). The fruit is rich in phenolic compounds, vitamins, and essential
  minerals, which contribute to the regulation of homeostasis, enzymatic activity,
  and intracellular signaling. These actions involve AKT activation and modulation
  of key antioxidant enzymes, such as SOD, GPx, and CAT. As a result, pro-inflammatory
  mediators, including TNF-α, IL-1β, IL-6, and CRP, are reduced, while the Nrf-2/HO-1
  signaling pathway is activated. Collectively, these molecular effects translate
  into a wide range of physiological benefits, including antihypertensive, anti-inflammatory,
  anti-atherosclerotic, antioxidant, anticancer, antiviral, and antidiabetic properties.
  Abbreviations: AKT, protein kinase B; CAT, catalase; CRP, C-reactive protein; GPx,
  glutathione peroxidase; HO-1, heme oxygenase 1; IL-1β, interleukin 1β; IL-6, interleukin
  6; Nrf-2, nuclear factor erythroid 2-related factor 2; SOD, superoxide dismutase;
  TNF-α, tumor necrosis factor α'
