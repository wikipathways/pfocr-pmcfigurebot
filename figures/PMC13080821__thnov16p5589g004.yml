figure_title: CMA improves mitochondrial homeostasis of M1 macrophages via promoting
  BNIP3-mediated mitophagic flux.
caption: 'CMA improves mitochondrial homeostasis of M1 macrophages via promoting BNIP3-mediated
  mitophagic flux. (A) GSEA revealed significant enrichment of the pathway for positive
  regulation of mitophagy in response to mitochondrial depolarization in CMA-treated
  M1 macrophages. (B-D) Representative immunoblot bands and quantification of the
  lysosomal marker LAMP1 and the autophagosome marker LC3B in M1 macrophages treated
  with or without CMA for different time gradients (n = 3). (E-G) Representative images
  of MTG-labeled mitochondria and LTR-labeled lysosomes, and analysis of the degree
  of co-localization of these two organelles. The spatial association between mitochondria
  and lysosomes was assessed by quantifying four to seven randomly fields. Scale bar:
  5 μm. (H) Representative TEM analysis in M1 macrophages treated with or without
  CMA (20 μM) for 2 h. (I) Flow cytometry and quantification of the mitophagy flux
  in M1 macrophages treated with or without CMA (20 μM) for 2 h. Mitophagy flux was
  defined as the inhibitory portion of Baf A1 by staining mitochondria using Mito-Tracker
  Deep Red FM (n = 3). (J) Representative immunoblot bands and quantification of BNIP3
  in M1 macrophages treated with or without CMA for 2 h (n = 3). Data presented as
  mean ± SD, *P < 0.05, **P < 0.01'
