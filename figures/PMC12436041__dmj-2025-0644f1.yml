figure_title: Insulin signaling pathways regulating hepatic lipid and glucose metabolism
  in the normal insulin-sensitive state.
caption: 'Insulin signaling pathways regulating hepatic lipid and glucose metabolism
  in the normal insulin-sensitive state. Insulin signaling in the liver orchestrates
  glucose and lipid metabolism through INSR-mediated activation of IRS1/2, PI3K, AKT,
  and mTORC1. IRS2 primarily regulates gluconeogenesis via FoxO1 during fasting, while
  IRS1 promotes lipogenesis via SREBP1c in the fed state. AKT phosphorylates FoxO1,
  suppressing gluconeogenic genes, and activates mTORC1 to induce SREBP1c and lipogenic
  genes. While mTORC1 can drive DNL, AKT is essential; deletion of FoxO1 rescues glucose
  regulation but not lipogenesis in AKT-deficient livers. Atypical PKCs also contribute
  to insulin-induced lipogenesis. Pathways are represented as follows: orange- colored
  nodes and pathways indicate an increase by insulin action, while bright green ones
  indicate a decrease. Red lines indicate increased pathways, while blue lines represent
  decreased pathways, with arrows (→) marking progression pathways and blunt arrows
  (⊣) denoting inhibitory pathways. *Abbreviations: GP, glycogen phosphorylase'
