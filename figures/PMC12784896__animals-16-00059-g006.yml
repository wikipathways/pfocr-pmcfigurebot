caption: 'Effect of WEAA levels on the expression of TLR4/NF-κB signaling pathway-related
  genes in culture medium of PDTC-blocked PBLs. Abbreviations: TLR4 = Toll Like Receptor
  4; IKKβ = Inhibitor of Nuclear Factor Kappa B Kinase Subunit Beta; IκB-α = NFKB
  Inhibitor Alpha; NFκBp65 = RELA Proto-Oncogene; IL-1β = Interleukin 1β; IL-4 = Interleukin
  4; PDTC = Pyrrolidine Dithiocarbamate (NFκB inhibitor); WEAA = Water Extracts of
  Artemisia annua L. (100 µg/mL), values were expressed as the means of 6 replicates
  in each group. WEAA×PDTC = Interaction between WEAA and PDTC; WEAA = Effect of WEAA
  alone; PDTC = Effect of PDTC alone. Values within a row with different superscripts
  (a, b, c) differ significantly at p ≤ 0.05, whereas the probability value of 0.05
  < p < 0.10 was considered as a tendency'
