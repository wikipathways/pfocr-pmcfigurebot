figure_title: Topological organization of the voltage-gated proton channel Hv1.
caption: Topological organization of the voltage-gated proton channel Hv1. The Hv1
  is made of four membrane-spanning segments (S1 through S4). In the S4 segment, there
  are three positive arginines (R205, R208, and R211 in human Hv1) responsible for
  the S4 movement to regulate the opening of the Hv1 proton channel. Hv1 forms dimers
  in which two Hv1 subunits are held together by the C-terminal coiled-coil domain
  of each subunit. The proton permeation pathway is located in each subunit
