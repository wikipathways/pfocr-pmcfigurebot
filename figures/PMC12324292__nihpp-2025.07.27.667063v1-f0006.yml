figure_title: Reactive folding subtrajectories reveal condition-dependent heterogeneity
  and pathway diversity.
caption: Reactive folding subtrajectories reveal condition-dependent heterogeneity
  and pathway diversity. (a–c) Q–Rg free energy surfaces for reactive subtrajectories
  that start from disordered unfolded and end in folded tetra-nucleosome conformations,
  shown for the protein-free system (a), HP1α-bound system (b), and tPHC3-bound system
  (c). Overlaid are time-colored points tracing folding progression (black → red →
  yellow). (d–f) Diffusion map projections (ψ1–ψ2) of the same subtrajectories, colored
  by RMSD from the native crystal structure (green ≈ low RMSD; yellow ≈ high RMSD).
  ψ1 serves as an approximate folding coordinate, though its directionality varies
  between HP1α and tPHC3. (g–i) Corresponding free energy surfaces projected onto
  ψ1–ψ2 space, where blue indicates low and red indicates high free energy. Protein-free
  and HP1α systems exhibit relatively continuous folding pathways with single dominant
  basins, while tPHC3 displays a more fragmented landscape with multiple metastable
  intermediates. These differences in folding topology reflect the influence of chromatin-binding
  proteins on the conformational dynamics and energy landscape of nucleosome array
  folding
