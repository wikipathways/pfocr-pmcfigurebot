figure_title: Regulators of neurogenesis in the Wnt signaling pathway are altered
  in APP mice
caption: (A) Simplified diagram of the Wnt/β-catenin signaling pathway and inhibitors
  of the pathway. Wnt ligands are secreted proteins that bind to Frizzled receptors
  (Fz) and lipoprotein receptor-related protein (LRP) co-receptors to initiate an
  intracellular signaling cascade, involving Dishevelled (Dsh) as a mediator, and
  leading to accumulation of β-catenin (β-cat) in the cytosol and its translocation
  into the nucleus, where it interacts with T-cell factor/lymphoid enhancer factor
  (TCF/LEF) transcription factors to turn on gene transcription. Wnt signaling can
  be regulated by an array of inhibitors, such as Wise/sclerostin (SOST), Dickkopf
  proteins (DKKs), Wnt inhibitory factor 1 (Wif-1), insulin-like growth factor binding
  protein 5 (IGFBP-5), and secreted Frizzled-related proteins (sFRPs). (B) Table of
  genes in the Wnt/β-catenin pathway that were queried in the RNA-sequencing dataset.
  Highlighted genes indicate genes that were significantly down- (blue) or upregulated
  (red) in APP mice relative to NTG mice. (C) Volcano plot showing genes in the dentate
  gyrus (DG) that were differentially expressed between 4-month-old NTG mice and APP
  mice that had seizures. Differential gene expression was assessed using DEseq2.
  Horizontal dashed line indicates significance cut-off of p-adjusted < 0.05. Vertical
  dashed line separates downregulated (left) and upregulated (right) genes. Components
  of the Wnt/β-catenin signaling pathway are highlighted in green (p-adj < 0.05) and
  black (p-adj > 0.05). N = 4 mice per genotype. (D) Normalized read counts from the
  RNA-sequencing dataset of Wnt2, Wnt9a, and Frzb in NTG mice and APP mice with seizures.
  (E) Fold change of Wnt2, Wnt9a, and Frzb mRNA expression in hippocampal samples
  from NTG mice and APP mice from an independent 4-month-old cohort. N = 8 mice per
  genotype. (F) mRNA expression of sFRP1, sFRP2, Frzb (sFRP3), sFRP4, and sFRP5 in
  NTG mice and APP mice, normalized to sFRP1 levels in NTG mice. N = 7-9 mice per
  genotype. *p < 0.05; **p < 0.01; ***p < 0.001. Values indicate mean ± SEM
article_title: Restoration of sFRP3 preserves the neural stem cell pool and spatial
  discrimination ability in a mouse model of Alzheimer’s disease
