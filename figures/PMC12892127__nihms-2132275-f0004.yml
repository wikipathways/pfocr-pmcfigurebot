figure_title: Age-related gene comparison analysis of AD pathway genes in 3xTg-AD
  mice at 6 and 9 months of age.
caption: Age-related gene comparison analysis of AD pathway genes in 3xTg-AD mice
  at 6 and 9 months of age. (A) Heat map of all 84 AD pathway (murine) genes (plotted
  as log2FC). (B) Amyloid-β pathway genes. (C) Cell signaling molecules. (D) Mitochondrial-related
  genes. All data are normalized to the 6-month 3xTg-AD control group. Data represented
  3xTg-AD control and 3xTg-AD UCMS mice at 6 and 9 months of age. Blue dots = male
  data; white dots = female data. *p ≤ 0.05, **p ≤ 0.01, ***p ≤ 0.001, ****p ≤ 0.0001;
  mean ± SEM. n = 6–9/group. (E) Heat map of 3 mutant human genes (human amyloid precursor
  protein (hAPP), human Presenilin-1 (hPSEN1), and human microtubule-associated protein
  tau (hMAPT)) plotted as log2FC. (F) hAPP, hPSEN, and hMAPT gene expression using
  custom qPCR at 6 and 9 months of age in 3xTg-AD mice. Data were compared using Two-way
  ANOVA, with the main effect of stress and time (and their interaction) with a Tukey
  post-hoc test. ATP-binding cassette sub-family A (Abca1), a disintegrin and metallopeptidase
  domain 9 (Adam9), amyloid beta precursor protein binding family A member 1 (Apba1),
  gamma-secretase subunit (Aph1a), amyloid beta A4 precursor protein-binding family
  B member 1 (Apbb1) and 2 (Apbb2), amyloid beta (A4) precursor protein (App), beta-secretase
  1 (Bace1), gamma-secretase subunit (Aph1a), amyloid beta (A4) precursor protein
  binding (Apba1), insulin receptor (Insr), low density lipoprotein receptor-related
  protein 1 (Lrp1), Ubiquinol-Cytochrome C Reductase Core Protein 1 (Uqcrc1) and 2
  (Uqcrc2)
