figure_title: The mechanism underlying the effects of Bmi1 on MSC transplantation-induced
  ischemic brain injury repair.
caption: The mechanism underlying the effects of Bmi1 on MSC transplantation-induced
  ischemic brain injury repair. In vitro experiments used Wnt3a and PTC209 to treat
  MSCs to explore the roles and regulatory mechanisms of the Bmi1 and Wnt3a-Rhoa signaling
  pathways in the neural differentiation of MSCs. In vivo experiments were conducted
  to investigate the role of the Bmi1 and Wnt3a-RhoA signaling pathway in brain injury
  repair in MCAO rats and its mechanism. Different MSCs were transplanted into rat
  brain tissues after in vitro labeling, after which, the ischemic brain injury in
  each group was compared and the recovery of neurological function was assessed.
  Bmi1, B lymphoma Mo-MLV insertion region 1 homolog; H&E, hematoxylin and eosin;
  IF, immunofluorescence; MSCs, mesenchymal stem cells; NSS, Neurological Severity
  Score; WB, western blotting
article_title: Bmi1 regulates neural differentiation of mesenchymal stem cells through
  the Wnt3a-RhoA signaling pathway to repair ischemic brain injury in rats
