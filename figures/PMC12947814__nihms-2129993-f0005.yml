figure_title: Interleukin (IL)-15 activates CD4+ tissue-resident memory T cells (TRMs)
  in ulcerative colitis (UC) via a JAK1 pathway.
caption: Interleukin (IL)-15 activates CD4+ tissue-resident memory T cells (TRMs)
  in ulcerative colitis (UC) via a JAK1 pathway. (A) Schematic of pathway to obtain
  colon CD4+ TRMs from patients with refractory UC referred for surgery. (B) CD4+
  TRMs were FACS purified from active and inactive regions of the colon of UC patients
  and were stimulated with anti-CD3/CD28 and IL-15/RA with or without a JAK1 inhibitor
  as shown and the indicated cytokines were measured with enzyme-linked immunosorbent
  assay. (C) FACS-purified CD4+ TRMs were stimulated with anti-CD3/CD28 and cytokines
  as indicated without or without a JAK1 inhibitor, and the induction of RORC was
  determined. RORC was normalized to GAPDH. Each point is a biologic replicate, and
  data are representative of 3 experimental replicates (B, C). *P < .1, **P < .01,
  ***P < .001, and ****P < .0001 by analysis of variance by analysis of variance.
  FI, fold induction, GM-CSF, granulocyte-macrophage colony-stimulating factor
