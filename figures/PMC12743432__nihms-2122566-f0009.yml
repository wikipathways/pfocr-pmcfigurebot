figure_title: A cell scheme illustrates the role of mTORc2 in regulating K+ excretion
  in the DCT, CNT and CCD
caption: Increased dietary K+ intake stimulates mTORc2 which inhibits Kir4.1/Kir5.1
  and decreases the negativity of the DCT1 cell voltage. Depolarization is expected
  to increase intracellular Cl− concentration thereby inhibiting with-No-Lysine-kinase
  (WNK). In CNT and CCD, mTORc2 stimulates ENaC by SGK1 pathway, whereas high K+ diet
  also stimulates ROMK by mTORC2 and by inhibiting L-WNK1/ ROS production
article_title: Mechanistic target of rapamycin complex-2 (mTORc2) mediates the effect
  of over-night high K+ on Kir4.1/Kir4.1 in the DCT and ENaC/ROMK in ASDN
