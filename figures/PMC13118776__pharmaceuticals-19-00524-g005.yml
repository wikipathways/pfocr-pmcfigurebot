caption: '(A) Gene Set Enrichment Analysis (GSEA) enrichment analysis between NGR1
  group and model group. GSEA showed that NGR1 administration is positively correlated
  with oxidative phosphorylation, fatty acid metabolism, and PPAR signaling pathway.
  (B) Venn plot showing the common proteins in the liver of three groups. Relative
  expression of (C) NDUFS2, (D) NDUFA13, (E) COX5A, (F) ATP5PD, (G) ETFβ and (H) CYC
  in the liver. Data are expressed as the mean ± SEM, n = 6 in each group. * p < 0.05,
  ** p < 0.01, *** p < 0.001 vs. the control group, # p < 0.05, ## p < 0.01 vs. the
  model group. Relative expression of (I) riboflavin, (J) FAD and (K) FMN in the liver.
  Data are expressed as the mean ± SEM, n = 6 in each group. *** p < 0.001 vs. the
  control group, # p < 0.05, ## p < 0.01 vs. the model group. Relative expression
  of (L) Isoleucine and (M) Valine in the liver. Data are expressed as the mean ±
  SEM, n = 6 in each group. * p < 0.05, *** p < 0.001 vs. the control group, # p <
  0.05 vs. the model group. Relative expression of (N) NADPH, (O) ADP and (P) ATP
  in the liver. (Q) The ratio of ATP/ADP in the liver. Data are expressed as the mean
  ± SEM, n = 6 in each group. *** p < 0.001 vs. the control group, # p < 0.05, ##
  p < 0.01 vs. the model group'
