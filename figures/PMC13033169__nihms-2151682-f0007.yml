figure_title: Proposed pathways by which dynamic and static strain cause divergent
  responses in Hippo signaling
caption: Dynamic strain induces actin remodeling, along with LATS activation which
  phosphorylates both MST and AMOT. This results in release of AMOT from remodeling
  actin structures. MST then associates with and phosphorylates YAP, leading to YAP
  exclusion from the nucleus. In contrast, static strain promotes association of STRIPAK/PP2Ac
  with MST, resulting in MST dephosphorylation; thus de-phosphorylated YAP traffics
  to the nucleus
article_title: Mesenchymal stem cells differentiate dynamic from static load through
  variable regulation of the Hippo pathway
