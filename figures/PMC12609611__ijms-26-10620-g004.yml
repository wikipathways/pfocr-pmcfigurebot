figure_title: Transcriptome analysis of the DJ41_1407 and GacA regulon.
caption: Transcriptome analysis of the DJ41_1407 and GacA regulon. (A) Comparison
  between the total number of genes regulated by DJ41_1407 (blue), GacA (red) and
  DJ41_1407/GacA (green). Genes with log2 expression ratio (wild-type/mutant) > 1.0
  or < −1.0 in ∆DJ41_1407, ∆gacA, and ∆DJ41_1407/gacA were compared. A total of 47,
  135 and 185 genes, respectively, showed differences in expression activity for the
  ∆DJ41_1407, ∆gacA, and ∆DJ41_1407/gacA mutant strains compared with the wild-type.
  (B) Gene clusters regulated by GacA with an expression fold-change greater than
  2. (C,D) Gene clusters regulated by GacA are involved in benzoate degradation and
  the phenylalanine pathway. Gene cluster (C) DJ41_2041-DJ41_2054 was found to be
  related to phenylalanine metabolism through KEGG analysis. Gene clusters (D) DJ41_332-DJ4_338,
  DJ41_2892-DJ41_2896 and DJ41_3071-DJ41_3075 were found to be related to benzoate
  degradation and amino acid metabolism
