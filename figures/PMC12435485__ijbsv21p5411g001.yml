figure_title: Transcriptomic interrogation of cell cycle regulation and glucose metabolism
  in transformed follicular lymphoma.
caption: Transcriptomic interrogation of cell cycle regulation and glucose metabolism
  in transformed follicular lymphoma. (A-C) KEGG (A) and GSEA (B-C) enrichment analysis
  of GSE86613 data enriched to glycolysis/glycogenesis (NES=1.4854) and cell cycle
  (NES=1.3561) pathways. (D) Transcriptomic profiling of GSE86613 revealed marked
  upregulation of glycolysis/gluconeogenesis pathway -related genes (HK2, LDHA, PDHA2,
  PFKP, PKG2, and PKM) expression in t-FL specimens. (E) Transcriptomic interrogation
  of GSE86613 demonstrated significant upregulation of core cell cycle related genes
  (CCNA2, CCNB1, CDK1, CDK4, CDK6, and CDKN3) expression in t-FL specimens. (*P <
  0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001)
