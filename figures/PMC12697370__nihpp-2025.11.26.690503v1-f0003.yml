figure_title: The atm-tp53 pathway is required for distinct UHRF1-induced senescence
  features
caption: A. Percent of SA-β-gal positive livers at 120 hpf in hUHRF1 and control livers
  in a WT background or mutation of tp53 or atm, with chemical inhibition of Atr using
  10 μM VE821 (iATR), or combination of atm mutation and 10 μM VE821. **** p-value
  < 0.0001 by unpaired t-test. Each dot represents the percent of positive larvae
  in a clutch, with at least 10 larvae scored per clutch. B. Venn diagram of DEGs
  in the liver of hUHRF1 compared WT or in hUHRF1;tp53−/− compared tp53−/−. C. Crossplot
  of Log2FC of differentially expressed genes in hUHRF1 compared to WT controls or
  hUHRF1;tp53−/− to tp53−/− at 120 hpf. D. Box plot of the Log2 fold change of tp53
  target genes (Fischer, 2017) upregulated in hUHRF1 on a WT background (WT) compared
  to the expression of the same genes in hUHRF1;tp53−/− compared to tp53−/− (tp53−/−).
  E. Heatmap of of select Tp53 target genes relevant to senescence in hUHRF1 on a
  WT background (WT) compared to the expression of the same genes in hUHRF1;tp53−/−
  compared to tp53−/− (tp53−/−)
