figure_title: The siRNA pathway mediating post-transcriptional gene silencing.
caption: 'The siRNA pathway mediating post-transcriptional gene silencing. RNA interference
  (RNAi) is a highly conserved cellular pathway allowing targeted gene silencing at
  the post-transcriptional level. Synthetic siRNA duplexes consist of a guide (green)
  and a sense (red) strand. Once inside the cytoplasm, the duplex is recognized by
  a protein complex that includes the ribonuclease Dicer, the transactivation response
  RNA-binding protein (TRBP), and the protein activator of the interferon-induced
  protein kinase (PACT). This complex facilitates the removal and degradation of the
  sense strand, while the guide strand is retained and incorporated into the RNA-induced
  silencing complex (RISC). The mature RISC, which includes Argonaute 2 (AGO2) and
  the guide strand, is directed by the guide strand to bind complementary sequences
  on target messenger RNAs (mRNAs). Upon binding, AGO2 catalyzes the cleavage of the
  target mRNA, resulting in sequence-specific degradation and subsequent gene silencing.
  Abbreviations: AGO2, Argonaute 2 enzyme; mRNA, messenger RNA; PACT, protein activator
  of the interferon-induced protein kinase; RISC, RNA-induced silencing complex; RNAi,
  RNA interference; siRNA, small interfering RNA; TRBP, HIV-1 transactivation response
  (TAR) RNA-binding protein'
