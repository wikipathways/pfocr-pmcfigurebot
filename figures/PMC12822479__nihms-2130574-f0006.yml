figure_title: The Hippo pathway mediates membrane-potential signaling
caption: '(A) YAP immunostaining and fluorescent nuclei images in low-density (top)
  and high-density MDCK monolayers (bottom). Scale bar: 25 μm.(B) Quantification of
  nuclear/cytoplasmic YAP ratio as a function of cell number density. (n = 20,337
  cells, cells binned together by local number density, with a bin size of 1 cell/100
  μm2.)(C) Schematic representation of YAP localization at different cell number densities.(D–G)
  Quantification of nuclear/cytoplasmic ratio of YAP in MDCK/MCF10A cells for YAP
  under sparse (D, F, and H) and dense (E, G, and I) conditions under varied drug
  perturbations, measured by immunostaining of YAP. In sparse cells, YAP localizes
  to the nucleus and induction of hyperpolarization significantly promotes nuclear
  exclusion of YAP. In dense cells, depolarization by ouabain inhibits nuclear exclusion
  of YAP compared with the control (n = 24 cells total from 2 biological replicates,
  unpaired t test). Scale bar: 50 μm.(H) YAP immunostaining of sparse MDCK cells with
  control, 40 μM valinomycin, and 40 μM valinomycin with MST inhibitor (10 μM XMU-MP-1)
  conditions (n = 24 cells total from 2 biological replicates, one-way ANOVA with
  Tukey’s multiple comparisons test). Scale bar: 50 μm.(I) YAP immunostaining of sparse
  MCF10A cells with control, 10 μM valinomycin, and 10 μM valinomycin with MST inhibitor
  (10 μM XMU-MP-1) conditions (n = 24 cells total from 2 biological replicates, one-way
  ANOVA with Tukey’s multiple comparisons test, the adjusted p value between sparse
  and 10 μM Val + MST1 inhibitor is 0.0092). Scale bar: 50 μm.(J) Sparse MCF10A cells,
  with and without FAT1 knockdown (KD), stained for FAT1 and YAP under control and
  valinomycin conditions. (n = 20 cells total from 2 biological replicates, unpaired
  t test, p value between FAT1KD control and valinomycin is 0.558 [ns]). Scale bar:
  50 μm.(K and L) MST1 immunostaining of MCF10A/MDCK cells under sparse control, sparse
  valinomycin, dense control, and dense ouabain conditions. White arrows highlight
  areas of increased MST1-organized membrane clusters. For quantifications in panels,
  the localization of MST1 in individual cells in randomized fields of view were analyzed
  (n = 4 ROIs, unpaired t test. The p value is 0.0012 for MDCK sparse control vs.
  valinomycin and <0.0001 for other plots). Scale bar: 25 μm.(M) Schematic diagram
  summarizing signal transduction mechanism mediated by membrane potential. Hyperpolarization
  of membrane potential causes MST1 to colocalize with the C-terminal tail of FAT1,
  assembling the Hippo signaling complex. This Hippo “on” state prevents the nuclear
  translocation of YAP.****p < 0.0001. Data are represented as mean ± SD unless otherwise
  noted.See also Figures S3, S4, and S5'
