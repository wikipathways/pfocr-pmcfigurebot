figure_title: |-
  Multiomic analysis of SMMHCCreERT2;R26RtdTomato;Ren1cYFP
  mice identifies genes and pathways associated with inflammation, fibrosis, extracellular matrix deposition, hypoxia, and a secretory phenotype in RAS inhibited smooth muscle and renin cell populations
caption: (A) UMAP visualization of cell populations with inferred trajectory (orange
  line) showing branch points (gray circles with arrows) and cell fate decisions (black
  circle with exclamation). For each population, a heatmap depicts the top differentially
  expressed genes between untreated (ctrl) and captopril-treated animals. (B) Gene
  signature enrichment scores for the senescence-associated secretory phenotype (SASP),
  inflammation-related genes, hypoxia, and the matrisome. Pathway enrichment analysis
  identified cell adhesion, epithelial-mesenchymal transition, and inflammatory response
  pathways to be elevated in RAS inhibited cells. (NES=normalized enrichment score.
  *=padj < 0.01. P values are calculated from an estimated marginal means linear model
  followed by pairwise comparisons between treated (trt) and untreated (ctrl) cell
  populations with the Benjamini-Hochberg multiple testing procedure correction.)
  (C) Gene regulatory network analysis shows a complex interconnectivity web of genes
  and positive (yellow) and negative (purple) interactions among genes driving the
  differences observed between trajectory cell populations
