figure_title: The central role of NLRP3 inflammasome activation and neutrophil-macrophage
  crosstalk in perpetuating a vicious cycle of inflammation and atherosclerosis progression.
caption: 'The central role of NLRP3 inflammasome activation and neutrophil-macrophage
  crosstalk in perpetuating a vicious cycle of inflammation and atherosclerosis progression.
  Components of NET (dead mitochondria, cell-free DNA, and others) prime macrophages
  and activate the NLRP3 inflammasome, facilitating the production and release of
  various pro-inflammatory cytokines (ILs, TNFα, and others (listed in the magenta
  box)), thereby activating neutrophils to form NET. Similarly, the NLRP3 inflammasome
  in neutrophils has been shown to produce and release IL-1β into the extracellular
  space, thus completing the vicious inflammatory circle (yellow arrows). Other signals
  (such as LPS and ROS) have also been shown to activate the NLRP3 inflammasome in
  both neutrophils and macrophages. In neutrophils, citH3 and the citH3-DNA complex
  up-regulate IL-1β expression and promote NET formation by acting on TLR4. MiR-155
  has been identified as a positive regulator of PAD4, which subsequently positively
  regulates NET formation both directly and indirectly via the NLRP3 inflammasome.
  Both LDL and oxLDL promote NETosis, while NETosis facilitates the oxidation of LDL
  to oxLDL and down-regulates the expression of the oxLDL receptor CD36. HFD activates
  NOD1, which up-regulates the oxLDL receptor LOX1 and down-regulates cholesterol
  efflux genes (ABCA1/G1), thereby increasing oxLDL uptake and accumulation in macrophages.
  Intracellular oxLDL further increases pro-inflammatory cytokine levels via NLRP3
  inflammasome stimulation and facilitates foam cell formation. Positive regulation
  is depicted with green arrows, negative regulation with red blunt lines, and dotted
  arrows represent missing steps in a multi-component signalling pathway. Abbreviations:
  NOD-, LRR- and pyrin domain-containing protein 3 (NLRP3); tumour necrosis factor
  alpha (TNFα); interleukin (IL); lipopolysaccharide (LPS); reactive oxygen species
  (ROS); citrullinated H3 (citH3); toll-like receptor 4 (TLR4); peptidyl arginine
  deiminase 4 (PAD4); oxidised low-density lipoprotein (oxLDL); a cluster of differentiation
  36 (CD36, or fatty acid translocase (FAT)); nucleotide-binding oligomerisation domain
  1 (NOD1); lectin-type oxidised LDL receptor 1 (LOX1); ATP-binding cassette transporter
  A1 (ABCA1); ATP-binding cassette transporter G1 (ABCG1)'
