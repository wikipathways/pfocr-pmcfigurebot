figure_title: Changes in tRNA U34 modifications during ZIKV and SARS-CoV-2 infection.
caption: Changes in tRNA U34 modifications during ZIKV and SARS-CoV-2 infection. (A)
  Schematic representation of a typical tRNA molecule, illustrating the conserved
  secondary structure (cloverleaf) with acceptor stem (amino acid attachment) and
  anticodon loop (mRNA codon recognition). Variable, D, and T loops are also indicated.
  The positions of different modifications are color-coded across the tRNA, while
  the three modifications (mods) at the U34 site are specifically shown in red. (B)
  The enzymatic pathway of chemical modifications occurring at the wobble U34 position
  (ncm5U, mcm5U, and mcm5s2U) involves, successively, the Elongator complex (ELP1-6),
  ALKBH8, and CTU1/2 complex [33]. (C) Changes in tRNA modification levels detected
  in human astrocytes 24 h after ZIKV infection (MOI = 2). (D) Changes in tRNA modification
  levels in SARS-CoV-2 infected Caco2 cells at 24 h post-infection (MOI = 0.2). The
  (C,D) graphs show the log2-fold change in modification levels compared to mock-infected
  controls. Error bars indicate ± SD variations. Histogram of each modification is
  color-coded according to its location in panel (A). Um appears with a color gradient
  since it can be found at different positions (4, 18, 34, and 44)
