figure_title: Targeting immunosuppressive myeloid cells in cancer
caption: CANDI is a cross-linked cyclodextrin material with high accumulation in cancer-associated
  myeloid cells and capable of locally delivering small molecule payloads (Table 1)
  that change the phenotypes of these cells. Key effector molecules in conversion
  include TLR 7/8 agonist resiquimod (R848) in combination with a JAK inhibitors (ruxolitinib)
  and cIAP inhibitors. The extraordinary efficacy of this pathway modulation results
  in supraphysiological IL-12 levels in TAM and DC, jumpstarting the immune response
  by upregulating IFN-γ in CD8, among other mechanisms. Different delivery routes
  have been investigated for glioblastoma(8, 9), including the intracavitary administration
  following resection(10). The latter can lead to long-term effects and result in
  complete cures. Immunosuppressive myeloid cells are common in GBM, hence, they present
  an abundant drug target. Future clinically planned trials will also investigate
  a 17 nm intra-arterial delivery in GBM
article_title: Targeting myeloid cell polarization to prevent GBM recurrence
