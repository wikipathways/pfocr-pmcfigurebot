figure_title: CMA reprograms the metabolic profiles of M1 macrophages.
caption: CMA reprograms the metabolic profiles of M1 macrophages. RAW 264.7 macrophages
  were pretreated with CMA (20 μM) for 1 h, followed by co-treatment with LPS (1 µg/mL)
  for 24 h. (A) Schematic representation of the glucose metabolism pathway. (B) Glucose
  consumption was measured by analyzing glucose levels in the supernatant of RAW 264.7
  macrophages (n = 4). (C) The mRNA level of Glut1 in RAW 264.7 macrophages (n = 3).
  (D) Enzymatic activities of HK, PK, LDH, and PDH in RAW 264.7 macrophages (n = 3).
  (E, F) Lactate production in the supernatants (n = 4) and intracellular ATP levels
  (n = 3) of RAW 264.7 macrophages. (G, H) OCR traces and quantification of mitochondrial
  respiration parameters in the Seahorse mitochondrial stress test (n = 3). (I, J)
  ECAR traces and quantification of glycolysis and glycolytic capacity in the Seahorse
  glycolysis stress test (n = 3). Data presented as mean ± SD, *P < 0.05, **P < 0.01
