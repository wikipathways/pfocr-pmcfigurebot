figure_title: Molecular mechanisms of JA and other hormones’ crosstalk in Arabidopsis
  thaliana.
caption: 'Molecular mechanisms of JA and other hormones’ crosstalk in Arabidopsis
  thaliana. (A) Molecular mechanisms of jasmonic acid and ABA crosstalk. JAZ proteins
  and the MYC2 transcription factor are key nodes in crosstalk, regulating plant growth
  and development, defense processes, and responses to abiotic and biotic stresses.
  RD22: a drought-responsive gene; PDF1.2: a pathogen defense gene; VSP1: a herbivory
  defense gene; RAP2.6: a transcription factor involved in the wound healing process.
  (B) Molecular mechanisms of jasmonic acid and auxin crosstalk. JAZ proteins, MYC2,
  and ARF transcription factors are key nodes in crosstalk, regulating plant growth
  and development, particularly root development, as well as defense responses. PIF4:
  involved in light signaling and growth regulation; ASA1/YUCCA: genes related to
  auxin biosynthesis; GH3: a gene regulating jasmonate homeostasis; DAD1: a gene involved
  in jasmonate biosynthesis. (C) Molecular mechanisms of jasmonic acid and GA crosstalk.
  JAZ proteins and DELLA proteins are key nodes in crosstalk, regulating plant growth
  and development, particularly floral development, as well as defense responses.
  PIFs (phytochrome interacting factors): transcription factors that regulate hypocotyl
  elongation in plants; SOC1 (Suppressor of Overexpression of Constans 1): a regulator
  of flowering in plants; DAD1/LOX (lipoxygenase): genes involved in the biosynthesis
  of JA. (D) Molecular mechanisms of jasmonic acid and ethylene crosstalk. JAZ proteins,
  MYC2, and EIN3 transcription factors are central nodes in crosstalk, regulating
  plant growth and development, as well as defense responses. HLS1: a transcription
  factor involved in hook development; MED25: a key subunit involved in plant hormone
  signaling and the regulation of gene expression; BIG: a protein involved in hormone
  responses; ANAC019/055: NAC transcription factors that participate in plant stress
  and defense responses. (E) Molecular mechanisms of jasmonic acid and SA crosstalk.
  The MYC2 transcription factor and the NPR1 receptor are key nodes, primarily involved
  in regulating plant defense responses. ICS1: a gene related to the biosynthesis
  of SA; BSMT1: a gene encoding a key enzyme in SA metabolism; LHP1: a key member
  of the Polycomb histone complex, involved in the repression of gene expression;
  OZF1: a positive regulator in the SA signaling pathway. (F) Key regulatory nodes
  in Arabidopsis'
