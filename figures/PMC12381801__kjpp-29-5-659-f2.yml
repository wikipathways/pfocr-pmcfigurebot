figure_title: The effect of procyanidin B2 (PB2) through liver kinase B1 (LKB1)-AMP-activated
  protein kinase (AMPK) signaling pathway in vascular smooth muscle cells (VSMCs)
caption: '(A) A549 and VSMCs were treated with PB2 (20 μM) for 1 h. Protein levels
  of p-LKB1, LKB1, p-AMPK, and AMPK were determined by Western blot analysis. (B)
  After transfection with control or LKB1 siRNA, cells were pretreated PB2 (20 μM,
  1 h) and then incubated with platelet-derived growth factor-BB (PDGF-BB) (10 ng/ml,
  24 h). (C) Cells stained with anti-LKB1 (green) and To-Pro-3 (red) were observed
  under a confocal laser-scanning microscope. Yellow staining indicates the overlap
  of the two colors (×200). (D) Transfected cells with control or LKB1 siRNA were
  measured cell proliferation by MTT assay. Values are mean ± SEM (n = 3); *p < 0.05
  vs. control, **p < 0.05 vs. PDGF-BB alone, #p < 0.05 vs. PDGF-BB + PB2'
article_title: Procyanidin B2-induced LKB1-AMPK activation mitigates vascular smooth
  muscle cell proliferation through inhibition of mTOR signaling
