figure_title: Viral experiments confirm changes in STSD of hyperdirect pathway impact
  DLEP time dynamics
caption: 'A. AAV was injected throughout the motor cortex (MC) of rats and MEAs were
  implanted at the STN. By injecting AAV at the MC and stimulating/recording at the
  STN, we can specifically investigate the hyper-direct pathway projections from MC
  to STN. This figure was created with BioRender.com. B. All viruses included an EGFP
  reporter. Left: AAV was injected throughout the MC. The dotted line identifies the
  MC. Right: MC projections reach the distant ipsilateral STN. Inset: dotted lines
  identify the STN. C-E. Representative figures showing the DLEP waveforms (C), latency
  (D), and amplitude (E) over time for a rat virally transduced with EGFP. F-H. Representative
  DLEP waveforms, latency plot, and amplitude plot for a rat transduced with endophilin
  A1. I-K. Representative DLEP waveforms, latency plot, and amplitude plot for a rat
  transduced with alpha-synuclein. L-M. The τ values calculated for EGFP, endophilin
  A1, and alpha-synuclein transduced animals. The latency τ (L) is significantly different
  between EGFP and endophilin A1 (one-way ANOVA: F2,18 = 7.17, p < 0.01, Cohen’s F
  = 0.89; Tukey’s HSD post-hoc test; EGFP vs. endophilin A1: p < 0.01, Cohen’s D =
  1.72; EGFP vs. alpha-synuclein: p = 0.103, Cohen’s D = 1.07; n = 7 rats per group).
  The amplitude τ (M) is significantly different between EGFP and endophilin A1 (one-way
  ANOVA: F2,18 = 16.51, p < 0.0001, Cohen’s F = 1.35; Tukey’s HSD post-hoc test; EGFP
  vs. endophilin A1: p < 0.0001, Cohen’s D = 2.65; n = 7 rats per group) and between
  EGFP and alpha-synuclein (EGFP vs. alpha-synuclein: p < 0.01, Cohen’s D = 2.20;,
  n = 7 rats per group). **p ≤ 0.01, ****p ≤ 0.0001'
