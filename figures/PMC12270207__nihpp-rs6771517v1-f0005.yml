figure_title: P2RX7 regulates tauopathy-induced conversion of microglia to an inflammatory
  phenotype
caption: a, Uniform manifold approximation and projection (UMAP) plot representation
  of microglial subclusters. b, Stacked bar plot showing the subcluster compositions
  of microglia in WT, PS19 and PS19/P2rx7−/−. c, UMAP representation of microglial
  subclusters across genotypes. Subcluster annotation is indicated by the colors shown
  in b. d, Box and whisker plot comparing microglial subclusters among genotypes.
  e, Phenotypic trajectory analysis of microglia obtained by unbiased pseudotime ordering
  using Monocle3. The dashed lines are colored according to each cluster, as shown
  in a. f, Normalized average expression showing the expression of P2rx7 in microglial
  subclusters. g, Selection of the top DEGs and homeostatic genes enriched in each
  cluster. h, Number of DEGs regulated by P2rx7 deficiency in each microglial cluster
  in PS19 mice. i, Volcano plot showing DEGs regulated in FRM cluster from PS19/P2rx7−/−
  mice. j, Ingenuity pathway analysis (IPA) of canonical pathways in FRM cluster from
  PS19/P2rx7−/− mice. k, IPA of the top predicted upstream regulators in FRM cluster
  from PS19/P2rx7−/− mice. l, Normalized average expression of inflammatory and EV
  genes in InfM cluster. m, UMAP plot representation of Cd9 expression in microglia
  clusters InfM (orange), DAM (magenta) and IRM (red). All bar graphs represent the
  mean ± SEM; *P < 0.05, **P < 0.01 and ***P < 0.001
