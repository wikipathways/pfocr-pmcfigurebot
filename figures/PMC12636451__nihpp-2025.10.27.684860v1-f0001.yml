figure_title: Transcriptomic analysis tau0N3R-expressing Drosophila brains reveals
  enrichment for pathways related to neurodegeneration and glycolytic upregulation
caption: (A) PCA of normalized gene expression (TPM) from larval brains from tubulin>tau0N3R
  (red) and parental controls (tubulin-GAL4/+, green; UAS-tau0N3R/+, purple). Specification
  of two clusters in k-means clustering revealed separation of tau0N3R-expressing
  (red) and control (cyan) transcriptomes across PC1.(B) Volcano plots showing DEGs
  in tubulin>tau0N3R brains relative to UAS-tau0N3R/+ (left) and tubulin-GAL4/+ (right).
  Upregulated genes (teal), downregulated genes (magenta), and non-significant genes
  (adjusted P-value ≥ 0.05, gray) are indicated.(C) Scatter plot comparing log2 fold
  changes of DEGs identified relative to each control line. High concordance (slope
  ~ 1) and 99.5% directional consistency demonstrate robust, genotype-specific transcriptional
  changes.(D) Heatmap of 4,519 high-confidence DEGs showing distinct clustering of
  tau0N3R samples (magenta bars) from controls (purple and green bars). Color intensity
  in heatmap represents transcript abundance (TPM, normalized by row).(E) Enrichment
  analysis of tau0N3R DEGs among genetic modifiers of Drosophila models of human diseases.
  Diseases are ranked by their enrichment score (odds ratio × −log10 adjusted P-value).
  Four of five are neurodegenerative disorders with enrichment scores dropping exponentially
  (R2 = 0.99, fit to exponential decay curve).(F) Expression changes of genes encoding
  PLCβ-coupled GPCRs, PLCβ paralogs, IP3R (itpr), and signal termination components
  (IP3 kinase-1 and β-arrestin). Heatmap shows log2 fold changes; upregulated genes
  (magenta) include signaling activators, while downregulated genes (green) include
  terminators.(G) Venn diagram showing overlap between human orthologs of tau0N3R
  DEGs (green, 3,142 genes) and genes associated with Alzheimer's disease from DisGeNET
  database (blue, 2,421 genes). Overlap of 419 genes represents ~17% of AD-associated
  genes. Fisher’s exact test shows significant overlap.(H) Gene Ontology enrichment
  analysis of upregulated DEGs shared between brains of animals expressing tau0N3R
  and those overexpressing itpr. Bar length represents fold enrichment; color intensity
  indicates FDR
article_title: Neuronal glycolytic reprogramming drives lethality via accelerated
  aging in a Drosophila model of tauopathy
