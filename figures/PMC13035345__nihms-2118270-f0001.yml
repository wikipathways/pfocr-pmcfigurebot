figure_title: Design and characterization of a secretable SARS-CoV-2 RBD nanoparticle
caption: (A) Schematic of the biogenesis of secreted RBD nanoparticles using mRNA-LNP
  as an example for method of delivery. The secretory pathway has been omitted for
  simplicity. UTR, untranslated region; SP, signal peptide; 16 GS, 16-residue glycine/serine
  linker. The protein models and schematic were rendered using ChimeraX (82) and BioRender.com,
  respectively. (B) Size exclusion chromatogram of Rpk9-I3–01NS purification. (C)
  Dynamic light scattering of SEC-purified Rpk9-I3–01NS. Dh, hydrodynamic diameter;
  PDI, polydispersity index. (D) Representative electron micrograph (scale bar = 50
  nm) of negatively stained SEC-purified Rpk9-I3–01NS and 2D class averages (scale
  bar = 33 nm). (E) Binding of immobilized hACE2-Fc, CR3022, and S309 to SEC-purified
  Rpk9-I3–01NS as assessed by biolayer interferometry. The dotted vertical line separates
  the association and dissociation steps
article_title: Computationally designed mRNA-launched protein nanoparticle immunogens
