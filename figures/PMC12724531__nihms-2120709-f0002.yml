figure_title: Representation of upper extremity hand, forearm, and upper arm deep
  and perforating lymphatic vessel anatomy.
caption: Representation of upper extremity hand, forearm, and upper arm deep and perforating
  lymphatic vessel anatomy. The deep lymphatic vessel of the hand is the deep palmar
  arch pathway. Deep lymphatic vessels of the forearm include the radial, ulnar, anterior
  interosseus, and posterior interosseus pathways. Deep lymphatic vessels of the upper
  arm include the brachial and deep brachial pathways. Regions circled in red represent
  two sites where perforating lymphatic vessels have been consistently described in
  the upper extremity lymphatic system. Perforating vessels in the antecubital fossa
  may drain directly from the superficial to deep lymphatic systems or may drain from
  epitrochlear lymph nodes in the superficial system
