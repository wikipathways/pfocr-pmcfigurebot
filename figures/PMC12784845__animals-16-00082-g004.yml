figure_title: Effect of dietary LR supplementation on relative mRNA expression of
  inflammation-related pathway and cytokine genes in jejunal and ileal mucosa of E.
caption: 'Effect of dietary LR supplementation on relative mRNA expression of inflammation-related
  pathway and cytokine genes in jejunal and ileal mucosa of E. coli-infected broilers.
  The relative mRNA expression of TNF-α, IL-10 and TGF-β in jejunum (A) and ileum
  (B) were determined. The relative mRNA expression of MyD88 and NOD1 in jejunum (C)
  and ileum (D) were determined. a,b Different superscripts indicate that the difference
  between the groups was statistically significant (p < 0.05), and the data are expressed
  as mean ± SD. CTR—control group; E. coli—the broilers were challenged with E. coli;
  LR + E. coli—the challenged broilers were fed a basal diet supplemented with L.
  reuteri postbiotics. Each value represents the mean of 6 replicates per treatment
  (n = 12). Abbreviation: LR—Lactobacillus reuteri postbiotics; TNF-α—tumor necrosis
  factor-α; IL-10—interleukin-10; TGF-β—transforming growth factor-β; MyD88—myeloid
  differentiation primary response protein; NOD1—nucleotide-binding oligomerization
  domain containing 1'
