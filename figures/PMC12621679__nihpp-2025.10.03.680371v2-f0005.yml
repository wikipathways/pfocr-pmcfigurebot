figure_title: GDCA suppresses stress-response genes and remodels chromatin in the
  brain.
caption: 'GDCA suppresses stress-response genes and remodels chromatin in the brain.
  (A) All significantly enriched terms from gene set enrichment analysis (GSEA) based
  on hallmark gene sets; full results in Supplementary Table 8. (B) All significantly
  enriched terms from GSEA using the REACTOME pathway database; full results in Supplementary
  Table 8. (C) Volcano plot of differential chromatin accessibility between GDCA-treated
  and vehicle control mouse brains, based on ATAC-seq of flash-frozen right hemispheres
  from the initial RNA-seq cohort (see Methods). Y-axis: −log10(adjusted p-value)
  from DESeq2; x-axis: log2FoldChange vs. vehicle control. Purple dots represent genomic
  peaks with higher accessibility in brains from GDCA-exposed mice (adjusted p ≤ 0.1
  and positive log2FoldChange). Teal dots represent genomic peaks with lower accessibility
  in brains from GDCA-exposed mice (adjusted p ≤ 0.1 and negative log2FoldChange).
  (D) Coverage heatmap for the 200 genomic peaks that were significantly less accessible
  in brains from GDCA-exposed mice, vs. control. Each row represents one peak. BAM
  files for individual brains within each condition were merged prior to visualization
  (Methods). CPM = counts per million. (E) Observed versus expected proportions of
  differentially accessible peaks overlapping various genomic features. Expected proportions
  were calculated based on the reference genome. Introns and promoters are significantly
  enriched among differential peaks, whereas intergenic regions are depleted. The
  symbol * indicates p < 0.05 and *** indicates p < 0.001. p-values were calculated
  by HOMER using a one-sided binomial test (upper-tailed when observed > expected
  and lower-tailed when observed < expected). (F) Transcription factor (TF) motifs
  with the highest variability in accessibility across ATAC-seq samples, as quantified
  by chromVAR96. Dots represent point estimates of motif variability and horizontal
  lines indicate the corresponding 95% bootstrap confidence intervals. The color scale
  shows the significance of variability as −log10(adjusted p-value from chromVAR).
  To facilitate visualization, −log10(padj) values were capped at 200; the true padj
  for the variability of MA0007.4_Ar across samples is 0'
