figure_title: The effect of treatment with high salt diet for 4 weeks on systolic
  blood pressure and 24-h urinary sodium excretion in adult male WT, PT-Agtr1a−/−,
  PT-Nhe3−/−, and PT-Agtr1a−/−/PT-Nhe3−/− mice.
caption: The effect of treatment with high salt diet for 4 weeks on systolic blood
  pressure and 24-h urinary sodium excretion in adult male WT, PT-Agtr1a−/−, PT-Nhe3−/−,
  and PT-Agtr1a−/−/PT-Nhe3−/− mice. High salt treatment for 2 weeks significantly
  increased the natriuretic response, but had no significant effects on systolic blood
  pressure in adult male WT (A), PT-Agtr1a−/− (B), PT-Nhe3−/− (C), and PT-Agtr1a−/−/PT-Nhe3−/−
  mice (D), suggesting that the proximal tubule AT1a/NHE3 signal pathway unlikely
  plays an important role in the development of high salt-induced hypertension. ***P<0.001
  or ****P<0.0001 vs. Control
