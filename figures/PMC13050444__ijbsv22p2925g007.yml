figure_title: TRIM29 dually activates the PI3K-AKT signaling pathway to promote chondrocyte
  senescence.
caption: TRIM29 dually activates the PI3K-AKT signaling pathway to promote chondrocyte
  senescence. A, B) Schematic representation of molecular docking simulations between
  TRIM29 and PIK3R1 or EGFR. C) Docking scores and confidence scores for the molecular
  interactions between TRIM29 and PIK3CA, PIK3CB, PIK3R1, PIK3R2, or EGFR. D-F) Co-IP
  assays detecting the interaction between TRIM29 and PIK3CA, PIK3R1 or EGFR. G, H)
  Western blotting was used to detect changes in the expression levels of the PI3K-AKT
  pathway and autophagy activity (n=3). I, J) SA-β-Gal staining showing the effect
  and regulatory mechanism of TRIM29 overexpression on chondrocyte senescence (n=3).
  K, L) Immunofluorescence analysis of the senescence marker P21 confirmed the effect
  and mechanism of TRIM29 overexpression on chondrocyte senescence (n=3). M) ELISA
  analysis of SASP components in chondrocytes to evaluate the effect and regulatory
  mechanism of TRIM29 overexpression on cellular senescence (n=3). N) Diagram of TRIM29-mediated
  dual activation of the PI3K-AKT signaling pathway, which was created via Biorender
  with permission for publication (n=3). *P < 0.05, **P < 0.01, ***P < 0.001
