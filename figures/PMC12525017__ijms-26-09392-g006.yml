figure_title: SIRT1 overexpression and EVs modulate the relative mRNA and protein
  expression levels of SIRT1/SREBP−1c/PGC−1α pathway−related genes in hepatocytes.
caption: SIRT1 overexpression and EVs modulate the relative mRNA and protein expression
  levels of SIRT1/SREBP−1c/PGC−1α pathway−related genes in hepatocytes. (a) Effects
  of SIRT1 overexpression and EVs on mRNA relative abundance of SIRT1−SREBP−1c/PGC−1α
  pathway−related genes in normal and 2.4 mM−NEFA treated hepatocytes. (b,c) Effects
  of SIRT1 overexpression and EVs on the relative abundance of SIRT1/SREBP−1c/PGC−1α
  pathway-related proteins in untreated (normal) hepatocytes and those treated with
  NEFAs at 2.4 mM. (d,e) The relative protein levels were quantified in the normal
  hepatocytes and the cells treated with NEFAs at 2.4 mM using ImageJ 2.0.0−rc−30.
  The level of β-actin was used to normalize the relative protein expression. NK,
  Non-ketosis. CK, Clinical ketosis. Results are presented as the mean ± SD (n = 3).
  * p < 0.05 and ** p < 0.01 vs. the blank group (BG). Empty carrier group (EG); SIRT1-overexpression
  group (SG); 40 μg/mL NK−derived EVs (NK40); 40 μg/mL CK−derived EVs (CK40). Typical
  images of Western blotting are shown
