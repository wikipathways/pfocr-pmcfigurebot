caption: Overview of KRAS signaling under normal and mutated conditions, Created in
  BioRender. Han, D. (2025) https://BioRender.com/6ly19j1. In normal cells, when EGFR
  is bound to its ligand, it is phosphorylated. Then, it activates RAS with GTP. When
  RAS is bound to GTP, it activates the downstream MAPK pathway, leading to cell proliferation,
  survival, and differentiation. When RAS is mutated, RAS is bound to GTP independent
  of EGFR, and the MAPK pathway is constitutively activated, leading to tumor growth.
  Since RAS is activated independently of EGFR, it will result in resistance to anti-EGFR
  treatments
