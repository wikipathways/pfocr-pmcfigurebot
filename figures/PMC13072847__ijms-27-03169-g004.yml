figure_title: ATP activates the TGF-β signaling pathway and promotes the TRM phenotype
  in Tc9 cells in a subset-specific manner.
caption: ATP activates the TGF-β signaling pathway and promotes the TRM phenotype
  in Tc9 cells in a subset-specific manner. (A) Gene Set Enrichment Analysis (GSEA)
  plots demonstrating significant downregulation of the DNA replication and Cell cycle
  gene sets in tumor-infiltrating Tc9 cells compared to Tc1 cells. (B) Heatmap of
  RNA-seq data showing the expression levels of TRM cell signature genes in endogenously
  sorted Tc1 and Tc9 populations in tumor [31]. (C) Schematic of the in vitro differentiation
  and stimulation protocol for generating Tc1 and Tc9 cells from naive CD8+ T cells
  (Tc1 cells were induced with IL-2 alone). (D,E) Representative flow cytometry plots
  showing the co-expression of the surface markers CD69 and CD103 on in vitro-differentiated
  Tc9 cells at early (day 3) and late (day 10) time points after initiation of differentiation
  treated with ATP or not. (F,G) Quantification of the percentage of CD69+ CD103+
  T cells at the indicated time points in different groups. (H,I) Quantitative PCR
  analysis of mRNA expression of TRM-associated genes (Itgae and Runx3) in Tc9 cells
  cultured with or without ATP. (J,K) Representative plots and quantification showing
  the MFI of p-Smad2/3 in Tc1 and Tc9 cells on day 10 treated with ATP and Ctrl. (L–P)
  Quantitative PCR analysis of mRNA expression of TGF-β signaling pathway related
  genes (Tgfbr1, Tgfbr2, Smad2, Smad3 and Smad4) in Tc9 cells on day 10 (n = 3 biologically
  independent replicates, each derived from naive CD8+ T cells isolated from individual
  mouse spleens). Data are presented as mean ± SEM. * p < 0.05, ** p < 0.01, *** p
  < 0.001, **** p < 0.0001
