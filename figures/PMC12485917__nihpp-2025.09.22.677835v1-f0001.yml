figure_title: Generating motor neurons from primary fibroblasts via reprogramming
  and neural differentiation/maturation
caption: 'a) Brightfield images of three different cell-types (scale bar=100 μm).b)
  Schematic view of neural differentiation from IPSCs into motor neuron and motor
  neuron maturation. IPSCs are treated with listed small molecules for 14 days. At
  day 14, cells were dissociated and sorted. NCAM+ and EPCAM− cells (population highlighted
  in red) were collected and plated as immature post-mitotic neurons that were cultured
  6 more weeks for maturation (SB-431542: TGF-beta/Smad inhibitor; LDN-193189: BMP
  pathway inhibitor; RA: retinoic acid; SAG: Smoothened agonist; DAPT: γ-secretase
  inhibitor; SU-5402: FGFR1 inhibitor; BDNF: brain-derived neurotrophic factor; GDNF:
  glial-derived neurotrophic factor; CNTF: ciliary neurotrophic factor.c) Schematic
  view of the study design: primary fibroblasts of two healthy controls and two ALS
  patients with C9orf72 mutation were reprogrammed into IPSCs. Two independent IPSC
  clones for each line were picked for neural differentiations. Hi-C and RNA-seq libraries
  were prepared for each clone.d) TPM counts of PF related genes were shown for PF
  (red), IPSC (salmon) and MN (blue) cell-types.e) TPM counts of IPSC related genes
  were shown for PF, IPSC and MN cell-types.f) TPM counts of MN and glial related
  genes were shown for PF, IPSC and MN cell-types'
article_title: Dynamic changes in chromosome and nuclear architecture during maturation
  of normal and ALS C9orf72 motor neurons
