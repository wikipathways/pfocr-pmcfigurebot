figure_title: Core molecular pathways regulating ferroptosis.
caption: 'Core molecular pathways regulating ferroptosis. (a) Iron Metabolism: Iron
  uptake and ferritinophagy expand the labile Fe2+ pool, which drives reactive oxygen
  species (ROS) production via the Fenton reaction. (b) Lipid Metabolism: Polyunsaturated
  fatty acids (PUFAs) are incorporated into membrane phospholipids by ACSL4 and LPCAT3,
  creating vulnerable substrates for peroxidation. (c) Antioxidant Defense: The System
  Xc−–GSH–GPX4 axis is the key defense mechanism, where GPX4 uses glutathione (GSH)
  to neutralize lipid peroxides. This pathway can be blocked by inhibitors like erastin
  and RSL3, leading to lipid peroxidation and ferroptosis'
