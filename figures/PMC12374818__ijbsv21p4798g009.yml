figure_title: Graphical summary of the effect and mechanism of triptolide on LCSCs.
caption: Graphical summary of the effect and mechanism of triptolide on LCSCs. The
  schematic illustrates a pivotal signaling axis, MAZ/SETD1B/CD24, which is essential
  for maintaining the stem-like properties of LCSCs. In this pathway, the transcription
  factor MAZ upregulates SETD1B, which promotes tumorigenicity via the downstream
  effector CD24. Targeting this molecular cascade with the therapeutic agent triptolide
  effectively eradicates LCSCs, leading to marked inhibition of HCC progression
article_title: Histone Methyltransferase SETD1B Maintains Cancer Stem Cell Niche by
  Regulating the Crosstalk between CD24 and Surface Adhesion Molecules in Hepatocellular
  Carcinoma
