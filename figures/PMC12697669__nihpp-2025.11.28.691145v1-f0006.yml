figure_title: The glutathione and TOR-Ypk1 pathways buffer C. neoformans against CO2-induced
  ROS accumulation
caption: 'A. Competitive fitness was determined for indicated strains after combining
  a 1:1 ratio of mNeonGreen labeled H99 and unlabeled mutant cells in RPMI 1640 medium
  with 165mM MOPS at pH 7 and incubating at 37°C in ambient air or 5% CO2 for 24 hr.
  Cell populations were characterized by flow cytometry and the percentage of mNeonGreen
  negative cells in 5% CO2 was divided by those in ambient conditions to calculate
  competitive fitness. Bars represent the average of three biological replicates with
  error bars indicating SD. Asterisks indicate a significant difference relative to
  H99 as determined by Student’s t-test (P < 0.05). B. Schematic of the glutathione
  biosynthesis pathway in C. neoformans. Genes required for CO2 fitness are indicated
  in red. C. The metabolic profile of H99 grown for 24 hr in ambient air or 5% CO2
  was analyzed by tandem mass spectrometry. Data were processed and are presented
  for homoserine as normalized area. The normalized area of each metabolite was determined
  by tandem mass spectrometry as described in materials and methods for H99 incubated
  in buffered RPMI in ambient air or 5% CO2. Asterisks indicate statistically significant
  differences in abundance at 5% CO2 relative to ambient air (Welch corrected two-tailed
  t test, p <0.05). D. Competitive fitness of the glutathione biosynthesis pathway
  mutants was determined as in (A) with the following modification: cells were grown
  in RPMI 1640 medium with 165mM MOPS at pH 7 alone or with the addition of 200 μM
  cysteine or 1 mM glutathione for 24 hr in 5% CO2. The percentage of mNeonGreen negative
  cells in media with supplement was divided by the percentage of mNeonGreen negative
  cells without supplement to determine competitive fitness. Bars indicate the average
  of three biological replicate with error bars indicating SD. Asterisks indicate
  a significant difference relative to H99 as determined by Student’s t-test (P <
  0.05). E&F. ROS activity of indicated strains after growth in ambient air or 5%
  CO2 for 24hr was assessed by DCFDA fluorescence assay. The average MFI of three
  biological replicates for each strain and condition is represented with error bars
  indicating SD. Asterisks indicate a significant difference as determined by one-way
  ANOVA with Sidak’s multiple comparisons test (P < 0.05)'
article_title: Cryptococcus neoformans adapts to host CO2 concentrations through the
  coordinated remodeling of central carbon metabolism, oxidative stress resistance,
  and membrane homeostasis
