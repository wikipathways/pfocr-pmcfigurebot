figure_title: Functional validation of AHNAK
caption: '(A) The overall experiment design and workflow for functional validation
  of AHNAK using human iPSC-derived astrocytes and their 5xFAD-mouse neuron co-cultures.(B
  and C) Downregulation of AHNAK in human iPSC-derived astrocyte culture. Levels of
  AHNAK (B) and pTau (C) (detected by AT270) were examined in APOE 44 AD human iPSC-derived
  astrocytes in the presence of scramble (ctrl) or AHNAK shRNA knockdown (KD) virus
  treatment. Results were presented as % of controls with levels in iPSC-derived astrocytes
  from samples treated with scramble ctrl conditions as 100%. n = 21–27/condition
  in (B) and n = 23–25/condition in (C). ****p < 0.0001, ***p < 0.001, **p < 0.01
  with independent-samples t test.(D) Left: MEA representative raster plots over 10
  min; right: spike analysis of 5xFAD primary cortical neurons co-cultured with lentivirus-containing
  AHNAK shRNA or scramble-shRNA (shScr)-transfected APOE 44 human iPSC-derived astrocytes,
  respectively. The raster plot indicates the neuronal activity of spiking, bursting,
  and synchrony. Unpaired t test compares the means of the numbers of spikes between
  the AHNAK shRNA and scrambled groups (N = 17–19 wells/condition). *p < 0.05 with
  independent-samples t test.(E) GSEA plot showing the enrichment trend of the AHNAK-regulated
  protein signatures in its neighborhood in the PHG proteomics MEGENA network (up
  to 3-walk, undirected). NES, normalized enrichment score.(F) AHNAK-regulated signaling
  pathway map based on GO biological process (BP) hierarchy (see STAR Methods for
  details). Each node denotes a GO/BP term that is significantly enriched for the
  AHNAK KD signature and is proportional to its enrichment p value (adjusted p < 0.05).
  The color of each node stands for the directionality of enrichment: blue and red
  for suppressed and activated, respectively. Each outlining circle represents a large
  functional cluster of GO BP terms. See also Figure S5 and Table S6, pages 2–11'
