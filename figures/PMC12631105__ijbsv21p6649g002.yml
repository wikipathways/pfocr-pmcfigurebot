figure_title: Identification and functional analysis of intratumoral malignant meta-programs
  in UC.
caption: 'Identification and functional analysis of intratumoral malignant meta-programs
  in UC. (A) UMAP plot showing nine cell types identified from tumor samples. (B)
  UMAP plot highlighting copy number variation (CNV) scores across all cells. (C)
  UMAP visualization of CNV status across all cells. (D) Heatmap showing the Jaccard
  similarity index of robust NMF programs, hierarchically clustered into seven meta-programs
  (MPs). (E) Heatmap illustrating biological pathway enrichment of the seven MPs.
  (F) Bubble plot displaying the expression levels of 30 signature genes associated
  with MP5. (G) Bar plots comparing the scores of the seven MPs across different groups.
  Colored dots represent individual samples. Statistical significance is indicated
  by asterisks (*P ≤ 0.05, **P ≤ 0.01, ***P ≤ 0.001), and “ns” indicates no statistical
  difference. (H) Spearman correlations between MP5 scores and T-cell proportions
  in tumor samples. (I, J) Spearman correlations between MP5 scores and phenotype
  signature scores in tumor samples: (I) luminal scores; (J) basal scores. (K) Bar
  plot comparing MP5 scores across three immune subtypes (Inflamed, Excluded, and
  Desert) in the IMvigor210 cohort. (L) Spatial feature plots showing H&E-staining
  images (top) and MP5 signature scores (bottom) in tumor tissue sections across molecular
  subtype. Specifically, the UCB01 sample was obtained from the publicly available
  dataset (GSE171351)'
