figure_title: TAGP enhances the degradation of β-catenin via a proteasomal degradation
  pathway
caption: (A) From HEK293-FL reporter cells treated with either DMSO or the indicated
  concentration of TAGP in the presence or absence of Wnt3a-CM for 15 h, cytosolic
  proteins were prepared and subsequently subjected. (B) Semi-quantitative RT-PCR
  was conducted to measure the levels of β-catenin and GAPDH using total RNA extracted
  from HEK293-FL reporter cells treated with either DMSO or the specified concentration
  of TAGP, with or without Wnt3a-CM, for 15 h. The levels of β-catenin mRNA were normalized
  to GAPDH levels. (C) Cytosolic proteins were prepared from HEK293-FL reporter cells
  treated with TAGP (10, 20, or 40 μM) in the presence of Wnt3a-CM for 15 h. Results
  of western blotting using an anti-non-phospho-β-catenin antibody. (D) HEK293-FL
  cells treated with TAGP were exposed to MG-132 (10 μM) for 8h. Cytosolic proteins
  were detected using an anti-β-catenin antibody. The levels of β-catenin and non-phosphorylated
  β-catenin were normalized to those of β- actin (A, C, and D). The results are expressed
  as mean ± SD of three independent experiments. *, p < 0.05 and **, p < 0.01 compared
  with the Wnt3a-treated vehicle control group
