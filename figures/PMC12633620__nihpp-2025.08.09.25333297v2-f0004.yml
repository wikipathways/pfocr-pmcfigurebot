figure_title: Application of BSNmani of IMC breast cancer dataset
caption: 'a) Model predictive performance (C-index) across latent subnetworks q =
  2 to 8 using the hdWGCNA + BSNMani pipeline. b-c) Kaplan-Meier survival curves stratified
  by predicted risk groups from Cox-PH modeling, using BSNMani (b) or clinical variable
  only (c) model. d-e) Heatmaps and pathway enrichment bubble plots for each of the
  two latent co-expression subnetworks (q = 2) extracted by BSNMani. f) Network visualization
  of key gene hubs and their connections across subnetworks (red edge: activated;
  blue edge: suppressed). g) Heatmap of clinical covariates (age, grade) and λ-subnetwork
  covariates across patients, stratified by overall survival status (alive vs. dead)
  and overall survival time (OS months)'
