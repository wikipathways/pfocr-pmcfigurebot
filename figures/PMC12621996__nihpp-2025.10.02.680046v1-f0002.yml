figure_title: Compass-based analysis of tuft cell metabolism in mice modeling unrepaired
  and repaired microbiomes
caption: A. Bar plot showing the number of metabolic reactions with significantly
  altered flux, as predicted by Compass, shared between donor 1 and donor 2 experiments.
  Data are presented for each segment of small intestine, including duodenal, jejunal,
  and ileal regions. B. Heatmap representing the normalized number of Compass-predicted
  forward metabolic reactions with significantly altered flux that are shared between
  donor 1 and donor 2 experiments. Data are presented for select Recon2 metabolic
  subsystems in tuft cells and goblet cells from duodenum, jejunum and ileum. The
  blood group synthesis subsystem includes glycosylation reactions that are also involved
  in mucin glycosylation, as indicated by the parenthesis. Red indicates the normalized
  number of reactions with increased flux in the repaired arm while black indicates
  the normalized number of reactions with increased flux in the unrepaired arm. Color
  density represents the number of reactions with significantly increased flux in
  a given Recon2 subsystem within a specific cell type of an experimental arm, normalized
  to the total number of such reactions across all epithelial cell clusters in the
  same arm. C. Top panel is a schematic of tuft cell metabolic pathways predicted
  by Compass to exhibit significantly altered flux in response to unrepaired and repaired
  microbiomes. These pathways include arachidonic acid synthesis, prostaglandin synthesis
  (via the cyclooxygenase pathway), and leukotriene synthesis (via the lipoxygenase
  pathway). Bottom panel is a schematic representation of metabolic pathways involved
  in PIP2 synthesis and GPCR-phospholipid signaling in tuft cells, which facilitate
  the release of eicosanoid immune effectors. Enzyme group a includes Pikfyve, Pip4k2a,
  Pip4K2b, Pip4K2c, Pip5k1a, Pip5k1b, Pip5k1c. Enzyme group b includes Hcst, Pik3c2a,
  Pik3c2b, Pik3c2g, Pik3ca, Pik3cb, Pik3cd, Pik3cg, Pik3r1, Pik3r2, Pik3r3, Pik3r5.
  Enzymes group c includes Plcb1, Plcb2, Plcb3, Plcb4, Plcd1, Plcd3, Plcd4, Plce1,
  Plcg1, Plcg2, Plch1, Plch2, Plcl1, Plcxd2, Plcz1. Enzyme group d includes Inpp5a,
  Inpp5b, Inpp5d, Inpp5e, Inpp5j, Inppl1, Synj1. Green arrows indicate shared reactions
  with significantly increased flux in duodenal, jejunal, and ileal tuft cells of
  the “unrepaired” arm in both donor 1 and donor 2 experiments. Grey arrows represent
  reactions without significant flux changes. Black arrows denote the signal transduction
  cascade associated with GPCR-phospholipid signaling. Blue text highlights the eicosanoid
  immune effectors synthesized in tuft cells. Green texts represent enzymes involved
  in catalyzing the metabolic reactions
