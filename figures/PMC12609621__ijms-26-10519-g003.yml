figure_title: AMPK limits MNNG-induced parthanatos mediated by a BAX/BAK-independent
  pathway.
caption: 'AMPK limits MNNG-induced parthanatos mediated by a BAX/BAK-independent pathway.
  (A) AMPKα1-reconstituted HT1080 cells were stimulated with 30 μM MNNG for the indicated
  periods. Cell death rate was defined as the percentage of cells with higher PI fluorescence
  values than when unstimulated. Data shown are the mean ± SEM (n = 3). *** p < 0.001,
  ** p < 0.01, * p < 0.05, N.S.: not significant [vs. MNNG-stimulated empty vector-reconstituted
  cells (+ EV)]. (B) WT and AMPK DKO HT1080 cells were treated with 1 μM bay-3827
  for 1 h and then stimulated with 30 μM MNNG for 8 h. The nuclear and cytoplasm lysates
  were analyzed by immunoblotting with the indicated antibodies. (C) WT and AMPK DKO
  HT1080 cells were treated with 1 μM bay-3827 for 1 h and then stimulated with 30
  μM MNNG for 6 h. Cell death rate was defined as the percentage of cells with higher
  PI fluorescence values than when unstimulated. Data shown are the mean ± SEM (n
  = 3). *** p < 0.001, ** p < 0.01 (vs. MNNG-stimulated WT cells). (D) U2OS cells
  were treated with 1 μM rucaparib (ruca) or 1 μM bay-3827 (bay) for 1 h and then
  stimulated with 30 μM MNNG for 8 h. Cell death rate was defined as the percentage
  of cells with higher PI fluorescence values than when unstimulated. Data shown are
  the mean ± SEM (n = 3). *** p < 0.001. (E) MEF cells were treated with 1 μM rucaparib
  (ruca) or 1 μM bay-3827 (bay) for 60 min and then stimulated with 500 μM MNNG for
  20 min. Cell death rates were measured by PI staining 10 h after replacement with
  fresh medium. Cell death rate was defined as the percentage of cells with higher
  PI fluorescence values than when unstimulated. Data show the mean ± SEM (n = 3).
  *** p < 0.001. (F) WT and BAX/BAK DKO HT1080 cells were treated with 1 μM bay-3827
  for 1 h and then stimulated with 30 μM MNNG for 8 h. Cell death rate was defined
  as the percentage of cells with higher PI fluorescence values than when unstimulated.
  Data shown are the mean ± SEM (n = 3). * p < 0.05 (vs. MNNG-stimulated WT cells),
  ### p < 0.001 (vs. MNNG-stimulated each cell). All data are representative of at
  least three independent experiments'
