figure_title: KEGG pathway enrichment analysis of transcripts from C.
caption: 'KEGG pathway enrichment analysis of transcripts from C. pepo cultivars.
  This figure shows the results of separate KEGG pathway enrichment analyses performed
  on transcripts identified from two cultivars: 968Rb (a) and True French (b). The
  analyses identified the ten most significantly enriched KEGG pathways within the
  KEGG database. The x-axis denotes the specific KEGG pathway identified. The y-axis
  represents the number of transcripts assigned to each enriched pathway'
