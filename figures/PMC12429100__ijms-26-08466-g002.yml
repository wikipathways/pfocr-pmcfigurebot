figure_title: Untargeted metabolomics analysis through MetaboAnalyst 6.
caption: Untargeted metabolomics analysis through MetaboAnalyst 6.0. The metabolomics
  dataset used for these new analyses was generated by Tang et al. [18], available
  under a Creative Commons Attribution 4.0 International License (https://creativecommons.org/licenses/by/4.0/
  (accessed on 15 July 2025)). Raw data was re-grouped by estrogen receptor expression
  for these analyses [18]. (A) Partial least squares discriminant analysis (PLS-DA)
  plot for dimensionality reduction between estrogen receptor-positive (ER+) and estrogen
  receptor-negative (ER−) breast cancer groups based on abundances of metabolites
  in each group. (B) Volcano plot indicating differentially abundant metabolites in
  ER+ and ER− breast cancer groups. (C) Heatmap of the top 50 metabolites that were
  altered between ER+ and ER− breast cancer groups. (D) Metabolite set enrichment
  analysis (MSEA) results based on relative abundances of metabolites in known pathways
  between ER+ and ER− breast cancer groups. (E) Pathway analysis listing individual
  metabolites in the beta-Alanine metabolic pathway that were altered in abundance
  between ER+ and ER− breast cancer groups
