figure_title: Control vs. IVH pathway enrichment and signaling changes in Microglia
caption: A-B. Bubblechart showing the prioritized ligands after IVH for each cell
  type interactions with microglia. The heatmap on the left depicts the AUPR level,
  the size of the circle represents the percentage of cells expressing highlighted
  genes, and the heatmap on the right shows the predicted target genes and regulatory
  potential for each ligand at time point PND2 (A) and PND5 (B). C-D. Top 10 regulons
  ranked by AUC for microglia after IVH at time point PND2 (C) and PND5 (D). E. MacSpectrum
  plots of microglia states in IVH for PND2 and PND5 with relative predicted percentages.
  AMDI, Activation-induced Macrophage Differentiation Index; MPI, Macrophage Polarization
  Index. F. Mirrored barplot showing the macrophage polarization index (MPI) in IVH
  and Control for PND2 and PND5. Highlighted the significance based on Wilcoxon Rank
  Sum Test (* = p < 0.05)
