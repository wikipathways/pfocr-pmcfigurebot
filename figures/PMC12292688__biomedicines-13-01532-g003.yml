figure_title: ROS cascade and mPTP opening in myocardial infarction reperfusion injury.
caption: ROS cascade and mPTP opening in myocardial infarction reperfusion injury.
  (1) Ischemia induces low oxygen tension, which causes metabolism to favor anaerobic
  glycolysis, leading to lactic acid build-up, cellular acidity, and ionic pump failure.
  This causes tissue swelling and opening of the mitochondrial permeability transition
  ore (mPTP). (2) During reperfusion, the abrupt entry of oxygen forms a burst of
  ROS, leading to mitochondrial membrane depolarization, outer mitochondrial membrane
  rupture, and additional opening of mPTP. The ultimate outcomes of these events are
  ATP depletion, inflammation, and the activation of apoptotic and necrotic pathways
  of cell death
