figure_title: TY1 reduces cell stress through attenuation of genotoxicity
caption: (A) Heatmap of RNA sequencing data from rat BMDMs exposed to vehicle (phosphate-buffered
  saline) or TY1 (n = 4 biological replicates per group). (B) Ingenuity pathway analysis
  of the transcriptome of TY1-exposed rat BMDMs compared with vehicle (x-axis titles
  abbreviated for conciseness). (C) heatmap showing all differentially expressed DNA
  repair genes with unique enrichment of TREX1 signaling. Sequencing data showing
  gene expression changes in the cGAS-STING DNA damage pathway (D), anti-inflammatory
  signaling (E), and UPR signaling (F). qPcr validation of TREX1 up-regulation (G)
  and the cGAS-STING DNA damage pathway (H) in naive macrophages transfected with
  TY1. Amyloid aggregate staining (ProteoStat) of LPS-stressed rat macrophages exposed
  to TY1, scramble, or vehicle (I and J) [red; costained with DAPI (4’,6-diamidino-2-phenylindole),
  blue; n = 7 or 8 biological replicates per group]. Scale bars, 100 μm. Bars represent
  the group means, and error bars represent SD. Analysis of two groups was done using
  a two-tailed Student’s t test with a 95% confidence interval. Analysis of three
  or more groups was done using a one-way ANoVA; *P < 0.05; **P < 0.01; ***P < 0.001
article_title: Augmentation of DNA exonuclease TREX1 in macrophages as a therapy for
  cardiac ischemic injury
