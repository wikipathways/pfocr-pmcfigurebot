number: 'Figure 6:'
figure_title: AICAR treatment improves survival and cardiac function during severe
  influenza virus infection
caption: 'a-c, Bulk RNA sequencing data from infected mice relative to mock controls
  (as in Fig. 4) were further analyzed. a, Heat map of differentially expressed mitochondria-associated
  genes showing strong infection-induced downregulation particularly by the H1N1-E158A
  virus at day 10 post infection. b, Bubble plot displaying the top 20 enriched canonical
  pathways identified using Ingenuity Pathway Analysis (IPA). The node size reflects
  the significance of each pathway (represented by −log10 p-value), while the color
  indicates the z-score of predicted pathway activation (orange) or inhibition (blue).
  c, Prediction of transcription factor activity based on gene expression profiles
  using IPA upstream regulator function. Bubble size corresponds to the −log10 p-value
  of statistical significance, and the color indicates the z-score of predicted activation
  (purple) or inhibition (teal) of TF activity. d-j, To assess therapeutic potential,
  mice infected with H1N1-E158A (200 TCID50) were treated daily with AICAR (100 mg/kg
  in saline) or vehicle (saline) from day 4 through day 10 post-infection. d, Kaplan-Meier
  survival curves from two independent experiments (Vehicle: n = 20; AICAR-treated:
  n = 16). e, Representative cardiac sections stained with Masson’s trichrome to visualize
  collagen (blue) in vehicle- and AICAR-treated mice at day 10 post-infection. f,
  Quantification of cardiac fibrosis from Masson’s trichrome-stained heart sections;
  each point represents an individual mouse (n = 5 per group). Error bars represent
  SEM. Statistical comparison by Mann-Whitney test; *P = 0.0317. g, ECG analysis of
  heart rate, RR interval range, and RR interval variability in vehicle and AICAR-treated
  mice over the course of infection. Data are pooled from three independent experiments.
  Error bars represent SEM. Group sizes: Pre-infection and day 5 post-infection: Vehicle
  n = 30, AICAR n = 24; Day 7: Vehicle n = 18, AICAR n = 17; Day 10: Vehicle n = 11,
  AICAR n = 12. Statistical significance determined by two-way ANOVA with Sidak’s
  multiple comparisons test; *P < 0.05, **P < 0.01, ****P < 0.0001. h, Wet/dry weight
  ratios of hearts collected on day 10 post-infection. Each point represents an individual
  heart. Error bars represent SEM. Group sizes: Vehicle n =3, AICAR n = 7, Mock n
  =6. Statistical significance was determined one-way ANOVA followed by Tukey’s multiple
  comparisons test; *P < 0.05, **P < 0.01. i, Viral titers in heart tissue at days
  5 and 7 (n = 5 per group), and day 10 (n = 4 per group), determined from a single
  experiment. Error bars represent SEM. Statistical significance determined by by
  two-way ANOVA with Sidak’s multiple comparisons test; P = 0.0126. j, Relative transcript
  levels of selected mitochondrial genes in heart tissue from non-infected (Mock),
  H1N1-E158A infected, and AICAR-treated or vehicle-treated mice at day 10 post infection
  with 200 TCID50, measured by qRT-PCR. Each data point represents an individual mouse;
  error bars indicate SEM. Group sizes: Mock, n = 4; H1N1-E158A + AICAR, n = 9; H1N1-E158A
  + vehicle, n = 10. Data are pooled from two independent experiments. Statistical
  significance was determined one-way ANOVA followed by Tukey’s multiple comparisons
  test; *P < 0.05, **P < 0.01, ***P < 0.001'
