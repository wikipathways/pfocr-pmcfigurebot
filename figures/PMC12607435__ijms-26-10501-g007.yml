figure_title: Differential expression of miRNAs in mammary gland at 28 dpp after long/short
  lactation.
caption: Differential expression of miRNAs in mammary gland at 28 dpp after long/short
  lactation. (A) Heatmap showing the clustering of samples based on logCPM of significantly
  differentially expressed miRNAs (FDR < 0.05). The logCPM values were transformed
  and mean-centered to range from −1 to 1. Values close to 1 (red) indicate overexpression
  in 28 dppS; values close to −1 (blue) indicate under-expression in 28 dppS. (B)
  qPCR validation of downregulated (upper plot) and upregulated (lower plot) miRs
  in mammary tissue at 28 dppS were represented as fold vs. 28 dppL. * p < 0.05 and
  ** p < 0.01. (C) Gene ontology (GO) over-representation analysis (ORA) of miRNAs
  in 28 dppS mammary gland. Functional analyses of significantly downregulated miRs
  found in 28 dppS samples vs. 28 dppL (p.adjust < 0.05). The y-axis represents the
  term where genes are enriched, and the x-axis represents the ratio of term genes
  to the total genes in the pathway
