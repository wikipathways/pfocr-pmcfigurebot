figure_title: The effects of NaCl supplementation on the renal renin-angiotensin system
  (RAS) and NHE3 activity.
caption: 'The effects of NaCl supplementation on the renal renin-angiotensin system
  (RAS) and NHE3 activity. NaCl supplementation exerts two major effects: (1) direct
  stimulation of NHE3 in the proximal tubule, independent of angiotensin II (AngII),
  enhancing Na+/H+ exchange; and (2) suppression of the RAS ACE pathway, reducing
  AngII levels. AngII acts through the AT1R receptor, promoting vasoconstriction,
  fibrosis, oxidative stress, and other detrimental effects. In parallel, the ACE2
  pathway converts AngII into Angiotensin-(1–7), which interacts with the Mas receptor
  (MasR) and possibly with the AT2 receptor (AT2R) to induce vasodilation, nitric
  oxide release, improved endothelial function, antihypertrophic, antifibrotic, and
  antithrombotic effects. This balance highlights the opposing roles of the classical
  RAS and the protective RAS'
