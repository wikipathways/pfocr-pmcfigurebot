figure_title: PXR directly binds to mature mRNAs in multiple tissues
caption: a, PCR showing PXR RNA levels in multiple cell lines. The red stars indicate
  two PXR isoforms. b, Western blot showing PXR protein levels in multiple cell lines.
  The red star indicates PXR. GAPDH was used as control. c, Heat maps for read density
  of PXR eCLIP-seq in WT and PXR-KO LS174T cells. Each row shows a 4-kb genomic region,
  centered on peaks identified in PXR eCLIP-seq in WT LS174T cells. Peaks are sorted
  on the basis of PXR eCLIP-seq levels in WT LS174T cells. d, Heat maps for read density
  of eCLIP-seq of HA-tagged PXR in HepG2 cells (left) and hPXR in mouse liver tissues
  (right). Each row shows a 4-kb genomic region, centered on peaks identified in PXR
  eCLIP-seq from each cell type. e, RNA motif analysis using all the eCLIP-seq peaks
  from each cell type. The position weight matrices of predicted RNA motifs are shown.
  Statistical analysis was conducted using a onesided, binomial test. f, Thermal shift
  assay using recombinant PXR protein and the CCG or GGC repeat RNA oligos (39 nt)
  at different concentrations. Protein melting temperature was assessed using raw
  fluorescence (RFU) measured by real-time PCR. All values represent the mean ± s.d.
  (n = 3 biological replicates). g, Enrichment score of genomic distribution of PXR
  eCLIP-seq peaks from different cell types. h-j, Pathway analysis using PXR-bound
  RNAs from WT LS174T cells (h), HepG2 cells (i) and hPXR mouse liver (j). FDR, false
  discovery rate; EpCAM, epithelial cell adhesion molecule; ER, endoplasmic reticulum;
  BSG, basigin. Further information can be found in Supplementary Table 1
