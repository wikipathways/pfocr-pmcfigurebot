figure_title: Principal mechanisms by which GLP-1 receptor agonists confer cardiovascular
  protection.
caption: 'Principal mechanisms by which GLP-1 receptor agonists confer cardiovascular
  protection. A conceptual infographic summarising the multi-system actions of GLP-1
  receptor agonists (GLP-1RAs). Central activation of the GLP-1 receptor in cardiometabolic
  tissues translates into the following: (1) anti-atherogenic effects (lower low-density
  lipoprotein cholesterol [LDL-C], plaque stabilisation); (2) endothelial and vascular
  improvement (enhanced endothelial nitric-oxide synthase activity, modest blood-pressure
  reduction); (3) anti-inflammatory actions (down-regulation of C-reactive protein,
  tumour necrosis factor-α, interleukin-6, and NLRP3 inflammasome activity); (4) metabolic/weight-loss
  benefits that improve insulin sensitivity and haemodynamic load. Together, these
  pathways converge to reduce major adverse cardiovascular events (MACE) and heart-failure
  outcomes documented in large outcome trials'
