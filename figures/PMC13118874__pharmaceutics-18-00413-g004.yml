figure_title: Identification and functional characterization of wound-specific transcriptomic
  signatures across time points.
caption: Identification and functional characterization of wound-specific transcriptomic
  signatures across time points. Venn diagrams illustrate the identification of wound-specific
  differentially expressed genes (WsDEGs) at T1, T2, and T3. WsDEGs were defined as
  genes significantly altered in the anesthesia plus wounding (AW) group after explicitly
  excluding genes overlapping with the no-treatment (N) and anesthesia-only (A) groups,
  thereby isolating transcriptional changes attributable to surgical wounding rather
  than anesthesia or baseline tumor progression. Bar graphs depict the top enriched
  functional pathways derived from these unique WsDEGs based on Metascape analysis.
  Pathways are ranked by statistical significance (−log10(p), and red arrows indicate
  representative pathways relevant to the dominant biological features observed at
  each phase. (a) At T1, WsDEGs were predominantly enriched in pathways related to
  acute inflammatory response, immune cell recruitment, and vascular or coagulation-associated
  processes. (b) At T2, enrichment shifted toward pathways associated with cell survival
  and adaptation, including PI3K–Akt–mTOR signaling and cell adhesion. (c) At T3,
  WsDEGs were mainly enriched in pathways related to cell cycle regulation and lipid
  metabolic processes, including sterol and cholesterol biosynthesis
