figure_title: Translational pathway and implementation barriers for advanced TB drug
  delivery systems.
caption: Translational pathway and implementation barriers for advanced TB drug delivery
  systems. The figure outlines the progression of advanced anti-TB drug delivery approaches
  from formulation design to clinical application. Early development must account
  for regulatory expectations and GMP requirements, particularly for nanocarriers
  and inhalable systems. Preclinical evaluation extends beyond plasma PKs to include
  toxicology, stability, and safety considerations relevant to pulmonary and intracellular
  exposure. During clinical development, manufacturability, cost, and scalability
  become key constraints. Successful implementation further requires alignment with
  the WHO End TB strategy and harmonized regulatory pathways for nanomedicines and
  host-directed therapies. These steps illustrate how scientific advances must be
  integrated with regulatory, manufacturing, and public-health considerations to enable
  real-world impact
