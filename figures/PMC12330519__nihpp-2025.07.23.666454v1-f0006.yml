figure_title: SFA accumulation induces DNA damage, PARP1 hyperactivation, and parthanatos
  in GSCs
caption: '(A) Reactome pathway analysis of DNA damage repair mechanisms altered by
  SCD1/SCD5 knockdown (4 days).(B) γH2AX immunofluorescence (left) and quantification
  (violin plot, right) in SCD1/SCD5-deficient GSCs (n>100 cells; *p<0.05, **p<0.001,
  ***p<0.0001, Student’s t-test). Scale bar: 25 μm.(C) Immunoblot analysis of PARP1
  and PARylation at the PARP1 expected molecular weight post-SCD1/SCD5 knockdown.(D)
  PARP1 immunoprecipitation with PAR immunoblot in knockdown conditions.(E) Time-course
  immunoblot analysis of PARP1, PAR, and γH2AX in GSCs treated with 150 μM of C18:0.
  (F) immunoblot analysis of PARP1, PAR, and RAD51 expression after treatment with
  H₂O₂ (0–2 mM, 15 min) and PARG inhibitor (1 μM, 24 hr).(G-H) Subcellular fractionation
  followed by immunoblot analysis of AIF expression following SCD1/SCD5 knockdown
  (G) or C18:0 treatment (H). TATA-binding protein (TBP; nuclear) and GAPDH (cytoplasmic)
  were used as loading controls. Quantification shows mean nuclear AIF/TBP ratio ±
  SD (n=3 GSC lines: M12, M76, M120).(I) PicoGreen staining of nuclear DNA fragmentation
  post-SCD1/SCD5 knockdown. Scale bar: 10 μm.(J) Immunoblot analysis of DNA damage
  markers in PARP1-GFP–expressing GSCs treated with 150 μM of C18:0 for 24 and 48h.(K)
  Schematic illustration of the proposed mechanism by which saturated fatty acid (SFA)
  accumulation induces DNA damage, leading to PARP1 hyperPARylation, subsequent PARP1
  degradation, and parthanatos'
