figure_title: The T cell responses activated by the DNA vaccines.
caption: 'The T cell responses activated by the DNA vaccines. (A,B) The frequencies
  of IFN-γ secreting T cells (Th1 pathway) simulated by Gn (A) or Gc (B) protein at
  two weeks after the third vaccination detected by ELISpot assay. (C,D) The frequencies
  of IL-4 secreting T cells (Th2 pathway) simulated by Gn (C) or Gc (D) protein at
  two weeks after the third vaccination detected by ELISpot assay. Mice were treated
  as described in Figure 2A. *, significantly different from the Dimer group (p <
  0.05); #, significantly different from Hexamer-2 group (p < 0.05); ^, significantly
  different between the groups indicated in the figures (p < 0.05) as determined by
  one-way ANOVA. Data are presented as mean ± SD (error bars represent SD, n = 5 mice
  per group)'
