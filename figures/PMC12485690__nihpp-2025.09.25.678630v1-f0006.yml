figure_title: Chemical and biological perturbations induce aspects of hnDAM in iPSC-derived
  microglia
caption: Transcriptional perturbations mimicking the hnDAM signature were predicted
  in silico using the Library of Integrated Network-based Cellular Signaling52 SigCom
  server (See “Perturbation discovery for mimickers of hnDAM”). (A) Schematic of perturbation
  discovery. (B) Experimental design for in vitro screening of perturbation. (C) Differential
  expressed gene sets of damage-associated molecular patterns (DAMPs) and HDAC inhibitor
  treatment of iPSC-derived microglia (n = 5 genetic background per condition). Analysis
  ran using variancePartition::dream() reveals dose-dependent effects in numbers of
  DEGs (∣log2FC∣ > 0.5, FDR < 0.05). (D) Gene-level results for the 105-gene hnDAM
  signature reveal subsets recapitulated by either chemical or biological treatment.
  Enrichment for apoptosis (hsa04210) and hnDAM signature performed in fgsea. Significance
  stars for both DEGs and NES values indicate FDR < 0.05. (E-H) Ranked gene set plots
  from GSEA demonstrate normalized enrichment score from GSEA-calculations against
  hnDAM signature and apoptosis pathway. Statistics available in Table S43. Schematic
  (A-B) created with BioRender.com
