figure_title: Experimental Setup and Target Pathways.
caption: 'Experimental Setup and Target Pathways. A) Top: Sagittal view of a temporary
  28-contact subdural electrocorticography (ECoG) strip placed over the M1 region.
  Bottom: Top-down view of the ECoG placement visualized by Slicer 5.2. B) Modeling
  of the DBS electrode implanted in the subthalamic nucleus (STN) (orange), shown
  in relation to the thalamus (yellow), the hyperdirect pathway (HDP, green), and
  the cortico-spinal bulbar tract (CSBT, blue), visualized by StimVision. C) Top:
  Schematic representation of HDP and CSBT antidromic activation in response to STN
  stimulation. Bottom: Example of a cortical evoked potential (cEP) recorded from
  one of the ECoG strip contacts in response to STN stimulation. The first and second
  peak amplitudes, referred to as very short-latency evoked potential (EP0) and short-latency
  evoked potential (EP1) [42], are used here as measures of HDP and CSBT activation.
  STN = subthalamic nucleus; HDP = hyperdirect pathway; and CSBT = corticospinal/bulbar
  tract'
