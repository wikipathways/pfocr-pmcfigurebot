figure_title: 'WD impairs hepatic cholesterol and vitamin D metabolism in obese mice.
  (A) GO enrichment analysis of differentially downregulated genes was performed based
  on three categories: biological process (BP), molecular function (MF), and cellular
  component (CC). (B) Pathway enrichment analysis was performed using differentially
  downregulated genes based on the KEGG database. (C) GSEA was performed using a predefined
  vitamin D metabolism-related gene set. (D) Hepatic expression of key enzymes involved
  in vitamin D biosynthesis, transport and absorption, including Cyp27a1, Cyp2r1,
  Gc and Cyp7a1. Analysis was performed at week 48. Data are shown as box-and-whisker
  plots; Statistical analysis was performed using the Mann-Whitney U test. * p < 0.05,
  ** p < 0.01. SD = standard diet, WD = Western diet'
