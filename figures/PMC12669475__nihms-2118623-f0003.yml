figure_title: Sub-clustering analysis of macrophages reveals five major sub-cell types
caption: A) UMAP plot showing the relative positions of five macrophage subtypes.
  B) Violin plots depicting the marker gene expression for each macrophage sub-type.
  C) qRT-PCR was performed to check the expression of marker genes (n=3). data are
  presented as mean±SD. Student’s t-test were used to analyze the data. D) Comparison
  of cell population sizes of each sub-type between atherosclerosis and LysM-DKO/Apoe−/−
  mice. E) Volcano plot illustrating the results of differential expression analysis
  for resident-like macrophages between WT/Apoe−/− and LysM-DKO/Apoe−/−. F) Expression
  levels of cell proliferation markers in the resident-like macrophage population.
  G) Bar plot depicts the upregulation of cell proliferation and cholesterol-efflux
  pathways in resident-like macrophages of LysM-DKO/Apoe−/− mice
