figure_title: The indirect pathway in the songbird Area X.
caption: 'The indirect pathway in the songbird Area X. a Automated reconstructions
  of exemplary GPi and GPe neurons, and a connected MSN (3D visualizations). Insets
  show an MSN to GPe synapse (top:12139, 10877, 3292) and a GPe to GPi synapse (bottom:
  13502, 17089, 6174). b Schematic representation of the indirect pathway starting
  at GPe with summed synaptic area in relation to corresponding incoming and outgoing
  synaptic area per cell type (see Fig. 6f, g), also for the connectivity from GPi
  to STN to GPe. c-e Comparison of synaptic area of individual synapses and multisynaptic
  connections from STN to GPe and GPi (left), STN from GPe and GPi (middle) and GPe
  to GPi (and vice versa, right). f,g Incoming and outgoing synaptic connectivity
  of GPe and GPi. Inset shows the incoming synaptic area to GPe and GPi. h ‘Claw’
  - like, multiple soma synapses from one GPi to another (3D visualizations)'
