figure_title: Overview of mitochondria and their functions.
caption: 'Overview of mitochondria and their functions. Mitochondria consist of four
  compartments: outer membrane, intermembrane space, inner membrane and matrix. Their
  main functions are energy metabolism composed of respiration and synthesis of ATP;
  metabolism of amino acids, lipids, and nucleotides; biosynthesis of iron-sulfur
  (Fe/S) clusters and cofactors; the import and processing of precursor proteins that
  are synthesized in the cytosol to express the mitochondrial genome; quality control
  and degradation processes, including mitophagy and apoptosis; signaling and redox
  processes; neuroinflammation, maintaining membrane architecture and dynamics; and
  mediating the tricarboxylic acid (TCA) cycle. cGAS and STING pathways. Created in
  BioRender. Ambrosius, F. (2025) https://biorender.com/4abae0m (accessed on 23 November
  2025)'
