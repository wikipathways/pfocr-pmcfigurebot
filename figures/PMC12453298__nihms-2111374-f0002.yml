figure_title: Life cycle of proteins
caption: Proteins encounter several key decision points during their lifespan. Blood
  stem cells tune protein abundance not only by regulating gene expression but also
  by modulating translation rates. Molecular chaperones assist in the proper folding
  of nascent peptide chains and support protein stability and function throughout
  their lifetime. Once a protein has completed its functional life cycle or becomes
  damaged, it is targeted for removal. The two primary pathways for complete protein
  degradation are the lysosomal pathway—operating in the cytoplasm—and the proteasomal
  pathway, which functions in both the cytosol and nucleus, but which can also selectively
  extract damaged proteins from mitochondria and the endoplasmic reticulum. Although
  many other proteases exist within cells, most are involved in processing or trimming
  proteins rather than fully degrading them. Exceptions are mitochondrial proteases,
  which can fully degrade proteins within mitochondria, and which have also been implicated
  in the degradation of extramitochondrial proteins [59–61]. Figure created with BioRender
