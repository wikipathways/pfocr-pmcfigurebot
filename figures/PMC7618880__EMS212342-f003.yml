figure_title: Schematic overview of the functions and regulation of THESEUS1 (THE1)
caption: (a) THE1 is involved in the response to the inhibition of cellulose biosynthesis.
  Cellulose biosynthesis takes place in cellulose synthase complexes (CSCs) and can
  be inhibited by mutations in the CELLULOSE SYNTHASE enzyme, like in the procuste
  (prc1-1) mutant, or by chemical inhibitors such as isoxaben. No co-receptors of
  THE1 have been described so far. Potential co-receptors of THE1 are LEUCINE-RICH
  REPEAT EXTENSINs (LRXs), the glycosylphosphatidylinositol-anchored proteins (GPI-AP)
  LORELEI (LRE) and LRE-like GPI-APs (LLGs), RECEPTOR-LIKE PROTEINs (RLPs), and other
  Catharantus roseus RECEPTOR-LIKE KINASE 1-LIKE (CrRLK1L) proteins. Initial downstream
  components could be RECEPTOR-LIKE CYTOPLASMIC KINASES (RLCKs), GUANINE EXCHANGE
  FACTORs (GEFs), and RHO OF PLANTS (ROP). Responses to cellulose biosynthesis inhibition
  include production of reactive oxygen species (ROS), ectopic lignification, inhibition
  of root growth, jasmonic acid production, and the expression of genes involved in
  pattern-triggered immunity (PTI). (b) Responses mediated by THE1 in response to
  treatment with the RAPID ALKALINIZATION FACTOR 34 (RALF34) ligand. Little is known
  about when and how the RALF34 ligand is released. It is not known if RALF34 binds
  pectin like other RALFs. THE1 binds RALF34 with its ectodomain, which may involve
  co-receptors and could alter interactions with immediate downstream components.
  RALF34 treatment leads to calcium influx, apoplastic pH alkalinization, increased
  expression of PROSCOOP18, and inhibition of root growth. RALF34 and THE1 also play
  a role in the fine-tuning of lateral root development. (c) Hypothetical model of
  THE1 involvement in osmotic stress responses. The related CrRLK1L FERONIA (FER)
  represses ABA signaling through GEF1/4/10, ROP11, and the ABI2 phosphatase. THE1
  was shown to interact with GEF4, and this interaction may affect the ABA signaling
  pathway through GEF4. THE1 may also be involved in the pathway by directly interacting
  with FER. (d) Hypothetical modes of post-translational regulation of THE1. Regulation
  of THE1 may take place through phosphorylation, ubiquitination, or receptor internalization
