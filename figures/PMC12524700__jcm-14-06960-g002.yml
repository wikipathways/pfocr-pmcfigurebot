figure_title: Mechanism of action and resistance of TKIs.
caption: Mechanism of action and resistance of TKIs. PI3K-AKT, RAS, and SHP are essential
  TKIs drug target pathways. Human malignancies frequently exhibit deregulation of
  these pathways, which are prominent mediators of cell cycle development, proliferation,
  and apoptosis/cell survival. (A) Mechanism of action, dacomitinib blocks the PI3K/AKT
  pathway and thus promotes cell apoptosis, lorlatinib and osimertinib prevents both
  PI3K and RAS pathways, and hence enhances cell apoptosis. and (B) Durvalumab blocks
  the SHP pathway, and thus prevents cell survival. The resistance mechanisms are
  shown on the right-hand side
