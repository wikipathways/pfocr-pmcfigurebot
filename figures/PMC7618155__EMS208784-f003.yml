figure_title: Metabolic capacity of Mycobacterium tuberculosis and metabolism during
  host infection
caption: 'In silico, in vitro, intracellular, and animal models of M. tuberculosis
  infection have informed current knowledge of the metabolic repertoire of the bacillus30.
  M. tuberculosis down-shifts glycolysis and exploits host lipids for energy generation
  and biomass194, as well as acid resistance195. Fatty acids and cholesterol feed
  β-oxidation; carbon is channelled through the glyoxylate shunt, methylcitrate cycle,
  and B12-dependent methylmalonyl pathway to detoxify propionate while replenishing
  tricarboxylic acid cycle intermediates46. During hypoxia or nitric-oxide stress,
  a low-flux, highly reduced respiratory chain maintains ATP synthesis while lipids
  are stored for later use. M. tuberculosis also utilizes a range of nitrogen sources:
  host amino acids are deaminated, nitric oxide is detoxified, and the nitrate/nitrite
  reductase system supplies ammonia93. The bacillus scavenges inorganic phosphate,
  and assimilates sulfate for cysteine and mycothiol biosynthesis, supporting redox
  balance96. De novo vitamin B2, B6, and B7 pathways, plus cobamide (B12) salvage107secures
  essential cofactors. Dual-use virulence factors harvest transition metals while
  avoiding toxicity: mycobactin and carboxymycobactin siderophores sequester iron;
  zinc, copper and manganese ions support metallo-enzymes104. M. tuberculosis secretes
  protein kinases, and acid and tyrosine phosphatases, to block phagosome-lysosome
  fusion, sustaining a mildly acidic, nutrient-porous compartment114. Perforation
  of the phagosomal membrane enables cytosolic access to carbon and ions. Cell-envelope
  lipids and lipoarabinomannan dampen toll-like receptor signalling and arrest maturation,
  while proteases and antioxidant systems neutralize acid, reactive oxygen, nitrogen
  and chlorine species110, 196. Trehalose recycling conserves carbon while regulating
  envelope integrity. Under prolonged stress, the mycobacterial proteasome and the
  enduring hypoxic response redirect resources to repair and maintenance197, while
  toxin-antitoxin modules slow translation. Through this tightly integrated metabolic-virulence
  network, M. tuberculosis converts even hostile intracellular environments into privileged,
  nutrient-accessible refuges, enabling long-term intracellular persistence with the
  capacity for rapid re-initiation of replication'
article_title: Mycobacterium tuberculosis biology, pathogenicity, and interaction
