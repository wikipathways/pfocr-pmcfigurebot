figure_title: 'Therapeutic strategies targeting DOT1L: current status and future directions.'
caption: 'Therapeutic strategies targeting DOT1L: current status and future directions.
  This flowchart illustrates the evolution of DOT1L-targeted therapies from monotherapy
  to next-generation approaches. EPZ-5676 (Pinometostat) completed Phase I trials
  with modest activity (2/51 patients achieved complete remission) and significant
  resistance mechanisms including non-catalytic scaffolding functions. Promising combination
  strategies with menin and MEK inhibitors aim to overcome monotherapy limitations
  through synergistic effects and multi-pathway targeting. Emerging future strategies
  include PROTACs (protein degraders) that eliminate entire DOT1L protein to overcome
  scaffolding resistance, plus novel approaches like allosteric inhibitors and personalized
  medicine. The timeline shows progression from completed Phase I studies through
  combination trials to next-generation therapies in preclinical development'
