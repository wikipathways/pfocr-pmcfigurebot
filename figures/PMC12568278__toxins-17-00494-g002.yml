figure_title: Intracellular trafficking and cytotoxic mechanism of ricin and abrin.
caption: 'Intracellular trafficking and cytotoxic mechanism of ricin and abrin. Both
  toxins are heterodimeric proteins composed of a catalytically active A-chain (A)
  and a carbohydrate-binding B-chain (B). (1) The intoxication process begins when
  the B-chain binds to cell-surface glycans: ricin recognizes terminal galactose,
  while abrin binds both galactose and N-acetylgalactosamine. (2) Internalization
  occurs through clathrin-dependent and clathrin-independent endocytosis, leading
  to early endosome formation. (3) From endosomes, toxins may recycle to the plasma
  membrane, undergo lysosomal degradation, or traffic retrogradely to the Golgi apparatus
  and ER. (4) In the ER, protein disulfide isomerase (PDI) reduces the disulfide bond,
  releasing the A-chain. (5) The A-chain exploits the ER-associated degradation (ERAD)
  pathway to enter the cytosol. (6) In the cytosol, the A-chain depurinates 28S rRNA
  within the sarcin–ricin loop. (7) This blocks protein synthesis and triggers cell
  death. Arrow thickness reflects trafficking efficiency: ricin is more susceptible
  to lysosomal degradation, whereas abrin more efficiently reaches the ER, contributing
  to its higher cytotoxicity. Created in BioRender. Bijak, M. (2025) https://BioRender.com/7yvr5l1
  (accessed on 15 September 2025) [41]'
