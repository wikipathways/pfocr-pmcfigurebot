figure_title: GK alleviates DOX-induced cardiomyocyte injury by improving mitochondrial
  dysfunction through the AMPK/Sirt1/NF-κB signaling pathway.
caption: 'GK alleviates DOX-induced cardiomyocyte injury by improving mitochondrial
  dysfunction through the AMPK/Sirt1/NF-κB signaling pathway. (a, b) To elucidate
  the cardioprotective mechanism of GK through the AMPK/Sirt1/NF-κB axis, H9c2 cells
  were divided into four experimental groups: Control, DOX, DOX + GK, and DOX + GK
  + Com C. Immunoblotting was performed to quantify the expression of AMPK/Sirt1/NF-κB
  pathway components, including total and phosphorylated forms of AMPK (p-AMPK) and
  NF-κB p65 (p-NF-κB p65), along with Sirt1. (c, d) MMP was evaluated using JC-1 fluorescence
  staining to assess mitochondrial functional integrity. Scale bar 50 μm. (e, f) Dual-fluorescence
  imaging with MitoTracker-RFP (mitochondrial morphology, red) and ROS indicator (mitochondrial
  OS, green) enabled colocalization analysis of oxidative damage. Scale bar 50 μm.
  (g, h) DNA damage was examined by immunofluorescence detection of γ-H2AX foci, followed
  by quantitative analysis of double-strand breaks. Scale bar 50 μm. (i) Cellular
  bioenergetic status was determined by measuring intracellular ATP levels. (j-l)
  Mitochondrial respiratory function was comprehensively assessed using the Seahorse
  XFp analyzer, with key parameters including basal respiration, maximal respiration,
  and spare respiratory capacity. n = 6. ***p < 0.001 vs. Control; ##p < 0.01, ###p
  < 0.001 vs. DOX, &p < 0.05, &&p < 0.01, &&&p < 0.001 vs. DOX + GK. DOX, doxorubicin;
  GK, ginkgetin; NF-κB, nuclear factor-κB; OS, oxidative stress; MMP, mitochondrial
  membrane potential; AMPK, AMPK, adenosine monophosphate–activated protein kinase;
  ROS, reactive oxygen species'
