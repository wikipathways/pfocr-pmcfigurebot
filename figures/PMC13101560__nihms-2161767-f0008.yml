figure_title: The IL-10/IL-10Rα/PD-L1/TRAIL pathway is elicited in response to diverse
  respiratory viruses and conserved between mice and humans
caption: (A) Infection of human lung single-cell suspensions with 0.01 MOI H1N1 PR8
  and analysis by ELISA (48 h) and flow cytometry (72 h).(B) Histogram of NP expression
  in IAV-exposed human lung cells at 72 h p.i.(C–H) (C) ELISA analysis of IL-10 in
  the supernatant of IAV-infected human lung cells at 48 h p.i. Expression of (D)
  IL-10Rα, (E) PD-1, (F) PD-L1, (G) PD-L2, and (H) TRAIL in IAV-infected human lung
  cells at 72 h post-infection; Mann-Whitney test; *p < 0.05, **p < 0.01, ***p < 0.001,
  and ****p < 0.0001.(I–L) Expression of (I) PD-1, (J) PD-L1, (K) PD-L2, (L) TRAIL
  in IL-10Rα+ and IL-10Rα– NK cells, and (M) co-expression of PD-L1 and TRAIL in IAV-infected
  human lung single-cell suspensions at 72 h p.i. One-way ANOVA with Sidak’s multiple
  comparisons; *p < 0.05, **p < 0.01, ***p < 0.001, and ****p < 0.0001.(N) Flow cytometry
  analysis of lymphocytes isolated from the peripheral blood of patients infected
  with SARS-CoV-2 and age and sex-matched healthy donors.(O–R) Expression of (O) IL-10Rα,
  (P) PD-1, (Q) PD-L1, and (R) PD-L2 on peripheral blood NK cells isolated from hospitalized
  patients infected with SARS-CoV-2 and healthy controls; Mann-Whitney test; **p <
  0.01 and ****p < 0.0001.(S) Analysis of TNFSF10 gene expression in the airway and
  PBMC NK cells from patients infected with SARS-CoV-2 and healthy controls using
  publicly available single-cell RNA sequencing data deposited in the COVID-19 cell
  atlas.99(C–M) Each data point represents an individual experimental sample, and
  each symbol represents an individual donor; n = 12–22 replicates and 3–5 donors.
  (O–R) Each data point represents an individual donor (n = 12–13 donors per group).
  Data are presented as mean ± SD
