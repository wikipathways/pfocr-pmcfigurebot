figure_title: Drivers and barriers to cognitive care along a typical treatment pathway
  for people living with schizophrenia.
caption: 'Drivers and barriers to cognitive care along a typical treatment pathway
  for people living with schizophrenia. The figure presents a generalised patient
  journey across four key stages of care: acute treatment, stabilisation and diagnosis,
  intensive follow-up and long-term follow-up (shown at the top). For each stage,
  the figure highlights the main drivers and barriers, derived from thematic analysis
  of interviews with HCPs and HPEs. Together, these layers illustrate how institutional,
  infrastructural and economic factors interact throughout the care pathway, influencing
  the assessment and management of CIAS'
article_title: 'Overcoming Patient Access Barriers in Complex Conditions: Lessons
