figure_title: APOE2 plasma protein signature in GNPC
caption: 'a. Volcano plot for proteins associated with APOE2 without adjusting for
  AD diagnosis, with red representing significant association after FDR correction.
  At y-axis, -log10(FDR) above 300 was set to 300 for a better visualization. b. Scatter
  plot shows APOE2’s effect size on protein without adjusting AD diagnosis in whole
  cohort (x-axis) vs. in CU individuals (y-axis) for each protein. The Spearman correlation
  coefficient (R = 0.852, p < 1e-16) indicates a strong positive correlation between
  the effect sizes. Proteins highlighted in red are significantly associated with
  APOE2 in both the whole cohort and the CU subgroup. c. Volcano plot for the effect
  of APOE2*age on proteins that are associated with APOE2 in the CU group with red
  indicates a significant APOE2*age effect on proteins. d. Interaction effect of APOE2
  status and age on protein levels in the CU group. Protein levels of VPS29 and AKT2_1
  (“_1” represent one aptamers of AKT2) are plotted against age, with separate regression
  lines for individuals carrying the ε2 allele (ε2+, red) and those without it (ε2−,
  blue). Shaded areas represent 95% confidence intervals. e. Heatmap shows the mediation
  effects and significance of APOE2-associated proteins that are involved in the 2
  mediation paths. Color indicates the strength of the mediation effect, the darker
  the color, the bigger the mediation proportion at each path. Proteins at x-axis
  are categorized and colored according to their significance in 2 paths (protein-mediated
  pathway: APOE2 => protein => AD diagnosis, AD-mediated pathway: APOE2 => AD diagnosis
  => protein), with those exhibiting significance in both paths further classified
  by the strength of the mediation effect. Proteins were marked in red if their protein-mediated
  pathway was significant alone (after FDR correction) or if the protein-mediated
  pathway exhibited a stronger mediating effect (when indirect effects of both mediation
  paths are significant after FDR correction). Proteins were marked in blue if their
  AD-mediated pathway was significant alone (after FDR correction) or if the AD-mediated
  pathway exhibited a stronger mediating effect (when indirect effects of both mediation
  paths are significant after FDR correction). Additionally, bold font indicates a
  total mediation effect and non-bold font indicates a partial mediation effect in
  the preferred (same color) path. For heatmap annotations, *represents nominal significant,
  *+ represents significant after FDR correction. f. BINN-enriched pathway analysis
  for early dysregulated proteins (associated with APOE2 in both whole cohort and
  in CU) in APOE2 carriers, the darker the color, the more important the protein or
  pathway in predicting AD dementia diagnosis. More features are hidden in the sink
  for a better visualization. g. Subdivision of APOE2 associated proteins based on
  the association between proteins, APOE2 and AD. Noting that one protein (EMC2) overlaps
  between APOE2-specific and mediator-proteins and was only categorized into mediator
  proteins for grouped GO biological process enrichment analysis. h. The linear discriminant
  score plot shows the projection score of each group of subdivided proteins in the
  discriminant direction. Proteins were colored by assigned groups. i. The integrative
  matrix summarizes differential regulation (red for upregulated and blue for downregulated
  proteins in APOE2 carriers), cell-type enrichment based on scaled RNA expression,
  and functional characterization of each protein. Cell types from the ROSMAP atlas
  are labeled in black on the x-axis, while those from the Human Brain Vascular atlas
  are labeled in red. Gray boxes indicate nominal significance (p<0.05), and black
  boxes indicate FDR-corrected significance (pFDR<0.05) in cell-type enrichment analysis.
  Gene Ontology (GO) biological process terms associated with each protein were grouped
  into broader representative categories; small red boxes indicate the involvement
  of a given protein in the corresponding process. Protein–protein interactions (PPIs)
  are annotated using STRING database interactions with a confidence score≥0.7. The
  number of interactions per protein is shown as a heatmap, and direct interactions
  between proteins are represented by lines, color-coded according to their assigned
  cluster'
