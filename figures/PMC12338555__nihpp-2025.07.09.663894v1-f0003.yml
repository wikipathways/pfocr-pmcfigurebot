figure_title: Fitness and growth of functionally related gene mutants in ferulic and
  p-coumaric acid
caption: 'A) Pathway map showing functional relation between genes which had significant
  phenotypes in 7.5 mM ferulic and 9.375 mM p-coumaric acid. Heatmaps next to each
  gene depict chemical-gene scores in both conditions for TnSeq and CRISPRi libraries.
  Tn, TnSeq library; Ci, CRISPRi library; n.d., no data. Diagonal lines indicate statistical
  non-significance (FDR > 0.05). Heatmaps with asterisks display the median CG score
  for CRISPRi partial knockdown mutants using mismatched sgRNAs. n.d. denotes no data.
  Corresponding locus tags for protein names shown are: SufB, ZMO0423; SufC, ZMO0425;
  SufD, ZMO0426; SufS, ZMO0427; SufT, ZMO0428; SufA, ZMO0429; SufE, ZMO1067; HemA,
  ZMO1198; HemB, ZMO1879; HemC, ZMO1903; HemD, ZMO1902; HemN, ZMO1364; HemE, ZMO1998;
  HemH, ZMO0303; CytB, ZMO0957; PetA, ZMO0956; CytC1, ZMO0958; CytC, ZMO0961; FdxN,
  ZMO1818. B) Growth curves displaying anaerobic growth with phenolic acids for deletion
  mutants or a sufB Mismatch-CRISPRi partial knockdown mutant (colored lines) and
  wild type Z. mobilis or a non-targeting CRISPRi control strain, respectively (black
  lines). Growth curve error bars are standard deviation of quadruplicate samples'
article_title: Orthogonal chemical genomics approaches reveal genomic targets for
  increasing anaerobic chemical tolerance in Zymomonas mobilis
