figure_title: Comparison of the multifunctional gene signatures and pathway networks
  associated with Pinus koraiensis essential oil (EPO) and supercritical CO2 extract
  oil (SPO).
caption: Comparison of the multifunctional gene signatures and pathway networks associated
  with Pinus koraiensis essential oil (EPO) and supercritical CO2 extract oil (SPO).
  (A) Overlapping antioxidant, anti-inflammatory, anticancer, and antimicrobial-related
  gene sets were analyzed to identify 74 core multifunctional genes. (B) Protein–protein
  interaction networks of the 74 core genes were generated using STRING. (C,G) Core
  multifunctional genes were compared with SPO or EPO-associated target genes predicted
  by SwissTargetPrediction and CTD to identify overlapping and unique genes. (D,H)
  STRING PPI networks were constructed using the overlapping gene sets obtained from
  (C,G) to identify major functional hubs related to inflammation, oxidative stress,
  and cell survival. (E,I) KEGG pathway enrichment analyses were performed for SPO
  and EPO-associated gene sets to determine significantly enriched biological pathways.
  (F,J) Reactome pathway enrichment analyses were performed for SPO and EPO-associated
  gene sets to identify significantly enriched signaling pathways
