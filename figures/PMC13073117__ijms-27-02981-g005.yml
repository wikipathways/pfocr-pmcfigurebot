caption: Predicted protein–protein interaction (PPI) network of AaWRKYs and isoflavonoid
  biosynthetic enzymes. This interactome illustrates the potential regulatory relationships
  between AaWRKY proteins and key enzymes in the isoflavonoid biosynthetic pathway
  within Artemisia argyi. The network was constructed using the STRING database based
  on genomic context, co-expression data, and functional associations. Different colors
  represent different groups of WRKY proteins
