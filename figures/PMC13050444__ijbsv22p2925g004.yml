figure_title: Lactate induces elevated H4K12la levels to enhance TRIM29 transcription.
caption: Lactate induces elevated H4K12la levels to enhance TRIM29 transcription.
  A-D) Western blotting and IHC analysis of PanKla expression in articular chondrocytes
  (n=4). Scale bar, 50 μm. E, F) Western blotting detection of changes in PanKla expression
  at various lysine lactylation sites in articular cartilage (n=3). G-J) Immunofluorescence
  analysis and western blotting analysis of H4K12la levels in chondrocytes (n=3).
  Scale bar, 100 μm. K) CUT&TAG sequencing analysis showing H4K12la-binding peak density
  in articular cartilage from healthy donors and OA patients. L) Genomic distribution
  of H4K12la in articular cartilage from the healthy and OA groups. M) KEGG pathway
  enrichment analysis of genes associated with H4K12la peaks from CUT&TAG sequencing
  in the healthy and OA groups. N) GeneMANIA analysis predicting functional interactions
  between TRIM29 and the PI3K pathway. O) IGV tracks showing enriched CUT&TAG signals
  for H4K12la at the promoter region of the TRIM29 gene. P) The luciferase assay demonstrated
  that mutation at the H4K12 site potently activates the TRIM29 promoter. Q) The ChIP
  assay demonstrated enhanced interaction between H4K12la and the predicted binding
  site on the TRIM29 promoter after lactate intervention. R, S) qPCR and Western blot
  analysis of TRIM29 expression at the mRNA and protein levels (n=3). *P < 0.05, **P
  < 0.01, ***P < 0.001
