figure_title: |-
  PPARγ -mediated lipid droplet (LD) repletion restores lipid
  homeostasis in colonic CD8+ T cells from PWH on ART.
caption: |-
  PPARγ -mediated lipid droplet (LD) repletion restores lipid
  homeostasis in colonic CD8+ T cells from PWH on ART.A. Diagram showing LD biogenesis and lipolysis pathways, with key
  enzymes highlighted in orange.B. Quantification of FAO activity (counts per minute [cpm]) of
  metabolized 3H-palmitic acid normalized to colon TRM CD8+ T cell
  count from HIV-uninfected individuals upon ATGL inhibition (Atglistatin) to
  block lipolysis and DGAT inhibition to block LD biogenesis. n=6 per group.C. Confocal imaging of LDs (detected with Nile Red staining shown in
  green) in colon TRM CD8+ T cells from PWH on ART and HIV-uninfected individuals
  with addition of palmitic acid or palmitic acid and PPARγ agonist.D. Quantification of LDs in colon TRM CD8+ T cells from PWH on ART and
  HIV-uninfected individuals. n=14 (HIV-), n=10 (HIV+ART+).E. Diagram showing how PPARγ ligands and fatty acids (FAs)
  activate PPAR signaling, which then regulates LD dynamics.F. Quantification of FAO activity in colon TRM CD8+ T cells from
  HIV-uninfected individuals and PWH when treated with PPARγ antagonist or
  PPARγ agonist. n=6 per group.(B, D, F) Data shown as mean ± SEM. Each point, one individual.
  ns, p > 0.05, *p < 0.05,
  **p < 0.01, ****p < 0.0001.
  Analyzed via one-way ANOVA
