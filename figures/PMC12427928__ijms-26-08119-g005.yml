caption: 'Engineered LAB-based strategies for enhanced peptide production: (a) Representative
  inducible expression systems commonly applied in LAB, such as nisin-controlled gene
  expression (NICE), xylose-, zinc-, and agmatine-inducible promoters. (b) Genome
  editing tools for LAB, including pORI- or pCS1966-based homologous recombination,
  RecT-mediated single-strand recombineering, and CRISPR(i)-based approaches. (c)
  Cell-free protein synthesis (CFPS) systems derived from LAB, enabling rapid peptide
  production and pathway prototyping without living cells. (d) Application of multi-omics
  approaches (genomics, transcriptomics, proteomics, and metabolomics) to uncover
  and optimize peptide biosynthesis pathways in LAB'
