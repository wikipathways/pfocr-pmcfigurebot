caption: 'This figure is a schematic diagram illustrating the immune pathway of P.
  vannamei in response to certain diseases regulated by Integrin β. After the knockdown
  of Integrin β, it was observed that viral replication increased, and the survival
  rate of the shrimp decreased. Further exploration of its molecular mechanism revealed
  that Integrin β might affect other receptors and, through regulating the Toll, IMD,
  and STAT signaling pathways, regulate the expression of antimicrobial peptides,
  thereby influencing the innate immune system of P. vannamei against diseases. This
  schematic diagram was drawn using the Figdraw 2.0 software (https://www.figdraw.com/static/index.html#/,
  accessed on 10 May 2025). Explanation: The cross mark in the pattern diagram represents
  knockdown'
article_title: Integrin β Regulates the Hepatopancreas Antiviral Innate Immune System
  by Affecting the Expression of Antimicrobial Peptides in Penaeus vannamei
