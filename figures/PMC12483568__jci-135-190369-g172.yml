figure_title: Administration of sterile inflammation–inducing agents after DHT administration
  also leads to ectopic calcification
caption: '(A) Experimental scheme of LPS, FeCl3, and zymosan treatment. (B and C)
  Von Kossa staining of rat dermal tissues to identify calcific regions in controls
  (B) and animals that received DHT (C) (arrowheads; representative images; n = 3
  animals per group). (D and E) Immunofluorescent staining of CD68 in calcified skin
  regions (red, arrowheads, CD68; green, HA, hydroxyapatite). (D) and quantification
  of inflammatory infiltrate (E) (representative images; n = 5 animals per group).
  Scale bar: 100 μm. (F) Top 5 KEGG pathways associated with DEGs between DHT p.o.
  + LPS s.c. (n = 5 animals) and vehicle p.o. + LPS s.c. (n = 3 animals). (G and H)
  GSEA analysis of the IL-17 signaling pathway showing enrichment scores (G) and the
  top 14 leading-edge genes (H) in DHT p.o. + LPS s.c. versus vehicle p.o. + LPS s.c.
  (I) Venn diagram depicting common DEGs between DHT p.o. + LPS s.c. (n = 5 animals)
  and vehicle p.o. + LPS s.c. (n = 3 animals) and between DHT p.o. + FeCl3 s.c. (n
  = 4 animals) and vehicle p.o. + H2O s.c. (n = 3 animals). (J) Shared upregulated
  pathways between DHT p.o. + LPS s.c. and vehicle p.o. + LPS s.c. and between DHT
  p.o. + FeCl3 s.c. and vehicle p.o. + H2O s.c. are identified and highlighted. Data
  are represented as mean ± SEM. ****P < 0.0001, 2-tailed Student’s t test'
