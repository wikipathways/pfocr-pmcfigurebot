figure_title: B CD70hi and proliferating T cell types
caption: 'The R-L interactions, expression signature, and pathways of B CD70hi and
  proliferating T cells were assessed pre-CBD and post-CBD. (A) B CD70hi and proliferating
  T cells were analyzed as the source population sending signals to other immune cells
  and themselves. R-L interactions that changed post-CBD included TNF-TNFRSF1B, TGFB1–(TGFBR1+TGFBR2),
  and ICAM1–(ITGAL+ITGB2). R-L communication profiles were inferred using CellChat
  for cells pre- and post-CBD treatment. Bubble plots show directional ligand-receptor
  (L-R) signaling where post-CBD has inhibition or activation. (B and C) Gene expression
  patterns in B CD70hi (B) and T (C) cells exhibited similarities across 2 comparisons:
  No CD3/CD28 –CBD vs. CD3/CD28 –CBD (x axis) and CD3/CD28 +CBD vs. CD3/CD28 –CBD
  (y axis). Scatterplots depict the log2 fold changes (log2FC) in gene expression.
  Each point represents a gene with statistically significant differential expression
  (adjusted P value < 0.05) in both comparisons. Genes exhibiting opposing directions
  of regulation, up in one comparison and down in the other, are highlighted (green,
  upregulated with CBD under stimulation; gold, downregulated with CBD under stimulation).
  (D and E) The top 300 genes were ranked by Euclidean distance from the origin and
  used for pathway analyses for B CD70hi cells (D) and T cells (E) via pathfindR.
  Genes with FDR-adjusted P value less than 0.05 were input into pathfindR using the
  BioGRID protein-protein interaction network and KEGG gene set. Enriched pathways
  were subsequently filtered to retain only those containing known CBD receptors or
  R-L interactions. The enrichment chart displays the filtered pathways, ranked by
  –log10(P value), representing those most plausibly linked to CBD’s immunomodulatory
  actions'
