figure_title: In vitro and in vivo evaluation of the effect of FGFR signaling pathway
  modulation on the phenotype of OGD
caption: (A) Bone marrow stromal cells (BMSCs) from mutant mice were cultured in triplicate
  and a dose-response curve was obtained; the IC50, or the concentration of a substance
  (infigratinib) needed to inhibit a biological process (the phosphorylation of ERK)
  by 50%, was calculated at 1.26 nM. (B) BMSCs were isolated from Fgfr1N330I/+ mice
  and cultured to ~80% confluence; cells were then incubated with 125 ng/mL of infigratinib
  for 1 hour at 37°C. A 76% decrease in downstream phosphorylation compared to vehicle
  control was noted. Horizontal and vertical lines represent the mean ± SD of three
  biological replicates. * p < 0.05. (C) Graphical representation of the experimental
  design. The preclinical study involved genotyping on day of birth followed by subcutaneous
  injection of infigratinib 2 mg/kg/d of SQ infigratinib x 15 days to assess its effect
  in vivo. (D) Growth curve during infigratinib treatment trial. The naso-anal length
  of treated mutant animals (green inverted triangles) was intermediate between that
  of untreated mutant mice (empty circles) and WT mice (black circles and blue squares),
  with a significant difference in length between the treated mutant and the untreated
  (vehicle-treated) mutant mice (**** p < 0.0001 using a mixed model for repeated
  measures with time x treatment interaction effect). n = 6–17 mice/group
article_title: Disruption of the FGFR1-FGF23-Phosphate Axis and Targeted Therapy in
  a Murine Model of Osteoglophonic Dysplasia
