figure_title: KEGG-based GSEA of transcriptomic changes in FCA-L2 cells following
  FCP treatment after SP infection.
caption: KEGG-based GSEA of transcriptomic changes in FCA-L2 cells following FCP treatment
  after SP infection. (A) KEGG enrichment bubble plot showing pathways significantly
  regulated in the FCP_SP vs. SP group. The x-axis represents ES, bubble size indicates
  the number of enriched genes and color corresponds to the FDR. (B-F) GSEA enrichment
  plots and heatmaps of core genes in selected pathways, including (B) aminoacyl-tRNA
  biosynthesis, (C) biosynthesis of amino acids, (D) p53 signaling pathway, (E) amino
  sugar and nucleotide sugar metabolism and (F) biosynthesis of nucleotide sugars.
  Heatmaps show Z-score-normalized gene expression (n=4 per group). KEGG, Kyoto Encyclopedia
  of Genes and Genomes; GSEA, gene set enrichment analysis; FCP, fish collagen peptides;
  SP, Streptococcus pneumoniae; NC, negative control; ES, enrichment score; FDR, false
  discovery rate
