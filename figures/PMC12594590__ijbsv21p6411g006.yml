figure_title: Over-expression of macrophage HK2 augments STING pathway activation
  glycolysis and promotes, M1 polarization in the fibrotic liver.
caption: Over-expression of macrophage HK2 augments STING pathway activation glycolysis
  and promotes, M1 polarization in the fibrotic liver. (A-B) Double IF staining of
  F4/80 (green) and HK2 (red) in mice liver sections from different groups. Scale
  bar, 50 μm. (C) Protein expression of CD86 and STING, p-STING, IRF3, p-IRF3, TBK1
  and p-TBK1 in mice liver tissues were detected using western blot. (D) Gray analysis
  of the western blot results in (C). (E) Analysis of M1 macrophage polarization using
  dual-IF staining of F4/80 and CD86 in mice liver from various groups. (F) Dual-IF
  staining of p-STING and F4/80 in mice liver sections. (G-H) Quantification analysis
  of IF staining results in (E) and (F), respectively. (I) Relative lactate production
  in mice liver tissues, n=6. *p < 0.05, **p < 0.01, ***p < 0.001
