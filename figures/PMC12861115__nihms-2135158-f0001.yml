figure_title: Cytokine stimulation induces conserved and species-specific metabolic
  changes in activated human and mouse NK cells
caption: a, PCA of metabolites extracted from naive or day 3 (D3) IL-2/15-stimulated
  human and splenic mouse NK cells and analysed by LC–MS. b, PLS-DA analysis of naive
  or stimulated human and mouse NK cell metabolites. c, Heatmap showing relative levels
  of metabolites that were DA between naive human and mouse NK cells. d, Quantification
  of DA metabolites detected in D3 stimulated NK cells compared with naive cells per
  species. FC, fold change. e, Heatmaps showing log2 FC of human NK cell-specific
  (left) or mouse NK cell-specific (right) DA metabolite abundance in naive or stimulated
  NK cells compared with the average metabolite abundance of naive cells. f, MetPA
  of metabolites that were increased or decreased only in activated human NK cells,
  or increased only in activated mouse NK cells. FDR, false discovery rate. g, Heatmap
  showing log2 FC in metabolite abundance in naive or stimulated NK cells compared
  with the average metabolite abundance of naive cells of 46 species-conserved DA
  metabolites identified in c. h, MetPA of conserved DA metabolites identified in
  d. Dashed lines indicate pathway impact threshold of 0.5 and P value threshold of
  0.05. Data are representative of n = 3 independent human donors or mice per group.
  Statistical differences detected by one-way ANOVA (d) or hypergeometric test with
  Benjamini–Hochberg correction for multiple comparisons (h)
