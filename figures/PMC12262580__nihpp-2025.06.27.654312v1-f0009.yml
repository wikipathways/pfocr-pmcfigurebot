figure_title: SGLT2 inhibition restores age-related loss of cell–cell communication
  in the aging killifish kidney
caption: Cell–cell signaling networks inferred using CellChat from single-nucleus
  RNA-seq data.(A) Circle plot depicts the global intercellular signaling network
  in kidneys from old fish treated with SGLT2 inhibitor. Each node represents a cell
  type, and lines represent significant ligand–receptor interactions. The total number
  of interactions increased to 57 with treatment, compared to 30 in untreated old
  controls.(B) Bar plot shows relative information flow of key signaling pathways
  in old control (gray) versus SGLT2i-treated (red) kidneys, indicating selective
  reactivation of endothelial and perivascular signaling axes.(C) Comparison across
  all three groups (young, old control, and old + SGLT2i) highlights partial recovery
  of specific pathways (e.g., PECAM1, JAM, VEGF) toward a youthful signaling profile.
  Overall, SGLT2i-treated signaling pathways mimic young signaling pathways more than
  old untreated.(D) Heatmaps illustrate outgoing (left) and incoming (right) signaling
  patterns in renal cell types from old SGLT2i-treated kidneys. Several signaling
  axes are re-established, particularly from endothelial and perivascular cells.(E)
  Sankey plot visualizes major signaling pathways restored in SGLT2i-treated kidneys,
  with enhanced directional signaling among glomerular and tubular compartments.(F,
  G) Joint manifold learning was used to classify signaling pathways based on functional
  (F) and structural (G) similarity across groups. Each dot represents a signaling
  pathway, clustered by similarity in sender–receiver relationships. SGLT2i-treated
  kidneys (triangles) show a partial shift toward the youthful communication profile
  (circles), distinct from untreated aged controls (squares)
