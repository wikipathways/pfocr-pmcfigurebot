caption: (A) Schematic diagram showing the layout of the transcriptomics study conducted
  from the dataset deposited in the GEO database under accession number GSE230161
  [26]. Created in BioRender. Ingenuity Pathway Analysis (IPA) was performed to investigate
  enriched pathways and upstream regulators based on the differentially expressed
  genes. (B) Bubble chart created with IPA software representing the significant biological
  pathways (x-axis) and their broad categories (y-axis) enriched by the differentially
  expressed genes in severe PU (grades III–IV) as compared to grade II PU. The intensity
  of the color represents the magnitude of pathway being up- or down-regulated. (C)
  Comparison analysis of T cell communication-related pathways enriched in A in differentially
  expressed genes exclusively present in either severe PU or grade II PU using the
  comparison analysis function of IPA
