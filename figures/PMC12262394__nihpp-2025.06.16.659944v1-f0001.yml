figure_title: A treatment status single cell transcriptional Atlas of IPF
caption: '(A) Overview of experimental design. (i) Collection of disease lung explants
  (n = 74) and donor lungs (n = 64). The IPF cohort was segregated into three subcohorts:
  untreated IPF (n = 22), pirfenidone-treated IPF (n = 24) and nintedanib-treated
  IPF (n = 28). (ii) Dissociation into single-cell suspension. (iii) scRNA-seq library
  preparation and sequencing. (iv) Differential gene expression analysis. (v) Regulatory
  network and pathway analysis. (vi) Prioritization and validation of STAT3 as a novel
  clinical IPF target. (B-E) UMAP plots and accompanying bar charts showing effect
  of approved antifibrotics on cell counts in untreated IPF for selected cell types:
  (B) PTBSC and AT2 cells; (C) MACA and MACMOND; (D) FBALV and FBPERIB; (E) VEN and
  CAPG. C, control; UNT, untreated IPF; TRT, approved antifibrotic-treated IPF'
article_title: Single cell transcriptomics in a treatment-segregated cohort exposes
  a STAT3-regulated therapeutic gap in idiopathic pulmonary fibrosis
