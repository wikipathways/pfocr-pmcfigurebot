figure_title: IGF2-mediated signaling pathways and the functional roles of IGF receptors.
caption: 'IGF2-mediated signaling pathways and the functional roles of IGF receptors.
  This schematic illustrates the interactions between IGF2 and its primary receptors:
  IR-A, IGF1R and IGF2R (CI-M6PR). The arrow thickness indicates the relative binding
  affinity. IR-A and IGF1R are tyrosine kinase receptors. Upon IGF2 binding, they
  activate the PI3K/Akt and MAPK signaling pathways, promoting cell survival, proliferation
  and metabolic regulation. By contrast, IGF2R lacks signaling capability and primarily
  functions to internalize and target IGF2 for lysosomal degradation, thus regulating
  its bioavailability. It also transports M6P-tagged proteins and modulates the TGF-β
  pathway, influencing extracellular matrix dynamics and tissue homeostasis. IGF,
  insulin-like growth factor; IGF1R/IGF2R, IGF1/2 receptor; CI-M6PR, cation-independent
  mannose-6-phosphate receptor; IR-A, insulin receptor isoform A'
