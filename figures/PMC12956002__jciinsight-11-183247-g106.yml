figure_title: Altered mitochondrial proteome in the liver of Irp1–/– mice
caption: For10 weeks, 5-week-old male Irp1–/– mice and WT littermates (n = 4 per experimental
  group) were provided a high-fat diet (HFD). At the endpoint, the mice were euthanized,
  and livers were dissected for proteomics analysis. (A) Volcano plot of differentially
  expressed proteins (Irp1–/– versus WT); P value threshold was set to 0.05 and fold
  change to 2. (B) Number of up- and down-regulated proteins in the liver of Irp1–/–
  versus WT mice. (C) Pathway enrichment analysis generated by the QIAGEN IPA software.
  (D) STRING networks based on all differentially expressed proteins show that the
  major enrichment in GO terms and KEGG pathways is linked to mitochondrial respirasome.
  (E) Western blot analysis of mitochondrial respiratory chain proteins corresponding
  to complexes I, II, III, IV, and V using whole liver extracts from 3 representative
  mice in each group. The membranes were also probed with antibodies against IRP1,
  β-actin (cytosolic loading control), and Tom20 (mitochondrial loading control).
  Blots were quantified by densitometry relative to Tom20, and average values are
  shown on top. Ratios of respiratory chain proteins to Tom20 from WT mice are set
  as 1
article_title: IRP1 deficiency alters mitochondrial metabolism and protects against
  metabolic syndrome pathologies
