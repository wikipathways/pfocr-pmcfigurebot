figure_title: Enavogliflozin (Envlo) improved high-fat, high-cholesterol (HFHC)-induced
  liver fibrosis through inhibiting transforming growth factor β1 (TGF-β1)/Smad2 signaling
  pathway.
caption: 'Enavogliflozin (Envlo) improved high-fat, high-cholesterol (HFHC)-induced
  liver fibrosis through inhibiting transforming growth factor β1 (TGF-β1)/Smad2 signaling
  pathway. (A) Body weight and (B) food intake of mice after 12-week feeding. (C)
  Liver sections of mice after being fed within 12 weeks were stained with Masson’s
  trichrome to assess the extracellular matrix (scale bars: 100 and 50 μm). (D) Western
  blot analysis showed the protein expression levels of α-smooth muscle actin (α-SMA),
  TGF-β1, pSmad2, and Smad2 in mouse liver tissue. (E) pSmad2, Smad2, pSmad3, and
  Smad3 in LX-2 were evaluated after treatment with TGF-β1 and Envlo in 24 hours using
  Western blot. CD, chow diet; GAPDH, glyceraldehyde-3-phosphate dehydrogenase; NS,
  not significant. aP<0.05, bP<0.01, cP<0.005, dP<0.001'
