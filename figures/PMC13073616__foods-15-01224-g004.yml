figure_title: Proteomic and spatial lipidomic analyses of different oat compartments.
caption: 'Proteomic and spatial lipidomic analyses of different oat compartments.
  (Left): Ion distribution images of different triacylglycerol (TG) and phosphatidylcholine
  (PC) adducts detected via MALDI mass spectrometry imaging across tissue sections
  from two oat varieties (cv. Bannister and cv. Bilby). Signal intensities ranged
  from low (dark blue) to high (yellow). (Right): Heatmap comparing abundances of
  proteins involved in the FAS pathway (in triplicate) identified in endosperm and
  embryo fractions (distinguished with dotted lines) via proteomics. Dashed lines
  indicate the boundary between endosperm and embryo fractions. Adapted (from Figure
  6C) from Lau et al. [104] with permission from Elsevier. *, p < 0.05; **, p < 0.01;
  ***, p < 0.005. ACCase, acetyl-CoA carboxylase; ENR, enoyl-CoA reductase; GPAT,
  glycerol-3-phosphate acyltransferase; HAD, 3-hydroxyacyl-ACP dehydratase; KAR, 3-ketoacyl-ACP
  reductase; KAS, ketoacyl-ACP synthase; LACS, long-chain acyl-CoA synthetase; LPAAT,
  lysophosphatidic acid acyltransferase; MCMT, malonyl-CoA:ACP transacylase; PC, phosphatidylcholine;
  SAD, stearoyl-ACP desaturase; TG, triacylglycerol; TE, fatty acid thioesterase'
