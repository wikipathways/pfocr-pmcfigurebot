figure_title: Trajectory inference and lineage progression of tSTM subclusters
caption: A) Monocle 2 trajectory analysis revealed differentiation paths for subclusters
  0, 4, and 6. Subclusters 4 and 6 are positioned at early stages, and subcluster
  0 represents a polyp-enriched epithelial branch. B) Pseudotime ordering demonstrated
  a continuum from early to late states with terminal branches corresponding to more
  differentiated populations. C) CytoTRACE mapping along the trajectory confirmed
  the highest stemness scores at the trajectory root. D) Cells with the least differentiated
  state localized to the trajectory origin. E) RNA velocity analysis showed directional
  flow from subcluster 4 toward subclusters 6 and 0 to support a unidirectional differentiation
  pathway. F) Pseudotime heatmap further validated the temporal progression from early
  (purple) to late (yellow) states, consistent with RNA velocity and transcriptional
  activity
