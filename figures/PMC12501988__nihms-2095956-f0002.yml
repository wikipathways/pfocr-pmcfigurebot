figure_title: Comprehensive RNA-seq data analysis reveals that MTAP inhibition in
  mice reduces factors associated with proximal tubule injury and that MTAP is abundant
  in HAVCR1-positive proximal tubules in humans with AKI
caption: |-
  (A) Dumpbell plot displaying the normalized enrichment scores (NES) for top pathways (Hallmark data set). Blue: IR-vehicle vs. sham and pink: IR-MTAPi vs. IR-vehicle (B) Dot chart of the top pathways via gene ontology (GO) biological process (BP) pathway enrichment analysis. Top: IR-vehicle vs. sham and bottom: IR-MTAPi vs. IR-vehicle. (C) GSEA enrichment plots show the differentially expressed genes in IR-vehicle vs. Sham (Top) and IR-MTAPi vs. IR (bottom) against genes associated with failed repair PT (left) and severely injured PT (right) (data set from Kirita et al.7). NES, Normalized Enrichment Score; ES, Enrichment Score. (D)
  MTAP expression across PT subpopulations under Healthy (Left) vs. AKI conditions (Right) (E)
  HAVCR1 expression across PT subpopulations under Healthy (Left) vs. AKI conditions (Right). (F) Multi-dimensional dot plot representation of HAVCR1 and MTAP expression in healthy vs. AKI samples. (G) Multi-dimensional dot plot representation of MTAP expression based on HAVCR1. The analysis shown in D-G was based on scRNA-seq data from the KPMP subset PT subpopulations comparing Healthy and AKI patients’ samples. PT-S1/S2: Proximal tubule cells from the S1 and S2 segments; PT-S3: Proximal tubule cells from the S3 segment; aPT: adaptive PT cells; dPT: dedifferentiated proximal tubule cells; and dPT/DTL: dedifferentiated PT/descending thin limb cells; cycEPI: cycling epithelial cells
