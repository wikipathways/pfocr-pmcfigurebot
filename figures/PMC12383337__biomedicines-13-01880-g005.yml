figure_title: Schematic representation of the pyroptosis signaling pathways.
caption: Schematic representation of the pyroptosis signaling pathways. The diagram
  illustrates the activation of pyroptosis by inflammation, leading to the processing
  of pro-IL-1β/18 into mature IL-1β/18 by caspase-1. This process involves the formation
  of the NLRP3 inflammasome, which is activated by ASC, caspase-1, and NEK7 oligomerization.
  The activation of gasdermin D (GSDMD) by caspase-1 results in the formation of GSDMD
  pores in the cell membrane, leading to the release of intracellular contents and
  the influx of potassium ions (K+) through K+ channels. Additionally, the diagram
  shows the role of mitochondria and reactive oxygen species (ROS) in this process,
  as well as the activation of NF-κB, which is involved in the regulation of inflammatory
  responses
