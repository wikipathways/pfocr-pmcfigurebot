figure_title: Proteomic profiling of xenografted tumors reveals downregulation of
  oncogenic pathways in MTARC1 p.
caption: 'Proteomic profiling of xenografted tumors reveals downregulation of oncogenic
  pathways in MTARC1 p.A165 knockout (KO) tumors. Whole-cell proteomics was performed
  on 8 Hep3B2 mock and 7 MTARC1 p.A165 KO xenografted tumors. Samples were processed
  and proteins were quantified using MS/MS, liquid chromatography-tandem mass spectrometry.
  The protein abundance ratios were log2-transformed, and statistical significance
  was assessed using Benjamini-Hochberg test, with an adjusted P-value threshold of
  <0.05. A |log₂FC|≥±0.58 cutoff was used to define upregulation or downregulation.
  (A) Correlation of log2 FC in protein expression between Hep3B2 mock and MTARC1
  KO cells and their corresponding xenografted tumors in nude mice. Red colour indicates
  upregulated proteins while blue colour indicates downregulated proteins in both
  cell lines and tumors. The correlation highlights the similarities and differences
  in protein expression profiles between in vitro and in vivo settings. Pearson’s
  correlation coefficient was calculated in R. The colour intensity in the heatmap
  represents the Log2 FC values. Pathway enrichment analysis was performed using Enrichr,
  and the following pathways were enriched in MTARC1 KO tumors: (B) Erythrocytic proteins,
  (C) Hypoxia, (D) p53 pathway, (E) G2-M checkpoint, and (F) Myc repressed pathway.
  MTARC1, mitochondrial amidoxime-reducing component 1; MS/MS, tandem mass spectrometry'
