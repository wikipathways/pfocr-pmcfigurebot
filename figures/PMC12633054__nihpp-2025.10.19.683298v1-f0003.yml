figure_title: Prophylactic IFN-β treatment reduces RV replication and ameliorates
  epithelial IFN, inflammatory and remodeling pathways
caption: (A) Dot plot showing log transformed viral copy number values by exacerbation
  status between samples at Day 2 treated with IFN-β. The IFN-β treated group showed
  a significant decrease in viral load compared to the Untreated samples in both exacerbation
  groups with a 3.39-fold decrease in the NSE group (n=6 donors) and a 4.22-fold decrease
  in the SE group (n=6 donors), boxplots indicate mean and interquartile ranges for
  each group. (B) Dot plot showing expression changes in Interferon response module
  by IFN-β treatment. Regression plot showing association between the “Interferon
  response” module and viral load by IFN-β treatment. (C) Dot plot showing expression
  changes in Epithelial Remodelling and Inflammation Response module by IFN-β treatment.
  Regression plot showing association between the “Epithelial Remodelling and Inflammation
  Response” module and viral load by IFN-β treatment. (D) Dot plot showing expression
  changes in Stress response module by IFN-β treatment. Regression plot showing association
  between the “Stress response” module and viral load by IFN-β treatment. (E) Dot
  plot showing expression changes in Cellular metabolism module by IFN-β treatment.
  Regression plot showing association between the “Cellular metabolism” module and
  viral load by IFN-β treatment. (F) Dot plot showing expression changes in Cellular
  transcriptional activity module by IFN-β treatment. Regression plot showing association
  between the “Cellular transcriptional activity” module and viral load by IFN-β treatment.
  Boxplots indicate median and interquartile ranges for each group and the Fit line
  is based on a linear model including 95% confidence intervals
article_title: Transcriptomic Profiling of Bronchial Epithelium Reveals Dysregulated
  Interferon and Inflammatory Responses to Rhinovirus in Exacerbation-Prone Pediatric
  Asthma
