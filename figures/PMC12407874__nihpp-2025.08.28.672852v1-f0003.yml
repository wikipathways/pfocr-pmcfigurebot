figure_title: Dual-compartment profiling is required to resolve preferential protein
  localization
caption: '(A) Filters used to identify the top 200 transmembrane (TM) proteins labeled
  by either HRPendo (top) or HRPsurf (middle) and a Venn diagram (bottom) of the proportion
  of the TM proteins that are labeled by either/both HRP transgenes.(B) Heatmaps depicting
  endosome and surface enrichment (in log2[HRPsurf/HRPendo] fold change) of the top
  200 TM proteins labeled by HRPendo. Proteins are rank ordered from highest to lowest
  labeled by HRPendo from top left to bottom right. Many of the top 200 TM proteins
  labeled by HRPendo were more highly enriched in surfaceomes than endocytomes. Enrichment
  of TM proteins in pink was validated in C and D. Note: some of the top proteins
  are regulate secretory pathway-to-endolysosomal network trafficking or degradation
  (detailed in Table S2 and Figure 2).(C) Images of colocalization of myristoylated-RFP
  expressed only in ORNs and surface-enriched proteins FasIII (left) and Nrg (right).
  Note that based on anatomy and membrane staining, the puncta in FasIII images are
  largely from projection neurons. Images were taken at ~36h APF. Scale bar, 5 µm.(D)
  Airyscan super-resolution images of all ORN axons expressing the early endosome
  marker mCherry-FYVE and endogenously tagged Gliotactin (Gli)-YFP (left) and anti-Mcr
  (right). Images were taken at ~36h APF. Scale bar, 5 µm (D); 1µm (D, zoom). Note:
  non-colocalized puncta are likely in other endolysosomal compartments'
article_title: Endocytome profiling uncovers cell-surface protein dynamics underlying
  neuronal connectivity
