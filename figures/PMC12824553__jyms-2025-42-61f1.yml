caption: Schematic of neural circuits modulated by glucagon-like peptide-1 receptor
  agonists. The reward circuit, a neural pathway extending from the ventral tegmental
  area (VTA) to the nucleus accumbens (NA), modulates motivation and reward-seeking
  behavior. The VTA also projects to the prefrontal cortex (PFC), which works in conjunction
  with the amygdala (Am) and hippocampus (Hi) to perform functions related to memory
  and emotion. Hy, hypothalamus; NTS, nucleus tractus solitarius. Created with BioRender.com
  by the author
