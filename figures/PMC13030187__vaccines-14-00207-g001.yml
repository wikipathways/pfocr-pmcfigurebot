figure_title: Pathway through which influenza vaccination reduces antibiotic use and
  antimicrobial resistance.
caption: Pathway through which influenza vaccination reduces antibiotic use and antimicrobial
  resistance. Schematic representation of the mechanisms by which influenza vaccination
  influences antibiotic prescribing and antimicrobial resistance. By preventing influenza
  infection and reducing disease severity, vaccination lowers the incidence of influenza-related
  hospitalizations and secondary bacterial infections. This results in decreased antibiotic
  exposure, including reductions in inappropriate or prophylactic use, thereby diminishing
  selective pressure for the emergence and spread of resistant bacterial pathogens
  such as Staphylococcus aureus, Streptococcus pneumoniae, and others. Through these
  interconnected effects, influenza vaccination functions not only as a preventive
  measure against viral disease but also as an important population-level intervention
  to mitigate antimicrobial resistance. Graph created with BioRender.com
