figure_title: DAF-16/FOXO regulates DNA damage repair pathway gene expression
caption: (A) Heat map representation of the levels of DNA damage repair (DDR) genes
  from transcriptomics data comparing daf-2(1370) and daf-16(mgdf50);daf-2(e1370)
  late-L4 staged worms grown on control RNAi.(B) Quantitative RT-PCR analysis showing
  mRNA fold change in DDR gene expression in daf-2(1370) and daf-16(mgdf50);daf-2(e1370)
  late-L4 staged worms grown on control RNAi. Expression levels were normalized to
  actin. The average of three biological replicates is shown. Unpaired t-test with
  Welch’s correction.(C) UCSC browser view of DAF-16/FOXO peaks on the DDR gene (rad-51,
  rad-50, wee-1.3, mrt-2, brc-1 or pch-2) promoters as determined by ChIP-seq using
  an anti-DAF-16 antibody [29]. Red boxes indicate the binding on promoter regions
  of DDR genes. The upper panel shows daf-2(e1370), where DAF-16 peaks are observed,
  while lower panel shows daf-16(mgDf50);daf-2(e1370) (that lacks specific DAF-16
  peaks).Experiments were performed at 20°C. Source data are provided in Table 1
