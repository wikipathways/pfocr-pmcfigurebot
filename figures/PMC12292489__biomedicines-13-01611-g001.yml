figure_title: The microenvironment of duodenal adenocarcinoma is characterized by
  acidity and a high level of macrophage infiltration.
caption: The microenvironment of duodenal adenocarcinoma is characterized by acidity
  and a high level of macrophage infiltration. (a) Principal component analysis (PCA)
  of transcriptome sequencing data from 11 paired samples of duodenal adenocarcinoma
  tumor tissues and adjacent normal tissues; (b,c) heatmap of 18 differentially expressed
  lncRNAs (b) and their correlated mRNAs (c) between normal and tumor tissues, as
  described in Figure 1a Signaling pathways related to these genes are shown in panel
  C; (d) cancer hallmark signaling pathways associated with the genes co-expressed
  with the differentially expressed lncRNAs; (e) infiltration levels of immune cells
  in normal and duodenal adenocarcinoma tumor tissues; (f) mRNA expression levels
  of acidic environmental markers in normal and duodenal adenocarcinoma tumor tissues;
  (g–i) correlation analysis of expression between 18 lncRNAs and macrophage markers
  (g); macrophage markers and acidic environmental markers (h); and 18 lncRNAs and
  acidic environmental markers (i); The Pearson correlation coefficient (r) and p-values
  are shown * p < 0.05, ** p < 0.01, *** p < 0.001 and **** p < 0.0001
