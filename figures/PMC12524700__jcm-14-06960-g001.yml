figure_title: Summary of the major TKIs mutation pathways involved in NSCLC.
caption: 'Summary of the major TKIs mutation pathways involved in NSCLC. JAK-STAT,
  RAS, and PI3K-AKT are three key signaling pathways in NSCLC. These pathways are
  well-known regulators of cell cycle development, growth, and apoptosis/cell survival;
  dysregulation is a common feature of human cancers. Modifications in essential pathways
  will influence DNA methylation modifications, such as elevated DNA methyltransferases
  (DNMTs), DNA post-translation, and reduced ten-eleven translocation methylcytosine
  dioxygenases (TETs), enabling amplification of mesenchymal homology box 2 (MEOX2),
  which has a negative association with patient survival. As a consequence, the expression
  of key cell cycle checkpoints and tumor suppressor biomarkers (P53, P21, and other
  related biomarkers) will decrease to allow cancer cell proliferation and survival.
  Tyrosine kinase inhibitors (TKIs) are a class of drugs specifically designed to
  target major genomic mutations that act as oncogenic drivers in non-small cell lung
  cancer (NSCLC). These mutations lead to the overactivation of key signaling pathways,
  which in turn drive uncontrolled cell proliferation, growth, and survival. As shown
  in the figure, the primary genomic mutations targeted by TKIs include the following:
  EGFR mutations: These are common mutations in the epidermal growth factor receptor
  (EGFR) gene. TKIs inhibit the signaling of the mutated EGFR protein, thereby blocking
  the downstream signaling pathways like RAS-RAF-MEK-ERK and PI3K-AKT-mTOR. The figure
  also shows the EGFR T790M mutation, a common resistance mechanism that requires
  a different type of TKI. ROS1 fusions: A genetic rearrangement involving the ROS1
  gene that leads to a constitutively active kinase, which is targeted by specific
  TKIs. EML4-ALK fusions: A gene fusion that creates an oncogenic protein with constant
  kinase activity, which is a major target for ALK inhibitors, a type of TKI. The
  figure also highlights other genomic changes that can act as either primary drivers
  or resistance mechanisms, such as BRAF V600E mutation, MET amplification, and PIK3CA
  mutations, all of which can be targeted by specific inhibitors to disrupt the cancer
  cell’s signaling'
