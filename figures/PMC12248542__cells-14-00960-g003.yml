figure_title: Localization, trafficking and secretion of APOL1.
caption: 'Localization, trafficking and secretion of APOL1. The main pools of APOL1
  are detected at the endoplasmic reticulum (ER) with further portions reported at
  the plasma membrane (PM), early/late endosome (EE/LE, also called multivesicular
  body, MVB), lysosome and endolysosome (EL), mitochondria and Golgi apparatus as
  well as at Lipid droplets (LD) and high-density lipoprotein (HDL) particles. Recycling
  and degradation could be mediated via the endolysosomal-autophagic system. Acidification
  of APOL1 may take place in the endolysosomal pathway or the conventional secretion
  via the Golgi apparatus (turquoise arrows). Mitochondrial APOL1 could integrate
  both into the outer or inner mitochondrial membrane (OMM, IMM) and transported via
  mitochondria-derived vesicles (MDV). Possible pathways for APOL1 secretion (orange
  arrows) could be conventional secretion (a), or unconventional secretion (b). In
  addition, transport via LD or HDL particles is possible (thick black arrows). Both
  arise within the ER, which leads to a lipid mono- or bilayer perhaps containing
  ER-located APOL1 proteins encapsulating them when released (c). A reported association
  of APOL1 with cholesterol, which is produced in the ER may also be part of the trafficking
  and release of APOL1 (d). Inset: Independent of its localization, APOL1 can appear
  as a membrane-associated protein (in luminal or cytoplasmic orientations), as secretory
  or luminal protein, as an integral transmembrane protein, or even as pore-forming
  protein'
article_title: 'A Cell Biologist’s View on APOL1: What We Know and What We Still Need
  to Address'
