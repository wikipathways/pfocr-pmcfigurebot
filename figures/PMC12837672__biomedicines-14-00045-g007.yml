caption: 'Enriched pathway analysis of differentially expressed genes in PRPF31-ROs:
  Gene ontology (GO) and pathway enrichment results for DEGs within specific retinal
  cell types, highlighting the biological processes most affected by the PRPF31 mutation.
  (A) Top enriched pathways in PRPF31-ROs RGCs (d85-mut) at an early stage include
  oxidative stress response, regulation of neuron death, and axon development. (B)
  Müller cells in PRPF31-ROs (d85-mut) show enrichment of pathways related to response
  to chemical and oxidative stress, and gliogenesis. (C,D) Rod and cone photoreceptors
  in PRPF31-ROs on day 85, aside from oxidative stress signaling; phototransduction
  pathways remain largely intact early on (C). By day 285 (D), PRPF31 photoreceptors
  show significant enrichment for inflammatory response pathways, alongside a downregulation
  of phototransduction and light detection pathways. Key downregulated processes include
  outer segment morphogenesis and retinal cell maintenance, reflecting the collapse
  of photoreceptor structure and function at end-stage'
