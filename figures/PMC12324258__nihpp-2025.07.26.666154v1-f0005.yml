figure_title: GRM-SEM and phenotype models in ABCD (without rGE)
caption: (a) Scree plot, (b) path diagram, (c) standardised genetic and residual variance,
  and (d) genetic and residual correlation patterns of the best fitting GRM-SEM model
  (CIP) (N=4,412). (e) Scree plot and (f) path diagram of the best fitting phenotype
  model, based on a split-half approach (N=2,206). (a,e) The number of PCs was predicted
  with PCAs using the Kaiser’s criterion (Eigenvalue>1; grey line), and Cattell’s
  scree test (dashed line). (b,f) Path diagrams with standardised factor loadings
  and corresponding standard errors for the best-fitting models. The best-fitting
  GRM-SEM (CIP) model (b) consists of genetic (A), residual (E), and specific residual
  (ES) factors. The best-fitting phenotypic model (f) consists of phenotypic (P) and
  specific (PS) factors (specific factor loadings are shown as the square root of
  the specific factor variance). Observed measures are represented by squares and
  latent variables by circles. Single-headed arrows (paths) define relationships between
  variables, and double-headed arrows correlations. The variance of latent variables
  is constrained to unit variance. Note that SEs for GRMSEM SNP-h2 contributions (c)
  have been omitted for clarity. Due to little evidence for trait SNP-h2, as estimated
  with GREML, we only modelled the latent residual structure in ABCD using a CIP model.ABCD
  - Adolescent Brain Cognitive Development Study; CC - Crystalized cognition (NIH
  Toolbox); CIP - Hybrid Cholesky/Independent pathway; FC - Fluid cognition; GREML
  – Genomic Restricted maximum likelihood; MR - Matrix reasoning; SNP-h2 - SNP-heritability;
  SP - Social problems; Y - Years
