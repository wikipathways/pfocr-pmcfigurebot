figure_title: Constitutive activation of the Janus kinases and signal transducer and
  activator of transcription (JAK/STAT) signaling pathway mainly mediated by mutations
  in the JAK2, CALR and MPL genes in pluripotent hematopoietic stem cells (HSC) is
  crucial for the pathogenesis of BCR::ABL1-negative myeloproliferative neoplasms
  (MPN).
caption: Constitutive activation of the Janus kinases and signal transducer and activator
  of transcription (JAK/STAT) signaling pathway mainly mediated by mutations in the
  JAK2, CALR and MPL genes in pluripotent hematopoietic stem cells (HSC) is crucial
  for the pathogenesis of BCR::ABL1-negative myeloproliferative neoplasms (MPN). Despite
  the activation of JAK/STAT signaling and its influence on the proliferation of malignant
  cells is well studied in patient samples and JAK2- and CALR-mutated cell systems,
  there exists limited information about the link between interferon (IFN)-γ signaling
  and bone marrow (BM) environment alterations. Therefore, two human JAK2 V617F-mutated
  cell lines, 265 bone marrow biopsies (BMB) of MPN patients, separated in two independent
  cohorts, both with known clinical parameters, such as driver mutations, treatment
  and survival, 50 non-neoplastic BMB and five publicly available bulk and single
  cell RNA expression data sets of MPN samples with known JAK2 or CALR mutation status
  were analyzed regarding (i) the role of IFN-γ signaling, (ii) its interrelation
  with the composition of the local BM tumor microenvironment (TME), (iii) the expression
  of immune response relevant molecules and (iv) their impact on patients’ survival.
  Created in BioRender. Bauer, M. (2025) https://BioRender.com/h133y7w
