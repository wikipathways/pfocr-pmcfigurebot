figure_title: Workflow of model development and the DL neural network architecture.
caption: Workflow of model development and the DL neural network architecture. The
  model was developed utilizing multiple-planar analysis (i.e., transverse, sagittal,
  and coronal planes) within a DL framework. Within each processing pathway, the DL
  network extracts discriminative features by integrating spatial relationships via
  a ResNet architecture. Features aggregated from the parallel pathways were subsequently
  concatenated and fused by the ensuing fully connected (FC) layers. The network accepts
  the original image containing solely the lesion region as input and outputs the
  pathological binary classification alongside corresponding heatmaps visualizing
  salient regions
