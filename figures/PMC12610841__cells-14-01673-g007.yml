figure_title: Top canonical pathway and top regulatory networks in hospitalized COVID-19
  patients.
caption: Top canonical pathway and top regulatory networks in hospitalized COVID-19
  patients. DNA methylation analysis was performed on nasopharyngeal samples from
  27 COVID-19 patients (P) at inclusion (1) N = 21 and 6 weeks post-inclusion (2)
  N = 15, and from healthy controls (N = 12) (HC). (A) Canonical pathway analysis
  was performed with Ingenuity Pathway Analysis to identify the top potentially activated
  and inhibited pathways linked to the methylated genes located in the transcription
  start sites TSS1500 and TSS200, with the z-score cut-off set to 1. Positive z-score
  is indicated in orange, while negative z-score is indicated in blue. Significant
  TSS differentially methylated CpGs with a cut-off of +/− 0.3-fold-change were assessed
  in Ingenuity Pathway Analysis for the (B) top regulator effect network and for (C)
  graphical summary. An asterisk (*) indicates an inferred upstream regulator
