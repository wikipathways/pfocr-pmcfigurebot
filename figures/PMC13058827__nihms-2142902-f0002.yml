figure_title: Increased ANGPT2 is associated with AD progression in patients
caption: '(A) Overview of the ROSMAP sample cohort (n = 436).(B) Uniform manifold
  approximation and projection (UMAP) visualization showing 14 distinct cell types
  identified from postmortem brain tissue in the ROSMAP sample cohort.(C) Average
  relative expression of marker genes across the 14 identified cell types.(D) Functional
  annotation of upregulated and downregulated DEGs in endothelial cells between patients
  with AD (diagnosis value = 4, n = 141) and patients with MCI (diagnosis value =
  2, n = 110), showing significantly enriched biological processes, corrected for
  multiple comparisons using the false discovery rate (FDR). (E) Volcano plot showing
  DEGs in endothelial cells between patients with AD (diagnosis value = 4, n = 141)
  and patients with MCI (diagnosis value = 2, n = 110). DEGs involved in the regulation
  of the vascular permeability pathway (GO: 0043114) are labeled.(F) Violin plot showing
  relative ANGPT2 expression across the 14 identified subclusters. ANGPT2 was highly
  enriched in endothelial cells compared to other cell types.(G–I) Boxplot of log-normalized
  ANGPT2 expression levels stratified into high- (>75th percentile), medium- (25th
  to 75th percentile), and low- (<25th percentile) expression groups (G). Distribution
  of log-normalized ANGPT2 expression across the three ANGPT2 expression groups, with
  proportions compared by CERAD score (sparse, score = 3; moderate, score = 2; frequent,
  score = 1) (H) or diagnosis value (MCI, diagnosis value = 2; AD, diagnosis value
  = 4) (I).(J) Elevated ANGPT2 levels in the CSF samples of patients with AD compared
  to patients with MCI.(K and L) UMAP visualization of endothelial subclusters, including
  arterial, capillary, and venous endothelial cells, identified from patients with
  AD (n = 24) and controls (n = 20) (K), and ANGPT2 expression across these subclusters
  (L). Each dot indicates an individual endothelial cell.(M) Comparison of ANGPT2
  expression (log-normalized counts per million +1) between patients with AD and controls
  in arterial, capillary, and venous endothelial subclusters using pseudobulk analysis.
  Each dot indicates an individual patient.(N and O) Increased ANGPT2 levels in brain
  blood vessels of patients with AD compared to non-AD control brains with no diagnostic
  abnormalities (N) and the corresponding quantification (O). Scale bars: 100 μm.Each
  dot represents an individual patient for (J), (M), and (O). Data are presented as
  the mean ± SEM'
