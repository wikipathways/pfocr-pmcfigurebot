figure_title: Pathway enrichment analysis between HSD and RSD skeletal muscle via
  GSEA
caption: (a) Barplot showing the top differentially regulated Hallmark pathways between
  RSD and HSD (FDR<=0.05). The magnitude of pathway regulation is shown in the x-axis
  via the Normalized Enrichment Score (NES). A positive NES indicates pathway upregulation
  in RSD compared to HSD, and a negative NES indicates the opposite. Pathway names
  are listed on the y-axis. Bars are color coded from light blue to dark blue based
  on the negative logarithm of the significance of pathway enrichment (−log10FDR)
  with deeper shades indicating stronger significance. (b) Network analysis of enriched
  pathways based on common gene membership. Genes contributing to the core enrichment
  of pathways in (a) were identified from GSEA reports and used to generate a gene-overlap
  network of the pathways. Pathways are represented as nodes and the number of genes
  shared between pathways are shown as edges. Pathways colored orange are up-regulated
  in RSD compared to HSD whereas pathways colored green are down-regulated. The thickness
  of an edge between two nodes is proportional to the number of shared genes between
  the nodes
