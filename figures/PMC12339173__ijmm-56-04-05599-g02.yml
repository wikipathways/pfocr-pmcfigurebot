figure_title: Role of HDAC4 in cardiac hypertrophy.
caption: Role of HDAC4 in cardiac hypertrophy. Most studies have shown that AngII
  induces cardiac hypertrophy, and HDAC4 can promote the expression of ANP, BNP, β-MHC
  and ANF, thereby contributing to myocardial hypertrophy. It is well established
  that the CaMKII/HDAC4/MEF2C axis, as a classical signaling pathway, plays a crucial
  role in exacerbating cardiac hypertrophy. Additionally, HDAC4 mediates the effects
  of WWP1, CKIP-1, lncRNA MHRT and FGF23 in the progression of myocardial hypertrophy.
  HDAC4, histone deacetylase 4; AngII, angiotensinII; PP2A, phosphatase-2A; CKIP-1,
  casein kinase-2 interacting protein-1; WWP1, WW domain-containing E3 ubiquitin protein
  ligase 1; DVL2, disheveled segment polarity protein 2; CaMKII, calcium/calmodulin-dependent
  protein kinase II; MEF2C, myocyte enhancer factor 2C; ANP, atrial natriuretic peptide;
  BNP, brain natriuretic peptide; β-MHC, β-myosin heavy chain; ANF, atrial natriuretic
  factor; MHRT, myosin heavy chain associated RNA transcript; SP1, specificity protein
  1; SIRT1, sirtuin1; PGC1-α, proliferator-activated receptor γ coactivator 1α; PPARα,
  peroxisome proliferator-activated receptor α; ERβ, estrogen receptor β; GLP-1, glucagon-like
  peptide-1; Nox4, NADPH oxidase 4; FGF23, fibroblast growth factor 23; IP3, inositol
  1,4,5-triphosphate; Gal-1, galectin-1; LTCC, L-type calcium channel; Nppa, natriuretic
  peptide A; Myh7, myosin heavy chain 7
