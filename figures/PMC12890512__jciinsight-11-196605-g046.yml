figure_title: ANGPTL8 activates P38 to induce CCL5 and macrophage polarization
caption: (A) Pathway enrichment analysis in BMDMs treated with rA8 (n = 3). (B) Western
  blot analysis of the phosphorylation of signaling molecules in BMDMs with rA8 stimulation.
  (C) CCL5 levels in the CM and (D) migration of BMDMs pretreated with phosphorylation
  inhibitors before rA8 stimulation (n = 6 cells examined over 3 independent experiments).
  U0126, p-ERK inhibitor; SB203580, p-P38 inhibitor. (E) Experimental scheme for phosphorylation
  inhibitor injection before rA8 stimulation in wild-type mice. (F) Plasma CCL5 levels
  of indicated groups (n = 8 mice/group). (G) Migration of U937 and THP-1 cells pretreated
  with or without phosphorylation inhibitors before rA8 stimulation (n = 5 cells examined
  over 3 independent experiments). (H) Flow cytometry analysis of M1 (proinflammation
  phenotype) macrophages (CD11bhiCD206lo) and M2 (antiinflammation phenotype) macrophages
  (CD11bloCD206hi) in livers of wild-type mice with scramble or rA8 injection. (I)
  Quantification of the proportions of M1 and M2 macrophages. (J) Proinflammation
  chemokines levels in the CM from BMDMs pretreated with or without phosphorylation
  inhibitors before rA8 stimulation (n = 5 cells examined over 3 independent experiments).
  The data are shown as the mean ± SEM and were statistically analyzed by 1-way ANOVA
  with Tukey’s multiple-comparison test (C, D, G, and J) or 2-tailed Student’s t test
  (F and I). All samples are biologically independent replicates, and n indicates
  the number of biologically independent samples examined. Data shown are representative
  of 3 independent experiments with similar results (B and H). All the P values were
  2 sided, and adjustments were made for multiple comparisons. **P < 0.01, ***P <
  0.001, **** P < 0.0001. CM, conditioned medium; kDa, relative molecular weight in
  kilodaltons
