caption: 'Non-phloem parameters (A–L) of Bemisia tabaci MED feeding on ToCV-infected,
  ToCV&TYLCV co-infected, and un-infected tomato plants. Np: non-probe activity; C:
  intercellular stylet pathway; pd: short intracellular punctures; E: phloem-related
  activities [40,41]. The columns and bars indicate the mean and the standard error
  of the mean for each parameter, respectively. Different letters above the bars represent
  significant differences among three groups (p ≤ 0.05). White bars, whiteflies feeding
  on un-infected plants; white dotted bars, whiteflies feeding on ToCV-infected plants;
  white striped bars, whiteflies feeding on TYLCV&ToCV co-infected plants'
