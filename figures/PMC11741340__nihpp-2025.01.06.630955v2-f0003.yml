figure_title: Butyrolactol A perturbs sterol homeostasis without directly targeting
  ergosterol or the cell wall
caption: |-
  (A) Simplified schematic of the ergosterol biosynthesis pathway, along with antifungals targeting ergosterol or its biosynthesis. (B) Gas chromatography-mass spectrometry (GC-MS) analysis of ergosterol in amphotericin B-resistant C. albicans ATCC200955 (upper) and amphotericin B-sensitive C. albicans ATCC90028 (middle). The ergosterol standard is shown as a reference (bottom). (C) Chemical structure and GC-MS spectrum of ergosterol-TMS derivative. (D) Structural comparison of butyrolactol A and amphotericin B, highlighting structural similarities. The hydrophobic polyene region is indicated in blue, while the hydrophilic polyol structure is in pink. (E) Rescue effect of exogenous ergosterol (ERG) on cell viability during treatment with butyrolactol A (BLA), with amphotericin B (AMB) used as a positive control. Two-fold serial dilutions of ergosterol were added to C. neoformans H99 and C. albicans ATCC90028 in the presence of AMB or BLA, respectively. Biological duplicates were averaged and normalized to no-drug and no-ergosterol controls. Relative growth is quantitatively represented by color (see scale bar at the bottom right). (F) Relative ergosterol (ERG) abundance in C. neoformans H99 and C. albicans ATCC90028, treated or untreated with butyrolactol A and different agents targeting ergosterol biosynthesis: amphotericin B (AMB), terbinafine (TB), and fluconazole (FL). The median value of three biological replicates is represented by the height of each bar, with individual experimental values indicated by dots. Significance was determined by one-way ANOVA with Dunnett’s multiple comparisons test, comparing each treatment to the untreated control (* p < 0.05, ** p < 0.01, t-test). (G)
  In vitro susceptibility of C. albicans wild-type (WT) and heterozygous-deletion mutants to BLA. Dose-response assays were performed in YPD medium, with growth measured by absorbance at 600 nm after 24 hours at 30°C. Optical densities were averaged from duplicate measurements and normalized to the growth of untreated WT strains. Results are depicted as in Figure 2A (see bar for scale). (* indicates concentrations selected for plotting the growth curve). (H) Relative growth of C. albicans strains at 1.56 μM BLA (indicated by * in Figure 3G). The area under the growth curve (AUC) for strains in the presence of BLA was normalized to their AUC in the absence of BLA to eliminate baseline growth discrepancies. Data are presented as the mean of technical replicates
