figure_title: Functional proteasomes are required for Htt103QP IBophagy.
caption: Functional proteasomes are required for Htt103QP IBophagy. (A) pep4Δ VPH1-mApple
  PGALFLAG-Htt103QP-GFP cells were grown to log phase overnight at 30 °C in galactose
  media to induce Htt103QP IB formation. After treatment of yeast cells with L-proline
  and SDS for 3 h to increase permeability, proteasome inhibitor MG132 was added to
  75 μM for 30 min. DMSO was used as a control. Then, glucose was added to induce
  IBophagy. Here, we show images of Htt103QP-GFP and the vacuole (Vph1-mApple) before
  and after IBophagy induction for 2 h. Scale bar = 5 μm. (B) Quantification of IBophagy
  based on vacuolar GFP intensity. IBophagy in DMSO- or MG132-treated cells was assessed
  by measuring GFP intensity within the vacuole in 50 cells using hybrid cell count
  analysis. Statistical significance was evaluated using Sidak’s two-way ANOVA (**
  p < 0.01). (C) Quantification of IBophagy by determining the percentage of cells
  containing IBs (n > 100). Statistical significance was evaluated using Sidak’s two-way
  ANOVA (**** p < 0.0001). (D) Quantification of IBophagy by calculating the percentage
  of cells exhibiting vacuolar GFP signal (n > 100). Statistical analysis was performed
  as described above. (E) Proposed working model. Soluble mHttEx1 suppresses autophagy,
  whereas its proteasomal degradation by UPS/Cdc48 pathway relieves this inhibition
