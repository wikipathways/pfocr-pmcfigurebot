figure_title: Lomitapide treatment causes accumulation of key mevalonate pathway enzyme
  HMGCR in vivo
caption: 'Representative images from IHC analysis of U251 flank tumors stained for
  HMGCR collected from (A) control mice or mice treated with (B) TMZ, (C) Lomitapide,
  or a (D) combination of Lomitapide and TMZ. The boxes indicate the areas shown at
  higher magnification. Scale bars: 500 μm (left), 100 μm (middle), 50 μm (right).
  (E) Percentage of cells staining positive for HMGCR as determined through IHC analysis
  of U251 flank tumors (n = 16). All data are represented as individual measurements
  with mean ± SD. One-way ANOVA, followed by a post hoc Tukey’s HSD test, was used
  for multiple group comparisons. ****P < 0.0001'
