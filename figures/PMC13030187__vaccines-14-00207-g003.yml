figure_title: Schematic representation of the immunological pathways through which
  influenza vaccination may induce immune training beyond classical antigen-specific
  protection.
caption: Schematic representation of the immunological pathways through which influenza
  vaccination may induce immune training beyond classical antigen-specific protection.
  In addition to eliciting adaptive immune responses mediated by influenza-specific
  antibodies, CD4+ and CD8+ T cells, vaccination activates innate immune cells such
  as monocytes and natural killer (NK) cells. This activation can lead to their epigenetic
  reprogramming, resulting in altered transcriptional responses upon subsequent stimulation.
  Such trained immunity is characterized by enhanced antiviral interferon responses
  and improved control of inflammation. Together, these changes may contribute to
  heterologous protection against unrelated pathogens, complementing homologous protection
  against influenza virus infection. Graph created with BioRender.com
