figure_title: Wnt signaling regulates myofibroblast differentiation.
caption: Wnt signaling regulates myofibroblast differentiation. Canonical Wnt signaling
  is activated when Wnt3a binds to the LRP and Frizzled receptors, triggering an intracellular
  signaling cascade. Assembly of the destruction complex, comprising GSK-3β, CKIα,
  Axin and APC, promotes β-catenin phosphorylation and degradation; however, Wnt activation
  inhibits this process, allowing β-catenin to accumulate and translocate into the
  nucleus. Nuclear β-catenin then associates with TCF/LEF transcription factors to
  induce expression of target genes such as Wnt11. Wnt11 can be secreted by fibroblasts
  and activate non-canonical Wnt signaling by binding to Frizzled receptors and the
  LRP complex, leading to activation of the JNK/c-Jun pathway and subsequent transcription
  of Acta2. During bleomycin-induced lung injury, increased TGF-β further stimulates
  alveolar type II epithelial cells to secrete Wnt11, thereby enhancing paracrine
  activation of the non-canonical pathway. In addition, TGF-β upregulates Wnt11 transcription
  through Smad3-dependent mechanisms. Together, canonical and non-canonical Wnt signaling
  coordinate fibroblast-to-myofibroblast differentiation through distinct yet complementary
  pathways. Figure generated with BioRender. Created in BioRender. Gonzalez De Los
  Santos, F. (2025). https://BioRender.com/dvqk9o9
