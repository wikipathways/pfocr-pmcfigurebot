figure_title: HDAC regulators control SCNA expression of either monomeric or tetrameric
  alpha-synuclein (aS).
caption: HDAC regulators control SCNA expression of either monomeric or tetrameric
  alpha-synuclein (aS). Monomeric aS is prone to fibrillar confirmational change.
  Tetrameric aS is protected from confirmational change by the chaperone protein,
  Hsp70. c-abl mediated phosphorylation on non-Hsp70-chaperoned tetrameric aS drivers
  fibrillar confirmational change of tetrameric aS. Arginylation of aS inhibits fibrillar
  confirmational change. Fibrillar aS aggregates to form lewy bodies. Lysosomal degradation
  is an important mechanism of lewy body eradication. Blue = protective pathway; Red
  = pathological pathway
