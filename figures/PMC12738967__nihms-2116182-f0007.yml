figure_title: NPY-induced ES cell motility is mediated by RhoA pathway
caption: A. Representative images of a wild type SK-ES-1 cell on the edge of a wound,
  stained with anti-Y5R antibody (green) and phalloidin (red) or anti-RhoA antibody
  (green). CCM – confluent cell monolayer. B. Representative images of a DOX-treated
  SK-ES-1/Y5R-sgRNA primary tumor immunostained with anti-Y5R (purple) and anti-RhoA-GTP
  antibody (green). The red arrowheads indicate cells with high Y5R expression and
  elevated RhoA activity, the yellow arrowheads indicate cells negative for Y5R and
  RhoA-GTP. C. RhoA activity in SK-ES-1 cells cultured in serum-free media and treated
  with NPY or Y5R agonist, BWX 46, both at the concentration of 10−7M for 20 min,
  or cultured in media supplemented with 15% FBS in the presence of Y5R antagonist,
  CGP 71683, at the concentration of 10−6M for 30 min, measured by RhoA pull-down
  assay. The levels of RhoA-GTP normalized to total RhoA. * p<0.05, ** p<0.01 by paired
  t-test, n=4–5. D. Migration of TC71 cells expressing non-silencing (NS) or Y5R shRNA
  in the presence of NPY3–36 at the concentration of 10−7M, with or without ROCK inhibitor,
  Y-27632, at the concentration of 0.1μM measured by a transwell migration assay.
  * p<0.05, ** p<0.01, by One-way ANOVA followed by Tukey’s test, n=6–8
