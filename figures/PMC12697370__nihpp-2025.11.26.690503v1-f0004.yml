figure_title: UHRF1 overexpression in hepatocytes changes liver composition and hepatocytes
  function
caption: A. Scheme of the approach and representative images at 120 hpf of samples
  used for scRNAseq analysis. B. UMAP plot of cells analyzed by scRNAseq of hUHRF1
  and control livers. C. Heatmap of identity markers in hepatic cell populations pooled
  for controls and hUHRF1 samples. D. Gene Ontology of enriched genes (p-value adjusted
  < 0.05 & Log2FC > 0.5) in each cell population from the combined dataset. E. Number
  of cells in each population in hUHRF1 and control livers. F. Number of DEGs (padj
  < 0.05) in hUHRF1 compared to controls in each population. G. KEGG pathways analysis
  of DEGs (padj < 0.05 & Log2FC > 1.5) in hUHRF1 compared to controls for each population
  of hepatocytes. H. Chord diagram showing of cell-cell communication, with the width
  of each chord representing the proportion of cells with that signal and the arrows
  representing the direction of the signal. I. The top outgoing signaling molecules
  are inferred based on the strength of the signaling in each population
