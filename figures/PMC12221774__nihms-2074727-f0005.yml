figure_title: SCD1 inhibitor modulates SLC7A11 expression via AKT/GSK3β/NRF2 pathway
caption: A) Differentially regulated kinases in NTC and DKO cell after CVT-11127 treatment
  (10μM, 96 hours). B) The bar graph represents the densitometry readouts of the Phospho
  proteome (kinase) assay. C) H358 NTC and DKO cells were treated with CVT-11127 (10μM,
  96 hours). A representative western blot image is shown with indicated proteins.
  D) DKO cells were transfected with siSCD. A representative western blot image is
  shown with indicated proteins E) H358 NTC and DKO cells were treated with LY2090314
  (GSK3β Inhibitor) for 24 hours and 30nM, a representative western blot image is
  shown with indicated proteins. F) Western blot for the major signaling changes in
  H358 NTC, DKO and H2122 cells due to CVT-11127 treatment for 24, 48, 72, 96 hours.
  G) Bar graph represents the lipid peroxidation event in the cells by BODPY/C11 staining
  after H358 NTC and DKO cells were treated with LY2090314 (GSK3β inhibitor) and SCD1
  inhibitor CVT-11127. G-H) Crystal violet staining of NTC and DKO cells treated with
  either SCD1 inhibitor CVT-11127 or GSK3β inhibitor LY2090314. Bar graph represent
  the quantification. For comparisons among multiple groups, one-way analysis of variance
  (ANOVA) and between two groups, student t-test followed by the Dunnett’s post-hoc
  test were performed. The p<0.05 (*), p<0.01 (**), p<0.001 (***) were considered
  as significant (p>0.05 was considered as non-significant (ns)). Error bar represents
  the ±standard error of the mean (SEM) and the results are representation of n= either
  2 or 3 based on the experiments. Error bar represents the ±standard error of the
  mean (SEM)
