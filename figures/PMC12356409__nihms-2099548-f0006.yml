figure_title: A local domain of Torso activity produces an extended domain of ERK
  signaling
caption: '(A) NC13 embryo showing Torso::pYtag together with tll-MS2 transcriptional
  bursts at the posterior pole. Arrows indicate the boundaries at each pole of the
  Torso-ON (orange) and tll-expressing (white) regions. Scale bar: 50 μm.(B) Quantification
  of Torso::pYtag intensity and number of tll-MS2 bursts measured from the posterior
  pole. Line is mean ± SEM. n = 4 embryos.(C) Model of terminal patterning. A local
  domain of Torso activity creates a gradient of ERK activity by diffusion. In the
  region of Torso activity, ERK pathway activity feeds back on Torso activity to attenuate
  receptor activity'
article_title: A live-cell biosensor of in vivo receptor tyrosine kinase activity
