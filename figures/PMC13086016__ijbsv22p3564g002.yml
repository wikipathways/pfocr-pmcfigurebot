figure_title: Pivotal signalling nodes and pathways of mediating cellular plasticity
  and NED aggregation.
caption: Pivotal signalling nodes and pathways of mediating cellular plasticity and
  NED aggregation. a. A convergence of WNT-β-catenin signalling pathway and IL-6 signal
  transducer and activator of STAT3 pathway occurs during EMT, CSCs, and NED to sustain
  plasticity and transcriptome dynamics. Through the interaction of IL-6 with its
  receptor, IL-6R, Janus Kinases (JAKs) are activated, such as JAK1 and JAK2, which
  in turn phosphorylate STAT3 at Tyr705; as a result, activated STAT3 dimers are translocated
  to the nucleus. The transcription of genes associated with NED, CSCs, and EMT are
  mediated by STAT3 in the nucleus by interacting with γ-activated sequences (GASs)
  and interferon-stimulated response elements (ISREs). Canonical WNT signalling further
  activate STAT3; Dishevelled (DVL) associates with the Frizzled (FZD) receptor to
  sequester glycogen synthase kinase-3β (GSK3β), thereby enabling the stabilization
  of β-catenin and its translocation to the nucleus. In the nucleus, β-catenin associates
  with members of the T cell factor (TCF)-lymphoid enhancer factor (LEF) transcription
  factor family. Activation of WNT-responsive genes is mediated by β-catenin's association
  with TCF-LEF transcription factors, such as STAT3. Additionally, activated FZD can
  activate the tyrosine-protein kinase FYN during non-canonical WNT signalling; activated
  FYN recruits and phosphorylates STAT3 at Tyr705 to accelerate STAT3 translocation
  into the nucleus and transcription. b. Collected signaling pathways converge and
  single or multiple regulate the three transcriptomes to influence NED and intertwine
  with IL-6 and WNT signaling pathways
