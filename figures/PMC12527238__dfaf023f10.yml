caption: 'Morphological and Mechanistic Insights into GOMED: A Golgi-Membrane Degradation
  Pathway I. GOMED Stimulation Golgi membrane-associated degradation (GOMED) is induced
  by various cellular stresses, such as DNA damage and the inhibition of cargo transport
  within the Golgi owing to an overloaded transport pathway. Under such stressed conditions,
  GOMED degrades proteins that accumulate and stagnate in the Golgi. Chemical agents
  such as the DNA-damaging drug etoposide and 1,3-cyclohexanebis - a compound that
  interferes with coatomer binding to Golgi membranes, thereby inhibiting anterograde
  trafficking - can also induce GOMED[11,12]. Key regulatory steps involve Ulk1 phosphorylation
  dynamics; see details in refs. 23, 50, and 51. II. Golgi Transformation Upon GOMED
  induction, the Golgi undergoes morphological reorganization. In animal cells, the
  normally contiguous Golgi stacks fragment into dispersed ministacks, concomitant
  with reduced phosphatidylinositol 4-phosphate [PI(4)P] levels on Golgi membranes[12].
  III. Isolation Membrane Formation The trans-Golgi of the ministack Golgi separates
  from the stack structure, forming an isolation membrane. At this stage, dephosphorylated
  Wipi3 translocates from the cytoplasm to the Golgi[42]. The isolation membrane subsequently
  engulfs mitochondria, secretory granules, and other substrates. However, the tethering
  molecules and adaptors involved in this process remain unidentified. IV. Autophagosome
  Formation The isolation membrane encloses the substrates, forming a double-membrane
  autophagosome. This process requires Dram and Rab9[11,49]. V. Autolysosome Formation
  The double-membraned autophagosome fuses with lysosomes to form single-membraned
  autolysosomes, where the enclosed contents are degraded. Further fusion between
  autolysosomes, as well as between autolysosomes and endosomes, contribute to autolysosome
  enlargement'
