figure_title: SUV420H1 regulates the expression of specific EMT and immune-response
  genes through H4K20me3
caption: (A) GSEA analysis of significantly enriched Hallmark pathways in HN-SCC-151
  cells treated with siSUV420H1(#1)/siNC (left) or A-196/DMSO (right) for 6 days.
  (B) Genomic coordinate heatmap of decreased/lost intragenic H4K20me3 peaks (n=3,322)
  in HN-SCC-151 cells treated with A-196 vs DMSO for 6 days. FDR<0.1, log2FC>0.38.
  Concordant RNA-seq heatmap of 2,017 corresponding genes with decreased/lost intragenic
  H4K20me3 peaks and available mRNA expression data; FDR<0.1. (C) Venn diagram of
  overlapping EMT and immune-response (IFNA/G-, inflammatory-response) Hallmark pathway
  genes and the 2,017 genes with decreased/lost H4K20me3 peaks and detectable mRNA
  expression ( A-196 CUT&RUN and RNA-seq datasets). (D) Volcano plots of H4K20me3
  peaks overlapping with EMT (127 peaks) or IFNA/G- (100 peaks) and inflammatory-response
  genes (122 peaks) (promoter and gene body regions only). FDR<0.1, LFC>0.38. (E)
  RNA-seq heatmaps of EMT, IFNA/G-response and inflammatory-response genes with decreased/lost
  H4K20me3 peaks and differential mRNA expression changes (FDR<0.1). (F) Top 10 putative
  EMT and immune-response gene targets with the “deepest” mRNA expression changes
  regulated by SUV420H1-mediated H4K20me3. (G) UCSC tracks for H4K20me3 obtained with
  CUT&RUN for H4K20me3 in HN-SCC-151 cells treated with DMSO or A-196 for 6 days.
  Representative EMT and immune-response genes with decreased/lost H4K20me3 after
  treatment with A-196 are shown
