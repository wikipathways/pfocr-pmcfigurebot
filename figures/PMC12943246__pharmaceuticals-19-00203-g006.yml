figure_title: Bioinformatics analysis of GDL treatment mechanisms.
caption: Bioinformatics analysis of GDL treatment mechanisms. (A) Molecular docking
  results of Coptisine and PDGFRβ. (B) Molecular docking results of Berberine and
  PDGFRβ. (C) Molecular docking results of Catechin and PDGFRβ. (D) Molecular docking
  results of Tanshinone IIA and PDGFRβ. (E) Molecular docking results of Chrysophanic
  acid and PDGFRβ. (F) Molecular docking results of Emodin-3-methyl ether and PDGFRβ.
  (G) Molecular docking results of Emodin and PDGFRβ. (H) Molecular docking results
  of Aloe-emodin PDGFRβ. (I) RMSD curves of the complexes. (J) RMSD curves of the
  small molecules. (K) Rg curves of the complexes. (L) SASA curves of the complexes.
  (M) RMSF curves of the PDGFRβ protein. (N) H-Bonds number curves of the complexes.
  GDL had a good binding ability with PDGFRβ, and GDL may exert its effects through
  the PDGFRβ signaling pathway
