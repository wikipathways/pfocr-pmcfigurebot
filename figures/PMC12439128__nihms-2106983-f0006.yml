figure_title: Analysis of the DEGs in the excitatory neurons 2 (EN2) and inhibitory
  neuron clusters in PTHS brains
caption: (A and D) Volcano plots illustrating the differential gene expression observed
  between Cre+ and Cre− mice in the EN2 (left) and inhibitory neuron (right) clusters
  are shown. Dots represent differentially expressed genes. The upregulated gene cutoff
  was log2fold change > 0.5 and Bonferroni adjusted p-value (p adj) < 0.05, and the
  downregulated gene cutoff was log2fold change < −0.5 and p adj < 0.05. (B and E)
  Network/pathway analysis of the DEGs identified comparing Cre+ to Cre− in EN2 (B)
  and inhibitory neuron (E) clusters. (C and F) Box plots showing the most differentially
  regulated genes identified in the EN2 (C) and inhibitory neuron (F) populations.
  Blue boxes represent Cre− cells, and orange boxes represent Cre+ cells. Statistical
  analysis was done using R-suit. ****p< 0.0001. Enlarged Figure 6A, B, and D are
  shown in Supplemental Figure 10
