figure_title: 'Figure 6. CYB5R3 serves as a redox gatekeeper linking Ca2+ influx,
  phosphatase activity, and NO signaling in the endothelium. Left:'
caption: 'Under normal conditions, CYB5R3 maintains endothelial redox balance by preserving
  the catalytic activity of the tyrosine phosphatase PTPN1. Active PTPN1 suppresses
  TRPV2 activity and limits Ca2+ entry through both store-operated (SOCE) and TRPV2-mediated
  pathways, thereby preserving normal nitric oxide (NO) signaling and vascular tone.
  Right: In CYB5R3-deficient endothelial cells, increased NO-derived oxidants (e.g.,
  S-nitrosothiols, peroxynitrite) inactivate PTPN1, resulting in uncontrolled TRPV2
  phosphorylation and increased Ca2+ influx. This redox-dependent dysregulation enhances
  endothelial Ca2+ and NO signaling, resulting in vasodilation and improved exercise
  performance in vivo. The schematic illustrates the proposed CYB5R3–PTPN1–TRPV2 axis
  as a redox-sensitive regulator of Ca2+ homeostasis and vascular function, with its
  imbalance potentially contributing to endothelial dysfunction during aging or in
  cardiovascular disease'
article_title: Endothelial CYB5R3 couples store-operated calcium entry to TRPV2 activation
  and vascular fitness
