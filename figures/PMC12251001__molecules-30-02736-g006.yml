figure_title: Glucagon has an intricate role in pNET cell survival and tumour progression.
caption: Glucagon has an intricate role in pNET cell survival and tumour progression.
  (A) Noteworthy is glucagon’s capacity to interact with both the GCGR and GLP-1R,
  introducing complexities to its role in cancer biology and potentially subverting
  disease-favouring mechanisms. Our findings confirm heightened GCGR expression in
  pNET cell lines (BON-1 and QGP-1) under glucose deprivation, especially in hyperglucagonemic
  conditions. Additionally, we observe significant GCGR expression in non-malignant
  pancreatic α-TC1 cells under normal physiological glucagon concentrations. This
  study uncovers the influence of glucagon on the MAPK pathway, evidenced by increased
  pERK1/2 levels in BON-1 and QGP-1 cells under glucagon stimulation during glucose
  deprivation. Examining the impact of glucagon on cell features, certain malignant
  cells, such as BON-1, which does not produce glucose, exhibit increased metabolic
  viability and proliferation in glucose-deprived conditions under hyperglucagonemia-compatible
  concentrations. (B) Metabolic remodelling, explored via NMR spectroscopy, reveals
  increased levels of arginine, glutamine, lactate, alanine, pyroglutamate, and serine
  in pNET cell lines under high-glucose conditions. In glucose scarcity, alanine and
  glutamine decrease, potentially diverting to gluconeogenesis, while pyruvate increases.
  BON-1 cells do not produce glucose, but interestingly, QGP-1 cells and α-TC1 cells
  do, further enhanced by glucagon in α-TC1 cells. (C) Genetic mechanisms and metabolic
  shifts in pNETs are comprehensively explored, highlighting increased SGLT1/SLC5A1
  and GLUT1/SLC2A1 expression in response to glucagon under glucose deprivation. Investigating
  gluconeogenesis, the findings highlight its significance in pNET cells, especially
  concerning the influence of glucagon, under which PEPCK expression is increased.
  Cysteine and oxidative stress-related metabolism reveal downregulation of xCT/SLC7A11
  and MPST expression in both BON-1 and QGP-1 cells under glucagon’s influence, independent
  of glucose conditions. (D) Investigating GCGR expression in pNETs uncovers potential
  therapeutic insights, with an observed inverse association between GCGR intensity
  staining and tumour grade. Despite grade 3 tumour variability, GCGR positivity in
  pNETs implies a biological role. Reduced GLP-1R expression in pNETs, in contrast
  to normal tissue, indicates modified glucagon functioning patterns that favour GCGR.
  Among the 60 cases, 91.7% (55/60) were GCGR-positive, while 30% (18/60) were GLP-1R-positive.
  This comprehensive investigation deepens our comprehension of the multifaceted role
  of glucagon in pNETs, providing insights for potential targeted therapeutic interventions
article_title: 'Glucagon and Glucose Availability Influence Metabolic Heterogeneity
  and Malignancy in Pancreatic Neuroendocrine Tumour (pNET) Cells: Novel Routes for
  Therapeutic Targeting'
