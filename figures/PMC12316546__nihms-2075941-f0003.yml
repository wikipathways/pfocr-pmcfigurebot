figure_title: RNA sequencing of colorectal organotypic model
caption: (a) Heatmap of gene expression of CRC1 tumor organoids with or without CAFs
  in the RNA-seq dataset. Every row of the heatmap represents a gene, every column
  represents a sample, and every cell displays normalized gene expression values.
  (b) Heatmap of cell cycle, signaling pathways, stemness, growth factors, hypoxia,
  and tissue modeling genes in log2-fold change normalized to control CRC1 organoids
  (no CAFs). (c) Pathway Enrichment Analysis shows different pathways for organotypic
  cultures contrasted against control CRC1 organoids (no CAFs) using Enrichr. All
  results are significant (FDR< 0.01). The size of circle denotes relative fold change
  in organoids with CAFs. (d) Kinase enrichment analysis shows upregulated kinases
  whose experimentally validated proteins are enriched in CRC1 tumor organoids due
  to interactions with CAFs. X-axis denotes number of upregulated substrates which
  are ranked according to the colors
article_title: Targeting CAFs-Mediated Stromal Signaling in a Patient-Derived Organotypic
