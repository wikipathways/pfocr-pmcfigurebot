figure_title: Age-related decrease in Elovl2 expression in mice
caption: '(A) Illustration of VLC-PUFA elongation pathways. VLC-PUFAs are produced
  from essential fatty acid elongation by enzymes including ELOVL2, ELOVL4, and ELOVL5.
  (B) Left: Example of Sanger sequencing chromatogram. Right: Quantification of DNA
  methylation. Bottom: Locus organization and localization of CpGs relative to the
  transcription (Txn) start site of Elovl2. (C) Representative RNA in situ hybridization
  images of mouse retinal cross sections from 5-month-old (top panels) and 26-month-old
  (bottom panels) animals stained with RNAscope probes designed for Elovl2 (purple),
  Elovl4 (green), and Elovl5 (red), counterstained with Hoechst (blue). Scale bar,
  25 μm. ONL, outer nuclear layer; INL, inner nuclear layer. (D) Uniform manifold
  approximation and projection (UMAP) visualization of snRNA-sequenced retinal tissue
  from 3-month-old (left) and 18-month-old (right) mice. The different retinal cell
  types are color coded. The scaled expression of Elovl2 in cone photoreceptors is
  shown in the bottom graphs. (E) GSEA of pathways enriched in cones from 3- and 18-month-old
  mice. (F) Interaction strength, representing ligand-receptor–mediated intercellular
  communication probability quantified by the law of mass action, was calculated using
  CellChat and visualized across young (left) and old (right) retinas. Each plot represents
  interactions among cones, rods, and Müller glial cells. The thickness of the lines
  between the cells indicates the interaction strength, with thicker lines representing
  stronger interactions. Data are presented as mean ± SEM, and unpaired t tests (B)
  were used to evaluate statistical significance. *P < 0.05, **P < 0.01, ***P < 0.001,
  and ****P < 0.0001'
