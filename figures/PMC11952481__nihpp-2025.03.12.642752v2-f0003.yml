figure_title: A combined multi-omics approach identifies SCoR2-regulated SNO-proteins
  and metabolic pathways responsible for widespread metabolic reprogramming
caption: '(A) S-nitrosylated proteins in heart of SCoR2+/+ (+/+) and SCoR2−/− (−/−)
  mice post-I/R vs sham. Representative Coomassie-stained SDS/PAGE gel displaying
  SNO-proteins isolated by SNORAC using hearts of +/+ and −/− mice subjected to either
  sham operation or I/R (4hr reperfusion). Ascorbate was omitted from the SNORAC assay
  (-Asc) as a specificity control. (B): Three coordinated screens in +/+ vs. −/− mouse
  heart tissue, i.e. (1) SNORAC/MS (SCoR2-dependent S-nitrosoproteome 4 h after I/R,
  elevated >1.2-fold in −/− vs +/+) (Table S1; N=3), (2) SCoR2 co-IP interactome (Table
  S1; N=4), and (3) untargeted metabolomic screening in heart and plasma (Table S2;
  N=5 per condition), converge on the proteins BDH1 and PKM2 as SCoR2 substrate SNO-proteins
  in the heart which alter relevant cardioprotective metabolic pathways. (C) Full
  list of 31 overlapping proteins identified in both screens (1) and (2) i.e., the
  cardiac SCoR2-dependent S-nitrosoproteome and the cardiac SCoR2 interactome. Image
  created with Biorender.com'
