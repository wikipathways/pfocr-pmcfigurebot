figure_title: Metabolic pathway for biosynthesis of retinal in R.
caption: 'Metabolic pathway for biosynthesis of retinal in R. toruloides. These genes
  are organized into three functional modules: (i) the MVA module, comprising ERG10,
  ERG13, HMG1, and IDI1 for enhanced precursor supply; (ii) the carotenoid module,
  including BTS1, CARRP, and CARB for β-carotene synthesis; and (iii) the retinal
  module, consisting of the BCO for the oxidative cleavage of β-carotene into retinal.
  G6P, glucose-6-phosphate; F6P, fructose-6-phosphate; DAHP, 3-deoxy-arabino-heptulonate-7-phosphate;
  LPA, lysophosphatidic acid; PA, phosphatidic acid; DAG, diacylglycerol; TAG, triacylglycerol;
  FFA, free fatty acid; ERG10, acetoacetyl-CoA thiolase; ERG13, hydroxymethylglutaryl-CoA
  synthase; HMG1, hydroxymethylglutaryl-CoA reductase; IDI1, isoprene diphosphate
  isomerase; ERG20, bifunctional FPP synthase; BTS1, geranylgeranyl diphosphate synthase;
  BCO, β-carotene 15,15′-dioxygenase; CARRP, bifunctional lycopene cyclase/phytoene
  synthase; CARB, phytoene dehydrogenase; TGL, triacylglycerol lipase; HMG-CoA, hydroxymethylglutaryl-CoA;
  IPP, isopentenyl pyrophosphate; DMAPP, dimethylallyl diphosphate; GPP, geranyl pyrophosphate;
  FPP, farnesyl pyrophosphate; GGPP, geranylgeranyl pyrophosphate. Dashed arrows represent
  multi-step pathways; red X indicates the targeted deletion of the corresponding
  gene'
