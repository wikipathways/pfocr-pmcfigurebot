figure_title: PPARγ is involved in the inhibitory effect of Art on the TGF-β/Smad
  signaling pathway.
caption: PPARγ is involved in the inhibitory effect of Art on the TGF-β/Smad signaling
  pathway. (a) Silencing PPARγ by siRNA promoted Smad2/3 phosphorylation and fibrosis
  genes in HK-2 cells stimulated with HG (30 mM, 48 h). Art treatment decreased the
  Smad2/3 phosphorylation and fibrosis downstream genes under HG stimulation in HK-2
  cells. (b–g) Data are expressed as means ± SEM of three independent experiments.
  ⁣∗p < 0.05 and ⁣∗∗p < 0.001 vs. Control. ⁣#p < 0.05 and ⁣##p < 0.001 vs. HG. ⁣▲▲p
  < 0.001 HG/Art vs. HG/siRNA PPAR-γ/Art. GAPDH, glyceraldehyde-3-phosphate dehydrogenase
article_title: Artemether Attenuates High Glucose-Induced Inflammation and Fibrogenesis
  in Renal Tubular Epithelial Cells by Modulating the TGF-β/Smad Pathway Via PPARγ
  Activation
