caption: Diagrams revealing protein–protein interaction networks of differentially
  expressed proteins in E. cuniculi-infected rabbits. (A) The protein–protein interactions
  of serum proteins only identified in subclinical and clinical E. cuniculi rabbit
  groups. (B) The protein–protein interactions of serum proteins only identified in
  clinical rabbit groups. (C) The protein–protein interactions of serum proteins only
  identified in subclinical rabbit groups. Node colors represent pathway or functional
  enrichment categories as assigned by STRING. Proteins outlined in red circles indicate
  key pathway-associated proteins within the interaction network
