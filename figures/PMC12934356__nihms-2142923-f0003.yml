figure_title: Transcriptomic comparison across non-schooling models
caption: (A) Venn diagrams representing the overlap of genes shared among disc1-,
  shank2b-, and syn1-crispants and isolated D. cerebrum.(B) A diagram illustrating
  the connections between the 45 converging differentially expressed genes (DEGs).
  Underlined gene names indicate genes excluded after further analysis of DEGs overlapping
  in two-week-old fish and socially isolated six-week-old fish (relative to six-week-old
  controls), as well as from the set of overlapping DEGs across all three crispants
  compared to Cas9-only controls. Solid lines represent protein interactions based
  on the STRING database. The colored background highlights gene groups associated
  with thyroid (blue), circadian rhythm (red), synaptic structure and function (yellow),
  and nervous system development (purple). Green circles indicate genes with increased
  expression in schooling-deficient fish, whereas red circles show reduced expression.
  Gray outlines indicate transcription factors. Dashed lines represent a pathway of
  interest, which we further examine in Figure 4
