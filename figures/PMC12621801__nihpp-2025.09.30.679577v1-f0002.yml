caption: Top 30 Canonical Pathways enriched in astrocyte DT genes altered by EtOH
  drinking. DT genes were used for IPA assessment of canonical pathway enrichment
  and expression level was used to determine the activation z-score, inferring whether
  a pathway is up or down regulated by ethanol. A. Top enriched canonical pathways
  in DT genes in analysis of the PFC. B. Top enriched canonical pathways in DT genes
  in the PFC of females only. C. Top enriched canonical pathways in DT genes in the
  PFC of males only. D. Top enriched canonical pathways in DT genes in analysis of
  the NAc. E. Top enriched canonical pathways in DT genes in the NAc of females only.
  F. Top enriched canonical pathways in DT genes in the NAc of males only. Pathways
  related to the ECM are highlighted
