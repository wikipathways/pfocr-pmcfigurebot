figure_title: Functional enrichment analysis of genes associated with immune checkpoint
  regulation. This figure presents dot plot visualizations of gene ontology (GO) enrichment
  analyses for biological processes (left panel) and molecular functions (right panel),
  derived from genes linked to immune checkpoint modulation. In both panels, the y-axis
  represents the enriched GO terms, while the x-axis denotes the gene ratio. The size
  of each dot corresponds to the number of genes involved in the respective pathway,
  and the color gradient indicates the false discovery rate (FDR), with darker blue
  hues representing higher statistical significance. In the left panel (Biological
  Process), enriched pathways include immune system regulation, antigen processing
  and presentation, and T cell activation, with gene sets showing FDR values as low
  as 1.5e-05. In the right panel (Molecular Function), significant enrichment was
  observed in receptor binding, cytokine activity, and transcription factor interaction
  terms, with FDR values reaching below 5.0e-11. These results indicate a strong functional
  association between the identified gene sets and immune modulatory processes relevant
  to checkpoint signaling
