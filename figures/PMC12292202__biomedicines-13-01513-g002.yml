figure_title: Regulators of the amyloidogenic pathway in APP processing.
caption: Regulators of the amyloidogenic pathway in APP processing. APP is located
  within the lipid raft in the plasma membrane, proving that lipid rafts are a common
  environment for APP processing by BACE. Its activity is regulated by several factors.
  Decreased levels of furin, often accompanied by iron overload, stimulate the amyloidogenic
  pathway of APP processing by increasing the activity of BACE. Also, factors such
  as increased α-synuclein or HIF-1α expression due to hypoxia cause upregulation
  of BACE. Alcadeins act more indirectly, as these proteins exert neuroprotective
  functions by preventing cleavage by BACE, thus causing a shift from the amyloidogenic
  to non-amyloidogenic pathway. PrP, by binding with APP within lipid rafts, enhances
  the activity of BACE, thus promoting the amyloidogenic pathway
article_title: The Potential Regulators of Amyloidogenic Pathway of APP Processing
  in Alzheimer’s Disease
