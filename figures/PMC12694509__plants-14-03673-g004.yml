figure_title: Knockout of OsNAC113 induces genome-wide changes in plants.
caption: 'Knockout of OsNAC113 induces genome-wide changes in plants. (a) WT and osnac113
  genome-wide expression analysis (drought−/+). (b) KEGG analysis targeting DEG shared
  by WT vs. osnac113 (T/T) vs. osnac113 (−1/−1): drought and WT vs. osnac113 (T/T)
  vs. osnac113 (−1/−1): drought. (c) Gene ontology (GO) classification of DEG shared
  by WT vs. osnac113 (T/T) vs. osnac113 (−1/−1): drought and WT vs. osnac113 (T/T)
  vs. osnac113 (−1/−1): drought+. (d) Classification of the signaling pathways of
  DEG. (e) Screen and measure the expression levels of 10 significantly differentially
  expressed genes. The relative expression level of OsNAC113 was measured by RT-qPCR
  at the indicated times. Error bars indicate SE based on three independent biological
  replicates. * and *** represent significant differences at p < 0.05 and p < 0.001
  compared to WT'
