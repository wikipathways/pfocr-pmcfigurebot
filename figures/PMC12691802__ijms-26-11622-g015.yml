caption: Simplified diagram of the Hh pathway. Hedgehog ligands binding relieves inhibition,
  enabling Smo activation and subsequent regulation of Gli transcription factors.
  Activated Gli proteins translocate to the nucleus and induce target gene expression
  controlling cell proliferation, differentiation, and survival. The arrow and line
  indicate a stimulating effect. The crossed line ending with perpendicular bar indicates
  the unblocking of inhibition
