figure_title: Illustration of the molecular regulation of osteoblastogenesis and osteoclastogenesis,
  highlighting transcription factors, signaling pathways and miRNAs.
caption: Illustration of the molecular regulation of osteoblastogenesis and osteoclastogenesis,
  highlighting transcription factors, signaling pathways and miRNAs. MSCs differentiate
  into osteoblasts through a cascade of molecular events regulated by key transcription
  factors such as RUNX2, OSX/SP7, β-catenin and ATF4, activated through signaling
  pathways including BMP/SMAD, FGF, NOTCH, TGF-β, HH, IGF-1/IGF-1 receptor (IGF-1R)
  and WNT/β-catenin. In parallel, hematopoietic stem cells (HSCs) give rise to osteoclasts,
  guided by transcription factors such as NFATc1, c-Fos, microphthalmia-associated
  transcription factor (MITF) and purine-rich box-1 (PU.1), under the influence of
  the NF-κB, MAPK, calcium, PI3K/Akt, RANKL-RANK, and M-CSF/CSF1R signaling pathways.
  miRNAs regulate these differentiation pathways in different ways. For instance,
  miR-124, miR-103a, miR-33-5p, and miR-199b-5p regulate osteoblastogenesis, while
  miR-21, miR-29, and miR-3 influence osteoclastogenesis. Additionally, multiple miRNAs,
  including miR-182 and miR-214, miR-34a-5p, miR-17/20a, and miR-324, which operate
  as dual regulators, target both osteoblast and osteoclast differentiation pathways
