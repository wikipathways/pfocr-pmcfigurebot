figure_title: Flt3L enhances CD40 agonist-driven cDC activation in PDAC
caption: (A-B, D-G) scRNAseq of tumor sorted CD45+ leukocytes from KPPC mice treated
  with vehicle, single-agent, or combined Flt3L+αCD40 (2–3 pooled mice/library, 2–5
  libraries/condition). (A) UMAP of APC subsets. (B) Proportional overlap of DEGs
  (P.adj < 0.05) in APC subsets compared to vehicle (C) CD40 expression in APC subsets
  from KPPC mice treated with Flt3L+αCD40 (flow cytometry, n=8/group). (D-F) GSEA
  pathways enriched in APC clusters (P.adj < 0.05) from “H”=Hallmark, “K”=KEGG, “R”=Reactome,
  “B”=Biocarta, “P”=PID and GO Databases. (D) Selected gene sets enriched by single-agent
  or Flt3L+αCD40 vs. vehicle. (E-F) Selected gene sets enriched by Flt3L+αCD40 vs.
  αCD40 in (E) cDC1 and (F) MigDC. (G) Selected DEGs (P.adj < 0.05) in MigDC (Flt3L+αCD40
  vs. vehicle). (H) Naïve cDC1 and MigDC1 tumor frequencies in KPPC mice treated with
  vehicle or Flt3L+/−αCD40 (flow cytometry, n=7–10/group). (I) Representative 4X and
  20X mpIHC images of CCR7+(orange)/Clec9a+(green) MigDC1 in KPPC GEMMs after Flt3L+/−αCD40.
  (J-L) Flow cytometry analysis of cDC subsets in tumor-draining lymph nodes (LN)
  from female KP2OVA bearing C57BL/6 mice treated with vehicle or Flt3L+αCD40. (J)
  % H2Kb-SIINFEKL expression in naïve/migratory cDC1/2 (n=6/group). (K-L) (K) H2Kb-SIINFEKL+
  MigDC1 frequency and (L) MigDC1 protein expression (n=6/group). (M) Cross-presentation
  assay with quantification of total naïve OTI Proliferation (Cell Trace Violet Dilution)
  after co-culture with migratory/naïve cDC1/2 from tumor-draining LN of female KPOG
  bearing C57BL/6 mice treated with vehicle or Flt3L+αCD40 (flow cytometry, n=3 replicates/condition).
  (N) Ex-vivo cDC stimulation assay quantifying IL-12p40 production in CpG activated
  cDC subsets from tumor-draining LN of KPPC mice treated with vehicle (left graph),
  αCD40+/−Flt3L (flow cytometry, n=4–6/group). All bar graphs depict mean +/− SEM.
  *P < 0.05, **P < 0.01, ***P < 0.001, ****P < 0.0001 by one or two-way ANOVA with
  Holm-Sidak multiple comparisons test (C, H, J, M, N), and unpaired Student’s t test
  (K-L). ns, not significant
