figure_title: Mechanism of TfR-mediated transcytosis of BsAbs across the blood-brain
  barrier.
caption: Mechanism of TfR-mediated transcytosis of BsAbs across the blood-brain barrier.
  This illustration reveals the delivery pathway by which a bispecific antibody traverses
  the blood-brain barrier via transferrin receptor (TfR)-mediated transcytosis. Utilizing
  its α-TfR scFv domain, the antibody specifically binds to cerebrovascular endothelial
  cells, is internalized into early endosomes, and undergoes intracellular trafficking
  to complete transcellular transport. Ultimately, it releases its therapeutic domain
  into the brain parenchyma to precisely target the lesion, offering a targeted therapeutic
  strategy for CNS disorders
