figure_title: RNA-Seq analysis of UAS03-treated endothelial cells
caption: 'SVEC4-10 cells were treated with control or 50 μM UAS03, total RNA was isolated,
  and RNA-Seq was performed as described in Methods. (A) Heat map of differentially
  expressed genes generated using the heatmap.2 function in the gplots package. Genes
  with q value of less than 0.05 and fold change (FC) greater than1.5 or less than
  –1.5 were clustered using the hclust function using Pearson’s method for genes and
  Spearman’s method for samples. (B) Volcano plot of differentially expressed genes
  created using ggplot. Downregulated genes are represented as blue dots (q < 0.05,
  FC < –1.5) and light blue dots (q < 0.05, FC < 0, FC > –1.5). Upregulated genes
  are represented as red dots (q < 0.05, FC > 1.5) and gold dots (q < 0.05, FC > 0,
  FC < –1.5). The following genes are highlighted: top 3 significant differentially
  expressed genes, top 3 upregulated and downregulated genes with maximum fold change,
  and genes of interest based on the in vivo observations with UAS03 treatment. GO
  term enrichment analysis from the list of significantly upregulated (C) and downregulated
  (D) genes using gProfiler2. Terms of interest from “molecular function” and “biological
  pathway” categories are depicted based on the in vivo observations with UAS03 treatment.
  n = 3 biological replicates'
