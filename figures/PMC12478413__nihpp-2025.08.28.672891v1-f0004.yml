figure_title: GBA1-p.E326K causes a mild accumulation of GCase substrates in the lysosome
  and greater perturbations to glycosphingolipid and BMP homeostasis
caption: A Heatmaps depicting log2 fold changes (from WT mean) in the abundance of
  all detected GCase substrates from whole-cell and Lyso-IP fractions taken from WT,
  GBA1-p.E326K KI, GBA1-p.L444P KI, and GBA1 KO HEK293T cells. B The fold change (over
  WT mean) of glucosylsphingosine (GlcSph) levels in Lyso-IP samples from HEK293T
  cells of the indicated genotype. C Schematic depicting the major lipids and key
  enzymes/protein co-factors in the lysosomal glycosphingolipid degradation pathway
  proximal to GCase. D Heatmaps showing the log2 fold change (from WT mean) of glycosphingolipids
  (from pathway shown in c) in both whole-cell and Lyso-IP fractions taken from HEK293T
  cells of indicated genotype. Only lipids with a fold change of E326K vs WT that
  reached nominal significance (p < 0.1) in either the whole-cell or Lyso-IP fractions
  are included. E Fold change (over WT mean) of BMP(22:6/22:6) levels in Lyso-IP samples
  from HEK293T cells of the indicated genotype. F Fold change (over WT mean) of glucosylsphingosine
  levels in whole cell samples from HEK293T cells of the indicated genotype, treated
  with imiglucerase as indicated. G & H Fold change (over WT mean) of BMP(22:6/22:6)
  (G) or GB3(d18:1/18:0) (H) levels in whole cell samples from HEK293T cells of the
  indicated genotype, treated with imiglucerase as indicated. All bar graphs show
  mean ± SEM with individual points representative of data from a single experimental
  replicate. Data in A-B, and D-E are from n = 4 independent replicates. Data in F-H
  are from n = 5 independent replicates. For A and D, statistical tests were performed
  on genotype-level comparisons using robust linear model as described in methods
  and significance threshold was set at FDR adjusted P value < 0.05. All other statistical
  tests were performed on genotype-level comparisons using one-way ANOVA with Dunnett’s
  multiple comparison test (B and E), or Tukey’s multiple comparisons test (F-H),
  where * = p < 0.0332, *** = p < 0.0002, **** = p < 0.0001
