figure_title: Distinct metabolic profiles of M1 TAMs and M2 TAMs.
caption: Distinct metabolic profiles of M1 TAMs and M2 TAMs. M1 TAMs are featured
  by glycolysis, in which G6P is rerouted to PPP to produce NADPH. Then, ROS is generated
  by NOXs to eliminate pathogens and tumor cells. In M1 macrophage polarization, IDH
  is downregulated, while IRG1 is upregulated, leading to the production of ITA. ITA
  inhibits SDH, resulting in the accumulation of succinate to stabilize HIF-1α, which
  supports the inflammatory response. Meanwhile, L-arginine is increased in M1 TAMs
  due to interruption of TCA cycle, inducing the synthesis of NO. M2 TAMs are featured
  by a complete TCA cycle and OXPHOS, fueled by β-oxidation of fatty acids and glutaminolysis.
  In M2 macrophage polarization, fatty acids can be taken up by CD36 and FATP1, and
  then lysed by LAL, providing carbon source for FAO to drive TCA cycle and support
  OXPHOS. Meanwhile, IL-4 increases the uptake of glutamine in macrophages via glutamine
  transporters. GS and GLUL are upregulated to supply intracellular glutamine for
  M2 macrophage polarization. Then, glutamine is hydrolysed by glutaminase 1 to produce
  glutamate, which is transformed into α-KG by GLUD1, in order to fuel TCA cycle and
  increase FAO and OXPHOS. M2 macrophages can also promote α-KG accumulation via suppressing
  α-KG dehydrogenase. L-arginine can be converted by Arg-1 into L-ornithine in M2
  macrophages. Then, polyamines and L-proline are generated from L-arginine to facilitate
  tumorigenesis. Tryptophan can be catalyzed by IDO into kynurenine, contributing
  to immune suppression in M2 macrophages. In response to inflammatory stimuli, glycolytic
  product ITA is upregulated to potentiate tumor growth by increasing OXPHOS and OXPHOS-driven
  ROS production. However, glycolysis inhibitor 2-DG can decrease M2 TAM polarization
  via an AMPK-HIF-1ɑ-dependent pathway. G6P, Glucose-6-phosphate
