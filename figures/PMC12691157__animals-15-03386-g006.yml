caption: 'Relationships among microbial function, VFA and the blood amino acid profile.
  (a) Mantel test among microbial function, VFA and the blood amino acid profile matrix.
  Microbial function analysis was performed via PICRUSt2-KEGG Level 2. VFA and blood
  amino acid profile comparisons via Pearson’s correlation analysis. The solid lines
  represent positive correlations, the dotted lines represent negative correlations,
  and the thickness of the lines represents the size of the correlation coefficient.
  The color of the line represents the size of the Mantel’s p value. (b) PICRUSt2-KEGG
  pathway Level 3 (p < 0.05). Significance levels are as follows: * p < 0.05; ** p
  < 0.01; *** p < 0.001'
