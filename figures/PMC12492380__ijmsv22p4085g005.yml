figure_title: Knowdown of CHAF1B inhibits the PI3K/Akt/HIF-1α signal pathway.
caption: 'Knowdown of CHAF1B inhibits the PI3K/Akt/HIF-1α signal pathway. (A) Venn
  diagram showing the intersection of differentially expressed genes (DEGs) in HepG2
  cells (OE-CHAF1B/OE-NC, shCHAF1B/sh-NC). (B) KEGG enrichment analysis of DEGs indicates
  CHAF1B correlates with PI3K/Akt/HIF-1α signal pathway. (C) Pearson correlation analysis
  of the correlation between CHAF1B expression and relative genes in HCC patients
  from the TCGA database. (D) Survival analysis of three subgroups (CHAF1B high/HIF-1α
  high, CHAF1B high/HIF-1α low or CHAF1B low/HIF-1α high, CHAF1B low/HIF-1α low) from
  the TCGA database. (E) Western blot analysis of markers of PI3K/Akt/HIF-1α signal
  pathway in Huh7 cells with knockdown of CHAF1B and HepG2 cells with overexpressing
  CHAF1B. (F) Expression of PI3K/Akt in Huh7 xenograft tumors was detected by western
  blot. (G) H&E and IHC staining of CHAF1B, HIF-1α and Cleaved-Caspased3 were conducted
  in serial sections of tumors from each groups. Scale bars: 200 µm. Data represents
  the mean ± SD of the IHC score of five independent animals for each group. **P <
  0.01, ***P < 0.001, ****P < 0.0001'
