figure_title: SCD1 and SCD5 silencing induce distinct lipidomic alterations in GSCs
caption: '(A) Isotope tracing analysis (13C incorporation) of FA synthesis pathways
  in GSCs following SCD1 or SCD5 knockdown (48–72 h). Dot plot displays log₂ fold
  changes in FA levels versus controls (filled dots: p < 0.05, Student’s t-test, n=4).(B)
  Volcano plot of lipid species alterations in SCD5-overexpressing GSCs versus controls
  (x-axis: log₂ fold change; y-axis: -log10 p-value).(C) PCA of global lipid profiles
  following SCD1 or SCD5 knockdown.(D-E) Venn diagrams showing shared (D) downregulated
  and (E) upregulated lipid species between SCD1- and SCD5-deficient GSCs.(F) Differential
  abundance of lipid classes after 4-day SCD1/SCD5 silencing relative to SCR control
  (*p < 0.05, **p < 0.01, ***p < 0.001, Student’s t-test, n=4).(G) LION enrichment
  analysis of top 10 significantly altered biological terms'
