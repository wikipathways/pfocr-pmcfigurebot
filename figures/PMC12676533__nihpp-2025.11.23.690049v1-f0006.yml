figure_title: Q901 synergies with TOP1i-ADCs
caption: '(A) A model illustrating how Q901 enhances the activity of TOP1i and TOP1i-ADCs.
  (Left) Q901 promotes CDK7 accumulation at the TSS while reducing RNAPII binding.
  This also decreases MYC and E2F1 binding at the TSS, leading to downregulation of
  genes involved in the DNA damage response pathway. (Middle) The dual inhibition
  of CDK7 (by Q901) and TOP1 (by TOP1i) blocks the repair of TOP1i-induced DNA damage,
  ultimately leading to cell death. (Right) The combination of Q901 and a TOP1i-ADC
  shows potent enhanced anticancer activity, effectively inducing cancer cell death
  in vitro and significantly reducing tumor growth in vivo. (B and C) HCT116, HER2
  ultra low/negative human colon cancer cell line, was treated with Q901, T-DXd (10
  μg/ml), or their combination at the indicated concentrations for 72 h (B). Dose-response
  curves were plotted as a function of log-transformed concentration relative to IC
  values. Cell viability was measured using the ATP Lite™ system (n = 2, data represent
  mean ± SD). (C) For in vivo efficacy study, HCT116 cells mixed with Matrigel (1:1)
  were subcutaneously implanted into BALB/c nude mice. When tumors reached an average
  size of 117 mm3, mice were randomized into groups (n = 8 per group) and treated
  with Q901 (10 mg/kg, intraperitoneally once daily), T-DXd alone (10 mg/kg, intravenous
  single injection on day 0) or the combination. (D and F) H292, TROP2 positive human
  lung cancer cell line, was treated with Q901 in combination with SG at the indicated
  concentrations for 72 h (D). Dose-response curves were generated using log-transformed
  concentrations normalized to IC values. Cell viability was assessed using the ATP
  Lite™ system (n = 2, data represent mean ± SD). (E and F) For in vivo efficacy study,
  H292 cells were mixed with Matrigel (1:1) and implanted subcutaneously into BALB/c
  nude mice. When tumors reached an average size of 140 mm3, mice were randomized
  into groups (n = 8 per group) and treated with Q901 (10 or 3 mg/kg, intraperitoneally
  once daily), SG alone (3 or 10 mg/kg, intravenous single injection on day 1 and
  8) or the combination of both. The graph shows the mean tumor volume ± SEM. Statistical
  significance was calculated using GraphPad Prism software (*: p < 0.01, ****: p
  < 0.0001 by two-way ANOVA followed by Tukey’s multiple comparison test)'
article_title: Sensitizing tumor response to topoisomerase I antibody drug conjugate
  by selective CDK7 inhibition
