figure_title: Exosomal GSTP1 activates the AKT-NF-κB signaling axis to promote M2
  polarization.
caption: Exosomal GSTP1 activates the AKT-NF-κB signaling axis to promote M2 polarization.
  (A) KEGG pathway analysis of differentially expressed genes from RNA-seq data of
  PMA-treated THP1 cells co-cultured with the indicated Huh7 cells. (B) Heatmap of
  the expression levels of the indicated genes from RNA-seq data of PMA-treated THP1
  cells co-cultured with the indicated Huh7 cells. (C) Time-course western blot analysis
  of p-AKT, p-p65, and p-IκBα in PMA-treated THP1 cells treated with exosomes derived
  from oeNC or oeGSTP1 HCC cells. (D) Western blot analysis of AKT and NF-κB signaling
  in THP1 cells treated with exosomes in the presence or absence of the AKT inhibitor
  MK-2206 (5 μM). (E) qPCR analysis of CD206, IL10, and TGFB1 in THP1 cells treated
  as in (D) (n = 3). (F) Western blot analysis of p65 signaling in THP1 cells treated
  with exosomes in the presence or absence of the IKK inhibitor BMS-345541 (1 μM).
  (G) qPCR analysis of CD206, IL10, and TGFB1 in THP1 cells treated as in (F) (n =
  3). (H) NF-κB luciferase reporter activity in THP1 cells overexpressing GSTP1, with
  or without BMS-345541 treatment. Differences were analyzed by Student's t-test or
  ANOVA. After ANOVA, Tukey's post-hoc test was used for multiple comparisons. Three
  biological replicates were performed for cell experiments. Data are presented as
  mean ± SD. Co-cult., co-culture with; EXO, exosomes. ns, not significant, *P < 0.05,
  ** P < 0.01, *** P < 0.001
