caption: 'Metabolite accumulation and gene expression associated with the phenylpropanoid
  pathway in E. purpurea leaves in response to biochar amendment. (a) Accumulation
  levels of key phenylpropanoid-related metabolites. (b) Expression of genes involving
  in phenylpropanoid pathway. (c) Correlation network between DAMs and DEGs. In a,
  the identified DAMs with increased level were categorized into three classes. In
  (c), red or blue edges represent positive or negative correlations, respectively.
  Abbreviations: CAD, cinnamyl alcohol dehydrogenase; COMT, caffeic acid O-methyltransferase;
  BG, beta-glucosidase; PAL, phenylalanine ammonia-lyase; POD, peroxidase; HCT, shikimate
  O-hydroxycinnamoyltransferase; CCR, cinnamoyl-CoA reductase. Solid arrows denote
  single-step enzymatically catalyzed direct metabolic reactions; dashed arrows denote
  the simplified representation of multiple consecutive metabolic reactions'
