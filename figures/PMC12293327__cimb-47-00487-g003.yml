figure_title: Central component of the SCFA molecular pathway.
caption: 'Central component of the SCFA molecular pathway. Note: (1) Impaired synthesis:
  A high-altitude environment suppresses the activity of short-chain fatty acid (SCFA)-producing
  bacteria, such as Firmicutes, resulting in reduced levels of butyric acid and propionic
  acid; (2) weakened barrier protection: SCFAs maintain the expression of tight junction
  proteins (e.g., ZO-1 and Claudin-1) via the GPR43 receptor. Their deficiency directly
  contributes to intestinal permeability and barrier dysfunction. (3) Immune-neural
  interaction disorder: Butyric acid inhibits the NF-κB signaling pathway, thereby
  reducing the secretion of the proinflammatory cytokines IL-6 and TNF-α. Propionic
  acid activates the GPR43 receptor in microglia, promoting M1-type polarization and
  contributing to neuroinflammation. (4) Uncontrolled HPA axis: SCFAs regulate the
  methylation of the CRH promoter through histone deacetylases (HDACs). Their insufficiency
  impairs cortisol feedback inhibition, leading to dysregulation of the hypothalamic-pituitary-adrenal
  (HPA) axis'
