figure_title: Top 20 KEGG pathways enriched among the predicted target genes of differentially
  expressed miRNAs in the AD group.
caption: Top 20 KEGG pathways enriched among the predicted target genes of differentially
  expressed miRNAs in the AD group. The analysis was performed using DIANA-miRPath
  v4.0 with the top 20 dysregulated miRNAs. The x-axis represents the −log10(FDR)
  value indicating statistical significance, while the number of associated target
  genes is displayed at the end of each bar. Pathways such as cell cycle, PI3K-Akt
  signaling, and MAPK signaling highlight potentially altered signaling cascades in
  AD pathogenesis
