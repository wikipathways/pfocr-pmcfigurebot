figure_title: Assembly and absorption pathways of botulinum neurotoxin complexes.
caption: 'Assembly and absorption pathways of botulinum neurotoxin complexes. (A)
  Two types of BoNT-encoding gene clusters can be distinguished depending on the presence
  of genes encoding either OrfXs/P47 (left panel) or HA (right panel) NAPs along with
  a gene encoding nontoxic non-hemagglutinin protein (NTNH). (B) BoNTs form interlocked
  complexes (M-PTCs) with NTNHs at acidic pH, protecting each other from a harsh proteolytic
  environment. Left panel: NTNH associates with OrfX2, after proteolysis of its N-terminal
  tubular lipid-binding (TULIP) domain (OrfX2-N), freeing the carboxy-terminal part
  of OrfX2 (OrfX2-C). Note that OrfX1 is also proteolyzed by digestive proteases,
  freeing the carboxy-terminal part of OrfX3. Right panel: HA proteins associate with
  NTNHs to form large hetero-dodecameric progenitor toxin complexes (L-PTCs). (C)
  In contrast to HA-type L-PTCs (right panel), the absorption pathway of OrfX-type
  BoNT remains to be characterized (left panel). Depending on the capacity of L-PTCs
  to interact with fucosylated mucins, L-PTCs first undergo transcytosis through enterocytes
  (L-PTC/BOkra) or M cells (L-PTC/A62A), which are covered by a thin mucus layer.
  Following transcytosis, HA-induced disruption of intercellular junctions facilitates
  the absorption of the luminal fraction of the toxin, enabling optimal systemic dissemination.
  The protein ribbons displayed in the figure correspond to full-length OrfX2 (PDB
  8FBF), M-PTC-OrfX2-C/E (PDB 9ARJ), OrfX1:OrfX3/E (PDB 8FBD), P47/E (PDB 5WIX) and
  L-PTC/B (PDB 9QCM)'
