figure_title: RNA-Seq analysis of Al-responsive genes in root tips of soybean.
caption: RNA-Seq analysis of Al-responsive genes in root tips of soybean. (A) Root
  growth performance. Bar = 2 cm. (B) Relative root growth. (C) Hematoxylin staining
  analysis. Bar = 0.5 mm. (D) Al concentration in root cell sap. (E) Al concentration
  in root tips. (F) Volcano plot of differentially expressed genes (DEGs) in soybean
  root tips. (G) KEGG pathway analysis of DEGs in soybean roots. (H) Gene Ontology
  (GO) analysis of DEGs in soybean roots. Root tips of the soybean with treated with
  0 (−Al) and 50 (+Al) μM AlCl3 for 24 h and used for RNA-seq analysis. Data are presented
  as mean ± standard error (SE) (n = 4). Asterisks denote significant differences
  between the +Al treatment and −Al control using Student’s t-test. ***, p < 0.001
