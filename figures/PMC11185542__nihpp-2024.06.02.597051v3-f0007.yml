figure_title: Summary of the role of MLEC in coronavirus replication
caption: A. CoV nsp2 homologs interact with MLEC when measured by protein expression
  in HEK293T cells. Knockdown of MLEC results in loss of infectious MHV production
  and SARS-CoV-2 replication.B. During MHV infection, MLEC loses many basal interactors
  while maintaining interactions with the OST complex. Nsp2 interacts with core components
  of the OST, including RPN1, STT3A, and DDOST.C. MLEC promotes biogenesis of CoV
  nsps and subsequent replicase formation. In addition, MLEC knockdown results in
  suppression of Spike glycopeptides, likely through the canonical role of MLEC in
  the glycoprotein quality control pathway
article_title: The glycoprotein quality control factor Malectin promotes coronavirus
  replication and viral protein biogenesis
