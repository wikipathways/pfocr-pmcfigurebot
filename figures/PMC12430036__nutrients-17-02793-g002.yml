figure_title: Pathway of polyphenol metabolism and absorption in the human intestine.
caption: Pathway of polyphenol metabolism and absorption in the human intestine. Polyphenols
  enter the small intestine in different concentrations depending on the consumed
  dose. At high concentrations, a local effect may be exerted in the gut by modulating
  its composition and protecting tissues from oxidative damage. While low concentrations
  can be more readily absorbed, contributing to systemic effects that are associated
  with a reduced risk of cardiovascular and neurodegenerative diseases, as suggested
  by some epidemiological and experimental studies. Unabsorbed polyphenols reach the
  colon, where the gut microbiota will ferment them into bioactive metabolites. These
  metabolites are transported via the portal vein to the liver to be processed by
  the hepatocytes and then released into systemic circulation. Through this pathway,
  they can help reduce oxidative stress and inflammation in various tissues
article_title: 'Unlocking Polyphenol Efficacy: The Role of Gut Microbiota in Modulating
  Bioavailability and Health Effects'
