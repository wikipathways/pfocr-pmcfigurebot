caption: (A) Panel A shows the septal surfaces of the right atrium and ventricle of
  an adult human heart having removed the parietal walls of the chambers. The specimen
  is transilluminated from the left side to show the locations of the oval fossa and
  the membranous septum. The dashed lines show the locations of the tendon of Todaro
  and the hinge of the septal leaflet of the tricuspid valve. As we will describe,
  these structures form the boundaries of the triangle established by Koch as providing
  the landmarks to the atrioventricular node (see Figure 2A). The double headed arrow
  shows the location of the septal isthmus, an area that will become significant when
  we discuss the substrates for atrioventricular re-entry tachycardia. (B) In panel
  B, careful dissection has revealed the location of the atrioventricular node within
  the walls of the triangle and shown its continuation as the right bundle branch.
  When using gross dissection, however, there is no certainty that the pathway demonstrated
  is the solitary pathway for atrioventricular conduction
