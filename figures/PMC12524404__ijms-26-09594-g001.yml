figure_title: Effects of testosterone on the liver.
caption: 'Effects of testosterone on the liver. Testosterone modulates all stages
  of metabolic dysfunction-associated steatohepatitis in a dose-dependent manner.
  The graph summarizes how natural androgen signaling protects the liver, whereas
  excessive use of anabolic-androgenic steroids can negate these benefits. The anti-steatotic
  pathway involves the activation of the androgen receptor (AR) by testosterone, which
  suppresses fat production (↓ SREBP-1c, FAS, ACC), promotes fatty-acid oxidation
  (↑ PPARα, CPT-1, AMPK), and enhances VLDL export (↑ MTTP, apoB), ultimately reducing
  triglyceride accumulation in the liver. In the anti-inflammatory pathway, testosterone
  decreases oxidative stress by activating Nrf2 to produce SOD, CAT, and GPx, inhibits
  NF-κB/TLR4 signaling, reduces recruitment of Kupffer cells and neutrophils, and
  lowers levels of pro-inflammatory cytokines (TNF-α, IL-6, IL-1β), thus preventing
  the progression to steatohepatitis. The anti-fibrotic pathway involves AR signaling
  in hepatic stellate cells, inhibiting activation and growth (↓ TGF-β1, p-Smad2/3,
  α-SMA, collagen I/III) while promoting matrix breakdown (↑ MMP-2/9, ↓ TIMP-1), which
  slows fibrosis development. Physiological testosterone levels protect the liver,
  whereas testosterone deficiency accelerates steatosis, inflammation, and fibrosis
  progression. Chronic high-dose anabolic-androgenic steroid (AAS) use can worsen
  these conditions. Abbreviations used: α-SMA, α-smooth muscle actin; ACC, acetyl-CoA
  carboxylase; AMPK, AMP-activated protein kinase; apoB, apolipoprotein B; CAT, catalase;
  CPT-1; carnitine palmitoyltransferase I; FAS, fatty acid synthetase; GPx, glutathione
  peroxidase; IL-1β, interleukin-1β; IL-6, interleukin 6; MMP, matrix metalloproteinase;
  MTTP, microsomal triglyceride transfer protein; NF-κB, nuclear factor ‘kappa-light-chain-enhancer’
  of activated B-cells; Nrf2, Nuclear factor erythroid 2-related factor 2; p-Smad2/3,
  phosphorylated Smad 2 and Smad3; PPARα, Peroxisome proliferator-activated receptor-α;
  SOD, superoxide dismutase; SREBP-1c, sterol regulatory element-binding protein-1c;
  TGF-β1, transforming growth factor-β1; TIMP-1, tissue inhibitor of metalloproteinases-1;
  TLR4, toll-like receptor 4; TNF-α, tumor necrosis factor-α; VLDL, very low density
  lipoprotein'
