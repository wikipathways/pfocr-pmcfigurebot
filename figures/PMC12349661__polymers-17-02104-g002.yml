figure_title: PHB metabolism in C.
caption: PHB metabolism in C. necator. Carbon is converted to pyruvate and acetyl-CoA.
  In nutrient-limiting conditions, acetyl-CoA is funneled to PHB formation instead
  of the TCA cycle. 3-hydroxybutyrate monomers are incorporated into the nascent polymer
  chain. The granule is surrounded by a proteinaceous layer formed by enzymes participating
  in PHB granule homeostasis. PHA synthase enzymes enable the polymer chain to grow,
  while PhaP molecules stabilize the granule, which can be expressed due to PhaR binding
  upstream of phaP1. PhaR dissociates as the granule surface saturates, its cytosolic
  concentration increasing and binding upstream of its own gene, autoregulating itself.
  Black arrows in the metabolic pathways indicate native enzymatic reactions. Dashed
  arrows indicate more than one reaction
article_title: Metabolic Engineering Strategies for Enhanced Polyhydroxyalkanoate
