figure_title: Main mechanisms contributing to endothelial dysfunction.
caption: Main mechanisms contributing to endothelial dysfunction. Elevated levels
  of LDL and endothelin-1 (ET-1) promote cellular oxidative stress by activating NADPH
  oxidase (NOX), leading to increased intracellular ROS. Hyperglycemia enhances the
  formation of O-linked N-acetylglucosamine (O-GlcNAc), which competes with eNOS for
  phosphorylation. In insulin-resistant states, mutations in the gene encoding insulin
  receptor substrate-1 (IRS-1) impair its ability to phosphorylate eNOS via the PI3K/Akt
  signaling pathway, resulting in reduced eNOS activation and NO production. Parts
  of the figure were drawn using pictures from Servier Medical Art. Servier Medical
  Art by Servier is licensed under a Creative Commons Attribution 4.0 unported license
