caption: In the absence of Wnt ligands, adenomatous polyposis coli (APC) participates
  in the multiprotein destruction complex, composed of APC, Axin, glycogen synthase
  kinase 3β (GSK3β), and casein kinase 1 (CK1). Within this complex, β-catenin is
  sequentially phosphorylated, recognized by the E3 ubiquitin ligase β-TrCP, polyubiquitinated,
  and subsequently degraded by the 26S proteasome, thereby preventing its nuclear
  accumulation. Upon Wnt ligand binding to Frizzled (FZD) receptors and the co-receptors
  low-density lipoprotein receptor-related proteins 5/6 (LRP5/6), the cytoplasmic
  protein Dishevelled (Dvl) is activated and sequesters Axin, resulting in disassembly
  of the destruction complex. Consequently, β-catenin is stabilized, accumulates in
  the cytoplasm, and translocates into the nucleus, where it associates with T-cell
  factor/lymphoid enhancer factor (TCF/LEF) transcription factors to drive expression
  of Wnt target genes. Loss or dysfunction of APC impairs the destruction complex,
  leading to constitutive activation of the Wnt/β-catenin signaling pathway and uncontrolled
  transcriptional activity
