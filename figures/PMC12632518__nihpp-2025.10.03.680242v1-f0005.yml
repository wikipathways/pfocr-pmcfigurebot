figure_title: Downstream analysis using imputed data
caption: '(a) Spatial niche analysis. Spatial plot of cells colored by cell type,
  Spatial plot of cells colored by spatial niche: tumor, myeloid, fibroblast, neutrophil,
  and lymphocyte. (b) Pseudotime and immune neighbor association among tumor niche
  cells. UMAP projections for tumor niche cells colored by the inferred pseudotime
  (ptime), Ridge density plots showing distribution of tumor niche cells along pseudotime,
  grouped based on their lymphocyte and myeloid cell neighbor proportion (none (0),
  low (>0–0.2), moderate (0.2–0.6), high (0.6–1.0)). (c) Immune neighborhood for tumor
  niche cells. Spatial plot of cells colored by proportion of lymphocyte in neighborhood
  (left) and proportion of myeloid in neighborhood (right) for tumor niche cells with
  immune cells of interest highlighted in red and other cells in gray. Representative
  fields of view (FOVs) for lymphocyte (FOVs 2, 13, 17) and myeloid (FOVs 2, 7, 19)
  neighbor proportions for tumor niche cells colored from high (yellow) to low (purple),
  immune cells in red, and other cells in grey. (d) Pathway enrichment comparisons.
  Scatter plots of pathway enrichment significance (–log10 adj p-value) detected using
  imputed versus raw expression data for lymphocyte (left two panels) and myeloid
  (right two panels): imputed original (only measured genes in raw data) versus raw
  (first column) and imputed all (both measured genes in raw data and newly imputed
  genes) versus raw (second column). Points in scatter plots denote pathways colored
  by annotation – Immune (red), Migration/Attachment (blue), Other (gray), and the
  dashed line indicates the y=x line'
