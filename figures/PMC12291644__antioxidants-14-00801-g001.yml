figure_title: Antioxidant and anti-inflammatory potential of camel and donkey milk.
caption: Antioxidant and anti-inflammatory potential of camel and donkey milk. This
  figure illustrates the comprehensive protective mechanism by which camel and donkey
  milk components counteract cellular damage caused by oxidative stress. Environmental
  stressors, pathogens, and toxicants enter the cell through toll-like receptor 4
  (TLR4) and activate myeloid differentiation factor 88 (MyD88) pathway, leading to
  the generation of reactive oxygen species (ROS). ROS production results in mitochondrial
  damage and triggers oxidative stress, which normally would lead to cellular dysfunction
  and apoptosis. Camel and donkey milk components intervene in this cascade by modulating
  key signaling pathways—specifically inhibiting nuclear factor kappa-light-chain-enhancer
  of activated B cells (NF-κB) signaling to reduce inflammation and regulating apoptotic
  signaling to promote anti-apoptotic responses. The activation of nuclear factor
  erythroid-2 related factor 2 (Nrf2) signaling leads to enhanced antioxidant responses,
  which suppress oxidative stress and consequent damage
